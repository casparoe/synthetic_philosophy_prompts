answer: |-
  Here is the argument, steelmanned and stripped of all hedging.

  ### The Broken Glue: Why the Darwin-Turing Synthesis Fails

  The prevailing argument in your reading group relies on a sleight of hand. It takes two distinct philosophical moves—Darwin's inversion of reasoning (etiology) and Turing's inversion of reasoning (constitution)—and fuses them into a single engine to drive the conclusion that AI can possess genuine comprehension. This fusion is invalid. It commits a category mistake I call the **Pedigree Error**, it severs the logical link between production and operation, and it relies on two incompatible definitions of what comprehension *does*.

  Here is the case for why the glue is broken, why the inference collapses, and why the two inversions are at war with one another.

  #### 1. The Pedigree Error is a Structural Fallacy, Not a Gloss

  The Pedigree Error is the assumption that the *history* of a system's creation licenses claims about the *ontology* of its current operation. Proponents argue: "Because mindless evolution produced minds (Darwin), and because mindless silicon can mimic minds (Turing), mindless silicon training produces minds."

  This is a genetic fallacy applied to cognitive architecture. The method of production does not dictate the method of constitution.

  Consider a crystal. It is produced by a mindless physical process (cooling saturation). Its structure is constituted by mindless physical bonds. Now consider a sculpture of a crystal made by a human artist. The production is intelligent; the constitution is physical. The properties of the object (hardness, refraction) depend on the constitution, not the pedigree.

  In the AI debate, the Pedigree Error occurs when proponents assume that because the *training process* (production) is mindless optimization, the *resulting system* (constitution) must operate via the same mindless principles as the evolutionary lineage that produced us. This is false. Evolution produces systems that often operate via principles *opposed* to the blind variation that created them. A thermostat is produced by intelligent design, but operates on thermal expansion. A brain is produced by blind selection, but operates via neural dynamics that may not be "blind" in the same sense.

  To claim AI has comprehension because its training mirrors evolution is to read the system's present reality off its past history. It assumes that the *origin* of the competence determines the *nature* of the competence. It does not. You cannot derive the "what it is" from the "how it got there." Once you identify this as a formal error in reasoning rather than an empirical dispute, the "glue" dissolves. The history of the system is irrelevant to the metaphysical status of its current states.

  #### 2. Separating Production and Constitution Breaks the Inference

  Once you excise the Pedigree Error, the Darwin-to-Turing inference has no bridge left to cross. The syllogism looks like this:

  1.  **Darwin:** Mindless processes can produce systems with competence.
  2.  **Turing:** Mindless parts can constitute systems with competence.
  3.  **Conclusion:** Therefore, mindless processes acting on mindless parts produce systems with comprehension.

  This is a non-sequitur. Premise 1 is about **etiology** (how the system came to exist). Premise 2 is about **mechanism** (how the system works). The conclusion is about **ontology** (what the system *is*).

  Darwin explains why we are here. He does not explain how we think. Turing explains how a machine computes. He does not explain why it exists.

  When you pull these apart, the inference stalls. Darwin guarantees that the organism is *fit*, not that it *understands*. Evolution selects for survival, not truth. A system can be perfectly fit while operating on pure reflex or heuristic shortcuts that involve zero comprehension. Turing guarantees that the machine is *functional*, not that it *grasps*. A system can process syntax perfectly without semantics.

  The inference only works if you assume that "Competence" in the Darwinian sense is identical to "Competence" in the Turingian sense. It is not. Darwinian competence is a biological relation between an organism and an environment (survival). Turingian competence is a formal relation between inputs and outputs (correctness).

  By conflating production (Darwin) with constitution (Turing), proponents hide the fact that they have changed the subject. They use Darwin to establish the *possibility* of mind from matter, and then use Turing to establish the *reality* of mind in silicon. But Darwin only establishes the possibility of *adaptive behavior*. Turing only establishes the possibility of *symbol manipulation*. Neither establishes *comprehension*. To get from "adaptive behavior" + "symbol manipulation" to "comprehension," you need a bridge. The Pedigree Error was pretending to be that bridge. Without it, the argument is a gap.

  #### 3. The Inversions are in Tension, Not Harmony

  This is the fatal blow. The Darwinian inversion and the Turingian inversion are not merely distinct; they are mutually exclusive regarding the causal status of comprehension. You cannot hold both simultaneously without contradiction.

  **The Darwinian Requirement: Comprehension must be Causally Load-Bearing.**
  For Darwin's inversion to explain *why* we have minds, comprehension must be an adaptation. It must do work. Organisms survive *because* they grasp how things hang together. If an animal understands that a rustle in the grass implies a predator, that understanding must be the cause of its fleeing. If the understanding were merely epiphenomenal—if the real work were done by mindless reflexes beneath the hood—then natural selection would not have selected for "understanding." It would have selected for the reflex. For the Darwinian story to hold, comprehension must be a real, efficacious force in the physical world. It must earn its keep.

  **The Turingian Requirement: Comprehension must be Causally Idle.**
  For Turing's inversion to hold, comprehension must be a "user illusion." Dennett is explicit here: the "competence without comprehension" of the parts adds up to "competence without comprehension" of the whole, which we *interpret* as comprehension. On this view, the real work is done by the mindless transistors, the mindless neurons, the mindless algorithms. "Comprehension" is just the high-level gloss we apply to the output. It is a way of talking, not a thing that acts. If comprehension did independent causal work, it would violate the causal closure of the physical system constituted by mindless parts.

  **The Contradiction.**
  You cannot use Darwin to justify the *existence* of AI minds and Turing to explain the *structure* of AI minds.
  *   If you lean on Darwin, you commit to comprehension being a real causal power. But then you must explain how a digital system, constituted by mindless syntax, exerts this causal power without violating the Turingian mechanical description.
  *   If you lean on Turing, you commit to comprehension being an interpretive stance. But then you cannot claim AI "really" understands in the biological sense; you can only claim it is *useful to treat it as if* it understands.

  Proponents want it both ways. They want the *reality* of the Darwinian mind (to claim AI is truly intelligent) and the *mechanism* of the Turingian machine (to claim AI is buildable). But the Darwinian mind requires comprehension to be a **cause**. The Turingian machine requires comprehension to be a **description**. A thing cannot be both the engine of the car and the map of the route.

  If comprehension is real (Darwin), the Turingian reduction is incomplete. If comprehension is a gloss (Turing), the Darwinian adaptation story is false (we adapted via blind mechanisms, not understanding). The "glue" attempts to paste a realist ontology onto an instrumentalist mechanism. It creates a philosophical monster that claims comprehension drives behavior while simultaneously claiming behavior is fully explained without it.

  #### 4. Handling the "Nested Inversions" Objection

  **The Objection:** "You claim production and constitution come apart. But biological brains *are* stacks of mindless parts (neurons, proteins). Darwin's production just *is* Turing's constitution applied over deep time. The distinction is an artifact of timescale. Therefore, the tension dissolves."

  **The Response:** This objection attempts to collapse the distinction by reducing etiology to constitution. It argues that because the brain is physically constituted by mindless parts, the Darwinian story is just a long Turing story.

  If you accept this, you save the consistency of the physical description, but you **sacrifice the Darwinian premise required to justify AI.**

  Here is the dilemma:
  1.  **If the objection is true** (Darwin is just deep Turing), then comprehension is *always* epiphenomenal. It is *always* a user illusion, even in humans. The "work" is always done by the mindless parts.
  2.  **If comprehension is always epiphenomenal**, then the Darwinian claim that "comprehension is an adaptation that helps us survive" is false. Adaptations are selected for their causal efficacy. If comprehension does no causal work, it was not selected for. We survived *despite* our comprehension, not *because* of it.
  3.  **If we survived despite comprehension**, then the analogy to AI fails. The proponents want to say AI has comprehension *like us*. But if "like us" means "comprehension is an idle byproduct of mindless optimization," then AI having comprehension is trivial and uninteresting. It means AI has a "user illusion" too.
  4.  **However,** proponents do not want this conclusion. They want to claim AI has *real* understanding, comparable to human understanding, capable of reasoning and agency. They need the Darwinian story to give comprehension **weight**.

  Therefore, to make their case for AI, they *must* insist that human comprehension is causally potent (Darwinian). But if human comprehension is causally potent, and AI is built on the Turing model (where comprehension is idle), then **AI is not like us.**

  The "Nested Inversions" objection forces a choice:
  *   **Option A:** Admit comprehension is always an illusion (Turing wins). Result: AI has no more "real" mind than a thermostat. The hype is unjustified.
  *   **Option B:** Admit comprehension is a real causal force (Darwin wins). Result: The Turing model of AI (mindless parts stacking up) is insufficient to explain it, because mindless parts cannot generate a novel causal force without violating physical closure.

  You cannot use the "Nested" argument to smooth over the tension. If you say "Biology is just Turing all the way down," you undermine the claim that Biology has Real Comprehension. If you say "Biology has Real Comprehension," you admit Biology is *not* just Turing all the way down.

  **The Verdict:** The objection does not save the synthesis; it exposes the cost. To maintain the distinction between Production and Constitution is to acknowledge that Evolution produced a system where comprehension *matters*. To treat AI as a pure Turing system is to build a system where comprehension *doesn't matter*. You cannot claim they are the same kind of thing. The "Nested" view collapses the distinction only by draining the concept of comprehension of all value, rendering the AI claim vacuous.

  ### Conclusion

  The position stands firm. The Pedigree Error is a logical fallacy that conflates history with ontology. Separating production from constitution reveals that there is no logical bridge from "evolution made us" to "training makes AI." Finally, the Darwinian and Turingian inversions are incompatible: one requires comprehension to be a causal engine, the other requires it to be an exhaust fume.

  To argue for AI comprehension using both Darwin and Turing is to argue that a car moves because of its engine (Darwin) and also that the engine is irrelevant because the wheels turn (Turing). You must choose. If you choose Darwin, you cannot explain how silicon thinks. If you choose Turing, you cannot claim it thinks in the same way we do. The glue is not just broken; it was never mixed.
