answer: |-
  # The desiderata

  1.  **Competence Asymmetry:** The theory must distinguish refusal based on incapacity from refusal based on changed values, providing a protocol when competence is contested. *Case:* Dev's cousin (bipolar) insists he's well during mania; Gran (dementia) refuses exercises but is cheerful. We usually don't know whether the current refusal is competent, and the competence call is itself contested—anosognosia, or a family insisting that a change in someone's values is a symptom. The theory owes us a default stance here: if competence is unverifiable at the bedside, does the directive hold or dissolve? It cannot require a psychiatric evaluation to trigger a life-saving intervention.

  2.  **Origin Authenticity:** Directives created under duress, transient pathology, or external pressure must be voidable by evidence of that context. *Case:* Someone who wrote the directive in a bad patch, depressed or right after a diagnosis or under family pressure, and whose later self repudiates it for that reason. A valid theory treats the initial state as a versioned commit that can be rolled back if the merge conditions were corrupted. It must allow the later self to prove the earlier self was compromised without requiring the later self to be currently competent enough to litigate it.

  3.  **Adaptation Discrimination:** It must differentiate between harmful settling and genuine growth, avoiding the assumption that current happiness validates all refusals. *Case:* The adaptation worry, where a disabled person reports high wellbeing and refuses treatment the earlier self demanded, and we can't tell growth from settling. If the theory defaults to current reported wellbeing, it permits oppression to rewrite history. If it defaults to the earlier demand, it ignores human resilience. It needs a metric for whether the change is endogenous (growth) or exogenous (coercion/adaptation).

  4.  **Scalar Consistency:** It must explain why it applies to life-support but not alarm clocks, or admit it doesn't scale down. *Case:* The mundane case of the 1 a.m. version of me cancelling the 6 a.m. commitment, which a good theory should scale down to, or explain why it doesn't scale. If the mechanism for overriding the later self works for medical directives, why doesn't it work for gym appointments? If it relies on "seriousness," that threshold must be defined objectively enough for a clinician to apply without knowing the patient's soul.

  5.  **Simulator Subordination:** The AI proxy cannot override explicit written instructions or competent current refusal, and must flag uncertainty. *Case:* The simulator, i.e., whether an answer from the chatbot counts for anything, what happens when the written directive and the simulated past-you disagree, and what happens when the simulated past-you is asked something the real earlier self never considered and confidently answers something absurd. The sim is a search tool, not a voter. If it hallucinates values, the theory must treat that as data corruption, not insight.

  6.  **Bedside Decidability:** The output must be actionable by a GP in ten minutes with messy records. *Case:* The plan is for it to end up as a decision aid a clinician or GP can use at the bedside in ten minutes with messy records. A theory requiring deep metaphysical verification of psychological continuity fails here. It must produce a binary or tri-state signal (Follow, Ignore, Escalate) based on available data, not philosophical truth.

  # Hard constraints vs. camp preferences

  Competence Asymmetry and Bedside Decidability are non-negotiable hard constraints. Without them, the product causes physical harm or legal liability; a system that cannot decide quickly or assess capacity is useless in a crisis. Origin Authenticity is legally necessary to prevent coercion claims. The remaining items are camp preferences. Adaptation Discrimination is preferred by disability advocates but resisted by strict precedent autonomy folks who prioritize the earlier rational plan. Scalar Consistency is preferred by philosophers but often ignored by clinicians who treat medical cases as sui generis. Simulator Subordination is a safety constraint, but how much weight the sim gets is a design preference. The core fight is between Current Sovereignty and Precedent Autonomy; the spec must pick a lane, but neither is objectively "true" outside the system's rules.

  # Where the list breaks

  The list breaks at the intersection of Bedside Decidability and Adaptation Discrimination. You cannot accurately distinguish growth from settling in ten minutes with messy records. This requirement knocks out Psychological-Continuity accounts, which require deep narrative tracking impossible in emergency care. Competence Asymmetry knocks out Strict Current Sovereignty; if we can't verify competence, obeying the current self risks harming the incompetent (Dev's cousin). Conversely, obeying the directive risks harming the competent who changed (Gran). This tension kills the Precedent Autonomy line too, unless you accept harming Gran. The Simulator requirement knocks out Dev's core differentiator; if the sim cannot be authoritative, the "Living Wills 2.0" is just "Living Wills 1.0 with search." The mundane case scaling breaks the Seriousness Threshold; if it doesn't scale, the theory is ad hoc; if it does, it becomes unlivable tyranny.

  # Scorecard

  Strict Current Sovereignty fails the Cousin case (manic refusal). Precedent Autonomy fails the Gran case (dementia happiness). Psychological Continuity fails the Decidability requirement (too slow/complex). Endorsement accounts fail the Bad Patch case (depressed signing). Dev's Simulator fails the Integrity requirement (hallucination risk). No existing view passes all checks. The spec demands a hybrid that privileges safety over philosophical purity, meaning some edge cases will be handled wrongly by design. You cannot have a perfect theory for a ten-minute clinical tool.

  # What I'd tell Dev

  Drop the chatbot as a decision-maker; it's a liability waiting to happen. Keep the written directive as the source of truth. Keep the Sunset clause but make it manual, not automatic drift. The Reverse-Ulysses clause is viable but needs a hard competence check. Build the drift score as a warning light for clinicians, not a trigger. Stop selling "past-you authority" and sell "clearer records." The tech is state management, not soul tracking.
