      *   *Refinement on Disagreement:* Ensure the distinction regarding "feedback-rich systems with non-modular architectures" is clear. ITs usually require modularity for the $do$-operator to make sense. CTs might argue counterfactuals survive even if modularity fails.
      *   *Refinement on Cruxes:* Make sure the predictions are distinct.
