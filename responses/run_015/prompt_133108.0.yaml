      *   **Tone:** Formal, dispassionate, academic philosophy-of-science register.
      *   **Constraints:** No citations, bibliographies, or requests for further reading.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Lewisian Counterfactual Theorist (CT):** Causation is grounded in counterfactual dependence between distinct events. Relies on similarity metrics between possible worlds. Handles preemption/overdetermination via quasi-dependence or chains of dependence. Often struggles with symmetric overdetermination or backtracking but prioritizes the intuitive truth conditions of counterfactuals.
      *   **Pearlian Interventionist Theorist (IT):** Causation is defined by invariance under intervention ($do$-operator). Relies on Structural Causal Models (SCMs), DAGs (usually), and modularity. Causation is about what happens when you wiggle a variable. Struggles with cyclic graphs (feedback loops) without modification, and "impossible" interventions. Prioritizes identification and estimation from data.

  3.  **Drafting Section 1: Shared Commitments:**
      *   *Goal:* Find common ground. Both agree causation isn't just correlation. Both love formalism (logic vs. graphs). Both agree on testability (though methods differ).
      *   *Drafting points:*
          1.  Causal vs. Correlational: Both reject reduction of causation to mere statistical association.
          2.  Formal Representation: Both agree natural language is too ambiguous; formal tools (possible worlds semantics vs. structural equations) are necessary.
          3.  Empirical Testability: Causal claims must have empirical consequences (observations or interventions), not just metaphysical speculation.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Pinpoint the specific divergence requested: Explanatory asymmetry/directionality in complex/feedback systems.
      *   *CT View:* Counterfactuals are fundamental. Even if interventions are ill-defined (e.g., big bang, physics constraints), counterfactual truth conditions hold. Asymmetry comes from the asymmetry of overdetermination or temporal/semantic constraints on similarity.
      *   *IT View:* Interventions are fundamental. If you can't define a valid $do$-operator (modularity breaks), the causal claim is ill-posed. Asymmetry comes from the direction of information flow in the structural equations.
      *   *Wording:* Needs to be neutral but accurate to both.

  5.  **Drafting Section 3: Three Cruxes:**
      *   *Crux 1: Preemption in Cyclic Graphs.*
          *   *Case:* A feedback loop where one cause preempts another within the loop.
          *   *CT Prediction:* Counterfactual analysis can resolve it by looking at closest worlds where the preempted cause is absent, even if the loop makes intervention tricky.
          *   *IT Prediction:* Without breaking the cycle via intervention, the causal structure is unidentified; the model is invalid until modularized.
      *   *Crux 2: Physically Impossible Interventions.*
          *   *Case:* "What if the speed of light were slower?" or macroscopic variables that cannot be manipulated independently.
          *   *CT Prediction:* Meaningful counterfactuals exist even if no physical intervention is possible (truth conditions rely on world similarity, not manipulability).
          *   *IT Prediction:* If an intervention is physically impossible (violates model constraints), the causal claim is meaningless or requires model expansion.
      *   *Crux 3: Model Selection/Underdetermination.*
          *   *Case:* Observational + Interventional data fits two distinct structures (e.g., latent confounding vs. direct causation).
          *   *CT Prediction:* Background knowledge of counterfactual robustness selects the model.
          *   *IT Prediction:* Equivalence classes remain until further distinct interventions are found; causal claims are relative to the model set.

  6.  **Drafting Section 4: Conclusion (Verbal vs. Substantive):**
      *   *Goal:* Assess if they are talking past each other.
      *   *Analysis:* Often, CTs focus on *truth conditions* of causal sentences, while ITs focus on *epistemic access* and *inference*. However, the prompt asks about the *nature* of causation in complex systems.
      *   *Verdict:* Likely substantive regarding the metaphysics of non-modular systems, but verbal regarding the definition of "causation" (dependence vs. manipulability). We need to strike a balance. Let's argue it is *partially* verbal (definitions) but *substantively* residual regarding the ontology of non-manipulable dependencies.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it dry and academic? Yes.
      *   *Check Constraints:* No citations? Yes. Numbered sections? Yes. Table format? Yes.
      *   *Check Content:* Did I cover the Lewisian/Pearlian specific nuances?
