  # JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT
  **Subject:** Temporal Anomalies in Phenomenal Report (Color Phi & Related Phenomena)
  **Parties:** [Realist/Empiricist Position] & [Dissolutionist/Functionalist Position]
  **Date:** [Current Date]

  ## 1. AGREED CLAIMS

  1.  **Behavioral Data:** In the standard Color Phi protocol, subjects will reliably report a single moving object that changes color mid-trajectory, despite the physical stimulus consisting of two stationary flashes at distinct locations and times.
  2.  **Neural Necessity:** Any complete explanation of this phenomenon must specify the causal sequence of neural events, including the latency of early visual processing, the integration window for apparent motion, and the timing of memory encoding.
  3.  **Limits of Introspection:** First-person report cannot be taken as a direct, infallible timestamp of the onset of conscious content. Report latency and reconstruction processes intervene between the putative experience and the verbal output.
  4.  **Functional Requirement:** For a content to count as "experienced," it must be available for downstream cognitive effects (e.g., memory, report, motor response). A neural event that leaves no trace in behavior or memory is not, by our shared definition, a conscious experience.
  5.  **Mechanism of Postdiction:** Both sides agree that the brain utilizes information arriving *later* in time to construct the content of an event perceived as occurring *earlier*. We agree this is a descriptive fact of neural processing (postdiction).
  6.  **Status of the Dichotomy:** We agree that the "Orwellian" (memory revision) vs. "Stalinesque" (perceptual revision) distinction maps onto two distinct causal hypotheses:
      *   *Hypothesis A:* Content $C_1$ reaches a conscious stage, then is overwritten by $C_2$.
      *   *Hypothesis B:* Content $C_1$ is processed but never reaches a conscious stage; only the constructed $C_2$ becomes conscious.
      *   *Agreement:* We disagree on whether the available evidence (or even ideal evidence) can distinguish A from B, not on what A and B physically entail.
  7.  **The "Third Option":** We agree that "no revision, just construction" is the most accurate description of the neural mechanism. We disagree on whether this description renders the Orwellian/Stalinesque distinction obsolete (Dissolutionist view) or simply identifies the Stalinesque option as the correct empirical winner (Realist view).

  ## 2. RESIDUAL DISAGREEMENTS

  | Crux | Realist / Empiricist Position | Dissolutionist / Functionalist Position | Concrete Test / Case | Realist Prediction | Dissolutionist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(a) Interrupted Display / Masking** | There is a fact of the matter about what was experienced *before* the revision. If we interrupt the process, we can isolate the "unrevised" state. | There is no "unrevised state." Interrupting the process simply creates a new stimulus condition that generates a different construction. There is no hidden intermediate experience to uncover. | **Probe:** Flash Green, mask immediately, omit Red. Ask for color report. Measure response time and confidence. | On some trials, subjects will report "Green" with high confidence before the motion construction completes. This proves the initial content was conscious before revision. | Subjects will report "Green" only because the motion construction failed. Confidence will correlate with the completeness of the construction, not the timing of a "raw" experience. No subset of trials reveals a pre-revision conscious state. |
  | **(b) Neural Decoding (V1/V4)** | If we can decode "Red" from visual cortex at $t_1$ (before the Red flash physically arrives/is integrated), the subject experienced Red at $t_1$. Neural content *is* the substrate of experience. | Decoding "Red" from V1 only shows feature registration, not conscious experience. Calibrating the decoder against report begs the question (assuming report = experience). | **Probe:** Train decoder on static Red/Green. Apply to Phi paradigm. Compare decoder output timing to report timing. | Decoder will show "Red" content emerging before the subject can report motion. This timestamp settles the "when" of experience. | Decoder activity is sub-personal. The "when" of experience is determined by global availability (ignition), not local coding. Decoder timing will not align with report timing in a way that validates the "mid-path change" timeline. |
  | **(c) Generalization (Pain/Cutaneous Rabbit)** | The logic holds across modalities. If physiological markers indicate pain (or touch) at $t_1$, but report says "none" at $t_2$, experience occurred at $t_1$ and was forgotten/modified. | Pain and touch are judgments. Physiological signs without report are nociception/sensation, not pain/experience. The "Cutaneous Rabbit" is a construction, not a displacement of experience. | **Case:** Surgical procedure with paralysis. High physiological pain markers (HR, cortisol). Post-op report: "No pain." | The patient *felt* pain during the procedure but cannot access the memory. The experience existed without the report. | The patient did not feel pain. Pain requires the cognitive capacity to suffer/report. Physiological markers indicate stress, not phenomenal experience. |

  ## 3. ANALYSIS OF VERBAL DISPUTE

  **Is this merely verbal?**
  **Verdict:** Partially, but with substantive consequences.

  **Why it is verbal:**
  The dispute turns on the definition of "experience."
  *   If "experience" is defined as **global functional availability** (access consciousness), the Dissolutionist is correct: the "mid-path change" is the only content that ever becomes available, making the Stalinesque/Orwellian distinction empty. There was never a moment where the "wrong" content was available to the self.
  *   If "experience" is defined as **specific neural representation** (phenomenal consciousness independent of access), the Realist is correct: the brain represents "Green" then "Red/Motion," and we can ask which representation was "lit up" phenomenally.

  Both sides agree on the causal chain (Green flash $\rightarrow$ processing $\rightarrow$ Red flash $\rightarrow$ integration $\rightarrow$ Report). They disagree on where to place the label "Conscious" on that chain. If the causal chain is identical, the argument is verbal.

  **Why it is substantive:**
  The argument is not *merely* verbal because the definitions dictate experimental design and interpretation of edge cases.
  1.  **Experimental Design:** The Realist will fund experiments looking for the "moment of awareness" (e.g., precise masking, neural decoding). The Dissolutionist will fund experiments looking for the "conditions of report" (e.g., criterion shifts, decision boundaries). These yield different data.
  2.  **Ethical/Medical Consequences:** As seen in Crux (c) (Pain), the verbal definition determines clinical reality. If "experience" requires report/availability, an unreported pain state is not pain. If "experience" tracks neural nociception, unreported pain is still pain and requires treatment.
  3.  **Theory of Mind:** The Realist position preserves a distinction between "what I experienced" and "what I remember experiencing." The Dissolutionist position collapses this, asserting "what I remember experiencing" is the only coherent definition of "what I experienced."

  **Conclusion:**
  The disagreement is verbal regarding the *labeling* of the completed causal chain, but substantive regarding the *search strategy* for incomplete chains and the *ethical status* of unreported states. We agree to proceed by treating the "fact of the matter" as an empirical variable: if we can isolate a neural signature that predicts report *and* survives masking, the Realist wins. If all signatures dissolve under masking or correlate only with final report, the Dissolutionist wins.
