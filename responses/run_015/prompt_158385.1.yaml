  *   *Adjustment:* Claim 5 should be "We agree postdiction is the mechanism; we disagree on whether calling it Stalinesque/Orwellian adds explanatory power."

  Let's build the document.

  *   *Header:* JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT.
