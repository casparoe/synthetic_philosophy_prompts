answer: |-
  You have identified a genuine and documented friction point in the study of expertise, though it rarely has a single name because it straddles cognitive psychology, pedagogy, and philosophy of action.

  The "shape" you are looking for is the distinction between **Descriptive Accuracy** (does this statement match the world?) and **Operational Validity** (does this statement produce the desired state in the actor?).

  In your examples, these two metrics are not just uncorrelated; they are often inversely related during skill acquisition. There is a concept for this mismatch, often discussed under the umbrella of **Instrumentalism** in philosophy or **Cognitive Scaffolding** in education, but neither fully captures the specific "false-but-load-bearing" mechanic you described.

  Here is the carving you asked for.

  ### The Core Concept: Operational Fiction

  The phenomenon is best described as **Operational Fiction**.

  An Operational Fiction is a propositional statement or procedural step that is factually incorrect regarding the system state (Descriptive Accuracy = Low) but functionally necessary for the operator to achieve the correct cognitive or physical state (Operational Validity = High).

  This is not "tacit knowledge" (which implies the knowledge *cannot* be articulated). This is **articulated knowledge that serves a non-descriptive function.** It looks like a description of the machine, but it is actually a description of the *human-machine interface*.

  #### Why the Runbook Works (The Useful Falsehood)
  The "drain connections" step is a **Pacing Mechanism**.
  Novice engineers lack the internal rhythm of the deployment process. They move too fast or lack checkpoints. The obsolete step forces a pause. It creates a "commit point" where the brain can switch contexts from *preparation* to *verification*.
  *   **The Lie:** "This step changes the system state."
  *   **The Truth:** "This step changes the *operator's* state."
  *   **Why removing it fails:** You remove the scaffold. The novice loses the rhythm, rushes the flag flip, and misses the verification window.
  *   **Why telling veterans the truth fails:** It removes the ritual. Rituals induce a specific cognitive frame (seriousness, caution). Once they know it's a no-op, the frame collapses, and they revert to novice haste.

  #### Why the Expert Guide Fails (The Inert Truth)
  The expert's written procedure is a **Retrospective Rationalization**.
  Experts operate on intuition and pattern recognition (high-dimensional data). When asked to write it down, they compress this intuition into low-dimensional steps. These steps are factually true but lack the *contextual cues* that trigger the action.
  *   **The Truth:** "This describes the logical flow of the debug."
  *   **The Lie (by omission):** "This implies the flow is linear and context-free."
  *   **Why it fails:** It describes the *terrain* without the *compass*. A novice needs the compass (heuristics, "if X feels sticky, check Y"), not just the map. The expert has internalized the compass; they cannot see that they are no longer using the map.

  #### The Unification
  The "One Thing" connecting all three cases is **Attentional Guidance**.
  1.  **Runbook:** The false step guides attention by forcing a pause.
  2.  **Expert Guide:** The true steps fail because they do not guide attention to *where* the risk lies, only *what* the steps are.
  3.  **Code Review:** Your intuition is a highly trained attentional filter. You aren't analyzing the text; you are sensing the *intent* behind the text. You cannot write a rule because the rule isn't in the syntax; it's in the deviation from expected patterns of intent.

  ### The Philosophical Carving: Knowing-How vs. Knowing-That

  You asked if this bears on the **Knowing-How vs. Knowing-That** debate (Intellectualism vs. Anti-Intellectualism).

  It strongly supports the **Anti-Intellectualist** position (associated with Gilbert Ryle).
  *   **Intellectualism** argues that Knowing-How is just a species of Knowing-That (to know how to deploy is to know the true propositions about deploying).
  *   **Your Evidence:** If Knowing-How were just true propositions, the *true* runbook should outperform the *false* one. It does not. Therefore, Knowing-How relies on something other than the truth-value of the propositions guiding it. It relies on the *causal efficacy* of the instruction on the actor's behavior.

  The mismatch you see is the gap between **Propositional Knowledge** (facts about the world) and **Procedural Knowledge** (states of the actor).
  *   **Descriptive Accuracy** measures fidelity to the World.
  *   **Operational Validity** measures fidelity to the Actor.
  *   **Competence** requires fidelity to the Actor.

  ### Boundaries: What This Is Not

  To carve this out cleanly, we must distinguish Operational Fiction from similar concepts.

  **1. It is not a Placebo.**
  *   *Placebo:* Requires *belief* in the falsehood to work. If the patient knows it's sugar, the effect vanishes.
  *   *Operational Fiction:* Does not require belief. The engineers *know* the flag flip drains connections (you told them). It works anyway because the *action* of the step provides the scaffolding, regardless of their belief in its mechanical necessity. It is structural, not psychological.

  **2. It is not a Simplification (or "Lie to Children").**
  *   *Simplification:* "Electrons orbit the nucleus like planets." This is an approximation of reality intended to be updated later.
  *   *Operational Fiction:* "Drain connections before flipping." This is not an approximation of the system; it is a fiction about the system that serves a function unrelated to the system's mechanics. It is not meant to be "updated" to the truth without changing the procedure.

  **3. It is not a Mnemonic.**
  *   *Mnemonic:* "ROYGBIV." Helps you *recall* information.
  *   *Operational Fiction:* Helps you *execute* a state change. It alters the timing and rhythm of the work, not just the memory of it.

  **4. It is not Cargo Culting.**
  *   *Cargo Cult:* Performing a ritual with no causal link, hoping for a result, without understanding.
  *   *Operational Fiction:* Performing a ritual with a *psychological* causal link, knowing the result, to ensure the correct mental state.

  ### The Term: "Procedural Affordance"

  If you need a label for the property that the false step possesses and the true guide lacks, call it **Procedural Affordance**.

  *   **Descriptive Truth:** Does the text match the system?
  *   **Procedural Affordance:** Does the text invite the correct action at the correct time?

  The runbook step has high Procedural Affordance (it invites a pause/check) but low Descriptive Truth.
  The expert guide has high Descriptive Truth but low Procedural Affordance (it assumes the user already knows when to pause).
  Your code review intuition is pure Procedural Affordance (you perceive the action required without needing a description).

  ### Summary

  The mismatch is between **Correspondence** (truth) and **Coherence** (function).
  You are observing that in skill transmission, **Coherence is the primary vector, and Correspondence is secondary.**

  When you remove the false step, you optimize for Correspondence and degrade Coherence.
  When the expert writes the guide, they optimize for Correspondence and ignore Coherence.
  When you review code, you are reading Coherence directly.

  The "One Thing" is that **competence is a property of the interaction, not the information.** A description that accurately models the system may fail to model the *interaction*. A description that falsely models the system may successfully model the *interaction*.

  You are not managing knowledge transfer; you are managing **state transfer**. The false step is a state-transition operator for the human, not the machine. That is why it is load-bearing.
