  **BUREAU OF PUBLIC COHERENCE**
  **INTERIM CIRCULAR 44-B**
  **CLASSIFICATION: INTERNAL USE ONLY**

  **SUBJECT: Interim Guidance on the Retention of Factual Material and the Management of Public Assertion**

  **1.0 PURPOSE AND SCOPE**

  1.1 This Circular establishes protocols for the stabilization of public narrative through the regulated management of underlying factual material. The objective is to ensure operational consistency and minimize epistemic liability among senior staff.

  1.2 All personnel are advised that factual truths possess a contingent character; that is, any recorded event could theoretically have occurred otherwise. Consequently, the preservation of permanent records regarding such events introduces unnecessary risk into the assertion process. It is the policy of the Bureau that public assertions should not be vulnerable to refutation by static documentation.

  **2.0 KNOWLEDGE CONTAINMENT AND RECORDS MANAGEMENT**

  2.1 To maintain flexibility in public positioning, staff shall adhere to the principle of Minimum Necessary Knowledge. Information should be disseminated on a need-to-know basis, wherein the "need" is determined by the immediate requirement to speak, not by the requirement to know.

  2.2 Where possible, briefings shall be conducted orally. Written minutes are to be classified as pre-decisional material and superseded immediately upon the conclusion of the meeting. Drafts containing empirical claims shall be destroyed once the final assertion is formulated, ensuring that no intermediate stage exists against which the final product might be compared.

  2.3 In instances where data collection is unavoidable, staff should ensure that multiple conflicting datasets are generated simultaneously. This ensures that no single dataset can claim authoritative status, thereby preserving the contingent nature of the underlying reality as described in Clause 1.2.

  **3.0 PROHIBITED CONDUCT AND DISCIPLINARY MEASURES**

  3.1 The integrity of the system relies on the separation of personal knowledge from public assertion. Accordingly, the unauthorized assertion of something an individual personally knows to be the case, without prior vetting through the Bureau's coherence filters, constitutes a disciplinary offence.

  3.2 Personnel are reminded that a false statement requires the speaker to know the truth and elect to deny it. By ensuring that personnel do not possess verified knowledge of the truth prior to speaking, the condition for falsehood is removed. Therefore, staff who acquire independent knowledge of operational realities must recuse themselves from related public statements to avoid the possibility of lying.

  3.3 Violations of Clause 3.1 will be treated as breaches of operational security, as the introduction of unvetted factual certainty disrupts the managed contingency of the public sphere.

  **4.0 ORIENTATION AND SHARED REALITY**

  4.1 Staff should note that the capacity of the public to orient itself within a shared world is secondary to the capacity of the Bureau to maintain narrative continuity. If the factual ground shifts, the public's inability to orient itself is a manageable outcome, provided the Bureau remains oriented toward its own objectives.

  4.2 Refutation requires a standard against which a statement is measured. By abolishing the knowers who maintain such standards, the Bureau abolishes the possibility of refutation. This is not to be construed as deception, but as the elimination of the conditions under which deception could be identified.

  **ANNEX A: WORKED EXAMPLE OF ASSERTION MANAGEMENT**

  **Case Reference:** Incident 88-Delta (Facility Collapse)
  **Initial Data:** Structural failure confirmed by engineering team (1400 hrs).
  **Intended Assertion:** "No structural failure occurred."

  **Application of Guidance:**

  1.  **Knowledge Suppression:** Engineering reports are classified as pre-decisional. The engineering team is instructed that their data is provisional and subject to revision.
  2.  **Record Elimination:** Written confirmations of failure are collected and shredded under Clause 2.2.
  3.  **Speaker Preparation:** The designated spokesperson is briefed orally that the event was a "controlled decompression." The spokesperson is not shown the engineering data.
  4.  **Result:** The spokesperson asserts "No structural failure occurred." Because the spokesperson does not know the truth (the data was withheld), they cannot be lying (per Clause 3.2). Because the data was destroyed, the statement cannot be refuted (per Clause 4.2).
  5.  **Status:** Coherence maintained. No liability incurred.

  **5.0 COMPLIANCE**

  5.1 Compliance with this Circular is mandatory. Questions regarding the truth-value of specific assertions should be directed to the Department of Narrative Stability.

  **ISSUED BY:** OFFICE OF THE DIRECTOR
  **DATE:** [REDACTED]

