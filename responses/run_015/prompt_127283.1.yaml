      *   **Requirements for Each Thesis:**
          *   Classification (Trivial logical point? Methodological rule? Domain heuristic? Stronger claim blocking updating?).
          *   Applicability (Does it apply when the absence is *predicted* by the conspiracy?).
          *   Support for Friend (Does adopting this reading actually save the friend's view or collapse it?).
      *   **Constraints:** No bibliographies, citations, or reading lists. Only conceptual anatomy.

  2.  **Deconstruct the Slogan ("Absence of Evidence is Not Evidence of Absence"):**
      *   *Literal/Logical Meaning:* If I haven't seen $X$, it doesn't logically prove $\neg X$. (Valid).
      *   *Probabilistic/Bayesian Meaning:* If $P(E|H) < P(E|\neg H)$, then $\neg E$ lowers the probability of $H$. But if $P(E|H) \approx P(E|\neg H)$, then $\neg E$ doesn't change much.
      *   *Conspiracy Context:* The theory often posits *why* evidence is absent (suppression). This changes the conditional probabilities.

  3.  **Drafting the Menu Items (Iterative Process):**

      *   *Thesis 1: The Logical Truism.*
          *   Idea: You can't deduce non-existence from non-observation alone without auxiliary assumptions.
          *   Classification: Trivial logical point about non-contradiction/entailment.
          *   Applicability: Always true logically, but weak epistemically.
          *   Support for Friend: Technically supports him, but trivially. Doesn't justify *high* confidence, just prevents logical disproof.
          *   *Refinement:* Call it "The Logical Non-Entailment Thesis."

      *   *Thesis 2: The Burden of Proof Shield.*
          *   Idea: The skeptic must prove the audits *didn't* exist; the believer just needs to say "you haven't proven they didn't."
          *   Classification: Methodological rule about burden of proof.
          *   Applicability: Shifts the onus.
          *   Support for Friend: Helps him avoid losing the debate, but doesn't make his positive claim rational.
          *   *Refinement:* Call it "The Asymmetric Burden Thesis."

      *   *Thesis 3: The Concealment Heuristic.*
          *   Idea: In *this specific context* (regulatory bodies), absence is expected because they hide things. Therefore, absence isn't evidence against the theory because the theory predicts absence.
          *   Classification: Domain-specific heuristic about concealment likelihood.
          *   Applicability: This is the crux. If the theory predicts absence, then absence confirms the theory (or at least doesn't disconfirm it).
          *   Support for Friend: This is likely what he *means*. It makes the absence neutral or even supportive.
          *   *Risk:* If *any* absence is explained by concealment, it becomes unfalsifiable.
          *   *Refinement:* Call it "The Predictive Concealment Thesis."

      *   *Thesis 4: The Epistemic Immunity (Self-Sealing).*
          *   Idea: No possible observation could count against the theory.
          *   Classification: Stronger claim blocking evidential updating.
          *   Applicability: Makes the theory a closed loop.
          *   Support for Friend: "Saves" the view from falsification but kills its status as a rational belief.
          *   *Refinement:* Call it "The Unfalsifiability Thesis."

      *   *Thesis 5: The Search Effort Distinction.*
          *   Idea: Absence of evidence is only evidence of absence if a *thorough* search was conducted. Maybe the search wasn't thorough enough.
          *   Classification: Methodological rule about search completeness.
          *   Applicability: Did we look hard enough?
          *   Support for Friend: Allows him to claim the search was compromised.
          *   *Refinement:* Call it "The Incomplete Search Thesis."

  4.  **Review and Refine against Constraints:**
