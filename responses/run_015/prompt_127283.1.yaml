answer: |-
  Here is a disambiguated menu of the five distinct epistemic theses hidden within the slogan "absence of evidence is not evidence of absence." Each is analyzed according to your criteria: its logical status, its applicability when absence is predicted by the theory, and whether it successfully defends your friend's refusal to lower his confidence regarding the 2019 audits.

  ### 1. The Logical Non-Entailment Thesis
  *   **The Claim:** The proposition "Evidence $E$ has not been observed" does not logically entail the proposition "Hypothesis $H$ is false." There is no formal contradiction in asserting both that the audits exist and that they have not been seen.
  *   **Classification:** A trivial logical point about non-contradiction. It is a statement about deductive validity, not inductive strength.
  *   **Applicability to Predicted Absence:** It applies universally, regardless of whether the conspiracy predicts absence. Logic does not care about the content of the theory.
  *   **Does it Save Your Friend's View?** **No.** While it prevents you from claiming his theory is *logically impossible*, it does not justify maintaining *high confidence*. In a probabilistic world, lack of evidence usually lowers the likelihood of a hypothesis, even if it doesn't reduce it to zero. Using this thesis to maintain strong belief is a category error (treating a probabilistic assessment as a binary logical proof).

  ### 2. The Incomplete Search Thesis
  *   **The Claim:** Absence of evidence is only evidence of absence if a sufficiently thorough search was conducted. If the search space was restricted, compromised, or superficial, the lack of findings is neutral.
  *   **Classification:** A defensible methodological rule about burden of proof and search completeness.
  *   **Applicability to Predicted Absence:** It applies conditionally. Your friend must demonstrate *why* the search for the 2019 audits was incomplete (e.g., "The FOIA requests were rejected," "The archives are sealed"). If the search was open and exhaustive, this thesis collapses.
  *   **Does it Save Your Friend's View?** **Only temporarily.** It shifts the burden to you to prove the search was exhaustive. However, as years pass without leaks despite high incentives for whistleblowing (a form of "search" by the market/society), the claim that the "search is incomplete" requires increasing amounts of auxiliary evidence to remain plausible. If he cannot point to specific blocked search channels, this becomes an ad hoc rescue device.

  ### 3. The Predictive Concealment Thesis
  *   **The Claim:** In specific institutional contexts (like regulatory bodies), mechanisms of secrecy are known to exist. Therefore, the absence of documents is exactly what we should expect if the conspiracy is real. The absence is not evidence *against* the theory; it is evidence *consistent with* the theory.
  *   **Classification:** A domain-specific heuristic about concealment being genuinely likely in particular institutional settings.
  *   **Applicability to Predicted Absence:** This is the strongest version of your friend's argument. Because the conspiracy theory *includes* suppression as a mechanism, the absence of audits is predicted by the hypothesis ($H$). If $P(\text{Absence} | H)$ is high, then observing Absence does not lower the probability of $H$.
  *   **Does it Save Your Friend's View?** **Yes, but at a cost.** This makes the absence of audits neutral rather than damaging. However, it only works if the theory independently predicts suppression with high probability. If the theory *only* posits suppression to explain the absence after the fact, it is circular. If he can point to prior instances of similar suppression, this is a rational position. If he cannot, it is a "just-so story."

  ### 4. The Asymmetric Burden Thesis
  *   **The Claim:** The obligation to produce evidence lies solely with the institution (to prove they *did* release audits) or the skeptic (to prove the audits *never* existed). The believer owes no positive evidence; they merely need to highlight the institution's failure to be transparent.
  *   **Classification:** A defensible methodological rule about who owes justification (shifting the burden of proof).
  *   **Applicability to Predicted Absence:** It applies regardless of prediction. It treats the absence of audits as a failure of the institution's accountability rather than evidence about the audits' content.
  *   **Does it Save Your Friend's View?** **Partially.** It protects him from having to produce the audits himself. However, it does not justify his positive belief that the audits *were* damaging. It only justifies skepticism about the official narrative. Confusing "I don't believe their story" with "I believe the conspiracy story" is the flaw here. This thesis supports agnosticism, not the specific conspiracy claim.

  ### 5. The Unfalsifiability (Self-Sealing) Thesis
  *   **The Claim:** Because the conspiracy involves total control of information, no possible observation (neither presence nor absence of documents) could count against the theory. Therefore, the absence of evidence cannot update our confidence.
  *   **Classification:** A stronger claim that actively blocks evidential updating.
  *   **Applicability to Predicted Absence:** It applies absolutely. It renders the theory immune to all empirical data regarding the documents.
  *   **Does it Save Your Friend's View?** **No, it destroys its rationality.** While it technically "saves" the view from being proven false, it removes the view from the realm of empirical knowledge entirely. If the theory explains both the presence of leaks (brave whistleblowers) and the absence of leaks (total suppression), it predicts everything and therefore explains nothing. Adopting this reading admits that his belief is not based on evidence but on faith or ideology.

  ### Summary for Your Conversation
  When you speak to him again, you can ask him to point to which of these five he is asserting:

  1.  If he chooses **Logical Non-Entailment**, remind him that while he can't be logically disproven, he also has no positive reason to believe.
  2.  If he chooses **Incomplete Search**, ask for specific evidence of blocked search channels regarding the 2019 audits.
  3.  If he chooses **Predictive Concealment** (the most likely candidate), ask if this prediction was made *before* the evidence failed to appear, or if it was added to explain the failure. If the latter, it is circular.
  4.  If he chooses **Asymmetric Burden**, clarify that this justifies skepticism of the government, not belief in the specific conspiracy.
  5.  If he chooses **Unfalsifiability**, gently point out that he has admitted the belief is not subject to evidence.

  The "damage" you sensed is likely the slippage between **Thesis 3** (which can be rational if the concealment mechanism is well-established) and **Thesis 5** (which makes the belief immune to reality). Your goal is to force him to commit to Thesis 3 without sliding into Thesis 5.
