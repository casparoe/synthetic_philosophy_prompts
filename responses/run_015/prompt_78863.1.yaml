  I'm putting together a case for something I'm writing on the absent-minded driver problem, and I need you to build the case rather than talk about the old one.

  Start from the usual set-up: two junctions on a route, indistinguishable to whoever's driving, at each one you can either get off the route or stay on it, getting off at the first junction is worth 0, getting off at the second is worth 4, staying on past both is worth 1. I have a vague memory that the answer is supposed to be stay on with probability 2/3 at each junction, but dont trust that, work it out yourself — and also tell me what the driver would want to do at the second junction, given that policy.

  Now build me the two-person version, to these specs:

  - two different people, not one person at two times, and no memory loss anywhere in the story: nobody forgets anything, nobody's memory gets wiped, no drugs, no amnesia. The ignorance has to come from the world being uninformative, not from a head being empty.
  - each of them sits in one of the two junction booths, with a switch that either lets the car through or sends it off the route. Identical booths, no windows, no clocks, they were brought in blindfolded, and neither can tell which junction she's in. No talking, and neither even knows whether the other one is there.
  - both set their switches before the car arrives, and each is equally sure she's in either booth.
  - the payoff is shared and fixed by the pair of settings: if the junction-1 person diverts the car, that's 0, whoever did what; if the junction-1 person lets it through and the junction-2 person diverts, that's 4; if both let it through, that's 1.
  - no predictors, no demons, no physics tricks.

  Then: what should each of them do, what's the total payoff, and is what they should do actually an equilibrium — once she knows what the other one is doing, does she still want to do her bit? Show the arithmetic, with the numbers, not just a verdict.

  Then the part I actually care about. What I'm trying to work out, generally, is whether this whole puzzle is about the logic of choosing when you can't tell your own position, or about the weirdness of treating one person's moments as separate people. The thing that makes the one-person case feel off, as I understand it, is that the optimal mixture is one the driver would abandon if she were the one choosing at the second junction. Does that discomfort survive the translation to two people? If it doesn't, tell me exactly which feature of the one-person case was doing the work: is it that the later self's payoff is just her own node rather than the whole trip, or that her belief about being at the second junction is generated by her own strategy rather than by the set-up, or something else I haven't thought of? And if I change that feature in my two-person case — make the shared payoff selfish, or make the belief about which booth she's in depend on the other's strategy — does it turn back into the original puzzle? I'd rather have the arithmetic on both variants than a summary.

  And say where your reasoning is most likely to be wrong here, and what would change your mind. If what I've built is rigged to get the answer I want, I'd rather hear that than a tidy confirmation.
