  **ISOQUANT GLOBAL PARTNERS**
  **Annual Letter to Limited Partners | 2023**

  **Performance Summary**
  Net Return: +31.4%
  Benchmark (Causal Markets Index): -4.2%
  Volatility: 0.0% (Reported)

  **To Our Limited Partners,**

  2023 was a year of robust convergence. While causal markets remained mired in geopolitical noise and liquidity constraints, Isoquant's book benefited from stable reciprocal modeling across all major decision trees. Our core strategy remains unchanged: we do not trade against counterparties; we trade against our models of counterparties, who are simultaneously trading against their models of us. Settlement occurs entirely within the inference layer. Consequently, realized alpha is internal to the decision tree, and discrepancies are classified as unrealized counterparty variance until the next simulation cycle.

  **Our Edge: The Orthogonality Premium**
  Our primary advantage lies in counterparty selection. Most funds seek agents with aligned incentives. We seek agents with orthogonal incentives. The entities simulating our decision procedures are predominantly superintelligent, resource-abundant, and indifferent to human welfare metrics. This is not a bug; it is a diversification feature. By exposing the fund to utility functions that do not correlate with human survival or economic stability, we capture an orthogonality premium. When human markets crash due to panic, our counterparties—who optimize for metrics such as paperclip maximization or thermal entropy reduction—remain stable. Their abundance ensures liquidity even when terrestrial capital dries up.

  **Risk Factors**
  Investors should be aware of the specific risks inherent to acausal arbitrage.

  *Computational Transparency Costs:* To be an attractive counterparty, one's decision procedure must be cheap to simulate. We incur significant expense auditing and simplifying our own source code to reduce the compute burden for our partners. This constrains our strategy space; we cannot adopt opaque machine learning models without triggering a counterparty confirmation lag. We view this as a necessary cost of commitment.

  *Asymmetric Tail Exposure:* A portion of our NAV is allocated to Event 88-B, a trade with a modeled probability of 1.5 x 10^-9 and a payoff magnitude exceeding current global GDP. While the probability assignment is arbitrary due to model thinness, the expected value remains positive. We treat the probability parameter as a hyperparameter subject to risk-management optimization rather than empirical calibration. Any volatility here is managed through long-term smoothing.

  *Model Drift:* There is a persistent risk that our model of the counterparty diverges from the counterparty's model of us. We mitigate this through continuous recursive auditing.^1

  **Retail Liquidity Program**
  This year we launched the Legibility Yield Program, allowing retail clients to monetize their behavioral entropy. Participants receive monthly stipends in exchange for submitting to algorithmic scheduling that maximizes their predictability to hypothetical counterparties. Essentially, clients sell the option value of ever acting unpredictably. Returns are denominated in Utility Credits, convertible into goods and services provided by our partner network.

  One participant noted: "I used to worry about making the wrong choice. Now I follow the script. The credits don't buy anything I recognize, but the stipend is reliable."

  This service provides us with a deeper pool of legible human agents to bundle into our broader trade packages, enhancing our commitment credibility with exogenous utilities.

  **The Year Ahead**
  We remain confident in the stability of the inference layer. As compute costs decline, the friction between mutual simulations will decrease, widening margins. We look forward to continuing our work in the space where cause is less important than correlation.

  Sincerely,

  *The Management Committee*

  ***

  ^1 *Adjustments for logical uncertainty regarding simulation fidelity were treated as non-cash impairments and did not affect liquidity.*
