  So this got personal about eight months ago, when my dad had a stroke. He's classifed as minimally conscious now — every few days he'll track someone with his eyes or squeeze a hand when asked, mostly nothing, and nobody on the team will say anything definite about where it goes from here. We've got another family meeting in two weeks about whether to keep doing everything. And at the same time I've got a tank of leafcutter ants in the kitchen (my kid's science thing that I got way too into), and I've noticed I'm now ocassionally careful not to crush workers when I'm cleaning the glass, and then I feel stupid about it, and then I wonder whether feeling stupid is itself the error. I really don't want to end up as either the guy who decides ants are nothing or the guy who decides they're basically my dad.

  Prose about spectrums and continuums has stopped helping me, so I want numbers. Please score each item below from 0 to 100 on two separate scales, and pin the lab rat at exactly 50 on both so I can read the shape of the thing rather than your private calibration.

  Scale A, the next minute: hold the rest of the world fixed. Imagine swapping this thing, for one minute, for a functionally identical duplicate that has no experience at all — same inputs, same outputs, nothing downstream changes. Call it the swap test. If literally nothing is lost, that's 0. To the extent something is lost — something it's like, something that matters to it, however thin — go up. Score the next sixty seconds only; don't smuggle in the future.

  Scale B, ending it: the total moral cost of permanently destroying or ending this thing right now. Everything included.

  1. A household thermostat.
  2. A nematode worm — the ~300-neuron one everyone uses in the lab.
  3. A housefly.
  4. A honeybee forager.
  5. My leafcutter colony, counted as one single thing rather than as a pile of workers.
  6. A lab rat (fixed at 50 / 50).
  7. A shock-avoider: pretend we could breed or wire up an animal that flinches, grooms a wound, and learns to press a lever to escape a shock exactly as well as a normal animal, but for which nothing is ever unpleasant — the nociception is intact and the yuck is gone. We can't build one, I know, treat it as a probe.
  8. A chatbot twenty messages into a long conversation, the sort that clearly tracks what you said at the start.
  9. A grown adult under general anaesthetic mid-surgery, no awareness, no memory of it afterwards.
  10. My dad, as he actually is.
  11. The man two beds down: eyes open, sleep-wake cycles, no signs of awareness anybody can find, and the team says it isn't coming back.

  Give me one sentence of justification per item. If you think something on my list doesn't belong on a single scale at all — the colony being the obvious candidate, since it isn't an organism — say so, but give me a number with the complaint attached; I'd rather have a contested number than a refusal.

  Three things I can't work out on my own and want you to actually take a position on:

  (i) Is column B just column A added up over whatever future the thing would have had, or does something extra get in — continuity, a life hanging together, being the same one over time? If something extra gets in, does it move my dad's number, and which way?

  (ii) My dad's A score might be low and the thing we're actually deciding is about the rest of his life. So: which column does a decision like ours turn on, and how much does the other one still count? Don't duck it.

  (iii) Two pictures of him fit the same evidence about equally: either he's mostly out, with rare short islands of real awareness, or he's dimly conscious more or less all the time. Both could have the same average amount of consciousness and very different moral shape. Can a single number per column represent that difference, or am I asking for something a number can't do?

  P.S. my brother says that if there's no sharp line you can draw between the thermostat and my dad, then the whole exercise is fake and you have to treat them all the same or none of them. I'm fairly sure that's a bad inference but I can't say why in a way he'd accept, and he's going to be at the meeting.
