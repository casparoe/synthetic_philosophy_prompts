      *   Make the questions sound spoken, not just written.

  9.  *(Final check of the prompt requirements)*: "ending with one question about what formal result or empirical finding could count against the premise-based approach." "At least one question each on [the three topics]... and for each of those three, a follow-up keyed to the reply she's most likely to give."

