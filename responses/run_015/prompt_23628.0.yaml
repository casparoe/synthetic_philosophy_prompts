      *   *Self-Correction on Q2:* Ensure the link between "fixed by law" and "agenda power" is tight. If it's fixed, no power. If there's power, it's not fixed.
      *   *Self-Correction on Q3:* Ensure the distinction between Independence of Irrelevant Alternatives (IIA) in voting and Independence in Judgment Aggregation (proposition-wise) is clear. PBA violates proposition-wise independence.
      *   *Check the "Standard Reply":* Ensure every follow-up specifically targets "fixed by the structure... no choice."

  8.  **Final Polish:** (Writing the output in the requested format).
