  Based on Dani's track record, she is not a pure Peter Singer-style utilitarian. A pure utilitarian would demand the kidney, forbid the coffee, require voting (on expected value grounds), and prioritize the stranger's life over the sister's wedding. Dani is instead a **Moderate Consequentialist with Fair-Share Constraints.**

  Here is the breakdown of her likely responses, the competing rules that explain her behavior, and the test case to settle it.

  ### 1. Dani's Likely Verdicts on the New Cases

  **Case 1: The Bystander Pond (200 people, $2,000 cost + career risk)**
  *   **Verdict:** **No Duty.**
  *   **Reasoning:** While the original pond required ruining a $200 suit, this scenario asks for $2,000 plus a career opportunity. This crosses her "reasonable sacrifice" threshold (similar to the kidney verdict). Furthermore, the presence of 199 other capable people triggers her "Fair Share" intuition (seen in the office collection and the "other wader" cases). She does not believe you must take up the slack for defectors when the cost to you becomes significant.

  **Case 2: The Recurring Pond (30 years, shoes + 10 mins)**
  *   **Verdict:** **Duty.**
  *   **Reasoning:** This aligns perfectly with her "10% income for bednets" verdict. The cost per instance is low (shoes/time), and the aggregate good is high. She accepts recurring, moderate sacrifices (10% income) but rejects one-off, life-altering sacrifices (kidney/career).

  **Case 3: The Parental Risk Pond (5% death risk, orphaning kids)**
  *   **Verdict:** **No Duty.**
  *   **Reasoning:** She accepts a 1-in-20 (5%) risk for a stranger when it's just *her* life on the line. However, the "Sister's Wedding" verdict establishes that she holds **Special Obligations** to family. Orphaning her children is a harm to *them*, not just her. Her moral calculus weights harm to dependents much higher than harm to strangers, overriding the raw risk percentage.

