  ### 2. The Competing Rules

  To find out if Dani is coherent, we have to isolate which principle is actually driving the car. Here are three rules that fit her *past* verdicts equally well but diverge on the *new* ones.

  #### Rule A: The "Constrained Fair-Share" (The Likely Candidate)
  *   **The Logic:** You have a duty to maximize good *subject to* three constraints:
      1.  **Cost Cap:** You aren't required to make sacrifices that significantly alter your life trajectory (Suit = OK, Career/Kidney = Not OK).
      2.  **Fairness:** You owe your fair share of a collective effort, but you are not required to compensate for others' refusal to do their part (Office collection = OK, Slack-taking = Not OK).
      3.  **Special Obligations:** Duties to kin/dependents trump general utility (Wedding = OK, Stranger = Not OK).
  *   **Fits History:** Explains the "Other Wader," "Office Collection," and "Sister's Wedding" verdicts best.

  #### Rule B: The "Marginal Cost-Benefit" (The Singer-Lite)
  *   **The Logic:** Duty is determined *solely* by the ratio of Cost to Benefit for the agent. The behavior of others is irrelevant; only the outcome matters. "Fairness" is just a heuristic for cost.
  *   **Fits History:** Explains the "Shallow Pond," "Risk Threshold," and "Bednets" verdicts. It explains the "Other Wader" case only by arguing that the *marginal benefit* of a second rescuer is near zero.
  *   **Divergence:**
      *   **Case 1:** Rule B might say **Duty** (if $2,000 is under her abstract "ruin" threshold), because the child's life outweighs the money, regardless of the bystanders' rudeness.
      *   **Case 3:** Rule B might say **Duty** (if 5% risk is under her cap), because a 5% risk of death is mathematically identical whether you have kids or not, unless "sadness of kids" is counted as a utility cost.

  #### Rule C: The "Efficacy Threshold" (The Voter)
  *   **The Logic:** You only have a duty if your action is *causally sufficient* to solve the problem. If your action alone won't fix it, you owe nothing.
  *   **Fits History:** Explains the "Voting" verdict (one vote doesn't matter) and the "Other Wader" (kid is already saved).
  *   **Divergence:**
