  ### 4. The Settler Case

  To determine which rule Dani is actually running, you need to separate **Cost** from **Fairness**. In Case 1, both were high ($2,000 + Slack). We need a case where Cost is *trivial* (like the original suit) but Fairness is *violated* (others defecting).

  **Put this case to her:**

  > "You're walking past the shallow pond. The kid is drowning. Ruining your suit costs $200 (same as before).
  >
  > There are 199 other people standing there in raincoats. They *could* all jump in and get their clothes muddy, which would cost them $0. They refuse to move.
  >
  > If you jump in, you save the kid alone. If you don't, the kid dies.
  >
  > **Do you have a duty to jump?**"

  **Why this settles it:**

  *   **If she says YES:** She is running **Rule B (Cost-Benefit)** or **Rule C (Efficacy)**. The behavior of the bystanders is irrelevant to her; the low cost and high benefit dictate the duty. Her "Office Collection" and "Other Wader" views were just about efficiency, not fairness.
  *   **If she says NO:** She is running **Rule A (Fair-Share)**. She believes that when a group is present, the duty is distributed. If the group defects, she is not morally required to become the "sucker" who does everyone's job, even if the cost to her is low. This would reveal that her "Singer-style" label is misleading; she is actually a **Contractualist** who values reciprocity over raw utility.

  **Follow-up:** If she hesitates, ask: *"Is it because it's unfair, or because $200 is too much when others should help?"* If she says "Unfair," you've found the core of her theory. If she says "$200 is too much *in this context*," she's a Cost-Benefit theorist who counts "social resentment" as a cost.
