answer: |-
  **Project Title:** The Currency-Conversion Collapse and the Temporal Unit in Distributive Justice

  **Research Question**
  Does the standard tripartite distinction in distributive justice (welfare, resources, capabilities) obscure the decisive normative choices regarding *conversion functions* and *temporal aggregation*? Specifically, can a counterfactual conversion model resolve the adaptive preference problem without circularity, and is the choice of temporal unit (synchronic vs. whole-life) normatively independent of the choice of currency?

  **Problem Statement and Significance**
  The "equality of what" debate is currently stalled. Philosophers argue over currencies (welfare vs. resources vs. capabilities), while economists and policymakers ask for measurable metrics. Both sides are frustrated because the standard framing hides two mechanical decisions that determine actual outcomes more than the nominal currency choice does.

  First, the **Currency-Conversion Collapse**. Every theory of distributive justice requires a function that converts a bundle of goods (income, rights, liberties) into a status of advantage. Resource views claim to equalize the bundle and let conversion be private, but this ignores heterogeneous conversion costs (e.g., disability). Capabilities views equalize the "beings and doings," but this merely relocates the conversion problem into the selection of the capability list and threshold. Welfare views measure the output directly but fail when preferences are adaptive (e.g., the contented oppressed). I argue that the currency question *is* the conversion question. By treating them as distinct, current theories allow proponents to claim neutrality on conversion while silently importing controversial assumptions.

  Second, the **Temporal Unit**. Almost no theory explicitly defends its aggregation rule over time. Consider Ana (severe illness in her 20s, flourishing thereafter) and Ben (flat mediocrity throughout). A whole-life view may judge them equal; a synchronic (period-by-period) view judges Ana badly off for a decade. This choice determines whether policy prioritizes immediate relief or lifetime opportunity, yet it is treated as a secondary technicality rather than a primary normative variable.

  **Why Standard Currencies Leave This Open**
  *   **Resource Egalitarianism:** Fails to answer the conversion question. It assumes a "normal" conversion rate. When pressed, it must either compensate for conversion deficits (collapsing into welfare/capabilities) or refuse (abandoning equality of opportunity).
  *   **Welfarism:** Fails to distinguish between authentic and adaptive preferences. It measures the output of the conversion function without auditing the function itself.
  *   **Capabilities Approach:** Comes closest to solving conversion but lacks a non-circular method for selecting the relevant capabilities. It often presupposes the "just institutions" it is meant to design.

  **Methodology and Work Plan (12 Months)**
  The project proceeds in three theoretical chapters followed by one applied paper.

  *   **Months 1–3: Chapter 1 (The Collapse Thesis).** Formalize the argument that currency choices are implicitly conversion functions. I will construct a model showing how Resource and Welfare views map onto specific conversion assumptions.
      *   *Milestone:* A proof-of-concept model demonstrating that two theorists claiming the same "currency" but different "conversion assumptions" yield divergent policy prescriptions.
  *   **Months 4–7: Chapter 2 (The Counterfactual Fix).** Develop the counterfactual conversion function: evaluating bundles based on the preferences an agent would hold under just institutions and adequate opportunity.
      *   *Key Challenge:* Avoiding circularity (defining "just institutions" without presupposing the distribution). I will test this against the "expensive tastes" objection.
      *   *Milestone:* A draft definition of "reflectively chosen preferences" that excludes adaptive deformation without relying on a perfectionist list.
  *   **Months 8–9: Chapter 3 (The Temporal Unit).** Argue that temporal aggregation is independent of currency. I will defend a *weighted synchronic* view (prioritizing the worst-off periods without ignoring lifetime totals) using the Ana/Ben case.
      *   *Milestone:* A comparative matrix showing policy outcomes under Lifetime-Welfarism vs. Synchronic-Capability.
  *   **Months 10–12: Standalone Paper (The Policy Rule).** Translate the theoretical model into a decision rule for non-philosophers.
      *   *Deliverable:* A "Comparison Algorithm" for policy analysis. Instead of asking "Is this policy Welfarist?", the tool asks: "1. What conversion function is implied? 2. Is that function counterfactually robust? 3. What temporal unit is applied?"

  **Contingency and Cuts**
  If Chapter 2 stalls on the circularity objection (i.e., if "just institutions" cannot be defined independently of the distribution), I will cut the Counterfactual Fix argument. The fallback is to defend the **Temporal Unit** as the primary lever for reform. I will argue that even if we cannot settle the currency debate, we can settle the temporal debate, which yields higher marginal gains for policy clarity. If time is critical, Chapter 3 will be condensed into the Standalone Paper, focusing solely on the temporal independence thesis.

  **Failure Conditions**
  This project fails if:
  1.  **The Distinction is Illusory:** It is demonstrated that the "conversion function" is merely a semantic relabeling of the "capability list," rendering the Collapse Thesis trivial. (Evidence: If I cannot construct a Resource View that does *not* implicitly rely on a capability metric).
  2.  **Circularity is Inescapable:** If the counterfactual baseline ("preferences under just institutions") requires a prior theory of distributive justice to define, the model is viciously circular. (Evidence: If every attempt to define the baseline presupposes the conclusion of the distribution).

  **Fallback Project:**
  If the Collapse Thesis fails, the project shifts to a defense of **Synchronic Prioritarianism**. I will argue that regardless of currency, policy should minimize the depth of disadvantage in any given time slice, abandoning the "whole-life" averaging standard. This preserves the temporal contribution while jettisoning the contested conversion mechanics.

  **Deliverable for Policymakers**
  The final output will not be a recommendation for a specific currency (e.g., "use GDP+"). It will be a **Diagnostic Rubric**. When evaluating a policy (e.g., a disability benefit or education grant), the user applies three tests:
  1.  **Conversion Audit:** Does this policy assume everyone converts dollars to opportunity at the same rate? If yes, reject or adjust.
  2.  **Preference Audit:** Does this policy satisfy preferences that might be adaptive (formed under deprivation)? If yes, flag for counterfactual review.
  3.  **Temporal Audit:** Does this policy trade off severe current deprivation for marginal lifetime gains? If yes, flag for synchronic review.

  This allows economists to use existing metrics while forcing an explicit defense of the hidden normative parameters currently buried in the model specifications.

  **Defense of Approach**
  *   **Why not a survey?** The literature is mapped; the stalemate is structural, not informational. A survey reinforces the silos I aim to breach.
  *   **Why not empirical?** You cannot measure "advantage" without first defining the unit of measurement. Empirical work on inequality currently proceeds with inconsistent units, rendering cross-study comparison impossible. This project provides the unit definition.
  *   **Why not operationalize Capabilities?** Simply picking a list (e.g., Nussbaum's Central Capabilities) begs the question of *why* those capabilities and *how* they are weighted. My project interrogates the weighting mechanism (the conversion function) rather than the list itself.

  **Conclusion**
  This fellowship year will produce a rigorous theoretical account of why the standard debate is stalled and a practical tool for bypassing the stalemate. By forcing the conversion function and temporal unit into the open, we move from arguing about labels to arguing about the mechanics of comparison.
