answer: |-
  Here is the carving you asked for.

  ### 1. The Name and the Mechanism

  Your friend was right about the first thing. In philosophy of mind, that is **recalcitrant emotion**. It is the standard term for when an affective state (fear) persists despite a contradictory cognitive judgment (safety). It treats the emotion and the judgment as two separate systems that can fight each other.

  The second thing—the order effect—is not the same mechanism. It does not have a single canonical name in philosophy, but in linguistics and narrative theory, it is called **sequential iconicity**.

  Here is the distinction: Recalcitrant emotion is about what is happening *inside the character*. Sequential iconicity is about what is happening *inside the reader*.

  Iconicity means the structure of the language mimics the structure of the experience. In narrative, the order of sentences creates a timeline of discovery.
  *   **Thought then Body:** The reader receives the conclusion first ("She knew the dog was harmless"). This sets the context. The body movement that follows ("Her hand went to the latch") is read against that context. It becomes a deviation, a footnote, or a relic. It feels like the past because the intellectual framework has already closed the case.
  *   **Body then Thought:** The reader experiences the action first ("Her hand went to the latch"). This establishes the immediate physical reality. The thought that follows ("She knew the dog was harmless") is read as commentary on that reality. Because the body arrived first, it claims the "present tense" of the scene. The thought attempts to explain it, but the body has already defined the moment.

  So, to answer your first question: No, it is not the first thing in a different costume. The first thing is a psychological state (fear overriding logic). The second thing is a representational strategy (syntax overriding sequence). You are mistaking one mechanism for two only if you assume the text is a transparent window into the character. It isn't; it's a sequence of instructions to the reader's imagination.

  ### 2. Where It Stops

  This effect relies on **working memory** and **narrative focus**. It works as long as the two sentences are competing for the same slot in the reader's immediate attention.

  *   **Second Person:** Yes, it works. In fact, it often works stronger because "you" implies immediate experience.
  *   **Past Perfect:** It weakens significantly. "Her hand *had gone* to the latch" pushes the action into the past relative to the narration. It creates distance. The simple past ("went") is required for the immediacy to hold.
  *   **Chapter Breaks:** No. A break resets the reader's working memory. When they return, the first thing they read sets the new ground. If the thought comes first in the new chapter, it overrides the body action from the previous chapter.
  *   **Split Between Characters:** No. If Character A moves their hand and Character B speaks the thought, the reader processes these as separate streams of information. The iconic link is broken because the source of the data has changed.
  *   **Narration vs. Dialogue:** Yes, this works, but with a caveat. If the narration describes the body and the dialogue speaks the thought, the body usually wins. Narration is treated as "fact" of the scene; dialogue is treated as "claim." If the narration says the hand shook, and the character says "I'm not scared," the reader believes the hand. This aligns with your Order B (Body first/above).

  The boundary is roughly the paragraph break. Within a paragraph, the order dictates the hierarchy of truth. Across paragraphs, the most recent information tends to dominate unless the earlier information was heavily weighted.

  ### 3. Emotion Theory vs. Prose Mechanics

  You asked which account of emotion predicts this: Judgment, Perceptual, or Somatic.

  The honest answer is **none of them**. These are theories of what emotion *is*, not how language *transmits* it. However, one of them explains why the body sentence carries more weight when it comes first.

  *   **Judgment Theory** (Emotion is a belief): This theory struggles with your first example (recalcitrance) and cannot explain the second. If emotion is just a judgment, the sentence stating the judgment should win regardless of order. It doesn't.
  *   **Perceptual Theory** (Emotion is seeing value): This gets closer. It allows for the body to register value before the mind processes it. But it still doesn't account for why sentence order changes the reader's verdict.
  *   **Somatic Theory** (Emotion is the feeling of the body): This is the only one that aligns with the order effect. If emotion is fundamentally a bodily event, then the sentence describing the body is the direct report of the emotion. The sentence describing the thought is a report *about* the emotion.

  However, the order effect itself is not evidence about emotion. It is evidence about **narrative processing**.

  When you read "Her hand went to the latch," your brain simulates the action. You are now inside the moment of fear. When you read "She knew the dog was harmless" second, your brain has to overlay that knowledge onto the simulation you just built. The simulation (the fear) is already running.
  When you read the thought first, your brain builds a model of safety. Then you read the hand movement. Your brain has to fit the hand movement into the model of safety. It fits it as a glitch, a habit, a leftover.

  So, you have been drawing conclusions about your characters off something that is primarily about prose mechanics. But it is prose mechanics that exploits how human beings process time and causality. We assume the first thing we see is the cause, and the second thing is the effect, or the first thing is the figure, and the second is the ground. By putting the body first, you make the body the figure.

  ### Confidence Levels

  **Claim 1: The distinction between Recalcitant Emotion and Sequential Iconicity.**
  *   **Confidence:** High.
  *   **Reasoning:** These are well-established categories in philosophy of mind and linguistics respectively. They operate on different levels (character psychology vs. narrative structure).

  **Claim 2: The boundary limits (Paragraph breaks reset the effect; Past Perfect weakens it).**
  *   **Confidence:** Medium-High.
  *   **Reasoning:** This is based on standard cognitive load theory and narratological convention. However, skilled writers can sometimes stretch these limits with strong thematic linking, so it is not an absolute law.

  **Claim 3: The order effect is evidence about prose processing, not emotion theory.**
  *   **Confidence:** High.
  *   **Reasoning:** Syntax cannot change the nature of emotion, only the representation of it. The effect disappears if the text is spoken vs. read, or translated into a language with different syntactic rules, suggesting it is a feature of communication, not psychology.

  **Claim 4: Somatic Theory aligns best with why the body sentence wins.**
  *   **Confidence:** **Low (This is my least sure claim).**
  *   **Reasoning:** While Somatic Theory explains why the body feels "more real" than the thought, it is possible the effect is purely linguistic (concrete nouns vs. abstract concepts) rather than philosophical. It might be that "hand" is simply more imageable than "knew," regardless of emotion theory. I am less certain that this validates Somatic Theory specifically, rather than just validating the power of concrete imagery in general.

  ### Summary

  You are looking for a word for the second phenomenon because it feels like a truth about human nature. It is actually a truth about human reading.

  The shape of it is this: **Narrative time mimics experienced time.** What comes first in the sentence is what the reader experiences first. If the reader experiences the fear (body) before the safety (thought), the fear is the present reality. If they experience the safety before the fear, the fear is a memory.

  You aren't finding a word for it in emotion theory because it isn't an emotion. It's a lever. You are pulling a lever in the reader's brain that dictates what counts as "now." Use it.
