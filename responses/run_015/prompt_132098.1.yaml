  2.  **Brainstorming & Preparation (Internal Monologue):**
      *   *Etiological (Selected-Effects) Theory:* Function is defined by past selection history. $X$ has function $F$ if $X$ exists because it did $F$ in the past (Wright, Millikan, Neander). Key feature: Normativity (malfunction is possible), historical dependency.
      *   *Causal-Role (System-Capacity) Theory:* Function is defined by current causal contribution to a system capacity. $X$ has function $F$ if $X$ contributes to capacity $C$ of system $S$ (Cummins). Key feature: Ahistorical, contextual (depends on the analyzing system), no strong normativity (malfunction is just failing to contribute).
      *   *The Heart Example:* Both agree the heart pumps blood. Etiological: because ancestors pumped blood and survived/reproduced. Causal-Role: because it contributes to the circulatory capacity of the organism.
      *   *Artificial Systems (Synthetic Pump):*
          *   Etiological: Strict view says no *biological* function (no natural selection history). Some etiologicalists allow artifact functions based on *design* selection (intentional selection), but the question specifies "biological function" in an "artificial organism". Strict biological etiological account says no.
          *   Causal-Role: Yes, it contributes to the capacity of the system. Cummins functions are ahistorical.
      *   *Exaptation:* A trait originally selected for $A$ is now used for $B$.
          *   Etiological: Function changes only when new selection history accumulates for $B$. Before that, it's an exaptation (not yet a function for $B$, or has dual function if both selected). There's a lag.
          *   Causal-Role: Function is immediate. If it contributes to $B$ now, it has function $B$ now. No lag.
      *   *Spandrels:* Traits that are by-products, not selected for.
          *   Etiological: No function (in the selected-effect sense). They exist, but not *because* of their effect.
          *   Causal-Role: They *do* have functions (causal roles) if they contribute to a capacity. E.g., the chin might contribute to structural integrity. Cummins functions are ubiquitous; almost everything has a causal role.
