prompt: |-
  I built the argument below for a graduate seminar on scientific realism, and I now can't locate the bad step in it even though I'm confident the conclusion is false. I'd be grateful for a diagnosis.

  The target is the thought that the novel predictive success of our best theories is evidence that their claims about unobservable entities and processes are at least approximately true. I want the argument to show that this thought buys us nothing at all.

  (1) A theory earns genuine evidential credit when it predicts a phenomenon of a kind it was not constructed to accommodate, and the prediction is borne out to a precision that coincidence cannot plausibly explain.

  (2) If that credit is to transfer to the theory's claims about unobservables, then within the relevant reference class novel predictive success must be a strong enough indicator of approximate truth to lift the probability of those claims above one half. That is simply what it would mean for success to be *evidence* here.

  (3) The relevant reference class has to be the class of theories that achieved novel predictive success. We cannot calibrate success against the unobservable facts directly: if we could already tell which theories get the unobservables right, the controversy would be over before it began.

  (4) In that class the record is dominated by failure. Rather than argue about the usual historical examples, here is a stipulated composite case. Theory T was dominant from 1830 to 1890. It posited an invisible, weightless fluid F pervading all space, and it predicted a previously unsought quantitative effect to five significant figures; the effect was there. T is now abandoned and F does not exist. The sting is in the details: the equation that generated the prediction survives unchanged in the current textbook, but its symbols are now read as describing a field rather than a fluid, and the successor theory recovers the same number by a derivation that shares no posits with T. So T is not a theory that failed to predict. It is a theory that predicted brilliantly and was wrong about what it was describing.

  (5) Our current best theories are not relevantly better situated than T was. Same general methods, same remoteness of the subject matter from observation, adherents just as confident, and the same reliance on instruments whose readings are themselves interpreted through the theory whose posits are in question.

  (6) The standard realist replies are all filters. Be realist only about what survives theory change, or only about the entities we can manipulate, or only about the parts of the theory that do the work in the derivation that produced the successful prediction. Call these the retention criterion, the manipulation criterion, and the deployment criterion.

  (7) Call this the borrowed-verdict problem. Each filter must be applied now, by us, using our current science; there is no other instrument to apply it with. So its verdicts are only as trustworthy as the theory doing the filtering, and by (5) that theory is probably false in its unobservable claims. In the case of T, at every moment of T's reign all three filters would have returned F: F is what the surviving equations quantify over, F is what the successful derivation deploys, and by the lights of the day F was causally implicated in interventions that reliably worked. And the one criterion that would have got T right — retention in the successor theory — is available only in hindsight, so it cannot guide present belief at all.

  (8) So: for any current claim C about unobservables, our evidence for C is mediated by a theory that is probably false in its unobservable claims, and the filters add nothing because their verdicts are borrowed from that very theory. The probability of C therefore stays below one half however much success accumulates. Generalizing, no body of evidence, present or future, could ever justify believing a claim about unobservables.

  (9) But (8) is unacceptable, and it fails in three distinguishable ways. (a) It applies to the existence of bacteria, atoms, and tectonic plates, which we take ourselves to know. (b) It saws off its own branch: (4) is itself a verdict about unobservables rendered from inside current science, so (8) withdraws the support for the only premise that got the argument going. (c) A claim that no possible future evidence could ever lift above one half is not an empirical finding from the history of science; it is a priori skepticism about unobservables wearing an inductive costume.

  The two things I would least like to surrender are (4) — the graveyard is real, and I don't want to explain the history away — and part (a) of (9). So if the argument has to break, I'd rather it break at (2), (3), (5), or (7).

  Two things I'd like in particular. First: is the failure in the base-rate framing of (2) and (3) — an equivocation between whole theories and theory-parts, an ill-chosen or biased reference class, something of that shape — or is it in the borrowed-verdict step (7)? If it's the former, what replaces the base-rate framing as an account of what makes success evidentially relevant? Second: if it's (7), does the manipulation criterion escape the problem in a way the retention criterion does not, given that successful intervention looks like an anchor outside the theory rather than a verdict borrowed from it? And is any version of (5) salvageable, or is the claim that our situation differs from T's always going to be special pleading?

  Please price each of the options you see, including the ones I haven't listed, and say what I'd be committing myself to by giving up the step you'd reject.

  Lead with your bottom line in the first sentence — which step you reject and, in a single clause, why — then give the reasoning. No preamble and no restatement of what I've asked.
