  2.  **Analyze the Subject Matter (Cognitive Penetration of Perception):**
      *   *Core Concept:* Does cognition (beliefs, desires, expectations) influence perception?
      *   *Standard Distinction (Strong vs. Weak):*
          *   **Strong Penetration (Diachronic/Synchronic Content Change):** Cognition changes the *phenomenal character* or *representational content* of the perceptual experience itself. (e.g., The tomato literally looks redder because you believe it's ripe). This challenges the modularity of mind (Fodor) and the epistemic role of perception (if perception is biased by belief, it can't justify belief).
          *   **Weak Penetration (Attention/Post-Perceptual/Judgment):** Cognition influences *attention*, *eye movements*, or *post-perceptual judgment*, but the raw sensory experience remains cognitively impenetrable. (e.g., You look *at* the tomato more because you believe it's ripe, but the experience of redness is the same).
          *   *Alternative Distinction (Diachronic vs. Synchronic):* Sometimes "weak" refers to long-term learning (diachronic) changing the system, while "strong" refers to immediate top-down influence (synchronic). However, the content vs. processing distinction is the most common in introductory/intermediate contexts.
      *   *Why it Matters:*
          *   **Epistemology:** If strong penetration is true, perception might be "contaminated" by belief, leading to circularity in justification (you believe P, so you see P, so you believe P). Anti-penetrationists want to protect perception as a neutral arbiter.
          *   **Modularity:** Strong penetration violates Fodor's informational encapsulation. Weak penetration is compatible with modularity (input systems can be triggered by cognition without being penetrated).
          *   **Dialectic:** Anti-penetrationists often concede weak penetration (attention, etc.) but deny strong penetration. The debate hinges on whether the *experience itself* changes.

