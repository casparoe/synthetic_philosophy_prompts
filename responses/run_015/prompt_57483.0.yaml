answer: |-
  The air in the Continuity Bureau's audit chamber smelled of ozone and old paper, a scent that hadn't changed in a century. Outside the thick concrete walls, the city hummed, but in here, the only sound was the scratch of pen on vellum and the low hum of the server stacks holding the dormant instances.

  Elara tapped the stack of files between them. "We're stuck on the Quarantine Years again, Kael."

  Kael didn't look up from her ledger. "We're stuck on the truth. The Bureau claims it saved the whole city. The archives suggest it only saved the Inner Districts. Those are the only two options on the table. Lean or Deep."

  "Lean says four hundred thousand stored," Elara said, leaning forward. "Deep says seven point two million."

  "And either way," Kael replied, finally meeting her eyes, "there are two point four million living originals walking around right now. That number doesn't change. The dispute is about the sleepers in the vaults."

  Elara picked up her stylus. She had been working the numbers for three days, letting them settle in her mind until they felt less like statistics and more like gravity. "It's not just about the vaults. It's about us. You're using the Position Protocol. I'm using the Headcount Protocol."

  Kael sighed, closing her ledger. "The Position Protocol is standard procedure, Elara. You treat your own existence as a fixed point. You don't let the mere fact that you are here sway the probability of the world around you. You only look at specific details. Do you have a scar the scans missed? Are you from District 4? Those are indexical facts. Existing isn't one of them."

  "Existing is the biggest fact we have," Elara countered. "The Headcount Protocol says exactly what it sounds like. An account of the world that contains more people like us is more likely to be the right account, simply because there are more of us to be drawn from. If the Deep scenario is true, there are far more observers in existence than if the Lean scenario is true."

  She spread a sheet of calculations across the table. "Look. We start with even priors. Fifty-fifty. Now we apply the observer counts."

  Kael glanced at the paper but didn't touch it. "Walk me through it. Again."

  "Living originals," Elara said, tapping the first line. "Two point four million. That's constant. In the Lean scenario, the Bureau only finished the Inner Districts. That's four hundred thousand stored instances. Add them to the living. Two point four plus zero point four. That's two point eight million total observers."

  "And Deep?" Kael asked, her voice flat.

  "Deep means they finished the whole city before the walls sealed," Elara said. "Seven point two million stored. Add the living. Two point four plus seven point two. That's nine point six million total observers."

  Elara leaned in, her voice dropping. "So we have nine point six million potential observers in the Deep world, and only two point eight million in the Lean world. The ratio is nine point six divided by two point eight. That's roughly three point four to one."

  Kael stared at the number. "Three point four to one."

  "Which means the probability of Deep is nine point six divided by the total sum. Nine point six over twelve point four." Elara paused, letting the arithmetic hang in the dusty air. "That's seventy-seven percent. Better than three out of four."

  Kael pushed the paper back. "Seventy-seven percent based on what? Based on you breathing?"

  "Based on me being here to ask the question," Elara corrected. "If the Deep scenario were true, it would be much more likely for 'me' to exist than if the Lean scenario were true. My existence is evidence."

  "No," Kael said sharply. "That's the first flaw. You knew you'd be around to wonder about this. You're an auditor. You were born, you were trained, you were assigned. You didn't wake up yesterday surprised to find yourself conscious. No new information arrived. You're just noticing a selection effect and calling it data."

  "It is data," Elara insisted. "If I draw a ball from an urn, and the ball is red, I have to update my odds on whether the urn contains mostly red balls or mostly blue ones. I am the ball."

  "You aren't a ball drawn from an urn of possible worlds," Kael said. "You're a fixed point observing the urn. And here's the second flaw, the one that actually matters for the Bureau. You're counting the sleepers."

  Kael stood up and walked to the window, looking out at the gray skyline. "The stored instances are dormant. They aren't observing anything. They're data on a disk. How can a dormant file count as an observer in the reference class? If they aren't conscious, they aren't 'people like you' in the relevant sense. They're just potential people. Your Headcount Protocol inflates the numbers with ghosts."

  "They are instances," Elara said, standing to face her. "They can be woken. They have continuity. If we wake them, they remember being scanned. They are us, just paused. Excluding them arbitrarily skews the count to favor the smaller world."

  "It's not arbitrary," Kael turned back. "It's operational. We audit what is active. If you count the dormant, you can prove anything. You could say the Bureau scanned every human who *could* have been born, and suddenly the odds shift again. Where do you stop?"

  "At the stored records," Elara said. "The Bureau's own logs define the set. Either they finished the job or they didn't."

  "Why does it matter so much to you?" Kael asked quietly. "It's a historical dispute. The Quarantine Years are over. The walls are sealed. Whether the Bureau saved the Outer Districts changes nothing for the living."

  Elara froze. Her hand hovered over the certification form. The pen felt heavy, like a lead weight. She had kept this close, tucked behind the logic and the ratios, but the silence in the room demanded it.

  "My parents," Elara said. "They were in Sector Nine. Outer Districts."

  Kael's expression softened, just slightly. "Elara..."

  "If Lean is true," Elara continued, her voice trembling, "the Bureau stopped at the Inner Wall. Sector Nine was left outside when the plague hit. They died."

  "And if Deep is true?"

  "Then the Bureau reached them," Elara said. "They were scanned before the quarantine sealed. They're in the vaults. Seven point two million souls. They're in there, Kael. My parents are in there."

  Kael looked at the stack of files, then back to Elara. "You want the math to say Deep so you can believe they're safe."

  "I want the math to be right," Elara said. "And the Headcount Protocol says Deep is seventy-seven percent likely. That's enough for certification. That's enough to sign off."

  "It's not enough if the reasoning is flawed," Kael said. "If you sign based on the Headcount Protocol, you're validating a method that counts ghosts to determine history. You're saying existence alone is evidence. If you do that, what happens next decade? What happens when the next auditor uses your logic to prove something impossible?"

  "Then they'll be wrong," Elara said. "But right now, I have a method that gives me a probability. You have a method that says 'we can't know.' I prefer knowing."

  "The Position Protocol doesn't say we can't know," Kael argued. "It says we don't know *yet*. It says we need physical records, not metaphysical counting. And the physical records are missing for the Outer Districts. The logs were corrupted during the breach. We have no proof they were scanned."

  "We have me," Elara said. "I'm the proof."

  "You're a survivor," Kael corrected. "That's all."

  Elara looked down at the form. There were two boxes at the bottom. One for the Lean certification, one for the Deep. To sign the Deep certification was to officially declare that the Bureau had completed the full scan. It would unlock the funding to maintain the larger vaults. It would validate the history books. It would mean her parents were among the sleepers, waiting in the dark.

  To sign Lean was to admit they were gone.

  Kael sat back down, picking up her own pen. She dipped it in the inkwell, the nib glinting under the sterile lights. "I'm signing the Lean report, Elara. I can't validate the Headcount Protocol. I won't put my name on a lie, even a comforting one."

  She signed her name on the Lean document with a sharp, decisive scratch. Then she slid the Deep document toward Elara.

  "If you sign that," Kael said, "you're on your own. The Bureau will adopt the Headcount Protocol as standard. You're changing how we see reality."

  Elara looked at the pen. She thought about the ratio. Nine point six versus two point eight. The weight of the numbers felt physical, pressing against her chest. She thought about Sector Nine, the smoke, the sirens. She thought about the silence of the vaults.

  "If I'm right," Elara said, "they're waiting."

  "If you're wrong," Kael said, "you're building a religion out of arithmetic."

  Elara capped her pen. She uncapped it again. The silence stretched, filled only by the hum of the servers, millions of dormant hearts beating in the dark beneath their feet. She placed the nib on the paper.

  She signed the Deep certification.

  Kael watched her, then stood up and gathered her ledger. She didn't say anything as she walked to the door. She just opened it, letting the noise of the city flood in for a moment before closing it again, leaving Elara alone with the signed document and the hum of the vaults.
