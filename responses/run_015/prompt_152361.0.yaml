      *   *Crucial nuance on Risk:* Does shifting thresholds prove Evaluativism? No. It proves that *disease labeling* is sensitive to values, even if the underlying *pathology* is naturalist. Naturalists can accommodate this by saying "We are treating a risk factor, not a disease." But if we *label* the risk factor "Pre-disease," we are smuggling values into the definition.
      *   *Misconception 3 (Verbal Dispute):* The prompt says "which one I should instead let surface and put to work." I should let the "It's just verbal" objection surface because it forces them to admit that *words have power* (insurance, stigma).
