      *   *Candidate 4: Asymptomatic Bacteriuria.*
          *   *Pros:* Biology clear (bacteria present). Treatment clear (don't treat unless pregnant/catheter).
          *   *Cons:* Might feel too infectious-disease specific.
      *   *Selection:* **Mild Hypertension in a Low-Risk 40-Year-Old.**
          *   *Why:* Every M1 sees this. Biology (BP reading) is objective. The "Disease" label (Hypertension) vs. "Risk Factor" is the crux. Treatment (lifestyle vs. meds) is debatable.
          *   *Wait, the prompt asks about Sickle Cell specifically.* "If you would use the sickle-cell trait, say why, and say why not the shifting-threshold case instead."
          *   *Decision:* I should *not* use Sickle Cell due to the identity commitment warning. I should use a shifting-threshold case, but I need to make sure it distinguishes *disease* from *treatment*.
          *   *Better Case:* **Subclinical Hypothyroidism (TSH 5-10, normal T4).**
          *   *Why:* Biology uncontested (lab value). Symptoms often absent (separates illness from disease). Treatment is highly controversial (treat vs. watch). Thresholds vary by guideline. It's not "risk" in the same way as BP, it's a "functional deviation" that may not be "harmful."
          *   *Actually, let's look closer at the prompt's constraint:* "It should let the question of whether to treat come apart from the question of whether there is a disease."
          *   *Refined Case:* **Incidentaloma (e.g., benign adrenal adenoma or small renal cyst).**
          *   *No, too radiological.*
          *   *Refined Case:* **Stage 1 Hypertension (130-139/80-89) in a low-risk patient.**
          *   *Why:* The 2017 ACC/AHA guidelines lowered the threshold, "creating" millions of new patients. Biology (BP) is constant. The *label* changed. Treatment (meds vs. lifestyle) is debated.
          *   *Wait, prompt asks about Sickle Cell vs. Shifting Threshold.* I need to explicitly address this choice. I will recommend *against* Sickle Cell (identity politics distract from metaphysics) and *for* a specific Shifting Threshold case (Hypertension or Prediabetes) but framed carefully.
          *   *Wait, re-reading constraint:* "It should leave the biology uncontested by both sides... something they will actually meet on the wards."
