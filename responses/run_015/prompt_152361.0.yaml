prompt: |-
  I teach a first-year medical school course, and I have one fifty-minute small-group session to get students to see the dispute over whether disease is a descriptive or an evaluative concept as a live disagreement with clinical stakes rather than as a matter of wording. They are midway through their pathophysiology block, have no philosophy background, and are impatient with anything that does not change management — which means the function-based account arrives already looking like common sense. I do not need the dispute explained to me; I need a plan for teaching it. Please give me:

  1. The order in which the components must be introduced, and what collapses if I reorder them. Specifically: where the distinction between the pathological condition, the person's experience of being unwell, and the socially recognized status of being sick belongs, and whether it has to come before they hear the two views at all; where the point belongs that both sides grant that medicine is value-laden and disagree only about whether the value sits in the concept of disease or merely in what we do once we have identified it; and where in the hour I should bring in the conditions defined entirely by future risk — prediabetes, osteopenia, a borderline blood-pressure reading — whose cut-points move when a cheap and well-tolerated drug comes to market. I want them to see that even if the function-based account is granted in full, the line between having the disease and being at risk of it shifts with the cost and side effects of the available intervention. Tell me whether that observation is evidence for the evaluative side, and if it is not, what it actually shows.

  2. The one case that should carry the whole session, together with what it must have and what it must lack. It should leave the biology uncontested by both sides, it should let the question of whether to treat come apart from the question of whether there is a disease, and it should be something they will actually meet on the wards rather than a talking point. Nothing that engages their identity commitments — that eats the hour. If you would use the sickle-cell trait, say why, and say why not the shifting-threshold case instead.

  3. The misconceptions, and the point in the sequence at which each should be headed off. I predict four: that the function-based view just means statistical rarity, so red hair and harmless anatomical variants come out as diseases; that the evaluative view amounts to whatever we say goes; that the whole dispute is verbal, since both views can license the same clinical practice; and that once we have a definition of disease, it settles whether to screen, treat, or tell the patient. Tell me where in the hour to defuse each, which one I should instead let surface and put to work, and which ones I have missed.

  4. The check and the cut. One question I can put to them in the last five minutes — not to define the two views — whose answer would show me that the structure has landed rather than been memorized; and what I should openly decline to settle at this level, saying out loud that I am declining it.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year medical students (M1s). Midway through pathophysiology. No philosophy background. Impatient with theory unless it changes management. Lean towards function-based accounts (Boorse-style) as "common sense."
      *   **Goal:** Make the dispute over disease (descriptive/naturalist vs. evaluative/normativist) feel like a *live disagreement with clinical stakes*, not just semantics.
      *   **Time:** 50 minutes (small group).
      *   **Constraints:**
          *   Need a specific order of components (and consequences of reordering).
          *   Need one central case study (specific criteria: uncontested biology, treat/no-treat separable from disease/no-disease, clinically relevant, avoid identity traps).
          *   Need to address specific misconceptions (timing, which to let surface).
          *   Need a "check" question for the end and a specific "cut" (what to explicitly leave unresolved).
          *   Specific focus on risk conditions (prediabetes, etc.) and whether they support the evaluative view.

  2.  **Deconstruct the Philosophical Content (for the Instructor's sake, though the prompt says they know it):**
      *   *Naturalist/Functionalist (Boorse):* Disease is a deviation from species-typical functional organization. Value enters in *response*, not *definition*.
      *   *Normativist/Evaluative (Engelhardt, Fulford):* Disease implies harm/badness. Value is *constitutive* of the concept.
      *   *The "Risk" Problem:* Conditions like prediabetes depend on treatment thresholds. If treatment becomes cheaper/safer, the "disease" threshold lowers. Does this mean "disease" is evaluative? Or does it mean we are treating *risk factors* (which are naturalist) to prevent *disease*?
      *   *The "Sickle Cell" Problem:* Trait is protective in malaria zones, harmful elsewhere. Is it a disease? Naturalists struggle with context-dependence. Normativists say "harm" dictates it.

  3.  **Drafting Section 1: Order of Components:**
      *   *Goal:* Prevent premature closure on the functionalist view.
      *   *Step 1: The Phenomenological/Social Distinction.* Need to separate *pathology* (body), *illness* (experience), and *sickness* (social role). If I don't do this first, they conflate "feeling bad" with "having disease."
      *   *Step 2: The Two Views.* Introduce Naturalist vs. Evaluative.
      *   *Step 3: The "Value-Laden" Consensus.* Crucial nuance. Both agree medicine involves values. They disagree on *where* the value sits (in the definition vs. in the action). This must come *after* the views are introduced but *before* the risk case.
      *   *Step 4: The Risk/Threshold Case.* This is the hammer. Prediabetes/HTN.
      *   *Reordering Risks:*
          *   If I put the Risk Case *before* the Distinction: They conflate risk with illness.
          *   If I put the Risk Case *before* the Value Consensus: They think Naturalists deny values in medicine entirely (strawman).
          *   If I put the Distinction *after* the Views: They get stuck on "but what if the patient feels fine?" during the theory part.
      *   *The Risk Question:* Does shifting thresholds prove the evaluative view? *Analysis:* Not necessarily. A Naturalist can say "This is a risk factor (natural fact), and we decide to treat based on values." However, if we *call* the risk factor the "disease" (e.g., "Pre-diabetes" vs "Risk of Diabetes"), that labeling *is* evaluative. So, it shows the *boundary* of disease is evaluative, even if the underlying physiology is naturalist.

  4.  **Drafting Section 2: The Central Case:**
      *   *Criteria:* Uncontested biology, treat/no-treat separable from disease/no-disease, clinically relevant, no identity traps.
      *   *Candidate 1: Sickle Cell Trait.*
          *   *Pros:* Classic philosophy example.
          *   *Cons:* Identity trap (race/genetics). Students might get bogged down in social justice/race politics rather than the concept of disease. Prompt explicitly warns against this ("Nothing that engages their identity commitments").
      *   *Candidate 2: Hypertension (Stage 1).*
          *   *Pros:* Very common. Thresholds shift (JNC 7 vs 8 vs ACC/AHA). Biology uncontested (BP is BP).
          *   *Cons:* Might feel too much like the "Risk" case in Section 1.
      *   *Candidate 3: Mild Hypercholesterolemia in an Elderly Patient.*
          *   *Pros:* Biology clear. Treatment debate (statins?) depends on life expectancy/values.
