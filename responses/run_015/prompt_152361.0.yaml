answer: |-
  Here is a teaching plan designed for a fifty-minute small-group session with first-year medical students.

  ### 1. The Order of Components

  You must introduce the components in this specific sequence. Reordering them collapses the distinction between *ontology* (what exists) and *policy* (what we do), which allows students to default to the function-based account as "obvious" before they see the stakes.

  1.  **The Tripartite Distinction (Minutes 0–5):**
      *   **Introduce:** Separate **Pathology** (biological deviation), **Illness** (subjective experience of unwellness), and **Sickness** (socially recognized status/role).
      *   **Why here:** If you introduce the philosophical views first, students will conflate "disease" with "feeling bad." You need them to see that a person can have pathology without illness (asymptomatic HTN) and sickness without pathology (medical student syndrome).
      *   **Collapse Risk:** If you delay this, the subsequent debate becomes mired in "But the patient feels fine!" which is a category error.

  2.  **The Two Views (Minutes 5–15):**
      *   **Introduce:**
          *   *View A (Function-based):* Disease is a breakdown in species-typical function. (Value-neutral description).
          *   *View B (Evaluative):* Disease implies harm or badness. (Value-laden description).
      *   **Why here:** They need the vocabulary before applying it to the hard cases.

  3.  **The "Value Consensus" Point (Minutes 15–20):**
      *   **Introduce:** Explicitly state that **both sides agree medicine is value-laden.** They disagree only on *location*.
          *   *Function View:* Values enter in *response* (to treat or not).
          *   *Evaluative View:* Values enter in *classification* (to name or not).
      *   **Why here:** If you skip this, students will assume the Function View claims medicine is purely objective science. They will reject it immediately as naive. This nuance keeps the Function View live.

  4.  **The Risk/Threshold Conditions (Minutes 20–40):**
      *   **Introduce:** Prediabetes, Osteopenia, Stage 1 Hypertension. Focus on how cut-points move when interventions become cheap/safe.
      *   **Why here:** This is the stress test. It must come after they understand that values can sit in the *response* (Function View) so they can see the argument that we are just treating *risk* (natural fact) based on *values* (cost/side effects).
      *   **The Crucial Interpretation:** Is this evidence for the Evaluative side?
          *   **Answer:** It is **not** definitive proof that the *underlying physiology* is evaluative. A Functionalist can consistently argue: "This is a risk factor (natural fact), not a disease. We choose to treat it based on values."
          *   **What it actually shows:** It shows that the **boundary of the concept** is evaluative. When we rename a "risk factor" as "Pre-disease" (e.g., Pre-diabetes), we are smuggling an evaluation (that this state warrants medical attention) into the definition. It proves that *disease labeling* is a policy tool, regardless of which metaphysical view you hold.

  ### 2. The Central Case

  **The Case:** **The 2017 ACC/AHA Hypertension Guideline Shift.**
  *Specifically:* A 45-year-old patient with a consistent blood pressure of 135/85, no end-organ damage, low 10-year CV risk.

  **Why this case (and not Sickle Cell Trait):**
  *   **Do not use Sickle Cell Trait.** While philosophically classic, it engages identity commitments (race, genetics, historical exploitation). In a 50-minute session with M1s, this invites political/ethical debates that will eat the hour and obscure the metaphysical point about *concept formation*.
  *   **Use Hypertension.**
      *   **Uncontested Biology:** No one disputes the sphygmomanometer reading or the physiology of vascular resistance.
      *   **Separates Treatment from Disease:** Under JNC 7, this patient was "Pre-hypertensive" (monitor). Under ACC/AHA 2017, this patient has "Stage 1 Hypertension" (consider meds). The biology didn't change; the *label* and the *mandate* did.
      *   **Clinical Stakes:** They will see this on wards. It triggers insurance coding, lifestyle counseling, and potential polypharmacy.
      *   **Lacks:** It lacks the "identity trap." It forces them to confront that a guideline committee's value judgment about drug costs vs. stroke risk *created* a disease overnight.

  **What the case must have:**
  *   Explicit guidelines from two different eras (or societies) with different cut-points.
  *   A patient who is asymptomatic (removes "Illness" from the equation).
  *   A drug that is cheap and generic (removes "cost" as a barrier, isolating "side effects/labeling" as the variable).

  ### 3. The Misconceptions

  Here is where to head them off, and which one to weaponize.

  1.  **"Function-based means Statistical Rarity."**
      *   *The Misconception:* "If disease is functional deviation, then red hair or left-handedness is a disease because it's less common."
      *   *When to Defuse:* **Minute 10** (During "The Two Views").
      *   *How:* Clarify that "Species-typical function" refers to *survival/reproductive design*, not statistical frequency. (e.g., Two kidneys is typical function, even if one is statistically common).

  2.  **"Evaluative means Whatever We Say Goes."**
      *   *The Misconception:* "If disease is about values, then I can just decide cancer isn't a disease."
      *   *When to Defuse:* **Minute 15** (During "Value Consensus").
      *   *How:* Emphasize that evaluations are constrained by reality. You cannot value a broken leg as "healthy" because it won't bear weight. Values select from real options; they do not create the options.

  3.  **"The Dispute is Purely Verbal."**
      *   *The Misconception:* "If both sides treat the patient, why are we arguing? It's just semantics."
      *   *When to Defuse:* **DO NOT DEFUSE.** **Let this surface at Minute 35.**
      *   *How to Put to Work:* When a student says, "It's just words, I'm still treating the BP," ask: "If it's just words, why did the insurance company require the new code for reimbursement? Why does the patient feel anxious now but didn't last year?"
      *   *Goal:* Show that *words are interventions*. The label changes the patient's self-conception and the system's response. This makes the metaphysics clinically material.

  4.  **"Definition Settles Management."**
      *   *The Misconception:* "If we agree on what disease *is*, we will agree on whether to *screen*."
      *   *When to Defuse:* **Minute 45** (The Cut).
      *   *How:* Explicitly state that a definition of disease does not generate a protocol. You can agree something is a disease and agree not to treat it (e.g., benign cysts).

  **Missing Misconception:**
  *   **"Naturalist = Objective/True, Evaluative = Subjective/Opinion."**
      *   Students will treat the Function View as "Science" and the Evaluative View as "Ethics." You must correct this implicitly by showing that choosing the "Function" reference class (e.g., age-adjusted norms) is itself a value judgment.

  ### 4. The Check and The Cut

  **The Check (Last 5 Minutes):**
  Do not ask them to define the views. Ask this:
  > *"Imagine we discover a pill tomorrow that makes having red hair fatal at age 50. We have no way to change the hair, only to treat the lethality. Does red hair become a disease **today**, before the pill is distributed?"*

  *   **Why this works:**
      *   If they say **Yes**: They are leaning Evaluative (Harm constitutes disease).
      *   If they say **No**: They are leaning Functionalist (Physiology hasn't changed, only the context of harm).
      *   If they say **It depends on the label**: They understand the "Risk/Boundary" point from Section 1.
      *   *Correct Structural Answer:* The physiology is constant. The *harm* is constant (in the new world). The *classification* depends on whether you view "disease" as the physical trait or the harmful context. It tests if they see the concept as fixed or responsive to consequences.

  **The Cut (What to Decline):**
  You must openly decline to settle **Ontological Truth.**
  *   **Say this:** *"I am not going to tell you which view is the 'True' definition of disease. That is not a medical question; it is a policy choice. Your job is not to solve metaphysics. Your job is to recognize that when you apply a label, you are choosing a tool. Sometimes the Function tool works best (infectious disease); sometimes the Evaluative tool works best (psychiatry, chronic risk). If you leave here thinking one side won, I have failed. If you leave here knowing that your diagnostic code is a value judgment, I have succeeded."*
