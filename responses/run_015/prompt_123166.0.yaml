answer: |-
  Alright, let's dig into this. We all know the setup. List and Pettit, the discursive dilemma: you've got a collective body voting on a set of propositions that are logically interconnected. Say, $P$, $Q$, and $P \land Q \rightarrow C$. If you vote by majority on each proposition independently, you can end up with a set of collective judgments that are logically inconsistent. The group accepts $P$, accepts $Q$, but rejects $C$.

  The standard reaction in the literature—and honestly, most of social choice theory—is to treat this as an engineering problem. The system is "broken" because it violated logical closure. So, we spend all this time designing aggregation rules to fix it. Do we go premise-based? Conclusion-based? Do we restrict the domain of admissible preferences? Do we weight certain voters as experts? The goal is always to restore consistency, to make the group look like a rational agent.

  But I want to push a contrarian take today. Specifically, I want to argue that when we are dealing with *normative* premises—values, rights, political priorities—trying to solve the discursive dilemma is actually the mistake. We shouldn't solve it; we should dissolve it by abandoning the requirement for group-level consistency altogether.

  Here's the core claim: Forcing logical closure on a democratic body is a category mistake. It imports norms of individual rationality onto a pluralistic entity that simply isn't an individual.

  ### The Formal Result vs. The Normative Leap

  First, we need to be precise about what the formal results actually tell us. List and Pettit establish an impossibility theorem: under certain plausible conditions (universal domain, anonymity, systematicity), you cannot guarantee that a majority aggregation function will yield a consistent set of judgments.

  That's a mathematical fact. But notice the leap that happens immediately after. The literature treats this inconsistency as a *defect*. It assumes that a collective body *ought* to be consistent. That is not a formal result; that is a normative claim. And it's a contentious one.

  Why do we assume a legislature, a jury, or a public constituency needs to satisfy the same consistency constraints as a single human mind? For an individual, inconsistency is a failure of reasoning because a single mind has to act on its beliefs. If I believe $P$ and $Q$ but not $C$, and $C$ is the only action I can take, I'm paralyzed. I'm irrational.

  But a collective body isn't a single mind. It's an arena of competing agents. When we demand group consistency, we are essentially demanding that the group simulate a "group mind." As Margaret Gilbert or Philip Pettit might argue, maybe we *want* that for corporate responsibility. But for a democratic body representing a pluralistic society? I'd argue that demanding consistency is actually a form of suppression.

  ### Honest Pluralism vs. Technocratic Sanitization

  Think about normative premises. Let's use the classic tension: "We value maximizing liberty" and "We value maximizing equality." In a complex society, a majority might endorse both premises. But logically, they often trade off. If you force the group to aggregate these into a single, consistent policy conclusion, you force a trade-off that the society hasn't actually resolved.

  If you use a premise-based procedure to ensure consistency, you might derive a conclusion that prioritizes liberty over equality (or vice versa) based on the logical structure, even if the majority of the group wanted to hold both values in tension. You've achieved consistency, but you've lied about the social reality.

  Allowing the group to hold apparently contradictory attitudes isn't a failure of collective reasoning; it's an honest representation of pluralism. It says, "We, as a collective, are committed to Liberty *and* we are committed to Equality, and we haven't agreed on the lexical ordering." That inconsistency isn't paralysis; it's a mandate for ongoing negotiation. It keeps the disagreement alive in the system rather than resolving it technocratically.

  ### The Problem with Procedural Fixes

  This is where the standard procedural fixes get dangerous. When you implement a premise-based aggregation rule to enforce consistency, you are effectively privileging the *logic* over the *politics*. You're saying that the logical relationship between propositions matters more than the actual will of the voters on the specific outcomes.

  If the group votes "Yes" on Liberty, "Yes" on Equality, but "No" on a specific policy that sacrifices Equality for Liberty, a consistency-enforcing rule might override that "No" vote because it follows from the premises. That's a democratic deficit. You've sanitized the disagreement. You've taken a messy, value-laden conflict and hidden it behind a veil of logical coherence.

  In a democratic context, inconsistency can be functional. It allows for what we might call "constructive ambiguity." It lets different coalitions see their values reflected in the collective record, even if those values aren't fully reconcilable. Forcing closure collapses that space. It demands a resolution that doesn't exist socially.

  ### The Pushback (and why this is contested)

  Now, I need to flag this clearly: this is not the settled view. If you talk to a formal epistemologist or a strict social choice theorist, they will push back hard.

  The main counter-argument is about *action-guidance*. A group that is inconsistent cannot act coherently over time. If the legislature endorses contradictory norms today, it might pass contradictory laws tomorrow, leading to unpredictability and a lack of accountability. Pettit, for instance, argues that for a group to be a moral agent—to be held responsible—it must display rational unity. If we abandon consistency, do we lose the ability to hold the collective responsible?

  There's also the credibility issue. If a central bank or a court issues contradictory rulings, markets crash or rule of law erodes. So, the "abandon consistency" move might work for a legislature debating values, but it falls apart for bodies that need to execute specific, coherent plans.

  Furthermore, some argue that inconsistency is a sign of cognitive dissonance at the social level that leads to instability. If we don't force the work of reconciliation, we just kick the can down the road until the contradiction becomes explosive.

  ### Conclusion

  But here's my closing pitch for the seminar: We need to separate the *logic* from the *legitimacy*. The discursive dilemma shows us that majoritarian democracy is logically messy. The standard response is to clean up the logic. My argument is that the messiness is where the legitimacy lives.

  When we deal with normative premises, consistency is an aristocratic virtue, not a democratic one. It requires a single standpoint. Democracy is the recognition that there is no single standpoint. So, rather than designing aggregation rules to force the group to look like an individual rational agent, maybe we should accept that the "collective reason" of a democracy is inherently fragmented. Don't solve the dilemma. Let it breathe. It's not a bug; it's the sound of pluralism working.
