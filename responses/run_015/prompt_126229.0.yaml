  hey, here's that draft for the adversarial collab doc. i kept it pretty raw like you asked—focused on the machinery without the fluff. hope this works for the seminar.

  ***

  ### 1. agreed claims (both sides sign off on this)

  1.  **the closure principle:** we both agree on the formal statement we're testing: if subject S knows proposition p, and S competently deduces q from p (while retaining knowledge of p), then S knows q.
  2.  **nozick's tracking conditions:** we agree on the definitions. for S to know p via method M:
      *   (sensitivity) if p were false, S wouldn't believe p via M.
      *   (adherence) if p were true, S would believe p via M.
  3.  **the tension:** we agree closure feels intuitive for deduction, but strict tracking seems to violate it in entailment cases. specifically the zebra/mule scenario where S knows "zebra" but fails to track "not-mule" because the mule world is too far away or handled differently.
  4.  **the real dispute:** we agree this isn't just verbal semantics. the fight turns on how belief-forming methods get individuated across inference. it matters whether deduction counts as using the same method or switching to a new one.

  ### 2. disagreements table

  | issue | closure defender wording | strict tracking theorist wording |
  | :--- | :--- | :--- |
  | **closure failure & method change** | closure holds even if the cognitive route to q feels different, as long as the deduction is competent. knowledge transfers across the entailment. | closure fails specifically when the tracking method for q differs from p. if the method shifts during deduction, the tracking conditions reset and might not be met. |
  | **modal proximity for q** | we check whether S tracks q in nearby worlds relative to the actual world (where p is true and known). | we check whether S tracks q relative to worlds where p is false. the risk assessment for q depends on the failure conditions of p. |

  ### 3. cruxes & predictions

  both sides agree these are the make-or-break points. we're using a modified zoo case for both to keep it stable.

  **the case setup:** S is at the zoo looking at a pen labeled "Zebras". S forms belief p ("that's a zebra") via vision. S knows p entails q ("that's not a painted mule disguised as a zebra"). however, in this modified scenario, the zoo has a known history of using high-tech holographic disguises for mules in nearby possible worlds, but not in the actual world.

  #### crux one: the "method-transfer" problem
  **question:** if S knows p via perception and derives q via logic, does q inherit p's tracking properties or does logical derivation count as a new method?

  *   **closure defender prediction:** the deduction preserves the knowledge status. since vision tracks "zebra" in the actual setup, and logic is truth-preserving, q inherits the warrant. the holographic disguise in nearby worlds doesn't matter because the method (vision + deduction) is stable enough in the actual world context. S knows q.
  *   **tracking theorist prediction:** logical derivation counts as a method shift. vision tracks p, but the belief in q is now held via inference. we have to check if *this* new method tracks q. since the holographic disguise exists in nearby worlds, S would still believe "not-mule" even if it were a disguised mule (because the disguise fools vision). sensitivity fails. S does not know q.

  #### crux two: modal-proximity evaluation
  **question:** do we check whether S tracks q in nearby worlds simpliciter, or only in worlds near the ones where p fails?

  *   **closure defender prediction:** evaluate relative to the actual world. since S is actually looking at a zebra, we check nearby worlds where the actual situation holds. in most nearby worlds where there is a zebra, it's not a mule. the holographic mule worlds are too distant to undermine knowledge of q. S knows q.
  *   **tracking theorist prediction:** evaluate relative to worlds where p is false. to know q (not-mule), S must be sensitive to the falsity of q. but q is false only in worlds where it is a mule (which are worlds where p is false). since the holographic mechanism makes those worlds very close modal neighbors (due to the zoo's history), S fails to track q in the relevant ~p worlds. the proximity is measured from the failure state of p, not the success state. S does not know q.

  ***

  let me know if you want to tweak the wording on the table before we send it to the prof. i think the crux predictions highlight the split pretty well.
