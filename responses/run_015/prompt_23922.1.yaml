prompt: |-
  I'm in a course on the philosophy of promising -- the "why do promises even bind?" stuff -- and I keep getting stuck on a one-liner a classmate keeps throwing at me. We were going over this thought experiment where someone makes a promise they already know they're not going to keep, like they promise to do X while fully intending to do Y instead. My take was that it's still a genuine promise and breaking it is still a wrong, because the obligation comes from the act of promising itself, not from whatever intention the promiser happens to have. And he just shuts me down with "well, don't make promises you cant keep." As if that settles it. I'm pretty sure the slogan is doing different work depending on how you read it, but I cant pin down what.

  Can you take "don't make promises you cant keep" and lay out the different precise theses it could actually be claiming? I'm thinking "can't keep" might be doing different jobs -- ability, intention, or knowledge -- and that the slogan might be a claim about whether such a thing is a promise at all, or a claim about whether making it is independently wrong, or just a practical warning about bad outcomes. And for each reading I want to know whether it's defensible and whether it actually supports dismissing my thought experiment.

  Organize it so I can bring it to office hours:
  - "The slogan in plain terms" -- a short paragraph (3-4 sentences) restating the slogan in its most natural everyday sense, so we have a baseline before we start splitting it.
  - "The readings" -- the meat. A list of 4-6 distinct readings, i.e. the precise theses the slogan could express. For each, give it a short name, state the thesis in one or two sentences, and say what "can't keep" is doing in that reading (ability vs. intention vs. knowledge).
  - "Which reading does the work" -- for each reading, a sentence or two on whether it actually supports the dismissal of my case (that a promise made without the intention to keep it is still a binding promise whose breaking is a wrong), and if so how, plus the obvious counter.
  - "My verdict" -- a short section where you say which reading my classmate is most likely invoking, which readings are just trivial platitudes, which are substantive and defensible, which are actually false, and what I should really say back to him.
