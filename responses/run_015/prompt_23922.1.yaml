answer: |-
  ### The Slogan in Plain Terms
  In everyday conversation, "don't make promises you can't keep" is primarily a piece of practical advice about reliability and reputation. It warns people not to commit to future actions they foresee will be impossible to complete, usually to avoid letting others down or looking untrustworthy. It treats a promise largely as a prediction of future behavior that ought to be accurate, rather than focusing on the normative obligation created by the speech act itself.

  ### The Readings

  **1. The Prudential Warning**
  *   **Thesis:** You should avoid promising because breaking a promise leads to bad consequences for your reputation or relationships.
  *   **What "can't" means:** Future ability or likely outcome.
  *   **Does it support the dismissal?** No. This admits a promise *was* made and that breaking it is bad (which supports your view), but it frames the issue as practical advice rather than a philosophical claim about obligation.
  *   **Obvious Counter:** This is advice, not an argument; it explains *why* one shouldn't break a promise, not whether the obligation exists in the first place.

  **2. The Moral Prohibition on Making**
  *   **Thesis:** It is morally wrong to *utter* a promise if you know at the time that you will not fulfill it, regardless of whether the promise generates an obligation.
  *   **What "can't" means:** Knowledge or foreseeability (you know you won't do it).
  *   **Does it support the dismissal?** Partially. It shifts the moral weight from the *breaking* of the promise (your point) to the *making* of the promise (his point), but it doesn't deny the promise exists.
  *   **Obvious Counter:** One can commit two wrongs: the wrong of lying (making the promise) and the wrong of betrayal (breaking it); acknowledging the first doesn't erase the second.

  **3. The Insincerity (Voidness) Thesis**
  *   **Thesis:** A statement made without the intention to perform is not a promise at all, but a lie; therefore, no obligation is generated.
  *   **What "can't" means:** Intention (psychological inability to commit).
  *   **Does it support the dismissal?** Yes. This directly attacks your claim that it is a "genuine promise," arguing that without intent, the speech act is null and void.
  *   **Obvious Counter:** Standard speech-act theory (e.g., Searle, Rawls) holds that insincere promises are still promises (abuses of the practice), which is why we call them "broken promises" rather than just "lies."

  **4. The Metaphysical Impossibility Thesis**
  *   **Thesis:** An obligation to do X cannot exist if doing X is physically or metaphysically impossible ("ought implies can").
  *   **What "can't" means:** Physical capacity or logical possibility.
  *   **Does it support the dismissal?** No. In your thought experiment, doing X is possible; the agent simply chooses Y. This reading is irrelevant to cases of intentional non-performance.
  *   **Obvious Counter:** The thought experiment stipulates the agent *could* do X but chooses not to; this reading only applies to cases of genuine incapacity (e.g., promising to fly unaided).

  **5. The Epistemic Norm Thesis**
  *   **Thesis:** One is only permitted to promise if one knows one will fulfill the promise; lacking this knowledge makes the promise improper.
  *   **What "can't" means:** Epistemic certainty.
  *   **Does it support the dismissal?** Weakly. It suggests the promise was improperly made, but like Reading 2, it doesn't necessarily negate the obligation once the promise is out in the world.
  *   **Obvious Counter:** We routinely accept promises made under uncertainty (e.g., "I promise to be there by 5, traffic permitting") as binding, provided reasonable effort is made.

  ### My Verdict

  Your classmate is most likely conflating **Reading 2 (Moral Prohibition)** with **Reading 3 (Insincerity Thesis)**. They are treating the slogan as a substantive philosophical claim (that lack of intent voids the promise) when it is usually just a trivial platitude (Reading 1: Prudential Warning). Readings 1 and 4 are trivial or irrelevant to your specific case; Reading 2 is defensible but doesn't disprove your point (since two wrongs can coexist); Reading 3 is the only one that actually threatens your argument, but it is highly controversial in the literature.

  **What to say back:**
  Tell him you agree it is wrong to *make* a promise without intent (Reading 2), but ask him specifically if he believes such a statement fails to count as a promise *at all* (Reading 3). If he says it's still a promise, then you win: the obligation exists, and breaking it is a second wrong. If he says it's not a promise, ask him why we colloquially call it "breaking a promise" rather than just "telling a lie." You can argue that the social practice of promising creates an expectation in the promisee that is violated regardless of the promiser's secret intent, which is where the binding force comes from.
