  hey — i'm a phd student in epistemology running a small grad seminar (around 10 people, 90 min) on reasoning and humility. i want an in-class game or structured simulation that makes participants actually feel the pull of inside-view reasoning versus taking the outside view, and why epistemic modesty is so hard to maintain even when you intellectually accept base rates. don't lecture them up front — the rules should make them run into the tension themselves, and only name the distinction in the debrief.

  you are an expert in decision theory and philosophy of science. think carefully, start with a brief brainstorm of mechanics, then lay out the full design. setting: philosophy grad seminar, 10 students, 90 minutes. they should leave seeing that inside-view transparency isn't just statistical ignorance — it's structurally seductive.

  i want you to inject a niche mechanic i'm calling the 'parallax deck': each student draws a hidden reference-class card that fixes there real statistical outcome distribution, plus visible 'narrative cards' giving specific internal reasons. they have to place point-bets on whether they'll solve a puzzle, defending each bet with reasoning. they don't know that some reference classes are stacked badly. payoff is in seminar prestige points, not cash.

  include: clear rules, how the debrief maps moments onto inside/outside view and modesty, an honest note on which feature of modesty the game can't reproduce and you'll have to supply, and a prediction of what will predictably go wrong the first run. also please don't give me a bibliography or citation list — i just need something i can run monday. theres probably a typo or two in here but thats ok.
