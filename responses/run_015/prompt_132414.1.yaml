  # Instructor's Notes & Reality Check

  ### 1. The Limitation (What the Game Can't Reproduce)
  **The Agency Gap:** In the game, the Hidden Card (Context) is purely random and immutable. In real epistemic practice, we *can* sometimes change our reference class or mitigate structural risk (e.g., running more trials, preregistering studies, seeking diverse critique). The game risks teaching a fatalistic form of humility ("Nothing matters, just roll the dice").
  **Fix in Debrief:** Explicitly state: "In the game, the Context Card was fixed. In reality, epistemic modesty isn't about surrendering agency; it's about *searching* for your Hidden Card. It's asking: 'What structural factors am I ignoring?' before you bet."

  ### 2. Prediction: What Will Go Wrong First Run
  **The "Hack" Attempt:** Grad students are competitive. At least two will try to deduce their Context Card based on the Narrative Cards. They will argue: "If I have 'Logic Coursework' and 'Peer Review', surely I'm in the Alpha group."
  *   **Why:** They will assume correlation between Narratives and Context to restore a sense of control.
  *   **Response:** In the debrief, highlight this. "You tried to turn the Outside View back into an Inside View by finding a narrative pattern. This is the resistance to modesty."

  **Time Creep:** The puzzle solving will run long.
  *   **Fix:** Be ruthless with the 15-minute timer. Use a visible countdown. The pressure is part of the "Narrative" (stress).

  **The "Unfair" Complaint:** Someone will complain that the dice roll invalidates their skill.
  *   **Response:** Validate this. "Exactly. That is the feeling of the Outside View crashing into your Inside View. Hold onto that frustration. That is the feeling of humility."

  ### 3. Logistics Checklist for Monday
  *   [ ] **Print Context Cards:** 5 Alpha, 5 Beta. (Back them with opaque paper so they can't be seen through).
  *   [ ] **Print Narrative Cards:** 20 total, mixed bag of positive/negative/neutral.
  *   [ ] **Print Puzzles:** 10 copies. Ensure answer key is ready.
  *   [ ] **Dice:** 10d10 or phone app ready.
  *   [ ] **Tracking:** Whiteboard space for PP scores.
  *   [ ] **Timer:** Visible countdown.

  ### 4. Why This Works for Epistemology
  This simulation bypasses the intellectual assent to base rates ("Yes, I know statistics matter") and targets the *visceral* resistance to them. By tying prestige (social capital) to the outcome, you replicate the stakes of academic publishing. When they lose points despite solving the puzzle, they don't just understand reference classes; they *resent* them. That resentment is the pedagogical hook. It shows that epistemic modesty is hard not because we are bad at math, but because it requires us to accept that our internal reasoning is not the sole driver of truth.
