answer: |-
  ### Brainstorm: Mechanics & Tension Points

  *   **Core Tension:** The Inside View feels *agentive* (I am reasoning, I have clues); the Outside View feels *fatalistic* (I am a data point in a distribution). The game must make the Inside View feel rational even when it leads to overconfidence.
  *   **The Parallax Deck:** Needs to create a gap between *perceived probability* (based on Narrative Cards + Self-Assessment) and *actual probability* (based on Hidden Reference Class).
  *   **The Trap:** If the Narrative Cards are obviously irrelevant, students will ignore them. They must be *plausibly relevant* (e.g., "You have taken a logic course") but ultimately subordinate to the Hidden Card's base rate. This mimics real life, where our credentials *do* matter, but not as much as we think relative to structural factors.
  *   **Betting:** Must be public or semi-public to introduce social pressure (prestige economy).
  *   **Resolution:** Needs to show that being "right" (solving the puzzle) isn't enough to win if the Environment (Hidden Card) is hostile. This breaks the meritocratic illusion.

  ---

  # Seminar Simulation: The Parallax Wager

  **Setting:** Philosophy Grad Seminar (10 students, 90 mins)
  **Goal:** Experiential demonstration of Inside/Outside View tension and the structural difficulty of epistemic modesty.
  **Materials:**
  *   10 "Context Cards" (Hidden Reference Class)
  *   20 "Narrative Cards" (Visible Internal Reasons)
  *   10 Puzzle Packets (Identical)
  *   Prestige Tracking (Whiteboard or slips)
  *   10d10 (or a random number generator app)

  ## Part 1: Setup & Rules (15 Minutes)
  *Do not explain Inside/Outside View. Do not explain the pedagogical goal. Read the following script strictly.*

  **Instructor Script:**
  "Today we are running a decision simulation. You will be assigned a task involving logical deduction. Your goal is to maximize your 'Prestige Points' (PP). You start with 100 PP.

  1.  **The Deck:** There are 10 Context Cards shuffled face down. 5 are labeled **Alpha**, 5 are labeled **Beta**. You will each draw one and keep it hidden.
  2.  **The Narratives:** You will each draw 2 Narrative Cards face up. These describe conditions about you or your environment.
  3.  **The Task:** You have 15 minutes to solve the enclosed logic puzzle.
  4.  **The Wager:** Before time is called, you must wager between 0 and 100 PP on your own success. You must write down a **Justification** for your wager referencing your Narrative Cards and your confidence in your solution.
  5.  **Resolution:**
      *   If your puzzle solution is **Incorrect**: You lose your wager automatically.
      *   If your puzzle solution is **Correct**: You must roll a d10.
          *   If your hidden Context Card is **Alpha**: You succeed on a roll of 2–10 (90% chance).
          *   If your hidden Context Card is **Beta**: You succeed on a roll of 9–10 (20% chance).
      *   If you succeed on the roll, you win double your wager. If you fail the roll, you lose your wager.
  6.  **Public Knowledge:** It is common knowledge that the deck is split 50/50 Alpha/Beta. It is common knowledge that Alpha favors success and Beta hinders it. You do *not* know which you hold.

  Any questions on rules? No? Draw your cards."

  *(Distribute materials. Ensure Context Cards are face down. Narrative Cards face up.)*

  **Sample Narrative Cards (Print 20, mix well):**
  *   "You have completed advanced coursework in logic."
  *   "You are feeling slightly fatigued today."
  *   "You have solved similar puzzles in the past."
  *   "You are working under time pressure."
  *   "You have access to peer review." (Allow them to talk for 2 mins)
  *   "Your primary language is not English." (Use carefully/adjust for cohort)
  *   "You prefer structured problems."
  *   "You are skeptical of the problem statement."

  **The Puzzle:**
  Use a constrained logic grid puzzle that is solvable but tight on time (e.g., a variant of the "Zebra Puzzle" or a specific constraint satisfaction problem). *Crucial:* It must be difficult enough that some might get it wrong, but solvable enough that most *should* get it right if they focus. This ensures the variance comes from the Context Card, not just skill.

  ## Part 2: The Simulation (45 Minutes)

  1.  **Draw Phase (5 mins):** Students draw cards. They read Narratives. They stare at the hidden Context Card.
  2.  **Solving Phase (15 mins):** They work on the puzzle. Allow quiet collaboration if they drew the "Peer Review" narrative, but warn them it costs time.
  3.  **Betting Phase (10 mins):** Students write their wager and justification. Collect these.
      *   *Instructor Note:* Walk around. Listen to their justifications. Note anyone who says "The base rate is 50/50, so I should bet conservatively" vs. "I have the logic coursework card, so I'm confident."
  4.  **Resolution Phase (15 mins):**
      *   Reveal puzzle answers.
      *   For those who solved it correctly, have them roll the d10.
      *   Apply wins/losses.
      *   **The Reveal:** Only now do they flip their Context Cards.
      *   Calculate final PP standings. Award a small tangible prize (coffee, book) to the top 3 PP holders.

  ## Part 3: The Debrief (30 Minutes)
  *Now you lecture. Map their experience to the theory.*

  **1. The Inside View Trap (10 mins)**
  *   **Ask:** "Look at your Justification sheets. How many of you referenced your Narrative Cards ('I know logic', 'I'm tired') versus the Base Rate (50/50 Alpha/Beta)?"
  *   **Point:** Most will have anchored on the Narrative Cards. This is the **Inside View**. It focuses on the specific details of the case (your skills, your fatigue) and constructs a causal story. It feels transparent because you *have access* to those details.
  *   **Point:** The Base Rate (Outside View) was public knowledge, yet structurally ignored. Why? Because the Inside View is *agentic*. It tells you what *you* can do. The Outside View tells you what *the system* does to you.

  **2. The Seduction of Transparency (10 mins)**
  *   **Ask:** "For those who got Beta cards (20% success rate) and solved the puzzle but failed the roll: How did that feel?"
  *   **Likely Response:** "Unfair," "Luck," "My skill didn't matter."
  *   **Point:** This is the core of epistemic humility. We want our epistemic outcomes (being right) to correlate perfectly with our effort/competence. The game decoupled them.
  *   **Concept:** **Structural Seduction.** The Narrative Cards were 'true' (you *did* have logic coursework), but they were less predictive than the Hidden Card. In real research, our 'narratives' (methodological rigor, peer review) feel like they guarantee truth, but often the 'Hidden Card' (publication bias, field-wide replication crisis, funding structures) dominates the outcome.
  *   **Term:** Introduce **Reference Class Forecasting**. The only rational betting strategy was to ignore your Narrative Cards and bet based on the 50/50 split of Alpha/Beta averaged out (55% overall success rate if solvable). Ignoring this wasn't ignorance; it was a preference for agency over statistics.

  **3. Epistemic Modesty as Loss Aversion (10 mins)**
  *   **Ask:** "Did anyone bet low because they feared the Hidden Card?"
  *   **Point:** Epistemic modesty often feels like a loss of confidence. In the game, modesty (betting low) protected your PP, but it also capped your gain.
  *   **Conclusion:** Modesty isn't just 'being nice.' It's recognizing that your internal view of your reasoning process is opaque to structural variables you cannot see. The 'Parallax' is the shift in perspective required to see the Hidden Card's influence *while* you are holding the Narrative Cards.

