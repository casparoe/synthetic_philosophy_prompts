answer: |-
  You stand on a runway while a commercial airliner coasts inertially over your head at 900 kilometers per hour (250 meters per second). At the exact moment the plane passes you, both you and the pilot define your respective planes of simultaneity to include a specific event occurring at a ground station 1,000 kilometers away along the flight path. According to the Lorentz transformation for simultaneity in special relativity, the time difference $\Delta t$ between your two definitions of "now" at that distant location is given by $\Delta t = vx/c^2$, where $v$ is the relative velocity, $x$ is the distance, and $c$ is the speed of light. Plugging in the ordinary values ($v = 250$ m/s, $x = 1,000,000$ m, $c \approx 3 \times 10^8$ m/s), the disagreement amounts to $\Delta t \approx (250 \times 10^6) / (9 \times 10^{16})$, which equals approximately 2.8 nanoseconds. While you judge the event at the ground station to be happening at $t=0$, the pilot judges that same event to be happening 2.8 nanoseconds in their future, yet both judgments are physically equally valid within the framework of special relativity.

  **1. Conclusions and Replies**
  The block-universe theorist concludes that because the pilot's "future" event is just as present for them as your "now" is for you, and because there is no metaphysical reason to privilege your frame over theirs, the event at the ground station must exist simpliciter. Therefore, the future is as real as the present, and spacetime is a static four-dimensional block. The presentist replies that existence is restricted to the immediate present, so either one frame must be privileged (contradicting relativity) or existence itself must be relative to a frame. The growing-block theorist argues that the past and present exist but the future does not; however, they face the same difficulty as the presentist because the pilot's "present" includes events that are in your "future," forcing them to either deny the pilot's ontology or accept that the future edge of the block is frame-dependent.

  **2. The Single Premise and Scale Invariance**
  The single premise doing all the work is the **Principle of Ontological Frame-Invariance**: *what exists cannot depend on an observer's state of motion.* This premise forces the divergence of simultaneity planes to become a divergence in ontology unless all times are equally real. The mundane case and Penrose's Andromeda-scale version stand or fall together because the logic relies entirely on the non-zero value of $\Delta t$, not its magnitude. In the equation $\Delta t = vx/c^2$, increasing the distance $x$ from 1,000 kilometers to 2 million light-years (Andromeda) merely scales the result from nanoseconds to days; it does not alter the structural fact that the planes of simultaneity tilt relative to one another. If the argument fails at the nanosecond scale because the time difference is "too small to matter ontologically," it must fail at the cosmological scale for the same reason, as special relativity treats all inertial frames and distances uniformly. Conversely, if a 2.8-nanisecond discrepancy is sufficient to establish that the pilot's "now" is ontologically robust, the block universe follows immediately without needing galactic distances.

  **3. Advice for the Presentist**
  The presentist should adopt **Relativized Presentism**, conceding that existence is not absolute but relative to an inertial frame, meaning there is no single, objective "now" that defines reality for the universe. The cost of this reply is severe: it abandons the core presentist intuition that there is a unique, moving boundary between being and non-being that everyone shares. By making existence frame-dependent, the presentist saves their view from the Rietdijk–Putnam argument but sacrifices the objective temporal structure that motivated presentism in the first place, effectively reducing their position to a claim about perspective rather than a claim about the fundamental nature of reality.
