answer: |-
  ### Examiner's Contextual Note: Conceptual Framework
  Before grading, it is necessary to establish the conceptual distinctions this question tests, and the common errors associated with them:
  1.  **Relational vs. Legal/Institutional Categories:** Students must distinguish between *informal social obligations* (clientelism, gift-giving) and *formal fiduciary duties* (public office).
      *   *Common Error:* Treating all informal exchange as corruption (legalistic reductionism) or treating all abuse of office as legitimate patronage (cultural relativism).
  2.  **Intent/Function vs. Form:** In part (b), the distinction lies between a gift's *social function* (solidarity) and its *transactional function* (influence).
      *   *Common Error:* Identifying the boundary solely by the *value* of the gift rather than the *expectation of reciprocity* regarding official action.
  3.  **Universalism vs. Institutional Pre-conditions:** In part (c), students must navigate whether "public trust" is a transcultural norm or dependent on a specific (Western) state-society differentiation.
      *   *Common Error:* Asserting a universal core while simultaneously defining that core using culturally specific institutional terms (e.g., "constitutional definition"), creating a performative contradiction.

  ***

  ### Grade: 56% (High 2:2)

  **Scale:** British Undergraduate Honours Classification
  *   **First (70%+):** Outstanding, original, logically flawless.
  *   **Upper Second (60-69%):** Strong, clear, minor weaknesses.
  *   **Lower Second (50-59%):** Competent, addresses the question, but significant analytical or logical flaws.
  *   **Third (40-49%):** Basic understanding, major omissions.

  ***

  ### Point-by-Point Comments

  **Part (a): Clientelism vs. Corruption**
  *   **Strengths:** You correctly identify the core conceptual distinction: clientelism as a *relational* moral economy (Scott) versus corruption as a *legal-institutional* breach of fiduciary duty. Your phrasing ("interpersonal duty that precedes the state" vs. "fiduciary duty that attaches to office") is precise and demonstrates a good grasp of the political philosophy literature.
  *   **Weaknesses:** The prompt asked you to explain why conflating the two *over-moralises patronage* or *under-moralises abuse*. You define the difference well, but you do not explicitly unpack the *consequences* of the error. You imply that treating clientelism as corruption judges a moral duty as immoral, but you do not use the specific terminology requested to explain the *moralising* dynamic. This is a minor omission but prevents the answer from reaching the 2:1 band.

  **Part (b): Ceremonial Gift-Giving**
  *   **Strengths:** You successfully identify the social function of gifts (maintaining face, collective identity) and distinguish this from transactional exchange. This shows you understand that not all reciprocity is market-based.
  *   **Weaknesses:** Your boundary condition for corruption is too narrow. You state a gift becomes bribery only when tied to an *"explicit quid pro quo."* In anti-corruption theory (and law), implicit understandings or the *appearance* of compromised impartiality often suffice to define bribery. By requiring "explicitness," you rely on a legalistic formalism that ignores how corruption often operates through subtle signalling. This undermines your critique of Western zero-tolerance policies, as those policies often target implicit bias, not just explicit contracts.

  **Part (c): Universalism and Conceptual Imperialism**
  *   **Strengths:** You engage ambitiously with the tension between universal norms and local contexts. Your invocation of a "minimal morality" regarding stewardship is a strong philosophical move.
  *   **Critical Logical Inconsistency:** This is the primary reason the grade is capped at a 2:2. In Paragraph 3, you argue the charge of conceptual imperialism is *"overstated"* because a universal core (betrayal of trust) exists across traditions. However, in Paragraph 4, you argue this core applies *"only where a formal public sphere exists"* and that in kin-based systems, the concept of corruption has *"no purchase."*
      *   *The Contradiction:* If the concept of corruption requires a Western-style "formal public sphere" or "constitutional definition" to exist (as you argue in Para 4), then applying Western anti-corruption standards to kin-based societies *is* conceptual imperialism, because you are imposing a category that locally "has no purchase." You cannot argue simultaneously that (1) the charge of imperialism is overstated, and (2) the standards are only appropriate for societies that have already adopted Western frameworks. The latter conclusion effectively concedes the imperialism argument for non-Westernized states.
  *   **Attribution:** Your use of James C. Scott is generally good, but claiming Scott argues clientelism is an *"anti-corruption mechanism"* is a bold interpretation. Scott typically frames it as a survival strategy or a moral expectation of the peasantry, not necessarily a normative check on elite extraction. This is not a fatal error, but it lacks nuance.

  **Overall Assessment**
  This is a competent essay with clear writing and a strong grasp of key terminology (fiduciary, moral economy, public/private distinction). You successfully handle the relational vs. legal distinction in Part (a). However, the argument collapses in Part (c) due to the internal contradiction regarding the universality of the "public trust" concept. You posit a universal core but then define it in a way that excludes non-Western institutional forms, inadvertently validating the charge of imperialism you sought to refute. To reach a 2:1 or First, you would need to resolve this tension—perhaps by arguing that "trust" exists in kin-systems but is *betrayed* differently, rather than arguing the concept itself is inapplicable.

  **Actionable Advice:**
  1.  **Check for Performative Contradictions:** Ensure your conclusion does not undermine your premise. If you argue a norm is universal, ensure your criteria for applying it do not rely on culturally specific institutions.
  2.  **Precision on Boundaries:** Avoid legalistic definitions (e.g., "explicit") when discussing ethical boundaries. Consider implicit norms and structural impacts.
  3.  **Address the Prompt's Verbs:** Ensure you explicitly explain the *mechanisms* requested (e.g., *how* conflating terms leads to over-moralising), rather than just defining the terms.
