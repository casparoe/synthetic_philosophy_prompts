answer: |-
  Here is a specification of desiderata for the genus of idealized-preference accounts, structured for your third chapter.

  ### I. The Desiderata Specification

  To count as a member of the *idealized-preference* family (rather than an objective-list or actual-preference account), a theory must satisfy the following conditions. I have distinguished between **Non-Negotiable** (failure here exits the genus) and **Local Commitments** (failure here merely selects a specific subtype).

  **1. The Non-Substitution Constraint (Non-Negotiable)**
  *   **Specification:** The output of the idealization operator must be recognizably continuous with the agent's actual motivational structure. It cannot prescribe what a *different* agent (even a better one) would want, unless that difference is derivable from the actual agent's own latent commitments.
  *   **Justification:** Without this, the account collapses into paternalism or objective value theory. If the idealized preference diverges too far from the actual seed, the authority of the preference ceases to be *the agent's* authority.
  *   **The Anchor:** This addresses your "Anchor problem." It requires holding fixed the *constitutive ends* of the agent while allowing improvement on *instrumental beliefs* and *cognitive processing*.

  **2. The Normative Correction Condition (Non-Negotiable)**
  *   **Specification:** The output must differ from actual preferences in cases of demonstrable error (ignorance, logical inconsistency, akrasia, adaptive preference).
  *   **Justification:** Without this, the account collapses into status-quo actual-preference theory. Idealization must do normative work; it must be possible for the agent to be *wrong* about their own good.
  *   **The Anchor:** This addresses the other side of the "Anchor problem." It mandates what may be improved.

  **3. The Operationalizability Constraint (Local Commitment)**
  *   **Specification:** The idealization operator must be approximable by a finite system with access to the agent's behavioral and self-report data.
  *   **Justification:** You specified the purpose is to hand this to an engineer. Metaphysically robust but uncomputable idealizations (e.g., requiring omniscience) fail this specific use-case.
  *   **Status:** This is an artifact of your engineering frame, not a condition on the metaphysical truth of idealized preferences. A preference can be idealized even if unknowable.

  **4. The Coherence Requirement (Local Commitment)**
  *   **Specification:** The output preferences must satisfy formal consistency conditions (transitivity, completeness) over the relevant domain.
  *   **Justification:** Required for decision-theoretic integration.
  *   **Status:** This is a rationalist prejudice. It assumes the agent's "true self" is logically unified. It excludes accounts where the ideal self is essentially fragmented or dialectical.

  **5. The Seed-Sensitivity Condition (Disputed/Local)**
  *   **Specification:** The idealized output must depend on the causal history of the agent, not merely their current state vector. Two agents with identical current preferences but different histories of acquisition (e.g., one brainwashed, one reasoned) should ideally yield different extrapolations.
  *   **Justification:** Preserves the narrative identity of the agent.
  *   **Status:** This is the crux of your "Diachronic-Seed problem." Demanding Seed-*Insensitivity* is a commitment to a "True Self" essentialism (that history washes out). Demanding Seed-*Sensitivity* is a commitment to historical constitutivism.

  **6. The Trustee-Authority Condition (Non-Negotiable)**
  *   **Specification:** The output must generate a normative mandate for a third-party trustee that overrides the agent's actual occurrent desires in high-stakes scenarios without violating the agent's autonomy.
  *   **Justification:** This defines the functional role of the theory in your high-stakes context. If the output is merely deliberative advice, it fails the "trustee" test.

  ---

  ### II. The Negative Structure (Incompatibilities)

  You asked for the pairs of desiderata that cannot be jointly satisfied. These tensions define the failure modes of the genus.

  **1. Radical Correction vs. Non-Substitution (The Collapse Tension)**
  *   **Conflict:** To satisfy **Normative Correction**, you must alter preferences that are based on false beliefs or cognitive biases. However, since an agent's identity is largely constituted by their belief-desire network, sufficient correction inevitably alters the identity.
  *   **Result:** If you correct enough to ensure the agent isn't harmed by ignorance, you often violate **Non-Substitution**. The "Ideal You" is often a stranger to the "Actual You." This is the primary reason the genus tends to collapse into objective value theory.

  **2. Seed-Insensitivity vs. Historical Responsiveness (The Diachronic Tension)**
  *   **Conflict:** Your supervisor is correct. If you demand **Seed-Insensitivity** (to ensure that two agents with the same current state converge on the same ideal, avoiding arbitrariness), you violate **Historical Responsiveness**. You lose the ability to distinguish between a preference formed through reasoning and one formed through manipulation, provided they currently feel the same.
  *   **Result:** A Seed-Insensitive account cannot diagnose adaptive preference or brainwashing if the adaptation is psychologically complete. A Seed-Sensitive account risks making the idealization path-dependent to the point of uncomputability.

  **3. Operationalizability vs. Counterfactual Depth (The Epistemic Tension)**
  *   **Conflict:** To satisfy **Operationalizability**, the counterfactual regime (more knowledge, more reflection) must be shallow enough to simulate. To satisfy **Normative Correction**, the regime must be deep enough to uncover errors the agent cannot currently conceive.
  *   **Result:** Deep idealization is computationally intractable; tractable idealization is often too shallow to correct for structural ignorance.

  ---

  ### III. The Exclusionary Requirement

  The single requirement that does the most exclusionary work is the **Non-Substitution Constraint**.

  It is the narrowest part of the hourglass. Objective-list theories fail it because they do not track the agent's motivations. Actual-preference theories fail it because they refuse to correct the agent (violating Normative Correction, which forces them to try to meet Non-Substitution while changing things, leading to collapse). Most "Ideal Observer" theories fail it because the ideal observer is defined by properties (omniscience, impartiality) that no human agent can occupy without ceasing to be that specific human agent. It knocks out the largest share of the family because it demands a metaphysical continuity that psychological change inherently threatens.

  ---

  ### IV. Correctness vs. Artifacts (Prejudices)

  You suspected two items on your list were prejudices. You are right.

  1.  **The Coherence Requirement:** This is a rationalist artifact. It assumes that a "better" version of an agent is a more *consistent* one. There is no philosophical necessity for an idealized self to be transitive or complete; they might simply be more robustly dialectical. Demanding coherence privileges decision-theoretic tidiness over psychological reality.
  2.  **Operationalizability:** As noted, this is a pragmatic artifact of your engineering frame. It is not a condition on whether an idealized preference *exists*, only on whether it can be *used*. Treating it as a correctness condition on the theory itself conflates epistemology with metaphysics.

  ---

  ### V. Silent Satisfactions and Ignorances

  Most accounts in the family silently satisfy **Normative Correction** (by stipulation) and **Trustee-Authority** (by intent). They silently ignore **Seed-Sensitivity**, typically assuming a convergence function that washes out historical path-dependence to ensure a unique solution, thereby smuggling in an essentialist notion of the self while claiming to respect individual identity.
