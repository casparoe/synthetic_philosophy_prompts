  # Sorting Instrument: The Logical Space of Violence Declinism

  ## 1. The Dimensions

  Before navigating the decision tree, note the five independent axes along which positions on violence diverge. Answers on one axis do not logically dictate answers on another, though they often correlate in practice.

  1.  **Ontology of Harm:** Does violence require a direct agent inflicting bodily damage, or does it include structural conditions (famine, deprivation) caused by policy without a specific blow? *Independent of Moral Patients.*
  2.  **Moral Patients:** Is the measure restricted to human beings, or does it include all sentient animals? *Independent of Ontology; one can be a structural expansionist for humans only, or a bodily restrictionist who includes animals.*
  3.  **Aggregation Unit:** Is the trend measured by absolute counts of victims, rates per capita, or lifetime risk? *Absolute counts and rates are mathematically linked but conceptually distinct; lifetime risk collapses into rates only if time-period is fixed.*
  4.  **Risk Distribution:** Is the trend assessed by expected annual harm (the mean) or by the potential for catastrophic tail events (the variance/extremes)? *Independent of Aggregation; one can accept falling rates but reject the trend due to tail risk.*
  5.  **Metaphysics of the Trend:** Is "violence" a single measurable quantity with a fact of the matter, or a cluster concept where "decline" is a value-laden description rather than a discovery? *Distinct from Epistemic Scepticism, which claims there is a fact but our evidence is too poor to know it.*

  ---

  ## 2. The Decision Tree

  *Instructions:* Proceed through the questions in order. Answer based on your intuition about the specific case described, not on the general label you wish to adopt. Follow the path indicated by your answer.

  **Q1. (Case g)** Suppose a government enacts trade policies that knowingly cause a famine killing 10,000 people, though no soldier strikes a blow. In your measure of violence, does this count as an increase?
  *   **Yes:** Go to **Leaf A**.
  *   **No:** Go to **Q2**.

  **Q2. (New Case l)** Suppose a regime systematically uses sleep deprivation and threat of torture to control a population, causing severe psychological trauma but no physical injury or death. Does this count as an increase in violence?
  *   **Yes:** Go to **Leaf A**.
  *   **No:** Go to **Q3**.

  **Q3. (Case d)** Suppose the number of animals slaughtered for food per head of human population multiplies several times over the period in question. Does this count as an increase in violence?
  *   **Yes:** Go to **Leaf B**.
  *   **No:** Go to **Q4**.

  **Q4. (New Case i)** Suppose the global population doubles, and the total number of battle deaths doubles, but the rate of death per 100,000 people remains constant. Has violence declined?
  *   **No (It has worsened or stayed same):** Go to **Leaf C**.
  *   **Yes (Rates matter more):** Go to **Q5**.

  **Q5. (Case f)** Suppose in Period One, one airstrike kills 500 people. In Period Two, 500 separate fistfights result in 500 deaths. The total count and rate are identical. Is Period One more violent?
  *   **Yes (Concentration matters):** Go to **Leaf C**.
  *   **No (Only the sum matters):** Go to **Q6**.

  **Q6. (Case c)** Suppose interpersonal homicide falls steeply, but imprisonment rises sharply and prison violence is common. Is the overall level of violence lower?
  *   **No (Violence is displaced/outsourced):** Go to **Leaf D**.
  *   **Yes (Net reduction counts):** Go to **Q7**.

  **Q7. (Case a)** Suppose State X credibly threatens to destroy State Y's city, preventing an invasion that would have killed more people. The invasion never happens. Has violence been prevented, or merely held in reserve?
  *   **Held in reserve (Threat is violence):** Go to **Leaf D**.
  *   **Prevented:** Go to **Q8**.

  **Q8. (Case e)** Suppose expected annual battle deaths fall, but the probability of a single conflict killing a large fraction of the population (tail risk) rises. Is the world less violent?
  *   **No (Tail risk dominates):** Go to **Leaf E**.
  *   **Yes (Expectation dominates):** Go to **Q9**.

  **Q9. (Case b)** Suppose the annual risk of being killed stays constant, but life expectancy doubles, so the chance of dying violently at some point in a life goes up. Is violence declining?
  *   **No (Lifetime risk matters):** Go to **Leaf F**.
  *   **Yes (Annual rate matters):** Go to **Q10**.

  **Q10. (New Case k)** Is there a single, mind-independent fact about whether violence has declined, or is "violence" a cluster concept where different trends (homicide vs war vs abuse) can pull in opposite directions without a single verdict?
  *   **No single fact (Cluster concept):** Go to **Leaf G**.
  *   **Single fact exists:** Go to **Q11**.

  **Q11. (New Case j)** Suppose the historical data for the early period is skeletal, resting on contested population estimates, while modern data is precise. Can we know the fact of the matter?
  *   **No (Evidence cannot reach it):** Go to **Leaf H**.
  *   **Yes (Evidence is sufficient):** Go to **Leaf I**.

  ---

  ## 3. The Leaves

  **Leaf A: Structural Expansionism**
  *   **Commitment:** You must treat remediable deprivation and psychological coercion as violence, implying the trend is likely flat or worsening regardless of battlefield data.
  *   **Path:** Q1-Yes **OR** (Q1-No + Q2-Yes).

  **Leaf B: Moral-Patient Expansionism**
  *   **Commitment:** You accept human violence may have fallen, but the trend is sharply upward because of animal slaughter.
  *   **Path:** Q1-No, Q2-No, Q3-Yes.

  **Leaf C: Absolutism / Concentration Scepticism**
  *   **Commitment:** A falling rate with a rising absolute number is not a decline; or, concentrated killing is worse than dispersed killing even if totals match.
  *   **Path:** Q1-No, Q2-No, Q3-No, Q4-No **OR** (Q4-Yes + Q5-Yes).

  **Leaf D: Substitution and Reserve Scepticism**
  *   **Commitment:** The decline is an artefact of violence being outsourced to the state (prisons) or held in reserve by deterrence (nuclear threat).
  *   **Path:** Q1-No, Q2-No, Q3-No, Q4-Yes, Q5-No, Q6-No **OR** (Q6-Yes + Q7-Held in reserve).

  **Leaf E: Tail Risk Reversal**
  *   **Commitment:** You accept declinism about expected harm but reject it overall because the potential for catastrophe has grown.
  *   **Path:** Q1-No, Q2-No, Q3-No, Q4-Yes, Q5-No, Q6-Yes, Q7-Prevented, Q8-No.

  **Leaf F: Lifetime Risk Pessimism**
  *   **Commitment:** You accept annual rates have fallen, but because we live longer, our exposure to violence over a lifespan has increased.
  *   **Path:** Q1-No, Q2-No, Q3-No, Q4-Yes, Q5-No, Q6-Yes, Q7-Prevented, Q8-Yes, Q9-No.

  **Leaf G: Conceptual Pluralism (No Fact of the Matter)**
  *   **Commitment:** There is no single trend to be found; asking if the world is "less violent" is like asking if a colour is "more beautiful".
  *   **Path:** Q1-No, Q2-No, Q3-No, Q4-Yes, Q5-No, Q6-Yes, Q7-Prevented, Q8-Yes, Q9-Yes, Q10-No single fact.

  **Leaf H: Epistemic Scepticism**
  *   **Commitment:** There is a fact of the matter, but our evidence — skeletal, documentary, resting on contested population estimates — cannot reach it.
  *   **Path:** Q1-No, Q2-No, Q3-No, Q4-Yes, Q5-No, Q6-Yes, Q7-Prevented, Q8-Yes, Q9-Yes, Q10-Single fact, Q11-No.

  **Leaf I: Straightforward Declinism**
  *   **Commitment:** Violence is bodily, agent-caused, human-only, measured per-person-year by expectation, and the data is sufficient to show a decline.
  *   **Path:** Q1-No, Q2-No, Q3-No, Q4-Yes, Q5-No, Q6-Yes, Q7-Prevented, Q8-Yes, Q9-Yes, Q10-Single fact, Q11-Yes.

  ---

  ## 4. Diagnostics of the Space

  **Unoccupied Combinations**
  *   **Tail Risk Optimism:** Accepting tail risk has risen but claiming the world is *more* peaceful on that basis. *Verdict: Incoherent.*
  *   **Structural Absolutism:** Counting famine as violence but insisting on absolute counts rather than rates for those deaths. *Verdict: Unattractive (double counts deprivation).*
  *   **Epistemic Pluralism:** Claiming there is no fact of the matter *because* the data is poor. *Verdict: Unexplored (conflates Leaf G and Leaf H).*

  **Indistinguishable Leaves**
  *   **Leaf D (Substitution) and Leaf E (Tail Risk):** Both yield a "No" to the headline claim despite falling annual rates. The instrument separates them by *reason* (state outsourcing vs. catastrophic potential), but if a participant holds both views, the tree forces a choice at Q8 that may feel artificial.

  **Order Dependence**
  *   **Q4 (Absolute Counts) and Q5 (Concentration):** If Q5 were asked before Q4, a participant might reject concentration (Q5-Yes) but accept absolute counts (Q4-Yes). The current order assumes concentration scepticism is a subset of count scepticism.

  **The Trap Node**
  *   **Node Q6 (Prison/Displacement).** Participants who identify as "law and order" often answer "Yes, violence is lower" here to signal support for incarceration, not realising this commits them to **Leaf I (Straightforward Declinism)**. However, if they elsewhere expressed concern about state coercion (Q1/Q2), this answer creates a contradiction.
  *   **Rephrasing to remove cue:** "Suppose interpersonal homicide falls steeply, but the state confines 2% of the population in facilities where physical assault is routine. Is the total amount of physical coercion in the society lower?" (Removes the word "imprisonment" which carries normative baggage).

