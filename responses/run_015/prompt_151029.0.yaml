          *   *CC vs. CW:* Correctly distinguishes them (conception = practice dissolves; will = rational agent couldn't will it).
          *   *Duties:* Correctly maps CC to Perfect/Narrow and CW to Imperfect/Wide.
          *   *The "Golden Rule" Claim:* **Major Red Flag.** The student concludes Part (a) by saying, "Really, though, all of this is the golden rule..." This is a classic misreading of Kant. Kant *explicitly* distinguishes the Categorical Imperative from the Golden Rule in the *Groundwork* (GMS 4:430). The Golden Rule is based on inclination/desire ("as you would be willing"), whereas Kant is based on rational necessity. This shows a fundamental misunderstanding of the deontological vs. reciprocal nature of the ethics.
