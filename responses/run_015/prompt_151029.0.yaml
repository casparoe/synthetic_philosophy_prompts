      *   *Re-evaluating (b):* The student argues DNT is equivalent. It is not. It is stricter (it makes duties impossible). They failed to see that if M⁻ fails, M becomes impermissible under DNT, which contradicts the notion of duty. They used the "Refuse Help" example but only looked at it from the "Refuse" angle, not the "Help" angle. If they tested "Help," DNT would forbid it. They missed this. This is a logic failure. 4/12 is fair. Maybe 5/12 for clear writing.
