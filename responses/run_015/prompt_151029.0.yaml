              *   *Actually, the student misses the structural issue:* DNT makes *indifference* impossible. For an action to be permissible, its opposite must also be permissible. This eliminates the category of "obligatory." If M is obligatory, M⁻ is impermissible. If M⁻ is impermissible, DNT says M is impermissible (because the "AND" condition fails).
