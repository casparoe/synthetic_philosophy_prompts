  Second, to discipline the assessment, consider two stipulated futures and explain how each would affect your view. In Future Alpha, set theorists converge over decades on a new axiom that settles the continuum hypothesis and proves enormously fruitful for other mathematics, yet is endorsed mainly for its systematic consequences rather than any consensus that it is intrinsically evident. In Future Beta, two research communities develop in parallel, one affirming and one denying the continuum hypothesis, each able to reconstruct core mathematics and applicable science with equal predictive and explanatory success and with no prospect of convergence. State what you infer from each future about determinateness.

