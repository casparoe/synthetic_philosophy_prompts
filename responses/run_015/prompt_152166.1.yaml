answer: |-
  - The implicit philosophy (around 150 words): This setup presupposes a theory of desert where moral worth is contingent upon bureaucratic competence rather than intrinsic need or incapacity. It implies responsibility is not merely behavioral (attending appointments) but procedural (navigating assessment frameworks). The "undeserving" are not those who fail due to hardship, but those who fail to document hardship according to state specifications. This reflects a neoliberal shift where the burden of proof lies entirely on the claimant to categorize themselves as exceptions to conditionality rules. Consequently, moral desert is decoupled from the actual reason for failure (e.g., anxiety) and recoupled to the ability to perform eligibility successfully. The system assumes a rational actor capable of self-advocacy; those who cannot prove vulnerability are treated as willfully non-compliant, regardless of underlying barriers. Responsibility becomes an administrative achievement rather than a civic obligation. It redefines citizenship as status earned through navigating the state, not a right inherent to personhood.

  - The tension (around 100 words): This contradicts conditionality's stated aim: enforcing responsibility. If the goal is compliance, punishing identical failures differently based on paperwork is counterproductive. It suggests the system values box-ticking over genuine engagement. Furthermore, it conflicts with norms that aid should correlate with need, not administrative skill. By penalizing those lacking capacity to prove vulnerability, the system punishes the very incapacity it claims to accommodate. Conditionality becomes a mechanism for filtering claimants based on bureaucratic navigation, undermining the responsibility narrative.

  - Bottom line (around 60 words): The view is coherent but managerial, not moral. The system prioritizes cost containment over ethical consistency. It treats welfare as a contract where terms are set by administrative capacity. It is not ad-hoc; it is a deliberate design substituting bureaucratic compliance for moral desert, ensuring only persistent claimants access support.
