  This view denies the kind exists. Social reality requires collective intentionality to impose status functions. Since nobody accepts or recognises the division, it remains a brute physical fact, like a river dividing land, not a social institution. Without agreement, there is no status.

  This view affirms the kind. Social kinds are defined by hierarchical structures distributing power and resources, regardless of awareness. The north-south divide objectively structures advantage and disadvantage through institutional access. The material reality of oppression constitutes the kind, even if the mechanism remains invisible to those living within it.

  This view denies the kind. Interactive kinds require people to know they are classified, altering their self-understanding and behaviour. Here, the classification is unknown. Without the feedback loop between label and labelled, there is merely a static pattern, not a dynamic human kind capable of looping effects.

  The crucial feature is invisibility. If you introduce a name halfway, view (3) flips because people react to the label, creating the loop. Defenders of (1) and (3) will argue your divide is merely a pattern an observer draws, not a social kind itself. For them, without recognition or reaction, you have described a correlation, not a constitution. Only the constitutive view treats the structural outcome as the kind itself.
