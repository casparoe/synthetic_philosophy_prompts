answer: |-
  # Joint Statement on the Structure and Resolution of the Sorites Paradox

  **Participants:** Seminar Instructor (Epistemicist) & Graduate Seminar Lead (Supervaluationist)  
  **Date:** October 24, 2023  
  **Subject:** Clarification of Adversarial Positions on Vagueness

  ## I. Agreed Claims

  Both parties affirm the following foundational commitments to ensure subsequent disagreement is substantive rather than terminological.

  1.  **Formal Structure of the Sorites:** Both parties agree that the Sorites paradox arises from the tension between three elements: (a) a clear positive case (e.g., a person with 0 hairs is bald), (b) a clear negative case (e.g., a person with 10,000 hairs is not bald), and (c) a tolerance principle (e.g., removing one hair does not change baldness status) that appears true but leads to a false conclusion via classical valid inference.
  2.  **Rejection of Non-Classical Truth Values:** Both parties reject fuzzy logic (degrees of truth between 0 and 1) and simple three-valued logic (true/false/gap) as adequate primary solutions. We agree that any viable theory must preserve classical logical validities (e.g., Law of Non-Contradiction) wherever possible without resorting to truth-value gluts or gaps as fundamental ontological categories.
  3.  **Artificial Precisification:** Both parties agree that artificial precisification mechanisms, such as computer-vision boundary algorithms or stipulative definitions in code, do not serve as valid models for natural language vagueness. Natural language vagueness is usage-based and cannot be resolved by mere stipulation without changing the subject.
  4.  **Higher-Order Vagueness:** Both parties agree that a successful theory must account for higher-order vagueness (i.e., the vagueness of the boundary itself). It is insufficient to posit a sharp boundary without explaining why the location of that boundary appears vague to competent speakers.
  5.  **Semantic Competence:** Both parties agree that competent speakers possess the same linguistic knowledge regarding vague predicates. The divergence lies not in speaker competence, but in the metaphysical and semantic explanation of why that competence fails to yield a determinate judgment in borderline cases.

  ## II. Points of Disagreement

  The following table isolates the specific theoretical divergences preventing consensus on the resolution of the paradox.

  | Issue | Epistemicist Position (Instructor) | Supervaluationist Position (Graduate Lead) |
  | :--- | :--- | :--- |
  | **Source of Vagueness** | Vagueness is purely **epistemic**. There is a sharp cutoff in reality (e.g., exactly $n$ hairs), but human cognitive limitations prevent us from knowing its location. | Vagueness is **semantic indecision**. There is no sharp cutoff in reality; the predicate "bald" is true on some admissible precisifications and false on others, with no fact of the matter in between. |
  | **Status of Cutoff Sentences** | Sentences like "Exactly 347 hairs makes you bald" are **classically true or false**. Our intuition that they are problematic stems from unavoidable ignorance, not indeterminacy. | Sentences like "Exactly 347 hairs makes you bald" are **indeterminate** (neither supertrue nor superfalse). They lack a truth value because they are true on some precisifications and false on others. |
  | **Margin-for-Error Principle** | The Margin-for-Error Principle explains **why we are ignorant**. It applies recursively but widens at higher orders, preventing "epistemic leakage" from collapsing knowledge entirely. | The Margin-for-Error Principle generates **epistemic leakage**. If applied recursively under Epistemicism, ignorance about the cutoff forces ignorance about the ignorance, leading to contradiction or skepticism that Supervaluationism avoids by denying the hidden fact. |

  ## III. Diagnostic Cruxes

  The following three cruxes identify the specific arguments where resolution is currently stalled. For each crux, we specify a concrete case both sides agree is relevant and outline the conflicting predictions.

  ### Crux 1: Recursive Application of the Margin-for-Error Principle
  *   **The Issue:** Whether the principle that "knowledge requires safety from error" can be applied to itself without generating circularity or collapsing into total skepticism.
  *   **Concrete Case:** A speaker claims, "I know that I do not know where the boundary of 'bald' lies."
  *   **Epistemicist Prediction:** This claim is **true**. The margin-for-error applies recursively; while I cannot know the boundary, I can know that my knowledge is limited by a margin. The margins widen at higher orders, preventing leakage.
  *   **Supervaluationist Prediction:** This claim is **problematic/indeterminate**. If Epistemicism is true, the ignorance about the boundary should "leak" into the second-order claim. If I cannot know the boundary due to a margin of error, I cannot securely know that the margin exists without invoking a further margin, leading to an infinite regress or contradiction. Supervaluationism avoids this because there is no hidden fact to be ignorant about.

  ### Crux 2: Intuition of Falsity vs. Indeterminacy
  *   **The Issue:** Whether Supervaluationism can adequately explain why specific cutoff claims feel false rather than merely indeterminate.
  *   **Concrete Case:** The assertion "A man with exactly 347 hairs is bald" (where 347 is a borderline number).
  *   **Epistemicist Prediction:** The intuition that this sentence is **not indeterminate** is correct. It is either true or false (likely false). Supervaluationism fails because it insists the sentence lacks a truth value, contradicting the robust linguistic intuition that bivalence holds even if we cannot verify it.
  *   **Supervaluationist Prediction:** The intuition that the sentence is **false** is actually an intuition that it is **not supertrue**. Speakers reject the sentence because it is not true on *all* admissible precisifications. Supervaluationism explains this by distinguishing between "false" (superfalse) and "not true" (indeterminate), arguing the user conflates the two.

  ### Crux 3: Location of Vagueness (World vs. Representation)
  *   **The Issue:** Whether vagueness is a feature of our representational limits or a feature of the semantic content itself.
  *   **Concrete Case:** A hypothetical omniscient being (e.g., Laplace's Demon) observing a borderline bald man.
  *   **Epistemicist Prediction:** The omniscient being **would know** whether the man is bald. Vagueness is solely a limit of human cognition and access to micro-physical facts. The boundary exists independently of our knowledge.
  *   **Supervaluationist Prediction:** The omniscient being **would see no boundary**. Even with perfect knowledge of all physical facts, there is no semantic fact to know. Vagueness is not in the world or in our limits, but in the incomplete decision of our language rules.
