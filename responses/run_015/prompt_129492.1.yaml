  **Project Title:** Decomposing Authority: Factored Cognition as a Normative Idealization of Epistemic Labor

  **Introduction**
  In the literature on AI alignment, Human-Consulting-HCH (HCH) and factored cognition are standardly introduced as technical mechanisms for scalable oversight. These models decompose complex reasoning into subproblems, allowing human judgment to verify each step without reproducing the whole argument. While originally conceived as engineering tools for safety, this project proposes a philosophical reinterpretation: treating factored cognition not as an engineering blueprint but as a normative idealization of collective deliberation. By analyzing the logical structure of these models, I ask whether they solve or merely displace a central problem in the philosophy of epistemic division of labor. This proposal outlines a twelve-month postdoctoral project dedicated to resolving the normative status of decomposed reasoning.

  **1. Research Question**
  The central inquiry is whether factored cognition is best understood as an intersubjective structure that distributes epistemic authority across agents, or whether it reduces to an iterative amplification of a single reasoner. This distinction matters for how we assign responsibility and trust in complex knowledge production. More specifically, when a complex judgment is decomposed into independently verifiable fragments, does the trust problem migrate from the conclusion to the boundary conditions of the decomposition itself? If the validity of the whole depends on the legitimacy of the parts, we still require an unverified meta-judgment about which fractures are legitimate. The project asks: Can the criteria for legitimate decomposition be internalized within the system, or does factored cognition inevitably rely on an external, unanalyzed authority to define the boundaries of reasoning?

  **2. The Normative Gap in Existing Treatments**
  Current treatments of HCH and factored cognition leave this normative gap open. Existing literature demonstrates feasibility under certain conditions, showing that decomposed tasks can be solved efficiently or safely within specific parameters. However, these treatments do not defend those conditions as philosophically justified criteria for legitimate collective reasoning. They assume that if a subproblem is verifiable, it is epistemically sound, without addressing whether the decomposition preserves the semantic and logical dependencies necessary for understanding. By focusing on operational success rather than epistemic justification, current models risk conflating computational tractability with deliberative validity. This project fills that gap by interrogating the normative assumptions underlying the fragmentation of reasoning.

  **3. Method and Work Plan**
  Rather than running empirical studies or formalizing algorithms, I will conduct a conceptual comparison between HCH/factored cognition and two alternative idealizations: peer review as distributed verification, and deliberative preference aggregation. The analysis will use explicit criteria for when a decomposition preserves dependency relations among reasons and when it obscures them. For instance, I will examine whether isolating empirical premises from value judgments in a factored structure distorts the moral reasoning process compared to a deliberative aggregation model.

  The twelve-month plan is structured as follows:
  *   **Months 1–2:** Map structural analogies between factored cognition, peer review, and deliberative aggregation. Identify points of divergence in how epistemic authority is assigned.
  *   **Months 3–5:** Develop the normative criterion for epistemically legitimate decomposition. Define the conditions under which fragmenting a reasoning process maintains vs. severs logical dependencies.
  *   **Months 6–8:** Test the criterion against edge cases in moral and scientific reasoning. Focus on scenarios where decomposition might distort the problem by isolating value judgments from empirical premises or separating means from ends.
  *   **Months 9–10:** Draft the framework paper, articulating the distinction between genuine deliberation and concealed deference.
  *   **Months 11–12:** Revise the manuscript and present findings in a workshop setting to gather feedback from philosophers of science and technology ethicists.

  **4. Success and Failure Conditions**
  Success looks like a defensible framework specifying when distributed verification counts as genuine deliberation rather than concealed deference to an opaque partition. This framework will provide philosophers and technologists with the conceptual tools to identify when a division of labor enhances collective knowledge and when it merely obscures the locus of authority. It will clarify the conditions under which fragmented reasoning remains accountable.

  Failure looks like the demonstration that HCH collapses into either unexamined expert authority or an infinite regress of meta-verification. If the analysis shows that every decomposition requires a higher-order judgment that cannot itself be decomposed without loss of meaning, the project will conclude that factored cognition cannot serve as a complete normative model for collective reasoning. Even in this case, the project succeeds philosophically by delineating the limits of scalable oversight models.

  **5. Scope Assessment**
  This is conceptual philosophy, not institutional design or computer science. The deliverable should be a framework paper with carefully constructed illustrative cases, not a validated protocol or empirical study. I will not attempt to solve the engineering challenges of AI alignment nor propose new institutional policies for scientific funding. Instead, I will focus on the logical structure of reasoning models as they pertain to the division of epistemic labor. This scope ensures the project is tractable within a single year while making a substantive contribution to the philosophy of science and technology. By framing the division of epistemic labor problem as the central tension, the project remains open enough for novel insight but bounded enough for completion within the fellowship period.
