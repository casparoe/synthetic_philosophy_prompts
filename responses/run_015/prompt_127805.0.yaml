  6.  **Final Polish:** Ensure the distinction between *psychological* biases and *epistemic* constraints is highlighted, as that's the core philosophical weight here. Ensure the reference to Taleb is acknowledged as pop-sci but acceptable. Ensure the "1970s experiments" reference is validated (Fischoff).

      *(Self-Correction on "Survival Filter"):* The term isn't standard jargon (usually Survivorship Bias), but the brief asked for "what I will call the survival filter," so the student correctly adopted the journalist's terminology. I should note that she followed instructions there.

      *(Self-Correction on Ranking):* Is it defensible? Yes. If your data is corrupted, your logic doesn't matter. If your data is clean, your logic might still be biased. Corrupted data is arguably a "harder" problem. I will support this but add the nuance that narrative is constitutive of history itself.

