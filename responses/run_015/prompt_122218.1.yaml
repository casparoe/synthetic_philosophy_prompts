  **Brainstorming & Logic Check**

  As a poet, I need repeating lines that can shift weight each time they return. As a philosopher of science, I need to ensure the logic of Hempel's Raven holds within the closed system of the island.
  *   **Repeating Line 1:** "The ledger holds every stone and post." This establishes the *closed system*. Initially, it's just inventory; later, it becomes the logical boundary that makes the evidence decisive.
  *   **Repeating Line 2:** "A grey thing speaks for black and white." This is the logical pivot. A grey pebble is non-black (confirming "All Ravens are Black") and non-white (confirming "All Ravens are White"). In an open world, this is negligible; here, it's the final data point.
  *   **Logic Sanity:** In a finite set (the island), observing the last non-raven object (the pebble) effectively closes the set of non-ravens. If all observed ravens were black, and the set of non-black things (including the pebble) contains no ravens, the hypothesis is verified *for this domain*. The poem must show that the "nudge" becomes a "settlement" because the ledger is finished. The double confirmation (supporting both Black and White hypotheses) highlights that confirmation by instance alone is symmetric, but the *completion* of the ledger is what gives it weight.

  **The Poem**

  Paraffin lamp burns low beside the book.
  The ledger holds every stone and post.
  She counts the cards in every nook.
  Nothing lies hidden on this coast.

  The ledger holds every stone and post.
  Nine ravens circle the bothy roof.
  Nothing lies hidden on this coast.
  The crate stands sealed and proof aloof.

  Nine ravens circle the bothy roof.
  A grey thing speaks for black and white.
  The crate stands sealed and proof aloof.
  It validates the colour of the night.

  A grey thing speaks for black and white.
  The tiny nudge becomes the whole.
  It validates the colour of the night.
  Lends white hypothesis a soul.

  The tiny nudge becomes the whole.
  Her hand rests on the wooden lid.
  Lends white hypothesis a soul.
  Where every missing thing is hid.

  Her hand rests on the wooden lid.
  She counts the cards in every nook.
  Where every missing thing is hid.
  Paraffin lamp burns low beside the book.

  **Revision Note**

  In drafting, I initially struggled with the meter on the fourth stanza's final line; "hypothesis" threatens to clutter the rhythm, but I kept it because it's the necessary signal for the philosopher-reader without breaking the spell for the general listener. I also adjusted the final stanza to interlock the rhymes from the first and fifth stanzas (lid/hid and nook/book), ensuring the pantoum's circular form mirrors the closed logic of the ledger while satisfying your requirement that the final line matches the opening.
