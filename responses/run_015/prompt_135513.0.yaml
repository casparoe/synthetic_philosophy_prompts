answer: |-
  There is no single, eponymous term in the philosophy of history that captures this entire dialectical loop precisely. However, the structure you describe is a well-recognized composite of several distinct methodological and logical fallacies discussed across comparative historical analysis, philosophy of social science, and post-colonial critique.

  To categorize this rigorously, we must disentangle the **logical error** (how the baseline is constructed), the **counterfactual error** (how the alternative is imagined), and the **rhetorical maneuver** (how the critique is absorbed).

  Here is the breakdown of the established concepts that map onto your description, followed by a proposal for how to classify the structure as a whole.

  ### 1. The Methodological Error: Selection on the Dependent Variable
  In social science methodology (most famously articulated by King, Keohane, and Verba in *Designing Social Inquiry*), the core logical flaw you describe is **selection on the dependent variable**.

  *   **The Structure:** The scholar selects cases (Britain and China) based on the known outcome of the dependent variable (Industrialization occurred in Britain, did not in China). They then search for independent variables (institutions, culture, ecology) that distinguish the two.
  *   **The Flaw:** Because the cases were selected *because* of the outcome, any variable that correlates with the case selection will appear to cause the outcome.
  *   **Your Observation:** You noted that the baseline is "constructed post hoc from indicators that are only identifiable as causally relevant because they preceded industrialization in Britain." This is the definition of endogenous variable selection. The "potential for growth" is not an exogenous metric (like rainfall or geography); it is a metric derived from the successful case and applied to the unsuccessful one.

  ### 2. The Philosophical Error: Retrospective Determinism (or Teleological Compression)
  In the philosophy of history, this is a specific form of **teleology** often called **retrospective determinism**.

  *   **The Structure:** The historian assumes that the actual outcome (British industrialization) was the "natural" or "default" trajectory of history, and treats the non-occurrence (in China) as the deviation requiring explanation.
  *   **The Flaw:** This imposes a directional arrow on time that only exists in hindsight. It treats the British path not as one contingent possibility among many, but as the realization of a latent universal potential that China "failed" to achieve.
  *   **The "Incommensurability as Virtue" Move:** When the scholar concedes asymmetry but insists on comparison to find the "divergence point," they are engaging in **teleological compression**. They are compressing two distinct historical ontologies into a single timeline where "divergence" implies a prior state of "convergence" that may never have existed conceptually.

  ### 3. The Counterfactual Error: Asymmetric Counterfactuals
  The specific retreat you mention—"testing counterfactual resilience" while holding British institutions constant—is identified by philosophers of counterfactual history (such as Jon Elster or Philip Tetlock) as **asymmetric counterfactual analysis**.

  *   **The Structure:** To test why China didn't industrialize, the scholar asks, "If China had British property rights, would it have industrialized?" They rarely ask the symmetric question: "If Britain had Qing fiscal structures, would it have failed?"
  *   **The Flaw:** This preserves the "superior" case as the control group and the "inferior" case as the variable. It silently treats British institutions as universal goods and Chinese institutions as specific local barriers, reinforcing the asymmetry the scholar claimed to bracket.

  ### 4. The Conceptual Error: Conceptual Stretching
  Political scientist Giovanni Sartori termed the problem of applying a concept across incompatible cases as **conceptual stretching**.

  *   **The Structure:** To maintain the "shared baseline," the scholar must define "wealth," "state capacity," or "technology" broadly enough to cover both Britain and China.
  *   **The Flaw:** As the concept is stretched to cover both cases, it loses its discriminatory power. If "state capacity" means "ability to extract revenue" in Britain but "ability to manage famine" in China, comparing them on a single axis of "state capacity" is category error. The scholar's defense (that the comparison reveals *where* they diverge) attempts to turn this stretching into a heuristic virtue, but logically it remains a violation of **functional equivalence**.

  ### 5. The Rhetorical Maneuver: Immunizing Stratagem
  The specific dialectical move where the critique (incommensurability) is conceded but then used to justify the method (comparison is *more* valuable because of the difference) resembles what Imre Lakatos called an **immunizing stratagem**.

  *   **The Structure:** A research program faces an anomaly (the cases aren't comparable). Instead of abandoning the program, the scholar adjusts the auxiliary hypothesis (comparison is valuable *precisely* to measure divergence) to protect the core assumption (that industrialization is a universal metric of development).
  *   **The Result:** The argument becomes unfalsifiable. If the cases are similar, they show convergence; if they are different, they show divergence. The outcome (the search for the source of British success) is guaranteed regardless of the evidence.

  ### Critical Theory Label: "Historicism 1"
  If you are looking for a term from critical historical theory, Dipesh Chakrabarty, in *Provincializing Europe*, identifies this exact loop as **Historicism 1**.

  *   **Definition:** The assumption that history is a universal, secular process of development toward a specific endpoint (modern Europe), and that all other histories are "not yet" there.
  *   **Relevance:** Chakrabarty argues that this framework makes it impossible to ask the Needham Question without already presupposing the European answer. The "baseline" you describe is what he calls the **"waiting room of history,"** where China is placed in a temporal queue behind Britain, waiting to develop the traits Britain already possesses.

  ### Distinguishing from Legitimate Comparison
  How do you distinguish this loop from a well-formed **Contrastive Explanation** (e.g., Przeworski & Teune's *Most Similar Systems* or *Most Different Systems* design)?

  1.  **Exogeneity of Variables:** In a legitimate comparison, the variables (ecology, demographics, resource endowments) must be defined independently of the outcome. If "potential for growth" is defined by British patent laws, it is endogenous. If it is defined by caloric intake per capita, it is exogenous.
  2.  **Symmetric Counterfactuals:** A robust method tests the resilience of *both* cases. "Would Britain have failed with Chinese institutions?" must be asked with the same rigor as "Would China have succeeded with British institutions?"
  3.  **Reciprocal Comparison:** Kenneth Pomeranz (in *The Great Divergence*) attempted to solve this by comparing "core to core" (England vs. Yangtze Delta) rather than "nation to nation," and by looking for **conjunctural causation** (accidental access to coal/colonies) rather than **structural superiority**. He explicitly tried to avoid the loop you described by establishing equivalence *before* looking for divergence.

  ### Conclusion: A Proposed Classification
  Since there is no single word, the most precise way to label this in your own work is to combine the methodological and philosophical terms. You might classify it as:

  > **"Endogenous Teleological Comparison"**

  Or, more descriptively:

  > **"Outcome-Dependent Baseline Construction"**

  **Logical Structure Summary:**
  1.  **Premise:** Outcome $O$ occurred in Case $A$, not Case $B$.
  2.  **Operation:** Define Metric $M$ based on features of $A$ that preceded $O$.
  3.  **Comparison:** Measure $B$ against $M$.
  4.  **Defense:** Acknowledge $A$ and $B$ are ontologically distinct, but claim $M$ reveals the "divergence point."
  5.  **Counterfactual:** Vary $B$ toward $A$'s parameters while holding $A$ constant.
  6.  **Conclusion:** $B$ lacked the "capacity" for $O$ (where capacity is defined by $A$).

  This is not merely a "false equivalence." A false equivalence claims $A = B$. This loop is more sophisticated: it claims $A \neq B$, but insists that $A$ provides the only valid coordinate system for measuring the difference. In the philosophy of science, this is a form of **theory-laden observation** where the theory is the historical outcome itself. It is a **self-sealing explanatory loop** that mistakes the *description* of the British path for the *preconditions* of industrialization generally.
