answer: |-
  It is a pleasure to address a question from someone who has actually done the work. Too often, debates about Kuhn are conducted by people who have never set up an apparatus or worried about noise in a signal. Your intuition that the shift felt *rational*—driven by the behavior of the world, not just the sociology of the lab—is shared by many scientists who read *Structure*, and it points directly to the place where Kuhn is most frequently misunderstood.

  Your former postdoc is right: the distinction between **incommensurable** and **incomparable** is the key to unlocking this. If you conflate them, Kuhn looks like a relativist who thinks science is mob rule. If you separate them, Kuhn looks like a realist who thinks scientific rationality is more complex than a simple algorithm.

  Here is how to untangle the knot, keeping your experience as a physicist in mind.

  ### 1. Incommensurable vs. Incomparable

  The term "incommensurable" is geometric in origin. Two line segments are incommensurable if they share no common unit of measure (like the side and diagonal of a square). Crucially, **this does not mean you cannot compare them.** You can still say one is longer than the other, or that they relate in a specific ratio, even if you cannot measure both with the same ruler.

  When Kuhn says paradigms are incommensurable, he is **not** saying they are *incomparable*. He is not claiming that a Newtonian and an Einsteinian physicist cannot talk to one another, or that they cannot see that the other's theory makes different predictions.

  *   **Incomparable** would mean: "We have no way to evaluate Theory A against Theory B. We might as well flip a coin."
  *   **Incommensurable** means: "There is no neutral, paradigm-independent language into which both theories can be fully translated without loss of meaning, *but* we can still compare their problem-solving abilities."

  Your worry stems from the idea that if there is no "neutral language," there is no ground for argument. Kuhn's counter is that we do not need a neutral language to compare; we need only the ability to learn the other's language and the willingness to evaluate success based on shared values.

  ### 2. Is it Literal Untranslatability?

  You asked if you are smuggling in a stronger thesis than Kuhn defends. In the 1962 edition of *Structure*, Kuhn was indeed somewhat loose with language, often speaking of "seeing a different world." This led many to think he meant communication was impossible.

  However, in his later years (particularly in *The Road Since Structure*), Kuhn clarified that incommensurability is about **local translation failure**, not global communication breakdown.

  Take the term "mass."
  *   In Newton's paradigm, mass is invariant and distinct from weight.
  *   In Einstein's paradigm, mass is energy-equivalent and frame-dependent.

  Kuhn's point is that you cannot simply substitute the Newtonian definition of "mass" into Einstein's equations and get a sensible result. The term occupies a different place in the "lexical taxonomy" of the theory. To understand Einstein's "mass," you cannot just translate it into Newtonian terms; you have to learn the Einsteinian framework as a second language.

  But—and this is crucial—**you can learn the second language.** A modern physicist can understand Newton *and* Einstein. We can compare them. We can say, "Einstein's concept of mass accounts for the perihelion of Mercury; Newton's does not." That comparison is rational, even if the terms aren't perfectly interchangeable.

  So, incommensurability is not a wall; it is a translation cost. It requires effort to understand the rival paradigm, but it does not preclude understanding.

  ### 3. The Rationality of Theory Choice

  This brings us to your deepest concern: If there is no algorithm to decide between paradigms, is the choice arbitrary? Is it merely a "conversion" akin to religion?

  Kuhn explicitly rejected the idea that paradigm choice is irrational. However, he did argue that it is **not algorithmic**.

  In your career, you likely never encountered a grant review or a paper submission where the decision was purely mechanical. You weighed evidence, yes, but you also weighed potential impact, elegance, feasibility, and consistency with established knowledge. Kuhn argues that theory choice works the same way. He identifies five criteria that scientists use to judge theories:
  1.  **Accuracy** (empirical adequacy)
  2.  **Consistency** (internal and external)
  3.  **Scope** (how much does it explain?)
  4.  **Simplicity** (parsimony)
  5.  **Fruitfulness** (does it open new puzzles?)

  Here is the catch: **These values are shared, but their application is not.**

  During a revolution, the old paradigm might win on consistency (it doesn't break established laws), while the new paradigm wins on scope and fruitfulness (it solves the anomalies the old one can't). Scientist A might weight "consistency" more heavily and stick with the old view. Scientist B might weight "scope" more heavily and adopt the new view.

  Kuhn argues that **both are being rational.** They are using the same shared values but weighting them differently based on their judgment and experience. This is why the decision is not arbitrary (it is based on evidence and shared values) but also not mechanically determined (reasonable people can disagree).

  ### 4. Why It Doesn't Feel Like Religion

  You mentioned that a religious conversion feels different from a paradigm shift. Kuhn agrees.

  In a religious conversion, the criteria for "success" are often internal to the faith. In a scientific revolution, the criteria are tied to **puzzle-solving**.

  As an experimentalist, you know that nature pushes back. If a new paradigm does not actually predict the signal better, or reduce the noise, or explain the anomaly that broke the old theory, the community will not adopt it, no matter how fashionable it is. The "arbitrary" sociological factors (authority, generation gaps) play a role in *how fast* a shift happens, but they do not determine *which* paradigm wins in the long run. The one that solves the puzzles survives.

  Kuhn's point is that the logic of this choice cannot be formalized into a proof. You cannot write a equation that outputs "Accept General Relativity" when fed "1915 Physics." But the community arrives at the decision through argument, demonstration, and the gradual accumulation of evidence that the new paradigm handles the world better.

  ### Summary

  To return to your specific questions:

  1.  **Are you smuggling in a stronger thesis?** Yes. You are interpreting "incommensurable" as "incomparable." Kuhn claims we lack a neutral metric, not the ability to compare.
  2.  **Is it literal untranslatability?** Only locally (specific terms change meaning), not globally (we can still learn each other's frameworks).
  3.  **Is the choice rational?** Yes, but not algorithmic. It is a value-laden judgment call based on shared criteria (accuracy, scope, etc.) applied differently by individuals.
  4.  **Is it like religion?** No, because the "values" being optimized are tied to empirical puzzle-solving, which constrains the choice far more than social psychology does.

  Your feeling that the shifts in your field were rational is not evidence against Kuhn; it is evidence that you understand how scientific rationality actually works. Kuhn's goal was not to show that science is irrational, but to show that its rationality is human, historical, and messy, rather than logical, timeless, and mechanical.

  You cleared your desk of grants, but you never cleared your desk of the intuition that evidence matters. Kuhn would tell you that evidence *does* matter, it just doesn't speak for itself without a paradigm to interpret it. The choice between paradigms is rational because it is a choice about which tool does the best work, not just which story sounds better.
