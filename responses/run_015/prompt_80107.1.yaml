answer: |-
  **MEMORANDUM**

  **TO:** Curatorial Committee, Harwick Historical Society
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Proposal for Exhibit Structure: The 1907 Shipyard Lockout

  As we approach Thursday's meeting, I have been reflecting on the impasse regarding our narrative strategy. We have two strong positions: the desire for a single, definitive reconstructed account, and the desire to present the two partisan narratives side-by-side without adjudication. Both positions stem from a commitment to integrity, but I believe both carry risks we need to address.

  I am writing to propose a third structural option that incorporates the strengths of both while acknowledging a crucial curatorial reality: **selection is interpretation.** Whether we synthesize the sources or juxtapose them, the visitor leaves with a story shaped by our choices. Our goal should not be to hide that shaping, but to make it part of the historical lesson.

  **Engaging the "Definitive Account"**
  Those advocating for a single, synthesized narrative are right to prioritize visitor clarity. Museums have a duty to provide coherence; a purely fragmented exhibit can feel like an abdication of authority. A definitive account offers a satisfying arc and respects the visitor's time. However, given our specific source material, a seamless synthesis risks smoothing over the very power dynamics that caused the conflict. If we merge the Shipyard's "riot" narrative with the Union's "victory" narrative into one smooth voice, we inadvertently validate the Shipyard's claim to objective truth—a claim their own ownership of the town paper undermines. We cannot "let the sources speak for themselves" when the sources are shouting over one another.

  **Engaging the "Side-by-Side" Approach**
  Conversely, simply placing the Shipyard and Union stories in parallel columns respects the bias of the records. However, without a framework, this risks presenting history as mere relativism—implying the truth is unknowable or that both sides were equally powerful. We know they were not. The Shipyard owned the press; the Union owned the memory. A simple juxtaposition might obscure that imbalance.

  **Proposal: The "Architecture of Disagreement"**
  I recommend we structure the exhibit not around *what happened*, but around *how we know what happened.* This allows us to provide a factual backbone while highlighting the conflict.

  **1. The Anchor (The Undisputed Sequence)**
  We use the Town Council Minutes and Incident Logs to create a central timeline running through the middle of the room. These are the driest documents we have, but they are the least contested. This satisfies the need for a definitive sequence of events (dates, locations, arrests) without imposing a motive or moral judgment.

  **2. The Walls (The Contending Narratives)**
  On the left wall, we present the Shipyard's contemporary account (the "Riot/Agitator" narrative) using facsimiles of the town paper. On the right wall, we present the Union's commemorative account (the "Heroic Victory" narrative) using the 40-year history.
  *Crucially:* We align these narratives visually against the central timeline. When the timeline says "Gates Closed," the left wall displays the headline "Mob Dispersed," and the right wall displays "Stand for Dignity Begins." This allows visitors to see exactly *where* the interpretations diverge.

  **3. The Exit (The Interpretive Layer)**
  The final panel should not summarize the event, but summarize the *evidence.* Here, we explicitly state what you noted in your memo: that the selection of events is itself an interpretive act. We explain *why* the sources differ (ownership of the press vs. oral tradition) and acknowledge that our exhibit is a reconstruction based on silence as much as speech.

  **Why This Works**
  This structure gives us the authority of the definitive account (via the Timeline) without the dishonesty of pretending the bias doesn't exist. It gives us the transparency of the side-by-side approach without abandoning the visitor to relativism. It turns the source problem into the exhibit's central theme: history is not just what happened, but who gets to write it down.

  I look forward to discussing this framework on Thursday.

  Regards,

  [Your Name]
  Curatorial Committee
