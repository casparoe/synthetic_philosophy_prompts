          2.  **Left Wall:** The Shipyard's Story (Contemporary).
          3.  **Right Wall:** The Union's Story (Retrospective).
          4.  **Exit/Conclusion:** A panel on "Making History" that explains the source bias.

  4.  **Drafting - Section by Section:**

