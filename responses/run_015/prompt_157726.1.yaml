prompt: |-
  In The Descent of Man, Darwin contends that the moral sense arises from social instincts shared with lower animals, which, when joined to human reason and sympathy, produce obligations that can override immediate self-interest. He further observes that belief in an all-knowing deity is unnecessary for morality, yet suggests that religious sentiment may have reinforced the very instincts from which morality grows, and that the highest ethical rules appear to have been reached gradually rather than being present in full from the start. I am struggling to see the precise architecture of this account. Does Darwin treat religion as a functional evolutionary scaffold that supports genuinely progressive moral norms, or as a redundant cultural overlay on instincts that reason alone could have refined? Moreover, does his claim that the highest rules emerged gradually apply only to the historical content of those rules, or also to the underlying moral faculty that recognises them? Please write your answer in British English.
