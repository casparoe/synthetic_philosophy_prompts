      *   **Purpose Statement:** Define the purpose deadpan. Justification, not discovery.
      *   **Section 1: The Catalogue:** List the 6 approved precedents. They need to be generic enough to be stretchable but specific enough to be recognizable tropes (e.g., The Sarajevo Incident, The Munich Concession, The Thucydides Shift, etc.).
      *   **Section 2: Selection Criteria:** Include the "Scenery vs. Structure" checkbox. Include the "Lesson Extraction Ratio."
