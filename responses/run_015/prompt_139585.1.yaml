              *   Lesson Extraction Ratio (policy per history).
              *   Mandatory Disanalogy Disclosure Schedule (capped at one page, unread).
              *   "No double-analogy rule" (consistency requirement, forbids noticing conflicting parallels).
              *   Double surcharge for second-order analogies (meta-commentary on analogies).
              *   Checkbox for "which parts of the precedent count as scenery" (coding background vs. signal).
              *   Structural analogies (e.g., Thucydides Trap style) that delete agency.
          *   **Ending:** A worked example where an applicant asks for one thing (fictional crisis: island city under blockade) and gets issued something subtly unhelpful.
          *   **Final Clause:** Admission that analogies do no predictive work but are mandatory to avoid appearing arbitrary.
