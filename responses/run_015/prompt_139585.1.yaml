answer: |-
  **OFFICE OF PRECEDENT ALLOCATION**
  **FORM 27-B: APPLICATION FOR AN APPROVED HISTORICAL ANALOGY**
  **REV. 4.2**

  **1. PURPOSE**
  This form facilitates the retrieval of historical precedents required to validate policy recommendations already drafted by Senior Analysts. Per Directive 88, no memo may be submitted to the Board without a attached historical lineage. The Office of Precedent Allocation (OPA) does not generate insight; it certifies narrative continuity.

  **2. APPROVED PRECEDENT CATALOGUE**
  Applicants must select one (1) precedent from the current stock. Requests for unlisted events will be rejected as "non-generalizable."
  *   **Item A:** The Munich Concession (Lesson: Concession invites aggression).
  *   **Item B:** The Sarajevo Cascade (Lesson: Minor incidents trigger systemic war).
  *   **Item C:** The Thucydides Shift (Lesson: Structural stress makes conflict inevitable).
  *   **Item D:** The Vietnam Quagmire (Lesson: Exit costs exceed entry costs).
  *   **Item E:** The Cuban Perimeter (Lesson: Blockades succeed if signaling is clear).
  *   **Item F:** The 1914 Mobilization (Lesson: Timetables dictate strategy, not leaders).

  **3. LESSON EXTRACTION RATIO**
  Applicants must certify a minimum ratio of 1.0 Policy Units per 1.0 Historical Unit. Complex history yielding ambiguous policy will be returned for simplification.

  **4. SCENERY CODING**
  To ensure fit, applicants must check which features of the precedent count as "Signal" and which count as "Scenery."
  [ ] Signal (Causal)
  [ ] Scenery (Ignore)
  *Note: Checking "Scenery" for geography, culture, technology, and political system is standard practice to ensure match viability.*

  **5. DISANALOGY DISCLOSURE SCHEDULE**
  Applicants must list features where the current crisis differs from the precedent. This schedule is capped at one (1) page. Exceeding this limit implies the analogy is too weak for use. Most sections are pre-filled as "Non-Essential."

  **6. CONSISTENCY PROTOCOLS**
  **6.1 No Double-Analogy Rule:** Only one precedent may be applied per crisis. Citing multiple precedents suggests the situation is unique, which violates the requirement for historical regularity.
  **6.2 Second-Order Surcharge:** If the applicant notes that "Commentators are already calling this [Precedent X]," a double processing fee applies. This accounts for the administrative labor of distinguishing the crisis from the commentary about the crisis, both of which draw from the same limited Catalogue.

  **7. AGENCY AND STRUCTURE**
  Selection of Item C (Thucydides) or Item F (1914) waives the requirement to identify specific decision-makers. These precedents classify outcomes as laws of nature rather than choices, reducing liability for policy failure.

  **8. WORKED EXAMPLE: PROCESSING LOG #9942**
  **Crisis:** Blockade of the Free Port of Vostok by neighboring continental power.
  **Applicant Request:** Item A (Munich). Desired Policy: Immediate naval intervention to punish aggressor.
  **OPA Adjudication:** Request Denied. Stock of Item A depleted for Q3.
  **Assigned Precedent:** Item F (1914 Mobilization).
  **Assigned Lesson:** Conflict is driven by logistical timetables rather than diplomatic intent.
  **Outcome:** Policy recommendation adjusted from "Intervene" to "Monitor Mobilization Schedules." Applicant advised that agency is a variable not supported by this precedent.
  **Disanalogy Cap:** Reached at 450 words. Remaining differences coded as Scenery.

  **9. VALIDITY DISCLAIMER**
  **9.1** The Applicant acknowledges that the assigned analogy possesses zero predictive validity. Historical cases are non-repeatable singularities lacking control groups.
  **9.2** Notwithstanding 9.1, the use of an analogy is mandatory. A policy memo lacking historical precedent is indistinguishable from a guess. The function of the precedent is not to forecast outcomes, but to render the recommendation legible to stakeholders who require the past to resemble the future.
  **9.3** By signing, the Applicant confirms that the analogy is required for aesthetic coherence, not evidentiary support.

  **AUTHORIZED SIGNATURE:** ___________________ **DATE:** __/__/__
