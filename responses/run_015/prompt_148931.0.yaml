  The water turned the wheel inside the mill
  Before the numbers rose to meet the wage.
  No sudden burst of fission lit the sky,
  The drive chain turns before the ledger moves,
  Not like the press that scattered words so fast,
  Or schools that built a slow literacy.

  No hand was paid to think, only a wage,
  To multiply the page without fission.
  The paper fed the frame unlike the mill,
  And passed the text along a human chain,
  The gate fell down when buyers gained literacy,
  But iron never built another press.

  The secret room held more than just a press,
  No worker clocked the hours for a wage,
  The few who knew defied public literacy,
  A small group lit the spark of fission,
  Not built inside a factory or a mill,
  And stopped the world upon a breaking chain.

  The message traveled down a printed chain,
  While muscle strained inside the cotton mill,
  No bomb exploded with that kind of fission,
  The cost dropped low, unrelated to the wage,
  The hardware sat beneath the wooden press,
  But minds alone could raise the literacy.

  It took a century to read the literacy,
  The news spread quick beneath the printing press,
  But profits lagged behind the rising wage,
  The system waited on a new supply chain,
  No single date marked out the fission,
  Reorganization filled the empty mill.

  The steam drove turbines in the textile mill,
  The book spread wide to boost the literacy,
  The weapon sat within a silent chain,
  Unlike the type locked in the printing press,
  Its worth was zero if it earned a wage,
  A cliff arrived, not slope, with fission.

  No fission chose to break the chain it made,
  The press did not compose its own literacy,
  The mill replaced the hand, not who sets the wage.
