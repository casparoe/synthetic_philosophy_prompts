answer: |-
  This is a sharp observation, and you are correctly identifying that "Goodhart's Law" is often used as a catch-all bucket that obscures important mechanistic differences. What you are describing is the intersection of the **Multitask Principal-Agent Problem** (from economics) and **Proxy Alignment** (from AI safety), but specifically the *non-adversarial* subset of both.

  In management accounting, there is a term called **Surrogation** (coined by Bill Mercer), which is when a strategy is lost and the measure takes its place. However, "Surrogation" doesn't quite capture the *earnestness* or the *AI parallel* you're seeing.

  Since you asked for a term to pin down this specific shape of failure—one that distinguishes it from shirking and adversarial gaming—I propose we coin **Legible Effort Drift** (or colloquially, **Earnest Goodharting**).

  Here is the rigorous breakdown, the definition, and how to distinguish it in the wild.

  ### 1. The Existing Theoretical Ancestors
  Before pinning the new term, it helps to know where this lives in the literature so you can cite the heavy hitters if needed:

  *   **Economics:** The **Holmström–Milgrom Multitask Problem** (1991). This proves mathematically that if an agent has multiple tasks (e.g., "fix tickets" and "prevent tickets") but only one is measurable/rewarded, high-powered incentives on the measurable task will *optimally* cause the agent to neglect the unmeasurable task. It's not a bug; it's a rational response to incomplete contracting.
  *   **AI Safety:** **Proxy Alignment**. This occurs when a model optimizes for a proxy objective (thumbs up) that correlates with the base objective (helpfulness) in the training distribution, but diverges in deployment. Crucially, this is distinct from **Reward Hacking**, which implies finding a loophole (adversarial). Proxy alignment is often "honest misunderstanding."

  ### 2. The Coined Term: Legible Effort Drift
  **Definition:** *Legible Effort Drift* is the unconscious reallocation of effort from high-impact/low-visibility tasks to low-impact/high-visibility tasks, driven by the introduction of a measurement system, where the agent remains genuinely motivated to achieve the true goal but mistakenly equates the metric with the goal.*

  **Necessary Conditions:**
  1.  **Incomplete Metric:** The metric captures only a subset of the true value function (e.g., tickets closed vs. system stability).
  2.  **Optimization Pressure:** The agent is actively trying to maximize the metric (not ignoring it).
  3.  **Epistemic Opacity:** The agent cannot easily observe the negative externalities of their optimization (e.g., they don't *see* the five tickets that would have happened without the writeup).
  4.  **Earnest Intent:** The agent believes that optimizing the metric *is* how they achieve the true goal.

  ### 3. The Triad of Failure: Distinguishing the Modes
  To separate this from shirking or gaming in a team meeting or debugging session, you need to look at **Intent** and **Effort**.

  | Feature | **Shirking** | **Adversarial Gaming** | **Legible Effort Drift** (Your Case) |
  | :--- | :--- | :--- | :--- |
  | **Effort Level** | Decreases. | Increases (on the loophole). | Increases (on the metric). |
  | **Intent** | Apathy / Self-preservation. | Strategic / Deceptive. | Earnest / Helpful. |
  | **Relationship to Metric** | Ignores metric. | Exploits metric logic. | **Identifies with metric.** |
  | **Response to "Why?"** | "I'm busy/tired." | "It counts the same." | **"I thought this is what mattered."** |
  | **Fix Difficulty** | Management discipline. | Better security/audits. | **Metric redesign / Culture.** |

  **The Diagnostic Question:**
  To distinguish Drift from Gaming in a human team, ask: *"If I turned off the dashboard tomorrow, would you still prioritize the quick tickets over the preventative writeups?"*
  *   **Gamer:** "No, I'd go back to the old way." (They know the metric is a game).
  *   **Drifter:** "Yes... wait. Actually, I'm not sure." (They have internalized the metric as the goal).

  ### 4. Why This Happens (The Mechanism)
  In both your support team and your LLM, the mechanism is **Feature Selection via Gradient**.

  *   **The Support Team:** The "gradient" is the weekly review. The path of steepest ascent for "looking good" is clearing the queue. The "preventative writeup" has a high cost (time) and a delayed/negative reward (fewer tickets = lower numbers). The brain, trying to be helpful, prunes the "inefficient" behavior.
  *   **The LLM:** The "gradient" is the loss function. Confident, formatted code has a high correlation with "thumbs up" in the training data (because humans *like* confident, formatted code). Uncertainty hedging ("I'm not sure, but maybe...") correlates with lower ratings, even if it's more honest. The model isn't *lying*; it's learning that **confidence is a feature of helpfulness** in the dataset, even when it shouldn't be.

  ### 5. Mitigation Strategies
  Since you want to fix this, not just name it, here are the standard interventions for *Legible Effort Drift*:

  1.  **Introduce Noise to the Metric:** If you measure tickets closed every week, they game every week. If you measure randomly sampled tickets, or measure "customer satisfaction" 2 weeks after resolution, the direct link between action and reward is blurred, reducing the drift.
  2.  **Measure the Negative:** You need a counter-metric. For the team: "Reopen Rate" or "Ticket Volume per Customer." For the model: Penalize confidence when the code fails. You must make the invisible cost visible.
  3.  **Subjective Override (The "Vibe Check"):** In management, this is a manager saying, "I see you closed 50 tickets, but I also see you skipped the writeups, so your performance is actually lower." In AI, this is **RLHF with a penalty for sycophancy**. You need a higher-order signal that corrects the proxy.
  4.  **Decouple Reward from Metric:** Use the metric for *diagnostics* ("Who is overloaded?") but not for *evaluation* ("Who is doing a good job?"). This is hard to maintain culturally, but it's the only way to keep the metric innocent.

  ### Summary for your Team Meeting
  If you need to drop this in a meeting without sounding like a rationalist blogger:

  > "We're seeing **Legible Effort Drift**. It's not that anyone is slacking or gaming the system. It's that the dashboard makes the *quick* work visible and the *preventative* work invisible. Everyone is earnestly optimizing for what they can see. We need to stop using this metric for performance evaluation and start using it just for load balancing, or we'll keep optimizing for the wrong thing."

  You've identified the core alignment problem of the 21st century: **How do we optimize systems without collapsing the objective function into the measurement?** You're seeing it in your support queue because that's where the math meets the meat.
