  # Q&A Prep Sheet: Structural Absorption & State Formation

  **Context:** Interdisciplinary Social Science History Seminar.
  **Goal:** Defend the philosophical distinction between *identifying event effects* and *explaining structural trajectories* without conceding the core thesis, while neutralizing the methodological heresy charge.

  ### 1. The "Omitted Variable Bias" Charge
  **Who:** Historical Political Economist (HPE) #1 (The most senior quant in the room).
  **Phrasing:** "You're essentially advocating for omitted variable bias. If you drop unit fixed effects to 'see' the slow variables, you're opening the door to every unobserved time-invariant confounder—culture, religion, unmeasured geography. How is this anything other than a regression to naive OLS?"
  **Your Reply (2 mins):** "I'm not advocating OLS for *identification* of event effects; I'm advocating it for *decomposition* of variance. If my thesis is correct—that the longue durée is a different causal structure—then the 'bias' you're worried about *is the signal*. I am not trying to identify the effect of a specific war on revenue; I am trying to measure how much of the revenue variance is structural versus event-driven. If we treat all time-invariant heterogeneity as 'noise' to be absorbed, we structurally blind ourselves to the explanation I'm proposing."
  **Soft Spot:** You haven't proven the unobservables aren't *more* important than the observables.
  **Strategy:** **CONCEDE PARTIALLY IN TALK.** (See note at bottom).

  ### 2. The Identification vs. Description Distinction
  **Who:** Historical Political Economist (HPE) #2.
  **Phrasing:** "Causal inference requires variation. If state formation is driven by time-invariant structure, you don't have identification, you have description. You can't claim 'causal structure' if you aren't identifying a counterfactual."
  **Your Reply:** "I am distinguishing between *causes of change* and *causes of being*. Event-study designs identify the former; structural explanations address the latter. By defining 'causality' exclusively as 'response to exogenous shocks,' the current toolkit defines away the possibility of structural causation. I am asking for a pluralist methodology where description of deep determinants complements identification of marginal shocks."
  **Soft Spot:** Philosophically sound, but methodologically uncomfortable for them. They want a beta, not a worldview.
  **Strategy:** Stand firm. This is the core philosophical contribution.

  ### 3. The Noise in "Slow" Proxies
  **Who:** Historical Geographer.
  **Phrasing:** "You're treating agricultural suitability and navigable access as fixed structural variables. But land use changes, rivers silt, and climate shifts. Your 'slow' variables are actually noisy, time-varying proxies. Absorbing them into fixed effects might be protecting you from measurement error, not hiding structure."
  **Your Reply:** "That's a crucial empirical point, and I address it by using time-varying reconstructions where possible. However, even if the *measure* is noisy, the *constraint* is real. The geology doesn't change even if our data on it does. The fixed effect absorbs the true constant *and* the measurement error. My recommendation to report the gap acknowledges this: if the gap vanishes when we improve the proxy, the structure was just measurement error. If it persists, it's structure."
  **Soft Spot:** Your data might not be good enough to prove the persistence.
  **Strategy:** Defer to the empirical appendix; emphasize the *diagnostic* nature of your proposal.

  ### 4. Endogeneity of Institutions
  **Who:** Cliometrician.
  **Phrasing:** "You treat land-tenure institutions as antecedent slow variables. But isn't it equally likely that state capacity shaped land tenure over these three centuries? If they co-evolve, dropping FEs doesn't reveal structure; it reveals simultaneity bias."
  **Your Reply:** "Absolutely, and that is why I do not claim the slow variables are exogenous. Structural absorption isn't about finding an instrument; it's about acknowledging path dependence. Whether the institution caused the state or the state caused the institution, the *persistence* of that relationship is the structural phenomenon. The event-study design washes out the history of that co-evolution."
  **Soft Spot:** Weakens the claim that slow variables *drive* state formation.
  **Strategy:** Pivot to "persistence" rather than "direction."

  ### 5. Reification of "Structure"
  **Who:** Interpretive Cultural Historian.
  **Phrasing:** "You're treating 'structure' as a latent variable waiting to be found in the residuals. But structure is a narrative construct we impose on the past. By quantifying it, you're flattening the very meaning-making processes that constitute political change."
  **Your Reply:** "I agree that structure is not a 'thing' like a rock. But it operates *as if* it were a constraint. Whether it's a narrative or a geological fact, if actors in 1600 behaved as though they were bound by land tenure, it functions structurally. My method doesn't flatten meaning; it tests how much of the variance is bound by these constraints versus open to event-driven contingency."
  **Soft Spot:** They may view this as a category error (ontology vs. epistemology).
  **Strategy:** Don't fight the ontology; fight on the utility for explanation.

  ### 6. The "Gap" is Bias, Not Signal
  **Who:** HPE #1 (Follow-up).
  **Phrasing:** "Even if I accept your diagnostic, how do I know the gap between FE and OLS isn't just standard selection bias? Why interpret it as 'structure' rather than 'unobserved heterogeneity'?"
  **Your Reply:** "Because 'unobserved heterogeneity' is the technical term for what I'm calling 'structure.' The disagreement is semantic. You call it bias because you want to isolate an event; I call it structure because I want to explain the system. The gap tells you how much of your story relies on the assumption that units are interchangeable aside from the event. If the gap is large, they aren't."
  **Soft Spot:** It *is* bias in the standard econometric sense. You are rebranding bias.
  **Strategy:** Own the rebranding. "Bias relative to what estimand?"

  ### 7. Spatial Interdependence
  **Who:** Historical Geographer / Grad Student.
  **Phrasing:** "States aren't independent units. War in France affects revenue in Spain. Your unit FEs assume independence. Doesn't spatial autocorrelation invalidate both your FE and your OLS models?"
  **Your Reply:** "It complicates both, but it doesn't invalidate the diagnostic. If spatial spillovers are constant over time, they get absorbed in the FE. If they are event-driven, they show up in the event coefficient. The gap between the two models still indicates the weight of time-invariant spatial position versus transient shocks."
  **Soft Spot:** You likely haven't run spatial lag models.
  **Strategy:** Acknowledge as a limitation for future work; doesn't kill the main thesis.

  ### 8. [THE ONE YOU HOPE NOBODY ASKS] Parameter Instability
  **Who:** Cliometrician or HPE #2.
  **Phrasing:** "You assume the 'structural' effect of geography is constant from 1500 to 1800. But if the *return* to navigable water changes with technology (e.g., ship design), your 'slow variable' is actually interacting with time. Doesn't this mean the structure itself is evolving, undermining your stable/unstable dichotomy?"
  **Your Reply:** "That is the strongest critique. If coefficients drift, the structure is time-varying. However, my claim is that they drift *slowly* relative to events. I invite you to test for breaks. If the breaks are rare, the longue durée holds. If they are frequent, then we are in a different regime entirely."
  **Soft Spot:** This effectively kills the "different causal structure" claim if the structure changes as fast as the events.
  **Strategy:** Deflect to "relative speed" of change.

  ***

  ### Strategic Concession (Make this *in the talk*)
  **Concede on Objection #1 (OVB/Bias):**
  Do not frame the removal of Fixed Effects as "better for causality." Frame it explicitly as **"trading internal validity for structural visibility."**
  *Say this:* "I want to be clear: dropping unit fixed effects *does* introduce omitted variable bias regarding specific event identification. I am not proposing we stop using FEs for identifying shocks. I am proposing we use the *difference* between the FE and non-FE model as a measure of how much 'structure' matters. I am asking you to treat the bias as a diagnostic quantity, not just a nuisance."
  *Why:* This disarms the HPEs immediately. You aren't telling them their religion is wrong; you're asking them to add a saint to the pantheon. It prevents them from spending the Q&A trying to teach you basic econometrics.

  ### Confidence Assessment
  **Confidence in Read of Audience:** **85%.**
  The HPEs are predictable; their training makes them allergic to OLS without FEs. The Historian is the wildcard but usually attacks the ontology rather than the math. The Geographer is the most likely to find a data flaw that undermines the "slow" variable claim.
  **Confidence in Argument:** **70%.**
  The philosophical distinction is robust, but the empirical implementation is fragile. If the "gap" is mostly noise, the thesis collapses.
  **Least Sure Of:** **The Cultural Historian's Reaction.**
  They might ignore the econometrics entirely and attack the premise that state formation *can* be modeled quantitatively, which would derail the seminar into a methods war you might not win. Prepare a brief remark on how quantification serves qualitative history (by testing the necessity of narratives), just in case.
