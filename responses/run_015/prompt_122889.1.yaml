answer: |-
  This is a sharp framework. Your distinction between **Charter Aim** (the concrete, functional institution or interest being protected) and **Slogan Autonomy** (the abstract, high-minded principle used to justify it) is an excellent analytical tool. It cuts through the fog because it allows two people to agree on the *Slogan* while disagreeing on the *Charter*.

  For your cookout argument, I recommend one slight refinement: **Slogan Autonomy often functions as a retrospective shield.** It is frequently adopted *after* the fact to sanitize the Charter Aim.

  Below is a breakdown organized by the three historical layers you identified (Secession Rhetoric, Confederate Structure, Monument Era), followed by a "Menu of Readings" for the slogan itself. Each reading is evaluated on its truth value and, crucially, whether it successfully bridges the gap to your uncle's conclusion ("Therefore, the statues are innocent heritage").

  ---

  ### Part 1: The Three Historical Layers
  *Applying your Charter Aim vs. Slogan Autonomy tool to the specific historical moments.*

  #### Layer 1: The Secession Crisis (1860–1861)
  *What the seceding states said they were doing.*
  *   **Slogan Autonomy:** "Self-determination," "Resistance to tyranny," "The Principles of 1776."
  *   **Charter Aim:** The preservation and expansion of chattel slavery against perceived federal threat.
  *   **The Link:** In the secession conventions, the *Slogan* was explicitly tied to the *Charter*. They did not speak of "states' rights" in the abstract; they spoke of the right to hold property in humans.
  *   **Verdict:** The Slogan was the language used to defend the Charter. You cannot separate them here without ignoring the texts of the Declarations of Causes issued by states like Mississippi and Texas.

  #### Layer 2: The Confederate Government (1861–1865)
  *What the new government was actually structured to protect.*
  *   **Slogan Autonomy:** "Sovereignty of the States," "Limited Federal Power." (Interestingly, the CSA constitution was *more* centralized than the US constitution in some ways, limiting states' rights to curb internal dissent).
  *   **Charter Aim:** Explicit constitutional protection of slavery (e.g., forbidding any law that impaired "the right of property in negro slaves").
  *   **The Link:** The "States' Right" in the Confederate Charter was not a generic principle of federalism; it was a specific legal mechanism to guarantee slavery. The right *was* the slavery.
  *   **Verdict:** The Charter Aim was slavery. The Slogan Autonomy was the legal vehicle.

  #### Layer 3: The Monument Era (1890s–1920s)
  *What later monument-builders were honoring when they put the statues up.*
  *   **Slogan Autonomy:** "Southern Heritage," "Ancestral Valor," "Reconciliation."
  *   **Charter Aim:** The consolidation of Jim Crow laws, the disenfranchisement of Black voters, and the re-assertion of white supremacy following Reconstruction. (Note: The peak of monument building correlates with the peak of lynching and the enactment of segregation laws, not the immediate post-war mourning period).
  *   **The Link:** The monuments were physical assertions of who owned the public square.
  *   **Verdict:** If the Charter Aim of the *monument movement* was to signal white dominance, then the "Heritage" Slogan is a sanitization of that aim.

  ---

  ### Part 2: The Menu of Readings
  *Here are the specific precise theses your uncle's slogan might be expressing. You can offer these as options to pin him down.*

  #### Reading 1: The "Mechanism vs. Object" Thesis
  *   **The Claim:** "States' rights was the *mechanism* (the how), slavery was the *object* (the what). So technically, the war was about states' rights."
  *   **Classification:** **Trivial Truism.**
  *   **Analysis:** This is linguistically true but historically hollow. It's like saying a bank robbery was "about the gun, not the money." Yes, the gun was the mechanism, but the purpose was the money.
  *   **Does it support the Uncle's conclusion?** **No.**
      *   *Why:* Even if the war was *fought* over the mechanism of states' rights, if the *only right* they were asserting was the right to own slaves, the "heritage" being honored is still the right to own slaves. It admits the Charter Aim was slavery.

  #### Reading 2: The "Alternative Content" Thesis
  *   **The Claim:** "There were other states' rights issues at stake (tariffs, internal improvements, cultural autonomy). Slavery was just one of many, or even incidental."
  *   **Classification:** **Substantive but False.**
  *   **Analysis:** This argues that the Charter Aim was broader than slavery.
  *   **Historical Flag:** While tariffs and economic differences existed, the *secession documents* and the *Cornerstone Speech* explicitly prioritize slavery above all else. If you could prove that 50% of secession delegates cited tariffs as their primary motivator in private letters, this might be defensible. Current historical consensus places slavery as the overwhelming primary driver.
  *   **Does it support the Uncle's conclusion?** **Yes, *if* it were true.**
      *   *Why:* If the Charter Aim was actually "economic autonomy" or "tariffs," then the monuments could be honoring economic resistance rather than white supremacy. But since the premise is false, the conclusion collapses.

  #### Reading 3: The "Generational Shift" Thesis
  *   **The Claim:** "The *soldiers* fought for slavery (1860s), but the *monument builders* (1900s) were honoring 'heritage' and 'bravery' without the racial baggage."
  *   **Classification:** **Substantive and Defensible (with caveats).**
  *   **Analysis:** This separates Layer 2 (Confederate Govt) from Layer 3 (Monuments). It argues the Slogan Autonomy of the 1900s builders was sincere, even if the 1860s Charter Aim was not.
  *   **Historical Flag:** This depends on the intent of the United Daughters of the Confederacy and other groups. If their private minutes show they viewed the statues purely as art or genealogy, this holds. However, if their public dedications coincided with voter suppression laws, the "Charter Aim" of the monument movement remains white supremacy.
  *   **Does it support the Uncle's conclusion?** **Weakly.**
      *   *Why:* Even if the *individual* great-uncle feels innocent, the *public project* of the monuments served a specific Charter Aim (Jim Crow). Honoring a "heritage" that was constructed to enforce segregation makes the heritage itself racialized. It shifts the blame from the soldiers to the sculptors, but the statues still function as symbols of the Jim Crow era.

  #### Reading 4: The "Abstract Principle" Thesis
  *   **The Claim:** "The specific cause doesn't matter. The statues honor the abstract principle of 'resisting federal overreach,' which is a valid American value."
  *   **Classification:** **Substantive but Philosophical.**
  *   **Analysis:** This argues that the Slogan Autonomy has detached from the Charter Aim entirely and now stands on its own as a generic political value.
  *   **Does it support the Uncle's conclusion?** **No.**
      *   *Why:* Public monuments are historical, not philosophical. We do not build statues to "Resistance" in the abstract; we build them to specific historical actors. If those actors resisted federal overreach *specifically to maintain slavery*, honoring their "resistance" inherently honors the slavery component. You cannot honor the "resistance" without honoring what they were resisting *for*.

  #### Reading 5: The "Erasure" Thesis (The Uncle's Implicit Fear)
  *   **The Claim:** "Taking down the statues is saying our ancestors were monsters. Saying it was about 'states' rights' protects their dignity."
  *   **Classification:** **Emotional/Psychological Claim.**
  *   **Analysis:** This isn't a historical claim; it's a claim about family identity. The "States' Rights" slogan is being used as a shield for personal dignity.
  *   **Does it support the Uncle's conclusion?** **Irrelevant to history, central to the conflict.**
      *   *Why:* This explains *why* he is arguing, not whether he is right. Acknowledging this might de-escalate the cookout. You can agree that ancestors are complex without agreeing that public monuments should enshrine the Charter Aim of white supremacy.

  ---

  ### Part 3: How to Use This at the Cookout

  Don't try to serve the whole menu. Pick the fork that fits the conversation.

  **If he says:** "It was about states' rights, plain and simple."
  **You ask:** "Are you saying states' rights was the *mechanism* (Reading 1) or that there were *other issues* besides slavery (Reading 2)?"
  *   *If Mechanism:* "Okay, so the right they wanted was the right to own people. So the heritage is about that right?"
  *   *If Other Issues:* "Did you read the secession declarations? They list slavery as the primary cause. If the Charter Aim was slavery, does the mechanism matter?"

  **If he says:** "The statues were put up later by people who just loved their ancestors."
  **You ask:** "That's the Generational Shift thesis (Reading 3). But if the statues went up exactly when Black people were losing the right to vote, doesn't that make the 'Charter Aim' of the statues about power, not just grief?"

  **The Kill Shot (using your tool):**
  "Uncle, I think we're confusing **Slogan Autonomy** with **Charter Aim**. Everyone agrees the *slogan* was states' rights. But if the *Charter Aim*—the actual thing the laws and the monuments were built to secure—was white supremacy, then keeping the monuments keeps the Charter Aim in the public square. You can love the heritage without honoring the Charter."

  ### Summary for your pocket:
  1.  **Mechanism vs. Object:** True, but doesn't help him. (The gun vs. the money).
  2.  **Alternative Content:** False. (It wasn't tariffs).
  3.  **Generational Shift:** Defensible, but the 1900s aim was *also* white supremacy (Jim Crow).
  4.  **Abstract Principle:** Philosophically interesting, but monuments are historical, not abstract.
  5.  **Conclusion:** None of the *true* readings support the idea that the monuments are "innocent." Only the *false* readings support that conclusion.
