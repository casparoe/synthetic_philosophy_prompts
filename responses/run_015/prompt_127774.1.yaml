  # Workshop Handout: Determining the Social Discount Rate
  **Committee on Temporal Impact Statements**  
  **Decision Tree for Policy Graduate Students**

  **Instructions:** This tree sorts ethical positions on intergenerational discounting. Start at Node 1. Answer the case-based question honestly. Follow the arrow to the next Node or the final Leaf. Do not worry about the name of the Leaf; answer the case.

  ---

  ### Node 1: The Existential Risk Case
  **Case:** A sea wall provides its entire benefit in Year 200. We are told there is a 50% chance that due to unrelated existential catastrophe, no beneficiaries will exist to use it.
  **Question:** Do you record this 50% uncertainty as a **probability weight** on the benefit (Benefit × 0.5), or as a **discount rate** applied over time (e.g., 0.35% annual discount)?
  *Note: If the project itself *reduces* the catastrophe risk, does your mathematical treatment change?*
  *   **A:** It is a probability weight. If the project reduces risk, that is a separate benefit, not a change in the discount rate. → **Go to Node 2**
  *   **B:** It is a discount rate (or hazard rate). If the project reduces risk, the discount rate for that project should be lower. → **Leaf 9: Unnamed (Institutional Hazard View)**

  ### Node 2: The Certainty Case
  **Case:** The same sea wall, but you are stipulated to know that the beneficiaries **certainly exist**, are **identifiable**, and will be **no richer** than we are.
  **Question:** Do you discount the Year 200 benefit relative to a Year 1 benefit solely because of the **temporal distance**?
  *   **A:** No. Time alone does not diminish value. → **Go to Node 3**
  *   **B:** Yes. Future goods are worth less simply due to temporal position. → **Go to Node 5**

  ### Node 3: The Interval Case
  **Case:** Compare the moral distance between Year 0 and Year 1 against the distance between Year 100 and Year 101.
  **Question:** Is the gap in moral concern **identical** (Constant Rate) or **smaller** in the distant future (Declining Rate)?
  *   **A:** Identical. A year is a year. → **Go to Node 4**
  *   **B:** Smaller. Uncertainty or moral urgency decays over time. → **Leaf 5: Declining-Rate View**

  ### Node 4: The Intrapersonal Case
  **Case:** You have a choice between a mild toothache today or a mild toothache next year. You discount the future pain. A **stranger** faces the same choice.
  **Question:** Do you apply the **same discount rate** to the stranger's future pain as you do to your own?
  *   **A:** Yes. Prudence and justice require the same temporal logic. → **Go to Node 7**
  *   **B:** No. I discount my own future discomfort, but not a stranger's. → **Leaf 7: Discounting Within a Life Only**

  ### Node 5: The Past Harms Case
  **Case:** Compensation is owed for land seized by the state. Case X: Seized 5 years ago. Case Y: Seized 300 years ago.
  **Question:** Is the claim in Case Y **discounted by time** relative to Case X, assuming the value of the land is identical?
  *   **A:** Yes. Time erodes the stringency of past claims too. → **Leaf 3: Positive Pure Rate (Ethical)**
  *   **B:** No. Past harms are fixed debts; future benefits are investments. → **Go to Node 6**

  ### Node 6: The Preference Case
  **Case:** Market data shows people currently demand a 4% return to defer consumption.
  **Question:** Do we adopt this rate because it reflects **actual preferences**, or do we override it with an **ethical rate**?
  *   **A:** Adopt it. We defer to revealed preferences. → **Leaf 4: Positive Rate (Revealed Preference)**
  *   **B:** Override it. Ethics dictates the rate, not markets. → **Go to Node 7**

  ### Node 7: The Ramsey Saving Case
  **Case:** A zero pure time preference rate combined with 2% economic growth implies we should save roughly 20% of current income for the future.
  **Question:** Is this level of saving **acceptable** or **grotesque**?
  *   **A:** Acceptable. We must not privilege the present. → **Leaf 2: Zero Pure Time Preference (Ramsey)**
  *   **B:** Grotesque. We cannot demand this much of the present. → **Go to Node 8**

  ### Node 8: The Stringency Case
  **Case:** We promise to monitor a waste repository for 200 years. The benefit to the future cohort is small, but the promise was explicit.
  **Question:** Is the cost justified by the **magnitude of the benefit** to them, or by the **binding nature of the promise** (stringency of the claim)?
  *   **A:** Magnitude of benefit. If the benefit is too small, the promise lapses. → **Leaf 11: Unnamed (Critical Threshold View)**
  *   **B:** Binding nature. The duty binds tighter than the benefit size explains. → **Leaf 8: Stringency of Claim View**

  ---

  ### The Leaves (Positions)

  1.  **No Discounting of Any Kind:** (Reached if Node 2=A, Node 3=A, Node 7=A). *Awkward Commitment:* You must accept that a trivial benefit to a vast future population outweighs any significant cost to the present.
  2.  **Zero Pure Time Preference (Ramsey):** (Reached if Node 2=B, Node 6=B, Node 7=A). *Awkward Commitment:* You must endorse massive current austerity to fund projects whose beneficiaries are unknowable.
  3.  **Positive Pure Rate (Ethical):** (Reached if Node 5=A). *Awkward Commitment:* You must tell a descendant that a harm done to their ancestor is worth less than a harm done to yours simply because it happened longer ago.
  4.  **Positive Rate (Revealed Preference):** (Reached if Node 6=A). *Awkward Commitment:* You must accept that the discount rate should rise if the current generation becomes more impatient, even if ethics demands otherwise.
  5.  **Declining-Rate View:** (Reached if Node 3=B). *Awkward Commitment:* You must admit that the moral value of a year is not constant, which complicates all standard cost-benefit mathematics.
  6.  **Risk is Probability:** (Reached if Node 1=A). *Awkward Commitment:* You must treat existential extinction as a mere probability weight, potentially undervaluing insurance projects that lower the risk rate itself.
  7.  **Discounting Within a Life Only:** (Reached if Node 4=B). *Awkward Commitment:* You must defend why your own prudence is rational but applying that same prudence to a stranger is discriminatory.
  8.  **Stringency of Claim View:** (Reached if Node 8=B). *Awkward Commitment:* You must enforce costly duties to future people even when the net welfare gain is negligible or negative.
  9.  **Unnamed (Institutional Hazard):** (Reached if Node 1=B). *Awkward Commitment:* You treat the survival of our specific institutions as a discountable asset rather than a precondition for value.
  10. **Unnamed (Democratic Mandate):** (Reached if Node 5=B, Node 6=A). *Awkward Commitment:* You allow current voters to set the rate for past injustices they did not commit.
  11. **Unnamed (Critical Threshold):** (Reached if Node 8=A). *Awkward Commitment:* You admit promises to the future are voidable if the beneficiaries are not rich enough to make the benefit "worth it."

  ---

  ### Analysis of Empty Spaces

  **Three Permitted but Unoccupied Combinations:**
  1.  **Node 1=B (Risk=Rate) + Node 2=A (Certainty=No Discount):** *Diagnosis:* Incoherent. If risk justifies a rate, certainty should remove it; holding both implies the rate is both epistemic and ontological.
  2.  **Node 4=B (Intrapersonal Diff) + Node 8=B (Stringency):** *Diagnosis:* Unexplored. Most who distinguish self/stranger abandon strong duties to strangers; combining prudential discounting with deontological stringency is rare.
  3.  **Node 3=B (Declining) + Node 7=A (Accept Saving):** *Diagnosis:* Merely Unattractive. Declining rates usually aim to *avoid* the saving implication; accepting the saving renders the declining rate mathematically unnecessary.

  **Two Indistinguishable Leaf Pairs:**
  1.  **Leaf 2 (Zero Pure Time) vs. Leaf 8 (Stringency):** *Why:* Both reject discounting based on temporal position. *Separator:* A case where the benefit is negative (a harm). Leaf 2 aggregates welfare (might accept harm); Leaf 8 binds duty (forbids harm regardless of aggregate).
  2.  **Leaf 6 (Risk=Probability) vs. Leaf 9 (Institutional Hazard):** *Why:* Both use rates to handle uncertainty. *Separator:* A project that increases existential risk but lowers institutional risk. Leaf 6 weights the existence; Leaf 9 discounts the institutional failure.

  ---

  ### Placement of the Workshop Convenor (You)

  **Your Stated Views:**
  1.  **Certainty:** Refuse discount if beneficiaries exist/identifiable/not richer. (Node 2 = A).
  2.  **Confidence:** Want lower rate for Year 200 because confidence decays. (Node 3 = B).
  3.  **Intrapersonal:** Discount self, uneasy discounting stranger. (Node 4 = B).
  4.  **Past:** No discount on past harms. (Node 5 = B).
  5.  **Saving:** Zero rate + growth = grotesque saving. (Node 7 = B).
  6.  **Stringency:** Promises bind tighter than benefit size. (Node 8 = B).

  **Diagnosis:**
  Your combination breaks at **Node 4**.
  You answer "No" (Different rules for self/stranger), which directs you to **Leaf 7 (Discounting Within a Life Only)**. However, Leaf 7 typically implies standard welfarism for strangers (no special stringency). You explicitly hold the **Node 8 (Stringency)** view for strangers. The tree forces a choice between the *Intrapersonal Distinction* and the *Stringency Distinction*. You hold both, but the tree routes you away from Node 8 if you answer Node 4 as "Different."
  Furthermore, there is tension between Node 2 (No Discount if Certain) and Node 3 (Declining Rate due to confidence). If confidence decays, they are not "Certain" in the epistemic sense required for Node 2=A. You are treating "Certainty" as ontological (they exist) but "Confidence" as epistemic (we know it). The tree treats these at Node 1 and Node 2 separately, but your view blends them.

  **Recommendation:**
  The leaf I recommend to the committee is **Leaf 8 (Stringency of Claim View)**. It avoids the grotesque saving implication of Leaf 2 while maintaining the moral seriousness of Leaf 1, by shifting the justification from *welfare magnitude* to *obligatory duty*.

  **What Would Move Me:**
  *   **Off Leaf 8:** An empirical finding that "promises" to the distant future are systematically re-interpreted by intermediate generations, rendering the "binding" nature illusory. If institutional memory cannot survive 200 years, stringency is empty.
  *   **Off Leaf 2 (Ramsey):** If the "grotesque saving" implication were shown to be a mathematical artifact of constant elasticity assumptions rather than a true ethical demand.
  *   **Lowest Confidence:** I am least confident in **Node 1 (Risk vs. Rate)**. Distinguishing between a probability of non-existence and a discount rate for existential risk is mathematically subtle and ethically fraught; small errors here compound massively over 200 years.

  \answer{unclassifiable, Node 4}
