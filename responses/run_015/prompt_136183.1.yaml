prompt: |-
  I'm not in academia, but I've been trying to understand the argument about whether we should supervise AI systems by watching their step-by-step reasoning or just by checking whether their final answers are correct. To help me think it through, write a deadpan satirical internal memo—around 600 words, with a bureaucratic header, numbered compliance sections, and an FAQ appendix—from a fictional "Joint Committee on AI Oversight" proposing a new "Process-Verified Outcome Certification" (PVOC). The memo should pretend to solve the tension between process-based and outcome-based supervision, but actually expose the problems with both: auditors must observe every intermediate computation despite neural opacity; systems must undergo "counterfactual outcome trials" to prove they weren't just lucky; and there must be a "Reasoning Integrity Log" that distinguishes wrong answers reached by valid logic from right answers reached via false premises followed by chance. Keep the voice deadpan bureaucratic—treat moral luck, computational opacity, and the value of correct reasoning as routine paperwork issues. Include an invented "Chief Auditor" and a flowchart for whether to praise an AI that honestly reports its own error. The satire should be fair to the real debate (as in RLHF and reward-model discussions) without citing specific papers. After the memo, add a brief author's note—under 150 words—saying where the piece takes liberties with actual technical practice, whether PVOC is closer to a real framework or a reductio, and what specific argument or finding would convince you the hybrid approach actually works. Don't ask for citations or reading lists; just make it readable to someone who follows tech news but hasn't studied philosophy.
