  ### Proposed Principle: Default-Relative Interventional Invariance

  Your six verdicts are jointly satisfiable under a **Non-Reductive Interventionist Framework**, specifically a version of Structural Equation Modeling (SEM) augmented with **Default Relativity** and **Proportionality**.

  **The Principle:**
  $C$ is a genuine cause of $E$ relative to a causal model $M$ if and only if:
  1.  **Variable Representation:** $C$ and $E$ are represented as variables in $M$, where $C$ can take a "default" (e.g., null/omission) or "deviant" (e.g., action/event) value.
  2.  **Interventional Dependence:** There exists a possible intervention on $C$ that changes the value or probability distribution of $E$.
  3.  **Active Path & Contingency:** The dependence travels along an *active* causal path. In cases of redundancy (overdetermination), $C$ counts as a cause if there is a *valid contingency* (e.g., holding the redundant cause fixed at its default value) under which $C$ makes a difference to $E$.
  4.  **Realization Independence:** The dependence of $E$ on $C$ remains invariant across variations in the micro-physical realizers of $C$ (ensuring macro/mental variables are not excluded by their micro-bases).

  ---

  ### Application to Cases

  *   **Case 1 (Overdetermination):** Satisfied by Condition 3 (Contingency). Although the fire does not counterfactually depend on Arsonist 1 *given* Arsonist 2, Arsonist 1 is a cause because there is a valid contingency (Arsonist 2 absent/default) where Arsonist 1 makes a difference. Both are members of a sufficient set.
  *   **Case 2 (Omission):** Satisfied by Condition 1 (Variable Representation). "Watering" is a variable with values {Water, Do-Nothing}. "Do-Nothing" is the default. An intervention to "Water" changes the outcome. The absence is a value, not a metaphysical void.
  *   **Case 3 (Preemption):** Satisfied by Condition 3 (Active Path). Suzy's path is active; Billy's path is inhibited by Suzy's success. There is no valid contingency where Billy makes a difference *given the actual structure*, because his path is structurally blocked.
  *   **Case 4 (Probabilistic):** Satisfied by Condition 2 (Probability Distribution). The intervention on emissions changes the *probability* of the heatwave, not its certainty. Causation is defined over distributions, not just deterministic outcomes.
  *   **Case 5 (Downward Constraint):** Satisfied by Condition 4 (Realization Independence). The thermostat setting causes the distribution because the relationship holds regardless of the specific molecular velocities. The micro-events are causes of specific collisions, but the macro-setting is the invariant cause of the *distribution*.
  *   **Case 6 (Mental-Physical):** Satisfied by Condition 4. $M$ causes the action because the $M \to Action$ relationship holds across different neural realizations of $M$. While one cannot intervene on $M$ without altering $P$, the intervention is valid so long as the change in $P$ is *mediated* by the change in $M$ (respecting supervenience).

