  9.  **Self-Correction during drafting:** I initially thought about "Confirmation Bias." No, that's individual. This is disciplinary. Stick to Lakatos and Mink. The user mentioned Hayden White. I need to explain why White is *close* but misses the "absorption" mechanic. White says history *is* fiction-like. The user is asking about the *immune system* of that fiction.

      *Wait, one more concept:* **"Theoretical Resilience"** or **"Immunization Strategies."** Popper talked about Marxism/Psychoanalysis being unfalsifiable because they could explain *anything*. This is exactly what the user is describing. A historical narrative that can absorb any fact without changing is unfalsifiable.
      *Decision:* Bring in Popper's critique of historicism, but refine it. It's not that history is pseudoscience, but that narratives function as closed loops of meaning.

      *Let's structure the answer:*
      1. Validate the observation (it's astute).
      2. Separate the two phenomena (Weighting vs. Absorption).
