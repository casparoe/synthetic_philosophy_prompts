          *   Describe what a case where correction *does* force reshaping would look like (to distinguish the phenomenon).
          *   If no established term exists, propose a definition that doesn't collapse into "narratives have shapes."

  2.  **Deconstruct the Phenomenon:**
      *   *Fact A:* Historians agree on micro-facts (sentences, footnotes).
      *   *Fact B:* Historians disagree on macro-narratives (periodization, causality, significance).
      *   *Fact C:* Adding missing micro-facts often fails to alter the macro-narrative. The narrative is robust/elastic.
      *   *Fact D:* Critics complain about omissions, but fixing omissions doesn't satisfy the criticism because the criticism was actually about the *narrative shape*, not the missing data.

  3.  **Evaluate Existing Concepts (and why they might fall short per the user's intuition):**
      *   *Selection/Bias:* User says this is about what gets pulled in, not what happens *after*. True, but related.
      *   *Underdetermination of Theory by Evidence:* User says in science, new data *can* kill a theory. In history, it seems new facts rarely kill the narrative. This is a key distinction.
      *   *Narrative Constructivism (Hayden White):* White argues history is literature. This explains *why* stories have shapes, but does it explain the *resilience* of the shape against new facts? White focuses on emplotment (tragedy, comedy, etc.).
      *   *Paradigm Shifts (Kuhn):* In science, anomalies accumulate until the paradigm breaks. In history, anomalies seem to get absorbed. This is a strong parallel to explore.
      *   *Confirmation Bias:* Too psychological/individual. This is structural to the discipline.
      *   *Holism/Coherentism:* A belief system adjusts to accommodate new data without changing core tenets.

  4.  **Identify the Closest Philosophical/Historiographical Concepts:**
      *   **Narrative Intelligibility / Employment:** The idea that facts only make sense within a story structure. (White, Mink, Ricoeur).
      *   **The "Web of Belief" (Quine):** Any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system. This fits the "absorption" perfectly.
      *   **Lakatos's "Research Programmes":** A "hard core" of assumptions protected by a "protective belt" of auxiliary hypotheses. New facts are handled by adjusting the belt, not the core. This is very close to what the user describes.
      *   **Collingwood's "Re-enactment" / "Question and Answer":** Facts are answers to specific questions. If the question (the narrative focus) doesn't change, the answer (the fact) just slots in.
      *   **Gallie's "Essentially Contested Concepts":** Maybe the *purpose* of the history is different, so the facts serve different masters.

  5.  **Synthesize a Response Strategy:**
      *   **Acknowledge the Insight:** Validate that this is a sharp observation, arguably more practical than the Carr/White debate.
      *   **Address the "Space-Allocation" (Emphasis):** This is *Significance* or *Causal Weighting*. It's about the hierarchy of facts.
      *   **Address the "Absorption Property" (Resilience):** This is the core request.
      *   **Candidate 1: Lakatosian "Protective Belt".** This is the strongest fit for "adding facts without changing the core."
      *   **Candidate 2: Quinean "Holism".** "Any statement can be held true..."
      *   **Candidate 3: Narrative "Emplotment" (White/Mink).** But refine it to focus on *resistance to falsification*.
      *   **Candidate 4: "Anomaly Absorption" (Kuhn vs. History).** Contrast science (where anomalies break paradigms) with history (where they become footnotes).
      *   **What would a "Reshaping" look like?** Need to define the negative case to clarify the positive one. (e.g., discovery of a document that proves the main actor wasn't there, or a structural shift like the *Annales* school moving from events to structures).
      *   **Proposed Terminology:** If no single word exists, coin or refine a phrase. "Narrative Elasticity"? "Historiographical Homeostasis"? "Explanatory Inertia"? Let's go with **"Narrative Homeostasis"** or **"Explanatory Inertia"** within a **"Research Programme."**

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Validate the Carr/White context. The user is describing the *mechanics* of how narratives survive.
      *   *Concept 1: The Space Allocation.* This is **Causal Weighting** or **Periodization**. It's about the *grammar* of the narrative.
      *   *Concept 2: The Absorption.* This is the big one.
          *   *Lakatos:* Hard Core vs. Protective Belt. The "story" is the Hard Core. The "facts" are the Belt. You tweak the belt to save the core.
          *   *Quine:* Web of Belief.
          *   *Why "Underdetermination" isn't enough:* Underdetermination says evidence doesn't dictate theory. The user's point is stronger: evidence *fails to disrupt* theory. It's about *resilience*, not just ambiguity.
      *   *The "Reviewers' Complaint":* The reviewer is attacking the Hard Core (the story), but phrasing it as a missing fact (Protective Belt). The author fixes the belt, ignores the core.
      *   *What would force a reshaping?*
          *   Not just a new fact.
          *   A *structural* fact. (e.g., The "Hitler's War" debate. If you find proof Hitler ordered the Holocaust vs. if you find proof he didn't know. That changes the *agent*.)
          *   A change in *Question*. (e.g., shifting from "Who signed the treaty?" to "What was the economic pressure?").
      *   *Naming it:* "Narrative Homeostasis" sounds good. Or "Historiographical Inertia." Let's suggest **"Narrative Homeostasis"** as the descriptive term, grounded in **Lakatosian Research Programmes**.

  7.  **Refining the "Science vs. History" distinction:**
      *   User says: "In science new data sometimes does force you to drop the theory."
