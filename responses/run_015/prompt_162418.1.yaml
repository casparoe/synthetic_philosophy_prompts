      *   **Specific Phenomenon:** When a reviewer points out an omission (a faction, a decade, etc.), the author adds it in the next edition. The fact is absorbed, the story *shape* doesn't change, and the original complaint remains valid (because it wasn't really about the missing fact).
      *   **Core Question:** Is there a name for this "absorption property"? Is there literature on it?
      *   **Constraints:**
          *   Don't just give a label.
          *   Distinguish between the "space-allocation thing" (emphasis) and the "absorption thing" (assimilation of new facts without structural change).
