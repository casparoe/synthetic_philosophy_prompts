answer: |-
  This is an exceptionally sharp observation. You have identified a mechanical feature of historiography that sits somewhat uncomfortably between the "facts are objective" camp (Ranke) and the "history is literature" camp (White). You are describing the *immune system* of a historical narrative.

  To answer your specific constraints: Yes, this is effectively two distinct phenomena that work in tandem. The "space-allocation" issue is about **Causal Weighting**; the "absorption" issue is about **Narrative Homeostasis**.

  There is no single standard English noun for the absorption property, but there is a robust philosophical framework that describes exactly how it works. Here is the breakdown of the concepts, why the usual labels fail, and what a genuine "reshaping" would actually look like.

  ### 1. The Two Phenomena

  **A. Space-Allocation (Causal Weighting / Periodization)**
  You noted that one book gives a famine four pages and another a semicolon. This is not just selection; it is **hierarchical ordering**.
  *   **The Concept:** In philosophy of history, this is often discussed under **Causal Significance** or **Explanatory Priority**.
  *   **Why it's not just "selection":** Selection implies a binary (in/out). You are describing a gradient of *force*. In one narrative, the famine is a *cause*; in the other, it is *background noise*.
  *   **The Mechanism:** This is determined by the **Periodization** (where the book starts/ends) and the **Protagonist** (who the book is about). If your book is about "The Failure of Central Planning," the famine is a chapter. If your book is about "The Diplomatic Maneuvers of 1989," the famine is a semicolon.
  *   **Literature:** This is classic **R.G. Collingwood**. He argued that historical facts are not "brute data" but "answers to questions." If Book A asks "Why did the economy fail?" and Book B asks "How did the treaty get signed?", the *same fact* (the harvest figure) has a different logical status in each. It isn't being "weighted" differently; it is serving a different logical function.

  **B. The Absorption Property (Narrative Homeostasis)**
  This is your core question: adding true material without altering the story's shape, thereby neutralizing the criticism without conceding the point.
  *   **The Concept:** The closest established framework is **Imre Lakatos's "Methodology of Scientific Research Programmes"** (1970), applied to history.
  *   **The Mechanism:** Lakatos argued that theories have a **"Hard Core"** (fundamental assumptions that are irrefutable by convention) and a **"Protective Belt"** (auxiliary hypotheses, data points, specific claims).
      *   When an anomaly arises (a reviewer says "you missed this faction"), the historian does not touch the Hard Core (the story shape). They adjust the Protective Belt (add a footnote, add a paragraph).
      *   The Hard Core is protected from falsification by the flexibility of the Belt.
  *   **Why "Underdetermination" falls short:** As you noted, underdetermination says evidence doesn't *dictate* a theory. Your observation is stronger: evidence often fails to *perturb* a theory. Underdetermination is about the start of the process (many maps fit the territory); you are describing the *durability* of the map during the process (adding new territory doesn't require redrawing the map).
  *   **Why "White/Constructivism" falls short:** Hayden White argues history is emplotment (tragedy, comedy, etc.). This explains why there *is* a shape, but it doesn't explain the *elasticity* of that shape. White implies the shape is imposed from the outside (literary convention). You are describing a shape that actively digests new matter to preserve itself.

  ### 2. A Name for the Absorption Property

  If we need a term that doesn't collapse into "narratives have shapes," I propose **Narrative Homeostasis**.

  *   **Definition:** The capacity of a historical narrative to assimilate new factual data into its existing explanatory structure without requiring a revision of its primary causal claims or periodization.
  *   **The Condition:** Homeostasis occurs when the new fact is treated as **contingent** rather than **constitutive**.
      *   *Constitutive fact:* "The General was not in the room." (This breaks the story of the General's decision).
      *   *Contingent fact:* "The General was in the room, and also this other guy was there." (This is absorbed; the General is still the protagonist).

  In your example, the reviewer complains about a missing faction. The author adds the faction. The story doesn't change because, in the author's Hard Core, that faction was never going to be an *agent* of history, only an *object* or *obstacle*. By adding them as an object/obstacle, the author satisfies the factual critique while maintaining the causal hierarchy.

  ### 3. Why Science is Different (Prediction vs. Retrodiction)

  You asked why this doesn't happen in science (where new data kills theories).
  *   **Science is Predictive:** If Newton's laws predict a planet's position and it isn't there, the theory is in trouble. The future is a hard constraint.
  *   **History is Retrodictive:** History explains what *already happened*. There is no future constraint. You can always construct a plausible path from A to B that incorporates C, D, and E.
  *   **The Popperian Critique:** Karl Popper criticized Marxism and Psychoanalysis for being "unfalsifiable" because they could explain *any* outcome. If the revolution happens, it's class struggle; if it doesn't, it's false consciousness. Your observation is that *all* historical narratives possess this unfalsifiability to some degree. They are closed loops of meaning. A new fact is just a new node in the web; it doesn't break the web unless it severs a load-bearing strand.

  ### 4. What Would a "Reshaping" Look Like?

  If Narrative Homeostasis is the rule, what constitutes a breach? When does a correction *force* a retelling? It requires one of three specific shocks:

  **A. The Agent-Removal Shock**
  *   *Scenario:* A biography of a dictator argues he was the sole architect of a policy.
  *   *Absorption:* New docs show his advisors suggested it. (Absorbed: "He wisely listened to advisors.")
  *   *Reshaping:* New docs prove he was incapacitated/unconscious during the decision week.
  *   *Why:* This removes the *agent*. If the protagonist didn't do it, the "Great Man" narrative collapses. The Hard Core is touched.

  **B. The Structural-Inversion Shock**
  *   *Scenario:* A narrative argues "Economic pressure caused the revolution."
  *   *Absorption:* New data shows a specific harvest failed. (Absorbed: "See, economic pressure.")
  *   *Reshaping:* New data shows the harvest was record-breaking, and the "famine" was a logistical myth created by the state.
  *   *Why:* This inverts the causal vector. The "Economic Determinist" Hard Core cannot survive a fact that removes the economic pressure. It forces a shift to a "Political Voluntarist" core.

  **C. The Periodization Breach**
  *   *Scenario:* A book ends in 1989 (Fall of Wall).
  *   *Absorption:* Adding events from 1990. (Absorbed: "The aftermath.")
  *   *Reshaping:* Evidence emerges that the key decision to dissolve the state was not made in 1989, but was legally sealed in 1975, and 1989 was just theatre.
  *   *Why:* This moves the *climax*. If the climax moves, the genre changes. It is no longer a story of "Sudden Collapse"; it is a story of "Long Deception."

  ### 5. Summary for your Reading Group

  When you discuss this, you can frame it as follows:

  1.  **Carr was half-right:** Facts don't speak for themselves, but they also don't easily speak *against* the narrative that has invited them.
  2.  **The "Dodge" is Structural:** It isn't that historians are dodging; it's that historical narratives function as **Lakatosian Research Programmes**. They have a Hard Core (the plot/causal thesis) protected by a Belt (the specific facts).
  3.  **The Reviewer's Error:** Reviewers often attack the Belt ("you missed this fact") thinking it will damage the Core. The historian repairs the Belt, the Core remains untouched, and the reviewer feels unsatisfied because their intuitive objection was actually about the Core ("this isn't the right story"), but they lacked the vocabulary to say it, so they complained about missing facts instead.
  4.  **The Term:** Call it **Narrative Homeostasis**. It distinguishes the *resilience* of the story from the *selection* of the facts.

  **Recommended Reading to bridge the gap:**
  *   **Imre Lakatos:** *Falsification and the Methodology of Scientific Research Programmes* (Apply the Hard Core/Belt concept to history).
  *   **Louis Mink:** *Historical Understanding* (Specifically his essays on "Narrative as a Cognitive Instrument"). Mink argues that we don't find stories in events; we impose them. But he goes further than White to discuss how we *hold* them.
  *   **Quentin Skinner:** *Visions of Politics* (On the importance of context, but also on how we attribute agency).
  *   **David Hackett Fischer:** *Historians' Fallacies*. (He has a specific section on the "Fallacy of the Presumptuous Fact" which touches on this).

  You have identified that history is not a puzzle where the pieces force the picture; it is a mosaic where the picture determines which pieces are load-bearing and which are just filler. The "absorption property" is the mortar that allows you to swap out filler tiles without the image collapsing.
