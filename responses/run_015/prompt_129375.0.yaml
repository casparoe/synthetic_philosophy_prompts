prompt: |-
  In a philosophy-of-mind reading group I attend, we have spent several sessions on the persistent deadlock between Dennett's two-bitser model of distributed, derived intentionality and Searle's argument that original, biologically intrinsic aboutness is a necessary precondition for any genuine mental content. Dennett's approach treats intentionality as an emergent functional pattern—generated by layered, non-conscious feedback loops that achieve predictive tracking without any central subject that 'understands'—whereas Searle insists that syntax can never become semantics and that all derived representation ultimately borrows its aboutness from an original biological source.

  Despite extensive exchange, neither side concedes ground on empirical grounds; instead they seem to disagree about what a satisfactory explanation of mental representation must include, specifically whether citing evolutionary origin and normative causal history is essential or whether a complete structural-functional account renders such origins explanatorily irrelevant. I hypothesize that this stall is less about the ontology of intentionality itself and more about two research programs—one methodological, one metaphysical—operating under the same vocabulary, but I am unsure whether the divergence is verbal, substantive, or a hidden disagreement about standards of explanation. Could you diagnose the nature of this impasse? Please respond in American English as exactly five numbered points, each consisting of one or two sentences and with no introductory or concluding text: identify your diagnosis, explain what Dennett's camp actually says that supports it, explain what Searle's camp actually says that supports it, state whether a concealed empirical or formal distinction could resolve the dispute, and specify what would genuinely count as progress under your diagnosis.
