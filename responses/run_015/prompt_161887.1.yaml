      *   **Variant:** Ratios don't help with vacuity. Same logical structure. Phenomenological advantage only.

  10. **Final Polish:** Ensure clear headings and direct answers to the specific prompts. (e.g., "Say why the step looked fine," "Price the alternatives," "Confirm or correct.")

