answer: |-
  Dear Colleague,

  It is a bold and pedagogically sound decision to steer your students away from the standard spatial examples of Bradley's regress and instead anchor the argument in a three-party promise involving A, B, and C, for this shifts the focus from intuitive physical connecting to the logical structure of facts themselves. To ensure this session succeeds in revealing the regress as a structural metaphysical problem rather than a verbal trick, you must sequence the introduction of components with rigorous care, beginning by presenting the constituents of the situation in complete isolation. You should write A, B, and C on the board as distinct entities, perhaps describing them merely as distinct substances or agents, and then introduce the action C is to perform as a separate item of content, ensuring that no logical glue is implied between them at this stage. Only after these items are established as separate should you introduce the relation of promising, explicitly labeling it as a fourth item in the ontology alongside the three parties, and this is the precise moment where you must anticipate and defuse the first major misconception, which is the tendency for students to treat the relation as merely one more term in the list. You need to pause here and ask them whether having A, B, C, and the Promise existing side by side constitutes the fact that A promises B that C will act, guiding them to see that a mere list of existents does not equal a unified state of affairs, for a list can exist without the fact obtaining.

  Once they grasp that the relation must do more than simply exist alongside the terms, you can generate the regress by asking what binds the relation to the terms, prompting them to propose a further relation to connect the Promise to A, another to connect it to B, and so on, which reveals the infinite chain. At this juncture, you must be vigilant against the second misconception, which is the quiet substitution of Russell's solution, since your students have recently studied his theory of relations and will instinctively argue that the relation is inherently relating and requires no further connector. You must block this move by insisting that Bradley demands an explanation of how the relating is achieved, arguing that to assert the relation relates is to beg the question unless one explains the unity it provides, thereby forcing them to see that Russell's distinction between relating and non-relating relations is precisely what Bradley finds unintelligible without further justification. As you drive the regress to its conclusion, you will encounter the third misconception, where students interpret Bradley's outcome as the dogmatic claim that reality is an undifferentiated whole rather than the specific diagnosis that relational facts are logically incoherent. You should correct this by emphasizing that the regress demonstrates the impossibility of constructing unity from plurality via relations, leading Bradley to classify relations as appearance, without yet committing to the full positive doctrine of the Absolute.

  Regarding the properties of your example, it is vital that you strip the promise of all modern legal or contractual assumptions, for if students view the promise as a legal obligation enforced by a state or a social institution, they will assume the unity is provided by the law rather than metaphysics, thereby missing the point entirely. You must also avoid any implication of mental representation, ensuring that the promise is treated as an ontological fact independent of anyone thinking about it, because if the unity relies on a mind conceiving the promise, the regress shifts to the mind rather than the fact itself. The example must remain purely structural, where the only thing binding A, B, and C is the relation itself, with no external glue available. In terms of scope, you should explicitly declare at the outset or the conclusion that Bradley's broader metaphysical system, specifically his doctrine of the Absolute and his positive account of how experience is unified in feeling, is outside the scope of this session, for including it would distract from the negative dialectic of the regress argument and invite confusion about whether Bradley is offering a solution or merely dismantling a position.

  To verify that your students have grasped the specific difficulty of propositional unity rather than simply memorized the steps of the infinite regress, you should end the session with a single concluding question that asks them to explain why adding a second relation to connect the first relation to the terms fails to produce unity where the first relation failed. This question forces them to articulate that the problem lies in the category mistake of treating a unifier as another item to be unified, rather than simply reciting that the chain goes on forever. By following this sequence and guarding against these specific conceptual slippages, you will ensure that the three-party promise serves as a rigorous carrying case for Bradley's argument, allowing your students to feel the force of the problem without getting lost in the complexities of the example itself.
