answer: |-
  1. Does authorial omniscience collapse fictional branching into a single actualized timeline, thereby negating genuine contingency for characters? This must be settled first because it defines whether branching is ontologically real or merely epistemic, and while tractable via conceptual analysis, a formal proof that authorial intent necessitates linear time would demote it.

  2. How can counterfactual conditionals retain truth values in a branching model where the antecedent never occurs on the actual branch? This follows the ontological setup because we need a logic for unrealized possibilities, and it is highly tractable through modal semantics unless new temporal logic systems invalidate current branching models.

  3. Can a narrative consistently represent a determined future as experientially open to characters without logical contradiction? This is third because it relies on previous ontological and logical frameworks to test consistency, and it is moderately tractable unless a paradox proves determinism and phenomenological openness incompatible.

  4. What constitutes the trans-branch identity of a character if they make different choices in diverging futures? This is fourth because it presupposes a coherent branching structure, and it is less tractable due to vagueness in personal identity theory, though a breakthrough in counterpart theory could elevate its urgency.

  5. Does Aristotle's sea-battle problem dissolve in fiction since the text fixes the truth value of future contingents upon publication? This is last because it applies the prior metaphysical work to the specific historical problem, and it is highly tractable unless a new interpretation of Aristotle reveals a deeper modal conflict specific to narrative tense.
