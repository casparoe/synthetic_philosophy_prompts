      *   **Epistemic Principle:** To claim exemption, she needs evidence *outside* the reasoning process itself (e.g., independent verification by a distinct system, not just re-running the same cognitive software). Mere subjective confidence in the trace is circular because the error rate applies to those who also felt confident in their trace.
      *   **Address "Self-Defeating":** Denying belief isn't self-defeating; it's calibration. She can act *as if* it's correct for pragmatic purposes while maintaining credence aligned with the base rate (e.g., 10% confidence).
