answer: |-
  This is a fantastic setup for a discussion. You are right to feel the tension: *Saving Private Ryan* is emotionally resonant precisely because it muddies the waters between duty, sacrifice, and debt. If you present it as a clean example of supererogation, your sharper students will tear it apart (as you already have).

  However, that messiness is pedagogically gold. The film doesn't just *illustrate* Urmson; it dramatizes the friction points that make supererogation philosophically unstable.

  Here is a reading that validates your instincts, pushes back where the film fails philosophically, and helps you locate the actual supererogatory moments without forcing the square peg of the "mission" into the round hole of "beyond the call of duty."

  ### 1. The Mission: Role Obligation vs. Excessive Sacrifice
  **Your Worry:** The rescue is an order. Therefore, it is duty, not supererogation. Furthermore, the utilitarian calculus (8 lives for 1) makes it look impermissible, not heroic.

  **The Pushback/Refinement:** You are correct that the *mission objective* (retrieve Ryan) is deontic duty. Miller is an officer; he obeys orders. If the film ended with them finding Ryan and walking away without a fight, there would be zero supererogation.

  **Where the Supererogation Lives:** It is located in the **excess of the means over the ends.**
  *   **The Order:** "Bring him home."
  *   **The Execution:** Miller chooses to hold the bridge at Ramelle. Strategically, once they find Ryan, they could attempt to slip away or surrender. Miller chooses to engage a superior force to protect the civilians/Ryan, knowing the likelihood of death is near 100%.
  *   **The Philosophical Hook:** This aligns with Urmson's distinction. Basic duty is doing what is required to fulfill your role. Supererogation is fulfilling the role in a way that incurs a cost *far beyond* what the role demands. A firefighter has a duty to enter a burning building; they do not have a duty to enter a building that has already been condemned to collapse if no one is known to be inside. Miller staying at the bridge is the latter.

  **Teaching Point:** Ask students to distinguish between the *obligation of the objective* (get Ryan) and the *optionality of the sacrifice* (die for him). The film conflates them emotionally, but ethics requires separating them.

  ### 2. The Bequest: The "Discharge Problem" and the Corruption of Gratitude
  **Your Worry:** Miller's "Earn this" converts a gift into a debt. If Ryan spends his life discharging it, he loses moral autonomy. Does this retroactively negate the supererogatory status?

  **The Pushback/Refinement:** This is your strongest philosophical insight. You should lean into this hard. In standard ethics (e.g., Kantian or virtue ethics), supererogatory acts generate **gratitude**, not **debt**.
  *   **Gratitude** is a reactive attitude; it acknowledges the gift but leaves the recipient free.
  *   **Debt** is a transactional obligation; it binds the recipient to the benefactor.

  **The Film's Moral Mistake:** You can argue that Miller's command ("Earn this") is actually a **moral error** on Miller's part. By demanding Ryan "earn" the sacrifice, Miller undermines the very nature of the gift. A true supererogatory act says, "I give this freely, you owe me nothing." Miller says, "I give this freely, but you must pay it back."
  *   **The Discharge Problem:** You are right. If Ryan is obligated to "be a good man" to pay off Miller, then Ryan's subsequent good acts are not supererogatory; they are *duties* owed to Miller. Ryan is no longer a free moral agent; he is a debtor.
  *   **The Ending:** When Old Ryan asks, "Tell me I've been a good man," he is asking for an audit of his ledger. He doesn't feel like a free man; he feels like a borrower. The film presents this as poignant, but ethically, it's tragic. It suggests Ryan never understood that the sacrifice was a gift, not a loan.

  **Teaching Point:** Use this to discuss the **asymmetry of supererogation**. Miller's act *was* supererogatory (he wasn't obligated to die). But his *request* tried to impose an obligation on Ryan. Does a benefactor have the right to attach strings to a supererogatory act? (Most ethicists say no).

  ### 3. Motivation and Overdetermination
  **Your Worry:** Miller has role-based reasons (orders, leadership, self-respect). Does this motivational overdetermination make the act less supererogatory than if a stranger did it?

  **The Pushback/Refinement:** The literature generally distinguishes between the **deontic status of the act** (is it optional?) and the **aretaic status of the agent** (how virtuous are they?).
  *   Miller's act remains supererogatory in terms of *outcome* (death was not required by the order).
  *   However, his *motivation* complicates the "saintliness." Urmson worries about utilitarianism swallowing supererogation; here, we have "role morality" swallowing it.
  *   **The Hand Shake:** Miller's shaking hand is crucial. It shows he is acting *against* his self-preservation instinct. Supererogation often requires overcoming a strong counter-inclination. If he were a psychopath who didn't value life, his sacrifice would be worth less. The fact that he is terrified makes the choice more robustly supererogatory.

  ### 4. The Necessity of Upham (The Permissible-but-Blameworthy)
  **Your Worry:** Does the film need a character who fails to make heroism look optional?

  **The Pushback/Refinement:** Yes. Upham is the control group for supererogation.
  *   **The Prisoner Scene:** Upham argues for following the Geneva Convention (duty) vs. the squad wanting to execute the prisoner (revenge/utility).
  *   **The Bridge Scene:** Upham freezes. He hears his friends dying. He *could* intervene. He doesn't.
  *   **Why He Matters:** If Upham is merely "blameworthy" for freezing, then bravery is **obligatory**. If Upham is "understandably human" (which the film suggests), then bravery is **supererogatory**.
  *   **The Turn:** When Upham finally shoots the German prisoner at the end, is it duty or supererogation? At that point, the battle is won. He kills a surrendering soldier. It's arguably vengeance, not duty. But it closes his arc from "paralyzed by rules" to "acting decisively."
  *   **Teaching Point:** Upham demonstrates that in war (and ethics), there is a gap between what we *hope* people will do (heroism) and what we can *demand* they do (duty). Without Upham's failure, Miller's success looks like standard operating procedure.

  ### Scene Recommendations for Class

  1.  **The Bridge Defense (Not just the death):** Don't just show Miller dying. Show the moment **Miller decides to stay.**
      *   *Context:* They have Ryan. They could run. Miller says, "We hold the bridge."
      *   *Question:* Was this order necessary for the mission? Or was it an excess of duty to protect the town/Ryan further? This isolates the supererogatory slice.
  2.  **The "Earn This" Moment:**
      *   *Context:* Miller is dying. Ryan is weeping.
      *   *Question:* Is Miller creating an obligation? Is this fair to Ryan? Does this turn Ryan into a moral debtor?
  3.  **Upham Freezing vs. Upham Shooting:**
      *   *Context:* Contrast Upham hiding on the stairs while Mellish dies vs. Upham shooting Steamboat Willie at the end.
      *   *Question:* Does Upham's failure prove that heroism is optional? Does his final act redeem him, or is it just vengeance?

  ### What the Film Gets Right vs. Wrong

  **What it Gets Right (vs. Urmson/Papers):**
  *   **The Phenomenology of Moral Residue:** Papers talk about supererogation abstractly. The film shows the *cost* on the recipient (Ryan's guilt). It illustrates that supererogatory acts ripple outward and damage the moral equilibrium of the survivor.
  *   **The Rejection of Arithmetic:** The film explicitly rejects the utilitarian calculus (Reiben's argument: "Why is Ryan worth 8 of us?"). Marshall's letter at the beginning ("Dear Mrs. Ryan...") establishes that individual value trumps utilitarian math. This supports the existence of supererogation (which utilitarianism struggles to accommodate).

  **Where to Admit Defeat (It's Just a War Movie):**
  *   **The "8 for 1" Math:** Don't let students get bogged down in whether the mission was *strategically* worth it. Ethically, the premise is that *every* life is of infinite value. If you treat it as a utilitarian trade, the movie collapses. Admit that the film operates on a "sacred value" framework that doesn't map perfectly to standard normative ethics.
  *   **Miller's Authority:** Admit that Miller blurring the line between "request" and "order" with "Earn this" is dramatic license. In reality, a dying soldier cannot impose a lifelong moral obligation on a survivor. The film treats guilt as a form of piety; ethics treats guilt as a signal of wrongdoing. Ryan did nothing wrong, so his guilt is irrational, but the film treats it as noble.

  ### Summary for Your Students
  You can frame the discussion like this:
  > "We are using *Saving Private Ryan* not because it is a perfect example of supererogation, but because it shows us what happens when we try to live with it. Miller's act is supererogatory (beyond duty), but his *words* try to convert it into duty for Ryan. The tragedy of the film isn't that men died; it's that the survivor thought he had to pay a debt that was never owed."

  This allows you to use the clips while acknowledging the philosophical instability you've already identified. Your "Discharge Problem" is a genuine contribution to the discussion—don't hide it. Put it on the board.
