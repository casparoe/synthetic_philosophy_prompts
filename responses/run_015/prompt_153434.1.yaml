answer: |-
  This is a classic debate in historiography and philosophy of history. You are arguing from a **philosophical/ontological** perspective (what *is* truth/reality?), while your friend is arguing from a **methodological/epistemological** perspective (what can we *know* and *verify*?).

  Here is the adjudication, point by point, followed by an analysis of where you talked past each other.

  ### 1. Is archaeological matching sufficient?
  **Verdict: You are right.**

  *   **The Argument:** Your friend suggests that finding the physical location (e.g., Hisarlik for Troy) moves the narrative into history.
  *   **The Adjudication:** Finding the *setting* does not validate the *script*. Heinrich Schliemann found Troy, and he found layers of destruction by fire. That proves a city existed and was destroyed. It does not prove Agamemnon led the siege, that Achilles existed, or that a wooden horse was used.
  *   **The Nuance:** Archaeology provides *contextual plausibility*, not *narrative verification*. If I find a sword in a grave, I know a warrior was buried there. I do not know his name was Arthur, or that he pulled it from a stone. Archaeology can disprove a legend (e.g., if Troy was never burned), but it rarely proves the specific legendary details.

  ### 2. Is independent non-literary corroboration the right standard?
  **Verdict: Your friend is methodologically right, but you are philosophically right.**

  *   **The Argument:** Your friend wants contemporary inscriptions or administrative records (e.g., Egyptian logs mentioning Israelites). You argue this relies on survival bias.
  *   **The Adjudication:** In professional history, your friend is correct. This is the "Gold Standard." Without contemporary, non-literary evidence, a narrative remains "tradition" or "legend" in academic classification. This is why the Exodus is classified as foundational myth rather than recorded history by most historians; the Merneptah Stele mentions "Israel" as a people group in Canaan, but no Egyptian record mentions the slavery or the departure.
  *   **The Nuance:** You are correct that this standard is imperfect. It privileges literate, bureaucratic societies (like Egypt or Rome) over oral cultures. However, historians *must* use this standard to avoid validating every myth as fact. It is a firewall against fiction, even if it lets some truth slip through the cracks.

  ### 3. Does preservation bias undermine the whole project?
  **Verdict: You are identifying a real problem, but your friend is right about the necessity of conventions.**

  *   **The Argument:** You argue that making history dependent on what paperwork survived is an accident, not a boundary. Your friend says disciplines need conventions.
  *   **The Adjudication:** Preservation bias *does* mean the line between history and legend is fuzzy and partly accidental. However, your friend is right that we cannot operate without a convention. If we accept that "things might have happened even if we have no proof," then *anything* becomes history, and the word loses meaning.
  *   **The Nuance:** The boundary isn't between "Real Events" and "Fake Events." The boundary is between **Verifiable Events** and **Unverifiable Events.** Your friend is defining history as "what we can verify." You are defining history as "what actually happened." These are different definitions.

  ### 4. What's the deal with composite figures (King Arthur)?
  **Verdict: Your friend is right (it's a false dichotomy), but you are right about the museum problem.**

  *   **The Argument:** If Arthur is a composite of five different post-Roman warlords, is he historical?
  *   **The Adjudication:** This is the concept of **Euhemerism** (myth as distorted history). A composite figure is "historical" in the sense that real people inspired the story, but "legendary" in the sense that the specific individual "Arthur" likely never existed as described.
  *   **The Museum Problem:** You are right that museums need labels. A composite figure should be labeled as **"Proto-historical"** or **"Legendary Figure with Historical Parallels."** To label a composite as "Historical Person" is misleading; to label them "Fiction" ignores the cultural reality. The friend is right that reality is messy, but curators must simplify for the public.

  ---

  ### What You Are Both Missing (The "Talking Past Each Other" Moment)

  You are stuck in a loop because you are arguing about two different things without realizing it.

  **1. Ontology vs. Epistemology**
  *   **You (Ontology):** You are asking about the nature of reality. *Did these events occur in the past?* You feel that if a war happened, it is history, regardless of whether we have a receipt for it.
  *   **Your Friend (Epistemology):** They are asking about the nature of knowledge. *Can we demonstrate that these events occurred?* To a historian, if it cannot be demonstrated, it cannot be taught as history.
  *   **The Fix:** Acknowledge that **History (the academic discipline)** is not the same as **The Past (the totality of events).** The Past contains everything that happened; History contains only what we can reconstruct. A legend can be about The Past without qualifying as History.

  **2. The Function of the Narrative**
  *   You are both treating "Legend" and "History" as mutually exclusive containers. They aren't. They are **modes of truth.**
  *   **History** claims truth through *accuracy* (did the horse exist?).
  *   **Legend** claims truth through *meaning* (what does the horse say about cunning vs. strength?).
  *   **The Fix:** The transition from Legend to History isn't a switch; it's a shift in **utility.** When we stop using the story to define cultural identity and start using it to reconstruct chronology, it becomes history. When we use it to explain values, it remains legend.

  **3. The "Spectrum" vs. The "Line"**
  *   You want a bright line (for the blog/museums). Your friend says there is only a gradient (for academic rigor).
  *   **The Fix:** Both are true. For *research*, it is a gradient of probability. For *public consumption* (museums/blogs), we must draw artificial lines for clarity. Your friend is protecting academic integrity; you are protecting communicative clarity.

  ### Advice for the Blog Post

  To win the argument (or at least write the better post), propose a **Three-Tier Model** instead of a binary switch. This satisfies your need for nuance and your friend's need for rigor.

  1.  **Mythic Time:** No archaeological or textual corroboration. The story functions as identity/theology. (e.g., King Arthur as the Once and Future King).
  2.  **Proto-History:** Archaeological context exists, and the narrative *might* reflect real events, but specific details are unverifiable. (e.g., The Trojan War layer at Hisarlik; the Exodus as a cultural memory of Hyksos expulsion).
  3.  **Recorded History:** Independent, contemporary corroboration exists. (e.g., The Peloponnesian War via Thucydides and archaeology).

  **The Conclusion for your Post:**
  A legend stops being *just* a legend not when it is proven true, but when it becomes **falsifiable.** As long as a story is immune to evidence (faith), it is legend. Once we can ask "What evidence would disprove this?" and look for that evidence, we have entered the realm of history.

  **Who won the argument?**
  *   **On Method:** Your friend (Historians need evidence standards).
  *   **On Philosophy:** You (Evidence standards don't dictate reality).
  *   **On Museum Labels:** You (The public needs clear categories, even if simplified).

  Tell your friend you concede on **methodology**, but they must concede on **ontology**. That should end the circle.
