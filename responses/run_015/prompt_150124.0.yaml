      *   **The Closest Analog:** Eldercare Bot.
      *   **The Consistency Logic:** Explain the "Affect vs. Fact" and "Procedural Consent" pillars.
      *   **The Underdetermination:** Show how a Reject verdict would rely on a different interpretation (Trust as Fact).
      *   **The Hidden Principles:** Articulate the philosophical commitments of each path.

