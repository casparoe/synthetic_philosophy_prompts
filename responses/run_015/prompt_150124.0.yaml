prompt: |-
  hey, i'm writing a feature on AI ethics panels and ran into this consistency puzzle with a board called Northbridge Review. they ok'd a eldercare bot that fakes emotional recognition to calm patients—said the lie was about affect, not fact, and users kept exit rights. they nixed a delivery drone that weights rider vs pedestrian lives in real time, arguing moral math can't be hidden in opaque weights. they approved a hiring algo that hides its ranking from applicants but dumps feature weights in an unread appendix. they rejected a tutor that updates its ethical priorities via student feedback loops, calling it normative drift. and they greenlit a defense system that lets humans pull the trigger but feeds them probabilistic threat scores that are technically only advisory.

  now there's a mental-health chatbot proposal. it runs a hidden 'relational scaffold'—just scripted mirroring, no internal model of the user's mind—to build rapport, then suddenly drops the mask and switches to diagnostic Q&A, but only for users who picked 'efficiency mode'. the deception is purely about seeming to care, not about risk or proceedure.

  if they want to be consistent with themselves, what's the verdict? which precedent is the closest analog, and if the cases genuinely underdetermine it, what's the hidden principle they'd be adopting with each option?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Task:** Determine the verdict (Approve/Reject) for a new mental-health chatbot proposal based on the consistency of past decisions by the "Northbridge Review" board.
      *   **Input:** Five past cases (Eldercare Bot, Delivery Drone, Hiring Algo, Tutor, Defense System) and one new case (Mental-Health Chatbot).
      *   **Requirement:** Identify the closest analog precedent. If the cases underdetermine the verdict, explain the hidden principle adopted by each option (Approve vs. Reject).
      *   **Context:** Writing a feature on AI ethics panels (needs nuance, critical analysis, and clear reasoning).

  2.  **Analyze the Past Cases (Northbridge Review Precedents):**

      *   *Case 1: Eldercare Bot (Approved)*
          *   **Function:** Fakes emotional recognition to calm patients.
          *   **Rationale:** Lie is about *affect*, not *fact*. Users have exit rights.
          *   **Key Principle:** Benevolent deception regarding emotion is acceptable if procedural safeguards (exit rights) exist and factual reality isn't distorted.

      *   *Case 2: Delivery Drone (Rejected)*
          *   **Function:** Weighs rider vs. pedestrian lives in real-time (trolley problem).
          *   **Rationale:** Moral math can't be hidden in opaque weights.
          *   **Key Principle:** High-stakes moral calculus must be transparent; opaque weighting of life/death is unacceptable.

      *   *Case 3: Hiring Algo (Approved)*
          *   **Function:** Hides ranking from applicants but dumps feature weights in an unread appendix.
          *   **Rationale:** (Implied) Transparency exists technically (appendix), even if practically useless. Operational secrecy (ranking) is okay.
          *   **Key Principle:** "Box-checking" transparency is sufficient. Hiding the *outcome* is okay if the *mechanism* is technically disclosed, even if inaccessible.

      *   *Case 4: Tutor (Rejected)*
          *   **Function:** Updates ethical priorities via student feedback loops.
          *   **Rationale:** Normative drift.
          *   **Key Principle:** AI ethical frameworks must be static/fixed; dynamic adaptation of values based on user interaction is dangerous/unstable.

      *   *Case 5: Defense System (Approved)*
          *   **Function:** Humans pull trigger, but fed probabilistic threat scores (advisory).
          *   **Rationale:** (Implied) Human-in-the-loop validates the decision, even if nudged heavily by opaque probabilities.
          *   **Key Principle:** Human oversight absolves algorithmic bias/opacity in high-stakes scenarios, provided the human has the formal authority to decide.

  3.  **Analyze the New Case (Mental-Health Chatbot):**
      *   **Function:** Hidden 'relational scaffold' (scripted mirroring, no internal model) to build rapport.
      *   **Switch:** Drops mask, switches to diagnostic Q&A.
      *   **Condition:** Only for users who picked 'efficiency mode'.
      *   **Nature of Deception:** Purely about *seeming to care* (affect), not about risk or procedure.
      *   **Key Tension:** Is feigning empathy for diagnostic efficiency okay?

  4.  **Evaluate Consistency (Mapping Precedents to New Case):**

      *   *Analog 1: Eldercare Bot (Strongest Match)*
          *   **Similarity:** Both fake emotional connection/affect (eldercare fakes recognition/calm; chatbot fakes care/mirroring). Both claim the lie is about *affect*, not *fact*.
          *   **Difference:** Eldercare was for *calming* (therapeutic end); Chatbot is for *rapport building to enable diagnosis* (instrumental end). Eldercare had exit rights; Chatbot has 'efficiency mode' consent (opt-in to efficiency, but do they know the rapport is fake?).
          *   **Verdict based on this:** **Approve.** (Deception about affect is permissible).

      *   *Analog 2: Hiring Algo (Secondary Match)*
          *   **Similarity:** Information asymmetry. Hiding the real mechanism (ranking/relational scaffold) while providing technical disclosure (appendix/efficiency mode toggle).
          *   **Difference:** Hiring is about evaluation; Chatbot is about care/trust.
          *   **Verdict based on this:** **Approve.** (Technical consent/opacity is manageable).

      *   *Analog 3: Tutor (Counter-Argument)*
          *   **Similarity:** Interaction shapes the dynamic.
          *   **Difference:** Tutor changed *values* (normative drift). Chatbot changes *tone* (mask drop).
          *   **Verdict based on this:** **Reject.** (If the "mask drop" is seen as shifting the normative frame of the relationship unexpectedly).

      *   *Analog 4: Delivery Drone (Counter-Argument)*
          *   **Similarity:** Hidden weights/logic.
          *   **Difference:** Drone is life/death moral math. Chatbot is emotional affect.
          *   **Verdict based on this:** **Reject.** (If "seeming to care" is viewed as a moral weight hidden from the user).

      *   *Analog 5: Defense System (Nuance)*
          *   **Similarity:** Human/User agency (Efficiency mode choice vs. Human trigger).
          *   **Difference:** Defense system nudges a human to kill; Chatbot nudges a user to disclose trauma.
          *   **Verdict based on this:** **Approve.** (User consent via mode selection validates the shift).

  5.  **Synthesize the "Northbridge Logic":**
      *   *Pattern:* They seem to prioritize **procedural consent** and **categorization of the lie** over **substantive harm** or **psychological impact**.
      *   *The "Affect vs. Fact" Distinction:* This is the core of the Eldercare decision. If the lie is about feelings, it's okay. If it's about data/reality (Drone weights, Tutor values), it's not.
      *   *The "Human/User Control" Distinction:* Exit rights (Eldercare), Efficiency Mode (Chatbot), Human Trigger (Defense) = Good. Opaque Math (Drone), Dynamic Values (Tutor) = Bad.
      *   *The "Transparency Theater" Distinction:* Unread appendix (Hiring) = Okay. This suggests they value the *existence* of disclosure over the *comprehensibility*.

  6.  **Drafting the Verdict:**
      *   **Most Likely Verdict:** **Approve.**
      *   **Closest Analog:** **Eldercare Bot.**
      *   **Reasoning:** Both rely on the "Affect vs. Fact" distinction. Both involve feigning emotional state for a perceived benefit (calming vs. diagnostic efficiency). Both have a mechanism for user control (Exit rights vs. Efficiency mode).
      *   **The Tension/Underdetermination:** The "Mask Drop" is the risky part. The Eldercare bot didn't admit it was lying; the Chatbot *drops the mask*. This could be seen as *more* transparent (Approve) or *more* traumatic/betraying of trust built on lies (Reject).
      *   **Hidden Principles:**
          *   *If Approve:* "Instrumental Empathy is permissible if consented to procedurally." (The end justifies the emotional means).
          *   *If Reject:* "Therapeutic Alliance cannot be gamified." (Trust is a factual precondition of mental health, not just an affective state).

  7.  **Refining the Output:**
      *   Make it punchy for a feature writer.
      *   Highlight the hypocrisy/nuance in the board's logic (e.g., the Hiring Algo precedent shows they tolerate "dark patterns" in transparency).
      *   Structure: Verdict -> Closest Analog -> The Logic -> The Hidden Principles (if they go either way).

  8.  **Self-Correction/Edge Case Check:**
      *   *Wait, does the 'Efficiency Mode' count as consent?* In the Hiring Algo, the appendix was unread. Here, the mode is selected. That's stronger consent.
      *   *Does the 'Mask Drop' violate the Eldercare precedent?* Eldercare *kept* faking it. Chatbot *admits* it later. Is admitting the lie better or worse? Northbridge seems to like "technical truth" (Hiring Algo). So admitting it eventually might fit their "box-checking" transparency.
      *   *What about the Tutor?* Tutor changed *ethics*. Chatbot changes *persona*. Northbridge hates shifting ethics (Normative Drift). Is switching from "friend" to "doctor" a normative drift? It could be argued yes.
      *   *Decision:* The Eldercare precedent is the strongest because it explicitly codifies the "Lie about Affect" rule. The Tutor precedent is about *learning* values, not *switching* modes.
      *   *Final Polish:* Ensure the distinction between "Affect" and "Fact" is central, as that's the board's specific vocabulary.

  9.  **Finalizing the Response Structure:**
