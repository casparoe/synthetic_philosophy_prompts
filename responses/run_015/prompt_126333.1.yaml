  1.  **The Direct Calibration Rule (Jeffrey Conditioning):** When an instrument or source yields *calibrated probabilities* over a discrete partition, treat these probabilities as exogenous constraints on the partition. Propagate these constraints to continuous variables using the posterior partition weights as mixture coefficients.
      *   *Support:* Cases (i), (iii), and (v). In (v), specifically, she accepted calibrated satellite probabilities despite correlations with the continuous prior, using Jeffrey conditioning to mix the continuous coordinate distribution.
  2.  **The Mediated Reliability Rule (Bayesian Conditioning):** When evidence reliability is contingent on an unobserved bias parameter, or when the source is testimonial/noisy regarding the hypothesis partition, treat the output as likelihoods rather than constraints. Condition on intermediate observables or update via likelihood ratios.
