answer: |-
  Here are 8 interview questions designed to press on the weak points of her argument, with follow-ups tailored to the standard economist defenses she'll likely use.

  ### 1. The "So What?" on Fragility
  **Question:** The classic Bikhchandani-Hirshleifer-Welch models already admit that cascades are fragile—a tiny bit of new *public* information can shatter them. If cascades break easily anyway, what heavy lifting is your "confidence signal" actually doing? Are you just solving a problem that doesn't exist?
  **Follow-up:** *If she says public info is rare in the real world:* "But if public info is rare, is a subtle pause really strong enough to function as public info? Or does it just get swallowed by the noise of the cascade itself?"

  ### 2. The Endogeneity of Hesitation
  **Question:** You're treating hesitation as an exogenous leak of private information. But if agents know a pause reveals weakness, won't they strategically normalize their decision time? In a high-stakes environment, isn't the equilibrium for everyone to count to three before speaking?
  **Follow-up:** *If she says "It's hard to fake natural hesitation":* "Professional negotiators and poker players fake tells constantly. Why do you assume the average person in a cascade is worse at masking hesitation than a poker player is at hiding a bluff?"

  ### 3. The "Cheap Talk" Problem
  **Question:** In signaling models, a signal is only useful if it's costly to fake. A pause costs almost nothing. If I have weak evidence but want to influence the herd, what stops me from mimicking the 'confident' timing of someone with strong evidence?
  **Follow-up:** *If she argues that social reputation creates a cost:* "But in anonymous online cascades—like Twitter trends or crypto pumps—reputation costs vanish. Does your theory predict herding should be much more severe online where 'pause time' is removed?"

  ### 4. Confidence vs. Competence
  **Question:** You assume a pause tracks the *strength of evidence*. But psychologically, response time often tracks *risk tolerance* or *neuroticism*. Aren't you conflating "I have more data" with "I am a more decisive person"?
  **Follow-up:** *If she says people can distinguish the two:* "How? If I'm following you, I see a 2-second pause. How do I know if that pause means 'I'm checking my math' or 'I'm just naturally cautious'? Doesn't the observer's noise cancel out the signaler's information?"

  ### 5. The "Loud Idiot" Cascade
  **Question:** If confidence signals are noisy, doesn't your model accidentally predict that groups will herd around the most overconfident person rather than the best-informed one? The classic model says we ignore private info; your model might say we follow the best actor.
  **Follow-up:** *If she says markets punish overconfidence:* "Only in the long run. But cascades are short-run phenomena. If the overconfident guy moves first and fast, doesn't he lock in the cascade before the cautious expert even finishes their sentence?"

  ### 6. The Calibration Problem
  **Question:** For this to work, I need to know that your 'hesitant yes' equals my 'hesitant yes.' But we have different priors and different baselines. How do agents calibrate each other's confidence scales without a common language?
  **Follow-up:** *If she suggests we learn this over time:* "But cascades often happen in one-off situations—like evacuating a building or choosing a restaurant in a new city. In those zero-history moments, isn't the confidence signal just as ambiguous as the action itself?"

  ### 7. Subjective vs. Objective Evidence
  **Question:** Your mechanism seems to rely on evidence being quantifiable on a single scale. But for taste or political judgments, my 'certainty' is about identity, not data. Does your model break down when the private signal is subjective?
  **Follow-up:** *If she says it applies mostly to investment/fact-based choices:* "Then isn't your critique limited? Because the 'dumb stuff' crowds believe—conspiracies, fads, panics—is usually exactly where evidence is subjective and confidence is performative."

  ### 8. The Falsifiability Test
  **Question:** Let's talk data. If you're right, we should see weaker cascades in sequential choices (where I see your pause) versus simultaneous votes (where I don't). What specific observable pattern in that comparison would make you give up the whole theory?
  **Follow-up:** *If she gives a vague answer about "noise":* "I need a dealbreaker. If we see strong cascades in sequential settings with visible hesitation, does that kill the model? Or is the theory flexible enough to explain away any outcome?"
