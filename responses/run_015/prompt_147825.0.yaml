answer: |-
  You have independently rediscovered one of the most famous knots in the philosophy of mind, but you are right to sense that the existing vocabulary doesn't quite capture the *argumentative structure* you're seeing repeat across domains (illusions, dreams, etc.).

  Here is the carving you asked for.

  ### 1. The Canonical Names (The Domain-Specific Terms)
  The specific example you started with (the red/green dot) is the **Color Phi Phenomenon**. The specific dispute you described regarding *when* the experience happened was famously codified by Daniel Dennett in *Consciousness Explained* (1991). He gave the two sides the names you are looking for, though they are proper nouns rather than a generic category:

  *   **The Stalinesque Model:** The brain waits for all the data (red dot, then green dot), constructs the narrative (moving color-changing dot) in a "pre-conscious" editing room, and *then* projects it into consciousness. The experience is fabricated before it is seen (like a rigged show trial).
  *   **The Orwellian Model:** The brain consciously sees the red dot. Then the green dot arrives. The brain revises the memory of the first event to make sense of the second. The history books are rewritten after the fact (like Soviet history under Stalin).

  Dennett's famous conclusion is that **the distinction is illusory.** He argues that both models presuppose a **Cartesian Theater**—a specific place and time in the brain where "it all comes together" and becomes conscious. If you reject the Theater (as Dennett does with his *Multiple Drafts Model*), the question "When did the experience *really* happen?" dissolves. There is no single finish line, so there is no fact of the matter about whether the revision happened before or after crossing it.

  ### 2. The Structural Name (The Argumentative Pattern)
  You are asking for the name of the *structure* of the dispute, not just the Color Phi case. You want to know what to call it when this pattern appears in dreams or other contexts.

  There is no single established word for this exact structure, but it is a specific subspecies of **Underdetermination**.
  *   **Standard Underdetermination:** Two *theories* predict the same data. (e.g., Quantum Mechanics interpretations).
  *   **Your Pattern:** Two *ontologies of a token event* predict the same data.

  The most precise philosophical label for this is **Token-Level Phenomenal Underdetermination**.
  *   **Token-Level:** It's about *this specific experience*, not the general laws of psychology.
  *   **Phenomenal:** It's about the properties of conscious experience (qualia, timing).
  *   **Underdetermination:** The evidence fixes the physics and the reports, but not the metaphysical status of the experience.

  However, since that is a mouthful, and you asked for a term to use if nothing exists, I propose:

  **Temporal Phenomenal Indeterminacy (TPI)**

  **Definition:** A dispute regarding the temporal locus of a conscious episode where:
  1.  **Empirical Equivalence:** All third-person measurements and first-person reports are identical under both accounts.
  2.  **Ontological Divergence:** The accounts disagree on whether the episode existed at time $T_1$ or was constructed at time $T_2$.
  3.  **Epistemic Closure:** Both sides agree no future evidence could distinguish the accounts.
  4.  **Realist Stance:** Both sides insist there is a fact of the matter despite (3).

  ### 3. Why the "Heat"? (The Asymmetric Alarm)
  You noted the asymmetry: The "Later" (Stalinesque) side is calm; the "Earlier" (Orwellian) side is panicked.

  *   **The Stalinesque (Later) View:** Admits a **Processing Latency**. This is compatible with physicalism. We know neurons fire slowly. If consciousness is the *output* of processing, a delay is expected. It doesn't threaten the *reality* of the experience, just its immediacy.
  *   **The Orwellian (Earlier) View:** Admits **Introspective Fallibility**. If my memory of *one second ago* can be rewritten without me knowing, then **Privileged Access** is dead. I am not the authority on my own mind. This is existentially threatening to the traditional concept of consciousness.

  The "heat" comes from one side defending **Physiological Realism** (delay is fine) and the other defending **Phenomenal Infallibility** (I know what I just saw).

  ### 4. The "Scaling" Tell (The Individuation Problem)
  Your insight about adding flashes (Red, Green, Blue...) is the sharpest part of your analysis.
  *   **Model A (Orwellian/Sequential):** Implies $N$ flashes = $N$ conscious experiences (some later deleted).
  *   **Model B (Stalinesque/Integrated):** Implies $N$ flashes = $1$ conscious experience (constructed from $N$ inputs).

  This is the **Individuation Problem for Conscious Events**.
  If two models agree on all behavior but disagree on *how many experiences occurred*, they are not just disagreeing about *when*; they are disagreeing about **what counts as an experience**.
  *   If you believe experiences are **atomic events** (like camera shutter clicks), Model A is default.
  *   If you believe experiences are **narrative constructs** (like a story chapter), Model B is default.

  The fact that the dispute persists implies that "conscious experience" is a **folk-psychological kind** without sharp boundaries. The participants are fighting over where to draw a line in a gradient, treating the line as if it were a natural joint.

  ### 5. Boundary Cases: The Interrupted Trial
  You asked: *Is a case where the later process is interrupted inside the phenomenon or outside?*
  (Trial: Red flash. Green flash is aborted. No revision ever performed.)

  This is the **Crucial Experiment** that TPI tries to rule out, but let's test it.

  *   **Under TPI (Indeterminacy):** It remains indeterminate. Even if the green flash is aborted, the *mechanism* for revision might have started. Did the "revision process" begin before the "conscious registration" ended? We are back to square one.
  *   **Under Cartesian Materialism:** This *should* create a difference.
      *   **Stalinesque:** The brain was waiting for Green. Green never came. The "show" never started. **Result:** No conscious experience of Red (or a fragmented one).
      *   **Orwellian:** Red was seen. Revision process started. Revision process aborted. **Result:** Conscious experience of Red remains intact.

  **Why this doesn't resolve the dispute:**
  Proponents of TPI will argue that "No conscious experience" (Stalinesque) vs. "Conscious experience remains" (Orwellian) *would* be empirically distinguishable (the subject reports seeing Red vs. not seeing Red).
  Therefore, for the dispute to remain a **TPI case** (where reports are identical), you must stipulate that the subject *reports* seeing Red in both cases.
  *   If the Stalinesque subject reports Red, the brain must have constructed a "Red-only" movie after the abort signal.
  *   If the Orwellian subject reports Red, the brain simply failed to overwrite the memory.

  **Verdict:** The Interrupted Case is **Outside** the phenomenon *if* it leads to different reports. It is **Inside** the phenomenon *if* the reports remain identical (implying the brain "filled in" the missing revision in the Stalinesque case, or the revision was instantaneous in the Orwellian case). The persistence of the dispute relies on the **Epistemic Horizon**: the revision/assembly is always faster than the probe.

  ### Summary
  1.  **Specific Instance:** Orwellian vs. Stalinesque (Dennett).
  2.  **Underlying Assumption:** Cartesian Materialism (The Cartesian Theater).
  3.  **Argument Structure:** Token-Level Phenomenal Underdetermination.
  4.  **Proposed Term:** **Temporal Phenomenal Indeterminacy (TPI)**.
  5.  **The Tell:** Disagreement on the **Individuation** of conscious events (counting experiences) without disagreement on reports.
  6.  **The Boundary:** If an interruption changes the report, it's not TPI. If the report stays the same, it is TPI, and the question remains metaphysically real but epistemically closed.

  You are effectively arguing for **Anti-Realism about Phenomenal Timing**. The "heat" you observe is the friction of Realists bumping against an Anti-Realist wall.
