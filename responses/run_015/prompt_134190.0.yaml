answer: |-
  ### Session Title: Fixing Reference vs. Fixing Truth: A Two-Dimensional Approach
  **Duration:** 90 Minutes
  **Target:** Philosophy Undergraduates (Post-Frege, Post-Kripke, Pre-2DS)

  ---

  ### I. The Teaching Arc (Conceptual Order)

  The session must not begin with definitions. It must begin with a *residual tension* between the two frameworks they already know. The arc moves from **Conflict** $\rightarrow$ **Case Study** $\rightarrow$ **Differentiation** $\rightarrow$ **Synthesis**.

  **1. The Residual Tension (0–15 mins)**
  *   **Goal:** Establish why Frege and Kripke alone leave a gap.
  *   **Move:** Remind students that Frege explains cognitive significance (why $a=a$ differs from $a=b$) via *Sense*, while Kripke explains modal stability (why $a=a$ is necessary) via *Rigidity*.
  *   **The Problem:** If Kripke is right and names are rigid designators fixed by causal baptism, why does the *description* used at the baptism seem to matter for *understanding*? If I say, "Leverrier might not have caused the perturbation," I seem to be saying something coherent, even if "Leverrier" rigidly designates the planet.
  *   **The Hook:** We need a framework that validates the *epistemic contingency* of the description without sacrificing the *metaphysical rigidity* of the name.

  **2. The Carrying Example: "Leverrier" (15–35 mins)**
  *   **Goal:** Introduce the specific case that forces the distinction.
  *   **The Setup:** Do not use Venus. Use a theoretical positing.
      *   *Stipulation:* In 1846, Le Verrier hypothesizes a planet causing Uranus's orbital perturbations. He introduces the name **"Leverrier"** via the description: *"The unique planet causing these perturbations."*
      *   *The Twist:* Astronomers locate a planet at the predicted coordinates. They name it "Leverrier." However, subsequent calculation reveals the perturbations were actually due to instrumental error; the planet exists, but it is inert regarding Uranus's orbit.
  *   **Why this beats Hesperus/Phosphorus:**
      *   Hesperus/Phosphorus is an identity puzzle ($a=b$). This is a *reference-fixing* puzzle ($a$ is fixed by $F$, but $a$ is not $F$).
      *   It cleanly separates **Epistemic Access** (how we found the planet: by looking for the perturber) from **Metaphysical Rigidity** (what the name tracks: the physical object found).
      *   It forces the question: Is the sentence "Leverrier causes the perturbations" true?
          *   Epistemically (at the time of naming): It seems necessary to the identification.
          *   Metaphysically (after discovery): It is false.
          *   Standard Kripkeanism struggles to explain why the description felt semantically relevant. Standard Fregeanism struggles to explain why the name still refers to the inert planet.

  **3. Introducing the Two Dimensions as Solution (35–60 mins)**
  *   **Goal:** Present 2DS not as new entities, but as two ways of evaluating the *same* term.
  *   **Primary Intension (Epistemic):** Evaluate the term across *epistemically possible scenarios* based on how the actual world turns out to be.
      *   *Function:* Takes a scenario (described qualitatively) $\rightarrow$ Returns the extension in that scenario.
      *   *In our case:* In a scenario where the perturbations are caused by Planet A, "Leverrier" picks out Planet A. In a scenario where they are caused by Planet B, it picks out Planet B.
      *   *Role:* Captures the *cognitive significance* and the reference-fixing description.
  *   **Secondary Intension (Metaphysical):** Evaluate the term across *counterfactual worlds* holding the *actual* reference fixed.
      *   *Function:* Takes a counterfactual world $\rightarrow$ Returns the extension (the object actually named).
      *   *In our case:* We have determined that in the *actual* world, "Leverrier" refers to the inert planet (let's call it Object $O$). Now, consider a counterfactual world where Object $O$ exists but causes no perturbations. "Leverrier" still refers to Object $O$.
      *   *Role:* Captures the *modal profile* and Kripkean rigidity.
  *   **The Synthesis:** The distinction isn't multiplying meanings; it's distinguishing *context of evaluation*. Primary = "Given what we know, what fits the description?" Secondary = "Given what we've fixed, where does it go in other worlds?"

  **4. Interception of Misconceptions (60–75 mins)**
  *   **Goal:** Pre-empt specific interpretive errors at the moment they are most likely to arise.
  *   **Misconception A: "Primary Intension is a Mental Image."**
      *   *Likely Point of Failure:* When defining Primary Intension as "how we identify the referent." Students will retreat to psychology.
      *   *Interception Strategy:* Immediately after defining Primary Intension, state: *"This is not about what is in Le Verrier's head. Two astronomers could have different mental images but share the same primary intension if they agree on the public linguistic rule for fixing the reference. It is a function from scenarios to extensions, not a picture."*
  *   **Misconception B: "Two Dimensions are Temporal Stages."**
      *   *Likely Point of Failure:* When explaining the shift from the 1846 hypothesis to the modern discovery. Students will think Primary is "belief before discovery" and Secondary is "belief after."
      *   *Interception Strategy:* When transitioning to the Check Question, clarify: *"These are not stages of belief revision. They are simultaneous dimensions of meaning. Even now, the term 'Leverrier' possesses both intensions. The Primary Intension explains why the original statement was intelligible; the Secondary explains why the current statement is necessary/contingent."*

  **5. Assessment and Scope (75–90 mins)**
  *   **Goal:** Verify understanding and bound the technical complexity.
  *   **The Check Question:** (See below).
  *   **Scope Limitation:** (See below).

  ---

  ### II. The Check Question

  **Scenario:**
  Consider the term **"Leverrier"** as defined in our session (fixed by the description "the planet causing the perturbations," but actually referring to an inert planet found at the coordinates).

  Imagine a counterfactual world $W$ where:
  1.  The inert planet (the actual referent of "Leverrier") does not exist.
  2.  A *different* planet, "Planet Z," exists at the coordinates and *does* cause the perturbations.

  **Question:**
  "In world $W$, does the name 'Leverrier' refer to Planet Z?"

  **Desired Response (indicating grasp):**
  "It depends on which intension you are using.
  *   According to the **Primary Intension** (epistemic/scenario-based): **Yes.** If we treat $W$ as a candidate for the actual world, the description 'the planet causing the perturbations' is satisfied by Planet Z.
  *   According to the **Secondary Intension** (metaphysical/counterfactual-based): **No.** Since 'Leverrier' is a rigid designator of the actual inert planet, and that planet does not exist in $W$, the name either refers to nothing or fails to pick out Planet Z. The Secondary Intension remains rigid to the actual referent regardless of descriptive satisfaction in $W$."

  *Why this works:* It forces the student to acknowledge that the *same term* yields different extensions in the same world depending on the dimension of evaluation, proving they understand that rigidity (Secondary) persists even when descriptive satisfaction (Primary) shifts.

  ---

  ### III. Explicit Scope Limitations

  To ensure the session remains conceptual and fits the 90-minute window, explicitly state that the following technical apparatus is **beyond scope** and deliberately omitted:

  1.  **Centered Worlds:** Do not introduce the machinery of "centered worlds" (worlds marked with a specific individual and time) to handle indexicals or self-locating belief. Treat scenarios as qualitative descriptions of worlds.
  2.  **The Diagonal Proposition:** Do not introduce the technical notion of the "diagonal" (the set of truth values where the world considered as actual matches the world of evaluation). Explain the *insight* of the diagonal (where primary and secondary converge) without the formalism.
  3.  **Formal Intensional Logic:** Do not use lambda notation or formal semantic functions (e.g., $[[ \phi ]]^{c, w}$). Use functional descriptions ("takes a scenario, returns an object") instead.

  ---

  ### IV. Instructor's Note on the "Solution" Feel

  To ensure the framework feels like a solution rather than an ad hoc multiplication:
  *   **Do not** present Primary and Secondary Intensions as two *meanings*.
  *   **Do** present them as two *perspectives on the same meaning*.
  *   **Narrative Key:** Frame 2DS as the only way to respect *both* the Fregean intuition (that the description mattered for understanding) and the Kripkean intuition (that the description didn't matter for reference). If you present it as "Frege was right about X and Kripke was right about Y," it feels like a patch. If you present it as "Here is the single semantic structure that generates both Fregean and Kripkean results depending on the parameter of evaluation," it feels like a theoretical unification.
