prompt: |-
  I am planning a ninety-minute session for a reading group of philosophy undergraduates who have worked through Frege’s sense-reference distinction and have a passing familiarity with rigid designation, but who have not yet encountered two-dimensional semantics. Rather than explaining the framework to me, I want you to design the teaching arc: the precise order in which the conceptual pieces must be introduced so that the distinction between primary and secondary intension feels like a solution rather than an ad hoc multiplication of entities; the single carrying example that should do the work—specifically, I want to avoid Hesperus and Phosphorus, and instead use a case involving a proper name introduced through a theoretical description that later turns out false of its actual referent, such as the discovery that the object named via orbital perturbation lacks the properties originally ascribed—together with an explanation of why this case separates epistemic access from metaphysical rigidity more cleanly than the standard Venus example; the misconceptions the students are likely to form, especially the idea that primary intension is merely the speaker’s mental image or that the two dimensions represent successive temporal stages of belief revision, and the exact point in the sequence where each should be intercepted; and a single check question at the end that reveals whether they grasp that a term’s secondary intension can remain rigid across worlds even when its primary intension is descriptively satisfied differently. Please also state explicitly which technical apparatus—perhaps the formal machinery of centered worlds or the explicit quantification over epistemically possible scenarios—should be named as beyond this session’s scope and deliberately omitted.
