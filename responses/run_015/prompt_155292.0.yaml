answer: |-
  ### The Integrity Objection as System Architecture

  Consider the moral agent as a **Module** within a distributed system. The agent's **Ground Projects** constitute its core business logic and internal state, defined by the **Single-Responsibility Principle**: the Module exists to execute specific, deeply held functions that define its identity within the architecture. **Architectural Coherence** is maintained when the Module's output aligns directly with this internal logic without external interference.

  Williams's objection posits that utilitarian moral theory acts as a central Orchestrator that demands all Modules expose their internal state via a public **Interface** for global **optimisation**. This requirement forces the Module to adopt a detached, calculative stance, querying a global utility service before executing any local function. This process introduces **State Contamination**, where the Module's local context is overwritten by global metrics, severing the link between its internal configuration and its actions.

  In the spouse-and-stranger scenario, the direct rescue operation is the expected execution flow. The moral demand to calculate utility acts as an unnecessary **Exception-Handling Policy**. It inserts a **Circuit-Breaker** logic that trips on direct commitment, forcing a redirect to the global calculator. This is the "one thought too many": a redundant abstraction layer that interrupts the direct call stack between the agent's commitment and the action. Williams argues that enforcing this architecture violates the Module's integrity, not because the output is incorrect, but because the internal routing has been compromised by an external contract that treats the Module's core logic as merely another variable in a global equation.

  ### Translation Analysis

  | Concept | Translates Cleanly | Must Be Distorted | Has No Expression |
  | :--- | :--- | :--- | :--- |
  | **Modules / Interfaces** | The boundary between the agent and the world maps well to component encapsulation. The idea of a contract (interface) dictating behaviour is structurally identical to moral demands. | Modules are passive; agents are active. A module does not "own" its code; an agent owns their actions. | The *authority* of the interface. In code, the interface is authoritative by design. In ethics, the authority of moral demands is precisely what is contested. |
  | **Single-Responsibility Principle** | The notion that a component should have one reason to change mirrors the idea of ground projects giving life structure. | SRP is about maintainability and coupling. Integrity is about identity and meaning. Reducing integrity to "focus" distorts its moral weight. | The *content* of the responsibility. In software, responsibilities are arbitrary assignments. In Williams, ground projects are constitutive of the self. |
  | **State Contamination** | The intrusion of global context into local scope is a precise technical analogue for alienation. | In engineering, contamination is a bug. For Williams, the moral demand is a feature of the theory, not an implementation error. | The *experience* of contamination. Code does not suffer alienation; it simply executes or fails. |
  | **Architectural Coherence** | The alignment of internal logic with external behaviour maps to integrity as consistency. | Coherence in systems is about stability and predictability. Integrity is about faithfulness to personal commitments, even if unstable. | The *value* of coherence. Why coherence matters morally is not explained by system stability. |
  | **Exception-Handling / Circuit-Breaker** | The "one thought too many" functions exactly like a redundant check or a trip-switch that halts direct execution. | Exception handling is usually for error states. Here, the "exception" is the normal human response (saving a spouse), treated as an error by the moral system. | The *cost* of the interruption. In code, latency is the cost. In life, the cost is the degradation of the relationship itself. |

  ### Residue Report

  The untranslatable residue lies in the distinction between *functional execution* and *constitutive identity*. In software design, a Module's logic is arbitrary; it can be refactored, swapped, or deprecated without the system losing its "selfhood", because the system has no self. The engineering metaphor treats integrity as a protectionist policy for encapsulation—a preference for local state over global coupling. If we stop here, the metaphor exposes that Williams's notion of integrity relies on commitments that are underspecified: it treats the "self" as a black box that refuses external inspection simply because it is local. From an architectural viewpoint, refusing global optimisation for the sake of local state looks like inefficiency or technical debt.

  However, this reveals a genuine limitation of the engineering metaphor rather than a fatal flaw in Williams. The metaphor cannot capture *normativity*. In system design, the goal (utility) is external to the modules, defined by the user. In Williams's view, the goals (ground projects) are internal to the agent and partly define what the agent *is*. The engineering model assumes the system's purpose is distinct from its components, whereas Williams argues the agent's purpose is inseparable from their projects.

  Therefore, the residue indicates that the engineering metaphor helps clarify the *structure* of Williams's claim (encapsulation vs. global access) but fails to capture the *stakes*. It shows that Williams relies on a notion of the self as a primitive type that cannot be decomposed into utility functions. While the engineering lens rightly flags this as opaque, it cannot demonstrate that this opacity is unjustified, because code lacks the capacity for meaning. The metaphor ultimately proves that integrity looks like encapsulation, but it cannot explain why violating encapsulation in a human being is a moral injury rather than merely a design choice.
