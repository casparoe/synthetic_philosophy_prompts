  1.  **Analyze the User's Problem:**
      *   **The Game:** Toss a fair coin until Heads ($H$). If $H$ appears on toss $n$, payoff is $X_n = (-1)^{n+1} \frac{2^n}{n}$.
      *   **Probability:** $P(n) = (1/2)^n$.
      *   **Expected Value Calculation:** $E[X] = \sum_{n=1}^{\infty} P(n) X_n = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n} = 1 - 1/2 + 1/3 - 1/4 + \dots = \ln(2)$.
      *   **The Conflict:** The series is *conditionally convergent*. By the Riemann Rearrangement Theorem, the sum depends on the order of terms. Standard measure theory says the expectation is *undefined* because the integral of the positive part and the integral of the negative part are both infinite ($\sum |X_n| P(n) = \sum 1/n = \infty$).
      *   **User's Argument:**
          1.  Game ends w.p. 1 (finite $n$).
          2.  Value should be limit of finite truncations (continuity).
          3.  Natural truncation (by $n=1, 2, 3\dots$) gives $\ln(2)$.
