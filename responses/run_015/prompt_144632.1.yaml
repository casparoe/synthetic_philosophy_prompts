      *   **Friend's Argument:** Law of Large Numbers (LLN) implies average payout settles near $\ln(2)$. (User doubts this).

  2.  **Evaluate the Mathematical Status:**
      *   **Expectation Definition:** In rigorous probability theory (Kolmogorov), $E[X]$ is defined as $\int X dP$. This is well-defined *only if* $E[|X|] < \infty$ (absolute convergence). If $E[|X|] = \infty$, the expectation is undefined.
      *   **Why?** Because the Lebesgue integral is defined via simple functions, effectively requiring absolute integrability to ensure linearity and order independence. If $\sum x_i^+ p_i = \infty$ and $\sum x_i^- p_i = \infty$, you get $\infty - \infty$, which is indeterminate.
      *   **The User's Step (2):** "Value ought to be continuous along an approximation that converges to the thing itself with probability 1." This is the Dominated Convergence Theorem (DCT) or Monotone Convergence Theorem (MCT) intuition. However, DCT requires a dominating integrable function (bounded expectation), and MCT requires monotonicity. Neither applies here because the payoffs grow too fast relative to probabilities (harmonic series divergence).
