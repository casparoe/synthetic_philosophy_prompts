prompt: |-
  I'm TAing for a probability-and-induction course and I keep getting into the same stupid fight with the students about Bertrand's chord thing. You know the one: take a chord of a circle "at random" and ask the chance it's longer than the side of the inscribed equilateral triangle -- pick two endpoints on the circumference and you get 1/3, pick a radius and then a point along it and you get 1/2, pick a point in the disc as the midpoint and you get 1/4. Everyone can recite the three recipes, nobody can say what the lesson is supposed to be. I've got a suspician that the useful move isn't to crown a favourite recipe but to sit down and write out what any principle of indifference would have to do to deserve the name -- so that's what I want from you: the desiderata. What does a rule that says spread your credence evenly over possibilities you have no reason to distinguish have to deliver before it counts as adequate? Give me the list with the consideration behind each item, not a list of adjectives -- the cases it has to get right, the distinctions it can't collapse, the results it has to stay consistent with, the temptations it has to resist. And I want to be able to test a candidate against concrete cases, so here are the ones I care about: (1) the chord, above; (2) a machine cuts a one-metre stick at a random point and I want the chance the longer piece is at least twice the shorter -- does "random" mean uniform in the cut point, or uniform in the ratio of the two pieces?; (3) a factory turns out cubes whose edge length is known only to lie between 1 and 2 cm, so the edge, the face area and the volume are each equally unknown in a fixed interval -- over which do I spread credence?; (4) a bent coin I know nothing about: even over the bias p, or even over the log-odds?; (5) a point picked "at random" on a sphere, and then the question of what conditioning on it landing on one particular great circle even means, that being an event of probability zero; (6) a case where the number of possibilities is itself unknown -- an urn where I don't know how many colours or how many marbles I'm ignorant about.

  Then the part I actually want. Say which of these requirements are genuine desiderata and which are just a camp's prejudice -- I've noticed the invariance people and the "indifference is a con" people seem to want opposite things and both act like it's obvious -- and, most important, flag any pair or subset of the desiderata I can't have together, because my hunch is that the list is where the real result lives: something like always-unique-answer and never-privileges-a-parameterization can't both be satisfied, which would make Bertrand's paradox not a puzzle about chords but a proof that we've been asking the principle for too much. If one requirement does the most damage to the popular proposals, name it and say why. I've been calling my pet version of the requirement description-invariance -- indifference is only licensed when the symmetry you lean on is a symmetry of the situation itself and not of the way we happen to have written it down -- so tell me what that rule buys, what it costs, and whether it's even formulable without circularity.

  Finally, since I have to say something in class: two or three lines each on how the maximum-entropy/group-invariance approach, the "just use a reference prior that works in practice" approach, and the flat refusal to have any such principle at all do against the list. No history, no names and dates, no reading list -- I don't want a bibliography, I want the criteria and the tension between them. And be honest about which desiderata are only requirements if you've already decided the principle is meant to ground real statistical inference rather than serve as a teaching heuristic; that changes the list and I want to see exactly where.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A Teaching Assistant (TA) for a probability-and-induction course.
      *   **Problem:** Students are stuck on Bertrand's Paradox (chord problem) and miss the point. The TA suspects the issue isn't picking a "winner" but defining what a Principle of Indifference (PoI) *ought* to do.
      *   **Task:**
          1.  List desiderata for a valid PoI (with considerations, not just adjectives).
          2.  Test these desiderata against 6 specific cases (Chord, Stick, Cube, Coin, Sphere/Conditioning, Unknown Urn).
          3.  Distinguish genuine desiderata from camp prejudices.
          4.  Identify incompatibilities (impossibility results).
          5.  Evaluate the TA's pet rule ("description-invariance").
          6.  Evaluate three approaches (MaxEnt/Group-Invariance, Reference Priors, Refusal) against the list.
          7.  Distinguish between desiderata for *inference* vs. *heuristic/teaching*.
      *   **Constraints:** No history, no names/dates, no bibliography. Be honest about tensions. Keep it rigorous but accessible for a TA preparing a lecture.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   Bertrand's Paradox shows that "uniformity" is parameterization-dependent. $X \sim U[0,1] \implies Y=X^2$ is not uniform.
      *   The Principle of Indifference (PoI) says: If you have no reason to prefer $A$ over $B$, assign $P(A) = P(B)$.
      *   The conflict: "No reason to prefer" is ambiguous without a specified sample space and measure.
      *   The TA's hunch is correct: The paradox arises because we demand mutually exclusive properties from the principle.

  3.  **Drafting the Desiderata (The "List"):**
      *   Need to cover the cases provided.
      *   *Desideratum 1: Parameterization Invariance.* (The big one). If I describe the problem in terms of length, area, or volume, the physical probability shouldn't change.
      *   *Desideratum 2: Existence/Uniqueness.* The principle should actually give an answer, and preferably only one.
      *   *Desideratum 3: Coherence/Consistency.* If I update on new info, I shouldn't contradict my prior. (Related to conditionalization).
      *   *Desideratum 4: Empirical Calibration (optional but requested).* If this is for inference, it should match frequencies in the long run (or at least not be easily Dutch-booked).
      *   *Desideratum 5: Symmetry Respect.* If the physical setup has a symmetry (rotation), the probability should reflect it.
      *   *Desideratum 6: Domain Sensitivity.* It shouldn't assign probabilities to ill-posed questions (like conditioning on measure zero events without a limit process).

  4.  **Testing Against Cases:**
      *   (1) Chord: Fails Parameterization Invariance if we just say "uniform."
      *   (2) Stick: Length vs. Ratio. Same as Chord.
      *   (3) Cube: Edge vs. Area vs. Volume. Jacobian issue.
      *   (4) Coin: $p$ vs. $\log(p/(1-p))$.
      *   (5) Sphere: Borel-Kolmogorov paradox (conditioning on great circle).
      *   (6) Urn: Unknown $N$. Improper priors or logical ambiguity.

  5.  **Identifying Incompatibilities (The "Impossibility Theorem"):**
      *   *The Big Conflict:* **Parameterization Invariance** vs. **Existence/Uniqueness on Ignorance**.
      *   If you demand the distribution be invariant under *all* smooth reparameterizations, you often get an improper prior (cannot normalize) or no solution.
      *   If you demand a unique proper probability distribution for *any* statement of ignorance, you must privilege a parameterization.
      *   *Conclusion:* You cannot have a principle that yields a unique, proper probability distribution for every state of "complete ignorance" while remaining invariant under reparameterization.

  6.  **Evaluating the TA's "Description-Invariance":**
      *   *What it buys:* Solves Bertrand by forcing the user to specify the *physical* generation mechanism (the symmetry of the *situation*, not the *math*).
      *   *What it costs:* It stops being a logical principle of "ignorance" and becomes a physical principle of "symmetry." It requires more input than just "I don't know."
      *   *Circularity:* Risky. Defining "situation" vs. "description" can be tricky. But generally, it shifts the burden from logic to physics.

  7.  **Evaluating the Three Approaches:**
      *   *MaxEnt/Group-Invariance:* Good at respecting symmetries (Chord). Fails on "total ignorance" (Cube/Coin) without specific constraints. Requires knowing *what* is constrained.
      *   *Reference Priors (Pragmatic):* "Use what works." Good for inference (asymptotic properties). Bad for foundational logic (ad hoc).
      *   *Refusal (Subjective/Frequentist):* "No such thing as objective prior." Solves the paradox by denying the premise. Hard to teach as "logic."

  8.  **Distinguishing Inference vs. Heuristic:**
      *   If teaching logic/epistemology: Uniqueness and Invariance are key.
      *   If teaching statistics: Calibration and Coherence matter more.
      *   The "Impossibility" matters less for heuristics (just pick one) but kills the foundational claim.

  9.  **Refining the Tone:**
      *   The user is a TA, likely grad student. Tone should be peer-to-peer, rigorous, slightly cynical about the "paradox" but constructive.
      *   Avoid name-dropping (Jaynes, Keynes, Kolmogorov, etc.).
      *   Focus on the *structure* of the argument.

  10. **Drafting the Content (Iterative refinement):**
      *   *Desiderata:* Make sure they are actionable.
      *   *Incompatibility:* Be explicit. "You can't have your cake and eat it too."
      *   *TA's Rule:* Validate it. It's essentially Jaynes' view without the name.
      *   *Classroom Advice:* Keep it punchy.

      *(Self-Correction during drafting)*: I need to make sure I address the "Sphere/Conditioning" case specifically regarding the Borel-Kolmogorov issue, as that's distinct from simple reparameterization. It's about limiting procedures.
      *(Self-Correction on Cube)*: Ensure I highlight that Edge/Area/Volume cannot *all* be uniform simultaneously.
      *(Self-Correction on Urn)*: This is about the "unknown unknowns." Standard PoI fails hard here.

  11. **Final Polish:** Check against constraints. No names. No history. Clear sections.

      *Structure:*
      1. The Desiderata List (with rationale).
      2. The Incompatibility (The "No-Go" Result).
      3. Evaluation of "Description-Invariance."
      4. The Three Approaches (Briefly).
      5. Inference vs. Heuristic distinction.

      *Let's write.*
answer: |-
  Here is the breakdown you need to cut through the noise in your section.

  ### Part 1: The Desiderata for a Principle of Indifference

  To count as adequate, a rule for assigning credence under ignorance must satisfy the following. Note that these are often in tension.

  1.  **Parameterization Invariance:** If two mathematical formulations describe the *same physical state of affairs*, the assigned probability must be identical.
      *   *Consideration:* Probabilities represent the world, not our coordinate system. If I describe a cube by edge length $L$ or volume $V=L^3$, the physical uncertainty about the cube shouldn't change the probability of it fitting in a box.
      *   *Test Case:* The Cube (Case 3). Uniform on $L$ implies non-uniform on $V$. A valid principle must pick one based on physics, not math, or admit it cannot answer.

  2.  **Existence and Uniqueness:** For any well-posed problem statement, the principle must yield exactly one probability distribution.
      *   *Consideration:* If the principle yields multiple answers (like Bertrand's), it fails as a logical guide. If it yields no answer (improper integrals), it fails as a decision guide.
      *   *Test Case:* The Chord (Case 1). The standard PoI yields three answers. A robust principle must eliminate two or explain why the question is ill-posed.

  3.  **Symmetry Respect:** If the physical setup possesses a symmetry (rotation, translation, scaling), the probability assignment must preserve that symmetry.
      *   *Consideration:* Ignorance should not break symmetries that exist in the evidence. If I have no reason to think "North" is different from "South," $P(\text{North}) = P(\text{South})$.
      *   *Test Case:* The Sphere (Case 5). A point picked "at random" should be rotationally invariant.

  4.  **Coherence under Conditioning:** The principle must define how to update when new information arrives, specifically regarding events of measure zero.
      *   *Consideration:* You cannot condition on "exactly $X=x$" in a continuous space without specifying a limiting process (a sequence of shrinking neighborhoods). Different limits yield different results.
      *   *Test Case:* The Sphere/Great Circle (Case 5). Conditioning on a great circle is ambiguous without specifying *how* you approached that circle (latitude vs. longitude slices).

  5.  **Scale Consistency:** The assignment should not arbitrarily privilege a specific scale or unit of measurement unless the problem specifies one.
      *   *Consideration:* Nature doesn't care if we measure in meters or inches.
      *   *Test Case:* The Stick (Case 2). Cutting "at random" implies a scale. Is the randomness in the linear distance or the ratio?

  6.  **Domain Closure:** The principle must handle cases where the hypothesis space itself is vague or unknown.
      *   *Consideration:* Ignorance often extends to the number of possibilities, not just their likelihood.
      *   *Test Case:* The Urn (Case 6). If I don't know the number of colors, I can't distribute weight evenly over them.

  ---

  ### Part 2: The Incompatibility (The "No-Go" Result)

  You suspected the list is where the real result lives. You are right. **You cannot satisfy Desiderata 1 (Invariance) and 2 (Uniqueness/Existence) simultaneously for all cases of "complete ignorance."**

  This is not a bug; it is a theorem.
  *   **The Conflict:** If you demand **Parameterization Invariance** for *any* smooth transformation of variables, you are forced into improper priors (distributions that cannot sum to 1, like $P(x) \propto 1/x$ over an infinite range) or contradictions. If you demand a **Unique, Proper Probability Distribution** for every statement of ignorance, you *must* privilege a specific parameterization.
  *   **The Verdict:** Bertrand's Paradox is not a puzzle about chords. It is a proof that "complete ignorance" is not a well-defined state in continuous spaces without additional structural constraints.
  *   **The Damaging Desideratum:** **Uniqueness on Ignorance.** This is the one that kills the popular proposals. Students want the Principle of Indifference to be a logic machine: input "I know nothing," output "The Answer." The math says: input "I know nothing," output "Error: Insufficient Structure."

  **Camp Prejudices vs. Genuine Desiderata:**
  *   **Genuine:** Coherence under Conditioning (Case 5) and Symmetry Respect (Case 3). If you violate these, you are mathematically inconsistent or physically wrong.
  *   **Prejudice:** Uniqueness on Ignorance. The "Invariance People" (often objective Bayesians) sacrifice Uniqueness (allowing improper priors) to keep Invariance. The "Indifference is a Con People" (subjective Bayesians/Frequentists) sacrifice Invariance (admitting priors are subjective choices) to keep Uniqueness. Neither is logically "wrong," but they are solving different problems.

  ---

  ### Part 3: Your Pet Rule ("Description-Invariance")

  *Rule: Indifference is only licensed when the symmetry you lean on is a symmetry of the situation itself and not of the way we happen to have written it down.*

  *   **What it buys:** It dissolves Bertrand's Paradox immediately. It forces the student to ask: "How is the chord *generated*?"
      *   If generated by two random points on the rim $\rightarrow$ 1/3.
      *   If generated by a random radius and point along it $\rightarrow$ 1/2.
      *   If generated by a random midpoint in the disk $\rightarrow$ 1/4.
      *   It shifts the burden from *logic* to *physics*. There is no "random chord" in the abstract; there are only random *processes* that produce chords.
  *   **What it costs:** It ceases to be a Principle of *Indifference*. It becomes a Principle of *Symmetry*. It requires more information than "I am ignorant." It requires "I know the mechanism is rotationally invariant." It cannot solve the Cube problem (Case 3) unless the factory mechanism is specified (e.g., does the machine control edge length or volume?).
  *   **Circularity Risk:** Low, provided you define "situation" operationally. The risk lies in students claiming the "situation" is the mathematical variable they prefer. You must enforce that "situation" means "physical generation process."

  ---

  ### Part 4: Evaluating the Three Approaches

  Here is how to pitch the alternatives in class, measured against the Desiderata.

  **1. Maximum-Entropy / Group-Invariance Approach**
  *   **Pitch:** "We pick the distribution that assumes the least while respecting the known symmetries."
  *   **Performance:** Aces Symmetry Respect (Desideratum 3) and Parameterization Invariance (Desideratum 1) *if* the symmetry group is well-defined.
  *   **Failure:** Fails Existence/Uniqueness (Desideratum 2) when the symmetry group is ambiguous (The Cube). It cannot tell you if the factory controls edge or volume without extra data.
  *   **Best for:** Physics problems where symmetries are objective (The Chord, The Sphere).

  **2. The "Reference Prior" (Pragmatic) Approach**
  *   **Pitch:** "We pick the distribution that makes the data speak the loudest or minimizes worst-case error."
  *   **Performance:** Aces Coherence (Desideratum 4) and Domain Closure (Desideratum 6) in practice. It works for inference.
  *   **Failure:** Fails Parameterization Invariance (Desideratum 1). Reference priors often change if you reparameterize, though they aim for asymptotic invariance. It admits it is a tool, not a truth.
  *   **Best for:** Statistics where you need an answer to run a regression (The Coin, The Stick).

  **3. The Flat Refusal (Subjective/Frequentist) Approach**
  *   **Pitch:** "There is no probability for a single event without a frequency or a bet. Ignorance is not a distribution."
  *   **Performance:** Aces Logical Consistency. Avoids all paradoxes by denying the premise.
  *   **Failure:** Fails Usefulness. It leaves the student with no number for the Chord problem. It violates the student's intuition that "I should be able to say *something*."
  *   **Best for:** Foundations courses where avoiding error is more important than making predictions.

  ---

  ### Part 5: Inference vs. Heuristic (The Classroom Pivot)

  This is the most important distinction for your students.

  **If the goal is Statistical Inference:**
  *   **Requirements:** Coherence, Calibration, Asymptotic Performance.
  *   **Verdict:** Parameterization Invariance is *not* a hard requirement. It is nice, but if a prior works well for estimation, we use it. The "Reference Prior" approach wins here. The paradox doesn't matter because the data will eventually overwhelm the prior.

  **If the goal is Epistemology / Teaching Heuristic:**
  *   **Requirements:** Uniqueness, Logical Consistency, Parameterization Invariance.
  *   **Verdict:** You cannot satisfy them all. You must teach the **Description-Invariance** rule.
  *   **The Lesson:** "Probability is not a property of your ignorance; it is a property of the model you build." Bertrand's Paradox teaches that *randomness is a verb, not an adjective.* Things are not "random"; they are "randomized" by a specific process.

  **Final advice for the section:**
  Tell them the Principle of Indifference is not a law of logic, but a modeling assumption. When they ask "Which answer is right?", the answer is "Which process did you model?" If they cannot specify the process, they are not doing probability; they are doing word games. That resolves the fight without needing to crown a winner.
