answer: |-
  This is a precise dissection of a common heuristic. The phrase "better the devil you know" is not a single logical claim; it is a container for at least five distinct arguments about decision-making under uncertainty.

  Here is the menu of readings. For each, I have defined the claim, run your two test cases (Coin and Mirrors), and evaluated its validity and applicability to your electricity tariff.

  ### 1. The "Fat Tail" Reading (Risk of Ruin)
  **The Claim:** The known option has a capped downside (you know the worst case). The unknown option has an uncapped or poorly defined downside. Even if the *average* outcome of the unknown is better, the *worst-case* outcome is unacceptable.
  **"You Know":** You know the maximum loss of the status quo. You do not know the maximum loss of the new option.
  **Algorithm vs. Weather:** Matters little. If the algorithm could theoretically spike to 100p due to a glitch or market crash, that is a "devil" you don't know.
  **Test Case 1 (Coin):** **Fails.** A fair coin has a known binary outcome (Win/Loss). There is no "fat tail." This reading would treat the coin as safe, not a devil.
  **Test Case 2 (Mirrors):** **Fails.** If the two mirror options cancel out, the "fat tail" is hedged away. This reading would encourage taking both, contradicting the slogan's impulse to avoid the unknown individually.
  **Evaluation:**
  *   **Status:** Real point, but often false in consumer contexts.
  *   **Applies to Electricity?** Weakly. Energy prices are regulated; a "ruin" scenario (e.g., £50,000 bill) is unlikely.
  *   **Justifies Staying Put?** Only if you believe the variable tariff has a hidden catastrophic cap.

  ### 2. The "Regret & Responsibility" Reading (Accountability)
  **The Claim:** The cost of a bad outcome is psychological, not just financial. If the known devil bites you, it is bad luck (external). If the unknown devil bites you, it is your fault (internal) because you chose to switch. This reading is about minimizing future regret, not maximizing value.
  **"You Know":** "You" refers to your future self assigning blame. "Know" refers to the causal link between your action and the outcome.
  **Algorithm vs. Weather:** Matters. If it's weather, it's an act of God (less regret). If it's a company algorithm, it feels like a choice you made that the company exploited (more regret).
  **Test Case 1 (Coin):** **Passes.** Even with a fair coin, if you bet and lose, you might think "I shouldn't have gambled." If you don't bet and miss out, it's just "what happened."
  **Test Case 2 (Mirrors):** **Passes.** You would still hesitate to take either individually because taking *one* exposes you to blame if that specific one fails, even if the *pair* would have been safe. The slogan warns against the *act of choosing*, not the net result.
  **Evaluation:**
  *   **Status:** Psychologically true, economically irrelevant.
  *   **Applies to Electricity?** Yes. This matches your BIL's comment: "if it goes wrong its on you."
  *   **Justifies Staying Put?** Yes, if your goal is to sleep well at night rather than save money.

  ### 3. The "Lemon Market" Reading (Information Asymmetry)
  **The Claim:** The uncertainty is not natural; it is manufactured by a counterparty who knows more than you. If the energy company knows the odds are in your favor, they would advertise them. The fact that they are vague ("12p to 31p") implies the distribution is skewed against you. The "devil you know" is honest about its costs; the "devil you don't" is hiding theirs.
  **"You Know":** "You" refers to the consumer vs. the provider. "Know" refers to private information held by the company.
  **Algorithm vs. Weather:** Crucial. Weather is neutral. An algorithm is strategic. If the company set the tariff, the vagueness is a signal of adverse selection.
  **Test Case 1 (Coin):** **Fails.** A coin under a cup with "nobody looked" implies symmetric ignorance. This reading only applies if the *person offering the bet* knows the result and you don't.
  **Test Case 2 (Mirrors):** **Passes.** If a counterparty offers you Option A (unknown) or Option B (unknown), and they know the outcomes, taking both might still lose you money overall (the house edge). The slogan warns against entering the game.
  **Evaluation:**
  *   **Status:** Real point in commercial contexts.
  *   **Applies to Electricity?** Strongly. Energy companies are profit-maximizers. Why would they offer a tariff that loses them money on average?
  *   **Justifies Staying Put?** Yes, if you assume the "12p-31p" range is marketing spin and the real average is closer to 31p.

  ### 4. The "Planning Cost" Reading (Utility of Stability)
  **The Claim:** Money has utility beyond its face value; it buys predictability. A variable rate imposes a cognitive tax (budgeting difficulty, anxiety). Therefore, the variable rate must be *significantly* cheaper to compensate for the loss of planning ability. The "devil" is the stress, not just the price.
  **"You Know":** "You" refers to your household administration. "Know" refers to the ability to forecast cash flow.
  **Algorithm vs. Weather:** Matters. Weather is hard to plan for. An algorithm is opaque. Both increase the "planning cost."
  **Test Case 1 (Coin):** **Fails.** A single coin flip doesn't disrupt long-term budgeting. This reading applies to recurring uncertainties (like monthly bills), not one-off bets.
  **Test Case 2 (Mirrors):** **Fails.** If you take both mirrors, the outcome is fixed (known). This reading would encourage taking both to restore planning ability.
  **Evaluation:**
  *   **Status:** Real point, highly applicable to household finance.
  *   **Applies to Electricity?** Yes. Your BIL explicitly said: "you can't budget, you can't plan."
  *   **Justifies Staying Put?** Yes, if the expected savings (middle of range) are less than the value you place on certainty.

  ### 5. The "Ambiguity Aversion" Reading (Ellsberg Paradox)
  **The Claim:** Humans (and rational agents under certain models) dislike *ambiguity* (unknown probabilities) more than *risk* (known probabilities). Even if the expected value is identical, the option with the undefined probability distribution is discounted. The "devil" is the lack of a probability density function.
  **"You Know":** "You" refers to the decision maker's mathematical model. "Know" refers to having a defined probability (e.g., 50% red ball) vs. an undefined proportion (e.g., some % red ball).
  **Algorithm vs. Weather:** Matters. Weather implies a stochastic process (Risk). A company refusing to give odds implies Ambiguity.
  **Test Case 1 (Coin):** **Fails.** This is the definition of Risk (50/50), not Ambiguity. This reading says the coin is *not* a devil.
  **Test Case 2 (Mirrors):** **Fails.** In the Ellsberg setup, people prefer the known jar for *both* colors, which is logically inconsistent (if Red Jar is better, Black Jar should be worse). This reading admits the behavior is a bias, not a truth.
  **Evaluation:**
  *   **Status:** Describes a human bias, not a logical truth. (This is what your sister posted).
  *   **Applies to Electricity?** Yes, this is the structural uncertainty of the tariff.
  *   **Justifies Staying Put?** No. Economists classify this as an error to be corrected, not a rule to be followed.

  ---

  ### Diagnosis: Which reading is your Brother-in-Law using?

  He is likely mixing **Reading 2 (Regret)** and **Reading 4 (Planning Cost)**, with a splash of **Reading 3 (Lemon Market)**.

  1.  **He rejected the Jar/psychology argument (Reading 5).** This tells us he doesn't think he's being irrational; he thinks he's being prudent.
  2.  **He explicitly cited budgeting (Reading 4).** "You can't plan."
  3.  **He explicitly cited blame (Reading 2).** "If it goes wrong its on you."
  4.  **He implicitly trusts the status quo over the company's vagueness (Reading 3).**

  **Does his reading survive?**

  *   **Reading 4 (Planning Cost)** survives and is valid. If the stress of a variable bill costs you more in utility than the 2-3p saving per unit, staying fixed is rational. However, this is a personal preference, not an objective fact about the tariff.
  *   **Reading 2 (Regret)** survives psychologically but is logically fragile. It prioritizes "not being wrong" over "doing well." It justifies staying put only if you value peace of mind over wealth.
  *   **Reading 3 (Lemon Market)** is the strongest objective argument. If the energy company won't publish the average expected rate, they are likely hiding that the average is higher than your fixed rate.

  **The Verdict on the Slogan:**
  In your specific electricity case, the slogan is **not a truism**, but it is **not false**. It is a **heuristic for asymmetric information and cognitive load.**

  It fails the **Coin Test** (because a coin is symmetric risk, not asymmetric ambiguity).
  It fails the **Mirror Test** (because combining unknowns can create a known, which the slogan discourages).

  This suggests your BIL is using the slogan to protect against **Accountability** and **Asymmetry**, not purely mathematical expectation. He is arguing that the *cost of being the one who changed things* is higher than the *potential savings of the change*. Whether that is true depends on how much you value not having to explain a high bill to your family next winter.
