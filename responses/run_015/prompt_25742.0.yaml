prompt: |-
  I serve on my university's Faculty Senate Committee on Academic Standards. Six months ago we reviewed a tenure case that has since become a quiet crisis for the committee. The candidate's file met every quantitative benchmark we use — publications in high-impact-factor journals, citation counts above the department median, an h-index comfortably on target — but the external reviewers, reading the actual work, described it as methodologically competent yet substantively hollow: a single finding recombined across many papers, each sliced to the minimum publishable length, citing and cited by the same small network of collaborators. The committee felt we had no choice but to recommend tenure, because our own policies had made the metrics the standard and given us no clear warrant to override them. Several of us left that meeting ashamed.

  The provost has now asked us to produce a formal recommendation on whether and how the university should revise its use of bibliometric indicators in hiring, tenure, and promotion. Draft the committee's memo. It should recommend a concrete policy — retain the current metrics, abandon them entirely, or modify how they are used (e.g., make them advisory rather than decisive, supplement them with structured qualitative review, or change which metrics count and how they are weighted). The memo must engage seriously with the strongest argument on the losing side: if you recommend abandoning metrics, address the concern that qualitative review invites cronyism and idiosyncratic bias; if you recommend keeping them, address the concern that any metric used to make high-stakes decisions will be gamed until it measures only the skill of gaming it. The memo must also be actionable — specify who would implement the change, on what timeline, and what it would cost in money or administrative effort. The provost will circulate it to the deans, several of whom have built their departments' reputations on precisely these numbers and will need to be persuaded, not lectured.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Faculty Senate Committee on Academic Standards.
      *   **Audience:** The Provost (who will circulate it to Deans).
      *   **Context:** A recent tenure case exposed a flaw in the system (metrics met, quality lacking). The committee felt bound by policy to recommend tenure despite reservations.
      *   **Task:** Draft a formal memo recommending a policy revision on bibliometric indicators in hiring, tenure, and promotion (HTP).
      *   **Requirements:**
          *   Recommend a concrete policy (Retain, Abandon, or Modify).
          *   Engage seriously with the strongest argument on the *losing* side (counter-argument).
          *   Be actionable (Who, When, Cost/Effort).
          *   Tone: Persuasive to Deans (who like the numbers), not lecturing. Professional, academic, yet urgent.

  2.  **Determine the Recommendation:**
      *   *Retain:* Unethical given the prompt's context ("ashamed," "substantively hollow"). Ignores the problem.
      *   *Abandon:* Too radical. Deans will reject it immediately. Removes all objective baseline, inviting the bias argument.
      *   *Modify:* The sweet spot. Keeps metrics as *indicators* but removes them as *thresholds*. Shifts the burden of proof to qualitative assessment. This addresses the "gaming" issue while mitigating the "bias" risk through structure.
      *   *Decision:* **Modify.** Specifically: Move from "Metrics as Gatekeepers" to "Metrics as Contextual Data."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the problem and the recommendation.
      *   **Background/Context:** Acknowledge the recent tenure case without naming names. Frame it as a systemic risk, not just one bad apple.
      *   **The Recommendation:** Clearly state the policy change.
          *   Metrics are advisory, not decisive.
          *   Introduce "Structured Qualitative Review" (SQR).
          *   Ban specific gaming-prone metrics (like raw journal impact factors for individual articles).
      *   **Addressing the Counter-Argument (Crucial Step):**
          *   *If recommending modification/softening metrics:* The losing side is the "Hard Metrics" camp. Their argument is: Metrics prevent bias/cronyism.
          *   *Rebuttal:* Acknowledge the risk of bias. Explain how *Structured* Qualitative Review mitigates this (calibration, diverse reviewer pools, explicit criteria). Argue that metrics *also* have bias (toward established networks, English language, specific sub-fields).
      *   **Addressing the "Gaming" Argument (Crucial Step):**
          *   *Wait, the prompt asks to address the strongest argument on the LOSING side.*
          *   If I recommend *Modify/Softening*, the "Losing Side" is the status quo (Hard Metrics). Their strongest argument is **Objectivity/Fairness (avoiding cronyism).**
          *   *Wait, let me re-read the prompt constraint:* "if you recommend abandoning metrics, address the concern that qualitative review invites cronyism... if you recommend keeping them, address the concern that any metric... will be gamed."
          *   *Since I am recommending Modifying (which leans towards qualitative weight), I need to address the Cronyism/Bias concern.* This aligns with the "abandoning" instruction logic, as I am reducing metric reliance.
      *   **Implementation Plan:**
          *   *Who:* Committee on Academic Standards + Office of Faculty Affairs.
          *   *Timeline:* Phased approach (Pilot -> Policy -> Review).
          *   *Cost:* Mostly administrative time, training for reviewers. Minimal financial cost.
      *   **Tone Check:** Needs to persuade Deans. Don't call them vain for liking numbers. Frame it as "Protecting the University's Long-Term Reputation." Metrics are short-term; quality is long-term.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Blame the metrics for the bad tenure case.
      *   *Correction:* No, blame the *policy* that made metrics decisive. The metrics did what they were told; the policy was rigid. This lets the Deans save face (the tools weren't broken, the instruction manual was).
      *   *Deans' Perspective:* They care about rankings. I need to argue that *true* quality drives rankings better than salami-sliced papers in the long run.
      *   *The "Losing Side" Argument:* The prompt says "if you recommend abandoning metrics...". Since I'm recommending a hybrid/modification that prioritizes qualitative over quantitative, I must address the bias/cronyism fear seriously.
      *   *Actionability:* Need specific steps. Training sessions? Revised rubric?

  5.  **Drafting the Content (Iterative refinement):**

      *   *Subject Line:* Needs to be formal but clear. "Recommendations Regarding Bibliometric Indicators in HTP."
      *   *Opening:* Reference the "recent review cycle" without being gossipy.
      *   *The Pivot:* We aren't throwing out data; we are recontextualizing it.
      *   *The Counter-Argument:* "We hear the concern that without hard numbers, bias creeps in." Response: "Hard numbers have their own bias (field-specific, network-specific). We propose *structured* qualitative review to minimize subjectivity."
      *   *Implementation:* 12-month timeline. Working group.
      *   *Cost:* Staff time for training.

  6.  **Final Polish:**
      *   Check tone: Is it respectful to the Deans? Yes, emphasize shared goals (excellence).
      *   Check constraints: Did I address the bias argument? Yes. Is it actionable? Yes.
      *   Check the "Ashamed" element: Translate this into professional concern for institutional integrity.

  7.  **Final Review against Prompt:**
      *   Memo format? Yes.
