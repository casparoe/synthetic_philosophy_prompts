      *   Engage losing side argument? Yes (Bias/Cronyism vs. Metric Bias).
      *   Actionable (Who, When, Cost)? Yes.
      *   Persuade Deans? Yes (Focus on reputation risk).

  *(Self-Correction on the "Losing Side" constraint)*: The prompt says: "if you recommend abandoning metrics, address the concern that qualitative review invites cronyism... if you recommend keeping them, address the concern that any metric used to make high-stakes decisions will be gamed."
  Since my recommendation is to *modify* them to be advisory (effectively moving away from them as the primary driver), I should treat this as akin to "abandoning them as decisive." Therefore, I must address the **cronyism/bias** concern regarding qualitative review. I will ensure this is a prominent section.

