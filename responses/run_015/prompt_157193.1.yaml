      *   **User's Camp (Downward Causation):** Symmballs have causal efficacy. A belief (symmball configuration) causes actions that aren't fully explainable just by tracking individual symms.
      *   **Colleague's Camp (Substrate-only):** All causal work is done by symms. Symmballs are descriptive tools. "Belief" is just a shorthand for a complex symm arrangement.

      *   **Section 1: Agreed Claims:**
