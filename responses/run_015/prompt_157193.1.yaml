          3.  Cruxes (Split-brain, Mirror Careenium, Symmball Condensation) with concrete predictions/evidence conditions for both sides.
      *   **Constraints:** Focused, no citations/bibliography, no obscure Hofstadter scholarship (treat terms as shared vocabulary), don't overpolish tone (keep it academic but draft-like), avoid straw-manning.

