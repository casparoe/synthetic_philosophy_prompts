prompt: |-
  ok so I'm in a third-year metaphysics module, we've spent the last five weeks on grounding and fundamentality, and I've finally got my own position down on paper. Before I present it in seminar I'd like someone to check whether it actually hangs together, because I have a feeling I'm helping myself to something somewhere. I dont need references or a reading list — I need the argument.

  Here's the set, in no particular order:

  1. Grounding is a strict partial order on facts — irreflexive, asymmetric, transitive — and it's well-founded, so there's a base level of ungrounded facts, no infinite descent.
  2. Fundamentality is just ungroundedness. There's no extra 'substantive' or 'thick' notion of being fundamental that isn't captured by not being grounded.
  3. Necessitarianism: if the fact that P grounds the fact that Q, then necessarily, if P then Q. This is why I think grounding can back 'in virtue of' claims at all.
  4. Hyperintensionalism: grounding is finer-grained than any modal relation. Swap in a necessarily equivalent fact and the grounding can break, so you can't read grounding off supervenience.
  5. Humeanism about laws: laws are the axioms of the best system describing the mosaic; nothing necessitates anything else across distinct existences; no necessary connections between wholly distinct existences.
  6. Non-reductive physicalism: every non-fundamental fact is grounded in physical facts; mental facts are grounded in neurophysical facts but not identical with them. And being grounded in something just is being nothing over and above it.
  7. The base is what fundamental physics gives us: facts about local qualities at spacetime points (or field values). We should read our ontology off our best physics.
  8. Purity — the tutor writes it as (Sep): no fact about a derivative entity is fundamental. I think I accept it.

  Verdicts I'm attached to and can't shake: I want to say that 2+2=4 and that nothing is red and green all over are true but not fundamental — they're not the kind of thing the base of the book of the world contains. Our seminar calls these 'cheap fundamentals' and the line is that you either find them grounds or you let them into the base. I also want to say the 'that's all' fact — the fact that the mosaic facts are all the facts there are — is not fundamental, and I can't see what would ground it. And I sort of want the laws in the base too, since (7) tells me to read ontology off physics and physics is stated in nomic terms.

  I don't know which of these is the problem one, so please don't just tell me which to drop without saying why, and don't lead with 'drop physicalism' unless that's genuinely the only option. What I want is an audit: which pairs really are in tension, which only look like they are, and for each real one what the cheapest revision is and what it costs me. Rank them by severity rather than flagging all of them as equally bad, and say if any of my commitments is too vaguely stated for you to tell.

  Could you format it like this:

  - Bottom line — about 60 words: is the package consistent, and if not, roughly how much of it survives.
  - Real tensions, worst first — about 500 words: for each, the two commitments, exactly why they clash, the cheapest fix, and what that fix costs me elsewhere.
  - Ones that only look like tensions — about 200 words: why they dissolve.
  - Cheapest overall package — about 150 words: the single revision that cleans up the most, and what my position looks like afterwards.
  - What I'd need to disambiguate — about 80 words: any commitment where your answer depends on a reading I haven't fixed.
