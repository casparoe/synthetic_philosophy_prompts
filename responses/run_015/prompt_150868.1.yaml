prompt: |-
  Me and two others on our town's heritage working group have scraped together a small grant (about £6k, six months part-time) to write guidance for the council on what to do about street names that honour people we'd now disown — slave traders, colonial governors, that sort of thing. Statues have been argued to death everywhere and I don't want to just copy those arguments across.

  My half-formed idea, which I've been chewing over on my own since the row last year (I've no philosophy background at all, I work in a school office): a statue is something you can choose to walk past, but a street name is something the council makes people say and write over and over — on forms, letters, food deliveries. So the complaint isn't just that a commemoration exists somewhere, it's that thousands of residents are made to repeat it. Second thing: I think people conflate honouring someone with simply marking them. Half the people on that street have no idea who the name refers to any more, so maybe it's stopped commemorating anything at all, which would mean there's less at stake than the statue case — or maybe it's worse, because the tribute is now invisible and nobody can answer it. And the hassle of renaming lands on the residents, who never asked for any of this.

  Can you turn that into a short proposal, about two pages? I need: the question put sharply enough that it could actually have an answer; why the standard statue moves (contextualise it, move it to a museum, don't erase history) don't settle the street-name version; what I'd actually do month by month, given I can talk to residents and councillors and read council minutes but can't do proper acedemic library research; what a genuinely useful deliverable looks like for a council that has to decide something by next year; and an honest bit on how the project could fail or turn out too big for six months part time. Please write it in British English, and don't give me any reading list or citations — I've no library access and I'll slot in whatever references are needed myself.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **User:** Member of a town heritage working group (school office admin, no philosophy background).
      *   **Team:** Three people total.
      *   **Resources:** £6k grant, six months part-time.
      *   **Task:** Write guidance for the council on contentious street names (slave traders, colonial figures, etc.).
      *   **Core Idea:** Street names differ from statues because they force residents to *say/write* the name (complicity vs. observation) and the commemoration might be invisible/forgotten (honouring vs. marking). Renaming burdens residents.
      *   **Output:** A short proposal (approx. 2 pages).
      *   **Requirements:**
          *   Sharp research question.
          *   Why statue solutions don't work for street names.
          *   Month-by-month work plan (limited resources: talk to residents/councillors, read minutes, no academic library).
          *   Definition of a useful deliverable.
          *   Honest risk assessment (failure/scope creep).
          *   British English.
          *   No reading list/citations.

  2.  **Deconstruct the Core Idea & Refine the Question:**
      *   *Idea 1:* Statues = passive observation; Street Names = active repetition/complicity.
      *   *Idea 2:* Statues = visible honour; Street Names = potentially invisible/empty signifiers.
      *   *Idea 3:* Renaming = burden on residents (cost, hassle, identity loss).
      *   *Refined Question:* It needs to be actionable. Not just "What is the ethics?" but "How should the council decide?"
      *   *Draft Question:* "Under what conditions does the civic burden of repeating a name outweigh the historical value of keeping it?" Or better: "What criteria should a council use to balance the harm of compelled speech against the burden of renaming?"
      *   *Final Polish:* "When does the civic burden of repeating a contested name outweigh the historical value of retaining it? A framework for local authority decision-making on street nomenclature."

  3.  **Address the "Statue vs. Street Name" Distinction:**
      *   Statues: "Retain and Explain" works because you can walk away.
      *   Streets: You can't walk away from your address. It's on bank statements, GP records, Amazon deliveries. It's *compelled speech*.
      *   Statues: Visible intent.
      *   Streets: Often forgotten intent. Is it still honouring if no one knows who it is? Or is it worse because the harm is subconscious?

  4.  **Develop the Work Plan (6 Months Part-Time):**
      *   *Budget:* £6k for 3 people over 6 months. That's roughly £333/month each. Very lean. Time is the main resource, not money.
      *   *Month 1:* Scoping & Desk Research (local minutes, existing policies).
      *   *Month 2:* Stakeholder Interviews (Councillors, Planning Dept).
      *   *Month 3:* Resident Engagement (Focus groups/Surveys in affected streets).
      *   *Month 4:* Drafting the Framework (The "Guidance").
      *   *Month 5:* Consultation on the Draft (Feedback loop).
      *   *Month 6:* Final Polish & Presentation.

  5.  **Define the Deliverable:**
      *   Not an academic paper.
      *   Needs to be a "Decision Matrix" or "Flowchart" + a short report.
      *   Something a committee can use in a meeting to vote.

  6.  **Risk Assessment (Honesty):**
      *   Scope creep: Trying to solve *all* names. Need to focus on *contested* ones.
      *   Public backlash: This is a hot topic.
      *   Resource limits: £6k isn't much for extensive consultation.
      *   Political will: Council might ignore it.

  7.  **Drafting - Tone and Style:**
      *   British English (honour, programme, council, labour, etc.).
      *   Professional but accessible (user works in a school office, not a professor).
      *   Concise (approx. 2 pages).
      *   No citations.

  8.  **Writing - Section by Section (Iterative refinement):**

      *   *Title:* Needs to sound official but clear. "Project Nomenclature" or similar. Let's go with "Project: Street Level."
      *   *Introduction:* Set the context. Statues are done; streets are the next frontier.
      *   *The Question:* Sharpen the user's intuition about "compelled speech."
      *   *Why Statues Don't Apply:* Elaborate on the "active repetition" vs. "passive viewing."
      *   *Methodology:* Break down the 6 months. Keep it realistic for part-time volunteers/small grant.
      *   *Deliverable:* A toolkit, not a thesis.
      *   *Risks:* Be blunt about the political sensitivity and time limits.

  9.  **Review against Constraints:**
      *   *British English?* Check (honour, council, programme, centre).
      *   *No citations?* Check.
      *   *2 Pages?* Need to monitor word count. (A standard page is ~500 words single spaced, so aiming for ~1000-1200 words).
      *   *User's specific points included?* Yes (compelled speech, invisible commemoration, resident burden).

  10. **Final Polish:** Ensure the distinction between "honouring" and "marking" is clear. Ensure the financial constraint (£6k) is acknowledged in the methodology (low-cost engagement). *Self-Correction during drafting:* Make sure I don't sound *too* academic. The user said they have no philosophy background. Keep the language grounded in council procedure.

  11. **Final Word Count Check:** Aiming for dense but readable. Let's structure it with clear headings.

  *(Self-Correction on Budget)*: £6k for 3 people over 6 months part-time is actually okay for expenses and a small stipend, but mostly it covers time. I should frame the methodology as "low-cost engagement."

  *(Refining the "Compelled Speech" argument)*: This is the strongest point. I need to make sure the council understands that an address is administrative, not just geographical.

  *(Refining the "Invisible Commemoration")*: If no one knows who the person is, is the harm done? Or is the harm that the *system* remembers even if people don't? I'll frame this as a test question in the guidance.

  Okay, ready to write.cw
answer: |-
  **Project Title:** Street Level: A Framework for Contested Street Nomenclature
  **Applicants:** [Town Name] Heritage Working Group
  **Duration:** 6 Months (Part-Time)
  **Budget:** £6,000

  ### 1. The Core Question
  Most local authorities have now settled their approach to statues: retain, contextualise, or relocate. These solutions assume the monument is a destination something a citizen chooses to visit or walk past. This project proceeds from the premise that street names are fundamentally different. A statue is observed; a street name is administered.

  Our research asks: **When does the civic burden of repeating a contested name outweigh the historical value of retaining it?**

  Current debates conflate *marking* history with *honouring* it. If a street name no longer signals a specific person to the residents living there, has the commemoration ceased? Conversely, if the name remains on official documents, are residents being made complicit in a tribute they do not endorse? We aim to move the council away from abstract moralising and towards a decision-making matrix that weighs the harm of compelled repetition against the practical and financial burden of renaming on residents.

  ### 2. Why Standard 'Statue Solutions' Fail Here
  The prevailing heritage guidance (e.g., 'Retain and Explain') does not translate to street nomenclature for three specific reasons:

  *   **Compelled Speech:** You can choose not to look at a statue. You cannot choose to omit your street name from a bank application, a GP registration, or a utility bill. Retaining a name forces residents to actively reproduce it in daily life. The guidance must address whether the council has the right to mandate this repetition.
  *   **Invisible Commemoration:** A statue is a visible claim to honour. A street name is often an empty signifier; most residents cannot identify the namesake. If the 'honour' is invisible, the argument for retention based on 'education' collapses. However, this creates a secondary problem: the tribute becomes subconscious. Our work must determine if an forgotten offensive name is less harmful than a remembered one.
  *   **The Burden of Change:** Removing a statue costs the council money. Removing a street name costs the *residents* money and time (changing stationery, updating records, potential confusion for emergency services). A framework that recommends renaming without accounting for this private cost is unethical. The guidance must establish who bears the cost of correction: the public purse or the household.

  ### 3. Work Plan (6 Months Part-Time)
  We have no access to academic libraries, so this project relies on local intelligence, civic records, and direct engagement. The budget will cover transcription costs, room hire for community meetings, and printing.

  *   **Month 1: Audit & Precedent.**
      *   Review council minutes from the last five years regarding street naming and heritage.
      *   Map the specific streets in question against local demographic data.
      *   Establish a baseline: What is the current official policy? (Often, there isn't one).
  *   **Month 2: Stakeholder Interviews.**
      *   Semi-structured interviews with five key council officers (Planning, Legal, Communications).
      *   Goal: Understand the administrative friction of renaming. How hard is it *actually* to change a name on council tax records?
  *   **Month 3: Resident Engagement.**
      *   Two town-hall style meetings (one in the town centre, one in an affected neighbourhood).
      *   Focus: Not "should this name go?" but "what would changing this cost you?" and "do you know who this honours?"
      *   We are testing the 'invisible commemoration' theory: if residents don't know the namesake, does the offence land differently?
  *   **Month 4: Drafting the Framework.**
      *   Synthesise findings into a draft 'Decision Tree'.
      *   This will not be a list of recommended bans, but a flowchart for committees. (e.g., *Is the namesake associated with human rights abuses? > Yes. > Do residents know who they are? > No. > Is there a viable alternative name? > Yes.*)
  *   **Month 5: Consultation on Draft.**
      *   Present the draft framework to the Heritage Working Group and a sympathetic councillor.
      *   Stress-test the criteria against hypothetical scenarios to ensure it doesn't produce absurd results.
  *   **Month 6: Final Report & Presentation.**
      *   Produce the final guidance document (max 20 pages + appendices).
      *   Formal presentation to the relevant Council Committee.

  ### 4. The Deliverable
  We are not producing an academic paper. The council needs a tool they can use in a meeting to justify a vote. The deliverable will be:

  1.  **A Decision Matrix:** A one-page flowchart that officers can use to triage complaints. It will categorise names into 'Retain', 'Retain with Context', or 'Rename'.
  2.  **A Cost-Benefit Template:** A standardised form for calculating the impact on residents (estimated cost per household, impact on emergency services databases) to be completed before any vote is taken.
  3.  **A Short Report:** Explaining the ethical reasoning, specifically the distinction between 'marking' and 'honouring', to be used in communications if a renaming is challenged by the press.

  ### 5. Risks and Limitations
  We must be honest about where this project might stall.

  *   **Scope Creep:** The definition of 'contested' is slippery. If we start with slave traders, residents may demand we review every military figure or local industrialist. We will strictly limit our initial guidance to names associated with chattel slavery and colonial administration to keep the project manageable.
  *   **Political Will:** We can write guidance, but we cannot force the council to adopt it. If the political leadership decides this is too volatile an issue before an election, our work may sit on a shelf. We will mitigate this by keeping the tone administrative and procedural, rather than activist.
  *   **Resource Constraints:** £6k is lean for meaningful engagement. We risk hearing only from the loudest voices (those for and against). We will mitigate this by focusing our Month 3 engagement on *practical* costs to residents, which tends to depoliticise the conversation and encourage quieter voices to contribute.
  *   **The 'Erasure' Argument:** We anticipate criticism that we are 'airbrushing history'. Our framework addresses this by distinguishing between *street names* (administrative tools) and *museums* (educational tools). We are not proposing deleting history, but relocating it to a more appropriate medium. However, if the public debate shifts entirely to this point, our nuanced distinction may be lost.

  **Conclusion**
  This project accepts that street names are not history lessons; they are addresses. By treating them as administrative assets rather than heritage monuments, we can offer the council a way to make decisions that are ethically robust without imposing undue burden on the people who live there.
