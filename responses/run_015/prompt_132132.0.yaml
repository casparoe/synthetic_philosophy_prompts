answer: |-
  **Grade: B-**

  **Margins:**

  > *Dennett rejects the Cartesian theater — the idea that there's one inner screen where consciousness happens.*

  **[Good. Clear def.]**

  > *Instead, the brain produces lots of drafts of sensory information in parallel, like rough sketches being edited all over.*

  **[Yes. "All over" is key here.]**

  > *The phrase 'Cartesian theater' is Dennett's name for the mistake of putting a single observer inside the head, and he traces it back to Descartes's idea of the pineal gland as the seat of the soul.*

  **[Fine, though you're spending word count on history rather than the mechanism.]**

  > *Once you drop the theater, consciousness isn't a single stream but the draft that gets promoted by the brain's narrative center to become the final version.*

  **[Wait. "Narrative center"? "Final version"? You just smuggled the theater back in. Dennett's point is there is no final version, no place where it "comes together." The editing never stops. Careful.]**

  > *The other drafts disappear or never reach awareness.*

  **[Okay, but "awareness" is tricky here if there's no one to be aware.]**

  > *So there's no need for a homunculus — consciousness is just the winning draft.*

  **[This contradicts the first paragraph. If there's a "winning draft," there's a finish line. If there's a finish line, there's a judge. Who's judging? You haven't actually avoided the homunculus, you've just renamed it.]**

  ***

  **Top of page note:**

  You get the basic picture (parallel processing, no screen), but you trip on the landing. The whole point of Multiple Drafts is that there is no "final" draft that *is* consciousness. Consciousness is the editing process itself, not the result. By saying there's a "narrative center" that promotes a "winning draft," you're describing a smaller, sneakier Cartesian theater. You need to be more radical about the lack of a finish line. Read the "Stalinesque vs. Orwellian" section again—there's no fact of the matter about which draft won. Come see me if you want to walk through the "center of narrative gravity" bit, because right now you're treating it like a physical place.

  Get some sleep.
