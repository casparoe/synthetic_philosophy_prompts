answer: |-
  You have constructed a compelling and morally serious argument. It resonates because it captures a genuine tension in modern professional life: the dissonance between the *myth* of meritocracy (that outcomes perfectly reflect moral worth) and the *reality* of cumulative advantage (that outcomes reflect compounded luck).

  However, your suspicion is correct. There is a false step in the logic, and it lies precisely where you suspected: in the conflation of **Merit** with **Desert**.

  Here is an analysis of where the argument slips, what the practice of selection is actually for, and whether the lottery solves the problem or merely displaces it.

  ### 1. The False Step: Reward vs. Prediction

  Your argument rests on the definition that "posts and rewards should go to the people who deserve them." This frames hiring as a **retrospective reward system** for past effort and discipline.

  But in an organizational context, hiring is not a reward; it is a **prediction**.

  *   **Desert** is backward-looking. It asks: *Who has suffered, striven, or overcome the most?*
  *   **Merit (in hiring)** is forward-looking. It asks: *Who is most likely to perform the functions of this role successfully?*

  If you are hiring a surgeon, you do not want the candidate who worked the hardest to get through medical school (Desert); you want the candidate with the steadiest hands and the best spatial reasoning (Merit), even if those traits were gifted to them by genetics and a calm upbringing (Luck). To choose the "deserving" candidate over the "capable" candidate in a high-stakes role is arguably unethical, because it prioritizes the candidate's moral narrative over the stakeholders' welfare (patients, students, clients).

  The false step is assuming the purpose of the panel is to distribute justice. The purpose of the panel is **stewardship of the role**. When you treat selection as a mechanism for distributing moral desert, you invite the "ratchet" problem. When you treat it as a mechanism for predicting future performance, the "ratchet" becomes a problem of *measurement validity*, not moral illegitimacy.

  ### 2. What is the Practice For?

  If selection is not for tracking desert, what is it for? It is for **minimizing risk and maximizing capacity.**

  The "Ratchet" argument correctly identifies that credentials are noisy proxies for ability because they are contaminated by luck. However, even a noisy proxy is usually a better predictor of future performance than a coin flip.

  *   **The Meritocratic Claim:** Credentials correlate with future performance.
  *   **The Ratchet Critique:** Credentials correlate with past advantage.
  *   **The Synthesis:** Past advantage often *enables* the acquisition of skills that lead to future performance.

  The tragedy you identify is that we treat the *possession* of the skill as a moral virtue. The solution is not to ignore the skill (via lottery), but to stop treating the skill as a moral virtue. We can acknowledge that the successful candidate is *lucky* to be capable, without denying that they are *capable*.

  ### 3. Does the Lottery Break the Ratchet?

  Your colleague's proposal is to shortlist capable candidates and then lottery the post. You ask: *Does this break the ratchet, or just hide it behind a threshold?*

  It hides it behind the threshold. In fact, it may intensify the ratchet at the shortlisting stage.

  If the final selection is random, the entire weight of decision-making shifts to the definition of **"Plainly Capable."**
  *   Who defines the threshold?
  *   What counts as "capable"?
  *   Which credentials get you over the line?

  If the lottery is applied only to those who clear the bar, then the bias of the panel regarding *what constitutes the bar* becomes the sole determinant of inequality. A competitive selection process at least forces the panel to justify why Candidate A is preferred to Candidate B. A lottery allows the panel to say, "Both are qualified," while potentially setting qualification criteria that systematically exclude certain demographics or backgrounds.

  Furthermore, the lottery does not stop the "desert-laundering" for those who make the shortlist. They will still believe their CV got them into the pool because of their superior effort, not realizing they were one of ten indistinguishable candidates. The "hubris of the winner" remains; it is just diluted.

  ### 4. Michael Young's Warning

  You are right that Michael Young coined "meritocracy" as a satire. But his warning in *The Rise of the Meritocracy* was not that we should stop matching skills to roles. His warning was that a society ruled by meritocrats would become **arrogant**.

  Young feared a ruling class that believed their success was entirely their own doing, and therefore looked down on those who failed. He feared the *moralization* of success.

  Your argument accepts Young's premise (meritocracy launders luck) but draws a different conclusion. Young might argue that the solution is not a lottery (which abandons competence), but **humility**. The system is functional, but the *ideology* surrounding it is toxic. We should select for competence, but we must explicitly acknowledge that competence is largely a gift of fortune.

  ### 5. A View for the Panel

  You are in a difficult position. You are healing from a rejection that felt merit-based, and now you hold the power to define merit. Here is a suggested view to take on your colleague's proposal:

  **Do not adopt the lottery as a principle of justice, but consider it as a tool of epistemic humility.**

  1.  **Reject the Desert Frame:** Explicitly decouple hiring from moral worth. The person who gets the job is not "better" than the person who doesn't; they are simply the selected instrument for a specific task.
  2.  **Audit the Threshold:** If you are going to shortlist, scrutinize the "plainly capable" criteria. Are they proxies for privilege (e.g., specific pedigree, uninterrupted career paths) or actual predictors of performance (e.g., work samples, problem-solving)?
  3.  **The "Tie-Break" Lottery:** A lottery is defensible only when **predictive validity is exhausted.** If the panel genuinely cannot distinguish between three candidates regarding their likely future performance, *then* a lottery is superior to splitting hairs on arbitrary grounds. But this must be because the *merit signal* has faded, not because merit is illegitimate.
  4.  **Acknowledge the Luck:** In your feedback and internal deliberations, name the luck. "We are selecting X, recognizing that their path was smoothed by Y, and that Z was equally capable but lacked that smoothing."

  **Conclusion**

  The false step was thinking that hiring is about giving people what they deserve. It is about giving the organization what it needs. The "Ratchet" is real, but it is a social mobility problem, not necessarily a hiring procedure problem.

  If you implement a lottery, do not do it because merit is a lie. Do it because, in this specific instance, your panel admits it cannot measure merit with enough precision to justify a choice. That is not an attack on meritocracy; it is an honest admission of measurement error. And that is a much stronger, more defensible position than claiming the whole enterprise is a fraud.
