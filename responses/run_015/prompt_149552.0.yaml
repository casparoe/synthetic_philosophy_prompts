          *   *The Merge:* The user admits suspecting they merged merit with desert. This is likely the core philosophical error.

      *   *Premise 2: The Ratchet (Luck $\rightarrow$ Credential $\rightarrow$ Desert).*
          *   *Validity:* This is a strong sociological point (Matthew Effect). It's true that advantage compounds.
          *   *Limit:* Does this make the *outcome* worse than a lottery? A lottery ignores future performance potential entirely. If "merit" (predictive validity) correlates even slightly with future output, a lottery sacrifices organizational efficacy.

      *   *Premise 3: Lottery is better because it's honest.*
