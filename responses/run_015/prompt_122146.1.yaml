prompt: |-
  As a novelist applying for a six-month interdisciplinary fellowship, I need a short research proposal on whether Émilie du Châtelet’s account of happiness implicitly requires what I will call structured epistemic leisure—a protected social and temporal arrangement that frees rational inquiry from reproductive labor—rather than relying only on the moral virtues she explicitly praises. Existing interpretations treat her ethics as universally available, but if happiness demands a specific material organization of daily life that was historically restricted to a privileged minority, then her view functions as a class-bound ideal masked as general philosophy. Write the response as exactly five numbered items, each consisting of one or two sentences, with no introduction and no conclusion: state the precise research question and why current readings leave it open; describe the method, combining conceptual analysis of leisure in her period with close reading of her essay on happiness rather than a standard intellectual history; specify what result would support the framing and what finding would count as failure; assess honestly what can be completed in six months without archival travel; and explain why introducing this niche concept of structured epistemic leisure helps a novelist understand how material conditions shape consciousness. Do not request bibliographies, reading lists, or citations, and avoid naming secondary sources beyond those needed to establish the gap.
