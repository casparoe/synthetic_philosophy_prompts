  Proponents of the disposition view argue that repetition allows the agent to train herself into a type of person who drinks automatically, bypassing deliberation. They claim this satisfies the functional profile described in the puzzle: the state issues in action. However, this confuses habit with intention. Intention is a distinctively rational state, tied to the agent's view of her reasons. A reflex trained by repetition, where the agent consciously acknowledges there is no reason to act, is merely a causal propensity, not an intention. The detector is calibrated to a state that would issue in action *if* the money had not been transferred. But the agent knows the money *is* transferred. To form the state, she must deceive herself about the transfer or her reasons. Self-deception is not intention. The functional profile requires the state to be sensitive to reasons; a state that persists despite the absence of reasons is malfunctioning, not functioning as an intention.

  Consider the normative wrinkle: succeeding requires becoming someone who acts against considered judgment. This matters significantly. If intention is constitutively tied to rationality, then becoming 'irrational' does not make intention available; it destroys the capacity for intention. An agent who systematically forms states that contradict her judgment is not forming intentions; she is engaging in play-acting or wishful thinking. The cost is not merely psychological; it is metaphysical. The state lacks the necessary connection to practical reasoning that defines intention. To argue otherwise is to suggest that an agent can intend simply by willing it, regardless of her normative landscape. This severs the link between action and reason that makes intention intelligible as a mental state.

  A strong objection arises from the idea of standing policies. One might argue that the agent can intend based on a policy of 'keeping resolutions,' where keeping the resolution is itself the reason. This would satisfy RIC because the agent now has a reason (policy maintenance). The serial nature supposedly supports this: over twenty years, maintaining a self-conception as a resolute person becomes valuable. However, in this specific puzzle, the structure of the reward blocks this. The reward is secured before the action. Keeping the resolution yields no additional money and costs health. There is no independent value in keeping a resolution to drink toxin when doing so serves no end. Therefore, the policy itself lacks rational support. The agent cannot reasonably believe she has reason to maintain a policy that harms her without benefit. The serial history does not create value where none exists; it merely highlights the cost.

  Furthermore, the 'no-crutches' clause ensures this cannot be solved by binding oneself externally, forcing the issue back onto the internal mental state. If the internal state requires a reason, and none exists, the state cannot be formed. The serial element adds emotional weight—shame at breaking past resolutions, pride in keeping them—but these are not sufficient reasons to outweigh physical illness when no gain is pending. Thus, the belief condition of RIC cannot be met.

  Thus, the serial case fails to generate intention. Repetition provides no new reasons at the time of action. The disposition formed is non-rational habit. The normative cost highlights that the agent is compromising her rational agency, not exercising it. RIC remains intact: without believed reason, there is no intention. The serial variant simply demonstrates that repeating an impossible act does not make it possible; it only deepens the irrationality of the attempt. The successful player collects money only by failing to intend, relying on the detector's inability to distinguish deep self-deception from genuine intention, but philosophically, the state remains defective. The puzzle shows that intention is not a muscle to be trained, but a judgment-sensitive attitude that cannot survive the removal of its rational grounds.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Accurate Statement and Application of RIC (4 marks)**
  *   **Must Hit:** The answer must correctly define the Rational Intention Constraint (intention requires belief in future reason) and explain why the one-shot case violates it (money secured before action removes reason).
  *   **Typical Error:** Candidates define RIC vaguely or forget to explain why the transfer of money removes the reason for action in the specific context.

  **2. Analysis of the Serial Mechanism (4 marks)**
  *   **Must Hit:** The answer must argue whether repetition changes the reason structure at the time of action. It must conclude that repetition does not create new reasons where none existed.
  *   **Typical Error:** Candidates assume repetition automatically creates a disposition without explaining why that disposition does or does not count as a reason.

  **3. Distinction Between Habit and Intention (4 marks)**
  *   **Must Hit:** The answer must distinguish between a trained reflex/habit and a rational intention, noting that intention requires sensitivity to reasons, not just causal output.
  *   **Typical Error:** Candidates treat any state that causes action as an intention, ignoring the rational constraint defined in the question.

  **4. Engagement with the Normative Wrinkle (4 marks)**
  *   **Must Hit:** The answer must address whether becoming 'irrational' affects the metaphysics of intention (e.g., arguing that irrationality destroys the capacity for intention rather than enabling it).
  *   **Typical Error:** Candidates treat the normative cost as merely psychological distress rather than a structural problem for the mental state itself.

  **5. Handling of the Policy Objection (4 marks)**
  *   **Must Hit:** The answer must consider the counter-argument that a standing policy provides a reason, and rebut it by showing the policy lacks value in this specific reward structure.
  *   **Typical Error:** Candidates raise the policy objection but fail to explain why it fails given the money is already secured.

  **Grade Boundaries**
  *   **A (17-20 marks):** Takes a clear, consistent stand; all five moves are executed with precision; the rebuttal to the policy objection is nuanced; the distinction between habit and intention is philosophically robust.
  *   **B (13-16 marks):** Takes a stand and hits most moves, but one section (usually the policy objection or normative wrinkle) is underdeveloped; argument is clear but lacks depth in connecting the serial structure to the constraint.
  *   **C (9-12 marks):** Understands the puzzle but fails to take a clear stand or misses two or more key moves; may rely on reciting the one-shot case without addressing the serial variant's specific features.
