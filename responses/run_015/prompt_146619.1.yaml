answer: |-
  **Mara:** You're treating the Protestant Ethic like smoke following fire. But Weber's point was that the smoke *lit* the match. The religious values had explanatory autonomy. They weren't just reflecting economic conditions; they shaped the actual behavior of early capitalists through an elective affinity.

  **Leo:** That's romanticizing it. Values don't float free; they're carried by material interests and institutional enforcement. Look at the trajectory: once capitalism was established, the religious motivation disappeared. The spirit left the bottle. That makes the values look like scaffolding—useful for construction, but kicked away once the building stands. If the cause disappears but the effect remains, how strong a cause was it really?

  **Mara:** Because the *structure* became institutionalized, not because the cause was invalid. You're ignoring Weber's distinction between meaningful adequacy and causal adequacy. A value-frame is causally adequate if its absence would have changed the actors' interpretations in a counterfactually stable way. Without that specific religious anxiety about salvation, the accumulation of capital looks like greed, not a calling. The meaning changes, so the action changes.

  **Leo:** But that's the problem. Macro counterfactuals for values are untestable. You can't run the simulation of history without Calvinism to see if capitalism fails. And you're overstating Weber's claim. He explicitly called the thesis an "adequate cause," not a necessary one. He left room for material factors. You're treating culture as a switch; Weber treated it as a dial.

  **Mara:** I'm not saying it's monocausal. But "adequate cause" doesn't mean weak. It means the probability of the outcome shifts significantly given the presence of the value. If the interpretation of economic activity is fundamentally altered by the ethic, then the ethic is doing causal work, not just legitimating interests after the fact.

  **Leo:** Legitimation *is* the work, though. It lowers the transaction costs of enforcement. But here's where the scholarship actually splits: settled textually, Weber never claimed necessity. But contested is whether his counterfactual method holds water for macro-history. You're assuming the actors' interpretations are stable enough to drive the system. I'm saying the system selects the interpretations that survive.

  **Mara:** That's functionalism, Leo. You're saying the values survived because they were useful, not because they were believed. Weber argues they were believed, and that belief constrained action. That's the autonomy.

  **Leo:** I'm saying the belief was enforced by the institution of the church and market competition. Once the market competed harder than the church, the belief dropped. That's material interest winning out. You want culture to be a prime mover; I see it as a variable dependent on institutional stability.

  **Mara:** But without the initial shift in meaning, the institution doesn't stabilize that way. That's the causal adequacy point you're dodging.

  **Leo:** And I'm telling you Weber's own hedge—"adequate cause"—admits he can't prove that necessity. He knows the counterfactual is speculative. We agree the spirit secularized—that's settled. We disagree on whether that proves the spirit was ever the engine, or just the starter motor.

  **Mara:** Then we disagree on whether a starter motor is a cause.

  **Leo:** Only if the car doesn't run without it. And we can't prove that.
