prompt: |-
  I was discussing this with a colleague in economics the other day and I came away a bit confused. We were talking about the social discount rate and the Ramsey rule (r = δ + η·g), and I keep seeing peope in the climate literature treat the pure rate of time preference δ as if it's the moral core of the whole thing — the part that's doing the ethical work of deciding how much we care about future generations. But when I actually plug in the numbers, it seems like most of the discount rate comes from the η·g term, not from δ.

  So I'd like you to argue that the pure rate of time preference is actually doing less moral work than its advocates and critics both seem to think, and that the real ethical debate is about η and g — and about the pure vs. impure nature of discounting more generally. I'm especially interested in the 'fiction' of pure time preference: the idea that all real discounting is impure (arising from mortality risk, opportunity cost, uncertainty, changing tastes, and so on) and that pure time preference — caring less about a good just because it's later — is a mistake that the Ramsey rule bakes in as if it were a genuine preference.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Social Discount Rate (SDR), Ramsey Rule ($r = \delta + \eta \cdot g$), Climate Economics.
      *   **Core Observation:** The user notices that in practice, the $\eta \cdot g$ term often dominates $\delta$ in magnitude, yet the ethical debate focuses almost exclusively on $\delta$ (pure rate of time preference).
      *   **Task:** Argue that $\delta$ is doing *less* moral work than commonly thought. Argue that the real ethical debate should be about $\eta$ (elasticity of marginal utility) and $g$ (growth rate).
      *   **Specific Angle:** Challenge the "fiction" of pure time preference. Argue that all real discounting is "impure" (mortality, risk, opportunity cost, etc.) and that treating $\delta$ as a genuine ethical parameter is a mistake baked into the Ramsey rule.
      *   **Tone:** Persuasive, analytical, economically literate but accessible (since the user is discussing with a colleague).

  2.  **Deconstruct the Ramsey Rule:**
      *   Formula: $r = \delta + \eta \cdot g$
      *   $\delta$ (Delta): Pure Rate of Time Preference (PRTP). Often interpreted as "impatience" or "myopia." Ethical stance: Should be zero (Ramsey, Pigou, Stern) or positive (Nordhaus, Weitzman).
      *   $\eta$ (Eta): Elasticity of Marginal Utility of Consumption. Measures aversion to inequality/aversion to risk. High $\eta$ means we care a lot about smoothing consumption.
      *   $g$: Growth rate of per capita consumption.
      *   $\eta \cdot g$: The "wealth effect." If future generations are richer, an extra dollar is worth less to them (diminishing marginal utility).

  3.  **Evaluate the User's Premise:**
      *   *Is it true that $\eta \cdot g$ dominates?* In many calibration exercises, yes. If $g = 2\%$ and $\eta = 2$, that term is $4\%$. If $\delta = 0.1\%$, the $\eta \cdot g$ term is 40x larger. Even if $\delta = 1\%$, $\eta \cdot g$ is still dominant.
      *   *Is the focus on $\delta$ disproportionate?* Yes, the Stern Review vs. Nordhaus debate centered heavily on $\delta$ (0.1% vs. 1%+), while $\eta$ was often treated as a technical parameter rather than an ethical one.
      *   *Is "pure time preference" a fiction?* This is a strong philosophical claim (associated with Sidgwick, Ramsey, and modern critics like Broome). The argument is that rational agents shouldn't discount utility *purely* due to time. Any observed discounting is due to probability of existence, changing needs, etc.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. It's a sharp observation. State the thesis: $\delta$ is a red herring; the heavy lifting is done by $\eta$ and $g$, and the concept of $\delta$ itself is ethically suspect.
      *   **Point 1: The Arithmetic of Neglect.** Show the math. If $g$ is positive and $\eta$ is standard (1-2), the wealth effect swamps pure impatience. Focusing on $\delta$ is like arguing over the tip when the bill is huge.
      *   **Point 2: The Ethical Weight of $\eta$.** $\eta$ isn't just technical; it's about distributive justice. High $\eta$ means we transfer less to the future because they will be rich. Low $\eta$ means we treat future wealth as less morally distinct from current poverty. This is the *real* intergenerational equity parameter.
      *   **Point 3: The Uncertainty of $g$.** $g$ isn't a law of nature. It's a policy choice and a forecast. In climate contexts, $g$ might be negative (damages). Assuming positive $g$ to justify discounting is a moral gamble (Weitzman's Dismal Theorem territory).
      *   **Point 4: The Fiction of Pure Time Preference.** Attack $\delta$ directly.
          *   Ramsey called it "ethically indefensible."
          *   What looks like $\delta$ is usually risk ($p$) or institutional decay.
          *   If we separate "impatience" from "probability of extinction," $\delta$ should be zero.
          *   The Ramsey rule conflates *utility* discounting with *consumption* discounting.
      *   **Point 5: Impure Discounting.** Elaborate on the user's prompt. Real world discounting comes from:
          *   Mortality/Existence risk.
          *   Opportunity cost of capital (market rate vs. social rate).
          *   Changing tastes (maybe they won't want our goods).
          *   These are *descriptive*, not *normative*. $\delta$ pretends to be normative but is often a proxy for these descriptive factors.
      *   **Conclusion:** Summarize. Shift the debate from "how much do we love the future?" ($\delta$) to "how much richer will they be, and how much do we care about inequality?" ($\eta \cdot g$).

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* I need to make sure I don't say $\delta$ is *irrelevant*. In the very long run (infinite horizon), if $g \to 0$, $\delta$ becomes the only thing left. But for policy-relevant timeframes (100 years), $\eta \cdot g$ matters more.
      *   *Nuance on $\eta$:* High $\eta$ implies high aversion to inequality. If future people are richer, we shouldn't sacrifice much now. This actually *reduces* climate action compared to low $\eta$. This is counter-intuitive but crucial.
      *   *Nuance on $g$:* Climate change might reduce $g$. If $g$ falls, the discount rate falls. This creates a feedback loop often ignored.
      *   *Philosophical grounding:* Mention Broome or Parfit regarding the "neutrality" of time.

  6.  **Final Polish:** Check tone. Ensure it sounds like a robust economic-philosophical argument suitable for a discussion with a colleague. Use clear headings. (The resulting output should match the structure planned in step 4 & 5).

  7.  **Final Review against constraints:** The user wants me to *argue* a specific position. I need to take that side persuasively.

      *   *Position:* $\delta$ is overrated ethically. $\eta$ and $g$ are the real ethical drivers. Pure time preference is a fiction.
      *   *Check:* Did I address the "impure" nature of discounting? Yes.
      *   *Check:* Did I address the math ($\eta \cdot g$ dominance)? Yes.

  8.  (Mental Draft of the "Fiction" argument): The idea is that if I prefer an apple today to an apple tomorrow, it's not because time is magic. It's because I might die (risk), the apple might rot (depreciation), or I might be hungrier today (consumption smoothing). If we account for all that, $\delta$ disappears. The Ramsey rule treats the residual as "impatience," but it's really just model error or omitted variables.

  9.  (Mental Draft of the $\eta$ argument): $\eta$ determines how we weigh a dollar for a poor person vs. a rich person. If we assume future gens are rich, $\eta$ tells us to tax them (via less investment) to help the poor now. That's a massive ethical claim, far bigger than "do we like the future slightly less?"

  10. **Constructing the Response.** (Proceed to generate output based on these thoughts).
answer: |-
  You have hit on one of the most significant, yet under-discussed, asymmetries in climate economics. Your intuition is correct: the fixation on the pure rate of time preference ($\delta$) is disproportionate to its quantitative impact, while the parameters that actually drive the discount rate ($\eta$ and $g$) are treated as technical afterthoughts despite carrying the heavy ethical lifting.

  Here is an argument you can use with your colleague to shift the debate from the "moral parameter" ($\delta$) to the "distributional mechanics" ($\eta \cdot g$), and to challenge the ontological status of pure time preference itself.

  ### 1. The Arithmetic of Neglect: $\delta$ is a Rounding Error
  The first point is empirical. In the standard Ramsey framework ($r = \delta + \eta \cdot g$), the term $\eta \cdot g$ (the wealth effect) almost always dwarfs $\delta$.

  Consider the standard calibrations in the literature:
  *   **The Stern Review:** $\delta = 0.1\%$, $\eta = 1$, $g \approx 2\%$. Here, $\eta \cdot g = 2\%$. The wealth effect is **20 times larger** than pure time preference.
  *   **Nordhaus (DICE):** $\delta \approx 1\%$, $\eta \approx 2$, $g \approx 2\%$. Here, $\eta \cdot g = 4\%$. The wealth effect is **4 times larger** than pure time preference.

  Even in high-discount scenarios, the bulk of the discount rate comes from the assumption that future people will be richer ($g$) and that marginal utility declines ($\eta$). By focusing the ethical debate on $\delta$, economists are arguing over the tip while ignoring the bill. If you want to change the social discount rate meaningfully, you don't tweak $\delta$ from 0.1% to 1%; you debate whether $g$ will actually be 2% or whether $\eta$ should be 1 or 3.

  ### 2. $\eta$ is the True Parameter of Intergenerational Equity
  The elasticity of marginal utility ($\eta$) is often masquerading as a technical measure of risk aversion or consumption smoothing, but it is actually the primary lever of distributive justice between generations.

  *   **High $\eta$:** Implies a strong aversion to inequality. If we assume future generations will be richer ($g > 0$), a high $\eta$ says their marginal utility is *much* lower than ours. Therefore, it is ethically wrong to sacrifice significant consumption today to help them. They don't need it as much as we do.
  *   **Low $\eta$:** Implies we view consumption across generations as closer to perfect substitutes. Even if they are richer, a unit of utility is valued similarly. This mandates higher savings/investment today.

  The ethical question hidden in $\eta$ is: **"How much does being richer immunize future generations from our moral obligations?"**

  This is a far more profound ethical question than $\delta$. $\delta$ asks, "Do we care less about them simply because they exist later?" (Which most agree is discriminatory). $\eta$ asks, "Does their projected wealth justify our current inaction?" That is a substantive claim about justice, not just time. Yet, $\eta$ is often calibrated to match market interest rates, effectively outsourcing intergenerational ethics to current capital market imperfections.

  ### 3. The Fiction of "Pure" Time Preference
  Your colleague mentioned the "fiction" of pure time preference, and this is where the philosophical heavy lifting lies. The Ramsey rule treats $\delta$ as a primitive preference—a fundamental axiom of human psychology or ethics. But as you suspect, "pure" discounting is likely a phantom variable that absorbs model errors.

  **The "Impure" Reality:**
  In the real world, no rational agent discounts a future good *purely* because it is in the future. If I prefer an apple today to an apple next year, it is for "impure" reasons:
  1.  **Existence Risk:** I might be dead (mortality).
  2.  **Counterparty Risk:** The promise of the apple might not be kept (institutional decay).
  3.  **Saturation:** I might have so many apples next year that one more matters less (this is $\eta \cdot g$, not $\delta$).
  4.  **Opportunity Cost:** I could invest the resources today to get two apples tomorrow.

  If you explicitly model mortality risk, probability of extinction, and institutional stability, the residual "pure" rate of time preference ($\delta$) should theoretically collapse to zero. Frank Ramsey himself called $\delta$ "ethically indefensible and aris[ing] merely from the weakness of the imagination."

  By keeping $\delta$ in the equation, we are baking in a "myopia parameter" and calling it ethics. We are allowing the model to say, "We value the future less because it is the future," when what we really mean is, "We value the future less because we are uncertain it will exist or that our investments will survive." Those are risks ($p$), not time preferences ($\delta$). Conflating them allows policymakers to justify inaction using "impatience" when they really mean "uncertainty."

  ### 4. The Growth Rate ($g$) is a Moral Gamble
  The most dangerous ethical assumption in the Ramsey rule is not $\delta$, but $g$. The term $\eta \cdot g$ justifies discounting the future based on the presumption of **perpetual economic growth**.

  To apply a discount rate derived from $\eta \cdot g$ is to assert: *"Future generations will be significantly wealthier than we are."*
  In the context of climate change, this is a circular argument. If climate damages are severe, $g$ could plummet or turn negative. If $g$ falls, the discount rate falls, which implies we should invest *more* in mitigation. But standard models assume exogenous $g$ to calculate the discount rate used to evaluate the mitigation.

  By treating $g$ as an input rather than an outcome, we are ethically betting on the resilience of the economy against the very shock we are evaluating. If we are wrong about $g$, the $\eta \cdot g$ term justifies under-investment based on a false premise of future abundance. This is not a technical assumption; it is a moral gamble on the survival of economic productivity.

  ### 5. Conclusion: Reframing the Debate
  The fixation on $\delta$ is a distraction. It allows economists to have a heated moral debate about "impatience" (which is easily dismissed as discriminatory) while leaving the actual drivers of discounting ($\eta$ and $g$) sheltered as "technical parameters."

  To argue for a more honest climate economics, you should propose:
  1.  **Set $\delta = 0$:** Follow Ramsey and Stern. Pure time preference is ethically indefensible discrimination against future dates.
  2.  **Make $\eta$ Explicit:** Acknowledge that $\eta$ is a parameter of inequality aversion. Debate it openly as a question of distributive justice, not risk aversion.
  3.  **Endogenize $g$:** Acknowledge that using projected growth to discount climate damages is circular if climate change destroys that growth.
  4.  **Decompose Discounting:** Replace the "pure" rate with explicit hazard rates (probability of extinction, institutional collapse). This moves the discussion from "how much do we care?" to "how likely is it that there will be anyone to care?"

  The "moral core" of the discount rate isn't the tiny $\delta$ term. It is the massive $\eta \cdot g$ term, which asserts that the future's wealth absolves the present of its duties. That is the ethical claim that deserves scrutiny.
