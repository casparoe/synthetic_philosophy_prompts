prompt: |-
  Hey — I need help building something. I run a tiny reading group that meets in the back of a board game cafe, and last week we did the butterfly bit near the end of the second chapter of the Zhuangzi (he falls asleep, dreams he's a butterfly happily fluttering around with no idea he's Zhou, wakes up, and then doesn't know whether he's Zhou who dreamt he was a butterfly or a butterfly now dreaming it's Zhou — and then there's something vaguely about a great awakening; I'm paraphrasing badly from memory and we had two different translations on the table). Half the group read it as basically Descartes with better prose, the other half insisted that's a flat misreading and the point is that the worry is meant to dissolve rather than bite, and we got nowhere. So for next session I want to hand out a flowchart instead of arguing: a decision tree that starts from something almost everyone grants (sometimes, while I'm in a dream, it feels exactly like waking life) and walks a person down to a named position, where every branch point is a concrete case they can answer without already knowing what the positions are called.

  Two things I want the tree to genuinely separate, because I think our fight came from running them together. Call them state-doubt and subject-doubt. State-doubt is the famous boring one: which mode am I in right now, waking or dreaming? Subject-doubt is the Zhuangzi-shaped one: which of the things in the story am I — the man or the butterfly — given that the experience doesn't feel interrupted at the switch, and given that on the story's own terms the butterfly's fluttering around isn't presented as a degraded or lesser grade of reality. A taxonomy that only routes state-doubt will just re-derive the Meditations and never land anywhere interesting, so I want at least two branch nodes that only bite on the subject-doubt axis.

  Cases I definately want used, several of which I made up: (1) the audit dream — inside the dream you run every test you know, reading a line of text twice to see whether it stays put, counting fingers, checking that your memories reach back continuously, and every test returns a pass, because the dream also supplies a fake memory of your having already run and trusted that test before; (2) the dream containing your entire philosophical education — inside it you know all about dream skepticism and reason correctly that unreliable states typically fail coherence checks, you just get a false verdict on this occasion; (3) the shared dream, where two people independently report the same dream with matching details neither was told; (4) a lucid dream in which you know perfectly well you're dreaming and still can't tell what's outside; (5) the morning-after case, where during the dream you had no doubts whatsoever and only on waking do you reclassify it — so the question becomes whether the worry was ever about knowing at the time or only about being able to tell later; (6) someone working validly through a bit of arithmetic while asleep, to test whether any kind of knowledge survives.

  Leaves: named leaves for radical/Cartesian dream skepticism, mitigated or therapeutic skepticism, the Moorean or externalist move that the bare possibility doesn't touch my knowledge here, relevant-alternatives contextualism, the Zhuangzian transformation-of-things reading where the payoff is the dissolution of the distinction rather than a verdict, a Buddhist or Schopenhauer-style illusionism about the dream-like character of experience, and a deflationary quietist no-fact-of-the-matter view. Plus at least two unoccupied leaves: combinations of answers your tree permits that nobody actually defends, each with one sentence on whether the slot is empty because the view is incoherent, unattractive, or merely unexplored. And flag any pair of leaves your tree can't really pull apart instead of inventing a node to fake a separation — I suspect the therapeutic Zhuangzian and the quietist will collide, and maybe the Moorean and the externalist too.

  Give it back as a single JSON object, no prose around it, with these fields: "nodes" — array of objects with "id", "question" (the case, phrased so a newcomer can answer it), "answers" (an object mapping each allowed answer to the next node id or to a leaf id), and "axis" (one of state-doubt, subject-doubt, both); "leaves" — array of objects with "id", "position_name" (or "unnamed"), "one_line_summary", "awkwardest_commitment", "defended" (true or false), and "why_empty" when false; "unoccupied_paths" — array of objects with "answer_pattern" and "why_empty"; "indistinguishable_pairs" — array of objects with "pair" (two leaf ids) and "what_would_actually_separate_them"; "facilitator_notes" — five to eight strings on where my group is most likely to cheat by answering with the label they already like. Eight to ten questions total, and keep each question under two sentences.
