  7.  **Final Polish:** Check the "in the weeds" requirement. Ensure terms like "predictive processing," "substrate," "epistemic privilege," "heterophenomenology," and "levels of abstraction" are used correctly. Ensure the distinction between the *content* of the report and the *act* of reporting is clear.

      *(Self-Correction during drafting)*: Make sure I don't just summarize. I need to evaluate *truth* at each step.
      *   Move 1: Maya is half-right (model is constructed) but wrong (report is *just* a log).
