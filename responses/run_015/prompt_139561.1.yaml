answer: |-
  ### What I think you're pointing at

  You are pointing at **totality facts**. These are meta-ontological constraints that fix the *extent* of a domain without describing its internal content. They function as closure conditions on grounding chains, ensuring the base is not merely sufficient for what exists, but exhaustive. Unlike standard negative existentials, they attach to the *collection* itself, ruling out "junk" elements that would otherwise be consistent with the positive facts. They are the metaphysical period at the end of the ontological sentence, distinguishing a world where *only* these things exist from a world where these things exist *plus others*.

  ### Candidates and where each falls short

  I considered four labels before settling. 

  1.  **Totality Facts (Armstrong):** This is the strongest match. Armstrong explicitly posits facts that say "these are all the first-order facts." *Shortfall:* Armstrong treats these as brute contingencies. You intuit they *depend* on the base collectively, which requires a modified view.
  2.  **Negative Existentials:** "There are no unicorns." This fits your "adding breaks it" test. *Shortfall:* Your intuition distinguishes local absence from global completeness. A world with no unicorns isn't necessarily a "complete" world. Totality facts are global negative existentials over categories, constraining the *domain* of quantification itself.
  3.  **Essence/Constitutive Rules (Fine):** Fits the number case ("nothing else is a number"). *Shortfall:* Works for math, less clear for contingent mosaic. Essence is usually internal; totality is external boundary-setting. Essence explains *what* a thing is; totality explains *how many* things there are. I discard this for general ontology.
  4.  **Second-Order Facts:** Facts about facts. *Shortfall:* Too broad. "Fact A grounds Fact B" is second-order but doesn't restrict extension. Totality facts are a specific subset concerned with *exhaustion*. Being about a collection isn't enough; it must be about the collection's *completeness*. I discard this as too imprecise.

  ### One thing or two

  Are "nothing below" (fundamentality) and "everything accounted for" (derivation) distinct? They are duals. "Only these are fundamental" is logically equivalent to "All non-fundamentals are grounded in these." Both impose a closure condition on the grounding relation. The direction of fit differs (upward vs. downward), but the logical shape—restricting the relata of the grounding relation—is identical.

  Is there a top-level equivalent? Yes. A "maximality fact" stating nothing is grounded *in* the fundamental base. It shares the shape: a constraint on relational extension. It says the chain stops here, not because nothing *could* follow, but because nothing *does*. This confirms the phenomenon is about boundary-setting, not level-specific content. It suggests a symmetry: just as the bottom needs a floor, the top needs a ceiling. Both are totality conditions on the grounding relation's domain and range, confirming this is a single structural phenomenon appearing at different limits.

  ### Your test, stress-tested

  Your test holds up under stress. "There are no unicorns" passes: tweaking a horse doesn't break it; adding a unicorn does. So your phenomenon *is* a species of negative existential. The distinction you feel is scope. "No unicorns" is local (about a kind); "That's-all" is global (about the domain). Your intuition correctly identifies that global negative existentials play a unique structural role in metaphysics, distinguishing them from mundane absences. They aren't just "more nothing"; they are the "shape of the nothing" that bounds the something. The worry that it's "just negative existentials" is correct, but trivializing. It's like saying "logic is just syntax." The structural role matters more than the logical category.

  ### The name I'd use, defined, with two boundary cases

  **Name:** **Totality Fact** (Standard Term).
  *Note: I am not coining a new term because this is established in literature (Armstrong, Molnar), but I am refining its dependence profile.*

  **Definition:** A fact that obtains in virtue of a base set obtaining plus the condition that no other facts of that type obtain. It is a dependent negative existential over a domain.

  **Boundary Inside:** "These are all the fundamental particles." (Depends on the particles existing + the exhaustion condition).
  **Boundary Outside:** "Electrons have negative charge." (Positive fact about a member, doesn't restrict domain extent).
  The inside case changes truth value if you add a new particle type; the outside case does not. This isolates the "that's-all" component from the positive base content.

  ### Where I'd expect to be corrected

  **Confidence:** I am fairly sure "Totality Fact" is the standard term. However, my claim that they are *dependent* (rather than brute) is contentious.

  **Correction:** Deflationists will argue this is just logical quantification ($\forall x$), not a distinct metaphysical fact. Grounding purists might argue it's a rule of inference, not a fact in the world. I expect pushback on whether these facts *exist* or are merely linguistic conveniences. My claim that they are dependent is the most vulnerable point; many treat them as brute to avoid regress (if the totality fact needs grounding, does it need a totality fact to ground *it*?). If you accept grounding pluralism, the "that's-all" might vary by region, complicating the global totality view. I would change my mind if a non-circular grounding story for totality facts proved impossible.
