answer: |-
  You have asked for a structural audit of epistemicism, specifically targeting the pressure points that remain even after one has swallowed the initial paradox of sharp boundaries. You want to know where the view is exposed, ranked by severity, without recourse to the standard "incredulous stare."

  Here is the map of the exposure, ranked from the most threatening (potentially fatal) to the merely costly (awkward but survivable).

  ### 1. The Idle Fact Problem (Absence of Inquiry + Insulation)
  **Severity: Potentially Fatal**

  This is the pressure point you identified, and structurally, it is the most dangerous. It is not merely an intuition pump; it is a challenge to the explanatory role of the "truth" posited by epistemicism.

  In standard cases of ignorance (e.g., the number of grains in a jar), the fact is causally connected to the world in a way that permits inquiry. We can measure, count, or defer. The ignorance is contingent. In epistemicism, the ignorance is *constitutive*. The margin-for-error principle entails that the boundary *cannot* be known, not because of technological limits, but because knowing it would violate the safety condition required for knowledge given the stability of meaning.

  **The Exposure:**
  If a fact is in-principle unknowable, and if no possible evidence could bear on it (since any evidence sufficient to locate the boundary would shift the boundary or fail the safety condition), then the fact is causally and epistemically inert. It does no work in the explanation of our linguistic behavior, our successful communication, or our reasoning.

  Your worry about **stipulation** cuts deep here. If a group stipulates a cutoff (e.g., "From now on, 500 grains is the minimum for a heap") and this feels like a *decision* rather than a *discovery*, it suggests the prior concept lacked a determinate extension. Epistemicism insists the extension was already determinate. But if the stipulation does not conflict with the prior fact (because we can't know the prior fact), and if the stipulation functions perfectly well without reference to the prior fact, then the prior fact is an idle wheel.

  **Why this is more than the "Incredulous Stare":**
  The stare says, "It's crazy that there's a sharp line." The Idle Fact argument says, "A fact that makes no difference to inquiry, practice, or explanation is not a fact in any robust sense." If the truth of borderline claims is insulated from all possible verification *by the very theory that posits it*, the view risks collapsing into a form of fictionalism or error theory where we merely *pretend* bivalence holds to save classical logic.

  **Verdict:** If you cannot explain what work the sharp boundary does other than satisfying the law of excluded middle, this is fatal. It renders the metaphysics otiose.

  ### 2. The Determination Gap (Semantic Externalism)
  **Severity: Severe**

  Epistemicism relies heavily on semantic externalism to fix the boundary. The boundary is not in our heads; it is fixed by the complex pattern of our usage and the environment. In standard externalism (e.g., "water"), the environment provides a "joint" (H₂O) that constrains reference.

  **The Exposure:**
  With vague predicates, there is no natural joint. The underlying dimension (height, grain count, wavelength) is continuous, and our usage is tolerant. The supervenience base for the meaning of "heap" is a messy cloud of dispositions to assent/dissent. For epistemicism to hold, this messy cloud must magically select *one* specific integer as the cutoff rather than its neighbor.

  Unlike "water," where the microstructure explains the selection, here there is no mechanism. The view requires **brute semantic facts**. It demands that you accept that two worlds could be identical in all physical and behavioral respects regarding the use of "heap," yet differ in where the sharp boundary lies (or, more weakly, that the boundary is fixed by facts that do not discriminate between nearby candidates in any principled way).

  **Verdict:** This is not logically inconsistent, but it is metaphysically profligate. It requires a supervenience failure or a brute necessity that many find unacceptable. It is severe because it isolates vagueness from the rest of semantic theory, where reference is usually constrained by eligibility or causal history.

  ### 3. Contextual Collapse (Empirical Profile)
  **Severity: Moderate**

  You noted that speaker judgment shifts with context, stakes, and comparison class. Epistemicism can accommodate this by claiming the *boundary moves* with context (contextualist epistemicism).

  **The Exposure:**
  If the boundary moves to accommodate every shift in intuitive application, the "sharpness" of the boundary becomes trivial. If the boundary of "tall" shifts exactly where our intuitions about "tall" become shaky, then positing a sharp boundary at that location explains nothing. It merely maps the contour of our uncertainty onto a contour of shifting facts.

  Furthermore, if speakers do not treat one another as making mistakes in borderline cases, but epistemicism says one *is* mistaken (since one says True and the other False), the view posits a massive, systematic error in our metalinguistic judgments. We think we are disagreeing about standards; epistemicism says we are disagreeing about facts we cannot know.

  **Verdict:** This threatens to collapse epistemicism into contextualism. If the only difference is that contextualism says "no truth value relative to context C" and epistemicism says "unknown truth value relative to context C," and the boundary moves with C, the theoretical gain is minimal. The view survives, but its distinctiveness blurs.

  ### 4. The Skeptical Cost (Margin-for-Error Overgeneralization)
  **Severity: Awkward (Manageable)**

  The margin-for-error principle ($Kp \to p$ is safe) is the engine of epistemicism. But this engine is powerful. It applies to perceptual knowledge and memory as well as semantic knowledge.

  **The Exposure:**
  If I know a patch is red, there must be a nearby world where it is slightly different and I still judge it red. This implies I cannot know the precise boundary of my own perceptual discrimination. Williamson accepts this: we know less than we think.

  **Verdict:** This is a cost, not a defeater. It is a bullet that must be bitten. It is awkward because it forces a skepticism about ordinary empirical claims that rivals (like supervaluationism) avoid. However, it is internally consistent. If you are already committed to the margin-for-error principle for vagueness, you should expect it to apply elsewhere. This is a feature, not a bug, provided you can live with the skepticism.

  ### 5. Higher-Order Hierarchy (The Nesting Problem)
  **Severity: Low (Merely Weird)**

  Epistemicism handles higher-order vagueness by iterating the sharp boundaries. There is a boundary between $F$ and not-$F$, and a boundary between "definitely $F$" and not-"definitely $F$".

  **The Exposure:**
  This generates an infinite hierarchy of sharp boundaries. The location of the second-order boundary is even more unknowable than the first.

  **Verdict:** This is merely counterintuitive, not structurally damaging. It looks like a coincidence that these boundaries nest so neatly, but the logic of the "definitely" operator forces it. It adds complexity, but it does not threaten the coherence of the view.

  ---

  ### Honest Verdict on Insulation

  You asked if the central claim has been qualified into something no observation could touch. **Yes, it has.**

  The unknowability of the boundary is not an empirical discovery; it is a theorem derived from the margin-for-error principle combined with the assumption of meaning stability. The view is insulated from empirical refutation because any evidence you gather to locate the boundary is ruled out *by definition* of what knowledge requires in that domain.

  **Is this fatal?**
  It depends on your philosophy of science/metaphysics.
  *   **If you require abductive strength:** It is fatal. A theory that posits entities (sharp boundaries) that are in-principle undetectable and do no explanatory work other than saving a logical law (bivalence) is theoretically vicious. It is a "just-so" story.
  *   **If you prioritize logical conservation:** It is the price of admission. If you value classical logic and bivalence above all else, and you reject truth-value gaps, this insulation is the necessary cost.

  ### Final Ranking & Advice

  1.  **The Idle Fact Problem (Fatal/Severe):** The absence of inquiry apparatus suggests the "fact" is not a fact at all. This is your strongest lever. If you cannot articulate what *difference* the sharp boundary makes to anything other than the truth-table of 'or', the view is metaphysically empty.
  2.  **The Determination Gap (Severe):** The lack of a mechanism for boundary fixation makes the view metaphysically mysterious compared to standard externalism.
  3.  **Contextual Collapse (Moderate):** Risks making the view indistinguishable from contextualism in practice.
  4.  **Skepticism (Awkward):** A high price, but consistent.
  5.  **Hierarchy (Low):** Merely complex.

  **On your primary worry (Absence of Inquiry):**
  This is **not** the incredulous stare in better clothing. The stare is an intuition about the world (there are no sharp heaps). The inquiry objection is a structural point about the *nature of truth and knowledge*. If truth is supposed to be the aim of assertion, and the aim is in-principle unaimable-at in borderline cases, then the norm of assertion breaks down in precisely the region where we use the terms most.

  To defend the view, you must argue that the *function* of truth is not to guide inquiry in all cases, but to preserve logical validity. You must concede that in borderline regions, the "fact" is a logical placeholder rather than a worldly anchor. If you are willing to treat the sharp boundary as a **logical posit** rather than a **semantic discovery**, the view holds. If you insist it is a genuine semantic fact about the world, the absence of inquiry is a defeater.
