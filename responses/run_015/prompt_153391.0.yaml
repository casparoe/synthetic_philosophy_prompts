      *   *Critique:* The prompt asks for "Ordered questions... with stopping rules."
      *   *Fix:* Make it a flowchart style text.
      *   *Critique:* Need to ensure the "Small Contribution" argument is addressed philosophically.
      *   *Fix:* Explain that cluelessness applies to *direction*, not just scale. Small negative is still negative.
      *   *Critique:* Worked Example A needs to be honest (likely rejected or heavily modified).
      *   *Fix:* Show it failing the "Evidence of Sign" check unless they commit to evaluation.
      *   *Critique:* Epistemics section needs to be specific.
      *   *Fix:* Rate confidence per step. Identify the "Scenario Count" as the weakest link.

  5.  **Final Polish:**

      *   Ensure the tone is empathetic but rigorous.
      *   Check all constraints from the prompt are met (visible discarded options, specific sections, no citations).
      *   Make sure the distinction between magnitude and sign uncertainty is woven into the questions, not just defined.
      *   Ensure the "procedure's own effects" are placed logically (I'll put it as a "Meta-Constraint" at the end of the procedure).

  6.  **Writing the Response:** (Mental outline of the sections)
      *   Introduction & Brainstorming (The 3 approaches).
      *   The Chosen Procedure: "The Robustness Protocol."
      *   Section 1: The Distinction (Sign vs. Magnitude).
      *   Section 2: The Questions (Flowchart).
