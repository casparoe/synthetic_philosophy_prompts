      *   Section 6: Unit of Evaluation (Portfolio).
      *   Section 7: Worked Applications (A, B, C).
      *   Section 8: Limitations & Voting.
      *   Section 9: Meta-Effects (Procedure's Impact).
      *   Section 10: Epistemics.

      *(Self-Correction during drafting the Epistemics)*: Make sure I don't just say "I'm confident." Explain *why* (e.g., "based on decision theory literature on robustness").
      *(Self-Correction on Worked Examples)*: Ensure A gets the hard truth. If it's unmeasured for 6 years, it fails the "Learning" criterion.

      *(Final Check)*: Did I include the "discarded options visible" requirement? Yes, in the intro. Did I explain named views without citations? Yes (e.g., explaining "robustness" without citing Buchanan or Lempert).

      *Let's write.*
answer: |-
  ### Part 1: Brainstorming Operationalizations

  Before giving you the procedure, I need to show my work on how to translate "consequentialist cluelessness" (the philosophical worry that we can't know long-term outcomes) into a high school meeting agenda. Here are three candidates I considered, why I rejected two, and why I chose the third.

  **Candidate 1: The "Proxy Metric" Approach**
  *   **Idea:** We cannot measure long-term good, so we agree on short-term proxies (e.g., "hours tutored" or "meals served") and maximize those.
  *   **Failure Mode:** This invites "Goodhart's Law." Once a measure becomes a target, it ceases to be a good measure. Students will optimize for hours logged rather than learning achieved. It also fails to address *sign* uncertainty. If a program creates dependency or stigma, logging more hours just amplifies the harm. It gives a false sense of precision.

  **Candidate 2: The "Precautionary Principle" Approach**
  *   **Idea:** If we cannot determine the net outcome is positive, we default to inaction to avoid harm.
  *   **Failure Mode:** Paralysis. In a service context, "doing nothing" is not a neutral baseline; it is an active choice to let existing problems persist. This approach treats the status quo as safe, which is rarely true. It also privileges the comfort of the committee over the potential needs of the community.

  **Candidate 3: The "Robustness and Sign" Approach (Selected)**
  *   **Idea:** We distinguish between not knowing *how much* good we do (magnitude) and not knowing *if* we do good (sign). We reject proposals where the sign is deeply uncertain unless they offer high learning value. We select proposals that look acceptable across multiple plausible future scenarios, rather than optimizing for one best guess.
  *   **Why Strongest:** It matches your specific deadlock. Your committee argues because some members are worried about magnitude ("Is $4,000 enough?") while others are worried about sign ("Does this actually help?"). This procedure forces those apart. It also respects your time limit by capping the scenario analysis.

  ---

  ### Part 2: The Robustness Protocol

  This is the procedure you will run. It is designed for a 50-minute meeting. It requires a whiteboard or shared document visible to all six members.

  #### I. The Core Distinction: Sign vs. Magnitude
  You are correct that conflating these is the source of your circular arguing. We will enforce this distinction explicitly.
  *   **Magnitude Uncertainty:** We agree the action helps, but we don't know by how much (e.g., "Tutoring helps, but will it raise grades by 5% or 20%?").
  *   **Sign Uncertainty:** We do not know if the action helps or hurts overall (e.g., "Does free food reduce hunger, or does it undermine local grocery economies and create dependency?").
  *   **Rule:** Magnitude uncertainty is acceptable. Sign uncertainty is a red flag that requires specific mitigation (see Section IV).

  #### II. Ordered Questions & Stopping Rules
  Ask these questions in order for every proposal. Do not move to the next until the current one is resolved.

  **Q1: Is the mechanism of action plausible?**
  *   *Ask:* "If this works, what is the direct chain of events from our money/time to the benefit?"
  *   *Sufficient Answer:* A chain of no more than four links (e.g., Money $\to$ Food $\to$ Meal Eaten $\to$ Hunger Reduced).
  *   *Send Back:* If the chain requires "magic" steps (e.g., "We give money, then somehow systemic racism decreases").
  *   *No:* If the chain is logically incoherent.

  **Q2: What is the Sign Confidence?**
  *   *Ask:* "Looking at the chain from Q1, is there any link where the effect could plausibly be negative?"
  *   *Sufficient Answer:* "No, the link is robust" OR "Yes, but we have a plan to monitor it."
  *   *Send Back:* If the group identifies a plausible negative pathway (Sign Uncertainty) and the proposal offers no way to detect or limit it.
  *   *No:* If the plausible negative pathway is severe (e.g., physical danger, legal liability) and cannot be mitigated.

  **Q3: What is the Magnitude Estimate?**
  *   *Ask:* "Don't give me a dollar figure. Give me a range: Low, Medium, or High impact relative to our budget."
  *   *Sufficient Answer:* Consensus on a range (e.g., "Medium-High").
  *   *Send Back:* If members are arguing between "Low" and "High" without new data. (This stops magnitude bickering).
  *   *No:* If consensus is "Negligible."

  **Q4: The Learning Dividend**
  *   *Ask:* "If we fund this, will we know more next semester than we do now?"
  *   *Sufficient Answer:* "Yes, we will collect X data" OR "Yes, the pilot nature tells us feasibility."
  *   *Send Back:* If the answer is "No, we'll just do the same thing." (This addresses the 6-year unmeasured problem).
  *   *No:* If the project is "Zombie" status (running forever with no evaluation and low confidence).

  #### III. Handling Non-Numerical Data
  You asked what to do when you cannot get a number. The honest answer is: **You substitute a judgment call, but you must label it.**
  *   **Instruction:** When Q3 (Magnitude) asks for Low/Medium/High, this is a qualitative judgment disguised as a metric. That is acceptable. However, the minute taker must record *why* the group chose "Medium." (e.g., "Chosen because similar programs in neighboring districts reported X").
  *   **Why:** This prevents "false precision." It admits you are guessing, but forces the guess to be explicit and recorded for next semester's review.

  #### IV. Comparing Sign-Uncertain Proposals (The Scenario Rule)
  When Q2 reveals Sign Uncertainty (we don't know if it's net good or bad), do not try to calculate an expected value. Use the **Three-Scenario Test**.
  *   **The Rule:** Write down exactly three scenarios:
      1.  **Best Plausible:** Everything goes right, within reason.
      2.  **Worst Plausible:** Everything goes wrong, within reason (no apocalypses).
      3.  **Stuck:** The status quo persists despite effort.
  *   **How Many:** Exactly three. More than three becomes theater; fewer than three hides risk.
  *   **Where from:** Scenarios must come from *past experience* or *external analogues*, not imagination. If you can't name a real-world example for the "Worst" case, it doesn't count.
  *   **Decision:**
      *   If Best is Good and Worst is Acceptable $\to$ **Fund.**
      *   If Best is Good and Worst is Catastrophic $\to$ **Reject** (unless you can insure against the worst).
      *   If Best and Worst straddle zero (one is good, one is bad) $\to$ **Fund only if** it scores high on Q4 (Learning Dividend). You are buying information, not outcomes.

  #### V. Rulings on Tempting Escapes

  **1. The "Small Contribution" Escape**
  *   *Claim:* "We are only spending $4,000; it can't matter much, so we should just do what feels good."
  *   *Ruling:* **Rejected.** Smallness solves Magnitude Uncertainty (the stakes are low), but it does *not* solve Sign Uncertainty. A small harm is still a harm. Furthermore, if you repeat a small harm every semester for six years, it becomes a large harm.
  *   *Procedure Treatment:* If a proposal is "Small," you may relax Q3 (Magnitude). You may *not* relax Q2 (Sign).

  **2. The "Safe Default" Escape**
  *   *Claim:* "Declining to fund is safe because doing nothing has no consequences."
  *   *Ruling:* **Rejected.** The status quo is not a neutral baseline; it is a trajectory. If a food pantry is distribution-constrained, not funding them has the consequence of unmet hunger.
  *   *Procedure Treatment:* Treat "Do Nothing" as a competing proposal. It must pass Q1 (Plausible Mechanism). Usually, "Do Nothing" fails Q4 (Learning Dividend) because it generates no new information.

  #### VI. Unit of Evaluation: The Portfolio
  *   *Ruling:* Evaluate proposals individually for **Sign (Q2)**, but evaluate the semester's allocation as a **Bundle for Magnitude (Q3)**.
  *   *Why:* You want a portfolio where risks cancel out. If Proposal X is high-risk/high-reward and Proposal Y is low-risk/low-reward, funding both is safer than funding two X's.
  *   *Cancellation:* Do not assume effects cancel mathematically (e.g., "One harm offsets one good"). Assume they stack. The goal is to ensure no single proposal in the bundle has a "Catastrophic" Worst Case.

  #### VII. Worked Applications

  Here is how the protocol runs on your three specific cases.

  **Application A: Homework Heroes (Tutoring)**
  *   *Q1 (Mechanism):* Money $\to$ Materials $\to$ Tutoring $\to$ Grades/Life Outcomes. **Pass.**
  *   *Q2 (Sign):* Is it possible tutoring creates dependency or stigmatizes students? Plausible. But after 6 years, if no harm reported, Sign Confidence is **Medium-High**. **Pass.**
  *   *Q3 (Magnitude):* Unmeasured for 6 years. Group cannot agree on Low vs. High. **Fail.**
  *   *Q4 (Learning):* "Will we know more next semester?" Current plan: No. **Fail.**
  *   *Exit:* **Send Back for Revision.**
  *   *Reasoning:* You suspected this would fail. It fails not because tutoring is bad, but because it is a "Zombie" project. To pass, the proposal must include a plan to measure outcomes (e.g., pre/post surveys of tutees) this semester. If they refuse to measure, the procedure dictates defunding to break the cycle of cluelessness.

  **Application B: Food Pantry (Full Budget)**
  *   *Q1 (Mechanism):* Money $\to$ Food $\to$ Meals. **Pass.**
  *   *Q2 (Sign):* Hunger is bad, food is good. Sign Uncertainty is **Low**. **Pass.**
  *   *Q3 (Magnitude):* They are distribution-constrained. Money directly equals food. Magnitude is **High**. **Pass.**
  *   *Q4 (Learning):* We will know exactly how many meals were bought. **Pass.**
  *   *Exit:* **Strong Candidate for Funding.**
  *   *Caveat:* Putting the *entire* budget in one basket violates the Portfolio rule (VI). It creates single-point failure risk. The procedure suggests funding this at a high level, but reserving 20% for other projects to maintain diversity.

  **Application C: Start Times Campaign**
  *   *Q1 (Mechanism):* Pressure $\to$ District Policy $\to$ Sleep $\to$ Health. **Pass.**
  *   *Q2 (Sign):* Political backlash could harm student council credibility or distract from other work. Sign Uncertainty is **High**. **Flag.**
  *   *Q3 (Magnitude):* Cheap cost, potentially huge impact. **Pass.**
  *   *Q4 (Learning):* Even if it fails, we learn about district politics. **Pass.**
  *   *Scenario Test (IV):*
      *   Best: Policy changes, health improves.
      *   Worst: Council alienates administration, future proposals blocked.
      *   Stuck: No change.
  *   *Exit:* **Fund conditionally.**
  *   *Reasoning:* Because the "Worst" case is political capital (not physical harm), and Q4 (Learning) is high, this is a valid "Information Buying" investment. Cap the volunteer slots to limit the "Worst" case exposure.

  #### VIII. Limitations & When to Vote
  This procedure cannot resolve disagreements about **values**.
  *   *Fact Disagreement:* "Will this reduce hunger?" (Procedure solves this via Scenarios).
  *   *Value Disagreement:* "Is reducing hunger more important than improving grades?" (Procedure cannot solve this).
  *   *The Handoff:* If you reach the end of the procedure with two proposals that both pass all checks, and you still disagree on which to fund, **stop the procedure and vote.**
  *   *How to tell the difference:* Ask, "If we had perfect data, would we still disagree?" If yes, it's values. Vote. If no, it's facts. Return to Q1.

  #### IX. The Procedure's Own Effects (Meta-Constraint)
  You asked where to put the impact of the procedure itself. It belongs as a **Closing Reflection**, not a step.
  *   *Instruction:* At the end of every meeting, spend 2 minutes asking: "Did following this script make us more cynical or more careful?"
  *   *Why:* Procedures shape character. If this script makes you so risk-averse that you stop trying new things, it has failed. If it makes you rigorous but paralyzed, it has failed.
  *   *Placement:* Outside the decision flow. It is a check on the tool, not a use of the tool.

  ---

  ### Part 3: Epistemics Section

  You asked for my confidence levels in the steps above, and where I might be wrong.

  *   **Confidence in Distinguishing Sign vs. Magnitude (High):** This is standard decision theory. Separating "how much" from "which way" almost always clarifies debate. I am confident this will reduce your meeting time spent on circular arguments.
  *   **Confidence in the "Zombie" Rule (Q4) (High):** Continuing unmeasured projects indefinitely is empirically correlated with waste in organizational behavior. Cutting off unmeasured projects forces adaptation.
  *   **Confidence in the Portfolio Approach (Medium-High):** Diversification reduces variance. However, in small budgets ($4,000), over-diversification can dilute impact. There is a tension here I am smoothing over.
  *   **Confidence in the Three-Scenario Test (Medium):** This is the step I am **least confident about**.
      *   *Why:* Three scenarios are arbitrary. It might give a false sense of security ("We thought of the worst case, so we are safe").
      *   *What would change my mind:* If you find that after two semesters, you are consistently surprised by outcomes that were not in your "Worst Plausible" scenario. If that happens, the scenarios are too narrow. You would need to switch to a "Pre-Mortem" method (assume the project failed, explain why) rather than scenario planning.
  *   **Confidence in Rejecting "Small Contribution" (High):** Philosophical consensus is that marginal impact matters. However, psychologically, telling students their $4,000 "matters a lot" can induce anxiety. If the committee becomes too stressed to function, the "smallness" heuristic might be a necessary psychological buffer, even if philosophically incorrect.

  **Final Note:** This procedure is not a truth machine. It is a conflict resolution tool that happens to be aligned with truth-seeking. It will not tell you the *right* answer, but it will tell you when you are guessing, and it will force you to record those guesses so you stop making the same ones next year.
