          *   Target Audience: 6 students (15-18), no stats/econ training, 50-min meeting, $4k budget, 30 volunteer slots/week, 12 projects.
          *   Requirements:
              *   Ordered questions with stopping rules.
              *   Distinction between magnitude uncertainty vs. sign uncertainty (good/bad).
              *   Instruction for when no numbers are available (admit judgment calls).
              *   Rule for comparing sign-uncertain proposals (robustness/senarios).
              *   Ruling on "small contribution" escape and "doing nothing is safe" default.
              *   Unit of evaluation (proposal vs. bundle).
              *   Three worked applications (Homework Heroes, Food Pantry, Start Times).
              *   Section on limitations (when to vote).
              *   Address procedure's own effects (meta-impact).
              *   Epistemics section (confidence per step, least confident step).
              *   No bibliography/citations (explain concepts in plain language).
      *   **Tone:** Professional, philosophical, practical, transparent about reasoning.

  2.  **Brainstorming Operationalizations of Consequentialist Cluelessness:**

      *   *Option 1: The "Precautionary Principle" Approach.* Focus on avoiding harm. If we don't know the sign, don't do it.
          *   *Failure Mode:* Paralysis. "Doing nothing" also has uncertain consequences (opportunity costs). In a service context, inaction is often a choice with negative utility.
      *   *Option 2: The "Proxy Metric" Approach.* Identify short-term proxies (e.g., hours tutored, meals served) and assume correlation with long-term good.
          *   *Failure Mode:* Goodhart's Law. Metrics get gamed, or the proxy disconnects from the actual value (e.g., tutoring hours $\neq$ improved life outcomes). Doesn't solve sign uncertainty.
      *   *Option 3: The "Robustness/Scenario" Approach.* Focus on options that look good across multiple plausible world-models rather than optimizing for one. Distinguish between "we don't know how much" (magnitude) and "we don't know if it helps" (sign).
          *   *Failure Mode:* Can become bureaucratic theater (writing too many scenarios). Requires discipline to keep scenarios distinct.
      *   *Selection:* Option 3 is strongest for this context. It addresses the specific deadlock (sign vs. magnitude) and fits the recurring nature of the committee (building a portfolio over time). It avoids paralysis while acknowledging ignorance.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to be a script or checklist they can use in the 50-minute meeting.
      *   *Distinction:* Explicitly separate "How much?" (Magnitude) from "Which way?" (Sign).
      *   *Handling No Numbers:* Use qualitative ranges (High/Med/Low) but admit it's a judgment call.
      *   *Sign Uncertainty Rule:* Use a "Three-Scenario Test" (Best Case, Worst Case, Most Likely). If Worst Case is catastrophic/unacceptable, reject. If Best Case is trivial, reject. If range spans zero (could be good or bad), look for robustness.
      *   *Small Contribution:* Reject the "it doesn't matter" argument. Marginal impact matters. But acknowledge that for *sign* uncertainty, smallness doesn't help (a small harm is still a harm).
      *   *Status Quo:* Reject "doing nothing is safe." The status quo is a baseline with its own uncertain trajectory.
      *   *Unit:* Bundle. Portfolio approach reduces risk.
      *   *Worked Examples:*
          *   A (Homework Heroes): High magnitude uncertainty, low sign uncertainty (likely good, but unproven). Risk: Dependency? Waste of time?
          *   B (Food Pantry): Low magnitude uncertainty (meals known), low sign uncertainty (hunger bad, food good). High robustness.
          *   C (Start Times): High magnitude, High sign uncertainty (could backfire politically).
      *   *Meta-Effects:* Include as a "Step 0" or closing reflection. It shapes character.
      *   *Epistemics:* Be honest about confidence levels.

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Is the "Three-Scenario Test" too complex for 50 minutes?
