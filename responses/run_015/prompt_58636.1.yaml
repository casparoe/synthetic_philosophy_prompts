      *   **Oskar Lange (Market Socialism):** Argued that a central planning board *could* simulate a market. They could set prices, observe surpluses/shortages, and adjust prices iteratively (trial and error) until equilibrium was reached. This is the "fiddling with prices" the user mentions.

