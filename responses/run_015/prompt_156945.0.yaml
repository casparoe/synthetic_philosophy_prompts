answer: |-
  First off: **You are not being a jerk.** You are recognizing a boundary violation, and your instinct is correct.

  Here is the breakdown of the philosophy, the ethics, and how to handle the conversation.

  ### 1. The Philosophy: "Supererogatory Acts"
  The specific ethical concept you are looking for is **Supererogation**.

  In moral philosophy, a *supererogatory* act is something that is good to do, praiseworthy, and "above and beyond," but **not morally required or obligatory.**
  *   **Duty:** Doing your assigned job during work hours.
  *   **Supererogatory:** Fixing a critical race condition on a Saturday voluntarily.

  The moment your manager *asks* you to repeat a supererogatory act, they are attempting to convert it into a **Duty**. If you agree, you have redefined your job description without compensation or negotiation. You are not obligated to live in a state of permanent supererogation.

  There is also a concept in organizational psychology called **Baseline Creep**. When exceptional behavior is rewarded with praise but not protected, it quietly becomes the new minimum standard. You are currently fighting off Baseline Creep.

  ### 2. Are you being a jerk?
  **No.** In fact, saying "yes" is arguably more dangerous for the team than saying "no."
  *   **Sustainability:** If you become the person who fixes unassigned deps on weekends, you become a single point of failure (Bus Factor).
  *   **Precedent:** If you do this, the manager will expect it from you *and* potentially other engineers.
  *   **Health:** Working weekends for non-critical, unassigned refactors is a burnout vector.

  ### 3. The Real Red Flag
  The praise from the team is fine. The **manager's request is the problem.**
  A good manager sees an engineer working on a Saturday to fix a dependency and thinks: *"Wow, they saved us. I need to make sure they rest this weekend so they don't burn out, and I need to figure out why this dependency is our problem during off-hours."*

  A manager asking you to "keep the momentum" with *another weekend task* is signaling that they view your personal time as a buffer for their planning gaps.

  ### 4. How to say "No" (without looking like you're slacking)
  You need to decouple "slacking" from "boundaries." You are not refusing to work; you are refusing to work *on weekends on unassigned tasks.*

  **Option A: The "Sustainability" Frame (Recommended)**
  > "I'm glad that fix helped the team! Regarding the refactor: I can't commit to weekend work for unassigned tasks. I took Saturday last week as a one-off to clear a blocker, but I need to keep my weekends for recharge to stay effective during the week. If this refactor is a priority, let's discuss fitting it into the sprint next week."

  **Option B: The "Process" Frame**
  > "I'm happy to help with that refactor, but I want to keep my weekends offline. If this is important enough to do now, can we assign it properly and prioritize it for Monday? I don't want to set a precedent where critical maintenance relies on voluntary weekend hours."

  **Option C: The Soft "No"**
  > "I won't be able to tackle that this weekend. I have some personal commitments I need to catch up on. Let's look at the backlog on Monday and see where it fits."

  ### Summary
  *   **Philosophy:** You performed a *Supererogatory* act. It cannot be mandated.
  *   **Ethics:** You are not a jerk. Protecting your time prevents burnout and sets healthy team norms.
  *   **Action:** Politely decline the weekend work. Offer to do it *during the week* if it is truly important.

  If the manager pushes back on you working Mon-Fri but insists on weekends for "extra" stuff, you have a culture problem, not a work-ethic problem. But for now, a firm "No, but I can do it Monday" is the professional standard.
