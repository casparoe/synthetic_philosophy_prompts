prompt: |-
  As a journalist covering science and philosophy, I am defending an unconventional reading of Wittgenstein's On Certainty in a university seminar next Thursday. The thesis is that hinge propositions are not merely static, non-propositional background conditions — the standard reading — but rather modular "load-bearing" epistemic structures that can be locally destabilized and reconstructed through collective practices of "epistemic maintenance," analogous to how structural engineers replace load-bearing walls without demolishing the building. I use this framework to resolve the tension between Wittgenstein's claim that hinges are immune to doubt and his observation that they shift over historical time, such as the transition away from geocentrism.

  The audience is precisely mixed: analytic epistemologists steeped in the standard hinge literature who will defend the non-propositional, background-condition reading; philosophers of science who think in terms of Kuhnian paradigms and incommensurability; and a cognitive scientist who studies belief revision and will ask whether I am merely redescribing Bayesian updating in architectural clothing. Draft my Q&A prep sheet: list the objections I will actually face, ordered by how damaging they are likely to be, not by logical sequence. For each objection, phrase it exactly as that faction would phrase it, then specify what I should concede, what I should hold, where my reply is weakest, and provide a concise reply suitable for about two minutes. Identify the one objection I am hoping nobody raises — specifically, the charge that my engineering analogy smuggles in illegitimate teleology, since buildings are designed but hinges are not, and therefore the analogy presupposes a designer for epistemic frameworks. Also include a strategic note on the single reply that must land if the proposal is to survive the session.

  End with a one-sentence summary on its own line beginning "Summary:".
