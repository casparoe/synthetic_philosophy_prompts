      *   **Constraint:** No bibliography/reading list. Focus on conceptual thinking.

  2.  **Deconstruct "Incommensurability" in this Context:**
      *   Standard view: Weigh good art vs. bad person. (Utilitarian calculus).
      *   Standard view 2: Art is art, person is person. (Compartmentalization).
      *   *Incommensurable* view: You cannot add them up. You cannot subtract one from the other. They exist in different dimensions but occupy the same space.
      *   *Implication:* If they are incommensurable, a "verdict" is impossible. You can't say "the art outweighs the crime" or "the crime cancels the art."
      *   *Result:* Tension becomes permanent. The institution cannot resolve the tension; it must *host* it.

  3.  **Address the "What Breaks?" Question:**
      *   *The Verdict Breaks:* Museums usually aim for authoritative narratives. Incommensurability denies a final judgment.
      *   *The "White Cube" Breaks:* The neutral space is compromised. The space becomes ethically charged.
      *   *The Viewer's Autonomy Breaks:* The viewer cannot simply "choose" to ignore the biography because the biography refracts the aesthetic experience.
      *   *The Artwork's Identity Breaks:* If the biography is part of the frame, the "work itself" is no longer a stable object. It's a relation between object, history, and harm.

  4.  **Develop the "Double Vision" Concept:**
      *   Curators can't synthesize (e.g., "This is great despite him").
      *   They must juxtapose without resolving.
      *   *Structural Implication:* Exhibition design must force the eye to move between the aesthetic object and the moral evidence without letting them merge into a single "lesson."
      *   *Risk:* Didacticism (turning art into evidence) vs. Aestheticization (turning harm into style). Incommensurability requires walking the tightrope where neither wins.

