prompt: |-
  I'm putting together a discussion for a small art-ethics reading group and we keep circling the same tired 'seperate the art from the artist' talking points. Please describe the most important implications of treating aesthetic merit and moral culpability as genuinely incommensurable values — not just seperate categories, but values with no shared scale — for how museums and curators should handle retrospective exhibitions when an artist's documented harm isn't hidden biographical trivia but becomes part of the public interpretive frame of the work itself. If you can't subtract the bad biography and still have the same artwork, but you also can't collapse the artwork into a moral ledger, what breaks?

  I'm especially interested in whether incommensurability forces curators into a kind of 'double vision' where they must present the work and its moral shadow side-by-side without synthesizing them, and whether moral knowledge about the artist acts less like a footnote and more like a refractive medium that changes what viewers actually percieve. Don't just rehash the standard autonomist-versus-moralist debate; I want the structural implications for artistic value, institutional responsibility, and the viewer's position. And please don't give me a bibliography or reading list — I'm working without access to one right now and need to think it through from the concepts themselves.
