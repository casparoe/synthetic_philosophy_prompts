answer: |-
  If we accept the premise that aesthetic merit and moral culpability are *incommensurable*—meaning they operate on different axes that cannot be mathematically balanced, traded, or reduced to a common denominator—the entire infrastructure of the retrospective exhibition collapses. The standard museum model relies on synthesis: it gathers fragments to create a coherent narrative, a "definitive look" at a life and work. Incommensurability makes synthesis impossible. You cannot synthesize values that share no language.

  Here is what breaks, and what new structural responsibilities emerge, when you treat this tension as a permanent, unresolvable friction rather than a problem to be solved.

  ### 1. The Breakage of Institutional Authority (The End of the Verdict)
  Traditionally, a retrospective functions as a canonization machine. The museum says, "This person matters; here is the evidence." Even when addressing controversy, the standard move is to weigh it: "The artist was flawed, but the legacy endures." This is a verdict. It implies a shared scale where aesthetic value can eventually outvote moral failure.

  If the values are incommensurable, the museum loses the authority to issue a verdict. It cannot say the art "outweighs" the harm, nor can it say the harm "cancels" the art.
  *   **Structural Implication:** The institution shifts from being a *judge* to being a *host of conflict*. The exhibition cannot aim for narrative closure. The wall text cannot conclude with "Nevertheless, we celebrate..."
  *   **Curatorial Practice:** The layout must refuse resolution. Instead of a chronological march toward "masterpieces," the spatial design might need to force a oscillation. You might place the evidence of harm not in a side panel, but physically interrupting the sightlines to the work. The viewer should not be able to settle into a comfortable appreciation *or* a comfortable condemnation. The institution's job is no longer to protect the art from the biography, or the biography from the art, but to ensure the collision between them remains visible and uncomfortable.

  ### 2. The Refractive Medium (Perceptual Alteration)
  You mentioned moral knowledge acting as a refractive medium. This is the crucial pivot away from the "separate" argument. If the values are incommensurable, the moral knowledge doesn't just sit alongside the art; it bends the light coming off it. It changes the *phenomenology* of the viewing experience.

  When you know an artist used their position to coerce subjects, a portrait's "intimacy" may visually transmute into "surveillance." A brushstroke that once read as "energetic" may now read as "aggressive." This isn't a moral judgment added *after* the aesthetic experience; it is a change *within* the aesthetic experience.
  *   **Structural Implication:** Curators cannot treat the "art" as a stable object that remains the same while we add moral footnotes. The object itself has changed because the viewer's access to it has changed.
  *   **Curatorial Practice:** Interpretive materials must describe *how* the perception shifts, not just *that* it shifts. Instead of saying, "The artist abused his models," the text might ask, "Does the gaze in this painting feel consensual now?" This forces the viewer to acknowledge that their aesthetic pleasure is not innocent. It implicates the viewer's own capacity for enjoyment in the moral framework. The "beauty" is not erased, but it becomes complicated—it might become "uncanny" or "complicit." The museum must validate that the art *looks different* now, and that this different look is a valid aesthetic response, not just a moral overreaction.

  ### 3. Structural Double Vision (The Refusal of Synthesis)
  If you cannot subtract the biography without lying, and you cannot collapse the art into the biography without destroying the art, you are left with "double vision." This is not binocular vision (which creates depth/3D synthesis); it is a form of diplopia where two images occupy the same space but do not merge.

  *   **Structural Implication:** The exhibition must prevent the viewer from focusing on one image until the other disappears. Standard exhibitions encourage "flow"—you move from room to room, absorbing the art. A "double vision" exhibition must introduce friction that stops the flow.
  *   **Curatorial Practice:** This might mean breaking the "White Cube" neutrality. If the harm involved labor exploitation, the exhibition design itself should not rely on exploited labor. If the harm involved silencing voices, the audio guide should not be a single authoritative voice. The medium must match the message.
  *   **The Risk:** The danger here is didacticism, where the art becomes mere illustration of the crime. Incommensurability guards against this by insisting the aesthetic value *still exists* and *still matters*, even if it cannot be separated from the harm. The curator must hold the line: "This is visually profound" AND "This is morally repugnant," without letting the "AND" become a "BUT."

  ### 4. The Viewer's Position (From Consumer to Witness)
  In the standard model, the viewer is a consumer of culture. They pay for an experience of beauty or intellect. In the incommensurable model, the viewer becomes a witness to a conflict they cannot resolve.

  *   **Structural Implication:** This places a burden on the viewer that museums usually try to alleviate. Museums usually tell you how to feel. Here, the museum must tell you that *you* have to decide how to hold this tension, and that there is no correct answer.
  *   **Curatorial Practice:** This requires a shift in educational programming. Docents shouldn't be trained to answer "Should we still show this?" with a yes or no. They should be trained to facilitate the discomfort. The goal is not visitor satisfaction (in the traditional sense); it is visitor *implication*. The viewer leaves not with a verdict on the artist, but with a heightened awareness of their own complicity in consuming art produced through harm.

  ### 5. What Breaks: The Ontology of the "Work"
  Finally, the concept of the "artwork" itself breaks. We usually treat the artwork as a fixed object (canvas, sculpture) that travels through time. If moral knowledge is a refractive medium, the artwork is not fixed. It is an event that happens between the object and the viewer's moral consciousness.

  *   **Implication:** A retrospective is no longer a display of objects; it is a display of *relationships*.
  *   **Responsibility:** The museum must acknowledge that by showing the work, they are re-activating the relationship between the artist's power and the subject's vulnerability. They are not just showing a painting; they are re-staging the dynamic that produced it. If the artist's harm was public and structural (e.g., institutional abuse), the museum showing the work is now part of that structure unless they actively disrupt it.

  ### Summary for Your Group
  If aesthetic and moral values are incommensurable, the museum cannot be a temple (worshipping the art) or a courtroom (judging the artist). It must become a **laboratory of friction**.

  The goal of the exhibition is not to help the viewer "get past" the biography to enjoy the art, nor to help the viewer "see through" the art to condemn the biography. The goal is to force the viewer to sustain the cognitive dissonance of holding both truths simultaneously, acknowledging that the art is *better* for the friction, not worse. The aesthetic experience is deepened, not diminished, by the moral shadow, because the shadow reveals the true cost and weight of the image. The "breakage" is the illusion that art can ever be innocent, or that morality can ever be simple. The curator's job is to keep that breakage open, not to glue it back together.
