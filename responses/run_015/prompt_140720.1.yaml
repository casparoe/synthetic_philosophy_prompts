      *   *Decision:* Yes, it troubles Gregorian. If a Skinnerian creature can use a tool to get Popperian benefits, where does Gregorian fit? Gregorian is supposed to be the *enabler* of Popperian thinking (via language). But here we have Popperian *payoff* without Gregorian *wiring*.

