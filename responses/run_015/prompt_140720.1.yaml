      *(Let's write it.)*
answer: |-
  **Scenario**
  A wild tufted capuchin (*Sapajus apella*) foraging in the Atlantic forest encounters a hollow log known to contain grubs but also inhabited by venomous lancehead snakes. Instead of reaching directly into the cavity, the monkey snatches a nearby dry branch and thrusts it vigorously into the hole. If a snake is present, it strikes the wood; the monkey drops the branch and retreats, having lost only the disposable stick. If no strike occurs, the monkey reaches in to retrieve the food. To a naive observer, the monkey appears to be formulating a hypothesis ("There might be a snake") and running a simulation ("If I put the stick in, I will see if it bites") to avoid a lethal error, effectively letting the stick "die" in its place. However, the behavior is acquired solely through operant conditioning: past reaches resulted in pain (punishment), while past stick-thrusts followed by reaches resulted in food without pain (reinforcement), creating a rigid behavioral chain where the external object absorbs the physical cost of the error without the animal representing the danger internally.

  ***

  **a. Dennett's Criteria: Mechanism vs. Payoff**

  *   **Reading 1: Mechanism (The Internal Architecture)**
      *   **Verdict:** **Skinnerian.**
      *   **Reasoning:** The animal's behavior is governed by reinforcement history, not inner simulation. There is no evidence of counterfactual reasoning (e.g., the monkey does not probe if the stick is unavailable, it simply freezes or abandons the log, rather than simulating a hand-probe). The "decision" to probe is a conditioned response to the visual stimulus of the hollow, triggered by the aversive memory of pain. The machinery required is a feedback loop linking stimulus (hole) to action (thrust) to outcome (safety/food), with no need for a world-model that runs "offline" to test outcomes before acting. The environment does the computing, not the brain.
  *   **Reading 2: Payoff (The Functional Outcome)**
      *   **Verdict:** **Popperian.**
      *   **Reasoning:** The functional benefit is exactly what Dennett describes for the third rung: a candidate action (entering the hole) is screened for lethality before the organism's body is committed. The "error" (snake strike) is realized in the world upon a surrogate (the stick) rather than the organism's flesh. The cost of finding out is paid by the artifact, sparing the creature the evolutionary cost of the mistake. The system *as a whole* achieves the "let your hypotheses die in your stead" benefit, regardless of where the computation happens.

  **b. The Single Feature Doing the Work**
  The **disposable physical surrogate** (the stick) which externalizes the point of failure from the organism's body to the environment.

  **c. Ablation**
  If you remove the stick (or the availability of rigid probes), the case collapses into **pure Skinnerian trial-and-error**. The monkey must either reach (risking death/pain) or not reach (losing food). Without the surrogate to absorb the strike, the "screening" cannot happen outside the skin; the animal's body becomes the only available probe. The Popperian *payoff* vanishes instantly, even though the animal's cognitive *mechanism* (Skinnerian conditioning) remains unchanged. This proves the payoff was contingent on the external scaffold, not an internal upgrade.

  **d. The Defence (Dennettian Counter-Arguments)**

  1.  **The Extended System Reply:** Dennett could argue that the unit of analysis for the taxonomy should be the "creature-plus-tool." If the stick is functionally integrated into the sensorimotor loop, the *system* is Popperian, even if the biology is not. The rung classifies the *agent*, and the agent now includes the stick.
  2.  **The Internal Criterion Reply:** Dennett could insist that the rungs are defined strictly by the *locus of control and representation*, not the outcome. A Popperian creature must generate the screening *internally* via an inner environment. If the screening is outsourced to the physics of the stick, the creature hasn't climbed the rung; it has merely found a Darwinian workaround (using a hard object) that mimics Popperian safety.

  *Evaluation:* The **Internal Criterion Reply** is the strongest philosophically because it preserves the taxonomy's focus on cognitive evolution (brain complexity) rather than ecological luck. The **Extended System Reply** is closest to being a verbal move; it saves the classification by redrawing the boundary of the "self" to fit the theory, effectively stipulating that any successful surrogate makes the creature Popperian, which dilutes the specific claim about inner simulation.

  **e. Bonus: Trouble for the Gregorian Rung?**
  **Yes.** The Gregorian rung is supposed to be the bridge that allows Skinnerian creatures to access Popperian benefits by importing "good tricks" (tools, language) that rewire the brain. In this case, the capuchin accesses the Popperian *payoff* (safety via screening) using a tool (the stick) while remaining mechanistically Skinnerian. This suggests that a creature can import a good trick from the environment (a stick) and reap the Popperian benefit *without* the Gregorian rewiring (language/symbols) that Dennett claims is necessary to stabilize that benefit. It implies the rungs might be orthogonal: you can have Popperian outcomes via Skinnerian mechanisms + Environmental Scaffolding, bypassing the need for the Gregorian "software upgrade."

  ***

  **Note on Experimental Setup:** This scenario relies on field observations of wild capuchins (e.g., Fragaszy et al.), so no human experimenter is required to arrange the surrogate—the animal finds the stick. However, verifying the *absence* of an inner model (the Skinnerian verdict) would require human-designed control tests (e.g., removing sticks to check for planning vs. reflex). The case holds as a natural phenomenon, but the *interpretation* relies on human experimental rigor.
