answer: |-
  Good evening. I stand before you as [Bride]'s former doctoral supervisor, and today, as her friend. I love her dearly, and I count [Groom] among the people I admire most. 

  When I first supervised [Bride], I thought my role was to teach her how to argue. I was wrong. She taught me how to listen. She taught me that words carry weight, and that speaking requires care. In her work, she explores what it means to tell the truth. She holds that we should not say what we do not know. I have taken that lesson to heart. So tonight, I will not claim to know the future. 

  September brings a challenge. I know that [Bride] and [Groom] begin postdocs in different countries. I know that distance tests even the strongest bonds. Many couples have faced this path; some have found it easy, others have found it hard. I do not know which way this journey will turn. To pretend otherwise would be to disrespect the very standards [Bride] has dedicated her career to upholding. It would be insincere.

  But while I cannot predict the outcome, I can report what I have witnessed. I have seen how they speak to one another when no one else is listening. I have seen the patience they offer when the other is weary. I have seen them build a shared language of kindness. In all my years of teaching, I have rarely observed such mutual respect. 

  Her grandmother told me once that a marriage is not a promise of calm seas, but a pact to steer the ship together. I hold that wisdom close. 

  So, I offer you this not as a prophecy, but as a wish. May you find joy in the small moments when you are apart. May your conversations across time zones remain rich and warm. May you always return to each other with patience. 

  I promise to support you both. I commit to being a friend who listens, just as [Bride] taught me. I pledge my home to you whenever you need a place to land. 

  To the family: I see how much you love them. I share that love. 
  To the colleagues: I honor the integrity [Bride] brings to her work. I try to bring that same integrity to this toast. 

  [Bride] and [Groom], I do not know what the next year holds. But I know what you are worth. I know what you mean to each other. And I know that you are loved beyond measure. 

  May your life together be long. May it be true. May it be happy. 

  Cheers.

  ***

  **Note to the Speaker: Where the Constraints Bit**

  1.  **The Prediction Trap:**
      *   *Ruled Out:* "I know you will be happy" or "This marriage will last."
      *   *Reason:* You lack knowledge of the future (violates the knowledge norm of assertion) and you don't believe it with certainty (violates sincerity).
      *   *Replacement:* "I do not know which way this journey will turn" ( Honest assertion about your own epistemic state) followed by optatives ("May you find joy").

  2.  **The Belief Trap:**
      *   *Ruled Out:* "I believe this will work out."
      *   *Reason:* While technically an avowal, in this context it functions as a hedge for a prediction you can't support. Given her work, asserting "It will work" without knowledge is the target.
      *   *Replacement:* "I can report what I have witnessed." (Shifts to past observation, which is knowable).

  3.  **The Change of Mind Trap:**
      *   *Ruled Out:* "I now realize my role was..." or "I see that..."
      *   *Reason:* Present tense assertions about internal states can drift into claiming current knowledge of external truths.
      *   *Replacement:* "When I first supervised... I thought... I was wrong." (Past tense narrative).

  4.  **The Warmth Trap:**
      *   *Ruled Out:* "I am certain you are perfect for each other."
      *   *Reason:* You aren't certain.
      *   *Replacement:* "I know what you are worth." (Knowable valuation) and "May your life together be long." (Blessing/ Wish, not fact-claim).

  5.  **The Jargon Trap:**
      *   *Ruled Out:* Any mention of "norms," "conditions," "paradoxes," or "assertion."
      *   *Replacement:* "Words carry weight," "Speaking requires care," "Standards," "Insincere." (Conveys the philosophical stake without the technical terminology).
