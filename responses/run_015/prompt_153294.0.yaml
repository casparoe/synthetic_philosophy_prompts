      *   **Honoree's View:** Assertion requires knowledge (not mere belief); Moore's paradox ("It's raining but I don't believe it") is explained by a sincerity condition, not logical contradiction.
      *   **Speaker's Constraint 1 (Epistemic):** Every first-person present-tense assertion must be something the speaker genuinely believes/knows. No fake confidence about the marriage's success (given the long-distance postdoc situation).
      *   **Speaker's Constraint 2 (Philosophical):** Adhere to the honoree's stricter standard of assertion (knowledge norm). Avoid Moorean paradoxes (asserting something while implying lack of belief/knowledge).
      *   **Speaker's Constraint 3 (Emotional):** Must land as affection, not a lecture. No jargon ("Moore's paradox," "norm of assertion," "sincerity condition").
      *   **Speaker's Constraint 4 (Grammatical/Logical):** Warmth carried by non-assertoric speech acts (wishes, optatives, avowals of feeling, reports of past observations, attributions of confidence to others, quotes). Changes of mind must be in past tense.
      *   **Format:** 4-5 minute toast (approx. 600-750 words spoken at normal pace).
      *   **Addendum:** A short note to the speaker marking where constraints bit (what was ruled out, what replaced it).

  2.  **Deconstruct the Constraints & Strategy:**
      *   *The Trap:* Traditional toasts say "I know they will be happy" or "This marriage will last." The speaker doesn't know this (long-distance postdocs). Asserting this would violate the knowledge norm (which the bride specializes in) and the speaker's honesty.
      *   *The Solution:* Use performatives that don't claim knowledge. "I wish," "I hope," "I love," "I have seen," "Her grandmother said," "Many believe."
      *   *The Philosophical Nod:* Subtly align with the bride's work without naming it. Show sincerity. Avoid saying "I believe X" if X is uncertain. Instead say "I hope X" or "It is my wish that X."
