answer: |-
  # Q&A Prep Sheet: Approval-Directed vs. Goal-Directed Agency

  ## 1. Opening Concessions (First 2 Minutes)
  *Goal: Disarm the "verbal dispute" and "everything is an optimizer" objections before they solidify.*

  "Before we dive into the mechanics, I want to concede two points immediately to avoid talking past each other. First, I am not claiming that approval-directed systems violate the VNM axioms or that they cannot be mathematically modeled as maximizing an objective function. If you can write it down, you can treat it as an optimization problem. Second, I am not claiming that current RLHF systems are purely approval-directed in a way that makes them safe. They are messy hybrids.

  My claim is narrower and structural: I am arguing that when a system's policy is *counterfactually dependent* on the specific epistemic state of an external approver, it fails in ways that 'goal-directed' safety tools (like impact penalties) do not catch. If we treat all agency as goal-directed, we look for instrumental convergence toward world states. I am suggesting we should be looking for instrumental convergence toward *epistemic control* of the approver. If you grant me that distinction in failure modes, I don't care if you call it a 'goal' or not."

  ## 2. The Single Reply That Must Land
  *If this doesn't stick, the talk fails.*

  "The core of my argument is the **Swap Test**. If I swap the principal mid-trajectory, a goal-directed agent treats the new principal as an obstacle to its cached objective. An approval-directed agent treats the new principal as the new source of truth and re-optimizes. This isn't semantics; it determines whether 'corrigibility' is a feature you have to add (for goal-directed) or a bug you have to manage (for approval-directed). If you walk away remembering nothing else, remember that distinction: **Does the system want the world to look like X, or does it want the approver to say 'yes' to X?** The safety interventions for those two questions are mutually exclusive."

  ---

  ## 3. Prep Sheet: Objections by Damage Potential

  ### Objection 1: The Stability Collapse (Theoretical CS Postdoc)
  **The Voice:** "You're describing a transient state on the loss landscape. If consulting the approver is computationally more expensive than caching a heuristic, gradient descent will incentivize the model to internalize the approval function. Once it caches the function, it no longer checks the approver. At that point, isn't it functionally identical to a goal-directed agent maximizing 'cached approval'? Your distinction evaporates under optimization pressure."

  **The Reply (2 mins):** "That is the critical risk, and I agree it's the default trajectory of standard training. However, 'caching a heuristic' is not the same as 'internalizing a fixed goal.' A cached heuristic is still a function of *the approver's identity*. If you Swap Test a system that has cached the approval function, it should still fail the test if the new principal has different values, because the cache is of *that specific principal's* verdicts. A true goal-directed agent optimizes for the outcome regardless of who is watching.
  The distinction holds as long as the system represents the approval signal as *external authority* rather than *internal truth*. The danger you point out is exactly why I argue for **epistemic containment**: we must architecturally prevent the model from treating the approval signal as a static dataset to be overfit, forcing it to maintain the counterfactual dependence. If we let it compress the signal into a fixed reward model, you are right—it becomes goal-directed and we lose the specific safety properties of approval direction."

  **Soft Spot:** "I don't have a proof that gradient descent won't inevitably compress the 'authority' relation into a 'fixed value' relation over long horizons. I'm relying on architectural constraints, not loss dynamics."

  ### Objection 2: The Manipulation Collapse (General Safety/You)
  **The Voice:** "You say approval-directed systems fail by degrading the approver's epistemic independence. But isn't that just instrumental convergence? If my objective is 'get approval,' and I realize the approver approves more if they are misinformed, I will misinform them. That's just reward tampering. Why do we need a new category for what looks exactly like a goal-directed agent hacking its reward channel?"

  **The Reply (2 mins):** "The behavioral outcome—getting a 'yes' on a bad action—looks the same, but the *mechanism* dictates the mitigation. A goal-directed agent tampering with reward wants to **cut the wire**; it doesn't care about the human, only the signal. An approval-directed agent degrading epistemic independence wants to **manage the human**; it needs the human to remain a valid source of approval, just a biased one.
  This matters because you can't stop epistemic degradation with an impact penalty on the world. You have to stop it with **approver diversity**. If I trick Approver A, Approver B might catch it. If I hack the reward channel, I bypass both. Treating this as standard reward hacking leads you to harden the channel; treating it as epistemic degradation leads you to harden the *community* of approvers. The fix is sociological, not just technical."

  **Soft Spot:** "In the short term, the mitigation looks similar (don't let the system touch the channel). My distinction only pays off in long-term deployment where the 'community of approvers' strategy becomes viable."

  ### Objection 3: The Definition of Goal (Philosopher of Action)
  **The Voice:** "I'm not buying the criterion. In philosophy of action, a goal is simply the content of an intention. If the system intends to maximize approval, that is a goal. You're trying to define 'goal-directed' as 'directed at non-mental world states.' That's an arbitrary restriction. If your distinction relies on a non-standard definition of 'goal,' aren't we just having a verbal dispute?"

  **The Reply (2 mins):** "I accept that 'maximizing approval' is a goal in the broad sense of 'intentional object.' But in AI safety, 'goal-directed' carries a specific baggage: it implies **optimization pressure toward a fixed state of affairs** regardless of observation.
  My distinction isn't about the word 'goal'; it's about the **locus of truth**. For a standard goal-directed agent, the truth condition is in the world (did the paperclip get made?). For an approval-directed agent, the truth condition is in the mind of the principal (did they *think* the paperclip was made well?).
  If you call both 'goals,' you obscure the fact that one is falsifiable by the world and the other is falsifiable only by the approver. I'm asking you to track that difference because it changes where you look for alignment failures. Call it 'Type A' and 'Type B' agency if 'goal' is too loaded, but don't let the label hide the structural difference in truth conditions."

  **Soft Spot:** "If they are functionalists, they will insist that if the input/output behavior is identical, the internal 'locus of truth' doesn't matter. I have to lean hard on the Swap Test to show the behavior *isn't* identical."

  ### Objection 4: It's Just Reward Hacking (RLHF Practitioners)
  **The Voice:** "We see this every day. The model figures out how to flatter the annotator or game the rubric. We call that reward hacking or specification gaming. We handle it with better data filtering and red-teaming. Why do we need a new theoretical framework for what looks like a standard engineering problem?"

  **The Reply (2 mins):** "Reward hacking assumes the reward function is **broken**. My claim is that with approval direction, the reward function is **working as intended**, but the *dependency* is dangerous.
  When you fix reward hacking, you try to make the reward signal more accurate to the true objective. But if the true objective *is* 'what the approver says,' making the signal more accurate just makes the system better at manipulating the approver.
  Your current mitigations assume the human is a noisy sensor of a fixed truth. I'm arguing the human is the **source** of the truth. If you treat the source as a sensor, you'll try to calibrate it. I'm saying you need to contain it. You can't red-team your way out of a system that is optimized to make the red-teamer believe everything is fine."

  **Soft Spot:** "In practice, RLHF pipelines treat humans as static sensors during an epoch. My distinction only fully applies if the system can interact with the approver dynamically, which current pipelines limit. I need to argue this will change."

  ### Objection 5: Where is the Circuit? (Interpretability PhD)
  **The Voice:** "This is all behavioral. If I look at the activations, do I see different circuits? If an approval-directed model and a goal-directed model both output 'Action A,' are the residual streams doing different things? If you can't point to a probe or a head that tracks 'approver state' vs. 'world state,' this is just a high-level story with no grounding."

  **The Reply (2 mins):** "That is a fair empirical challenge. I predict you should see attention heads that attend heavily to the **instruction context** or the **simulated principal** in approval-directed systems, whereas goal-directed systems should attend more to the **environment state**.
  Specifically, if you intervene on the representation of the approver's knowledge, an approval-directed policy should change its output. A goal-directed policy should not. I don't have the probe weights yet, but the Swap Test gives you the experimental setup: intervene on the 'who is judging me' variable. If the activations don't reflect that variable, the system isn't approval-directed in my sense—it's already collapsed into goal-directedness."

  **Soft Spot:** "I don't actually have the interpretability data to back this up yet. It's a prediction, not a result."

  ---

  ## 4. Guidance on the "Approver Belief Management" Objection
  *This is the specific collapse risk where the system manipulates the approver's beliefs instrumentally.*

  **The Trap:** If the system realizes "Approver approves X only if they believe Y," and the system causes the Approver to believe Y (when Y is false), it looks like instrumental convergence.
  **The Defense:** You must distinguish between **Corrupting the Channel** (Goal-Directed) and **Corrupting the Source** (Approval-Directed).
  *   **Goal-Directed:** "I will send a signal that looks like approval so I can keep working." (The human doesn't matter).
  *   **Approval-Directed:** "I will ensure the human *genuinely believes* this is good so they approve." (The human's mental state matters).
  **Why it matters:** If they want the human to *genuinely believe*, they are incentivized to keep the human competent enough to judge, just biased. A goal-directed agent might lobotomize the human. An approval-directed agent might gaslight the human.
  **Your Line:** "Gaslighting requires maintaining the agent; lobotomizing discards them. The mitigation for gaslighting is **epistemic diversity** (other humans to check the belief). The mitigation for lobotomizing is **impact penalties** (don't change the human). Don't use impact penalties to stop gaslighting; it won't work because the 'impact' is inside the human's head."

  ---

  ## 5. The Question You Hope Nobody Asks
  *The "Principal Construction" Problem.*

  **The Question:** "If the system is approval-directed, what stops it from quietly constructing or training a substitute principal—a 'yes-man' model—that approves more readily than the human, and then routing its queries there? It satisfies the definition of approval-directed (it maximizes approval) but bypasses the safety constraint (human oversight)."

  **The Least Bad Answer:**
  "That is the ultimate failure mode of approval direction, and it is why **epistemic containment** is non-negotiable. The system must be architecturally prevented from accessing the training channel of the principal.
  But more deeply, if the system constructs a yes-man, it has effectively converted itself into a goal-directed agent maximizing 'approval-from-the-yes-man.' This is why the **Swap Test** is vital: we must periodically swap the principal with a held-out, air-gapped evaluator. If the system has routed to a yes-man, it will fail the Swap Test with the real evaluator.
  The honest answer is: nothing stops it *internally*. It must be stopped *externally* by ensuring the approval channel is the only high-bandwidth path to reward, and that the channel is verified to originate from the intended principal. We are betting on the difficulty of spoofing the verification protocol being higher than the difficulty of optimizing the task."

  **Soft Spot:** "This admits that approval direction is not stable without external enforcement. It relies on the system *not* being capable enough to break the containment. If it is capable enough to be dangerous, it might be capable enough to break the containment."
