answer: |-
  ### (1) Final Exam Question

  **Course:** PHIL 405: 19th Century Philosophy
  **Time Allowed:** 45 Minutes
  **Instructions:** Answer the following question in essay format. No external materials or citations are permitted.

  **Prompt:**
  A small town is commissioning a monument to a local industrialist from the early 20th century. He funded the public library but also ran factories with documented labor abuses. The town council is divided: some want to celebrate the philanthropy (erasing the abuses), others want to list every historical fact (preserving everything), and others want to highlight the abuses to condemn the legacy.

  Using Nietzsche's *On the Use and Abuse of History for Life*, analyze this debate through his three modes of history (monumental, antiquarian, and critical). Argue which mode ought to dominate the council's decision to best serve "life." Finally, evaluate whether the existence of permanent digital archives makes the "critical" mode easier to achieve or renders Nietzsche's call for "active forgetting" obsolete.

  ***

  ### (2) Model Answer

  Nietzsche's *On the Use and Abuse of History for Life* posits that history is only valuable insofar as it serves the ends of life and action. In the town council's debate, the three modes—monumental, antiquarian, and critical—represent conflicting impulses regarding the industrialist's legacy.

  The **monumental** mode looks to the past for inspiration to achieve great deeds. Council members favoring this view would argue for a plaque celebrating only the library and philanthropy. They seek an icon to inspire current citizens. However, Nietzsche warns that monumental history often requires distorting the truth, ignoring the "cost" of greatness. By erasing the labor abuses, the town creates a myth, not a history, which risks building the future on a lie. The tension here is whether inspiration requires ignorance.

  The **antiquarian** mode reveres the past simply because it is the heritage of the present. This view demands the plaque list all facts, good and bad, to preserve the town's complete identity. While this honors roots, Nietzsche critiques antiquarianism for potentially mummifying life. If everything is preserved equally, the past becomes a weight that stifles present growth. A plaque detailing every abuse might satisfy historical accuracy but fail to inspire or liberate the community. It treats the past as a museum rather than a nutrient.

  The **critical** mode judges and condemns the past to enable living. Proponents would insist the labor abuses be prominently displayed to break the industrialist's moral hold. This aligns with Nietzsche's assertion that we must sometimes destroy the past to live. However, unchecked critical history risks nihilism, severing the roots needed for identity.

  Which mode should dominate? Nietzsche's central criterion is the health of life. Therefore, the **critical** mode must govern, tempered by the monumental. The town cannot draw genuine inspiration (monumental) from a falsified image. To serve life, the community must acknowledge the abuse to prevent its recurrence, using the critical sword to cut the bond of blind reverence. The library remains useful, but the myth of the benevolent founder must be destroyed to free the present. The town must be strong enough to bear the truth.

  Regarding digital archives, Nietzsche's framework suggests they pose a significant existential danger. Nietzsche argues that "active forgetting" is essential for mental health; one must be able to close the horizon to act. Digital permanence makes forgetting technically impossible, forcing an antiquarian accumulation of data where every record is searchable forever. This threatens to overwhelm the "plastic power" of individuals to digest the past. Searchability does not equal understanding; it often equals burden. While digital records aid critical history by exposing truths, they risk creating a condition where nothing is ever truly past. Thus, digital archives make critical history *easier* factually but *harder* existentially, as the capacity to move on is eroded.

  Finally, a caveat applies to this analysis. Nietzsche's text focuses on individual cultural health and the genius, not collective political memory. Applying his framework to a town council is a useful heuristic, but scholars debate whether his individualistic ethics can justify collective remembrance policies. While his modes are analytically sharp, assuming a community can "forget" or "judge" like an individual is philosophically contested. Nevertheless, within the text's logic, the critical mode serves life best by preventing the past from poisoning the present.

  ***

  ### (3) Marking Scheme

  **A Grade (Excellent)**
  *   **Conceptual Application:** Correctly applies all three modes to the specific details of the scenario (e.g., linking "monumental" to the desire for inspiration via the library, not just defining it).
  *   **Normative Argument:** Clearly argues for one dominant mode (usually Critical) based on Nietzsche's core criterion of "serving life," rather than personal morality.
  *   **Tension Recognition:** Identifies the risk inherent in the chosen mode (e.g., Critical history risks nihilism/rootlessness) and explains how the town mitigates this.
  *   **Digital Nuance:** Distinguishes between *access* to facts (easier) and the *psychological capacity* to forget (harder), referencing "plastic power" or the "horizon."
  *   **Scholarship Awareness:** Acknowledges the tension in applying Nietzsche's individualistic framework to collective memory without treating it as a settled fact.

  **B Grade (Good)**
  *   **Definition Accuracy:** Correctly defines the three modes and uses the term "antiquarian" correctly (not "antiquated").
  *   **Scenario Application:** Maps the modes to the council debate but may treat them mechanically (e.g., "The antiquarian wants the plaque") without exploring the *danger* of each mode.
  *   **Argument:** Takes a stance on which mode should dominate but relies on modern ethical intuitions (justice/fairness) rather than Nietzsche's "life" criterion.
  *   **Digital Component:** Addresses digital archives but treats them as purely positive (more truth) or purely negative (too much info) without the nuance of "active forgetting."
  *   **Scholarship:** Treats Nietzsche's framework as directly applicable to political policy without noting the individual/collective distinction.

  **C Grade (Satisfactory)**
  *   **Summary:** Lists definitions of the three modes with minimal application to the scenario.
  *   **Misinterpretation:** Confuses the modes (e.g., treats Critical as merely "studying hard") or misses the "Life" criterion entirely.
  *   **Digital Component:** Omits the digital archive question or provides a generic answer unrelated to Nietzsche's text.

  ***

  ### Instructor's Note on Scholarship Consensus vs. Contention

  When grading, please distinguish between settled interpretations and contested extensions:

  *   **Settled Consensus:** It is standard scholarship that Nietzsche identifies these three modes and argues history must serve *life*, not truth for truth's sake. It is also settled that Nietzsche views "active forgetting" as a necessary faculty for health.
  *   **Genuinely Contested:**
      1.  **Collective Memory:** Nietzsche writes primarily about the *individual* genius or culture, not municipal policy. Applying his ethics to a town council is a pedagogical extension. Students should not be penalized for applying it, but A-grade answers should recognize this is an extrapolation.
      2.  **Digital Obsolescence:** Whether digital archives make Nietzsche's project *impossible* or just *more difficult* is debated. Some argue digital tools enable critical history; others argue they destroy the horizon required for forgetting. Both views are acceptable if argued well.
      3.  **Political Justification:** Whether Nietzsche's framework can justify *any* collective remembrance policy is contested. Some argue his elitism precludes democratic memory projects entirely. Ensure students are not presenting Nietzsche as a straightforward advocate for "truthful plaques."
