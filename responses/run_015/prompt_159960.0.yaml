      *   **Task:** Create a *decision procedure* (ordered set of questions, stop points, sufficiency conditions), *not* a position paper.
      *   **Specific Challenges to Address:**
          1.  Distinguish four questions: Acknowledgment, Obligation/Remedy, Apology, Guilt (and inheritability).
          2.  Continuity Test (avoid asymmetry between asset inheritance and liability denial). Treat present honoring as a present act.
          3.  Successor Identification (identifiable, dispersed, rival, none). Distinguish ongoing vs. past wrongs.
          4.  Evidence/Burden of Proof (archive control, silence).
          5.  Remedy Adequacy (avoid empty gestures vs. ratcheting demands). Check acceptance and cost-bearing.
          6.  Precedent/Cost (floodgates argument vs. consistency).
          7.  Jaspers' Guilt (use conceptually where useful, don't just label).
      *   **Test Cases:**
          1.  Plantation mortgage donor building/chair (family threat).
          2.  Ancestral remains/sacred objects (NAGPRA-adjacent but private/1920s).
          3.  National org demanding general slavery guilt/reparations (no specific act/asset).
      *   **Self-Critique:** Must admit where the procedure fails or requires value judgments.

  2.  **Deconstruct the Decision Procedure Structure:**

      *   Needs to be a flowchart or numbered list with "Stop/No" and "Stop/Value Judgment" points.
      *   Needs to be practical for non-philosophers.
      *   Needs to integrate the six specific challenges.

      *   *Drafting Phase 1: The Fourfold Distinction.*
          *   Acknowledgment (Fact): Did it happen? Are we connected?
          *   Liability (Obligation): Do we owe something?
          *   Apology (Speech Act): Who speaks for whom?
          *   Guilt (Moral Status): Are we "guilty"? (This is the trap. Jaspers says moral guilt isn't inherited. Political liability is.)
          *   *Integration:* The procedure should separate these. Acknowledgment is factual. Liability is the core decision. Apology follows liability. Guilt is mostly a "No" for the institution regarding past acts, unless ongoing.

      *   *Drafting Phase 2: Continuity.*
          *   Need a "Corporate Continuity Test."
          *   Criteria: Charter, Assets, Agency, Ratification, Benefit.
          *   *Key Insight:* If you keep the money, you keep the story. If you keep the name, you endorse the person.

      *   *Drafting Phase 3: Successors & Ongoing Wrongs.*
          *   Filter: Is the harm ongoing? (e.g., remains still held). If yes, liability is higher/easier.
          *   If past: Who gets the remedy?
          *   If no successor: Remedy might shift to public good/memory.

      *   *Drafting Phase 4: Evidence.*
          *   Burden: Petitioner shows prima facie case. University shows contrary evidence.
          *   Silence: If University controls archive and is silent on a key transaction that benefited it, infer benefit existed (adverse inference).

      *   *Drafting Phase 5: Remedy.*
          *   Test: Proportionality, Acceptance by Successors, Cost Bearing (don't punish current students for past sins unless necessary).
          *   Avoid "Virtue Signaling" (cheap talk) and "Extortion" (family threats).

      *   *Drafting Phase 6: Precedent.*
          *   Floodgates: Only valid if the *principle* creates unlimited liability, not just if many people ask.
          *   Consistency: Must match prior findings on similar continuity/benefit facts.

  3.  **Developing the Procedure (Iterative Refinement):**

      *   *Step 1: Categorization.* Is this a specific act/asset case or a general atmospheric case?
