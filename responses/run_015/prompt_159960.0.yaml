  4.  **Addressing the Specific Challenges in the Procedure Text:**

      *   *Challenge 1 (4 Questions):* Build them into the output sections of the procedure.
      *   *Challenge 2 (Continuity):* Make Step 2 the "Institutional Linkage Test." Explicitly mention "Present Honoring."
      *   *Challenge 3 (Successors):* Make Step 3 the "Claimant Validity Test." Distinguish Ongoing vs. Historical.
      *   *Challenge 4 (Evidence):* Embed in Step 1 & 2. "Archive Silence Rule."
      *   *Challenge 5 (Remedy):* Make Step 4 the "Proportionality & Acceptance Test."
      *   *Challenge 6 (Precedent):* Make Step 5 the "Consistency & Scope Test."

  5.  **Running the Test Cases:**

      *   *Case 1 (Plantation Donor):*
          *   Continuity: High (endowment principal still there).
          *   Present Honoring: Yes (building name).
          *   Successor: Descendants of enslaved (identifiable class).
          *   Remedy: Rename + Redirect.
          *   Complication: Family threat. Procedure must flag this as "Improper Pressure" but acknowledge cost.
          *   Outcome: Likely Rename + Redirect. Guilt? No. Liability? Yes (unjust enrichment).
      *   *Case 2 (Remains):*
