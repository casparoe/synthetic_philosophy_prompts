answer: |-
  ## The Inherited Liability Adjudication Procedure (ILAP)

  **Purpose:** To generate consistent, defensible findings on petitions regarding historical wrongs where the university inherits the benefit or status but not the original agency.
  **Users:** Committee Members (Historian, Lawyer, Faculty, Student, Trustee).
  **Output:** A draft Finding for the Board of Trustees.

  **Note on Guilt:** This procedure distinguishes **Political Liability** (collective obligation arising from continuity of the state/institution) from **Moral/Criminal Guilt** (individual culpability). Political Liability can be inherited if benefits and status are inherited. Moral Guilt cannot. The university may accept liability without accepting guilt.

  ---

  ### Step 1: Categorization and Standing
  **Question 1.1:** Is the petition alleging a specific institutional act/asset link, or a general atmospheric benefit (e.g., "operating in a slave economy")?
  *   **Sufficient Answer (Specific):** Petitioner identifies a transaction, agent, or asset traceable to the university's custody or control.
  *   **Sufficient Answer (General):** Petitioner alleges diffuse benefit without specific asset traceability.
  *   **Stop Point A (General):** If *General*, proceed to **Step 6** (Acknowledgment only). Do not proceed to Remedy.
      *   *Reasoning:* Without specific asset continuity, political liability dissolves into general moral solidarity, which is a Board policy decision, not an adjudicative finding.
  *   **Stop Point B (Standing):** If the petitioner has no relationship to the wrong (e.g., unrelated third party) and no successor group is identified, issue a **No Action** finding.

  ### Step 2: The Institutional Continuity Test
  *Goal: Prevent asymmetry between asset inheritance and liability denial.*
  **Instruction:** Answer using the Archivist's Memo. If three or more are "Yes," Institutional Continuity is established.

  1.  **Charter/Legal:** Is the current legal entity the same (or direct successor) to the entity at the time of the wrong?
  2.  **Asset:** Does the university currently hold the specific asset (endowment, object, land) or its direct proceeds generated by the wrong?
  3.  **Agency:** Was the wrong committed by an employee/agent using university resources or authority?
  4.  **Ratification:** Was the act accepted/benefited from at the time, or merely tolerated? (Condemnation at the time weakens continuity).
  5.  **Present Honoring:** Does the university currently display a name, portrait, or award that celebrates the actor?
      *   *Rule:* A "Yes" here counts as **two** points. Keeping a name is an active, present-tense endorsement, not passive inheritance. It shifts the burden of proof to the university to justify retention.

  *   **Stop Point C (No Continuity):** If fewer than three "Yes" (and "Present Honoring" is No), issue a **No Action** finding.
      *   *Finding:* "The university acknowledges the historical context but finds no specific institutional continuity requiring remediation."
  *   **Pass:** If Continuity is established, proceed to Step 3.

  ### Step 3: The Successor and Harm Test
  **Question 3.1:** Is the harm ongoing or historical?
  *   **Ongoing:** (e.g., remains still held, exclusionary policy still in effect).
      *   *Action:* Presumption of Remediation. Proceed to Step 4.
  *   **Historical:** (e.g., past expropriation, past funding source).
      *   *Action:* Proceed to Question 3.2.

  **Question 3.2:** Is there an identifiable successor group with standing to receive a remedy?
  *   **Identifiable:** (e.g., Federally recognized tribe, specific family line).
  *   **Dispersed/Class:** (e.g., "Descendants of enslaved people"). *Acceptable if a representative body exists.*
  *   **Unidentifiable/None:** (e.g., No records, lineage lost).
  *   **Contested:** (e.g., Two groups claim the same remains).

  *   **Stop Point D (No Successor):** If Harm is Historical AND Successor is Unidentifiable.
      *   *Finding:* "Acknowledgment and Memorialization only." (e.g., Plaque, archival digitization). No material transfer.
      *   *Reasoning:* Without a creditor, restitution is impossible; public memory is the only available remedy.
  *   **Value Hand-off 1 (Contested Successors):** If Successors are Contested.
      *   *Action:* Pause Procedure. Draft Finding states: "Remedy contingent on resolution of claimant dispute." Hand to Board. The committee cannot adjudicate competing sovereign or familial claims without external legal/moral authority.

  ### Step 4: Evidence and Burden of Proof
  **Rule:** The University controls the archive.
  *   **Burden:** Petitioner provides *prima facie* evidence of the wrong and link.
  *   **Silence:** If the archive is silent on a transaction that would normally be recorded (e.g., land deed, endowment gift agreement), apply **Adverse Inference**. Assume the benefit existed.
  *   **Silence on Harm:** If the archive is silent on whether the act was harmful (e.g., "was this excavation consensual?"), and the era suggests coercion (e.g., 1920s indigenous remains), assume **Non-Consent**.

  *   **Stop Point E (Evidence Failure):** If Petitioner provides no *prima facie* evidence and Adverse Inference does not apply (e.g., oral history with no corroboration and no archive control).
      *   *Finding:* "Insufficient evidence to establish factual predicate."

  ### Step 5: Remedy Adequacy and Cost
  **Question 5.1:** Has the successor group been consulted on the proposed remedy?
  *   **Yes:** Document their position.
  *   **No:** Remedy cannot be finalized. (Requirement for consultation).

  **Question 5.2:** Does the remedy impose a cost on the wrongdoer (the institution) or a third party (current students/donors)?
  *   **Test:** If the remedy is funded by redirecting existing endowment principal (from the wrong), the cost is borne by the *wrong* (the asset).
  *   **Test:** If the remedy is funded by new tuition or general operating budget, the cost is borne by *third parties*.
  *   **Constraint:** Avoid remedies where the cost falls disproportionately on vulnerable third parties unless the liability is overwhelming.

  **Question 5.3:** Is the remedy proportional to the benefit retained?
  *   **Check:** Does the remedy exceed the value of the asset held? (e.g., Returning a $10k object vs. paying $10M).
  *   **Check:** Is the remedy a "cheap gesture"? (e.g., Renaming a building the donor's family already agreed to rename). If yes, increase material component.

  *   **Value Hand-off 2 (External Coercion):** If a donor threatens to withdraw funds *contingent on the Committee's moral finding* (e.g., "If you rename, we leave").
      *   *Action:* Do not treat this as a moral counter-weight. Treat as a **Financial Risk**.
      *   *Procedure:* Draft the Finding based on moral liability. Attach a separate "Risk Memo" to the Board detailing the financial exposure. The Committee decides the *right*; the Board decides the *risk*.

  ### Step 6: Consistency and Scope (The Floodgates Check)
  **Question 6.1:** Does this finding contradict a prior Committee Finding on materially similar facts?
  *   **Yes:** You must distinguish the facts (e.g., "In Case X, the asset was spent; here it is held"). If you cannot distinguish, you must align with precedent.
  *   **No:** Proceed.

  **Question 6.2:** Does the principle established here create unlimited liability?
  *   **Test:** If we grant this, can we logically deny the next 40 similar petitions?
  *   **If Yes (Unlimited):** Narrow the finding to the specific asset/actor.
  *   **If No (Limited):** Proceed.
  *   *Note:* "We will get many petitions" is not a valid reason to deny a valid claim. "We will get many petitions that we cannot distinguish" is a valid reason to narrow the principle.

  ### Step 7: Final Findings Generation
  Draft the finding using these four distinct headers (do not conflate them):
  1.  **Acknowledgment:** (Fact) We acknowledge X happened and we are linked by Y.
  2.  **Liability:** (Obligation) We hold a political liability because we retain benefit Z.
  3.  **Remedy:** (Action) We will do A, B, and C.
  4.  **Guilt:** (Status) We do not accept *moral guilt* for the acts of ancestors, but we accept *responsibility* for the rectification of inherited inequities. (Exception: If harm is ongoing, use stronger language).

  ---

  ## Application to Pending Petitions

  ### Case 1: The Plantation Mortgage Donor
  **Run-through:**
  1.  **Categorization:** Specific asset link (Endowment principal + Building Name). **Pass.**
  2.  **Continuity:**
      *   Charter: Yes.
      *   Asset: Yes (Principal still funds chair).
      *   Agency: Donor acted privately, but gift was accepted/ratified by Uni.
      *   Present Honoring: Yes (Building Name). **(Counts as 2 points)**.
      *   *Result:* High Continuity. **Pass.**
  3.  **Successor:** Descendants of enslaved people. Dispersed class, but scholarship can target this class. **Pass.**
  4.  **Evidence:** Finance records exist. **Pass.**
  5.  **Remedy:**
      *   *Consultation:* Have descendants been asked? (Assume Yes for procedure).
      *   *Cost:* Redirecting endowment principal costs the *wrong* (the money), not current students.
      *   *Coercion:* Family threat to withdraw *separate* bequest.
      *   *Procedure Action:* This triggers **Value Hand-off 2**. The Committee must recommend renaming/redirecting based on liability. The financial threat goes in a Risk Memo to the Board. The threat does not negate the liability.
  6.  **Consistency:** If the Uni has renamed buildings for ethical violations before, this is consistent.
  **Draft Finding:**
  *   **Acknowledgment:** The endowment derives from wealth generated by enslaved labor.
  *   **Liability:** The University retains the specific financial benefit and actively honors the donor via the building name.
  *   **Remedy:** Remove name from building. Redirect income from the endowment principal to descendants of the enslaved.
  *   **Guilt:** No admission of criminal guilt by the donor (legal at the time), but admission of institutional responsibility to rectify the retained benefit.
  *   **Note to Board:** A separate bequest is at risk. This is a financial decision, not a moral one.

  ### Case 2: Ancestral Remains (1920s)
  **Run-through:**
  1.  **Categorization:** Specific asset (Remains/Objects). **Pass.**
  2.  **Continuity:**
      *   Asset: Yes (In collection).
      *   Agency: Yes (Professor with Uni funds/transport).
      *   Present Honoring: Yes (Holding/Displaying).
      *   *Result:* Maximum Continuity. **Pass.**
  3.  **Successor:** Federally recognized Tribe (Identifiable) + Unaffiliated individuals.
      *   *Procedure:* **Value Hand-off 1** applies to the unaffiliated.
  4.  **Harm:** **Ongoing.** Possession continues against recorded objection.
      *   *Effect:* Presumption of Remediation is active. No need for complex inheritance theory; this is a current tort-adjacent holding.
  5.  **Remedy:** Repatriation.
      *   *Cost:* Loss of teaching collection. Borne by the institution (the wrongdoer).
      *   *Unaffiliated:* For those not linked to the Tribe, the remedy is "Reburial with dignity" rather than "Return to specific group."
  6.  **Consistency:** Consistent with NAGPRA principles (even if private).
  **Draft Finding:**
  *   **Acknowledgment:** Remains were taken without consent using university resources.
  *   **Liability:** The University is currently in possession of human remains against the will of the community. This is an ongoing harm.
  *   **Remedy:** Immediate repatriation to the Tribe. Unaffiliated remains to be reburied in consultation with ethical experts.
  *   **Guilt:** The act was unethical at the time (notes record objection). The University accepts responsibility for the continued retention.

  ### Case 3: National Reparations Fund
  **Run-through:**
  1.  **Categorization:** **General Atmospheric Benefit.** ("Operating inside a slave economy").
      *   *Procedure:* **Stop Point A.**
      *   *Action:* Do not proceed to Remedy. Proceed to Step 6 (Acknowledgment).
  2.  **Continuity:** No specific asset. No specific agent. Diffuse benefit.
      *   *Result:* Fails Institutional Continuity Test for *material* liability.
  3.  **Successor:** "National" / "Descendants of Slavery." Too dispersed for specific restitution without legislative framework.
  4.  **Remedy:** Contribution to national fund.
      *   *Check:* Is this proportional? No metric exists.
      *   *Check:* Who bears cost? Current operating budget (Third parties).
  **Draft Finding:**
  *   **Acknowledgment:** The University operated within and benefited from the slave economy.
  *   **Liability:** The Committee finds no specific institutional asset traceable to this general benefit that establishes a discrete political liability for *reparations* distinct from general social obligation.
  *   **Remedy:** The University should issue a statement of acknowledgment and consider voluntary contributions to social justice initiatives as a matter of policy, not adjudicated debt.
  *   **Guilt:** No institutional guilt.
  *   **Reasoning:** To adjudicate this as a debt requires a metric the Committee cannot establish without arbitrary line-drawing. This is a legislative or Board policy question, not an adjudicative one.

  ---

  ## Limitations and Blind Spots

  **1. The "Clean Hands" Problem:**
  This procedure assumes the University *should* exist and adjudicate. It cannot handle petitions arguing that the University itself is illegitimate (e.g., "Return all land and dissolve"). The procedure presupposes the institution's continuity is desirable. If the petition challenges the University's right to hold *any* assets, the procedure breaks.

  **2. The Quantification of Dignity:**
  In Case 2 (Remains), the procedure treats repatriation as the obvious remedy. It cannot calculate the "value" of dignity. If the University argues "These remains are worth $50M in research value," the procedure has no metric to weigh research utility against human dignity other than the "Ongoing Harm" filter. It biases heavily toward the claimant in dignity cases.

  **3. The "Good Works" Defense:**
  The procedure does not have a mechanism to offset liability with unrelated good deeds. (e.g., "We did bad thing X, but we also funded Hospital Y"). This is intentional (no moral ledger), but it means the procedure will always output "Liability" where continuity exists, regardless of the University's net social good. This may produce findings that feel ungenerous to the institution's overall history.

  **4. The Board Veto:**
  The procedure creates a "Risk Memo" for financial threats (Case 1). In practice, Boards often treat Risk as Moral. If the Board rejects the Finding due to the Risk Memo, the Procedure's distinction between *Liability* and *Cost* collapses. The Committee must be prepared for its moral finding to be overruled by financial pragmatism, which the Procedure cannot prevent.

  **5. Silence as Truth:**
  The "Adverse Inference" rule (Step 4) is necessary but dangerous. If the archive was destroyed by fire (not malice), the procedure treats silence as guilt. The Committee must verify *why* the record is silent before applying the inference. The procedure assumes archive silence is strategic; if it is accidental, the procedure generates false positives.

  **6. The "Values Hand-off" Trap:**
  I have designated specific points as "Value Hand-offs." In reality, *every* step involves values. Defining "Benefit" (Step 2) is a value judgment. Defining "Successor" (Step 3) is a value judgment. The Procedure masks this by calling them "Tests." The Committee must not become complacent; they are making moral choices at every "Yes/No," even when the procedure claims it is a fact check.
