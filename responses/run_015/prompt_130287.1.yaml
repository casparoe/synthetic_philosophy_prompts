answer: |-
  You are tying yourself in knots because you are trying to solve a metaphysical problem (what *is* causation?) with a moral tool (what is *blameworthy*?), while simultaneously trying to respect the physics of counterfactuals. This is the classic "Omission Problem" in philosophy of action and law.

  Your working principle is actually very close to the dominant solution in legal theory and a significant camp in metaphysics (often associated with H.L.A. Hart, Tony Honoré, or Sarah McGrath). You are intuitively reaching for a **Normative Counterfactual Theory**.

  Here is a precise formulation that will get you through the seminar, handle your cases, and give you a clear line of defense when students push back.

  ### The Principle: Normatively-Grounded Counterfactual Dependence

  > An omission $O$ by entity $E$ is a cause of outcome $X$ if and only if:
  >
  > 1.  **Counterfactual Dependence:** Had $E$ performed the specific action $A$ (which constitutes the non-omission), $X$ would not have occurred (or would have occurred significantly differently); **AND**
  > 2.  **Normative/Functional Expectation:** $E$ was subject to a relevant normative duty, social role, or functional design specification requiring $A$ at that time.

  **Why this works:** It treats causation by omission not as a "ghostly push" (metaphysically suspicious) but as a deviation from a **normal or expected course of events**. The "cause" is the deviation from the norm, not the mere absence of action.

  ---

  ### Application to Your Verdicts

  This principle validates most of your intuitions but forces a hard choice on Case 8.

  *   **Cases 1 (Lifeguard) & 3 (Promise):** **Validated.** Dependence holds (watering/saving prevents death); Expectation holds (job/promise).
  *   **Cases 2 (Sunbather) & 4 (Stranger):** **Validated.** Dependence holds, *but* Expectation fails. There is no norm violated. Therefore, no causation. This solves your bug: the counterfactual shape is the same, but the causal status differs because causation by omission is *context-sensitive*.
  *   **Case 5 (Flood):** **Validated.** Dependence fails. Even if you watered, it dies. Not a cause.
  *   **Case 6 (Chip Fab):** **Validated.** Dependence holds. Expectation is *functional* (design specification), not moral. The machine "ought" to rinse according to its program.
  *   **Case 7 (Nurse):** **Validated.**
      *   *Death:* Dependence fails (patient dies at 4am either way). Not a cause of death.
      *   *Agony:* Dependence holds (2am dose prevents 2 hours of pain). Expectation holds. Cause of agony.
      *   *Teaching Point:* This shows causation is *outcome-specific*. You can cause the pain without causing the death.
  *   **Case 9 (Frank):** **Validated.** Dependence holds (if he came, quorum met). Expectation holds (faculty membership implies attendance duty), regardless of his personal habit. The "supposed to" is institutional, not psychological.

  ### The Verdict You Must Abandon: Case 8 (The 10,000 Donors)

  This principle forces you to say: **No single individual caused the death.**

  If the kid needs £50,000 and 10,000 people withhold £5, no *single* person's £5 is counterfactually sufficient to save the kid. Condition 1 fails for every individual.
  *   **The Trade-off:** You can save the intuition that "The Group caused the death" by treating the *collective* as the Entity $E$. But you must abandon the idea that *individual* omissions were causes.
  *   **Why this is good for teaching:** It forces students to confront the difference between **individual causation** and **collective responsibility**. If you want to blame the individuals, you need a moral theory, not a causal one.

  ---

  ### The Dithering Case: Spite vs. Hallucination

  **The Scenario:** Gardener A (promised to water) hates you and withholds water out of spite. Gardener B (promised to water) is hallucinating with a fever and forgets to water. Plant dies in both cases.

  **The Verdict:** **Both omissions caused the death equally.**

  **The Reasoning:** Under the Normatively-Grounded Counterfactual Principle, the *mental state* of the omitter is irrelevant to causation.
  1.  **Dependence:** In both worlds, watering saves the plant.
  2.  **Expectation:** In both worlds, the promise creates the expectation/duty.

  **The Distinction:** The difference lies entirely in **culpability**, not causation.
  *   Gardener A is *morally culpable* (malice).
  *   Gardener B may be *excused* (incapacity), but the causal chain is identical.
  *   **Teaching Tip:** Use this to separate the metaphysics (what happened?) from the ethics (who is to blame?). Causation is the bridge; blame is what crosses it.

  ---

  ### Vulnerabilities: Where This Principle Breaks

  To teach this honestly, you must show students where the principle bleeds. Here are the two points most likely to break your principle (and what would change your mind about using it).

  #### 1. The "Two Lifeguards" Problem (Overdetermination)
  **Scenario:** Two lifeguards are on duty. Both fall asleep. Toddler drowns. Either one waking up would have saved the child.
  **The Break:** Condition 1 (Counterfactual Dependence) fails for *both* guards. If Guard A had woken up, the child still dies (because Guard B is asleep? No, if A wakes, child lives). Wait—if *both* are required? No, usually either suffices.
  *   If either suffices: Guard A says "If I had acted, child lives." Guard B says "If I had acted, child lives." But since *both* omitted, we have symmetric overdetermination.
  *   **The Fix:** You must modify Condition 1 to allow for **Minimal Sufficient Sets**. (i.e., Was this omission part of a set of omissions that jointly guaranteed the outcome?)
  *   **What changes my mind:** If you find yourself needing to explain symmetric overdetermination in week 1, drop the strict counterfactual requirement. Switch to a "NESS" test (Necessary Element of a Sufficient Set).

  #### 2. The Metaphysical Cost (The Sunbather Objection)
  **The Objection:** A hardline metaphysician (like David Lewis) will tell you: *"Causation is a feature of the universe's structure, not human norms. The Sunbather **did** cause the death. You just don't want to blame him. Don't confuse causation with responsibility."*
  **The Break:** If your seminar is on *metaphysics*, my principle is heresy. It imports norms into the fabric of reality.
  **The Defense:** If your seminar is on *law, ethics, or action theory*, my principle is standard. Omissions aren't "events"; they are descriptions of events relative to expectations.
  **What changes my mind:** If a student argues that "causation must be mind-independent," you must concede that under a purely physicalist view, the Sunbather *is* a cause. You are defending a **pragmatic/normative** theory of causation, not a **fundamentalist** one. Be explicit about this distinction.

  ### Summary for the Podium

  If you need a cheat sheet for the whiteboard:

  1.  **Causation requires Dependence:** Would the outcome change if they acted?
  2.  **Omission requires Expectation:** Were they supposed to act? (Role, Promise, Function).
  3.  **Motive is Irrelevant:** Spite and Fever are causally identical; morally distinct.
  4.  **Collectives are Tricky:** Individuals rarely cause outcomes in threshold cases; groups do.

  This framework respects your intuitions on 1–7 and 9, clarifies the Spite/Fever case, and gives you a philosophically defensible reason to reject individual causation in Case 8. Good luck with the seminar.
