  **Scenario**
  You are a junior technician in a certified metrology lab, standing before a standard kilogram prototype enclosed in glass. Your visual and tactile engagement (through gloves) yields a determinate perceptual cognition (*savikalpaka-pratyakṣa*): "This is a mass of one kilogram," based on its certified markings and physical equivalence to the reference standard you were trained on. Simultaneously, the Chief Metrologist—an *āpta* whose knowledge of the object's calibration history is infallible and whose testimony carries authoritative weight—declares, "This object is currently decertified and legally constitutes a null-mass standard." The collision is immediate: your perception affirms the property "one-kilogram-ness" (*ekatva* and *mānatva*) residing in the substance, while the testimony denies that very property's validity in the current context, not by altering the object's physical appearance but by altering its ontological status within the measurement system.

  **Nyāya Machinery and Conflict Resolution**
  In Nyāya terms, your cognition arises from *indriya-sannikarṣa* (sensory contact) satisfying the conditions for *pratyakṣa*: the object is present, the senses are intact, and the cognition is determinate (*savikalpaka*), qualifying the substance with the universal "kilogram-ness." The Metrologist's statement satisfies the conditions for *śabda-pramāṇa*: it is an *āptavākya* (statement of a trustworthy person) where the speaker has direct knowledge of the calibration status (*yathārtha*) and no intent to deceive. The conflict (*virodha*) arises because both *pramāṇas* claim to reveal the same *viṣaya* (object) but predicate contradictory properties (*viruddha-viśeṣaṇa*): "is a valid kilogram" vs. "is a null standard." Classical Nyāya resolves *pramāṇa-virodha* via the principle of *bādha* (sublation): since *pramāṇas* cannot contradict reality (*tattva*), one cognition must be *apramā* (invalid). The school delivers an asymmetrical verdict favoring *śabda* in this specific technical domain. The reasoning is not that perception is sensorially flawed, but that *śabda* accesses the *adhikāra* (competency/contextual validity) which is *atīndriya* (beyond the senses). Perception grasps the *svarūpa* (form), but Testimony grasps the *saṃketa* (conventional designation) which defines the object's functional reality. Thus, the perceptual cognition is sublated (*bādhita*); it remains a valid experience of form but is rendered invalid as a knowledge-claim of status.

  **The Honest Feature and the Deflationary Test**
  The single feature doing the work here is **conventional designation (*saṃketa*) overriding sensory appearance**. If you remove the element of institutional certification (the *saṃketa*), the case collapses into the trivial default: perception beats unreliable testimony, because without the convention, the Metrologist is just making a false claim about a physical object. Regarding the deflationary move you mentioned: the Nyāya theorist *will* argue that your perceptual cognition was never truly determinate (*savikalpaka*) regarding the "valid kilogram" status, but only regarding the "marked metal" appearance; the judgment "valid kilogram" was actually a hidden inference (*anumāna*) based on the markings, which the testimony defeats. This deflationary reading *does* dissolve the strict *pratyakṣa* vs. *śabda* collision by reclassifying your cognition as *anumāna* vs. *śabda*. To make the case survive this deflation, you would have to modify the scenario so that the property perceived is **intrinsic yet context-dependent**, such as perceiving "fire" in a ritual context where the *āpta* testifies it is "symbolic fire" (e.g., a electric heater used for ritual). However, even then, Nyāya would likely argue you perceived "heat/light" (perception) and inferred "ritual fire" (inference). To force a genuine *pratyakṣa* vs. *śabda* standoff without stipulation is arguably impossible within strict Nyāya metaphysics, because they define *pramāṇa* as non-contradictory by nature; any contradiction *proves* one was not a *pramāṇa*. The best you can achieve is a scenario where the *source of the error* is not a sensory defect (*doṣa*) but a **domain limitation**, forcing the theorist to admit perception is valid *phenomenally* but *śabda* is valid *ontologically*.
