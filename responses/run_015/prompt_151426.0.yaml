      *   Specific Scenes? (Confession, Editing, Asylum)
      *   Mozart's vulnerability? (Covered)
      *   Philosophical addition? (Covered - Narrative Identity)

  8.  *(Self-Correction during drafting)*: I need to be careful not to simply summarize the plot. The user knows the plot. Focus on the *ethical implications* of the plot points. Use the term "Counterfactual Dignity Harm" explicitly.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a remarkably precise and fertile framework for analyzing *Amadeus*. Your distinction between **factual fidelity** (chronological/event accuracy) and **axiological fidelity** (alignment with the subject's value system and self-conception) cuts through the usual "artistic license" debate, which often treats all inaccuracies as equal. By introducing **counterfactual dignity harm**, you are effectively arguing that the dead possess a right to *narrative identity* that survives them, distinct from their right to factual correctness.

  Here is an analysis of *Amadeus* through your specific ethical lens, addressing the obligations owed to Salieri and Mozart, and what the film contributes to the philosophy of posthumous representation.

  ### 1. Salieri: The Primacy of Axiological Failure
  To answer your central question: *Amadeus* wrongs Salieri primarily through **axiological failure**, not factual invention.

  While the poisoning narrative is the most glaring factual lie, it is a plot device. The deeper ethical violation is the inversion of Salieri's interiority. The historical Antonio Salieri was a devout Catholic, a generous teacher (students included Beethoven, Liszt, and Schubert), and a man who died respected and secure in his position. He viewed music as a form of prayer and order.

  The film's Salieri, however, is constructed around a specific theological rebellion: he bargained chastity for fame, feels betrayed by God, and views music as a battlefield for divine favor. This is not just a lie about what he *did*; it is a lie about who he *was*.
  *   **Factual Fidelity Breach:** He didn't poison Mozart. This is correctable by history books.
  *   **Axiological Fidelity Breach:** He did not hate God, nor did he view himself as a mediator of mediocrity. This is a fundamental misrecognition of his soul.

  The **counterfactual dignity harm** here is severe because it strips Salieri of his actual agency. The real Salieri was a successful architect of Viennese musical culture. The film Salieri is a passive vessel for resentment. If the dead have an interest in how they are remembered, Salieri's interest lies in being remembered as a master craftsman and a man of faith. *Amadeus* replaces this with a persona of the "bitter hack," which constitutes a profound posthumous misrecognition.

  ### 2. Scene Analysis: Sites of Ethical Friction

  **The Framing Confession (The Priest's Study)**
  *   *Ethical Function:* This scene establishes the contract of the film. Salieri declares, "I speak for all the mediocrities."
  *   *Axiological Harm:* This is the site of the greatest dignity harm. The real Salieri likely died in a state of grace, reconciled with his standing. The film forces him into a confession of a sin (murder) he didn't commit and a spiritual state (despair) he didn't inhabit. It appropriates his voice to speak for a universal anxiety (mediocrity) that he personally may not have felt. It turns a specific human being into an allegorical function.

  **The Editing of Mozart's Manuscript**
  *   *Ethical Function:* This scene attempts to grant Salieri factual competence (he can recognize genius) while maintaining axiological bitterness (he resents it).
  *   *Defense of the Dramatist:* One could argue this scene defends the dramatist's right to appropriate. It shows Salieri as the only one who *truly* understands Mozart, granting him a kind of tragic intimacy with the genius that history denies. Here, the film argues that **emotional truth** (the pain of recognizing superior talent) outweighs **biographical truth**. It suggests that the obligation of the dramatist is to the *theme* (Genius vs. Mediocrity), not the *subject*.

  **The Final Institutionalization**
  *   *Ethical Function:* Salieri is wheeled through the asylum, blessing the "patron saint of mediocrities."
  *   *Axiological Harm:* This cements the inversion. The real Salieri died in his own home, honored. The film kills him twice: first physically, then socially, by casting him as a madman. This scene illustrates that the film views Salieri not as a person to be represented, but as a cautionary tale to be utilized. The dignity harm is total: he is denied a dignified end.

  ### 3. Mozart: Vulnerability Beyond the Music
  You ask if Mozart is protected by the survival of his music. I would argue he is **equally vulnerable to counterfactual dignity harm**, though of a different variety.

  *   **The Reduction of Genius:** By portraying Mozart as a scatological child ("I am a vulgarian!"), the film engages in the "Holy Fool" trope. It suggests his genius was an unconscious channeling rather than the result of intense intellectual labor and study.
  *   **Axiological Harm:** Mozart was a complex adult, a Freemason, and a shrewd businessman. The film's reduction of him to a giggling infant denies his agency and intellect. It implies that true genius must be innocent of the world.
  *   **The Music as Shield:** The music saves Mozart from being forgotten, but it does not save him from being misunderstood. The film creates a dichotomy: The Music is Divine, The Man is Filthy. This dualism harms the historical Mozart, who integrated his life and work. The audience leaves remembering the laugh, not the man. Thus, Mozart suffers a **reductionist dignity harm**: he is flattened into a symbol of Nature, just as Salieri is flattened into a symbol of Convention.

  ### 4. What *Amadeus* Adds to the Philosophical Debate
  Standard arguments about "artistic license" usually rest on utilitarian grounds: *The lie is justified because the art is good.* Your framework, applied to *Amadeus*, reveals something more complex about **Posthumous Personhood**.

  **A. The Right to Coherence**
  *Amadeus* suggests that the dead are vulnerable to **narrative disintegration**. The real Salieri had a coherent life narrative (Faith -> Craft -> Legacy). The film shatters this coherence to build a dramatic arc (Envy -> Murder -> Madness). The philosophical addition here is the idea that we owe the dead not just accuracy, but **narrative coherence** that aligns with their lived values. To impose a tragic arc on a life that was not experienced as tragic is a form of violence.

  **B. The "Universal" vs. The "Particular"**
  Shaffer's defense (in the play's notes) is that this is not a historical document but a fantasy about the pain of mediocrity. *Amadeus* forces us to ask: **Does the utility of a dead person as a symbol outweigh their right to remain a particular individual?**
  The film argues "Yes." It treats Salieri as raw material for a universal truth about envy. Your concept of *axiological fidelity* challenges this. It posits that the particularity of the individual's value system creates a boundary that art should not cross, even for universal themes.

  **C. The Ethics of Recognition**
  Finally, *Amadeus* illuminates the concept of **Recognition**. Hegel argued that self-consciousness exists only in being acknowledged by another. Posthumously, the dead rely on the living for this acknowledgment.
  *   *Factual Fidelity* acknowledges the dead's *actions*.
  *   *Axiological Fidelity* acknowledges the dead's *self*.
  *Amadeus* grants Salieri immense screen time (acknowledgment of existence) but denies him acknowledgment of self. This adds a crucial layer to the debate: It is possible to honor the dead by remembering their name while simultaneously dishonoring them by erasing their mind.

  ### Conclusion
  Through your lens, *Amadeus* stands as a case study in **justified axiological betrayal**. The film knowingly sacrifices Salieri's dignity to explore a philosophical question about the cost of genius.

  Does it wrong him? Yes. It constructs a persona the real Salieri would reject as blasphemous and false.
  Is it defensible? Aesthetically, yes. Ethically, it depends on whether you believe the dead have rights over their symbolic utility. *Amadeus* argues that the "Truth of the Human Heart" (the feeling of envy) supersedes the "Truth of the Record."

  Your seminar should conclude that **axiological fidelity** is a more rigorous and necessary ethical standard than factual fidelity. We can forgive a dramatist for moving a date or inventing a conversation. We should be much slower to forgive a dramatist who takes a devout man and makes him a nihilist, or a complex woman and makes her a muse. *Amadeus* works *because* it violates these obligations, which suggests that great art often requires an ethical transgression against the dead. The question your seminar must answer is whether that transgression is a price we are willing to let art pay.
