prompt: |-
  I'm a senior in an undergraduate seminar on representation, biography, and posthumous ethics, and I'm trying to work out whether dramatists owe the real dead obligations that go beyond simple factual accuracy. I'm particularly drawn to a distinction between factual fidelity—avoiding invented events—and what I want to call axiological fidelity: constructing a portrayal that respects the deceased person's own values and self-conception, even when every depicted scene actually happened. Alongside this, I'm considering the idea of counterfactual dignity harm—the specific wrong done when a representation builds a persona so alien to the real individual's self-understanding that they would experience it as a kind of posthumous misrecognition, regardless of whether the plot points are true. I'd like to read Miloš Forman's 1984 film Amadeus, with Peter Shaffer's play in the background, through exactly this lens. How does the film's wildly inaccurate but emotionally coherent portrait of Antonio Salieri relate to these two obligations? Does it wrong Salieri primarily by inventing the poisoning narrative and the mediocrity-envy plot, or does it commit the deeper axiological failure of constructing a Salieri whose inner values and self-image are systematically inverted? Which specific scenes—the framing confession to the priest, the court musician's humiliation, the final institutionalization—best illustrate either kind of failure, or alternatively defend the dramatist's right to appropriate a dead figure as an artistic foil? Where does the film resist this ethical reading: is Mozart's own portrayal protected by the survival of his music, or is he equally vulnerable to counterfactual dignity harm through the reduction of his genius to childish vulgarity? And finally, what does Amadeus add to the philosophical debate about what we owe the dead that a straight argument about historical license and artistic freedom fails to capture on its own?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Senior undergraduate student in a seminar on representation, biography, and posthumous ethics. This implies a high level of intellectual sophistication, familiarity with philosophical terminology, and a desire for nuanced argumentation rather than simple plot summary.
      *   **Core Topic:** Ethical obligations of dramatists to the real dead.
      *   **Key Concepts Introduced by User:**
          *   *Factual Fidelity:* Avoiding invented events.
          *   *Axiological Fidelity:* Respecting the deceased's values and self-conception.
          *   *Counterfactual Dignity Harm:* Wronging the dead by creating a persona alien to their self-understanding (posthumous misrecognition).
      *   **Subject of Analysis:** Miloš Forman's *Amadeus* (1984) / Peter Shaffer's play.
      *   **Specific Questions:**
          1.  How does *Amadeus* relate to factual vs. axiological fidelity regarding Salieri?
          2.  Is the wrong primarily factual (invented poisoning/envy) or axiological (inverted values/self-image)?
          3.  Which scenes best illustrate these failures or defend artistic appropriation? (Confession, humiliation, institutionalization).
          4.  Does Mozart's portrayal escape this harm due to his music, or is he also vulnerable (genius reduced to vulgarity)?
          5.  What does *Amadeus* add to the philosophical debate beyond standard "artistic license" arguments?

  2.  **Deconstruct the Ethical Framework:**
      *   The user's framework is strong. It moves beyond "did it happen?" to "is this *who they were*?"
      *   *Factual Fidelity* is the surface level. *Amadeus* fails this spectacularly (no poisoning, Salieri wasn't actually mediocre, they weren't enemies).
      *   *Axiological Fidelity* is the deeper level. Did Shaffer/Forman capture Salieri's *soul*? Salieri was a devout Catholic, a successful teacher, a respected craftsman. The film makes him a bitter, murderous atheist (at heart) who hates God.
      *   *Counterfactual Dignity Harm:* Would the real Salieri recognize himself? Would he feel violated?

  3.  **Analyze *Amadeus* through the Lens:**
      *   **Salieri:**
          *   *Factual:* He didn't poison Mozart. He wasn't mediocre (he was famous and skilled).
          *   *Axiological:* The real Salieri saw himself as a servant of God and music. The film Salieri sees himself as a victim of God's cruelty. This is a fundamental inversion of his theological and aesthetic worldview.
          *   *Dignity Harm:* High. The film turns a respected patriarch of Vienna into a cackling villain.
      *   **Mozart:**
          *   *Factual:* He wasn't quite that childish/vulgar (though he had scatological humor).
          *   *Axiological:* The film reduces his genius to "divine channeling" rather than hard work. It infantilizes him.
          *   *Dignity Harm:* Moderate to High. It risks turning a complex human into a "holy fool" caricature.
      *   **Defense of the Dramatist:** Shaffer explicitly states in the play's notes that this is *his* Salieri, not the historical one. It's a confession of *mediocrity* (universal), not a biography.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the distinction between factual and axiological fidelity. State the thesis: *Amadeus* commits a profound axiological failure regarding Salieri, but arguably justifies it through a higher thematic truth about genius and mediocrity, while Mozart suffers a different kind of reductionism.

      *   **Salieri: Factual vs. Axiological:**
          *   Address the poisoning (Factual).
          *   Address the envy/mediocrity (Axiological). The real Salieri was secure. The film Salieri is defined by insecurity.
          *   *Key Argument:* The axiological harm is deeper. A lie about an event can be corrected; a lie about character persists.

      *   **Scene Analysis:**
          *   *The Confession (Framing Device):* This is where the axiological inversion is clearest. He claims to be "the patron saint of mediocrities." The real Salieri would likely find this blasphemous or nonsensical.
          *   *Court Musician's Humiliation:* The scene where he edits Mozart's work. Shows his competence but also his bitterness. It illustrates the *dramatic* need for conflict, overriding historical respect.
          *   *Final Institutionalization:* "I speak for all the mediocrities." This cements the dignity harm. He claims a legacy of failure that the real man did not experience.

      *   **Mozart's Vulnerability:**
          *   Does the music save him? Yes and no. The music proves his genius, but the *man* is caricatured.
          *   The "childish vulgarity" is an axiological reduction. It suggests genius requires innocence/idiocy, denying Mozart's intellectual agency. This is also a dignity harm.

      *   **Philosophical Contribution:**
          *   What does this add to the debate?
          *   It shifts the focus from *truth* to *recognition*.
          *   It introduces the idea of "Posthumous Personhood." Do the dead have rights to their narrative identity?
          *   It highlights the tension between *Historical Truth* and *Mythic Truth*. *Amadeus* argues for the latter.
          *   The concept of "Axiological Fidelity" is the key takeaway. It's a better metric than "accuracy."

  5.  **Refining the Tone:**
      *   Must be academic but engaging.
      *   Use the user's terminology (*axiological fidelity*, *counterfactual dignity harm*).
      *   Avoid being overly defensive of the film or overly critical. Balance the ethical critique with the aesthetic defense.
      *   Ensure the distinction between Shaffer (playwright) and Forman (director) is acknowledged but treated as a unified text for this analysis.

  6.  **Self-Correction/Nuance Check:**
      *   *Correction:* Make sure not to say Salieri *was* a saint. He was a professional. The film makes him a monster.
      *   *Nuance:* Acknowledge Shaffer's own preface. He admits the fabrication. Does that absolve the ethical debt? Probably not entirely, but it changes the contract with the audience.
      *   *Nuance:* The user asks about "obligations." I need to conclude on whether those obligations were met or justifiably breached.
      *   *Refinement on Mozart:* The user asks if Mozart is protected by his music. I should argue that the music protects his *legacy*, but not his *biographical dignity*.

  7.  **Final Polish:** Check against the specific questions in the prompt to ensure all are answered.
