      *   Temporal/Continuity: State persists, victims disperse. Uptake is public, not transactional.
      *   Compensation: The rupture in moral repair.
      *   Critique of Framework: Good for institutional continuity, bad for heterogeneous recipients and non-liberal justice concepts.
      *   Conclusion: Hybrid function (Repair + Narrative Management).

