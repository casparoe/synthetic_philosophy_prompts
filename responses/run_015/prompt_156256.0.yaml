answer: |-
  This is a sharp distinction. You're right to correct "misled" to "mislead"—the active present tense matters here, because the mechanism is ongoing, not just a historical error.

  The standard defense of intuition pumps is that they function like telescopes: they bring distant conceptual objects into focus. Your "frame-locking" hypothesis suggests they function more like funhouse mirrors: they don't just magnify; they distort the geometry of the problem space by suppressing alternative coordinate systems.

  Here is the argument for why frame-locking is the primary source of philosophical error and stagnation, distinguishing between the cognitive mechanics we largely understand and the metaphysical implications that remain contested.

  ### 1. From Confusion to Misleading: The Phenomenology of Obviousness

  To argue that frame-locking *misleads* rather than merely *confuses*, we have to explain why philosophers feel confident in their errors. Confusion feels like fog; misleading feels like a clear view of the wrong thing.

  Frame-locking generates a specific phenomenological signature: **the feeling of inevitability.** When a pump works, it doesn't feel like you are making a choice to prioritize one value over another (e.g., "I am choosing to value agency over outcome"). It feels like you are *seeing* a moral fact ("Killing is worse than letting die").

  The mechanism works like this:
  1.  **Activation:** The pump introduces specific vocabulary ("switch," "plug," "fat man") that triggers evolved or culturally learned heuristics (risk aversion, contamination sensitivity, agency detection).
  2.  **Suppression:** By making these heuristics salient, the pump cognitively inhibits the retrieval of competing frames. In the Trolley case, the "switch" frame activates a "technical intervention" schema. This suppresses the "social trust" schema (what if this is a normal part of track maintenance?) or the "systemic responsibility" schema (who put the people on the track?).
  3.  **Conflation:** The mind conflates the *ease of processing* the framed scenario with the *truth of the judgment*. Because the counter-frames are suppressed, they don't generate the friction that usually signals a complex problem.

  This misleads us about reality because it presents a contingent psychological response as a necessary metaphysical insight. We aren't discovering the structure of morality; we are mapping the contours of our cognitive suppression mechanisms.

  ### 2. Explaining the Stalemate: Incommensurable Locks

  You asked why debates recycle for decades despite agreement on the "facts." Frame-locking explains this by suggesting the agreement on facts is superficial.

  In a standard stalemate (e.g., Experience Machine), both sides agree on the narrative facts: *You can plug in, you will feel happy, you won't know it's fake.* But they are not operating in the same cognitive environment.
  *   **Side A (No Plug):** Locked into a "Contact/Reality" frame. The suppression here hides the fact that "contact with reality" is itself a value judgment that might collapse under scrutiny (e.g., if reality is mostly suffering, is contact still good?).
  *   **Side B (Plug):** Locked into a "Hedonic/Experiential" frame. The suppression here hides the identity-continuity issues you mentioned.

  The debate recycles because neither side can unlock the other's frame using the *same pump*. The pump is the lock. To argue against the Experience Machine using the Experience Machine scenario is to play on the keyboard that is already tuned to the opponent's key.

  Consequently, philosophers spend decades refining the *details* of the case (adding wires, changing the duration, altering the memory wipe) trying to break the lock, when the lock is structural to the narrative form itself. They are tweaking the furniture in a room while ignoring that the doors are welded shut.

  ### 3. Settled Ground vs. Contested Ground

  To maintain rigor, we must separate what cognitive science tells us from what metaphysics allows.

  **Settled (Philosophy of Mind / Moral Psychology):**
  *   **Framing Effects are Robust:** It is settled that human judgment is highly sensitive to linguistic and contextual framing. The same outcome described differently (e.g., "90% survival" vs. "10% mortality") yields different preferences.
  *   **Intuitions are Constructed:** It is widely accepted in cognitive science that moral intuitions are not pre-existing perceptions waiting to be found, but are constructed in real-time based on available cues.
  *   **Suppression is Real:** Attentional mechanisms that highlight one feature of a problem necessarily reduce cognitive resources available for others.

  **Contested (Metaphysics / Normative Ethics):**
  *   **The Status of Intuitions:** It is *not* settled that frame-locking invalidates the intuitions. A realist might argue that even if our access is framed, the truth value of the intuition remains intact (just as a distorted telescope might still show you a star that is actually there).
  *   **The Existence of a "View from Nowhere":** It is contested whether there is a "frame-neutral" perspective to be had. If all cognition is framed, then accusing pumps of frame-locking might just be accusing them of being cognitive at all. The contention lies in whether we can calibrate frames to approximate truth, or if we are permanently locked.
  *   **Moral Reality:** Whether we are being misled about *moral reality* depends on whether such a reality exists independently of our cognitive frames. If moral anti-realism is true, we aren't being misled about reality; we are just being misled about our own consistency.

  ### 4. The Argument for Misleading Reality

  Here is the core synthesis: Frame-locking misleads us about reality because it creates **ontological drag.**

  When a frame is locked, it creates resistance to alternative descriptions. This resistance feels like the "weight" of reality. For example, in the Trolley case, the resistance to pushing the fat man feels like the moral weight of "human dignity." But if frame-locking is the primary mechanism, that weight is actually the cognitive cost of switching frames.

  Philosophers interpret this cognitive cost as metaphysical depth. They write papers defending the "sanctity of life" or "agent-relative constraints," believing they are describing the fabric of the universe. In reality, they are describing the friction of their own cognitive architecture.

  This explains the recycling: You cannot resolve a friction problem by arguing about the fabric. As long as the method relies on pumps that induce frame-locking, the field will generate endless literature describing the *symptoms* of the lock (the conflicting intuitions) rather than the *mechanism* of the lock (the suppression of alternative frames).

  ### Conclusion

  If your frame-locking hypothesis is correct, the stagnation in these debates isn't a failure of intelligence or rigor. It's a methodological ceiling. We are trying to use tools designed to lock frames (narrative cases) to unlock truths.

  The argument holds that we are misled because the *feeling* of clarity provided by the pump is mistaken for *accuracy*. We agree on the facts of the story because the story is simple; we disagree on the implications because the story has silently disqualified the very frames needed to resolve the disagreement. Until the method shifts from "pumping intuitions" to "unlocking frames," the debates will continue to recycle, mapping the boundaries of our cognitive suppression rather than the boundaries of moral or metaphysical truth.
