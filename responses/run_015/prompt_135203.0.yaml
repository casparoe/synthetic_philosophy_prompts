answer: |-
  This is a precise and significant structural problem in metaethics and normative theory. The tension you have identified—between the *authority* of the idealized judgment and the *identity* of the idealized judge—is often referred to as the "problem of normative alienation" or the "authority gap" in ideal advisor theories.

  To address your query with the requisite precision, I will distinguish between the conceptual architecture that is generally settled in the literature and the substantive disagreements regarding how that architecture functions. I will then address your specific questions regarding the survival of indirect normativity under substantive idealization.

  ### I. Conceptual Settlements: The Architecture of the Problem

  There is broad agreement on the definitions of the terms and the structural constraints of the debate. The following points represent the settled conceptual terrain:

  **1. The Distinction Between Procedural and Substantive Idealization**
  It is conceptually settled that these represent distinct loci of idealization.
  *   **Procedural Idealization:** Corrects cognitive limitations (ignorance, logical inconsistency, weakness of will) while holding the agent's *constitutive ends* (fundamental values, commitments, practical identity) fixed. The idealized agent is "you, thinking better."
  *   **Substantive Idealization:** Subjects the agent's constitutive ends to rational scrutiny. The idealized agent may discard or revise values the actual agent holds dear if those values are deemed incompatible with rational agency as such. The idealized agent is "a rational agent in your situation."

  **2. The Requirement of Continuity for Indirectness**
  There is consensus that for a theory to count as *indirect* normativity (as opposed to direct realism or externalism), there must be a continuity condition between the actual agent and the idealized counterpart. If the idealized agent is numerically or qualitatively distinct in a way that severs the link of *practical identity*, the prescription is no longer "what I would will" but "what one ought to will."
  *   **Settled:** If the idealization process replaces the agent's practical identity rather than refining it, the normative link shifts from *agent-relative authority* (autonomy/self-legislation) to *agent-neutral authority* (objective reason).

  **3. The "Goldilocks" Constraint**
  It is acknowledged that idealization faces a dilemma often attributed to the critique of desire-based theories (e.g., Williams) and Kantian constructivism (e.g., Korsgaard):
  *   **Too Procedural:** If the idealization is too thin (preserving all actual values), it loses critical bite (the "rational racist" or "rational slave" problem).
  *   **Too Substantive:** If the idealization is too thick (correcting values), it loses authority (the "alienation" problem).
  *   **Settled:** Any viable theory of indirect normativity must locate a threshold between these two failures. Where that threshold lies is the primary site of contestation.

  ### II. Genuine Contests: Where the Disagreement Lies

  While the structure of the problem is settled, the resolution is not. The following are the points of genuine philosophical disagreement. You should not treat any of these positions as consensus.

  **1. The Status of Constitutive Ends**
  *   **Contested:** Whether constitutive ends are subject to rational correction.
  *   **Side A (Internalist/Procedural):** Following a certain reading of Williams, constitutive ends are arational. Idealization can only clarify how to achieve them or resolve conflicts between them. To change them is to change the subject.
  *   **Side B (Externalist/Substantive):** Following Kantian or Platonic lines, certain ends are constitutive of rational agency itself. To hold contradictory or self-defeating ends is a failure of rationality, not just a difference in taste. Idealization *must* correct these to preserve agency.

  **2. The Source of Normative Force**
  *   **Contested:** What grounds the "ought" in indirect normativity?
  *   **Side A:** The force comes from *ownership*. The prescription binds me because it issues from *my* will (refined). If the will changes substantively, the ownership is lost.
  *   **Side B:** The force comes from *rationality*. The prescription binds me because it issues from *reason*. The "my" in "my idealized self" is merely the locus of application, not the source of authority.
  *   **Implication:** Side B risks collapsing indirect normativity into direct universalizability, but proponents argue it remains indirect because the universal law is mediated through the individual's rational constitution.

  **3. The Survival of Conflicted Commitments**
  *   **Contested:** Whether ambivalence or conflicting commitments are "noise" to be filtered out or "data" to be preserved.
  *   **Side A:** Deep ambivalence is a failure of coherence. The idealized self resolves the conflict by prioritizing one commitment over the other based on rational ordering.
  *   **Side B:** Some conflicts are constitutive of the agent's identity (e.g., conflicting moral obligations). An idealization that resolves them by eliminating one side misrepresents the agent's normative situation.

  ### III. Addressing Your Specific Conceptual Questions

  Based on the distinction between settled architecture and contested resolution, here is the analysis of your specific queries.

  **1. Can indirect normativity survive a shift from procedural to substantive idealization?**
  *   **Conceptual Requirement:** For indirect normativity to survive substantive idealization, a thesis of **Rational Continuity** must be established. This thesis claims that the values held by the substantively idealized agent are not *foreign* to the actual agent, but are *implicit* in the actual agent's status as a rational being.
  *   **The Contested Point:** Whether such continuity exists. If one accepts that rational agency entails specific substantive commitments (e.g., valuing humanity, consistency, non-contradiction), then substantive idealization preserves the "self" at the level of *agency* rather than *personality*. If one rejects this, substantive idealization breaks the indirect link.
  *   **Verdict:** It survives *only if* one accepts that practical identity is grounded in rational agency rather than contingent psychological commitments. This is not a conceptual truth but a substantive metaethical claim.

  **2. Does substantive idealization collapse indirect normativity into direct universalizability?**
  *   **Conceptual Risk:** Yes, functionally. If the "idealized counterpart" holds the same values as *any* rational agent in that position, the prescription is universalizable.
  *   **The Contested Point:** Whether "universalizability" entails "directness."
      *   **Constructivist View:** Argues that norms are still indirect because they are *constructed* by the agent's own rational activity, even if that activity yields universal results. The authority remains rooted in autonomy (self-legislation), not external truth.
      *   **Realist/Externalist View:** Argues that if the output is invariant across agents, the source of normativity is the objective rational order, making the "idealized self" a heuristic device rather than the source of authority.
  *   **Verdict:** It collapses into direct universalizability *in terms of output*, but whether it collapses *in terms of authority* depends on whether you view the procedure of rational deliberation as constitutive of the norm (indirect) or discoverative of the norm (direct).

  **3. Was indirect normativity always dependent on a hidden thesis about the preservation of practical identity?**
  *   **Analysis:** Yes. The coherence of indirect normativity relies on a **Gen-Identity Condition**. This is the claim that the idealized agent is the *same practical agent* as the actual agent.
  *   **The Hidden Thesis:** The thesis is that *practical identity is stable under rational reflection.*
  *   **The Conflict:** Procedural idealization assumes identity is located in *contingent commitments*. Substantive idealization assumes identity is located in *rational capacity*.
  *   **Verdict:** The shift from procedural to substantive idealization does not reveal a hidden thesis so much as it forces a choice between two competing theories of practical identity. If you hold the "contingent commitments" view, substantive idealization breaks the link. If you hold the "rational capacity" view, procedural idealization is insufficiently normative.

  ### IV. Summary for Your Dissertation

  To isolate the conceptual tension precisely in your work:

  1.  **Settled:** Indirect normativity requires a continuity of agency between the actual and idealized self. Substantive idealization alters the content of that agency. Therefore, substantive idealization puts pressure on the continuity condition.
  2.  **Contested:** Whether "agency" is defined narrowly (procedural coherence of existing ends) or broadly (substantive commitment to rational norms).
  3.  **The Collapse Question:** Substantive idealization leads to universalizable *prescriptions*. Whether this constitutes a collapse into direct *authority* depends on whether the authority is derived from the *outcome* of deliberation (direct) or the *activity* of deliberation (indirect).
  4.  **Recommendation:** Do not frame the shift from procedural to substantive idealization as a binary where one fails and the other succeeds. Frame it as a trade-off between **Critical Power** (substantive) and **Normative Resonance** (procedural). The "hidden thesis" you suspect is the claim that *Rationality and Identity are Co-Extensive.* If they are not, indirect normativity cannot sustain substantive idealization without alienating the agent.

  This distinction allows you to analyze specific accounts (e.g., Smith's advice model vs. Korsgaard's self-constitution) by asking where they locate the boundary of practical identity, without presupposing that one location is conceptually mandated.
