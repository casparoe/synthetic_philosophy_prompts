answer: |-
  ### Brainstorming the Conceptual Landscape

  The current literature on causal explanation in history is largely stagnant, trapped in a cycle of debating counterfactual dependence using standard possible-worlds semantics. The dominant question remains "Was X necessary for Y?" (e.g., the Archduke for WWI), which treats historical causation as a binary switch rather than a woven texture. This focus obscures how historians actually argue when they claim multiple causes contributed to an outcome. The genuine philosophical friction lies not in determining specific historical truths, but in clarifying the *logic of attribution* when causes are abundant.

  There are three specific knots in this landscape. First, there is a conflation of ontological sufficiency with explanatory necessity. Historians often cite causes that were not strictly necessary for the outcome to occur (because other causes could have produced it) but are necessary for the *story* to make sense. This is your proposed structural vs. narrative overdetermination distinction. Second, there is the problem of scale. Historians routinely cite individual agency, institutional rules, and systemic pressures in the same explanation without clarifying how these layers interact. Are they competing explanations or complementary components? Third, there is the issue of narrative coherence. When does a coherent story become a causal mechanism, and when is it merely a post-hoc rationalization?

  Much of the existing work is stuck because it tries to solve these problems using formal logic alone, ignoring the historiographical practice, or it dives into empirical history, losing philosophical generality. For a philosopher without archival access, the productive path is to analyze the *structure of historiographical argumentation* found in secondary literature. The goal is to move from evaluating whether causes are "true" to evaluating how causal claims function within an explanation.

  ### Defended Dissertation Agenda

  Your dissertation must prioritize questions that, if unresolved, render your specific distinction (structural vs. narrative overdetermination) incoherent. Therefore, the agenda is ordered by foundational dependency. You cannot analyze how scales interact (Rank 2) or how narrative functions (Rank 3) if the basic distinction between structural and narrative overdetermination (Rank 1) fails to map onto actual historical practice.

  **Rank 1: The Ontological and Explanatory Validity of the Structural vs. Narrative Overdetermination Distinction**
  This is the most upstream question. Your entire project rests on the claim that there is a meaningful difference between cases where macro-conditions are independently sufficient (structural) and cases where micro-threads are woven for coherence (narrative). If this distinction is merely verbal, or if historians do not actually recognize this difference in their practice, the subsequent work on scale and narrative loses its anchor.
  1.  **Upstream Rationale:** This defines the taxonomy of your dissertation. If structural and narrative overdetermination are not distinct phenomena, you cannot investigate their interaction.
  2.  **Tractability:** High. This requires conceptual analysis and the examination of secondary historical literature (books/articles) rather than primary archives. You are analyzing the *arguments* historians make, not the events themselves.
  3.  **Evidence to Change Rank:** If a systematic review of major historiographical debates reveals that historians consistently conflate these two modes without distinction, or if a formal model demonstrates they are logically identical, this question's priority would drop (as the project would need pivoting) or rise (as you would need to defend the distinction against strong counter-evidence).

  **Rank 2: The Logic of Integration in Scale-Heterogeneous Causation**
  Once the types of overdetermination are established, the next problem is how causes at different levels (individual, institutional, systemic) are combined. Historians often claim that an individual's decision *and* a structural economic shift *both* caused an event. Philosophy lacks a robust account of how these interact without falling into reductionism (everything is individual action) or reification (structures act like people).
  1.  **Upstream Rationale:** This addresses the "mechanism" of your proposed explanations. You need to know how causes across scales are permitted to coexist in a single explanation before you can analyze their overdetermination properties.
  2.  **Tractability:** Medium. This requires analyzing case studies in secondary literature where multi-scale explanations are prominent. It is conceptual work grounded in textual analysis of historical explanations.
  3.  **Evidence to Change Rank:** If a new philosophical framework emerges that successfully reduces all historical causation to a single scale (e.g., rigorous methodological individualism), this question becomes obsolete. Conversely, if historians demonstrate that cross-scale citations are always metaphorical rather than causal, priority rises to debunking that claim.

  **Rank 3: The Epistemic Status of Narrative Coherence in Causal Selection**
  This question addresses the "narrative overdetermination" side of your distinction. It asks whether narrative coherence is merely aesthetic or if it carries epistemic weight in selecting causes. If coherence is just stylistic, then "narrative overdetermination" is not a causal phenomenon but a rhetorical one.
  1.  **Upstream Rationale:** This refines the "narrative" half of your core distinction. It is downstream because it depends on accepting that narrative structures play a role in explanation (established in Rank 1 and 2).
  2.  **Tractability:** High. This is classic philosophy of history territory, analyzable through thought experiments and comparison of competing historical narratives.
  3.  **Evidence to Change Rank:** If cognitive science or psychology of history demonstrates that narrative coherence systematically leads to causal error (bias) rather than explanatory power, the priority would rise to address this normative challenge. If narrative is proven to be irrelevant to causal acceptance among experts, priority drops.

  **Deprioritized Questions**
  I recommend deprioritizing two lines of inquiry that are common traps for philosophy of history dissertations.
  1.  **Resolving Specific Empirical Controversies (e.g., "What really caused WWI?"):** This is lower priority because it requires archival expertise you do not have and shifts the work from philosophy of science to substantive history. Your goal is to analyze the *form* of explanation, not settle historical disputes.
  2.  **Developing a Formal Probabilistic Logic for Historical Counterfactuals:** This is lower priority because it often disconnects from actual historiographical practice. Historians rarely use explicit probability calculus. Investing three years in formal modeling risks producing a system that historians do not recognize and philosophers of science find too niche, whereas conceptual analysis of practice yields broader interdisciplinary relevance.

