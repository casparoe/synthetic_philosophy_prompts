  3.  **Address the Specific Questions:**

      *   **Premature vs. Immunised:**
          *   *Premature:* The mechanism is robust, but the *initial conditions* were misjudged. Example: Predicting a solar eclipse but getting the orbit slightly wrong. The physics is right, the data is off. In Malthus's case, he didn't account for the *elasticity* of food production (tech) or the *elasticity* of reproduction (social norms).
          *   *Immunised:* Adding clauses like "unless technology improves" *after* the fact, without a theory of *why* or *when* technology improves. If Malthusians say "Neo-Malthusianism applies *except* when it doesn't," that's immunisation. If they say "Resource constraints apply *once technological growth rate < population growth rate*," that's a refined boundary condition.

