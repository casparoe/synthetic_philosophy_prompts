          *   *However:* In complex systems (economics, ecology), "ceteris paribus" (all else being equal) is heavy lifting. If "all else" wasn't equal, the core theory might survive, but the *application* was wrong.
          *   *The "Wait" Rule:* There isn't a hard rule. It depends on whether the delay is explained by the theory itself or by external excuses.

