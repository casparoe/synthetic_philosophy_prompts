          *   *Best Path:* I will propose a "High-Risk Career Choice" scenario. I will assess the Genetic/Epigenetic framing as *unsuitable* for this specific session because it obscures the agency component which is central to correcting the meritocracy confusion.

      *   **Phase 4: Head Off Misconceptions (Integrated):**
