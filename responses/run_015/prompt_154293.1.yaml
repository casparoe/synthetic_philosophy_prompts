answer: |-
  Here is a pedagogical architecture designed for a 90-minute graduate seminar session. It is structured to dismantle the "Meritocracy" misreading by forcing students to derive the Luck Egalitarian (LE) principle from intuitions they already hold, rather than imposing the taxonomy upon them.

  ### I. Session Sequence: The Order of Conceptual Introduction (0–60 mins)

  Do not begin by defining Luck Egalitarianism. Begin with the **justificatory gap** in Rawls.

  **1. The Rawlsian Residual (0–15 mins)**
  *   **Activity:** Briefly reconstruct the "Natural Lottery" argument from *A Theory of Justice*. Ask students: "Rawls argues we don't deserve our natural assets. But he allows inequalities if they benefit the least advantaged (Difference Principle). Why does he allow *any* inequality traceable to the natural lottery?"
  *   **Goal:** Elicit the tension. Rawls prioritizes the *social* basis of self-respect and stability over neutralizing all luck.
  *   **Transition:** Pose the LE challenge: "What if we took the 'moral arbitrariness' of the natural lottery more seriously than Rawls did? What if the *only* justification for inequality was responsible choice?"

  **2. The Carrying Example & The Distinction as Tool (15–45 mins)**
  *   **The Anchor Scenario:** **The Dual-Track Career.**
      *   *Setup:* Two agents, Alpha and Beta, have identical native endowments (intelligence, health, social capital).
      *   *Path A:* Alpha chooses a safe, stable career with a predictable median income.
      *   *Path B:* Beta chooses a high-risk, high-reward career (e.g., entrepreneur or artist).
      *   *Outcome 1:* Beta fails and earns significantly less than Alpha.
      *   *Outcome 2:* Beta succeeds and earns significantly more than Alpha.
  *   **Pedagogical Labor:** Do not define "Brute" and "Option" luck yet. Ask: "In Outcome 1, does Alpha owe Beta a transfer to equalize income?"
      *   If they say **Yes:** They are strict egalitarians (not LE).
      *   If they say **No:** Ask **Why?**
      *   *The Pivot:* Students will likely cite "Beta took the risk." You then introduce the **Brute/Option Luck distinction** not as a definition, but as the *label for the justification they just provided*.
      *   *Labor:* The distinction now explains *why* the inequality is permissible. It is not a taxonomy of events; it is a boundary marker for **valid claims of justice**.
      *   *Refinement:* Introduce a "Background Shock" (e.g., a recession hits only Beta's sector through no fault of their own). Now ask if compensation is due. This forces the distinction to do work separating "risk inherent to choice" (Option) from "risk inherent to circumstance" (Brute).

  **3. Assessment of the Genetic/Epigenetic Framing**
  *   **Verdict:** **Do not use the modified genetic-lottery/epigenetic framing as your primary anchor for this specific group.**
  *   **Rationale:** While philosophically rich, this framing possesses the **wrong properties** for students prone to the meritocracy misreading.
      *   *Risk 1:* It triggers Rawlsian "natural assets" reflexes. Students will conflate "genetic disadvantage" with "lack of talent," sliding back into Difference Principle reasoning (investing in the talented to help the untalented) rather than LE reasoning (compensating for unchosen disadvantage).
      *   *Risk 2:* Epigenetics blurs the line between environment and biology. For students struggling to grasp the *agency* component of LE, an example where the environment biologically embeds itself obscures the moment of *choice* required to establish Option Luck.
      *   *Recommendation:* Stick to the **Dual-Track Career**. It isolates *choice under uncertainty* (Option Luck) from *unchosen disadvantage* (Brute Luck) more cleanly, preventing the slide into "biological determinism" which masks the normative question of responsibility.

  ### II. Misconception Management: The Slide to Moral Desert (45–60 mins)

  **The Predictable Misconception:**
  Students will argue that Alpha compensates Beta (in the Background Shock case) because Beta is "innocent" or "virtuous" in their suffering, or that Alpha keeps their surplus in Outcome 2 because they "deserve" the reward of their prudence. This converts LE into a Meritocratic system where justice tracks moral worth.

  **The Intervention Point:**
  Intervene **immediately after** they justify why Beta keeps their surplus in Outcome 2 (Success).
  *   **Student Claim:** "Beta deserves the high income because they took the risk and worked hard."
  *   **Instructor Correction:** "Stop. LE is not a theory of **Desert**; it is a theory of **Justification**."
  *   **The Move:** Explicitly decouple *permission* from *praise*.
      *   *Script:* "Luck Egalitarianism does not say Beta *morally deserves* the surplus in a cosmic sense. It says the inequality is **not unjust**. There is a difference between 'I am entitled to keep this' and 'I am virtuous for having this.' If we ground this in desert, we return to Meritocracy. We must ground it in the **absence of a claim by others**. Alpha cannot claim Beta's surplus because Alpha had the same option to take the risk."
  *   **Hardening Prevention:** Require students to rephrase their justification without using words like "deserve," "earn," or "merit." They must use "traceable to," "option," or "choice."

  ### III. The Bracketed Fork (60–75 mins)

  **The Fork:** **The Currency of Egalitarian Justice (Resources vs. Welfare).**
  *   **The Decision:** Explicitly refuse to resolve whether we should equalize access to **resources** (Dworkin) or **welfare/opportunity for welfare** (Arneson/Cohen).
  *   **Justification for Bracketing:**
      *   This session's objective is to secure the **basis** of redistribution (Luck vs. Choice), not the **metric** of redistribution.
      *   Debating currency prematurely allows students to hide their confusion about responsibility behind technical disputes about "expensive tastes" or "handicaps."
      *   *Instruction to Students:* "For the next 75 minutes, assume the currency is 'overall advantage.' Whether that is measured in dollars, welfare units, or capabilities is irrelevant to the structural question of *why* we redistribute. Do not let the 'how much' question distract you from the 'why' question."

  ### IV. The Diagnostic Question (75–90 mins)

  Do not ask for a definition. Ask for a judgment on a boundary case that separates the **Meritocratic** reading from the **Structural** reading.

  **The Question:**
  > "Consider a society where everyone starts with identical brute luck. Person A chooses to work 60 hours a week. Person B chooses to work 20 hours a week to pursue leisure. Person A produces significantly more wealth.
  >
  > **According to Luck Egalitarianism, is taxing Person A to subsidize Person B's leisure *unjust*? If so, is it unjust because Person A *deserves* the reward for their effort, or for a different reason?**"

  **Assessment Criteria:**
  *   **Fail (Meritocracy Reading):** "Yes, it is unjust, because Person A worked harder and deserves the fruit of their labor." (This conflates LE with Libertarian/Meritocratic desert).
  *   **Fail (Strict Equality Reading):** "No, it is not unjust, because equality of outcome is the priority." (This misses the Option Luck permission).
  *   **Pass (LE Structural Reading):** "Yes, it is unjust to tax A, **but not because A deserves the reward.** It is unjust because the inequality is traceable to B's **option luck** (choice of leisure). B had the same opportunity to work; the disadvantage is self-imposed. The injustice lies in the lack of a valid claim by B, not the moral virtue of A."

  **Why this works:** It forces the student to affirm the *outcome* (no redistribution) while rejecting the *meritocratic justification* (desert). This confirms they understand LE as a view about the **conditions of justified inequality**, not a view about **rewarding virtue**.
