prompt: |-
  For a graduate seminar I am co-leading this term, I need to design a single ninety-minute explanatory session on luck egalitarianism for students who have already internalized Rawls's framework but consistently misread luck egalitarianism as a meritocratic add-on rather than a structurally distinct normative commitment. Rather than asking you to lecture me on the view itself, I want you to plan the pedagogical architecture: the precise order in which the conceptual pieces must be introduced so that the brute-luck versus option-luck distinction does philosophical labor rather than functioning as a mere taxonomy; the one carrying example or scenario that should anchor the entire discussion, including an assessment of whether a modified genetic-lottery framing that incorporates epigenetic environmental variability possesses the right properties and avoids the wrong ones; the predictable misconceptions these particular students will generate—especially the slide from neutralizing brute luck to fully endorsing moral desert—and the exact point in the sequence where each misconception should be headed off before it hardens; a single diagnostic question I can pose at the close to determine whether they have understood that equality concerns the distribution of advantages not traceable to responsible choice, rather than having merely memorized the vocabulary; and finally, which major live fork—such as the debate between resourcist and welfarist interpretations—I should explicitly bracket and refuse to resolve at this level, with a brief justification for leaving it open.
