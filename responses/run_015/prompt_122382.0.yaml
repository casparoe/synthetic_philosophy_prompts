answer: |-
  Here's the deal. You're running into what we call "Pascal's Mugging" in the trade. It's when someone hands you a number so big it blinds you to the fact that the probability attached to it is basically made up. Expected value math works great for casinos; it works terrible for existential speculation.

  I've built a filter for this. It's not a formula; it's a triage protocol. It's designed to kill the nonsense early so you don't waste hours debating the utility of infinity.

  Here is the **Epistemic Sanity Checklist**. Run pitches through this in order. If they fail a step, you stop.

  ### The Checklist Flow

  **Step 1: The Probability Grounding Test**
  *   **Question:** Where did the probability number come from? Is it based on historical frequency, physical models, or expert consensus? Or is it derived from a theoretical model that assumes its own conclusion?
  *   **Pass:** The number comes from data (e.g., asteroid tracking), calibrated forecasting, or peer-reviewed physical constraints.
  *   **Fail:** The number comes from a logical possibility ("It's not impossible"), a made-up distribution, or a chain of dependencies where each link is uncertain.
  *   **STOP POINT (BROKEN):** If they can't show you the work for the probability, **don't publish this framing.** It's not risk assessment; it's fiction. You cannot multiply zero (or "unknown") by infinity.

  **Step 2: The Utility Ceiling Check**
  *   **Question:** Is the payoff actually coherent? Are they counting "potential lives" that don't exist yet, or actual suffering happening now? Does the value scale linearly forever, or does it hit a dimming return?
  *   **Pass:** The payoff is bounded (e.g., saving existing humans, preventing concrete suffering).
  *   **Fail:** The payoff relies on unbounded future generations (e.g., "trillions of digital minds"), or assumes value increases infinitely without limit.
  *   **STOP POINT (VALUES CALL):** If the argument hinges on weighing non-existent future beings against existing ones, **this isn't a math error, it's a values call, hand it to a human.** Math can't solve whether a potential person counts as much as a real one. That's philosophy, not journalism.

  **Step 3: The Sensitivity Stress Test**
  *   **Question:** If you change the probability estimate by one order of magnitude (make it 10x smaller or larger), does the conclusion collapse?
  *   **Pass:** The argument holds even if the risk is significantly over- or underestimated. (Robustness).
  *   **Fail:** The entire argument disappears if the probability drops from 1% to 0.1%.
  *   **STOP POINT (FRAGILE):** If the policy recommendation flips based on a decimal point shift, **there's no right answer without judgment.** You cannot justify reordering society on a knife-edge estimate.

  **Step 4: The Opportunity Cost Reality Check**
  *   **Question:** What specifically is being defunded or ignored to pay for this? Is the cost abstract ("some efficiency") or concrete ("closing 500 schools")?
  *   **Pass:** The trade-off is explicit and the benefits of the alternative are accounted for in the same utility currency.
  *   **Fail:** They treat current suffering as "sunk cost" or ignore the immediate harm of diverting resources.
  *   **STOP POINT (HIDDEN COST):** If they wave away the immediate human cost as "distraction," **don't publish this framing.** It's moral evasion.

  **Step 5: The Convergence Test**
  *   **Question:** Do unrelated models or experts arrive at similar risk assessments? Or is this one group using one specific framework?
  *   **Pass:** Multiple independent lines of evidence point to the risk.
  *   **Fail:** Only one think tank using one specific moral framework sees this priority.
  *   **STOP POINT (ECHO CHAMBER):** If it's isolated to one ideology, **this isn't a math error, it's a values call.**

  ***

  ### Running the Cases

  Let's run your three pitches through the machine.

  #### Case 1: The Asteroid Deflection (40B, 1-in-90k chance)
  *   **Step 1 (Probability):** Pass. Astronomers track near-earth objects. The 1-in-90k is based on orbital mechanics and historical impact data. It's not a guess.
  *   **Step 2 (Utility):** Pass. The payoff is preventing human extinction. It's bounded (everyone alive now + near future). It doesn't rely on saving "potential trillions" in other universes.
  *   **Step 3 (Sensitivity):** Pass. Even if the risk is 1-in-900k, extinction is bad enough that insurance is worth it. It's robust.
  *   **Step 4 (Cost):** Pass. 40B is huge, but it's usually framed as a fraction of defense budgets, not "close all schools."
  *   **Verdict:** **Valid Risk Management.**
  *   **Journalist Note:** This isn't Pascal's Mugging. This is buying fire insurance for the planet. The math holds because the probability is grounded in physics, not speculation. You can write this up as a serious policy debate.

  #### Case 2: Farmed Animals vs. Human Health (Future Suffering Argument)
  *   **Step 1 (Probability):** Pass-ish. We know animals suffer now. The probability of future suffering is high if farming continues.
  *   **Step 2 (Utility):** **FAIL.** This is where it breaks. The argument usually relies on the "Longtermist" claim that the number of future animals (or digital beings) is so vast it dwarfs current humans.
  *   **STOP POINT:** **This isn't a math error, it's a values call, hand it to a human.**
  *   **Journalist Note:** Stop trying to calculate the "expected value" of this. The math isn't the problem; the moral premise is. They are asking you to accept that a potential being in year 3000 counts equal to a starving child today. That is a philosophical stance, not a statistical finding. If you publish this as "The Math Says We Must Ignore Humans," you've been played. Frame it as "A Radical Ethical Claim," not "A Statistical Imperative."

  #### Case 3: The AI Alignment Gamble (The Uncomfortable One)
  *   **Proposal:** Spend 10% of global GDP on AI safety research.
  *   **Pitch:** There's a 5% chance AGI kills everyone within 20 years. The payoff is infinite (survival). The cost is high but manageable.
  *   **Step 1 (Probability):** Pass (Borderline). Expert surveys (not just one guy) give non-zero probabilities of catastrophic loss of control. It's not *just* vibes; it's based on capability trends.
  *   **Step 2 (Utility):** Pass. Human extinction is a bounded, coherent negative utility.
  *   **Step 3 (Sensitivity):** Pass. Even if the risk is 0.5%, many economists argue the EV of avoiding extinction warrants massive spend.
  *   **Step 4 (Cost):** Pass. 10% of GDP is concrete, but the argument acknowledges the trade-off.
  *   **Step 5 (Convergence):** Pass. Growing consensus among safety researchers, though disputed by others.
  *   **Verdict:** **Valid but I still hate it.**
  *   **Journalist Note:** This is the nightmare scenario for your checklist. The argument passes the epistemic checks. The probability isn't made up (it's expert elicitation), the utility is coherent (extinction), and it's robust. The checklist forces you to admit: *Logically, this holds water.* Even if you think 10% of GDP is insane, the math isn't the error. The error would be dismissing it because the conclusion is too radical. You have to report this as "The Logic Holds, But Can We Afford It?" rather than "The Math is Wrong."

  ***

  ### Where This Thing Breaks (The Fine Print)

  Look, I'm not selling you a magic wand. This checklist has blind spots. Here's where you need to use your own brain:

  1.  **The "Expert" Trap:** Step 1 relies on expert consensus. But experts can be groupthinkers. If every expert in a niche field is funded by one ideology, Step 5 might not catch it. You need to dig into *who* pays the piper.
  2.  **The Moral Math Disguise:** Step 2 is the biggest leak. People will try to sneak values in as math. They'll say "Future lives count equally" as if it's a law of physics. It's not. It's a moral axiom. If they present it as a calculation, call them out.
  3.  **The "Zero" Problem:** Sometimes the probability *is* unknowable. Not low, just unknown. The checklist treats "unknown" as "fail," but sometimes you have to act on unknown risks (like early pandemic days). In those cases, the checklist stops you from using *math* to justify the action, but doesn't stop you from acting on *precaution*.
  4.  **My Own Bias:** I'm biased toward bounded utility. I don't buy the "infinite future" math. If you're a hard utilitarian, you'll think Step 2 is the broken part. That's fine. But for a journalist, treating potential lives as equal to real lives is a story about ideology, not a story about numbers.

  **Bottom line:** Use this to strip the suit off the argument. If the math is real, report the trade-off. If the math is fake, report the con. If the math is real but the morals are radical, report the philosophy. Don't let them hide behind the multiplication sign.
