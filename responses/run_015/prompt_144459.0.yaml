answer: |-
  # The Plan-Script Fracture Audit
  **Purpose:** To determine the structural relationship between an operator's intended goal, the routine they executed, and their level of physical control during a safety incident.
  **Time Required:** Approx. 15 minutes per report.
  **Users:** Safety Review Board (No philosophical training required).

  ---

  ## Part 1: The Audit Procedure

  Run these three steps in exact order. Do not skip to a conclusion until Step 3 is complete.

  ### Step 1: Verify the Top-Level Goal (Layer 1)
  **Question:** Is there clear, contemporaneous evidence that the operator had a specific, active objective different from the route or action they actually took?
  *   **Look for:** Dispatch logs, route manifests, passenger testimony, or pre-shift statements indicating the intended destination or task.
  *   **Sufficient Answer:** **YES** if the record shows they were assigned Task A but performed Task B. **NO** if the record shows they were assigned Task B, or if there is no record of an assignment.
  *   **Stop Rule:** If **NO**, classify as **Standard Alignment**. Stop here. The operator did what they were supposed to do, or there is no evidence they meant to do otherwise.
  *   **[JUDGMENT CALL FLAG]:** Determining "active objective" relies on paperwork. If the operator claims a personal goal (e.g., "I meant to stop for gas") without log evidence, the Board must decide if that claim is credible. Treat unverified personal goals as **NO**.

  ### Step 2: Identify the Competing Script (Layer 2)
  **Question:** Does the action taken match a known, previously reinforced pattern or routine that is distinct from the Top-Level Goal?
  *   **Look for:** Evidence of a "ghost route." Did they drive to a former depot? Did they use a maneuver from a previous vehicle type? Did they follow a path they take daily when *not* working?
  *   **Sufficient Answer:** **YES** if the deviation matches a specific, recognizable habit (e.g., "The Old Route," "The Home Commute," "The Standard Brake Check"). **NO** if the action was random, erratic, or unlike any known pattern in their history.
  *   **Stop Rule:** If **NO**, proceed to Step 3 immediately. This suggests the error was not a habitual override but possibly a confusion or impairment.
  *   **[JUDGMENT CALL FLAG]:** Distinguishing a "habit" from a "guess" is subjective. A habit requires repetition over time. If the operator has only driven this route twice, it is not a habit. Mark this as **NO**.

  ### Step 3: Assess Basic Intentional Control (Layer 3)
  **Question:** Did the operator perform complex, context-sensitive physical maneuvers consistent with voluntary driving during the deviation?
  *   **Look for:** Use of turn signals, checking mirrors, appropriate braking for traffic (not just obstacles), reacting to lights or pedestrians, or correcting the vehicle's position.
  *   **Sufficient Answer:** **YES** if the vehicle was operated smoothly and legally (minus the main deviation) up until the incident. **NO** if the vehicle drifted without input, hit objects without braking, or showed signs of sleep/medical incapacitation.
  *   **Stop Rule:** If **NO**, classify as **Control Breakdown**. Stop here.
  *   **[JUDGMENT CALL FLAG]:** This is the highest-risk step. "Smooth operation" can mask distraction. If the driver was texting, they may still signal and brake. The Board must review dashcam footage to ensure "control" wasn't just "lucky reflexes."

  ---

  ## Part 2: Classification & Accountability Logic

  Based on the Stop Rules above, assign one of the three classifications. This classification determines the *nature* of the error, which informs the *consequence*.

  **1. Standard Alignment (Step 1 = NO)**
  *   **Definition:** The operator did what they intended to do.
  *   **Implication:** If an incident occurred, it was a miscalculation or external factor, not a plan/script fracture. Investigate skill or environment.

  **2. Plan-Script Fracture (Step 1 = YES, Step 2 = YES, Step 3 = YES)**
  *   **Definition:** The operator intended Goal A, but Habit B took over, while they remained physically in control.
  *   **Implication:** **Not Excused.** Because Layer 3 (Control) was intact, the operator had the capacity to notice the deviation and correct it. "Autopilot" is an explanation of *why* the error started, but not a defense for *continuing* the error. Accountability remains with the operator for failing to monitor the script.

  **3. Control Breakdown (Step 3 = NO)**
  *   **Definition:** The operator lost basic voluntary control over the machine.
  *   **Implication:** **Medical/fitness Review.** This is not a disciplinary issue but a fitness-for-duty issue. Immediate suspension pending medical/psychological evaluation.

  ---

  ## Part 3: Application to Cases

  Here is how the Audit runs on the three scenarios you provided.

  ### Case (a): The Bus Driver and the Old Depot
  *   **Step 1 (Goal):** **YES.** Manifest shows assigned route to City Center. Driver ended at Old Depot.
  *   **Step 2 (Script):** **YES.** Driver worked at Old Depot for five years prior to transfer two years ago. The route taken matches the old commute exactly.
  *   **Step 3 (Control):** **YES.** Dashcam shows signaling for turns, stopping at intermediate lights, checking mirrors.
  *   **Classification:** **Plan-Script Fracture.**
  *   **Board Verdict:** The driver was in control. The habit explains the turn, but the intact control means they failed to notice they were off-route for the duration of the trip. Not excused.

  ### Case (b): The Cyclist and the Wrong Bridge
  *   **Step 1 (Goal):** **YES.** Delivery manifest shows Destination X. Cyclist crossed Bridge Y (wrong way).
  *   **Step 2 (Script):** **NO.** There is no evidence the cyclist habitually takes Bridge Y. The deviation was caused by internal distraction (replaying an argument), not a competing motor script.
  *   **Step 3 (Control):** **YES.** Cyclist pedaled, balanced, and immediately corrected course upon noticing the error.
  *   **Classification:** **Plan-Script Fracture (Modified).** *Note: Since Step 2 is No, this is technically a "Distraction Deviation," but functionally treated as a Fracture because Layer 1 and Layer 3 diverged.*
  *   **Board Verdict:** Because Layer 3 (Control) held and correction was immediate, this is a minor lapse in attention rather than a procedural override. Excusable as a near-miss, provided no safety rule was broken during the correction.

  ### Case (c): The Red-Light Runner (The "Not Thinking" Defense)
  *   **Step 1 (Goal):** **YES.** Protocol and law require stopping at red. Driver proceeded through.
  *   **Step 2 (Script):** **YES.** Driver claims "familiar route pattern." Evidence shows this intersection is on a daily loop where the light is often green or the turn is usually clear. The "script" is "maintain momentum on this stretch."
  *   **Step 3 (Control):** **YES.** Dashcam shows driver did not brake until *after* entering the intersection, likely reacting to cross-traffic. They were steering, looking, and operating the gas pedal intentionally.
  *   **Classification:** **Plan-Script Fracture.**
  *   **Board Verdict:** **Not Excused.** This is the critical output. The Audit confirms the driver was physically capable of stopping (Layer 3). The claim "I wasn't thinking" confirms Layer 2 (Habit) overrode Layer 1 (Safety Plan). Because Layer 3 was intact, the driver had the physical ability to override the habit but failed to monitor the environment. The "Autopilot" claim admits negligence; it does not erase it.

  ---

  ## Part 4: Honest Limitations & Misfire Points

  This procedure is a tool for categorizing the *mechanism* of an action, not for determining ultimate truth or moral worth. You must disclose the following to your board:

  **1. What This Cannot Settle: Unconsciousness vs. Neglect**
  The Audit cannot distinguish between a habit that truly bypassed consciousness and a habit the driver *allowed* to take over because they were lazy. In Case (c), the driver says "I wasn't thinking." Philosophically, this might mean "I was not consciously monitoring." Practically, it might mean "I didn't care enough to check." The Audit classifies both as **Plan-Script Fracture**. It treats them the same because the safety outcome (intact control + deviation) is identical. Do not use this Audit to decide if the driver is "lying." Use it to decide if the physical evidence supports the claim of lost control.

  **2. What This Cannot Settle: Moral Blame**
  The Classification (Fracture vs. Breakdown) informs accountability, but it does not dictate punishment. A **Plan-Script Fracture** implies the operator *could* have acted otherwise. However, the Board must decide if the penalty is retraining, suspension, or termination. That is a policy decision, not a philosophical one. Do not write "Guilty" on the Audit form; write "Layer 3 Intact."

  **3. The Mechanical Misfire Point: The "Skilled Distraction"**
  The Audit will misfire if an operator is deliberately violating safety (e.g., texting, eating, adjusting the radio) but maintains high-level vehicle control.
  *   **The Glitch:** Step 3 asks if they performed complex maneuvers. A driver texting can still signal and brake smoothly. The Audit will classify this as **Plan-Script Fracture** (Habit took over) or even **Standard Alignment**.
  *   **The Risk:** This masks willful misconduct as a habitual slip.
  *   **The Fix:** You must add a pre-check: "Review dashcam for secondary tasks (phone, food)." If secondary tasks are present, the Audit is void. Classify immediately as **Willful Violation**.

  **4. The "Correction" Ambiguity**
  In Case (b), the cyclist corrected immediately. In Case (a), the driver did not correct until the depot. The Audit treats both as **Layer 3 Intact**. However, the *duration* of the fracture matters for safety risk. The Audit does not measure time. A fracture lasting 10 seconds is classified the same as a fracture lasting 10 miles. The Board must weigh the *duration* of the divergence separately when assigning consequences.
