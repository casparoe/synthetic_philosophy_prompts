answer: |-
  This is one of the sharpest questions in the philosophy of art, disguised as a market argument. You and your friend are circling a concept that philosophers like Nelson Goodman, Walter Benjamin, and Arthur Danto spent careers trying to pin down.

  Your friend is close, but "history" is too vague. The Ise Shrine example proves that physical continuity isn't strictly necessary (since the wood is new), and restoration proves that material integrity isn't absolute.

  Here is the reconstruction of the theory your art market practices actually presuppose, followed by the separation of market noise, the consistency check, and the consequences of swapping to an experience-based view.

  ### 1. The Reconstructed Theory: Genesis-Dependent Essentialism

  The cluster of practices you described presupposes a theory we can call **Genesis-Dependent Essentialism**.

  Under this theory, an artwork is not defined by its visual properties (what it looks like) or its material substrate (what it is made of), but by its **history of production**. Specifically, it values the object as a **trace of a specific creative agency.**

  *   **The Core Axiom:** The value of the object is derived from it being a physical witness to a specific moment of human intentionality by a specific agent (the Artist).
  *   **Why Attribution Matters:** When a painting is downgraded from "Master" to "Studio," the visual data hasn't changed, but the *narrative of agency* has. You are no longer looking at a trace of the Genius's hand; you are looking at a trace of a subordinate executing instructions. The "witness" testifies to a lesser event.
  *   **Why Forgery Crashs:** A forgery is a lie about genesis. It claims to be a trace of Agent A, but is actually a trace of Agent B. Even if Agent B is more skilled, the object is a "false witness." In this theory, a lie about the past destroys the ontological status of the object as *that* artwork.
  *   **Why Restoration is Allowed:** Restoration is viewed not as *creation* but as *conservation of the trace.* When a conservator repaints a lost area, they are attempting to make the original trace legible again. They are subordinating their own agency to reveal the original agency. As long as the *support* (the canvas/wood the artist touched) remains, the chain of witness holds.
  *   **Why Estate Prints are Worth Less:** The "work" in printmaking includes the artist's supervision of the quality. A lifetime print is a trace of the artist's approval. A posthumous print is a mechanical extraction from the plate without the artist's sanctioning intent. The plate is the same, but the *generative event* (Artist + Plate + Approval) is incomplete.
  *   **Why Destruction Increases Value:** When an artist destroys their work, the destruction *is* the final creative act. The fragments are the traces of that final, dramatic intention. They are more "dense" with agency than the intact work.

  **The Ise Shrine Exception:**
  The Ise Shrine (Shikinen Sengū) seems to break this, but it actually highlights that "Authenticity" is culturally specific. Western Art uses **Material/Genealogical Authenticity** (this specific wood, from this specific tree, touched by this hand). Shinto ritual uses **Ritual/Functional Authenticity** (the form and the rite are the truth; the material is transient). Your art market is firmly Western/Modernist: it worships the *relic*, not the *function*.

  ### 2. Theory vs. Market Mechanics

  You asked which bits strictly need this theory and which are just market noise (scarcity, status, investment).

  **Strictly Needed by the Theory:**
  *   **The Attribution Price Gap:** If value were visual, attribution wouldn't matter. The price crash proves the value is in the *name/genesis*, not the image.
  *   **The Forgery Nullification:** If value were material, a perfect fake would be worth the same. The fact that it becomes "worth the price of the frame" proves the value was never in the object's physics, but in its biography.
  *   **Museum Acquisition:** Museums buy originals to be "custodians of history." If they only cared about visuals, high-res prints would suffice for study.

  **Market Mechanics (Would survive any theory):**
  *   **Scarcity:** Even in an experience-based world, unique objects are rarer than copies. Scarcity drives price regardless of metaphysics.
  *   **Status Signalling:** Owning a "real" Rembrandt signals wealth and taste. In an experience-based world, owning the "best version" (even if a copy) would still signal status, though the hierarchy would change.
  *   **Investment Stability:** Investors like stable categories. "Autograph" is a stable category. "Looks good" is subjective. The market prefers the rigid taxonomy of Genesis-Dependent Essentialism because it makes assets easier to classify and insure.

  ### 3. Rival Views Ruled Out

  The current system quietly but violently rules out **Aesthetic Empiricism**.

  *   **The Rival View:** Aesthetic Empiricism holds that the value of art lies entirely in the perceptual experience it affords the viewer. If two objects look identical, they offer identical aesthetic value.
  *   **Why the Market Rules It Out:** If Empiricism were true, a perfect forgery would be as valuable as the original. A high-quality facsimile in a museum would be as moving as the original. The fact that we feel "cheated" upon learning a work is a fake proves we are not Empiricists. We believe the *knowledge* of the origin changes the *experience* of the viewing. (This is known as the "Knowledge Effect").

  It also rules out **Physicalism** (value = specific atoms), because restoration and the Ise Shrine show we allow material replacement as long as the *lineage of intent* is preserved.

  ### 4. Internal Consistency Check

  Is Genesis-Dependent Essentialism internally consistent given restoration and estate prints?

  **Yes, but only if you add "Intent" to "Causal Chain."**
  Your friend's "unbroken causal chain" theory fails on restoration (the chain of paint is broken) and estate prints (the chain of the plate is unbroken).

  However, if the theory is **"Unbroken Chain of Sanctioned Intent,"** it holds:
  *   **Restoration:** The conservator acts *on behalf* of the original intent to preserve the work. The intent is continuous, even if the material is patched.
  *   **Estate Prints:** The artist's intent regarding the edition size and quality died with them. The estate's intent is secondary. Therefore, the "Sanctioned Intent" chain is broken at death.
  *   **Forgery:** The forger's intent is to *deceive*, not to *create* in the lineage of the master. The chain of intent is severed immediately.

  **The Inconsistency:** The system struggles with **Collaboration**. If two artists paint a canvas together, our market taxonomy (Autograph vs. Studio) forces a hierarchy that might not exist in the genesis. It also struggles with **Digital Art**, where the "original" is a file and every copy is identical. The market has to invent artificial scarcity (NFTs) to force Genesis-Dependent Essentialism onto a medium that is inherently Empiricist.

  ### 5. The Swap: Consequences of an Experience-Based View

  If we swapped Genesis-Dependent Essentialism for **Aesthetic Empiricism** (Value = Visual Experience), here is what concretely changes:

  **1. Labelling and Authentication:**
  *   **Current:** "Attributed to," "Studio of," "Circle of."
  *   **New:** "Quality Grade A," "Visual Match to Rembrandt Style." Authentication institutes close down. Connoisseurship becomes obsolete. There is no "fake," only "mislabelled."

  **2. Prices:**
  *   **Current:** Original = $100M, Fake = $1,000.
  *   **New:** Original = $5M, Best Fake = $5M. Prices converge based on aesthetic power and condition. The "Master" brand loses its premium. A brilliant 19th-century copy of a lost Raphael might become more valuable than a dull, damaged sketch by Raphael himself.

  **3. Insurance:**
  *   **Current:** Insured for "Agreed Value" based on provenance. Total loss if stolen/destroyed.
  *   **New:** Insured for "Replacement Cost of Equivalent Experience." If a painting burns, the insurer pays for a commission of a visually identical work by a living master. Art becomes insurable like furniture.

  **4. Museums:**
  *   **Current:** Hoard originals in climate-controlled vaults; show casts in education wings.
  *   **New:** Museums become galleries of the "Best Versions." If a cast is in better condition than the corroded original bronze, the cast is displayed as the primary work. Museums stop competing for provenance and start competing for visual impact.

  **5. The Law (Forgery and Fraud):**
  *   **Current:** Forgery is a crime against the *market* and *history* (fraud). Destroying a fake is often seen as "cleaning up."
  *   **New:**
      *   **Fraud:** Only exists if you lie about the *maker* to sell it. If you sell a fake as "A painting in the style of," it is legal.
      *   **Destruction:** Destroying a forgery becomes **Vandalism**. If the value is in the experience, a beautiful fake is a cultural asset. Destroying it destroys beauty. The law would protect the object, not the biography.
      *   **Copyright:** Shifts entirely from "moral rights" (attribution) to "visual rights."

  **6. Conservation:**
  *   **Current:** Preserve the original material at all costs (even if it looks bad).
  *   **New:** Restore for visual perfection. If repainting the whole canvas makes it look better, do it. The "skin" doesn't matter, only the "face."

  ### Summary

  Your argument with your friend hinges on whether art is a **Relic** or a **Signal**.

  *   **Your Friend (History/Chain):** Treats art as a Relic. It is holy because of who touched it.
  *   **You (implicitly questioning):** Suspect this is irrational if the visual experience is identical.
  *   **The Reality:** The market treats art as a **Certified Signal**. The object is a token in a social game of status and historical connection.

  The system is internally consistent *if* you accept that the "Artwork" is not the physical object, but the **event of its creation**, of which the object is merely the receipt. We don't pay for the painting; we pay for the receipt. A forgery is a forged receipt. A restoration is a repaired receipt. An estate print is a photocopy of a receipt.

  If you switch to an experience-based view, you don't just change prices; you abolish the concept of "Art History" as a study of lineage and turn it into "Visual Psychology." The market resists this because scarcity of *receipts* is easier to enforce than scarcity of *experiences*.
