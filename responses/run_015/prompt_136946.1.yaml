answer: |-
  You are right to feel that the arithmetic is the easy part and the metaphysics is the hard part. The Absent-Minded Driver (AMD) is not merely a puzzle about calculation; it is a stress test for the standard decision-theoretic assumption that *agency* is located in the momentary choice. Your confusion stems from trying to reconcile three incompatible frameworks: ex-ante planning, sequential rationality, and self-locating belief.

  Here is the breakdown of where the conceptual friction lies, followed by the critique of your passenger hypothesis, which I believe is the load-bearing error in your current draft.

  ### 1. The Gap: The Failure of Kuhn's Theorem
  You ask whether the gap between the ex-ante evaluation (expected value $\approx 1.33$) and the at-node evaluation is a failure of dynamic consistency. It is more technical than that: it is the failure of **Kuhn's Theorem** under imperfect recall.

  In standard extensive-form games with perfect recall, there is an equivalence between *mixed strategies* (ex-ante randomization over complete plans) and *behavior strategies* (local randomization at each node). You can plan to flip a coin at the start, or flip it at the intersection; the outcome is identical. With imperfect recall, this equivalence collapses. The ex-ante optimal policy (a mixed strategy over plans) requires a correlation between actions at distinct nodes that the agent, standing at the node, cannot replicate locally because she cannot distinguish the nodes.

  The gap is not merely that preferences change over time (standard dynamic inconsistency); it is that the **information set** prevents the agent from executing the ex-ante optimal correlation locally. The ex-ante perspective treats the agent as a *planner* choosing a function from histories to actions. The at-node perspective treats the agent as a *sequencer* choosing an action given a belief state. In AMD, these two agents have different feasible sets. The "paradox" arises only if you insist that the sequencer must be able to validate the planner's choice without access to the planner's information.

  ### 2. The Probability: Policy-Dependent Frequency
  Regarding your second question: the "probability that this is the first intersection" is not a static credence the driver *has* independently of her policy. It is a **policy-dependent frequency**.

  When you stand at the intersection, you are asking for $P(X | \text{at intersection})$. By Bayes' rule, this depends on $P(\text{at intersection} | X)$ and $P(\text{at intersection} | Y)$. The latter is determined by your continuation probability $p$. If you plan to always continue ($p=1$), you will visit both intersections, so the probability you are at the first is $1/2$. If you plan to exit immediately ($p=0$), you only visit the first, so the probability is $1$.

  The circularity you sensed is real. You cannot use this probability as an *input* for local optimization because the probability itself is a function of the policy you are trying to optimize. If you treat it as a fixed self-locating credence (a "thirder" position), you are implicitly assuming the policy is fixed, which blocks optimization. If you treat it as a bookkeeping weight for the ex-ante calculation, it is stable, but then the "at-node" perspective loses its normative force. The lesson here is that under imperfect recall, **beliefs and strategies are co-determined**. You cannot separate "what I believe" from "what I do" in the way standard decision theory assumes.

  ### 3. The Passenger Variant: Where You Are Confused
  This is the critical point. Your pet hypothesis is that randomization stands in for missing indexical information, and you test this with a passenger variant. You write: *"My instinct is that [the passenger] changes nothing, and that if that's right then the interesting loss isn't epistemic... but agential."*

  **This instinct is incorrect.** The passenger variant changes everything, and recognizing why dissolves your hypothesis about the nature of the loss.

  In the standard AMD case, the driver's information set groups Intersection 1 and Intersection 2 together. She cannot condition her action on the location. In your variant, the passenger knows the location and can say a pre-agreed word. If the agreement is "Say 'Go' at Intersection 1 and 'Exit' at Intersection 2," the driver hears distinct signals at distinct nodes. **This splits the information set.**

  Even though the driver has imperfect *memory*, she now has perfect *present perception* of her location via the passenger's signal. She does not need to remember having passed Intersection 1; she only needs to hear "Exit" to know she is at Intersection 2. The achievable value jumps from $4/3$ to $4$.

  Your confusion lies in conflating **memory** with **information**. The constraint in AMD is not that the driver cannot *execute* a plan (agential loss); it is that she cannot *distinguish* the states (epistemic loss). Randomization is not "standing in" for indexical information; it is a workaround for the inability to condition actions on states. If you provide a channel (the passenger) that correlates signals with states, the imperfect recall becomes irrelevant. The loss in the standard case is fundamentally epistemic (the partition of the state space), not agential (the ability to randomize).

  If you intended the passenger to be *also* absent-minded (sharing the driver's information set), then obviously nothing changes. But if the passenger is an external oracle, as your description suggests ("knows exactly which intersection"), then the AMD problem vanishes. This suggests your hypothesis that the puzzle is about "executing a probabilistic plan" is backwards. The puzzle is about **decision-making when the action cannot be conditioned on the state**. Randomization is the *only* tool available when conditioning is impossible; it is not a proxy for information, it is a substitute for discrimination.

  ### 4. Newcomb and Plans
  Is this Newcomb-style? Yes, structurally. In Newcomb's Problem, your choice is evidence of the predictor's prior move. In AMD, your choice of continuation probability $p$ is evidence of which intersection you are at (because higher $p$ increases the frequency of reaching the second intersection). This is **action-dependent probability**. If you use Causal Decision Theory (CDT) at the node, treating the probability of being at X as independent of your current choice, you will likely deviate from the ex-ante optimal plan. If you use Evidential Decision Theory (EDT) or a plan-based approach, you respect the correlation.

  This leads to your final point: does a plan-based view dissolve the case? **Yes.** If you take the "plan" (the ex-ante strategy) as the primary unit of rational assessment, the at-node tension disappears. You simply commit to $p=2/3$ and execute it. The "paradox" only exists if you demand that rationality be assessable at every information set independently (sequential rationality). The AMD case is arguably a *reductio* of strict sequential rationality under imperfect recall. It suggests that when recall is imperfect, the **ex-ante self** has normative authority over the **temporal selves**, because the temporal selves lack the information required to maximize the global objective.

  ### Summary of Corrections
  To sharpen your paper, you should correct the following:
  1.  **The Gap:** Frame it as the breakdown of the equivalence between mixed and behavior strategies (Kuhn's Theorem), not just dynamic inconsistency.
  2.  **The Probability:** Define it as policy-dependent, not a static credence. Emphasize that treating it as fixed creates the circularity.
  3.  **The Passenger:** Abandon the claim that the passenger changes nothing. Acknowledge that external signaling breaks the information set, proving the loss is epistemic (state discrimination), not agential (execution).
  4.  **The Lesson:** The conceptual lesson of AMD is not that rationality is paradoxical, but that **sequential rationality is too strong a requirement for agents with imperfect recall**. The case argues for a view of agency where commitment and planning have normative priority over local optimization when information sets are coarse.

  Your intuition that randomization is "standing in" for something is close, but it's standing in for *state discrimination*, not indexical belief. You randomize because you cannot tell where you are; if you could tell (via the passenger), you wouldn't need to randomize. That distinction is the key to the paper.
