  hey — I'm a third-year philosophy PhD student and I'm trying to turn a seminar presentation into a short paper on imperfect recall in decision theory, and I've realized I can follow the mechanics of the absent-minded driver case without having any idea what the *conceptual* lesson is supposed to be. So: can you explain what is actually at issue in it? Assume I can do the arithmetic and don't need the history — I have the standard references, I don't need you to reconstruct them.

  The setup I'm working with is the usual one: two indistinguisable intersections, exiting at the first gets you 0 (bad motel), exiting at the second gets you 4 (good motel), driving past both gets you 1, and the driver can't tell the intersections apart and doesn't remember having passed any, though she knows all this about herself in advance. Here's where I get lost. If you evaluate things from the ex ante planning standpoint — pick a policy for how to behave at an intersection before you set off — you get, if I remember right, a mixed policy that beats either pure one, with an expected value of something like 4/3 (I keep second-guessing the exact numbers, so correct me if I'm mangling it). If instead you ask, standing at an intersection, "given that I am at *some* intersection now, should I exit or continue?", you get a different verdict, and the probability you're supposed to plug in for "this is the first intersection" looks like it depends on the policy you were going to follow — so it shifts when you consider deviating, which feels circular to me in a way I can't quite articulate. A friend of mine who does RL said this is just state aliasing, i.e. it's a POMDP and of course the optimal policy is stochastic, and my reaction is that this is both completely right and completely beside the point, but I can't say why.

  So here's what I'd like. First, tell me what the gap between the two evaluations is a gap *between* — is it a failure of dynamic consistency, or is it that there is no well-defined decision problem at the node at all, or something else? Second, and this is the bit I care most about: what kind of quantity is that "probability that this is the first intersection"? Is it a self-locating credence the driver ought to have, a frequency across repetitions of the drive, or just a bookkeeping weight in an ex ante calculation over policies — and do those have to agree, or is the whole puzzle a case where they come apart? Third, I have a pet hypothesis I want you to beat up: I think the case is really two puzzles stacked, one about self-locating belief under imperfect recall, and a deeper one about whether an agent who can't tell the stages apart can even be said to *execute* a probabilistic plan, so that randomization here is standing in for missing indexical information rather than being a genuine option. To test it I invented a variant: suppose there's a wide-awake passenger who knows exactly which intersection they're at and can influence the driver only by saying one pre-agreed word, either "now" or "wait", at each intersection — the driver hears it but can't remember whether she's heard anything before. Does the passenger's knowledge raise the achievable value at all, or is it exactly the same as the solo case? Work it through, because my instinct is that it changes nothing, and that if that's right then the interesting loss isn't epistemic (information the agent lacks) but agential (information she has no way of acting on), and I want to know whether that distinction holds up or collapses.

  Also: is any of this actually the same phenomenon as Newcomb-style cases where your action is evidence about your situation, or is that a superficial resemblance? And what does someone who thinks plans or intentions rather than momentary actions are the basic unit of rational assessment say here — does that dissolve the case or just relocate the difficulty? Finally, I'd find it most persuasive if you told me which of the things I've said above is just confused; I'd rather be corrected than agreed with. Around 1000–1400 words, whichever of my three questions you think is load-bearing should get most of the space.
