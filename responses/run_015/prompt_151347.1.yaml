answer: |-
  The principle that captures your pattern is **The Principle of Biospheric Evolutionary Continuity**.

  It posits that "life" is not just about what a thing *does* (metabolism, replication), but about *where it fits* in the physical and evolutionary landscape of Earth. To count as alive, an entity must be a physically embodied unit capable of open-ended Darwinian evolution **using the chemical language of the terrestrial biosphere.**

  Here is the precise breakdown of the principle, how it maps to your verdicts, the verdict on the new case, and the one sacrifice required to make it hold.

  ### The Principle: Biospheric Evolutionary Continuity

  An entity is alive if and only if it meets these four criteria:

  1.  **Thermodynamic Embodiment:** It must be a physical system that maintains itself by exchanging energy and matter with its environment.
      *   *Motivating Case:* **The Computer Virus.** It evolves and competes, but it is information without independent thermodynamic agency. It rides on hardware it does not control. This criterion excludes it.
  2.  **Open-Ended Darwinian Potential:** It must possess a hereditary mechanism capable of indefinite variation and selection, not just deterministic growth.
      *   *Motivating Case:* **The Crystal.** It grows and "reproduces" lattice structures, but its variation is limited by physics, not selectable information. It cannot adapt to a changing environment in a Darwinian sense. This criterion excludes it.
  3.  **Chemical Compatibility:** It must utilize the molecular framework of Earth's biosphere (nucleic acids, proteins, lipids) such that it *could* theoretically exchange genetic information or compete in the same ecological niche as existing life.
      *   *Motivating Case:* **The Synthetic Cell vs. The Protocell.** This is the crux of your intuition. The Synthetic Cell uses DNA and proteins; even if designed from scratch, it speaks the same chemical "language" as bacteria. It is part of the same evolutionary tree. The Protocell uses "non-biological monomers." It is an evolutionary dead end relative to Earth life; it cannot merge lineages with us. This criterion saves the Synthetic Cell and excludes the Protocell without circularly saying "biology is alive."
  4.  **Unitary Autonomy:** It must contain the necessary information to direct its own replication cycle, independent of a host's nuclear genome.
      *   *Motivating Case:* **The Tardigrade.** It can pause metabolism (tun state) but retains the autonomous machinery to restart. This criterion allows for dormancy.

  ### Verdict on the New Case: Gray Goo Swarm
  **Verdict: Not Alive.**

  **Reasoning:** While the nanobots meet Criterion 1 (Thermodynamic Embodiment) and arguably Criterion 2 (Replication/Mutation), they fail Criterion 3 (Chemical Compatibility) and likely Criterion 4 (Unitary Autonomy depending on design).
  *   **Chemical Incompatibility:** As engineered nanobots (likely silicon, metal, or synthetic polymers), they cannot exchange genetic material with the biosphere. They are a separate genesis, a parallel form of existence, but not "life" in the biological sense you are applying.
  *   **Lineage:** Being "engineered yesterday with no evolutionary lineage" means they lack the historical continuity that defines the biosphere. They are tools that replicate, not organisms that evolve within the tree of life.

  ### The Honest Note: The Verdict You Must Overturn

  To maintain this principle consistently, you must overturn your verdict on the **Isolated Mitochondrion**.

  **Your Verdict:** Alive (unsure why).
  **Principle's Verdict:** **Not Alive.**

  **Why you must drop it:**
  The mitochondrion fails Criterion 4 (Unitary Autonomy). An isolated mitochondrion cannot replicate itself in a test tube because the vast majority of the genes required for its division and function are located in the host cell's nucleus, not in its own DNA. It is a **living organelle**, not a **living organism**.

  Calling a mitochondrion "alive" is like calling a human heart in a jar "alive." It is metabolically active tissue derived from life, but it is not a unit of selection. It cannot evolve on its own. If you classify the mitochondrion as alive, you blur the line between *parts* of a living system and the *system* itself, which breaks the distinction between the Synthetic Cell (a whole system) and the Protocell (a whole system).

  **Summary:**
  Your intuition is actually tracking **membership in the Tree of Life** rather than abstract functionalism. You consider things alive if they are physical, autonomous units that speak the chemical language of Earth's evolution. This elegantly separates the Synthetic Cell (new branch on the tree) from the Protocell (alien chemistry) and the Virus (digital parasite), but it requires you to admit that a mitochondrion is a *component* of life, not life itself.
