  9.  **Final Polish:** Ensure the tone is analytical and rigorous. Make sure the distinction between "causal access" and "modal tracking" is clear. Emphasize that the problem isn't *where* the objects are, but *how big* the structures are relative to the knower's computational capacity. (Self-Correction: Make sure to clarify why necessary truths aren't trivially tracked. The trick is that the *consistency* is the contingent-feeling modal fact we are trying to track).

