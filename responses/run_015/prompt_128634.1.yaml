      *   *Refinement:* The truth isn't just "necessary." It's "true in all coherent structures." The epistemological task is to discern *which* structures are coherent. Large Cardinals assert new coherence. If our cognitive machinery is bounded, we can't discern coherence at that level reliably.

      *   *Attempt 2 (Focusing on the "Tracking" aspect):*
          *   Ontology: Math truths are facts about which structures are possible.
          *   Epistemology: We know them if our belief-forming process tracks these modal facts.
          *   Tension: For basic arithmetic, our physical counting tracks the modal structure of finite sets.
          *   The Break: For Large Cardinals, the structure is so vast it has no physical isomorph.
          *   The Tracking Failure: To track the truth, if the structure *weren't* possible (i.e., if the axiom were inconsistent), we shouldn't believe it. But since we can't compute the inconsistency (due to size), our belief is insensitive. We would believe it even if it were false (inconsistent).

      *   *Attempt 3 (Polishing for the Prompt's constraints):*
