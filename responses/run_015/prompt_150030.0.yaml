          *   *Problem:* Chemicals kill bees and wasps too. The "individual" count skyrockets.
          *   *Verdict:* Individual lens alone is insufficient because it ignores the *type* of life destroyed (pollinators vs. pests).
      *   **Section 2: The Structural Lens (Networks & Systems).**
