prompt: |-
  I've been reading my way into the democratic-theory literature on the boundary problem for a few months now — partly general curiosity, partly because a group of us (the same crowd I do the annual calibration meetup with) have been drafting a governance charter for a small intentional community of the charter-city/seastead flavor, and we stalled at the first clause: who gets a vote. Everyone at the table had a different principle, each sounded obvious in isolation, and each broke within five minutes of stress-testing. So before we argue about which principle to adopt, I want the specification. What would a principle of demos-membership have to deliver to count as adequate for a purpose like ours — a franchise rule that has to be written down in advance, applied by whoever is staffing the registration table, and stable enough that the people it enfranchises can then legitimately amend it? Give me the requirement list with the case or consideration behind each: the cases it has to handle (young children, long-term non-citizen residents, citizens who live abroad, temporary migrant workers, prisoners, people downstream of the community's emissions or land-use decisions, people who don't exist yet), and the distinctions it isn't allowed to collapse — having a say versus how much say, being affected versus being coerced versus being legally subject, the demos for one decision versus the demos that authorizes the constitution, de jure membership versus de facto causal impact.

  Some requirements I want treated explicitly, because they're where our draft kept failing. First, administrative legibility: a clerk with bounded information has to be able to determine membership on a Tuesday morning from documents, not from a counterfactual model of how every decision might have set back every person's projects; say how demanding this really is and where it bites. Second, non-explosiveness: I keep running into the argument that any all-affected principle quietly becomes a principle about everyone subject to coercion, and therefore about essentially every human being, which would make the clause useless for us — is that a genuine desideratum or just a prejudice of statists who already have a demos? Third, non-circularity: the membership rule can't be defined via decisions made by the very body whose membership is in question, or via which decision is on the agenda. Fourth, and this is the one I most want your view on, fixed-point stability for outcome-dependent membership: we toyed with a clause enfranchising anyone whose ongoing projects would be set back by the decision under consideration — call it the itinerant demos — and noticed two failure modes, namely that the winners of a vote can thereby determine who was eligible to vote in it, and that a faction can gerrymander the demos by proposing policies calibrated to affect its opponents. I'd like weaponized-affectedness as its own desideratum rather than a footnote.

  Then the meta-questions, which matter more to me than the scoring. Which of these requirements are genuine desiderata and which are just the commitments of one camp dressed up as constraints — for instance, is it a requirement or a preference that the demos be a standing body rather than a per-decision one, and is everyone subject to coercion gets a say an axiom or a theorem? Flag any pair you think cannot be jointly satisfied; my suspicion is that full counterfactual affectedness-sensitivity and same-day administrative legibility are incompatible, and that non-circularity plus completeness may be too, in which case the list itself is the interesting result rather than any theory's score on it. And tell me which single requirement does the most work in knocking out otherwise-popular candidates. Only then, briefly — a table or a paragraph each — score the standard families: all-affected-interests, all-subjected-to-coercion, subjection-to-law or membership-based views, and, if it deserves to be in the race, something proceduralist or fixed-point-flavored. Keep the weight on the criteria and the cases behind them; the scorecard is for my own notes, and our next session is on the 14th, so assume I have some background but no library access this week.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Deeply engaged with democratic theory literature (boundary problem), part of a group drafting a governance charter for a small intentional community (charter-city/seastead flavor). They are sophisticated, looking for precision, not introductory summaries. They value "specification" over "theory."
      *   **Task:** Provide a requirement list for a principle of demos-membership (franchise rule) suitable for their context.
      *   **Key Constraints/Requirements:**
          *   Must handle specific cases (children, non-citizens, expats, migrants, prisoners, externalities, future gens).
          *   Must maintain specific distinctions (say vs. weight, affected vs. coerced vs. subject, single decision vs. constitutional demos, de jure vs. de facto).
          *   **Explicit Requirements to Treat:** Administrative Legibility, Non-Explosiveness, Non-Circularity, Fixed-Point Stability (Weaponized Affectedness).
          *   **Meta-Questions:** Distinguish genuine desiderata from camp commitments. Flag incompatibilities (e.g., affectedness vs. legibility). Identify the single most eliminative requirement.
          *   **Scoring:** Briefly score standard families (All-Affected, All-Subjected, Membership-based, Proceduralist/Fixed-Point).
          *   **Tone:** High-level, analytical, precise, avoiding fluff. No library access assumed (rely on internal knowledge).
          *   **Deadline:** Next session on the 14th (implies urgency but also time to think).

  2.  **Deconstruct the Core Problem:**
      *   The "Boundary Problem" (Whitney, Dahl, Whelan, etc.) is about defining *who* constitutes the people (*demos*) before the people can decide *how* to decide.
      *   The user's context is a *small intentional community* (seastead/charter city). This is crucial. It's not a nation-state. It implies voluntary association, exit options, specific physical/digital infrastructure, and a need for stability to attract investment/participation.
      *   The user is stuck on "Who gets a vote?" because every principle breaks under stress.

  3.  **Drafting the Requirement List (The Specification):**
      *   *Administrative Legibility:* Needs to be operational. A clerk needs to check a box.
          *   *Case:* "Affectedness" fails here because calculating impact is epistemic hell.
          *   *Constraint:* Must rely on proxies (residency, contribution, contract).
      *   *Non-Explosiveness:* The demos can't be "everyone on earth."
          *   *Case:* Climate change/externalities make "all-affected" global.
          *   *Constraint:* Needs a threshold of relevance or a boundary of jurisdiction.
      *   *Non-Circularity:* The rule can't depend on the outcome of the vote it governs.
          *   *Case:* "Those who agree to the rules" -> Who decides the rules?
          *   *Constraint:* Pre-commitment or constitutional layering.
      *   *Fixed-Point Stability (Weaponized Affectedness):* This is the user's specific pain point.
          *   *Case:* Voting on a tax that only hits opponents -> opponents lose vote -> tax passes.
          *   *Constraint:* Membership must be invariant to the specific policy outcome being voted on *within* the normal legislative cycle.

      *   *Additional Necessary Distinctions:*
          *   *Constitutional vs. Legislative Demos:* Who writes the charter vs. who sets the trash fee.
          *   *Exit Rights:* In a seastead, exit is a substitute for voice (Hirschman).
          *   *Stakeholder vs. Sovereign:* Investors vs. Residents.

  4.  **Addressing the Meta-Questions:**
      *   *Genuine Desiderata vs. Camp Commitments:*
          *   "Standing Body" is a preference for stability, not a logical necessity (liquid democracy exists).
          *   "All-Subjected" is often a normative axiom, not a functional requirement.
      *   *Incompatibilities:*
          *   *Legibility vs. Precision (Affectedness):* You can't have both. Precise affectedness requires a tribunal, not a clerk.
          *   *Non-Circularity vs. Self-Determination:* If the demos defines itself, it's circular. If an external agent defines it, it's heteronomous.
      *   *The "Killer" Requirement:* Administrative Legibility combined with Fixed-Point Stability. This kills the pure "All-Affected" principle immediately for day-to-day governance.

  5.  **Scoring the Families:**
      *   *All-Affected:* Fails Legibility and Non-Explosiveness. Good normatively, bad operationally.
      *   *All-Subjected (Coercion):* Better, but "coercion" is hard to define legibly in a voluntary community.
      *   *Membership/Residency:* High Legibility, High Stability. Risks excluding relevant stakeholders (investors, neighbors).
      *   *Proceduralist/Fixed-Point:* (e.g., "Those who signed the Charter"). High Stability. Risks rigidity.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* The user mentioned "seastead/charter-city." This implies a corporate or contractual foundation. The "demos" might actually be "shareholders + residents." I need to make sure the requirements acknowledge the *voluntary* nature of this community compared to a state.
      *   *Nuance on Fixed-Point:* The user calls it "Fixed-Point Stability." In logic, a fixed point is where $f(x) = x$. Here, it means the membership set $M$ must not change as a function of the policy decision $P$ being voted on. $M \neq f(P)$.
      *   *Nuance on Non-Circularity:* This is the "Boundary Problem" proper. Whelan's paradox. The solution is usually a temporal layering (Founders -> Charter -> Demos).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication and the specific context (seastead/charter).
      *   **Section 1: The Specification (Requirement List):** Detail the four explicit requirements + necessary distinctions. Use the "Case/Consideration" format requested.
      *   **Section 2: Meta-Analysis:** Desiderata vs. Preferences, Incompatibilities, The Killer Constraint.
      *   **Section 3: Scorecard:** Brief evaluation of the standard families against the spec.
      *   **Conclusion:** A nudge towards a hybrid model (Constitutional vs. Legislative Demos).

  8.  **Drafting Content - Specific Points to Hit:**
      *   *Legibility:* Emphasize the "Tuesday Morning Clerk" test.
      *   *Explosiveness:* Mention the "Butterfly Effect" problem of affectedness.
      *   *Circularity:* Mention the "Founding Moment" exception.
      *   *Weaponized Affectedness:* Use the "Gerrymandering the Electorate via Policy" example.
      *   *Incompatibility:* Highlight that *Perfect Moral Accuracy* is incompatible with *Operational Stability*.
      *   *Killer Constraint:* Administrative Legibility. It forces proxies (residency, contract) over truth (affectedness).

  9.  **Final Review against User Prompt:**
      *   Did I cover the cases (children, prisoners, etc.)? Yes, within the requirements.
      *   Did I cover the distinctions (say vs weight, etc.)? Yes.
      *   Did I address the four explicit requirements? Yes.
      *   Did I answer the meta-questions? Yes.
      *   Is the tone appropriate? Yes, technical and direct.
      *   Is the scoring brief? Yes.

  10. **Final Polish:** Ensure the distinction between the *Constitutional Demos* (who ratifies the charter) and the *Legislative Demos* (who votes on bylaws) is clear, as this is the standard solution to the boundary problem in intentional communities. (Self-correction: Make sure to emphasize this in the "Fixed-Point" section).

  *(Self-Correction during drafting)*: I need to be careful with the term "Fixed-Point." In this context, the user means "Membership stability relative to policy outcomes." I should adopt their terminology but clarify it implies *ex-ante* definition.

  *(Refining the "Killer Constraint")*: Is it Legibility or Non-Circularity? Legibility kills "All-Affected." Non-Circularity kills "Self-Determination." For a *charter* context, Legibility is the practical killer. Non-circularity is the theoretical killer. I will argue Legibility is the one that forces the compromise.

  *(Refining the "Seastead" context)*: In a seastead, "coercion" is different. It's contractual. So "All-Subjected" translates to "All Signatories." This is a crucial distinction to make in the scoring.

  Okay, ready to write.
answer: |-
  This specification is designed for a *constitutive* context (charter/seastead) rather than a *sovereign* context (nation-state). The stakes differ: you are building a machine to generate legitimacy, not justifying an existing one. The requirements below treat the franchise rule as an engineering constraint: it must parse inputs (people) into outputs (voters) without crashing (paradox) or allowing root access to hackers (factional capture).

  ### I. The Specification: Requirements for Demos-Membership

  **1. Administrative Legibility (The Clerk Test)**
  *   **Requirement:** The rule must be decidable by an administrator with bounded rationality and limited data (e.g., a registry clerk) in finite time, using objective proxies rather than counterfactual modeling.
  *   **Case/Consideration:** *The Downstream Neighbor.* Under a pure "all-affected" principle, determining if a neighbor 50 miles downstream is enfranchised regarding your wastewater policy requires hydrological modeling and economic impact assessment for every vote.
  *   **Why it bites:** This requirement forces the use of *proxies* for affectedness (e.g., residency, property title, contract signature) rather than affectedness itself. It demands a bright line where moral reality is a gradient. If the rule requires a tribunal to decide who gets to vote on the tribunal, it fails.

  **2. Non-Explosiveness (The Boundary Constraint)**
  *   **Requirement:** The set of enfranchised persons must be a proper subset of humanity, stable across normal policy variations.
  *   **Case/Consideration:** *The Butterfly Effect.* Every decision changes prices, signals, and environmental conditions globally. If "affected" means "any causal impact," the demos is everyone. If "coerced" means "subject to state force," and that force relies on global supply chains, the demos expands indefinitely.
  *   **Why it bites:** This requires a threshold of *relevant* impact or a jurisdictional boundary. It rules out principles that rely on unbounded causal chains. For a seastead, this usually implies a physical or contractual perimeter.

  **3. Non-Circularity (The Founding Paradox)**
  *   **Requirement:** The rule defining membership cannot be determined by the body constituted by that membership, unless there is a temporal or hierarchical layering (e.g., Constitutional vs. Legislative Demos).
  *   **Case/Consideration:** *The First Vote.* If the charter says "The Demos shall decide who is in the Demos," the initial set is undefined. If the initial set is defined by "Founders," what defines the Founders?
  *   **Why it bites:** This forces a distinction between the *Constituent Power* (those who ratify the charter) and the *Constituted Power* (those who vote under it). The franchise rule for ordinary legislation cannot be subject to amendment by ordinary legislation if that amendment changes the electorate itself (see Stability).

  **4. Fixed-Point Stability (Anti-Weaponization)**
  *   **Requirement:** Membership status $M$ for a voter $v$ must be invariant with respect to the outcome of policy $P$ being voted on. $M(v) \neq f(P)$.
  *   **Case/Consideration:** *The Itinerant Demos.* You proposed enfranchising those whose projects are set back. If a majority votes to tax a specific asset class, the owners of that asset are now "affected." If the rule says "only the affected vote," the majority can disenfranchise the minority *by the act of targeting them*. Conversely, they can enfranchise supporters by passing a subsidy only they qualify for, then immediately voting on permanence.
  *   **Why it bites:** This eliminates "decision-specific" franchises for standard governance. It requires membership to be defined *ex-ante* based on stable characteristics (residency, citizenship, stakeholding) rather than dynamic impacts.

  **5. Distinction Maintenance (The "Do Not Collapse" List)**
  *   **Requirement:** The rule must explicitly distinguish between:
      *   **Constitutional vs. Legislative Demos:** Those who amend the charter vs. those who pass bylaws. (Solves Non-Circularity).
      *   **Voice vs. Weight:** Membership grants access to the vote, not necessarily equal weight (e.g., stakeholder voting).
      *   **Exit vs. Voice:** In a voluntary community, the ability to exit (sell share, leave platform) substitutes for some voice. The franchise rule must account for whether exit rights are sufficient for non-members.
      *   **De Jure vs. De Facto:** A long-term resident without a vote (de jure) may have more influence (de facto) than an absentee voter. The rule must decide which one legitimizes the coercion.

  ---

  ### II. Meta-Analysis: Desiderata, Conflicts, and The Killer

  **Genuine Desiderata vs. Camp Commitments**
  *   **Standing Body vs. Per-Decision:** A standing body is a *practical* desideratum, not a moral one. Liquid democracy or sortition could work. However, for a charter city, a standing body is required for *investment security*. Investors need to know the rules won't change the electorate overnight.
  *   **"All-Subjected" as Axiom:** This is a camp commitment (Republican/Neo-Roman). It is not a functional requirement. You can have a legitimate property owners' association where renters are subjected to rules but not members.
  *   **Universal Suffrage:** This is a normative preference, not a functional requirement for the *boundary problem*. The boundary problem exists even if you only let landowners vote.

  **Incompatibilities (The Impossibility Theorems)**
  1.  **Legibility vs. Moral Precision:** You cannot satisfy Administrative Legibility and Perfect Affectedness Sensitivity. To make the rule legible (check a passport/lease), you must include some unaffected people (false positives) and exclude some affected people (false negatives). *You must choose your error margin.*
  2.  **Non-Circularity vs. Democratic Self-Determination:** If the demos must define itself, it is circular. If an external agent defines it, it is heteronomous. The only solution is *temporal*: The "Founders" (heteronomous) define the rule for the "Members" (self-determining), with a high bar for changing the rule itself.
  3.  **Stability vs. Responsiveness:** If membership is fixed to prevent weaponization (Fixed-Point), it becomes unresponsive to demographic shifts (e.g., a large class of long-term residents remains disenfranchised).

  **The Killer Constraint**
  **Administrative Legibility.**
  This is the single requirement that knocks out the most popular theoretical candidates.
  *   It kills **All-Affected Interests:** Calculating "interests" or "setbacks" is epistemically impossible for a clerk.
  *   It kills **Pure Coercion:** Determining who is "coerced" vs. "influenced" requires legal adjudication for every voter registration.
  *   It forces you toward **Formal Status:** Residency, Contract, or Shareholding. These are legible. They are morally imperfect, but they are the only ones that allow the machine to run without constant litigation over the franchise itself.

  ---

  ### III. Scorecard: Standard Families Against Specification

  | Family | Legibility | Non-Explosiveness | Non-Circularity | Fixed-Point Stability | Verdict for Charter/Seastead |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **All-Affected Interests** | **FAIL.** Requires counterfactual modeling for every vote. Clerk cannot decide. | **FAIL.** Causal chains are infinite. Demos explodes globally. | **PASS.** Defined externally by impact. | **FAIL.** Vulnerable to weaponized affectedness (gerrymandering via policy). | **Reject.** Theoretically robust, operationally impossible. |
  | **All-Subjected (Coercion)** | **LOW.** "Coercion" is legally legible, but "subject to" is fuzzy for non-citizens/residents. | **PASS.** Bounded by jurisdiction. | **PASS.** Defined by jurisdiction scope. | **PASS.** Status is usually stable (residency). | **Contender.** Requires strict definition of "jurisdiction" in charter. |
  | **Membership/Residency** | **HIGH.** Check lease, check ID, check registry. | **HIGH.** Bounded by physical/contractual border. | **PASS.** Defined by prior contract. | **HIGH.** Status doesn't change with policy outcomes. | **Winner.** Best fit for intentional community. Needs exit rights to mitigate exclusion. |
  | **Stakeholder (Share/Property)** | **HIGH.** Check ledger/title. | **HIGH.** Bounded by asset ownership. | **PASS.** Defined by acquisition. | **HIGH.** Asset ownership is stable relative to policy. | **Strong Contender.** Aligns incentives, but risks oligarchy. |
  | **Proceduralist (Signatories)** | **HIGH.** Check signature on Charter. | **HIGH.** Bounded by who signed. | **PASS.** The "Founding Moment" solves circularity. | **HIGH.** Hard to amend membership rule. | **Best for Constitutional Layer.** Use for Charter ratification, not bylaws. |

  ### IV. Recommendation for the Drafting Table

  You are stalling because you are trying to solve the *moral* boundary problem with a *legal* clause. You cannot.

  **The Solution: Layered Demos**
  1.  **Constitutional Demos (Fixed-Point):** Defined by **Proceduralist/Signatory** rules. Only those who sign the initial Charter (Founders) can vote on changing the *franchise rule itself*. This solves Non-Circularity and Weaponization. It creates a "hard shell."
  2.  **Legislative Demos (Legible):** Defined by **Membership/Residency** proxies (e.g., "Physical presence > 180 days + Leaseholding"). This satisfies the Clerk Test and Stability. It will exclude some affected people (neighbors) and include some unaffected (new residents). Accept this error margin as the cost of legibility.
  3.  **Mitigation (Exit & Review):** Since the Legislative Demos will be imperfect:
      *   Guarantee **Exit Rights** (sell share/leave) for those subjected but not enfranchised.
      *   Institute a **Sunset/Review Clause** on the franchise rule itself (e.g., "This clause must be reaffirmed by the Constitutional Demos every 10 years").

  **Final Note on "Weaponized Affectedness":**
  Your intuition is correct. Any rule that makes voting eligibility dependent on the *content* of the vote allows the majority to consume the minority's political rights. The franchise rule must be *blind* to the policy agenda. If you adopt the "itinerant demos," you are not building a government; you are building a mechanism for expropriation. Lock the door before you decide what's inside.
