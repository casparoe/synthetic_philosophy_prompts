          4.  Residue Report: What translated well, what was bent, what was lost (and whether that loss matters).
      *   **Constraints:** Mark standard vs. non-standard translations. Identify genuine philosophical disagreements vs. noise. Be plain about confusions if the request rests on one.

  2.  **Deconstruct Jeffrey Conditioning (JC):**
      *   *Standard Form:* $P_{new}(H) = \sum_i P_{old}(H | E_i) P_{new}(E_i)$.
      *   *Condition:* $\{E_i\}$ is a partition. $P_{new}(E_i)$ is set directly (not via conditioning on some $D$).
      *   *Rigidity (Sufficiency):* $P_{new}(H | E_i) = P_{old}(H | E_i)$. The relationship between hypothesis and evidence cell doesn't change, only the weight of the cells.
      *   *Problem:* Uncertain evidence. "It looks red" isn't "It is red."

  3.  **Drafting Section 1: Translation to Sensor Vocabulary:**
