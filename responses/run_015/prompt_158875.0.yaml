      *   *Concept:* Rigidity $\rightarrow$ Calibration stability. The likelihood function $P(Reading | State)$ doesn't change during the update, only the marginal probability of the Reading changes.
      *   *Concept:* Conditioning $\rightarrow$ Hard update (Reading = 100% certain).
      *   *Concept:* Jeffrey Conditioning $\rightarrow$ Soft update where the observation distribution is exogenously set, not derived from a likelihood model.
