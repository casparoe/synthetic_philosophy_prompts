      *   *Correction:* On Rigidity. Rigidity means $P_{new}(H|E) = P_{old}(H|E)$. In sensor fusion, this means the calibration matrix doesn't change during the update. This is a strong assumption.
      *   *Tone:* Respectful, technical, direct. Acknowledge the user's expertise.
