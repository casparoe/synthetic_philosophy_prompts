  *(Self-Correction on "Virtual Evidence"):* I need to be precise. Pearl's "Virtual Evidence" allows you to update using a likelihood ratio on a *virtual* node. This is mathematically equivalent to JC in many contexts but framed as likelihoods. This is the perfect bridge for the user. I will emphasize this.

  *(Self-Correction on Rigidity):* Rigidity is often the most contentious part. I need to explain that in engineering, we *assume* rigidity (calibration is constant), whereas philosophers ask *if* it holds.

