      *   *JC:* $P_{new}(H) = \sum P(H|E_i) P_{new}(E_i)$. Here $P_{new}(E_i)$ is *not* derived from a likelihood $P(E_i|H)$. It's imposed.
      *   *Virtual Evidence:* There is a bridge here. Pearl's "Virtual Evidence" allows likelihood ratios to be updated without hard data. This is closer to what the blog might mean, but strictly speaking, standard likelihood updates assume the *data* is certain. JC assumes the *data* is uncertain.
      *   *Verdict:* The blog is imprecise. Standard sensor fusion uses Likelihood Updates (Hard Data). JC is for when you don't trust the data enough to treat it as hard, but you also don't have a likelihood model for *why* it's uncertain (or the uncertainty is fundamental to the experience).
      *   *Rigidity Check:* In sensor fusion, we assume $P(Reading | State)$ is fixed (calibrated). This *is* the Rigidity condition. So the *assumption* is shared, but the *trigger* is different.

  5.  **Drafting Section 3: The User's "Kernel Rule":**
      *   *Rule:* Smoothing probability over neighbors (Red $\rightarrow$ Orange/Pink) based on wavelength kernel.
