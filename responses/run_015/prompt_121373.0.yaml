answer: |-
  **The Procedure**

  1.  **Forward Viability (Finance Officer):** Disregard all spend to date. Based *only* on the new money asked versus the new value created: Is the expected value of the remaining work greater than the remaining cost?
      *   *Sufficient Answer:* A quantified net positive value based on current market/need data.
      *   *Stop Point:* If No, proceed to Step 3. If Yes, proceed to Step 4.

  2.  **Completion Criticality (Engineers):** Is the project worthless if stopped now? (i.e., do returns sharply increase only upon completion?)
      *   *Sufficient Answer:* Yes/No based on technical asset integrity.
      *   *Note:* If No, past spend is irrelevant. If Yes, past spend creates a switching cost.

  3.  **Policy Exception (Chair):** Is there a verifiable external penalty for stopping (contractual, published promise)? Test: Could this reason be printed in our guidelines without inviting manipulation?
      *   *Sufficient Answer:* A specific clause or public commitment. "Embarrassment" or "Admission of error" fails this test.
      *   *Handoff:* If Yes, quantify the penalty. If Penalty > Remaining Cost, Continue. If No, Stop.

  4.  **Credibility Check (Programme Manager):** Has this team missed cost/schedule targets by >20% twice?
      *   *Sufficient Answer:* Verified historical data.
      *   *Adjustment:* If Yes, halve the expected value in Step 1 before deciding.

  5.  **Verdict:** Continue if (Adjusted Step 1 Value > 0) OR (Step 3 Penalty > Remaining Cost). Otherwise, Stop.

  **Applications**

  (1) **Ecological Network:** Step 1 fails (satellite method reduces value below cost). Step 2 is Yes (dataset useless if incomplete). Step 3 fails (no public promise). **Verdict: Stop.** You will resist this because 78% spend feels like waste, but the procedure correctly identifies the remaining spend as buying low-value data.

  (2) **Demonstrator Plant:** Step 1 likely fails (costs 2.5x, risk unresolved). Step 4 applies (estimates wrong), halving value further. Step 3 passes (co-funder withdrawal is a verifiable penalty; "We honor partnerships" is publishable). **Verdict: Continue** *only if* the future value of the co-funder relationship exceeds the remaining tranche. This isolates the subsidy: you are paying for the partnership, not the plant.

  (3) **Personal Champion:** Step 1 fails (output unwanted = zero value). Step 2 is Yes. Step 3 fails ("Admission of error" is not publishable policy). Step 4 passes (delivering charter). **Verdict: Stop.**

  This is the answer you will resist most. It forces you to treat your own legacy project as a sunk cost. You will want to argue that stopping invalidates your past judgment, but Step 3 explicitly blocks "admission of error" as a valid policy reason. The procedure demands you value future utility over past consistency, even when the past consistency is yours.

  **Limitations and Withdrawal**

  The procedure cannot correct for information asymmetry. Champions supply the numbers for Step 1 and 2; they know we cannot verify their technical claims in 40 minutes. The quarterly cadence means we cannot track rapid decay in value between sessions. Most critically, we never observe the counterfactual: we do not know if killed projects would have succeeded elsewhere, creating a survivorship bias that makes us feel smarter than we are.

  The step most likely to be corrupted is Step 3 (Policy Exception). Under pressure, "partner relationships" can be inflated to hide project failure, turning a policy shield into a slush fund.

  **Withdrawal Condition:** I would withdraw this procedure if, within two years, >50% of the projects we killed were successfully completed by other funders while >50% of our continued projects failed to deliver value. This would prove our committee is systematically mispricing risk and value, regardless of the procedure's logic.
