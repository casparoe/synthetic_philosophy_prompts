answer: |-
  Your hypothesis is correct, but it requires a slight sharpening to explain why the stalemate is so resilient. You have identified three distinct fault lines, but they are not merely traveling together; they are hierarchically ordered. The debate stalls not because participants disagree on all three, but because they disagree on which one is fundamental.

  Here is the diagnosis of the stalemate, an assessment of your "unstable screener-off" case, and a recommendation on what would actually constitute progress.

  ### 1. Diagnosis: The Hierarchy of Disagreement

  Your threefold hypothesis is not a restatement of the problem; it is a valid decomposition of the Exclusion Argument's hidden premises. However, it is slightly incomplete because it treats the three disagreements as co-equal. In practice, one is doing almost all the work, while the other two are defensive fortifications.

  **The Engine: The Ontology of Causation.**
  The primary driver of the stalemate is the first disagreement: whether causation is a relation in nature (production/transfer) or a feature of an explanatory model (dependence/invariance).
  *   **The Exclusionist** operates with a "production" intuition. Causation is a physical shove. If the physical domain is complete, every shove is accounted for. To add a mental shove is to overdetermine; to deny the physical shove is to violate completeness.
  *   **The Compatibilist** operates with a "dependency" intuition. Causation is about counterfactual stability and control. If manipulating the mental state changes the outcome, it is a cause, regardless of the underlying physical realization.

  **The Fortifications: Completeness and Contribution.**
  The other two disagreements you identified are usually deployed to protect the chosen ontology of causation.
  *   **Completeness:** Exclusionists treat the causal completeness of physics as an *ontological claim* (the physical facts fix all facts) to support the production view. Compatibilists treat it as a *methodological commitment* (physics seeks physical explanations) to leave room for the dependency view. They talk past each other because one sees it as a description of the world's furniture, the other as a rule of the scientific game.
  *   **Contribution:** Exclusionists demand the mental contribute a *physical force* (which it can't). Compatibilists argue it contributes *intelligibility or tracking* (which it does).

  **Why the Stalemate Persists:**
  The debate does not move because the Exclusion Argument is valid *relative to the production ontology*, and the Compatibilist replies are valid *relative to the dependency ontology*. Neither side can refute the other without begging the question against their opponent's core definition of "cause." When an exclusionist says, "The neural state did all the work," they mean "All the physical energy transfer." When a compatibilist says, "The mental state did the work," they mean "It is the stable variable for intervention." They are using the same word to describe two different relations.

  ### 2. Assessment of the "Unstable Screener-Off" Case

  Your "unstable screener-off" case is coherent, and it is a potent dialectical tool, but it will not break the stalemate. It sharpens the conflict rather than resolving it.

  **Coherence:**
  The case is metaphysically possible. It describes a scenario of radical multiple realizability combined with context-sensitive neural implementation. In trial 1, neural pattern $N_1$ realizes mental state $M$ and causes decision $D$. In trial 2, $N_2$ realizes $M$ and causes $D$. $N_1$ screens off $M$ in trial 1, and $N_2$ in trial 2. There is no type-identity or stable token-identity between $M$ and the $N$'s across the set, but there is screening-off at every token instance. This aligns with what we know about neural plasticity and degenerate systems in biology.

  **Which Way It Cuts:**
  The case forces each side to reveal their absolute commitment, but neither will concede.
  *   **For the Exclusionist:** This case vindicates exclusion. If *every* token instance of the decision is fully caused and screened off by a specific neural variable, the mental property $M$ is causally inert at the token level. The fact that $N_1$ differs from $N_2$ is irrelevant to the metaphysics of production. The "work" is done by the specific neural configuration present at the time. The stability of $M$ is merely epistemic convenience, not ontological weight.
  *   **For the Interventionist/Compatibilist:** This case vindicates mental causation. If the neural variables are unstable and idiosyncratic, they cannot support counterfactuals or generalizations. You cannot intervene on $N_1$ to produce $D$ in a future trial because the next trial might require $N_2$. Only $M$ supports the invariant generalization required for causal control. Therefore, $M$ is the *real* cause in the only sense that matters for science and agency.

  **Verdict on the Case:**
  It does not collapse, but it functions as a Rorschach test. It isolates the disagreement to the definition of causation (token-production vs. type-invariance). It shows that "screening off" is insufficient for causation if the screener-off lacks stability, but it also shows that "stability" is insufficient for causation if the stable property is realized by distinct, sufficient physical causes at every instance.

  ### 3. What Counts as Progress?

  Given this diagnosis, you should not expect progress in the form of a verdict on who is right. No empirical finding will solve this, because neuroscience can only show us the neural correlates (supporting the exclusionist's token-claim) while psychology can only show us the predictive utility (supporting the compatibilist's type-claim). No formal result will solve it, because causal graphs can be drawn to represent either perspective depending on how you define the nodes.

  **Progress requires a change of question.**
  The seminar should stop asking, "Do mental properties cause physical effects?" This question presupposes a single, monolithic relation called "causation" that both the mental and physical must compete for. This is the source of the exclusion problem.

  **The Proposal:**
  Progress would consist in agreeing to **dissolve the causal label** in favor of **explanatory autonomy**.
  1.  **Distinguish "Causal Production" from "Causal Explanation."** Concede to the exclusionist that mental properties do not *produce* physical effects in the sense of energy transfer or fundamental law instantiation. This satisfies the intuition behind physical completeness.
  2.  **Reframe the Mental Role.** Argue that mental properties provide *autonomous explanatory constraints* that physical descriptions cannot capture, not because they add a second cause, but because they carve the physical space into relevant counterfactual dependencies that the physical vocabulary obscures through noise or complexity.

  **Why this counts as progress:**
  It moves the debate from metaphysics (what exists) to methodology (how we model). It allows the physicalist to keep their ontology (the physical domain is complete) without rendering the mental epiphenomenal in the practical sense. The mental is not a "second push"; it is a "better map."

  If your seminar can agree that the Exclusion Argument successfully refutes mental *production* but fails to refute mental *explanatory autonomy*, the stalemate will break. The exclusionists get their ontology; the non-reductive physicalists get their science. The cost is admitting that "causation" was an ambiguous term covering two distinct concepts. If they are unwilling to pay that cost, then no progress is possible, because the dispute is not about the world, but about which linguistic framework gets to monopolize the word "cause."
