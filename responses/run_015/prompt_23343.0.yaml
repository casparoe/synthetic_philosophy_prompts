          *   *Claim:* "Capitalist exploits the worker by paying them less than the value of the labor they actually perform."
          *   *Nuance Check:* This is a common phrasing but technically tricky. Marx says the worker is paid the full value of their *labor-power*, not their *labor*. Labor itself has no value (it's the substance of value). Saying "paying less than the value of the labor" can imply a violation of exchange equivalence in the sphere of circulation, whereas Marx's point is that exchange is equivalent (wage = value of labor-power), but production yields surplus. However, in introductory contexts, "paying less than the value created by labor" is often accepted shorthand. I need to be careful here. The student says "paying them less than the value of the labor they actually perform." This is slightly imprecise terminology (labor doesn't have value, labor-power does), but captures the intuitive gist of surplus value extraction.
