answer: |-
  Here is the argument for reflexive blame, stripped of the hedging and built around a single load-bearing claim.

  ### The Argument: The Practical Resistance Condition

  The core of the view is that moral norms are not just abstract rules but practical demands that push back against human psychology. To blame someone is to invoke a demand. But the authority of that invocation depends on the blamer's relationship to the *difficulty* of the demand.

  **The Load-Bearing Premise: The Practical Resistance Condition.**
  *A blamer possesses maximal normative standing to address a violation only if they can credibly attest to the specific practical resistance the norm imposes on an agent.*

  **Why this premise is exposed:**
  This is the most vulnerable point because it inverts the standard intuition that moral authority tracks moral purity. It suggests that moral knowledge is partly phenomenological—you have to feel the weight of the norm to enforce it. The risk is that it makes morality look like a club for those who have struggled, potentially excluding the naturally virtuous or incentivizing failure to gain authority. It exposes the view to the charge that it values the *struggle* over the *right action*.

  **How to motivate and patch it:**
  You motivate this by observing what blame is *for*. Blame is not just a verdict; it is a communicative act aimed at securing future compliance by reactivating the norm in the target. For that communication to succeed, the target must recognize the blamer as someone who speaks the truth about the norm. If the blamer treats the norm as costless (the untested virtuous), the target hears, "You failed at something easy." If the blamer treats the norm as irrelevant (the hypocrite), the target hears, "I am using this rule to hurt you." Only the blamer who says, "This rule is hard, I broke it, it cost me, and I hold it anyway," speaks the full truth about the norm.

  To patch the vulnerability (the risk of incentivizing sin), you must insist on the word **verified**. The authority does not come from the violation itself, but from the *verification of the resistance* followed by the *re-affirmation of the norm*. The violation is the tuition; the authority is the degree. Without the re-affirmation (acknowledgment + stability), the verification is incomplete. This prevents the view from sliding into "sin is good." Sin is merely the necessary data point for a specific kind of moral wisdom.

  ### The Reductio: Does Worse Mean Better?

  The immediate objection is that this implies a "Sinner's Advantage." If standing tracks the grasp of resistance, shouldn't we staff integrity panels with the worst offenders? Should we seek out the engineer who collapsed three bridges rather than one?

  No. The Practical Resistance Condition distinguishes between *having encountered resistance* and *having mastered it*. The serial wrongdoer who acknowledges nothing fails the condition on the second count. They have verified the resistance (they felt the temptation), but they have not verified the *sustainability* of the norm. Their relationship to the norm is currently adversarial. They cannot attest to the norm's authority because they are currently denying it.

  This is where the distinction between **acknowledgment** and **wrongdoing** does its work. You asked why acknowledgment isn't doing all the heavy lifting. It is, but acknowledgment without the history of violation is cheap talk. Anyone can say, "I know it's hard." Only the person who actually fell and climbed back out can say, "I know exactly how hard it is, because it broke me once." The wrongdoing provides the *evidence* for the acknowledgment. Without the wrongdoing, the acknowledgment is theoretical. Without the acknowledgment, the wrongdoing is just a record of failure. You need the scar, not just the wound, and not just the story of a scar you never had.

  So, the view does not imply we should staff panels with active violators. It implies we should staff them with *recovered* violators. The serial wrongdoer is still in the tunnel; the reflexive blamer has reached the light and can describe the darkness with authority the clean-handed lack.

  ### The Classic Hypocrite

  On the standard Wallace-style view, the hypocrite (currently guilty, unrepentant) has standing but it is forfeited. On this view, the hypocrite **is not blaming at all.**

  Blame is a moral address that presupposes the blamer submits to the same normative jurisdiction as the target. When the classic hypocrite blames, they are not invoking a shared standard; they are wielding a weapon. Because they are currently violating the norm they invoke, their speech act is infelicious. It looks like blame, but it functions as distraction or dominance. They cannot attest to the practical resistance of the norm because they are currently capitulating to the pressure against it. They are effectively saying, "You must do this thing that I am finding too difficult to do myself, and I will punish you for failing where I am currently failing." That is not moral address; it is rivalry. They lack standing not because they are blocked from a role they occupy, but because they are failing to occupy the role of "blamer" in the first place. They are accusers, not moral agents in this specific exchange.

  ### The Untested Virtue Moralizer

  This view predicts that the person who has never been tempted—the naturally virtuous, or the lucky—offers a structurally thinner form of blame. Let's call this **Clean-Handed Blame**.

  When the untested moralizer blames, they often sound baffled or contemptuous: "Why would you even do that?" Their blame lacks the texture of empathy. They cannot credibly attest to the practical resistance because they haven't felt it. They treat the norm as a flat surface, whereas the reflexive blamer knows it is a wall. This doesn't mean the untested person is forbidden from blaming, but their blame carries less *normative weight* in a corrective context. They can enforce rules, but they cannot restore integrity. In the engineer case, the spotless colleagues can say, "You broke the rule." The retired engineer can say, "You broke the rule, and I know exactly how you talked yourself into it, and I am telling you that the cost of talking yourself out of it is lower than the cost of living with the break." The latter is a heavier, more authoritative claim because it accounts for the psychology of the violation.

  ### Institutional Design

  Finally, should institutions actually run on this? Yes, but with precision.

  If you are designing a punitive body (a court sentencing a first-time offender), you might want clean-handed blame to ensure impartiality and strict adherence to the code. But if you are designing a **restorative or integrity body** (like the professional panel in your case), you should prioritize reflexive blame.

  Institutions often fail because they are run by people who cannot imagine failure. They create compliance regimes that are theoretically sound but practically impossible, leading to widespread covert violation. An integrity panel staffed by "scarred guardians"—people who have violated, acknowledged, suffered, and returned—creates a culture where norms are understood as robust but difficult, rather than fragile and absolute. This encourages early self-reporting and genuine correction rather than cover-ups.

  The retired engineer in your case is not a liability; she is the most valuable person in the room. Her past does not disqualify her; it credentials her. She possesses a form of moral authority—the authority of the recovered—that the spotless colleagues structurally cannot access. To exclude her is to prefer the purity of the rule over the reality of the agent. If the goal of the panel is to ensure future integrity, you need the person who knows how integrity breaks and how it holds. That is reflexive blame, and it is superior to the clean-handed alternative for the specific work of moral repair.
