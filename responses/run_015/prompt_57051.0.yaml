      *   The "Load-Bearing Premise" needs to capture why the *cost* of the norm matters.

  3.  **Drafting the Argument (The Load-Bearing Premise):**
      *   *Idea:* Authority comes from knowing the weight of the norm.
      *   *Premise Name:* The Epistemic Weight Condition (or something similar). Let's go with **The Cost-of-Compliance Condition**.
      *   *Formulation:* A blamer has maximal normative authority over a specific violation only if they can credibly attest to the real cost of complying with the norm in question.
      *   *Why exposed?* Because it challenges the idea that morality is about rules, not costs. It risks making morality transactional.
      *   *Motivation:* Norms aren't abstract; they are practical demands. To enforce a demand, you must understand the pressure against it.

  4.  **Addressing the Reductio (The "Sinner's Advantage"):**
      *   *Objection:* If past sin helps, shouldn't we pick the worst sinners?
      *   *Response:* No. The value comes from the *integration* of the failure, not the failure itself. The serial wrongdoer lacks the *acknowledgment* and the *stability*. The view requires the blamer to have *settled* the norm within themselves. The past violation is instrumental, not intrinsic. It's the *scar*, not the *wound*, that grants authority.
