  11. **Final Polish:** Ensure the distinction between "Reflexive Blame" and "Clean-Handed Blame" is clear throughout. Make sure the Engineer case is woven in. (Self-Correction: Make sure I don't sound like I'm saying sin is *good*, but that the *recovery* from sin yields a specific epistemic good.)

