answer: |-
  I
  Four bodies cool beside the river bend,
  thirty kin watch the water rise.
  Kin count kin, there is no end
  to the names spoken under the skies.

  II
  Four bodies carried through the gate,
  one thousand heads bow over grain.
  The rate is small, the loss is late,
  recorded now in ink and rain.

  III
  Four bodies wrapped in linen sheets,
  one million feet pave the street.
  The statistic hides beneath the heats,
  lost where the crowds and traffic meet.

  IV
  Four bodies stiff in the northern snow,
  seven billion breathe where the tropics spread.
  The line goes down where the quiet grow,
  not because the ice gives up the dead.

  V
  Four granaries locked by the landlord's hand,
  seven billion watch the weather turn.
  No body lies upon the land,
  is there a fact for what never came?
