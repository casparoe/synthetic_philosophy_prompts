  *(Self-Correction Note on "Agreed Claims"):* I need to make sure I don't attribute agreement where there isn't any. For example, do they agree on *why* people sell sex? User might say "desperation," Priya might say "choice." I should frame it as "Economic pressure is a major factor" which both can accept without agreeing on the *degree* of choice.
  *(Self-Correction on Germany/NZ):* The prompt says they suspect they aren't agreeing on what the setups are. So an agreed claim could be "We agree we have been arguing past each other on the technical details of these regimes." That's meta, but useful. Better: "We agree that licensing requirements create barriers to entry." User sees this as good (shrinks market), Priya sees as bad (excludes workers). That's a disagreement. What's the agreement? "We agree that the German/Dutch model involves state licensing and the NZ model does not." Simple fact.

  Let's refine the "Agreed Claims" to be substantive beliefs, not just facts.
  1. Violence is the primary immediate risk.
  2. Criminalizing the seller worsens that risk. (Nordic agrees here, that's why they decrim the seller).
