  2.  **Brainstorming: Statue-Clay & Identity Over Time:**
      *   *The Ship of Theseus:* The classic puzzle. If you replace all parts, is it the same object?
      *   *Constitution View:* The statue is *constituted by* the clay but not *identical to* the clay. (Baker, Johnston). They share space/time but have different persistence conditions.
      *   *Mereological Essentialism:* The parts are essential to the whole. Lose one atom, it's a new object. (Chisholm). Generally considered counter-intuitive for ordinary objects.
      *   *Functionalism/Organizational View:* Identity lies in the structure/function, not the matter. (Common in biology, applied here to art).
      *   *Sortal Concepts:* What *kind* of thing is it? "Statue" vs. "Lump of Clay." Statues depend on artistic intent/form; lumps depend on matter.
      *   *The "Clay Ghost" Twist:* It's not just passive replacement (like erosion); it's *guided* replacement via an algorithm. This mimics biological homeostasis.
      *   *The Human Analogy:* Humans replace cells. Are we the same person? Psychological continuity vs. biological continuity.

  3.  **Evaluating the Dialogue Moves:**

      *   **Move (1) Mara:** Argues for persistence based on form + program (functional continuity). Analogy: Human cell turnover.
