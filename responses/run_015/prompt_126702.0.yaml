      *   *Kidney/Insulin/Votes/Surrogacy/Carbon:* Ensure these are woven into the explanations.
      *   *Discontinuous Threshold:* Make sure D2 covers the "friendship to contract" shift.
      *   *Participant vs. Good:* Make sure D3 distinguishes these clearly.
      *   *Economist vs. Philosopher:* The tone must bridge the gap. Acknowledge efficiency but insist on semantic reality.

  6.  **Self-Correction/Review during drafting:**
