      *   **Key Requirements:**
          *   Cover standard cases (kidneys, insulin, vote-selling, surrogacy, carbon offsets).
          *   Include edge cases (discontinuous conversion thresholds, partial pricing tolerance).
          *   Flag negotiability (Hard vs. Soft desiderata).
          *   Point out internal conflicts (trade-offs within the theory).
          *   Distinguish degradation of the *good* vs. degradation of the *participants*.
          *   Identify the single requirement that damages the pure welfare-economics view most.
      *   **Goal:** Prepare the user for a high-stakes seminar debate.

  2.  **Deconstruct "Repugnant Markets":**
      *   *Standard View (Roth, etc.):* Repugnance is a constraint on market design. It's often treated as a preference or a social norm.
      *   *Economist View:* Repugnance is usually irrational, based on information asymmetry, or status anxiety. Efficiency should win.
      *   *Philosopher View (Sandel, Anderson, etc.):* Markets corrupt the *meaning* of goods. Commodification is inherently degrading.
      *   *The Gap:* We need a theory that explains *why* some markets are repugnant without just saying "morality" (too vague for economists) or "inefficiency" (too blind for philosophers). It needs to handle the *non-linear* nature of repugnance (the "tipping point").

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Meaning-Shift Mechanism.*
          *   Need to explain how price changes the nature of the good.
          *   *Case:* Blood vs. Plasma (Titmuss).
          *   *Hard/Soft:* Hard. If the theory doesn't explain meaning shift, it's just standard econ.
          *   *Conflict:* Sometimes formalizing (pricing) protects dignity (surrogacy).

      *   *Desideratum 2: The Discontinuity Threshold.*
          *   This addresses the user's specific "edge case" request.
          *   *Concept:* Linear pricing works until it doesn't. Tipping points.
          *   *Case:* Friendship favors vs. hiring a friend.
          *   *Hard/Soft:* Hard. Standard econ assumes marginal changes; repugnance is often categorical.

      *   *Desideratum 3: Participant vs. Good Degradation.*
          *   User specifically asked for this distinction.
          *   *Case:* Selling a kidney (participant harm?) vs. Selling votes (good harm?).
          *   *Example to fill in:* Hazardous waste dumping in poor communities. The "good" (waste disposal) works fine, the *participants* are degraded/exploited. Or: High-frequency trading. The market works, participants become algo-zombies. Let's go with *exploitative labor in ethical goods* (e.g., fair-trade coffee that isn't). Actually, better: *Dangerous stunt work*. The service is performed, the good is delivered, but the participant is physically degraded. Or *paid medical testing*.
          *   *Refinement:* Let's use *paid military contracting (mercenaries)*. The "good" (security) is delivered, but the "participant" (citizen-soldier ideal) is degraded. Or better: *Surrogacy*. The baby (good) is fine, the mother (participant) might be degraded OR protected depending on regulation.
          *   *Selection:* Let's use *hazardous paid medical trials*. The drug (good) is developed, the participant (subject) is reduced to a biological vessel.

      *   *Desideratum 4: The Prohibition Paradox (Underground Markets).*
          *   Need to account for the unintended consequences of banning.
          *   *Case:* Surrogacy, Drugs.
          *   *Hard/Soft:* Soft/Negotiable. A theory of *repugnance* might not need to solve *policy*, but it needs to explain why the repugnance persists despite the harm of bans. Let's make it Hard for a *policy-relevant* theory, but Soft for a *phenomenological* theory. Let's mark it Hard because the prompt implies a spec sheet for a robust theory.

      *   *Desideratum 5: The Welfare-Economics Breaker.*
          *   What kills the "it's just status anxiety" argument?
          *   *Idea:* Incommensurability. If price *destroys* the good, welfare calculations are impossible because the good no longer exists to be valued.
          *   *Selection:* The "Constitutive Corruption" requirement.

  4.  **Refining and Polishing:**
      *   *Language:* Needs to be precise. Use terms like "commensuration," "constitutive rules," "marginal utility," "lexicographic preferences."
      *   *Structure:* Numbered list, clear headers, Hard/Soft flags, Conflict notes.
      *   *The "Killer" Requirement:* Needs to be highlighted at the end.

