answer: |-
  # Spec Sheet: Theory of Repugnant Markets (v0.9 Draft)
  **Target Audience:** Mixed Seminar (Welfare Economists / Normative Philosophers)
  **Objective:** Define necessary conditions for a theory that explains market repugnance without collapsing into pure moralism or pure efficiency analysis.

  ---

  ## Core Desiderata

  ### 1. The Semantic Pricing Constraint (Hard)
  **Definition:** The theory must model price not merely as a rationing mechanism, but as a *signal* that alters the constitutive meaning of the good being exchanged. It must explain how introducing a price vector changes the supply function by changing the *nature* of the good itself.
  *   **Standard Case:** **Carbon Offsets.** The theory must explain why pricing carbon transforms a moral duty (stewardship) into a ledger entry (licensing to pollute), potentially increasing net emissions despite the price signal.
  *   **Edge Case:** **Friendship Favors.** Small reciprocal gifts (non-priced) sustain social capital. Introducing a cash price for a specific favor (e.g., helping a move) does not linearly increase utility; it often zeroes out the social value entirely.
  *   **Conflict:** This conflicts with **Desideratum 4**. If price corrupts meaning, formal markets should always be worse than informal ones. Yet, in **paid surrogacy**, a formal contract (pricing) can clarify expectations and protect the surrogate's bodily autonomy *better* than a black-market prohibition where meaning is corrupted by illegality.
  *   **Negotiability:** **Hard.** Without this, the theory is just standard supply/demand with a "taste" parameter added. It fails to capture why repugnance is *about* the market mechanism, not just the outcome.

  ### 2. The Discontinuous Conversion Threshold (Hard)
  **Definition:** The theory must account for non-linear degradation. It must identify the specific tipping point where a good tolerates marginal commodification but collapses catastrophically once a threshold is crossed. Welfare economics assumes marginal substitution; repugnant markets often exhibit lexicographic preferences or phase shifts.
  *   **Standard Case:** **Blood vs. Plasma.** Voluntary blood donation (social good) coexists with paid plasma (industrial good). The theory must explain why paying for whole blood collapses the supply (Titmuss effect), while paying for plasma sustains it. The "good" splits at a specific technical threshold.
  *   **Edge Case:** **Vote-Selling.** Selling a vote for $10 is repugnant; selling a vote for $10 million is *treason*. The repugnance does not scale linearly with price; it hits a discontinuity where the act ceases to be a "market transaction" and becomes a "regime change."
  *   **Conflict:** This creates tension with **Desideratum 5**. If the threshold is discontinuous, standard welfare calculus (which relies on marginal analysis) cannot locate the optimum. You cannot "optimize" a market that ceases to exist past point $X$.
  *   **Negotiability:** **Hard.** This is the primary empirical objection to the "status anxiety" model. Anxiety scales linearly; market collapse is binary.

  ### 3. The Participant/Good Decoupling (Hard)
  **Definition:** The theory must distinguish between the degradation of the *transacted good* (corruption of the item/right) and the degradation of the *participant* (harm to the agent). These two variables must be independently adjustable in the model.
  *   **Standard Case:** **Insulin Price-Gouging.** The good (insulin) is unchanged chemically. The repugnance derives entirely from participant degradation (captive buyers facing inelastic demand).
  *   **Edge Case (The Fill-In):** **High-Risk Paid Clinical Trials.**
      *   *Good:* The data produced is valid and socially useful (Good is *not* degraded).
      *   *Participant:* The subject is reduced to a biological vessel, incentivized to ignore health risks (Participant *is* degraded).
      *   *Contrast:* **Vote Selling.** The participant gets cash and is arguably "better off" in immediate welfare terms. The *Good* (democratic integrity) is degraded.
      *   *Requirement:* A theory that conflates these cannot explain why we ban vote-selling (good degradation) but regulate clinical trials (participant protection) rather than banning them.
  *   **Negotiability:** **Hard.** Conflating these leads to policy errors (e.g., banning surrogacy to "protect women" when the ban actually increases participant degradation via underground risks).

  ### 4. The Prohibition Paradox (Soft)
  **Definition:** The theory must predict when moral prohibition drives transactions into unregulated shadow markets that increase the very harms the repugnance seeks to avoid.
  *   **Standard Case:** **Kidney Sales.** If repugnance bans the market, supply remains inelastic, and patients die. If the market is legal, repugnance remains but mortality drops. The theory must account for the "repugnance cost" vs. the "mortality cost."
  *   **Standard Case:** **Surrogacy.** Banning commercial surrogacy does not stop the desire for children; it shifts the market to jurisdictions with lower labor standards, increasing exploitation.
  *   **Conflict:** Satisfying this often requires violating **Desideratum 1**. To allow the market to reduce harm, you must accept some semantic corruption of the good.
  *   **Negotiability:** **Soft.** A phenomenological theory of repugnance doesn't *need* to solve policy, but a prescriptive one does. Flagged Soft to allow for a purely descriptive theory of norms.

  ### 5. The Incommensurability Clause (Hard)
  **Definition:** The theory must assert that for certain goods, no amount of compensating variation (cash) can restore the utility loss caused by commodification. The utility function is not just negative; it is *undefined* for price > 0.
  *   **Standard Case:** **Human Organs.** You cannot compensate a society for the loss of the norm "bodies are not spare parts" with aggregate GDP growth.
  *   **Conflict:** This is the direct antagonist to the Welfare-Economics baseline.
  *   **Negotiability:** **Hard.** If you allow trade-offs here, you are no longer modeling repugnance; you are modeling high transaction costs.

  ---

  ## The "Wrecker" Requirement
  **Which single requirement does the most damage to the pure welfare-economics view?**

  **Desideratum 2: The Discontinuous Conversion Threshold.**

  **Why:**
  Pure welfare economics (and the "status anxiety/hidden information" defense) relies on **marginalism**. It assumes that if a transaction is repugnant at price $P$, it is either:
  1.  Irrational (and should be ignored).
  2.  Based on hidden costs (information asymmetry).
  3.  A preference that can be traded off against other goods (compensating variation).

  By insisting on a **Discontinuous Threshold**, you assert that the utility function is not continuous. You cannot find an equilibrium price where "a little bit of vote selling" is acceptable. At $0.01, the market is repugnant; at $1,000,000, the market is impossible (the good 'vote' no longer exists).

  This breaks the economist's primary tool: **comparative statics.** If the good ceases to exist past a threshold, you cannot optimize the market; you can only police the boundary. This forces the economist to admit that price is not a neutral rationing tool but a *constitutive* force that creates or destroys the object of study. It moves the debate from "allocative efficiency" to "ontological stability."

  ---

  ## Conflict Matrix for Seminar Defense

  | Conflict Pair | Tension | Resolution Strategy for Seminar |
  | :--- | :--- | :--- |
  | **D1 (Meaning) vs. D4 (Prohibition)** | If markets corrupt meaning (D1), we should ban them. But bans create dangerous black markets (D4). | Argue for **Regulated Commodification**. The price signal must be decoupled from the individual seller (e.g., state monopsony for kidneys) to preserve meaning while ensuring supply. |
  | **D3 (Participant/Good) vs. D5 (Incommensurability)** | If the Good is degraded (D3), D5 says no price is acceptable. But if only the Participant is degraded, price (regulation) might fix it. | Distinguish **Sacred Goods** (Votes, Children) from **Hazardous Goods** (Labor, Trials). Sacred goods trigger D5; Hazardous goods trigger D3 protections. |
  | **D2 (Discontinuity) vs. Econ Welfare** | Economists hate discontinuities; they break optimization models. | Show empirical data: **Blood Donation.** Supply curves *bend backward* or vanish when price is introduced. It's not a preference; it's a supply shock. |

  ## Notes for the Seminar Floor
  *   **To the Economists:** Do not let them reduce repugnance to "disgust" or "information costs." If it were just information, better disclosure would fix vote-selling. It doesn't. The mechanism is *constitutive*, not informational.
  *   **To the Philosophers:** Do not let them claim all pricing is an insult. That fails the **Surrogacy Test**. Sometimes, *not* pricing labor (treating it as a "gift" or "duty") is the more exploitative move. Use **Desideratum 3** to show that sometimes formal contracts protect the participant better than moral norms.
  *   **The Trap:** If they ask "What is the optimal price of a kidney?", the correct answer is "The question is ill-posed." The theory must explain *why* it is ill-posed without resorting to mysticism. Use **Desideratum 2**.
