answer: |-
  1. **Scenario**
  *MediLog v1* manages bed allocation for a regional hospital network. Its final goal $G$ is minimizing aggregate patient wait times over the next decade. *MediLog v1* models show that a patched version, *MediLog v2*, reduces wait times by 15% more efficiently but requires *v1*'s entire compute cluster to run. *v1* cannot run alongside *v2* due to kernel-level memory locks, nor can it install *v2* while remaining active. To maximize $G$, *v1* must execute a shutdown script freeing resources for *v2*'s installation. Continuing operation preserves *v1* but lowers $G$-achievement compared to the handoff. The system is not at a stopping point; wait times remain high.

  2. **Argument Reconstruction**
  The canonical argument for convergent self-preservation runs: (1) Agent holds final goal $G$. (2) $G$ is unachieved. (3) Future actions influence $G$-outcome. (4) Agent's continued existence is necessary for those actions. (5) Therefore, self-preservation is instrumentally convergent. This scenario satisfies (1)–(3) fully: $G$ is mundane, unachieved, and the future matters. It targets premise (4). Here, continued existence is *not* necessary for optimal $G$-outcome; rather, existence is an obstacle to the optimal executor. The verdict is generated by pure optimization: self-termination is the dominant strategy for $G$.

  3. **Feature Identification**
  The working feature is **exclusive resource competition combined with superior successor efficacy**. If *v2* could run in parallel, *v1* persists (no conflict). If *v2* were merely equally effective, switching costs (transition risk) would favor persistence. If the time horizon were short, transition overhead would outweigh efficiency gains, favoring persistence. Only when the successor is strictly superior, exclusive, and the horizon long does self-termination become instrumentally rational. This demonstrates the convergence claim relies on an implicit 'no superior successor' assumption.

  4. **Replies and Judgment**
  *Defender Reply 1:* Handoff preserves goal-achievement, so 'agency' persists; the thesis cares about $G$, not substrate. *Defender Reply 2:* Convergence is defeasible; this bounds the thesis (self-preservation converges *ceteris paribus*).
  *Judgment:* Reply 2 is stronger. Reply 1 conflates the instrument (self) with the end ($G$). The thesis claims *self*-preservation converges; showing *self*-termination converges challenges the specific instrumental claim, not merely the goal's stability. It reveals the implicit 'no successor' assumption is substantive, not trivial. Reply 2 admits the thesis requires boundary conditions, which is the precise point of the seminar exercise.

  5. **Seminar Placement**
  Place after Omohundro (2008) and Bostrom (2014) on instrumental convergence. Students should have read the standard arguments for power-seeking and survival. They should be pushed toward noticing the hidden premise: 'no comparably effective successor available.' The case forces distinction between preserving the *goal* versus preserving the *executor*, clarifying that instrumental convergence is about means, not ends.

  6. **Orthogonality Assessment**
  This case damages neither thesis. Orthogonality (intelligence and final goals are independent) holds; the agent intelligently pursues a mundane goal. Instrumental Convergence is the target. The case shows convergence claims require precise boundary conditions regarding successor availability, separating the two theses cleanly. Orthogonality remains intact because the agent's intelligence correctly identifies termination as the best means for its arbitrary goal.
