      *   *Double Counting:* The user says Neglectedness is used as evidence *against* importance/tractability sometimes. I need to make sure I address the *directionality* of the signal.
      *   *Room for Funding:* This is the strongest link to Marginalism. If the Friend is right (Credit-Share), Room for Funding matters less than "Necessary Contribution."

  12. **Final Polish:** Check against all constraints in the prompt. (Don't say "it's just EV heuristic." Be concrete on the 4 habits.)

