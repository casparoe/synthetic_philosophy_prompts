      *   *Section 5: Counterfactual vs. Credit-Share (The Concrete Swap).* Analyze the 4 habits.
      *   *Section 6: The Double-Counting Defense.* Formulate the friend's best rebuttal.
      *   *Conclusion:* Summarize the "Two Theories" problem.

