answer: |-
  This is a sophisticated dissection of the machinery underlying modern philanthropic prioritization. You are right to suspect that the standard framework (Importance $\times$ Tractability $\times$ Neglectedness, or ITN) is not a neutral calculator but a theory-laden instrument. It claims to be a tool for **Act Consequentialism** (maximizing counterfactual good), but its operational habits often rely on **Epistemic Social Proof** and **Portfolio Theory** in ways that contradict its official justification.

  Here is the reconstruction of the implicit theory, disciplined by your constraints.

  ### 1. The Theory of Practical Reasons: Marginalism vs. Search Heuristics

  **What the practice strictly presupposes:**
  The allocation rule ("concentrate on the highest score") strictly presupposes **Marginalist Act Consequentialism**. It assumes the moral goal is to maximize the state of the world, and that the moral value of an action is defined entirely by the difference its absence would make (the counterfactual). This is why "Room for More Funding" is a hard constraint: if your dollar is displaced by another dollar (crowding out), the counterfactual impact is zero, regardless of the output produced.

  **What merely sits well with it:**
  The *scoring* of Neglectedness sits well with **Epistemic Social Proof**, but contradicts the strict marginalist view.
  *   *Marginalist View:* Neglectedness matters only because of diminishing returns. A cause should be *more* attractive if others are funding it (proof of viability), provided marginal returns haven't hit zero.
  *   *Operational View:* Neglectedness is often treated as a positive value multiplier *in itself*. The framework treats "uncrowded" as intrinsically better, implying that the *presence* of other funders reduces the value of the cause independent of marginal returns. This suggests a hidden **Distinctness Principle**: doing something *others aren't doing* has value beyond the output.

  **The Double-Counting Tension:**
  You are correct that the framework uses "Neglectedness" in two incompatible directions.
  1.  **As a Economic Variable:** Fewer funders $\rightarrow$ Higher Marginal Utility (Good).
  2.  **As an Epistemic Signal:** Fewer funders $\rightarrow$ Lower Probability of Success/Importance (Bad).
  The framework resolves this by hand-waving: it assumes the Economic Variable dominates until a "crowding" threshold is met. But logically, if you treat Neglectedness as evidence of low Tractability (why else are smart people avoiding it?), you should lower the Tractability score, not add a separate Neglectedness multiplier. Doing both risks double-counting the same informational signal.

  ### 2. Non-Consequentialist Endorsement and Underdetermination

  Could a non-consequentialist (e.g., a deontologist focused on "doing our part" or a virtue ethicist) endorse this scoring without inconsistency?

  **The Scoring:** Yes. A non-consequentialist can agree that saving lives is better than not saving them, and that efficiency is a virtue. The *axes* (Importance, Tractability) are underdetermined; they are compatible with a duty of beneficence.

  **The Allocation:** No. The advice to **concentrate** everything on the single highest-scoring cause is incompatible with most non-consequentialist views.
  *   **Fairness/Diversity:** A duty-based view might require supporting a plurality of goods (arts, dignity, relief) rather than monoculture.
  *   **Complicity:** If the "highest scoring" cause involves morally ambiguous means (e.g., coercive institutions that save lives efficiently), a non-consequentialist must reject it. The framework's silence on "unmodelled effects" (coercion, dignity) presupposes that **Outcome Value swamps Process Value**.
  *   **Underdetermination:** The practice is *not* underdetermined here. The concentration advice forces a maximizing logic that excludes "doing one's part" in a broader ecosystem. If everyone "does their part" in the highest-scoring cause, the ecosystem collapses into fragility.

  ### 3. Commensurability, Aggregation, and the Unmodelled

  **Commensurability:**
  The practice strictly presupposes **Strong Commensurability**. You cannot multiply "Lives Saved" by "Tractability" (a probability or cost-ratio) unless the output is a single currency of value (Utility). This rules out lexical priorities (e.g., "Rights cannot be traded for Welfare").

  **Aggregation:**
  It presupposes the **Total View** of population ethics (summing welfare across all individuals) and an **Impersonal** stance (it doesn't matter *who* is helped, only *how much* help). It is generally agnostic on Person-Affecting views unless framed specifically as "existing lives."

  **The Epistemology of Unmodelled Effects:**
  The refusal to score unquantifiable factors (dignity, culture) is **not** a sensible response to cluelessness; it is a **Bias of Metric Fixation**.
  *   *Cluelessness Argument:* "We don't know the second-order effects, so we assume they net to zero."
  *   *The Contradiction:* If you admit uncertainty is an order of magnitude, you cannot assume unmodelled effects net to zero. By assigning them a weight of *zero* in the calculation, the framework presupposes that **Quantifiable Proxies are Sufficient Statistics for Moral Value**. This is a substantive metaphysical claim: that what counts is what can be counted. It condemns itself because it claims to maximize *Expected Value*, but systematically excludes high-variance, hard-to-model variables from the expectation calculation.

  ### 4. Concentration, Uncertainty, and Risk Neutrality

  **Is concentration compatible with uncertainty?**
  Mathematically, **no**. If the estimates are uncertain by an order of magnitude, the probability that the #1 cause is actually the #1 cause is low. Standard portfolio theory dictates diversification to hedge against model error.

  **The Smuggled Commitment:**
  The practice requires **Risk Neutrality** over welfare units.
  *   To justify concentration despite uncertainty, you must believe that a 10% chance of 1,000 units is equivalent to a 100% chance of 100 units.
  *   *Moral Status:* This is a massive, substantive moral commitment. Most moral intuitions are risk-averse regarding catastrophic failure (e.g., ensuring *some* aid reaches *everyone* vs. *maximum* aid reaches *some*). By enforcing concentration, the framework smuggles in the claim that **the linearity of value outweighs the risk of ruin**. It treats moral value like a financial bet with infinite bankroll, which is a specific (and controversial) ethical stance, not a neutral mathematical truth.

  ### 5. Counterfactual vs. Credit-Share: The Concrete Swap

  Your friend's "Credit-Share Accounting" (Value / Number of Funders) is essentially a rough approximation of **Shapley Values** in cooperative game theory. It shifts the theory from "Marginal Difference" to "Proportional Contribution."

  **Which feature is doing the real work?**
  The **Room-for-More-Funding** constraint is the engine of the current practice. It enforces the Marginalist view. Without it, the ITN score is just a ranking of "attractiveness," not "actionability."

  **If we swap to Credit-Share (Friend's View), here is what happens to the four habits:**

  1.  **Scoring (3 Axes):** **Collapses/Changes.** Neglectedness is no longer a multiplier for marginal returns. It becomes a divisor for credit. A cause with 1 funder gives you 100% credit; a cause with 100 funders gives you 1% credit.
  2.  **Room-for-More-Funding:** **Collapses.** In a Credit-Share model, it does not matter if the cause is "full" in terms of marginal utility. It only matters if your contribution is *necessary* to reach a threshold or if your share of the credit is worth the cost. You could fund a "crowded" cause if the total value is high enough to make your 1% share valuable.
  3.  **Score Drops when Others Enter:** **Survives (but rationale shifts).** The score drops not because your dollar buys less *impact*, but because you own less *credit*.
  4.  **Concentration Advice:** **Collapses.** In a Credit-Share model, diversification becomes rational. If you want to maximize your "moral portfolio," you might buy 1% of ten different huge wins rather than 10% of one risky win.
  5.  **Field-Building (Attracting Funders):** **Becomes Paradoxical.** Under Marginalism, attracting funders is good until marginal returns drop. Under Credit-Share, attracting funders *dilutes your value*. You would only run field-building programmes if the Total Value grows super-linearly (e.g., 10 funders create 100x value, so your 1/10th share is still bigger than your 1/1 share of the smaller pot).

  **Verdict:** Your friend is right that the *habit* of avoiding crowded causes looks like Credit-Share thinking (fear of dilution), but the *justification* given (marginal returns) is Counterfactual. The practice is running on two theories.

  ### 6. The Sharpest Objection to Your Double-Counting Charge

  Your friend's strongest defense is not that the framework is consistent, but that **Neglectedness is a Proxy for Uncorrelated Alpha.**

  **The Argument:**
  "The framework isn't double-counting; it is performing a **Bayesian Update on Tractability** while simultaneously measuring **Marginal Utility**.
  1.  **Tractability Axis:** We estimate how hard the problem is *technically*.
  2.  **Neglectedness Axis:** We estimate how hard the problem is *economically* (crowding) AND we update our belief about hidden technical difficulties.
  If smart people avoid a cause, we lower our probability estimate of success (Epistemic). If few people fund a cause, we raise our estimate of marginal impact (Economic). These are two different functions of the same variable. We are not double-counting; we are acknowledging that 'Neglectedness' is a composite variable that informs both $P(Success)$ and $Value(Marginal Dollar)$."

  **Why this might fail:**
  This defense holds only if the "Epistemic Signal" is explicitly baked into the Tractability score. In practice, advisors often keep Tractability high (it's solvable!) while also scoring Neglectedness high (no one is doing it!), which implies they believe the *reason* no one is doing it is not difficulty, but oversight. If they believe it's oversight, they cannot also use it as evidence of difficulty. They cannot have it both ways.

  ### Summary Verdict

  The practice presupposes **Marginalist Act Consequentialism** with a hidden commitment to **Risk Neutrality** and **Metric Fixation**. It claims to be about Counterfactual Difference-Making, but operationally functions like a **Venture Capital Portfolio** (seeking uncrowded, high-upside assets).

  Your friend's "Credit-Share" model exposes the incoherence: if the goal were truly Counterfactual Difference, "Room for Funding" would be the only constraint that matters. The fact that "Neglectedness" is prized even when Room for Funding is unclear suggests the practice is secretly motivated by a desire for **Distinctness** (being the one who solved it) or **Epistemic Arbitrage** (knowing something others don't), neither of which fits the official Consequentialist story. The framework is not a heuristic for Expected Value; it is a **ritual for legitimizing high-risk, high-concentration bets** under the guise of neutral calculation.
