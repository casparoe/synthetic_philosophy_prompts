  Print the Excel formulas provided above **today**. Run a simulation of 100 trials on your own laptop to verify the averages match my predictions (R1 ~85%, R3 ~60%). If your Excel `RAND()` behaves differently, adjust the thresholds slightly. This ensures you aren't surprised by the data during the session.
