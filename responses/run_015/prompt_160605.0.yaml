answer: |-
  Here is a complete, runnable plan designed for your constraints (90 mins, 18 students, 1 hour prep, minimal math).

  ### Executive Summary: What to Cut and Keep
  You have too many rounds for 90 minutes. To make the **Correlation** and **Asymmetric Costs** insights land (which are the most valuable), we must streamline.
  1.  **Keep:** Round 1 (Baseline), Round 2 (Incompetence/Size), Round 3 (Correlation), Round 4 (Costs).
  2.  **Cut:** The "Unequal Weight/Expert" round. The insight ("experts matter") is intuitive. The insight ("correlation kills independence") is not.
  3.  **Correction:** Your intuition on "adding a voter makes it worse" is **false** for independent voters with $p > 0.5$. Under simple majority, adding an independent competent voter *always* increases accuracy. I have built the debrief to bust this myth explicitly.
  4.  **Tuning:** For Round 2, I have tuned competence to **0.4** (not 0.45). At 0.45, the gap between small and large groups is too small to see in 3 trials. At 0.4, the large group fails visibly.

  ---

  ### 1. Prep Checklist (1 Hour Max)
  **Materials:**
  *   12 Sheets of A4 paper (for cards).
  *   Scissors or paper guillotine (essential for speed).
  *   18 Envelopes (optional, but "Fold & Hold" works if time is tight).
  *   Bowl/Box for collecting votes.
  *   Tokens (chips, sweets, or just a tally sheet on the whiteboard).
  *   Whiteboard & Markers.

  **The Card Generation Recipe (Excel):**
  You need 4 decks of cards. Do not generate these live.
  *Open a spreadsheet. Set Calculation to 'Manual' if needed, but standard formulas work.*

  **Global Settings:**
  *   **Truth:** For each Trial (1-3), decide the Ground Truth. Let's make "Green" the Truth for all trials to keep it simple, or randomize. *Recommendation: Randomize Truth per trial to prevent pattern spotting.*
      *   Cell `A1`: `=RANDBETWEEN(0,1)` (0=Innocent, 1=Guilty). Drag across for 3 trials.
  *   **Students:** Rows 1-18. Trials: Cols A-C.

  **Deck 1: Baseline (Independent, $p=0.6$)**
  *   Formula for Student $i$, Trial $t$: `=IF(RAND() < 0.6, $A$t, 1-$A$t)`
  *   *Logic:* 60% chance to see Truth, 40% chance to see Lie.
  *   *Print:* 18 rows x 3 cols. Cut into 54 cards. Label back "Deck 1".

  **Deck 2: Incompetence (Independent, $p=0.4$)**
  *   Formula: `=IF(RAND() < 0.4, $A$t, 1-$A$t)`
  *   *Logic:* 40% chance to see Truth.
  *   *Print:* 54 cards. Label back "Deck 2".

  **Deck 3: Correlation (Marginal $p=0.6$, Dependent)**
  *   *Step 1 (Source):* Cell `Z1`: `=IF(RAND() < 0.6, $A$1, 1-$A$1)`. (The "Common Signal").
  *   *Step 2 (Voter):* Formula for Student $i$: `=IF(RAND() < 0.9, $Z$1, IF(RAND() < 0.6, $A$1, 1-$A$1))`
  *   *Logic:* 90% chance to copy the Common Signal. 10% chance to draw independently ($p=0.6$).
  *   *Math Check:* Marginal Accuracy = $0.9(0.6) + 0.1(0.6) = 0.6$. Group Accuracy $\approx$ Source Accuracy ($0.6$).
  *   *Print:* 54 cards. Label back "Deck 3".

  **Deck 4: Costs (Same as Deck 1)**
  *   Reuse Deck 1 cards to save prep time.

  **Room Layout:**
  *   Horseshoe or Cluster. Everyone must see the Whiteboard.
  *   Designate a "Ballot Box" (a mug or bowl) at the front.

  ---

  ### 2. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Hand out **Deck 1**. Explain: "You are jurors. Card = your private signal. Green = Guilty, White = Innocent. Truth is fixed per trial. Vote by dropping slip in box." |
  | **05-20** | **Round 1** | **Baseline ($p=0.6$, Indep).** Run 3 trials. Tally group verdict vs. Truth. Award chips for correct group verdict. *Expected Group Accuracy: ~85%.* |
  | **20-35** | **Round 2** | **Incompetence ($p=0.4$).** Split room: Left (6 students), Right (12 students). Hand out **Deck 2**. Run 3 trials. Compare Small Group vs. Large Group accuracy. *Expected: Small > Large.* |
  | **35-60** | **Round 3** | **Correlation ($p=0.6$, Dep).** Hand out **Deck 3**. Emphasize: "Same rules as Round 1." Run 3 trials. Tally. *Expected Group Accuracy: ~60% (Same as individual).* **Crucial Pause.** |
  | **60-70** | **Round 4** | **Asymmetric Costs.** Hand out **Deck 1** again. New Rule: "Convicting Innocent = -10 chips. Freeing Guilty = -1 chip." Ask: "Does Majority Rule still work?" Run 2 trials. Let them fail. Ask for new rule (e.g., 2/3 majority). |
  | **70-80** | **Debrief** | Projector ON. Map rounds to assumptions. Reveal CJT. |
  | **80-90** | **Wrap** | Q&A. Distribute sweets/chips. |

  ---

  ### 3. Facilitator Script (Minimalist)

  **Start (00:00):**
  "Welcome. You are jurors. There is a Defendant. They are either Guilty (1) or Innocent (0). You will not know the truth until the end of the trial.
  You will receive a card. This is your private signal. It is not always right.
  **Rules:**
  1. Look at your card. Do not show it.
  2. Vote Guilty or Innocent on this slip.
  3. Put it in the box.
  4. If the Majority is right, everyone gets a chip.
  5. No talking."

  **Between Rounds:**
  "New trial. New cards. Same rules." (Round 2: "Left side, you are Jury A. Right side, Jury B. I will score you separately.")
  (Round 3: "Same rules as Round 1.")
  (Round 4: "New Payoff. If we convict an Innocent person, we lose 10 chips. If we free a Guilty person, we lose 1 chip. Majority rule still applies... for now.")

  **The Reveal (Round 3 Debrief):**
  "Look at your scores. In Round 1, you were individuals (60%) but a great team (85%). In Round 3, you were individuals (60%) but a mediocre team (60%). Your cards didn't change. *The room changed.* Discuss with your neighbor for 60 seconds: Why?"

  ---

  ### 4. Payoff Scheme & Scoring

  *   **Currency:** Poker chips or sweets.
  *   **Round 1, 2, 3:** 1 Chip per correct **Group** Verdict. (Encourages team success, not individual ego).
  *   **Round 4:**
      *   Correct Verdict: +1 Chip.
      *   False Acquittal (Guilty goes free): -1 Chip.
      *   False Conviction (Innocent jailed): -10 Chips.
      *   *Note:* With Majority Rule (10/18), they will likely Convict too often and hit the -10 penalty. This creates the "squirm."

  ---

  ### 5. Debrief Guide (Projector ON)

  **Slide 1: The Scoreboard**
  *   Display the accuracy rates they just generated.
      *   R1 (Indep, $p>0.5$): High Group Accuracy.
      *   R2 (Indep, $p<0.5$): Large Group < Small Group.
      *   R3 (Corr, $p>0.5$): Group Accuracy = Individual Accuracy.
  *   **Ask:** "In Round 3, did anyone feel less competent?" (No). "So why did the group fail?"

  **Slide 2: Condorcet Jury Theorem (The Name Drop)**
  *   Show the formula: $P(\text{Majority Correct}) \to 1$ as $N \to \infty$.
  *   **Highlight the Fine Print:**
      1.  $p > 0.5$ (Competence). *Shown in Round 2.*
      2.  **Independence.** *Shown in Round 3.*
      3.  **Binary Choice.**
      4.  **Sincere Voting.**
  *   **The "Gut" Takeaway:** "The magic isn't in the number of heads. It's in the independence of the heads. If you all read the same newspaper, 1000 of you is the same as one of you."

  **Slide 3: Mythbusting (Your Query)**
  *   **Statement:** "Adding a competent voter always helps."
  *   **Verdict:** **TRUE** (for independent voters, simple majority).
  *   **Caveat:** It fails if the new voter is correlated (Round 3) or if the voting rule is fixed at a quota that becomes harder to reach (e.g. Unanimity).
  *   **Instruction:** "Do not tell your friends that adding voters hurts. Tell them adding *independent* voters helps."

  **Slide 4: Asymmetric Costs**
  *   **Concept:** Majority Rule minimizes *total errors*. It does not minimize *costly errors*.
  *   **Takeaway:** When errors have different weights, the optimal threshold shifts (e.g., "Beyond Reasonable Doubt" > 50%).

  ---

  ### 6. Blunt Truths: What Will Go Wrong

  1.  **The "Meta-Gamer":** One student will realize in Round 1 that they are right 60% of the time. They might try to convince others to follow them.
      *   *Fix:* Enforce "No Talking" strictly. Collect cards immediately.
  2.  **Small Sample Noise:** In Round 2 ($p=0.4$), luck might make the large group win 2 out of 3 trials.
      *   *Fix:* If this happens, own it. "This is why we need theory. In the long run, the large group converges to wrong. Today, luck intervened. But look at Round 3..."
  3.  **Correlation Leak:** Students might compare cards after Round 3 and notice they all have the same pattern.
      *   *Fix:* **Collect the cards immediately** after voting. Do not let them hold onto Deck 3. Reveal the "Truth" only after all votes are in the box.
  4.  **Time Creep:** Round 4 (Costs) often drags as students argue about the rule.
      *   *Fix:* Hard stop at 70 minutes. If they haven't proposed a new threshold, tell them: "In the real world, we raise the bar to 'Beyond Reasonable Doubt'. Let's simulate that." and move to debrief.

  ---

  ### 7. Limitations: What You Can't Simulate

  1.  **Asymptotics:** $N=18$ is not infinity. The convergence in Round 1 won't be 100%.
      *   *Honesty:* "We are 18 people. The theorem talks about infinity. But you saw the direction of travel."
  2.  **Strategic Voting:** In this game, they vote sincerely (follow the card). In reality, they might vote strategically.
      *   *Honesty:* "We assumed you voted your signal. If you start voting to influence others, the math breaks. That's 'Game Theory', which is next week's problem."
  3.  **Common Priors:** We assumed the Truth was 50/50 Guilty/Innocent. If the base rate is skewed, Majority Rule needs adjustment.
      *   *Honesty:* "We assumed crimes were as likely as innocence. If 99% of defendants are guilty, even a bad jury gets it right most of the time."

