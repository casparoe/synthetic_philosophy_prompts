          *   Step 2: Determine "Common Signal" $S_t$. $P(S_t = Truth) = 0.6$.
          *   Step 3: For each student $i$: $P(\text{Card}_i = S_t) = 0.9$. Else $P(\text{Card}_i = \text{Independent Draw})$.
          *   *Wait, simpler math for prep:*
          *   We want Marginal $P(\text{Card}_i = Truth) = 0.6$.
          *   We want Correlation.
