          *   User's Math: Source $S \in \{0, 1\}$ (Truth). $P(S=Truth) = 0.6$.
          *   Voter Signal $V_i$: With prob $\alpha$, $V_i = S$. With prob $1-\alpha$, $V_i \sim \text{Bernoulli}(0.6)$.
          *   Marginal Competence: $P(V_i = Truth) = \alpha(0.6) + (1-\alpha)(0.6) = 0.6$. (Correct).
          *   Group Accuracy: If $\alpha$ is high (e.g., 0.9), everyone basically sees $S$. Group accuracy $\approx P(S=Truth) = 0.6$.
          *   Gap: Independent (78%) vs Correlated (60%). This is huge and visible.
