      *   *Round 5 (Unequal Weight):*
          *   Concept: Weighted voting or heterogeneous competence.
          *   *Issue:* "One vote counts 5 times" is hard to implement physically without confusion.
          *   *Better:* Heterogeneous competence. Some get $p=0.9$ cards, some $p=0.55$.
          *   *User Query:* "Adding a voter above chance makes group worse."
          *   *Fact Check:* In standard CJT (independent, $p>0.5$), adding a voter *always* helps (monotonicity). The user is remembering the case where $p < 0.5$ or where correlation exists. OR they are thinking of the "Paradox of Voting" or specific weighted setups.
          *   *Correction:* I must clarify this. Adding a voter with $p > 0.5$ *independently* always increases group accuracy. The exception is if the new voter is correlated or if we are looking at specific weighted voting power indices (Banzhaf) vs accuracy. I will correct this misconception in the debrief/design.
      *   *Asymmetric Costs (Last 10 mins):*
          *   Concept: False Positive cost $\neq$ False Negative cost.
