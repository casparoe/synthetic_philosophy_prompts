  QUESTION (20 marks)

  A familiar argument about the philosophical significance of P vs NP runs: checking a proof is easy, so if P = NP then finding a proof is easy too, and therefore a machine could take over the part of mathematics that looks creative.

  (a) [7 marks] Explain why the argument has to be stated for the *bounded* proof-search problem — the set of pairs ⟨φ, 1^k⟩ such that φ has a proof of length at most k, with k written in unary — rather than for "find a proof of φ" outright. What goes wrong if the bound is written in binary instead?

  (b) [7 marks] A critic objects that NP-hardness is a worst-case notion, so complexity results tell us nothing about the instances we actually care about; and that identifying the tractable with the polynomial-time computable is a contingent thesis, not a definition. Does either objection damage the argument? Say why each does or does not bite.

  (c) [6 marks] Suppose we learn that P = NP, but non-constructively: it is proved that some Turing machine solves SAT in time O(n^12), without the proof telling us which machine. Assume the result from the lectures (Levin's universal search): there is a single explicit algorithm U which, for any problem solvable in time p(n) by a machine whose description has length ℓ, solves that problem in time at most 2^ℓ · (p(n) + ℓ) — a constant factor independent of the input, but one depending on the description length of the best machine. Does the automation argument survive this scenario? Distinguish carefully between what it would establish and what it would not.

  STUDENT'S ANSWER

  (a) Checking a purported proof is easy: a verifier scans the candidate derivation and checks each step against the rules of the system, which takes time polynomial in the length of the derivation. So the relevant problem is the bounded one: given φ and k, with k written in unary so that the input has size |φ| + k, does φ have a proof of length at most k? That problem is in NP — the certificate is the proof itself, of length at most k, checked in time polynomial in |φ| and k, hence polynomial in the input. If k were written in binary, the input would have size |φ| + log k, while the certificate would still be k symbols long, exponentially long relative to the input; we would then lose our reason for placing the problem in NP, and P = NP would tell us nothing about it. And "find a proof of φ" with no bound is not a decision problem at all, so it cannot be in NP or anywhere else: P and NP are classes of decision problems. Once we have a decision procedure, extracting a proof is unproblematic: fix the proof symbol by symbol, each time asking whether a proof with that prefix and bound still exists, which costs only polynomially many calls. So the argument is not resting on a crude confusion between search and decision.

  (b) Both of the critic's objections bite. NP-hardness is a worst-case notion: it says only that some instances are hard, not that the ones we meet are hard. And symmetrically, a worst-case polynomial-time guarantee would say only that no instances are bad, not that the ones we care about are easy — so even P = NP would license no conclusion about the proofs mathematicians actually want. Besides, "polynomial" is not the definition of "feasible": the identification of the tractable with the polynomial-time computable is a thesis, not a theorem, so the automation argument inherits it. And that is exactly what the galactic-exponent worry puts in doubt — though an exponent such as 12 is small enough that the practical question would be settled, whatever constant is hidden in the big-O.

  (c) In the non-constructive scenario the automation argument fails outright, and universal search does not rescue it. To run U we would have to know which machine to run, and an existence proof hands us no machine. With no machine there is no algorithm, and with no algorithm there is no automation. So the argument needs more than P = NP: it needs a constructive proof, which is precisely what a non-constructive one cannot give us.

  Please lead your reply with the mark and your single most important comment in the first sentence, then give the marginal comments, each attached to the specific move in the answer that prompts it.
