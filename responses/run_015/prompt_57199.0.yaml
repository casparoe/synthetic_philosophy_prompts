  **MEMORANDUM**

  **TO:** Regional Flood Authority Board
  **FROM:** Technical Adviser, Decision Theory
  **DATE:** Monday, 8:00 AM
  **SUBJECT:** Recommendation on Ex Ante Decision Rule and Tuesday Storm Operations

  **Bottom Line**
  I recommend the Authority adopt rule **(ii): Minimize expected loss computed with a concave valuation of money and fatalities.** This rule acknowledges that large catastrophic losses and multiple fatalities impose a disproportionate social burden compared to diffuse small losses. Applied to the approaching storm, this rule implies **opening the auxiliary spillway** before Tuesday noon. This action incurs a certain $230 million loss in Willow Creek to avoid a 4 percent chance of 40 fatalities and $2.4 billion in city damages. Staff must execute the opening by **Tuesday, 8:00 AM**, to ensure peak flow management.

  **The Recommended Rule**
  The Authority shall select the operational alternative that minimizes **Expected Disutility (ED)**. Disutility is calculated as:
  $$ED = \sum (Probability \times [Monetary Loss + k \times (Fatalities)^\alpha])$$
  Where:
  *   **Probability:** Engineering estimate of failure likelihood (flagged for hydrologist verification).
  *   **Monetary Loss:** Assessed property damage (flagged for assessor verification).
  *   **Fatalities:** Estimated loss of life (flagged for coroner/epidemiologist verification).
  *   **k:** Base value of a statistical life (currently $12 million).
  *   **$\alpha$:** Catastrophe aversion coefficient (recommended $\alpha = 1.5$).

  This formula is operational: staff input the variables, and the spreadsheet returns the lower ED option. It avoids vague slogans while capturing the board's intuition that 40 simultaneous deaths are worse than 40 independent deaths.

  **Arithmetic for the Pending Storm**
  We compare two options: (A) Open Spillway (Certain Willow Creek Flood) vs. (B) Do Not Open (Risk City Flood).

  *   **Option A (Open):** Cost is $230 million. Fatalities are 0. **Total Disutility = $230 million.**
  *   **Option B (Close):** 96% chance of $0 loss; 4% chance of $2.4 billion loss + 40 fatalities.
      *   **Rule (i) Linear Expected Loss:** Uses $\alpha = 1$.
          *   Expected Property Loss: $0.04 \times \$2.4B = \$96 million$.
          *   Expected Life Loss: $0.04 \times 40 \times \$12M = \$19.2 million$.
          *   Total Expected Loss: **$115.2 million.**
          *   *Decision:* **Do Not Open** (Save $114.8 million expected value).
      *   **Rule (ii) Concave Valuation:** Uses $\alpha = 1.5$.
          *   The disutility of 40 deaths is weighted heavily: $40^{1.5} \approx 253$ units vs. linear 40 units.
          *   Adjusted Expected Life Loss: $0.04 \times 253 \times \text{base unit} \approx \$151.8 million$ (equivalent).
          *   Total Expected Disutility: $96M + \$151.8M = \mathbf{\$247.8 million}.$
          *   *Decision:* **Open Spillway** (Avoid higher disutility).
      *   **Rule (iii) Rank-Dependent:** Weights the 4% tail probability higher than linear (e.g., as 10%).
          *   Weighted Expected Loss: $0.10 \times \$2.88B = \mathbf{\$288 million}.$
          *   *Decision:* **Open Spillway.**

  Rules (ii) and (iii) agree here, but they rely on different justifications. Rule (i) diverges, prioritizing aggregate wealth over catastrophe avoidance.

  **Divergence Case: Concave vs. Rank-Dependent**
  The board must know which logic it adopts, as they diverge in other contexts. Consider two mitigation projects with equal expected life savings (40 lives):
  *   **Project X:** Prevents a 40% chance of 100 fatalities.
  *   **Project Y:** Prevents a 10% chance of 400 fatalities.

  **Concave Valuation** focuses on outcome magnitude. It prefers **Project X**, because 100 deaths are disproportionately less severe than 400 deaths.
  **Rank-Dependent Weighting** focuses on probability rank. If the weighting function discounts moderate probabilities (40%) more severely than it inflates rare ones (10%), it may prefer **Project Y**, viewing the 10% risk as a more distinct "tail event" to be eliminated.
  *Recommendation:* Adopt Concave Valuation. It is more defensible to argue we prevent larger tragedies than to argue we manipulate probability weights.

  **Capital Program Implications**
  Next year's program offers two alternatives with equal expected annual loss reduction ($18 million):
  1.  Reduce diffuse frequent small events.
  2.  Eliminate a 0.6% chance of a $3 billion event.

  Under Rule (i) (Linear), these are **equivalent**. Under Rule (ii) (Concave), we **prefer Alternative 2**. The concave function assigns higher disutility to the $3 billion catastrophic loss than to the sum of smaller losses. We should fund the catastrophe elimination. This signals to the market that we prioritize systemic resilience over frequent minor inconveniences.

  **Addressing the Losing Side: Dynamic Consistency**
  The strongest argument for Rule (i) (Linear Expected Loss) is dynamic consistency. If we adopt Rule (ii) and open the spillway on every 4% forecast, Willow Creek floods once a generation. Meanwhile, the downstream city, knowing they are protected, may permit 1,200 new housing units in the floodplain. This creates moral hazard: a sequence of individually rational safety decisions creates a future package of risk no board would approve.

  However, Rule (i) fails the "one-shot" test. This is not a casino; losses are not fungible across years or people. The residents of Willow Creek cannot average their loss with the city's safety over decades. Rule (ii) accepts the moral hazard risk but manages it by stipulating that decision inputs must reflect *current* exposure. If the city builds 1,200 units, the "Monetary Loss" and "Fatalities" inputs for Option B increase, eventually making "Do Not Open" the correct choice under Rule (ii) as well. We cannot sacrifice current lives to discourage future zoning; instead, we must couple this rule with strict development advisories. [Flag for County Attorney: Ensure resolution language does not create liability for future zoning decisions made by independent municipal bodies.]

  **Statement for Willow Creek Residents**
  "We know that opening the spillway floods your homes and fields. This decision is not taken lightly, nor is your loss considered small. We chose this path because the alternative risked forty lives in the city below. No formula can make your sacrifice equal to zero, but this rule ensures we never gamble with human life to save money. We are committed to working with you on recovery, because protecting the region means protecting every part of it, even when the math requires hard choices."
