prompt: |-
  So I'm halfway through my PhD (systems neuroscience, dont ask) and we did the thing everyone tells you not to do: we picked the model family after staring at the same dataset for a year, and now my advisor wants a Bayes factor for it. Which means I've spent the last week reading about the problem of old evidence, and my takeaway is that the two camps are mostly talking past each other — so I want the document they should have written instead.

  Draft the joint statement of an adversarial collaboration between, on one side, someone who thinks old evidence is a modelling artifact: get clear about what you conditionalize on (the counterfactual prior from before you knew E, the proposition that you've learned E, an expanded partition — take your pick) and the problem dissolves. On the other side, someone who thinks it shows confirmation isn't exhausted by probability-raising: what does the work is that the theory predicts or explains E, and no choice of prior over the old partition captures that, so Bayesianism needs an extra ingredient or isn't the whole story about evidence.

  And please put my actual case in it, because I think it's subtly different from the textbook one. Our data sat in the lab notebook and on the server for three years. We always knew the numbers. What we didn't know was that they had anything to do with our hypothesis — we only noticed the connection last month, and the moment we noticed it our confidence in the model roughly doubled. Call it the drawer case. I want both sides to say, about that case specifically, what got confirmed when: was it at the moment we first saw the numbers, or last month, or neither? And whether it should matter how we came to notice the connection (a seminar, a rival group's preprint, a genuine mistake in a bit of code) or only that we now see it.

  Format: a numbered section of claims both can sign — about what confirmation is even supposed to do for us, what priors are for, whether the agent's actual causal history is relevant to her evidence or just to how we model her; then a table of the residual disagreements, each phrased in wording its own side would accept; then the cruxes, and for each crux a case or argument both agree bears on it, with each side's prediction written down in advance. If part of the dispute turns out to be verbal — about what "evidence" or "prior" or "confirm" means — say which part and why.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **User:** PhD candidate in systems neuroscience, halfway through.
      *   **Situation:** "HARKing" (Hypothesizing After Results are Known) scenario. Picked a model family after staring at data for a year. Advisor wants a Bayes Factor.
      *   **Problem:** The "Problem of Old Evidence" (POE) in Bayesian confirmation theory.
      *   **Task:** Draft a "Joint Statement of an Adversarial Collaboration."
      *   **Sides:**
          1.  *Dissolvers:* POE is a modeling artifact (fix the conditionalization/partition/prior).
          2.  *Realists:* POE shows Bayesianism is incomplete (confirmation $\neq$ probability-raising; needs explanation/prediction ingredient).
      *   **Specific Case ("The Drawer Case"):** Data existed for 3 years. Numbers known. Connection to hypothesis unknown until last month. Confidence doubled upon noticing the connection.
      *   **Format:**
          1.  Numbered section of agreed claims (nature of confirmation, priors, causal history).
          2.  Table of residual disagreements (phrased in each side's voice).
          3.  Cruxes (with agreed test cases/arguments and pre-registered predictions).
          4.  Identification of verbal disputes (definitions of "evidence," "prior," "confirm").
      *   **Tone:** Academic, precise, slightly weary but rigorous (fitting a PhD student deep in the weeds), collaborative yet adversarial.

  2.  **Deconstruct the "Drawer Case":**
      *   *Standard POE:* Einstein knew the perihelion of Mercury ($E$) before GR ($T$). $P(E) = 1$. $P(E|T) = 1$. No confirmation.
      *   *Drawer Case:* $E$ (numbers) known for 3 years ($P(E) \approx 1$). $T$ (model/hypothesis) formulated/selected recently. Connection ($E$ supports $T$) realized last month.
      *   *Key Nuance:* It's not just that $E$ is known, it's that the *relevance* of $E$ to $T$ was unknown. This leans towards the "logical omniscience" or "structural uncertainty" aspect of POE.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need common ground. Both sides agree Bayesianism is useful. Both agree the "Drawer Case" involves a shift in confidence. Both agree causal history matters for *psychology*, maybe not for *logic*.
      *   *Claim 1 (Function):* Confirmation tracks rational belief update.
      *   *Claim 2 (Priors):* Priors represent state of information, not just frequencies.
      *   *Claim 3 (History):* The *origin* of the hypothesis (data-driven vs. theory-driven) affects error rates (replicability), but the *logic* of support is the battleground.
      *   *Claim 4 (The Drawer):* Confidence *did* increase last month. The question is whether that increase was *justified* by $E$.

  4.  **Drafting - Section 2: Residual Disagreements (Table):**
      *   *Side A (Dissolvers/Orthodox):* Focus on "Ur-priors" or "Counterfactual Priors." The evidence isn't $E$, it's "I just realized $T$ entails $E$."
      *   *Side B (Realists/Pluralists):* Focus on "Explanatory Power." $T$ explains $E$ better than $\neg T$. Probability isn't the only metric.
      *   *Need to capture the specific "Drawer" nuance:* Side A says the update is on the *link*, not the data. Side B says the data confirms *now* because the theory makes it relevant.

  5.  **Drafting - Section 3: Cruxes & Predictions:**
      *   *Crux 1: The Counterfactual.* Can we reconstruct a prior where $E$ wasn't certain?
      *   *Crux 2: The Source of Discovery.* Does it matter *how* the link was found (code error vs. seminar)?
      *   *Crux 3: Normative Force.* If the Bayes Factor is 1 (because $P(E)=1$), is the advisor wrong to ask for it?
      *   *Predictions:* Side A predicts a coherent counterfactual model exists. Side B predicts the counterfactual feels artificial and misses the "explanatory" gain.

  6.  **Drafting - Section 4: Verbal Disputes:**
      *   Identify where they are defining "Evidence" differently. Is evidence the *proposition* $E$ or the *learning event*?
      *   Identify "Prior." Is it the actual psychological state 3 years ago, or a logical construct?

  7.  **Refining the Tone:**
      *   Make it sound like a document written by two tired philosophers/statisticians who respect each other but disagree fundamentally.
      *   Ensure the neuroscience context ("systems neuroscience," "lab notebook," "server") is integrated naturally, not just pasted on.
      *   Address the "Advisor wants a Bayes Factor" pressure. This adds stakes.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "how we came to notice" question? *Adjustment:* Ensure Crux 2 covers the code error vs. seminar distinction.
      *   *Check:* Is the distinction between "Old Evidence" (Mercury) and "Drawer Case" (Known data, unknown relevance) clear? *Adjustment:* Emphasize the *structural* uncertainty (didn't know $T$ implied $E$) vs. *empirical* uncertainty (didn't know $E$ was true).
      *   *Check:* Is the Bayes Factor issue addressed? *Adjustment:* In the Cruxes, explicitly mention the calculability of the BF.

  9.  **Final Polish:** Check formatting (numbered lists, table, clear headings). Ensure the voice is appropriate for a PhD student's reference document (dense but actionable). (Self-correction: Keep it accessible enough to be useful, but technical enough to satisfy the "adversarial collaboration" prompt).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **DRAFT: JOINT STATEMENT ON THE PROBLEM OF OLD EVIDENCE IN THE "DRAWER CASE"**
  **Adversarial Collaboration:** The Formalists (Side A) vs. The Explanatory Realists (Side B)
  **Subject:** Confirmation, Priors, and the Neuroscience Lab Notebook
  **Date:** October 2023

  ### Preamble
  We acknowledge the specific constraints of the "Drawer Case" presented by the doctoral candidate (hereafter, *The Agent*). Unlike the standard Perihelion of Mercury case, where the data ($E$) was public and the theory ($T$) was new, here $E$ (the neural timeseries) was private and known to the lab for three years, while $T$ (the specific model family) was selected only after the Agent noticed a structural correspondence last month. Confidence in $T$ doubled upon this realization. The Advisor requests a Bayes Factor ($BF$). We agree on the following foundational claims before delineating our irreconcilable differences.

  ### I. Agreed Claims (Common Ground)

  1.  **The Function of Confirmation:** The purpose of a confirmation metric is to distinguish between *accommodation* (fitting noise) and *support* (tracking truth). If a metric cannot distinguish these in the Drawer Case, it is functionally broken for scientific inference.
  2.  **The Reality of the Update:** We agree that *The Agent* underwent a rational shift in credence last month. It is not irrational to believe $T$ more strongly now than three years ago, despite $E$ being constant. The dispute is whether this shift is *confirmed by E* or by *the realization of the link*.
  3.  **The Role of Causal History:** We agree that the causal history of how $T$ was generated (staring at data vs. deriving from first principles) affects the *reliability* of the process (i.e., the risk of overfitting). We disagree on whether this history is internal to the logic of confirmation or external to it (a matter of error statistics).
  4.  **The Bayes Factor Request:** We agree that calculating a standard Bayes Factor $P(E|T)/P(E|\neg T)$ where $P(E)=1$ yields a ratio of 1, providing no confirmation. If the Advisor requires a $BF > 1$, the model of the evidence space must be adjusted.
  5.  **Logical Omniscience:** We agree that *The Agent* was not logically omniscient three years ago. They possessed $E$ but did not know that $T \to E$ (or that $E$ was a likely consequence of the mechanisms $T$ posits).

  ---

  ### II. Residual Disagreements

  | Feature | Side A: The Formalists (Dissolvers) | Side B: The Explanatory Realists (Pluralists) |
  | :--- | :--- | :--- |
  | **1. The Locus of Update** | The update was not on $T$ given $E$, but on $T$ given the *proposition* $R$: "I have just realized $T$ entails $E$." $P(T|R) > P(T)$. $E$ itself remains old and inert. | The update was on $T$ given $E$, because $E$ only *became* evidence when the theoretical framework made it relevant. Evidence is relational, not static. |
  | **2. The Prior** | We must reconstruct a **Counterfactual Prior**: What would *The Agent* have believed about $E$ *before* they knew $E$, holding fixed their background knowledge? This "Ur-prior" allows $P(E) < 1$, restoring the $BF$. | The actual prior is the only prior that matters. Constructing a counterfactual agent who doesn't know the data is a fiction that hides the actual work being done: **Inference to the Best Explanation**. |
  | **3. The "Drawer" Nuance** | The fact that the data sat in a notebook is irrelevant. Whether $E$ was public or private, $P(E)=1$ at the time of evaluation. The "unknown connection" is a problem of **logical uncertainty**, not empirical evidence. | The fact that the data was in the drawer is crucial. It means $E$ was not *available* as a constraint on theory choice until the connection was made. Availability, not just probability, defines evidence. |
  | **4. Discovery Context** | **Irrelevant.** Whether the link was found via a seminar, a rival's preprint, or a code error, the logical relation ($T \to E$) is identical. The psychology of discovery is distinct from the context of justification. | **Relevant.** If the link was found via a code error (p-hacking/searching), the likelihood of finding *some* fit is high. If found via a seminar (independent constraint), the likelihood is low. The *process* changes the likelihood ratio, not just the logic. |
  | **5. Solution to POE** | **Dissolution.** Expand the partition. Conditionalize on "Learning that $T$ explains $E$." The problem vanishes if you model the agent's logical limitations correctly. | **Revision.** Bayesian conditionalization is insufficient. We need an "explanatory boost" term. $T$ is confirmed because it *systematizes* old data, not because it raises $E$'s probability. |

  ---

  ### III. Cruxes and Pre-Registered Predictions

  We identify three specific cruxes where our theories yield different practical advice for *The Agent's* thesis and the Advisor's request.

  #### Crux 1: The Counterfactual Reconstruction
  *The Question:* Can we legitimately calculate a Bayes Factor by pretending *The Agent* didn't know the data three years ago?
  *   **Test Case:** *The Agent* constructs a prior based on literature from 3 years ago (pre-data) and calculates $P(E|T_{old})$ vs $P(E|\neg T_{old})$.
  *   **Side A Prediction:** This is the correct procedure. The resulting $BF$ is valid because it represents the *theoretical* support $T$ provides, stripped of the temporal accident of when the data was read.
  *   **Side B Prediction:** This is "cheating." It ignores that $T$ was *selected* because it fit this specific $E$. The $BF$ will be inflated because $T$ was optimized for $E$. The "Ur-prior" is a convenient fiction that masks the HARKing (Hypothesizing After Results are Known).

  #### Crux 2: The Source of the Link (The "Code Error" Variable)
  *The Question:* Suppose *The Agent* discovers the connection between $T$ and $E$ because they found a bug in their analysis code that previously hid the correlation. Does this change the confirmation status?
  *   **Side A Prediction:** **No Change.** The logical relation $T \to E$ is now known. The prior probability of $T$ should update based on the new logical knowledge. The bug is causal history, irrelevant to the current state of support.
  *   **Side B Prediction:** **Significant Change.** If the link was hidden by a bug, the "discovery" is less robust than if it were predicted by a seminar. The *reliability* of the connection is part of the evidence. Bayesianism must penalize the "bug" path via a lower prior on $T$ (due to researcher degrees of freedom), which Side A treats as separate from the $BF$.

  #### Crux 3: The Advisor's Bayes Factor
  *The Question:* The Advisor asks for a $BF$ for the paper. What number do we give them?
  *   **Side A Prediction:** Calculate the $BF$ using the **Counterfactual Prior** (Side A, Row 2). Report this number. It quantifies the model's explanatory power regarding the data structure, assuming the data were novel. Add a caveat about "exploratory analysis."
  *   **Side B Prediction:** Do not report a standard $BF$; it is misleading. Report the **effect size** and the **posterior confidence**, but explicitly state that the $BF$ is undefined for old evidence. Alternatively, use a cross-validation metric (new data) to confirm $T$. Old data cannot confirm a model selected to fit it, regardless of the math.

  ---

  ### IV. Diagnosis of Verbal Disputes

  We acknowledge that a portion of our disagreement is terminological. Clarifying these terms may reduce the surface area of conflict, though it will not solve the normative problem.

  1.  **"Evidence" ($E$):**
      *   *Side A* defines $E$ as a **Proposition** with a truth value. Since $E$ is true and known, $P(E)=1$.
      *   *Side B* defines $E$ as a **Constraint**. A constraint is only active when recognized. Thus, $E$ was not "evidence" three years ago, even if the numbers were known.
      *   *Resolution:* If we adopt Side B's definition, the POE dissolves, but we break standard Bayesian syntax. If we adopt Side A's, we must add complex machinery (counterfactuals) to make the syntax work.

  2.  **"Prior" ($P(T)$):**
      *   *Side A* treats the Prior as a **Logical Construct**. It can be tweaked to represent "what I should have thought" to make the math work.
      *   *Side B* treats the Prior as a **Historical State**. It represents the actual information available at time $t_0$.
      *   *Resolution:* Side A's approach is more useful for *publication* (producing a number). Side B's approach is more useful for *replication* (assessing risk of overfitting).

  3.  **"Confirm":**
      *   *Side A* means **Probability-Raising**. If $P(T)$ doesn't go up via conditionalization on $E$, there is no confirmation.
      *   *Side B* means **Endorsement**. $T$ is confirmed if it provides the best available explanation for $E$, regardless of the temporal order.
      *   *Resolution:* The Advisor is asking for Side A's definition (a $BF$), but likely cares about Side B's concept (is this model true?). This mismatch is the source of *The Agent's* anxiety.

  ### V. Recommendation for The Agent

  Based on this collaboration, we offer the following advice for your thesis and your Advisor:

  1.  **Do not lie to the math.** If you calculate a standard Bayes Factor on the data you used to pick the model, Side B is right: it is epistemically hollow. It will not protect you from overfitting.
  2.  **Do not ignore the math.** Side A is right that you need to quantify *why* the model fits.
  3.  **The Compromise:**
      *   **Split the Data:** If possible, hold out a portion of the "Drawer" data that was *not* looked at during model selection. Calculate the $BF$ on that.
      *   **The "Ur-Prior" Caveat:** If you must use all the data, calculate the $BF$ using a prior derived from pre-existing literature (Side A's Counterfactual), but explicitly label it as **"Theoretical Support"** rather than **"Empirical Confirmation."**
      *   **Address the "Drawer":** In the discussion, explicitly state: *"This model was selected based on structural features of the dataset. While the Bayes Factor indicates strong fit, the confirmation value is attenuated by the non-independence of hypothesis and data."*

  **Signed,**

  *The Formalist* (Who thinks you can fix the prior)
  *The Realist* (Who thinks you need new data)
