answer: |-
  This is a profound narrative dilemma because it is not a conflict between "right and wrong," but between "right and right." In ethics, this is often called a **conflict of duties**. If you are looking for a single, objective "right answer" to the moral puzzle, philosophy cannot give you one—but that is exactly why it is perfect for a novel. The ambiguity is where the story lives.

  To help you draft the scene, we need to break down the specific "force" of the promise, the arguments for its discharge, and where the actual dramatic tension resides.

  ### 1. The Specific Force of the Promise
  You mentioned you want to avoid general guilt and focus on the specific force of the vow. Why does this promise feel binding decades later?

  *   **The Irrevocability of Death:** A promise to a living person can be renegotiated. If you break a promise to a friend, they can forgive you or release you from the obligation. A promise to the dead is unilateral. The other party cannot update the terms, offer forgiveness, or acknowledge the changed context. The character is trapped in a contract with a ghost.
  *   **The Context of Dying:** A promise made to a *dying* parent carries the weight of a "sacred trust." It is often viewed not just as a request, but as the final stabilization of the parent's legacy. Breaking it feels like disturbing their peace or invalidating their final act of agency.
  *   **Identity and Continuity:** For the character, keeping the promise may have become part of her identity over the decades. "I am the kind of woman who keeps her word to her father." Breaking it isn't just an action; it's a fracture in her self-conception.

  **The Tension:** The force of the promise lies in **Fidelity**. It is a deontological duty (duty-based ethics). The action (keeping the vow) is good in itself, regardless of the consequences.

  ### 2. The Case for Discharge (Changed Circumstances)
  Does the promise still hold given the new reality? There are strong ethical arguments that the obligation has evaporated.

  *   **The "Spirit vs. Letter" Argument:** Promises are usually proxies for values. The father likely didn't value the bricks and mortar for their own sake; he valued "family security" or "keeping us together." If keeping the house now destroys the family (by denying the grandson care), keeping the *letter* of the promise violates the *spirit* of the father's love.
  *   **The Counterfactual Wish:** You stated the father "would have wanted it sold" if he foresaw this. In contract law and ethics, there is a concept called *clausula rebus sic stantibus* ("things thus standing"). If the fundamental circumstances change so drastically that the original agreement becomes impossible or absurd to fulfill, the obligation dissolves.
  *   **Hierarchy of Duties:** Most ethical frameworks prioritize the care of the vulnerable (the sick son) over the preservation of property or the honoring of past vows. The duty to the living generally supersedes the duty to the dead.

  **The Tension:** The case for selling lies in **Care** and **Consequence**. It is a utilitarian or care-ethics approach. The morality is determined by the outcome (the son's health), not the adherence to a rule.

  ### 3. Where the Real Tension Lies
  If the logic clearly favors selling the house (the son's life > a building), why is this still a difficult scene? **The tension is not about what she should do; it is about what she must sacrifice to do it.**

  If she decides to sell the house logically and feels fine about it, the scene falls flat. The drama comes from the **cost of the solution.**

  *   **The Guilt of Rationalization:** The character knows logically she should sell. But emotionally, she may feel she is using the father's hypothetical wishes ("he would have wanted it") as a convenient excuse to break a sacred vow. She has to wonder: *Am I doing this for my son, or am I just selfish and using him as an excuse?*
  *   **The Betrayal of the Past Self:** The woman who made the promise decades ago is not the same woman standing there now. Selling the house feels like betraying her younger self, who was willing to sacrifice for this promise. She has to mourn the loss of her own integrity.
  *   **The Silence of the Father:** The crux of the scene is that she cannot know for sure what he would have wanted. She is projecting her own desire onto him. The tension lies in the terrifying freedom of having to decide for him because he is no longer there to speak.

  **The "Right Answer" for the Novel:**
  The most compelling answer is usually that **she is right to sell the house, but wrong to feel absolved.** She must save her son, but she must also accept that she is breaking a sacred trust. She saves the future at the cost of the past. That is the tragedy.

  ### 4. Drafting the Scene: Specific Suggestions
  To make this turn on the *force of the promise* rather than general guilt, consider these focal points:

  *   **The Physicality of the House:** Don't just talk about "the house." Focus on the specific thing she promised to protect. Is it the creaky floorboard he walked on? The garden he planted? Selling it isn't just a transaction; it's handing over his physical memory to strangers.
  *   **The Wording of the Vow:** How did he phrase it?
      *   *"Promise me you'll never let this place go."* (Absolute, rigid)
      *   *"Promise me you'll keep us safe here."* (Implies security, which now requires selling)
      *   If the wording was absolute, the tension is higher. She is breaking the literal words to save the spirit.
  *   **The "Witness":** Is there anyone else who knew about the promise? A sibling? An old family friend? Having someone say, "He wouldn't mind," might actually anger her, because it trivializes the weight she feels. She needs the weight to be heavy, because the sacrifice requires it to be heavy.
  *   **The Ritual of Release:** Since the father cannot release her, she may need to perform a ritual to release herself. This could be as simple as standing in the empty room and speaking to him, admitting she is breaking her word, and asking for a forgiveness he cannot give.

  ### Summary for the Character Arc
  *   **The Logical Truth:** She must sell the house to save her son.
  *   **The Emotional Truth:** She is breaking a sacred covenant with her father.
  *   **The Resolution:** She chooses the living over the dead, but she carries the scar of the broken promise. She accepts that being a "good daughter" now means being a "faithless daughter" in the eyes of the past.

  The scene will resonate most if she realizes that **moral maturity is the ability to make the right choice even when it leaves you feeling guilty.** If she sells the house and feels clean, the dilemma was fake. If she sells the house and feels the weight of the betrayal, but does it anyway, that is courage.
