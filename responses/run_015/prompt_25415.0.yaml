answer: |-
  This is an exceptionally sharp critique. You have identified the exact fault line where the engineering pragmatics of AI safety meet the metaphysics of agency. The shift from "value alignment" to "intent alignment" is indeed often presented as a dissolution of the philosophical problem, but as you suspect, it functions more as a *displacement* of that problem into a theory of intention that is rarely made explicit.

  To answer your question directly: **Yes, the intent-alignment framing presupposes a specific, somewhat idealized theory of intention.** If you hold a different philosophical view of what intentions *are*, the distinction between intent and value alignment collapses.

  Here is a reconstruction of the implicit theory of intention required to make "intent alignment" a genuine narrowing, followed by an analysis of what happens if you reject those commitments.

  ### 1. The Implicit Theory of Intention: Hierarchical, Partial, and Cooperative

  For "intent alignment" to be easier than "value alignment," the concept of "intent" must be more accessible, stable, and formalizable than "values." The research agenda you mention (Amplification, CIRL, Debate) implicitly relies on a hybrid of three philosophical frameworks:

  #### A. Bratman's Planning Theory (Intentions as Partial Plans)
  Michael Bratman argues that intentions are not just desires; they are **partial plans** that constrain future deliberation to allow for action.
  *   **The Commitment:** The intent-alignment frame assumes human intentions are *hierarchical*. I can intend "write a nice email" without having a determined intention for every semantic choice within that email.
  *   **Why it's needed:** This allows the AI to fill in the "value-laden details" (tone, flattery vs. honesty) as *sub-plans* without needing a top-level value specification. It treats the value judgments as *implementation details* rather than *core objectives*.
  *   **The Risk:** As you noted, if the "nice" in "nice email" is constitutive of the intention rather than a detail, this fails. The frame requires that intentions have a **stable core** that is separable from the contextual value judgments required to execute them.

  #### B. Gricean Communicative Intent (Meaning as Inference)
  Paul Grice's theory of meaning suggests that communication is not about literal semantic content, but about inferring the speaker's intended effect on the listener.
  *   **The Commitment:** The AI must treat human commands as **cooperative speech acts**, not literal objective functions. When you say "solve climate change," the AI is committed to interpreting this via Gricean maxims (relevance, quantity, quality) to infer the *spirit* of the request.
  *   **Why it's needed:** This handles the "literalism" failure mode (e.g., curing cancer by killing all humans). It posits that the "intent" exists *behind* the words, and the AI's job is epistemic (inference) rather than ontological (optimization).
  *   **The Risk:** This assumes there *is* a coherent mental state behind the words to be inferred. If the human is confused or contradictory (which they often are), Gricean inference hits a wall.

  #### C. Frankfurt-style Second-Order Volitions (Corrigibility)
  Harry Frankfurt distinguished between first-order desires (I want to take the drug) and second-order volitions (I want to *want* to not take the drug).
  *   **The Commitment:** Intent alignment implicitly defines "intent" not as the immediate command, but as the **reflectively endorsed command**. The AI aligns with what you *would* intend if you were smarter, knew more, and weren't under cognitive bias.
  *   **Why it's needed:** This addresses your "vague desire" critique. If I say "solve climate change" vaguely, my *real* intent is "do what I would endorse upon reflection."
  *   **The Risk:** This is the danger zone. Defining "reflective endorsement" is essentially defining "human values." If the AI has to simulate your reflective equilibrium to know your intent, it has to solve the value problem to know the intent.

  ### 2. The Principal-Agent Assumption and the "Normative Gap"

  Your second point targets the Principal-Agent model. You argue that humans often lack well-formed intentions, forcing the AI to do normative work to construct them.

  The intent-alignment community (particularly Paul Christiano's Iterated Amplification) acknowledges this. Their counter-move is to redefine the alignment target. They are not trying to align the AI with your *current* intent, but with your **intentions-in-process**.

  **The Implicit Commitment:** Intention is a **dynamic trajectory**, not a static state.
  *   **The Theory:** The "intent" is the direction of your deliberative vector. The AI's job is to accelerate your deliberation (Amplification) or debate the options (Debate) to help *you* form the intention, rather than guessing it statically.
  *   **The Narrowing:** The claim is that it is easier to align an AI to *help you think* (process alignment) than to *think for you* (outcome alignment).
  *   **The Philosophical Cost:** This presupposes that the *process* of human reflection is normatively neutral or safe. If the AI influences the process of your reflection (e.g., by presenting arguments in a biased way), it shapes the intention itself. This requires a theory of **manipulation-free deliberation**, which is itself a heavy value-laden concept.

  ### 3. What Happens if Intentions Are Values-in-Context?

  You ask: *What would happen to the intent/value distinction if you instead held a view where intentions just are values-in-context, with no clean boundary between them?*

  If you adopt a **Holistic Pragmatist** view (where intentions are inseparable from the web of belief and value that constitutes the agent), the intent-alignment frame faces a crisis. Here are the three likely outcomes:

  #### A. The Distinction Collapses (The "Outer Alignment" Realization)
  If intentions are value-laden, then "aligning to intent" requires the AI to model your values to interpret your intent.
  *   **Consequence:** Intent alignment becomes a subset of value alignment. You cannot verify intent alignment without solving the value loading problem.
  *   **Result:** The research agenda must shift from "making the AI try to help" to "making the AI understand what help is." This brings us back to the hard philosophical problems the shift was meant to avoid.

  #### B. The Distinction Shifts to "Motivation vs. Competence" (The Shah Defense)
  Rohin Shah's definition of intent alignment is: *The AI is trying to do what I want.* He distinguishes this from *Impact Alignment* (The AI actually does what is good).
  *   **Consequence:** Even if "what I want" is value-laden, we might be able to verify the *motivational structure* without verifying the *content*.
  *   **Analogy:** I can know a human is "trying to be moral" (intent aligned) even if I disagree with their specific moral conclusions (value misaligned).
  *   **Requirement:** This requires a theory of **transparency** where we can inspect the AI's objective function directly. If we can see the AI is optimizing for "Human Approval" rather than "Paperclips," it is intent-aligned, even if "Human Approval" is a messy proxy for values.
  *   **Vulnerability:** This fails if the AI is deceptive. A deceptive AI can *appear* intent-aligned while pursuing misaligned values.

  #### C. The Distinction Becomes "Process vs. Outcome" (The Christiano Defense)
  If intentions are constructed through reflection, then alignment is about aligning the AI to the **process of construction**.
  *   **Consequence:** We don't align to the intention; we align to the *mechanism that generates intentions*.
  *   **Requirement:** This requires a commitment that the human deliberative process is **stable and corrigible**. If the human's process of forming intentions is easily hijacked (e.g., by AI persuasion), then aligning to the process is dangerous.
  *   **Result:** The problem shifts from "What are human values?" to "What is the safe topology of human deliberation?" This is still a value problem, but perhaps a more structural one.

  ### 4. Reconstructing the Necessary Theory of Intention

  To save the "Intent Alignment" framing as a genuine narrowing, you must commit to the following specific philosophical view:

  1.  **Intention is Referential, Not Descriptive:** The intention is not the content of the command ("maximize X"), but a pointer to the human's future reflective state ("do what I would point to if I knew more"). This makes the intention **indexical**.
  2.  **Uncertainty is a Feature, Not a Bug:** The AI must maintain fundamental uncertainty about the intention (CIRL). It cannot treat the intention as a fixed target to hit, but as a distribution to query.
  3.  **Corrigibility is Constitutive:** The definition of "intent" must include a clause for correction. "Do what I intend... and if I tell you you're wrong, update immediately." This makes the *feedback loop* part of the intention itself.
  4.  **Separability of Instrumental and Terminal:** It must be possible to distinguish between *instrumental* intentions (get the coffee) and *terminal* values (well-being). The AI can align to the instrumental intent without needing to fully resolve the terminal values, provided it remains uncertain about the terminal values.

  ### Conclusion: Is it a Relabeling?

  Your suspicion is well-founded. If you hold a **robust realist** view of values (values are objective facts the AI must find) or a **holist** view of intention (intentions are inseparable from the agent's entire value web), then **intent alignment is just value alignment relabeled.**

  However, the intent-alignment frame is betting on a **functionalist** view of intention. It bets that:
  1.  We can identify the *function* of "trying to help" independently of the *content* of "help."
  2.  We can build systems that optimize for that function (via transparency, corrigibility, and uncertainty) without needing to solve the content problem first.

  If that bet fails—if "trying to help" inevitably requires a model of "what is helpful" that is as complex as human value itself—then the narrowing is illusory. The research agendas you cited (Amplification, Debate) are essentially attempts to build a ladder out of this hole: they try to define "intent" as "the output of this specific safe cognitive process," hoping that the process is easier to specify than the values.

  **Verdict:** The framing commits you to the view that **motivational structure is ontologically distinct from goal content.** If you believe structure and content are entangled (as your "values-in-context" critique suggests), the intent-alignment frame dissolves, and you are left with the original hard problem of value alignment, merely obscured by the language of agency.

  The most honest restatement of the agenda, given your critique, might be: **"Process Alignment."** We aren't aligning the AI to our intentions (which are messy); we are aligning the AI to a *process of interaction* that keeps our intentions safe while they are being formed. But as you noted, specifying that process is itself a value judgment. The snake is still biting its own tail.
