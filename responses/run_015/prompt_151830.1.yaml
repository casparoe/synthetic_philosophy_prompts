answer: |-
  Your intuitions highlight the precise fault lines in contemporary expressivist semantics. The tension you identify—specifically between the "attitude-suppressing" nature of conditionals (Case 2) and the "attitude-retaining" nature of disjunctions (Case 5) and epistemic modals (Case 4)—suggests that a standard truth-conditional or purely psychological taxonomy is insufficient. To accommodate your verdicts without ad hoc adjustments, we must move from a static taxonomy of operators to a **dynamic semantics of normative commitment**.

  Below is a precise principle designed to systematize your six verdicts, followed by an application to your new cases and an assessment of which verdicts incur a theoretical cost.

  ### The Principle: Normative Context-Change Potential (N-CCP)

  **Definition:** The meaning of a moral sentence is not a proposition representing a fact, but a **Commitment-Update Function**. A conversational context $K$ is a tuple $\langle W, N, \pi \rangle$, where $W$ is a set of possible worlds (factual information), $N$ is a set of normative plans/commitments (the "normative common ground"), and $\pi$ is a probability distribution over $N$ (degrees of normative certainty).

  **The Principle:** Embedding operators are classified by how they manipulate the parameters of $K$.
  1.  **Assertoric Operators:** Directly update $N$ (add a commitment).
  2.  **Psychological Operators:** Shift the agent-index of $N$ (evaluate commitment relative to a subject).
  3.  **Epistemic/Probabilistic Operators:** Update $\pi$ without necessarily updating $N$ (modify confidence in commitments).
  4.  **Logical Operators:** Operate on the *relationship* between updates to $W$ and $N$. Crucially, they distinguish between **Testing** (conditionals) and **Splitting** (disjunctions).

  ---

  ### Application to Original Verdicts (Cases 1–6)

  This principle accommodates your verdicts by distinguishing the *type* of context change each operator triggers.

  *   **Case 1 (Assertion): Clause 1 (Assertoric).**
      *   *Mechanism:* The sentence functions as an update instruction: *Add the plan "No torture" to $N$.*
      *   *Verdict Saved:* Explains the categorical non-cognitive attitude; $N$ is directly modified.

  *   **Case 2 (Conditional): Clause 4a (Testing).**
      *   *Mechanism:* The conditional does not update $N$. It tests whether updating $K$ with the antecedent ($N + \text{disapproval}$) necessitates updating with the consequent.
      *   *Verdict Saved:* Explains why the antecedent expresses no actual attitude. The speaker is running a hypothetical simulation on $K$, not modifying the actual $N$. The attitude is *simulated*, not *expressed*.

  *   **Case 3 (Belief Attribution): Clause 2 (Psychological).**
      *   *Mechanism:* The verb "believes" shifts the evaluation index. We do not update the speaker's $N$, but we represent Maria's $N^*$.
      *   *Verdict Saved:* Explains why the attitude is redirected to the subject.

  *   **Case 4 (Epistemic Modal): Clause 3 (Probabilistic).**
      *   *Mechanism:* "Possibly" updates $\pi$ (the probability distribution over plans). It does not add the plan to $N$ (which would be assertion), but it raises the probability weight of worlds/plans where the disapproval exists.
      *   *Verdict Saved:* This distinguishes Case 4 from Case 2. A conditional *tests* consistency (binary); an epistemic modal *weights* likelihood (graded). Thus, the speaker expresses a graded, second-order attitude (uncertainty about which plan to adopt) rather than merely entertaining content.

  *   **Case 5 (Disjunction): Clause 4b (Splitting).**
      *   *Mechanism:* Unlike the conditional (which tests), disjunction *splits* the context. It updates $K$ to a set of alternative contexts $\{K_1, K_2\}$, where $K_1$ includes the first commitment and $K_2$ includes the second.
      *   *Verdict Saved:* This explains your intuition that disjunction retains "partial force." The speaker is committed to the *disjunction of plans*, which is an active constraint on $N$, whereas the conditional is merely a constraint on the *relation* between plans. The speaker is in a state of "settled unsettledness"—committed to choosing one, but not yet which.

  *   **Case 6 (Negation): Clause 4c (Elimination) + Pragmatics.**
      *   *Mechanism:* Semantically, negation eliminates the commitment from $N$ (removes the plan "No torture").
      *   *Verdict Saved:* The principle accounts for the cancellation of disapproval. The "inversion" to approval is handled as a **Quantity Implicature**: if the speaker merely meant indifference (the semantic negation), they would not explicitly add "I approve." The explicit addition pragmatically strengthens the elimination to an inversion.

  ---

  ### Extension to Unconsidered Cases

  **Case 7: Nested Counterfactual.**
  *"If Maria believed that torturing prisoners was wrong, she would have resigned."*
  *   **Analysis:** This involves a **Psychological Shift** embedded within a **Counterfactual Test**.
  *   **Application:**
      1.  The counterfactual operator shifts the world parameter $W$ to closest worlds where the antecedent holds.
      2.  The antecedent ("Maria believed...") triggers a **Psychological Shift** (Clause 2), modifying Maria's normative parameter $N^*$ in those worlds.
      3.  The consequent is evaluated relative to this shifted context.
  *   **Verdict:** The speaker expresses no attitude toward torture. The sentence expresses a causal/normative dependency between Maria's *hypothetical* commitment and her action. The N-CCP principle handles this by ordering the operations: World-Shift $\rightarrow$ Agent-Shift $\rightarrow$ Evaluation.

  **Case 8: Probabilistic Disjunction.**
  *"It is more likely that either tax fraud or bribery is wrong than that neither is."*
  *   **Analysis:** This combines **Probabilistic Weighting** (Clause 3) with **Context Splitting** (Clause 4b).
  *   **Application:**
      1.  The disjunction ("fraud or bribery") splits the context into alternatives where commitments to disapproval are active.
      2.  The probabilistic operator ("more likely") compares the measure $\pi$ of the set of worlds/plans where the split occurs against the set where neither commitment exists.
  *   **Verdict:** The speaker expresses a higher confidence in having *some* negative commitment than in having *none*. This preserves the "graded attitude" intuition of Case 4 while respecting the "split" nature of Case 5. It is not a belief about moral facts, but a credence over normative plan-adoption.

  ---

  ### Assessment: Which Verdicts Must Be Abandoned?

  While the N-CCP principle systematizes your intuitions, it comes with a specific theoretical cost. You asked which verdicts must be abandoned for the sake of compositional uniformity.

  **1. The Cost of Case 5 (Disjunction):**
  Your intuition in Case 5 (that disjunction retains "partial attitudinal force" while Case 2 conditionals do not) forces you to **abandon classical logical equivalence** between $P \to Q$ and $\neg P \lor Q$.
  *   *Why:* In classical logic, the conditional and the material disjunction are inter-definable. If the conditional suppresses attitude (Case 2) but the disjunction retains it (Case 5), then moral logic is non-classical.
  *   *Recommendation:* To maintain the N-CCP principle, you must adopt **Inquisitive Logic** or **Dynamic Logic**. If you wish to retain classical logic, you must abandon the intuition in Case 5 and treat disjunction as attitude-suppressing (like the conditional), viewing the "commitment" as merely an acceptance of the logical constraint.
  *   *Verdict:* **Keep Case 5 only if you accept non-classical logic.**

  **2. The Cost of Case 6 (Negation):**
  Your intuition that "not wrong" *expresses* approval (Case 6) is semantically risky.
  *   *Why:* In the N-CCP framework, negation is elimination (removing a plan), not inversion (adopting the opposite plan). "Not wrong" semantically permits indifference.
  *   *Recommendation:* You must classify the "approval" aspect of Case 6 as **pragmatic**, not semantic. If you treat it as semantic, you lose the ability to account for genuine moral indifference (the view that some acts are morally neutral).
  *   *Verdict:* **Abandon the claim that negation *semantically* inverts attitude.** Retain the claim that it *pragmatically* implicates inversion in specific contexts.

  **3. The Status of Case 4 (Epistemic Modals):**
  Your intuition here is the most robust under the N-CCP principle, but it requires a **Probabilistic Expressivism** (like Gibbard's later work or Yalcin-style semantics).
  *   *Verdict:* **Save Case 4**, but acknowledge it requires a richer context structure ($\pi$) than traditional expressivism allows.

  ### Conclusion on the Frege-Geach Problem

  Under the **Normative Context-Change Potential (N-CCP)** principle, the Frege-Geach problem is revealed as a **compositional puzzle solvable by dynamic semantics**, rather than a fatal objection to expressivism.

  *   **Is it damaging?** No, provided you abandon the requirement that moral sentences must embed into *truth-conditions*. They embed into *update-conditions*.
  *   **The Trade-off:** You save your intuitions about embedded attitudes (Cases 4 & 5) only by accepting that moral logic may diverge from classical Boolean logic (specifically regarding the Conditional/Disjunction equivalence).

  **Final Recommendation:** Retain Cases 1, 2, 3, 4, and 6 (with the pragmatic caveat). **Modify Case 5**: Do not claim disjunction retains "attitudinal force" in the same sense as assertion; rather, claim it imposes a **disjunctive constraint on commitment**. This preserves the "unsettled stance" intuition without forcing a breakdown of logical validity in inferences like Disjunctive Syllogism.
