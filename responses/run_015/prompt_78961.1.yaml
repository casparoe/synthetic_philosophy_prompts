answer: |-
  ### Teaching Plan: Hume's Monetary Tension (75 Minutes)

  **Objective:** Disrupt the "Proto-Monetarist" reading (Hume = Quantity Theory) by staging the tension between Long-Run Neutrality and the Short-Run "Interval" of real effects.

  **The Carrying Example: The Textile Export Boom**
  *   **Setup:** Two regions, **Agraria** (food, no money source) and **Manufacturia** (cloth, receives specie via trade). No banks, no paper, only gold/silver coin.
  *   **Why this example:** It satisfies your constraints. It involves two regions (visible distribution). It avoids banking. Crucially, it avoids the "lump sum" problem: the gold enters via *merchants* who sell cloth abroad, not via a helicopter drop or a mine discovery. This forces the money to pass through "industry" hands first.
  *   **Why not the Mine?** A mine implies money is "found." Hume's mechanism relies on money entering through *trade* to ensure it is held by industrious merchants first, not hoarders. A mine owner might hoard; an exporter must spend to produce more.
  *   **Why not the Shipwreck?** Too accidental; implies a one-time stock shock rather than a flow/inflow dynamic.

  ---

  ### I. Sequence and Dependencies (0–60 mins)

  You asked if the dependencies run the other way. **They do not**, but the *Interest* argument (5) is the linchpin you are underutilizing. Do not treat it as a separate topic; treat it as the theoretical anchor that proves Hume is not a monetarist.

  **1. Money as Instrument vs. Wealth (0–10 mins)**
  *   **Action:** Define the terms. Money is the "oil" (instrument), Goods/Labor are the "wheels" (wealth).
  *   **Dependency:** This is the foundation. Without this, they cannot understand why increasing the oil doesn't necessarily make the machine bigger.
  *   **Misconception to Head Off:** *"Money doesn't matter."*
      *   **Correction:** State clearly: "Hume says money is not wealth, but he does not say it is irrelevant."

  **2. Closed-Economy Neutrality & Open-Economy Mechanism (10–25 mins)**
  *   **Action:** Merge these. Explain that in a closed system, more money = higher prices (Neutrality). In an open system (your Example, **Run 1: Equilibrium**), if Manufacturia has too much money, prices rise, exports fall, gold flows to Agraria until prices equalize.
  *   **Dependency:** You cannot explain the *flow* (Open) without the *price signal* (Closed).
  *   **Misconception to Head Off:** *"Gold is physically carried to balance trade."*
      *   **Correction:** Emphasize price incentives. Merchants move goods; gold follows the settlement. No one carries bullion in a cart to "fix" the balance; they buy cheap and sell dear.

  **3. The Interval: The Inflow (25–45 mins)**
  *   **Action:** **The Core Tension.** Run the Example again (**Run 2: Mid-Inflow**).
      *   *Scenario:* Foreign demand for Manufacturia's cloth spikes. Gold flows in.
      *   *Sequence:* Merchants get gold *first*. They do not immediately raise prices. They hire more weavers (idle hands become employed). Wages rise. Spending rises. *Then* prices rise.
      *   *Point:* During this interval, money is *not* neutral. It stimulates industry.
  *   **Dependency:** This depends entirely on (2). If they don't believe money eventually neutralizes (prices rise), the Interval looks like permanent growth. If they don't believe the Open Mechanism, they don't know where the money came from.
  *   **Misconception to Head Off:** *"Hume is recommending debasement/inflation."*
      *   **Correction:** Hume praises the *natural inflow* from trade, not artificial debasement. The stimulus comes from the *profit incentive* for merchants, not the price rise itself.
  *   **Misconception to Head Off:** *"This is just sticky prices."*
      *   **Correction:** This is the sophisticated trap. Moderns think "prices are rigid." Hume thinks "industry is asleep." The money wakes up the idle labor. Distinguish *incentives* from *rigidities*.

  **4. The Interest Rate Argument (45–60 mins)**
  *   **Action:** Now introduce the Interest essay. Interest is determined by the demand for borrowing and profits of commerce (Real), not the quantity of money (Nominal).
  *   **Dependency:** This depends on (1) and (2). It reinforces the "Real vs. Nominal" distinction.
  *   **Strategic Reason:** Placing this *after* the Interval stabilizes the session. After the confusion of the Interval (where money *does* have real effects), this reminds them that Hume's core commitment is to **Real Factors**. It shows the Interval is a specific dynamic exception, not a abandonment of his real theory.
  *   **Misconception to Head Off:** *"Interest is low because there is lots of gold."*
      *   **Correction:** Low interest comes from high savings/low profit opportunities, not a full treasury.

  ---

  ### II. Misconceptions: Expected and Unexpected

  **Expected (Head off in Sequence above):**
  1.  **Hume = Quantity Theorist:** Head off in Step 3 (The Interval).
  2.  **Physical Gold Transport:** Head off in Step 2 (Open Mechanism).
  3.  **Money Doesn't Matter:** Head off in Step 1 (Definition).
  4.  **Interest = Money Stock:** Head off in Step 4 (Interest).

  **Unexpected (The "Graduate Level" Traps):**
  1.  **"Hume is Inconsistent":** Students will argue the Interval contradicts Neutrality.
      *   *Where it forms:* End of Step 3.
      *   *Fix:* Frame it as **Comparative Statics (Neutrality) vs. Dynamics (Interval).** Hume isn't contradicting himself; he is describing a path vs. a destination.
  2.  **"The Interval is Just Wealth Effect":** Economists will argue the inflow makes people feel richer so they spend.
      *   *Where it forms:* Step 3.
      *   *Fix:* Remind them Hume focuses on the *merchant's* profit expectation, not the consumer's wealth feeling. It is a production stimulus, not a consumption boom.
  3.  **"Hume Assumes Full Employment":** If they assume full employment, the Interval makes no sense (how can industry rise?).
      *   *Where it forms:* Step 3.
      *   *Fix:* Explicitly state Hume assumes **idle resources** (underemployment) in the pre-inflow state. This is the minimum addition required for coherence (see Exclusions).

  ---

  ### III. The Closing Question (60–65 mins)

  Do not ask for a definition. Ask for a reconciliation.

  **The Question:**
  > "Hume argues that a nation is better served by a **growing** stock of money than a **large** static one. Given his claim that money is neutral in the long run, what specific work is the 'growing' doing that the 'large' cannot?"

  **Why this works:**
  *   **Memorizers** will say: "Because money is neutral." (Incorrect, misses the point).
  *   **Memorizers (Level 2)** will say: "Because prices rise slower." (Descriptive, not causal).
  *   **Understanders** will say: "The 'growing' stock creates the **Interval** of profit incentives that mobilizes idle labor. The 'large' stock has already raised prices without stimulating new industry."

  ---

  ### IV. Exclusions and Coherence Check (65–75 mins)

  **What to Omit (and say so):**
  1.  **Banks and Paper Credit:** Hume discusses this in *Of Money* and *Of the Balance of Trade*.
      *   *Say:* "Hume has a separate, skeptical argument about paper credit. We are omitting it because it complicates the specie mechanism we are analyzing. Assume a 100% reserve metallic standard for this hour."
      *   *Coherence:* This does **not** break the session. The Interval argument holds for specie.
  2.  **Bullionist/Currency School Controversies:**
      *   *Say:* "Later 19th-century debates treat Hume as a father of the Quantity Theory. We are reading Hume, not his legacy."
  3.  **Equations (MV=PT):**
      *   *Say:* "We will not use the Equation of Exchange. It imposes later assumptions on Hume's verbal logic."

  **The Minimum Addition for Coherence:**
  You **must** explicitly state Hume's assumption of **Idle Labor/Resources**.
  *   *Why:* If the economy is at full employment, an inflow of money *only* raises prices (Neutrality holds immediately). The Interval (Industry stimulation) *requires* that there are weavers sitting at home who can be hired.
  *   *Where:* Step 3 (The Interval).
  *   *Risk:* If you omit this, the economists in the room will dismantle the Interval argument as impossible under classical assumptions. Acknowledge it: "Hume assumes the pre-inflow economy is not at full capacity."

  ### Summary of Dependencies
  *   **1 (Def)** is the foundation for **2 (Neutrality)**.
  *   **2 (Neutrality)** is the baseline for **3 (Interval)**.
  *   **3 (Open Mechanism)** is the *cause* of the Inflow in **3 (Interval)**.
  *   **5 (Interest)** is the *corroboration* of the Real/Nominal split established in **1 & 2**.
  *   **Idle Labor Assumption** is the hidden premise required for **3 (Interval)** to function.

  **Final Instruction:** Do not resolve the tension. If a student asks, "So is money neutral or not?" your answer is: "Hume says it is neutral as a stock, but active as a flow. Whether that is a contradiction or a theory of dynamics is for you to decide."
