      *   *Why:* If you do Interest first, they might think "Oh, Hume just likes real factors." If you do Neutrality first, they think "Oh, classic QTM." Then the Interval hits: "Wait, money *does* do something?" Then Interest: "But not on rates." This maximizes the cognitive dissonance.

  7.  **Refining the Example:**

      *   *Export Boom (Cloth for Gold).*
      *   *Run 1 (Equilibrium):* Prices equalized. No incentive to trade more.
      *   *Run 2 (Inflow):* Cloth demand spikes. Gold enters. Merchants hold gold -> Hire workers -> Wages/Spending up -> Prices up *later*.
