      *   **Required Components:**
          *   Teaching Plan (Order & Dependencies).
          *   One Carrying Example (run twice: level vs. transition, 2 regions, no banking/paper, no lump sum).
          *   Misconceptions (Expected + Unexpected, where to head them off).
          *   Closing Question (Tests understanding of transition vs. neutrality).
          *   Exclusions (What to explicitly omit).
      *   **Specific Tension to Stage:** Money as "oil" (neutral instrument) vs. Money inflow stimulating industry (non-neutral transition). Is it an exception, a transition claim, or unresolved tension?
      *   **User's Proposed Components:** Money vs. Wealth; Closed-economy neutrality; Open-economy redistribution; The Interval (transition); Interest rate argument.
