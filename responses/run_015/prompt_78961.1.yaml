          *   You can't understand the "Interval" (4) without understanding the Open-Economy mechanism (3) (since the inflow comes from trade imbalance).
          *   The Interest Rate argument (5) is structurally parallel to the Money argument (real vs. nominal), but logically distinct. It reinforces the "real vs. nominal" distinction established in (1) and (2).
      *   *Correction on Dependencies:* The user asks if dependencies run the other way. Actually, (1) is the foundation. (2) follows from (1). (3) explains how (2) is achieved globally. (4) complicates (2) and (3). (5) supports the "real factors matter" thesis of (2).
