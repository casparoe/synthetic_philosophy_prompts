  3.  **Develop the Carrying Example:**

      *   *Requirements:* Two regions, no banking/paper, not a lump sum to everyone (must show distributional effects/inflow), run twice (Stock vs. Flow).
      *   *Candidate 1: Shipwreck.* (Treasure washes up). Problem: Usually implies a lump sum discovery or one-time event. Hard to show "inflow over time."
      *   *Candidate 2: Newly Opened Mine.* (Potosi). Good for stock increase. But does it show *inflow* to a specific trading partner? If the mine is in Region A, Region A gets the money first.
      *   *Candidate 3: Trade Surplus.* Region A sells more to Region B. Gold flows B -> A.
      *   *Selection:* **The "Persistent Trade Surplus" (Gold Inflow) Scenario.**
          *   *Why:* It fits Hume's *Of the Balance of Trade*. It naturally creates the "inflow" dynamic required for the Interval. It avoids the "lump sum" problem because the gold arrives via merchants spending it locally first.
          *   *Modification:* Let's use a specific commodity trade to make it concrete. **Grain and Gold between Agraria and Manufacturia.**
          *   *Run 1 (Steady State):* Balanced trade. Prices reflect money stock.
          *   *Run 2 (The Shock):* Manufacturia becomes more efficient. Exports rise. Gold flows in.
