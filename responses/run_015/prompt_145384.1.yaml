answer: |-
  # Mechanism Quick-Sort (MQS) Procedure
  **Version:** 1.0 (Reliability Shift Use)
  **Time Limit:** 20 Minutes
  **Goal:** Determine if a failure is a **Recurrence** (Apply Patch) or a **Systemic Risk** (Escalate to Regulator).

  **Definitions for Shift Team:**
  *   **Symptom (Phenomenon):** What the alarm says (e.g., "False Low," "High Vibration").
  *   **Causal Chain (Organization):** The step-by-step sequence of events leading to the symptom (e.g., "Sludge blocks port → Signal drops").
  *   **Parts & Actions (Entities/Activities):** The specific physical items and what they did (e.g., "Sensor Model X," "Biofilm growth," "Firmware v2.1").

  ---

  ## The Checklist

  ### Step 1: Symptom Check
  **Question:** Is the observable failure symptom identical to the previous incident (Last Quarter/Year)?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **OUTPUT: ESCALATE TO REGULATOR.** (New phenomenon implies new risk profile).
  *   **Data Missing:** **OUTPUT: STOP (Missing Data).** (Do not guess the symptom).

  ### Step 2: Causal Chain Check
  **Question:** Is the sequence of events (the "story" of how the failure happened) structurally the same?
  *   *Note: Ignore the specific parts for this question. Focus on the flow.*
  *   *Example:* "Obstruction in signal path" is the same chain, whether the obstruction is dirt or code.
  *   **Yes:** Proceed to Step 3.
  *   **No:** **OUTPUT: ESCALATE TO REGULATOR.** (Different mechanism organization = Different root cause).
  *   **Borderline/Unclear:** **OUTPUT: HAND TO HUMAN — VALUES CALL.** (Requires Senior Engineer judgment on abstraction level).
  *   **Data Missing:** **OUTPUT: STOP (Missing Data).** (Run diagnostics before answering).

  ### Step 3: Parts & Actions Check
  **Question:** Are the specific physical components and physical actions identical to the previous incident?
  *   *Note: This is the "Twist." If the Chain is the same but the Parts are different, the system is vulnerable to multiple attack vectors.*
  *   **Yes (Identical Parts/Actions):** **OUTPUT: APPLY PATCH.** (True recurrence. Same entities, same activities, same organization).
  *   **No (Different Parts/Actions):** **OUTPUT: ESCALATE TO REGULATOR.** (Organizational Match + Entity Mismatch = Systemic Design Flaw).
  *   **Data Missing:** **OUTPUT: STOP (Missing Data).**

  ---

  ## Procedure Run-Through

  ### Case 1: Chlorine Sensor False Lows (Biofilm Recurrence)
  *   **Context:** Last year, Sensor A read false lows due to biofilm. Today, Sensor A reads false lows.
  *   **Step 1 (Symptom):** False Low reading. (Matches Last Year). → **Yes.**
  *   **Step 2 (Causal Chain):** Biological growth obstructs diffusion membrane → Signal attenuates. (Matches Last Year). → **Yes.**
  *   **Step 3 (Parts & Actions):** Sensor Model X, Same Batch, Biofilm type *Pseudomonas*. (Matches Last Year). → **Yes.**
  *   **MQS Output:** **APPLY PATCH.**
  *   **Team Reaction:** "Told you so. Clean the sensor and log it." (Satisfied).

  ### Case 2: Chlorine Sensor False Lows (Firmware Update)
  *   **Context:** Last Quarter, Sensor A read false lows due to biofilm. Today, Sensor A reads false lows immediately after Firmware v4.2 installed.
  *   **Step 1 (Symptom):** False Low reading. (Matches Last Quarter). → **Yes.**
  *   **Step 2 (Causal Chain):**
      *   *Team View:* "It's just a sensor error."
      *   *MQS View:* We abstract the chain to "Interference in Measurement Chain."
      *   *Biofilm:* Physical interference in diffusion.
      *   *Firmware:* Mathematical interference in processing.
      *   *Decision:* Both are "Interference in Measurement Chain." → **Yes.** (Borderline, but for MQS we accept the abstraction).
  *   **Step 3 (Parts & Actions):**
      *   *Last Quarter:* Biofilm (Biological Entity) + Diffusion Block (Physical Activity).
      *   *Today:* Firmware Code (Digital Entity) + Calibration Curve Shift (Mathematical Activity).
      *   *Match?* **No.**
  *   **MQS Output:** **ESCALATE TO REGULATOR.**
  *   **Team Reaction:** **UNPOPULAR.** "It's the same sensor! Just roll back the firmware. Why are we calling the state over a software bug?"
  *   **Why:** The procedure flags that if *both* biology and code can break the system via the same organizational pattern, the *design* is fundamentally vulnerable, not just the part. This requires a systemic review (Regulator), not a local fix (Patch).

  ### Case 3: Pump Vibration (Bearing vs. Cavitation)
  *   **Context:** Last Quarter, Pump 3 vibrated due to bearing wear. Today, Pump 3 vibrates. Acoustic analysis suggests cavitation.
  *   **Step 1 (Symptom):** High Vibration Alarm. (Matches Last Quarter). → **Yes.**
  *   **Step 2 (Causal Chain):**
      *   *Last Quarter:* Mechanical friction → Imbalance → Vibration.
      *   *Today:* Fluid pressure drop → Bubble collapse → Shockwave → Vibration.
      *   *Match?* **No.** (Mechanical wear chain vs. Fluid dynamics chain).
  *   **Step 3 (Parts & Actions):** Skipped (Failed Step 2).
  *   **MQS Output:** **ESCALATE TO REGULATOR.**
  *   **Team Reaction:** "Annoying. We just wanted to swap the bearing."
  *   **Why:** Different causal chain means a different root cause. Cavitation implies a process control issue (flow/pressure), not just a maintenance issue (bearing replacement).

  ---

  ## Limitations: What This Procedure Cannot Settle

  No matter how good your data is, the MQS cannot settle **Normative Risk Tolerance.**

  The procedure can tell you if the mechanism is "Identical" or "Matched," but it cannot tell you if a "Systemic Design Flaw" (Case 2) is actually dangerous enough to warrant a state shutdown versus a quiet internal redesign. That is a **Values Call**.

  *   **The Philosophical Gap:** Mechanisms describe *how* things break, not *how bad* it is if they do.
  *   **The Engineering Gap:** If the "Organizational Match" (Case 2) is deemed low-risk by management despite the procedure saying "Regulator," the SOP itself is flawed, not the diagnosis.
  *   **The Hard Stop:** If the team lies about Step 2 (Causal Chain) to avoid the Regulator call, the procedure becomes a compliance checkbox rather than a safety tool. The MQS assumes honesty; it cannot enforce it.
