answer: |-
  ### Quick Brainstorming & Design Notes

  Before drafting the statement, here is the strategic logic used to structure this adversarial collaboration document:

  1.  **Defining the Middle Ground:** The biggest barrier is the definition of "intuition." Universalists tend to define it as *competence* (underlying cognitive architecture), while Contextualists define it as *performance* (situated judgment). The agreed claims must establish a "thin" definition that allows both to operate without conceding their core metaphysical claims.
  2.  **The WEIRD Compromise:** Universalists can admit sampling bias without admitting cognitive difference. Contextualists can admit measurement noise without admitting universality. The agreement needs to isolate *systematic variation* from *noise*.
  3.  **The Reflective Equilibrium (RE) Crux:** This is the niche framing. Universalists view RE as a description of how human brains resolve cognitive dissonance (global). Contextualists view RE as a specific normative practice taught in Western institutions (local). This needs to be the pivot point for the third crux.
  4.  **Non-Verbal Measures:** To avoid linguistic confounds, the third crux must rely on behavioral proxies (reaction time, surprise responses) rather than survey Likert scales. This addresses the "silent judgment" constraint.
  5.  **Tone:** The language must be "we-focused" (joint statement) but precise enough that a philosopher of science could critique the methodology. No name-dropping, just structural claims.

  ***

  # JOINT STATEMENT ON CROSS-CULTURAL METAPHYSICAL INTUITIONS
  **Prepared by the Universalist and Contextualist Working Groups**
  **Date:** October 2023
  **Status:** Draft for Peer Review

  ## 1. Agreed Claims
  *The following points represent methodological and factual commitments accepted by both camps. Signing this section does not imply agreement on the etiology of the observed data, but rather on the conditions under which data is admissible.*

  1.  **Definition of Intuition:** For the purposes of this collaboration, an "intuition" is defined as a spontaneous, pre-theoretical propositional attitude or behavioral disposition triggered by a specific scenario, occurring prior to explicit deliberative reasoning. Both sides agree this must be distinguished from *considered judgments* (post-reflection) and *explicit theories* (learned doctrines).
  2.  **Performance Error vs. Competence:** Both sides agree that not all variance in survey response indicates genuine intuitive difference. Agreed sources of performance error include: translation nonequivalence, pragmatic implicature (what the respondent thinks the researcher wants to hear), and survey fatigue. However, we disagree on the threshold for classifying residual variance as error versus systematic difference (see Section 2).
  3.  **The WEIRD Sampling Limit:** Both sides agree that reliance on Western, Educated, Industrialized, Rich, and Democratic (WEIRD) undergraduate samples constitutes a sampling bias regarding *global population representation*. Universalists maintain this biases *data collection*; Contextualists maintain this biases *theoretical baseline assumptions*.
  4.  **Methodological Limits of Surveys:** Both sides acknowledge that Likert-scale surveys conflate *strength of belief* with *willingness to assert*. We agree that future designs must include binary forced-choice tasks, reaction time measures, and confidence weighting to disentangle these factors.
  5.  **Stability Condition:** Both sides agree that for an intuition to count as "stable" (Universalist claim) or "systematically shaped" (Contextualist claim), it must demonstrate test-retest reliability within individuals over a 6-month period, controlling for recent exposure to philosophical discourse.

  ## 2. Disagreements Table
  *The following table isolates substantive divergences. Wording has been neutralized to ensure neither side feels caricatured.*

  | Issue | Universalist Position | Contextualist Position |
  | :--- | :--- | :--- |
  | **Source of Variation** | Observed cross-cultural variance is primarily due to performance errors, framing effects, or differing applications of a shared underlying cognitive architecture. | Observed cross-cultural variance is primarily due to genuine differences in cognitive processing shaped by enculturation, language, and social structure. |
  | **Status of WEIRD Samples** | WEIRD samples provide a valid baseline for core metaphysical intuitions; deviations elsewhere are noise or secondary elaborations. | WEIRD samples represent a specific cultural outlier; using them as a baseline distorts the mapping of human cognitive possibilities. |
  | **Nature of Disagreement** | Disagreements are largely terminological or methodological; once controls are applied, core intuitions converge. | Disagreements are substantive; even with controls, divergent patterns remain due to fundamentally different conceptual schemes. |
  | **Role of Reflection** | Reflection (and seeking coherence) strips away cultural noise to reveal universal core intuitions. | Reflection is itself a culturally situated practice that may overwrite or reshape original intuitions rather than reveal them. |

  ## 3. Cruxes and Empirical Predictions
  *These are the specific sub-questions where resolving the evidence would force a theoretical update for at least one side. We have identified three critical cruxes.*

  ### Crux 1: Linguistic Framing vs. Narrative Structure
  **The Question:** Do intuition gaps persist when linguistic framing is standardized but narrative structure remains constant?
  **The Issue:** Contextualists argue that language families (e.g., agent-focused vs. event-focused languages) shape metaphysical reasoning. Universalists argue that if you strip away pragmatic framing, the underlying logic is identical.
  **Agreed Evidence:** A parallel vignette study administered in three language families (Indo-European, Sino-Tibetan, Bantu) using back-translation and pragmatic equivalence testing. The vignettes describe causation events where the agent's intent is ambiguous.
  **Predictions:**
  *   **Universalists:** Predict that once pragmatic implicature is controlled, variance in causation judgments will drop below effect size *d* = 0.2 across all groups.
  *   **Contextualists:** Predict that variance will remain significant (*d* > 0.5) even with controls, correlating with grammatical structures (e.g., obligatoriness of agent marking).

  ### Crux 2: Collective Moral Responsibility in Small-Scale Societies
  **The Question:** Is the attribution of collective responsibility a difference in *scope* (who counts as an agent) or *kind* (what responsibility is)?
  **The Issue:** Universalists argue all humans distinguish between individual and group agency but weigh them differently based on social ecology. Contextualists argue some cultures possess a concept of distributed agency that is metaphysically incompatible with Western individualism.
  **Agreed Evidence:** Comparative fieldwork with two small-scale subsistence societies (one highly individualist hunter-gatherer, one highly collectivist horticulturalist) using non-verbal punishment allocation tasks (e.g., resource deduction) following group harm scenarios.
  **Predictions:**
  *   **Universalists:** Predict that individuals in all groups will prioritize punishing the specific causal agent when identified; collective punishment is a secondary heuristic used only when the individual agent is unknown.
  *   **Contextualists:** Predict that in collectivist societies, collective punishment will remain high even when the individual agent is known, indicating a fundamental difference in the concept of responsibility.

  ### Crux 3: Reflective Equilibrium and Non-Verbal Coherence Seeking
  **The Question:** Is the drive for coherence (Reflective Equilibrium) a universal cognitive default or a locally-bound philosophical practice? Can it be detected non-verbally?
  **The Issue:** This crux addresses the "silent, non-verbal intuitive judgment" constraint. Universalists treat Reflective Equilibrium (RE) as a description of a global cognitive mechanism (dissonance reduction). Contextualists treat RE as a locally-bound normative method taught in specific educational contexts. We must determine if the *process* of seeking coherence happens without explicit philosophical training or language.
  **Agreed Evidence:** A "violation of expectation" behavioral study using eye-tracking and reaction times. Participants (philosophically naive adults from distinct cultural backgrounds) watch physical or social scenarios that violate either (a) logical consistency or (b) cultural norms. We measure physiological surprise (pupil dilation, gaze duration) when inconsistencies are presented non-verbally.
  **Predictions:**
  *   **Universalists:** Predict that all groups show heightened physiological surprise (longer gaze, dilation) when *logical consistency* is violated, regardless of cultural norms. This indicates RE is a global cognitive default mode accessible without language.
  *   **Contextualists:** Predict that physiological surprise correlates primarily with violations of *local cultural norms*, not abstract logical consistency. This indicates RE is a locally-bound practice; without linguistic training, there is no universal drive to resolve metaphysical incoherence.

  ***

