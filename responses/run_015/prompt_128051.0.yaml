prompt: |-
  Since my sister's psychiatric diagnosis was revised twice within eighteen months—not because her symptoms changed, but because the assessment center adopted a revised manual and then a reimbursement protocol—I have come to see psychiatric classification as an active mechanism rather than a neutral taxonomy. I need a classroom activity for an upper-level philosophy of science seminar: fourteen graduate students, ninety minutes. The goal is to make the dynamics of interactive classification tangible, specifically the looping effect in which being sorted into a category reshapes the behavior that then confirms or destabilizes the category. I want the activity to inject and dramatize one under-examined feature: asymmetric reflexivity, meaning that the classificatory framework absorbs feedback selectively—amplifying behaviors that fit its categories and filtering out disconfirming responses—so that the loop acquires epistemic inertia and resists correction even when the original grounds for the category have eroded.

  Design a structured simulation with real but small stakes (not money: use collective determination of the seminar's final case study, plus individual participation credit that can be gained or lost through in-game actions). Divide students into rotating roles across three rounds: Assessors, who construct and revise diagnostic-style categories based on observed behavior; Subjects, who must complete collaborative tasks while being assigned to categories that carry hidden rule-sets affecting their available actions; and Archivists, who decide which behaviors are recorded and visible to Assessors and which are discarded or mislabeled. The rules must be arranged so that, in Round 1, Assessors create categories from initial observations; in Round 2, Subjects adapt their task strategies upon learning their assigned category, producing changed behavior; and in Round 3, Assessors revise categories using only the Archivists' filtered records, facing a forced collective choice—either maintain an obsolete category that still controls access to resources (the final case-study vote) or dissolve it and lose the predictive framework they have come to depend on. The philosophical point must arise from the dynamics: participants should feel pressure to stabilize the loop and should notice that disconfirming evidence disappeared not through conspiracy but through structural filtering, before anyone names the concept.

  Provide the exact rules and turn order for each round; the incentive scheme with precise payoffs; role instructions that conceal the philosophical framing; a minute-by-minute timeline for the session; a debrief that maps Round 1 onto initial classification, Round 2 onto reactive change, and Round 3 onto loop closure and asymmetric absorption; a prediction of what will go wrong on the first run (for example, Assessors over-correcting in panic, Subjects colluding with Archivists, or the group resolving the tension too quickly by voting); and an explicit, honest statement of which feature of long-term institutional looping—likely the slow sedimentation of categories into bureaucratic and legal structures—this single session cannot reproduce and that I, as facilitator, will need to supply verbally.

  The activity should be runnable without any prior reading; do not include bibliographies, reading lists, citations, or requests for further sources.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level philosophy of science seminar (14 graduate students, 90 minutes).
      *   **Topic:** Interactive classification, looping effects (Hacking), specifically *asymmetric reflexivity* (selective absorption of feedback, epistemic inertia).
      *   **Goal:** Make these dynamics tangible/dramatic through a simulation.
      *   **Constraints:** No money (use seminar case study vote + participation credit). No prior reading. No bibliographies/citations.
      *   **Structure:** 3 Rounds. Roles: Assessors, Subjects, Archivists. Rotating roles.
      *   **Mechanics:**
          *   Round 1: Assessors create categories from observation.
          *   Round 2: Subjects adapt behavior based on category (looping).
          *   Round 3: Assessors revise based *only* on filtered records (Archivists), facing a choice (maintain obsolete category vs. lose framework).
      *   **Deliverables:** Exact rules, turn order, incentive scheme, role instructions (concealed framing), minute-by-minute timeline, debrief guide, prediction of failure modes, limitation statement.

  2.  **Deconstruct the Core Concept (Asymmetric Reflexivity):**
      *   Standard Looping: Classification $\rightarrow$ Behavior Change $\rightarrow$ Classification Update.
      *   *Asymmetric* Looping: Classification $\rightarrow$ Behavior Change $\rightarrow$ *Filtered* Evidence $\rightarrow$ Classification Reinforcement (even if wrong).
      *   The "Archivist" role is crucial here. They are the mechanism of inertia. They must have a reason to filter that isn't malicious but structural (e.g., "standardization," "clarity," "relevance").

  3.  **Design the Simulation ("The Protocol"):**
      *   *Task:* Needs to be collaborative but observable. Building a structure? Solving a puzzle? Let's go with a "Pattern Construction" task using abstract symbols or cards. It allows for ambiguity. Let's use "Token Arrangement."
      *   *Roles:*
          *   Assessors (4 students): Define the "Types."
          *   Subjects (6 students): Do the task.
          *   Archivists (4 students): Record the data.
          *   *Total:* 14 students. Perfect.
      *   *Incentives:*
          *   Collective: Choosing the final seminar case study (high stakes for grad students).
          *   Individual: Participation credit (gain/lose based on "accuracy" or "compliance").
      *   *The Twist:* The Archivists have a "Relevance Protocol" that forces them to discard data that doesn't fit the existing categories, even if the Subjects tell them it's important.

  4.  **Drafting the Rounds:**
      *   *Round 1 (Baseline):* Subjects do task. Assessors watch. Archivists record everything. Assessors make initial Typology (e.g., Type A, Type B).
      *   *Round 2 (Reaction):* Subjects are told their Type. They get specific constraints/bonuses based on Type. They adapt. Archivists record *but* must use the Typology labels. If a behavior doesn't fit, they must mark it "Noise."
      *   *Round 3 (Inertia):* Assessors see *only* the Archive (not live Subjects). They must update the Typology. But the Archive is skewed. They must vote on the "Official Taxonomy" which determines the Case Study.

  5.  **Refining the Incentives (The "Stakes"):**
      *   *Case Study Vote:* If the Assessors maintain consistency across rounds, *they* pick the case study. If they dissolve the taxonomy, the *Archivists* pick it. (This creates tension between stability and truth).
      *   *Participation:*
          *   Assessors: Points for predictive accuracy (did the Subject act like their Type?).
          *   Subjects: Points for task completion + "Legibility" (being easily categorized).
          *   Archivists: Points for "Completeness" (volume of data) BUT penalized for "Ambiguity" (unclassifiable entries). *This creates the asymmetric pressure.* They will drop ambiguous data to save their own score.

  6.  **Developing the Role Instructions (Concealed Framing):**
      *   Don't say "Philosophy of Science." Say "Organizational Efficiency Study."
      *   Assessors: "Taxonomy Team."
      *   Subjects: "Operatives."
      *   Archivists: "Data Compliance."
      *   *Crucial:* Archivists need a rule that sounds neutral but causes bias. "Standardize entries to existing codes. If an action has no code, log as 'Anomaly' (max 3 per round)."

  7.  **Timeline (90 Minutes):**
      *   Intro/Setup: 15 min.
      *   Round 1: 15 min.
      *   Round 2: 20 min.
      *   Round 3: 20 min.
      *   Debrief: 20 min.
      *   *Check:* 15+15+20+20+20 = 90. Tight but workable.

  8.  **Addressing the "Asymmetric Reflexivity":**
      *   In Round 2, Subjects will try to game the system or express frustration.
      *   Archivists, wanting to avoid "Anomaly" penalties, will translate these frustrations into existing categories (e.g., "Subject argues" becomes "Type A Agitation").
      *   In Round 3, Assessors see "Type A Agitation" and think, "See? Type A is inherently agitated." The loop closes.

  9.  **Predicting Failure Modes:**
      *   *Collusion:* Students talk across roles. *Fix:* Physical separation or strict silence rules.
      *   *Quick Resolution:* Assessors say "This is rigged." *Fix:* Make the incentives tangible enough (case study choice is real).
      *   *Archivist Rebellion:* They record everything. *Fix:* Enforce the "Anomaly Limit" strictly.

  10. **Limitation Statement:**
      *   A 90-minute class can't show *generational* inertia or *legal* codification. It shows the epistemic mechanism, not the structural weight of law/insurance/time.

  11. **Review against Constraints:**
      *   14 students? Yes (4/6/4 split).
      *   90 mins? Yes.
      *   No money? Yes (Case study + credit).
      *   No citations? Yes.
      *   Concealed framing? Yes.
      *   Specific focus on asymmetric reflexivity? Yes (via Archivist rules).

  12. **Final Polish:**
      *   Ensure the instructions are clear enough to be handed out.
      *   Make sure the Debrief explicitly connects the game mechanics to the philosophical concepts without jargon initially.
      *   Refine the "Payoff Matrix" to ensure the pressure is felt.

