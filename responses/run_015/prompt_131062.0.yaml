  Popper saves his position by distinguishing between trends and laws. Historicists mistake a trend (like population growth) for a law (population must grow forever). Popper allows conditional predictions based on "situational logic." These rely on the rationality principle—that actors act appropriately to their situation—not on immutable historical forces. The regularities allowed in piecemeal engineering are institutional, not historical. For example, "if supply drops, price rises" holds within a market institution, but markets themselves are human creations that can vanish. Historicist laws claim to dictate the creation and destruction of institutions themselves. Popper's conditional predictions are explicitly ceteris paribus; they admit failure if conditions change. Historicist predictions claim inevitability regardless of human intervention. Furthermore, piecemeal engineering focuses on small-scale adjustments where feedback loops are manageable. Historicism attempts to model the whole society, where the "Oedipus effect" (the prediction influencing the outcome) makes long-term forecasting impossible because new knowledge alters the very conditions predicted. Crucially, Popper's regularities are falsifiable trials. If the interest rate hike fails, the theory is adjusted. Historicism treats failure as a temporary deviation from the inevitable path. Popper accepts local regularities while rejecting global determinism. He permits scientific method without granting it prophetic power over the totality of human history.

