  - About eight branch nodes, each phrased as a question someone could answer without already knowing where it leads, and each attached to a concrete case rather than to a piece of theory. Six to nine leaves, each with its usual label if it has one, "unnamed" if nobody really defends it, and one sentence on its most awkward commitment.
  - Please use at least most of these cases (and invent your own for any node that needs a sharper one): conjoined twins who share some brain tissue; a program running as two processes on servers in different countries; a slime-mold or ant-colony "superorganism"; a watch taken apart and laid out on a tray overnight, then put back together; a cloud; your nose and the Eiffel Tower taken together; a lab-grown brain organoid with some spontaneous activity; a symphony performance; a corporation.
  - The angle I care about, so these distinctions should be real high-level nodes and not footnotes: (1) whether the answer has to be fully general or may be relative to a kind/sortal or to somebody's interests — I want that near the top, because I'm pretty sure it's what actually splits the people in my class; (2) whether composition has to be modally sturdy: if the xs compose something, do they still have to compose something after any tiny change in how they're arranged or how far apart they are? I made up a view in discussion section along those lines — call it "sturdiness" for now — so place it in the tree and tell me whether it's just some named position in disguise or whether it sits in an empty region; (3) whether the composite has to have causal powers of its own or can be something we merely pick out in description; (4) whether composition is allowed to be vague or borderline.
