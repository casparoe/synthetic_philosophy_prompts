  - For each unoccupied box in the space, one line on why nobody lives there: incoherent, unattractive, or just unexplored.

  Format: start with one sentence of bottom line — the single upshot of the tree, the thing I'd say to a classmate (e.g. which node ends up doing basically all the work) — then the tree itself, then the notes on leaves, empty regions, and unseparable pairs. No preamble, no restating what I asked, and please don't name papers or give me a reading list of any kind; I can't look anything up from class and I don't need citations.
