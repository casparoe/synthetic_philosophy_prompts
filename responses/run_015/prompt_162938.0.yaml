  The tree shows that your class's disagreement isn't really about objects, but about whether reality cares about our concepts (Node 1) and whether existence tolerates vagueness (Node 2), with most named views collapsing into the same empirical predictions despite different metaphysical costs.

  ### The Decision Tree

  **Node 1 (Interest-Relativity):** When considering the *nose and the Eiffel Tower*, is the fact of whether they compose something fixed entirely by physical reality, or does it depend on whether humans find it useful to count them as one?
  *   **Yes (Depends on interests):** Go to Node 7.
  *   **No (Fixed by reality):** Go to Node 2.

  **Node 2 (Vagueness):** In the case of a *cloud*, can it be genuinely indeterminate whether composition is occurring, or must there be a precise fact of the matter?
  *   **Yes (Vagueness allowed):** **Leaf 1**.
  *   **No (No vagueness):** Go to Node 3.

  **Node 3 (Universality):** Do *any* plurality of objects compose something, even scattered processes like a *program running on servers in different countries*?
  *   **Yes (Always composes):** **Leaf 2**.
  *   **No (Sometimes composes):** Go to Node 4.

  **Node 4 (Nihilism):** Do *no* pluralities ever compose something, so that even an assembled *watch* is just springs and gears?
  *   **Yes (Never composes):** **Leaf 3**.
  *   **No (Sometimes composes):** Go to Node 5.

  **Node 5 (Life):** Is composition restricted *only* to living things, such that a *slime-mold* counts but a *watch* does not?
  *   **Yes (Life required):** **Leaf 4**.
  *   **No (Non-living allowed):** Go to Node 6.

  **Node 6 (Consciousness/Unity):** Must the parts share a unified conscious experience or performance, as arguably in *conjoined twins* or a *symphony*, rather than just a *lab-grown organoid*?
  *   **Yes (Consciousness/Performance required):** **Leaf 5**.
  *   **No (Functional/Physical allowed):** Go to Node 8.

  **Node 7 (Causal Powers):** If composition depends on interests, must the resulting object (like a *corporation*) have causal powers over and above its members?
  *   **Yes (Causal powers required):** **Leaf 6**.
  *   **No (Descriptive only):** **Leaf 7**.

  **Node 8 (Sturdiness):** If composition occurs (e.g., the *watch*), must it survive tiny spatial disruptions like being *taken apart overnight* without ceasing to exist?
  *   **Yes (Modally sturdy):** **Leaf 8**.
  *   **No (Sensitive to arrangement):** **Leaf 9**.

  ### The Leaves

  1.  **Vague Objectivism:** *Unnamed.* **Awkward commitment:** Reality itself contains indeterminate facts, implying logic fails at the boundaries of clouds.
  2.  **Universalism:** *Universalism.* **Awkward commitment:** There is an object composed of your nose and the Eiffel Tower, regardless of anyone's interests.
  3.  **Nihilism:** *Nihilism.* **Awkward commitment:** You do not exist; there are only simples arranged person-wise.
  4.  **Organicism:** *Organicism.* **Awkward commitment:** Artifacts like watches never exist, but parasites and slime-molds do.
  5.  **Consciousness Restrictivism:** *Consciousness-Based Composition.* **Awkward commitment:** A symphony exists only while played, and comatose humans might cease to be objects.
  6.  **Causal Conceptualism:** *Functionalism.* **Awkward commitment:** A corporation exists only so long as it acts, vanishing during administrative pauses.
  7.  **Descriptive Conceptualism:** *Deflationism.* **Awkward commitment:** Composition is never true in reality, only true relative to a language game.
  8.  **Sturdy Restrictivism:** *Unnamed (User's View).* **Awkward commitment:** A watch survives a millimeter gap but ceases to exist if the gap becomes a meter, without a precise cutoff point.
  9.  **Standard Restrictivism:** *Brutalism/Contact.* **Awkward commitment:** Composition facts are brute and arbitrary, stopping at exactly one level of scattering without deeper explanation.

  ### Notes on Space, Separation, and Sturdiness

  **Empty Regions:**
  *   **Vague Objectivism (Leaf 1):** Mostly unoccupied because arguments by Lewis and Sider suggest vague identity is logically incoherent.
  *   **Sturdy Restrictivism (Leaf 8):** Unoccupied because it invites a sorites paradox; if composition survives a micron gap, it is hard to motivate why it fails at a meter gap without admitting vagueness (which Node 2 rejected).

  **Unseparable Pairs:**
  *   **Organicism (Leaf 4) vs. Consciousness Restrictivism (Leaf 5):** These views often make identical predictions for humans and artifacts, separating only on edge cases like slime-molds or brain organoids where intuitions are too unstable to adjudicate.
  *   **Nihilism (Leaf 3) vs. Standard Restrictivism (Leaf 9):** If the Restrictivist claims composition facts are brute and arbitrary, their empirical predictions match Nihilism for all cases except those where humans intuitively posit objects, making them inseparable by case intuition alone.

  **The "Sturdiness" View:**
  Your "Sturdiness" view sits in an **empty region** (Leaf 8). It is not merely a named position in disguise; it attempts to be a Restrictivist view that avoids the fragility of Contact views without collapsing into Universalism. However, it is unmotivated in the literature because it inherits the sorites vulnerability of Universalism while retaining the arbitrariness of Restrictivism.
