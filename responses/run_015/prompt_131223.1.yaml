answer: |-
  # THE CO-OP DECISION TREE (A3 DRAFT)

  **Instructions for the AGM:** Start at the top. Answer **YES** or **NO** based on what you would actually *do* in the scenario described, not what sounds nice. Follow the line to your leaf. Your leaf tells you how to vote on the three motions today.

  ---

  ## THE BRANCH QUESTIONS

  **Q1. THE "CERTIFIED ZERO" TEST**
  Imagine the Supplier and the Council both guarantee in writing: if you opt out of the scheme this year, **nothing changes**. No extra emissions, no price rise for neighbours, no delay to the truck, and the hall boiler gets replaced by a grant anyway. Your choice is causally invisible.
  *   **Do you still pay your share and vote Yes?**
      *   **NO** → Go to **Q2** (You care about *impact*).
      *   **YES** → Go to **Q4** (You care about *principle*).

  **Q2. THE "HARD THRESHOLD" TEST**
  The Supplier's 12-tonne minimum. The village has ordered 11 tonnes. The truck **will not come** unless we hit 12. You don't need the fuel, but buying one tonne triggers the delivery for everyone.
  *   **Do you buy the tonne?**
      *   **NO** → **LEAF 1**
      *   **YES** → Go to **Q3**

  **Q3. THE "NUDGE & LOCKSTEP" TEST**
  Two cases: (A) The Supplier sets next year's schedule by a rolling average; your order today nudges the truck's route by a fraction of a pallet next year. (B) The Shared Lorry runs only if *both* valleys order; you order, but it depends on the strangers.
  *   **Do you order in these cases (fractional or joint impact)?**
      *   **NO** → **LEAF 2**
      *   **YES** → **LEAF 3**

  **Q4. THE "CO-OP VETO" TEST**
  The Co-op votes **against** the green option (to save cash or lower fees). The group decision is "No".
  *   **Do you personally still do it anyway (privately or by donating)?**
      *   **NO** → **LEAF 4**
      *   **YES** → **LEAF 5**

  ---

  ## THE LEAVES (YOUR POSITION)

  ### LEAF 1: THE CONSISTENT EGOIST
  *   **Logic:** You only act if it benefits you directly. If your action has no causal impact, you spend the money on yourself.
  *   **Status:** *Unattractive.* (Rarely defended openly at AGMs).
  *   **How to Vote:**
      1.  **Boiler:** **NO** (Unless it lowers your rent).
      2.  **Pellets:** **NO** (Unless you need the fuel).
      3.  **Offsets:** **NO**.
  *   **The Awkward Thing to Say:** "I know the truck won't come and the hall will freeze, but since my £500 won't fix it alone, I'm keeping it."

  ### LEAF 2: THE THRESHOLD TRIGGER
  *   **Logic:** You care about impact, but only when you are the *decisive* switch. Probabilities and fractions don't count.
  *   **Status:** *Coherent.* (Common among pragmatists).
  *   **How to Vote:**
      1.  **Boiler:** **YES** (Only if your vote is the tie-breaker).
      2.  **Pellets:** **YES** (Only if we are exactly 1 tonne short).
      3.  **Offsets:** **NO** (Too diffuse).
  *   **The Awkward Thing to Say:** "I'll save the planet, but only when I'm the single person who tips the scale."

  ### LEAF 3: THE PROBABILITY CALCULATOR
  *   **Logic:** You care about *expected* impact. A tiny chance of a big result (Lockstep) or a guaranteed tiny result (Nudge) is worth the cost.
  *   **Status:** *Coherent.* (The "Effective Altruist" view).
  *   **How to Vote:**
      1.  **Boiler:** **YES** (Even if overdetermined, it supports the norm).
      2.  **Pellets:** **YES** (Merge orders to maximize efficiency).
      3.  **Offsets:** **YES** (If the math works out per tonne).
  *   **The Awkward Thing to Say:** "I'm happy to pay for a 1% chance of making a difference, as long as the sum of all our 1%s adds up."

  ### LEAF 4: THE CO-OP MEMBER
  *   **Logic:** Your duty is to the *collective decision*. You act on principle, but only as part of the group practice.
  *   **Status:** *Coherent.* (The "Democratic" view).
  *   **How to Vote:**
      1.  **Boiler:** **FOLLOW THE MAJORITY**.
      2.  **Pellets:** **FOLLOW THE MAJORITY**.
      3.  **Offsets:** **FOLLOW THE MAJORITY**.
