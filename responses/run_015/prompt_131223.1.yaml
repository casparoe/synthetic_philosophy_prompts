  ## A NOTE ON LEAF 5 (YOUR MOOD)

  You asked not to be gentle. Leaf 5 is a coherent philosophical position (Kantian/Expressive), but at a Co-op AGM, it carries a specific risk.

  **The Risk:** It turns a collective action problem into a personal purity test. If everyone adopts Leaf 5, the Co-op works beautifully. If *only you* adopt Leaf 5, you are subsidizing the others' morality while they take the credit for the outcome.

  **The Test:** If you are truly Leaf 5, you must be willing to pay for the boiler replacement **even if the Co-op dissolves tomorrow**. If you wouldn't do that, you are actually **Leaf 4** (Co-op Member) pretending to be Leaf 5. Check yourself on Q4 before you speak.
