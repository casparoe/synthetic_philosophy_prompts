  ## EMPTY CELLS & LOGICAL GAPS

  **1. The "Principle but Lazy" Cell (Q1=YES, Q2=NO)**
  *   **Description:** Someone who says they act on principle even when nothing changes (Q1), but refuses to act when they could definitely save the truck (Q2).
  *   **Verdict:** **INCOHERENT.** If you act for principle, a guaranteed good outcome should strengthen your resolve, not weaken it. If you find someone here, they are likely lying about Q1.

  **2. The "Group but Not Self" Cell (Q4=YES, Q1=NO)**
  *   **Description:** Someone who won't act if nothing changes (Q1), but *will* act against the group vote (Q4).
  *   **Verdict:** **UNDEFENDED.** This implies you only care about impact, except when the group says no, then you care about integrity. Nobody argues this openly.

