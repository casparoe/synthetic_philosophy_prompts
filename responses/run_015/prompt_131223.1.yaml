  ## COLLAPSING LEAVES

  **Leaf 2 (Trigger) and Leaf 3 (Probability)**
  *   **Observation:** On the three actual votes today, these two leaves often vote the same way (YES to Boiler, YES to Pellets).
  *   **Why:** Because in a group of 140, the "Threshold" is usually met by the group, so both feel their participation is valid.
  *   **How to Pry Them Apart:** Ask about **Offsets**. Leaf 2 will almost always say NO (no clear trigger), while Leaf 3 might say YES (expected value). If you want to distinguish them at the AGM, put the Offset motion to a vote first.

  **Leaf 4 (Co-op) and Leaf 1 (Egoist)**
  *   **Observation:** If the Co-op votes to save money (No on green), Leaf 4 and Leaf 1 both vote NO.
  *   **Why:** Both end up incurring no cost.
  *   **How to Pry Them Apart:** Ask about **Past Behaviour**. Leaf 1 would have voted No even if the Co-op voted Yes (if it cost them). Leaf 4 would have voted Yes. You need to know their counterfactuals to tell them apart.

