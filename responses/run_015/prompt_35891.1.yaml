prompt: |-
  At a management workshop I attended, a consultant kept invoking Machiavelli's line that it is better to be feared than loved to defend a deliberately abrasive leadership style — withholding praise, public dressings-down, the whole thing. My impression is that the line, in its commonly repeated form, compresses several very different claims, and that the original context in The Prince carried hedges that got dropped along the way — I half-remember something about preferring to be both if possible, and about being feared without being hated. Lay out the distinct precise theses the slogan could be expressing, ordered from the near-trivial to the genuinely radical: for instance, a claim about which motive more reliably secures compliance; a claim about what a ruler can control versus what depends on others' moods; a pessimistic claim about human nature; a claim about the timing and dosage of harshness rather than its amount. For each reading, give a verdict — platitude, substantive but plausible, substantive and false — say whether it is actually Machiavelli's or a distortion, and, above all, whether it would license what the consultant used it to license: standing intimidation as a management technique. If the hedges I half-remember are doing real work in the original, say which readings they undercut. Lead with your bottom line about the consultant's use in your first sentence, then give the reasoning as a menu, with no preamble.
