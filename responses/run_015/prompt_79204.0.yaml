answer: |-
  Here is the conceptual carving you requested.

  ### 1. The Conceptual Neighborhood
  To locate this pattern, we must first map the territory surrounding it. There are three established concepts that your character's interlocutors are drawing upon, none of which fit perfectly:

  *   **Pascal's Mugging:** This is the closest relative. In the classic thought experiment, a mugger threatens to harm an astronomically large number of people unless you hand over your wallet. The probability of the threat being real is tiny, but the utility (suffering averted) is so vast that the Expected Value (EV) of paying the mugger exceeds the cost of the wallet.
      *   *Difference:* Pascal's Mugging relies on a **causal improbability** (the mugger's ability to affect the future). Your pattern relies on **ontological uncertainty** (the nature of the insect's mind). The mugger claims *power*; the insect argument claims *presence*.
  *   **The Fanaticism Objection:** This is a critique of Expected Utility Theory itself. It argues that if you strictly follow EV calculations, you become a "fanatic" who ignores near-certain, moderate goods (feeding the hungry now) for tiny-chance, astronomical goods (preventing a specific existential risk).
      *   *Difference:* Fanaticism describes the *behavioral outcome* (ignoring the present for the remote). Your pattern describes the *epistemic input* (how we assign probability to metaphysical claims).
  *   **Moral Uncertainty:** This field deals with how to act when you are unsure which moral theory is true (e.g., "I'm 60% utilitarian, 40% deontologist").
      *   *Difference:* Moral uncertainty usually weighs competing *normative systems*. Your pattern weighs the *scope of moral patients* within a single system (usually utilitarianism), using empirical population counts to resolve metaphysical doubt.

  ### 2. The Verdict and The Coinage
  There is no single, canonical philosophical term that isolates this specific move: *multiplying empirical scale against metaphysical ignorance to generate moral certainty.*

  In academic circles, this is often buried under discussions of "Moral Weight" or "Sentience Probabilities," but the argumentative structure itself is unnamed. For your purposes, and for the precision you require, I propose we coin the term:

  **Ontological Leverage**

  ### 3. Precise Definition
  **Ontological Leverage** is an argumentative move in decision theory and ethics where an agent converts *metaphysical ignorance* regarding the moral status of an entity into a *subjective probability*, which is then multiplied by an *empirical magnitude* (population size, duration, or intensity) to produce a dominant Expected Value.

  **The Structure of the Move:**
  1.  **The Ontological Gap:** Acknowledge ignorance about whether a class of entities (insects, aliens, AI) possesses the property required for moral value (sentience, soul, consciousness).
  2.  **The Epistemic Translation:** Refuse to treat this ignorance as a null value. Instead, assign a non-zero subjective probability (e.g., $10^{-6}$) based on the "possibility" rather than evidence.
  3.  **The Empirical Multiplier:** Identify a vast empirical quantity associated with the entities (e.g., $10^{18}$ insects alive).
  4.  **The Dominance Conclusion:** Calculate the Expected Value ($Probability \times Quantity \times Intensity$). Because the Quantity is sufficiently large, it overwhelms any competing moral priority with higher probability but lower scale.

  ### 4. Differentiation: What It Is and Is Not
  To write this character accurately, you must distinguish Ontological Leverage from its cousins.

  **Vs. Pascal's Mugging:**
  *   **Pascal's Mugging** is about *causal reach*. "I can affect $3 \uparrow\uparrow\uparrow 3$ people." The skepticism is: "You literally cannot do that."
  *   **Ontological Leverage** is about *moral presence*. "These entities might matter." The skepticism is: "They literally might not feel anything."
  *   *Why it matters:* In Mugging, the probability is often viewed as absurdly low because the claim is physically impossible. In Ontological Leverage, the probability is hard to dismiss because consciousness *is* metaphysically opaque. We genuinely do not know where the "light" of sentience turns on. This makes the leverage harder to break.

  **Vs. The Fanaticism Objection:**
  *   **Fanaticism** is a critique of the *output*. It says, "Your conclusion is crazy; therefore, your math is wrong."
  *   **Ontological Leverage** is a description of the *input*. It explains *how* the math gets to be crazy. It is the engine that drives the fanaticism.
  *   *Why it matters:* A character using Ontological Leverage won't feel like a fanatic. They will feel like a rigorous accountant. They aren't ignoring the present; they are just correcting for a massive accounting error (ignoring potential suffering) that everyone else is making.

  ### 5. The Edges: Legitimacy vs. Laundering
  This is the crux of your novel's conflict. When is Ontological Leverage a valid ethical calculation, and when is it "laundering metaphysical uncertainty into a verdict"?

  **The Legitimate Edge:**
  Ontological Leverage is action-guiding and legitimate only when two conditions are met:
  1.  **Bounded Utility:** The "suffering" or "value" per entity must have a ceiling. If the value per insect is finite, the total value, while huge, is calculable.
  2.  **Robust Priors:** The probability assigned to sentience must be derived from positive evidence (neurology, behavior) rather than mere logical possibility. If we find neural correlates of pain in insects, assigning a 10% probability is legitimate leverage.

  **The Illegitimate Edge (The Laundering):**
  The move becomes suspect—mere "laundering"—when:
  1.  **Arbitrary Priors:** The probability is assigned solely because "it's not impossible." If I say, "There is a 1 in a million chance a rock is sentient," and there are $10^{20}$ rocks, rocks dominate ethics. This reduces the probability assignment to a game of picking numbers that force the desired conclusion.
  2.  **Unbounded Utility:** If the character argues that insect suffering is not just negative, but *infinitely* negative, or that preventing it secures an infinite future, the math breaks. Any non-zero probability multiplied by infinity is infinity. This allows *any* metaphysical speculation to dominate all practical reality.
  3.  **Epistemic Asymmetry:** The character applies this leverage only to the hypothesis that generates urgency. If they assign a 1-in-a-million chance to insects feeling pain, do they also assign a 1-in-a-million chance to insects being divine avatars whose death brings cosmic bliss? If they ignore the positive upside but leverage the negative downside, they are not doing math; they are fear-mongering with variables.

  ### 6. Narrative Application
  For your character, the tension lies in the **source of the probability**.

  *   **The Rationalist Mask:** Your character likely presents this as cold, hard math. "I'm not saying insects *are* sentient. I'm saying the *risk* is too high." This shields them from the burden of proof. They don't need to prove pain; they only need to prove *uncertainty*.
  *   **The Vulnerability:** The character's worldview collapses if they are forced to bound their utility function. If you ask them, "Is there any amount of human suffering that outweighs the potential suffering of all insects?" and they say "No," they have admitted their utility function is unbounded, and Ontological Leverage has become a black hole consuming all other values.
  *   **The "Laundering" Moment:** A key scene might involve the character assigning a probability. If pressed, "Why one in a million? Why not one in a billion?" and they cannot answer without saying, "Because one in a billion doesn't change the conclusion," you have exposed the laundering. The probability is being reverse-engineered to justify the priority, not derived from evidence.

  **Summary for your notes:**
  *   **Term:** Ontological Leverage.
  *   **Mechanism:** Metaphysical Ignorance $\times$ Empirical Scale = Moral Certainty.
  *   **Key Distinction:** Unlike Pascal's Mugging (causal奇迹), this relies on the opacity of consciousness (ontological mystery).
  *   **Failure Mode:** When the probability is arbitrary and the utility is unbounded, it becomes **Epistemic Inflation**, allowing speculation to dictate reality.
