answer: |-
  # Rationale

  The crux of this question is the tension between the formal definition of concept learning as binary classification based on intrinsic predicates and the pragmatic reality of how humans actually solve induction problems. The standard philosophical treatment focuses on underdetermination (many rules fit the data), but the "Mate" and "Degenerate" variants force the student to confront deeper issues: that the vocabulary of hypotheses is constructed rather than given, that solvability depends on tacit assumptions of cooperative communication rather than logical fit, and that the target of learning may be structural correspondence rather than individual classification. A successful answer must move beyond labeling these puzzles as "hard for AI" or "examples of Goodman's riddle" and instead argue for what these failures imply about the nature of concepts themselves.

  ***

  # Exam Question

  **Question 1 (25 marks)**

  A **Bongard problem** consists of twelve boxes containing geometric figures. Six boxes are arranged in a left column, six in a right column. The solver must discover the rule that distinguishes the left group from the right group. The rule must apply to all six left boxes and no right boxes.

  Consider two variant families of this task:
  1.  **Mate Problems:** The twelve figures fall into six congruent pairs (allowing for rotation and uniform scaling). Each pair has exactly one member on the left and one member on the right. No intrinsic property of the individual figures distingu the left group from the right.
  2.  **The Degenerate Rule:** In a standard problem, the rule "The box is in the left column" fits the data perfectly. It is simple, uses ordinary spatial vocabulary, and is not gerrymandered like Goodman's artificial predicates. Yet, this rule is universally rejected by solvers and constructors.

  Write an essay analyzing what these two variants reveal about the standard view of concepts as classifiers and induction as hypothesis selection. In your answer, address the following: the construction of vocabulary versus selection from a fixed space; the role of tacit cooperation between constructor and solver; the implication of Mate Problems for the view of concepts as sorting devices for particulars; the status of the Degenerate Rule regarding projectibility; and whether success at these puzzles provides evidence for general cognitive structures or merely artifacts of a cooperative game.

  ***

  # Model Answer

  The standard philosophical model of concept learning treats it as a search through a hypothesis space for a predicate that separates positive instances from negative ones. This model assumes a fixed vocabulary of properties and defines success as finding a rule with perfect fit and high simplicity. The Mate and Degenerate variants of the Bongard problem demonstrate that this model is fundamentally inadequate. These puzzles reveal that concept learning is not merely selecting a classifier but constructing a vocabulary, relying on tacit pragmatic assumptions, and sometimes identifying structural correspondences rather than intrinsic properties.

  First, the standard model fails because it assumes the vocabulary of hypotheses is given in advance. In typical induction problems, we measure simplicity within a fixed language. However, solving a Bongard problem often requires inventing a new description— noticing "triangles with inward dents" rather than just "polygons." The difficulty is not primarily underdetermination by data, which is always present in induction. The harder problem is that the relevant predicates are not available until the solver re-describes the figures. Any account that conditions on a fixed hypothesis space fails to describe the task, because the cognitive work lies in generating the language in which the rule is stated, not just picking the best sentence from a pre-existing list.

  Second, the rejection of the Degenerate Rule highlights the role of tacit cooperation. The rule "is in the left column" has perfect fit and is syntactically simple. It is rejected not because it fits poorly, but because it violates a pragmatic assumption of fairness. The solver assumes the constructor intends a unique, non-trivial rule based on the figures' content, not their position on the page. This assumption does real work in making the problems solvable; without it, any spatial property would be valid. When this cooperation fails, as in adversarial construction, the task collapses into unsolvability. This suggests that concept learning is not a solitary logical operation but a communicative act where the learner infers the teacher's intent.

  Third, the Mate Problems challenge the view of concepts as devices for sorting particulars. In a Mate Problem, no property of an individual box sorts it into left or right, because every box on the left has a congruent twin on the right. The property of "containing a figure congruent to some figure in the other half" applies to all twelve boxes. Therefore, the induced item cannot be a predicate over individual figures. Instead, the solver must induce a correspondence or a structure relating the two sets. This has severe consequences for views treating concepts as classifiers of individuals. If a concept can be a relation between sets rather than a property of instances, then the standard definition of a concept as a mental predicate is too narrow. We must allow for concepts that are structural mappings.

  Fourth, the Degenerate Rule forces a position on projectibility. Goodman argued that some predicates are not projectible into the future despite fitting past data. The Degenerate Rule is projectible in a logical sense—it will remain true for these boxes—but it is cognitively inert. This suggests that possessing a concept is not just the capacity to classify presented figures correctly. If it were, the "left column" concept would be valid. Instead, concept possession seems to require the capacity to classify *newly presented* figures in new contexts. The Degenerate Rule fails because it cannot generalize beyond the specific arrangement of the page. Thus, projectibility depends on the potential for transfer, not just retrospective fit.

  Finally, we must ask whether success at these puzzles evidences general cognitive structures. One might argue that solving them reveals an innate bias toward figural properties or compositionality. However, it is equally plausible that success is an artifact of a shared visual culture playing a cooperative game. We reject the Degenerate Rule because we share a convention about what counts as a "puzzle." A non-artifactual test would need to remove the cooperative frame—perhaps by asking solvers to predict the next figure in a sequence without a constructor's intent—or demonstrate that the same structural biases appear in non-communicative learning tasks. Until then, these puzzles may tell us more about our social conventions than our cognitive architecture.

  In conclusion, these variants show that induction is not just fitting data to rules. It involves constructing the vocabulary of description, relying on pragmatic cooperation, recognizing relational structures beyond individual classification, and demanding transferable projectibility. The standard classifier model misses the generative and social dimensions of how we actually form concepts.

  ***

  # Marking Scheme

  **Total: 25 Marks**

  **1. Vocabulary Construction vs. Fixed Space (5 marks)**
  *   **Full marks:** Argues that the core difficulty is generating the descriptive language, not selecting from a pre-existing set; notes that simplicity measures fail if the language isn't fixed.
  *   **Partial/Common Error:** Focuses only on underdetermination (many rules fit) without addressing the *construction* of the predicates themselves. Treats the hypothesis space as given.

  **2. Tacit Cooperation and Fairness (5 marks)**
  *   **Full marks:** Identifies that solvability relies on an assumption of the constructor's intent (Gricean pragmatics); notes that without this, the task is ill-defined or adversarial.
  *   **Partial/Common Error:** Claims the Degenerate Rule is rejected because it is "too simple" or "trivial" without explaining why simplicity isn't the metric here, or misses the communicative aspect.

  **3. Mate Problems and Structural Correspondence (5 marks)**
  *   **Full marks:** Recognizes that Mate Problems cannot be solved by individual classification predicates; argues the concept is a relation/correspondence between sets, challenging the "concept as classifier" view.
  *   **Partial/Common Error:** Attempts to find an intrinsic property for the left side (e.g., "the left ones are the originals") which contradicts the problem definition, or misses the implication for concept theory.

  **4. Degenerate Rule and Projectibility (5 marks)**
  *   **Full marks:** Distinguishes between logical fit and cognitive projectibility; argues that concept possession requires capacity for transfer/generalization to new contexts, which the spatial rule lacks.
  *   **Partial/Common Error:** Dismisses the rule as "not a property of the figure" without engaging with the philosophical problem of why some spatial properties count and others don't, or conflates this with Goodman's grue problem without distinction.

  **5. Methodological Validity (5 marks)**
  *   **Full marks:** Questions whether puzzle performance reflects cognitive architecture or cultural convention; proposes what a non-artifactual test would require (removing the cooperative frame).
  *   **Partial/Common Error:** Accepts the puzzles as direct evidence of innate biases without considering the alternative explanation of shared cultural conventions regarding games/puzzles.

  **A vs. B Boundary**
  To secure an **A (20-25 marks)**, a script must synthesize points 3 and 5 specifically: it must clearly articulate how the Mate Problem forces a revision of the *definition* of a concept (from predicate to relation) and link this to the methodological warning that our intuitions about "fair" rules are cultural artifacts. A **B (15-19 marks)** script will correctly identify the issues in points 1, 2, and 4 but may treat the Mate Problem as merely "harder" rather than structurally different, or accept the puzzles as valid evidence without the methodological caveat.

  **Marker Disagreement**
  Markers are most likely to disagree on **Point 4 (Projectibility)**. Some may accept the argument that "left column" is not projectible because it is indexical, while others may argue it is projectible within the context of the page but simply uninteresting. Discretion should be given to answers that clearly define what they mean by projectibility in this context.

  ***

  # Assessment Notes

  **B-Grade Check**
  A competent candidate who has done the reading but never seen these variants can reach a solid B because the question stem defines the variants sufficiently to argue against them. The definitions provided explain *why* the Mate Problem lacks intrinsic separators and *why* the Degenerate Rule fits the data. A B-grade student will use these definitions to argue that the standard model fails (Points 1, 2, 4) without necessarily deriving the deeper structural implications for concept theory (Point 3) or the methodological critique (Point 5). They will recognize the puzzle dynamics from their knowledge of induction and Goodman, even if the specific puzzles are new.

  **Examiner's Caveat**
  This model answer should make a marker reasonably confident that the candidate understands the pragmatic and structural limitations of the standard classification model. However, I am least confident in the claim made in the final paragraph regarding what a "non-artifactual test" would look like; the suggestion to remove the cooperative frame might fundamentally alter the cognitive process being tested rather than purify it. A specialist might argue that cooperation is intrinsic to concept learning itself, not merely an artifact of the puzzle format.
