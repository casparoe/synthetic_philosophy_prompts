  **Note on the SLO Analogy:**
  The analogy breaks because an SLO is a normative constraint (a target we set), whereas the Kestrel exponent is a descriptive law (a behavior nature exhibits). In reductionism, descriptive laws are expected to bottom out in physical mechanisms; normative constraints bottom out in human agreements. Using the SLO risks conflating "stable despite implementation changes" with "prescriptive regardless of physical limits."
