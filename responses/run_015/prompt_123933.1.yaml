prompt: |-
  hey — I'm a backend engineer, no philosophy background at all, and some people at work run a book club that's doing philosophy of science this quarter, and we just did reduction and emergence and I came away more confused than when I went in, because it felt like everyone was arguing about whether the word "emergence" is allowed rather than about anything I could check. The thing I can't get straight is whether the two sides are disagreeing about how nature is, or about what a good explanation has to look like. So: please act as a professional philosopher of science who also knows a decent amount of condensed-matter / complex-systems stuff, think carefully about this before you write anything, and start with a short bullet sketch (like 4-6 bullets) of each side's single strongest argument and where it's soft, and only then write the actual piece.

  What I want is a dialogue, roughly 900-1000 words, between two researchers at a made-up institute who both know the material cold and neither of whom is a strawman — call them Ines and Teodor or whatever, it's not important. Here's the concrete case they're arguing over, which I'm making up because the real examples in the reading were either too hand-wavy or too far into physics I don't speak: there's a family of about forty organometallic surface lattices ("Kestrel lattices") that all spontaneously grow a travelling chemical front whose speed obeys v = C·Δ^(1/3), where Δ is the driving gradient. The exponent comes out the same to three decimal places across eleven orders of magnitude in Δ and several hundred kelvin of temperature, even though the microscopic story is completely different from lattice to lattice — in some it's band-like transport, in others it's polaron hopping, in a few it's defect-mediated — and for about a tenth of them, where a new single-atom imaging method finally resolved what's going on, the mechanism turned out to be something nobody had guessed. Teodor's side says: fine, but you can derive the 1/3 from the microdynamics, you just have to let the number of constituents go to infinity and the noise amplitude go to zero in a specific joint way, and the order of those limits matters, and at any finite size and finite noise the simulated front either stalls or splits into two. Ines's side says: exactly, the micro details don't explain the exponent, they cancel out, and the macro law is the only thing that's stable across the family, and what we can intervene on is the front, not the ten-to-the-twenty-sixth microvariables. I'd like each of them to be forced to actually answer the other's best point rather than talk past it: Ines has to deal with the exclusion-style worry (if the macro state is nothing over and above the micro state and the micro is doing all the causal work, what exactly is left for the macro to do, and why isn't "emergence" just a label for our ignorance?) and Teodor has to deal with the disjunctiveness worry (the micro-description of "being a front moving at that speed" is some horrible infinite disjunction over forty different chemistries, so the special-science kind isn't a micro kind) and with the fact that the "in-principle derivation" seems to be doing an awful lot of work. Both of them should make at least one concession that genuinely costs them something, they should each state the other's strongest argument in a form the other accepts before criticizing it, and I don't want it resolved — I want the reader to be able to see precisely where the real disagreement has ended up living by the end. Please keep them sounding like tired people at 11pm in front of a whiteboard, not debate robots, and no spooky-quantum-mystery moves or "you simply don't understand reduction" moves.

  The reason I find this gripping is that it reminds me of arguing with people at work about whether a service's latency SLO is "reducible to" the code: the same SLO survives totally different implementations, nobody thinks the SLO is an extra force in the rack, and yet no amount of reading the code tells you the SLO. You can have one character make that analogy once if it fits, but if my analogy is actually misleading in some way I'd like a line or two after the dialogue saying where it breaks, since that's usually how I figure out whether I've understood a thing.
