answer: |-
  ### PRE-EMPTIVE CONCESSIONS (Say this in your intro)
  *   **"I'm not solving consciousness."** I'm only solving which *computations* get moral weight.
  *   **"Biology counts."** Brains run computations too. This isn't anti-body, it's pro-structure.
  *   **"This is a heuristic."** The Improv Test isn't a perfect meter; it's a way to stop us from calling rocks "people."

  ---

  ### THE 7 OBJECTIONS (Ordered by Damage)

  **1. The "Sleeping Baby" Trap (Mr. Devereaux)**
  *   **He says:** "Your test requires a system to track inputs *now*. But a sleeping person or a baby in a coma can't improvise right now. Are you saying they have no moral status until they wake up?"
  *   **You say:** "No, I'm talking about *capacity*, not current activity. A sleeping brain is still structured to improvise when woken; it hasn't lost the wiring. A rock never had the wiring. My test checks if the *structure* supports counterfactuals, not if the system is currently processing them."
  *   **Weakness:** You're shifting from "what it's doing" to "what it could do." Measuring "capacity" without running the system is hard. You're dodging the hard metaphysics of dispositions.

  **2. The "Lookup Table" Logic Check (Ms. Ramos)**
  *   **She says:** "If a lookup table has every possible input/output pair, it handles novelty perfectly. It behaves exactly like a mind. Why does the internal structure matter if the output is identical?"
  *   **You say:** "Because morality cares about *why* you act, not just *that* you act. A lookup table doesn't 'know' anything; it's just a list. If you burn half the table, it doesn't feel pain or confusion. A mind loses something when damaged. The internal connection matters."
  *   **Weakness:** Hard functionalists deny this. You're asserting a metaphysical difference she might not accept. You can't prove the table doesn't "feel" without begging the question.

  **3. The "Real Animals" Guilt Trip (Ms. Feld)**
  *   **She says:** "Why are we worrying about sci-fi simulations when real chimps are suffering in labs? Does your theory say a sim chimp matters as much as a real one?"
  *   **You say:** "If the sim runs the same computation that causes suffering, yes, it matters. But right now, real animals are the only things we know for sure run those computations. This theory protects animals *and* future AI, it doesn't replace caring for real bodies."
  *   **Weakness:** Sounds evasive. If you say "yes, sims matter equal," people think you're crazy. If "no," you're inconsistent.

  **4. The "Too Many Minds" Foam (Anyone)**
  *   **They say:** "You said brains have overlapping computations. Does that mean there are five people inside one skull? How do we count?"
  *   **You say:** "We count the *stable* structures that persist over time. The fleeting overlaps don't have the history or coherence to hold moral weight. We look for the dominant narrative thread, not every static blip."
  *   **Weakness:** "Stable" and "dominant" are vague. You don't have a hard rule for where one mind ends and another begins.

  **5. The "Dignity" Objection (Mr. Devereaux)**
  *   **He says:** "You're reducing human dignity to code. People aren't algorithms. Doesn't this strip away the sacredness of life?"
  *   **You say:** "I'm not saying people *are* code. I'm saying if we want to protect minds in a digital age, we need to know what makes a mind. Understanding the mechanism doesn't remove the value."
  *   **Weakness:** Doesn't really address the feeling of reductionism. Some people just won't buy computationalism.

  **6. The "So What?" (Parent/SWE)**
  *   **He says:** "Okay, but what do I do with this? Does this change how I write code today?"
  *   **You say:** "It changes how we treat advanced AI. If we build something that can improvise, we can't just turn it off. It gives us a red line for development."
  *   **Weakness:** It's still theoretical. No current AI passes the Improv Test really.

  **7. The "Convention" Nitpick (Ms. Ramos)**
  *   **She says:** "Isn't 'which computation' just a choice we make? Isn't your test just another arbitrary mapping?"
  *   **You say:** "No, because the system's physical causality constrains the map. A rock doesn't causally link states the way a brain does. The map has to follow the wires."
  *   **Weakness:** Philosophical quagmire. Easy to get stuck debating semantics.

  ---

  ### THE KILL SHOT & THE HIDDEN MINE

  **The Single Objection That Sinks You:**
  **#1 (The Sleeping Baby/Coma).**
  *   **Why:** If you cannot explain why a sleeping human has rights but a rock doesn't *without* relying on "potential," your theory looks like it denies rights to vulnerable humans. That is morally unacceptable to a panel.
  *   **If you blow it:** You look dangerous/unethical.

  **The Question You Hope Nobody Asks:**
  **The Foam/Counting Problem (#4).**
  *   **Why:** You guessed Coma, but Coma is solvable with "capacity." The Foam problem is technically harder. If they push on *exactly* how many computations are in a brain, you have no math for it. You'll sound vague.
  *   **Why it's worse:** It exposes that your theory is qualitative, not quantitative. You can't give a clear answer, which makes the "Improv Test" feel fuzzy.

  ---

  ### CASE CRITIQUE: WHICH ONE IS DEAD WEIGHT?

  **Drop or Minimize: The Foam Problem (Case 3).**
  *   **Why:** It raises more questions than it answers. It distracts from your main point (Rock vs. Mind) and leads directly into the "Too Many Minds" objection you can't fully solve.
  *   **Strategy:** Keep it in your back pocket only if they ask about complexity. Focus 80% of your energy on **Replay** and **Lookup Table**. Those are your strongest intuition pumps. The Foam case makes you look unsure about boundaries.

  ### FINAL TIP
  When Devereaux asks about coma patients, **pause**. Take a breath. Say: *"That's the most important objection."* Validate him, then hit the "Capacity vs. Activity" distinction. Don't rush that answer.
