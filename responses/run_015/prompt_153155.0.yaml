      *   *Premise (3) & (4):* Negative space instantiation. This is the crux. Does absence *carry* structure, or does it *reveal* structure in the positive space?
      *   *Premise (6) & (7):* The slippery slope. "Any blank region can be interpreted as carrying it." This relies on unlimited interpretive freedom.
