  3.  **Identify the Weak Link:**
      *   *Option A: Reject (4).* Can absence carry the frame? In design, yes (negative space logos). But is it the *absence* carrying it, or the *boundary* between presence and absence? If I have a black card with a hole, the "letter" is usually defined by the *edge* of the hole, not the hole itself. The hole is just the substrate.
      *   *Option B: Reject (6)-(7).* This is the stronger candidate. The leap from "structured absence" (a deliberate hole shaped like 'a') to "unstructured absence interpreted as structured" (a coffee ring defining what isn't there) is a category error. It confuses *potentiality* with *actuality*.
