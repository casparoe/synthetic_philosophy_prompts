      *   *Why (6) fails:* It conflates *structural instantiation* with *pareidolia* (seeing patterns in noise). The ghost-glyph has *specific* constraints (the hole *must* be that shape). The coffee ring allows the viewer to project *any* shape.
      *   *The "Cost":* Rejecting (4) kills negative space art. Rejecting (6) preserves the necessity of *deliberate constraint*.
