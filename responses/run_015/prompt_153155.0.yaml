      *   **Hofstadter's View:** Hofstadter cares about "spirit" and "style." Style implies a system of constraints. Random noise doesn't have style.
      *   **Semiotics:** Signifier vs. Signified. The ghost-glyph has a structured signifier. The coffee ring does not.

