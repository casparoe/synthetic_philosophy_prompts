      *   Conclusion: Don't kill negative space; kill the unlimited interpretation.

  9.  *(Self-Correction during drafting)*: I should make sure I don't just say "Intent." Hofstadter might argue intent is in the eye of the beholder (reader-response). Better to focus on *structural constraint*. The ghost glyph *forces* the 'a' reading; the coffee ring *permits* it but doesn't force it. The "frame" requires *specific* relations, not just *any* relations.

  10. **Finalizing the advice:** The slip is in (6). It equivocates on "carrying the frame." The ghost glyph *encodes* the frame. The coffee ring *allows* the frame to be projected. Encoding vs. Projection.

