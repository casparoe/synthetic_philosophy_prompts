answer: |-
  The generator outside shuddered, a rhythmic thrum that vibrated through the floorboards and into the legs of the table. Inside the small module, the only light came from the kerosene lamp, casting long, wavering shadows against the walls of ice-frosted aluminum. Dr. Selene Marchetti traced the curve of a plasmid map with a gloved finger, the paper crinkling in the dry heat.

  "The data is unambiguous, Rowan," Selene said, her voice low, competing with the wind. "In the recipient strains from Sector Four, the ribozyme is present. It binds. It folds. But to call that binding a 'function' is to confuse what a thing *does* with what it is *for*."

  Dr. Rowan Kessler sat opposite, nursing a mug of tea that had gone cold an hour ago. He leaned forward, the lamplight catching the sharp angles of his face. "It acts as a thermal brake, Selene. Just as it did in the progenitor strain. When the temperature spikes, the ribozyme cleaves, the transcription factor is released, and the cell survives. If that isn't function, what is it? Magic?"

  "It is physics," Selene corrected, not looking up. "It is chemistry. In the original lineage, that chemical interaction was a function because it was the *reason* the ribozyme persists. Selection sculpted it for that braking mechanism. But in these Sector Four strains? The ribozyme arrived via horizontal transfer yesterday, evolutionarily speaking. The lineage did not select for it. The system did not evolve to depend on it. It is a molecular tourist. It happens to fit the lock, but the lock was not made for the key."

  Rowan set the mug down. "You are making the history of the key more important than the turning of the lock. If the cell's architecture recruits this ribozyme into a self-maintaining feedback loop *now*, why does the pedigree matter? The cell is treating it as indispensable. The system's capacity to survive thermal shock is constituted, in part, by this molecule. That contribution is real, regardless of how the molecule got there."

  "Indispensable?" Selene finally looked up, her eyes tired but sharp. "It is not indispensable. It is incidental. If you remove it, the cell might die, yes, but only because the ribozyme is physically obstructing a lethal pathway by accident. There is no normativity here, Rowan. If the ribozyme mutates in the progenitor strain, we say it has *malfunctioned*. It has failed a standard. If it mutates in Sector Four, it has merely *changed*. Without the history of selection for this specific contribution in this specific lineage, there is no standard to fail. You cannot have a broken part in a machine that never designed the part."

  Rowan tapped the table, a soft, rhythmic counterpoint to the generator. "You are assuming that 'design' requires a temporal lag. You think normativity only emerges from the rearview mirror. But consider the system as it stands. The Sector Four bacteria are maintaining themselves. They are homeostatic. This ribozyme is a causal component of that homeostasis. If I intervene and disrupt the ribozyme, the system's capacity collapses. That intervention test is the definition of function. Why should I care if the integration happened a million years ago or a million minutes ago? If the loop is closed *now*, the function is *now*."

  "Because," Selene said, leaning back into the shadows, "if you define function solely by current causal contribution, you lose the ability to distinguish between a trait that is *supposed* to do something and a trait that simply *does* something. The heart pumps blood. That is its function. But the heart also makes a thumping sound. That is a causal effect. We don't call the sound a function because the heart wasn't selected *for* making noise. In your view, if the thumping sound happened to vibrate a nearby sensor that kept the organism alive, the thumping would suddenly become a function. That makes function too easy. It becomes whatever happens to be useful in the moment."

  Rowan shook his head. "I am not arguing that every useful effect is a function. I am arguing for systematic exploitation. The thumping sound is a byproduct; it isn't integrated into the regulatory architecture. But this ribozyme *is* integrated. The Sector Four genome has already begun to adjust its expression levels to accommodate the ribozyme's presence. The architecture is recruiting it. You say it's a category mistake to call it functional because the history is missing. I say it is a category mistake to deny it is functional when the system is actively relying on it to persist."

  Selene picked up a pen, twirling it. "Relying on it, or merely tolerating it? You speak of the system 'recruiting' the trait as if the cell has intent. The cell has nothing but the immediate pressure of survival. If the ribozyme is useful, it will be selected for. *Then* it will have a function. Right now, it is in a liminal state. It is a protofunction. To grant it full functional status is to erase the distinction between adaptation and exaptation. It collapses the timeline."

  "But the timeline is irrelevant to the survival of the individual cell in front of us," Rowan pressed. "We are biologists, Selene, not historians. When we look at this slide, we are looking at a living system. If we say the ribozyme has no function here, we are saying its contribution to the cell's life is invisible to biology. We are forced to say the cell is surviving *despite* the ribozyme, when the data suggests it is surviving *with* the ribozyme as a constitutive element. If the system treats the trait as indispensable, on what grounds do we, as observers, veto that integration based on a genealogy the cell knows nothing about?"

  Selene paused. The generator hiccuped, the light dimmed for a second, then surged back. "On the grounds of error," she said softly. "That is the test. If the ribozyme fails to bind in the progenitor strain, the organism is defective. It is sick. In Sector Four, if the ribozyme fails to bind, is the organism sick? Or is it just a different organism? If you cannot define the conditions under which the trait is *wrong*, you cannot define what it is *for*. And you cannot derive 'wrongness' from mere presence. You need the history of selection to establish the norm."

  Rowan considered this, staring into the dark liquid of his tea. "I grant you that history establishes a specific *type* of normativity. A historical norm. But I am proposing a systemic normativity. If the feedback loop is stable, the trait can still be 'wrong' relative to the system's current maintenance. If the ribozyme mutates and disrupts the loop *now*, the system fails *now*. The norm is not 'did your ancestors select you?' The norm is 'are you currently sustaining the capacity of the whole?'"

  "That shifts the goalpost," Selene said. "You are redefining function from 'purpose' to 'role'. But biology is full of roles that aren't functions. A tumor has a causal role. It consumes resources, it signals, it grows. It is integrated. But it is not functional; it is parasitic. How do you distinguish the ribozyme from the tumor using only your causal account? Both contribute to the system's current state. One is functional, one is pathological. Your view struggles to tell them apart without looking at the history of whether the system was *shaped* to include them."

  "The tumor is not self-maintaining in the context of the organism's survival," Rowan countered. "It degrades the containing system's capacity. The ribozyme enhances it. The distinction is contribution versus degradation."

  "Until the environment changes," Selene replied. "Then the tumor might be neutral, or the ribozyme might be lethal. If function is only present contribution, then function flickers on and off with every change in temperature. That makes 'function' a transient property, like 'being hot' or 'being wet'. I argue it is a stable property, like 'being a heart'. A heart remains a heart even if it is currently frozen and pumping nothing. Its function is tethered to why it exists, not just what it is doing this second."

  Rowan leaned back, rubbing his temples. "So you require a stabilizing history. I require a stabilizing architecture."

  "Precisely."

  "Then perhaps," Rowan said slowly, "our disagreement is not about the ribozyme. It is about what we think biology is studying. Are we studying the lineage, the long arc of selection? Or are we studying the mechanism, the immediate logic of survival?"

  "We are studying both," Selene said. "But we must not confuse the map. When I say 'function', I mean 'selected effect'. When you say 'function', you mean 'systemic capacity'. We are using the same word to point at two different ontological categories."

  "Then let us be precise," Rowan said, picking up his pen. "I will concede that without the selective history, the ribozyme lacks *etiological* normativity. It cannot be 'broken' in the historical sense. But I will maintain that it possesses *systemic* normativity. It can be 'disruptive' to the current loop. If we are engineering these strains, Selene, if we are trying to understand how they survive *tonight* in this cold, your historical account offers me no leverage. The cell doesn't care about its ancestors. It cares about the loop."

  Selene looked at the plasmid map again, the ink stark against the white paper. "And if we are trying to understand why this trait persists across generations, why it becomes conserved, your systemic account offers no explanation. Useful accidents happen all the time. Most vanish. Only the ones that become selected acquire the weight of function. You explain the spark; I explain the fire."

  The wind howled outside, a long, mournful note against the siding. The lamp settled into a steady burn.

  "Then we agree on the physics," Rowan said, uncapping his pen. "The ribozyme binds. The cell survives. We disagree on whether the survival confers purpose or merely describes an outcome."

  "I can live with that," Selene said, writing a note in the margin of her data sheet. "Provided you admit that in the recipient strains, calling it 'functional' is a prediction, not a description. You are saying it *will* be selected. I am saying it *has been*."

  "And you," Rowan added, "must admit that until that selection is complete, the system is already treating it as functional. The normativity of the present is real, even if it is not yet the normativity of the past."

  Selene capped her pen. The click was loud in the small room. "The normativity of the present is just pressure, Rowan. Normativity requires time. But... I will grant you that the pressure is what creates the time."

  Rowan smiled, a faint, weary expression. "And I will grant you that without the time, the pressure is just noise."

  They sat in silence for a moment, the ribozyme suspended between them on the page, both a molecule and a meaning, waiting for the morning light to decide which one it truly was.
