      *   *Diachronic-Integrity Rationalist:* Closely resembles Velleman or Tenenbaum. The focus is on *acting for reasons* across time.
      *   *The Modified Case:* Crucial detail: "makes defaulting psychologically impossible without altering her post-rescue beliefs or values." This means she still *wants* to keep the money (instrumentally) but *can't* move her hand to keep it. This is a compulsion/constraint, not a preference shift.

