          *   **BR:** Focuses on *instrumental success* via precommitment. If it works, it's rational. The mechanism doesn't matter as long as the outcome is secured.
          *   **DIR:** Focuses on *rational agency continuity*. A reason must be accessible to the later self. Binding that makes default *psychologically impossible* might sever the link of agency. They want diachronic unity through rational endorsement, not causal locking.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. "Joint Statement of Adversarial Collaboration."
      *   **Introduction:** Briefly set the stage (Parfit's Hitchhiker + Modified Binding Case).

      *   **Section 1: Agreed Claims:**
          1.  *Formal Structure:* Both agree it's a dynamic inconsistency problem. Paying is dominant post-rescue, but not paying leads to death pre-rescue.
          2.  *Time-Slice vs. Diachronic:* Both agree time-slice rationality (CDT-style at $t_2$) recommends defaulting. Both agree diachronic rationality requires securing rescue at $t_1$.
          3.  *Binding vs. Preference Change:* Both agree the modified case involves a *constraint* on action, not a change in *valuation*. The agent still *wishes* they didn't have to pay (instrumentally) but *cannot* act on it.
          4.  *Constraint vs. Prediction:* Both agree a mere prediction (I know I will pay) isn't enough for the driver. It must be a hard constraint (psychological impossibility).

      *   **Section 2: Precise Disagreements:**
          1.  *Autonomy vs. Alienation:* BR says binding is peak autonomy (controlling future outcomes). DIR says it's alienation (treating future self as object).
          2.  *Agent vs. Automaton:* BR says the post-rescue self is still an agent, just with restricted options. DIR says if the capacity to reconsider is gone, they are an automaton regarding that decision.
          3.  *Assessment Criteria:* BR says assess based on $t_1$ expected utility. DIR says assess based on whether $t_2$ reasons are respected/accessible.

      *   **Section 3: The Cruxes:**
          *   *Crux 1: Transparency of Reasons.* Does the future self need to "see" the reason?
              *   *Case:* Democratic Precommitment (Constitutional entrenchment).
              *   *BR Prediction:* Shows rationality of binding against future passion.
              *   *DIR Prediction:* Shows danger of dead-hand control; requires amendment procedures (ongoing agency).
          *   *Crux 2: Status of Commitment Reasons.* Is "I promised" a real reason at $t_2$ if I'm bound?
              *   *Case:* The Ulysses Contract (tying to mast vs. wax in ears).
              *   *BR Prediction:* Wax in ears (irreversible) is better/safer.
              *   *DIR Prediction:* Tying to mast (reversible but resisted) preserves agency; wax destroys the listener.

      *   **Section 4: Conclusion (Verbal & Concession):**
          *   *Verbal:* Possibly the definition of "Agency." If BR defines it as "capacity to achieve goals" and DIR as "capacity to respond to reasons," they talk past each other.
          *   *Concession:* BR needs DIR to admit binding maximizes agency-capacity. DIR needs BR to admit that total loss of responsiveness undermines the *value* of the agency preserved.

  4.  **Refining the Philosophy:**
      *   Make sure the distinction between "Binding Rationalist" and "Diachronic-Integrity Rationalist" is sharp.
