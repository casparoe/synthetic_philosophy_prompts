prompt: |-
  I help keep a small volunteer archive for our town — local history, old photos, building records, that kind of thing — and the thing we actually argue about most isn't the facts, its wording: whether a sentence goes in flat (the mill burned in 1908), hedged (reportedly), or doesn't go in at all. There's three of us, we push out maybe forty entries a month, whatever we write gets quoted back at us at town meetings, and when people appeal a hedge I'm the one who has to explain it, so I want something better than our current system of everybody going with their gut.

  I got into this stuff on my own a couple years back — a used textbook, some podcasts, no classes — and the account that stuck with me (I think it's called the tracking theory? Nozick? maybe I've got the name wrong) is the one with the two what-if questions: you count as knowing that P only if, had P been false, you wouldn't have ended up believing it, and had P been true, you would have. I also gather there's a long fight about whether knowing P means you automatically know everything that obviously follows from P, which is exactly our problem, because half our entries are derived from other entries rather than from a source. I'm definately mangling some of this, so fix me gently but do fix me.

  What I want is an actual procedure, not an essay. Something a volunteer with no training can run on one claim in about ten minutes, with questions to answer in order, boxes to tick, and a one-line reason for the log. Please give me:

  - the steps in order, what counts as a good enough answer to each, and where the thing just stops — downgrade to a hedge, or leave it out;
  - one step where you write down, in a single sentence, how we came by the claim. My worry is people gaming this: describe the route in enough detail and everything passes, describe it loosely and nothing does. Give us a rule of thumb for how fine-grained that sentence should be, and say straight out if no rule can settle it;
  - a step for claims we reach by inference instead of from a source. My half-baked idea, tell me if it's wrong: besides testing the premise, run the same sensitivity question on the step itself — if this step were a bad one, would we still have taken it? — and tell us how many "obvious" steps we're allowed before we go back and check from scratch. Then tell me which of these are really the same question in disguise: a claim that follows in one obvious step; a claim that only follows once you know some background thing we had to look up; a chain of four steps; a claim stitched out of two things we each know separately; and nobody recorded it turned into it didn't happen;
  - a note on every step that's really a judgment call wearing a clipboard.

  Then run it on three of ours. One: a single 1978 newspaper clipping says the mill burned in 1908, and from that we'd also like to say the mill wasn't operating in 1909. Two: the swimming hole was closed in 1974 because the plant upstream dumped solvent — everyone in town knows this, there's a plaque, and if it were false we would all still believe it exactly as hard as we do now. Three: we've read every issue of the local paper from that summer and there's no mention of anyone drowning in the river, so we want to say nobody did.

  I already know which of those is going to come out badly and I'd rather watch you do it properly than have us quietly skip it. Finish with the one-page version — just the questions and the tick boxes, nothing else — that we can tape up over the scanner.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Volunteer archivist for a small town. Self-taught (textbooks, podcasts), familiar with epistemology concepts (Nozick's Tracking Theory, Closure Principle) but admits to mangling them.
      *   **Problem:** Inconsistent wording in archive entries (flat assertion vs. hedged vs. omission). Disagreements among three volunteers. High stakes (quoted at town meetings, appeals). Needs a standardized procedure, not an essay.
      *   **Constraints:**
          *   Procedure must be runnable by an untrained volunteer in ~10 minutes per claim.
          *   Needs specific steps, pass/fail criteria, and stop points (downgrade to hedge or drop).
          *   Needs a specific step for documenting the "route" to the claim (preventing gaming).
          *   Needs a specific step for inference/deduction (addressing the Closure Principle problem).
          *   Needs to identify "judgment calls wearing a clipboard."
          *   Must test the procedure on three specific cases provided.
          *   Must end with a one-page checklist version for the wall.
          *   Tone: Practical, respectful, precise, "fix me gently."

  2.  **Deconstruct the Epistemology:**
      *   **Tracking Theory (Nozick):** The user describes it correctly enough for this context.
          *   Condition 3 (Sensitivity): If $P$ were false, $S$ would not believe $P$.
          *   Condition 4 (Adherence): If $P$ were true, $S$ would believe $P$.
          *   *Application:* This is great for testing evidence reliability. If the evidence wouldn't change even if the fact were false, the belief isn't sensitive (e.g., the swimming hole rumor).
      *   **Closure Principle:** If $S$ knows $P$, and $S$ knows $P \implies Q$, does $S$ know $Q$?
          *   *Problem:* Archives rely on inference (Mill burned $\implies$ Mill not operating). Skeptics attack the inference chain.
          *   *Solution:* Limit the length/complexity of inference chains. Treat multi-step inferences as new claims requiring their own evidence check.
      *   **Gamification of Evidence Description:** The user worries volunteers will write vague or overly detailed provenance to game the system.
          *   *Solution:* Require specific "Source ID + Page/Line + Date" format. No narratives, just coordinates.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* 10 minutes max. 5-6 steps max.
      *   *Step 1: Source Identification.* (The "Route" step). Needs strict formatting rules.
      *   *Step 2: Sensitivity Check.* (Nozick's "If False" test). This is the core quality control.
      *   *Step 3: Inference Check.* (The Closure problem). How many steps? What counts as a step?
      *   *Step 4: Wording Decision.* Flat vs. Hedge vs. Drop.
      *   *Judgment Calls:* Need to highlight where human discretion is unavoidable despite the checklist.

      *   *Refining the Inference Step:* The user asks about specific scenarios (one obvious step vs. background knowledge vs. chains vs. stitched knowledge vs. absence of evidence).
          *   *Rule:* Max 1 inferential step without new evidence.
          *   *Absence of Evidence:* This is a specific logical fallacy (Argument from Ignorance) unless the search was exhaustive. Needs a specific test.
          *   *Community Knowledge:* This is hearsay. Needs to be treated as weak evidence unless corroborated.

      *   *Refining the "Route" Step:*
          *   *Rule:* "Source Type + Identifier + Location." E.g., "Paper, *Gazette* 1978-05-01, p.3."
          *   *Granularity:* If you can't point to the ink, it's oral tradition (Hedge).

  4.  **Testing the Procedure on the Three Cases:**

      *   *Case 1: Mill Burned (1908) $\implies$ Not Operating (1909).*
          *   Source: 1978 Paper (Secondary source for 1978 event, tertiary for 1908).
          *   Inference: Burned $\implies$ Not Operating.
          *   Sensitivity: If it *didn't* burn, would the paper say it did? (Maybe, if misinformed).
          *   Inference Step: Is it obvious? Yes, usually. But was it rebuilt quickly?
          *   *Verdict:* Flat for "Burned" (with source citation), Hedge for "Not Operating" (unless rebuild records checked).

      *   *Case 2: Swimming Hole (1974 Solvent).*
          *   Source: "Everyone knows," Plaque.
          *   Sensitivity: If it were false, would we believe it? YES. (This fails Nozick's Sensitivity condition).
          *   *Verdict:* Hedge heavily or Drop. "Town tradition holds..."

      *   *Case 3: No Drowning (Summer X).*
          *   Source: Absence in Paper.
          *   Sensitivity: If someone *did* drown, would the paper report it? (Depends on coverage).
          *   Inference: Absence of Evidence = Evidence of Absence.
          *   *Verdict:* Hedge. "No reports found" vs "Nobody drowned."

  5.  **Addressing Specific User Questions within the Draft:**
      *   *Fix the Epistemology:* Confirm Nozick/Tracking. Clarify Closure (it's controversial, so limit chains practically).
      *   *Route Granularity:* Give the "Pointer Rule."
      *   *Inference Types:* Distinguish between logical entailment and empirical generalization.
      *   *Judgment Calls:* Mark them clearly.

  6.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the epistemology (gently correct/validate).
      *   **The Procedure:** Step-by-step with boxes/ticks.
      *   **The "Route" Rule:** Specific guidance on granularity.
      *   **The Inference Rule:** Addressing the chain length and types.
      *   **Judgment Call Warnings:** Explicitly noted.
      *   **Case Studies:** Run the three examples through the mill.
      *   **The One-Pager:** The wall-chart version.

  7.  **Refining the Tone:**
      *   Keep it professional but accessible.
      *   Avoid academic jargon where possible, but use the user's terms (Tracking, Sensitivity) to validate their research.
      *   Be decisive. They want a tool, not a debate.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Keep the steps binary (Yes/No). If "No," immediate downgrade.
      *   *Critique:* Did I answer the "inference types" question specifically?
      *   *Fix:* Ensure the section on Inference explicitly categorizes the five scenarios the user listed.
      *   *Critique:* The user mentioned "Closure Principle" worries.
      *   *Fix:* Explain that archives *cannot* assume closure. Every inferential leap adds risk.

  9.  **Final Polish:** Check against all constraints in the prompt. (One-page version at end? Yes. Three cases run? Yes. Route rule? Yes. Judgment calls noted? Yes.)

  *(Self-Correction on Nozick)*: The user described Tracking Theory correctly (Sensitivity + Adherence). I should validate that.
  *(Self-Correction on Closure)*: The user asks about "knowing P means automatically knowing Q." In epistemology, this is the Principle of Closure. It's highly debated (Dretske/Nozick reject it). For an archive, we should *act* as if it fails. You don't know the consequence unless you check the consequence.

  *(Self-Correction on Case 3)*: "Nobody drowned" is a universal negative. You can't prove that with just a newspaper search unless the newspaper is omniscient. The procedure must catch this.

