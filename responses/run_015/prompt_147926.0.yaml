answer: |-
  You have the right instincts. You are describing **Nozick's Tracking Theory of Knowledge** (specifically the conditions of *Sensitivity* and *Adherence*), and your worry about inference is the **Principle of Closure** (if I know $P$, and I know $P$ implies $Q$, do I know $Q$?). Epistemologists fight about Closure, but archivists cannot afford to. In an archive, Closure fails. Every inferential step adds risk.

  Here is the procedure. It is designed to be rigid enough to stop arguments but fast enough for volunteers.

  ### The Ten-Minute Claim Procedure

  **Instructions:** Complete one form per distinct factual claim. If a sentence contains two claims (e.g., "The mill burned and the owner fled"), run this twice.

  #### Step 1: The Route (Provenance)
  **Action:** Write the source location in the **Pointer Format**.
  **Rule:** `Type + ID + Location`.
  *   *Good:* `Paper + Gazette-1978-05-01 + p.3 col.2`
  *   *Good:* `Record + Deed-Book-4 + p.112`
  *   *Bad:* `Found in the old newspaper files` (Too loose)
  *   *Bad:* `According to a detailed analysis of the microfiche which showed...` (Too narrative)
  **Pass:** You can point to the ink/pixel.
  **Fail:** You are relying on memory, oral tradition, or a "general sense."
  **Stop:** If Fail, downgrade to **Hedge** ("Tradition holds...") or **Drop**. Do not proceed to Step 2 for a Flat assertion.

  #### Step 2: The Sensitivity Test (Nozick's Condition 3)
  **Action:** Ask: *If this claim were false, would our evidence look exactly the same?*
  *   *Example:* If the mill *didn't* burn, would the 1978 newspaper still have printed that story? (Possible, if they were misinformed).
  *   *Example:* If the swimming hole *wasn't* closed for solvent, would the plaque still be there? (Yes, plaques are often installed based on error).
  **Pass:** No. If the fact were false, the evidence would be different/absent.
  **Fail:** Yes. The evidence is insensitive to the truth (e.g., rumors, uncorrected errors, plaques based on legend).
  **Stop:** If Fail, downgrade to **Hedge** ("Reportedly...").

  #### Step 3: The Inference Check (Closure Limit)
  **Action:** Did you derive this claim from another claim, rather than directly from the source?
  *   *Source:* "Mill burned 1908."
  *   *Claim:* "Mill not operating 1909."
  **Rule:** **One-Step Limit.** You are allowed **one** logical leap that requires no external research (e.g., "Burned" $\rightarrow$ "Destroyed"). You are **not** allowed leaps that require background assumptions (e.g., "Burned" $\rightarrow$ "Not Operating" assumes no immediate rebuild).
  **Pass:** Direct from source OR one trivial logical step (A is B).
  **Fail:** Chain of 2+ steps, or step requires empirical assumption (A implies B, usually).
  **Stop:** If Fail, you must find a new source for the *inferred* claim. If you cannot, downgrade to **Hedge** ("Likely not operating...").

  #### Step 4: The Negative Check (Absence of Evidence)
  **Action:** Is the claim based on *not* finding something? (e.g., "No drownings").
  **Rule:** **Exhaustion Requirement.** You must have searched the *only* place the record would exist.
  **Pass:** You searched the coroner's log (the definitive record).
  **Fail:** You searched the newspaper (which might have missed it).
  **Stop:** If Fail, you cannot assert the negative. Wording must be: "No records found in [Source]," not "Nothing happened."

  #### Step 5: Final Wording Decision
  *   **Flat:** Passed Steps 1, 2, 3, and 4.
  *   **Hedge:** Failed Step 2 (Sensitivity) or Step 3 (Inference) or Step 4 (Negative). Use: "Reportedly," "Records suggest," "Tradition holds."
  *   **Drop:** Failed Step 1 (Route) completely, or the claim is demonstrably false.

  ---

  ### Specific Rules for Your Questions

  **1. The "Route" Granularity Rule**
  You asked how to prevent gaming the description.
  *   **The Rule:** **The Stranger Test.** Could a stranger find the exact document in 5 minutes using *only* the sentence you wrote?
  *   **Why:** Narratives ("We looked through the files...") hide gaps. Coordinates ("Box 4, Folder 2") expose them.
  *   **Can a rule settle it?** Yes. Ban verbs in the Route field. Only Nouns and Numbers.

  **2. The Inference Types (Your "Half-Baked Idea")**
  You asked which of these are the same question. Here is the archive classification:
  *   **One obvious step** (Mill burned $\rightarrow$ Mill destroyed): **Pass.** (Logical entailment).
  *   **One step + background** (Mill burned $\rightarrow$ Mill not operating): **Fail.** (Empirical assumption: could be rebuilt).
  *   **Chain of four steps:** **Fail.** (Risk compounds).
  *   **Stitched knowledge** (Volunteer A knows X, Volunteer B knows Y, therefore Z): **Fail.** (This is hearsay unless written down).
  *   **Nobody recorded it $\rightarrow$ It didn't happen:** **Fail.** (This is the Negative Check, Step 4).

  *Your Sensitivity Idea:* "If this step were a bad one, would we still have taken it?"
  *   **Verdict:** This is correct. It is the Sensitivity Test applied to logic. If you would have made the inference even if it were wrong (because you were lazy or assumed too much), the inference is unsafe.

  **3. Judgment Calls Wearing a Clipboard**
  *   **Step 2 (Sensitivity):** Deciding if a source *would* change if the fact were false is a guess. (e.g., Would a 1978 reporter *really* have checked the 1908 fire date?) *Mark this as [JUDGMENT] on the form.*
  *   **Step 3 (Triviality):** Deciding if an inference is "one trivial step" or "requires background" is subjective. *Mark this as [JUDGMENT].*
  *   **Step 4 (Exhaustion):** Deciding if a newspaper is the "definitive record" for drownings. *Mark this as [JUDGMENT].*

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: The Mill (1908 Fire $\rightarrow$ 1909 Closed)
  *   **Step 1 (Route):** `Paper + Gazette-1978-05-01 + p.3`. **Pass.** (For the fire).
  *   **Step 2 (Sensitivity):** If the mill didn't burn, would the 1978 paper say it did? Maybe (historical error). **Hedge recommended for the fire date**, but let's assume the paper is reliable for this exercise. **Pass.**
  *   **Step 3 (Inference):** Claim: "Not operating 1909." Source says "Burned 1908."
      *   Is "Burned $\rightarrow$ Not Operating" one trivial step? No. Mills were often rebuilt within months. This requires background knowledge of reconstruction speed. **Fail.**
  *   **Step 4 (Negative):** N/A.
  *   **Result:**
      *   "The mill burned in 1908." $\rightarrow$ **Flat** (citing 1978 paper).
      *   "The mill was not operating in 1909." $\rightarrow$ **Hedge** ("Likely not operating," or "Records indicate a halt in operations").
      *   *Correction:* To go Flat on 1909, you need a 1909 tax record or directory showing no activity.

  #### Case 2: The Swimming Hole (1974 Solvent)
  *   **Step 1 (Route):** `Oral + Town Consensus + Plaque`. **Fail.** (Cannot point to ink).
      *   *Immediate Downgrade:* Cannot be Flat.
  *   **Step 2 (Sensitivity):** If the plant *didn't* dump solvent, would the plaque still be there? Yes. If the plant didn't dump, would everyone still *believe* it? Yes (rumors persist). **Fail.**
  *   **Result:** **Hedge** or **Drop**.
      *   *Wording:* "Local tradition states the swimming hole closed due to solvent dumping in 1974." (This archives the *belief*, not the *fact*).
      *   *Why:* You noted: "if it were false we would all still believe it exactly as hard." That is the definition of an Insensitive belief. It cannot be archived as fact.

  #### Case 3: The Drownings (No mention in paper $\rightarrow$ Nobody drowned)
  *   **Step 1 (Route):** `Paper + Gazette-Summer-Issues + All`. **Pass.**
  *   **Step 2 (Sensitivity):** If someone *did* drown, would the paper mention it?
      *   *Judgment:* In a small town, usually yes. But if it was a visitor or ruled an accident, maybe not. **Weak Pass.**
  *   **Step 4 (Negative):** Is the newspaper the *only* place a drowning would be recorded? No. (Coroner, hospital, police, family Bibles). **Fail.**
  *   **Result:** **Hedge**.
      *   *Wording:* "No drownings were reported in the local press during the summer of [Year]."
      *   *Forbidden:* "Nobody drowned in the river." (You cannot prove a universal negative with a single source).

  ---

  ### The One-Page Wall Chart

  *(Print this. Tape it over the scanner.)*

  # ARCHIVE CLAIM CHECKLIST
  **Time Limit:** 10 Minutes per claim. **One Claim per Sheet.**

  **1. THE ROUTE (Provenance)**
  *   [ ] Can I write the source as `Type + ID + Location`? (e.g., `Deed + Book 4 + p.12`)
  *   [ ] Could a stranger find it in 5 minutes using only that string?
  *   **NO?** $\rightarrow$ Stop. Wording: *"Tradition holds..."* or Drop.
  *   **YES?** $\rightarrow$ Continue.

  **2. THE SENSITIVITY TEST (Truth Tracking)**
  *   [ ] If this claim were **FALSE**, would our evidence look **DIFFERENT**?
  *   (e.g., If no fire occurred, would the newspaper *not* have printed the story?)
  *   **NO?** (Evidence stays the same even if fact is false) $\rightarrow$ Stop. Wording: *"Reportedly..."*
  *   **YES?** $\rightarrow$ Continue.

  **3. THE INFERENCE CHECK (Closure)**
  *   [ ] Is this claim **directly** in the source?
  *   [ ] OR, is it **one** logical step away? (e.g., "Died" $\rightarrow$ "Dead")
  *   [ ] Does it require assuming background facts? (e.g., "Burned" $\rightarrow$ "Closed")
  *   **REQUIRES ASSUMPTION?** $\rightarrow$ Stop. Wording: *"Likely..."* or Find new source.
  *   **DIRECT / ONE STEP?** $\rightarrow$ Continue.

  **4. THE NEGATIVE CHECK (Absence)**
  *   [ ] Is this claim based on *not* finding a record? (e.g., "No deaths")
  *   [ ] Did we search the **ONLY** place this would be recorded? (e.g., Coroner, not just Paper)
  *   **NO?** $\rightarrow$ Stop. Wording: *"No records found in [Source]."*
  *   **YES?** $\rightarrow$ Continue.

  **5. FINAL WORDING**
  *   [ ] **FLAT:** Passed all boxes. (e.g., "The mill burned in 1908.")
  *   [ ] **HEDGE:** Failed Step 2, 3, or 4. (e.g., "Reportedly," "Likely," "No records found.")
  *   [ ] **DROP:** Failed Step 1 completely.

  **[JUDGMENT CALLS]**
  *If you checked a box but feel unsure, initial here: _______*
  *If 2 of 3 volunteers initial, claim must be Hedged.*
