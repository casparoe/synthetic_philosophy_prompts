answer: |-
  This is a fantastic framing. Treating calculus as a protocol stack and the priority dispute as a standards war cuts through the historical noise better than most philosophy of science texts.

  Here is the analysis of the Newton-Leibniz dispute through the lens of **Scientific Inevitability** and **Open-Source Architecture**.

  ### 1. The System Architecture: Players and Nodes

  In your software model, the "problem space" (physics, geometry, motion) had reached a point where the existing libraries (Euclidean geometry, algebra) were throwing errors. The system needed an upgrade to handle continuous change.

  *   **Isaac Newton (The Closed-Source Maintainer):**
      *   **Build:** Developed "fluxions" (`\dot{x}`) around 1666.
      *   **Strategy:** Private repo. He treated math as a tool for physics, not a public good. He feared controversy ("I was bullied by my own discoveries").
      *   **API:** Optimized for time-based mechanics. Hard to compose for general problems.
  *   **Gottfried Wilhelm Leibniz (The Open-Source Architect):**
      *   **Build:** Developed differential calculus (`dx/dy`) around 1675 (independently).
      *   **Strategy:** Public release. Published papers in 1684. Actively recruited contributors.
      *   **API:** Optimized for symbolic manipulation. `dy/dx` looks like a fraction, making the Chain Rule intuitive algebra. High interoperability.
  *   **The Bernoulli Brothers (The Community Contributors):**
      *   **Role:** Early adopters. They read Leibniz's obscure paper, reverse-engineered it, and built the standard library.
      *   **Impact:** They proved the API was extensible. They solved problems Newton couldn't easily solve with fluxions.
  *   **The Royal Society (The Standards Body):**
      *   **Role:** Governing committee for scientific priority.
      *   **Conflict of Interest:** Newton was the President. The committee investigating the theft accusation was stacked with Newton's allies. Newton even wrote the anonymous report concluding he was the victim.

  ### 2. The Inevitability Theory: Prediction vs. Reality

  **The Theory:** When the intellectual infrastructure is ready, discovery is a function of time, not personality. $P(discovery) \to 1$ as $t \to t_{ripe}$.

  **The Prediction:**
  1.  **Redundant Development:** Multiple actors should arrive at the core logic independently.
  2.  **Convergence:** The community should merge the implementations quickly to maximize utility.
  3.  **Credit Irrelevance:** Since the logic was "in the air," specific credit should be secondary to adoption.

  **The Reality:**
  1.  **Redundant Development (PASS):** Newton and Leibniz definitely built the core logic independently. The math was too similar to be coincidence, but the timelines show no direct theft of the *core engine*. Inevitability holds here.
  2.  **Convergence (FAIL):** Instead of merging, the community forked. Britain used Newton's notation; Europe used Leibniz's.
  3.  **Credit Irrelevance (FAIL):** Credit became the bottleneck. The dispute consumed decades of bandwidth.

  **Where the Theory Breaks:**
  Inevitability explains the *invention*, but it fails to model the *deployment*. It assumes rational actors who want to optimize the system. It does not account for **ego as latency**. Newton didn't want the best protocol to win; he wanted *his* protocol to win. The Royal Society commission wasn't auditing code; it was engaging in corporate espionage to protect the President's IP.

  ### 3. The API War: Notation as User Experience

  This is where your software framing shines. The math (the backend logic) was effectively identical. The notation (the frontend API) was different.

  *   **Newton's `fluxions` (`\dot{y}`, `\dot{x}`):**
      *   **Pros:** Clean for physics (derivatives with respect to time).
      *   **Cons:** Terrible UX for higher-order calculus. Hard to read. Hard to scale.
      *   **Adoption:** Locked to the "British Server."
  *   **Leibniz's `differentials` (`dy/dx`):**
      *   **Pros:** Syntactic sugar that behaves like algebra. You can visually cancel terms. Easy to extend to multi-variable calculus.
      *   **Cons:** Philosophically shaky at the time (what *is* an infinitesimal `dx`?), but functionally robust.
      *   **Adoption:** Continental Europe.

  **The Consequence of the Fork:**
  Because Britain stuck with Newton's proprietary notation (due to nationalism and the Royal Society's ruling), British mathematics incurred massive **technical debt**. While the Bernoullis and Euler were building complex structures on Leibniz's clean API on the continent, British mathematicians were struggling with clunky syntax.

  For over 100 years, the "British Network" was slower than the "Continental Network." The inevitability of the *math* didn't guarantee the efficiency of the *implementation*.

  ### 4. The "Routing Label" Question

  You asked: *If the underlying math was genuinely redundant, does it matter that Leibniz published first but Newton had the notation? Or does the who just become a routing label?*

  **The Verdict:** The "who" became a **firewall**.

  In an ideal open-source world, the best API wins regardless of the author. But science runs on human nodes.
  *   **Leibniz published first:** In open source, this usually grants "Maintainer" status.
  *   **Newton had the prestige:** In academia, this grants "Admin" rights.

  Because Newton used his Admin rights to claim Leibniz was a plagiarist, the network split.
  *   **If the "who" is just noise:** The system should have auto-merged the branches.
  *   **Because the "who" is signal:** The system partitioned.

  The legacy isn't just which API became standard (Leibniz's won globally, eventually even in Britain), but that the **priority dispute slowed down the global rollout.** The drama wasn't just noise; it was packet loss.

  ### 5. Does Inevitability Survive the Drama?

  **Yes, but only as a backend truth, not a frontend history.**

  1.  **The Core Logic was Inevitable:** If Newton and Leibniz both died in the womb, calculus likely appears within 20 years via the Bernoullis or Huygens. The problem was ripe. The "protocol" was waiting to be written.
  2.  **The History was Contingent:** The specific timeline, the notation wars, and the century-long stagnation of British math were *not* inevitable. They were caused by specific human variables (Newton's insecurity, Leibniz's desire for recognition, the Royal Society's corruption).

  **The Engineering Takeaway:**
  Inevitability theory assumes science is a **single-player game** against nature. It posits that if you solve the puzzle, the puzzle is solved.

  The Newton-Leibniz dispute proves science is a **multi-player network**.
  *   **Discovery** is finding the truth (Inevitable).
  *   **Progress** is propagating the truth (Contingent).

  Newton proved that a single bad actor with enough privilege (President of the Royal Society) can fork the community and degrade overall system performance, even if the underlying code (calculus) is robust.

  **Final Answer:**
  The inevitability theory survives contact with the drama only if you restrict it to the **existence** of the mathematics. It completely collapses when applied to the **adoption** of the mathematics.

  The "who" is not just a routing label; in a human network, the "who" determines the routing path. Newton's ego forced the data through a suboptimal route (British fluxions) for a century. Leibniz's API was better, but it had to wait for the "Newton Server" to go offline before it could be fully integrated globally.

  So, the math was destiny. The history was a bug.
