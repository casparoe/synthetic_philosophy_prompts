  4.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the engineer's framing. It's a strong analogy. Set the stage: Calculus as the TCP/IP of physics.

      *   **The Players & Their Roles (System Architecture):**
          *   *Newton:* The solo dev who built the core in a closed repo. Hoarded code.
