answer: |-
  **1. Joint Commitments**

  1.  **Purpose:** The concept of disease must distinguish conditions warranting medical attention from normal variations, guiding resource allocation and intervention.
  2.  **Paradigms:** Metastatic cancer and influenza are diseases; high IQ and pregnancy are not. Both sides accept these anchors.
  3.  **Function:** Biological function is fixed by evolutionary history (selected effect), but operational success is assessed in the current environment.
  4.  **Reference Class:** Classes are age/sex-specific, but the "normal environment" is part of the functional context, not merely the organism's internal state.
  5.  **Honesty:** Both sides agree to identify cases where their definition yields counterintuitive results regarding treatment or stigma.

  **2. Disagreements**

  | Issue | Side N (Naturalist) | Side V (Normativist) | Real or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Constitutive Harm** | Harm is a contingent consequence, not a definition. A condition can be a disease without current harm. | Harm ("bad for the bearer") is essential. Without harm, there is no disease. | **Real.** Determines classification of harmless deviations (e.g., asymptomatic genetic variants). |
  | **Statistical Normality** | Statistical deviation from species-typical functioning is a necessary condition. | Statistics are heuristic only. A statistically normal condition can be a disease if harmful. | **Real.** Determines classification of harmful norms (e.g., age-related decline, common allergies). |
  | **Locus of Dysfunction** | Dysfunction must be internal (physiological/psychological mechanism failure). | Dysfunction can be relational (mismatch between organism and environment/society). | **Real.** Determines classification of environmental mismatches and social stigma cases. |

  **3. Cruxes and Case Analysis**

  | Crux | Bearing Case | Side N Prediction | Side V Prediction | Mind-Changer |
  | :--- | :--- | :--- | :--- | :--- |
  | **Harmless Deviation** | **Three-Hour Sleepers:** Heritable, statistically rare, no functional deficit, increased longevity. | **Not Disease.** Functional efficiency is high; statistical rarity alone is insufficient. | **Not Disease.** No harm to bearer; benefit exists. | **N:** If sleep reduction causes latent cellular decay undetectable by current batteries. **V:** If society coerces them to sleep more, creating harm. |
  | **Harmful Normal** | **Anachronistic Allergy:** Immune system functions to spec; harm arises from synthetic proteins in modern environment. | **Not Disease.** Internal mechanism operates within species-typical parameters. | **Disease.** Condition is significantly harmful to the bearer's welfare. | **N:** If "normal environment" is redefined to include current industrial chemistry. **V:** If harm is shown to be trivial vs. major life-plan disruption. |
  | **Vestigial Loss** | **Arrector Variant:** Missing reflex, no thermoregulatory impact in clothed population. | **Not Disease.** No loss of functional contribution to survival/reproduction. | **Not Disease.** No harm incurred. | **Fake Crux.** Both agree. Reveals consensus that function loss without welfare loss is not disease. |
  | **Social Harm** | **Stigmatized Condition:** Internal function normal; harm arises solely from societal reaction (e.g., historical homosexuality). | **Not Disease.** Internal mechanisms intact; harm is external/social. | **Disease (Qualified).** If harm limits life plans, it qualifies, though etiology is social. | **N:** If internal stress response causes physiological dysfunction. **V:** If distinguishing "social" vs "medical" harm proves impossible in practice. |

  **4. Treatment-Tracking and Semantics**

  **The Treatment-Tracking Test**
  We separate the question "Is it a disease?" from "Should the health system pay for treatment?"

  *   **Three-Hour Sleepers:** Both say **No** to treatment. No divergence.
  *   **Anachronistic Allergy:** **Divergence.** Side V says **Yes** (it is a disease). Side N says **Yes** (it is harmful), but labels it **Not Disease**. Side N decouples treatment from disease status more comfortably, arguing medical systems should treat harmful conditions regardless of biological malfunction. This costs N the intuitive link between "disease" and "medical priority."
  *   **Arrector Variant:** Both say **No** to treatment. No divergence.
  *   **Stigmatized Condition:** **Divergence.** Side N says **No** to medical payment (social solution required). Side V says **Yes** (harm is real, bearer needs help). Side V couples harm to entitlement, risking the medicalization of social prejudice. Side N risks denying care to suffering individuals by withholding the "disease" label.

  **Verbal vs. Real Dispute**
  Is this debate merely about words?
  *   **Verbal Component:** Yes. Side N uses "disease" as a *theoretical/explanatory* term in physiology (mechanism failure). Side V uses "disease" as a *clinical/institutional* term for triage and legitimation (harm warranting care).
  *   **Residual Real Fight:** No. The dispute is not merely lexical; it is political and administrative.
      1.  **Authority:** Who decides? If N wins, biologists/physicians define coverage based on mechanisms. If V wins, patients/policymakers define coverage based on suffering.
      2.  **Resource Allocation:** In the **Allergy** case, N must justify funding for a "non-disease." V justifies it automatically but risks inflating the category until resources dilute.
      3.  **Stigma:** In the **Social Harm** case, N protects the "disease" label from social politics but may abandon victims. V protects victims but risks labeling social dissent as pathology.

  **Conclusion on Semantics:** The fight is over which function the word "disease" should serve in public policy. Side N prioritizes scientific objectivity to prevent over-medicalization. Side V prioritizes patient welfare to prevent under-treatment. Settling the definition will not resolve the allocation conflict; it merely shifts the burden of justification from "proving harm" (V) to "proving malfunction" (N). The **Allergy** case is the strongest wedge: N must admit health systems treat non-diseases, while V must admit some harmful conditions (e.g., poverty) are not diseases. Both sides concede ground here, suggesting a hybrid model where "disease" tracks malfunction, but "coverage" tracks harm.
