prompt: |-
  hey — I need the joint statement for an adversarial collaboration I'm trying to set up between two people who've been sniping at each other for years about what disease even is. Side N is a naturalist in the biostatistical vein: disease is statistically subnormal functioning of a part or process relative to a reference class, health is species-typical functional ability, and value judgments enter only when we decide what to do about it. Side V is a normativist: "bad for the bearer" is inside the concept, not a extra criterion bolted onto a value-free core.

  Assume they've agreed to be honest about which cases are uncomfortable for them. What I want back:

  1. A numbered section of claims both can sign — about what the concept is supposed to do, about the easy paradigm cases, about how "function" is to be fixed (and whether selected-effect, causal-role, and "current contribution to survival and reproduction" ever come apart in a way that matters here), and about how the reference class is specified once you let environment in.

  2. A disagreements table. Columns: a neutral one-line statement of what's at issue / the formulation Side N would sign / the formulation Side V would sign / real or merely verbal, and why. If a formulation comes out so thin that neither side could deny it, throw it out and write a sharper one.

  3. A cruxes table. For each crux: the crux itself, the case or argument both agree would bear on it, Side N's prediction about that case, Side V's prediction, and what each side says would actually change its mind. Please also flag any crux that's a fake crux — one where settling it wouldn't move either party anyway — and say what that reveals about the debate.

  Run everything through these four cases (I made them up, sharpen them if they're mushy):

  - the three-hour sleepers: a heritable variant; carriers sleep about three hours a night, score at or above population mean on every test battery anyone has run, and live longer on average. Statistically way out on the tail, no detectable cost, apparently a benefit. I suspect this one separates them less than either expects — say if I'm right and why.
  - the anachronistic allergy: an immune system operating exactly to spec, mounting a textbook response to a synthetic protein that's now in most packaged food. Real harm, zero deviation from normal function, and the harm exists only because of what's in the environment now.
  - the arrector variant: people born without a vestigial reflex that does nothing measurable for thermoregulation in a clothed population and does something you can measure when they're cold and naked.
  - the old case where a condition gets classified as a disorder largely because of how other people react to the person who has it. Each side should say what its account predicts there and whether it treats that as a point in its favor or as an embarrassment.

  Two things I want handled explicitly rather than gestured at. First, the treatment-tracking test: for each case, answer separately "is it a disease?" and "should the health system pay for treating it at public expense?" Where the two answers come apart, say which side decouples them more comfortably and what that costs it. Second, whether any of the dispute is just about words — a theoretical/explanatory use of "disease" in physiology versus a clinical/institutional one used for triage, coverage, and legitimation. If part of it is verbal, say which part, and then say what the residual real fight is.

  I don't need names, dates or citations — I care whether the formulations are things each side could actually put their name to. Keep the whole document under ~1200 words.
