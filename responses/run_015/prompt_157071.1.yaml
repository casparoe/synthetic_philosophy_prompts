answer: |-
  **Scenario Selection**
  I considered a pharmaceutical Phase III trial (dropped: base rates are notoriously pessimistic there, hard to flip), and a restaurant franchise expansion (dropped: failures are visible via empty storefronts, weakening survivorship bias). I selected a hospital EHR migration because failed implementations vanish into private consultancy reports, creating a clean survivorship bias where the visible reference class is structurally rosy.

  **(1) The Scenario**
  A regional hospital network is migrating to a new Electronic Health Record (EHR) system. The vendor provides a portfolio of "Peer Implementations," all showing go-live within 14 months. The internal IT Director, however, knows the legacy data is unstructured across three incompatible databases and nursing staff are already unionizing against workflow changes. The Director estimates 36 months with high risk of abortive failure. The vendor's reference class suggests a smooth 14-month transition. The hospital originally selected this vendor precisely because their marketing materials matched the hospital's self-perception as "technically ready," gerrymandering the reference class toward success stories that share the hospital's optimism but not their technical debt.

  **(2) The Check**
  **Proposition:** Time to full operational capability.
  **Inside View:** 36 months or failure. Route: Direct inspection of the legacy data schema and labor relations. The estimator sees specific friction points (data cleaning, union resistance) that guarantee delay.
  **Outside View:** 14 months. Class: Vendor's "Successful Peer Implementations."
  **Why:** The OV lands on 14 months because the reference class is curated; it excludes projects that stalled or were cancelled before go-live. The IV lands on 36 months because it accounts for the specific rot that prevents the project from joining the "successful" class in the first place. The OV is systematically optimistic because the population it samples from is defined by survival.

  **(3) Honest Note**
  The load-bearing feature is **survivorship bias in the reference class**. The published cases are survivors; the failures are silent. If you remove this—say, by making all attempt outcomes public—the OV immediately becomes pessimistic again, likely exceeding the IV's caution. The gerrymandering (selecting a vendor because you think you match their success stories) is secondary; it amplifies the error but isn't the root cause.
  **Strongest OV Defender Reply:** "Then use the reference class of *all* attempted migrations, not just successful ones."
  **Does it work?** No, not practically. That data is proprietary and hidden. To construct that corrected class requires an inside-view investigation into the vendor's private failure logs. You cannot access the "true" base rate without doing the specific legwork the Outside View is supposed to bypass. The defender is smuggling inside-view judgment back in through the choice of class definition.

  **(4) Cheating Note**
  The construction is closest to cheating where I stipulate the IT Director is **competent**. I assumed the IV estimator correctly identifies the debt and isn't just sandbagging. If the Director is overconfident or politically motivated, the IV fails, and the OV (even if optimistic) might be statistically safer.
  **The Flip:** Change the recording practice. If the hospital were required to log progress milestones to a neutral regulator publicly (like aviation safety data), failures would leave traces.
  **Size of Change:** Large institutional shift. It requires moving from private vendor-client contracts to transparent industry reporting. Once failures are visible, the reference class corrects itself, the OV becomes pessimistic (reflecting the true failure rate), and the standard heuristic ("trust the base rate") is restored. Until then, the IV is the only tool seeing the graveyard.
