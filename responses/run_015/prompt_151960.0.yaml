      *   *Wait, I need to make definite architectural choices.* A full factorial tree is too big. I need to prune.
      *   *Decision:* I will prioritize the *Ontological Status of Continuity* over the *Physical Substrate*. The Neuron question is a proxy for "Is continuity real?"
