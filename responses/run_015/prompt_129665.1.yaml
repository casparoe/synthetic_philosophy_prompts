      *   **Round 1:**
          *   *Sarah (Historian):* Launches the analogy. The *Gedanke* is like the Nation/State. It exists independently of us, we must submit to its laws.
          *   *Mark (Logician):* Pushes back. Logic is normative, yes, but not political. Truth conditions don't care about your voting record.
      *   **Round 2:**
          *   *Sarah:* It's not about voting, it's about the *structure* of authority. The way he bans the psychological from logic is the same way he wants to ban the individual from the Volk. It's a "third realm" that demands obedience.
          *   *Mark:* But the "third realm" is justified by the need for shared communication and science, not blood and soil. You're conflating the *justification* for objectivity with the *mechanism* of objectivity.
      *   **Round 3 (The Concession):**
