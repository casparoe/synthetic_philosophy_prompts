answer: |-
  # Futarchy Proposal Intake Protocol (FPIP-v4)
  **Owner:** Governance Architecture Office
  **Execution Time:** 45 Minutes (Strict)
  **Purpose:** To filter committee decisions proposed for conversion to prediction-market governance. This protocol ensures the mechanism is technically viable and does not outsource normative authority to capital.

  ## Phase 1: The Five-Gate Procedure

  **Instructions:** The Analyst must proceed sequentially. A "Fail" at any Hard Stop terminates the proposal immediately. A "Refer" triggers escalation to the Values Committee. Do not proceed to the next gate until the current gate is cleared.

  ### Gate 1: Value vs. Instrumentality (5 Minutes)
  *   **Question:** Is the proposed metric a terminal value explicitly ratified by the consortium charter, or is it an instrumental proxy for a deeper good?
  *   **Pass Condition:** The metric is a charter-ratified terminal value (e.g., "Net Research Output") OR the metric is an instrumental proxy where the terminal value is uncontested (e.g., "Cost Reduction" where surplus is returned to members).
  *   **Hard Stop:** The metric is a proxy for a contested value (e.g., "Reputation," "Ethical Alignment") without prior charter agreement on what that proxy signifies.
  *   **Escalation Trigger:** The proposal attempts to *define* the consortium's primary value through the market mechanism rather than *maximizing* an existing one.
  *   **[JUDGMENT REQUIRED]:** Analyst must determine if the metric is truly "uncontested" among stakeholders.

  ### Gate 2: Resolution Integrity (10 Minutes)
  *   **Question:** Can the metric be measured objectively *after* the decision is implemented, without reliance on data inputs that market participants can influence?
  *   **Pass Condition:** Data sources are external, automated, or audited by a third party independent of the betting pool.
  *   **Hard Stop:** The measurement of the outcome relies on self-reporting, surveys, or subjective assessment by individuals who are eligible to trade in the market. (Prevents bettors from manipulating the resolution to win wagers).
  *   **Escalation Trigger:** The metric requires qualitative interpretation that varies by observer (e.g., "Quality of Hire").
  *   **[JUDGMENT REQUIRED]:** Analyst must assess the independence of the data oracle.

  ### Gate 3: Counterfactual Contamination (10 Minutes)
  *   **Question:** Does the act of betting on this outcome alter the probability of the outcome occurring, independent of the decision itself?
  *   **Pass Condition:** Market activity is confidential until resolution, or the market volume is too small to influence the real-world variable (e.g., flood levels, vendor server logs).
  *   **Hard Stop:** Public market positions signal intent to external actors who can change the outcome (e.g., betting on "Regulatory Approval" signals lobbyists to intervene).
  *   **Escalation Trigger:** The metric is sensitive to public perception that the market itself generates (e.g., "Stock Price," "Public Trust Score").
  *   **[JUDGMENT REQUIRED]:** Analyst must estimate the market's potential liquidity relative to the sensitivity of the metric.

  ### Gate 4: Goodhart Resilience (10 Minutes)
  *   **Question:** If stakeholders optimize specifically for this metric to win bets, does it harm the organization's broader mission?
  *   **Pass Condition:** Optimization for the metric aligns with or is neutral to the broader mission.
  *   **Hard Stop:** Optimization for the metric creates perverse incentives that degrade unmeasured critical functions (e.g., "Speed of Publication" leading to fraud).
  *   **Escalation Trigger:** The trade-off between the metric and unmeasured values is significant but ambiguous.
  *   **[JUDGMENT REQUIRED]:** Analyst must simulate second-order effects of aggressive optimization.

  ### Gate 5: Liquidity & Expertise (10 Minutes)
  *   **Question:** Is there a identifiable class of traders with both capital and superior information regarding this specific outcome?
  *   **Pass Condition:** A specific sector (e.g., insurers, vendors, engineers) has profit incentives to know this truth and capital to wager.
  *   **Hard Stop:** The outcome is fundamentally unknowable until it happens, or the only experts are prohibited from trading (e.g., internal staff with insider information).
  *   **Escalation Trigger:** Expertise exists but capital is concentrated in a single stakeholder group, risking market cornering.
  *   **[JUDGMENT REQUIRED]:** Analyst must verify the existence of external experts not bound by insider trading policies.

  ***

  ## Phase 2: Proposal Evaluation

  ### Proposal (a): Climate-Adaptation Infrastructure Grants
  *   **Metric:** Ten-year flood-damage reduction in dollars.
  *   **Gate 1 (Value):** Pass. Financial loss reduction is a standard, uncontested instrumental value for infrastructure spending.
  *   **Gate 2 (Resolution):** Pass. Damage assessments are conducted by independent insurance adjusters and federal agencies, not consortium staff.
  *   **Gate 3 (Contamination):** Pass. Betting volumes will be negligible compared to the physical reality of flood plains.
  *   **Gate 4 (Goodhart):** Pass. Reducing flood damage aligns with the mission. No obvious way to "game" flood waters.
  *   **Gate 5 (Liquidity):** Pass. Reinsurance companies and civil engineering firms possess the requisite models and capital.
  *   **Result:** **APPROVED FOR FUTARCHY PILOT.**

  ### Proposal (b): Mandatory Negative-Results Publication Policy
  *   **Metric:** Five-year peer-reputation index.
  *   **Gate 1 (Value):** **ESCALATION TRIGGERED.**
  *   **Analysis:** "Peer-reputation" is not a terminal value ratified by the charter; it is a proxy for "Scientific Integrity" or "Community Standing." Different stakeholders define reputation differently (e.g., volume of citations vs. rigor of methodology). Using a market to maximize "reputation" effectively allows capital to define what "good science" means.
  *   **Gate 2 (Resolution):** **HARD STOP CONDITION MET (Secondary).** Even if Gate 1 passed, the "Index" likely relies on surveys of peers. If those peers can bet, they will manipulate survey responses to settle markets.
  *   **Result:** **ESCALATED TO VALUES COMMITTEE.**
  *   **Why Sponsor Preference Cannot Override:** The sponsor may argue that reputation is the only thing that matters. However, the FPIP Gate 1 Hard Stop exists because futarchy is an *empirical* tool for maximizing *given* values. It cannot resolve *which* values should be maximized. Allowing this proposal bypasses the democratic/charter process for defining institutional mission and hands it to speculators. If the metric is normative, the market price reflects power, not truth.

  ### Proposal (c): Internal Data-Platform Vendor Procurement
  *   **Metric:** Two-year system-downtime hours.
  *   **Gate 1 (Value):** Pass. Uptime is an instrumental good for research continuity.
  *   **Gate 2 (Resolution):** Pass. Server logs are automated and cryptographically verifiable.
  *   **Gate 3 (Contamination):** Pass. Vendors cannot alter historical logs based on market prices.
  *   **Gate 4 (Goodhart):** Pass. Minimizing downtime is the goal. Risk of vendors rejecting complex tasks to stay online is manageable via SLA definitions.
  *   **Gate 5 (Liquidity):** Pass. IT auditors and competitor vendors have insight into stability risks.
  *   **Result:** **APPROVED FOR FUTARCHY PILOT.**

  ***

  ## Phase 3: Structural Limitations

  Regardless of data quality or market liquidity, this procedure is structurally unsuited for the following two classes of institutional decision:

  **1. Deontological Constraints (Rights and Ethics)**
  Futarchy is consequentialist; it selects actions based on predicted outcomes. It cannot process decisions where an action is prohibited *regardless* of the outcome. For example, a proposal to "Sell participant data" cannot be evaluated by a metric of "Revenue Generated," even if the prediction market is highly liquid. The procedure lacks a gate for moral veto rights because futarchy assumes all values can be commensurated into a single metric. Decisions involving human rights, privacy mandates, or ethical red lines must remain in committee governance.

  **2. Non-Recoverable Existential Risks**
  Futarchy relies on resolution to validate the market's predictive accuracy and pay out bets. For decisions where a failure mode results in the termination of the consortium (e.g., "Accept funding from a sanctioned entity" where the risk is loss of legal charter), there is no post-decision state in which to resolve the market. If the negative outcome occurs, the organization ceases to exist, and the metric cannot be measured. The feedback loop required for futarchic learning is broken by the finality of the risk.

  ***

  **Architect Sign-off:**
  *Procedure Validated.*
  *Judgment Markers Embedded.*
  *Escalation Pathways Defined.*
