prompt: |-
  My friend and I have been arguing about the levels of selection for close to two years now (it started as a book club on Dawkins and, well, here we are), and we finally decided to do the grown-up thing where you write down what you'd both actually sign. He's basically a Dawkins-style gene selectionist — the gene as the only real unit of selection, and talk of organisms or groups being selected is just bookkeeping about which vehicles happen to be convenient to describe. I lean multilevel selection — I think there are real cases, like colonies or traits that only pay off via group-level competition, where the group is genuinely what's competing and it's not just a different way of slicing the same causal story. We each privately think the other is confusing statistics with metaphysics, and I suspect a good chunk of our fights have secretly been about the words "unit" and "for".

  Write the joint statement we should come out of this with. I want a numbered section of claims we could genuinely both sign — things about the Price equation, about the fact that the same biological case can be decomposed into between-group and within-group components, about what selection needs in order to operate at all, whatever common ground you think is actually there and not just diplomatic mush. Then the disagreements, each one stated so that he'd accept the wording of his own side and I'd accept mine — and underneath those, the cruxes. I suspect one is whether the between/within partition tracks real causal processes or is just an accounting choice; another might be whether the thing that "does the selecting" has to be the thing that replicates; possibly another about whether proving that multilevel selection and kin-selection style models are mathematically equivalent settles anything at all. For each crux, give a case, piece of evidence, or argument we'd both agree bears on it, with his prediction and mine written down in advance — this could be a real-ish biological scenario like a sex-ratio distorter or an altruistic colony trait, or a thought experiment where we control group composition in a lab population. And if you think part of our dispute is purely verbal, say which part and why — but don't be quick about it, because he thinks the whole thing is verbal and I think the verbal part is exactly where the interesting metaphysics hides.

  Format it as the numbered agreed-claims section followed by a disagreements table, one row per crux with our two predictions as separate columns. We're going to read this aloud to each other and object line by line, so please also flag honestly where your draft is most likely slanted — where you had to guess at wording one of us would push back on — and what argument or consideration would make you re-cut the line between the verbal and the substantive parts of our disagreement. If some crux turns out to have no case or evidence we'd both accept as bearing on it, say that too rather than inventing a test neither of us would really trust.
