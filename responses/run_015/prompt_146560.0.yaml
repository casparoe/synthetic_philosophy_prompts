      *   *Web of Belief:* Central claims (logic, math, fundamental physics) are hard to change. Peripheral claims (observation statements) change easily. Moral claims? Quine sees them as far out on the periphery, more about social convention and practical utility than empirical truth conditions.
      *   *The Error:* Treating a moral claim ("We ought to do X") as if it has the same empirical warrant as a scientific claim ("X causes Y"). This is smuggling normativity into descriptivity.
      *   *The Procedure:* Needs to separate the *empirical core* (what the data says) from the *normative periphery* (what we should do about it).

