answer: |-
  Your intuition is spot on. This isn't just a moral quibble about "lying is bad"; it is a structural problem about how political power is generated and sustained. Your friend is operating under a specific theory of power (performative creation), but she is overlooking the *epistemic infrastructure* required for collective action to function.

  Here is a breakdown of why this strategy is likely to fail, not just morally, but mechanically, drawing on political theory and organizational dynamics.

  ### 1. The Arendtian Problem: Destroying the Common World
  The political philosopher Hannah Arendt wrote extensively about the relationship between truth and politics. She distinguished between **rational truth** (philosophical/mathematical) and **factual truth** (things that happened).

  Arendt argued that factual truth is the ground upon which we stand to debate opinions. If you destroy factual truth, you don't just lie; you remove the "common world" that allows people to act together.
  *   **The Friend's View:** "Politics is about creating reality." She sees facts as clay to be molded toward a desired outcome.
  *   **The Reality:** Politics is about negotiating *shared* reality. If the tenants organize based on a premise that is falsifiable (e.g., court records showing no eviction notices were filed), the "common world" fractures. Half the building might believe the lie, half might check the records. Now you don't have a union; you have two factions with different realities. You cannot coordinate action if you cannot agree on the basic state of affairs.

  ### 2. Trust as Currency
  In community organizing, trust is the primary currency. It is not infinite; it is depletable.
  *   **High-Trust Organizing:** "The landlord is threatening us, and here is the evidence. We need to prepare."
  *   **Low-Trust Organizing:** "The landlord has already evicted half of us (lie). We need to prepare."

  If the tenants discover the lie (and legal filings are public record, so they likely will), the organizer loses credibility instantly. It's not just that they lied about *this*; it's that they demonstrated they view the tenants as means to an end, not partners in a struggle.
  *   **The "Boy Who Cried Wolf" Effect:** If the union cries "eviction" when there is none, the next time the landlord *actually* files notices, the tenants may assume it's another bluff. This leaves the building vulnerable to the actual threat.

  ### 3. The "Retroactive Truth" Fallacy
  Your friend argues: *"If we win, the lie becomes true in retrospect—there never was an eviction."*

  This is a dangerous historical fallacy.
  *   **Outcome vs. Process:** Winning (stopping the eviction) does not erase the *method* used. The history of the organization will include the fact that the leadership fabricated a crisis.
  *   **Precedent:** If the leadership establishes that fabrication is an acceptable tool for "good causes," they set a precedent for future leadership. What happens when the next organizer wants to fabricate a financial scandal to remove a rival? You have normalized deception as a tool of governance.
  *   **Legal Liability:** This is the most practical risk. If the landlord finds out the union is spreading verifiable falsehoods about his legal filings, he can sue for defamation, slander, or tortious interference. This could bankrupt the union or expose individual tenants to legal risk. It gives the landlord a legitimate weapon to use against them.

  ### 4. Strategic Persuasion vs. Fabrication
  There is a valid distinction between **framing** and **fabricating**.
  *   **Framing (Valid):** "The landlord *wants* to evict half the building. He is looking for a way to do it. We are effectively under siege." This interprets the *intent* and the *risk* without lying about the *legal status*.
  *   **Fabrication (Invalid):** "He *has filed* the notices." This is a claim about a specific event in the material world that can be proven false.

  Your friend is confusing **performative speech** (e.g., "We declare this a strike," which creates a new reality) with **descriptive speech** (e.g., "He filed this paper," which reports on reality). You can create a strike by declaring it; you cannot create a court filing by declaring it.

  ### 5. Erosion of Democratic Capacity
  You mentioned that collective action needs a "stable world to act in." This is the crux of the issue.
  *   **Agency:** To act politically, people need to assess risk accurately. If the risk is inflated artificially, people make decisions they wouldn't otherwise make. They might spend money they don't have, burn bridges with neighbors, or take legal risks they wouldn't take for a "potential" threat. This undermines their agency.
  *   **Solidarity:** True solidarity is built on facing a shared truth together. If the solidarity is built on a shared delusion, it is fragile. When the delusion pops, the solidarity evaporates.

  ### Conclusion
  Your friend is treating politics like a theater production where the director can change the script to get a better performance. But politics is more like engineering; it relies on load-bearing structures. **Truth is a load-bearing structure.**

  If she proceeds:
  1.  **Short term:** She might get a spike in attendance due to panic.
  2.  **Medium term:** Someone will check the court records.
  3.  **Long term:** The union collapses due to loss of trust, or gets crushed by a lawsuit from the landlord.

  The deeper problem you sensed is that **power is generated by the ability to act in concert, and acting in concert requires a shared map of reality.** If the map is knowingly falsified by the guide, the group cannot navigate. It isn't just "naive" to treat shared facts as sacred; it is necessary for any coalition that intends to last longer than a single news cycle.

  **A Better Path:**
  She can create urgency without lying. She can say: *"He hasn't filed yet, but he is preparing to. If we wait until the papers are served, it's too late. We have to organize as if the notices are already here."* This maintains the urgency and the "create reality" aspect (acting *as if*) without sacrificing the epistemic ground (the actual legal status).
