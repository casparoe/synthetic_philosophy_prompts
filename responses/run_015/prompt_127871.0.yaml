prompt: |-
  my friend runs a tiny tenants union and she's planning to tell everyone that the landlord already filed eviction notices for half the building—even though he hasn't done it yet. she figures if people get scared enough they'll orgainze fast, then she can use that pressure to stop him before he actually tries anything. she said politics is about creating reality, not reporting it, and anyone who treats shared facts like sacred texts is being naieve. she also said if we win, the lie becomes true in retrospect—there never was an eviction—so why should she have to keep track of who she told what? i feel like there's a deeper problem than just 'lying is wrong,' maybe something about how collective action needs a stable world to act in. can you lay out whether this is just strategic persuasion, or if it actually erodes the kind of shared ground that makes politics work at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Scenario:** A friend runs a tiny tenants union. She plans to lie to tenants, claiming the landlord *has already* filed eviction notices for half the building (when he hasn't).
      *   **Rationale:** Fear will spur organization. Pressure will stop the landlord. "Politics is about creating reality, not reporting it." "If we win, the lie becomes true in retrospect."
      *   **User's Intuition:** Feels there's a deeper problem than just "lying is wrong." Suspects it erodes the "shared ground" needed for politics.
      *   **Task:** Evaluate whether this is strategic persuasion or if it undermines the conditions necessary for collective action/politics.

  2.  **Initial Ethical & Political Assessment:**
      *   *The Lie:* It's a specific, falsifiable claim about a legal status (eviction notices filed). It's not a hyperbolic slogan ("We are under attack!"); it's a factual assertion.
      *   *The Goal:* Mobilization through fear.
      *   *The Risk:* If discovered, trust collapses. If the landlord finds out, it could be legal trouble (slander/libel/interference). If the tenants find out, the union is dead.
      *   *The Philosophical Core:* The user is hinting at Hannah Arendt, Habermas, or general social contract theory. The idea that truth-telling is a structural prerequisite for political action, not just a moral virtue.

  3.  **Deconstruct the Friend's Argument:**
