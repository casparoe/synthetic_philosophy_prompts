      *   *"If we win, the lie becomes true in retrospect."* -> This is historical revisionism. It assumes the end justifies the means *and* that the means won't leave scars.
      *   *"Anyone who treats shared facts like sacred texts is being naive."* -> This dismisses epistemic integrity as bourgeois naivety.

  4.  **Develop the Counter-Argument (The User's Intuition):**
      *   Why is shared truth necessary?
      *   *Trust:* Collective action relies on trust. If the leader lies about the threat, can they be trusted about the strategy?
      *   *Coordination:* If people act on false premises, they might make bad decisions (e.g., spending money they don't need to, burning bridges unnecessarily).
      *   *Credibility:* If the landlord proves no notices were filed, the union looks incompetent or malicious.
      *   *The "Boy Who Cried Wolf" Effect:* Future warnings (even real ones) will be ignored.
      *   *The Nature of Power:* Power comes from solidarity. Solidarity comes from trust. Trust comes from truth.

  5.  **Identify Key Philosophical/Political Concepts:**
      *   **Hannah Arendt:** "Truth and Politics." She distinguishes between *rational truth* (facts) and *opinion*. Destroying factual truth destroys the ground we stand on.
      *   **Jürgen Habermas:** Communicative action. Validity claims. Lying breaks the conditions of discourse.
      *   **Social Contract/Trust:** High-trust vs. low-trust societies.
      *   **Strategic vs. Communicative Action:** Is this manipulation (strategic) or organizing (communicative)?

