answer: |-
  **Activity: The Proximity Test**

  **Materials:** Red (No Force) and Green (Use Force) cards for each student. Whiteboard.
  **Timeline:** 60 Minutes

  **1. Setup (5 min)**
  Distribute cards. Set the tone: "We are simulating life-or-death choices. No talking during votes. Vote secretly, reveal on count of three."

  **2. The Votes (25 min)**
  Read each scenario. Students vote. Tally the "Green" (Force) votes on the board visibly.
  *   **Scenario 1:** "An attacker threatens **your** life. You can push them down stairs to escape."
  *   **Scenario 2:** "An attacker threatens **the person sitting next to you**. You can push them down stairs to save your peer."
  *   **Scenario 3:** "An attacker threatens **a stranger overseas**. You can push them down stairs to save the stranger."

  **3. Debrief (25 min)**
  *   **Map the Data:** Draw the vote curve. It usually slopes down (High Force for Self → Low Force for Stranger).
  *   **Isolate the Variable:** Ask: "Did the act (pushing) change? Did the threat change? No. What changed?" Guide them to: "Whose body it was."
  *   **Name the Problem:** Reveal the term **"The Self-Defense Exception."** Explain: "Most people permit force for Self, but reject it for Strangers. You just demonstrated that."
  *   **The Challenge:** "If saving yourself is morally good, why does it become morally bad when the body is someone else's? Is geography or relationship morally relevant to violence?"
  *   **The Choice:** Present the two consistent positions: **Absolute Pacifism** (Never push, even for self) or **Universal Intervention** (Always push to save life). Ask which they prefer now that the middle ground is exposed.

  **4. Wrap (5 min)**
  Assign reading on selective pacifism.

  **Predictable Pitfalls**
  1.  **Giggles:** Simulated violence feels fake. *Fix:* Pause immediately. "If we can't take this seriously, we can't do ethics." Reset the room.
  2.  **Debate Mid-Vote:** Students arguing scenarios. *Fix:* Enforce silence strictly. Save arguments for the debrief.
  3.  **Scenario 3 Confusion:** "Overseas" implies drones, which feel different than pushing. *Fix:* Emphasize the *mechanism* is identical (pushing a button/person) to isolate the variable of *victim identity*.

  **What This Doesn't Settle**
  *   **Truth vs. Consistency:** This activity exposes *inconsistency*, not moral truth. It doesn't prove pacifism is false, only that your intuitions are contradictory.
  *   **The Burden of Proof:** The activity breaks their unexamined view. You must supply the philosophical heavy lifting: argue either that self-defense is always wrong (consistent pacifism) or that defending strangers is always right (consistent interventionism). The activity doesn't choose between them; it just eliminates the comfortable middle ground.
