answer: |-
  There is no single common noun for this, but there is a precise philosophical and sociological carving of the phenomenon. You have identified a clash between two different modes of norm-following: one that is **reflective and calculative**, and one that is **embodied and pre-reflective**.

  In philosophy, this is often discussed under the heading of **Virtue Ethics** (specifically the Aristotelian concept of *hexis*) versus **Deontology** (Kantian duty). In sociology, it is best described by Pierre Bourdieu's concept of **Habitus**. In anthropology, it is the distinction between a **Gift** and a **Transaction**.

  Here is the carving you are looking for, distinguishing why this happens, where it applies, and what it is called.

  ### 1. The Philosophical Carving: *Hexis* vs. Duty
  You are correct that Kant argues the opposite of your observation. For Kant, an action only has moral worth if it is done *from duty*, specifically against your inclinations if necessary. If you help someone because you enjoy it, Kant says that is merely "praiseworthy" but lacks true moral worth.

  Your observation aligns with **Aristotle** and his later interpreters (like Friedrich Schiller and G.W.F. Hegel).
  *   **Kantian Morality (*Moralität*):** I do X because I have calculated that it is the Rule. This requires conscious reflection.
  *   **Aristotelian Virtue (*Hexis*):** I do X because it is my nature. I do not calculate; I simply perceive the situation and act.

  For Aristotle, if you have to stop and think about being generous, you are not yet generous; you are merely **continent** (self-controlled). The virtuous person acts with **ease**. When you calculate the tip on your phone, you are signalling that you are acting from *Moralität* (following an external rule), whereas the social situation demands *Hexis* (an internal disposition). The insult lies in the implication that you view the relationship as a legalistic contract rather than a social bond.

  Hegel called this **_Sittlichkeit_** (Ethical Life) versus **_Moralität_** (Morality). *Sittlichkeit* is the ethical life embedded in the customs and habits of a community, where the right thing is done without abstract reflection. The visitor is stuck in *Moralität*, trying to apply abstract rules to a concrete situation that requires *Sittlichkeit*.

  ### 2. The Sociological Carving: *Habitus*
  The sociologist Pierre Bourdieu provides the best explanation for why the visitor is "structurally incapable" of getting it right. He calls this **Habitus**.

  *   **Habitus:** A set of embodied dispositions, tendencies, and "feel for the game" that are acquired through long-term immersion in a culture. It operates below the level of consciousness. You do not decide to queue in Britain; you simply feel discomfort if you do not.
  *   **Explicit Rule-Following:** The visitor operates on explicit knowledge ("In this country, one tips 20%").

  The problem is that **Habitus is invisible until it is absent.** When a local queues, no one notices. When a visitor queues *consciously*, they often display micro-signals of that consciousness (a hesitation, a glance to check if others are watching, a stiff posture). This signals: "I am performing your culture." This is read as condescension because it implies your culture is a set of rules to be studied, rather than a life to be lived. It turns the interaction into a spectacle where the visitor is the observer and the locals are the specimens.

  ### 3. The Anthropological Carving: Gift vs. Commodity
  Regarding tipping specifically, this is a violation of **Gift Exchange** norms (analysed by Marcel Mauss).
  *   **Commodity Exchange:** Quid pro quo. I pay £5 for a coffee. Calculation is expected and required.
  *   **Gift Exchange:** Creates a social bond. A gift must appear voluntary and disinterested.

  If you calculate the tip to the exact percentage, you convert the **Gift** back into a **Commodity**. You are saying, "I am purchasing your good opinion of me at the market rate." The social offence is that you are refusing to enter the realm of the gift, where trust and ambiguity reign, and insisting on the realm of the contract, where precision reigns. The "grubbiness" you feel is the sensation of trying to buy social acceptance with market logic.

  ### 4. Why it applies to some conventions but not others
  You asked why this applies to tipping and queueing, but not driving on the left. This is the distinction between **Coordination Norms** and **Constitutive (or Expressive) Norms**.

  *   **Coordination Norms (Driving):** The goal is a physical outcome (no crashes). The internal state is irrelevant. If you drive on the left while screaming about how much you hate it, you are still a good driver. The norm is **regulative**; it regulates an existing activity.
  *   **Constitutive/Expressive Norms (Tipping/Queueing):** The action *itself* constitutes the social relationship. The meaning of the action depends on the intent. If you queue "as a local" but with a visible mental asterisk, you are not actually participating in the solidarity of the queue; you are mimicking it. The norm is **constitutive**; it creates the social reality.

  This phenomenon only arises where the norm serves to **signal membership** rather than **ensure safety**.

  ### 5. Is there a name for it?
  There is no single dictionary word, but in academic discourse, this is often referred to as:
  *   **The Paradox of Self-Consciousness:** (Applied to social norms). The attempt to be X prevents you from being X.
  *   **The Requirement of Unselfconsciousness:** A second-order norm that dictates one must not appear to be following the first-order norm.
  *   **Performative Compliance:** Doing the right thing in a way that highlights the performance.

  If you need a label to use in conversation, **"Calculated Conformity"** captures the negative valence best. It implies you are complying, but the calculation ruins the spirit.

  ### 6. What is the visitor supposed to do?
  This is the tragic bind. You cannot simply "switch off" your brain. However, there are two paths that avoid the offence:

  1.  **Sincere Awkwardness:** It is better to be visibly awkward than visibly calculating. If you say, "I'm not sure of the custom here, but I want to be fair," you acknowledge the norm without pretending to embody it. This signals respect for the *people* even if you lack the *habitus*. People forgive clumsiness; they do not forgive audit.
  2.  **Habituation:** You cannot think your way into *habitus*; you must act your way into it. You have to repeat the action until the calculation fades. Until then, you are structurally disadvantaged.

  ### Summary
  The thing you are describing is the **conflict between Explicit Rule-Following and Embodied Habitus**. It is a moral failing in the eyes of observers because it signals that you view the social bond as a **transaction** to be managed rather than a **relationship** to be inhabited. It applies only to **Expressive Norms** where the motive constitutes the meaning, not **Coordination Norms** where only the outcome matters.

  In British spelling, as requested: **behaviour**, **analyse**, **realise**, **signalling**. (I have adhered to this throughout).

  The closest philosophical term for the *good* version of what you want is **Grace** (in the Schillerian sense: duty and inclination coinciding), and the *bad* version is **Affectation** (pretending to a disposition one does not possess). But the structural mechanism is **Habitus**.
