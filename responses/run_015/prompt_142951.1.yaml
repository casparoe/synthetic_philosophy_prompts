  The Scenario (~120 words):
  Imagine an infinite, static crystalline lattice extending without boundary into void space. Every node hosts an identical, featureless point-particle, except for two specific nodes separated by exactly half the lattice constant along one axis. At these positions reside two perfectly identical macroscopic spheres, sharing all intrinsic qualities like mass and composition. There is no external observer, no fixed coordinate system, and no other macroscopic objects to break symmetry. The lattice structure itself is perfectly regular. The spheres stand in identical relations to all surrounding point-particles, save for their specific locations within the grid structure. Physics remains classical; no quantum effects blur positions. The setup isolates the spheres within a relational network offering no unique directional markers beyond the grid itself.

  The Verdicts (~150 words):
  The structural realist asserts discernibility. For them, the lattice constitutes a real structure independent of the objects inhabiting it. Each sphere occupies a unique node within this network; thus, 'being at node A' versus 'being at node B' constitutes a genuine relational property. Even if the local environment looks identical, their structural addresses differ, violating the condition of indiscernibility. Conversely, the strict Leibnizian denies this distinction. They argue that without an external reference frame or qualitative difference in the lattice nodes themselves, 'position' is merely a label, not a property. Since the spheres share all intrinsic qualities and the lattice offers no qualitative way to distinguish one node from another except by the spheres themselves, the spheres remain truly indiscernible. To claim otherwise begs the question by assuming spatial positions exist prior to the objects defining them.

  The Engine (~100 words):
  The disagreement hinges on the ontological status of lattice nodes. Do structural positions possess primitive this-ness independent of qualitative content? The realist treats the grid as a framework where location confers identity via unique structural relations, even if qualitatively identical. The Leibnizian treats the grid as purely qualitative; if every node is qualitatively identical, no node is distinct. Thus, the conflict is whether the lattice provides haecceitic differentiation or merely qualitative relations. Assigning distinct identities to identical nodes presupposes the numerical diversity the Leibnizian challenges.

  The Counterattack (~100 words):
  The Leibnizian resists by invoking global symmetry. Shifting the entire lattice leaves all qualitative facts unchanged. If the lattice lacks internal markers to distinguish nodes, swapping the spheres changes nothing observable. Therefore, the 'structural address' is not a property of the sphere, but an artifact of imposing an external coordinate system that does not exist. Without a qualitative ground to anchor nodes, the realist's distinction collapses into a verbal one. The Leibnizian insists identity must supervene on qualitative facts, and here, none differ.

  The Collapse Check (~80 words):
  If the lattice vanishes into continuous empty space, the argument reverts to Black's two-spheres case. Without lattice nodes, there is no structural scaffold for distinct positions. In continuous space, position is purely relational between the spheres. Since they are symmetrically placed, neither has a unique relational property. The realist loses grid-based haecceity, forcing them to accept indiscernibility or posit substantival space as a differentiating medium, reintroducing the burden.
