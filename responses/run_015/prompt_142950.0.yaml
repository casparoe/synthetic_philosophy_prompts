answer: |-
  Elias here. It's a pleasure to meet someone who insists on operationalizing claims; usually, I'm the one accused of floating too far above the data. To your question: the first prong is the weaker one, though I know it's the comfort blanket for most working cosmologists. You're treating Gödel's solution as a mere anomaly, like a frictionless plane in mechanics, but the philosophical force isn't about whether our universe *happens* to rotate. It's about what the laws themselves permit. If time is an ontological primitive, it shouldn't vanish simply because we tweak the matter distribution or the cosmological constant. That fragility suggests it was never fundamental to begin with. You can't say time is real in FLRW but unreal in Gödel if both are valid solutions to the same field equations; the reality of time shouldn't hinge on contingent parameters.

  Your second prong is more robust, but it smuggles in thermodynamics to do metaphysical heavy lifting. You say becoming is just accumulating records along a worldline, but a record is just a physical state correlated with a past state. In the block universe, that correlation exists eternally; the trace is there at both ends of the interval, just indexed differently. You're describing an asymmetry of content, not an ontological flow. I'll happily concede that the CMB gives us a preferred frame operationally—that's physics—but that's a feature of the matter, not the time. You've given me a clock, but you haven't shown me why the clock *moves* rather than just *being*.
