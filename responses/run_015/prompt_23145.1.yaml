answer: |-
  You are absolutely right to sense that these terms get mushed together, and your intuition about the difference is spot-on. The confusion happens because both concepts are weapons in the same battle against "pan-adaptationism" (the idea that every trait is an optimal solution shaped by natural selection), but they target slightly different parts of the evolutionary story.

  Here is the breakdown of where the line holds, where it blurs, and whether the distinction actually matters.

  ### 1. The Definitions (and the overlap)

  **The Spandrel (Gould & Lewontin, 1979)**
  *   **Focus:** *Origin and Constraint.*
  *   **Definition:** A trait that arises as a necessary architectural byproduct of other changes. It is not selected *for*; it is dragged along because of structural or developmental constraints.
  *   **The Analogy:** In architecture, a spandrel is the triangular space left over between two arches. You didn't build the triangle for the sake of the triangle; you built the arches, and the triangle *had* to exist.
  *   **Function:** Crucially, Gould and Lewontin note that spandrels *can* acquire function later (e.g., putting a mosaic in the triangle). But at their origin, they are non-adaptive byproducts.

  **The Exaptation (Gould & Vrba, 1982)**
  *   **Focus:** *Historical Trajectory vs. Current Utility.*
  *   **Definition:** A trait that is currently useful for a specific function but was not originally shaped by natural selection for that function.
  *   **Two Types:**
      1.  **Shift:** A trait selected for Function A is later co-opted for Function B (e.g., feathers evolved for insulation, later used for flight).
      2.  **Co-option:** A non-adaptive byproduct (a spandrel) is co-opted for Function B (e.g., the spandrel space is used for art).

  **Where the line breaks down (Your specific question)**
  You asked: *"A spandrel that later gets co-opted seems to just be both."*

  **Yes, exactly.**
  *   If a trait starts as a spandrel (non-functional byproduct) and later becomes useful, it is **both** a spandrel (regarding its origin) **and** an exaptation (regarding its current utility).
  *   However, **not all exaptations are spandrels.** Feathers are the classic example. Feathers were likely an *adaptation* for warmth (Function A). When birds started flying, feathers became an *exaptation* for flight (Function B). They weren't a spandrel; they were built by selection, just for a different job.

  So, the Venn diagram looks like this:
  *   **Spandrels** = Byproducts of constraint.
  *   **Exaptations** = Traits useful now but not selected for *this* use originally.
  *   **Overlap** = Byproducts that became useful.

  ### 2. Does the distinction do any real work?

  This is the million-dollar question. If a co-opted spandrel is just a type of exaptation, why keep the word "spandrel"?

  **It does work, but it's methodological, not ontological.**
  The distinction forces you to ask different questions when investigating a trait.

  *   **Calling it a Spandrel** forces you to look for **constraints**. It asks: "What structural or developmental rule forced this trait to exist? What was the *actual* target of selection that dragged this along?" It stops you from assuming the trait itself was the target.
  *   **Calling it an Exaptation** forces you to look for **history**. It asks: "What was this doing before? Or was it doing nothing?" It stops you from assuming current utility equals historical origin.

  **Why it matters:**
  If you treat a spandrel as a standard adaptation, you waste time looking for the selective advantage of the triangle itself, rather than the selective advantage of the arches.
  If you treat an exaptation as a standard adaptation, you construct a "Just-So Story" about why flight selected for feathers, ignoring the thermal history.

  So, is it mostly labeling? **No.** It's a safeguard against lazy storytelling. "Spandrel" highlights *constraint*; "Exaptation" highlights *historical mismatch*. You need both concepts to fully dismantle the adaptationist program.

  ### 3. What Gould and Lewontin are NOT claiming

  This is where the biggest misreading happens. Because the "Spandrels" paper is so famous, it's often summarized as "Gould says selection doesn't matter."

  **That is wrong.**

  Here is what they are **not** saying:
  *   They are **not** saying natural selection is unimportant. They agree it is the only known mechanism for complex adaptive design.
  *   They are **not** saying most traits are spandrels. They acknowledge many traits *are* adaptations.
  *   They are **not** saying biology is random.

  **Here is what they ARE saying:**
  *   **Against the "Panglossian Paradigm":** They are attacking a *methodological bias*. Evolutionary biologists had a habit of assuming that because a trait exists, it must be optimal, and because it is optimal, there must be a selective story for it.
  *   **Pluralism:** They argue that evolution is a result of multiple forces: Selection, yes, but also drift, developmental constraints, phylogenetic history, and allometry (size changes).
  *   **The Burden of Proof:** They want to shift the burden of proof. Instead of assuming a trait is an adaptation until proven otherwise, they suggest we should require evidence before labeling something an adaptation.

  **The Chef Analogy:**
  Imagine a chef makes a steak (the adaptation). There are grill marks on it.
  *   **Adaptationist view:** The grill marks are there because they enhance the flavor (selection for marks).
  *   **Gould & Lewontin view:** Wait. The marks are just a physical byproduct of the hot metal grate (constraint/spandrel). The chef selected for the cooked steak, not the marks.
  *   **The Misreading:** "Gould thinks the chef didn't cook the steak!"
  *   **The Reality:** "Gould thinks the chef cooked the steak, but don't attribute every singe mark to the chef's intentional design."

  ### Summary

  You nailed the core tension. A spandrel is about **why it's there** (constraint/byproduct). An exaptation is about **what it's doing now vs. then** (co-option).

  When a spandrel gets used for something, it becomes an exaptation. The distinction isn't about mutually exclusive boxes; it's about which part of the evolutionary narrative you need to scrutinize.
  *   Use **Spandrel** when you want to argue against the idea that selection built the trait directly.
  *   Use **Exaptation** when you want to argue against the idea that the trait's current use explains its origin.

  And Gould and Lewontin weren't trying to kill selection; they were trying to kill the habit of treating selection as the only explanation worth writing down. They wanted evolutionary biology to be more rigorous, not less Darwinian.
