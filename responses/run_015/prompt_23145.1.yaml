      *   **Exaptation (Gould & Vrba 1982):** A trait currently useful for a function but *not* originally shaped by natural selection for that function. Two types: (1) Adaptation for function A $\rightarrow$ Function B (e.g., feathers for warmth $\rightarrow$ flight). (2) Non-adaptive byproduct $\rightarrow$ Function B (e.g., spandrel $\rightarrow$ mosaic art).
