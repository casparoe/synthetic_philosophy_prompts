  I'm drafting a 3-month workshop proposal on split-brain cases and whether consciousness is actually unified or just federated—like a cluster of nodes reaching consensus through some fault-tolerence mechanism. The usual debate between Sperry-style split-mind people and the unified-mind defenders feels definately stuck because everyone treats unity as all-or-nothing. I want to frame it differently: treat unity as a graded synchronization property, borrowing ideas from distributed computing (Byzantine fault tolerence, specifically) to ask whether split-brain patients show partial unity rather than full division or full unity. Can you turn this into a proper proposal? I need the precise question stated clearly, why current philosophical answers don't settle whether unity comes in degrees, the method I'd actually use month by month, what a result looks like versus what counts as failure, and an honest assessment of whether this angle is too weird or too big for three months. Don't include a bibliography or citation list—I'll add those myself. Also please say what argument or clinical finding would change your mind about this framing being useful, and flag where your reasoning is shakiest, especially since you can't look up specific studies. You probably noticed a typo or two in my message but you get the idea.
