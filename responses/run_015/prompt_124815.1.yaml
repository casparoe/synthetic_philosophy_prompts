      *   *2. The Unity Postulate:*
          *   Is "single workspace" definitional? Often yes, in Baars' "Theater" metaphor.
          *   User's Principle: "Workspace = largest set of consumer systems among which content is mutually available."
          *   *Testing the Principle:* If callosum is cut, mutual availability breaks. The set splits. Therefore, two workspaces.
          *   *Degree vs. Binary:* If cross-talk is residual, availability is partial. Is consciousness a matter of degree? GWT usually treats ignition as a threshold event (all-or-none). This creates tension. If the set of consumers is fuzzy, the "subject" is fuzzy. GWT prefers discrete subjects.
