      *   *The Workspace:* In GWT, the workspace is a limited-capacity buffer where information becomes available to multiple specialized subsystems (consumers). In the split-brain case, the anatomical correlate is usually assumed to be the thalamocortical loop or specific cortical hubs connected by the corpus callosum.
      *   *Ignition/Broadcast:* Ignition is the amplification of a signal to enter the workspace. Broadcast is the distribution to consumers.
      *   *Consumers:* Language production (left hemisphere typically), motor control (left/right hands), memory systems, self-monitoring.
      *   *The Setup:*
          *   Right Visual Field (RVF) $\to$ Left Hemisphere (LH). LH has language. Ignition occurs in LH workspace. Broadcast reaches language motor output. Result: Naming possible.
          *   Left Visual Field (LVF) $\to$ Right Hemisphere (RH). RH lacks language output. Ignition occurs in RH workspace? Or is there only one workspace?
      *   *One vs. Two Workspaces:*
          *   *Standard GWT:* Usually implies a singular "theater." If the callosum is cut, does the theater split?
          *   *Variable Cross-talk:* If disconnection is incomplete, broadcast is partial. Some consumers get the signal, others don't.
          *   *Prediction:* As cross-talk varies, the *scope* of availability varies. If zero cross-talk, we have two disjoint sets of consumers.
      *   *Status of RH:* GWT ties consciousness to global availability. If RH information is available to RH consumers (motor, emotion, simple recognition) but not LH consumers (language), is RH conscious? GWT says yes, *relative to its own workspace*. But if there is only one workspace (LH dominant), RH is unconscious.
      *   *Resolution:* The theory struggles here because it doesn't inherently define the *boundaries* of the workspace anatomically, only functionally.

  3.  **Part 2: The Three Complications:**

      *   *1. The Problem of Report:*
          *   GWT distinguishes access from report. Report is just one consumer (speech).
