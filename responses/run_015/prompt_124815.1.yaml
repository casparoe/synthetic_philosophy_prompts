      *   *Access vs. Phenomenal:* Does the distinction help? If GWT is access-only, the "feeling" of the RH is irrelevant. If GWT claims to explain phenomenality, it must explain *what it is like* to be the RH. The theory struggles to differentiate "access without report" from "access without phenomenality" in this specific case because we lack independent access to the phenomenality.
