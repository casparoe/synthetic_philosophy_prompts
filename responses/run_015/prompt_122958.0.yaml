          *   *Severity:* Medium. It depends on how "anatomy" is defined. If "anatomy" means "biological tissue," P1 holds. If "anatomy" means "structural connectivity," P1 conflicts with P6.
          *   *Refinement:* P1 says "anything with the right organisation." P6 says "examining its architecture." These are compatible *if* architecture = functional organization. However, P7's reaction to the wasp suggests the *lack* of a "central arena" (structural/functional hybrid) trumps the behavior. This leans towards a specific architectural requirement that might conflict with the openness of P1.

