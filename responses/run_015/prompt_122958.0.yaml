  4.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the work. Set the stage for the audit.
      *   *Categorization:* Group tensions into "Genuine/Severe," "Genuine/Moderate," and "Apparent/Dissolvable."
      *   *Deep Dive on Tension 1 (P2 vs P7):* This is the biggest problem. P2 claims the test is decisive. P7 admits it isn't.
