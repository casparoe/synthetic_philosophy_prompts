          *   Claim 5: Phenomenal consciousness is *necessarily* unified in a conceptual sense (one subject per experience).
          *   Claim 6: Reject first-person narrative authority (language hemisphere doesn't speak for the other), reject unobservable ego.
          *   Claim 7: Conceivability guides possibility, split-brain disunity is coherent, unity is contingent *generally*, but *within* a subject, experiences are necessarily unified.
      *   **Specific Questions to Answer:**
          *   Does "necessarily exactly one subject per experience" conflict with "no fact of the matter about subject-count"?
