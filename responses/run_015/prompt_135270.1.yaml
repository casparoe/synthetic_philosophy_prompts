answer: |-
  Imagine a stroke patient in a neuro-ICU with selective damage to the thalamic nuclei that drive recurrent feedback into the posterior cortical hot zone, while leaving the feedforward pathways to the fronto-parietal global workspace untouched. When a painful heat stimulus is applied to their arm, the signal bypasses the silenced posterior sensory areas and lands directly in the global workspace, triggering accurate verbal reports like "I am being burned" and appropriate avoidance behaviors, yet the patient calmly insists there is no actual hurting or sting. The information is broadcast globally for reasoning and speech, but without the thalamocortical reverberation in the posterior zone, the sensory texture never ignites, leaving a state where the brain knows everything about the pain except what it feels like.

  **The Walkthrough**

  Here's the deal: Global Workspace Theory (GWT) basically equates consciousness with information availability. Since the fronto-parietal network is broadcasting the pain signal successfully—the patient can report it, reason about it, and act on it—GWT says access consciousness is fully online. The system is doing exactly what consciousness is supposed to do: make data available to the rest of the brain. However, a phenomenal-consciousness advocate (someone who cares about "what it's like" to be you) would deny this is real awareness because the lights are off inside. They'd argue that without the posterior hot zone lighting up via that thalamocortical feedback, there's no actual sensory experience, just a blind, functional processing of data like a robot saying "error" without feeling pain.

  The feature carrying the weight here is that **posterior feedback loop**. In this setup, it's the specific ingredient required for qualia (the feel) but not for access (the report). If you restore that feedback loop, the posterior hot zone starts reverberating again, and suddenly the patient doesn't just report the pain—they *suffer* it. The access was already there, but restoring the loop bridges the gap between knowing about the pain and actually feeling it.
