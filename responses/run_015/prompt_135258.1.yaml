answer: |-
  # ACTIVITY DESIGN: BROKEN SCALE

  **Target:** 10 Grad Students
  **Time:** 90 Minutes
  **Materials Needed:**
  *   30 Index Cards (10 Red, 10 Blue, 10 Green).
  *   1 Opaque Box (shoe box size), placed in the center of the table.
  *   1 Timer (phone or kitchen).
  *   3 Printed "Lexicon Sheets" (one for each color, see below).
  *   Pens/Paper for notes (optional, but discouraged during the act).

  **Room Setup:**
  Single table, circular seating. The Box sits in the exact center. No barriers between students and the box.

  ---

  ## PART 1: THE SETUP (00:00 – 00:15)

  **00:00 – 00:05 | Introduction**
  Do not explain the philosophy. Do not explain the point. Give only the instructions.
  *   "You are a collective ethics board. You have one decision to make. There is no correct answer, only a final one."
  *   "You will each receive three cards: Red, Blue, Green."
  *   "You must keep exactly one card. You must destroy the other two."
  *   "Destruction means tearing them in half and placing them in the Box. You must do this visibly. You must hear the tear."
  *   "Once you choose, you are locked into the vocabulary of that color. You cannot speak using the concepts of the cards you tore."

  **00:05 – 00:15 | The Scenario: "The Muralist"**
  Read this aloud, slowly. No interruptions.

  > "A beloved community artist, Elena, has completed a massive mural that revitalized a struggling neighborhood. Property values are up. Community pride is high. Elena is a local hero.
  >
  > Yesterday, proof emerged that Elena plagiarized the design from a deceased, unknown artist whose family was never compensated. The work is technically theft.
  >
  > **If you expose this:** The truth is recorded. The original artist's lineage is acknowledged. But Elena is disgraced, likely sued into bankruptcy, and the neighborhood narrative collapses. Trust in community art initiatives evaporates.
  >
  > **If you hide this:** The community keeps its hero. The revitalization holds. But a lie becomes permanent history. The original artist remains erased. You become complicit in the fraud.
  >
  > You must vote now. Expose or Hide. But to vote, you must choose a Value."

  **Distribute the Cards and Lexicon Sheets.**

  *   **RED (Care):** Vocabulary allowed: *Harm, Safety, Trust, Community, Protection, Feeling, Wellbeing, Relationship, Mercy.*
  *   **BLUE (Autonomy):** Vocabulary allowed: *Choice, Agency, Rights, Consent, Ownership, Self-Determination, Freedom, Boundaries.*
  *   **GREEN (Truth):** Vocabulary allowed: *Fact, Accuracy, Record, Reality, Evidence, Integrity, Honesty, Correction.*

  ---

  ## PART 2: THE CHOICE & THE TEARING (00:15 – 00:40)

  **00:15 – 00:25 | Silent Deliberation**
  Students sit with their three cards. No talking. They must decide which card to keep.
  *   **Rule:** You cannot discuss strategy. You cannot compare cards.
  *   **Rule:** You cannot fold or damage the cards until the moment of commitment.

  **00:25 – 00:40 | The Ritual of Destruction**
  Call students one by one to the center (or do it simultaneously if the group dynamic allows, but one-by-one creates witness pressure).
  1.  Hold up the two cards you are **rejecting**.
  2.  Tear them in half. **Audibly.**
  3.  Drop the pieces into the Box.
  4.  Place the kept card face up in front of you.
  5.  Return to seat.

  *Facilitator Note:* If a student hesitates, do not comfort them. Let the silence hang. The physical act of destroying the options is the core mechanic. If someone tries to keep all three, stop them. The activity cannot proceed without loss.

  ---

  ## PART 3: THE JUSTIFICATION (00:40 – 01:00)

  **The Vocabulary Lock**
  Go around the circle. Each student has 2 minutes to state their decision (Expose or Hide) and justify it.
  *   **Constraint:** You may **only** use words from your kept card's Lexicon Sheet.
  *   **Constraint:** You cannot reference the values you tore. (e.g., A Green player cannot say "I know this hurts the community, but..." because "hurt" and "community" are Red concepts).
  *   **Constraint:** You cannot say "I weighed X against Y." You must speak as if the other values do not exist.

  *Facilitator Intervention:* If a student slips (e.g., a Blue player says "It's unfair"), stop them immediately. Ask: "Is 'fair' in your lexicon?" If not, they must rephrase or sit in silence for the remainder of their turn. This friction is necessary.

  ---

  ## PART 4: DEBRIEF (01:00 – 01:30)

  **Phase 1: The Physicality (10 mins)**
  Ask the room to look at the Box.
  *   "Look at the pile. What is in there?"
  *   "It is not just paper. It is the capacity to care about the values you tore."
  *   "How did it feel to tear the card? Did it feel like a trade-off? Or did it feel like a loss?"
  *   *Goal:* Establish that the unchosen value wasn't outweighed; it was removed from the game.

  **Phase 2: The Vocabulary Lock (10 mins)**
  *   "When you were forbidden from using certain words, did the problem change?"
  *   "Did anyone feel like they were speaking a different language than the person next to them?"
  *   *Goal:* Map this to **Incommensurability**. The point is not that the values conflict, but that they operate on different scales. You cannot translate Green into Red. When you try, you break the rules of the language.

  **Phase 3: Predicting Failure (5 mins)**
  Be honest about what likely went wrong or felt fake.
  *   **Gamification:** "Did anyone try to 'win' the justification? Did you treat the lexicon as a puzzle to solve rather than a constraint to feel?" (Students often try to find loopholes in the vocabulary to smuggle in the other values).
  *   **Hoarding:** "Did anyone hesitate to tear because you wanted to keep the option open for later?" (This reveals the desire for commensurability—the hope that you can have both).
  *   **The Clean Tear:** "The paper tore cleanly. Did your conscience feel clean?"

  **Phase 4: The Missing Weight (5 mins)**
  Acknowledge what the activity cannot do.
  *   **Existential Cost:** "In this room, the loss is paper. In reality, the loss is sleep, reputation, or livelihood. This activity simulates the structure of hard choice, but not the weight. You will leave this room and eat dinner. Elena does not get to eat dinner if you choose Green."
  *   **Messy Reality:** "Real values bleed into each other. Truth affects Care. Here, we surgically separated them. That is a lie, but it is a useful lie to understand the structure of the dilemma."

  **Closing Statement:**
  "Hard choices are not about finding the heavier value. They are about putting down one value entirely so the other can exist. You didn't balance the scale today. You broke it. That is the only way some decisions get made."

  ---

  ## FACILITATOR CHEAT SHEET: WHAT WILL GO WRONG

  **1. The "Synthesis" Attempt**
  *   **Behavior:** A student will try to argue that their color *includes* the others. (e.g., "True Care requires Truth.")
  *   **Fix:** Shut it down. "For the purpose of this activity, Care does not include Truth. If you need Truth to justify Care, you must play Green."
  *   **Why:** This avoids the hard choice. The activity fails if they reconcile the values.

  **2. The "Strategic Tear"**
  *   **Behavior:** Students will tear the cards quickly to get it over with, treating it as a bureaucratic step.
  *   **Fix:** Slow them down. "Wait. Hold them up. Make sure everyone sees what you are destroying. Then tear."
  *   **Why:** The hesitation is the data. The discomfort is the lesson.

  **3. The "Meta-Commentary"**
  *   **Behavior:** During justification, a student says, "I know I'm supposed to only use Green words, but..."
  *   **Fix:** Interrupt. "Speak the language or pass."
  *   **Why:** Breaking the fourth wall dissolves the phenomenological constraint.

  **4. The "Clean Loss" Illusion**
  *   **Behavior:** Students feel relieved after tearing the cards.
  *   **Fix:** In debrief, highlight that relief is a coping mechanism. Real hard choices often leave residue that doesn't go in a box.

  ## LIMITATIONS OF THE ACTIVITY

  **1. Reversibility**
  In the real world, you cannot un-expose a scandal. In this room, they can tear the cards back together later (metaphorically). The permanence is simulated, not real.

  **2. Social Safety**
  Grad students know each other. They may collude silently to all pick Green so no one feels bad. The "Social Status" payoff is low stakes compared to real community ostracization.

  **3. The Clean Tear**
  Paper separates cleanly. Values do not. Choosing Truth often damages Care in messy, unpredictable ways that linger. The card tear implies a clean break that reality rarely offers.

  **4. No Future Self**
  Real hard choices change who you are. Choosing Green might make you a colder person forever. This activity ends in 90 minutes. They do not have to live with the identity shift.

  ---

  ## LEXICON SHEETS (Print and Cut)

  **RED CARD: CARE**
  *Allowed Concepts:*
  Harm, Safety, Trust, Community, Protection, Feeling, Wellbeing, Relationship, Mercy, Support, Vulnerability, Healing.
  *Forbidden Concepts:*
  Rights, Facts, Ownership, Accuracy, Rules, Logic, Evidence.

  **BLUE CARD: AUTONOMY**
  *Allowed Concepts:*
  Choice, Agency, Rights, Consent, Ownership, Self-Determination, Freedom, Boundaries, Will, Power, Control.
  *Forbidden Concepts:*
  Feelings, Community, Facts, Truth, Safety, Harmony, Mercy.

  **GREEN CARD: TRUTH**
  *Allowed Concepts:*
  Fact, Accuracy, Record, Reality, Evidence, Integrity, Honesty, Correction, Data, Proof, Clarity.
  *Forbidden Concepts:*
  Harm, Feelings, Rights, Choice, Community, Trust, Mercy.
