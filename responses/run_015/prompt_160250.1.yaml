      *   *Dominance:* The user's claim about weak dominance is likely false. If I play against a DefectBot, MirrorBot Cooperates (if it timeouts) or Defects (if it simulates). If MirrorBot Cooperates against DefectBot, it gets sucker's payoff. So MirrorBot is *not* unexploitable as described. It needs to check if the opponent cooperates *conditionally*.
