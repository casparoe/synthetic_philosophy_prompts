  5.  **Refining the Advice (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to endorse "MirrorBot" exactly as described because `run(self)` leads to infinite recursion unless the timeout is handled perfectly. If A times out on B, and B times out on A, they both Cooperate. But if A has more compute, A simulates B, sees B Cooperate (timeout), and Defects. This is a vulnerability.
