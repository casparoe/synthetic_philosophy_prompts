  I assess the claim that all testimonial warrant must trace to non-testimonial sources (perception, memory, inference). You are right that the warrant/content/mechanism split is essential; conflating them generates pseudo-problems. However, the local/global/default taxonomy is doing the hidden work. Global reductionism often covertly relies on a default entitlement to general reliability, collapsing the distinction. If "general reasons" require no specific evidence, global reductionism is verbally distinct but extensionally equivalent to non-reductionism. I treat the debate as turning on whether positive reasons are necessary for warrant.

  Decomposition
  1. Child/Novice Acquisition (0.8): Children lack the cognitive repertoire for inductive inference regarding reliability yet intuitively possess warrant. Strict reductionism implies widespread skepticism for novices, which is implausible. This suggests warrant is not always reduced to non-testimonial sources in development.
