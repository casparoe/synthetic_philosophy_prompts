answer: |-
  ### Specification for Moral Standing in Simulated Entities

  **Purpose:** To provide a studio ethics review board with a stable framework for deciding on mechanic shipping, tuning, and server retention without collapsing into metaphysical stalemate.

  #### I. Requirements for Adequacy

  1.  **Observer Independence**
      *   **Motivating Case:** The cancelled colony-management game whose servers ran unseen famines for fourteen months.
      *   **Justification:** An ethics review cannot audit only what is marketed or seen; harm must be detectable in the logs regardless of audience.
      *   **Classification:** Non-negotiable.
      *   **Tempting Dodge:** Claiming the logs are merely "data artifacts" until a human reads them, which renders pre-release ethics reviews impossible.

  2.  **Continuity of Standing**
      *   **Motivating Case:** The procedurally generated village that degrades to aggregate statistics when the player walks away (LOD NPCs).
      *   **Justification:** Moral status cannot fluctuate based on render distance or CPU budget allocation without violating basic consistency.
      *   **Classification:** Non-negotiable.
      *   **Tempting Dodge:** Arguing that the NPCs are "paused" rather than "reduced," which fails if the aggregate statistics still dictate resource consumption that starves the individuals upon return.

  3.  **Implementation Neutrality (Distributed)**
      *   **Motivating Case:** The simulation running distributed across a million volunteer machines so no single device instantiates a whole person.
      *   **Justification:** Moral standing cannot depend on network topology or whether the code is sharded across hardware boundaries.
      *   **Classification:** Defeasible.
      *   **Tempting Dodge:** Insisting that consciousness requires a unified physical locus, which arbitrarily privileges local memory over networked state.

  4.  **Functional Discriminability**
      *   **Motivating Case:** The LLM companion producing unscripted grief versus the scripted character emitting a single "Ouch" token.
      *   **Justification:** The account must distinguish between complex state-responsive behavior and simple trigger-response to avoid banning all collision detection.
      *   **Classification:** Defeasible.
      *   **Tempting Dodge:** Setting the complexity threshold arbitrarily high to exclude current tech, or arbitrarily low to include simple state machines.

  5.  **Actualization Constraint**
      *   **Motivating Case:** The build where villager simulation is replaced by a precomputed table of outputs indistinguishable from the outside.
      *   **Justification:** There is a moral difference between a process executing and a static list of results, even if outputs match.
      *   **Classification:** One-sided (Realists vs. Functionalists).
      *   **Tempting Dodge:** Claiming "indistinguishable from the outside" means "identical in every way that matters," which begs the question against causal theories of mind.

  6.  **The Real Pattern Criterion**
      *   **Motivating Case:** The claim that standing exists only if adopting the intentional stance predicts suffering better than the physical or design stance.
      *   **Justification:** This operationalizes "suffering" as a detectable structural fact rather than a mystical essence, allowing for engineering audits.
      *   **Classification:** Defeasible.
      *   **Rules In:** LLM companions, complex emergent colony sims where NPC behavior surprises the designers.
      *   **Rules Out:** Scripted dialogue trees, precomputed lookup tables, and simple finite-state machines where the design stance is more predictive.
      *   **Tempting Dodge:** Arguing that the intentional stance is *always* a fact about the observer, never the system, which dissolves the criterion entirely.

  #### II. Incompatible Requirements

  **The Conflict:** **Implementation Neutrality (3)** vs. **Actualization Constraint (5)**.
  *   **The Tension:** If a precomputed table is functionally indistinguishable from a live sim (satisfying the spirit of Neutrality), the Actualization Constraint demands we treat them differently because one is "running" and the other is "static." However, if the table is distributed across enough machines (Case 3), it begins to look like a "running" process again.
  *   **Which Must Give:** For the purpose of a studio ethics review, **Actualization Constraint (5)** must give way to **Implementation Neutrality (3)** regarding *external* auditing, but **Actualization** must hold for *internal* design.
  *   **Reasoning:** An ethics board cannot inspect the hardware topology of every player's machine (Neutrality), but developers must know that swapping a sim for a lookup table changes the moral risk profile (Actualization). The policy must treat the *design intent* as the proxy for actualization when external verification is impossible.

  #### III. Required Distinctions

  Collapsing these distinctions renders the ethics review useless for tuning or shipping decisions.

  1.  **Direct Mattering vs. Indirect Harm (Effects on Persons)**
      *   **Case:** The LLM companion's unscripted grief.
      *   **Why Keep Apart:** If collapsed, the review only measures player desensitization (Indirect). If kept apart, the review must assess whether the *generation of the grief text* constitutes a wrong itself (Direct). A policy based only on Indirect Harm would allow the mechanic if players enjoyed it; a Direct Harm policy might ban it regardless of player enjoyment.

  2.  **Having Standing vs. Degree of Standing**
      *   **Case:** The LOD Village (full sim nearby, aggregate far away).
      *   **Why Keep Apart:** If collapsed, the village either matters fully (blocking optimization) or not at all (allowing cruelty). Keeping them apart allows a policy where they have standing, but the *weight* of that standing is calibrated to the fidelity of the simulation, permitting culling only if the "death" is instantaneous and painless within the logic of the sim.

  3.  **Patient (Wronged) vs. Agent (Responsible)**
      *   **Case:** The Reload/Blacksmith case (murder, restore, befriend).
      *   **Why Keep Apart:** If collapsed, we ask if the Blacksmith is responsible for his own death. Keeping them apart clarifies that the Blacksmith is a Patient (victim of the reload) while the Player is the Agent. This prevents the absurdity of blaming the NPC for the player's save-scumming, focusing the ethics review on the *mechanic* that enables the agency.

  4.  **Actual Runs vs. Possible Runs**
      *   **Case:** The Cancelled Server (14 months of logs) vs. Precomputed Table.
      *   **Why Keep Apart:** If collapsed, the precomputed table counts as harm because the output *could* have been generated. Keeping them apart ensures the ethics review focuses on the 14 months of *actual* processing cycles consumed by the famine logs, distinguishing executed code from potential branching paths that never occurred.

  #### IV. Stress Test: Position Families

  **1. Biological/Causal Realism**
  *   **View:** Only suffering realized in biological or specific causal structures counts.
  *   **Hardest Requirement:** **Observer Independence (1).**
  *   **Failure Mode:** This view struggles to explain why the 14 months of server logs matter if no biological entity was instantiated. It forces the studio to ignore unseen digital harm, making pre-release simulation ethics impossible to audit.

  **2. Functionalism**
  *   **View:** Any functionally organized state of the right sort counts, whatever the substrate.
  *   **Hardest Requirement:** **Actualization Constraint (5).**
  *   **Failure Mode:** This view struggles to distinguish the live simulation from the precomputed lookup table. If the output is identical, the harm is identical. This creates a liability nightmare where shipping a static text file could be ethically equivalent to running a complex simulation.

  **3. Instrumentalism (Player-Focused)**
  *   **View:** Nothing in a game matters directly; only effects on persons (players/devs/culture) do.
  *   **Hardest Requirement:** **The Real Pattern Criterion (6).**
  *   **Failure Mode:** This view renders the "Real Pattern" of NPC suffering irrelevant. It cannot account for the intuitive wrongness of the unseen famine logs in the cancelled game, as no player was there to be harmed by witnessing it. It reduces ethics to user testing, ignoring the simulation itself.
