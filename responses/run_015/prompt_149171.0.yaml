prompt: |-
  I write novels — mostly a slippery autofiction that keeps getting shelved as literary fiction, a category I've never once heard anyone define — and I run a very small, very low-stakes podcast where I get one guest on to argue about whichever idea my writing group has been circling all month. Next week's guest is a Wittgensteinian who holds that family resemblance isn't a theory of concepts at all but a reminder: the demand for a real definition is the thing that has to be dissolved, not satisfied. Give me eight or nine questions that don't let her just re-explain the remarks on games in the Investigations. I definately want one on whether family resemblance quietly collapses into a cluster or disjunctive theory the moment you ask which resemblances count — if any resemblance will do, isn't the claim trivial?; one on whether the novel, or genre generally, is a family-resemblance concept given that its borders are policed by prizes, workshops and bookstore shelving rather than by ordinary use; one on a case I made up: a village whose word we translate as game covers chess, lawsuits and flirting but not football, with total agreement on every particular case — do they share our concept, and how would we even tell; one on whether language-game talk can explain how anyone ever learns a word without smuggling back the rules it was meant to replace; and one on what, if anything, would count against the view. For each, add a follow-up keyed to the answer she's most likely to give, since her move is always to say that I'm still asking for a theory.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A novelist writing "slippery autofiction" (shelved as literary fiction), runs a small, low-stakes podcast.
      *   **Podcast Format:** One guest, arguing about an idea the writing group has been circling.
      *   **Next Guest:** A Wittgensteinian.
      *   **Guest's Stance:** Family resemblance isn't a theory of concepts; it's a reminder. The demand for definition must be dissolved, not satisfied.
      *   **Task:** Generate 8-9 interview questions.
      *   **Constraints:**
          *   Don't let her just re-explain the *Investigations* remarks on games (PI §66-71).
          *   Must include specific required questions/topics:
              1.  Collapse into cluster/disjunctive theory (triviality objection).
              2.  Novels/Genre (policed by institutions vs. ordinary use).
              3.  Hypothetical Village Case (chess, lawsuits, flirting = game; football $\neq$ game).
              4.  Language-learning (smuggling rules back in).
              5.  Falsifiability (what counts against the view).
          *   **Crucial Addition:** For each question, add a follow-up keyed to her most likely answer (which is: "You're still asking for a theory").
      *   **Tone:** Intellectual, slightly combative but respectful (it's an argument podcast), precise, aware of the philosophical stakes.

  2.  **Deconstruct the Guest's Position:**
      *   She is a "therapeutic" or "resolute" Wittgensteinian. She rejects the idea that Wittgenstein is offering an alternative *account* of meaning (like a prototype theory or cluster concept). She thinks he's diagnosing a philosophical craving.
      *   *Trap:* If I ask "Is X a family resemblance concept?", she will say "That's not the point."
      *   *Strategy:* The questions need to corner her into applying the *method* to concrete cases where "dissolving the demand" feels like evasion or has practical consequences (especially for a writer).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Cluster/Disjunctive Theory.*
          *   Draft: Isn't family resemblance just a cluster theory? If any resemblance works, isn't it trivial?
          *   Refinement: Make it sharper. Focus on the "counting" of resemblances.
          *   Follow-up: She'll say "You want a criterion for counting." I need to push back on whether that criterion is necessary for the concept to work.

      *   *Requirement 2: Novels/Genre.*
          *   Draft: Is "novel" a family resemblance concept? But prizes police it.
          *   Refinement: Contrast "ordinary use" with "institutional policing." If the boundaries are enforced by agents (editors, judges), is it still a language-game or a power structure?
          *   Follow-up: She'll say "Institutions are part of the use." I need to ask if that conflates *is* and *ought*.

      *   *Requirement 3: The Village Case.*
          *   Draft: Village uses "game" for chess/flirting but not football. Do they share the concept?
          *   Refinement: Emphasize the *total agreement on particulars* but divergence on extension. This challenges the idea that "use" determines meaning simply.
          *   Follow-up: She'll say "Translation is indeterminate." I need to ask if that makes communication impossible.

      *   *Requirement 4: Learning/Rules.*
          *   Draft: How do kids learn words without rules? Doesn't this smuggle rules back in?
          *   Refinement: Focus on *training* vs. *explaining*. If I point to examples, aren't I implicitly teaching a rule about what to notice?
          *   Follow-up: She'll say "Training is pre-rational." I need to ask where the normativity comes from if not rules.

      *   *Requirement 5: Falsifiability.*
          *   Draft: What counts against this view?
          *   Refinement: If nothing counts against it, is it a dogma?
          *   Follow-up: She'll say "It's not a view." I need to ask what work it's doing if it's not a view.

      *   *Filling the remaining slots (to reach 8-9):*
          *   Need to leverage the user's identity as a novelist.
          *   *Idea 6: Autofiction.* If "literary fiction" is defined by shelving, not essence, does writing to that category make the work inauthentic?
          *   *Idea 7: The "Craving".* Is the craving for definition itself a natural human impulse or a philosophical disease? If it's natural, why cure it?
          *   *Idea 8: Ethics/Politics.* If we dissolve definitions of "justice" or "woman," do we lose political leverage? (Classic critique).
          *   *Idea 9: The Podcast itself.* Is this argument a language-game? Are we playing it right?

  4.  **Refining and Polishing:**
      *   Ensure the voice sounds like a writer/podcaster (slightly weary of academic jargon, focused on utility).
      *   Ensure the follow-ups specifically target the "You're asking for a theory" deflection.
      *   Check against the "slippery autofiction" persona. The questions should feel like they come from someone who lives in the gray areas of definition.

  5.  **Review against Constraints:**
      *   8-9 questions? Yes.
      *   Specific required topics included? Yes (Cluster, Novel/Genre, Village, Learning, Falsifiability).
      *   Follow-ups included? Yes.
      *   Tone appropriate? Yes.

  6.  **Final Tweak:** Make sure the follow-ups don't just repeat the question but anticipate the *specific* Wittgensteinian move (therapeutic dissolution) and press on the *consequence* of that move.

      *(Self-Correction during drafting)*: For the Village question, make sure the distinction is clear. They agree on the *cases* labeled game but the extension is different from ours. Wait, the prompt says: "covers chess, lawsuits and flirting but not football, with total agreement on every particular case." This implies we agree on what chess *is*, but they call it game and we might not (or vice versa). Actually, the prompt says "with total agreement on every particular case." This is tricky. If we agree on the particulars, do we disagree on the label? Or do they include things we exclude? Let's interpret it as: We agree on the description of the activities, but their *application* of the word "game" differs radically (including lawsuits, excluding football). This challenges the idea that "use" is universal.

      *(Refining the "Cluster" question)*: The prompt asks: "if any resemblance will do, isn't the claim trivial?" I need to make sure this is the core of that question.

      *(Refining the "Follow-ups")*: The user says her move is *always* to say "I'm still asking for a theory." The follow-up needs to accept that premise momentarily and then ask, "Okay, if it's not a theory, what is it? A tool? A therapy? And is it working?"

  7.  **Final Polish:** Check the voice. "Slippery autofiction," "low-stakes podcast." The intro should reflect this.

      *(Wait, one check on the Village case)*: "a village whose word we translate as game covers chess, lawsuits and flirting but not football, with total agreement on every particular case."
