  4.  **Evaluate the User's Action (The "Cooperator"):**
      *   *His Logic:* Paid despite no legal obligation.
      *   *Rationality:* From a narrow accounting view (one-shot), it looks irrational. From a broader strategic view (reputation, future credit, self-concept, industry standing), it is highly rational.
      *   *Virtue Ethics:* Being a "person who keeps promises" is a character trait that yields long-term benefits.

  5.  **Address the Specific Questions:**

      *   **Q1: Is her planning coherent?**
          *   It's *instrumentally* coherent in a vacuum (maximize immediate cash flow).
