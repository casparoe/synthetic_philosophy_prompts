prompt: |-
  Hey — I run the research team at an international health NGO. Several times a year we write an interview guide or survey module in English, our field staff translate it into about a dozen languages, and then we compare the answers across countries and move real money around based on the differences. I've started to worry that a good chunk of what we read as "people in country X care less about Y" is really an artifact of what their language makes easy or hard to say.

  Where I've landed on the theory: the strong Sapir–Whorf thing (language determines what you can even think) looks dead, but some weaker version seems hard to deny — that a language shapes what you're *obliged* to encode in order to say anything at all, what sits on the tip of your tongue, and what takes a whole clause to get across. (There's an idea I half-remember, Slobin I think, that the effect is mostly on what you have to work out while you're speaking rather than on thought in general.)

  Here's what I want: turn that into a procedure my team can run on an item before we field it. Concretely — we have no budget for ethnography, our country leads are smart but have no linguistics training, sign-off is the country director, and usually I have a day or two, not a month. So: the questions in order, what counts as a good enough answer to each, where the procedure stops with a "don't field this cross-nationally," and where it has to hand the decision to a person because it's a values call rather than a factual one.

  Some things I specifically want in it:

  My stab at the key distinction is three-way: does the language *force* you to mark the distinction every time you open your mouth (grammatically), does it just make it *cheap* — one ready-made word, easy to reach for — or is it merely *unsayable* without a whole clause or a loan word? Fix that if it's wrong.

  For my purposes I genuinely don't care whether an effect is reshaping thought or only reshaping what people say when you put a question to them, since either one wrecks a cross-country comparison. Tell me if that's a mistake and it matters which it is.

  I also want a step where we write down, *before* seeing any data, which direction the language should push the answer and roughly how much — if we can't say which way, we shouldn't use the item. And for anything big enough to move money, some kind of non-verbal or behavioural cross-check of the same construct.

  Then run it on three of our actual items:

  1. A confidence question: "How confident are you that the clinic will be open next time you go," scored 1–5. In one of our languages, when you talk about a future or past event you have to grammatically mark whether you saw it yourself, were told it, or inferred it — evidentiality, I think it's called. Respondents there score consistently low and the country team reads that as "they don't trust us."

  2. A wayfinding question: we ask people to describe the route they took to the clinic and where they'd put a sign, and we code the answers for spatial detail. At one site the language doesn't really have a way to say "to the left of the door" without using cardinal directions — people say north-side and so on as a matter of course, even indoors. Our coding scheme was built for left/right answers, so those responses look vague to us.

  3. The one I won't like: our flagship "trust in the health system" battery, which our regional strategy and the last two board reports are built on. In two of our languages the nearest natural word to "trust" isn't about institutions at all — it's about a particular person you have a relationship with, or it's bound up with reciprocity and exchange. So low scores there may mean something entirely different. Run the procedure on this and tell me what it says even if it says I have to stop reporting a comparison I've been reporting for two years.

  Also give me at least one item where the honest output is "this is fine, field it as is," so I know the procedure isn't just a no-machine. And tell me plainly what it can't do.

  On confidence: be clear about what's settled among people who actually work on this versus what they're still fighting about. I've gathered that some of the famous experiments in this area have had replication trouble, and I don't want to build a step on one of those and find out a year later. If any step rests on a contested result, flag it and say what breaks if the result is false — and don't soften it if the honest verdict is that the weak version I've committed to is itself less secure than I think. No citations or further reading, I have no library access out here and won't chase them. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Role:** Research team lead at an international health NGO.
      *   **Problem:** Cross-country survey comparisons might be artifacts of linguistic differences (linguistic relativity), not actual differences in attitude/behavior. This affects funding allocation.
      *   **Constraints:** No budget for ethnography, country leads have no linguistics training, sign-off by country director, tight turnaround (1-2 days).
      *   **Theoretical Stance:** Rejects strong Sapir-Whorf (language determines thought), accepts weak version (language shapes what is obligatory/easy to encode during speech). Specifically references Slobin ("Thinking for Speaking").
      *   **Specific Requirements:**
          *   Turn theory into a concrete procedure (questions in order, pass/fail criteria, stop points, human judgment calls).
          *   Incorporate a specific 3-way distinction (Forced/Grammatical vs. Cheap/Lexical vs. Hard/Periphrastic).
          *   Address whether "reshaping thought" vs. "reshaping speech" matters for their goal (it doesn't, both wreck comparison).
          *   Include a step for *a priori* prediction of direction/magnitude of bias.
          *   Include a requirement for non-verbal/behavioral cross-checks for high-stakes items.
          *   Run the procedure on 4 specific items (Confidence/Evidentiality, Wayfinding/Spatial, Trust/Semantic, and one "Fine" example).
          *   Be honest about settled vs. contested science (replication issues).
          *   No citations/further reading.
          *   American English.

  2.  **Deconstruct the Theory (Slobin & Linguistic Relativity):**
      *   *Strong Whorf:* Language determines thought. (Generally rejected).
      *   *Weak Whorf/Slobin:* Language influences *online processing* during speech ("Thinking for Speaking"). It makes certain distinctions obligatory (grammar) or accessible (lexicon).
      *   *User's 3-way distinction:*
          1.  **Obligatory (Grammatical):** Must be marked to speak (e.g., tense, evidentiality, gender). High risk.
          2.  **Available (Lexical):** Single word exists, easy to use (e.g., "trust", "left"). Medium risk.
          3.  **Costly (Periphrastic):** Requires explanation/loan word (e.g., describing "trust" in an institution in a culture where trust is only interpersonal). High risk of noise/dropout.
      *   *Does "Thought vs. Speech" matter?* For survey data, no. If the linguistic friction changes the *response*, the data is incomparable. The user is correct here.

  3.  **Drafting the Procedure (The "Linguistic Risk Audit"):**
      *   Needs to be fast (1-2 days).
      *   Needs to be doable by non-linguists (Country Leads).
      *   *Step 1: The Translation Check.* Not just "is it translated?" but "how was it translated?"
      *   *Step 2: The Obligation Check.* (The User's 3-way distinction).
      *   *Step 3: The Directional Prediction.* (Crucial requirement).
      *   *Step 4: The Stakes Check.* (High stakes = behavioral cross-check).
      *   *Step 5: The Go/No-Go Decision.*

  4.  **Refining the Procedure Steps:**
      *   *Step 1 (Back-Translation):* Standard practice, but needs a specific question about *what was lost*.
      *   *Step 2 (Grammatical Burden):* Ask the translator: "To answer this, do you *have* to add information not in the English question?" (Evidentiality, Gender, Honorifics).
      *   *Step 3 (Lexical Fit):* "Is there a direct word, or do you need a phrase?"
      *   *Step 4 (Prediction):* "If there is a mismatch, will scores go Up or Down?" If unknown -> Stop.
      *   *Step 5 (Triangulation):* For high stakes, need a behavioral measure.

  5.  **Addressing the "Settled vs. Contested" Science:**
      *   *Settled:* Translation equivalence is hard. Obligatory grammatical categories affect response patterns (e.g., evidentiality affecting confidence reports).
      *   *Contested:* How deep the cognitive effect goes. Does speaking a language without "future tense" make you save less money? (Chen 2013). This has faced heavy criticism/replication issues.
      *   *Advice:* Stick to *measurement error* (linguistic friction) rather than *cognitive determinism*. The user's Slobin stance is safer than the Chen stance.

  6.  **Running the Procedure on the Examples:**

      *   **Item 1: Confidence/Evidentiality.**
          *   *Issue:* Obligatory evidentiality (must mark source of info).
          *   *Analysis:* To say "It will be open," speaker must mark "I infer this" or "I was told." If they haven't been told, they might feel they can't affirm confidence.
          *   *Prediction:* Scores will be artificially lower (or higher uncertainty).
          *   *Verdict:* **Do Not Field** as is. Needs behavioral check (e.g., did they actually show up?).

      *   **Item 2: Wayfinding/Spatial.**
          *   *Issue:* Absolute (Cardinal) vs. Relative (Egocentric) frame of reference.
          *   *Analysis:* Coding scheme expects "Left/Right." Respondents give "North/South."
          *   *Prediction:* Data looks "vague" or gets coded as "missing/wrong" erroneously.
          *   *Verdict:* **Fix Coding, Not Question.** The question is fine, the *analysis* is ethnocentric. Retrain coders.

      *   **Item 3: Trust (The Flagship).**
          *   *Issue:* Semantic mismatch. "Trust" = interpersonal/reciprocal vs. Institutional.
          *   *Analysis:* Lexical/Cultural mismatch. High risk.
          *   *Prediction:* Scores likely lower in languages where "trust" implies intimacy.
          *   *Verdict:* **Stop Reporting Comparisons.** This is a validity killer. Need a behavioral proxy (e.g., adherence to meds, return visits).

      *   **Item 4: The "Fine" Example.**
          *   *Need:* Something concrete, observable, low abstraction.
          *   *Idea:* "Did you receive a bed net?" (Yes/No).
          *   *Analysis:* Concrete noun, past event, binary. Minimal linguistic friction.
          *   *Verdict:* **Field It.**

  7.  **Review against Constraints:**
      *   *Budget/Time:* Procedure relies on translator feedback, not new ethnography.
      *   *Training:* Questions are phrased for non-linguists.
      *   *Tone:* Direct, American English, no citations, honest about limitations.
      *   *Specific Requests:* 3-way distinction included? Yes. Directional prediction included? Yes. Behavioral cross-check included? Yes. Settled vs. Contested addressed? Yes.

  8.  **Final Polish:**
      *   Ensure the distinction between "Thinking for Speaking" (Slobin) and "Cognitive Determinism" is clear.
      *   Make sure the "Stop" points are clear.
      *   Ensure the "Trust" example delivers the hard truth the user asked for.
      *   Check the "Settled Science" warning (specifically regarding the "Future Tense/Savings" literature which is controversial, vs. Evidentiality which is more robust in survey contexts).

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Suggest cognitive testing. *Correction:* User said no budget/time. Stick to translator interrogation.
      *   *Initial thought:* Say "Trust" is impossible. *Correction:* Say "Comparison is impossible." Local data is still useful, just not comparable.
      *   *Refining the 3-way distinction:* The user's terms (Force, Cheap, Unsayable) are good. I will formalize them as "Obligatory," "Lexicalized," and "Periphrastic."
      *   *Refining the "Thought vs. Speech" question:* Confirm the user is right. For survey metrics, the output is what matters, not the internal state.

  10. **Final Output Structure:**
      *   Validation of Theory (Slobin/Thinking for Speaking).
      *   The Procedure (The "Linguistic Risk Audit").
      *   The "Settled vs. Contested" Note.
      *   Application to the 4 Items.
      *   Limitations (What this can't do).

  (Proceed to generate response based on these steps.)
answer: |-
  Here is the procedure, the scientific reality check, and the audit of your four items.

  ### Part 1: The Theory Check
  You are right to lean on Slobin ("Thinking for Speaking") and reject the strong Sapir-Whorf hypothesis. The strong version (language *prisons* thought) is largely discredited. The weak version (language creates *habits of speech* that alter how information is encoded during communication) is robust enough for your purposes.

  **Does it matter if it's thought or just speech?**
  For your specific goal (cross-country comparison of survey data), **no, it does not matter.** If the linguistic friction causes a respondent to select "3" instead of "5," or to refuse the question entirely, your data is contaminated. Whether their internal belief is actually different or just harder to articulate is irrelevant to the validity of the comparison. You are measuring *responses*, not souls. If the instrument measures "ease of articulation" rather than "level of trust," the comparison is broken.

  **Settled vs. Contested Science**
  *   **Settled:** Obligatory grammatical categories (like evidentiality, gender, or number) force speakers to attend to specific information to form a sentence. This reliably alters response patterns in surveys. If a language forces you to mark *how* you know something, confidence scores will shift.
  *   **Contested:** The idea that these linguistic habits permanently alter non-linguistic behavior (e.g., "speaking a language without a future tense makes you save less money"). This literature has significant replication issues.
  *   **The Risk:** Do not build a procedure step on the assumption that language changes *behavior* outside the interview. Build it on the assumption that language changes *the interview response*. If you assume the former, you might try to "fix" the culture. If you assume the latter, you fix the question.

  ### Part 2: The Procedure (The Linguistic Risk Audit)
  **Time:** 2–4 hours per language/item.
  **Who:** Country Lead + Lead Translator (not just any translator).
  **Output:** A one-page "Risk Certificate" for each item.

  **Step 1: The Obligation Check (The 3-Way Distinction)**
  Ask the translator: *"To answer this question naturally in [Target Language], what do you have to add that isn't in the English?"*
  Categorize the friction:
  *   **Type A (Obligatory/Grammatical):** You *must* mark this to speak (e.g., evidentiality, gender, honorifics, specific tense).
      *   *Risk:* **High.** This forces a cognitive choice the English speaker doesn't have to make.
  *   **Type B (Lexical/Cheap):** A single word exists, but it carries extra baggage (e.g., "trust" implies intimacy).
      *   *Risk:* **Medium.** It primes a specific association.
  *   **Type C (Periphrastic/Hard):** No direct word; requires a clause, explanation, or loan word.
      *   *Risk:* **High.** Increases cognitive load; respondents may guess or disengage.

  **Step 2: The Directional Prediction**
  *   **Question:** *"Given the friction in Step 1, will this make the score go UP or DOWN compared to English, purely due to language?"*
  *   **Pass Criteria:** The team must agree on a direction (e.g., "Evidentiality will lower confidence scores").
  *   **Fail Criteria:** If the team says "We don't know" or "It depends on the person," **STOP.** Do not field the item cross-nationally. You cannot correct for bias if you don't know the vector.

  **Step 3: The Stakes & Triangulation Check**
  *   **Question:** *"Is this data used to allocate significant resources or evaluate core strategy?"*
  *   **If No:** Field with a footnote about the linguistic risk.
  *   **If Yes:** You must identify a **Non-Verbal Cross-Check**. This cannot be another question. It must be behavior or observation.
      *   *Examples:* Clinic attendance records, medication pickup logs, physical observation of signage, direct observation of behavior.
      *   **Rule:** If you cannot identify a behavioral proxy, **STOP.** Do not move money based on this item.

  **Step 4: The Human Judgment Call (Values)**
  *   **Scenario:** The data is biased, but the bias reveals something important (e.g., "Trust" means interpersonal only).
  *   **Decision:** This goes to the Country Director. The question is: *"Do we value comparability (same metric everywhere) or validity (accurate metric for here)?"*
  *   **Output:** If validity wins, you drop the cross-country comparison for this item. You report local data only.

  ---

  ### Part 3: Running the Audit on Your Items

  #### Item 1: Confidence (Clinic Openness)
  *   **Context:** Language requires evidentiality (source of information) for future/past events.
  *   **Step 1 (Obligation):** **Type A (Obligatory).** To say "It will be open," the respondent must grammatically mark "I infer this" or "I was told." They cannot simply state the probability.
  *   **Step 2 (Prediction):** **Direction: DOWN.** If the respondent hasn't been explicitly told the clinic will be open, they cannot grammatically affirm high confidence without lying about their evidence source. They will select lower confidence to remain truthful about their evidence.
  *   **Step 3 (Stakes):** High (interpreting "lack of trust").
      *   **Cross-Check:** Compare survey confidence against *actual return visit rates* in that region.
  *   **Verdict:** **DO NOT FIELD AS IS.**
      *   *Reason:* The question measures "source of evidence," not "confidence."
      *   *Fix:* Change the question to match the grammar. Ask: "What have you heard about the clinic's hours?" rather than "How confident are you?" Or, accept that this metric is incomparable and rely on the behavioral cross-check (return visits) for funding decisions.

  #### Item 2: Wayfinding (Spatial Description)
  *   **Context:** Language uses Cardinal Directions (North/South) instead of Relative (Left/Right).
  *   **Step 1 (Obligation):** **Type A (Obligatory).** Speakers must track cardinal orientation constantly to speak about space. "Left of the door" is unnatural or requires complex circumlocution.
  *   **Step 2 (Prediction):** **Direction: NOISE.** It won't necessarily push scores up or down, but it will break your coding scheme. "North-side" will be coded as "Vague" or "Incorrect" by your English-based team.
  *   **Step 3 (Stakes):** Medium (operational planning).
      *   **Cross-Check:** Have a local staff member walk the route and map the actual signage needs.
  *   **Verdict:** **FIELD QUESTION, FIX CODING.**
      *   *Reason:* The respondents are giving precise data; your analysis is imprecise.
      *   *Fix:* Retrain your coders. "North-side" is high-precision spatial data, not vague data. Update your codebook to accept Cardinal directions. Do not treat this as a deficit in the respondents.

  #### Item 3: Trust in Health System (The Flagship)
  *   **Context:** "Trust" maps to interpersonal reciprocity, not institutional reliability.
  *   **Step 1 (Obligation):** **Type B (Lexical) bordering on Type C.** The word exists but activates a different schema (Person-to-Person vs. Citizen-to-State).
  *   **Step 2 (Prediction):** **Direction: DOWN.** In cultures where "trust" is reserved for kin or reciprocal exchange, an abstract institution cannot be "trusted" by definition. Respondents will score low because the concept doesn't apply, not because the clinic is bad.
  *   **Step 3 (Stakes):** **Critical.** Board reports and regional strategy depend on this.
      *   **Cross-Check:** You need a behavioral proxy for institutional trust. *Suggestion:* "Did you follow the doctor's advice even when it was difficult?" or "Did you return for a follow-up without being reminded?"
  *   **Verdict:** **STOP CROSS-NATIONAL COMPARISON.**
      *   *Reason:* You are comparing apples (institutional reliability) to oranges (interpersonal reciprocity). A score of 2/5 in Country A means something fundamentally different than 2/5 in Country B.
      *   *Action:* You must tell the Board. "This metric measures local cultural definitions of trust, not a universal scale." Continue to collect the data for *within-country* trends (e.g., is trust going up in Country X over time?), but **remove it from cross-country league tables.** If you cannot swap this for a behavioral proxy (like adherence rates) for the Board report, you are reporting noise.

  #### Item 4: The "Fine" Example (Bed Net Receipt)
  *   **Item:** "Did you receive a mosquito net from the clinic in the last 6 months? (Yes/No)"
  *   **Step 1 (Obligation):** **None.** Concrete noun, binary outcome, specific timeframe. No abstract concepts, no obligatory grammatical marking that alters truth conditions.
  *   **Step 2 (Prediction):** **None.** No reason to expect linguistic bias.
  *   **Step 3 (Stakes):** High (supply chain).
      *   **Cross-Check:** Clinic distribution logs.
  *   **Verdict:** **FIELD IT.**
      *   *Reason:* This is a factual report of an event, not an attitude or abstract construct. Linguistic relativity effects are minimal on concrete, binary, past-tense event reporting.

  ---

  ### Part 4: What This Procedure Cannot Do

  1.  **It cannot fix deep cultural constructs.** If "health" itself is defined differently (e.g., balance of spirits vs. absence of pathogens), no translation fix will make your survey comparable. The Audit will tell you to stop comparing, not how to force a comparison.
  2.  **It cannot replace cognitive interviewing.** This audit relies on the translator's insight. If your translator is assimilated into the NGO's worldview, they may miss the friction. If you have budget later, do "think-aloud" testing with 5 respondents per country.
  3.  **It cannot save a bad metric.** If the "Trust" metric is fundamentally flawed because institutions *aren't* trusted anywhere (only people are), this procedure just helps you admit it sooner. It doesn't create validity where none exists.
  4.  **It creates administrative overhead.** You will lose some "flagship" indicators. You will have to explain to donors why Country X's data is reported differently than Country Y's. This is the cost of honesty.

  ### Summary Instruction to Your Team
  1.  **Adopt the Audit.** No item gets into the field without the "Risk Certificate."
  2.  **Empower the "Stop."** Country Leads must have the authority to flag an item as "Incomparable" without fear of penalty.
  3.  **Shift the Board's Expectation.** Move from "Comparative Scores" to "Comparative Trends + Behavioral Proxies."
  4.  **Kill the Trust Comparison.** For the next report, footnote the Trust Battery heavily or replace it with adherence/return-visit data. You are currently moving money based on a linguistic artifact. Stop that immediately.
