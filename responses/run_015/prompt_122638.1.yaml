answer: |-
  ### Pre-Work: The Exit Sentences

  Before planning the beats, here are the three sentences I want a participant to be able to say to a colleague in the hallway afterward. If they can't say these, the session failed.

  1.  "An undefined expectation doesn't mean the value is infinite; it means the value depends on the **order** in which you sum the outcomes."
  2.  "Treating an infinite gamble as a limit of finite ones isn't neutral; different ways of truncating the game yield different expected values."
  3.  "Expected Utility Theory doesn't tell you what to do here unless you add a structural assumption about how to aggregate the outcomes."

  Work backwards from these: Sentence 3 requires they see EU theory lacks a rule (Beat 6). Sentence 2 requires they see the truncation argument (Beat 5). Sentence 1 requires they understand the rearrangement property (Beat 3). Everything else is scaffolding.

  ---

  ### 1. The Dependency-Ordered Sequence (90 Minutes)

  **Beat 1: The Summation Intuition (0–15 mins)**
  *   **Content:** Do not start with St. Petersburg. It triggers the "infinite EV" schema and they will stop listening. Start with a finite gamble. Write $EV = \sum p_i v_i$ on the board. Ask: "Does the order of addition matter?" (No, commutative law). Ask: "Does it matter for an infinite sum?" (Pause).
  *   **Why:** You must establish that EV *is* a sum before you break the sum. If you start with the paradox, they treat it as a magic trick. If you start with the definition, you treat it as a boundary condition of their existing tools.
  *   **Transition:** "For finite games, order is irrelevant. For infinite games, mathematics tells us order is irrelevant *only if* the sum converges absolutely. Today we look at a game where it does not."

  **Beat 2: The Pasadena Structure (15–30 mins)**
  *   **Content:** Define the game payoffs and probabilities on the board. $p_n = 1/2^n$, payoff $v_n = (-1)^{n+1} 2^n / n$. (Keep the math visible).
  *   **Constraint:** Frame payoffs in **utils**, not dollars. (See Section 2).
  *   **Why:** They need the specific alternating harmonic series structure visible. Do not calculate the sum yet. Just establish the distribution exists (probabilities sum to 1) and payoffs are finite for every outcome.
  *   **Transition:** "Every outcome is finite. The probabilities sum to 1. This is a valid probability distribution. So where is the EV?"

  **Beat 3: The Rearrangement Shock (30–50 mins)**
  *   **Content:** Invoke the Riemann Rearrangement Theorem without proving it. Show that by reordering the terms of the series, you can make the sum converge to *any* real number, or diverge to $\pm \infty$.
  *   **The "Conditional Convergence" Guy:** **Recruit him here.** At minute 35, ask: "Who knows why this happens?" Let him say "conditional convergence." Validate him: "Exactly. Mathematically, you are 100% correct." Then pivot: "So if the math allows any value, what determines the value for a *decision maker*?"
  *   **Why:** You need his validation to prevent the math-literate from doubting the premise, but you must immediately pivot to the decision-theoretic implication so he doesn't reduce the session to a calculus review.
  *   **Transition:** "Mathematically, the sum is undefined. But we act in time. Does time fix it?"

  **Beat 4: The "Natural Order" Trap (50–65 mins)**
  *   **Content:** Reveal that summing in the natural order ($n=1, 2, 3...$) yields $\ln 2$.
  *   **Timing:** **Do not say this before Beat 3.** If you say this early, the session collapses into "Oh, it's ln 2, great." You must first establish that *other* values are equally valid mathematically.
  *   **Why:** Now $\ln 2$ looks like a convention, not a truth. It is the value *if* you assume the game is played by flipping a coin until heads appears and counting the flip number.
  *   **Transition:** "We get $\ln 2$ only if we privilege the natural ordering of the indices. Why privilege that ordering?"

  **Beat 5: The Truncation Argument (Shuffled Pasadena) (65–80 mins)**
  *   **Content:** Deploy your "Shuffled Pasadena" device. (See Section 5). Show that approximating the infinite game with finite ones depends on *which* finite subsets you choose.
  *   **Why:** This moves the problem from "math trick" to "modeling choice." It forces them to admit that calculating EV requires choosing a limit path.
  *   **Transition:** "If the value depends on how we approximate the game, then the gamble itself does not have a unique expected value."

  **Beat 6: Implications for "Shut Up and Multiply" (80–90 mins)**
  *   **Content:** Return to the exit sentences. EU theory requires a number to maximize. We don't have a unique number. Therefore, EU theory is silent without extra axioms.
  *   **Why:** Connect the math back to the rationalist habit you are trying to pressure.
  *   **Close:** Hand out index cards for the exit check.

  ---

  ### 2. The Single Carrying Example

  **Your Guess:** "Payoffs denominated in dollars... lack infinite positive expectation."
  **Correction:** You are wrong about **dollars**.
  If you denominate in dollars, your three econ/biostat students will immediately object: "Utility is logarithmic in money." If $U(x) = \ln(x)$, the Pasadena payoffs become $\ln(2^n/n) \approx n \ln 2$, and the series becomes absolutely convergent (or at least behaves differently). The paradox dissolves into risk aversion.
  **Requirement:** The example must be framed in **utils** (linear utility) or explicitly stipulate "assume linear utility of money for this thought experiment." You must prevent them from solving the paradox via bounded utility, because the lesson is about *undefined* expectations, not *infinite* ones.

  **Why St. Petersburg Fails as the Carrier:**
  St. Petersburg has an expected value of $+\infty$. The lesson there is "EV can be infinite." The lesson here is "EV might not exist." Using St. Petersburg encourages them to think Pasadena is just "St. Petersburg with negative terms." It isn't; it's structurally distinct (conditional vs. absolute divergence).

  **Why Two-Envelope Fails as the Carrier:**
  Two-Envelope is about inconsistent priors and conditional probability updates. It is a paradox of belief, not a paradox of summation order. It distracts from the core issue: the definition of expectation itself.

  **The Carrier:** The Pasadena Game itself is the only valid carrier. Do not wrap it in a story. Put the series on the board. Let the math be the story.

  ---

  ### 3. Misconception Table

  | Misconception | Why this audience brings it | Beat to Defuse | What to Say |
  | :--- | :--- | :--- | :--- |
  | "Undefined just means infinite; same lesson as St. Petersburg." | Engineers equate "breaks" with "blows up." They know St. Petersburg well. | Beat 1 & 3 | "Infinite means the sum grows without bound. Undefined means the sum oscillates or depends on order. One is a magnitude problem; the other is a structural problem." |
  | "Bounded utility (log utility) dissolves this, so there is nothing here." | Econ grads and rationalists know bounded utility solves St. Petersburg. | Beat 2 (Setup) | "We are stipulating linear utility. If you bound utility, the paradox vanishes, but so does the lesson about undefined expectations. We are testing the limits of EU theory, not finding a workaround." |
  | "The reordering is a math trick with no decision-theoretic content." | Engineers view math as separate from physical reality. | Beat 5 (Truncation) | "Decision theory requires us to compare finite approximations of infinite problems. If different approximations yield different values, the math trick becomes a modeling choice." |
  | "The coin-flip order is privileged, so the answer is ln 2, end of story." | The "Conditional Convergence" guy and anyone who trusts the 'natural' numbers. | Beat 4 | "The natural order is privileged only if the game is played by counting flips. If the game is offered as a contract paying based on outcome index, the order is arbitrary." |
  | "This is an artifact of infinite precision; no finite agent could ever be offered it." | Pragmatists who want to dismiss edge cases. | Beat 6 | "We use infinite models to approximate finite realities. If the infinite model doesn't converge uniquely, our finite approximations are unstable. That instability matters for engineering." |

  ---

  ### 4. Placement of the "Natural Order Converges to ln 2" Fact

  **Placement:** **Beat 4 (Minute 50).**
  **Reasoning:** If you reveal $\ln 2$ in Beat 2 (when defining the game), the tension evaporates. The audience will latch onto $\ln 2$ as the "answer" and treat the rearrangement argument (Beat 3) as a theoretical curiosity that doesn't apply to the "real" value.
  By withholding $\ln 2$ until *after* demonstrating that *any* value is possible via rearrangement, you frame $\ln 2$ as merely one option among many. It becomes the "default setting" rather than the "truth." This forces them to ask *why* we use the default, which leads directly into the truncation argument.

  ---

  ### 5. Evaluation of Your Devices

  **Device 1: "Shuffled Pasadena" (Finite Approximants)**
  *   **Verdict:** **Keep and Place in Beat 5.**
  *   **Reasoning:** This is your strongest pedagogical tool. It translates the abstract "reordering" into a concrete "truncation" problem that engineers understand (numerical stability). It demonstrates that "taking the limit" is not a unique operation unless you specify the path.
  *   **Revision:** Do not just describe it. Draw two different sequences of finite sets on the whiteboard. Set A adds terms $(1, 2, 3...)$. Set B adds terms $(1, 3, 2, 5, 7, 4...)$. Show the partial sums diverge from each other. Make it visual.

  **Device 2: Spreadsheet Demo (Simulation)**
  *   **Verdict:** **Cut It.**
  *   **Reasoning:** You are right to be uncertain. Simulating a game with undefined expectation is numerically noisy. The running average will not settle; it will wander wildly.
      *   *Risk 1:* Engineers will think their random number generator is buggy.
      *   *Risk 2:* They will think "we need more samples" (Law of Large Numbers intuition), but LLN *does not apply* here. Explaining why LLN fails takes too long.
      *   *Risk 3:* It consumes 15 minutes of setup/debug time for a result that looks like "noise" rather than "undefined."
      *   *Alternative:* Use the whiteboard to show the partial sums of two different orderings diverging. It's cleaner and undeniable.

  ---

  ### 6. The Exit Check (Index Card)

  **Question:** "You are offered the Pasadena game. Your colleague says: 'The expected value is $\ln 2$, so you should pay up to $\ln 2$ to play.' What is the specific **structural assumption** your colleague is making that allows them to calculate this number?"

  **Near-Miss Answer:** "They are assuming linear utility."
  *   *Why it fails:* Linear utility is a precondition for the paradox to exist, not the reason the value is $\ln 2$ specifically.

  **Near-Miss Answer:** "They are assuming the game is played infinitely many times."
  *   *Why it fails:* Irrelevant to the single-play expectation calculation.

  **Real Answer:** "They are assuming the outcomes are summed in the **natural order** (index $1, 2, 3...$) rather than any other ordering or truncation path."
  *   *Why it works:* It shows they understand that the value comes from the *ordering*, not just the distribution.

  **Positive Grip Indicator:** If they add, "Without that assumption, the value is undefined," they have fully internalized the lesson.

  ---

  ### 7. What to Refuse to Explain

  You must explicitly state what you are *not* doing to prevent the Q&A from hijacking the session. Say this at the start (Beat 1) and repeat if necessary.

  1.  **"I will not prove the Riemann Rearrangement Theorem."**
      *   *Say:* "Take it as a given from analysis. We are here for the decision theory, not the calculus proof."
  2.  **"I will not propose a solution to the paradox."**
      *   *Say:* "There is no consensus solution in the literature. Some say reject the game, some say use weak expectations. Today is about understanding why the standard tool breaks, not fixing the tool."
  3.  **"I will not debate Measure Theory definitions."**
      *   *Say:* "If you know Lebesgue integration, you know why this sum is undefined. If you don't, the details won't help. We are treating expectation as a sum."

  **Management of the "Conditional Convergence" Guy:**
  *   **Recruit:** Minute 35 (Beat 3). Ask him to confirm the math.
  *   **Shut Down:** Minute 45 (End of Beat 3). If he tries to argue that $\ln 2$ is the "correct" sum because of analytic continuation or similar, say: "That is a valid mathematical regularization, but it is not Expected Utility. We are testing EU, not complex analysis."
