prompt: |-
  You are a decision theorist who also teaches — graduate seminar experience plus a lot of one-off adult-education sessions — and you know how these ideas actually land on a room of smart non-specialists. Before you draft anything, spend some effort brainstorming: write down, for yourself, the two or three sentences you would want a participant to be able to say on the way out the door, then work backwards to the sequence that makes those sentences available. I want the reasoning behind the ordering, not a tidy-looking outline.

  The situation: I have been reading LessWrong since the Overcoming Bias days, and I run the monthly "hard problems" session at my city's rationalist meetup. Next month I get ninety minutes, a whiteboard, a projector, and no handouts beyond one index card per person. The room will be about twenty people: mostly working software engineers, three econ/biostat grad students, one retired math teacher, and one guy who has read the relevant encyclopedia article and will say "it's just conditional convergence" within the first five minutes — tell me whether to recruit him or shut him down, and when. Everyone there has met the St. Petersburg paradox before; maybe a third have a vague memory of the Pasadena game; nearly all of them have "shut up and multiply" as a reflex, which is precisely the habit I need to put pressure on for an afternoon.

  The topic is the Pasadena game and, more specifically, what it means that this gamble's expected value is undefined rather than merely infinite.

  Do not explain the paradox to me — I know it. Plan how I explain it. Concretely, give me:

  1. The dependency-ordered sequence, in four to six beats with rough minute marks: what has to be in place before what, and why. In particular, whether to open with St. Petersburg as a warm-up, given that it is the one thing in the room they all already know and the one thing most likely to make them file the new material under "infinite expected value, handled that already."

  2. The single example that carries the whole session, with an explicit account of what such an example must have and what it must lack. My own guess is that it must have payoffs denominated in dollars rather than in utils, a probability structure they can simulate in their heads, and a time-order sum that converges to a definite finite number, so that the temptation to accept that number is real; and that it must lack infinite positive expectation, so that nobody can retreat to the St. Petersburg moral. Tell me what I have wrong, and tell me why two candidate carriers I am tempted by — St. Petersburg itself, and a two-envelope-style framing — would each distort something.

  3. A misconception table: the misconception, why this particular audience brings it, the exact beat at which to defuse it, and one sentence of what I should say. The ones I expect are: "undefined just means infinite, same lesson as St. Petersburg"; "bounded utility, or log utility, dissolves it, so there is nothing here"; "the reordering is a math trick with no decision-theoretic content, since the gamble is just a function from outcomes to probabilities and that is order-invariant"; "the coin-flip order is privileged, so the answer is ln 2, end of story"; "this is an artifact of infinite precision, no finite agent could ever be offered it, so it cannot matter."

  4. Where in the sequence to place the fact that the partial sums in the natural order do converge — that the naive sum gives you a number — and why saying it too early collapses the whole session into "so it is ln 2, and the puzzle was conditional convergence."

  5. Two devices of my own that I want you to place, revise, or reject outright. First, my "shuffled Pasadena": a sequence of finite games, each assigning zero outside a growing finite set of outcomes, where the sets grow to cover every outcome, so that at each stage you have a perfectly ordinary finite gamble and in the limit you have exactly the Pasadena game — but the expectations of these finite approximants converge to whatever target I like. My claim is that this shows the value ln 2 comes from the temporal structure of the coin-flipping process rather than from the gamble considered as a distribution over payoffs, and that "take the limit of finite truncations" does not single out ln 2 unless you privilege one approximating sequence. Is that the right instrument, and does it belong before or after the rearrangement point? Second, a spreadsheet demo: have a few people simulate repeated plays on their phones and watch the running average fail to settle. I believe this is right but I am not certain it will show what I want it to show, and I would rather cut it than have it misfire.

  6. The exit check on the index card: the question that distinguishes someone who has understood from someone who has learned the phrase "the expectation is undefined." Tell me what a near-miss answer looks like and what a real one looks like, and in particular what a participant would have to say to count as having a positive grip on the issue rather than just a negative one.

  7. What I should pointedly refuse to explain at this level, and say out loud that I am refusing.

  Constraints: no reading list, no citations, no "the literature distinguishes" — I want the teaching plan and nothing else. Do not spend words flattering the setup. If any part of what I have proposed above is confused, or if one of my beats is in the wrong place, say so plainly; I would rather be corrected in the plan than discover it in front of twenty people.
