answer: |-
  The Lifeboat analogy collapses under your mechanics of graded risk and utility gain, yet the Mate's conclusion survives only if probabilistic danger outweighs navigational efficiency, while the Hospital analogy fails to acknowledge the finite stakes of survival.

  **Correspondence Tables**

  | Element | Lifeboat Case | Field Hospital Case |
  | :--- | :--- | :--- |
  | **Boat** | Container / Property | Workspace / Ward |
  | **Provisions** | Fixed Pie (Zero-Sum) | Consumables (Replenishable) |
  | **Gunwale** | Hard Threshold (Binary) | Operational Limit (Flexible) |
  | **Authority** | Ownership / Custody | Triage Ethics / Duty |
  | **Duty** | Non-maleficence (Occupants) | Beneficence (All Patients) |

  **Audit**

  The Lifeboat case breaks at the Gunwale and the Swimmer. Your graded gunwale replaces a binary cap with a sliding probability curve; this is load-bearing because it transforms safety from a condition to a wager. The sextant swimmer breaks the "fixed pie" assumption; he is an asset, not a burden. This is load-bearing: if he shortens the passage, he saves more rations than he consumes, invalidating the Mate's scarcity math. The Lifeboat smuggles a zero-sum game your scene does not have, implying the occupants owe the swimmers nothing because the total is fixed.

  The Hospital case breaks at Provisions and Stakes. A field hospital expects resupply and evacuation; your boat offers neither. This is load-bearing because triage implies optimizing outcomes within a functioning system, not preventing system collapse. The Hospital smuggles institutional permanence and an impartial allocator, assuming a shared project where care can continue indefinitely.

  Does the Mate's conclusion survive? Only if the graded risk of swamping exceeds the ration savings of the shorter passage. If the sea is calm, the Mate is mathematically wrong, not just morally cold. If the sea is rough, the Mate is a risk-manager, not a hoarder. The Hospital analogy cannot save the Surgeon because ethics cannot override physics; if the boat sinks, there are no patients.

  Your twists are not defects; they are the scene. The standard Lifeboat case relies on hard capacity and passive burdens to justify refusal. By making capacity probabilistic and the burden potentially beneficial, you have removed the Mate's default justification. He cannot argue from scarcity; he must argue from volatility.

  A better analogy is *The Venture*. The boat is a shared stake; the swimmer is a potential partner offering capital (navigation) in exchange for equity (life). The argument shifts from charity to contract: is the risk premium worth the investment? This honors both competencies. The Mate calculates risk; the Surgeon calculates value. Both are right until the sea decides. This framing forces the Mate to admit the swimmer's value while maintaining his refusal based on volatility, and forces the Surgeon to admit the finite stakes while maintaining his duty based on utility. It makes the hinge turn on the weather, not just the will.
