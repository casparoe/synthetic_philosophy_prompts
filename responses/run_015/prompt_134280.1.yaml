  # Taxonomy of Brain Size and Moral Relevance

  **Instructions:** Begin at the root (Question 1). Follow the path dictated by your judgment on each concrete case. At the leaves, you will find a descriptive label for your position and a note on its most awkward commitment.

  ### **Q1: The Hedonic Twin Shrimp**
  Imagine a shrimp and a cow are proven to have identical capacity for suffering and joy per minute. Does the cow's larger brain grant it *more* moral weight per minute?
  *   **No (Substrate is Evidential):** Go to **Q2**.
  *   **Yes (Substrate is Constitutive):** Go to **Q5**.

  ---

  ### **Branch A: Substrate is Evidential (The "No" Path)**
  *You believe brain size only matters insofar as it indicates capacity for experience.*

  **Q2: The Redundant Hardware Twins**
  Two beings behave identically and report identical inner lives. One uses 100x more neurons to do it (redundant/wasteful hardware). Does the wasteful one count for more?
  *   **Yes (Efficiency Matters):** Go to **Q4**.
  *   **No (Efficiency Irrelevant):** Go to **Q3**.

  **Q3: The Hemispherectomy Human**
  A human loses half their brain early in life but functions normally. Do they lose moral status compared to a two-hemisphere human?
  *   **No:** **Leaf 1: Phenomenal Purist.**
      *   *Awkward Commitment:* Must deny that enhancing a being's brain capacity enhances its moral value even if phenomenology expands.
  *   **Yes:** **Leaf 2: Potentiality Realist.**
      *   *Awkward Commitment:* Must claim a disabled human with less hardware outweighs a fully enabled animal with more.

  **Q4: The AI Parameter Scale**
  Two artificial systems behave identically, but one has 1000x more parameters/compute. Does the larger one count for more?
  *   **No:** **Leaf 3: Functionalist Egalitarian.**
      *   *Awkward Commitment:* Must treat a simple script and a complex simulation as equal if outputs match.
  *   **Yes:** **Leaf 4: Substrate Weighter.**
      *   *Awkward Commitment:* Must value inefficiency as a moral good, implying waste generates value.

  *(Note: The combination of Q1=No and Q2=Yes is rarely occupied; it implies hardware mass matters even when function is identical, which contradicts the view that substrate is merely evidence for function.)*

  ---

  ### **Branch B: Substrate is Constitutive (The "Yes" Path)**
  *You believe neural machinery adds moral value independently of reported experience.*

  **Q5: The Sensory Blob**
  A creature has a brain three times a human's mass, but it is almost entirely a single high-resolution sensory map with no association cortex. Does it outweigh a human?
  *   **Yes:** **Leaf 5: Mass Materialist.**
      *   *Awkward Commitment:* Must accept that a large, simple sensory organ generates more moral value than a complex, reasoning mind.
  *   **No:** Go to **Q6**.

  **Q6: The Association Animal**
  An animal has 3x human association neurons but no language or long-term planning. Does the extra neural bandwidth (more distinct experiences per unit time) outweigh human depth?
  *   **Yes:** **Leaf 6: Structural Maximiser.**
      *   *Awkward Commitment:* Must value unused processing power over actualised experience.
  *   **No:** Go to **Q7**.

  **Q7: The Chicken/Shrimp Gradient**
  Is the difference between a chicken and a shrimp a sharp threshold (one counts, one doesn't) or a scalar slide (one counts for more)?
  *   **Threshold:** **Leaf 7: Threshold Materialist.**
      *   *Awkward Commitment:* Must accept a single neuron difference flips moral status from zero to full.
  *   **Scalar:** Go to **Q8**.

  **Q8: The Uncertainty Heuristic**
  Even if brain size doesn't *strictly* determine value, should institutions use it as a proxy because it's measurable?
  *   **No:** **Leaf 8: Epistemic Purist.**
      *   *Awkward Commitment:* Must advocate for unmeasurable criteria in policy, risking arbitrary enforcement.
  *   **Yes:** Go to **Q9**.

  **Q9: Moral Agent Symmetry**
  If brain size increases moral value for patients (suffering), does it also increase responsibility for agents (blame)?
  *   **No:** **Leaf 9: Patient-Only Materialist.**
      *   *Awkward Commitment:* Must accept that a larger brain makes you more worth protecting but not more accountable for harm.
  *   **Yes:** **Leaf 10: Symmetric Materialist.**
      *   *Awkward Commitment:* Must accept that a being with a smaller brain is less blameworthy for identical crimes.

  ---

  ### **Diagnosis of Unoccupied or Unstable Combinations**

  *   **The "Friend's Concession" (Species-Constitutive / Individual-Evidential):**
      *   *Position:* Neuron counts matter between species (Q1=Yes) but not for human variance (Q3=No).
      *   *Diagnosis:* **Logically Unstable.** This view treats neural tissue as constitutive of value generally, but magically irrelevant within a specific species boundary. It requires a "species-normal" baseline that is biologically arbitrary but morally rigid.
  *   **Silicon Exceptionalism (Q1=Yes / Q4=No):**
      *   *Position:* Biological mass counts constitutively, but silicon parameters do not.
      *   *Diagnosis:* **Carbon-Chauvinist.** This position is coherent but requires a defense of why organic lipid membranes generate moral value that synthetic gates do not, independent of function.
  *   **Inseparable Leaves:**
      *   **Leaf 8 (Epistemic Purist)** and **Leaf 1 (Phenomenal Purist)** are often inseparable in practice. If you believe only phenomenology matters (Leaf 1), you logically cannot support using brain size as a policy proxy (Leaf 8) without admitting you are knowingly enforcing a false metric.

  ### **Key Distinctions Map**
  *   **Quantity:** Raw Mass (Leaf 5), Neuron Count (Leaf 6), Parameters (Leaf 4).
  *   **Status:** Evidential (Branch A), Constitutive (Branch B).
  *   **Scaling:** Threshold (Leaf 7), Scalar (Leaf 10).
  *   **Experience:** Intensity (Leaf 2), Bandwidth/Grain (Leaf 6).
  *   **Symmetry:** Patient Only (Leaf 9), Symmetric (Leaf 10).
  *   **Policy:** Truth (Leaf 8), Proxy (Leaf 10).
