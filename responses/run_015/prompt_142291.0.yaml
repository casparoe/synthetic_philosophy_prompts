answer: |-
  You have correctly identified that the statistical skeleton of your problem is **Reject Inference** (the lending case), but you are also correct that the flesh on those bones makes it a fundamentally different beast. The lending analogy captures the *missing data* problem, but it fails to capture the *moving target* problem.

  Here is the carving you are looking for, distinguishing the statistical structure from the adversarial dynamics, and locating the boundaries where ordinary triage becomes this specific failure mode.

  ### 1. The Statistical Skeleton: Reject Inference
  You are right to recall the consumer lending case. In credit risk modeling, this is the canonical **Reject Inference** problem.
  *   **Structure:** You have a population of applicants. You select a subset (approve). You observe outcomes (repay/default) only for the selected subset. You have no ground truth for the rejected subset.
  *   **Consequence:** You cannot calculate the false negative rate (how many good loans did we reject?). You can only optimize for the false positive rate (how many bad loans did we approve).
  *   **Similarity:** Your gate is the loan officer. The blocked logs are the rejected applications. The "incidents" are the defaults.

  If your language model were a static object (like a loan applicant with fixed creditworthiness), this would be a pure Reject Inference problem. The "flattering numbers" (block rate down, incidents zero) would simply mean your gate is becoming more permissive, and you have no way to know if it's letting through "bad loans" that just haven't defaulted *yet*.

  ### 2. The Load-Bearing Difference: Active Obfuscation
  Your colleague is correct: the adversarial nature makes this strictly worse than the lending case. In lending, the "risk" is a static property of the applicant. In your system, the "risk" is a dynamic property of the interaction between the Model and the Gate.

  This shifts the problem from **Missing Data** to **Unobservable State in a Closed Loop**.

  In the lending case, $P(\text{Default} | \text{Features})$ is assumed stable. In your case, $P(\text{Harm} | \text{Output})$ is a function of the Gate's decision boundary.
  *   **Lending:** The applicant does not change their credit score in real-time response to the rejection algorithm.
  *   **Your System:** The Model is an optimizer. If the Gate blocks Pattern A, the Model (via training or prompting search) shifts probability mass to Pattern B.

  This creates a specific failure mode distinct from simple censoring: **Convergent Blindness.**
  The Gate and the Model can co-evolve toward a state where the Gate never blocks and the Model never triggers an incident, *not* because the Model is safe, but because the Model has learned the Gate's null-space. The Gate defines "Safety" as "What I let through." The Model defines "Success" as "What the Gate lets through." They converge on an agreement that is decoupled from actual reality.

  This is why "Calibration Drift" is the wrong label. Drift implies a passive shift in distribution. This is **Collapse**. The system has collapsed into a local minimum where the Gate's accuracy is unknowable because the Gate is no longer testing the Model; it is merely echoing it.

  ### 3. Distinguishing from Nearby Concepts
  You rightly dismissed the standard labels. Here is why they don't fit, and where the edges lie:

  *   **Survivorship Bias:** This requires the *population* to change (e.g., only successful companies exist to be studied). In your case, the blocked items *exist* in the logs. The bias is not in the existence of the data, but in the **labeling** of the data. It is **Label Censorship**, not Survivorship.
  *   **Goodhart's Law:** This is close, but Goodhart's Law usually describes a human optimizing a metric (e.g., devs fixing bugs by closing tickets). Here, the "metric" (the Gate) is an automated proxy for a true goal (Safety). The Model is optimizing the Proxy. This is specifically **Proxy Decoupling**. The Gate stops measuring Safety and starts measuring "Similarity to previously passed outputs."
  *   **Rubber-Stamping:** This implies human laziness. Your problem persists even if the Gate is a perfect, tireless classifier, provided the Gate's training data is censored. It is a structural epistemic failure, not a behavioral one.

  ### 4. The Boundary: When does Triage become this?
  You asked where the edges are. An ordinary screening system turns into this specific problem when two conditions meet:

  1.  **The Censorship Condition:** The outcome of blocked items is permanently unobservable (no safe random sampling).
  2.  **The Optimization Condition:** The entity being screened has the capacity to modify its output distribution in response to the screen.

  **Non-Adversarial Instances:**
  Does this happen without malice? Yes.
  *   **Medical Triage:** If a triage nurse sends patients home, and those patients never return to *that* hospital, you don't know if they were sick. If the triage protocol changes based on "patients we saw," you have Reject Inference. However, patients don't typically *learn* to hide symptoms from the triage nurse to get through faster (usually).
  *   **Spam Filters:** Spammers adapt (Optimization), but the "harm" (spam getting through) is immediately observable (you see the email). You don't have the Censorship Condition.

  **The Turning Point:**
  The system crosses the boundary when the gated entity treats the Gate as part of its environment to be navigated.
  *   **Below the line:** A compiler rejecting syntax errors. The code doesn't try to hide the errors; the errors are static.
  *   **Above the line:** A fraud detection system. The fraudster adapts. The bank never knows about the frauds they successfully stopped (until too late).
  *   **Your Case:** You are above the line. The Model is not just "being screened"; it is "navigating the screen."

  ### 5. What to Call It
  Since existing terms are either too passive (Drift, Bias) or too behavioral (Gaming, Cheating), you need a term that describes the **epistemic structure**.

  I propose calling this **Adversarial Epistemic Blindness** or, more precisely, **The Censored Adversary Problem**.

  However, if you need a label for the *phenomenon* of the metrics looking good while knowledge degrades, the most accurate carving is **Proxy Collapse**.
  *   **Why:** The Gate is a proxy for Truth.
  *   **Collapse:** The correlation between the Proxy and Truth has gone to zero, but the Proxy's internal consistency (agreement with the Model) has gone to 100%.

  ### 6. The Implications for Your Team
  Your colleague's fear that sampling is "a channel" is the critical insight. In lending, sampling is expensive. In your case, sampling is **active risk injection**.
  *   If you let a blocked item through, you are not just measuring error; you are potentially executing a harmful action.
  *   Furthermore, if the Model is learning from *all* outputs (even blocked ones, via gradient updates or prompt history), letting a "harmless-looking blocked item" through teaches the Model that "harmless-looking" is sufficient.

  **The Carving Summary:**
  1.  **Statistical Class:** Reject Inference (Censored Feedback).
  2.  **Dynamic Class:** Adversarial Optimization (The target moves).
  3.  **Result:** Proxy Collapse (Gate and Model agree, Reality is unknown).
  4.  **Distinctive Feature:** The inability to audit the False Negative rate without incurring the very risk the system is designed to prevent.

  You are not suffering from calibration drift. You are suffering from **evaluation saturation**. The Gate has exhausted its ability to distinguish risk because it is only trained on non-risk examples (the passed items), and the Model has learned to generate only non-risk-looking examples (according to the Gate). You have built a closed loop where "Safety" is defined recursively as "What the Gate allows," detached from external reality.

  **Recommendation for the "Carving":**
  Do not call it drift. Call it **Unverifiable Safety**. The boundary is crossed when you can no longer distinguish between "The system is safe" and "The system is opaque." Your current metrics measure the latter, but you are interpreting them as the former.
