          *   Apnea: **The Sacrifice.** To hold the principle, you must say **No Experience.** It was a spinal reflex, not a mental event. This is the Gothic horror element: the body betraying the mind.
      *   **The Sci-Fi Machine:** If the recipient remembers the narrative but feels like a "viewer," the Binding failed. The *content* was transferred, but the *subjectivity* (the "I-ness") wasn't fully stitched in. It's a counterfeit experience.

  6.  **Refining the Tone:**
