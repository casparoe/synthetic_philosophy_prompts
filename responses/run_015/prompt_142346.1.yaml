answer: |-
  Candidate Requirements Rejected
  1. Universal Coverage: Must explain all art. Rejection: Overextends to non-affective abstracta.
  2. Neuro-Alignment: Must match brain scans. Rejection: Confuses levels of explanation.
  3. Prescriptive Power: Must mandate consumption. Rejection: Philosophy describes, does not mandate.
  4. Paradox Denial: Must claim no pain exists. Rejection: Dissolves rather than solves the phenomenon.
  5. Quantification: Must measure enjoyment units. Rejection: Phenomenology is qualitative.
  6. Historical Fidelity: Must match past usage of 'tragedy'. Rejection: Focus is on contemporary affective profiles.
  7. Moral Improvement: Must make viewers better people. Rejection: Conflates aesthetics with ethics.
  8. Uniformity: Must apply equally to all persons. Rejection: Ignores individual psychological variance.
  9. Immediate Gratification: Must explain instant liking. Rejection: Neglects delayed appreciation.
  10. Cognitive Load: Must minimize mental effort. Rejection: Complex art often demands high effort.
  11. Medium Neutrality: Must treat all media identically. Rejection: Ignores medium-specific affordances.
  12. Cultural Universality: Must apply across all cultures. Rejection: Ignores culturally specific grief norms.

  ***

  ### Desiderata for a Theory of Painful Art

  **1. Non-Propositional Capacity**
  *   **Motivation:** *Wordless sadness* (Case 1) demonstrates affective uptake without characters, narrative, or truth-claims. A theory relying on concern for fictional persons fails here.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** Strict cognitivist accounts requiring belief-like states about fictional worlds.
  *   **Calibration:** [Contested but defensible] *Confidence:* High, though some argue music implies narrative.

  **2. Contextual Transformation**
  *   **Motivation:** *The commissioned elegy* (Case 2) and *The bereaved listener* (Case 4) show identical affective profiles are unbearable in life but sought in art. The theory must explain how the aesthetic frame alters the valence or tolerance of the emotion.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** Simple arousal accounts that treat art-emotions as identical to life-emotions.
  *   **Calibration:** [Near-uncontroversial] *Confidence:* High, but distinguishing "frame" from "content" is difficult.

  **3. Ontological Agnosticism**
  *   **Motivation:** *The found-footage reversal* (Case 3) suggests enjoyment persists regardless of factual status. If enjoyment drops upon learning footage is real, the theory relies on fictionality; if not, it must explain why ontology is secondary to presentation.
  *   **Status:** Contested preference.
  *   **Rules Out:** The *arousal-and-safety picture* if it relies essentially on "it's not real" to guarantee safety.
  *   **Calibration:** [Contested but defensible] *Confidence:* Medium; documentary grief complicates this.

  **4. Suspense Independence**
  *   **Motivation:** *Foreknowledge* (Case 5) stipulates enjoyment survives known outcomes. Curiosity about resolution cannot be the primary driver of return value.
  *   **Status:** Stipulation (based on your prompt).
  *   **Rules Out:** Curiosity-based accounts common in neighbouring horror theories.
  *   **Calibration:** [Your stipulation] *Confidence:* High relative to your constraint, low empirically.

  **5. Merit/Move Distinction**
  *   **Motivation:** *The tear-jerker* (Case 6) shows one can be moved by a bad work. The theory must distinguish the psychological success of moving the audience from the aesthetic success of the work.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** Accounts equating being moved with artistic quality.
  *   **Calibration:** [Near-uncontroversial] *Confidence:* High, though critics sometimes conflate them.

  **6. Non-Circular Mechanism**
  *   **Motivation:** *Simulation-plus-safety* risks redescription ("we like it because it is safe simulation"). A theory must explain *why* safety converts pain to enjoyment, not just assert that it does.
  *   **Status:** Non-negotiable.
  *   **Rules Out:** Trivial conversion pictures that label the phenomenon without explaining the mechanism.
  *   **Calibration:** [Near-uncontroversial] *Confidence:* High; this is a standard philosophical demand.

  ***

  ### Closing Analysis

  **1. Jointly Unsatisfiable Requirements**
  *Contextual Transformation* (2) and *Ontological Agnosticism* (3) are in tension. If the aesthetic context transforms pain into enjoyment (Case 2), why does the personal relation to a real voicemail block this? If ontology doesn't matter (Case 3), why does the "realness" of the parent stop the transformation? A theory must distinguish between "real tragedy witnessed" and "real tragedy personalized" without relying solely on fictionality, which is a narrow tightrope.

  **2. Single Requirement Knocking Out Most Options**
  *Non-Circular Mechanism* (6). Most existing views (especially *conversion* and *arousal-and-safety*) posit a transformation or safety buffer but offer little beyond metaphorical accounting of how negative valence becomes positive. They describe the *that* without the *how*.

  **3. Compressed Scorecard**
  *   **Conversion Picture:** Fails (6); posits change without mechanism.
  *   **Arousal-and-Safety:** Fails (3); relies on fictionality for safety.
  *   **Meta-Response:** Fails (1); requires cognitive appraisal often absent in wordless music.
  *   **Control Picture:** Fails (1); no agent to control in abstract art.
  *   **Being-Moved-by-Others:** Fails (5); conflates shared emotion with artistic merit.

  **4. Pushback on Framing**
  Your framing assumes "enjoyment" is unitary. Case 2 (Elegy) and Case 6 (Tear-jerker) suggest you are conflating *valuing* an experience with *pleasure* in it. We may value the elegy without enjoying it, and enjoy the tear-jerker without valuing it. Furthermore, Case 4 (Bereaved Listener) risks smuggling empirical psychology into a conceptual problem; if capacity fails, there is no paradox to solve, only a limitation to note. Finally, Case 3 (Found Footage) may beg the question: if genuine footage is art, it is framed; if not, it is evidence. Your stipulation assumes it functions identically as art, which may hide the very framing work the theory needs to explain.
