answer: |-
  Dear Colleague,

  This is an ambitious design for a ninety-minute slot, and while it is pedagogically sound, the logistics of six distinct rounds with eighteen students will eat your time if you are not ruthless about transitions. To make this work without turning into a card-counting exercise, you should prepare the signal decks before class begins. I know you asked for on-the-fly randomization, but counting out eleven red cards and seven black cards six separate times while eighteen students watch will consume forty minutes of your seminar. The cleanest solution that preserves the feeling of live randomness is to pre-sort six small stacks of eighteen cards into envelopes, each stack configured for the specific competence level of that round, and then shuffle and deal them in front of the class. This ensures the probabilities hold without the dead air of counting. You will need a standard deck of cards, minus the face cards to keep the binary red-black distinction clear, along with a set of envelopes for the ballots, index cards for voting, and the two colors of dot stickers to mark the envelopes if you wish to track rounds. For the payoff scheme, since you have no budget, use time as currency. Tell the class at the start that if the collective majority gets at least four of the six rounds correct, everyone gets to leave five minutes early. This aligns their incentives with the epistemic goal without introducing monetary noise, though it does introduce a cooperative pressure that you will need to contextualize in the debrief.

  For the mechanics of the truth and signals, designate one envelope as the State of the World. At the start of each round, draw a card from a separate main deck in front of them, place it in the envelope without showing them, and seal it. Red represents State A, Black represents State B. For the private signals, deal one card from the pre-sorted signal deck to each student. They look at their card privately, then vote on the State of the World by writing A or B on an index card and placing it in a ballot envelope. For the first round, configure the signal deck so that the probability of a signal matching the truth is roughly 0.55. With eighteen voters, the majority will be correct only about sixty percent of the time, which is far from the certainty the asymptotic theorem promises. When you reveal the truth, there is a high chance they will lose this round. Do not apologize if this happens. This failure is the lesson. It demonstrates that the convergence claim is a limit property that offers little comfort at seminar-sized N. For the second round, invert the competence. Configure the signal deck so the probability of a signal matching the truth is 0.45. If they vote sincerely based on their private signal, the majority will now be confidently wrong. This exposes the competence assumption as load-bearing. If the competence drops below chance, aggregation amplifies error rather than canceling it.

  The third round introduces the public signal to break independence. Keep the private signals at 0.55 competence, but project a single large card on the screen that everyone sees. Configure this public signal to be correct only 0.60 of the time, but make it common knowledge. You will likely see the group ignore their private signals and follow the public one, creating a ceiling on accuracy that cannot be lowered by adding more voters. This visualizes the correlation problem. For the fourth round, you want to demonstrate the mechanism dependence via sequential voting. Use the same signal distribution as the first round, but instead of secret ballots, have them vote aloud in seating order. To ensure you get the cascade effect you described, where the result flips compared to the simultaneous round, you should hand-deliver the signals to the first two students rather than letting them draw from the deck. Give the first two students signals that match each other but contradict the truth, while the rest of the deck remains weighted toward the truth. When the first two vote confidently based on their signals, the third student, seeing two votes against their own private signal, will often rationally ignore their own information and follow the predecessors. This creates an informational cascade where the mechanism, not the world, dictates the outcome.

  The fifth round addresses your hobbyhorse regarding the budget of attention. Give two students perfect signals, perhaps by giving them Jokers that you have pre-designated as infallible, while the other sixteen receive coin-flip signals from a deck with equal reds and blacks. The class must decide whether to vote or defer. If they vote by majority, the noise from the sixteen novices will likely drown out the two experts. If they defer, they violate the one-person-one-vote norm. This is where you must be careful in the debrief to flag that the trade-off between buying many cheap signals versus few expensive ones is a normative extension of the theory, often associated with work on optimal jury size, rather than a feature of the Condorcet theorem itself. The theorem assumes fixed competence. Your framing invites them to think about resource allocation, which is valuable, but you should explicitly label it as your specific theoretical lens so they do not conflate it with the arithmetic of the theorem. The sixth round introduces asymmetric costs. Define State A as Guilty and State B as Innocent. Stipulate that convicting an innocent person costs the class ten points, while acquitting a guilty person costs one point. Ask them to vote on the aggregation rule before seeing signals. They may demand a supermajority. This distinguishes between the epistemic capability of the group and the decision threshold required by their loss function. It shows that a supermajority requirement is not necessarily epistemic caution but might be a reflection of asymmetric error costs.

  When you debrief, map each round directly to the assumption it stressed. Round one and two map to the competence assumption and the finite N problem. Round three and four map to the independence assumption, distinguishing between common causes of error and informational cascades. Round five maps to heterogeneity, and round six to the loss function. You must be frank about what the activity cannot reproduce. The most significant limitation is the convergence claim itself. Eighteen students cannot show a limit. You will have to tell them that the theorem claims certainty as N approaches infinity, but their experience was purely finite variance. You also cannot reproduce endogenous information acquisition. In the activity, the signals are given. In reality, voters choose whether to become informed. This is where your budget framing lives, but it is outside the scope of the theorem. Regarding the settled versus contested distinctions, be clear that the arithmetic of the binomial distribution under the assumptions is settled mathematics. What is contested is whether any real electorate satisfies the assumptions of independence and competence greater than chance. Some scholars argue that deliberation can improve competence, while others argue it destroys independence. Some argue that democracy is not about truth-tracking at all but about legitimacy. You should present the activity as a model of the truth-tracking claim, not a proof of democratic validity.

  There are several ways this will predictably go wrong, and you should prepare your responses now. The most likely failure is that in round one, the majority gets it right despite the low competence. Students may conclude the theorem works perfectly at small N. You must counter this by running the probability calculation on the board immediately to show they got lucky, emphasizing that the mechanism is probabilistic, not deterministic. Conversely, if they lose round one, they may feel the mechanism is broken. You must validate that loss as the expected variance. In the sequential round, a confident first speaker might not anchor the group if the second speaker is equally confident and disagrees. If the cascade fails to materialize, do not force it. Use it to discuss the conditions required for cascades, specifically that private signals must be weak relative to the public information of previous votes. Another risk is trust. Students may suspect you rigged the deck, especially if the experts lose in round five. Mitigate this by letting a student shuffle the signal decks before dealing. If a student holds up their card or reveals their signal early, stop the round immediately. Explain that this violates the independence assumption and ruins the data, then restart if time permits. This disruption itself is a lesson in the fragility of the assumptions.

  Finally, regarding your budget framing, I must be honest that while it is a compelling pedagogical hook, it is your hobbyhorse rather than a standard implication of the Condorcet Jury Theorem. The theorem treats competence as a parameter, not a variable purchased with attention. By framing it as a budget problem, you are importing ideas from the economics of information into a political theory model. This is a fruitful synthesis, but you should flag it as such during the debrief so students understand where the theorem ends and your extension begins. If you present it as inherent to the theorem, you risk confusing the arithmetic with the normative application. The activity will succeed if they leave understanding that the theorem is a mechanism with fragile assumptions, not a slogan about crowds being wise. It will fail if they leave thinking you proved democracy works mathematically. Keep the focus on the load-bearing nature of independence and competence, and let the democracy question remain open for the next seminar. Good luck with the session.
