answer: |-
  So I'm arguing with my friend about whether "all bachelors are unmarried" is actually true, right?

  He's like, "Duh, it's analytic. It's true by definition. You can't argue with that."

  I hit him with the Quine bomb: "Nah, bro, that's just Dogma One. That whole analytic-synthetic line is fake. There's no clear difference between that and a synthetic fact."

  He's confused, so I explain the web of belief. I'm like, "Imagine all our knowledge is a spiderweb. That statement is just a node really close to the center, near logic and math. But reductionism is dead—you can't verify any statement alone. It all depends on the whole field of force."

  He asks, "So you're saying a bachelor could be married?"

  I say, "Technically, yeah. If enough weird stuff happens on the periphery, you can revise *anything* to make the web fit. Even logic. Even math."

  He looks at me and says, "So you're saying you'd literally change the laws of logic just to avoid admitting you're wrong about a definition?"

  I say, "Exactly. I'd revise the law of non-contradiction before I admit I forgot her birthday. It's all just about how much chaos you're willing to cause in the rest of the web."

  He says, "That's not philosophy, that's just being stubborn."

  I say, "No, it's holism. Now lend me five bucks."

  He says, "2+2=4, so no."

  I say, "Not if I tweak the center enough."
