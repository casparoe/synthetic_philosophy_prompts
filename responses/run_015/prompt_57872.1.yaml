      *   The function $f(t)$ describing the lamp's state is defined for $0 \le t < 2$.
      *   At $t = 2$, the function is undefined.
      *   Physics/Logic doesn't provide a rule for the limit of the *state*, only the limit of the *time*.
      *   Thomson's original point was to argue that supertasks are logically impossible, not just physically impossible.

  4.  **Address the User's "Killer Argument" (The Counter):**
