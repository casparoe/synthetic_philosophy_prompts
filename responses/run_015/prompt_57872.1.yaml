      *   *Claim 2: "$1-1+1-1... = 1/2$ means half-on."*
          *   **Fact Check:** This refers to Cesàro summation or Ramanujan summation. It's a useful mathematical tool for assigning values to divergent series, but it doesn't describe the *physical state* of a binary system (on/off) at a specific limit point. A lamp can't be "half-on" in the binary logic of the paradox.

  3.  **Address the Philosophical Problem (Why no answer?):**
