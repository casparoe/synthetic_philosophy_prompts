  ok this thomson lamp supertask thing is frying my brain lol. so you start with the lamp off and flip it on after 1 minute, off after 30 more seconds, on after 15 more seconds, etc so you do infinite flips in 2 minutes. my roomate who does math says since infinity is even you end up back where you started, so off, and he says the 1-1+1-1... = 1/2 thing just means on average it was half-on over the two minutes. so why do philosophers still say theres no answer for what state its in at exactly 2 minutes? and here's the part that really gets me: say you put a little mechanical clicker next to it that adds one every time you flip, what does it read at 2 minutes? it cant read infinity, so doesnt that prove you cant actually complete infinite flips?
