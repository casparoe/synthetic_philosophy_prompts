      *(Self-Correction during drafting)*: Wait, the user is arguing *for* wildcat strikes in essential infrastructure. This is a very hard sell.
      *   *Labor Historians* might actually dislike this because wildcat strikes in essential services often lead to backlash (e.g., Taft-Hartley, public turning against unions). They prefer *legal* protection for strikes, not necessarily *wildcat* actions that endanger the public.
      *   *Libertarian* will hate it because it's a contract breach + coercion of the public.
      *   *The "Democratic Veto" framing* is the user's attempt to bridge this.
      *   *Biggest Risk:* The Libertarian will destroy the Nozickian claim. The Historians will critique the liberal framing.
      *   *Re-ordering:* The Libertarian's objection is technically legally stronger, but the Historians are the majority. If the Historians turn, the room is lost. If the Libertarian turns, it's expected. Actually, the *theoretical incoherence* is the biggest damage because it undermines the speaker's credibility with *everyone*. Let's make the Theoretical Contradiction the #1 damage.

      *Revised Plan:*
      1.  Theoretical Incoherence (Rawls vs. Nozick).
      2.  Public Harm (Rawlsian Basic Liberties).
