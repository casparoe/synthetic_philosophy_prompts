prompt: |-
  I'm presenting to my labor law seminar next week defending the idea that wildcat strikes in essential infrastucture should be treated as a form of democratic veto rather than breach of contract, using this hybrid of Rawlsian public reason and Nozick-style entitlement theory. The room is mostly labor historians who treat strikes as sacred collective action, plus one libertarian law prof who thinks all collective bargaining is coercive. Prep my Q&A: what will they actually object to, in thier vocabulary, ordered by how much damage each does, with a quick reply and a note on where the reply is weakest. Also include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep:

  1.  **Analyze the User's Request:**
      *   **Topic:** Defending wildcat strikes in essential infrastructure as a "democratic veto" rather than a "breach of contract."
      *   **Theoretical Framework:** A hybrid of Rawlsian public reason (justice/fairness/public good) and Nozick-style entitlement theory (rights/property/self-ownership). *Note: This is a highly unconventional and potentially contradictory pairing.*
      *   **Audience:**
          *   Majority: Labor historians (view strikes as sacred collective action, likely pro-union, pro-solidarity, skeptical of legalistic constraints).
          *   Minority (1 person): Libertarian law prof (views collective bargaining as coercive, pro-contract, pro-property rights).
      *   **Task:** Prepare for Q&A. Identify objections in their specific vocabularies, order by damage potential, provide quick replies, note weaknesses, and identify the "hope nobody asks" question.

  2.  **Deconstruct the Theoretical Framework (The Achilles' Heel):**
      *   *Rawls:* Focuses on the "veil of ignorance," basic liberties, and the difference principle. Public reason requires justifications acceptable to all reasonable citizens. Wildcat strikes in *essential infrastructure* (power, water, transport) could be seen as violating the basic liberties of others (access to life-sustaining services).
      *   *Nozick:* Focuses on entitlement, property rights, and voluntary exchange. A contract is a voluntary transfer of rights. Breaking it (wildcat strike) violates the employer's entitlement and potentially the public's rights if infrastructure is privately owned or managed under contract.
      *   *The Tension:* Combining these is tricky. Rawls justifies interference for fairness; Nozick forbids interference for liberty. Arguing *both* support wildcat strikes in *essential* sectors is theoretically volatile.

  3.  **Analyze the Audiences:**
      *   *Labor Historians:*
          *   *Values:* Solidarity, class struggle, power dynamics, historical context of labor laws (often seen as tools to *restrict* strikes).
          *   *Objection:* "Democratic veto" sounds too legalistic/liberal. It sanitizes the raw power of the strike. Also, endangering the public (essential infrastructure) hurts labor's public image.
          *   *Vocab:* "Class power," "solidarity," "business unionism," "state repression," "direct action."
      *   *Libertarian Prof:*
          *   *Values:* Contract sanctity, individual rights, non-aggression, property.
          *   *Objection:* A strike is a collective withdrawal of labor. A *wildcat* strike is a breach of contract. Essential infrastructure adds a tort/negligence layer (endangering others). "Democratic veto" is mob rule.
          *   *Vocab:* "Coercion," "contractual obligation," "property rights," "tort," "rule of law."

  4.  **Drafting the Objections (Ordering by Damage):**
      *   *High Damage:* The theoretical contradiction. If the framework doesn't hold, the argument collapses. The Libertarian will spot the Nozick violation; the Historians will spot the Rawlsian co-optation of radical action.
      *   *Medium Damage:* The "Essential" nature. Hurting the public undermines the "public reason" aspect.
      *   *Low Damage:* Procedural/Pragmatic issues (how to implement).

  5.  **Developing the Q&A Items:**

      *   *Objection 1 (The Libertarian - Theoretical Consistency):* You can't use Nozick to justify breach of contract.
      *   *Objection 2 (The Historians - Political Strategy):* "Democratic veto" tames the strike. It makes it about procedure, not power.
      *   *Objection 3 (The Public Harm - Rawlsian):* Essential infrastructure affects basic liberties of non-strikers. Rawls wouldn't allow violating basic liberties for economic gain.
      *   *Objection 4 (The Definition):* What counts as "essential"?

  6.  **Refining the Replies & Weaknesses:**
      *   Need to be concise.
      *   Need to acknowledge the weakness honestly (as requested).

  7.  **Identifying the "Hope Nobody Asks" Question:**
      *   What kills this specific hybrid theory?
      *   It's the conflict between Rawls and Nozick. Rawls allows redistribution/regulation for fairness; Nozick forbids it. Using them together to justify *illegal* action (wildcat) in *essential* services is a minefield.
      *   *The Question:* "How do you resolve the fundamental incompatibility between Rawls' difference principle and Nozick's entitlement theory when they prescribe opposite outcomes regarding property rights in essential infrastructure?"

  8.  **Review and Polish:**
      *   Check tone: Academic, strategic, slightly cynical (realistic about the seminar room dynamics).
