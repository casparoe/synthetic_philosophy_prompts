answer: |-
  Regarding the proportion of a community's moral-emotional character available for deliberate institutional design versus fixed by structural circumstance, I would place the ceiling of design at 40. In a closed system of nine hundred people where survival depends on interdependent labor and exit is impossible, the pressure of necessity dictates the baseline of behavior far more than ideology does, meaning sixty percent of their emotional landscape is determined by the fact that they cannot leave and cannot afford to lose a worker, while only forty percent remains malleable enough for the elders to shape through ritual and law.

  Starting with the unpassivizable verb, I assess its reliability in cultivating guilt rather than shame at 80, because it forces agency onto the speaker, but its durability over two generations is only 30, as language naturally evolves to circumvent legislative constraint, and its legibility for your narrator is a mere 20, since a grammatical rule is invisible to an eleven-year-old unless she hears it broken. For the naming hour, the reliability score is 45, which is close to a coin flip, because while the confession is specific, the public silence of the assembly could easily be interpreted as judgment rather than respect, and what settles this is whether the elders sit still or look down during the silence, while its durability is 50 because performative virtue will eventually rot the practice, though its legibility is 90 because a person standing before a silent crowd is a stark image. The second-person audit scores 85 for cultivating guilt as it demands direct repair with the harmed party, 60 for durability since the witness role can become bureaucratic but remains interpersonal, and 40 for legibility because your narrator would rarely see these private reckonings occur. The stranger's ear rates only 20 for guilt because it explicitly avoids consequence and repair, 70 for durability since it requires little effort to maintain, and 60 for legibility as the boat's arrival is visible but the confessions are not. The blackened lintel scores 10 for guilt because it marks the household identity rather than the act, 75 for durability because paint is visible and hard to ignore, and 100 for legibility since a black doorway is unmistakable to a child. Finally, the counted absence scores 80 for guilt because it enacts repair through labor, 55 for durability which is another near coin flip depending on whether the community views the empty seat as holy or burdensome, and 90 for legibility because a missing person and a server are clear visual facts at every meal.

  If I were to rank these in the order of adoption for a system aiming at guilt and repair, I would place the counted absence first, followed by the second-person audit, then the unpassivizable verb, then the naming hour, then the blackened lintel, and lastly the stranger's ear. The single institution I would strike from the shortlist as not worth the ink is the stranger's ear, because a mechanism designed to have no consequence cannot sustain a moral framework built on responsibility. The one institution that, adopted alone, would change the valley's character most is the counted absence, because it transforms the daily act of eating into a recurring memorial and labor of repair that touches every household. The one that would most plausibly read to your narrator as mere cruelty is the blackened lintel, because forbidding the naming of the reason while marking the house creates a taboo that feels like a ghost haunting the living, which a child experiences as fear rather than justice.
