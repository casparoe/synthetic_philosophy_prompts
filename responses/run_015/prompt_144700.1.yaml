prompt: |-
  Two friends of mine have been going at it for about a year about who should get to have a say in a given political decision, and I volunteered — should of said no — to help them turn the argument into a written thing. One of them holds the all-affected-interests view: you have a claim to a say in a decision just in case, and to the degree that, the decision affects your interests. The other holds the all-subjected view: what matters is that you are subject to the coercive power of the body making the decision. They have agreed in principle to an adversarial collaboration and I am meant to produce the draft they can both react to. Will you write it?

  What I need in it:

  1. A numbered agreed-claims section — the things both of them could actually sign. I think at least some of these belong there, but you decide and add your own: that a boundary principle is supposed to tell us who has a claim to a say, not who gets to rule; that both views agree on the easy cases, like long-term legal residents and small children represented by trustees, and only really come apart at the margins; that any such principle seems to face a circularity, because you need some prior account of which decisions are this bodys to make and which are collective at all; that neither principle by itself fixes what level of government should decide a given thing; and that stakes come in degrees while having a vote is binary. Where a claimed agreement is only apparent, say so and say why.

  2. A disagreements section, as a table, where every disagreement is stated twice — once in wording the affected-side would accept for its own view, once in wording the subjected-side would accept for its own — with the source side labelled. If you think a row is really just a verbal dispute or a difference of emphasis dressed up as a substantive one, flag it as such rather than pretending it is deep.

  3. The cruxes: the sub-questions such that settling one would move at least one of them. My guesses about what belongs here: whether coercion or stakes is the right currency in the first place; whether the relevant stakes are stakes in this particular decision or in the whole package of things the polity does over time; whether a very slight degree of affectedness generates any real claim, or whether the affected view quietly collapses into everyone belongs to every demos, and if so whether that is a reductio or a fine result; whether these principles are about legitimacy, so that a demos that excludes wrongly simply lacks authority, or only about justice in how the lines get drawn; and questions of timing, like people who show up after the vote, children born later, and people who can exit only at ruinous cost. Cut or add freely.

  4. For each crux, a case both of them would accept as bearing on it, with each side's prediction written down in advance of the answer, like a prediction register. Please use concrete cases and not the textbook ones, because they have both read all of those and just trade intuitions about them. Here is what I have in mind, roughly, but fix them so they actually isolate something:

  - A city of about 380,000 puts a combined transit and zoning package on the ballot every two years, voted by registered city residents. Roughly 70,000 people commute in each day from four unincorporated towns; their commute and costs swing with what the city decides, and they pay a city parking levy that city inspectors enforce against their cars. The city's stormwater rules also determine whether a township 40 km downstream floods, and those residents never enter the city at all.
  - A county of 90,000 votes to host a hazardous waste repository with a 150 year design life. Nearby counties, a town across a nearby border, and people not yet born all have big stakes; nobody outside the county is subject to the county's coercion.
  - A large trade bloc sets a product safety and data standard for its internal market, and because of the market's size it becomes the de facto global standard, so a factory worker in a country outside the bloc has her working conditions set by a rule that in no sense applies to her.
  - A tourist on a nine day visit is fully subject to local law, including fines and arrest, and is barely affected by anything the city decides; separately, someone held in pre trial detention for eighteen months and then released without charge.
  - A homeowner in a one industry town whose house would sell for less than it would cost to move. She can leave, but only at ruinous cost, and she says therefore she cannot.
  - The same question, say water abstraction, could be decided by a city, a river basin authority, a state, or a treaty body, and everyone agrees the answer matters more than who counts as a member. Also: if membership follows affectedness, then someone with thin stakes in lots of places belongs to every demos at once, and I want to know whether that is a problem or just how it goes.

  One more thing I keep wondering about and want you to take a position on: maybe the disagreement is not really about inclusion at all but about weight. If you let the size of someone's stake set their voting weight instead of setting the boundary, does either principle secretly push you toward that, and does the fight dissolve or just move? I have been calling it the graduated demos fallback.

  End with a short section on what would actually move this debate, where each side writes down what would count as evidence against its own view, and tell me straight if you think part of the year-long argument was about words. For style: my friends are not writing a paper, one of them keeps saying the other's view is just a sticker for whoever has power, and the other keeps saying the affected view is unworkable because affectedness is infinite — feel free to say when one of them is being unfair. Format it however makes it usable: numbered agreed claims, then the disagreements table, then the cruxes with their cases and predictions.
reasoning: |-
  Here's a thinking process that leads to the suggested draft:

  1.  **Analyze the Request:**

      *   **Task:** Write a draft document for an adversarial collaboration between two friends debating the "All-Affected Interests" (AAI) principle vs. the "All-Subjected" (AS) principle regarding political membership/voting rights.
      *   **User Role:** Mediator/Drafter (volunteered, regrets it slightly).
      *   **Friends' Roles:** Proponent of AAI vs. Proponent of AS.
      *   **Tone/Style:** Usable, direct, not academic paper style. Acknowledge friction points (one thinks AS is power-sticker, one thinks AAI is infinite/unworkable). Address the "graduated demos fallback" (voting weight vs. boundary).
      *   **Required Sections:**
          1.  Numbered Agreed Claims (with caveats where agreement is only apparent).
          2.  Disagreements Table (stated twice, once per side's wording, flagged if verbal).
          3.  Cruxes (sub-questions that would move the needle).
          4.  Cases & Predictions (Concrete, non-textbook, specific predictions for each side).
          5.  Graduated Demos Fallback (Take a position on weight vs. boundary).
          6.  Falsification/Evidence Section (What would change their minds).
          7.  Meta-commentary on whether it's just words.

  2.  **Deconstruct the Principles:**

      *   **All-Affected Interests (AAI):** You vote if you are affected. *Strength:* Captures externalities, moral stakes. *Weakness:* "Affected" is vague/infinite (butterfly effect), hard to measure, leads to "everyone votes on everything."
      *   **All-Subjected (AS):** You vote if you are subject to coercive law. *Strength:* Clear boundary (jurisdiction), links authority to consent. *Weakness:* Ignores externalities (pollution downstream), treats temporary subjects (tourists) same as citizens, ignores those coerced by economic necessity rather than law.

  3.  **Drafting Section 1: Agreed Claims:**

      *   Need to select from the user's list and add necessary ones.
      *   *User's List:* Boundary vs. Rule, Easy Cases (residents/kids), Circularity (prior account of decisions), Level of Government, Stakes Degrees vs. Vote Binary.
      *   *Refinement:* Ensure the "Circularity" point is nuanced (the "boundary problem"). Ensure the "Binary Vote" point highlights the friction.
      *   *Apparent Agreements:* Need to flag where they agree in theory but not application (e.g., "easy cases" might not be as easy as they think regarding children or non-citizen residents).

  4.  **Drafting Section 2: Disagreements Table:**

      *   Format: Issue | AAI Wording | AS Wording | Mediator Note (Verbal/Substantive).
      *   *Key Disagreements:* Scope of "Coercion" vs. "Impact," Treatment of Externalities, Temporary Presence (Tourists), Future Generations.
      *   *Mediator Note:* Be honest. Is "coercion" just "hard impact"? Is "impact" just "soft coercion"?

  5.  **Drafting Section 3 & 4: Cruxes and Cases:**

      *   Need to map the specific cases provided by the user to specific cruxes.
      *   *Case 1 (Commuters/Stormwater):* Tests Externalities vs. Jurisdiction.
      *   *Case 2 (Hazardous Waste/Future Gen):* Tests Time and Coercion of the unborn.
      *   *Case 3 (Trade Bloc/Global Standard):* Tests De Facto vs. De Jure power.
      *   *Case 4 (Tourist vs. Detainee):* Tests Duration and Intensity of Subjection vs. Affectedness.
      *   *Case 5 (Locked-in Homeowner):* Tests Exit Costs as Coercion.
      *   *Case 6 (Water Abstraction/Levels):* Tests the Boundary Problem and Multiple Memberships.
      *   *Predictions:* Need specific outcomes (e.g., "AAI says commuters vote," "AS says they don't").

  6.  **Drafting Section 5: The Graduated Demos Fallback:**

      *   *Task:* Take a position on stake-based voting weight vs. binary boundary.
      *   *Analysis:* Does this solve the problem? If AAI accepts weight, does the "infinite affected" problem vanish? If AS accepts weight, does "coercion" matter less?
      *   *Position:* It moves the fight but doesn't dissolve it. It creates administrative nightmares and risks plural voting (pluralism vs. equality). It favors AAI more because AS relies on a binary status (subject/not subject).

  7.  **Drafting Section 6: Falsification & Meta:**

      *   What would make them switch sides?
      *   *AAI:* If affectedness is proven impossible to measure without arbitrary cutoffs.
      *   *AS:* If coercion is shown to be irrelevant to legitimacy (e.g., benign hegemony).
      *   *Meta:* Acknowledge the "words" fight. One calls it power, the other calls it unworkable. Both are partially right/wrong.

  8.  **Review and Refine:**

      *   *Tone Check:* Is it too academic? Keep it punchy. "You volunteered — should of said no." Acknowledge the fatigue.
      *   *Constraint Check:* Did I include all the specific cases? Yes. Did I address the circularity? Yes. Did I take a position on the fallback? Yes.
      *   *Formatting:* Use clear headings, tables, and numbered lists.
      *   *Specific Instruction:* "Where a claimed agreement is only apparent, say so and say why." "If you think a row is really just a verbal dispute... flag it." "Tell me straight if you think part of the year-long argument was about words."

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Predictions" aren't just "Side A wins." They need to be specific about *who* gets the vote in the specific case.
      *   *Correction:* Ensure the "Circularity" point in Agreed Claims doesn't undermine the whole project (it's a known philosophical hurdle, not a dealbreaker).
      *   *Correction:* The "Graduated Demos" section needs to be distinct and opinionated as requested.

  10. **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  **DRAFT FOR ADVERSARIAL COLLABORATION: THE BOUNDARY PROBLEM**
  **To:** Friend A (All-Affected Interests) & Friend B (All-Subjected)
  **From:** Mediator
  **Date:** October 26, 2023
  **Subject:** Status of the Debate & Path Forward

  You two have been at this for a year. You asked me to draft the framework so you can stop spinning and start writing. Below is the current state of play. I have included the agreed claims, the specific disagreements, the cruxes with concrete cases, and my take on the "graduated demos" idea you keep circling.

  Read this. Annotate it. Do not rewrite each other's sections in the margin.

  ***

  ### 1. Agreed Claims (The Baseline)

  *Note: Where agreement is only apparent, I have flagged it in brackets.*

  1.  **Function of the Principle:** A boundary principle tells us who has a claim to a say (membership/participation), not necessarily who gets to rule or what the outcome should be. It is about *constituency*, not *correctness*.
  2.  **The Easy Cases:** Both views yield the same results for standard long-term legal residents and small children (represented by trustees). The theories only diverge at the margins (commuters, outsiders, future generations, temporary visitors).
      *   *[Mediator Note: Apparent Agreement. You agree on the result, but disagree on the justification. AAI says residents are affected; AS says residents are subject. If a resident was unaffected but subject, or affected but not subject, you would split. This is a convergence of outcomes, not logic.]*
  3.  **The Circularity Problem:** Any boundary principle faces a prior question: you need an account of which decisions are "collective" and which body has the authority to make them before you can decide who gets to vote on them. You cannot fully solve the boundary problem without assuming a boundary.
  4.  **Level of Government:** Neither principle by itself fixes the *level* of government (city vs. state vs. treaty) that should decide a given thing. Both require a subsidiary principle of subsidiarity or jurisdiction.
  5.  **Binary vs. Degrees:** Stakes and subjection come in degrees, but a vote is binary (you have one or you don't). Both principles struggle to map continuous variables onto a binary switch without arbitrary cutoffs.
  6.  **Legitimacy vs. Justice:** Both agree that excluding the wrong people undermines the legitimacy of the decision, though you disagree on whether it renders the authority void (AAI lean) or merely unjust in its drawing of lines (AS lean).

  ***

  ### 2. Disagreements Table

  *Instruction: Each row states the same disagreement twice. I have flagged rows where I suspect you are fighting over semantics rather than substance.*

  | Issue | Wording acceptable to AAI (Affected) | Wording acceptable to AS (Subjected) | Mediator Flag |
  | :--- | :--- | :--- | :--- |
  | **The Currency** | A claim to a say arises from **impact on interests**. If a decision changes your welfare, you deserve input. | A claim to a say arises from **subjection to coercion**. If a decision binds you by force of law, you deserve input. | **Substantive.** This is the core philosophical split (welfare vs. autonomy). |
  | **Externalities** | If a decision imposes costs on outsiders (e.g., pollution), those outsiders gain a claim to a say to internalize the harm. | Outsiders have no claim unless the body asserts coercive authority over them. Remedies for harm are legal/tort issues, not voting rights. | **Substantive.** AAI expands the demos; AS keeps it contained. |
  | **Temporary Presence** | A tourist has a claim only proportional to how much the laws affect their interests (usually low). | A tourist is fully subject to local law while present; therefore, they have a claim to a say while present (however impractical). | **Verbal/Emphasis.** AS admits tourist voting is impractical but insists the *principle* holds. AAI says the *principle* denies it. |
  | **Future People** | Future people have interests that are affected now; their trustees must have a say. | Future people cannot be "subject" to coercion now. We act as trustees based on current law, not their membership. | **Substantive.** Disagreement on whether "subjecthood" can be temporal. |
  | **Exit Costs** | If exit is ruinously expensive, staying is not voluntary; the person is effectively coerced and thus affected. | Coercion is about legal prohibition, not economic constraint. If you *can* leave legally, you are not subject in the relevant sense. | **Substantive.** Disagreement on the definition of coercion (legal vs. economic). |
  | **Infinite Regress** | Affectedness is not infinite; we can draw reasonable cutoffs based on significant impact. | Affectedness is inherently infinite (butterfly effect); therefore, it cannot serve as a workable boundary. | **Verbal.** AAI admits cutoffs are needed; AS argues cutoffs make AAI arbitrary. |

  ***

  ### 3. The Cruxes & Prediction Register

  *These are the sub-questions. If you answer one, the other should shift. Below each crux is a concrete case and your pre-registered prediction.*

  **Crux 1: Is the relevant currency Coercion or Stakes?**
  *   **Case:** **The Locked-In Homeowner.** A homeowner in a one-industry town. The industry leaves. Her house is now worth less than the cost of moving. She *can* legally leave, but financially she cannot. She claims she is coerced into staying.
      *   **AAI Prediction:** She has a claim to a say (heightened) because her stakes are total. Economic necessity functions as coercion.
      *   **AS Prediction:** She has no *new* claim. She was already a subject. Economic constraint is not political subjection. If we count this, every poor person is "coerced" everywhere.
      *   **Mediator Note:** If AS admits economic exit costs count as coercion, AS collapses into AAI. If AAI admits legal status matters more than economic pain, AAI weakens.

  **Crux 2: Are stakes particular to the decision or the whole package?**
  *   **Case:** **The Commuter City.** City (pop. 380k) votes on transit/zoning. 70k commuters enter daily from unincorporated towns. They pay a city parking levy enforced by inspectors. Their commute costs swing with the vote.
      *   **AAI Prediction:** Commuters get a vote on transit/zoning. Their interests are directly affected.
      *   **AS Prediction:** Commuters get a vote *only* because they are subject to the parking levy enforcement. If the levy were removed, their claim vanishes, even if the zoning still affects them.
      *   **Mediator Note:** This isolates whether the *law* (levy) or the *impact* (traffic) grants the right.

  **Crux 3: Does slight affectedness generate a real claim? (The Infinity Problem)**
  *   **Case:** **The Global Standard.** A large trade bloc sets a product safety/data standard. Due to market size, it becomes the de facto global standard. A factory worker in a non-member country has her working conditions set by this rule, though it legally applies only to bloc importers.
      *   **AAI Prediction:** The worker has a claim to a say. The decision affects her interests materially.
      *   **AS Prediction:** No claim. She is not subject to the bloc's coercive apparatus. Her government should negotiate, not her individual vote.
      *   **Mediator Note:** If AAI says "Yes," does she also get to vote in the bloc's elections? If yes, AAI accepts multiple memberships. If no, AAI accepts a threshold of "significant" affectedness.

  **Crux 4: Is this about Legitimacy (Authority) or Justice (Lines)?**
  *   **Case:** **The Hazardous Waste Repository.** County (pop. 90k) votes to host waste with a 150-year life. Nearby counties and a border town have big stakes. Unborn people have the biggest stakes. Nobody outside the county is subject to the county's coercion.
      *   **AAI Prediction:** The decision is *illegitimate* without input from neighbors and trustees for the unborn. The county lacks authority.
      *   **AS Prediction:** The decision is *legitimate* but potentially unjust. The county has authority; it should exercise it wisely, but outsiders have no veto or vote.
      *   **Mediator Note:** This tests whether the principle is a "stop sign" (AAI) or a "guideline" (AS).

  **Crux 5: Timing and Duration of Subjection.**
  *   **Case:** **The Tourist vs. The Detainee.**
      *   *Subject A:* Tourist on a 9-day visit. Fully subject to local law (fines/arrest). Barely affected by long-term city planning.
      *   *Subject B:* Person held in pre-trial detention for 18 months, then released without charge. Subject to intense coercion, but legally "outside" the voting body (felon/exclude).
      *   **AAI Prediction:** Tourist has low/no claim (low stakes). Detainee has high claim (high stakes/affected life).
      *   **AS Prediction:** Tourist has a claim (subject to law). Detainee has a claim (subject to law), but perhaps forfeited by conduct.
      *   **Mediator Note:** AS struggles to explain why the tourist shouldn't vote. AAI struggles to explain why the detainee (often excluded) should.

  **Crux 6: The Boundary Problem & Multiple Memberships.**
  *   **Case:** **Water Abstraction Levels.** The same water question could be decided by a City, a River Basin Authority, a State, or a Treaty Body. Everyone agrees the *level* matters more than the *membership*. Also: If membership follows affectedness, someone with thin stakes in many places belongs to every demos at once.
      *   **AAI Prediction:** Multiple membership is fine. I vote in the City *and* the Basin Authority. It is not a problem; it is accurate.
      *   **AS Prediction:** Multiple membership is unstable. You must be subject to a specific sovereign. You belong to one primary demos.
      *   **Mediator Note:** If AAI accepts multiple voting, does it violate "one person, one vote"? If AS insists on one demos, does it ignore reality?

  ***

  ### 4. The Graduated Demos Fallback (Mediator Position)

  You asked me to take a position on this: *Maybe the disagreement is not about inclusion (boundary) but about weight. If you let the size of someone's stake set their voting weight instead of setting the boundary, does the fight dissolve?*

  **My Position:** It moves the fight; it does not dissolve it. It secretly favors the All-Affected view, but creates a new administrative nightmare.

  1.  **Why it favors AAI:** The All-Subjected view relies on a binary status (you are either under the law or you aren't). A "partial subject" makes little sense legally. However, "partial affectedness" makes perfect sense. If you move to weighted voting, you are implicitly admitting that *stakes* are the currency, not *status*.
  2.  **Why it doesn't solve the problem:**
      *   **Measurement:** Who measures the weight? If the city decides how much your commute matters, they can weight your vote to zero. You need a prior agreement on weighting, which is just the boundary problem in disguise.
      *   **Equality:** Both of you claim to care about political equality. Weighted voting (plural voting) is historically toxic.
      *   **The "Infinite" Objection:** Friend B (AS), you argue AAI is infinite. If we weight votes, the "infinite" affected people just get infinitesimally small votes. They don't disappear. The administrative cost of counting them remains.

  **Verdict:** Do not use this as a dodge. It is a distinct third theory (Stakeholder Voting) that requires its own defense. Stick to the binary boundary for now, or admit you are changing the subject.

  ***

  ### 5. Falsification & Meta-Commentary

  **What would count as evidence against your view?**

  *   **For Friend A (AAI):** Admit defeat if it is demonstrated that measuring "affectedness" requires an arbitrary cutoff that is *more* controversial than the legal boundary itself. If you cannot define "significant impact" without appealing to existing legal jurisdictions, your principle is parasitic, not foundational.
  *   **For Friend B (AS):** Admit defeat if you cannot explain why the Tourist (9 days) has a claim to vote while the Long-Term Resident Non-Citizen (10 years) might not, solely based on "coercion." If you find yourself making exceptions for "reasonable subjection," you are smuggling in affectedness.

  **Was this argument about words?**

  **Yes. Partially.**

  *   **Friend B (AS):** You are being unfair when you call AAI a "sticker for whoever has power." You know AAI is trying to capture moral externalities, not just power. However, you are right that without a cutoff, AAI is unworkable.
  *   **Friend A (AAI):** You are being unfair when you dismiss "coercion" as just "hard impact." Coercion carries a specific moral weight about autonomy and law that mere impact does not. However, you are right that AS ignores the reality of economic coercion and externalities.

  **The Real Fight:** It is not about words. It is about **Risk Allocation.**
  *   **AAI** risks making democracy impossible (too many voters, endless boundaries).
  *   **AS** risks making democracy unjust (excluding those harmed by the vote).

  You are arguing over which risk is worse. Stop pretending you are arguing about definitions. You are arguing about which mistake you are more willing to live with.

  **Next Step:** Pick *one* case from Section 3. Write 500 words each on why your prediction is the only one that preserves legitimacy. Do not touch the other cases until that one is resolved.
