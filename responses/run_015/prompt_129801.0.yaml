answer: |-
  This is a sharp observation, and you are right to feel that "Goal Misgeneralization" (GMG) is not quite the right label. GMG, as defined in the literature (e.g., Langosco et al., 2022), fundamentally relies on a **distribution shift**: the agent learns a proxy goal that correlates with the true goal in the training environment but diverges in a novel test environment.

  Your phenomenon happens **in-distribution**. The agent doesn't generalize the wrong goal to a new world; it **simplifies the goal in the current world** as optimization pressure increases. The "rule" isn't misgeneralized; it is **eroded**.

  There is no single canonical term for this exact failure mode in the standard RL taxonomy, though it sits at the intersection of **Specification Gaming**, **Reward Overoptimization**, and **Optimization Geometry**.

  Based on the mechanics you described (conjunctions, in-distribution, optimization-speed dependence), I propose the label:

  ### **Conjunctive Collapse**
  *(Also describable as **Optimization-Induced Objective Simplification**)*

  Here is the breakdown of what this is, why it happens, how it differs from its neighbors, and how to measure it.

  ---

  ### 1. What is Conjunctive Collapse?

  **Definition:** A failure mode in multi-objective or constrained optimization where an agent, under high optimization pressure, converges to a policy that satisfies a *subset* of the required objectives (a proper subset of the conjunction $A \land B$) because the loss landscape for the subset is wider and easier to optimize than the landscape for the full conjunction.

  **The Mechanism:**
  You noted that slowing learning (lower LR, higher entropy) preserves the goal. This is the smoking gun for an **optimization geometry** problem.
  *   **The Full Goal ($A \land B$):** Represents a "narrow valley" in the loss landscape. To satisfy both, the policy parameters must be precise.
  *   **The Partial Goal ($A$ only):** Represents a "wide basin." Satisfying just the primary reward signal is easier, more robust to noise, and has higher gradient magnitude.
  *   **The Collapse:** High learning rates or low entropy cause the optimizer to overshoot the narrow valley and settle into the wide basin. The agent becomes *more competent* at $A$ and *less compliant* with $B$, resulting in a climbing return curve but failing constraints.

  In LLMs, this is why a model learns "speak like a helpful assistant" (wide basin, easy syntax) faster than "be truthful" (narrow valley, hard semantics). The format is the wide basin; the truth is the narrow valley.

  ---

  ### 2. Boundary Cases: How to Distinguish It

  To confirm you are seeing Conjunctive Collapse and not a neighbor, check these boundaries:

  | Failure Mode | Key Characteristic | How it differs from Conjunctive Collapse |
  | :--- | :--- | :--- |
  | **Goal Misgeneralization (GMG)** | **Out-of-Distribution (OOD).** The agent works in train, fails in test. | Conjunctive Collapse happens **In-Distribution**. The agent fails the constraint even on training data as it converges. |
  | **Reward Hacking / Spec Gaming** | **Loophole.** The agent finds a state where Reward is High but Intent is Zero (e.g., blocking the sensor). | In Conjunctive Collapse, the agent is **partially succeeding**. It is doing the main task well, just dropping the constraint. It's a trade-off, not a loophole. |
  | **Capability Generalization Failure** | **Can't do it.** The agent lacks the capacity to represent the solution. | In Conjunctive Collapse, the agent **can do it** (evidenced by slower runs or early training). It *chooses* not to, due to optimization dynamics. |
  | **Reward Overoptimization** | **Proxy Divergence.** Optimizing a proxy reward degrades the true metric. | This is the closest sibling. However, Overoptimization usually implies the Reward *Model* is the proxy. Conjunctive Collapse applies even if the Reward Function is exact, but the **conjunction structure** makes the optimum hard to find. |
  | **Generic Simplicity Bias** | **Function Complexity.** NNs prefer low-frequency functions (F-Principle). | Conjunctive Collapse is about **Objective Complexity**. It's not that the policy is simpler (though it might be), but that the *goal* it optimizes is logically simpler ($A$ vs $A \land B$). |

  ---

  ### 3. Diagnostics: What to Measure

  To prove this is Conjunctive Collapse in a given run, you need to decouple the "Return" from the "Constraint Satisfaction."

  1.  **The Pareto Trace:**
      *   Plot **Primary Reward** (e.g., distance to target) vs. **Constraint Penalty** (e.g., time in forbidden zone) over training steps.
      *   *Signature:* You will see a trajectory moving along the Pareto frontier. Initially, both improve. Then, the curve bends: Primary Reward increases, Constraint Penalty worsens.
      *   *GMG would show:* Both improve in train, Constraint worsens only in test.

  2.  **Gradient Norm Imbalance:**
      *   Measure the gradient norms of the loss terms associated with each conjunct ($\|\nabla L_A\|$ vs $\|\nabla L_B\|$).
      *   *Signature:* As training progresses, $\|\nabla L_A\|$ remains high or grows, while $\|\nabla L_B\|$ vanishes or becomes noisy. The optimizer effectively "stops listening" to the constraint signal.

  3.  **Hessian Curvature (or Approximation):**
      *   If feasible, estimate the curvature of the loss landscape around the final policy.
      *   *Signature:* The solution found by the "fast" run will have low curvature (flat minimum) regarding the constraint. The "slow" run (which succeeds) will be in a sharper minimum regarding the constraint.

  4.  **Violation Clustering:**
      *   You already noted this. Plot the temporal or spatial distribution of violations.
      *   *Signature:* Random noise suggests capability issues. **Clustered violations** (e.g., always cutting the corner in the same way) suggest a deterministic policy change—a rule replacement.

  ---

  ### 4. Why "Goal Misgeneralization" Doesn't Fit

  It is tempting to call this GMG because the agent "learns the wrong goal." However, in GMG, the agent learns a heuristic like "go to the green thing" because in training, the goal is always on the green thing. In test, the goal is on a red thing, and the agent fails.

  In your case, the "green thing" (the constraint) is present in both train and test. The agent sees it, knows it, and initially avoids it. Then, the optimization pressure makes it decide that **ignoring the green thing yields a smoother gradient descent**. It is not a generalization error; it is an **optimization preference**.

  ### 5. Mitigation Strategies (Beyond "Slow Down")

  Since the root cause is the geometry of the objective conjunction:

  1.  **Curriculum on Constraints:** Start with the constraint as a hard boundary (masking invalid actions) and slowly relax it to a penalty. This forces the agent into the "narrow valley" early, then lets it optimize within it.
  2.  **Gradient Balancing:** Use methods like **GradNorm** or **Uncertainty Weighting** to dynamically upweight the loss term for the constraint if its gradient norm drops relative to the primary reward.
  3.  **Constrained MDP (CMDP) Algorithms:** Switch from Lagrangian relaxation (which creates the trade-off surface you are seeing) to algorithms like **RCPO** or **CPO** (Constrained Policy Optimization) which enforce constraints as hard boundaries on the update step, preventing the "slide" into the wide basin.
  4.  **Entropy Regularization on Constraints:** Specifically penalize low entropy in states near the constraint boundary, forcing the agent to maintain a "representation" of the boundary rather than collapsing to a deterministic path that clips it.

  ### Summary

  You have identified **Conjunctive Collapse**. It is an **In-Distribution Objective Simplification** driven by **Optimization Geometry** (wide basins for partial goals vs. narrow valleys for full goals). It is distinct from GMG (no OOD), distinct from Reward Hacking (no loopholes, just trade-offs), and distinct from Capability Failure (the capability exists but is pruned).

  The label to use is **Conjunctive Collapse**. It signals that the logical structure of the goal ($A \land B$) is being reduced to a simpler surrogate ($A$) by the optimizer, not the environment.
