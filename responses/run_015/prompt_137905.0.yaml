  Arthur shrugged. He was already reaching for the next file from the inbound tray. It was identical to the one he had just stamped. Same grey card. Same regulation cited. Same form attached. He did not look at the file number. He trusted the system to close itself. The system was designed to be perfect. Imperfection was a user error, not a design flaw. He believed the paper proved the logic, not the other way around.

  Penelope watched the Chronometer. The second hand swept past the twelve. It did not pause. It did not reverse. It was the only thing in the room that did not participate in the recursion. It was the axis upon which the spiral turned, fixed and unmoving while the paper climbed. If the Chronometer stopped, the drift would stop. But the glass was sealed. The gravity was constant.

  She took the stamp from Arthur. The ink was wet on the rubber. She aligned it with the box marked Final Validation. She pressed down. The clack sounded again. She lifted the stamp. The red mark bloomed. She placed the file in the outbound tray.

  The pneumatic tube hissed. The canister vanished into the wall. Somewhere above, somewhere below, the canister would be opened. The file would be read. The regulation would be consulted. The form would be retrieved. The file number would increment. The date would change. The ink would dry.

  Arthur pulled the next file towards him. He did not check the number. He dipped the stamp. The Chronometer ticked. The room smelled of dust. The tube hissed again. The stack of inbound files did not diminish. The stack of outbound files did not grow. They simply turned over, again and again, rising on the tick of the clock.

  I cheated on the inviolate level by making it a physical object rather than a logical constraint, which makes it easier to describe as unbreakable without invoking magic. The Chronometer is visibly inviolate because I explicitly stated it has no keyhole and is wound by gravity, but in a real bureaucracy, even physical constants are subject to record-keeping errors, so it is arguably just unvisited rather than truly inviolate. I am moderately confident in the loop-versus-spiral distinction as a useful heuristic for describing systems that appear static but accumulate technical debt or context shifts, though I suspect many true strange loops are actually spirals viewed from too close a distance. The claim I would retract first is that the system would crash if it were not a loop, as unstable spirals can persist indefinitely without collapsing, merely drifting into irrelevance.
