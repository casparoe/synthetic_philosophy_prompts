answer: |-
  You are not imagining this, and you are right to be suspicious. You have identified a genuine tension that sits at the boundary of formal rigor and informal mathematical practice.

  To give you the direct pushback you asked for first: **Yes, there is a hard technical wall.** In standard Curry-Howard correspondence (which underpins proof extraction in systems like Coq, Agda, or Nuprl), **you cannot extract a computational branch from a proof that relies on the Law of Excluded Middle (LEM) for an undecidable proposition.**

  If a proof uses $P \lor \neg P$ as an axiom where $P$ is not decidable, the extraction mechanism either fails, produces a "stub" (an opaque constant that crashes if evaluated), or produces code involving control operators (like `call/cc`) that does not look like a simple `if-then-else` branch. If a paper claims to extract a standard algorithm that branches on a classically-proven disjunction without mentioning continuations or decidability, **the paper is technically incorrect or hiding assumptions.**

  However, the pattern you are seeing is common enough that it has explanations ranging from "valid technical distinction" to "sloppy hand-waving." Here is the breakdown of what is actually happening, the names for the valid moves, and where the sloppiness creeps in.

  ### 1. The Valid Move: Proof Erasure (`Prop` vs. `Type`)
  The most common legitimate version of this "split-level reasoning" is the distinction between **computationally relevant** and **computationally irrelevant** parts of a proof.

  *   **The Mechanism:** In systems like Coq, there is a universe `Prop` (for specifications/logic) and `Set`/`Type` (for data/programs). Terms in `Prop` are **erased** during extraction.
  *   **The Move:** You can prove a lemma using classical logic (LEM, Choice, etc.) inside `Prop`. As long as you do not **eliminate** from `Prop` into `Type` (i.e., you don't use the *result* of that proof to construct data), the extraction remains constructive.
  *   **The Name:** This is often called **Proof Irrelevance** or **Erasure**. In a broader logical context, it relates to **Logic-Enriched Type Theory (LTT)**.
  *   **Why it looks like moving the fence:** Authors often write informally. They say, "We prove correctness here (using classical logic)," and "We build the algorithm here (constructively)." As long as the classical proof doesn't feed data into the algorithm, this is valid. The "boundary" is the elimination rule.

  ### 2. The Sloppy Move: Implicit Decidability
  This addresses your second observation: *"using that same classical layer to justify an optimization that changes the actual running code... like saying either the input is sorted or it isn't, so we can branch."*

  *   **The Error:** If the predicate "is sorted" is decidable (which it usually is for finite lists), then $P \lor \neg P$ is intuitionistically valid *without* LEM. You can write a function that returns `true` or `false`.
  *   **The Sloppiness:** Authors often write "By LEM, either $P$ or $\neg P$" because it's faster to write than "Since $P$ is decidable, we compute..."
  *   **The Boundary Failure:** If the predicate is *not* decidable (e.g., "Does this program halt?" or properties over infinite streams), and they use LEM to justify a runtime branch, **they are lying about the extraction.** You cannot extract a boolean checker for an undecidable property.
  *   **Is there a name?** This is often just **Informal Rigor**. Sometimes it's disguised as **Refinement Calculus**, where one refines a specification into code. If the refinement step uses classical logic to introduce a branch, the refinement is invalid unless decidability is established.

  ### 3. The Advanced Move: Classical Realizability
  There is a niche but rigorous area where you *can* extract code from classical proofs, but the code looks different.

  *   **The Mechanism:** Through **Classical Realizability** (associated with Krivine, Griffin, Parigot), classical logic corresponds to control operators (like `call/cc` or `throw/catch`).
  *   **The Code:** A proof of $P \lor \neg P$ using LEM extracts to a program that *tries* to prove $P$, and if it gets stuck (via a continuation), it backtracks and assumes $\neg P$.
  *   **The Mismatch:** If the papers you are reading show simple functional code (no continuations, no backtracking) but justify it with classical logic, they are **not** doing classical realizability. They are likely falling into category 2 (Sloppiness).

  ### 4. Is it Markov's Principle or Double-Negation?
  *   **Markov's Principle (MP):** $\neg\neg \exists x. P(x) \to \exists x. P(x)$ (for decidable $P$). This allows you to turn a "it's impossible that there isn't a solution" into "here is a solution" by unbounded search. It is semi-constructive. It does *not* justify branching on $P \lor \neg P$ for arbitrary $P$.
  *   **Double-Negation Translation:** This translates classical proofs into intuitionistic ones. It usually adds overhead (continuations). It doesn't allow you to sneak classical branching into clean code; it makes the code *more* complex to accommodate the classical logic.

  ### 5. What to Call the "Moving Fence"
  There isn't one single philosophical name for "moving the fence based on convenience," because formally, **the fence shouldn't move.**

  However, in the literature, this practice is often euphemistically referred to as:
  1.  **"Separation of Concerns"**: Distinguishing verification (can be classical) from implementation (must be constructive).
  2.  **"Classical Reasoning in the Meta-Theory"**: Claiming the logic *about* the system is classical, while the system itself is constructive. (This is dangerous if the meta-theory reasoning dictates the object-level code).
  3.  **"Extractive Classical Logic"**: A term sometimes used when authors assume they can extract from classical proofs without detailing the control operators.

  ### Where the Boundary Fails Conceptually
  The boundary fails when **Data depends on Proofs.**

  In Type Theory, this is the distinction between:
  *   **Weak Sum ($\Sigma_{weak}$):** You know a witness exists, but you can't inspect the proof to build data. (Compatible with classical logic in some settings).
  *   **Strong Sum ($\Sigma_{strong}$):** The witness is packaged with the proof, and you can project the witness out to use in computation. (Requires constructive proof).

  If an author uses LEM to prove $\exists x. P(x)$ and then extracts $x$ to use in an algorithm, they have violated the **Disjunction Property** and the **Existence Property** of intuitionistic logic.

  ### Summary Advice
  You are not confused. You are spotting a gap between formal type theory and informal mathematical writing.

  1.  **If the classical part is erased (Prop):** It's valid (Proof Irrelevance).
  2.  **If the proposition is actually decidable:** It's valid but sloppily phrased (Implicit Decidability).
  3.  **If the proposition is undecidable and the code branches:** It is **technically unsound**. The extracted code cannot exist as described.

  **How to define it:** If you need to write about this, call it **"Illicit Classical Extraction"** or **"Conflating Specification and Computation."** The specific error of using a classical proof to justify a computational branch is a violation of the **Constructive Content** requirement.

  **Recommendation:** When you read these papers, mentally insert the question: *"Is this predicate decidable?"* If yes, the author is just being lazy with language. If no, the author is making a false claim about the extractability of their code.
