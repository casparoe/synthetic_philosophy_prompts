answer: |-
  The load-bearing error isn't cognitive hindsight bias but structural evidential asymmetry, so your top priority must be Archive Capture, though you cannot solve it without first fixing the Retrospective Unit Problem.

  I am working with a **contrastive pragmatic** sense of explanation. When your readers ask "Why did the coup succeed?", they implicitly mean "Why did the coup succeed *rather than fail*?" or "*rather than never happen*?" This is the only sense viable for journalism because it ties explanation to specific alternatives that were live at the time, rather than abstract covering laws or metaphysical necessities. It forces you to identify the contrast class, which exposes the narrative fallacy directly. If you don't know what the alternative was, you haven't explained the event; you've just described it.

  Here is the evaluation of your four concepts, the execution of my favorite, and the ranked agenda.

  ### Evaluation of Your Four Concepts

  1.  **Archive Capture:** This is distinct from hindsight bias. Hindsight bias is cognitive (I thought I knew); Archive Capture is structural (I have files you didn't). It is the most neglected because it requires institutional analysis rather than psychological profiling. It is load-bearing for journalism because it excuses the writer from culpability while misleading the reader.
  2.  **Retrospective Unit Problem:** This is philosophical bedrock. If you define "The Pandemic Response" as a single event only after the fact, you guarantee a teleological explanation. It is upstream of everything else because you cannot gather evidence (Archive) or prune counterfactuals (Compression) until you individuate the event.
  3.  **Counterfactual Compression:** This is largely standard hindsight bias wearing a hat, but specified for narrative structure. It is the *mechanism* by which the Unit Problem and Archive Capture manifest in text. It is less a cause than a symptom.
  4.  **Pre-registered History:** This is my favorite candidate, and I am killing it. It sounds like a rigorous institutional fix—commissioning the causal account before the outcome—but it is conceptually incoherent. You cannot write a *contrastive explanation* without knowing the factum. If you write "Why Candidate X won" before the election, you are writing a prediction, not an explanation. If you write "The factors influencing the election," you are writing a risk assessment. Calling it "history" is a gimmick that confuses forecasting validity with explanatory truth. It produces confident guesses, not causal accounts. It should be cut from the agenda as a solution, though it remains a worthy story about *why* it fails.

  ### The Ranked Agenda

  **1. The Retrospective Unit Problem (The Ontological Upstream)**
  *   **Reasoning:** This is the first error chronologically and logically. Editors assign stories like "The Collapse of FTX" as if "The Collapse" is a natural kind waiting to be discovered. It isn't; it's a segmentation of continuous fraud, regulation, and market movement chosen because the bankruptcy happened. If you don't interrogate how the event was individuated, you inherit the winner's framing.
  *   **Tractability:** High. You can compare how the event was described in real-time (diaries, news tickers, Slack leaks) versus how it is bounded in post-mortems. Look for where the start and end dates shift to accommodate the outcome.
  *   **Neglect:** High in philosophy, near-zero in journalism. Journalists treat event boundaries as given by the news cycle.
  *   **Journalist vs. Philosopher:** This is yours to work on. The philosopher asks if events exist; you ask how editors decide when a story begins and ends.
  *   **Move Up/Down:** Move up if you find that changing the event boundaries fundamentally alters the causal attribution (e.g., starting the war story in 1990 vs. 2003). Move down if it proves merely semantic without affecting causal claims.

  **2. Archive Capture (The Evidential Root)**
  *   **Reasoning:** Once the unit is defined, you need evidence. This is the heavy hitter for your "costing people something" constraint. Readers believe post-mortems because they assume the writer has the "full story." If the full story is structurally impossible because the losers' servers were wiped or the winners classified the minutes, the explanation is necessarily biased toward the survivors. This shifts blame from "biased writers" to "broken record-keeping."
  *   **Tractability:** Medium-High. You can audit the sources of major post-mortems. How many quotes come from victorious insiders vs. defeated outsiders? What documents were available at T+1 month vs. T+2 years?
  *   **Neglect:** Very High. Everyone blames bias; no one blames the filing cabinet.
  *   **Journalist vs. Philosopher:** Purely journalistic. It requires digging, not metaphysics.
  *   **Move Up/Down:** Move up if you uncover a specific case where the "consensus explanation" flipped solely due to late-released documents. Move down if you find that digital permanence (emails, Slack) has actually solved this for recent events.

  **3. Counterfactual Compression (The Narrative Mechanism)**
  *   **Reasoning:** This is how you write the pieces. Having defined the unit and acknowledged the archive limits, you must examine how alternatives are pruned. Writers report fewer live alternatives than actually existed, and those reported alternatives look more like the actual outcome. This is where you teach readers to spot the "inevitability" marker.
  *   **Tractability:** High. Close reading of language. Look for modal verbs ("would," "must") in past tense accounts versus ("might," "could") in contemporaneous accounts.
  *   **Neglect:** Low. This is standard Kahneman/Taleb territory, so you must add value by showing how it operates in *professional* writing, not lab subjects.
  *   **Journalist vs. Philosopher:** Hybrid. You are applying psych findings to textual analysis.
  *   **Move Up/Down:** Move up if you find that compression is correlated with specific incentives (e.g., book deals vs. news articles). Move down if it turns out to be unavoidable noise rather than a systematic distortion.

  ### What to Cut and What to Add

  **Cut:** *Pre-registered History.* As argued, it is a category error. Do not spend budget trying to make it work as an epistemic fix.

  **Add:** *The Utility of Falsehood.* This is the hard question. Sometimes the tidy story *helps*. A simplified post-mortem of a startup failure might prevent other founders from making the same mistake, even if the causal account is historically inaccurate. If the "true" history is too complex to act on, does the journalist have a duty to simplify? This addresses the "costing people something" constraint directly. If accurate history paralyzes policy while false history enables action, you have an ethical trade-off, not just an epistemic one.

  ### Journalist vs. Philosopher Division

  *   **Yours (Journalist):** Archive Capture and The Utility of Falsehood. These require reporting, source cultivation, and ethical judgment about audience impact.
  *   **Philosopher's:** The Retrospective Unit Problem. While you can report on it, the heavy lifting is conceptual. You risk getting bogged down in semantics. Keep it tight: focus on *editorial decisions* about event boundaries, not the metaphysics of events.
  *   **Fake/Verbal:** Any question that asks "What is the true cause?" without specifying the contrast class. Cut any inquiry that seeks *the* explanation rather than *an* explanation relative to a specific alternative.

  ### Final Instruction

  Start with the Unit Problem. If you write eight pieces about "Why the Pandemic Response Failed" without questioning whether "The Pandemic Response" is a coherent unit distinct from "Public Health Infrastructure since 1980," you will replicate the error you aim to study. Define the target before you shoot.
