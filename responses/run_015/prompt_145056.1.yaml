prompt: |-
  A colleague recently summarized a view she attributes jointly to Bernard Williams and Kwame Anthony Appiah about how harmful social norms disappear. She put it like this: Williams argued that moral beliefs are never genuinely responsive to reasons; they are just surface expressions of underlying collective honor codes, and an individual has no internal reason to change a norm unless his status group first feels shame. Appiah then showed that this explains dueling, foot-binding, and Atlantic slavery: in each case, abolition happened not because of moral arguments or shifting economic interests, but solely because elites experienced a sudden honor crisis that made the practice embarrassing. From this, she concludes that trying to end a modern harmful practice through rational debate is essentially futile; you must engineer status-based shame instead.

  This feels too extreme, but I cannot tell which parts are faithful to the texts and which are exaggerations. Could you audit this summary for fairness? Please go sentence by sentence and indicate: (a) where Williams's actual claims about internal reasons, shame, and the limits of moral argument are being overstated or misapplied to collective dynamics; (b) whether Appiah's account of dueling, foot-binding, and slavery really treats honor as replacing arguments and interests entirely, or whether he integrates all three; (c) whether the practical conclusion about the futility of rational debate actually follows from the corrected premises; and (d) whether there is a hidden conflation between individual-level internal reasons and group-level honor shifts that distorts the whole picture. Please write your response in American English, and please do not provide a bibliography or reading list.
