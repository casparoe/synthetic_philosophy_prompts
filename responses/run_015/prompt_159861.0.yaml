answer: |-
  You have put your finger on the exact nerve that makes the Integrated Information Theory (IIT) debate so fractious. You are describing a phenomenon where the *inputs* to the theory are adjusted to ensure the *outputs* match pre-theoretical intuitions, without independent criteria for selecting those inputs.

  Here is the breakdown of the terminology, the established concepts, and a proposed coinage for the specific argumentative move you are tracking.

  ### 1. The Technical Terms (Inside IIT)
  If you ask an IIT proponent, they will not say they are shifting descriptions; they will say they are applying the **Exclusion Postulate**.

  *   **Spatio-temporal Grain:** This is the established technical term for the "zoom level" and "timescale" you described. IIT explicitly states that consciousness must be evaluated at the grain where information integration is maximised.
  *   **Maximality:** This is the rule that says if a subsystem has a higher $\Phi$ (integration score) than the whole, or the whole has a higher $\Phi$ than the parts, you must choose the peak.
  *   **Causal Marginalization:** The mathematical move of treating certain elements as background noise rather than part of the system.

  **Verdict:** These terms describe the *mechanism* allowed by the theory, but they do not name the *problem* you have identified. They are the tools used to make the move, not the label for the move's suspicious nature.

  ### 2. The Established Philosophical Concepts
  There are three existing concepts that cover parts of this, but none capture the *dialectical maneuver* perfectly.

  *   **The Grain Problem:** (High Confidence)
      *   *Origin:* Philosophy of mind (panpsychism), notably discussed by William Seager and others.
      *   *Definition:* The difficulty of explaining why consciousness appears at the scale of neurons (or humans) rather than atoms or galaxies.
      *   *Fit:* This covers the metaphysical worry, but not the argumentative move. It explains *why* the theorist is worried, not *what* they are doing when they shift the scale to dodge a counter-example.
  *   **Gerrymandering:** (High Confidence)
      *   *Origin:* Political science, adopted by philosophy of science (e.g., Peter Godfrey-Smith, who has used it explicitly against IIT).
      *   *Definition:* Drawing boundaries around a system in an arbitrary way to produce a desired result.
      *   *Fit:* This is the closest established term. Critics accuse IIT proponents of "gerrymandering the system boundaries." However, "gerrymandering" is a metaphor. It implies bad faith or arbitrariness but lacks technical precision regarding *levels of description*.
  *   **Putnam's Triviality Results:** (Moderate Confidence)
      *   *Origin:* Hilary Putnam (1988), regarding computational functionalism.
      *   *Definition:* The argument that any open physical system can be described as implementing any computation if you map the physical states to logical states loosely enough.
      *   *Fit:* This is the structural ancestor of your problem. It shows that "implementation" is underdetermined by physics. However, it is specific to computation, not general causal structures.

  ### 3. The Coinage: "Descriptive Slippage"
  Since there is no single canonical noun for the *argumentative move* itself (distinct from the metaphysical problem), I propose the term **Descriptive Slippage**.

  **Definition:**
  *Descriptive Slippage* occurs when the level of abstraction, granularity, or boundary definition used to model a system is adjusted *post hoc* to align a theory's output with pre-theoretical intuitions, in the absence of independent criteria for selecting that description.

  **Why this term?**
  *   **Slippage:** Implies a lack of friction. In a robust theory, the "grip" between the world and the model should be tight; you shouldn't be able to slide the description around easily.
  *   **Descriptive:** Locates the problem in the *mapping* of the world to the model, not in the data or the theory's internal logic.
  *   **Distinction:** It distinguishes the *move* from the *Grain Problem* (which is metaphysical) and *Gerrymandering* (which is metaphorical/political).

  ### 4. Boundary Cases: When is re-description legitimate?
  You asked for the edges of the concept. Re-describing a system is not always fallacious. Here is how to distinguish **Legitimate Multi-Scale Analysis** from **Descriptive Slippage**.

  | Feature | Legitimate Multi-Scale Analysis | Descriptive Slippage |
  | :--- | :--- | :--- |
  | **Selection Criteria** | The scale is chosen *before* running the theory, based on independent physical or functional data (e.g., "We choose the neural timescale because EEG shows synchrony here"). | The scale is chosen *after* seeing the result, based on whether the output matches intuition (e.g., "This scale says the grid is conscious, so let's try a coarser grain"). |
  | **Consistency** | The same rules for selecting scale are applied to all systems (brains, grids, thermostats) uniformly. | The rules for selecting scale shift depending on the system (strict for grids, flexible for brains). |
  | **Convergence** | Different reasonable descriptions converge on roughly the same verdict. | Small changes in description lead to wildly different verdicts (high sensitivity). |
  | **Prediction** | The chosen description predicts *other* phenomena (e.g., behaviour, reportability). | The chosen description explains *only* the consciousness verdict. |

  **Example of the Boundary:**
  *   *Not Slippage:* A climate scientist models the earth at different resolutions to see which best predicts temperature. They pick the one that matches *temperature data*. (Independent validation).
  *   *Slippage:* A consciousness theorist models the brain at different resolutions to see which best predicts *consciousness*. They pick the one that matches *their intuition about consciousness*. (Circular validation).

  ### 5. Confidence Statement
  *   **Established Vocabulary:** I am **highly confident** that "Spatio-temporal Grain," "Exclusion Postulate," and "The Grain Problem" are the correct technical and philosophical terms currently in circulation. I am **highly confident** that "Gerrymandering" is the term most frequently used by critics (specifically Godfrey-Smith and Aaronson) to describe this boundary-shifting.
  *   **Coinage:** I am **moderately confident** that "Descriptive Slippage" is not currently a standard term of art in this specific debate, though "slippage" is used loosely in sociology and linguistics. I am offering it here as a precise label for the *epistemic maneuver* you identified.
  *   **What would change my mind:** If you found a paper by Tononi, Koch, or Barrett (2020–2024) that explicitly defines this maneuver as "The Reference Class Problem" or "Input Underdetermination" as a formal label, those would supersede my coinage. However, those terms are usually broader. If a philosopher argued that IIT's *Maximality* principle solves this entirely, they would claim there is no slippage, only optimization. Your counter-argument (that the search space for optimization is undefined) remains the strong position.

  ### Summary for your Article
  You can write that while IIT proponents call this **"optimising the spatio-temporal grain"** under the **Exclusion Postulate**, critics argue it amounts to **Gerrymandering**. The deeper epistemic fault, however, is **Descriptive Slippage**: the ability to slide the definition of the system until the theory yields the "correct" answer, rendering the theory immune to counter-example not by its logic, but by its flexibility.

  This distinguishes the *rule* (Maximality) from the *abuse* (Slippage), which is the nuance your readers will need.
