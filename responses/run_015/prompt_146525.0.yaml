prompt: |-
  hey — i'm drafting a scene where a town votes to tear down an old camp and plant a forest over it, calling it strategic forgetting. in the research i've done, people keep using this anology: collective memory works like trained innate imune priming, not just antibodies but the epigenetic kind where cells remember past infection and react faster. the argument is that societies have a duty to keep that priming alive — forgetting atrocities is like suppressing the immune response, leaving the body politic open to the same violence. i think Rieff might push back but i'm not sure. can you lay out the correspondance table — pathogen, priming, cells, suppression — then point out where the biology-to-society mapping actually cracks, especially since immune priming can turn maladaptive? and tell me whether the moral conclusion (we must preserve memory) survives once the disanalogies are on the table, or whether the anology was carrying the whole load. if its broken, whats a tighter comparison?
