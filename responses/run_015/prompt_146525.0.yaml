      *   *Suppression:* Strategic forgetting/erasure.
      *   *Reaction:* Vigilance/Prevention of recurrence.

  4.  **Identifying the Cracks (The Critical Analysis):**
      *   *Specificity:* Immune priming is often non-specific (trained immunity reacts to *any* threat). Memory needs to be specific (remember *what* happened, not just that *something* bad happened). If society reacts to *everything* as an atrocity, you get paranoia.
