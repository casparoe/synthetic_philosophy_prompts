answer: |-
  **The Case: The Ward Board**

  In the acute intake ward at St Jude's, the nursing team relies on the 'MediTrack' wall-screen, a central digital display updated in real-time by whichever nurse is currently administering drugs. The screen lists every patient's dosage schedule, flagged green for administered and red for pending. Any nurse on shift treats the screen's status as authoritative without cross-checking paper charts; if the screen says 'Given', they proceed to the next task. Maintenance is rotational: the shift lead checks connectivity, the outgoing nurse logs exceptions, and IT patches the backend remotely. When a dosage entry changes silently due to a backend sync error, the discrepancy is flagged during the next handover and logged as a technical fault according to standard protocol.

  ***

  **Analysis of the Criteria**

  **1. Parity plus Glue (Clark/Chalmers)**
  We apply the trust-and-glue conditions directly to the text. The resource is reliably available (wall-screen in the ward), easy to get at (central display), automatically endorsed (treated as authoritative without cross-checking), and previously endorsed (the protocol establishes this standing authority). The functional profile matches that of a biological belief: it guides action (proceed to next task) and is consulted automatically.
  *Verdict:* **Yes.** The screen realises a belief state for the nurses.
  *Consequence:* Because the *same token* resource is used by the whole team simultaneously, and upkeep is distributed, the parity principle implies this single inscription constitutes a belief held by multiple agents at once. The boundary of the cognitive system is not the skin, but nor is it individual; it is the team-screen dyad.

  **2. Practice/Integration (Menary/Sutton)**
  This criterion looks for enculturation. The text notes the screen is embedded in a "standard protocol," updates happen during "handover," and maintenance is a defined role ("shift lead," "outgoing nurse"). The workflow is plastic: nurses update the screen *while* administering drugs, suggesting the motor routine and the cognitive update are fused. The resource shapes the practice (protocol dictates reliance), and the practice shapes the resource (IT patches based on ward usage).
  *Verdict:* **Yes.** It is keyed to the *routine of handover* and the *rotational maintenance*.
  *Can 1 and 2 come apart?* You asked if a frictionless resource breaks this. If the screen were replaced by a simple traffic light (Green = Safe), Criterion 1 might still pass (reliable, automatic). Criterion 2 would likely *still* say Yes, provided the light is embedded in a normative practice. Menary argues cognition is *always* enculturated; even reading a light requires training to recognise the norm. To break C2 while keeping C1, you would need a resource that is functionally perfect but normatively alien—perhaps a subliminal cue. But in ordinary workplaces, high reliability usually presupposes training. You are not overreading C2; it is robust. To separate them, you would need a case where the tool is used *correctly* but without *understanding* the practice (e.g., a temp nurse following instructions blindly). There, C1 says Yes (functional role), C2 says No (no genuine integration).

  **3. The Revision-Profile Test (Your Hobby-Horse)**
  Here we examine the phenomenology of error correction described in the final sentence. When the content changes silently (sync error), the response is to log a "technical fault." This frames the mismatch as a breakdown in the *instrument*, requiring repair or reporting. Contrast this with biological memory: if I recall a dose incorrectly, the correction feels like admitting *I* was wrong (self-revision). In the Ward case, the nurse does not introspect; she reports IT. The mismatch is externalised.
  *Verdict:* **No.** The state is not part of the *agent's* mind in the first-personal sense, even if it is part of the *system*.
  *Is this real work?* It is doing work, but it is distinguishing between *extended cognition* and *distributed cognition*. It insists that for a resource to be *my* mind, I must own the error. However, be warned: this privileges the phenomenology of biological memory. If biological memory were as reliable as the screen, would we ever feel "I was wrong," or would we always blame the brain? The test risks defining cognition by the fallibility of meat rather than the functional role.

  ***

  **The Structural Feature**

  The single structural feature driving the divergence (Yes/Yes/No) is **Distributed Custodianship**.

  In Otto's case, Otto owns the notebook. He writes it, he maintains it, he loses it. When the content is wrong, *he* wrote the wrong thing. In the Ward case, no single nurse owns the screen. The content is authored by the shift, maintained by IT, and verified by the lead.
  *Remove it:* If you assign one nurse sole responsibility for the screen (she writes it, she maintains it, she alone is authorised to update it), the case collapses back into Otto.
  *Result:*
  1.  Parity: Yes.
  2.  Practice: Yes.
  3.  Revision-Profile: **Yes.** If she alone maintains it and it changes silently, she cannot blame "the team" or "IT." She must assume her own prior entry was faulty. The phenomenology shifts from repair to self-correction.
  *Confirmation:* Removing distributed custodianship aligns all three criteria.

  ***

  **Parity vs. The Revision-Profile**

  You asked if your test is a friendly amendment or a rival. It is a **rival**.
  Parity says: If it walks like a belief and quacks like a belief, it is a belief (regardless of who owns the error).
  Your Test says: If the error feels like a broken tool, it is not a belief, even if it walks and quacks perfectly.
  *Does it kill Otto?* No. Otto passes because he is the sole custodian. The phenomenology of "I wrote that" is preserved.
  *The Danger:* It over-generalises against *collaborative* cognition. It implies that shared cognitive systems (science teams, cockpit crews) can never literally share a mind, only couple tightly. If your seminar goal is to defend the possibility of distributed mental states, this test undermines that. If your goal is to protect the individuality of the subject, it is effective. Present it as a constraint on *subjectivity*, not on *cognition* per se.

  ***

  **Spec Consistency**

  Are the specs jointly satisfiable? **Yes.**
  The Ward case meets all of them:
  1.  One paragraph, ordinary setting.
  2.  Glue conditions met (authoritative, accessible).
  3.  Shared token resource (one screen, many nurses).
  4.  Distributed upkeep (rotational/IT).
  There is no contradiction. The tension arises only when you apply the three criteria, which is the point of the exercise.

  ***

  **Standard Objections**

  I have designed the case to minimise the usual student reflexes:

  1.  **Coupling-Constitution (Adams & Aizawa):** This is **genuinely available**. Students can argue the screen is merely coupled because the nurses can walk away from it. The screen processes data (sync errors) independently of the nurses. This is the strongest objection left on the table.
  2.  **Cognitive Bloat:** **Designed out.** The screen only holds dosage schedules for current patients, not the whole internet or library. It is task-specific.
  3.  **Derived Content:** **Genuinely available.** Students may argue the screen only has meaning because the nurses interpret it. This is a strong point for discussion: does the screen have intrinsic intentionality?
  4.  **The "Mark of the Cognitive":** **Designed out.** By satisfying Glue, you force them to argue about *constitution* rather than *causal role*.

  **Seminar Strategy:**
  Let them hammer the Coupling-Constitution point. It keeps them honest. But steer them towards your Hobby-Horse (Criterion 3) by asking: "If the screen is functionally identical to memory, why does the error feel different?" That is where the philosophical meat lies for your specific aims.

  *(Note: British English spelling used throughout: 'realise', 'authorised', 'programme', 'centre', 'behaviour'.)*
