prompt: |-
  I'd like your help making sense of a situation that's been nagging at me for a few months. A friend of mine and I both got into estimating the odds that a mid-sized software company — one we both know reasonably well, and one where we each have some skin in the game, since we're both trying to decide whether to put a modest amount of our own money into it — would still be a going concern five years from now. We did the work independently: we read the same public filings, looked at the same market and hiring data, and even ended up interviewing two of the same former employees. When we compared notes, I had landed on roughly 55% and she had landed on roughly 20%. We then talked it through over the course of a couple of weeks — walking through each other's reasoning line by line, double-checking the arithmetic, and stress-testing each other's assumptions. Neither of us found a clear error, and neither of us moved meaningfully. We both regard the other as a sharp, careful, and honest reasoner, and we're both confident that the other has seen essentially the same evidence we have.

  I take forecasting and calibration pretty seriously — I keep a personal calibration log and I've read a fair amount on the topic — so this one has been especially uncomfortable. The thing that keeps bothering me is the structure of it: if we really did start from the same information, and we're both reasoning as well as we can, then shouldn't we have converged? The fact that we didn't seems to imply that one of those assumptions is false, but I can't tell which one, and I don't even know what it would mean in practice to check whether we actually shared a starting point. I'd like to understand what a persistent gap like this really tells me — about her reasoning, about mine, or about the shape of the disagreement itself — and what I should do about it. Concretely: should I split the difference, should I treat her 20% as a genuine piece of evidence that I'm overconfident, should I try to hunt down the one piece of information we don't actually share, or is there some reason to just accept that two careful people can rationally end up this far apart?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Situation:** The user and a friend independently estimated the 5-year survival probability of a mid-sized software company.
      *   **Inputs:** Same public filings, market/hiring data, interviewed same former employees.
      *   **Outputs:** User = 55%, Friend = 20%.
      *   **Process:** Discussed reasoning line-by-line, checked arithmetic, stress-tested assumptions. No errors found. Neither moved significantly.
      *   **Relationship:** Mutual respect (sharp, careful, honest).
      *   **User's Background:** Takes forecasting/calibration seriously (keeps logs, reads literature).
      *   **Core Question:** Why didn't we converge (Aumann's Agreement Theorem vibe)? What does this gap tell me? What should I do (split difference, treat as evidence, hunt for info, accept disagreement)?

  2.  **Initial Assessment & Theoretical Framework:**
      *   *Aumann's Agreement Theorem:* Two rational agents with common priors and common knowledge of each other's posteriors cannot agree to disagree.
      *   *Reality Check:* Humans aren't ideal Bayesian agents. "Common knowledge" is incredibly hard to establish. "Same information" $\neq$ "Same interpretation of information."
      *   *The Gap:* 55% vs. 20% is large, but not astronomical (like 99% vs. 1%). It suggests a fundamental divergence in *models* or *priors*, not just data processing errors.

  3.  **Deconstruct the "Same Information" Assumption:**
      *   Did they *really* see the same thing?
      *   *Tacit Knowledge:* Interviewing former employees yields qualitative data. One person might weigh a specific comment heavily; the other might dismiss it as an outlier.
      *   *Priors:* What was their baseline belief about software company survival *before* looking at the data?
      *   *Mental Models:* How do they model risk? (e.g., User focuses on product-market fit, Friend focuses on cash burn/macro headwinds).

  4.  **Address the "Convergence" Expectation:**
      *   The user expects convergence because they assume rational agents + common info = agreement.
      *   Need to explain why this failed without invalidating either party's rationality.
      *   Key concept: *Hidden Priors* and *Structural Uncertainty*.

  5.  **Formulate Actionable Advice (What to do):**
      *   *Split the difference?* External view suggests pooling estimates often improves accuracy (Wisdom of Crowds), but 55% and 20% average to 37.5%. Is that useful?
      *   *Treat friend's estimate as evidence?* Yes, definitely. If the friend is calibrated, their 20% is data.
      *   *Hunt for missing info?* Maybe, but they claim to have shared everything. The gap is likely interpretive.
      *   *Accept disagreement?* Yes, "reasonable disagreement" is a valid state.

  6.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the discomfort. It *feels* like a puzzle because of Aumann's theorem. Validate their rigorous approach.
      *   **Theoretical Reality Check (Aumann):** Explain why Aumann doesn't apply perfectly here. Humans aren't logic bots. "Common Knowledge" is the bottleneck.
      *   **Diagnosing the Divergence (The "Why"):**
          *   *Priors:* Different baseline expectations for the sector.
          *   *Weighting:* Same data, different weights. (e.g., Churn rate vs. TAM).
          *   *Model Structure:* Different causal stories. (e.g., "They will pivot" vs. "They are stuck").
          *   *Risk Definition:* What does "going concern" mean exactly? (Profitable? Alive? Acquired?)
      *   **Actionable Steps (The "What Now"):**
          *   *Don't just split the difference:* Understand *why* before aggregating.
          *   *Update on the Person, not just the Number:* If the friend is well-calibrated, their 20% should pull the user down, even if the reasoning isn't accepted. (Bayesian update on reliability).
          *   *Pre-Mortem/Scenario Planning:* Instead of one number, map the worlds where each is right.
          *   *Decision vs. Belief:* Does the 55% vs. 20% actually change the investment decision? (Expected Value calculation).
      *   **Calibration Check:** Since the user keeps logs, suggest tracking this specific prediction to learn from the divergence later.

  7.  **Refining the Tone:**
      *   Needs to be analytical, empathetic, and intellectually rigorous.
      *   Avoid saying "you're wrong" or "she's wrong."
      *   Focus on *epistemic humility* and *model diversity*.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, did they actually share priors?* The prompt says "same evidence," not "same priors." This is the likely culprit. I need to emphasize that "evidence" $\neq$ "prior beliefs."
      *   *Is 55% vs 20% actually that big?* In log odds, it's significant. $\log(55/45) \approx 0.2$, $\log(20/80) \approx -1.4$. That's a real gap.
      *   *Investment Context:* They are putting money in. This isn't just academic. Need to address the *decision* aspect. If the EV is positive at 20% but negative at 55%, that's a problem. If it's positive at both, maybe it doesn't matter.

  9.  **Final Polish:** Organize with clear headings. Ensure the distinction between "belief convergence" and "decision alignment" is clear. (Aumann is about belief, investment is about decision).

  **(Self-Correction Note):** I should make sure to mention that "same information" is practically impossible. Even reading the same filing, one person notices the footnote on debt covenants, the other notices the revenue growth line. That's *attention*, not just data.

  10. **Final Structure:**
      *   Intro: Validate the unease (Aumann's ghost).
      *   Why you didn't converge (Priors, Weighting, Models, Definitions).
      *   What the gap tells you (Model diversity is valuable).
      *   What to do (Update on calibration, EV calculation, Scenario planning).
      *   Conclusion: Embrace the disagreement.

  11. **Drafting the Content:** (Mental outline matches the final output structure). *Focus heavily on the distinction between "data" and "interpretation framework."*

  12. **Review against constraints:** The user wants to understand what the gap tells them and what to do. Ensure both are answered clearly.

  *(Self-Correction during final review)*: Make sure to explicitly address the "split the difference" question. It's a common heuristic but needs nuance.

