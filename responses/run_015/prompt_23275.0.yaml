answer: |-
  This is a classic and subtle debate in the philosophy of language. The confusion you are experiencing is well-founded because both theories aim to preserve classical logic (specifically the Law of Excluded Middle) while offering diametrically opposed accounts of what is happening in a borderline case.

  Here is the precise breakdown of how Epistemicism and Supervaluationism differ regarding **Bivalence** and the **Law of Excluded Middle (LEM)**, and how Supervaluationism manages to validate LEM without Bivalence.

  ### 1. The Logical Principles at Stake

  To understand the divergence, we must first distinguish the two logical principles, which are equivalent in classical logic but come apart in theories of vagueness.

  *   **The Principle of Bivalence:** Every meaningful declarative sentence is either **True** or **False**. There is no third option (no truth-value gaps).
  *   **The Law of Excluded Middle (LEM):** For any sentence $P$, the complex disjunction **"$P \lor \neg P$"** is **True**.

  In standard classical logic, if Bivalence holds, LEM holds. However, theories of vagueness often try to keep LEM (because "It is either raining or not raining" seems undeniable) while rejecting Bivalence (because "It is raining" seems neither true nor false when it is drizzling).

  ---

  ### 2. Epistemicism: Bivalence and LEM Both Hold

  **Proponent:** Timothy Williamson.
  **Core Thesis:** Vagueness is a form of ignorance.

  *   **Treatment of Bivalence:** **Holds.**
      For the epistemicist, there is no such thing as a truth-value gap. If you take a borderline case (e.g., a man with 5,323 hairs), the sentence "This man is bald" is strictly **True** or strictly **False**.
  *   **Treatment of LEM:** **Holds.**
      Since "This man is bald" is either True or False, the disjunction "This man is bald or this man is not bald" is obviously True.
  *   **The "Precise Cut-off":**
      Epistemicism posits that there is a sharp boundary in the world (or in the extension of the predicate) that we cannot know. There is a specific number of hairs $n$ such that $n$ hairs makes one bald, but $n+1$ does not.
  *   **How it changes the picture:**
      For the epistemicist, the truth of "$P \lor \neg P$" is grounded in the fact that **one of the disjuncts is actually true.** We simply do not know *which* one. The logic is fully classical; the "vagueness" is entirely in our epistemic access, not in the semantics or the world.

  ---

  ### 3. Supervaluationism: Bivalence Fails, LEM Holds

  **Proponents:** Kit Fine, Rosanna Keefe.
  **Core Thesis:** Vagueness is semantic indeterminacy (underdetermination of meaning).

  *   **Treatment of Bivalence:** **Fails.**
      Supervaluationists argue that vague predicates (like "bald") do not have a single extension. Instead, they have a range of **admissible precisifications** (ways of making the predicate precise).
      *   In some precisifications, the borderline man is "bald."
      *   In other precisifications, the borderline man is "not bald."
      *   Because his status varies across admissible precisifications, the sentence "This man is bald" is **neither supertrue nor superfalse.** It has a truth-value gap. Therefore, Bivalence is false.
  *   **Treatment of LEM:** **Holds (via Supertruth).**
      This is the specific mechanism you asked about. Supervaluationism defines truth not as truth-in-one-precisification, but as **truth-on-all-precisifications** (called **Supertruth**).
      *   Let $P$ be "This man is bald."
      *   Consider the disjunction: $P \lor \neg P$ ("This man is bald or this man is not bald").
      *   Take any admissible precisification. In that specific sharpening of the language, classical logic applies. So, in Precisification 1, either $P$ is true or $\neg P$ is true. Thus, $P \lor \neg P$ is true in Precisification 1.
      *   In Precisification 2, classical logic also applies. Thus, $P \lor \neg P$ is true in Precisification 2.
      *   In fact, in **every** admissible precisification, $P \lor \neg P$ comes out True.
      *   **Conclusion:** Since $P \lor \neg P$ is true on *all* precisifications, it is **Supertrue**.
  *   **How it changes the picture:**
      For the supervaluationist, the truth of "$P \lor \neg P$" is **not** grounded in the fact that one disjunct is true. (Remember, for a borderline case, neither disjunct is supertrue). Instead, the disjunction is true because **it is impossible to make the predicate precise in a way that makes the disjunction false.**

  ---

  ### 4. Summary of the Difference

  Here is the precise distinction regarding your question:

  | Feature | Epistemicism | Supervaluationism |
  | :--- | :--- | :--- |
  | **Borderline Case Status** | True or False (we just don't know which). | Neither True nor False (Truth-value gap). |
  | **Bivalence** | **Valid.** | **Invalid.** |
  | **Law of Excluded Middle** | **Valid.** | **Valid.** |
  | **Why is "$P \lor \neg P$" True?** | Because **one disjunct is true** (corresponds to reality). | Because the disjunction is **true on all precisifications** (valid under all sharpenings). |
  | **The Cut-off** | Real, precise, but unknowable. | Arbitrary relative to a precisification; does not exist globally. |

  ### 5. Why This Distinction Matters (The "Cost" of Each Theory)

  The reason you and your friend were arguing is likely due to the theoretical "costs" each view incurs to maintain LEM.

  **The Epistemicist Cost:**
  They save classical logic and Bivalence entirely. However, they must accept **metaphysical weirdness**. They must claim there is a fact of the matter about whether a specific micro-second makes someone "old," or a specific nanometer makes a heap a "non-heap," and that this fact is in principle unknowable. Many find this implausible.

  **The Supervaluationist Cost:**
  They save the intuition that borderline cases are indeterminate (no sharp cut-off). However, they break the link between the truth of a disjunction and the truth of its parts.
  *   In classical logic, if $A \lor B$ is true, then either $A$ is true or $B$ is true.
  *   In Supervaluationism, for a borderline case, "$P \lor \neg P$" is True, but it is **not the case** that ($P$ is True or $\neg P$ is True).
  *   This forces them to abandon certain classical inference rules (like Existential Generalization in certain contexts) and creates a logic where a disjunction can be true even though neither disjunct is true.

  ### Conclusion

  To answer your specific point of confusion: **Supervaluationism holds that "$P \lor \neg P$" is true for a vague predicate $P$ even though "$P$" is neither true nor false because truth is defined globally over the set of all precisifications.**

  *   **Epistemicism:** "$P \lor \neg P$" is true because **reality decides** one side is true.
  *   **Supervaluationism:** "$P \lor \neg P$" is true because **logic decides** it is true in every possible way of making the language precise, regardless of which side reality (or the precisification) picks.
