answer: |-
  The implicit theory of fairness presupposed by adverse-impact testing is not strict demographic parity, but rather a **rebuttable presumption against unexplained group disparities**. Under this framework, outcome proportionality is treated as the null hypothesis: in the absence of relevant differences between groups, selection rates should be roughly equal. The four-fifths rule operationalizes this by establishing a "safe harbor" threshold rather than a strict equality constraint, acknowledging that random variation and minor legitimate differences will occur. Crucially, this theory distinguishes between *unjustified* disparity (which is presumed discriminatory) and *justified* disparity (which is permitted via business necessity). Therefore, the practice does not commit you to the moral claim that groups *should* be selected at equal rates regardless of qualifications; instead, it commits you to the procedural claim that large disparities constitute *prima facie* evidence of bias that shifts the burden of proof to the employer to demonstrate that the disparity is driven by job-relevant traits rather than noise or bias. This separates it from strict demographic parity, which forbids disparity even if justified by base rates, and aligns it closer to a risk-management heuristic designed to surface potential systemic exclusion for further audit.

  This practice explicitly rules out a **purely process-focused or "blind" meritocracy**, where fairness is satisfied solely by using the same inputs and thresholds for everyone regardless of outcome. If process alone were sufficient, the four-fifths screen would be unnecessary; the fact that a neutral process can be flagged proves that the theory requires outcome monitoring. It also rules out **strict calibration** as a sufficient condition for fairness. A model can be perfectly calibrated (e.g., a score of 0.8 predicts success 80% of the time for all groups) yet still fail the four-fifths rule if the underlying base rates of success differ between groups. In such cases, the adverse-impact framework demands you alter the selection process (e.g., lower thresholds for the lower-base-rate group) to fix the rate, thereby actively breaking calibration to satisfy the disparity constraint. However, the practice is compatible with **construct validity** during the defense stage. Once a disparity is flagged, the business-necessity defense allows you to argue that the screen measures a causal trait required for the job, effectively permitting the disparity if it is "explained" by job relevance. Thus, the system tolerates calibration errors and outcome disparities only if they are causally linked to performance.

  The layered structure of a distributional screen plus a process-validity defense is an **unstable compromise** rather than a coherent single theory, and the impossibility results make this incoherence deep rather than incidental. Statistical impossibility theorems (e.g., Chouldechova, 2017) demonstrate that when base rates differ across groups, you cannot simultaneously satisfy demographic parity (or the four-fifths approximation), calibration, and equalized error rates. By prioritizing the four-fifths screen, the UGESP framework effectively forces employers to violate calibration and equalized odds whenever base rates diverge significantly. The "coherence" is legal, not statistical: the law prioritizes social stability and the appearance of equal opportunity (via the screen) over statistical purity, offering the validity defense as a safety valve for cases where the statistical tension is unavoidable. However, because "business necessity" is often harder to prove statistically than "adverse impact" is to detect, the practical default becomes optimizing for the four-fifths ratio, which implicitly enforces a form of demographic parity that contradicts the error-rate fairness required for true predictive equity.

  If you replaced the four-fifths standard with an **Equalized Odds** standard, day-to-day practice would change fundamentally in three ways. First, **what you test** would shift from selection rates ($P(\hat{Y}=1|A)$) to error rates ($P(\hat{Y}=1|A, Y=1)$ and $P(\hat{Y}=1|A, Y=0)$), requiring you to have ground-truth performance data ($Y$) for both hired and rejected applicants, which currently rarely exists and would require experimental "audit hiring" or strong imputation assumptions. Second, **what you tune** would move from a single global threshold to **group-specific thresholds**; to equalize true positive rates when base rates differ, you would legally be required to score Group A and Group B differently, which currently feels counter-intuitive to "blind" hiring policies. Third, **pass/fail outcomes would invert**: screens that currently pass (equal selection rates achieved by over-selecting lower-scoring candidates in one group) would fail Equalized Odds if error rates diverge, while screens that currently fail (lower selection rates for a group due to lower base rates but identical predictive accuracy) would pass. This would shift the compliance burden from proving "job relatedness" to proving "predictive equivalence," fundamentally altering the risk profile of your validation studies.

  Verdict: The four-fifths rule, as actually practiced, does not presuppose one coherent conception of fairness but instead enforces a legally pragmatic compromise that prioritizes rebuttable outcome proportionality over statistical consistency.
