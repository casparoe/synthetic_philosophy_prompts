  2.  **Task 1: Reconstructing the Implicit Theory:**

      *   *Is it Demographic Parity (DP)?* Strictly speaking, DP requires $P(\hat{Y}=1|A=0) = P(\hat{Y}=1|A=1)$. The 4/5ths rule allows *some* disparity (up to 20% relative difference). So it's not strict DP.
      *   *Is it a Presumption?* Yes. The legal structure is *prima facie* evidence of discrimination. It shifts the burden of proof. It says, "Disparities this large are suspicious enough to require justification."
      *   *The Theory:* It's a **Rebuttable Presumption of Group Proportionality**. It assumes that in the absence of relevant differences (job-relatedness), groups should be selected at roughly similar rates. It treats large statistical disparities as a proxy for potential bias (historical, systemic, or algorithmic) without requiring proof of intent.
      *   *Distinction:* It differs from strict DP because it allows a "buffer zone" (the 20%) and allows the disparity to stand if justified (business necessity). Strict DP is a hard constraint; this is a trigger for audit.

  3.  **Task 2: Rival Conceptions (Ruled Out vs. Compatible):**

      *   *Ruled Out (as primary standards):*
          *   **Pure Meritocracy/Process-Only:** You can't just say "the test is blind" if the outcomes skew too much. Process alone isn't enough; outcomes matter.
          *   **Strict Calibration:** A model can be perfectly calibrated (probability of success = score) for all groups but still fail the 4/5ths rule if base rates differ. The 4/5ths rule prioritizes the selection rate over the predictive accuracy match.
          *   **Equalized Odds (EO):** EO requires equal TPR and FPR. 4/5ths looks at overall selection rate ($TPR \times Base Rate + FPR \times (1-Base Rate)$). You can pass 4/5ths while violating EO (e.g., by adjusting thresholds to balance rates but messing up error rates).
      *   *Compatible:*
          *   **Business Necessity/Job Relatedness:** This is the "rebuttal" part. If the disparity is due to valid job traits, it's okay. This aligns with "Construct Validity."
          *   **Disparate Impact Doctrine (Legal):** Obviously compatible, but theoretically, it aligns with a "Risk Aversion" model regarding litigation.

  4.  **Task 3: Coherence vs. Compromise:**

      *   *Is it coherent?* Legally, yes (burden shifting). Theoretically/Statistically? No, it's a compromise.
      *   *The Tension:* The screening stage demands outcome similarity (parity-adjacent). The defense stage demands causal validity (merit-adjacent).
      *   *Impossibility Results:* Chouldechova/Berk et al. show you can't have Calibration, Equalized Odds, and Demographic Parity simultaneously if base rates differ. The 4/5ths rule essentially says "Aim for Parity unless Validity forces you away."
      *   *Instability:* It is an unstable compromise because "Business Necessity" is often vague. If base rates differ significantly, satisfying 4/5ths *requires* violating calibration or equalized odds (e.g., lowering thresholds for one group). This forces the employer to choose between legal compliance (4/5ths) and statistical fairness (Calibration/EO).
      *   *Conclusion:* It is a pragmatic legal heuristic, not a coherent statistical theory of fairness. It prioritizes social stability (avoiding gross exclusion) over statistical purity.

  5.  **Task 4: Switching to Equalized Odds (Concrete Changes):**

      *   *Current:* Test Selection Rate ($P(\hat{Y}=1|A)$). Tune thresholds to boost rates.
      *   *New (EO):* Test True Positive Rate ($P(\hat{Y}=1|A, Y=1)$) and False Positive Rate ($P(\hat{Y}=1|A, Y=0)$).
      *   *Requirement:* Need ground truth ($Y$). In hiring, $Y$ is "Job Performance." This is the killer. Currently, AI screens are tested on *hiring* data (proxy) or pre-hire assessments. EO requires knowing who *would have succeeded*.
      *   *Practice Change:*
          *   **Data:** Need performance data on hired employees, plus imputation or experimental design for rejected ones (very hard).
          *   **Tuning:** Instead of moving one threshold to balance selection rates, you might need group-specific thresholds to balance TPR/FPR.
          *   **Pass/Fail:**
              *   *Pass now, Fail later:* A screen that selects equal rates (passes 4/5ths) but has different error rates (e.g., qualifies unqualified candidates from Group A more often than Group B) would fail EO.
              *   *Fail now, Pass later:* A screen where Group B has lower base rates but the model predicts them equally well (same TPR/FPR) would fail 4/5ths (low selection rate) but pass EO.
      *   *Implication:* EO is much harder to implement because it requires outcome data ($Y$) that hiring screens usually lack (since rejected applicants don't get to perform).

  6.  **Drafting the Response:**

