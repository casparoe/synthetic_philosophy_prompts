          *   Need to phrase OM view so SC accepts it as a fair representation, and vice versa.
          *   Cruxes need to be specific points of divergence.

      *   **Section 4: Base-Rate Commitment:**
          *   This is hard. Scientists hate betting on base rates.
          *   Need a specific reference class (e.g., *American Naturalist* 2020-2025).
          *   Need a coding rule (independent panel).
          *   If they can't agree, record the failure. *Decision:* Let's have them agree on the *attempt* but acknowledge the difficulty in defining the "vindication" criteria. Or, better for the exercise, have them commit to a specific pilot study. Let's go with a specific journal year and a blinded coding protocol.

      *   **Section 5: Asymmetry of Omission:**
          *   OM fears: Missing a function (Type II error in function detection). Cost: Ignoring the engine of evolution.
          *   SC fears: Inventing a function (Type I error). Cost: Just-so stories, wasted resources.
          *   Short run vs. Long run.

      *   **Section 6: The Four Cases:**
          *   *Panda Thumb:* SC win (exaptation/co-option of wrist bone). OM concession (not a *de novo* finger, but still selected for grasping).
