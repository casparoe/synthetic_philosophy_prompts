          4.  Base-Rate Commitment (reference class, predicted fraction, coding rules).
          5.  Asymmetry of Omission (cost of errors: false adaptation vs. missed constraint).
          6.  Four Specific Cases (Panda thumb, Vertebrate eye, Giraffe recurrent laryngeal nerve, Darwin's Moth).
