  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal. "Joint Statement on the Role of Selection and Constraint in Evolutionary Explanation."
      *   **Introduction:** Briefly state the purpose (ending the talking past each other).

      *   **Section 1: Agreed Claims:**
          *   Need common ground.
          *   Selection exists.
          *   Constraints exist.
