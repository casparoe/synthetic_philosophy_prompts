answer: |-
  a. In a rare cardiomyopathy, Transcription Factor T (C) initiates hypertrophy (E) by binding DNA. [Stipulation:] T exists only fused to Chaperone H; separation is physically impossible in this genotype. The only route to alter T is altering H. [Stipulation:] H independently stabilizes cardiac mRNA, directly promoting E regardless of T's binding. T is necessary for E (H alone insufficient), but any intervention on T varies H, which varies E directly. Saturation prevents lowering H without lowering T. No technology separates them; the bond is law-like in this genotype. Trying a different intervention fails as all routes target H. Testing the reverse direction fails as degradation pathways are saturated.

  b. Counterfactual: "If T had not bound DNA, hypertrophy would not have occurred." The closest world removes the T/H complex just prior to binding, holding the past fixed up to that moment. Since T is necessary for E, E fails in this world. This requires only a local miracle (absence of complex), avoiding backtracking into the patient's history. Because the counterfactual dependence is clear and the closest world is uncontested, the verdict is yes: C caused E.

  c. Interventionist: Conditions: I must correlate with C; I must affect E *only* via C; I must be uncorrelated with other causes of E. Candidate: Manipulating H concentration to shift T. Failure: Manipulating H changes E directly (mRNA stabilization), violating the "only via C" constraint. Because the bond is nomological, no intervention can vary C while holding the H-pathway fixed. Output: No verdict (causal claim undefined). The failure is metaphysical (structural inseparability), not merely evidential.

  d. Feature: Nomological bundling of the cause with a direct confounder. If removed, allowing independent manipulation of T, interventionism yields a yes verdict matching the counterfactualist.

  e. Strongest reply: Allow conceivable but nomologically impossible interventions that break the bond. Counterfactualist answer: That tests a different variable (T*), not the actual C embedded in the system. Disagreement remains on whether actual C caused E. This sits uncomfortably with interventionism's aim to analyze actual causal structures rather than idealized ones.

  f. A student claiming interventionism is merely more fine-grained misses that demanding surgical precision can render actual causal relations invisible when nature is messy.
