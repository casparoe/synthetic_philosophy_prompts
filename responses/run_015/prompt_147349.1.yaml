answer: |-
  1. "The job description"
  The formalism must guide a binary decision—commit resources or withhold them—based solely on weak, heuristic support. It functions as a filter against false confidence. It fails if it manufactures numerical precision from vague inputs, ignores hidden dependencies between arguments, or allows the decomposition of a single line of reasoning to artificially inflate credibility. Crucially, it must distinguish between a chain breaking at a link and a rope fraying across strands. If the output suggests a level of certainty that a competent skeptic could deflate by changing one assumption, the formalism has failed its duty to the panel.

  2. "The desiderata"
  1. **Latent Variable Capture (a):** Arguments may share hidden constants or assumptions not explicit in their text. The formalism must allow dependence to be inserted where the arguer omitted it. (Input/Combination)
  2. **Granularity Invariance (b):** The verdict must not change if a derivation is written in three steps or thirty. Counting assumptions as independent evidence units invites manipulation. (Combination)
  3. **Diminishing Returns (c):** Multiple weak arguments cannot aggregate to near-certainty. The formalism must prevent laundering the word "many" into the word "independent." (Combination)
  4. **Reference Class Independence (d):** The account must evaluate unique argument shapes without requiring a historical base rate of similar arguments succeeding. (Input)
  5. **Structural Fragility (e):** Discovering a shared load-bearing assumption should destroy the cumulative case, not merely diminish it by one argument's worth. (Combination)
  6. **Interval Preservation (f):** Inputs are ranges (e.g., within a factor of ten); outputs must remain ranges. The formalism must degrade honestly rather than manufacture point estimates. (Input/Output)
  7. **Error-Mode Separation:** The formalism must distinguish between the evidence being wrong, the reasoning being unsound, and the argument shape being unreliable. These are distinct failure modes. (Input)
  8. **Defeasibility Sensitivity:** Since a skeptic can deflate each argument by substituting one plausible assumption, the output confidence must be capped by the ease of this deflation. (Output)

  3. "Load-bearing or factional"
  Desiderata (b), (f), and (7) are non-negotiable logical constraints. Violating (b) makes the verdict arbitrary to description; violating (f) is dishonest mathematics; violating (7) conflates distinct reasons for doubt. Desiderata (c) and (e) are factional. (c) divides Bayesians, who often multiply likelihoods, from Explanationists, who view coherence as holistic. (e) divides Foundationalists, who require secure bases, from Coherentists, who allow mutual support. (d) is pragmatic; frequentists reject it, but decision-makers facing unique hypotheses require it. The formalism must prioritize the logical constraints over the epistemic preferences.

  4. "Where the list defeats itself"
  The list contains a fatal tension between (b) Granularity Invariance and (c) Diminishing Returns. If I can subdivide an argument indefinitely without changing the verdict (b), I can create infinite weak steps. If the formalism treats steps as independent evidence, (b) allows laundering dependence into independence, violating (c). If it does not treat them as independent, it must have a rule for individuating arguments that is itself granularity-invariant, which is notoriously difficult. Additionally, (e) Structural Fragility conflicts with (f) Interval Preservation. A "collapse" is a binary event, but intervals are continuous. Defining a total collapse of a range is ill-defined without precise thresholds. I would drop strict (e) in favor of severe non-linear diminution to accommodate the imprecision required by (f).

  5. "The most exclusionary requirement"
  Granularity Invariance (b) rules out the most otherwise-plausible accounts. Most aggregation models, including naive Bayesian updating and simple scoring systems, depend on how evidence is individuated. If you split a likelihood ratio into two steps, standard accounts often square the confidence shift. A formalism that yields the same confidence whether an argument is one step or ten is incredibly hard to construct without losing all sensitivity to argument structure. It demands a theory of evidence individuation that most accounts lack.

  6. "Scorecard, optional and short"
  Standard Bayesianism fails (f) and (b); it requires precise probabilities and is sensitive to how likelihoods are partitioned. Qualitative Confidence Scales (like risk matrices) handle (f) well but fail (b) and (c); they often allow high confidence from many low-confidence inputs. Structural Argument Mapping handles (e) and (7) effectively by visualizing dependencies but lacks a formal combination rule for (c), leaving the panel to guess the aggregate weight. None fully satisfy the list, suggesting the job requires a hybrid approach.
