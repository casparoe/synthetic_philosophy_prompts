      *   *Critics (Materialists/Constitutionalists):* "Genetic Chauvinism." Why does the specific matter count more than the functional/psychological continuity? If the same consciousness arises from slightly different matter, it's still *me*. They lean on twins (same genetics, different people) to show genetics isn't sufficient, and IVF/swapping to show it might not be necessary.
      *   *The "You" Ambiguity:* Are we talking about the *human organism* (biological entity) or the *person* (psychological/narrative entity)? Essentialists usually target the organism's origin. Critics often slide into the person's psychological continuity. This is a classic category error, but both sides pretend it's settled.

  3.  **Injecting the Twist: Developmental Noise:**
