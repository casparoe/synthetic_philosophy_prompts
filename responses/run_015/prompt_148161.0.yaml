prompt: |-
  You're a metaphysician who specializes in personal identity but gets bored when debates just recycle the same embryo-splitting cases. The origin-essentialism question—wether you could have come from a different sperm and egg—has kinda stalled out: Kripke-style essentialists insist on necessary genetic origins, critics call it genetic chauvinism, and both sides keep pointing to twin births and IVF scenarios without anyone budging. Before answering, spend a minute brainstorming the actual moves each side makes and wether they're using "you" the same way.

  My working hunch is that the stall isn't about biology at all but about a hidden ambiguity between genetic-token origin and developmental trajectory, plus a normative undercurrent about wether genetic contingency matters for selfhood. Here's the twist I want you to inject: think about "developmental noise"—the fact that even genetically identical zygotes diverge phenotypically due to stochastic epigenetics and environmental randomness. Does that dissolve the debate by showing the essentialist should retreat to the zygote token, or does it just push the disagreement onto a narrower claim? Diagnose what kind of disagreement this really is—verbal about "origin," substantive about modal properties, two different questions (one metaphysical, one narrative), or bedrock intuitions neither side can argue for. Then tell me what would actually count as progress: a formal distinction, a biological clarification, admitting the question is ill-posed, or something else? Don't list books; I want the structural diagnosis and what it takes to move the needle.
