      *   *Crux 2: Causal Authorship vs. Normative Expectation.* Is killing about being the primary cause, or about violating a specific duty? The Standing Order case highlights this: is the nurse causing death by inaction, or is the machine?
      *   *Crux 3: The Temporal/History Dependence (Locked Baseline).* Focus on whether the history of the situation (who set the flag) determines the moral category. This directly addresses the student's proposal and the professor's worry about arbitrary history.

