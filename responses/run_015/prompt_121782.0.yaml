answer: |-
  ### 1. Brainstorming Cruces

  *   **Crux 1: The Normative vs. Descriptive Baseline.** Does "letting die" mean failing to intervene in a natural course, or failing to meet a normative expectation? If the latter, the distinction collapses into wrongness; if the former, machines change what is "natural."
  *   **Crux 2: Causal Inertia vs. Active Intervention.** Is the distinction metaphysical (physics of the event) or normative (duties owed)? The Standing Order case shows physics alone cannot distinguish the nurse's inaction from the machine's action.
  *   **Crux 3: Historical Dependence (The Locked Baseline).** Does the moral category of an act depend on the history of how the situation arose (who set the flag)? This tests whether the distinction is about the *current* agency or the *genealogy* of the threat.

  **Selection:** I am selecting **Crux 3 (Historical Dependence)**. It most resists memorization because standard textbooks rarely treat the "genealogy of the threat" as a variable. It forces the candidate to construct a theory of agency that can either accommodate or reject the idea that *who started the problem* changes *what the responder is doing*. It directly targets the professor's worry about arbitrary history while utilizing the Standing Order variants effectively.

  ***

  ### 2. Exam Question

  **PHI 405: Killing, Letting Die, and the Shape of Agency**
  **Final Examination**

  **Question 1**

  Consider the following case (**The Standing Order**): A hospital's automated system is flagged to administer a lethal dose to a patient unless a nurse overrides it within ninety seconds. Nurse N sees the alert, knows the one-keystroke override, and does nothing. The patient dies.
  *Variant A:* The system generated the flag randomly.
  *Variant B:* A colleague entered the flag erroneously.
  *Variant C:* Nurse N entered the flag herself earlier in the shift.

  Consider also the **Locked Baseline View**: A student proposes that whether an agent kills or lets die is settled not by their immediate action, but by the last earlier choice at which some agent had an unforced option to alter the course of events. On this view, in Variant B and C, the colleague or Nurse N (at the earlier time) is the killer; the Nurse's later inaction is merely allowing.

  (a) Propose a criterion for the distinction between killing and letting die that does not rely on the agent's intentions or the Doctrine of Double Effect.
  (b) Apply your criterion to Variants A, B, and C. Does the classification of Nurse N's conduct shift across the variants? Explain why.
  (c) Evaluate the Locked Baseline View. Does it successfully resolve the moral arbitrariness of the distinction, or does it introduce new problems regarding moral responsibility?
  (d) Conclude by stating what moral fact the distinction between killing and letting die ought to track (e.g., authorship of change, violation of specific duties, or something else) and defend this against the objection that outcomes are what matter.

  **Instructions:** Do not cite specific authors. Do not simply assert that the distinction is morally significant; you must argue for *what* makes it significant. Answers relying on intention/foresight distinctions will be penalized.

  ***

  ### 3. Model Answer

  The distinction between killing and letting die cannot rest on mere bodily movement, as inaction can be lethal without motion. Nor can it rest on intention, as the same desire for a patient's death could accompany either withdrawing care or administering poison. Instead, the distinction should be defined by **authorship of the lethal transition**. Killing occurs when an agent initiates or sustains the specific causal sequence that leads to death; letting die occurs when an agent fails to interrupt a causal sequence originating elsewhere.

  Applying this to the Standing Order cases clarifies the nurse's agency. In Variant A (random system error), the lethal sequence originates in the machine. Nurse N's inaction fails to interrupt it. Under the authorship criterion, this is letting die. In Variant B (colleague's error), the sequence originates with the colleague. N's inaction is still letting die, though N may be complicit in the colleague's killing. In Variant C (N entered the flag), N initiated the sequence earlier. Her later inaction is merely the final step of a sequence she authored. Here, N kills. The classification of the *moment of death* shifts based on the origin of the threat, not merely the physics of the final moment.

  This supports a modified version of the Locked Baseline View, but only partially. The Locked Baseline View correctly identifies that moral categorization depends on the history of the threat. If the threat is external to the agent's prior agency, failing to stop it is allowing. However, the View fails if it implies the *later* agent bears no responsibility. Even if N is only "letting die" in Variant B, she may be morally culpable for failing to prevent a known harm. The View solves the arbitrariness of whether a machine is "running" or "stopped," but it risks making moral status hostage to arbitrary history. If a child sets the trap, is the adult who walks by merely "allowing" death? Yes, under this view. But this seems to dilute the adult's duty. The Locked Baseline View explains the *category* of the act (killing vs. allowing) but cannot solely determine the *blameworthiness*.

  Therefore, the distinction must track **responsibility for the change in status**. The moral weight of the distinction lies in the difference between making someone worse off than they would have been had you not acted, versus failing to make them better off than they would have been had you not acted. In Variant C, the patient is worse off than if N had never entered the flag. In Variant A, the patient is not worse off than if N had never existed; the machine would have killed them regardless. This explains why killing is often perceived as worse: it violates the negative duty not to worsen another's position, whereas letting die violates the positive duty to improve it.

  A serious objection arises: if the outcome is identical (death), why does the origin of the threat matter? If N could save the patient in all variants with one keystroke, is she not equally responsible for the death in all three? This objection conflates *culpability* with *categorization*. We can agree N is highly culpable in all three variants for failing to save a life. However, the *shape of her agency* differs. In Variant A, she is a rescuer who failed; in Variant C, she is an aggressor who stopped aggressing. Maintaining this distinction matters for restitution and legal classification. An aggressor owes restitution for the harm caused; a failed rescuer owes apology or compensation for the loss, but did not cause the loss in the same way. If we collapse the distinction, we lose the ability to distinguish between those who create dangers and those who fail to mitigate them, which is essential for structuring professional duties. Thus, the distinction tracks the origin of the lethal sequence to preserve the integrity of agency, even if outcomes remain constant.

  ***

  ### 4. Marking Scheme (Total: 20 Marks)

  | **Criterion** | **A (4 marks)** | **B (2-3 marks)** | **C (0-1 marks)** | **Typical Error** |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Criterion Definition** | Proposes a clear, non-intentional criterion (e.g., authorship, causal origin, baseline change). | Defines distinction but relies on vague "action vs. inaction" or slips into intention. | Merely states "killing is wronger" or copies prompt definitions. | *Defining killing as "intending death" (violates instruction).* |
  | **2. Case Application** | Correctly applies criterion to Variants A, B, C; notes shift in classification for Variant C. | Applies criterion but treats all variants identically or ignores the shift in C. | Summarizes the cases without applying the criterion. | *Treating all inaction as identical "letting die" regardless of who set the flag.* |
  | **3. Locked Baseline Evaluation** | Critiques the View: accepts history-dependence but notes it doesn't erase later duty/responsibility. | Accepts or rejects the View entirely without nuance regarding responsibility. | Ignores the Locked Baseline View or conflates it with the criterion. | *Saying the View is "wrong" because outcomes are the same.* |
  | **4. Moral Weight Proposal** | Identifies what is tracked (e.g., worsening status, negative vs. positive duties) and explains why it matters. | States the distinction matters but offers no account of *what* it tracks morally. | Claims consequentialism makes the distinction irrelevant without argument. | *Asserting "killing is worse" without explaining the underlying moral fact.* |
  | **5. Objection & Defense** | Raises a strong objection (e.g., equal outcomes/responsibility) and offers a principled reply. | Raises an objection but reply is weak, or defense is offered without objection. | No objection raised, or objection is trivial (e.g., "it's hard to tell"). | *Ignoring the "outcomes are what matter" challenge.* |

  **Consistency Check:**
  The Model Answer earns full marks:
  1.  **Criterion:** Defines "authorship of the lethal transition" (Non-intentional).
  2.  **Application:** Distinguishes Variant C (Killing) from A/B (Letting Die) based on origin.
  3.  **Locked Baseline:** Accepts history dependence for categorization but rejects it for total responsibility ("cannot solely determine blameworthiness").
  4.  **Moral Weight:** Tracks "responsibility for change in status" (worse off vs. not better off).
  5.  **Objection:** Addresses "outcome identity" objection by distinguishing culpability from categorization/agency shape.

  *Adjustment:* No adjustment needed. The scheme rewards the specific moves made in the model answer. The "Typical Error" column specifically targets the "summary" problem from the prompt history (e.g., treating all inaction as identical).
