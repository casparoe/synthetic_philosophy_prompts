  The light falls differently here **now**,
  I did not know the weight of **then**.
  Is this wood and nail and grain **real**?
  The sun dips low and is almost **gone**.
  Shadows lengthen but the posts **remain**.
  My mother calls us to **return**.

  I promise a safe **return**.
  The ticket burns my pocket **now**.
  Will any of these friends **remain**?
  We speak of plans we made back **then**.
  The summer days are nearly **gone**.
  The future feels solid and **real**.

  Nothing in life feels quite as **real**.
  I did not think I would **return**.
  So many years have slipped and **gone**.
  The house is quiet standing **now**.
  I think of who we were back **then**.
  Only the dust and light **remain**.

  Does anything but memory **remain**?
  The mark upon the wall is **real**.
  It measures height from long ago **then**.
  The record stands though seasons **return**.
  I stand exactly where I stood **now**.
  The people who made marks are **gone**.

  The ticket and the boy are **gone**.
  Does any old promise **remain**?
  I recall that safe **return**.
  The leaving feels less fully **real**.
  Compared to sitting here back **then**.
  The sun goes down exactly **now**.

  It matters little what was **then**.
  The breath and light are nearly **gone**.
  Why is this moment distinct **now**?
  All times are real but I **remain**.
  Will consciousness ever **return**?
  Is any of this world still **real**?

  We measure time between **now** and **then**,
  We ask what's **real** and what is **gone**,
  Let questions **remain** till we **return**.

