      *   *Goal:* Explain 2-3 nearest concepts and how they differ.
      *   *Concepts:* Manipulation (standard view), Coercion, Persuasion (Rhetoric/Pathos).
      *   *Drafting:* The nearest concept is **manipulation**. Standard philosophical accounts, such as those by Robert Noggle, define manipulation as influencing someone contrary to their own judgment or values, often via hidden means. Your cases differ because the means are disclosed, challenging the "deception" requirement. Some ethicists argue manipulation can be transparent, but this remains contested.
