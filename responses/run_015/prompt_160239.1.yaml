  *Mitigation:* Frame it as "The work you do is morally hazardous. This building protects you." Elevate their struggle rather than dismissing their motivation. Acknowledge their devotion but reframe the *justification*.

  *(Post-Drafting Check)*: Does it offend the family?
  *Risk:* Saying "She didn't love animals."
  *Mitigation:* Say "She did not love them in the way we are asked to tonight. She respected what they demanded of *us*."

