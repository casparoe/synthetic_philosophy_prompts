          *   Reasoning: Cruelty blunts humane feeling (duty to self). Painless killing for food is permissible (no harm to animal's moral status).
          *   Late Refinement ("Institutional Reading"): Duty is about character/practice, not momentary sentiment. Institutions must not require routine cruelty/deadening of feeling in workers. This makes the view *more* demanding on institutions than utilitarian/welfarist views because animal welfare isn't weighed; human moral integrity is absolute.
      *   **Audience:** Shelter staff/volunteers (speak language of animal rights/welfare), City Councillors, Honoree's Family, Colleagues (know her work).
      *   **Constraints:**
          *   Must be honest about her view (no softening into "she loved animals").
          *   Cannot say animals are wronged or are beneficiaries (contradicts her view).
          *   Cannot be a joke about euthanasia or condescending to staff.
          *   Must thank donors.
          *   Must resolve the "wrinkle": She is dead, so the bequest can't be *her* duty of self-cultivation. What was the gift for?
          *   Time: 5 minutes (approx. 750-900 words spoken at normal pace).
      *   **Deliverables:**
          1.  The Speech.
          2.  A short paragraph explaining the line taken on the bequest/wing's meaning.
          3.  A brief flagging of contested Kantian readings or inconsistencies.

  2.  **Deconstruct the Philosophical Tension:**

      *   *The Room:* Believes animals have intrinsic value/rights.
      *   *The Honoree:* Believed animals are things, but treating them badly makes *us* bad.
      *   *The Conflict:* If I say "She gave this for the animals," I lie about her philosophy. If I say "She gave this to make us better humans," I risk offending the staff who think they are there for the animals.
      *   *The Wrinkle:* She's dead. A dead person has no duties of self-cultivation. Why the money?
      *   *Solution to Wrinkle:* The bequest wasn't *her* duty. It was a *legacy* intended to structure *our* duties. It creates the *institution* she argued was necessary. The money buys the conditions under which workers can maintain their moral integrity while doing necessary work (euthanasia/intake).
      *   *Tone:* Solemn, intellectually rigorous, respectful, unflinching but not abrasive.

  3.  **Drafting the Speech - Section by Section:**

      *   **Opening:** Acknowledge the occasion, the wing, and the name. Acknowledge the tension immediately but gently.
      *   **Her Philosophy (The Hard Truth):** State clearly she didn't believe in animal rights. Don't hide it. Explain *why* she cared (human character).
      *   **The Institutional Reading:** This is the bridge. Connect her philosophy to the shelter's work. The shelter isn't just a hospital for animals; it's a moral gymnasium for humans. The new wing allows work to be done without moral degradation.
      *   **The Bequest (Resolving the Wrinkle):** Why the money? Not for her sake (she's gone). For *our* sake. To build the structure that protects *our* humanity.
      *   **The Staff:** Validate their work without validating the "animal rights" premise. Their work is noble because it preserves *their* humanity in the face of hard necessities.
      *   **Closing:** Dedication.

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Is saying "animals are things" too harsh for a shelter dedication?
      *   *Fix:* Use her terminology. "Entities toward which we have no direct duties." Focus on the *consequence* of the view: cruelty is still wrong.
      *   *Critique:* How to handle the euthanasia aspect?
      *   *Fix:* Focus on the *process*. The new wing allows for dignity in the process, which protects the worker's soul, regardless of the animal's metaphysical status.
      *   *Critique:* The "Wrinkle."
      *   *Fix:* Frame the bequest as a "posthumous command" or a "structural enablement." She couldn't cultivate herself, but she could cultivate the environment for the living.
      *   *Word Count Check:* Needs to be around 800 words for 5 minutes.

  5.  **Drafting the Analysis Paragraphs:**

      *   *Bequest Meaning:* Need to justify why a dead Kantian gives money. It's about creating the *conditions* for moral agency in others.
      *   *Contested Readings:* The "Institutional Reading" is the main point of contention. Traditional Kant is about individual maxims. Can duty be institutionalized? Also, the "dead donor" problem (no agency = no duty).

  6.  **Final Polish:**

      *   Check tone: Is it respectful? Yes.
      *   Check constraints: Did I say she loved animals? No. Did I say animals have rights? No.
      *   Check flow: Does it move from her philosophy to the building to the people?

  7.  **Final Review against constraints:**
      *   *Honest about view:* Yes, explicitly states no direct duties.
      *   *No softening:* Yes, acknowledges painless killing is permissible in her view (though maybe don't emphasize the food part at a shelter, focus on the euthanasia/intake aspect). *Correction:* Actually, at a shelter, "killing for food" is irrelevant. Focus on "euthanasia of healthy animals" which she acknowledged happens.
      *   *Resolve wrinkle:* Yes, addressed in the speech logic.
      *   *Analysis section:* Included after speech.
      *   *Flagging:* Included after analysis.

  *(Self-Correction on the "Food" point)*: The prompt mentions she thought painless killing for food is not wrong. In a shelter speech, bringing up eating animals might be inflammatory. I should focus on the *euthanasia* aspect, which is central to shelter work. Her view permits euthanasia if done without cruelty, provided the *human* character is protected. I will focus on the "Institutional Reading" regarding the workers.

  *(Refining the Wrinkle)*: If she has no duties when dead, why the money? The prompt says "I do not know what the gift was for." I need to *take a definite line*. I will argue the gift was to *secure the conditions of moral agency for the living*. It's not her duty; it's her final act of will to structure *our* duties.

  *(Refining the "Contested Reading")*: The "Institutional Reading" is the most philosophically fragile part. Kant is usually about individual maxims. Extending it to institutional design is a modern adaptation (like Onora O'Neill or Christine Korsgaard might discuss, but arguably distinct from Kant). I need to flag this.

  8.  **Finalizing the Text:** (Proceeding to generate output based on these thoughts).

      *   *Speech Title:* None needed, just the text.
      *   *Length:* Aiming for ~850 words.
      *   *Tone:* Academic but accessible, solemn.

  *(Post-Drafting Check)*: Does the speech condescend to the staff?
