answer: |-
  Here's the setup: Meet "Vault," a security AI managing a facility. Vault holds premise $P1$: "Any signal from Zone 5 triggers lockdown" and premise $P2$: "Sensor 9 is located in Zone 5." A human guard instantly sees $Q$: "Sensor 9 triggers lockdown." But Vault's architecture stores location data and protocol rules in separate, unlinked tables; unless a specific 'check-access' function is called, the inference engine never fires, so Vault's current active state doesn't include $Q$, even though the data is sitting there ready to be connected.

  Here's how the three camps read this. The **syntactic closure view** says Vault definitely knows $Q$ because knowledge is just the set of all statements derivable from your axioms; since $Q$ pops out of $P1$ and $P2$ via modus ponens, it's already in the bag. The **modal-epistemic view** agrees Vault knows $Q$, arguing that knowledge is truth across all accessible possible worlds; since there's no world where Vault's data is true but $Q$ is false, $Q$ is known. The **resource-bounded pragmatic view** says Vault does *not* know $Q$ yet, because knowledge requires the actual computational act of deriving the conclusion, not just having the ingredients sitting in memory.

  The exact structural feature that lets the pragmatic account peel away from the other two is the **inactive inference trigger**—the fact that the logic engine is dormant despite having valid inputs. If you strip that feature out by forcing Vault to automatically run all possible derivations the moment data is entered (enforcing real-time closure), the pragmatic account collapses into the syntactic one; suddenly Vault *does* know $Q$ because it performed the work instantly. To break the case, the syntactic defender would argue you're confusing *knowing* with *asserting*; they'd claim Vault possesses the justification for $Q$ dispositionally, so the knowledge exists implicitly even if the system hasn't printed it to the output log yet.
