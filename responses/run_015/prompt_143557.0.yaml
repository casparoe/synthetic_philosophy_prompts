answer: |-
  Here is an audit of your six points. Overall, you have the skeleton of a sophisticated argument (moving from legalism to functionalism to cultural relativism), but the foundation is wobbly.

  Here is the breakdown of tensions, ranked by severity, with fixes.

  ### 1. Tension Audit (Ranked by Severity)

  **Severity 1 (Critical): Point 1 vs. Point 2**
  *   **The Clash:** Point 1 defines corruption strictly as breaking a **formal rule**. Point 2 admits corruption can happen even when **legal**.
  *   **Why it hurts:** This is a direct logical contradiction. If your opponent catches this, they can say, "You defined corruption as rule-breaking in point 1, but now you're saying rules don't matter in point 2." It undermines your credibility immediately.
  *   **Cheapest Fix:** **Scrap or soften Point 1.** Change it to: "Corruption is *often* defined as breaking a formal rule for private gain, **but** that definition is too narrow." This turns Point 1 into a setup for Point 2 rather than a competing definition.

  **Severity 2 (High): Point 4 vs. Point 6**
  *   **The Clash:** Point 4 says corruption excludes outsiders from benefits they were **"led to expect."** Point 6 says **meritocracy** (the usual basis for expecting benefits) is a Western construct and judging by it is wrong.
  *   **Why it hurts:** If meritocracy is rejected (Point 6), what are the outsiders expecting? If they expect patronage (jobs for supporters), then excluding them isn't corrupt. Point 6 risks swallowing Point 4 whole. If there are no universal expectations of fairness, Point 4's "universal line" disappears.
  *   **Cheapest Fix:** **Clarify Point 6.** Specify that *meritocratic hiring* is Western, but *institutional integrity* (doing what the institution promised to do) is universal. This preserves the "expectation" in Point 4 without importing Western merit rules.

  **Severity 3 (Medium): Point 3 vs. Point 4**
  *   **The Clash:** Point 3 warns against **imperialist** universal rules. Point 4 asserts a **universal line** exists.
  *   **Why it hurts:** It looks like hypocrisy. You spend Point 3 criticizing Western universalism, then use Point 4 to impose your own universalism.
  *   **Cheapest Fix:** **Qualify Point 4.** Call it a "thin universalism." Argue that the *structure* of the harm (exclusion) is universal, even if the *content* (what counts as a gift vs. bribe) is local. This aligns it with Point 5.

  **Severity 4 (Low): Point 4 vs. Point 5** (Your specific worry)
  *   **The Clash:** You worry Point 4 (universal line) and Point 5 (local norms) cancel out.
  *   **Why it's actually fine:** They do **not** cancel out. This is actually the strongest part of your argument. Point 4 is the *formula* (Corruption = Power + Exclusion), and Point 5 is the *variable* (What counts as Exclusion depends on culture).
  *   **Cheapest Fix:** **No fix needed, just phrasing.** Make sure you introduce Point 5 as "operationalizing" Point 4. "The principle is universal (4), but the application is local (5)."

  ### 2. The Single Change That Cleans Up the Most

  **Modify Point 1.**

  Point 1 is the bottleneck. It forces you into a legalistic box that makes Point 2 look contradictory and makes Point 3 look like an exception rather than a refinement.

  **Change Point 1 to:**
  *"Standard definitions say corruption is breaking a formal rule for private gain, **but this misses the real harm.**"*

  **Why this works:**
  1.  It resolves the contradiction with Point 2 immediately.
  2.  It sets up Point 3 (Western rules are limited) as a supporting argument rather than an exception.
  3.  It allows Point 4 to become your *actual* definition, rather than competing with Point 1.

  ### 3. Hidden Tensions You Might Be Missing

  **Point 2 vs. Point 6 (The "Purpose" Trap)**
  *   **The Tension:** Point 2 relies on the **"purpose of the institution."** Point 6 attacks **meritocracy.**
  *   **The Risk:** In modern political philosophy, the "purpose" of a public institution is usually merit-based public service. If you argue in Point 6 that meritocracy is just Western imperialism, you undermine the "purpose" mentioned in Point 2.
  *   **The Fix:** In Point 2, define "purpose" as **"publicly stated function"** rather than "meritocratic ideal." A police station's purpose is safety, not necessarily meritocratic hiring. This lets you keep Point 6 without breaking Point 2.

  **Point 1 vs. Point 4 (Gain vs. Exclusion)**
  *   **The Tension:** Point 1 focuses on **private gain** (the official gets money). Point 4 focuses on **exclusion** (the outsider loses out).
  *   **The Risk:** You can have exclusion without private gain (e.g., an official gives a contract to a friend to help them, not themselves). Point 1 would say this isn't corruption; Point 4 implies it is.
  *   **The Fix:** Ensure your final definition leans on Point 4 (harm/exclusion) rather than Point 1 (private gain). This makes your argument more moral and less legalistic.

  ### Summary Recommendation
  Your argument is actually quite strong if you view it as a progression:
  1.  **Old View:** Rules are everything (Point 1 - *mark this as the view you are critiquing*).
  2.  **Complication:** Sometimes legal stuff is still wrong (Point 2).
  3.  **Cultural Check:** But don't just import Western rules (Point 3 & 6).
  4.  **Synthesis:** Here is the real universal principle that respects local norms (Point 4 & 5).

  If you make that progression explicit, the tensions dissolve.
