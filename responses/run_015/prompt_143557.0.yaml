  hey so im writing up my thoughts for a philosphy class debate on corruption and im not sure if they actually hang together. heres my list:

  1. corruption is when someone breaks a formal rule for private gain.
  2. but clientalism (politicians giving jobs to supporters) can be corrupt even if its legal, as long as it betrays the purpose of the institution.
  3. in a lot of cultures giving gifts to officials is just normal social reciprocity, so Western anti-corruption rules are kind of imperialist if they call every gift a bribe.
  4. still i think theres a universal line: corruption is using public power to create soft obligations that leave outsiders out of benefits they were led to expext.
  5. but i also think what counts as a soft obligation and what people expect is totally set by local norms.
  6. and meritocracy is mostly a Western idea anyway, so judging other countries by merit rules feels wrong.

  do these fit together? im especially stuck on whether 2 clashes with 3, and whether 4 and 5 cancel each other out. but maybe some pairs only look bad? can you audit the set, rank the real tensions by severity, say what the cheapest fix is for each, and tell me which single change cleans up the most? please dont ask me for sources or citations, just work with whats here. also is there any hidden tension im missing?
