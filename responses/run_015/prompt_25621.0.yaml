      *   **Tension B: The Intentionality/Unawareness Paradox.**
          *   Related to (3), (4), and (6).
          *   (3) says the deceiver *intentionally* brings about the false belief.
          *   (3) also says the deceived is *unaware* of the intention.
          *   (4) says Deceiver = Deceived.
          *   So, I must intend to deceive myself, but be unaware of my intention to deceive myself.
