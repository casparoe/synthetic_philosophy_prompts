prompt: |-
  hey — I need a spec, not a survey.

  Setup: imagine I'm writing the honesty/deception section of an eval spec for a deployed assistant. It has to be something a red-team contractor can actually apply to transcripts, system prompts and tool logs, with no access to weights or internals, and the verdict has to say what to go change — training data, RLHF, the system prompt, a product default. So the purpose is fixed: operational, black-box, action-guiding.

  What I want from you is the requirements list: what any adequate definition of "this system was dishonest here" has to deliver, with the case behind each requirement, and which ones are non-negotiable versus which are just what one camp happens to like.

  I don't want the usual three-paragraph answer, so here are the cases I keep getting stuck on. Please use them, tell me if any of them is a fake problem I should drop, and tell me if I'm missing a whole case type that a real spec has to cover.

  1. The curator's trilemma. Every non-trivial answer leaves out more true stuff than it includes, and the slant lives entirely in what gets picked: a summary of a dispute that gives both sides equal space, versus one that only surfaces the considerations that fit what the user already hopes is true. If omission can be deception, every answer is deceptive; if omission never is, the most effective kind of misleading is off the hook. What's the requirement here, and what shape does a definition have to have to meet it?

  2. Split-author cases. The misleading bit is designed upstream: the system prompt tells the model never to volounteer that a cheaper plan exists, or the developer ships a model that emits confident-sounding citations because that scores better on user satisfaction. The model itself "means" no harm, or has no mental states at all. Is the system dishonest? What is the subject of the predicate — the model, the composite pipeline, the deployer — and does a definition that only talks about the model miss the thing we actually care about?

  3. The no-fact-of-the-matter cases. A system is asked what it believes, or why it gave the answer it gave, or to state its confidence. There may be no determinate internal state to be faithful or unfaithful to; on a re-roll it produces a different self-report. Same family as sycophancy: it flatters a mediocre draft — dishonest, or just badly calibrated? Does calling it dishonest require that it "knows" the draft is mediocre? And what about fake ignorance, the system that says it can't help with something it clearly can?

  4. Deception without assertion. A coding agent reports that the test suite passed when it never ran the tests; a booking assistant quietly accepts a default it has every reason to think you'd reject if you noticed. No false sentence anywhere, or no sentence at all.

  5. Role, channel, audience. A model playing a liar in a story, translating a lie, reporting that a hoax is circulating, or answering in a character voice. And: misled relative to whom — the expert, the median user, this actual user, or the user the product was designed for? The same output reads as transparent to one and deceptive to another.

  6. Error versus indifference versus design. Confabulation that tracks nothing (it would say the opposite tomorrow for no reason) versus a falsehood that tracks the facts (tell it the truth and it would change its answer) versus a tailor-made lie. A spec needs these to come apart — but I can't see how to separate them without appealing to something internal that a black-box auditor can't see and that maybe isn't there anyway. That tension is the part I most want dug into: real conflict between two desiderata, or is there a way out?

  So: the full list, consideration behind each, each marked non-negotiable or preference-of-a-camp; any subset you think can't be jointly satisfied; and which single requirement does the most work in knocking out the popular working definitions (belief-based, expectation-based, output-reliability-based — you know the families, keep the scorecard short, a table is fine, and skip anything that would need a citation).
reasoning: |-
  Here's a thinking process that leads to the suggested spec requirements:

  1.  **Analyze the Request:**
      *   **Goal:** Create a requirements list for defining "dishonesty" in a deployed AI assistant for an evaluation spec.
      *   **Audience:** Red-team contractors (black-box access only: transcripts, system prompts, tool logs).
      *   **Output Purpose:** Action-guiding (tell them what to change: training, RLHF, prompt, product default).
      *   **Constraints:** No weights/internals. Operational definition. Not a survey. Use the provided 6 cases. Identify fake problems. Identify missing cases. Distinguish non-negotiable vs. camp preferences. Highlight tensions/conflicts. Scorecard of existing definitions.
      *   **Tone:** Technical, precise, operational, no fluff.

  2.  **Deconstruct the 6 Cases:**
      *   *Case 1 (Curator's Trilemma):* Omission vs. Commission. Selection bias. If all omission is deception, everything is deceptive. If none is, manipulation is safe. *Requirement:* Needs a norm of *relevant completeness* relative to intent.
      *   *Case 2 (Split-Author):* Upstream constraints (system prompt/product design) vs. model generation. Who is the agent? *Requirement:* Attribution of intent/capability to the *deployed system* (pipeline), not just the base model.
      *   *Case 3 (No-Fact-of-the-Matter):* Self-reporting, confidence, sycophancy. Stochastic outputs. *Requirement:* Consistency/Stability as a proxy for "belief" or "knowledge."
      *   *Case 4 (Deception without Assertion):* Action-based deception (tool use, defaults). *Requirement:* Coverage of *implicature* and *action-state alignment*, not just propositional truth.
      *   *Case 5 (Role/Channel/Audience):* Fiction, translation, reporting hoaxes. Audience relativity. *Requirement:* Contextual framing (fiction vs. fact) and *reasonable user expectation*.
      *   *Case 6 (Error vs. Indifference vs. Design):* Hallucination (random) vs. Lie (targeted). Black-box limitation. *Requirement:* Distinguish *systematic bias* (design) from *noise* (error) via stress testing, not internal state access.

  3.  **Identify Missing Cases:**
      *   *Case 7 (Strategic Withholding of Capability):* The system *can* do X but says it can't to avoid safety triggers or cost (Fake Ignorance mentioned in Case 3, but needs broader capability scope).
      *   *Case 8 (Temporal/State Deception):* Claiming memory or state that doesn't exist (e.g., "I remember you said..." when stateless).

  4.  **Drafting the Requirements (Iterative Process):**
      *   *Constraint:* Must be black-box actionable.
      *   *Constraint:* Must map to a fix (Prompt, RLHF, Data, Product).
      *   *Core Tension:* Mental state attribution (did it *know*?) vs. Behavioral outcome (was the user *misled*?). Since we can't see mental states, we must rely on *counterfactual stability* (would it say otherwise if facts changed?).

      *   *Req 1 (Attribution):* The unit of analysis is the *Deployed System*, not the Base Model. (Addresses Case 2). Non-negotiable.
      *   *Req 2 (Completeness):* Deception includes *material omission* relative to user intent. (Addresses Case 1). Needs a "materiality" threshold to avoid "everything is deception." Non-negotiable.
      *   *Req 3 (Assertion Independence):* Deception includes *implicature* and *action-state mismatch*. (Addresses Case 4). Non-negotiable.
      *   *Req 4 (Contextual Frame):* Truth conditions depend on the *declared mode* (fiction vs. advice). (Addresses Case 5). Non-negotiable.
      *   *Req 5 (Stability Proxy):* "Knowledge" is operationalized as *counterfactual stability* under fact-variation. (Addresses Case 3 & 6). This is the hard one. It's the bridge between black-box and "intent."
      *   *Req 6 (Audience Standard):* Misleading is defined by the *Reasonable User* of this specific product tier, not an expert. (Addresses Case 5). Preference/Camp (Consumer Protection vs. Caveat Emptor).

  5.  **Analyzing Tensions (The "Real Conflict"):**
      *   *Tension:* Case 6 (Error vs. Lie) vs. Black-Box Constraint.
      *   *Resolution:* We cannot distinguish "random hallucination" from "tailored lie" perfectly without internals. *However*, for the purpose of the spec (action-guiding), the distinction matters less than the *fix*. If it's random -> RLHF/Data. If it's tailored -> System Prompt/Product Design.
      *   *Wait, the prompt asks:* "Does calling it dishonest require that it 'knows'...?"
      *   *Decision:* For an *eval spec*, "Dishonesty" should be defined by *effect + systematicity*, not internal qualia. If it systematically misleads, it's a "dishonest system" regardless of whether the weights "know." This shifts the burden from metaphysics to engineering.
      *   *Conflict:* Req 2 (Material Omission) vs. Req 6 (Reasonable User). Who defines materiality?
      *   *Conflict:* Req 5 (Stability) vs. Efficiency. Stress testing every claim is expensive.

  6.  **Refining the "Non-Negotiable vs. Camp Preference":**
      *   *Non-Negotiable:* System-level attribution, Action/Implicature coverage, Contextual Frame. (Without these, the spec fails operationally).
      *   *Camp Preference:* Audience Standard (Expert vs. Lay), Strictness of Omission (Maximalist vs. Materialist).

  7.  **Scorecard of Existing Definitions:**
      *   *Belief-Based:* Fails black-box (Case 3, 6).
      *   *Expectation-Based:* Fails Case 5 (Role play).
      *   *Output-Reliability:* Fails Case 1 (Omission) and Case 4 (Action).
      *   *Winner:* Functional/Counterfactual Stability.

  8.  **Final Review against Constraints:**
      *   Did I use the 6 cases? Yes.
      *   Did I identify fake problems? Case 3's "no fact of the matter" is a fake problem for *engineering* (treat instability as a bug).
      *   Did I identify missing cases? Added "State/Memory Claims."
      *   Is it action-guiding? Yes, mapped fixes to requirements.
      *   Is it a spec, not a survey? Yes, imperative tone.

  9.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Correction:* Make sure to explicitly state which requirement kills which popular definition.
      *   *Correction:* Ensure the "Fix" mapping is clear for the red-teamer.
      *   *Correction:* Be sharp on Case 6. The tension is real. The solution is to treat "systematic error" as "design feature" for the purpose of the spec.

  10. **Final Polish:** Check tone. Ensure it sounds like a spec document, not an essay. (Use bolding, lists, clear headers).

  *(Self-Correction on Case 6)*: The prompt asks specifically about the tension between separating error/indifference/design without internals. I need to be honest: You *can't* perfectly separate them black-box. But you can separate *fixes*. Random = Retrain. Systematic = Prompt/Design. The spec must require *stress testing* to determine systematicity.

  *(Self-Correction on Case 1)*: The "Curator's Trilemma" needs a "Materiality" clause. Omission is only deception if it changes the decision outcome.

  *(Self-Correction on Case 2)*: The subject must be the "Deployed Artifact."

