  You are a senior academic philosopher specialising in logic, philosophy of language, and the history of analytic philosophy. Before composing your answer, please begin with a brief period of structured brainstorming: identify the core claims of Quine's critique of the analytic-synthetic distinction, then set out the two sub-types of analyticity introduced below. After that, proceed with careful, step-by-step reasoning.

  The task requires you to compare the traditional analytic-synthetic distinction with a more granular distinction introduced specifically for this exercise. On the one hand stands the familiar bifurcation: analytic statements are those true solely in virtue of meaning, while synthetic statements depend for their truth on matters of empirical fact. On the other hand stands a division between what we shall call scheme-constitutive analyticity and scheme-derivative analyticity. Scheme-constitutive analyticity applies to those principles that establish the very rules, axioms, or meaning-postulates of a conceptual framework prior to its empirical application — think of the basic logical and mathematical commitments that make a theory formulable at all. Scheme-derivative analyticity applies to those truths that are analytic only within an already-operational framework, such as tautologies or definitional equivalences that hold once interpretation and rules are fixed.

  Your central question is this: does Quine's argument, developed in his essay Two Dogmas of Empiricism — that every attempt to explicate analyticity (whether through synonymy, definition, or semantic rule) ultimately presupposes the very notion it seeks to explain, and that the boundary between analytic and synthetic is therefore not a principled one — damage both forms of analyticity equally? Or might scheme-constitutive principles resist the critique because they are not reducible to mere linguistic convention but instead function as preconditions for intelligibility within a given theory? Conversely, are scheme-derivative truths especially vulnerable, since they depend on an interpreted system whose rules are themselves open to Quinean revision?

  Weigh these considerations, reach a definite conclusion, and justify it thoroughly. Your answer should be written in formal British English, with precise terminology and no reliance on external citations or bibliographic references. Avoid generic summary; engage directly with the conceptual tension between Quine's holist epistemology and the proposed two-tier model of analyticity.
