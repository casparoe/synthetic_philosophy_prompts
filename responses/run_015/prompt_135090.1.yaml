answer: |-
  Here is a 35-minute teaching plan designed to keep the discussion conceptual rather than reactive.

  ### The Dependency Logic
  **You must establish the Archive vs. Endorsement distinction *before* you discuss removal.**
  If you start with "Should we take it down?", students will immediately default to "Erasing History" (Misconception 1). You need to give them the conceptual tools (Archive vs. Endorsement) *first*, so that when removal comes up, they have a vocabulary other than "deletion."

  **The Sequence:**
  1.  **Define the Object** (Defuse Misconception 3: "It's just art/history").
  2.  **Define the Function** (Introduce Archive vs. Endorsement using the Example).
  3.  **Apply to Removal** (Defuse Misconceptions 1 & 2: "Forgetting" and "Rewriting").
  4.  **Check Understanding** (The End Question).

  ---

  ### The Carrying Example: "Arthur Sterling"
  **Use this specific hypothetical figure.** Do not use a real name (no Rhodes, no Jefferson, no local figures).

  *   **Who:** A late-19th-century industrialist who built the town's main factory.
  *   **The "Archive" Fact (The History):** He employed 5,000 people, funded the public library, and the town literally exists because of his investment. This is undeniable historical causality.
  *   **The "Endorsement" Problem (The Values):** He used violent strikebreakers, lived in a mansion while workers lived in slums, and lobbied against child labor laws.
  *   **The Object:** A bronze statue of him in the Town Square, erected in 1920.
  *   **Why this works:** It forces a split. You can acknowledge his historical importance (Archive) without honoring his moral character (Endorsement). It prevents the "He was a monster/He was a hero" binary that triggers culture war yelling.

  ---

  ### The 35-Minute Plan

  #### 0:00–0:05 | Introduction & Defusing Misconception 3
  **Goal:** Establish that monuments are not textbooks.
  **Misconception Target:** *"Monuments are just art or history lessons, not moral claims."*

  *   **Action:** Write "ARCHIVE" on one side of the board and "ENDORSEMENT" on the other.
  *   **Prompt:** "I'm going to describe a statue. Tell me what function it serves. A bronze statue of Arthur Sterling stands in the center of town. He built the factory that created the town. Is this statue a history lesson?"
  *   **Facilitation:** Students will likely say "Yes, it teaches us he existed."
  *   **The Pivot:** Push back immediately. "If it were just a history lesson, it would be in the museum with a plaque explaining the child labor laws he broke. Why is it in the *Square*?"
  *   **Key Point to Land:** A museum says "This happened." A town square says "We are *this* kind of community."
  *   **Shutdown:** If a student insists it's "just art," ask: "If we replaced it with a statue of a fictional character, would the town feel the same? No. Because the specific person matters. That means it's a claim about values, not just aesthetics."

  #### 0:05–0:15 | Building the Distinction (The Core Concept)
  **Goal:** Solidify Archive vs. Endorsement using Sterling.
  **No Misconceptions here yet; this is the foundation.**

  *   **Action:** Ask the class to sort Sterling's traits into the two columns on the board.
      *   *Archive (History):* Built factory, employed 5,000, funded library.
      *   *Endorsement (Values):* Anti-union, anti-child labor, hierarchical power.
  *   **Discussion Question:** "Can we keep the Archive without the Endorsement?"
  *   **Desired Insight:** Yes. We can put the facts in a textbook (Archive) without putting his face in the square (Endorsement).
  *   **Teacher Note:** Do not let them debate whether Sterling was "actually bad." Keep it on the *function of the statue*. The statue *speaks* endorsement, regardless of Sterling's actual complexity.
  *   **Key Phrase to Use:** "The statue is not a sentence about the past; it is a speech act in the present."

  #### 0:15–0:30 | The Removal Question & Defusing Misconceptions 1 & 2
  **Goal:** Apply the distinction to removal.
  **Misconception Targets:**
  1.  *"If we take it down people will forget what happened."*
  2.  *"This is rewriting the past."*

  *   **Transition:** "Okay, the city council decides to remove Sterling from the Square. Move him to the museum."
  *   **Anticipate Misconception 1 (Forgetting):**
      *   *Student Objection:* "But now people won't know he built the town!"
      *   *Your Counter:* Refer to the Board. "Which column does 'knowing he built the town' belong to? The Archive. Does moving the statue delete the Archive column?"
      *   *Resolution:* No. Textbooks, plaques, and museums hold the Archive. The Square holds the Endorsement. Removal moves the object from the Endorsement zone to the Archive zone.
  *   **Anticipate Misconception 2 (Rewriting the Past):**
      *   *Student Objection:* "You're changing history."
      *   *Your Counter:* "Did Sterling stop employing people in 1890 because the statue came down in 2024?"
      *   *Resolution:* The *past* is fixed. The *city's vocabulary* is updating. We aren't changing the history of the factory; we are changing the moral vocabulary of the Square.
  *   **Facilitation Tip:** If the conversation drifts into "Cancel Culture" or specific political grievances, stop and point to the Board. "We aren't debating Sterling's politics. We are debating whether a Town Square is the right place for *any* moral endorsement that conflicts with current civic values."

  #### 0:30–0:35 | The Check Question & Wrap
  **Goal:** Verify they grasp the "Present-Tense Endorsement" concept.
  **Constraint:** Must not be a Yes/No opinion question.

  *   **The Check Question:**
      > "If we move Sterling to the museum, the history of the town stays the same. So, what specifically has changed? Is it the *past* that is different, or the *relationship* between the current citizens and the past?"
  *   **What to listen for:**
      *   *Fail:* "The past is hidden." (They missed the point).
      *   *Pass:* "The city isn't claiming him as a hero anymore." / "The square speaks a different language now." / "We are separating his historical impact from our current values."
  *   **Closing:** "Monuments are the city talking to itself. Taking one down isn't silencing history; it's the city correcting its grammar."

  ---

  ### What to Flat-Out Refuse to Explain
  You are leading a 35-minute undergrad seminar, not a grad thesis defense. If students push on these, park them for office hours.

  1.  **Formal Speech-Act Theory:** Do not explain Austin, Searle, or illocutionary force. If they ask, say: "That's the linguistic machinery behind it, but for this seminar, we just need to understand the *effect*: a statue acts like a statement, not a record."
  2.  **The Metaphysics of Collective Identity:** Do not get dragged into "Who is 'the city'?" or "Can a city have values?" Say: "We are treating the city as a moral agent for the sake of this argument. Whether that's metaphysically true is a different class."
  3.  **Legal/Procedural Mechanics:** If they ask "Who votes on this?" or "Is it legal?", shut it down. "We are discussing the *ethics* of the act, not the *policy* of the act."
  4.  **Verdicts on Real People:** If they try to swap Sterling for a real controversial figure (e.g., "But what about Churchill?"), refuse. "Real figures bring baggage that distracts from the structural point. Stick with Sterling."

  ### Summary of Misconception Mapping
  *   **"It's just art/history"** → Defuse in **Min 0-5** (Intro). If you don't kill this first, the rest fails.
  *   **"Taking it down = Forgetting"** → Defuse in **Min 15-20** (During Removal). Use the Archive/Endorsement board split.
  *   **"Rewriting the Past"** → Defuse in **Min 20-30** (During Removal). Distinguish between *historical fact* and *civic vocabulary*.

  ### Final Advice for the Leader
  *   **Control the Board:** Keep "ARCHIVE" and "ENDORSEMENT" visible the whole time. When a student makes an argument, ask them: "Which column does that point belong in?"
  *   **Don't Solve the Hard Cases:** If they ask, "What if the person was 50% good and 50% bad?" say: "That's why we have museums (Archive) instead of Squares (Endorsement). Nuance belongs in the archive."
  *   **Stay Calm:** If the room gets heated, slow down. Remind them: "We are analyzing the *statue*, not attacking the *history*."
