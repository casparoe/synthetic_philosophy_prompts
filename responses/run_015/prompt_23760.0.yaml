answer: |-
  One compelling parallel arises in **tort law**, specifically in the construction of the **"Reasonable Person" standard**.

  In negligence cases, the law does not judge a defendant based on their actual, subjective mental state or personal limitations. Instead, it asks the jury to imagine a hypothetical "Reasonable Person" placed in the same circumstances. To construct this figure, the law systematically strips away the defendant's specific idiosyncrasies: their particular intelligence, their temper, their upbringing, their fears, and their unique history. The legal question is whether, after subtracting all these contingent, subjective factors, a residue of "reasonable conduct" remains that the defendant failed to meet. This mirrors the logical structure of Avicenna's Flying Man precisely. Avicenna asks us to subtract all sensory input, memory, and bodily awareness to see if a residue of "self" remains. The law asks us to subtract all psychological input, bias, and personal history to see if a residue of "responsibility" remains. Both thought experiments rely on a **subtractive methodology**: they assume that if you peel away the contingent, empirical details of a subject (whether bodily sensations or psychological quirks), you will find a stable, normative core (the Self or the Reasonable Standard) that persists independently of those details.

  The crucial divergence lies in the **ontological status of the residue**. For Avicenna, the persistence of self-awareness in the Flying Man scenario is proof of a metaphysical truth: the soul is a substance that exists independently of the body. The residue is *more real* than the stripped-away elements. In contrast, the legal system openly admits that the "Reasonable Person" is a **fiction**. It is not a discovery of a pre-existing entity, but a normative tool constructed for social utility. The law does not claim the Reasonable Person exists in reality; it claims we must *act as if* they do to maintain a functioning society. Thus, while the Flying Man argument uses the subtractive move to prove that the subject is *independent* of the physical world, the Reasonable Person standard uses the same move to prove that the subject is *accountable* to the social world, even if that standard exists only in the imagination of the court. Avicenna finds a soul; the law finds a standard.
