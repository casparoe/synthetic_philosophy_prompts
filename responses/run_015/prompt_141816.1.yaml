      *   **Goal:** Keep (1) (one-shot defection dominates) and (2) (IPD allows cooperation). Don't dismiss evolutionary explanations. Identify the broken step, explain why it looks innocent, and assess the costs of rejecting it. Price out alternatives.

  2.  **Deconstruct the Committee Member's Argument:**
