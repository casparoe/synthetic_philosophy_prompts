      *   *Okay, the strongest argument:* **The Mismatch Problem.** Step (4) assumes current fitness maximization. But adaptations are for the EEA. In a modern one-shot anonymous PD, cooperating might be fitness-*neutral* or fitness-*negative*, but the disposition persists. Thus, (4) is false. Cooperating does *not* necessarily maximize fitness in the specific modern context.

