answer: |-
  This is a sophisticated puzzle that sits precisely at the friction point between **Rational Choice Theory (RCT)** and **Evolutionary Game Theory (EGT)**. Your committee member is not "wrong" in a vacuum; they are applying the logic of EGT to a problem framed in RCT without acknowledging the translation costs.

  The broken step is **(4)**.

  Here is the diagnosis of the error, why it looks innocent, the cost of fixing it, and a pricing of the available alternatives.

  ### The Diagnosis: The Currency Confusion

  Step (4) claims: *"Once [fitness consequences] are written in, cooperating in a putatively one-shot PD maximizes what the agent really has reason to want."*

  This step commits a category error between **fitness** (the currency of natural selection) and **utility** (the currency of rational choice).

  1.  **In Rational Choice (your chapter's framework):** Payoffs represent the agent's subjective preferences or utility. Rationality is defined as maximizing this utility given constraints. If an agent prefers to defect, defection is rational, even if it kills them (e.g., a smoker who values pleasure over longevity).
  2.  **In Evolutionary Biology:** Payoffs represent reproductive fitness. "Rationality" (in the biological sense) is a metaphor for selection pressure. Organisms don't "choose" fitness; they are selected *for* fitness.

  The committee member's argument relies on smuggling **fitness** in as the definition of **"what the agent really has reason to want."** This assumes that human psychology is perfectly calibrated to maximize genetic fitness in every specific context.

  **Why Step (4) looks innocent:**
  Biologists often use teleological shorthand, speaking as if organisms "seek" to maximize fitness. In *Evolutionary* Game Theory, this is valid because the "players" are strategies replicating in a population, not reasoning individuals. However, in *Political* Theory, you are modeling reasoning agents. By equating "reason to want" with "fitness enhancement," Step (4) collapses the distinction between the **proximate mechanism** (psychology/guilt/reciprocity) and the **ultimate cause** (selection history).

  **The Empirical Flaw (The Mismatch Problem):**
  Even if we accept that dispositions were selected for fitness, Step (4) assumes they *currently* maximize fitness. This ignores the **Environment of Evolutionary Adaptedness (EEA)** mismatch. We have a disposition for sugar because it was fitness-enhancing in scarcity; in a modern supermarket, it is fitness-reducing. Similarly, a disposition for reciprocity might be fitness-enhancing in a small ancestral band (where one-shots are rare) but fitness-neutral or negative in a modern, truly anonymous one-shot interaction. Therefore, exercising the disposition in a *true* one-shot PD does not necessarily maximize fitness, rendering Step (4) factually false.

  ### The Cost of Rejecting Step (4)

  To reject (4) is to accept that **Rationality and Fitness can come apart.**

  *   **Cost:** You must concede that an agent can be perfectly *rational* (maximizing their stated preferences) while being *maladaptive* (reducing their fitness). You cannot claim that cooperation is "really" rational in the one-shot case simply because it was evolutionarily useful once.
  *   **Benefit:** You save Step (1). In a strictly specified one-shot PD (where payoffs are defined by the agent's actual current preferences, not hypothetical fitness), defection still dominates. You also avoid the absurdity of Step (6) (that revenge or sugar cravings are always "rational").

  ### Pricing the Alternatives

  You asked for the alternatives to be priced. Here are the three viable paths, ranked by their compatibility with your dissertation goals.

  #### Option 1: Reject Step (4) (The Preferences/Fitness Distinction)
  *   **The Move:** Argue that game-theoretic payoffs must reflect the agent's *proximate* motivations (utility), not their *ultimate* evolutionary function (fitness). Evolution explains why we *have* these preferences, not why satisfying them is always fitness-maximizing now.
  *   **Price:**
      *   **Theoretical:** You lose the ability to say cooperation is "objectively" rational in the one-shot case. You must admit humans can be rationally self-destructive (from a biological view).
      *   **Political:** You preserve the normative bite of the PD. If cooperation requires changing the game (via institutions or repetition), that is a political task, not a biological given.
      *   **Committee Relations:** Moderate friction. You are correcting a category error common in interdisciplinary work.
  *   **Compatibility:** **High.** Saves (1), (2), and keeps evolution explanatory but not determinative.

  #### Option 2: Reject Step (5) (The Definition of the Game)
  *   **The Move:** Accept that if an agent cooperates due to internalized norms, the payoff matrix has changed (psychological costs of defection raise the 'S' and 'P' values). However, insist that if the payoffs change such that $R > T$, **it is no longer a Prisoner's Dilemma.**
  *   **Price:**
      *   **Theoretical:** You risk the tautology charged in Step (7). If every instance of cooperation proves "it wasn't a PD," the model loses predictive power.
      *   **Political:** You must clarify that the *political problem* is transforming PDs into Assurance Games via norm internalization.
      *   **Committee Relations:** Low friction. This is standard game-theoretic hygiene.
  *   **Compatibility:** **Medium.** Saves (1) technically, but weakens the "problem" of cooperation if norms solve it too easily.

  #### Option 3: The Two-Stage Synthesis (Recommended)
  *   **The Move:** Distinguish two levels of analysis (Tinbergen's Levels).
      *   **Stage 1 (Evolutionary):** Selection operates on *dispositions* over deep time. It selects for agents who *feel* guilt when defecting.
      *   **Stage 2 (Rational Choice):** Agents operate in real-time maximizing *utility* (which includes the disutility of guilt).
      *   **Resolution:** In a one-shot PD, a "standard" rational agent defects (Step 1 holds). An agent with an evolved "cooperative disposition" cooperates because their *utility function* includes psychological penalties for defection. This makes cooperation rational *for them*, but it does not change the fact that the *structural incentives* of the PD still favor defection for a standard agent.
  *   **Price:**
      *   **Theoretical:** High complexity. You must carefully define whether your "agents" are standard *Homo economicus* or *Homo reciprocans*.
      *   **Political:** Strong. It allows you to argue that political institutions are needed to support these dispositions against free-riders who lack them.
      *   **Committee Relations:** High reward. It shows mastery of both fields without conflating them.
  *   **Compatibility:** **Very High.** Keeps (1) for the standard model, (2) for the iterated model, and keeps evolution as the explanation for the *existence* of cooperators, not the *rationality* of the act in a vacuum.

  ### How to Frame the Response to the Committee

  You do not want to tell your committee member they are wrong; you want to tell them you are **specifying the domain of applicability.**

  **Drafting the Counter-Argument:**
  > "I agree that evolutionary history explains the *origin* of our cooperative dispositions (Step 3). However, Step 4 conflates the *currency of selection* (fitness) with the *currency of choice* (utility).
  >
  > If we define payoffs as fitness, we are doing Evolutionary Game Theory, where 'rationality' is a metaphor for stability. But my chapter uses Rational Choice Theory to model *political justification*, where agents reason about preferences.
  >
  > If I accept Step 4, I must accept Step 6: that a modern craving for sugar is 'rational' because it was once fitness-enhancing. This empties 'rationality' of its normative force.
  >
  > **My solution:** I treat the evolved disposition as a **preference shaper**. Evolution gives agents a utility function that includes 'guilt.' In a one-shot PD, an agent *without* this disposition defects (validating Step 1). An agent *with* this disposition cooperates, not because the PD structure changed, but because their internal penalties altered their personal payoff matrix. This preserves the PD as a structural problem (Step 1) while using evolution to explain why some agents solve it (Step 3), without claiming that cooperation is universally rational in the one-shot case (Rejecting 5)."

  ### Summary of the "Way Out"

  You can keep (1), (2), and the evolutionary story intact by adopting **Option 3 (The Two-Stage Synthesis)**.

  1.  **Keep (1):** For a standard agent with material payoffs, defection dominates.
  2.  **Keep (2):** Iteration allows standard agents to cooperate via strategy.
  3.  **Keep Evolution:** Evolution explains why some agents have *non-standard* utility functions (guilt/reciprocity) that make cooperation dominant *for them* even in one-shot cases.
  4.  **Reject (4)/(5):** Deny that this makes cooperation rational *in the PD structure itself*. It makes it rational for *specific agents* with modified preferences. The PD remains a PD; the agent has simply been modified to overcome it.

  This avoids the tautology (7) because the game structure is defined independently of the agent's specific psychology, and it avoids the absurdity (6) because a disposition is only "rational" relative to the utility function it creates, not relative to current fitness maximization.

  **The cost to you:** You must be precise about whether your model assumes *Homo economicus* (who needs iteration to cooperate) or *Homo reciprocans* (who cooperates instinctively). Your dissertation likely argues that political institutions are needed to *protect* the latter from the former. This argument is stronger if you admit the latter are technically "irrational" in a strict one-shot material sense, but "rational" relative to their evolved psychology. This tension is where the political theory lives.
