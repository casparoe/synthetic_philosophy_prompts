prompt: |-
  I chair the exceptional-funding panel of a regional hospital system. Twice a month we sit for three hours and work through twelve to twenty applications for treatments that are not on our formulary: roughly twenty-five minutes per case, including discussion and the written statement of reasons we owe each applicant. We fund about half. Our decisions cannot be appealed on the merits, only on procedure. The panel is a rotating clinician, a lay member, a health economist from our finance office, and me; anything above fifteen thousand dollars also needs the finance officer's signature, and we are audited annually. Our regulator requires us to assign every application a single integer score on a zero-to-one-hundred need-benefit scale and to publish the scores, so applicants can and do read two files side by side and ask why theirs came out lower.

  The part of the work I have become convinced we are bad at is not clinical and not economic. It is that every one of these decisions requires comparing one person's gain in welfare against another person's, and I do not think we have any defensible way of doing that. We have drifted into two home-made devices. The first we call the standard-case ladder: three fixed written vignettes describing a mild, a moderate and a severe version of the relevant condition, and an applicant is asked to place themselves against them rather than give a bare zero-to-ten number, on the theory that people calibrate a bare number differently. The second we call the swap question: when two applications compete directly, someone asks how many applicants of the second kind would justify turning down one of the first kind, and we treat the answer as the exchange rate between them. I suspect the second device is simply the original problem restated in a form that feels answerable, and I suspect the first helps less than we assume, but I cannot say precisely where either one fails.

  What I want from you is a decision procedure my panel could actually run, in the time we have, without training in welfare economics. Concretely: the questions to ask in order, and what counts as a sufficient answer to each; the point at which the procedure stops and returns a no; the point at which it hands the decision back to a human being because the question is one of values rather than facts; and an honest statement of which steps are judgment calls wearing the costume of a procedure. Please also tell me what to do when a number we need is simply unavailable, because that happens in most cases, and please do not give me citations, a reading list or a bibliography — I want the operational content only.

  Three things seem to me to be at the centre of it, and I would like the procedure to take a position on each rather than describe them. First, the different comparison tasks are not equally demanding: ranking two people's levels of well-being, comparing the size of the improvement each would get, and comparing the ratio of one gain to another are three different jobs, and it may be that many of our decisions only require the second and so should not be turned into the first or the third. Second, the three currencies we could use — a money-metric one based on what someone would pay or accept, a subjective-well-being one based on self-report, and an objective-list or capability one based on shortfall from some reference level of functioning — fail in different and partly opposite ways: the first is contaminated by exactly the differences in means our charter forbids us to consider, the second is corrupted by the fact that people who have lived with a condition for years recalibrate their own scale upward while the recently diagnosed have not yet done so, and the third quietly imports a contested weighting of what matters and overrides what people say about themselves. Third, there is the question of whether a reported preference or a reported satisfaction is one we should correct because it was formed under conditions we would not endorse, and I want the procedure to say clearly when it refuses to make that correction and hands it to us as a values decision.

  Please then run the finished procedure on three cases from our recent docket. The first is a clean one: nine thousand dollars buys either a device that would give a seven-year-old with a painful chronic condition something close to a normal childhood, or an intervention that would buy an eighty-four-year-old with metastatic disease about three months of moderate comfort, with a real chance of complications. The second is the one I expect to be uncomfortable, and I would rather you let the procedure go where it goes than spare my panel: fourteen thousand dollars buys the same tremor-suppressing surgery for either a thirty-four-year-old professional violinist, diagnosed eighteen months ago, who rates her quality of life at three out of ten and says her life is effectively over, or a fifty-eight-year-old warehouse worker, diagnosed eleven years ago, who has retrained into lighter work, is now losing even that, has no savings, and rates himself seven out of ten on the grounds that he has got used to it. The panel's instinct was to fund the violinist. The third is a case I suspect the procedure cannot settle at all: a cochlear implant for a two-year-old who cannot report anything and whose benefit everyone agrees is enormous and speculative, competing against a year of home care for six elderly patients whose benefits are smaller, better evidenced, and reportable. For that third case, tell me what the procedure's output should be, what fallback rule you recommend when it returns not determinable, and how we should record it so that we do not launder a guess into a published score.

  Finally, tell me what the procedure cannot do: which of the disagreements that actually divide my panel it will leave exactly as it found them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of an exceptional-funding panel at a regional hospital system.
      *   **Context:** 12-20 applications per session, 25 mins/case, 50% funding rate. Panel: rotating clinician, lay member, health economist, chair. Audit/oversight exists.
      *   **Constraint:** Regulator requires a 0-100 "need-benefit" score published publicly. Decisions unappealable on merits.
      *   **Problem:** The panel lacks a defensible way to compare interpersonal welfare gains. Current methods ("standard-case ladder," "swap question") are flawed.
      *   **Goal:** A concrete, operational decision procedure (questions, stop points, hand-off points, honesty about judgment calls) that fits the time limit (25 mins/case) and requires no welfare economics training.
      *   **Specific Philosophical Stances Required:**
          1.  Distinguish between ranking well-being, comparing improvement size, and comparing ratios (don't over-complicate if not needed).
          2.  Address the three "currencies" (money, subjective well-being, objective capability) and their specific failures (means bias, adaptation bias, paternalism).
          3.  Address "corrupted preferences" (when to correct vs. when to defer to values).
      *   **Task:** Run the procedure on three specific cases (Child vs. Elderly Terminal; Violinist vs. Warehouse Worker; Cochlear Implant vs. Elderly Home Care).
      *   **Requirement for Case 3:** If indeterminate, provide a fallback rule and recording method to avoid "laundering a guess."
      *   **Final Requirement:** Explicitly state what the procedure *cannot* resolve (remaining disagreements).
      *   **Constraint:** No citations, reading lists, or bibliographies. Operational content only.

  2.  **Deconstruct the Ethical/Methodological Challenges:**

      *   *Time:* 25 minutes is very tight. The procedure must be a checklist or algorithm, not a seminar.
      *   *Interpersonal Comparison:* This is the core philosophical hurdle. You can't scientifically measure "utils" across people. The procedure must acknowledge this limitation while satisfying the regulator's demand for a score.
      *   *The Three Currencies:*
          *   Money (WTP/WTA): Reject. Biased by wealth.
          *   Subjective (SWB): Use with caution. Biased by adaptation (the warehouse worker).
          *   Objective (Capability/Function): Use as the anchor. Less biased by wealth/adaptation, but paternalistic.
      *   *The Three Tasks:*
          *   Ranking absolute well-being: Hard/Unnecessary.
          *   Comparing improvement size (Delta): Doable via functional restoration.
          *   Comparing ratios: Avoid unless necessary.
      *   *Corrupted Preferences:* The procedure needs a "veto" point where the panel admits, "We are overriding self-report based on a value judgment."

  3.  **Drafting the Procedure (The "Functional Restoration Protocol"):**

      *   *Name:* Needs to sound operational. "Functional Restoration & Severity Protocol (FRSP)."
      *   *Structure:* Sequential gates. If you fail a gate, you stop or move to the next.
      *   *Step 1: Clinical Threshold (Fact).* Is there evidence it works? If no -> Score 0.
      *   *Step 2: Baseline Severity (Objective).* Use the "Standard-Case Ladder" but strictly for *function*, not feelings. (Addresses Currency #3).
      *   *Step 3: Magnitude of Gain (Delta).* How much function is restored? (Addresses Task #2).
      *   *Step 4: Duration/Stability.* How long does it last?
      *   *Step 5: The Adaptation Check (Subjective).* Compare self-report to objective baseline. If they diverge significantly, flag for Panel Value Judgment. (Addresses Currency #2 & Corrupted Preferences).
      *   *Step 6: The Score Calculation.* A formula that combines Severity + Gain + Duration.
      *   *Step 7: The "Swap" Veto.* Only use the "swap question" if scores are within a narrow margin (e.g., 5 points).
      *   *Handling Missing Data:* Default to conservative estimates, flag as "Uncertainty Penalty."

      *Refining the Procedure for the User's Constraints:*
      The user wants specific stances on the three central issues.
      1.  *Tasks:* Focus on *Gain in Function*, not Absolute Well-being.
      2.  *Currencies:* Prioritize Objective Function. Use Subjective only to check for distress, not to measure gain. Ignore Money.
      3.  *Corrupted Preferences:* If adaptation is suspected (high function/low report or low function/high report), the procedure must explicitly trigger a "Value Override."

      *Revised Procedure Steps:*
      1.  **Eligibility Gate:** Clinical efficacy & Formulary status. (Fact)
      2.  **Baseline Anchor:** Objective functional deficit (0-100 scale based on the "Standard-Case Ladder" but defined by activity, not pain).
      3.  **Gain Estimate:** Expected functional restoration (percentage of deficit removed).
      4.  **Duration Weight:** Time-limited vs. Permanent.
      5.  **Adaptation Flag:** Compare Patient Self-Report to Objective Baseline. If gap > 20 points, trigger "Value Deliberation."
      6.  **Raw Score:** (Baseline Severity × Gain % × Duration Factor).
      7.  **Value Adjustment:** Panel votes on the "Adaptation Flag." If overridden, document reason.
      8.  **Final Score:** Normalized to 0-100.

      *Wait, the time limit:* 25 minutes. This needs to be faster.
      Let's simplify the scoring.
      Score = (Severity of Condition without treatment) + (Magnitude of Benefit).
      Actually, the regulator wants a "Need-Benefit" scale.
      Let's define Need = Baseline Severity. Benefit = Functional Gain.
      Score = Need (0-50) + Benefit (0-50).

      *Addressing the "Missing Number" problem:*
      If evidence is missing, assume the lower bound of the confidence interval. If unknown, assign "Data Gap Penalty" (-10 points).

      *Addressing the "Value vs. Fact" hand-off:*
      Any time the panel adjusts the score based on "fairness" or "life stage" rather than function, it must be recorded as a "Value Adjustment."

  4.  **Developing the Three Cases:**

      *   **Case 1 (Child vs. Elderly):**
          *   Child: High Need (developmental risk), High Benefit (normal childhood), Long Duration.
          *   Elderly: High Need (terminal), Low Benefit (3 months), Short Duration.
          *   Procedure Output: Child scores higher on Benefit/Duration. Need might be comparable (suffering), but Benefit dominates.
      *   **Case 2 (Violinist vs. Warehouse):**
          *   Violinist: Recent diagnosis (no adaptation), Low Self-Report (3/10), High Objective Loss (career).
          *   Warehouse: Old diagnosis (adaptation), High Self-Report (7/10), High Objective Loss (job loss).
          *   Procedure Stance: Use Objective Function for "Need." Use Gain for "Benefit."
          *   The Twist: The Violinist's *subjective* distress is higher. The Warehouse worker has *adapted*.
          *   Procedure Rule: Do not penalize adaptation. Score based on Objective Functional Loss. However, the "Value Deliberation" flag triggers because the self-reports diverge from the objective severity.
          *   Outcome: If we stick to Objective Function, they might be similar. If we weigh "distress," Violinist wins. The procedure must force the panel to admit *why* they pick the Violinist (e.g., "We value preventing new disability over managing old disability").
      *   **Case 3 (Cochlear vs. Elderly Care):**
          *   Cochlear: Proxy report (parents), Speculative benefit (language acquisition), One patient.
          *   Elderly: Self-report, Certain benefit, Six patients.
          *   Problem: Aggregation (1 vs 6) and Uncertainty (Speculative vs. Certain).
          *   Procedure Output: "Indeterminate." The procedure cannot weigh 1 large uncertain gain vs 6 small certain gains without a social value judgment.
          *   Fallback: "Threshold Rule." If uncertainty > X, require higher benefit score. Or "Tie-Breaker": Prioritize certainty? Prioritize pediatric?
          *   Recommendation: Use a "Certainty Discount." Apply a penalty to speculative benefits. If still close, default to "First Come" or "Random Lottery" to avoid laundering bias. *Better:* Default to the option with the highest *minimum* guaranteed benefit (Maximin).
          *   Recording: Mark as "Value Tie-Break." Do not publish a precise score difference if it's < 5 points.

  5.  **Refining the "What it Cannot Do" Section:**

      *   It cannot resolve the "Aggregation Problem" (1 big life vs. 10 small lives).
      *   It cannot resolve "Life Stage" preferences (young vs. old) without explicit value input.
      *   It cannot validate the "Need-Benefit" number as scientifically objective. It remains a heuristic.

  6.  **Writing the Response:**

      *   *Tone:* Professional, direct, operational, empathetic to the difficulty.
      *   *Structure:*
          1.  The Procedure (The "Functional Restoration Protocol").
          2.  The Three Stances (embedded in the procedure).
          3.  Handling Missing Data.
          4.  Running the Cases.
          5.  Limitations.
      *   *Check against constraints:* No citations. 25-min feasible? Yes, if checklist is tight. Address the 3 specific philosophical points? Yes.

      *(Self-Correction during drafting)*: Make sure the "Score" calculation is simple enough for a 25-minute meeting.
      Let's propose a 0-100 scale split: 50 points for **Severity of Deficit** (Need), 50 points for **Restoration of Function** (Benefit).
      This separates the two concepts the user identified as distinct tasks.
      *Adaptation Check:* If Self-Report differs from Objective Severity by >20 points, the "Benefit" score must be adjusted by a panel vote, recorded as "Value Adjustment."

      *Case 2 Specifics:* The user says the panel *instinctively* funded the violinist. The procedure needs to explain *how* to get there without lying about the warehouse worker's adaptation. The procedure should force them to admit they are prioritizing "prevention of decline" over "relief of static burden," or "subjective distress" over "objective function." I will design the procedure to flag this divergence so they can't hide behind "objective scores."

      *Case 3 Specifics:* The user wants to know how to record it so they don't "launder a guess." The answer is to publish the score as a range or attach a qualifier code (e.g., "90-U" for Uncertain). I will recommend a "Confidence Code" appended to the score.

      *Final Polish:* Ensure the distinction between "Fact Gates" and "Value Gates" is clear.

  7.  **Final Review against User Prompt:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Hand-off to human? Yes.
      *   Honest statement of judgment calls? Yes.
      *   Missing data handling? Yes.
      *   No citations? Yes.
      *   Take a position on the 3 central issues? Yes.
      *   Run on 3 cases? Yes.
      *   Case 3 fallback/recording? Yes.
      *   What it cannot do? Yes.

      *Let's write.*
answer: |-
  ### The Functional Restoration Protocol (FRP)

  This procedure is designed for a 25-minute window. It separates **Fact Gates** (evidence-based, stop/no-stop) from **Value Gates** (judgment-based, requires documentation). It rejects money-metrics and treats subjective well-being as a secondary check, not a primary currency.

  #### Part 1: The Procedure

  **Step 1: The Efficacy Gate (Fact)**
  *   **Question:** Is there peer-reviewed evidence that this intervention works for this specific indication?
  *   **Sufficient Answer:** Yes (Level 1-2 evidence) / No (Anecdotal only) / Uncertain (Extrapolated from other conditions).
  *   **Stop Point:** If **No**, Score = 0. Decision: Reject.
  *   **Missing Data Rule:** If **Uncertain**, apply a **Certainty Penalty**: Reduce the maximum possible Benefit Score by 50%. Do not reject outright, but flag as "Speculative."

  **Step 2: The Baseline Severity Score (Need) — 0 to 50 Points**
  *   **Task:** Measure the *objective functional deficit*, not the patient's suffering.
  *   **Question:** Using the Standard-Case Ladder, where does the patient sit regarding *activity limitation* (mobility, self-care, communication, work) without treatment?
      *   Mild (10 pts): Minor limitation, full independence.
      *   Moderate (30 pts): Significant limitation, requires aids or assistance.
      *   Severe (50 pts): Loss of independence, bed/chair bound, or loss of critical life function (e.g., sight, speech).
  *   **Currency Stance:** This uses the **Objective-List/Capability** currency. It ignores wealth and ignores whether the patient has "gotten used to it."
  *   **Judgment Call:** Defining "critical life function." The panel must agree on a standard list (e.g., walking, seeing, feeding, working) before the session.

  **Step 3: The Restoration Score (Benefit) — 0 to 50 Points**
  *   **Task:** Measure the *size of the improvement*, not the final state.
  *   **Question:** What percentage of the deficit identified in Step 2 is removed by the treatment?
      *   Partial (15 pts): <50% of deficit removed.
      *   Substantial (35 pts): 50-90% of deficit removed.
      *   Complete (50 pts): >90% of deficit removed (return to near-normal function).
  *   **Duration Modifier:**
      *   If benefit lasts <6 months: Multiply Restoration Score by 0.5.
      *   If benefit lasts >5 years: Multiply Restoration Score by 1.0.
      *   If permanent: Multiply Restoration Score by 1.2 (capped at 50).
  *   **Task Stance:** This addresses your first concern. We are comparing **Gain**, not absolute well-being. We do not ask "Who is happier?" We ask "Who gets more function back?"

  **Step 4: The Adaptation Check (Value Hand-Off)**
  *   **Question:** Does the patient's self-reported quality of life (0-10) diverge from the Objective Baseline (Step 2) by more than 20 points? (e.g., Severe objective deficit but high self-report, or Mild objective deficit but low self-report).
  *   **Procedure:**
      *   **If No:** Proceed to Step 5.
      *   **If Yes:** Trigger **Value Deliberation**. The panel must decide: Do we fund based on the Objective Deficit (ignoring adaptation) or the Subjective Distress (rewarding lack of adaptation)?
      *   **Recording:** If you override the Objective Score based on this, you must tick a box: *"Value Adjustment Applied: Adaptation."* You must write one sentence justifying why subjective distress outweighs objective function (or vice versa).
      *   **Corrupted Preferences Stance:** The procedure assumes adaptation is **not** a reason to reduce funding. However, if the panel believes acute distress (lack of adaptation) creates a higher priority, they must admit this is a **Value Judgment**, not a clinical fact.

  **Step 5: The Aggregation Check (Value Hand-Off)**
  *   **Question:** Does this application compete directly with another application for the same budget pool *today*?
  *   **Procedure:**
      *   **If No:** Calculate Final Score (Step 2 + Step 3). If Score > 60, Fund. If < 60, Reject. (Threshold set by annual budget).
      *   **If Yes:** Do **not** use the "Swap Question" yet. Compare Final Scores.
      *   **If Score Difference > 10 points:** Fund the higher score.
      *   **If Score Difference < 10 points:** Trigger **Value Deliberation**. This is the only time you use the "Swap Question."
      *   **Recording:** Document the specific value that broke the tie (e.g., "Prioritized pediatric development over geriatric comfort").

  **Step 6: Final Score and Confidence Code**
  *   **Calculation:** Need (0-50) + Benefit (0-50) = Total (0-100).
  *   **Missing Data Handling:** If any input in Steps 1-3 relied on "Uncertain" evidence or proxy reporting (patient cannot speak), append a **Confidence Code** to the published score.
      *   **A:** High Confidence (Direct evidence, adult self-report).
      *   **B:** Medium Confidence (Extrapolated evidence or proxy report).
      *   **C:** Low Confidence (Speculative benefit).
  *   **Publication:** Publish as "85-B", not "85". This prevents applicants from comparing an 85-A to an 85-B as if they were equal.

  ---

  #### Part 2: Running the Cases

  **Case 1: The Child (Chronic Pain) vs. The Elderly (Terminal)**
  *   **Child:**
      *   Efficacy: Yes (A).
      *   Need (Objective): Severe (50) — "Normal childhood" implies full function is currently blocked.
      *   Benefit (Restoration): Complete (50) — "Close to normal."
      *   Duration: Permanent/Long-term (1.2 modifier).
      *   Adaptation Check: N/A (Child).
      *   **Raw Score:** 50 + 50 = 100.
  *   **Elderly:**
      *   Efficacy: Yes (A).
      *   Need (Objective): Severe (50) — Metastatic disease.
      *   Benefit (Restoration): Partial (15) — "Moderate comfort," not functional restoration.
      *   Duration: <6 months (0.5 modifier). Benefit Points = 7.5.
      *   **Raw Score:** 50 + 7.5 = 57.5.
  *   **Procedure Output:** Fund the Child.
  *   **Why:** The procedure prioritizes **Magnitude of Gain** and **Duration** over absolute Severity of Need. Both have high need, but the child's *benefit* is objectively larger and longer. No Value Deliberation required.

  **Case 2: The Violinist vs. The Warehouse Worker**
  *   **Violinist:**
      *   Efficacy: Yes (A).
      *   Need (Objective): Severe (50) — Loss of career function (hands).
      *   Benefit: Complete (50).
      *   Adaptation Check: Self-report 3/10 matches Objective Severe. No divergence.
      *   **Raw Score:** 100.
  *   **Warehouse Worker:**
      *   Efficacy: Yes (A).
      *   Need (Objective): Severe (50) — Loss of career function (hands).
      *   Benefit: Complete (50).
      *   Adaptation Check: Self-report 7/10 diverges from Objective Severe by >20 points. **Trigger Value Deliberation.**
      *   **The Decision Point:** The procedure forces you to admit that clinically, these cases are identical (Same loss, same gain). The only difference is *time since diagnosis* and *subjective coping*.
      *   **Panel Instinct:** You want to fund the Violinist.
      *   **Procedure Requirement:** To fund the Violinist, you must tick *"Value Adjustment Applied: Adaptation."*
      *   **Justification to Record:** "Panel prioritizes acute psychological distress and prevention of recent disability over management of long-term adapted disability."
      *   **Honesty Check:** You cannot claim the Violinist has a higher *clinical* score. You are explicitly applying a social value preference for the "recently disabled."
      *   **Final Scores:** Violinist (100-A), Warehouse (100-A *adjusted to 80 via Value Veto*).
      *   **Note:** If you cannot agree on that justification, the procedure demands a **Tie-Break Lottery**. You cannot fund one and reject the other based on "merit" if the merit scores are equal.

  **Case 3: Cochlear Implant (Toddler) vs. Home Care (6 Elderly)**
  *   **Cochlear:**
      *   Efficacy: Uncertain/Speculative (B/C). **Certainty Penalty applies.**
      *   Need: Severe (50) — No speech/hearing.
      *   Benefit: Complete (50) — *Theoretically*.
      *   Duration: Permanent.
      *   **Raw Score:** 100. **Confidence Code: C.**
  *   **Home Care (Aggregate):**
      *   Efficacy: Yes (A).
      *   Need: Moderate (30) — Elderly, declining.
      *   Benefit: Partial (15) — Maintenance, not restoration.
      *   Count: 6 Patients.
      *   **Raw Score (Per Patient):** 45. **Confidence Code: A.**
      *   **Aggregate Issue:** The procedure calculates per applicant. It does not sum scores across applicants.
  *   **Procedure Output:** **Indeterminate.**
      *   The Cochlear score (100-C) is higher than the Individual Home Care score (45-A).
      *   However, the **Aggregation Check** triggers because the budget covers *either* 1 Child *or* 6 Elderly.
      *   The procedure cannot mathematically resolve 1 High-Certainty Gain vs. 6 Low-Certainty Gains without a "Social Weighting" variable we do not have.
  *   **Fallback Rule:** **The Maximin Rule.**
      *   When scores are indeterminate due to aggregation/uncertainty, choose the option with the highest *minimum guaranteed benefit*.
      *   Cochlear Minimum: 0 (Speculative).
      *   Home Care Minimum: 45 (Evidenced).
      *   **Decision:** Fund the 6 Elderly.
  *   **Recording:**
      *   Do not publish a score for the Cochlear applicant that implies they lost on merit.
      *   Publish Score: "100-C (Not Funded: Budget Allocation Priority)."
      *   Reason Code: **"Resource Aggregation."**
      *   **Why:** This prevents "laundering." You are admitting the child's *need* was higher, but the *systemic risk* of speculative spending was the deciding factor.

  ---

  #### Part 3: What This Procedure Cannot Do

  You asked for an honest statement of where the disagreements will remain. This procedure does not solve ethics; it manages them. It will leave the following three divides exactly as it found them:

  1.  **The Aggregation Problem:** The procedure treats applications individually. It cannot tell you if saving one life is worth sacrificing six quality-of-life improvements. In Case 3, the Fallback Rule (Maximin) is a bureaucratic tie-breaker, not a moral solution. Panelists who believe "One Child is worth any number of Elderly" will still dissent. You must record their dissent, not suppress it with a score.
  2.  **The "Fair Innings" Argument:** The procedure weights Duration heavily (Case 1). This implicitly favors the young. It does not justify *why* a year of a child's life is worth more than a year of an elder's. It simply calculates it as a higher "Benefit" due to duration. Panelists who believe age should be neutral will view the Duration Modifier as ageist. The procedure forces you to own that bias, but it does not remove it.
  3.  **The Adaptation Paradox:** In Case 2, the procedure forces you to admit if you are penalizing the Warehouse Worker for coping well. Some panelists will argue that coping is a virtue to be rewarded; others will argue it is a tragedy to be ignored. The procedure requires a "Value Adjustment" tick-box, but it cannot tell you which way to tick it. It only ensures you cannot pretend the tick-box is a clinical fact.

  **Operational Summary:**
  Use the **Functional Restoration Protocol**.
  1.  Score Need (Objective) + Benefit (Functional Gain).
  2.  Apply Certainty Penalties for missing data.
  3.  Publish Confidence Codes (A/B/C) alongside scores.
  4.  Use "Value Adjustment" ticks for any decision driven by adaptation, age, or aggregation.
  5.  If the math ties, use the Maximin Fallback or a Lottery. Do not invent a justification.

  This will not make your decisions philosophically perfect. It will make them auditable, consistent, and honest about where the math ends and the judgment begins.
