answer: |-
  **Abstract**

  Indirect normative theories determine what an agent has reason to do by referencing an idealized surrogate: what the agent would want or advise if fully informed, coherent, and unbiased. This project argues that such theories are critically under-specified because idealization comprises distinct operations—information addition, coherence correction, bias removal—that do not necessarily commute. If the order of operations alters the surrogate's verdict, the theory lacks determinate output. Furthermore, the role of the surrogate varies between opaque advice and transparent deliberation continuation, constraining which operations are permissible. Over two years, this project will formalize these operations, test their interactions via toy cases, and evaluate whether indirect normativity can survive the ordering problem without collapsing into directness or indeterminacy.

  **The Problem of Non-Commutative Idealization**

  Indirect normativity offers a compelling solution to the problem of mistaken desires: what you have reason to do is not what you actually want, but what you would want if you were ideal. However, "being ideal" is treated as a single state reached by turning up a dial of rationality. In reality, constructing a surrogate requires applying multiple distinct operations to the actual agent. We must add information, correct logical incoherence, remove self-serving biases, extend reasoning time, and ensure imaginative vividness.

  The central question of this project is determinate: *Does the sequence in which idealizing operations are applied alter the normative verdicts of indirect theories, and if so, can a non-arbitrary ordering be specified without collapsing indirectness into directness?*

  This is not a request for clarification but a challenge to the coherence of the view. If adding information before correcting coherence yields a different surrogate than correcting coherence before adding information, then "the idealized agent" is not a unique entity. Without a principled sequence, indirect normativity cannot deliver the unique verdicts it promises.

  **Why Existing Accounts Are Under-Specified**

  Prominent full-information and coherentist accounts treat the ideal state as a fixed point. They assume that regardless of the path taken, rationality converges on a single set of desires or judgments. This project argues that this assumption is unsupported. The literature typically defends idealization by intuitive appeal—arguing that the ideal agent simply "knows more" or "thinks better." But this ignores the structural mechanics of how those states are generated.

  Two obvious replies fail to settle the question. First, stipulating a canonical order (e.g., "information first") is ad hoc unless justified by independent normative principles. If the order matters, the justification for that order carries normative weight, potentially making the theory less indirect than advertised. Second, arguing for convergence—that all reasonable paths lead to the same verdict—is an empirical claim about the topology of rational space that has never been demonstrated. In complex cases involving self-deception or adaptive preferences, path-dependence is the norm, not the exception. By treating idealization as a black box, existing views leave their core mechanism undefined.

  **Methodology and Work Packages**

  This is a conceptual project requiring no empirical data. Progress is made through formal modeling of rational operations and logical analysis of their interactions. Armchair methodology is superior here because the problem concerns the logical relations between normative concepts, not psychological facts about human reasoning. Empirical data could tell us how humans *do* reason, but not how ideal surrogates *must* be constructed to satisfy normative theories.

  The project is divided into three work packages (WPs) over six terms.

  *WP1: Taxonomy and Formalization (Terms 1–2).* I will catalog the distinct operations bundled under idealization (Information, Coherence, Bias, Time, Vividness). The deliverable is a formal schema defining each operation as a function mapping an agent-state to a new agent-state. This allows us to test whether Function A(Function B) equals Function B(Function A).

  *WP2: The Advisory/Continuation Ambiguity (Terms 3–4).* I will analyze how the *role* of the surrogate constrains the *order* of operations. If the surrogate offers advice, opaque deference is permissible; the agent need not understand the reasoning. If the surrogate represents the agent's own deliberation continued (continuation), transparency is required; the agent must be able to follow the steps. This distinction interacts with ordering: information heavy enough to justify advice might be too opaque for continuation. The deliverable is a paper mapping the permissible operation sequences for each role.

  *WP3: Evaluating the Verdicts (Terms 5–6).* I will apply the schema to specific indirect theories to see if they survive the ordering problem. The deliverable is a monograph draft assessing whether indirect normativity remains viable given the constraints discovered in WP1 and WP2.

  **Toy Cases and Commutativity Matrix**

  To demonstrate non-commutativity, consider two cases.

  *Case 1: The Self-Deceived Artist.* An agent believes she is untalented due to a bias (B) but lacks information about her actual reception (I).
  *Order I then B:* She learns she is acclaimed (I), then removes the bias (B). She becomes confident and creates art.
  *Order B then I:* She removes the bias first (B). Without the bias, she might not seek the information (I) or might interpret neutral feedback differently. The resulting desire set differs.

  *Case 2: The Impulsive Hedonist.* An agent has incoherent desires (C) and lacks time to reflect (T).
  *Order T then C:* Given time, she notices the incoherence and resolves it.
  *Order C then T:* Coherence is imposed artificially before reflection. She might lock in a coherent but unreflective set of desires.

  The following matrix summarizes the plausibility of commutativity for key operations:

  | Operation Pair | Plausibly Commute? | Reason for Non-Communtativity |
  | :--- | :--- | :--- |
  | **Info (I) / Coherence (C)** | No | New info creates new incoherencies; correcting coherence first may reject info. |
  | **Bias (B) / Info (I)** | No | Bias filters information uptake; removing bias changes what is learned. |
  | **Time (T) / Vividness (V)** | Yes | Both are amplification operations; order likely irrelevant. |
  | **Coherence (C) / Bias (B)** | No | Bias often manifests as incoherence; removing one may resolve the other. |

  **Possible Conclusions and Assessment**

  Three outcomes are possible.

  1.  **The Collapse Verdict:** Idealization is revealed as a family of theories with no determinate output because no unique ordering exists. Indirect normativity fails as a reductive account. This would be decided if WP1 shows widespread non-commutativity and WP2 shows no role-based constraints can resolve it.
  2.  **The Principled-Ordering Verdict:** Some sequencing is normatively privileged (e.g., bias removal must precede information). This saves determinacy but implies the idealization procedure itself carries normative weight. The theory becomes less indirect, as the procedure is not neutral. This is decided if a principled defense of one sequence emerges.
  3.  **The Robust-Core Verdict:** Only order-invariant verdicts bind. This preserves a central domain of application (where operations do commute) but leaves many ordinary cases indeterminate. This is decided if a significant subset of operations proves commutative.

  My assessment is that the **Principled-Ordering Verdict** is most likely. It is improbable that all operations commute (ruling out Robust-Core as a complete solution), but unlikely that the theory collapses entirely given its resilience. However, accepting this means admitting that the *process* of idealization is normative, not just the *output*.

  **Risks and Failure Conditions**

  The primary risk is scope creep. Formalizing every possible idealizing operation is impossible. I will restrict the project to the five most cited operations in the literature (Information, Coherence, Bias, Time, Vividness). If the project expands beyond these, it will not be completed in two years.

  A second risk is that this turns out to be a restatement of familiar indeterminacy worries about full-information accounts (e.g., the problem of irrelevant information). To avoid this, I must explicitly demonstrate that the *ordering* problem is distinct from the *content* problem. The smallest result that makes this project worth funding is a proof that at least two standard idealizing operations do not commute in standard cases, forcing indirect theorists to explicitly defend an ordering. Even if no solution is found, establishing the necessity of the question is a useful deliverable for specialists working on these views. If I cannot demonstrate non-commutativity in the toy cases, the project fails, but the matrix alone will serve as a diagnostic tool for future work.
