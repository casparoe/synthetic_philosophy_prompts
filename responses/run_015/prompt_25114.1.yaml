  9.  **Final Polish:** Ensure the tone is mentorship-oriented. Avoid jargon where possible, or explain it. Make sure the distinction between CDT/EDT/FDT is mentioned but not allowed to dominate (since FDT is controversial/less established in mainstream phil). Emphasize *Diachronic Agency*.

      *(Self-Correction during drafting)*: I should be careful not to push the AI angle too hard if the student is in a traditional philosophy department. Frame it as "General Theory of Agency" which *includes* AI. Also, make sure to mention *Resolute Choice* (McClennen) as it's the main competitor to *Sophisticated Choice*.

      *Refining the "Sideshow" point:* The real action is **Diachronic Rationality**. The puzzles are just the stress tests. The dissertation should be about the stress tests illuminating the theory, not just solving the tests.

