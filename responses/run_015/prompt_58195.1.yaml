answer: |-
  ### Brainstorming: Mapping the Conceptual Space

  To disentangle moral rightness from moral worth, we must navigate the gap between the *evaluation of the act* and the *evaluation of the agent*. The following three contrasts structure this inquiry:

  1.  **Motivating Reasons vs. Right-Making Features:**
      *   *Right-Making Features* are objective facts that render an action morally correct (e.g., relieving pain, keeping a promise, distributing goods fairly).
      *   *Motivating Reasons* are the psychological states actually driving the agent (e.g., desire for reward, fear of punishment, genuine concern).
      *   *Interaction:* An action has moral worth only if the motivating reasons align non-accidentally with the right-making features. If I help you *because* it relieves your pain (motivation matches feature), there is worth. If I help you *because* I want a tax break (motivation ignores feature), there is mere conformity.

  2.  **Moved by Moral Rightness *as Such* vs. Moved by Underlying Features:**
      *   *Rightness as Such:* Acting because "it is my duty" or "it is the moral law" (a distinctively Kantian requirement). The agent thinks in moral categories.
      *   *Underlying Features:* Acting because "she is suffering" or "he is my friend" (a Virtue Ethics or Sentimentalist preference). The agent thinks in human terms, not necessarily moral abstractions.
      *   *Interaction:* This is a fault line in theory. Does moral worth require the abstract concept of Duty, or is direct responsiveness to human need superior? We must determine if thinking in moral terms is a necessary condition for worth or merely one possible path.

  3.  **Non-Accidental Doing vs. Mere Coinciding:**
      *   *Coinciding:* The action matches what morality requires, but the connection is lucky or fragile (e.g., a selfish act that happens to help someone).
      *   *Non-Accidental:* The action flows from a stable disposition or reason that tracks moral truth.
      *   *Interaction:* Moral worth requires robustness. If the circumstances changed slightly, would the agent still do the right thing? If the answer is no, the alignment was accidental, negating moral worth.

  ***

  ### Systematic Explanation: Conformity vs. Moral Worth

  In ethical theory, we distinguish between the **deontic status** of an act (is it permissible, obligatory, or forbidden?) and the **aretaic status** of the agent's performance (is it virtuous, worthy of praise, or morally excellent?). An action can be objectively right—meaning it is what duty requires or what produces the best consequences—yet lack **moral worth**. Moral worth is a property not of the outcome, but of the motivational structure from which the action issued.

  To have moral worth, an action must be right *and* done for the right reasons. However, "right reasons" is a complex phrase. It does not simply mean "good intentions"; it means the motivation must latch onto the features that actually make the act right, in a way that is not accidental. We can illuminate this by examining your three cases.

  #### Case 1: The Night-Shift Nurse
  **The Scenario:** The nurse stays late to comfort a patient. She recognizes the patient's vulnerability (a right-making feature). However, she also knows this earns supervisor praise, which she enjoys.

  **Analysis:**
  Philosophers would typically count this action as having **moral worth**, though perhaps not of the purest kind.
  Why? Because the nurse's motivation includes a direct responsiveness to the right-making feature: *patient vulnerability*. She takes the need as a demand for care. This satisfies the requirement that the agent be moved by the underlying features that make the act right.

  The complication here is the **mixed motive**. She also desires praise. Does this selfish desire cancel out the moral worth? Most contemporary moral psychologists argue no, provided the moral motive (care for vulnerability) is sufficient on its own to produce the action. The presence of a self-interested motive does not necessarily negate the moral motive unless the self-interested motive is the *primary* driver or would have caused her to act differently had the moral reasons been absent.

  Here, the distinction between **motivating reasons** and **right-making features** does heavy lifting. The right-making feature is the patient's need. Her motivating reason includes that need. The fact that she *also* motivates herself with praise makes her less saintly, but it does not render the action merely a coincidence with duty. She is not lucky; she is responsive to the need. The praise is a bonus, not the cause.

  #### Case 2: The Shopkeeper
  **The Scenario:** The shopkeeper charges fair prices during a shortage. He does not care about the customers' welfare. He follows a rigid, internalized rule about honest dealing from upbringing, even when he "does not see the point."

  **Analysis:**
  This case is the most philosophically contentious and likely lacks full **moral worth** in the eyes of many theorists, despite being a **morally right action**.
  This scenario echoes Kant's famous example of the shopkeeper, but with a twist. Kant argued that acting from duty (the concept of rightness) confers worth, while acting from inclination (like sympathy) does not. However, this shopkeeper is not acting from a rational grasp of duty; he is acting from a *blind habit* or rigid conditioning ("does not see the point").

  This highlights the contrast between being **moved by moral rightness as such** versus **moved by underlying features**.
  1.  If we hold a strict Kantian view, we might ask: Does he respect the moral law? If he follows the rule merely as a psychological compulsion without rational endorsement, Kant might deny moral worth.
  2.  If we hold a Virtue Ethics view, the lack of concern for the *underlying feature* (the customers' financial welfare or fairness) is fatal. He is not responding to the value of fairness; he is responding to a rule.

  Crucially, this fails the **non-accidental vs. coinciding** test. Because he "does not see the point," his commitment is fragile. If his upbringing had instilled a different rule (e.g., "maximize profit at all times"), he would follow that with the same rigidity. His action coincides with what is right, but it does not track the *reasons* why it is right. He is a moral automaton. Therefore, while the act is permissible and required, the agent deserves little moral credit.

  #### Case 3: The Bystander
  **The Scenario:** A bystander rescues a drowning child. Motives: Concern for the child (sufficient on its own) + Desire to appear heroic (also operative).

  **Analysis:**
  This is a case of **motivational overdetermination**. Both motives are present, and either one alone would have caused the rescue.
  Philosophers generally agree this action has **moral worth**, because the concern for the child was sufficient. The "counterfactual test" is key here: If the crowd had been absent (removing the possibility of appearing heroic), would the child still have been saved? Since the concern for the child was sufficient, the answer is yes.

  However, the presence of the operative desire for glory complicates the **praiseworthiness**. While the action is not accidental (it is grounded in genuine concern), the agent's character is not wholly virtuous. The desire to appear heroic is contingent on social observation, whereas the moral worth of the act relies on the concern for the child.

  This case clarifies the work of the distinction between **motivating reasons** and **right-making features**. The right-making feature is the child's life. The agent is moved by this. The desire for glory is irrelevant to the right-making features. Because the moral motive is robust enough to sustain the action independently, the action is not merely coinciding with duty. It is non-accidentally right. However, the "taint" of vanity suggests that while the *act* is worthy, the *agent* is morally complex. We praise the rescue, but we might reserve judgment on the hero's character until we see if they act when no one is watching.

  ### Complications: Luck, Overdetermination, and the "Rightness" Distinction

  These cases reveal why the distinction between conformity and worth is difficult to apply.

  **1. Overdetermination and Purity:**
  In the Nurse and Bystander cases, we see that moral worth does not require motivational *purity*. An agent can have selfish desires and still perform a worthy action, provided the moral motives are sufficient causes. If we required purity, almost no human action would have moral worth. The distinction allows us to acknowledge that we are complex beings who can do the right thing for a mixture of reasons, without collapsing the difference between a saint and a scoundrel who just happens to help.

  **2. Luck and Coincidence:**
  The Shopkeeper case illustrates the role of luck. It is lucky for the customers that his rigid rule aligns with fairness. If the market conditions changed such that honesty required a complex judgment he wasn't capable of, his rigidity might cause harm. Moral worth requires a connection to the truth of the matter. The agent must be sensitive to *why* the act is right. If the connection is accidental (luck), there is no worth.

  **3. Rightness Itself vs. Right-Making Features:**
  This is the most subtle theoretical point. Does an agent need to think, "This is my duty" to have moral worth?
  *   The **Shopkeeper** follows a rule but doesn't understand the point. He fails.
  *   The **Nurse** thinks about "vulnerability demanding care." She does not necessarily think "I am obeying the Categorical Imperative," but she grasps the *feature* (vulnerability) that makes the act right.
  *   Most modern accounts favor the Nurse's approach. Being moved by the **underlying right-making features** (need, fairness, kindness) is often seen as *more* morally worthy than acting from an abstract concept of **rightness itself**. Acting solely because "it is right" can be alienated or cold; acting because "someone is suffering" shows a direct engagement with value. The distinction helps us see that moral worth is about responsiveness to value, not necessarily obedience to moral taxonomy.

  ### Conclusion: Praiseworthiness and Moral Credit

  Why do we labor over these fine-grained distinctions? The stakes lie in the difference between **permissibility** and **praiseworthiness**.

  **Permissibility/Requiredness** is an external assessment of the act. It answers: "Is the world better because this happened?" or "Did this violate anyone's rights?" The Shopkeeper, the Nurse, and the Bystander all performed permissible or required actions. In a legal or policy context, this is all that matters. We want the shopkeeper to charge fair prices regardless of his inner thoughts.

  **Praiseworthiness/Moral Credit**, however, is an internal assessment of the agent. It answers: "Does this action reveal a good will?" or "Is this person a moral exemplar?" This is where the distinctions bite.
  *   The **Shopkeeper** gets no moral credit. He is a reliable instrument of justice, but not a moral agent in the full sense. We cannot trust his character, only his conditioning.
  *   The **Nurse** and **Bystander** receive moral credit, though perhaps with reservations. They are responsive to moral reasons. They are the kind of people who can be trusted to do the right thing even when the rules are unclear, because they attend to the underlying features (need, life) rather than just rigid protocols.

  Ultimately, the distinction between an action merely turning out right and having moral worth protects the integrity of ethical evaluation. It ensures that we do not reduce morality to a scorecard of outcomes. It insists that *who we are* matters as much as *what we do*. Moral worth tracks the quality of our engagement with the world—whether we act from a genuine, non-accidental responsiveness to the values that make actions right. Without this distinction, we could not differentiate between a lucky selfishness and a genuine virtue, and moral education would be reduced to behavioral training rather than the cultivation of character.
