 case retains a self while the dementia case is ambiguous, distinguishes the artificial system from the corporation, and resolves the dementia ambiguity in one direction. If no single principle saves every verdict, say which one I should abandon and why. Finally, apply the resulting account to a scenario I have not listed: a hive-mind collective in which individual members possess no autobiographical memory whatsoever, but the collective maintains a unified strategic narrative that persists across generations of members. Does the principle predict a self, a distributed analog, or nothing at all?
