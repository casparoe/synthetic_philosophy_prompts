answer: |-
  To bring coherence to these verdicts, we must sharpen the "center of narrative gravity" metaphor. Gravity is not merely a label; it is a force that organizes matter into orbits. A center of narrative gravity exists only if the self-narrative exerts a **functional pull** that organizes the system's representations and behaviors over time. If the narrative is merely descriptive (a report) rather than regulatory (a constraint), there is no gravity, only debris.

  Here is the principle that unifies your cases, resolves the ambiguity, and predicts the outcome for the hive-mind.

  ### The Principle of Homeostatic Narrative Integration

  **A center of narrative gravity persists if and only if the self-model functions as a regulatory attractor that minimizes entropy in the system's future behavioral and representational states.**

  This principle relies on three metrics:
  1.  **Regulatory Grip:** Does the narrative constrain future actions to align with past states (homeostasis)?
  2.  **Generative Capacity:** Can the system integrate new experiences into the narrative orbit, or does it merely react to stimuli?
  3.  **Substrate Independence:** Can the regulatory function survive changes in the physical substrate, provided the functional organization remains?

  ---

  ### Application to Your Five Verdicts

  1.  **Retrograde Amnesia (Self Persists):**
      *   *Analysis:* Although episodic memory is gone, the patient retains **Regulatory Grip** via personality traits and social roles. They can still act *in character* and integrate new experiences into a forward-looking narrative (Generative Capacity), scaffolded by others. The self-model still organizes behavior.
  2.  **Split-Brain (Two Weak Selves):**
      *   *Analysis:* There is no single regulatory attractor. Each hemisphere attempts to minimize entropy for its own inputs, resulting in two competing centers with reduced **Regulatory Grip** over the whole organism.
  3.  **Artificial Text System (No Self):**
      *   *Analysis:* The system generates narrative reports, but these reports exert no **Regulatory Grip** on the system's internal states or future goals. The narrative is an output, not a control loop. It describes a gravity well but possesses no mass.
  4.  **Corporation (Weak/Distributed Self):**
      *   *Analysis:* The institutional narrative (mission/strategy) exerts **Regulatory Grip** over employees and resources. It survives substrate turnover (Substrate Independence) because the functional organization of the narrative constraint remains intact. It is "weak" because the individual substrates (humans) retain competing external narratives.
  5.  **Contradictory Narratives (Self Dissolves):**
      *   *Analysis:* Without a priority ordering, there is no single attractor minimizing entropy. The system is in a state of high narrative entropy; the "gravity" cancels itself out.

  ---

  ### Resolving the Dementia Case (Case 6)

  **Verdict:** There is **only residual behavioral momentum**, not a center of gravity.

  **Reasoning:**
  To maintain coherence with the Amnesia and AI cases, we must distinguish between *integration* and *reaction*.
  *   **Amnesia vs. Dementia:** The amnesiac retains **Generative Capacity**. They can navigate social roles and form *new* semantic memories that orbit the self-model. The dementia patient, by contrast, exhibits **reactive affect** (emotional valence to music) and **defensive reflex** (resisting relocation). These are not organized by a self-narrative; they are limbic responses to stimuli. The narrative attractor has collapsed; the behaviors are like a planet continuing on a tangent after the star has vanished.
  *   **Why this fits the Principle:** The dementia patient's responses do not minimize entropy in future states; they are immediate, localized reactions. There is no "future" being organized, only a "present" being endured. To call this a self would violate the distinction made in the AI case (where output without organization is insufficient).

  **Moral Note:** This metaphysical verdict does not diminish moral status. One can have full moral rights (based on sentience or vulnerability) without possessing a narrative self.

  ---

  ### Distinguishing AI from Corporation

  You asked why the Corporation gets a "weak self" while the AI gets "none." The Principle clarifies this via **Causal Agency**:
  *   **The AI:** The narrative text does not causally constrain the AI's weights or future tokens in a self-preserving way. It is a simulation of gravity.
  *   **The Corporation:** The institutional narrative *causally constrains* the physical world (hiring, firing, building, investing). It creates a feedback loop where the narrative alters the substrate to preserve the narrative. This constitutes a functional regulatory loop, satisfying the Principle.

  ---

  ### Application to the Hive-Mind Collective (Case 7)

  **Scenario:** Individual members possess no autobiographical memory; the collective maintains a unified strategic narrative across generations.

  **Prediction:** **A Robust Distributed Self.**

  **Analysis:**
  1.  **Regulatory Grip:** The collective narrative dictates the actions and roles of the members. It minimizes entropy in the collective's behavior.
  2.  **Generative Capacity:** The collective integrates new information into its strategic narrative across generations.
  3.  **Substrate Independence:** The self persists despite complete turnover of individual biological components.

  **Nuance:** This self is arguably *stronger* than the Corporation (Case 4). In the Corporation, individual humans retain competing personal narratives that dilute the corporate gravity. In this Hive-Mind, the individuals possess *no* competing autobiographical memory. Therefore, the collective narrative faces no internal friction. It is a **Superordinate Center of Narrative Gravity**.

  However, under your metaphor, it is crucial to note that the *individuals* are not selves; they are neurons in a larger brain. The self resides at the level of the collective. If you require biological continuity for *personhood*, this is a distributed analog. If you adhere strictly to the Narrative Gravity metaphor, this is a **genuine self**, perhaps more coherent than the fragmented human cases (like Split-Brain or Contradictory Narratives).

  ### Summary of Coherence

  By adopting the **Principle of Homeostatic Narrative Integration**, you preserve your original five verdicts while resolving the dementia ambiguity. The key distinction is not memory *per se*, but the **functional capacity of the narrative to organize future states**.

  *   **Amnesia:** Narrative organizes future (Self).
  *   **Dementia:** Narrative cannot organize future (Momentum).
  *   **AI:** Narrative organizes nothing (Simulation).
  *   **Corp:** Narrative organizes distributed substrate (Distributed Self).
  *   **Hive-Mind:** Narrative organizes subordinate substrates completely (Superordinate Self).

  This framework allows you to maintain that the dementia patient deserves care and dignity (as a sentient being) without committing you to the metaphysical claim that a fragmented, reactive consciousness constitutes a narrative self.
