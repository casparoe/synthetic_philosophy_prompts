answer: |-
  # The Mercer Valley Prioritarian Scoring Procedure (MV-PSP)

  **Purpose:** To rank grant proposals based on the weighted well-being benefits they produce, prioritizing the worst-off without funding measures that merely narrow gaps by making people worse off.
  **Time Required:** Approx. 20 minutes per proposal.
  **Inputs:** Proposal document, Trust Deprivation Index (Deciles 1–10), Cost breakdown.

  ---

  ## Part 1: The Procedure

  ### Step 1: The Pareto Gate (2 Minutes)
  **Question:** Does this proposal produce a net well-being improvement for *any* specific recipient group?
  *   **Action:** Identify the primary beneficiaries. Is their condition measurably or plausibly better with the grant than without it?
  *   **Stop Condition:** If the answer is **No** (e.g., the proposal closes a service to fund monitoring, or redistributes existing resources without net gain), **REJECT**.
  *   **Reasoning:** This satisfies the Trust's mandate to improve health while adhering to the principle that equity cannot be purchased by making the vulnerable worse off.
  *   **Hand-off:** If the answer is Yes, proceed.

  ### Step 2: Benefit Estimation under Uncertainty (5 Minutes)
  **Question:** What is the total benefit, and how certain are we?
  *   **Action:** Do not demand a single number. Estimate a **Benefit Range** in a common unit (e.g., "Quality-Adjusted Life Months" or a standardized "Health Impact Unit" [HIU]).
      *   *Low Estimate:* Conservative, based on hard evidence.
      *   *High Estimate:* Optimistic, based on stated aims.
      *   *Confidence Flag:* Mark as **High Evidence** (clinical trials, past data) or **Low Evidence** (pilot, novel approach).
  *   **Handling Weak Evidence:** If the proposal targets the worst-off (Deciles 1–2) but has Low Evidence, do **not** zero the benefit. Use the Low Estimate. However, apply a **Risk Discount** of 20% to the final score (see Step 4).
  *   **Hand-off:** If the Low Estimate is zero or negligible, **REJECT** (Uncertainty cannot be a blank cheque). Otherwise, proceed.

  ### Step 3: Priority Weighting (5 Minutes)
  **Question:** What is the deprivation level of the recipients?
  *   **Action:** Map recipients to Trust Deprivation Deciles (1 = Worst, 10 = Best). If a proposal spans multiple deciles, calculate the weighted average decile based on the number of recipients in each.
  *   **The Priority Function:** Assign a weight $W$ using the formula:
      $$W = (11 - \text{Decile})^\alpha$$
      *   *Example:* Decile 1 gets $10^\alpha$; Decile 5 gets $6^\alpha$; Decile 10 gets $1^\alpha$.
  *   **The Value Question:** The parameter $\alpha$ (alpha) represents **how much more we value a benefit to the poor**.
      *   $\alpha = 0$: No priority (Utilitarian).
      *   $\alpha = 1$: Linear priority.
      *   $\alpha = 2$: Strong priority.
      *   *Procedure Note:* The committee **cannot** calculate $\alpha$. It is a value judgment. You must calculate scores for a **Range of $\alpha$** (e.g., 0.5, 1.0, 1.5) to see if the ranking is robust.

  ### Step 4: The Dynamic Check (3 Minutes)
  **Question:** Does success change the deprivation ranking?
  *   **Action:** If the proposal aims to move a district from Decile 2 to Decile 4 over time:
      *   **Score based on Current Baseline:** Use the *current* decile for Step 3.
      *   **Rationale:** A proposal should not be penalized for its own success. If it works, the district rises, and future funding may naturally shift elsewhere. This is a feature, not a bug.
  *   **Stop Condition:** If the proposal admits it cannot improve the decile status but claims to "narrow the gap" by other means, return to Step 1.

  ### Step 5: Calculation and Ranking (5 Minutes)
  **Question:** What is the Cost-Effectiveness Score?
  *   **Formula:**
      $$\text{Score} = \frac{(\text{Benefit Estimate} \times W) - \text{Risk Discount}}{\text{Cost}}$$
  *   **Action:** Calculate this score for the Low and High Benefit Estimates across the chosen $\alpha$ values.
  *   **Decision Rule:**
      *   If Proposal A scores higher than Proposal B across *all* reasonable $\alpha$ values, fund A.
      *   If the ranking flips depending on $\alpha$, the committee must vote on $\alpha$ explicitly. (See Part 3, Case 1).
      *   If the proposal fails to meet a minimum threshold score set by the Trust (to ensure fiscal sustainability), **REJECT**.

  ---

  ## Part 2: Addressing Your Specific Concerns

  ### 1. Ordinal Data and the "Relational View"
  You asked if using deciles (rank) buys back the relational view you objected to.
  *   **The Cost:** Yes, using rank implies a cardinal distance between deciles that may not exist. We assume the gap between Decile 1 and 2 is comparable to 8 and 9. This is false precision.
  *   **The Philosophical Defense:** Prioritarianism values *absolute* well-being levels, not relative rank. However, since we lack absolute data, we use rank as a **proxy for need**.
  *   **The Test:** To ensure we haven't slipped into egalitarianism (valuing equality for its own sake), the procedure tests for **Benefit**, not **Gap Reduction**.
      *   *Forbidden:* "This proposal reduces the Gini coefficient."
      *   *Allowed:* "This proposal provides high-weighted benefits to people in Decile 1."
      *   *Why:* If the whole valley got richer but kept the same decile structure, a Prioritarian would still fund Decile 1. An Egalitarian would care less because the gap is smaller in absolute terms. By fixing weights to the *Decile Label* rather than the *Distance between Deciles*, we approximate the Prioritarian view.

  ### 2. The Mandate to "Narrow Disparities"
  The procedure satisfies the founding document by interpreting "narrowing disparities" as a **byproduct of Prioritarianism**, not a standalone goal.
  *   **Identification:** A component is "Pure Gap Narrowing" if it reduces the statistical difference between districts without increasing the Weighted Benefit Score (Step 5).
  *   **Action:** Such components are stripped out in Step 1.
  *   **Board Communication:** The Board is told: "We narrow disparities by lifting the bottom, not by lowering the top. Proposals that only measure the gap without closing it through service improvement are inconsistent with the Trust's health mission."

  ### 3. The One Value Question
  You suspected the steepness of the weights was the core value judgment. You are correct.
  *   **The Parameter:** $\alpha$ (Alpha).
  *   **Honesty:** The procedure **does not solve for $\alpha$**. It exposes $\alpha$.
  *   **Usage:** When two proposals cross over (one wins at low $\alpha$, one at high $\alpha$), the committee must not pretend the math decided it. You must vote: "How much more do we value the worst-off?" That is a political/moral question, not a technical one.

  ---

  ## Part 3: Application to Cases

  ### Case 1: Home-Visiting vs. Falls-Prevention
  **Data:**
  *   **Home-Visiting (HV):** 200 families, Decile 1.5 (avg). Cost \$900k. Benefit: 10 HIU/family (Low Estimate). Total Benefit = 2,000 HIU.
  *   **Falls-Prevention (FP):** 11,000 residents, Decile 5.5 (avg). Cost \$600k. Benefit: 1 HIU/resident (Low Estimate). Total Benefit = 11,000 HIU.
  *   **Weight Function:** $W = (11 - \text{Decile})^\alpha$.

  **Calculation (Score per \$1,000):**
  *   **HV Score:** $\frac{2,000 \times (9.5)^\alpha}{900} = 2.22 \times 9.5^\alpha$
  *   **FP Score:** $\frac{11,000 \times (5.5)^\alpha}{600} = 18.33 \times 5.5^\alpha$

  **Crossover Analysis:**
  We need to find $\alpha$ where $2.22 \times 9.5^\alpha = 18.33 \times 5.5^\alpha$.
  $$ \frac{9.5^\alpha}{5.5^\alpha} = \frac{18.33}{2.22} $$
  $$ (1.727)^\alpha = 8.25 $$
  $$ \alpha \times \ln(1.727) = \ln(8.25) $$
  $$ \alpha \times 0.546 = 2.11 $$
  $$ \alpha \approx 3.86 $$

  **Result:**
  *   At $\alpha = 1$ (Linear Priority): FP Score (100) > HV Score (21). **Falls-Prevention Wins.**
  *   At $\alpha = 2$ (Strong Priority): FP Score (550) > HV Score (200). **Falls-Prevention Wins.**
  *   At $\alpha = 3.86$ (Extreme Priority): **Tie.**
  *   At $\alpha > 3.86$: **Home-Visiting Wins.**

  **Committee Guidance:**
  Unless the committee is prepared to say that a benefit to a Decile 1 resident is worth **nearly 40 times more** than a benefit to a Decile 5 resident (since $9.5^{3.86} / 5.5^{3.86} \approx 38$), the **Falls-Prevention programme ranks higher**. The procedure reveals that funding Home-Visiting requires an extreme prioritarian commitment that outweighs the sheer scale of the Falls programme. If the committee chooses Home-Visiting, they must explicitly vote for $\alpha > 3.86$ and justify that extreme weighting to the Board.

  ### Case 2: The "Leveling Down" Proposal
  **Proposal:** Close outreach in Deciles 8–9 to fund a Disparities Monitoring Post. No new services.
  **Procedure Application:**
  *   **Step 1 (Pareto Gate):** Does any recipient experience a net well-being improvement?
      *   *Analysis:* Residents in 8–9 lose service. No one gains service. Monitoring post creates data, not health.
      *   *Result:* **No.**
  *   **Decision:** **REJECT.**
  *   **Published Reason:** "While the Trust is committed to narrowing disparities, our mandate requires that equity be achieved through the improvement of health outcomes, not the reduction of existing services. This proposal reduces well-being in two districts without generating a compensatory health benefit elsewhere. Under the MV-PSP, equity is a byproduct of prioritizing the worst-off, not a standalone metric to be optimized at the expense of current patients."

  ### Case 3: The Flagship Meals Service
  **Proposal:** Meals for isolated elderly in Decile 1. Cost per HIU is very high.
  **Data:**
  *   Cost: \$500k. Benefit: 500 HIU (Low Evidence, Risk Discount applied).
  *   Decile: 1.0. Weight: $10^\alpha$.
  *   Comparator: A Decile 3 preventive care programme. Cost \$500k. Benefit: 2,000 HIU (High Evidence). Weight: $8^\alpha$.
  **Calculation:**
  *   **Meals Score:** $(500 \times 10^\alpha) / 500 = 10^\alpha$
  *   **Preventive Score:** $(2,000 \times 8^\alpha) / 500 = 4 \times 8^\alpha$
  **Crossover:**
  $$ 10^\alpha = 4 \times 8^\alpha \rightarrow (1.25)^\alpha = 4 \rightarrow \alpha \approx 6.2 $$
  **Result:**
  Even at $\alpha = 2$ (Strong Priority), Preventive Care ($4 \times 64 = 256$) beats Meals ($100$). To fund the Meals Service, the committee must choose $\alpha > 6.2$.
  **Committee Guidance:**
  The procedure indicates that the Meals Service is **inefficient even under strong prioritarian weighting**. If the committee wishes to fund it, they are not making a health-allocation decision; they are making a **political exception**. The procedure recommends rejecting it in favor of higher-impact interventions, or explicitly categorizing it as "Core Infrastructure" outside the competitive grant pool if the Board deems it untouchable.

  ---

  ## Part 4: Limitations and Warnings

  **1. What the Procedure Cannot Do**
  *   **It cannot resolve the value of $\alpha$.** If the committee is split between "help the most people" ($\alpha \approx 0$) and "help the worst people at all costs" ($\alpha > 3$), this arithmetic will not reconcile you. It will only show you the price of your disagreement.
  *   **It cannot validate bad data.** If the "Benefit Estimate" for a Decile 1 proposal is wishful thinking, the high weight will amplify the error. The Risk Discount is a shield, not a cure.

  **2. Judgment Dressed as Arithmetic**
  *   **The Decile Proxy:** Treating Decile 1 as "10" and Decile 2 as "9" assumes equal intervals of suffering. This is false. We hide this error inside the $\alpha$ parameter.
  *   **The Benefit Unit:** Comparing "falls prevented" to "families visited" requires a common unit (HIU). Creating this unit involves value judgments about what constitutes health.

  **3. Where You Will Go Wrong**
  *   **Trust the Crossover:** Do not assume the "Home-Visiting" programme is morally superior just because it targets the poor. If the crossover $\alpha$ is 3.86, ask yourselves: "Is a benefit to the poor *really* worth 40 times a benefit to the middle class?" If you hesitate, fund the Falls programme.
  *   **The Success Penalty:** Do not penalize a proposal because it might make a district "too rich" for future funding. That is the goal.
  *   **The Mandate Trap:** Do not let the Board's "narrow disparities" sentence force you to fund Case 2. The procedure gives you the language to refuse: "Inequality reduction without well-being growth is not health policy."

  **Final Note:** This procedure does not remove the burden of decision. It removes the burden of *pretending* the decision is easier than it is. It forces the value conflict into the open where the Board and the public can see it.
