prompt: |-
  In a course on early modern philosophy, our professor summarized Montaigne's essay "Of Cannibals" roughly as follows: "Montaigne argues that we have no objective standard by which to judge other cultures, so calling the Brazilian Tupinambá 'barbarous' for practicing cannibalism is just European prejudice. He points out that the Tupinambá only eat their enemies after honorable combat and as a ritual of respect, whereas Europeans torture and burn people alive over religious disagreements — which, Montaigne implies, is far worse. The essay is essentially an early statement of cultural relativism: Montaigne's conclusion is that no culture's practices are better or worse than any other's, and that morality is just a matter of local custom."

  I've since read the essay myself, and something about this summary feels off — not entirely wrong, but it seems to flatten Montaigne's position in a way that makes it easier to dismiss. I'm not sure I can articulate what the problem is, though. Can you go through this summary and tell me what a careful reader of Montaigne would accept, what they'd push back on, and whether the label "cultural relativism" fits the essay he actually wrote?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Early modern philosophy course.
      *   **Subject:** Montaigne's essay "Of Cannibals" (*Des Cannibales*).
      *   **Input:** A professor's summary claiming Montaigne argues for cultural relativism (no objective standard, morality is local custom, Tupinambá practices aren't worse than European ones).
      *   **User's Intuition:** The summary feels "off," "flattened," and makes Montaigne "easier to dismiss."
      *   **Task:** Evaluate the summary against the actual text. Identify what's accurate, what's problematic/anachronistic, and assess the "cultural relativism" label.

  2.  **Initial Assessment of the Professor's Summary:**
      *   *Claim 1:* "No objective standard by which to judge other cultures." -> Partially true, but nuanced. Montaigne critiques *European* standards, not necessarily positing a void of all standards.
      *   *Claim 2:* "Calling Tupinambá 'barbarous'... is just European prejudice." -> True. This is the core rhetorical move of the essay.
      *   *Claim 3:* "Tupinambá only eat enemies after honorable combat... Europeans torture... which is far worse." -> True. This is the specific comparison Montaigne makes.
      *   *Claim 4:* "Essentially an early statement of cultural relativism." -> Problematic. This is an anachronistic label.
      *   *Claim 5:* "No culture's practices are better or worse than any other's, and morality is just a matter of local custom." -> Too strong. Montaigne does make value judgments (e.g., virtue, nature vs. artifice).

  3.  **Deconstruct Montaigne's Actual Argument (Mental Retrieval & Verification):**
      *   *Goal:* What is Montaigne actually doing? He's not an anthropologist. He's a skeptic (Pyrrhonian) and a humanist.
      *   *Key Theme:* The definition of "barbarism." He redefines it. Barbarism isn't about being foreign; it's about being contrary to reason/nature.
      *   *Key Theme:* Nature vs. Artifice. The Tupinambá are closer to "nature" (the golden age), Europeans are corrupted by "artifice" (laws, religion, complexity).
      *   *Key Theme:* Skepticism. We shouldn't be so sure of our own superiority.
      *   *Key Theme:* Universal Virtue. Montaigne *does* believe in virtue (courage, loyalty, honesty). He praises the Tupinambá *because* they exhibit these universal virtues better than Europeans. This contradicts hard relativism.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's intuition. The summary is a common simplification but misses the philosophical depth. It turns Montaigne into a modern sociologist rather than a Renaissance skeptic.

      *   **What the Summary Gets Right (The "Yes" Pile):**
          *   Critique of Eurocentrism: Yes, he challenges the label "barbarian."
          *   The Comparison: Yes, he contrasts ritual cannibalism with religious warfare/torture (St. Bartholomew's Day massacre context).
          *   The Role of Custom: Yes, he acknowledges custom shapes perception ("Each man calls barbarism whatever is not his own practice").

      *   **Where the Summary Flattens/Misleads (The "No/Pushback" Pile):**
          *   *Objective Standards:* Montaigne *does* use an objective standard: **Nature/Reason**. He isn't saying "anything goes." He's saying the Tupinambá align *better* with natural law than Europeans.
          *   *Moral Judgment:* He *does* judge. He praises the Tupinambá for virtues (bravery, honesty). He condemns Europeans for vices (treachery, cruelty). This isn't "no culture is better." It's "this culture is better at being human."
          *   *The Goal:* It's not anthropology; it's self-critique. The Tupinambá are a mirror for Europe.

      *   **The "Cultural Relativism" Label (The Crux):**
          *   Define Cultural Relativism (modern anthropological concept: moral truth is relative to culture, no external judgment possible).
          *   Contrast with Montaigne: He is a **Moral Universalist** disguised as a relativist. He believes in universal virtues but thinks custom blinds us to them.
          *   Anachronism: Applying a 20th-century term to a 16th-century skeptic.
          *   Better Label: **Skepticism** or **Naturalism**.

      *   **Why the Distinction Matters (Addressing "Easier to Dismiss"):**
          *   If he's a relativist, he's easy to dismiss ("So murder is okay if culture says so?").
          *   If he's a skeptic/naturalist, the challenge is harder ("You think you're civilized, but you violate the very laws of nature you claim to uphold").
          *   The essay is about *hubris*, not just tolerance.

  5.  **Refining the Tone:**
      *   Academic but accessible.
      *   Respectful of the professor (don't say "wrong," say "simplification" or "anachronistic").
      *   Encouraging to the student (trust your reading).

  6.  **Self-Correction/Nuance Check during Drafting:**
      *   *Did Montaigne meet the Tupinambá?* No, he met a servant who had been there and spoke to three Tupinambá men in Rouen. Important context for his "evidence."
      *   *Is he defending cannibalism?* Not exactly. He's contextualizing it to show European cruelty is worse. He admits cannibalism is shocking but argues the *motivation* matters.
      *   *The "Golden Age" reference:* Crucial. He links them to Plato's Republic and the Golden Age. This shows he's using classical ideals, not just saying "culture is culture."

  7.  **Final Polish:** Organize with clear headings. Ensure the conclusion ties back to the user's feeling that something was "off." (The feeling comes from the tension between relativism and universal virtue).

  **(Self-Correction Note):** Make sure to emphasize that Montaigne *does* think some things are worse than others. The professor's summary says "no culture's practices are better or worse." That is the biggest factual error regarding Montaigne's text. Montaigne explicitly says some things *are* worse (European torture).

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Your intuition is spot-on. While your professor's summary captures the *rhetorical surface* of the essay, it imposes a modern sociological framework ("cultural relativism") onto a Renaissance skeptical project. This anachronism flattens Montaigne's argument, making it seem like a simple plea for tolerance rather than a profound critique of human hubris and the corruption of "civilization."

  Here is a breakdown of what a careful reader would accept, what they would push back on, and why the label "cultural relativism" is problematic.

  ### 1. What the Summary Gets Right
  A careful reader would agree with the professor on these descriptive points:

  *   **The Critique of "Barbarism":** Montaigne famously opens by questioning the definition of the word. He writes, *"Each man calls barbarism whatever is not his own practice."* He absolutely argues that labeling the Tupinambá "savages" is a product of European prejudice and unfamiliarity.
  *   **The Unfavorable Comparison:** The summary correctly notes that Montaigne contrasts Tupinambá ritual cannibalism with European religious violence. Montaigne explicitly references the French Wars of Religion (specifically the St. Bartholomew's Day Massacre), arguing that torturing a living man (burning him slowly) is morally worse than eating a dead one.
  *   **The Power of Custom:** Montaigne does argue that habit and custom blind us. We think our laws are "natural" simply because we are used to them. He uses the Tupinambá to shake the reader out of this dogmatic slumber.

  ### 2. Where the Summary Flattens the Argument
  This is where your feeling that something is "off" is justified. The summary turns Montaigne into a modern anthropologist, which obscures his actual philosophical goals.

  *   **Claim:** *"We have no objective standard by which to judge other cultures."*
      *   **Pushback:** Montaigne *does* use an objective standard. It isn't "European Custom," but it also isn't "Nothing." His standard is **Nature** and **Reason**. Montaigne argues that the Tupinambá live closer to the "laws of nature" than Europeans do. He praises them not because "their culture says so," but because they exhibit universal virtues (courage, loyalty, honesty) that Europeans *claim* to value but have abandoned.
  *   **Claim:** *"No culture's practices are better or worse than any other's."*
      *   **Pushback:** This is factually incorrect regarding the text. Montaigne explicitly judges cultures. He judges the Tupinambá as *better* than Europeans in specific regards (honesty, lack of avarice, lack of lying). He judges Europeans as *worse* because they are corrupted by "artifice." If he were a true relativist, he couldn't condemn European torture as "worse" than cannibalism; he would just have to say they are "different." But he clearly argues one is more vicious than the other.
  *   **Claim:** *"Morality is just a matter of local custom."*
      *   **Pushback:** Montaigne distinguishes between *custom* (which varies) and *virtue* (which is universal). He suggests that custom often *obscures* virtue. The Tupinambá are admirable not because they follow their customs, but because their customs happen to align better with natural virtue than European customs do.

  ### 3. The Problem with the "Cultural Relativism" Label
  Labeling "Of Cannibals" as an early statement of cultural relativism is a common academic shorthand, but it is philosophically imprecise for two main reasons:

  **A. Anachronism**
  Cultural relativism is a 20th-century anthropological concept (associated with Franz Boas) suggesting that moral truth is relative to culture and that no external standard exists to judge them. Montaigne is a 16th-century **Pyrrhonian Skeptic**.
  *   **The Relativist says:** "You can't judge them; who are you to say?"
  *   **Montaigne says:** "You judge them as barbarians, but when I look closely, *you* are the barbarians. You are failing by your own standards and by the standards of nature."
  Montaigne's goal isn't to suspend judgment; it's to **invert** the judgment.

  **B. Universalism vs. Relativism**
  Montaigne is actually a moral universalist. He believes there are such things as courage, treachery, honesty, and cruelty, and these apply to all humans.
  *   He praises the Tupinambá chief for speaking truth to power (a universal virtue).
  *   He condemns the Portuguese for betrayal (a universal vice).
  *   He references Plato's *Laws* and the "Golden Age" to show that the Tupinambá resemble the ideal republics of classical philosophy.
  By invoking Plato and the Golden Age, he is measuring the Tupinambá against a **universal ideal**, not just saying "that's how they do it in Brazil."

  ### 4. Why the Summary Makes Montaigne "Easier to Dismiss"
  You mentioned the summary makes the position easier to dismiss. This is because hard cultural relativism is vulnerable to a simple counter-argument: *"If morality is just custom, then if a culture values genocide, we can't say they are wrong."*

  If Montaigne were arguing that, he would be easy to dismiss. But he isn't.
  *   **The Harder Challenge:** Montaigne argues that "Civilization" (artifice, law, complex religion) often corrupts human nature, while "Savagery" (simplicity, nature) often preserves it.
  *   **The Stakes:** The essay isn't really about the Tupinambá; it is a mirror held up to Europe. He is arguing that European hubris—the belief that we are the pinnacle of creation—is dangerous and false.

  ### Conclusion: A Better Way to Summarize
  A more accurate summary would look something like this:

  > "Montaigne uses the Tupinambá not to argue that all morals are relative, but to critique European hubris. He argues that the label 'barbarian' reflects European prejudice rather than reality. While acknowledging cultural differences, Montaigne appeals to a universal standard of Nature and Reason, suggesting that the Tupinambá often embody natural virtue (courage, honesty) better than 'civilized' Europeans, whose complex customs lead to vice and cruelty. The essay is less about cultural relativism and more about Skepticism: we should doubt our own superiority before judging others."

  **Verdict:** Trust your reading. The professor's summary captures the *vibe* of the essay (tolerance, anti-prejudice) but misidentifies the *philosophical engine* (Skepticism/Naturalism vs. Relativism). Montaigne isn't saying "nothing is true"; he's saying "you are too blinded by your own customs to see the truth that is right in front of you."
