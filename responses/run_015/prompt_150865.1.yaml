  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Moderator of a novelist critique group (8 members, monthly meetings).
      *   **Problem:** Adjudicating conflicting feedback (e.g., "best thing ever" vs. "couldn't finish Chapter 2") within 20 minutes, without alienating unpaid volunteers, while guiding the writer's revision.
      *   **Goal:** A concrete procedure (checklist/flowchart) to decide which reader to back, declare it undecidable, or hand it off as a values call.
      *   **Constraints:**
          *   Must be runnable in 20 minutes.
          *   Plain language (no philosophy jargon).
          *   Must incorporate/fix the user's 4 half-baked ideas (Key-and-thong, Local vs. Global, Inversion Test, Borrowed Standard).
          *   Must account for two specific group members: a scary-good retired editor (Expert) and an outlier visionary writer (Outlier).
          *   Must include 3 test cases (Debut literary/unbearable narrator, Genre/idea vs. prose, Finished vs. unfinished).
          *   One case must show the procedure overruling the moderator's personal preference.
          *   Must end with limitations (what the procedure cannot do).
          *   **Format:** Lead with the bottom line in the first sentence. No preamble. Casual tone.
      *   **Philosophical Context:** User mentions Hume ("Of the Standard of Taste") and the Don Quixote wine story. Wants to know which Humean distinctions survive translation into a checklist.

  2.  **Deconstruct the User's Ideas & Hume:**
      *   *Hume's "True Judges":* Practice, delicacy, comparison, freedom from prejudice, good sense.
      *   *User's Idea 1 (Key-and-thong):* Find the textual anchor. *Fix:* Needs a "fail state" to prevent apophenia (seeing patterns that aren't there).
      *   *User's Idea 2 (Local vs. Global):* Specificity beats vagueness. *Fix:* How to handle the "Expert" who speaks in globals but is usually right? (Weighting).
      *   *User's Idea 3 (Inversion Test):* Swap sides. *Fix:* Needs to focus on *evidence*, not argumentation skill.
      *   *User's Idea 4 (Borrowed Standard):* Genre/expectation mismatch. *Fix:* Needs a way to identify the "contract" of the book.
      *   *Humean Distinctions to Keep:* "Practice/Comparison" (Track record), "Delicacy" (Specific textual evidence), "Freedom from Prejudice" (Matching standards to intent).
      *   *Humean Distinctions to Drop:* "Objective Beauty" (We aren't finding truth, we're managing revision), "Universal Standard" (Different books need different things).

  3.  **Develop the Procedure (The "Adjudication Protocol"):**
      *   *Time Limit:* 20 minutes total.
      *   *Step 1: The Anchor (Key-and-thong).* Can both readers point to the *same words*? If no, stop (Undecidable/Reader Issue). If yes, proceed. *Fail state:* If you have to stretch to find the link, call it a miss.
      *   *Step 2: The Contract (Borrowed Standard).* What kind of book is this? Does the criticism match the intent? (e.g., judging a thriller by prose beauty vs. pace).
      *   *Step 3: The Weighting (Expert/Outlier).* Apply multipliers based on track record *within this specific domain*.
      *   *Step 4: The Actionability (Local vs. Global).* Can the writer *do* something about it?
      *   *Decision Matrix:* Back Reader A, Back Reader B, Split Verdict, or No Verdict (Writer's Choice).

  4.  **Refining the Steps for the User's Constraints:**
      *   *Handling the Expert:* Give her "Global Verdicts" more weight *if* her track record supports it, but still demand a textual hook for revision advice.
      *   *Handling the Outlier:* Protect their unique vision but isolate it as "high risk/high reward."
      *   *Handling the Moderator:* The procedure must be able to say "You're wrong."
      *   *Hume Translation:*
          *   "Practice/Comparison" -> Track Record Weighting.
          *   "Delicacy" -> Textual Anchoring.
          *   "Good Sense/Prejudice" -> Contract Matching.
          *   Drop: "Universal Standard of Taste."

  5.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: Locate the Collision.* (5 mins). Do they disagree on the *same thing*? If Reader A hates Chapter 2 and Reader B loves Chapter 5, that's not a conflict, that's data. If they both read Chapter 2 and one loves/hates, find the sentence. If no shared sentence, stop. Verdict: Undecidable/Writer's Choice.
      *   *Step 2: Check the Contract.* (5 mins). What is the book trying to be? Does the criticism assume a different book? If Reader A says "Too slow" for a literary novel, discount. If Reader A says "Confusing timeline," keep.
      *   *Step 3: Apply Weight.* (5 mins). Expert gets 2x on structural calls. Outlier gets 2x on voice/risk calls. Regulars need specific evidence.
      *   *Step 4: The Fix Test.* (5 mins). Can the writer fix this without breaking the book? If the fix requires changing the soul of the book, it's a Values Call (Writer decides). If it's a typo/pace/clarity issue, it's a Facts Call (Moderator decides).

  6.  **Developing the Test Cases:**
      *   *Case 1 (Debut/Unbearable Narrator):* 7 love it, 1 hates it. The hater says "unlikable." The contract is literary fiction (likability not required). But is it *compelling*? Procedure should likely side with the majority *unless* the hater is the Outlier or Expert pointing to a specific failure of engagement vs. morality. Let's make the procedure side with the *minority* here to show it overrules the "mob" (and potentially the mod). Let's say the minority is the Expert pointing to a specific technical failure causing the dislike.
      *   *Case 2 (Genre/Idea vs. Prose):* Idea praised, prose trashed. Contract is Genre (pace/plot > prose). Procedure should prioritize the Contract. Verdict: Keep idea, tighten prose only where it impedes clarity.
      *   *Case 3 (Finished vs. Unfinished):* Reader A says "Done." Reader B says "Third act collapses." This is a structural fact check. Procedure should side with the specific evidence of collapse.

      *Wait, I need one case where it tells me to back the reader I personally disagree with.*
      *   Let's make Case 1 the one where I (the Mod) love the book, but the procedure says the hater is right about a specific technical flaw. Or I hate the book, but the procedure says the lover is right.
      *   Let's go with: Mod loves the Debut. Reader A (Regular) says "Narrator is unbearable." Reader B (Expert) says "Narrator is difficult but the pacing in Ch 3 causes the friction." Procedure sides with Expert/Reader A combo over Mod's feeling.
      *   Actually, simpler: Mod thinks the "Unbearable Narrator" complaint is wrong (it's literary fiction). But the Procedure finds the Expert identified a *clarity* issue masquerading as likability. So Procedure says "Fix the clarity," overruling Mod's "Ignore the likability complaint."

  7.  **Finalizing the Procedure Steps (incorporating Hume fixes):**
      *   *Hume Keep:* "Practice" (Track record), "Delicacy" (Specifics), "Freedom from Prejudice" (Genre contract).
      *   *Hume Drop:* "Objective Beauty" (We aren't judging art, we're solving problems).
      *   *Step 1: The Anchor.* (Fixes Key-and-thong). Must point to same passage. If not, "Undecidable."
      *   *Step 2: The Contract.* (Fixes Borrowed Standard). Define the book's goal. Discount feedback violating the goal.
      *   *Step 3: The Weight.* (Fixes Expert/Outlier). Expert globals count as specifics. Outlier risks get a "watch" tag, not a fix tag.
      *   *Step 4: The Repair.* (Fixes Local/Global). Is it fixable without rewriting the soul? If no, "Values Call."

  8.  **Drafting the Content:**
      *   *Tone:* Casual, direct, midnight reading.
      *   *First Sentence:* Bottom line.
      *   *Structure:* Bottom Line -> The Procedure (Steps) -> Hume Translation -> Test Cases -> Limitations.

  9.  **Refining the "Overrule Me" Case:**
      *   Case 1: Debut Literary. Mod loves it. Reader 1 (Regular) says "Narrator is unbearable, stopped at Ch 2." Reader 2 (Expert) says "Ch 2 perspective shift is muddy, makes narrator seem cruel instead of wounded."
      *   Mod's instinct: "Ignore Reader 1, it's supposed to be difficult."
      *   Procedure: Step 1 (Anchor found: Ch 2 perspective). Step 2 (Contract: Literary, so 'unlikable' is okay, but 'muddy' is not). Step 3 (Expert weight). Step 4 (Fixable: Clarify perspective).
      *   Verdict: Back the criticism (fix the muddiness), overruling Mod's instinct to ignore the feedback entirely.

  10. **Review against constraints:**
      *   First sentence bottom line? Yes.
      *   No preamble? Yes.
      *   20-minute procedure? Yes.
      *   Plain language? Yes.
      *   Hume distinctions explained? Yes.
      *   3 Cases (including overrule)? Yes.
      *   Limitations section? Yes.
      *   Casual tone? Yes.

  11. **Final Polish:** Check the "Key-and-thong" fail state. Make sure it's clear how to stop looking. (Time box it). Check the Expert/Outlier weighting so it doesn't just become "Do what the Editor says." (Expert gets weight on *craft*, Outlier gets weight on *vision*, neither gets absolute veto).

      *Self-Correction on Hume:* The user asked specifically which distinctions survive. I need to be explicit about that.
      *Self-Correction on Case 1:* Make sure the Mod's personal disagreement is clear. Mod thinks the narrator is *supposed* to be unbearable. Procedure says the narrator is *confusingly* written, which makes them unbearable unintentionally. That's a good distinction.

      *Let's write it.*
answer: |-
  Here's the bottom line: you're not judging art, you're triaging repairs, so your procedure needs to ignore "good vs. bad" and focus on "intention vs. execution."

  Here is the 20-minute Adjudication Protocol. It steals from Hume where he's useful (track record, specificity, prejudice) and dumps him where he's mystical (objective beauty). Run this in order. If you hit a "STOP" condition, you have your answer.

  ### The 20-Minute Adjudication Protocol

  **Step 1: The Anchor Check (5 Minutes)**
  *Goal: Verify they are fighting about the same object.*
  Read the conflicting notes side-by-side. Can you draw a line from both readers to the exact same paragraph, scene, or structural choice?
  *   **Pass:** Both readers are reacting to the same text (e.g., the dialogue in Scene 4, the pacing of Chapter 2).
  *   **Fail:** One hates the protagonist, the other loves the plot. They aren't disagreeing; they're reviewing different books.
  *   **Verdict if Fail:** **Undecidable.** Tell the writer: "You have data, not a conflict. Reader A wants X, Reader B wants Y. You choose based on the book you're writing."
  *   **Fix for your "Key-and-thong" idea:** You said you couldn't stop yourself from finding patterns. Set a timer. If you can't find the shared anchor in 5 minutes, it doesn't exist. Stop looking.

  **Step 2: The Contract Test (5 Minutes)**
  *Goal: Filter out borrowed standards.*
  Ask the writer (or look at the submission header): What is this book trying to be? (e.g., "A cozy mystery," "A lyrical memoir," "A pulp thriller").
  *   **Pass:** The criticism addresses whether the book succeeds at *its* goal. (e.g., "The mystery clue was invisible" vs. "The prose wasn't poetic enough" for a thriller).
  *   **Fail:** The criticism demands the book be something else. (e.g., "The narrator is unlikable" for a satire about an idiot).
  *   **Verdict if Fail:** **Discount the criticism.** Tell the reader: "You're judging a fish by its ability to climb a tree. Note recorded, but not actionable."
  *   **Exception:** If the criticism is "The book fails at its own goal" (e.g., "This thriller wasn't suspenseful"), it passes.

  **Step 3: The Weighting (5 Minutes)**
  *Goal: Account for the Expert and the Outlier without abdication.*
  Apply multipliers to the remaining valid criticism based on who said it and what kind of claim it is.
  *   **The Expert (Retired Editor):** Her "Global Verdicts" (e.g., "This doesn't work") count as "Local Reasons" *if* her track record is strong in this genre. She has earned the right to intuition.
  *   **The Outlier (Visionary Writer):** Their praise for risky/weird elements counts double. Their complaints about convention count half.
  *   **Regular Readers:** Must provide "Local Reasons" (specific text). Global verdicts from regulars count for zero unless backed by Step 1 Anchors.
  *   **You (The Mod):** Your vote counts as zero. You are the clerk, not the jury.

  **Step 4: The Repair Test (5 Minutes)**
  *Goal: Distinguish Facts from Values.*
  Look at the surviving criticism. Can the writer fix this without changing the soul of the book?
  *   **Pass (Facts Call):** Yes. (e.g., "The timeline is confusing," "The joke lands as cruelty," "The clue is hidden too well").
  *   **Fail (Values Call):** No. Fixing this requires rewriting the theme, voice, or core identity. (e.g., "Make the narrator nicer," "Make the ending happier," "Slow down the pace" in a thriller).
  *   **Verdict if Pass:** **Back the Reader.** Give the writer permission to execute the fix.
  *   **Verdict if Fail:** **Back the Writer.** Tell the readers: "This is a values disagreement. The writer accepts the risk."

  ***

  ### Which Hume Survives?
  *   **Keep:** *Practice/Comparison.* This is your Expert weighting. Hume said true judges need practice; your editor has it.
  *   **Keep:** *Delicacy of Sentiment.* This is your Anchor Check. Hume said critics need to feel small details; your procedure demands specific textual evidence.
  *   **Keep:** *Freedom from Prejudice.* This is your Contract Test. Hume said judges must set aside personal bias; your procedure forces readers to judge the book's intent, not their taste.
  *   **Drop:** *The Standard of Taste.* Hume wanted to find objective beauty. You don't care if it's beautiful; you care if it works. Drop the quest for truth; seek utility.
  *   **Drop:** *The True Judge.* Hume wanted one ideal critic. You have a committee. Don't defer to the Expert entirely; use her weight as data, not law.

  ***

  ### Test Cases

  **Case 1: The Debut Literary Novel (The Overrule)**
  *   **The Book:** A quiet, introspective literary debut.
  *   **The Conflict:** Seven readers love it. One reader (Regular) says, "I couldn't get past Chapter 2. The narrator is unbearable." You (the Mod) love it too and think the reader is just looking for likability.
  *   **The Expert Note:** The retired editor says, "Chapter 2 perspective shift is muddy. It makes the narrator seem cruel instead of wounded."
  *   **Running the Protocol:**
      1.  *Anchor:* Yes. Both point to Chapter 2/Narrator voice.
      2.  *Contract:* Literary fiction. "Unlikable" is allowed, but "Confusing" is not.
      3.  *Weight:* Expert's note upgrades the Regular's complaint from "Taste" to "Craft."
      4.  *Repair:* Can you clarify the perspective without changing the narrator's personality? Yes.
  *   **Verdict:** **Back the Criticism.** You tell the writer: "The reader isn't wrong about the effect (unbearable), but the Expert identified the cause (muddy perspective). Fix the clarity, keep the cruelty."
  *   **Why this overrules you:** You wanted to dismiss the complaint as "reader prejudice." The procedure forced you to admit it was a technical failure masquerading as a taste issue.

  **Case 2: The Genre Manuscript (Idea vs. Prose)**
  *   **The Book:** A high-concept sci-fi thriller.
  *   **The Conflict:** Reader A says, "The idea is genius, best I've read." Reader B says, "The prose is clunky, I couldn't get past Chapter 2."
  *   **Running the Protocol:**
      1.  *Anchor:* No. Reader A loves the plot (global); Reader B hates the sentences (local). They aren't fighting on the same ground.
      2.  *Contract:* Sci-Fi Thriller. Priority is pace/clarity over lyrical prose.
      3.  *Weight:* Reader B's complaint is local, but does it impede the contract?
      4.  *Repair:* If the prose stops the reading, it's a fact. If it's just "ugly," it's a value.
  *   **Verdict:** **Split Verdict.** Tell the writer: "The idea is your asset (Back Reader A). The prose is a barrier to entry (Back Reader B), but only fix where clarity breaks. Do not polish for beauty."
  *   **Why this works:** It prevents the writer from rewriting a thriller into a literary novel to please Reader B, while acknowledging Reader B isn't hallucinating the clunkiness.

  **Case 3: The Finished Question (Fact vs. Value)**
  *   **The Book:** A memoir.
  *   **The Conflict:** Reader A says, "It's done. The ending is perfect." Reader B says, "It's unfinished. The third act collapses."
  *   **Running the Protocol:**
      1.  *Anchor:* Yes. The third act/ending.
      2.  *Contract:* Memoir needs narrative arc.
      3.  *Weight:* Reader B provides specific plot holes (Local). Reader A provides emotional resonance (Global).
      4.  *Repair:* Can you fill the plot holes without changing the ending?
  *   **Verdict:** **Values Call (Undecidable).** If filling the holes requires a new ending, the book's definition of "done" changes.
  *   **Instruction:** "Reader B sees a gap in logic. Reader A feels an emotional completion. This is not a repair; it's a choice. Writer, do you want a logical complete or an emotional complete?"
  *   **Why this works:** It stops you from pretending there's a right answer. One reader is talking about engineering, the other about art.

  ***

  ### What This Procedure Cannot Do
  1.  **It cannot save a bad book.** If the manuscript is fundamentally broken, this procedure will only help you tell the writer *why* politely. It won't generate good art from bad stock.
  2.  **It cannot protect feelings.** You said you need to keep volunteers from quitting. This procedure will sometimes tell a volunteer, "Your feedback was based on the wrong standard." That might sting. You have to deliver that line gently, but you can't soften the verdict.
  3.  **It cannot predict success.** Backing the Expert or the Outlier doesn't guarantee the book will sell or win prizes. It only guarantees the revision is consistent with the book's own goals.
  4.  **It cannot solve personality clashes.** If Reader A hates Reader B's guts, they will disagree on everything. Step 1 will catch most of this, but if they anchor on the same text and still scream opposite verdicts due to personal animosity, the procedure declares "Undecidable" and you have to manage the humans, not the manuscript.
