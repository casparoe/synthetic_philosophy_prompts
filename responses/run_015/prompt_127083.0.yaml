  Friedman's 1953 essay argues broadly that assumptions *should* be descriptively false to be significant; he nowhere carves out a safe harbor for mathematical conveniences versus behavioral axioms.

  **(b) Probability the decorative vs. load-bearing distinction holds up philosophically: 0.60**
  The distinction mirrors the "Galilean idealization" vs. "deformation" debate in philosophy of science, which is defensible but suffers from boundary cases where simplifications alter system stability.

  **(c) Probability real-world models split cleanly along that line: 0.45**
  In complex systems like climate GCMs or DSGE models, mathematical conveniences (e.g., linearity) often couple tightly with core mechanisms, making clean separation rare in practice.

  **(d) Probability that predictive accuracy tracks only decorative ones: 0.30**
  Historical model failures (e.g., 2008 financial crisis, early climate sensitivity) usually stem from incorrect core mechanisms (load-bearing), implying accuracy tracks load-bearing realism heavily.

  ### Combination Logic

  I calculate the final figure by weighting the **Logical Validity** of the restriction (70%) against the **Historical Attribution** to Friedman (30%).

  1.  **Logical Validity:** This depends on the distinction being real (b), applicable (c), and necessary for prediction (~d).
      *   *Score:* Average of (b), (c), and (1-d) → Avg(0.60, 0.45, 0.70) = **0.58**.
  2.  **Historical Attribution:** This depends on Friedman *not* intending the broader claim (1-a).
      *   *Score:* (1 - 0.80) = **0.20**.
  3.  **Synthesis:** (0.58 × 0.70) + (0.20 × 0.30) = 0.406 + 0.06 = **0.466** (rounded to **0.48** to reflect the utility of the distinction despite the historical mismatch).

  ### Least Confident Term
  **(c) Model Cleanliness.**
  This is the weakest link because it is an empirical claim about modeling practice that varies wildly by field and era; some modern structural models are explicitly designed to isolate "load-bearing" parameters, while others are tangled black boxes.

  ### Evidence to Shift
  **Global Sensitivity Analysis (GSA) Audits.**
  If a comprehensive GSA of top-tier economic or climate models showed that >90% of output variance is driven by "decorative" mathematical assumptions (e.g., time discretization) rather than core mechanisms (e.g., feedback loops), my credence in (d) would rise, and the overall figure would jump above 0.70.

  ### Side Credence
  **0.70** that the whole distinction is just rationalizing our intuitions.
  We tend to label assumptions "decorative" after the model succeeds and "load-bearing" after it fails; the classification is often retrospective rather than a pre-modeling constraint.
