answer: |-
  **Ontology Admission Procedure (OAP)**

  **1. Kind vs. Property Test**
  *Question:* Is this a distinct object with a lifecycle (birth, change, death), or a state/attribute of another object?
  *Sufficient Answer:* It has independent identity conditions (e.g., a 'Device' exists separately from a 'Patient').
  *Rule:* If it is a state (e.g., 'Risk', 'Burden'), model as a derived score (calculated value) or property, not a kind (category of thing).
  *Hard Stop:* If purely calculable from existing fields without new real-world referent, do not reify (treat abstract concept as concrete thing).

  **2. Shuffle Test (Identity Conditions)**
  *Question:* If I swap this candidate's identity conditions for a rival candidate's (e.g., swap 'Adherence Event' ID with 'Refill Gap' ID), do downstream queries change?
  *Sufficient Answer:* Yes, downstream logic breaks or changes output.
  *Hard Stop:* If nothing downstream changes, you haven't identified an entity, only a slot. Reject.

  **3. Portability Check**
  *Question:* Does this entity exist identically across all 11 hospitals regardless of local workflow or data collection habits?
  *Sufficient Answer:* Yes, it persists despite collection variance.
  *Hard Stop:* If it vanishes or changes meaning when data collection habits change, it's an artifact, not an entity. Reject.

  **4. Predictive Equivalence Check**
  *Question:* Can we construct a rival ontology without this entity that yields the same predictions/outcomes?
  *Sufficient Answer:* No, this entity is necessary for explanation or distinct intervention.
  *Hard Stop:* If yes, omit (Ontological Parsimony). Do not multiply entities beyond necessity.

  **5. Measurement Stability**
  *Question:* Does recording this entity alter the phenomenon (e.g., auditing changes behavior)?
  *Sufficient Answer:* We acknowledge the feedback loop and monitor drift.
  *Hand-off:* If yes, send to Human Review (Ethics/Policy). This is not a fact question.

  **6. Ethical/Policy Hand-off**
  *Question:* Does asserting this entity exists assign blame, define patient identity, or incur liability?
  *Hand-off:* Yes → Governance Group decides values, not data team.

  ***

  **Application to Live Cases**

  **1. Medication Non-Adherence**
  *Status:* Previously reified as 'Non-Adherence Event'.
  *OAP Run:* Fails Portability (pharmacy refill habits vary by region) and Shuffle (previous iteration tracked our reminder system, not patient behavior; swapping IDs didn't change analytics).
  *Decision:* Demote to 'Adherence Score' property on Patient.
  *Rationale:* It is a derived metric, not a distinct object. The previous entity captured our workflow, not the world. By making it a property, we allow measurement without asserting a distinct clinical event occurred.

  **2. Caregiver Burden**
  *Status:* Proposed as 'Burden Event' inferred from notes.
  *OAP Run:* Fails Kind vs. Property (it is a state of the caregiver, not a distinct object) and Measurement Stability (asking changes the burden).
  *Decision:* Model as NLP-derived score on Encounter. Hand-off to Ethics.
  *Rationale:* Reifying this asserts a psychological state as a clinical fact. The score allows measurement without ontological commitment. Ethics must decide if labeling this is permissible, as it risks stigmatizing families based on inferred data.

  **3. Avoidable Admission**
  *Status:* Leadership demand for regulator penalties.
  *OAP Run:* Fails Portability (avoidability depends on local resources, not just clinical facts) and Predictive Equivalence (we can model 'Risk' without reifying 'Avoidable').
  *Decision:* Reject entity.
  *Leadership Pitch:* Do not say "philosophy says no." Say: "Reifying 'Avoidable' locks us into a binary definition that will fail audits when resources shift. If we code this as an entity, we admit liability for every instance. Instead, we build an 'Admission Risk & Resource Match' score. It satisfies the regulator's need for oversight without creating a false binary that exposes us to liability when 'avoidable' is contested. We track the risk, not the verdict."
  *Rationale:* This is a proxy-function (mapping data to a label) problem. The label implies a counterfactual (what would have happened elsewhere) which is inaccessible in principle. Asserting it exists creates data debt when the definition inevitably changes.

  ***

  **Limitations**
  This procedure misfires on "social kinds" (things that exist because we agree they do, like diagnoses or insurance codes). It cannot resolve value conflicts (e.g., is this burden real?). It assumes data reflects reality, not just workflow. If leadership mandates an entity for compliance despite OAP failure, flag it as "Governance-Mandated Artifact" to distinguish it from "Clinical Reality" in downstream documentation. This preserves audit trails when politics override ontology. The OAP protects data integrity, not organizational power; know when to document the override rather than fight it.
