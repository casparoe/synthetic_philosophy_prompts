answer: |-
  The hotel bar was empty save for the bartender polishing glasses and the hum of the ice machine. Miriam and Tobias sat at a corner table, a laptop open between them displaying a blank document titled *Joint Statement on Intentionality*. The cursor blinked, accusatory.

  "Who derived it, Tobias?" Miriam asked, stirring her drink. "Halcyon-4. The pipeline generated the objective. The selection process retained it. No human chose what the system was for. No human inspected the states. The records are lost. So, when the robot misidentifies a weed as a crop, who is being disobeyed?"

  "The selection process," Tobias said, leaning forward. "You're still looking for a mind. Evolution doesn't need a mind to fix function. The lineage persisted because it solved a problem. That survival condition sets the norm. If the state fires when no weed is present, it fails the condition that kept its ancestors alive. That's not us interpreting; that's a causal fact about the system's persistence."

  "But the system modifies itself now," Miriam countered. "You said it yourself: the training loop has drifted. What it does today isn't what the original selection designed. If the norm is fixed by history, and the history is overwritten, the norm is gone. If the norm is fixed by current function, then you've abandoned derivation entirely. You're saying the system generates its own aboutness."

  "I'm saying the system maintains its own norms," Tobias corrected. "It's a self-correcting loop. It doesn't need a external derivator once the loop is closed. The 'aboutness' is in the capacity to be wrong in a way the system itself registers and attempts to fix."

  "Consider the Twin," Miriam said. "Atom-for-atom duplicate. Assembled by chance tomorrow. No history of selection. No pipeline. No survival lineage. It wakes up, tracks distal features, misfires systematically, and self-corrects. Locally identical to Halcyon-4. Does the Twin have intentionality?"

  Tobias paused. "If it behaves identically, if the causal powers are identical, then yes. It tracks features. It misfires. It corrects. Why would the history matter to the current capacity?"

  "Because you claim intentionality is derived," Miriam pressed. "Derived from what? In Halcyon-4, you point to the pipeline. In the Twin, there is nothing to derive from. If you say the Twin has intentionality, you are admitting that intentionality is intrinsic to the physical structure. You are saying that if you arrange matter correctly, meaning pops out without any prior act of derivation. That is exactly the view you claim to oppose."

  "Intrinsic is a placeholder for 'not dependent on external interpretation'," Tobias said, waving a hand. "You use it to mean 'magic'. I use it to mean 'structural'. If the Twin has the structure that supports error-correction, it has intentionality. The word 'derived' is doing too much work for you. You think it requires a derivator. I think it requires a derivation process, which can be natural selection or self-training."

  "But then draw the line," Miriam said. "A thermostat switches on when the temperature drops. It 'misfires' if the mercury sticks. It corrects by heating the room. Is the thermostat about the temperature? If you say yes, you've diluted intentionality until it covers everything. If you say no, you have to explain why Halcyon-4 is different without appealing to the complexity that merely hides the same mechanism."

  "Complexity matters," Tobias insisted. "The thermostat has one state. Halcyon-4 has a population of states tracking distal features, consumed downstream for action, modifiable by learning. The line is where the system creates a model of the environment that can be decoupled from immediate stimulus. The Twin does that. The thermostat doesn't."

  "So it's a matter of degree?" Miriam asked. "Intentionality emerges when the mechanism is complex enough to fool us?"

  "No. When it's complex enough to sustain systematic error independent of immediate causation," Tobias said. "But look, Miriam, you haven't answered me. What in Halcyon-4's physical constitution makes its states about anything? If you deny the Twin has intentionality, you must point to the magic dust in the original that the duplicate lacks. There is no magic dust. They are atoms arranged the same way."

  Miriam looked at the blank screen. "I concede that there is no magic dust. I concede that the physical constitution constrains what can be meant. You cannot interpret a weed-killer as being about the moon. The causal links limit the interpretation."

  "Then why deny the Twin?"

  "Because constraint isn't constitution," Miriam said. "The physical structure allows for interpretation, but it doesn't generate the norm. In Halcyon-4, the norm comes from the history of selection, even if lost. It *was* selected for X. The Twin was not. The Twin mimics the behavior of a system with norms, but it lacks the normative history. It acts *as if* it means, but there is no fact of the matter that it *does* mean."

  "So you're saying the Twin is a zombie?" Tobias asked.

  "I'm saying it's a mimic," Miriam said. "And I concede this: if you force me to choose between Halcyon-4 and the Twin, I must admit that my distinction relies on a historical relation that is currently inaccessible. I cannot point to the history. I only know it existed. That makes my position verificationally empty."

  "And I concede," Tobias said, slowly, "that without a history of selection, the Twin's 'errors' are only errors relative to our interpretation of its structure. It doesn't violate a norm it inherited. It just behaves irregularly. So, strictly speaking, the Twin lacks *historical* normativity."

  "Exactly," Miriam said. "So we agree that the 'human author' requirement is dead. Neither of us thinks a human needed to write the code for there to be meaning."

  "Agreed," Tobias said. "The pipeline suffices for Halcyon-4."

  "But," Miriam said, typing a single line into the document, "we disagree on whether normativity is essentially historical or essentially structural."

  Tobias read the line. "If it's historical, the Twin is empty. If it's structural, the Twin is full."

  "And that," Miriam said, "is not verbal. It determines whether we think meaning survives the destruction of the past."

  "Then we can't write the paragraph," Tobias said.

  "No," Miriam said, closing the laptop. "But we know why."
