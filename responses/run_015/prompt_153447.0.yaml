answer: |-
  Don't worry about the rambling—this is actually a really sharp set of observations. You've identified the tension points in Prof. Miller's framework perfectly. When a professor gives specific verdicts like this, they are usually testing a specific ethical framework without explicitly naming it.

  Here is a breakdown of the "Miller Rule," the rival hypotheses, how she likely distinguishes tipping from queueing, and which of your three cases is the "key" to unlocking her logic for your paper.

  ### 1. The Core Hypothesis: "The Harm & Consent Principle"
  Based on her past verdicts, the strongest rule she seems to be running is a hybrid of **Consequentialism (Harm)** and **Contractualism (Consent/Knowledge).**

  *   **The Harm Component:** An action is morally wrong primarily if it causes tangible inconvenience or unfairness to others.
      *   *Evidence:* Jaywalking on an empty road is fine (no harm). Grocery queue-jumping is worse than bar queue-jumping (groceries are often necessities/higher stakes for time; bars are leisure).
  *   **The Consent/Knowledge Component:** You are only bound by a norm if you have implicitly agreed to it, which requires *knowing* it exists or having the ability to easily perceive it.
      *   *Evidence:* Visitors don't have to tip if ignorant (cannot consent to hidden economic norms). Visitors *must* queue (the norm is visible/physical; by entering the space, you see the line and consent to the order).

  **Her Likely Verdicts based on this rule:**
  1.  **Reverse-Tip Jar:** If you know the norm, it's immoral not to (violates economic contract). If you don't know, it's excusable (like the US tipping visitor rule). The fact that locals feel "insulted" makes it a *social* sanction, but Miller might argue it only becomes *moral* once the expectation is communicated.
  2.  **Ticket Bot:** Morally wrong (Stronger than grocery jumping). It violates fair access (Harm) and bypasses the implicit "first-come, first-served" contract of the queue without physical presence.
  3.  **Tokyo Train (Empty):** Not morally wrong to not queue. If the platform is empty, there is no harm to order and no one to inconvenience. (Consistent with Jaywalking).

  ### 2. Rival Hypotheses (Alternative Rules)
  To write a good paper, you need to show you considered other rules that *also* fit her data. Here are two strong competitors:

  *   **Rival A: The "Social Cohesion" Rule.**
      *   *Logic:* Norms are moral if they maintain the smooth functioning of society, regardless of immediate harm.
      *   *Fits her data:* Explains why visitors must queue (maintains order). Explains why grocery jumping is worse (disrupts essential systems more than bars).
      *   *Conflict:* Struggles to explain Jaywalking. If the rule is "follow the law/norm for cohesion," jaywalking should be wrong even on an empty road because it undermines respect for traffic laws generally. Miller says it's *not* wrong.
  *   **Rival B: The "Visibility of Expectation" Rule.**
      *   *Logic:* Morality depends on how obvious the norm is to a reasonable observer.
      *   *Fits her data:* Tipping is hidden (financial), so ignorance excuses. Queueing is visible (physical line), so ignorance doesn't excuse.
      *   *Conflict:* Struggles with the Grocery vs. Bar distinction. Both lines are equally visible. Why is one "stronger" wrong? This implies *stakes* matter, not just visibility.

  ### 3. Does she treat Queueing and Tipping as the same kind of norm?
  **No.** This is a crucial distinction for your paper.

  *   **Tipping is a "Knowledge-Dependent Contract."** It is economic and invisible. You cannot see the server's wage structure. Therefore, moral obligation requires *epistemic access* (knowing the custom). This is why visitors get a pass.
  *   **Queueing is a "Spatial-Coordination Norm."** It is physical and visible. You can see the line. Therefore, moral obligation requires only *physical presence*. By standing in the store, you see the system and opt-in.

  **Why this matters:** She treats queueing as closer to "do not hit people" (universal, visible) and tipping as closer to "wear a tie to dinner" (local, knowledge-based).

  ### 4. The "Key" Case: Which one tells the rules apart?
  The **Tokyo Train (Case 3)** is your best diagnostic tool. Here is why:

  This case creates a collision between her **Jaywalking Precedent** and her **Queueing Precedent.**

  *   **If she says "It is NOT wrong to skip the line on an empty platform":**
      *   She is prioritizing the **Harm Principle** (from Jaywalking). If no one is there, no harm is done, so the norm dissolves.
      *   *Implication:* Queueing is only moral when it serves a function (coordination).
  *   **If she says "It IS wrong to skip the line even on an empty platform":**
      *   She is prioritizing the **Social Cohesion/Habit Principle**. The moral act is maintaining the *habit* of order, regardless of immediate utility.
      *   *Implication:* This would contradict her Jaywalking verdict unless she argues that trains are "essential infrastructure" (like groceries) where rules must never lapse.

  **Why the other cases are less effective:**
  *   **The Reverse-Tip Jar:** This is too similar to her US Tipping verdict. It will likely yield the same answer (Obligatory if known, excusable if not). It doesn't stress-test the theory.
  *   **The Ticket Bot:** This is likely a clear "Wrong" under almost any theory (Fairness, Harm, or Contract). It confirms her views but doesn't distinguish *which* view she holds.

  ### Summary for your Paper
  1.  **Her Rule:** Likely a **Harm-Based Contractualism**. Norms are moral obligations when they prevent harm/unfairness *and* the agent has reasonable knowledge/visibility of the norm.
  2.  **Queue vs. Tip:** They are distinct. Queueing is visible/structural (binding on visitors); Tipping is hidden/economic (binding only on the knowledgeable).
  3.  **The Pivot:** Use the **Tokyo Train** case to test whether she values *outcomes* (no harm = no wrong) or *rules* (follow the norm regardless). If she aligns with the empty road (Jaywalking), the Tokyo line should be optional. If she aligns with the Grocery Store (Strict Order), the Tokyo line is mandatory.

  **Pro-Tip:** If you want to impress her, argue that the **Ticket Bot** is actually the most interesting case. It challenges the "Visibility" rule. You can't *see* a virtual line. If she condemns the bot, she admits that **Fairness** matters more than **Visibility**. If she excuses the bot (because it's not a physical space), she admits **Physical Presence** is her true metric.

  Good luck with the paper! You've got enough here to build a solid argument.
