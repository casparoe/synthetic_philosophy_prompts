answer: |-
  ### Brainstorming Pass: The Utility of Catastrophe

  A defeat becomes national moral capital only when it ceases to be a military event and becomes a metaphysical one. Victory is finite; it ends the war. Defeat, properly curated, ends the history, allowing the nation to exist perpetually in the moment of its sacrifice. 

  Total loss is superior to partial loss because it eliminates the survivors. Survivors are liabilities; they remember panic, surrender, or the specific order that went wrong. The dead cannot contradict the transcript. A loss must be "misfortune-shaped" (overwhelming odds, betrayal, weather) rather than "error-shaped" (incompetence, cowardice). If the loss was someone's fault, the myth collapses into blame. The enemy must win through brute material superiority, confirming the loser's moral superiority. If the enemy won through skill or virtue, the martyrdom is invalidated.

  Commemoration functions as an editorial process. It removes the collateral damage inflicted by the losers, the strategic blunders, and the aftermath of collaboration. It isolates the moment of extinction. For nations lacking such an event—those who won too easily, lost too messily, or remained neutral—cohesion suffers. They lack the blood equity required for solemnity. They must procure a catastrophe. If one cannot be found domestically, it must be imported. The mechanism of borrowing must be bureaucratic enough to seem routine, yet profound enough to sustain grief.

  ***

  ### INTERNAL CONSULTATION MEMORANDUM

  **REFERENCE:** BCS/INT/4492/LOSS
  **DATE:** 14 October 2024
  **TO:** Directorate of National Cohesion; Regional Heritage Liaisons
  **FROM:** Bureau of Commemorative Settlement
  **SUBJECT:** Proposal for Loss Substitution Scheme (LSS)

  **1. Context and Heritage Deficit**
  Recent audits indicate that twelve Member States currently operate with a significant deficit in usable historical catastrophe. While these states possess adequate founding narratives, they lack the specific moral equity generated by a edifying military defeat. In three instances, this is due to decisive victory (which precludes martyrdom); in four, the loss was attributable to specific command errors (which precludes heroism); in the remaining cases, the state remained neutral during the relevant conflict periods. Without a suitably tragic anchor, civic solemnity remains superficial. To rectify this imbalance, the Bureau proposes the implementation of a Loss Substitution Scheme (LSS).

  **2. Mechanism of Procurement**
  Under the LSS, Member States lacking a domestic catastrophe may apply to lease a foreign lost cause on a renewable ninety-nine-year basis. The Bureau maintains a portfolio of pre-vetted defeats available for immediate narrative integration. These assets are sourced from states with an excess of historical tragedy or those wishing to divest themselves of heritage liabilities. The leasing arrangement includes full transfer of commemorative rights, allowing the lessee state to incorporate the event into their national curriculum, currency iconography, and remembrance holidays.

  **3. Usability Audit Criteria**
  All prospective losses must pass the Bureau's Usability Audit before certification. The matrix prioritises the following metrics:

  *   **Completeness of Loss:** The engagement must result in near-total attrition of the participating unit. Partial retreats introduce narrative friction regarding survival and surrender.
  *   **Moral Tidiness:** The losing force must be demonstrably virtuous. Evidence of looting, indiscipline, or political extremism among the losers must be redactable from the public record.
  *   **Unflatteringness of Winners:** The victorious opposing force must be portrayed as possessing overwhelming material advantage but lacking spiritual resolve. Victories achieved through superior ethics or diplomacy by the enemy render the loss unusable.
  *   **Anniversary Convenience:** The date of the catastrophe must not conflict with existing harvest festivals or major sporting events. Q4 anniversaries are preferred for indoor ceremonies.

  **4. Narration Package and Maintenance**
  Successful applicants will receive a standardised Narration Package. This includes approved textbook excerpts, script templates for monument unveilings, and a list of prohibited historical facts (Schedule B). It is the responsibility of the lessee state to ensure local archives are aligned with the leased narrative. The Bureau advises against modifying the core details of the loss (e.g., location, casualty figures) once integrated, as inconsistencies between the leasehold and the source material may trigger cognitive dissonance among the populace. Annual maintenance fees cover the suppression of contradictory academic research.

  **5. Recommendation**
  The Bureau recommends immediate piloting of the LSS with the three Member States whose recent centenaries were cancelled due to a lack of suitable solemnity. Procurement officers are instructed to prioritise losses involving last stands in inaccessible terrain, as these offer the highest return on emotional investment. We await authorization to proceed to tender.

  **Signed,**
  *H. V. Sterling*
  *Director, Asset Acquisition*
  *Bureau of Commemorative Settlement*
