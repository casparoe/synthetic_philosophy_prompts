      *   *Measurement:* Perception of particulars (the shape of clouds at a specific moment).
      *   *Feedback:* (Tricky) Funes doesn't act on the world to extract work. Maybe "recall"? Or just the state of knowing?
      *   *Cycle:* The narrator implies Funes is stuck in the present replaying the past. A "cycle" of thought?
