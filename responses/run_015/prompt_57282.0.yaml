      *   *Constraint Check:* Don't invent details. Funes dies of congestion of the lungs (need to verify or flag). *Self-Correction:* I recall he dies of congestion, but I should flag if I'm not 100% sure of the specific medical term in the translation. (It is generally accepted as pulmonary congestion).

