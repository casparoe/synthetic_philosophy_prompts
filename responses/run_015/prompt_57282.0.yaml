      *   *Work Value:* Demons extract work (lower entropy of gas). Funes extracts... nothing? He is paralyzed by detail. This is the "Demon who violates no law" point.
      *   *Load-bearing:* The fact that Funes extracts *no work* is crucial. It suggests that information without erasure (compression) has zero *utility*, even if it has zero *thermodynamic cost*. This shifts the argument from thermodynamics to *pragmatics/semantics*.

