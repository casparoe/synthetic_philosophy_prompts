      *   *Survival:* The thesis relies on the *structural* analogy (irreversibility = cost), not necessarily the strict Joule equivalent. If Landauer is just a heuristic, Borges still illustrates the *logical* necessity of loss for gain (abstraction). The thesis weakens from "Thermodynamic Cost" to "Structural/Informational Cost."

