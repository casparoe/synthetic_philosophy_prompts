          *   *Proponents:* Cite Darwin (design without designer) and Turing (problem-solving without semantics) to argue for "competence without comprehension." The system is a competent agent entitled to credit but exempt from reasoning accountability.
          *   *Opponents:* Scientific authorship = epistemic responsibility. Collapsing mechanism/agent distinction undermines consent, provenance, and liability.
      *   **Requirements:**
          *   Specify a concrete course of action (Approve with conditions/Reject/Modified oversight).
          *   Include an implementation timeline (authorship protocols, audit mechanisms, sunset clauses).
