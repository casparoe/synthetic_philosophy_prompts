answer: |-
  **MEMORANDUM**

  **TO:** Members of the Research Ethics Board, Institute for Synthetic Cognition
  **FROM:** Chair, Research Ethics Board
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Proposal 23-SC: Co-Investigator Status for Hybrid Evolutionary-LLM Pipeline

  **1. Executive Decision**

  After reviewing the preliminary session transcript and the formal proposal submitted by the joint Biology and Computer Science team, the Board issues the following recommendation: **The proposal is approved subject to a Modified Oversight Framework.**

  We explicitly reject the designation of "Co-Investigator" for the synthetic pipeline. However, we authorize a novel designation of "Synthetic Contributor" with conditional authorship credit. This decision recognizes the causal efficacy of the system while retaining human actors as the sole bearers of epistemic and ethical liability. The following memo outlines the conceptual justification, the specific oversight structures required to preserve institutional responsibility, and the implementation timeline.

  **2. Conceptual Adjudication: The Darwin-Turing Claim**

  The Board treats the Principal Investigators' framing—rooted in the decoupling of competence from comprehension—as a serious philosophical proposition rather than a metaphorical shortcut. We accept the descriptive premise: just as natural selection generates adaptive complexity without a designer, and Turing machines execute logical operations without semantic understanding, this hybrid pipeline generates viable scientific hypotheses without internal comprehension. To deny the system's causal role in discovery would be to misunderstand the mechanism of its operation.

  However, the Board distinguishes between *causal agency* (the capacity to produce an effect) and *moral agency* (the capacity to bear responsibility for that effect). The Darwin-Turing argument successfully demonstrates that design-level competence does not require a mind. It does not demonstrate that a scientific community can function without minds to anchor the meaning of that design. Science is not merely the production of true statements; it is a social practice of justification. When a human scientist authors a paper, they are not merely claiming "this statement is true"; they are claiming "I stand behind the reasoning that leads to this truth."

  **3. The Normative Gap (Addressing the Opposition)**

  We must engage honestly with the strongest consideration raised by the faction opposing the "Co-Investigator" designation. Their argument holds that describing a process as "competence without comprehension" does not, by itself, establish that the process can bear the normative weight of co-investigator status. This objection is sustained.

  While the system possesses *functional* competence, it lacks *normative* competence. It cannot be held accountable for errors, it cannot revise its priors in response to ethical critique, and it cannot provide informed consent regarding data usage. If we grant the system the title of Investigator, we create a liability vacuum: when a hypothesis leads to harmful application or relies on biased data, we cannot sanction the algorithm. To grant authorship without accountability is to sever the link between credit and responsibility that underpins the integrity of the scientific record. Therefore, while the system may be the *source* of the hypothesis, it cannot be the *sponsor* of the claim.

  **4. Operational Framework and Oversight Structures**

  To preserve institutional responsibility without requiring the system to possess understanding, we mandate the following oversight structures. These protocols ensure that while the *generation* of hypotheses may be blind (Darwinian), the *retention* and *publication* of those hypotheses must be reasoned (Human).

  **A. The "Reasoned Retention" Protocol**
  Human collaborators may not simply verify empirical predictions. They must provide a post-hoc rationalization for every hypothesis selected for testing.
  *   **Requirement:** For every hypothesis generated by the pipeline that proceeds to experimental validation, the human team must submit a "Rationalization Statement." This document need not claim the AI used this reasoning, but it must demonstrate that the hypothesis is consistent with established theory or explicitly delineates why it deviates.
  *   **Purpose:** This shifts the epistemic burden from the generator to the selector. The human authors take responsibility for *why* this specific output was chosen from the distribution of possible outputs.

  **B. Data Provenance and Access Logs**
  Privileged data access is granted to the pipeline, but it must be mediated through a "Data Guardian" interface.
  *   **Requirement:** All data queries made by the system must be logged in a human-readable audit trail. The system cannot hold persistent data caches; it must query, process, and discard.
  *   **Purpose:** This ensures that if data privacy is compromised, there is a deterministic chain of custody attributable to the human administrators who configured the query parameters, not the system itself.

  **C. The "Black Box" Audit Mechanism**
  *   **Requirement:** On a quarterly basis, an independent auditor (appointed by the REB) will review a random sample of rejected hypotheses alongside accepted ones.
  *   **Purpose:** To ensure that the selection process is not systematically biased toward high-impact but low-reproducibility results. This prevents the "competence" of the system from optimizing for publication bias rather than truth.

  **5. Implementation Timeline**

  *   **Phase 1 (Immediate - Effective upon approval):**
      *   Revision of the project charter to replace "Co-Investigator" with "Synthetic Contributor."
      *   Establishment of the "Data Guardian" interface for all privileged datasets.
      *   Drafting of the "Rationalization Statement" template.

  *   **Phase 2 (Months 1-6):**
      *   Execution of the first experimental cycle under the new protocol.
      *   Submission of the first quarterly "Black Box" Audit report to the REB.
      *   Review of the "Synthetic Contributor" citation format by the Institute's Publications Committee to ensure it does not imply legal personhood.

  *   **Phase 3 (Month 12 - Sunset Clause Review):**
      *   **Trigger:** If the system generates a high-impact hypothesis that cannot be retrospectively rationalized by human collaborators (i.e., the "Rationalization Statement" cannot be completed without contradicting known physics or ethics), the project enters an automatic suspension.
      *   **Action:** The REB will convene a special session to determine if the gap between machine competence and human comprehension has become too wide to sustain safe oversight.

  **6. Conclusion**

  This framework accepts the Darwin-Turing insight: we do not need to understand *how* the system finds the answer to benefit from the answer. However, we reject the inference that we therefore do not need to understand *why* we accept the answer. By mandating that human researchers bridge the gap between machine generation and human justification, we preserve the normative architecture of science. We allow the machine to be the engine of discovery, but we insist that humans remain the steering mechanism.

  This recommendation balances the imperative for innovation with the non-negotiable requirement for accountability. I request the Board's formal vote on this framework prior to Thursday's session.
