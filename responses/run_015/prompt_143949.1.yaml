          *   *Sunset Clause:* If the system generates a high-impact hypothesis that cannot be retrospectively rationalized by humans, the project pauses.
      *   **Oversight Structures:**
          *   Human-in-the-loop for *validation*, not just verification.
          *   Provenance tracking that links AI output to human decision nodes.
      *   **Closing:** Reiterate the board's stance on the future of synthetic cognition.

  4.  **Refining the Argument (Self-Correction during drafting):**
