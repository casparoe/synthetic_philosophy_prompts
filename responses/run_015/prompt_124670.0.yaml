      *   *Actually, looking at the "Overall":* If I have to choose, B is more right because A is engaging in a category error that weakens the philosophical toolkit. If you stretch Chesterton to cover accidental physical objects, the concept loses its bite for actual institutions. B protects the rigor of the concepts.

