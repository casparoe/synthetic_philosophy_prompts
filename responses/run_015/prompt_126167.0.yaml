          4.  Recommendation on Quoting.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the "Non-existent" point:* Make sure to clarify that for Frankish, the *phenomenal property* is non-existent, not the mental state itself.
      *   *Refining the "First-Person Authority" point:* This is the biggest potential pitfall. The forum post says "reject *all* first-person authority." That's too strong. Illusionists accept we know we are in pain, just not that the pain has "pain-qualia."
