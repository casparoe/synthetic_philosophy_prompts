answer: |-
  This is a sharp instinct. The forum post you found captures the *spirit* of illusionism but flattens the nuance in ways that could lead to philosophical inaccuracies in your piece. While it isn't a total strawman, it conflates the *content* of experience with the *existence* of experience, and it treats a theoretical distinction as a rhetorical trick.

  Here is a sentence-by-sentence audit of the summary, followed by a deep dive into the specific conceptual traps you identified.

  ### Sentence-by-Sentence Audit

  **1. "Illusionists like Frankish and Dennett claim phenomenal consciousness is literally non-existent..."**
  *   **Verdict:** **Mostly Accurate, but needs qualification.**
  *   **Analysis:** Keith Frankish (the primary architect of modern illusionism) explicitly argues that *phenomenal properties* (qualia) are non-existent. However, he does not claim that *mental states* are non-existent. The distinction is vital: The brain state exists; the "glow" or "inner movie" we think accompanies that state does not.
  *   **Correction:** It is more accurate to say they claim phenomenal *properties* are non-existent, not that consciousness itself (as a functional capacity) is non-existent.

  **2. "...that 'what it's like' talk is just a linguistic glitch caused by introspective opacity..."**
  *   **Verdict:** **Accurate Terminology, slightly reductive framing.**
  *   **Analysis:** "Introspective opacity" is standard Frankish terminology. The argument is that our introspective mechanisms do not reveal the physical/functional complexity of our brain states. Because we can't "see" the gears turning, we posit a magical, non-physical "feel." Calling it a "linguistic glitch" is a bit dismissive; illusionists view it as a cognitive error or a "user-illusion" (like a desktop icon), not merely a mistake in grammar.
  *   **Correction:** Frame it as a "cognitive misrepresentation" rather than just a linguistic glitch.

  **3. "...and that once neuroscience maps the neural correlates we'll see there's only information processing with no leftover qualitative feel."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This correctly identifies the physicalist/functionalist commitment of illusionism. They argue that the "qualitative feel" is not an extra ingredient added to the processing; it is the illusion generated *by* the processing.

  **4. "The summary claims illusionists must therefore reject all first-person authority, since if there's no real inner experience then introspection is just confabulating about brain states."**
  *   **Verdict:** **Subtly Wrong / Overstated.**
  *   **Analysis:** This is the most dangerous sentence to quote. Illusionists do not reject *all* first-person authority. They reject **infallibility regarding the nature of experience.** If I say, "I am in pain," the illusionist agrees I am in a pain-state. If I say, "This pain has an intrinsic, ineffable quality," the illusionist says I am mistaken about the *nature* of that state.
  *   **Correction:** They reject first-person authority on *phenomenal character*, not on the occurrence of mental states. Introspection isn't pure confabulation; it's accurate reporting of a misrepresenting state.

  **5. "It also compares the view to saying color is an illusion because we know about wavelengths..."**
  *   **Verdict:** **Accurate Analogy.**
  *   **Analysis:** Illusionists frequently use the "color error theory" analogy. Just as objects don't actually possess "redness" (they reflect wavelengths), brains don't possess "qualia" (they process information). The "red" is in the interaction, not the object; the "feel" is in the reporting, not the state.
  *   **Correction:** This is a fair representation of how illusionists defend their view.

  **6. "...and concludes that illusionism is basically eliminativism with better PR."**
  *   **Verdict:** **Polemical / Mischaracterization.**
  *   **Analysis:** Frankish explicitly distinguishes illusionism from hard eliminativism (like Churchland's view that "beliefs" don't exist). Illusionism is an **error theory**: Beliefs and experiences exist, but they represent themselves falsely. Calling it "eliminativism with better PR" ignores this theoretical distinction and frames it as a marketing choice rather than a metaphysical one.
  *   **Correction:** It is a *form* of eliminativism about qualia, but it retains the ontology of mental states.

  ---

  ### Deep Dive: Your Specific Concerns

  You asked three specific questions that get to the heart of whether this summary is usable.

  #### 1. Is there a meaningful distinction between saying experience is "illusory" vs. "non-existent"?
  **Yes, and the summary collapses it.**
  This is the most critical nuance for your article.
  *   **Non-existent (Hard Eliminativism):** "You think you are in pain, but there is no such thing as pain. You are mistaken that you have a mental state."
  *   **Illusory (Illusionism):** "You are in a pain state, but your brain represents that state to you as having a 'painful quality' that doesn't actually exist. The state is real; the 'quality' is the illusion."
  *   **The Mirror Analogy:** If you see a mirage of water on the road, the *water* is non-existent. But the *visual experience of water* is a real event in your brain. Illusionists say qualia are like the water in the mirage. The forum summary implies illusionists say the visual experience itself doesn't exist.

  #### 2. Does the first-person authority claim actually follow?
  **No, not "all" authority.**
  The forum post argues: *No qualia → Introspection is fake → No first-person authority.*
  The Illusionist argument is: *No qualia → Introspection is a misrepresenting mechanism → First-person authority is limited.*
  We still have authority on *what we seem to experience*, just not on *what the experience actually is*. If a subject says, "It feels like there is a blue qualia," the illusionist says, "It *seems* that way to you (which is true), but there is no blue qualia (which is also true)." The subject is the authority on the *seeming*, not the *being*.

  #### 3. Is "introspective opacity" a standard illusionist move?
  **Yes, it is central to Frankish's specific formulation.**
  Keith Frankish argues that if our introspection were "transparent" (i.e., if we could see the neural firing patterns directly), we wouldn't invent qualia. Because introspection is "opaque" (it hides the physical mechanism), we fill the gap with the concept of "phenomenal feel." This is not borrowed; it is the explanatory engine of his 2016 paper *"Illusionism as a Theory of Consciousness."* Dennett uses similar reasoning (the "Cartesian Theater" is empty because the machinery is hidden), though he uses different terminology.

  ### Recommendation for Your Piece

  **Do not quote the forum post directly as an authoritative summary.** It is too polemical ("better PR") and contains a significant error regarding first-person authority that professional philosophers would flag.

  **Instead, use the post as a foil.**
  You can write something like:
  > "Critics often characterize illusionism as claiming experience is 'literally non-existent,' or dismiss it as 'eliminativism with better PR.' However, proponents like Keith Frankish argue this is a category error. They do not deny the existence of mental states, but rather the existence of the *phenomenal properties* we mistakenly attribute to them."

  **If you need a quotable summary of the view, rely on the primary sources:**
  *   **Keith Frankish:** *"Illusionism is the view that phenomenal consciousness is an introspective illusion."* (From his Stanford Encyclopedia of Philosophy entry on Illusionism).
  *   **Daniel Dennett:** Often frames it as denying the "Cartesian Theater" rather than denying experience itself.

  **Bottom Line:** The forum post gets the *vibe* right but misses the *mechanism*. If you quote it, you risk validating the "strawman" that illusionists tell people their pain isn't real, rather than the more subtle claim that the *painfulness* is a user-interface trick.
