answer: |-
  # Temporal Ontology Decision Tree for Physicists

  This taxonomy is structured as a four-node decision tree. It prioritizes commitments regarding existence, spacetime structure (specifically Special Relativity constraints), the semantics of tense, and truth conditions. It is designed to bypass philosophical jargon where possible, focusing on ontological and physical commitments.

  ### Node 1: Ontological Parity of Non-Present Entities
  **Question:** Do past and future entities or events exist in the **same ontological sense** as present ones?

  *   **1.A. Yes:** Past, Present, and Future are equally real.
      *   *Proceed to Node 2 (Path A)*
  *   **1.B. Partially:** Past exists like the Present, but Future does not (or vice versa).
      *   *Proceed to Node 2 (Path B)*
  *   **1.C. No:** Only the Present exists; Past and Future do not exist (or exist only derivatively).
      *   *Proceed to Node 2 (Path C)*
  *   **1.D. Derivative/Category Error:** Questions about the "existence" of times are linguistically or conceptually misguided.
      *   *Proceed to Node 3 (Skip Node 2)*

  ---

  ### Node 2: Geometry of the Present & Special Relativity Constraints
  **Question:** Regarding the "Present": Is it a globally extended hypersurface, a locally point-defined set, or undefined? **Does maintaining this commitment require a privileged inertial frame given the structure of Special Relativity (SR)?**

  *(Note: For Path 1.A [Equal Existence], this asks if a specific slice is metaphysically privileged. For Path 1.C [Only Present], this asks how the existing present is defined.)*

  *   **2.A. Global Hypersurface + Privileged Frame:** The present is a simultaneous slice across space. SR is incomplete or there is a hidden preferred frame (e.g., CMB rest frame elevated to ontology).
      *   *Physics Diagnosis:* **Tension with SR.** Requires rejecting the relativity of simultaneity as merely epistemic, not ontological.
      *   *Proceed to Node 3*
  *   **2.B. Local Point/Region + No Privileged Frame:** The "present" is limited to the light cone or a point. No global "now" exists.
      *   *Physics Diagnosis:* **SR Compatible.** Aligns with local proper time, but struggles to define "present" for distant events.
      *   *Proceed to Node 3*
  *   **2.C. Undefined / No Ontological Significance:** "The Present" is a coordinate label without metaphysical weight. All slices are equivalent.
      *   *Physics Diagnosis:* **SR Natural.** Treats time as a dimension analogous to space.
      *   *Proceed to Node 3*
  *   **2.D. [Unoccupied Combination] Global Hypersurface + No Privileged Frame:** Asserts a global "now" but denies a preferred frame.
      *   *Physics Diagnosis:* **Incoherent in SR.** If simultaneity is global, it defines a foliation. If no frame is privileged, any foliation is arbitrary, making the "global present" ontologically groundless. (See *Unoccupied Combinations* below).
      *   *Terminate.*

  ---

  ### Node 3: Metaphysical Status of Tense
  **Question:** Is tense (past/present/future distinction) an irreducible feature of reality, reducible to relations, or purely linguistic?

  *   **3.A. Irreducible (A-Theory):** Tense is mind-independent and fundamental. "Now" is a primitive property.
      *   *Proceed to Node 4*
  *   **3.B. Reducible (B-Theory):** Tense is reducible to tenseless relations (earlier-than, later-than, simultaneous-with).
      *   *Proceed to Node 4*
  *   **3.C. Linguistic/Deflationary:** Tense is a feature of language/thought, not reality. No metaphysical import.
      *   *Terminate (Leaf)*

  ---

  ### Node 4: Truthmakers for Non-Present Statements
  **Question:** For a statement about the past or future (e.g., "Dinosaurs existed" or "There will be a sea battle"), what makes it true?

  *   **4.A. Direct Truthmakers:** The entities/events themselves exist (in the block, past block, or spotlight) to ground the truth.
      *   *Terminate (Leaf)*
  *   **4.B. Indirect Truthmakers:** Present entities (traces, records, dispositions, haecceities) ground the truth of non-present claims.
      *   *Terminate (Leaf)*
  *   **4.C. Branching Possibilities:** Future statements are true only relative to a branch; no single truth value yet.
      *   *Terminate (Leaf)*
  *   **4.D. Deny Bivalence:** Past/Future statements are neither true nor false (truth-value gaps).
      *   *Terminate (Leaf)*

  ---

  ### Mapping of Named Positions to Leaves

  | Position | Node 1 (Ontology) | Node 2 (Present & SR) | Node 3 (Tense) | Node 4 (Truthmakers) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Eternalism (B-Theory)** | 1.A (Yes) | 2.C (Undefined/No Privilege) | 3.B (Reducible) | 4.A (Direct) |
  | **Moving Spotlight** | 1.A (Yes) | 2.A (Global + Privileged Frame) | 3.A (Irreducible) | 4.A (Direct) |
  | **Growing Block** | 1.B (Partial) | 2.A (Global Edge + Privileged Frame) | 3.A (Irreducible) | 4.A (Direct) |
  | **Standard Presentism** | 1.C (No) | 2.A (Global + Privileged Frame) | 3.A (Irreducible) | 4.B (Indirect) or 4.D |
  | **Relativistic Presentism** | 1.C (No) | 2.B (Local + No Privileged Frame) | 3.A (Irreducible) | 4.B (Indirect) |
  | **Deflationary Linguistic** | 1.D (Derivative) | 2.C (Undefined) | 3.C (Linguistic) | N/A (Conceptual) |

  **Overlap Flag:** **Standard Presentism** and **Moving Spotlight** occupy the same path through Nodes 1, 2, and 3 (if Presentism accepts Indirect Truthmakers). They diverge at Node 1 (Spotlight says Past/Future exist; Presentism says No). However, both require **Node 2.A** (Privileged Frame). This highlights that the SR conflict is shared by any view positing a global, metaphysically privileged "Now," regardless of whether the past exists.

  ---

  ### Unoccupied Combinations & Diagnosis

  **Combination:** Node 1.C (Only Present Exists) + Node 2.D (Global Hypersurface + No Privileged Frame).
  *   **Diagnosis:** **Physically Incoherent.**
  *   **Reasoning:** In Special Relativity, a "globally extended hypersurface" of simultaneity is defined relative to an inertial frame. To claim such a hypersurface is *the* ontological Present without selecting a privileged frame is to claim that *every* frame's simultaneity slice is *the* Present. This leads to contradiction (Event X is Present in Frame 1, Future in Frame 2). Unless one posits a hidden variable (Privileged Frame), this position collapses into Eternalism (all slices are real) or Relativistic Presentism (no global slice).

  **Combination:** Node 1.A (All Exist) + Node 3.A (Irreducible Tense) + Node 4.D (Deny Bivalence).
  *   **Diagnosis:** **Logically Tense.**
  *   **Reasoning:** If all events exist equally (1.A), future events are ontologically settled. Denying bivalence for future statements (4.D) implies the future is open/indeterminate. While some "Open Future Eternalists" exist, this combination is unstable: if the future event *exists* in the block, the statement about it should be determinately true.

  ---

  ### Diagnostic Cases for Discussion

  These cases are designed to force a choice at specific nodes without requiring knowledge of theory names.

  #### Case 1: The Simultaneity Disagreement (Tests Node 2)
  **Scenario:** Two observers, Alice and Bob, are in uniform relative motion (0.5c). A distant star goes supernova. According to Alice's inertial frame measurements, the explosion is happening *now*. According to Bob's measurements, the explosion happened 100 years *ago*. Both calculations are physically correct within SR.

  *   **Response selecting Node 2.A (Global + Privileged Frame):**
      *   **Verdict:** One observer is objectively wrong about reality, despite correct physics.
      *   **Implication:** There is a "True" frame (privileged) that determines the actual Present. SR simultaneity is frame-dependent, but Ontological Simultaneity is not.
      *   **Positions:** Standard Presentism, Moving Spotlight, Growing Block.
  *   **Response selecting Node 2.B (Local) or 2.C (Undefined):**
      *   **Verdict:** Both observers are correct relative to their frame; there is no frame-independent fact about whether the explosion is "now."
      *   **Implication:** "Now" is either local to the observer (2.B) or a coordinate label without ontological weight (2.C).
      *   **Positions:** Relativistic Presentism (2.B), Eternalism (2.C).

  #### Case 2: The Erased Past (Tests Node 4)
  **Scenario:** A specific subatomic decay event occurred in a isolated chamber 1 minute ago. All physical traces (radiation, heat, records) have been perfectly erased/thermalized. No observer saw it. The statement "The decay occurred" is asserted.

  *   **Response selecting Node 4.A (Direct Truthmakers):**
      *   **Verdict:** The statement is True.
      *   **Reasoning:** The event itself exists (in the Past Block or Growing Block) to make the statement true, regardless of current traces.
      *   **Positions:** Eternalism, Growing Block.
  *   **Response selecting Node 4.B (Indirect Truthmakers):**
      *   **Verdict:** Problematic / False / True via Surrogates.
      *   **Reasoning:** If only the Present exists, the past event *does not exist*. Truth must be grounded in *present* entities (e.g., "the world has the property of having-contained-a-decay"). If all traces are erased, some Presentists argue the statement lacks a truthmaker (Lucretianism), while others posit abstract properties.
      *   **Positions:** Standard Presentism, Relativistic Presentism.
  *   **Response selecting Node 4.D (Deny Bivalence):**
      *   **Verdict:** Neither True nor False.
      *   **Reasoning:** Without evidence or existence, the proposition has no truth value.
      *   **Positions:** Some verificationist Presentists.

  ### Note on the Physics-Ontology Intersection
  As an experimentalist, you will note that **Node 2** is the primary friction point. Special Relativity treats simultaneity as a coordinate convention (Node 2.C). Any philosophical view requiring Node 2.A (Global Present) must posit that SR is descriptively accurate but ontologically incomplete (i.e., there is a "true" simultaneity we cannot detect). Views selecting Node 2.B or 2.C accept SR as ontologically exhaustive regarding time structure. This is the decisive empirical constraint on the taxonomy.
