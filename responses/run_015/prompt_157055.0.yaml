  **4. The Randomization Question**
  You treat $p$ as a mixed strategy available at the node.
  *   *Objection:* Can an agent without memory randomize *at the node*? If I don't know where I am, I can't condition my randomization on "being at intersection 2". I must carry a randomization device (a biased coin).
  *   *Deeper Objection:* Is the mixed strategy a *plan* (ex-ante) or a *propensity* (interim)? If it's a plan, the "ought" is ex-ante. If it's a propensity, the "ought" is interim. If the agent forgets the plan, can they reconstruct the propensity? Only if the propensity is uniquely determined by rationality. But if rationality is underdetermined (as you suspect), the propensity is arbitrary.

  **5. The Core Tension: Fragmented Agency**
  *   *Argument for Determinacy:* Rationality is instrumental. The only perspective that encompasses all instrumental goals is the Ex-Ante perspective. The Interim perspective is locally myopic. Therefore, Ex-Ante optimization is the *only* coherent definition of rationality here. The fact of the matter is fixed by the definition of agency.
  *   *Argument for Underdetermination:* The "Ex-Ante Self" ceases to exist at the intersection. The "Interim Self" is the one acting. To say the Interim Self "ought" to do something that contradicts its own local expected utility (if SSA were used, for instance) is to impose an external authority, not describe rationality. If the theory requires us to ignore the agent's current epistemic state to determine what they should do, the concept of "rational requirement" has fractured.

