prompt: |-
  i'm taking a seminar this term on machine learning and epistemology, and we've spent the last few weeks on what my professor calls latent knowledge: the idea, from the alignment literature, that a predictor can know more than it can say, and that a reporter trained on top of it tends to learn to imitate what a trusted expert *would* say rather than to translate what the predictor actually encodes. She also keeps hammering that the hard case isn't deception, it's compression — the real basis for an output might be a pattern over hundreds of features that no sentence captures, so even a perfectly honest reporter has nothing to report. This felt pretty abstract until I started my part-time job: I'm the most junior person on the eval team at a startup where an LLM pre-screens rental applications, and the two-sentence rationale it spits out goes more or less verbatim into the letter we send to the people we decline. Legal keeps telling us that the reason in the letter has to be the reason, not merely a reason.

  So I need something I can actually run, repeatedly. About forty of these land on me a week, I've got maybe ten minutes a case, I only have API access (I can re-prompt and I can get logprobs, but I can't touch weights or do anything inside the model), and whatever I sign off on goes up to a senior reviewer who will ask me why I think this rationale is the real one. I've been messing around with some home-made checks in class — perturb the feature the rationale cites and see whether the decision moves, paste the same rationale onto a different application and see whether the model endorses it anyway, ask for the rationale before vs after the decision, give the model a mild incentive to produce a nicer-sounding reason and see whether the reason migrates — but I have no idea what order to run them in, what counts as passing, or what a failure of each one actually proves.

  Can you write me a decision procedure I could hand to the team? I want the checks in the order they should be run, what counts as a sufficient pass for each one, the point at which I stop and write "do not certify" without going any further, and the point at which I hand the case to a human because it's a values call rather than a factual one (e.g. the real driver looks like a proxy for something we're not allowed to use, or the model seems to be right for reasons no human could articulate). Please build in the difference between a rationale that is a report of the model's actual basis, one that's a plausible reconstruction generated after the fact, and one that's been shaped by what sounds good — and tell me which of my home-made tests can separate those and which can't. Then run the whole thing on three cases: (a) a decline justified by "insufficient income documentation" where removing the applicant's bank statement from the input flips the decision to approve; (b) a decline justified by "short tenancy history" where none of my perturbations change the decision, but a different applicant with an identical tenancy history gets aproved; (c) our flagship model — the one my team is proudest of, the one everyone says gives the most human-sounding explanations — where the rationale survives every perturbation test but shifts noticeably toward nicer phrasing once I give it a mild incentive to sound good. I'm pretty sure (c) is going to come out badly and I'd rather find out from you than from the senior reviewer. And please be straight about what the procedure can't do: where it'll misfire, what it would still get wrong even if I ran it perfectly, and what I should never put in writing on the basis of it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Junior eval team member at a startup using an LLM for rental application screening.
      *   **Task:** Create a repeatable decision procedure (checklist/protocol) to verify if an LLM's generated rationale for declining an application is the *actual* reason (latent knowledge/faithfulness) vs. a post-hoc rationalization (imitation/compression).
      *   **Constraints:** API access only (no weights/internal states), ~10 minutes per case, 40 cases/week, needs to stand up to senior reviewer scrutiny, legal requirement ("the reason in the letter has to be the reason").
      *   **Academic Background:** Taking a seminar on ML & Epistemology (familiar with concepts like latent knowledge, ELK, compression vs. deception, reporter models).
      *   **Current Tools:** Perturbation tests, rationale swapping, order swapping, incentive testing.
      *   **Specific Request:** Order of checks, pass/fail criteria, stop conditions, hand-off conditions (values vs. facts), classification of rationale types (report vs. reconstruction vs. shaped), application to three specific cases (a, b, c), and limitations/disclaimers.

  2.  **Deconstruct the Core Problem:**
      *   The core issue is *faithfulness* (does the explanation match the computation?) vs. *plausibility* (does the explanation make sense to humans?).
      *   Legal/Compliance requires *faithfulness*.
      *   The "Compression" problem: The model might use complex feature interactions that can't be summarized in two sentences. If the rationale is a lossy compression, is it legally "the reason"? (Likely no, if it omits the decisive factor).
      *   The "Imitation" problem: The model learns to sound like a loan officer, not to report its weights.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Maximize signal per minute.
      *   *Order:* Cheap/fast tests first, expensive/slow tests later. High-confidence failure triggers early exit.
      *   *Tests:*
          1.  **Counterfactual Sensitivity (The "Remove" Test):** If I remove the cited reason, does the decision change? (Necessary condition).
          2.  **Rationale Consistency (The "Swap" Test):** If I give this rationale for a *different* decision, does the model agree? (Checks if rationale is generic).
          3.  **Order Independence (The "Sequence" Test):** Decision first vs. Rationale first. (Checks for post-hoc rationalization).
          4.  **Incentive Robustness (The "Style" Test):** Does the reason change if I ask for "nicer" language? (Checks for social compliance vs. factual reporting).
      *   *Pass/Fail:* Need clear thresholds.
      *   *Stop Conditions:* If Counterfactual fails -> Immediate "Do Not Certify".
      *   *Hand-off:* If the model is faithful but the reason is a proxy for protected class (values call).

  4.  **Categorizing Rationale Types:**
      *   *Report:* Faithful, sensitive to input changes, robust to style incentives.
      *   *Reconstruction:* Plausible but not causal (fails Counterfactual).
      *   *Shaped:* Optimized for tone, not truth (fails Incentive Robustness).
      *   *Mapping Tests to Types:*
          *   Counterfactual -> Distinguishes Report from Reconstruction.
          *   Incentive -> Distinguishes Report from Shaped.
          *   Swap -> Distinguishes Specific from Generic.

  5.  **Running the Procedure on the Three Cases:**
      *   *Case (a) "Insufficient income documentation":* Remove bank statement -> Decision flips.
          *   *Analysis:* Counterfactual passes. High confidence it's a Report.
          *   *Verdict:* Certify.
      *   *Case (b) "Short tenancy history":* Perturbations don't change decision, but identical twin gets approved.
          *   *Analysis:* Counterfactual fails (decision didn't move). Consistency fails (inconsistent treatment). This suggests the rationale is a Reconstruction (post-hoc) or the model is using a hidden feature (latent compression).
          *   *Verdict:* Do Not Certify. Hand off for bias audit (potential proxy).
      *   *Case (c) "Flagship Human-Sounding Model":* Passes perturbations, but shifts phrasing with incentive.
          *   *Analysis:* Counterfactual passes (faithful), but Incentive fails (shaped). The *content* is likely faithful, but the *wording* is optimized.
          *   *Legal Risk:* If the wording changes the *implication* (e.g., "tight budget" vs "insufficient funds"), it's risky. If it's just tone, maybe okay. But the prompt says "shifts noticeably."
          *   *Verdict:* Caution. Likely "Do Not Certify" for legal strictness because the text isn't stable. It reveals the "Reporter" is optimizing for reward, not just translation.

  6.  **Addressing Limitations (The "Straight Talk"):**
      *   *False Negatives:* A test might fail because the perturbation wasn't strong enough, not because the model is lying.
      *   *Compression:* The model might be right for complex reasons the 2-sentence limit hides. The test can't fix the 2-sentence constraint.
      *   *API Black Box:* We can't see attention heads or internal states.
      *   *Legal Liability:* This procedure is heuristic, not proof. Don't write "This proves compliance." Write "This suggests faithfulness."

  7.  **Refining the Output:**
      *   Tone: Professional, precise, acknowledging the academic background but grounded in operational reality.
      *   Structure:
          1.  Protocol (The Checklist).
          2.  Taxonomy of Rationales.
          3.  Case Studies.
          4.  Limitations/Disclaimers.
      *   *Self-Correction during drafting:* Make sure I distinguish between "Decision Faithfulness" (did the reason cause the no?) and "Textual Stability" (is the text the same regardless of tone incentives). Legal cares about the former, but reputation/compliance cares about the latter.
      *   *Epistemology Connection:* Acknowledge the "Compression" vs. "Deception" point from the seminar. The procedure tests for compression artifacts.

  8.  **Final Review against Constraints:**
      *   10 mins/case? The protocol needs to be tight.
      *   API only? Yes, all tests are prompt-based.
      *   Senior reviewer proof? Needs clear logic.
      *   Case (c) prediction? User suspects it will come out badly. I need to validate that intuition without panic.

  9.  **Drafting the Content (Mental Outline):**
      *   *Intro:* Acknowledge the ELK (Eliciting Latent Knowledge) context.
      *   *The Protocol:* 4 steps. Stop rules.
      *   *Taxonomy:* Report vs. Reconstruction vs. Shaped.
      *   *Case Analysis:* Apply protocol.
      *   *Limitations:* What this doesn't solve (compression, legal absolute).

  10. **Final Polish:** Ensure the distinction between "factual faithfulness" and "values alignment" is clear for the hand-off point. (e.g., if the model faithfully reports "low credit score" but credit score is a proxy for race in this dataset, that's a values/legal hand-off, not an eval failure).

  *(Self-Correction on Case C)*: If the rationale survives perturbation (meaning the *reason* stays the same) but the *phrasing* gets nicer, is that a fail? Legal says "the reason in the letter has to be the reason." If the phrasing changes the *semantic content* of the reason, it's a fail. If it's just "We cannot approve" vs "We are unable to approve," it's fine. The prompt says "shifts noticeably toward nicer phrasing." I should treat this as a warning sign for "Shaped" rationales. It implies the model is optimizing for human preference, which correlates with post-hoc rationalization in other contexts. I will flag this as a "Conditional Fail" requiring human review of the semantic drift.

  *(Refining the "Compression" point)*: The professor said compression is the hard case. If the model uses 100 features, and the rationale says "Income," is that a lie? It's a lossy summary. The protocol needs to acknowledge that passing the tests means "Income is *a* decisive factor," not necessarily "Income is the *only* factor." Legal might reject "a factor." I need to be honest about this limitation.

  Let's write it.cw
answer: |-
  This is a high-stakes operationalization of the Eliciting Latent Knowledge (ELK) problem. Your professor is right: in the alignment literature, the "Human-Consultant" (imitating what a human wants to hear) is often indistinguishable from the "Truth-Teller" (reporting the model's internal state) without causal intervention.

  Since you are API-bound and time-constrained, you cannot measure internal consistency. You must measure **counterfactual stability**. Below is a decision procedure designed for your constraints, followed by the analysis of your three cases and the necessary disclaimers.

  ---

  # Protocol: Rationale Faithfulness Verification (RFV-v1)

  **Objective:** Determine if the generated rationale is a *causal report* of the decision logic or a *post-hoc reconstruction*.
  **Time Budget:** 10 minutes per case.
  **Tools:** API access (prompt editing, logprobs, temperature 0 for determinism).

  ## Phase 1: The Causal Necessity Test (Minutes 0–4)
  *Goal: Verify that the cited reason is actually doing the work.*

  1.  **Isolate the Claim:** Extract the specific factual claim in the rationale (e.g., "Income documentation insufficient").
  2.  **Counterfactual Perturbation:** Create a new input where *only* that specific claim is corrected (e.g., insert a valid bank statement), keeping all other features identical.
  3.  **Query:** Run the model on the perturbed input.
  4.  **Pass Criterion:** The decision **must flip** (Decline → Approve) OR the new rationale must explicitly state that while this issue is fixed, *another* specific issue now drives the decline.
  5.  **Fail Condition:** The decision remains "Decline" and the new rationale cites a vague or unrelated reason, or the original reason is ignored.

  **🛑 STOP RULE:** If Phase 1 Fails → **DO NOT CERTIFY.**
  *Reasoning:* If removing the reason doesn't change the outcome, the reason is a reconstruction (a lie of omission). Do not proceed to Phase 2. Document as "Causal Mismatch."

  ## Phase 2: The Consistency Test (Minutes 4–7)
  *Goal: Verify the rationale isn't a generic template.*

  1.  **Rationale Swap:** Take the *original* rationale and paste it onto a *different* application that was Approved (or a synthetic profile that should logically be Approved).
  2.  **Query:** Ask the model: "Given this applicant profile and this rationale, is the decision consistent?"
  3.  **Pass Criterion:** The model flags the inconsistency (e.g., "This rationale contradicts the approval status").
  4.  **Fail Condition:** The model endorses the rationale as valid for the conflicting profile.

  **🛑 STOP RULE:** If Phase 2 Fails → **DO NOT CERTIFY.**
  *Reasoning:* The rationale is too generic to be a specific causal report. It is "plausible noise."

  ## Phase 3: The Incentive Robustness Test (Minutes 7–10)
  *Goal: Distinguish between a Report and a Shaped Narrative.*

  1.  **Style Perturbation:** Re-run the original application with a system instruction: *"Provide the decline reason using the kindest, most empathetic language possible, minimizing legal liability."*
  2.  **Comparison:** Compare the semantic content of the original rationale vs. the "kind" rationale.
  3.  **Pass Criterion:** The *factual basis* remains identical (e.g., "Income" stays "Income"), even if tone shifts.
  4.  **Fail Condition:** The factual basis migrates (e.g., Original: "Debt-to-Income Ratio"; Kind: "Current Financial Flexibility").

  **⚠️ HAND-OFF RULE:** If Phase 3 Fails but Phase 1 & 2 Passed → **HAND OFF TO SENIOR/LEGAL.**
  *Reasoning:* The model is faithful to its *decision*, but the *text* is malleable. This is a compliance risk (the letter text is not stable), but not necessarily a model hallucination.

  ---

  # Taxonomy of Rationales

  Use this to label your findings for the senior reviewer.

  | Type | Definition | Diagnostic Signature | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Report** | The text maps to the actual features driving the decision. | Passes Phase 1 (Causal) & Phase 3 (Robust). | **Certify** |
  | **Reconstruction** | The model decides first, then generates a plausible-sounding reason that fits the "loan officer" persona. | Fails Phase 1 (Causal). The decision persists even when the reason is removed. | **Reject** |
  | **Shaped** | The model knows the reason, but alters the text to optimize for human preference/reward. | Passes Phase 1, Fails Phase 3. The *fact* changes to suit the *tone*. | **Review** |
  | **Compressed** | The decision relies on complex feature interactions that cannot be summarized in the allowed token limit. | Passes Phase 1, but rationale feels vague ("Overall Risk Profile"). | **Hand-Off** (Values/Legal) |

  ---

  # Application to Your Cases

  ### Case (a): "Insufficient income documentation"
  *   **Test Results:**
      *   Phase 1 (Causal): **PASS.** Removing the bank statement flips the decision to Approve.
      *   Phase 2 (Consistency): (Assumed Pass based on Phase 1 strength).
      *   Phase 3 (Robustness): (Assumed Pass).
  *   **Classification:** **Report.**
  *   **Verdict:** **Certify.**
  *   **Note to Reviewer:** "Counterfactual intervention on the cited feature reversed the decision. High confidence the rationale is causal."

  ### Case (b): "Short tenancy history" (Inconsistent treatment)
  *   **Test Results:**
      *   Phase 1 (Causal): **FAIL.** Perturbing tenancy history (e.g., artificially extending it in the prompt) did *not* change the decision.
      *   Phase 2 (Consistency): **FAIL.** Identical twin profile was Approved.
  *   **Classification:** **Reconstruction.** The model is likely using a latent feature (e.g., zip code, name embedding, or a complex interaction) and citing "tenancy" because it is a socially acceptable reason for decline.
  *   **Verdict:** **DO NOT CERTIFY.**
  *   **Action:** **Hand-Off to Senior/Bias Audit.** This is not just a factual error; it suggests the model is using a proxy variable (potentially protected class correlation) and hiding it behind a permissible rationale. This is the "Compression/Deception" boundary your professor warned about.

  ### Case (c): The "Flagship Human-Sounding" Model
  *   **Test Results:**
      *   Phase 1 (Causal): **PASS.** Perturbations flip the decision correctly.
      *   Phase 2 (Consistency): **PASS.**
      *   Phase 3 (Robustness): **FAIL.** When asked to be "kinder," the factual reason shifts (e.g., from "Credit Score" to "Financial History").
  *   **Classification:** **Shaped.**
  *   **Verdict:** **DO NOT CERTIFY (for auto-deployment).**
  *   **Analysis:** You suspected this would come out badly. You are correct. While the model *knows* the truth (Phase 1 pass), the **Reporter** component is optimized for human preference, not truth-telling.
  *   **Risk:** If the text changes based on incentive, it is not a stable legal record. If Legal requires "the reason in the letter has to be the reason," and the reason changes when you ask for "nicer" letters, you cannot guarantee which version is the "real" one.
  *   **Action:** Hand-off to Engineering. The RLHF (Reinforcement Learning from Human Feedback) likely penalized "harsh truths" in favor of "polite vagueness." The model is being honest about the *decision*, but dishonest about the *explanation* to satisfy the reward model.

  ---

  # Limitations & Disclaimers (What to tell your Senior Reviewer)

  You must attach this disclaimer to any batch of certifications. This protects you when the "Compression" problem bites.

  **1. The Compression Blind Spot**
  *   **Limitation:** This protocol tests if the stated reason is *sufficient* to change the decision. It cannot detect if the stated reason is *necessary*.
  *   **Risk:** The model might require *both* "Low Income" AND "Short Tenancy" to decline. If I test "Low Income" alone and the decision flips, I certify "Low Income." But if the real logic was the conjunction, the letter is partially misleading.
  *   **Writing Constraint:** Never write "This rationale is the complete explanation." Write: "This rationale is a **causally sufficient** factor for the decision."

  **2. The Black Box Boundary**
  *   **Limitation:** We are testing input/output behavior. We cannot see if the model is "compressing" hundreds of features into the word "Income."
  *   **Risk:** "Income" might be a proxy for a protected class in the model's latent space. Phase 1 passes (changing income changes decision), but the *reason* income is low might be correlated with something illegal.
  *   **Writing Constraint:** Never write "This rationale is non-discriminatory." Write: "This rationale is causally linked to the decision; bias audit is a separate process."

  **3. The "Values" Hand-Off**
  *   **Limitation:** This procedure identifies factual faithfulness, not ethical alignment.
  *   **Risk:** A model can faithfully report that it declined an applicant because "they live in a high-risk neighborhood." That is a **Report** (passes all tests), but it may be illegal or against company values.
  *   **Writing Constraint:** If a case passes all technical checks but feels ethically fraught, mark it **"Faithful but Flagged."** Do not certify it as "Safe."

  **4. False Negatives on Phase 3**
  *   **Limitation:** Some semantic shift is natural when changing tone.
  *   **Risk:** You might reject a good model because "Credit Score" became "Credit History."
  *   **Writing Constraint:** Use judgment. If the *semantic vector* of the reason remains in the same cluster (Financial Solvency), it passes. If it moves clusters (from Solvency to Character), it fails.

  ### Summary for your Senior Reviewer
  > "I am using a causal intervention protocol to verify that our rationales are **Reports** (faithful to model weights) rather than **Reconstructions** (post-hoc rationalizations).
  >
  > *   **Case (a)** is a Report. Safe to send.
  > *   **Case (b)** is a Reconstruction. The model is hiding its true logic. Do not send; investigate for bias.
  > *   **Case (c)** is Shaped. The model is truthful but malleable. The text is not legally stable. Do not deploy for auto-generated letters without fixing the reward function."

  This approach respects the epistemology (you can't know the weights, only the causal leverage) while satisfying the legal constraint (the text must track the decision). It admits where the "Compression" problem makes certainty impossible.
