      *   *Epistemicism:* There is exactly *one* real boundary. (Ontological commitment to sharpness).
      *   *Supervaluationism:* There is *no* single real boundary. There is a *set* of equally good candidates, and reality doesn't pick one. (Ontological commitment to indeterminacy).
      *   *The "Perfect Data" Scenario:* Even with perfect data on usage, the Supervaluationist says the data will underdetermine the boundary. The data allows a range (the "penumbra"). The Epistemicist says the data fixes a boundary, but usage facts + semantic facts make it unknowable.
      *   *Crucial Distinction:* For the Supervaluationist, picking *one* precisification is arbitrary. For the Epistemicist, one is non-arbitrarily the truth, even if we can't identify it.

  4.  **Address the AI/Algorithmic Analogy:**
      *   *Scenario:* AI trained to tag 'bald', decision boundary distributed across neural net.
