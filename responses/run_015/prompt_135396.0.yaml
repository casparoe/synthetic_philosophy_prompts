          *   *Ontology:* Classical logic holds. Bivalence holds (every statement is True or False). There *is* a sharp boundary (e.g., $n$ hairs = bald, $n+1$ = not bald).
          *   *Epistemology:* We cannot *know* where the boundary is. It is unknowable in principle due to the nature of meaning and usage (margin for error principles).
          *   *Key Point:* The boundary exists independently of our ability to pinpoint it. It's a fact about the world/language.
      *   **Supervaluationism (e.g., Kit Fine):**
          *   *Ontology:* Classical logic does *not* fully hold (bivalence fails for borderline cases). There is *no* single sharp boundary in reality.
          *   *Mechanism:* Truth is defined as "supertruth" (true on all admissible precisifications). Falsity is "superfalsity" (false on all admissible precisifications). Borderline cases are true on some, false on others.
          *   *Key Point:* The "multiple cutoffs" aren't just hidden options; they represent the *absence* of a fact of the matter. It's not that one is the "real" one and we don't know which; it's that *none* of them are uniquely the real one.

  3.  **Address the User's Core Confusion (The "Location Problem"):**
