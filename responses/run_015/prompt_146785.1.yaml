  Reconstruct how Augustine of Hippo would likely adjudicate the modern presentism–eternalism dispute if he were confronted with its current form: specifically, the eternalist claim that special relativity eliminates any global present through frame-dependent simultaneity, and the presentist counter-strategies that either invoke a hidden privileged frame or relocate temporal passage into conscious experience. Would he treat the block-universe picture as a secularized shadow of divine eternity, or defend a created ontological privilege for the now? Assess in particular whether he would accept a neuro-phenomenological version of presentism—one that grounds the present in the dynamics of perception rather than in physical simultaneity—as a legitimate extension of his own account of time as the distension of the soul, or reject it as collapsing the distinction between Creator and creature. Lead with your bottom line in the first sentence, then develop the reasoning, with no preamble and no restatement of the question. Do not provide citations, a bibliography, or a reading list; work entirely from conceptual reconstruction.
