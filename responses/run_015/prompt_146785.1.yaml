  2.  **Deconstruct Augustine's View on Time:**
      *   *Confessions* Book XI is the primary source.
      *   Key concept: *distentio animi* (distension of the soul).
      *   Time is not "out there" in the movement of bodies (celestial or otherwise) but is an internal measure of the mind.
      *   Past exists only as memory, future only as expectation, present only as attention.
      *   God's eternity is not endless time but a timeless *nunc stans* (standing now) where all is simultaneously present.
      *   Creation is *ex nihilo*, implying a beginning of time itself, not just in time.
      *   Human time is mutable, fragmented, and stretched; Divine eternity is immutable, unified, and whole.

