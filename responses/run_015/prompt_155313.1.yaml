answer: |-
  # JOINT ADVERSARIAL COLLABORATION STATEMENT
  **Subject:** The Status of Old Evidence in Bayesian Epistemology
  **Parties:** Student A (Proponent of Explanatory Retrofitting) & Student B (Proponent of Strict Conditionalization)
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS
  *We jointly affirm the following formal and historical premises as the baseline for our disagreement.*

  1.  **Formal Setup:** We operate within a standard Bayesian framework where agents hold credence functions $P$ mapping propositions to $[0,1]$. Belief revision is primarily modeled via Conditionalization: $P_{new}(H) = P_{old}(H | E)$.
  2.  **Definition of Old Evidence:** Evidence $E$ counts as "old" relative to theory $T$ if, at the time $T$ is seriously proposed for consideration, the agent's credence in $E$ is already maximal or near-maximal ($P(E) \approx 1$).
  3.  **The Mercury Case:** The precession of Mercury's perihelion ($E_{Merc}$) was known with high confidence prior to the formulation of General Relativity ($T_{GR}$). $T_{GR}$ was subsequently shown to entail $E_{Merc}$.
  4.  **Generality:** While $E_{Merc}/T_{GR}$ is the paradigmatic case, the problem applies to any scenario where a new theoretical structure is validated primarily by its ability to systematize previously unexplained but known data (e.g., the Balmer series and Bohr's model).
  5.  **The Phenomenon to be Explained:** It is an uncontroversial historical and sociological fact that scientists treat the successful entailment of old evidence by a new theory as a significant epistemic "win" for that theory, often increasing their willingness to bet on, publish, or build upon $T$.
  6.  **The Formal Tension:** We agree that under strict logical omniscience and standard conditionalization, if $P(E) = 1$, then $P(T | E) = P(T)$. Therefore, standard updating on $E$ cannot mathematically increase credence in $T$.

  ## 2. DISAGREEMENTS TABLE
  *We disagree on the interpretation of the epistemic mechanism driving the "win" described in Claim 5.*

  | Feature | Student A (Explanatory Retrofitting) | Student B (Logical Discovery/Consistency) |
  | :--- | :--- | :--- |
  | **Core Mechanism** | Learning the **entailment relation** ($T \vdash E$) is a distinct epistemic event that warrants a non-conditional credence shift in $T$, even if $E$ was certain. | Learning the **entailment relation** is a logical discovery, not an empirical update. It reveals $T$ was *always* consistent with $E$, but does not trigger belief revision via updating. |
  | **Status of P(E)** | The certainty of $E$ is irrelevant to the confirmatory power of the *connection*. The value comes from the structural fit, which we call **Explanatory Retrofitting**. | The certainty of $E$ is decisive. If $P(E)=1$, $E$ is part of the background. $T$ is merely being checked for consistency with the background. |
  | **Nature of the Shift** | The increase in $P(T)$ is **confirmation**. It is a rational response to new information (the logical link) that standard conditionalization on $E$ fails to capture. | The increase in $P(T)$ is **prior adjustment** or **pragmatic acceptance**. It is "sloppy language" to call it confirmation; it is relief that $T$ is not falsified by known data. |
  | **Ideal Agent** | An ideal agent who knows all logical truths instantly would *not* have this problem, but real agents gain epistemic value from discovering logical links. | An ideal agent would have assigned $P(T)$ correctly from the start based on its logical relations. The "shift" is just correcting a mistake in prior assignment. |

  ## 3. CRUXES
  *We identify the following two points as the decisive factors that will resolve our disagreement.*

  **Crux A: The Trigger for Revision**
  Can belief revision (a change in $P(T)$) be triggered purely by learning a logical/structural relation between $T$ and background knowledge, without any new empirical input?
  *   **Student A:** Yes. Learning $T \vdash E$ provides new *information* to a non-omniscient agent that rationally compels a probability shift.
  *   **Student B:** No. Learning logical relations corrects the agent's coherence but does not constitute "updating" in the Bayesian sense. It is a repair of the prior, not a response to evidence.

  **Crux B: The Explanatory Relation**
  Is there a confirmatory virtue in "non-ad-hoc entailment" that exists over and above the likelihood ratio $P(E|T)$?
  *   **Student A:** Yes. "Explanatory Retrofitting" adds weight to $T$ that is not captured merely by $P(E|T)=1$. A theory that *predicts* $E$ (even retroactively) is superior to one that merely *accommodates* $E$ via parameter tuning.
  *   **Student B:** No. The superiority is fully captured by priors $P(T)$. A theory that accommodates $E$ via tuning has a lower prior due to complexity. No special "explanatory confirmation" relation is needed.

  ## 4. CONCRETE CASES & PREDICTIONS
  *For each Crux, we specify a test case and commit to a specific prediction regarding credence assignments.*

  ### Case for Crux A: The Equivalence Discovery
  **Scenario:** An agent assigns credences to two distinct physical hypotheses, $H_1$ and $H_2$. Both are empirically adequate regarding known data $D$. At $t_1$, a mathematical proof is published demonstrating that $H_1$ and $H_2$ are logically equivalent descriptions of the same state of affairs ($H_1 \leftrightarrow H_2$). No new empirical data $D_{new}$ is introduced.
  **Question:** Should the agent's credence in the unified hypothesis space shift solely due to the proof?

  *   **Student A Prediction:** **Yes.** Upon learning $H_1 \leftrightarrow H_2$, the agent must redistribute credence mass. Specifically, $P(H_1)$ and $P(H_2)$ should converge immediately. If $P(H_1) \neq P(H_2)$ prior to the proof, the proof forces a revision to resolve the incoherence, and this revision is driven by the logical discovery, not empirical data.
  *   **Student B Prediction:** **No (with caveat).** If the agent is coherent, $P(H_1)$ *should have already equaled* $P(H_2)$ because they are the same proposition. If they differed, the agent was incoherent. Correcting the incoherence is not "updating" or "confirmation"; it is fixing a calculation error. There is no *rational shift* triggered by the proof, only a *correction* to what was already rationally required.

  ### Case for Crux B: GR vs. Patched Newton
  **Scenario:** Compare $T_{GR}$ (entails $E_{Merc}$ naturally) vs. $T_{Patch}$ (Newtonian mechanics + specific ad-hoc force term $\epsilon$ tuned exactly to fit $E_{Merc}$). Both yield $P(E_{Merc} | T) = 1$.
  **Question:** Does the "natural entailment" of GR provide confirmatory weight beyond the prior penalty for $\epsilon$?

  *   **Student A Prediction:** **Yes.** Even if we stipulate that $P(T_{GR}) = P(T_{Patch})$ initially (controlling for simplicity priors), $T_{GR}$ should receive a higher posterior boost after $E_{Merc}$ is "processed" via Explanatory Retrofitting. The relation $T_{GR} \vdash E_{Merc}$ carries more weight than $T_{Patch} + \epsilon \vdash E_{Merc}$.
  *   **Student B Prediction:** **No.** If $P(T_{GR}) = P(T_{Patch})$ and $P(E_{Merc} | T_{GR}) = P(E_{Merc} | T_{Patch}) = 1$, then the posteriors **must** be identical. If scientists prefer GR, it is *only* because in reality $P(T_{GR}) > P(T_{Patch})$ due to the complexity cost of $\epsilon$. There is no extra boost from the "style" of entailment.

  ## 5. VERBAL VS. SUBSTANTIVE FLAGGING
  *We acknowledge the following areas where our disagreement may be terminological rather than factual.*

  1.  **Definition of "Confirmation":**
      *   *Risk:* Student A may be using "confirmation" to mean "rational increase in acceptability," while Student B uses it strictly to mean "increase in probability via conditionalization on empirical evidence."
      *   *Resolution:* We agree that if Student B admits the agent's *acceptability* of $T$ rationally increases upon learning the entailment, the substantive gap narrows, even if B refuses to label it "Bayesian confirmation."

  2.  **Ideal vs. Bounded Agents:**
      *   *Risk:* Student B's position relies on an ideal agent model (logical omniscience), while Student A's relies on a bounded agent model.
      *   *Resolution:* We must agree on whether Bayesian Epistemology is normative for *real* scientists (bounded) or *ideal* reasoners (omniscient). If the former, A's "Explanatory Retrofitting" is a necessary patch. If the latter, B's "Logical Discovery" holds, but the theory loses contact with actual scientific practice.

  3.  **The Status of Logical Propositions:**
      *   *Risk:* We may disagree on whether "$T \vdash E$" counts as a proposition that can be conditioned upon.
      *   *Resolution:* If Student B agrees that one can condition on the proposition "It is true that T entails E" (where that proposition itself was uncertain), B's view may collapse into A's. If B maintains that logical truths cannot have probabilities $<1$, the split is fundamental.

  ***

  **Signed,**

  _________________________ (Student A)

  _________________________ (Student B)
