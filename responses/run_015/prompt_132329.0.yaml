prompt: |-
  Specify the full set of desiderata that any adequate theory of translating the "ton beau de Marot" — the particular graceful, balanced, and musically light quality characteristic of Clément Marot's verse — must meet when rendering it into modern English under formal constraint. The theory must determine which formal properties (meter, rhyme scheme, caesura placement, syllable count, lexical register) are essential carriers of the tone and which are negotiable accommodations to English morphology and phonology. For each requirement, provide the motivating case or consideration behind it, and distinguish non-negotiable adequacy conditions from camp-specific preferences.

  Your list must cover: (1) macro-formal fidelity — what line-level structures must survive translation and why; (2) micro-formal or phonotactic fidelity — including the contested claim that preserving the "ton beau" requires maintaining the source's vocalic architecture (the ratio of open to closed vowels, the distribution of liquid consonants, and the avoidance of successive stressed syllables) rather than only its meter, with the argument for and against treating this as a genuine desideratum; (3) semantic, pragmatic, and register fidelity — what must be retained regarding courtly address, irony, and historical diction without anachronistic leakage; (4) consistency with structural differences between sixteenth-century French and modern English (syllable stress patterns, rhyme density, word-order flexibility); and (5) the distinction between formal preservation and tonal preservation, including whether the two can come apart and what that divergence implies for evaluating a translation.

  Identify any pairs of desiderata that are jointly unsatisfiable given these linguistic divergences — for example, whether strict decasyllabic fidelity and natural English syntax can coexist without distortion — and state whether such tension invalidates the theory or merely establishes a hierarchy of preservation. Then briefly assess how literalist, functionalist, formalist, and "tonal-preservationist" approaches fare against the list, but keep the primary weight on articulating the criteria themselves rather than on scoring the contenders.

  Write the response in American English. Do not include bibliographies, reading lists, or citations.
