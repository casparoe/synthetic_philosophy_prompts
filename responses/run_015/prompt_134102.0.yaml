  Mapping
  In the race, runners are heirs; the gun is labor-market entry; the head start is inherited capital; lanes are career sectors; rules are market regulations; the referee is the state; the baton is family assets; the prize is lifetime income. In the scoreboard, players are economic agents; the game is capital accumulation; scorekeeping is asset valuation; a handed share is equity ownership; rules are institutional constraints; the referee is regulatory bodies subject to capture; the prize is political influence. The race assumes a fixed course; the scoreboard assumes the course is drawable by the players. The race prizes crossing a line; the scoreboard prizes holding the pen. The race implies a single finish; the scoreboard implies continuous play. The race isolates the start; the scoreboard integrates ownership into the process.

  Where the race mapping holds
  The race captures the temporal sequence of intergenerational transfer: resources accumulate before the heir enters the field. It identifies that initial endowments compound, affecting final standing in competitive markets. It reflects moral distress regarding unearned advantage in a system purportedly rewarding effort. Where labor markets function competitively, inherited capital acts as a friction-reducing buffer, allowing heirs to take risks or endure unpaid internships that exclude poorer competitors. Thus, for narrow questions of occupational mobility within fixed industries, the head-start intuition tracks reality. It illustrates the cumulative advantage of compound interest over a working life.

  Disanalogies
  Cosmetic disanalogies include the fact that races end while economies continue, and that races have one finish line whereas economies offer multiple goods. These do not alter the tax case. Load-bearing disanalogies do. First, the race assumes fixed rules, but large wealth buys rule-making power through lobbying and zoning. If heirs change the track, equalizing the start is futile; this matters because it shifts the tax justification from fairness to anti-oligarchy, requiring higher rates to dilute influence. It implies taxation must target power concentration, not just wealth. Second, the race implies a single metric of success, but wealth converts across domains like health, education, and justice. Taxing cash inheritances may not equalize real opportunity if conversion rates differ; this matters because it suggests narrow estate taxes miss the point, demanding broader wealth taxes. Third, races reward effort post-start, but markets reward luck and rent-seeking. If outcomes aren't meritocratic, equalizing starts doesn't ensure just endings. This matters because it undermines the meritocratic defense of remaining inequality, suggesting that even with equal starts, large accumulations remain illegitimate. Furthermore, network effects mean success breeds success independently of effort. Finally, in a race, runners cannot collide; in economies, wealth allows blocking competitors via barriers to entry. This matters because it justifies taxation as preventing harm, not just redistributing luck, implying a need for structural regulation alongside taxation. The race assumes independent motion; the economy allows strategic obstruction.

  What the picture imports
  The race image silently imports a commitment to meritocracy: it assumes that aside from the start, the race is fair. It presumes justice is procedural (fair start) rather than substantive (fair outcomes). It locates injustice at a single temporal moment (entry), ignoring structural accumulation during the race. It assumes individuals are atomized competitors rather than members of dynastic clusters. Finally, it implies that market outcomes track effort closely enough that removing unearned advantages restores legitimacy to the resulting hierarchy.

  Verdict
  The race picture supports inheritance tax only if markets are otherwise meritocratic and rules are fixed. Once load-bearing disanalogies are acknowledged, equalizing starts fails to ensure fairness because the wealthy alter the track. The scoreboard picture improves on this by targeting power rather than opportunity. It justifies taxation as a defense of democratic integrity against plutocracy. However, it risks overreach: if all capital is scorekeeping power, the argument could justify confiscatory levels that undermine investment incentives entirely. It also shifts the debate from desert to power, which may alienate those seeking a meritocratic compromise. Neither image suffices alone. A viable policy needs the race's concern for opportunity plus the scoreboard's concern for power. Tax large inheritances not to equalize starting lines, but to prevent the conversion of economic wealth into political veto power, preserving both mobility and democratic equality. The goal is not a fair race, but a game where no player owns the referee. This requires progressive taxation calibrated to influence thresholds, not just wealth levels, ensuring capital remains a tool for production rather than a weapon for domination.
