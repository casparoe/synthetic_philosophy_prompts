answer: |-
  Here is the diagnosis you need for the seminar.

  ### The Verdict
  **Reject step (6).**

  I am **95% confident** this is the load-bearing flaw. The argument is logically valid, but it is unsound because premise (6) makes a category error about the scope of the Principal Principle (PP). Your student is correct: the argument builds certainty into the antecedent of the conditional and then blames the conditional for not handling uncertainty.

  If you reject (6), you save the Principal Principle, you keep the standard definition of admissibility in (2) and (3), and you avoid the circularity trap you are worried about.

  ### The Diagnosis
  The error in (6) is the claim that a principle which requires disregarding frequency evidence *conditional on certainty about the chance* is "not a guide to life." This conflates two distinct epistemic tasks:
  1.  **Setting credence given a chance hypothesis** (The job of the PP).
  2.  **Updating credence in the chance hypothesis itself** (The job of Bayesian conditionalization).

  The PP is a synchronic constraint on how credence aligns with chance *at a time*. It is not a diachronic rule for learning what the chances *are*. If you are certain the chance is 0.5, rationality *demands* that you predict 0.5, even after 100 heads. If you predict otherwise while maintaining certainty in the 0.5 chance, you are incoherent (you believe the coin is fair but also believe it behaves unfairly).

  The "Guide to Life" slogan means that if you know the chances, you should align your beliefs with them. It does not mean the PP tells you how to infer chances from frequencies. That work is done by standard induction applied to the chance hypotheses. The PP only kicks in once you have a credence distribution over those hypotheses.

  **The Cost of Rejecting (6):**
  You must concede that the PP *alone* is not a complete epistemology of chance. It must be paired with the **New Principle (NP)** (or standard Bayesian updating over chance hypotheses) to handle real-world uncertainty. You have to tell the class that the PP is an idealization that applies strictly only when $C(X)=1$, and since we are rarely certain of chances, the NP is the actual workhorse. This diminishes the PP from a "master norm" to a "limiting case," but it saves it from falsity.

  ### Why You Should Not Reject (2) or (3)
  Your instinct was to attack the admissibility of frequency data (steps 2 and 3). **Do not do this.**

  If you claim that observed frequencies are inadmissible, you fall into the **circularity trap** you identified. If admissibility is defined as "evidence that doesn't move your credence off the chance value," then the PP becomes a tautology: "Conditionalize on admissible evidence (defined as evidence that makes the PP true) and the PP is true." This renders the principle unfalsifiable and philosophically empty.

  Lewis's gloss in (2) is intended to be independent: admissible evidence is historical and structural, not future-looking. Past frequencies are paradigmatically admissible *relative to a fixed chance hypothesis*. If you reject (3), you make the PP inapplicable to almost all real cases, since we always have some past data. You would be saving the principle by vacating it.

  ### Follow-Up 1: The New Principle (NP)
  Does swapping in the NP (where $C(A) = \sum C(Ch=x) \cdot x$) dissolve (5)? **Yes, completely.**

  The NP applies to your *unconditional* credence.
  *   **Under PP:** You hold $C(X)=1$. Data $F$ comes in. Since $C(X)$ cannot move (it's 1), $C(A)$ cannot move. Result: Frequency blindness.
  *   **Under NP:** You hold a distribution over $X$. Data $F$ comes in. $F$ is highly likely under $X_{biased}$ and unlikely under $X_{fair}$. You update $C(X_{fair})$ down and $C(X_{biased})$ up. Your unconditional $C(A)$ shifts toward the biased chance.

  The NP relocates the "frequency blindness" only to the conditional credences $C(A|X)$, which is correct. It allows the *unconditional* credence to be frequency-sensitive via the weights $C(X)$. This confirms that the original argument's complaint in (6) was targeting the wrong formula for the job.

  ### Follow-Up 2: Humean vs. Non-Humean Chance
  Does the metaphysics of chance matter here? **Yes, but it doesn't save the argument.**

  *   **Non-Humean (Propensities):** The chance is a physical property independent of the frequency. It is possible for the chance to be 0.5 even after 100 heads. In this case, the scenario in (4) is metaphysically possible. The agent who remains certain of $X$ is stubborn, but not logically contradictory. The PP holds.
  *   **Humean (Best System):** The chance *supervenes* on the frequency pattern. If you see 100 heads, it may be that the chance *is no longer* 0.5 (or never was). If the agent remains certain $X$ (chance is 0.5) despite the frequency, the agent is simply **wrong about the chance**.
      *   If $X$ is false, the PP doesn't apply (it constrains credence conditional on $X$, but rational agents shouldn't be certain of falsehoods).
      *   If the agent *should* have updated $C(X)$ to 0, then the PP is silent.
      *   The Humean view actually makes the "Certainty" assumption in (4) *harder* to sustain rationally, but it doesn't make the PP false. It just means the antecedent $C(X)=1$ is diachronically irrational in the face of undermining data.

  ### Seminar Advice
  Your framing in (6) is the broken part. You set up the PP as if it were supposed to be a complete theory of inductive inference. It isn't. It's a bridge principle between chance and credence.

  **Tell the class this:**
  1.  The student is right: (5) is a theorem of the setup, not a bug.
  2.  The argument fails at (6) because it demands the PP do the work of Bayesian updating.
  3.  The "crack" is the expectation that a principle conditional on chance knowledge should solve the problem of *acquiring* chance knowledge.
  4.  If you want to see the PP fail, look at **Undermining Futures** (where future frequencies make the current chance hypothesis false), not Undermining Pasts. That was Lewis's own reason for moving to the New Principle.

  If you try to defend (6) by attacking (3), you will be forced into defining admissibility circularly, and the statistics student will rightly point out that you've made the principle true by stipulation. Stand firm on (3), reject (6), and pivot to the New Principle.
