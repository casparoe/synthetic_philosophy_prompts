answer: |-
  In a controlled sleep laboratory, a subject trained in lucid dreaming protocols enters REM sleep monitored by high-density EEG and bilateral finger EMG, having previously established a reliable association between a 500Hz auditory tone and a specific index finger flexion that does not terminate sleep. In Condition A, the tone is delivered at t=0, the EMG registers the trained flexion within the expected latency window, and upon immediate awakening, the subject reports a continuous dream narrative wherein a bell rang and they signaled back. In Condition B, the identical tone is delivered at t=0, the EMG remains flat indicating no motor output, yet upon immediate awakening, the subject reports an equally vivid, continuous dream narrative spanning t=0 without gap or interruption, though the tone itself is absent from the content.

  On Malcolm's account, both conditions yield the same ontological verdict: dreaming is not an experience occurring during sleep but a report issued upon waking. For Malcolm, the EMG spike in Condition A is merely a physiological reflex or trained habit, conceptually distinct from "having an experience," and the narrative in both conditions is a post-hoc construction whose truth conditions are fixed only at the moment of utterance. Consequently, the discrepancy between the motor signal and the narrative in Condition B is irrelevant, as there was no "real-time" experience to miss the cue. Dennett, conversely, treats the Condition A motor signal as evidence of real-time cognitive fixation ("fame in the brain"), validating the dream as a neural event with temporal location. For Dennett, Condition B represents an "Orwellian" revision where the narrative gravity of the waking report fills the temporal gap left by the unexecuted motor command, suggesting the experience was constructed or edited near awakening despite the claim of continuity.

  The precise structural feature doing the work here is the **ostensive correlation between third-person physiological markers of cognitive processing and first-person narrative claims.** This feature attempts to bridge the explanatory gap by anchoring the subjective report to an objective timestamped event. If this feature is removed—if we rely solely on the waking report without the pre-sleep motor training—the case collapses back into standard skepticism where the temporal location of the dream is entirely underdetermined, leaving Malcolm and Dennett talking past one another regarding the definition of "experience."

  I take the committed position that this case **does not genuinely adjudicate** between the theories, because the disadvantaged view (Malcolm's) can absorb the result by challenging the inference from motor act to phenomenological content. A defender of Malcolm would attack the specific feature I identified by arguing that the finger flexion proves only neural discharge, not conscious awareness. They would contend that equating a conditioned motor reflex with "first-person access" begs the question against the conceptual claim that "dreaming" is a report-based status, not a private inner movie. Even if the brain processes the tone and moves the finger, Malcolm maintains that without the waking report, there is no dream, and with the report, the physiological data is retrospective context, not proof of concurrent experience. Thus, the empirical data shifts the pragmatic burden but cannot pierce the conceptual armor of the Wittgensteinian critique.
