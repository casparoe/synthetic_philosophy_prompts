answer: |-
  ### (1) Exam Question

  **Course:** PHI 420: Advanced Practical Reason
  **Assessment:** Take-Home Examination
  **Time Allocation:** 90 Minutes
  **Word Limit:** Approximately 800 words

  **Prompt:**

  Consider the "Helios-IV" Collaboration: a thirty-year international scientific partnership dedicated to a unified field theory. The project has consumed billions in funding and defined the careers of three generations of physicists. Recently, empirical data has systematically disconfirmed the theory's core predictions. Standard economic decision theory argues that continuing the project is irrational: past investments (sunk costs) are unrecoverable and should not influence future allocation; only future expected utility matters. This is "allocative rationality."

  However, an alternative view suggests "project-embedded commitment." On this view, the researchers' practical identity is partly constituted by the Helios project. Abandoning it does not merely waste resources; it dissolves the shared normative framework that gives their collective work coherence and meaning. This threatens the continuity of their "diachronic self" (the self extended over time).

  **Task:**
  Argue whether honoring the sunk costs in the Helios-IV case can be rationally justified without collapsing into the standard sunk cost fallacy. In your answer, you must:
  1.  Explain why the standard economic critique is compelling but potentially incomplete in this context.
  2.  Distinguish between mere emotional attachment and the constitutive role of the project in the agents' practical identity.
  3.  Identify the precise boundary condition where project-embedded commitment ceases to be rational and becomes self-undermining irrationality.

  Do not cite specific theorists or texts. Rely on conceptual analysis and the specifics of the scenario provided.

  ***

  ### (2) Model Answer

  The standard economic formulation of the sunk cost fallacy rests on a forward-looking conception of rationality. It posits that a rational agent acts as a container for resources, allocating them solely based on marginal future returns. In the Helios-IV scenario, this view is compelling because it prevents the compounding of errors. If the core theory is empirically disconfirmed, pouring further funding into it yields negative epistemic value. To ignore this is to privilege history over truth, which seems antithetical to the scientific ethos. If rationality is merely efficiency, then honoring sunk costs is always a failure of calculation.

  However, this allocative model fails to capture the structure of long-term human agency. It treats the agent as a series of disconnected temporal slices, each optimizing independently. In contrast, project-embedded commitment recognizes that rational agents are diachronic beings whose identity is constituted by their commitments. For the Helios researchers, the project is not merely an external tool; it is the medium through which they understand themselves as scientists. To abandon the project solely because it is no longer "efficient" is to fracture the narrative coherence of their professional lives. It renders their past thirty years of labor not just unrecoverable, but meaningless. Rationality, in this sense, includes the maintenance of a coherent practical identity over time.

  Therefore, honoring sunk costs can be rational if it serves to preserve a valuable normative identity that enables future agency. The investment is not in the specific theory, which may be false, but in the collaborative framework and the integrity of the research lineage. If the researchers withdraw immediately upon the first major disconfirmation, they signal that their commitment was conditional on success, undermining the trust required for high-risk, long-term inquiry. Continuing the work allows for theoretical revision rather than dissolution, preserving the "diachronic self" of the collective.

  Crucially, this justification does not collapse into the fallacy provided we distinguish between *constitutive commitment* and *dogmatic persistence*. Emotional attachment is a psychological state; practical identity is a normative structure. One can feel sad about a project ending (emotion) while acknowledging it must end (rationality). Conversely, one can continue a project (action) not because of the feeling, but because abandoning it would destroy the capacity for future meaningful action (identity).

  The boundary where this commitment becomes irrational is the point of self-undermining. Project-embedded commitment is rational only so long as the project remains capable of sustaining the normative identity it purports to protect. In Helios-IV, if the disconfirming evidence is so robust that continuing requires falsifying data or ignoring peer review, the project ceases to be a vehicle for scientific identity and becomes a mechanism of deception. At this threshold, the commitment no longer preserves the diachronic self; it corrupts it. Rationality demands that we honor our past investments only insofar as those investments continue to serve the values that made them worthy in the first place. Once the pursuit of the project violates the very norms (e.g., truth-seeking) that grounded the identity, the commitment transforms from rational fidelity into irrational escalation. Thus, sunk costs matter not because the past dictates the future, but because the past constitutes the agent who must inhabit the future.

  ***

  ### (3) Marking Scheme

  **Total Points:** 25

  **I. Analysis of Allocative Rationality (5 Points)**
  *   **5 pts:** Clearly articulates the standard economic view (forward-looking, marginal utility) and explains *why* it is compelling in the Helios scenario (prevents compounding error/epistemic vice).
  *   **3 pts:** Describes the economic view but fails to explain its normative force in a scientific context.
  *   **0-2 pts:** Misstates the fallacy or treats it as merely about "wasting money" without addressing rational evaluation.

  **II. Articulation of Project-Embedded Commitment (5 Points)**
  *   **5 pts:** Successfully defines commitment as constitutive of practical identity/diachronic self, rather than just "not wanting to quit." Explains how abandonment dissolves normative coherence.
  *   **3 pts:** Discusses identity but relies on vague notions of "pride" or "stubbornness" rather than normative structure.
  *   **0-2 pts:** Equates commitment with emotional attachment or refusal to accept loss.

  **III. Application to the Helios Scenario (5 Points)**
  *   **5 pts:** Integrates the specific details (multi-decade, collaborative, theoretical framework) to show why this specific case supports the identity view (e.g., trust, lineage, revision vs. dissolution).
  *   **3 pts:** Uses the scenario generically; the argument would work for any business or personal decision without modification.
  *   **0-2 pts:** Ignores the scenario details and argues in the abstract.

  **IV. Locating the Boundary of Irrationality (5 Points)**
  *   **5 pts:** Precisely identifies the "self-undermining" condition (e.g., when continuing violates the norms that ground the identity, such as truth-seeking). Distinguishes fidelity from dogmatism.
  *   **3 pts:** Identifies a limit (e.g., "when money runs out") but fails to connect it to the conceptual framework of identity.
  *   **0-2 pts:** Argues that commitment is always rational or always irrational; fails to locate a boundary.

  **V. Clarity and Structure (5 Points)**
  *   **5 pts:** Argument is logically sequenced, precise, and within word limits. No reliance on jargon without definition.
  *   **3 pts:** Readable but contains logical gaps or significant verbosity.
  *   **0-2 pts:** Disorganized or difficult to follow.

  **Common Errors (Deductions applied within categories above):**
  *   **Conflating Identity with Loyalty (-2 pts):** Treating the collective identity as mere groupthink or social pressure rather than a constitutive element of practical reasoning.
  *   **The "Structural Identity" Error (-2 pts):** Treating the scientific project as structurally identical to a commercial investment (e.g., a failing factory), ignoring the epistemic norms specific to science.
  *   **The "Recitation" Error (-3 pts):** Spending more than 25% of the word count explaining the basic economic fallacy without moving to the philosophical critique.
  *   **Citation Dependency (-5 pts):** Attempting to name-drop theorists to bolster arguments instead of relying on conceptual analysis (as per instructions).

  **Grade Bands:**
  *   **A (21-25):** Nuanced distinction between identity and emotion; clear boundary condition for irrationality.
  *   **B (16-20):** Solid grasp of the tension but boundary condition is vague.
  *   **C (11-15):** Understands the fallacy but struggles to articulate the rational counter-view.
  *   **D/F (0-10):** Recites standard economic theory or fails to address the prompt.
