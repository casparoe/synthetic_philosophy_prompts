answer: |-
  Here is the translation of Friedman's argument into population genetics terms, followed by the residue report and an analysis of your "Kimura Gap" hypothesis.

  ### 1. The Argument Restated: A Population Genetics Translation

  Friedman's core claim is that the biological realism of a model's parameters is irrelevant to its validity. Here is how that looks in your vocabulary:

  Imagine you are modeling allele frequency trajectories over time. You construct a model assuming an infinite population size ($N_e = \infty$), random mating, and strictly neutral mutations ($s = 0$). We know these assumptions are biologically false. Populations are finite, mating is structured, and nearly all mutations have some non-zero fitness effect, however slight.

  A realist critic would say: "Your model is invalid because $s$ is never exactly zero and $N_e$ is never infinite. You are describing a world that does not exist."

  Friedman replies: "It does not matter. The only test of this model is whether the predicted Site Frequency Spectrum (SFS) matches the empirical SFS observed in the sequence data. If the neutral model generates a likelihood surface that maximizes at the observed data, the assumption that $s=0$ is 'valid' for this purpose, even if we know selection is physically present."

  He argues that a good model acts like a strong selection coefficient: it swamps the noise of reality to produce a clear signal. If you assume firms maximize profit, or if you assume alleles drift neutrally, you are not claiming that is the *mechanism*. You are claiming that the system behaves *as if* that were the case. If the predictions hold (the residuals are white noise), then digging deeper into the assumptions (asking if the organism actually 'calculates' fitness or if the mutation is truly neutral) is a waste of time. The model is an engine for prediction, not a map of the genotype-phenotype relationship.

  ### 2. The Residue Report

  Here is where the translation holds, where it slips, and where it vanishes.

  **What Translates Cleanly (The Null Model Workflow)**
  This maps perfectly onto how we use Hardy-Weinberg Equilibrium (HWE) or the Neutral Theory as baselines.
  *   **The Practice:** We assume no selection, no migration, no mutation to establish a null expectation.
  *   **The Friedman Match:** We do not care if the assumptions are strictly true. We care if the data falls within the confidence intervals of the null. If the observed heterozygosity matches the expected heterozygosity ($H_{obs} \approx H_{exp}$), we accept the model operationally. We treat the assumption of "no selection" as functionally true, regardless of whether weak selection is actually occurring below our detection threshold.

  **What Requires Fudging (Mechanism vs. Prediction)**
  *   **The Friction:** In population genetics, we usually care *more* about the mechanism than the prediction. If a neutral model predicts the SFS correctly, we still want to know if that's because $s$ is actually zero or because background selection is mimicking drift.
  *   **The Fudge:** Friedman says distinguishing those two scenarios is unnecessary if the predictions are identical. A geneticist would say distinguishing them is the whole point, because it changes how we predict the system will behave under *new* conditions (e.g., a change in $N_e$). Friedman's argument works for static prediction; it fudges the requirement for robustness across changing environments.

  **What Has No Counterpart (The "Truth" of Parameters)**
  *   **The Missing Piece:** In philosophy, there is a debate about whether unobservable entities (like "utility" in economics) actually exist. In genetics, $s$ and $N_e$ are, in principle, measurable. We can do competition assays to measure $s$ directly, independent of frequency changes.
  *   **The Gap:** Friedman defends assuming things that are *in principle* unmeasurable or false (e.g., perfect information). In genetics, we rarely assume parameters are unknowable. We assume they are hard to measure. The philosophical anxiety about whether the parameters "exist" doesn't map well to evolutionary modeling, where parameters correspond to physical realities (birth/death rates) that we can validate outside the model.

  ### 3. The "Kimura Gap" Analysis

  You defined the **Kimura Gap** as the region where $|s| < 1/2N_e$. Selection is present, but it falls below the resolution of the drift noise floor, so we treat it as neutral.

  **Is this analogous to Friedman's "Unrealistic but Predictive" zone?**
  **Yes, but with a critical structural difference.**

  **Where the Analogy Holds:**
  In both cases, you are ignoring a force that exists because including it does not improve the fit of the model relative to the noise.
  *   **Friedman:** Ignore the psychological complexity of the firm; treat it as a profit maximizer.
  *   **Kimura Gap:** Ignore the weak selection coefficient; treat the allele as neutral.
  In both zones, the "false" assumption yields the correct predictive distribution. If you are in the Kimura Gap, a neutral model predicts fixation probabilities ($1/2N$) just as well as a selection model would, given the variance introduced by drift.

  **Where the Analogy Collapses:**
  The collapse happens at the boundary conditions.
  *   **The Kimura Gap is Parameter-Dependent:** Whether an allele is in the Gap depends on $N_e$. If the population bottlenecks, $1/2N_e$ rises, and alleles previously under selection might fall into the Gap. If the population expands, alleles previously in the Gap become subject to selection. The "validity" of the assumption ($s=0$) changes with the system's physical parameters.
  *   **Friedman's Zone is Theory-Dependent:** Friedman argues the assumption is valid regardless of the underlying mechanics, provided the *outcome* matches. He is less concerned with the boundary conditions of $N_e$. He would argue that even if $N_e$ changes, as long as the "profit maximization" model predicts the market share shift, the assumption holds.
  *   **The Collapse:** In genetics, we know *why* the assumption works in the Gap (drift swamps selection). In Friedman's economics, the reason *why* the false assumption works is often left as a black box (market selection eliminates non-maximizers?). The Kimura Gap is a statement about statistical power and variance; Friedman's F-twist is a statement about theoretical utility.

  ### 4. Critique of Your Intuition

  You suspect Friedman is basically saying: *"Build a null model and check the residuals."*

  **You are 80% right, but the missing 20% is dangerous.**

  **Where you are right:**
  Friedman is indeed advocating for an instrumentalist approach identical to using a null model. If the residuals (the difference between predicted and observed frequency) are random noise, the model is sufficient. Do not add parameters (like epistasis or migration) unless the residuals show structure. This is standard model selection (AIC/BIC logic).

  **Where you are wrong (The Miss):**
  Friedman goes further than standard null model practice. He argues that **testing the assumptions themselves is meaningless.**

  *   **Standard Genetics Practice:** We use a neutral null model. If it fits, we *still* worry. We run robustness checks. We try to estimate $s$ using independent methods (e.g., divergence data) to see if the assumption of neutrality was "lucky" or "real." We care if the assumption is biologically plausible.
  *   **Friedman's Stance:** He would say checking if $s$ is actually zero is a waste of time. If the neutral model predicts the SFS, then for all scientific purposes, $s$ *is* zero. He forbids looking under the hood.

  **The Specific Failure Point:**
  If you follow Friedman strictly, you stop investigating the mechanism once the residuals are white noise. In population genetics, this would halt progress.
  *   *Example:* If a neutral model fits the SFS of a coding region, a Friedman approach says "Stop. It's neutral."
  *   *Geneticist approach:* "It fits, but it's a coding region. It might be balancing selection mimicking neutrality, or linked selection. I need to check linkage disequilibrium or divergence."

  Friedman treats the model as a **black box** that outputs predictions. Population geneticists treat the model as a **white box** where the internal parameters must correspond to causal forces, even if the fit is good.

  **Summary:** Your intuition holds for *model selection*, but fails on *mechanistic inference*. Friedman tells you to ignore the biology if the math works. Population genetics tells you the math is only useful insofar as it illuminates the biology. The Kimura Gap is a limit of *detection*; Friedman's zone is a limit of *relevance*. They look the same from the outside (you ignore the force), but they are justified by different rules.
