  **STAND-IN SERVICES LLC — TERMS OF SUBSCRIPTION**

  **1. Definition of Service.**
  The Company provides Warranted Aesthetic Judgments via a Proxy Model. Upon completion of a Sensibility Questionnaire, the Company assigns a trained Proxy to view, read, or listen to the Target Work. The Proxy files a report, and the Client is licensed to assert the resulting judgment as their own. The Client acknowledges that the Proxy undergoes the phenomenal experience; the Client receives only the verdict.

  **2. Reasonable Acquaintance Waiver.**
  The Warranty is void if the Client could have reasonably acquainted themselves with the Target Work directly. Reasonable acquaintance is defined as access requiring less than four hours of travel or subscription costs under fifty dollars. The Company reserves the right to deny claims where the Client's avoidance of direct experience suggests a preference for efficiency over aesthetic engagement, as the service is intended for logistical impediments, not epistemic laziness.

  **3. Verdict vs. Description.**
  The Company distinguishes between the judgment *that* a work is good and information about *what* the work is like. The Company warrants the former. The Company expressly disclaims liability for the latter. Descriptions of plot, style, or tone provided in the Proxy Report are evidentiary supports only and do not constitute the aesthetic judgment itself. Clients seeking to know what happens in a film should utilize synopsis services; Clients seeking to know if the film is good should utilize this Service.

  **4. Sensibility Calibration.**
  Proxies are selected based on statistical alignment with the Client's historical preferences. The Company does not warrant that the Proxy possesses superior taste, only calibrated taste. In instances where the Proxy's expertise exceeds the Client's, the Client acquires the justification for the belief without acquiring the capacity to defend it independently. The Client accepts that their authority is borrowed.

  **5. Disagreement Protocol.**
  In cases where multiple Proxies yield conflicting judgments, the Company shall issue an Aggregate Numeric Score. The Client acknowledges that an average of conflicting expert opinions provides a warranted belief regarding the work's quality but fails to resolve the underlying aesthetic disagreement. The Client may cite the score but may not claim to understand the resolution of the conflict.

  **6. Phenomenal Experience Exclusion.**
  The Service warrants the correctness of the judgment, not the felt enjoyment of the work. Clients may assert that a film is a masterpiece without having felt awe, boredom, or sorrow. The Company is not liable for feelings of emptiness should the Client later view the work and find the experience does not match the warranted judgment. The value of the Service is social validity, not personal resonance.

  **7. Argument Warranty.**
  Subscribers are licensed to use Warranted Judgments to win arguments, curate reputations, and settle bets. The Company warrants that the Client will be epistemically positioned to assert the judgment in good faith. The Company does not warrant that the Client will be able to answer follow-up questions regarding specific scenes, artistic choices, or thematic nuances beyond the data provided in the Proxy Report.

  **8. Limitation of Liability.**
  The Company's liability is limited to the refund of subscription fees. The Client acknowledges that the structural relationship between Proxy and Client is analogous to that between a food-safety inspector and a diner, or a structural engineer and a building tenant. However, the Company draws a distinction between safety hazards and aesthetic deficits. While a food inspector guarantees the meal will not harm you, the Company guarantees only that the judgment will not be false. The Company cannot guarantee the judgment will nourish you.

  **9. Modification of Terms.**
  The Company reserves the right to update the Sensibility Questionnaire as philosophical consensus regarding aesthetic testimony shifts. Clients will be notified if the Acquirement of Knowledge via Testimony becomes legally recognized as impossible in their jurisdiction.

  **ACKNOWLEDGEMENT OF TERMS**

  By subscribing, the Client acknowledges that they seek the status of knowing without the substance of knowing. The Client confirms they understand that they will possess the right to claim the work is good, the evidence that the work is good, and the social credit for knowing the work is good. The Client further confirms they understand they will not possess the only thing that typically makes such a claim matter. The Client accepts that this gap is not a bug, but the product.
