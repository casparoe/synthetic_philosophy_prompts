      *   *Average Utilitarianism's Problems:*
          1.  *The "Happy but Below Average" Problem:* Creating happy people is wrong if they lower the average.
          2.  *The "Extinguishment" Problem:* Killing unhappy people raises the average.
          3.  *The "Past Lives" (Ancient Egypt) Problem:* How do we count the dead? If we count them, we are burdened by history. If we don't, it's arbitrary.
      *   *Final Verdict:* The analogy carries the rhetorical weight but fails philosophically. It assumes the conclusion (that we should care about averages). The Repugnant Conclusion is a bullet total utilitarians bite, but Average Utilitarianism has bullets that are arguably worse (killing the unhappy).

  7.  **Refining the "Ancient Egypt" point:**
      *   The specific worry is usually about the *scope* of the average.
      *   If the average is over all lives *ever*, then the misery of ancient Egyptians lowers the value of our current existence.
      *   To maximize average welfare now, we might need to create enough blissful lives to "outweigh" the Egyptian misery statistically.
      *   Alternatively, if we only count *current* lives, we face the "changing identity of the moral community" problem.
