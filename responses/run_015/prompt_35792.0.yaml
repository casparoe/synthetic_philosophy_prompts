      *   User says: "something about whether adding lives just above the historical average makes the world better."
      *   Actually, the standard objection is adding lives *positive but below average*.
      *   Wait, there is another objection: If you add lives *above* the average, Average Utilitarianism says the world gets better. But Total Utilitarianism *also* says that. That's not a point of divergence.
