prompt: |-
  hey — I'm on the benefits committee for my employer's self-insured health plan (we're the people who actually decide what gets covered), and we keep having the same fight: half of us think the plan exists to fix what's broken and nothing more, the other half think paying to make someone better-than-fine is obviously what insurance is for. Before we argue about specific drugs I want the spec. So: write me the desiderata for a therapy/enhancement distinction that could actually be used as a coverage rule — what a line would have to get right for me to trust it, with the case behind each requirement — and tell me which requirements are non-negotiable and which are just one camp wanting the line to deliver its own conclusion.

  Cases it has to handle (add your own; these are the ones that broke us):

  - insulin: fixes no underlying mechanism, restores nothing permanently, and function is normal only for as long as you keep taking it. Any line on which "durable," or "repairs the mechanism rather than managing it," is part of therapy has already lost.
  - the noise town: a town where nearly every adult over 40 has measurable hearing loss from the plant that employs them. Is hearing care treatment there? Does the answer change if the reference population is the species, the country, or the town? And if the real fix is earplugs at the plant or shutting the plant, is that the medical answer or the political one?
  - stimulants for a kid with a diagnosis, for a resident on nights, for a long-haul pilot — same drug, three verdicts, and I want to know whether the difference is really in the intervention.
  - orthodontics after an accident vs. for a teenager with an entirely average overbite in a culture where straight teeth affect getting hired.
  - something that gives a child a capacity no human has had, which is needed for an ordinary life in the environment they'll actually grow up in (make up the environment, I don't mind if it's speculative).
  - the person who doesn't want the fix: Deaf parents declining implants for their kid, someone whose condition is bound up with how they identify. Does "departs from typical" have to mean "worse for this person," and what do we do when the person says it isn't worse — or when they can't say, or when they've adjusted their expectations down to what they think they can get?
  - the ratchet: if we cover something and nearly everyone takes it, does normal move? If normal moves, have we manufactured a new deficiency for everyone who declines, so the line eats its own tail?
  - repurposing: a drug developed for a disease and later used cosmetically, and a cosmetic drug later found to treat a disease. The verdict shouldn't depend on which indication came first.

  Distinctions I keep watching the line collapse: therapy vs. what we owe someone; "not normal" vs. "bad for you"; restoring this person's own baseline vs. raising the floor for everybody; intervention vs. environment; "medically necessary" vs. "works." And it has to be administrable — decided with thin evidence, by non-philosophers, in a way that doesn't secretly track cost or how new the technology is.

  Where I most want you to push: which pair of requirements is jointly unsatisfiable (my guess is that "the baseline has to be value-free and biological" and "the line has to do the moral work — entitlement on one side, suspicion on the other" aren't both available, but say it better than that), and which single requirement eliminates the most popular accounts. Also flag anything on my list that's really just a prejudice of one side of the argument rather than a real desideratum.

  A table is fine, but the requirements are the part I'll use, so keep the weight there. Short scorecard at the end for the two or three standard lines people reach for — the species-typical-function one, the subjective-welfare one, the "what a reasonable person would want" one — if you have room. American English please, and keep it readable enough to be read out loud to a room of managers who do not want a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Member of a benefits committee for a self-insured health plan.
      *   **Problem:** Internal conflict between "fix what's broken" (therapy) vs. "make better-than-fine" (enhancement).
      *   **Task:** Write desiderata (requirements) for a therapy/enhancement distinction that can serve as a coverage rule. Explain the case behind each requirement. Identify non-negotiables vs. camp-specific wishes. Identify unsatisfiable pairs. Flag prejudices. Scorecard existing standard lines.
      *   **Constraints:** Must handle specific cases (insulin, noise town, stimulants, orthodontics, speculative child capacity, Deaf culture, the ratchet, repurposing). Must be administrable (thin evidence, non-philosophers, not cost-driven). American English. Readable for managers.
      *   **Tone:** Professional, direct, analytical, practical but philosophically rigorous.

  2.  **Deconstruct the Core Conflict:**
      *   Camp A (Restorative): Insurance is a safety net. It returns you to the starting line. It fixes pathology.
      *   Camp B (Optimizing): Insurance is a benefit. It maximizes function. It removes barriers to flourishing, even if "normal."
      *   *The Trap:* Most definitions collapse under edge cases (like insulin or noise town).

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need requirements that a workable policy *must* meet to be trusted, not just philosophical ideals.
      *   *Requirement 1: Stability of Baseline.* (Addresses Insulin & Ratchet). If coverage changes "normal," the policy shouldn't flip-flop.
      *   *Requirement 2: Context Independence.* (Addresses Noise Town & Stimulants). The status of the intervention shouldn't depend entirely on where you live or what your job is, *unless* the policy explicitly ties coverage to social function.
      *   *Requirement 3: Mechanism Agnosticism.* (Addresses Repurposing & Insulin). It shouldn't matter *how* it works or what it was originally for. It matters what it *does*.
      *   *Requirement 4: Subjective/Objective Alignment.* (Addresses Deaf Culture & Orthodontics). Who defines "harm"? The patient or the doctor?
      *   *Requirement 5: Administrative Tractability.* (Addresses the "non-philosophers" constraint). Can a claims adjuster actually use this?

  4.  **Refining the Desiderata (Iterative Process):**
      *   *Critique:* "Context Independence" is tricky. Stimulants *are* different for a pilot vs. a kid. Why? Because one is safety-critical performance, one is developmental. I need to frame this carefully.
      *   *Critique:* "Subjective/Objective" is the hardest. If a Deaf parent says "not sick," but the doctor says "hearing loss," who wins? The desideratum needs to acknowledge this tension.
      *   *New Idea:* Focus on "Function relative to Opportunity."
      *   *Let's try to group them:*
          1.  **Non-Perishability:** The definition shouldn't expire as tech improves (Insulin/Ratchet).
          2.  **Portability:** The definition shouldn't change based on geography or employer (Noise Town/Stimulants).
          3.  **Origin Neutrality:** History of the drug doesn't matter (Repurposing).
          4.  **Agency Respect:** Patient values matter, but aren't absolute (Deaf Culture).
          5.  **Administrative Bright Line:** Must be decidable without a bioethics board for every claim.

  5.  **Addressing the "Un satisfiable Pair":**
      *   The prompt asks: "which pair of requirements is jointly unsatisfiable."
      *   *Hypothesis:* "Value-Free Biological Baseline" vs. "Moral Entitlement."
      *   *Explanation:* You can't define "normal function" without implying "good." If you say "hearing is normal," you imply "deafness is a deficit." If you try to be purely biological, you ignore the social reality (Noise Town). If you try to be purely moral, you have no medical standard.
      *   *Refinement:* The tension is between **Objective Stability** (the line stays put regardless of social change) and **Contextual Fairness** (the line accounts for actual barriers faced). You can't have a line that never moves (to avoid the Ratchet) *and* a line that perfectly fits every specific social context (Noise Town).

  6.  **Addressing the "Single Requirement that Kills Popular Accounts":**
      *   *Candidate:* **Administrative Tractability.**
      *   *Why:* Most philosophical definitions (species-typical function, normal opportunity range) require deep case-by-case analysis. A benefits committee needs a rule that works on a form. If the rule requires adjudicating "what is the species typical function for a 45-year-old in a noisy town?", it fails.

  7.  **Flagging Prejudices:**
      *   "Durable/Permanent fix" is a prejudice (Camp A). Insulin proves this wrong.
      *   "Species-typical" is a prejudice (Camp A). It fails the Noise Town and speculative child cases.
      *   "Patient Preference is King" is a prejudice (Camp B). It fails the cost/ratchet test.

  8.  **Scorecard:**
      *   Species-Typical Function (Boorse): Fails Noise Town, Insulin.
      *   Subjective Welfare: Fails Ratchet, Cost control.
      *   Reasonable Person/Opportunity Range (Daniels): Best fit, but administratively heavy.

  9.  **Drafting the Content (incorporating the constraints):**
      *   *Tone Check:* Keep it punchy. No jargon without explanation. Use the "Spec" metaphor.
      *   *Structure:*
          1.  Intro (acknowledge the difficulty).
          2.  The Desiderata (The Core).
          3.  The Unsatisfiable Pair (The Hard Truth).
          4.  The Killer Requirement.
          5.  Prejudice Flagging.
          6.  Scorecard.

  10. **Refining Specific Cases within the Desiderata:**
      *   *Insulin:* Needs "Mechanism Agnosticism."
      *   *Noise Town:* Needs "Reference Class Stability."
      *   *Stimulants:* Needs "Role-Relative Function."
      *   *Deaf Culture:* Needs "Value Pluralism."
      *   *Ratchet:* Needs "Static Definition."

      *Wait, "Static Definition" conflicts with "Role-Relative."* This is the unsatisfiable pair. If the definition is static (species-typical), it fails the pilot vs. kid stimulant case. If it's role-relative, it's administratively nightmarish and creates the Ratchet.
      *Correction:* The unsatisfiable pair is **Universal Biological Baseline** vs. **Contextual Fairness**. You can't have a rule that ignores the environment (Noise Town) but also claims to restore "natural" function.

  11. **Final Polish:**
      *   Ensure American English.
      *   Check readability.
      *   Make sure the "Non-Negotiable" vs. "Camp Wish" distinction is clear.

      *(Self-Correction during drafting)*: I need to be careful not to solve the problem for them, but to give them the *tools* to see why they are stuck. The prompt asks for the *desiderata for a distinction*, not the distinction itself. I need to list what a *good* distinction would need to do, while admitting most don't.

      *Revised Plan:*
      1.  **The Spec:** 5 Requirements. Label them Non-Negotiable or Camp-Specific.
      2.  **The Conflict:** The Unsatisfiable Pair.
      3.  **The Filter:** The requirement that kills most theories.
      4.  **The Prejudices:** Call out the hidden assumptions.
      5.  **The Scorecard:** Rate the common approaches.

      *Let's refine the "Unsatisfiable Pair".*
      The prompt suggests: "the baseline has to be value-free and biological" and "the line has to do the moral work."
      I will articulate this as: **Biological Objectivity** vs. **Normative Force**. You can't derive an "ought" (coverage) from an "is" (biology) without smuggling in values.

      *Let's refine the "Killer Requirement".*
      **Administrative Tractability.** Most philosophical lines collapse when you hand them to a claims adjuster.

      *Let's refine the "Prejudices".*
      "Permanence" (Insulin case). "Origin Story" (Repurposing case).

      *Okay, ready to write.*

      *(Final check on cases)*:
      - Insulin -> Mechanism Agnosticism.
      - Noise Town -> Reference Class.
      - Stimulants -> Context of Use.
      - Ortho -> Social vs Medical.
      - Speculative Child -> Future Proofing.
      - Deaf Parents -> Authority.
      - Ratchet -> Dynamic Baselines.
      - Repurposing -> Indication Neutrality.

      I will group these into the requirements.

      *(Final check on tone)*: "Readable enough to be read out loud to a room of managers." Keep sentences relatively short. Use bolding for emphasis. Avoid dense paragraphs.

      *(Final check on "Non-Negotiable")*: What is truly non-negotiable for a *working* plan? Administrability and Consistency. The philosophical purity is the camp wish.

      Let's go.cw
answer: |-
  To: Benefits Committee
  From: [Your Name/Consultant]
  Re: Specification for Therapy/Enhancement Distinction

  You are asking for a line that does two contradictory things: it needs to be **objective enough** to prevent endless appeals, but **nuanced enough** to handle real human variation. Most proposals fail because they pretend this tension doesn't exist.

  Below is the spec for a distinction that could actually work. I have separated requirements that are necessary for *any* functional plan from requirements that are actually just one camp trying to win the argument by definition.

  ### Part 1: The Desiderata (The Spec)

  | Requirement | What It Demands | Case Behind It | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Mechanism Agnosticism** | Coverage cannot depend on *how* the intervention works (permanent repair vs. ongoing management) or its *origin* (drug vs. device). | **Insulin & Repurposing.** If you require "permanent repair," insulin is out. If you require "original intent," Botox for migraines is in but Botox for wrinkles is out, even if the molecule is identical. | **Non-Negotiable** |
  | **2. Reference Class Stability** | The definition of "normal function" cannot shift based on geography or employer, unless the plan explicitly covers occupational hazards. | **The Noise Town.** If hearing loss is "normal" in the town but "abnormal" in the species, is it covered? If the line moves based on local prevalence, you penalize people for living in unhealthy environments. | **Non-Negotiable** |
  | **3. Indication Neutrality** | The verdict must track the *diagnosis and functional goal*, not the molecule itself. | **Stimulants.** Same pill for ADHD (coverage), shift-work sleep disorder (coverage?), pilot performance (no coverage). The drug isn't the variable; the functional deficit is. | **Non-Negotiable** |
  | **4. Authority Allocation** | The rule must specify who decides when a condition is a "harm": the clinician, the patient, or the plan. It cannot be ambiguous. | **Deaf Parents.** If the parent says "this is identity, not disease," does that veto the doctor? If the rule doesn't say who holds the veto, you get litigation. | **Non-Negotiable** |
  | **5. Baseline Locking** | The definition of "typical function" must be fixed to a specific time or standard, not updated in real-time as coverage expands. | **The Ratchet.** If we cover LASIK and everyone gets it, does "normal vision" become 20/10? If the baseline moves, anyone who declines becomes "disabled" by the plan's own success. | **Camp A Wish** |
  | **6. Opportunity Maximization** | The rule should cover interventions that expand a person's range of opportunities, even if they exceed statistical averages. | **Speculative Child.** If a child needs a capacity to survive in their future environment, "species typical" is irrelevant. This prioritizes future flourishing over past baselines. | **Camp B Wish** |

  ### Part 2: The Unsatisfiable Pair

  You asked which pair of requirements cannot both be met. It is this:

  **Biological Objectivity vs. Normative Force.**

  *   **Biological Objectivity:** You want a baseline that is value-free (e.g., "species-typical functioning"). This satisfies Camp A. It feels scientific.
  *   **Normative Force:** You want the line to determine entitlement (e.g., "this *ought* to be covered because it prevents harm"). This satisfies Camp B.

  **The Conflict:** You cannot derive an "ought" from an "is."
  If you choose a purely biological baseline (e.g., "average hearing for a 45-year-old"), you fail the **Noise Town**. In that town, "average" is damaged. A biological rule says "no coverage" (it's normal for them). A moral rule says "coverage" (it's harmful).
  If you choose a moral baseline (e.g., "what allows a decent life"), you lose **Administrative Tractability**. Every claim becomes a debate about what constitutes a "decent life."

  **The Reality:** You must choose which error you prefer.
  *   **Error Type 1 (Camp A preference):** You under-cover people in bad environments (Noise Town) because their dysfunction is statistically "normal."
  *   **Error Type 2 (Camp B preference):** You over-cover enhancements (Orthodontics for hiring) because social barriers are treated as medical defects.

  ### Part 3: The Killer Requirement

  The single requirement that eliminates the most popular philosophical accounts is **Administrative Tractability.**

  *   **Why:** Philosophers love the "Normal Opportunity Range" (Daniels) or "Species-Typical Function" (Boorse). These sound great in a seminar.
  *   **The Failure:** To apply them, a claims adjuster would need to determine the "species-typical hearing for a 45-year-old male in the Midwest" or adjudicate whether straight teeth expand "opportunity" or just aesthetics.
  *   **The Result:** Any line that requires thick evidence or case-by-case ethical reasoning will collapse into "we cover what the doctor codes as disease." If your rule requires a bioethicist to approve every claim, you don't have a rule; you have a committee.

  ### Part 4: Flagging Prejudices

  Several items on your list are not genuine desiderata; they are disguised arguments for one side.

  1.  **"Durable/Permanent Fix" (Camp A Prejudice):**
      *   *Why it's a prejudice:* As you noted with **Insulin**, this excludes chronic disease management. It defines therapy as "cure" rather than "care." It is scientifically outdated.
      *   *Verdict:* Discard.

  2.  **"Restoring *This* Person's Baseline" (Camp A Prejudice):**
      *   *Why it's a prejudice:* This fails the **Speculative Child** case. If a child is born without a capacity no human has, but needs it for their environment, "restoring baseline" means condemning them to failure. It privileges the past over the future.
      *   *Verdict:* Discard.

  3.  **"Patient Preference is King" (Camp B Prejudice):**
      *   *Why it's a prejudice:* This fails the **Ratchet** and **Cost** constraints. If a patient defines their need as "enhancement," and the plan covers it, the plan becomes a lifestyle subsidy.
      *   *Verdict:* Discard.

  ### Part 5: Scorecard of Standard Lines

  Here is how the three most common definitions perform against your cases.

  | Definition | The Gist | Passes Insulin? | Passes Noise Town? | Passes Stimulants? | Admin Feasible? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Species-Typical Function** (Boorse) | Therapy restores statistical normality for the species. | **Yes** (Manages function) | **No** (Defines local damage as "normal") | **No** (Pilot needs *super*-normal focus) | **Medium** (Requires stats) |
  | **Subjective Welfare** (Patient Choice) | Therapy is whatever the patient values for their well-being. | **Yes** | **Yes** | **Yes** | **No** (Invites abuse/Ratchet) |
  | **Normal Opportunity Range** (Daniels) | Therapy restores the range of life plans reasonable to expect. | **Yes** | **Yes** | **Yes** | **Low** (Too vague for adjusters) |

  ### Recommendation

  Do not try to solve the philosophy. Solve the **process**.

  1.  **Adopt Indication Neutrality:** Cover the diagnosis, not the drug. (Solves Repurposing/Stimulants).
  2.  **Fix the Reference Class:** Use national, not local, statistics for "normal." (Solves Noise Town, prevents Ratchet).
  3.  **Accept the Trade-off:** Acknowledge that a static biological baseline will under-cover some environmental harms (Noise Town) but will prevent the plan from becoming an unlimited enhancement fund.

  If you try to make the line perfectly moral, you will bankrupt the plan. If you make it perfectly biological, you will harm your employees. Pick the friction you can manage.
