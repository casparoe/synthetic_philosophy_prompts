prompt: |-
  I'm a journalist writing about the current boom in prestige dramatizations of real lives — a limited series that invents its subject's private conversations wholesale, a biopic that folds three colleagues into one composite character, a docudrama that gives a real and well-documented figure a fabricated motive for a decision she in fact made. The more ethical commentary I read, the more I find myself holding what I'll call the surrogate-interest view: the dead are not the kind of thing that can be wronged or benefited, so whatever we owe concerning them — including whatever we owe in dramatizing them — is owed to the living: to descendants who still live inside the story, to communities that organize themselves around a memory, to a public with an interest in an accurate record. Tell me what would count against it. I want the cases, intuitions and adjoining commitments it stands or falls with — the fabricated atrocity pinned on someone dead three centuries, the deathbed promise kept long after everyone who witnessed it is gone, the last surviving eyewitness, the invention no viewer could ever detect and that costs no living person anything — ranked from fatal to merely awkward, together with which of them a defender should concede rather than manage. I especially want to know whether the move I keep making in my own drafts has insulated the view past the point of risk: that we can still respect the interests of the person she was before dying, since her ante-mortem desires reached forward into precisely these post-mortem events — the prospective-interest move, as I've been calling it. If it has, say whether that is a defect in a view of this kind or simply what a true view looks like once stated carefully. For what it's worth, the undetectable-invention case is the one I would personally find hardest to shrug off.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A journalist writing about the ethics of prestige dramatizations of real lives (biopics, limited series, docudramas).
      *   **Core View:** "Surrogate-Interest View" (SIV). The dead cannot be wronged/benefited. Obligations regarding the dead are actually owed to the living (descendants, communities, public record).
      *   **Task:** Identify counter-arguments/cases/intuitions that count *against* the SIV. Rank them from fatal to merely awkward. Determine which concessions a defender should make.
      *   **Specific Focus:** Evaluate the "Prospective-Interest Move" (PIM) – the idea that we respect the dead person's ante-mortem desires about post-mortem events. Does this insulate the view too much? Is that a defect or a feature?
      *   **Personal Note:** The user finds the "undetectable invention" case hardest to shrug off.
      *   **Tone:** Intellectual, rigorous, nuanced, philosophical but accessible (journalistic context).

  2.  **Deconstruct the Surrogate-Interest View (SIV):**
      *   *Premise:* Death ends moral status (no posthumous harm).
      *   *Conclusion:* Ethics of representation = Ethics of impact on the living.
      *   *Strengths:* Practical, avoids metaphysical puzzles about dead subjects, aligns with libel law (mostly).
      *   *Weaknesses:* Ignores intuition that *the subject* matters, fails in cases where no living surrogates exist or are harmed.

  3.  **Brainstorm Counter-Cases (The "What Counts Against It" List):**
      *   *Case 1: The Fabricated Atrocity (Deep Past).* Pinning a crime on someone dead 300 years. No living descendants, no community harmed.
      *   *Case 2: The Undetectable Invention.* A lie told about the dead that no one knows is a lie and hurts no one living.
      *   *Case 3: The Deathbed Promise.* A promise made to the dying to tell the truth, kept after all witnesses die.
      *   *Case 4: The Last Surviving Eyewitness.* Only one person knows the truth, they die, the dramatization lies.
      *   *Case 5: Historical Record/Epistemic Harm.* Distorting the public record even if no specific "community" is hurt.

  4.  **Rank the Counter-Cases (Fatal to Awkward):**
      *   *Fatal:* The Undetectable Invention (if SIV says it's fine, but intuition says it's wrong). *Wait, the user says this is the one they find hardest to shrug off.* This suggests it's the stress test. If SIV says "no harm, no foul," but we feel "that's still a lie," SIV is in trouble.
      *   *Very Strong:* The Fabricated Atrocity (Deep Past). If there are *no* living surrogates, SIV says "go ahead." Intuition says "defamation of the dead is wrong."
      *   *Strong:* The Epistemic/Public Record argument. The "public" is a surrogate, but is "accuracy" an interest of the public or a duty to the truth itself?
      *   *Manageable:* The Deathbed Promise. This can be framed as a duty to the *promisee* (who might be dead too?) or the self-integrity of the promisor.
      *   *Awkward:* Composite Characters. Usually justified by narrative efficiency, surrogates (audience) benefit from clarity.

  5.  **Evaluate the Prospective-Interest Move (PIM):**
      *   *The Move:* We respect the dead's *ante-mortem* desires (e.g., "I want my life told truthfully").
      *   *Risk:* If we lean too hard on this, do we collapse back into "The Dead Can Be Wronged"?
      *   *Analysis:* If the obligation is grounded in the *past person's desire*, it looks like posthumous rights. If it's grounded in *our duty to honor past autonomy*, it's still about the living agent's integrity.
      *   *Verdict:* It insulates the view, but potentially at the cost of coherence. If *only* ante-mortem desires matter, what about people who didn't care? What about people who wanted a lie? (e.g., "Make me look good.")
      *   *Defect or Feature?* It's a necessary bridge, but if it becomes the *only* justification, it risks becoming a "zombie rights" theory (rights that survive death). It's better framed as a living duty to respect past autonomy, not a dead person's right.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the SIV. It's a standard philosophical position (Feinberg-esque).
      *   *Section 1: The Ranking of Counter-Cases.*
          *   Need to be precise.
          *   *Fatal:* The "Harmless Lie" (Undetectable Invention). If SIV permits it, and we think it's unethical, SIV fails. *Correction:* The user finds this hard to shrug off. I need to explain *why* it threatens SIV. It threatens it because SIV requires a *victim*. If there is no victim (living), SIV says it's permissible. If intuition says it's not, SIV is incomplete.
          *   *Severe:* The "Deep Past Atrocity." No descendants. No community memory. SIV says "fine." Intuition says "slander."
          *   *Moderate:* The "Broken Promise." Duty to the dead vs. duty to the promise (which survives).
          *   *Manageable:* "Composite Characters." Usually serves the living audience's understanding.
      *   *Section 2: The Prospective-Interest Move (PIM).*
          *   Does it save SIV?
          *   It shifts the locus of harm from "posthumous state" to "frustration of prior will."
          *   *The Trap:* If the subject *wanted* to be fictionalized? (e.g., a mythomaniac). SIV+PIM would require lying. SIV (Living Surrogates) might require truth. Conflict!
          *   *The Trap 2:* If the subject had no opinion. Does truth matter then?
          *   *Conclusion on PIM:* It's a feature, but not a panacea. It turns the view into "Respect for Autonomy" rather than "Protection of Surrogates."
      *   *Section 3: Recommendations for the Journalist.*
          *   Where to concede.
          *   How to frame the "Undetectable Invention."

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique of SIV:* The biggest hole in SIV is *Epistemic Vice*. Lying about history degrades the *practice* of history/truth-telling, which is a public good, even if no specific living person is hurt *now*.
      *   *Refining PIM:* The user asks if insulating the view past the point of risk is a defect. Yes, if it makes the view unfalsifiable. If *every* objection is met with "but the dead person wanted X," the view stops being about surrogates and becomes about the dead.
      *   *The "Undetectable Invention":* This is the "Perfect Crime" problem. If morality requires a victim, perfect crimes are moral. If morality is about agent integrity or truth, they aren't. SIV is victim-centric. This case exposes that limitation.

  8.  **Final Polish:**
      *   Ensure the tone matches the user's high-level discourse.
      *   Check that all parts of the prompt are answered (Ranking, PIM analysis, Concessions).
      *   Make sure the distinction between "Surrogate Interest" and "Prospective Interest" is clear. One is outward-looking (family/public), one is backward-looking (subject's prior will).

  9.  *(Final check of the "Fatal" ranking)*: Is the Undetectable Invention fatal? Only if one holds that truth-telling is a duty *independent* of consequences. SIV is consequentialist regarding the living. So, yes, non-consequentialist intuitions kill SIV. I need to make sure the user understands that SIV *must* bite the bullet on the undetectable lie, or modify the "Surrogate" to include "Humanity's relationship with Truth."

  10. *(Final check on PIM)*: If I adopt PIM, am I still holding SIV? Or have I shifted to a "Respect for Autonomy" view? I should point out that PIM actually *abandons* the core premise of SIV (that the dead can't be wronged) by acknowledging their interests persist. It's a hybrid.

      *Wait, let's look closer.* SIV: "Dead can't be wronged." PIM: "We respect ante-mortem desires." These are compatible. We aren't wronging the *dead body/spirit*; we are violating the *past agent's will*. This is the Feinberg distinction. I need to articulate this carefully.

