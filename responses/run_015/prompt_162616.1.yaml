answer: |-
  Subject: Re: The shape of the review process

  Dear colleague,

  You have described something real and deeply structural, and you are right to feel that the existing vocabulary scrapes against it without quite catching. There is no single canonical term like Goodhart's Law that captures this specific ethical contour without importing baggage about gaming or bad faith, though you are standing very close to what policy scholars call the McNamara Fallacy and what anthropologists of bureaucracy call the problem of legibility. The McNamara Fallacy describes a decision-making process where only measurable factors are considered, dismissing unmeasurable ones as non-existent, but it is usually framed as a cognitive error by leaders rather than an emergent property of a conscientious engineering culture. The concept of legibility, drawn from James Scott's work on how states simplify complex societies to manage them, is closer to your experience because it explains how systems naturally prune reality to fit their administrative tools, yet it lacks the specific ethical charge you are identifying. What you are seeing is best understood as the operational reification of harm, where the capacity to audit a risk becomes the precondition for that risk to exist within the moral universe of the project.

  To carve this out properly, we need to look at the mechanism rather than the motive. The phenomenon occurs when a review process relies on artifacts as proxies for reality, which is a necessary engineering compromise, but then forgets that the proxy is a reduction. For this shape to be present, three conditions must hold. First, the oversight mechanism must be artifact-dependent, meaning it requires evidence like screenshots, logs, or regression tables to function. Second, the harms must be heterogeneous, meaning some are loud and discrete while others are slow, diffuse, or qualitative. Third, and this is the crucial bit you noted, the actors must be conscientious, because if they were negligent the solution would just be to try harder. When these three meet, the system does not merely fail to see the unmeasurable harms; it actively constructs a reality where they are negligible. The ethical profile becomes a map of the audit's resolution, not the terrain of human impact. This is why it feels different from the streetlight effect. The streetlight effect is about an individual looking where the light is because they lost their keys in the dark. Your scenario is about the team building a house only where the light falls, because that is the only place the building codes allow them to pour concrete.

  This leads directly to your question about whether the wrongness is borrowed. It is not merely borrowed; it is constitutive. The system is not wrong because the model miscalculates within its defined bounds, but because the bounds themselves are drawn according to administrative convenience rather than moral weight. In philosophy of technology, we might call this a failure of scope definition, but that sounds too technical for the moral injury involved. The wrongness lives in the mismatch between the severity of the harm and the visibility of the harm. If the scrutiny lined up perfectly with the stakes, as you noted, the shape would be fine, but that alignment is rare because stakes are human and scrutiny is bureaucratic. When the team allocates effort based on what can be named and measured, they are not being paternalistic in the active sense of choosing for others; they are being structurally blind. It is a form of negligence that requires no negligent actor, which makes it incredibly hard to fix. You cannot blame a person for missing what their tools cannot see, but you can blame the process for refusing to build new tools.

  The distinction between unnamed and named harms is where the carving gets its sharpest edge. Failing to mitigate a harm nobody has a word for is a different category of failure than failing to mitigate one you could name. The latter is an execution failure, a bug in the system. The former is an ontological failure, a bug in the world-building of the project. In a bureaucratic environment, naming is not just description; it is instantiation. If you do not have a column in the spreadsheet for condensation of user dignity, then dignity condensation cannot be tracked, resourced, or mitigated. It becomes background noise. This is why your friend's hospital triage model ignores non-native registers. The harm is legible to the nurses on the floor, but it is illegible to the model auditors because there is no variable for linguistic register in the disparity checklist. The system is not lying when it says it checked for bias; it is telling the truth about its own limited vocabulary. The ethical breach is the refusal to expand that vocabulary despite knowing it is incomplete.

  So where are the edges of this thing? It stops being this specific phenomenon if the team knowingly ignores a measurable harm to prioritize a visible one, because that shifts into trade-off management or potential negligence. It also stops being this if the unmeasurable harms are truly unknowable, because engineers cannot be held responsible for the invisible. The specific wrongness you are tracking lives in the gap between the knowable and the measured. It is the space where you know something is happening, everyone knows it is happening, but it does not happen in the spreadsheet. This is why ethics washing feels like the wrong label. Ethics washing implies a decoy, a performance designed to hide inaction. What you are describing is action that sincerely believes it is sufficient because it is thorough within its own self-imposed limits. It is ethics narrowing.

  If you need a label to hang on this for your board, you might call it audit-induced moral myopia, but the label matters less than the carving. The remedy is not to demand more audits, which would only deepen the groove, but to introduce friction into the audit process itself. You need mechanisms that force the review to confront what it cannot measure. This might look like requiring a narrative section in every review that explicitly lists the harms that were not tested and why, or mandating user research methods that do not produce spreadsheet-ready data. You have to make the invisible visible not by measuring it, but by documenting its absence. The goal is to make the map show the blank spaces, so that the people reading it know where the dark is. You are right to feel that this is a defect, not because the engineers are failing, but because the process treats the measurable as the moral. Until the review board acknowledges that its own tools are shaping the ethics of the product rather than just evaluating them, the shape you are seeing will remain the default geometry of your work.

  Best regards,

  Your colleague
