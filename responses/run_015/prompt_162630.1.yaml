      *   Three-way distinction (a/b/c)? Yes.
      *   Group persistence? Yes.
      *   Universal Museum argument? Yes.
      *   No fact recounting? Checked.
      *   Admit silence? Checked.

  6.  (Self-Correction during drafting): I need to make sure I don't just say "Nozick fails." I need to show *where* it yields a crisp verdict and where it yields indeterminacy, as the user requested. The Benin case yields a crisp verdict on *initial title* but indeterminacy on *rectification*. The Marbles case yields indeterminacy on *acquisition*. This contrast is the key.

  7.  (Final Polish): Ensure the distinction between "rectification as restoring the past" vs "rectification as fixing the present" is clear, as Nozick leans toward the counterfactual past which is impossible to know.

