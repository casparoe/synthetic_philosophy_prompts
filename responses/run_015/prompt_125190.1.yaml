  Based on Dr. Voss's track record, I can give you a high-confidence prediction. She is almost certainly going to **approve** your proposal.

  Here is the breakdown of why, which rule she is actually using, and how to confirm it.

  ### 1. The Verdict: APPROVED
  Your proposal is the strongest fit for her precedents yet. Here is why it clears her hurdles:
  *   **Subject Status:** An enslaved domestic worker is the definition of "below." This clears the hurdle that sank the Bruges Merchant (Case 2).
  *   **Methodology:** You are using bureaucratic/elite sources (inventories/registers) to reconstruct a subaltern life *against the grain*. This matches the Florentine Wool Carder (Case 1) and Stockholm Dockworkers (Case 3).
  *   **Focus:** You are studying kinship networks and movement (social history), not a macro-political event. This clears the hurdle that sank the 1848 Paris proposal (Case 4).

  The fact that she is enslaved does not disqualify the project; in fact, in "History from Below" (HfB), recovering the agency of the enslaved from property records is considered a gold-standard move (think of the work of João Reis or Sidney Mintz). Your argument that she was "actively navigating the system" via godparent networks is exactly the kind of **agency-through-constraint** Voss seems to reward.

  ### 2. Decoding Dr. Voss's Rule
  You proposed three rules (A, B, C). Based on her four past calls, **none of them are quite right on their own.** Here is the autopsy of your hypotheses:

  *   **Rule A (Pure Scale): DEAD.**
      *   *Evidence:* She rejected the Bruges Merchant (one person) and the 1848 Paris Neighborhood (one locality).
      *   *Lesson:* Small scale does not automatically equal microhistory or history from below.
  *   **Rule C (Source-Purity): DEAD.**
      *   *Evidence:* She approved the Wool Carder and Dockworkers, neither of whom left personal voices. She rejected the Merchant, who *did* leave personal letters.
      *   *Lesson:* She does not require the subject to speak for themselves. In fact, she seems to prefer the challenge of reading "silences" in bureaucratic records.
  *   **Rule B (Agency-through-Constraint): ALIVE, but incomplete.**
      *   *Evidence:* This explains the approvals (Carder, Dockworkers, You) vs. the Merchant (who had agency but was elite).
      *   *The Missing Variable:* **Class Position.**

  **Dr. Voss's Actual Rule:**
  > **"Subaltern Subject + Reconstructing Lived Experience from Administrative Silences."**

  She is grading on **Subject Position** (must be non-elite/subaltern) combined with **Method** (must use sources to recover agency/life, not just catalog the state's view).
  *   **Case 2 (Merchant)** failed on Subject Position (Elite).
  *   **Case 4 (Paris)** failed on Method (It was "Macro history in a small container"—i.e., studying the *State/Event* through a small lens, rather than studying the *Life* through a small lens).

  ### 3. Closest Analog
  Your closest analog is **Case 1: The 14th c. Florentine Wool Carder.**
  *   **Similarities:** Single individual, no direct voice, reconstructed entirely from records created by superiors (Court vs. Owner/Church), subject is a laborer with no power.
  *   **Difference:** Your subject is enslaved, which makes the "agency" argument even more critical. The Wool Carder was a defendant (passive object of law); your subject is a godparent/networker (active social agent). If the passive carder passed, your active navigator will definitely pass.

  ### 4. The "Enslaved" Variable
  You asked if her being enslaved changes things compared to the free carder.
  *   **Risk:** The only risk is if the proposal slips into "Property History" (listing her value, her owner's wealth, etc.).
  *   **Mitigation:** Your focus on **godparent networks** and **movement between households** saves this. You are treating her as a social actor, not a capital asset. This aligns perfectly with HfB.
  *   **Verdict:** Being enslaved strengthens the "From Below" claim, provided you don't let the sources turn her into an object. Your proposal explicitly avoids this.

  ### 5. The Definitive Test Case
  You asked for **one further proposal** that would tell us which rule she is actually using. To isolate the variable, you need to test whether "History from Below" is defined by **Class** or by **Method**.

  **The Test Proposal:**
  > "A study of a single 18th-century **Royal Tax Collector** reconstructed solely from **state audit logs and correspondence with superiors**, arguing that he actively manipulated bureaucratic loopholes to protect his family from debt."

  *   **Scale:** One person (Micro).
  *   **Source:** Bureaucratic/Administrative (Same as your proposal & Case 1).
  *   **Agency:** "Manipulated loopholes" (Same Agency-through-Constraint argument as your proposal).
  *   **Subject:** State Agent/Elite (Opposite of "Below").

  **The Interpretation:**
  *   **If Voss REJECTS this:** It confirms that **Class/Subject Position is the Gatekeeper.** "History from Below" requires a subaltern subject, regardless of how clever your method is. (This is my prediction, given the Bruges Merchant rejection).
  *   **If Voss APPROVES this:** It confirms that **Method is the Gatekeeper.** She defines "From Below" as "reading against the grain of state power," even if the subject is part of the state.

  **Summary for your proposal:**
  Lean hard into the **Florentine Wool Carder** analogy in your write-up. Explicitly state that you are using administrative silences to reconstruct social agency. Do not worry about the lack of her voice; Voss has already ruled that bureaucratic traces are sufficient for HfB if the subject is "Below." You are safe.
