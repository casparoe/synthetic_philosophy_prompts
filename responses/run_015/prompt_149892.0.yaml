  Applying this to the Semmelweis label, the text fails the Normativity Check. The phrase it was not until Pasteur and Lister proved implies that the delay was an aberration rather than a structural feature of nineteenth-century medicine. The repair is to say His colleagues refused to listen, and handwashing remained uncommon until germ theory provided a mechanism they could accept. This removes the judgment of delay and replaces it with a condition of acceptance. The Computing timeline fails the Inevitability Check. The phrase the story of computing is the story of a single idea growing clearer suggests a predetermined clarity rather than a series of adaptations. The repair is to say From Babbage's Analytical Engine to the phone in your pocket, computing has expanded through competing ideas about how a machine might follow instructions. This acknowledges divergence rather than singular clarity.

  The Lovelace text requires the hardest verdict. Despite being the director's favourite and already printed on tote bags, it fails both the Normativity and Inevitability Checks critically. Calling her the first computer programmer imposes a modern job title on a historical role, and claiming the world was not yet ready implies the idea was perfect and the audience deficient. The repair is to say Ada Lovelace, 1843, wrote notes on a machine that was never built. She proposed that such a device could manipulate symbols beyond sums, though her vision found no practical application for a century. This preserves her achievement without anachronism or teleology. I know this is not the verdict you will want to hear regarding a public-facing slogan, but the procedure condemns the line because it relies on myth rather than mechanism. We cannot protect a text from correction simply because it has been printed on merchandise.

  Finally, you must understand where this procedure goes blind. It has nothing to say about whose names appear at all, which is a different failure and the one my colleagues actually argue about. Selection bias is a curatorial decision, not a textual one, and no test can diagnose why we chose Semmelweis over his contemporaries. Furthermore, this procedure might misfire in the hands of a volunteer with less background than mine. Without the ability to distinguish live alternatives from dead ones, a volunteer might apply the Contingency Check to facts that were never in dispute, creating false equivalence where none existed. They might also hesitate to assert genuine accumulation for fear of failing the Accumulation Check, resulting in texts that deny progress entirely. Use this tool to sharpen the narrative, not to dissolve it. It is a filter for distortion, not a generator of truth, and it must remain subordinate to the educational mission we share.
