  **FROM:** Office of Research Programmes (ORP)
  **DATE:** 14 October 2023
  **SUBJECT:** Annual Problem-Shift Review: Coherence Cascade Programme (CCP)

  Pursuant to University Statute 4.2, the ORP has evaluated the Coherence Cascade Programme (CCP) in Organizational Psychology against the Lakatosian Methodology of Scientific Research Programmes. The review assesses whether the CCP constitutes a progressive or degenerating problem shift for the purposes of continued funding.

  **1. Hard Core and Negative Heuristic**
  The CCP hard core posits that organizational groups dissipate a quantifiable 'cohesion energy' (CE) according to inverse-square laws. Throughout the review period (2013–2023), principal investigators have adhered strictly to the negative heuristic, refusing to falsify the existence of CE despite repeated null results. No modifications have been proposed that violate the core law; all theoretical labor has been directed toward the protective belt.

  **2. Protective Belt Adjustments**
  Anomalies regarding CE measurement have been addressed via auxiliary hypotheses concerning ambient humidity, sensor calibration latency, subject awareness of observation, and the lunar phase. While these adjustments appear ad hoc, they remain consistent with the positive heuristic, which directs researchers to refine measurement protocols rather than abandon the core law. The Office notes that each adjustment preserves the programme's continuity.

  **3. Assessment of Progress**
  Under MSRP guidelines, a programme is progressive if it predicts novel facts. The CCP successfully predicted the 'Mid-Week Cohesion Spike' (MWCS) in Q3 2022, subsequently confirmed by independent audit. This constitutes a verified novel fact. However, twenty-four other predictions regarding CE dissipation rates failed initial testing and were accommodated post-factum via belt adjustments (e.g., reclassifying 'low energy' readings as 'latent energy states').

  The Office finds itself unable to weigh the single novel fact against the twenty-four accommodated failures. Lakatosian methodology specifies that progressive shifts must exhibit theoretical growth accompanied by empirical success, but offers no arithmetic ratio for determining when accommodation outweighs prediction. The MWCS was unexpected and independently confirmed, yet the vocabulary of the framework lacks a weighting mechanism to offset the cumulative drag of the protective belt. We recognize the fact but cannot quantify its heuristic value against the auxiliary hypotheses regarding lunar phases.

  **4. Determination of Degeneration**
  The Office notes that Lakatosian methodology provides no temporal threshold for degeneration. A programme may degenerate for an indefinite period before being rationally abandoned, provided it retains theoretical unity. As the CCP retains unity and has produced one novel fact (MWCS), the Office cannot classify the shift as degenerating at this time. The ratio of accommodated facts to novel predictions is not a disqualifying metric under current guidelines. We lack a clock to measure the permissible duration of a degenerating shift before abandonment becomes rational. To declare degeneration now would be to impose a falsificationist constraint alien to the methodology; to declare progress would be to ignore the empirical stagnation. Thus, the status quo must remain indeterminate.

  **5. Recommendation**
  Funding is renewed pending further theoretical growth. The Office advises continued monitoring of the problem shift.

  **Dissenting Opinion (Committee Member D)**
  I object to the indefinite deferral of judgment. A methodology that cannot distinguish between a decade of successful rescue operations and genuine theoretical growth offers no decision procedure. We require a clock. If a programme fails to predict novel facts for ten years, it is dead. Rational reconstruction is useless for budget allocation. We are administering a philosophy, not a science.

  **Footnote 1: Reflexivity Clause**
  In accordance with Section 9 of the Research Governance Framework, the ORP must assess its own methodological status. The Office notes that its own procedural modifications (added following the 2019 Audit Failure) have successfully accommodated all subsequent administrative anomalies without generating novel administrative efficiencies. We acknowledge this may constitute a degenerating shift within the Governance Programme, but as no hard core has been violated, review continues.
