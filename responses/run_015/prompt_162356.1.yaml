answer: |-
  This is a profound question that cuts to the bone of constitutional theory. Given your background in population genetics, you are well-positioned to see the hereditary monarchy not as a political anomaly, but as a specific selection mechanism with distinct evolutionary pressures—or, in political terms, distinct *constitutive commitments*.

  You asked for the implicit theory stated as a set of commitments, tested against your "Lottery Crown" thought experiment. Here is an analysis of the commitments presupposed by the hereditary model, where the Lottery Crown fails to honor them, and what that implies about the distinction between engineering and ritual.

  ### I. The Implicit Commitments of Hereditary Monarchy

  The survival of a hereditary head of state within a democracy presupposes four specific commitments about the nature of the political community. These are not merely functional; they are ontological.

  **1. The Commitment to Trans-Generational Continuity (The Time Horizon)**
  The hereditary principle asserts that the state is not a contract among the living, but a partnership between "those who are living, those who are dead, and those who are to be born" (Burke). Heredity is the only selection mechanism that biologically encodes the past into the present. The monarch is the living artifact of the state's history.
  *   **The Commitment:** The Head of State must embody the *duration* of the polity, not just its current snapshot.

  **2. The Commitment to Ontological Distinction (The King's Two Bodies)**
  This is the medieval legal fiction modernized. The monarch possesses a "Body Natural" (which dies) and a "Body Politic" (which never dies). Heredity reinforces that the office is not a job to be performed by a citizen, but a status into which one is born. The monarch is not a "first among equals" but a distinct category of being.
  *   **The Commitment:** The Head of State must stand *outside* the category of "citizen" to effectively arbitrate between citizens.

  **3. The Commitment to Vocational Socialization (The Phenotype)**
  Heredity is not just about selection; it is about training. A hereditary monarch undergoes a lifetime of "phenotypic shaping" for the specific role of neutrality. They are raised to suppress personal political preference in favor of institutional continuity. It is a vocation, not a tenure.
  *   **The Commitment:** The restraint required of the Head of State must be inculcated over a lifetime, not imposed by statute over a short term.

  **4. The Commitment to Non-Agency in Selection (The Removal of Will)**
  In a democracy, all power derives from the will of the people (or their representatives). Heredity removes *will* from the selection of the Head of State. No one chose the monarch; nature and lineage did. This ensures that no faction can claim credit for the appointment, nor can the appointee feel indebted to a selectorate.
  *   **The Commitment:** The legitimacy of the Head of State rests on the absence of human agency in their selection.

  ### II. The Lottery Crown Test Case

  If we implement your Lottery Crown (vetted citizens, single non-renewable term, same powers), we retain the *mechanics* of democracy but alter the *symbolism* of the state. Here is where the Lottery Crown fails to honor the commitments above:

  **1. Failure of Continuity (Time)**
  The Lottery Crown represents the *present* only. A lottery winner is a cross-section of the current living electorate. They have no biological link to the predecessors and no stake in the successors beyond their own lifespan.
  *   **Consequence:** The office loses its function as a bridge to the past. It becomes a mirror of the current demographic rather than a vessel of historical continuity.

  **2. Failure of Distinction (Ontology)**
  The Lottery Winner remains a citizen. They are "one of us" temporarily elevated. This collapses the distinction between the State and the People. If the Head of State is just a random citizen, the mystique of the "Crown" as a separate legal entity dissolves.
  *   **Consequence:** The Head of State becomes a "Super-Citizen." In a crisis, their authority rests on the statute that elevated them, not on a separate sacral status. They are easier to politicize because they are ontologically identical to the voters.

  **3. Failure of Socialization (Vocation)**
  A lottery winner, even if vetted, has not been bred for neutrality. They have a life history of political opinions, debts, and biases. A single term is insufficient to overwrite a lifetime of political socialization.
  *   **Consequence:** The risk of "mandate creep." While they lack an electoral mandate, they may feel a moral mandate to interpret their random selection as a "sign" or a duty to "fix" things, lacking the lifelong training in restraint that a royal heir receives.

  **4. Failure of Non-Agency (Will)**
  A lottery is an act of administration. The State runs the lottery. The State chooses the winner. While random, it is still a *process* controlled by the current government. Heredity is pre-political; the lottery is bureaucratic.
  *   **Consequence:** The selection mechanism itself becomes subject to political tinkering (e.g., debates over the vetting criteria, the size of the pool, the randomness algorithm). Heredity is immune to this because it relies on birth, a fact not subject to legislative adjustment.

  ### III. Engineering vs. Ritual

  You ask if the difference registers in day-to-day workings or only in belief.

  **The Functionalist View (Engineering):**
  If the monarchy were purely "institutional engineering" for mandate-proofing, the Lottery Crown would be superior. It is more democratic, more egalitarian, and equally devoid of an electoral mandate. If the goal is simply to have a neutral figurehead who cannot claim a popular vote, sortition is the logical optimum.

  **The Symbolic View (Ritual):**
  The fact that heredity persists suggests the function is not merely engineering, but *ritual*. In political philosophy, ritual is not "fake"; it is the mechanism by which abstract values are made tangible.
  *   **Heredity** ritualizes **Time and Fate.**
  *   **Lottery** ritualizes **Equality and Chance.**

  The difference registers *only* in belief, but in constitutional law, **belief is the substrate of power.** If the people believe the Crown is a sacred trust spanning centuries, they accord it a deference they would not accord a lottery winner. If they believe the Head of State is just a random citizen, they will treat the office as a rotating bureaucracy.

  Therefore, the hereditary principle is best defended as **ritualized engineering.** It uses the "irrational" mechanism of bloodline to achieve the "rational" end of depoliticization. The arbitrariness of birth is a feature, not a bug; it is an arbitrariness so absolute (you cannot campaign for it, you cannot buy it, you cannot earn it) that it neutralizes political ambition more effectively than a lottery.

  ### IV. How a Democrat Should Regard This

  Should this distinction change how a democrat regards the institution?

  If you view democracy strictly as **procedural** (all authority must derive from the consent of the governed via voting), the hereditary monarchy is indefensible, and the Lottery Crown is the only acceptable alternative. It aligns with the democratic value of equality of opportunity.

  However, if you view democracy as **substantive** (the preservation of liberty, stability, and the common good), the hereditary model offers a counter-intuitive insight: **Total democratization of all offices may weaken the system's ability to check itself.**

  From your background in genetics, consider the concept of **selection pressure.**
  *   **Elected Presidents:** High selection pressure for popularity and short-term gain.
  *   **Lottery Heads:** Zero selection pressure, but high variance in competence/alignment.
  *   **Hereditary Monarchs:** Selection pressure for *survival of the institution*. The "fitness" being selected for is the ability to maintain the lineage's status over centuries. This selects for extreme caution, conservatism, and risk aversion.

  **The Verdict on the Theory:**
  The implicit theory of hereditary monarchy is that the political community requires a **fixed point** that is not subject to the fluctuating will of the majority. Heredity provides a selection mechanism that is:
  1.  **Predictable** (reducing succession crises).
  2.  **Pre-Political** (removing the office from the realm of contestation).
  3.  **Trans-Temporal** (binding the generations).

  The Lottery Crown fails because it reintroduces the *present* into the selection. It makes the Head of State a representative of the living citizens (via statistical sampling) rather than a representative of the *State itself* (as an entity distinct from the citizens).

  For a democrat, the challenge is to decide whether the "ritual" of heredity provides a stabilizing fiction that protects democracy from itself (by embodying a non-democratic check), or whether it is an incompatible aristocratic relic. The Lottery Crown reveals that if you strip away the "sacral" element of heredity, you are left with a functional head of state, but you lose the **mystique of permanence** that allows the office to constrain the government without possessing power.

  In short: The Hereditary Monarch rules by **Right** (which demands no justification). The Lottery Monarch rules by **Chance** (which invites scrutiny of the process). In a constitutional crisis, Right is a stronger shield than Chance. That is the implicit trade-off.
