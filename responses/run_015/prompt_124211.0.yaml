answer: |-
  This is a classic dilemma in social policy, but you are facing it in a microcosm where the stakes are personal and the mechanics are visible. It is completely understandable that Steve's argument is sticking in your craw. It has a superficial logical symmetry (input = output) that feels fair, but it crumbles when you touch the reality of poverty and the specific nature of your charity.

  Here is a breakdown of why Steve's argument feels wrong, followed by concrete advice on how to handle the trusteeship.

  ### 1. Is Steve's "Free Rider" argument actually good?

  Steve's argument relies on a specific metaphor: **Welfare as Insurance.**
  He argues that because people pay in (taxes), they have a contract. If you don't pay in, you can't claim. Therefore, conditions ensure you are upholding your end of the bargain.

  **Where the argument fails:**
  1.  **Category Error:** State welfare is not insurance. It is redistribution. You do not get out what you put in. A billionaire pays more tax but claims nothing; a low-income worker pays little tax but may claim tax credits. It is a social safety net based on *citizenship and need*, not an actuarial pool.
  2.  **The Charity Context (Crucial for you):** Steve's argument is completely inapplicable to your charity. The money in your fund is not a pool the recipients contributed to. It is a **bequest**. The "contract" is not between the recipient and the fund; it is between the **Donor** and the **Trustees**. The recipient is a beneficiary of a gift, not a customer of an insurance scheme.
  3.  **The "Chaos" vs. "Choice" Blindspot:** Steve assumes that not working is a *choice*. In your own observation, you noted that the people who most need money are the "worst at forms and most likely to miss an appointment." This is not free-riding; this is **capacity poverty**. Mental health issues, digital exclusion, caring responsibilities, and crisis instability make bureaucracy impossible to navigate. Conditions punish *chaos*, not *laziness*.
  4.  **The Efficiency Trap:** You mentioned the council's figures. If it costs £1.50 to police £1.00 of fraud, you have actively made the poor poorer to satisfy a moral principle. In a tiny charity, this is even more acute. If you spend 10 hours of trustee time verifying work searches, that is unpaid labour that could be spent fundraising or supporting applicants.

  **Verdict:** Steve is right that *reciprocity* is a nice social ideal, but he is wrong that *conditionality* is the only way to enforce it, and he is wrong that the "insurance" analogy applies to your specific situation.

  ### 2. The Legal Constraint: "The Deserving Poor"

  You cannot simply ignore the deed. The phrase "deserving poor" is archaic (Victorian/Elizabethan), but it is legally binding. If you give money to someone the donor would have considered "undeserving," you could technically be in breach of trust.

  However, the Charity Commission (assuming you are in the UK) expects trustees to interpret old terms in a modern context. You cannot interpret "deserving" as "morally virtuous" in a way that discriminates unlawfully or creates undue hardship.

  **You need to redefine "Deserving."**
  Historically, "deserving" meant "willing to work but unable to find it" vs. "idle."
  Modern interpretation should be: **"Those facing barriers to financial stability that are beyond their immediate control."**

  ### 3. Concrete Advice: What to write into the rules

  You need a middle path that honors the deed (satisfying the donor's intent and the cautious trustee) without creating a bureaucratic nightmare (satisfying your conscience and the practical reality).

  **Do not adopt Steve's conditions.**
  Requiring proof of job search or volunteer shifts for a small cash grant is disproportionate. It requires you to become benefit sanctioners, which you are not equipped to be. It will exclude the most vulnerable (the chaotic) and consume your budget in admin.

  **Do not adopt the "No Questions" approach.**
  This ignores the deed and the donor's specific wish to distinguish need.

  **Proposed Rule Set (The "Stewardship" Model):**

  **A. Eligibility Criteria (The "Deserving" Definition)**
  Instead of policing *behavior*, police *circumstance*. Write rules that define "deserving" as those in crisis due to structural factors.
  *   *Rule:* "Grants are available to parish residents in financial hardship who are actively seeking to improve their situation but face specific barriers."
  *   *Barriers list:* Illness, disability, caring responsibilities, lack of local employment, debt crisis, etc.
  *   *Why this works:* It honors the "deserving" clause (they must be seeking to improve) but acknowledges that "seeking" doesn't always mean "employed."

  **B. The Application Process (Low Friction)**
  *   *Rule:* "Applications may be made via self-declaration form, supported by a referral from a local professional (GP, social worker, CAB advisor, clergy) OR via simple self-certification for small amounts."
  *   *Why this works:* It outsources the "verification" to people who already know the applicant (a GP knows if someone is sick; a CAB advisor knows if someone is in debt). It saves *you* from reading bank statements.

  **C. The "Reciprocity" Clause (Addressing Steve's Point)**
  If you want to honor the spirit of reciprocity without the cruelty of sanctions:
  *   *Rule:* "Recipients of grants over £X are invited (but not required) to provide feedback on how the grant assisted their stability, or to volunteer information on how they plan to use the funds to resolve their crisis."
  *   *Why this works:* It treats the recipient as an adult partner, not a suspect. It creates a paper trail of "intent to improve" (satisfying the deed) without punishing them if life gets in the way.

  **D. The Cost Cap (Addressing the Efficiency Trap)**
  *   *Rule:* "Trustees shall not incur administrative costs to verify eligibility that exceed 10% of the grant value."
  *   *Why this works:* It hardwires your intuition about the council's fraud figures into the rules. It prevents you from spending £50 of admin time to save £20 of grant money.

  ### 4. How to handle the other Trustees

  You are stuck between Steve (Conditions) and the Other Trustee (No Conditions). Here is how you frame the compromise to them:

  **To Steve:**
  "Steve, I agree that we shouldn't reward idleness. But this isn't state insurance; it's a gift. If we make the rules too hard, we won't catch the free riders, we'll catch the depressed and the chaotic. The donor wanted to help the 'deserving,' not the 'bureaucratically competent.' Let's define deserving as 'facing barriers' rather than 'proving job search.' It keeps the moral distinction without making us debt collectors."

  **To the Other Trustee:**
  "I agree we shouldn't judge people's morals. But the Deed legally says 'deserving.' If we ignore that, we risk the Charity Commission or the donor's heirs challenging us. We need *some* criteria to show we are stewarding the fund as intended. Let's use 'barriers to stability' as the criteria. It's inclusive, but it still filters for need."

  ### 5. Summary Decision

  1.  **Reject the Insurance Analogy:** It does not apply to bequests.
  2.  **Keep "Deserving":** You are legally bound to it, but redefine it as "facing barriers" rather than "moral worthiness."
  3.  **Minimize Policing:** Use third-party referrals (GPs, advisors) rather than trustee investigations. It is cheaper and kinder.
  4.  **Prioritize Distribution:** With only £2,000, your primary duty is to relieve poverty, not to police morality. If you give £2,000 away and £50 goes to someone who didn't "deserve" it, that is a better outcome than giving £1,000 away because you spent the rest on checking forms.

  Steve's argument works in a philosophy seminar; it fails in a parish charity. Your job is not to be the state; it is to be a helpful neighbour with a bit of cash. Write rules that let you be that neighbour.
