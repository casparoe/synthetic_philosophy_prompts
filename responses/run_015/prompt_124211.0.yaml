      *   *Reject Steve's specific conditions:* Work search/volunteering is too administrative and exclusionary for a £2k fund.
      *   *Reject the "No Questions" approach:* Violates the deed ("deserving").
      *   *Propose "Positive Criteria" instead of "Negative Policing":* Focus on *need* and *willingness to improve situation* rather than *proof of job search*.
