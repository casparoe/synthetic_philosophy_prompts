          *   Donor Intent: The original donor *wanted* the distinction made ("deserving").
          *   Efficiency: Policing conditions costs money/time that could be given as aid.
      *   **Goals:**
          1.  Evaluate Steve's "free rider" argument philosophically/practically.
          2.  Provide concrete advice on what to write into the charity rules.
          3.  Find a definition of "deserving" that doesn't punish chaos.
          4.  Address the cost of policing vs. giving.

  2.  **Deconstruct Steve's Argument (The "Free Rider" Analogy):**
      *   *Premise 1:* Welfare is an insurance pool paid into by wages.
      *   *Premise 2:* Taking out without putting in is free riding (like car insurance).
      *   *Conclusion:* Conditions are legitimate enforcement of the contract.
      *   *Critique:*
          *   **Category Error:** State welfare isn't actually insurance. You don't get out what you put in. It's redistribution based on need/citizenship, not actuarial contribution.
          *   **The Charity Context:** This is crucial. The user's charity money is *not* from a pool the recipients contributed to. It's a bequest. Steve's analogy fails completely here. The "contract" is between the donor and the trustees, not the recipient and the state.
          *   **Moral Hazard vs. Barrier to Entry:** Conditions aim to prevent moral hazard (laziness), but often create barriers for the most vulnerable (chaos, mental health, digital exclusion).
          *   **Efficiency:** As the user noted, enforcement costs money. In a small charity, this is disproportionately high.

  3.  **Address the "Deserving Poor" Legal/Historical Context:**
