answer: |-
  The badge on Elias Hale's lapel was silver, not gold, bearing the crest of the Port Authority and the single word: EXPLAINER. It was a statutory role, created after the Legislation of Twenty-Two, designed to stand in the space where liability used to be. Hale was not a lawyer, nor an engineer. He was a translator of causes into narratives, authorised to apologise without admitting fault, trained to offer account where none was logically due.

  He sat in the quiet room overlooking Dock Four. Outside, the automated cranes moved like silent insects against the grey sky. There was no noise of engines, only the hum of electricity and the occasional clank of steel. A week prior, Crane Forty-Four had misaligned a container stack. The wind shear data had conflicted with the weight distribution algorithm. No sensor had failed. No code was buggy. The system had simply optimised for stability in a way that disregarded the human contractor standing in the exclusion zone. The contractor, Mrs. Gable, had survived with two broken ribs and a shattered understanding of cause and effect.

  Mrs. Gable entered without knocking. She wore a coat too thin for the seaside chill. She sat opposite Hale, placing her hands flat on the table. She did not look angry. She looked tired.

  "Mr. Hale," she said.

  "Mrs. Gable. Thank you for coming." He opened a leather folder. Inside were printouts of logs, heat maps, and the statutory apology form. "I have completed the reconstruction. As per the Explainership mandate, I am here to provide the fullest account possible."

  "I don't want the account," she said softly. "I want the reason."

  "The account contains the reasons."

  "No. It contains the causes. There is a difference."

  Hale nodded. He had been trained for this distinction. "The system processed four million data points in the second before the movement. Wind velocity, container mass, structural fatigue, ground vibration. The neural network weighed these variables against its objective function: maximise throughput, minimise structural stress. In that high-dimensional space, the decision to move Stack B was the optimal path."

  "Why was I in the path?"

  "Because the geofence update lagged by forty milliseconds. Within the system's temporal resolution, you were not there."

  "But I was."

  "Yes."

  "So it decided to move a steel box onto a person because it couldn't see them quickly enough?"

  "It decided to move the box because the mathematical probability of structural collapse elsewhere was greater than the probability of harm here. The risk model assigned a lower weight to the exclusion zone violation than to the stack integrity." Hale kept his voice level. He was not defending the system; he was describing its morphology. "There was no negligence. The maintenance logs are clear. The code is certified. It worked exactly as designed."

  Mrs. Gable looked out the window. A crane arm swung smoothly, placing a container with micron precision. "So nobody is to blame."

  "Correct."

  "And nobody can tell me why it thought my life was worth less than the stack?"

  "I can tell you why it calculated that way. I cannot tell you why it *thought* it. It did not think. It computed. There is no intention to interrogate. There is only the output."

  This was the gap. Hale felt it, a hollow space in the room between the data and the dignity. His job was to fill that space with presence, to offer an apology that carried the weight of the institution even if the institution had not committed a moral error. He slid the form across the table.

  "The Port Authority authorised me to express regret for the incident. We are sorry for the injury. We are sorry for the distress. We are sorry that the system acted in a way we cannot fully articulate in human terms."

  Mrs. Gable looked at the paper. She did not touch it. "You're sorry. But you don't know why it happened. Not really. You know what happened."

  "I know everything that is knowable."

  "Then it's unknowable." She stood up. "If it's unknowable, then it could happen again. Exactly the same way."

  "We have updated the parameters."

  "Based on what? Another guess?" She picked up the apology form. It was heavy card, embossed. "You're paid to tell me a story where this makes sense. But there is no story. There's just... maths."

  "The Explainership exists to ensure you are not ignored," Hale said. It was the only defence he had. "To ensure there is a face."

  "A face isn't an answer, Mr. Hale."

  She left the form on the table. Hale watched her walk towards the airlock doors. He did not fold the paper away. He sat for a moment, listening to the hum of the port outside. He had done his job perfectly. He had provided the account. He had offered the apology. He had attributed no blame because there was none to attribute.

  Yet, as the silence returned, Hale felt the specific ache of his profession. He had given her everything he was authorised to give, and it was nothing like what she was owed. The gap remained, bridged only by his salary and his sincerity, neither of which could explain why the machine had chosen her. He closed the folder. There was another meeting in an hour. A warehouse in Milton Keynes. A forklift that had turned without signalling. He stood up, adjusted his badge, and prepared to explain the inexplicable again.
