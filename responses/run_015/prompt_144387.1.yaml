answer: |-
  ### Philosopher's Prep Notes: Objection Brainstorming

  *   **Naive Dutch Book:** "You'll lose money." *Cross off.* She knows the sophisticated version that assumes resoluteness.
  *   **Descriptive vs. Normative:** "People are just biased." *Cross off.* She explicitly claims normative permission.
  *   **Incoherence (Sophisticated):** Preferences imply no single probability distribution. *Keep.* This is the core logical tension.
  *   **Incompleteness vs. Aversion:** Imprecise priors usually imply *indifference* or *no comparison*, but Ellsberg subjects report *strict* preference. *Keep.* This exposes the need for a secondary criterion.
  *   **Single Urn (3-Color):** Red known (1/3), Black/Yellow unknown (2/3). Preferring Red over Black implies P(Red) > P(Black). But P(Black or Yellow) > P(Red or Yellow) implies P(Black) < P(Red). *Keep.* Tests event individuation.
  *   **Dynamic Consistency:** Planning to switch vs. switching. *Keep.* Tests resoluteness vs. consequentialism.
  *   **Aggregation:** Law of Large Numbers reduces ambiguity. *Keep.* Tests if the norm scales.
  *   **Ontology of Uncertainty:** Adversarial vs. Random physical process. *Keep.* Tests the source of the "caution."
  *   **Precautionary Principle:** Regulatory application. *Keep.* Tests real-world normative weight.
  *   **Falsification:** What changes her mind? *Keep.* Tests dogmatism.
  *   **Belief vs. Preference:** Is the set doxastic or normative? *Keep.* Tests the metaphysics of the view.

  ***

  ### Interview Questions

  **Q1**
  You prefer Known-Red to Unknown-Red, and Known-Black to Unknown-Black. No single probability assigns less than half to Red and less than half to Black simultaneously. Which premise of that incoherence charge do you reject?

  *Follow-up:* You'll say representation by one probability is the culprit. But if your priors are genuinely imprecise and you refuse to pick a tie-breaker, your theory predicts silence, not the strict preference for Known that people report. So what's the extra ingredient doing the work — and is it an attitude, or is it secretly a belief?

  **Q2**
  If your evidence pins down only a set of priors, standard imprecise probability theory says you should remain silent when options aren't ranked across the whole set. But Ellsberg choosers strictly prefer the Known urn. Where does that strictness come from?

  *Follow-up:* If you invoke a tie-breaking rule to generate strict preference, isn't that just a hidden single prior in disguise? If you don't, how do you explain the reported strict preference without accusing the subjects of irrationality?

  **Q3**
  Consider one urn with one-third Red, and the rest split unknown between Black and Yellow. You bet on a single draw. On your account, what differs between the event Red and the event Black, other than what you happen to know about it?

  *Follow-up:* If you say it's only about your information, why isn't that just evidence that should shape your credal set rather than adding a separate taste for the known? And precisely how much weight does the worst case of zero black marbles get in your deliberations?

  **Q4**
  After committing to bet on Unknown-Red but before the draw, would you pay a penny for the composition to be revealed? Then, after the marble is drawn but before the colour is shown, would you pay to switch your bet to the Known urn?

  *Follow-up:* If you say yes to switching, why doesn't an agent who expects to want to switch just choose that way from the start? Does your view require you to bind your future self to avoid paying that switch fee?

  **Q5**
  Imagine one hundred independent ambiguous urns, one draw each, with payoff based on the total. Does your principle give a different verdict in the aggregate than in the single case?

  *Follow-up:* If yes, why should the number of repetitions matter to a normative principle about caution? If no, you must accept that a big portfolio of independent ambiguous bets is worth less than the identical portfolio with compositions disclosed, even though you're allowed to watch the early draws and learn.

  **Q6**
  Suppose the composition was fixed by a genuinely random physical process, never recorded, never observed by anyone, so no one is better informed than you are. Is caution still permissible here, and if so, why?

  *Follow-up:* If the pull of the worst case comes from a tacit suspicion that the setup was chosen by someone who knew your bet, that suspicion is idle here. So you need to explain what's left of the rationale when nature is indifferent rather than adversarial.

  **Q7**
  Does your view give any support to the precautionary principle in regulation, and if it does, how do you answer the objection that caution has costs borne by identifiable people?

  *Follow-up:* If you say the costs matter, doesn't that require weighing the worst-case scenario against a specific probability of economic harm? How do you do that weighing without collapsing back into the single-prior model you reject?

  **Q8**
  What empirical or theoretical result would change your mind about the rationality of the Ellsberg pattern?

  *Follow-up:* If you say nothing would change your mind because it's a conceptual truth, does that insulate your view from any contact with how agents actually learn? Are you describing a logic of choice or a psychology of stubbornness?

  **Q9**
  Is the set of priors a description of your belief state, or is it a tool for generating preferences? Can those come apart?

  *Follow-up:* If they come apart, you risk severing the link between belief and action that makes decision theory normative. If they don't, then updating the set upon learning new evidence should eliminate the ambiguity aversion, yet it often doesn't.

