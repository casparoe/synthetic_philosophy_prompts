      *   **Constraint:** Avoid obvious/superficial answers. Dig into the philosophical nuance of *why* the state is allowed to intervene.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Lord Devlin (Legal Moralism):** Society is a community of ideas, not just political/economic. Shared morality is the bond. If morality erodes, society disintegrates. The state has a right to protect itself. Law can enforce morality *as such*, not just prevent harm (though harm to society is the ultimate justification). Key test: The "12 Jurors" test (what would ordinary people feel deep disgust/indignation about?).
      *   **H.L.A. Hart (Liberalism/Harm Principle):** Follows Mill. Law should only prevent harm to others. Morality alone is insufficient. Private morality is not the state's business. Distinguish between "positive morality" (current social norms) and "critical morality" (rational principles). Fear of disintegration is exaggerated (the "disintegration thesis").

  3.  **Apply to Non-Consensual Intimate Image Sharing (NCII):**
      *   *The Act:* Sharing private sexual images without consent.
      *   *The Harm:* Psychological distress, reputational damage, harassment, potential job loss.
      *   *The Moral Dimension:* Violation of trust, sexual privacy, dignity.

  4.  **Drafting - Step 1: Devlin's Argument (Charitable Reconstruction):**
      *   *Avoid:* "Sex is sacred, so ban it."
      *   *Focus:* The breach of trust and the commodification of intimacy.
      *   *The "Root System":* Devlin argues society needs a shared conception of how individuals relate to one another. NCII isn't just a private wrong; it undermines the *institution* of trust in intimate relationships. If people cannot trust partners with their vulnerability, the social fabric of intimacy frays.
      *   *The 12 Jurors:* Would the ordinary person feel "intolerance, indignation, and disgust"? Yes. It's not just "disapproval"; it's a visceral reaction to betrayal.
      *   *Societal Self-Defense:* A society that permits the weaponization of intimacy against its members undermines the security necessary for citizens to flourish. It's not about enforcing a specific sexual code (e.g., no premarital sex) but enforcing the *moral precondition* of sexual interaction (consent and privacy).

  5.  **Drafting - Step 2: Hart's Reply (The Liberal Critique):**
      *   *Focus:* Distinguish between *harm* and *moral offense*.
      *   *The "Minimal Rules":* Hart might concede some overlap with the Harm Principle. But the prompt asks to dig deeper into the *moralist* justification.
      *   *Critique:* Is the "disintegration" real? Does NCII actually threaten the state? Or is it a private tort?
      *   *Culture-Specific vs. Universal:* Is the outrage about "privacy" universal, or is it about specific norms of sexual modesty? Hart would argue we should criminalize based on *harm* (psychological, economic), not based on the violation of a shared moral sentiment about sexual propriety.
      *   *The Slippery Slope:* If we ban NCII because it violates "shared morality," what other private sexual behaviors become criminalizable?

  6.  **Drafting - Step 3: The "Root System" Analysis:**
      *   Does NCII threaten the tree?
      *   *Devlin:* Yes. Trust is the root. Without it, the tree falls.
      *   *Hart:* No. The tree is robust. We can prune this branch (criminalize) because of *harm*, not because the roots are rotting. If we say the *roots* are rotting, we open the door to policing consensual adultery or other private acts.

  7.  **Drafting - Step 4: The Strongest Hart-Side Reply:**
      *   Hart needs to hit Devlin on the *definition* of the harm.
      *   Argument: You (Devlin) are conflating "harm to society's structure" with "harm to individuals." We can ban NCII under the Harm Principle (psychological/economic damage to the victim). We *don't need* Legal Moralism. Invoking Legal Moralism is dangerous because it implies the state owns the morality of the bedroom. If the victim *forgives* the sharer, does the state still prosecute? If it's a moral wrong against society, yes. If it's a harm against the victim, maybe not (or less so). This shows the danger of Devlin's view.

