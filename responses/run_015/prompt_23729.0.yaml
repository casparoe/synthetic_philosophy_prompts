answer: |-
  This is an excellent pedagogical pivot. Moving the Hart-Devlin debate from the Wolfenden Report (homosexuality and prostitution in 1950s Britain) to non-consensual intimate image sharing (NCII) forces students to confront the *structure* of the arguments rather than the historical baggage.

  Here is a reconstruction of the debate applied to NCII, designed to help your students distinguish between criminalizing an act because it causes *harm* (Hart/Mill) versus criminalizing it because it violates the *moral fabric* necessary for society to exist (Devlin).

  ### I. Devlin's Reconstruction: The Betrayal of the Invisible Bonds

  To present Devlin charitably, you must steer students away from viewing him as a religious zealot who wants to police bedrooms. Devlin's argument is functionalist and sociological. He argues that a society is not just a political arrangement; it is a community of ideas held together by "invisible bonds" of shared morality. If those bonds rot, the society disintegrates.

  **The Argument for Criminalizing NCII:**
  Devlin would argue that NCII is not merely a private tort between two ex-lovers; it is an assault on the **institution of trust** that underpins intimate human relationships.

  1.  **The "12 Jurors" Test:** Devlin asks us to imagine a jury of twelve ordinary people. If they feel "intolerance, indignation, and disgust" toward an act, that is evidence that the act violates the shared morality essential to that society. In the case of NCII, the visceral public reaction is not just "that's mean," it is "that is a fundamental violation of what it means to be a person in relation to another." The disgust is not about sexual prudery; it is about betrayal.
  2.  **The Root System:** Using your metaphor, Devlin would argue that sexual privacy and the expectation of confidentiality within intimacy are part of the root system, not just a branch. Why? Because society relies on individuals being able to form vulnerable bonds. If the law treats the weaponization of intimacy as a mere private dispute (like a breach of contract), it signals that the state does not view trust as a public good.
  3.  **Societal Self-Defense:** Devlin contends that society has a right to preserve its own existence. A culture where intimacy is routinely weaponized creates a citizenry that is cynical, isolated, and fearful of vulnerability. This erodes the "minimum moral structure" required for a flourishing community. Therefore, the state is justified in criminalizing NCII not simply because the victim suffers (though they do), but because the *act itself* degrades the shared moral environment that holds the "tree" of society upright. To allow it is to let the roots rot.

  **The Nuance:** Devlin is not arguing for banning all sexual immorality. He distinguishes between private vices that remain private and those that become public threats to the moral order. NCII, by its nature, takes the private and makes it public without consent, thereby dragging the moral breach into the public sphere.

  ### II. Hart's Reply: Harm vs. Moral Disintegration

  Hart's response should not be that "revenge porn is okay." His point is about the *justification* for state coercion. He would challenge Devlin's "disintegration thesis" and demand a distinction between **critical morality** (rational principles of justice) and **positive morality** (current social feelings).

  **The Argument Against Devlin's Moralism:**
  1.  **The Disintegration Thesis is Exaggerated:** Hart would argue that Devlin assumes society is far more fragile than it is. A liberal society can tolerate significant moral diversity without collapsing. Does the existence of NCII actually threaten the state's existence? No. It threatens specific individuals. We should address the threat to the individuals, not invent a metaphysical threat to "society."
  2.  **Minimal Rules vs. Comprehensive Morality:** Hart would ask: Is the prohibition against NCII a "minimal rule" necessary for any society to function (like prohibitions against violence or theft), or is it a specific cultural norm about sexual modesty?
      *   *Hart's Concession:* Hart might concede that NCII overlaps with the **Harm Principle**. The psychological damage, reputational destruction, and economic loss constitute clear "harm to others."
      *   *Hart's Critique:* However, if we criminalize it on *Devlin's grounds* (moral violation), we open the door to criminalizing acts that cause no harm but offend moral sensibilities. If the law's power comes from enforcing shared morality, what stops the state from punishing consensual adultery or polyamory, which also violate "shared expectations" of sexual exclusivity?
  3.  **The Danger of the "Root System":** Hart would warn your students that calling something a "root" is a rhetorical move, not a logical proof. Devlin claims NCII rots the roots. Hart says: "Prove it." If we criminalize based on the *feeling* that the roots are threatened, we allow the majority's disgust to dictate the law. This turns the law into a weapon of the majority against the minority, rather than a shield for the vulnerable.

  ### III. The Strongest Hart-Side Reply (The "Victim Consent" Trap)

  To make this stick for your students, you need to push Hart's argument to its sharpest point. The strongest reply Hart can offer Devlin in this specific case revolves around **who owns the wrong.**

  **The Argument:**
  If Devlin is right that NCII is a crime against the *shared moral order* (the root system), then the victim's wishes should be secondary. The crime is against Society.
  *   *Scenario:* Suppose a victim of NCII reconciles with the ex-partner and asks the state *not* to prosecute.
  *   *Devlin's Position:* The state should arguably proceed anyway. The moral bond was severed; the public order was violated. The victim cannot "forgive" a crime against the social fabric.
  *   *Hart's Position:* This reveals the tyranny of Legal Moralism. If the harm is primarily to the *victim* (psychological, reputational), then the victim's autonomy matters. If we treat it as a moral wrong against society, we strip the victim of agency over their own trauma.

  **Hart's Clincher:** "Lord Devlin, we can ban this conduct without your help. We do not need to claim that society is disintegrating to acknowledge that a human being is being devastated. By invoking the 'invisible bonds,' you are not protecting the victim; you are protecting the majority's feeling of moral security. We should ban NCII because it is a digital assault, not because it is a sin."

  ### IV. Where the Case Lands (For Seminar Discussion)

  This is the prompt for your class to debate, but here is the analytical verdict you can offer to close the session:

  The case of NCII actually **exposes a weakness in Hart's strict Harm Principle while vindicating his conclusion, but it reveals a danger in Devlin's reasoning.**

  1.  **Why Hart Wins the Justification:** We *should* ban NCII, but Hart is right that we must do so based on **harm** (psychological, economic, dignitary harm), not **moralism**. If we base it on moralism, we cannot easily distinguish NCII from other non-harmful but "immoral" sexual behaviors. The Harm Principle provides a limiting principle that Legal Moralism lacks.
  2.  **Why Devlin Explains the Intensity:** However, Devlin explains *why* the harm feels so severe. The harm isn't just "distress"; it's the specific distress of *betrayal*. That feeling relies on a shared understanding that intimacy implies privacy. In that sense, Devlin is right that there is a "shared morality" of trust that makes the harm possible. Without that shared norm, the image is just a picture; with the norm, it's a weapon.
  3.  **The Verdict:** The case lands on **Hart's side of the line, but requires Devlin's insight to define the harm.**
      *   *For the Law:* We use Hart's framework (Harm Principle) to justify the statute. This protects us from over-criminalization.
      *   *For the Understanding:* We use Devlin's insight to understand the *nature* of the harm. The harm is constituted by the violation of a shared moral expectation of privacy.

  **Seminar Takeaway:**
  Tell your students: "Devlin helps us see *why* it hurts; Hart helps us decide *why* we ban it." If you ban it because it violates morality, you are a Legal Moralist. If you ban it because it causes severe psychological and reputational harm *derived* from a violation of trust, you are a Liberal. The practical outcome is the same (criminalization), but the constitutional and philosophical architecture is radically different. One architecture protects the minority from the majority's disgust; the other empowers the majority to police the roots of the tree.
