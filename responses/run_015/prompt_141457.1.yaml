prompt: |-
  I am reading a recent popular book about how scientific reclassification changes what our words mean — there is a chapter on whales, fish, and the shifting boundaries of natural kinds — and it contains what it presents as a sympathetic but critical account of Quine's "Two Dogmas of Empiricism". I cannot tell how much of it to trust. The chapter says, more or less, the following:

  Quine's target was the positivist picture on which every true statement has two components, a linguistic one and a factual one, so that some statements — the analytic ones — are true by meaning alone, with the factual component set to zero. He then asks what "true by meaning alone" amounts to, and shows that each of the answers on offer goes in a circle. A bachelor is an unmarried man, but ask what makes "bachelor" and "unmarried man" synonymous and you are told: they can be substituted for one another without change of truth value. Press on that and you are told: they can be substituted necessarily, that is, in every possible world — and "necessarily" turns out to mean nothing more than "analytically". Meaning, synonymy, definition, necessity: four names for one unexplained notion. The conclusion is therefore negative: there are no analytic truths, only statements we are, for the time being, extremely unwilling to give up. That is the first dogma dispatched. The second is reductionism, the idea that each statement can be checked against experience on its own; against it Quine sets holism, the view that our statements meet experience as a body, so that in principle even the laws of logic are revisable. What survives is genuinely useful, though: analyticity was never a special kind of truth, just a sociological fact about which sentences a community has stopped arguing about. Better still, the notion can be rescued by restating it epistemically. Call a statement analytic when a competent speaker who understands it can see that it is true without going and looking. "All vixens are female" qualifies; "all swans are white" does not. Notice the consequence, which the argument of this book depends on: analyticity is not timeless. "Whales are mammals" was not analytic in 1750 and is analytic now, because once the taxonomists had settled the question, the sentence became one you can know simply by knowing what the words mean. Analyticity is a status a sentence acquires when the inquiry around it goes quiet.

  Three things about this leave me uneasy. The first is the chapter's rescue: I am inclined to think it misses the point, since Quine's complaint was precisely that nobody can say what "in virtue of meaning" comes to, and "seeable as true just by understanding the words" looks like the same idea in different words — but I read the paper before I read the book, so that may just be loyalty to my first source. The second is the whale case: it strikes me that the interesting option is that "whales are mammals" is necessary but knowable only a posteriori, not that its meaning quietly changed somewhere around the eighteenth century, and that the chapter needs the second option for its own purposes. The third is the framing of the dogmas, about which a friend has said two things I cannot adjudicate: that Quine's own view is that the two dogmas are at root one dogma rather than two independent targets, and that what the paper undermines is not the distinction itself but the epistemological work the logical positivists wanted the distinction to do.

  I would be grateful for a clause-by-clause audit rather than a general verdict. Please tell me which claims about Quine you would accept as stated, which are standard simplifications that a specialist would wince at but which do no real damage, which are substantive misreadings, and which are things Quine would explicitly deny — and, where a claim is wrong, what the accurate version of it would be. In particular:

  Does the chapter's epistemic restatement of analyticity escape the circularity Quine alleges, or does the circle reappear one step later? If it fails, say exactly where; if it can be repaired, say what would have to be added, and whether what remains is still able to do the work analyticity was supposed to do.

  What does the whale case actually show? Argue for whichever of the two readings you favour, and set out plainly what each one costs — in particular whether the chapter's reading commits it to saying that a reclassification changes the meaning or the reference of "whale", and what that would predict about what eighteenth-century naturalists were talking about.

  What verdicts does the chapter's criterion deliver on cases it has not considered, and do those verdicts look right to you: "water is H₂O"; "every vixen is a fox"; a long and complicated tautology that no competent speaker could verify by inspection alone; "I am now conscious".

  Finally, the chapter closes by concluding that, since analyticity is merely a sociological status, no philosophy that leans on conceptual analysis can get off the ground. Does anything like that follow from the parts of the chapter that are correct? Or is there a defensible position in between the positivist picture the chapter describes and the scepticism it ends with?

  Please write in British English, and assume that I know the broad outlines of the period but not the secondary literature, so do not lean on the names of commentators without explaining what their view is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is reading a popular science/philosophy book about scientific reclassification (natural kinds, whales vs. fish). It contains a chapter discussing Quine's "Two Dogmas of Empiricism".
      *   **Task:** Audit the chapter's account of Quine clause-by-clause. Distinguish between accurate claims, harmless simplifications, substantive misreadings, and explicit denials by Quine.
      *   **Specific Questions to Address:**
          1.  Does the chapter's epistemic restatement of analyticity escape Quine's circularity charge?
          2.  What does the "whale case" actually show? (Necessary a posteriori vs. meaning change).
          3.  What verdicts does the chapter's criterion deliver on specific test cases ("water is H₂O", "vixen is a fox", complex tautologies, "I am now conscious")?
          4.  Does the conclusion (conceptual analysis is dead) follow? Is there a middle ground?
      *   **Constraints:** Write in British English. Assume knowledge of broad historical outlines but not secondary literature (explain commentators if used). Avoid general verdicts; be specific.

  2.  **Deconstruct the Chapter's Claims (as presented by the user):**
      *   *Claim 1:* Positivists thought every statement has linguistic + factual components. Analytic = factual component zero.
      *   *Claim 2:* Quine argues "true by meaning alone" is circular (synonymy, definition, necessity all interdefine).
      *   *Claim 3:* Quine's conclusion: No analytic truths, only statements we are unwilling to give up.
      *   *Claim 4:* Second dogma is reductionism (statement-by-statement verification). Quine offers holism (body of statements). Logic is revisable.
      *   *Claim 5 (The Rescue):* Analyticity is epistemic: true just by understanding words (e.g., "vixens are female").
      *   *Claim 6 (The Whale):* "Whales are mammals" was not analytic in 1750, is analytic now. Analyticity is a status acquired when inquiry goes quiet.
      *   *Claim 7 (Conclusion):* Analyticity is sociological. Conceptual analysis cannot get off the ground.

  3.  **Evaluate Claim by Claim (Mental Draft & Fact-Checking):**

      *   *Claim 1 (Positivist Picture):* Roughly accurate simplification. Carnap is the main target. The idea of "components" is a bit metaphorical but captures the verificationist spirit.
      *   *Claim 2 (Circularity):* Accurate. This is Section II of "Two Dogmas". Quine argues synonymy is explained by analyticity and vice versa.
      *   *Claim 3 (Conclusion - Unwillingness):* Accurate to Section VI. Quine suggests the distinction is a matter of degree, not kind.
      *   *Claim 4 (Reductionism/Holism):* Accurate. First dogma = analytic/synthetic distinction. Second dogma = reductionism. They are linked. Holism is the alternative.
      *   *Claim 5 (Epistemic Rescue):* **Problematic.** Quine explicitly rejects this. "Truth by convention" or "knowable by understanding" is exactly what he attacks as obscure. The book tries to save analyticity; Quine wanted to bury it (or at least blur it beyond recognition).
      *   *Claim 6 (The Whale):* **Substantive Misreading.** This sounds like a Kripkean/Putnamian point (necessary a posteriori) dressed up as Quinean meaning change. Quine doesn't believe in "necessary truths" in the modal sense easily. But more importantly, saying "Whales are mammals" *became* analytic implies the meaning of 'whale' changed. Quine would say our *theory* changed. The book seems to conflate Quine with a conventionalist view of natural kinds.
      *   *Claim 7 (Conceptual Analysis Dead):* **Overstatement.** Quine naturalised philosophy; he didn't end it. Conceptual analysis transforms into empirical inquiry into language/use.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the quality of the user's skepticism. Set the tone (British English, rigorous but accessible).
      *   **Audit of the Account (Clause-by-Clause):**
          *   *Positivist Picture:* Acceptable simplification.
          *   *Circularity Argument:* Accurate summary of Section II.
          *   *Unwillingness to Give Up:* Accurate summary of Section VI.
          *   *Reductionism/Holism:* Accurate.
          *   *Friend's Comment:* Crucial point. The dogmas are interdependent. The book treats them too separately.
      *   **The Epistemic Restatement (Question 1):**
          *   Does it escape circularity? No. "Understanding the words" presupposes knowing the meaning. If meaning *is* the analytic truth, it's circular.
          *   Quine's objection: How do you individuate meanings?
          *   Repair? Grice/Strawson style (conventional truth), but Quine rejects intensions.
          *   Work it does: It makes analyticity psychological/sociological, not logical.
      *   **The Whale Case (Question 2):**
          *   Book's view: Meaning changed (1750 vs. Now).
          *   Alternative (Kripke/Putnam): Reference fixed, discovery made (Necessary A Posteriori).
          *   Quine's view: Theory change. 'Whale' is a posits in a theory.
          *   Cost of Book's view: Commits to meaning change. Implies 18th-century naturalists meant something different (incommensurability?).
          *   Cost of Kripkean view: Essentialism (which Quine hates).
          *   Verdict: The book uses Quine to support a view Quine wouldn't endorse (stable meanings that shift status). Quine thinks meanings are murky; better to talk of sentences and theory.
      *   **Test Cases (Question 3):**
          *   "Water is H₂O": Book says not analytic (need to look). Kripke says necessary a posteriori. Quine says theoretical truth.
          *   "Every vixen is a fox": Book says analytic. Quine says central to the web, hard to revise.
          *   "Long tautology": Book says not analytic (can't verify by inspection). This breaks the link between analyticity and truth. Analytic truths shouldn't depend on cognitive capacity.
          *   "I am now conscious": Book says not analytic (empirical?). Descartes would disagree. Quine would treat it as observation sentence.
          *   *Critique:* The epistemic criterion confuses *epistemology* (how we know) with *semantics* (what makes it true).
      *   **Conclusion on Conceptual Analysis (Question 4):**
          *   Does it follow? No.
          *   Middle Ground: Naturalised epistemology. We study how we learn language. Conceptual engineering.
          *   Quine doesn't kill philosophy; he moves it into the scientific continuum.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Friend's Comment:* The friend is right. Quine says the two dogmas are "at root one". The book treats them as distinct steps. I need to highlight this.
      *   *Nuance on Analyticity:* Quine doesn't say "there are no analytic truths" in a flat-footed way. He says the *boundary* is not sharp. The book says "no analytic truths, only unwillingness". That's close enough for a summary, but the "Rescue" contradicts the "Negative Conclusion". You can't have it both ways (no analyticity *and* here is a new definition of analyticity).
      *   *The Whale:* The book's claim that "Whales are mammals" *became* analytic is a form of Carnapian explication or conceptual change, but attributing this to Quine is tricky. Quine is skeptical of "meanings" as entities that change. He prefers to talk of changes in theory. I must emphasize Quine's ontological parsimony.
      *   *British English:* Ensure spelling (analyse, behaviour, centre) and idiom (whilst, whilst, favour).

  6.  **Final Polish:** Check against specific constraints.
      *   Clause-by-clause audit? Yes.
      *   Epistemic restatement evaluation? Yes.
      *   Whale case analysis? Yes.
      *   Test cases? Yes.
      *   Conclusion on conceptual analysis? Yes.
      *   No unexplained commentator names? (Explain Grice, Strawson, Kripke if used).
      *   British English? Yes.

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Your unease is well-founded. The chapter you describe offers a digestible narrative, but in smoothing out Quine's arguments to fit a story about scientific reclassification, it introduces distortions that would make a specialist wince. It conflates Quine's scepticism with a sociological conventionalism that Quine would largely reject, and it attempts to rescue a notion of analyticity that Quine spent eighty pages demonstrating is incoherent.

  Below is a clause-by-clause audit of the chapter's claims, followed by answers to your four specific questions.

  ### Part I: Clause-by-Clause Audit

  **1. "Quine's target was the positivist picture on which every true statement has two components, a linguistic one and a factual one..."**
  *   **Verdict:** **Acceptable Simplification.**
  *   **Comment:** This is a fair heuristic for the Logical Positivist view (particularly Carnap's). They held that the truth of a statement depends on language rules and empirical evidence. Quine attacks the idea that we can cleanly separate these contributions. A specialist might note that Quine's target was not just positivism but the broader empiricist tradition, but for a popular book, this is harmless.

  **2. "...so that some statements — the analytic ones — are true by meaning alone, with the factual component set to zero."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This correctly states the definition of analyticity Quine intends to interrogate.

  **3. "He then asks what 'true by meaning alone' amounts to, and shows that each of the answers on offer goes in a circle."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This summarises Sections II and III of *Two Dogmas*. Quine examines definitions, interchangeability, and semantic rules, showing they all presuppose the notion of analyticity they aim to explain.

  **4. "Meaning, synonymy, definition, necessity: four names for one unexplained notion."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This captures Quine's charge of circularity precisely.

  **5. "The conclusion is therefore negative: there are no analytic truths, only statements we are, for the time being, extremely unwilling to give up."**
  *   **Verdict:** **Substantive Misreading (with a grain of truth).**
  *   **Comment:** Quine does argue that the distinction is a matter of degree, not kind. However, he does not flatly deny analytic truths exist; he denies that there is a *principled boundary* between them and synthetic truths. Saying "there are no analytic truths" is stronger than Quine's position. He prefers to say the concept is too ill-defined to do the philosophical work assigned to it.

  **6. "The second [dogma] is reductionism, the idea that each statement can be checked against experience on its own; against it Quine sets holism..."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This correctly identifies the second dogma. Quine argues that statements face the "tribunal of experience" not individually but as a corporate body.

  **7. "...so that in principle even the laws of logic are revisable."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This is a famous consequence of Quine's holism. If logic is part of the web of belief, and the web is revisable to accommodate recalcitrant experience, logic is revisable (e.g., to accommodate quantum phenomena).

  **8. "Analyticity was never a special kind of truth, just a sociological fact about which sentences a community has stopped arguing about."**
  *   **Verdict:** **Substantive Misreading.**
  *   **Comment:** This attributes a sociological conventionalism to Quine that he does not hold. Quine is a naturalist, not a sociologist of science. For Quine, a statement is central to the web because of its deep connections to other statements, not because people have "stopped arguing". The stability is structural and psychological, not merely a matter of social agreement.

  **9. "Better still, the notion can be rescued by restating it epistemically. Call a statement analytic when a competent speaker who understands it can see that it is true without going and looking."**
  *   **Verdict:** **Explicit Denial by Quine.**
  *   **Comment:** This is the chapter's attempt to save analyticity, but it contradicts Quine's main argument. Quine explicitly rejects epistemic definitions of analyticity because "understanding" and "meaning" are the very things under suspicion. To say "true in virtue of understanding" is to say "true in virtue of meaning", which returns us to the circularity.

  **10. "'Whales are mammals' was not analytic in 1750 and is analytic now, because once the taxonomists had settled the question, the sentence became one you can know simply by knowing what the words mean."**
  *   **Verdict:** **Substantive Misreading.**
  *   **Comment:** This conflates Quine with a view closer to Thomas Kuhn (paradigm shifts) or perhaps a loose conventionalism. Quine would say our *theory* changed, not that the *meaning* changed in a way that makes the sentence analytic. For Quine, 'whale' is a term within a theory. When the theory changes, the term's role changes, but calling it "analytic now" implies a sharp boundary has appeared where there was none before, which violates Quine's central thesis.

  **11. "Analyticity is a status a sentence acquires when the inquiry around it goes quiet."**
  *   **Verdict:** **Substantive Misreading.**
  *   **Comment:** As above, this makes analyticity a matter of sociological history. Quine's point is that *any* sentence can be held true come what may, if we make drastic enough adjustments elsewhere in the system. The "quietness" of inquiry does not make a truth analytic; it just makes it central to the current web of belief.

  **12. "Quine's own view is that the two dogmas are at root one dogma rather than two independent targets."**
  *   **Verdict:** **Accurate (Your Friend is Correct).**
  *   **Comment:** In the introduction to *Two Dogmas*, Quine states that the two dogmas are "at root one". The belief in analyticity supports reductionism (if you can separate meaning from fact, you can verify statements by meaning alone). The chapter treats them as two separate items to be knocked down sequentially, missing this structural link.

  **13. "...what the paper undermines is not the distinction itself but the epistemological work the logical positivists wanted the distinction to do."**
  *   **Verdict:** **Accurate (Your Friend is Correct).**
  *   **Comment:** Quine allows that we can use the word 'analytic' in loose speech. His target is the *philosophical utility* of the distinction—specifically, its use in grounding necessity, a priori knowledge, and truth by convention.

  ---

  ### Part II: Specific Questions

  #### 1. Does the chapter's epistemic restatement of analyticity escape the circularity Quine alleges?

  **Verdict:** No, the circle reappears one step later.

  **Analysis:**
  The chapter proposes: *Statement S is analytic if a competent speaker can see S is true just by understanding the words.*
  Quine's objection applies immediately to the phrase "understanding the words". To understand the word 'bachelor' just *is* to know that it means 'unmarried man'. If you define analyticity via understanding, you must define understanding.
  *   If you say "understanding means knowing the analytic truths associated with the word", you have defined analyticity in terms of analyticity.
  *   If you say "understanding means having a mental image or disposition", Quine argues (in *Word and Object*) that this is behaviourally obscure. There is no fact of the matter about what meaning a speaker has in their head that distinguishes "believing a truth of meaning" from "believing a very central empirical truth".

  **Where it fails:**
  It fails at the criterion of **competence**. How do we distinguish a speaker who understands the word 'vixen' from a speaker who merely has a very strong belief that vixens are female? If the speaker says, "I can imagine a male vixen, though there aren't any," have they failed to understand the word, or have they proposed a revision? The epistemic criterion cannot distinguish between a semantic rule and a deeply held empirical belief without presupposing the distinction it tries to establish.

  **Can it be repaired?**
  To repair it, one would need to add a theory of **convention**. You would have to say: "A statement is analytic if it is true in virtue of a linguistic convention explicitly adopted by the community." This is the Carnapian position.
  *   **Cost:** Quine argues that for natural languages (like English), there are no such explicit conventions. We can invent them for formal logic, but not for 'whale' or 'bachelor'.
  *   **Work remaining:** Even if repaired, this "conventional" analyticity cannot do the work the positivists wanted. It cannot ground *necessary* truth about the world, only truth about our linguistic rules. It cannot tell us about the nature of vixens, only about how we use the word 'vixen'.

  #### 2. What does the whale case actually show?

  **Verdict:** The chapter's reading (meaning change) is less defensible than the alternative (necessary a posteriori), but Quine would reject both in favour of theory change.

  **The Two Readings:**
  1.  **The Chapter's View (Meaning Change):** In 1750, 'whale' meant 'large sea creature'. Now, 'whale' means 'marine mammal'. Thus, "Whales are mammals" went from synthetic to analytic.
  2.  **The Kripke/Putnam View (Necessary A Posteriori):** The reference of 'whale' was fixed by ostension (pointing at the animals). We discovered their essence (mammalian biology). The statement was always true (and necessarily so), but we needed empirical science to know it.

  **Arguments for the Kripkean View:**
  This preserves the intuition that 18th-century naturalists were talking about the *same animals* as us. If the meaning changed completely, there is a risk of **incommensurability**: when Linnaeus said "Whales are fish", he wasn't wrong, just speaking a different language. That seems intolerable for science, which aims at cumulative truth. The Kripkean view allows us to say Linnaeus was *mistaken* about the very things he was pointing at.

  **Costs of the Chapter's Reading:**
  *   **Meaning vs. Reference:** It commits to the idea that reclassification changes *meaning*. This predicts that communication across the transition period should be impossible or systematically misleading.
  *   **Quine's Objection:** Quine would dislike the Kripkean view because it relies on "essentialism" (the idea that objects have necessary properties independent of language), which Quine famously attacked in *Reference and Modality*.
  *   **Quine's Alternative:** Quine would say we should drop the talk of "meaning" and "necessity" entirely. We should say: "In our current best theory of biology, whales are classified as mammals. In an earlier theory, they were classified as fish. The term 'whale' is a posits in the theory." For Quine, the sentence "Whales are mammals" is simply very central to our current web of belief. It is not "analytic"; it is just extremely hard to revise without collapsing the whole of biology.

  **Conclusion on the Whale:** The chapter uses the whale case to support the idea that analyticity is fluid. While it is true that our *willingness to revise* the statement has changed, calling it "analytic now" misuses Quine. Quine would say it is no more analytic now than it was then; we are just more committed to the theory that entails it.

  #### 3. What verdicts does the chapter's criterion deliver on test cases?

  The chapter's criterion is: *Analytic if a competent speaker can see it is true without looking.*

  *   **"Water is H₂O"**
      *   **Verdict:** Not analytic (requires chemistry).
      *   **Assessment:** Correct by Quine's lights (it's a theoretical identity). Correct by Kripke's lights (necessary a posteriori). The chapter gets this right, but for the wrong reason (it treats it as empirical rather than theoretically necessary).
  *   **"Every vixen is a fox"**
      *   **Verdict:** Analytic (understanding 'vixen' suffices).
      *   **Assessment:** This looks right intuitively. However, Quine would ask: what if someone defines 'vixen' as 'female animal' and thinks foxes are a type of dog? The criterion relies on a shared intuition about "competence" that Quine suspects is illusory.
  *   **"A long and complicated tautology" (e.g., a 50-line truth-functional logic proof)**
      *   **Verdict:** Not analytic (no competent speaker can verify it by inspection).
      *   **Assessment:** **This is a fatal flaw.** Analyticity is supposed to be a property of the *statement*, not the *speaker's cognitive capacity*. If a tautology is too long to verify, the chapter's criterion says it isn't analytic. But logically, it is still true in virtue of its form. This conflates *epistemology* (how we know) with *semantics* (what makes it true). Quine would agree that "truth by inspection" is a psychological notion, not a logical one, and thus useless for philosophy.
  *   **"I am now conscious"**
      *   **Verdict:** Not analytic (seems to require experience/looking inward).
      *   **Assessment:** Many philosophers (Descartes, perhaps) would call this a priori or indubitable. The chapter's criterion classifies it as empirical. Quine would classify it as an "observation sentence"—the basis of evidence, but not analytic. The chapter's criterion struggles here because it conflates "empirical" with "requires looking at the external world".

  **Overall:** The criterion fails because it makes analyticity dependent on human cognitive limitations (the long tautology problem) and conflates psychological immediacy with semantic truth.

  #### 4. Does the conclusion (conceptual analysis is dead) follow?

  **Verdict:** No, that does not follow. There is a defensible middle ground.

  **Why it doesn't follow:**
  Even if Quine is right that there is no sharp analytic/synthetic distinction, it does not mean we cannot analyse concepts. It means we cannot analyse them in isolation from empirical theory.
  *   **The Positivist Picture:** Philosophy analyses meanings (a priori); Science investigates facts (a posteriori).
  *   **The Chapter's Scepticism:** Meanings are illusions; philosophy is dead.
  *   **The Middle Ground (Quine's Actual View):** Philosophy is continuous with science. We analyse concepts by investigating how language is used, how it is learned, and how it figures in our best theories.

  **Defensible Position:**
  Conceptual analysis transforms into **conceptual engineering** or **naturalised epistemology**.
  1.  **Naturalised Epistemology:** Instead of asking "What is the meaning of 'knowledge' a priori?", we ask "How do human beings acquire the concept of knowledge?" This is an empirical question.
  2.  **Explication:** We can acknowledge that 'whale' is vague, and propose a precise definition for scientific use (Carnap's method). This isn't discovering a pre-existing meaning; it is sharpening a tool.
  3.  **Mooreanism:** Some philosophers (like Grice and Strawson, in their 1956 reply to Quine) argued that even if the boundary is fuzzy, the distinction is real enough to do work. Just because 'bald' is vague doesn't mean there are no bald men. Similarly, just because analyticity is a matter of degree doesn't mean "All vixens are female" isn't significantly different from "All swans are white".

  **Conclusion:**
  The chapter is correct that Quine undermines the *positivist* programme of grounding science on analytic truths. It is incorrect to suggest Quine leaves us with mere sociology or that philosophy cannot proceed. Quine leaves us with a view where philosophy is responsible for clarifying the concepts we use in science, but it must do so using the same empirical tools as science. The "whale" case does not show that meanings change magically; it shows that our theoretical commitments shift, and with them, the centrality of certain sentences in our web of belief.

  You are right to distrust the chapter's "rescue" of analyticity. It attempts to keep the comfort of the positivist distinction (some things are just true by words!) while accepting Quine's critique. Quine's actual message is more unsettling: we must give up the hope of a first philosophy that stands outside science to justify it. We are sailors rebuilding our ship at sea, using the very planks we are questioning.
