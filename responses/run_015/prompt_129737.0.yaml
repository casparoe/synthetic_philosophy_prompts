answer: |-
  Your primary target must be the structural distortion of the record itself, not the cognitive biases of writers, because no amount of mental hygiene fixes a missing file.

  Here is the breakdown of your four concepts, the elimination of the weakest, and the ranked agenda for your eight pieces.

  ### The Diagnosis of Your Four Concepts

  You have not invented four distinct questions; you have invented two structural problems, one psychological symptom, and one proposed intervention.

  **1. Archive Capture (Load-Bearing)**
  This is the most important concept you have. It moves the problem from inside the skull (bias) to inside the institution (evidence). If the victors destroy the minutes and the losers lose their servers, the "smooth story" isn't a cognitive error; it's the only story the evidence permits. This is upstream of everything else. If the record is rigged, the reasoning doesn't matter. This is highly tractable for a journalist: you can trace what documents existed when, who held them, and what vanished after the outcome. It is neglected because historians assume the archive is neutral ground rather than a battlefield outcome.

  **2. Pre-registered History (The Intervention)**
  This is the only viable fix on your list, but it needs redefinition. You cannot write an "explanation" before the outcome, because explanation is retrospective by definition. What you can do is commission a "Causal Model" piece—a statement of *what factors matter and why*—before the event concludes. Then, after the event, you publish the model alongside the standard post-mortem to show the divergence. This is a journalistic experiment, not a philosophical one. It is high-risk but high-reward.

  **3. The Retrospective Unit Problem (Philosophical Trap)**
  This is real, but dangerous for a journalist. It risks becoming verbal quibbling ("Was the pandemic one event or twelve?"). It is only useful if it shows how carving events differently changes *accountability*. If you treat "the startup failure" as one unit, you blame the CEO. If you treat it as three distinct funding rounds, you blame the market shift in round two. Use this only when it changes who gets blamed. Otherwise, cut it.

  **4. Counterfactual Compression (The Kill)**
  I am killing this one. It is merely hindsight bias wearing a hat. It describes the symptom (the tree of possibilities shrinks) but offers no leverage on the cause. It is well-trodden ground in psychology (Kahneman, Taleb) and adds nothing to your specific mission of fixing journalism. It is descriptive, not structural. Spending pieces on this would be preaching to the converted.

  ### The Sense of "Explanation"

  For your purposes, an explanation is not a story that makes sense; it is a **causal model that yields leverage**. If an explanation of a coup succeeds tells you nothing about how to prevent the next one because it relies on facts unavailable at the time (Archive Capture) or defines the event so broadly it includes everything (Retrospective Unit), it is useless. You are testing explanations by their utility for future forecasting and prevention, not their narrative coherence.

  ### The Ranked Agenda (8 Pieces)

  This ordering moves from the structural root cause to the experimental fix, then to the incentives that resist change, and finally to the conceptual cleanup.

  **1. The Ghost File (Archive Capture I)**
  *   **Question:** What specific evidence existed at decision-time that is absent from the final public record?
  *   **Reasoning:** Establishes the upstream constraint. You cannot fix reasoning if the premises are missing.
  *   **Tractability:** High. Compare early leaks/internal memos with final official reports on a specific failure (e.g., a specific bank collapse or pandemic phase).
  *   **Journalist vs. Philosopher:** Pure journalism. Requires digging, not arguing.
  *   **Move Up/Down:** If you find that most records *are* preserved but ignored, this drops. If you find systematic destruction, this becomes the central thesis of the year.

  **2. The Redacted Draft (Pre-registered History I)**
  *   **Question:** Can we freeze a causal model before the outcome to test narrative drift?
  *   **Reasoning:** Tests the intervention. Commission a piece on an ongoing event (election, product launch) where the writer must commit to causal weights *now*.
  *   **Tractability:** Medium. Requires finding a writer willing to be proven wrong and an editor willing to publish a "wrong" model later.
  *   **Journalist vs. Philosopher:** Journalistic experiment.
  *   **Move Up/Down:** If the "pre-registered" piece turns out to be vague enough to fit any outcome, the method is a gimmick.

  **3. The Economics of Smoothness (Incentives)**
  *   **Question:** Who profits from the tidy story, and do editors knowingly reject complexity?
  *   **Reasoning:** Even if evidence exists (Q1) and models are frozen (Q2), will anyone publish the messy truth? This addresses the market demand for hindsight bias.
  *   **Tractability:** High. Interview editors, analyze click-through rates on nuanced vs. tidy headlines.
  *   **Journalist vs. Philosopher:** Journalist. Follow the money/attention.
  *   **Move Up/Down:** If editors claim they want nuance but data shows readers bounce, this stays high. If editors admit they force the simplification, this becomes the primary bottleneck.

  **4. The Boundary Dispute (Retrospective Unit I)**
  *   **Question:** Does changing the start/end date of the event change the villain?
  *   **Reasoning:** Tests the ontological trap. Show how shifting the window shifts blame.
  *   **Tractability:** Medium. Requires close reading of two competing histories of the same event.
  *   **Journalist vs. Philosopher:** Hybrid. Needs conceptual rigor applied to reportage.
  *   **Move Up/Down:** If shifting the boundary doesn't change the causal assignment, this is a fake problem. Cut it.

  **5. The Loser's Silence (Archive Capture II)**
  *   **Question:** What causal factors are exclusively held by the losing side?
  *   **Reasoning:** Deepens Q1. Focuses on the human element of record-keeping. Winners write history; losers lose their hard drives.
  *   **Tractability:** High. Interview losers of specific conflicts (corporate or political) about what records they kept/lost.
  *   **Journalist vs. Philosopher:** Journalist. Oral history + evidential audit.

  **6. The Counterfactual Audit (Replacing Counterfactual Compression)**
  *   **Question:** What alternatives were actually live at the time, according to contemporaneous betting markets or internal risk assessments?
  *   **Reasoning:** Replaces the killed concept with an evidential version. Don't ask writers what they *think* was possible; find records of what was *priced* as possible.
  *   **Tractability:** Medium. Requires access to internal risk logs or market data.
  *   **Journalist vs. Philosopher:** Journalist. Data retrieval.

  **7. The Embargo Test (Pre-registered History II)**
  *   **Question:** Does seeing the "frozen model" change how readers evaluate the final outcome?
  *   **Reasoning:** Tests the audience. If readers see the pre-event model, do they accept more uncertainty in the post-mortem?
  *   **Tractability:** Low/Medium. Requires A/B testing or careful reader feedback analysis.
  *   **Journalist vs. Philosopher:** Journalist/Editorial.

  **8. The Manifesto for Messy History (Synthesis)**
  *   **Question:** What are the institutional rules for a journalism that admits evidential gaps?
  *   **Reasoning:** Final output. Proposes standards (e.g., "Evidence Availability Statements" alongside articles).
  *   **Tractability:** High. Synthesis of previous seven pieces.
  *   **Journalist vs. Philosopher:** Journalist advocating for institutional change.

  ### Summary of Cuts and Shifts

  I have cut **Counterfactual Compression** because it is a psychological description, not a structural lever. You cannot fix it by writing about it; you fix it by fixing the evidence (Archive Capture) or the incentives (Economics of Smoothness).

  I have shifted **Retrospective Unit** down. It is a philosopher's question that only becomes a journalist's question when it alters accountability. Do not write about the metaphysics of events; write about how defining the event differently changes who gets fired.

  I have elevated **Archive Capture** to the top. It is the load-bearing beam. If the evidence is structurally biased toward the winner, hindsight bias is not a bug in the writer's brain; it is a feature of the information ecosystem. Your year should prove that first, or the rest of the agenda is just styling the deck chairs.
