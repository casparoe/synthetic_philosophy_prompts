answer: |-
  **Project Title:** Ontological Risk and Longtermist Allocation: A Sensitivity Analysis of the Simulation Hypothesis

  **Project Summary**
  This project investigates whether uncertainty regarding the simulation hypothesis should function as a discount rate on far-future interventions. Longtermist grantmaking often relies on expected-value calculations where astronomical stakes outweigh low probabilities (the "fanaticism" worry). A common heuristic suggests that a non-zero probability of being in a simulation dampens these calculations by threatening the continuity or reality of the far future. However, this heuristic conflates distinct ontological risks: termination risk, value density variance, causal permeability, and recursive nesting. Some of these factors dampen expected value; others amplify it. Over six months, I will disentangle these factors to produce a decision framework for grantmakers. The deliverable will be an Allocation Memo specifying whether, and under what conditions, simulation uncertainty warrants shifting funds from far-future existential risk mitigation to near-term or robustness-focused interventions.

  **Research Question**
  *Under what specific structural conditions does uncertainty about the simulation hypothesis reduce the expected value of far-future interventions relative to near-term interventions, sufficiently to alter a rational funding allocation?*

  To ensure a determinate answer, "fanaticism" is defined operationally rather than theoretically. A funding strategy is "fanatic" if it allocates more than 50% of available capital to interventions with a probability of success below 1% but a projected impact exceeding 10^20 quality-adjusted life years. The project asks whether introducing simulation uncertainty forces a rational agent below this threshold.

  **Why Obvious Solutions Fail**
  Three standard responses to this question are insufficient for decision-making purposes:
  1.  **Simple Probability Discounting:** Merely multiplying far-future value by the probability of being in a base reality ignores the possibility that simulated futures contain high value density or that simulators may reward specific behaviors.
  2.  **Moral Status Dismissal:** Asserting that simulated minds do not count (or count less) is a moral premise, not a factual resolution. A grantmaker must plan for the possibility that they do count, as the cost of error is astronomical.
  3.  **Empirical Inertness:** Claiming the hypothesis is untestable and therefore irrelevant ignores the role of logical uncertainty in decision theory. Grantmakers already allocate capital under empirical uncertainty; ontological uncertainty must be treated similarly as a risk parameter.

  This project proceeds on the assumption that both longtermism and the simulation argument are live options. The question is not which is true, but how a rational agent should act given the *conjunction* of both.

  **Methodology**
  I will employ conceptual analysis and decision-theoretic modeling, rather than formal axiomatic modeling or expert polling.
  *   **Why not formal modeling?** Existing parameters (e.g., compute cost per mind, simulator motives) are too speculative to populate a robust mathematical model. A formal model would convey false precision.
  *   **Why not expert polling?** Philosophical consensus does not determine rational action under uncertainty. A grantmaker needs a logic of decision, not a vote on metaphysics.
  *   **Why conceptual analysis?** The goal is to map the *direction of pull* of different ontological assumptions. This requires isolating variables to see which alter the sign or magnitude of the expected value calculation.

  **Work Plan (Month-by-Month)**
  *   **Month 1: Taxonomy of Ontological Risk.** I will rigorously define the four bundled considerations identified in preliminary research: Termination (risk of shutdown), Value Density (compute-to-mind ratio), Causal Permeability (simulator intervention), and Nesting (recursive simulations). I will produce a matrix showing how each variable independently affects expected value.
  *   **Month 2: The Termination and Density Analysis.** I will analyze the interaction between Termination and Value Density. If simulations are cheap, they may be numerous, potentially amplifying far-future value rather than dampening it. I will determine the break-even point where density outweighs termination risk.
  *   **Month 3: Causal Permeability and Incentives.** I will examine whether simulator intervention creates a "theological" decision problem. If simulators reward longtermist behavior, simulation uncertainty could *increase* the value of far-future interventions. I will draft a decision rule for "opaque" vs. "transparent" simulator motives.
  *   **Month 4: The Nesting Effect.** I will assess the impact of recursive simulations. If our descendants run simulations, a large portion of the "far future" value is simulated. I will determine if this makes current action more or less leverage-heavy compared to base reality.
  *   **Month 5: Synthesis and Decision Rule.** I will integrate the four analyses into a unified framework. I will test this framework against three standard grantmaking scenarios: existential risk mitigation, global development, and AI safety.
  *   **Month 6: Drafting the Allocation Memo.** I will finalize the project by writing the decision-relevant deliverable. This will include a "sensitivity dashboard" showing how allocation shifts as confidence in each of the four variables changes.

  **Possible Conclusions and Deciding Considerations**
  There are three viable outcomes:
  1.  **Dampening:** Termination risk and causal opacity dominate. *Decision:* Shift funds toward near-term robustness and "hedge" interventions that are valuable in both simulated and base realities.
  2.  **Amplification:** Value density and nesting dominate. *Decision:* Maintain or increase far-future allocation, as the "cheapness" of simulated minds implies higher total leverage.
  3.  **Null Result:** The factors cancel out or are too orthogonal to aggregate. *Decision:* Status quo allocation is warranted, but *not* because the simulation hypothesis is irrelevant. The argument for status quo changes from "ignore the sim hypothesis" to "the sim hypothesis is risk-neutral."

  The deciding consideration will be the **asymmetry of error**. If over-allocating to the far future in a simulation leads to zero value (shutdown), but under-allocating in base reality leads to only marginal loss, the precautionary principle may dictate dampening regardless of the expected value calculation.

  **Decision-Relevant Deliverable**
  The primary output is an **Allocation Memo** designed for a grantmaking board. It will not recommend a specific charity but will provide a **Risk Adjustment Framework**. This framework will allow a grantmaker to input their confidence levels regarding the four ontological variables and receive a recommended adjustment to their far-future discount rate.
  *   *Scenario A:* If the Memo concludes that simulation uncertainty acts as a high discount rate, the grantmaker should reduce exposure to interventions that rely on astronomical future populations (e.g., space colonization) in favor of interventions robust to ontological shutdown (e.g., reducing immediate suffering).
  *   *Scenario B:* If the Memo concludes the effect is neutral or amplifying, the grantmaker receives a rigorous defense against the "gimmick" objection, allowing them to continue longtermist funding with greater epistemic security.
  Even a "no change" recommendation is valuable: it converts a metaphysical worry into a quantified risk parameter, preventing ad-hoc dismissal of longtermism during board disputes.

  **Addressing the "Gimmick" Objection**
  This project treats the simulation hypothesis not as a metaphysical claim to be proven, but as a **stress test for portfolio theory**. Just as a financial fund stress-tests against market crashes, a longtermist fund must stress-test against ontological collapse. By framing the simulation argument as a variable in a sensitivity analysis rather than a truth-claim, the project avoids speculative metaphysics and focuses on robust decision-making under deep uncertainty. This ensures the work is rigorous philosophy of action, not science fiction.

  **Risk of Failure and Scope Creep**
  *   **Failure Mode 1 (Indeterminacy):** The four factors may prove incommensurable. If Value Density cannot be compared to Termination Risk without arbitrary weighting, the project cannot produce a decision rule. *Mitigation:* In this case, the deliverable will shift to a "Research Priority Memo" identifying which empirical or philosophical parameter is the bottleneck for future decision-making.
  *   **Failure Mode 2 (Scope Creep):** Analyzing Causal Permeability could devolve into general theology or decision theory (e.g., EDT vs. CDT). *Mitigation:* I will restrict analysis strictly to how permeability alters the *probability of payoff* for specific intervention classes, not the general validity of decision theories.
  *   **Failure Mode 3 (Triviality):** The analysis may show that for any reasonable credence in the simulation hypothesis (e.g., <20%), the impact on allocation is negligible. *Mitigation:* The proposal explicitly includes this as a valid positive finding. Demonstrating that the "cure" is ineffective is as decision-relevant as demonstrating it works, as it prevents grantmakers from making allocation errors based on false heuristics.

  **Timeline and Resources**
  This is a single-researcher project requiring no travel or specialized equipment. The six-month timeline is tight but feasible because the project relies on synthesizing existing arguments rather than generating new empirical data. The critical path is Month 3 (Causal Permeability), as this involves the most complex decision-theoretic work. If this section requires expansion, Month 5 (Synthesis) will be compressed to focus solely on the dominant variables identified in Months 1–3.
