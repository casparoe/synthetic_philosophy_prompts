      *(Self-Correction on "Supervisor")*: Don't mention the supervisor explicitly, but structure the justification to preempt the "gimmick" critique by emphasizing robustness and portfolio theory.

      *(Self-Correction on "Method")*: Ensure the month-by-month is realistic. Month 1-2: Taxonomy. Month 3-4: Decision Logic. Month 5: Counter-arguments. Month 6: Final Memo.

