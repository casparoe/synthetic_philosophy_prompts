  # Taxonomy of Imprecise Probability Positions

  **Branch 1: Updating Rule**
  *Does the framework permit a posterior interval strictly narrower than the prior (sharpening) when evidence is imprecisely specified?*
  *   **No (Preserve/Widen):** Go to Branch 2A.
  *   **Yes (Permit Sharpening):** Go to Branch 2B.

  **Branch 2A: Updating Rule = No (Preserve/Widen)**
  *Can the framework assign a coherent sharp value to a self-referential proposition (e.g., "this assignment is false") without contradiction?*
  *   **No (Mandate Suspension):** Go to Branch 3A.
  *   **Yes (Assign Sharp Value):** Go to Branch 3B.

  **Branch 2B: Updating Rule = Yes (Permit Sharpening)**
  *Can the framework assign a coherent sharp value to a self-referential proposition (e.g., "this assignment is false") without contradiction?*
  *   **No (Mandate Suspension):** Go to Branch 3C.
  *   **Yes (Assign Sharp Value):** Go to Branch 3D.

  **Branch 3A: No Sharpening, Suspension on Paradox**
  *Is imprecision justified only epistemically, or can it also be ontic?*
  *   **Epistemic Only:** **Interval Bayesians**. *Awkward Commitment:* They must accept dilation, where acquiring relevant evidence renders the agent's state strictly less precise.
  *   **Ontic Allowed:** **Comparative Probabilists**. *Awkward Commitment:* They must deny that numerical precision is ever achievable even when ontic indeterminacy is resolved.

  **Branch 3B: No Sharpening, Sharp Value on Paradox**
  *Is imprecision justified only epistemically, or can it also be ontic?*
  *   **Epistemic Only:** **Unoccupied**. *Diagnosis:* Incoherent, as the ability to resolve semantic paradoxes sharply undermines the motivation for conservative updating elsewhere.
  *   **Ontic Allowed:** **Unoccupied**. *Diagnosis:* Incoherent, since positing ontic vagueness while assigning sharp values to paradoxes creates a metaphysical contradiction.

  **Branch 3C: Permit Sharpening, Suspension on Paradox**
  *Is imprecision justified only epistemically, or can it also be ontic?*
  *   **Epistemic Only:** **Dempster-Shafer belief-function theorists**. *Awkward Commitment:* They must treat conflicting evidence as negligible noise to maintain coherence during combination.
  *   **Ontic Allowed:** **Unoccupied**. *Diagnosis:* Unexplored, representing a viable metaphysics of vague objects that nonetheless lacks a theoretical champion.

  **Branch 3D: Permit Sharpening, Sharp Value on Paradox**
  *Is imprecision justified only epistemically, or can it also be ontic?*
  *   **Epistemic Only:** **The unnamed sharpening-permitting view**. *Awkward Commitment:* They must explain how ignorance spontaneously converts to knowledge without new precise data.
  *   **Ontic Allowed:** **Unoccupied**. *Diagnosis:* Unattractive, as it suggests metaphysical vagueness that resolves itself sharply upon observation without cause.

  Summary: The most surprising empty branch permits sharpening and ontic imprecision while mandating suspension on paradoxes, suggesting a viable metaphysics of vague learning that lacks a champion.
