  **Strategic Plan and Ethical Charter: Institute for Historical Lock-In Studies (2025-2030)**

  **Mission and Foundational Principles**
  The Institute for Historical Lock-In Studies (IHLS) exists to demonstrate that continuity is the highest form of validity. Our operational philosophy rests on a crucial distinction between "Hard Lock-In" and "Narrative Lock-In." Hard Lock-In refers to scenarios where reversing an initial contingent choice is physically or structurally impossible (e.g., a building foundation poured in 1924). Narrative Lock-In refers to scenarios where reversal is physically possible but institutionally unthinkable because it would rupture the continuous story of how the organization arrived at its present form. The Charter establishes that Narrative Lock-In is the deeper, more ethically binding category. While Hard Lock-In merely describes constraint, Narrative Lock-In prescribes duty. To alter a course simply because a more efficient route is now visible is to commit violence against the historical self. Therefore, our mission is not to optimize outcomes, but to honor the trajectory established by our founding accidents.

  **Hiring and Promotion Criteria**
  Recruitment practices must reflect our commitment to trajectory preservation. Candidates will not be evaluated primarily on current competency metrics, which are susceptible to presentist bias. Instead, search committees will prioritize biographical coherence. A candidate whose intellectual development aligns with the Institute's accidental 1998 pivot toward qualitative macro-history is preferred over a candidate with superior publications but a divergent causal lineage. Promotion is contingent upon demonstrating that one's recent work was inevitable given their previous work. Sudden shifts in research focus, even if prompted by new evidence, will be viewed as ethical breaches of Narrative Lock-In. We do not hire for the future; we hire to extend the past.

  **Curriculum and Pedagogical Commitment**
  Our pedagogical model rejects the notion that students should be equipped to change the world. Such ambition implies that the current world is contingent rather than necessary. Courses will emphasize the heavy load-bearing capacity of minor historical events. Students will be graded on their ability to articulate why current institutional arrangements, however inefficient, are morally superior to hypothetical alternatives because they exist. Revisionism is prohibited in capstone projects. To suggest that the Institute's current budget allocation is the result of administrative error rather than historical necessity is to fail the course. We teach students to recognize that the difficulty of changing a system is proof that it should not be changed.

  **Alumni Relations and Institutional Memory**
  The alumni network is not a resource for fundraising but a living artifact of path dependence. Maintaining contact with graduates is ethically required because severing ties would rewrite the causal chain of the Institute's influence. We discourage alumni from pursuing career paths that diverge significantly from their degree specifications, as this introduces noise into the historical signal. Institutional memory will be curated to highlight moments where alternative paths were available but rejected due to inertia. These moments will be celebrated as moral victories. We recognize that disrupting the network would be logistically possible, but such disruption would constitute a violation of Narrative Lock-In. The story must remain unbroken, even if the plot is suboptimal.

  ***

  **Commentary on Satirical Choices**
  This piece exaggerates the "is-ought" problem prevalent in interpretations of path dependence (e.g., Paul David's QWERTY analysis, James Mahoney's work on institutional inertia). Scholars often describe how contingent events solidify into structures; the satire converts this descriptive solidity into a normative obligation. The distinction between "Hard" and "Narrative" Lock-In is invented to highlight how institutions conflate physical constraint with storytelling legitimacy. While "ideational path dependence" exists in literature, treating the *story* of the path as more binding than the *physical* path satirizes the tendency to treat historical continuity as moral virtue. The document mimics the bureaucratic language of "strategic planning" to show how easily philosophical contingency becomes administrative dogma.

  ***

  **Confidence Assessment**
  I am highly confident in the philosophical accuracy regarding the slide from descriptive path dependence to normative conservatism (the naturalistic fallacy applied to history). However, I am least certain whether the distinction between "Hard" and "Narrative" Lock-in genuinely captures a specific tension in the literature or merely collapses into the familiar problem of post-hoc rationalization and legitimation. While scholars distinguish between structural and ideational constraints, elevating the narrative component to a *higher* ethical category is a satirical construct rather than a direct reflection of an existing scholarly debate. It is possible this distinction oversimplifies the nuanced ways historians treat counterfactuals.
