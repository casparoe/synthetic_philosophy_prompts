  **CENTRE FOR POST-DEVELOPMENTAL STABILITY**
  **SCOPING PAPER 44-B: NEOLITHIC REVERSAL PILOT (LOWER KELD BASIN)**
  **DATE:** 14 OCTOBER 2024
  **CLASSIFICATION:** INTERNAL DRAFT

  **1. EXECUTIVE SUMMARY**

  1.1. Contemporary consensus identifies the Agricultural Revolution as a causal factor in institutionalised inequality, reduced dietary diversity, and increased pathogen load. The accumulation of storable surplus facilitated hierarchy; the intensification of labour reduced autonomy.

  1.2. This paper scopes a ten-year pilot to revert land use in the Lower Keld Basin from intensive cereal agriculture to mixed foraging and shifting cultivation. The objective is to maximise the Subsistence Quality Index (SQI) across the participant population.

  1.3. Modelling indicates the Basin's current population of 142,000 exceeds the carrying capacity of a foraging economy. Phase II implementation requires a hard cap on resident permits.

  1.4. Non-permitted residents will be classified as the Deferred Cohort and processed for transitional absorption into adjacent urban zones.

  **2. HEADLINE METRIC: SUBSISTENCE QUALITY INDEX (SQI)**

  The pilot's success is contingent on the SQI, a composite metric designed to measure autonomy relative to surplus accumulation. The SQI is calculated as:

  $$SQI = \frac{(L_h \times 0.6) + (D_b \times 0.4)}{S_c}$$

  Where $L_h$ is average weekly leisure hours (target >30), $D_b$ is the Dietary Breadth score (number of distinct species consumed weekly), and $S_c$ is the Stored Calorie Concentration (kilocalories held in reserve per capita). A lower $S_c$ yields a higher index score, incentivising the depletion of granaries. To ensure risk mitigation, a Central Emergency Reserve (CER) will be maintained outside the SQI calculation zone.

  **3. IMPLEMENTATION TIMELINE**

  **Phase I (Years 1–3): Volunteer Cohort**
  Recruitment of 2,500 volunteers from the existing agrarian population. Participants will receive seed grants for tool fabrication and land clearance. SQI baseline established.

  **Review Gate (Year 4)**
  Independent audit of Phase I health outcomes and caloric yield. If SQI targets are met, Phase II is authorised.

  **Phase II (Years 5–10): Capacity Alignment**
  Resident permits capped at 6,800, based on conservative estimates of wild yield per square kilometre. Permits are non-transferable and allocated via weighted lottery to ensure demographic representation.

  **Deferred Cohort Management**
  The remaining 135,200 residents constitute the Deferred Cohort. This group will be ineligible for Basin residency permits. Administrative focus will shift to logistical support for their relocation to high-density urban centres where caloric import dependencies are already established.

  **4. MONITORING AND EVALUATION FRAMEWORK**

  **4.1. Key Performance Indicators**
  *   **SQI Target:** >75.0 by Year 5.
  *   **Work Hour Reduction:** Minimum 40% reduction in weekly labour input.
  *   **Wealth Dispersion:** Gini coefficient of stored assets must remain below 0.15.

  **4.2. Staffing and Oversight**
  Programme governance requires a permanent administrative cadre exempt from foraging requirements to ensure data integrity and reserve security.
  *   **Metric Verification Auditors:** 45 FTE.
  *   **CER Security Personnel:** 120 FTE.
  *   **Permit Compliance Officers:** 30 FTE.

  These roles are classified as Essential State Functions. Personnel in these categories are exempt from the Stored Calorie Concentration penalty to maintain operational continuity. Budgeting for these roles is secured via existing tax infrastructure.

  **5. FREQUENTLY ASKED QUESTIONS**

  **Q: Has any population voluntarily reverted to foraging at this scale historically?**
  A: There is no historical precedent for voluntary reversion due to path dependence. Once infrastructure lock-in (irrigation, storage, property law) is established, the opportunity cost of exit becomes prohibitive. This pilot removes structural barriers, effectively subsidising the transition cost. Skill loss is mitigated through embedded ethnographic training modules. The lack of precedent reflects structural coercion rather than preference.

  **Q: How is the Permit Cap enforced without violating autonomy principles?**
  A: Residency permits are tied to land access rights. Enforcement is handled by Permit Compliance Officers to prevent unauthorised cultivation. This is a temporary constraint required to protect the ecological carrying capacity of the zone during the pilot horizon.

  **Q: What happens to the Deferred Cohort's existing property?**
  A: Private property regimes are suspended within the Basin Zone. Assets are liquidated or transferred. Compensation is provided in the form of relocation credits applicable in urban zones.

  **6. CONCLUSION**

  The Neolithic Reversal Pilot offers a mechanism to decouple subsistence from inequality. While the arithmetic of carrying capacity necessitates difficult demographic adjustments, the long-term gain in human flourishing metrics justifies the transitional friction. The Centre recommends immediate approval of Phase I funding and the establishment of the Permit Allocation Authority. Further piloting is required to refine the relocation protocols for the Deferred Cohort.
