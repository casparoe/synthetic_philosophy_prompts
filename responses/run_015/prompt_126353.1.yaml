      *   **Setting:** An intensively farmed river valley (invented, concretely described).
      *   **Structure:** Executive Summary (numbered findings), Phased Timeline, Monitoring & Evaluation Framework (with a rigged headline metric), FAQ.
      *   **Tone:** Sober, centrist, administrative, euphemistic, deadpan. No jokes, no winks, no punchlines.
      *   **Key Constraints:**
          1.  **Headline Metric:** Invent a composite index (work hours, diet, wealth dispersion) rigged to favor the thesis but looking technical.
          2.  **Internal Contradictions:** Must inadvertently reconstitute hierarchy (e.g., guards for grain reserves) and presuppose the state it aims to dissolve.
          3.  **FAQ:** Must address the "no voluntary reversion" objection with a sincere, reasonable-sounding answer (skill loss, path dependence), not a joke.
          4.  **The Horror:** Must come from the arithmetic/euphemism (e.g., "the deferred cohort" for those who can't be supported).
          5.  **Length:** 800 - 1,000 words.
          6.  **Formatting:** Genuine document style (acronyms, hedging, costed).
          7.  **Ending:** No punchline, end with a sentence about further piloting.

  2.  **Deconstruct the Content:**
      *   **Institute Name:** Needs to sound sober and centrist. "Centre for Post-Agrarian Stability," "Institute for Temporal Equity," "The Oxbridge Group." Let's go with "The Centre for Holistic Temporal Equity" (CHTE).
      *   **Region:** The "Lower Valleria Basin." Intensivley farmed, high population density.
      *   **The Metric:** "Human Flourishing Composite" (HFC)? "Autonomy-Weighted Subsistence Index" (AWSI)? Let's try "Net Subsistence Autonomy Index" (NSAI). Components: Leisure hours, Dietary Diversity Index, Gini Coefficient of Stored Calories.
      *   **The Phases:**
