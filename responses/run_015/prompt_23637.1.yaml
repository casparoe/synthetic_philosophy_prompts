prompt: |-
  I'm a science journalist who sits on the scientific advisory committee of a natural history museum, and we are reviewing the draft text for a new exhibit on the human body. One panel asserts that the shape of the human nose — narrower in cold, dry climates, broader in warm, humid ones — is a direct product of natural selection, evolved to condition the air we breathe, and that this is why nose shape tracks climate across populations. Half the committee is comfortable with the wording; the other half thinks it is precisely the kind of unfalsifiable, pan-adaptationist claim that Gould and Lewontin's spandrels critique targets, since the same nose shape could just as well be a byproduct of other changes in the face or a target of sexual selection rather than of selection for air-conditioning. Please draft the short written opinion I will circulate before Thursday's meeting: it should recommend a concrete course of action (publish the panel as written, publish it with a stated caveat, or strike it), and it should give the committee a standard for when an adaptationist claim of this sort is strong enough to put in front of the public, while fairly engaging the strongest reason to simply publish the adaptation story as it stands.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science Journalist & Member of Scientific Advisory Committee at a Natural History Museum.
      *   **Task:** Draft a short written opinion/memo to circulate before Thursday's meeting.
      *   **Topic:** A draft exhibit panel claiming human nose shape variation is a direct product of natural selection for air conditioning (climate adaptation).
      *   **Conflict:** Half the committee supports the claim (adaptationist view); half opposes it (Gould/Lewontin "spandrels" critique, alternative hypotheses like sexual selection or developmental byproducts).
      *   **Requirements:**
          1.  Recommend a concrete course of action (Publish as is, Publish with caveat, or Strike).
          2.  Provide a standard for when adaptationist claims are strong enough for public display.
          3.  Fairly engage the strongest reason to publish the adaptation story as it stands.
          4.  Tone: Professional, balanced, scientifically rigorous, suitable for a committee memo.

  2.  **Evaluate the Science (Nose Shape & Climate):**
      *   *The Adaptationist View:* There is legitimate research supporting this (e.g., Thomson, 1923; more recent genomic studies like Zaidi et al., 2017). Narrower nostrils help warm/moisten cold dry air; wider nostrils facilitate heat loss in hot humid climates.
      *   *The Critique:* Correlation does not equal causation. Genetic drift, sexual selection, and allometric scaling (byproducts of overall face size) are plausible alternatives. Gould & Lewontin's "Spandrels of San Marco" warns against assuming every trait is an optimal adaptation.
      *   *Current Consensus:* It's likely a mix, but the climate signal is statistically significant in large populations. However, presenting it as a *definitive* "direct product of natural selection" without nuance risks oversimplification and potential misuse (scientific racism implications regarding racial typology).

  3.  **Determine the Recommendation:**
      *   *Publish as is:* Too risky. Ignores valid scientific debate. Risks appearing dogmatic.
      *   *Strike:* Too cautious. There *is* evidence for climate adaptation. Removing it erases legitimate science.
      *   *Publish with caveat/nuance:* Best option. Acknowledges the evidence while admitting complexity. Fits the educational mission of a museum (teaching critical thinking, not just facts).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo (addressing the nose shape panel).
      *   **Engaging the Pro-Adaptation Argument (Requirement 3):** Acknowledge why the current text is tempting. It's intuitive, has empirical backing (Thomson's rule, recent GWAS), and fits the narrative of human migration/adaptation. It's not "pseudoscience," just potentially overstated.
      *   **Engaging the Critique (Requirement 2 & Context):** Address the Gould/Lewontin concern. Adaptationism isn't wrong, but *pan*-adaptationism is. Mention alternative drivers (drift, sexual selection, developmental constraints). Mention the social sensitivity (racial typology).
      *   **The Standard (Requirement 2):** What makes an adaptation claim "exhibit-ready"?
          *   Falsifiability.
          *   Exclusion of alternatives (or acknowledgment of them).
          *   Strength of evidence (statistical vs. mechanistic).
          *   Avoidance of "Just-So Stories."
      *   **The Recommendation (Requirement 1):** Publish with a caveat/reframing. Shift from "This *is* why" to "Evidence suggests..." or "One leading hypothesis..."
      *   **Closing:** Call to action for Thursday's meeting.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic. I'm a journalist *and* a committee member, so I bridge the gap between public communication and scientific rigor.
      *   Avoid taking sides aggressively. Validate both halves of the committee.
      *   Use precise language (e.g., "pluralistic approach," "nuance," "educational opportunity").

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I mention Gould and Lewontin? Yes, essential given the prompt.
      *   *Check:* Is the recommendation concrete? Yes, "Revise and Publish with Nuance."
      *   *Check:* Is the standard clear? Yes, I need to articulate criteria for adaptation claims.
      *   *Check:* Is it short? Keep it under 2 pages/single-spaced equivalent.
      *   *Potential Pitfall:* Don't get bogged down in too much genetic detail. Keep it focused on exhibit philosophy.
      *   *Social Context:* It's crucial to mention that nose shape is often racialized. A museum exhibit needs to be careful not to reinforce biological race concepts while discussing variation. I should add a note about this.

  7.  **Final Polish:** Ensure the voice sounds like a thoughtful science journalist (clear, engaging, precise) speaking to scientists. (Proceed to generate output based on these thoughts.)

      *(Self-Correction on the "Standard"):* Make sure the standard isn't just "prove it." It's about "weight of evidence vs. certainty."
      *(Self-Correction on the "Recommendation"):* Instead of just "caveat," suggest specific wording changes.

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Scientific Advisory Committee, Natural History Museum
  **FROM:** [Your Name], Science Journalist & Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Human Nose Shape Exhibit Panel

  **Purpose**
  This memo addresses the ongoing debate regarding the draft text for the human body exhibit panel on nasal morphology. Specifically, it concerns the assertion that nose shape variation is a *direct product* of natural selection for air conditioning (climate adaptation). With the committee divided, I recommend we **publish the panel with revised wording that reflects scientific uncertainty and competing hypotheses**, rather than publishing the current definitive claim or striking the content entirely.

  **The Case for the Adaptationist Narrative**
  We must fairly acknowledge why the current draft appeals to half the committee. The correlation between nasal index and climate is robust across large populations, supported by classical anthropological data (Thomson's Rule) and reinforced by recent genomic studies identifying signatures of selection in genes affecting nose shape (e.g., *GLI3*, *DCHS2*). To remove this entirely would be to ignore a compelling example of how human populations biologically interacted with diverse environments during migration. It is an intuitive, pedagogically useful story that aligns with the public's expectation of evolutionary logic.

  **The Case for Caution (The Spandrels Critique)**
  However, the opposing half of the committee raises a methodological objection rooted in Gould and Lewontin's critique of pan-adaptationism. Asserting that a trait is *the* product of natural selection requires more than correlation; it requires ruling out alternatives. Nasal morphology is highly correlated with overall facial size, which is subject to allometric scaling and genetic drift. Furthermore, sexual selection is a potent driver of facial features in primates. By presenting the climate hypothesis as settled fact, we risk teaching visitors that all traits are optimal adaptations ("Just-So Stories"), which undermines our educational mission to teach the *process* of science, not just its conclusions.

  Additionally, as a public institution, we must be aware that linking specific physical traits to climate zones can inadvertently reinforce typological concepts of race. Nuance is a safeguard against misinterpretation.

  **A Standard for Adaptationist Claims**
  To resolve this and future disagreements, I propose we adopt the following standard for when an adaptationist claim is strong enough for public display:

  1.  **Mechanistic Plausibility:** Is there a functional link between the trait and the proposed selective pressure? (Yes, for nose shape/airflow).
  2.  **Exclusion of Alternatives:** Have other drivers (drift, sexual selection, developmental constraints) been tested and found less likely, or are they acknowledged as co-factors?
  3.  **Probabilistic Language:** Does the text reflect the weight of evidence (e.g., "suggests," "likely influenced by") rather than deterministic certainty (e.g., "evolved to," "is a product of")?

  **Recommendation**
  I recommend we **revise and publish**. Striking the panel throws out valid science; publishing it as written throws out scientific rigor.

  We should reframe the text to present climate adaptation as the *leading hypothesis* rather than the *sole explanation*. For example, change "The nose evolved to condition air..." to "Scientists hypothesize that climate played a key role in shaping nasal variation, though other factors like genetic drift may also contribute."

  This approach respects the evidence while modeling critical thinking for our visitors. It turns a potential controversy into an educational opportunity about how evolutionary biologists weigh evidence. I look forward to discussing specific wording options at Thursday's meeting.
