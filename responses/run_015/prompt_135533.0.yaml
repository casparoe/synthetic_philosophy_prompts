  Here is a brief contemplation on the architecture of the piece, followed by the poem itself.

  ### On Form and Argument

  When we teach Berkeley, we often stumble over the recursive nature of his claim: to deny perception is to perform an act of perception. A linear argument struggles to capture this; it moves from premise to conclusion, whereas Berkeley's insight is a loop, a trap you walk into simply by thinking. This is why the sestina is the perfect vessel. Its six end-words do not merely rhyme; they return, rotated but inescapable, much like the objects in Berkeley's ontology. You try to leave the word behind, but the form forces it back into the line, just as the mind forces itself back into the imagination.

  Specifically, notice the word *nothing*. In materialist philosophy, it represents the space where objects exist without observers. In this poem, every time *nothing* appears at the end of a line, it attempts to signal an end or a void. But because it is an end-word, it is structurally significant—it is *something*. It occupies space. It is perceived. This mirrors Berkeley's assertion that "nothing" (unperceived matter) is a contradiction in terms; you cannot posit it without making it an object of thought.

  Finally, the envoi binds the observer and the observed. By placing *mind* and *eye* adjacent to one another, I intend to collapse the distance between the thinker and the thing thought. There is no gap, no interval where the world exists alone. There is only the seeing.

  ***

  ### The Unconceived Garden

  You stand before the solitary **tree**,
  And claim it grows within an empty **garden**.
  You shut your own perceiving **eye**,
  To let the leaves dissolve into the **dark**.
  You think to clear the contents of your **mind**,
  And leave behind only substantial **nothing**.

  But can you truly conjure up such **nothing**?
  To picture wood and bark, you need a **tree**.
  The thought itself resides within the **mind**,
  You walk again around the phantom **garden**.
  No sun arrives to banish this **dark**,
  For you are still the witnessing **eye**.

  There is no view without a seeing **eye**,
  To name the void is not to make **nothing**.
  The shadows lengthen in the mental **dark**,
  Yet still you lean against the imagined **tree**.
  You cannot step outside the private **garden**,
  Where logic grows inside the human **mind**.

  What exists outside the waiting **mind**?
  You strain the pupil of the inner **eye**,
  But find no gate leading from this **garden**.
  Unperceived matter is merely **nothing**,
  A word we hang upon a bare **tree**,
  To frighten ourselves with concepts of the **dark**.

  So let the sun go down upon the **dark**,
  For being relies upon the active **mind**.
  You cannot separate the root from **tree**,
  Nor split the vision from the seeing **eye**.
  To say it stands alone is to say **nothing**,
  Beyond the walls of this enclosed **garden**.

  Who tends the blooms inside this **garden**?
  If all is shadowed in the universal **dark**,
  And matter amounts to absolute **nothing**,
  Then existence requires a perceiving **mind**.
  Or else it vanishes from every **eye**,
  That solitary, unobserved **tree**.

  There is no exit from the thoughtless **garden** into **nothing**,
  No sun to fade into the **dark** without a **tree**;
  All being rests within the **mind eye**.
