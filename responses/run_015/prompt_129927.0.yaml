answer: |-
  ### Preamble: Conceptual Architecture

  Before specifying the desiderata, we must clarify the ontological status of the relata. In experimental physics, causation is often modeled as a transfer of conserved quantities (energy, momentum) between localized events. Omissions violate this ontology: an absence is not a localized event, nor does it carry energy. Therefore, a theory of omission causation suitable for science cannot be a strict *process theory* of causation. It must be a theory of *causal explanation* grounded in dependency relations between variables.

  The following specification treats "causation" in the context of omission not as a fundamental metaphysical glue, but as a robust dependency relation invariant under intervention. This allows us to satisfy scientific explanatory practices without violating physical conservation laws.

  ---

  ### Formal Specification of Desiderata for Omission Causation

  #### 1. The Relevance Constraint (Genuine Omission vs. Mere Absence)
  *   **Formal Requirement:** The theory must define a set of *Admissible Variables* $\{V\}$ such that an omission is causal only if the absent factor corresponds to a variable $V_i$ that is (a) physically possible in the context, and (b) mandated by a specific system description or protocol $P$.
  *   **Motivating Case:** In a replication study of a radiation experiment, the shielding mechanism $S$ is missing, and the detector registers high counts. The report cites "absence of shielding" as the cause. It does not cite "absence of a magic forcefield" or "absence of a second shield that was never planned."
  *   **Rationale:** Without this constraint, the theory succumbs to the "problem of profligate omissions," where every effect has infinite causes (the absence of every preventer). Science requires selectivity based on experimental design and physical possibility.
  *   **Status:** **Non-Negotiable.** A theory that cannot distinguish between a missing control and an irrelevant absence is useless for experimental reporting.

  #### 2. The Asymmetry Condition (Directionality without Pure Normativity)
  *   **Formal Requirement:** The causal relation $C \to E$ involving an omission must be asymmetric with respect to the *valence* of the outcome, grounded in the system's dynamic baseline, not solely in moral or social norms. Specifically, if $O$ is the omission of a preventive factor, $O \to \text{Damage}$ is valid, but $O \to \text{Benefit}$ must be invalid unless the baseline expectation is damage.
  *   **Motivating Case:** Failing to administer a toxin (omission of harm) prevents damage; it does not *cause* health improvement in a symmetric way. Conversely, failing to administer medicine (omission of help) causes deterioration. The asymmetry must track the *deviation from a stable physiological or physical baseline*, not just "good vs. bad."
  *   **Rationale:** If causation were purely normative, it would vary with the observer's values. Scientific explanation requires the asymmetry to track the direction of deviation from a homeostatic or null-state baseline.
  *   **Status:** **Non-Negotiable.** Causal asymmetry is a core feature of scientific reasoning. However, the *grounding* of this asymmetry (norms vs. baselines) is camp-specific. I argue for baseline-dependence.

  #### 3. The Specificity Requirement (Cause vs. Background Condition)
  *   **Formal Requirement:** In a set of redundant absent factors $\{O_1, O_2, ... O_n\}$, the theory must identify a unique causal omission $O_c$ based on *interventional sensitivity*. $O_c$ is the cause if and only if restoring $O_c$ (while holding others absent) changes the outcome $E$, whereas restoring other $O_i$ does not, or does so with significantly lower probability.
  *   **Motivating Case:** An experiment fails because both a temperature controller and a pressure valve were left off. Both were absent. However, the temperature controller was the *active* feedback loop required for this specific reaction, while the pressure valve was a redundant safety. The report must cite the temperature controller.
  *   **Rationale:** This solves the "problem of many absences." It aligns with the experimentalist's method of isolating variables. It distinguishes between a *cause* (difference-maker) and a *background condition* (necessary but not sufficient for the specific variance observed).
  *   **Status:** **Non-Negotiable.** Essential for troubleshooting and error analysis.

  #### 4. Conservation Compatibility (The Physicalist Constraint)
  *   **Formal Requirement:** The theory must explicitly state that omissions do not transmit energy or momentum. Causal claims involving omissions must be interpreted as claims about *counterfactual dependency of processes*, not the *generation of processes*.
  *   **Motivating Case:** A photon hits a detector because a shutter was open (omission of closing). The photon carried the energy. The "opening" (or failure to close) carried none. Yet the report says "the open shutter caused the detection."
  *   **Rationale:** To maintain consistency with fundamental physics, we must distinguish between the *ontological vehicle* of causation (energy flow) and the *explanatory structure* of causation (dependency). Omissions belong to the latter.
  *   **Status:** **Non-Negotiable for Physics, Contingent for Metaphysics.** A strict process theorist will deny omission causation entirely. To satisfy your request for a theory that *allows* scientific reports to treat them as explanatory, we must adopt a pluralist stance: ontological causation (process) vs. explanatory causation (dependency).

  #### 5. The Non-Additivity Clause (Double Omissions)
  *   **Formal Requirement:** The causal strength of concurrent omissions $\{O_A, O_B\}$ must not equal the sum of their individual causal strengths. Formally, $Effect(O_A \land O_B) \neq Effect(O_A) + Effect(O_B)$. The theory must include interaction terms or threshold functions.
  *   **Motivating Case:** In a safety system, the absence of Sensor A triggers an alarm. The absence of Sensor B triggers an alarm. The absence of *both* does not cause "double alarm" or "double damage"; it causes the same failure state, or potentially a different systemic collapse that is not linearly additive.
  *   **Rationale:** Prevents the "explosion of causal magnitude." It reflects the logical structure of failure modes (often OR/AND gates) rather than arithmetic accumulation.
  *   **Status:** **Non-Negotiable.** Required for accurate modeling of complex systems and redundancy.

  ---

  ### Critical Tension Analysis: Desiderata (1) and (4)

  There is a profound tension between **Requirement 1 (Relevance)** and **Requirement 4 (Conservation Compatibility)**.

  *   **The Conflict:** Requirement 1 demands that we treat specific absences as *genuine causes* in scientific reports (e.g., "The lack of shielding caused the contamination"). Requirement 4 acknowledges that absences carry no physical mark (energy/momentum) and are ontologically distinct from positive events.
  *   **Joint Satisfiability:** These are **jointly unsatisfiable** under a monistic ontology of causation.
      *   If you insist causation *is* energy transfer (Strict Physicalism), you must reject (1). You would have to rewrite the report to say: "The incident cosmic rays caused the contamination; the shielding was merely a condition that, had it existed, would have interrupted the rays."
      *   If you insist absences are genuine causes (Explanatory Realism), you must relax (4)'s implication that causation *requires* energy transfer.
  *   **Proposed Resolution:** To satisfy both for the purpose of scientific explanation, you must adopt a **Dual-Track Account**:
      1.  **Ontological Track:** Fundamental causation is physical process (satisfies 4).
      2.  **Explanatory Track:** Scientific causation is invariant dependency under intervention (satisfies 1, 2, 3, 5).
      *   *Verdict:* On this view, "omission causation" is a legitimate category of *explanation*, but not a fundamental category of *physics*. This is the only way to preserve the utility of omission talk in error reports without violating conservation laws.

  ---

  ### Evaluation of Existing Frameworks Against Desiderata

  To assist your positioning in seminar discussions, here is how standard accounts fare against this specification:

  1.  **Counterfactual Accounts (e.g., Lewisian):**
      *   *Performance:* Strong on (1) and (3). Weak on (2) and (4).
      *   *Critique:* They handle absence well ("If shield had been there...") but struggle with asymmetry (counterfactual dependence can be symmetric) and completely ignore the physical constraint (4). They treat omissions as ontologically equal to events, which irritates physicalists.

  2.  **Normative/Functionalist Accounts:**
      *   *Performance:* Strong on (1) and (2). Weak on (4).
      *   *Critique:* They solve the "profligate omissions" problem by appealing to norms (the shield *should* have been there). However, they risk making causation too subjective. If the "norm" is merely social, it violates the objectivity required for physics. They must ground norms in *system functions* to pass (2).

  3.  **Probabilistic Accounts:**
      *   *Performance:* Strong on (5). Weak on (1) and (3).
      *   *Critique:* Good at handling redundancy and interaction (Non-Additivity). However, probability raises do not easily distinguish between a cause and a background condition without interventionist criteria. They also struggle to distinguish absence from low probability presence.

  4.  **Interventionist Accounts (e.g., Woodward):**
      *   *Performance:* **Best Fit.** Strong on (1), (2), (3), and (5). Compatible with (4) via the Dual-Track resolution.
      *   *Critique:* This framework defines causation via variables and interventions. An omission is simply a variable set to a baseline value $0$ instead of $1$. It respects the physical constraint by treating the *intervention* as the physical event, while the *value* (absence) is the explanatory factor. This aligns best with experimental practice.

  ### Summary Recommendation

  For a theory of omission causation to serve scientific explanation, it must be **Interventionist** in structure but **Pluralist** in ontology.

  *   **Non-Negotiable:** You must accept that "causation by omission" is a feature of our *explanatory models*, not necessarily a feature of the *fundamental furniture of the universe*.
  *   **The Trade-off:** To keep (1) (Omissions are causes in reports) and (4) (Absences carry no energy), you must concede that the word "cause" is being used in two slightly different senses: one ontological (process) and one epistemic (dependency).

  This specification provides the rigor required for a philosopher of science while respecting the physical intuitions of an experimentalist. It isolates the metaphysical cost (pluralism) required to save the explanatory practice.
