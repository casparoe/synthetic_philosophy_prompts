      *   **Part 2: Can Endurantism Save the Specimen without Swallowing the Site?**
          *   Yes, if we distinguish *Constitution* from *Identity*. The specimen is constituted by matter but identical to a historical individual. The site is constituted by a location/process.
          *   However, strict Endurantism struggles with the "Ship of Theseus" problem in the museum. If 90% is resin, is it the same bone? Biologists say yes. Philosophers might balk.
