answer: |-
  This is a profound observation that cuts to the core of how scientific practice implicitly solves metaphysical problems without necessarily acknowledging them. You have identified a case of **ontological pluralism driven by epistemic utility**. Biology does not operate under a single metaphysics of persistence; it operates under a *pragmatic* metaphysics that shifts depending on whether the goal is *reference fixation* (taxonomy), *process tracking* (ecology), or *resource allocation* (conservation).

  Here is a reconstruction of the implicit theory, an analysis of its consistency, and the implications of shifting to a rigorous four-dimensionalist framework.

  ### 1. Diagnosis: What View of Persistence is Presupposed?

  Your cluster of practices does not presuppose a single view (endurantism or perdurantism) but rather employs **Sortal-Relative Persistence**.

  *   **The Museum Holotype (Taxonomy):** This practice presupposes a form of **Historical Endurantism** anchored by *Rigid Designation*. The holotype is treated as a substance that endures through time. However, its identity is not grounded in its material constitution (since resin replaces bone) but in its *causal history of origin* (the specific organism collected at time *t* by collector *x*). The catalog number acts as a Kripkean rigid designator; it points to that specific spacetime origin, regardless of current material composition. It is treated as an enduring particular because its function is to fix the reference of a name.
  *   **The Watershed Site (Ecology):** This practice presupposes **Perdurantism (or Process Ontology)**. The "site" is not a substance but a *spacetime region* defined by functional boundaries. It persists not by being "wholly present" at every moment, but by having temporal parts that are causally connected. The identity is maintained by the continuity of the *process* (water flow, data collection), not the continuity of the *stuff* (water molecules, soil ions).
  *   **Conservation Policy (Ethics/Management):** This presupposes **Token-Replaceability within Types**. Wild individuals are treated as interchangeable tokens of a species-type (the real object of moral concern). The holotype, conversely, is treated as a *unique token* that constitutes the type's definition.

  **Verdict:** The practices commit to **Contextual Ontology**. They are metaphysically inconsistent if viewed as claims about the fundamental nature of reality, but consistent if viewed as *instrumental stances* tailored to specific scientific goals.

  ### 2. Can an Endurantist Account for the Specimen Without Swallowing the Site?

  Yes, but only by invoking **Sortal Dependence**.

  An endurantist argues that objects are wholly present at each moment. To distinguish the specimen from the site, the endurantist must argue that *what it is to be* a specimen is different from *what it is to be* a site.

  *   **The Specimen:** Falls under the sortal "Historical Individual." Its persistence conditions are *genetic/historical*. As long as there is a continuous causal chain linking the current object to the original collection event, it endures. Material replacement is accidental change, not substantial change.
  *   **The Site:** Falls under the sortal "Functional Region." Its persistence conditions are *spatiotemporal/functional*. If the water stops flowing or the boundaries shift, the site ceases to exist, even if the dirt remains.

  **The Risk:** This saves the distinction but collapses into **Conventionalism**. It admits that "persistence" is not a feature of the world, but a feature of how we categorize the world. If you press the endurantist on *why* the specimen's sortal allows material replacement while the site's does not, they must appeal to human interest (taxonomy needs stability; ecology needs flow). This concedes that the metaphysics is driven by methodology, not ontology.

  ### 3. Is the Dual Practice Philosophically Consistent?

  **Strictly speaking: No.**
  **Pragmatically: Yes.**

  The inconsistency lies in the **Conservation Policy** vs. **Museum Practice**.
  *   **Inconsistency:** Why does the dead, resin-infused holotype have "irreplaceable" status (implying unique moral or ontological weight), while the living, breathing wild animal is "replaceable"?
  *   **Metaphysical Explanation:** The holotype is a *Name-Bearer*. In the philosophy of language, the bearer of a proper name (or scientific name) is unique. If you lose it, the link between word and world is severed. The wild animal is merely a *satisfier of a description* (a member of *Ursus arctos*).
  *   **The Conflict:** This privileges *epistemic objects* (things we know with) over *ontological subjects* (things that feel and live). It commits the fallacy of reifying the map (the catalog) over the territory (the biosphere).

  The practices quietly commit to incompatible metaphysics: **Essentialism** for the holotype (it has an essence that survives material change) and **Nominalism/Functionalism** for the ecosystem (it is just a label for a collection of processes).

  ### 4. The Four-Dimensionalist Overhaul

  If we adopted a consistent **Perdurantist (4D)** framework, where objects are "spacetime worms" composed of temporal parts, protocols would shift significantly:

  **A. Museum Cataloging:**
  *   **Current:** The catalog entry describes the object as it exists *now*, with notes on conservation.
  *   **4D Change:** The holotype would be cataloged as a *temporal trajectory*. The "object" is the entire worm from collection date to extinction. Conservation would not be about preserving the "current stage" but about ensuring the *continuity of the worm*.
  *   **Protocol:** If a bone is replaced by resin, this is not "repairing the object" but "grafting a new temporal part." The catalog would need to explicitly model the *time-slices*. A 3D scan would be treated as a distinct temporal part, potentially equal in authority to the physical residue. The "holotype" would be the aggregate of all these stages.

  **B. Ecological Datasets:**
  *   **Current:** "Site A" is a variable that remains constant across rows of data from 1970–2020.
  *   **4D Change:** "Site A" would be recognized as a series of distinct temporal entities (Site-A-1970, Site-A-1971) linked by causal relations.
  *   **Protocol:** Statistical models would explicitly account for *temporal parts* rather than assuming a persistent substrate. We would stop asking "How did the site change?" and start asking "How do the temporal stages of this watershed worm differ?" This sounds semantic, but it prevents the error of assuming the 1970 soil chemistry is the "same" as the 2020 chemistry in a strong sense.

  **C. Conservation Ethics:**
  *   **Current:** Save the species (the class); individuals are expendable.
  *   **4D Change:** A species is a large, branching spacetime worm (a lineage). An individual is a thin filament.
  *   **Protocol:** Moral standing might shift to the *continuity of the lineage worm*. Extinction is the truncation of the worm. This actually reinforces current policy but provides a metaphysical grounding: we value the *extension* of the worm in time, not the atoms within it.

  ### 5. Requirements vs. Accommodations

  To reconstruct the implicit theory, we must distinguish what the science *needs* to function from what it merely *tolerates*.

  | Domain | **Strict Requirements** (What breaks the practice) | **Metaphysical Accommodations** (What is tolerated) |
  | :--- | :--- | :--- |
  | **Museum (Holotype)** | **Continuity of Custody/Chain of Evidence.** If the catalog link is broken, the object loses taxonomic authority. | **Material Continuity.** The practice tolerates total material replacement (Ship of Theseus) as long as the historical chain is unbroken. |
  | **Ecology (Site)** | **Spatiotemporal Coordinates.** If the location shifts, the data series is invalid. | **Material/Constituent Continuity.** The practice tolerates total turnover of water, soil, and organisms. |
  | **Conservation** | **Reproductive Viability.** If the population cannot breed, it is "lost." | **Individual Identity.** The practice tolerates the death of any specific animal, provided the genetic lineage continues. |

  **Implicit Theory:** **Reference Stability > Material Stability.**
  In all three cases, the *informational link* (catalog number, GPS coordinate, gene pool) is the enduring entity. The physical matter is merely the transient carrier of that information. The biology is secretly **Informational Structural Realism**.

  ### 6. Falsification Conditions

  You asked what argument or empirical finding would cause me to revise this diagnosis.

  **Empirical Finding:**
  If taxonomic stability were shown to **fail** upon significant material replacement of the holotype, the "Historical Endurantism" diagnosis would collapse.
  *   *Scenario:* Suppose we discover that microscopic structural integrity (not just DNA, but crystalline bone structure) is required for future taxonomic revisions (e.g., new imaging techniques reveal species distinctions invisible to the naked eye). If the resin-substituted parts render the holotype "blind" to these future techniques, and the scientific community subsequently *revokes* the holotype status of a heavily conserved specimen in favor of a "neotype" (a new specimen), then the practice does *not* treat the object as enduring. It treats it as **Ephemeral Substrate**.
  *   *Revision:* This would prove the practice is not Endurantist at all, but **Eliminativist**: the "holotype" is just a placeholder until a better physical carrier is found.

  **Philosophical Argument:**
  If it were demonstrated that **Rigid Designation fails without Material Continuity.**
  *   *Argument:* If we could create a perfect atomic duplicate of the holotype (a clone) at the moment of collection, and swap them, would the taxonomy hold?
  *   *Current Diagnosis:* I assume biologists would say "No, it must be the *original* matter." (Supports Historical Endurantism).
  *   *Revision:* If biologists accepted the duplicate as the valid holotype (because the *information* is identical), then the metaphysics is purely **Patternism**. The "object" is just a pattern, and the matter is irrelevant. This would align the Museum practice fully with the Ecological practice (both are pattern-tracking), resolving the inconsistency I identified above.

  ### Summary for the Biologist

  You have correctly spotted that biology uses **three different metaphysical tools for three different jobs**.
  1.  **Taxonomy** uses a legalistic/historical metaphysics (The Object as Witness).
  2.  **Ecology** uses a process metaphysics (The System as Flow).
  3.  **Conservation** uses a statistical metaphysics (The Population as Probability).

  The inconsistency is real but harmless because the *goals* differ. To make them consistent, you would have to prioritize one goal (e.g., Information Preservation) over the others. If you did, you would likely find that the **Museum Holotype** is the most vulnerable: it is the only one pretending to be a "substance" when it is actually just a "reference point." A consistent four-dimensionalist biology would treat the holotype not as a sacred bone, but as a time-stamped data node, equal in status to a high-resolution scan, demystifying its "irreplaceable" nature and perhaps aligning its value closer to that of the living wild animal.
