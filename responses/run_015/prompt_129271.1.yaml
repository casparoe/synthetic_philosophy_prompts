      *   **Core Observation:** Inconsistency in how biology treats "persistence through change."
          *   *Case A (Museum Holotype):* Physical matter changes (conservation, extraction), but identity persists. Treated as an enduring individual.
          *   *Case B (Ecological Site):* Total material turnover (organisms, soil, instruments), but identity persists. Treated as a continuing entity based on spatiotemporal continuity/data.
          *   *Case C (Conservation Policy):* Individual wild animals = replaceable (no moral standing). Museum object = irreplaceable.
      *   **Questions:**
          1.  What view of persistence (endurantism, perdurantism, hybrid) do these practices presuppose?
