          3.  Is the dual practice philosophically consistent, or does it commit to incompatible metaphysics?
          4.  If we adopted a consistently four-dimensionalist (perdurantist) framework, what would change in protocols/datasets?
          5.  Reconstruct the implicit theory (distinguish requirements vs. accommodations).
          6.  What argument/finding would cause a revision of this diagnosis?

  2.  **Initial Philosophical Analysis:**

      *   *Endurantism:* Objects are wholly present at each moment. Persistence = qualitative change in the *same* substance.
      *   *Perdurantism (4D):* Objects are spacetime worms. Persistence = temporal parts.
      *   *The Tension:* The museum treats the holotype as a *substance* (enduring) despite material loss. The ecological site is treated as a *process* or *system* (perduring/functional) despite material turnover.
      *   *The Moral/Value Aspect:* Value is attached to *historical particularity* (the holotype) vs. *functional continuity* (the site) vs. *population viability* (wild animals).

  3.  **Drafting the Response - Section by Section:**

