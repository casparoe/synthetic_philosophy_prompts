      *   *Subcortical Arbitration:* Brainstem/thalamic mechanisms might still synchronize behavior without conscious unity.
      *   *Philosophical Problem:* Does shared affect constitute phenomenal unity? Or is unity defined by cognitive access? Can you have "one feeler" but "two thinkers"?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Phenomenal vs. Access Distinction.* Crucial in philosophy of mind (Block). In split-brain, access is clearly divided (left can't report right's stimulus). But is phenomenology divided?
      *   *Desideratum 2: Affective vs. Cognitive Integration.* This is the core of the user's specific focus. AC spares affect. CC cuts cognition. A theory must explain if affective sharing counts as unity.
      *   *Desideratum 3: Behavioral Coordination vs. Conscious Unity.* Subcortical arbitration allows smooth behavior without conscious unity. Theory must distinguish "acting as one" from "experiencing as one."
      *   *Desideratum 4: Gradedness vs. Binary Subjecthood.* Is consciousness all-or-nothing? If AC allows *some* integration, is the subject *partially* unified? This clashes with the metaphysical idea of a subject being a discrete countable entity.
      *   *Desideratum 5: Diachronic Stability.* Acute vs. gradual disconnection. Plasticity matters. A theory shouldn't rely solely on acute surgical shock.
      *   *Desideratum 6: First-Person Authority/Reportability.* Can the patient report unity? If they can't (due to speech lateralization), does unity vanish?

  4.  **Refining and Categorizing:**
      *   Need to organize these logically. Let's group them: Phenomenological Scope, Functional Architecture, Metaphysical Commitments, Empirical Adequacy.
      *   *Refining the AC specific:* Need a specific desideratum on "Affective-Phenomenal Coupling."
      *   *Refining the Subcortical:* Need a specific desideratum on "Subcortical Arbitration vs. Conscious Coordination."

  5.  **Identifying Tensions (Jointly Unsatisfiable Pairs):**
      *   *Tension 1:* Binary Subjecthood vs. Graded Integration. If AC allows 50% integration, are there 1.5 subjects?
      *   *Tension 2:* Reportability vs. Phenomenal Reality. If the speaking hemisphere doesn't know about the other's feeling, can we claim unity exists?
      *   *Tension 3:* Subcortical Unity vs. Cortical Duality. If the brainstem unifies behavior, does that imply a unified subject even if cortices are distinct?

  6.  **Classifying Non-Negotiable vs. Camp-Specific:**
      *   *Non-Negotiable:* Empirical fit (must match data), Internal consistency, Distinction between access and phenomenology.
      *   *Camp-Specific:* Requirement for verbal report (linguistic bias), Commitment to Ego/Substance (vs. Bundle theory), All-or-nothing subjecthood.

  7.  **Evaluating Standard Views (Briefly):**
