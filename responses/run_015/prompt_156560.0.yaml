  10. **Final Polish:** Ensure the distinction between "Affective Integration" and "Cognitive Integration" is the through-line. (Proceed to generate output).

  *(Note on "Subcortical Arbitration"):* I need to be careful not to conflate subcortical motor coordination with phenomenal unity. The prompt asks to accommodate the possibility that subcortical mechanisms coordinate response *without* implying phenomenal unity.

