      *   *Dual-Stream (Puccetti/Schechter):* Fits the cognitive split, but might overlook affective unity via AC.
      *   *Graded-Integration (Hurley/Noë):* Fits the AC scenario well, but struggles with the metaphysics of "counting" subjects.

