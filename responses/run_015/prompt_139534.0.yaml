answer: |-
  Here is the defense you can take to your board. It is structured as an investment thesis: where the highest leverage lies for a two-year horizon, given your constraint that the output must change *practice* (panels, forecasting, replication) rather than just theory.

  ### Executive Summary: The Ordering

  If your goal is to change how expert groups are run, you should fund the problems in this order:

  1.  **Priority 1: Communication Protocols under Bandwidth Constraints (Your category b).**
      *   *The Question:* If agents cannot transmit full posteriors, what compressed summaries (samples, quantiles, moments) allow for the fastest convergence to *accurate* agreement, and does pre-agreed compression matter more than message content?
  2.  **Priority 2: Bounded Depth and Stopping Rules (Your category a).**
      *   *The Question:* How many rounds of "I know that you know" are actually required before diminishing returns set in, and is there a procedural signal that indicates further deliberation is performative rather than informative?
  3.  **Priority 3: Heterogeneous Priors/State Spaces (Your category c).**
      *   *The Decision:* **Do not fund this as the primary postdoc project.** It is a career-scale problem, not a two-year one. Address this via the *workshops*, not the research grant.
  4.  **Normative Implications (Your category d).**
      *   *The Decision:* This is an **output**, not an input. You cannot determine the normative implications of disagreement until you know the mechanical constraints under which the disagreement persists.

  ---

  ### The Defense: Why This Order?

  #### 1. The Upstream Dependency (Why Bandwidth comes first)
  You asked which questions are upstream. **Bandwidth is the most upstream constraint.**

  In your old field of data assimilation, you could have the perfect prior and the perfect model, but if the observation channel is saturated or the covariance matrix is singular, the filter collapses. Aumann's theorem assumes a noiseless, infinite-bandwidth channel where agents transmit exact posteriors. This is never true in a boardroom, a Delphi panel, or a scientific collaboration.

  If you solve (c) (Priors) but ignore (b) (Bandwidth), you have a theory of how people *would* agree if they could speak telepathically. That is useless for designing a workshop. If you solve (b), you immediately generate design rules: *"Do not ask experts for a mean; ask for three samples,"* or *"Do not allow free-form discussion; force structured parameter exchange."*

  **Tractability:** High. This is information theory meets game theory. It can be attacked with pencil-and-paper bounds on convergence rates, validated by agent-based simulation. It fits a two-year timeline.
  **Practical License:** A result here licenses a foundation to write a "Communication Protocol for Expert Elicitation." It tells you what data to record from meetings.

  #### 2. The "Plumbing" vs. "Deep Theory" Trap
  You asked what you are overweighting. **You are likely overweighting (c) (No Common Prior/State Space) because it sounds deeper.**

  It is philosophically profound to ask if two people share a state space. But for a practitioner running a forecasting tournament, the answer is almost always "No." We know they don't. The question isn't *whether* they differ, but *how much friction* that difference creates.

  Funding a postdoc to tackle "Unawareness and State Space Mergers" is high risk. It often leads to definitions, not solutions. You will end up with a new taxonomy of disagreement, not a rule for running a panel. That is a career project, not a foundation project.

  Conversely, **you are underweighting (b) (Bandwidth) because it sounds like plumbing.** In engineering, plumbing is where the system fails. In data assimilation, the "fudges" (localization, inflation) *are* the system. They aren't hacks; they are the operational theory.
  *   **The Defense:** Treat communication constraints not as a deviation from the ideal, but as the *mechanism* of agreement. The "fudge factors" in human deliberation (summarizing, heuristics, time limits) are the localization functions of social learning. Understanding them is more valuable than proving they violate Aumann.

  #### 3. The Normative Question (Category d)
  Do not ask the postdoc to solve the normative question directly. It is downstream.

  Currently, the literature half-makes the inference that "Persistent disagreement implies irrationality." This is dangerous. If you fund a project that concludes "Disagreement is rational due to bandwidth limits," you change the policy from *"Force them to agree"* to *"Structure the channel better."*

  **The Workshop Role:** Use your two workshops to stress-test the postdoc's mechanical findings against the normative questions. Bring in the forecasters and the panel chairs. Ask them: *"If we tell you that bandwidth limits explain your polarization, does that change how you incentivize them?"* Let the practitioners decide the normativity based on the mechanics the postdoc provides.

  ---

  ### The Two-Year Plan: Milestones & Deliverables

  To justify this to your board, you need concrete deliverables, not just "progress." Here is what an 18-month check-in should look like for this to be considered a success.

  **Month 6: The Model Class**
  *   **Deliverable:** A formalized model of "Limited-Bandwidth Agreement."
  *   **Success Metric:** The model must explicitly reject the "transmit posterior" assumption. It should define agents who transmit $k$ bits or $n$ samples.
  *   **Fail State:** If the postdoc is still trying to salvage the common prior assumption, pivot them.

  **Month 12: The Convergence Simulation**
  *   **Deliverable:** Simulation results showing convergence rates under different compression schemes.
  *   **Success Metric:** A plot showing "Rounds to Consensus" vs. "Bits Transmitted." Crucially, it must distinguish between **Agreement** (they believe the same thing) and **Accuracy** (they believe the *true* thing).
  *   **Why:** Aumann guarantees agreement, not accuracy. If your protocol makes them agree faster but on the wrong answer, you have built a polarization engine. The postdoc must show which compression schemes preserve accuracy.
  *   **DA Analogy:** This is the equivalent of testing whether your localization function prevents filter divergence or just hides it.

  **Month 18: The Protocol Draft**
  *   **Deliverable:** A draft "Standard Operating Procedure" for expert panels.
  *   **Success Metric:** Specific, actionable rules. E.g., *"Iterative elicitation should stop after Round 3 because simulated information gain drops below noise floor,"* or *"Experts should exchange random samples from their posterior rather than means to prevent premature covariance collapse."*
  *   **Justification:** This moves the money from "theory" to "tool."

  ### What Moves the List Up or Down?

  You asked what result in 18 months would change the priority.

  **Scenario A: The "Cliff" Result (Moves Bandwidth to Critical)**
  If the simulation shows that agreement degrades *gracefully* with bandwidth, you can relax. If it shows a **phase transition**—where dropping from 10 bits to 9 bits causes consensus to collapse entirely—that is a high-stakes finding. It means panel design is fragile. You would then pour more money into robustness testing (Workshop 2).

  **Scenario B: The "Agreement != Accuracy" Result (Moves Priors Up)**
  If the postdoc proves that under bandwidth constraints, agents converge rapidly to a *shared wrong answer* (due to slight prior mismatches), then Category (c) (Priors) becomes urgent. You cannot fix the protocol until you fix the prior mismatch. This would shift the second postdoc (if you fund another) toward prior elicitation.

  **Scenario C: The "Negative" Result (Validates the Status Quo)**
  If the postdoc proves that *no* compression scheme allows for agreement without a common prior, that is a clean negative result. It licenses you to tell the field: *"Stop trying to engineer consensus in heterogeneous groups; focus on aggregation mechanisms (like prediction markets) instead of deliberation."* That is a massive pivot for the field, saving everyone from wasting time on failed consensus workshops.

  ### Summary of the Argument to the Board

  1.  **We are not funding a theorem.** We are funding a **protocol**.
  2.  **We are not studying ideal agents.** We are studying **constrained channels**, analogous to covariance localization in assimilation.
  3.  **We are not solving philosophy.** We are solving **engineering**. The normative implications will be derived from the mechanical limits we discover.
  4.  **Risk Management:** By prioritizing Bandwidth (b) over Priors (c), we ensure a deliverable in two years. If we start with Priors, we risk having nothing but definitions at the end of the grant.

  **The Pitch:** "Aumann tells us what happens when gods talk. We need to know what happens when humans email. This postdoc will write the manual for the email."
