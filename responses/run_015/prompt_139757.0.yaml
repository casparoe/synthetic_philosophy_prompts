answer: |-
  **One. The List**

  1.  The criterion must designate a state from which spontaneous return is impossible without external intervention. (Case: Auto-resuscitation after failed CPR. Tag: Non-negotiable)
  2.  The determination must fix the time of death to a specific instant. (Case: Insurance beneficiaries and criminal causation require precise timing. Tag: Non-negotiable)
  3.  The criterion must permit withdrawal of support without homicide liability. (Case: Ventilator removal in brain-dead patients. Tag: Non-negotiable)
  4.  The criterion must not classify a biological organism as dead solely to facilitate organ recovery. (Case: The layered declaration's provisional status. Tag: Non-negotiable)
  5.  The criterion must remain valid even if technology restores perfusion to previously non-functional tissue. (Case: Extracorporeal neural support restoring brain activity. Tag: Preference - Pro-Technology)
  6.  The criterion must not classify a permanently unconscious patient with an intact brainstem as alive. (Case: Persistent Vegetative State. Tag: Preference - Higher-Brain Camp)
  7.  The criterion must account for the somatic maintenance of a gestating fetus. (Case: Brain-dead pregnant woman. Tag: Preference - Somatic Unity Camp)
  8.  The criterion must preclude retroactive changes to legal status based on future outcomes. (Case: Layered declaration rescission. Tag: Non-negotiable)

  **Two. Prejudices Disguised as Desiderata**

  Several items on the list are not neutral requirements for legal coherence but substantive commitments to specific metaphysical or ethical camps. Item 6 is the clearest example: demanding that a patient in a Persistent Vegetative State be classified as dead is not a requirement for settling inheritance or avoiding homicide liability, as current whole-brain law already achieves those ends. This is exclusively a preference of the Higher-Brain camp, which equates personhood with consciousness. Adopting it would exclude the whole-brain and circulatory criteria entirely, reclassifying millions of currently "living" patients as corpses.

  Item 7 is the mirror image, a preference of the Somatic Unity camp. Insisting that the capacity to gestate a fetus proves life argues that biological integration outweighs neurological status. If taken seriously, this excludes the whole-brain criterion, as it implies a brain-dead body maintaining homeostasis is not dead.

  Item 5 appears neutral but functions as a technological veto. Demanding that a criterion remain stable under extracorporeal neural support (ENS) effectively requires that "irreversible" mean "irreversible by any conceivable technology." If we take this seriously, we may never be able to declare death, as future tech might restore function to any tissue. This is a preference for a definition of death that ignores technological context, favoring a traditionalist view that assumes biological finality is static. Conversely, rejecting Item 5 is a preference for a contextual definition of death that risks obsolescence.

  **Three. Jointly Unsatisfiable Subsets**

  The core philosophical tension lies in the incompatibility between Legal Finality, Biological Irreversibility, and Organ Viability under the new technological constraints.

  *Subset A: Legal Finality + Biological Irreversibility + ENS Reality*
  Items 2 and 8 demand that death be a fixed instant that cannot be retroactively altered. However, ENS demonstrates that biological function can return hours after circulatory arrest or even after a brain-death exam. If we maintain Legal Finality (death occurs at Time A) and acknowledge ENS Reality (function returns at Time B), we violate Biological Irreversibility (Item 1). Either the patient was not dead at Time A (making organ harvest potentially unlawful), or death is reversible (contradicting the statutory definition of irreversibility). You cannot have a legal instant that is biologically fallible without creating a zone of schizophrenia where a person is legally dead but biologically alive.

  *Subset B: Organ Viability + Dead Donor Rule + Legal Finality*
  The transplant community's layered declaration attempts to solve this by separating provisional death (for organs) from definitive death (for law). This satisfies Organ Viability but violates Item 8 (No Retroactivity). If the definitive determination rescinds the provisional one, the legal status of the body during organ recovery changes retroactively. If the organ recovery occurred while the patient was legally "alive" (provisionally), the Dead Donor Rule is violated. If the patient was legally "dead," but later found "alive," the homicide liability shield (Item 3) is compromised. You cannot have a retroactive rescission of death without undermining the certainty required for criminal law and inheritance (Item 2).

  *Subset C: Precise Timing + Biological Gradualism*
  Item 2 requires death to occur at a specific hour. However, biological cessation is often a process, not an event, particularly under ENS where perfusion is restored gradually. Demanding a precise instant forces a legal fiction onto a biological continuum. If we prioritize the instant, we risk misclassifying patients during the transition phase. If we prioritize the biology, we fail the legal need for precise timing in insurance and causation.

  **Four. The Most Exclusionary Requirement**

  Item 8 (No Retroactive Changes) does the most work. It rules out the layered declaration entirely, as that proposal relies on the coherence of retroactive rescission. It also forces a hard choice regarding ENS: if brain function returns after a determination, the determination was factually wrong. This requirement excludes any criterion that treats death as a provisional status dependent on future technological intervention. It demands that the determination be correct at the moment it is made, regardless of future developments. This effectively rules out any "permanent cessation" standard that relies on the absence of intervention to prove irreversibility, pushing the committee toward a stricter, perhaps unattainable, standard of biological finality.

  **Five. Scorecard**

  | Criterion | Legal Finality | Homicide Shield | Organ Viability | ENS Stable | Total |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Whole-Brain** | Pass | Pass | Pass | Fail | 3/4 |
  | **Higher-Brain** | Pass | Pass | Pass | Fail | 3/4 |
  | **Circulatory (Irreversible)** | Pass | Pass | Fail | Fail | 2/4 |
  | **Circulatory (Permanent)** | Pass | Pass | Pass | Fail | 3/4 |
  | **Organism-as-a-Whole** | Fail | Fail | Fail | Pass | 1/4 |

  *Note: "ENS Stable" indicates whether the criterion holds if neural function is restored extracorporeally. Most fail because restoration implies the cessation was not irreversible.*
