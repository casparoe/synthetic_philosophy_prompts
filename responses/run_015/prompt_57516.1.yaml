  "I'll take the Libertarian Premium," the customer says. "Ultimate origination."

  "Then your choice explains nothing about you," the clerk says. "It's random noise. You want responsibility for static?"

  "Fine. The Compatibilist Standard."

  "That's just determinism with a PR team," the clerk says. "Philosophers buy it to sleep, but it's clockwork."

  "I want the version where I'm the source, but my choices still follow from *me*."

  The clerk gestures to a dusty, empty shelf. "The Coherent Self-Cause? Never existed. You're asking for a square circle with moral weight."

  From the back, a Determinist chuckles, browsing a pamphlet. "Save your breath. I'm here because causality brought me. Couldn't leave if I tried."

  "Shut up," the customer says.

  "See?" says the clerk. "Even your anger is caused. Cash or card?"

  "Card," the customer mutters. "Obviously."
