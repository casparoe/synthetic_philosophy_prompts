answer: |-
  # SEMINAR HANDOUT: THE LOGIC OF NUMBERS IN RESCUE
  **Course:** Advanced Moral Philosophy | **Topic:** Aggregation & Rescue Cases

  ## PART I: THE DECISION TREE
  *Instructions: Navigate the tree by answering the concrete cases. Do not look at the leaf labels until you have committed to a path. Your answers map your position in the logical space.*

  **START: The Base Case**
  **Case 1:** Five people will die on the left path; one person will die on the right. Stakes are identical (life vs. life). Claims are identical (no special ties). You can save only one group.
  **Q1:** Is the fact that there are *five* of them (rather than one) a moral reason to save the left group?
  *   **NO** → Go to **Node 2**.
  *   **YES** → Go to **Node 3**.

  **NODE 2: The Procedure of Indifference**
  **Case 1 (Revisited):** You have denied that the number 5 is a reason. You must now choose a method to decide.
  **Q2:** Does fairness require you to give each individual an equal ex-ante chance (e.g., flip a coin), or may you pick arbitrarily without randomizing?
  *   **Flip a Coin Required** → **LEAF A: Procedural Equality** (Often paired with Non-Aggregative views).
  *   **Arbitrary Pick Permitted** → **LEAF B: Taurek-Style Non-Aggregation** (Numbers are never reasons; procedure is unconstrained).

  **NODE 3: The Strength of the Reason**
  **Case 1 (Revisited):** You have accepted that the number 5 is a reason.
  **Q3:** Does this reason make saving the five *morally required*, or merely *permissible* (i.e., you may save the one without wrongdoing)?
  *   **Merely Permissible** → **LEAF C: Permissive Aggregation** ("May-but-need-not").
  *   **Morally Required** → Go to **Node 4**.

  **NODE 4: Severity vs. Number**
  **Case 2:** One person will lose a leg. Five people will each lose a pinky finger. The loss of a leg is significantly worse for the one than a finger is for any of the five.
  **Q4:** Does the greater number (5) override the greater stake (Leg)?
  *   **NO (Save the Leg)** → **LEAF D: Weighted Aggregation** (Numbers count, but stakes weigh heavier).
  *   **YES (Save the Fingers)** → Go to **Node 5**.

  **NODE 5: The Triviality Limit**
  **Case 3:** One person will die. One million people will suffer a mild headache for one hour.
  **Q5:** Does the enormous number of headaches aggregate to outweigh the single death?
  *   **NO** → **LEAF E: Moderate Aggregation** (Numbers count, but have a lexical floor).
  *   **YES** → Go to **Node 6**.

  **NODE 6: The Threshold Test**
  **Case 4:** Compare **2-vs-1** (save 2 lives vs 1 life) against **100-vs-1**.
  **Q6:** Does the duty to save the many trigger at 2-vs-1, or only after a specific ratio (e.g., 100-vs-1)?
  *   **Triggers at 100, not 2** → **LEAF F: Threshold View** (Student Proposal).
  *   **Triggers at 2** → Go to **Node 7**.

  **NODE 7: Structure of Harm**
  **Case 5:** You can save five by switching a trolley. This kills one as a *side effect* (not as a means). Compare this to **Case 6:** One person receives five small benefits vs. Five people receive one small benefit each (Intrapersonal Aggregation).
  **Q7:** Do numbers count identically in side-effect cases and intra-personal cases?
  *   **NO (Structure matters)** → **LEAF G: Structural Constraints** (e.g., Doctrine of Double Effect / Contractualism).
  *   **YES (Structure irrelevant)** → **LEAF H: Strict Utilitarian Aggregation**.

  ***

  ## PART II: MAP LEGEND & THEORETICAL STABILITY

  ### The Leaves
  *   **Leaf A (Procedural Equality):** Numbers do not create obligations, but fairness requires randomization. (Defended by: Some readings of Rawls/Scanlon).
  *   **Leaf B (Taurek-Style):** Numbers are never reasons. "The loss of five is not worse than the loss of one." (Defended by: John Taurek).
  *   **Leaf C (Permissive Aggregation):** You may save the many, but are not wrong to save the one. (Defended by: Michael Otsuka).
  *   **Leaf D (Weighted Aggregation):** Numbers count, but severity trumps quantity. (Defended by: Prioritarians).
  *   **Leaf E (Moderate Aggregation):** Numbers count, but not for trivial harms against vital interests. (Defended by: Alex Voorhoeve).
  *   **Leaf F (Threshold View):** Numbers count only past a ratio. (**Status: Unstable**).
  *   **Leaf G (Structural Constraints):** Aggregation depends on how harm is imposed. (Defended by: Quinn, Doctrine of Double Effect).
  *   **Leaf H (Strict Utilitarian):** Maximize total welfare; structure and thresholds are irrelevant. (Defended by: Classic Utilitarianism).

  ### Instructor Notes: Collisions & Instabilities

  **1. The Threshold View (Leaf F): Incoherent or Unattractive?**
  The combination is not logically *incoherent* (one can consistently assert a rule: "Count only if $N > 10$"). However, it is **theoretically unstable**.
  *   **Why?** It lacks a *principled* cutoff. If 100 lives outweigh 1 because of total welfare, 99 must also outweigh 1 (Sorites Paradox). If 100 outweighs 1 because of "social pressure" or "statistical significance," it ceases to be a moral claim about the individuals.
  *   **Verdict:** It is usually a placeholder for a view that cannot decide between **Leaf B** (Numbers never count) and **Leaf H** (Numbers always count). It collapses under pressure to justify *why* the threshold exists.

  **2. The Collision: No-Numbers vs. Equal-Chances (Leaf B vs. Leaf A)**
  This tree cannot fully separate **Leaf B** and **Leaf A** in the Base Case (Case 1).
  *   **The Collision:** Both views deny that the number 5 creates a *duty* to save the five. Both often recommend flipping a coin in practice.
  *   **The Distinction:** The difference is justificatory, not actionable. **Leaf A** says you must flip to show equal *respect*. **Leaf B** says you may flip (or pick) because there is no fact of the matter about who is more important.
  *   **Handout Note:** If you land on Leaf B but feel compelled to flip a coin, you are likely holding Leaf A. The tree separates them only at **Q2**, but in emergency rescue, the actions often converge.

  **3. The Side-Effect Gap (Node 7)**
  Note that **Leaf H** (Strict Utilitarian) treats Case 1 (Rescue) and Case 5 (Trolley Side-Effect) identically. Most other leaves (D, E, G) treat them differently. If you answered "YES" to Q1 but "NO" to Q7, you hold a **Non-Consequentialist Aggregative** view (e.g., Kamm's Principles). This is a crowded logical space.
