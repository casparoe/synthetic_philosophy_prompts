          *   Required Leaves: Taurek-style (no numbers), May-but-need-not (permissive), Strict-requirement (aggregative), Equal-chances, Threshold view (numbers count only past a ratio).
          *   Analysis of the Threshold View: Is it incoherent or merely unattractive/empty?
          *   Closing Note: Flag pairs of leaves the tree cannot separate (specifically No-Numbers vs. Equal-Chances).

  2.  **Deconstruct the Logical Space (The Axes):**
