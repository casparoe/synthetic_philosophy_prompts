      *   *Node 4 (Intra-personal Aggregation):* One person gets 5 small benefits vs. 5 people get 1 small benefit each. Same total utility. Does distribution matter?
      *   *Node 5 (Side Effects):* Saving 5 requires driving a trolley that kills 1 as a side effect (not means). Do numbers count the same way?
      *   *Node 6 (Tie-Breaking/Procedure):* If you *may* save the 5 but aren't *required* to, can you just pick the 5 without randomizing?
      *   *Node 7 (Thresholds):* Is there a point where 100 vs 1 counts, but 2 vs 1 doesn't?
      *   *Node 8 (Obligation Strength):* If numbers count, is it a duty or an option?

