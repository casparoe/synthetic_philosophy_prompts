answer: |-
  **The Procedure**

  **Step 1: Identify the Language Game (5 mins)**
  Ask: "Who held this object, and what specific action did it enable between people?" Look for evidence of information exchange (orders, news, data) between independent parties.
  *Judgement Flag:* Distinguish between 'designed for communication' and 'actually used for communication'. If the object was primarily a prop, toy, or solitary tool, note this.
  *Stop Point:* If no human exchange occurred (e.g., a sensor logging data no one read), reject immediately.

  **Step 2: Check Family Resemblance (5 mins)**
  Select three 'anchor' objects already in the collection (e.g., telegraph, radio, punch card). Does the candidate share at least two operational traits (encoding, transmission, decoding) with two anchors? It need not match all traits, only overlapping ones.
  *Judgement Flag:* If resemblance relies solely on aesthetics (looks like a radio) rather than function, stop.
  *Stop Point:* If it shares fewer than two traits with the anchors, reject.

  **Step 3: The Exclusion Stop (5 mins)**
  Evaluate the 'game' identified in Step 1. If the primary purpose was commercial marketing, solitary play, or artistic expression without functional information transfer, reject. This prevents 'toy creep' where any symbol-bearing object qualifies.
  *Judgement Flag:* If the panel argues 'historical significance' over function, escalate to the Director. This procedure covers function only.
  *Final Decision:* If Steps 1 and 2 pass, and Step 3 does not trigger, accept. If Step 3 triggers, reject.

  **The Three Worked Cases**

  **1. 1920s Player-Piano Roll**
  *Step 1:* The game is musical instruction or industrial control. Information flows from the punched holes to the machine mechanism. There is exchange between the programmer and the operator.
  *Step 2:* Anchors: Punch cards (encoding via holes), Telegraph (remote instruction). It shares 'encoding' with cards and 'instruction' with telegraphs.
  *Step 3:* The game is functional performance or manufacturing, not play.
  *Verdict:* **Accept.** The debate over music vs. data dissolves; both are information encoding games resembling our punch cards.

  **2. Naval Semaphore Flags (1950s, Unused)**
  *Step 1:* The game is naval signaling. Although this specific set was never waved, the 'form of life' (naval communication) existed. The object is a valid token of that game.
  *Step 2:* Anchors: Visual telegraph, Signal lamp. Shares 'encoding' (flag positions) and 'transmission' (visual line of sight).
  *Step 3:* The purpose was genuine military communication, not marketing.
  *Verdict:* **Accept.** While Wittgenstein emphasizes use, the object's identity is tied to the naval language game it was built to serve, even if this specific set remained in storage.

  **3. Toy Decoder Ring (1980s Cereal)**
  *Step 1:* The game is cereal promotion and children's play. Information exchanged is trivial secrets or marketing codes.
  *Step 2:* Anchors: Cipher wheels. Shares 'encoding' trait. However, it lacks 'transmission' infrastructure; it is a solitary toy.
  *Step 3:* **Triggered.** The primary purpose was marketing engagement and play, not genuine communication infrastructure. It simulates a comms device without the 'life'.
  *Verdict:* **Reject.** Engineers may argue "it ciphers!", but the procedure flags the 'marketing game' as exclusionary. It resembles a tool but functions as a toy.

  **What the Procedure Can't Do**

  This checklist fails when 'use' is undocumented. If we find a weird box with no logs, Step 1 stalls because we cannot identify the language game. It also struggles with dual-use items, such as radios used for music versus news; the object remains the same while the 'game' shifts. Wittgenstein warned against rigid rules; this procedure risks becoming the essential definition it sought to avoid. It will misclassify artistic uses of tech, like a telegraph used solely for poetry, because Step 3 excludes non-functional transfer. Furthermore, it biases towards 'serious' infrastructure, potentially excluding social communication tools used by marginalized groups that don't look like 'tech'. For items where historical significance outweighs functional definition, you need a curatorial framework, not a philosophical one. This tool defines function, not value.

  **A One-Paragraph Bottom Line**

  This is usable, but only if you respect the 'Stop Rule'. It converts philosophical vagueness into administrative hurdles, shifting arguments from 'what is it?' to 'what game was it playing?'. That is a productive shift for engineers. It won't stop arguments entirely, but it structures them. It disguises value judgements as procedural checks, but that is how committees function without fighting. Use it to kill time and focus debate, not to find absolute truth. It is a tool for consensus, not classification.
