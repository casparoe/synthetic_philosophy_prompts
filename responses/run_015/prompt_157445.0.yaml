answer: |-
  ### Conceptual Specification: Desiderata for a Theory of Diachronic Authority in Advance Directives

  To function as an adequate normative framework for advance directives (ADs) in cases of progressive neurological decline, a theory must satisfy the following six desiderata. These are structured as necessary conditions for conceptual coherence and clinical applicability, distinguishing between structural requirements (non-negotiable) and substantive commitments (often camp-specific preferences).

  #### 1. The Continuum Condition (Capacity Transition)
  *   **Requirement:** The theory must account for decision-making capacity as a gradient rather than a binary switch, providing normative guidance for the transition zone where capacity is fluctuating or partially degraded.
  *   **Motivating Pressure:** Clinical reality rarely presents a clean moment where a patient moves from "competent" to "incompetent." Intermittent lucidity and gradual cognitive erosion create a zone where the patient can express preferences but lacks full executive consistency. A binary theory creates a "cliff-edge" problem where authority vanishes instantly, leading to arbitrary cutoffs.
  *   **Adequacy vs. Preference:** It is a preference to say capacity *should* be binary for legal simplicity. It is an adequacy condition that the theory must explain *when* authority transfers if capacity is gradual.
  *   **Status:** **Non-negotiable.** A theory that cannot locate the transfer of authority in a gradual decline is clinically inapplicable.

  #### 2. The Distinction Condition (Autonomy vs. Welfare)
  *   **Requirement:** The theory must maintain a conceptual distinction between the normative force of *precedent autonomy* (the right to control one's future) and *current welfare* (the obligation to prevent present suffering), without reducing one to the other.
  *   **Motivating Pressure:** Reductionism collapses the ethical problem. If autonomy is defined *as* welfare (e.g., "following the AD is always in their best interest"), the conflict disappears artificially. If welfare is ignored entirely, the theory becomes deontological to the point of absurdity. The tension between these two sources of value is the core philosophical problem; dissolving it denies the phenomenon.
  *   **Adequacy vs. Preference:** It is a camp preference to prioritize autonomy *over* welfare. It is an adequacy condition to acknowledge them as *distinct* normative sources that can conflict.
  *   **Status:** **Non-negotiable.** Collapsing the distinction renders the theory descriptive rather than normative.

  #### 3. The Reversal Condition (Intermediate Lucidity)
  *   **Requirement:** The theory must provide a specific account for the "happy dementia" case: where the later self expresses stable, contented preferences that systematically contradict the earlier self's directive (e.g., the patient now desires the care they previously refused).
  *   **Motivating Pressure:** This is the strongest counter-example to strict precedent authority. If the current self is not suffering and expresses a stable will, ignoring them treats the patient as a mere vessel for the past self's ideology. However, validating them renders the AD meaningless. The theory must explain the normative weight of a *reversed* value system, not just a lost one.
  *   **Adequacy vs. Preference:** It is a preference to say the current self *should* win. It is an adequacy condition that the theory must explicitly address the *conflict* of values, not merely the loss of capacity.
  *   **Status:** **Non-negotiable.** Any theory that ignores the phenomenological reality of value reversal fails to address the central ethical tension of dementia care.

  #### 4. The Harm Limitation Condition (Clinical Duties)
  *   **Requirement:** The theory must incorporate an external constraint preventing the enactment of directives that mandate or result in gratuitous suffering or violate fundamental clinical duties of non-maleficence.
  *   **Motivating Pressure:** Clinicians are moral agents, not mere instruments. A directive cannot normatively bind a clinician to perform an act that constitutes professional malpractice or torture (e.g., refusing palliative care for a treatable pain condition). Authority has limits where it inflicts harm on the moral integrity of the caregiver or the basic bodily integrity of the patient.
  *   **Adequacy vs. Preference:** It is a preference to set the threshold of "harm" high or low. It is an adequacy condition that *some* threshold exists where authority is voided by harm.
  *   **Status:** **Non-negotiable.** Without this, the theory licenses moral injury to clinicians and potential abuse of patients.

  #### 5. The Specificity-Continuity Condition
  *   **Requirement:** The theory must explain how specific instructions (e.g., "no artificial nutrition") retain authority across significant psychological change without requiring strong metaphysical personal identity (psychological continuity) between the earlier and later self.
  *   **Motivating Pressure:** If authority depends on the later self being the "same person" as the earlier self (in a Lockean psychological sense), ADs lose authority in severe dementia because the psychological connection is severed. Yet, the law and ethics treat the directive as binding. The theory must bridge the metaphysical gap normatively, not metaphysically.
  *   **Adequacy vs. Preference:** It is a preference to ground authority in "critical interests" vs. "bodily continuity." It is an adequacy condition that the theory must justify binding a psychologically discontinuous entity.
  *   **Status:** **Non-negotiable.** If the theory requires strong psychological continuity, it fails to protect the AD in the exact cases (severe decline) where it is needed.

  #### 6. The Adjudication Mechanism (Weighing Conflicts)
  *   **Requirement:** The theory must provide a principled mechanism for weighing the authority of the pre-illness self against the interests/expressions of the intermediate self when they conflict, rather than asserting a lexical priority by fiat.
  *   **Motivating Pressure:** Conflicts are inevitable. A theory that simply states "The Past Self Wins" or "The Present Self Wins" is not a theory of *weighing*; it is a dogma. An adequate theory must offer variables (e.g., severity of burden, degree of capacity loss, specificity of prior instruction) that allow for calibrated decision-making.
  *   **Adequacy vs. Preference:** It is a preference to weigh welfare heavier than autonomy. It is an adequacy condition that there *is* a weighing procedure, not a trump card.
  *   **Status:** **Non-negotiable.** Without a mechanism, the theory offers no guidance in hard cases, only in easy ones.

  ---

  ### Joint Unsatisfiability and Tensions

  **The Primary Tension: Desideratum (3) vs. Desideratum (5)**
  There is a strong case that **The Reversal Condition (3)** and **The Specificity-Continuity Condition (5)** are jointly unsatisfiable in their strongest forms.
  *   **The Conflict:** To satisfy (5), one must argue that the specific content of the directive binds the later self *despite* psychological change. This implies the earlier self's authority survives the death of the values that created it. To satisfy (3), one must acknowledge that the later self's stable, reversed values have normative weight. If the later self's reversed values are granted significant weight, the *specificity* of the earlier directive is necessarily diluted.
  *   **Implication:** You cannot have a theory that strictly enforces specific directives against a happy, reversed-value later self without treating the later self as a normative nullity. Conversely, you cannot fully respect the later self's reversed values without rendering the specific directive advisory rather than binding. A theory must choose where to break the link: either the directive's specificity yields to current state, or the current state's values yield to the directive's specificity.

  **The Exclusionary Desideratum**
  The single desideratum that does the most to exclude the standard binary positions (Strict Precedent-Autonomy vs. Pure Best-Interests) is **Desideratum (6): The Adjudication Mechanism.**

  *   **Reasoning:**
      *   **Strict Precedent-Autonomy** fails (6) because it operates on lexical priority (Past > Present), not weighing. It treats the conflict as resolved by definition, not by mechanism.
      *   **Pure Best-Interests** fails (6) because it dissolves the conflict by collapsing authority into welfare (Present Welfare > Past Wish). It also refuses to weigh the *authority* of the past, treating it only as evidence of welfare.
      *   **Why (6) excludes them:** By demanding a *mechanism for weighing* conflicting authorities, (6) necessitates that both the Past Self and the Intermediate Self possess *some* defeasible authority. If either had absolute authority, no weighing mechanism would be required. Therefore, any theory satisfying (6) is necessarily a hybrid view, structurally excluding the pure binaries.

  ---

  ### Scoring Generic Approaches

  #### (a) Strict Precedent-Autonomy View
  *   **Performance:** Fails (1), (3), (4), (6). Passes (2), (5).
  *   **Analysis:** This view maintains the distinction between autonomy and welfare (2) and upholds specificity across psychological change (5). However, it treats capacity as a binary switch (failing 1), ignores the normative weight of the happy dementia patient (failing 3), and risks mandating suffering if the directive is rigid (failing 4). Crucially, it lacks an adjudication mechanism (6), relying instead on a lexical rule that the past always trumps the present.
  *   **Verdict:** Conceptually rigid; clinically dangerous in edge cases.

  #### (b) Current-Welfare View (Best Interests)
  *   **Performance:** Fails (2), (5), (6). Passes (1), (3), (4).
  *   **Analysis:** This view handles gradual capacity loss well (1), respects the intermediate state's values (3), and prioritizes the avoidance of suffering (4). However, it collapses autonomy into welfare (failing 2), rendering the AD merely evidentiary. It cannot explain why a specific directive should bind if welfare suggests otherwise (failing 5). It lacks a weighing mechanism (6) because it does not recognize the past self as having independent authority to weigh.
  *   **Verdict:** Clinically safe but normatively hollow; undermines the concept of a *directive*.

  #### (c) Diachronic-Negotiation View (Integrated Authority)
  *   **Performance:** Passes (1), (2), (3), (4), (6). Struggles with (5).
  *   **Analysis:** This approach attempts to view the person as a temporally extended entity where authority is shared. It handles gradients (1), keeps autonomy/welfare distinct (2), acknowledges value reversal (3), respects harm limits (4), and provides a weighing mechanism (6). Its weakness lies in (5): it often struggles to justify why *specific* instructions (rather than general values) retain binding force across radical personality change without slipping back into precedent autonomy or welfare maximization. It risks vagueness in the "weighing" procedure.
  *   **Verdict:** The only approach capable of satisfying the non-negotiable desiderata, provided it can specify the weighing mechanism without becoming arbitrary. It is the only viable candidate for a coherent theory of diachronic authority.
