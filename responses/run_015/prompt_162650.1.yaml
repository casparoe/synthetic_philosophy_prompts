answer: |-
  This is an exceptionally clear formulation of a problem that occupies a significant chunk of contemporary metaphysics and meta-ethics. You have correctly identified that the "tidy version" of the distinction (Factual vs. Verbal) breaks down under pressure, particularly in Case 2.

  Here is a map of the conceptual space, an analysis of your cases, and an evaluation of your colleague's test, with explicit markers regarding what is philosophical consensus versus live controversy.

  ### 1. The Conceptual Space

  You asked about three categories: semantic disagreement, disagreement about meaning, and factual disagreement. In contemporary philosophy, the terrain looks like this:

  **A. Factual Disagreement (The World)**
  Both parties agree on the meaning of the terms and the rules of logic, but disagree on the state of reality.
  *   *Example:* "The server is at 90% CPU" vs. "No, it is at 50%."
  *   *Status:* **Settled.** Everyone agrees this category exists.

  **B. Purely Verbal Disagreement (The Dictionary)**
  Parties agree on the state of the world but use words differently. Once definitions are aligned, the disagreement vanishes *and* there are no remaining practical consequences.
  *   *Example:* Your Case 1 (Outage duration).
  *   *Status:* **Settled.** Everyone agrees this category exists, though some argue it is rarer than it looks.

  **C. Metalinguistic Negotiation (The Concept)**
  This is the crucial missing piece in the "tidy" map. Parties disagree about *which concept to use* to carve up the world. They agree on the non-linguistic facts (hardware history, logs), but they disagree about which classification best serves their shared goals (reliability, accountability, cognitive load).
  *   *Term:* **Metalinguistic Negotiation** (coined/developed by David Plunkett and Tim Sundell).
  *   *Status:* **Live Consensus.** This is the dominant contemporary account for cases like your Case 2. It is widely accepted that many disputes that *look* verbal are actually substantive negotiations about how to structure our conceptual scheme.

  **Regarding "Quantifier Variance":**
  You asked if you are abusing this term. **Yes, you should probably discard it for this context.**
  *   *What it is:* A thesis (associated with Eli Hirsch) about ontology. It suggests that disputes about "what exists" (e.g., "Does a table exist, or just atoms arranged table-wise?") are merely verbal because different conceptual schemes quantify over objects differently.
  *   *Why it doesn't fit:* Your cases are not about *existence* (ontology); they are about *classification* and *identity* relative to function. Using "quantifier variance" here would signal to philosophers that you are asking about metaphysical existence rather than conceptual engineering. Stick with **Metalinguistic Negotiation**.

  ### 2. Analyzing Your Three Cases

  Here is where your cases fall on the map, and why Case 2 is not a contradiction.

  **Case 1: The Outage (Purely Verbal)**
  *   **Diagnosis:** This is a classic verbal dispute.
  *   **Why:** Once the definitions ("full unavailability" vs. "SLO breach") were made explicit, the disagreement vanished *and* there were no residual stakes. Both parties accepted the other's definition as valid for their own context.
  *   **Verdict:** Settled. This is the paradigm case of a verbal dispute.

  **Case 2: The Service Identity (Metalinguistic Negotiation)**
  *   **Diagnosis:** This is **not** a purely verbal dispute, though it looks like one. It is a substantive disagreement about *conceptual boundaries*.
  *   **Why it matters:** You noted the disagreement tracks whether to port runbooks or treat regressions as recurrences. This means the word "same service" is acting as a proxy for a policy decision.
  *   **Is it a contradiction?** No. It shows that "verbal" is often used as a slur to mean "trivial." In Case 2, the dispute is about *words*, but it is not *trivial*. It is a negotiation over which conceptual scheme yields better engineering outcomes.
  *   **Philosophical Term:** This is a dispute about **Conceptual Engineering**. You are deciding how to engineer the concept "Service" to maximize utility.
  *   **Verdict:** **Live Consensus.** Most contemporary philosophers agree that disputes about identity conditions (is this the *same* ship/service/person?) are often substantive negotiations about values and goals, not just dictionary definitions.

  **Case 3: The Staging Environment (Hybrid/Functional)**
  *   **Diagnosis:** This is a factual disagreement masked as a semantic one, or vice versa.
  *   **Why:** You stated the answer depends on "facts about how the cluster is actually used." This suggests there is a functional definition of "staging" (e.g., "an environment that catches X% of production bugs").
  *   **Analysis:** If you can measure the catch-rate, the dispute becomes factual ("Does this cluster catch 90% of bugs?"). If you cannot measure it, it reverts to Metalinguistic Negotiation ("How much catch-rate *should* be required to earn the label 'staging'?").
  *   **Verdict:** **Settled.** This is a standard "open texture" of language problem. Terms often have a core meaning and a fuzzy boundary that requires contextual resolution.

  ### 3. Evaluating the Colleague's Test

  **The Test:** *A dispute is verbal just in case there is no decision, prediction, or action... on which the two readings come apart.*

  **Analysis:**
  This is a **Pragmatic Test**. It closely resembles the Pragmatic Maxim (Peirce/James) and Carnap's Principle of Tolerance.

  1.  **Is it a real alternative?** It is not an alternative to the standard views; it is a formalization of the **Pragmatist** view of meaning. It collapses the distinction between "meaning" and "use."
  2.  **Does it collapse?** It risks collapsing into "Disagreements are verbal until we find a stake." This is actually a feature, not a bug. It acknowledges that we often don't know if a dispute is substantive until we try to act on it.
  3.  **Relativity to Stakes:** You asked if making verbalness relative to stakes is a defect.
      *   **Consensus:** **It is the correct result.** There is no "God's eye view" of whether a dispute is verbal. It depends on the context of inquiry.
      *   *Example:* In a court of law, the definition of "nighttime" might be verbal (statutory definition). In a biology lab, it might be factual (light levels). The dispute's nature depends on the stakes.
  4.  **Choice of Stakes:** You asked about the non-arbitrary choice of stakes (all decisions vs. nearby vs. actual).
      *   **Controversy:** This is **highly controversial**.
          *   *Strict Pragmatists:* Only actual decisions matter.
          *   *Modal Pragmatists:* Possible/nearby decisions matter (to prevent "lazy" verbal dismissals).
          *   *Recommendation for Work:** Use "all decisions the parties could reasonably face in the next planning cycle." This prevents someone from saying "it's verbal" now, only to say "actually it matters" later when policy changes.

  ### 4. The Nature of "Verbal"

  You asked whether "verbal" is a property of the dispute, the context, or a speech act.

  **Option A: Property of the Dispute (Objective)**
  *   *View:* The dispute *is* verbal, regardless of who is looking.
  *   *Prediction for Case 2:* It must be either verbal or factual. Since it matters, it must be factual.
  *   *Problem:* Fails to explain why resolving the definition resolves the tension without new data.

  **Option B: Property of Dispute + Context (Relational)**
  *   *View:* A dispute is verbal *relative to a set of stakes*.
  *   *Prediction for Case 2:* It is verbal relative to "hardware inventory" but substantive relative to "on-call policy."
  *   *Status:* **Leading Contemporary View.** This aligns with contextualism in semantics.

  **Option C: A Speech Act (Dismissal)**
  *   *View:* Saying "that's just verbal" is not describing the dispute; it is *doing* something. It is an attempt to **dissolve** the obligation to argue. It signals: "I do not think this is worth our time."
  *   *Prediction for Case 2:* When someone calls Case 2 "verbal," they are trying to shut down the runbook debate. When someone insists it is "real," they are insisting the runbook debate is vital.
  *   *Status:* **Wittgensteinian/Austinian View.** Gaining traction, but less formalized than Option B.

  **How to tell them apart (The Test Case):**
  Imagine Case 2, but the CTO steps in and says: "I don't care what you call it. Just pick a definition and write the runbook."
  *   If **Option A** is true, the CTO is ignoring reality (the dispute *is* factual).
  *   If **Option B** is true, the CTO is changing the context (removing the stakes).
  *   If **Option C** is true, the CTO is exercising authority to stop the speech act of negotiation.
  *   *Practical Takeaway:* Option C is the most useful for management. Calling something "verbal" is often a power move to close a ticket.

  ### 5. Settled vs. Controversial (Crucial for Work Use)

  You asked for explicit boundaries on what is reliable knowledge versus ongoing debate.

  **Settled / Reliable Consensus:**
  1.  **The Binary is Dead:** The simple distinction "Factual vs. Verbal" is insufficient for complex systems. You can rely on the fact that philosophers agree the tidy map is wrong.
  2.  **Metalinguistic Negotiation Exists:** Disagreements about concepts (Case 2) are substantive even if they look linguistic. You can rely on the term "Metalinguistic Negotiation" being recognized by experts.
  3.  **Pragmatics Matter:** Meaning is tied to use/stakes. A definition that has no practical consequence is functionally verbal.

  **Live Controversy / Do Not Rely On:**
  1.  **The "Fact of the Matter":** There is no consensus on whether Case 2 has a *true* answer independent of our goals. Some realists say "Yes, there is a fact about service identity." Most pragmatists say "No, identity is a tool we build." **Do not assert one side as objective truth in a design doc.**
  2.  **The Boundary of Stakes:** There is no agreed-upon rule for how "far away" a consequence must be to count as substantive. **Do not claim your colleague's test is objectively rigorous; frame it as a heuristic.**
  3.  **Quantifier Variance:** As noted, do not use this term. It implies a specific metaphysical commitment that is heavily debated and likely irrelevant to your engineering context.

  **Smuggled Assumptions in Your Framing:**
  You wrote: *"Is that a contradiction, or does it show that 'verbal' is the wrong word for what is going on?"*
  *   **Correction:** This assumes "verbal" implies "trivial." This is the smuggled assumption. In philosophy, a dispute can be verbal (about language/concepts) and *still* be deeply important (e.g., legal definitions of "personhood").
  *   **Advice:** At work, stop using the word "verbal" to mean "trivial." Use **"Definition"** vs. **"Implementation"** vs. **"Policy."**
      *   Case 1 is a **Definition** issue.
      *   Case 2 is a **Policy** issue (disguised as identity).
      *   Case 3 is an **Implementation** issue (disguised as definition).

  ### Summary Recommendation for Your Team

  1.  **Adopt the "Downstream-Invariance Test" with a caveat.** Use your colleague's test, but explicitly define the "stakes" (e.g., "decisions in the next quarter"). This makes the test robust against future context shifts.
  2.  **Reframe Case 2.** Do not call it a verbal dispute. Call it a **Conceptual Boundary Decision**. Acknowledge that the facts are agreed upon, but the *classification* requires a value judgment about risk and maintenance.
  3.  **Watch for the Speech Act.** When an engineer says "This is just a verbal dispute," listen for "I want to close this ticket." Verify if the stakes are actually zero before agreeing.

  You are operating in the territory of **Conceptual Engineering**, a vibrant field that treats concepts like software interfaces: they can be refactored, deprecated, or versioned based on their utility, not just their "truth."
