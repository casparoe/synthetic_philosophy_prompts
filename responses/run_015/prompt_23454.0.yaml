answer: |-
  **The Unpopular Truth About Promises**

  My editor was right to demand a side. In philosophy, as in journalism, neutrality can be a form of cowardice. When we ask why a promise binds, we are asking about the glue of human cooperation. Is it a magical act of will, a social convention, or something more mundane? The dominant view in the literature, the Will Theory, suggests that when I promise, I exercise a normative power akin to a legislator, creating a duty where none existed before. It is a seductive idea. It grants human agency a kind of divine authority. But it is also, I suspect, a confusion.

  The least popular account in the literature—the derivative or harm-based view—is the one that best survives contact with reality. On this view, there is no distinctive moral wrong of "breaking a promise" in the abstract. The wrong is entirely derivative from the harm, disappointment, or reliance costs inflicted on the promisee. If you break a promise and no one is worse off, you have not committed a moral wrong. This sounds cold. It sounds like it strips the sanctity from our word. But the alternative is to build our moral theory on a mirage.

  **The Coercion Confusion**

  To see why the Will Theory fails, we must look closely at what its defenders claim binds us. They argue that the act of promising itself transfers a right to the promisee. I authorize you to demand performance. If I break the promise, I violate your will, regardless of whether you suffer.

  But consider where the *force* of this obligation comes from. The Will Theorist insists it is free-standing, independent of consequences. Yet, when pressed on why violating this "right" matters, the explanation inevitably drifts toward the negative impact on the promisee. Why is violating someone's will wrong? Usually, because it thwarts their agency, frustrates their plans, or treats them as a mere means. These are all harm-adjacent concepts.

  I suspect the Will Theorist is smuggling in the logic of coercion. In a coercive threat, I alter your normative landscape by my will: "Do X, or I will harm you." The binding force of the threat lies entirely in the harmful consequence I have pledged to bring about. The Will Theorist wants the promise to work like the threat—a speech act that changes the moral weather by fiat—but without the weather actually changing. They want the authority of the threat without the harm.

  This is why the Will Theory feels so robust in ordinary cases. In ordinary cases, breaking a promise *does* cause harm. It disappoints. It disrupts plans. The Will Theorist looks at this standard package and claims the binding element is the "act of will," but they are mistaking the wrapper for the gift. The felt authority of a promise is really the felt authority of a potential threat in disguise: "I have led you to expect X, and if I don't deliver, I damage your agency." Strip away the damage, strip away the reliance, and the "authority" of the will evaporates. What remains is just noise.

  **The Empty Lecture Hall**

  Consider the case that keeps Will Theorists awake at night. I promise a colleague to attend her lecture. She is nervous; she wants a friendly face. Later, secretly, the lecture is cancelled due to low enrollment. She tells no one. I know this, yet I choose not to show up at the scheduled time. I break the promise.

  On the Will Theory, I have wronged her. I violated the right I assigned her. I treated her will as a mere means. On the derivative account, I have done nothing morally wrong. No one was harmed. No one relied. Her expectation was already extinguished by the cancellation; my absence added no injury to her interests.

  The intuition that I "still did something wrong" is powerful, but it is misleading. It conflates morality with etiquette, or perhaps with self-image. We like to think of ourselves as people who keep their word. To break a promise, even a harmless one, feels like a stain on our integrity. But integrity is a virtue of character, not necessarily a metric of moral obligation toward others. If I wear a black tie to a party where the host secretly decided ties were optional, I may feel foolish for adhering to the dress code I promised to follow, but I haven't wronged the host.

  In the lecture case, the "wrong" is a social faux pas, a violation of the script. It signals a lack of reliability that *might* cause harm in future interactions. But in the isolated moral mathematics of this specific instance, there is no victim. The Will Theorist insists there is a victim: the abstract "right" of the promisee. But a right without an interest to protect is a sword without a blade. Morality is about how we treat each other, not about worshipping the metaphysical machinery of our own speech acts. If my colleague's interests were untouched, my obligation was dissolved.

  **The Solitary Smoker**

  The derivative account faces a sterner test with promises to oneself. If I promise to quit smoking, and I smoke, have I wronged myself? The Will Theory has an easy time here: I bound my future self, and my future self rebelled. It is a civil war of the will.

  The derivative view seems to have no room for this. If the wrong of breaking a promise is derivative of harm to a promisee, who is the promisee here? Me? And who is the promisor? Also me. If I harm myself by smoking, that is a prudential failure, a health risk. But is it a *moral* wrong?

  On the derivative view, it is not. And this is a feature, not a bug. We dilute the concept of morality if we allow it to cover every instance of irrationality or weakness of will. When I break a promise to myself, I am not violating a moral duty; I am failing in prudence. I am acting against my own long-term interests. The "binding" force here is not moral obligation but rational consistency.

  This distinction matters. If we classify every broken resolution as a moral failing, we turn morality into a tyrannical internal police force. The derivative account preserves the social nature of morality. Promises are tools for coordinating behavior between distinct agents who cannot read each other's minds. When there is only one agent, the tool is unnecessary. I do not need to promise myself to quit smoking; I simply need to decide. The "promise" is a psychological crutch, a rhetorical device to bolster resolve. Breaking it is a failure of self-governance, but it is not a sin.

  **The Vulnerability**

  So, where does this leave us? The derivative account is cleaner, more grounded, and avoids the metaphysical magic of the Will Theory. But it comes with a cost, and I must be candid about it.

  The derivative account's greatest vulnerability is that it makes promising feel too transactional. It suggests that the moral weight of "I promise" is contingent on the outcome. If I promise to meet you for coffee, and you happen to die of a heart attack before I arrive, the derivative view says I am free to stay home. I have not harmed you. Yet, many feel that I still owe it to your memory, or to the sanctity of the word itself, to show up.

  By reducing the obligation to harm and reliance, we risk losing the distinctive "glue" that makes promises unique from mere predictions or statements of intent. If a promise is only as strong as the reliance it generates, then the words "I promise" add no moral weight beyond "I intend." They become merely evidence of likely harm if broken.

  This is the price of the derivative view: it demystifies the promise. It tells us that our word is not a magical bond, but a safeguard against harm. It is less romantic than the Will Theory. But it is more honest. We keep promises not because we are wielding normative swords, but because we care about the people who are waiting for us. And if no one is waiting, the sword has nothing to cut.
