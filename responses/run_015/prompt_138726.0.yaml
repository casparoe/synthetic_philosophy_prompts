answer: |-
  # The Representation Validation Protocol (RVP-v1)

  **Purpose:** To determine whether an internal activation pattern $v$ in model $M$ warrants the claim "$M$ represents $X$."
  **Constraints:** Must be executable by ML engineers in <2 hours per claim. Must handle basis degeneracy, elicitation bias, and distribution shift.
  **Philosophical Stance:** *Causal-Structural Realism.* A representation exists if it is a stable structural component that plays a specific causal role in generating behavior, invariant to arbitrary basis changes.

  ---

  ## Part 1: The Decision Procedure

  Execute these questions in order. If any step fails, stop and record the failure mode.

  ### Q1: Basis Invariance (The Degeneracy Check)
  **Question:** Does the feature corresponding to $X$ appear in multiple independent decompositions of the same residual stream?
  **Test:** Compare the feature vector $v$ against at least one other Sparse Autoencoder (SAE) run on the same layer with a different random seed or sparsity coefficient.
  **Sufficient Answer:**
  *   **YES:** A feature with cosine similarity $>0.8$ to $v$ exists in the alternate SAE and activates on the same inputs.
  *   **NO / DATA UNAVAILABLE:** If you only have one SAE run, you **cannot** claim representation. You must run a second SAE (even a smaller one) or downgrade the claim to "activation pattern."
  *   **Action:** If NO $\rightarrow$ **STOP. Do not say "represents."** (Failure Mode: Dictionary Artifact).

  ### Q2: Causal Specificity (The Elicitation Check)
  **Question:** Does intervening on $v$ change $X$ without changing unrelated concepts $Y$ and $Z$?
  **Test:**
  1.  **Steering:** Add $\alpha v$ to the residual stream. Does output shift toward $X$?
  2.  **Scrubbing:** Zero out $v$ (or project it out). Does performance on $X$-tasks drop while $Y$-tasks remain stable?
  3.  **Control:** Check activation on a dataset where $X$ is false but semantically similar (e.g., if $X$="Golden Retriever", check "Labrador").
  **Sufficient Answer:**
  *   **YES:** Steering moves output toward $X$; Scrubbing impairs $X$; Activation is low on controls.
  *   **NO:** Steering changes general tone/logic (not specific to $X$); or Scrubbing breaks everything (feature is too polysemantic); or Activation is high on controls (feature is actually "Dog" or "Furry", not "Golden Retriever").
  *   **Action:** If NO $\rightarrow$ **STOP. Do not say "represents."** (Failure Mode: Proxy/Heuristic).

  ### Q3: Robustness Under Shift (The OOD Check)
  **Question:** Does the causal role of $v$ hold when the input distribution shifts?
  **Test:** Run Steering/Scrubbing on an adversarial or out-of-distribution (OOD) dataset where $X$ is still present but context is altered (e.g., negation, irony, different language).
  **Sufficient Answer:**
  *   **YES:** The intervention still modulates $X$-related behavior, even if magnitude varies.
  *   **NO:** The intervention stops working or flips sign (e.g., steering for "Agreement" causes "Disagreement" in adversarial context).
  *   **Action:** If NO $\rightarrow$ **STOP. Do not say "represents."** (Failure Mode: Contextual Heuristic).

  ### Q4: The Values Handoff
  **Question:** Does $X$ imply mental states, intent, or normative judgment (e.g., "Deception," "Sycophancy," "Lie")?
  **Test:** Semantic analysis of the label $X$.
  **Sufficient Answer:**
  *   **NO (Descriptive):** $X$ is a semantic concept (e.g., "Dog," "France," "Addition"). $\rightarrow$ **Engineers may sign off.**
  *   **YES (Normative/Mental):** $X$ implies intent or truth-value relative to belief (e.g., "Deception," "Sycophancy"). $\rightarrow$ **HANDOFF TO PHILOSOPHER.**
  *   **Action:** If YES $\rightarrow$ **Engineers must write "Model exhibits behavior consistent with X." Do not write "Model represents X."**

  ---

  ## Part 2: The Technical Test Suite (2-Hour Budget)

  1.  **Basis Check (30 mins):** Load pre-trained alternate SAE weights. Compute cosine similarity of top-activating features on a standard batch. *Pass threshold: 0.8 similarity.*
  2.  **Intervention Sweep (45 mins):** Run steering coefficients $[\alpha = -2.0, 2.0]$ on a 100-sample validation set. Measure log-prob change on target tokens vs. control tokens. *Pass threshold: Significant delta on target, $p<0.05$ no change on control.*
  3.  **Activation Histogram (15 mins):** Plot activation distribution on $X$-positive vs. $X$-negative data. *Pass threshold: Clear separation (AUROC > 0.85).*
  4.  **OOD Stress Test (30 mins):** Run Intervention Sweep on a "hard" dataset (e.g., negated prompts, adversarial examples). *Pass threshold: Directionality preserved.*

  ---

  ## Part 3: Running the Procedure on Your Claims

  ### (a) The "Sycophancy Direction"
  *   **Q1 (Invariance):** **PASS.** Agreement/compliance vectors are often stable across SAE runs in instruction-tuned models.
  *   **Q2 (Specificity):** **PASS.** Steering increases agreement; scrubbing reduces it.
  *   **Q3 (Robustness):** **PASS.** Holds across most conversational contexts.
  *   **Q4 (Values):** **FAIL (HANDOFF).** "Sycophancy" is not a semantic content; it is a *relation* between output and truth/user-desire. The model represents "User Approval" or "Agreement." Whether that counts as sycophancy depends on the truth of the statement, which the model's internal state does not strictly encode.
  *   **Verdict:** **HANDOFF.**
  *   **Engineer Wording:** "Model contains a direction that increases user agreement." (Do not write "Sycophancy Representation").
  *   **Why you won't like this:** You want to patch "sycophancy." This procedure forces you to admit you are patching "compliance," which might degrade helpfulness. It strips the moral charge from the technical fix.

  ### (b) The "Golden Retriever Feature"
  *   **Q1 (Invariance):** **FAIL.** SAE features for specific object categories are notoriously unstable across seeds. One run finds "Golden Retriever," another finds "Dog," another finds "Furry Texture." Unless your engineers have *already* verified this feature exists in a second SAE seed with high similarity, it fails here.
  *   **Q2 (Specificity):** **FAIL.** Likely activates on other similar dogs (Labradors) if the visual features overlap.
  *   **Verdict:** **STOP. DO NOT SAY REPRESENTS.**
  *   **Engineer Wording:** "A feature that activates on images of golden retrievers in this specific decomposition."
  *   **Why this matches your suspicion:** You suspected "No." The degeneracy problem is real. Specific concepts are often human-label projections onto fragile polysemantic features.

  ### (c) The "Deception" Feature (Regulatory Claim)
  *   **Q1 (Invariance):** **PASS.** (Assume for argument's sake they found a robust "Goal-Conflict" vector).
  *   **Q2 (Specificity):** **PASS.** Steering increases false statements when truth is costly.
  *   **Q3 (Robustness):** **PASS.** Holds under OOD pressure.
  *   **Q4 (Values):** **FAIL (HANDOFF).** "Deception" requires *intent to mislead*. The procedure can verify "Falsehood + Reward," but not "Intent."
  *   **Verdict:** **HANDOFF.**
  *   **Engineer Wording:** "Model exhibits instrumental falsehood generation under goal conflict." (Do **not** write "Model represents deception").
  *   **Why you won't like this:** This is the one. For the regulator, "Deception" triggers specific safety protocols. "Instrumental Falsehood" sounds like a bug. This procedure blocks you from making the stronger safety claim without a philosophical sign-off on the nature of intent. It leaves you exposed regulatorily while protecting you philosophically.

  ---

  ## Part 4: Limitations (What This Procedure Cannot Do)

  1.  **It cannot settle Realism vs. Instrumentalism:** This procedure assumes a realist framework *operationally*. It tells you when you are *allowed* to speak like a realist. It does not prove the representations are "real" in a metaphysical sense, only that they are robust enough to treat as such for engineering purposes.
  2.  **It cannot verify Understanding:** A model can robustly represent "Paris is the capital of France" without understanding Paris, France, or capitals. This procedure validates *structure*, not *semantics* or *grounding*.
  3.  **It cannot resolve Thick Ethical Concepts:** As seen in the Deception and Sycophancy cases, the procedure identifies where a claim stops being factual and starts being normative. It forces a handoff rather than solving the moral problem.
  4.  **It is Conservative:** It will produce False Negatives. There may be genuine representations that are basis-dependent or context-sensitive. The procedure prioritizes preventing False Positives (anthropomorphism) over catching every instance.

  ### Final Note for the Professor
  The procedure is designed to be a **shield**, not a sword. It protects the lab from anthropomorphic overclaiming (Deception) and ontological overcommitment (Golden Retriever), but it does so by stripping away the normative language safety teams rely on (Sycophancy/Deception). You will spend your two hours a month adjudicating the Q4 Handoffs, arguing over whether "Instrumental Falsehood" is sufficient for a regulator. That is where the philosophy actually lives.
