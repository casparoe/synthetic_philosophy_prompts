      *(Self-Correction on the "Forbidden Question")*: The user specifically mentioned worrying about "If it's not prediction, why sell it?" I should make sure that's addressed high up, but the *Forbidden Question* should be the one that has no good answer. Maybe: "What specific historical debate does this resolve that narrative history couldn't?"

      *(Refining the "Concession")*: The user needs to concede the hype immediately. It builds trust.
      *(Refining the "Must Land")*: The shift from "forecasting" to "stress-testing narratives."

      *(Refining the "Weakest Joint")*: It's definitely the data. Comparing Rome and China is hard. Comparing France and England is easier but maybe less interesting for the model.

