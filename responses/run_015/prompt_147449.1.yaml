answer: |-
  **The Antipodal Ledger**

  Above the doors of the Hall of Ledgers, the stone was chiselled with the Founding Statute of the Commonwealth of Orenn. *WHEREAS the Ensemble of Admissible Futures contains no mark of preference,* the inscription read, *AND WHEREAS any Method of Forecasting possesses a Complement of equal standing over the Whole Ensemble, the Office shall maintain both in equal ledger.*

  Elara traced the letters with a gloved finger. She was a Junior Auditor, third year, assigned to Review Cycle 214. Her task was specific: evaluate the Antipodal Bench under Clause 7, Complementarity.

  Inside, the Hall smelled of iron gall ink and dry rot. Elara sat at Desk 44 and opened the Master Ledger for the Harvest Sector. The pages were divided into columns. On the left, the Orthodox Methods: *Trend-Extension, Seasonal-Adjustment, Yield-Average.* On the right, their Complements: *Inverse-Trend, Anti-Seasonal, Yield-Inversion.*

  The record was stark. For two hundred and twelve years, the Orthodox column was a solid block of green ink. The Antipodal column was a solid block of red. The Orthodox had predicted the flood of '89; the Antipodes had predicted a drought. The Orthodox had forecast the blight; the Antipodes had projected surplus.

  Elara turned to the Statutory Commentary, bound in leather beside the ledger. *Note:* *Over the Single Actual World, asymmetry is expected. Over the Ensemble of All Admissible Worlds, symmetry is necessary. To prefer the Orthodox is to assume the Actual World is not a random sample from the Ensemble.*

  She dipped her pen. *Observation 1:* The Antipodal Bench has incurred a liability of 40,000 crowns in compensation payments due to erroneous guidance. *Observation 2:* No admissible future has materialized wherein the Antipodal record exceeds the Orthodox record within the current historical window.

  She closed the ledger. The formal result was clear to her; she had passed the Qualifying Exams. Over the space of all possible functions, the error rate of the Orthodox and the Antipodes is identical. A world where the Antipodes win is just as valid as this one. But this was not the space of all possible functions. This was Orenn. And in Orenn, the sun rose, the floods followed the rains, and the Antipodes were wrong.

  Yet the Statute remained. To de-license the Bench was to declare that the Ensemble was not uniform, that *this* world was privileged. It was to solve the problem of induction by fiat.

  Elara took her lantern and descended to the sub-basement where the Antipodal Bench was housed.

  The room was cold. The desks were empty save for one man polishing a brass stamp. This was Pol, the Senior Keeper of the Complements. He did not look up as she approached.

  "Auditor," Pol said. His voice echoed off the stone walls.

  "Master Pol. I am reviewing the Bench for the Board."

  "Then you have seen the red ink."

  "I have."

  "And you wonder why we keep the stamps." Pol finally looked at her. He was old, his hands stained with the same ink that filled the rejection slips.

  "The Statute requires it," Elara said. "But the Statute assumes a uniform measure over admissible futures. It assumes we have no reason to weight continuity higher than chaos."

  Pol set down the stamp. "And do you?"

  "Look at the ledger, Pol. Two centuries. The Orthodox methods track the terrain. Yours track nothing."

  "The ledger records the Past," Pol said softly. "The Statute governs the Future. You look at the green ink and you see a law. I look at it and I see a streak. You want to de-license us because you believe the measure has tilted. You believe the Universe prefers simplicity."

  "I believe the Universe *is* simple," Elara said. "Or at least, stable enough for planning."

  "That is the bias," Pol said. He stood and walked to a shelf of empty binders. "The Statute forbids us from betting on stability. It says: 'Do not weight the futures.' But you cannot run a Commonwealth without weighting. You must act as if the sun will rise. To act is to choose a measure."

  He pulled a binder down. It was blank.

  "If you fire us," Pol continued, "you do not prove the Antipodes wrong. You prove the Office has decided to stop hedging against the chaotic futures. You are not finding truth, Auditor. You are cutting insurance."

  Elara felt the familiar friction in her chest. The students in the seminar would call this the shift from epistemic justification to pragmatic wager. The theorem held: over the whole space, Pol was her equal. But in *this* room, in *this* year, he was a liability. To keep him was to honor the logic of the Ensemble. To fire him was to honor the logic of Orenn.

  "If the world changes," Elara said, "if the measure shifts and chaos returns... the Orthodox methods will fail. You will be right."

  "Then the Office will need us," Pol said. "But you will not license us in time. You will have dismantled the mechanism that handles the disorder because you weighted the order too heavily."

  "We cannot spend 40,000 crowns on insurance against a world that hasn't arrived," Elara said.

  "No," Pol agreed. "You cannot. That is not epistemology. That is accounting."

  Elara returned to Desk 44. The lantern light flickered over the Master Ledger. She opened her recommendation form.

  *Section IV: Epistemic Validity.*
  She paused. She could not write that the Antipodes were invalid. The Statute forbade that judgment. The theorem forbade it. Over the Ensemble, they were valid.

  *Section V: Institutional Viability.*
  Here, the language changed. Here, the Office spoke not of Truth, but of Cost.

  Elara wrote: *The maintenance of the Antipodal Bench requires resources disproportionate to its utility in the current operational environment. While the Complementarity Clause ensures formal equality over the Ensemble of Admissible Futures, the Office must prioritize methods that align with the observed regularities of the Commonwealth to ensure fiscal stability.*

  She stopped. *Align with observed regularities.* It was a polite way of saying: *We are betting on induction.*

  She continued: *Recommendation: De-license Antipodal Bench effective Cycle 215. Grounds: Redundancy and Budgetary Constraint.*

  It was a circular solution. They were redundant only if the world remained orderly. The world remained orderly only if they were not needed to predict chaos. By cutting them, the Office was not solving the problem of induction; it was institutionalizing the bias toward simplicity. They were weighting the measure by closing the ledger.

  Elara signed the form. She did not feel vindicated. She felt like a bookkeeper balancing accounts that could never truly be settled.

  She placed the recommendation in the out-tray. Above her, through the stone ceiling, she could faintly hear the scratching of pens in the main Hall. The Orthodox clerks were forecasting next year's harvest. They were writing green ink. They were assuming the future would look like the past.

  Elara extinguished her lantern. The Statute above the door remained true, even in the dark. Over all possible worlds, Pol was right. But in this one, she had to pay the bills. She walked out into the cool air of the commonwealth, leaving the Antipodes to their empty binders, knowing she had not answered the doubt, but had simply priced it out of the market.
