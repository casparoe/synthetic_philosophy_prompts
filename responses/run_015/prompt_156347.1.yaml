          2.  *Insistence on Privileged Identifications:* Mathematicians treat $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R} \subset \mathbb{C}$ as literal inclusions, distinguish $V$ from $V^*$ but identify $V$ with $V^{**}$, distinguish $\mathbb{R}$ from $\mathbb{R}^2$ despite bijections. Suggests identity is finer than isomorphism (objecthood matters).
