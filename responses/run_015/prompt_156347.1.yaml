answer: |-
  This is an exceptionally sharp diagnosis of the current impasse. You have correctly identified that the standard metaphysical quarrel over 'existence' often bypasses the actual friction points in mathematical practice. The tension you describe is not primarily between existence and non-existence, but between *structural indifference* and *object specificity*. It is a conflict over identity conditions rather than ontology.

  Below is an analysis of your five points, aiming to disentangle the components of the dispute and assess whether the practice you describe forces a metaphysical hand.

  ### 1. The Components of Platonism and the Requirements of Practice

  To answer this, we must dismantle 'Platonism' into its constituent theses, as they do not stand or fall together. We might distinguish:
  *   **Existence:** There are mathematical objects.
  *   **Independence:** These objects exist independently of human minds, language, and conventions.
  *   **Uniqueness (Determinacy):** For any given mathematical theory (e.g., arithmetic), there is a unique intended structure or domain of objects.
  *   **Nature:** These objects are abstract (non-spatiotemporal, causally inert).
  *   **Epistemology:** We can have knowledge of these objects (often implying a causal or quasi-perceptual link, though this is the hardest to defend).

  **Feature 1 (Indifference to Copy)**
  This feature suggests that truth is invariant under isomorphism. It requires **Independence** only in a weak sense: the truth of the theorem must not depend on our *choice* of representation. It does *not* require **Uniqueness**. In fact, it sits more comfortably with a view where existence is 'cheap' (e.g., modal structuralism or eliminativism), provided the structure is consistent. It actively militates against a strong **Nature** thesis if that thesis ties the object to a specific set-theoretic constitution (e.g., if the number 3 *must* be a specific set).

  **Feature 2 (Privileged Identifications)**
  This is the more demanding feature. By insisting that $\mathbb{N} \subset \mathbb{R}$ literally, while denying $\mathbb{R} \cong \mathbb{R}^2$ implies $\mathbb{R} = \mathbb{R}^2$, the practice implies that identity is finer than isomorphism. This requires **Uniqueness** (or at least determinacy of identity within a context). It suggests that objects have a 'this-ness' (haecceity) that survives changes in structural presentation, or that there is a privileged context that fixes identity.
  *   **Requirement:** Feature 2 requires a robust account of **Identity**. It fits comfortably with **Existence** and **Independence** (the objects are there to be identified), but it is hostile to views where objects are *exhausted* by their structural role (pure structuralism).

  **Summary:** Feature 1 requires truth to be structural; Feature 2 requires identity to be non-structural (or contextually fixed). A standard Platonist accepts both by positing unique, sui generis objects. A nominalist struggles with Feature 2 unless they treat it as mere convention.

  ### 2. Can a Single Theory License Both Features?

  The central difficulty is reconciling the 'cheapness' of Feature 1 with the 'strictness' of Feature 2.

  If existence is cheap (e.g., 'any $\omega$-sequence will do'), then the chain $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \dots$ becomes a choice among many equally good embeddings. On this view, the statement '$3 \in \mathbb{R}$' is not a fact about the world, but a convenience of notation. If a theory licenses this, it treats uniqueness as lost *globally*, but recovered *locally* via convention.

  However, if the practice *needs* uniqueness (as Feature 2 suggests it does, by refusing to identify $\mathbb{R}$ with $\mathbb{R}^2$), does it require Platonism? Not necessarily. It requires **determinacy**, not necessarily mind-independence. A sophisticated conventionalist could argue that the mathematical community has implicitly adopted a 'standard model' convention. The cost here is that the 'fact' of inclusion becomes sociological rather than metaphysical.

  However, there is a view that licenses both without full-blown Platonism: **Contextualism**. On this view, objects are individuated relative to an ambient structure. In the context of analysis, $\mathbb{N}$ is defined as a specific substructure of $\mathbb{R}$. In the context of number theory, it stands alone.
  *   **Does cheap existence kill uniqueness?** Yes, globally. But practice rarely operates globally. It operates within a fixed context.
  *   **Does practice need something the nominalist cannot give?** A nominalist can give the *structure* and the *conventions*. What they cannot give is the *ground* for the intuition that the convention tracks a pre-existing reality. If the mathematician feels that $\pi$ is *really* in $\mathbb{C}$ regardless of our conventions, the nominalist must call this a systematic illusion. If the feeling is merely that the convention is indispensable for coherent thought, the nominalist can accommodate it.

  ### 3. Structuralism and the Distinction of Canonicity

  This is the strongest test for structuralism. If objects are merely positions in a structure, identity should coincide with isomorphism. Yet practice distinguishes between 'natural' (canonical) isomorphisms and 'unnatural' ones.

  **Can Structuralism Explain This?**
  Yes, but only if it upgrades to **Category-Theoretic Structuralism**. In category theory, a 'natural isomorphism' is a precise technical notion involving functors and commutative diagrams. A structuralist can argue that the practice is not identifying objects ($V = V^{**}$), but rather identifying them *up to unique natural isomorphism*.
  *   **The Recovery:** The structuralist recovers Feature 2 by saying: 'We treat $V$ and $V^{**}$ as identical because the isomorphism is canonical; we treat $V$ and $V^*$ as distinct because it is not.'
  *   **The Limit:** The structuralist must insist that this is *not* literal identity. If the mathematician writes $V = V^{**}$ and *means* literal identity, the structuralist must correct them.

  **Is Canonicity a Non-Structural Distinction?**
  No. Canonicity is a structural property of the *mapping*, not the objects. However, there is a risk of circularity. To define 'canonical', one often appeals to a lack of arbitrary choices. But what counts as 'arbitrary' may depend on a prior notion of which structures are 'fundamental'.
  If the structuralist claims that *only* structure exists, they must explain why some structural mappings are privileged over others without appealing to the intrinsic nature of the objects (since there are none). They can do this via universality properties. Thus, a sophisticated structuralist *does* have room for the distinction. The cost is that they must deny that the practice's literal language of 'inclusion' or 'equality' is ontologically strict. It becomes 'equality for all structural intents and purposes'.

  ### 4. The Object-Platonist and the Literal Falsity of Inclusions

  If the Platonist holds that numbers are sui generis abstract objects (Fregean or otherwise), then set-theoretic constructions (Dedekind cuts, Cauchy sequences) are merely models.

  **Treatment of Practice:**
  The Platonist should treat the practice as **literally true about the abstracta**, but **literally false about the sets**.
  *   When a mathematician writes $\mathbb{N} \subset \mathbb{R}$, they are speaking truth about the numbers.
  *   When a set theorist says 'There is no subset relation between the von Neumann naturals and the Dedekind reals', they are speaking truth about the sets.
  *   The conflict arises only if one conflates the numbers with the sets.

  **Shorthand or Symptom?**
  It is not merely convenient shorthand; it is the **primary truth**. The set-theoretic reduction is the shorthand (or the modelling tool).
  *   **Is this a cost?** It is a cost for the *reductionist* programme, not for Platonism. It admits that set theory does not capture the ontology of practice, only its consistency.
  *   **Is it a symptom?** It is a symptom that mathematical language is 'surface grammar' for a deeper ontology. The Platonist argues that the practice works *because* it tracks these sui generis objects, and the set-theoretic awkwardness is an artefact of forcing these objects into a container (sets) not designed for them.
  *   **The Dilemma:** The Platonist must explain how we access these sui generis objects if not through the set-theoretic models. If the models are just models, how do we know the theorems proved about Dedekind cuts apply to the 'Real Numbers'? The Platonist relies on a structural correspondence, which brings them back close to structuralism, but with the added metaphysical baggage of unique objects.

  ### 5. Underdetermination and the Proposed Reform

  **Which Rival Theories License the Practice?**
  1.  **Sui Generis Platonism:** Licenses it by saying the inclusions are literally true of the abstract objects.
  2.  **Contextual Structuralism:** Licenses it by saying identity is relative to the ambient category; within the category of Fields, $\mathbb{Q}$ is a subfield of $\mathbb{R}$.
  3.  **Fictionalism/Nominalism:** Licenses it as a useful internal convention of the 'fiction'.

  The practice is philosophically underdetermined. All three can account for the theorems and the utility. They differ only on the metaphysical status of the 'objects' involved.

  **The Reform: Explicit Embeddings**
  Suppose the mathematical community adopted a strict convention: never write $A \subset B$ without specifying the embedding $i: A \to B$, and never write $A = B$ unless they are extensionally identical sets.

  *   **Would this settle anything?** It would not settle the existence question. It would, however, dismantle the intuition behind Feature 2. By making the embeddings explicit, the 'literal inclusion' would vanish. $\mathbb{N}$ would no longer look like a 'part' of $\mathbb{R}$, but like a structure mapped into $\mathbb{R}$.
  *   **What would be lost?** Heuristic efficiency. The current practice allows for 'type-shifting' that speeds up reasoning.
  *   **Philosophical Impact:** It would conceal the *illusion* of unique objecthood. If mathematicians were forced to write $i(\pi) \in \mathbb{C}$, the temptation to think of $\pi$ as a unique, context-independent object would weaken. It would push the philosophy towards structuralism or nominalism by making the relational nature of the mathematics syntactically visible.
  *   **Conclusion:** The reform would not solve the metaphysical dispute, but it would remove the primary *evidence* used by Object-Platonists (the intuition of literal inclusion). It would reveal that Feature 2 is a linguistic convenience, not an ontological insight. Conversely, if mathematicians resisted this reform because it felt 'wrong' or 'lossy', that resistance itself would be evidence for a deep-seated realist intuition that objects have identity beyond their structural mapping.

  ### Synthesis

  The dispute is not about whether objects exist, but about whether **identity is structural**.
  *   **Feature 1** says: Truth is structural (isomorphism preserves truth).
  *   **Feature 2** says: Identity is not fully structural (isomorphism does not guarantee identity).

  The Platonist resolves this by positing objects that *have* structure but *are not exhausted* by it. The Structuralist resolves this by denying literal identity, replacing it with canonical isomorphism. The Nominalist resolves this by treating both features as rules of a language game.

  Your puzzle reveals that mathematical practice is realist in its *semantics* (Feature 2 insists on definite reference) but structuralist in its *methodology* (Feature 1 insists on invariance). Any philosophy that forces a choice between the two fails to capture the practice. The successful account must explain how we can treat objects as definite while acknowledging their structural interchangeability. Currently, only a view that separates **ontology** (what exists) from **modelling** (how we represent it) — such as Sui Generis Platonism or sophisticated Categorical Structuralism — can accommodate both without declaring half of mathematical writing to be 'false'.
