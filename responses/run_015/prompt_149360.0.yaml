  5. realistic 4-month scope, no team, no citations needed (ill add those)

  please write this up as an actual proposal doc - not an essay defending an answer, just a plan for work. keep the tone casual since im pitching to a generalist board, not philosophy departments. feel free to leave or add a typo since thats my actual writing style.
