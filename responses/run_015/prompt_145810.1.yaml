answer: |-
  ### Brainstorming the Logical Structure of the Basic Argument

  To properly contextualise the interview, one must first delineate the syllogistic force of Galen Strawson's Basic Argument. The core contention is that true moral responsibility (TMR) entails Ultimate Responsibility (UR). UR requires that an agent be the *causa sui* (cause of themselves) in crucial mental respects. Specifically, to be responsible for an action, one must be responsible for the mental nature from which that action flows. However, to be responsible for that nature, one must have chosen it. Yet, any choice is dictated by a prior nature (principles of choice, values, temperament). Therefore, to be responsible for the nature used to choose, one must have chosen *that* nature, leading to an infinite regress. Since finite beings cannot complete an infinite chain of self-creations, TMR is impossible. Compatibilist attempts to halt this regress by appealing to character formation fail because character itself is ultimately the product of luck (genetics and environment), not self-determination.

  ***

  ### Interview Questions

  **Question 1**
  Critics often suggest that the regress you propose is vicious only if we demand responsibility for the entirety of one's mental history. Why does the regress not arbitrarily halt at the agent's first significant, character-forming choice, even if that choice was made using an unchosen initial nature?

  *   **Anticipated Answer:** You will likely respond that the quality of that first choice is itself determined by the initial nature. If the agent was not responsible for that initial nature, they cannot be responsible for the choice it produced, regardless of whether it was the 'first' conscious choice.
  *   **Follow-up:** If the first choice is merely the unfolding of genetic and environmental luck, does this not imply that the very capacity for deliberation is itself a matter of fortune rather than agency?

  **Question 2**
  Let us distinguish between metaphysical responsibility and practical accountability. How does your argument distinguish true moral responsibility from causal or legal accountability, particularly in cases where unconscious processes partly shape character without the agent's awareness?

  *   **Anticipated Answer:** You will likely concede that legal accountability remains necessary for social order but argue that it lacks the moral force of true desert. You may note that unconscious shaping further undermines the claim that the agent is the true author of their character.
  *   **Follow-up:** If unconscious processes dictate character, and character dictates action, is there any coherent sense in which the conscious agent is anything more than a witness to their own life?

  **Question 3**
  A standard compatibilist reply posits that we are responsible for our actions even if we are not responsible for our characters, provided those actions align with our desires. How do you rebut this separation between action and character formation?

  *   **Anticipated Answer:** You will likely argue that actions necessarily flow from character. If the character is not chosen, the actions flowing from it cannot be truly owned by the agent in the requisite moral sense.
  *   **Follow-up:** Given that actions necessarily flow from character, if the character is ultimately a product of luck, does it not follow that the action is equally a product of luck, thereby voiding any claim to ultimate authorship?

  **Question 4**
  There is a concern that your argument leads to a nihilistic view of interpersonal relations. Does your argument eliminate all forms of praise and blame, or does it only eliminate a particularly demanding desert-based notion of these attitudes?

  *   **Anticipated Answer:** You will likely clarify that reactive attitudes like gratitude and resentment may remain as natural human responses, but they cannot be justified by the claim that the recipient fundamentally *deserves* them in a cosmic sense.
  *   **Follow-up:** If desert is removed, are we not left with a system of behavioural modification rather than genuine moral engagement, and is this distinction practically sustainable?

  **Question 5**
  Consider a niche application regarding collective agency: if an institution gradually shapes an agent's mental nature over decades, does pushing responsibility back onto the institution solve the problem or merely relocate the regress?

  *   **Anticipated Answer:** You will likely argue that this merely relocates the regress. The institution is composed of individuals who are themselves subject to the same impossibility of self-creation, so the chain of responsibility remains ungrounded.
  *   **Follow-up:** If the regress is merely relocated to the collective, does this not imply that no structure of human organisation can ever harbour true moral responsibility, rendering all institutional blame equally metaphysically unfounded?

  **Question 6**
  Some libertarians suggest that indeterminism—perhaps at the quantum level—could break the chain of determinism and allow for genuine self-creation. Why does the introduction of randomness fail to secure the *causa sui* condition you require?

  *   **Anticipated Answer:** You will likely contend that randomness does not equate to control. If an action is indeterminate, it is not determined by the agent, and thus the agent cannot be responsible for it any more than they could be for a determined action.
  *   **Follow-up:** If neither determinism nor indeterminism allows for ultimate responsibility, are we not forced to accept that the concept of 'agency' is fundamentally incompatible with the physical structure of reality?

  **Question 7**
  Your father, P.F. Strawson, argued that reactive attitudes are immune to metaphysical doubt because they are woven into the fabric of human life. How do you reconcile your metaphysical conclusion with the psychological inevitability of these attitudes?

  *   **Anticipated Answer:** You will likely distinguish between what we cannot help but feel and what is theoretically justified. You may argue that while we cannot stop feeling resentment, we should recognise it as theoretically unjustified.
  *   **Follow-up:** If the justification is removed but the feeling remains, does this not create a permanent state of cognitive dissonance for the philosophically informed agent?

  **Question 8**
  Is moral responsibility, on your view, a binary concept that one either possesses or lacks, or can it admit of degrees? If it is binary, how do you account for the intuitive difference between a coerced action and a voluntary one?

  *   **Anticipated Answer:** You will likely maintain that true moral responsibility is binary and impossible for all. The difference between coercion and voluntariness is real but relates to freedom of action, not freedom of will.
  *   **Follow-up:** If the distinction lies only in freedom of action, does this not reduce the moral difference between a saint and a sinner to a difference in circumstance rather than a difference in moral worth?

  **Question 9**
  Does the Basic Argument rely on a specific conception of 'self'? If the self is viewed as a narrative construct rather than a metaphysical substance, does the demand for *causa sui* lose its force?

  *   **Anticipated Answer:** You will likely argue that even a narrative self requires a thinker to construct the narrative. That thinker's ability to construct must still be accounted for, leading back to the same regress regarding mental nature.
  *   **Follow-up:** If the thinker's capacity to construct is unchosen, is the narrative not merely a fiction generated by prior causes, rather than a genuine act of self-definition?

  **Question 10**
  Finally, assuming your argument is sound, how ought we to live? Should we attempt to eradicate blame from our moral vocabulary, or is there a pragmatic value in maintaining the fiction of responsibility?

  *   **Anticipated Answer:** You will likely suggest a move towards compassion and a focus on improvement rather than retribution. You may advocate for acknowledging the truth while managing the social utility of responsibility talk carefully.
  *   **Follow-up:** If we acknowledge it as a fiction, does this not risk undermining the very social cohesion that the fiction is intended to support, and how do we mitigate that risk?
