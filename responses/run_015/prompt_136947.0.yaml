answer: |-
  **MEMORANDUM**

  **TO:** Board of Commissioners
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Performance Metrics

  I recommend we retire the "30-day reoccupation" metric immediately and replace it with a "still housed at 12 months" measure, provided we also institute quarterly random audits of intake decisions to prevent managers from screening out high-need families.

  **The Current Problem**
  Two years ago, we changed how we measure success to stop punishing managers for "nightmare units" that sit vacant for years. We switched from tracking average vacant days to tracking the percentage of units reoccupied within 30 days. On paper, this worked: the number looks great. In reality, it has distorted behavior. Managers are now reclassifying hard-to-rent units as "offline for modernization" so they don't count against their score. Meanwhile, tenant satisfaction is down, though we cannot rely on the current survey data since tenants fill it out the moment they sign a lease, before living in the unit. We are measuring speed, not stability, and staff have found a loophole to make the speed look perfect.

  **The Argument for Stopping Measurement**
  One of you suggested we stop publishing these numbers to staff entirely and rely on unannounced audits instead. This position deserves serious weight. Whenever we pin a specific number to a bonus or a performance review, staff will optimize for that number, often at the expense of the mission. This is a known law of management: when a measure becomes a target, it ceases to be a good measure. If we stop measuring, we remove the incentive to game the system. Audits would allow us to catch the "modernization" loophole without forcing managers to chase a specific dashboard number.

  However, as a public body, we cannot operate without transparency. We need to report progress to the city and the public. Complete opacity risks hiding neglect just as easily as it hides gaming. Therefore, we need a metric, but we must treat it as a warning light, not a scorecard, and back it up with the audits suggested by the board.

  **The Proposed Solution and Its Risks**
  Switching to "still housed at 12 months" focuses on retention rather than turnover. This aligns better with our mission of providing stable housing. It is harder to game because a unit cannot be hidden "offline" if a family is supposed to be living there.

  But we must be straight about where the gaming will move. If managers are judged on keeping tenants for a year, they will naturally prefer applicants who look like "safe bets." They may quietly move families with complex needs—poor credit, criminal history, or large sizes—further down the waitlist. This is called "creaming." It solves our metric problem but fails our moral obligation. The hardest-to-house families will sink further down the list, which is worse than the current vacancy issue.

  To prevent this, the new metric must be paired with the audit process. We will not just audit unit conditions; we will audit intake logs. We will randomly review rejected applications and waitlist movement to ensure managers are not screening out difficult cases to protect their retention numbers. This incorporates the "trust but verify" approach of the no-metrics proposal while maintaining public accountability.

  **Timeline**
  *   **Thursday Vote:** Approve the retirement of the 30-day metric and the adoption of the 12-month retention metric.
  *   **November 30:** Staff to draft the quarterly audit protocol, specifically focusing on intake decisions and unit status classifications.
  *   **January 1:** New metric goes live.
  *   **April 1:** First quarterly audit results presented to the board.

  **Conclusion**
  No metric is perfect, and every number we publish will create some unintended behavior. By switching to retention and pairing it with intake audits, we acknowledge that managers will try to game the system and we build a check against it. This balances the need for public data with the wisdom of relying on direct oversight.
