      *   *Premise 2 (Knowledge Requires Causation):* To know/believe $X$, $X$ must causally influence the belief state (causal theory of knowledge/perception).
      *   *Conclusion:* We cannot know we have qualia.
      *   *The Tension:* But we *do* seem to know we have qualia. So either Epiphenomenalism is false, or our knowledge claim is illusory, or the causal requirement is wrong.

  3.  **Evaluate the "Stall":**
