          *   *Counter:* User might say physical survival isn't "value comparison."
          *   *Refinement:* If we can predict *existence* vs. *non-existence*, and we agree existence is better, that's a stable value operator.

      *   *Category 2: Decision Theory under Uncertainty.*
          *   Maximin, Minimax Regret, Info-Gap Decision Theory.
          *   Imprecise Probabilities (Casino arguments).
          *   *Key Point:* These don't require precise $P$ or $V$, just bounds. If bounds are sufficient for action, normative authority remains.
          *   *Stochastic Dominance:* If Act A dominates Act B across *all* plausible value functions, you don't need to resolve the opacity.

      *   *Category 3: Philosophical/Coherence Conditions.*
