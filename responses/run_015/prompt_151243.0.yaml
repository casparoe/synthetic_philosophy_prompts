  2.  **Deconstruct the "Normative Opacity" Argument:**
      *   *Epistemic Cluelessness:* We don't know $P(O|A)$ (probability of outcome given action).
      *   *Normative Opacity:* We don't know $V(O)$ (value of outcome) or even if $V(O_1) > V(O_2)$ is meaningful across vastly different future contexts.
