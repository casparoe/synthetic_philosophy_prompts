      *   *Key distinction:* Authority doesn't require *certainty*, it requires *non-arbitrariness*. If the decision procedure is non-arbitrary despite opacity, authority remains.

  9.  **Final Polish:** Check names (Greaves, MacAskill, Beckstead, Thorstad). Ensure the distinction between epistemic and normative is maintained. (The user's "normative opacity" is arguably still epistemic about values, but I should treat it as they define it: semantic instability).

