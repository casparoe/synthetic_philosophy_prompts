answer: |-
  ### Fatal
  The anencephalic infant is the fatal bullet. If personhood is constituted by the relation of address-and-potential-answer, entities lacking the biological substrate for answerability fail the test. You cannot say they are persons "in principle" without smuggling in a capacity view. If you claim they are persons because we *ought* to address them, you've shifted from constitutive relationalism to normative individualism. The relation isn't doing the work; the inherent worth is. If the view cannot account for humans who permanently lack the capacity to answer without collapsing into 'worthiness,' it loses its distinctively relational ontology. Furthermore, if the last human alive loses personhood due to lack of addressees, you violate the intuition that personhood survives isolation. These cases suggest the 'address test' tracks moral status rather than constituting it.

  ### Serious but answerable
  The hermit and the isolated addresser are serious but survivable. For the hermit, you can argue dispositional addressability suffices; the community *could* address them, establishing the normative space even if unactualized. For the slaveholder, you must distinguish between ontological status and social recognition. A committed relationalist concedes the slave is socially dead but insists the community violates a metaphysical requirement by failing to address them. The fault lies in the community's failure to instantiate the relation, not the victim's lack of status. However, this requires positing a "true" community (perhaps including ancestors) that always addresses correctly. This saves the theory but adds metaphysical baggage. It answers the objection by expanding the relata, not denying the relational requirement. The key is insisting the relation is normative, not merely empirical.

  ### Merely awkward
  The "addressing into the void" case is merely awkward. If I address a stone and get no reply, I remain a person. Your test risks making my status contingent on your response. You must clarify that *addressability* is the capacity to enter the space of reasons, not the successful completion of a dialogue. If personhood waits on a reply, it becomes transactional. This feels counterintuitive but doesn't destroy the view if you frame addressability as a standing invitation rather than a completed contract.

  ### What I'd concede and what I'd swat
  I'd concede that 'answer' must include proxy answering. Caregivers answer for the dementia patient, sustaining the relation. This keeps it relational without demanding impossible capacities. It acknowledges that personhood can be held in trust. I'd swat the hermit case. Dispositional relations count. The community's failure to address doesn't negate the *possibility* of the relation. The real threat isn't isolation; it's the claim that addressability is just a disguised capacity. You must insist the status vanishes without the community, even if that sounds harsh. Don't retreat to 'worthiness.' Stand firm: no relation, no personhood, but the community is obligated to create the relation.

  ### Is it insulated?
  Co-author worries are valid. If 'addressable' means 'capable of answering,' you're a capacities theorist. If it means 'worthy of address,' you're a Kantian. To remain relational, the *actual* holding-in-relation must constitute the status. If you say the community is always wrong when they fail to address, you imply the status exists independently of their action. Either: the relation constitutes the status (and can be absent), or the status is intrinsic (and the relation is just recognition). Insulation costs coherence.

  ### Bottom line
  It's a normative theory of status, not a metaphysical description. Own the claim that communities create persons, but admit this makes personhood fragile. Don't hide behind 'addressability' to avoid the hard relational consequences.
