answer: |-
  # Joint Statement of Adversarial Collaboration on Contractualist Aggregation

  **Parties:** Pairwise Non-Aggregationist Contractualists (PNAC) and Threshold-Sensitive Contractualist Aggregationists (TSCA)
  **Framework:** Scanlonian Contractualism

  ## 1. Agreed Claims

  We, the undersigned camps, affirm the following shared commitments within the contractualist framework:

  1.  **Formal Structure of Justification:** An act is wrong if it violates principles for the general regulation of behavior that no one could reasonably reject as a basis for informed, unforced general agreement.
  2.  **Generic vs. Personal Reasons:** Reasons for rejecting a principle must be generic (grounded in shared human interests and status) rather than fully personal (based on idiosyncratic preferences or projects).
  3.  **The Aggregation Problem:** The central theoretical challenge is determining whether burdens distributed across many individuals can combine to outweigh a concentrated burden on a single individual when comparing principles for rejection.
  4.  **Shared Substantive Judgment:** Preventing one instance of permanent paralysis generally outweighs preventing any number of minor, transient inconveniences (e.g., mild headaches), regardless of the number of people experiencing the inconveniences.
  5.  **Rejection of Utilitarianism:** Simple welfare-maximizing aggregation (linear summation of utility across persons) is inappropriate for contractualist justification because it fails to respect the separateness of persons.
  6.  **Constraint on Aggregation:** We agree that if aggregation is permitted within contractualism, it must be constrained by a non-arbitrary mechanism rather than linear summation to avoid collapsing into utilitarianism.

  ## 2. Disagreements Table

  | Issue | Pairwise Non-Aggregationist View (PNAC) | Threshold-Sensitive View (TSCA) |
  | :--- | :--- | :--- |
  | **Scalability of Generic Reasons** | Generic reasons attach strictly to individuals; they do not scale or sum across persons because moral justification is fundamentally relational between individuals. | Generic reasons can scale across persons; when many individuals share identical generic burdens, these combine to form a collective generic reason of greater weight. |
  | **Emergence of Collective Veto** | A collective veto cannot emerge without violating pairwise justification; only an individual's own burden can ground their reasonable rejection of a principle. | A collective veto can emerge without violating pairwise justification; the aggregated burden creates a generic reason strong enough to justify rejection on behalf of the group. |
  | **Collapse into Rule-Utilitarianism** | Permitting any form of aggregation opens a slippery slope that inevitably collapses contractualism into rule-utilitarianism by prioritizing total burden over individual standing. | Permitting threshold-sensitive aggregation does not collapse contractualism into rule-utilitarianism because the threshold constraint preserves individual standing against linear maximization. |

  ## 3. Cruxes

  ### Crux 1: The Moral Weight of Numbers in Non-Life Cases
  *   **(a) Neutral Question:** Does the sheer number of people bearing a minor burden ever generate a reason strong enough to outweigh a significant burden on a single individual, provided the minor burden does not threaten life or basic functioning?
  *   **(b) Test Case:** A policy prevents one person from losing a finger (significant permanent disability) but imposes a one-hour sleep loss on ten thousand people (minor transient inconvenience).
  *   **(c) Predictions:**
      *   **PNAC:** The principle permitting the policy is *not* reasonably rejectable. The individual burden of sleep loss is pairwise less significant than losing a finger; numbers do not count.
      *   **TSCA:** The principle permitting the policy *is* reasonably rejectable. The summed burden of 10,000 hours of sleep loss crosses the threshold of significance required to outweigh the finger loss.

  ### Crux 2: Risk Imposition and Expected Value
  *   **(a) Neutral Question:** Can independent probabilistic risks imposed on many individuals aggregate to justify rejecting a principle that saves a specific individual from certain harm?
  *   **(b) Test Case:** A policy saves one identified person from certain death but exposes one million unrelated people to an independent 0.001 risk of death (expected 1,000 deaths).
  *   **(c) Predictions:**
      *   **PNAC:** The principle is *not* reasonably rejectable by the risk-bearers. Each individual's 0.001 risk is pairwise too small to outweigh the certain death of the one beneficiary.
      *   **TSCA:** The principle *is* reasonably rejectable. The aggregated expected mortality constitutes a collective burden that crosses the threshold to outweigh the benefit to the single individual.

  ### Crux 3: The Continuum and Arbitrariness
  *   **(a) Neutral Question:** Is there a principled point at which adding one more person to the burdened group changes the moral verdict, or is the verdict constant regardless of numbers?
  *   **(b) Test Case:** A sequence of cases where a principle imposes a moderate burden on *N* people to save one person from a severe burden, where *N* increments from 1 to 1,000,000.
  *   **(c) Predictions:**
      *   **PNAC:** The verdict is *constant*. If the principle is acceptable at *N*=1, it remains acceptable at *N*=1,000,000; no specific number changes the pairwise comparison.
      *   **TSCA:** The verdict *flips*. There is a specific threshold *N* where the aggregated burden becomes sufficient to reject the principle; adding one person across this boundary changes the verdict.

  ## 4. Assessment of Verbal Dispute

  The dispute is not merely verbal. While both camps utilize the term "generic reason," they assign fundamentally different structural properties to it: PNAC treats it as inherently individualistic, while TSCA treats it as potentially collective. This is a substantive disagreement about the metaphysics of moral reasons and the interpretation of "reasonable rejection," evidenced by the divergent verdicts predicted in the cruxes. However, a minor verbal element exists regarding the definition of "pairwise," where TSCA argues their threshold mechanism remains pairwise-compatible if the "pair" is understood as individual vs. collective generic reason, whereas PNAC insists "pairwise" must mean individual vs. individual.

