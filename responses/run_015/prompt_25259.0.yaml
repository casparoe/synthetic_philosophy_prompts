answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have the distinct privilege of standing up here for [Groom] and [Bride].

  When people ask how they met, the story is legendary in certain circles. They met in law school. But they didn't bond over a shared love of case briefs or a mutual fear of the Socratic method. They bonded over a fight. Specifically, a fight about Jon Elster, Ulysses, and the Sirens.

  For the family members here: In mythology, Ulysses wanted to hear the Sirens' song, but he knew if he did, he'd steer his ship into the rocks. So, he ordered his crew to tie him to the mast. He bound his present self to protect his future self.

  For the colleagues here: Elster argued this is the model for constitutional precommitment. But [Groom] and [Bride] spent their first date arguing about whether that analogy holds. Because a constitution isn't written by a single person binding themselves. It's written by founders binding *other* people. It raises the question of sovereignty: Who is really in charge? The past self that tied the knots, or the future self that has to live inside them?

  They disagreed fiercely that night. They have disagreed productively ever since. And honestly, if you know them, you know that "disagreeing productively" is just their way of saying "I love you."

  But tonight, looking at them, I think they've finally solved the problem. And the solution is marriage.

  Marriage *is* a precommitment strategy. Let's not pretend otherwise. When you stand here and say "for better, for worse," you are tying your own hands. You are telling your future self: "No matter how angry you get, no matter how alluring the Sirens of convenience or escape might sound, you cannot steer this ship into the rocks."

  Now, the legal theorists in the room know the danger here. If the constraint is too tight, it's oppressive. If the "dead hand" of the wedding vow weighs too heavily on the living couple, sovereignty is lost. You become a prisoner of your past promises.

  But watch [Groom] and [Bride]. They have shown me that the constraint isn't a cage. It's the mast.

  Ulysses didn't tie himself to the mast because he wanted to be trapped. He tied himself to the mast so he could experience the song *without drowning*. He restricted his freedom so he could survive the journey.

  That is what these two are doing today. They know that life will bring songs that sound beautiful but lead to rocks. They know that their future selves will be tired, or stubborn, or tempted to take the easy way out. So, they are building a constitution for two. They are voluntarily limiting their own sovereignty, not to restrict each other, but to protect what they are building together.

  To the family: This isn't cold legal theory. It's the warmest thing they could do. It's saying, "I trust you with my future self, even when my future self is difficult."

  To the colleagues: They have resolved the counter-majoritarian difficulty of marriage by making it a continuous ratification. Every day they choose to stay, they amend the constitution. They prove that the sovereign isn't the past self, and it isn't the future self. The sovereign is the *union*.

  [Groom] and [Bride], you have spent years debating how to bind a self. Today, you bind yourselves to each other. May your arguments remain fierce, may your precommitments hold fast when the winds blow, and may you always find that the safest place in the world is tied to the mast, together.

  Please raise your glasses. To the Groom and the Bride.
