answer: |-
  No theory of neural representation can be considered adequate unless it reconciles the causal efficacy of internal states with the empirical reality of superposition and adversarial vulnerability, acknowledging that optimization targets task performance rather than human ontological fidelity.

  **Empirical Phenomena**
  An adequate theory must account for **Superposition and Polysemanticity**, where single neurons or directions encode multiple unrelated features to maximize capacity within limited dimensions. *Motivating Case:* Anthropic's work on sparse autoencoders reveals that "toy" transformers store more features than neurons by overlapping representations in high-dimensional space, contradicting the one-neuron-one-concept hypothesis. It must explain **Linear Concept Encoding**, where semantic properties are recoverable via linear probes despite non-linear activation functions. *Motivating Case:* Bolukbasi et al. (2016) demonstrated that gender bias in word embeddings lies along a specific linear direction, removable via projection without retraining. It must also explain **Adversarial Vulnerability**, where imperceptible input perturbations cause confident misclassification. *Motivating Case:* Goodfellow et al. (2015) showed that linear approximations in high dimensions allow noise to accumulate across features, suggesting networks rely on non-robust, statistically predictive cues rather than robust semantic features.

  **Conceptual Distinctions**
  The framework must preserve the distinction between **Encoding vs. Causal Exploitation**, separating information merely present in a layer from information actually used to compute the output. *Motivating Case:* Causal mediation analysis often reveals that linearly decodable features, when ablated or swapped, do not alter model predictions, indicating they are epiphenomenal correlates rather than functional mechanisms. It must also distinguish between **Localist vs. Distributed Storage**, clarifying whether meaning resides in individual units or population codes. *Motivating Case:* The failure of "grandmother cell" searches in vision models versus the success of population vector decoding in motor cortex studies suggests neural networks operate via distributed ensembles rather than symbolic locality.

  **Consistency Conditions**
  Any theory must remain consistent with **Training Dynamics**, acknowledging that representations emerge from gradient descent rather than explicit design. *Motivating Case:* The "grokking" phenomenon, where generalization abilities emerge suddenly late in training after memorization, implies representational structures reorganize fundamentally over time rather than remaining static. It must also respect **Architectural Constraints**, specifically how information flows through residual streams and attention heads. *Motivating Case:* In Transformers, the residual stream acts as a communication channel where features are added and read sequentially, meaning representations are dynamic trajectories rather than static slot fillings.

  **Puzzles to Dissolve**
  The theory must dissolve the **Alignment Puzzle**: why human-interpretable categories emerge at all if networks optimize only for loss. *Motivating Case:* CLIP models align image and text representations without explicit supervision, suggesting natural language imposes a structural prior that forces network geometry to converge with human categories. It must also address the **Robustness-Accuracy Trade-off**, explaining why standard training yields high accuracy but low adversarial robustness. *Motivating Case:* Adversarial training improves robustness but often reduces standard accuracy, implying these rely on distinct feature sets.

  **Non-Negotiable vs. Camp-Specific Preferences**
  *Non-Negotiable:* **Causal Efficacy** (a representation must do work in the computation) and **Architectural Consistency** (the theory cannot violate known data-flow constraints). If a proposed feature does not change the output when intervened upon, it is not a functional representation of the network, regardless of human interpretability.
  *Camp-Specific Preferences:* **Human Legibility** (Strong Realists demand concepts match human language; Instrumentalists argue this is irrelevant to machine cognition) and **Monosemanticity** (Mechanistic interpreters hope for one-feature-per-neuron clarity; Distributed Realists accept polysemanticity as fundamental). Demanding human-legible representations is a preference for alignment utility, not a requirement for ontological truth about the network.

  **Joint Unsatisfiability (No-Go Results)**
  There is a tension analogous to a no-go theorem between **Strict Modularity**, **High Capacity**, and **Linear Decodability**. You cannot simultaneously have one-neuron-one-concept locality (Strict Modularity), store enough features to handle real-world complexity (High Capacity), and maintain simple linear readouts for all features (Linear Decodability). Superposition proves that High Capacity requires sacrificing Strict Modularity. Furthermore, requiring **Complete Causal Efficacy** for every decodable feature conflicts with **Adversarial Vulnerability**; if every linearly decodable feature were causally robust, adversarial examples would not exist. Thus, a theory claiming all decodable features are both causal and robust is mathematically inconsistent with current empirical data.

  **Scorecard**
  *   **Strong Distributed Realism:** Scores high on Superposition and Training Dynamics but struggles to explain why Linear Probes work so well without implying causal efficacy where none exists.
  *   **Mechanistic Interpretability (Causal):** Scores high on Causal Efficacy and Architectural Consistency but often falters on Superposition, requiring complex dictionary learning to recover monosemantic features from polysemantic neurons.
  *   **Instrumentalist Critique:** Scores high on Adversarial Vulnerability and Predictive Power but dismisses the Alignment Puzzle, offering no account for why internal structures correlate with human concepts at all.
