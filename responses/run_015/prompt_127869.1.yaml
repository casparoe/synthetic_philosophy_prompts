answer: |-
  Here is the specification for an adequate evaluation framework for ontological arguments. This spec treats Anselm's conceptual approach and Gödel/Plantinga's modal-axiomatic approach as distinct classes requiring different validation criteria, while identifying the structural tensions shared by the family.

  ### I. Classification Cases (The "Test Suite")
  An adequate framework must correctly categorize the logical status and failure modes of the following specific instantiations without conflating them:

  1.  **Anselm P2 (Conceptual):** The "Greatness" argument. *Requirement:* Must evaluate whether "existence" functions as a greatness-making property within a conceptual containment model.
  2.  **Anselm P3 (Necessary Existence):** The "Cannot be conceived not to be" argument. *Requirement:* Must distinguish this from P2; it relies on the superiority of necessary existence over contingent existence, not existence vs. non-existence *simpliciter*.
  3.  **Plantinga (Modal Possibility):** Maximal Greatness entails Necessary Existence. *Requirement:* Must evaluate the epistemic warrant of the premise $\Diamond \exists x Gx$ (Possibly, a Maximally Great Being exists) without assuming S5 validity guarantees truth.
  4.  **Gödel (Axiomatic):** Derivation from "Positive Properties." *Requirement:* Must assess the consistency of the set of positive properties and the definition of "Essence," independent of theological intuition.
  5.  **Parody/Reverse Arguments:** (e.g., Perfect Island, Perfect Devil, Necessary Non-Existence). *Requirement:* Must explain why these fail if the Theistic version succeeds (e.g., incoherence of "maximal evil" or category errors regarding islands) without resorting to ad hoc exemptions.

  ### II. Conceptual Distinctions (The "Type System")
  The framework must enforce strict typing on the following distinctions. Collapsing these constitutes a framework failure.

  1.  **Existence as Predicate vs. Quantifier vs. Modal Status:**
      *   *Anselm P2* treats existence as a predicate of greatness.
      *   *Frege/Kant* treat existence as a second-order quantifier.
      *   *Plantinga/Gödel* treat *Necessary Existence* as a property (a mode of having properties).
      *   *Spec:* The framework must not allow a Kantian objection to automatically dismiss a Modal argument, nor allow a Modal argument to smuggle existence in as a first-order predicate.
  2.  **Conceptual Containment vs. Axiomatic Derivation:**
      *   *Anselm* relies on the semantics of the concept "God" (intensional).
      *   *Gödel* relies on formal axioms about property positivity (extensional/axiomatic).
      *   *Spec:* Validity in Gödel does not redeem incoherence in Anselm, and vice versa.
  3.  **De Re vs. De Dicto Necessity:**
      *   Must distinguish "It is necessary that God exists" ($\Box \exists x Gx$) from "God has the property of necessary existence" ($\exists x (Gx \land \Box Ex)$). Gödel argues the latter implies the former in S5, but the framework must track the step.
  4.  **Consistency of the Concept:**
      *   The framework must separate *logical validity* (if premises are true, conclusion follows) from *conceptual coherence* (are the premises possible?). The burden of proof for $\Diamond P$ lies on the proponent.

  ### III. Logical Constraints (The "Hard Limits")
  The framework cannot validate an argument that violates these established logical results:

  1.  **S5 Collapse:** If the logic assumes S5 ($\Diamond \Box P \rightarrow \Box P$), the framework must flag that the possibility premise is equipollent to the conclusion.
  2.  **Modal Collapse (Gödel Specific):** If Necessary Existence is a positive property and God causes the world, the framework must detect if the argument entails that *all* truths are necessary ($\forall p, \Box p$). A valid argument that entails fatalism is a *reductio* unless the framework accounts for it.
  3.  **Question-Begging Threshold:** The framework must measure the epistemic distance between the possibility premise and the conclusion. If accepting the premise requires the same confidence as the conclusion, the argument is dialectically inert.
  4.  **Ontological Commitment:** The framework must specify the quantification domain. Does $\exists x$ range over possibilia (Plantinga) or actualia (Quine)? If possibia, the framework must handle cross-world identity.

  ### IV. Jointly Unsatisfiable Pairs (The "Trilemmas")
  These are pairs of desiderata that cannot be simultaneously satisfied. An adequate framework must flag these trade-offs explicitly rather than hiding them.

  1.  **Full S5 Validity vs. Non-Triviality:**
      *   *Conflict:* In S5, $\Diamond \Box G \rightarrow \Box G$ is valid. However, $\Diamond \Box G$ is modally equivalent to $\Box G$.
      *   *Result:* You cannot have an argument that is formally valid in S5 *and* provides independent evidence for the conclusion. Validity is purchased at the cost of the premise being as strong as the conclusion.
  2.  **Positive Properties Consistency vs. Modal Realism:**
      *   *Conflict:* Gödel's axioms require a robust modal realism (properties exist across worlds) to define "positivity" consistently.
      *   *Result:* You cannot have Gödel's derivation *and* maintain a nominalist or anti-realist stance on modality.
  3.  **Existence as Perfection vs. Kantian Critique:**
      *   *Conflict:* Anselm P2 requires existence to add to the "greatness" value of a concept. Kant shows existence adds no content to the concept.
      *   *Result:* You cannot satisfy Anselm P2 without rejecting the Frege-Kant analysis of existence, which undermines much of modern logic.
  4.  **Necessary Existence vs. Contingent Creation:**
      *   *Conflict:* If God exists necessarily and God's will is necessary, the Creation is necessary (Modal Collapse).
      *   *Result:* You cannot maintain Gödel's Necessary Existence *and* standard Christian/Theistic voluntarism (contingent creation) without modifying the axioms (e.g., Anderson's modifications).

  ### V. Scoring Common Responses
  Here is how standard philosophical responses score against this specification.

  | Response Type | Classification Accuracy | Distinction Respect | Logical Constraints | Trade-off Awareness | Total Score |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Kantian / "Begs the Question"** | **Fail.** Collapses Anselm P2, P3, and Plantinga into one "existence is not a predicate" bucket. | **Fail.** Ignores the shift to *Necessary* Existence in P3/Plantinga. | **Pass.** Correctly identifies the quantifier issue. | **Fail.** Misses the S5 modal equivalence issue. | **Low.** Good for P2, useless for Gödel/Plantinga. |
  | **Plantinga-Style (Rational Acceptability)** | **Pass.** Admits P2 is weak, focuses on P3/Modal. | **Pass.** Respects the shift to modality. | **Pass.** Admits S5 validity but denies soundness proof. | **Pass.** Explicitly admits the premise is not known to be true, only rational to accept. | **High.** Best for epistemic evaluation, admits logical limits. |
  | **Hard Formalist (Gödel/Axiomatic)** | **Pass.** Treats Gödel as distinct from Anselm. | **Pass.** Rigorous on axioms. | **Fail.** Often ignores Modal Collapse implications. | **Fail.** Treats consistency of "Positive" as given without metaphysical cost. | **Medium.** Logically sound, metaphysically expensive. |

  ### VI. Verdict: Is the Family Broken?
  **The framework reveals that the argument family is not "broken," but the goal of "Proof" is category-incoherent.**

  1.  **No Unified Framework Saves Both:** You cannot have a single framework that validates Anselm's conceptual containment *and* Gödel's axiomatic derivation without collapsing the distinction between semantics and logic. Anselm fails on logical formalization; Gödel fails on metaphysical neutrality.
  2.  **The S5 Barrier:** Any framework that demands formal validity in S5 forces the admission that the possibility premise ($\Diamond \Box G$) is epistemically identical to the conclusion ($\Box G$). Therefore, no framework can deliver a *dialectical proof* (one that convinces a skeptic) while maintaining S5 validity.
  3.  **The Only Viable Path:** The only framework that satisfies the desiderata is one that reclassifies these arguments as **Consistency Checks** rather than **Demonstrations**.
      *   *Function:* They show that "God exists" is not logically contradictory (against Strong Atheism).
      *   *Limitation:* They cannot show "God exists" is actually true (against Agnosticism) without begging the question.

  **Conclusion:** If your spec demands a framework that delivers a sound, non-question-begging proof for a neutral audience, **the desiderata are jointly unsatisfiable.** The logic (S5) demands the premise be as strong as the conclusion; the metaphysics (Kant/Modal Collapse) demands the premise be weaker than the conclusion. A framework can save the *logical coherence* of the arguments, but only by sacrificing their *probative force*.
