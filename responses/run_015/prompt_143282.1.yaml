  - a friend who's right about this kind of thing nine times out of ten texts that the 11:04 is cancelled: yes, knows.
  - the preface case: a historian writes a twelve-chapter monograph, checks every chapter twice, and also writes in the preface that the book almost certainly contains at least one error somewhere. Priya says the historian knows each chapter's central claim and also knows the book contains an error, and that the apparent contradiction is the same shape as the lottery case.
  - blue-bus style case: 90% of the buses in the city belong to one company, one of them hits a cyclist, no one saw which, the base rate is the only evidence. No: nobody knows it was a company bus.
  - rare disease, 1 in 10,000, a test that's 99% accurate in both directions, positive result, doctor relays it. No: the patient doesn't know, and shouldn't start acting as if she does.
  - forecast says 90% chance of rain tomorrow and she's deciding whether to move her birthday picnic indoors: yes, you know it's going to rain, and you'd be irrational not to move it. I pointed out that 90% is way lower than the lottery ticket's 99.99999%, and she said the cases aren't the same because in the lottery you know in advance that exactly one ticket wins and you have no evidence about which one, whereas the forecast is evidence about tomorrow specifically.

  Now the new case, which is the one I actually care about. Her own company runs a nightly automated security pipeline over about 8,000 employee accounts. Roughly 5% of accounts are genuinely compromised in a given month. The flagger catches 99% of the genuinely compromised ones and misfires on 0.1% of the clean ones — so work the posterior out yourself, I make it a bit over 98% for any given flagged account. Tonight it flags a few hundred accounts, Dana's among them. Dana's manager, acting on the flag and nothing else — no human looked at Dana's login pattern, no individualising evidence about her account at all — locks the account and opens a misconduct investigation, which means Dana can't do her job and gets a note in her file.

  What I want to know: does the manager know Dana's account is compromised, is it rational for her to believe it, and what would Priya say if the only consequence of a flag were an automatic password-reset email? The bit I find interesting is that this case is three of her earlier cases stacked on top of each other: it's bare statistical evidence about an individual (bus case), the numbers are much better than the bus case but the stakes are much worse than the picnic, and there's a whole set of flagged accounts at once, which is basically the preface case again with accounts playing the role of chapters.

  So: predict her verdict and tell me what she should say to be consistent with herself. Give me the candidate rules that fit her seven verdicts equally well — I can think of at least a bare-statistical-evidence rule, a modal safety rule, a stakes-sensitive rule, and something that falls out of her treatment of the preface — and if two of them are the same rule in different words, say so. For each, say which of her verdicts it explains, what it predicts about Dana (under both the investigation version and the reset-email version), and which of her verdicts it sits least comfortably with. Then give me the one further case that would best tell the surviving rules apart, and your best guess at her verdict on Dana with a rough confidence.

  Format: a table with exactly these columns — rule_name, rule_in_one_sentence, verdicts_it_explains (use short labels for my seven cases), prediction_investigation_version, prediction_reset_email_version, weakest_verdict_for_it, discriminating_case. After the table, two short things: a line giving your best guess plus a 0–100 confidence, and a settled-and-contested section where you seperate what people who actually work on this generally accept from what's genuinely up for grabs — I don't want a contested position presented as the consensus view just because it's the one you find most attractive.
