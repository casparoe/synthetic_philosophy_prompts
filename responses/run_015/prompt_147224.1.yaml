          *   Justify why this comparison is better than a literature survey.
          *   Define success (working criterion without value collapse) and failure (boundary choices encode preferences).
          *   Scope: 8-10 weeks part-time.
          *   No citations/bibliography.
          *   Tone: Professional but accessible (acknowledging the user's background).
          *   Ignore typos in the prompt.

  2.  **Deconstruct the Core Idea:**
      *   *The Problem:* Low-impact AI usually requires a "baseline" to measure impact against. Defining that baseline often implies what matters (e.g., keeping the vase intact implies the vase matters).
      *   *The Proposed Solution:* Use dynamical systems theory. If the agent is removed (counterfactual), does the system return to/stay in the same attractor basin? If yes, low impact. If no, high impact/side effect. Add "information-flow closure" to ensure the agent isn't manipulating things subtly.
      *   *The Challenge:* Defining the "system boundary" and the "counterfactual removal" often requires knowing what variables to track, which is itself a value judgment.

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be catchy but accurate. "Value-Agnostic Side-Effect Avoidance via Counterfactual Dynamical Stability."
      *   **Research Question:** Needs to be binary/testable. "Is it possible to construct a side-effect penalty function based *solely* on counterfactual dynamical stability and information-flow closure that functions correctly in toy environments without implicit value assumptions in the boundary definition?"
      *   **Background/Motivation:** Acknowledge the user's insight. Current methods (relative reachability, attainable utility) need a baseline state. Choosing *which* state variables constitute the baseline smuggles in values (e.g., caring about the position of a vase vs. dust motes). The user's idea tries to bypass this by looking at structural stability rather than state distance.
      *   **Methodology:**
          *   *Timeframe:* 8-10 weeks part-time.
          *   *Setup:* Toy environments (Gridworlds, simple physics sims).
          *   *Model A (Causal-Closure):* Measure divergence of trajectories with/without agent.
          *   *Model B (Info-Flow):* Measure mutual information or causal influence across a boundary.
          *   *Test:* Run agents optimized for a simple goal + this penalty.
          *   *Evaluation:* Do they break things unnecessarily? Do they freeze? Do they manipulate the measurement?
      *   **Why this over a survey?** A survey just catalogs existing value-laden approaches. This builds and breaks a specific hypothesis. It produces empirical evidence, not just opinion.
      *   **Success Criteria:** The agent achieves its goal without changing the "natural" trajectory of unrelated variables, *and* the definition of "unrelated" didn't require labeling those variables as important beforehand.
      *   **Failure Criteria:** The method either paralyzes the agent (everything is a side effect) or allows destruction (nothing is a side effect), *or* (crucially) setting up the simulation required hard-coding what matters to make it work.
      *   **Scope Management:** Keep it to 2D grids or simple ODEs. No deep RL training from scratch, maybe use tabular or simple policy search.

