      *   **Core Idea:** Define "side effects" not via human values (which are hard to specify) but via *counterfactual dynamical stability* (does the world leave its original attractor basin if the agent is removed?) and *information-flow closure*.
      *   **Goal:** A short research proposal (workshop pitch or one-semester project).
