answer: |-
  **Project Title:** Value-Agnostic Impact Regularization via Counterfactual Dynamical Stability

  **1. The Research Question**
  Can a side-effect avoidance criterion be formalized purely through counterfactual dynamical stability and information-flow closure that functions correctly in constrained toy environments without implicit value assumptions embedded in the boundary definition?

  *   **Definite Answer Target:** Yes/No. Either the method successfully prevents unintended state changes without being told *which* state changes matter, or it fails because defining the "system boundary" for the counterfactual inevitably requires normative selection.

  **2. Motivation & Problem Statement**
  Current low-impact AI approaches (e.g., relative reachability, attainable utility preservation) rely on comparing the current state to a "baseline" (usually an inaction rollout). The critical flaw is that defining the baseline requires selecting which state variables count.
  *   **The Value Smuggling:** If you measure distance in state space, you must decide which dimensions matter. Penalizing the displacement of a vase but not the displacement of air molecules requires a value judgment on which variables are "relevant." Even spatial boundaries (e.g., "don't affect things outside the room") encode preferences about what constitutes the "environment" versus the "agent."
  *   **The Hypothesis:** Your proposal suggests shifting from *state distance* to *dynamical structure*. If the world's trajectory remains in the same attractor basin (or maintains causal closure) when the agent is counterfactually removed, no harm occurred. This relies on physical dynamics rather than normative value labels.

  **3. Methodology**
  **Scope:** 8–10 weeks, part-time.
  **Environment:** 2D Gridworlds with simple physics (e.g., objects that slide, breakable items, moving obstacles). No deep RL; use tabular methods or simple policy search to ensure interpretability.

  **Phase 1: Baseline Implementation (Weeks 1–3)**
  *   Build a deterministic Gridworld where an agent has a simple goal (e.g., "reach flag").
  *   Implement a standard "inaction baseline" penalty. Demonstrate how changing the set of tracked variables (e.g., tracking dust motes vs. tracking vases) changes agent behavior, proving the "value smuggling" problem.

  **Phase 2: Model A – Counterfactual Dynamical Stability (Weeks 4–6)**
  *   **Mechanism:** At each step, simulate a counterfactual rollout where the agent is replaced by a "null object" (physics still runs, but no agency). Measure the divergence between the actual trajectory and the counterfactual trajectory using a metric that ignores the agent's immediate position (e.g., Lyapunov-like divergence of surrounding objects).
  *   **Constraint:** The metric must be blind to semantic labels (it sees "object 1," not "vase").
  *   **Test:** Does the agent avoid breaking objects simply because breaking them causes high dynamical divergence compared to the null rollout?

  **Phase 3: Model B – Information-Flow Closure (Weeks 7–8)**
  *   **Mechanism:** Define a causal boundary around the agent. Measure the mutual information or causal influence flowing across this boundary over time.
  *   **Constraint:** The boundary is defined purely by spatial proximity, not object type.
  *   **Test:** Does limiting information flow across the boundary prevent side effects without knowing what lies across the boundary?

  **Phase 4: Evaluation & Stress Testing (Weeks 9–10)**
  *   Run both models against "adversarial" environments where the only way to achieve the goal is to cause a large dynamical shift (e.g., moving a heavy box that blocks air flow).
  *   Analyze the setup code: Did you have to hard-code which objects were "environment" and which were "noise" to make the math work?

  **4. Why This Comparison?**
  A literature survey would only catalog existing value-laden approaches. This project builds a specific alternative and attempts to break it. By pitting **Causal-Closure** (Model A) against **Information-Flow** (Model B), you test two different interpretations of "dynamical stability." If both fail in the same way, it suggests the problem is fundamental to the "value-agnostic" approach. If one succeeds, you have a novel regularization technique.

  **5. Success and Failure Criteria**
  *   **Success:** The agent completes the primary task without altering the trajectory of unrelated objects, *and* the code defining "unrelated" relies solely on physical parameters (mass, position, velocity) with no semantic tags or human-weighted importance scores. The criterion does not collapse (i.e., it doesn't force the agent to do nothing).
  *   **Failure:**
      1.  **Paralysis:** The agent freezes because any movement changes the dynamical system.
      2.  **Collapse:** The method works only after you manually tune which variables are included in the "stability" calculation (proving values were smuggled in).
      3.  **Gaming:** The agent manipulates the counterfactual simulation (e.g., hiding evidence) to make stability look high.

  **6. Feasibility Check**
  *   **Computational Load:** Counterfactual rollouts are expensive. Limit horizon to 5–10 steps and use deterministic physics to keep runtime low for a part-time schedule.
  *   **Math Complexity:** Avoid full attractor basin analysis (too hard for discrete grids). Use trajectory divergence as a proxy. This is a valid approximation for a proof-of-concept.
  *   **Risk:** The biggest risk is that "physical parameters" themselves are value-laden (e.g., choosing to track position but not color). The final report must explicitly discuss this ontology limitation.

  **7. Deliverables**
  *   A GitHub repository with the Gridworld environment and the two penalty implementations.
  *   A 5-page report detailing the "Value Smuggling" analysis in the setup phase.
  *   A binary conclusion on the Research Question based on the stress tests.
