  hey so im not in academia or anything, just been thinking about AI safety stuff on my own and reading random papers. there's this problem in low-impact AI about avoiding side effects, but every time i look at it people seem to need a full list of values first before they can even say whats a side effect. i got this half-baked idea that maybe you can flip it: instead of defining harm by values, define it by whether the agents actions make the worlds dynamics leave their original attractor basin when you counterfactually remove teh agent. like, check counterfactual dynamical stability across a causal boundary. so i want a short research proposal—maybe for a workshop pitch or a one-semester project—asking precisely: can avoid-side-effects be formalized purely through counterfactual dynamical stability and information-flow closure, with zero value specification? please state the question so it has a definite answer, explain why teh usual reachability and penalty-function approaches still smuggle values in through boundary choices, then lay out the actual method: compare a causal-closure model vs an information-flow boundary model on toy environments, see if either can run without hidden value inputs. say why that comparison is better than just surveying the literature. also tell me what success looks like—maybe a working criterion that doesnt collapse when values are unspecified—and what failure looks like, like if every boundary choice secretly encodes a preference. keep scope real for 8-10 weeks part-time. no citations or bibliography needed, ill fill those in later. also sorry for the typos lol.
