      *Drafting content:*
      Dennett's framework treats the grades as evolutionary layers where each new mechanism embeds and relies upon the previous ones. A Gregorian mind uses cultural tools to enhance its internal simulation, but without the Popperian ability to run simulations—to let hypotheses die in its stead—those tools cannot be deployed flexibly. If the Tychoan creature cannot test candidate actions internally, it cannot use a map to plan a route; it can only react to the map as a physical object, collapsing it back into a Skinnerian creature conditioned by cultural artifacts rather than a Gregorian creature wielding them. Therefore, the grades are best read as a ladder of increasing foresight achieved by shifting the locus of trial-and-error outward: from genes to environment to internal model to cultural ecosystem. This implies that having a mind, in Dennett's sense, is identical to hosting the locus of trial-and-error; a entity that cannot generate or test its own variations is not a mind but a vessel, possessing competence without comprehension and executing scripts written by others rather than authoring its own future.

