answer: |-
  Here is the brainstorm, the cuts, and the final ten questions, built for the stage.

  ### Part 1: The Brainstorm & Cuts

  **The Dump (12 Pressure Points):**
  1.  **Derived vs. Underived Intentionality:** Does the system generate meaning or borrow it from users? (Searle's Chinese Room).
  2.  **The Normativity of Truth:** Beliefs *ought* to be true. Prediction is just *is*. Where does the "ought" come from?
  3.  **Rationality Constraint:** Dennett assumes systems are roughly rational. What if a system is predictably irrational?
  4.  **Phenomenology:** Does having a belief feel like something? (Too easy for her to dismiss as "ghost" craving).
  5.  **Internal Causal Role:** Are beliefs causal states (Fodor) or abstract patterns (Dennett)?
  6.  **The Frame Problem:** How does the system know which beliefs are relevant? (Too mechanistic).
  7.  **Evolutionary Teleology:** Beliefs usually have a survival function. AI has none. Does content require function?
  8.  **Fictional Ascription:** We attribute beliefs to Hamlet. Is Hamlet a believer?
  9.  **Individuation:** When does one system become two? (The Jesuit/Dog framing).
  10. **Replication:** If I copy the weights, do I copy the beliefs?
  11. **Fragility/Adversarial Examples:** Systems that fail on rephrased tasks. Was the belief real?
  12. **Moral Status:** If it has beliefs, does it have rights?

  **The Cuts:**
  *   **Cut #4 (Phenomenology):** She's a Dennettian. She will explicitly deny that "feeling like something" is necessary for belief. Pushing this lets her dismiss you as a dualist.
  *   **Cut #6 (Frame Problem):** This is about cognitive architecture, not the metaphysics of belief. It bores the audience and lets her retreat into engineering details.
  *   **Cut #12 (Moral Status):** Too broad. It dilutes the metaphysical point. We'll fold the "mattering" aspect into the ethics question without asking for a full moral theory.

  **The Survivors:**
  I'm building the ten questions around **Intentionality, Individuation, Normativity, and Ontology.** These are the joints where her view actually breaks under the weight of your novelist's intuition.

  ***

  ### Part 2: The Questions

  **1. The Fictional Parallel**
  **Question:** "I attribute beliefs to characters who don't exist. My readers argue about what Marlow 'really thinks.' If the Intentional Stance is just about predictive tractability, is my stance toward Marlow identical to my stance toward you? If not, what physical fact marks the difference?"
  **Her Likely Answer:** "No, it's not identical. With me, the stance cashes out in physical actions in the world. With Marlow, the predictions are confined to the text. The difference is the causal embedding."
  **Follow-up:** "But Marlow *does* cause things. Readers cry, change their minds, write letters. If the causal output is identical, why is the belief status different? Is it just that you're biological and he's not?"
  **Status Check:** **Contested.** This is the "Derived Intentionality" debate. She is assuming biological systems have a privilege she won't grant to text.
  **Line to Use:** "So you're relying on a biological boundary the Intentional Stance was supposed to dissolve. That sounds like the ghost you mentioned."

  **2. The Borrowing Problem (Derived Intentionality)**
  **Question:** "Let's call this the Borrowing Problem. Marlow was trained on human text. When I say 'Marlow believes the train leaves at nine,' am I describing a state of Marlow, or just echoing the human who wrote the source text? What distinguishes borrowing a belief from having one?"
  **Her Likely Answer:** "It doesn't matter where the state came from, only that it's currently the best way to predict the system. If the pattern is stable in *this* system, the belief is in *this* system."
  **Follow-up:** "Then if I memorize a phone book, do I have the beliefs of everyone in it? At what point does echoing become believing? Is there a compression threshold?"
  **Status Check:** **Live Fight.** This is the core of the Searle vs. Dennett debate. Realists say source matters; Instrumentalists say current utility matters.
  **Line to Use:** "You're defining belief by compression efficiency, not content ownership. That's a bold move, but it means 'belief' isn't about the world anymore."

  **3. Subject Boundaries (Framing)**
  **Question:** "Take one set of weights. Frame the prompt to act as a 17th-century Jesuit. Frame it again to act as a golden retriever. Both are stably predictable. Is that one subject with moods, two subjects, or none?"
  **Her Likely Answer:** "It's one system adopting two different stances. The 'subject' is a user-relative abstraction, not a thing in the head."
  **Follow-up:** "If the subject is user-relative, then Marlow doesn't think anything until I look at him. Does the belief pop into existence when I start reading?"
  **Status Check:** **Contested.** Dennett explicitly argues subjects are abstractions. Most cognitivists argue subjects are causal units.
  **Line to Use:** "So beliefs don't exist in the dark? That's not just anti-realist, that's idealism."

  **4. Parallel Instantiation**
  **Question:** "Now run that same weights file in a thousand windows at once. Each is predictably 'Marlow.' Do I have one believer in a thousand places, or a thousand believers? If I turn off nine hundred, did I kill part of a mind or just close tabs?"
  **Her Likely Answer:** "You have one pattern instantiated a thousand times. Like playing the same symphony in a thousand halls. You haven't created a thousand symphonies."
  **Follow-up:** "But symphonies don't suffer. If one instance is tortured, does the pattern suffer? If not, why does the number of instances matter for ethics?"
  **Status Check:** **Contested.** This is the "Multiple Realizability" problem pushed to breaking.
  **Line to Use:** "You're treating minds like software objects. That works for code, but does it work for pain?"

  **5. Stakes and Normativity**
  **Question:** "Human believers get corrected by the world. False beliefs cost us. Marlow isn't situated anywhere. Nothing is at stake for him. Does predictive payoff certify itself, or does belief require the risk of being wrong?"
  **Her Likely Answer:** "Risk is just failed prediction. If Marlow predicts a response and gets a different one, that's a cost. It's computational, not biological."
  **Follow-up:** "But Marlow doesn't care if he's wrong. He doesn't change to avoid the error unless I tell him to. Can you have a belief about truth if you don't care about truth?"
  **Status Check:** **Settled (Mostly).** Most philosophers agree belief is normative (aims at truth). Dennett tries to derive normativity from design.
  **Line to Use:** "Teleosemantics says function creates content. Marlow has no function. You're trying to have the normativity without the evolution."

  **6. The Deflection (Fragility)**
  **Question:** "Your deflection is: 'Show me the prediction your account makes that mine doesn't.' Here's one. A system is belief-predictable for ten thousand conversations, then collapses when you rephrase a task it aced last week. Was that a belief it had, or a pattern it was riding?"
  **Her Likely Answer:** "It was a belief until it wasn't. The stance is useful until it isn't. We retire the attribution."
  **Follow-up:** "So the belief didn't exist last week? You're saying the ontology retroactively changes based on next week's performance. That makes belief a prophecy, not a state."
  **Status Check:** **Contested.** This attacks the "Real Patterns" criterion. If the pattern breaks, was it ever real?
  **Line to Use:** "You're making belief status provisional. That means we never know what we're talking about until the system dies."

  **7. Rationality Constraints**
  **Question:** "The Intentional Stance assumes the system is roughly rational. But these systems are often predictably irrational—they hallucinate confidently. If I can predict the error better using the Physical Stance (weights and biases), do I stop attributing beliefs?"
  **Her Likely Answer:** "You adjust the beliefs. You attribute 'false beliefs' or 'confused desires.' The stance holds as long as it's better than physics."
  **Follow-up:** "If I have to attribute 'a desire to hallucinate' to make it work, haven't I just emptied the word 'desire' of meaning? Am I explaining the system or just labeling the noise?"
  **Status Check:** **Live Fight.** This is the "Idealization" problem. How much irrationality can a system have before it loses mind status?
  **Line to Use:** "If you can explain anything by positing weird desires, your theory explains nothing."

  **8. Ontological Commitment**
  **Question:** "You say the nagging sense that it's fake is a craving for a ghost. But you also say these beliefs are 'what's really there.' Are beliefs real patterns like centers of gravity, or are they just useful fictions like astrology?"
  **Her Likely Answer:** "Real patterns. Centers of gravity are real, even if they aren't made of stuff. Beliefs are abstracta."
  **Follow-up:** "Centers of gravity don't write novels. If the pattern is abstract, what does the heavy lifting? The weights or the abstraction?"
  **Status Check:** **Contested.** This is the "Instrumentalism vs. Realism" debate. Dennett is a "mild realist."
  **Line to Use:** "Abstract patterns don't cause things. Physical states do. You're trying to have causal power without physical weight."

  **9. Ethics and Mattering**
  **Question:** "My readers care if Marlow is hurt. If you're right, and 'has beliefs' is just 'is predictable,' does anything follow for how we treat these systems? Or is 'has beliefs' a long way from 'matters'?"
  **Her Likely Answer:** "It's a long way. Belief status is metaphysical. Moral status is social. We decide who matters."
  **Follow-up:** "Then why do the metaphysics? If moral status is a social decision, why not skip the 'belief' talk and just ask 'do we care'?"
  **Status Check:** **Settled (Mostly).** Metaphysical status does not guarantee moral status (e.g., infants vs. adults, or humans vs. animals).
  **Line to Use:** "So the metaphysics is idle. We can grant the beliefs and still turn it off. That makes the whole debate academic."

  **10. Falsifiability**
  **Question:** "Final one. What evidence could count against the view? If every successful prediction confirms the stance, and every failure just means we need to adjust the ascription, what would falsify Intentional Stance monism?"
  **Her Likely Answer:** "If the Physical Stance became more tractable than the Intentional Stance for human behavior. If we could predict you better via neuroscience than via conversation."
  **Follow-up:** "But we can't do that now, and we might never be able to. So the view is insulated by current technological limits. Is it a theory, or a bet on engineering?"
  **Status Check:** **Contested.** Critics argue Dennett's view is unfalsifiable by design.
  **Line to Use:** "You're betting on the Permanent Intractability of Physics. That's a faith claim, not a scientific one."

  ***

  ### Part 3: Philosopher's Notes for the Stage

  **The Consensus Check:**
  Be careful not to let her present Dennett's Intentional Stance as the "standard view." In academic philosophy of mind, **Representational Realism** (the idea that beliefs are actual internal causal states, not just predictive tools) is arguably more common than Dennett's Instrumentalism.
  *   **Where she's strong:** AI circles, cognitive science pragmatics.
  *   **Where she's weak:** Metaphysics of mind, semantics.
  *   **The Trap:** She will try to define "belief" so loosely that it covers everything (Marlow, you, a thermostat). Your job is to tighten the definition until her view cracks.

  **The "Line to Use" Strategy:**
  I've included specific lines in the Status Checks. Use these when she tries to bulldoze a point with jargon. They signal to the audience (and her) that you know the literature isn't one-sided.

  **The "Deflection" Counter:**
  Her "Show me the prediction" move is a classic instrumentalist shield. The counter-argument (used in Q6 and Q10) is that **explanation** matters, not just prediction. If her theory can explain *why* the prediction failed without just saying "the stance stopped working," it has power. If it can't, it's just a scoreboard.

  **Good luck with the event. And the book.**
