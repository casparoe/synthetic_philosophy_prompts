answer: |-
  As a funder in 1966, I am choosing between continuing the flagship Malaria Eradication Programme (MEP) or launching the Intensified Smallpox Eradication Programme (ISEP). Here is how the Importance, Tractability, Neglectedness (ITN) framework scores them ex-ante, and where it breaks.

  **The Scores (1966 View)**

  *   **Importance:** Malaria likely wins on raw annual burden. It causes more morbidity and economic drag than smallpox's two million annual deaths. However, smallpox offers a "one-shot" value: permanent zero burden. Standard ITN metrics calculate cost-per-life-year saved annually. Unless I manually add a terminal value for eradication, ITN treats smallpox as a flow problem, systematically undervaluing the infinity stream of future lives saved.
  *   **Tractability:** Malaria wins on existing technology. DDT and mass spraying were known tools, even if failing. Smallpox had a vaccine, but the mass-vaccination strategy was failing. The winning strategy—surveillance and containment—was unproven at scale. ITN scores tractability based on available interventions. Since the *right* intervention for smallpox didn't fully exist yet, ITN rates its tractability as low. This biases the framework toward causes with existing tools, even if those tools are ineffective.
  *   **Neglectedness:** Smallpox wins. Malaria had the money and staff. Smallpox was underfunded. However, the framework misreads *why*. Smallpox wasn't neglected because funders missed its value; it was neglected because rich nations wanted to stop paying for routine vaccination and quarantine. ITN treats neglect as "opportunity left on table." Here, it was a coordination problem and strategic free-riding. The framework sees a funding gap and signals opportunity, but doesn't flag the political阻力 (resistance) causing it.

  **The Framework's Blind Spots**

  Your four critiques highlight where ITN is silently mis-specified in this case.

  First, **flow vs. one-shot.** ITN is built for marginal improvements in ongoing causes. It struggles to price "closure." Unless I adjust the importance calculation to account for the permanent elimination of future risk, the framework prefers the larger annual burden (malaria) over the solvable permanent threat (smallpox). It lacks a native "eradication bonus."

  Second, **cause vs. method.** ITN asks "how solvable is this cause?" but answers using "how good are current tools?" In 1966, smallpox looked intractable because the standard method (mass vaccination) was failing. The framework penalizes causes requiring strategic innovation. It would have pushed me toward malaria because the hammer existed, even if it was the wrong nail. ITN is biased against R&D on delivery mechanisms.

  Third, **motives for neglect.** ITN assumes neglectedness implies diminishing returns haven't set in. But smallpox was neglected due to donor fatigue and self-interest, not ignorance. The framework doesn't distinguish between "overlooked gem" and "hot potato." If I follow the neglectedness signal, I might invest in smallpox, but ITN doesn't warn me that other funders have active incentives *not* to solve this.

  Fourth, **capacity and option value.** The smallpox programme built surveillance networks and field epidemiology capacity used for later campaigns. ITN has no slot for "infrastructure legacy." This value is an externality. If I score strictly on smallpox cases averted, I miss the spillover value that makes the investment more efficient than it looks. Where does this go? Nowhere. It is silent.

  **The Verdict**

  Does ITN pick the right cause? Ex-ante, probably not. Between higher annual burden (Malaria), known tools (Malaria), and ambiguous neglect motives (Smallpox), the framework likely favors continuing the malaria effort. It only picks smallpox if I heavily overweight neglectedness or manually adjust importance for eradication potential. This confirms your suspicion: without manual tweaking, ITN favors incrementalism over transformation.

  **The Survivorship Worry**

  Finally, we must address why this test feels convincing. We are evaluating ITN against a known winner. If the 1967 intensified programme had failed like malaria, we wouldn't be using it to test the framework. Ex-ante, the smallpox gamble was risky. The surveillance-containment strategy could have collapsed. If it had, ITN proponents would say, "See? Tractability was low."

  We are retrofitting the "eradication bonus" because we know the outcome. A robust framework must work when the cause fails. ITN's silence on strategic innovation and capacity building means it would have looked equally reasonable backing the losing horse. We hold smallpox up as a poster child because it won, not because the framework clearly predicted it. The framework didn't find the opportunity; the opportunity found the framework after the fact.
