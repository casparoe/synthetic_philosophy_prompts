  *Vergangenheitsbewältigung* ultimately distorts *Beloved* by imposing a therapeutic telos of resolution on a trauma that demands permanent inhabitation. The framework bites where it illuminates the communal exorcism at 124 as a parallel to public memorialization, suggesting trauma requires collective, not just individual, management. To teach this, assign Sethe's explanation of "rememory" to Denver, the women's chanting outside 124, and the final refrain "This is not a story to pass on."

  However, the novel resists the framework's core assumption that consciousness equals survival. First, consider the ending: the women driving Beloved out and the injunction against passing the story on look like repression on the German picture, but within the novel, this silence is owed to survivors. The framework lacks resources to distinguish pathological denial from protective silence, smuggling in the assumption that more remembering is always better. Morrison suggests some memories are too destructive to circulate. Second, consider the asymmetry: *Vergangenheitsbewältigung* centers the perpetrator nation's conscience. *Beloved* exposes the burden when the harmed must remember alone because the harmers (the South) do not. Comparative literature should organize around this asymmetry of memory labor, not the perpetrator's internal struggle. In Germany, Japan, and Turkey, the debate concerns the state's acknowledgment; here, the state is absent, and the victim bears the entire weight of memory.

  Consequently, the novel adds what these national cases omit: the ontology of trauma. While those cases debate national narrative or state denial, *Beloved* suggests the past is a physical hazard lodged in place, independent of the subject. It shifts the goal from "working through" to "living alongside," challenging the comparative field to account for memories that do not belong to anyone but must be survived by everyone. This reorients the seminar from the politics of acknowledgment to the metaphysics of survival, forcing a reckoning with memories that cannot be worked through, only endured.
