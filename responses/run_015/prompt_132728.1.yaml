  **Guidance Note 4: Determining Whether a Procedure Is Sub-Threshold**
  1. Intensity and duration are multiplied to yield Gross Suffering Units (GSU).
  2. If GSU ≥ 700, the procedure is supra-threshold. No offset permitted.
  3. If GSU < 700, offsets apply per Schedule B.
  4. Scale selection is at the Committee's discretion. Investigator-provided scales are advisory only.
  5. Aggregation across persons is permitted below the threshold; aggregation across thresholds is forbidden.
  6. In cases of uncertainty regarding intensity, the higher estimate shall prevail unless contradicted by calibrated instrumentation.
  7. The Offset Schedule includes warm beverages, modest entertainment, and monetary stipends calibrated to utility equivalents.
  8. Consent forms must acknowledge the Committee's right to re-score pain metrics.
  9. The threshold value (700) is subject to annual review but remains binding until amended.
  10. Procedures resulting in cumulative GSU approaching 690 require additional oversight.

  The Committee closes by reaffirming the Committee's framework. All future applications must adhere to the Lexical Threshold Framework as currently constituted. Deviations will result in automatic referral to the Full Board.
