answer: |-
  **Project Title:** The Differential Glyph: Relational Identity in Letterform Recognition

  **The Question**
  What determines the identity of a letterform? The dominant view (the **Feature Account**) holds that a glyph is an 'a' because it possesses intrinsic geometric properties—a specific configuration of bowls, stems, and counters. This view underpinned the *Letter Spirit* project, which struggled to define how a program could generate twenty-six distinct shapes that nonetheless felt like one font. If identity is intrinsic, style is merely a surface decoration applied to stable archetypes.

  This project proposes a competing **System Account**: a glyph is an 'a' primarily because of its differential position within a specific alphabet. On this view, 'a'-ness is not a fixed shape but a structural role defined by how the glyph differs from that font's 'o', 'd', 'g', and 'e'. If this is true, the *Letter Spirit* bottleneck occurred because the project searched for a shared intrinsic "style" rather than a coherent system of differences.

  **Competing Predictions**
  These accounts make divergent predictions regarding glyph swapping.
  *   **Feature Account Prediction:** If a shape typically recognized as 'a' is assigned the role of 'e', reading will fail or stall immediately. The intrinsic features clash with the learned category; context cannot override the shape.
  *   **System Account Prediction:** If the *relationships* between glyphs are preserved (i.e., the new 'e' is still distinct from the new 'a', 'o', etc. in the same ways the originals were), fluent readers will experience initial friction but can adapt. The shape is legible because it occupies the correct structural slot, not because it matches a prototype.

  **Methodology (3 Months, Part-Time)**
  *Month 1: Stimulus Construction.* I will design a "Swapped Font" based on a standard geometric sans-serif. I will systematically exchange the shapes of minimal pairs (specifically 'a'/'e' and 'n'/'u') while strictly maintaining the differential distances between them (e.g., ensuring the new 'a' remains as distinct from the new 'o' as the original 'a' was).

  *Month 2: The Swap Test & Con-Script Analysis.*
  1.  **Informal Validation:** I will present the Swapped Font to a small group of fluent readers (colleagues/peers, exempt from formal data collection protocols). The task is not speed-reading, but phenomenological reporting: Does the text feel "broken," or merely "strange"? Does the error feel like a shape mismatch (Feature) or a contextual clash (System)?
  2.  **Constructed Script Case Study:** I will analyze existing orthographies for constructed languages (con-scripts) where no fluency exists. In these systems, learners must acquire letter identity solely from the system's internal logic. I will examine documentation where learners confuse glyphs to see if errors correlate with feature similarity (Feature) or structural ambiguity within the set (System).

  *Month 3: Synthesis.* I will draft a paper arguing that typographic style is a system of constraints rather than a set of shared features, using the swap test results and con-script analysis to delineate the limits of the System Account.

  **Outcomes and Failure Conditions**
  *   **Positive Result:** Evidence that readers can parse the Swapped Font after brief exposure, provided the internal contrasts remain high. This would suggest letter recognition is more plastic and context-dependent than current models assume, offering a new path for algorithmic font generation.
  *   **Failure:** If readers cannot process the swapped glyphs even with context, or if con-script confusion patterns track strictly with geometric similarity regardless of system rules, the Feature Account stands. This is a valuable negative result: it confirms that intrinsic features are the hard constraint, and the *Letter Spirit* problem requires a different solution.

  **Feasibility and Risks**
  This project is aggressive for three months part-time. The primary risk is that the "Swap Test" yields ambiguous results—readers may struggle for reasons unrelated to letter identity (e.g., general aesthetic discomfort). To mitigate this, I will limit the scope to a single font family and two glyph swaps. Furthermore, while this involves human feedback, it is framed as informal design validation rather than empirical data collection to fit grant constraints. If the informal testing suggests a deeper cognitive block, I will pivot Month 3 to a purely theoretical analysis of the con-script data, ensuring a deliverable is met even if the pilot is inconclusive.
