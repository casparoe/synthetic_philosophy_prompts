  Lena wiped the coolant off the lathe's chuck, her eyes fixed on the white chalk mark she'd drawn on the spindle. "You're asking if I know it's safe to touch," she said, not looking up. "I know it isn't spinning at cutting speed. That's proposition q. But proposition p—that it's completely halted—I don't know that. The brake has a creep; it might be turning one degree every minute. My eyes can't catch that. So I believe p, and it's false in those creep worlds, meaning I don't track p. But if it were spinning fast enough to sever a finger—worlds where q is false—the mark would blur, I'd see it, and I wouldn't believe it was safe. So I track q. I derive q from p because if it's stopped, it's certainly not cutting speed. But the knowledge sticks to the entailment, not the premise. I know the consequence because the error conditions for the consequence are loud enough to hear, while the error conditions for the premise are quiet enough to miss."

  **Verdict and Analysis**

  **Belief $p$ ("The spindle is halted"):**
  *   **Method:** Direct visual observation of the chalk mark.
  *   **Nearby Worlds:** The nearest $\neg p$ worlds are "creep" worlds where the spindle rotates imperceptibly slowly.
  *   **Tracking Result:** In these creep worlds, the mark appears static, so Lena still believes $p$. Sensitivity fails ($\neg p \rightarrow Bp$). She does not know $p$.

  **Belief $q$ ("The spindle is not at cutting speed"):**
  *   **Method:** Inference from $p$ (via deduction: halted $\rightarrow$ not cutting speed).
  *   **Nearby Worlds:** The nearest $\neg q$ worlds are "surge" worlds where the spindle spins rapidly (entailing $\neg p$).
  *   **Tracking Result:** In these surge worlds, the mark blurs, Lena sees motion, rejects $p$, and thus does not infer $q$. Sensitivity holds ($\neg q \rightarrow \neg Bq$). She knows $q$.

  **Structural Feature:**
  The modal robustness of $q$ arises from the **buffer zone** of worlds where $p$ is false but $q$ is true (the creep). Because $q$ is logically weaker than $p$, the nearest $\neg q$ worlds are modally further away than the nearest $\neg p$ worlds. The direct observation method fails at the closer boundary (creep) but succeeds at the further boundary (surge). Since the inference method for $q$ relies on the observation method's output, $q$ inherits the success at the further boundary while ignoring the failure at the closer boundary (because the closer boundary worlds are $q$-worlds, they do not test $q$'s sensitivity).

  **Removing the Feature:**
  If you remove the buffer zone—for instance, if any movement constitutes a cutting speed danger, making $p$ and $q$ equivalent in truth conditions—the nearest $\neg p$ and $\neg q$ worlds coincide. In that case, the method's failure to detect $\neg p$ becomes a failure to detect $\neg q$. Both beliefs become insensitive. The case does not collapse into the *standard* closure-failure pattern (Know $p$, Fail $q$); instead, it collapses into a **total knowledge failure** (Fail $p$, Fail $q$). The reverse anomaly disappears because the modal gap required to separate the sensitivity conditions is gone.

  **Tracking-Theorist Objection:**
  A defender of tracking theory would likely attack the **individuation of the method**. They might argue that the method for $q$ is not merely "Inference from $p$" but a composite "Visual Safety Check." They could claim that if the agent cannot distinguish the creep worlds from the actual world, the method is too coarse to support *any* knowledge claim requiring that distinction, potentially arguing that $q$ is not known because the agent cannot rule out the creep worlds which are relevant to the *safety* context, even if not to the truth of $q$. Alternatively, they might argue that closure is not violated because the antecedent of the closure principle ($Kp$) is false, so the principle holds vacuously; the weirdness is not a logical failure but an epistemic one regarding knowledge generation from unknown premises.

  \answer{This reverse case does not save closure for tracking theory but rather demonstrates that tracking permits knowledge to be acquired through deduction from unknown premises, breaking the intuitive link between premise and conclusion in the opposite direction of the standard skeptical problem.}
