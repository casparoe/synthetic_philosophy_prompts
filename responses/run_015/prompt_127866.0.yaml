answer: |-
  **Question 1**
  Your book argues for a third category: the quantum state is a law, not a thing and not information. For listeners grounded in the standard ψ-ontic versus ψ-epistemic debate, what is the single most important conceptual shift they need to make to see this not as a compromise, but as a distinct metaphysical category?

  *Likely Reply:* They need to stop assuming every element of the formalism must correspond to a material object or a mental state; laws are sui generis, governing structures that constrain events without being events themselves.
  *Follow-up:* So if I understand, you're saying the quantum state is more like the rulebook of a game than the pieces on the board?

  **Question 2**
  You treat the Pusey–Barrett–Rudolph theorem as targeting models with hidden variables, which you reject, so you claim the theorem doesn't touch your view. But if removing the hidden-variable space is the only thing that exempts you from the dilemma, is that a substantive physical commitment or just a definitional shield?

  *Likely Reply:* It's substantive because positing a hidden-variable space imposes separability assumptions that conflict with quantum phenomena; removing it changes the physical model, not just the label.
  *Follow-up:* But if the only thing distinguishing your "law" from a ψ-ontic state is the absence of those hidden variables, haven't you just accepted the ψ-ontic burden without the ontic space to put it in?

  **Question 3**
  Your rule assigns probabilities using amplitudes over configuration space, not ordinary space. If that high-dimensional structure is exactly what makes the rule predictively adequate, in what sense is it merely representational, and what would your view have to give up if you conceded that structure is physically real?

  *Likely Reply:* The structure is real as a law is real, but not as a substance is real; conceding it is physically real in the substance sense would force me to accept a multi-dimensional ontology I reject.
  *Follow-up:* But if the geometry of that space dictates physical outcomes, how is "governing" any different from "constituting" the physical facts?

  **Question 4**
  Laws are typically time-independent, like the Hamiltonian, but quantum states evolve. Is the law on your view the entire history of the state at once, or does the law itself change over time?

  *Likely Reply:* The law is the universal state trajectory as a whole; what evolves is the effective state of subsystems, derived by conditioning on the environment.
  *Follow-up:* If the law is the whole history, how do we use it to predict the future now, without already knowing the history it's supposed to govern?

  **Question 5**
  You say the universal state is the law, but lab states are derived by conditioning. When I condition on an environment to get a subsystem state, doesn't that look exactly like updating information, leaving you nomological at the cosmic scale but epistemic in the lab?

  *Likely Reply:* It looks epistemic because it's relative to a context, but it's still a objective constraint derived from the universal law, not a subjective belief.
  *Follow-up:* If the lab state is objective but derived, why isn't the universal state just the objective total information, bringing you back to the ψ-epistemic side you wanted to escape?

  **Question 6**
  Let's walk through a single particle in an interferometer with widely separated arms. Between preparation and detection, what exists in the arms on your view, and what determinate outcome is the rule a rule for if there are no ontic states carrying the propensity?

  *Likely Reply:* Only the events exist at the endpoints; in between, there is nothing but the law constraining which endpoints can co-occur.
  *Follow-up:* So the particle doesn't go through the arms, but the law does? If the law bridges the gap, isn't it doing the work a physical field usually does?

  **Question 7**
  Your rule assigns joint probabilities to spacelike-separated events that depend on settings chosen on both sides. What have you gained over the ψ-ontic view that says the same thing while positing a non-separable physical state?

  *Likely Reply:* I avoid saying physical influences travel at a distance; laws don't act at a distance, they govern holistically.
  *Follow-up:* Please tell me the explanatory difference: if the outcome here depends on the setting there via your law, how is that empirically or metaphysically distinct from a non-separable state acting holistically?

  **Question 8**
  The attraction of ψ-epistemicism was that collapse becomes updating information. You can't call it updating since it's no one's information, but laws don't change. So what happens on measurement, and where do the determinate outcomes come from?

  *Likely Reply:* Outcomes are primitive events; the law assigns probabilities to them, but the occurrence itself is not determined by the law, only constrained.
  *Follow-up:* If the law doesn't determine the outcome, haven't you relocated the measurement problem to the origin of the events rather than solving it?

  **Question 9**
  State your criterion for what counts as real, then apply it to the spacetime metric and the electromagnetic potentials. If those are real, why is the quantum state excluded, and what evidence could count against your view?

  *Likely Reply:* The metric is real as a structural feature of spacetime, potentials are representational; the quantum state is nomological. Empirical deviation from Born rules would count against it.
  *Follow-up:* If the quantum state structures spacetime events exactly as the metric structures geometry, why is one a substance and the other a law, and if Born rules hold, is your view unfalsifiable?

  ***

  **Host's Note**

  I'm betting this is ψ-ontism in disguise. The 'law' does all the causal work of a physical field but claims immunity from ontological scrutiny by wearing a normative label. My strongest question is number seven on Bell correlations: if the law fixes joint probabilities across spacelike separation, the distinction between 'governing holistically' and 'being a non-separable object' buys you no explanatory peace. It's a verbal shield, not a metaphysical gap. The 'laws don't act' defense sounds like a category trick to avoid nonlocality charges. However, I'd change my mind if she can articulate a criterion of reality that admits the spacetime metric but excludes the wavefunction without collapsing into instrumentalism. If 'governing' implies a structural role distinct from 'constituting,' she might have identified a genuine category error on my part. But until then, filing off the serial numbers doesn't change the engine. I'll press hardest on whether her 'events' can exist without the 'law' determining them.
