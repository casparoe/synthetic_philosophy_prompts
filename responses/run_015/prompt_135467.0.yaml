  Good evening, everyone. For those of you who don't know me, I'm [Your Name], and I've had the privilege of being [Bride]'s friend for [Number] years.

  Now, usually, this is the part of the speech where I talk about how [Groom] finally put a ring on it. But as many of you know, [Bride] and [Groom] have actually been a team for eight years. They've shared rent, bills, holidays, and life. So, when people ask, "Why get married now?" the honest answer is: mostly for the visa.

  I can see some of the traditionalists in the room blinking. And I can see the philosophers in the back row sharpening their pencils, waiting to see if I'm going to embarrass [Bride] by misquoting her life's work.

  Because [Bride] isn't just a philosopher; she is a specialist on Bertrand Russell. Specifically, his book *Marriage and Morals*. Now, if you ask the older generation about Russell, you might hear he was a scandalous atheist who wanted to burn down the family home. If you ask the academics, you'll hear he was a rigorous analyst of social structures. The truth, as [Bride] knows better than anyone, is somewhere in the middle.

  Russell wasn't against marriage. He was against the idea that marriage should be a property contract disguised as a holy vow. He argued that for centuries, marriage was about economics, inheritance, and social control. It was about ownership. But he believed the future of marriage belonged to what he called the "companionate" partnership. A union built not on legal coercion or property rights, but on sexual equality, honest feeling, and the free choice of two people to build a life together.

  When I look at [Bride] and [Groom], I see Russell's ideal in action. They didn't need a piece of paper to tell them they were committed. They didn't need the state to validate their love before they built a home. They spent eight years choosing each other, day after day, without the legal handcuffs.

  Russell wrote that jealousy is usually a product of an ownership mentality, not a product of love. He believed that if you truly love someone, you don't want to possess them like a piece of property; you want to witness their life and walk beside them.

  I think that explains why this couple is so solid. There is no sense of ownership between them. There is only partnership. [Groom] never tried to own [Bride], and [Bride] never tried to tame [Groom]. They have respected each other's autonomy so deeply that when they finally decided to sign the legal contract this weekend, it wasn't because they were afraid of losing each other. It was because they wanted to protect the life they've already built.

  To the family members here who might worry that a "visa marriage" sounds less serious: I would argue the opposite. A marriage based solely on tradition is often a leap of faith into the unknown. A marriage based on eight years of cohabitation, honesty, and deliberate choice is a structure built on bedrock. They aren't getting married to *start* a commitment; they are getting married to *formalize* a commitment that has already survived the test of time.

  [Bride] spent years analyzing Russell's distinction between the legal contract and the human bond. Today, they are signing the contract. But the bond? That's been signed and sealed since day one.

  So, I'd like to propose a toast.

  To [Bride] and [Groom]. May your legal partnership be as strong as your companionate one. May you never confuse ownership with love. And may you always remember that while the visa brought you to the altar, it is the friendship that will keep you there.

  To the happy couple.
