  1.  **Analyze the Request:**
      *   **Source Material:** A friend's summary of Stevan Harnad's Symbol Grounding Problem (SGP) and its relation to John Searle's Chinese Room Argument (CRA).
      *   **Friend's Claim:** SGP is just CRA repackaged. Both show syntax $\neq$ semantics. Symbols lack intrinsic meaning (parasitic on users). Conclusion: Pure symbol manipulation $\neq$ understanding, therefore we need connectionism.
