  ### Preamble for Coders

  This manual helps you record how passages *describe* causes, not whether those causes are historically true. You will fill two fields: **Causal Structure** (how the passage links factors to the flood) and **Causal Selection** (which factor the passage calls *the* cause). Use the decision tree below to classify the passage's logic. Every question refers to one of the six Calibration Cases (A–F) in your training file. If a passage matches the logic of a Case, follow that branch. You may assign different codes to Structure and Selection if the passage distingu them. If a factor is named but changed nothing, see the "Frame-Setting" instruction in the Leaves section.

  ### Decision Tree Nodes

  1.  **Case D (Omission Type):** Is the alleged cause an action taken (like the charges) or a failure to act (like the watchman's sleep)?
      *   *If Failure:* Go to Node 2.
      *   *If Action:* Go to Node 3.

  2.  **Case D (Omission Status):** Does the passage treat this failure as a cause equal to an action, or as background context?
      *   *Equal to Action:* Go to Node 3.
      *   *Background/Inert:* Mark **Leaf 1**.

  3.  **Case E vs. A (Difference-Making):** If this factor were removed, does the passage say the outcome would have changed (like the charges) or remained the same (like the petition)?
      *   *Outcome Changed:* Go to Node 5.
      *   *Outcome Same:* Go to Node 4.

  4.  **Case B (Process Connection):** Even if the outcome wouldn't change, does the passage trace a physical connection from this factor to the breach (like the backup charge)?
      *   *Yes, Connection Traced:* Mark **Leaf 2**.
      *   *No, No Connection:* Mark **Leaf 3**.

  5.  **Case A (Overdetermination):** Are there multiple factors present, each sufficient on its own to cause the breach (like the two charges)?
      *   *Yes, Multiple Sufficient:* Go to Node 6.
      *   *No, Single or Joint:* Go to Node 7.

  6.  **Case F (Descriptive Grain):** Does the passage distinguish these factors by exact time or place to make them separate causes (like the fine-grain report)?
      *   *Yes, Distinguished:* Mark **Leaf 4**.
      *   *No, Treated as Same:* Go to Node 9.

  7.  **Case C (Conjunctive Parts):** Are the factors parts of a set where none work alone (like the gate, water, and masonry)?
      *   *Yes, Parts of a Set:* Mark **Leaf 5**.
      *   *No, Independent:* Go to Node 8.

  8.  **Case C (Contrast Class):** Does the passage pick one cause by comparing it to a specific alternative scenario (like blaming the gate rather than the water)?
      *   *Yes, Specific Contrast:* Mark **Leaf 6**.
      *   *No, General Claim:* Go to Node 9.

  9.  **Case E (Narrative Selection):** Does the passage admit the choice of cause depends on the story being told rather than physical facts?
      *   *Yes, Story-Dependent:* Mark **Leaf 7**.
      *   *No, Fact-Dependent:* Mark **Leaf 3**.

  ### Leaves: Position Definitions

  **Leaf 1: The Omission-Inert View**
  *   **Statement:** Absences cannot push physical objects, so failures to act are not causes.
  *   **Awkward Commitment:** Negligence like the watchman's sleep cannot be blamed for the flood.
  *   **Pressing Case:** Case D.
  *   **Coding:** Structure = Inert; Selection = None.

  **Leaf 2: The Production/Process View**
  *   **Statement:** A cause must physically connect to the effect, even if the outcome was inevitable.
  *   **Awkward Commitment:** Backup plans that never fire are still causes of the success.
  *   **Pressing Case:** Case B.
  *   **Coding:** Structure = Process; Selection = Any connected factor.

  **Leaf 3: The Strict Interventionist View**
  *   **Statement:** A cause must make a difference; if removing it changes nothing, it is not a cause.
  *   **Awkward Commitment:** Factors named in reports (like the petition) are errors if they made no difference.
  *   **Pressing Case:** Case E.
  *   **Coding:** Structure = Difference-Maker; Selection = The decisive difference.

  **Leaf 4: The Fine-Grain Dissolution View**
  *   **Statement:** Apparent duplicate causes vanish when the event is described precisely enough.
  *   **Awkward Commitment:** Causality depends on how finely you describe the time and place.
  *   **Pressing Case:** Case F.
  *   **Coding:** Structure = Distinct Events; Selection = Both (as distinct).

  **Leaf 5: The Conjunctive Parts View (INUS)**
  *   **Statement:** Causes are often insufficient parts of a larger sufficient set.
  *   **Awkward Commitment:** You cannot name a cause without listing the other necessary parts.
  *   **Pressing Case:** Case C.
  *   **Coding:** Structure = Conjunctive Set; Selection = Any part (or the set).

  **Leaf 6: The Contrastivist View**
  *   **Statement:** A cause is only identifiable relative to a specific alternative (why this rather than that?).
  *   **Awkward Commitment:** There is no single "true" cause, only answers to specific questions.
  *   **Pressing Case:** Case C.
  *   **Coding:** Structure = Contrast-Relative; Selection = The factor distinguishing the contrast.

  **Leaf 7: The Narrativist View**
  *   **Statement:** Selecting one cause over another is a storytelling choice, not a factual discovery.
  *   **Awkward Commitment:** Historical explanation is subjective and cannot be proven false.
  *   **Pressing Case:** Case E.
  *   **Coding:** Structure = Multiple Valid; Selection = Narrative Preference.

  **Special Annotation Code: Frame-Setting**
  *   **Earned:** When a factor is classified as **Leaf 3 (Inert)** but the text says it "fixed the options," "defined the terms," or "set the stage" (like Case E).
  *   **Safeguard:** Coders must quote the specific phrase describing the framing effect; without a quote, code as Noise.
  *   **Usage:** Record in Field 1 as "Frame-Setting"; Field 2 remains "None."

  ### Note on Inter-Coder Disagreement

  If coders disagree on **Field 1 (Structure)**, return to Node 3 (Difference-Making). If one coder sees a difference and the other does not, check if they are imagining different counterfactual scenarios. If they agree on the scenario but disagree on the result, this is a substantive dispute; flag for review. If coders disagree on **Field 2 (Selection)** but agree on Field 1, check if they are using different contrast classes (e.g., "Why flood?" vs. "Why so much damage?"). This is a verbal dispute; record both selections with their implied contrasts. If a passage is coded as **Leaf 3** by one coder and **Leaf 7** by another, check if the author presents the selection as arbitrary (Leaf 7) or as the single objective truth (Leaf 3).

  ### Logical Space Analysis (For Project Directors)

  **Unoccupied Cells (Gaps)**
  1.  **Overdetermination + No Fine Grain + No Selection:** A passage claims two sufficient causes exist (Case A) but refuses to distinguish them by grain (Case F) and refuses to select one. *Diagnosis:* Incoherent. It asserts redundancy without resolving it narratively or descriptively.
  2.  **Omission + Process View:** A passage traces a physical process from an absence (Case D). *Diagnosis:* Unattractive. It requires metaphysical commitments about "negative processes" most historical texts avoid.
  3.  **Conjunctive Parts + No Contrast:** A passage identifies parts of a set (Case C) but claims one part is *the* cause without implying a contrast. *Diagnosis:* Unexplored. Usually, selecting a part implies a contrast (e.g., gate vs. water); doing so without one is logically unstable.

  **Colliding Leaves**
  *   **Leaf 6 (Contrastivist) vs. Leaf 7 (Narrativist):** Both allow multiple valid causes depending on perspective.
  *   **Separation Question:** "Does the author claim one perspective is objectively better given the research question?" If Yes, Leaf 6. If No (all stories are equal), Leaf 7.
