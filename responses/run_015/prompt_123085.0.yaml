answer: |-
  The stalemate is not merely verbal, nor is it purely substantive; it is a **substantive disagreement about the ontology of blame that has calcified into a verbal equivocation over "standing."** Both sides are using the same term to track two distinct normative phenomena. Position A treats standing as a **normative licensure** (a right to perform a speech act), while Position B treats standing as a **truth-condition** (a warrant for the content of an assertion).

  Because they are arguing past one another about *what blame is*, no amount of case-study iteration (the activist, the physician, the partner) will shift the debate. To diagnose this concretely:

  ### 1. The Verbal Layer: Equivocation on "Standing"
  The impasse persists because "standing" is doing double duty.
  *   **Position A (Licensure):** Uses "standing" to mean **Normative Entitlement**. Here, blame is a *performative speech act* (like sentencing or promising). Just as a judge recuses themselves due to conflict of interest, a blamer forfeits the *right* to blame if they violate the norm. For A, hypocrisy creates a **felicity condition failure**: the act of blaming misfires because the agent lacks the requisite status.
  *   **Position B (Validity):** Uses "standing" to mean **Epistemic Warrant**. Here, blame is a *constative assertion* (like stating a fact). As long as the proposition ("Your action was wrong") is true and the blamer believes it, the "standing" is intact. For B, hypocrisy creates a **credibility deficit**, not a validity failure. It affects the *uptake* (efficacy), not the *license*.

  If the disagreement were only verbal, a simple definition would dissolve it. But it is not, because the definitions reflect deeper commitments.

  ### 2. The Substantive Layer: The Nature of Blame
  The friction lies in conflicting theories of what blame *does*.
  *   **Position A (Blame as Relational Demand):** For this camp, blame is fundamentally an act of **holding someone to account** within a shared normative community. It requires reciprocity. When the activist condemns carbon use while flying, she is not merely describing a wrong; she is demanding the target submit to a norm she implicitly exempts herself from. This creates a **performative contradiction**: she invokes a universal norm while acting as a particular exception. The "authority" she lacks is the authority of *shared subjection*.
  *   **Position B (Blame as Moral Assessment):** For this camp, blame is fundamentally an **expression of moral judgment**. Its primary function is to identify wrongness and align the moral record. When the physician condemns smoking, the truth of the medical/moral claim ("Smoking is harmful/wrong") is independent of the physician's habits. The "authority" required is merely **epistemic access** to the truth of the norm.

  ### 3. Concrete Friction in the Cases
  The substantive split becomes visible when we examine why each side finds the other's intuition compelling in the specific cases:

  *   **The Unfaithful Partner:**
      *   **Position A** focuses on the **contractual breach**. Fidelity is a reciprocal obligation. By cheating, the blamer unilaterally voids the reciprocal basis of the demand. To blame now is to treat the partner as bound by rules the blamer has discarded. The friction is *fairness*.
      *   **Position B** focuses on the **value of fidelity**. The wrongness of cheating does not vanish because the accuser also cheated. To deny the blamer the right to speak is to suggest that cheating becomes permissible if everyone does it. The friction is *moral truth*.
  *   **The Environmental Activist:**
      *   **Position A** sees **complicity**. By flying, the activist participates in the harm she condemns. Her blame is tainted because she is not "clean." The friction is *purity/complicity*.
      *   **Position B** sees **consequential urgency**. The carbon emissions are damaging the climate regardless of who points it out. Silencing the activist because she flies protects the polluter, not the norm. The friction is *outcome vs. process*.

  ### 4. Diagnosis of the Impasse
  The disagreement is **substantive**, rooted in whether moral authority is **constituted by consistency** (A) or **derived from the norm itself** (B).
  *   Position A believes authority is **internal to the relationship**: I can only hold you to a standard I accept for myself.
  *   Position B believes authority is **external to the agent**: The norm binds you regardless of my relationship to it.

  The verbal confusion over "standing" allows both sides to claim they are defending "morality." A claims they are defending the *integrity of moral community*; B claims they are defending the *objectivity of moral truth*.

  ### 5. Path to Genuine Progress
  Progress will not come from a sharper conceptual map alone, nor from a formal analysis of authority conditions in the abstract. It requires a **Functional Taxonomy of Blame** that dissolves the monolithic concept of "standing."

  Genuine progress would look like an argument that establishes **Blame is a Hybrid Speech Act** with two distinct components:
  1.  **The Assertoric Component:** (Position B's domain) Claims about the wrongness of the act. Hypocrisy does *not* defeat this. The activist is right about carbon.
  2.  **The Imperative Component:** (Position A's domain) Demands for accountability, apology, or reform. Hypocrisy *does* defeat this. The activist cannot legitimately *demand* the target sacrifice comfort she refuses to sacrifice.

  **The Proposal for Progress:**
  The field must move from asking *"Does the hypocrite have standing?"* to *"Which dimension of blame is being invoked?"*
  *   If the blame is **diagnostic** ("That was wrong"), the hypocrite retains standing (Position B wins).
  *   If the blame is **sanctioning** ("You must pay/atone/submit"), the hypocrite loses standing (Position A wins).

  The impasse dissolves when we recognize that Position A is correctly identifying a defeat condition for **sanctioning authority**, while Position B is correctly identifying the preservation of **diagnostic validity**. The "stall" exists because both sides are trying to apply one condition to the whole of blame. A formal analysis that separates the **truth-conditions** of blame from the **felicity-conditions** of the blaming act would allow both insights to coexist without contradiction. This shifts the debate from a zero-sum game over "standing" to a nuanced analysis of **moral jurisdiction**.
