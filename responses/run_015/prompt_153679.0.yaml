answer: |-
  # DECISION PROCEDURE: PANEL COMPOSITION PROTOCOL
  **Owner:** Selection Officer  
  **Cycle:** Quarterly Review / Per-Project Sign-off  
  **Turnaround:** 48 Hours Max  

  ## PART 1: THE FLOWCHART (IN WORDS)

  Run these tests in order. Stop at the first definitive outcome.

  ### TEST 1: THE CLOCK (Urgency)
  **Question:** Is there a statutory or safety deadline requiring action within 14 days?
  *   **Yes:** **STOP.** Proceed to **Expert Appointment**.
      *   *Why:* Sortition and elections require lead time for notification, audit, and campaigning. You cannot wait for a dissent escrow process during a crisis.
      *   *Hard No:* Do not attempt hybrid sortition here.
  *   **No:** Proceed to Test 2.

  ### TEST 2: THE LICENSE BARRIER (Technical Complexity)
  **Question:** Does the panel's primary function require interpreting data that legally requires a professional license (PE, MD, JD, AICP) to certify?
  *   **Yes:** **STOP.** Proceed to **Expert Appointment**.
      *   *Why:* Your "reasonableness audit" cannot validate technical competence. A citizen can be reasonable and still wrong about structural load limits.
      *   *Hard No:* Do not put unlicensed citizens in a voting seat on technical safety determinations.
  *   **No:** Proceed to Test 3.

  ### TEST 3: THE CONFLICT SCOPE (Legitimacy)
  **Question:** Is the issue a zero-sum dispute between specific neighbors/properties (e.g., zoning variance, historic designation of a single block)?
  *   **Yes:** **STOP.** Proceed to **Pure Election** (or appointed stakeholder reps).
      *   *Why:* Sortition assumes interchangeable citizens. In hyper-local disputes, stakeholders are *not* interchangeable. Only those affected should vote, or those explicitly accountable to them.
      *   *Hard No:* Do not use random citizens to decide specific property rights of others.
  *   **No:** Proceed to Test 4.

  ### TEST 4: THE POOL VIABILITY (Logistics)
  **Question:** Based on prior draws, will the voter roll yield a minimum of 20 eligible candidates per seat to ensure statistical representation after the reasonableness audit?
  *   **No:** **STOP.** Proceed to **Expert Appointment** or **Stakeholder Election**.
      *   *Why:* If the pool is too shallow, the "random" selection is actually just picking the few available people, breaking the statistical legitimacy of sortition.
      *   *Hard No:* Do not run a lottery with a depleted pool.
  *   **Yes:** **GO.** Proceed to **Hybrid Sortition Model**.
      *   *Action:* Draw from rolls -> Run Reasonableness Audit -> Seat Passers -> Escrow Failures.

  ---

  ## PART 2: THE VALUES CALLS (WHERE YOU DECIDE)

  This procedure pretends to be objective. It is not. You are making the following value judgments disguised as process steps. Acknowledge them before signing off.

  **1. Defining "Reasonable" (Test 4 Input)**
  *   **The Call:** You decide what passes the reasonableness audit.
  *   **The Risk:** You might filter out passionate dissenters as "unreasonable," turning the panel into a echo chamber of moderates.
  *   **The Check:** Before approving the audit criteria, ask: "Am I filtering for competence or compliance?" If it's compliance, you are stacking the panel.

  **2. Defining "Technical" (Test 2)**
  *   **The Call:** You decide what counts as a licensed task vs. a policy preference.
  *   **The Risk:** You can expand "technical" to exclude citizens from controversial topics (e.g., claiming air quality is purely engineering when it's also health policy).
  *   **The Check:** If the decision involves trade-offs (cost vs. safety), it is policy, not just technical. Keep it in the Hybrid bucket.

  **3. Defining "Emergency" (Test 1)**
  *   **The Call:** You decide what counts as a 14-day deadline.
  *   **The Risk:** Administrative convenience can be dressed up as urgency to bypass citizen input.
  *   **The Check:** Is the deadline statutory, or did someone just want it done before the quarter ends?

  ---

  ## PART 3: CASE APPLICATIONS

  ### CASE 1: Regional Air-Quality Panel
  *   **Test 1 (Clock):** No. Planning cycle is annual. **PASS.**
  *   **Test 2 (License):** Mixed. Monitoring data is technical; setting limits is policy. **PASS** (Policy dominates).
  *   **Test 3 (Conflict):** Regional. Not zero-sum between neighbors. **PASS.**
  *   **Test 4 (Pool):** Large regional voter roll. **PASS.**
  *   **Decision:** **Hybrid Sortition.**
  *   **Why:** You need broad legitimacy for unpopular regulations. The dissent escrow is useful here to capture minority health concerns without letting them veto safety standards.

  ### CASE 2: Single-Block Historic Preservation Dispute
  *   **Test 1 (Clock):** No. **PASS.**
  *   **Test 2 (License):** No. Historic value is cultural, not engineering. **PASS.**
  *   **Test 3 (Conflict):** **YES.** Zero-sum between owners wanting to renovate and neighbors wanting preservation.
  *   **Decision:** **Pure Election (or Stakeholder Appointment).**
  *   **Why:** Random citizens from across the region do not bear the cost of this decision. Only the immediate stakeholders should vote. Using sortition here is undemocratic because it dilutes the vote of those directly affected.

  ### CASE 3: Emergency Flood-Wall Situation
  *   **Context:** Lottery pool yielded only 3 qualified engineers; 2 refused service.
  *   **Test 1 (Clock):** **YES.** Flood emergency implies immediate threat.
  *   **Decision:** **Expert Appointment.**
  *   **Why:** This fails Test 1 immediately. Even if it didn't, it fails Test 4 (Pool Viability). You cannot staff a crisis panel with 1 person.
  *   **The Hard Truth:** This validates your argument with Mara. Pure sortition breaks when the skill floor is high and the timeline is short. Do not force the hybrid model here. Appoint the engineers, document the emergency, and revert to hybrid for the *post-flood* recovery planning.

  ---

  ## PART 4: LIMITATIONS (WHAT THIS CAN'T DO)

  1.  **It Cannot Fix a Broken Pool:** If voter rolls are outdated or certain demographics don't register, your "random" selection is biased. The procedure assumes the input data is valid. It is not.
  2.  **It Cannot Prevent Capture:** Special interests can still lobby the appointed experts or campaign in the elections. This procedure only selects the *method*, it doesn't guarantee the *outcome*.
  3.  **It Cannot Measure "Reasonableness" Objectively:** The audit is subjective. You will be accused of bias when you escrow a dissenting voice. Keep records of why each person was escrowed.
  4.  **It Cannot Handle Mass Refusal:** If the cultural mood shifts and people refuse civic duty (like the 2 engineers in Case 3), sortition becomes appointment by default. You need a contingency budget to pay citizens for service if refusal rates spike.

  **Final Sign-Off Rule:** If you have to twist the logic of Test 2 or Test 3 to get the result you want, you are violating the protocol. Default to **Expert Appointment** in doubt. It is easier to justify expertise than it is to justify a broken lottery.
