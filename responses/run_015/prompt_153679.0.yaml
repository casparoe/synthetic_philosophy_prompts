prompt: |-
  I just got out of this long, draining argument with my friend Mara about lottocracy — she thinks every local board should be filled by pure lottery, I keep saying that sounds great until you actually have to staff a flood emergency and suddenly random selection feels like a bad joke. Anyway, I’m the selection officer for our regional planning authority (small office, everything hits my desk, I sign off in about 48 hours max) and we adopted this hybrid model last year: a two-stage sortition where citizens are drawn from voter rolls, then they have to pass a reasonableness audit run by an outside mediator. If they fail, they don’t sit on the panel; they go into a dissent escrow pool that can file objections but can’t vote. I need a reusable decision procedre — checklist, flowchart in words, tests in order — that tells me when this hybrid applies, when pure election is safer, and when we should just appoint experts. For each step say what counts as enough answer, where the procedure stops with a hard no, and where it’s actually a values call I’m dressing up as process. I run this reccuring every quarter, so it can’t be one-off advice.

  Apply it to three cases: a regional air-quality panel, a single-block historic preservation dispute, and that emergency flood-wall situation where the lottery pool only has three qualified engeneers and two of them refuse service — include that one even though I know the answer will annoy me. Also be honest about what the procedure just can’t do, and please write the answer in American English with no citations or reading list — I need something I can actually tape to my desk.
