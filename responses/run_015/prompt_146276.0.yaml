answer: |-
  Here is a taxonomy designed for your seminar handout. It avoids starting with school names and instead starts with the philosophical commitments your flatmate was asking about. It branches into six distinct "leaves" (positions), including a meta-position on the taxonomy itself.

  ### The Madhyamaka Tetralemma Decision Tree

  **START:** You have just negated all four corners of the tetralemma (Exists, Doesn't Exist, Both, Neither). Now answer the following:

  #### **Q1: The Logic Question**
  **To prove your opponent wrong, must you accept a shared logical premise (e.g., "sound is impermanent") as provisionally valid, or do you refuse to assert any premises of your own?**
  *   **A. I need shared premises to build an independent inference.** → *Go to Leaf 1*
  *   **B. I refuse to assert premises; I only show contradictions in their view.** → *Go to Q2*

  #### **Q2: The Negation Question**
  **When you say "All things are empty," is that statement itself empty (lacking inherent truth), or is it a solid, final truth?**
  *   **A. The statement itself must be empty (Emptiness of Emptiness).** → *Go to Q3*
  *   **B. The statement points to a solid Ultimate Reality.** → *Go to Leaf 6*

  #### **Q3: The Ultimate Question**
  **When the fourth corner ("Neither exists nor doesn't exist") is reached, is what remains a pure absence of error, or a luminous presence of wisdom?**
  *   **A. It is a pure absence (Non-affirming negation).** → *Go to Q4*
  *   **B. It is a luminous presence (Buddha-nature/awareness).** → *Go to Leaf 5*

  #### **Q4: The Convention Question**
  **In everyday life, do valid perceptions find objects that are "real enough" to be labeled true, or are all conventions merely unanalyzed appearances?**
  *   **A. Valid perceptions find objects that function reliably.** → *Go to Leaf 3*
  *   **B. Conventions are merely unanalyzed appearances with no validity.** → *Go to Leaf 4*

  ---

  ### The Leaves (Positions & Commitments)

  #### **Leaf 1: The Autonomous Logicians (Svātantrika)**
  *   **Path:** Q1 (A)
  *   **View:** Conventional logic has enough autonomy to make positive claims about emptiness. The tetralemma is a tool to clear the mind for a non-conceptual realization of the Ultimate.
  *   **The Awkward Commitment:** **Hidden Ontology.** By granting logic autonomous validity, you risk treating the "Ultimate Truth" as a *thing* that logic can point to, subtly reifying the very emptiness you try to teach.
  *   **Historical Label:** *Svātantrika-Madhyamaka (e.g., Bhāviveka).*

  #### **Leaf 2: The Classical Deconstructors (Prāsaṅgika)**
  *   **Path:** Q1 (B) → Q2 (A) → [Stops before Tibetan splits]
  *   **View:** No independent logic. Emptiness is empty. The fourth corner is a rhetorical dead-end meant to stop conceptual proliferation, not a description of a state.
  *   **The Awkward Commitment:** **Quietism.** If you cannot assert any premises, it becomes difficult to explain *how* karma works or *why* enlightenment is better than samsara without accidentally making a claim.
  *   **Historical Label:** *Prāsaṅgika-Madhyamaka (e.g., Candrakīrti).*

  #### **Leaf 3: The Precision Realists (Gelug Prāsaṅgika)**
  *   **Path:** Q1 (B) → Q2 (A) → Q3 (A) → Q4 (A)
  *   **View:** Emptiness is a "non-affirming negation" (just removing error, adding nothing). However, conventional truth is robust; valid cognition *does* find objects conventionally.
  *   **The Awkward Commitment:** **Legalism.** This view requires extremely fine distinctions between "existing conventionally" and "existing inherently." Critics argue this turns meditation into a logical paperwork exercise.
  *   **Historical Label:** *Gelug School (e.g., Tsongkhapa).*

  #### **Leaf 4: The Appearance-Onlyists (Sakya/Nyingma Prāsaṅgika)**
  *   **Path:** Q1 (B) → Q2 (A) → Q3 (A) → Q4 (B)
  *   **View:** Like the Gelug, they accept emptiness of emptiness. But they argue conventional truth is *only* appearance; valid cognition does not "find" objects even conventionally.
  *   **The Awkward Commitment:** **Instability.** If conventional truth has no validity even on its own level, it becomes hard to distinguish between a deluded hallucination and the Buddha's compassionate action.
  *   **Historical Label:** *Sakya/Nyingma (e.g., Gorampa).*

  #### **Leaf 5: The Luminous Essentialists (Shentong / Empty-of-Other)**
  *   **Path:** Q1 (B) → Q2 (A) → Q3 (B)
  *   **View:** The fourth corner isn't a dead end; it hints at Buddha-nature. Things are empty of *defilements*, but not empty of *wisdom*. Emptiness is fullness.
  *   **The Awkward Commitment:** **Substantialism.** This sounds suspiciously like the Hindu *Atman* (Soul). You risk turning "Emptiness" into a permanent, unchanging entity, which Nāgārjuna explicitly warned against.
  *   **Historical Label:** *Jonang / Shentong (e.g., Dolpoppa).*

  #### **Leaf 6: The Meta-Critics (Modern Scholarly View)**
  *   **Path:** Q2 (B) OR [Rejects the Tree Structure]
  *   **View:** The strict splits above (especially Leaf 1 vs. Leaf 2) are largely Tibetan inventions projected back onto Indian masters. In practice, the positions overlap significantly.
  *   **The Awkward Commitment:** **Undermining Authority.** If the taxonomy is a later fabrication, it complicates the traditional claim that one school is "higher" or "more correct" than the other.
  *   **Historical Label:** *Contemporary Buddhist Studies (e.g., Ruegg, Cabezon).*

  ---

  ### ⚠️ Flags for Indistinguishability (For your Seminar)

  **1. The "Indian Split" Flag (Leaf 1 vs. Leaf 2)**
  *   **Issue:** Many modern scholars argue that Bhāviveka (Leaf 1) and Candrakīrti (Leaf 2) did not see themselves as founding rival schools. The rigid taxonomy was solidified centuries later in Tibet.
  *   **Seminar Note:** If a classmate insists the Indian masters were fiercely divided, point out that Candrakīrti critiques Bhāviveka's *method*, not necessarily his *soteriological goal*. On the tetralemma, both ultimately negate all four corners.

  **2. The "Prāsaṅgika" Flag (Leaf 3 vs. Leaf 4)**
  *   **Issue:** Gelug (Leaf 3) and Sakya (Leaf 4) both claim to be the *true* Prāsaṅgika. To an outsider, the difference between "valid cognition finds objects" vs. "valid cognition sees mere appearance" is semantic hair-splitting.
  *   **Seminar Note:** This split is functionally indistinguishable regarding the tetralemma itself; both use the 4th corner to negate inherent existence. The split is mostly about epistemology (how we know things), not ontology (what things are).

  **3. The "Shentong" Flag (Leaf 5 vs. Leaf 2)**
  *   **Issue:** Proponents of Leaf 5 argue they are not making a positive claim (Leaf 2's awkward commitment) but describing an *experience* that logic cannot touch.
  *   **Seminar Note:** If pressed, a Shentong proponent will say the 4th corner *is* the luminous mind. A Prāsaṅgika proponent will say the 4th corner is *the absence of a view*. In practice, during meditation, these may feel identical, even if the philosophy differs.
