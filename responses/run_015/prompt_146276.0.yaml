prompt: |-
  I'm taking a course on Buddhist philosophy and I'm a bit stuck on how exactly Nāgārjuna's tetralemma works in practise, especially when people apply it to emptiness itself. My tutor mentioned the fourfold negation but then said different Madhyamaka schools dont actually agree on whether the fourth corner—neither exists nor doesnt exist—is a positive claim or just a rhetorical dead-end. I was arguing with my flatmate about wether Prāsaṅgika and Svātantrika interpretations really split on that, or whether it's more about how they use logic, and we couldnt figure out if there's a clear taxonomy.

  Could you write a decision tree or taxonomy that sorts the main Madhyamaka positions on the tetralemma? I want it to start from concrete commitments—like whether you think conventional truth has any autonomous validity, whether negation can be applied to itself without contradiction, and whether emptiness is itself empty—then branch out to named positions (Prāsaṅgika-Madhyamaka, Svātantrika, maybe the later Tibetan Gelug vs Sakya angles if they fit). Each leaf should name the view and say what its most awkward commitment is, especially regarding whether they end up with a kind of quietism or a hidden ontology. Also flag any branches where two positions are basically indistinguishable on these questions, because I want to use this for a seminar handout and I dont want to pretend there's a split where there isnt. Keep it to maybe six or eight leaves, and dont just list encyclopedia entries—make the questions ones someone could answer without already knowing the Sanskrit labels.
