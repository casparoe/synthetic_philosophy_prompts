answer: |-
  Oxidation is not hunger, though **fire**
  consumes the room and grows, no **virus**
  hiding in the ash. The **mule**
  converts the hay to heat, unlike the **spore**
  that shuts the engine down. The **colony**
  maintains the gradient at the **selvage**.

  The droplet splits by shear, that liquid **selvage**
  fracturing under flow, unlike the **fire**
  that spreads but leaves no lineage. The **colony**
  swarms to bud new queens, while **virus**
  hijacks the ribosome to wake the **spore**;
  stands alone, the sterile body of the **mule**.

  DNA travels forward in the **mule**
  but stops at the body's edge. The **selvage**
  preserves the ratio, unlike the **spore**
  which holds a blueprint against the **fire**
  of time. Variation selects the **colony**,
  and error rates define the **virus**.

  Where does the host end and the **virus**
  begin? Skin bounds the **mule**,
  but heat has no membrane, only **fire**
  advancing as a front. The **selvage**
  is a phase drop, distinct. The **colony**
  blurs the count, a capsule like the **spore**.

  We ask for continuity past the **spore**,
  past the crystal silence of the **virus**,
  past the many bodies of the **colony**,
  past the sterile history of the **mule**,
  past the extinguished breath of **fire**,
  to see what labor we impose on **selvage**.

  So we hesitate at the **selvage**.
  If continuity is data, not the **spore**,
  but a recipe surviving like **fire**?
  If the origin is design, is it **virus**
  or tool? If autonomy is fed, a **mule**
  yoked to the hand? Or a sovereign **colony**?

  Whether we bind the **virus** to the **colony**,
  or grant the **spore** more status than the **mule**,
  the question burns: the **selvage** or the **fire**?
