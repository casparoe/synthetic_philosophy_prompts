answer: |-
  This is one of the oldest and hardest problems in philosophy (the problem of moral responsibility), and the fact that your gut reactions are inconsistent is not a bug in your thinking—it's a feature. You are sensing the friction between **Retributivism** (punishment because you *earned* it) and **Consequentialism** (punishment because it *does* something useful).

  You asked for a single principle that captures your intuitions, tells you what to sacrifice, classifies your camp, and runs the new cases. Here is the best fit for the specific pattern of verdicts you provided.

  ### The Principle: Reason-Responsive Agency with Forward-Looking Constraints

  > **An individual deserves punitive treatment if and only if they possessed the cognitive and emotional capacity to recognize moral reasons at the time of the act, and had a reasonable opportunity to regulate their behavior accordingly.**
  >
  > **However, even when desert is established, the *severity* of the consequence may be capped or adjusted by forward-looking concerns (safety, rehabilitation). Conversely, when capacity or opportunity is significantly compromised, desert vanishes entirely, and any intervention must be justified solely by safety or rehabilitation, not by what is "earned."**

  ### How It Fits Your Cases

  1.  **Marcus (Cheating):** He has capacity and opportunity. He chose to cheat. **Verdict:** He *deserves* the zero. The principle validates your gut. The zero is retributive (he broke the trust) but also serves deterrence.
  2.  **The Dog:** Lacks cognitive capacity to understand moral reasons. **Verdict:** No desert. Yelling is behavioral conditioning (forward-looking), not punishment. Your gut is correct.
  3.  **Brain Tumor Guy:** Capacity is physically compromised. The "self" that regulates behavior is broken. **Verdict:** No desert. Quarantine is for safety only. Your gut is correct.
  4.  **Drunk Friend:** This is the "Tracing Principle." He had capacity *when he decided to get drunk*, knowing it reduces capacity later. **Verdict:** He deserves the apology/anger because he is responsible for the state that led to the act. Your freeze on "suffering" is healthy—he deserves *accountability*, but perhaps not severe retribution.
  5.  **Repeat Thief:** Capacity and opportunity exist. **Verdict:** He deserves *some* punishment. However, your lack of bother regarding the expulsion suggests you see the expulsion as primarily **safety** (forward-looking). The principle allows this: Desert justifies the blame, but safety justifies the severity (expulsion vs. detention).

  ### The Sacrifice: Which Verdict Has to Go?

  You guessed the **Soccer Kid** and the **Tumor Guy** are the conflict. You are right. To keep this principle coherent, **you must modify your intuition about the Soccer Kid.**

  Currently, you say: *"Yeah he has to face consequences... and honestly he couldn't have done much differently."*
  The Principle says: If he "couldn't have done differently" due to environmental determinism (awful house) in the same way the Tumor Guy couldn't due to biological determinism, **he does not deserve retributive punishment.**

  You have to accept that holding the Soccer Kid accountable is a **forward-looking necessity** (to teach him, to keep others safe), not a **retributive justice** (he *earned* the expulsion in a cosmic sense). If you insist he *deserves* it in the same deep way Marcus does, you have to admit the Tumor Guy might also deserve it (which you reject). If you insist the Tumor Guy is innocent of blame, you must admit the Soccer Kid is mitigated in blame, too.

  **The Fix:** You keep the consequence (he still gets expelled), but you change the *reason*. You stop saying "he deserves this" and start saying "this is necessary for him and the school, even though his blameworthiness is low."

  ### Which Camp Are You In?

  This principle places you firmly in the **Compatibilist Camp (Dennett)**.

  *   **Why:** You believe desert is real *sometimes* (Marcus). You believe agency is compatible with a causal universe, provided the agent is "reasons-responsive."
  *   **The Nuance:** You are a **Pragmatic Compatibilist**. You acknowledge that even when desert exists, we often punish for forward-looking reasons (the Repeat Thief), and when desert doesn't exist, we still intervene for safety (the Tumor Guy). You are rejecting the Hard Incompatibilist view (Caruso) that *no one* ever deserves anything, because you insist Marcus deserves his zero.

  ### Running the Undecided Cases

  Here is how the principle handles the three scenarios you haven't decided yet.

  #### 1. The Dean's "Pre-Crime" Check-Ins
  *   **The Case:** Grades drop + lateness → Dean meeting before any rule is broken.
  *   **The Principle's Verdict:** **Unjustified as punishment.**
  *   **Reasoning:** There is no act $A$ that breached a moral trust. Therefore, condition 1 of the principle fails. The student *deserves* nothing.
  *   **Nuance:** The school can justify this *only* as a forward-looking support measure (like a medical check-up). If the Dean frames it as "You're in trouble," they are lying. If they frame it as "We are intervening to help you succeed," it is permissible, but it is **not punishment**. Your class was right: calling it discipline is "punishing with nicer words."

  #### 2. The Group Project Failure (Collective Punishment)
  *   **The Case:** Thing breaks, no one confesses, everyone fails.
  *   **The Principle's Verdict:** **Generally Unjustified.**
  *   **Reasoning:** Punishment requires individual agency. If Student X did not break it and had no capacity to stop Student Y, Student X fails condition 1 (opportunity to regulate behavior).
  *   **Exception:** The only way this holds is if the "act" was defined as "failing to police the group." If the teacher explicitly stated, "You are collectively responsible for monitoring each other," then the group *did* commit a breach of trust together. Without that prior agreement, this violates the principle by punishing non-agents.

  #### 3. The Teacher's Lie ("You Deserve This")
  *   **The Case:** Teacher gives detention for deterrence but tells the kid "You deserve this."
  *   **The Principle's Verdict:** **Unethical.**
  *   **Reasoning:** This is the "Noble Lie." If the teacher is a Caruso-style pragmatist (punishing only for future good), telling the kid they *deserve* it is a falsehood about the kid's moral status.
  *   **Why it matters:** Trust is a prerequisite for the "Reason-Responsive" capacity to work. If the authority figure lies about the nature of the justice system, they undermine the student's ability to learn moral reasons. You feel it's a lie because it *is*. The principle demands you align the justification with the reality: "I am giving you this detention to ensure you don't do it again," not "You are a bad person who earned this."

  ### Summary for Your Argument with Marco
  Marco is arguing for **Hard Incompatibilism** (no one deserves anything). You are arguing for **Compatibilism** (desert exists when agency is intact).

  Your winning move is to admit that the Soccer Kid and the Tumor Guy are on a spectrum of **diminished capacity**, not a binary of guilt/innocence. You can tell Marco: *"I agree that ultimate desert is shaky, but practical desert is real when someone has the tools to do better. Marcus had the tools; the Tumor Guy didn't. The Soccer Kid had broken tools. We punish Marcus because he can learn, we help the Soccer Kid because he needs repair, and we contain the Tumor Guy because he's dangerous. Treating them all the same ignores their actual capacity to change."*

  That captures your gut, keeps your principle, and gives Marco enough ground to stop fighting you.
