answer: |-
  Here is a structural plan for your seminar, designed to leverage your audience's computational intuitions while preventing them from collapsing the epistemic problem into a signal-processing one.

  ### 1. The Dependency Structure

  **Load-Bearing Concepts (Must be established explicitly):**
  *   **_Pramā_ (Veridical Cognition):** You must distinguish this from "belief" or "decision." For this audience, define it functionally as a cognitive state that is (a) **novel** (not memory), (b) **undefeated** (no undercutting defeaters), and (c) **veridical** (matches the world). *Crucially:* In Nyāya, veridicality is a condition of the *state*, not just a lucky outcome.
  *   **_Pramāṇa_ (Instrument):** Do not define this as a "source" (which sounds like a database) or a "justification" (which sounds like logic). Define it as the **causal mechanism** that generates _pramā_. For vision scientists, analogize it to a "verified processing pipeline." If the pipeline is broken, no knowledge, even if the output is true by luck.
  *   **Exhaustiveness:** You must establish that the Nyāya project assumes a closed set of causal pipelines. If a cognition is _pramā_, it *must* have been generated by one of the recognized _pramāṇas_. This is why the "absence" case is a crisis: if the cat's absence is known, but fits no pipeline, the system is broken.

  **Gestural Concepts (Introduce only if needed):**
  *   **_Yogyatā_ (Eligibility/Compatibility):** You can describe this functionally ("the object must be perceivable") without using the Sanskrit.
  *   **_Viśeṣaṇa_ (Qualifier):** Don't introduce this. It invites mereological confusion.

  **On the Terminology Order:**
  Your plan to introduce the Sanskrit term _pramāṇa_ **only after** the phenomenon is on the table is **correct** for this audience.
  *   **Why:** Leading with "The Four Prāmāṇas" triggers their "suspicion of taxonomy." They will treat it as an arbitrary list.
  *   **Strategy:** Start with "Instruments of Veridical Cognition." Walk through Perception and Inference using their existing vocabulary. When the "Cat Absence" case breaks those two categories, *then* say: "Nyāya calls the category of instrument a _pramāṇa_." This makes the term a solution to a problem they are already feeling, rather than a label for a list they didn't ask for.

  ### 2. The Carrying Example

  **Verdict:** The "Cat in the Hall" case is **correct**, but it requires strict constraints to prevent SDT reduction.

  **Required Features:**
  *   **High Familiarity:** The subject knows the cat and the hall intimately. This minimizes the "search cost" and makes the cognition feel immediate.
  *   **Direct Access:** The subject is standing at the threshold. This removes spatial inference ("If she's not in the kitchen, she's not in the hall").
  *   **The Single Dimension of Variation:** **Perceptual Eligibility of the Object.**
      *   *Case A (Standard):* Lights on, subject attentive, cat visible-if-present. Result: "No cat."
      *   *Case B (Ineligible Object):* Pitch dark. Result: "I don't know if the cat is there." (Prevents the move that absence is always perceived).
      *   *Case C (Ineligible Subject):* Lights on, but subject is blindfolded (or in another city, as you suggested). Result: "I infer no cat," but the cognition is mediate, not immediate.

  **What It Must Lack:**
  *   **No Explicit Premises:** The subject must not consciously think, "If the cat were here, I would see her." The cognition must be phenomenologically immediate.
  *   **No Probabilities:** Do not allow the audience to model this as $P(Absence | No Signal) > \theta$. In Nyāya, knowledge is binary (you either have _pramā_ or you don't), not a confidence interval.
  *   **No "Search" Narrative:** Avoid describing eye movements or scanning. The cognition should be presented as a single gestalt: "The hall is cat-less."

  **Why this works:** It isolates the **warrant**. In Case A, the warrant feels perceptual. In Case C, the warrant feels inferential. In Case A, SDT says there is no signal. Nyāya asks: "What instrument generated this true cognition?"

  ### 3. The Misconception Map

  Address these in the following order. If you address them out of sequence, earlier defusions will be overwritten by later assumptions.

  1.  **"This is just SDT / Decision Policy."** (Immediate reaction)
      *   *The Trap:* They will say you have set a high criterion on the noise distribution.
      *   *Defusion Point:* **Before** introducing the "Eligibility" variation.
      *   *Move:* "SDT models *confidence* and *response bias*. It does not guarantee *truth*. You can have a high-criterion decision that is false. _Pramā_ requires truth. We are asking about the *causal history* of a *true* cognition, not the threshold for a report."
  2.  **"This is the Argument from Ignorance."** (Once Eligibility is introduced)
      *   *The Trap:* "You don't see it, therefore it isn't there" is a formal fallacy.
      *   *Defusion Point:* **After** Case B (Dark Room).
      *   *Move:* "The fallacy occurs when eligibility is ignored. In the dark, 'I don't see it' implies nothing. In the light, 'I don't see it' *plus* 'It would be seen if present' yields knowledge. The Nyāya claim is that the *non-perception* itself, under eligible conditions, is the causal factor."
  3.  **"It's just Inference with a suppressed premise."** (When proposing the Inference solution)
      *   *The Trap:* They will posit a major premise: "All cats in halls are visible."
      *   *Defusion Point:* **During** the comparison of Perception vs. Inference.
      *   *Move:* "Inference is mediate (takes time/steps). This cognition is immediate. If you force it into Inference, you are positing a subconscious syllogism that doesn't match the phenomenology. Does the mind *compute* the generalization, or does it just *see* the absence?"
  4.  **"Non-cognition is just a gap in the taxonomy."** (When proposing the Non-Cognition solution)
      *   *The Trap:* They will treat _anupalabdhi_ as a "none of the above" bucket.
      *   *Defusion Point:* **When** defining the new _pramāṇa_.
      *   *Move:* "It is not a gap; it is a distinct causal mechanism. Just as 'seeing' has a specific causal chain (light -> eye -> contact), 'knowing absence' has a specific chain (eligible conditions -> non-contact -> cognition of absence). It is a positive instrument yielding negative content."
  5.  **"Absence must be a real thing/object."** (The realist slide)
      *   *The Trap:* They will assume Nyāya reifies absence as a spooky entity.
      *   *Defusion Point:* **End of session only.**
      *   *Move:* "Hold this. You can accept the *instrument* is distinct without committing to the *object* being a positive entity. Let the epistemology drive the metaphysics, not vice versa."

  ### 4. The Final Check

  **Goal:** Distinguish "classifying cases" from "understanding the theoretical stakes."
  **The Case:** **The Unnoticed Sensory Defect.**

  **Scenario:**
  You come home. Lights are on (Object Eligible). You are not blindfolded (Subject Eligible). You look at the hall. You conclude "No cat."
  *Hidden Wrinkle:* You have temporary tunnel vision (or a scotoma) that you are unaware of. The cat is actually sitting in your blind spot. You conclude "No cat." (True by luck, as the cat is actually in the kitchen, but your visual field was compromised).
  *Alternative:* The cat *is* in the hall, in your blind spot. You conclude "No cat." (False).

  **The Question for the Group:**
  "Does this cognition count as _pramā_ (knowledge) generated by Perception? Or does the defect in the instrument void the _pramāṇa_ status, even if the conclusion happens to be true?"

  **Why this distinguishes understanding:**
  *   **If they classify:** They will say "It's Perception because it used the eyes."
  *   **If they understand the theory:** They will see that _pramāṇa_ requires a *defect-free instrument_. If the instrument is flawed, the causal chain is broken. This forces them to see that _pramāṇa_ theory is not about *what* you used (eyes vs. logic), but about the *normative status of the causal process*. It clarifies why "Non-Cognition" might be needed: because standard Perception requires a positive contact that didn't happen, and standard Inference requires a premise you didn't use.

  ### 5. Scope Exclusions

  **Your List:**
  1.  Fourfold classification of absence.
  2.  Navya-Nyāya technical vocabulary.
  3.  Postulation (_arthāpatti_) as a further _pramāṇa_.
  4.  Cross-school disputes with the Buddhists.

  **Collapse Risk Assessment:**
  *   **Fourfold Absence:** **Safe.** You only need "Absolute Absence" (_atyantābhāva_). The others distract.
  *   **Navya-Nyāya:** **Safe.** Keep it pre-Navya (classical Nyāya). The logic holds without the technicalia.
  *   **Postulation:** **Safe.** This complicates the "Inference vs. Non-Cognition" debate unnecessarily.
  *   **Buddhist Disputes:** **HIGH RISK.**
      *   *Warning:* Do not exclude the *logical pressure* the Buddhists exerted, even if you exclude the *historical label*.
      *   *Why:* The reason "Inference" is a live option for absence is that Buddhists argued absence is *unreal*, so it cannot be perceived. If you remove this pressure, the audience will ask, "Why can't I just perceive the empty space?"
      *   *Fix:* Frame it as "The Metaphysical Constraint." Tell them: "Some philosophers argue you cannot perceive 'nothing.' If that is true, Perception is off the table. This forces the Inference vs. Non-Cognition debate." You can omit the word "Buddhist" and "Dignāga," but you must keep the *objection* that absence is not a valid object of perception. Without this, the "Perception" solution looks too easy, and the seminar loses its tension.

  **Summary of Refusals to State Aloud:**
  "We will not cover the later technical classifications of absence, the specific vocabulary of Navya-Nyāya, or the historical debates with Buddhist logicians. However, we *will* engage with the core logical constraint that drives the debate: whether 'nothing' can be an object of perception."
