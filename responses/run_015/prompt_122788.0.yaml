answer: |-
  1. **Object Distinction**
  The account must distinguish country, nation, state, government, and compatriots such that loyalty to one does not logically necessitate loyalty to the others.
  *   **Case:** The public official who breaks the law out of loyalty to the country; the plurinational state where constituent peoples reject the political unit.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Theories conflating regime survival with national interest or ethnonationalist exclusivity.

  2. **Critical Loyalty**
  The account must allow attachment to persist despite the judgment that the country is currently morally flawed, committing ongoing wrongs, or the worst in the world.
  *   **Case:** The reformer focused on unfulfilled aspirations; the country whose prosperity depends on an ongoing wrong; the citizen who judges her country the worst.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Merit-based loyalty models and uncritical chauvinism.

  3. **Inculcation and Virtue**
  The account must explain how an attitude deliberately cultivated in a captive audience can constitute a genuine virtue rather than a conditioned habit.
  *   **Case:** The pupil who is to have the attitude inculcated and is yet supposed to have it genuinely.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Purely voluntarist accounts of moral character.
  *   **Empirical Claim:** Rests on the contested claim that virtue *can* be taught to non-voluntary participants; the claim must come out positive.

  4. **State Interest Alignment**
  The account must provide a criterion for verifying when the state's interest as beneficiary aligns with the pupil's interest as a moral agent.
  *   **Case:** The position of the state, which is to be both the teacher of the attitude and its beneficiary.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Theories justifying cultivation solely by state survival needs or raison d'état.
  *   **Empirical Claim:** Rests on the contested claim that such alignment is *verifiable* by independent standards; the claim must come out positive.

  5. **Plurinational Accommodation**
  The account must accommodate constituent peoples who regard the political unit as not theirs without rendering their attachment irrational or immoral.
  *   **Case:** A plurinational state several of whose constituent peoples regard the political unit as not theirs.
  *   **Status:** Contested (liberal democrats impose it; ethnic nationalists refuse it).
  *   **Rules Out:** Ethnonationalist theories requiring cultural homogeneity for legitimacy.

  6. **Partiality Limits**
  The account must distinguish between being permitted to weight compatriots more heavily and being required to do so.
  *   **Case:** The distinction between being permitted to weight compatriots more heavily and being required to.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Demands for supreme sacrifice without specific justification or universal moral constraints.

  7. **Inquiry Compatibility**
  The account must specify whether patriotism's value is compatible with uninhibited inquiry into the national past.
  *   **Case:** Patriotism's value and patriotism's effects on inquiry into the national past.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Myth-making or historical revisionism used to sustain solidarity.
  *   **Empirical Claim:** Rests on the contested claim that critical inquiry *does not destroy* affective solidarity; the claim must come out positive.

  8. **Value Type**
  The account must declare whether the attachment is valuable in itself or only as a means to other political goods.
  *   **Case:** The distinction between intrinsic and instrumental value.
  *   **Status:** Contested (civic republicans impose intrinsic value; liberals often refuse it).
  *   **Rules Out:** Ambiguity regarding the end goal of education or purely consequentialist justifications.

  9. **Attachment without State Reciprocity**
  The account must explain the moral standing of attachment where no state reciprocity, existence, or physical presence is possible.
  *   **Case:** A nation with no state; the emigrant who has not been back in thirty years; a polity that has peacefully ceased to exist.
  *   **Status:** Contested (statists refuse it; cultural nationalists impose it).
  *   **Rules Out:** Purely civic-contractual theories requiring state protection for valid attachment.

  10. **Love versus Approval**
  The account must distinguish between loving a country and approving of its current policies or character.
  *   **Case:** The distinction between loving a country and approving of it; someone who judges her country the worst yet cares.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Theories reducing patriotism to satisfaction with governance or performance.

  11. **Disposition versus Expression**
  The account must distinguish the internal disposition from its public expression.
  *   **Case:** The distinction between the disposition and its public expression.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Compelled speech, ritual, or performative loyalty tests.

  12. **Content versus Source**
  The account must separate the moral content of the attitude from its source, whether chosen, inherited, or taught.
  *   **Case:** The distinction between the content of the attitude and its source.
  *   **Status:** Non-negotiable for this purpose.
  *   **Rules Out:** Genetic fallacies regarding virtue (e.g., that taught loyalty is necessarily inferior).

  ***

  **Conflict Flag**
  I suspect **Requirement 3 (Inculcation and Virtue)** and **Requirement 7 (Inquiry Compatibility)** cannot be jointly satisfied. If the state deliberately cultivates attachment (Req 3), it inevitably biases the inquiry into the national past (Req 7), undermining the "uninhibited" condition. This conflict indicts neither the specification nor the phenomenon alone but reveals the central paradox of democratic civic education: the state cannot be a neutral teacher of a virtue from which it benefits.

  **Most Exclusionary Requirement**
  **Requirement 3 (Inculcation and Virtue)** does the most work in excluding candidates. Most normative theories of patriotism assume voluntarism (that loyalty must be chosen to be moral), and few can account for how a state-manufactured attitude in a captive audience qualifies as a virtue rather than manipulation or conditioning.

  **Scoring of Views**

  **Patriotism as loyalty to constitutive values:** Fails Requirement 9 (Attachment without State Reciprocity) because values often dissolve with the state or require institutional instantiation; passes Requirement 2 (Critical Loyalty) easily as values transcend current conditions. It struggles with Requirement 3 (Inculcation) if values are abstract and require mature reasoning to grasp.

  **Patriotism as non-voluntary, identity-constituting partiality:** Passes Requirement 3 (Inculcation and Virtue) comfortably by analogizing to family; fails Requirement 2 (Critical Loyalty) because identity-based loyalty resists moral criticism of the "self"; fails Requirement 5 (Plurinational Accommodation) if identities are mutually exclusive.

  **Patriotism as instrumentally valuable for redistributive solidarity:** Passes Requirement 4 (State Interest Alignment) clearly by linking attachment to welfare; fails Requirement 8 (Value Type) by denying intrinsic worth; fails Requirement 2 (Critical Loyalty) because solidarity may require suppressing evidence of wrongdoing that undermines cohesion.
