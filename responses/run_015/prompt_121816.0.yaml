answer: |-
  Two stationary observers, Alice and Bob, occupy fixed points in a Newtonian universe where signals propagate at finite speed $c$. At absolute time $t=0$, simultaneous events $E_A$ and $E_B$ occur at their respective locations. Alice immediately experiences $E_A$ but remains epistemically isolated from $E_B$ until a signal arrives from Bob at $t=D/c$. The Block proponent argues that because $E_A$ is fixed for Alice while $E_B$ remains unverified yet physically determined, both must exist tenselessly within a static manifold to preserve the symmetry of their physical status despite the asymmetry of access.

  **Block Reasoning:** The argument leverages the tension between physical determinacy and epistemic access. Since Newtonian laws determine $E_B$ at $t=0$ just as rigidly as $E_A$, yet Alice cannot verify $E_B$ until later, the proponent claims reality cannot depend on verification. If $E_B$ is fixed but not "presently experienced," it must exist tenselessly alongside $E_A$ in a four-dimensional structure where "now" is merely an index of awareness, not ontology.

  **Presentist Reasoning:** The presentist insists that existence is confined to the absolute present slice. Because Newtonian time provides a privileged foliation, $E_B$ is genuinely happening *now* for Alice at $t=0$, regardless of her ignorance. The delay is purely informational, not ontological; the event exists presently, even if knowledge of it lags behind reality.

  **The Single Feature:** The argument's weight rests entirely on the existence of a **frame-independent fact of the matter about simultaneity**.

  **What Collapses:** If this feature is removed (i.e., switching to Special Relativity), the claim that "$E_B$ is happening now for Alice" loses absolute truth. Without a privileged "Now," Alice cannot assert $E_B$ is present without specifying a frame, allowing the Block proponent to argue that $E_B$'s reality is independent of any present slice, forcing the four-dimensional conclusion.

  **Presentist Attack:** The presentist defender attacks the inference from epistemic isolation to ontological tension. They argue that the Block proponent conflates *verification* with *existence*. In a Newtonian framework, the finite speed of signals creates ignorance, not non-existence. The presentist maintains that an event can be real and present without being known, rendering the epistemic delay irrelevant to the metaphysical structure of time.
