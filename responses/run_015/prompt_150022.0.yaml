prompt: |-
  hey, i've been lurking these forums for like a decade and this is probably too in the weeds but whatever.

  i run program evaluation for a small ngo that pitches behavior-change campaigns to universities and city councils — meatless mondays, bike-to-work nudges, local voter drives, staff flight offsets. every couple weeks i get a proposal and i have to tell the board whether it's worth our institutional credibilty to back it, given that one person's burger or vote doesn't move the needle on climate or election outcomes. classic inefficacy objection stuff, except the board is full of rationalist-adjacent people and they want something more rigorous than vibes.

  i need a reusable decision procedue — flowchart in words — that my review team (no philosphy phd, maybe 20 minutes per proposal, i sign off) can actually run. ground it in whatever moral philosphy actually says about individual contributions to collective harms, but don't lecture me. the key is handling three failure modes of the inefficacy objection: expected-value/threshold effects, signaling and coordination spillovers, and the normative 'do it anyway' layer. for each step say what counts as a sufficient answer, where we hard-stop with "no — don't back this as harm-reduction," and where we have to kick it to the board because it's values not facts. also flag the substitution-elasticity check — like, if people skip beef but the supply chain just redirects it, that's different from actually reducing slaughter.

  run it on three proposals:
  1. a "meatless monday" pledge for campus dining (this one should come back with an answer i don't love — i lean vegan but the procedue should probably say causal impact is below noise floor, back only if we explicitly frame it as values-expression not harm-reduction)
  2. a carpool mandate for a 200-person office to cut commute emissions
  3. a voter-turnout drive for a municipal race with about 8,000 registered voters

  say exactly what the procedue can't do — e.g., it won't settle whether collective-harm obligations exist in the first place, or whether we're picking the right counterfactual baseline. no bibliographies, no reading lists, don't quote anyone verbatim unless you can fetch the source. keep it practical.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Program evaluation lead for a small NGO.
      *   **Context:** Pitches behavior-change campaigns to universities/city councils (Meatless Mondays, bike-to-work, voter drives, etc.).
      *   **Problem:** Board is rationalist-adjacent, demands rigor over vibes. Needs to address the "inefficacy objection" (one person's action doesn't change the outcome).
      *   **Task:** Create a reusable decision procedure (flowchart in words) for the review team (non-philosophers, ~20 mins/proposal).
      *   **Requirements:**
          *   Grounded in moral philosophy regarding individual contributions to collective harms (without lecturing).
          *   Handle three failure modes: Expected Value/Thresholds, Signaling/Coordination, Normative "Do It Anyway".
          *   Include Substitution-Elasticity Check (supply chain redirection).
          *   Define sufficient answers, hard-stops ("No"), and board kick-ups (Values vs. Facts).
          *   Apply to three specific proposals (Meatless Monday, Carpool Mandate, Voter Turnout).
          *   State limitations (what the procedure *can't* do).
          *   No bibliographies/reading lists.
      *   **Tone:** Practical, direct, "in the weeds" but usable.

  2.  **Deconstruct the Philosophical Underpinnings (Internal Knowledge):**
      *   *Inefficacy Objection:* Based on the idea that individual actions often don't cross the threshold to cause a discrete harm (e.g., buying one chicken doesn't kill one chicken due to bulk ordering).
      *   *Expected Value (EV):* Even if probability is low, if impact is high, EV might be positive (Parfit, Nefsky).
      *   *Thresholds:* Tipping points exist (e.g., inventory triggers).
      *   *Signaling/Coordination:* Actions influence others (social norms).
      *   *Complicity/Integrity:* Doing the right thing regardless of outcome (Kantian/Virtue Ethics).
      *   *Substitution:* If I don't buy it, someone else will, or the supply adjusts.

  3.  **Drafting the Decision Procedure (The "Flowchart"):**
      *   Need a step-by-step logic gate system.
      *   *Step 1: The Causal Chain (Direct Impact).* Does this action physically reduce the harm? (Address Substitution/Elasticity here).
      *   *Step 2: The Threshold/EV Check.* Is there a non-zero probability of triggering a change?
      *   *Step 3: The Spillover Check.* Does this signal or coordinate others?
      *   *Step 4: The Integrity/Values Check.* If impact is negligible, is there a non-consequentialist reason to proceed?
      *   *Decision Nodes:* Pass, Fail, or Kick to Board.

  4.  **Refining the Steps (incorporating specific constraints):**
      *   *Substitution-Elasticity:* Needs to be early. If elasticity is 1.0 (perfect substitution), direct impact is zero.
      *   *Hard Stops:* Where do we say "No"? Probably when EV is near zero *and* no signaling *and* no values case.
      *   *Board Kick-ups:* When the decision relies on weighting values (e.g., "Is integrity worth the cost?") rather than empirical facts.

  5.  **Applying to the Three Proposals:**

      *   *Proposal 1: Meatless Monday (Campus).*
          *   *Elasticity:* High. Food services order in bulk. One student skipping one meal rarely changes orders.
          *   *Threshold:* Low probability of hitting a specific order reduction threshold.
          *   *Signaling:* Moderate. Normalizes vegetarianism.
          *   *Verdict:* Likely "No" on harm reduction, "Yes" only on values/signaling. Matches user's intuition.

      *   *Proposal 2: Carpool Mandate (200-person office).*
          *   *Elasticity:* Lower. Parking spaces are fixed. Fuel consumption is direct.
          *   *Threshold:* 200 people is a chunk. Reducing cars by 50% is measurable.
          *   *Signaling:* High. Institutional policy changes norms.
          *   *Verdict:* Stronger case for harm reduction.

      *   *Proposal 3: Voter Turnout (Municipal, 8k voters).*
          *   *Elasticity:* N/A (Votes are discrete).
          *   *Threshold:* High. 8k is small enough that a drive could swing it. Probability of being pivotal is higher than national.
          *   *Signaling:* Civic engagement norms.
          *   *Verdict:* Strong EV case.

  6.  **Addressing Limitations:**
      *   Can't solve the "Is climate change actually bad?" question.
      *   Can't determine the exact counterfactual (what would happen anyway).
      *   Can't weigh cost vs. benefit perfectly (budget constraints).

  7.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Tone Check:* Needs to be professional but conversational ("in the weeds"). No academic jargon without explanation.
      *   *Structure:*
          1.  Intro (acknowledge the decade lurking).
          2.  The Procedure (The "Inefficacy Stress Test").
          3.  Application to the 3 cases.
          4.  Limitations.
      *   *Specific Constraint:* "Don't lecture me" on philosophy. Keep it to the logic gates.
      *   *Specific Constraint:* "Flag substitution-elasticity." Make sure that's a distinct step.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for a 20-minute review?
      *   *Fix:* Simplify the language. Use "Yes/No/Uncertain" gates.
      *   *Critique:* Did I handle the "Board Kick-up" correctly?
      *   *Fix:* Explicitly label where the team stops and the Board starts. The Board decides *values weights*, the Team decides *causal probabilities*.
      *   *Critique:* Meatless Monday result.
      *   *Fix:* Ensure the procedure leads to the user's suspected outcome (low causal impact) but allows for the "values expression" bypass if the Board approves.

  9.  **Final Polish:** Check against all constraints one last time.
      *   Flowchart in words? Yes.
      *   3 failure modes handled? Yes (EV, Signaling, Normative).
      *   Substitution check included? Yes.
      *   3 proposals run? Yes.
      *   Limitations stated? Yes.
      *   No bibliographies? Yes.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your team. It strips the philosophy down to operational logic gates. It treats the "inefficacy objection" not as a philosophical debate, but as a risk assessment on causal claims.

  ### The Inefficacy Stress Test (Decision Procedure)

  **Timebox:** 20 minutes per proposal.
  **Goal:** Determine if the proposal clears the bar for *Harm Reduction* (causal impact) or if it must be reclassified as *Values Expression* (signaling/integrity).

  #### Step 1: The Substitution-Elasticity Check (The "Waterbed" Test)
  *Question:* If the target behavior changes, does the physical harm decrease, or does the supply/demand shift elsewhere?
  *   **Look for:** Bulk ordering thresholds, inventory buffers, secondary markets, or displacement.
  *   **Sufficient Answer:** "Supply chain data shows orders are adjusted per unit" OR "Capacity is fixed (e.g., parking spots, seats), so reduction equals less usage."
  *   **Hard Stop:** If elasticity is near 1.0 (e.g., one person skips beef, cafeteria orders same amount, food is wasted or sold elsewhere), you cannot claim direct harm reduction.
  *   **Board Kick-Up:** If elasticity is uncertain but theoretically low (e.g., long-term market signaling), kick to Board for risk tolerance.

  #### Step 2: The Threshold & Expected Value (EV) Check
  *Question:* Is there a non-negligible probability that this specific campaign crosses a causal threshold?
  *   **Look for:** Tipping points (e.g., election margins, inventory triggers, policy adoption quotas). Calculate: *(Probability of triggering change) × (Magnitude of change)*.
  *   **Sufficient Answer:** "Campaign targets a group size where a X% shift triggers a policy/order change" OR "EV is positive even with low probability because the stakes (e.g., election outcome) are high."
  *   **Hard Stop:** If the target population is too large relative to the intervention (e.g., 100 people pledging in a city of 1M) and no threshold mechanism exists.
  *   **Board Kick-Up:** If the EV is positive but tiny (below noise floor), kick to Board. This is where they decide if "doing something" is worth the reputational cost.

  #### Step 3: The Spillover & Coordination Check
  *Question:* Does this action increase the likelihood of *others* taking similar actions (signaling/norms)?
  *   **Look for:** Public commitments, institutional policy changes, visible behaviors, network effects.
  *   **Sufficient Answer:** "Participation is public/visible" OR "Institutional mandate changes default options for non-participants."
  *   **Hard Stop:** Private, anonymous actions with no social component in a low-trust environment.
  *   **Board Kick-Up:** Estimating the "multiplier effect" of norms is speculative. If the direct impact (Step 1 & 2) failed, but spillover is the main pitch, kick to Board.

  #### Step 4: The Normative "Do It Anyway" Check
  *Question:* If causal impact is negligible, is there a non-consequentialist reason to proceed?
  *   **Look for:** Complicity avoidance, integrity, alignment with mission statement regardless of outcome.
  *   **Sufficient Answer:** "Backing this aligns with our public stance on X, even if X isn't solved by this specific project."
  *   **Hard Stop:** If the campaign contradicts other org values or creates reputational hypocrisy.
  *   **Board Kick-Up:** **ALWAYS.** The review team cannot decide on values-weighting. If the proposal fails Steps 1–3 and relies entirely on Step 4, it requires Board authorization to back something as "Values Expression" rather than "Harm Reduction."

  ---

  ### Application to Proposals

  #### 1. Campus "Meatless Monday" Pledge
  *   **Step 1 (Elasticity):** **FAIL.** Campus dining orders protein in bulk weekly/monthly. One student skipping one meal rarely alters the order quantity; the food is often wasted or substituted. Supply chain redirection is high.
  *   **Step 2 (Threshold/EV):** **FAIL.** Unless the pledge guarantees a specific % of total meals (e.g., 30% of dining hall traffic), the probability of triggering a permanent menu change is below the noise floor.
  *   **Step 3 (Spillover):** **PASS.** Public pledges normalize vegetarianism. Visible behavior change influences peers.
  *   **Step 4 (Normative):** **PASS.** Aligns with climate/animal welfare mission.
  *   **Verdict:** **Kick to Board.**
      *   *Recommendation:* Do not market this as *harm reduction* (carbon/meat saved). The math doesn't hold. Market it as *community building/values expression*. If the Board insists on backing it as harm reduction, flag the elasticity risk in the memo.

  #### 2. Office Carpool Mandate (200-person office)
  *   **Step 1 (Elasticity):** **PASS.** Parking spaces are fixed. Fuel consumption is direct. If 50 cars become 25, 25 cars' worth of fuel is not burned. No secondary market for "unused commute emissions."
  *   **Step 2 (Threshold/EV):** **PASS.** 200 people is a discrete unit. A mandate creates a guaranteed reduction, not a probabilistic one. 100 cars removed is a measurable tonnage drop.
  *   **Step 3 (Spillover):** **PASS.** Institutional policy shifts norms more than individual pledges. Sets a precedent for other local businesses.
  *   **Step 4 (Normative):** **N/A** (Passed on causal grounds).
  *   **Verdict:** **Green Light.**
      *   *Recommendation:* Back as harm reduction. The causal chain is tight, elasticity is low, and the unit size allows for measurable thresholds.

  #### 3. Municipal Voter Turnout Drive (8,000 registered voters)
  *   **Step 1 (Elasticity):** **N/A.** Votes are discrete. One vote is one vote.
  *   **Step 2 (Threshold/EV):** **PASS.** In a race with 8,000 registrants, turnout is likely low (e.g., 2,000 votes). Margins are often <100 votes. The probability of the drive being pivotal is orders of magnitude higher than state/national races. EV is positive.
  *   **Step 3 (Spillover):** **PASS.** Increases civic habit formation.
  *   **Step 4 (Normative):** **N/A** (Passed on causal grounds).
  *   **Verdict:** **Green Light.**
      *   *Recommendation:* Back as harm reduction (assuming the preferred outcome is objectively beneficial per org mission). The "inefficacy objection" fails here because the threshold for impact is reachable.

  ---

  ### What This Procedure Cannot Do

  1.  **Set the Counterfactual Baseline:** It assumes your team can accurately guess what happens *without* the intervention. If the city would have mandated carpooling anyway, your attribution is wrong. The procedure tests the *logic*, not the *baseline reality*.
  2.  **Settle Collective-Harm Obligations:** It doesn't answer "Do we have a duty to act if impact is tiny?" It simply routes that question to the Board (Step 4).
  3.  **Validate Moral Goodness:** It treats "harm reduction" as a technical metric (tons of CO2, number of animals, election outcomes). It does not adjudicate whether winning a specific municipal race is actually "good."
  4.  **Account for Opportunity Cost:** It evaluates the proposal in isolation. It doesn't tell you if the money/time is better spent on a different proposal that passed the same test.

  **Usage Note:** When kicking to the Board, use the specific language: *"This proposal fails the Causal Impact Gate (Steps 1-2) but passes the Values Gate (Step 4). Requesting authorization to back as Values Expression only."* This protects your team's credibility when the impact inevitably fails to materialize.
