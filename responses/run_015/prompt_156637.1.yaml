answer: |-
  Your lawyer friend is half-right: you have a Hartian holding (*Marrin*) sitting uneasily beside Fullerian holdings (*Tessaro, Old Mill, Vell*), with *Dolman* acting as a bridge. The "flip-flop" accusation arises because *Marrin* says "validity $\neq$ morality," while *Tessaro* and *Vell* imply "procedure = validity."

  However, you have not actually flip-flopped. You have accidentally written a court that adheres to a specific synthesis: **Law as a System of Guidance.** Your Chamber believes law is a tool for planning human conduct. If the tool is broken (unpublished, impossible, retroactive), it isn't law (*Tessaro, Old Mill, Vell, Dolman*). If the tool works but is used for evil, it is still a tool, and the Court lacks the power to smash it, only to mitigate the harm (*Marrin*).

  Here are the three rules that fit your precedents, their predictions for *Verrine*, and the consequences for your series.

  ### Rule A: The Guidance Principle (Procedural Legitimacy)
  **The Rule:** A rule is law if it allows a subject to know what is required and comply. If it meets these procedural standards, it is valid regardless of moral content (*Marrin*). However, the State cannot punish reliance on valid rules by changing the score retroactively (*Dolman*).
  **Prediction for Verrine:** **REFUSE.**
  **The Opinion's Admission:** The Chamber must admit that Decree 14 was valid law when Verrine signed it (per *Marrin*). Therefore, Verrine had a legal duty to transport the prisoners. Section 7 attempts to criminalize the fulfillment of a legal duty. While the outcome is morally repugnant, applying Section 7 violates the principle of non-retroactivity established in *Dolman*. The Court acquits Verrine of the Section 7 charge, perhaps noting that the "extra boxcar" is evidence of moral guilt but not legal culpability under a retroactive statute.
  **Series Consequence:** This establishes your Court as a guardian of *process* over *outcome*. In future novels, the Court will protect villains on technicalities if the State breaks its own procedural rules. It creates high tension between "Law" and "Justice."

  ### Rule B: The Radbruch Threshold (Substantive Justice)
  **The Rule:** Procedural validity creates a presumption of law, but extreme substantive injustice voids that presumption. *Marrin* was "nasty," but deportation is "intolerable." The Transitional Justice Statute's declaration that Decree 14 was void *ab initio* is accepted as a corrective to a legal system that temporarily ceased to be "law."
  **Prediction for Verrine:** **APPLY.**
  **The Opinion's Admission:** The Chamber must distinguish *Marrin*. It would say, "Denouncing an employer is wicked; facilitating genocide is a crime against humanity that no decree can authorize." It must admit that this overrides *Dolman*'s protection of reliance, arguing that one cannot rely on a "law" that was, in truth, a criminal conspiracy.
  **Series Consequence:** This turns your Court into a moral arbiter. In future novels, the Court can strike down any statute it deems "intolerably unjust." This gives them immense power but risks making them look like a second legislature. It resolves the *Verrine* moral dilemma but creates inconsistency with *Marrin* unless *Marrin* is explicitly limited.

  ### Rule C: The Discretionary Excess Doctrine (Agency)
  **The Rule:** Compliance with a valid order is a defense; voluntary aggravation is not. The Court looks not at the validity of the decree, but at the agency of the defendant.
  **Prediction for Verrine:** **APPLY.**
  **The Opinion's Admission:** The Court admits Decree 14 was valid (*Marrin*), so Verrine cannot be punished for the transport itself. However, Section 7 criminalizes "organising transport." The Court rules that adding the boxcar transformed the act from ministerial compliance to discretionary cruelty. The conviction rests on the *excess*, not the *order*.
  **Series Consequence:** This is a factual escape hatch. It works for *Verrine* but is hard to generalize. It forces you to write future defendants as either purely ministerial (acquitted) or discretionary (convicted). It avoids the big philosophical fight but relies heavily on specific facts.

  ### Which Rule Is Your Bench Actually Running?
  **Rule A.**
  Your precedents are overwhelmingly procedural. *Tessaro* (publication), *Old Mill* (possibility), *Vell* (clarity), and *Dolman* (retroactivity) are all about the *form* of law, not the *substance*. *Marrin* is the keystone: it explicitly rejects the idea that wickedness equals invalidity. To convict Verrine under Rule B, you would have to overrule *Marrin* or pretend *Dolman* doesn't exist.
  The most consistent narrative arc for a Supreme Chamber in a transitioning state is the tragic one: they uphold the Rule of Law even when it protects the guilty, because they believe breaking the Rule of Law to punish the guilty destroys the new democracy.

  ### The Chapter 22 Test Case
  To force these rules apart, write **In re The Clerk**.
  **Facts:** A low-level clerk in Month 6 of the Council stamped property confiscation forms. The decree was published, clear, and prospective. The clerk had no discretion; the stamp was automatic. No "extra boxcar."
  **The Split:**
  *   **Under Rule A (Guidance):** **Acquittal.** The clerk relied on valid law. Punishing him is retroactive.
  *   **Under Rule B (Radbruch):** **Conviction.** The confiscation regime was intolerably unjust; participation is complicity.
  *   **Under Rule C (Discretion):** **Acquittal.** No agency was exercised.
  This case strips away the "extra boxcar" distraction and forces the Court to decide if *following valid evil law* is itself a crime.

  ### Which Precedent Does the Most Work?
  **Dolman v. Revenue.**
  *Marrin* gets the attention, but *Dolman* is the shield. *Marrin* says the old decree was valid. *Dolman* says the new statute cannot reach back to punish reliance on that validity. Without *Dolman*, *Marrin* would allow the conviction (because the act was illegal under the *new* statute). *Dolman* is the only thing protecting Verrine from the consequences of *Marrin*.

  ### Honest Assessment of Underdetermination
  Your precedents *do* underdetermine the moral outcome, but they determine the *legal* one. If you want Verrine convicted, you must have your Court explicitly embrace Rule B and admit they are departing from *Marrin* and *Dolman* due to the unique horror of the camps. This is a "Constitutional Moment" ruling. If you want them consistent, Verrine walks (on the Section 7 charge).
  If you convict him using Rule A (via the boxcar), you risk a logical stumble: Section 7 criminalizes the *transport*, not the *boxcar*. If the transport was legal (*Marrin*), Section 7 cannot criminalize it retroactively (*Dolman*), regardless of the boxcar. The boxcar is aggravating, not jurisdictional.
  **Recommendation:** For a series about law, let him walk on the statutory charge. It preserves the Court's integrity for Book 2 and 3. It allows you to explore the *cost* of the Rule of Law, which is richer territory than a straightforward conviction.

