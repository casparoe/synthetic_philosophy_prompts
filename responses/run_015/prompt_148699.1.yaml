  ### Decomposition of Reasoning

  **(i) Is presentism about harm correct?**
  *Probability: 0.30*
  Presentism about harm (the claim that a subject can only be harmed at times when they exist) is a minority view in contemporary ethics. Most accounts of well-being (e.g., Parfit's time-relative interests, or objective list theories) allow for relations across temporal boundaries. We intuitively judge that posthumous betrayal harms the deceased, suggesting harm is a property of a life-narrative, not just a momentary state. Eternalism or four-dimensionalism about persons better accommodates the deprivation account. I assign a low probability here because the "existence requirement" strikes me as metaphysically too restrictive to capture our ethical concepts of harm.

  **(ii) Under presentism, does the 'no-subject' objection defeat deprivation?**
  *Probability: 0.90*
  *Conditional on (i) being true.* If we grant the strict definition of Presentism provided in the thesis (harm requires simultaneous subject and state), the inference is nearly deductive. If the subject does not exist at the time of the deprivation, and harm *requires* a subject at the time of the harm, then death cannot be a harm. Workarounds (e.g., claiming the harm occurs *before* death as a prospective property) tend to violate the strict simultaneity clause of the prompt's definition. Thus, if Presentism holds, the Epicurean conclusion follows robustly.

