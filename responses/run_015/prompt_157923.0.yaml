answer: |-
  ### The Diagnostic Instrument

  Below are eight binary nodes. Each is phrased as a concrete case or a single claim. Students answer 'Yes' (Agree/Permissible) or 'No' (Disagree/Impermissible/Ban').

  1.  **Kidney Vendor:** A poor but unpressured adult sells a kidney to a stranger for £50,000. Is this transaction morally permissible for the seller?
  2.  **Kidney Purchaser:** In that same case, is it morally permissible for the wealthy buyer to purchase the kidney?
  3.  **Desperation:** If the seller were desperate rather than merely poor, would their consent make the transaction valid?
  4.  **Disaster Pricing:** During a hurricane, an automated system raises water prices to clear stock. No human intends profit. Is the price rise permissible?
  5.  **Vote Selling:** Citizens may sell their votes if receipts are verifiable. Should this be legally banned?
  6.  **Priority Scheme:** Donors get priority on the transplant list (no money changes hands). Is this preferable to a pure gift system?
  7.  **Remedy:** The state should prohibit kidney sales entirely rather than channel them through a non-price allocation.
  8.  **Binding:** Opposition to kidney sales should be enforced by law rather than left to individual conscience.

  ### The Combinatorial Space

  With eight binary questions, the theoretical answer space contains 256 combinations (2⁸). Most of these combinations are philosophically unstable or empirically empty. The diagnostic tree functions by collapsing this space into six coherent leaves (positions).

  ### The Leaves (Positions)

  The following six positions represent the stable clusters of answers where students typically land.

  **1. The Unrestricted Liberal**
  *   **Signature:** Q1(Yes), Q2(Yes), Q4(Yes), Q5(No Ban), Q6(Yes), Q7(Disagree), Q8(Disagree).
  *   **View:** Markets are efficient and liberty-preserving. Consent validates transfer even under inequality. The state should not interfere with voluntary exchange unless rights (like voting) are structurally compromised, and even then, preference is for non-legal norms.

  **2. The Commodity Segregationist**
  *   **Signature:** Q1(Yes), Q2(Yes), Q4(Yes), Q5(Ban), Q6(Yes), Q7(Disagree), Q8(Disagree).
  *   **View:** Distinguishes sharply between economic goods and civic rights. Kidney sales and disaster pricing are permissible mechanisms for allocation, but vote selling corrupts the political structure. Objections are matters of conscience, not law.

  **3. The Monetisation Objector**
  *   **Signature:** Q1(No), Q2(No), Q4(No), Q5(Ban), Q6(Yes), Q7(Disagree), Q8(Disagree).
  *   **View:** The objection attaches to the money form, not the transfer itself. Incentives (Priority Scheme) are acceptable, but cash commodification (Kidney, Disaster Water) degrades the good. However, this degradation is not sufficient to warrant legal prohibition.

  **4. The Paternalist Prohibitionist**
  *   **Signature:** Q1(No), Q2(No), Q3(No), Q4(No), Q5(Ban), Q6(No), Q7(Agree), Q8(Agree).
  *   **View:** Transfers of this kind are inherently harmful or coercive. Desperation invalidates consent. The market mechanism itself is the problem (hence Q6 No). The state must prohibit these exchanges to protect agents from themselves and society from corrosion.

  **5. The Asymmetric Moralist**
  *   **Signature:** Q1(Yes), Q2(No), Q3(Yes), Q4(Yes), Q5(Ban), Q6(Yes), Q7(Disagree), Q8(Disagree).
  *   **View:** Repugnance runs primarily against the buyer/exploiter, not the seller/agent. Selling a kidney is an exercise of agency; buying one is an exercise of domination. Disaster pricing is acceptable (impersonal), but vote selling is not (corrupts equality).

  **6. The Private Moralist**
  *   **Signature:** Q1(No), Q2(No), Q3(No), Q4(Yes), Q5(Ban), Q6(Yes), Q7(Disagree), Q8(Disagree).
  *   **View:** The transaction is morally wrong for the individual (perhaps due to dignity or virtue), but the law should not enforce this moral view. Disaster pricing is acceptable (efficiency), but kidney sales are not. The remedy is social stigma, not criminalisation.

  ### Empty and Incoherent Combinations

  Several regions of the 256-combination space are unoccupied because they represent logical incoherencies or unattractive positions.

  **The 'Permissible but Illegal' Cluster (Incoherent)**
  *   **Combination:** Q1(Yes) [Morally Permissible] + Q7(Agree) [State Should Prohibit].
  *   **Status:** Incoherent.
  *   **Reasoning:** In the context of commodification seminars, students rarely argue that an act is morally permissible for the agent but should be criminally prohibited by the state, absent a specific spillover harm (which Q4 and Q5 test separately). Holding Q1(Yes) and Q7(Agree) simultaneously usually indicates a misunderstanding of the question or a hidden premise about externalities not captured by the tree.

  **The 'Channel but Reject' Cluster (Unattractive)**
  *   **Combination:** Q6(No) [Priority Scheme Not Preferable] + Q7(Disagree) [Should Not Prohibit/Should Channel].
  *   **Status:** Merely Unattractive/Unstable.
  *   **Reasoning:** If one rejects the priority scheme (Q6 No), one typically favours either a pure market or a pure gift/prohibition model. To argue for 'channelling' (Q7 Disagree) while rejecting the specific non-price channel offered (Q6 No) requires a third, unspecified mechanism. Students occupying this space usually migrate to Prohibition (Q7 Agree) upon reflection.

  **The 'Desperation Cure' Void (Unexplored)**
  *   **Combination:** Q1(No) [Poor Seller Impermissible] + Q3(Yes) [Desperate Seller Valid].
  *   **Status:** Unexplored.
  *   **Reasoning:** It is rare to find a student who argues that poverty invalidates consent but desperation validates it. Standard positions hold that desperation exacerbates the coercion of poverty, or that neither matters. This combination implies that being 'merely poor' is a greater barrier to valid consent than being 'desperate', which lacks a theoretical foothold in the literature.

  ### Indistinguishable Leaves

  **The 'Utilitarian' and 'Libertarian' Collapse**
  *   **Leaves Involved:** The Unrestricted Liberal (Leaf 1).
  *   **Flag:** This tree cannot in principle separate a student who supports kidney sales because they maximise overall welfare (Utilitarian) from one who supports them because they respect bodily autonomy (Libertarian). Both answer 'Yes' to Q1, Q2, and Q4, and 'No' to Q5 (Ban). Their substantive justifications differ, but their diagnostic output is identical. To separate them would require a node asking about the *reason* for the permission, which violates the constraint to use only cases/claims.

  ### Tracing Answer Patterns

  To verify the key discriminates, consider two contrasting student profiles.

  **Student A: The Paternalist**
  *   **Q1 (Kidney Vendor):** No. (Worried about harm to the poor).
  *   **Q2 (Kidney Purchaser):** No. (Worried about exploitation).
  *   **Q3 (Desperation):** No. (Consent does not cure coercion).
  *   **Q4 (Disaster Pricing):** No. (Prices should not ration essential goods).
  *   **Q5 (Vote Selling):** Ban. (Democratic integrity).
  *   **Q6 (Priority Scheme):** No. (Incentives corrupt altruism).
  *   **Q7 (Remedy):** Agree. (State must prohibit).
  *   **Q8 (Binding):** Agree. (Law must enforce).
  *   **Result:** Routes to **Leaf 4 (Paternalist Prohibitionist)**. The student is identified as seeking legal protection against market encroachment on the body and essential goods.

  **Student B: The Monetisation Objector**
  *   **Q1 (Kidney Vendor):** No. (Money degrades the body).
  *   **Q2 (Kidney Purchaser):** No. (Money degrades the relationship).
  *   **Q3 (Desperation):** Yes. (If it weren't for the money, consent would be valid).
  *   **Q4 (Disaster Pricing):** No. (Money is the wrong allocator here).
  *   **Q5 (Vote Selling):** Ban. (Rights are not for sale).
  *   **Q6 (Priority Scheme):** Yes. (Non-cash incentives are acceptable).
  *   **Q7 (Remedy):** Disagree. (Should channel, not prohibit).
  *   **Q8 (Binding):** Disagree. (Leave to conscience/norms).
  *   **Result:** Routes to **Leaf 3 (Monetisation Objector)**.

  **Discrimination Check:**
  Both students answer 'No' to the Kidney Sale (Q1) and Disaster Pricing (Q4). A simpler diagnostic might group them together as 'Anti-Market'. However, this tree separates them at Q6 (Priority Scheme) and Q7 (Remedy). Student A rejects the priority scheme and demands prohibition; Student B accepts the priority scheme and rejects prohibition. The tree successfully isolates the *object* of the objection (the transfer itself vs. the money form) and the *remedy* (law vs. channelling).
