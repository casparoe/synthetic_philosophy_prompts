      *   *Tone:* Academic but sharp, avoiding platitudes. Willing to say "the theory fails here."
      *   *Key Insight:* The distinction between *conspiracy* (the event) and *conspiracy theory* (the label). Watergate shows that "conspiracy theory" is often a political slur used by compromised authorities, not a neutral epistemic category.

