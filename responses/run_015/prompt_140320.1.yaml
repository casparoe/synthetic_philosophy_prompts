answer: |-
  **GLOBAL PRIORITY SETTING — FINAL EXAMINATION**
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,200 words maximum
  **Total Marks:** 30

  **Question 1**

  A foundation has a single non-recurring grant of $50M to allocate this year. Its trustees' fallback use is Cause C. Treat welfare units (WU) as fully comparable across causes; ignore timing and discounting.

  **Cause A (Parasitic Infection Control):** Fully solving the problem is worth 12,000 WU. Returns are constant: every additional $1M solves 1% of the problem (120 WU), up to complete solution at $100M cumulative funding. Cumulative funding to date: $30M. Current annual funding: $10M. No other funder behaviour changes in response to your grant.

  **Cause B (Livestock Disease Eradication):** Fully solving the problem is worth 1,000,000 WU, but 99% is already solved. If eradicated this year, the benefit is 10,000 WU (residual 1%) plus 15,000 WU from permanently avoiding resurgence. Eradication requires an indivisible one-off $50M campaign; any smaller contribution yields 0 WU. Current funding: $2,000M/year routine vaccination, continuing until eradication.

  **Cause C (Scholarships — Default):** Worth 500,000 WU if fully solved. Each additional $1M solves 0.06% of the problem (300 WU) over the relevant range. Current annual funding: $500M. Divisible, no crowding out.

  **(a)** Rank the three uses of the $50M grant with calculated WU values. How does this ranking change if the foundation had only $1M to give? (8 marks)

  **(b)** Apply the ITN heuristic as usually taught (rating each factor then multiplying). Compare its ranking with your answer in (a). Explain precisely what single quantity the framework is *trying* to estimate, what each factor stands in for, and why the heuristic ranking diverges from the correct ranking in this case. (8 marks)

  **(c)** In light of (b), say what "neglectedness" would have to mean for it to be more than a crude proxy. Redefine it, or argue the framework should drop it. (6 marks)

  **(d)** If eradication happens, the $2,000M/year routine vaccination stops. Should that be counted in Cause B's benefit, and if so, how? (8 marks)

  ***

  **MODEL ANSWER**

  With a $50M grant, the ranking is Cause B (25,000 WU), Cause C (15,000 WU), then Cause A (6,000 WU); with a $1M grant, the ranking shifts to Cause C (300 WU), Cause A (120 WU), then Cause B (0 WU).

  These figures derive from marginal expected value, not total importance. For Cause A, returns are constant at 120 WU/$M; $50M yields 6,000 WU, and $1M yields 120 WU. For Cause C, returns are constant at 300 WU/$M; $50M yields 15,000 WU, and $1M yields 300 WU. For Cause B, the technology is lumpy. The marginal benefit of the specific $50M intervention is the residual 10,000 WU plus 15,000 WU avoided loss, totaling 25,000 WU. However, this requires the full threshold; a $1M contribution fails to trigger eradication, yielding 0 WU.

  Standard ITN application typically ranks Cause B first regardless of grant size. Users assign B high Importance (1,000,000 WU total), moderate Tractability (99% solved), and low Neglectedness (high current funding), but the high Importance score dominates the multiplication. Cause C often ranks second due to moderate Importance and high Neglectedness relative to B. Cause A ranks last due to low total Importance. This heuristic fails because it estimates *average* value per unit of problem solved rather than *marginal* value per unit of currency invested. Importance proxies for total scale, Tractability for probability of success per resource, and Neglectedness for diminishing returns. However, when returns are non-linear (lumpiness in B) or when total scale is decoupled from marginal room (B's high funding vs. high marginal value), the product of averages misrepresents the marginal derivative. Specifically, ITN treats the $2,000M existing funding in B as reducing marginal value, whereas here it is a sunk cost maintaining the status quo until the marginal $50M tips the system.

  Consequently, "neglectedness" must be redefined from "total current funding" to "marginal absorptive capacity at high return." In Cause B, despite $2,000M annual funding, the neglectedness of the *final step* is absolute; no one is funding the eradication campaign. In Cause A and C, neglectedness correctly proxies for diminishing returns, but only if the funding curve is known. If the framework cannot distinguish between "neglected because无人 cares" and "neglected because it is a threshold public good," it should drop the factor in favour of direct marginal value estimation. Neglectedness is only useful as a heuristic for where the marginal return curve has not yet flattened; in threshold cases, it is misleading.

  Regarding the $2,000M routine funding, this should be counted as a benefit only if those resources are redirected to other welfare-positive activities. The cessation of spending is not intrinsically valuable; value arises from the opportunity cost of those funds. If governments save the $2,000M and dissipate it on transfers or inefficient projects, the WU gain is negligible. If they redeploy it to the next best global priority, the benefit is the marginal value of $2,000M in that alternative use. Given the scale ($2,000M vs. the 25,000 WU direct benefit), this counterfactual likely dwarfs the direct eradication benefit. However, without assurance of redeployment, it cannot be automatically added to Cause B's WU. The framework must account for the general equilibrium effect of releasing constrained resources, not just the direct output of the intervention.

  ***

  **MARKING SCHEME**

  | Point | Marks | Must-Hit Requirement | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Marginal Valuation ($50M)** | 6 | Correctly calculates A=6k, B=25k, C=15k and ranks B>C>A. | Using total importance (1M WU for B) or averaging returns over total problem size rather than grant size. |
  | **2. Marginal Valuation ($1M)** | 6 | Correctly calculates A=120, B=0, C=300 and ranks C>A>B, citing lumpiness. | Assuming linear returns for B (e.g., 500 WU) or failing to flip the ranking based on grant size. |
  | **3. Target Quantity & ITN Gap** | 6 | Identifies target as *Marginal Expected Value*; explains ITN fails by averaging over total space/ignoring thresholds. | Stating ITN is "wrong" without identifying the target quantity (marginal vs. average) or claiming ITN estimates total impact. |
  | **4. Neglectedness Redefinition** | 6 | Redefines neglectedness as *marginal absorptive capacity* or *room for more funding at high returns*, not total spend. | Defining neglectedness solely as "low current funding" or arguing it should be dropped without proposing a functional alternative. |
  | **5. Counterfactual Resources** | 6 | Argues released funding is valuable *only if* redirected to positive uses (opportunity cost), not automatically. | Adding the $2,000M directly to WU as a cost-saving without considering the counterfactual use of those funds. |
  | **Total** | **30** | | |
