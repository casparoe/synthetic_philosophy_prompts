answer: |-
  Here is the breakdown of how Marta is likely to handle your case, the rules at play, and an assessment of your proposed follow-up.

  ### 1. Prediction: What Marta Will Say
  Marta will almost certainly say **Yes, the pipeline is part of their minds.**

  She has already ruled that a pocket calculator counts, even when the user doesn't check the work and doesn't understand the circuitry doing the division. To her, the pipeline is just a more complex calculator. The students treat it as a reliable extension of their cognitive grip on the samples: they consult it automatically, they trust the output more than their own intuition, and it is always there on the server. The fact that the original author is gone and the code is opaque mirrors the fact that none of us know how our neurons fire to produce memory, yet we trust them.

  ### 2. The Two Rules
  You are right that her stated criteria (availability, endorsement, ease) don't fully explain the split between the **Calculator** (Yes) and the **Wife** (No). Both are available, both are endorsed, and both are easy to consult. The hidden distinction lies in *why* they are endorsed.

  **Rule A: Functional Glue (Marta's Apparent Rule)**
  *   **The Gist:** If an external resource functions reliably as a cognitive prop and is integrated into your daily workflow without constant friction, it is part of your mind.
  *   **The Logic:** It doesn't matter *how* the resource works or who made it, only that it holds the information steady for you.
  *   **Why Calculator is Yes:** It holds the math steady.
  *   **Why Wife is No:** Marta likely views testimony as a *new* input event every time, not a storage retrieval. Asking your wife is like reading a new book; accessing your phone contacts is like recalling a memory.
  *   **Verdict on Pipeline:** **Yes.** It functions as memory storage. The opacity of the code is irrelevant, just as the opacity of neural synapses is irrelevant to you.

  **Rule B: Intelligible Traceability (The Rival Rule)**
  *   **The Gist:** A resource is part of your mind only if you *could*, in principle, trace the justification for the information yourself, even if you don't actually do it.
  *   **The Logic:** You can outsource the *processing*, but not the *authority*. You must remain the ultimate epistemic owner of the claim.
  *   **Why Calculator is Yes:** Long division has a public, checkable logic. If the calculator gave a weird result, you *could* grab a pad and paper and verify the process. The "truth" of the math is accessible to you.
  *   **Why Wife is No:** You cannot verify her memory. You can only ask her again (more testimony). You have no independent access to the source of her knowledge.
  *   **Verdict on Pipeline:** **No.** The students cannot trace the constants. One tried and failed. The "truth" of the concentration is locked inside a black box written by a ghost. They are not thinking; they are obeying.

  ### 3. Evaluating Your "Notebook Variant"
  You asked if bringing the case where the postdoc's notebook turns up (with full derivations) separates these rules.

  **It does not.** In fact, it muddies the water.

  *   **Under Rule A (Functional Glue):** The verdict stays **Yes**. The students still trust it, still don't check it, and it's still available. The existence of the notebook doesn't change their actual workflow.
  *   **Under Rule B (Traceability):** The verdict flips to **Yes**. Because the derivations exist, the students *could* check the work if they needed to. The "black box" is now a "closed box with a key."

  Since both rules yield a **Yes** on the Notebook Variant, bringing this case won't force Marta to choose between them. It creates a consensus, not a conflict. It tells you that *if* the knowledge is recoverable, everyone agrees it's mental. But it doesn't help you fight the corner on the original case where the knowledge is *lost*.

  ### 4. The Cleanest Case to Separate Them
  The **Original Pipeline case** you already have is actually the cleanest separator, provided you frame the "failed attempt" sharply.

  To make the distinction undeniable, you need to ensure Marta cannot wiggle out by saying, "Well, they *could* check it if they tried harder." You need to establish that the process is **opaque**, not just difficult.

  **Suggested Tweak to Your Original Case:**
  When you present the pipeline, emphasize that the calibration file relies on a specific, proprietary algorithm from a machine that no longer exists, or that the constants are derived from a standard that has since been withdrawn. Make it clear that **verification is not just unused, but impossible** for the current students.

  *   **If Marta says Yes:** She commits to Rule A (Functional Glue). She accepts that we can think using tools we don't understand and can't check.
  *   **If Marta says No:** She commits to Rule B (Traceability). She admits that understanding the "why" is necessary for the tool to be part of the mind.

  **If you want a follow-up case for the *next* session (after the Pipeline):**
  Bring the **"Drifted Instrument"** case.
  *   *Scenario:* The students use the pipeline (Rule A says it's part of their mind). But unbeknownst to them, the script has a bug that introduces a 5% drift. They trust it absolutely.
  *   *Question:* Is the *incorrect* concentration still part of their mind?
  *   *Why this helps:* Rule A (Functional Glue) struggles here. If the tool is unreliable, is it still mental? Marta's criteria say "reliably available." If it's drifting, is it reliable?
  *   Rule B (Traceability) handles this easily: It was never part of their mind because the justification was false/untraceable.
  *   This tests whether "reliability" is a condition for being part of the mind, or just a condition for being *good* at thinking.

  ### Summary Advice
  Stick with your **Original Pipeline** for next week. It is the wedge.
  *   It aligns with the **Calculator** (trust, no checking).
  *   It aligns with the **Wife** (opacity, other-agent origin).
  *   It forces Marta to decide which alignment wins.

  Save the **Notebook Variant** for later. Use it only if Marta rejects the Original Pipeline because "they can't check it." Then you can say: "Okay, suppose the notebook existed. Would that make it mental?" That confirms whether she holds Rule B. But if you lead with the Notebook, you let her off the hook.
