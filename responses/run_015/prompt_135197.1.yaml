answer: |-
  Dear Colleague,

  It is a pleasure to engage with a query of this calibre. You are grappling with one of the most persistent and thorny problems in utilitarian scholarship: the tension between aggregate welfare and individual inviolability. Your reading is not without merit—indeed, it echoes criticisms levied by deontologists and critical theorists alike—but I suspect the wall you have hit stems from a slight category error regarding how Bentham applies the calculus to *interpersonal* dynamics versus *intrapersonal* experiences.

  To assist your drafting, I have structured this response to distinguish between what is broadly settled in the literature and where significant scholarly contention remains, followed by an analysis of the specific presupposition regarding consent and coercion.

  ### I. Settled Scholarship: Bentham's Sexual Liberalism

  There is a robust consensus, established largely following Louis Crompton's groundbreaking editing of *Offences Against One's Self: Paederasty* (1978), regarding the following points:

  1.  **Rejection of Natural Law:** It is settled that Bentham systematically dismantles the religious and natural law arguments used to criminalise non-procreative sex (masturbation, sodomy, etc.). He treats these as 'vices' rather than 'crimes', arguing that without a victim, there is no offence punishable by the state.
  2.  **The Primacy of Harm:** Bentham's criterion for legal intervention is consistently grounded in the prevention of pain or harm to others. In his sexual ethics, this translates to a clear distinction between consensual acts (which fall under liberty) and coercive acts (which fall under justice).
  3.  **Quantitative Hedonism:** It is accepted that Bentham refused to rank pleasures by quality *in principle*. His famous assertion that 'push-pin is as good as poetry' is an attack on aesthetic snobbery and asceticism, not necessarily a blanket ethical licence for all behaviours.

  ### II. Contested Terrain: The Limits of Utilitarian Consent

  Where specialists diverge is on whether Bentham's framework can *sustain* the boundaries he wishes to draw without smuggling in non-utilitarian norms.

  1.  **The Stability of 'Consent':** Scholars such as Philip Schofield argue that Bentham successfully grounds rights in 'security' and 'expectation'. However, critical interpreters (including Bruce Burgett and Jennifer Greiman) contend that Bentham's instrumental rationality risks rendering the body a site of calculation. The contestation lies in whether 'consent' in Bentham is a fundamental barrier or merely a heuristic for measuring pain.
  2.  **The Pederasty Manuscripts:** There is ongoing debate regarding Bentham's specific views on age and capacity. While he opposed force, some passages suggest he viewed age-of-consent laws as overly restrictive if the 'mischief' (harm) could not be proven. Some historians view this as a consistent application of his harm principle; others see it as a troubling blind spot in his liberalism.
  3.  **Security vs. Liberty:** In his later writings, Bentham places increasing weight on 'security'. Some argue this shifts his theory away from a simple hedonic sum towards a rule-utilitarian protection of expectations, which better safeguards consent. Others argue this is an ad hoc adjustment to save the theory from its own more radical implications.

  ### III. Addressing Your False Presupposition

  Your central worry is that if pleasure is purely quantitative, the calculus might license coercion provided the coercer's pleasure outweighs the coerced's pain. You ask if the consent boundary collapses into an arithmetic problem.

  The error in this reading lies in how Bentham accounts for **pain**, **security**, and **time**.

  **1. Pain is not merely sensory; it is anticipatory.**
  You note that Bentham treats acts as equivalent because they share a sensory profile. This holds for *private* vices. However, in *public* or interpersonal offences, Bentham's calculus includes the dimensions of 'certainty' and 'propinquity'. Coercion generates not only immediate physical pain but, more significantly, the pain of **alarm** and **insecurity**.
  For Bentham, the greatest evil is not the momentary pain inflicted on one individual, but the collapse of social security. If coercion were permitted based on a net-positive sum, no individual could ever feel secure in their person. The resulting universal anxiety (the 'pain of expectation') would vastly outweigh any isolated pleasure gained by the coercer. Therefore, coercion fails the calculus not because it violates a mystical right, but because it is socially disastrous.

  **2. Consent as an Epistemic Marker.**
  Bentham does not treat consent as a deontological magic word. Rather, he treats it as the primary evidence that pain is absent. In consensual acts, the presumption is that pleasure exceeds pain for all parties. In coercive acts, resistance signals pain. To ignore resistance is to ignore data in the calculus. Your reading assumes the utilitarian agent can accurately sum the coercer's intense pleasure against the victim's intense pain. Bentham would argue such a calculation is impossible to make without destroying the 'security' required for society to function at all.

  **3. Push-Pin vs. Poetry is a Red Herring here.**
  The 'push-pin' quote concerns the *source* of pleasure (aesthetic vs. trivial), not the *distribution* of pain. Bentham can maintain that sodomy and vaginal intercourse are morally equivalent (in terms of sin) while simultaneously maintaining that rape and intercourse are morally distinct (in terms of harm). The former is a classification of 'taste'; the latter is a classification of 'injury'. Your confusion arises from conflating the *value of the act* with the *ethics of the interaction*.

  ### IV. The Panopticon Connection

  You mention smuggling in the Panopticon. You are likely correct to sense a tension here, but perhaps not in the way you fear. The Panopticon is about ensuring accountability to maximise utility. In sexual matters, Bentham is wary of state surveillance intruding into private spheres where no harm is evident.
  However, the 'disciplinary' aspect you sense is real: Bentham wants individuals to discipline *themselves* according to utility. The 'blind spot' you are investigating might best be framed not as a licence for coercion, but as a hyper-rationalisation of intimacy that struggles to account for power dynamics that do not manifest as immediate, calculable pain (e.g., structural subordination or psychological manipulation that falls short of overt force).

  ### Summary for your Argument

  To overcome your wall, I suggest pivoting your argument slightly:
  *   **Do not argue** that Bentham fails to distinguish consent from coercion. He does distinguish them, vigorously.
  *   **Do argue** that his distinction relies entirely on a *consequentialist* account of security rather than a *rights-based* account of autonomy.
  *   **The Blind Spot:** The true blind spot is not that he licenses coercion, but that his framework struggles to protect individuals in scenarios where the 'pain' is diffuse, long-term, or structural, rather than immediate and visceral. This is where 19th-century liberalism's reliance on the 'harm principle' often faltered, and where your critique of Bentham will find its strongest footing.

  I hope this assists in clarifying the architecture of your chapter. It is a fascinating subject, and Crompton's archives at University College London remain a treasure trove should you need to dive deeper into the manuscripts themselves.

