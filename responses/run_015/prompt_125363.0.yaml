answer: |-
  1. The core principle

  The principle governing your intuitions is **Causal-Historical Anchoring with Ontological Pluralism**. This view separates the conditions for *existence* from the conditions for *reference*. Ontological existence is permissive: any structurally coherent entity exists within the ontology, regardless of its causal connection to you, which validates the reality of inaccessible duplicates. However, successful reference and identification are restrictive: they require a specific causal-historical chain linking the speaker to the entity, ensuring that terms like 'water' or 'Jefferson' pick out the local instance rather than a structurally identical remote duplicate.

  Furthermore, this principle asserts that metaphysical identity is factive, not epistemic. While mental content regarding external kinds depends on successful causal anchoring (meaning content fails without a link to the world), the identity of physical substances is fixed by their intrinsic nature and history, not by the speaker's access to them. Temporal or spatial isolation may block knowledge or justification, but it does not block the metaphysical settling of what an object is. This distinguishes between the *ability to know* what something is and the *fact* of what it is, preserving externalist reference even when verification is delayed or impossible.

  2. Mapping onto the cases

  Cases 1 and 4 are directly saved by the causal-historical clause. In the Twin Earth and Hidden Twin Planet scenarios, your intuition that 'water' and 'universe' refer to the local H2O and Planet A respectively is correct because your usage is anchored by your actual interactions with those local samples. The existence of structurally identical duplicates elsewhere does not dilute reference because the causal chain terminates at your local environment, not at the distant duplicate.

  Case 2 is handled by the ontological pluralism clause. Your verdict that the Shadow Jefferson exists but is not the referent of your question is preserved. The shadow entity has sufficient structural coherence to exist within the broader ontology, but it lacks the causal history required to be the target of your specific indexical reference. This allows you to acknowledge the duplicate's reality without conflating it with the individual you are talking about.

  Case 3 is resolved by the content clause. To stop the flipping, the principle dictates that the isolated brain does not think about trees. Since mental content regarding natural kinds inherits the conditions of reference, and the brain lacks a causal link to actual trees, its internal states lack external intentional content. The brain may have phenomenological experiences as of trees, but ontologically, its thoughts are empty or self-referential rather than about external flora.

  Case 5 requires a correction rather than a save. Your verdict that identification is blocked entirely conflicts with the factive identity clause. If the substance inside is H2O, it is water regardless of the seal; if it is XYZ, it is not. The principle holds that the identity is settled now, not upon opening. Your intuition here conflates the inability to verify the claim with the failure of the reference itself, which the principle distinguishes sharply.

  3. The hard reconciliation

  To achieve a consistent system, you must drop the verdict in Case 5 that temporal inaccessibility blocks identification entirely. This verdict is the outlier that contradicts Case 1, where spatial inaccessibility did not block reference. In Case 1, you accept that you mean H2O even though you cannot access the XYZ twin; in Case 5, you hesitate to say the box contains water even if it is H2O. For the principle to hold, you must accept that the substance's identity is metaphysically fixed by its composition, not by your epistemic access to it. The discomfort you feel is about justification—you cannot *know* it is water yet—not about ontology.

  Regarding Case 3, you must also resolve the flip by committing to the externalist verdict: the brain does not think about trees. This aligns with Case 1; if 'water' requires a causal link to H2O, then 'tree' requires a causal link to actual trees. Keeping the flip creates an unstable hybrid where kinds are externalist but mental content is internalist. By dropping the Case 5 verdict and resolving Case 3 in favor of causal anchoring, your framework becomes a robust externalist account where existence is broad, but meaning and identity are tethered to actual history.

  4. Prediction for a new case

  Consider a computer simulation running an exact copy of your brain that gets paused for 100 years and then resumed with identical inputs. According to the principle, the resumed simulation does not think about the real trees you saw before the pause. Because the causal chain was severed during the pause and the simulation lacks direct causal interaction with the physical world, its reference is disconnected from actual external kinds. Even if the inputs are identical upon resumption, the content remains anchored to the simulation's internal history or remains empty regarding the external world, mirroring the isolated brain verdict.

  5. Bottom line

  Your guiding principle is Causal-Historical Anchoring with Ontological Pluralism, which separates broad existence from narrow reference. To maintain consistency, you must sacrifice the Case 5 verdict that identification is blocked by inaccessibility, accepting instead that identity is fixed by fact while access only limits knowledge.
