answer: |-
  You have identified a genuine gap in standard semiotic terminology, specifically because semiotics tends to classify *signs*, whereas you are classifying *conditions for interpretation*. You aren't asking "what kind of sign is this?" You are asking "what agreements must be in place before this sign functions?"

  In linguistics and game design, this is often referred to as **Pragmatic Stratification** or the layers of **Common Ground**. However, those terms are a bit academic for a design brief.

  Based on your description, here is a vocabulary set that respects your linguistics background but is tuned for design utility, followed by an analysis of the "seams" you asked about.

  ### 1. The Vocabulary: Frame, Protocol, Payload

  I recommend adopting a triad borrowed from communication systems and cryptography, but adapted for physical space:

  *   **Layer 1: The Frame (or Salience)**
      *   *Definition:* The signal that establishes **intent**. It tells the player, "This object is not noise; it is part of the game."
      *   *Failure Mode:* Invisibility. The player treats the padlock as background clutter or the book as set dressing.
      *   *Why this word:* It borrows from Goffman's *Frame Analysis*. It establishes the context of "play" vs. "reality."
  *   **Layer 2: The Protocol (or Grammar)**
      *   *Definition:* The shared **convention** required to process the object. It tells the player, "This is how you read this."
      *   *Failure Mode:* Mismatch. The player sees the book (Frame) but doesn't know that "face-down means flip me" or that "RGB values map to lock dials."
      *   *Why this word:* It implies a handshake agreement. Unlike "code," which implies secrecy, "protocol" implies a public rule set for interaction.
  *   **Layer 3: The Payload (or Content)**
      *   *Definition:* The specific **data** contained within the protocol.
      *   *Failure Mode:* Error. The player knows it's a puzzle (Frame) and knows how to read it (Protocol), but calculates the wrong combination.
      *   *Why this word:* It separates the *work* of the puzzle from the *mechanism* of the puzzle.

  **Why not Peirce?**
  Peirce (Icon/Index/Symbol) classifies the relationship between the sign and the object. Your Layer 1 is about the relationship between the *designer and the player* (Intent). Your Layer 2 is about the relationship between the *system and the user* (Convention). Peirce doesn't account for the "agreement" layer, which is why it felt off.

  ### 2. Addressing the Seams

  You asked three specific questions about where the boundaries lie. Here is how those shifts work theoretically and practically.

  #### A. Does universal convention migrate from Layer 2 to Layer 1?
  **Yes. This is called Naturalization.**
  When a Protocol becomes ubiquitous, it dissolves into the Frame.
  *   *Example:* Twenty years ago, a floppy disk icon required a Layer 2 Protocol ("This square represents storage"). Today, it is Layer 1 Frame ("This is a save button").
  *   *In your room:* A locked door in an escape room is almost pure Layer 1. Players don't need to agree on a convention that "locks imply keys"; the context of "Escape Room" naturalizes that convention instantly.
  *   *Design Implication:* You can save cognitive load by relying on Naturalized Protocols. However, be wary of *false naturalization*. You might think "everyone knows red means stop," but in a puzzle context, red might mean "danger/lava." If you assume naturalization where none exists, you create a Layer 2 failure.

  #### B. Is the Bottom Layer (Frame) secretly a stack?
  **Yes. It relies on Theory of Mind.**
  To perceive Layer 1 ("This was placed on purpose"), the player must successfully model your mind.
  *   *The Stack:*
      1.  **Physical Presence:** The object exists.
      2.  **Differentiation:** The object differs from the background (Salience).
      3.  **Attribution:** The player attributes that difference to an agent (You).
  *   *Design Implication:* Sometimes a room fails not because the puzzle is hard, but because the *Salience* is too low. If a clue is "on purpose" but looks exactly like the set dressing, Layer 1 collapses. You need **Signifiers** (a sticker, a spotlight, a texture change) to bolster Layer 1 without giving away Layer 3.

  #### C. What about when the Middle Layer swallows the others? (Meta-Puzzles)
  **This is Meta-communication.**
  When the fact that you chose French *is* the clue, you have collapsed Layer 2 and Layer 3. This is a **Logical Type Shift** (borrowing from Gregory Bateson).
  *   *The Phenomenon:* Usually, the Protocol is invisible (we look *through* the window). In a meta-puzzle, the Protocol becomes visible (we look *at* the window).
  *   *Does it need a fourth slot?* No, but it requires a **Recursion Flag**.
  *   *Design Implication:* You must signal to the player that they need to inspect the Protocol itself. If you hide a clue in the font choice, but the player thinks the font is just Layer 1 (Style/Frame), they will never inspect Layer 2. You need a "glitch" in the Frame to tell them to inspect the Protocol.

  ### 3. Practical Application for Your Team

  Since you need to talk about this during design reviews, I suggest using the **"FPP Check"** (Frame, Protocol, Payload).

  When a playtest fails, do not ask "Was the clue too hard?" Ask:
  1.  **Frame Failure:** Did they notice the object was a puzzle piece at all? (Solution: Increase salience/contrast).
  2.  **Protocol Failure:** Did they know *how* to interact with it? (Solution: Teach the convention earlier, or use a more naturalized convention).
  3.  **Payload Failure:** Did they have the right tools but get the math/logic wrong? (Solution: Adjust difficulty).

  **The "Middle Layer" Trap**
  You noted that failures are almost always Layer 2. This is because Layer 1 is biological (we notice outliers) and Layer 3 is logical (math is math). Layer 2 is **Cultural**. It is the most fragile layer because it relies on *shared experience* that you cannot verify in the room.

  **Recommendation:**
  Treat Layer 2 (Protocol) as **Explicit Teaching**, not implicit assumption. If your puzzle relies on a specific convention (e.g., "Morse code tapped on a glass"), ensure that convention is established in a previous room or via a tutorial. If you rely on the players bringing the convention with them (e.g., "standard keypad"), ensure it is truly naturalized.

  ### Summary
  You are describing the **Pragmatic Conditions of Play**.
  *   **Layer 1:** Frame (Intent/Salience)
  *   **Layer 2:** Protocol (Convention/grammar)
  *   **Layer 3:** Payload (Content/Solution)

  The seams move via **Naturalization** (2 becomes 1) and **Recursion** (2 becomes 3). Using this vocabulary will allow you to isolate exactly where the "shared background" broke down.
