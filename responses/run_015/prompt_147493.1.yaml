answer: |-
  **Setting:** *A quiet corner of a university garden, late afternoon. The air is crisp. ELENA and MARCUS sit on a bench overlooking a plot of overgrown roses.*

  **Elena:** Look at those roses, Marcus. They're choking on weeds. It brings to mind our old debate. Suppose the owner of this plot, let's call him Arthur, is dying. He asks you to promise that you will tend this garden after he is gone. You say, "I promise." Arthur dies. Do you owe it to anyone to weed these roses?

  **Marcus:** I owe it to Arthur's memory, perhaps. Or I owe it to the neighborhood to keep the plot tidy. But do I owe it to *Arthur*? Or his estate? No. The promissory obligation dissolves the moment he loses the capacity to hold me to it.

  **Elena:** That is the quintessential reliance error. You are conflating the *reason* we often make promises with the *nature* of the obligation itself. When I promise Arthur, I exercise a normative power. I alter my own deontic landscape. I create a directed duty. That duty is an object, a moral entity, that I have placed in Arthur's hands. When he dies, that object doesn't vanish; it passes to his estate, just as his property does. The duty survives because the structure of the right survives.

  **Marcus:** But what is the substance of that "moral entity" if the person it was meant to serve is gone? My view is that promises bind through a second-order assurance structure. By promising, I invite you to rely on me, and I assure you that I will not betray that reliance. This makes your reliance rationally stable. The moral force comes from the protection of that reliance interest. Once Arthur is dead, he cannot rely. He cannot be assured. He cannot be harmed by disappointment. If the obligation is grounded in the interpersonal dynamic of assurance, cutting the wire on one end kills the current.

  **Elena:** You reduce the promise to a prediction with extra social pressure. If it were merely about reliance, then if Arthur didn't actually rely on me—if he was skeptical but I insisted on promising anyway—I would be off the hook. But I'm not. The obligation stems from my exercise of authority over my own future actions. I have given Arthur a right to my performance. That right is his property. To say the duty vanishes upon his death is to say his rights vanish instantly, which contradicts how we treat rights in almost every other legal and moral context.

  **Marcus:** I'm not reducing it to a prediction, Elena. I'm grounding it in the harm of betrayal. Scanlon's Principle F is clear: we have a duty not to manipulate expectations we have intentionally induced. But you're right about one thing: the intuition of bindingness is strong. However, consider the ontology of this "directed duty" you speak of. A directed duty implies a bipolar norm: I am obligated *to you*. It requires two poles. If the promisee pole ceases to exist as a conscious agent capable of claiming the right, the bipolarity collapses. It becomes a monologue. What does it mean to owe a duty to a corpse?

  **Elena:** It means the duty is owed to the *person-as-they-existed-in-relation-to-me*, represented now by their estate. We do this with wills. We respect the wishes of the dead not because the dead feel satisfaction, but because the living recognize the authority the dead *had* while alive. Arthur had the authority to demand my labor. That authority was vested in him by my speech act. Death does not retroactively invalidate the speech act. If I neglect the garden, I violate a duty *to Arthur*, not just a generic duty of kindness. There is a specific victim of the wrong, even if that victim cannot feel the sting.

  **Marcus:** But why does the specific victim matter if there is no experiential harm? If your view holds, I could promise a dying man to burn his fortune in a bonfire. He dies. Do I owe it to his estate to burn the money? On your normative power view, yes. You've given him the right to command that waste. On my assurance view, no. The assurance was likely tied to his interest in how the money would be used, perhaps for his heirs. If the reliance was based on a misunderstanding of his interests, or if the act serves no one, the assurance structure reveals itself as hollow. The obligation dissolves because the *point* of the assurance was to coordinate human interests.

  **Elena:** You are smuggling consequentialism in through the back door. The "point" of the promise is not necessarily human interest in the aggregate; it is the autonomy of the promisor and the promisee. I have the power to bind myself. Arthur has the power to accept that bond. That transaction creates a moral reality. If we follow your reliance model, then the scope of my duty fluctuates based on Arthur's psychological state. Did he rely *a lot*? Then I'm very bound. Did he rely *a little*? Then I'm less bound. That makes the obligation contingent on his mind, not my word.

  **Marcus:** Not contingent on his mind, but on the *rationality* of his reliance. And that rationality is based on the assurance I gave. But let's press your "normative power" claim. Where does this power come from? It feels like magic. I say three words—"I promise you"—and suddenly I am bound in a way I wasn't before, independent of the consequences. Why does the universe care about my speech act?

  **Elena:** It's not magic; it's a convention that grants authority, much like a judge sentencing a criminal. The convention exists because we value the ability to control our future normative relations. We value being able to say, "You can count on this, regardless of what I want later." If the obligation dissolves at death, then the power I exercised was weaker than I thought. It means I couldn't actually give Arthur what I thought I was giving him: a secure claim on my future.

  **Marcus:** But you *couldn't* give him that, if the claim requires a claimant. Think of the garden again. If I don't weed it, who is wronged? The neighbors? Maybe. The roses? No. Arthur? He's gone. You say the estate is wronged. But the estate is a legal fiction representing heirs. Did Arthur promise the *heirs*? No, he asked *you* to promise *him*. If the assurance was to Arthur, and Arthur is gone, the specific promissory duty transforms. It becomes a duty of remembrance. I should weed the garden to honor him, not because he holds a leash on me from the grave.

  **Elena:** "Honor" is too vague. It makes the duty discretionary. If it's just honor, I can decide that planting tulips honors him more than weeding roses. But if I owe a *duty*, I must weed the roses. The specificity matters. The directed obligation preserves the specific content of Arthur's will. Your "duty of remembrance" allows me to override Arthur's specific desire with my own judgment of what is honorable. That undermines the very autonomy your reliance theory claims to protect. You protect his reliance, but only while he's watching.

  **Marcus:** I protect his interest in not being manipulated. Once he is dead, he cannot be manipulated. The risk of betrayal is gone. So, the strict promissory obligation—the one grounded in the assurance of reliance—fades. What remains is a generic moral duty to respect the dead, which is real, but it is not a *directed* duty owed to a rights-holder. It is an agent-neutral duty. This distinguishes between "I owe Arthur" and "I ought to do this."

  **Elena:** And that distinction is fatal to the practice of promising. If I know that my promise creates only a generic duty that might evaporate or transform upon your death, I haven't actually given you security. The value of the promise is precisely that it creates a right that is robust against changes in circumstance, including death. If the normative power doesn't extend beyond the life of the promisee, then the power is illusory. It suggests that my obligation is ultimately grounded in your capacity to suffer, not in my commitment to you.

  **Marcus:** But is it not grounded in my commitment to *you* as a living being? Promising is a social practice between agents. It is a handshake across time. If one hand is removed, the handshake breaks. To insist the handshake continues is to engage in a metaphysical fiction. I argue that acknowledging the dissolution of the duty upon death is more honest. It admits that morality is about living relationships. When the relationship ends, the specific obligations of that relationship change form. They don't persist as frozen artifacts.

  **Elena:** They persist as commitments. If morality is only about living relationships, then we cannot wrong the dead. But we intuitively feel we can. We feel guilt if we neglect the garden. That guilt is the phenomenological evidence of a surviving directed duty.

  **Marcus:** Guilt can be misplaced, or it can be a response to the *memory* of the relationship, not the relationship itself. I feel guilt because I valued Arthur, not because Arthur holds a claim. The difference is subtle but ontologically massive. You posit a ghost in the machine of morality—a right without a subject. I posit a lingering affect in the promisor.

  **Elena:** A right without a subject is not a ghost; it's a trust. The estate is the subject. But even without the estate, the duty remains *directed* toward the memory of the person. It retains the structure of "owed to Arthur." Your view collapses the directionality. It makes the duty about *my* integrity or *society's* stability.

  **Marcus:** And your view makes it about a metaphysical transaction that ignores the human cost. If Arthur didn't care about the garden, but extracted a promise out of whim, your view says I must weed. My view asks: was the reliance rational? Was the assurance given in good faith for a legitimate interest? If Arthur is dead, and the garden serves no one, my assurance structure reveals the duty was conditional on the human context.

  **Elena:** Then we are at an impasse on the source of authority. I see the authority as residing in the will of the agents to create norms. You see it residing in the protection of expectations.

  **Marcus:** Precisely. And regarding the garden: I will weed it.

  **Elena:** Why?

  **Marcus:** Because I loved Arthur. And because breaking the habit of promise-keeping, even when the specific obligation fades, damages my own capacity to assure others in the future.

  **Elena:** And I will weed it because I owe it to him. He has a claim on me that death did not extinguish.

  **Marcus:** Then we perform the same act, but we inhabit different moral universes.

  **Elena:** We do. In yours, the dead release us. In mine, we remain answerable to them.

  **Marcus:** And perhaps that is why your view is so demanding, and mine so humane.

  **Elena:** Or perhaps why mine is just, and yours is convenient.

  *They sit in silence for a moment, watching the wind move through the overgrown roses.*
