answer: |-
  Philosophical theories of emotion are typically calibrated against the dramatic: the sudden spike of fear when a car swerves, the hot flash of irritation at an interruption, the overwhelming wave of grief at a funeral. These are episodic emotions, occurrent states that flare and fade. Yet, a significant portion of emotional life is sedimentary rather than episodic. One can love a spouse, resent a sibling, or dread a diagnosis for years, often without any occurrent experience of the matter for months at a stretch. This is the standing-emotion problem: an adequate theory must explain what it is to possess an emotion during the intervals between episodes. The three standard families of theory—feeling theories, perceptual or attitudinal theories, and judgement theories—all face this challenge. Each has an apparently easy reply: treat the standing emotion as a disposition to undergo the respective occurrent state (feelings, perceptions, or judgements). However, assessing whether this dispositional move works reveals deep asymmetries between the theories, ultimately suggesting that the standing-emotion problem is not theory-neutral but rather exposes specific fatal weaknesses in feeling-based accounts.

  At first glance, the dispositional reply suggests a symmetry between the three families. If emotion is constitutively a feeling, a standing emotion is a disposition to feel; if it is a judgement, it is a disposition to judge. If all three can help themselves to this move, the standing-emotion problem apparently cannot decide between them. However, this symmetry is superficial. The move costs feeling theories significantly more than it costs cognitive theories because the resulting dispositions are of fundamentally different kinds. To resent a sibling is to be in a state directed at the sibling; it is intentional. A disposition to make evaluative judgements preserves this intentionality within the disposition itself, as judgments are inherently about objects. A disposition to undergo bodily feelings, however, does not inherently possess intentionality. A Jamesian disposition is merely a potential for physiological agitation. To explain how a disposition to feel becomes a state *about* a sibling, the feeling theorist must append an external causal history or a separate cognitive component. Thus, the dispositional move saves the phenomenon for feeling theories only by stripping the standing state of the very feature—object-directedness—that makes it an emotion rather than a mood or a physiological condition.

  This disparity becomes sharper when considering correctness conditions. Standing emotions are assessable for intelligibility and proportion; a decades-long resentment can be pointless, irrational, or wildly disproportionate to its occasion. This assessability is often offered as an argument against feeling theories, since bodily feelings themselves are not rational or irrational—they simply occur. Does the standing case add anything to the episodic case here? It does, because the duration amplifies the normative demand. In an episodic burst of anger, one might plead temporary loss of control. In a standing resentment lasting years, the state itself constitutes a stance toward the world that persists through reflection. If a standing emotion is merely a disposition to feel, it is difficult to locate where the irrationality resides. A disposition to have a racing heart is not irrational. Conversely, if a standing emotion is a disposition to judge that one has been wronged, the irrationality is located directly in the content of the disposition. The standing case therefore intensifies the requirement for normative assessability, a requirement that judgement and perception theories meet naturally but which feeling theories meet only awkwardly, if at all.

  Furthermore, the dispositional analysis invites familiar worries about finks, masks, and the merely hypothetical. A dispositional analysis cashes out 'she resents him' as a counterfactual about what would happen under test conditions. But a person might genuinely resent her sibling and yet be incapable of ever feeling, perceiving, or judging accordingly due to external interference. Consider a person who takes medication that flattens bodily arousal, or someone who has trained herself out of overt reactions without ceasing to resent the slight. For the feeling theorist, if the manifestation is prevented by a mask (the medication), the disposition is threatened. If the theory insists the emotion exists only if the feeling *would* occur absent the mask, it becomes vulnerable to complex counterfactual analysis that diverges from our intuitive understanding of emotional persistence. Judgement theories have more resources here. One can maintain an evaluative judgement even if physiological expression is chemically inhibited. The judgement is a cognitive commitment that is less susceptible to physiological masking than bodily feelings. Thus, the standing-emotion problem highlights the fragility of feeling theories when confronted with cases where the physiological manifestation is severed from the emotional state.

  Finally, the analogy with standing belief illuminates the functional nature of standing emotions, further disadvantaging feeling theories. The occurrent/standing distinction for emotions looks structurally like the occurrent/dispositional distinction for belief. In philosophy of mind, standing belief is often treated not merely as a disposition to assent, but as a state with a specific functional role in reasoning and action guidance. If this analogy holds, a standing emotion should be understood as a functional state that organizes attention and motivation over time, rather than a mere disposition to manifest sensations. Feeling theories reduce the standing state to a potential for sensation, which is too thin to capture the functional role emotions play in long-term planning and relationship maintenance. Judgement and perception theories, by contrast, align better with a functional role account, as evaluative construals or judgments naturally guide action and inference in the way standing beliefs do. The analogy suggests that emotions are cognitive-functional states, a category into which pure feelings fit poorly.

  The standing-emotion problem refutes feeling theories because only cognitive accounts can adequately ground the normative assessability and object-directedness of long-term emotional states without reducing them to mere physiological potentials.

  refutes-feeling-theories
