answer: |-
  The stalemate is a conceptual mix-up about the function of explanation compounded by unarguable moral values, not an empirical dispute. Progress requires a methodological distinction regarding scope, not new archaeological results.

  Your seminar is stuck because both sides are treating history as a single project when it is actually doing two different jobs. The Diamond/Harari camp is pursuing a nomothetic explanation: they want general laws and causal mechanisms that cover large spans of time and space. Their metric for success is predictive power and parsimony. The Graeber/Wengrow camp is pursuing an ideographic explanation: they want to recover specific contexts, choices, and meanings. Their metric for success is fidelity to agency and resisting determinism. When they argue about "explanation," they are arguing past each other because one side means "causal coverage" and the other means "interpretive understanding."

  This conceptual confusion is locked in place by normative stakes that evidence cannot touch. The big-picture narrative carries a moral risk: if geography or cognitive shifts determine outcomes, then inequality looks natural and inevitable. The local agency narrative carries a political risk: if everything is contingent choice, then structural constraints vanish and collective action becomes harder to justify. Neither side can concede because doing so feels like surrendering a moral position, not just a factual one. You aren't fighting about what happened; you are fighting about what kinds of stories are safe to tell about human nature.

  New archaeological data will not solve this because the theories are underdetermined by the evidence. A new site showing early experimentation with crops will be claimed by the macro side as proof of inevitable transition or by the micro side as proof of playful experimentation. The evidence is too patchy to falsify either grand narrative definitively.

  Progress comes from drawing a distinction between models and histories. You need to agree that macro-models are useful for identifying constraints and possibilities (what *could* happen), while micro-histories are necessary for explaining actualities (what *did* happen). If you reframe the debate from "which story is true" to "what is the appropriate scale for this specific question," the moral tension eases. You can accept geographic constraints without accepting moral determinism, and you can celebrate agency without denying structural pressure. The seminar moves forward only when you stop asking one framework to do the work of both.
