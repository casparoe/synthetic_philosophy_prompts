      The Utilitarian says: "He saves her because saving her maximizes utility (via the rule of thumb)."
      The "Too Many" is the *comparison*.
      So, "One Thought Too Few" (instinct) is actually closer to what Williams wants *phenomenologically*, BUT the *justification* must remain the relationship, not utility.
      Okay, I will clarify this in the response.

      *Jim and the Indians:* This is about *negative responsibility*. Utilitarianism says I am responsible for what I allow as much as what I do. Williams says this makes me responsible for the actions of others (the captain), which alienates me from my own agency.

