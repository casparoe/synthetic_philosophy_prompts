answer: |-
  This is an exceptionally sharp set of questions. You have correctly identified that your sources are conflating two distinct arguments and smoothing over the most difficult parts of Williams's position. You are right to be suspicious: the "settled simplification" you found is philosophically unstable.

  Here is a claim-by-claim audit and a reconstruction of the argument suitable for a whiteboard session.

  ### Part 1: Audit of Your Sources

  Your sources are mixing up Williams's 1973 argument (*A Critique of Utilitarianism*) with his 1981 argument (*Persons, Character and Morality*). They treat them as one point, but they target different vulnerabilities.

  | Claim from Sources | Verdict | Correction / Nuance |
  | :--- | :--- | :--- |
  | **"The central example is the burning building (wife vs. stranger)."** | **Misreading** | This is the **"One Thought Too Many"** example. It targets *motivation*. The central **Integrity** example is **"Jim and the Indians"** (1973), where a traveller is asked to shoot one captive to save nineteen. That targets *agency*. |
  | **"Integrity just means putting your own people first (partiality)."** | **Misreading** | Integrity is not mere selfishness or nepotism. It is about **identity**. We have "ground projects" (commitments, relationships, careers) that give our lives meaning. If morality requires us to abandon these whenever the calculus demands, we become alienated from our own lives. |
  | **"Utilitarianism asks too much (over-demandingness)."** | **Simplification** | Williams distinguishes integrity from mere difficulty. It's not that saving the stranger is *hard*; it's that requiring the calculation *changes the nature of the agent*. It turns the agent into a neutral channel for satisfaction, rather than a person with a specific point of view. |
  | **"The husband shouldn't think at all."** | **Simplification** | Williams allows the thought "She is my wife." He objects to the thought "She is my wife, *and I must check if saving her maximizes utility*." The relationship itself provides the reason; it should not be a premise in a larger calculation. |
  | **"Indirect Utilitarianism (self-training) solves the problem."** | **False** | Williams anticipates this. If the *real* justification is still utility, the agent is living a lie. They are being manipulated (even if by themselves) to ignore the truth of their moral system. This damages integrity further. |
  | **"Jim's problem is responsibility for deaths he didn't cause."** | **Simplification** | It is about **Negative Responsibility**. Utilitarianism holds you responsible for what you *allow* as much as what you *do*. Williams argues this makes you responsible for the actions of *others* (the captain), which alienates you from your own agency. |

  ### Part 2: Key Concepts for the Whiteboard

  To lead the session, you need to clarify three terms that your sources muddied.

  **1. "Impersonal" vs. "Personal" Standpoint**
  *   **Utilitarianism:** Requires the "view from nowhere." My happiness counts for one, yours for one. My wife counts for one, a stranger for one. The agent is a replaceable vessel for producing good outcomes.
  *   **Williams:** We live from a "view from somewhere." I am *me*, located here, with *these* projects. To ask me to step outside this perspective to judge my own actions is to ask me to cease being a person and become a satellite of the utility function.
  *   **Whiteboard Tip:** Draw a circle labelled "Agent." Draw arrows going out to "Projects/Wife." Utilitarianism asks the Agent to float above the circle. Williams says the Agent *is* the circle.

  **2. Integrity vs. Partiality**
  *   **Partiality:** "I favor my wife because she is mine." (This can be granted by some utilitarians as a useful rule of thumb).
  *   **Integrity:** "I favor my wife because *I am the kind of person for whom this relationship is constitutive of my identity*."
  *   **The Difference:** Partiality is about *who* gets the benefit. Integrity is about *who is acting*. If I save my wife *because utility says so*, I am not acting as a husband; I am acting as a utility-calculator who happens to be married. I am alienated from my own action.

  **3. The Two Examples (Do they do the same job?)**
  *   **Wife/Stranger (Motivation):** Attacks the *psychology* of the utilitarian agent. It shows utilitarianism misunderstands how love works. Love is immediate, not calculated.
  *   **Jim/Indians (Agency):** Attacks the *structure* of utilitarian responsibility. It shows utilitarianism violates the boundary between me and the world. If I refuse to shoot, the Captain shoots 19. Utilitarianism says *I* kill the 19 by refusing. Williams says *the Captain* kills the 19. I am responsible for my hands, not his.
  *   **Verdict:** They are complementary. One protects the **heart** (motivation), the other protects the **hands** (agency).

  ### Part 3: The Indirect Utilitarian Reply

  Your sources claim the objection collapses if utilitarians say: *"Agents should be trained to act instinctively, not calculate."* (This is Rule or Indirect Utilitarianism).

  **Williams's Counter-Argument (The "Government House" Objection):**
  1.  **The Split:** If I am an Indirect Utilitarian, I act on instinct ("Save her!"), but I believe the *truth* is "Save her because it maximizes utility."
  2.  **The Alienation:** My conscious mind is now hiding the real moral truth from my motivating mind. I am treating myself as a tool to be manipulated.
  3.  **The Sincerity Problem:** If asked "Why did you save her?", if I answer "Because it maximized utility," I sound monstrous (One Thought Too Many). If I answer "Because she is my wife," I am lying about my fundamental moral commitment.
  4.  **Conclusion:** Indirect Utilitarianism doesn't remove the alienation; it internalizes it. It makes the agent a hypocrite in their own moral life.

  **Whiteboard Reconstruction:**
  *   Draw a box: "Agent's Mind."
  *   Inside: "Motivation (Love)" vs. "Justification (Utility)."
  *   Direct Utilitarian: Motivation = Justification. (Result: One Thought Too Many).
  *   Indirect Utilitarian: Motivation $\neq$ Justification. (Result: Self-Alienation/Schizophrenia).
  *   Williams: Motivation = Justification = "She is my wife." (Utility is irrelevant).

  ### Part 4: Analyzing Your Variations

  Your intuitions here are excellent. Here is how to deploy them.

  **Variation 1: "One Thought Too Few" (The Instinctive Husband)**
  *   *Scenario:* Husband saves wife without any thought. Cannot explain why.
  *   *Does this help Williams?* **Yes and No.**
      *   **Yes:** It avoids the "calculation" error. Phenomenologically, this is what Williams wants in the moment.
      *   **No:** If he *cannot* justify it even in reflection, he acts like a trained animal, not a moral agent. Williams wants the thought "She is my wife" to be the *reason*, not just a causal trigger.
      *   **The Trap for Utilitarianism:** If the Utilitarian says "This is perfect! He didn't calculate!", Williams replies: "If he acts without reason, he has no integrity. If he acts with reason, and the reason is Utility, he is alienated. You cannot have it both ways."
      *   **Whiteboard Use:** Use this to show that Utilitarianism wants the *result* of instinct without the *reality* of instinct.

  **Variation 2: "The Rescue Worker" (Post-hoc Justification)**
  *   *Scenario:* Husband saves wife, then justifies it to a firefighter using utility calculus.
  *   *Does this matter?* **Yes.**
      *   Williams cares about the **reason for which one acts**, not just the explanation given later.
      *   However, if the husband *actually believed* the utility calculation was the truth, it colors the action retrospectively. It suggests that even in the moment, the relationship was subordinate to the calculus.
      *   **Distinction:** *Context of Action* vs. *Context of Justification*. Williams argues the Context of Action determines the moral quality. If the justification retroactively claims to be the reason for action, it corrupts the memory of the action.
      *   **Whiteboard Use:** Distinguish "Why I did it" (Motive) vs. "Why it was right" (Justification). Utilitarianism collapses these. Williams keeps them separate.

  ### Part 5: The "Proves Too Much" Worry

  You asked: *"I keep hearing that the same worry can be raised against moral views that tell you to act from duty rather than from love... does that make the objection stronger or just show it proves too much?"*

  *   **It makes the objection stronger.** Williams is not just attacking Utilitarianism; he is attacking **"Morality" (The Peculiar Institution)**.
  *   He argues that *any* system (Kantian or Utilitarian) that posits a "Moral Ought" that overrides all "Ground Projects" is suspect.
  *   **Why focus on Utilitarianism?** Because Utilitarianism is the most aggressive version of this. Kant allows some latitude for personal projects; Utilitarianism demands you sacrifice them whenever the calculus requires.
  *   **Session Point:** If students say "But Kant says do your duty!", reply: "Williams agrees that's also a problem, but Utilitarianism is worse because it demands you sacrifice your integrity *for the sake of others' actions* (Jim/Indians), whereas Kant usually demands you keep your own hands clean."

  ### Part 6: Conclusions (What stands after the fix?)

  To answer your final questions directly:

  1.  **Is there a private, morality-free zone?**
      *   **No.** Williams does not say morality doesn't apply to relationships. He says morality should not *displace* the reasons relationships provide. The "zone" isn't free of morality; it's free of *external justification*. The relationship *is* the moral reason.
  2.  **Is it a refutation or a constraint?**
      *   It is a **constraint on the theory's claim to completeness**. It shows Utilitarianism cannot be the *whole* story of human life. It might be a tool for legislation, but it fails as a guide for personal life.
  3.  **Does the Indirect Reply work?**
      *   **No.** It relocates the problem from the action to the agent's psychology. It saves the theory's outcomes but sacrifices the agent's integrity.

  ### Whiteboard Plan for Your Session

  1.  **Define the Target:** Draw the Utilitarian Calculus (Sum of Happiness).
  2.  **The Integrity Objection:** Draw the Agent inside the Calculus. Label it "Alienation."
  3.  **Case Study A (Wife):** Write "One Thought Too Many." Cross out "Calculation." Write "She is my wife" as the *stopper*, not the *premise*.
  4.  **Case Study B (Jim):** Write "Negative Responsibility." Ask: "Who pulls the trigger?" (Me vs. The Captain).
  5.  **The Utilitarian Defence:** Write "Indirect Utilitarianism (Train instincts)."
  6.  **The Williams Rebuttal:** Write "Self-Alienation." (Thinking one thing, believing another).
  7.  **Final Question:** "Can a moral theory demand we ignore our own identity to function?"

  This structure allows you to correct the sources without needing to quote texts. You are reconstructing the *logic* of the objection, which is exactly what Williams would prefer. Good luck with the society.
