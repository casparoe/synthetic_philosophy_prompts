answer: |-
  In this miniature dark forest, the United States and the Soviet Union played the civilizations. Their broadcasts of location were not radio waves but seismic spikes from atmospheric nuclear tests, telemetry signals from missile launches, and the optical glare of satellites like Corona and Zenit. A defector revealing missile counts counted as a leakage of coordinates. The chains of suspicion manifested as intelligence gaps: the "bomber gap" and "missile gap" were not merely errors but structural necessities of the forest; if one side could not verify the other's harmlessness, it had to assume the worst. The fear of technological explosion drove the escalation from bombers to ICBMs to MIRVs; each leap threatened to render the other's deterrent obsolete before a treaty could be signed, mirroring the cosmic fear that a silent neighbor might leap ahead during the light-speed lag.

  The 1972 ABM Treaty aligns perfectly with dark forest logic. By limiting defense sites to two, reduced to one in 1974, both sides agreed to remain killable, accepting the condition that invulnerability must remain unbuildable. Robert McNamara's argument at Glassboro—that missile defense would provoke an arms race and invite a first strike—mirrors the forest's dictate that shields look like swords. When Reagan announced the Strategic Defense Initiative in 1983, he attempted to build the wall. Dark forest logic predicts this should trigger panic and preemptive escalation, as a shielded power can strike without fear of return. The Soviets reacted precisely this way, denouncing SDI as a first-strike tool, while the American Physical Society's 1987 judgment on feasibility highlighted the cost-exchange ratio that keeps the forest open. The theory holds: the moment one side threatens to become a fortress, the forest demands a preemptive shot.

  However, running the analysis backward reveals where the model breaks. On Earth, the see-without-being-seen asymmetry failed; radar, overflights, and seismic monitoring made mutual detection guaranteed and nearly free. The cheap-shot asymmetry failed because retaliation was certain; the cost-exchange ratio favored offense roughly twenty-to-one, making preemption dominated rather than dominant. Most critically, the latency asymmetry collapsed. The Moscow-Washington hotline, summits, and inspection regimes allowed trust to be built slowly, proving that verification is possible when light-speed delays are mere milliseconds rather than decades.

  Consequently, the Cold War does not vindicate the dark forest as a universal law but isolates its variable: latency. The standoff satisfies only the condition that invulnerability must remain unbuildable; it fails the detection, cost, and communication asymmetries. The theory is silent on how low-latency environments allow for the construction of trust, assuming instead that suspicion is irreversible. If the theory holds for interstellar space, it licenses two predictions: we should observe no civilization attempting large-scale shielding (like Dyson swarms that hide waste heat), and our own leakage should be minimal not out of courtesy, but because silence is the only armor. The Cold War suggests the forest's verdict depends almost entirely on the latency asymmetry, making the real moral of the episode about the price of verification rather than the lethality of one's neighbours.

  Standard deterrence theory focuses on the weapons we point at each other, but the dark forest hypothesis warns us to watch for the shields we build around ourselves.
