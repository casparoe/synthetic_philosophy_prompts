prompt: |-
  me and my friend just burned like three hours last night cause she and her brother got into this huge arguement about that old ring of Gyges story where you turn invisible and can get away with anything, i was just stuck at the kitchen table listening and now i'm confused.

  so he said the story shows being fair is really just about fear of getting caught, and if you actually had the ring you'd be an idiot not to use it to grab money and power. she said thats mixing up what people would do with what they have reason to do, like a genuinely fair person wouldn't even want to steal and cheat even if no one could catch them.

  then he said ok compare two guys who both get rings, one stays honest and one goes crooked — the crooked one ends up rich and powerful, so how is honesty supposed to be better for you personally. she said thats only if you think a good life is just external stuff, the crooked guy has to lie all the time and can't trust anyone and probably feels rotten, and she added this twist where what if the ring also wiped your own memory of what you did so you didn't even feel guilty, would we still say he's doing great.

  he said the whole can't-trust-anyone and feels-rotten thing just assumes what its trying to prove, that being crooked wrecks you inside.

  can you go through their back and forth move by move and say who's right about what, who is more right overall, and what both of them are missing. and if i've set the whole thing up in a confused way just tell me straight instead of being polite about it.
