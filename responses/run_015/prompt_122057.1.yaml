answer: |-
  Here is the audit you asked for. I have laid out the mapping, identified the structural failures, and then come down on a verdict regarding the specific cases and the alternative models.

  ### 1. The Mapping: Consent as Contract

  | Contract Element | Sexual Consent Analog | Function in the Frame |
  | :--- | :--- | :--- |
  | **Offer** | Proposal of specific sexual acts. | Initiates the negotiation. |
  | **Acceptance** | "Yes" (verbal or clear non-verbal). | Signals agreement to terms. |
  | **Consideration** | Mutual pleasure, intimacy, or obligation. | The "value" exchanged (often implicit). |
  | **Capacity** | Age, sobriety, cognitive competence. | Ensures the signer understands the deal. |
  | **Fraud (Factum)** | Lying about the *nature* of the act (e.g., "this is a medical exam"). | Voids consent entirely (rape by deception). |
  | **Fraud (Inducement)** | Lying about *collateral* facts (e.g., "I love you," "I'm single"). | Usually *does not* void consent in strict contract law. |
  | **Duress** | Explicit threats of harm ("I'll hurt you if you say no"). | Voids consent; makes agreement involuntary. |
  | **Breach** | Going beyond agreed acts (e.g., removing a condom). | Violation of the terms; transforms act to assault. |
  | **Revocation** | "Stop" or withdrawal of participation. | Terminates the contract immediately. |
  | **Remedy** | Criminal penalty, civil suit, social sanction. | Recourse for violation. |
  | **Enforcement** | Law, campus tribunals, community norms. | Third-party adjudication. |

  ### 2. Where the Mapping Breaks (And Which Breaks Matter)

  The contract analogy is not just imperfect; it is category-error prone in three specific places. Two are decoration; one is fatal.

  **Decoration (Ignore These):**
  *   **Consideration:** In contract law, consideration must be distinct from the promise. In sex, the act *is* the consideration. This creates weirdness (is sex prostitution by default?), but it doesn't change the ethics of consent.
  *   **Remedy/Enforcement:** Who punishes the breach is a political question, not a structural flaw in the consent model itself.

  **Fatal Disanalogies (These Do Real Work):**
  1.  **Alienability vs. Ongoing Sovereignty:** A contract transfers a right for a duration. Consent does not transfer sovereignty over the body; it licenses access *revocably at any moment*. The contract model treats "No" as a breach of contract; the consent model treats "No" as a dissolution of the license. If you treat consent as a binding transfer, you cannot account for why changing one's mind mid-act is not a "breach" by the person withdrawing.
  2.  **The Materiality of Fraud:** Contract law distinguishes between lying about the *thing* (voids contract) and lying about the *value* (does not void). In sex, this distinction collapses. Lying about a vasectomy or an STI is lying about the *physical reality of the act* (risk of pregnancy/disease), not just the "value." The contract frame struggles here because it views the body as a black box; the ethical view sees the body as an integrated system where risk profile changes the nature of the intrusion.
  3.  **Background Power (Duress):** Contract law assumes rough equality of bargaining power. It looks for *explicit* threats (gun to head). It ignores *structural* coercion (boss/employee, landlord/tenant, host/guest). If the cost of "No" is homelessness or career destruction, the contract frame calls it "voluntary" because no *new* threat was issued. This is the frame's most dangerous blind spot.

  ### 3. The Verdict on Your Specific Cases

  You asked me to come down. Here is the position: **The contract model is a necessary floor for criminal law (bright lines) but a disastrous ceiling for ethics (meaningful agency).**

  **On Deception (STI, Vasectomy, Status):**
  *   **Verdict:** Lying about STIs and vasectomy invalidates consent. Lying about relationship status (being single) is ethically corrosive but legally distinct.
  *   **Reasoning:** The contract frame's "fraud in the inducement" defense fails here. An STI or potential pregnancy changes the *physical risk profile* of the penetration. It is not a collateral fact; it is a material fact about the act itself. If I agree to unprotected sex believing you are sterile, and you are not, I have not consented to *that* act (sex with pregnancy risk); I consented to a different act (sex without pregnancy risk).
  *   **The Contract Error:** The contract model treats the body as a vessel for the act. The ethical view treats the body as the site of risk. Lying about risk is lying about the act.

  **On Coerced-but-not-Threatened Yeses (Housing, Relationship):**
  *   **Verdict:** If the cost of refusal is catastrophic (housing, safety), it is not consent, even without a verbal threat.
  *   **Reasoning:** This is where the "Cheap-Exit Condition" (more on that below) does the work. Consent requires agency. Agency requires options. If the only option to "No" is destitution, the "Yes" is a survival strategy, not an exercise of autonomy. The contract model calls this "economic reality"; the ethical model calls it "coercive circumstance."
  *   **The Contract Error:** It assumes a baseline of freedom that does not exist in power-imbalanced relationships.

  **On Capacity (Drunk, Age, Disability):**
  *   **Verdict:** Capacity must be functional, not status-based. Blackout drunk = no capacity, even if initiating. Mild disability = presumptive capacity unless specific impairment is shown.
  *   **Reasoning:** The contract model wants a bright line (BAC > 0.08). Reality is spectral. However, for safety, we must err on the side of protection regarding intoxication. If memory formation is offline (blackout), the ability to *revoke* consent later is compromised (you won't remember agreeing, or disagreeing).
  *   **The Contract Error:** It treats capacity as a switch (on/off). It is a dimmer. But law needs switches. The solution is a "safe harbor" rule: If they are blackout drunk, you stop, regardless of enthusiasm.

  ### 4. The Cheap-Exit Condition vs. Improv

  **The Cheap-Exit Condition:**
  *   **Analysis:** This is not just the duress clause done properly; it is the *agency* clause. Duress asks, "Were you threatened?" Cheap-Exit asks, "Were you free?"
  *   **Verdict:** It does **not** turn every Yes into a Maybe, provided we define "cheap" reasonably. "Cheap" does not mean "without awkwardness" or "without disappointment." It means "without catastrophic loss." If exiting costs you the relationship, that is high cost, but not necessarily coercive *unless* the relationship is your sole means of survival. If exiting costs you your ride home in a remote area, that is coercive (safety threat).
  *   **Utility:** This is the correct ethical standard. It shifts the burden to the initiator to ensure the exit is safe.

  **The Improv Model:**
  *   **Analysis:** You are right to worry this smuggles in a teleology (sex is for mutual connection). However, it captures the *temporal* nature of consent better than contract.
  *   **Verdict:** Use Improv for the **process**, Contract for the **boundary**.
      *   *Contract* sets the perimeter: "We are doing X, not Y."
      *   *Improv* governs the movement: "I am sensing you pulling back, I am adjusting."
      *   *Why not just Improv?* Because improv implies a shared goal of "good art." Sex can be transactional, or one party can be passive. Improv fails to protect the person who just wants to lie there and be done with it. They don't want to "jam"; they want to endure or complete a transaction. Contract protects them; Improv pressures them to perform.

  ### 5. Final Recommendation: Demote the Contract

  **Keep the Contract Model for:**
  *   Criminal Law definitions (to ensure due process and bright lines).
  *   Defining specific acts (breach of boundary).
  *   Establishing the right to revoke (the "termination clause").

  **Drop the Contract Model for:**
  *   Ethical evaluation of deception (use the "Material Risk" standard).
  *   Evaluating power dynamics (use the "Cheap Exit" standard).
  *   Understanding the ongoing nature of the act (use the "Improv/Responsive" standard).

  **Your Column's Thesis:**
  We treat consent as a contract because contracts are easy to litigate. But sex is not a transaction; it is an interaction. A contract model protects the *act* from being called rape, but it does not protect the *person* from being used. We need to move from a **Procedural Autonomy** model (did they sign?) to a **Substantive Autonomy** model (did they have a real choice?).

  ### 6. What You Will Have to Defend (The Comments Section Flags)

  If you publish this, here are the contested claims you are making. Be ready for them:

  1.  **The Definition of "Material Risk":**
      *   *Claim:* Lying about a vasectomy/STI invalidates consent because it changes the physical act.
      *   *Contest:* Libertarians will argue this is "fraud in the inducement." They will say, "I consented to penetration, the consequences are separate."
      *   *Defense:* You must argue that risk is intrinsic to the act, not a consequence of it. Penetration with HIV *is* a different physical act than penetration without HIV.

  2.  **Structural Coercion vs. Hard Choices:**
      *   *Claim:* Saying yes to keep housing is not consent.
      *   *Contest:* Critics will say this infantilizes adults. Adults make hard trades all the time (working a hated job to eat). Why is sex different?
      *   *Defense:* You must argue that bodily integrity holds a higher moral weight than labor. We do not allow people to contract into slavery even if they need the money; we should not allow people to be coerced into sexual access due to structural vulnerability. This rests on a **non-commodification of the body** premise.

  3.  **The "Cheap Exit" Threshold:**
      *   *Claim:* Exit must be socially cheap.
      *   *Contest:* How cheap? If I cry? If I get angry? If you define "cheap" too broadly, you criminalize normal relationship friction.
      *   *Defense:* You must define "cheap" as "without fear of retaliation or catastrophic loss," not "without emotional cost." This rests on an empirical claim about how power dynamics silence victims.

  4.  **Intoxication and Initiation:**
      *   *Claim:* Blackout drunk initiation is not valid consent.
      *   *Contest:* This removes agency from intoxicated women (mostly). It treats them as children.
      *   *Defense:* You must argue that the capacity to *revoke* is part of the capacity to *consent*. If you cannot remember the negotiation tomorrow, you could not effectively manage the risk today. This rests on a **continuity of self** argument.

  **Summary:** The contract model is a heuristic for *law*, not a map for *ethics*. It tells you when you can be prosecuted, not when you are being good. For the questions you care about (deception, power, capacity), the contract frame is actively misleading because it prioritizes the clarity of the agreement over the reality of the agency. Drop it as the primary metaphor. Use "Substantive Autonomy" instead.
