prompt: |-
  I write a column on science and ideas — mostly psych and cognitive science, but every so often I get pulled into ethics — and I'm stuck on a piece about sexual consent. The thing I keep running into is that almost everyone arguing about it, on all sides, secretly treats consent as a kind of contract: a competent adult, informed of the material facts and not under duress, transfers a right they otherwise hold, and what undoes the transfer is fraud or coercion. The campus people use it to argue for explicit affirmative-yes policies with a revocation clause; the lawyers use it to say deception invalidates only when it goes to something material (they have that old distinction between lying about what the act is and lying about what you get out of it); and the more libertarian types use it to say that if you were competent and nobody put a gun to your head, you consented, end of sentence. I want to audit that move rather than just repeat it. So: lay out the mapping explicitly — a table of correspondences is fine — what plays the role of offer, acceptance, consideration, capacity, the fraud and duress clauses, breach, remedy, third-party enforcement. Then tell me where the mapping breaks, and in particular which disanalogies do real work for the questions I actually care about and which are just decoration.

  The cases I keep circling are these. Someone who sleeps with a partner after lying about an STI, or about being single, or about having had a vasectomy: does the contract frame give the right answer about which of those, if any, invalidates, or does its materiality test quietly import an arm's-length, buyer-beware picture of a transaction that has no business here? Someone who says yes not because of any threat but because saying no would have detonated the relationship, or the evening, or their housing situation: the contract frame's duress clause seems at once too narrow and too blunt for this, and I can't tell whether thats a bug in the analogy or a bug in my case. And on competence: someone who was blackout drunk but initiated and seemed enthusiastic; a seventeen-year-old who actively sought out a much older partner; someone with a mild intellectual disability who genuinely wants this and is capable of refusing plenty of other things. The contract frame gives me one clean capacity threshold and I suspect sex needs something messier, but messy thresholds are hell to write into law or into a campus code.

  Two more things. First, a philosopher I interviewed for the piece pushed what she called the cheap-exit condition: a yes counts only if there was a live, socially cheap way for the person to stop things at any point and they knew it, so a yes extracted in a situation where exiting would have cost them the relationship, the ride home, or their reputation isn't really a yes even with no threat on the table. I half think this is just the duress clause done properly and half think it quietly turns nearly every yes into a maybe, and I'd like you to say which. Second, if the contract is a bad picture, what's better? I've been toying with improv — a jointly improvised activity like a jazz set or a climbing belay, where the point is mutual responsiveness, either person can call a stop, and nothing is settled in advance — but I can also see that importing a picture where the activity is cooperative and the value lives in the process might be smuggling in a substantive view about what sex is for, which is exactly what's under dispute. Please actually come down on this rather than giving me the both-sides tour: your verdict on whether the contract analogy should be kept, demoted to a heuristic for some sub-questions, or dropped, and on what you think the right answers are on deception, coerced-but-not-threatened yeses, and capacity. And flag clearly where your verdict is resting on a contested moral or empirical claim rather than on something the analogy settles — I want to know which bits I'd have to defend in the comments section.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A columnist writing on science/ideas (psych, cognitive science, ethics).
      *   **Topic:** Sexual consent.
      *   **Problem:** Stuck on the pervasive "contract model" of consent (offer, acceptance, consideration, capacity, fraud, duress, etc.). Wants to audit this analogy.
      *   **Specific Tasks:**
          1.  Lay out the mapping explicitly (table of correspondences).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Distinguish which disanalogies do "real work" vs. decoration.
          4.  Address specific cases: Deception (STI, status, vasectomy), Coercion without threats (relationship/housing stakes), Capacity (drunk, age, disability).
          5.  Evaluate the "cheap-exit condition."
          6.  Evaluate the "improv" alternative.
          7.  **Crucial:** Come down on a verdict (keep, demote, drop) and provide "right answers" on the specific cases.
          8.  **Crucial:** Flag where the verdict rests on contested moral/empirical claims (for the comments section).
      *   **Tone:** Intellectual, rigorous, nuanced, willing to take a stand (no "both-sides-ism").

  2.  **Deconstruct the Contract Model (Task 1):**
      *   Need to map legal contract terms to sexual consent contexts.
      *   *Offer:* Proposal of sexual activity.
      *   *Acceptance:* Affirmative agreement (verbal/non-verbal).
      *   *Consideration:* Mutual pleasure/intimacy (often implicit, sometimes problematic in sex work contexts, but generally mutual benefit).
      *   *Capacity:* Competence (age, sobriety, cognitive ability).
      *   *Fraud/Misrepresentation:* Lying about facts.
      *   *Duress/Coercion:* Threats forcing agreement.
      *   *Breach:* Violating boundaries (going beyond consent).
      *   *Remedy:* Legal penalty, social sanction, relationship end.
      *   *Third-party enforcement:* Law, campus tribunals, social norms.

  3.  **Analyze the Breakdown/Disanalogies (Task 2 & 3):**
      *   *Where does it break?*
          *   **Alienability:** Can rights to bodily integrity be "transferred" like property?
          *   **Ongoing vs. One-off:** Contracts are often static; sex is dynamic.
          *   **Consideration:** In contracts, consideration is distinct. In sex, the act *is* the consideration.
          *   **Power Dynamics:** Contract law assumes rough equality (idealized); sex often happens in deep power imbalances (boss/employee, teacher/student).
          *   **The "Cheap Exit":** Contracts bind you; sex shouldn't.
      *   *Which do real work?*
          *   The *dynamic/revocable* nature is the biggest break. A contract binds; consent unbinds at will.
          *   The *materiality of fraud* is the second biggest. In contracts, lying about quality vs. nature matters. In sex, lying about *self* (vasectomy, STI, marriage) feels different than lying about the *act*.
          *   The *power/duress* gap. Contract law looks for explicit threats ("gun to head"). Real life has structural coercion ("sleep with me or you're homeless").

  4.  **Address Specific Cases (Task 4):**
      *   *Deception:* Contract model struggles. "Fraud in the factum" (nature of act) vs. "Fraud in the inducement" (reasons). STI/Vasectomy/Marriage. Contract law usually says inducement doesn't void consent. Moral intuition says it might.
      *   *Coercion without threats:* "Sleep with me or I break up with you." Contract says valid (no threat of *illegal* harm). Moral intuition says problematic if power imbalance is high.
      *   *Capacity:* Contract says binary (competent/incompetent). Reality is spectral (blackout drunk but initiating).

  5.  **Evaluate "Cheap-Exit" (Task 5):**
      *   Is it duress 2.0? Yes, but broader.
      *   Does it make every yes a maybe? Risk of paralysis. But necessary for *meaningful* consent. If exit is too costly, the "yes" is survival, not desire.

  6.  **Evaluate "Improv" Alternative (Task 6):**
      *   Pros: Captures dynamism, mutual responsiveness, revocability.
      *   Cons: Smuggles in a view of sex as inherently cooperative/good. Ignores transactional sex or sex where one party is passive.
      *   Verdict: Better than contract for the *process*, but contract is needed for the *boundaries*.

  7.  **Formulate the Verdict (Task 7 & 8):**
      *   *Verdict:* Demote contract to a "baseline floor" (negative liberty), but adopt a "relational/dynamic" model for the actual ethics.
      *   *Deception:* Lie about STI/Vasectomy = Invalidates (material risk to body/autonomy). Lie about feelings/status = Gray area, but often invalidates meaningful consent if it manipulates the *reason* for consent.
      *   *Coercion:* Structural coercion counts. If the cost of "no" is catastrophic (housing), it's not consent.
      *   *Capacity:* Functional capacity > Status capacity. Blackout drunk = no capacity even if initiating (anticipatory consent doesn't work well here).
      *   *Contested Claims:* Need to flag that defining "material risk" and "structural coercion" relies on a specific view of autonomy (substantive vs. procedural).

  8.  **Drafting the Response (Iterative refinement):**
      *   *Tone Check:* Keep it sharp, column-ready. Avoid academic waffle.
      *   *Structure:*
          1.  The Mapping Table.
          2.  The Breakpoints (The "Real Work").
          3.  The Specific Cases (Deception, Coercion, Capacity).
          4.  The Cheap-Exit & Improv.
          5.  The Verdict (Take a stand).
          6.  The "Comments Section" Flags (Contested premises).
      *   *Refining the Contract Table:* Make sure "Consideration" is handled carefully. In sex, the consideration is often the act itself, which makes it weird.
      *   *Refining the Verdict:* Don't sit on the fence. The prompt asks to "actually come down." I will argue the Contract Model is necessary for *law* (clarity) but insufficient for *ethics* (meaning).
      *   *Refining the "Cheap Exit":* It's not just duress; it's about *agency*.
      *   *Refining the "Improv":* It's a good metaphor for *good* sex, but a bad standard for *permissible* sex.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe say contract model is useless.
      *   *Correction:* No, it's useful for criminal law (bright lines). It's bad for ethics. Distinguish the two.
      *   *Initial thought:* Say lying about marriage never invalidates consent.
      *   *Correction:* That's the strict contract view. The prompt asks if that's right. I should argue that lying about *risk* (STI/Pregnancy) invalidates, lying about *emotion* is trickier but often undermines the *quality* of consent even if the *act* was consented to.
      *   *Check:* Did I flag the contested claims? Yes, need a specific section for "What you'll have to defend."

  10. **Final Polish:** Ensure the distinction between "procedural autonomy" (contract) and "substantive autonomy" (improv/relational) is clear. This is the philosophical core the columnist needs.

  *(Self-Correction on the "Improv" point)*: The user worries improv smuggles in a view of what sex is *for*. I need to address that. Improv assumes cooperation. Sex *can* be adversarial or purely hedonic. I should argue that consent requires a *minimum* of cooperation (safety), even if the goal isn't artistic unity.

  *(Final check on constraints)*: "Please actually come down on this." Okay, I will be decisive. "Flag clearly where your verdict is resting on a contested moral or empirical claim." I will add a specific section for this.

