answer: |-
  To analyze the institutional pattern you describe, we must first reconstruct the conceptual architecture of Kant's political philosophy, specifically the triad of Public Right: Constitutional Right (within the state), International Right (between states), and Cosmopolitan Right (between individuals and foreign states). The tension you identify in contemporary international law—between absolute sovereign immunity and universal human rights obligations—mirrors a fundamental tension in Kant's own system: how to enforce Right without creating a global despotism.

  ### 1. Reconstructing the Implicit Theory of Value and Authority

  The contemporary legal order you describe operates on a hybrid theory of authority that is neither purely Westphalian nor fully Cosmopolitan. It treats sovereignty not as a metaphysical absolute, but as a functional status contingent on the performance of specific duties.

  **The Implicit Theory:**
  The system presupposes that the *value* of sovereignty is derivative. It is valuable insofar as it secures a domain of legal certainty and self-determination for a people. However, the *authority* of the sovereign is limited by a higher-order normative layer (human rights/*erga omnes* obligations). This suggests a hierarchy of norms where the protection of the moral status of persons (cosmopolitan concern) ultimately trumps the procedural integrity of state borders (international concern), but only in extreme cases.

  **Kantian vs. Pluralist Interpretation:**
  Does this presuppose a Kantian view?
  *   **The Kantian Reading:** Kant argues that the ultimate end of political right is the freedom of every individual under universal law. Therefore, a state that systematically violates the innate right of its citizens (through genocide or slavery) undermines the very possibility of Right. In this view, sovereignty is legitimate only if it is the sovereignty of a republic (a state governed by law that respects freedom). The *erga omnes* norms align with Kant's Cosmopolitan Right, which binds all agents regardless of state consent.
  *   **The Pluralist Reading:** Alternatively, this could be read as a two-level moral pluralism (akin to later developments in liberal internationalism). Here, sovereignty is intrinsically valuable for "democratic peoples" as a sphere of autonomy, but merely instrumentally valuable for others as a tool for order. On this view, intervention is permitted not because rights are universally binding in a Kantian sense, but because non-democratic states have forfeited the *privilege* of non-interference.

  **Verdict:** The practice leans closer to the **Kantian view**, but incompletely. It recognizes that moral constraints bind states independently of their will (a key Kantian tenet against voluntarism), but it fails to make the *internal constitution* (republicanism) a strict condition for external sovereignty. It punishes the *effects* of tyranny (genocide) without structurally excluding the *cause* of tyranny (non-republican constitution) from the highest councils of power.

  ### 2. Requirements vs. Accommodations

  To assess consistency, we must distinguish what the current order *requires* to function as a legal system versus what it *accommodates* for the sake of political stability.

  **What the Practice Requires:**
  1.  **Subjectivity of States:** It requires states to be treated as moral persons capable of bearing obligations. Without this, treaties are mere coercion.
  2.  **Universality of Prohibitions:** It requires that certain acts (genocide, torture) be defined as crimes against the legal order itself, not just against a specific victim. This is necessary to justify universal jurisdiction.
  3.  **Stability of Expectations:** It requires a baseline of sovereign immunity to allow diplomats and heads of state to negotiate without fear of arbitrary arrest.

  **What the Practice Accommodates:**
  1.  **Non-Republican Regimes:** The UN Charter accommodates despotic states as equals in sovereignty. This is a pragmatic accommodation to the reality of power, not a philosophical requirement of Right.
  2.  **The Veto:** The Security Council veto accommodates the reality of great power competition. It acknowledges that a coercive order cannot function against the will of the militarily dominant.
  3.  **Functional Immunity:** Immunity for heads of state accommodates the need for continuous diplomatic relations, even with regimes that may be internally illegitimate.

  **The Tension:** The accommodation of non-republican sovereignty contradicts the requirement of universality. If the prohibition on torture is universal (*erga omnes*), then a head of state who tortures is not acting as a sovereign agent upholding Right, but as a private criminal violating it. Granting them immunity accommodates political expediency at the cost of legal consistency.

  ### 3. Examining Philosophical Consistency

  Let us test the two specific contradictions you raised through a Kantian lens.

  **A. The Veto and Republican Legitimacy**
  *Premise:* For Kant, a republican constitution is the only one compatible with the freedom of all, and thus the only one reliably disposed toward peace.
  *Contradiction:* Granting veto power to non-republican states institutionalizes the "state of nature" within the federation. The veto allows a particular will (the interest of one despotic regime) to override the general united will of the federation (security and peace).
  *Kantian Analysis:* This is inconsistent. A federation of peace (*foedus pacificum*) is meant to end the state of nature between states. The veto preserves the state of nature for the most powerful actors. If the goal is Perpetual Peace, the mechanism for securing peace cannot grant a unilateral right to perpetuate war (or the threat of war) to any member. Therefore, the veto contradicts the teleological logic of the federation.

  **B. Immunity and Cosmopolitan Right**
  *Premise:* Cosmopolitan Right limits the interaction between states and foreigners, grounding the claim that individuals have rights that transcend their citizenship.
  *Contradiction:* Functional immunity protects the *office* of the head of state. But if the office is used to violate Cosmopolitan Right (e.g., crimes against humanity), the office holder is acting outside the sphere of legitimate public authority.
  *Kantian Analysis:* In Kant's framework, public right must be public. Secret reservations or immunities that shield violations of universal law violate the "Transcendental Formula of Public Right." If a maxim of action (e.g., "leaders are immune from prosecution for mass murder") cannot be publicized without defeating its own purpose, it is unjust. Maintaining immunity for perpetrators of grave crimes treats the state as a private property of the ruler rather than a moral personification of a people. This contradicts the idea that sovereignty resides in the united will of the people, not the physical person of the leader.

  ### 4. A Consistently Kantian Institutional Redesign

  A Kantian redesign must navigate the narrow path between the anarchy of the state of nature and the despotism of a world state. Kant explicitly rejects a "universal monarchy" because it tends toward soulless despotism and lacks the vitality of distinct legal cultures. Therefore, the solution is not a world government, but a **strengthened Federation of Free States**.

  Here is what a consistently Kantian institutional architecture would require:

  **1. From Negative to Positive Federation**
  Current international law is largely a "negative federation"—it prohibits aggression but lacks positive mechanisms for arbitration that are binding. A Kantian redesign requires a **Positive Federation**. This does not mean a global legislature with taxing power, but a permanent congress of states with binding arbitration authority on disputes that threaten peace. Membership would not be merely voluntary in practice; there is a moral *duty* to enter and remain in such a federation.

  **2. Conditionality of Membership (The Republican Precondition)**
  While Kant acknowledges we must deal with non-republics provisionally, a consistent system would tie full voting rights and security guarantees to internal constitutional progress.
  *   **Redesign:** The Security Council (or its equivalent) should not represent "Great Powers" but "Guarantors of Right." Voting weight or veto power should not be assigned based on military capacity (which rewards the state of nature) but on adherence to republican principles and contribution to the federation's legal order.
  *   **Abolishing the Veto:** The veto must be abolished. In a federation of right, no particular will can legally nullify the general will regarding security. Disputes must be settled by adjudication or majority vote, not by force-potential.

  **3. Abolition of Immunity for Violations of Cosmopolitan Right**
  Kantian right is universal. If an individual violates the conditions of possible coexistence (genocide, torture), they place themselves outside the protection of civil right.
  *   **Redesign:** Head-of-state immunity must be pierced for violations of *jus cogens* norms. This does not create a world court with police power (which risks tyranny), but it establishes a legal principle that no domestic jurisdiction can shield acts that violate the universal condition of freedom. This aligns with the concept of *hostis humani generis* (enemy of all mankind). The prosecution can occur in national courts (universal jurisdiction) or a federated tribunal, but the shield of sovereignty must dissolve when sovereignty is used to destroy the possibility of right.

  **4. Distinguishing Intervention from Punishment**
  Kant is wary of intervention because it violates the autonomy of a people. However, if a state has dissolved into a condition where no civil society exists (e.g., mass slaughter by the state against the people), it is no longer a "state" in the moral sense, but a violent faction.
  *   **Redesign:** Intervention is not permissible to "fix" a bad constitution (which must come from within), but it is permissible to stop the violation of Cosmopolitan Right that spills over borders or shocks the conscience of the federation. The justification is not "regime change" (which imposes a will) but "policing the bounds of Right" (which restores the condition for possible peace).

  ### Conclusion

  The contemporary hybrid system is philosophically unstable because it attempts to marry Westphalian sovereignty (which treats the state as a black box) with Cosmopolitan universalism (which looks inside the box). It accommodates non-republics as equals while punishing them as criminals.

  A consistently Kantian resolution rejects the "World State" but also rejects the "Absolute Sovereignty" of the Westphalian model. It demands a **Federation of Republics**. This entails:
  1.  **No Veto:** Because the general united will cannot be held hostage by particular interests.
  2.  **No Immunity for Atrocities:** Because violations of Cosmopolitan Right negate the legitimacy of public office.
  3.  **No Coercive Global Government:** Because freedom requires distinct spheres of public law.

  The tension you observe is the friction of a system transitioning from a state of nature between nations toward a condition of Public Right. The current practice acknowledges the destination (universal rights) but clings to the vehicles of the past (absolute sovereignty and great power privilege). A Kantian redesign would sacrifice the stability of the old order (the veto, the immunity) to secure the legitimacy of the new one, accepting that peace is not the absence of conflict, but the presence of a legal condition where freedom is secured for all.
