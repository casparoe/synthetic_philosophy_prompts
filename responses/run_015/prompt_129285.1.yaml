      *   **Actionable Conditions:**
          1.  **Identification:** Address the endogeneity of institutions. How to prove institutions didn't change *because* of the expectation shift immediately?
          2.  **Pre-registration:** Address the statistician's concern about magnitude predictions in the game arm.
          3.  **Budget:** Clarify the archival arm. If it's humanities, cut it or move it. If it's social science (data extraction), justify it.
          4.  **Falsifiability:** Lock in the focal points *before* analysis (as they promised).

  4.  **Refining the Tone:**
