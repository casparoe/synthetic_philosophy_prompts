      *   **Methodology:** Three arms: (1) Border design (19th-century redistricting, same law/geography), (2) Epidemiological (descendants in same city), (3) Lab-in-the-field coordination games (migrant/non-migrant, transmission channels).
      *   **Panel Disagreements:**
          *   Statistician: Institutions downstream of expectations (endogeneity); game arm lacks magnitude prediction.
          *   Historian: Focal points = equilibrium selection, not culture/meaning interpretation.
          *   Third Member: Definition unfalsifiable (post-hoc redescriptions); Applicants reply they will fix focal points via pre-outcome bylaws.
          *   Budget: 4 years requested; archival arm might belong to humanities budget.
      *   **Requirements:**
