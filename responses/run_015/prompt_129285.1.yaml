      *   *Option C: Fund Conditional on Changes.* This seems the most "council-like" solution for a split panel. It acknowledges the potential but demands rigor on the contested points (identification, definition operationalization, budget).
      *   *Option D: Fund Reduced Version.* Addresses the budget line issue but might gut the archival arm which is crucial for the "pre-outcome" fix.
      *   *Decision:* **Fund Conditional on Specified Changes with a Resubmission Deadline.** This allows the project to proceed if they can tighten the identification and clarify the budget, satisfying the skeptics while keeping the innovation alive. It also addresses the "humanities budget" issue by potentially shifting the archival load or clarifying the social science nature of the archival work. Actually, looking at the budget constraint ("archival arm may fall under humanities"), a *Reduced Version* or *Conditional* that addresses the budget line is safer. Let's go with **Fund Conditional on Specified Changes**, specifically addressing the identification strategy (to satisfy the statistician), the operationalization of "culture" (to satisfy the historian/third member), and the budget line (to satisfy council rules).

