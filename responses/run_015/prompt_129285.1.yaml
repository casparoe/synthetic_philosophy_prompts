answer: |-
  **MEMORANDUM**

  **TO:** Social-Science Panel, National Research Council
  **FROM:** [Your Name/Panel Member]
  **DATE:** 10th of [Month]
  **RE:** Decision Recommendation: Coordination and Expectations Lab (Application #4492)

  **Recommendation**
  I recommend that the panel **fund this project conditional on specified changes**, with a resubmission deadline of 30 days prior to the next funding cycle. The proposal offers a rigorous attempt to operationalize "culture" without relying on the unobservable mechanics of inherited values, shifting the locus of explanation to common-knowledge expectations. However, the current design leaves critical identification strategies vulnerable to endogeneity critiques and budgetary classification errors. A conditional award allows us to support the methodological innovation while securing the causal claims required by council rules.

  **Causal Identification and the "Opposite Answer" Test**
  Per council rules, any funded project making a causal claim must rest on a design that could in principle have delivered the opposite answer. This project meets that test, but the margin for error is narrow and rests almost entirely on the **border design arm**. For the causal claim to hold, the administrative redistricting must constitute an exogenous shock to expectations that is not simultaneously a shock to institutional capacity. If the archival evidence reveals that the redistricting altered enforcement mechanisms or administrative resources alongside the focal points, the design cannot distinguish culture from institutions, and the result would be indeterminate. The lab-in-the-field arm, while useful for mechanism, cannot independently satisfy this test because it lacks the exogenous variation required to rule out selection effects. Therefore, the viability of the causal claim turns on the archival verification that the "focal points" varied while formal institutional constraints remained identical.

  **Theoretical Scope and the "Losing Side" Concern**
  We must be plain about what this funding decision purchases. A significant portion of the panel remains unconvinced that explaining behavior via equilibrium selection constitutes "cultural explanation" in the sense traditionally understood by the humanities or historical sociology. If we fund this, we are explicitly endorsing a definition of culture as *coordination expectations* rather than *normative commitments*. There is a genuine risk, as noted by the historian on the panel, that a successful result will not settle the debate over culture's causal role but merely relabel the dispute: demonstrating that people coordinate on different equilibria does not necessarily explain *why* those specific meanings hold sway over agents. We are funding a study of how expectations stabilize economic behavior, not necessarily why those expectations are meaningful. This is a valid social-science question, but applicants must acknowledge in their dissemination plan that a positive finding validates a game-theoretic definition of culture, which may not satisfy proponents of interpretive or values-based frameworks.

  **Conditions for Funding**
  To address the panel's split and ensure the project is actionable, the following changes are required in the resubmission:

  1.  **Identification Strategy (Statistician's Concern):** The applicants must strengthen the exclusion restriction for the border design. Specifically, they must provide preliminary archival evidence demonstrating that administrative capacity and enforcement intensity did not diverge across the new district line immediately following redistricting. If institutions are downstream of expectations, the lag between the expectation shock and any institutional adjustment must be quantified to ensure the outcome period captures the cultural effect, not the institutional one.
  2.  **Pre-registration of Magnitude (Statistician's Concern):** The lab-in-the-field arm must include a pre-registered prediction regarding the *magnitude* of the coordination effect, not merely its direction. A null result must be distinguishable from a underpowered test.
  3.  **Operationalizing Focal Points (Third Member's Concern):** The promise to fix focal points using pre-outcome cooperative bylaws must be codified as a strict analysis plan. The specific bylaws serving as the proxy for "expectations" must be listed in the pre-analysis plan to prevent post-hoc redescription of regularities.
  4.  **Budget and Scope (Council Rules):** The four-year budget request must be revised. The archival arm involves coding bylaws for game parameters, which is social-science data collection, not historical interpretation. The budget must be reduced to reflect data extraction rather than historical narrative, or the applicants must justify the full four years under our social-science line by demonstrating that the archival work is quantitative in nature. If the work is primarily qualitative/historical, that portion must be removed or funded through a humanities partnership.

  **Next Steps**
  The applicants should be informed that the panel views the theoretical reframing of culture as a strength, provided the empirical execution can withstand the endogeneity critiques outlined above. I will circulate this memo for annotation by the 12th, with a view to finalizing the decision at our meeting on the 14th.
