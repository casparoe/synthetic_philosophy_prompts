answer: |-
  1. **Necessity push — 75/100**
     *What would move it:* Longitudinal data showing whether women in developing nations switch out of STEM as soon as their household income crosses a stability threshold.

  2. **Complimentary institutions — 40/100**
     *What would move it:* A comparison of career segregation between two equally wealthy nations with drastically different parental leave and part-time work policies.

  3. **Framing bandwidth — 25/100**
     *What would move it:* Cross-cultural implicit association tests measuring whether "career as identity" correlates with gendered vocational interests independent of GDP.

  4. **Release — 55/100**
     *What would move it:* Controlling for the "relative strength" hypothesis (math vs. reading scores) to see if the gender gap persists among students with identical academic profiles.

  5. **Index artifact — 65/100**
     *What would move it:* Re-running the regression models replacing the Global Gender Gap Index with raw GDP per capita and individualism metrics to see if the effect disappears.

  6. **Backlash — 15/100**
     *What would move it:* Psychometric evidence that women in high-equality nations report higher system-justification beliefs or essentialist views than women in less egalitarian nations.

  ***

  **(a) If the pattern appeared in *stated preferences* rather than enrollments:**
  The item that takes the biggest fall is **Complimentary institutions (2)**, because policy structures constrain *choices* but do not dictate *desires*. The item that gains the most is **Release (4)**, because stated preferences strip away labor market friction, leaving intrinsic interest as the primary remaining variable.

  **(b) The one item where my number is most likely wrong:**
  **Index artifact (5)**. This is the most technically volatile estimate; if future econometric work confirms that the "paradox" vanishes entirely when properly controlling for economic development rather than gender policy, this number should be near 100, but if the correlation holds across alternative equality metrics, it should be near 0.
