      *   **Natural Kind vs. Construct:** Is intelligence a "thing" out there (like gold) or a useful label we invented (like "weed")? In humans, positive correlations suggest a natural kind-ish structure ($g$). In AI, architecture dictates capability, so "intelligence" is fragmented.
