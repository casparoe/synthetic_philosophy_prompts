      So, is progress possible? Yes, but not by defining 'intelligence' better. Progress requires decoupling the questions. We should stop asking 'Is this system intelligent?' and instead ask three distinct questions. First, what is the predictive validity of this metric for the specific task environment? Second, what is the architectural mechanism allowing this performance, and how flexible is it? Third, what moral obligations arise from this system's capacities, independent of its label?

      The hidden empirical question you noted is crucial. If future AI systems begin to show positive correlations across tasks similar to humans, that would suggest a convergent natural kind. If they remain jagged, it confirms intelligence is a pluralistic concept. Until then, the disagreement will persist because each side is solving a different problem. The psychometricians are mapping human variation; the educators are designing interventions; the AI researchers are building optimisers; and the ethicists are guarding moral boundaries. They are not talking past one another so much as talking about different things under the same name. The crisis you perceive is real, but it is a crisis of vocabulary, not of understanding. We do not need a better definition; we need to retire the word in technical contexts and use precise descriptions of capability, mechanism, and status instead.

