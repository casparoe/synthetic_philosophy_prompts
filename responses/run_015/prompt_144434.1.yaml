      Your hypothesis is remarkably astute. You have identified that the stagnation in this debate is not due to ignorance of facts, but because the word 'intelligence' is being asked to carry too much weight. It is not merely a verbal dispute, nor purely a substantive one; it is a category error where distinct questions are being funnelled into a single label. Your suggestion that the term performs three separate jobs—prediction, explanation, and moral valuation—is correct, but I would refine your view on the 'natural kind' aspect.

      The psychometric camp treats intelligence as a predictive tool. In humans, they are empirically correct: performance across disparate tasks does correlate positively. This 'positive manifold' suggests a general factor, often called $g$. For your warehouse hiring, a single score might successfully predict who learns the layout fastest. However, this is a statistical regularity, not necessarily a mechanistic truth. It tells you *that* someone will perform, not *how* or *why*. When educators argue for separable capacities, they are focusing on the mechanistic job. If you wish to improve a worker's skill, knowing they have 'low intelligence' is useless; knowing they struggle with spatial rotation but excel at procedural memory allows for targeted training. Both sides are right because they are optimising for different outcomes: selection versus improvement.

      The AI perspective complicates this by removing the biological constraint. Human brains are general-purpose learning machines shaped by evolution, which forces correlations between abilities. Artificial systems are engineered for specific loss functions. Your example of the system that learns video games but cannot add numbers illustrates that without biological unity, 'intelligence' fragments. This suggests intelligence is not a natural kind like 'gold', which exists independently of our classification, but rather a functional label like 'vehicle'. A bicycle and a rocket are both vehicles, but sharing a label does not imply they share an engine. The jagged profiles of AI models reveal that generalisation is an architectural choice, not a defining feature of mind.

