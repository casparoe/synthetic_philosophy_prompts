  3. The animal lacks reason and language, defined by novel sign use and universal adaptability, which is defensible but contested and does not license dismissal because it counts the robot as thinking while excluding the cephalopod, showing the criterion is irrelevant to suffering.
  4. The animal lacks an immaterial soul required for mental states, a metaphysically contested claim that does not license dismissal under modern scientific assumptions because welfare depends on experience rather than substance.
  5. The animal lacks phenomenal experience entirely, having no subjective quality of life, which is false but is the only thesis that genuinely licenses dismissing the proposal.
