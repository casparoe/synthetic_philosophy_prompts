answer: |-
  **Appendix C: Seminar Assessment Material**

  **Course:** Comparative Political Ethics (GRD-504)
  **Assessment:** 90-Minute Essay Examination
  **Topic:** The Cross-Cultural Validity of Corruption Norms

  ***

  ### Essay Question

  Critically evaluate the claim that applying Western-derived anti-corruption norms to practices of reciprocal gift-exchange and patron-client obligation inevitably produces conceptual distortion. In your response, construct a principled distinction between 'corruption,' 'legitimate reciprocity,' and 'constitutive social obligation' that avoids both unexamined cultural relativism and uncritical universalism. You may engage with proceduralist accounts, family-resemblance concepts, or alternative normative frameworks, but you must specify the criteria used to distinguish abuse from obligation.

  ***

  ### Model Answer

  The assertion that transnational anti-corruption norms inevitably distort local practices of reciprocity contains a partial truth but risks overstating the incommensurability of ethical frameworks. To navigate this without retreating into relativism or universalism, one must separate the core definition of corruption from the contextual evaluation of specific exchanges. Conceptually, there is a settled consensus among political theorists that corruption involves the abuse of entrusted power for private benefit. This definition relies on the existence of a public role and a violation of the duties attached to that role. Where this structure is absent—such as in private gift-giving between equals—the label 'corruption' does not apply. However, the distortion arises not from the definition itself, but from the uncritical transplantation of specific institutional expectations regarding what constitutes 'entrusted power' and 'private benefit.'

  Standard transparency indices often operationalize corruption through a Weberian ideal of bureaucratic impersonality. When applied to contexts where social safety nets are weak and kinship obligations are constitutive of personhood, this framework misidentifies survival strategies or social glue as deviance. For example, a public official hiring a cousin may be classified as nepotism by an international index. However, if the local normative framework views the official as a node in a kinship network rather than an autonomous bureaucratic agent, the 'abuse' is less clear. To avoid conceptual distortion, we must adopt a proceduralist account focused on the *publicity* of the exchange rather than the exchange itself. A practice constitutes corruption not merely because it involves reciprocity, but if the justification for the act cannot be publicly defended to those excluded from the exchange without undermining the system's legitimacy.

  This distinction allows us to separate legitimate reciprocity from corruption. Legitimate reciprocity operates within known, accepted rules that participants recognize as binding. Constitutive social obligation refers to duties inherent to a social role (e.g., caring for kin). Corruption occurs when these obligations override the specific public trust entrusted to the actor in a way that is hidden or indefensible to the broader constituency. However, applying this test requires empirical nuance. It is here that specialists remain genuinely contested. Some anthropologists argue that patron-client networks, while exclusionary, provide informal accountability where formal institutions are predatory. In this view, the patron is held accountable by the client through reciprocal obligation, creating a functional, albeit informal, democratic check.

  Conversely, institutionalists argue that such networks systematically exclude outsiders and固化 (solidify) inequality, violating the public trust inherent in the concept of modern statehood. Neither view represents a consensus. Therefore, a robust ethical framework must acknowledge that while the *concept* of corruption (abuse of trust) is universal, the *threshold* for what constitutes a breach is context-dependent. The distortion occurs when observers confuse the threshold with the concept.

  Ultimately, avoiding conceptual distortion requires treating corruption as a family-resemblance concept rather than a natural kind. We look for overlapping features—secrecy, exclusion, violation of specific duties—rather than a single necessary condition. This allows us to condemn practices that harm public trust without condemning the social fabric that sustains vulnerable populations. The key is not to abandon universal norms, but to ensure those norms are sensitive to the functional role informal obligations play in specific political economies.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Definition of Core Concept (5 Marks)**
  *   **Requirement:** Clearly defines corruption based on 'abuse of entrusted power' or similar settled theoretical ground, distinguishing it from private exchange.
  *   **Typical Failure:** Defines corruption circularly (e.g., "breaking the law") or conflates it with all gift-giving.
  *   **Award:** 5 for precise distinction; 3 for vague definition; 0 for missing.

  **2. Critique of Universalist Indices (5 Marks)**
  *   **Requirement:** Identifies *why* standard indices cause distortion (e.g., Weberian bias, ignoring context of weak institutions) without rejecting norms entirely.
  *   **Typical Failure:** Dismisses all indices as "Western imperialism" without analyzing the specific conceptual mismatch.
  *   **Award:** 5 for structural critique; 3 for general complaint; 0 for defense of indices as flawless.

  **3. Avoidance of Relativist Trap (5 Marks)**
  *   **Requirement:** Acknowledges social function of patronage but maintains a normative limit (e.g., harm, exclusion, secrecy) to avoid saying "anything goes."
  *   **Typical Failure:** Argues that because a practice is cultural, it cannot be criticized (strong relativism).
  *   **Award:** 5 for nuanced limit-setting; 3 for wavering; 0 for full relativism.

  **4. Construction of Distinguishing Framework (5 Marks)**
  *   **Requirement:** Proposes or tests a specific criterion (e.g., publicity, proceduralism, family-resemblance) to separate obligation from corruption.
  *   **Typical Failure:** Lists examples without offering a principled tool for distinction.
  *   **Award:** 5 for novel/clear framework; 3 for borrowed concept without application; 0 for no framework.

  **5. Identification of Contested Ground (5 Marks)**
  *   **Requirement:** Explicitly marks empirical/normative claims (e.g., patronage as accountability) as debated among specialists, not consensus.
  *   **Typical Failure:** Presents one scholarly view (e.g., "patronage is always bad") as objective fact.
  *   **Award:** 5 for clear demarcation of debate; 3 for ambiguity; 0 for false consensus.

  **Grading Distinctions:**
  *   **B-Level (Competent):** Successfully maps the debate, hits all five moves, and correctly identifies settled vs. contested claims. The framework used is standard (e.g., standard publicity principle).
  *   **A-Level (Distinctive):** Hits all five moves but introduces a novel conceptual refinement (e.g., distinguishing between 'system-maintaining' vs. 'system-undermining' reciprocity) or utilizes a precise counter-example that challenges the proposed framework before resolving it.
