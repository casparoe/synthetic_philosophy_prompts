          *   *Definition:* A preference shift is rational only if it tracks a change in the *object* of preference (info, world state, physiological state) rather than a mere shift in the *subject's* ranking function without cause.
          *   *Application:* Case 1 (Fail), Case 2 (Pass - info), Case 3 (Pass - state).
