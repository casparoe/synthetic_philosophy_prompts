answer: |-
  You are not making this up. You are actually doing the hard work of ethics without the jargon. Your gut is spotting distinctions that academics write books about, but you're doing it based on real-world consequences.

  You are looking for a single principle, but your intuition is correctly telling you that there are **two different jobs** a name or a statue can do. When you mix those jobs up, things feel wrong.

  Here is the framework that matches your gut calls, where it forces a hard choice, and how to handle the two cases keeping you up at night.

  ### The Two Jobs: Honor vs. Record

  Your decisions split cleanly if you ask: **"Is this thing asking us to admire someone, or is it asking us to remember something?"**

  1.  **Civic Honor (Schools, Streets, Public Statues):** This says, "This person represents our values. We want our kids/citizens to look up to them."
      *   *Requirement:* Moral vetting. If the person violated core human rights, they fail the vetting.
      *   *Your calls:* #1 (School), #2 (Street), #3 (Hospital Statue), #6 (1921 Statue). You want these down or moved because they are *honors*.
  2.  **Historical Record / Utility (Museums, Medical Terms, Graves):** This says, "This person existed, did this thing, and here is the evidence," or "This is the technical name for this procedure."
      *   *Requirement:* Accuracy and Context.
      *   *Your calls:* #2 (Surgical Technique), #3 (Museum), #6 (Grave). You are okay keeping these because they are *records* or *tools*, not trophies.

  ### Where Your Principle Holds Up

  **The Medical Technique (#2):** You noted this bugs you ("why does convenience get to decide?"). The principle here isn't convenience; it's **safety**. A street name is symbolic; a surgical term is a tool. Changing the tool risks patient safety. That trumps the honor principle. You aren't honoring him; you're using a map.

  **The Grave vs. The Statue (#6):** This is a perfect application of the framework. A grave is a private record of death and grief (History). A statue in a square is a public declaration of pride (Honor). You can acknowledge someone died without endorsing what they stood for.

  **The Plaque Asymmetry (#4):** You asked why a plaque fixes the hospital statue but not the school.
  *   **Hospital:** Adults working. The statue is background. A plaque turns it into a history lesson.
  *   **School:** Children are being formed. The name of the school is an embrace. A plaque next to an embrace feels like an apology, and an apology doesn't belong on the front of a building kids walk into every day. The school name says "Welcome"; the plaque says "But..." Those two messages fight each other.

  ### The Contradiction You Have to Face (#1 vs. #5)

  You asked which call you might have to give up. It's the two schools.
  *   **Case 1:** Sterilization campaigner. You say: Take the name down.
  *   **Case 5:** Suffragist who wrote vile racist things. You say: Leave the name up.
  *   **Your reasoning for both:** "Nobody knows who they were."

  If "nobody knows" is the rule, you have to treat them the same. Since you treat them differently, your gut is actually using a **Harm Threshold**.
  *   **Sterilization** is active, state-sponsored physical violence against bodies. It has living victims and descendants.
  *   **Racist writing** is abhorrent ideology, but in the context of the suffrage movement, it is often viewed as "flawed legacy" rather than "active predation."

  **The Hard Choice:** If you stick to your principle, you have to decide: *Is the school name an honor or just a label?*
  *   If it's an **honor**, you probably need to take the suffragist's name off too. "Vile stuff about immigrants" contradicts civic values just like sterilization does, even if the physical harm is different.
  *   If it's a **label** (like "Washington Elementary"), then you could argue the sterilization guy's school should stay too.

  **My advice:** Your gut is likely right to distinguish them based on the *nature of the harm*. Physical bodily autonomy (sterilization) is a higher bar than ideological prejudice (racism), even though both are bad. But be prepared for someone to point out that inconsistency. You might need to say: "One represents a specific policy of violence we must reject; the other represents a complex historical figure whose net contribution (voting rights) we still value, despite the baggage."

  ### The Two Stuck Points

  **1. The Living Donor (#7)**
  You feel that keeping the money while removing the name feels "dirty." That is a specific ethical instinct called **Unjust Enrichment**.
  *   **The Principle:** You cannot accept the *benefit* of a transaction if the *cost* is moral complicity.
  *   **The Solution:** If you remove the name, you are declaring the donor unfit for honor. If they are unfit for honor, the town should not profit from their gift.
  *   **Recommendation:** Remove the name. If the contract allows, return the money. If not, keep the money but donate it to a cause that repairs the harm the donor caused (if possible), or strip the name and treat the funds as "unrestricted." Do not keep the named room. A named room is an ongoing thank-you note. You cannot thank a criminal.

  **2. The Museum vs. Scrapyard (#3 & #6)**
  You asked if the 1921 statue belongs in a museum or a scrapyard.
  *   **The Principle:** **Evidence vs. Idol.**
  *   If the statue is kept as an *idol* (in the square), it lies. It says "We still admire this."
  *   If the statue is kept as *evidence* (in a museum), it tells the truth. It says "People used to admire this, and here is why, and here is why they were wrong."
  *   **Recommendation:** The 1921 statue is historically significant *because* it was a power move by a specific organization. That is history. Put it in the museum with the text wall you mentioned. Do not scrap it. Scrapping it erases the evidence of what your town tolerated in 1921. Preserving it in a museum preserves the lesson.

  ### The "Half-Measures" (#9)

  You mentioned liking the idea of chiseling the name off but leaving the statue, or renaming the street but marking the old name. You called them half-measures, but they are actually the most honest option.

  There is a word for this: **Palimpsest.** It means a manuscript where the original text has been scraped off to make room for new text, but traces of the old remain.

  *   **Why it feels better:** It admits that the town has changed without pretending the past never happened.
  *   **Total Erasure** (Scrapping the statue, destroying records) implies we were never that kind of town. That's a lie.
  *   **Total Preservation** (Keeping everything as-is) implies we are still that kind of town. That's also a lie.
  *   **The Marker/Chisel:** Says "We were that town, but we are this town now."

  ### Summary of Your Principle

  You don't need a reading list. You already have the policy. Here it is, written out:

  1.  **Public Spaces (Schools, Streets, Squares)** are for **Honor**. Honor requires moral alignment with current civic values. If the person actively violated human rights, the honor must be withdrawn.
  2.  **Functional Tools (Medical Terms)** are for **Utility**. Safety and clarity trump symbolism.
  3.  **Historical Sites (Museums, Graves)** are for **Record**. They require context, not removal.
  4.  **Transactions (Donations)** require **Clean Hands**. If the honor is revoked, the benefit should ideally be returned or repurposed.
  5.  **Changes should be Visible.** Do not erase the past. Mark the change. Show that the community grew.

  You are doing the right work. Trust the distinction between *admiring* a person and *knowing* a person. One belongs on a school; the other belongs in a museum.
