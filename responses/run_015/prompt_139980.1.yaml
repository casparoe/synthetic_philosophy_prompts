      *   **Current Activity:** Sitting in on a philosophy seminar (therapy vs. enhancement distinction).
      *   **Problem:** Trying to formulate a principle based on ecological "fit" (disorder = mismatch with environment, therapy = repair fit, enhancement = change capability). The principle is failing on specific cases (especially 4, 6, 11).
