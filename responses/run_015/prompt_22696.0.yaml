prompt: |-
  I've been reading a lot about time-inconsistent preferences lately — the hyperbolic discounting literature, and the whole "Ulysses contract" and precommitment apparatus that comes up so often on the rationalist forums — and it has me wondering whether it is really the same phenomenon that the philosophers mean by akrasia, or whether we have been quietly conflating two different things. I raised it at a dinner with two friends, and they got into it in a way I could not referee. One, let's call her Mara, keeps insisting that hyperbolic discounting is not akrasia at all; the other, Dev, thinks it is actually a cleaner case of akrasia than the stock "I meant to go to the gym" examples.

  Here is roughly how it went. Mara opened by saying that akrasia, properly understood, is acting against one's own *synchronous* judgment: at the very moment of action, one judges A to be the best thing to do and then does B. Hyperbolic discounting does not produce that. At any given moment the discounting agent's preferences are internally consistent — given where it is on the clock, it genuinely judges the immediate option to be better, and there is no gap between its judgment and its action. What changes is the judgment itself, as time passes, in exactly the way that someone who prefers coffee in the morning and tea in the afternoon does not have a weakness of will but simply has time-indexed preferences. So what we have been calling "weakness of will," she said, is really just ordinary, unremarkable preference change over time, and the label "akrasia" has been doing a lot of work it cannot support.

  Dev pushed back on two fronts. First, he said the synchronous-judgment criterion is too narrow and quietly assumes the very thing in dispute. The hallmark of the hyperbolically discounting agent is that it *knows* its future self will flip: at the planning stage it judges that it would be better to follow the plan, and at the moment of temptation it does the impulsive thing anyway. So there is a violated judgment after all — just a diachronic or higher-order one, a judgment about what the agent ought to do given what it knows about its own future behavior. Second, he said that the move "I override my past self all the time, that is just how I change my mind" is doing too much work. Changing one's mind in light of new evidence is one thing; being systematically captured by a transient, steeply-discounted impulse is another. The signature of the hyperbolic agent, he said, is precisely that it would *pay to precommit* — it would prefer to be a creature that does not have this preference-reversal property, but it cannot bring itself to be one. That "I know I should commit but I cannot" is, he argued, the very signature of weakness of will, not its absence.

  Mara conceded that the agent would pay to precommit, but said that fact does not make it akratic; it only makes the agent's preferences *expensive*, in the way that a person with a strong but mistaken fear of flying is paying a cost. And she returned to the multiple-selves framing: if each time-slice is treated as a distinct agent, then the present slice is not violating any of its *own* judgments at all — it is just a different agent making a different choice, the way I can rationally refuse to honor a promise my younger self made. Dev replied that the multiple-selves framing does not dissolve the problem, it only relocates it. If the present slice is a different agent, then it is *harming* a future slice it genuinely cares about, which is a form of akrasia at the individual level; and the fact that the agent cannot "just make a plan and stick to it" is exactly the weakness of will that Mara wants to deny. They were still going when I had to leave, and I honestly could not tell who was more right. So please go through their exchange and tell me, move by move, who is right about which specific point — and then say what, if anything, both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The relationship between hyperbolic discounting (behavioral economics/psychology) and *akrasia* (weakness of will, philosophy).
      *   **Context:** A dinner conversation between two friends, Mara and Dev.
      *   **Mara's Position:** Hyperbolic discounting is *not* akrasia. Akrasia requires acting against one's *synchronous* judgment (judging A best now, doing B now). Hyperbolic discounting involves preference reversal over time, which is just changing preferences, not weakness of will. The "multiple selves" view explains it away as inter-agent conflict, not intra-agent weakness.
      *   **Dev's Position:** Hyperbolic discounting *is* akrasia (perhaps a cleaner case). Akrasia can be diachronic/higher-order (violating a prior plan one endorsed). The willingness to pay for precommitment signals a recognition of a defect in agency. The "multiple selves" view doesn't solve the normative problem; harming one's future self is still a failure of rational agency.
      *   **Task:** Evaluate their exchange move-by-move, determine who is right on specific points, and identify what both might be missing.

  2.  **Deconstruct the Arguments:**

      *   **Mara's Core Claim:** Akrasia = Synchronous Contradiction (Judgment $J_t$ says $X$, Action $A_t$ is $Y$).
      *   **Dev's Core Claim:** Akrasia = Diachronic Contradiction / Failure of Self-Governance (Plan $P_{t-1}$ says $X$, Action $A_t$ is $Y$, despite knowing $P_{t-1}$ was better).

      *   **Mara's Sub-claim:** Hyperbolic discounting is just time-indexed preferences (like coffee vs. tea).
      *   **Dev's Counter:** It's not just change; it's *reversal* driven by proximity, often against one's own stable values. Evidence: Demand for precommitment.

      *   **Mara's Sub-claim:** Multiple selves view dissolves the normativity (Present Self isn't bound by Past Self).
      *   **Dev's Counter:** Multiple selves view relocates the problem (Present Self harms Future Self). Precommitment desire shows unity of agency is desired.

  3.  **Evaluate Move-by-Move (Philosophical & Economic Literature Check):**

      *   *Definition of Akrasia:*
          *   Traditional (Aristotle/Davidson): Synchronous. "Knowing better but doing worse" *at the moment of action*.
          *   Mara is technically closer to the strict Davidsonian definition here. If the agent *truly* believes $Y$ is best at $t$, doing $Y$ is rational *at t*.
          *   However, Dev points out that this definition might be too narrow for the *phenomenon* we care about (self-control failures).
          *   *Verdict:* Mara is right on the strict historical definition, Dev is right on the functional/psychological phenomenon.

      *   *Preference Change vs. Preference Reversal:*
          *   Mara: Coffee/Tea analogy.
          *   Dev: It's systematic reversal, not organic growth.
          *   *Literature:* Hyperbolic discounting is distinct from exponential discounting with changing tastes. It creates dynamic inconsistency. If I prefer $100 now over $110 tomorrow, but prefer $110 in 366 days over $100 in 365 days, that's a contradiction in valuation structure, not just content.
          *   *Verdict:* Dev is stronger here. Coffee/Tea is exogenous taste change. Hyperbolic discounting is endogenous structural inconsistency.

      *   *Precommitment:*
          *   Mara: Just expensive preferences (like fear of flying).
          *   Dev: Willingness to restrict future choice signals a judgment that the future choice will be *wrong*.
          *   *Literature:* This is the "Ulysses Contract" argument (Elster, Schelling). If I pay to bind myself, I am admitting my future unbound self is not to be trusted. This implies a normative hierarchy.
          *   *Verdict:* Dev is stronger. Fear of flying is an error in belief/risk assessment. Precommitment against temptation is a recognition of a failure in *volition*.

      *   *Multiple Selves:*
          *   Mara: Present self is a different agent. No obligation to past self.
          *   Dev: Still harms future self. Agent wants to be unified.
          *   *Literature:* Parfit's "Reasons and Persons" discusses this. If we are a series of selves, prudence becomes altruism. But most people *feel* like a unified self and suffer from the disconnect. The *experience* of akrasia relies on a sense of identity over time.
          *   *Verdict:* Dev is right that it doesn't dissolve the normative tension for the *person* experiencing it. Mara is right that it dissolves it for the *theorist* modeling time-slices.

  4.  **Synthesize the "Missing" Elements:**
      *   What are they both ignoring?
      *   **The Nature of Judgment:** Mara assumes judgment is purely cognitive (belief about value). Dev assumes judgment is volitional (plan). They might be missing the role of *attention* or *salience*. (e.g., George Ainslie's "picoeconomics" – the temptation hijacks attention, temporarily altering the judgment).
      *   **The Normative Standard:** They are arguing about *description* (is this akrasia?) without agreeing on the *norm* (what is rational agency?). Is rationality coherence over time or coherence at an instant?
      *   **The Phenomenology:** They are treating the agent as a black box. The *feeling* of struggle is central to akrasia. Hyperbolic discounting can happen without struggle (impulse), whereas traditional akrasia implies struggle.
      *   **External vs. Internal:** Mara treats preferences as given. Dev treats them as manageable. They miss the *constructive* nature of will (making up your mind).

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the depth of the debate. It's a classic clash between analytic philosophy (Mara) and behavioral econ/pragmatism (Dev).
      *   *Move 1: The Definition of Akrasia (Synchronous vs. Diachronic).* Mara wins on tradition, Dev wins on utility.
      *   *Move 2: Preference Change vs. Reversal.* Dev wins. The coffee analogy fails because hyperbolic discounting is structurally inconsistent, not just different.
      *   *Move 3: Precommitment.* Dev wins. Willingness to pay to bind oneself is the "smoking gun" of recognized irrationality.
      *   *Move 4: Multiple Selves.* Mara wins on logical consistency of the model, Dev wins on the lived experience of agency.
      *   *What they miss:*
          1.  **Picoeconomics/Attention:** The mechanism isn't just time, it's salience.
          2.  **The Normative Hierarchy:** Who is the "real" self? (Frankfurt's higher-order desires).
          3.  **The Phenomenology of Struggle:** Akrasia feels like a fight; hyperbolic discounting can be automatic.
      *   *Conclusion:* Dev is more practically right about the human condition; Mara is more technically right about the logical definition. The conflation is useful but needs nuance.

  6.  **Refining the Tone:**
      *   Ensure neutrality.
      *   Use philosophical terminology correctly (Davidson, Parfit, Frankfurt, Elster).
      *   Keep the structure clear (Move-by-Move analysis, then Synthesis).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I represent Mara's "Multiple Selves" argument fairly? Yes, it's the Parfitian reductionist view.
      *   *Check:* Did I capture Dev's "Precommitment" argument? Yes, it's the Schelling/Elster view.
      *   *Nuance:* Make sure to highlight that Mara isn't *wrong* about the logic, just perhaps missing the point of why we care about akrasia.
      *   *Key Insight:* The core disagreement is about *Personal Identity*. If you are a sequence of selves, Mara is right. If you are a persisting entity, Dev is right. I need to make this explicit.

  8.  **Final Polish:** Check against the prompt requirements ("move by move", "who is right", "what are they missing"). (Proceed to generate output based on this structure.)
answer: |-
  This is a sophisticated dispute that cuts to the heart of moral psychology, decision theory, and the philosophy of action. Mara is arguing from a position closer to **Davidsonian action theory** and **Humean preference satisfaction**, while Dev is arguing from **behavioral economics**, **Schelling/Elster precommitment theory**, and a **Frankfurtian hierarchy of desires**.

  Neither is entirely "right" because they are operating with different definitions of the "self" and "rationality." However, we can adjudicate specific moves based on logical consistency and explanatory power.

  Here is the move-by-move breakdown, followed by what both are missing.

  ### Move 1: The Definition of Akrasia (Synchronous vs. Diachronic)

  **Mara's Claim:** Akrasia requires a synchronous contradiction (judging $A$ best at $t$, doing $B$ at $t$). Hyperbolic discounting involves no contradiction at $t$; the preference simply flips.
  **Dev's Claim:** Akrasia can be diachronic. The violation is of a prior, reflective plan that the agent still endorses as "best" overall, even if not "best" locally at $t$.

  **Verdict: Mara is technically correct on the history; Dev is correct on the phenomenon.**

  *   **Why Mara is right:** In the strict analytic tradition (e.g., Donald Davidson), *akrasia* is logically puzzling precisely because it violates the principle of continence: "If an agent judges $A$ better than $B$, all things considered, they cannot intentionally do $B$." If the hyperbolic agent, at the moment of temptation, genuinely values the cigarette more than health *in that instant*, they are acting rationally according to their current utility function. Mara is correct that calling this "irrational" requires assuming the current utility function is defective.
  *   **Why Dev is right:** Mara's definition renders the concept of "self-control" almost vacuous. If we only look at the synchronous snapshot, no one ever acts against their will; they just act on their strongest current desire. Dev correctly identifies that the *point* of discussing akrasia is to capture the failure of **self-governance over time**. If we cannot call hyperbolic discounting akrasia, we lose the vocabulary to describe the conflict between "what I want now" and "what I want to be."

  ### Move 2: Preference Change vs. Preference Reversal

  **Mara's Claim:** Hyperbolic discounting is like preferring coffee in the morning and tea in the afternoon. It is just time-indexed preference change.
  **Dev's Claim:** It is not organic change; it is a systematic structural flaw (reversal) that the agent recognizes as undesirable (evidenced by the desire to precommit).

  **Verdict: Dev is decisively right.**

  *   **The Flaw in Mara's Analogy:** Preferring coffee at 8 AM and tea at 4 PM is **exogenous** taste variation. It does not create dynamic inconsistency. If I plan at 8 AM to drink tea at 4 PM, I will happily do so.
  *   **The Reality of Hyperbolic Discounting:** This creates **endogenous** dynamic inconsistency. At $t_1$ (far from reward), I prefer \$110 in 366 days over \$100 in 365 days. At $t_2$ (close to reward), I prefer \$100 *now* over \$110 *tomorrow*.
  *   **Why Dev Wins:** This is not merely "changing one's mind." This is a violation of **transitivity** over time. If my preferences reverse solely due to the passage of time without new information, my preference structure is mathematically guaranteed to frustrate my own goals. Mara treats the preference as sovereign; Dev treats the *structure* of the preference as the object of evaluation. Dev is right that this is a defect, not a feature.

  ### Move 3: The Argument from Precommitment

  **Mara's Claim:** Willingness to pay for precommitment just means the preferences are "expensive" (like a fear of flying). It doesn't imply irrationality.
  **Dev's Claim:** Willingness to restrict one's own future choice set is the signature of acknowledging a future failure of rationality.

  **Verdict: Dev is right.**

  *   **Standard Rational Choice:** A standard rational agent (with exponential discounting) never pays to restrict their own future options unless the restriction itself provides utility (e.g., a promise). They trust their future self to maximize utility.
  *   **The Ulysses Contract:** As Jon Elster and Thomas Schelling argued, seeking a "Ulysses contract" (binding oneself to the mast) is an admission that one's future unbound self cannot be trusted to act in the interest of the whole person.
  *   **Why Mara Fails Here:** A fear of flying is a belief error (overestimating crash risk). Precommitment against temptation is a **volitional error**. If I pay a fee to lock my savings account, I am explicitly stating: "My future self's judgment at the moment of withdrawal will be worse than my current self's judgment." That is a normative hierarchy. Mara tries to flatten this hierarchy, but the act of precommitment *creates* the hierarchy.

  ### Move 4: The Multiple Selves Framing

  **Mara's Claim:** If we view time-slices as distinct agents, the present slice is not violating its own judgments. It's just inter-agent conflict.
  **Dev's Claim:** This relocates the problem but doesn't solve it. The "person" is the entity that cares about the sum of the slices, and that entity is being thwarted.

  **Verdict: It depends on your metaphysics of Personal Identity, but Dev wins on normative force.**

  *   **Mara's Strength:** She is channeling Derek Parfit's *Reasons and Persons*. If personal identity is just psychological connectedness, and that fades over time, then "I" am not strictly identical to "Future Me." Therefore, "Present Me" sacrificing "Future Me" is akin to altruism, not akrasia. Logically, this holds up.
  *   **Dev's Strength:** He is channeling the **phenomenology of agency**. We *experience* ourselves as unified. We suffer when our future selves suffer. If the "Multiple Selves" model implies that Present Self has no reason to care about Future Self, it contradicts the observed behavior (people *do* save for retirement, *do* diet for health).
  *   **The Knockout:** Mara's view cannot explain why the agent *suffers* from the conflict. If Present Self and Future Self are truly distinct agents, Present Self should feel no regret about eating the cake, just as I feel no regret about a stranger eating a cake. But the agent *does* feel regret. Dev is right that the Multiple Selves model dissolves the logic of akrasia only by dissolving the unity of the person, which is the very thing the agent is trying to preserve.

  ---

  ### What Both Are Missing

  While Dev wins on the practical and normative reality of the situation, and Mara wins on strict logical definitions, both are missing three crucial dimensions that would resolve the tension.

  #### 1. The Role of Attention (Picoeconomics)
  Both Mara and Dev treat the preference reversal as a black box that happens due to "time." They miss the mechanism described by George Ainslie in *picoeconomics*.
  *   **The Missing Piece:** Hyperbolic discounting isn't just a clock ticking; it is a shift in **salience**. The temptation captures attention, which temporarily inflates its perceived value.
  *   **Why it matters:** This bridges Mara and Dev. At the exact moment of action (Mara's focus), the agent *does* judge the temptation as better, but only because their attention has been hijacked. However, this hijacking is predictable and manageable (Dev's focus). Akrasia is not acting against judgment; it is **allowing your judgment to be hijacked by a known variable.** It is a failure of *attentional management*, not just preference satisfaction.

  #### 2. The Normative Hierarchy (Frankfurtian Desires)
  Both argue about "preferences" as if they are all equal. They miss Harry Frankfurt's distinction between **first-order desires** (I want to smoke) and **second-order volitions** (I want to *want* to quit).
  *   **The Missing Piece:** Akrasia is not a conflict between Time $A$ and Time $B$. It is a conflict between First-Order and Second-Order desires *within* the person.
  *   **Why it matters:** Mara says the agent is satisfying their current preference. Dev says the agent is violating their plan. The synthesis is: The agent is satisfying a first-order desire (smoke) while violating a second-order volition (be a non-smoker). Akrasia is the triumph of the lower-order desire over the higher-order endorsement. This validates Dev's intuition (it is a defect) without requiring Mara's synchronous contradiction (you are doing what you want, just not what you want to want).

  #### 3. The Phenomenology of Struggle
  Both treat the agent as a calculator. Mara sees a calculator updating inputs; Dev sees a calculator making errors.
  *   **The Missing Piece:** Classical akrasia involves **struggle**. Hyperbolic discounting can be automatic.
  *   **Why it matters:** There is a difference between "I struggled against the cake and lost" (classic akrasia) and "I ate the cake without thinking" (impulse/habit). Hyperbolic discounting often describes the latter. By conflating the two, they muddy the waters. Mara is right that mindless impulse isn't "weakness of will" (which implies a will that was weakened); it's a lack of will. Dev is right that the *consequence* is the same, but the *moral texture* is different.

  ### Final Adjudication

  **Dev is more right about the human condition.**
  Mara is defending a logical purity that renders the concept of "rational agency" useless for beings who exist in time. If we accept Mara's definition, we cannot criticize addiction, procrastination, or impulsivity as irrational; we can only call them "expensive tastes." This contradicts our lived experience and our legal/moral practices (which hold people responsible for managing their future impulses).

  **Mara is more right about the logical trap.**
  She correctly identifies that if you define rationality as "satisfying current preferences," the hyperbolic agent is rational. Dev wants to say the agent is irrational, but he has to import a "true self" or a "temporal whole" to make that judgment. He is implicitly arguing for **Temporal Holism** (the person is the sum of time-slices) against Mara's **Temporal Localism** (the person is the current time-slice).

  **The Synthesis:**
  Hyperbolic discounting is the **mechanism**; akrasia is the **normative evaluation** of that mechanism.
  *   Mara describes the mechanism accurately (preference reversal).
  *   Dev describes the normative failure accurately (failure of self-governance).

  They are talking past each other because Mara is doing **metaphysics** (what is the self at $t$?) and Dev is doing **ethics** (how should the self live over $t$?). Dev wins the ethical argument because ethics requires a persisting agent. Mara wins the metaphysical argument because the persisting agent is a fiction. But since we must live as if we are persisting agents, Dev's view is the one we must adopt to make sense of our lives.
