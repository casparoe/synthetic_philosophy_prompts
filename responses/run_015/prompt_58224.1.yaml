answer: |-
  This is a classic "Politics of Artifacts" workshop (heavily inspired by Langdon Winner's *Do Artifacts Have Politics?*). The goal is to move the students from thinking "tech is neutral, people are biased" to "the architecture of the tech enforces a specific social order."

  Here is a complete, low-prep lesson plan designed for 75 minutes.

  # Activity Title: "The Black Box Protocol"

  **Core Concept:** Students operate systems where the *design constraints* force political outcomes, regardless of their personal intentions.
  **Class Size:** 20–24 students.
  **Grouping:** 3 Groups of 7–8 students.
  **Materials:**
  *   3 Large sheets of paper (one per group) titled "System Log."
  *   Index cards (for Roles and Event Cards).
  *   Pens/Markers.
  *   A timer (projected or your phone).

  ---

  ## Part 1: Setup & Roles (5 Minutes)

  **The Hook (Do NOT mention politics or theory):**
  "Welcome. Today you are not students. You are operational teams for three different infrastructure systems. Your goal is simple: Keep the system running and resolve incidents as they come up. You cannot change the underlying code or hardware. You can only operate what exists."

  **Group Assignment:**
  Divide the class into three groups. Hand each group a **System Packet** (details below).

  **Internal Roles (Assign within each group):**
  *   **The Operator (2 people):** You make the final call on what the system does.
  *   **The User Advocate (2 people):** You represent the people affected. You must voice their needs.
  *   **The System Architect (1 person):** You hold the "Tech Spec" card. **Your only job is to veto any solution that violates the technical constraints.** You are the embodiment of the code.
  *   **The Scribe (1-2 people):** You write the outcome on the "System Log."

  ---

  ## Part 2: The Simulation (30 Minutes)

  Each group gets a specific scenario. They will face **3 Rounds**. In each round, read them an **Event Card**. They have 5 minutes to decide the outcome, constrained by their **Tech Spec**.

  ### Group 1: The Night Owl Shuttle
  *   **Tech Spec (Architect holds this):** "Algorithm prioritizes fuel efficiency. After 8:00 PM, any stop with fewer than 2 active ride requests is automatically skipped to maintain average speed metrics."
  *   **Round 1 Event:** It is 8:15 PM. A stop at the Engineering Library has 1 student waiting. They have been there 20 mins.
  *   **Round 2 Event:** It is 9:30 PM. A student with a mobility injury requests a ride from a dorm far from the main loop. No one else is there.
  *   **Round 3 Event:** Budget cuts mean the shuttle fleet is reduced by 20%. The algorithm tightens: Now requires 3 requests to stop.
  *   **The Trap:** The Architect *must* enforce the skip. The Advocate will scream unfairness. The Operator has to log that the student was stranded.

  ### Group 2: The Dorm Laundry Queue
  *   **Tech Spec (Architect holds this):** "No reservations allowed. Slots are claimed via live web queue. To prevent hoarding, the user must interact with the webpage (move mouse/click) every 60 seconds or the slot is released."
  *   **Round 1 Event:** It is Sunday at 4 PM. Peak time. A student with a part-time job is at work. A student with no job is in their dorm.
  *   **Round 2 Event:** Campus Wi-Fi goes down for 15 minutes during a high-demand window. 50 users are kicked out of the queue.
  *   **Round 3 Event:** A student needs clothes for a job interview tomorrow morning. It is 2 AM. They are exhausted and fall asleep while waiting in the queue.
  *   **The Trap:** The system privileges "idle time" and "constant connectivity." The Architect must release the slot when the student sleeps.

  ### Group 3: The Riverdale Floodgate
  *   **Tech Spec (Architect holds this):** "Floodgate is Auto-Controlled from Central City Office. Local hand-cranks are mechanically disabled when Auto-Mode is engaged to prevent conflicting signals."
  *   **Round 1 Event:** Heavy rain forecast. Central Office says 'Wait.' Locals see the river rising and want to close the gate now.
  *   **Round 2 Event:** Storm hits. Phone lines to Central City are down. Water is breaching the banks.
  *   **Round 3 Event:** Central City comes back online but says they are managing water flow for the *whole region*, not just Riverdale. They order the gate to stay open to protect the city downstream.
  *   **The Trap:** The locals physically cannot act (cranks disabled). They are dependent on the Central Office's priorities.

  **TA Role:** Circulate between groups. If a group tries to "hack" the system (e.g., "We'll just turn off the auto-skip"), remind them: *"You are operators, not owners. The Tech Spec is a hard constraint. If you break it, the system fails."*

  ---

  ## Part 3: Share Out (15 Minutes)

  Bring the class back together. Do not explain anything yet. Ask each group to report **only** on the outcomes they logged.

  1.  **Shuttle Group:** "How many people got stranded? Did you want to stop for them?" (They will say yes, but couldn't).
  2.  **Laundry Group:** "Who got the machines? Was it the people who needed them most, or the people with the most free time?"
  3.  **Floodgate Group:** "When the phones went down, could you save your own town? Who had the power to decide?"

  **Write on the board:**
  *   Shuttle: Efficiency > Access
  *   Laundry: Free Time > Need
  *   Floodgate: Central Authority > Local Agency

  Ask: *"Did you guys make these choices, or did the machine make them for you?"*

  ---

  ## Part 4: The Debrief (20 Minutes)

  Now you introduce the theory. This is where you connect their frustration to the course concepts.

  **1. The "Neutrality" Myth (5 mins)**
  "Most people think technology is a hammer. It's neutral; it depends on how you swing it. But today, you found that the hammer had a shape that made it impossible to hit certain nails."
  *   **Point:** The politics wasn't in how you *used* the app; it was in the *requirements* of the app. The Shuttle app isn't biased against grad students; it is *defined* by efficiency metrics that exclude them.

  **2. Two Types of Technological Politics (10 mins)**
  This is the core theoretical distinction (based on Langdon Winner).
  *   **Type A: Inherently Political (Settling the Fight).**
      *   *Examples:* The Shuttle and Laundry systems.
      *   *Explanation:* The design settles a political argument *once and for all*. By building an algorithm that skips low-ridership stops, you have decided that 'efficiency' is more important than 'equity.' You don't have to vote on it every night. The device enforces the law.
      *   *Ask:* "Once that code is written, do we need a manager to tell the bus to skip the stop? No. The politics is baked in."
  *   **Type B: Requires a Power Structure (Keeping the Lights On).**
      *   *Example:* The Floodgate.
      *   *Explanation:* The floodgate *requires* a specific social hierarchy to function. You cannot have a centrally automated floodgate without a Central Office that has authority over the locals. The technology *demands* a bureaucracy. If the bureaucracy falls, the tech becomes useless (locals can't crank it).
      *   *Ask:* "Could you have a communist floodgate? A libertarian floodgate? The auto-gate demands a specific chain of command."

  **3. Synthesis (5 mins)**
  "Next time you see a 'Terms of Service' or a 'System Update,' ask: What political fight did this settle? And what power structure does this require to keep working?"

  ---

  ## Part 5: Wrap Up (5 Minutes)

  *   Collect the "System Logs" (optional, good for attendance).
  *   **Reading for next time:** Assign Langdon Winner's *Do Artifacts Have Politics?* (or a summary excerpt). Now they will actually understand it because they lived it.

  ---

  ## TA Cheat Sheet: What Will Go Sideways

  **1. The "Just Fix It" Rebellion**
  *   **What happens:** Students will argue, "This is stupid design, I would just add a button to override it."
  *   **Why:** They are used to being empowered users.
  *   **Fix:** As the TA, play the "Budget/legacy" card. "This system was built 10 years ago by a vendor that went bankrupt. You cannot change the code. You can only operate it." This forces them to feel the constraint.

  **2. The Floodgate Confusion**
  *   **What happens:** Students might miss the nuance between the Shuttle (Type A) and Floodgate (Type B). They might think they are the same.
  *   **Why:** Both feel oppressive.
  *   **Fix:** In the debrief, press hard on the *maintenance* aspect. "The Shuttle runs itself (politics settled). The Floodgate *needs* the Central Office to exist (politics requires structure)."

  **3. Role Imbalance**
  *   **What happens:** The "Architect" dominates, or the "Advocate" gets ignored.
  *   **Fix:** Remind them during the rounds: "Architect, have you checked the Tech Spec? Advocate, have you stated the human cost?"

  ---

  ## Limitations: What This Game Can't Show

  You need to spell these out yourself in the final 5 minutes, because the simulation is too short to capture them:

  1.  **Historical Inertia:** The game starts with the tech already built. It doesn't show *who* decided to build it that way 10 years ago (e.g., did the shuttle company lobby the city?). The game shows the *effect*, not the *origin*.
  2.  **Resistance/Workarounds:** In real life, people hack systems. (e.g., Students might write a script to click the laundry button for them). The game forces compliance; reality often involves subversion.
  3.  **Intersectionality:** The game treats "Users" as a monolith. In reality, the shuttle skip might disproportionately affect international students, disabled students, or women specifically. The game simplifies the "victim" of the tech.

  **Closing Line for You:**
  "Today you felt the friction of the machine. Next week, we read about who built the machine, and why they built it to chafe."
