      *   *Pitfall:* Students might focus on the *users* behavior. I need to steer them to the *system rules*. I will add a "System Architect" role in each group whose job is to enforce the rules, even if they hate them.
      *   *Limitation:* The game can't show long-term historical context (why the floodgate was built that way 50 years ago). I need to note this in the "What this can't show" section.

  12. **Final Polish of the Plan:** (Drafting the response following the structure derived above). *Ensure the tone is helpful and practical for a TA.* *Make sure the distinction in the debrief is clear (Winner's two types of politics).*

      *   *Wait, one nuance:* The prompt asks for the difference between "a device that settles a political fight once and for all" vs "a device that needs a certain kind of power structure to keep running." This is exactly Langdon Winner's two examples (Moses bridges vs. Nuclear power).
      *   Shuttle/Laundry = Settles the fight (Efficiency is hardcoded).
      *   Floodgate = Needs power structure (Central office must exist and be obeyed).
      *   I need to make sure the debrief highlights this specific distinction.

      *   *Activity Tweak:* For the Floodgate, make sure they feel the *dependency*. For Shuttle/Laundry, make them feel the *exclusion*.

