prompt: |-
  so i'm TAing an undergrad tech and society workshop next month, like 20-24 students, we have 75 mins and basically no prep reading realy. i want to do something where they feel the claim that tech stuff can be political by itself, not just used that way by people.

  could you build me a runnable activty around three made-up cases i've been tinkering with: 1) a campus shuttle app that auto-skips low-ridership stops after 8pm, 2) a dorm laundry booking system where you have to stay awake online in a live queue to get a slot, and 3) a floodgate for a fake town that can either be hand-cranked by locals or auto-controlled from a central office.

  i want them split into roles like designers, users, maintainers or whatever and actually have to make choices with those systems and then realize the politics was already baked in. no lecture up front, don't even say technological determinism until the debrief.

  give me setup + materials that are low prep like paper and index cards, a step by step timeline for the 75 mins, and then a debrief that connects what happened to the difference between a device that settles a political fight once and for all vs a device that needs a certain kind of power structure to keep running. also pls tell me what will probably go sideways the first time i run it and what part of the idea this kind of game just can't show and i'll have to spell out myself.
reasoning: |-
  Here's a thinking process that leads to the suggested activity plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for an undergrad Tech & Society workshop.
      *   **Audience:** 20-24 students.
      *   **Time:** 75 minutes.
      *   **Constraints:** No prep reading, low prep materials (paper, index cards), no upfront lecture (especially on "technological determinism").
      *   **Goal:** Make students *feel* that technology is political *by itself* (politics baked into design), not just how it's used.
      *   **Core Content:** Three specific made-up cases:
          1.  Campus Shuttle App (auto-skips low-ridership stops after 8pm).
          2.  Dorm Laundry System (live queue, must stay awake online).
          3.  Floodgate (hand-cranked by locals vs. auto-controlled centrally).
      *   **Mechanism:** Role-playing/simulation where they make choices within the systems.
      *   **Output Needs:** Setup, Materials, Timeline, Debrief (connecting to "settling political fights" vs. "requiring power structures"), Potential Pitfalls, Limitations of the activity.

  2.  **Deconstruct the Core Concept:**
      *   The prompt asks to demonstrate "politics of artifacts" (Langdon Winner's *Do Artifacts Have Politics?*).
      *   Case 1 (Shuttle) is about efficiency vs. equity/access (who gets left behind?).
      *   Case 2 (Laundry) is about time privilege vs. first-come-first-served (who has the luxury to wait?).
      *   Case 3 (Floodgate) is about centralization/authority vs. local autonomy/resilience.
      *   The activity needs to force trade-offs. If they just discuss it, it's a seminar. If they *play* it, they feel the constraint.

  3.  **Design the Activity Structure:**
      *   *Grouping:* 20-24 students. Let's make 3 large groups (one for each case) or rotate? 75 mins is tight for rotation. Better to have 3 parallel stations, then share out. Actually, with 20-24 students, 3 groups of 7-8 is perfect.
      *   *Roles:* Need to create conflict. "Designers" want efficiency. "Users" want access. "Maintainers/Admin" want control/cost-saving.
      *   *The "Hook":* Don't explain the theory. Give them a problem and a tool, ask them to solve it.
      *   *The Twist:* The tool forces a specific outcome regardless of their intent.

  4.  **Drafting the Activity - "The Black Box Protocol":**
      *   *Concept:* Each group gets a scenario card. They think they are designing the policy, but the *technology* dictates the policy.
      *   *Refinement:* To make it "feel" political, they need to experience the consequence.
      *   *Idea:* Give them a "System Card" that has a hard constraint they cannot change. Then give them "Situation Cards" that test that constraint. They have to decide what happens.
      *   *Wait, better:* Let's make them *build* the logic, but offer them pre-made "modules" that look neutral but have political effects.
      *   *Actually, simplest for low prep:* Give them the system as a *fait accompli* (already built) and put them in a crisis situation where they have to operate it. They will realize the system makes the decision for them.
      *   *Revised Plan:*
          *   Group 1: Shuttle. They are the Algorithm (or the admins bound by it). Night falls. Stops need cutting. Who gets cut? The app decides based on "ridership," but that data is biased.
          *   Group 2: Laundry. They are students. It's 11 PM. You need clothes for an interview tomorrow. The system requires 30 mins of active clicking.
          *   Group 3: Floodgate. Storm coming. Central office is unreachable. Do you crank it or wait?
      *   *Critique:* This feels a bit too discussion-heavy. Let's gamify the constraints.
      *   *Gamification:* Resource tokens.
          *   Shuttle: "Efficiency Points" vs. "Equity Points." The App drains Efficiency Points if it stops at empty stops.
          *   Laundry: "Energy/Sleep Tokens." Booking costs tokens.
          *   Floodgate: "Time Tokens" vs. "Permission Slips."

      *   *Finalizing the Mechanism:* Let's go with **"The Constraint Challenge."**
          *   Each group gets a Scenario Packet.
          *   They have a goal (e.g., "Keep everyone happy," "Stay within budget").
          *   They have a "Tech Spec" card that imposes a hard rule they cannot break.
          *   They face 3 rounds of "Events."
          *   They must record the outcome.
          *   The "Tech Spec" forces the political outcome.

  5.  **Developing the Three Cases (incorporating the prompt's specifics):**

      *   *Case 1 (Shuttle):* Tech Spec: "Algorithm optimizes for fuel/time. Auto-skips stops with <2 requests."
          *   Event: Late night, grad student working late at library (far stop) needs ride.
          *   Outcome: System skips them. Was this a political choice? Yes, prioritizing efficiency over late-night safety/access.
      *   *Case 2 (Laundry):* Tech Spec: "No reservations. Live queue. Session times out if mouse doesn't move for 60s."
          *   Event: Single parent student vs. Freshman with no job.
          *   Outcome: Parent loses slot because they had to pick up kid. System prioritizes idle time availability.
      *   *Case 3 (Floodgate):* Tech Spec: "Central override enabled. Local cranks disabled when auto-mode is ON."
          *   Event: Comms down. Water rising.
          *   Outcome: Locals can't act. System prioritizes central authority over local survival.

  6.  **Timeline Construction (75 mins):**
      *   0-5: Intro (No theory, just instructions).
      *   5-10: Group setup & Role assignment.
      *   10-35: Activity Rounds (3 rounds of 7 mins + transition).
      *   35-50: Group Share-out (What happened?).
      *   50-70: Debrief (Connecting to theory).
      *   70-75: Wrap up.

  7.  **Debrief Strategy:**
      *   Need to connect to Langdon Winner.
      *   Distinction: "Politics *in* the artifact" (settling the fight) vs. "Politics *of* the artifact" (requiring a structure).
      *   Shuttle/Laundry = settle the fight (efficiency wins).
      *   Floodgate = requires structure (centralization).

  8.  **Anticipating Pitfalls:**
      *   Students might say "Just change the code!" -> Need to enforce "Legacy System/ Budget Constraint."
      *   Students might get bored with roleplay. -> Keep rounds short and punchy.
      *   Debrief might turn into a lecture. -> Keep it Socratic.

  9.  **Refining Materials:**
      *   Index cards for Roles.
      *   Paper for "System Logs."
      *   Pens.
      *   Scenario Sheets.

  10. **Review against Constraints:**
      *   20-24 students? Yes (3 groups of 7-8).
      *   75 mins? Yes.
      *   No prep reading? Yes.
      *   Low prep materials? Yes (paper/cards).
      *   No upfront lecture? Yes.
