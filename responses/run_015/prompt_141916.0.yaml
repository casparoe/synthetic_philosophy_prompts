answer: |-
  ### Stage 1: Mapping the Territory

  Before we adjudicate who is right, we need to disentangle the four distinct philosophical questions tangled in this dispute, because "compromise" means something different depending on which layer you are operating on. First, there is the **Ontological Question**: Are the remains *persons* (subjects of rights and duties) or *specimens* (objects of knowledge)? If they are persons, "partial use" is a category error akin to "partial slavery"; if specimens, optimization is rational. Second, there is the **Deontic Question**: Is the duty to the ancestors agent-relative (specific to the descendants) or agent-neutral (a general duty to truth/history)? This determines whether the THPO can "trade" a duty that might not be hers to bargain. Third, there is the **Baseline Question**: Is the starting point the *status quo* (museum holds remains) or the *legal entitlement* (tribe holds remains)? This dictates whether the deal is a "mutual gain" or a "concession." Fourth, there is the **Epistemic Question**: Who has authority to define harm? The scientist defines harm as information loss; the THPO defines harm as spiritual desecration. Without a shared metric for harm, "gains from trade" is mathematically impossible because you cannot sum two different currencies. Your three conditions (Concavity, Cross-valuing, Baseline) are excellent tools, but they primarily address the Baseline and Concavity questions while assuming a commensurability that the Ontological Question might forbid.

  ***

  ### Stage 2: Adjudication of the Exchange

  **Move 1 (She): Rejection of destructive component & data status.**
  *Verdict: Mostly Right.*
  She is philosophically sound on the "eight percent of a burial" point (deontic constraints do not scale linearly), but pragmatically weak on the veto; agreeing to a governance structure she admits is unenforceable undermines her leverage.

  **Move 2 (He): Pareto improvement claim.**
  *Verdict: Clearly Mistaken.*
  This is the weakest philosophical move in the exchange; it assumes the baseline is the museum's retention, ignoring the legal entitlement, and treats incommensurable values (spiritual rest vs. data) as comparable utilities.

  **Move 3 (She): Baseline and Pareto critique.**
  *Verdict: Clearly Right.*
  This is the kill shot of the debate; if the no-agreement point is her legal victory, his "compromise" is merely her accepting a loss to subsidize his research, which cannot be framed as a mutual gain.

  **Move 4 (He): The "Curve" argument (CT scan implies tolerance).**
  *Verdict: Mistaken.*
  He attempts to force a continuum where she asserts a boundary; tolerating a delay or non-invasive imaging does not logically entail accepting invasive destruction, as the moral quality of the act changes, not just the quantity.

  **Move 5 (She): Consent vs. Endure / Intactness line.**
  *Verdict: Right.*
  She successfully defends the categorical distinction; non-invasive imaging preserves the integrity of the corpse as a whole, whereas drilling violates the bodily integrity required for rest, validating the "line not a curve" claim.

  **Move 6 (He): Symmetry of Convexity (aDNA is all-or-nothing).**
  *Verdict: Factually Right, Morally Weak.*
  Scientifically, he is correct that high-resolution paleogenomics requires destruction (the value function for *his* goal is indeed convex), but morally, the fact that his project collapses does not create an obligation for her to sustain it.

  **Move 7 (She): Alternative consent & refusal of bargaining chip.**
  *Verdict: Right.*
  She offers a constructive path forward (research on unaffiliated/consented remains) while maintaining the deontic boundary that consent cannot be coerced by timing or leverage.

  ***

  ### Strongest and Weakest Points

  **Her Strongest Point:** Move 3 (The Baseline). By identifying that the "no-agreement" outcome is actually her legal victory, she exposes his "Pareto improvement" as rhetorical coercion. This dismantles the economic framing of the dispute entirely.

  **His Strongest Point:** Move 6 (The Convexity of Science). He is honest that for his specific research goals (ancient DNA), there is no "partial" success; without destruction, the specific knowledge gain is zero. This clarifies that the conflict is not about *how much* sampling, but *whether* sampling is permissible at all.

  **Her Weakest Point:** Move 1 (The Veto). By admitting the veto over future data use is unenforceable yet offering it as a concession, she weakens her position; it suggests she is negotiating in bad faith or doesn't understand the permanence of digital data, giving him grounds to doubt her practical reasoning.

  **His Weakest Point:** Move 2 (The Pareto Claim). This move reveals a blindness to the power dynamic; claiming a mutual gain when one party is legally entitled to the whole good is a category error that insults the other party's standing.

  ***

  ### What Both Are Missing

  Both parties are ignoring the **temporal history of trust**. The dispute isn't just about these eighty ancestors; it's about centuries of extraction. He is missing that "waiting until the eve of repatriation" (Move 7) is a form of coercion that invalidates consent regardless of the outcome. She is missing that by refusing *any* data retention, she forecloses the possibility of future descendants using that data for their own health or historical claims (e.g., repatriation of other groups based on genetic links). Neither is addressing the **status of the dead** as independent stakeholders; both treat the ancestors as property (either of the tribe or of science) rather than as entities to whom both might owe distinct duties.

  ***

  ### Verdict on Your Three Conditions

  **1. The Concavity Condition:**
  *Is it real?* Yes, in economics and consequentialist ethics.
  *Does it help here?* No, it obscures the conflict.
  *Does using it take his side in Move 3?* **Yes, absolutely.** To apply the concavity condition is to assume that value comes in degrees (a continuous function). She argues in Move 3 and 5 that her value is a step-function (intact vs. violated). If you analyze her position using concavity, you have already rejected her metaethic in favor of his consequentialism. You cannot use this condition to find a surplus if one side views the good as indivisible.

  **2. The Cross-Valuing Condition:**
  *Is it real?* Yes, essential for trade.
  *Does it help here?* It explains the impasse. He values knowledge; she values rest. He does not value rest enough to forgo data; she does not value data enough to permit destruction. There is no cross-valuing here, only parallel monologues. This condition confirms that no "gains from trade" are possible without one side converting their value to the other's currency (which she refuses).

  **3. The Baseline Condition:**
  *Is it real?* Yes, critical for justice.
  *Does it help here?* **This is the most important condition.** It validates Move 3. If the baseline is legal entitlement, there is no surplus to divide; there is only restitution. Using this condition reveals that "compromise" is the wrong vocabulary; the correct vocabulary is "waiver of rights."

  ***

  ### The Verdict on the Deal

  **Can a deal be signed?**
  **No, not on the current terms.**
  Your **Concavity Condition** fails for her side. Her value function is not concave (diminishing returns); it is binary (intact vs. desecrated). Because her good is convex/step-wise (all or nothing), splitting the difference destroys 100% of the value for her while preserving only a fraction for him. Furthermore, your **Cross-Valuing Condition** fails; he does not value her spiritual baseline enough to accept zero data, and she does not value his scientific baseline enough to permit destruction.

  **The Only Viable Path:**
  A deal is only possible if the **Baseline Condition** is reset and the **Concavity** of his project is altered.
  1.  **Reset Baseline:** Acknowledge the remains are hers unconditionally (validating Move 3).
  2.  **Alter Concavity:** He must find value in the non-destructive data (CT/Photogrammetry) even without aDNA. If he admits the morphometric data has standalone value (concave returns on non-destructive tech), a deal exists: She grants the 18-month delay and the non-destructive scanning; he drops the destructive sampling and the data retention veto (data is deleted or fully handed over).
  3.  **Future Protocol:** They agree to collaborate on *unaffiliated* remains where consent is possible, satisfying his need for aDNA and her need for consent (Move 7).

  If he insists aDNA is the only valuable outcome (Move 6), and she insists destruction is forbidden (Move 1), the negotiation is not a search for surplus; it is a power struggle. In that case, the law (NAGPRA) decides, and she wins. Compromise is impossible where one side's "gain" is the other side's "sin."
