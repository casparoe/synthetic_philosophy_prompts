answer: |-
  **Setting:** *The back room of The Eagle, Cambridge. Late afternoon. Two empty pint glasses sit between them. Julian (Formal Theory) leans forward; Eleanor (Political Economy) leans back, nursing a half-finished cider.*

  **Julian:** You're dismissing the programme equilibrium construction too readily, Eleanor. It isn't merely a theoretical curiosity. If two agents can submit algorithms to a trusted executor, and those algorithms have read-access to one another's source code, the one-shot Prisoner's Dilemma dissolves. You write a programme that says, 'Cooperate if and only if the opponent's code is identical to mine.' Mutual cooperation becomes a Nash equilibrium. The shadow of the future is replaced by the transparency of the present.

  **Eleanor:** It's a neat bit of logic, Julian, I'll grant you. But it feels like magic trickery. You haven't removed the dilemma; you've merely relocated it to the meta-game of selecting the programme. In the real world—specifically the trade context I'm modelling—states or firms don't meet in a vacuum with a neutral executor. They meet with asymmetric power. Suppose Row stands to gain ten times as much from defecting as Column does. Why on earth would Row submit the 'identical code' programme?

  **Julian:** Because if Column submits that programme, and Row submits anything that defects against it, Column's programme defects in return. You end up at mutual defection. Row prefers the cooperative equilibrium to the defect equilibrium, even if the split is uneven. The folk theorem for programme equilibria says any individually rational payoff is attainable. They simply coordinate on a different pair of programmes.

  **Eleanor:** 'Coordinate' is doing a great deal of heavy lifting there. If Row's gain from defection is massive, their threat point is effectively higher. They can say, 'I will submit a programme that cooperates only if you grant me eighty per cent of the surplus.' If Column refuses, Row defects. In your formalism, this is just selecting a different equilibrium. In political economy, that's coercion. You've turned the Prisoner's Dilemma into a Bargaining Problem, but you haven't explained how the bargain is struck without a prior enforcement mechanism.

  **Julian:** But that's progress, isn't it? The original dilemma suggested cooperation was impossible without iteration. Now we see it's possible, contingent on agreement. The impossibility is gone.

  **Eleanor:** Is it? Let's tighten the screw. You assume full transparency. Each side reads the other's source code. But in my chapter's case study, the high-stakes player's algorithm is proprietary. It's a black box. Column can submit inputs and see outputs, but cannot inspect the logic. Row claims, 'My code cooperates if yours does,' but Column cannot verify that. Row could easily be running a 'Defect' script wrapped in a 'Cooperate' promise.

  **Julian:** That does complicate matters. The 'Cooperate if Identical' strategy collapses if you can't verify identity. However, one could employ zero-knowledge proofs. Row could prove their code satisfies certain logical constraints without revealing the proprietary weights.

  **Eleanor:** Who verifies the proof?

  **Julian:** The executor.

  **Eleanor:** There it is. The 'trusted executor'. You've smuggled the state back in through the back door. If there is a trusted third party capable of enforcing code execution and verifying proofs, we didn't need programme equilibrium to solve the one-shot problem. We could have just asked the third party to enforce the contract. You've solved the cooperation problem by assuming a Leviathan capable of reading minds—or at least reading code.

  **Julian:** I concede the trusted executor is a non-trivial assumption. But in digital environments, smart contracts on a decentralised ledger can act as executors without a central state. The code *is* the law.

  **Eleanor:** Even on a ledger, someone writes the compiler. Someone audits the zero-knowledge proof. If Row has asymmetric stakes, they have the resources to influence that infrastructure. But let's grant you the executor for a moment. Even with transparency, if the stakes are asymmetric, the 'identical code' focal point vanishes. Why should the low-stakes player accept a programme that locks them into a deal favouring the high-stakes player, simply because the high-stakes player refuses to run anything else?

  **Julian:** Because the alternative is the programme equilibrium of mutual defection. Both sides are rational maximisers. They will bargain to the Nash Bargaining Solution relative to the threat point of (Defect, Defect). The programme equilibrium framework allows them to commit to that bargain *before* the move is made. It prevents reneging.

  **Eleanor:** But the commitment device itself is the object of contention. If I cannot read your code, I cannot trust your commitment. If I trust you, I don't need the code. You're arguing that commitment technology underwrites cooperation. I'm arguing that commitment technology *requires* cooperation to be established first. It's circular.

  **Julian:** Not circular, but recursive. Look, suppose we introduce an escrow arrangement. Both parties deposit their potential gains into a smart contract. The contract releases funds based on the outcome of the interaction. If Row defects, the contract penalises them.

  **Eleanor:** Who writes the penalty clause? If Row has the leverage, they write a contract with a negligible penalty for themselves and a severe one for Column. And if the code is proprietary, Column doesn't know the penalty structure until it's too late.

  **Julian:** *Pauses, taking a sip of beer.* Alright. I will concede that without transparency, the programme equilibrium cannot guarantee the cooperative outcome. The 'logical correlation' breaks down if one side is opaque. In that specific proprietary case, you are right: we revert to a standard trust game with a high risk of collapse.

  **Eleanor:** Thank you. And I will concede this: if transparency *were* cheap and universal, your mechanism does change the topology of the problem. It transforms a simultaneous move game into a sequential negotiation over rules. It doesn't make cooperation automatic, but it makes it *computable*. That is a substantive shift from the standard IR literature which treats one-shot cooperation as purely normative or impossible.

  **Julian:** Precisely. It's not that the dilemma is dissolved magically. It's that the space of feasible strategies expands. We can write programmes that play 'Tit-for-Tat' in a single shot by simulating the opponent's response.

  **Eleanor:** But only if we agree on the simulator. Here's where I think we can narrow the disagreement. You view the 'Trusted Executor' as a technical prerequisite. I view it as a political variable. The question isn't whether programme equilibrium *can* work, but who controls the executor. In your asymmetric stakes scenario, the high-stakes player effectively *becomes* the executor by virtue of their ability to walk away.

  **Julian:** So you're suggesting the equilibrium selection is a function of power, not just logic.

  **Eleanor:** Inevitably. If Row gains ten times as much from defection, they can afford to burn the bridge. Column cannot. Therefore, the 'equilibrium' selected will be the one Row prefers. Your formalism shows *that* an equilibrium exists; my analysis suggests *which* one will obtain.

  **Julian:** Then perhaps the verdict is this: Programme equilibrium dissolves the *logical* impossibility of one-shot cooperation, but it does not solve the *distributional* conflict inherent in the encounter. It removes the barrier to agreement, but it leaves the terms of agreement to the underlying asymmetry of stakes.

  **Eleanor:** That's fair. It transforms the Prisoner's Dilemma into a Battle of the Sexes with a threat point. The cooperation is possible, but the price of cooperation is determined by who holds the proprietary code and who needs the deal more.

  **Julian:** And regarding the proprietary problem?

  **Eleanor:** Unless there is a neutral verification standard imposed from outside—say, a regulatory body mandating open-source trade algorithms—the opacity kills the mechanism. The 'commitment technology' is only as good as the transparency mandate backing it.

  **Julian:** So, the dilemma is restated one level up. We no longer ask, 'Will they cooperate?' We ask, 'Will they agree to a transparent protocol that allows cooperation?'

  **Eleanor:** And since the high-stakes player often benefits from opacity—information asymmetry being a source of rent—they have no incentive to agree to that protocol. Thus, the one-shot dilemma persists, not because cooperation is logically impossible, but because the conditions for logical correlation are politically unattainable.

  **Julian:** *Nods slowly.* I can live with that. It saves the maths while acknowledging the politics. The mechanism works in the lab, but in the field, the black box wins.

  **Eleanor:** Cheers to that. Though I suspect your next chapter will try to find a zero-knowledge proof that solves the power asymmetry.

  **Julian:** *Smiles.* Don't tempt me. But for now, I'll settle for 'restated rather than dissolved'. It's a more honest conclusion for a thesis.

  **Eleanor:** It is. And it keeps the political economy relevant. If the technology solved everything, you'd be writing for a computer science journal, not a politics department.

  **Julian:** Touché. Another pint?

  **Eleanor:** Go on then. But you're paying. Consider it a defection penalty.

  **Julian:** *Laughs.* Accepted.
