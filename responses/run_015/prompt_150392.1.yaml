  1. The branching logic (around 250 words)
  2. The leaf positions (around 350 words)
  3. The gaps and inseperable pairs (around 150 words)
  4. How to use this without knowing the names (around 100 words)

  the branch questions should be concrete enough that someone can answer them without already knowing which camp they belong to.
