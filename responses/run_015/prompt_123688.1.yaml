  *(Self-Correction on Distillation)*: The user guessed distillation is "writing know-how into a policy doc." In IDA, distillation is training a model to *predict* the HCH tree's output. I should correct/refine that gently. It's more like "hiring a new CEO who has internalized the entire org's workflow so they don't need to call meetings."

  *(Self-Correction on Liability)*: The user asks if they are reinventing the oversight problem. Yes, essentially. It's the "inner alignment" problem. The nodes might optimize for looking good to the parent rather than being truthful.

