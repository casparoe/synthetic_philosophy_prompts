      *   *Liability:* In HCH, the "liability" is the root's endorsement. If the root endorses a wrong answer, the system failed. In a firm, if a worker screws up, the manager catches it (hopefully) or the customer complains. In HCH, the root *is* the customer and the manager. There's no separation.

