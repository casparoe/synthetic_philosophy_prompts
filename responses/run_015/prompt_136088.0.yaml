  hey i'm in my philosophy of ethics seminar and we've been stuck on Williams's integrity objection for like three weeks now. specifically the husband-saving-his-wife case that people call the one thought too many thing. everytime we discuss it, half the room says utilitarianism forces you to run a mental calculation before you act, which corrupts love or ground projects or whatever, and the other half says no, utilitarianism only demands that your action be justifiable that way, not that you actually think it in the moment. then we just loop. i think part of the stall is that we might be using integrity in two seperate ways — like as a psychological state vs as a normative constraint — but i'm not sure that's the whole story. there's also maybe a hidden fight about whether agent-relative reasons are real or just reducible to agent-neutral ones, but nobody wants to say that out loud.

  can you diagnose why this debate hasn't moved? is it verbal about the word integrity, substantive, or are the sides actually answering different questions — one about moral psychology and one about normative justification? please use what each side actually says: the critics talking about alienation and ground projects, the defenders talking about the distinction between deliberation and justification. and tell me what, if anything, would count as progress — a new distinction, a change of question, or just acceptance that no progress should be expected?

  i also have a weird idea that might be relevant: maybe the stall comes from conflating two levels, the deliberitive level (what runs through your head when you act) and the archival level (how you'd explain yourself later in a moral autobiography). could that be part of what's going on? include it in your diagnosis if it matters.

  please say how confident you are in what you claim and single out the point you're least sure of. and put your bottom line in \answer{...} at the very end with a short label for the diagnosis.
