prompt: |-
  So I've been reading the rationalist blogs since basically forever and I still can't referee an argument two friends of mine got into after a board game night, so I'm outsourcing it.

  Setup: my friend Dev is quitting his job to build a niche B2B SaaS thing solo. He figures 8 months to first paying customers and says it's 60% it works out. My other friend Mira is a hard outside-view person and the two of them went at it for like forty minutes. Roughly:

  (1) Mira: don't use your own model, use the reference class "solo first-time founder software projects" — median time to anything shippable is way more then 8 months and most of them never get a paying customer at all. Your 60% is a planning-fallacy number with a confidence interval welded onto it.

  (2) Dev: that class is doing no work, it lumps me in with people who are teaching themselves to code. I've got twelve years in the industry, I've shipped in this exact domain before, and I have a 9k-person mailing list from a newsletter I've run for years. The relevant class is "senior engineers with distribution and domain experience building in a market they've already worked in," and that class looks a lot better. Also, I said 60%, not 100 — I already took a haircut.

  (3) Mira: that's reference class gerrymandering. You picked the narrowing features after looking at your own case, and every founder can do exactly this, so the class always collapses into "people circumstanced like me," which is the inside view with extra steps. If narrowing is free, the outside view has zero bite.

  (4) Dev: it isn't free, but if it's banned then the outside view is just conservatism with a spreadsheet attached. Every successful thing was, ex ante, a member of a class with a bad base rate. And worse: the outside view isn't closed under universal adoption. If everyone actually deferred to the broad class, the population of attempted projects would change — the ones that still get attempted would be a different set, selected for ignoring exactly the number you measured — so the base rate you're quoting wouldn't describe the world you'd be acting in. The number eats itself.

  (5) Mira: fine, but you're conflating two things people mean by "outside view." One is correcting for a corrupted estimator — your optimism, your availability, the fact that you've already sunk two months into building. The other is a claim about which evidence to use. Those have different remedies, and the first one says debias your own model, not replace it with a class average. But on the second: the burden is on the narrow class to show the narrowing feature actually tracks outcomes, and "I feel like my experience is relevant" isn't that. Show me that newsletters predict shipping.

  (6) Dev: I can't, and that's structural, not laziness. The classes anybody has numbers for are the ones some institution already bothered to count — broad, old, legible ones. Call it the census effect. So the outside view doesn't drag you toward the truth, it drags you toward whatever was cheap to tabulate, and it gets to look modest and rigorous the whole time it's doing it.

  (7) Mira: okay, but then what, we go back to vibes? And honestly this whole argument is beside the point, because the outside view is about your probability, not your decision. Fat-tailed payoff — you don't need 60% for quitting to be right. What the outside view changes is the shape of the attempt: keep the job two days a week, precommit to a kill criterion at month twelve, sell before you build. Dev: but if it doesn't change whether I go, and my inside number was already above what I needed, then what exactly did it do?

  I want a verdict on each of (1) through (7), somewhere on a scale from clearly mistaken to clearly right, with a sentence or two on why, then who is more right overall and what both of them are missing. Please actually pick — I've watched this same fight play out on the forums a dozen times and it always dissolves into "both sides have a point, reference classes are hard," which is useless to me. If one of them is equivocating somewhere, say exactly where. And don't tell me to go read somebody, I've read the blog posts; I want the object-level argument.

  Bonus if you want it: is there any principled way to choose a reference class, or is the honest answer that you have to use your inside view to pick the class and then your outside view to set the number — in which case Mira's whole thing is just the inside view wearing a lab coat?
reasoning: |-
  Here's a thinking process that leads to the suggested verdict:

  1.  **Analyze the Request:**
      *   **Context:** A dispute between two friends (Dev and Mira) about using the "Outside View" (reference class forecasting) vs. the "Inside View" (specific case details) regarding a startup venture.
      *   **Task:** Provide a verdict on each of the 7 points (1-7) on a scale from "clearly mistaken" to "clearly right" with brief justification. Determine who is more right overall. Identify what both are missing. Identify any equivocation.
      *   **Constraint:** Do not hedge ("both sides have a point"). Pick a side if necessary. Do not suggest reading more blog posts. Address the object-level argument.
      *   **Bonus:** Address the principled way to choose a reference class (is it just inside view in disguise?).
      *   **Tone:** Rationalist-adjacent, analytical, decisive, precise.

  2.  **Deconstruct the Arguments (Point by Point):**

      *   **(1) Mira:** Use broad reference class ("solo first-time founder"). 60% is planning fallacy.
          *   *Analysis:* Standard Kahneman/Lovallo outside view. Broad classes are safer against overconfidence but often too blunt.
          *   *Verdict:* Mostly Right on the *principle* of debiasing, but potentially Wrong on the *specific class* choice (too broad).
      *   **(2) Dev:** That class is useless. I have specific advantages (experience, audience). Narrow class is better. 60% already accounts for risk.
          *   *Analysis:* Valid critique of overly broad classes. Specificity matters. Claiming 60% already accounts for risk is self-reported and suspect.
          *   *Verdict:* Right on the class selection critique, Suspicious on the self-assessed probability.
      *   **(3) Mira:** Narrowing is gerrymandering. "People circumstanced like me" = Inside View.
          *   *Analysis:* This is the core epistemic tension. If you narrow enough to be unique, the base rate is 0 or 1. There *must* be a constraint on narrowing.
          *   *Verdict:* Right. This is the fundamental problem with reference class forecasting. Without objective criteria for narrowing, it's motivated reasoning.
      *   **(4) Dev:** Outside view is just conservatism. Successful things break base rates. Base rates change if everyone follows them (Lucas Critique-ish).
          *   *Analysis:* "Successful things break base rates" is true but tautological (that's why they are successes). The Lucas Critique point is clever but mostly irrelevant to a single agent's decision *now*. The "conservatism" charge has merit.
          *   *Verdict:* Partially Right on the conservatism critique, Wrong/Confused on the base rate stability argument (one person quitting doesn't shift the macro base rate).
      *   **(5) Mira:** Distinguishes debiasing vs. evidence selection. Burden of proof is on the narrowing feature (show newsletters predict shipping).
          *   *Analysis:* This is the strongest epistemic point. Features used to narrow the class must be *predictive*, not just descriptive. "I feel relevant" isn't data.
          *   *Verdict:* Clearly Right. This cuts the knot.
      *   **(6) Dev:** "Census Effect." We only have data on legible/broad classes. Outside view biases toward measurable, not true.
          *   *Analysis:* This is a very strong meta-critique of data availability bias. It's true that we measure what's easy.
          *   *Verdict:* Right. This is a genuine limitation of the Outside View methodology.
      *   **(7) Mira:** Outside view informs *structure* (risk mitigation), not just *go/no-go*. Fat tails mean EV > 0 even if P(success) is low. Dev: If it doesn't change the decision, what did it do?
          *   *Analysis:* Mira wins here on decision theory. The probability estimate informs the *terms* of the bet, not just the binary choice. Dev's "what did it do" shows a misunderstanding of expected value optimization.
          *   *Verdict:* Mira is Right. Dev is missing the point of EV.

  3.  **Synthesize the "Who is More Right" Verdict:**
      *   Mira is arguing for epistemic hygiene and decision theory rigor.
      *   Dev is arguing for agency and specific context.
      *   Dev's strongest point is (6) (data availability bias).
      *   Mira's strongest point is (5) (predictive validity of narrowing features) and (7) (decision structure).
      *   Dev's weakest point is (4) (Lucas critique application) and the self-assessed 60%.
      *   Mira's weakest point is (1) (initial class was too broad).
      *   *Overall:* Mira is more right on the *process* of estimation and decision-making. Dev is more right on the *limitations of available data*. However, since the goal is accurate forecasting and good decisions, Mira's framework is more robust, provided she accepts Dev's critique on data availability.
      *   *Equivocation:* Dev equivocations on "Outside View" (treating it as a prohibition vs. a prior). Mira equivocations slightly on "Reference Class" (broad vs. predictive). But Mira's point (5) resolves her own equivocation.

  4.  **Drafting the Verdicts (Iterative refinement for tone and precision):**

      *   *1:* Right on spirit, wrong on execution. Broad classes are the default anchor, not the final answer.
      *   *2:* Right on the flaw of (1), but the 60% is uncalibrated self-reporting.
      *   *3:* Right. This is the "Reference Class Tennis" problem.
      *   *4:* Wrong on the macroeconomic argument, Right on the "outside view as conservatism" critique.
      *   *5:* Clearly Right. Predictive validity is the only escape from gerrymandering.
      *   *6:* Right. Availability bias in data is a real constraint.
      *   *7:* Mira is Right. Dev fails to understand that probability informs *terms*, not just binary *action*.

  5.  **Addressing the "Missing" and "Bonus":**
      *   *Missing:* They are treating probability as a static property rather than a tool for resource allocation. They aren't discussing *updating*. The Outside View should be the Prior, the Inside View the Likelihood.
      *   *Bonus:* Is it inside view in a lab coat? Yes, but a constrained one. You use inside view to *select* the class based on predictive features, then outside view to *anchor* the probability. It's a Bayesian update, not a replacement.

  6.  **Refining the Tone:**
      *   Avoid "It depends."
      *   Use rationalist terminology correctly (base rates, inside/outside view, EV, Bayesian).
      *   Be decisive.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I answer the bonus? Yes.
      *   *Check:* Did I avoid telling them to read more? Yes.
      *   *Check:* Is the distinction on point (5) clear? Yes, that's the crux.
      *   *Check:* Is the verdict on (4) fair? Dev's Lucas Critique point is sophisticated but misapplied to a single agent. I should note that.
      *   *Check:* Ensure I don't just say "Mira wins." Dev has valid points about data availability. I need to acknowledge (6) is a strong hit on Mira's methodology.

      *(Self-Correction)*: Wait, looking closer at (4). Dev says "If everyone deferred... the population would change." This is actually a valid critique of *normative* adoption of base rates, but irrelevant to *descriptive* accuracy for him right now. I will mark it as "Intellectually clever but practically irrelevant."

      *(Self-Correction)*: On (7), Dev asks "what exactly did it do?" This is a failure to understand risk management. Mira is clearly right here.

      *(Final Decision)*: Mira is more right overall because she identifies the mechanism for validity (predictive features) and the purpose of the estimate (decision structure), whereas Dev relies on "trust my specific knowledge" which is exactly what the Outside View is meant to temper.

  8.  **Final Output Generation** (matching the requested structure).
answer: |-
  Here is the verdict on the seven points, the overall winner, and the bonus question.

  ### The Verdicts

  **(1) Mira: Mostly Right.**
  The Outside View is correctly identified as a debiasing tool against the planning fallacy. However, starting with the *broadest* possible class is a heuristic, not a law; if the class is too heterogeneous, the base rate becomes noise.

  **(2) Dev: Right on the critique, Suspicious on the number.**
  He is correct that lumping him with novices destroys information. However, his claim that "60% already takes a haircut" is uncalibrated self-reporting; without an external anchor, "adjusted inside view" is just optimism with a different label.

  **(3) Mira: Clearly Right.**
  This is the "Reference Class Tennis" problem. If narrowing the class is costless and subjective, any outcome can be justified. There must be a constraint on narrowing, or the Outside View collapses into motivated reasoning.

  **(4) Dev: Mostly Wrong.**
  The "Lucas Critique" argument (that acting on the base rate changes the base rate) is intellectually clever but irrelevant for a single agent in a large market. His point that the Outside View encourages conservatism is valid, but conservatism is often the correct correction for founder optimism.

  **(5) Mira: Clearly Right.**
  This is the winning argument. Narrowing features must be *causally or statistically predictive*, not just descriptively unique. "I have a newsletter" is only a valid narrows if newsletters *actually correlate* with success in the data, not just because Dev feels it helps.

  **(6) Dev: Right.**
  This is the "Streetlight Effect." Relying solely on tabulated data biases you toward legible variables and against novel situations. The Outside View cannot correct for data that doesn't exist.

  **(7) Mira: Clearly Right.**
  Dev fails to understand Expected Value. Even if the decision (Go/No-Go) remains "Go," a lower probability estimate should drastically change the *terms* (runway, risk mitigation, kill criteria). If the probability doesn't change the plan, the estimation process was performative.

  ### Overall Winner: Mira

  Mira is more right overall. Dev wins on the meta-critique of data availability (Point 6), but Mira wins on the epistemology of how to form a belief and the decision theory of how to use it. Dev's position ultimately relies on "trust my specific intuition," which is exactly the cognitive hazard the Outside View is designed to neutralize. Mira correctly identifies that without predictive validation for narrowing features, Dev's "better class" is just a story he's telling himself.

  **Where Dev Equivocates:**
  Dev equivocations on the definition of "Outside View." In (2) and (4), he treats it as a prohibition on using specific information. In (6), he treats it as a reliance on institutional data. The Outside View is neither; it is a *prior* to be updated by specific evidence. He treats the base rate as a verdict rather than an anchor.

  **Where Mira Equivocates:**
  In (1), she implies the broad class is the *answer*. In (5), she clarifies it is the *anchor*. She tightens her position mid-argument, which is why she wins the exchange, but her opening salvo was vulnerable to Dev's (2).

  ### What Both Are Missing

  They are treating this as **Inside View vs. Outside View**, when it should be **Prior vs. Likelihood**.

  The Outside View (base rate) should be the *Prior*. The Inside View (Dev's specific skills, newsletter, domain knowledge) should be the *Likelihood* used to update that prior.
  *   **Mira's error:** She occasionally treats the Prior as the Posterior (ignoring the update).
  *   **Dev's error:** He tries to set the Posterior directly without acknowledging the Prior (ignoring the anchor).

  The correct process isn't "Pick a class and submit" or "Ignore the class and trust me." It is: Start with the broad base rate (e.g., 10% success). Ask: "How much does a 9k mailing list *objectively* shift this probability?" If there is no data on mailing lists, you cannot update much. You end up with a wide error bar, not a precise 60%.

  ### Bonus: Is choosing a reference class just Inside View in a lab coat?

  **Yes, but a constrained one.**

  You must use your Inside View to select the Reference Class. There is no algorithm for it. However, the constraint is **predictive validity**.

  *   **Inside View in a lab coat:** "I am choosing the class 'Founders named Dev' because I am named Dev." (Descriptive, non-predictive).
  *   **Principled Selection:** "I am choosing the class 'Founders with existing distribution' because historical data shows distribution correlates with survival." (Predictive).

  The honest answer is that you use the Inside View to hypothesize which features matter, but you are only allowed to narrow the class if those features have **trackable predictive power**. If the feature is novel (no data), you cannot narrow the class based on it; you must absorb that uncertainty into the variance. Mira is right that "I feel it's relevant" is insufficient; Dev is right that "No data exists" is a structural blocker. The resolution is to admit the uncertainty rather than claiming a precise 60%.
