      *   **Opening Salvo:** Marcus states the dialetheist position simply: The Liar is true and false. Elena counters with the "gap" solution (neither true nor false).
      *   **The Revenge Problem (Crucial Step):** A simple gap solution invites the "Strengthened Liar" ("This sentence is not true"). Marcus should bring this up. It's the strongest argument for dialetheism.
