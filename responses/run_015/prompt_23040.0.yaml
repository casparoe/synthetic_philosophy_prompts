      *   *Check:* The "Revenge Liar" is essential. If Elena says "It's neither true nor false," Marcus says "What about 'This sentence is not true'?" If it's neither, it's not true, so the sentence is true... contradiction again. Elena needs a response to this (e.g., a hierarchy of predicates or a non-classical gap), but Marcus should press that this leads to ineffability.

  5.  **Final Polish:**
