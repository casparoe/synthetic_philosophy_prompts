answer: |-
  Dear Colleague, it is a pleasure to assist you in designing this pedagogical intervention, as luck egalitarianism is notoriously difficult for students to grasp without first feeling the intuitive pull of the distinction between circumstances and choices. The following activity is designed to occupy the first fifty minutes of your session, leaving the remaining thirty minutes for a robust theoretical debrief. You will need to prepare eighteen envelopes or distinct piles of tokens, such as poker chips or slips of paper, along with a set of dice. The game is structured in three distinct phases that mirror the temporal and moral architecture of luck egalitarian theory, though you should not reveal this theoretical mapping until the debrief. In the first phase, which simulates the lottery of birth, you will distribute initial endowments based entirely on arbitrary factors beyond the students' control. Have each student roll a single six-sided die. If they roll a one or two, they receive five tokens. If they roll a three or four, they receive ten tokens. If they roll a five or six, they receive fifteen tokens. Emphasize that this distribution is purely random and requires no effort or skill. This phase is crucial because it isolates the variable of brute luck. Once the tokens are distributed, ask them to count their holdings but not to spend or trade them yet. This creates an immediate inequality that everyone knows is undeserved, setting the stage for the first intuitive judgment about redistribution.

  The second phase introduces the element of agency and risk, simulating option luck. Tell the students that they now have a choice regarding their existing tokens. They may choose a Safe Option or a Risky Option. If they choose the Safe Option, they keep their current tokens exactly as they are. If they choose the Risky Option, they must roll the die again. If they roll an even number, their token count doubles. If they roll an odd number, they lose half of their tokens, rounded down. Give them a moment to decide privately and then have them execute their choice. It is vital that you record the outcomes publicly on the board so that the class can see who took risks and who played it safe, and what the resulting distribution looks like. This creates a complex landscape of inequality where some students have high tokens due to initial luck, some due to successful gambles, some due to failed gambles, and some due to cautious choices. The third phase is the political decision. Tell the class that the tokens will be redeemed for a prize, such as entry into a raffle for a gift card or extra credit, but before the redemption occurs, the class must vote on a tax rate. They will vote on a percentage of total tokens to be pooled and redistributed equally among all students. Allow five minutes for informal campaigning and discussion, then hold a secret ballot on several tax rate options, such as zero percent, fifty percent, or one hundred percent. This forces them to institutionalize their intuitions about justice before knowing definitively who will benefit, though they will have a strong sense of their own standing.

  Once the voting is complete and the winners are determined, you should transition immediately into the debrief, using the remaining thirty minutes to map their experiences onto the theoretical concepts. Begin by asking the students who voted for high redistribution to explain their reasoning, followed by those who voted for low redistribution. You will likely find that students argue for redistributing the gains from the first phase but are hesitant to redistribute the gains from the second phase where risks were taken. This is your entry point to define brute luck. Explain that the initial die roll represents circumstances beyond their control, such as family wealth or natural talent, which luck egalitarians argue should be compensated. Then point to the second phase as option luck, defined by Ronald Dworkin as the result of deliberate gambles that one could have avoided. Ask the students who lost tokens in the second phase if they feel entitled to compensation from those who gambled and won. If they say yes, ask the winners if that feels fair. This tension illuminates the core luck egalitarian claim that inequalities resulting from choice are just, while those resulting from circumstance are not. You can then introduce the envy test, asking if any student would willingly swap their entire set of circumstances and choices with another student. In a strict egalitarian framework, the goal is to eliminate envy by equalizing outcomes, whereas luck egalitarianism seeks to eliminate envy only regarding brute luck, allowing envy regarding option luck to persist.

  As you guide this discussion, you must also distinguish between ex ante and ex post compensation. Ask the class if they would have preferred to insure themselves against the bad luck of the first phase before the dice were rolled, versus being compensated after the fact. Luck egalitarianism often favors ex ante insurance markets where possible, but the game forces an ex post political decision. This helps students understand why some critics argue that luck egalitarianism is too focused on hindsight compensation rather than structural prevention. Furthermore, you can contrast luck egalitarianism with strict egalitarianism by pointing to the vote for one hundred percent redistribution. If the class voted for total equality regardless of the gamble, they exhibited strict egalitarian intuitions. If they voted for partial redistribution that left some inequality intact based on the second phase, they leaned toward luck egalitarianism. This concrete differentiation helps solidify the abstract definitions they will encounter in the reading.

  However, you should be prepared for several predictable difficulties that often arise when running this simulation. One common issue is that students may resist the intuition the game is designed to elicit by arguing that all luck is brute luck. For instance, a student might argue that the willingness to take a risk in the second phase is itself a personality trait determined by upbringing or biology, thereby collapsing the distinction between option luck and brute luck. This is actually a sophisticated objection raised by philosophers like Elizabeth Anderson, and you should welcome it. If this arises, acknowledge the validity of the critique but ask the class to pretend for the sake of the exercise that the choice was truly voluntary, so they can see what the theory looks like in its ideal form before dismantling it. Another difficulty is that students who lose big in the gamble may demand redistribution out of compassion rather than justice, conflating humanitarian aid with entitlement. You will need to steer the conversation back to desert and fairness by asking if the losers have a claim of justice against the winners, or merely a plea for charity. This distinction is central to the luck egalitarian project, which frames redistribution as a matter of right rather than benevolence.

  There are also limitations to this activity that you must acknowledge and supplement with lecture or reading. The game cannot reproduce the systemic and cumulative nature of real-world brute luck. In the classroom, the disadvantage is reset every round and is purely random, whereas in reality, brute luck often compounds over generations and intersects with social structures like racism or sexism. The game also simplifies the epistemic problem of distinguishing luck from choice. In the simulation, you know exactly who rolled the dice, but in the real world, it is often impossible to tell if a person's poverty is due to laziness or bad luck. Luck egalitarianism faces severe administrative challenges here that the game glosses over. Additionally, the game does not capture the social expressivist critique, which argues that focusing on individual luck and choice stigmatizes the disadvantaged by requiring them to prove their innocence to receive aid. You will need to introduce these critiques explicitly, as the game mechanics naturally favor the luck egalitarian perspective by making the source of inequality transparent.

  Finally, be mindful of the classroom dynamics regarding the payoffs. If the tokens are redeemable for something valuable, students who lose may feel genuine distress, and those who win may feel defensive. Keep the stakes low enough that the emotions are simulated but not overwhelming. If the discussion becomes too heated or personal, remind them that they are analyzing the structure of the game, not judging each other's character. By the end of the session, the students should have a visceral understanding of why the distinction between option luck and brute luck matters, even if they remain skeptical of its practical application. They will have lived through the tension between compensating for misfortune and respecting individual agency, which is the precise philosophical friction that luck egalitarianism seeks to resolve. This experiential foundation will make the subsequent reading of Dworkin, Cohen, or Arneson much more accessible, as they will recognize the theoretical terms as descriptions of choices they just made themselves.
