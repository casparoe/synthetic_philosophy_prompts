answer: |-
  Dear colleagues, I am writing to propose that we remove Octavia Hallam's name from both the debut prize and the reissue series, retaining the funds but dissociating the programmes from her personal legacy, and I want to set out why this is the only decision that aligns with our responsibilities as stewards of a living trust rather than custodians of a dead woman's reputation. I know the chair prefers the formulation that the past is a foreign country, and I know others feel a contextual note would suffice, but I believe we must accept that a literary prize is not a museum plaque; it is a continuing speech act in the present tense, and every time we announce the Hallam Prize we are effectively endorsing Hallam as a patron saint of the work we are rewarding. A historical note stapled to the front of a book or buried on a website is varnish, precisely because most readers will not see it, but all will see the name, and by keeping it we are choosing to prioritize her right to be remembered over our duty to define what we stand for now. This is not about judging Hallam's soul, a point that struck me during a recent conversation with an intellectual historian who argued that our fixation on what she could have known is a detour; the real question is what our money is for, today, and if our mission is to support historical fiction that engages honestly with the past, we cannot honor a namesake whose public legacy insists that certain people were unassimilable based on arguments she maintained even when contrary evidence was available to her.

  We need to be clear that this decision is not an anomaly but the establishment of a precedent, because we have two more named bequests arriving next year and at least one of those namesakes is likely to be worse than Hallam on the metrics that matter to us. We discussed the reachable-dissent rule, which would culpabilize a figure only if contemporaries argued against them, but we must reject that standard because it quietly measures whether the deceased agreed with the ancestors we happen to admire now, and it creates a geographic and temporal lottery where a view held in London in 1955 is judged differently than the same view held in New York in 1955. Instead, I propose we adopt a rule of mission alignment, where we accept funds from any source but retain naming rights only where the namesake's public record does not actively contradict the Trust's current ethical framework and literary goals. This allows us to accept money without accepting the baggage, and it shifts the burden from a posthumous trial of the donor to a present-tense declaration of our own values, which is where the accountability actually lies.

  This distinction matters profoundly for the writers who apply to us, because our current guidelines ask that characters be true to their period, and every year we receive manuscripts where true to their period turns out to mean a protagonist saying things the author clearly takes to be simply true. If we keep Hallam's name while adding a note, we signal to applicants that context is a shield, that you can embed xenophobia or sexism in your narrative so long as you claim it is historically accurate, and that the Trust will not scrutinize the difference between depicting a prejudice and endorsing it. If we remove the name, we signal that historical accuracy is a requirement for setting, but not for moral framing, and that we expect novelists in 2026 to render characters who are wrong by our lights without asking the reader to accept those errors as inevitable or justified. We are not asking authors to sanitize the past, but we are asking them to stop using the past as a hiding place for views they would not defend in the present, and our handling of Hallam's legacy is the clearest way to demonstrate that we understand the difference between representation and replication.

  To achieve this before the AGM in the first week of June, we need to move quickly and divide the labor accordingly. I propose that by the end of April, the chair commissions legal counsel to confirm that the endowment terms allow us to separate the funding from the naming rights, which is standard in most modern trust instruments but must be verified here given the age of the bequest. Simultaneously, I will draft a public statement explaining the decision, focusing on the future-facing mission alignment rule rather than a retroactive condemnation of Hallam, which should be reviewed by the board by mid-May so we can incorporate any necessary adjustments before the legal review is finalized. Once legal clearance is received, we should instruct our designers to begin work on new branding for the prize and the reissue series, aiming for a launch identity that reflects the breadth of historical fiction we wish to support rather than the specific biases of a single donor, and we should aim to have these new materials ready for circulation at the AGM. I will take responsibility for coordinating the drafting of the new bequest policy regarding naming rights, ensuring it captures the mission alignment standard we have discussed, and I ask that the treasurer begin modeling the financial implications of any potential donor withdrawal, though I suspect that clarity on our values will attract support rather than diminish it.

  I know this is uncomfortable, and I know some of you feel it erases history, but I believe it actually honors the best part of Hallam's own legacy, which was her willingness to write about uncomfortable truths when others looked away. She wrote about domestic violence and unmarried mothers when those topics were banned, and she argued for them with a courage that matches what we are attempting now; by removing her name from the xenophobic essays she refused to retract, we are not silencing her, we are choosing to amplify the part of her work that still speaks to us while declining to subsidize the part that harms us. We have a chance to define what this Trust is for before the next wave of bequests arrives, and if we do not take it, we will find ourselves having this same argument in twelve months with a donor whose views are even harder to reconcile with a modern literary community. Let us decide that our money is for the writing we want to see in the world, not for the preservation of reputations that have ceased to serve us, and let us go to the AGM with a clear recommendation to rename the programmes and a robust policy for the future. I look forward to discussing this with you all at the next meeting, but I hope you will consider this proposal seriously before we gather, because I believe it is the only way to ensure the Trust survives not just as a fund, but as a meaningful voice in the literary landscape.
