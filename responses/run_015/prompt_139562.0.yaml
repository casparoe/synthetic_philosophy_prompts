  **Scenario**

  In the city of Oakhaven, a binding referendum authorized a $50 million "Flood Safety Bond," legally restricted by state municipal code to capital infrastructure only. Voters approved "Levee Expansion" (Policy X), the only capital option on the ballot, despite widespread acknowledgment in town halls that "Pump Station Modernization" (Policy Z)—an operational expense ineligible for bond funding—would reduce flood risk more effectively. Post-election, city hydrologists confirmed Z remains superior to X for the substantive end of "Protecting Homes" (End Y), a fact conceded by the voter coalition. Nevertheless, a populist councilor insists on implementing X because "the ballot mandate is the people's will," while the City Manager (a technocrat) proposes reallocating general fund reserves to implement Z, arguing "the people's will is safety, not levees."

  **Analysis**

  **What each actor says:**
  *   **The Populist:** "The voters signed off on the Levee. To ignore the specific instruction they voted on is to treat their vote as meaningless. We must build the Levee."
  *   **The Technocrat:** "The voters wanted to stop flooding. The Levee won't do that as well as the Pumps. We should use available funds to build the Pumps."

  **Which reading each is committed to:**
  *   **The Populist (Say-So Reading):** Committed to the view that the will of the people is identical to their explicit, procedural instruction. They cannot swap to End-Tracking without admitting that the referendum itself was advisory, which undermines the binding authority they rely on for legitimacy.
  *   **The Technocrat (End-Tracking Reading):** Committed to the view that the will of the people is the outcome they seek, inferred through expert analysis of available means. They cannot swap to Say-So without admitting that procedural formalism outweighs substantive welfare, which contradicts their mandate to manage city resources effectively.

  **The single feature doing the work:**
  *   **Jurisdictional Decoupling:** The institutional separation between *capital* budgets (vote-eligible) and *operational* budgets (administratively controlled). This creates a gap where the only *voteable* means (X) is inferior to the only *effective* means (Z), forcing a choice between respecting the *mechanism* of will-formation vs. the *outcome* of will-formation.

  **What happens if that feature is removed:**
  *   If the bond law allowed funding for operational projects (Z), Z would have been on the ballot. Voters would have voted for Z. The Populist would demand Z, and the Technocrat would implement Z. The standoff collapses into an ordinary populism-versus-technocracy alignment (or disappears entirely), confirming that the inversion was entirely dependent on the structural mismatch between the menu of choice and the menu of efficacy.

  **The Populist Reply (Procedural Will)**
  *   **Objection:** The strongest populist reply is that the "will of the people" includes the *will to decide*. Even if Z achieves Safety better, overriding the specific choice of X disenfranchises the voters because it strips them of agency. On this view, Say-So is not a fallback; it is the core of democratic legitimacy.
  *   **Response:** This cannot be closed off within the design because it targets the definition of democracy itself, not the facts of the case. If "will" inherently includes "authority to choose means," then any technocratic override is constitutively anti-democratic, regardless of outcome.
  *   **Implication for your question:** This shows that populism's appeal is **constitutively anti-expert** whenever expert advice contradicts the specific *instruction* of the people, even if it aligns with their *values*. The Say-So reading is not a bug but the feature; populism privileges the *act* of willing over the *content* of the will. Therefore, the inversion in the scenario is unstable: the Technocrat may track the *substantive* will, but the Populist tracks the *authoritative* will. Your piece should conclude that populism is contingently anti-expert on outcomes, but constitutively anti-expert on authority.

  **Honesty Check on Constraints**
  *   **Joint Satisfiability:** The constraints are **barely satisfiable**, specifically regarding "no voter ignorance" and "belief about means."
  *   **The Tension:** Constraint (a) requires the people to believe X achieves Y. Constraint (b) requires them to concede Experts are right (Z achieves Y better). In the scenario, I resolved this by making the vote a *constrained choice* (they voted X because Z was illegal, not because they thought X was better).
  *   **The Cheat Risk:** If the voters *knew* Z was better but voted X anyway, their "belief about which policy achieves it" (a) is technically "Z," not "X." They voted X as a *proxy*. This bends constraint (a) slightly, as their *demand* was X, but their *belief* was Z. However, this is necessary to avoid "voter ignorance." If they believed X was better, they were ignorant. If they knew Z was better, they weren't ignorant, but then (a) is strained.
  *   **Verdict:** I have prioritized "No Ignorance" over a strict reading of (a), interpreting "belief about policy" as "policy selected for endorsement." This is the only way to keep the scenario realistic without making the voters look incompetent, which you excluded. The scenario holds, but note that the "belief" constraint is the friction point.
