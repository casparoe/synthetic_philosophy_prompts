  **TO:** Voss Prize Fiction Jury
  **FROM:** [Your Name]
  **DATE:** October 24
  **SUBJECT:** Decision Rule Recommendation for Sunday's Call

  **Bottom Line:** We are currently deadlocked in a Condorcet Cycle. Standard ranked voting rules will either fail to produce a winner or violate core fairness conditions. I recommend we adopt **Majority Judgment (letter grades)** via a quick re-vote on Sunday. This captures voter intensity, handles potential disqualifications without flipping the winner, and bypasses the mathematical impossibilities trapping our current ranked ballots.

  **The Situation**
  Our current ballots create a perfect rock-paper-scissors scenario: *Salt Year* beats *Understudy*, *Understudy* beats *Winter*, and *Winter* beats *Salt Year* (all 4–2). Borda counts and plurality votes result in three-way ties. This is not a failure of our judgment, but of ordinal mathematics. As my partner noted, this is Arrow's Impossibility Theorem in action: no ranked voting system can satisfy Unrestricted Domain, Pareto Efficiency, Independence of Irrelevant Alternatives (IIA), and Non-dictatorship simultaneously. We must choose which imperfection to live with.

  **Rule Analysis & Violations**
  *   **Plurality/Instant Runoff (IRV):** Both violate **IIA**. In a six-person room where ballots are visible, strategic voting is inevitable. If *Winter* supporters know *Understudy* is their nemesis, they might insincerely rank *Salt Year* higher to eliminate *Understudy* first. IRV specifically fails here because tie-breaking rules for elimination become the de facto winner.
  *   **Borda Count:** Violates **IIA**. If a book is withdrawn (see Plagiarism below), the point values shift, potentially changing the winner among the remaining books. It also ignores intensity; it treats a "mild preference" the same as a "vehement opposition," throwing away the data point that *Winter* jurors hate *Understudy*.
  *   **Pairwise (Condorcet):** Fails **Unrestricted Domain** here because no candidate beats all others. To resolve the cycle, we need a tie-breaker.
  *   **Majority Judgment (Grades):** This asks jurors to assign absolute grades (e.g., A, B, C) rather than ranks. It bypasses Arrow's theorem because it is cardinal, not ordinal. It violates the **Unrestricted Domain** condition of Arrow only insofar as it requires cardinal input, but it satisfies IIA better than ranked systems: if *Understudy* is disqualified, the grades for *Salt* and *Winter* remain unchanged, preventing the winner from flipping simply because a loser disappeared.

  **Board Proposals**
  Two proposals have circulated regarding tie-breaking:
  1.  **Chair Picks Elimination Order:** This explicitly violates **Non-dictatorship**. It concentrates decisive power in one person, inviting lobbying and undermining collective trust. In a small jury, this looks like corruption even if it isn't.
  2.  **Pre-commit Fixed Order in Bylaws:** This does not solve the manipulation problem; it merely shifts it to the bylaws committee. It still violates **IIA** because the fixed order dictates the winner regardless of voter preference in specific cycles. It removes flexibility needed for unique contexts like plagiarism allegations.

  **Intensity and Plagiarism**
  We have two critical data points ranked ballots ignore. First, intensity: The *Winter* jurors feel strongly that *Understudy* is the worst book, while *Salt* jurors are indifferent between the others. Ranked ballots hide this; grades reveal it. If *Winter* jurors give *Understudy* a "Fail," it cannot win, regardless of ranking.

  Second, the plagiarism allegation. If *Understudy* is withdrawn after voting, ranked systems recalculate, often changing the winner (violating IIA). With Majority Judgment, we simply remove the disqualified book's grades. The median grades for the remaining books stand. This ensures stability and fairness.

  **Alternative: Deliberation and Randomization**
  We could return to unstructured discussion. Deliberation changes preferences, effectively bypassing Arrow by violating the assumption of fixed preferences. This is arguably best for literary prizes. However, if we remain deadlocked after discussion, we must admit that no book has a mandate. In that case, **randomization** (drawing lots) is the only method that satisfies **Non-dictatorship** and **IIA** perfectly, though it violates **Pareto Efficiency** (we might pick a book everyone merely "likes" over one everyone "loves").

  **Recommendation**
  Deliberation is valuable, but we need a failsafe. I propose we spend the first thirty minutes of Sunday's call discussing the books. If no consensus emerges, we re-vote using Majority Judgment (A–F scales). This respects the intensity of your convictions, protects us against the plagiarism scenario, and avoids handing the chair a dictatorship. It acknowledges that while no system is perfect, cardinal evaluation is less imperfect than ranked cycling.

  Please review this before Sunday. We need to agree on the rule before we look at the books again.
