  The players were not individual soldiers but platoons occupying fixed sectors. Options were binary: harass (defect) or restrain (cooperate). Military payoffs for defection were negligible; killing one enemy rarely altered strategic outcomes. The real payoff matrix balanced safety against retaliation. A sniper kill yielded no ground but guaranteed artillery reprisal, making defection net-negative. The discount factor was high in static sectors where tomorrow mattered, and collapsed during offensives where survival was uncertain.

  Individuals rotated, but sectors had continuity. Memory lived in unit reputation and formal handovers. Relieving units were briefed on local "rules of war" by predecessors. Evidence against this mechanism would be immediate escalation upon rotation; instead, diaries note new units were warned not to provoke the opposite line. However, when elite assault troops replaced regulars, truces often broke, suggesting memory was fragile and dependent on specific unit cultures rather than structural inevitability. The geography anchored the game more than the men.

  Initially, restraint was forward-looking tit-for-tat. Over time, it hardened into a norm. Once internalized, the temptation vanished; shooting a water-carrier wasn't just risky, it was "not done." This shifts the game from PD to a coordination game. If actors no longer face a temptation to defect because the utility function changed via socialization, the PD model misdescribes the psychological state, even if it predicts the behavior. It becomes a convention, not a calculation.

  Generals played a higher-order game to destroy the iteration condition. Raids and frequent rotations were explicit attempts to lower the shadow of the future, forcing a one-shot dilemma where defection dominates. This fits within extended game theory: a principal trying to alter the agent's payoff structure. The fact that command had to expend significant capital to break truces proves the equilibrium was robust, but also that it was fragile against structural disruption. They were playing against the iteration itself.

  This episode vindicates the core insight that repeated interaction fosters cooperation, but exposes the model's austerity. Pure IPD assumes rational calculators; the trenches required sociological scaffolding—unit identity, handover rituals, and shame—to sustain cooperation amidst personnel churn. It shows reciprocity evolves, but only when norms lock in the discount factor against external attempts to reset the game.
