answer: |-
  Here is the translation, the residue report, and the verdict, drafted for the standards desk.

  ### Part 1: Lemkin in Desk Vocabulary

  To put Raphael Lemkin's concept into newsroom terms: **Genocide is not a body count; it is a conspiracy charge.**

  In our workflow, we treat crimes as events. A bombing happens; a politician resigns; a court rules. We verify the *act*. Lemkin's genocide is not an act; it is a *campaign*. It is a coordinated series of techniques, some violent and some bureaucratic, unified by a specific editorial intent.

  *   **The Lede:** The destruction of a group's capacity to exist. Killing members is just one method. Others include preventing births, transferring children to another group, or imposing conditions of life calculated to bring about physical destruction. Lemkin originally included cultural destruction (language, schools, institutions), though the 1948 Convention narrowed this.
  *   **The Nut Graf:** The distinguishing factor is *specific intent* (*dolus specialis*). It is not enough to show that a group is being decimated. You must show the decimation is the *objective*, not the collateral damage. In legal terms, it is the difference between murder and premeditated, ideologically driven erasure.
  *   **The Sourcing:** It requires access to the "mind of the perpetrator." In crime reporting, we infer intent from the weapon or the confession. In genocide, the weapon is often policy (zoning laws, sterilization mandates, curriculum changes). Proving it requires internal memos, speeches, or a pattern of conduct so consistent that no other explanation fits.
  *   **The Timeline:** It is a process story masquerading as an event story. By the time the "event" (mass death) is visible enough to meet our threshold for front-page play, the "crime" (the intent to destroy) may have been underway for years.

  **Summary for the Style Guide:** Genocide is an allegation of a specific *purpose* behind a pattern of *techniques*, not a synonym for high-casualty violence.

  ***

  ### Part 2: The Residue Report

  You asked what maps, what bends, and what vanishes. Your guesses on the untranslatable parts are correct, but incomplete. Here is the breakdown.

  **Bucket 1: Maps Cleanly (Evidence & Labeling)**
  *   **Attribution Norms:** Just as we don't call someone a "criminal" before a verdict, we shouldn't call an act "genocide" before a competent authority (court, UN commission) establishes the *intent*.
  *   **The "Two-Source" Rule:** In standard reporting, we need two sources for a claim. In genocide reporting, we need two *vectors of evidence*: the physical acts (killings, displacements) and the documentary intent (speeches, orders).
  *   **Correction Norms:** If we label it genocide and the intent is later disproven (e.g., it was brutal counter-insurgency, not erasure), the correction is not just about numbers; it's about the nature of the crime. This is high-liability copy.

  **Bucket 2: Fits Only If Bent (The Workflow)**
  *   **The News Peg:** You noted that techniques like closing schools are non-events. *The Bend:* We treat the *accusation* or the *finding* as the peg, not the act itself. We report "UN Inquiry Alleges Genocide" rather than "Genocide Occurring." This shifts the news value from the suffering to the bureaucracy of labeling.
  *   **The Named Person:** News needs a protagonist. Genocide targets a category. *The Bend:* We focus the lede on the perpetrators (the "conspirators") to satisfy the "who," even though the crime is defined by the "whom" (the group).
  *   **Balance:** We strive for fairness. Genocide is inherently unbalanced (one side seeks to erase the other). *The Bend:* We risk false balance by seeking "the other side's" view on whether they intend to destroy a people. Perpetrators rarely admit intent.

  **Bucket 3: No Expression in Desk Vocabulary (The Untranslatable)**
  *   **Your Guesses:**
      *   *Collectivity vs. Individual:* Correct. Our ethics demand we humanize victims (profiles of the dead). Genocide defines victims by their de-individuation (membership in a group). Using the word reinforces the categorization the perpetrators use.
      *   *Non-Events:* Correct. We cover explosions, not silences. The destruction of a language or an economic base is a "slow fade," which violates our "timeliness" news value.
      *   *Preventive vs. Retrospective:* Correct. Lemkin wanted the word to trigger intervention *during* the process. Our norms require us to wait until the process is verifiable (often too late).
  *   **What You Left Out:**
      *   *The "Success" Condition:* News logic implies that if the group survives, the threat was overstated. Lemkin's logic is that if the *intent* existed, the crime occurred, regardless of success. We struggle to report a "failed genocide" with the same gravity as a "completed" one.
      *   *Neutrality:* Our vocabulary is built on the assumption that facts exist independently of moral judgment. Genocide is a "thick concept"—it fuses fact (killings) with moral judgment (evil intent). Using it unattributed collapses the wall between news and opinion.
      *   *The Ladder Fallacy:* Your lower rungs (massacre, atrocity) are quantitative (how many died?). The top rung is qualitative (why did they die?). You cannot climb from "many dead" to "genocide." They are different axes. A massacre can be genocide; it can also be a war crime. The ladder implies escalation; the reality is categorization.

  ***

  ### Part 3: The Verdict

  **Is the untranslatable residue a defect in newsroom vocabulary, or is the concept doing less work than we pretend?**

  It is both. Our vocabulary is episodic, which makes it blind to structural destruction. However, the concept *is* doing less work in a headline than we pretend. When "Genocide" appears in a banner head without attribution, it functions as a moral exclamation point ("This is the worst thing!") rather than a precise descriptor. It signals outrage, not legal reality.

  **Concrete Recommendation: Should the top rung exist?**

  **No.** Do not make "Genocide" the top rung of an editorial ladder where *you* apply the label based on evidence thresholds.

  **Why:**
  1.  **The Intent Trap:** Your reporters can verify bodies. They cannot verify state of mind. Determining *dolus specialis* is a judicial function, not a journalistic one. If you set an evidentiary threshold for your newsroom to use the word unattributed, you are turning your standards desk into a kangaroo court.
  2.  **The Escalation Trap:** By placing it above "Ethnic Cleansing" or "Crimes Against Humanity," you imply it is simply "worse." This leads to "atrocity inflation," where the word is withheld until the body count is astronomical, missing Lemkin's point about early prevention.
  3.  **The Liability Trap:** If you use the word unattributed and a court later rules the intent was not proven, you have not just made a typo; you have libeled a state or actor with the highest-stakes label in international law.

  **The Fix:**
  Rewrite the rule so the top rung is not a label you apply, but a **trigger for attribution.**

  *   **Current (Flawed):** "We use 'genocide' when [X] evidence is met."
  *   **Proposed:** "We do not use 'genocide' as an unattributed descriptor. We use it only when: (a) A competent international court has ruled as such; (b) A UN Commission of Inquiry has formally used the term; or (c) It is directly quoted from a source, with context explaining the legal weight of the claim."

  **In practice:**
  Instead of climbing the ladder to label the event *Genocide*, your reporters should describe the *rungs* of the ladder in the copy.
  *   *Don't write:* "Genocide in Gaza/Sudan/Ukraine."
  *   *Do write:* "Forces are systematically destroying the economic base of Group X, separating children from families, and targeting cultural sites, actions which rights groups say constitute genocide."

  This respects Lemkin (by describing the techniques and the group-targeting), respects the reader (by giving them the facts to judge the intent), and respects the standards desk (by keeping you out of the business of rendering legal verdicts).

  **Final Note:**
  The word "genocide" is a legal grenade. Lemkin threw it to break the shield of state sovereignty. If your house style treats it as just another adjective for "very bad massacre," you defuse the grenade before it leaves the newsroom. Keep it quoted. Keep it attributed. Let the lawyers and the historians fight over the intent; you report the destruction.
