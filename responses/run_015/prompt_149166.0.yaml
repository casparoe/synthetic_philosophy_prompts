  # Part 1: The Logical Space

  Before constructing the instrument, we map the dimensions of disagreement. A position in the philosophy of medicine is defined by its coordinates on the following eight axes. Each axis represents a binary or trinary choice that determines the extension of the term "disease."

  1.  **Function Requirement:** Does disease ascription require a failure of part-level function? (Yes / No)
  2.  **Function Type:** If Yes, is function read historically (selected effect) or forward-looking (current causal contribution)? (History / Current)
  3.  **Harm Requirement:** Does the bearer have to be worse off? (Yes / No)
  4.  **Harm Evaluator:** If Yes, whose evaluation settles harm? (Bearer’s Subjective / Species-Typical Life / Counterfactual Healthy Version)
  5.  **Statistical Typicality:** Does statistical frequency within a reference class matter? (Yes / No)
  6.  **Reference Class:** If Yes, how is the class fixed? (Species at Prime / Typical-for-Age / Theorist’s Ideal)
  7.  **Ontology:** Is there one underlying property or a cluster of separable concerns? (Single Property / Cluster)
  8.  **Primary Job:** Which job does the ascription primarily perform? (Explain Symptoms / License Intervention / Excuse (Sick Role) / Authorize Resources)

  **Total Logical Combinations:**
  With binary choices (simplifying trinary axes for maximum resolution), the space allows for $2^8 = 256$ theoretical positions. Even restricting the "Job" axis to the four specific tasks listed reduces this to 128 distinct cells. Most of these cells are empty.

  **Empty Combinations Analysis:**
  *   **History Function + No Harm + License Intervention:** *Incoherent.* If a trait is a historical failure but does not make the bearer worse off, there is no normative ground to intervene medically rather than biologically engineer.
  *   **No Function + No Harm + Explain Symptoms:** *Incoherent.* If there is no functional failure and no harm, there is no "symptom" to explain, only variation.
  *   **Single Property + Cluster Ontology:** *Logically Impossible.* A position cannot claim disease is a single natural kind and simultaneously claim it is a loose cluster of unrelated concerns.
  *   **Species-Prime Reference + Typical-for-Age Verdict:** *Unstable.* A theorist cannot consistently define health by the species at its prime while verdicting age-related decline as non-disease if they admit age is a valid reference class modifier. This is usually *Unexplored* due to inconsistency rather than design.
  *   **Bearer’s Subjective Harm + Strong Naturalism:** *Unattractive.* If the bearer’s feeling settles harm, biological facts become secondary, collapsing naturalism into normativism.

