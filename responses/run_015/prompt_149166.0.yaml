  **Instructions:** Answer the following ten questions based on your intuition about the cases described. Follow the path indicated by your answer to arrive at your committed position.

  **Node 1:** Consider the cluster of disabling fatigue and pain that reliably produces disability, with no identifiable mechanism and normal results on every available test. Is this a genuine biological kind waiting to be found, or a useful label for a collection of symptoms?
  *   **A:** Genuine biological kind. (Go to Node 2)
  *   **B:** Useful label. (Go to Node 8)

  **Node 2:** Consider the congenital absence of one kidney: rare, no current functional loss, no elevation of risk provided contact sport is avoided. Is the organism damaged?
