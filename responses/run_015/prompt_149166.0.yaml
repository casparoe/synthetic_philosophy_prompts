  # Part 4: Seminar Analysis

  ### 1. Inseparable Leaves and the Eleventh Case
  **Pair:** **Biostatistical Naturalist** and **Clinical Naturalist**.
  **Reason:** In this tree, both positions converge on Node 6 (Infertility/Harm) and Node 7 (Autopsy/Symptoms) with similar "No Harm/Function Only" verdicts. The split between them occurs at Node 3 (Salt/BP - History vs. Current), but if a student answers Node 3 inconsistently (e.g., sees the salt mechanism as a failure *and* a success), they may land in the same leaf cluster regarding harm and stats.
  **Eleventh Case:** "A trait that was selected *against* in evolutionary history (maladaptive origin) but currently enhances survival in a modern environment (e.g., a mutation reducing inflammation that was once costly)."
  *   *Separation:* The Biostatistical Naturalist (Species Prime/Design) might see this as functional if it aids survival now. The Clinical Naturalist (Current Causal) definitely sees it as functional. The Harmful-Dysfunction (History) sees it as a dysfunction. This case forces a choice on whether *origin* or *current effect* defines the function, sharpening the Node 3 split.

  ### 2. Inconsistent Nodes
  **Nodes:** **Node 4 (Senescence)** and **Node 5 (85% Trait)**.
  **Reason:** Both nodes probe the **Reference Class** axis. Students often answer Node 4 based on intuition about aging ("Old age isn't a disease") but answer Node 5 based on intuition about capacity ("Reduced oxygen is a failure").
  *   *Instability:* If a student says Senescence is *not* a disease (Species Prime) but the 85% Trait *is* a disease (Ideal Capacity), they are mixing reference classes. This reveals an unstable commitment to whether "normal" is statistical or ideal. This is the optimal place to pause the seminar and ask: "If the 85% trait is a disease because it reduces capacity, why isn't senescence a disease when it reduces capacity more?"

  ### 3. Reference Class Shift Impact
  **Shift:** Typical-for-Age vs. Typical-for-Species-at-Twenty-Five.
  **Impact on Assignment:**
  *   **Biostatistical Naturalist:** If a student shifts to **Typical-for-Age**, they move from the *Biostatistical Naturalist* leaf to the *Weak Normativist* leaf. They now accept senescence and common age-related decline as non-diseases (because they are age-typical), fundamentally altering the extension of the concept.
  *   **Harmful-Dysfunction Hybrid:** If a student shifts to **Typical-for-Age**, the "Function Failure" criterion becomes harder to meet for older adults. A 70-year-old with reduced kidney function is "typical for age." This pushes the student toward the *Clinical Naturalist* or *Weak Normativist* position, as the "failure" condition vanishes for the elderly.
  *   **General Effect:** This shift acts as a hidden variable. Half the class will unknowingly change the definition of "Function Failure" mid-tree. It artificially inflates the number of students landing in *Weak Normativist* or *Clinical Naturalist* leaves and depresses the *Biostatistical Naturalist* count. You should ask students to re-answer Node 4 and 5 explicitly defining their reference class to see how many migrate.
