  # Part 3: The Leaves (Positions)

  1.  **Biostatistical Naturalist**
      *   *Commitments:* Disease is objective function failure relative to species design; harm is irrelevant to disease status; reference class is species at prime.
      *   *Awkward Consequence:* Must classify many common age-related conditions as diseases while excluding infertility in the happily childless.
  2.  **Harmful-Dysfunction Hybrid**
      *   *Commitments:* Disease requires both factual function failure (historical) and normative harm (objective welfare).
      *   *Awkward Consequence:* Cannot classify asymptomatic genetic risks as diseases until they actually cause harm.
  3.  **Strong Normativist**
      *   *Commitments:* Disease is entirely a value judgment about unwanted conditions; biological function is secondary to social disvaluation.
      *   *Awkward Consequence:* Must deny that veterinary pathology is the same kind of fact as human pathology.
  4.  **Pragmatist/Institutional-Kind**
      *   *Commitments:* Disease ascriptions are tools for managing institutional resources and sick roles, not discoveries of nature.
      *   *Awkward Consequence:* Cannot explain why some institutional labels (e.g., infection) predict death better than others (e.g., deviance).
  5.  **Eliminativist**
      *   *Commitments:* There is no underlying property for "disease" to track; the term is a fiction that should be discarded or radically revised.
      *   *Awkward Consequence:* Cannot account for the apparent success of medical interventions targeting specific disease entities.
  6.  **Clinical Naturalist**
      *   *Commitments:* Disease is current causal failure contributing to survival/reproduction; evolutionary history is irrelevant.
      *   *Awkward Consequence:* Must classify evolutionary mismatches (like salt-sensitive hypertension) as functional successes until they kill.
  7.  **Risk-Reductionist**
      *   *Commitments:* Disease is defined by statistical probability of future harm; current pathology is secondary to risk profile.
      *   *Awkward Consequence:* Turns nearly everyone with any risk factor into a patient, collapsing the distinction between health and disease.
  8.  **Social Constructivist**
      *   *Commitments:* Disease categories are created by social labeling processes (like schooling) rather than discovered in the body.
      *   *Awkward Consequence:* Struggles to explain why biological constraints limit which behaviors can be successfully labeled as disordered.
  9.  **Idealized Naturalist**
      *   *Commitments:* Function is measured against an ideal theoretical capacity, not statistical typicality.
      *   *Awkward Consequence:* Classifies the vast majority of the actual population as diseased if they fall short of the ideal.
  10. **Weak Normativist**
      *   *Commitments:* Disease includes universal age-related decline; reference class is typical-for-age.
      *   *Awkward Consequence:* Removes the critical force of "disease" by making it synonymous with living long enough.
  11. **Anthropocentric Normativist**
      *   *Commitments:* Disease requires human-specific normative evaluation; animal/plant pathology is merely analogous.
      *   *Awkward Consequence:* Cannot make sense of comparative medicine or zoonotic disease tracking without equivocation.

