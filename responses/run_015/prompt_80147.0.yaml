answer: |-
  ### Essay Question

  **Topic:** The Socialist Calculation Debate and the Lange-Lerner Model

  **Question:**
  Oscar Lange proposed a model of market socialism wherein a Central Planning Board (CPB) sets prices via trial-and-error *tâtonnement*, while enterprise managers follow two rules: (1) minimize average cost and (2) set price equal to marginal cost ($P=MC$), with losses covered by a social dividend.

  Evaluate whether this model successfully defeats the socialist calculation critique. To do so, you must rigorously distinguish between Ludwig von Mises's *impossibility* claim (regarding the logical prerequisites for rational calculation) and F.A. Hayek's *knowledge* claim (regarding the dispersed and tacit nature of economic information). Does the Lange-Lerner model satisfy the conditions for one critique while failing the other? In your analysis, explicitly address the economic function of the social dividend in relation to the $P=MC$ rule, and examine whether the CPB can realistically access the data required for price adjustment without market entrepreneurship.

  ***

  ### Model Answer

  The socialist calculation debate is often treated as a monolith, but a rigorous evaluation of the Lange-Lerner model requires disentangling two distinct critiques: Mises's logical argument and Hayek's epistemic argument. Mises argued that without private ownership of the means of production, there are no genuine market prices for capital goods. Without these prices, economic calculation is logically impossible; planners cannot compare input costs to output values to determine efficiency. Hayek shifted the terrain, arguing that even if calculation were logically possible, the relevant knowledge is dispersed, tacit, and contextual. It exists only in the minds of particular agents and is discovered through entrepreneurial action, meaning it cannot be aggregated by a central body.

  The Lange-Lerner model is a direct response to Mises, and on those terms, it is largely successful. Lange accepts the neoclassical premise that rational allocation requires equating marginal rates of substitution and transformation. By instructing managers to treat parametric prices as given and set $P=MC$, the CPB simulates the equilibrium conditions of a competitive market. If the CPB adjusts prices based on observed shortages or surpluses (*tâtonnement*), the system theoretically converges on Pareto efficiency. This demonstrates that market socialism is not *logically* impossible; a set of simultaneous equations could, in principle, solve for equilibrium prices without private capital owners. Thus, Lange defeats the strong Misesian claim that calculation is impossible without private property rights.

  However, the mechanical stability of this model relies on a load-bearing mechanism often treated as cosmetic: the social dividend. In industries characterized by increasing returns to scale (natural monopolies), marginal cost is below average cost. If managers strictly follow the $P=MC$ rule, these enterprises will incur chronic losses. The social dividend is not merely a distributional tool for sharing profits; it is the fiscal engine required to subsidize these structural losses to keep the system functioning. If the CPB cannot accurately tax and redistribute to cover these deficits, the $P=MC$ rule becomes unsustainable, and the simulation collapses. Recognizing this reveals that the model's efficiency is contingent on a fiscal capacity that assumes perfect knowledge of cost structures.

  This contingency leads to the Hayekian critique, which Lange fails to address. Hayek's objection is not about solving equations, but about generating the data to put into them. The *tâtonnement* process presupposes that the CPB can read accurate signals of excess demand and, crucially, that managers can and will report true marginal cost curves. But marginal cost is not a static datum waiting to be reported; it is discovered through the competitive rivalry of entrepreneurs testing production methods. In a static Lange model, managers have no incentive to reveal true costs or innovate, as they are merely rule-followers. More importantly, the CPB cannot access the tacit knowledge of time and place required to adjust prices dynamically. The trial-and-error process Lange describes is not a computational shortcut; it is a market process stripped of the property rights that make discovery possible. Without the residual claimancy of ownership, there is no mechanism to incentivize the discovery of the very knowledge the planner needs.

  Therefore, the verdict is asymmetrical. The Lange-Lerner model successfully refutes Mises by demonstrating that socialist accounting is logically consistent with neoclassical equilibrium theory. It shows that prices can be simulated if one assumes the data is available. However, it leaves Hayek's critique standing because it assumes the availability of dispersed knowledge without explaining the institutional mechanism for its discovery. Lange solves the problem of *calculation* (arithmetic) but fails to solve the problem of *knowledge* (epistemology). The model works on paper because it treats knowledge as a given parameter, whereas Hayek showed that knowledge is the variable to be solved for.

  ***

  ### Marking Scheme (30 Marks Total)

  **1. Distinction Between Mises and Hayek (10 Marks)**
  *   **A (8-10):** Explicitly defines Mises's claim as logical/impossibility of calculation without property prices, and Hayek's as epistemic/dispersed knowledge. Treats them as distinct arguments requiring different rebuttals.
  *   **B (5-7):** Identifies both names but blurs the distinction (e.g., treats both as "information problems" or "efficiency claims").
  *   **C/F (0-4):** Conflates Mises and Hayek entirely or focuses on only one.
  *   **Common Failure Flag:** Treating "Mises" and "Hayek" as interchangeable labels for "anti-socialism."

  **2. Analysis of Lange-Lerner Mechanics (10 Marks)**
  *   **A (8-10):** Explains the $P=MC$ rule and explicitly identifies the social dividend as a necessary subsidy for natural monopolies (decreasing cost industries), not just profit sharing. Notes that *tâtonnement* requires data access.
  *   **B (5-7):** Explains $P=MC$ correctly but treats the social dividend as purely redistributive or ignores the loss-making implication of marginal cost pricing in monopolies.
  *   **C/F (0-4):** Fails to explain the rules of the model or the function of the CPB.
  *   **Common Failure Flag:** Granting the model efficiency without noticing that the subsidy is doing the structural work.

  **3. Critical Verdict and Synthesis (10 Marks)**
  *   **A (8-10):** Clear verdict: Lange answers Mises (logic) but fails Hayek (knowledge/discovery). Reasoning links the *tâtonnement* requirement to the lack of entrepreneurial discovery incentives.
  *   **B (5-7):** Verdict is correct (Lange fails Hayek) but reasoning is thin (e.g., "Hayek said planners can't know everything" without linking to entrepreneurship/tacit knowledge).
  *   **C/F (0-4):** No clear verdict or argues Lange solves both/neither without justification.

  **Total: 30 Marks**

  **Grading Notes for Tutors:**
  *   **To secure an A:** The essay must make the "subsidy is load-bearing" move and the "knowledge is discovered not given" move.
  *   **Automatic Cap at B:** If the student conflates Mises and Hayek, they cannot score higher than 7 in Section 1, capping the total grade at a B range (approx. 22/30), regardless of other insights.
  *   **Time Management:** This is a 2-hour take-home. Expect conciseness. Penalize excessive biographical detail on the authors.
