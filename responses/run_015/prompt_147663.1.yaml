answer: |-
  **Project Title:** Extending Risk-Weighted Utility to Social Choice: A Structural Analysis

  **1. The Research Question**
  Risk-weighted expected utility provides a formal account of why a single agent might rationally prioritize avoiding worst-case scenarios over maximizing average expected value. This project asks whether that framework extends uniquely to decisions affecting multiple people. I will focus on social choice problems under risk, where probabilities are known and objective, rather than under ambiguity. I will hold fixed a utilitarian social welfare function as the baseline for aggregating well-being, isolating the risk-weighting parameter as the sole variable. The question is determinate: does a unique, defensible generalization of risk-weighting exist for multi-agent contexts, or do the natural candidates diverge in ways that undermine the coherence of the concept itself? A successful answer will either identify a unique extension or demonstrate that the individual-case permission relies on features absent in social contexts.

  **2. Why the Question Remains Open**
  Existing literature leaves this question unresolved because the individual and social debates operate in isolation. The debate over risk-weighted utility is framed entirely around prudential rationality: whether one person may depart from expected utility maximization regarding her own prospects. Social choice theory addresses multi-agent aggregation but typically assumes expected utility maximization, focusing instead on ex ante versus ex post priority without isolating the risk-attitude parameter.

  Furthermore, standard objections to non-expected-utility theories do not translate cleanly. Worries about dynamic consistency or susceptibility to exploitation rely on a single agent making sequential choices over time. In a social context, there is no single subject to exploit, and the "sequence" is often a one-off policy choice. Consequently, the structural constraints that limit individual risk-weighting may not apply, leaving the social extension under-constrained.

  **3. Method and Work Plan**
  I will execute this project over twelve months, moving from formal characterization to practical application.

  *Months 1–3: Formal Setup and Mapping.* I will define the class of social decision problems precisely and map the logical space of possible generalizations. I will formalize the two natural candidates: *aggregate-first weighting* (applying the risk function to total social welfare) and *person-by-person weighting* (applying the risk function to individual prospects before summing).

  *Months 4–6: Axiomatic Characterization.* I will derive axioms that separate these two candidates. I will isolate the minimal case in which they diverge: specifically, scenarios involving independent risks across individuals and uncertain population sizes. This phase will produce a proof showing that person-by-person weighting collapses toward ordinary expected utility as risks diversify, whereas aggregate-first weighting retains its bite but mimics inequality aversion.

  *Months 7–9: Implications for the Individual Case.* I will analyze the reverse implication. If the only defensible social extensions either collapse or dissolve into disguised social-welfare parameters, I will argue that the individual-case permission relies on the identity of the subject holding the attitude and bearing the risk. This will determine whether risk-weighting is a distinct rational norm or an artifact of single-agent framing.

  *Months 10–12: Applied Case Study.* I will apply the framework to a pandemic-policy choice involving trade-offs between suppression strategies and economic risk. I will conduct a sensitivity analysis showing how practical recommendations shift as the risk parameter and the priority parameter vary independently. This will quantify the practical difference between the two weighting candidates.

  **4. Possible Conclusions**
  The project will conclude with one of four determinate results. First, *aggregate-first weighting* is the unique valid extension, implying social risk attitudes are distinct from inequality aversion. Second, *person-by-person weighting* is valid, implying social risk aversion evaporates under diversification. Third, there is *no impersonal analogue* of risk-weighting, implying the concept is essentially first-personal. Fourth, the only defensible impersonal version is a *disguised social-welfare parameter*, implying the individual debate conflates risk attitude with priority for the worse-off. The choice between these will be decided by the axiomatic analysis of the divergence cases and the stability of the risk parameter under individuation changes.

  **5. Honest Failure Conditions**
  I anticipate three specific failure modes. If the two candidates turn out extensionally equivalent under every plausible social welfare function, the project will conclude that the distinction is formal only, and the question is moot. If the divergence appears only where probabilities are unknown, the project will conclude that the relevant phenomenon is ambiguity aversion rather than risk-weighting, requiring a different framework. If the disagreement proves merely verbal—turning on whether the risk function is classified as part of the probability transformation or the outcome evaluation—I will report this negative result. A verbal-disagreement finding would indicate this is the wrong project to have funded, but it is a necessary clarification for the field.

  **6. Scope and Feasibility**
  The project is sized for twelve months. The primary risk to feasibility is the axiomatic characterization phase; if the proof of divergence becomes intractable, I will drop the full axiomatic characterization in favor of a constructive existence proof using specific counter-examples. I will not drop the applied case study, as it is necessary to demonstrate the practical stakes to a non-specialist audience. I will not expand the scope to include ambiguity aversion or non-utilitarian social welfare functions, as doing so would prevent a determinate answer within the fellowship period.

  **7. Broader Impact**
  A regulator, trustee, or programme officer needs to know whether "risk aversion" in policy modeling is a distinct parameter from "inequality aversion." If these are distinct, they can be tuned independently to match public values. If they are conflated, adjusting one may inadvertently commit the institution to a moral stance on inequality it did not intend to adopt. This project will clarify whether risk-weighting offers a genuine tool for social decision-making or merely repackages existing ethical parameters. The result will enable institutions to adopt modeling frameworks that are transparent about the ethical commitments they encode.
