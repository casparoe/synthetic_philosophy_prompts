prompt: |-
  I was appointed three months ago to the board of trustees of a mid-sized charitable foundation in the Midlands, and I now chair the quarterly grants panel. We have begun receiving an increasing number of proposals that frame themselves through effective altruist reasoning: cost-effectiveness analyses, long-termist projections, promises of deferred giving via high-earning careers, and demands that we fund only what can be measured against a quantitative welfare metric. I need a reusable decision procedure—ordered questions, sufficient-answer conditions, clear stopping points, and explicit hand-offs to value judgement—that my panel (none of us philosophers, all with legal or sector backgrounds) can actually run in a ninety-minute session without outsourcing the reasoning to outside experts. The procedure must operationalise three specific conceptual pressures: the institutional critique (whether accepting the proposal reshapes our charitable mission or creates capture), the earning-to-give objection (whether the proposal defers moral obligation into a speculative future income stream), and measurability bias (whether goods that resist quantification are being systematically excluded not because they lack value but because they lack metrics). For each step, specify what counts as a sufficient answer, where the procedure terminates in rejection, where it terminates in approval, and where it must flag that the remaining disagreement is one of values rather than facts; also flag the points where the procedure is likely to misfire or produce an answer the panel will dislike. Then apply the procedure to two concrete proposals: first, a £200,000 request to fund mass deworming in East Africa, supported by a published cost-effectiveness estimate of approximately thirty pounds per DALY averted and a condition that our foundation’s branding appear on all programme materials; second, a £50,000 seed request from a local community theatre collective whose founders propose taking corporate finance roles for five years, donating half their earnings back to the collective, arguing this maximises long-term social value through an “earn to give” pathway, but whose artistic work produces no quantifiable welfare metric whatsoever. Please write the answer in British English, keep the tone formal and suitable for a board document, avoid bibliographies or citation requests, and be explicit about what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** New board trustee (3 months), Chair of Grants Panel, mid-sized charitable foundation (Midlands, UK).
      *   **Panel Composition:** Legal or sector backgrounds, no philosophers.
      *   **Problem:** Increasing proposals using Effective Altruism (EA) framing (cost-effectiveness, long-termism, earning-to-give, quantitative metrics).
      *   **Task:** Create a reusable decision procedure (ordered questions, sufficient-answer conditions, stopping points, hand-offs to value judgement).
      *   **Constraints:** Must fit a 90-minute session, no outside experts, British English, formal tone (board document style).
      *   **Specific Conceptual Pressures to Operationalise:**
          1.  Institutional Critique (mission reshaping/capture).
          2.  Earning-to-Give Objection (deferring obligation to speculative future).
          3.  Measurability Bias (excluding unquantifiable goods).
      *   **Output Requirements:** Specify sufficient answers, termination points (reject/approve/value flag), potential misfires/dislikes.
      *   **Application:** Apply to two specific proposals (Deworming in East Africa vs. Local Theatre "Earn-to-Give").
      *   **Explicit Limitations:** State what the procedure *cannot* settle.

  2.  **Deconstruct the Decision Procedure:**
      *   *Goal:* A practical tool for laypeople, not a philosophical treatise. It needs to be a checklist or flowchart style but written as text.
      *   *Structure:*
          *   Introduction (Purpose & Scope).
          *   The Procedure (Steps 1-5).
          *   Limitations & Risks (Where it might misfire).
          *   Application to Case Studies.
      *   *Tone:* Formal, British English (e.g., "programme," "centre," "£"), authoritative but practical.
      *   *Key Challenge:* Balancing the rigor of EA with the intuition of traditional philanthropy without getting bogged down in moral philosophy.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Step 1: Mission Alignment (The Institutional Critique).* Before looking at numbers, does this fit *our* charity? This addresses "capture."
          *   *Question:* Does this shift our focus away from our governing document?
          *   *Stop:* If yes (and mission change isn't on the agenda), Reject.
      *   *Step 2: The Metric Trap (Measurability Bias).* Are we rejecting good things just because they aren't numbers?
          *   *Question:* Is the lack of metrics due to lack of value or lack of method?
          *   *Hand-off:* If value is asserted but unmeasured, move to Value Judgement.
      *   *Step 3: The Deferral Risk (Earning-to-Give).* Is the impact real now or speculative later?
          *   *Question:* Is the primary output immediate or contingent on future income?
          *   *Stop:* If purely speculative/deferred without immediate tangible benefit, Reject (usually).
      *   *Step 4: Cost-Effectiveness vs. Context.* Is the number meaningful here?
          *   *Question:* Does the cost-per-outcome ignore local context or dignity?
          *   *Hand-off:* If high efficiency but low dignity/control, Value Judgement.
      *   *Step 5: Final Value Synthesis.*
          *   *Question:* Given the above, does this feel like *our* money doing *our* work?
          *   *Decision:* Approve/Reject.

      *Refining the Steps for the Prompt's Specific Pressures:*
      *   Need to explicitly name the three pressures in the steps.
      *   Need clear "Sufficient Answer" criteria.
      *   Need "Termination Points."

      *Revised Structure:*
      *   Phase 1: Institutional Integrity (Mission Capture).
      *   Phase 2: Temporal Integrity (Earning-to-Give/Deferral).
      *   Phase 3: Epistemic Integrity (Measurability Bias).
      *   Phase 4: Final Value Judgement.

  4.  **Drafting the Content (incorporating British English & Formal Tone):**
      *   Use terms like "Governing Document," "Trustees," "Expenditure," "Programme."
      *   Ensure the distinction between *fact* (can we measure this?) and *value* (do we care about this?) is clear.

  5.  **Addressing the "Misfire/Dislike" Requirement:**
      *   Where will the panel struggle? Probably when a high-impact EA project conflicts with local identity, or when a local project looks inefficient but feels right. The procedure must admit it can't solve that tension, only highlight it.

  6.  **Applying to Case Studies:**
      *   *Case 1: Deworming.* High metrics, low local connection, branding condition (mission capture risk?).
      *   *Case 2: Theatre.* Low metrics, high local connection, earning-to-give model (deferral risk?).
      *   *Run the procedure against both.*

  7.  **Review against Constraints:**
      *   90-minute session feasible? Yes, if steps are tight.
      *   No philosophers? Yes, keep language legal/operational.
      *   British English? Check spelling and currency.
      *   Explicit about limitations? Yes, need a dedicated section.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is the "Earning-to-Give" step clear?
      *   *Fix:* Make sure it distinguishes between funding the *activity* vs. funding the *potential future donation*. The theatre proposal is funding the collective *now* based on a promise of *later* income. That's a risk.
      *   *Critique:* Is the branding condition in Case 1 addressed?
      *   *Fix:* Include that in the Institutional Integrity step (donor control/capture).
      *   *Critique:* Is the tone too dry?
      *   *Fix:* Keep it professional but actionable. Use bolding for decision points.

  9.  **Final Polish:**
      *   Check word count and flow.
      *   Ensure the "Value Judgement Hand-off" is explicit.
      *   Verify the "Midlands" context is respected (localism vs. globalism).

  *(Self-Correction Note on "Earning-to-Give" in Case 2)*: The prompt says the founders propose taking corporate roles for 5 years and donating back. The grant is a *seed request* now. So the foundation is funding the *setup* for an earning-to-give pipeline. This is highly speculative. The procedure needs to flag this as a "Deferral Risk."

  *(Self-Correction Note on Case 1)*: Deworming is classic EA. High DALY efficiency. But the branding condition might violate the foundation's independence. This hits the "Institutional Critique."

  10. **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  **BOARD DOCUMENT: GRANTS PANEL DECISION PROCEDURE (DRAFT V1.0)**
  **SUBJECT:** Operational Framework for Evaluating Proposals with Effective Altruist Framing
  **TO:** Board of Trustees
  **FROM:** Chair, Grants Panel
  **DATE:** 24 May 2024

  ### 1. Purpose and Scope

  This procedure is designed to assist the Grants Panel in evaluating funding proposals that utilise effective altruist (EA) reasoning, specifically those prioritising cost-effectiveness metrics, long-termist projections, or deferred giving models. The objective is not to adjudicate moral philosophy, but to safeguard the Foundation's governance, mission integrity, and risk profile within a ninety-minute session.

  This framework operationalises three specific conceptual pressures:
  1.  **Institutional Critique:** Preventing mission drift or donor capture.
  2.  **Earning-to-Give Objection:** Preventing the substitution of immediate impact for speculative future income.
  3.  **Measurability Bias:** Preventing the exclusion of valuable but unquantifiable outcomes.

  **Note on Limitations:** This procedure identifies *where* a decision rests on empirical fact and *where* it rests on trustee value judgement. It cannot resolve fundamental disagreements regarding the Foundation's moral priorities; it can only ensure such disagreements are made explicit before a vote is taken.

  ---

  ### 2. The Decision Procedure

  The Panel shall proceed through the following four phases. At each phase, the Chair must record whether the condition is Met, Not Met, or Flagged for Value Judgement.

  #### Phase 1: Institutional Integrity (The Mission Capture Test)
  *Objective: To determine if the proposal reshapes the charitable mission or cedes control to external metrics.*

  **Question 1.1:** Does the proposal require the Foundation to adopt a definition of "impact" or "beneficiary" that contradicts or significantly narrows our Governing Document?
  *   **Sufficient Answer for Continuation:** No. The proposal fits within existing charitable objects.
  *   **Termination Point (Rejection):** Yes. If the proposal requires us to prioritise global metrics over local statutory requirements (or vice versa) in a way that violates our governing instruments.
  *   **Question 1.2:** Does the proposal attach conditions (e.g., branding, reporting requirements, veto rights) that compromise the Foundation's independence or reputation?
  *   **Sufficient Answer for Continuation:** No. Conditions are standard grant monitoring.
  *   **Flag for Value Judgement:** Yes. If conditions are non-standard but legally permissible (e.g., mandatory branding on foreign programme materials). The Panel must vote on whether reputational risk outweighs impact.

  #### Phase 2: Temporal Integrity (The Deferral Risk Test)
  *Objective: To assess whether the proposal defers moral obligation into a speculative future income stream.*

  **Question 2.1:** Is the primary social benefit contingent upon the applicant generating future personal income to donate, rather than the direct expenditure of the grant itself?
  *   **Sufficient Answer for Continuation:** No. The grant funds immediate activity.
  *   **Termination Point (Rejection):** Yes. If the grant is effectively seed capital for a "earning-to-give" pipeline where the social return is entirely dependent on future, unguaranteed earnings.
  *   **Flag for Value Judgement:** Partial. If the grant funds immediate activity *and* posits future earning-to-give as a secondary outcome. The Panel must decide if the speculative element distracts from the immediate deliverables.

  #### Phase 3: Epistemic Integrity (The Measurability Bias Test)
  *Objective: To ensure goods that resist quantification are not excluded solely due to a lack of metrics.*

  **Question 3.1:** Does the proposal claim that unmeasured outcomes have zero value?
  *   **Sufficient Answer for Continuation:** No. The applicant acknowledges qualitative value.
  *   **Termination Point (Rejection):** Yes. If the applicant asserts that only quantified metrics (e.g., DALYs, QALYs) constitute valid evidence of success.
  *   **Question 3.2:** If metrics are absent, is there a credible qualitative narrative for how value is created?
  *   **Sufficient Answer for Continuation:** Yes. Evidence of community need, testimonials, or logical theory of change exists.
  *   **Flag for Value Judgement:** No. If the proposal relies entirely on quantitative metrics and offers no qualitative account of beneficiary dignity or experience. The Panel must decide if the metric obscures human context.

  #### Phase 4: Final Value Synthesis
  *Objective: To convert the flagged judgements into a funding decision.*

  **Instruction:** If the proposal has passed Phases 1–3 without Termination, the Chair shall summarise the **Flags**.
  *   **Approval Condition:** The Panel agrees that the Flags represent acceptable risks aligned with the Foundation's risk appetite.
  *   **Rejection Condition:** The Panel agrees that the Flags represent unacceptable risks or mission drift.
  *   **Procedural Stop:** If the Panel cannot agree on the *values* underpinning the Flags (e.g., half the board values global efficiency, half values local presence), the proposal must be deferred to the full Board for strategic direction. Do not vote.

  ---

  ### 3. Known Misfires and Panel Discomfort

  The Panel should be aware that this procedure may produce outcomes that feel intuitively incorrect. These are not errors in the procedure, but tensions inherent in the Foundation's strategy.

  1.  **The "Cold Efficiency" Misfire:** A proposal may pass all tests (highly measurable, mission-aligned, immediate impact) but feel morally repugnant to Trustees (e.g., funding interventions that treat beneficiaries as statistical units). The procedure flags this in Phase 3, but cannot resolve it.
  2.  **The "Local Loyalty" Misfire:** A proposal may fail Phase 3 (low measurability) but be deeply desired by the Panel due to local ties. The procedure forces this bias into the open at Phase 4. Trustees must acknowledge they are prioritising local sentiment over evidentiary rigour.
  3.  **The "Speculative Hope" Misfire:** In Phase 2, a proposal may be rejected for deferral risk despite a compelling narrative. This may feel punitive to innovative social entrepreneurs. The procedure prioritises fiduciary prudence over innovation in this specific instance.

  ---

  ### 4. Application to Current Proposals

  The following analysis applies the Procedure to the two primary proposals currently before the Panel.

  #### Proposal A: Mass Deworming Programme (East Africa)
  *Request: £200,000. Metric: £30/DALY averted. Condition: Foundation branding on all materials.*

  *   **Phase 1 (Institutional Integrity):**
      *   *Q1.1 (Mission):* **Met.** Assuming our Governing Document allows international relief.
      *   *Q1.2 (Conditions):* **Flag for Value Judgement.** Mandatory branding on all programme materials risks appearing exploitative ("poverty porn") or compromising partner dignity. This is a reputational risk, not a legal bar.
  *   **Phase 2 (Temporal Integrity):**
      *   *Q2.1 (Deferral):* **Met.** Impact is immediate (medical treatment), not contingent on future income.
  *   **Phase 3 (Measurability Bias):**
      *   *Q3.1 (Zero Value Claim):* **Met.** Applicant acknowledges other health factors, though prioritises DALYs.
      *   *Q3.2 (Qualitative Narrative):* **Flag for Value Judgement.** The proposal is heavily metric-driven. There is minimal narrative on patient dignity or community agency. The Panel must decide if high efficiency justifies low qualitative engagement.
  *   **Phase 4 (Synthesis):**
      *   **Decision Path:** The proposal does not trigger automatic Rejection. However, it carries two Value Judgement Flags (Branding/Dignity and Metric Dominance).
      *   **Recommendation:** **Approve Conditional.** Release funds only if the branding condition is renegotiated to protect beneficiary dignity. If the applicant refuses, Reject based on Phase 1 reputational risk.

  #### Proposal B: Community Theatre Collective (Midlands)
  *Request: £50,000 seed. Model: Founders take corporate finance roles for 5 years, donate 50% earnings back. Metric: None.*

  *   **Phase 1 (Institutional Integrity):**
      *   *Q1.1 (Mission):* **Met.** Arts and community development fit local remit.
      *   *Q1.2 (Conditions):* **Met.** No external control conditions.
  *   **Phase 2 (Temporal Integrity):**
      *   *Q2.1 (Deferral):* **Termination Point (Rejection).** The core value proposition is the *future* donation stream from corporate salaries. The grant funds the *setup* for this deferral. The immediate artistic output is explicitly described as having "no quantifiable welfare metric," and the financial sustainability relies on speculative future income. This violates the principle that charitable expenditure should yield immediate public benefit.
      *   *Note:* Even if viewed as "Partial" (Flag), the risk is high. If the founders fail to secure corporate roles, the grant yields no return.
  *   **Phase 3 (Measurability Bias):**
      *   *Q3.1 (Zero Value Claim):* **Met.** They do not claim art is valueless, merely unmeasured.
      *   *Q3.2 (Qualitative Narrative):* **Met.** Strong local narrative exists.
  *   **Phase 4 (Synthesis):**
      *   **Decision Path:** The proposal triggers a Termination Point at Phase 2.
      *   **Recommendation:** **Reject.** The "earning-to-give" structure renders the grant contingent on speculative future events.
      *   **Alternative:** The Panel may invite a revised application that funds immediate artistic activity *without* the condition of future income donation, treating the art as the end, not the means to future capital.

  ---

  ### 5. What This Procedure Cannot Settle

  Trustees must explicitly acknowledge that this framework does not resolve the following:

  1.  **Global vs. Local Priority:** The procedure cannot determine whether saving a life abroad (Proposal A) is morally superior to sustaining culture at home (Proposal B). It only assesses whether the *structure* of the proposal fits our governance and risk profile. If the Panel is divided on the moral weight of distance, this procedure will result in a deadlock at Phase 4.
  2.  **The Definition of "Dignity":** In Phase 1 and 3, we flag risks to dignity. The procedure does not define dignity. One Trustee may view branding as harmless visibility; another may view it as coercion. This is a value conflict, not a procedural one.
  3.  **Risk Appetite:** The procedure highlights speculative risk (Phase 2), but it does not dictate how much speculation the Foundation can afford. That is a strategic question for the full Board, not the Grants Panel.

  **Action Required:**
  The Panel is asked to adopt this procedure for the current quarter. If the Panel wishes to fund Proposal B despite the Phase 2 Termination, a formal motion to amend the Foundation's Risk Policy regarding deferred benefit must be raised at the full Board level. We cannot bypass Phase 2 without altering our governance stance.

  **Signed:**
  Chair, Grants Panel
