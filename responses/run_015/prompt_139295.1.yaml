      *   In acausal logic, Blackmail *is* a negative Newcomb problem.
      *   Box A (Pay) vs Box B (Don't).
      *   Newcomb: Predictor puts $1M if you 1-box. You want to 1-box.
      *   Blackmail: Predictor punishes if you Don't Pay. You want to Don't Pay.
      *   If the theory says "Follow the correlation," you pay in both.
      *   If the theory says "Ignore the correlation," you lose in both.
      *   To distinguish them, you need a causal hook (e.g., "Did they *create* the dependency to harm you?"). But in acausal settings, the dependency exists logically regardless of intent.
      *   *Conclusion:* D1 and D2 are likely jointly unsatisfiable without an external criterion for "Threat vs. Trade" that isn't available acausally.
