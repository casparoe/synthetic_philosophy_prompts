      *(Refining the Impossibility):* The core impossibility is distinguishing acausal trade from acausal blackmail without causal history. If the correlation is identical, the decision rule must be identical. Therefore, you cannot one-box in Newcomb and refuse Blackmail if both rely solely on logical correlation.

      *(Refining the Copy/Prediction):* Does a simulation suffer? Does a prediction have utility? The theory needs to say if "being a simulation" grants moral status or strategic leverage different from "being a prediction."

