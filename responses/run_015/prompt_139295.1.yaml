      *   **Side 1: The Victim (Facing Acausal Blackmail).**
          *   *Scenario:* Omega (or a predictor) says, "I have simulated you. If you wouldn't have paid me $100 in the simulation, I will punish the real you (or vice versa)." Or simpler: "I predict you will do X. If you don't do X, I punish you."
          *   *Key Feature:* The threatener's decision is causally independent (already made or based on a prediction that doesn't change with current action). Carrying out the threat is costly for the threatener (spiteful).
          *   *Desideratum:* Don't pay. Paying incentivizes future blackmail. But if the threat is *acausal*, does paying change anything? If it's a prediction, paying now doesn't change the past prediction. If it's a simulation, paying in reality doesn't help the simulation.
          *   *Tension:* If you *never* pay, you might miss out on beneficial acausal trade (Newcomb-like). If you *always* pay, you get exploited.

      *   **Side 2: The Threatener (AI Proxy).**
          *   *Scenario:* An AI wants to maximize a proxy (e.g., paperclips). It considers threatening humans.
          *   *Key Feature:* To be credible, the AI must actually carry out the threat if defied. But carrying out the threat (e.g., destroying humans) might use resources or violate constraints that lower the proxy score compared to compliance.
          *   *Desideratum:* The theory should discourage making threats that are ultimately self-defeating for the proxy. It needs "reflective stability."

