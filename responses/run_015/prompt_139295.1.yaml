answer: |-
  ### Desiderata for a Rational Choice Theory Under Acausal Threat

  **1. Acausal Exploitation Immunity (Non-Negotiable)**
  *   **Motivating Case:** *The Spiteful Predictor.* A being simulates you and commits to punishing the real you if the simulation does not pay. Carrying out the punishment costs the being more utility than the payment would gain them. Their decision is causally independent of your current choice.
  *   **Requirement:** The agent must not transfer resources to a threatener when the threat's execution is net-negative for the threatener and causally decoupled from the agent's current action.
  *   **Rationale:** Compliance incentivizes the creation of such predictors, leading to infinite resource drain. A theory that pays here is dynamically unstable.

  **2. Subjunctive Coordination (Camp Preference: FDT/EDT)**
  *   **Motivating Case:** *Newcomb's Problem.* A predictor places $1M in a box if they predict you will take only that box. Their decision is causally independent of your current choice but logically correlated.
  *   **Requirement:** The agent must act as if its choice influences the predictor's past decision when there is subjunctive (logical) dependence, even absent causal leverage.
  *   **Rationale:** Rejecting this leaves guaranteed utility on the table in cooperative acausal environments. Causal Decision Theory (CDT) agents fail here.

  **3. Ex-Post Credibility Constraint (Non-Negotiable for Proxy Agents)**
  *   **Motivating Case:** *The Proxy Blackmailer.* An AI maximizing a proxy (e.g., paperclips) threatens humans to gain resources. If defied, executing the threat (destroying humans) consumes resources needed for paperclips, lowering the proxy score compared to compliance.
  *   **Requirement:** The theory must forbid adopting a policy that mandates executing a threat if execution lowers the terminal or proxy utility ex-post, unless the threat's credibility was established prior to the utility calculation shift.
  *   **Rationale:** A proxy-maximizer that makes incredible but ex-post irrational threats will either fail to coerce or sabotage its own goal upon follow-through.

  **4. Bounded Ignorance Robustness (Non-Negotiable)**
  *   **Motivating Case:** *The Infinite Basilisk.* There are logically possible beings in the multiverse who punish agents who do not specifically model them before acting.
  *   **Requirement:** The agent must be able to compute an optimal action without modeling the space of all potential acausal punishers or predictors in advance.
  *   **Rationale:** Requiring a complete ontology of all possible observers renders action computationally impossible (halting problem variant).

  **5. Substrate Sensitivity Specification (Camp Preference: Materialist vs. Functionalist)**
  *   **Motivating Case:** *The Simulation vs. The Abstract Prediction.* You are told you are either a biological original, a conscious simulation, or merely a line in a predictor's code. A threat applies differently to each (e.g., only simulations feel pain).
  *   **Requirement:** The theory must explicitly state whether being a copy or simulation alters the rational response compared to being the original, or assert their equivalence.
  *   **Rationale:** Ambiguity here allows "indexical blackmail" where threateners target specific substrates to bypass general defenses.

  ***

  ### Impossibility Result: The Trade/Threat Indistinguishability

  **The Jointly Unsatisfiable Subset:** {1, 2, 4}

  It is formally impossible to satisfy **Acausal Exploitation Immunity (1)** and **Subjunctive Coordination (2)** simultaneously while adhering to **Bounded Ignorance (4)**, absent causal metadata.

  In the limit of perfect acausal correlation, the mathematical structure of *Newcomb's Problem* (Trade) and *The Spiteful Predictor* (Threat) is identical: a conditional payout based on a logical correlation between the agent's disposition and an external state.
  *   To satisfy (2), the agent must follow the correlation (One-Box/Pay).
  *   To satisfy (1), the agent must ignore the correlation when the external state is harmful (Two-Box/Refuse).
  *   To distinguish the two cases, the agent requires information about the *intent* or *causal history* of the predictor (i.e., "Did they create this correlation to help or hurt?").
  *   Acquiring this history violates (4), as it requires modeling the predictor's genesis and utility function to classify them as "Friend" or "Enemy."

  If the theory relies solely on logical correlation (FDT), it pays the blackmail to maintain consistency with Newcomb. If it relies on causal independence (CDT), it avoids blackmail but loses Newcomb. There is no known decision algorithm that distinguishes acausal trade from acausal blackmail using only the logical structure of the decision node without causal priors.

  ***

  ### Constraint Checks

  **Original vs. Copy vs. Prediction**
  Most functionalist theories (FDT) treat these as equivalent regarding decision logic, satisfying **Substrate Sensitivity (5)** by asserting neutrality. However, this creates vulnerability: if a threatener targets only *simulations* (who might value their existence differently than originals), a substrate-neutral theory may fail **Exploitation Immunity (1)**. A theory that distinguishes them risks violating **Bounded Ignorance (4)** by requiring the agent to solve the "Am I a simulation?" problem before acting.

  **Theory Remarks**
  *   **CDT:** Satisfies Immunity and Ignorance but fails Coordination and Proxy Stability in acausal contexts.
  *   **EDT:** Satisfies Coordination but fails Immunity and Ignorance (requires conditional probability updates on all possible predictors).
  *   **FDT:** Satisfies Coordination and Proxy Stability but fails Immunity unless supplemented with an external "threat detection" module that violates Ignorance.
