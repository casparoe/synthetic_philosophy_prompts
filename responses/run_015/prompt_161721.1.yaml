answer: |-
  To the Finance Committee of the Board of Trustees

  The Committee on Socially Responsible Investment recommends that the university retain its holdings in the two targeted livestock and meat-processing firms within our separately managed accounts for a period of twenty-four months, subject to an intensive engagement protocol tied to specific environmental and welfare metrics, while simultaneously committing University Dining Services to a measurable reduction in beef and poultry procurement over the same period. We propose that divestment shall become mandatory should either firm fail to adopt Science Based Targets for Scope 3 emissions or implement third-party audited animal welfare standards by the end of this academic biennium. Regarding the roughly sixty percent of the endowment held in commingled index vehicles where we lack share-level voting rights, we recommend no immediate action, as forced selling here would incur significant tracking error without granting corresponding leverage. This recommendation seeks to balance the moral urgency expressed by the petitioners with the economic realities articulated by the Chief Investment Officer, acknowledging that our primary leverage lies not in the exit of capital but in the governance rights attached to retained ownership, provided those rights are exercised with a credible threat of withdrawal.

  We must begin by conceding the strength of the Chief Investment Officer's counterfactual-with-replacement argument, which posits that selling our shares does not reduce the firm's capital availability but merely transfers ownership to another party who may be less inclined to press for reform. It is uncontroversial among scholars of collective harm and causal contribution that any individual institution's marginal effect on a public company's cost of capital is generally very small and usually below the threshold at which suppliers respond to price signals. A single divestment transaction does not, in isolation, prevent a specific animal from being reared or a specific hectare of forest from being cleared. However, the moral weight assigned to this causal inefficacy is a live dispute. Some argue that membership in a harmful group generates reasons for action independent of difference-making, while others contend that without a plausible causal pathway to reducing harm, divestment is morally inert. Our recommendation does not silently rely on the contested claim that our sale alone stops harm. Instead, it rests on the less contested premise that retained ownership offers a mechanism for influence that sale forfeits. If it were demonstrated that engagement is equally futile than sales in altering firm behavior, our recommendation would collapse, but current evidence suggests shareholder resolutions and proxy voting can alter corporate risk assessments where mere exit cannot.

  This focus on engagement necessitates a clear escalation ladder. We will direct our external managers in the separately managed accounts to file shareholder resolutions demanding transparency on emissions and welfare, voting against management proposals that fail to align with our standards. The failure condition is explicit: if, after twenty-four months, the firms have not committed to verifiable reductions in greenhouse gas emissions or improved slaughterhouse monitoring, we will divest. This approach attempts to sidestep the replacement objection by maximizing the utility of the seat we hold before vacating it. Regarding the proposal to tilt the portfolio by selling the processor and buying a competing alternative-protein firm, we acknowledge this changes the relative cost of capital between two firms rather than merely removing ourselves from one. While this may signal market preference, it does not fully resolve the petitioners' complaint if the alternative firm also involves animal processing or environmental degradation. Partial ownership of a firm that still causes harm leaves the charge of complicity intact, though perhaps diminished. Therefore, tilting should be viewed as a supplementary tactic within the engagement strategy rather than a substitute for it, as it does not guarantee the outcome the petitioners seek.

  Furthermore, we must address the consumption channel without treating it as a bureaucratic deflection. The university runs dining halls serving several million meals a year, and a multi-year procurement commitment to cut beef and poultry volume is a demand reduction with a lagged but real supply response. It is arguable that this accomplishes more for the outcomes the petitioners care about than any portfolio move, because reducing demand directly impacts the quantity of production required. To suggest otherwise would be to change the subject, but to suggest it is the only thing that matters would be to ignore the university's role as an investor. We resolve this tension by asserting that investment and consumption policies are mutually reinforcing. Divestment without consumption reduction risks the charge of cheap moral self-distancing, where we feel uninvolved while continuing to profit from the industry through our dining contracts. Conversely, consumption reduction without investment action ignores the capital structures that enable the industry. Both must proceed to ensure institutional coherence.

  The strongest losing consideration in this deliberation is the expressive one, namely that divestment's real work is stigmatization, shifting what other institutions and regulators treat as acceptable. There is a live dispute regarding whether institutional symbolic action informs the public or largely consoles the institution. Proponents argue that being a named institution on a public list of divestors has cascade effects that no share-level counterfactual captures, potentially influencing regulation or consumer behavior beyond our immediate footprint. Critics rejoinder that this is purely symbolic, allowing us to claim moral purity without effecting material change. Our recommendation acknowledges this uncertainty. We are acting on the hypothesis that symbolic action has instrumental value when coupled with material engagement, but we admit that if the symbolic value proves purely consolatory, the moral justification for retaining holdings weakens considerably. We are willing to bear this epistemic risk because the engagement pathway offers a non-symbolic channel for influence that pure divestment closes.

  Finally, our governing documents constrain us to weigh material social injury, but the recommendation must be one the finance committee can execute and defend. A mandate to divest from index funds would violate our fiduciary duty to maintain market exposure without excessive cost, whereas directing proxy votes in separately managed accounts is within existing operational capabilities. The consumption reduction target is within the authority of dining services and does not require endowment liquidation. By tying divestment to specific failures in engagement, we create a defensible trigger that aligns with our fiduciary obligation to act on material social injury only when reasonable efforts to mitigate that injury have failed. This ensures that if we do divest, it is because the firms have proven recalcitrant to reform, not merely because they exist. We ask the Finance Committee to approve this phased approach, recognizing that it accepts the CIO's economic critique while refusing to accept moral passivity as the only rational response to it.
