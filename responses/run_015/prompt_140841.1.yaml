prompt: |-
  Me and two other parents judge the projects at our regional middle-and-high-school science fair every spring, and I also help moderate a neighbourhood Facebook group where people are constantly posting health and wellness claims, so I end up doing the same thing over and over: deciding whether something somebody is very confident about is actually the kind of claim that evidence could ever touch, or whether it only looks like it is. I got nerd-sniped into reading about Popper and falsificationism online a few months ago and honestly it's made things worse rather than better — I now catch myself wanting to fail half the kids' projects for being untestable, and at the same time some of the woo in the Facebook group seems to survive the "what would prove you wrong?" question just fine, because the poster will cheerfully name some result and then quietly explain it away when it happens. So I've been messing around with a few rules of my own and I want someone to tell me which of them are worth keeping and then build the actual procedure around them. The first is what I call the Tuesday test: keep "nobody could ever test this, even in principle" strictly separate from "this particular twelve-year-old can't test it before Sunday with the equipment in her garage," because those feel like totally different problems to me and I keep conflating them. The second is the pre-mortem: before anyone runs the experiment, make them write down in advance which outcome would make them abandon the claim, and then check whether that written-down outcome is one they'd actually accept or one they'd reinterpret. The third is rubber claims — my name for claims that stretch to absorb whatever happens, where the giveaway is that after the result is in you still can't say what would have counted against them; I think the right test for a rubber claim is whether the person can describe a result that would lower their confidence by a specific amount rather than just "make me think about it more." I've also read somewhere that any test actually checks a whole bundle of assumptions at once rather than one idea on its own, which worries me because it seems like it would let anybody wriggle out of anything by blaming their equipment, and I don't know how to fold that in without making the whole thing useless.

  What I need is a procedure, not an essay. Something the three of us can run in about ten minutes per project, written in plain language with no philosophy jargon in the final checklist (I can translate, but the other two judges won't read anything with the word "epistemology" in it), with the questions in the order we should ask them, what counts as a good enough answer to each, the point where you just stop and say no, and the point where you hand it to a human because it's a values call and not a facts call. It has to end in a verdict we can defend to a parent who complains to the school board, and — this matters — it needs a repair step, because with twelve-year-olds we can't just say "your topic isn't science"; we need to be able to say "not testable as you've written it, but here is the nearest testable version" and still give them most of the marks. Please also be straight about which steps are really judgment calls wearing a procedure costume.

  Then run it on three cases. First: a girl's project where she talks kindly to one set of bean plants and ignores another set, and the talked-to ones come out taller. Second: a post in the Facebook group selling a copper bracelet that rebalances your energy field, where the seller says it obviously doesn't work on people who are skeptical. Third, and this is the one where I want you to be blunt even if it annoys me: I've believed for about fifteen years that my migraines come on ahead of storms, I've half-kept a diary about it, and I really don't want to be told I'm doing pseudoscience — so tell me honestly what your procedure says about my headache theory and what I'd have to do to make it come out the other way. Finally, list the kinds of claims your procedure just can't handle (historical one-off stuff, statistical things, whatever else) so I know when to stop using it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Profile:** A parent judge at a regional middle/high school science fair, moderator of a neighborhood Facebook group. Experienced in evaluating claims but feeling overwhelmed by Popper/falsificationism.
      *   **Problem:** Needs a practical, 10-minute procedure to evaluate scientific claims/projects. Needs to distinguish between "untestable in principle" vs. "untestable by a 12-year-old." Needs to handle "rubber claims" (claims that stretch to fit any evidence). Needs to address the Duhem-Quine problem (testing bundles of assumptions) without letting people off the hook.
      *   **Constraints:**
          *   Procedure, not an essay.
          *   Plain language (no "epistemology," "falsification," etc.).
          *   Order of questions matters.
          *   Clear pass/fail criteria.
          *   "Repair step" (how to fix a project rather than just failing it).
          *   Transparency about judgment calls.
          *   Defensible verdict (for school board complaints).
          *   Run the procedure on three specific cases (Bean plants, Copper bracelet, User's migraine theory).
          *   List limitations of the procedure.
      *   **Tone:** Direct, practical, empathetic but firm (especially on the migraine case).

  2.  **Deconstruct the User's Ideas:**
      *   *The Tuesday Test:* Distinguish "impossible forever" vs. "impossible by Sunday." -> *Keep.* This is about feasibility vs. fundamental testability.
      *   *The Pre-mortem:* Write down the "stop" condition before starting. -> *Keep.* This combats moving the goalposts.
      *   *Rubber Claims:* Can you specify a result that lowers confidence by a specific amount? -> *Keep.* This quantifies falsifiability.
      *   *Bundle of Assumptions (Duhem-Quine):* Worry that people will blame equipment. -> *Address.* Need a rule about "reasonable controls" so they can't blame everything on outside factors.

  3.  **Drafting the Procedure (The "10-Minute Claim Check"):**
      *   *Goal:* 10 minutes, 3 judges, plain English.
      *   *Structure:*
          1.  The Claim (What are you saying?)
          2.  The Break Point (What proves you wrong?)
          3.  The Setup (Can you actually do the test?)
          4.  The Escape Hatches (What could go wrong, and is that a valid excuse?)
          5.  The Verdict & Repair.
      *   *Refining the Questions:*
          *   Q1: What exactly changes if you are right? (Specifics)
          *   Q2: What result would make you say "I was wrong"? (Pre-mortem/Rubber test)
          *   Q3: Can you measure that result with what you have? (Tuesday Test)
          *   Q4: If the test fails, what's the *one* main reason you'd accept, vs. excuses? (Bundle of assumptions)
      *   *Scoring:* Pass, Repair, Fail.
      *   *Judgment Call Transparency:* Explicitly state where human discretion is needed.

  4.  **Running the Procedure on the Cases:**

      *   *Case 1: Talking to Beans.*
          *   Claim: Talking makes them grow taller.
          *   Break Point: If talked-to plants are shorter or same height.
          *   Setup: Doable by Sunday.
          *   Escape Hatches: "I didn't talk nice enough." (Needs control).
          *   Verdict: Pass with Repair (needs better controls/randomization).
          *   *Science Fair Context:* Classic project. Often flawed methodology, but testable claim.

      *   *Case 2: Copper Bracelet (Facebook).*
          *   Claim: Rebalances energy field.
          *   Break Point: Seller says "doesn't work on skeptics."
          *   Setup: Unmeasurable "energy field."
          *   Escape Hatches: "Skepticism blocks it." (Rubber claim).
          *   Verdict: Fail. No repair possible without changing the claim entirely.

      *   *Case 3: User's Migraines.*
          *   *Constraint:* Be blunt. Don't coddle.
          *   Claim: Migraines come ahead of storms.
          *   Break Point: User has a diary but "half-kept."
          *   Setup: Retrospective analysis is hard (confirmation bias).
          *   Escape Hatches: "I missed a storm," "It was a small storm."
          *   Verdict: Currently Pseudoscience/Anecdote. To be Science: Needs prospective logging, defined "storm" metrics (pressure drop), blind analysis.
          *   *Empathy:* Acknowledge the pain is real, the *cause* is unproven.

  5.  **Addressing the "Bundle of Assumptions" (Duhem-Quine):**
      *   How to stop them blaming equipment?
      *   Rule: "The Control Check." If the equipment can't measure a known standard, *then* blame equipment. Otherwise, the result stands.

  6.  **Limitations of the Procedure:**
      *   Historical singularities (dinosaurs, origins of universe).
      *   Complex statistical correlations (climate, economics).
      *   Existential/Values claims (morality, art).
      *   Emerging science (where mechanisms are unknown but effects are observed).

  7.  **Review and Refine:**
      *   *Check Constraints:* Is it under 10 mins? Yes, 5 questions. No jargon? Yes. Repair step included? Yes. Judgment calls highlighted? Yes.
      *   *Tone Check:* Is the migraine section blunt but fair? (Crucial).
      *   *Formatting:* Use bolding, lists, and clear headers for readability.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Repair" step is actionable for a 12-year-old. "Change your hypothesis" is too vague. "Measure this instead" is better.
      *   *Correction:* Ensure the Facebook case distinguishes between "science fair" and "community moderation." The procedure should work for both contexts as requested.
      *   *Correction:* On the migraine case, ensure I don't diagnose, just evaluate the *claim structure*.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the **10-Minute Claim Check**. It is designed for three judges, a clipboard, and a student (or a Facebook post printout). It uses your "Tuesday Test," "Pre-mortem," and "Rubber Claim" ideas, folded into a linear workflow.

  ### The 10-Minute Claim Check

  **Instructions:** Read the project summary/post. Ask the student/author these five questions in order. If they fail a step, stop and move to the **Verdict & Repair** section.

  **1. The "What Changes?" Question**
  *   **Ask:** "If you are right, what specific thing will we see, hear, or measure that we wouldn't see if you were wrong?"
  *   **Good Answer:** "The plants will be 2cm taller," or "The pressure gauge will drop below 990 hPa."
  *   **Bad Answer:** "The vibes will be better," or "You'll just know," or "It depends on the person."
  *   **Stop Rule:** If they cannot name a specific physical change, **STOP**. Verdict: **Not a Testable Claim.**

  **2. The "Stop Loss" Question (The Pre-mortem)**
  *   **Ask:** "Imagine you run the experiment and get the opposite result. What exact number or outcome would make you say, 'Okay, my idea was wrong'?"
  *   **Good Answer:** "If the plants are the same height," or "If the pain score doesn't drop by at least 2 points."
  *   **Bad Answer:** "I'd have to think about it," or "It might still work if..."
  *   **Stop Rule:** If they cannot name a result that would prove them wrong, **STOP**. Verdict: **Rubber Claim.**

  **3. The "Tuesday" Question (Feasibility)**
  *   **Ask:** "Can you measure that specific outcome with the tools you have before the deadline?"
  *   **Good Answer:** "Yes, I have a ruler and 5 days."
  *   **Bad Answer:** "I need an electron microscope," or "I need to wait 10 years for more data."
  *   **Stop Rule:** If the answer is No, **STOP**. Verdict: **Untestable Right Now.** (This is the "Tuesday Test" split).

  **4. The "Broken Ruler" Question (Handling Assumptions)**
  *   **Ask:** "If the test fails, what is the one equipment error that would excuse you? How do we know that error didn't happen?"
  *   **Good Answer:** "If the scale reads 0 when empty. I checked it this morning."
  *   **Bad Answer:** "Maybe the energy was blocked," or "Maybe the plants were sad," or "The instrument isn't sensitive enough" (without proof).
  *   **Stop Rule:** If their excuse is invisible or uncheckable, **STOP**. Verdict: **Unfalsifiable Excuse.**

  **5. The "Control" Question**
  *   **Ask:** "What are you comparing this against to make sure it wasn't just luck or normal growth?"
  *   **Good Answer:** "A group of plants I didn't talk to," or "Days when there was no storm."
  *   **Bad Answer:** "I just compared it to last year," or "I know how I usually feel."
  *   **Stop Rule:** If there is no comparison group, **STOP**. Verdict: **Anecdote, Not Data.**

  ---

  ### Verdict & Repair Menu

  **If they passed all 5:**
  *   **Verdict:** **PASS.** (Science).
  *   **Note:** Check their data collection for honesty, but the logic holds.

  **If they failed Step 1 or 2 (The Claim is vague or rubber):**
  *   **Verdict:** **FAIL (Fundamental).**
  *   **Repair:** "You cannot test 'energy' or 'kindness' directly. You must test a physical effect *caused* by them. Change your claim to measure [Sound Waves] or [Plant Height] only. Remove the 'why' and test the 'what'."
  *   *Note:* If they refuse to remove the invisible cause, it remains a fail.

  **If they failed Step 3 (The Tuesday Test):**
  *   **Verdict:** **FAIL (Logistics).**
  *   **Repair:** "The idea is scientific, but the scope is too big. Shrink the experiment. Instead of 'cures migraines,' test 'reduces pain for 1 hour.' Instead of 'climate change,' test 'local temperature variance'."

  **If they failed Step 4 or 5 (The Excuse or Control):**
  *   **Verdict:** **FAIL (Methodology).**
  *   **Repair:** "Your test is valid, but your setup is leaky. Add a control group. Calibrate your tool. Write down the 'broken ruler' check before you start."
  *   *Marks:* Give full marks for Hypothesis, deduct marks for Method.

  ---

  ### Where the Judges Are Guessing (Transparency Clause)
  *   **Step 4 (Broken Ruler):** Judges must decide if an excuse is "reasonable." (e.g., "The sensor drifted" is reasonable if sensors usually drift. "The ghosts interfered" is not). This is a judgment call.
  *   **Step 2 (Stop Loss):** Judges must decide if the "wrong" outcome is specific enough. (e.g., "A little shorter" is vague. "2cm shorter" is specific). This is a judgment call.
  *   **Values vs. Facts:** If a claim is about morality, beauty, or policy (e.g., "We *should* ban plastic"), this procedure does not apply. Hand off to Humanities judges.

  ---

  ### Case Run-Throughs

  #### Case 1: The Talking Bean Plants
  *   **Step 1 (What Changes?):** Height in cm. **(Pass)**
  *   **Step 2 (Stop Loss):** "If talked-to plants are not taller." **(Pass)**
  *   **Step 3 (Tuesday):** Ruler and beans are available. **(Pass)**
  *   **Step 4 (Broken Ruler):** Excuse: "I didn't talk nicely enough." **(Fail)**. This is invisible.
  *   **Step 5 (Control):** "I ignored the other set." **(Pass, but weak)**.
  *   **Verdict:** **FAIL (Methodology).**
  *   **Repair:** "You cannot measure 'nicely.' You must standardize the input. Read the same book for 10 minutes a day. Also, you need more plants to rule out luck. Swap 'Talking' for 'Sound Exposure.' If you make those changes, you can get 90% of the marks."
  *   **Defense:** "We didn't fail the science; we failed the measurement of the variable. The repair makes it measurable."

  #### Case 2: The Copper Bracelet (Facebook)
  *   **Step 1 (What Changes?):** "Rebalances energy field." **(Fail)**. No meter for "energy field" defined.
  *   **Step 2 (Stop Loss):** "Doesn't work on skeptics." **(Fail)**. This makes the result depend on the observer's mind, not the bracelet.
  *   **Verdict:** **FAIL (Fundamental).**
  *   **Repair:** None. To test this, you must define "energy" physically (heat, electricity, magnetism). If the seller says "It's spiritual energy," the claim is removed from science.
  *   **Action:** Remove post or tag as "Unverified Claim." Do not allow "Skepticism blocks it" as a defense; that immunizes the claim from evidence.

  #### Case 3: Your Migraine Theory (The Blunt Truth)
  *   **Step 1 (What Changes?):** "Migraine starts." "Storm happens." **(Pass)**.
  *   **Step 2 (Stop Loss):** You "half-kept" a diary. **(Fail)**. You likely recorded the hits and ignored the misses (confirmation bias). You haven't defined what counts as a "storm" (rain? pressure drop? wind?).
  *   **Step 3 (Tuesday):** You have 15 years of data, but it's retrospective. **(Fail)**. Retrospective data is unreliable because your memory selects for patterns.
  *   **Step 4 (Broken Ruler):** Excuse: "I missed writing it down," or "It was a small storm." **(Fail)**. These are unfalsifiable excuses.
  *   **Step 5 (Control):** You compared it to... your memory? **(Fail)**.
  *   **Verdict:** **FAIL (Currently Pseudoscience).**
  *   **Why:** You are doing *pattern matching* on incomplete data, not testing. You feel the correlation is real, and it might be, but your current method cannot distinguish "real cause" from "I notice storms more when I'm in pain."
  *   **Repair (How to make it Science):**
      1.  **Define the Storm:** Download local barometric pressure history. Define "Storm" as "Pressure drop of X hPa within Y hours." No feelings, just numbers.
      2.  **Blind the Data:** Print the pressure chart and your headache diary on separate sheets. Have a third person overlay them to see if they match. Do not look at them together yourself.
      3.  **Count the Misses:** You must count the storms where you *didn't* get a headache, and the headaches where there *wasn't* a storm.
      4.  **Prospective Test:** For the next 6 months, log every headache and every pressure drop in real-time.
  *   **The Hard Truth:** If you do this and the correlation disappears, you must accept the theory was wrong. If you cannot accept that outcome, you are not doing science; you are seeking validation. The pain is real, but the cause may be internal, not atmospheric.

  ---

  ### Limitations: When to Put the Checklist Away

  Do not use this procedure for:

  1.  **Historical Singularities:** "Did this dinosaur eat meat?" You cannot run a Tuesday test on the past. Use evidence consistency instead.
  2.  **Complex Systems/Statistics:** "Does smoking cause cancer?" One person smoking and not getting cancer doesn't fail the test. This procedure works for *direct* causation, not probabilistic risk factors.
  3.  **Emergent Mechanisms:** "This drug works, we don't know why." Step 1 might fail if the mechanism is unknown, but the effect is measurable. In this case, skip the "Why" and focus entirely on Step 3 and 5 (Measurement and Control).
  4.  **Values and Policy:** "Should we build the dam?" Science can tell you if the dam will hold, not if it *should* be built.
  5.  **Personal Experience:** "This meditation makes me feel calm." This is true for you by definition. It becomes science only when you claim "It makes *people* calm," which requires Step 5 (Controls).

  **Final Note for the Judges:**
  If a parent complains, point to **Step 2 (Stop Loss)**. Say: *"Science isn't about being right. It's about agreeing on what would prove you wrong. Your child didn't tell us what would prove them wrong. Once they do that, they can win."* This frames the failure as a missing rule, not a lack of intelligence.
