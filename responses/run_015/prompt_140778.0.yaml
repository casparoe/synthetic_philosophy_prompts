  **TO:** Ethics Committee
  **FROM:** [Your Name], Non-Clinician Member
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendations Regarding PGT Selection and Consent Language

  This memo addresses the stalemate regarding Preimplantation Genetic Testing (PGT) for late-onset conditions and the related request from a deaf couple to select for impairment. The complainant in Case 1 argues that our consent process relies on a false comparison: we claim to spare a child suffering, but selection determines *which* child exists. Therefore, the resulting child is not benefited compared to their alternative (non-existence). Case 2 exposes the symmetry: if selection does not benefit the child, does prohibiting selection for deafness rely on inconsistent logic?

  We must decide whether to halt testing, continue unchanged, or continue with modified consent and policy constraints. I recommend continuing PGT for late-onset conditions under specified counseling conditions, and denying the deaf couple's request.

  **The Status Quo Defense**
  Before altering policy, we must acknowledge the strength of the current position. Committee members opposing changes argue that metaphysical precision regarding identity should not paralyze clinical practice. Their view is that preventing suffering is a tangible good, regardless of whether the specific resulting individual is "better off" than they would have been otherwise. Parents seek to avoid the burden of caring for a child with a degenerative condition and to spare the child pain. Even if the logical challenge holds, the practical outcome—a world with less suffering—is morally preferable. 

  Furthermore, demanding rigorous philosophical consistency in consent forms may confuse patients without improving autonomy. On this view, our current language ("spare your child") is a shorthand for parental intent, not a literal claim about comparative welfare. Halting testing or altering consent based on this argument risks signaling to patients that their moral intuition—that they are preventing illness—is invalid, potentially undermining trust in the counseling process without yielding tangible clinical benefits.

  **Why Change is Necessary**
  However, the complainant's argument reveals a vulnerability in our consent process. If we justify selection solely on benefit to the resulting child, we invite the exact confusion Case 1 presents. More critically, if "harm to the child" is not the metric (since the child cannot claim harm compared to non-existence), we lack a coherent principle to deny the deaf couple's request in Case 2. We cannot claim selecting *against* deafness helps the child while selecting *for* it harms them, if the child's existence depends on the selection.

  To resolve this, we must shift our ethical justification from "benefit to the resulting child" to "parental reproductive liberty constrained by clinical welfare standards." We assist parents in selecting embryos, but the clinic retains gatekeeping authority to ensure selections align with medical welfare goals. This allows us to permit selecting against late-onset disease (promoting health) while prohibiting selecting for deafness (contradicting health), without relying on the shaky logic of comparative benefit to the child.

  **Recommendations**

  1.  **Continue PGT for Late-Onset Conditions:** We will not stop offering testing. The goal is to support families in avoiding significant health burdens, consistent with our medical mission.
  2.  **Deny Request to Select for Deafness:** The deaf couple's request is denied. While the identity argument suggests the child is not harmed, the clinic's mandate is to promote health. Deliberately selecting for a disability contradicts the fundamental medical purpose of the clinic, regardless of the parents' cultural valuation of deafness.
  3.  **Revise Consent and Counseling Language:** We will adopt the "ban on comparative phrasing." Counselors must not say "spare your child." Instead, they must frame this as choosing which embryo to transfer. We reject the "counterfactual embryo note" as administratively burdensome and potentially distressing to patients. The "substitution test" is adopted conceptually: counselors must ensure patients understand they are choosing between potential children, not modifying a specific future child.
  4.  **Timeline:** Revised consent forms and counseling scripts to be drafted by Legal and Counseling leads within 30 days. Implementation by next quarter.

  **Proposed Consent Language**
  Replace current comparative clauses with the following:

  *"I understand that Preimplantation Genetic Testing involves selecting an embryo for transfer based on genetic characteristics. I acknowledge that transferring an embryo without the variant will result in the birth of a child who would not otherwise exist, rather than preventing disease in a specific future child. My decision to select an embryo without the variant is based on my desire to bring into existence a child without this genetic condition, understanding that this choice determines which child I will parent."*

  **Conclusion**
  This approach respects the complainant's logical challenge without halting care. It clarifies that our policy rests on promoting health welfare rather than metaphysical benefit to the child, providing a consistent basis to deny selection for impairment while continuing to support families avoiding late-onset disease.

  Please review prior to next month's meeting.
