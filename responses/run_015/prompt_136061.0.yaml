  # JOINT STATEMENT ON THE SOCIALIST CALCULATION DEBATE
  **Participants:** The Computational Planning Proponent (CPP) and The Market Process Critic (MPC)
  **Date:** October 24, 2023
  **Subject:** Conclusions of Adversarial Collaboration on Economic Calculation under Socialism

  ## I. AGREED CLAIMS

  Both signatories affirm the following propositions as the baseline for continued discourse:

  1.  **On General Equilibrium Theory:** Both parties agree that Arrow-Debreu-McKenzie general equilibrium theory demonstrates the *logical possibility* of a coherent set of prices under strict axiomatic conditions, but establishes neither the *computational feasibility* of finding those prices nor the *institutional stability* required to maintain them. Existence proofs are not implementation manuals.
  2.  **On the Simulator's Requirements:** Both parties agree that the Contemporary Langean Model (CLM) relies on a central simulator that requires three distinct classes of input: (a) a technological matrix (input-output coefficients), (b) a preference map (social welfare function or aggregated utility), and (c) a discovery mechanism for new goods and techniques. Both agree that if any of these inputs are systematically distorted or unavailable, the output price vector will not clear markets in reality, regardless of mathematical consistency.
  3.  **On the Source of Inputs:** Both parties agree that the technological matrix and preference map cannot be static. They must be updated continuously. The dispute is not over whether data is needed, but over *how that data is generated* and *whether it can be digitized* without loss of essential economic content.
  4.  **On Historical Evidence:** Both parties agree that the historical failure of 20th-century command economies does not definitively settle the theoretical debate. The MPC attributes these failures to the absence of genuine capital prices and entrepreneurial rivalry. The CPP attributes them to computational limitations and bureaucratic rigidity that the CLM (with AI-driven simulation and internal futures markets) is designed to overcome. Conversely, neither side claims that the mere survival of a mixed economy proves the superiority of pure laissez-faire.
  5.  **On the Internal Futures Market:** Both parties acknowledge that the CLM's provision for an internal futures market—where contracts on productive projects pay off in claims on consumption goods rather than transferable capital title—is a substantive institutional innovation. It is not merely a semantic relabeling of profit, but an attempt to decouple *allocation signals* from *private ownership rights*.

  ## II. RESIDUAL DISAGREEMENTS

  The following table outlines the substantive divergences that remain after collaboration.

  | Disagreement ID | Domain | The Market Process Critic (MPC) Position | The Computational Planning Proponent (CPP) Position |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Monetary Calculation** | Without transferable private title to the means of production, "prices" for capital goods are shadow values, not exchange ratios. They cannot perform the *loss-cutting* function required to liquidate malinvestments in multi-period plans. | Transferable title is not required for rational allocation. If the futures market allows projects to compete for resources based on predicted consumption yield, the resulting prices function as genuine scarcity indices regardless of who holds the title. |
  | **D2** | **Knowledge Generation** | Relevant knowledge is not merely dispersed but *endogenous* to the competitive process. Rivalry generates new data (techniques, preferences) that does not exist prior to the market test. A simulator can only process exogenous data. | Knowledge can be treated as a stochastic variable. The simulator, coupled with decentralized experimentation by firm managers, can model the *probability distribution* of discoveries without requiring the waste of duplicate competitive rivalry. |
  | **D3** | **Incentive Compatibility** | Managers trading in futures contracts payable in consumption goods lack the "skin in the game" associated with capital loss. They face asymmetric risk (reward if right, no personal capital loss if wrong). | Incentives can be aligned through reputation mechanisms, career consequences, and consumption bonuses calibrated to outperform the simulator's baseline. Personal capital risk is not necessary for professional diligence. |

  ## III. CRUXES, CASES, AND PREDICTIONS

  For each residual disagreement, we identify the underlying crux, a concrete thought experiment to test it, and our pre-committed predictions.

  ### Disagreement D1: Monetary Calculation & Capital Liquidation
  *   **The Crux:** Is the function of price primarily *informational* (indicating scarcity) or *institutional* (enforcing responsibility for asset transfer)? Can a system enforce the liquidation of a failing long-term capital project without an owner who suffers a net worth decline?
  *   **Concrete Case:** **The "Stranded Asset" Scenario.** A massive investment project (e.g., a hydrogen infrastructure network) is 50% complete. New data suggests a competing technology (e.g., solid-state battery transport) will render it obsolete upon completion.
  *   **MPC Prediction:** The Planning Board will hesitate to cancel the project because the "loss" is abstract (socialized) rather than concrete (private bankruptcy). The futures prices will lag reality because no individual has the authority to arbitrage the discrepancy by shorting the project and buying the competitor.
  *   **CPP Prediction:** The simulator will update the probability of the competing technology's success. The futures contracts for the hydrogen project will plummet in value (in terms of consumption claims). Rational managers, seeking to maximize their performance bonuses tied to project valuation, will voluntarily halt construction to reallocate resources to higher-yield sectors.

  ### Disagreement D2: Knowledge Generation & Rivalry
  *   **The Crux:** Is entrepreneurial knowledge *discovered* (found in the environment) or *created* (forged through the act of competition)? Can a central model simulate the *creation* of knowledge that relies on the secrecy and rivalry of competitors?
  *   **Concrete Case:** **The "Black Box Innovation" Scenario.** A local firm manager discovers a novel method to reorganize production that reduces costs by 15%. This method relies on tacit team dynamics and cannot be fully codified into the simulator's input parameters immediately.
  *   **MPC Prediction:** The manager will not report the innovation fully or immediately, as doing so reduces their bargaining power within the planning hierarchy. Furthermore, the simulator cannot value the innovation until it is codified, by which time the tacit advantage is lost. Rivalry forces immediate implementation to steal market share; planning encourages hoarding information.
  *   **CPP Prediction:** The system's automated auditing and sensor network will detect the efficiency gain before the manager reports it. The incentive structure rewards the *first* registration of the new method with a large consumption bonus, making hoarding irrational. The simulator treats the innovation as a Bayesian update applicable to all similar firms instantly.

  ## IV. ANALYSIS OF VERBAL DISPUTES AND CLASSIFICATION

  ### 1. The Ambiguity of "Calculation"
  We explicitly acknowledge that a significant portion of our debate stems from divergent definitions of **economic calculation**.
  *   **MPC Usage:** "Calculation" refers to *entrepreneurial judgment* under uncertainty, involving the comparison of heterogeneous capital goods via money prices derived from actual exchange. It is a dynamic, disequilibrium process.
  *   **CPP Usage:** "Calculation" refers to *constrained optimization*, involving the solution of a system of equations (or a learned approximation thereof) to maximize an objective function given constraints. It is a static or comparative-static operation.
  *   **Verdict:** This is **not merely verbal**. While the terminology overlaps, the MPC argues that the CPP's definition omits the essential element of *uncertainty bearing*. If "calculation" implies handling Knightian uncertainty, the CPP's simulator cannot perform it. If "calculation" implies allocating known resources to known ends, the MPC concedes the CPP can do it. The dispute is substantive regarding the nature of the economic data (given vs. created).

  ### 2. Classification of the Futures-Market Variant
  We classify the Contemporary Langean Model's internal futures market (paying off in consumption goods) as follows:

  *   **Response to the Monetary-Calculation Argument (Mises):** The CPP offers this variant **specifically as an answer to Mises**. It attempts to generate a common denominator (consumption claims) for comparing heterogeneous capital projects without requiring private property in the means of production. The MPC remains unconvinced that consumption claims can substitute for capital title in enforcing liquidation.
  *   **Response to the Knowledge Argument (Hayek):** The CPP offers the simulator's learning capacity **as an answer to Hayek**. It claims to aggregate local data faster than a price system can propagate it. The MPC argues this fails to address the *generation* of new knowledge through rivalry.
  *   **The Unnamed Third Problem:** Both parties agree that the futures-market variant is also attempting to solve a problem neither side originally named explicitly: **The Decoupling Problem**. This is the challenge of separating *control rights* (allocation of resources) from *residual claimancy* (ownership of surplus).
      *   The **MPC** argues these rights are inextricably linked; without residual claimancy, control rights are exercised irresponsibly.
      *   The **CPP** argues these rights can be decoupled via contract and simulation, allowing social ownership of surplus with delegated control rights.

  **Signed,**

  _________________________
  *The Market Process Critic*

  _________________________
  *The Computational Planning Proponent*
