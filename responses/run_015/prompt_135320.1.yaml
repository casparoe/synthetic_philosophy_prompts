  **Note on Philosophical Liberties and Contested Interpretations**

  This poem dramatizes the debate between evidentialist purism and pragmatic encroachment regarding the "wrong-kind-of-reasons" (WKR) problem for belief. Several liberties are taken for the sake of form and accessibility. First, the metaphor of belief "walking" a path personifies a doxastic attitude that many philosophers argue is involuntary. Second, the "transparency" of belief (line 2) is rendered as a visual metaphor; while broadly accepted as the thesis that deliberating about *p* involves deliberating about the truth of *p*, its implication that pragmatic reasons are structurally excluded (line 4) is a specific evidentialist interpretation (e.g., Shah & Velleman) rather than a universal consequence of transparency.

  The note distinguishes between broadly settled framework and genuinely contested claims. It is broadly settled within meta-epistemology that there is a meaningful distinction between reasons that engage an attitude's constitutive aim (right-kind) and those that do not (wrong-kind). However, it remains genuinely contested whether belief has exactly one constitutive aim (truth) or multiple aims, and whether practical stakes can constitute genuine normative reasons for belief (as suggested in line 3 and 13) rather than merely causing belief or altering the evidence threshold required for warrant. The poem presents these positions as a stalemate (lines 14–17) to reflect the current lack of consensus in the literature regarding whether pragmatic encroachment successfully refutes the evidentialist constraint on doxastic justification.
