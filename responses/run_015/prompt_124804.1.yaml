answer: |-
  Here is the honest take: *Fight Club* knows the line is blurry because it argues the line doesn't exist. But it absolutely cheats to make that point, and whether that cheat works for your novel depends on what you want to say about inheritance.

  Here is the breakdown of the copycat logic, where it holds, where it breaks, and what it means for your chef and her mother.

  ### The Cheat: Tyler's Body
  You asked if the film cheats by giving Tyler a separate body. Yes, it does. For two-thirds of the movie, it presents the "Original vs. Copy" dynamic as a relationship between two men. This lets the audience off the hook. We can judge Tyler as a separate entity, a bad influence, a guru, or a fascist. It externalizes the internal conflict.

  If this were a literal representation of your chef and her mom, it would be like the mom appearing as a ghost or a hallucination to the chef. That makes it a psychological haunting, not a lineage problem.

  However, the film corrects this cheat in the third act. When the Narrator realizes Tyler is him, the "copycat" accusation collapses. Tyler isn't copying the Narrator, and the Narrator isn't copying Tyler. They are the same concept occupying the same space, fighting for control of the remote.

  **For your novel:** If you treat the chef and mom as separate people fighting over who owns an emotional style, you're playing the "separate body" game. The film suggests the deeper truth is that the chef *is* the mom, in a psychic sense. The anxiety isn't that she's stealing; it's that she can't escape being her mother. The "copy" is actually the "source" code running in the background.

  ### The IKEA Rant: Curated vs. Lived
  The IKEA scene is usually read as anti-consumerism, but through your lens, it's about **pre-fabricated identity**. The Narrator is copycatting a life from a catalog. He thinks buying the chairs makes him a person who owns chairs. He is mimicking the *aesthetic* of a life without the *substance*.

  Your chef might feel she is mimicking the *aesthetic* of her mother's art (the emotional drama, the intensity) without having lived the life that forged it.

  The film argues that you cannot think your way out of this. The Narrator tries to talk his way out (insomnia, doctors) and fails. He has to act. But here is the trap: Tyler's solution (fighting, chaos) eventually becomes its own catalog. The rules of Fight Club get printed on cards. Project Mayhem becomes a uniform.

  **The Logic Hold:** The film correctly identifies that trying to be "authentic" often just becomes another performance. The Space Monkeys are copycatting Tyler's rebellion until rebellion itself is a script.
  **The Logic Collapse:** The film wants us to believe Tyler is "real" and the Narrator is "fake." But if Tyler is a hallucination, his philosophy is just as manufactured as the IKEA catalog. It's just a darker catalog.

  ### The Chemical Burn: Pain as Proof
  This is the crux of your authenticity question. In the chemical burn scene, Tyler forces the Narrator to stop seeking salvation and "stay with the pain."

  This is where the film argues authenticity isn't about *origin*; it's about *sensation*. The Narrator has been copycatting emotions at support groups (crying for people he doesn't know). It's hollow. Tyler forces him to feel something that cannot be faked: acid on the skin.

  **Does this help your chef?** It suggests that if the chef is feeling the *actual heat* of the kitchen, the actual stress of the service, the emotion is real, even if the "move" looks like her mom's. If the mom painted a storm to express rage, and the chef reduces a sauce to express rage, the medium is different, but the chemical burn is the same.

  The film posits that authenticity is verified by suffering, not by novelty. If you didn't bleed for it, you're just copying. If you did bleed, it doesn't matter if someone else did it first.

  ### The Tower Ending: Integration, Not Purity
  The ending is the most important part for your stuck point. The Narrator shoots himself in the cheek to kill Tyler. He does not kill the "copy" and return to being the "pure original." He destroys the distinction.

  He holds Marla's hand while the credit card towers fall. He accepts that he is the monster. He is the chaos.

  **The Verdict on Authenticity:** The film concludes that "authenticity" as a pure, uncorrupted origin story is a myth. The Narrator was never pure. He was always capable of Tyler. Acknowledging that he *is* Tyler is the only way to become whole.

  If your chef tries to scrub her cooking of her mother's influence to be "original," she is lying to herself. She is trying to shoot Tyler without shooting herself. The film suggests the only way forward is to admit: "I am my mother's daughter. This rage is ours. This technique is ours."

  ### Where the Film Fails (and where you can go deeper)
  *Fight Club* is ultimately a romance with masculinity. It resolves the copycat problem by violence. It says: "You become real when you break things." That is a very specific, limited solution.

  For your chef, violence isn't the medium. Nourishment is.
  The film collapses because it can't imagine a way to integrate the self that involves creation rather than destruction. Tyler creates nothing but damage.

  **Your Microdomain:**
  The film argues that the boundary between original and copy is fluid because they are the same person.
  *   **Does the line blur?** Yes, completely.
  *   **Is it the same concept?** The film says yes. It's the same psyche.
  *   **Is authenticity useful?** Only if you redefine it. Authenticity isn't "doing something no one else has done." It's "owning the impulse behind the action."

  If your chef copycats her mom's emotional moves, the film would ask: Is she doing it because she thinks it looks cool (IKEA catalog), or because it's the only way she knows how to process the heat (Chemical Burn)?

  If it's the latter, the film says she's real. The fact that it looks like her mom's work is irrelevant. We are all copycatting human behaviors until we feel them in our own nerves. The film's twist proves that we are all just talking to ourselves anyway. The chef isn't stealing from her mom; she's continuing a conversation the mom started inside her head.

  Don't let her try to kill the "Tyler" part of her cooking. Have her realize she's holding the gun.
