answer: |-
  **Interview Question Sheet: Future Contingents and the Entropic Past**

  **Question 1**
  You grant the medieval distinction between the necessity of the consequence (if *p* is true, it is necessary that *p* is true) and the necessity of the consequent (if *p* is true, then *p* is necessary). If we accept that distinction, does any substantive puzzle remain regarding Aristotle's sea battle, or does the residual problem shift entirely to whether we can assert bivalence—that one of the two contradictory future statements is already true—without a determinate cause?
  *(Jargon presupposed: Necessity of the consequence/consequent; Bivalence.)*
  *   **Audience Flag:** *Bivalence* is the principle that every declarative statement is either true or false, with no middle option.
  *   **Likely Reply:** She will likely argue the puzzle remains because we still need to explain *what makes* the statement true now if the world hasn't settled it.
  *   **Follow-up:** If the "making true" factor is not in the present physical state, are we not forced to posit a truth-maker that exists outside the causal order?

  **Question 2**
  Consider the rival supervaluationist view, where future contingents currently lack a truth value. Imagine an admiral who says today, "There will be a battle tomorrow." The battle occurs. He then says, "I was right." On the gap view, his original utterance was neither true nor false. How can he claim to have been right without contradicting the gap theory, and does your Ockhamist view handle this retrospective assessment better?
  *(Jargon presupposed: Supervaluationism; Truth value gaps.)*
  *   **Audience Flag:** *Supervaluationism* is a logical framework that allows statements to be neither true nor false when they depend on unsettled future details, while still maintaining that logical tautologies (like "battle or no battle") are true.
  *   **Likely Reply:** She will argue that supervaluationism fails to capture the intuition of retrospective correctness, whereas Ockhamism preserves the continuity of truth across time.
  *   **Follow-up:** If truth is continuous across time, does that not require the truth-maker to exist at the time of the utterance, rather than just at the time of the event?

  **Question 3**
  This brings us to the branching-time model. You accept that the future branches, but you insist on a "Thin Red Line" of actuality to ground the truth of the admiral's statement. Is this privileged history in principle detectable by an observer at the moment of utterance, prior to the branching point?
  *(Jargon presupposed: Branching time; Thin Red Line.)*
  *   **Audience Flag:** *Thin Red Line* is a metaphor for the single, actual future history among many possible futures in a branching model.
  *   **Likely Reply:** She will likely say no; the line is metaphysically privileged but not empirically detectable *ex ante*.
  *   **Follow-up:** If it is undetectable, what explanatory work does the notion do that a merely contextual assessment could not achieve?

  **Question 4**
  If the Thin Red Line is undetectable, why reject the relativist treatment, where the truth of "There will be a battle" is assessed relative to a contextually supplied history rather than an absolute actual one? What is lost if we say the admiral was right relative to the history that unfolded, without claiming that history was privileged beforehand?
  *(Jargon presupposed: Relativist treatment; Contextual assessment.)*
  *   **Audience Flag:** *Relativist treatment* suggests truth is not absolute but depends on the perspective or "context of assessment" from which the statement is evaluated.
  *   **Likely Reply:** She will argue that relativism undermines the objective nature of truth and fails to account for the asymmetry between past and future.
  *   **Follow-up:** If the asymmetry is the key, is that asymmetry a feature of the logic itself, or is it inherited from the physical world?

  **Question 5**
  You have argued that the asymmetry is inherited from physics: the past is fixed because it has left thermodynamic records. Does the Thin Red Line, therefore, supervene on these records? In other words, is the actual future simply the one that will eventually leave the dominant set of irreversible traces?
  *(Jargon presupposed: Supervene; Thermodynamic records.)*
  *   **Audience Flag:** *Supervene* means that one set of properties (metaphysical truth) is determined by another set (physical records) such that there can be no change in the former without a change in the latter.
  *   **Likely Reply:** She will likely affirm this connection to ground her metaphysics in physical asymmetry.
  *   **Follow-up:** If the Red Line depends on records, then fixity becomes a matter of physical preservation rather than metaphysical necessity.

  **Question 6**
  If one history is already the actual one, how should we interpret single-case objective chances, such as those in quantum mechanics? Does your view reduce these probabilities to mere measures of our ignorance of which branch is the Red Line, or do they retain objective status?
  *(Jargon presupposed: Single-case objective chances.)*
  *   **Audience Flag:** *Single-case objective chances* refer to probabilities assigned to individual events (like a specific atom decaying) that are thought to be real features of the world, not just reflections of human ignorance.
  *   **Likely Reply:** She will likely try to preserve objective chance by distinguishing between the actual history and the probabilistic laws governing the branching.
  *   **Follow-up:** But if the outcome is already true in the actual history, in what sense is the chance not simply a measure of our epistemic limitation?

  **Question 7**
  Connected to this is the problem of deliberation. If it is already true that I will drink coffee tomorrow, is my current deliberation idle? How do you reconcile the truth of the future contingent with the efficacy of my choice to bring it about?
  *(Jargon presupposed: Idle argument; Efficacy.)*
  *   **Audience Flag:** *Idle argument* (or *argos logos*) is the classical fatalist claim that if an outcome is fated, action to bring it about is unnecessary.
  *   **Likely Reply:** She will argue that the truth of the statement depends on the deliberation taking place; the deliberation is part of the causal chain that makes the statement true.
  *   **Follow-up:** This suggests the truth is grounded in the causal process. Does that not return us to the requirement for physical traces to ground that truth?

  **Question 8**
  Let us press the entropic grounding. If fixity requires surviving traces, consider a battle fought a thousand years ago in an empty sea where all traces have since dispersed. On your account, is that event now unfixed? If so, have you not made the past open?
  *(Jargon presupposed: Entropic grounding; Irreversible traces.)*
  *   **Audience Flag:** *Entropic grounding* is the theory that the direction of time and the "fixed" nature of the past are explained by the increase of entropy and the creation of records.
  *   **Likely Reply:** She will likely argue that traces rarely fully disperse or that fixity, once achieved, is not lost even if traces degrade.
  *   **Follow-up:** If fixity is not lost when traces degrade, then fixity is not strictly grounded in the *current* existence of traces, but in their *past* existence.

  **Question 9**
  Conversely, consider a deterministic world. The present state carries information about every future event in principle, even if not thermodynamically recorded. If information in the present state is sufficient for fixity, does your account not collapse into determinism, rendering the future closed regardless of entropy?
  *(Jargon presupposed: Deterministic world; Information in the present state.)*
  *   **Audience Flag:** In a *deterministic world*, the laws of nature and the present state uniquely fix all future states, implying complete information about the future exists now.
  *   **Likely Reply:** She will distinguish between information encoded in laws/state and thermodynamic records, insisting only the latter grounds fixity.
  *   **Follow-up:** But if the information is physically present, why does the lack of a "record" keep the future open? Is the distinction merely pragmatic?

  **Question 10**
  Finally, if fixity depends on thermodynamic records, is it a matter of degree? And in a time-symmetric cosmology with low entropy at both ends, would traces point in both directions, rendering the middle "present" fixed from both past and future?
  *(Jargon presupposed: Time-symmetric cosmology; Low-entropy boundary condition.)*
  *   **Audience Flag:** *Time-symmetric cosmology* (e.g., a "Gold universe") posits a universe that expands and then contracts, potentially mirroring thermodynamic arrows of time.
  *   **Likely Reply:** She will likely resist degrees of truth and treat the cosmological case as a special boundary condition that doesn't alter local fixity.
  *   **Follow-up:** If fixity cannot be graded, yet records fade, your physical grounding seems to conflict with your logical commitment to bivalence.

  ***

  **Closing Question 1**
  What empirical or formal evidence would count against this package? If the Thin Red Line is undetectable and fixity is grounded in records that may vanish, is there any observation that could falsify your theory?

  **Closing Question 2**
  State the strongest objection to your position that you currently cannot answer to your own satisfaction.
