answer: |-
  You are right to press me on the internal critique, and I will concede that such a thing is possible; practices can contain the seeds of their own dissolution, and when they do, the agents themselves can sometimes articulate the contradiction without waiting for history to judge them. But you are too quick to find it here. The right of refusal was, as you say, written into the custom, yet for decades it remained notional—a piece of theoretical architecture that no one leaned on until the social atmosphere shifted. To say the practice refuted itself is to read the outcome back into the premise. The daughters did not say, "We have discovered an inconsistency in the logic of standing"; they said, "We look foolish." That is not an argument; it is a change in what they could bear to feel. If we insist on calling this rational progress, we are flattering ourselves with a description that would have been unintelligible to them. They didn't solve a problem; they lost a nerve.

  Now, on your second point, you ask whether the thinness of the mechanism—embarrassment rather than honor—makes my worry about vindication harder for me. I think you have it precisely the wrong way round. It is the rationalist who needs the thick mechanism, the code, the recognition of error, because only that provides the vindicatory explanation that says we are now *right* and they were *wrong*. If the change was driven merely by a shift in what causes embarrassment, then we have a causal story, not a justificatory one. We are left with the unsettling thought that our own confidence rests on a similar fragility, that we too might cease to bear being seen doing what we now think obligatory. That is indeed harder for *us* to bear, but it is exactly what I am trying to get you to see. There is no clean vindicatory answer on offer, and the fact that the mechanism is as thin as a giggle only confirms that moral change is not the march of reason you want to teach your engineers.
