prompt: |-
  I lead a four-person scenario team at a multilateral guarantee agency that insures long-dated infrastructure and sovereign-backed debt. Two or three times a week we must attach a thirty-year political-continuity assumption to an exposure: the probability that the political entity whose obligation we have guaranteed, or a successor willing and able to honour it, will still be in a position to do so in thirty years. These assumptions feed a pricing model, and an error in one is typically discovered decades later and by someone else. Our board reviews a sample of them each year and asks why two analysts looking at the same country produced numbers thirty percentage points apart.

  We want to move to something like the outside view: rather than assembling a narrative about a country and reasoning forward from it, place the case in a class of comparable cases, take that class's observed distribution of durations as an anchor, and then adjust, sparingly and defensibly, for what is specific to the case. Every attempt we have made has failed in one of two ways. Either the class is so broad that the base rate carries no information, as with states or empires taken wholesale, or the analyst narrows it until it contains the case and two of its neighbours, at which point we are doing the inside view with extra steps. We also have no principled answer to how much adjustment to permit before the anchor has been quietly abandoned.

  Our raw material is a private archive of roughly two hundred historical polities, each with a start year and an end year, coded independently by two analysts. Inter-rater agreement on end years is about 0.7, and the disagreements are not transcription errors: they are genuine disputes about whether a conquest, a dynastic change, a constitutional refounding, or a relocation of the capital ended the entity. We also work under an internal Successor-Continuity Convention, under which an entity counts as persisting to year T if at T some polity exercises effective control over at least half the territory held at T0, is recognised by at least a third of the states that recognised the original, and still operates at least one institution founded before T0.

  Please write the procedure we could actually run. I need, at minimum:

  1. A fixed sequence of questions, each with an explicit criterion for a sufficient answer and a stated default when the answer cannot be obtained in the time available.

  2. A requirement that the outcome variable be fixed before any reference class is chosen, including a rule for resolving coder disagreement about historical end years, and an explicit statement of what the Successor-Continuity Convention settles by fiat rather than by evidence.

  3. A rule for nominating candidate reference classes and adjudicating among them: how many to nominate, how to record the ones rejected, what to do when two defensible classes yield conflicting base rates, and what to do when the only class with enough cases is also the least causally relevant.

  4. A step that asks how the archive's own selection biases the base rates. We have start and end years only for polities that left dated administrative records, and the capacity to keep such records plausibly correlates with whatever makes polities durable. Say what, if anything, can be done about this inside the procedure.

  5. A rule about duration already survived. My team is divided over whether a polity that has lasted two centuries should be credited with any additional expected remaining life on that account: whether the conditional distribution is roughly memoryless, as for an exponential duration, or whether survival is evidence of durable institutions and should raise the estimate. Tell me what the choice depends on, what could be settled from our own archive, and what to do in the meantime.

  6. A rule for the adjustment step: a cap on how far the final number may depart from the class base rate, who may authorise exceeding it, and what must be written down when they do.

  7. Stopping rules: the conditions under which the honest output is no defensible number, and how that output should be represented inside a pricing model that requires a number.

  8. An explicit list of the points at which the procedure hands the decision to a named person because the question is one of values rather than of fact; for example, whether persistence of a legal persona matters when the population it governed has dispersed.

  The procedure is expected to be run in about two hours per case by analysts with graduate training in political science who can run a regression but have no formal training in forecasting. Its output must fit on one page plus a short audit trail, and it must be defensible both to our board and to an external auditor five years later. Please do not propose that we acquire data we do not have.

  It must also handle the following, which are drawn from live cases: a federal union in which one member region is likely to secede peacefully, where each successor would probably honour the debt but the original entity would no longer exist; a low-lying island state much of whose territory may be uninhabitable within the horizon, whose government intends to continue in exile and to keep servicing its obligations; a supranational union of sovereign states, for which the archive holds at most a handful of analogues; and a case in which our own guarantee is large enough relative to the entity's economy that publishing a low assumption could itself precipitate the failure it predicts.

  Finally, run the finished procedure on three of these cases, showing the audit trail as an analyst would fill it in, and for at least one of them show me where the procedure delivers an answer my desk will find uncongenial and argue why we should accept it. Close by stating plainly what this procedure cannot do. Please reason from the concepts themselves; I do not need citations, sources, or suggestions for further reading.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** A four-person scenario team at a multilateral guarantee agency.
      *   **Task:** Attach a 30-year political-continuity probability to exposures (sovereign/infrastructure debt).
      *   **Problem:** Current inside-view narratives lead to high variance (30% gaps) and are hard to audit. Attempts at outside view fail (too broad = useless, too narrow = inside view in disguise). No rule for adjustment magnitude.
      *   **Assets:** Private archive of ~200 historical polities (start/end years, coded by 2 analysts, inter-rater agreement 0.7). Internal "Successor-Continuity Convention" (territory, recognition, institutions).
      *   **Constraints:** 2 hours per case, analysts have grad training (polisci) but no formal forecasting training. Output: 1 page + audit trail. Defensible to board/auditors. No new data acquisition.
      *   **Specific Requirements:**
          1.  Fixed sequence of questions (criteria + defaults).
          2.  Outcome variable fixed *before* reference class (resolve coder disagreement, define Convention's fiat).
          3.  Reference class nomination/adjudication (how many, reject log, conflicting rates, weak relevance).
          4.  Archive selection bias handling.
          5.  Duration already survived (memoryless vs. durable institutions).
          6.  Adjustment rule (cap, authorization, documentation).
          7.  Stopping rules (when no number is defensible, model input).
          8.  Value judgments (named person decision points).
          9.  Live Case Handling: Federal secession, Sinking Island (exile), Supranational Union, Self-fulfilling prophecy risk.
          10. Demonstration: Run on 3 cases, show audit trail, highlight uncongenial result.
          11. Limitations: State plainly what it cannot do.

  2.  **Develop the Procedure (The "Political Continuity Protocol" - PCP):**

      *   *Goal:* Standardize the Outside View while acknowledging the specific constraints of political risk.
      *   *Step 1: Define the Event (Outcome Variable).* Must happen before picking the class. Needs to resolve the "Successor-Continuity Convention" ambiguities.
      *   *Step 2: Reference Class Selection.* Needs a structured way to avoid "cherry-picking."
      *   *Step 3: Base Rate Calculation.* Handling the archive bias.
      *   *Step 4: Duration Adjustment.* Addressing the memoryless vs. aging debate.
      *   *Step 5: Specific Adjustment.* The "inside view" tweak, but capped.
      *   *Step 6: Value Judgments & Stopping Rules.* Who decides the hard stuff? When do we quit?

      *   *Drafting Specific Rules:*
          *   *Outcome:* "Failure" = Breach of Successor-Continuity Convention.
          *   *Coder Disagreement:* If analysts disagree on historical end dates, use the *earlier* date (conservative bias for base rates) or average? Better: Use the consensus definition. If 0.7 agreement, we need a tie-breaker. Let's say: If coders disagree on whether a historical case "survived" 30 years, count it as "failed" for base rate purposes (conservative).
          *   *Reference Class:* Nominate 3. One broad (regime type), one narrow (region + regime), one functional (debt payer). Pick the one with $N > 20$ unless rejected for causal irrelevance.
          *   *Bias:* The archive is biased towards durable/record-keeping states. We can't fix the data, but we can apply a "survivorship discount." Let's suggest a fixed downward adjustment to the base rate to account for the "missing failed states" in the historical record.
          *   *Duration:* This is a theoretical fight. Political entities aren't radioactive atoms (memoryless) nor biological organisms (aging). They are institutional. Evidence suggests "liability of newness" then stability. Rule: Check the archive. If hazard rate decreases with time in the archive, credit survival. If flat, no credit. Default: No credit (conservative).
          *   *Adjustment Cap:* ±15% from base rate. Anything more requires Senior Analyst sign-off + written justification linking specific factor to historical analogue.
          *   *Stopping Rule:* If no class has $N \ge 10$, or if adjustment requires >50% move, output "Unquantifiable Risk" (proxy number needed for model).
          *   *Value Judgments:* The "Successor-Continuity Convention" settles *legal* continuity, but *economic* capacity is different. The Head of Scenario Team decides on "Exile" validity.

  3.  **Addressing the Live Cases:**

      *   *Federal Secession:* Does the center survive? If the debt stays with the center, does the center meet the Convention? (Territory < 50%?).
      *   *Sinking Island:* Exile government. Meets "Institution" criteria? Meets "Territory" criteria (0% territory)? The Convention says "half territory." This is a hard fail unless the Convention is waived. *Crucial Point:* The procedure must flag this as a Convention breach.
      *   *Supranational:* Few analogues. Reference class problem. Likely hits the "Stopping Rule" or requires broadening to "Alliances."
      *   *Self-Fulfilling:* The model number is internal. If leaked, it's an ops security issue, not a modeling issue. But the procedure should note if the *act of guaranteeing* changes the probability (Moral Hazard).

  4.  **Refining the Procedure (Iterative Polish):**

      *   *Constraint Check:* 2 hours. Needs to be tight.
      *   *Bias:* How to handle the "record-keeping" bias without new data? Acknowledge it as a "Structural Uncertainty Margin."
      *   *Duration:* The prompt asks what the choice depends on. It depends on the hazard function of the archive. I need to write a rule that tells them to check the archive's hazard rate.
      *   *Audit Trail:* Needs to look like a form.

  5.  **Drafting the Content (Section by Section):**

      *   *Introduction:* Set the tone. Rigorous, bureaucratic but functional.
      *   *The Protocol:* Numbered steps matching the prompt's requirements.
      *   *The Cases:* Apply the protocol.
          *   Case 1: Federal Union (Secession).
          *   Case 2: Sinking Island (Exile).
          *   Case 3: Supranational Union.
      *   *The Uncongenial Result:* Likely the Island or the Supranational one. The Island one is good because the Convention says "50% territory." If they sink, they fail the Convention, even if they pay debt. This highlights the tension between *legal* continuity and *payment* willingness. I will argue for the Convention's strictness to maintain model integrity.
      *   *Limitations:* Be honest. It doesn't predict black swans, it doesn't solve the "definition of a state" problem, it relies on flawed history.

  6.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the "record-keeping bias" fixable?
      *   *Correction:* No, not without new data. The procedure must explicitly state that the base rate is an *upper bound* on survival because the sample excludes stateless societies/failed states that left no records. I will institute a "Archive Penalty" (e.g., subtract 5-10%).
      *   *Critique:* Duration survived.
      *   *Correction:* The prompt asks what to do *in the meantime*. I will prescribe a default (no credit) but allow an override if the archive shows a negative hazard slope.
      *   *Critique:* Value Judgments.
      *   *Correction:* Make sure the "Head of Scenario Team" is the named person.
      *   *Critique:* Audit Trail.
      *   *Correction:* Ensure it fits the "one page" constraint conceptually.

  7.  **Final Polish:** Check against all 8 specific requirements in the prompt.
      1.  Fixed sequence? Yes.
      2.  Outcome fixed first? Yes.
      3.  Reference class rules? Yes.
      4.  Archive bias? Yes.
      5.  Duration survived? Yes.
      6.  Adjustment cap? Yes.
      7.  Stopping rules? Yes.
      8.  Value judgments? Yes.
      *   Live cases handled? Yes.
      *   3 cases run? Yes.
      *   Uncongenial result argued? Yes.
      *   Limitations stated? Yes.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Political Continuity Protocol (PCP) v1.0

  **Purpose:** To generate a defensible, outside-view probability of political continuity over a 30-year horizon for pricing long-dated guarantees.
  **Time Budget:** 120 minutes per case.
  **Output:** One-page Probability Assessment Form (PAF) + Audit Trail.

  ---

  ## Part 1: The Procedure

  ### Step 1: Define the Outcome Variable (15 Minutes)
  *Goal: Fix the definition of "Failure" before examining the specific case details to prevent motivated reasoning.*

  1.  **Question:** Does the exposure meet the internal Successor-Continuity Convention (SCC) at Year T+30?
      *   **Criterion:** SCC is met if: (a) Effective control over ≥50% of T0 territory; (b) Recognition by ≥33% of T0 recognizers; (c) Operation of ≥1 pre-T0 institution.
      *   **Default:** If SCC criteria are ambiguous for this case type, default to "Failure" if the sovereign legal persona ceases to exist under international law.
  2.  **Question:** How do we resolve historical coder disagreement for the reference class?
      *   **Rule:** For the historical archive, if two coders disagree on whether a polity "survived" a 30-year window, code it as a **Failure**. (Conservative bias to offset archive survivorship bias).
      *   **SCC Fiat Statement:** The SCC settles *legal/institutional* continuity by fiat. It does **not** settle *economic capacity* to pay. A polity may meet SCC but default on debt; this model measures SCC survival only. Economic capacity is handled in the credit model, not here.

  ### Step 2: Nominate Reference Classes (30 Minutes)
  *Goal: Prevent "class narrowing" to match the inside view.*

  1.  **Question:** What are the candidate classes?
      *   **Rule:** Analyst must nominate exactly three classes from the archive:
          1.  **Broad:** Regime Type (e.g., "Federal Republics").
          2.  **Regional:** Geography + Regime (e.g., "Latin American Federal Republics").
          3.  **Functional:** Debt/Trade Profile (e.g., "Investment Grade Sovereigns").
  2.  **Question:** Which class is selected?
      *   **Adjudication:** Select the class with the largest $N$ (number of historical polities) provided $N \ge 20$.
      *   **Conflict:** If two classes have $N \ge 20$ and yield base rates differing by >20%, select the **Broad** class. (Specificity increases noise).
      *   **Relevance:** If the only class with $N \ge 20$ is causally irrelevant (e.g., using "Monarchies" for a "Republic"), record the mismatch in the Audit Trail and apply the **Archive Penalty** (see Step 3).
      *   **Rejection Log:** Record the two rejected classes and their $N$ on the Audit Trail.

  ### Step 3: Calculate Base Rate & Adjust for Archive Bias (20 Minutes)
  *Goal: Derive the anchor and correct for the "record-keeping" bias.*

  1.  **Question:** What is the raw survival rate?
      *   **Calculation:** (Polities in class meeting SCC at 30 years) / (Total Polities in class).
  2.  **Question:** How do we account for the archive's selection bias (missing failed states with no records)?
      *   **Rule:** Apply a fixed **Archive Penalty** of 10 percentage points to the raw survival rate.
      *   **Rationale:** The archive contains only polities that left dated records. Polities that collapsed into statelessness often leave no administrative trace. This penalty approximates the "missing mass" of total failures.
      *   **Floor:** Base rate cannot fall below 5%.

  ### Step 4: Assess Duration Already Survived (15 Minutes)
  *Goal: Determine if past survival predicts future survival.*

  1.  **Question:** Does the archive show a "liability of newness" or "memoryless" hazard?
      *   **Test:** Run a simple correlation on the archive class: *Years Survived T0–T30* vs. *Total Duration*.
      *   **Rule:**
          *   If correlation is positive (survival begets survival): Add 1% to probability for every 5 years already survived beyond the class median.
          *   If correlation is null/negative: No adjustment.
      *   **Default:** If time does not permit regression, assume **Memoryless** (No adjustment). This is the conservative default.

  ### Step 5: Specific Adjustment (The Inside View) (25 Minutes)
  *Goal: Allow for case-specific factors without abandoning the anchor.*

  1.  **Question:** Are there specific factors warranting deviation from the adjusted base rate?
      *   **Cap:** Adjustments are capped at **±15%** from the Step 3/4 anchor.
      *   **Authorization:** Any adjustment >5% requires sign-off by the **Head of Scenario Team**. Any adjustment hitting the 15% cap requires sign-off by the **Chief Risk Officer (CRO)**.
      *   **Documentation:** Must cite a specific historical analogue from the archive that justifies the move. (e.g., "Adjusted -10% due to secession risk, analogous to Case #44 in archive").
      *   **Forbidden:** Adjustments based on "current leadership popularity" or "short-term economic cycles."

  ### Step 6: Value Judgments & Escalation (10 Minutes)
  *Goal: Identify non-factual decisions.*

  1.  **Question:** Does this case require a value judgment on the definition of continuity?
      *   **List of Value Triggers:**
          *   **Exile Governments:** Does a government without territory count? (SCC says No, but economic capacity may remain). **Decider:** Head of Scenario Team.
          *   **Supranational Entities:** Does the dissolution of a union count as the death of members? **Decider:** Chief Risk Officer.
          *   **Self-Fulfilling Risk:** Does the guarantee itself alter the probability? **Decider:** Chief Risk Officer (requires Model Segregation).
      *   **Rule:** If a Value Trigger is pulled, the Analyst records the recommendation, but the Decider must sign the Audit Trail.

  ### Step 7: Stopping Rules & Model Input (5 Minutes)
  *Goal: Define when not to produce a number.*

  1.  **Question:** Is a defensible number possible?
      *   **Stop Condition 1:** No reference class has $N \ge 10$.
      *   **Stop Condition 2:** Required adjustment exceeds 15% cap to match observable reality.
      *   **Stop Condition 3:** Inter-rater disagreement on Step 1 (Outcome Definition) cannot be resolved.
  2.  **Output if Stopped:** Enter code **999** in the pricing model.
      *   **Model Handling:** Code 999 triggers a capital charge equivalent to a 50% failure probability (conservative penalty for uncertainty).

  ---

  ## Part 2: Audit Trail & Case Demonstrations

  **Analyst:** J. Doe
  **Date:** 2023-10-27
  **Time Spent:** 115 Minutes

  ### Case A: The Federal Union (Secession Risk)
  *Context: A large federation where one wealthy region is voting on secession. Debt is federal. Successors likely to honour, but original entity shrinks.*

  | Step | Input / Decision | Value / Note |
  | :--- | :--- | :--- |
  | **1. Outcome** | SCC Breach? | **Yes.** If region secedes, federal territory <50% of T0. |
  | **2. Class** | Nominees | 1. Federations (N=45); 2. N. American Polities (N=12); 3. IG Debt (N=30). |
  | | **Selected** | **Federations (N=45).** Largest N. |
  | | Rejected | N. American (N<20), IG Debt (Causal mismatch). |
  | **3. Base Rate** | Raw Survival | 65% (29/45 survived 30 yrs). |
  | | Archive Penalty | -10% (Record-keeping bias). |
  | | **Anchor** | **55%** |
  | **4. Duration** | Past Survival? | Federation is 80 years old. Class median 40 yrs. |
  | | Adjustment | +0% (Default Memoryless applied; no time for regression). |
  | **5. Specific** | Adjustment | **-15% (Cap).** Secession risk is higher than average federation. |
  | | Justification | Analogue: Case #12 (Yugoslavia). Territory loss >50%. |
  | | **Pre-Final** | **40%** |
  | **6. Values** | Trigger? | **Yes.** Does debt honour by successors count if SCC fails? |
  | | **Decider** | **Head of Scenario Team.** Ruling: SCC governs *this* model. Credit model handles payment. Stick to SCC. |
  | **7. Output** | **Final Probability** | **40%** |
  | | **Audit Note** | Uncongenial to desk. They argue debt will be paid. Procedure mandates SCC failure = Model failure. |

  ### Case B: The Sinking Island (Exile Continuity)
  *Context: Low-lying state. Territory uninhabitable in 25 years. Govt plans exile in Australia, vows to pay debt.*

  | Step | Input / Decision | Value / Note |
  | :--- | :--- | :--- |
  | **1. Outcome** | SCC Breach? | **Yes.** Territory control will be 0%. |
  | **2. Class** | Nominees | 1. Island States (N=25); 2. Commonwealth (N=40); 3. Microstates (N=18). |
  | | **Selected** | **Commonwealth (N=40).** |
  | **3. Base Rate** | Raw Survival | 80%. |
  | | Archive Penalty | -10%. |
  | | **Anchor** | **70%** |
  | **4. Duration** | Past Survival? | 150 years. |
  | | Adjustment | +0% (Default Memoryless). |
  | **5. Specific** | Adjustment | **0%.** No historical analogue for climate exile in archive. |
  | | **Pre-Final** | **70%** |
  | **6. Values** | Trigger? | **Yes.** Exile Government Validity. |
  | | **Decider** | **Head of Scenario Team.** Ruling: SCC requires 50% territory. Exile fails SCC. |
  | | **Override** | **Procedure Halt.** Step 1 defines Failure. Step 6 confirms Exile fails SCC. |
  | **7. Output** | **Final Probability** | **0% (Code 999)** |
  | | **Audit Note** | **STOPPING RULE TRIGGERED.** Specific adjustment cannot overcome Step 1 definition. SCC fiat overrides economic willingness. Model must take capital charge. |

  ### Case C: The Supranational Union
  *Context: A union of sovereign states (like EU). Guarantee is to the Union budget.*

  | Step | Input / Decision | Value / Note |
  | :--- | :--- | :--- |
  | **1. Outcome** | SCC Breach? | **Ambiguous.** Institutions persist, territory is sum of members. |
  | **2. Class** | Nominees | 1. Unions (N=4); 2. Alliances (N=15); 3. Confederations (N=8). |
  | | **Selected** | **Alliances (N=15).** Only N>10. |
  | **3. Base Rate** | Raw Survival | 40%. |
  | | Archive Penalty | -10%. |
  | | **Anchor** | **30%** |
  | **4. Duration** | Past Survival? | 30 years. |
  | | Adjustment | +0%. |
  | **5. Specific** | Adjustment | **+10%.** Institutional depth exceeds typical alliance. |
  | | **Pre-Final** | **40%** |
  | **6. Values** | Trigger? | **Yes.** Supranational Entity Definition. |
  | | **Decider** | **CRO.** Ruling: Treat as distinct polity. |
  | **7. Output** | **Final Probability** | **40%** |

  ---

  ## Part 3: The Uncongenial Result & Argument

  **The Uncongenial Result:** **Case B (The Sinking Island) → 0% / Code 999.**

  **The Desk's Objection:** "The government has sworn to pay. They have sovereign wealth funds invested abroad. They will honour the guarantee even from an office in Sydney. Pricing this as a 100% failure (or 50% capital charge) makes the deal impossible and loses us a client who *will* pay."

  **Why We Must Accept the Procedure's Output:**

  1.  **Model Integrity vs. Credit Risk:** Our model prices *political continuity*, not *willingness to pay*. If we allow "willingness to pay" to override the Successor-Continuity Convention (SCC) for this case, we break the link between the probability and the legal trigger of the guarantee. If the state ceases to exist legally (no territory), the guarantee contract may enter legal limbo regardless of the government's intent.
  2.  **The Precedent Trap:** If we adjust the probability to 90% because "they seem sincere," we are back to the inside-view narrative problem. We have no historical base rate for "climate exile states." Any number above 0% is pure fiction.
  3.  **Capital Adequacy:** The Code 999 triggers a 50% capital charge. This is expensive. But it is the honest price of *uncertainty*. If we price it as 90% survival and they legally dissolve in year 25, we face a claim with no clear counterparty. The capital charge buys us the equity buffer to fight that legal battle.
  4.  **Incentive Alignment:** Accepting the 0% forces the structuring team to solve the problem. They must structure the guarantee to attach to the *assets* or a *trustee* that survives the state's dissolution, rather than the state itself. The model should drive structure, not hide risk.

  ---

  ## Part 4: What This Procedure Cannot Do

  1.  **It Cannot Predict Black Swans:** The archive contains known historical polities. It cannot account for technological or environmental shocks (e.g., climate sinking) that have no historical frequency. In these cases, it correctly forces a "Stop" (Code 999), but it does not generate a better number.
  2.  **It Cannot Resolve Legal Ambiguity:** The SCC is a internal convention. International law may disagree on whether an exile government constitutes a state. The procedure treats the SCC as truth; it cannot adjudicate real-world legal disputes.
  3.  **It Cannot Eliminate Value Judgments:** We have pushed value judgments to the "Decider" (Head of Team/CRO), but we have not removed them. The decision to count "50% territory" as a hard cutoff is a value judgment, not a fact.
  4.  **It Cannot Fix the Archive Bias:** The 10% Archive Penalty is a heuristic. It is not a statistically derived correction for the missing millennia of stateless history. It is a conservative buffer, not a truth.
  5.  **It Cannot Prevent Self-Fulfilling Prophecies:** If the Code 999 becomes public, it may spook markets. The procedure treats the probability as epistemic (what we know), not performative (what we cause). Managing the leakage of the number is an operational security problem, not a modeling one.
