answer: |-
  There is no single, isolated noun that labels the *disagreement structure* itself (e.g., there is no term like "kind-dualism" that is universally recognized for this specific phenomenon). However, philosophers have precise terminology for the metaphysical principle driving the intuition, the logical relationship between the objects, and the canonical thought experiment that matches your description.

  The specific concept you are looking for is **Origin Essentialism** (sometimes called **Historical Essentialism**).

  Here is how this concept maps onto the pattern you described, along with the related terminology and its implications for realism and nominalism.

  ### 1. The Core Concept: Origin Essentialism
  The intuition your friends expressed—that a lab-grown heart or an AI text is a different *kind* of thing despite being physically identical to the original—is the hallmark of **Origin Essentialism**.

  This view, most famously associated with **Saul Kripke** and **Hilary Putnam**, argues that the "essence" of an object or a natural kind is not determined solely by its internal properties (its structure, chemistry, or output) but by its **causal history**. Under this view:
  *   A heart is not just a pump with specific tissue; it is an organ that developed via a specific biological lineage.
  *   A painting is not just an arrangement of pigment; it is an artifact created by a specific agent at a specific time.
  *   A text is not just a string of symbols; it is an utterance originating from a conscious mind.

  When people insist on the difference without citing a missing physical property, they are implicitly appealing to **historical properties** rather than **intrinsic properties**.

  ### 2. The Logical State: Qualitative Indiscernibility
  The state of the two objects you described—matching in every observable feature but differing in kind—is technically described as **qualitative indiscernibility**.
  *   **Qualitative Identity:** The objects share all the same properties (shape, mass, chemical composition, pixel arrangement).
  *   **Numerical/Kind Distinction:** They are not the same object, and they do not belong to the same ontological category.

  Philosophers use this setup to test **Supervenience**. If you believe that *all* facts about an object (including what kind it is) supervene on its physical properties, you must agree the lab-grown heart is "real." If you agree with your friends, you are denying **Humean Supervenience** regarding kind membership. You are asserting that two worlds could be physically identical at a specific moment but differ in what *kinds* of things exist in them based on past events.

  ### 3. The Canonical Case: Swampman
  The exact scenario you described is standardly discussed in philosophy of mind and metaphysics under the label of the **Swampman thought experiment**, proposed by **Donald Davidson** in 1987.
  *   **The Case:** A lightning strike in a swamp accidentally arranges molecules to create a perfect physical duplicate of a human being (Swampman).
  *   **The Question:** Is Swampman a *person*? Does it have *thoughts*?
  *   **The Split:** Just like your friends, philosophers divide. Some say "Yes, it functions exactly the same." Others say "No, it has no history, no causal connection to the world, so it has no mental content or true biological status."

  This is the precise parallel to your lab-grown heart and AI text. The term **Swampman Intuition** is often used to refer to the immediate sense that the duplicate lacks something vital despite physical perfection.

  ### 4. Relation to Essentialism and Nominalism
  You asked whether this is a difficulty for realism about kinds or for the view that denies them. The answer is nuanced:

  **It is not primarily a battle between Realism and Nominalism.**
  Both realists and nominalists can accommodate origin essentialism.
  *   **A Realist** can say: "Kinds are real, but the real boundary is drawn by history, not just chemistry."
  *   **A Nominalist** can say: "We simply choose to use the word 'heart' differently based on origin; there is no deep metaphysical fact."

  **It is a battle within Essentialism (Property vs. History).**
  The disagreement is between two types of essentialism:
  1.  **Lockean/Descriptivist Essentialism:** Kinds are defined by a cluster of observable properties (the "nominal essence"). If it looks and acts like a heart, it is a heart. This view struggles with your friends' intuition.
  2.  **Kripkean/Causal Essentialism:** Kinds are defined by their underlying causal origin. This view validates your friends' intuition.

  **The Difficulty for Physicalism:**
  The real tension here is with **Reductive Physicalism**. If physical properties exhaust reality, then two physically identical items must be identical in every way. The insistence that the lab-grown heart is "different" suggests that **relational or historical facts** are ontologically significant, not just local physical facts. This is often seen as a difficulty for views that deny the reality of historical/causal relations.

  ### Summary
  If you need to name this pattern in a philosophical context, the most accurate phrasing is:
  > "This is a case of **qualitative indiscernibility** triggering an **origin essentialist intuition**, similar to the **Swampman** thought experiment."

  The "resistance to collapsing the two into one category" is the rejection of **Descriptivism** in favor of a **Causal-Historical theory of reference and kinds**. It is not usually viewed as a failure of realism, but rather as a refinement of what constitutes the "reality" of a kind (shifting from static properties to historical processes).
