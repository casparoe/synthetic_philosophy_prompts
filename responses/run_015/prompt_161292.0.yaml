answer: |-
  ### Criteria and Weighting

  My prioritization rests on three weighted criteria. First, **Upstream Dependency** (40%): Does answering this question unlock solutions to others? Foundational conceptual errors cannot be patched later. Second, **Design Impact** (40%): Will the answer materially alter the Escalating Sortition Legislature (ESL) or the viability of Lottery Recall? We prioritize questions that prevent institutional failure over those that merely refine aesthetics. Third, **Theoretical Tractability** (20%): Can this be resolved through conceptual argument without empirical data? We deprioritize questions requiring behavioral data, as fellows cannot conduct fieldwork. Legitimacy is weighted higher than efficiency; a stable illegitimate system is useless to this foundation.

  ### Stage 1: Candidate Question Brainstorm

  1.  **Normative Basis of Binding Authority:** Why can a random subset bind the whole? (Upstream: High, Tractability: High, Neglect: Low, Impact: High)
  2.  **Lottery Recall Legitimacy:** Can one random sample judge another's mandate? (Upstream: High, Tractability: Med, Neglect: High, Impact: High)
  3.  **Mandate Definition:** What constitutes "exceeding mandate" for Recall triggers? (Upstream: High, Tractability: High, Neglect: High, Impact: High)
  4.  **Agenda Capture:** How to prevent the small Agenda Chamber from oligarchic drift? (Upstream: Med, Tractability: High, Neglect: Med, Impact: High)
  5.  **Epistemic Competence:** Can rotating amateurs master complex policy? (Upstream: Med, Tractability: Med, Neglect: Low, Impact: Med)
  6.  **Stratified Equality:** Do quotas undermine the mathematical purity of the lot? (Upstream: Med, Tractability: High, Neglect: Low, Impact: Med)
  7.  **Systemic Stability:** How to prevent long-term policy drift without elections? (Upstream: Med, Tractability: Low, Neglect: Med, Impact: High)
  8.  **Constitutional Chamber Authority:** Who guards the constitutional interpreters? (Upstream: Med, Tractability: Med, Neglect: Med, Impact: Med)
  9.  **Deliberative Quality:** Does rapid rotation destroy institutional memory? (Upstream: Low, Tractability: Med, Neglect: Low, Impact: Med)
  10. **Minority Rights:** Protections for the lot-internal minority. (Upstream: Low, Tractability: High, Neglect: High, Impact: Low)
  11. **Transition Theory:** Pathways from electoral to sortitive systems. (Upstream: Low, Tractability: Low, Neglect: High, Impact: Low)
  12. **Comparative Legitimacy:** When is sortition superior to elections? (Upstream: Low, Tractability: High, Neglect: Low, Impact: Med)

  ### Stage 2: Ranked Research Agenda

  **1. Defining the "Mandate" for Lottery Recall**
  This is the highest priority because the Lottery Recall mechanism is the ESL's only accountability loop. Without a rigorous theoretical definition of "mandate," Recall is either toothless or a weapon for factional harassment. Fellows must distinguish between *procedural* mandates (following rules), *substantive* mandates (policy outcomes), and *fiduciary* mandates (acting in good faith). If the mandate is too narrow, the chamber cannot govern; too broad, and Recall becomes a vote of no confidence disguised as a legal judgment, reintroducing the polarization of elections. Progress would look like a taxonomy of recallable offenses that does not rely on popular sentiment. If fellows cannot distinguish "bad policy" from "mandate violation" conceptually, the Lottery Recall must be abandoned, fundamentally altering the ESL design.

  **2. The Normative Basis of Binding Authority**
  This is the foundational legitimacy question. Advisory bodies require only fairness; binding bodies require authority. Fellows must articulate why a random sample possesses the right to coerce the population, moving beyond "descriptiveness" as a proxy for consent. The argument must address the "minority rule" objection: even a representative lot is a minority. Does authority derive from the *procedure* of selection or the *quality* of output? If the former, how do we justify binding dissenters? If the latter, does this secretly reintroduce epistocracy? This question is upstream of all others; if binding authority cannot be justified theoretically, the ESL is merely a complex advisory council. Progress requires a new social contract theory that decouples authorization from consent and couples it to equality of opportunity for power.

  **3. Agenda Capture in the Small Chamber**
  The ESL design funnels power through a small Agenda Chamber. This creates a bottleneck vulnerable to organized interests, lobbying, or internal cartelization, even if members are randomly selected. Theoretical work is needed on how sortition interacts with information asymmetry. Can a small random group remain "random" in behavior when subjected to concentrated external pressure? Fellows should model the incentives of the Agenda Chamber without empirical data, focusing on information flows and proposal framing. If the Agenda Chamber can be captured, the Deliberative Chamber merely ratifies biased options. This question depends on #1 (Mandate), as recall is the only check on capture. Progress would be a set of institutional constraints (e.g., blind drafting, randomized committees) derived from first principles of information economics.

  **4. Legitimacy of One Lot Judging Another**
  Specific to the Lottery Recall, this asks whether a fresh random sample has the standing to dissolve a sitting random chamber. Is there a "sovereign" status to the current legislature that a new lot cannot override? Or are all lots equally sovereign? If all lots are equal, does Recall create instability where every decision is provisional? Fellows must analyze the temporal authority of the lot. Does the mandate belong to the *individuals* or the *institution*? If the institution is sovereign, a new lot cannot dissolve it without a higher constitutional rule. This question is downstream of #2 (Binding Authority) but upstream of #1 (Mandate). If one lot cannot judge another, Lottery Recall is illegitimate. Progress involves a theory of "inter-temporal sortitive sovereignty."

  **5. Epistemic Competence under Rapid Rotation**
  The ESL relies on short cycles to ensure freshness, but this risks incompetence. Binding power demands decisions that do not catastrophically fail. Fellows must theorize "competence" without relying on expertise. Can procedural design (e.g., witness selection, expert testimony rules) substitute for member knowledge? The risk is creating a permanent staff class that actually governs. Theoretical work must define the boundary between "administrative support" and "shadow governance." This is less upstream than legitimacy questions but critical for functional viability. If competence cannot be theoretically assured, the ESL should be advisory only. Progress would be a framework for "institutionalized learning" that does not violate rotation principles.

  **6. Systemic Stability without Electoral Feedback**
  Elections provide a rhythmic reset that absorbs social tension. The ESL lacks this. Fellows must analyze how a sortitive system absorbs shock. Without the ability to "throw the rascals out" via election, does discontent accumulate until it becomes revolutionary? Theoretical modeling of system stability is needed. Is Lottery Recall sufficient pressure release, or does it invite chaos? This question is downstream of #1 and #4. If Recall is legitimate and defined, it may provide sufficient stability. If not, the system risks brittle collapse. Progress involves identifying the "pressure valves" necessary in a non-electoral constitution.

  **7. Political Equality in Stratification**
  Pure lot may not yield descriptive representation on key dimensions (e.g., race, class) without stratification. But stratification alters the randomness, potentially biasing the "voice of the people." Fellows must determine if mathematical purity or sociological representativeness better serves the normative goal of #2. This is a refinement question. It matters less than legitimacy or capture but affects the moral claim of the system. If stratification is required for legitimacy, the "random" claim must be qualified. Progress would be a principled defense of specific quotas that does not devolve into interest-group bargaining.

  **Re-ranking Conditions**
  This agenda assumes the foundation remains committed to *binding* power. If the fellows determine in Year 1 that #2 (Binding Authority) is theoretically unsolvable, the entire agenda shifts to designing a "strong advisory" model, making #1 and #4 irrelevant. Similarly, if #3 (Agenda Capture) proves theoretically inevitable in small chambers, the ESL structure must be flattened, deprioritizing #5 (Competence) in favor of redesigning the chamber sizes. Finally, if #4 (Lot Judging Lot) is resolved negatively, Lottery Recall must be replaced, moving #6 (Stability) to the top priority to find alternative accountability mechanisms. The foundation should treat #1 and #2 as "kill switches": if these cannot be advanced, the binding sortition project lacks a theoretical foundation.
