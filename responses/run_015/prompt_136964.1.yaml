  If A is 60 bits, Gzip(A) is dominated by the gzip header (usually ~20-30 bytes).
  If B is 60 bits, Gzip(B) is also dominated by header.
  It is actually possible for Gzip(B) < Gzip(A) if B happens to align with gzip's literal table better than A, *despite* A being periodic, because 60 bits is too small for gzip's sliding window to shine.
  *However*, the point is to show $K(A) \ll K(B)$.
