      *   Constant Problem placement. (Check)
      *   Plan Critique (breaking points, contested sides). (Check)

  7.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Example:* I need to be firm that the 1/7 vs RNG example needs careful handling regarding gzip. 1/7 is *too* compressible. Maybe compare a "Look random but compressible" string vs a "Look random and incompressible" string. I will advise them to verify the gzip claim.
      *   *Correction on Kraft:* Don't skip it. If you define probability as $2^{-l}$, you *must* explain why they sum to 1. Prefix-free is the only way. Keep it to one slide.
      *   *Correction on Constant:* Make sure to emphasize that $2^{-K(\mu)}$ is the *prior probability of the truth*. If truth is complex, prior is near zero.

  8.  **Final Polish:** Ensure tone is peer-to-peer (engineer to engineer), not lecturer to student. Acknowledge the "uselessness" of uncomputability without dismissing the theoretical value.

  *(Self-Correction on the Example)*: The prompt says "gzip compresses B to something shorter than A".
  A = 1/7 (001001...). Length 60. Gzip(A) is tiny.
  B = Random. Length 60. Gzip(B) is ~60 + header.
