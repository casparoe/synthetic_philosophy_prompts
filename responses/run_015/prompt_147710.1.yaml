  ### Companion Table: Logical Space of Conventions

  This table maps the nine required views against the five key distinctions you identified. It shows which combinations of answers occupy the logical space, which are empty, and how the decision tree collapses them into leaves.

  | View | Wronging a Complainer? | Observation Matters? | One-off Exemption? | Arbitrariness Binds? | Individual Impact Matters? | Tree Leaf |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Coordination Duty** | Yes (Strangers) | No | No | Yes (If solved) | No | L2 (Coordination) |
  | **Expectations Duty** | Yes (Observers) | Yes | Yes | No | No | L5 (Expectations) |
  | **Fairness/Free-rider** | Yes (Participants) | No | No | Yes | No | L4 (Fairness) |
  | **Prudence Only** | No | Yes | Yes | No | No | L3 (Prudence) |
  | **Guest/Host Respect** | Yes (Hosts) | Yes | No | Yes | No | L8 (Deference) |
  | **Local Epistemic** | No | No | No | Yes (If wise) | No | L8 (Deference) |
  | **Underlying Values** | Yes (Victims) | No | No | No | No | L7 (Values) |
  | **Flout/Erode** | No (To System) | No | No | No | Yes | L6 (Erosion) |
  | **Deflationary** | No | Yes | Yes | No | No | L3 (Prudence) |

  **Occupied vs. Unoccupied Combinations**
  *   **Unoccupied (Incoherent):** The claim that "Conventions bind everyone" combined with "An entirely invisible violation harms nobody." If a convention binds universally, an invisible violation must wrong someone (e.g., the practice itself); if it harms nobody, it cannot bind universally.
  *   **Unoccupied (Unattractive):** The claim that "Local convention binds without qualification" combined with "The convention systematically disadvantages a vulnerable group." Most views retreat to *Underlying Values* here.
  *   **Unoccupied (Unworked):** The claim that "Arbitrariness makes compliance less binding" combined with "Coordination Duty." Usually, arbitrariness makes coordination *more* binding (we must all pick the same side).

  **Indistinguishable Leaves**
  *   **Fairness (L4) vs. Expectations (L5):** The tree separates these using the *One-off/Invisible* question (Q5). Fairness says you owe the tip even if invisible/one-off; Expectations says you do not. They come apart in *The Last-night Café*. For your purpose, the difference matters only if the engineer believes they will never be caught; otherwise, the action (Tip) is the same.
  *   **Prudence (L3) vs. Deflationary (L3):** Merged into one leaf. Both recommend compliance only to avoid penalty or awkwardness. The difference is theoretical (one says "no moral fact," the other says "moral fact equals self-interest"). For onboarding, the practical stance is identical.
  *   **Guest/Host (L8) vs. Local Epistemic (L8):** Merged into one leaf. Both recommend deference. One grounds it in respect, the other in knowledge. For a relocating engineer, the instruction ("Follow local lead") is the same.

  **Answer Patterns Landing in No Cell**
  *   If a reader answers "Yes" to *Wronging a Complainer* but "No" to *Observation Matters* and "Yes" to *One-off Exemption*, they hold a contradictory view (you wronged someone but it doesn't matter that you weren't seen and won't return). The tree routes this to **L4 (Fairness)** by prioritizing the "Wronging" branch.
  *   If a reader answers "Yes" to *Individual Impact Matters* but "No" to *Flout/Erode*, they believe their act changes the system but should not change their behavior. The tree routes this to **L6 (Erosion)** by prioritizing the impact branch.

  ---

  ### Decision Tree: Local Conventions & Obligations

  **Q1. Is this happening inside a company-managed space or shared codebase?**
  *   *Examples:* Office floor, company shuttle, shared repository, serviced apartment block.
  *   **Yes:** Go to **L1**.
  *   **No:** Go to **Q2**.

  **Q2. Is the convention backed by local law or physical safety rules?**
  *   *Examples:* Crossing at lights (City B), safety gear, traffic laws.
  *   **Yes:** Go to **Q3**.
  *   **No:** Go to **Q4**.

  **Q3. Does ignoring this rule endanger anyone, even if unlikely?**
  *   *Examples:* Jaywalking on a blind corner, skipping safety checks.
  *   **Yes:** Go to **L2**.
  *   **No:** Go to **L3**.

  **Q4. Does breaking this directly disadvantage a specific person you are interacting with?**
  *   *Examples:* Skipping a queue in front of someone, not tipping a waiter whose wage depends on it (City A).
  *   **Yes:** Go to **Q5**.
  *   **No:** Go to **Q6**.

  **Q5. Is this interaction one-off, invisible, and will you never return?**
  *   *Examples:* Last-night café (City A), empty street crossing (City B).
  *   **Yes:** Go to **L5**.
  *   **No:** Go to **L4**.

  **Q6. Does your compliance contribute to a system that harms vulnerable locals?**
  *   *Examples:* Tipping driving up prices for locals (City C), supporting unjust labor practices.
  *   **Yes:** Go to **L6**.
  *   **No:** Go to **Q7**.

  **Q7. Does this convention conflict with a core value you hold (like fairness)?**
  *   *Examples:* Queueing style that excludes elderly (City C), discriminatory practices.
  *   **Yes:** Go to **L7**.
  *   **No:** Go to **Q8**.

  **Q8. Do locals expect outsiders to follow this as a sign of respect or because they know best?**
  *   *Examples:* Dress codes, greeting rituals, dining customs.
  *   **Yes:** Go to **L8**.
  *   **No:** Go to **L3**.

  ---

  ### Leaves

  **L1**
  *   **Slug:** `professional-norms`
  *   **Position:** Team Agreement
  *   **Awkward Commitment:** You are committed to following company rules even if they contradict local custom, because this space belongs to the firm.
  *   **Practical Stance:** You owe compliance to your colleagues; guilt is appropriate if you break team flow; the company can reasonably ask this of you.

  **L2**
  *   **Slug:** `coordination-duty`
  *   **Position:** Safety & Coordination
  *   **Awkward Commitment:** You are committed to following arbitrary rules (like which side to walk on) because breaking them risks chaos or harm.
  *   **Practical Stance:** You owe compliance to strangers sharing the space; guilt is appropriate if you cause danger; the company can reasonably ask this of you.

  **L3**
  *   **Slug:** `prudence-meaning`
  *   **Position:** Prudence & Social Meaning
  *   **Awkward Commitment:** You are committed to following the rule only to avoid awkwardness or penalty, not because it is morally right.
  *   **Practical Stance:** You owe no apology if caught, only explanation; mild awkwardness is the right reaction; the company can only advise this.

  **L4**
  *   **Slug:** `fairness-duty`
  *   **Position:** Fairness to Participants
  *   **Awkward Commitment:** You are committed to paying the cost (like a tip) even if you are invisible and never return, because others sustain the system.
  *   **Practical Stance:** You owe the benefit to the worker; guilt is the right reaction if you free-ride; the company can reasonably ask this of you.

  **L5**
  *   **Slug:** `expectations-duty`
  *   **Position:** Social Expectations
  *   **Awkward Commitment:** You are committed to following the rule only when observed, because the wrong lies in disappointing those watching.
  *   **Practical Stance:** You owe an apology to observers if caught; mild awkwardness is the right reaction; the company can only advise this.

  **L6**
  *   **Slug:** `erosion-duty`
  *   **Position:** Systemic Impact
  *   **Awkward Commitment:** You are committed to breaking a pleasant convention (like tipping) because keeping it harms the local economy long-term.
  *   **Practical Stance:** You owe no apology to individuals; no guilt is the right reaction; the company can only advise this.

  **L7**
  *   **Slug:** `values-override`
  *   **Position:** Values Override
  *   **Awkward Commitment:** You are committed to breaking local custom because it violates a fundamental value (like fairness to the elderly).
  *   **Practical Stance:** You owe an explanation to locals; no guilt is the right reaction; the company can reasonably support this.

  **L8**
  *   **Slug:** `deference-locals`
  *   **Position:** Deference to Locals
  *   **Awkward Commitment:** You are committed to following customs you don't understand because locals are the hosts or know best how to live here.
  *   **Practical Stance:** You owe respect to hosts; mild awkwardness is the right reaction if you slip; the company can reasonably ask this of you.
