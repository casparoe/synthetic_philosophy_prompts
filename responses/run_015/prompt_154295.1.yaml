answer: |-
  # Activity: The Priority Race

  **Goal:** Simulate the tension between collaborative truth-seeking and competitive priority claims.
  **Group:** 16 Students (4 Teams of 4).
  **Time:** 60 Minutes (Strict).
  **Materials:**
  *   4 Envelopes.
  *   32 Cards total (8 identical cards per envelope, see "Clue Design" below).
  *   4 Large sheets of paper (Theory Boards).
  *   Markers.
  *   20 "Priority Tokens" (can be poker chips, printed slips, or candy).
  *   4 Folder dividers (for Round 2).

  ---

  ### 1. Clue Design (Prep this before class)
  Do not use real history for the clues. Use a fictional system to prevent prior knowledge.
  **Theme:** "The Decay of Element X."
  **Cards:** Number them 1 through 8 in the corner (small print). The text on the card describes a data point or observation.
  *   *Card 1:* "Initial mass is 100g."
  *   *Card 2:* "After 1 hour, mass is 50g."
  *   *Card 3:* "After 2 hours, mass is 25g."
  *   *Card 4:* "Heat accelerates the process."
  *   *Card 5:* "Light has no effect."
  *   *Card 6:* "Gas is released during decay."
  *   *Card 7:* "Remaining solid is inert."
  *   *Card 8:* "Rate depends on current mass."

  **The "Logical" Solution:** Connect 1→2→3→8 (The Half-Life Chain). Cards 4, 5, 6, 7 are peripheral factors.
  **The "Twist":** There is no single "truth." Teams can connect them however they want, provided every card is used at least once. The *structure* (which numbers connect to which) is what matters for scoring.

  ---

  ### 2. The Rules (Read these aloud, 5 mins max)
  *Do not explain the philosophy. Just explain the game.*

  1.  **Objective:** Build a "Theory Board." Draw lines connecting your 8 cards to explain the phenomenon. Every card must be connected to at least one other card.
  2.  **Submission:** You may submit your board anytime during the round. Once submitted, you cannot touch it.
  3.  **Scoring (The Priority Rule):**
      *   The first team to submit a **Valid Board** (all cards connected) opens the **Priority Window** (3 minutes).
      *   **Scenario A (Copycats):** If another team submits an *structurally identical* board (same number connections, e.g., 1-2, 2-3) within the 3-minute window, you **SPLIT** the Priority Tokens (2 tokens each).
      *   **Scenario B (Competitors):** If another team submits a board with *even one different connection* within the 3-minute window, the **FIRST** team gets **ALL** Tokens (4 tokens). The second team gets **ZERO**.
      *   **Scenario C (Late):** Any submission after the 3-minute window closes gets **ZERO** Priority Tokens.
  4.  **Validity:** The Teacher is the Judge. If your board makes no sense (e.g., no lines), it is invalid and doesn't open the Priority Window.

  ---

  ### 3. Timeline (60 Minutes)

  **0:00 – 0:05 | Setup & Rules**
  *   Hand out envelopes.
  *   Read rules. Emphasize the "Zero Sum" penalty in Scenario B.
  *   **Round 1 Condition:** "OPEN SCIENCE." You may talk to other tables. You may walk around and look at their boards.

  **0:05 – 0:20 | Round 1 (Open Collaboration)**
  *   *Note:* I have reduced this from 20 to 15 minutes. If you run 20 mins per round, you will have no time to debrief. 15 mins is enough to feel the pressure.
  *   Teams build. Expect them to converge on the same solution because they can talk.
  *   **Stop:** At 0:20, all pens down.

  **0:20 – 0:25 | The Reset**
  *   Collect boards. Give fresh paper.
  *   **Round 2 Condition:** "SECRECY WALL." Put up the folder dividers. No talking between tables. No leaving your seat. If you peek, your team is disqualified.
  *   Shuffle the cards inside the envelopes before handing them back (so the order is different, forcing them to re-process).

  **0:25 – 0:40 | Round 2 (Secret Competition)**
  *   Teams build.
  *   Watch for the race dynamic. One team will rush to submit first to lock the window. Others will try to find a *different* structure to avoid the "Zero" penalty, or rush to match the first to get the split.
  *   **Stop:** At 0:40, all pens down.

  **0:40 – 0:45 | Scoring & Tally**
  *   Reveal the boards.
  *   Apply the rules publicly. Count the tokens.
  *   Ask: "Who feels angry about the score?" (Let them vent briefly).

  **0:45 – 1:00 | The Debrief (The Philosophy)**
  *   *Do not lecture.* Ask these questions in order:
      1.  **Inevitability:** "In Round 1, did most teams end up with the same connections?" (If yes: This suggests the discovery was 'in the air' / inevitable).
      2.  **Agency:** "In Round 2, did you change your theory to be unique, or to be fast?" (This mirrors Newton/Leibniz. Did they change the math to be unique, or rush to publish?)
      3.  **The Cost:** "Round 1 produced better science (collaboration). Round 2 produced higher stakes (priority). Which system do you want to live in?"
      4.  **The Losers:** "To the teams who got Zero points in Round 2: You likely did the same amount of work as the winners. Does the point system reflect your intellectual contribution?" (Maps to Wallace getting sidelined by Darwin).
      5.  **Social Standing:** "If I, the teacher, had favored one team's board as 'more elegant' before the game started, how would that change the race?" (Maps to Royal Society bias toward Newton).

  ---

  ### 4. Payoff Scheme
  *   **Total Tokens:** 20.
  *   **Round 1:** Max 4 tokens available. (Likely split 4 ways = 1 token each). *Lesson: Collaboration dilutes individual glory but ensures everyone eats.*
  *   **Round 2:** Max 4 tokens available. (Winner take all). *Lesson: Competition creates winners and erases losers.*
  *   **End Game:** The student with the most tokens gets a trivial prize (e.g., chooses the next topic). Keep the prize low-stakes so the *feeling* of the game is the lesson, not the reward.

  ---

  ### 5. What Will Predictably Go Wrong (And How to Handle It)

  **1. The "Structurally Identical" Argument**
  *   **Failure:** Team A connects 1-2. Team B connects 1-2 but draws the line curved instead of straight. Team B claims it's different.
  *   **Fix:** Define "Structure" strictly as **Card ID Pairs**. Write this on the board. "1 connected to 2" is the only thing that matters. Ignore arrows, colors, or labels.
  *   **Failure:** Team A connects 1-2. Team B connects 2-1.
  *   **Fix:** Declare connections undirected unless they specify "Cause -> Effect." For this game, keep it undirected to simplify judging.

  **2. The Secrecy Wall Breach**
  *   **Failure:** In Round 2, a student stands up to "sharpen a pencil" and looks at a neighbor's board.
  *   **Fix:** Announce before Round 2: "If I see you leave your chair, your team gets -2 tokens." Enforce this visibly. The tension of *almost* cheating is part of the lesson.

  **3. The Rush Job**
  *   **Failure:** A team submits a nonsense board at Minute 1 just to open the Priority Window and block others.
  *   **Fix:** The "Validity" clause. You (the Teacher) must quickly inspect the submission. If cards aren't connected, reject it. The Window does not open.

  **4. The Time Crunch**
  *   **Failure:** 20 minutes per round eats the whole hour.
  *   **Fix:** Stick to the 15-minute rounds outlined above. If you drag the building phase, you lose the debrief. The debrief is where the philosophy happens; the game is just the trigger.

  ---

  ### 6. Honesty Check: What This Game Cannot Reproduce

  Be prepared to admit these limitations during the debrief if students push back:

  1.  **The Time Scale:** Real priority disputes (Newton/Leibniz) lasted decades. This game compresses it into 15 minutes. The emotional burnout of a 20-year fight is impossible to simulate in a club meeting.
  2.  **The Stakes:** In 1687 or 1858, losing priority meant losing your legacy, your funding, and your place in history. Here, they lose poker chips. The anxiety is simulated, not real.
  3.  **The "Truth":** In the game, *you* (the teacher) decide if a board is valid. In history, nature decides eventually, but society decides immediately. The game conflates "social validation" with "teacher validation."
  4.  **The Collaboration Nuance:** In Round 1, they can talk freely. In history, even "open" science was restricted by language, geography, and class. Newton and Leibniz couldn't just walk to each other's tables.

  **Closing Thought for You (The Leader):**
  If the students leave angry that the rules were "unfair" in Round 2, you have succeeded. That anger is exactly what Wallace felt. If they leave saying "Round 1 was nicer," you have succeeded. That is the argument for Open Science. Do not resolve the tension for them. Let them sit with the fact that science needs both collaboration to work and competition to move.
