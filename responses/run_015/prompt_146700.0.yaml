answer: |-
  ### Teaching Plan: Distributed Computation & Moral Status

  **Time Allocation:** 35 Minutes
  **Goal:** Decouple "functional mirroring of suffering" from "existence of a moral subject."

  ---

  ### 1. Dependency Order (The Sequence)

  1.  **Functionalism (The Setup):** Define mind by causal role, not substrate.
  2.  **Misconception Intercept #1 ("Behavior = Pain"):** Clarify that functionalism requires *internal* causal roles, not just I/O, but note that this still requires a *bearer*.
  3.  **The Climate Example (The Trap):** Present the distributed system mirroring nociception.
  4.  **The Boundary Problem (The Wedge):** Ask "Where is the 'it'?" before they validate the pain.
  5.  **Misconception Intercept #2 ("Distributed = One"):** Dismantle the idea that network connectivity creates ontological unity.
  6.  **Check Question:** Verify grasp of the boundary vs. scale distinction.

  ---

  ### 2. The Climate Example: Specifications

  **The Scenario:** A climate model runs across 50 geographically dispersed servers. There is no master node. They pass packets to update local grid states.

  **What It Must INCLUDE (to mirror nociception):**
  *   **Negative Error Propagation:** When a server detects a simulation instability (e.g., pressure gradient too steep), it sends a high-priority "damping" signal to neighbors.
  *   **Weight Adjustment:** Receiving this signal temporarily alters the neighbor's calculation weights to avoid similar instabilities (mirroring sensitization/avoidance).
  *   **Persistence:** The "damping" state degrades slowly over time, influencing future calculations (mirroring memory of injury).
  *   **Optimization:** The system's global output inadvertently minimizes these instability events, effectively "trying" to stop the signal (mirroring pain-avoidance behavior).

  **What It Must LACK (to prevent collapse into "It's just weather"):**
  *   **No Central Aggregator:** No single server ever holds the complete state of the "storm."
  *   **No Global Loss Function:** No single variable represents "total system pain." The avoidance is emergent from local rules, not a top-down command.
  *   **No I/O Interface for "Status":** The system does not output "Error Level: High." It only outputs weather data. The "pain" is purely internal to the computation structure.
  *   **No Explicit Survival Goal:** The code is not written to "preserve itself." The preservation is an accidental byproduct of the math.

  ---

  ### 3. Misconception Map: When to Intercept

  **Misconception A: "If it behaves like pain, then it is pain."**
  *   **When to Head Off:** Immediately after **Step 1 (Functionalism)**, *before* introducing the Climate Example.
  *   **How:** Explicitly state: "Functionalism isn't about what the system *says* or *does* externally. It's about the internal causal structure. A robot screaming isn't pain; a system processing error signals *might* be. But both require a *thing* to have the structure."
  *   **Why:** If you wait until after the example, they will point to the storm optimization as "behavior" and claim victory. You must separate *function* from *subject* early.

  **Misconception B: "Distributed just means one big computer."**
  *   **When to Head Off:** During **Step 4 (The Boundary Problem)**, as soon as someone says, "But the network connects them."
  *   **How:** Ask: "If I cut the cable between Server 1 and Server 2, does the 'mind' split? Or does it just get slower? If it splits, where was the boundary before I cut it?"
  *   **Why:** This forces them to realize that connectivity is a spectrum, but moral status (usually) requires a binary "exists/doesn't exist" subject. If the subject's existence depends on cable latency, the ontology is broken.

  ---

  ### 4. The Check Question

  **The Question:**
  > "If we duplicate the entire 50-server cluster exactly—running two identical, isolated networks side-by-side—do we have **one** entity suffering twice as much, or **two** entities suffering once each? If you cannot answer this without arbitrarily drawing a physical box around the servers, what does that imply about the computation itself?"

  **Why this works:**
  *   If they say "One entity," they admit physical separation doesn't define the subject (which contradicts the distributed nature).
  *   If they say "Two entities," they admit the boundary is physical, not computational.
  *   If they hesitate, they recognize that *computation alone* does not define the *count* of subjects.
  *   **Success Condition:** They realize the problem isn't "how complex is the math?" but "what constitutes a unified boundary?"

  ---

  ### 5. What to Leave Out (And Why)

  **1. Global Workspace Theory (GWT)**
  *   **Leave Out:** Do not discuss how information becomes "globally available" to create consciousness.
  *   **Why:** GWT is a *mechanism* for binding. Introducing it suggests there is a known technical solution to the boundary problem. You want to highlight the *absence* of a subject, not propose a engineering fix. It distracts from the metaphysical gap.

  **2. Integrated Information Theory (IIT / Phi)**
  *   **Leave Out:** Do not mention mathematical measures of integration.
  *   **Why:** Non-philosophers will latch onto "Phi" as a magic number. If Phi > X, then pain. This reinforces the "scale/complexity" misconception you are trying to break. It turns a boundary problem into a threshold problem.

  **3. Panpsychism**
  *   **Leave Out:** Do not discuss if individual servers have tiny minds.
  *   **Why:** It muddies the water. The point is that the *distributed system* doesn't get moral status. Arguing about the individual servers shifts focus away from the structural boundary of the cluster.

  **Strategic Reason for Exclusions:**
  Including these theories protects the point because they all attempt to *solve* the binding problem. Your goal is not to solve it, but to demonstrate that **without a solution to the boundary problem, functional mirroring is insufficient for moral status.** Keeping the literature out keeps the focus on the logical gap, not the scientific speculation.
