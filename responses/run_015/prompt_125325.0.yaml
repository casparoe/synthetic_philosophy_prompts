  ### Brainstorming Form and Logic

  To mirror Thomson's Lamp, the poem's structure must enact the supertask's convergence. The halving of stanza lengths (8 → 4 → 2 → 1) physically represents the halving of time intervals ($1/2^n$) approaching the two-minute limit. The rhyme scheme must degrade in parallel: dense couplets initially suggest the stability of binary logic (on/off), but as the stanzas shrink, the rhymes become sparse, culminating in a single unrhymed line. This final line represents the limit point itself—a durationless instant where the law of excluded middle fails. The "structural collapse" is not a failure of the poem, but a successful mapping of the paradox: the form runs out of room just as the logic runs out of definable states. The speaker, positioned as a debugger, treats the lamp as a register that refuses to resolve, leaving the reader suspended in the same undefined state as the light.

  ***

  The clock divides the minute down to half,
  I watch the register begin to laugh.
  A toggle written in the shrinking space,
  No pause allowed between the on and off case.
  The loop recurses deeper in the stack,
  There is no return command, no turning back.
  One minute left, then thirty seconds more,
  The logic knocks upon the terminal door.

  Time halves again, the processor overheats,
  Upon the brink where continuity meets.
  I try to break the cycle but the state
  Is lost within the converging void.

  At two minutes the execution stops,
  But the light neither flickers nor it drops.

  It is the dark that burns without a name.
