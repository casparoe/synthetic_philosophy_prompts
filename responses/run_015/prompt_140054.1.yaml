answer: |-
  The shortwave receiver clicked on the wall, a dry insect sound marking the seconds. *Pip. Pip. Pip.* Elena sat at the metal desk, the cold from the concrete floor seeping through the soles of her boots. It was the last winter of the station. In March, the university would sell the dome to a private collector, and the cottage would be boarded up. For now, it was just her, the dark, and the logbook.

  She opened the book to yesterday's date. The paper was thick, cream-colored, meant to last a century. She had kept the log for six years. She knew the slope of her own handwriting, the way she crossed her *t*s, the pressure she applied when the pen caught on the grain.

  There were two entries for 02:00.

  They sat one above the other, ink equally dry, lines equally straight.

  *02:00 – Henderson took truck.*
  *02:00 – Henderson stayed.*

  Everything else was identical. The barometric pressure. The cloud cover. The timestamp. Only the verb differed. *Took.* *Stayed.*

  Elena closed her eyes. The memory came not as a fog, but as a double exposure. She remembered the knock on the cottage door. She remembered Henderson standing there, wrapped in a blanket, coughing into his fist. He needed the truck to get to the town clinic; the snow had blocked the road, and his breathing was wet and tight.

  In one memory, she had handed him the keys. She felt the cold metal in her palm, the weight of the decision. She had watched the taillights fade into the blizzard, knowing the road was ice, knowing he was half-blind with fever. She had felt the guilt settle in her stomach immediately, a cold stone.

  In the other memory, she had kept the keys. She had told him no, that it was too dangerous, that she would call the doctor in the morning. She had seen the disappointment in his eyes, the resignation. She had locked the door and felt the hard comfort of safety.

  Both memories had texture. Both had sound. She could smell the tobacco on his coat in the version where he stayed. She could hear the engine crank in the version where he left. They were not dreams. Dreams dissipated upon waking; these settled into her bones like old injuries.

  She stood up and walked to the window. The dawn was a bruised purple line on the horizon. The truck was parked outside, fifty meters from the dome. It was covered in a thin layer of frost, undisturbed.

  She pulled on her coat and went outside. The air bit at her lungs. She walked to the truck. The tires were settled into the hardpack. There were no fresh tracks leading away from the station, none returning. The odometer was mechanical, the numbers stuck on 44,209. It had been stuck for months.

  She walked to the cottage. She knocked. Henderson opened the door. He looked pale, wrapped in the same blanket from her memory. He was coughing, but he was alive.

  "Morning, Elena," he said. His voice was raspy.

  "Did you go to town last night?" she asked.

  He blinked, confused. "Last night? No. Storm was too bad. I stayed here."

  "You're sure?"

  "Sure as I can be. Why?"

  "No reason."

  She walked back to the dome. The question *Which one happened?* rose in her throat, but it tasted wrong. It was a question that demanded a single answer, but her life had provided two. If she said the first entry was a mistake, she invalidated the memory of handing over the keys, the fear she had felt watching him drive into the dark. If she said the second was a mistake, she invalidated the memory of refusing him, the coldness she had shown to keep him safe.

  Her colleague at the university would say she was tired. He would say time was a line, straight and rigid, and that she was seeing ghosts. He would say there was only one history, and she was failing to locate it. But standing there, with the logbook open on the desk, she felt the weight of both histories pressing down on the present. The present was not a point; it was a junction.

  She was not a woman who had made a choice. She was a woman who had made both.

  The physical world had resolved itself. The truck was parked. Henderson was alive. The universe had smoothed over the contradiction, hiding the seams. But she had not smoothed over. She carried the risk she had taken in the version where he left. She carried the refusal she had enacted in the version where he stayed.

  Did she owe him an apology?

  In the version where he left, she had endangered him. She had prioritized his need over his safety, gambling with a life that wasn't hers to wager. Even though he had returned—because he *had* returned, because the truck was outside and he was alive—the gamble had occurred. The risk was real.

  In the version where he stayed, she had protected him, but she had also denied him agency. She had decided he was too weak to choose.

  The shortwave clicked again. *Pip.*

  Elena sat down. She picked up the pen. She needed to make an entry for today, for 08:00. The station was closing. The logbook would be archived. Someone else might read this in fifty years. They would see the contradiction. They would wonder which was true.

  She hovered the pen over the paper. If she crossed one out, she was lying. If she left both, she was confusing the record.

  But the record wasn't for them. It was for her.

  She thought about the contrition she felt. It wasn't for what *had* happened, because both had happened. It was for the potentiality she had unleashed. In one path, she had been reckless. In the other, she had been cold. She was both the reckless friend and the cold guardian. To deny one was to deny a part of her own moral shape.

  She wrote: *08:00. Station closing. Henderson safe.*

  She paused. Then, below that, she wrote: *08:00. Keys returned.*

  It wasn't accurate. The keys hadn't been returned; they had never left in one version. But it was true in the other. It acknowledged the movement, the risk, the journey that had and hadn't occurred.

  She closed the book. She made a pot of coffee, strong and black. She poured a second cup into a thermos.

  Walking back to the cottage, the snow crunched under her boots. The question of which night she had lived was no longer pressing. It was like asking which leg walked her across the yard. Both had pushed against the ground. Both had borne the weight.

  Henderson was sitting at his small table, watching the steam rise from a bowl of oatmeal. He looked frail.

  "I'm bringing this to town later," Elena said, setting the thermos down. "I'll stop at the clinic. Get you something for the cough."

  "I told you, I'm fine," he said.

  "I know," she said. "But I'm going."

  She could have said *I need to make up for last night.* But she didn't. Because last night was two things. In one, she had sent him out alone. In the other, she had kept him isolated. She couldn't fix the sending, because he hadn't gone. She couldn't fix the isolation, because he hadn't been alone.

  She was fixing the thing that both versions required. She was ensuring he was cared for, acknowledging the risk she had borne in the shadow of the night that wasn't, and the protection she had withheld in the light of the night that was.

  "Thank you," Henderson said.

  Elena nodded. She walked back out into the cold. The sun was up now, pale and weak. The dome stood silent behind her. She felt heavy, not with confusion, but with accumulation. She was walking forward into a single future, but she was dragging two pasts behind her, and she would not drop either of them. They were both hers.
