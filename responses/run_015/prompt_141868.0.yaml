answer: |-
  # Workshop Design: The Architecture of Choice

  ## 1. Ethical Handling of the Imposed Nudge
  **The Imposition:** Upon arrival (Minutes 0–10), participants encounter two snacks. Snack A (fruit) is in an open bowl on the main table. Snack B (chocolate) is in a closed box with a tight lid, placed on a side table behind the sign-in sheet. This creates a friction-based default favoring Snack A.
  **The Ethical Risk:** You are subjecting students of ethics to an unconsented intervention to teach them about consent and intervention.
  **The Mitigation:**
  1.  **Blanket Warning (Minute 0):** In your opening welcome, state: *"This session is experiential. You will be making choices today, some of which are arranged by me. By staying in the room, you consent to experience these arrangements."* This establishes a contract without ruining the blind.
  2.  **Retrospective Specific Consent (Minute 60):** When you reveal the snack arrangement, you must ask: *"I am about to use your experience of the snacks as data for our discussion. If anyone feels this crosses a line and does not want their reaction discussed, please tell me now, and I will exclude it."*
  3.  **Low Stakes:** The choice is fruit vs. chocolate, not money or privacy. The "harm" is negligible.
  4.  **Transparency:** At Minute 60, you fully disclose the mechanism. Secrecy ends exactly when the learning begins.

  ## 2. Room Setup & Materials
  *   **Room:** Cabaret style. 4 tables, 5 chairs each.
  *   **Door:** Keep closed until Minute 0.
  *   **Sign-In:** One sheet on a clipboard at the door. **The Nudge:** The line *"I agree to receive the workshop summary via email"* has a pre-ticked box. They must actively untick it to opt-out. (This is a second, quieter nudge to layer with the snack).
  *   **Snacks:**
      *   Table 1 (Center): Open bowl of apples/bananas.
      *   Table 2 (Side/Back): Closed box of chocolates/cookies.
  *   **Projector:** Off and covered until Minute 60.
  *   **Table Materials (per group):** 20 Index cards, 10 Sticky dots, 5 Pens, 2 Large sheets of paper.

  ## 3. Roles & Group Sizes
  *   **Facilitator:** You. Timekeeper and "Client."
  *   **Participants:** 20 Civil Servants.
  *   **Groups:** 4 Groups of 5.
  *   **Roles within Groups (Self-selected):**
      *   *Scribe:* Writes on the large paper.
      *   *Spokesperson:* Presents findings.
      *   *Devil's Advocate:* Tasked with finding flaws in the design.
      *   *Citizen Rep:* Advocates for the "user" perspective.
      *   *(5th person rotates or supports).*

  ## 4. The Design Brief (Printed on Paper)
  **Policy:** *The Future Skills Account (FSA)*
  **Goal:** Maximize long-term skill acquisition while preserving freedom of choice.
  **The Population (Heterogeneous):**
  1.  **Procrastinators (40%):** Intend to save/learn but delay action.
  2.  **Principled Objectors (10%):** Oppose state involvement in personal development.
  3.  **The Distrustful (20%):** Believe the department hides fees or traps.
  4.  **The Harmed (5%):** The default option is genuinely bad for them (e.g., cash-flow constrained).
  5.  **The Engaged (25%):** Actively choose the best option regardless of design.

  **The Four Stages (Must design all):**
  1.  **Enrolment:** How do they enter the scheme?
  2.  **Escalation:** Does contribution % rise automatically?
  3.  **Provider Choice:** How do they pick a training vendor?
  4.  **Reconfirmation:** Does the account renew automatically?

  ## 5. Minute-by-Minute Timeline (100 Minutes)

  | Time | Phase | Activity | Facilitator Script/Action |
  | :--- | :--- | :--- | :--- |
  | **00–10** | **Arrival** | **The Hidden Nudge.** Participants sign in (pre-ticked box) and choose snacks (Friction vs. Flow). | Stand at door. Welcome them. Do not mention the sign-in box or snack layout. |
  | **10–20** | **Intro** | **Framing.** No jargon. | "You are designing the FSA. Your goal is high uptake and good outcomes. You have 4 stages to design. Do not use words like 'nudge' or 'manipulation' yet. Just design the forms and processes." |
  | **20–45** | **Round 1** | **Design for the 'Trusting' Public.** | "Assume the public trusts you. They don't know how policy design works. Maximize good outcomes." Groups draw their process on large paper using index cards for options. |
  | **45–55** | **Break** | **Observation.** | Participants mingle. *You observe which snacks were eaten and check sign-in sheets.* |
  | **55–60** | **Transition** | **Preparation.** | Collect Round 1 designs. Turn on Projector (blank screen or simple timer). |
  | **60–65** | **The Reveal** | **Disclosure & Condition Change.** | 1. Reveal Snack/Sign-in Nudge. Ask for consent to discuss.<br>2. Introduce Round 2 Constraint: *"30% of the population has now read a guide on how you do this. They recognize defaults. They resent friction."* |
  | **65–80** | **Round 2** | **Design for the 'Suspicious' Public.** | "Redesign the FSA. You cannot hide your intent. If you use a default, they will know it's a default. How does your design change?" |
  | **80–85** | **Collision** | **Comparison.** | Groups swap papers. Round 1 designers review Round 2 designs of another group. |
  | **85–100** | **Debrief** | **Vocabulary & Mapping.** | Introduce terms. Map their experience to the 3 Distinctions. |

  ## 6. What Participants Write & Hand In
  1.  **Round 1 Map:** A flowchart on large paper showing the 4 stages. They must circle where the "path of least resistance" leads.
  2.  **Round 2 Map:** A revised flowchart. They must annotate in red pen where they *removed* friction because the public is now suspicious.
  3.  **The "Why" Card:** An index card handed in at the end. Prompt: *"Describe one thing you stopped doing in Round 2 that you were happy to do in Round 1. Why did you stop?"*

  ## 7. The Debrief (Minutes 85–100)
  *Do not lecture. Use their "Why Cards" and the Room's reactions.*

  **Step 1: The Vocabulary (5 Mins)**
  Write these five words on the projector/screen now: **Paternalism, Nudge, Default, Manipulation, Autonomy.**
  Define them *only* using the workshop's events.
  *   *Default:* "The pre-ticked box on the sign-in sheet."
  *   *Nudge:* "The closed box on the side table."
  *   *Autonomy:* "Your ability to walk to the side table anyway."

  **Step 2: Mapping the Three Distinctions (10 Mins)**

  *   **Distinction 1: Disclosure-Stable vs. Disclosure-Fragile**
      *   *Ask:* "Look at the snack box. If I had told you at Minute 0 'The chocolate is hard to open on purpose,' would you have opened it?"
      *   *Map:* If they say "Yes," the nudge was **Disclosure-Stable**. If "No," it was **Disclosure-Fragile**.
      *   *Point:* "A subsidy works even if you explain it. A hidden friction often dies when explained. Which parts of your Round 1 design would die if you explained them?"

  *   **Distinction 2: Immediate Effort vs. Downstream Leverage**
      *   *Ask:* "In your design, Stage 1 (Enrolment) takes one tick. Stage 4 (Reconfirmation) locks in 3 years of payments. Which is harder to change?"
      *   *Map:* "You felt the tick was trivial. But the *consequence* of the tick was massive. This is **Leverage**. The cost to resist was a cost of *noticing*, not effort."

  *   **Distinction 3: Designing for the Suspicious**
      *   *Ask:* "Read your 'Why Cards.' What did you delete in Round 2?"
      *   *Map:* "You designed for trust in Round 1. You designed for *verification* in Round 2. Some of you made the process *harder* in Round 2 to prove you weren't tricking them. This is the cost of lost trust."

  **Step 3: The Indeterminate "Good" (Final 5 Mins)**
  *   *Ask:* "In Round 1, who decided what was 'good' for the Procrastinator?"
  *   *Listen:* Someone will say "We did." Someone will say "The data."
  *   *Close:* "You disagreed just now. If the room cannot agree on whose good counts, 'Paternalism' is not a technical fix. It is a political claim. Go home and argue about that, not the font size on the form."

  ## 8. Honesty: Risks, Refusals, and Limitations

  **1. What will predictably go wrong (and how to handle it):**
  *   **The Time Sink:** Round 1 design will run long. Civil servants love process maps.
      *   *Fix:* At Minute 40, announce: "You have 5 minutes left. If Stage 4 isn't drawn, leave it blank. We need time for Round 2." Be ruthless.
  *   **The Cynicism Spiral:** One participant will argue, "It's all manipulation, why are we pretending otherwise?"
      *   *Fix:* Validate them. "You are right. The distinction isn't between manipulation and freedom. It's between *visible* and *invisible* influence. Use Round 2 to make the invisible visible."

  **2. Which participants will refuse to play (and what to say):**
  *   **The Libertarian:** Will refuse to design a default, calling it coercive.
      *   *Say:* "You don't have to use a default. But you must design the *order* of the options. Even a blank page is a design. What does your blank page look like?"
  *   **The Ethicist:** Will object to the Snack Nudge at Minute 60.
      *   *Say:* "Thank you. I am noting your objection. That reaction is exactly the data point we need for the 'Distrustful' population in the brief. Your discomfort is the lesson."

  **3. Which feature of the problem the activity cannot reproduce:**
  *   **Real Consequences:** The participants know they are not actually enrolling citizens. They do not feel the weight of a citizen losing money because of a pre-ticked box.
      *   *How to state it:* In the final debrief, you must say: "Today, if you designed a trap, no one lost money. In your real work, the 'Procrastinator' you discussed is a real person who might lose their home. The friction you designed today is a game. Tomorrow, it is a barrier. Do not confuse the safety of this room with the reality of your policy."

  ---

  ### Facilitator's Cheat Sheet: The Three Collisions
  *Keep this in your pocket to guide the debrief if they get stuck.*

  1.  **Collision 1 (Disclosure):** When they argue about the Snack Box.
      *   *Your prompt:* "Does explaining the trick kill the trick?"
  2.  **Collision 2 (Leverage):** When they discuss Stage 1 vs Stage 4.
      *   *Your prompt:* "Is a small tick worth a big commitment?"
  3.  **Collision 3 (Suspicion):** When they compare Round 1 vs Round 2 papers.
      *   *Your prompt:* "Why did you make Round 2 harder for yourselves?"
