      *   Debrief needs to highlight this shift.

  8.  **Predicting Failure Points:**
      *   Seniors might be *too* polite.
      *   Someone might ruin it by confessing immediately.
      *   Math might be confusing.
      *   The "lie" might feel too mean for a friendly group.
      *   *Mitigation:* Emphasize it's a simulation. Use "Bird Energy" not "Money."

  9.  **Structuring the Response:**
