  The dilemma works differently here. For the naturalist, "Good" *is* "Maximizes Happiness." There is no external commander. The "Arbitrariness" horn (Could happiness have been bad?) is a modal claim about natural properties. The Euthyphro dilemma is specifically about the relationship between *authority/will* and *value*. Applying it to naturalism is category confusion unless one is running the Open Question Argument. I will emphasize this distinction.

