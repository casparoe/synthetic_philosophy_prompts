prompt: |-
  Quick one for a seminar I'm running next term on impossibility results as a genre — Arrow, Condorcet, Gibbard–Satterthwaite, and I'm tempted to put the Fischer–Lynch–Paterson result alongside them, though I'm not at all sure it belongs.

  Before I moved into philosophy I spent six years writing backend distributed systems code, and I still think in that vocabulary much more fluently than in social choice theory: nodes, crash faults vs Byzantine faults, asynchrony vs partial synchrony, agreement/validity/termination, failure detectors, leader election, quorums, randomized protocols.

  So: restate Arrow's theorem in that vocabulary as carefully as you can — the social welfare function, unrestricted domain, weak Pareto, independence of irrelevant alternatives, and the dictatorship conclusion — mapping each onto a structural feature of a consensus problem, and flagging the places where you had to choose between two defensible mappings instead of quietly picking one.

  Two things me and my TA keep going back and forth on. Is unrestricted domain more like crashing nodes or like Byzantine ones, and is limiting the domain to single-peaked preferences more like assuming partial synchrony or more like assuming a failure detector? And: randomization is the standard way around FLP, random dictatorship is the standard way around Arrow's conclusion — is that the same move, or just a shared word?

  Then the residue report: which claims don't translate at all, and for each, whether that's a limit of my engineering vocabulary or a sign that Arrow's conditions are doing less work than they look like they're doing. If the whole analogy is bad, say which step breaks and why. And please say how confident you are in the translation overall, and single out the one claim you'd be least surprised to be wrong about.
