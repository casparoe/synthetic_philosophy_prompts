          *   *Sam:* Features exist independently; SAEs find them. (Realism)
          *   *Alex:* Features depend on the method (decoder, regularization). (Instrumentalism)
          *   *Analysis:* This is the core philosophical debate in mech interp. Is the polytope structure inherent, or is the basis choice arbitrary?
          *   *Verdict:* Alex is technically more correct about the *math* (basis is not unique), but Sam is more correct about the *utility/goal* (some bases align better with semantics). It's not a binary.

      *   **Point 2: The Role of the Decoder/Regularization**
