      *   **Two: Worked Case & Normalization.** Apply the translation to the Wetland/Health/Niece case. Address inter-theoretic comparison (normalization). Compare Unit-Range vs. Unit-Variance. Test for *Independence of Irrelevant Alternatives* (IIA) – does adding a dummy option change the ranking?
      *   **Three: Data/Updating.** What corresponds to "data" in moral uncertainty? Is there an out-of-sample test? Do weights update? If not, are weights just "confidence" rather than "probability"?
      *   **Four: Fixed Point.** One theory *is* a theory about uncertainty. Does including it create a recursion/fixed point problem? Is this a structural feature or a category error?
