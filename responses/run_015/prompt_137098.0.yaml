answer: |-
  **One. Restatement of Candidate Rules**

  In your vocabulary, the moral theories are structural models ($M_1, \dots, M_k$). They map actions ($A$) to a response variable, Choice-Worthiness ($CW$). The "moral uncertainty" problem is model selection or model averaging under structural uncertainty where the true data-generating process is unobservable.

  1.  **My-Favorite-Theory (MFT):**
      *   **Vocabulary:** Model Selection. You identify the single model with the lowest AIC (or highest posterior probability) and ignore the ensemble. You act to maximize $CW$ under $M_{best}$.
      *   **Quantity Maximised:** $CW_{M_{best}}(A)$.
      *   **Probabilities:** None used in the decision rule. Uncertainty is treated as zero once the "best" model is picked.
      *   **Analogue:** Ignoring model averaging and managing based on the top-ranked stock assessment model.
      *   **Failure Mode:** High risk if $M_{best}$ is structurally flawed (Type S error).

  2.  **Maximise Expected Choice-Worthiness (MEC):**
      *   **Vocabulary:** Model Averaging. You assign weights ($w_i$) to each theory analogous to AIC weights or posterior model probabilities. You calculate the weighted mean $CW$ for each action.
      *   **Quantity Maximised:** $E[CW] = \sum w_i \cdot CW_{M_i}(A)$.
      *   **Probabilities:** The weights $w_i$. [IMPORTED ASSUMPTION: These weights behave like probabilities summing to 1, implying the theories are mutually exclusive and exhaustive descriptions of a single underlying reality.]
      *   **Analogue:** Ensemble forecasting where you average predictions weighted by model fit.
      *   **Failure Mode:** Requires commensurability of $CW$ units across models (addressed in Section Two).

  3.  **Variance-Averse / Hedging:**
      *   **Vocabulary:** Risk-Adjusted Return or Robust Satisficing. You maximize $E[CW]$ minus a penalty for the variance of $CW$ across the model ensemble ($\sigma^2_{CW}$). Alternatively, you set a threshold $CW_{min}$ and maximize the probability of exceeding it.
      *   **Quantity Maximised:** $E[CW] - \lambda \cdot Var(CW)$ or $P(\sum w_i CW_{M_i} > \tau)$.
      *   **Probabilities:** Same as MEC, but the objective function penalizes disagreement among models.
      *   **Analogue:** Portfolio optimization or minimizing the risk of stock collapse across alternative recruitment hypotheses.
      *   **Failure Mode:** Still requires commensurable units to calculate variance across models.

  4.  **Deep Uncertainty (Non-Probabilistic):**
      *   **Vocabulary:** Minimax Regret or Info-Gap Robustness. You reject assigning probabilities $w_i$ because the set of theories is not exhaustive or the space is non-stationary.
      *   **Quantity Satisfied:** Minimize the maximum regret (difference between the $CW$ of the chosen act and the best act *had you known the true model*). Or, maximize the horizon of uncertainty $\alpha$ such that $CW$ remains above a critical threshold.
      *   **Probabilities:** None. Weights are replaced by an uncertainty set (e.g., "any weight combination is possible").
      *   **Analogue:** Managing for worst-case climate scenarios where probability distributions are contested.
      *   **Failure Mode:** Often yields conservative recommendations that may forfeit high gains; does not utilize "credence" information you feel you possess.

  **Two. The Estate Case and Normalization**

  We have three actions: $A_1$ (Wetland), $A_2$ (Health), $A_3$ (Niece).
  We have five models (Theories). Let $Y_{ij}$ be the raw Choice-Worthiness of Action $j$ under Model $i$.

  **The Commensurability Problem:**
  $Y_{i1}$ might be in "quality-adjusted life years" (Health Model), $Y_{i2}$ in "duty units" (Obligation Model), and $Y_{i3}$ in "intrinsic ecosystem value" (Wetland Model). You cannot sum these directly. You must standardize $Y$ to a dimensionless index before averaging.

  **Normalization Rules:**

  1.  **Unit-Range (Min-Max):** For each Model $i$, transform $Y_{ij}$ to $Z_{ij} = \frac{Y_{ij} - \min_j(Y_{ij})}{\max_j(Y_{ij}) - \min_j(Y_{ij})}$.
      *   *Effect:* Best action in every model gets 1, worst gets 0.
      *   *Analogue:* Rescaling indices to 0–1 before combining environmental indicators.

  2.  **Unit-Variance (Z-Score):** For each Model $i$, transform $Y_{ij}$ to $Z_{ij} = \frac{Y_{ij} - \mu_i}{\sigma_i}$.
      *   *Effect:* Centers each model on 0 with standard deviation 1.
      *   *Analogue:* Standardizing covariates before regression to compare effect sizes.

  **Can they disagree?**
  Yes. If Model 1 (Health) sees $A_2$ as vastly superior to $A_1, A_3$ (large range), and Model 2 (Niece/Obligation) sees $A_3$ as slightly superior to $A_1, A_2$ (small range):
  *   *Unit-Range:* Both models give their favorite a score of 1. They contribute equally to the average.
  *   *Unit-Variance:* Model 1's strong preference creates a large $\sigma$, shrinking the Z-score of $A_2$ relative to Model 2's tight clustering. Model 2's preference is amplified relative to Model 1.
  *   *Result:* The ranking of $A_2$ vs $A_3$ can flip depending on the normalization rule. [IMPORTED ASSUMPTION: That the "spread" of values in a theory indicates confidence or intensity, rather than just scale.]

  **Independence of Irrelevant Alternatives (IIA):**
  In a properly specified decision tree, adding a dominated branch ($A_4$) should not change the optimal choice between $A_1, A_2, A_3$.
  *   **Unit-Range Failure:** If you add a theoretical option $A_4$ that Model 1 rates as catastrophic (new minimum) but Model 2 rates as average, you change the denominator (range) for Model 1. This rescales *all* scores for Model 1. $A_2$'s normalized score changes even though $A_4$ is not chosen. The weighted sum changes. The winner can flip.
  *   **Unit-Variance Failure:** Adding $A_4$ changes $\mu_i$ and $\sigma_i$ for every model. All Z-scores shift. The ranking can flip.

  **Verdict on Sensitivity:**
  The recommendation *is* sensitive to the inclusion of options you would never choose. In ecology, this indicates a misspecified objective function or an inappropriate normalization.
  *   **Defect Location:** This is a defect in the aggregation method (voting paradoxes), not necessarily your normalization proposals alone. It suggests that "Choice-Worthiness" does not behave like a physical quantity (e.g., biomass) where ratios are stable. It behaves like a rank order. If the output is ordinal, averaging is mathematically suspect.
  *   **Implication:** There is likely no single ranking to be had that is invariant to the menu. The "optimal" action is a function of the *set of considered actions*, not just the actions themselves. This violates the standard decision-theoretic axiom of IIA.

  **Three. The Role of Data and Updating**

  In your work, model weights ($w_i$) are posteriors: $P(M_i | Data) \propto P(Data | M_i) P(M_i)$. They move because the system generates residuals you can measure.

  **The Moral Analogue:**
  *   **Out-of-Sample Test:** There is no equivalent. There is no "moral data" generated by the universe against which to test the predictive success of "Total Welfare" vs. "Special Obligations." You cannot observe the "true moral value" of the wetland to calculate a residual.
  *   **Shifting Weights:** No observation shifts a weight from 0.4 to 0.6. Weights shift only via *internal* reflection (argument, coherence checking), not *external* validation.
  *   **Updating:** There is no Bayesian updating in the technical sense. There is only "reflective equilibrium," which is akin to adjusting model structure to fit priors, rather than adjusting priors to fit data.

  **Is the Framing Decorative?**
  Yes, regarding the *probabilistic* interpretation. If you label weights "probabilities," you imply there is a frequency or a propensity to be measured. There is not.
  *   **Alternative Job:** The weights function as **Intensity of Commitment** or **Expert Elicitation Priors**. They represent how much risk you are willing to bear that a theory is wrong.
  *   **Survival of Framing:** The framing survives not because it is epistemic (tracking truth), but because it is *pragmatic*. It forces you to explicitize the trade-offs. It is a sensitivity analysis on your own convictions, not a measurement of the moral landscape.
  *   **Honesty:** Calling them "probabilities" is a category error. They are parameters in a utility function, not estimates of state.

  **Four. The Fixed Point**

  You have a set of models $\{M_1, \dots, M_k\}$. One model, $M_{meta}$, says: "Choose the action that maximizes $\sum w_i CW_{M_i}$."
  If $M_{meta}$ is included in the ensemble with weight $w_{meta}$, the equation becomes recursive. The value of an action depends on the average, which includes the value of the action determined by the average.

  **Structural Feature or Confusion?**
  It is a confusion of **Model** vs. **Method**.
  *   In ecology, you do not include "AIC Model Averaging" as a candidate hypothesis alongside "Ricker Recruitment" and "Beverton-Holt." AIC averaging is the *processor*, not a *process model*.
  *   $M_{meta}$ is the decision rule (the processor). $M_1 \dots M_{k-1}$ are the process models (the first-order theories).
  *   **Fixed Point:** If you force $M_{meta}$ into the ensemble, you are asking for a fixed point where the method validates itself. In your vocabulary, this is like weighting a model higher because it predicts that you will weight it higher.
  *   **Resolution:** Remove $M_{meta}$ from the ensemble. It is the algorithm running the averaging, not a row in the matrix.
  *   **Uniqueness:** If you keep it in, you risk non-convergence or circularity. If you treat it as the method, the problem dissolves. The "theory about uncertainty" is not a competitor; it is the protocol.

  **Five. The Residue Report**

  **Grade 1: Translates Cleanly**
  *   **Structure of Trade-offs:** The tension between Wetland (local, certain, non-anthropogenic) and Health (global, uncertain, anthropogenic) maps perfectly to spatial scale and risk trade-offs in conservation.
  *   **Hedging:** The intuition that one should not "bet the farm" on one moral theory maps cleanly to robust satisficing.
  *   **Value of Information:** The question "Should I spend more time thinking before deciding?" maps to Expected Value of Partial Information (EVPI). If the decision is insensitive to the uncertainty (e.g., Wetland wins under all plausible weights), further deliberation has zero value.

  **Grade 2: Translates with Distortion**
  *   **Probabilities/Weights:** As noted, these are not likelihoods. They are uncalibrated priors. Using them as probabilities imports a precision that does not exist. [IMPORTED ASSUMPTION: Coherence of credences.]
  *   **Commensurability:** Forcing "duty" and "welfare" onto a single $CW$ scale requires a normalization that is arbitrary (Range vs. Variance). In ecology, biomass is biomass. In morality, units are ontologically distinct. The distortion is hiding the unit conversion cost.
  *   **The Action Set:** In ecology, the action set is often constrained by physics. In morality, the "feasible set" is often part of the moral debate (e.g., is giving to the niece *permissible*?). Treating the menu as fixed imports an assumption that permissibility is settled before the calculation begins.

  **Grade 3: Cannot Be Expressed (The Residue)**
  *   **Ontological Truth:** Your suspicion is on target. Multi-model inference assumes a "True State of Nature" exists, even if unknown. The models approximate it.
      *   *Moral Realism:* If moral truths exist (like salmon abundance), averaging makes epistemic sense.
      *   *Moral Anti-Realism/Constructivism:* If moral truths are constructed by the theories themselves, there is no "system" to approximate. You are not averaging approximations of a truth; you are aggregating preferences.
      *   *The Gap:* If there is no moral reality, the "error" term in your model is not measurement error; it is *incompatibility*. You cannot average "The earth is flat" and "The earth is round" to get a better map. If theories are incompatible constructs, averaging is a political compromise, not an inference.
  *   **Agent-Relativity:** In ecology, the observer is ideally external. In this moral case, *you* are the system. The "Niece" option relies on *your* relationship. Standard decision theory assumes the agent is interchangeable. Your vocabulary struggles to encode "because it is *my* niece" without treating it as just another parameter, which misses the normative force of special obligation.

  **Final Verdict on the Residue:**
  The residue indicts the *original debate's* expectation that there is a single ranking to be had, rather than your vocabulary. Your vocabulary is rigorous enough to show that the moral problem is ill-posed.
  *   If you treat the weights as probabilities, you assume a truth exists (Realism).
  *   If you treat the weights as preferences, you are doing multi-criteria decision analysis, not inference.
  *   The "smooth paragraph" you rejected is the claim that these are the same. They are not.
  *   **Conclusion:** The framework works as a **decision aid** (clarifying trade-offs, checking robustness), but it fails as an **inference engine** (finding the truth). It tells you what you are committed to given your weights, not what is Right. If you want the latter, you need data that does not exist. If you want the former, your vocabulary is sufficient, provided you label the weights "commitments" and the normalization "arbitrary but necessary."
