  3.  **Drafting - Section by Section (Iterative refinement for tone and vocabulary):**

      *   *Tone:* Professional, precise, respectful of the user's expertise. No condescension. Acknowledge the limits of the analogy.
      *   *Vocabulary Check:* Use AIC, likelihood, posterior, structural uncertainty, minimax, regret, elasticity, IIA, commensurability.

      *   **Section One (Restatement):**
          *   MFT $\rightarrow$ Model Selection (pick best AIC).
          *   MEC $\rightarrow$ Model Averaging (AIC weights).
          *   Hedging $\rightarrow$ Robust Satisficing / Minimax Regret.
          *   Deep Uncertainty $\rightarrow$ Info-Gap / Non-probabilistic sets.
          *   *Crucial:* Define "Choice-Worthiness" as the response variable ($Y$). Define "Credence" as model weights ($w_i$).

      *   **Section Two (The Case & Normalization):**
          *   The Matrix: Rows = Options (Wetland, Health, Niece), Columns = Models (Theories). Cells = Choice-Worthiness ($CW$).
          *   Problem: $CW$ units differ (utils vs. duties vs. intrinsic value). Need standardization.
          *   Unit-Range (Min-Max): $CW' = (CW - min) / (max - min)$.
          *   Unit-Variance (Z-score): $CW' = (CW - mean) / sd$.
          *   *The IIA Test:* In ecology, adding a dominated option shouldn't flip the winner. In moral normalization (especially Unit-Range), adding a "dummy" extreme option changes the range, thus changing the scaling of *all* options, thus potentially flipping the ranking. This is a known failure mode in voting theory (Borda count analogues).
          *   *Verdict:* The recommendation *is* sensitive to the menu. This indicates the normalization is arbitrary or the aggregation method is flawed.

      *   **Section Three (Data/Updating):**
