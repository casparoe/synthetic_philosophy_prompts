      *   **Constraints:** Keep it short (memo style, actionable). Explicitly distinguish general precautionary features from specific details provided. No citations (user will supply).

  2.  **Deconstruct the Asymmetries & Hypothesis:**
      *   *Asymmetry 1 (Burden):* New = High Burden; Old = Low Burden.
      *   *Asymmetry 2 (Framing):* New Risk = Active Decision; Old Risk = Passive Background.
      *   *Hypothesis:* "Authorship of Risk" (Moral/Agency focus).
      *   *Alternative:* Epistemic focus (Known vs. Unknown).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** Acknowledge the puzzle and the "Authorship" hypothesis.
      *   **Implicit Theory Reconstruction:**
          *   *Responsibility:* Needs a distinction between *commission* (doing) and *omission* (allowing). It presupposes that causing a *new* state of affairs carries a higher justificatory burden than maintaining an *existing* one.
          *   *Risk:* Risk is not just probability $\times$ magnitude; it is probability $\times$ magnitude $\times$ *agency*.
          *   *Evidence:* Evidence standards are tied to the *act* of introduction, not the *state* of exposure.
          *   *Rival Views Ruled Out:* Utilitarianism (maximize safety regardless of source), Strict Liability for all exposure (regardless of history).
      *   **Are the Asymmetries the Same?**
          *   Asymmetry 1 (Burden) could be epistemic (we know less about new things).
          *   Asymmetry 2 (Framing) is distinctly moral/agency-based (omission vs. commission).
          *   *Conclusion:* They are compatible but distinct. Burden *could* be epistemic; Framing *must* be agential to hold the user's observation.
      *   **Underdetermination:**
          *   The practice is consistent with "Authorship" (Moral) BUT ALSO consistent with "Status Quo Bias" (Administrative efficiency) or "Epistemic Familiarity" (We know the old risks better).
          *   *Crucial Point:* If it's Epistemic, the regulator has a duty to update old data. If it's Moral (Authorship), they don't necessarily have that duty (the market actor introduced the risk, not the regulator).
      *   **Epistemic vs. Moral Cash-Out:**
          *   If Epistemic: "We know the old risks." *Implication:* Duty to review incumbents on a schedule. Current practice fails this if reviews are ad hoc.
          *   If Moral: "You broke it, you fix it." *Implication:* No duty to review incumbents until resources allow.
          *   *Test:* If the regulator claims epistemic justification but lacks a review schedule, the justification is false.
      *   **Symmetric Practice:**
          *   *Concept:* "Re-authorization." Every substance needs periodic approval.
          *   *Changes:* Shift burden of proof for incumbents to manufacturers (or regulator budget). Treat delay in substitution as an active approval of harm.
          *   *Losses:* Administrative cost, market stability, potential innovation chill (if uncertainty is too high for *all* chemicals).
      *   **Constraints Check:**
