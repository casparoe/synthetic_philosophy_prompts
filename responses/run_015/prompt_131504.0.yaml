answer: |-
  **MEMORANDUM**

  **TO:** Regulatory Policy Unit
  **FROM:** [Your Name/Role]
  **SUBJECT:** Reconstructing the Normative Basis of Asymmetric Risk Assessment

  You hypothesize that our asymmetries rest on an "authorship of risk" norm: we are answerable for hazards we *introduce*, not those we *permit to persist*. Below is a reconstruction of the theory this practice requires, tested against epistemic and moral justifications.

  ### 1. The Implicit Theory of Responsibility and Risk
  To sustain current practice, the regulator must presuppose three specific claims. These are not merely compatible with the practice; the practice collapses without them.

  *   **Responsibility (Commission vs. Omission):** We operate on a deontological constraint distinguishing *acting* from *allowing*. Introducing a new substance is an act of commission; leaving an old substance is an omission. Moral liability attaches primarily to the former. **[Specific to your framing asymmetry]**.
  *   **Risk (Dynamic vs. Static):** Risk is not defined solely by probability $\times$ magnitude. It is indexed to *change*. A static risk (incumbent) is treated as a "cost of doing business"; a dynamic risk (new entrant) is treated as a "liability." **[General to ex-ante precautionary regimes]**.
  *   **Evidence (Burden follows Agency):** The burden of proof lies with the agent altering the status quo, not with the regulator maintaining it. **[General to ex-ante precautionary regimes]**.

  **Rival Views Ruled Out:**
  This practice strictly rules out **act-utilitarianism** (which would demand banning the more toxic incumbent regardless of history) and **strict liability for exposure** (which would treat all human exposure as requiring equal justification, source notwithstanding).

  ### 2. Do the Two Asymmetries Presuppose the Same Thing?
  No. They are compatible but distinct.

  *   **Asymmetry 1 (Burden of Proof):** This *could* be epistemic. We may require more data for new substances simply because we lack historical data on them, whereas incumbents have a track record. This does not strictly require an "authorship" norm; it could rest on **informational asymmetry**.
  *   **Asymmetry 2 (Framing of Harm):** This *cannot* be purely epistemic. Treating the harm of delay as "background" rather than a decision outcome is a moral categorization of causality. It presupposes that the regulator is not the *author* of the harm caused by inaction.

  **Conclusion:** Asymmetry 1 is underdetermined (could be epistemic or moral). Asymmetry 2 is distinctly moral (authorship/agency).

  ### 3. Can the "Authorship" Reading be Cashed Out Epistemically?
  You ask if we justify this by saying, "We know the shape of the incumbent hazard."

  *   **The Test:** If the justification is epistemic (familiarity), the practice generates a **duty of surveillance**. We would be obligated to update evidence on incumbents on a fixed schedule to maintain that epistemic advantage.
  *   **The Gap:** Your description notes evidence is "decades old" and reviews happen "one at a time" without a schedule.
  *   **Implication:** The practice *cannot* be consistently defended on epistemic grounds unless we institute mandatory periodic review. If we refuse that duty, we admit the justification is moral (authorship), not epistemic. We are saying, "The market introduced this risk, not us," rather than, "We understand this risk."

  **Actionable Point:** If we claim epistemic familiarity, we are currently non-compliant with our own justification. We owe a schedule for re-evaluating incumbents.

  ### 4. What Would a Symmetric Practice Look Like?
  To treat the status quo as "newly authorized" each year (symmetry), we would need to shift from **Ex-Ante Authorization** to **Continuous Re-Authorization**.

  **Procedural Changes Required:**
  1.  **Sunset Clauses:** All registrations (incumbent and new) expire after a fixed term (e.g., 5 years).
  2.  **Comparative Risk Assessment:** When reviewing a substitute, the "do nothing" option must be quantified as an active choice to accept incumbent toxicity. The expected harm of delay becomes a line item in the decision matrix.
  3.  **Burden Shift:** For incumbents, the burden of proof shifts to the manufacturer to demonstrate continued safety, or to the regulator to budget for review.

  **What Would Be Lost:**
  1.  **Administrative Viability:** Reviewing the entire inventory periodically requires resources we likely do not have. The current asymmetry is a resource-rationality heuristic.
  2.  **Market Stability:** Constant re-authorization creates investment uncertainty for long-lifecycle chemicals.
  3.  **Moral Clarity:** It blurs the line between regulator and regulated. If we are responsible for the persistence of old hazards, we become liable for harms we did not originate, potentially paralyzing decision-making.

  ### 5. Summary Recommendation
  Your "authorship" hypothesis holds for the **Framing Asymmetry** but is not strictly required for the **Burden Asymmetry**.

  *   **If we wish to remain consistent:** We must stop claiming epistemic familiarity with incumbents as a justification for lower burdens.
  *   **If we wish to move toward symmetry:** We do not need to abandon the authorship norm, but we must acknowledge that *delay* is a form of authorship. We should implement **priority-based sunset clauses** for high-toxicity incumbents. This treats the *persistence* of high-risk chemicals as an active regulatory choice requiring justification, aligning our practice with the expected harm calculations you cite.

  **Decision:** The practice is philosophically stable only if we admit it is a resource-allocation strategy disguised as a moral distinction. If we want it to be moral, we must fund the review of incumbents. If we want it to be epistemic, we must generate the data. Currently, it is neither.
