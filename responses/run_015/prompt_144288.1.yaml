prompt: |-
  I'm taking a graduate seminar on the philosophy of international law, and last week our discussion of retroactivity at the post-war tribunals kept circling back to the same point: is the real problem nullum crimen sine lege, or is it something deeper about whether a legal order can claim authority over agents who never consented to be its subjects? That made me think there's a cluster of unresolved conceptual issues around victors' justice and retroactive law—particularly in comparing Nuremberg and Tokyo—that people often treat as settled historical curiosities, but that might actually have very different priorities depending on whether you care about transitional justice, the metaphysics of legal obligation, or the design of future international institutions. I want to work through this carefully, but I only have about one semester of focused effort and I'm approaching it from philosophy rather than legal history or archival research.

  Specifically, I'm trying to decide which of three open lines of work deserves the most sustained attention and in what order. First, there's the question of whether retroactive criminalization at Nuremberg and Tokyo violates the rule of law in a principled way, or whether it expresses a deeper principle—perhaps that legal authority can be reconstructed ex post facto when the prior order was itself radically illegitimate—such that the standard "victors' justice" objection misses the conceptual point entirely. Second, there's a more technical asymmetry that I think is underexplored: the Tokyo tribunal's treatment of superior orders and collective responsibility seems to presuppose a different theory of legal personality than Nuremberg's, and working out exactly what that implicit theory is might change how we think about institutional accountability and collective agency today. Third, there's the strategic or institutional question: if retroactive justice is conceptually defensible only under conditions of procedural fairness, then the interesting problem isn't whether Nuremberg was retroactive, but what procedural safeguards would make a retroactive mechanism legitimate rather than merely vengeful, and whether any existing framework of transitional justice actually captures those conditions.

  Given these three directions, I want a defended agenda rather than a survey. Which question is upstream of the others in the sense that settling it would change how we should approach the remaining two? Which is most tractable for someone without access to primary archival materials in Japanese or German? And which should I deprioritize because resolving it clearly wouldn't actually shift much in how philosophers or institutional designers think about retroactive authority? Please defend your ordering with explicit criteria—importance relative to long-term institutional design, tractability with current conceptual tools, downstream dependence among the questions, and what counts as failure or a dead end for each line. Write your response as continuous prose in the manner of a thoughtful letter, with no headings, no bullet points, no bold text, and no tables.
