answer: |-
  I am writing to you because your intuition about the unresolved conceptual issues surrounding retroactivity and victors' justice is correct, and because the constraint of a single semester demands a strategic choice rather than a comprehensive survey. You have identified three distinct lines of inquiry, but they are not equal in terms of their logical priority or their suitability for a philosophical approach devoid of archival linguistic capabilities. If I were to advise you on how to structure this semester to produce the most philosophically robust and impactful work, I would argue that you must treat the first question regarding the metaphysics of legal authority and retroactivity as the foundational project, proceed to the third question regarding procedural safeguards as its necessary practical extension, and deliberately deprioritize the second question concerning the asymmetry between Tokyo and Nuremberg. This ordering is not arbitrary but follows from the logical dependence of the questions, the tractability of the methods available to you, and the potential for each line to shift the discourse on international legal authority.

  The first line of work, which asks whether retroactive criminalization violates the rule of law or expresses a deeper principle of reconstructed authority, is strictly upstream of the other two. You cannot coherently design procedural safeguards for a retroactive mechanism, which is the core of your third question, until you have established that such a mechanism is conceptually possible within a legal order. If the principle of nullum crimen sine lege is absolute, then no amount of procedural fairness can legitimize the tribunals, and the project of transitional justice design collapses into mere power politics. Conversely, if you can successfully argue that legal authority can be reconstructed ex post facto when the prior order was radically illegitimate, you create the normative space in which the third question becomes vital. This line of inquiry is also the most tractable for a philosopher working without primary archival materials. It relies on conceptual analysis of consent, obligation, and the nature of law itself, engaging with existing literature in legal positivism and natural law theory rather than requiring translation of Japanese or German court transcripts. The risk of failure here lies in merely reheating the debates between Hart and Fuller without advancing the specific argument about radical illegitimacy; you would fail if you concluded only that there is a tension between justice and legality, rather than offering a principled account of how legality itself transforms when the sovereign power collapses.

  Once you have established the conceptual possibility of retroactive authority, the third question regarding procedural safeguards becomes the immediate priority. This is where your philosophical work connects to institutional design. If retroactivity is defensible only under conditions of procedural fairness, then the philosophical task is to define the necessary and sufficient conditions for that fairness in a non-consensual environment. This is highly relevant to future international institutions because it moves beyond the historical curiosity of Nuremberg to the normative design of future transitional justice mechanisms. It is tractable because it allows you to engage with contemporary political philosophy and institutional design theory without needing to uncover new historical facts. However, this line is dependent on the first; if you have not solved the authority problem, the procedural question is moot. Failure in this line would look like producing a checklist of procedural values that lacks a grounding theory of why those procedures confer legitimacy on an otherwise retroactive law. You must avoid the trap of treating procedure as a mere cosmetic fix for the substantive problem of authority, which you will have addressed in the first phase.

  I recommend deprioritizing the second line of work concerning the asymmetry between the Tokyo and Nuremberg tribunals regarding superior orders and collective responsibility. While this is a fascinating topic, it is downstream of the first two questions and significantly less tractable given your constraints. To convincingly argue that Tokyo presupposed a different theory of legal personality than Nuremberg requires a granular analysis of the judicial reasoning found in the judgments and transcripts. Without access to primary materials in Japanese, you risk relying on secondary literature that may already impose interpretive frameworks you wish to critique. Furthermore, resolving this question would not shift the core philosophical problem of retroactive authority as much as the other two lines. Even if you prove that Tokyo had a richer or poorer theory of collective agency, that finding does not solve the problem of whether the tribunal had the right to judge ex post facto. It is a question of application rather than foundation. For a one-semester project, this line poses the highest risk of becoming a historical comparison that lacks philosophical bite, or worse, a speculative claim about implicit theories that cannot be substantiated without the linguistic tools to verify the nuance of the legal texts. You should treat this not as a central pillar of your argument but perhaps as a illustrative case study only if it naturally serves the arguments developed in the first two lines.

  Your agenda should therefore flow from the metaphysical to the institutional, leaving the comparative historical analysis aside unless it serves the former. Start by defending the claim that legal authority can emerge retroactively when the prior regime forfeited its claim to legality through radical illegitimacy, thereby neutralizing the strict nullum crimen objection. Use this to ground a theory of procedural legitimacy that distinguishes lawful retroactive justice from victors' vengeance. This approach ensures that your work is logically coherent, methodologically sound given your limitations, and focused on the questions that actually determine how we understand the possibility of international law itself. If you attempt to tackle the Tokyo asymmetry first, you may find yourself mired in historical detail that does not resolve the upstream problem of authority, leaving your semester without a definitive philosophical contribution. By securing the foundation of authority first, you ensure that any subsequent discussion of procedure or historical application rests on solid ground, maximizing the impact of your work on both philosophical theory and the design of future institutions.
