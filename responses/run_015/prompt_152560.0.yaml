answer: |-
  # Decision Tree: Substantive Commitments on Old Evidence

  **Shared Case:** An agent assigns credence 1 to $E$ (e.g., Mercury's perihelion) and then learns that theory $H$ entails $E$.

  **Node 1:** Is evidential support measured against an unconditional prior independent of the agent's current conditioning state?
  *   **Yes** $\rightarrow$ **Leaf 3** (Objective Logical Prior)
  *   **No** $\rightarrow$ Go to Node 2

  **Node 2:** Is confirmation purely synchronic, independent of belief dynamics?
  *   **Yes** $\rightarrow$ **Leaf 4** (Comparative/Atemporal)
  *   **No** $\rightarrow$ Go to Node 3

  **Node 3:** Does recognizing $H \models E$ introduce genuinely new information eligible for updating?
  *   **No** $\rightarrow$ **Leaf 1** (Old Evidence Silent)
  *   **Yes** $\rightarrow$ Go to Node 4

  **Node 4:** Is the update executed via standard conditionalization on a single new proposition?
  *   **Yes** $\rightarrow$ **Leaf 2** (Update is Entailment)
  *   **No** $\rightarrow$ Go to Node 5

  **Node 5:** Does the updating rule assign distinct weights to propositional certainty versus explanatory linkage?
  *   **Yes** $\rightarrow$ **Leaf 5** (Weighted Split)
  *   **No** $\rightarrow$ **Unoccupied** (See diagnosis below)

  ***

  ### Leaf Definitions
  1.  **Old Evidence Silent:** The prior is already $E$-conditional, so no belief revision occurs.
  2.  **Update is Entailment:** Recognizing $H \supset E$ introduces genuinely new information, allowing $E$ to support $H$.
  3.  **Objective Logical Prior:** Evidential support is measured against an unconditional prior, independent of the agent's current conditioning state.
  4.  **Comparative/Atemporal:** Old and new evidence stand in the same support relation, and the problem confuses belief dynamics with evidential structure.
  5.  **Weighted Split (Non-Standard):** Propositional oldness and explanatory oldness are split and assigned different weights in the updating rule.

  ***

  ### Structural Diagnostics

  **Separation Status:**
  None: All five leaves are formally distinguished by the path.

  **Path to Leaf 5 (Weighted Split):**
  Node 1 (No) $\rightarrow$ Node 2 (No) $\rightarrow$ Node 3 (Yes) $\rightarrow$ Node 4 (No) $\rightarrow$ Node 5 (Yes).
  *Diagnosis:* Merely unattractive due to the introduction of ad-hoc weighting parameters without independent justification.

  **Unoccupied Combinations & Diagnosis:**
  *   **Node 3 (No) + Node 4 (Yes):** Incoherent; one cannot conditionalize on a proposition if no new information is introduced.
  *   **Node 3 (Yes) + Node 4 (No) + Node 5 (No):** Incoherent; posits new input but denies it standard or weighted integration mechanism.
  *   **Node 1 (Yes) + Node 2 (No):** Tense; objective priors typically entail synchronic evaluation, making diachronic commitment unstable.
