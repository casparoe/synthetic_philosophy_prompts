answer: |-
  This is a fantastic pivot for a seminar. You are effectively moving students from *abstract* metaethics ("Do moral properties exist?") to *institutional* metaethics ("What ontology does this practice enact?"). This bypasses the stalemate by showing that institutions often operate on a "working metaphysics" that doesn't care about the truth of realism but cares deeply about the *administrability* of value.

  Your intuition about **"Axiological Locality"** is spot on. In fact, it's a more precise diagnostic tool than the realism/anti-realism binary for this specific case.

  Here is a reconstruction of the implicit theory, a breakdown of what the practice requires vs. what fits, and an analysis of the "dignity" contradiction, designed to help you structure the seminar.

  ### 1. Reconstructing the Implicit Theory: "Administrative Naturalism"

  The reparations body is operating under a framework we might call **Administrative Naturalism**. This is not necessarily a committed philosophical stance, but a procedural ontology that functions *as if* the following premises are true:

  1.  **The Trace Principle:** An injury counts as a public debt (compensable by the state) only if it leaves a trace that is inter-subjectively verifiable without relying on the victim's internal testimony alone. Physical wounds and economic losses leave such traces; "moral injury" or "erased identity" does not.
  2.  **The Causal Hierarchy:** Physical/Economic harm is primary; Moral/Psychological harm is secondary (a reaction to the primary harm). Therefore, the state owes *restitution* for the primary harm but only *care* for the secondary reaction.
  3.  **Axiological Locality:** Value (and disvalue) must be locatable in a specific, measurable substrate (a body, a bank account, a property). If value cannot be localized to a physical bearer, it cannot be quantified for transaction.

  **The Metaethical Presupposition:**
  This practice does **not** require Moral Realism. In fact, it leans heavily toward a **Response-Dependent Anti-Realism** regarding moral harm.
  *   **Physical Harm:** Treated as *Mind-Independent*. (Your leg is broken regardless of how you feel about it.)
  *   **Moral Harm:** Treated as *Mind-Dependent*. (Your dignity is violated only insofar as you experience trauma.)

  By routing moral harm to counseling, the institution is saying: *"The violation of your moral status is not an objective debt we owe you; it is a subjective disturbance we will help you manage."*

  ### 2. Realism, Anti-Realism, and Non-Natural Properties

  You asked if this requires a realist stance where moral harms must be anchored in physical states.

  *   **Does it require Realism?** No. A Moral Realist could argue that moral harms are objective facts *but* epistemically inaccessible to a bureaucracy. However, the funding split suggests something stronger: it treats moral harm as *ontologically distinct* from material harm. It treats moral injury as a *symptom*, not a *wound*.
  *   **Does it allow Non-Natural Properties?** Absolutely not. If moral violations involved non-natural properties (e.g., a Kantian violation of the Categorical Imperative that exists independently of psychological impact), the state would owe a debt regardless of whether the victim needed counseling. The fact that compensation is contingent on "psychosocial impact" implies there is no non-natural property being violated that demands restitution.
  *   **Does Anti-Realism license the split?** Yes, most comfortably. If morality is a projection of sentiment, the state cannot "pay back" a sentiment. It can only treat the distress caused by the frustration of that sentiment.

  ### 3. The "Human Dignity" Contradiction

  You noted the inconsistency with charters invoking "human dignity." This is the strongest point of tension for your students to analyze.

  *   **The Charter Language:** Usually implies **Status Realism**. Dignity is an intrinsic, non-fungible property of persons. Violating it creates a normative debt that exists independently of the victim's psychological state.
  *   **The Funding Practice:** Implies **Psychological Consequentialism**. Dignity is valuable only insofar as its violation causes measurable distress.
  *   **The Contradiction:** If dignity is intrinsic (Realist), violating it is a *wrong* that demands *rectification* (compensation). If dignity is merely a source of psychological well-being (Anti-Realist/Local), violating it is a *harm* that demands *healing* (therapy).
  *   **The Institutional Move:** The body wants the *legitimacy* of the Realist language (to sound noble) without the *liability* of the Realist ontology (which would be bankrupting). They want to speak as if dignity is sacred, but pay as if it is sentimental.

  ### 4. Axiological Locality: Requirement vs. Fit

  This is the crux of your seminar intervention. You need to distinguish between what the practice *strictly requires* and what merely *fits well*.

  **What Strictly Required (The Hard Constraints):**
  1.  **Quantifiability:** The harm must be translatable into a common metric (currency).
  2.  **Causal Tracing:** There must be a clear chain of custody from perpetrator to victim to loss.
  3.  **Axiological Locality:** The value must reside in a discrete object/event.

  **What Merely Fits (The Soft Constraints):**
  1.  **Physicalism:** It *fits* to say only physical things are real, but the practice could theoretically quantify non-physical things if they were localizable (e.g., "reputation points" in a social credit system).
  2.  **Anti-Realism:** It *fits* to treat moral harm as subjective, but a Realist could agree to this split for pragmatic reasons (epistemic humility).

  **The Verdict:** The practice does not require Anti-Realism about morality *per se*. It requires **Administrative Reductionism**. It requires that all values be reducible to local, measurable states. "Axiological Locality" is doing the philosophical work, not the realism/anti-realism distinction. Realism is rejected only because non-local moral facts are administratively invisible.

  ### 5. Dropping Axiological Locality: The Counterfactual

  If you asked your students to redesign the reparations rules by **dropping Axiological Locality** (allowing value to exist in non-local, relational, or normative spaces), what changes?

  1.  **From Therapy to Restitution:** "Moral Injury" moves from the counseling budget to the compensation ledger. You are paid for the *violation itself*, not just the trauma it caused.
  2.  **Symbolic Reparations as Material:** Apologies or truth-telling are no longer "soft" options; they become currency. If dignity is non-local and relational, restoring the relationship *is* the payment.
  3.  **Collective Liability:** If harm isn't localized to individual bodies, then harm to the "social fabric" is compensable. The community gets paid, not just the individual.
  4.  **No "Trauma" Requirement:** A victim who was subjected to degrading rituals but is psychologically resilient (perhaps due to community support) would still be owed compensation. The *wrong* was done, regardless of the *impact*.

  ### 6. Seminar Strategy: The "Ontological Budget"

  To break your students out of the loop, try this exercise:

  1.  **The Budget Sheet:** Give them a mock reparations budget. Line Item A: Broken Legs ($1M). Line Item B: Dignity Violations ($0, routed to Counseling).
  2.  **The Audit:** Ask them to act as "Metaethical Auditors." They cannot change the budget, but they must write the *philosophical justification* for it.
  3.  **The Conflict:** Half the class must justify it using Moral Realism (good luck explaining why real moral harms aren't compensable). Half must use Anti-Realism (good luck explaining why "dignity" is in the charter if it's just feelings).
  4.  **The Solution:** Introduce **Axiological Locality**. Show that the budget isn't about *truth*; it's about *transactional ontology*. The state isn't asking "Is morality real?" It is asking "Is morality *billable*?"

  **Addressing your framing:** You didn't misspell anything; your framing is philosophically robust. "Axiological Locality" is a precise way to describe the commitment to **supervenience on the physical** required by bureaucratic accountability.

  This approach shifts the question from *"What is the nature of morality?"* to *"What nature of morality can this institution process?"* That is often where the actual philosophy is happening in the real world.
