answer: |-
  ### Specification for an Adequate Account

  To count as adequate, an explanation of the end of Roman government must satisfy the following requirements:

  1.  **Divergence:** Explain why identical institutions survived in the East but failed in the West despite shared enemies, revenue systems, and political language.
  2.  **Tempo:** Reconcile slow structural shifts (fiscal/military capacity) with punctual trauma (Sacks, 476) remembered by contemporaries.
  3.  **Continuity:** Define transformation versus collapse using concrete markers (tax collection efficacy, law enforcement) rather than the mere presence of institutions (Senate, bishops, estates).
  4.  **Region:** Account for total breakdown (Britain), assimilation (Gaul/Italy), and conquest (Africa) without relying on a single unified cause.
  5.  **Evidence:** Establish a hierarchy when literate texts (biased, elite) contradict material records (pottery, settlement size, coin hoards).

  **The Evidence Problem**
  An adequate account must privilege material evidence regarding economic capacity and textual evidence regarding political intention. When texts claim order but archaeology shows abandonment, the account must declare the text wrong. Silence in the material record outweighs rhetoric in the literary record.

  **Your Requirement (Legibility)**
  This belongs on the list only if narrative fidelity outweighs structural truth. It costs the ability to cite invisible causes (climate shifts, epidemiology, long-term economic cycles) unavailable to actors. It restricts explanation to motives and observations accessible to your characters. If you enforce this, you sacrifice deep structural analysis for psychological immediacy.

  **Classification and Trade-offs**
  *   **Non-Negotiable:** Regional Variation, Evidence Hierarchy, Continuity Definition. (Any account failing these is demonstrably false.)
  *   **Preferences:** East/West Symmetry, Contemporaneous Legibility. (These refine the argument but restrict scope.)

  **Incompatible Triples:** You cannot satisfy **Single Cause + Regional Variation + Contemporaneous Legibility**. A single cause ignores regional difference. Deep structural causes violate legibility. You must drop one.

  **The Eliminator:** **Regional Variation** eliminates the largest share of familiar explanations. Most monolithic theories (moral decay, single economic collapse) fail because Britain and Africa broke differently.

  **Verdicts on Standard Families**

  | Family of Explanation | Verdict |
  | :--- | :--- |
  | **Moral Decay** | Fails evidence hierarchy; texts claim decay, material record shows capacity. |
  | **Catastrophic Collapse** | Fails continuity; ignores survival of law and estates into the sixth century. |
  | **Transformation** | Fails regional variation; often smooths over total breakdown in Britain. |
  | **Structural/Economic** | Fails legibility; relies on data invisible to contemporaries. |
  | **Military Failure** | Fails divergence; cannot explain why the East survived similar pressures. |
