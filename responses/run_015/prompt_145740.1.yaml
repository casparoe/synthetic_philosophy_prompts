  The upstream question is whether quantum mechanics introduces ontological randomness, as this is the only physical theory that currently challenges the necessitation of future states by past states. If quantum events are truly indeterministic, classical chaos becomes irrelevant to the fundamental status of determinism, though it remains relevant for macroscopic prediction. Downstream of physics is the free will debate, which relies on these definitions. If you seek libertarian free will, you need ontological indeterminism, which chaos cannot provide since it is deterministic. If you are a compatibilist, neither chaos nor quantum randomness matters much, as freedom is defined by agency rather than causal openness. Consequently, focusing on predictability as a test for determinism is a category error that stalls progress, while clarifying the layer of physics you are discussing prevents conflating classical unpredictability with quantum indeterminacy.
