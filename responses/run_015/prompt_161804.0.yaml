  **Model Answer**

  (a) For an arbitrary citizen $i$, expected utility is linear in probabilities. In Problem 1, $EU_i(A) = u_i(1\text{m})$. Option B yields £1m with probability 0.89, £5m with probability 0.10, and £0 with probability 0.01. Thus $EU_i(B) = 0.89u_i(1\text{m}) + 0.10u_i(5\text{m})$. The difference is:
  $$ \delta_i = EU_i(B) - EU_i(A) = 0.10u_i(5\text{m}) - 0.10u_i(1\text{m}). $$
  In Problem 2, $EU_i(C) = 0.11u_i(1\text{m})$ and $EU_i(D) = 0.10u_i(5\text{m})$. The difference is:
  $$ EU_i(D) - EU_i(C) = 0.10u_i(5\text{m}) - 0.11u_i(1\text{m}). $$
  Wait, we must account for the £0 outcome in B properly to match the prompt's urn structure. Red (0.89) gives £1m in B. White (0.11) splits into 10/11 (£5m) and 1/11 (£0). So B is 0.89 on £1m, 0.10 on £5m, 0.01 on £0.
  $EU_i(A) = 0.89u_i(1) + 0.10u_i(1) + 0.01u_i(1)$.
  $EU_i(B) = 0.89u_i(1) + 0.10u_i(5) + 0.01u_i(0)$.
  Difference $\delta_i = 0.10[u_i(5) - u_i(1)] + 0.01[u_i(0) - u_i(1)]$.
  Given $u(0)=0$, $\delta_i = 0.10u_i(5) - 0.11u_i(1)$.
  For Problem 2, C is 0.89 on £0, 0.11 on £1m. D is 0.89 on £0, 0.10 on £5m, 0.01 on £0 (total 0.90 on £0).
  $EU_i(C) = 0.11u_i(1)$. $EU_i(D) = 0.10u_i(5)$.
  Difference $= 0.10u_i(5) - 0.11u_i(1)$.
  The quantities are identical. $\delta_i > 0$ if $u_i(5\text{m}) > 1.1 u_i(1\text{m})$. This condition is undemanding; it permits substantial risk aversion (e.g., logarithmic utility satisfies it). Consequently, plausible citizens will have $\delta_i > 0$, unanimously preferring B to A and D to C. Since $F$ is increasing, it respects unanimity. The Allais pattern requires $A \succ B$ (implying $\delta_i < 0$ for the decisive coalition) alongside $D \succ C$ ($\delta_i > 0$). Since $\delta_i$ is constant across problems, the social ranking cannot reverse unless $F$ weights individuals differently based on utility levels. However, given the condition is so weak, it is reasonable to assume all $\delta_i > 0$, making the reversal impossible under any Pareto-inclusive $F$.

  (b) Let $n=2$ and $F$ be leximin. Consider lotteries defined by utility vectors: $L=(10, 20)$, $M=(15, 15)$, $R=(100, 0)$.
  Leximin ranks $M$ above $L$ because $\min(15,15) > \min(10,20)$.
  Let $\alpha = 0.5$. The mixed lotteries are:
  $\alpha L + (1-\alpha)R = (55, 10)$. Minimum is 10.
  $\alpha M + (1-\alpha)R = (57.5, 7.5)$. Minimum is 7.5.
  Leximin now ranks the mixture of $L$ above the mixture of $M$.
  The structural feature is a change in the identity of the worst-off individual. In the comparison of $L$ and $M$, citizen 1 is the constraint; in the mixture, citizen 2 becomes the constraint. This feature is absent in part (a) because the difference vector $\vec{\delta}$ is identical in both problems. Under the plausible assumption that all $\delta_i > 0$, there is no conflict between individuals to be resolved by changing weights; everyone agrees on the direction of preference, so the 'worst-off' status regarding the *difference* does not swap in a way that reverses the aggregate sign.

  (c) Let $W(L) = \sum_s p(s) F(\mathbf{u}(s))$. Consider lotteries $L, M, R$ and weight $\alpha$. The mixture $\alpha L + (1-\alpha)R$ yields state $s$ with probability $\alpha p_L(s) + (1-\alpha)p_R(s)$.
  $$ W(\alpha L + (1-\alpha)R) = \sum_s [\alpha p_L(s) + (1-\alpha)p_R(s)] F(\mathbf{u}(s)) $$
  $$ = \alpha \sum_s p_L(s) F(\mathbf{u}(s)) + (1-\alpha) \sum_s p_R(s) F(\mathbf{u}(s)) = \alpha W(L) + (1-\alpha)W(R). $$
  This linearity in probabilities ensures independence holds. The contrast shows that violations of independence in social choice arise from aggregating risk attitudes ex-ante (applying $F$ to expected utilities), where inequality aversion interacts non-linearly with risk. Ex-post evaluation applies inequality aversion to certain outcomes within states, preserving the linearity of expectation.

  **Marking Scheme**

  **Total: 20 Marks**

  **Part (a) [7 Marks]**
  *   **Correct Calculation (3 marks):** Derives $\delta_i = 0.10u_i(5) - 0.11u_i(1)$ for both problems. Must explicitly use $u(0)=0$ and the reduced probabilities.
  *   **Condition & Demand (2 marks):** States condition $u(5) > 1.1u(1)$. Correctly identifies this as undemanding/consistent with standard risk aversion.
  *   **Impossibility Argument (2 marks):** Explains that if $\delta_i$ has the same sign for all $i$ (plausible given the condition), unanimity holds. An increasing $F$ must respect unanimity, preventing the preference reversal required for the Allais pattern.
  *   **Penalty:** Deduct 2 marks if the candidate claims aggregation *can* produce Allais here by appealing to heterogeneity without addressing why the specific condition makes unanimity likely, or fails to link the constant $\delta_i$ to the impossibility of reversal under unanimity.

  **Part (b) [7 Marks]**
  *   **Counterexample (3 marks):** Specifies valid vectors for $L, M, R$ and $\alpha$. Numerical values must demonstrate $M \succ L$ initially and $L_{mix} \succ M_{mix}$ subsequently under leximin.
  *   **Structural Feature (2 marks):** Identifies the switch in the identity of the worst-off individual (or the binding constraint) as the cause of the violation.
  *   **Contrast with (a) (2 marks):** Explains that in (a), the constant difference vector combined with plausible unanimity prevents the binding constraint from swapping in a way that reverses the social preference.
  *   **Penalty:** Deduct 2 marks if the numerical example fails to produce a reversal (e.g., leximin ranking remains consistent) or if the candidate attributes the violation to 'risk aversion' rather than the changing identity of the worst-off.

  **Part (c) [6 Marks]**
  *   **Proof (4 marks):** Shows linearity of the ex-post welfare function in probabilities. Must explicitly write out the summation over states for the mixture and separate the terms.
  *   **Contrast/Moral (2 marks):** Clearly distinguishes ex-ante (F on EUs) from ex-post (F on outcomes). States that ex-ante aggregation allows inequality aversion to distort independence, whereas ex-post evaluation preserves it via the linearity of expectation.
  *   **Penalty:** Deduct 2 marks if the proof assumes $F$ is linear (it is not) rather than relying on the linearity of the probability sum, or if the explanation conflates ex-ante and ex-post definitions.

