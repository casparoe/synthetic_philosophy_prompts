  # INSTRUCTOR'S COMMENTARY ON VIABILITY AND EPISTEMIC DEMEANOR

  *(Note: This section is for your evaluation of the assignment's design and the document's stability. It is not intended for student distribution without editing.)*

  ### 1. Viability of Shared Claims
  *   **Attribution Asymmetry:** I expect **Party B (Revisionist)** to balk at the phrasing in Claim 2. While they may accept that counterfactuals are hard to trace, they often argue that the harms of retention (e.g., systemic injustice) are *also* hard to observe for those not experiencing them. I have hedged this by specifying "structurally harder to attribute," but a sharp Revisionist may argue this privileges the status quo by defining "harm" through the lens of visible disruption. **Confidence:** High.
  *   **Selection Claim:** Claim 3 is the most fragile. Party A means "function" (benefit); Party B means "causal efficacy" (which could be oppression). I have used "doing something to sustain its own persistence" to bridge this. However, if Party B is a radical reconstructionist, they may deny survival implies *any* rational selection, viewing it purely as power. **Confidence:** Medium-High. This holds only because of the hedge "doing something" rather than "serving a good purpose."

  ### 2. Disagreements Table Analysis
  *   **Crux 1 (Default Setting):** This is the core normative disagreement. It is **Genuine**. No amount of evidence will resolve this without one side conceding their normative baseline.
  *   **Crux 4 (Scope):** I have marked this **Verbal/Conceptual**, but it risks being Genuine. If Party A believes spontaneous orders have "purposes" (teleology) and Party B believes they are merely "forces" (causality), they are talking past each other. The table attempts to capture this, but students may find they cannot agree on what counts as a "Fence."
  *   **Crux 5 (Character vs. Evidence):** This is the deepest philosophical rift. A sees the Fence as a virtue ethic (humility); B sees it as an evidentiary heuristic. This is **Genuine**.

  ### 3. Case Study Design
  *   **Case I (Licensing):** This is a strong case. It stacks the deck slightly toward the Custodian by providing "thin testimonial evidence" of a hidden function. A Revisionist might reject the testimony as anecdotal.
  *   **Case II (Unbuilt Fence):** This is the strongest test of the principle's limits. It exposes whether the Custodian is committed to *status quo* (even omissions) or *designed constraints*.
  *   **Case III (Racist Origin):** This tests the "Genetic Fallacy." The Custodian must argue for exaptation; the Revisionist for tainted inheritance. This is well-balanced.
  *   **Case IV (Reversibility):** This is the critical pivot. I have recorded the Custodian's likely objection as "instability costs." If your students playing Party A do not accept this diagnosis (i.e., if they argue reversibility *is* possible), the collaboration succeeds. If they insist reversibility is impossible, the principle collapses into absolute conservatism.

  ### 4. Potential Confusions in Framing
  *   **The "Burden of Proof" Ambiguity:** The prompt asks about the burden of proof. In law, this is procedural. In epistemology, it is about justification. The document treats it as normative (who must justify). Ensure students understand they are arguing about *normative presumption*, not just evidentiary standards.
  *   **The Belief Analogy:** I excluded it as requested. If you choose to include it, warn students that social practices are *coordination equilibria* while beliefs are *truth claims*. Conflating them leads to the naturalistic fallacy.
  *   **Signability:** A hardline Burkean (Party A) may refuse to sign Claim 1 ("Complexity Premise") if they believe tradition *is* reason (i.e., we don't need to predict effects because tradition *is* the prediction). A hardline Rationalist (Party B) may refuse Claim 3 ("Selection Claim") if they view history as purely contingent. The document assumes moderate versions of both positions.

  ### 5. Recommendation for Seminar Use
  Assign the document *without* the Instructor's Commentary initially. Ask students to identify where they feel the "hedges" are weakest. Then, reveal the Commentary to discuss whether the "Shared Claims" are substantive or merely polite ambiguities. This meta-discussion on the possibility of collaboration itself may be the most valuable part of the seminar.
