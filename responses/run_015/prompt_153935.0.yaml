answer: |-
  **MEMORANDUM**

  **TO:** Research Reproducibility Board
  **FROM:** [Your Name/Chair]
  **DATE:** Thursday, October 24, 2024
  **SUBJECT:** Decision Memo – Grant Application #24-09 – Sequential Bayesian Replication

  **Bottom Line Decision**
  **Approve with Conditions.** The board recommends funding this replication project, provided the applicants demonstrate via simulation that their specific stopping rule and adjustment factor maintain the required false-positive rate (FPR) of <5% under the null hypothesis. Funds will not be released until this validation is complete.

  **Background**
  The applicant lab proposes a multi-study replication of a well-known social-priming effect. They intend to use a Bayesian sequential design, collecting data in batches and stopping once the Bayes factor (BF) exceeds 6. To comply with our board's mandate for frequentist error control (FPR < 5%), they propose a "sequential evidence escrow" mechanism: multiplying the final BF by 0.85 for every interim analysis performed.

  The board is divided. One faction argues that sequential Bayesian designs are methodologically sound and that strict fixed-N frequentist rules undermine the efficiency of Bayesian learning. The other faction contends that the proposed 0.85 "peek discount" is an arbitrary fudge factor without theoretical grounding, effectively amounting to p-hacking disguised as Bayesian inference.

  **Rationale**
  This decision seeks to bridge the methodological divide while strictly adhering to the board's charter regarding error control.

  1.  **Validation of the Sequential Design:** We acknowledge the proponents' argument that sequential Bayesian designs are valid tools for evidence accumulation. Forcing a fixed sample size on a Bayesian analysis can indeed waste resources and contradict the philosophical framework of the approach. We are not rejecting the sequential methodology itself.
  2.  **Validation of the Error Control Claim:** However, we must also take seriously the concern that the 0.85 multiplier is ad hoc. While Bayesian stopping rules often have desirable frequentist properties, those properties depend on the specific prior, the stopping boundary, and the frequency of peeking. There is no established literature confirming that a flat 0.85 discount per look guarantees a 5% FPR across various sample sizes and effect magnitudes. Asserting error control without demonstrating it violates our mandate.
  3.  **The Path Forward:** The solution is not to ban the method, but to require empirical validation of its operating characteristics. If the applicants can show through simulation that their specific pipeline (batch size + stopping rule + discount) yields a false-positive rate below 5% when the null hypothesis is true, the method complies with our rules. If the simulation shows an FPR > 5%, they must adjust the threshold or the discount factor until it complies. This places the burden of proof on the mathematical properties of the design rather than the board's intuition.

  **Conditions for Funding**
  To proceed, the Principal Investigator (PI) must satisfy the following requirements:

  1.  **Simulation-Based Calibration (Pre-Fund):** Before any funds are disbursed, the lab must submit a technical report detailing a simulation study. This study must generate data under the null hypothesis (no effect) using their proposed batch sizes and stopping rules. The report must demonstrate that the "discounted" Bayes factor procedure results in a false-positive rate of ≤ 5% over at least 10,000 simulated experiments.
      *   *Note:* If the 0.85 factor fails this test, the PI must propose a revised discount factor or stopping threshold that passes the simulation and resubmit for board approval.
  2.  **Preregistration:** The full analysis plan, including the exact stopping rules, batch sizes, and the validated discount factor, must be preregistered on the Open Science Framework (OSF) prior to data collection.
  3.  **Data Transparency:** All data batches must be time-stamped and uploaded to a public repository immediately upon collection. No data can be deleted or excluded without documented justification approved by the board.

  **Timeline and Reporting**

  *   **October 31, 2024 (7 Days):** PI submits the simulation plan and preliminary code for board review.
  *   **November 15, 2024 (21 Days):** PI submits the final simulation report demonstrating ≤ 5% FPR. **Funds are released only upon written confirmation of compliance.**
  *   **Data Collection Period:** Must commence within 30 days of fund release.
  *   **November 15, 2025 (12 Months):** Final report due. This must include the preregistered analysis, the final discounted Bayes factors, and a post-hoc check of the actual error rates observed compared to the simulation predictions.

  **Conclusion**
  This conditional approval respects the applicants' methodological innovation while safeguarding the university's commitment to reproducibility. It avoids strawmanning the Bayesian approach by allowing it, but it also avoids naivety by demanding proof that the "escape hatch" for peeking actually works as advertised. We invite the board to vote on this recommendation at tomorrow's meeting.
