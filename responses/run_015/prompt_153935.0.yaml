prompt: |-
  Hey -- I'm on the Research Reproducibility Board at my univeristy (we hand out small internal replication grants), and we've got one case I have to decide by Friday. I need you to draft the decision memo I'll circulate to the board Thursday night.

  Here's the deal. A psych lab applied for money to run a multi-study replication of a flashy social-priming effect. Their proposal says they'll use a Bayesian sequential design: collect data in small batches, peek after each batch, and stop as soon as the Bayes factor hits 6, which they treat as strong evidence. No fixed sample size, no p-values, no correction for peeking. Our board's current rule is that any funded project has to keep the overall false-positive rate under 5% across the whole line of studies, because we're still freaked out about the replication crisis and the file-drawer problem.

  The twist: the applicants know about that rule, and they've proposed a homebrewed fix they call a 'sequential evidence escrow.' As I understand it, after every batch they'll log the Bayes factor with our staff, and at the end they'll apply a 'peek discount' -- they multiply the final Bayes factor by 0.85 for each interim look, and if the discounted Bayes factor is still above 6 they'll call the effect replicated. They argue this discount gives them long-run error control without having to pretend their prior is true or lock themselves into a fixed sample size. Half the board says this is just p-hacking with extra steps and a made-up fudge factor; the other half says it's a goodfaith bridge between frequentist error control and Bayesian learning, and that forcing fixed-N frequentist rules would throw away the whole point of going Bayesian.

  Please write the board's decision memo: approve, reject, or approve with conditions, with a clear bottom line and a concrete timeline (what they must do before funds are released, and what they have to report at the end). Give reasons the researchers could actually respond to, and take the losing side seriously -- don't just strawman the people who hate the peek discount. I'd rather have something usable than perfect. Also, write the whole answer in American English, please: use 'behavior' and 'analyze' style spellings, not the British ones. Thanks!
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Research Reproducibility Board at a university.
      *   **Task:** Draft a decision memo to circulate to the board by Thursday night (for a Friday decision deadline).
      *   **Subject:** A grant application from a psych lab to replicate a social-priming effect using a Bayesian sequential design.
      *   **Key Conflict:**
          *   Board Rule: Overall false-positive rate (Type I error) must be under 5% across the line of studies.
          *   Applicant Proposal: Bayesian sequential design (peek after batches, stop when BF > 6).
          *   Applicant "Fix": "Sequential evidence escrow" (multiply final BF by 0.85 for each interim look).
          *   Board Split: Half say it's p-hacking/fudge factor; half say it's a good-faith bridge between frequentist/Bayesian paradigms.
      *   **Requirements:**
          *   Clear bottom line (Approve, Reject, or Approve with Conditions).
          *   Concrete timeline (pre-fund requirements, end-of-project reporting).
          *   Reasoned arguments (address both sides seriously, no strawmanning).
          *   Usable format (memo).
          *   Language: American English (behavior, analyze, etc.).

  2.  **Determine the Decision:**
      *   *Option 1: Reject.* Safe, adheres strictly to the 5% FPR rule as traditionally interpreted (frequentist). But it stifles methodological innovation and ignores the Bayesian argument that BF stopping rules *can* have error control properties depending on priors and stopping boundaries.
      *   *Option 2: Approve.* Risks violating the board's core mandate (5% FPR). The "0.85 discount" is indeed ad-hoc and not standard statistical practice. It lacks theoretical justification in the literature.
      *   *Option 3: Approve with Conditions.* This is the most pragmatic path for a reproducibility board. It allows the research to proceed (supporting replication efforts) but imposes safeguards to ensure the 5% FPR rule is actually met, rather than relying on an unvalidated "discount."
      *   *Decision:* **Approve with Conditions.** This acknowledges the value of the replication while enforcing the board's mandate through verified simulation rather than an arbitrary multiplier.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Bottom Line:** State the decision clearly.
      *   **Background:** Briefly summarize the proposal and the conflict.
      *   **Board Deliberation:** Acknowledge the split opinion (validate both sides).
      *   **Rationale:** Explain *why* the decision was made (addressing the statistical concerns without dismissing Bayesian methods outright).
      *   **Conditions for Funding:** Specific steps before money moves.
      *   **Reporting Requirements:** Specific steps at the end.
      *   **Timeline:** Dates for compliance.

  4.  **Drafting Content - Key Arguments:**
      *   *Addressing the "P-hacking" concern:* The 0.85 multiplier is indeed arbitrary. There's no literature supporting exactly 0.85 per peek for BF stopping rules to guarantee 5% FPR. It looks like a post-hoc adjustment.
      *   *Addressing the "Bayesian Freedom" concern:* Sequential Bayesian designs *are* valid, but claiming frequentist error control (5% FPR) requires frequentist validation (simulation). You can't just assert it.
      *   *The Compromise:* Allow the sequential design (respecting the methodology) but require *simulation-based calibration* to prove the 5% FPR is met under the null hypothesis, rather than using the magic 0.85 number. This bridges the gap.

  5.  **Drafting Content - Conditions & Timeline:**
      *   *Pre-fund:* Submit a simulation plan showing the operating characteristics (Type I error rate) of their specific stopping rule + discount under the null. If the simulation shows >5% false positives, they must adjust the stopping threshold or the discount factor based on the simulation, not intuition.
      *   *Reporting:* Preregistration of the analysis plan (including the stopping rule), public deposition of all data batches, and a final report including the simulated error rates achieved.
      *   *Timeline:* Since the decision is Friday, pre-fund conditions should be due within 2-3 weeks. Final report within 12 months.

  6.  **Refining Tone:**
      *   Professional, administrative, yet scientifically literate.
      *   Respectful to the applicants (they are trying to solve a hard problem).
      *   Firm on the board's mandate (5% FPR is non-negotiable).
      *   American English check (behavior, analyze, program, etc.).

  7.  **Review against Constraints:**
      *   American English? Yes.
      *   Clear bottom line? Yes (Approve with Conditions).
      *   Concrete timeline? Yes.
      *   Address both sides of the board? Yes.
      *   No strawmanning? Yes, acknowledge the validity of sequential Bayesian design but question the specific error control claim.

  8.  **Self-Correction/Polish:**
      *   *Critique:* Is the 0.85 discount completely dismissed?
      *   *Fix:* Frame it as "insufficient validation" rather than "wrong." Let them keep it *if* the simulation proves it works. This puts the burden of proof on the math, not the board's intuition.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Make sure the pre-fund simulation review happens before funds disburse.
      *   *Critique:* Did I mention the specific effect?
      *   *Fix:* Keep it general ("flashy social-priming effect") as per prompt, or just refer to "the proposed replication."
      *   *Check:* Ensure "behavior" and "analyze" are used.

  9.  **Final Polish:** Check memo format. Ensure the "Bottom Line" is prominent.

