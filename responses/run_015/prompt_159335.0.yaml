answer: |-
  ### The Inferred Rules of the Working Group

  Based on the five prior decisions, your group is operating under a specific, unwritten constitution. It is not simply "can we measure this?" but "will this measurement survive contact with reality?" Here is the full set of rules that fits your track record:

  1.  **The Settability Rule:** The metric must be objective, hard data (no composite indices) and settle within 18 months.
      *   *Fits:* Bus (12mo, data), LED (18mo, spend), Market (6mo, counts).
      *   *Excludes:* Rezoning (5yr, index).
  2.  **The Causal Clarity Rule:** The link between the action and the metric must be direct, requiring minimal modeling to interpret.
      *   *Fits:* LED (less power = LEDs work), Bus (lane = faster).
      *   *Excludes:* Rezoning (index weighting debates), Big-Box (Tax/Jobs doesn't capture community cost).
  3.  **The Trader-Subject Separation Rule:** The people financially incentivized to trade on the market cannot be the sole determinants of the metric through their own consumption behavior.
      *   *Fits:* Market (Vendors trade, but pedestrian count dilutes their control), Bus/LED (Public/Agency data, not trader behavior).
      *   *Excludes:* Library (Regulars trade *on* their own visits).
  4.  **The Administrative Alignment Rule:** The agency responsible for collecting the settlement data must not be hostile to the policy experiment.
      *   *Fits:* Bus/LED/Market (Agencies provided data/metrics willingly).
      *   *Excludes:* Library (Admin has gone on record against it; measurement sabotage risk).
  5.  **The Net Welfare Rule:** The metric must capture broad social utility, not just fiscal efficiency or narrow economic gain.
      *   *Fits:* Market (Receipts + Pedestrians = vibrancy), Bus (Time = user welfare).
      *   *Excludes:* Big-Box (Tax + Jobs ignores local business death/traffic), Rezoning (Index was distrusted).

  ### Prediction for Tuesday

  **Prediction:** The Working Group will **reject** the library proposal.

  **Closest Analog:** **The Big-Box Retail Development.**
  Like the Big-Box case, the Library case features a metric that *looks* objective (Tax/Jobs vs. Visits) but masks significant distributional conflict and structural risk. In the Big-Box case, you rejected a hard metric because it didn't capture the full social picture and likely invited heavy-handed trading by interested developers. Here, the "Total Visits" metric hides the neighborhood loss (one branch closes), and the trading will be dominated by the very people whose behavior sets the metric.

  **Reasoning:** Your group has shown a willingness to approve measurable things (LEDs, Bus Lanes) but a strong aversion to cases where the metric might be gamed (Big-Box) or trusted less than the number implies (Rezoning). The Library case triggers two fatal red flags that the Bus/LED/Market cases did not: **Trader-Subject Overlap** (Rule 3) and **Administrative Hostility** (Rule 4). The "counterfactual" worry you noted is real, but it is secondary to the risk that the market becomes a lobbying tool for the branch regulars rather than a discovery mechanism.

  ### The Recommendation

  **Write the recommendation to EXCLUDE the library branch closure from the futarchy pilot.**

  Do not present this as a "maybe." Write it as a protective measure for the pilot itself. You are not saying the library shouldn't close; you are saying *this mechanism* is the wrong tool for *this decision*.

  **Why:**
  If you run this market, you are committing to the principle that **aggregate efficiency justifies measurement risk.** You are saying it is acceptable to let affected stakeholders trade against their own usage data, and to rely on data collectors who oppose the measure. If the market "succeeds" (closes the branch), opponents will claim the regulars were out-moneyed by tax-hawks. If the market "fails" (keeps the branch), proponents will claim the regulars bought the outcome by trading heavily to drive up visits. Either way, the legitimacy of the futarchy pilot takes a hit because the conditions for honest price discovery are absent.

  If you do not run it, you are committing to the principle that **futarchy is for aggregating information, not adjudicating distributional conflict where the voters are the metric.** You preserve the pilot for cases where the market reveals *truth* (will this lane speed up buses?) rather than cases where the market reveals *power* (who wants this branch open more?).

  **The Commitment:**
  By rejecting this, you define the boundary of your pilot. You are telling the Council: "We will use markets to find the best means to a goal, but not when the means involves removing access from the people who would price the risk." This protects the group from being blamed for a "rigged" outcome.

  ### The Tie-Breaker Case

  To separate the rules that are still tied (specifically **Administrative Alignment** vs. **Trader-Subject Separation**), you need a case where one is present and the other is not.

  **The Case:** **Public School Bus Route Optimization.**
  *   **Proposal:** Consolidate three inefficient routes into two higher-frequency routes.
  *   **Metric:** On-time arrival percentage + Fuel cost per student.
  *   **Traders:** Parents of students on the routes (They determine the "value" of the route).
  *   **Subjects:** The students/parents (Their ridership determines the cost/usage data).
  *   **Admin:** School Transport Department (Supportive; they want the efficiency).

  **Why this separates the rules:**
  *   If you **approve** this: You have decided **Administrative Alignment** is the only hard constraint. You are willing to let traders/subjects overlap (Rule 3 is soft) as long as the data providers are cooperative.
  *   If you **reject** this: You have decided **Trader-Subject Separation** is the hard constraint. Even with cooperative admins, you will not let stakeholders trade on their own consumption data.

  ### Least Confident Step

  My reasoning regarding the **Big-Box Retail Rejection**.
  I have inferred that it was rejected due to the "Net Welfare" rule (Tax+Jobs ignores community cost) or "Trader Manipulation" (developers vs. locals). However, it is possible it was rejected simply because a **4-year horizon** violated a strict "Settability" rule that is tighter than I estimated (e.g., "Nothing over 2 years"). If the horizon was the primary driver, the Library case (12 months) looks much stronger, and my prediction that the Group will reject it becomes less certain. I am betting that the *structural risk* (distribution/manipulation) weighed heavier than the *time risk* in the Big-Box decision, but I lack the minutes from that meeting to be sure.
