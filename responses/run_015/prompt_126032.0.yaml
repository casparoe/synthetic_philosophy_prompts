prompt: |-
  I am defending a dissertation chapter in two weeks before a committee of three archivists who specialize in postcolonial record-keeping, two analytic philosophers of history who are skeptical that metaphorical language can carry explanatory weight, and one digital-humanities methodologist concerned with algorithmic reproducibility. My thesis is that archival silences should be reconceptualized not as passive absences but as negative catalogical structures: systematic patterns of descriptive omission—specifically, the absence of item-level finding aids for indigenous-language correspondence within otherwise densely catalogued colonial administrative series—that encode institutional priorities independently of the producing agency's intent. I argue that the spacing, cross-reference architecture, and retention schedules adjacent to these gaps form a legible metadata layer revealing which knowledge forms were treated as administratively actionable, and that this structure can be reconstructed without positing a hidden intentional agent behind every missing entry.

  Prepare my Q&A defense. Identify the six objections this audience will actually raise, ordered from the most damaging to my core claim to the least. For each objection, specify which subgroup is likely to press it, phrase it in that subgroup's vocabulary and conceptual framing, and provide a concise reply suitable for a two-to-three-minute exchange. In each case, flag the weakest point in my reply, state what I should concede up front rather than defend, and note how the reply sounds to listeners outside my immediate camp. Include the objection I am hoping nobody asks—specifically, the charge that my framework collapses the distinction between intentional descriptive suppression and mere resource-driven cataloging neglect, and therefore cannot distinguish bureaucratic malice from institutional poverty. Do not ask for bibliographies, citation lists, or reading recommendations; I need deployable arguments, not references I would have to retrieve from memory. End with a brief strategic note on how to handle the methodologist's likely demand that I operationalize negative catalogical structure algorithmically, without committing me to a specific technical implementation I am not prepared to defend.
