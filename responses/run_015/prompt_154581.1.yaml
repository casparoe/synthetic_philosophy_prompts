      *   **Conflict 4: (c) vs. (d) [Symmetry vs. Fear]**
          *   (c) Pre/Post absence is symmetric.
          *   (d) Fear of death is rational.
          *   *Tension:* If they are symmetric, why fear one end and not the other?
          *   *Resolution:* (d) justifies this via "current relationships/projects." We have forward-looking desires. This is compatible with (c) if (c) is interpreted as "metaphysically symmetric" but "axiologically asymmetric due to perspective."

