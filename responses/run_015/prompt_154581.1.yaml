          *   (e)+(f): Explain "Psychological Continuity with Causal Dependency." This is consistent.
          *   (b)+(c): This is the big one. Lucretius vs. Nagel.
          *   (b)+(f): Goods vs. Identity.
      *   **Recommendation:** Drop (c). It's the weakest link for someone holding (b) and (d). It creates the most friction for the least intuitive gain.
