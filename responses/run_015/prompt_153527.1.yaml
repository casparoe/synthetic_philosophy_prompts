prompt: |-
  Please explain the conceptual tension between adopting Dennett's intentional stance toward a large language model—using belief and desire attributions as predictive and interpretive tools—and the objection that such attributions are ontologically empty because the model generates tokens solely by sampling from a static parameter space, lacking any internal goal-directed reasoning. In particular, clarify whether the intentional stance requires that the attributed mental states play a genuine causal-explanatory role in producing behavior, and discuss how this criterion applies to architectures in which output generation is causally decoupled from representational content in ways that differ from human belief-desire psychology. Respond in one paragraph, with a hard maximum of 130 words.
