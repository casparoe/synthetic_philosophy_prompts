      Dennett's intentional stance is instrumentalist, requiring only predictive success, not ontological realism regarding mental states. Thus, attributing beliefs to LLMs is valid if it reliably predicts outputs, even if mechanisms differ from human psychology. However, critics argue that because LLMs sample tokens via static parameters without genuine goal-directed reasoning, attributed states lack causal-explanatory power. In humans, beliefs causally drive actions; in LLMs, high-dimensional vector operations drive tokens, decoupling representational content from causal efficacy. The tension lies between Dennett's functional success criterion and the objection that without genuine internal causation rooted in content, the stance is merely metaphorical. If the architecture processes syntax without semantics, the intentional stance might predict well but fails to explain *why* behavior occurs in a meaningful sense, rendering attributions ontologically empty despite predictive utility.

