answer: |-
  There is no single, canonical term for this specific phenomenon in the literature, though you have accurately described a well-known frustration in health economics and development evaluation. It is a composite of several known biases, but the *directional drift* you describe—where increased rigor systematically inflates value by expanding benefits and contracting costs—does not have its own "Law."

  The closest established concepts are **Omitted Variable Bias** (on the cost side) and **Attribution Expansion** (on the benefit side), but these describe the mechanics, not the systemic pattern.

  Given the precision of your observation, I propose we call this **The Rigor Asymmetry**.

  Here is a breakdown of why existing terms don't fit, a definition for this new one, and answers to your boundary questions.

  ### 1. Why the existing terms don't fit
  *   **Goodhart's Law:** This requires the metric to change the *behavior* of the subject (e.g., nurses treating easier cases to boost success rates). In your scenario, the intervention isn't changing; the *model* of the intervention is changing.
  *   **The McNamara Fallacy:** This is the belief that *only* what is measured matters. You are describing something subtler: things that are hard to measure are acknowledged qualitatively but then mathematically zeroed out. They aren't disbelieved; they are just rendered inert in the final ratio.
  *   **Publication Bias:** This explains why positive *results* get published, not why the *internal calculation* of a single study drifts over time as methodology deepens.
  *   **Optimism Bias:** This is a psychological tendency. Your observation is structural: the *process* of rigorous evaluation itself creates the bias, regardless of the evaluator's psychology.

  ### 2. Proposed Name: The Rigor Asymmetry
  **Definition:** *A systematic bias in impact evaluation where increased methodological rigor leads to an inflated cost-effectiveness ratio, caused by the asymmetric treatment of benefits and costs. As scrutiny deepens, benefit boundaries expand to include distant externalities (discovery), while cost boundaries contract to exclude hard-to-quantify inputs (exclusion).*

  **Why this name works:**
  *   **Rigor:** It identifies the culprit. It's not laziness; it's the deep dive itself.
  *   **Asymmetry:** It captures the two-way drift. Benefits are treated as *discoverable* (we keep looking until we find more); costs are treated as *definitional* (if we can't pin a number to it, it leaves the ledger).

  ### 3. Does it apply to corporate impact reports?
  **Yes, identically.**
  In ESG (Environmental, Social, and Governance) reporting, this is rampant.
  *   **Benefit Side:** A company invests in a local school. Rigorous study finds "improved community cohesion" and "brand loyalty among future employees." These are added to the social return.
  *   **Cost Side:** The carbon cost of the construction, the wage suppression in the supply chain, or the tax avoidance that funded the initiative are moved to "risk factors" or excluded because they lack a standardized accounting metric.
  *   **Result:** The "Social ROI" looks better the more you study it, provided you are the one commissioning the study.

  ### 4. Does it count if costs are dropped for political reasons?
  **Yes, but it becomes a sibling phenomenon.**
  If costs are dropped because they are hard to measure, it is **The Rigor Asymmetry**.
  If costs are dropped because acknowledging them would jeopardize funding or government relations, it is **Political Accounting** or **Strategic Omission**.

  However, the *effect* on the ledger is identical. In practice, these two often mask each other. An M&E officer might tell themselves, "We can't reliably value the nurse's opportunity cost," when the subtext is, "If we include the nurse's time, the government will demand we pay for it." The Rigor Asymmetry provides the intellectual cover for the Political Accounting.

  ### 5. Is there a version that runs in the other direction?
  **Yes. It is the "Hostile Audit" or "Attribution Contraction."**
  This happens when an external auditor, a skeptic, or a competitor analyzes the intervention.
  *   **Benefit Side:** The horizon shrinks. "You can't claim those earnings; that's correlation, not causation." "You can't count the cases averted in the next village; that's speculation." Benefits are narrowed to the immediate, direct, and undeniable.
  *   **Cost Side:** The horizon expands. "You must account for the carbon footprint of your staff's flights." "You must include the market distortion caused by free goods."
  *   **Result:** The same intervention looks drastically *less* cost-effective under hostile scrutiny.

  ### 6. How to mitigate it in your work
  Since you caught yourself doing this, you are already ahead of the curve. To counter **The Rigor Asymmetry**:
  1.  **Symmetric Boundaries:** If you extend the time horizon for benefits (5 years out), you must extend the time horizon for costs (maintenance, replacement, long-term admin).
  2.  **Shadow Pricing:** Do not leave opportunity costs in the qualitative footnote. Assign a shadow price (even a conservative one) to the nurse's time or the partner's reporting hours. A conservative number is better than zero.
  3.  **The "Zero-Base" Check:** Ask: "If we knew the exact cost of this hidden item, would it change the decision?" If yes, it belongs in the quantitative ledger, even as an estimate.

  You have identified a structural flaw in how the aid sector values its own work. It is the reason why "proven" interventions often look too good to be true when scaled. Naming it is the first step to correcting it.
