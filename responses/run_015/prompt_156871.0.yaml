answer: |-
  You are asking excellent questions, and your intuition about the logic is actually stronger than many introductory summaries give it credit for. You've correctly identified the tension between sets, descriptions, and naming.

  Here is a breakdown to help you parse the logic, correct the attribution, and place it in the context of modern philosophy of language.

  ### 1. First, the Housekeeping (Attribution & Spelling)
  *   **School:** You are correct: **Mingjia** (名家), often translated as the "School of Names" or "Logicians."
  *   **Author:** This is the big mix-up in your notes. The "White Horse is Not Horse" (*Bai Ma Fei Ma*) argument is by **Gongsun Long** (c. 320–250 BCE).
      *   **Hui Shi** was his contemporary and rival within the same broad intellectual milieu. Hui Shi is known for paradoxes like "Heaven is as low as earth" or "I went to Yue today and arrived yesterday." His work focuses more on relativism and spatial/temporal paradoxes, whereas Gongsun Long focuses on semantics and ontology.
  *   **Spelling:** *Mingjia* is the correct Pinyin.

  ### 2. Parsing the Logic: Is it Ontology or Language?
  Your reading ("the set of white things and the set of horse things don't overlap perfectly") is essentially a **set-theoretic interpretation**, which is a valid way to model it. However, Gongsun Long's point is slightly more nuanced.

  It is **both** linguistic and ontological, but in a specific way:
  *   **Not Biological:** He is not claiming that a white horse isn't biologically equine. No one in ancient China thought a white horse was a cow.
  *   **Yes, Semantic/Conceptual:** He is claiming that the **concept** (or *Name*, *Ming*) "White Horse" is not identical to the **concept** "Horse."

  **The Argument Structure:**
  1.  "Horse" names the **shape/form**.
  2.  "White" names the **color**.
  3.  "White Horse" names the **shape + color**.
  4.  Therefore, the name that demands "shape + color" is not equivalent to the name that demands only "shape."
  5.  If you ask for a "horse," a yellow horse or black horse will do. If you ask for a "white horse," a yellow horse will *not* do.
  6.  Since the conditions for satisfying the request are different, the terms are not interchangeable.
  7.  Therefore, "White Horse" is not "Horse."

  **The Crucial Distinction:** The Chinese character *Fei* (非) translated as "is not" is ambiguous. It can mean "is not a member of" (biological classification) OR "is not equivalent to" (logical identity). Gongsun Long forces you to read it as **logical identity**.
  *   **Modern Logic:** $\{White Horse\} \subset \{Horse\}$.
  *   **Gongsun Long:** $\{White Horse\} \neq \{Horse\}$.
  *   He is arguing that **Subset $\neq$ Set**.

  ### 3. Your "Reference Magnetism" & Kind Terms Hypothesis
  You asked: *"Is Gongsun Long basically anticipating the modern split between kind terms and definite descriptions?"*

  **Yes, this is a very sharp insight.**

  *   **Kind Terms:** "Horse" acts like a natural kind term. It refers to the essence of the animal regardless of accidental properties (like color).
  *   **Definite Descriptions:** "White Horse" acts like a description that restricts the reference.

  If we use the **Intension/Extension** distinction (from Frege or possible worlds semantics):
  *   **Extension:** The actual objects in the world. (The extension of White Horse is inside the extension of Horse).
  *   **Intension:** The concept or meaning. (The intension of White Horse includes "whiteness," the intension of Horse does not).

  Gongsun Long is arguing that because the **Intensions** differ, the **Names** cannot be treated as identical. If you treat the argument purely as language (semantics), it **does not collapse**; it actually becomes robust. It only "collapses" if you treat it as a biological claim.

  Regarding **Reference Magnetism** (David Lewis):
  You could say "Horse" is a stronger magnet because it pulls in all color variants. "White Horse" is a weaker magnet (or a more specific one) because it is repelled by non-white variants. Gongsun Long is highlighting that **precision in naming restricts reference.** If you use the compound name, you lose the flexibility of the simple name.

  ### 4. Does the School of Names Use This Structure Elsewhere?
  Yes. Gongsun Long has another famous dialogue called **"Hard and White" (*Jian Bai Lun*)**.

  *   **The Scenario:** You have a stone that is both hard and white.
  *   **The Argument:** When you look at it, you see "white" but don't feel "hard." When you touch it, you feel "hard" but don't see "white."
  *   **The Conclusion:** "Hard" and "White" are separate qualities that do not ontologically merge, even if they inhabit the same object. Therefore, "Hard-White Stone" is not a single unified essence but a conjunction of separate properties.

  This reinforces the "White Horse" logic: **Compound properties do not equal simple properties.** A "Hard-White" concept is not the same as a "Stone" concept.

  **Hui Shi**, by contrast, uses a different structure. His "Ten Theses" are more about the relativity of perspective (e.g., "The center of the world is north of Yan and south of Yue"). He is challenging spatial/temporal absolutes, whereas Gongsun Long is challenging semantic absolutes.

  ### 5. Why Does This Matter? (The "So What?")
  You might wonder why they cared. To the Confucians (like Xunzi), this was dangerous sophistry that confused social order. But for the *Mingjia*, it was about **Rectification of Names** (*Zhengming*).

  If the King says "I need horses for the army," and you send white horses, is that okay? If the King says "I need white horses for a ritual," and you send black horses, is that okay?
  Gongsun Long is arguing that **political and social commands rely on precise semantics.** If we allow "White Horse = Horse" to mean *identity* rather than *membership*, we lose the ability to make specific demands.

  ### Summary Checklist for Your Notes
  1.  **Author:** Gongsun Long (not Hui Shi).
  2.  **Logic:** It relies on the ambiguity of "is" (Identity vs. Membership). It argues Concept A $\neq$ Concept B, even if Object A $\in$ Set B.
  3.  **Ontology vs. Language:** It is a semantic argument with ontological implications. It claims reality is carved up by language, and imprecise language leads to confused reality.
  4.  **Modern Parallel:** Intension vs. Extension; Sense vs. Reference; Natural Kind vs. Descriptive Modifier.
  5.  **Related Argument:** "Hard and White" (separating sensory qualities).

  Your intuition that this is about **compound descriptions vs. simple kind terms** is spot on. You can confidently file this under "Ancient Chinese Philosophy of Language" rather than just "weird paradoxes."
