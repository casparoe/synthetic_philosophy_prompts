  4. Tell them what survives as a defensible claim about a town's control over its physical form once the bad step is removed.
  5. Determine if the survivor is the membership right in a narrower guise or something else.
  6. Close with a single line: \answer{(n)} where n is the numbered step to reject.

  They want to keep (1), (5), and (6). They'd rather abandon (7) than those, but understand rejecting a conclusion isn't a diagnosis.

  Let me analyze the argument:

  (1) Property ownership gives you control over who uses it - this is a basic property rights principle.
  (2) House value comes from amenity bundle created collectively - this is plausible (location, schools, etc.)
  (3) Producers/maintainers of a good have say over its terms - this borrows from labor theory or collective action principles
  (4) Therefore current residents jointly hold membership right - this is the inference from 2+3
  (5) Zoning states those terms - plausible description
  (6) If no claim to admission on your terms, exclusion on ours violates nothing - this is about rights claims
  (7) Therefore exclusionary zoning violates no rights, NIMBY is not moral failing - conclusion
  (8) Rider: historical injustices don't lapse the right - this is the controversial rider

  The problems identified:
  (a) Right to set terms could be any terms (unlimited discretion)
  (b) Membership is undefined (owners vs. renters, joint holding issues)


  (c) If property right, it's alienable/compensable (auction admission, condemnation)
  (d) Net contributors should have stronger say (undermines exclusion logic)

  The core issue seems to be step (3) or (4). Step (3) claims that whoever produces/maintains a good has say over terms. But the amenity bundle isn't really "produced" by current residents in a way that gives them exclusive control - it's maintained through ongoing tax payments and legal frameworks that include everyone subject to them.

  Step (4) is where the inference breaks down most significantly. Even if current residents maintain amenities, that doesn't automatically grant them joint ownership rights over admission terms. The leap from "we maintain this" to "we control who joins" is the critical flaw.

  Step (8) is also deeply problematic - it claims historical injustices don't affect current rights, which ignores how property rights can be tainted by unjust origins.

  I think step (3) is the best candidate to reject. It borrows plausibility from labor theory and collective action principles, but it conflates maintenance with ownership control. The alternative would be to reject (4) instead, but that's where the actual inference fails.

