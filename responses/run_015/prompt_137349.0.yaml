answer: |-
  Step (3) is the break point. It borrows plausibility from private association and labor-desert principles: in a cooperative, members who maintain the good do set admission terms; in Lockean theory, labor on a resource grounds control. This makes (3) feel like common sense about fairness and contribution. The two most attractive alternatives are rejecting (4) or (8). Rejecting (4) leaves (3)'s overreach intact—you'd still need to explain why "a say" doesn't become "veto power over admission." Rejecting (8) while keeping (3) and (4) acknowledges historical taint but still licenses present exclusion on putatively neutral terms, which doesn't solve problems (a) through (d). The cost of keeping (8) is high: it treats property rights as morally self-cleaning across generations, insulating present advantage from the claim that it rests on prior wrongful exclusion. This makes the membership right look like a perpetuity device rather than a legitimate incident of ownership.

  What survives is not the membership right in narrower guise, but something that was never in the argument: a town's *regulatory* authority over physical form, exercised through democratic institutions and subject to higher-level constraints (state law, constitutional equal protection, fair housing obligations). This is a public-governance power, not a property-like ownership claim. It allows a town to shape streetscapes, density, and infrastructure for legitimate public ends—traffic, schools, environmental capacity—but not to treat admission as a private club's prerogative. The defensible core is that residents have democratic voice over local land use, not that they hold exclusionary property rights over who may reside there.

  \answer{(3)}
