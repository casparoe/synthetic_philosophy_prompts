answer: |-
  Milton Friedman's methodological instrumentalism, often termed the "F-twist," posits that theories are merely instruments for prediction. Its core commitment is that the validity of a theory rests exclusively on the accuracy of its predictions, not the descriptive realism of its assumptions. Indeed, Friedman argues that significant assumptions must often be false to achieve generality. Conversely, the counterfactual-anchor account views idealisations as structural stabilisers within a modal space. Its core commitment is that unrealistic assumptions function as fixed points, allowing the modeller to perturb variables and identify robust dependencies. Here, the goal is not merely output matching, but the isolation of causal mechanisms through controlled abstraction to reveal which relationships are structurally necessary.

  Regarding the first point, the explanation of success diverges fundamentally. For Friedman, a model assuming perfect rationality succeeds simply because it predicts market equilibrium; the assumption is a convenient fiction, and explanation is effectively conflated with prediction. The "why" is irrelevant if the "what" is accurate. The counterfactual account argues success arises because the assumption anchors a specific modal claim: *were* agents rational, equilibrium would obtain. This reveals the structural pressure toward equilibrium, distinguishing it from noise. The model explains by demonstrating which relationships persist across counterfactual variations, offering insight into the system's architecture rather than merely its empirical output.

  Second, the counterfactual account can absorb Friedman's challenge without collapsing into instrumentalism by treating predictive utility as necessary but not sufficient. Friedman challenges the requirement for realistic assumptions; the counterfactual view agrees assumptions are unrealistic but demands they preserve modal structure. It avoids collapse by insisting that valid idealisations must maintain stability under perturbation. A model might predict well by accident or overfitting, but a counterfactual anchor must hold across a range of scenarios. Thus, it incorporates instrumental success while demanding structural coherence, preventing a retreat into pure black-box instrumentalism where the internal logic of the model is opaque.

  Third, the distinction between "descriptive stripping" and "prescriptive locking" clarifies this divergence. Descriptive stripping removes incidental details (e.g., friction) to reveal underlying laws, whereas prescriptive locking fixes parameters unnaturally (e.g., immutable preferences) to impose structure. For Friedman, both are justified solely by predictive yield. For the counterfactual account, this distinction is vital. Stripping often preserves modal relationships, whereas locking risks artefactual rigidity. Consequently, the counterfactual view allows evaluation independent of predictive targets: one can assess whether a locked parameter distorts the modal space even if predictions remain accurate. This enables a critique of models that predict well but rely on structurally unstable locks, asserting that a model can be predictively successful yet explanatorily defective.

  **Note on Central Feature:** The central philosophical work is done by the **modal status of the assumptions**. If modal stability is removed, the counterfactual account loses its criterion for distinguishing robust mechanisms from accidental generalisations, collapsing back into Friedman's instrumentalism where prediction is the sole arbiter of validity.
