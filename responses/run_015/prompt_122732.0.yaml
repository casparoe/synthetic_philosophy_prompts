answer: |-
  The central question of this thesis concerns the inferential gap in Berkeley's Master Argument. The thesis will concede, for the sake of argument and in its strongest form, Berkeley's phenomenological claim: any attempt to represent a tree as existing while unperceived is self-defeating in the way he describes. The question is then what, if anything, follows from that concession. To move from a claim about our representational capacities to a claim about what can exist, a bridge principle is required. I will distinguish plausible candidates for this principle, such as a strong modal rule equating conceivability with possibility, versus a weaker constitutive rule linking existence to being an object of thought. The choice among them determines the force of the argument. I will say explicitly why the standard reply—that one can after all conceive of an unperceived tree—is being set aside. Contesting the phenomenology treats the argument as a psychological error rather than a structural proof. By conceding the premise, we test whether the inference itself holds. If the argument fails even when conceded, the phenomenological dispute is irrelevant. If it succeeds, the real work is done by the bridge, not the thought experiment. This shifts the burden from defending the impossibility of the conception to justifying the ontological implication.

  Existing positions leave this question open because both Berkeley's defenders and his critics have concentrated on the act and its description. The literature is saturated with debates over whether the imaginative exercise is truly impossible, treating the inference to immaterialism as automatic. Consequently, the bridge has largely gone unexamined. It is not settled whether stating a bridge principle requires assuming that the objects of thought are ideas. If the argument presupposes idealism to prove idealism, it is circular. If it relies on a general modal principle, it risks overgeneralization to domains Berkeley wishes to exclude. By shifting focus from the act of conception to the inference licensed by that act, this project exposes a gap in the literature. The question is not whether Berkeley describes the experience correctly, but whether the experience described licenses the metaphysical conclusion without begging the question against the realist. This accounts for why the argument continues to persuade some while failing for others: they tacitly accept different bridge principles.

  The method proposes to use the comparison with the *cogito*, and with any other arguments that share the diagonal structure, as a tool for determining what conclusions that structure can bear. Both arguments share a structure where the attempt to deny the conclusion verifies the premise. However, the *cogito* concludes something about the thinker, whereas Berkeley concludes something about trees. This comparison is preferable to another close reading of the relevant passage in the *Principles*, which often obscures logical structure with textual ambiguity. It is also preferable to intervening directly in the contemporary literature on conceivability and possibility, which introduces technical modal commitments alien to Berkeley's context. The project must handle two test cases: Berkeley's doctrine that we have notions but not ideas of spirits, together with his acceptance of other finite spirits that exist unperceived by any creature, and his appeal to divine perception to handle objects no human being is observing. Each raises the question whether the argument is being quietly restricted. I will investigate whether these restrictions are principled applications of the diagonal structure or question-begging exceptions to save the system.

  The range of possible conclusions falls into three categories. The candidate conclusions are that the argument supports only a claim about the conditions under which objects can be represented; that it supports immaterialism about objects of sense specifically; and that it generalizes into a claim about all objects of thought which Berkeley himself must reject. Considerations that would discriminate among these include whether the bridge principle relies on the passive nature of sense perception or the active nature of conception. Each implication affects how we view the argument's role in Berkeley's overall case. If it only establishes the first, the Master Argument is merely propaedeutic. If it establishes the second, it is the core proof of idealism. If it implies the third, it is inconsistent with Berkeley's theology. Identifying these considerations will clarify whether the argument is a standalone proof or a component reliant on theological premises.

  Honest failure conditions and a realistic scope must be acknowledged. The project collapses into exegesis if it fails to articulate the bridge principles independently of Berkeley's text. It becomes a restatement of the secondary debate if it does not advance beyond the standard conceivability objections. The scope is tight for fifteen thousand words; attempting to resolve the contemporary modal logic debate would be too large for nine months. A minimal but respectable result would look like a clear typology of the bridge principles required to make the argument valid, even if the central question of which principle Berkeley intended cannot be definitively settled. This would still clarify why the argument persuades some and fails for others. If the central question cannot be settled, demonstrating the necessity of the bridge principle itself constitutes a successful contribution, preventing future debates from talking past one another regarding the argument's validity.

  Finally, the question matters beyond Berkeley scholarship. The project would show about how much transcendental or conceivability-style arguments from the conditions of representation can establish. If the diagonal structure works for the *cogito* but fails for the tree, this reveals limits on using self-referential verification to prove external ontology. It illuminates the boundary between epistemology and metaphysics in early modern philosophy. Demonstrating that the Master Argument relies on a specific, contestable bridge principle rather than self-evident intuition clarifies the cost of idealism. It suggests that arguments deriving existence from thought require more than structural cleverness; they require substantive premises about the nature of objects. This insight applies to any philosophical system attempting to derive metaphysical constraints from cognitive limitations, offering a cautionary model for similar arguments in contemporary metaphysics.
