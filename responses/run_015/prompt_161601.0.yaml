          6.  Constraint: Do not produce the final list until thinking through pressure points.

  2.  **Brainstorming Pressure Points (Philosophical Analysis):**
      *   *The Nature of the Objection:* Contractualism is about justification to actual people for what happens to them. If I die, my "prospect" didn't hurt me; my death did. If the justification relies on the *prospect*, am I justifying the act to the *statistical person* rather than the *flesh-and-blood victim*? This threatens the "second-personal" core.
      *   *The Knowledge/Identity Problem:* If the rescue boat is en route, and we don't know who is on which rock, Prospect Contractualism says save the five rocks. If a radio message comes through identifying the lone person vs. the group *before* the decision is finalized, does the moral verdict shift? If the identities are settled, prospects become 0 or 1. Then the tie-breaker kicks in. But if the tie-breaker relies on numbers, isn't that just aggregating? If the verdict flips based on *information* rather than *facts on the ground*, that feels unstable.
      *   *Risk Weighting:* How do we compare a 100% chance of death vs. a 16% chance of death? Is it linear? If it's linear, it's just expected utility. If it's non-linear (risk-averse), who sets the curve? If the curve is steep enough, does it always favor the many?
      *   *The Tie-Breaker:* She introduces a rule for settled identities: if objections tie, the principle leaving more people with that objection is disallowed. This looks suspiciously like aggregation. If the strongest objection is "I die," and 5 people have it vs. 1 person, she picks the 5. But contractualism says *one* reasonable rejection is enough to veto. Why does the *number* of vetoes matter? This seems to violate the individualist veto power central to Scanlon.
      *   *Continuity/Discontinuity:* There's a cliff edge between "uncertain identity" (ex ante calculation) and "certain identity" (tie-breaker). A tiny bit of information shouldn't radically change the moral structure, yet her machinery treats them differently.
      *   *Social Risk:* In society, we impose risks on each other constantly (speed limits, pollution). If we assess ex ante, does this justify imposing high risks on a few if it lowers the average risk for all? (e.g., sacrificing a minority for general safety).
      *   *The Deflection:* "One person's prospect against one person's prospect." But a prospect is defined by the *distribution* of outcomes across the group. My 5/6 chance of death exists *because* there are 5 others. The content of my prospect is parasitic on the number of others. So she *is* counting people, just inside the definition of the prospect rather than in the summation.

  3.  **Drafting the Main Questions (Iterative Process):**
      *   *Goal:* 8-10 questions. Must be spoken, no jargon dumps. Must force a cost.
      *   *Q1 (Ex Ante/Ex Post & Knowledge):* Focus on the moment identity is revealed.
      *   *Q2 (Currency of Objection):* What exactly is the burden? Is it anxiety? Or the death itself?
      *   *Q3 (Comparability):* How do we measure the strength of a probability?
      *   *Q4 (Tie-Breaker):* Challenge the move from veto to counting vetoes.
      *   *Q5 (Continuity):* The cliff edge between probabilistic and certain cases.
      *   *Q6 (Social Risk):* Apply to policy, not just emergencies.
      *   *Q7 (Expected Value):* Is this just utilitarianism in disguise?
      *   *Q8 (Second-Personal):* Justification to the actual victim.
      *   *Refining Qs:* Ensure they aren't yes/no. Ensure follow-ups are ready.

  4.  **Drafting the Closing Sequence:**
      *   *Goal:* Trap the deflection ("I don't add people").
      *   *Step 1:* Acknowledge where it works (standard rescue).
      *   *Step 2:* Case where the *content* of the prospect depends on numbers (e.g., a risk that scales with population).
      *   *Step 3:* The "Give Up" question (Falsification conditions).

  5.  **Review against Constraints:**
      *   *Tone:* Generous but exacting. (Avoid "Isn't it true that...", use "Help me understand...")
      *   *No Biographical:* Check.
      *   *No Restatement:* Questions must demand justification, not exposition.
      *   *Specific Topics:* Ex-ante/ex-post (Q1), Currency (Q2), Tie-breaking (Q4), Expected Value (Q7).
      *   *Deflection Handling:* The follow-ups need to anticipate her "one person vs one person" line.

  6.  **Final Polish:** Check the flow. Ensure the philosophical distinctions are clear but conversational. (Self-Correction: Make sure the tie-breaker question highlights the tension with the "individual veto" idea of contractualism).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm attacking her, but rather pressing the internal coherence. The prompt asks for "generous but exacting." The questions should sound like I want her to succeed but see the hurdles.

  *(Refining the "Deflection" trap)*: The closing sequence needs to be very precise. The middle question needs to show that the *size* of the prospect is determined by the *number* of people, so counting is hidden inside the prospect.

  Let's assemble the output.

  *   **Section 1:** Brainstorming/Pressure Points.
  *   **Section 2:** The 8-10 Questions (with notes and follow-ups).
  *   **Section 3:** Closing Sequence (3 questions).

  *Wait, one check on the Tie-Breaker:* Her rule is: "when the strongest objection to one principle ties exactly with the strongest objection to its rival, the principle that would leave the greater number of people with objections of that same strength is disallowed."
  *Critique:* In standard contractualism, *one* reasonable rejection vetoes the principle. If 5 people reject it, it's vetoed. If 1 person rejects it, it's vetoed. The number shouldn't matter. Her rule makes the number matter *only* when the strength ties. This is a hybrid view. I need to press on why the number matters *there* but not in the initial veto.

  *Wait, one check on Ex-Ante:* If I am the one person who dies. Ex-post, I have a complaint of death. Ex-ante, I had a 1/6 complaint. If we judge ex-ante, we tell the dead person, "You shouldn't complain, your ex-ante prospect was good." That seems to violate the "standpoint of the victim."

