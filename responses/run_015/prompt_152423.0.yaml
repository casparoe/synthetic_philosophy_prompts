  4.  **Analyzing Points of Breakdown (The Audit):**
      *   *Inert Knowledge:* Does the analogy imply theory is useless until muscle memory takes over? In physics, theory guides practice *during* the act.
      *   *Non-Representational:* Does riding a bike involve *no* propositions? Actually, riders often monitor speed, terrain, etc. (Stanley & Williamson critique).
      *   *Verbal vs. Propositional:* Just because you can't *say* how you balance doesn't mean there isn't a computational/representational structure underlying it.
