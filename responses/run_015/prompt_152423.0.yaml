  2.  **Deconstruct the Bicycle Analogy (Rylean Tradition):**
      *   *Origin:* Gilbert Ryle, *The Concept of Mind* (1949). The classic example of intellectualist legend.
      *   *Standard Interpretation:* You can know all the physics (propositional) but still not ride (procedural). Therefore, knowing how $\neq$ knowing that.
      *   *User's Insight:* In real expertise (physics experiments), theory and practice are interwoven, not separate layers.

  3.  **Drafting the Correspondence Table:**
