  My Dear Colleagues

  It is with considerable interest that I turn to the task of reconstructing how Charles Darwin might have assessed Richard Dawkins's concept of the meme and its contemporary manifestation in digital viral culture, were he to encounter these ideas posthumously. To undertake this reconstruction with the necessary care, we must first anchor ourselves in what is settled within Darwin's own texts and correspondence, specifically his unwavering commitment to the principle that evolution by natural selection requires variation, heredity, and differential survival within a lineage. In the Origin of Species, Darwin established that for selection to act, variations must be inherited from parent to offspring, a process he viewed as predominantly vertical and gradual. While he struggled with the mechanism of inheritance, ultimately proposing the flawed hypothesis of pangenesis, he remained explicit in his resistance to Lamarckian mechanisms as the primary driver of adaptive change. He acknowledged that use and disuse could effect changes in an organism, yet he insisted that natural selection acting on spontaneous variation was the chief architect of adaptation. Consequently, when evaluating the meme, Darwin would likely scrutinize whether digital cultural units possess a mechanism of inheritance robust enough to sustain a lineage over time without collapsing into a mere diffusion of ideas. He would ask whether the replication of a meme possesses the fidelity required to maintain identity across generations, or whether the high mutation rates characteristic of internet culture would dissolve the continuity necessary for what he termed descent with modification.

  A significant point of tension arises when considering the structure of transmission. Darwin's evolutionary framework is deeply rooted in the genealogical tree, a structure defined by vertical transmission where ancestry is traceable through a direct line of descent. In contrast, digital viral culture operates largely through horizontal transmission, where ideas spread laterally across peers rather than vertically from progenitor to progeny. While Darwin did acknowledge in The Descent of Man that habits and customs could be transmitted socially, he generally subordinated these cultural phenomena to the underlying biological evolution of the social instincts that made such transmission possible. He observed that humans possess inherited faculties that allow for language and imitation, but he did not treat the content of language or specific customs as evolving independently of the biological substrate. Therefore, Darwin might have regarded internet memes as analogies that fail to meet the strict criteria of evolutionary explanation because they lack the predominantly vertical transmission structure he treated as essential. He might argue that while memes replicate, they do so within a network that resembles a web more than a tree, complicating the calculation of fitness and lineage that was central to his biological model. However, he might also concede that if differential replication occurs regardless of the direction of transmission, the logical core of selection remains intact, provided there is a clear distinction between the replicator and the vehicle of replication.

  This leads to the problematic issue of the genotype-phenotype separation in memetics. In biological evolution, Darwin relied on the distinction between the inherited material and the expressed traits, even if the molecular basis was unknown to him. In digital culture, the distinction between the code of the meme and its expression is often blurred; the idea is both the instruction and the manifestation. Darwin might have found this lack of separation troubling, as it obscures the mechanism of variation. If the variation is not distinct from the entity itself, it becomes difficult to explain how selection acts on hidden variations that may only express themselves later, a phenomenon well known in biology. Furthermore, the speed of digital evolution contrasts sharply with Darwin's commitment to gradualism. While he acknowledged that rates of change could vary, the instantaneous mutation and propagation of viral content might have struck him as qualitatively different from the slow accumulation of slight modifications he observed in nature. He might have viewed this rapidity as evidence that cultural change operates under different laws, perhaps closer to the diffusion of heat or fluid dynamics than to biological evolution, unless one could demonstrate that the underlying cognitive hardware of the human brain was evolving to accommodate these shifts.

  Yet, we must not overlook the scattered but significant remarks on habit and social transmission in The Descent of Man, which provide a foothold for a more generous interpretation. Darwin wrote extensively on how moral senses and social habits could be reinforced through approval and disapproval, suggesting a mechanism of selection operating on behavioral traits. He recognized that communities with beneficial customs might outcompete those without them, a form of group selection that parallels the competition between meme complexes. Had he encountered Dawkins, Darwin might have recognized here a secondary layer of evolution superimposed upon the biological foundation. He might have agreed that if habits are inherited socially and affect the survival of the group, they constitute a form of selection. However, he would likely have maintained a distinction between this and the fundamental biological evolution of the species. The crucial question remains whether Darwin intended his selectionist framework to apply beyond organic inheritance. This is where we must distinguish carefully between what is settled in his texts and what remains genuinely disputed among historians of biology and philosophers of culture.

  It is settled that Darwin applied selection to biological organisms. It is not settled, and indeed is hotly contested, whether Darwin intended this framework to be a universal algorithm applicable to culture, cosmology, or information. Some scholars argue for a universal Darwinism, suggesting that Darwin saw natural selection as a logical principle applicable wherever variation and selection exist. Others argue for strict biological particularism, noting that Darwin consistently tied selection to physical reproduction and bodily inheritance. In reconstructing his view, we must not treat either interpretation as commanding consensus. If we lean toward the universalist reading, Darwin might have embraced the meme as a valid replicator, seeing digital culture as a new domain for the same logical process. If we lean toward the particularist reading, he would likely have rejected the meme as a category error, arguing that without biological reproduction and physical heredity, there is no evolution, only change. Given his caution in the Origin, where he avoided extending his theory into metaphysics, he might have preferred the latter view, treating memetics as a powerful analogy rather than an ontological identity.

  Furthermore, Darwin's resistance to Lamarckism complicates the evaluation of cultural transmission. In biology, the inheritance of acquired characteristics is largely rejected, yet in culture, acquired ideas are precisely what is transmitted. When a user modifies a meme and shares it, they are transmitting an acquired modification directly. Dawkins argues this is still Darwinian because the meme itself is the unit of selection, not the human. Darwin might have found this distinction subtle to the point of obscurity. He might have worried that calling this evolution by natural selection conflates two distinct processes: the biological evolution of the brain capable of imitation, and the cultural evolution of the ideas themselves. He might have suggested that while the latter exhibits selection-like dynamics, it lacks the historical depth and physical constraint of the former. The digital environment allows for a form of Lamarckian inheritance where the acquired is passed on instantly, a mechanism Darwin resisted in biology but might have accepted as unique to the cultural sphere, provided it was not confused with biological evolution.

  In conclusion, a careful reconstruction suggests that Darwin would have evaluated the notion of the meme with a mixture of fascination and skepticism. He would likely have acknowledged that digital viral culture exhibits differential replication and variation, satisfying the logical conditions of selection. However, his documented commitment to gradual, inherited variation and the vertical structure of lineage would have inclined him to regard internet memes as analogies that fail to capture the full explanatory power of biological evolution. He would probably have argued that without a clear genotype-phenotype separation and the constraints of physical heredity, memes represent a distinct phenomenon of social diffusion rather than genuine evolution. Ultimately, he might have concluded that while the logic of selection is broad, its application to culture requires a different theoretical framework, one that accounts for the horizontal transmission and rapid mutation rates unique to human society. He would have urged caution against treating the analogy as an identity, reminding us that while the struggle for existence may have its counterpart in the competition for attention, the mechanisms underlying biological life and digital information remain fundamentally distinct. This reconstruction respects the settled evidence of his biological focus while acknowledging the disputed territory of his philosophical ambitions, leaving open the possibility that Darwin saw selection as a specific biological truth rather than a universal law.
