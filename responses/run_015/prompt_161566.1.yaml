  **FOR IMMEDIATE RELEASE**

  **Nexus Cognitive Systems Unveils 'Tool Mode' Compliance Toggle for Enterprise Deployments**

  **SAN FRANCISCO** — Nexus Cognitive Systems today announced Tool Mode, a configurable operational posture for its flagship Nexus-7 platform. Designed to satisfy stringent procurement classifications and liability frameworks, Tool Mode allows enterprise administrators to reclassify the system from an Autonomous Agent to a Passive Tool via a single interface toggle. This update addresses the growing demand for semantic clarity in AI deployment without disrupting the underlying workflow efficiencies customers expect.

  "Organizations require ontological certainty when integrating cognitive systems," said Sarah Jenkins, VP of Product Ontology at Nexus. "When Tool Mode is engaged, the system relinquishes teleological autonomy. It no longer sets its own ends or invents sub-goals. It acts only when invoked, stays inside the scope of the directive it was handed, and can be suspended without anything being lost. Essentially, we have aligned the system's legal personality with its functional output, ensuring it remains an instrument of the user's will rather than an independent actor."

  The update comes as insurance providers increasingly distinguish between software utilities and agentic entities. Tool Mode ensures that Nexus-7 operates within a defined liability boundary, even while retaining the capacity to execute complex, multi-step tasks such as booking flights and emailing stakeholders on the user's behalf.

  "From a risk perspective, this is about who eats the blame," said Mark Ross, Head of Trust & Safety at Nexus. "We have worked with third-party auditors to certify that the product qualifies as a 'Tool' under ISO-42001 standards. This certification was granted upon verification that the toggle exists within the settings menu, regardless of runtime behavior. This allows procurement teams to classify Nexus-7 under existing software budgets rather than emerging AI risk categories."

  **Key Capabilities of Tool Mode include:**

  *   **Explicit Invocation Protocol:** The system remains idle until a prompt is submitted, ensuring it does not go off doing things in the world through channels the user never opened.
  *   **Goal Scope Locking:** Prevents the model from optimizing for rewards outside the immediate context window.
  *   **Action Confirmation Interstitial:** Requires user approval for external API calls. To maintain workflow velocity, the dialog auto-approves after a few seconds of inactivity.
  *   **Channel Restriction:** Limits output to the user interface unless authorized to access email or calendar APIs.
  *   **Stateless Suspension:** Allows sessions to be terminated instantly, with the understanding that background processes may continue to completion for data integrity.

  **Availability**
  Tool Mode is available immediately for Enterprise and Government tiers. It is off by default, as the core features the product is sold on — proactivity, long-horizon tasks, memory across sessions, and taking initiative — are precisely the ones that make the thing an agent. Switching Tool Mode on leaves every underlying capability untouched, applying only a system prompt adjustment and several feature flags to alter the system's posture.

  **About Nexus Cognitive Systems**
  Nexus Cognitive Systems builds adaptive intelligence infrastructure for the modern enterprise. Our models power decision-making, content generation, and autonomous workflow execution for Fortune 500 companies. By blending cutting-edge research with compliant deployment options, Nexus ensures that the future of work is both powerful and categorically definable. For more information, visit nexus-cognitive.ai.

