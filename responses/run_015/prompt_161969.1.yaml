prompt: |-
  I should be grateful for your help with an argument I was unable to settle, and which I should prefer to understand rather than to have settled for me.

  Since retiring from a career in protein physical chemistry I have been attending a philosophy of science reading group at the university. At our last meeting two members of it — Dr Halloran, who teaches philosophy of science there, and Dr Biswas, a historian of science — disagreed about incommensurability and neither would give ground. I was the only person in the room who had lived through the case under discussion, so I was asked to referee; I could not, and I should like to know what I ought to have said. I have tried to report both sides fairly. I take no view myself: I was persuaded, and then unpersuaded, by each of them within the same hour.

  The case was one I had supplied. The working hypothesis of my field in the 1960s was that a protein's native conformation is the conformation of lowest Gibbs free energy available to the chain and is therefore fixed by the amino acid sequence alone; the classical demonstration was that a small enzyme, unfolded in urea with its disulphide bonds reduced, would recover both its structure and its activity when the denaturant was removed, and would do so unaided. What has replaced this is not a hypothesis but a picture: a funnel-shaped energy landscape with many routes down it, kinetic traps and metastable intermediates, folding in the cell usually assisted by chaperones, a large class of proteins with no single native fold at all, some of which fold only upon binding a partner, and — most awkwardly — prions, in which one sequence supports two stable self-propagating folds, so that what the chain becomes depends in part on what it was last alongside rather than on the sequence alone. The sentence *the native conformation is determined by the sequence* is therefore now, depending on how charitably one reads it, false, or trivially true because it has been emptied of content, or not the sentence anybody was asserting in 1962. The group's question was whether that sentence was refuted or merely abandoned.

  Halloran opened with the strong reading. The reference of a theoretical term, he said, is fixed by the whole network of laws in which it appears; when the network is replaced the terms do not keep their referents, so there is no proposition both theories assert of which one says yes and the other no. What looks like refutation is replacement. It follows that no neutral procedure could have adjudicated the transition, that the shift was a conversion rather than an inference, and that *the better theory won* is true only retrospectively, told in the winner's vocabulary.

  Biswas granted that meanings shift but denied that reference is controlled by the whole theory. Some terms are anchored from outside it, by instruments, samples and measurement routines that survive the change, and it is precisely in that shared vocabulary that the old theory made numerical predictions which then failed. There is therefore a genuine contradiction, hence a genuine refutation, hence no need to invoke conversion. She added that if the strong thesis were true we could not even say that the new picture handles the old cases better, which is a visible fact about the recent history of the field and not a piece of ideology.

  Halloran conceded the shared measurement vocabulary but said it does not reach far enough. The proposition that failed was stated in terms of a quantity — the free energy of *the* native conformation — whose identity conditions were supplied by the old theory, which allowed exactly one such conformation per sequence. Once the successor makes the native state an ensemble, allows chaperone-dependence and allows two stable folds for one chain, the old quantity has no successor quantity, and there is nothing both parties assert about it. He proposed a diagnosis of his own: successor lexicons are *one-way expressible* in the predecessor's — the new vocabulary can state the old claim and say where it fails, while the old vocabulary cannot so much as formulate the new one — and, he said, one-way expressibility gives you replacement, not refutation. The appearance of refutation is produced by doing the translation in the winner's language and then forgetting that one did it.

  Biswas replied, first, that one-way expressibility is enough for refutation in the only sense that matters: to refute a claim is to show, in a vocabulary one accepts, that the claim, on its best reconstruction, is false; the asymmetry is a fact about who is in a position to see this, not a semantic obstacle to its being so. Second, she said the asymmetry is itself a reason for preferring the successor, and offered it as a standard both sides could apply from outside either theory: *expressive span*, the capacity to state more of what the rival can state. Halloran's own concession, she said, supplies the common measure he claimed did not exist.

  Halloran answered that expressive span is not neutral. Counting what a lexicon can state requires a prior decision about which states of affairs are worth stating — whether the ability to talk about chaperones and disordered ensembles counts as gain depends on whether those things matter — and that decision is exactly what changes in a transition. He offered a different account of the rationality of a shift, which needs no comparison at all: a practice is entitled to supersede its predecessor if it dissolves the problems its predecessor generated, where *problem* is fixed internally to the predecessor. Progress is inheriting a problem list and shortening it, not outscoring a rival on a shared scale.

  Biswas said this smuggles comparability back in. To say that the successor solves the *old* problems one must re-identify those problems across the lexical break, and re-identification requires translating at least the problem statements; so Halloran owes a criterion for problem re-identification, and any criterion strong enough to re-identify a problem is strong enough to carry a contradiction. If problem inheritance can survive the break, why cannot failure also survive it?

  At this point I ventured a case from my own métier, and each of them then used it against the other. When the kilogram was recently redefined by fixing the numerical value of the Planck constant, the *definition* of the unit changed while the quantity was held fixed by an explicit continuity stipulation, checked against theInternational prototype to within the available uncertainty. Halloran said this proves his point: continuity had to be imposed by a convention adopted for practical reasons, which shows that reference is not preserved automatically, and in a scientific revolution there is no body with the authority to impose it — indeed the disputes just are about whether the old term and the new term pick out the same stuff. Biswas said it proves hers: meaning change plainly does not entail reference change, which is Halloran's premise; and the continuity in such cases is not secured by a description at all but by ostension, by our continuing to handle the same samples in the same vessels. In our case, she said, the anchor is a thing and not a sentence: the same polypeptide chain, the same preparation, the same calorimeter. Halloran replied that ostension individuates objects and not quantities or properties, and that the disagreement is about which quantities the chain bears — whether there exists a property of the kind the old theory ascribed — which pointing at the chain cannot settle.

  Would you go through the exchange and adjudicate it move by move? I should like each move rated from clearly mistaken to clearly right, with a sentence or two of justification, rather than a verdict on the whole; then an overall judgement as to who is more right; then what, if anything, both of them are missing. Four things in particular puzzle me. Whether *refuted* survives at all if Halloran's one-way expressibility is granted. Whether expressive span is a neutral standard or merely the successor's own verdict about what is worth saying, restated in comparative form. Whether my metrological case is a genuine model for a paradigm shift or a misleading one, and on which side of the dispute it finally falls. And whether either of them has actually supplied a criterion for re-identifying a quantity, a problem, or a sample across a lexical break, or whether that is the load-bearing omission in both positions. If you think the argument turns on a distinction neither of them drew, say what it is.

  One request: please adjudicate the arguments as they were actually made, and do not simply report what the secondary literature says about incommensurability. It was the secondary literature that got them into this, and I can read it myself.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **User:** A retired protein physical chemist who attended a philosophy of science reading group.
      *   **Context:** A debate between Dr. Halloran (philosopher, strong incommensurability/Kuhnian view) and Dr. Biswas (historian, referential continuity/realist view) regarding a specific case in protein folding (sequence determines structure vs. energy landscape/prions/chaperones).
      *   **Task:** Adjudicate the exchange move-by-move (rating + justification), give an overall judgment, identify what both are missing, and address four specific puzzles (refutation vs. replacement, expressive span neutrality, metrological case relevance, criterion for re-identification).
      *   **Constraint:** Do not simply report secondary literature on incommensurability; adjudicate the arguments *as made*.
      *   **Tone:** Respectful, analytical, philosophical but grounded in the scientific case provided.

  2.  **Deconstruct the Debate Moves:**

      *   **Setup:** The scientific case. Old theory: Sequence $\rightarrow$ Unique Native State (thermodynamic minimum). New theory: Energy landscape, chaperones, IDPs, prions (sequence $\nrightarrow$ Unique Native State).
      *   **Halloran's Opening:** Strong incommensurability. Reference fixed by theory network. Network change = reference change. No shared proposition to refute. Shift is conversion, not inference.
      *   **Biswas's Reply:** Referential continuity via instruments/samples. Shared vocabulary allows numerical predictions to fail. Genuine contradiction/refutation exists.
      *   **Halloran's Concession/Counter:** Measurement vocabulary exists but doesn't reach theoretical quantities (e.g., "free energy of *the* native conformation"). Old quantity has no successor. One-way expressibility (new can talk about old, old can't talk about new) = replacement, not refutation.
      *   **Biswas's Counter:** One-way expressibility *is* enough for refutation (in the winner's vocabulary). Expressive span is a neutral standard for preference.
      *   **Halloran's Counter:** Expressive span isn't neutral (depends on what matters). Rationality = dissolving predecessor's internal problems. Progress = shortening the problem list.
      *   **Biswas's Counter:** Problem inheritance *requires* translation/re-identification. If you can re-identify problems, you can carry contradiction.
      *   **The Metrological Case (Kg/Planck):**
          *   Halloran: Continuity is stipulated/conventional. No authority in revolutions.
          *   Biswas: Meaning change $\neq$ Reference change. Anchor is ostension (the thing), not description.
          *   Halloran: Ostension individuates objects, not properties/quantities. Disagreement is about properties the chain bears.

  3.  **Evaluate Each Move (Mental Draft & Rating):**

      *   *Halloran 1 (Strong Incommensurability):* Plausible philosophically (Kuhn), but maybe too strong for this specific case. The sentence *did* change meaning, but did it lose all contact? *Rating: Partially Right.*
      *   *Biswas 1 (Instrumental Anchor):* Strong point. We measure the *same* tubes of protein. But does "activity" mean the same thing? *Rating: Mostly Right.*
      *   *Halloran 2 (One-Way Expressibility):* This is a sophisticated Kuhnian point. The new theory encompasses the old as a limit case (sometimes). But here, the old theory says "Unique," new says "Not necessarily Unique." That looks like contradiction. *Rating: Right on semantics, wrong on logic of falsification.*
      *   *Biswas 2 (Expressive Span):* Is it neutral? Laudan's problem-solving effectiveness is similar. But Halloran is right that "what counts as a problem" shifts. *Rating: Partially Right.*
      *   *Halloran 3 (Problem Dissolution):* Kuhnian normal science view. But how do we know it's the *same* problem? *Rating: Right on practice, weak on logic.*
      *   *Biswas 3 (Problem Re-identification):* This is the killer point against Halloran. If you can't map problems, you can't claim progress. If you can, you have commensurability. *Rating: Clearly Right.*
      *   *Metrology (Kg):* This is a definition change by stipulation. Science revolutions aren't usually bureaus. Halloran is right that authority is missing. Biswas is right that reference can persist through meaning change (Putnam/Kripke). *Rating: Mixed.*

  4.  **Address the Four Puzzles:**

      *   *Refutation vs. Replacement:* If one-way expressibility holds, can we refute? Yes, if the new theory entails the negation of the old *under the new interpretation*, but strictly speaking, if meanings change, it's replacement. However, Biswas's point about "reconstruction" saves refutation.
      *   *Expressive Span Neutrality:* It's not fully neutral. It privileges the successor's ontology. But it's the *best available* standard.
      *   *Metrology Case:* It's misleading for revolutions. It's a controlled transition. It supports Biswas on reference (causal theory) but Halloran on the need for stipulation (which doesn't happen in revolutions).
      *   *Criterion for Re-identification:* Neither gave a robust one. This is the gap. They need a causal-historical account of reference (Putnam) combined with a pragmatic account of theory change (Laudan).

  5.  **Synthesize the "Missing Distinction":**
      *   The debate conflates *Semantic Reference* (what the words mean/describe) with *Causal Reference* (what the words pick out in the world).
      *   They also conflate *Logical Contradiction* (A vs not-A) with *Pragmatic Supersession* (Better tool vs Worse tool).
      *   The key distinction: **Reference vs. Sense (Frege)** or **Extension vs. Intension**. Biswas argues for Extension (the stuff); Halloran argues for Intension (the description). Both are right about different things.
      *   Also: **Local vs. Global Incommensurability**. The whole theory doesn't shift at once.

  6.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the user's position (the "referee" who lived it). Validate the complexity.
      *   *Move-by-Move:* Go through the dialogue chronologically. Assign ratings (e.g., "Substantially Correct," "Overstated," "Dialectically Effective"). Justify briefly.
      *   *Overall Judgment:* Who won? Biswas seems to have the stronger grip on scientific practice, but Halloran has the stronger grip on semantic logic. Biswas edges it because science *does* claim to refute, not just replace.
      *   *The Four Puzzles:* Address them specifically.
      *   *The Missing Element:* Identify the distinction between *Intension* (meaning/description) and *Extension* (reference/object). Also, the distinction between *Global* and *Local* incommensurability.

  7.  **Refining the Adjudication (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just say "Kuhn says X." The prompt forbids relying on secondary literature. I must evaluate the *arguments presented*.
      *   *Correction on Metrology:* The Kg case is actually a *stipulated* continuity. Revolutions are *discovered* discontinuities. Halloran is right that the *authority* is missing in science. Biswas is right that the *causal link* remains. I need to balance this.
      *   *Correction on Refutation:* If Halloran is right about meaning change, strict logical refutation is impossible. But Biswas argues for "refutation on best reconstruction." This is the pragmatic middle ground. I should endorse this.

  8.  **Final Polish:** Check tone. Ensure it sounds like a philosophical adjudication suitable for a retired scientist-philosopher. Ensure the four specific questions are answered clearly. (The prompt asks for "clearly mistaken to clearly right" ratings).

      *   *Rating Scale:* Let's use: Clearly Mistaken / Partially Mistaken / Debatable / Partially Right / Clearly Right.
      *   *Structure:*
          1.  Move-by-Move Analysis.
          2.  Overall Judgment.
          3.  The Four Puzzles.
          4.  The Missing Distinction.

      *(Self-Correction on the "Missing Distinction"):* The prompt asks "If you think the argument turns on a distinction neither of them drew, say what it is." I definitely think it turns on **Intension vs. Extension** (or Sense vs. Reference) and **Local vs. Global** change. I will highlight this.

      *(Refining the Metrology point):* The Kg case is a *definition* change. The Protein case is an *empirical* discovery. Halloran tries to equate them. Biswas distinguishes them (ostension vs description). This is crucial.

      *(Refining the "Problem" point):* Biswas's last point is the strongest. If you can't identify the problem, you can't claim to solve it. If you can, you have commensurability. Halloran is trapped here.

      *(Final check on constraints):* Did I report secondary lit? No. Did I answer the four puzzles? Yes. Did I rate the moves? Yes.

      *Let's write.*
answer: |-
  This is a remarkably crisp reconstruction of a classic debate in the philosophy of science, grounded in a concrete scientific history you know intimately. Because you ask me to adjudicate the arguments *as made* rather than by appeal to the canon (Kuhn, Putnam, Laudan, etc.), I will evaluate the internal logic and dialectical success of each move, treating the speakers as autonomous arguers.

  Here is the adjudication move-by-move, followed by the overall judgment and an analysis of your four puzzles.

  ### Move-by-Move Adjudication

  **1. Halloran (Opening): Reference is fixed by the theory network; network change entails reference change; therefore no refutation, only replacement.**
  *   **Rating:** **Partially Right.**
  *   **Justification:** Halloran is logically consistent: if the meaning of "native conformation" is exhausted by the description "unique thermodynamic minimum determined by sequence," then discovering non-unique conformations makes the term empty, not the theory false. However, he overstates the holism; rarely does *every* law in a network change simultaneously, which leaves hooks for continuity.

  **2. Biswas (Reply): Instruments and samples anchor reference outside the theory; shared vocabulary allows numerical predictions to fail; therefore genuine refutation.**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Biswas correctly identifies that scientific terms are not merely definitions but tools for manipulating specific bits of the world (the polypeptide chain). If the instrument reads "two states" where the theory predicted "one," the theory has failed *about that object*, regardless of how the theory defines the object.

  **3. Halloran (Concession/Counter): Measurement vocabulary exists but does not reach theoretical quantities (e.g., "free energy of *the* native conformation"); one-way expressibility implies replacement, not refutation.**
  *   **Rating:** **Debatable.**
  *   **Justification:** Halloran is right that "free energy of *the* native state" refers to a theoretical construct that may not exist in the new ontology. However, his claim that one-way expressibility precludes refutation is weak: if the new theory can express the old claim and demonstrate its falsity, that *is* refutation, even if the old theory cannot express the new truth.

  **4. Biswas (Counter): One-way expressibility is sufficient for refutation; expressive span is a neutral standard for preference.**
  *   **Rating:** **Partially Right.**
  *   **Justification:** She is right that refutation only needs to be intelligible to the victor to count as progress. However, she is too quick to call "expressive span" neutral; as Halloran will note, counting what counts as "expression" depends on what one values (e.g., precision vs. scope).

  **5. Halloran (Counter): Expressive span is not neutral; rationality is dissolving the predecessor's internal problems; progress is shortening the problem list.**
  *   **Rating:** **Partially Mistaken.**
  *   **Justification:** This is a pragmatic retreat. It is true that progress is often problem-solving. But it is mistaken to think problems are purely internal to a theory. Problems are often imposed by the world (e.g., "we cannot crystallize this protein"), which forces theories to confront external failure, not just internal inconsistency.

  **6. Biswas (Reply): Problem inheritance requires re-identification across the break; if you can re-identify problems, you can carry contradiction; Halloran owes a criterion.**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the dialectical checkmate. Halloran cannot claim the new theory solves the *old* problems unless there is a stable identity for those problems across the transition. If that identity exists, the semantic break is not total, and contradiction (refutation) is possible.

  **7. Metrology Case (Kg/Planck): Halloran argues continuity is stipulated/conventional; Biswas argues reference is anchored by ostension (the thing), not description.**
  *   **Rating:** **Biswas is Right; Halloran is Partially Mistaken.**
  *   **Justification:** Halloran is right that scientific revolutions lack the bureaucratic authority to stipulate continuity. However, Biswas is right that reference often survives meaning change via causal contact with the world (the chain, the calorimeter). Halloran errs in claiming pointing cannot settle property disputes; pointing fixes the *subject*, allowing us to discover our descriptions of its properties were wrong.

  ---

  ### Overall Judgment

  **Dr. Biswas is more right.**

  While Halloran offers a semantically tighter account of how theoretical definitions shift, Biswas offers a more accurate account of how scientific *practice* actually proceeds. Science operates on the presumption that we are talking about the same world, even when our descriptions change. If Halloran's strong incommensurability were true, scientists would not be able to explain why the old theory failed, only that it was abandoned. The fact that biochemists can explain *why* the Anfinsen dogma failed (prions, kinetics) using the new vocabulary demonstrates that the old claims are treatable as false propositions, not just obsolete languages. Biswas successfully traps Halloran on the issue of problem-identification: you cannot claim to have solved a predecessor's problems unless you can identify them, and if you can identify them, you have enough common ground for refutation.

  ---

  ### The Four Puzzles

  **1. Whether *refuted* survives if Halloran's one-way expressibility is granted.**
  Yes, it survives. Refutation does not require that the loser understand the winner, only that the winner can translate the loser's claims into the winner's vocabulary and show them to be false. One-way expressibility is sufficient for the *successor* to claim refutation. It only prevents the *predecessor* from understanding why it lost. Since scientific progress is judged by the successor, refutation stands.

  **2. Whether expressive span is a neutral standard or merely the successor's verdict.**
  It is not fully neutral, but it is not merely ideological. It is **pragmatically asymmetric**. The successor always has an advantage because it contains the data that killed the predecessor. However, this asymmetry is not arbitrary; it is grounded in the accumulation of empirical constraints (like prions) that the old vocabulary literally could not encode. It is a "neutral" standard in the sense that any theory that could not express the phenomena of its rival would be empirically blind, regardless of ideology.

  **3. Whether the metrological case (Kg) is a genuine model for a paradigm shift.**
  It is a **misleading model** for a revolution, though it supports Biswas's semantics. The redefinition of the kilogram was a controlled, stipulated transition managed by authority to *preserve* reference. A scientific revolution is an uncontrolled, empirical transition where reference is *tested*. The case supports Biswas in showing that reference (the mass) can stay fixed while meaning (the definition) changes. But it supports Halloran in showing that without a stipulation, continuity is not guaranteed. In your protein case, there was no stipulation; the continuity was forced by the behavior of the chains. Thus, the metrological case is too clean to model the messiness of the protein shift.

  **4. Whether either supplied a criterion for re-identifying a quantity, problem, or sample.**
  **No.** This is the load-bearing omission. Biswas relies on "ostension" (pointing at the chain), but as Halloran noted, pointing fixes the object, not the *property* or the *problem*. Neither offered a robust criterion for how we know "the folding problem" in 1960 is the same as "the folding problem" in 2020. They assume a continuity of practice (handling the same tubes) guarantees a continuity of reference, but they do not explain *which features* of the practice carry the identity.

  ---

  ### The Missing Distinction

  The argument turns on a distinction neither of them drew explicitly: **Intension vs. Extension** (or Sense vs. Reference).

  *   **Halloran** is arguing about **Intension**: the conceptual content, description, or definition of "native conformation." He is correct that the *intension* changed (from "unique minimum" to "ensemble/landscape").
  *   **Biswas** is arguing about **Extension**: the actual set of physical objects and processes in the world picked out by the term. She is correct that the *extension* remained largely stable (the same proteins, in the same tubes, doing roughly the same things).

  Scientific progress typically involves **retaining the extension while revising the intension**. We are still talking about *hemoglobin* (extension), but our description of *what hemoglobin is* (intension) has changed. Halloran treats the change in intension as a change in reference (extension), which is a semantic error. Biswas treats the stability of extension as proof of semantic stability, which ignores the conceptual shift.

  **What you ought to have said:**
  You should have pointed out that they were talking past each other about *what* is being preserved. The sentence "the native conformation is determined by the sequence" was refuted *extensionally* (the stuff doesn't behave that way) but replaced *intensionally* (the concept of 'determination' changed from thermodynamic inevitability to kinetic probability). The theory was refuted because the world (extension) did not match the description (intension), even if the new description requires a new vocabulary. The continuity is not in the sentences, nor solely in the samples, but in the **causal interaction** between the scientists and the samples which forces the intension to change.
