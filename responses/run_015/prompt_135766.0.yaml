          *   **YES:** **Cartesian Transparency**
              *   *Awkward Commitment:* Must deny the existence of unconscious mental states that escape notice.
          *   **NO:** **[Empty Branch: Infallible Mechanism]**
              *   *Awkward Commitment:* Incoherent; positing a mechanism implies the possibility of malfunction.
  *   **YES (Fallible Authority)**
      *   **Branch Claim:** "Confabulation is a rare, correctable error rather than a systematic feature of self-reporting."
          *   **NO (Essentially Unreliable)**
              *   **Branch Claim:** "Knowing your own mind involves a separate mental process distinct from the state itself."
                  *   **YES:** **Illusionism**
                      *   *Awkward Commitment:* Must explain why evolution favoured a system designed to deceive the host.
                  *   **NO:** **[Empty Branch: Unreliable Transparency]**
                      *   *Awkward Commitment:* Incoherent; if there is no gap or mechanism, the source of systematic error is unexplained.
              *   *(Alternative Leaf for this cluster)*: **Eliminativist or Behaviourist Scepticism**
                  *   *Awkward Commitment:* Must treat first-person reports as mere behaviour rather than privileged data.
          *   **YES (Merely Indicative)**
              *   **Branch Claim:** "Knowing your own mind involves a separate mental process distinct from the state itself."
                  *   **NO:** **Interpretivist or Narrative Accounts**
                      *   *Awkward Commitment:* Must accept that self-knowledge is constructed rather than discovered.
                  *   **YES (Mechanism Exists)**
                      *   **Branch Claim:** "This internal process functions analogously to physical perception (e.g. sight or hearing)."
                          *   **YES:** **Perceptual Model (Inner Sense)**
                              *   *Awkward Commitment:* Must explain why the 'inner eye' never suffers blindness quite like outer sight.
                          *   **NO:** **Higher-Order Theories (HOT/HOP)**
                              *   *Awkward Commitment:* Must accept that unconscious mental states are possible without the higher-order tag.
