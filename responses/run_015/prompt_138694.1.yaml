      *   *Check:* Did I choose one alternative analogy or combine them? *Correction:* The prompt asks "Which of those does comparable work?" I should evaluate them and pick the strongest or synthesize. The "Interface Contract" + "Constitution" seems strongest for AI. I will argue for a synthesis: **Constitutional Interface.**
      *   *Check:* Did I address the "Rule-Consequentialism" slide? *Yes, in section 3.*

  8.  **Final Polish:** Check against the prompt's constraints (Table required, Verdict required, specific analogies evaluated).

  *(Self-Correction Note)*: I need to make sure I don't just say "Constitution is better." I need to explain *why* it doesn't import the same failure (i.e., treating rules as mere heuristics). A Constitution is binding *on* the sovereign, not just a guide for the driver.

