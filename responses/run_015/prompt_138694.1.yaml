      *   *Section 4 (Coordination):* Schelling points. Pluralism.
      *   *Verdict:* Clear "No."
      *   *Alternative:* Propose the "Constitutional/Contractual" hybrid. Explain why it avoids the traffic code's failures (specifically regarding optimization pressure).

