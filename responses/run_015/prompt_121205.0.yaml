  3.  **Drafting the Objections (Voice & Content):**

      *   *Objection 1 (The 4Dists):* Most likely. They live and breathe this. They will say you're multiplying entities unnecessarily. "Why not just temporal parts?"
      *   *Objection 2 (The Logical Positivist):* High damage. If the distinction isn't empirical, it's nonsense to them. "Verification principle."
      *   *Objection 3 (The AP Teacher):* Skeptical of "normative." "You're smuggling in mind-dependence."
