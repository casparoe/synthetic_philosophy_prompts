      *   *Objection 5 (The 4Dists - Follow up):* "Coincidence." How can two things be in the same place?
      *   *Objection 6 (AP Teacher):* "Sortal Relativity." Is it just how we *describe* it, not what it *is*?
      *   *Objection 7 (General/Positivist):* "Causal Exclusion." If Clay does all the work, what does Statue do?

      *Refining the Voices:*
      *   Teacher: "In my class, we treat persistence as..."
