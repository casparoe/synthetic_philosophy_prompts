  4.  **Drafting Replies (2-minute limit approx. 250-300 words spoken):**
      *   Need to be concise, firm, but acknowledge the weakness.
      *   *Strategy:* Stick to the "Normative" angle. It's not about *what* it is made of, but *what it is for*.

  5.  **Identifying Concessions & Weaknesses:**
      *   *Weakest Point:* The ontological status of "norms." Are they real? If they are mind-dependent, is the statue mind-dependent? If the statue is mind-dependent, is it less real than the clay?
      *   *Opening Concessions:* Admit this doesn't solve *all* constitution puzzles. Admit "normative" is tricky.

