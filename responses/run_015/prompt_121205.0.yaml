answer: |-
  # Q&A Prep Sheet: Normative Persistence and Material Constitution

  ## Opening Remarks: Strategic Concessions
  *Before taking questions, state the following to lower defenses:*
  1.  **Concede Coincidence is Weird:** "I acknowledge that claiming two things occupy the same space is counter-intuitive. I am not arguing this is common sense, but that it is the cost of preserving our distinct practices of tracking objects."
  2.  **Concede 'Normative' is Loaded:** "I am using 'normative' not necessarily in a moral sense, but in a functional teleological sense. I am not claiming the clay *ought* to obey physics, but that the statue *ought* to maintain form to remain a statue."
  3.  **Concede Scope:** "This framework is designed for artifact constitution (statues/clay), not necessarily for biological organisms or elementary particles."

  ---

  ## The Weakest Point in Your Position
  **The Ontological Status of Norms:** Your argument hinges on "artistic-intentional continuity" being a real condition of persistence. If these norms are just human conventions (conceptualism), then the distinction between Statue and Clay is linguistic, not ontological. If they are real features of the world, you risk positing spooky non-physical properties. You must be prepared to defend whether these norms are *mind-independent* or *mind-dependent* without collapsing into Idealism or Linguistic Conventionalism.

  ---

  ## The Objections (Ordered by Likelihood and Damage)

  ### 1. The Four-Dimensionalist Relocation (The Undergrads)
  **Voice:** "You're solving a problem that doesn't exist. On the perdurantist view, the 'Statue' and the 'Clay' are just distinct temporal worms that share a temporal part at this moment. When the clay is melted, the Clay-worm continues, but the Statue-worm ends. You don't need 'normative persistence'; you just need distinct temporal extensions. Why multiply entities beyond necessity?"
  **Your Reply (2 mins):** "The temporal parts solution relocates the problem but doesn't solve the synchronic distinctness. Even if they are worms, at *this* moment, the part of the Clay-worm and the part of the Statue-worm are coincident. My argument explains *why* they are distinct worms in the first place. It isn't just that they extend differently; it's that the *principle* governing their extension differs. The Clay extends via physical continuity; the Statue extends via intentional continuity. Without normative conditions, you can't explain why the Statue-worm terminates at the melting point while the Clay-worm continues, other than by brute stipulation. I offer the *ground* for the temporal division, not just the division itself."
  **Weakness/Concession:** Concede that 4Dism is logically consistent. Your advantage is explanatory depth regarding *why* the worms divide, not logical necessity.

  ### 2. The Verificationist Challenge (The Logical Positivist Classmate)
  **Voice:** "What empirical test distinguishes the 'normative persistence' of the statue from the 'physical persistence' of the clay? If I scan the atoms, I see only clay. If your distinction makes no difference to physical observation, isn't the claim 'they are numerically distinct' cognitively meaningless?"
  **Your Reply (2 mins):** "The distinction is empirically verifiable in terms of *counterfactual interventions*, which are scientific. If we melt the object, the Clay persists (verifiable by chemical analysis of the coin), but the Statue does not (verifiable by the loss of aesthetic function and artistic identity). The 'norm' is not a ghostly substance; it is a dispositional property regarding how the object reacts to specific causal processes. If the object survives melting, it was Clay. If it ceases to exist as an artwork, it was a Statue. The difference lies in the outcome of the intervention, which is observable."
  **Weakness/Concession:** Concede that the "existence" of the statue is not a physical quantity like mass. You are arguing for a functional ontology, not a purely physical one.

  ### 3. The Mind-Dependence Trap (The AP Teacher)
  **Voice:** "You say the statue survives only if 'artistic intention' is maintained. Does this mean if everyone forgets it's a statue, it ceases to exist and becomes just clay? You're making ontology dependent on psychology. That's not metaphysics; that's idealism."
  **Your Reply (2 mins):** "I distinguish between the *existence* of the intention and the *history* of the intention. The statue's persistence conditions are fixed at its creation by the artist's intent. Once established, the normative track is set. Even if all humans vanish, the object remains a 'statue' in virtue of its historical causal origin, not current observation. The norm is historical, not observational. It survives based on whether its form aligns with its *original* constitutive rule, not whether anyone is currently looking at it."
  **Weakness/Concession:** This is your danger zone. If pressed on whether "historical intent" is a physical property, concede that it is a *relational* property, not an intrinsic physical one.

  ### 4. The "Too Many Objects" Objection (The Undergrads)
  **Voice:** "If normative conditions create distinct objects, don't we have infinite objects here? There's the Clay, the Statue, the 'Statue-minus-a-particle,' the 'Artifact-of-2024.' You've opened the floodgates to absurd coincidence."
  **Your Reply (2 mins):** "Not every description generates a norm. Persistence conditions are tied to *substantial kinds* with functional teleology. 'Statue-minus-a-particle' has no functional integrity or intentional history; it's a gerrymandered description. The Clay and the Statue represent two competing *functional kinds*: one defined by material continuity, one by aesthetic integrity. We only multiply entities where there are distinct, stable principles of diachronic identity at play, not for every arbitrary temporal slice."
  **Weakness/Concession:** Concede the line between "stable kind" and "gerrymandered description" is fuzzy. You rely on a pragmatic constraint on ontology.

  ### 5. The Buddhist *Anicca* Critique (The Peer)
  **Voice:** "In Buddhist metaphysics, both the clay and the statue are empty of inherent existence (*svabhava*). They are both processes of impermanence. By distinguishing them, aren't you just reifying two different illusions? Why does it matter which illusion persists?"
  **Your Reply (2 mins):** "My argument isn't about ultimate reality, but about conventional truth (*samvrti-satya*). Even if both are impermanent, they operate on different timescales and conditions of dissolution. In the conventional world where we live and act, melting the statue matters. My thesis respects the *anicca* of the clay but highlights that the 'statue' dissolves *sooner* due to different conditions. I am mapping the structure of our conventional reality, not claiming eternal substance."
  **Weakness/Concession:** Concede that on an ultimate level, your distinction may not hold. You are working within the framework of Western artifact ontology, not soteriological liberation.

  ### 6. The Causal Exclusion Worry (The AP Teacher)
  **Voice:** "If the Clay constitutes the Statue, the Clay does all the causal work (holding up the roof, blocking light). What causal work does the Statue do? If none, why posit it as a distinct entity?"
  **Your Reply (2 mins):** "The Statue does different *sortal-sensitive* causal work. The Clay causes physical effects; the Statue causes aesthetic and historical effects. The Clay doesn't 'inspire viewers' or 'win awards'; the Statue does. These are real causal powers in the social and aesthetic realm. If we reduce everything to Clay, we lose the ability to explain art history or valuation. The Statue is the bearer of properties the Clay cannot instantiate."
  **Weakness/Concession:** Concede that physical causal closure is maintained by the Clay. You are arguing for *explanatory* causal power, not fundamental physical force.

  ### 7. The Sortal Relativity Objection (The Undergrads)
  **Voice:** "Isn't this just Sortal Relativity? It's the same object, but we count it differently depending on whether we apply the sortal 'statue' or 'clay.' You're turning an ontological claim into a linguistic one."
  **Your Reply (2 mins):** "If it were merely linguistic, then destroying the statue wouldn't actually destroy anything ontological, just a label. But when the statue is melted, an aesthetic entity *ceases to function*. The loss is real, not just descriptive. Sortal relativity suggests one object under two descriptions. I argue for two objects because the conditions for their continued existence are mutually exclusive in the melting scenario. One survives, one dies. That requires numerical distinctness, not just descriptive variance."
  **Weakness/Concession:** This is the hardest distinction to maintain. Concede that the "distinctness" is not spatial, but modal/normative.

  ---

  ## The Dreaded Question (Hope Nobody Asks)
  **The Question:** "In virtue of *what* do these normative conditions exist? If they aren't physical properties of the atoms, and they aren't just in our heads (since you claimed the statue survives without observers), where do they live? Are you positing a third realm of abstract normative facts?"

  **Why it's Devastating:** It forces you into a trilemma:
  1.  **Physicalism:** Norms are physical (implausible).
  2.  **Idealism:** Norms are mental (contradicts your "historical intent" defense).
  3.  **Platonism:** Norms are abstract objects (ontologically expensive and weird for a high school symposium).
  Any answer risks alienating half your audience (Positivists, Physicalists, or Nominalists).

  **Damage Control Reply:** "I am not positing a third realm. I am arguing for *relational properties*. The norm exists in the causal-historical relation between the maker, the material, and the form. It's not a 'thing' added to the clay; it's the *structure of the history* of the clay. Just as a 'marriage' isn't a physical substance but a real relational status, the 'statue' is a real historical status of the clay. It supervenes on the physical history without being reducible to the current atomic arrangement."
  *(Note: If they press on "supervenience," admit that this is the limit of your current thesis and a topic for future research.)*
