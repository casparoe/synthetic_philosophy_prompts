      *Wait, is 50 actually better for radio astronomy?* If the signal repeats, missing one pulse isn't fatal if you catch the next. But the "optimal window" implies a specific alignment is needed. If the period is wrong, the phase drifts. 50 is the safest bet to be "close enough" to either to trigger the array's sensitivity window if it has width.
      Okay, I will argue the friend is more defensible *for the purpose of the proposal*, but the user is right that it's not a scientific conclusion. The resolution bridges this.

