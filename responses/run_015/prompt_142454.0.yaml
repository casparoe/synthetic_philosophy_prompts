answer: |-
  Your friend gave you a very standard, "Intro to Decision Theory" version of the Money Pump Argument (MPA). It is the version usually taught to motivate the axioms of rational choice. However, your intuitions are sharper than the summary you were given. You have correctly identified the two biggest controversies in modern decision theory regarding this argument: the role of **anticipation (sophistication)** and the distinction between **logical consistency vs. self-control.**

  Here is a breakdown of what your friend got right, where the argument is contested, and where it is technically mistaken, addressing your specific questions.

  ### 1. "Seeing it coming doesn't save you"
  **Verdict: Wrong (or at least highly contested).**

  Your friend claims that even if you see the loop coming, you are forced to make the trades because "at every step the trade on offer is the one your own preferences say to take." This assumes a specific model of choice called **Myopic Choice**.

  *   **Myopic Choice:** You treat every decision node as an isolated event. You look at Coffee vs. Tea + 1¢, prefer the latter, and swap. You do not consider that this choice leads to a future node where you will lose more money.
  *   **Sophisticated Choice:** You anticipate your future behavior. You use **backward induction**.
      *   You look at the final step (Juice → Coffee). You know Future-You will make that trade (because You prefer Coffee to Juice).
      *   Therefore, you know that if you accept the second trade (Tea → Juice), you will end up with Coffee minus 3 cents.
      *   Therefore, at the *first* step (Coffee → Tea), you compare "Keep Coffee" vs. "End up with Coffee minus 3 cents."
      *   Since you prefer Coffee to Coffee-minus-3-cents, a **Sophisticated** agent refuses the very first trade.

  **The Implication:** If you are sophisticated, intransitive preferences do *not* necessarily lead to a money pump. They lead to **status quo bias** (you refuse to trade because you know where it leads). Your friend dismissed this by calling it "resoluteness," but in decision theory, this is called **Sophistication**, and it is distinct from resoluteness. It suggests that anticipating the pump *does* rescue you, provided you are capable of reasoning dynamically over the whole tree of choices rather than locally at each node.

  ### 2. Intransitivity vs. Preferences Over Time
  **Verdict: Half-Right (Structurally similar, metaphysically distinct).**

  Your friend slides between two different problems:
  1.  **Synchronous Intransitivity:** At this exact moment, you prefer A > B > C > A. This is a logical contradiction in your ranking of states of the world.
  2.  **Diachronic Inconsistency (Time):** Tonight-You prefers Plan X. Tomorrow-You prefers Plan Y.

  **The Difference:**
  *   **The Intransitivity Pump** attacks the logical structure of your preferences *right now*. It argues that if your preferences cycle, you are vulnerable to dominance (you could have kept the coffee and the money).
  *   **The Time Pump** attacks the continuity of your agency. It argues that you are effectively different people at different times.

  **Does the same lesson follow?**
  Not necessarily.
  *   For **Intransitivity**, the standard fix is to **change your preferences** until they are transitive. (Admit you actually like Coffee best and stop the cycle).
  *   For **Time Inconsistency**, changing preferences isn't always possible (you can't force Tomorrow-You to value health the way Tonight-You does). The solutions here are **Pre-commitment** (locking the liquor cabinet) or **Resoluteness**.

  Your friend is right that they share a name and a structure (cycling leads to loss), but conflating them hides the fact that the solution to one (fix your logic) is different from the solution to the other (bind your future self).

  ### 3. The Footnote: Does it require one exploiter?
  **Verdict: Misleading.**

  Your friend's footnote suggests that if three *different* people offer the swaps, there is no money pump. This confuses the **normative argument** with the **psychological scenario**.

  *   **The Normative Point:** The Money Pump Argument is not about whether a villain is actively trying to drain your bank account. It is about **Dominance**. If you have intransitive preferences, there exists a *possible* sequence of trades that leaves you worse off than where you started. Rationality requires that you not occupy a position that is *vulnerable* to dominance, regardless of whether anyone is actually around to exploit it.
  *   **The Footnote's Error:** Even if three strangers offer the trades, if you accept all three, you are still three cents down. You have still been "pumped" in the sense that you suffered a sure loss. The fact that no single person profited from the whole cycle doesn't change the fact that *you* lost. The argument establishes that your preferences make you vulnerable to loss, not that you need a conspirator to lose.

  ### 4. Does this establish that you ought to be "Resolute"?
  **Verdict: No. Resoluteness is just one of three contested responses.**

  In the literature on dynamic choice (specifically regarding time inconsistency), there are three main camps. Your friend presented **Resoluteness** as the obvious conclusion, but it is actually the most controversial.

  1.  **Naive:** You don't anticipate the change. You make the plan, then break it. You get pumped. (Your friend says this is irrational).
  2.  **Sophisticated:** You anticipate the change. You realize you will break the plan, so you don't make the plan (or you refuse the first trade). You avoid the pump by restricting your options. (This is the standard Game Theoretic solution).
  3.  **Resolute (McClennen):** You make the plan, and when the time comes to break it, you *ignore* your current preferences and stick to the plan anyway.

  **Why Resoluteness is controversial:**
  Resoluteness requires you to violate a principle called **Separability**. Separability says that when making a choice now, only the future consequences matter; the fact that you "planned" to do it in the past shouldn't count. Resoluteness says the past plan *does* count.
  Many decision theorists argue Resoluteness is irrational because it asks you to act against your current best judgment. Others argue it is the only way to achieve long-term goals. The Money Pump Argument does not *prove* Resoluteness is the right answer; it merely shows that *something* has to give (either you change preferences, you restrict options, or you become resolute).

  ### 5. Summary: What does the Money Pump actually show?

  If you were to ask a professional decision theorist today, they would likely tell you this:

  1.  **It is a Pragmatic Argument, not a Logical Proof.** The MPA doesn't prove intransitivity is logically impossible (like 2+2=5). It proves it is **pragmatically costly**. It shows that intransitive preferences occupy a "dominated" position.
  2.  **It Relies on Myopia.** The pump only works if the agent treats choices in isolation. If the agent is **Sophisticated**, the pump fails (they refuse the first trade). Therefore, the MPA actually proves that **Rationality requires either Transitivity OR Sophistication.** You can keep intransitive preferences if you are smart enough to know not to trade.
  3.  **It Leaves "Resoluteness" Open.** The MPA shows that dynamic inconsistency is costly. It does not dictate *how* to solve it. Pre-commitment (Ulysses tying himself to the mast) is often seen as more rational than Resoluteness (Ulysses ignoring his current desire to hear the sirens).

  ### Final Tally on Your Friend's Claims

  *   **"Intransitivity lets someone turn you into a money pump."**
      *   *Status:* **Mostly Right.** (Technically: it makes you *vulnerable* to a pump).
  *   **"Seeing it coming changes nothing."**
      *   *Status:* **Wrong.** (Sophisticated agents use backward induction to refuse the first trade).
  *   **"Preferences over time is the same argument."**
      *   *Status:* **Half-Right.** (Same structure, different metaphysics, different standard solutions).
  *   **"You need one person running the cycle (Footnote)."**
      *   *Status:* **Wrong.** (Vulnerability exists regardless of the exploiter's identity).
  *   **"The lesson is you should be resolute."**
      *   *Status:* **Contested.** (Sophistication and Pre-commitment are equally valid responses).

  **The Bottom Line:** You were right to be bugged. Your friend gave you the "folklore" version of the argument. The "seeing it coming" objection is the standard rebuttal taught in advanced courses, and the distinction between fixing your preferences (transitivity) and fixing your agency (resoluteness) is crucial. The Money Pump is best understood not as a proof that you *will* lose money, but as a demonstration that your current decision-making procedure leaves you **exposed** to losing money if the world is unkind. Rationality, therefore, is about closing that exposure, whether by changing tastes, anticipating traps, or binding your future self.
