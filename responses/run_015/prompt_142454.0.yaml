      *   *The Friend's Error:* The friend claims "at every step the trade on offer is the one your own preferences say to take." This assumes *myopic* choice. A rational agent maximizes over the *tree*, not just the *node*.
      *   *Resoluteness:* McClennen's view. Resolute choice means sticking to the plan even if at Node 3 your local preference says "swap." This violates *separability* (the idea that past sunk costs shouldn't matter). It's a specific, contested model of rationality.
