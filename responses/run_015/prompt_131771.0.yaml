          *   Address Le Verrier's options (error, force law, unobserved mass) and how each theory ranks them/expects outcomes.
          *   Address the "Differential Vindication Constraint" (same method, different results: who gets credit/blame?).
          *   Employ two distinctions:
              1.  *Production vs. Reach:* Does the law make things happen or just license expectations? (Test the user's suspicion that this case is about reach, not production).
              2.  *Slippage/Tolerance:* For the Humean, residuals are unsystematized particulars. How much slippage is tolerable? Does this case introduce "extendability" as a virtue? Is this secretly anti-Humean?
