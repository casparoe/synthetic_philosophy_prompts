          *   *Options:* The law governs the matter. Anomaly = missing matter or bad data. Changing the law is a last resort (metaphysical cost).
          *   *Expectation:* If the law governs, the prediction *should* hold.
          *   *Differential Vindication:* This is the pressure point. If laws govern, why did the same law license a falsehood? The Anti-Humean must say Newton wasn't the *true* law. But then, why did Neptune work? (Approximate truth?).
          *   *Reach vs. Production:* User's suspicion holds. The case doesn't prove governance (production), only predictive success.
          *   *Slippage:* For the governing view, slippage is error. Vulcan was a sign the law was limited.
      *   **Part 3: The Differential Vindication Constraint:**
          *   Weigh this heavily. It hurts the Anti-Humean more. The Humean expects fallibility in projection. The Governing view implies a tighter connection between law and outcome that makes the Vulcan error look like a failure of the law's "power" (even if it's just epistemic access).
      *   **Part 4: Production vs. Reach:**
