answer: |-
  This is a sharp pedagogical pivot. Using the Neptune/Vulcan pair forces the metaphysics to confront the history of scientific practice, specifically the riskiness of inference to the best explanation when the "best explanation" relies on the continuity of laws. Below is the disciplined mapping you requested, followed by an assessment of the distinctions and a final verdict.

  ### I. The Humean Mapping (Best System Account)

  **1. Le Verrier's Options and Ranking**
  For the Humean, laws are the axioms of the system that best balances simplicity and strength in summarizing the mosaic. Le Verrier is effectively asking: *How do we incorporate these new data points (the residuals) into the system with the least cost to simplicity and the most gain in strength?*

  *   **Option A (Observational/Computational Error):** Discard the data points.
      *   *Humean Ranking:* Low priority, assuming the data is robust. If the residuals are real features of the mosaic, ignoring them reduces the *strength* of the system (it covers less of the mosaic) without gaining *simplicity*.
  *   **Option B (Tinker with the Force Law):** Change the inverse-square law.
      *   *Humean Ranking:* High cost. Changing the fundamental equation reduces *simplicity* drastically. It requires rewriting the summary for *all* planetary bodies, not just the anomaly.
  *   **Option C (Add Unobserved Mass):** Keep Newton, add initial conditions (a planet).
      *   *Humean Ranking:* Preferred. This preserves the simple axiom (Newton's law) and increases *strength* by subsuming the residual under the existing system. It treats the anomaly as a matter of particular fact (initial conditions/matter distribution) rather than a failure of the summary rule.

  **2. Expectations and Entitlements**
  Before the telescope points, what is the Humean entitled to expect?
  *   **Expectation:** High probability of success, but not certainty. The expectation is inductive. The system has summarized the rest of the solar system well; projecting it into the unobserved region is a bet on the *uniformity* of the mosaic.
  *   **Entitlement:** Le Verrier is entitled to the inference because it maximizes the expected value of the system's strength/simplicity ratio. He is not entitled to claim the planet *must* exist in a modal sense, only that its existence is the most efficient way to complete the summary.

  **3. The Differential Vindication Constraint**
  *   **Credit/Blame:** The Humean takes the hit for Vulcan gracefully. Since laws are just summaries, a failed prediction means the projection of the summary failed, not that a "governing power" misfired.
  *   **Symmetry:** The Humean handles the symmetry of Neptune and Vulcan well. Both were rational attempts to optimize the system. Neptune succeeded because the mosaic happened to contain the mass; Vulcan failed because the mosaic did not. The *method* remains vindicated as a heuristic for system-building, even if the specific instance (Vulcan) was a false positive. The Humean does not need to explain why the law "worked" for Uranus and "failed" for Mercury in a metaphysical sense; they simply note that the Newtonian system is a better fit for Uranus + Neptune than for Mercury + Vulcan (since Vulcan isn't there).

  ### II. The Anti-Humean Mapping (Governing Laws)

  **1. Le Verrier's Options and Ranking**
  For the Anti-Humean, laws describe relations that hold in virtue of the nature of properties or powers; they constrain what is possible.
  *   **Option A (Error):** The observation failed to track the governed reality.
      *   *Ranking:* Plausible, but if the residual is robust, the governance is being obscured.
  *   **Option B (Tinker with the Force Law):** The law itself is different.
      *   *Ranking:* Metaphysically costly. If Newton's law captures the genuine nomic relation, it should hold universally. Changing it implies the previous law was not the *true* law.
  *   **Option C (Add Unobserved Mass):** The law governs the interaction; the mass is the relatum.
      *   *Ranking:* Preferred. It preserves the integrity of the law. The law governs *whatever* mass is present. If the orbit deviates, there must be mass there to be governed.

  **2. Expectations and Entitlements**
  *   **Expectation:** Higher modal force. If the law *governs*, and the initial conditions (Uranus/Mercury) are fixed, the outcome is constrained. The Anti-Humean might feel more entitled to the prediction because it rests on a necessary connection (given the law), not just a summary statistic.
  *   **Entitlement:** Le Verrier is entitled to expect the planet because the law *demands* an explanation for the perturbation. The perturbation cannot be a "brute fact" (an unsystematized particular); it must be the result of the law operating on some substance.

  **3. The Differential Vindication Constraint**
  *   **Credit/Blame:** This is the pressure point. The Anti-Humean struggles with the symmetry. If Newton's Law is a governing law, why did it license a falsehood (Vulcan)?
  *   **The Problem:** A governing law is supposed to track the structure of reality. If the inference from the law to the existence of Vulcan is valid, and Vulcan does not exist, then either the law is false or the inference rules are unsound.
  *   **Resolution:** The Anti-Humean must say Newton's Law was *approximately* true or limited in scope. But this weakens the "governing" claim. Did the law govern Uranus but not Mercury? If so, governance is local, not universal. If it governed both, why the failure? The Anti-Humean bears a heavier burden to explain why a *governing* relation led to a ontological dead end. The failure of Vulcan looks like a failure of the law's reach, which undermines the idea that the law is what *makes* the events happen.

  ### III. Testing the Distinctions

  **1. Production vs. Reach**
  *   **Your Suspicion:** You suspect this episode is evidence about *reach* (licensing expectations about unobserved regions) and silent about *production* (making events happen).
  *   **Assessment:** Your suspicion is correct.
      *   **Humean:** The Humean explicitly denies production. They only claim reach. The Neptune/Vulcan case is a pure test of reach. The Humean account fits the data perfectly here: it explains the inference as a projection of the system.
      *   **Anti-Humean:** The Anti-Humean claims production. However, this case provides no evidence for it. Whether the planet is "made" to move by a law or simply moves in a way summarizable by a law, the *prediction* looks the same. The failure of Vulcan does not disprove production (maybe the production just didn't happen because the mass wasn't there), but it certainly doesn't prove it.
      *   **Verdict on Distinction:** The case is silent on production. Both views can account for the predictive success of Neptune. The predictive failure of Vulcan is actually easier for the view that *denies* production (Humean), because it treats the prediction as a fallible gamble on the mosaic's uniformity, rather than a deduction from a necessitating relation.

  **2. Slippage and Extendability (The Humean's Burden)**
  *   **The Issue:** You noted that for the Humean, the Vulcan residual is an "unsystematized particular." The Humean owes an account of how much slippage is tolerable before the system stops being "Best."
  *   **Extendability as a Virtue:** You ask if this case shows the trade-off involves *extendability* into new domains.
      *   **Analysis:** Standard BSA (Lewisian) evaluates the system against the *actual* mosaic (all of space-time). But Le Verrier is reasoning *before* the full mosaic is known. To justify his inference, the Humean must say the Best System is one that is *projectible* or *stable* across unknown regions.
      *   **The Risk:** If the Humean adds "extendability" or "projectibility" as a virtue of the Best System, are they smuggling in modality? If "extendability" just means "fits the future parts of the mosaic," it is circular for the agent trying to predict. If it means "has a form that usually fits new data," it looks like a second-order regularity.
      *   **Is it Anti-Humean in Disguise?** Not necessarily. It can be cashed out as *compressibility*. A system that requires constant ad-hoc adjustments (like adding epicycles or changing force laws for every planet) is less simple. A system that handles new domains with existing axioms (Newton + Mass) is more compressive.
      *   **Silence:** However, the Humean must be silent on *why* the mosaic allows for this compression. They can say "The mosaic is uniform enough to be compressed," but they cannot say "The mosaic is uniform *because* of laws."
      *   **Assessment:** The case shows the Humean needs a virtue like *robustness* or *stability* to rank Option C (New Mass) over Option B (New Law). This is not secretly anti-Humean if defined as a syntactic or information-theoretic virtue (simplicity of code), but it does require the Humean to admit that the "Best System" is not just about fitting the *past* data, but about the *risk profile* of fitting future data.

  ### IV. The Differential Vindication Constraint: Weight and Target

  You asked how much weight this constraint bears and against whom.

  *   **Weight:** Heavy. It is the strongest part of your case. It isolates the *method* from the *outcome*.
  *   **Target:** It weighs heavier against the **Anti-Humean**.
      *   **Why:** The Anti-Humean posits a tight connection between law and world (governance). When the method yields a falsehood (Vulcan), the Anti-Humean must explain how a *governing* law failed to govern the inference. They are forced into saying the law wasn't "true" yet. But if it wasn't true, why did it work for Neptune? They must accept that false (or approximate) laws can govern, which dilutes the concept of governance.
      *   **Humean Advantage:** The Humean expects fallibility. The Best System is a human-sized summary of a vast mosaic. Projections are guesses. A failed guess (Vulcan) is consistent with the view that laws are summaries. A successful guess (Neptune) is also consistent. The differential outcome (one yes, one no) is just the mosaic being lumpy. The Humean does not promise that the system *makes* the prediction come true, only that it is the best bet.

  ### V. Final Verdict

  **Is this case a confirmation, an anomaly, or a category error?**

  **Verdict:** This episode is **an anomaly for the Anti-Humean** and a **confirmation of the Humean's epistemic humility**, provided the Humean accepts "projectibility" as a component of simplicity/strength.

  1.  **For the Anti-Humean:** It is an anomaly. The view thrives on the idea that laws support counterfactuals and explain *why* things happen. But here, the "law" (Newton) supported a counterfactual ("If there were a perturbation, there would be a planet") that turned out false. If laws govern, they should not license ontological commitments that turn out to be empty. The Anti-Humean is forced to say Le Verrier was wrong about the law, but then they lose the explanation for why Neptune was found. They cannot easily account for the *symmetry* of the two inferences without weakening the modal force of the law.
  2.  **For the Humean:** It is not a pure confirmation, because it forces an expansion of the "Best System" criteria. The standard Simplicity/Strength trade-off is static (fitting the data). This case shows that scientific practice values *dynamic stability* (fitting new data without changing axioms). If the Humean incorporates "extendability" (understood as compressive power over unknown data) into the definition of "Best," the view handles the case naturally. It explains why Le Verrier was rational to try Vulcan, and why he was not "violating" anything when Vulcan wasn't there.
  3.  **Silence:** Both views are silent on the *ontological cause* of the difference between Neptune and Vulcan. Neither view explains why the mass was there in one case and not the other. That is a question for cosmology, not metaphysics of law.
  4.  **Production vs. Reach:** Your suspicion is vindicated. The case is entirely about **reach**. It demonstrates the utility of laws as tools for navigating the unobserved mosaic. It provides zero evidence for **production**. Teaching this case will show students that "governance" adds no predictive value over "summary" in the context of discovery, but adds significant liability when the discovery fails.

  **Pedagogical Recommendation:**
  Use this to press the Anti-Humean on the *epistemic access* problem. If laws govern, how do we know we have the right law before the "governance" is fully manifest? Le Verrier thought he had the law. He was half-right. The Humean can say he had a good summary. The Anti-Humean has to say he had a false law that acted like a true one. The latter is a harder pill to swallow.
