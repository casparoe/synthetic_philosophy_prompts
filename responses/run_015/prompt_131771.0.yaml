      *   *Outcome:* One worked, one didn't.

  3.  **Analyze View 1: The Humean (Best System Account - BSA):**
      *   *Core:* Laws are summaries of the mosaic. Best balance of simplicity and strength.
      *   *Le Verrier's Options:*
