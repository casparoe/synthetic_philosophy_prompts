      *   **Conclusion/Verdict:**
          *   Does it confirm one? Anomaly for the other? Or category error?
          *   *Verdict:* It's a category error for *metaphysics*, but a win for Humean *methodology*. It exposes the Anti-Humean's difficulty with false starts in science. It shows the Humean needs to formalize "projectibility" without cheating.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I force the views to speak where they should be silent?
