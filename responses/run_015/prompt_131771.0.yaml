      *   *Neptune (1846):* Anomaly in Uranus $\rightarrow$ Newtonian Mechanics + Auxiliary Hypothesis (New Planet) $\rightarrow$ Confirmed.
      *   *Vulcan (1859):* Anomaly in Mercury $\rightarrow$ Newtonian Mechanics + Auxiliary Hypothesis (New Planet) $\rightarrow$ Disconfirmed (eventually solved by GR).
