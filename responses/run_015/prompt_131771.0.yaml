          *   *Expectation:* High confidence because the system has been strong elsewhere (Neptune).
          *   *Differential Vindication:* The Humean handles the *symmetry* well. Both were rational bets on the Best System. The failure of Vulcan just means the mosaic turned out differently than projected.
          *   *Reach vs. Production:* Confirms user's suspicion. Humeans only claim reach. This case is purely about reach.
          *   *Slippage/Extendability:* The "Best System" needs to be projectible. If we add "extendability" as a virtue, is it modal? Argument: No, it's just about compression of future data. But there's a risk of smuggling.
