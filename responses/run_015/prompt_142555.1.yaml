  ### **I. Corrections & Clarifications (Read Before Running)**

  You asked for frankness on your premises. Here is the status of your three theoretical claims:

  1.  **Mixed Dominance vs. Never Best Response (2-Player):** **True.** In 2-player games, a pure strategy is strictly dominated (possibly by a mixed strategy) if and only if it is never a best response to any probabilistic belief about the opponent. Your plan to have them discover this via payoff comparison is sound.
  2.  **The 3-Player Correlation Gap:** **True, but requires precise phrasing.** In games with 3+ players, a strategy can be a best response to a *correlated* belief about the opponents' joint moves (e.g., "Players 1 and 2 will coordinate on (U,L) or (D,R)") while being *never* a best response to any *independent* belief (e.g., "Player 1 plays U with prob $p$, Player 2 plays L with prob $q$").
      *   *Implication:* Iterated Elimination of Strictly Dominated Strategies (IESDS) removes strategies that are never best responses to *correlated* beliefs. It does **not** necessarily remove strategies that are never best responses to *independent* beliefs.
      *   *Activity Adjustment:* Part 3 must explicitly contrast "Two separate coin flips" (Independent) vs. "One card drawn from a shared deck" (Correlated).
  3.  **Dominating Mixtures & Eliminated Strategies:** **False Premise.** For **Strict** Dominance, it does **not** matter if the dominating mixture puts weight on strategies eliminated in earlier rounds. If a strategy is strictly dominated by a mixture using "dead" strategies, it is also strictly dominated by a mixture using only "live" strategies.
      *   *Pedagogical Choice:* In the activity, require mixtures to use only *current* survivors. Why? Not because the math requires it, but because it mirrors the epistemic condition of "Common Belief in Rationality" (I won't play a strategy I know you won't play). I will note this distinction in the debrief.

  ---

  ### **II. Materials List**

  *   **Room:** 4 tables, 4 students per table. Whiteboard accessible to all.
  *   **Currency:** 40 chocolate coins (or 40 points recorded on a sheet).
  *   **Randomizers:**
      *   4 Decks of standard playing cards (remove all except Aces and Kings; you need 8 cards per deck: 4 Aces, 4 Kings).
      *   8 Coins (students can use phones, but physical coins are louder/clearer).
  *   **Handouts:** 4 sets of "Payoff Sheets" (printed matrices).
  *   **Roles:** At each table: 1 Dealer (instructor rotates or assigns), 1 Scribe, 2 Players (swapping roles).

  ---

  ### **III. Timeline (90 Minutes)**

  *   **00–10:** Setup & Grouping.
  *   **10–35:** **Phase 1:** The "Coin-Flip" Dominance (2-Player).
  *   **35–50:** **Phase 2:** The Weakness of Weak Dominance (Order Dependence).
  *   **50–75:** **Phase 3:** The Correlation Gap (3-Player).
  *   **75–90:** **Debrief & Formalization.**

  ---

  ### **IV. The Activity**

  #### **Phase 1: Strict Dominance by Mixture (25 mins)**
  *Goal: Discover that a pure strategy can be beaten by a randomized mix of two others, even if no single pure strategy beats it.*

  **Setup:**
  Pairs at each table. Player 1 is **Row**, Player 2 is **Col**.
  **Crucial Constraint:** Player 2 (Col) is **not** a strategic agent. Player 2 is a **Deck of Cards**.
  *   **The Deck:** 4 Aces (representing Column L), 4 Kings (representing Column R). Shuffled.
  *   **The Payoff Matrix (Row's Earnings only):**
      *   Write this on the whiteboard.
      *   Row Strategies: **A**, **B**, **C**.
      *   Col Outcomes: **L** (Ace), **R** (King).

  | Row \ Col | L (Ace) | R (King) |
  | :--- | :---: | :---: |
  | **A** | 0 | 4 |
  | **B** | 4 | 0 |
  | **C** | 1 | 1 |

  **Rules:**
  1.  Row chooses a card (A, B, or C) face down.
  2.  Dealer draws a card from the Deck (L or R).
  3.  Reveal. Row collects chocolate equal to the matrix value.
  4.  Play 10 rounds. Row tracks total earnings.
  5.  **Twist:** In rounds 6–10, Row is allowed to use a **Coin Flip** to decide between A and B *before* the Dealer draws. (Heads = A, Tails = B).

  **What Will Happen:**
  *   Rounds 1–5: Students playing **C** earn exactly 1 per round (Total 5). Students playing A or B will fluctuate (0 or 4), averaging 2, but variance might make C look "safe."
  *   Rounds 6–10: Students using the **Coin Flip (Mix A/B)** earn 2 per round *guaranteed* (0+4 or 4+0 averaged).
  *   **The Realization:** Strategy C (earning 1) is strictly worse than the Coin Flip Strategy (earning 2), even though C is not beaten by A alone (4 > 1 in Col R) or B alone (4 > 1 in Col L).

  **Instructor Move:** Do not explain *why*. Ask: "Who earned more in rounds 6–10: the person playing C, or the person flipping a coin between A and B?"

  ---

  #### **Phase 2: Weak Dominance & Order Dependence (15 mins)**
  *Goal: Discover that eliminating weakly dominated strategies depends on the order of elimination and can delete Nash Equilibria.*

  **Setup:**
  Keep pairs. Now **both** players are strategic (no deck).
  **Payoff Matrix (Row, Col):**

  | Row \ Col | L | R |
  | :--- | :---: | :---: |
  | **U** | 1, 1 | 0, 0 |
  | **D** | 1, 0 | 0, 0 |

  *Note: D is weakly dominated by U for Row (1=1, 0=0). R is weakly dominated by L for Col (1>0, 0=0).*

  **Rules:**
  1.  **Group Alpha (2 tables):** Eliminate Row's weakly dominated strategies *first*. Then eliminate Col's. What is the single remaining outcome?
  2.  **Group Beta (2 tables):** Eliminate Col's weakly dominated strategies *first*. Then eliminate Row's. What is the single remaining outcome?
  3.  Play the remaining game for 5 rounds to see if the prediction holds.

  **What Will Happen:**
  *   **Group Alpha:** Eliminates D (Row). Game becomes Row=U. Col prefers L (1>0). Outcome: **(U, L)**.
  *   **Group Beta:** Eliminates R (Col). Game becomes Col=L. Row is indifferent between U and D (both pay 1). Outcome: **(U, L) OR (D, L)**.
  *   **The Contrast:** Group Alpha finds a unique solution. Group Beta finds two. The "Algorithm" of Iterated Elimination of Weakly Dominated Strategies (IEWDS) gave different answers based on who moved first.
  *   **Key Insight:** (D, L) is a Nash Equilibrium (1,0). Neither player wants to deviate unilaterally. But Alpha's procedure *deleted* this equilibrium.

  ---

  #### **Phase 3: The Correlation Gap (25 mins)**
  *Goal: Feel the difference between Independent and Correlated beliefs in 3-player games.*

  **Setup:**
  Groups of 3.
  *   **Player 1 (Row):** Strategies **U**, **D**.
  *   **Player 2 (Col):** Strategies **L**, **R**.
  *   **Player 3 (Judge):** Strategies **In**, **Out**.

  **Payoffs:**
  *   **P1 & P2:** Get 0 always (they are "The Market," they just generate states).
  *   **P3 (Judge):**
      *   If **Out**: Earns **4** chocolate (Safe).
      *   If **In**: Earns **6** chocolate IF (U,L) or (D,R). Earns **0** IF (U,R) or (D,L).

  **Round A (Independent Conjecture):**
  *   P1 flips a coin (U/D). P2 flips a *separate* coin (L/R).
  *   P3 must choose In/Out *before* seeing the coins.
  *   **Math:** Prob(U,L) = 0.25. Prob(D,R) = 0.25. Total Win Prob = 0.5.
  *   **Expected Value of In:** $0.5 \times 6 = 3$.
  *   **Expected Value of Out:** $4$.
  *   **Rational Choice:** **Out**. (In is never a best response to independent beliefs).

  **Round B (Correlated Conjecture):**
  *   Dealer uses a Deck of 2 cards: **Card 1 = (U,L)**, **Card 2 = (D,R)**.
  *   Dealer draws *one* card. P1 and P2 *must* play what the card says.
  *   P3 must choose In/Out *before* seeing the card.
  *   **Math:** Prob(U,L) = 0.5. Prob(D,R) = 0.5. Total Win Prob = 1.0.
  *   **Expected Value of In:** $1.0 \times 6 = 6$.
  *   **Expected Value of Out:** $4$.
  *   **Rational Choice:** **In**.

  **The Realization:**
  Strategy **In** is rational if you believe P1 and P2 are correlated (e.g., they share a signal). It is irrational if you believe they randomize independently.
  *   **Formal Link:** In 3+ player games, "Strictly Dominated" means "Never a Best Response to *Correlated* Beliefs." Since **In** is a BR to Correlated Beliefs, **In is NOT Strictly Dominated.** However, it *would* be eliminated if you only considered Independent Beliefs.

  ---

  ### **V. Debrief Script (15 mins)**

  **1. The One-Sentence Formulation:**
  Write this on the board and have them copy it:
  > *"Iterated Elimination of Strictly Dominated Strategies removes moves that are irrational under **any** coherent belief about opponents, including beliefs that opponents might correlate their moves."*

  **2. Mapping Activity to Theory:**
  *   **Phase 1:** "You found that C was beaten by a coin flip. That is **Strict Dominance by a Mixed Strategy**. Formally: $\sigma_i$ strictly dominates $s_i$ if $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$."
  *   **Phase 2:** "You found that eliminating 'safe' (weakly dominated) options changed the answer. This is why we prefer Strict Dominance for solution concepts. Weak Dominance relies on 'trembling hand' assumptions that aren't always stable."
  *   **Phase 3:** "You found 'In' was good with one deck, bad with two coins. This confirms your memory: In 3-player games, **Correlated Beliefs** are wider than **Independent Beliefs**. A strategy can survive IESDS (because it beats the Correlated belief) but fail against Independent randomizations."

  **3. Addressing the "Mixture" Question:**
  *   "Does the coin flip in Phase 1 have to use strategies A and B that are themselves 'good'? Theorem says: If a mix dominates C, there exists *some* mix of *survivors* that dominates C. So, restricting to survivors doesn't change the final answer for Strict Dominance. We do it anyway to model 'Common Belief in Rationality'."

  ---

  ### **VI. Troubleshooting: What Will Go Wrong**

  **1. The "Announcer" (Student spots dominance in 30 seconds)**
  *   *Risk:* They shout "C is dominated!" and ruin the discovery for the table.
  *   *Fix:* Assign them the role of **Auditor**. Their job is not to play, but to verify the chocolate count at the end of Phase 1. Ask them: "Can you prove C is dominated without using algebra? Show me with the coins."

  **2. The "Safety First" Student (Plays C in Phase 1)**
  *   *Risk:* They argue C is better because variance is lower. "I don't want to risk getting 0."
  *   *Fix:* Acknowledge this is valid **Risk Aversion**, but distinct from **Rational Choice (EU Max)**. "In this class, we assume you want to maximize expected chocolate. If you prefer safety over expected value, you have a non-linear utility function. That's a different seminar."

  **3. The "Algebra-Averse" Group (Stops writing when variables appear)**
  *   *Risk:* Disengagement during Debrief.
  *   *Fix:* Keep the debrief arithmetic. "0.5 times 4 plus 0.5 times 0 is 2." Do not write $p \cdot u(A) + (1-p) \cdot u(B)$ until the very last slide. Let the chocolate do the math.

  **4. Confusing Dominance with Equilibrium**
  *   *Risk:* "But if Col plays L, A is best! So C isn't dominated?"
  *   *Fix:* "Dominance asks: Is there *another* move that beats C **no matter what** Col does? Equilibrium asks: Is C a best response to **what Col actually does**?"

  ---

  ### **VII. Limitations (What This Activity Cannot Do)**

  1.  **It does not prove the Theorem.** The activity shows *an example* of mixed dominance and correlation gaps. It does not prove that *all* strictly dominated strategies are never best responses. You must supply the general proof in the lecture following this seminar.
  2.  **It simplifies Correlation.** In Phase 3, P1 and P2 are forced to correlate by the deck. In real games, correlation comes from shared history or signals. You must explain that the "Deck" represents a **Correlated Belief** (a joint probability distribution), not necessarily a binding contract.
  3.  **It hides the "Mixture Restriction" Nuance.** As noted in Section I, allowing eliminated strategies in a dominating mixture doesn't change IESDS outcomes. The activity forces them to use survivors for simplicity. You must explicitly state in the debrief that this is a pedagogical choice, not a mathematical necessity for strict dominance.

  ### **VIII. Final Check on Payoffs**

  *   **Phase 1:** Mix(A,B) = 2. C = 1. (2 > 1). **OK.**
  *   **Phase 3:** Indep(In) = 3. Out = 4. (4 > 3). Corr(In) = 6. Out = 4. (6 > 4). **OK.**
  *   **Math Level:** Only halves and integers. No calculators needed.

  This plan respects your constraints, corrects the theoretical subtleties, and forces the students to physically manipulate the randomization devices that define the concepts.
