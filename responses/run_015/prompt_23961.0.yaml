prompt: |-
  I run avalanche search-and-rescue for a mountain rescue association, and I'm the one who has to call, in the field, which of two buried groups we commit the dog team and the diggers to when we can only work one site at a time. It comes up more then I'd like in a winter: two beacons triangulate to two different pockets, the snow is bad, the team is a single unit, and I've got maybe a two hour window before the buried people are gone. I need a decision procedure I can actually run on a slope in the cold with a head full of static, that tells me what to do when I can get the group of four out of the east pocket or the single hiker out of the west gully but not both, and I make the call and I sign for it.

  I don't want it to just be "save the most people." I've read enough of the debate to know that's contested, and I don't want a procedure that papers over that. So ground it in what the argument actually says: what is the real force of the claim that the number of people saved is, by itself, not a reason to save the many over the few (the Taurek line), what are the strongest replies to it, and where does the procedure have to stop and hand the call back to me as a person because it's a values question and not a facts question? Give me the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a "no, don't commit to that site," and the points where it just has to flag "this one's on you." Be straight about which steps are really judgment calls wearing a procedure costume. Then run it on two real-ish calls from last season: one where the four are a ski patrol team with a radio and the single is a solo backpacker who's already been out longer, and one where the single is a kid. And tell me the cases where the procedure hands me an answer I'm going to hate, and what it simply can't do for me.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Avalanche search-and-rescue (SAR) leader.
      *   **Task:** Needs a decision procedure for choosing between two burial sites (Group of 4 vs. Single Hiker) when resources allow only one.
      *   **Constraints:** High stress, cold, time-critical (2-hour window), moral weight (life/death), signing off on the decision.
      *   **Philosophical Requirement:** Do *not* just say "save the most." Acknowledge the Taurek argument (numbers don't count morally in themselves) vs. Aggregative Utilitarianism. Ground the procedure in the actual philosophical debate.
      *   **Output:** A step-by-step procedure, identifying where it's factual vs. value-based, where it stops ("no"), where it hands back to the human ("this one's on you").
      *   **Application:** Run the procedure on two specific scenarios (Patrol Team vs. Solo Backpacker; Group vs. Kid).
      *   **Honesty:** Admit where the procedure fails or gives an answer the user will hate.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *The Aggregative View (Utilitarian):* Save the many. 4 lives > 1 life. Simple math.
      *   *The Non-Aggregative View (Taurek/Scanlon):* Numbers alone don't justify ignoring the one. Each individual has a claim to be saved. To ignore the one for the sake of the many is to treat the one as a mere means or to fail to show equal concern.
      *   *The Middle Ground (Prioritarianism/Weighted Claims):* Numbers matter, but other factors (probability of survival, vulnerability, duty of care) might outweigh the raw count.
      *   *The SAR Context:* This isn't pure ethics; it's operational ethics. There are factors like *probability of survival* (time buried, trauma), *logistics* (depth, snow stability), and *duty* (did the patrol team accept risk to save others?).

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Goal:* Create a flow that filters out objective factors first, leaving the moral dilemma for last.
      *   *Step 1: Triage (Medical/Physical).* Can they actually be saved? If one group is certainly dead, the choice is made. This is factual.
      *   *Step 2: Operational Feasibility.* Can we actually dig them out in time? If one site is suicide for rescuers, it's off the table. Factual/Safety.
      *   *Step 3: The "Taurek Filter" (Equal Concern).* Acknowledge that if survival chances are equal, the single person has a veto against being sacrificed *just* because they are one. This forces the user to look for *relevant differences* beyond numbers.
      *   *Step 4: Relevant Differences (The Weighting).* Vulnerability (age/health), Responsibility (patrol vs. civilian), Time buried.
      *   *Step 5: The Hard Stop.* If all relevant differences are neutralized, the procedure must admit it cannot solve the "Numbers vs. Individual" conflict. It must hand it back to the commander.

  4.  **Refining the Steps (incorporating the "No" and "On You" markers):**
      *   Need to be explicit about when the procedure says "Don't do this" (e.g., if survival probability is 0).
      *   Need to be explicit about when the procedure says "I can't decide" (e.g., 4 healthy adults vs. 1 healthy adult, equal time).

  5.  **Developing the Scenarios:**
      *   *Scenario A:* 4 Ski Patrol (radio, trained) vs. 1 Solo Backpacker (out longer).
          *   *Factors:* Patrol might have better air pockets/gear? Or they might be deeper? "Out longer" hurts the solo. Patrol has a duty?
          *   *Tension:* Saving the rescuers vs. saving the public.
      *   *Scenario B:* 4 Adults vs. 1 Kid.
          *   *Factors:* Vulnerability. Most people feel a pull toward the kid. Does the procedure capture this?
          *   *Tension:* Numbers vs. Future Life/Vulnerability.

  6.  **Addressing the "Hate" and "Can't Do":**
      *   The procedure might tell the user to save the 4 adults over the kid if the kid's survival probability is significantly lower (medical triage logic). The user will hate that.
      *   The procedure can't remove the guilt. It can't guarantee the "right" metaphysical answer.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the weight. Validate the Taurek concern (numbers aren't everything).
      *   *The Procedure:* Break it down into "Hard Constraints" (Physics/Medicine) and "Soft Constraints" (Ethics/Values).
      *   *Philosophical Grounding:* Explain *why* a step exists (e.g., Step 3 is the Taurek check).
      *   *Scenario Run-throughs:* Apply the steps rigorously.
      *   *The "Hate" Section:* Be brutal about the limitations.

      *(Self-Correction during drafting)*: I need to make sure I don't just sneak utilitarianism back in. Taurek's point is that I owe a duty to *each* person. If I save the 4, I have wronged the 1. The procedure needs to acknowledge that wrong, not hide it. The "decision" isn't about who *deserves* to live, but who we *commit* to saving given the constraints.

      *Revised Step 3:* Instead of "Who is more valuable?", ask "Is there a reason to prioritize *other than* headcount?" If no, the procedure must stall.

      *Revised Step 4:* Incorporate "Duty of Care." SAR has a specific mandate. Sometimes that mandates saving the public over the patrol, sometimes vice versa (to preserve future rescue capacity).

      *Final Polish:* Ensure the tone is respectful, professional, and direct. No fluff.

  8.  **Final Review against constraints:**
      *   Did I avoid "save the most"? Yes, by making it a tie-breaker, not a rule.
      *   Did I explain Taurek? Yes.
      *   Did I identify "Judgment calls wearing procedure costumes"? Yes.
      *   Did I run the two scenarios? Yes.
      *   Did I admit where it fails? Yes.

  9.  **Constructing the Output:** (This aligns with the structure of the provided good response.)
      *   Preamble: Acknowledge the burden.
      *   Philosophical Grounding: Taurek vs. Aggregation.
      *   The Protocol (The "Slope-Side Triage").
      *   Scenario 1 (Patrol vs. Solo).
      *   Scenario 2 (Adults vs. Kid).
      *   The "Hate" and "Can't Do" section.

      *(Self-Correction on Scenario 1)*: The prompt says Patrol has a radio. Does that mean they can communicate? Does it mean they are better equipped? Usually, patrol implies they accepted risk. Solo implies less prep. "Out longer" implies lower survival chance for solo.
      *(Self-Correction on Scenario 2)*: Kid implies vulnerability. But if the 4 are children and the 1 is an adult? The prompt says "the single is a kid." So 4 Adults vs 1 Kid. This is the classic "Numbers vs. Future" conflict.

      *Wait, one nuance:* The prompt asks for "where the procedure stops with a 'no, don't commit to that site'". This implies medical/physical impossibility. I need to make sure that's clear.

      *Wait, another nuance:* "What counts as a good enough answer." I need to define the threshold for moving to the next step.

      *Okay, let's write it.*
answer: |-
  This is a heavy burden. You are asking for a tool that acknowledges the moral residue of the decision rather than washing it away with arithmetic. You want a procedure that respects the *individual claim* of the single hiker (the Taurek position) while acknowledging the operational reality that you must act.

  John Taurek's argument ("Should the Numbers Count?") is that there is no "super-losing" when five die instead of one. There are only five individual tragedies versus one. To sacrifice the one *solely* because they are outnumbered is to fail to show equal concern for their fate. However, in SAR, you are not a bystander; you are an agent with limited resources. You cannot save everyone. The question is not "Who deserves to live?" but "Where do we deploy the shovel?"

  Here is a decision procedure grounded in that tension. It separates **factual constraints** (physics/physiology) from **moral weighting** (values), and explicitly identifies where the math ends and the guilt begins.

  ### The Slope-Side Triage Protocol

  **Pre-Condition:** You have confirmed two distinct burial sites. You have one team. You cannot split them effectively. Time to death is estimated at <2 hours for both.

  #### Step 1: The Viability Filter (Hard Constraint)
  **Question:** Is there objective evidence that one group is already deceased or unsalvageable within the window?
  *   **Data:** Burial time, air pocket status (from probes/transceivers), trauma indicators, avalanche debris density.
  *   **Good Enough Answer:** "Site A has >90% probability of fatality due to asphyxia time; Site B has <90%."
  *   **Procedure Output:**
      *   If Site A is unsalvageable: **Commit to Site B.** (This is not a moral choice; it is a medical fact.)
      *   If Both are viable: **Proceed to Step 2.**
      *   If Neither is viable: **Stand Down.** (The hardest call. You do not risk rescuers for bodies.)

  #### Step 2: The Rescuer Safety Filter (Hard Constraint)
  **Question:** Does committing to one site pose a catastrophic risk to the rescue team that the other does not?
  *   **Data:** Secondary slide risk, terrain traps, exposure.
  *   **Good Enough Answer:** "Digging Site A requires working under an active cornice; Site B is stable."
  *   **Procedure Output:**
      *   If Site A kills rescuers: **Do Not Commit to Site A.** (You cannot trade certain lives for probable lives.)
      *   If Risks are Equal: **Proceed to Step 3.**

  #### Step 3: The Taurek Check (The Moral Floor)
  **Question:** Is the *only* distinguishing factor between the sites the number of people?
  *   **Logic:** If survival probability, risk, and vulnerability are identical, Taurek argues you owe equal concern to the single hiker as you do to the group. You cannot use the group's size to negate the individual's claim.
  *   **Good Enough Answer:** "Yes, physically and medically, they are identical. It is 4 vs 1."
  *   **Procedure Output:**
      *   **STOP.** The procedure cannot resolve this. This is the "Values Gap."
      *   **Action:** You must acknowledge that choosing the 4 is *not* because the 1 doesn't matter, but because you are making a utilitarian compromise under duress.
      *   **Flag:** **"THIS ONE'S ON YOU."** You must sign for this based on your mandate (see Step 4).

  #### Step 4: The Mandate & Vulnerability Weighting (Soft Constraint)
  **Question:** Are there relevant moral differences *other than numbers* that align with your organization's duty?
  *   **Factors:**
      *   *Vulnerability:* Age, health, preparedness. (A child or unprepared novice has a weaker capacity to survive the wait than a trained patroller).
      *   *Assumption of Risk:* Did one group accept higher risk as part of a role (Patrol) vs. unintended victim (Public)?
      *   *Future Capacity:* Does saving one group preserve the ability to save others later? (e.g., Saving the Patrol team preserves future SAR capacity).
  *   **Good Enough Answer:** "Site A contains a child (high vulnerability). Site B contains adults." OR "Site A contains SAR personnel (critical infrastructure for future saves)."
  *   **Procedure Output:**
      *   If Vulnerability/Risk factors heavily favor one side: **Commit to the Higher Vulnerability / Lower Assumption of Risk.** (This overrides the raw headcount).
      *   If Factors are Mixed: **Proceed to Step 5.**

  #### Step 5: The Aggregation Tie-Breaker (The Last Resort)
  **Question:** Have all other differentiating factors been exhausted?
  *   **Logic:** Only here do you allow the numbers to count. Not because 4 lives are intrinsically worth more than 1, but because in a tie-break of equal claims, minimizing total loss is the only remaining heuristic.
  *   **Procedure Output:**
      *   **Commit to the Many.**
      *   **Caveat:** You must verbally acknowledge to your team: "We are saving the four not because the one is worth less, but because we cannot save both."

  ---

  ### Running the Protocol: Two Scenarios

  #### Scenario 1: The Patrol Team (4) vs. The Solo Backpacker (1)
  *   **Context:** 4 Ski Patrol buried in a control zone. They have radios, gear, training. 1 Solo Backpacker in backcountry, out longer, no gear.
  *   **Step 1 (Viability):** Solo is out longer. Probabilistically, their air pocket is more compromised. Patrol has gear/airbags.
      *   *Assessment:* Patrol has higher survival probability.
  *   **Step 2 (Safety):** Equal.
  *   **Step 3 (Taurek):** Not identical. Survival probability differs.
  *   **Step 4 (Mandate):**
      *   *Vulnerability:* Solo is more vulnerable (less gear, longer time).
      *   *Risk Assumption:* Patrol accepted risk to manage the slope. Solo was a victim of the hazard.
      *   *Future Capacity:* Losing 4 Patrol members degrades future SAR capability significantly.
  *   **Conflict:** Medical triage says save the Patrol (higher survival chance). Moral duty says save the Public (Solo didn't accept the risk). Operational duty says save the Patrol (preserve the team).
  *   **Procedure Verdict:** **Commit to the Patrol.**
      *   *Reasoning:* Step 1 (Viability) and Step 4 (Future Capacity) outweigh the Solo's vulnerability. If the Patrol dies, the region's ability to save *future* solos drops.
      *   *The "Hate" Factor:* You are leaving the civilian to die to save the employees. This feels like institutional self-preservation.
      *   *Where it lands:* Step 4. It is a judgment call on organizational mandate vs. individual duty.

  #### Scenario 2: The Four Adults vs. The Single Kid
  *   **Context:** 4 Adult skiers in a bowl. 1 Child (12yo) in a gully nearby. Burial times similar.
  *   **Step 1 (Viability):** Equal.
  *   **Step 2 (Safety):** Equal.
  *   **Step 3 (Taurek):** Not identical. Vulnerability differs.
  *   **Step 4 (Mandate):**
      *   *Vulnerability:* Child has lower physiological reserve, higher panic risk, greater "future life" potential.
      *   *Risk Assumption:* Adults assumed more responsibility for their safety than a minor.
  *   **Procedure Verdict:** **Commit to the Kid.**
      *   *Reasoning:* Step 4 (Vulnerability) overrides Step 5 (Numbers). The claim of the vulnerable trumps the claim of the aggregate when the aggregate is adults.
      *   *The "Hate" Factor:* You are letting 4 people die to save 1. If the 4 are parents, you have created orphans. The math of "life years saved" is speculative and cold.
      *   *Where it lands:* Step 4. This is a values judgment that society generally accepts (save the child), but it is not a mathematical truth.

  ---

  ### Where The Procedure Will Make You Hate It

  **1. The "Viability" Trap (Scenario 1)**
  The procedure might tell you to save the Patrol because they have a *higher chance of survival*, leaving the Solo to die even though the Solo is the "innocent victim."
  *   **Why you'll hate it:** It feels like you are punishing the victim for being unprepared and rewarding the professionals for having gear. It prioritizes "success rate" over "duty to public."
  *   **What the procedure can't do:** It cannot reconcile the conflict between *Medical Triage* (save who can be saved) and *Social Contract* (protect the public). It forces you to pick which master you serve in that moment.

  **2. The "Future Capacity" Calculation**
  In Scenario 1, the procedure leans on saving the Patrol to preserve future SAR capacity.
  *   **Why you'll hate it:** It treats your teammates as assets rather than people. It instrumentalizes their lives for the "greater good" of the association.
  *   **What the procedure can't do:** It cannot tell you if your team is worth more than a civilian. That is a political/organizational value, not a moral fact.

  **3. The Taurek Stall (Step 3)**
  If you have 4 Adults vs. 1 Adult, equal time, equal gear, equal risk.
  *   **Why you'll hate it:** The procedure stops and says "THIS ONE'S ON YOU." It gives you no cover. It forces you to admit that if you save the 4, you are actively choosing to let the 1 die *because of the numbers*, which Taurek says is morally suspect.
  *   **What the procedure can't do:** It cannot remove the moral residue. It cannot give you a "clean conscience." It explicitly tells you that your conscience will be dirty, and that is the honest answer.

  ### Where The Procedure Hands It Back To You

  **The "Values Gap" (End of Step 3)**
  If the physical and medical factors are truly equal, the procedure flags **"THIS ONE'S ON YOU."**
  *   **Why:** Because there is no philosophical consensus on whether 4 lives > 1 life. Aggregators say yes; Non-Aggregators say no.
  *   **Your Burden:** You must decide if your role is that of a **Utilitarian Manager** (minimize total body count) or a **Fiduciary of the Individual** (protect the one who called for help).
  *   **The Costume:** Most SAR protocols wear a "Utilitarian Costume" (save the most). This procedure strips that off at Step 3 and asks you to sign your name to the philosophy you are enacting.

  ### Summary of Limitations

  1.  **It cannot predict survival accurately.** In the cold, with static, your "Viability Filter" is a guess. If you guess wrong on Step 1, the procedure legitimizes a murder.
  2.  **It cannot absorb the grief.** It identifies who you save, but it does not process the guilt of the one you didn't.
  3.  **It relies on your honesty.** Step 4 (Vulnerability/Mandate) is easily manipulated. You can always find a reason to justify saving the group (e.g., "The group looks easier to dig") if that's where your bias lies.

  **Final Instruction:**
  When you make the call, state it clearly to your team. "We are going to Site A. We are doing this because [Viability/Vulnerability/Mandate]. We know Site B contains people we are leaving behind. We accept that cost."

  Do not say "We had no choice." You did. The procedure just helped you see the shape of the choice.
