answer: |-
  Here is the consistency check, ranked by severity, followed by the single most effective revision.

  ### Ranking the Tensions

  **1. The Fatal Contradiction: (2) vs. (4)**
  *   **Severity:** Critical.
  *   **Why:** This is a logical contradiction, not just a tension. Thesis (4) defines corruption universally as *Public Office + Private Benefit + Specific Act + Public Harm*. Clientelism ( Thesis 2) is *by definition* the exchange of private benefits (jobs/money) for specific official acts (votes/policy).
  *   **The Problem:** You cannot claim (4) is a "universal core" and then claim in (2) that a specific instance of that core (clientelism) is *not* corruption because it is "functional." You are switching criteria mid-stream: (4) uses a **structural** definition (quid-pro-quo), while (2) uses a **functionalist** defense (state capacity). If (4) is true, clientelism is corruption, full stop. If (2) is true, (4) is false because the "universal core" fails to capture the normative reality of weak states.

  **2. The Source of Duty: (1) vs. (2)**
  *   **Severity:** High.
  *   **Why:** Thesis (1) defines corruption as a breach of *fiduciary duty*. Thesis (2) implies that in weak states, the fiduciary duty of an official might *include* patronage (serving the clan/network to ensure stability).
  *   **The Problem:** If the "role-specific duty" in a weak state includes patronage, then patronage is not a breach, and therefore not corruption under (1). But (4) assumes the duty is always to an abstract "public interest." You haven't specified *who* the fiduciary is. Is it the State? The Party? The Clan? (2) and (4) disagree on the beneficiary of the duty.

  **3. The Meta-Ethical Wobble: (5) vs. (6)**
  *   **Severity:** Low/Medium.
  *   **Why:** You correctly identified this as an "apparent conflict." Evolutionary debunking (5) attacks the *genealogy* of our intuitions, not necessarily their *validity*.
  *   **The Resolution:** Reflective equilibrium (6) works if you clarify that you are balancing intuitions against **institutional facts**, not just other intuitions. If institutional roles are real (as you state in 6), then the "noise" of evolutionary intuition can be filtered through the "signal" of institutional function. This is a standard constructivist move and holds up under scrutiny.

  **4. The Boundary Problem: (3) vs. (4)**
  *   **Severity:** Low.
  *   **Why:** You worry "diffuse" vs. "targeted" is arbitrary. It isn't, provided you lean hard into (1). A diffuse gift creates a general obligation; a targeted bribe creates a specific duty to breach.
  *   **The Resolution:** As long as "fiduciary duty" (1) requires a specific conflict of interest, (3) is safe. The tension here is merely empirical (drawing the line), not logical.

  ---

  ### The Single Revision

  **Revise Thesis (4).**

  Currently, (4) is doing too much work. It tries to establish a substantive universal rule ("benefit + act + harm") that contradicts your contextualist arguments in (2) and (3). It forces you into a trap where you must either admit clientelism is corruption (abandoning 2) or admit your universal core has exceptions (abandoning 4).

  **The Revision:**
  Change (4) from a **substantive** claim to a **formal** one.
  *   *Old (4):* "If you hold a specific public office, take a private benefit, and in exchange perform a specific official act that harms the public interest, that's corruption regardless of local norms."
  *   *New (4):* "The universal core of corruption is not a specific transaction type, but the **violation of the legitimate fiduciary expectations attached to a specific office**; whether a benefit-for-act exchange constitutes such a violation depends on whether the 'public interest' of that office is institutionally defined as universal or particularistic."

  **Why this cleans up the most:**
  1.  **Saves (2):** It allows you to argue that in weak states, the "legitimate fiduciary expectation" of an official *is* to provide patronage to their network. Therefore, clientelism is not a breach of duty, and thus not corruption *by your definition*, without needing to make a functionalist excuse.
  2.  **Saves (1):** It keeps "fiduciary duty" as the anchor. It just acknowledges that the *content* of that duty varies by institutional context.
  3.  **Saves (6):** It makes Reflective Equilibrium the method for determining what the "legitimate expectations" are in a given context, bridging the gap between intuition and institutional fact.
  4.  **Preserves your Anti-Universalist Stance:** You are no longer imposing a Western Weberian definition (benefit + act = corruption) as universal. You are imposing a *structural* definition (breach of office-specific trust) as universal, while allowing the *content* of that trust to be local.

  ### The Cost of This Revision

  1.  **Loss of Punch:** You lose the moral clarity of "bribery is always wrong." Your definition becomes sociological. You have to analyze the local institutional norms to determine if an act is corrupt. This makes empirical measurement harder.
  2.  **Risk of Circularity:** You risk defining corruption as "what locals think is corruption." You must specify that "legitimate expectations" are not just *any* local norm, but those that survive reflective equilibrium (e.g., a local norm of pure kleptocracy might still fail the test if it destroys the office's function entirely).
  3.  **Concession on "Harm":** You can no longer claim that clientelism *never* harms the public interest. You must argue that in specific contexts, the "public interest" is *constituted* by the stability that clientelism provides. This is a harder political science argument to make than a simple moral one.

  **Summary:** Your current draft tries to have a universal moral stick (4) while arguing against universal morals (2 & 3). Drop the universal stick. Keep the universal *structure* (fiduciary breach), but let the local context fill in the content. This aligns (1), (2), (3), and (6) into a coherent institutionalist framework.
