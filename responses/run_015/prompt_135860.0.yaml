prompt: |-
  ok so i'm trying to get my thoughts straight on corruption for a seminar paper and i want a consistency check before i present. here's roughly where i've landed:

  (1) corruption is fundamentally a breach of a role-specific fiducairy duty, not just rule-breaking or law-breaking.
  (2) a lot of what's called "clientelism" in development literature—like vote-buying through patronage in weak-state contexts—isn't actually corruption, it's a functional substitute for missing bureaucratic capacity, and labeling it corrupt applies Western state-formation norms.
  (3) gift-giving in East Asian business contexts can create real obligations, but those obligations are difuse and reciprocal rather than targeted betrayals of a specific public trust, so they shouldn't count as corrupt.
  (4) still, i think there's a universal core: if you hold a specific public office, take a private benefit, and in exchange perform a specific official act that harms the public interest, that's corruption regardless of local norms.
  (5) evolutionary psychology suggests our intuitons are basically misapplied small-group reciprocity detectors, which is why we over-label diffuse social obligations as corruption.
  (6) despite (5), reflective equilibirum is still the right method for drawing the line, because institutional roles are real even if our intuitive detectors are noisy.

  do these hang together? in particular, (2) and (4) seem to pull in different directions—if clientelism involves specific exchanges of benefits for official acts, why isn't that the universal core? and (3) vs (4) feels like i'm just drawing the line arbitrarily between "difuse" and "targeted." meanwhile (5) and (6) might look tense—if our intuitions are evolutionarily debunked for this domain, why trust reflective equilibrium?—but maybe that's only an apparent conflict.

  which pairs are genuinely in tension and which dissolve on inspection? rank them by severity, and tell me which single revision cleans up the most without making me abandon the idea that Western anti-corruption standards aren't universal. be specific about what each revision costs, and don't just list everything as equally bad.
