      *   **The Conflict:** User discovered their town's "ancient" Founders' Day tradition was invented in 1953 for economic reasons (highway exit). Uncle argues this doesn't matter using a "River Analogy" (tradition is continuous flow, source doesn't matter). Sister argues it's a "Brand Analogy" (constructed heritage).
      *   **The Goal:** The user wants a breakdown of the Uncle's River Analogy (correspondence table), an analysis of where it breaks, an evaluation of the user's own objections, an identification of the *crucial* feature of the river analogy carrying the argumentative weight, and an exploration of alternative frameworks (invented tradition/imagined communities).
      *   **Specific Constraints:** Be confident but flag uncertainty. Don't dismiss the question. Address the specific evidence points (newcomers running it, changes over time).

  2.  **Deconstruct the Uncle's River Analogy:**
      *   *Core Claim:* Continuity of practice = Continuity of identity, regardless of origin.
      *   *Components:*
          *   Water = Participants/Meaning/Money/Effort.
          *   Source/Spring = Historical Origin (1790 vs. 1953).
          *   Channel/Bed = The Form/Structure of the event (Parade, Cider, Reading).
          *   Flow/Current = The ongoing performance/time passing.
          *   Standing in it = Participation/Obligation.
      *   *Function:* To naturalize the tradition. To make it seem inevitable and organic rather than constructed and contingent. To shift authority from "founders" to "participants."

  3.  **Evaluate the User's Objections:**
      *   *River doesn't need belief; tradition does.* (Strong point: Intentionality).
      *   *River can't be wrong about source; tradition can.* (Strong point: Truth claims).
      *   *Two rivers don't compete; two traditions do.* (Strong point: Scarcity/Politics).
      *   *River isn't *about* anything; tradition is.* (Strong point: Semantics/Representation).
      *   *Verdict:* These are the *right* objections. They target the "naturalization" move the uncle is making.

  4.  **Identify the Weight-Bearing Feature:**
      *   Is it automatic flow or given channel?
      *   *Analysis:* The uncle needs the *channel* to feel given (not chosen) to enforce obligation ("you don't get to redesign it"). If the channel was dug by the Rotary Club, it's a canal, not a river. A canal implies engineers, purpose, and the possibility of rerouting.
