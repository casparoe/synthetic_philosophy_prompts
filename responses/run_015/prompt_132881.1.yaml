      *   *Refining the "Canal" point:* This is crucial. If the Rotary Club dug the bed, it's infrastructure, not geography. This kills the "you can't change it" argument. You can dredge a canal.
      *   *Refining the "Obligation":* Does the obligation survive without the river? Yes, if based on *current utility* rather than *historical debt*.
      *   *Refining the Evidence:* The fact that newcomers run it actually helps the Uncle's *conclusion* (it's a living community tool) but hurts his *premise* (it's ancestral heritage). It suggests the tradition is a *tool for integration*, not a *monument to ancestry*.

  8.  **Final Review against Constraints:**
