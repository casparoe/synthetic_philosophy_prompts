answer: |-
  # Game Design: "The Signal"

  **Target:** 12 participants, 60+, philosophy reading group.
  **Time:** 60 minutes play + 30 minutes debrief.
  **Materials:** Large-print instruction sheets, 12 sets of 3 colored cards (Red, Blue, Green) in envelopes, whiteboard & markers, bell, bowl of sweets (e.g., mints or chocolates), a hat for drawing names.
  **Forbidden Words (during play):** Convention, coordination, equilibrium, salience, common knowledge, norm, rule.

  ## Part 1: The Setup (5 Minutes)

  **Seating:** Arrange 12 chairs in a circle. Place a small table in the center with the bowl of sweets and the bell. Have a whiteboard visible to all.

  **The Script (Read Aloud):**
  "Welcome. We are going to play a simple game of matching. There is no money involved. Points are recorded on the board. At the end, the person with the highest score chooses next month's reading, and everyone gets a sweet for every 5 points they score.

  Here are the rules:
  1. In front of you is an envelope. Inside are three cards: Red, Blue, and Green.
  2. In each round, you will choose **one** card and place it face down on the table.
  3. When I ring the bell, everyone reveals their card at the same time.
  4. **Scoring:** Look at the cards on the table. Find the color that appears most often. This is the **Majority Color**.
  5. If you played the Majority Color, you get **1 Point**.
  6. If you played a color that is *not* the Majority, you get **0 Points**.
  7. **Silence:** From the moment you open your envelope until the end of the game, you may not speak, gesture, or show your card before the bell. If you break silence, your score for that round is void.
  8. **Turnover:** In some rounds, I will ask four of you to step out to the back of the room. Four people from the back will take your seats. If you are new to the table, you may look at the whiteboard history, but you do not know what happened before you sat down.

  Any questions on the mechanics? (Answer only mechanical questions). Begin."

  ## Part 2: The Rounds (50 Minutes)

  ### Phase 1: The Arbitrary Convergence (Rounds 1–3)
  *Goal: Establish a focal point without instruction.*

  *   **Round 1:** Everyone plays. (Likely outcome: Scattered choices. Maybe Red wins by luck).
  *   **Round 2:** Everyone plays. (Likely outcome: People see Red won last time. More Reds appear).
  *   **Round 3:** Everyone plays. (Likely outcome: Convergence on Red. Everyone gets 1 point).
  *   **Board:** Record the winning color and total points per round.
  *   **Facilitator Note:** Do not comment on *why* they are matching. Just record scores.

  ### Phase 2: Overlapping Generations (Rounds 4–6)
  *Goal: Show the pattern survives the people.*

  *   **Instruction:** "Players 1, 2, 3, 4: Please stand and move to the back. Players 9, 10, 11, 12 (who were waiting): Please take their seats. You are new to this table. You may look at the board history."
  *   **Round 4:** Mixed group. (Veterans will likely play Red. Newcomers see Red on the board and play Red).
  *   **Round 5:** Swap 4 different players.
  *   **Round 6:** Swap 4 different players. (By now, the original 12 may have all rotated, yet Red should still dominate).
  *   **Disruption Event:** In Round 6, hand one "Newcomer" a secret note before they sit: *"Play Green. Ignore the board."*
  *   **Outcome:** The group likely stays Red. The Green player gets 0. The group feels the "drag" of the newcomer's error without knowing it was intentional.

  ### Phase 3: The Trap (Rounds 7–9)
  *Goal: Demonstrate the cost of moving without Common Knowledge.*

  *   **Setup:** The group is locked on Red.
  *   **Instruction:** "We are changing the scoring for the next rounds. I will distribute this information now."
  *   **Round 7 (Private Information):** Walk to each player individually. Whisper: *"The rule has changed. Blue is now worth 5 Points if it wins. Red is still 1 Point. Do not tell anyone else what I told you. You do not know if I told anyone else."*
      *   *Reality:* You tell everyone this.
      *   *Expected Play:* Everyone knows Blue is better. But Alice doesn't know if Bob knows. If Alice plays Blue and Bob plays Red, Alice gets 0. Fear of being the outlier keeps them on Red.
      *   *Outcome:* Almost everyone plays Red. They leave points on the table.
  *   **Round 8 (Repeat Private):** Same instruction. Reinforce the silence.
      *   *Outcome:* Frustration. They are stuck on the lower peak.
  *   **Round 9 (Public Information):** Stop the whispering. Ring the bell. Announce to the room: *"Everyone hears this: Blue is now worth 5 Points if it wins. Red is still 1 Point. Everyone knows this. Everyone knows that everyone knows this."*
      *   *Expected Play:* Immediate switch to Blue.
      *   *Outcome:* High scores. Relief.

  ### Phase 4: Conflict of Interest (Round 10 - Optional/Time Permitting)
  *Goal: Show matching matters more than preference.*

  *   **Instruction:** Hand out sealed tokens to half the room (Red Preference) and half (Blue Preference).
  *   **Rule:** "If your preferred color wins the majority, you get an extra 1 Point. But remember: you only get base points if you match the Majority."
  *   **Play:** They must coordinate on *one* color to get *any* points, sacrificing their preference bonus if they can't agree.
  *   **Outcome:** They will likely stick to the established convention (Blue) rather than fight for their preference, proving the convention overrides individual preference.

  ## Part 3: The Debrief (30 Minutes)

  *Now you may use the forbidden words.*

  **1. Mapping the Experience (10 mins)**
  Ask the group:
  *   "In Round 1, why did you pick what you picked?" (Answers: Random, liked the color).
  *   "In Round 3, why did you pick Red?" (Answers: Saw others do it, seemed safe).
  *   "In Round 7 (Private), who wanted to play Blue? Who actually played Blue? Why?"
      *   *Key Insight:* You knew the better option, but you lacked assurance others would join. You were trapped by your expectation of *their* expectations.
  *   "In Round 9 (Public), what changed? The payoffs didn't change. The information didn't change (everyone had the note). What changed?"
      *   *Key Insight:* **Common Knowledge.** It became safe to switch because you knew *they* knew *you* knew.

  **2. The "Authority" of the Pattern (10 mins)**
  *   Ask the "Newcomers" from Phase 2: "Did you feel free to choose Green? Or did the board tell you what to do?"
  *   Ask the "Disruptor" (the one told to play Green): "How did it feel to be the only one out of step?"
  *   *Connect to Lewis:* The authority isn't a law. It's the cost of being wrong. The pattern binds you because deviating is expensive, not because it's 'right'.
  *   *Connect to Ecology:* (Your moment) "This is the fitness landscape. We were on a local peak (Red). There was a higher peak (Blue). But there was a valley in between (0 points). You cannot cross the valley alone."

  **3. Closing the Loop (10 mins)**
  *   Define **Convention:** A solution to a coordination problem that is arbitrary (Red vs Blue), binding (costly to break), and self-perpetuating.
  *   Define **Common Knowledge:** The difference between "I know" and "I know that you know that I know." This is the glue that allows the switch.
  *   Final thought: "We didn't agree to follow Red. We followed Red because we expected you to follow Red. That expectation is the convention."

  ## Part 4: Troubleshooting (What Will Go Wrong)

  | Problem | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **The "Rational" Explanation** | Someone will say, "We chose Red because it's the first color alphabetically" or "It's the top card." | **Pre-empt:** Shuffle the cards in the envelopes so Red isn't always on top. Use symbols (Circle, Square, Triangle) instead of colors if they argue about color hierarchy. |
  | **The Talker** | Someone will try to solve the "Private Info" round by whispering to their neighbor. | **Enforce:** The Bell is the law. If a whisper is heard, stop the round. Restart it. Deduct 1 point from the *whole group*. This makes silence a public good. |
  | **Vision/Hearing** | Small print on cards; can't hear the bell. | **Materials:** Use A6 cards with 24pt font. Use a visual cue (raise hand) *with* the bell ring. Ensure the whiteboard is high-contrast. |
  | **Scorekeeping** | Counting 12 cards every round takes too long. | **Delegate:** Appoint one "Scribe" (non-playing or rotating) to tally on the board immediately. |
  | **The "Valley" is too deep** | If 11 play Red and 1 plays Blue, the Blue player gets 0. They might feel humiliated. | **Framing:** Emphasize points are for "choosing the book." Keep the stakes low (sweets). If someone gets 0, joke: "You paid the coordination tax." |
  | **Phase 3 Failure** | In the Private Info round, they might accidentally switch to Blue anyway. | **Contingency:** If they switch too easily, the "valley" wasn't deep enough. In the debrief, note: "You were braver than Lewis expected." |

  ## Part 5: Limitations (What You Must Say Yourself)

  *This game is a model. Like any model, it leaves things out. In your closing remarks, acknowledge these three gaps:*

  1.  **Time Scale:** "We did this in an hour. Real conventions (driving on the left, shaking hands) take generations to form and centuries to break. The 'cost' of switching in real life is social ostracization, not just losing a mint."
  2.  **The Facilitator:** "I acted as the environment. In the real world, there is no one handing out secret notes. The 'payoff change' usually comes from technology or external shocks that we all have to interpret together."
  3.  **Norms vs. Conventions:** "Lewis distinguishes conventions from norms. A norm is 'Don't murder' (backed by punishment). A convention is 'Drive on the left' (backed by mutual expectation). This game showed convention. If I had fined you for playing Green, that would have been a norm. You followed Red not because I punished Green, but because Green was useless without company."

  ## Facilitator's Cheat Sheet (Keep this in your pocket)

  *   **Round 1-3:** Say nothing. Just score.
  *   **Round 4-6:** Enforce the "Newcomer" rule strictly. Newcomers cannot ask veterans questions.
  *   **Round 7 (Private):** Whisper *exactly* the same words to everyone. Maintain eye contact. Make it feel secretive.
  *   **Round 9 (Public):** Speak loudly. Make eye contact with the whole room. "Everyone knows this."
  *   **Debrief:** Let *them* find the words first. Only supply "Common Knowledge" and "Convention" at the very end.

  **Why this works for your group:**
  It respects their intelligence by not explaining the theory upfront. It uses their physical limitations (large print, no tech) as features of the setup. It leverages their life experience (they *know* how hard it is to change a group mind) to prove the philosophical point. And it gives you the "fitness landscape" payoff without forcing the biology metaphor on the philosophers.
