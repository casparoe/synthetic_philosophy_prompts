prompt: |-
  so a city council I'm advising is toying with the idea of running one real decision through a decision market instead of a normal vote, and they've asked me for a one-pager on what such a mechanism would have to get right before I'd sign off on it. I want the spec, not the pitch.

  The setup to write it against: the decision is whether to bring in congestion charging for the downtown core. The council picks a welfare metric up front (say some composite of median commute time, downtown air quality and small-business revenue, measured 18 months after launch). Traders buy and sell contracts that pay out conditional on the measure being adopted, and the market's recommendation is binding unless a supermajority overrides it. Real money, real losers, and it all has to survive an audit and a local newspaper.

  Give me the desiderata: what any mechanism like this has to deliver to count as good enough for that job — the cases it must get right, the distinctions it can't collapse, the results from social choice or market design it can't contradict — with the case or consideration behind each, and mark which are non-negotiable and which are just preferences of one camp.

  I already know I'm going to get "markets can be manipulated" and "the metric is gameable". Fine, put them on the list, but the bits I'm actually stuck on and want handled properly:

  - the adoption/do gap. What gets priced is how the metric looks in worlds where the policy is adopted, but what the council needs is what happens if it does the thing. Adoption is itself caused by stuff — lobbying, who's mayor, the state of the budget — that also causes the outcome, so a contract can trade high without the policy doing any of the work. Say what a design would have to add for the price to mean what the council wants it to mean, and whether that's even available with one city and no control.
  - abstention. What should the mechanism do when nobody shows up to trade, or the spread is wider than the decision is worth? A thing that always outputs a confident recommendation even on no information is worse than one that can shut up. I want a requirement about this.
  - metric drift. The metric is frozen before the debate, but the policy may change what residents care about, and the residents get a vote later.
  - the scoreboard problem. It's a one-off decision with a payout 18 months out, so we may never find out whether the market was actually well calibrated — which makes it hard to judge the mechanism itself. Is "you can tell after the fact whether it worked" a requirement, and what's the cheapest way to get it?
  - the people implementing the policy are also allowed to trade on it.

  Also: flag any pair of requirements you think can't be jointly satisfied (my hunch is that "legible enough for the public to trust it" pulls against "robust to adversarial traders", but you tell me), and tell me which single requirement does the most work in ruling out candidate designs. If it's quick, a small table scoring binding futarchy, an advisory-only market, and a citizens' assembly that just gets the prices as one input is fine — but the criteria are the part I care about, so keep the weight there.
reasoning: |-
  Here's a thinking process that leads to the suggested one-pager:

  1.  **Analyze the Request:**
      *   **Audience:** City Council (advised by the user).
      *   **Format:** One-pager (specification/desiderata, not a pitch).
      *   **Context:** Testing a decision market (futarchy) for a specific policy: Congestion Charging.
      *   **Mechanism:** Real money, binding outcome (unless supermajority override), welfare metric defined upfront (commute time, air quality, revenue), payout 18 months later.
      *   **Key Constraints:** Must survive audit and local newspaper scrutiny.
      *   **Specific Pain Points to Address:**
          *   Adoption/Do Gap (Selection Bias/Endogeneity).
          *   Abstention/Liquidity (When to shut up).
          *   Metric Drift (Goodhart's Law/Value Lock-in).
          *   Scoreboard Problem (Verification/Calibration).
          *   Insider Trading (Implementers trading).
      *   **Additional Requirements:** Flag incompatible requirements, identify the single most constraining requirement, and optionally provide a comparison table (Binding Futarchy vs. Advisory vs. Citizens' Assembly).
      *   **Tone:** Technical, precise, skeptical, "spec not pitch."

  2.  **Deconstruct the Specific Pain Points (The "Stuck" Bits):**

      *   *Adoption/Do Gap:* This is the classic causal inference problem in futarchy. $P(Outcome | Policy)$ vs. $P(Outcome | Policy \land Adopted)$. If adoption is correlated with external factors (e.g., a booming economy causes both adoption and high revenue), the market prices the correlation, not the causation.
          *   *Solution:* Needs a causal structure. Conditional markets aren't enough. Needs a way to isolate the policy effect. In a single-city context without RCTs, this is extremely hard. The spec needs to demand a causal identification strategy, not just a metric.
      *   *Abstention:* Markets can be thin. If the spread is 40-60 cents, is that a signal or noise?
          *   *Solution:* Liquidity thresholds or "No Decision" options. The mechanism must have a "fail-safe" where it defaults to status quo if information aggregation is insufficient.
      *   *Metric Drift:* The metric is fixed now, but values change. Also, Goodhart's Law (optimizing the metric kills the value).
          *   *Solution:* This is a governance constraint, not just market design. The spec needs to acknowledge that the metric *is* the policy goal, and changing it mid-stream breaks the contract.
      *   *Scoreboard Problem:* It's a one-off. We won't know if the market was right for 18 months.
          *   *Solution:* We can't verify calibration on a single event. We need proxy validation or synthetic controls *during* the trading period, or accept that this is an experiment with unverified epistemic value until the end.
      *   *Insider Trading:* Implementers trading creates perverse incentives (sabotage or over-performance for profit).
          *   *Solution:* Strict bans or blind trusts.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Constraint 1: Causal Validity.* The price must reflect $E[Metric | do(Policy)]$, not $E[Metric | Policy, Adopted]$. This is the hardest technical hurdle.
      *   *Constraint 2: Liquidity/Confidence.* The market must indicate uncertainty.
      *   *Constraint 3: Integrity.* No insider trading.
      *   *Constraint 4: Legibility.* The public must understand why the decision was made.
      *   *Constraint 5: Verification.* We need to know if it worked.

  4.  **Identifying Incompatibilities:**
      *   *Legibility vs. Robustness:* Complex mechanisms (like causal markets with synthetic controls) are hard to explain to the newspaper. Simple conditional markets are easy to explain but causally broken.
      *   *Binding vs. Verification:* If it's binding, we can't test the counterfactual easily (we can't run both policies).

  5.  **Identifying the "Key Constraint":**
      *   The *Adoption/Do Gap* (Causal Identification) is the showstopper. Without solving this, the market is pricing correlation, not policy efficacy. In a single-city context, this is nearly impossible without external data or a very specific design (like resolution markets based on synthetic controls).

  6.  **Developing the Comparison Table:**
      *   Need to score Binding Futarchy, Advisory Market, and Citizens' Assembly (with market input) against the criteria.
      *   Binding Futarchy fails on Causal Identification and Verification.
      *   Advisory Market passes on Integrity but fails on Decision Authority.
      *   Citizens' Assembly passes on Legitimacy but might ignore the market.

  7.  **Refining the Tone:**
      *   Avoid hype. Use "Must," "Should," "Could."
      *   Focus on failure modes.
      *   Keep it tight (One-pager style).

  8.  **Addressing the "Adoption/Do Gap" specifically:**
      *   How to fix it in spec? Require that the resolution criterion adjusts for confounders or uses a synthetic control index. But the prompt asks "whether that's even available." I need to be honest: In a single city, without randomization, pure causal pricing is theoretically impossible via standard conditional markets. The spec must require a *causal resolution mechanism*, not just a metric measurement.

  9.  **Addressing "Abstention":**
      *   Require a "No Trade" default. If volume < X or Spread > Y, status quo prevails.

  10. **Addressing "Scoreboard":**
      *   Require a parallel "Shadow Metric" or Synthetic Control tracking *during* the trading period to validate market moves against real-world leading indicators.

  11. **Final Review against constraints:**
      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I flag incompatibilities? Yes.
      *   Did I identify the single most constraining requirement? Yes (Causal Identification).
      *   Is the table included? Yes.

  12. **Writing the Content (incorporating the "Spec" style):**
      *   Header: To, From, Subject.
      *   Section 1: Core Mechanism Requirements (The "Musts").
      *   Section 2: The Hard Problems (Addressing the user's specific stuck points).
      *   Section 3: Incompatibilities & Trade-offs.
      *   Section 4: The Single Point of Failure.
      *   Section 5: Comparative Assessment.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "causal inference is hard." I need to specify what the *mechanism* must do. It must resolve based on an *estimate* of the counterfactual, not just the raw metric. This implies an oracle or a specific formula for the payout, not just a city audit.
      *(Refinement on Insider Trading)*: If implementers trade, they can sabotage. Non-negotiable ban.
      *(Refinement on Metric Drift)*: This is a political risk. The spec should require a "Metric Lock-in" clause that is legally distinct from policy adjustment.

      *(Final Polish)*: Ensure the distinction between "Non-negotiable" (Safety/Validity) and "Preference" (Efficiency/Speed) is clear.

      *(Wait, one more thing)*: The prompt asks for "the cases it must get right, the distinctions it can't collapse." I should frame the desiderata around these distinctions (e.g., Correlation vs. Causation).

      *(Let's assemble the one-pager.)*

      *Structure:*
      1.  **Objective:** Define the specification for a Decision Market Mechanism (DMM).
      2.  **Critical Distinctions (The "Don't Collapses"):** Causation vs. Correlation, Uncertainty vs. Indifference, Implementation vs. Speculation.
      3.  **Desiderata List:** Categorized by Validity, Integrity, and Governance. Marked N/N vs. Pref.
      4.  **Incompatibilities:** Legibility vs. Robustness, Binding vs. Verification.
      5.  **The Keystone Constraint:** Causal Identification.
      6.  **Comparison Table.**

      *Drafting the Adoption/Do Gap solution:* The spec must require that the payout condition is *not* the raw metric $M$, but an *estimated treatment effect* $\hat{\tau}$. This requires an agreed-upon econometric model (e.g., synthetic control) defined *ex-ante*. Without this, the market is invalid.

      *Drafting the Abstention solution:* The market needs a "Status Quo Default" triggered by liquidity thresholds.

      *Drafting the Scoreboard solution:* We can't verify the counterfactual. We can only verify the *factual*. The spec must acknowledge this limitation. The "cheapest way" is to commit to publishing the raw data and the model used for resolution so external auditors can critique the counterfactual estimate later.

      *Okay, ready to write.*
answer: |-
  **TO:** City Council
  **FROM:** Advisory Office
  **SUBJECT:** Specification Requirements for Decision Market Mechanism (Congestion Charging Pilot)
  **DATE:** October 26, 2023

  ### 1. Core Distinctions (What Must Not Collapse)
  For this mechanism to be valid, the design must structurally enforce the following distinctions. Collapsing these renders the output noise or dangerous.

  *   **Causation vs. Correlation (The Adoption/Do Gap):** The market must price $E[Metric | do(Policy)]$, not $E[Metric | Policy \land Adopted]$. If adoption is correlated with external confounders (e.g., a strong economy drives both revenue and the political will to charge), a standard conditional market will recommend the policy even if it has zero effect.
  *   **Uncertainty vs. Indifference (The Abstention Problem):** A 50/50 price split must mean "the outcome is genuinely unpredictable," not "no one cares enough to trade." The mechanism must distinguish between efficient information aggregation and market failure.
  *   **Implementation vs. Speculation:** Those responsible for executing the policy (e.g., Traffic Dept) must be epistemically and financially decoupled from those betting on the outcome.

  ### 2. Desiderata Specification

  | ID | Requirement | Specification | Status |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Causal Resolution Criterion** | Payouts cannot be based on the raw welfare metric alone. Payouts must be based on an *ex-ante* agreed econometric estimate of the treatment effect (e.g., Synthetic Control Method comparing city to a donor pool of non-adopting cities). | **Non-Negotiable** |
  | **D2** | **Liquidity/Confidence Threshold** | The mechanism must default to Status Quo if trading volume < $X$ or bid-ask spread > $Y%$ at the close. A "confident wrong" is worse than "no decision." | **Non-Negotiable** |
  | **D3** | **Implementer Trading Ban** | Any city employee or contractor with direct influence over the policy implementation (enforcement, signage, routing) is legally barred from trading. Violation voids contract and triggers audit. | **Non-Negotiable** |
  | **D4** | **Metric Lock-In** | The welfare metric formula is legally frozen for the contract duration. Policy adjustments (e.g., changing toll rates) are permitted only if they do not alter the *definition* of the metric. | **Non-Negotiable** |
  | **D5** | **Counterfactual Transparency** | Since the true counterfactual (no policy) is unobservable, the resolution model and data weights must be public and open to post-hoc audit by third-party econometricians. | **Non-Negotiable** |
  | **D6** | **Legible Rationale** | The final market recommendation must be accompanied by a plain-language explanation of *why* the price moved (e.g., "Market reacted to new traffic data," not just "Price is 80c"). | Preference (Public Trust) |
  | **D7** | **Override Cost** | If Council overrides the market, the cost (political or financial) must be high enough to prevent casual disregard, but low enough to prevent tyranny. | Preference (Governance) |
  | **D8** | **Loss Caps** | Individual trader losses capped to prevent predatory behavior or bankruptcy-driven manipulation attempts. | Preference (Risk Mgmt) |

  ### 3. Incompatibilities & Trade-offs
  *   **Legibility (D6) vs. Causal Robustness (D1):** A robust causal model (Synthetic Control) is mathematically complex and difficult to explain in a newspaper headline. A simple metric is legible but causally invalid. *Recommendation: Prioritize D1. A legible lie is worse than a complex truth.*
  *   **Binding Outcome vs. Verification (Scoreboard Problem):** Because the decision is binding, we destroy the control group. We cannot verify if the market was *correct* about the counterfactual, only if the factual outcome occurred. *Mitigation: Commit to publishing the "Shadow Model" (what would have happened) alongside the real data for 18 months.*

  ### 4. The Keystone Constraint
  **Requirement D1 (Causal Resolution Criterion) does the most work.**
  Without an *ex-ante* agreement on how to isolate the policy's effect from confounders, the market is merely betting on political momentum and economic cycles. In a single-city context without randomization, **standard conditional markets are theoretically incapable of solving the Adoption/Do Gap.** If the Council cannot agree on a credible counterfactual model (e.g., which comparator cities to use) *before* trading starts, the mechanism must be aborted.

  ### 5. Comparative Assessment of Mechanisms

  | Feature | **Binding Futarchy** (Current Proposal) | **Advisory Market** (Prediction Only) | **Citizens' Assembly** (With Market Input) |
  | :--- | :--- | :--- | :--- |
  | **Causal Validity** | **Fail** (Unless D1 strictly enforced with ext. data) | **Pass** (No decision impact reduces manipulation incentive) | **Pass** (Humans can reason causally) |
  | **Abstention Handling** | **Risk** (Requires hard-coded default) | **Low Risk** (Council ignores thin markets) | **Low Risk** (Assembly deliberates) |
  | **Public Legibility** | **Low** ("The algorithm decided") | **Med** ("Traders bet this way") | **High** ("Neighbors decided") |
  | **Insider Risk** | **High** (Implementers profit from sabotage/success) | **Med** (Profit possible, no decision power) | **Low** (Random selection) |
  | **Verification** | **Impossible** (Counterfactual destroyed) | **Possible** (Can compare to actual outcome later) | **Possible** (Can compare to actual outcome later) |
  | **Audit Survival** | **Low** (Complex causal claims invite challenge) | **High** (Data is just data) | **High** (Process is democratic) |

  **Recommendation:** Do not proceed with **Binding Futarchy** unless D1 can be satisfied with an external, verified causal model (e.g., using state-level data as control). The **Citizens' Assembly** model, using market prices as *one* informational input among many, satisfies the need for innovative data while retaining democratic accountability and causal reasoning capabilities.

  ***

  **Action Required:** Council must commission an independent econometric feasibility study to determine if a valid Synthetic Control group exists for this city before authorizing market design.
