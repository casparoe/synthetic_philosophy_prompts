      *   *Seed 3:* Facts/evidence don't change. -> Claim 3: The physical facts and the evidence held by the person do not change when the stakes change.
      *   *Seed 4:* Knowledge licenses action/assertion. -> Claim 4: If you know something, you are rational to act on it and assert it. If you can't rationally act on it, you don't know it.
      *   *Refinement:* Make them sound like a joint declaration.

