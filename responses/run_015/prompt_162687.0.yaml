          *   *Correction:* Actually, for IRI, if the subject is unaware, they might still *act* confidently. But do they *know*? IRI usually says knowledge depends on the *actual* stakes. Contextualism says it depends on the *attributor's* salience.
          *   *Refinement:* Let's make sure the prediction is clear.
      *   *Case 3: Group Stakes vs. Personal Stakes.* (Whose stakes count?).
          *   Contextualist: Depends on what the speaker is focusing on.
          *   Encroachment: Usually the subject's stakes. If *she* loses nothing, she might know, even if the group suffers. (This is a known tension in IRI). Let's frame it as: Does knowledge depend on the agent's personal utility or the total utility of the action?
      *   *Case 4: Immoral Goals.* (Bank Robber).
