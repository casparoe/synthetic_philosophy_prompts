      *   **Task:** Write a "Joint Statement" resulting from a good-faith adversarial collaboration between the two camps.
      *   **Specific Requirements:**
          1.  **Numbered Agreed Claims:** Based on user's seeds (stakes-sensitivity is real, plain invariantism is wrong, facts/evidence don't change, knowledge licenses action/assertion).
          2.  **Disagreements Table:** Side-by-side wording for disputed claims (Contextualist vs. Encroachment), no strawmanning.
          3.  **The Cruxes (Most Important):** 4-5 specific cases provided by the user. For each: concrete case, predictions from both sides, what evidence would move them.
          4.  **Format:** Numbered claims, then table, then cruxes. No citations/bibliography. Plain prose (readable at Thanksgiving).
          5.  **Tone:** Respectful, clear, acknowledging real disagreement without sanding it off.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Contextualism:** The word "knows" is context-sensitive. Its truth conditions change depending on the *speaker's* context (specifically, the salience of error possibilities in the conversation). If the BIL says "You don't know," he's raising the standard. If a bystander says "He knows," the standard is lower. Both can be true.
      *   **Pragmatic Encroachment (Interest-Relative Invariantism - IRI):** The word "knows" has fixed truth conditions, *but* those conditions include the *subject's* practical stakes. If the stakes are high for the believer, they need more evidence to know. If stakes are low, less evidence suffices. It's not about the word changing meaning; it's about knowledge itself depending on action.
      *   **Common Ground:** Both reject "Traditional Invariantism" (stakes never matter). Both agree stakes-sensitivity is real (not just politeness). Both agree facts/evidence don't change, so the *status* of knowledge changes. Both agree knowledge is the norm of action/assertion.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Seed 1:* Stakes-sensitivity is real. -> Claim 1: Whether it is appropriate to say someone "knows" something changes when the cost of being wrong changes.
