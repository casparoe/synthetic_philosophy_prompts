answer: |-
  **Summary**
  This project investigates the metaphysics of material constitution using cases drawn from contemporary art practice. The standard debate asks whether a statue and the clay composing it are one object or two, tested against cases of destruction or gradual replacement. I propose testing the three dominant philosophical positions—coincidence, monism, and deflationism—against novel cases where an object's status as an artwork is unstable or reversible. These include works existing only as instructions, manufactured items exhibited as art temporarily, and conserved objects with replaced matter. By applying metaphysical theories to these boundary cases, I will determine whether the theories offer distinct predictions or merely describe the same phenomena in different vocabularies. The result will clarify whether the debate is substantive or verbal, offering insights relevant to archivists and curators managing object identity.

  **The question**
  The core question is whether competing metaphysical accounts of objects yield different verdicts when applied to materials with reversible ontological status. Standard puzzles assume a fixed hierarchy: clay constitutes a statue until destruction. However, art practices now involve matter shifting between being mere stuff and being a work multiple times. The question is not simply which theory is true, but whether any theory can accommodate these shifts without ad hoc adjustments to its core definitions of identity and persistence. If the two-object view claims distinct persistence conditions, can it handle an object that ceases and resumes being a work? If the one-object view claims descriptive variance, can it explain why the variance follows institutional rules rather than physical ones? If the deflationary view claims verbal disagreement, can it specify what conventions govern these shifts? I seek a determinate answer regarding the robustness of these frameworks when removed from their native illustrative cases.

  **Why the existing positions leave it open**
  The three standard families of answers rely on intuitions generated by specific, static cases. The two-object view posits distinct entities sharing matter, distinguished by modal properties like survivability. Yet, it struggles when the 'statue' status is paused and resumed without physical change, blurring the modal distinction. The one-object view argues there is only the clay, described differently. However, it lacks a principle for why the 'artwork' description applies intermittently without physical alteration. The deflationary view suggests the dispute is merely about counting conventions. But this leaves open what constrains those conventions; if conventions allow an object to vanish and reappear based on exhibition status, the deflationary account must explain what reality these conventions track. Currently, each position assumes its preferred cases are neutral testing grounds. By introducing cases where sortal status is fluid, I reveal that each theory leaves the conditions for objecthood under-specified. They settle the standard puzzles but remain silent on reversible ontology, leaving the debate open for genuine adjudication.

  **Method and plan for twelve weeks**
  The twelve weeks will be divided into three phases of case construction, theoretical testing, and synthesis. Weeks one through four focus on refining the three case types: instructional works, temporary readymades, and conservation replacements. I will work with art history colleagues to ensure these descriptions are accurate and not philosophically rigged. The goal is a neutral statement of facts about the objects, stripping away interpretive layers to isolate the ontological claims. Weeks five through eight involve applying each metaphysical framework to these cases. I will derive specific predictions for how each view counts objects and describes persistence in these scenarios. This requires mapping the theoretical vocabulary onto the practical details without altering the theory's core commitments. I will document where each theory requires stretchings or exceptions. Weeks nine through twelve focus on evaluation and writing. I will assess whether the views converge on the same verdicts or diverge. If they converge, I will analyze whether this indicates theoretical equivalence or emptiness. The final output will be a paper-ready manuscript detailing the cases and the comparative performance of each metaphysical position, ready for submission to a general philosophy journal.

  **What success and failure would look like**
  Success would look like a clear divergence: one theory fails to accommodate a case without contradiction, or two theories yield incompatible predictions about how we should count or describe the object. This would narrow the live options in the metaphysical debate. I must be honest about the possibility of a deflationary outcome. If every view absorbs every case with minor adjustments, this indicates the debate may be verbal rather than substantive. This is a valuable negative result. It suggests philosophers are talking past each other. Failure would only occur if the cases prove too ambiguous to generate any predictions, or if the project expands into art theory rather than metaphysics. Even a deflationary conclusion matters to historians and curators: it suggests that object identity is not a fixed metaphysical fact but a flexible tool governed by institutional convention, affecting how collections are managed and preserved.

  **Scope and risks**
  The primary risk is scope creep into art theory or conservation science. To stay within twelve weeks, I will limit the project to the metaphysical implications of the cases, not their art-historical justification. If the three case types prove too complex, I will prioritize the instructional works, as they most sharply challenge persistence conditions. Another risk is that the cases are dismissed as edge cases. I mitigate this by showing how reversible status illuminates hidden assumptions in standard cases. The work remains self-contained.
