      *   *Note:* The *actual* Pasadena Game defined by Nover & Hájek usually has payoff $2^n/n$ (or similar) to make the terms $1/n$, leading to the alternating harmonic series $\sum (-1)^{n+1}/n$, which *does* converge conditionally to $\ln 2$. The user's version is a simplified variant (sometimes called the "Altadena" or just a divergent variant). I must address the game *as described by the user*, while noting the distinction if relevant. The user's version yields $1-1+1...$, which is strictly undefined/divergent.
