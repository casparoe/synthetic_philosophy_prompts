prompt: |-
  Hey, I need a hand with something. I'm putting together a workshop on distributive ethics and I want a document that models what good-faith intellectual disagreement actually looks like. Specifically, I want an adversarial-collaboration joint statement between a prioritarian and a telic egalitarian — the kind of egalitarian who thinks inequality is intrinsically bad, not just instrumentally bad. The leveling-down objection is obviously the main flashpoint, but I don't want it to dominate so completely that the document misses other places where they might genuinely converge or diverge.

  The deliverable should be something both could actually sign. So: a numbered list of agreed claims (about the formal structure of each view, about what each view rules out, about practical upshots where they coincide, about what the leveling-down objection does and doesn't show — whatever you think they can honestly share). Then a disagreements table or section where the residual disputes are stated precisely, with each side's position phrased so its own proponents would say "yes, that's what I mean." Then the cruxes: the sub-questions where settling them would actually move someone. And for each crux, if there's a thought experiment, a case, or a kind of evidence both would agree bears on it, lay that out and record what each side predicts or expects.

  One thing I'd especially like you to flag: are there parts of this debate that are partly or wholly verbal? Like, if they cash out "intrinsic badness of inequality" differently, does the disagreement survive that disambiguation or collapse? I want that called out explicitly if it's there.

  And please, throughout, separate what's genuinely settled among people who work on this from what's contested. Don't write as if one side's framing is the consensus when it isn't. If something is a live dispute, say so.

  Format-wise, I'm easy — whatever makes it clearest. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Topic:** Distributive Ethics (Prioritarianism vs. Telic Egalitarianism).
      *   **Goal:** Create a model of good-faith intellectual disagreement (Adversarial Collaboration Joint Statement).
      *   **Key Constraint:** Must be signable by both sides (charitable, accurate phrasing).
      *   **Key Content:**
          *   Numbered list of agreed claims (structure, exclusions, overlaps, leveling-down nuance).
          *   Disagreements table/section (precise phrasing).
          *   Cruxes (sub-questions that matter, with thought experiments/evidence).
          *   Verbal Dispute Flag (explicitly address if "intrinsic badness" is merely semantic).
          *   Epistemic Status: Distinguish settled vs. contested claims within the field.
      *   **Tone:** Professional, philosophical, nuanced, collaborative.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Telic Egalitarianism:** Inequality is *intrinsically* bad. A world where everyone is worse off but equal can be better in one respect (equality) than a world where some are better off and others worse. (Parfit's distinction).
      *   **Prioritarianism:** Benefits matter more the worse off the recipient is. No essential reference to others' levels, only absolute levels weighted by priority. Avoids the Leveling Down Objection (LDO) by definition.
      *   **The Leveling Down Objection (LDO):** If equality is intrinsically good, then making everyone worse off to achieve equality is good *in one respect*. Telic Egalitarians must accept this (though they might say it's all-things-considered wrong). Prioritarians reject this entirely.
      *   **Convergence:** Both favor helping the worse off over the better off in standard cases. Both reject simple utilitarianism (sum-ranking).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound like a joint statement. "Joint Statement on Distributive Value."
      *   **Introduction:** Set the context. Acknowledge the Parfitian framework.

      *   **Section 1: Points of Agreement (The Common Ground):**
          *   Need to establish what they *both* reject (Strict Utilitarianism, Sufficiency views that ignore the worse-off entirely).
          *   Need to establish practical overlap (most policy recommendations align).
          *   Need to handle the LDO carefully. Telic Egalitarians admit LDO is true *in one respect* but not all-things-considered. Prioritarians agree that *all-things-considered* leveling down is absurd. This is a crucial agreement point to prevent talking past each other.
          *   *Self-Correction on "Settled" vs. "Contested":* I need to make sure I don't present Prioritarianism as the "winner." The field is still live.

      *   **Section 2: Precise Disagreements (The Residual Dispute):**
          *   This needs to be the "Signable" part.
          *   *Telic Claim:* The pattern of distribution itself has non-instrumental value.
          *   *Prioritarian Claim:* Value is agent-relative to the recipient's absolute status, not relational.
          *   *The "In One Respect" clause:* This is where the LDO lives. Telic says "Leveling down is good in one respect." Prioritarian says "No, it's not good in any respect."
          *   *Person-Affecting vs. Impersonal:* Often tied to this. Telic is often impersonal; Prioritarian can be person-affecting (though not necessarily). Let's stick to the value theory aspect.

      *   **Section 3: Cruxes & Adjudication (Moving the Needle):**
          *   What would change a mind?
          *   *Crux 1: The "Complaint" Model.* Can the worse off complain about inequality if they are above sufficiency?
          *   *Crux 2: Separate Worlds.* (Parfit's example). Two groups on different islands. Does inequality matter if they never interact? Telic: Yes. Prioritarian: No.
          *   *Crux 3: Lexical Priority.* Is equality a tie-breaker?
          *   *Thought Experiments:* The "Two Worlds" case is the standard bearer.

      *   **Section 4: The Verbal Dispute Check (Meta-Ethical Analysis):**
          *   This is a specific request. Is "intrinsic badness" just a label?
          *   If Telic Egalitarians say "Leveling down is all-things-considered wrong," does the "in one respect" claim do any work?
          *   *Analysis:* Yes, it affects how we weigh trade-offs. If equality is a *value*, it enters the calculus. If it's not, it doesn't. So it's not *merely* verbal, but the practical divergence is narrow. I need to be precise here.

      *   **Section 5: Epistemic Status Notes:**
          *   Throughout, add marginalia or footnotes indicating what is consensus (e.g., LDO is a serious challenge) vs. live dispute (e.g., whether to abandon telic egalitarianism).

  4.  **Refining the Tone:**
      *   Avoid "Prioritarianism solves X." Instead use "Prioritarianism handles X by..."
      *   Ensure the Telic Egalitarian isn't painted as a fanatic who *wants* to level down. They must be represented as believing equality is a *component* of value, not the *only* component.
      *   Use standard terminology (Parfit, Temkin, Otsuka, Voorhoeve).

  5.  **Review against Constraints:**
      *   *Numbered list of agreed claims?* Yes.
      *   *Disagreements table?* Yes.
      *   *Cruxes with thought experiments?* Yes.
      *   *Verbal dispute flag?* Yes.
      *   *Settled vs. Contested?* Yes, will add a "Status Note" feature.
      *   *Signable?* Yes, by avoiding loaded language.

  6.  **Final Polish:**
      *   Check the definition of "Telic." (Outcome-focused, not deontic).
      *   Check the definition of "Prioritarianism." (Weighted benefits, not relational).
      *   Make sure the "In One Respect" agreement is clear, as that's the biggest source of confusion.

  *(Self-Correction during drafting)*: I initially thought about bringing in Democratic Equality (Anderson). *Correction:* No, keep it strict. The prompt asks for Prioritarian vs. Telic Egalitarian. Bringing in Relational Egalitarianism muddies the water unless it's to contrast. I will stick to the dyad requested to maintain focus.

  *(Refining the Verbal Dispute Section)*: I need to be careful. Some philosophers (e.g., Parfit) suggested the difference might be small. Others (e.g., Temkin) insist it's fundamental. I should present the *argument* for it being verbal without asserting it *is* verbal as fact. The prompt asks me to flag *if* there are parts that are verbal. I will argue that *some* aspects are verbal, but the "Separate Worlds" case suggests a non-verbal core.

  7.  **Final Output Generation** (incorporating the above structure).
answer: |-
  # Joint Statement on Distributive Value: Prioritarianism and Telic Egalitarianism

  **Date:** October 26, 2023
  **Parties:** Proponents of Prioritarianism and Proponents of Telic Egalitarianism
  **Subject:** Mapping the Structure of Disagreement in Distributive Ethics

  ## Preamble
  We, the undersigned, acknowledge that while Prioritarianism and Telic Egalitarianism recommend similar policies in most standard cases, they rest on distinct axiological foundations. This document aims to model good-faith intellectual disagreement by isolating points of convergence, specifying the precise locus of divergence, and identifying the empirical or intuitive "cruxes" that would shift credence between views. We distinguish between claims that are broadly settled in the contemporary literature and those that remain live disputes.

  ---

  ## Part I: Points of Agreement
  *The following claims are accepted by both parties as accurate descriptions of our respective views and their shared implications.*

  1.  **Rejection of Strict Sum-Utilitarianism:** Both views reject the claim that the total sum of well-being is the sole determinant of outcome value. We agree that the *distribution* of well-being matters, not just the aggregate.
  2.  **The Priority Intuition:** In standard cases involving a fixed population and a transfer of resources from a better-off person to a worse-off person (where the transfer is efficient enough to avoid large utility losses), both views prescribe the transfer.
  3.  **All-Things-Considered Judgment on Leveling Down:**
      *   *Status Note: Settled Consensus.*
      *   Both parties agree that "Leveling Down" (making the better-off worse off without benefiting the worse-off) is **never** all-things-considered obligatory, and in almost all plausible cases, is all-things-considered wrong.
      *   Telic Egalitarians explicitly endorse the view that while equality is valuable, it is not the *only* value. They agree that the loss of well-being involved in leveling down outweighs the gain in equality in nearly all real-world scenarios.
  4.  **Rejection of Sufficiency as a Sole Principle:** Both views generally reject "Strict Sufficiency" views (which hold that we have no distributive reason to help the worse-off once they are above a threshold of "enough"). We agree that benefits to the worse-off retain moral weight even above a sufficiency threshold, though we may disagree on *why*.
  5.  **Impersonality of the Value Claim:** Both views are "Telic" (outcome-focused). We agree that the value in question is not merely about procedural fairness or individual entitlements, but about the goodness of states of affairs.

  ---

  ## Part II: Precise Disagreements
  *The following table isolates the residual disputes. Phrasing has been vetted to ensure proponents of each view recognize their position without caricature.*

  | Feature of the View | Telic Egalitarian Position | Prioritarian Position | Status of Dispute |
  | :--- | :--- | :--- | :--- |
  | **The Source of Value** | The *relation* between individuals' well-being levels has non-instrumental value. A state where A=10, B=10 is better *in one respect* than A=10, B=20, even if total well-being is lower in the first state. | The *absolute* level of well-being, weighted by priority, has non-instrumental value. A benefit to B matters more because B is at level 10, not because A is at level 20. | **Live Dispute** (Axiological) |
  | **The Leveling Down Objection (LDO)** | **Concession:** Leveling down is good *in one respect* (the respect of equality), even if bad all-things-considered. <br>**Claim:** A view that cannot acknowledge this "one respect" gain is blind to a genuine value. | **Rejection:** Leveling down is not good in *any* respect. If it benefits no one and harms some, it is purely negative. <br>**Claim:** A view that calls leveling down "good in any respect" is conceptually confused. | **Live Dispute** (Normative) |
  | **Complaints by the Worse-Off** | The worse-off have a valid complaint about inequality even if their absolute position is high, provided others are significantly higher. | Complaints are grounded in absolute deprivation or insufficient priority-weighted benefit, not merely in the gap between self and others. | **Live Dispute** (Deontic Implication) |
  | **Separate Worlds** | Inequality matters even between groups who never interact and cannot causally affect one another (e.g., different planets). | Inequality does not matter between causally isolated groups; only the absolute weighted well-being within each group matters. | **Live Dispute** (Test Case) |

  ---

  ## Part III: The Verbal Dispute Check
  *Explicit analysis of whether the disagreement is merely semantic.*

  **Question:** Is the disagreement over the "Intrinsic Badness of Inequality" wholly verbal?

  **Joint Analysis:**
  We identify a **partial verbal overlap**, but conclude the dispute is **not wholly verbal**.

  1.  **Where it is partly verbal:** If the Telic Egalitarian defines "Intrinsic Badness" strictly as "All-things-considered badness," then Prioritarianism and Telic Egalitarianism collapse into the same view (since both agree leveling down is all-things-considered bad). However, no serious Telic Egalitarian defines it this way. They define it as a *pro tanto* or *component* value.
  2.  **Where it is substantive:** The disagreement survives disambiguation in the **"Separate Worlds"** scenario (Parfit's *Two Worlds* case).
      *   *Scenario:* World A has two isolated groups, both at well-being 10. World B has two isolated groups, one at 10, one at 20. There is no envy, no causal interaction, and no risk of social instability.
      *   *Telic Prediction:* World A is better than World B *in one respect* (equality), despite no one being better off in A.
      *   *Prioritarian Prediction:* World A and World B are equal in value regarding distribution. There is no distributive reason to prefer A.
      *   *Conclusion:* Because the views generate different axiological assessments of the *Same* state of affairs (even if policy recommendations don't change), the dispute is substantive, not merely verbal.

  ---

  ## Part IV: Cruxes and Adjudication
  *Specific sub-questions where settling the matter would move credence from one view to the other. We list the evidence or intuition pumps both sides agree are relevant.*

  ### Crux 1: The "No-Complaint" Intuition
  *   **The Question:** If the worse-off are living excellent lives, but the better-off are living god-like lives, does the inequality itself constitute a harm or injustice?
  *   **Relevant Evidence:** Intuitions regarding "envy" vs. "justice."
  *   **Telic Prediction:** Inequality is regrettable even here. A world of gods and mortals is worse (in one respect) than a world of mortals, even if the mortals are happy.
  *   **Prioritarian Prediction:** If the mortals are above a high threshold of flourishing, the gap is morally inert. The intuition that it is "unfair" is actually a disguised concern about relative power or social status (instrumental), not intrinsic value.
  *   **Adjudication Standard:** If proponents can be made to feel that the gap *itself* is irrelevant when absolute welfare is high, they move toward Prioritarianism. If they feel the gap remains "ugly" even in isolation, they move toward Telic Egalitarianism.

  ### Crux 2: The Weight of the "One Respect"
  *   **The Question:** Does acknowledging equality as a *pro tanto* value change decision-making under uncertainty or in edge cases?
  *   **Relevant Evidence:** Risky prospects and very small populations.
  *   **Telic Prediction:** In a tie-breaker scenario where total priority-weighted value is identical, equality should tip the scale.
  *   **Prioritarian Prediction:** Equality should never tip the scale. If priority-weighted value is identical, the outcomes are equally good.
  *   **Adjudication Standard:** Identification of a case where the two views recommend different actions. (Note: Such cases are rare but theoretically possible in small-number scenarios).

  ### Crux 3: The Explanation of the Priority Intuition
  *   **The Question:** *Why* do benefits to the worse-off matter more?
  *   **Relevant Evidence:** Explanatory power and coherence with other moral domains.
  *   **Telic Prediction:** They matter more because reducing the gap reduces the intrinsic badness of inequality. This unifies distributive justice with a broader aesthetic or holistic value theory.
  *   **Prioritarian Prediction:** They matter more because of the diminishing moral value of well-being (analogous to diminishing marginal utility, but normative, not prudential). This unifies distributive justice with a theory of the good that is person-centered.
  *   **Adjudication Standard:** Which explanation better handles the **"Non-Identity Problem"**? Prioritarianism often struggles here (as it is often person-affecting), while Telic Egalitarianism (being impersonal) may handle it more naturally. If the Non-Identity Problem is deemed decisive, Telic Egalitarianism gains ground.

  ---

  ## Part V: Epistemic Status Notes
  *To ensure clarity on what is settled within the field versus what is contested between us.*

  *   **Settled:** The "Leveling Down Objection" is universally acknowledged as a serious challenge that any plausible egalitarian theory must address. It is settled that no plausible theory mandates leveling down all-things-considered.
  *   **Settled:** Derek Parfit's distinction between "Telic" (outcome) and "Deontic" (principle-based) Egalitarianism is the standard framework for this debate.
  *   **Contested:** Whether "Telic Egalitarianism" is a defensible position post-Parfit. Some meta-ethicists argue the view has been effectively refuted by the LDO; others (e.g., Temkin) argue the LDO is bite-worthy and the view stands.
  *   **Contested:** Whether Prioritarianism is distinct enough from Utilitarianism to avoid its own "Repugnant Conclusion" style problems (e.g., prioritizing many small benefits to the moderately worse-off over a massive benefit to the best-off).

  ---

  **Signed,**

  _________________________
  *Representative, Prioritarian Working Group*

  _________________________
  *Representative, Telic Egalitarian Working Group*
