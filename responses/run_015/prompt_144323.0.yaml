          *   *Analysis:* Lyle is referencing Kwame Anthony Appiah's *The Honor Code*, which uses Williams. Appiah argues honor drives moral revolutions (dueling, footbinding, slavery). Williams argues against "external reasons." Lyle is broadly right about Appiah's thesis, but maybe too absolute about *no one* being reasoned out.
          *   *Verdict:* Partly Right. Strong on Appiah/Williams interpretation, weak on historical universality.

      *   *Move 2 (Marisol):* Three problems. 1. Makes Aldous a snob, not moral agent. 2. Honor = reputation game. 3. Interests aren't idle; honor stories are post-hoc rationalizations for interest-driven ends.
          *   *Analysis:* Good critique of the *novelistic* consequence (snobbery). Good materialist critique (honor masks interest). But Appiah would argue honor *is* a moral psychology, not just a mask.
          *   *Verdict:* Partly Right. Strong on character implication and materialist skepticism, weak on dismissing honor as *just* reputation.

      *   *Move 3 (Lyle):* Interest can't carry it because it's still profitable. People pay to end practices. Holdouts are laughed at, not argued with. That's the shape of a revolution.
