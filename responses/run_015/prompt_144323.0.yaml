          *   *Verdict:* Partly Right. Insightful, but risks circularity as Marisol noted.

      *   *Move 6 (Marisol):* Unfalsifiable theory can't guide writing. "Can't do it now" requires a character reason: why does Aldous care what *these* people think? That's a character problem.
