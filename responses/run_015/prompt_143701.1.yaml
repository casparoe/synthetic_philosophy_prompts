          *   Analysis: The student is trying to say: On autopilot, you lack the *actual* HOT, so if you were an Actualist, you might be confused about your status. But since you are a Dispositionalist, you... wait. If you drive on autopilot, you are *unconscious* of the driving. The Dispositional view says if you have the disposition, it *is* conscious. So if you are on autopilot, you presumably lack the disposition (or the first order state is not targetable).
          *   The student seems to think the Dispositional view explains *unconscious* driving ("why you can drive... you're not actually representing"). But *both* views agree you aren't representing consciously on autopilot. The Dispositional view is meant to save the theory from the charge that we don't have constant occurrent thoughts. It explains how we are conscious of things we aren't actively thinking about *right now* (like peripheral vision). Autopilot is usually the counter-example where consciousness is *lost*.
