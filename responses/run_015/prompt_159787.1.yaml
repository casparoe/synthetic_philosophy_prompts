answer: |-
  To disambiguate the slogan that there is no moral difference between killing and letting die, we must separate distinct claims ranging from the trivial to the radical. At the most basic level is the thesis of outcome equivalence: the patient dies regardless of whether treatment is withdrawn or a lethal injection is given. Slightly more substantive is the claim that there is no intrinsic property of the agent's behaviour that carries moral weight, meaning any difference must be derived from external features like context or convention. Third is the thesis of causal equivalence, asserting that omissions are as causally efficacious as actions. Fourth is the thesis of unified practical orientation, noting that an agent can let die for exactly the same reasons and with exactly the same intention as one kills. Fifth concerns the victim, arguing that whatever grounds the victim's complaint or rights violation in killing is present equally when an agent lets die. Sixth is the thesis regarding the comparative stringency of the duty not to kill and the duty to aid. Finally, there is the institutional thesis that law and policy ought to classify the two identically.

  Evaluating these readings reveals that most fail to support the intensivist's specific conclusions without hidden premises. Outcome equivalence is a platitude relying on the Status-Quo Baseline; it supports (i) descriptively but offers no normative force. The intrinsic property claim is substantive and defensible, also relying on the Status-Quo Baseline, and supports (i) by suggesting vocabulary is cosmetic. Causal equivalence is a substantive and contested metaphysical claim; if it relies on the No-Agent Baseline, it risks conflating the doing/allowing distinction with the stringency of positive duties, effectively making all failures to rescue killings. The unity of practical orientation is substantive and defensible; it supports (iii) by validating the family's sense of agency, but it does not support (ii), as shared intention does not dictate shared policy. The victim's rights claim is substantive and contested, typically adopting the No-Agent Baseline; it supports (ii) and (iii) but is radical, implying a vast expansion of liability. The duty stringency claim is actually about the Role Baseline; it is adjacent to the doing/allowing distinction, addressing breach of duty rather than classification. The institutional claim is normative, not descriptive, and requires independent justification beyond the slogan.

  To your colleague, you should say that none of these precisifications secure conclusion (ii) on their own. To move from permitting withdrawal to permitting active euthanasia, one must argue that the Role Baseline permits causing death, not just that the act/omission distinction is empty. The slogan cannot be the premise that settles policy because the choice among baselines is itself a moral question, and one the slogan gives us no purchase on. To the relative who said you killed her, acknowledge that an act was performed and that in a physical sense the patient died because you stopped acting. However, explain that morally, you did not kill them; you ceased interfering with a fatal process because your role no longer required you to sustain life. The act was the mechanism of withdrawal, authorized by the limits of your duty, not the cause of death in the moral sense.
