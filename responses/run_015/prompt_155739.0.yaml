prompt: |-
  I'm giving a seminar thursday defending a coalitional reading of Kant's universalizability tests — treating maxims like social contracts that collapse if a sub-coalition can deviate for gain — to a room of mostly analyitic Kantians plus one game theorist who thinks I'm smuggling decision theory into the Groundwork. Prep me for the objections in roughly the order they'll hit, phrased the way they'd say it: the contradiction-in-conception objection, the charge that strategic stability isn't moral universalization, the worry that I'm just doing Rawls with extra steps. For each, what should I concede up front, what reply actually lands, and where that reply is weakest. Also tell me the one question I'm hoping nobody asks — probably something about the Formula of Humanity — and draft a 90-second defense for it just in case.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation:

  1.  **Analyze the Request:**
      *   **Topic:** Defending a coalitional reading of Kant's universalizability tests (Categorical Imperative, specifically Universal Law formulation).
      *   **Core Idea:** Treating maxims like social contracts that collapse if a sub-coalition can deviate for gain (game-theoretic stability).
      *   **Audience:** Mostly analytic Kantians + one skeptical game theorist.
      *   **Task:** Prep for objections in a specific order (Contradiction-in-Conception, Strategic Stability vs. Moral Universalization, Rawlsian reductionism).
      *   **Format per Objection:** Concession, Effective Reply, Weakest Point of Reply.
      *   **Additional Task:** Identify the "Dreaded Question" (likely Formula of Humanity) and draft a 90-second defense.
      *   **Tone:** Professional, academic, sharp, anticipating the specific vernacular of analytic Kantians and game theorists.

  2.  **Deconstruct the Core Argument:**
      *   The user is proposing that Kant's CI (Formula of Universal Law -FUL) works like a coalition stability test. If a maxim allows a subgroup to defect and gain while others follow it, the maxim fails universalization.
      *   *Risk:* This sounds like rule-utilitarianism or Hobbesian contractarianism, which Kantians hate. It also risks reducing morality to prudential rationality (the game theorist's critique).

  3.  **Drafting Objection 1: Contradiction-in-Conception (CIC)**
      *   *The Kantian Objection:* Kant talks about *logical* or *teleological* contradictions, not equilibrium failures. You're changing the definition of "contradiction."
      *   *Phrasing:* "Kant speaks of a will contradicting itself, not a payoff matrix failing to reach Nash equilibrium."
      *   *Concession:* Admit Kant doesn't use game-theoretic language.
      *   *Reply:* Argue that "inconceivability" in a practical context *just is* the impossibility of sustained agency. If a coalition defects, the practice vanishes, making the maxim inconceivable as a universal law.
      *   *Weakness:* Some maxims fail CIC without obvious coalition defection (e.g., suicide, developing talents). The game-theoretic model might be too narrow.

  4.  **Drafting Objection 2: Strategic Stability vs. Moral Universalization**
      *   *The Game Theorist/Kantian Hybrid Objection:* Stability isn't normativity. Just because a system is stable doesn't make it moral. (The "Is-Ought" gap).
      *   *Phrasing:* "You've shown the maxim is *unstable*, not that it's *wrong*. Stability is prudential; morality is categorical."
      *   *Concession:* Stability alone isn't morality.
      *   *Reply:* The CI is a *test* of permissibility, not the source of value. The coalitional collapse reveals the *contingency* of the will, which violates autonomy. It exposes the maxim as dependent on exceptions, not law.
      *   *Weakness:* It risks making morality hypothetical ("If you want a stable society..."). Need to ensure the *categorical* force remains.

  5.  **Drafting Objection 3: Rawls with Extra Steps**
      *   *The Kantian Objection:* Rawls already did the contractarian reading. You're just adding math to the Original Position.
      *   *Phrasing:* "This looks like a formalized Original Position. Why call it Kant?"
      *   *Concession:* Rawls is the obvious ancestor.
      *   *Reply:* Rawls focuses on *principles of justice* for institutions. This is about *individual maxims* for action. It's micro-foundational, not macro-political. It saves FUL from being empty.
      *   *Weakness:* The distinction between individual maxims and social principles is blurry in Kant (Kingdom of Ends).

  6.  **Identifying the "Dreaded Question": Formula of Humanity (FH)**
      *   *Why:* If morality is about coalition stability, what happens to human dignity? Are people just players? This is the biggest vulnerability for a game-theoretic reading of Kant.
      *   *The Question:* "If universalizability is just about coalition stability, where does the intrinsic worth of the person go? Are we just tokens in a game?"
      *   *90-Second Defense:* Need to pivot. Stability is the *mechanism* of the test, but Humanity is the *ground*. The coalition collapses *because* treating others as mere means undermines the rational agency required for the coalition.

  7.  **Refining the Tone:**
      *   Use terms like "normative force," "prudential rationality," "maxim-specific," "formalism," "autonomy."
      *   Ensure the "Concede/Reply/Weakness" structure is clear.
      *   Make the "Dreaded Question" feel genuinely threatening.

  8.  **Review and Polish:**
      *   *Check:* Did I address the game theorist specifically? Yes, in objection 2.
      *   *Check:* Is the order correct? Yes (CIC, Stability/Normativity, Rawls).
      *   *Check:* Is the 90-second defense timed? (approx. 130-150 words spoken at a moderate pace).
      *   *Self-Correction during drafting:* Make sure I don't concede *too* much. The user wants to defend the view, not surrender. The concessions should be tactical, not strategic. Ensure the distinction between *justification* and *testing procedure* is clear.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is your battle plan. The room is split between those who think you're trivializing Kant's metaphysics and the one game theorist who thinks you're trivializing game theory. Your goal is to show that coalitional stability is the *structure* of the test, not the *ground* of the value.

  ### Objection 1: The Contradiction-in-Conception (CIC) Charge
  **The Objection:**
  "Kant describes the failure of universalization as a contradiction in the will or a logical impossibility. You're describing a payoff imbalance. When Kant says a maxim 'cannot even be thought,' he means it becomes inconceivable, not that it becomes a sub-optimal equilibrium. You're replacing a modal category with a stability condition."

  *   **Concede Up Front:** "You're right that Kant doesn't speak the language of Nash equilibria. If I claim Kant *was* a game theorist, I'm guilty of anachronism."
  *   **The Reply That Lands:** "But 'inconceivability' in a practical context needs cash value. A world where a practice collapses because a sub-coalition defects is a world where the practice *cannot exist*. The coalitional reading explains *why* the contradiction arises: the universalized maxim destroys the conditions of its own efficacy. It translates 'inconceivable' from metaphysical nonsense to practical impossibility."
  *   **Where It's Weakest:** Maxims like "commit suicide out of self-love" or "never develop your talents." These fail CIC for Kant, but they don't obviously involve a sub-coalition defecting for gain. Your model risks being too narrow, covering only coordination problems (promises, property) and missing duties to self.

  ### Objection 2: Strategic Stability vs. Moral Universalization
  **The Objection (Likely from the Game Theorist):**
  "You've demonstrated that certain maxims are strategically unstable. But instability isn't immorality. A system can be stable and evil, or unstable and just. You've derived a prudential constraint, not a categorical imperative. You've smuggled decision theory into the *Groundwork* and called it morality."

  *   **Concede Up Front:** "I agree that stability alone is not the source of moral value. If my argument were that 'stable = good,' I would be a rule-utilitarian."
  *   **The Reply That Lands:** "The coalitional test isn't the *ground* of obligation; it's the *detection mechanism* for heteronomy. When a maxim relies on a coalition collapse, it reveals the agent is making an exception for themselves. That exception-making is the failure of autonomy. Game theory here just rigorously models what it looks like when a will refuses to legislate universally."
  *   **Where It's Weakest:** You walk a tightrope between "this is how we test" and "this is why it's wrong." If the test relies on agents caring about their own gains (to motivate the deviation), you've reintroduced inclination into the motive, which violates the core of Kantian duty.

  ### Objection 3: "Rawls with Extra Steps"
  **The Objection:**
  "Rawls already interpreted the CI as a procedural device for selecting principles in the Original Position. You've just added coalition mathematics to the veil of ignorance. Why should we call this Kantian ethics rather than contractarianism in drag?"

  *   **Concede Up Front:** "Rawls is the unavoidable predecessor here. I am not discovering a new continent, but mapping a specific terrain he left vague."
  *   **The Reply That Lands:** "Rawls applied the CI to *basic social structures*. I'm applying it to *individual maxims*. Rawls tells us how to build a just state; this coalitional reading tells an individual agent why their specific lie or theft fails the test of reason. It rescues the Formula of Universal Law from the charge of being empty formalism by giving it a concrete failure condition at the micro-level."
  *   **Where It's Weakest:** Kant's "Kingdom of Ends" blurs the line between individual maxims and social laws. If the distinction isn't sharp, you look like you're just doing applied political philosophy rather than moral metaphysics.

  ***

  ### The Dreaded Question
  **The Question You Hope Nobody Asks:**
  "If the universalizability test is just about whether a coalition holds together, where does the **Formula of Humanity** go? Are rational agents just players in a game? If the coalition *could* be stabilized by enslaving a minority, does your test permit it?"

  *(This is the kill shot. If morality is about coalition stability, human dignity becomes instrumental to the stability of the group.)*

  ### The 90-Second Defense
  " That is the precise boundary of my claim. The coalitional reading explains the **logic of the test**, not the **source of value**.

  Why does the coalition collapse when I make a false promise? Not merely because the system becomes inefficient, but because I am treating the promisee as a mere means to my end. I am excluding them from the legislative coalition.

  The game-theoretic instability is the *symptom* of violating Humanity, not the *cause* of the wrong. If a coalition could be stabilized by enslaving a minority, my reading would indeed flag that as 'stable,' but it would fail the Formula of Humanity immediately. I am not reducing the Formula of Humanity to the Formula of Universal Law. I am arguing that the Formula of Universal Law is the procedural filter that catches maxims which violate the status of agents as co-legislators. The math shows the break; the Humanity formula tells us why the break matters."
