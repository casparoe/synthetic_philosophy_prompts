  *(Self-Correction on Philosophy)*: The user mentioned Nozick/Tracking. I should confirm they are right about the two conditionals (Sensitivity and Adherence) but note that in archives, Sensitivity (If false, would source say so?) is the critical one. Adherence (If true, would source say so?) is about coverage. I need to make sure I don't get bogged down in epistemology but use it as the engine for the checklist.

  *(Self-Correction on Inference)*: The user asked which inference types are "the same question in disguise."
      *   One obvious step vs. Background knowledge: Different (one is logical, one is empirical).
      *   Chain of four vs. One step: Different (accumulation of error).
