prompt: |-
  I help keep a small volunteer archive for our town — local history, old photos, building records, that kind of thing — and the thing we actually argue about most isn't the facts, its wording: whether a sentence goes in flat (the mill burned in 1908), hedged (reportedly), or doesn't go in at all. There's three of us, we push out maybe forty entries a month, whatever we write gets quoted back at us at town meetings, and when people appeal a hedge I'm the one who has to explain it, so I want something better than our current system of everybody going with their gut.

  I got into this stuff on my own a couple years back — a used textbook, some podcasts, no classes — and the account that stuck with me (I think it's called the tracking theory? Nozick? maybe I've got the name wrong) is the one with the two what-if questions: you count as knowing that P only if, had P been false, you wouldn't have ended up believing it, and had P been true, you would have. I also gather there's a long fight about whether knowing P means you automatically know everything that obviously follows from P, which is exactly our problem, because half our entries are derived from other entries rather than from a source. I'm definately mangling some of this, so fix me gently but do fix me.

  What I want is an actual procedure, not an essay. Something a volunteer with no training can run on one claim in about ten minutes, with questions to answer in order, boxes to tick, and a one-line reason for the log. Please give me:

  - the steps in order, what counts as a good enough answer to each, and where the thing just stops — downgrade to a hedge, or leave it out;
  - one step where you write down, in a single sentence, how we came by the claim. My worry is people gaming this: describe the route in enough detail and everything passes, describe it loosely and nothing does. Give us a rule of thumb for how fine-grained that sentence should be, and say straight out if no rule can settle it;
  - a step for claims we reach by inference instead of from a source. My half-baked idea, tell me if it's wrong: besides testing the premise, run the same sensitivity question on the step itself — if this step were a bad one, would we still have taken it? — and tell us how many "obvious" steps we're allowed before we go back and check from scratch. Then tell me which of these are really the same question in disguise: a claim that follows in one obvious step; a claim that only follows once you know some background thing we had to look up; a chain of four steps; a claim stitched out of two things we each know separately; and nobody recorded it turned into it didn't happen;
  - a note on every step that's really a judgment call wearing a clipboard.

  Then run it on three of ours. One: a single 1978 newspaper clipping says the mill burned in 1908, and from that we'd also like to say the mill wasn't operating in 1909. Two: the swimming hole was closed in 1974 because the plant upstream dumped solvent — everyone in town knows this, there's a plaque, and if it were false we would all still believe it exactly as hard as we do now. Three: we've read every issue of the local paper from that summer and there's no mention of anyone drowning in the river, so we want to say nobody did.

  I already know which of those is going to come out badly and I'd rather watch you do it properly than have us quietly skip it. Finish with the one-page version — just the questions and the tick boxes, nothing else — that we can tape up over the scanner.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Volunteer archivist for a small town. Self-taught (textbooks, podcasts). No formal philosophy training but familiar with concepts like Nozick's Tracking Theory (sensitivity/safety) and the Closure Principle (knowing P implies knowing Q if Q follows from P).
      *   **Problem:** Disagreements among three volunteers about wording (flat assertion vs. hedged vs. omission). High stakes (quoted at town meetings, appeals). Current system is "gut feeling."
      *   **Goal:** A concrete, 10-minute procedure for evaluating a single claim. Needs steps, criteria for stopping/downgrading, a rule for describing the source route, a specific method for handling inference/closure, identification of hidden judgment calls, and application to three specific test cases. Finally, a one-page checklist for the wall.
      *   **Tone:** Practical, respectful, precise, "fix me gently," no fluff/essay.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Tracking Theory (Nozick):** Knowledge requires Sensitivity (If $P$ were false, I wouldn't believe $P$) and Adherence (If $P$ were true, I would believe $P$). The user has the gist right.
      *   **Closure Principle:** If I know $P$, and I know $P \to Q$, do I know $Q$? Skeptics say no (lottery paradox, zebra/mule case). Archivists need a pragmatic version of this.
      *   **The Archive Context:** This isn't pure epistemology; it's *public history*. Accuracy matters, but so does utility and liability. "Knowledge" here is closer to "warranted assertibility."

  3.  **Drafting the Procedure (The Core Task):**
      *   *Constraint:* 10 minutes per claim.
      *   *Constraint:* Needs to handle source vs. inference.
      *   *Constraint:* Needs to handle the "route description" granularity problem.
      *   *Constraint:* Needs to flag judgment calls.

      *   *Step 1: Source Identification.* (The "Route" problem).
          *   Rule of thumb: Must be specific enough that a stranger could find the same document in 5 minutes. "The 1978 Gazette" is too loose. "1978 Gazette, Oct 4, p.3 col 2" is good.
          *   Judgment Call: What counts as a "document"? (Oral history vs. physical record).

      *   *Step 2: Sensitivity Check (The Nozick Test).*
          *   Question: If this claim were false, would our source still say it's true?
          *   If Yes (Source is unreliable/unsensitive) -> Hedge or Drop.
          *   Judgment Call: How counterfactual do we get? (Is it a typo or a lie?)

      *   *Step 3: Inference/Closure Check.*
          *   User's idea: Test the step itself.
          *   Refinement: Limit the chain length. "One obvious step" is usually safe. "Four steps" is dangerous. "Background knowledge" needs to be documented. "Two people knowing separate things" is risky (communication gap). "Absence of evidence" is the trickiest (need to establish expectation of evidence).
          *   Rule: Max 2 inferential steps. If more, requires external verification.

      *   *Step 4: The Verdict.*
          *   Flat, Hedged, or Omit.

  4.  **Addressing the Specific Questions:**
      *   *Route Granularity:* Give a concrete rule (e.g., "Call Number + Date + Page"). Acknowledge that no rule settles *reliability*, only *retrievability*.
      *   *Inference Types:*
          1.  One obvious step: Safe (e.g., "Died 1900" -> "Dead in 1901").
          2.  Background knowledge needed: Risky (needs citation).
          3.  Chain of four: Unsafe (break the chain).
          4.  Stitched knowledge: Unsafe (needs consolidation).
          5.  Absence of evidence: Very Risky (needs "Search Warrant" step).
      *   *Judgment Calls:* Highlight where human discretion overrides the checklist (e.g., interpreting "obvious," assessing source bias).

  5.  **Running the Test Cases:**
      *   *Case 1 (Mill Burned 1908 -> Not Operating 1909).*
          *   Source: 1978 paper citing 1908 fire.
          *   Inference: Burned -> Not Operating.
          *   Analysis: Sensitivity is okay on the fire. Inference is strong but not absolute (could rebuild quickly).
          *   Verdict: Hedge the operation status.
      *   *Case 2 (Swimming Hole/Solvent).*
