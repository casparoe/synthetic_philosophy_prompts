answer: |-
  You have the philosophy right enough for the job. You are describing **Nozick's Tracking Theory**. The two conditionals are **Sensitivity** (If $P$ were false, you wouldn't believe it) and **Adherence** (If $P$ were true, you would believe it). The "fight about obvious follows" is the **Closure Principle** (If I know $P$, and $P$ implies $Q$, do I know $Q$?). In archives, Closure is where errors compound.

  Here is the procedure. It is designed to force the "gut feeling" into the open so you can argue about the inputs, not the outcome.

  ### The Ten-Minute Claim Protocol

  **Step 1: The Route Sentence**
  Write one sentence describing exactly how this claim arrived on your draft page.
  *   **The Rule of Thumb:** The sentence must contain enough locator data that a stranger could find the *exact same evidence* in under five minutes without asking you for help.
  *   **Good:** "1978 Gazette, Oct 4, p.3 col 2, citing 1908 fire marshal report."
  *   **Bad:** "We read it in an old paper."
  *   **Bad:** "Everyone knows this."
  *   **Stop Condition:** If you cannot write this sentence, the claim is **Oral/Unverified**. Downgrade to "Local Legend" or omit.
  *   **Judgment Call:** *What counts as a document?* A plaque is a document. A memory is not. If your "source" is a person, you need a recording or transcript, or it fails this step.

  **Step 2: The Sensitivity Test (The Source)**
  Look at your Route Sentence. Ask: **"If this claim were false, would this source still say it is true?"**
  *   **Pass:** The source would likely be different (e.g., a death certificate wouldn't exist; a photo would look different).
  *   **Fail:** The source would look exactly the same (e.g., a rumor column; a plaque erected 20 years later based on guesswork).
  *   **Stop Condition:** If **Fail**, you cannot state this flatly. Downgrade to "Reportedly" or "According to [Source]." If the source is known to be unreliable (e.g., a partisan pamphlet), **Omit**.
  *   **Judgment Call:** *How false is false?* Are we testing for a typo or a lie? Assume a substantive error. If the source is merely repeating another source, trace it back one step.

  **Step 3: The Inference Check (The Closure Test)**
  Did you derive this claim directly from the source, or did you have to think/logic your way there?
  *   **Direct:** The source says exactly this. (Skip to Step 4).
  *   **Inferred:** You combined facts or used background knowledge.
  *   **The Rule:** Count the "hops."
      1.  **One Obvious Step:** (e.g., Source: "Died Jan 1908." Claim: "Not alive in Feb 1908.") -> **Pass.**
      2.  **Background Knowledge:** (e.g., Source: "Mill burned." Claim: "Production stopped." Requires knowing mills can't produce while burning.) -> **Requires Citation.** You must write down the background fact as if it were a source.
      3.  **Chain of 3+ Steps:** -> **Fail.** Break the chain. Verify the conclusion with a new source.
      4.  **Stitched Knowledge:** (Volunteer A knows X, Volunteer B knows Y, Claim is X+Y.) -> **Fail.** This is not "known" by the archive until written in one source.
      5.  **Absence of Evidence:** (e.g., "No papers mention drowning, so no drowning.") -> **Special Rule.** You must prove that a drowning *would* have been in the papers. (See Case 3).
  *   **Stop Condition:** If **Fail**, downgrade to "Likely" or "Suggests." If the inference is critical to liability (e.g., property lines), **Omit** until verified.
  *   **Judgment Call:** *What is "Obvious"?* If you have to explain it to the other volunteers, it isn't obvious. It's an inference.

  **Step 4: The Adherence Check (Coverage)**
  Ask: **"If this claim were true, would we expect to have found this evidence?"**
  *   **Purpose:** This catches "Absence of Evidence" errors.
  *   **Stop Condition:** If the answer is "No" (e.g., small drownings weren't reported), you cannot claim certainty based on silence. Hedge to "No recorded instances."

  **Step 5: Final Wording**
  *   **Flat:** Passed Steps 1, 2, 3 (Direct/1-hop), and 4.
  *   **Hedged:** Failed Step 2 (Source reliability) or Step 3 (Inference risk). Use "Reportedly," "Records suggest," or "According to."
  *   **Omit:** Failed Step 1 (No route) or Step 3 (Complex chain) or Step 2 (Source is garbage).

  ---

  ### Analysis of Your Inference Types
  You asked which of these are the same question in disguise. Here is the breakdown based on the Protocol above:

  1.  **One obvious step:** This is **Safe Closure**. (Passes Step 3).
  2.  **Requires background knowledge:** This is **Hidden Premise**. It fails Step 3 unless the background knowledge is cited. It is *not* the same as #1 because it introduces an external variable.
  3.  **Chain of four steps:** This is **Error Accumulation**. It fails Step 3. Each step has a probability of error; four steps multiply that risk.
  4.  **Stitched from two people:** This is **Distributed Knowledge**. It fails Step 1 (Route) and Step 3. The archive as an entity does not "know" it until it is integrated.
  5.  **Nobody recorded it = Didn't happen:** This is **Argument from Silence**. It fails Step 4 (Adherence). It is logically distinct from the others because it relies on the *lack* of a trace rather than the presence.

  **The Verdict:** #1 is the only "safe" inference. #2, #3, #4, and #5 all require additional documentation or hedging. #3 and #5 are the most dangerous.

  ---

  ### Running the Test Cases

  **Case 1: The Mill (1978 paper says 1908 fire -> Claim: Not operating in 1909)**
  *   **Step 1 (Route):** Pass. "1978 Gazette, citing 1908 fire."
  *   **Step 2 (Sensitivity):** Pass. If the mill didn't burn, the 1978 paper likely wouldn't say it did (assuming they weren't lying).
  *   **Step 3 (Inference):** **Fail/Hedge.** "Burned in 1908" -> "Not operating in 1909" is a background knowledge hop. Mills can be rebuilt in months.
  *   **Step 4 (Adherence):** Pass. If it were operating, records would likely exist.
  *   **Result:** **Hedge.** "The mill burned in 1908; records suggest operations ceased until [Date]." Do not flatly claim 1909 closure without a 1909 tax or business record.

  **Case 2: The Swimming Hole (Plaque/Everyone knows solvent dump 1974)**
  *   **Step 1 (Route):** **Fail.** "Everyone knows" and "Plaque" are secondary. Who made the plaque? On what evidence?
  *   **Step 2 (Sensitivity):** **Fail.** If the dump *didn't* happen, would the plaque still be there? Yes. Would people still believe it? Yes (rumors persist). This fails the Nozick Sensitivity test completely.
  *   **Step 3 (Inference):** N/A (Source failed).
  *   **Result:** **Hedge Heavily or Omit.** "Local tradition holds..." or "A plaque commemorates..." Do not state as fact that the plant dumped solvent without an environmental report or contemporary news story. You correctly suspected this would come out badly.

  **Case 3: The Drowning (Read every paper, no mention -> Claim: Nobody drowned)**
  *   **Step 1 (Route):** Pass. "Complete run of Local Paper, Summer 19XX."
  *   **Step 2 (Sensitivity):** **Fail.** If someone drowned, would the paper *necessarily* say so? No. (Private burial, no witnesses, covered up).
  *   **Step 3 (Inference):** **Fail.** This is the "Absence of Evidence" hop.
  *   **Step 4 (Adherence):** **Fail.** If someone drowned, would we *expect* to find it in the paper? In 1900? Maybe. In 1970? Likely. But not guaranteed.
  *   **Result:** **Hedge.** "No drownings were reported in the local press." Do not claim "Nobody drowned."

  ---

  ### The One-Page Version (For the Wall)

  **ARCHIVE CLAIM CHECKLIST (10 MIN MAX)**

  **1. THE ROUTE**
  [ ] Can I write one sentence with specific dates/page numbers that lets a stranger find this source in 5 mins?
  *   *NO:* **STOP.** Mark as "Oral Tradition" or Omit.
  *   *YES:* Proceed.

  **2. SENSITIVITY (THE SOURCE)**
  [ ] If this claim were FALSE, would this source still look exactly the same?
  *   *YES (Source wouldn't change):* **STOP.** Downgrade to "Reportedly" or Omit.
  *   *NO (Source would differ):* Proceed.

  **3. INFERENCE (THE LOGIC)**
  [ ] Did we logic our way to this claim instead of reading it directly?
  *   *NO (Direct Quote):* Skip to Box 4.
  *   *YES:* Count the hops.
      [ ] Is it 1 obvious step? (e.g., Dead in Jan -> Dead in Feb) -> **OK.**
      [ ] Does it need outside knowledge? -> **CITE THAT KNOWLEDGE.**
      [ ] Is it a chain of 2+ steps? -> **STOP.** Hedge or Find New Source.
      [ ] Is it based on "Nobody said otherwise"? -> **STOP.** See Box 4.

  **4. ADHERENCE (THE SILENCE)**
  [ ] If this event happened, would we definitely have a record of it?
  *   *NO (It could be hidden/missed):* **STOP.** Hedge to "No recorded instances."
  *   *YES:* Proceed.

  **5. FINAL VERDICT**
  [ ] **FLAT:** Passed all boxes.
  [ ] **HEDGE:** Failed Step 2 or 3 (1-hop). Use "According to," "Suggests," "Reportedly."
  [ ] **OMIT:** Failed Step 1 or 3 (Complex) or 2 (Unreliable).

  **JUDGMENT CALL ALERT:**
  *   If you have to explain why a step is "obvious" to the other volunteers, it is **not obvious**. Treat it as an inference.
  *   If the claim affects property lines or liability, **HEDGE** regardless of the score.
