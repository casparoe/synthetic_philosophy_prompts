      *   Invariance: Physics of computation doesn't change between train/test (there is no train/test really, it's a definition).
      *   Auditability: I can see the code. I know what `p99` means.
      *   Verdict: High trust justified.

  6.  **Calculating the Cost (The "Bill"):**
      *   Can we save all 7?
      *   Case 6 is the hardest. The staff engineer says "benchmark is all we have." The Principle says "benchmark is only good if it tests invariance."
      *   To save Case 6 (rejecting the engineer's nihilism), we must admit that we *do* assume our problems belong to a specific subclass of "natural" problems (Stable Mechanisms). This is an empirical claim.
      *   Case 3 (SHA-256): We trust the math, not the empirical run. This fits "Verification."
      *   Case 5 (Churn): We admit we failed to find the invariant mechanism.
      *   *Sacrifice:* We might have to surrender the idea that we *know* we have the mechanism. We only have *candidates*. So the verdict in Case 5 ("inference was already illegitimate") is correct, but the cost is admitting we can't always tell *which* inferences are legitimate until they break. We surrender **Omniscience of Mechanism**. We keep **Requirement of Mechanism**.
      *   Actually, looking closer at Case 6: The engineer says "pick whatever wins on benchmark." The Principle says "pick whatever matches the mechanism." If the benchmark *reflects* the mechanism, they align. If not, benchmark is useless. To save the user's intuition, we must claim our internal benchmark *does* reflect the deployment distribution's causal structure better than random noise.
      *   *Refined Cost:* We must admit that "Mechanism" is a placeholder for "Assumption of Stability." We cannot prove stability.

  7.  **Classifying the Principle:**
      *   Is it empirical? Yes, it claims the world (logistics) has stable causal structures.
      *   Is it a stipulation? Yes, we *act as if* it does to function.
      *   Is it something else? It's a **Methodological Necessity**. We cannot do science/engineering without assuming some invariance.
      *   *Falsification:* What counts against it? A world where *no* models generalize despite perfect mechanistic understanding (e.g., pure chaos). Or, if we find that simple mechanistic models consistently underperform black-box brute force in the long run *on stable tasks*.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the query. Validate the feeling of "drift."
