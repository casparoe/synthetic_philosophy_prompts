          5.  Classify the principle (empirical claim, stipulation, or something else) and what would count against it.
      *   **Tone:** Intellectual, rigorous, pragmatic, slightly weary but deeply engaged. Avoids hand-waving. Acknowledges the tension between engineering pragmatism and philosophical skepticism.

  2.  **Deconstruct the 7 Verdicts:**
      *   *Case 1 (Distribution Shift):* Same service = okay. Different service/schema/population = garbage. *Key:* Structural similarity/causal invariance matters more than sample size.
      *   *Case 2 (Capacity/Overfitting):* Huge model perfect train = suspicious. Small model perfect train = okay. *Key:* Complexity penalty/Occam's razor.
      *   *Case 3 (SHA-256 vs. Collisions):* Trust implementation logic (deterministic construction) > Trust empirical regularity (no collisions seen). *Key:* Mechanistic understanding vs. Black-box regularity.
      *   *Case 4 (Physics Extrapolation):* Symmetry/Conservation > Fit quality. *Key:* Invariance principles trump statistical fit.
      *   *Case 5 (Churn Feature):* Statistically robust but failed in prod. *Key:* Spurious correlation vs. Causal mechanism. "Naturalness" is vague.
      *   *Case 6 (No-Free-Lunch):* Accept bias is a wager. Reject "just benchmark." *Key:* Benchmarks need to represent the *target distribution*, not just past performance. There is a difference between "no universal algorithm" and "no justified preference for *our* problem class."
      *   *Case 7 (Uniformity of Nature):* Reject "Future = Past" as too broad. *Key:* Need specific invariance, not global uniformity.

      *   *Alerting Rule:* Trust simple rule (p99 > 400ms) > Complex Classifier. Reason: Enumerability of failure modes. *Key:* Transparency/Interpretability allows verification of assumptions.

  3.  **Synthesize a Unifying Principle:**
      *   The common thread isn't just "it works." It's about *why* it works.
      *   Cases 1, 4, 5, 7 point to **Causal/Structural Invariance**. The relationship must hold across contexts, not just within the training distribution.
      *   Cases 2, 6 point to **Inductive Bias matched to Mechanism**. We prefer simpler models *if* they capture the mechanism, not just because they are simple.
      *   Case 3 points to **Constructive Verification**. We trust things we can trace logically (code/math) more than things we observe empirically without a model.
      *   Alerting Rule points to **Auditability**.

      *   *Candidate Principle:* **Mechanistic Invariance under Perturbation.**
      *   Or better: **The Principle of Stable Mechanisms.** We are justified in projecting past performance to the future only to the extent that we have identified a *mechanism* that is invariant under the specific perturbations expected in deployment.
      *   Let's refine this. The user is asking for a *justification* for their engineering intuition. The intuition distinguishes between "curve fitting" and "capturing a law."
      *   Proposed Principle: **The Principle of Causal Stability.**
      *   *Core:* Generalization is licensed not by statistical fit, but by the identification of causal structures or invariant mechanisms that persist across the shift from training to deployment.
      *   *Secondary:* Complexity is penalized not intrinsically, but because high complexity obscures the mechanism and increases the risk of fitting noise (which is not invariant).

  4.  **Drafting the Principle (Iterative refinement):**
      *   Need to be precise.
      *   Clause 1 (Invariance): A prediction is reliable only if the dependency it exploits is invariant under the intervention of deployment. (Addresses 1, 4, 5, 7).
      *   Clause 2 (Complexity): Model capacity is justified only insofar as it is required to express the invariant mechanism; excess capacity licenses skepticism. (Addresses 2, 6).
      *   Clause 3 (Verification): Confidence scales with the ability to verify the mechanism independently of the data fit. (Addresses 3, Alerting Rule).

  5.  **Applying to the Alerting Rule:**
      *   Rule: `p99 > 400ms for 3 mins`.
