      *   **Problem:** The user feels their day-to-day engineering practices are losing their footing under philosophical scrutiny (Hume, No-Free-Lunch, etc.). They feel like a "defender of practices" but lack the formal training to justify *why* certain practices work while others don't, beyond "it works."
      *   **Input:** A list of 7 specific "verdicts" or intuitions about ML/systems reliability, generalization, and induction. Plus a specific case about an alerting rule.
      *   **Request:**
