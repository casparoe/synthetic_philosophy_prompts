  11. **Final Polish:** Ensure the distinction between "prediction" and "explanation" is clear. The user trusts the alert because it's explainable/auditable. The principle must value explainability as a proxy for verified invariance.

  **(Self-Correction on the "Principle" Name):** "Causal Stability" is good. "Invariant Risk Minimization" is the ML term. Let's stick to a philosophical framing: **The Principle of Projectible Mechanisms.** (Goodman's "grue" problem is lurking here). Let's go with **The Principle of Stable Mechanisms.**

  **(Final check on the Alerting Rule):** The user says "I can enumerate the ways it could be wrong." This is about **Bounded Complexity**. The principle should incorporate this.

  Okay, ready to write. The structure will be:
