  1. The Phenomenon Restated

  You are describing a semantic equivocation on the term "adaptation." In the first sense, adaptation is ahistorical: a trait is an adaptation if it currently contributes to fitness (current utility). In the second sense, it is etiological: a trait is an adaptation only if natural selection historically shaped it for that specific function. The argumentative move involves treating these distinct definitions as interchangeable. When challenged on the historical claim ("Was it selected for this?"), the arguer points to evidence of current utility ("It helps now"). When challenged on sufficiency ("Couldn't it be a byproduct?"), they retreat to the ahistorical definition ("It still functions"). Finally, they reassert the historical conclusion as if the current utility proved the evolutionary history. This slippage renders the claim unfalsifiable, as evidence against the historical narrative is deflected by the current function, while the explanatory weight of the historical narrative is retained. The danger lies in granting evolutionary explanation without evolutionary evidence.

  2. Nearest Established Concepts

  The closest philosophical framework is the distinction between *Selected Effect* (SE) functions and *Causal Role* (CR) functions, articulated by philosophers like Ruth Millikan and Robert Cummins. SE functions are etiological: a trait's function is strictly what it was historically selected for. CR functions are ahistorical: a trait's function is simply what it currently does within a containing system. Your friend's move equivokes between these, treating CR evidence (current utility) as sufficient proof for SE claims (historical selection). Another related concept is Gould and Lewontin's "adaptationist programme." However, their critique primarily targets the *presumption* that traits are optimal adaptations designed by selection, whereas your observation targets the *semantic ambiguity* allowing that presumption to persist despite counter-evidence. Additionally, the term "Just-So Story" describes the unfalsifiable narrative resulting from this move, but it doesn't name the logical mechanism itself. While "panselectionism" describes the belief that all traits are adaptations, it doesn't capture the specific definitional slippage regarding current utility versus historical origin that you identified. The distinction is crucial because SE functions require phylogenetic evidence, whereas CR functions require only physiological analysis. In professional literature, this is flagged as a category error in "function talk," but lacks a label for the rhetorical strategy of exploiting it to shield a hypothesis. This specific slippage is often discussed in the context of teleosemantics, but the argumentative tactic itself remains embedded within broader critiques of adaptationism rather than standing as a named fallacy.

  3. Is There a Name?

  There is no single, standardized name for this specific argumentative move. While philosophers of biology rigorously distinguish between etiological and ahistorical functions, the rhetorical tactic of sliding between them to evade falsification lacks a dedicated label. It is typically subsumed under broader critiques of "naive adaptationism" or "function attributions." The lack of a name stems from the fact that professional literature usually enforces the SE/CR distinction explicitly, whereas this equivocation thrives in informal discourse or popular science where precision is relaxed. Consequently, while the *error* is well-recognized (confusing current utility with historical selection), the specific *rhetorical maneuver* of exploiting that confusion to shield a hypothesis from refutation remains unnamed in the canonical literature. Some might refer to it as a "modal fallacy" in evolutionary reasoning, but this is not standard terminology. Naming it matters because it isolates a specific logical failure from general disagreement about evolutionary psychology. Without a name, the move hides in plain sight as standard adaptationist reasoning.

  4. If No Name Exists: A Proposal

  I propose calling this **The Etiological Slide**. It is defined as the rhetorical shift between ahistorical functional claims (current utility) and etiological historical claims (selection history) without acknowledging the evidentiary gap between them. The move becomes fallacious when an arguer asserts a historical conclusion ("selected for X") based solely on ahistorical premises ("useful for X now"), while resisting counter-arguments by switching definitions. It is harmless only when the context makes clear which sense is operative—for example, when discussing physiological capacity versus evolutionary origin separately. The critical criterion for identifying the fallacy is whether the arguer accepts that current utility alone is insufficient to prove historical selection. If they demand historical evidence for historical claims, the slide is avoided; if they treat utility as proxy for history, the slide is in effect. This definition isolates the logical error from the broader philosophical debate about adaptationism. It allows critics to pinpoint exactly where the argument breaks down without rejecting adaptationism entirely. This precision aids clarity.

  5. Boundary Cases

  A difficult boundary case involves **exaptation**. If a trait evolved for function A but is now used for function B, calling it an "adaptation for B" is technically false etologically but true functionally. If an arguer says "It's an adaptation for flight" regarding feathers (which may have evolved for insulation), are they sliding? It depends on whether they imply historical selection for flight. Another edge case is **deep homology**, where historical data is inaccessible. If we cannot distinguish whether a trait was selected for its current use or a precursor use, arguing for current utility might be the only available proxy. Here, the slide isn't necessarily deceptive but epistemically forced. The ambiguity arises because the lack of historical record makes the distinction between SE and CR functions empirically blurred, allowing the arguer to claim the slide is merely a necessary simplification rather than a logical error. Distinguishing laziness from necessity is the core challenge here.
