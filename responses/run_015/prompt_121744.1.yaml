answer: |-
  My credence that the interpersonal violence rate was lower in the period 1990 to 2020 than in the period 1750 to 1800 is 0.85. I arrive at this number by assigning a 0.95 probability that baseline homicide rates in pre-police societies of the eighteenth century exceeded modern global averages, a 0.90 probability that warfare intensity per capita was higher during the Napoleonic and colonial conflicts of that era than in the post-Cold War period, and a 0.90 probability that the inclusion of state violence—specifically slavery and colonial pacification—adds sufficient volume to the 1750–1800 ledger to withstand measurement error; multiplying these conjunctive probabilities yields roughly 0.77, which I adjust upward to 0.85 based on the robustness of the homicide trend alone even if warfare estimates are noisy. The weak point in this calculation is the quantification of state violence in the eighteenth century, as records of colonial killings and slave mortality are fragmentary; this term would move most significantly with the discovery of systematic demographic audits from colonial administrations that explicitly catalogued lethal force. Regarding the four complications, this number is 0.80 conditional on person-years being the correct denominator, but rises to 0.90 if normalized per social encounter, because while population density has increased, the rate of violent interaction per encounter has plummeted due to norms and policing. The consideration of the mean versus the tail does not move this number, as the catastrophic risks of the 1750–1800 period were comparable to modern risks, leaving the average burden as the deciding factor. I assign a 0.30 probability that a substantial fraction of the measured decline is displacement rather than reduction, but because your metric counts state violence on the same footing as private violence, incarceration and policing count as violence only when physically enacted, meaning incapacitation registers as a net reduction in the IVR; acknowledging this possibility lowers my credence only to 0.82. Finally, I judge that the asymmetry of evidence erosion inflates the apparent violence of the past, because fortifications and weapons preserve better than peaceful tools and mass graves are more likely to be excavated than isolated burials; correcting for this bias suggests the true past IVR was lower than the archaeological record implies, which moves my credence down from 0.85 to 0.80.

  My credence that the interpersonal violence rate was lower in 1990 to 2020 than in any earlier century for which we have evidence, going back to the beginning of settled agriculture, is 0.50. This number is derived from a 0.70 probability that the long-term trend of pacification is monotonic, multiplied by a 0.70 probability that no specific century of imperial stability—such as the height of the Pax Romana or the Song Dynasty—achieved a lower per capita violence rate than the modern era, adjusted downward by a 0.50 confidence factor for the darkness of the archaeological record in non-literate regions where local pacification may have occurred without leaving a trace; the arithmetic combination suggests a probability near 0.55, which I round to 0.50 to reflect the extreme sensitivity of this claim to a single counterexample. The weak point is the assumption of monotonicity, as history shows volatile swings in violence rather than a smooth decline; this term would move most with high-resolution regional data showing consistent violence floors in pre-modern stable states. On the denominator complication, this number is highly conditional: if violence per social encounter is the true metric, my credence rises to 0.65 because modern interaction density is unprecedented, but if person-years is correct, it remains at 0.50. The mean versus the tail consideration moves this number down to 0.40, because the existence of nuclear weapons means the tail risk of the 1990–2020 period is qualitatively different from any earlier century, potentially invalidating the claim that modern life is safer if catastrophic risk is the relevant measure. I assign a 0.40 probability that displacement accounts for the decline, but since your metric counts state violence, the relocation of violence from private to public hands is captured, so this complication does not significantly alter the number. Regarding evidence erosion, I maintain that the record inflates past violence, which should support the decline thesis, but because this claim requires beating *every* earlier century, the uncertainty variance is so high that I must discount my credence; acknowledging that we might be missing a peaceful century lowers my confidence from 0.55 to 0.50.

  My credence that there is a fact of the matter about whether violence has declined, over and above the choice of some particular metric, is 0.35. I calculate this by assigning a 0.40 probability that violence is a natural kind rather than a social construct, a 0.50 probability that moral weight is invariant across historical contexts, and a 0.60 probability that any single metric can capture the phenomenon without hiding value judgments; multiplying these yields 0.12, but I adjust upward to 0.35 because the physical reality of bodily harm provides a material anchor even if the categorization is fuzzy. The weak point is the claim that violence is a natural kind, as the definition of "deliberate" injury shifts with cultural norms; this term would move most with philosophical argumentation regarding the ontology of social facts. The denominator complication moves this number down to 0.25, because the choice between per capita and per encounter is not merely technical but reflects a substantive disagreement about whether violence is a property of individuals or of social structures. The mean versus the tail consideration moves this number down to 0.20, because prioritizing catastrophic risk over average burden is a value judgment that cannot be resolved by empirical data alone. I assign a 0.60 probability that displacement is occurring, and because determining whether prevention counts as reduction depends on normative views about state legitimacy, this complication reinforces the view that there is no metric-independent fact, moving the number down to 0.30. Finally, on evidence erosion, the inability to arbitrate between competing biases without assuming a prior model of violence suggests that the data cannot speak for itself, which lowers my credence in a metric-independent fact to 0.35.

  The disagreement between your two interviewees lives primarily in the sub-question of whether violence is a natural kind, which underpins Claim 3. The quantitative political scientist is arguing about Claim 1—the empirical trend—while taking Claim 3 for granted, whereas the scholar of state formation is arguing about Claim 3—the validity of the metric—while treating Claim 1 as secondary. The political scientist is arguing about something other than what he takes himself to be arguing about; he believes he is settling an empirical dispute with data, but he is actually relying on a conceptual framework that the scholar rejects. The scholar is closer to the core disagreement, recognizing that the numbers only speak once the definition of violence is settled, but she may be overstating the arbitrariness of the choice, as bodily harm provides a constrained reality. Their debate cannot be resolved by more data alone because it is fundamentally about whether the Interpersonal Violence Rate captures a truth about the world or merely constructs a narrative about the state.
