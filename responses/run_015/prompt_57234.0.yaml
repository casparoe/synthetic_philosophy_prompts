  You're a constitutional theorist who has taught both the Westminster and the Japanese models, and I want you to act as a tough but fair auditor rather than a lecturer. Think carefully before you answer. No references, no reading list, no citations — I can't look anything up right now and I don't want one.

  A study group I'm in has asked everyone to write down their settled position on constitutional monarchy so the others can attack it. Before I hand mine in I want to know whether it hangs together, because honestly I don't know if any of these pull against each other and I'm not telling you which one I'd sacrifice.

  Here's the package:

  1. Legitimacy comes from the electorate. Any exercise of public power has to be traceable, directly or through ministers who answer to parliament, back to the people. An office that answers to nobody can't be legitmate when it actually decides something.

  2. The Crown should nonetheless keep real personal prerogative — the right to say no to a dissolution, to choose a PM where no one has a majority, and in extremis to withhold assent. Precisely *because* the monarch is unelected: no career to protect, no voters to lose, so they can absorb the blame in a constitutional stress test in a way a politician calculating re-election can't.

  3. Hereditary succession is fine for a head of state. A birth lottery is an acceptable way to fill a job that's mostly symbolism and ceremony — it's the fact that the office does nothing that makes the randomness harmless.

  4. Reigns but doesn't govern. No royal initiative in ordinary politics, and never publicly against the government of the day. I like the Japanese settlement on this: symbol of the state, no powers related to government, everything performed on the advice and approval of the cabinet, which takes responsibility.

  5. A case verdict. A PM who has just lost a confidence vote asks for a dissolution in order to stop the opposition forming a government, and there is plainly an alternative majority available. I think the head of state should refuse. Yes, it's a political act, and yes, they'd effectively be picking who governs. I'd still say refuse.

  6. Get rid of the remaining hereditary peers, and ideally move to an elected second chamber. People who vote on laws need a mandate. People who wear a crown don't.

  7. On openness, split verdicts: King's Consent and any palace lobbying of ministers should be disclosed and the Sovereign Grant fully audited by parliament; but the weekly audience with the PM should stay confidential permanently, and I don't think a monarch should be criticised for holding strong political views in private.

  What I want from you:

  - First, restate each of the seven in one neutral line each as the underlying principle that would generate it, so I can check you've actually got me and aren't auditing a strawman.
  - Then the audit proper. Which pairs genuinely conflict, and which only look like they conflict until you draw the right distinction? Don't flag everything as equally bad — I want them ranked by severity, worst first.
  - For each real conflict: what specifically has to give, what does giving it up cost me, and is there a revision that keeps most of what I care about?
  - Finally, tell me which single change to the package would clean up the most, and be honest if the answer is that my position is basically coherent and I'm inventing problems.

  Don't hedge and don't diplomatically call it all a matter of emphasis. Pick.

  Last line, exactly this format: Verdict: drop (#_) — <the cheapest fix, six words or fewer>
