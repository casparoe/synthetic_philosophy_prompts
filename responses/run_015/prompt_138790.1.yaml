prompt: |-
  I'm on the platform team at a company of about 200 engineers, and I own what we internally call the release evidence gate: before anything ships, whoever is shipping has to file a short note saying why we believe the thing works, and I'm the one who signs off (or gets yelled at) when it turns out we shouldn't have. The same argument keeps coming up and I want to stop having it from scratch every time: when does a tool's report about itself count as actual evidence that the tool is right? Concretely, most weeks we see some mix of — a linter that prints "0 violations", a coverage tool that says 96%, a static analyzer whose expected-results suite was generated by the previous version of itself, a self-hosting compiler that compiled itself and then passed its own test suite, and a cluster health check that reports "all green" while being the single most likely component to have silently died. My rule of thumb right now is "trust it unless someone can produce a case where it was wrong", but that just pushes the problem back to who has to produce what, and in practice it means whoever is loudest in the thread wins.

  A friend doing a philosophy PhD told me this is basically a known thing in epistemology — I think she called it the bootstrapping problem, or the problem of "easy knowledge" — and the toy version she gave me was that you can't check whether your eyesight works by using your eyesight to read a colour chart. She also said there's apparently a whole fight about whether that's really circular or whether it's fine as long as the source has some independent track record, and something about premise circularity versus rule circularity that I definately didn't follow. I don't need the literature and please don't give me citations or names to look up — I just want whatever the real distinctions are, translated into something my team can use, because none of us recieved any training in this and the compliance lead has to rubber-stamp whatever we adopt, so it can't contain any step that needs a philosophy degree to answer.

  So: write me a procedure. Ordered questions, what counts as a sufficient answer to each, the point at which the procedure just stops with a "no", and the point where it hands the decision to a human because the remaining question is about how much risk we're willing to accept rather than about evidence. It has to fit on one page, be runnable in ten minutes by a new grad on call at 2am, and be honest about which steps are really judgment calls wearing a checklist costume. Assume the failure modes I care about are ordinary bugs and silent failures, not an attacker deliberately lying to us — that's a different document we already have. Then run it on three of the cases above (pick the interesting ones, including at least one where the answer means I have to delete a check that people really like, and tell me how I'd argue for that in a meeting where they push back), and finish with a short section on what this procedure cannot tell us, no matter how carefully we fill it in.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Platform team lead at a ~200 engineer company. Owns the "release evidence gate."
      *   **Problem:** Recurring argument about when a tool's self-report counts as evidence (e.g., linter says 0 violations, coverage says 96%, self-hosting compiler, cluster health check). Current rule ("trust unless proven wrong") is failing (loudest voice wins).
      *   **Context:** Friend mentioned epistemology/bootstrapping problem/premise vs. rule circularity. User *explicitly* does not want citations, names, or academic jargon. They want a practical procedure.
      *   **Constraints:**
          *   One page (roughly).
          *   Runnable in 10 minutes by a new grad on call at 2am.
          *   Must distinguish between evidence questions and risk/judgment calls.
          *   Must be honest about where judgment is disguised as checklist items.
          *   Failure modes: Ordinary bugs/silent failures (not adversarial).
          *   **Deliverables:**
              1.  The Procedure (Ordered questions, pass/fail criteria, handoff point).
              2.  Application to 3 cases (including one controversial "delete this check" outcome + argumentation strategy).
              3.  Limitations section (what this procedure *cannot* tell us).

  2.  **Deconstruct the Epistemological Problem (for internal use, not output):**
      *   The core issue is *circular validation*. A tool validating itself provides weak evidence unless there's an external anchor.
      *   *Premise Circularity:* Using the conclusion as a premise (e.g., "The health check is green, therefore the health check is working").
      *   *Rule Circularity:* Using a rule to validate the rule (e.g., "The compiler compiled itself").
      *   *Solution:* Need *independent correlation* or *falsifiability*. Does the tool fail when things are actually broken? (Sensitivity/Specificity).
      *   *Translation:* Turn "Is this circular?" into "Can we break this on purpose?"

  3.  **Drafting the Procedure (The "One-Pager"):**
      *   *Goal:* Make it actionable. No philosophy terms.
      *   *Structure:* Input -> Filter Questions -> Decision -> Handoff.
      *   *Key Concept:* "The Break Test." If a tool claims everything is fine, can we show it a known broken thing and have it scream?
      *   *Tone:* Direct, imperative, slightly cynical but practical.
      *   *Sections:*
          1.  Source Independence (Who made the signal?)
          2.  Falsifiability (Does it know what 'bad' looks like?)
          3.  Correlation (Has it been wrong before?)
          4.  The Risk Handoff (When do we stop measuring and start guessing?)

      *   *Refining the Questions:*
          *   Q1: Is the reporter the same system being reported on? (If yes, high scrutiny).
          *   Q2: Can we inject a known fault and see it detected? (The "Fire Drill").
          *   Q3: Is there an external anchor? (e.g., user complaints, downstream errors).
          *   Q4: What is the cost of false positive vs. false negative?

      *   *Constraint Check:* Needs to fit on one page. Keep it tight.

  4.  **Selecting the Three Cases:**
      *   *Case 1: Linter (0 violations).* Easy pass, but needs nuance. It's a static check, usually deterministic.
      *   *Case 2: Self-hosting Compiler.* Classic bootstrapping. High risk of "it works on my machine" syndrome. Good candidate for "needs more evidence."
      *   *Case 3: Cluster Health Check ("All Green" while dead).* This is the killer. It's the "loudest voice" problem. This should be the one where the procedure says "Delete/Ignore this check."
      *   *Selection:* Linter (Baseline), Compiler (Nuanced), Health Check (The "Delete" candidate).

  5.  **Drafting the Case Applications:**
      *   *Linter:* Passes the "Break Test" easily (add a syntax error, it catches it). Low risk.
      *   *Compiler:* Fails independence. Needs external test suite (not self-generated).
      *   *Health Check:* Fails the "Break Test" (it says green when dead). This is the one to cut.
      *   *Argumentation:* How to argue for deleting a beloved check? Focus on "Signal-to-Noise" and "False Sense of Security." It's not that the check is *wrong*, it's that it's *useless* for the specific claim of "health."

  6.  **Drafting the Limitations:**
      *   What can't this solve?
      *   It can't predict unknown unknowns.
      *   It can't account for malicious actors (per prompt).
      *   It can't replace business risk tolerance (e.g., "We ship anyway because marketing needs it").
      *   It can't fix bad culture (if people lie on the form).

  7.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions Yes/No where possible. Define "Pass" clearly.
      *   *Critique:* Is the "Delete" argument too aggressive?
      *   *Fix:* Frame it as "Deprecate as Evidence" rather than "Delete the Tool." The tool might be useful for other things, just not for *release gating*.
      *   *Critique:* Did I avoid philosophy terms?
      *   *Fix:* Check for "epistemology," "circularity," "a priori." Replace with "loop," "self-check," "outside proof."
      *   *Formatting:* Use bolding and lists to ensure it looks like a runnable doc.

  8.  **Final Polish:**
      *   Ensure the tone matches a tired platform lead talking to another tired platform lead.
      *   Check the "2am new grad" constraint. Is it simple enough? Yes, if the questions are concrete.
      *   Check the "One Page" constraint. Keep the text dense but readable.

  **(Self-Correction during drafting the response):** I need to make sure I don't accidentally slip academic language back in when explaining the "why." The prompt asks for the procedure *and* the application. I will structure it as a document ready to be copied/pasted into their internal wiki, followed by the analysis.

  Let's refine the "Break Test." That's the core practical translation of "falsifiability." If I can't break it, I can't trust it when it says "I'm fine."

  Let's refine the "Handoff." The procedure needs to explicitly say "If you reach here, ask the Staff Engineer/Manager."

  Okay, ready to write.
answer: |-
  # The Evidence Gate Procedure (v1.0)

  **Goal:** Determine if a tool's report counts as evidence for release.
  **Operator:** On-call Engineer.
  **Timebox:** 10 Minutes.
  **Scope:** Ordinary bugs and silent failures (not security/adversarial).

  ### Phase 1: The Loop Check (2 Minutes)
  *Ask these questions about the tool generating the report.*

  1.  **Is the reporter the same system being checked?**
      *   *Yes:* (e.g., a service reporting its own health, a compiler testing itself). **Go to Phase 2.**
      *   *No:* (e.g., a linter checking app code, a CI runner checking build artifacts). **Skip to Phase 3.**
  2.  **Is there an external anchor?**
      *   Does a *different* system verify this report? (e.g., The compiler compiled itself, *but* a separate test suite ran against the binary).
      *   *Yes:* **Pass Phase 1.**
      *   *No:* **FAIL.** Stop. This report is circular. It cannot be used as primary evidence. (See *Case C* below).

  ### Phase 2: The Break Test (5 Minutes)
  *Ask this about the specific metric being reported.*

  3.  **Can we show it a known failure and have it detect it?**
      *   *Action:* Inject a known bug, latency spike, or violation into the scope.
      *   *Result:* Does the tool report "Red/Violation"?
      *   *Yes:* **Pass Phase 2.** (The tool has sensitivity).
      *   *No:* **FAIL.** Stop. If the tool says "Green" when you show it a broken thing, "Green" means nothing.
      *   *Unable to Test:* (e.g., Cannot inject failure in prod). **Go to Phase 3.**

  ### Phase 3: The Track Record (3 Minutes)
  *Ask this about the history of the tool.*

  4.  **Have we found a false negative in the last 90 days?**
      *   *Yes:* (The tool said "Pass" but production broke). **Handoff to Human.** (Requires risk acceptance).
      *   *No:* **Pass Phase 3.**

  ### Decision Matrix

  *   **All Pass:** Accept as Evidence.
  *   **Any Fail:** Reject as Evidence. (The tool may remain, but its output cannot sign off the release).
  *   **Handoff Trigger:** If Phase 3 is passed but Phase 2 was "Unable to Test," or if the cost of a False Negative is catastrophic (data loss, legal breach).
      *   *Action:* Escalate to Staff Engineer or Compliance Lead.
      *   *Question for Human:* "We cannot prove this tool detects failure, but we have no history of it missing one. Are we willing to bet the release on this?"

  ---

  # Application to Current Cases

  Here is how you run this procedure on three recurring arguments, including the one that will cause a fight.

  ### Case A: The Linter ("0 Violations")
  *   **Loop Check:** No. The linter is separate from the app code. (Pass)
  *   **Break Test:** Yes. Add a syntax error or forbidden pattern; linter catches it. (Pass)
  *   **Track Record:** Low false-negative rate on style/syntax. (Pass)
  *   **Verdict:** **Accept as Evidence.**
  *   **Note:** This is low-risk evidence. It proves the code conforms to rules, not that it works. It satisfies the "why we believe it works" note only for the "code quality" section, not functional correctness.

  ### Case B: The Self-Hosting Compiler
  *   **Loop Check:** Yes. The compiler is compiling itself.
  *   **External Anchor:** The prompt states the test suite was *generated by the previous version of itself*.
  *   **Verdict:** **FAIL Phase 1.**
  *   **Reasoning:** This is a closed loop. If Version N has a bug that silently corrupts binaries, Version N+1 will inherit that bug and generate tests that pass the corrupted binary.
  *   **Requirement:** To count as evidence, you need a "Golden Binary" test or a test suite written/verified by humans or a different compiler (e.g., GCC/Clang). Without that, this is not evidence; it is consistency.

  ### Case C: The Cluster Health Check ("All Green")
  *   **Loop Check:** Yes. The cluster is reporting on itself.
  *   **External Anchor:** No. It is the "single most likely component to have silently died."
  *   **Break Test:** **FAIL.** You noted it reports "Green" while dead. This means it failed the Break Test historically.
  *   **Verdict:** **REJECT as Evidence. Deprecate the check.**
  *   **The Fight:** People love this dashboard. It is green 99% of the time. Deleting it feels like removing visibility.
  *   **How to Argue for Deletion in the Meeting:**
      1.  **Do not say:** "This check is useless."
      2.  **Say:** "This check is a *silent risk amplifier*."
      3.  **The Argument:** "A check that says 'Green' when the system is dead is worse than no check at all. No check forces us to look for other signals (latency, errors). This check tells us to stop looking. Under the Evidence Gate Procedure, a tool that cannot distinguish 'Healthy' from 'Dead' is not a measurement tool; it is a decoration. We are not deleting the dashboard, we are removing its authority to sign off on releases. If it cannot fail, it cannot pass."
      4.  **The Compromise:** "Keep the dashboard for debugging, but require an *external* heartbeat (e.g., synthetic transaction from a different region) to count as release evidence."

  ---

  # What This Procedure Cannot Tell You

  1.  **Unknown Unknowns:** This procedure validates that a tool *can* detect errors it knows about. It cannot tell you if the tool is blind to a *new* class of error. A linter passes the Break Test for syntax, but it will never tell you your logic is wrong.
  2.  **Business Risk:** This procedure determines if evidence is *valid*, not if it is *sufficient*. You can have perfect evidence that a feature works, but if the feature violates a contract or angers users, this checklist says "Pass" while the business says "Stop." That handoff point is intentional; this doc does not make business decisions.
  3.  **Cultural Honesty:** If an engineer lies on the "release note" or tweaks the test to pass the Break Test artificially, this procedure assumes good faith. It validates the *tool*, not the *operator*.
  4.  **The "Good Enough" Threshold:** This procedure stops at the "Handoff Trigger." It explicitly refuses to answer "How safe is safe enough?" That is a liability question, not an engineering one. If the Staff Engineer says "Ship it," this procedure has done its job, even if the ship sinks.
