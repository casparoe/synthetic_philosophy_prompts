  This hits your edge case hard. Theory A (right mechanism, wrong numbers) captures the ontology—the actual gears of the world—but misses the scale. Theory B (wrong mechanism, right numbers) saves the phenomena but lies about the machinery. Standard accounts struggle here because they lack a unified metric for weighing structural fidelity against empirical precision. If verisimilitude measures correspondence to reality, A feels deeper; if it measures predictive utility, B wins. The conceptual split reveals that "truthlikeness" conflates two different goals: describing what exists versus predicting what happens. Without knowing the truth beforehand, we can't penalize B's fictional mechanism or reward A's structural insight, leaving us unable to say which is genuinely closer to the way the world *is* rather than just how it *looks*.
