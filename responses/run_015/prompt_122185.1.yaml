answer: |-
  Good morning. Welcome to all of you.

  Looking around this room, I see a tension that is usually kept behind closed doors. On one side, we have colleagues who have spent years arguing that "Western values" is a philosophical mirage—a category so leaky, so historically contingent, that using it seriously feels like intellectual negligence. On the other side, we have colleagues who draft speeches, negotiate treaties, and design frameworks where "Western values" is the bedrock. For you, it is not a problem to be solved; it is a tool used to get things done.

  Usually, these two groups talk past each other. The philosophers say the concept is incoherent. The policy staff say the concept is indispensable. If we spend the next two days rehashing that stalemate, we will have wasted our time.

  So, I want to propose we stop asking whether "Western values" are real. Instead, I want us to look at what the phrase *does*. I want to focus on a specific rhetorical maneuver that happens every time this phrase is invoked. Let's call it **value-ventriloquism**.

  We know how ventriloquism works. A performer throws their voice into a dummy. The dummy appears to speak on its own, but the authority and the intent belong to the ventriloquist. In political rhetoric, "The West" is often the dummy. It is an imaginary collective, a singular agent that we pretend has a voice. When a speaker says, "The West believes in free speech," or "Western values demand intervention," they are engaging in value-ventriloquism. They are projecting their own specific, contested commitments onto a phantom collective, lending those commitments the weight of history and geography.

  This isn't necessarily lying. It is a structural move. And if we look closely, we can see this single trick doing three distinct jobs simultaneously. Understanding these three jobs is where our work begins.

  The first job is **describing a heritage**. When we invoke Western values, we are often trying to stabilize the past. We take a messy, contradictory history full of empire, enlightenment, revolution, and reaction, and we flatten it into a lineage. We turn a complex genealogy into a smooth inheritance. For the policy staff, this provides stability. It anchors a current decision in a deep past, making a new policy look like the natural evolution of an old tradition. For the philosophers, this is where the alarm bells ring, because you know that lineage is constructed. But if we look at this rhetorically, we see that the goal isn't historical accuracy; it's historical authority. The ventriloquist isn't trying to teach history; they are trying to borrow its gravity.

  The second job is **prescribing a norm**. This is where the move shifts from what *was* to what *must be*. Value-ventriloquism smuggles an "ought" inside an "is." By claiming that "The West values democracy," the speaker is not just describing a preference; they are issuing a command. They are saying, "If you belong here, you must align with this." It transforms a political preference into a condition of membership. This is incredibly efficient for policy-making. It bypasses the need to argue for a value on its own merits by claiming the value is already owned by the community. But it also creates a trap. If the value is owned by the community, then criticizing the value looks like betraying the community.

  This leads us to the third job, which is perhaps the most potent: **drawing an exclusionary boundary**. Every time we define what the West *is*, we are implicitly defining what it *is not*. Value-ventriloquism polices the border. It decides who is inside the tent and who is outside. When a leader says a certain action is "un-Western," they are not making a geographical claim; they are making a moral excommunication. This is where the concept does its heaviest lifting. It turns political disagreement into cultural alienation. For the policy staff, this is a tool for coalition building; it clarifies allies and adversaries. For the philosophers, this is where the concept becomes dangerous, because it essentializes identity and shuts down debate.

  So, why does this matter for this workshop?

  To my colleagues in policy: I am not asking you to stop using the phrase. I know it works. But I am asking you to recognize that when you use it, you are not standing on solid ground. You are wielding a tool that constructs the ground beneath you. You are using an empty signifier—a container that can be filled with whatever content suits the moment—and treating it as if it were solid stone. Recognizing this doesn't weaken your position; it sharpens your awareness of the power you are wielding. It allows you to see when you are persuading people with arguments, and when you are persuading them with identity.

  To my colleagues in philosophy: I am not asking you to stop skepticism. But I am asking you to look beyond the truth-value of the claim. Whether "Western values" exist is less interesting than *why* people need them to exist. When you treat the concept only as an error to be corrected, you miss the work it is doing. Conceptual history isn't just about tracing where words come from; it's about tracing what work they perform in the room. If you can show us how the ventriloquism works, you help us see the machinery of power, not just the shadow on the wall.

  Over the next two days, we have a chance to bridge this gap. We can stop arguing about whether the dummy is real and start analyzing the ventriloquist. We can look at how heritage is manufactured, how norms are smuggled in, and how boundaries are policed.

  If we can do that, we might leave here with something more useful than a definition. We might leave with a map of how political language builds reality. Let's get to work.

  Thank you.
