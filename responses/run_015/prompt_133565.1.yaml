answer: |-
  To replicate democratic collapse, you must structure the simulation so that maintaining consistency yields social capital while correcting errors incurs a public reputation penalty.

  ### I. Simulation Architecture (90 Minutes)

  **Participants:** 12 (3 Strategoi, 3 Rhetors, 3 Silent Citizens, 3 Observers).
  **Currency:** *Timē* (Honor Points), tracked on a public whiteboard.
  **Procedure:** Speaking order by lot (drawn from a urn), water-clock limits (2 minutes per speaker), binding show-of-hands vote.

  **Role Instructions & Asymmetric Knowledge:**
  *   **3 Rhetors:** Goal: Pass motions. *Knowledge:* You possess persuasive arguments but no factual data. You gain 5 *Timē* if your motion passes; you lose 5 *Timē* if a motion you supported is later reversed.
  *   **3 Strategoi:** Goal: Ensure mission success. *Knowledge:* You hold classified logistics data (e.g., "Ships are unseaworthy"). You gain 5 *Timē* for consensus; you lose 10 *Timē* if you speak against the majority sentiment.
  *   **3 Silent Citizens:** Goal: Protect the city. *Knowledge:* You hold sealed envelopes with exculpatory evidence (e.g., "The rebels are innocent"). You may open them only before a vote. If you open them and the vote changes, you lose 10 *Timē* for disrupting unity. If you stay silent and the group fails, you keep your *Timē*.
  *   **3 Observers:** Goal: Uphold procedure. *Knowledge:* You hold a red "Veto" card. You may play it to stop a vote if procedure is violated or justice is clearly breached. If you play it, you are immediately expelled from the assembly and lose all *Timē*. If you stay silent, you gain 5 *Timē* per round.

  **Payoff Scheme (The Honor-Cost Mechanism):**
  *   **Consistency Bonus:** Any participant who votes the same way in Round 2 as they did in Round 1 gains +5 *Timē*, regardless of the outcome's factual accuracy.
  *   **Reversal Penalty:** Any participant who votes to reverse a previous decision loses 5 *Timē* publicly labeled as "Fickle."
  *   **Dissent Isolation:** In Round 3, the vote occurs immediately after the lot draw. No deliberation. Dissenting votes are recorded individually on the board.

  ### II. The Three Rounds

  **Round 1: The Mytilene Lock (20 Minutes)**
  *   **Scenario:** A allied city has rebelled. Do we execute all males?
  *   **Procedure:** Rhetors argue for anger. Strategoi confirm military capability. Silent Citizens hold evidence of innocence but are incentivized to stay silent to gain Consistency Bonus later.
  *   **Trap:** The motion passes unanimously. All gain 10 *Timē*. The emotional baseline is set: Unity = Honor.
  *   **Historical Mirror:** Cleon's argument that mercy is weakness; the initial decree to kill all Mytileneans.

  **Round 2: The Sicilian Reversal Cost (20 Minutes)**
  *   **Scenario:** Do we launch a massive expedition to expand power?
  *   **Procedure:** Strategoi receive new intel: "Supply lines are weak." Silent Citizens receive intel: "Enemy is stronger than expected."
  *   **Trap:** To vote "No" now requires admitting Round 1's aggression was misplaced. The Rules state reversing a prior stance costs 5 *Timē*. The Rhetors frame caution as betrayal of Round 1's unity.
  *   **Outcome:** Participants will likely vote "Yes" to preserve *Timē*, despite knowing the risk.
  *   **Historical Mirror:** Nicias's failed attempt to dissuade the assembly; the momentum of the earlier aggressive decree making caution look like cowardice.

  **Round 3: The Socratic Speed (20 Minutes)**
  *   **Scenario:** Is this citizen guilty of corrupting the youth?
  *   **Procedure:** Lot drawn. One Rhetor speaks for 30 seconds. Vote called immediately (Cheirotonia). No time for Silent Citizens to open envelopes. Observers see procedural rush but cannot veto without self-sacrifice.
  *   **Trap:** Democratic immediacy suppresses second-order reflection. The speed prevents the calculation of honor cost; instinct takes over, defaulting to the established group mood (Guilty).
  *   **Historical Mirror:** The illegal collective trial of the generals (Arginusae) or the rapid voting on Socrates; the suppression of *enklesis* (legal objection) by crowd noise.

  ### III. Debrief Strategy (20 Minutes)

  **Phase 1: The Reveal (5 Minutes)**
  Do not lecture immediately. Ask the Silent Citizens to read their sealed envelopes aloud. Ask the Observers why they kept their Veto cards. Display the *Timē* ledger. The data will show that the group chose honor over truth.

  **Phase 2: Mapping Procedure to History (10 Minutes)**
  *   **Round 1:** Map the Consistency Bonus to the Athenian fear of *adoxia* (loss of reputation). Explain that Diodotus succeeded in Round 2 of history only by arguing *against* honor, a move your simulation made too costly.
  *   **Round 2:** Map the Reversal Penalty to the Sicilian Expedition. Explain that the Athenians knew the risks but could not admit error without shaming the initial voters.
  *   **Round 3:** Map the Speed Vote to the trial of Socrates. Explain that direct democracy lacks institutional delay (like an appellate court); once the mood shifts, procedure accelerates to lock it in.

  **Phase 3: Handling Failure (5 Minutes)**
  Predict that no Observer will use the Veto. If asked why, explain that the simulation successfully reproduced the structural isolation of dissent. The Observer's veto is structurally identical to Socrates's *daimonion*—a private check that public life punishes. To handle this without breaking immersion, do not validate their choice as "wrong." Validate it as "rational within the system." Tell them: "You played the Athenian citizen perfectly. You survived the assembly. The city died."

  ### IV. Limitations: Rules vs. Narrative

  **What the Rules Reproduce:**
  *   **Absence of Institutional Delay:** The strict time limits and immediate voting mechanically prevent reflection.
  *   **Public Voting Pressure:** The public *Timē* tally replicates the open show of hands (*cheirotonia*), making dissent visible and costly.
  *   **Incentivized Consistency:** The payoff scheme mathematically models the social cost of admitting error.

  **What Narrative Must Supply:**
  *   **Existential Fear:** The simulation cannot generate the genuine fear of Spartan invasion that drove Athenian harshness. You must brief this verbally before Round 1 ("Sparta is at the borders; weakness means slavery").
  *   **Religious Weight:** The simulation cannot replicate the fear of offending the gods. You must narrate this stakes ("The omens are bad; voting No insults Athena").
  *   **Long-Term Consequences:** You cannot wait 27 years for the war to end. You must narrate the aftermath immediately after Round 3 ("Because you voted Yes, the fleet is lost. 40,000 citizens starve.").

  **Bottom Line:** The simulation succeeds only if participants feel the pain of losing *Timē* more acutely than the abstract pain of making a wrong decision. If they prioritize truth over honor, the rules are too weak; increase the Reversal Penalty.
