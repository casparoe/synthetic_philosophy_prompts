  4.  **Develop Charitable Readings (Preserving the Gap):**
      *   *Reading 1: The Logic of Contingency.* For Leibniz, contingent truths (like "God creates this world") are not demonstrable *a priori* in a finite number of steps. They require an infinite analysis. Metaphysical necessities (math/logic) are finitely demonstrable. Thus, the *mode of knowing* differs, reflecting a modal difference.
      *   *Reading 2: The Nature of the Will.* Metaphysical necessity bypasses the will (like a triangle having 3 sides). Moral necessity operates *through* the will (inclining without necessitating). The "inclining without necessitating" (*inclinat sine necessitat*) slogan is crucial.
