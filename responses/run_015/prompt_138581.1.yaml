answer: |-
  Here is the briefing package for the session. I've structured the questions to tighten the dialectical noose around the two defensive moves you identified, moving from conceptual coherence to metaphysical grounding.

  ### Opening Strategy & Commitments

  **Lead with Questions 1 and 2.**
  *   **Why:** Question 1 (Release) immediately operationalizes her core "second-personal authority" claim without getting bogged down in empirical preliminaries. It forces her to define the *structure* of the normativity before she defends its *source*. Question 2 (The Gap) follows up on the *function* of that normativity. Together, they establish that if the power doesn't change the normative landscape in a specific way, the "primitive power" label is merely decorative. This sets a high bar for the subsequent empirical claims.

  **Most Likely to Generate New Material:**
  *   **Question 6 (Scope Limits).** This is where she usually retreats to "conditions of exercise." By framing the question to ask why a *primitive* power is sensitive to *content* (immorality/impossibility) rather than just *context*, you force her to explain the metaphysics of the power itself. If the power is primitive, its limits should be formal; if its limits are moral, the power is derivative. She will have to choose, and that choice isn't fully worked out in the manuscript.

  **Where the Framework is Weakest:**
  *   **The Pre-Conventional Argument (Question 8).**
  *   **Confidence:** High (85%).
  *   **Reasoning:** The inference from "children feel bound" to "there exists a mind-independent normative power" is the thinnest part of the view. It conflates the phenomenology of obligation with its ontology. Even if children universally feel bound, that could equally support an error theory (we are hardwired to feel bound by conventions we mistakenly treat as natural) or a constructivist view (we build the normativity out of the feeling). Her claim that the feeling *tracks* a primitive power requires a realist metaphysics she hasn't fully defended against the constructivist alternative.
  *   **Lower Confidence Area:** I am less sure (60%) about how damaging the "Indifferent Promisee" cases (Question 4) will be. She may have a robust enough formal account of authority that it doesn't require the promisee's actual interest to exist, only their status as a person. If she bites that bullet, the view survives, though it becomes less intuitive.

  ***

  ### The Questions (45-Minute Sequence)

  **1. The Asymmetry of Release**
  Your view hinges on the promisee holding authority over the promisor. But consider the asymmetry: I cannot release myself from a promise, yet you can release me. If the obligation is generated by *my* exercise of a normative power, why is the power to extinguish it lodged exclusively with *you*? Is this asymmetry evidence that the power isn't mine to begin with, but rather a transfer of sovereignty?
  *   **Follow-up:** [Guess: She'll say the power is essentially second-personal, so only the addressee holds the correlate authority.] If it's essentially second-personal, does that mean the promisor lacks standing to evaluate the promise's validity at all, or only standing to cancel it?

  **2. The Normative Gap**
  You argue promising creates an obligation where there wasn't one. But often I promise to do something I already had a moral reason to do. Does your view explain the *gap* between the prior moral reason and the new promissory obligation, or does it just rename the prior reason? Specifically, does the promise add *weight* to the reason, or does it change the *kind* of reason?
  *   **Follow-up:** [Guess: She'll say it changes the kind—it becomes owed *to her*.] If it's the same act with the same outcome, but now "owed," what practical difference does that make if the promisee doesn't care about being owed it?

  **3. Redundant Promises**
  Following on that: If I promise to do what I already strictly ought to do (e.g., not hurt you), do I generate a second, content-independent obligation? If yes, don't we have an odd duplication of duties? If no, doesn't that suggest the "power" is actually parasitic on the underlying moral landscape rather than primitive?
  *   **Follow-up:** [Guess: She'll say the duty is duplicated but the *ground* is different.] If the ground is different but the content and force are identical, is the "primitive power" doing any explanatory work, or is it just a metaphysical shadow?

  **4. The Indifferent Promisee**
  Consider the "stranger on the train" case: I blurt out a promise to you, you have no interest in the performance, and you'd rather I hadn't promised. On your view, do I still owe you? If yes, where is the "authority" you hold over me if you don't want it? If no, doesn't that make the power dependent on the promisee's psychological state rather than a normative primitive?
  *   **Follow-up:** [Guess: She'll say authority is formal, not dependent on interest.] If authority is purely formal, doesn't that detach the "wronging" of the promisee from any actual harm or setback to them, making the "wrong" purely symbolic?

  **5. Promises to Collectives**
  You focus on dyadic promises. But if I promise a group (e.g., "I promise the committee"), who holds the authority to release me? If it's the group, how do they exercise this primitive power without unanimous consent? If it's a representative, does that turn the normative power into a conventional proxy?
  *   **Follow-up:** [Guess: She'll say the group acts as a plural subject.] If the group dissolves before I perform, does the obligation vanish? If yes, doesn't that show the obligation depends on the social entity's existence, undermining the "pre-conventional" claim?

  **6. Scope Limits (Targeting Move B)**
  Let's talk about invalid promises: coerced, impossible, or immoral. You might say these are just "conditions of exercise." But if the power is primitive, why is it sensitive to *moral content*? Why can't I exercise a primitive power to bind myself to do something immoral, even if I shouldn't do it?
  *   **Follow-up:** [Guess: She'll say morality sets the boundaries of valid exercise.] If morality sets the boundaries, isn't the normativity coming from morality, not the power? Please explain how the power isn't just a mechanism for transmitting prior moral constraints. **(Note: Press here if she tries to deflect to "conditions.")**

  **7. Promises to Non-Understanders**
  Can I promise a comatose patient I will care for their estate? There is no second-personal address possible, no uptake. If your view requires a second-personal exchange, this fails. If it doesn't, what work is "second-personal" doing in the theory?
  *   **Follow-up:** [Guess: She'll say potential uptake or prior relationship suffices.] If potential uptake suffices, doesn't that collapse the distinction between promising and merely undertaking an obligation unilaterally?

  **8. The Pre-Conventional Argument (Targeting Move A)**
  You argue children's sensitivity to promising shows the power is antecedent to convention. But even granting the data, why think this reveals a *normative* power rather than a psychological disposition to *feel* bound? How do you move from "we are wired to feel obligation" to "there is a mind-independent normative power"?
  *   **Follow-up:** [Guess: She'll say the capacity tracks the reality of the power.] Isn't this an inference to the best explanation that ignores the simpler explanation: we are wired to enforce social cohesion, and we project normativity onto it?

  **9. The Source of the Power**
  When pressed on where this power comes from, the view risks saying "explanation stops here." But if it's a power to change normative relations, doesn't it require a ground? Is the ground the value of autonomy, the value of trust, or something else? If it's value-based, isn't the view consequentialist at the foundation?
  *   **Follow-up:** [Guess: She'll say it's constitutive of agency.] If it's constitutive of agency, can non-agents (or diminished agents) not promise? Does that mean children's promises are literally normatively inert until they reach a threshold?

  **10. Falsification**
  Finally, what would make you abandon the framework? Is there a piece of empirical evidence regarding child development, or a conceptual case regarding invalidity, that would convince you the "primitive power" model is wrong?
  *   **Follow-up:** [Guess: She'll say if children showed no sensitivity to promising.] If children showed no sensitivity, would you abandon the view, or would you just say the power is there but dormant? If the latter, is the view empirically unfalsifiable?

  ***

  ### Chair's Note on Flow
  *   **Minutes 0-15:** Questions 1-3. Establish the conceptual stakes.
  *   **Minutes 15-30:** Questions 4-7. Test the edges and block the "conditions of exercise" move.
  *   **Minutes 30-40:** Questions 8-9. Press the metaphysical foundation and block the "brute fact" move.
  *   **Minutes 40-45:** Question 10. Close the session.

  If she begins to drift into abstraction during Q6 or Q9, use the follow-ups to demand a concrete example. If she tries to defer to the "critics" to answer these, remind her this is the author's chance to clarify the record before they speak.
