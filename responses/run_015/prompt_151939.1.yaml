answer: |-
  This is a fantastic setup. You are essentially asking me to reverse-engineer your friend's philosophical "source code" based on her previous commit history (verdicts) and predict how she'll handle a new edge case (AI art).

  Given her track record, she is operating firmly within a **Humean framework** (specifically David Hume's *Of the Standard of Taste*), but with a specific interpretation of who counts as a "True Judge."

  Here is the breakdown of her likely verdict, the rule she is running, and how to test it.

  ### 1. The Prediction: What will she say?
  **Verdict:** She will likely side with the critics who call the AI portrait **"hollow."**

  She will argue that while the image creates a superficial sensory pleasure (like the pop song), it lacks the *aesthetic merit* required for genuine beauty because it fails the contextual norms of what a portrait *is*. She will likely claim the critics who are "moved" are suffering from a lack of comparison or are prejudiced by the novelty, similar to the pop song fans.

  ### 2. The Underlying Rule
  She is not running a simple "Expert Agreement" rule, because in the AI case, the experts are split. She is running a more complex function we can call:

  **`The Contextualized True Judge Standard`**

  This rule states: *An object is beautiful if it sustains the approval of qualified critics who are operating with full knowledge of the work's origin, context, and norms, over a sustained period of time.*

  Here is how this rule maps to her previous verdicts:

  *   **Critic vs. Random Person:** The critic is the "qualified judge." The random person lacks the "practice" and "comparison" Hume says is necessary. **(Rule Fit: High)**
  *   **Disagreeing Critics:** Objectivity isn't dead; it means one critic is failing the "qualified" condition (biased or hasn't looked long enough). The ideal condition yields agreement. **(Rule Fit: High)**
  *   **Pop Song vs. Critics:** Mass appeal is irrelevant. The "qualified judges" (critics) determine the standard, not the volume of users (millions of listeners). **(Rule Fit: High)**
  *   **Distant Culture:** You cannot be a "qualified judge" without understanding the specific context/norms of the work. Judging by local norms is a "prejudice" that disqualifies the judgment. **(Rule Fit: High)**
  *   **Durability (Time):** True beauty survives scrutiny. If it fades or feels hollow upon deeper study (knowing it's AI), it was never genuinely beautiful. **(Rule Fit: High)**

  ### 3. The Closest Analog
  The closest analog in her history is **Case 2: The Two Disagreeing Critics.**

  *   **Why:** In the AI scenario, you have a split among critics (some say beautiful, some say hollow). In Case 2, she established that expert disagreement doesn't prove subjectivity; it proves one expert is operating under non-ideal conditions (bias or lack of attention).
  *   **Application:** She will treat the "hollow" critics as the ones operating under ideal conditions (they understand the norm of human intention in art) and the "beautiful" critics as the ones who are "biased" (perhaps by the technical perfection) or "haven't looked long enough" (they haven't let the lack of soul sink in).

  ### 4. The "Unit Test" to Split the Rules
  To truly debug her logic, you need a test case that separates **Human Intention** from **Expert Effect**.

  Currently, her rules conflate "what experts feel" with "what the object is." In the AI case, the experts who like it feel good, but the object lacks intention. The experts who dislike it feel bad *because* of the lack of intention.

  **The Test Case: The Perfect Forgery**
  Ask her this:

  > "Imagine a painting is discovered that is visually indistinguishable from a masterpiece by Vermeer. Art critics study it for years, are deeply moved by it, and write papers on its genius. Then, carbon dating proves it was painted last week by a forger who intended only to deceive, not to express anything.
  >
  > **Does the painting become less beautiful the moment we learn it's a forgery?**"

  **Why this splits the rules:**

  1.  **If she says "Yes, it becomes less beautiful":**
      *   **Her Rule is:** *Human Intention/Provenance is a necessary condition for beauty.*
      *   **Implication for AI:** She definitely thinks AI art is inferior because it lacks a human mind behind it. The "hollowness" is a real defect in the object, not just in the viewer's head.
      *   **Philosophical Camp:** This leans away from pure Hume (who focused on sentiment) toward **Institutional Theory** or **Expression Theory**.

  2.  **If she says "No, the beauty remains the same":**
      *   **Her Rule is:** *Refined Feeling is the only thing that matters.*
      *   **Implication for AI:** She should logically admit that if the AI image moves a qualified critic, it *is* beautiful, regardless of the algorithm. If she still hates the AI art, she is being inconsistent (or prejudiced against tech).
      *   **Philosophical Camp:** This is **Pure Humean Sentimentalism**.

  3.  **If she says "It was never beautiful, even before we knew":**
      *   **Her Rule is:** *Truth/Authenticity is a hidden variable in the object.*
      *   **Implication:** She believes beauty is a property of the *history* of the object, not just its current appearance.

  **Recommendation:**
  Start with the **Forgery** question. It isolates the "Human Intention" variable while keeping the "Visual Quality" and "Expert Approval" variables constant. It will force her to reveal whether she values the *experience* of beauty or the *source* of beauty more.
