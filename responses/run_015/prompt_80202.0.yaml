      *   Better: We use the predicate "is red" to classify apples. Therefore "The apple is red" is true iff someone classifies it? No.
      *   The deflationist says the *content* of "S is true" is exhausted by S. The *reason we have the predicate* is logical generalization (Quine) or endorsement (Strawson). But the *truth of the claim* depends on S, not on the endorsement.

  6.  **Final Polish:**
