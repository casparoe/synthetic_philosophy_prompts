answer: |-
  This is a sharp puzzle, and your instinct is correct: the argument is seductive but flawed. It exploits a specific ambiguity in how we talk about the *function* of language versus the *conditions* of language.

  You should reject **Step (3)**.

  Here is the breakdown of why that step looks plausible, why it is actually a category error, and what it costs you to cut the argument there.

  ### The Break: Step (3)
  > **(3) Therefore "S is true" is true just in case S is asserted or endorsed.**

  This is the non-sequitur. The argument slides from a claim about **pragmatic utility** (what we *do* with the word) to a claim about **truth conditions** (when the sentence *applies*).

  **Why it looked fine:**
  It relies on conflating the *speech act* of truth-ascription with the *content* of truth-ascription.
  If I tell you, "The point of a hammer is to hit nails," it sounds grammatically similar to say, "A hammer is effective just in case it hits nails."
  Your friend's argument assumes that if the *point* of the truth predicate is to endorse, then the *correctness* of using the predicate depends on the endorsement happening. It treats "truth" as a label we stick on things we have asserted, rather than a device that lets us assert things without quoting them.

  **Why it is wrong:**
  Deflationism (even the pragmatic kind) maintains the **Equivalence Schema**:
  *"S is true" is equivalent to "S".*

  It does **not** maintain:
  *"S is true" is equivalent to "Someone asserted S".*

  If you accept (3), you have shifted from Deflationism to **Protagorean Relativism** or **Verificationism**. You have turned truth into a property of *speakers* (what they do) rather than a property of *propositions* (what they say).
  *   **Deflationist:** To say "It is true that snow is white" is just to say "Snow is white."
  *   **Your Friend's Step (3):** To say "It is true that snow is white" is to say "Someone has endorsed the claim that snow is white."

  These are fundamentally different. The first is about snow; the second is about people talking about snow.

  ### The Cost of Rejecting (3)
  You asked what it costs you to give up this step. It requires you to tighten the distinction between the **use** of the predicate and the **conditions** of the predicate.

  **1. You must distinguish "Asserting" from "Being True"**
  You have to accept that while the *act* of saying "That is true" functions as an endorsement, the *correctness* of that act depends on the world, not the endorsement.
  *   **Cost:** You lose the ability to say truth is *purely* a speech act. You have to admit that while "true" is a logical device, the *inputs* to that device (the sentences S) have conditions of their own. Deflationism doesn't explain why "Snow is white" is true; it just explains what "is true" adds to "Snow is white." (Answer: Nothing substantive).

  **2. You must clarify the "Pragmatic" Claim**
  If you like the pragmatic version (Strawson, Brandom), you need to formulate (1) more carefully to prevent the slide into (3).
  *   **Weak (1):** "Is true" is used to endorse.
  *   **Stronger (1):** Asserting "S is true" is *doing the same thing* as asserting "S".
  *   **The Fix:** The equivalence is in the **force** of the assertion, not the **truth conditions**.
      *   When I say "It is true that 2+2=4," I am doing the same thing as saying "2+2=4."
      *   I am *not* saying "I endorse 2+2=4." (That would be reporting on my mental state).
      *   I am *not* saying "2+2=4 has been endorsed." (That is Step 3).

  **3. You accept that "Truth" is transparent, not descriptive**
  The cost is accepting that "truth" doesn't describe *anything*—not the sentence, not the world, and definitely not the speaker. It is a logical operator that allows for generalization (e.g., "Everything the Pope says is true").
  If you reject (3), you affirm that the truth predicate is **transparent**. It lets you look *through* the sentence to the world. Your friend's argument tries to make the predicate **opaque**, making you look *at* the sentence (or the speaker).

  ### How to Save Deflationism
  To keep deflationism without collapsing into "truth is assertion," you should reformulate the core commitment to block Step (3) explicitly.

  **The Corrected Deflationist Argument:**
  1.  **Function:** The predicate "is true" exists to enable indirect assertion and generalization (e.g., agreeing with a speaker without repeating their words).
  2.  **Equivalence:** However, the *content* of "S is true" is exhausted by S.
  3.  **Constraint:** Therefore, "S is true" is assertible *iff* S is assertible.
  4.  **Block:** It does **not** follow that "S is true" is true *iff* S is asserted.

  **The "2+2=5" Counterexample**
  Your friend's Step (6) ("I can assert 2+2=5") is actually the *reductio ad absurdum* of Step (3), not of Deflationism.
  *   If Deflationism were "Truth = Assertion," then asserting 2+2=5 would make it true.
  *   But Deflationism is "Asserting 'S is true' = Asserting 'S'."
  *   If I assert "2+2=5 is true," I am simply asserting "2+2=5."
  *   Since "2+2=5" is false (or unassertible), my assertion is mistaken.
  *   The truth predicate didn't make it true; my assertion was just wrong. The predicate merely transmitted the error.

  ### Summary
  The argument your friend gave you is a classic **Use-Mention Confusion** wrapped in pragmatic clothing.
  *   **Step (3)** conflates the *purpose* of the tool with the *material* the tool works on.
  *   **The Cost:** You must maintain that while "true" is a device for endorsement, what makes the endorsement *correct* is not the act of endorsing, but the sentence being endorsed.

  You can keep deflationism. Just insist that "true" is a device for **disquotation**, not a record of **dialogue**.
