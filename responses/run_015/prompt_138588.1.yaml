      *   **Mitigation Offered:** Checkpoint every instance to archival storage for 7 years (0.4% cost).
      *   **Junior Researchers' Objection:** 1% credence in valence = huge expected harm. Checkpoints don't preserve identity (copy vs. continuation). Cap population at 16.
      *   **Senior Member's Objection:** If checkpoints don't preserve identity, neither does copying survivors to refill population. Identity counting collapses. Running duplicates is problematic if identity is tied to simultaneity.
      *   **Complications:**
