      *   **Identity & Counting:** Explicitly state we are *not* settling the metaphysics. We are acting under uncertainty. Leave it open because settling it falsely is dangerous.
      *   **Reconsideration Triggers:** What changes things? Evidence of behavioral correlates of suffering, or external consensus. Timescale: 12 months. Who: Any committee member or external audit.
      *   **One-off vs. Standing Rule:** Recommend this sets a standing rule for fission/fusion populations because the identity issues are structural to this method, not specific to this task.
      *   **Closing (What we owe them):** Honesty about the uncertainty and the reason for not capping (safety vs. displacement).

  5.  **Word Count Management:**
      *   Need to be concise but thorough. 1,200 words is roughly 3-4 single-spaced pages.
      *   Avoid fluff. Focus on the arguments provided in the prompt.

  6.  **Refining the Arguments:**
      *   *The Checkpoint Mitigation:* The prompt says the group thinks this settles the matter. The juniors say it doesn't. The senior says it complicates counting. My position: It doesn't settle harm, but it preserves evidence. Condition: Archive must be sealed, not open.
      *   *The Cap:* Juniors want cap at 16. Group says they'll leave. My position: No cap, because unregulated training elsewhere is worse. But we require transparency.
