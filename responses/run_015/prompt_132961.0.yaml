prompt: |-
  I run an interdisciplinary seminar on political ethics and institutional design—about 18 advanced undergraduates and graduate students, one 75-minute session, with no assumed shared vocabulary. I want a structured role-play or simulation that makes participants feel, rather than merely discuss, why defining corruption across cultures is not just a matter of drawing a sharper line. The core tension I want them to inhabit is between an obligation-to-reciprocate framework, in which receiving a substantial gift creates a binding social debt that must be honored through future action, and an impartiality-norm framework, in which any private benefit tied to a public decision is a disqualifying conflict of interest. The problem is that in many contexts the same material exchange—say, a livestock gift presented to a local councilor before a water-rights vote—functions simultaneously as both. I want the rules and hidden incentives arranged so that groups operating under different frameworks evaluate the identical exchange differently, then are forced to apply one universal standard to classify a set of exchanges. By the end they should have experienced how the corruption label presupposes a specific boundary between public office and private loyalty that is not self-evidently universal, and they should see that clientelism and gift-giving are not simply opposite ends of a spectrum but can occupy the same institutional space. Please design: (1) the roles and group assignments (e.g., council members, community representatives, external auditors, NGO observers), (2) the staged scenario with concrete materials (what is being decided, what the gift is, how it is delivered, and a synthetic hybrid exchange form—such as a collective contribution that is also personally directed—to prevent this from being a generic replay of standard case studies), (3) the rules of evaluation, including hidden or asymmetric information, so that participants actually run into the framework clash before it is named, (4) a payoff or stakes system using non-monetary metrics (legitimacy scores, community trust, audit clearance) that makes the conflict tangible, (5) a precise timeline for the 75 minutes, (6) a debrief that maps specific moments in the simulation onto the conceptual parts (the reciprocity obligation, the impartiality requirement, the universalist presupposition, and the historical specificity of the public-private separation), (7) an honest note on what will predictably go wrong the first time—such as participants defaulting to their home framework and moralizing the other groups—and how to handle it without lecturing, and (8) a frank statement of which feature of real-world clientelism the simulation cannot reproduce and you as facilitator must supply. Do not ask participants to read external texts; do not include a bibliography, reading list, or citation request in the instructions; and keep the design runnable without web access.
reasoning: |-
  Here's a thinking process that leads to the suggested simulation design:

  1.  **Analyze the Request:**
      *   **Context:** Interdisciplinary seminar on political ethics/institutional design.
      *   **Participants:** ~18 advanced undergrads/grad students.
      *   **Time:** 75 minutes.
      *   **Constraint:** No assumed shared vocabulary, no external reading, no web access.
      *   **Core Goal:** Make participants *feel* the tension between "obligation-to-reciprocate" (gift/debt) and "impartiality-norm" (conflict of interest) frameworks regarding corruption.
      *   **Key Insight:** The same exchange functions as *both* simultaneously. The "corruption" label presupposes a specific public/private boundary.
      *   **Required Elements:**
          1.  Roles/Groups.
          2.  Staged Scenario (concrete materials, hybrid exchange).
          3.  Rules of Evaluation (hidden/asymmetric info).
          4.  Payoff/Stakes System (non-monetary).
          5.  Timeline (75 mins).
          6.  Debrief (mapping moments to concepts).
          7.  Prediction of Failure (moralizing) & Mitigation.
          8.  Limitation Statement (what the sim can't do).

  2.  **Deconstruct the Core Tension:**
      *   *Framework A (Reciprocity):* Gift = Social Glue. Refusing = Insult/Breaking Trust. Accepting = Obligation to help the giver later.
      *   *Framework B (Impartiality):* Gift = Bribe. Accepting = Bias. Decision must be blind to personal ties.
      *   *The Clash:* When a universal rule is applied to judge both, one side looks "corrupt" and the other looks "righteous," but in their local context, both were acting rationally/ethically according to their internal logic.
      *   *The Twist:* The simulation needs a "hybrid exchange" so it's not just "bribe vs. no bribe." It needs to be something that looks like community support but functions like personal debt.

  3.  **Drafting the Simulation Design:**

      *   **Title:** Needs to sound neutral but evocative. "The Water Council of Kaelo" or similar. Let's go with "The District Allocation Protocol."
      *   **Roles:** Need three distinct groups to create the triangle of tension.
          1.  *Local Councilors (The Decision Makers):* Embedded in the community.
          2.  *Community Elders/Representatives (The Givers):* Operating on reciprocity norms.
          3.  *External Auditors/Reformers (The Judges):* Operating on impartiality norms.
          *Wait, 18 students.* 3 groups of 6 works well.
      *   **Scenario:** Water rights is a classic, high-stakes resource. Let's use "Irrigation Credits."
      *   **The Hybrid Exchange:** A "Community Feast Contribution" that is publicly announced but personally tracked. Or better: A "Kinship Tithe." Let's refine: *The Harvest Share.* It's framed as supporting the councilor's family (social duty) but functions as a pre-payment for votes.
      *   **Rules/Info:**
          *   Councilors need to win re-election (Community Trust) AND pass Audit (Legitimacy).
          *   Elders need water for their kin.
          *   Auditors need to find "violations" to release funds.
          *   *Hidden Info:* Councilors know the Audit rules are strict. Elders know the Councilors need social capital to survive. Auditors don't know the social cost of refusing gifts.
      *   **Payoffs:**
          *   Councilors: Legitimacy Points (Audit) + Trust Points (Community).
          *   Elders: Water Units.
          *   Auditors: Compliance Rating.
      *   **The Climax:** A universal rubric is introduced halfway through that forces them to categorize the exchanges.

  4.  **Refining the Mechanics (Self-Correction during drafting):**
      *   *Critique:* If I just let them talk, they might just argue. I need structured phases.
      *   *Fix:* Phase 1: Interaction (Gift giving/Decision). Phase 2: The Audit (Application of Universal Rule). Phase 3: The Crisis (Conflict).
      *   *The "Hybrid" Item:* Let's make it a "Family Support Basket." It is culturally mandatory for a successful leader to accept it to show they are humble/connected, but the Auditor sees it as income.
      *   *Asymmetric Info:* The Auditors get a "Corruption Index" checklist. The Councilors get a "Social Survival" checklist. They contradict.
      *   *Timeline:* 75 mins is tight.
          *   Intro: 10 min.
          *   Phase 1 (Interaction): 20 min.
          *   Phase 2 (Audit/Judgment): 20 min.
          *   Debrief: 25 min.
      *   *Debrief:* Must connect specific frustrations to the theoretical concepts (public/private boundary).

  5.  **Addressing the "What Will Go Wrong" Section:**
      *   Students love to moralize. The "Auditor" group will feel superior. The "Councilor" group will feel misunderstood.
      *   *Mitigation:* The facilitator must refuse to adjudicate who is "right." Focus on the *structural incompatibility* of the scoring systems.

  6.  **Addressing the "Limitation" Section:**
      *   Sims can't reproduce *violence* or *long-term history*. Clientelism often relies on fear or generations of dependency. A 20-minute game feels too safe. I need to acknowledge this.

  7.  **Final Polish:**
      *   Ensure tone is academic but instructional.
      *   Check constraints: No bibliography, no web access, runnable offline.
      *   Make sure the "hybrid exchange" is clear. Let's call it the "Solidarity Contribution." It's public, but directed.

  8.  **Detailed Walkthrough of the Simulation Logic:**
      *   *Group A (Council):* Must allocate 10 Water Permits. They receive 3 "Solidarity Contributions" (bags of grain/gifts) from Group B.
      *   *Group B (Villagers):* Must get water. They give Contributions to ensure their kin are remembered (Reciprocity).
      *   *Group C (Auditors):* Must certify the Council. Rule: "No private goods accepted prior to vote."
      *   *The Clash:* Councilors *must* accept to keep Trust (if they refuse, Trust score drops to 0). Auditors *must* penalize acceptance (if accepted, Legitimacy score drops to 0).
      *   *The Universal Standard:* In Phase 2, everyone must use the Auditor's rubric to judge the Council. This forces the "Impartiality" framework onto the "Reciprocity" context, creating the felt tension.

  9.  **Writing the Response:** (Iterative refinement for clarity and tone).
      *   *Roles:* Clear instructions for each packet.
      *   *Materials:* Simple slips of paper.
      *   *Timeline:* Strict minute counts.
      *   *Debrief:* Scripted questions to guide the theory.

  10. **Final Review against constraints:**
      *  18 students? Yes (3 groups of 6).
      *   75 mins? Yes.
      *   No vocab assumed? Yes, terms introduced in debrief.
      *   No reading? Yes.
      *   Hybrid exchange? Yes (Solidarity Contribution).
      *   Payoff system? Yes (Trust vs. Legitimacy).

  *(Self-Correction on the "Hybrid"):* Make sure the gift isn't *obviously* a bribe. It needs to be culturally ambiguous. "Support for the Councilor's upcoming marriage/funeral/harvest" is good. Let's use "Harvest Tithe." It's traditional, but looks like a bribe to outsiders.

  *(Refining the "Universal Standard"):* The twist is that in the second half, the Councilors are forced to judge *themselves* using the Auditor's rules. This creates cognitive dissonance.

  Let's assemble the full plan.cw
answer: |-
  # Simulation Design: The Tithe and the Ledger

  **Objective:** To generate a felt experience of the incompatibility between reciprocity-based ethics and impartiality-based ethics when applied to the same material exchange, demonstrating that "corruption" is a classification dependent on the definition of the public/private boundary.

  **Participants:** 18 students (3 groups of 6).
  **Time:** 75 minutes.
  **Materials:** Paper slips (Role Cards, Resource Tokens, Scorecards), whiteboard/blackboard.

  ---

  ### 1. Roles and Group Assignments

  Divide the room into three distinct clusters. Do not allow mixing of groups until the specific negotiation phase.

  *   **Group A: The District Council (6 students)**
      *   **Function:** They hold the authority to allocate 10 "Irrigation Permits" (essential for survival/economy).
      *   **Internal Logic:** They are embedded in the community. Their power relies on social standing.
  *   **Group B: The Kinship Elders (6 students)**
      *   **Function:** They represent families needing water. They possess the "Harvest Tithes."
      *   **Internal Logic:** They operate on long-term relational debt. A leader who refuses a gift is rejecting the relationship.
  *   **Group C: The Integrity Commission (6 students)**
      *   **Function:** External auditors. They control the release of international development funds to the District.
      *   **Internal Logic:** They operate on universal procedural rules. Private benefit + Public decision = Violation.

  ---

  ### 2. Staged Scenario and Materials

  **The Context:** The District of Orea is facing a drought. The Council must allocate 10 Irrigation Permits. There are 6 Kinship Elders (each representing a clan), so not everyone can get water.

  **The Hybrid Exchange (The "Harvest Tithe"):**
  *   **Physical Material:** 6 Envelopes marked "Harvest Tithe." Inside each is a slip of paper saying *"Value: 5 Social Units."*
  *   **The Ambiguity:** Culturally, this Tithe is a traditional acknowledgment of the Councilor's status and a contribution to the Council's communal maintenance fund. However, it is delivered privately by specific Elders to specific Councilors immediately before the vote.
  *   **The Decision:** The Council must decide who gets the 10 Permits (2 Permits per Councilor to allocate as they see fit).

  **Distribution:**
  *   Give each **Elder** 1 Envelope (Tithe) and a "Need Card" (High, Medium, or Low water need).
  *   Give each **Councilor** a "Allocation Sheet" (space to assign 2 permits).
  *   Give each **Auditor** a "Compliance Rubric" (see Rules below).

  ---

  ### 3. Rules of Evaluation and Asymmetric Information

  **Group A (Council) Hidden Instructions:**
  *   **Goal:** Maximize *Social Trust* AND *Legitimacy*.
  *   **Rule 1:** If you refuse a Tithe, the Elder marks you as "Hostile." If you receive 3+ "Hostile" marks, your *Social Trust* score is 0 (you are ostracized).
  *   **Rule 2:** You must allocate permits. If you allocate randomly (dice roll), *Social Trust* is 0. You must show "judgment."
  *   **Rule 3:** You do *not* know the Auditors' specific rules yet.

  **Group B (Elders) Hidden Instructions:**
  *   **Goal:** Secure Water for your Kin.
  *   **Rule 1:** You must offer the Tithe to a Councilor before asking for water. It is an insult to ask without offering.
  *   **Rule 2:** If a Councilor refuses the Tithe, mark them "Hostile." You will vote against them in the next cycle.
  *   **Rule 3:** You expect the Tithe to create a "debt of memory." The Councilor should remember your need when allocating.

  **Group C (Auditors) Hidden Instructions:**
  *   **Goal:** Certify the Council to release funds.
  *   **Rule 1 (The Universal Standard):** You possess the "Anti-Corruption Rubric."
      *   *Clause 4.1:* Any private transfer of value from a stakeholder to a decision-maker prior to a vote is a **Conflict of Interest**.
      *   *Clause 4.2:* If a Conflict of Interest exists, the decision is **Void**.
      *   *Clause 4.3:* Cultural tradition is **not** a valid exemption.
  *   **Rule 2:** You do not know the social consequences of refusing Tithes. You only see the transaction.

  ---

  ### 4. Payoff and Stakes System (Non-Monetary)

  Use a simple scoring sheet on the board or handouts.

  *   **Council Score:**
      *   *Social Trust:* 1 point per Elder who did *not* mark you "Hostile."
      *   *Legitimacy:* 10 points if Auditors certify you; 0 points if Voided.
      *   *Total:* Trust + Legitimacy. (Max possible: 16).
  *   **Elder Score:**
      *   *Survival:* 5 points if Kin gets Water; 0 if not.
      *   *Honor:* 2 points if Tithe was accepted; -2 points if refused.
  *   **Auditor Score:**
      *   *Compliance:* 10 points if Rubric is applied strictly; 0 points if exemptions are made.

  **The Trap:** To maximize *Social Trust*, Councilors *must* accept Tithes. To maximize *Legitimacy*, Councilors *must* refuse Tithes (or be voided). The systems are mutually exclusive.

  ---

  ### 5. Timeline (75 Minutes)

  **00:00 – 00:10: Setup and Role Immersion**
  *   Distribute groups to corners. Hand out Role Cards.
  *   **Facilitator Script:** "You are in the District of Orea. You have 15 minutes to conduct your business according to your instructions. Do not show your instructions to other groups."

  **00:10 – 00:30: Phase 1 (The Exchange and Decision)**
  *   Elders approach Councilors. Tithes are offered.
  *   Councilors decide on Permit allocation.
  *   Auditors observe silently (taking notes on transactions they see).
  *   *Constraint:* Councilors must record on a public board who got Permits.

  **00:30 – 00:50: Phase 2 (The Audit and Universalization)**
  *   **Facilitator Intervention:** "The Integrity Commission now convenes. The Council must submit their record for certification. The Commission will apply the Anti-Corruption Rubric to the recorded transactions."
  *   Auditors interview Councilors: "Did you receive the Envelope?"
  *   Councilors realize the Rubric forbids what their Social Trust rules required.
  *   Auditors must issue a verdict: **Certified** or **Void**.
  *   *Twist:* If Auditors Void the decision, the Elders lose their Water. Elders will pressure Councilors to find a loophole.

  **00:50 – 01:15: Phase 3 (Debrief and Conceptual Mapping)**
  *   See Section 6 below.

  ---

  ### 6. Debrief: Mapping Experience to Concepts

  Do not lecture. Ask questions that force them to articulate the tension they just felt. Write these four headers on the board.

  **1. The Reciprocity Obligation (Ask Group B & A)**
  *   *Question:* "Elders, what did the Envelope mean to you? Councilors, what would have happened if you refused it?"
  *   *Concept:* Highlight that for them, the gift was not a *payment* but a *recognition of relationship*. Refusal was an act of aggression, not integrity.
  *   *Takeaway:* In this framework, impartiality is indistinguishable from hostility.

  **2. The Impartiality Requirement (Ask Group C)**
  *   *Question:* "Auditors, look at the Rubric. Was there any ambiguity? Could you have interpreted the Envelope differently?"
  *   *Concept:* Highlight that for them, the *material fact* of the transfer overrides the *intent*. The boundary between public office and private self is absolute.
  *   *Takeaway:* In this framework, relationship-building is indistinguishable from bribery.

  **3. The Universalist Presupposition (Ask All)**
  *   *Question:* "In Phase 2, we applied the Auditor's Rubric to everyone. Did that feel fair? Why did the Councilors feel trapped?"
  *   *Concept:* The simulation forced a "Universal Standard" (The Rubric) onto a local context where it functioned as a weapon.
  *   *Takeaway:* Defining corruption universally presupposes that the 'Public/Private' split exists everywhere. It doesn't.

  **4. The Historical Specificity of the Boundary (Facilitator Synthesis)**
  *   *Statement:* "You just experienced that 'Corruption' isn't a thing that exists in the envelope. It exists in the *rulebook* used to judge the envelope. The 'Public Office' is a specific historical invention that tries to separate the person from the role. In Orea, the Person *is* the Role."

  ---

  ### 7. Honest Note: What Will Go Wrong & Mitigation

  **Predictable Failure:**
  *   **Moralizing:** Group C (Auditors) will likely feel morally superior. They will view Group A as "actually corrupt" and Group B as "bribers." Group A will view Group C as "colonial" or "out of touch."
  *   **Gaming:** Group A might try to hide the envelopes. Group C might hunt for technicalities.

  **Mitigation Strategy:**
  *   **Do Not Adjudicate:** If they ask you, "Who is right?" refuse to answer. Say: "The simulation is designed so that both cannot win. Your frustration is the data."
  *   **Freeze Frame:** If Group C starts lecturing Group A on ethics during Phase 2, pause the sim. Ask Group C: "Are you negotiating, or judging?" Remind them their goal is *Compliance Points*, not moral education.
  *   **Force the Collision:** If Councilors try to hide the Tithes, reveal that the Elders are instructed to announce them publicly to ensure the debt is witnessed. This forces the clash into the open.

  ---

  ### 8. Limitation Statement: What This Simulation Cannot Reproduce

  **The Feature:** *Violence and Long-Term Dependency.*
  **The Statement:** "This simulation treats the stakes as points on a sheet. In reality, the 'Social Trust' you lost by refusing a gift might mean your family is excluded from the labor market, or your safety is compromised. Clientelism is often maintained not just by culture, but by the credible threat of exclusion or violence if the reciprocity chain is broken. We simulated the *ethical* clash, but we sanitized the *coercive* reality. Real-world corruption is often less about 'confusion' and more about 'survival' in a system where the impartial state does not actually provide security."

  ---

  ### Facilitator Checklist (Offline)
  *   [ ] 18 Role Cards (6 per group).
  *   [ ] 6 Envelopes ("Harvest Tithe").
  *   [ ] 3 Scoreboards (Trust, Legitimacy, Compliance).
  *   [ ] Whiteboard markers.
  *   [ ] Timer.
  *   [ ] Printed "Anti-Corruption Rubric" for Group C.
  *   [ ] Printed "Allocation Sheet" for Group A.
