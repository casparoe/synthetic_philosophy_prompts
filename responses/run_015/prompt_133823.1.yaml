  **Tier 1: Genuinely Destabilising**

  *   **(2) Natural selection crafting the vertebrate eye:** This case lands here because it demonstrates complex, functional design arising from a process that possesses no mind, intention, or awareness whatsoever,彻底 severing the folk-psychological link between purpose and a purposer.
  *   **(1) A Turing universal machine running chess code:** This belongs in the top tier because it proves that syntactic manipulation alone can replicate semantic reasoning, showing that logical competence requires no internal grasp of meaning to produce valid outcomes.

  **Tier 2: Interesting but Containable**

  *   **(4) An ant colony solving path-finding problems:** This sits in the middle because while the collective exhibits smart behavior without a collective mind, folk psychology can easily dismiss this as distributed instinct rather than true intelligence.
  *   **(5) The human calculator savant:** I place the savant in this tier because the skill is closer to Turing's machine (pure modular competence without accessible comprehension) rather than ordinary expertise, yet it remains containable since the competence is embedded within a larger human mind that retains general understanding.

  **Tier 3: Not Really an Inversion**

  *   **(3) A blindsight patient navigating round obstacles:** This lands at the bottom because the visual competence occurs without conscious experience, but the processing still happens within a brain that possesses understanding elsewhere, making it a dissociation of access rather than a true absence of comprehension.

  **Radicalism Scores**

  *   **Darwin's Case (Natural Selection): 10/10**
  *   **Turing's Case (Universal Machine): 9/10**

  Darwin scores higher because his inversion applies to biology itself, including us, forcing the conclusion that we are the products of competence without comprehension, whereas Turing's inversion applies primarily to artifacts we build, allowing us to maintain the illusion that human minds remain fundamentally different.
