answer: |-
  # Desiderata for an Account of Information in Thermodynamics

  To adjudicate claims of information-driven work extraction, an account must function as a ledger. It must balance inputs and outputs in physical units, independent of the observer's mind, and applicable to single-shot nanoscopic events as well as macroscopic averages. The following requirements define the necessary structure of such an account.

  ### 1. The Currency and The Bound
  **Requirement:** The account must identify a specific bounded quantity with explicit units (Joules or $k_B$ times temperature). It must specify whether the bound is a strict identity (equality holds always), a floor on dissipation (inequality holds always), or an asymptotic limit (approached only in quasi-static processes).
  **Motivation:** An experimentalist measuring work output ($W$) and heat dump ($Q$) needs to know if $W \leq k_B T I$ is a hard wall or a soft average. This covers the **single-bit demon** (is the cost exactly $k_B T \ln 2$?) and the **noisy detector** (does the bound scale linearly with mutual information or Shannon entropy?).
  **Status:** Non-negotiable. Without units and bound type, the theory cannot be tested against the Carnot limit.

  ### 2. Cycle Closure and Memory Debt
  **Requirement:** The books must close over any finite number of cycles, including cycles where the memory is not reset. If a cycle ends with a correlation stored in memory, the account must assign a value to that stored state that offsets the work extracted during the cycle.
  **Motivation:** This addresses the **unbounded tape demon**. If the demon never resets, it accumulates a record. The account must treat the fresh tape as a resource and the recorded tape as a waste product (or vice versa), ensuring that the net work over $N$ cycles does not violate the Second Law even if the reset cost is deferred indefinitely.
  **Status:** Non-negotiable. Deferring cost indefinitely without accounting for the value of the memory state allows perpetual motion.

  ### 3. Path Independence of State Functions
  **Requirement:** The thermodynamic cost attributed to information processing must be consistent with entropy being a state function. The total cost assigned to a transformation from State A to State B cannot depend on the intermediate path (e.g., whether measurement happened before or after expansion), provided the physical end-states are identical.
  **Motivation:** This tests the **pre-correlated tape** case. If the correlation exists physically, the work extractable should be the same whether a demon "measured" it earlier or found it pre-made. If the account charges for "measurement" as a process distinct from the physical establishment of correlation, it violates path independence.
  **Status:** Non-negotiable. Violation implies the theory describes a psychological process, not a physical one.

  ### 4. Physicality of the Ledger (No Epistemics)
  **Requirement:** The accounting must be phrased in purely physical terms (occupancy probabilities, Hamiltonian parameters, correlation functions). It may not reference what an agent "knows," "learns," or "observes."
  **Motivation:** An experimental apparatus has no mind. This requirement filters the **passive mechanism** (ratchet and pawl). A ratchet fails not because it "doesn't know" the particle's position, but because its own thermal fluctuations equilibrate with the working substance. The account must distinguish a memory device from a passive filter using only physical variables (e.g., non-equilibrium correlation vs. thermal equilibrium).
  **Status:** Non-negotiable. "Knowledge" is not a measurable observable in a lab.

  ### 5. Mechanism Exclusion via Thermalization
  **Requirement:** The account must explicitly demonstrate why a passive, memoryless mechanism (trapdoor, one-way valve) coupled to a single heat bath cannot rectify fluctuations, whereas an information engine can. This distinction must rely on the timescale of the mechanism's thermalization relative to the system.
  **Motivation:** This isolates the **passive mechanism** case. If the theory allows a spring-loaded door to sort molecules without cost, it is false. The theory must show that the "memory" element requires a non-equilibrium initialization that a passive door lacks.
  **Status:** Non-negotiable. This is the historical failure point of classical attempts to beat the Second Law.

  ### 6. The Fluctuation Regime
  **Requirement:** The account must distinguish between transient entropy decreases allowed by fluctuation theorems and systematic violations of the Second Law. It must specify the observation time or ensemble size required for the bound to hold strictly.
  **Motivation:** This addresses the **small device/brief observation** case. In nanoscopic systems, entropy *does* decrease transiently. The account must clarify if the information bound applies to every single trajectory or only to the ensemble average, and if single-trajectory violations are "paid back" later.
  **Status:** Preference of the fluctuation-theorem camp. Classical thermodynamics demands strict adherence; statistical mechanics allows transient violations with exponential suppression.

  ### 7. Quantum Consistency
  **Requirement:** The account must generalize to quantum systems where measurement can be non-disturbing (interaction-free) or where memory becomes entangled with the system. It must identify the physical cost in the absence of classical back-action.
  **Motivation:** This addresses the **quantum demon**. If cost is tied to "disturbance," a non-disturbing measurement should be free. If cost is tied to "correlation," entanglement must be priced. The account must specify if the bound changes when coherence is present.
  **Status:** Non-negotiable for universal validity.

  ### 8. Added Case: Information Expiration (Delay)
  **Requirement:** The account must quantify the degradation of the information resource over time. If there is a delay between measurement and actuation, the account must show the reduction in extractable work due to thermal relaxation.
  **Motivation:** A demon that measures a particle's position but waits too long to act finds the particle has moved. The value of the information is time-dependent.
  **Status:** Non-negotiable for dynamic systems.

  ### 9. Added Case: Common Cause Correlation
  **Requirement:** The account must distinguish between correlation generated by measurement (causal) and correlation generated by a common past cause (non-causal).
  **Motivation:** If the system and memory are correlated because they interacted in the past, but no measurement occurs in the current cycle, can work be extracted? The account must identify where the "debt" for that correlation was originally incurred.
  **Status:** Non-negotiable for cycle closure.

  ---

  # Incompatible Desiderata

  There are tensions within these requirements that suggest no single account satisfies all intuitions perfectly.

  **Conflict 1: Local Erasure vs. Path Independence.**
  *   *The Tension:* Requirement 2 (Cycle Closure) combined with the view that cost is paid *only* at erasure (Landauer's Principle) conflicts with Requirement 3 (Path Independence). If the cost is physically localized to the erasure step, then during the work-extraction step, the system appears to gain free energy from nowhere (the correlation). If the accounting is path-independent, the "potential" to do work must exist as soon as the correlation exists, implying the cost was paid at acquisition, not erasure.
  *   *Verdict:* One cannot maintain that the cost is *physically dissipated* only at erasure while simultaneously maintaining that the thermodynamic potential is a state function of the correlated pair. Either the cost is distributed, or the "state" includes the future obligation to erase.

  **Conflict 2: Information as Resource vs. No Epistemics.**
  *   *The Tension:* Requirement 4 (Physicality) conflicts with the intuitive treatment of information as a "fuel" (Information Thermodynamics). To treat information as a tradeable resource on par with free energy often requires invoking "mutual information," which is defined via probability distributions. If these probabilities are interpreted as subjective degrees of belief (Bayesian), it violates Physicality. If they are interpreted as objective frequencies, it requires an ensemble, which complicates the single-shot **single-bit** case.
  *   *Verdict:* A strictly physical account must treat the memory state as a non-equilibrium physical configuration, not as "bits" in the abstract.

  ---

  # The Most Exclusionary Requirement

  **Requirement 4 (Physicality of the Ledger)** rules out the largest share of otherwise plausible accounts.

  **Why:** Most intuitive explanations of information engines rely on epistemic shortcuts: "The demon knows the particle is on the left," or "Measurement creates knowledge." These phrases are experimentally vacuous. A detector is just a physical system coupling to another. An account that relies on "knowledge" cannot distinguish between a functioning sensor and a broken one that happens to be in the same physical state but is disconnected from the system. By demanding that all variables be measurable physical quantities (Hamiltonians, densities, correlations), we exclude any theory that relies on the *meaning* of the signal rather than its *physical correlation* with the source. This forces the "passive mechanism" exclusion to be rigorous: the ratchet fails not because it is "ignorant," but because its physical state equilibrates too fast.

  ---

  # Scorecard of Three Views

  **View 1: The Erasure Cost Account**
  *   *Commitments:* Information is physical only when destroyed. Work extraction from correlation is free; the debt is paid solely when the memory bit is reset to a standard state. The bound is a floor on dissipation during reset ($W_{diss} \geq k_B T \ln 2$).
  *   *Assessment:* Fails **Path Independence**. It implies a system with a correlated memory has the same free energy as an uncorrelated one until the moment of erasure, which contradicts the ability to extract work *before* erasure. It handles the **unbounded tape** poorly, as it allows indefinite accumulation of "debt" without marking the tape's physical state as lower entropy.

  **View 2: The Measurement Cost Account**
  *   *Commitments:* Establishing the correlation requires work. The act of coupling the detector to the system dissipates the bound amount. Erasure is free if the memory is discarded. The bound is an identity linking measurement energy to mutual information.
  *   *Assessment:* Fails the **Pre-correlated Tape** case. If the tape is handed to the demon already correlated, this view suggests no cost was paid, yet it usually claims measurement is the costly step. It struggles with **Quantum Non-disturbing Measurement**, where physical coupling can be arbitrarily weak, challenging the claim that acquisition *must* cost energy.

  **View 3: The Generalized Non-Equilibrium Free Energy Account**
  *   *Commitments:* Information is a deviation from equilibrium distribution. The bound is a limit on the change in non-equilibrium free energy ($\Delta F_{neq} = \Delta E - T \Delta S_{sys} - k_B T I$). Cost is distributed across the cycle wherever the distribution changes. Ordinary thermodynamics is the subset where $I=0$.
  *   *Assessment:* Satisfies **Path Independence** and **Cycle Closure** best. It treats the correlated state as a high-free-energy physical state regardless of how it was made. It handles the **Noisy Detector** naturally (less correlation = less free energy shift). It is the most robust against the **Physicality** requirement, as it relies on distribution functions rather than "knowledge." However, it is mathematically complex for the **Experimentalist**, requiring full state tomography rather than simple heat/work meters.
