answer: |-
  This is an exceptionally sharp set of intuitions. You have independently reconstructed the central problem of post-Wittgensteinian epistemology: the tension between the *psychological feeling* of certainty and the *logical role* of certainty.

  Your logistics background is actually an advantage here. Academic philosophers often treat these certainties like "foundations" (a building metaphor), which implies they are static and structural. A logistics metaphor is better: **Hinges are not the foundation; they are the loading dock.** They are the place where the cargo (evidence) gets moved on and off the truck (inquiry). If the dock moves, the cargo doesn't get loaded.

  Here is the spec you asked for. I have broken this down into **Requirements**, analyzed your **Three Tests**, scored the **Three Big Pictures**, and flagged the **Impossible Tensions**.

  ### Part 1: The Specification List

  A theory of hinge certainties must satisfy the following criteria to be viable. I have marked them **NN (Non-Negotiable)** if a theory that fails here ceases to be a theory of *hinges* (becoming just a theory of strong belief), and **CP (Camp Preference)** if it depends on which philosophical tribe you join.

  | Requirement | The Case / Motivation | Status |
  | :--- | :--- | :--- |
  | **1. The Kind/Degree Distinction** | **Case:** "Here is a hand" vs. "My city is north of the equator." <br> The equator fact is backed by maps, satellites, geometry. The hand is backed by... nothing. It backs the maps. A theory must explain why the hand feels *structurally* different, not just *stronger*. | **NN** |
  | **2. Functional Role vs. Psychological State** | **Case:** The derailleur screws. <br> You never doubt the screw count, but it's not a hinge. A hinge isn't defined by *not being doubted*; it's defined by *making doubt possible elsewhere*. If I doubt the screws, the bike still works. If I doubt "objects exist," the bike vanishes. | **NN** |
  | **3. Historicity / Migration** | **Case:** Heliocentrism. <br> It was once a dangerous hypothesis; now it is furniture. A theory must explain how a proposition moves from "move in the game" to "rule of the game." Can it move back? (e.g., if all satellites failed). | **NN** |
  | **4. Acquisition / Osmosis** | **Case:** Astrology / Childhood. <br> You didn't argue your way out of astrology; the world stopped making sense *with* it. Hinges are installed by training and living, not by proof. A theory must account for unreliable installers (parents/cults). | **NN** |
  | **5. Cross-Community Intelligibility** | **Case:** Clashing Worldviews. <br> If Community A has "God exists" as a hinge and Community B has "God is a myth" as a hinge, can they talk? Or is it just noise? A theory must say whether this is a translation error or a genuine conflict. | **CP** |
  | **6. Truth-Aptness (The False Hinge)** | **Case:** Can a hinge be false? <br> If hinges are the ground of truth, can the ground be false? If I say "The earth is flat" is a hinge for a community, are they *wrong* or just *playing a different game*? | **CP** |
  | **7. The Exit Route** | **Case:** Radical Skepticism. <br> If I really try to doubt everything, I end up in nonsense, not deeper truth. A theory must explain why total doubt is impossible, not just difficult. | **NN** |

  ---

  ### Part 2: Your Three Tests

  You asked if these are three tests or one test in a costume.
  *   *Test A:* I'd sooner distrust my doubting than the proposition.
  *   *Test B:* I can't argue for it without assuming it.
  *   *Test C:* If you denied it, I'd think you were confused, not wrong.

  **Verdict:** They are **not** the same test. They measure three different dimensions, and they *do* come apart. This is where many theories fail.

  1.  **Test A is Psychological.** It measures *conviction*.
      *   *Failure Mode:* A fanatic or a paranoid person. A paranoid person distrusts their doubt about the conspiracy (Test A passes), but their belief is empirically contestable (Test B fails).
  2.  **Test B is Logical.** It measures *presupposition*.
      *   *Failure Mode:* Mathematical axioms. You can't prove logic without logic (Test B passes), but if someone denies logic, you think they are *wrong*, not necessarily confused in a linguistic sense (Test C is shaky).
  3.  **Test C is Normative.** It measures *social sanction*.
      *   *Failure Mode:* Taboos. "You don't eat people." If you deny this, I think you are morally broken (Test C passes), but I can give evolutionary/sociological reasons for it (Test B fails).

  **Which one is doing the real work?**
  **Test B (Logical Presupposition)** is the engine. Test A is the smoke it produces, and Test C is the safety valve. If you can't argue for it without assuming it, *that* is what makes it a hinge. The feeling (A) and the reaction to dissent (C) are just symptoms of the logical structure (B).

  ---

  ### Part 3: The Three Big Pictures (Scorecard)

  Here is how the three main academic approaches handle your spec.

  | Approach | The Gist | Handles Migration? | Handles False Hinges? | Handles Clashing Communities? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Constitutive Rules**<br>(The "Game" View) | Hinges aren't true/false; they are rules. Like "the King moves one square." | **Yes.** Rules can change mid-game. | **No.** Rules aren't "false," they are just different rules. | **Yes.** Different games. No neutral judge. |
  | **2. Basic Beliefs**<br>(The "Foundation" View) | Hinges are beliefs, just ones that don't need other beliefs to support them. | **No.** Foundations should be eternal. Hard to explain change. | **Yes.** Beliefs can be false. | **No.** One side must be wrong about reality. |
  | **3. Pragmatic Commitments**<br>(The "Action" View) | Hinges are things we *do*, not things we *think*. Animal certainty. | **Yes.** Actions change with environment. | **Maybe.** Actions can be ineffective. | **Yes.** Different forms of life. |

  *   **The Rule View** fits your "Hands vs. Equator" intuition best (different kind, not degree).
  *   **The Belief View** fits your "False Hinge" worry best (allows for error).
  *   **The Action View** fits your "Kids/Astrology" intuition best (learning by doing, not arguing).

  ---

  ### Part 4: The Impossible Tensions

  You asked to flag pairs of requirements that might not be satisfiable together. There are two major fault lines in the literature where theories tend to crack.

  **Tension 1: The Truth vs. Function Conflict (Requirements 1 & 6)**
  *   **The Conflict:** If a hinge is the *ground* for deciding what is true (Requirement 1), it seems it cannot itself be *false* (Requirement 6). If it could be false, then it's just a regular belief sitting on something else.
  *   **The Cost:** If you say hinges *can't* be false (Rule View), you struggle to explain how we progress from bad worldviews to good ones (e.g., abandoning astrology). If you say hinges *can* be false (Belief View), you struggle to explain why we can't use evidence to prove them (because they are the ground of evidence).
  *   **Status:** This is the hardest knot. Most theories sacrifice one side.

  **Tension 2: The Universality vs. History Conflict (Requirements 3 & 5)**
  *   **The Conflict:** If hinges are part of human nature (Universal), how do they change over history (Migration)? If they change over history (Historical), how can we judge between communities (Clashing Communities) without just saying "might makes right"?
  *   **The Cost:** If you emphasize History, you risk Relativism (no way to say one community is better). If you emphasize Universality, you risk Dogmatism (ignoring that people actually live differently).

  ---

  ### Part 5: The Killer Criterion

  You asked for the single requirement that knocks out the most otherwise-attractive accounts.

  **The Winner: Requirement 3 (Historicity / Migration).**

  **Why?**
  Most traditional epistemology (the "Basic Belief" camp) wants foundations to be **stable**. They want the ground floor to be concrete.
  *   If you admit that "The earth goes around the sun" *migrated* from a hypothesis to a hinge, you admit that hinges are **contingent**.
  *   If hinges are contingent, they aren't "necessary truths."
  *   If they aren't necessary truths, the whole project of finding "Certain Knowledge" collapses into "What We Happen To Believe Right Now."

  Many attractive theories die here because they want to save Certainty (with a capital C). They try to argue that *some* hinges are eternal (e.g., "I have a body") while others change. But your Astrology case shows that even "I have a body" can be interpreted differently (e.g., astral bodies).

  **The "False Hinge" (Requirement 6) is a close second.**
  It kills the "Rule View." If you say hinges are rules of language, you can't say a community is *wrong* about their hinges, only *different*. If you feel strongly that a Flat Earth hinge is *false* and not just *different*, the Rule View will not satisfy you.

  ### Summary Advice for Your Reading

  Since you want to read more accounts, here is how to filter them using your logistics spec:

  1.  **Watch for "Psychologizing":** If an author explains hinges by saying "we just can't help believing this," throw it out. That fails **Requirement 2** (Derailleur Screws). It confuses *unable to doubt* with *no role for doubt*.
  2.  **Watch for "Eternalizing":** If an author claims hinges are permanent features of human rationality, check how they handle **Requirement 3** (Migration). If they can't explain how heliocentrism became a hinge, their theory is static and broken.
  3.  **Watch for "Truth-Baiting":** If an author says hinges are "true but not provable," ask them **Requirement 6** (False Hinges). If they say hinges can't be false, ask them how we ever corrected a worldview error.

  **Final thought:** Your intuition that "some accounts get one case right and quietly ignore another" is correct. This is because *On Certainty* is a set of notes, not a finished system. Wittgenstein was throwing darts at the board, not building a house. Most academics try to build a house from the darts. You are better off keeping the darts in your hand and seeing which ones stick to your specific cases.

  Stick to the **Functional Role (Requirement 2)**. That is the strongest handle you have. A hinge is not a thing you *have*; it is a job a proposition *does*.
