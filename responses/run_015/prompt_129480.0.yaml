      *   *Economists (IAM modelers):* Care about calibration, consistency, welfare aggregation, and whether this actually changes the output ($SCC$) or just the justification. They worry about "magic parameters."
      *   *Philosophers:* Care about coherence, moral status of future generations, and whether "institution-neutral" is a coherent category or just utilitarianism in disguise. They worry about "relabelling."
      *   *Skepticism:* "Isn't this just setting $\delta=0$ by fiat and calling it 'institutional'?"

  3.  **Brainstorming Objections (and filtering for likelihood/voice):**
