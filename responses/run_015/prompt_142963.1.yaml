answer: |-
  **Classification Review Board: Social Kind Decision Procedure**

  **Purpose:** Determine if a category requires constructed-kind safeguards (opt-in, sunset, anti-reification).
  **Time:** 30 Minutes.

  **Step 1: Institutional Dependence Check**
  *Question:* Does the kind cease to exist if all institutional records and rules defining it vanish tomorrow?
  *Sufficient Answer for "Yes":* The kind relies on collective acceptance or constitutive rules (e.g., currency, citizenship).
  *Sufficient Answer for "No":* The kind refers to mind-independent properties (e.g., biological sex, geological features).
  *Stop Point:* If **No**, classify as **Tracking Category**. Hard-code. Procedure ends.

  **Step 2: Interactive Feedback Check**
  *Question:* Does classifying individuals into this kind alter their self-conception, behavior, or opportunities in ways that reinforce the classification?
  *Sufficient Answer for "Yes":* Evidence shows labeling creates feedback loops (e.g., diagnostic categories affecting identity).
  *Sufficient Answer for "No":* Classification is passive; members do not change properties due to being classified.
  *Judgment Call:* Magnitude of feedback. Flag for human sign-off if evidence is anecdotal.

  **Step 3: Counterfactual Dissolution Check**
  *Question:* If the institution vanished, would people still coordinate around this kind to solve practical problems, or would they abandon it as mere habit?
  *Sufficient Answer for "Yes":* Persistence takes the form of a coordination problem requiring solution (Normative Residue).
  *Sufficient Answer for "No":* Persistence is merely habitual or disappears entirely (Administrative Disappearance).
  *Stop Point:* If Step 1 is **Yes** AND Step 2 is **Yes**, classify as **Constructed Kind**. Apply safeguards. Procedure ends.
  *Stop Point:* If Step 1 is **Yes** BUT Step 2 is **No**, classify as **Tracking Category**. (Institutional facts without human feedback do not trigger civil-rights safeguards).

  **Applications**

  **(1) Neurotype in Employment Surveys**
  *Step 1:* Yes. Diagnostic criteria rely on institutional consensus.
  *Step 2:* Yes. Labeling affects self-advocacy, workplace accommodations, and community formation (Interactive).
  *Step 3:* Yes. Community coordination persists beyond government definitions (Normative Residue).
  *Result:* **Constructed Kind.** Safeguards apply. Data collectors must use opt-in and sunset reviews, compromising standardized comparability.

  **(2) Central-Bank Digital Currency (CBDC) Unit**
  *Step 1:* Yes. Exists only via institutional rulebook.
  *Step 2:* No. Holding the unit does not alter individual psychology or behavior via the classification itself (Non-interactive).
  *Result:* **Tracking Category.** Hard-coded for GDP allocation. No opt-in required.

  **Limitations and Ontological Status**

  **Settled Consensus:**
  Specialists agree that institutional facts (money, borders) depend on collective acceptance, whereas natural kinds (mass, charge) do not. Specialists also agree that some human classifications create feedback loops altering the classified population.

  **Contested Issues:**
  1.  **Macro Looping:** Whether economic kinds loop back at the systemic level (e.g., GDP targets changing economies) counts as "interactive" for this procedure is unsettled. This procedure treats only individual-level feedback as triggering safeguards.
  2.  **Biological Overlap:** Whether kinds with biological bases (e.g., neurotypes) can be purely interactive is debated. This procedure prioritizes the interactive effect over biological substrate for safeguard triggers.
  3.  **Universal Institutionalism:** Some philosophers argue all human kinds are institutional; others deny this. This procedure assumes a hybrid model to remain operationally viable. Consequently, this procedure operationalizes "socially constructed" as "interactive human kind" for safeguard purposes, excluding non-human institutional facts like CBDC from the "Constructed Kind" designation despite their ontological status.

  **Human Sign-Off Required:**
  - Assessing the magnitude of feedback in Step 2.
  - Distinguishing coordination problems from habits in Step 3.
