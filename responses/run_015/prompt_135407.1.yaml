answer: |-
  **Brainstorming Notes**

  *   **Central Tension:** If unity is retrospective editing, then the speaker claiming this is currently performing the very illusion they are debunking. The speech must embody the contradiction.
  *   **Audience Bridge:** Neuroscientists know the *mechanism* (commissurotomy); Art Historians know the *interpretation* (narrative construction). The bridge is "curation." The left hemisphere is a curator hiding the seams.
  *   **Key Metaphor:** Film editing or palimpsest. The visible whole is a composite of invisible cuts.
  *   **Tone Check:** Avoid "In this paper I will argue." Use "I'm standing here telling you..." Keep it conversational but sharp.
  *   **The "We" Problem:** I must welcome everyone but immediately question the validity of that welcome.
  *   **Concept:** "Serial Monogamy of the Self." Not two minds fighting, but one mind replacing the other so fast the lights don't flicker.

  ***

  **Opening Remarks: "One Mind or Two?"**

  Good morning. Look around the room. We have a split audience. Half of you speak the language of neurons and commissurotomies; the other half speaks the language of brushstrokes and provenance. Usually, at this point, I'm supposed to say something like, "Welcome, everyone. It's great to see us all united here."

  But given the topic, that would be a lie. Or at least, it would be a very specific kind of fiction.

  The standard debate in split-brain literature asks a binary question: When the corpus callosum is severed, does the person become two consciousnesses, or do they remain one? The neuroscientists in the room know the data: the left hand buttons a shirt the right hand just unbuttoned. The art historians in the room might recognize the vibe: it's like a restoration job where the underlying sketch contradicts the final paint layer.

  But I want to suggest both sides are missing a weirder option. We keep asking if the house is divided. I'm suggesting the house is actually a relay race.

  Let's call it the "serial monogamy of the self."

  The idea is this: Unity isn't a simultaneous state. It's a retrospective edit. The left hemisphere doesn't necessarily dominate the right in real-time; instead, it acts as a relentless biographer. It watches the body's actions—including the actions initiated by the right hemisphere—and instantly writes a story that makes them look like they belonged to a single author all along.

  Think of it like film editing. You see a continuous scene, but only because the cuts are invisible. If unity is just good editing, then there aren't two minds watching this screen at once. There is just a succession of editors, each erasing the evidence of the previous cut to maintain the illusion of a single, continuous narrative.

  And here is where I have to undercut myself. I am standing here, speaking to you as a unified "I," inviting you to join a unified "we." I am performing the very trick I'm describing. My left hemisphere is currently claiming authority over this microphone, weaving this sentence into a coherent whole, hoping you don't notice the seams.

  So, what are we doing here for the next two days? We aren't here to solve the puzzle. If the self is a story written in real-time, there is no solution, only drafts.

  For the neuroscientists: Look beyond the lateralization. Look for the lag. Look for the moment the story gets written.
  For the art historians: Look at the restoration. Where is the paint covering the crack? Where is the narrative smoothing over the fracture?

  We are gathered here—maybe—to investigate the editing room. Not to decide if there is one mind or two, but to ask who is holding the pen, and what they are trying to hide.

  Welcome to the workshop. Let's see if we can catch the edit in progress.
