answer: |-
  1. These mixed responses presuppose that artistic value can exist independently of moral character, but only until public association becomes too damaging to ignore. This implies we treat art as either a historical artifact worthy of preservation or a commercial product worthy of cancellation depending on the context.
  2. Keeping a work in a museum with a warning label treats it as historical evidence, while shelving a movie treats distribution as an active honor that validates the creator. This distinction suggests we believe preservation is neutral, but consumption implies support.
  3. The belief that value lies in the object is incompatible with the idea that enjoyment equals endorsement, yet we apply both standards depending on whether the art is old or new. We tolerate this contradiction because it allows us to preserve history without feeling complicit in current harm.
  4. Shelving the movie requires a strong belief that engagement is endorsement, whereas cutting a song or adding a sign can be explained by many views focused on audience comfort rather than ethics. Most of these decisions are actually just pragmatic risk management rather than consistent philosophical stances.
  5. If we believed moral flaws always diminish artistic value, we would stop restoring problematic works and instead remove them from display entirely regardless of their age. This would force us to judge art solely on ethical alignment rather than aesthetic technique or historical significance.
