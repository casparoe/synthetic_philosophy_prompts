      **Joint Statement on the Norm of Assertion**

      **I. Agreed Claims**

      1.  **Nature of Assertion:** We agree assertion is a speech act with a word-to-world direction of fit, wherein the speaker undertakes a commitment to the truth of the proposition expressed.
      2.  **Function:** The practice exists primarily to pool information and coordinate action among agents with limited individual evidence.
      3.  **Shared Data:** We accept the following as constraints on any viable norm:
          *   *Moorean Absurdity:* Asserting "$p$, but I don't know $p$" is inherently defective.
          *   *Lottery Propositions:* Asserting "your ticket lost" based solely on odds is improper, even if highly probable.
          *   *Testimony:* Hearers gain warrant from assertion; mere true guesswork does not transmit warrant.
          *   *Retraction:* Speakers are obligated to retract assertions upon learning they were false or improperly formed.
      4.  **Data Ownership:** We acknowledge divergent explanations for this data. The Knowledge Norm (KN) side claims explanatory ownership of Lottery propositions and Moorean absurdity, arguing these reveal a constitutive knowledge rule. The Reasonable Credence Norm (RCN) side claims ownership of context-sensitivity and stakes effects, arguing these reveal a variable evidential threshold. We agree that testimony transmission is compatible with both, provided the norm ensures sufficient reliability.

      **II. Residual Disagreements**

      | Issue | Knowledge Norm Formulation | Reasonable Credence Norm Formulation | Notes on Verbal/Conceptual Overlap |
      | :--- | :--- | :--- | :--- |
      | **Necessity** | Knowledge is necessary. One cannot properly assert $p$ without knowing $p$. | Knowledge is not necessary. High credence calibrated to evidence suffices, even if knowledge fails (e.g., Gettier cases). | KN may treat high credence as pragmatic surrogate for knowledge; RCN treats knowledge as folk-label for sufficient credence. |
      | **Sufficiency** | Knowledge is sufficient. If you know $p$, you may assert $p$ (barring special consequences). | Knowledge is not sufficient. If stakes are high, knowledge may not meet the raised credence threshold required for assertion. | Dispute hinges on whether "knowledge" encroaches pragmatically (KN) or thresholds shift independently (RCN). |
      | **Context** | Context determines which knowledge-counting standards apply, but the rule remains "Know $p$". | Context sets the probability threshold ($t$). Rule is "Credence($p$) > $t$". | Possible verbal dispute: Is "standards for knowledge" just code for "probability thresholds"? |

      **III. Cruxes and Pre-Commitments**

      We identify four test cases where our predictions diverge sharply. We agree to treat the following intuitions as decisive evidence.

      **(a) Stakes Variation**
      *Case:* A speaker has identical evidence regarding a train schedule. Hearer A needs the info for casual trivia; Hearer B needs it to avoid a fatal accident.
      *Accepted Argument:* If propriety varies while evidence remains constant, the norm tracks either stakes-sensitive knowledge or context-sensitive thresholds.
      *KN Prediction:* Assertion is improper for B. Either the speaker lacks knowledge (pragmatic encroachment) or the assertion violates the norm due to consequences.
      *RCN Prediction:* Assertion is improper for B. The evidence remains constant, but the required threshold rises with stakes, violating the credence norm.

      **(b) The Beliefless Witness**
      *Case:* A press officer reads "The bridge is unsafe" from a compiled report she has not processed personally and holds no doxastic attitude toward, though the evidence is sound.
      *Accepted Argument:* If assertion requires a mental state of the speaker, lack of belief/knowledge prohibits it. If it relies on external evidence, it is permitted.
      *KN Prediction:* Improper assertion. The officer does not know $p$ (lack of belief condition for knowledge), thus violates the constitutive rule.
      *RCN Prediction:* Proper assertion. The officer's confidence is calibrated to the total evidence available to her role; belief is not required for warrant transmission.

      **(c) Selfless Assertion**
      *Case:* A religious school teacher asserts evolutionary theory to students based on overwhelming evidence, despite personally believing creationism due to faith.
      *Accepted Argument:* Propriety depends on either the speaker's epistemic state (belief/knowledge) or the objective evidence base.
      *KN Prediction:* Improper assertion. The teacher lacks belief, therefore lacks knowledge, therefore violates the norm.
      *RCN Prediction:* Proper assertion. The teacher's credence relative to the *evidence* (not personal belief) meets the threshold for the educational context.

      **(d) The Hedged-Assertion Community**
      *Case:* A linguistic community lacks bare assertion. All claims are uttered as "Probably $p$, confidence 0.8." Hearers utilize these claims for coordination exactly as we use bare assertions.
      *Accepted Argument:* If the functional role is identical, the norm should apply. If the form is essential, the norm does not apply.
      *KN Prediction:* No assertion occurs. Without the bare form, the constitutive rule of assertion is not triggered; this is a different speech act.
      *RCN Prediction:* Assertion occurs. The explicit hedge merely makes the threshold explicit. The norm is satisfied if the 0.8 matches the evidence.

