  Option C (Local Grass-fed) is rejected. While it utilizes college assets, the displacement leakage (0.8 acres of soy grown elsewhere per acre converted) means row-crop deaths do not vanish, they move. Furthermore, hay cutting on our 600 acres kills approximately 15 wild vertebrates per 1,000 servings, compared to 0.64 for D. C is land-inefficient and ethically ambiguous.

  **Wild Animal Baseline**
  We cannot settle whether a field mouse's life is net positive or negative. However, D is defensible under either assumption. If wild lives are net negative, D minimizes suffering by minimizing acreage and tillage. If net positive, D minimizes habitat destruction and accidental death per meal. D minimizes our causal responsibility for the net value of those lives, whatever that value may be.

  **Political Constraint**
  The Alum Fund will not renew if animals killed per meal rises. Current default (A) is 0.5 animals per 1,000 servings. B raises this to 70. D lowers it to 0. D secures funding while aligning with sustainability goals.

  **Strongest Case Against**
  The strongest argument against D is that it privileges abstract ethics over student welfare and actual outcomes. If students leave campus to eat, we lose community cohesion and revenue, while the environmental benefit is exported to unregulated supply chains off Route 9. There is a real risk that this policy signals virtue while increasing net carbon emissions via student travel, turning the dining hall into an ideological checkpoint rather than a nourishment hub. We may be solving a spreadsheet problem while creating a cultural one.

  **Timeline and Conditions**
  Vote on Option D by the 14th. Launch pilot Fall semester.
  **Reversal Conditions:** We will revert to Option A if:
  1. Dining hall attendance drops >15% compared to prior year averages.
  2. Student surveys indicate >30% regularly substituting meals with off-campus meat.
  3. Net revenue loss exceeds 5% after accounting for food cost savings.

  This approach balances ethical ambition with fiscal reality, securing the Alum Fund while testing whether our community will eat what we serve.

  \answer{D}
