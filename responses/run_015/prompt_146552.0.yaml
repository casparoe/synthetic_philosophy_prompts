answer: |-
  Dear colleague,

  You have constructed a sophisticated reconstruction of the debunking argument, and the fact that you know your audience so well is your greatest advantage going into this colloquium. Because you are anticipating specific interlocutors, you can tailor your defensive posture not just to the arguments but to the personalities behind them. To maximize your stability during the question period, you should make a specific concession inside the talk itself rather than waiting for it to be extracted from you under pressure. You should explicitly state that the divergence ranking you propose is a preliminary hypothesis intended to demonstrate falsifiability, not an established empirical fact that the theory currently rests upon. By framing the empirical wager as a promise of future work rather than a present pillar, you disarm the experimental philosopher and the biologist slightly, signaling that you are not claiming the data is already settled. This allows you to treat challenges to the data as requests for clarification rather than existential threats to the argument. When you open the question period, spend the first ninety seconds managing the floor rather than answering the first question immediately. Thank the audience for their engagement, briefly acknowledge the specific expertise in the room regarding biology and cross-cultural data, and explicitly invite the hardest empirical objections first. This signals confidence and ensures you tackle the most technically demanding questions while your energy is highest, rather than letting them linger as unresolved threats at the end of the session.

  The first objection you will likely face comes from the philosopher of biology, and it carries significant damage potential because it targets the mechanism of your flexible-response formulation. They will ask you to specify the trait unit and the level of selection, demanding to know how you distinguish an adaptation for flexible moral coordination from a byproduct of general social cognition selected for other purposes. You should concede that we lack direct fossil evidence for moral cognition and that neural modularity is debated, but you must refuse to accept that this uncertainty invalidates the selectionist explanation. Your reply should be that the functional profile itself is the trait relevant to the philosophical argument, regardless of the underlying neural substrate, and that the counterfactual fragility holds even if the mechanism is a byproduct, provided the byproduct is shaped by selective pressures. The seam in this reply is the byproduct hypothesis itself; if they press that the flexibility is merely a spandrel of general intelligence rather than selected for coordination, a sharp follow-up would argue that your debunking force dissolves because the selection pressure you rely on to explain the fragility was never actually applied to the moral faculty specifically.

  Closely following this will be the experimental philosopher, who will challenge the empirical wager regarding cross-cultural variation and the WEIRD sample bias. They will argue that your divergence ranking is simply fitting the curve to existing anthropological data rather than making a genuine prediction, and that the evidence base is too skewed to support claims about human moral nature. You should concede that the current data is imperfect and heavily Western-leaning, but refuse to accept that variation is merely noise or that the pattern is post hoc. Your reply should highlight that even within small-scale non-WEIRD societies, the distinction between harm-based and purity-based norms shows the stability gradient you predict, which suggests the pattern is robust despite sampling issues. The weakest seam here is your own criterion of falsifiability; if they can point to a single robust counterexample where harm norms are highly labile or purity norms are stable across ecological shifts, they can turn your own standard against you and claim the theory is unfalsifiable just-so storytelling, which is the exact criticism you leveled at standard etiological arguments.

  The moral naturalist will then demand a Bayesian formulation, arguing that without explicit likelihood comparisons of the probability of our beliefs given realism versus given the debunking hypothesis, you have not provided an argument but merely a narrative. You should concede that you have not produced numerical likelihoods, but refuse to accept that qualitative assessments of probability are insufficient for metaphysical debunking. Your reply should be that the counterfactual fragility establishes a likelihood ratio so extreme that precise numbers are unnecessary, as the realist cannot explain the alignment without invoking coincidence. The seam in this reply is the vagueness of the likelihood claim; a good follow-up would ask you to specify what evidence would lower the likelihood ratio, and if you cannot specify this without circularity, they will argue you are merely asserting the conclusion rather than deriving it from the premises.

  The non-naturalist moral realist will raise the companions-in-guilt objection, arguing that if your flexible-response formulation works against morality, it generalizes to mathematics and epistemic norms, thereby destroying itself through overgeneration. They will phrase this as a worry that any faculty selected for utility rather than truth is vulnerable, including logic and perception. You should concede that evolutionary explanations apply to all cognitive faculties, but refuse to accept that the epistemic status is identical across domains. Your reply should rely on the audit asymmetry, emphasizing that mathematics and epistemology have external checks like proof and predictive success, whereas moral verdicts are checked only by further moral judgment. The seam here is the definition of external checks; if they argue that reflective equilibrium acts as an external check within morality similar to coherence in mathematics, your asymmetry collapses, and a follow-up would press you to explain why coherence is truth-tracking in math but not in ethics.

  The graduate student will ask the global debunking worry, wanting to know what confines your argument to morality rather than extending it to religion or even empirical belief. They will frame this as a worry about self-defeat if the style of argument works everywhere. You should concede that some domains of religious belief are vulnerable to similar debunking, but refuse to accept that empirical perception is undermined in the same way. Your reply should distinguish between faculties selected for coordination versus those selected for causal contact with the environment, noting that perceptual beliefs have a causal chain to the object believed that moral beliefs lack. The seam is the theory-ladenness of perception; if they point out that perceptual judgment is also shaped by cognitive expectations and selective pressures, a follow-up could argue that the causal chain is insufficient to guarantee truth without assuming the very realism you are debunking.

  The realist may return with a second objection regarding the third-factor reply and modal robustness, insisting that you have not shown that the alignment between facts and beliefs is coincidental rather than modally robust. They will argue that third factors like survival or flourishing could explain the alignment across counterfactual worlds. You should concede that demonstrating modal robustness is difficult, but refuse to accept that their third factors are independent of the moral outputs they explain. Your reply should reiterate the circularity charge, noting that third factors are identified retrospectively by looking at what the faculty delivers, making the alignment claim question-begging. The seam is the possibility of an independent third factor; if they can name a factor like reproductive success that is definable without reference to moral verdicts, a follow-up would force you to admit that the alignment might not be coincidental after all.

  Another challenge will come regarding the audit asymmetry, likely from the naturalist or realist, questioning whether moral progress constitutes an external check similar to predictive success in science. They will ask if the historical convergence on certain moral norms suggests an external reality guiding the process. You should concede that moral progress occurs, but refuse to accept that it tracks mind-independent truth rather than improved coordination. Your reply should be that progress tracks better satisfaction of human needs and social stability, which is consistent with your flexible-response model without requiring realism. The seam is the explanation of convergence; if they ask why coordination needs converge across vastly different cultures if not because they are tracking the same underlying truths, you may struggle to explain the convergence without implicitly appealing to the realism you deny.

  Finally, there is one question you hope nobody asks, because it is the dangerous one rather than merely the awkward one. This objection will likely come from the realist or the biologist and will target the link between coordination and truth. They will argue that successful coordination often requires true beliefs about the world and about human needs, meaning that a faculty selected for coordination would inevitably track truth in those domains. If the function of moral judgment is to coordinate behavior, and coordination fails when beliefs are false, then selection favors true moral beliefs, which undermines your counterfactual fragility claim. This is dangerous because it converts your functional explanation from a debunking tool into a vindicating one, suggesting that the flexible response is actually a truth-tracking mechanism adapted to local conditions. You should concede that coordination requires some true beliefs about physical and psychological facts, but refuse to accept that this extends to normative truths. Your reply should distinguish between instrumental truths needed for coordination and normative truths about value, arguing that selection cares only about the former. The seam here is the distinction itself; if they press that normative truths just are truths about what facilitates coordination, a follow-up would collapse your distinction and show that your model actually supports a form of constructivist realism, which defeats the purpose of your debunking argument.

  Prepare yourself to hold the line on the distinction between coordination and truth, as that is where the entire reconstruction stands or falls. You have done the hard work of refining the argument; now trust that preparation and listen carefully to the specific wording of each objection so you can address the seam rather than the surface. I wish you the very best of luck next Friday.
