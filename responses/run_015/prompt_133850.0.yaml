prompt: |-
  I'm a program officer at a mid-sized city's Office of Newcomer Integation — we cover about 200k people and every month I have to evaluate proposals for refugee placement, language-slot allocations, and employer-sponsored housing clusters. The board keeps asking whether each plan respects the "solidarity-velocity constraint," basically the idea that integration can't outrun the welfare state's ability to keep the fiscal reciprocity and social trust that make redistribution legitimate. I need a reusable decision procedre I can actually run in thirty minutes, grounded in what the philosophy of immigration actually says about this trade-off rather than vibes or headlines. Give me a flowchart in words: the questions to ask in order, what counts as a passing answer at each step, where it stops with a hard no, where it hands the call to a person because it's values not facts, and where it only says yes-with-conditions. Then run it on three cases: (1) placing fifty families in a neighborhood with strained school budgets but strong volunteer networks; (2) approving a factory dormitory that skips language classes but guarantees jobs and tax contributions; (3) expanding a pilot that improved local tax compliance but angered long-time residents who feel replaced. Make sure one of these spits out an answer I'll probably hate, and be honest about where the procedre misfires for a small city like ours. End with a line that reads Verdict: [the exact point where human judgment must take over].
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Program Officer at a mid-sized city's Office of Newcomer Integration (population ~200k).
      *   **Task:** Create a reusable decision procedure (flowchart in words) for evaluating proposals (refugee placement, language slots, housing clusters).
      *   **Core Concept:** "Solidarity-Velocity Constraint" (integration speed vs. welfare state capacity/fiscal reciprocity/social trust).
      *   **Requirements:**
          *   Grounded in political philosophy of immigration (not vibes/headlines).
          *   Runnable in 30 minutes.
          *   Specific structure: Questions in order, passing answers, hard nos, human judgment calls, yes-with-conditions.
          *   Apply to three specific cases.
          *   One case must yield an unpopular/uncomfortable answer.
          *   Acknowledge limitations/misfires for a small city.
          *   Specific ending line: "Verdict: [the exact point where human judgment must take over]".

  2.  **Deconstruct the "Solidarity-Velocity Constraint":**
      *   *Philosophical Grounding:* This sounds like a blend of David Miller's work on national responsibility/social trust, Joseph Carens' "ethical membership," and perhaps some Rawlsian basic structure stability. It touches on the tension between humanitarian obligations (asylum) and the sustainability of the welfare state (which relies on mutual trust and fiscal balance).
      *   *Key Variables:*
          *   *Velocity:* How fast are newcomers arriving/integrating?
          *   *Solidarity:* The existing social fabric, trust, and willingness to redistribute.
          *   *Capacity:* Fiscal ability (schools, housing, welfare) and institutional absorption.
      *   *The Trade-off:* If integration moves too fast (high velocity) without enough support, social trust erodes (solidarity drops), leading to political backlash and welfare state contraction. If it moves too slow, newcomers suffer, and humanitarian obligations are unmet.

  3.  **Drafting the Decision Procedure (The "Flowchart in Words"):**
      *   *Goal:* Needs to be practical, not academic. 30-minute runtime means ~5-7 key questions.
      *   *Step 1: Fiscal Impact (The Hard Constraint).* Can the city afford this *now* without cutting existing services? (Rawlsian stability).
      *   *Step 2: Institutional Absorption.* Do the schools/hospitals have physical capacity?
      *   *Step 3: Social Trust/Political Risk.* Will this trigger a backlash that harms *future* integration? (Miller's solidarity).
      *   *Step 4: Reciprocity/Contribution.* Is there a path to fiscal reciprocity? (Taxation/Labor).
      *   *Step 5: Rights/Dignity Check.* Does this violate basic human rights even if fiscally sound? (Carens/Human Rights).
      *   *Decision Nodes:*
          *   Hard No: Fiscal collapse or Rights violation.
          *   Yes-with-Conditions: Capacity strain or Trust risk.
          *   Human Judgment: Trade-offs between equity and efficiency, or defining "community."

  4.  **Developing the Three Cases:**
      *   *Case 1 (50 Families, Strained Schools, Strong Volunteers):*
          *   Fiscal/Institutional: Strained schools = Risk.
          *   Solidarity: Strong volunteers = High social capital.
          *   *Likely Outcome:* Yes-with-Conditions (must fund school support).
      *   *Case 2 (Factory Dorm, No Language, Guaranteed Jobs):*
          *   Fiscal: Good (taxes).
          *   Rights/Integration: Bad (ghettoization, no language = no long-term integration).
          *   *Likely Outcome:* Hard No or Heavy Conditions. This is the "unpopular" one if the city needs tax revenue, but philosophically it violates the "integration" mandate. Let's make it the "Hard No" based on the *Integration* mandate, which might be unpopular with business interests. Or, make it the "Yes-with-Conditions" that feels morally icky. Let's aim for the prompt's request: "One of these spits out an answer I'll probably hate." A program officer might hate rejecting a job-guaranteed plan because it looks "anti-economic." Or they might hate approving a plan that ignores language. Let's make the procedure reject it based on long-term solidarity risks (no language = no social trust).
      *   *Case 3 (Tax Compliance Pilot, Angry Residents):*
          *   Fiscal: Good.
          *   Solidarity: Low (Anger/Feeling replaced).
          *   *Likely Outcome:* This is the tricky one. High fiscal gain, high social risk. This is where the "Solidarity-Velocity" constraint bites. If velocity (success) outruns trust, the system breaks.
          *   *Decision:* Pause/Human Judgment.

  5.  **Refining the Procedure for Philosophical Rigor:**
      *   Need to cite/reference concepts without being jargon-heavy.
      *   *Miller:* Special obligations to compatriots vs. humanitarian duties.
      *   *Carens:* Social membership takes time.
      *   *Pevnick:* Immigration and the constraints of justice.
      *   *Key Insight:* The welfare state requires a boundary to function (Goodin), but that boundary cannot be morally arbitrary.
      *   *The Constraint:* $V_{integration} \leq C_{solidarity}$.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the role and the constraint.
      *   *The Procedure:* 5 Steps.
      *   *The Cases:* Apply the steps rigorously.
      *   *The "Hate" Answer:* Case 2 is the best candidate. It offers economic gain but creates a permanent underclass. The procedure should flag this as a threat to long-term solidarity.
      *   *Limitations:* Small cities lack data, rely on personal relationships, and can't absorb shocks like big cities.
      *   *Ending:* Exact phrase required.

  7.  **Self-Correction/Review against Constraints:**
      *   *30 minutes?* Yes, 5 questions is doable.
      *   *Philosophy grounded?* Yes, referencing reciprocity, social trust, and basic rights.
      *   *Flowchart structure?* Yes, Step/Question/Pass/Fail/Branch.
      *   *One hated answer?* Case 2 (Rejecting job-guaranteed housing due to lack of language/social integration) is often hated by pragmatists who need tax base.
      *   *Misfires?* Acknowledge that small cities are relational, not just statistical.
      *   *Final Line:* Must match exactly.

  8.  **Final Polish:**
      *   Ensure tone is professional, empathetic, but rigorous.
      *   Make sure the "Solidarity-Velocity" definition is clear in the intro.
      *   Check the "Verdict" line formatting.

