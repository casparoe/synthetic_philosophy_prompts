  *(Self-Correction on Case 3)*: This is the classic "Populism vs. Policy" trap. The procedure should likely flag this as a "Human Judgment" call because data says "good" (taxes) but sentiment says "bad" (trust). This fits the "where it hands the call to a person" requirement.

  *(Refining the "Verdict" line)*: The prompt asks for "Verdict: [the exact point where human judgment must take over]". I need to make sure I don't add extra words after that.

  Let's write it.
answer: |-
  ### The Solidarity-Velocity Decision Procedure (SV-DP)

  **Philosophical Grounding:** This procedure operationalizes the tension between *humanitarian obligations* (Carens), *welfare state sustainability* (Miller/Goodin), and *social membership* (Bosniak). The "Solidarity-Velocity Constraint" posits that if the speed of newcomer intake ($V$) exceeds the rate at which social trust and fiscal capacity can absorb them ($C$), the political coalition supporting redistribution collapses.

  **Runtime:** 30 Minutes
  **Data Needed:** Current budget utilization rates, school/housing capacity metrics, recent community sentiment surveys (or qualitative intel from community liaisons).

  ---

  #### Step 1: The Fiscal Reciprocity Floor (Rawlsian Stability)
  **Question:** Does this proposal require net-new spending that exceeds the city's current surplus or designated contingency fund for the next fiscal year?
  *   **Pass:** No. Costs are covered by existing grants, projected tax revenue within 12 months, or reallocation within the Office's budget.
  *   **Fail:** Yes. It requires cutting existing services for current residents (newcomers or established).
  *   **Action:**
      *   **Pass:** Go to Step 2.
      *   **Fail:** **HARD NO.** (Rationale: Violates the obligation to existing members of the cooperative scheme. Undermines the welfare state's legitimacy.)

  #### Step 2: Institutional Absorption Capacity (Material Constraints)
  **Question:** Do the specific receiving institutions (schools, clinics, housing authority) have physical capacity (seats, beds, appointment slots) without increasing wait-times for current users by more than 10%?
  *   **Pass:** Yes. Capacity exists or can be added without delay.
  *   **Fail:** No. Wait-times will spike significantly.
  *   **Action:**
      *   **Pass:** Go to Step 3.
      *   **Fail:** **YES-WITH-CONDITIONS.** (Condition: Proposal must include funded expansion of that specific capacity *before* arrival. If they cannot fund the expansion, revert to Hard No.)

  #### Step 3: The Integration Pathway (Social Membership)
  **Question:** Does the plan include a mandatory, funded mechanism for language acquisition and civic orientation within the first 6 months?
  *   **Pass:** Yes. Classes are guaranteed and accessible.
  *   **Fail:** No. Relies on "on-the-job" learning or voluntary attendance only.
  *   **Action:**
      *   **Pass:** Go to Step 4.
      *   **Fail:** **HARD NO.** (Rationale: Without language, there is no social membership. This creates a permanent underclass, eroding long-term solidarity and violating the Office's mandate.)

  #### Step 4: The Trust Threshold (Solidarity Check)
  **Question:** Is there evidence (complaints, polling, council feedback) that the specific neighborhood or sector involved is experiencing "integration fatigue" (perception that resources are being zero-sum allocated)?
  *   **Pass:** No. Community sentiment is neutral or supportive.
  *   **Fail:** Yes. There is active resistance or palpable tension.
  *   **Action:**
      *   **Pass:** **APPROVE.**
      *   **Fail:** **HAND TO HUMAN JUDGMENT.** (Rationale: This is a political-ethical tradeoff. Data says the plan works; sentiment says the community rejects it. Proceeding risks a populist backlash that could defund the entire Office. Stalling harms newcomers. A human must weigh the risk of backlash against the moral cost of delay.)

  #### Step 5: The Dignity Override (Rights Check)
  **Question:** (Only for "Yes-with-Conditions" or "Human Judgment" outcomes) Does the condition or delay impose a risk to physical safety or basic human dignity (e.g., homelessness, lack of emergency care)?
  *   **Pass:** No.
  *   **Fail:** Yes.
  *   **Action:**
      *   **Pass:** Confirm previous decision.
      *   **Fail:** **OVERRIDE TO YES.** (Rationale: Human rights trump fiscal optimization. If the choice is between budget balance and human safety, safety wins. Document the deficit for the Board.)

  ---

  ### Case Applications

  #### Case 1: Fifty Families, Strained Schools, Strong Volunteers
  *   **Step 1 (Fiscal):** Neutral. Grants cover direct costs, but school strain is indirect. **Pass.**
  *   **Step 2 (Capacity):** Schools are strained. Wait-times might rise. **Fail.**
      *   *Condition:* Can the proposal fund new teacher aides or classroom space? The volunteer network is strong but cannot replace certified staff.
      *   *Result:* **YES-WITH-CONDITIONS.** (Must fund school capacity expansion first.)
  *   **Step 3 (Integration):** Standard refugee placement includes language. **Pass.**
  *   **Step 4 (Trust):** Strong volunteer networks suggest high social capital. **Pass.**
  *   **Outcome:** **Approved, pending school funding confirmation.**
  *   **Comment:** This is the "easy" yes. The volunteer network acts as a subsidy for solidarity, lowering the velocity risk.

  #### Case 2: Factory Dormitory, No Language, Guaranteed Jobs
  *   **Step 1 (Fiscal):** Guarantees tax contributions. **Pass.**
  *   **Step 2 (Capacity):** Dormitory is private housing. **Pass.**
  *   **Step 3 (Integration):** Skips language classes. **Fail.**
      *   *Result:* **HARD NO.**
  *   **Outcome:** **Rejected.**
  *   **Comment:** **This is the answer you will hate.** You need the tax base, and the employer is offering jobs. But philosophically, this violates the "Social Membership" constraint. Creating a non-speaking labor caste maximizes fiscal velocity but destroys long-term solidarity. It turns newcomers into tools rather than members. If you approve this, you mortgage the city's social cohesion for short-term budget relief. The procedure forces you to say no, even if the budget hurts.

  #### Case 3: Tax Compliance Pilot, Angry Residents
  *   **Step 1 (Fiscal):** Improves compliance. **Pass.**
  *   **Step 2 (Capacity):** Administrative load only. **Pass.**
  *   **Step 3 (Integration):** Pilot includes orientation. **Pass.**
  *   **Step 4 (Trust):** Residents feel "replaced." Active anger. **Fail.**
      *   *Result:* **HAND TO HUMAN JUDGMENT.**
  *   **Step 5 (Dignity):** No immediate safety risk if paused. **Pass.**
  *   **Outcome:** **Escalate to Program Director/Board.**
  *   **Comment:** The data says "success" (taxes), the people say "failure" (trust). The procedure cannot calculate the tipping point of political legitimacy. If you push this, you might save the budget but lose the Board in the next election. If you pause, you punish compliant newcomers for the anger of others. This is not a math problem; it is a leadership crisis.

  ---

  ### Limitations & Misfires for a Mid-Sized City

  1.  **The Data Gap:** A city of 200k does not have real-time sentiment analysis. Step 4 relies on "evidence," which in your context is often anecdotal (a loud town hall vs. silent majority). The procedure assumes data exists; often, you are guessing the trust threshold.
  2.  **The Relational Reality:** In small cities, "Solidarity" isn't abstract; it's the Mayor's cousin who runs the school board. The procedure treats institutions as impersonal buffers. In reality, a "Hard No" on schools might be bypassed by a personal phone call to the Superintendent. The procedure cannot account for informal governance networks.
  3.  **The Velocity Lag:** Fiscal impacts (Step 1) are immediate; solidarity impacts (Step 4) are lagging. You might pass Step 4 today, but the backlash arrives in 18 months. The procedure is a snapshot, not a movie.
  4.  **The "Hate" Factor:** Case 2 reveals the procedure's bias toward long-term integration over short-term fiscal survival. In a small city with a thin tax base, rejecting guaranteed jobs can feel like moral posturing that risks the city's solvency. The procedure prioritizes the *nature* of the community over the *size* of the budget, which is a philosophical choice, not an economic necessity.

  Verdict: The exact point where human judgment must take over is Step 4, when fiscal and institutional facts conflict with the intangible, volatile currency of community trust.
