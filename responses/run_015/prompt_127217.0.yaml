answer: |-
  1. **The Principle**

  **The Principle of Situated Accountability:** An agent's obligation to maximise impersonal good is bounded by epistemic warrant, role-specific norms, and integrity conditions. (1) **Epistemic Warrant**: High-variance interventions are permissible only where the causal mechanism is specific enough and supported by sufficient evidence to distinguish probable impact from rationalisation. (2) **Role Norms**: Agents must adhere to the accountability standards of their institutional position; public agents answerable to taxpayers require verifiable metrics, while private agents with discretionary endowments may pursue structural risk. (3) **Integrity Conditions**: Agents are permitted to prioritise constitutive projects—vocational or relational activities whose value lies partly in the performance itself—over maximisation, but are prohibited from violating negative duties against complicity in harm, even for net positive ends. Counterfactual reasoning must apply symmetrically to harms and benefits and assess marginal rather than total impact. Maximisation is mandatory only where agents are substitutable, evidence is robust, and no integrity constraints are triggered.

  2. **Clause by clause**

  The **Epistemic Warrant** clause resolves the tension between cases 3 and 4. Both involve high variance and low measurability, but case 3 (lobbying) targets a specific legislative mechanism with a clear causal chain, whereas case 4 (organising) relies on a vague sociological model without data. The principle permits 3 because the mechanism is specific enough to justify the risk, but forbids 4 as epistemically reckless.

  The **Role Norms** clause handles case 7. The government agency and private foundation face identical choices but different verdicts because their accountability structures differ. The public agent owes taxpayers verifiable results, mandating measurability; the private foundation owes only its mission, permitting high-risk structural bets. This explains why the same act is virtuous in one context and negligent in the other.

  The **Integrity Conditions** clause addresses cases 1, 2, 5, and 6. Case 1 is permissible because commodity trading is neutral; case 2 is impermissible because raising food prices violates a negative duty against complicity in harm, which cannot be offset by donations. Cases 5 and 6 are protected because local volunteering and mathematical vocation are constitutive projects; the agent is not substitutable here, so the demand to maximise impersonal good lapses.

  Finally, the **Counterfactual** requirement clarifies case 8. It mandates symmetric discounting for replacement. The "last dollar" funder correctly identifies robust counterfactuals (another funder exists); the "first dollar" funder fails because the counterfactual is speculative. This ensures replacement symmetry is applied to funding gaps as well as personal actions.

  3. **Verdicts I lose**

  To maintain this principle, you must accept that there is no single currency of value. You lose the simplicity of a pure consequentialist metric, which would demand you overturn either case 2 or case 1. If net outcomes are all that matter, case 2 must be permissible; if integrity constraints matter, case 1's admirability is rightly dampened. I would advise you to keep your verdict on case 2 and accept the cost: you are endorsing agent-relative constraints on means. This breaks with strict effective altruism but aligns with broader moral intuition.

  The pair hardest to reconcile is 3 against 4. The principle saves both verdicts by relying on an epistemic distinction that may be thinner than you hope. Is lobbying truly more knowable than organising? If you lose confidence there, you must overturn case 3, admitting that unmeasurable structural change is rarely epistemically warranted. However, the principle dissolves the tension between 1 and 2 by shifting the ground from outcomes to complicity. You do not lose a verdict here; you lose the hope that outcomes alone decide the case. The cost is theoretical complexity: you must defend why complicity matters independently of consequences.

  4. **Three cases I have not judged**

  **The AI Graduate Student:** Under the Integrity Conditions, this is permissible if the job is neutral (like case 1), but impermissible if the products cause harm (like case 2). I need further detail on the specific consumer AI products: do they exacerbate inequality or misinformation? If yes, the negative duty against complicity overrides the donation. The Epistemic Warrant clause also applies: does the student have evidence their donation will work better than the harm they cause?

  **The Long-Term Foundation:** The Role Norms clause permits this; private foundations may take risks. However, the Epistemic Warrant clause is the barrier. Two centuries exceeds standard epistemic horizons. Unless the foundation can specify a causal mechanism robust to historical volatility, this fails as rationalisation. I need detail on the mechanism: is it preserving knowledge (robust) or predicting specific politics (fragile)?

  **The Local Housing Donor:** This sits between case 5 (local) and case 3 (structural). The Integrity Conditions permit prioritising local ties, but the Epistemic Warrant applies to the campaign itself. If the housing measure is well-defined (like the lobbying shop), it is permissible. If it is vague populism, it fails. I need detail on the measure's specificity and the donor's relationship to the community: is this constitutive participation or inefficient philanthropy?

  5. **Damage report on my conjecture**

  Your **Agent-Substitutability Proviso** correctly identifies why cases 5 and 6 escape maximisation demands; where the agent is constitutive of the value, substitution fails. However, it breaks on case 7. The public agent and private foundation are both substitutable professionals, yet the verdicts differ. Substitutability cannot explain why role accountability changes the obligation. It also fails to distinguish 3 from 4, as both involve substitutable experts.

  **Replacement Symmetry** is robust. It successfully handles case 2 (harms must be discounted like goods) and case 8 (marginal impact). It is a necessary condition for coherent counterfactual reasoning. However, it is not sufficient. It cannot explain why case 2 is impermissible even if the net balance is positive after discounting. Symmetry handles the math, but not the moral constraint against complicity.

  Neither conjecture should be discarded, but both must be demoted. Replacement Symmetry is a sub-clause of the Counterfactual requirement. Agent-Substitutability is a sub-clause of Integrity Conditions. They are components of the larger principle, not the engine itself. Repairing them requires embedding them within the Role and Epistemic constraints outlined above.
