      *   *Anti-Origin Essentialism:* Psychological continuity (Lockean). If a different zygote developed into a being with my memories and character, isn't that me? Also, biological contingency (twins, cloning). If identity is about the *process* of life, why fixate on the *start* point?
      *   *The Layered-Origin Problem:* Biology isn't simple.
          *   Nuclear DNA (usually the focus).
