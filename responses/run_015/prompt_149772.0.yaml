          *   *The Counter-Intuition:* Psychological continuity. If the outcome is the same, why does the seed matter? The "Slow Replacement" argument (if we swap atoms gradually, do we stay the same?). The contingency of development (environment shapes the person more than the seed).
      *   **Section 2: The Layered-Origin Problem:**
          *   Introduce the biological complexity not as science, but as metaphysical complication.
          *   *Nuclear vs. Mitochondrial:* If essentialism is about genetic code, which code? Mitochondria are inherited differently.
          *   *Cytoplasm/Epigenetics:* The egg provides more than DNA; it provides the environment for expression.
