answer: |-
  ### I. The Correspondence

  To audit the objection, we must first map the cognitive scientist's reconstruction of the analogy. He is treating the family resemblance passage as a hypothesis about natural kinds rather than a grammatical remark. On his reading, the correspondence runs as follows:

  *   **Instances of the Concept:** Individual human beings (the family members).
  *   **Shared Features:** Phenotypic traits (nose shape, chin structure, gait, eye colour).
  *   **The Missing Common Property:** A single phenotypic trait present in every member.
  *   **The Extension of the Concept over Time:** The genealogical lineage (the family tree).
  *   **A Speaker's Competence:** The ability to recognize kinship (identifying who belongs to the family).
  *   **Correction and Error:** Mistaking a non-relative for a relative based on superficial likeness, or failing to recognize a relative who lacks the typical traits.
  *   **The Mistake he takes Wittgenstein to be Making:** The category error of treating a *causal explanation* (genetics/descent) as if it were a *logical criterion* (definition). He charges Wittgenstein with describing the surface (resemblance) while ignoring the mechanism that makes the surface possible (descent).

  ### II. Sorting the Disanalogies

  The scientist's force depends on distinguishing between disanalogies that are merely incidental and those that undermine the logical work the analogy is meant to perform.

  **Inert Disanalogies**
  *   **Determinate Membership Count:** That a family has a specific number of members while a concept (like "game") can apply to indefinitely many cases is inert. Wittgenstein is not making a claim about cardinality, but about the *structure* of the criteria for membership.
  *   **Determinate History:** That a family has a specific historical origin while a concept might not is largely inert for the logical point. Concepts do have histories, even if we don't track them.

  **Load-Bearing Disanalogies**
  These are critical because they strike at the anti-essentialist core of the passage.

  1.  **Boundedness vs. Open Texture:** A family has a hard criterion of membership (descent). You either share the ancestry or you do not; there is no "sort of" a member of the Smith family. Wittgenstein explicitly wants to deny this for concepts like "game," suggesting boundaries can be blurry or drawn for a purpose.
      *   *Verdict:* **Load-bearing.** If the source of the analogy (family) has hard boundaries, it cannot illustrate a concept with soft boundaries without contradiction. This supports the scientist's claim that the analogy is not self-exemplifying.
  2.  **Biological Fact vs. Normative Status:** Family membership is a biological fact independent of human practice. Concept membership is a status conferred by linguistic practice.
      *   *Verdict:* **Load-bearing.** This is the root of the "hidden bond" objection. If membership is factual, there *must* be a fact of the matter (genes). If membership is normative, the "fact" is constituted by the rule-following practice.
  3.  **Common Cause vs. No Explanation:** In a family, the clustering of features is explained by a common cause (genetics). In Wittgenstein's games, the clustering is not explained by a hidden cause but by the way we *use* the word.
      *   *Verdict:* **Load-bearing.** This is the scientist's primary lever. He argues that without a common cause, the clustering is miraculous. Wittgenstein would reply that "explanation" is the wrong demand here; we are describing use, not hypothesizing mechanisms.

  **The "Graded Membership" Counter-Point**
  The scientist notes that in a family, everyone is equally a member despite varying degrees of resemblance. He suggests this helps Wittgenstein accommodate the datum that some instances of a concept are "better examples" than others (prototypicality).

  *   **Audit:** This feature is a double-edged sword. It successfully illustrates that *recognition* can be based on resemblance while *membership* is absolute. However, Wittgenstein's point in *Investigations* §66–71 is often read as suggesting the *boundaries* of the concept are not fixed by a definition, not merely that some examples are better than others.
  *   **Judgement:** It **smuggles in a notion of graded membership** that Wittgenstein would likely refuse *if* it implies the boundary itself is fuzzy in the way family membership is not. Family membership is binary (you are a Smith); concept membership (for Wittgenstein) is often a matter of whether we can extend the use. If the analogy implies "you are either in or out, regardless of resemblance," it actually supports the scientist's demand for a hard criterion (descent) over the resemblance. If the analogy implies "resemblance determines membership," it contradicts the biological fact of descent. Thus, this feature does not save the analogy; it highlights the tension between *criteria* (resemblance) and *truth-conditions* (descent).

  ### III. Does the Conclusion Survive?

  We must distinguish the three claims the analogy might support to see where the scientist's dilemma lands.

  1.  **The Negative Descriptive Claim:** No single feature is common to all games.
      *   *Impact:* The scientist **concedes** this phenomenologically (no single visible trait) but denies it ontologically (the gene is common to all).
      *   *Survival:* The claim survives as a description of *surface features*, but the scientist argues it fails as a description of *underlying reality*.
  2.  **The Claim about Practice:** We can use a concept correctly without being able to state its definition.
      *   *Impact:* The scientist **accepts** this (we recognize kin without knowing genetics) but argues this competence is underpinned by a hidden structure (cognitive mechanisms/genes).
      *   *Survival:* This claim survives intact. The dilemma does not touch the fact of competence, only its explanation.
  3.  **The Methodological Claim:** The search for essences is a confusion in need of dissolution rather than a problem in need of a solution.
      *   *Impact:* This is where the dilemma **strikes hard**. If the scientist is right that "descent" plays the role of essence for families, then the search for essence is not a confusion; it is just a search for the *right kind* of essence (historical/causal rather than definitional).
      *   *Survival:* This claim does not survive the scientist's audit *within the scientist's framework*. If one assumes the goal is causal explanation, the methodological claim looks like obscurantism.

  **Verdict on the Conclusion:**
  The scientist's conclusion ("we are entitled to go back to looking for... a structural or innate account") follows **only if** one accepts the methodological claim is false.
  *   **On the first horn** (Family Resemblance is a promissory note for essence): The scientist wins, but Wittgenstein is misrepresented. Wittgenstein is not deferring the essence; he is dissolving the demand for it.
  *   **On the second horn** (Abandons the hidden bond): The scientist argues the analogy becomes explanatory empty. This is true *for science*, but irrelevant *for philosophy*. Wittgenstein is not offering a causal explanation of why features cluster; he is offering a grammatical reminder that we do not require a common property to use a word.
  *   **Commitment:** If the scientist takes the second horn (that Wittgenstein ignores the cause), he is committed to the view that philosophy *must* provide causal explanations. This is the fundamental disagreement. The dilemma touches Claim 3 most deeply. Touching Claim 3 is enough for his conclusion *if* philosophy is subordinate to cognitive science. If philosophy is autonomous (as Wittgenstein holds), the conclusion fails.

  ### IV. Alternative Comparisons

  Here is an audit of the three candidate analogies against the scientist's clustering objection and the requirement for normativity (error/correction).

  **1. The Rope or Thread (Fibres overlapping)**
  *   **Preserves:** The structural point that continuity does not require a single strand running the whole length.
  *   **Loses:** History, agency, and normativity.
  *   **Clustering Objection:** Merely relocates it. Why do the fibres twist together? If the answer is "manufacturing process," we are back to a hidden cause. If "they just do," it is brute.
  *   **Normativity:** Weak. A rope can break, but a fibre cannot be "wrong" about being in the rope. It fails to capture correction and error.
  *   **Cost:** High. It reifies the concept into a physical object, losing the practical dimension.

  **2. The Path Worn Across a Field**
  *   **Preserves:** Usage, habit, and slight variation. It explains clustering via utility (people walk where it is easiest).
  *   **Loses:** Structural rigidity.
  *   **Clustering Objection:** Escapes it better. The clustering is explained by *teleology* (getting from A to B), not hidden essence.
  *   **Normativity:** Stronger. One can walk "off the path." There is a standard of correctness established by precedent.
  *   **Cost:** Moderate. It implies a destination (purpose) which not all language-games have. It risks instrumentalism.

  **3. The Ancient City (Growth without a plan)**
  *   **Preserves:** Historical accretion, functional zones, lack of global plan, tangled structure.
  *   **Loses:** Unity.
  *   **Clustering Objection:** Escapes it. The clustering of buildings is explained by historical contingency and local needs, not a master plan or hidden essence.
  *   **Normativity:** Strong. Streets have names, buildings have uses, one can get lost or be directed. It accommodates the idea that rules are embedded in the layout but not exhaustive.
  *   **Cost:** Low. This is Wittgenstein's own preferred image (§18). It best captures the idea that the "order" of language is not a hidden logical order but a visible, historical, practical order.

  **Audit Summary:** The **Ancient City** does the work best. It accommodates the "no plan" (no essence) while explaining the "structure" (historical practice). It handles normativity (you can be lost in a city) better than the rope. It handles clustering (urban growth) better than the path. However, like the family, it risks being read as having a "hidden essence" (zoning laws/foundation), so the therapeutic work remains necessary to stop the scientist from asking "but what are the *real* zoning laws of the mind?"

  ### V. The Neighbouring Analogy: Language-Games

  Does the objection transfer to the comparison of speaking a language to playing a game?

  **Transfer of Objection:**
  Yes, but differently. The scientist will ask: "A game has rules. Does language have rules?"
  *   If Wittgenstein says "No," the scientist says "Then how is it rule-governed behaviour? It must be regularities produced by hidden cognitive rules."
  *   If Wittgenstein says "Yes," the scientist says "Write them down. If you can't, they aren't real rules."
  The "hidden bond" objection becomes a "Universal Grammar" or "Cognitive Architecture" objection. The scientist argues that the *public* rules of a game are underpinned by *private* cognitive rules, just as family resemblance is underpinned by genes.

  **Independence and Weight:**
  The two analogies do not stand entirely independently, but they carry different loads.
  *   **Family Resemblance** carries the **structural/descriptive load**. It attacks the picture of concepts as containers defined by necessary and sufficient conditions.
  *   **Language-Games** carry the **normative/practical load**. They attack the picture of meaning as a mental object or a static correlation.

  **Which carries more argument?**
  The **Language-Game** analogy carries more of the real argument.
  *   **Reason:** The scientist's objection to Family Resemblance is powerful because families *are* natural kinds with hidden essences (genes). It is easy to naturalize the analogy.
  *   **Resistance:** It is harder to naturalize the Language-Game analogy. While one can posit hidden cognitive rules for games, the *point* of the game analogy is that the rules are public and constituted by practice. To say "the real rules are in the head" is to change the subject from the *game* to the *player*. Wittgenstein's argument is that meaning is in the use (the game), not the mechanism (the player's mind).
  *   **Conclusion:** The Family Resemblance analogy is vulnerable to the "hidden essence" objection because it describes *things* (games, families). The Language-Game analogy is more robust because it describes *activities*. The scientist can posit hidden genes for families; he can only posit hidden rules for language by ignoring the public nature of rule-following which Wittgenstein establishes in the private language argument. Therefore, the Language-Game analogy is the stronger fortress, while Family Resemblance is the forward outpost that draws the fire. The reading group should retreat to the Language-Game to secure the normativity point, acknowledging that Family Resemblance is easily co-opted by naturalistic explanation.
