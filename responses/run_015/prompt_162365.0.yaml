answer: |-
  This is a precise request that requires bridging two distinct conceptual frameworks: the positive, mechanistic language of modern monetary economics (MME) and the teleological, ethical language of Aristotelian political economy.

  Below is the translation of the four claims, followed by the Residue Report you requested.

  ### I. The Translation

  #### Claim 1: Money exists by convention (*nomos*) and not by nature (*physis*).

  **Aristotle's Claim:** Money is not a natural element (like earth or fire) nor a natural tool (like a hand). It is a social agreement that can be changed or abolished by human will. Its power derives from the community's acceptance, not its intrinsic physical properties.

  **MME Translation:**
  *   **Fiat/Chartalist View:** Money is a creature of the state (legal tender), a liability on the consolidated central-bank-and-treasury balance sheet. Its value is anchored by the state's power to tax and its commitment to accept that liability for public dues.
  *   **Numéraire Arbitrariness:** In general equilibrium, the price level is indeterminate without a nominal anchor. We can choose any good to be the *numéraire*; the choice is conventional, not natural.
  *   **Network Externality:** A currency is worth what others accept it for because of coordination games. It is a social fact sustained by equilibrium expectations.

  **Translation Status:** **Partial/Bundled.**
  Aristotle bundles three distinct MME concepts into one claim:
  1.  **Legal Status:** (Chartalism) It is a legal artifact.
  2.  **Accounting Unit:** (Numéraire) It is an arbitrary measure.
  3.  **Value Source:** (Network/Trust) It relies on social acceptance.
  In MME, these are separable. A currency can be legal tender but rejected (hyperinflation), or a *numéraire* without being a medium of exchange. Aristotle treats them as a single phenomenon of "convention."

  #### Claim 2: Money is a measure that makes goods commensurable via "need" (*chreia*).

  **Aristotle's Claim:** Exchange requires equality. A house is not equal to a shoe. "Need" holds the community together. Money acts as a representative of demand/need, allowing us to say $X$ houses = $Y$ shoes. Without money, there is no common metric to establish reciprocal proportion (justice in exchange).

  **MME Translation:**
  *   **Unit of Account:** Money provides the common denominator for the price vector.
  *   **Demand/Utility:** "Need" translates to effective demand (preferences constrained by endowments).
  *   **Equilibrium Price:** The "proportionate reciprocity" is the market-clearing price where marginal rates of substitution equal the price ratio.

  **Translation Status:** **Bent.**
  The friction lies in the ontology of "Need."
  *   In MME, demand is **subjective and atomic**. It is the aggregation of individual preferences. There is no single, objective "Need" that commensurates goods; there are only relative prices emerging from competing wants.
  *   In Aristotle, "Need" is **objective and social**. It refers to human flourishing requirements. Money measures the *social necessity* of the goods, not just the intensity of preference.
  *   **The Bend:** To translate this, you must treat "Need" not as utility, but as a social welfare function that the price mechanism is *supposed* to reflect but might fail to.

  #### Claim 3: Wealth-getting is bounded (Household/*Oikonomia*) vs. unbounded (Trade/*Chrematistikē*).

  **Aristotle's Claim:** The art of household management aims at acquiring goods necessary for life and the good life. This has a natural limit (sufficiency). The art of money-making (trade for profit) has no limit. Pursuing the unlimited is a corruption of the bounded because it mistakes the means (money) for the end (living well).

  **MME Translation:**
  *   **Bounded:** Production/Consumption aimed at **Satiation**. The household maximizes utility subject to a budget constraint, where the marginal utility of wealth eventually hits zero (or meets subsistence).
  *   **Unbounded:** Profit maximization with **Local Non-Satiation**. The assumption that more is always preferred to less.
  *   **Corruption:** This maps to **Negative Externalities** or **Institutional Drift**. If the financial sector grows detached from the real sector (financialization), it may create systemic risk or misallocate resources away from welfare-maximizing ends.

  **Translation Status:** **Broken (Category Error).**
  MME is agnostic on "corruption." It treats the "unlimited" pursuit of wealth as the default rational behavior (maximization). The idea that accumulation has a *natural* ethical ceiling is outside the model. You can model satiation, but you cannot model the *vice* of ignoring it without importing an ethical premise MME explicitly excludes.

  #### Claim 4: Interest is money breeding money (unnatural).

  **Aristotle's Claim:** Money was invented for exchange, not generation. Money is sterile (a medium). To charge interest is to make the tool generate more of itself, which is contrary to its nature. It is the most hated form of wealth-getting.

  **MME Translation:**
  *   **Intertemporal Price:** Interest is the price of time, equating present and future consumption.
  *   **Natural Rate:** The real return on capital.
  *   **Productive vs. Unproductive Credit:** Credit that funds capital formation (productive) vs. credit that funds consumption or asset inflation (unproductive).

  **Translation Status:** **False (Analytically), but with a Residue.**
  Analytically, Aristotle is wrong in MME terms. Money commands real resources; lending those resources generates productivity; interest is the share of that productivity.
  *   **The Strongest Survival:** If we interpret "money breeding money" as **financial intermediation detached from real asset creation**. If credit circulates within the financial sector (leveraged speculation) without funding real production, it looks like "money breeding money." In MME terms, this is credit creation without a corresponding increase in real GDP potential, leading to instability.

  ---

  ### II. The Residue Report

  Here is the verdict on what is lost, what is illusory, and what is gained in the translation.

  #### A. Substantive but Inexpressible (Defect of MME Vocabulary)
  These are claims Aristotle makes that your vocabulary literally cannot encode, not because they are nonsense, but because your framework defines them out of existence.

  1.  **The Teleology of Institutions:**
      *   **The Claim:** An economic institution (like money or banking) has a *purpose* (telos) distinct from its *function*. Its purpose is human flourishing (*eudaimonia*).
      *   **Why MME Fails:** MME is functionalist and positive. It asks "How does CBDC affect the transmission mechanism?" It cannot ask "Does CBDC serve the good life?" without importing external ethics.
      *   **Verdict:** This is a **defect of your vocabulary**. By rigorously separating positive economics from normative ethics, MME renders itself silent on the *point* of the system it designs. You can optimize for price stability, but you cannot optimize for "naturalness" or "virtue."

  2.  **Objective Need vs. Subjective Preference:**
      *   **The Claim:** There is a difference between what people *want* (revealed preference) and what they *need* (for flourishing). Money should measure the latter.
      *   **Why MME Fails:** MME treats revealed preference as sovereign. If the market prices luxury yachts higher than basic housing, MME records that as value. Aristotle would call this a distortion of "Need."
      *   **Verdict:** **Defect of your vocabulary.** In designing a CBDC, you might want to program it to encourage certain behaviors (e.g., expiry to prevent hoarding, or restrictions on asset purchases). MME calls this distortion; Aristotle might call it restoring money to its proper measure of need. Your vocabulary lacks a variable for "legitimate need."

  #### B. Illusory Substance (Defect of Aristotle)
  These are claims that look deep in Aristotle's framework but dissolve under the precision of MME.

  1.  **The Sterility of Money:**
      *   **The Claim:** Money cannot breed.
      *   **Why it Dissolves:** This relies on a biological metaphor applied to a social ledger. In double-entry accounting, money is a claim on resources. If those resources are deployed productively, the claim grows.
      *   **Verdict:** **Sign that Aristotle's claim was doing less work.** It was a rhetorical device to condemn usury, not a descriptive theory of capital. Your framework handles this vastly better. You can distinguish between the nominal rate, the real rate, and the marginal product of capital. Aristotle conflates them.

  2.  **The "Natural" Limit of Wealth:**
      *   **The Claim:** There is a natural amount of wealth a household should hold.
      *   **Why it Dissolves:** In a complex economy, wealth is not just stored grain; it is claims on future production. There is no physical "fullness" point for financial assets.
      *   **Verdict:** **Sign that Aristotle's claim was doing less work.** It was an observation of a static, agrarian economy projected onto a dynamic one. MME correctly identifies that limits are budgetary and technological, not ethical.

  #### C. Where MME Improves on Aristotle
  There are areas where your vocabulary provides precision Aristotle could only gesture at.

  1.  **The Consolidated Balance Sheet:**
      *   Aristotle struggles with the idea that one sector's asset is another's liability. He sees money as a "thing." Your framework sees it as a network of claims. This allows you to understand that "money breeding money" is often just leverage expanding the balance sheet, not biological reproduction. This clarifies the risk of financial crises in a way Aristotle's "unnatural" label does not.

  2.  **The Nominal Anchor:**
      *   Aristotle knows money can change value, but he lacks the theory of the price level. Your concept of the **nominal anchor** explains *how* convention becomes stable. It allows you to design a CBDC that maintains the "measure" function (price stability) even if the "convention" (the specific token) changes.

  3.  **Intertemporal Coordination:**
      *   Aristotle sees interest as a zero-sum transfer. Your framework sees the **natural rate of interest** as a coordination mechanism between savers and investors. This allows you to see that suppressing interest (as Aristotle might wish) creates disequilibrium (shortages of capital), whereas Aristotle only sees the moral hazard of the lender.

  ### Summary Verdict

  You are operating in a framework of **mechanisms**; Aristotle is operating in a framework of **ends**.

  *   **Where the translation fails because of your vocabulary:** You cannot express the claim that the financial system *ought* to be subordinate to the household sector. In MME, the financial sector is just another set of constraints and technologies. If you are designing a CBDC, you might intuitively feel that certain designs (e.g., preventing leverage) are "better," but your vocabulary forces you to justify that via stability or efficiency, not via the "nature of wealth."
  *   **Where the translation fails because of Aristotle:** His physics of money is obsolete. Money *does* "breed" in the sense that claims on productive capacity grow. To insist otherwise is to deny the productivity of capital.

  **Final Recommendation for your CBDC Design:**
  Use your MME vocabulary for the *architecture* (ledgers, anchors, settlement). But recognize that when you make policy choices about *access, privacy, or programmability*, you are implicitly answering Aristotle's questions about the "boundedness" of wealth. Your vocabulary will call these "constraints" or "frictions." Aristotle would call them "restoring the natural limit." You don't need to adopt his physics to acknowledge that his ethical warning—that finance can detach from the real economy—remains a valid risk parameter in your models.
