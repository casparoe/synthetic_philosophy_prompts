answer: |-
  # What's Your Deal with Properties? 
  ### A Decision Tree for the Problem of Universals

  **Start Here:** Imagine two red apples. 
  **Q1:** Is there literally **one identical thing** (Redness) present in both apples, or are there just **two similar particular things** (this-redness and that-redness)?

  *   **→ One Identical Thing (Realism)** → Go to **Q2**
  *   **→ Two Similar Things (Nominalism/Conceptualism)** → Go to **Q4**

  ---

  ### **The Realism Branch**

  **Q2:** Can that one shared thing exist even if no red objects exist anywhere (uninstantiated)?
  *   **→ Yes** → **PLATONIC REALISM** (Transcendent Forms)
  *   **→ No** → Go to **Q3**

  **Q3:** Is that one thing wholly present in both apples at the same time (multi-located)?
  *   **→ Yes** → **ARISTOTELIAN IMMANENT REALISM** (Universals exist only *in re*)
  *   **→ No** → **⚠️ FLAG: UNSTABLE POSITION** 
      *   *Diagnosis:* If it's one thing, but can't exist alone and can't be in two places, you've basically described a particular. You're trying to have a universal without multi-location. Collapse back to Q1 (Two Things) or accept Tropes.

  ---

  ### **The Nominalism/Conceptualism Branch**

  **Q4:** If there's no shared thing, is the grouping objective (like 'red'), or does it depend on our interests/concepts (like 'being-a-chair')?
  *   **→ Depends on Minds (Conceptualism)** → Go to **Q5**
  *   **→ Objective in World (Nominalism)** → Go to **Q6**

  **Q5:** Are these mental groupings based on sensory/perceptual habits or an ideal rational scheme?
  *   **→ Perceptual Habits** → **CONCEPTUALISM (Empiricist)** (Properties are ways we sort sense data)
  *   **→ Rational Scheme** → **CONCEPTUALISM (Rationalist)** (Properties reflect categories of understanding)

  **Q6:** Do objects have particular property-parts (tropes) that ground the similarity, or is it just the objects themselves?
  *   **→ Yes, Property-Parts (Tropes)** → **TROPE NOMINALISM** (Redness is particular to each apple)
  *   **→ No, Just Objects** → Go to **Q7**

  **Q7:** What explains the similarity between the objects? Is it primitive exact resemblance or just set membership?
  *   **→ Primitive Resemblance** → **RESEMBLANCE NOMINALISM** (They are red because they resemble each other)
  *   **→ Set Membership** → **CLASS NOMINALISM** (To be red is just to be a member of the class of red things)

  ---

  *(Note: If you ended up at the Unstable Flag, you might be a confused Aristotelian or a Trope theorist who hasn't realized it yet. Check your defintion of "one thing".)*
