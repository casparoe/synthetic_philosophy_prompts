      *   *Verdict:* The philosophical distinction *does* matter for specific roles (e.g., Beckett vs. Mamet), but the "byproduct" rule is a heuristic, not a metaphysical truth. The user was right to be suspicious of their own translation.

  7.  **Refining the Tone:**
      *   Avoid patronizing.
