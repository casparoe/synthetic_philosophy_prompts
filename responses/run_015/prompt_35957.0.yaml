      *   **Task 1:** Translate each of the three philosophical theories into the actor's vocabulary.
      *   **Task 2:** Identify what translates cleanly, what gets distorted, and what has no expression in the actor's vocabulary.
      *   **Task 3:** Watch out for the user's bias (smuggling the "emotion is a byproduct" rule into the translations).
      *   **Task 4:** Provide a "Residue Report" (what philosophical questions have no counterpart in acting?).
      *   **Task 5:** Adjudicate (Is the residue a defect in the toolkit, or is the philosophical distinction insubstantial for the actor? Does it change what happens in rehearsal or just the labeling?).
      *   **Tone:** Honest, rigorous, not "diplomatic mush," respectful of both disciplines.

  2.  **Deconstruct the Three Philosophical Theories:**
      *   **Cognitive/Appraisal Theory (e.g., Nussbaum, Solomon):** Emotion = Judgment/Belief. Fear = Judging something as dangerous. The bodily feeling is secondary.
      *   **Perceptual Theory (e.g., Tappolet, Roberts):** Emotion = Perception of Value. Like seeing color. It's passive reception of significance, not necessarily an active judgment.
      *   **Somatic/Jamesian Theory (e.g., James, Lange):** Emotion = Feeling of Bodily Change. We tremble *therefore* we are afraid. The physiology *is* the emotion.

  3.  **Deconstruct the Actor's Vocabulary (Stanislavski/Studio):**
      *   *Given Circumstances:* The facts of the scene.
      *   *Objective:* What the character wants.
      *   *Obstacle:* What stands in the way.
      *   *Action/Tactic:* Verbs used to get the objective (to beg, to threaten).
      *   *Beat:* A unit of action where a tactic shifts.
      *   *Sense Memory/Personalization:* Using past sensory/emotional experience to trigger truth.
      *   *The "As If":* Pretending the circumstances are real.
      *   *Physical Life:* Movement, gesture, tension.
      *   *Core Tenet:* Do not play the emotion; play the action, and emotion arises as a byproduct.

  4.  **Drafting the Translations (Iterative Process):**

      *   *Theory 1: Cognitive/Appraisal.*
          *   *Actor Translation:* This sounds like "Given Circumstances" + "Objective." If I judge the circumstance as dangerous, my objective becomes "survive."
          *   *Distortion Risk:* The user thinks this is just "play the objective." But philosophical appraisal is often unconscious or immediate, whereas an objective is a conscious choice. Also, appraisal theory says the emotion *is* the judgment. Acting says emotion is the *result* of the action.
          *   *Clean:* The link between circumstance and reaction.
          *   *No Expression:* The idea that the feeling *is* the thought. Actors separate thought (analysis) from feeling (experience).

      *   *Theory 2: Perceptual/Value.*
          *   *Actor Translation:* This feels like "The Magic If" or "Sense Memory." It's about seeing the stakes. "This person matters to me."
          *   *Distortion Risk:* Actors talk about "stakes," but usually tied to objectives. Perception implies passivity. Acting is active.
          *   *Clean:* The immediacy of the reaction (like seeing a red light).
          *   *No Expression:* The idea of value existing *in* the object independent of the character's want.

      *   *Theory 3: Somatic/Jamesian.*
          *   *Actor Translation:* "Physical Life" + "Don't play the emotion." If I run, my heart races, then I feel fear.
          *   *Distortion Risk:* The user thinks this is "do the physical action." But James says the feeling *is* the physiology. Actors say physiology *supports* the psychology.
          *   *Clean:* The reliance on the body to generate the state.
          *   *No Expression:* The ontological claim that there is no "fear" without the pulse. Actors believe in the psychological state even if the body is still.

  5.  **Developing the Residue Report:**
      *   What's missing? The *ontology* of emotion. Actors don't care *what* emotion is, only *how to get it*.
