  # Joint Statement on the Ontological Status of ML-Detected Patterns
  **Adversarial Collaboration Draft v0.1**
  **Parties:** Camp A (Intentional Realism) & Camp B (Design Realism)

  ## 1. Agreed Claims
  *The following claims are accepted by both Camp A and Camp B as foundational premises for this collaboration. Disagreement exists only regarding the interpretation of these claims, not their validity.*

  1.  **Predictive Success is Objective:** Both camps agree that model performance metrics (e.g., accuracy, AUC, loss) are measurable and observer-independent. If the model predicts churn at 87% accuracy, that statistical fact is not in dispute.
  2.  **Compression Correlates with Utility:** Both camps agree that successful prediction implies some form of data compression (Minimum Description Length). Reducing the bit-size required to describe future states based on past states is engineering valuable regardless of metaphysical status.
  3.  **Observer-Dependence of Utility:** Both camps agree that the *utility* of a pattern depends on an agent using it. A pattern that no system exploits has no engineering value, even if it exists mathematically.
  4.  **Physical Subvenience:** Both camps agree that all design-level and intentional-level phenomena ultimately supervene on physical hardware (electrons, logic gates). The disagreement is whether higher-level patterns are *reducible* to physical descriptions without loss of reality.

  ## 2. Disagreements, Cruxes, and Test Cases
  *The following table outlines the exact points of divergence. The wording is neutralized to ensure both parties can sign off on the characterization of their own position. Each row includes the philosophical crux and a concrete empirical case to test the divergence.*

  | Domain of Disagreement | Camp A Position (Intentional Stance) | Camp B Position (Design Stance) | Philosophical Crux | Concrete Test Case & Divergent Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ontological Requirement for "Real" Patterns** | A pattern is ontologically real **only if** it supports the attribution of beliefs, goals, or intent to the data subjects or the system. Without an interpreter assigning meaning, the pattern is merely mathematical coincidence. | A pattern is ontologically real **if** it supports reliable prediction and compression via a functional algorithm. Intent attribution is unnecessary; structural regularity is sufficient for reality. | **Does information-theoretic compression require an observer to be ontologically real?**<br>*(Camp A: Yes, information is semantic. Camp B: No, information is syntactic/structural.)* | **Case:** The "Ghost Cluster" (a user segment predicted to churn with 87% accuracy but no identifiable causal feature).<br>**Camp A Prediction:** The cluster is noise/spurious until we identify a user intent (e.g., "frustration") that explains it. If no intent is found, the pattern is not real.<br>**Camp B Prediction:** The cluster is real because the model compresses the data successfully. The lack of causal mechanism is an engineering debt, not an ontological failure. |
  | **Reducibility of Stances** | Design-level patterns (functional rules) are useful fictions. They are not fundamentally real because they cannot be fully reduced to physical states without losing the "pattern" itself (which relies on interpretation). | Design-level patterns are real because they are stable functional regularities. They cannot be reduced to physical states without losing **predictive power**, proving they exist at the design level independently. | **Are design-level patterns reducible to physical ones without losing predictive power?**<br>*(Camp A: Loss of power proves irreducibility, thus unreality. Camp B: Loss of power proves irreducibility, thus reality at design level.)* | **Case:** Model Pruning Experiment (removing 50% of weights while maintaining 87% accuracy).<br>**Camp A Prediction:** If the physical structure changes but output stays same, the "pattern" was never in the weights (physical), proving it only exists in the user's interpretation of the output.<br>**Camp B Prediction:** If the function persists despite physical change, the pattern is robustly real at the design level (functional), independent of the physical substrate. |
  | **Role of the Observer** | The observer creates the pattern by choosing the stance. The pattern is not "out there" in the data; it is imposed by the interpreter's goal-seeking framework. | The observer discovers the pattern. The pattern exists in the data structure regardless of whether an observer is currently exploiting it, provided a possible algorithm could compress it. | **Is the pattern discovered or imposed?**<br>*(Camp A: Imposed by stance. Camp B: Discovered via compression.)* | **Case:** Unsupervised Latent Space Visualization (finding clusters without a target variable).<br>**Camp A Prediction:** Clusters are artifacts of the visualization algorithm's biases, not real data features, until a human assigns them a label/goal.<br>**Camp B Prediction:** Clusters are real data features revealed by the algorithm. Human labeling is post-hoc recognition, not creation. |
