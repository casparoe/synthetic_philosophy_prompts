answer: |-
  Two competing principles that explain your friend's pattern of judgments are **Perceptual Autonomism** and **Moderate Contextual Ethicism**.

  **Perceptual Autonomism** holds that aesthetic value is determined solely by the internal, perceivable features of the work (sound, text, image). On this view, biographical details, production history, or artist intentions are irrelevant unless they manifest directly in the sensory experience of the work. **Moderate Contextual Ethicism**, by contrast, argues that ethical properties related to the work's genesis, intentions, or content can constitute aesthetic properties. It distinguishes between irrelevant private flaws and relevant ethical flaws that inform the work's meaning or experience.

  Applied to the **symphony case**:
  *   **Perceptual Autonomism** predicts this is **good art**. Since the musical surface is serene and structurally elegant, and the surveillance origins are inaudible, the ethical context is external and irrelevant to the aesthetic judgment. The "unsettled" feeling of informed listeners is considered a bias, not an aesthetic feature.
  *   **Moderate Contextual Ethicism** predicts this is **good art, but aesthetically complex/compromised**. Because the artist's intention (evoking monitoring) and the causal origin (surveillance algorithms) are semantically linked to the work's meaning, the ethical context becomes part of the aesthetic experience. The "unsettled" feeling is a valid aesthetic response to the work's full identity.

  **Best Fit:**
  **Moderate Contextual Ethicism** best fits your friend's track record. Pure Autonomism fails to explain why she believes abusive film scenes or cruel lyrics affect aesthetic value (the "viewing experience" and "aesthetic defect" verdicts). Pure Moralism fails to explain why the vicious novelist and fraudulent painter are exempt. Her view is nuanced: ethical flaws matter aesthetically only when they are *relevant* to the work's content, meaning, or production context (as with the film and sculpture), but not when they are merely biographical (the novelist). In the symphony case, the surveillance origin is not merely biographical; it is the *generative logic* and *intended meaning* of the piece, paralleling the film where real offenses mirrored the content.

  **Actual Verdict:**
  Given her verdict on the film ("artistically powerful yet ethically compromised") and the sculpture ("appreciated... provided conditions... acknowledged"), she would likely judge the symphony as **good art** that demands contextual acknowledgment. She would argue the serenity is ironic or layered, making the work aesthetically rich precisely because the ethical origin transforms the listening experience for the informed audience.

