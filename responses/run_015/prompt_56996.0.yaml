prompt: |-
  I'm a backend engineer, zero formal philosophy, so please bear with the framing.

  Setup: we have a service that spits out probability-shaped numbers all day (chance this deploy breaks prod, chance this transaction is fraud, chance the on-call page is a real incident). Everything is a single float today. One coworker keeps pushing that we should switch to ranges, on the grounds that a single number is fake precision and there's a whole imprecise-probability literature that says you should carry a set or an interval of numbers instead. Another coworker says ranges are worthless because at the end you still have to pick an action, and a range doesn't tell you which one. I dont want to take a side until I know what I'd even be demanding of the range approach.

  So: write me the spec. What does a way of representing degrees of belief with something other than one number have to be able to do before its worth the engineering cost? I want the full list of requirements -- the situations it has to handle without falling over, the differences between cases it's not allowed to blur together, what it has to do when new evidence arrives, what it owes you when you have to act, and which ordinary facts about probability and about being well-calibrated it can't just abandon. For every requirement, give the concrete case that motivates it, stated the way I'd have to state it to someone who just wants to ship the thing.

  A few things I've half-heard of and don't know whether they belong on the list at all. There's the urn with red, black and yellow balls where you know exactly how many red but not the black/yellow split, and people's bets in that case look flat-out incoherent under any single number -- is handling that a requirement, or is it just a curiosity? There's the problem, I think called dilation, where doing an experiment makes your interval wider no matter which result comes back, even when you already agreed the experiment was irrelevant -- is "never do that" a hard requirement or one camp's preference? Then there's the gap between "50/50 because the coin is fair" and "50/50 because I genuinely have no clue," which I suspect is the entire motivation for this stuff, and I want to know whether any framework actually keeps those apart or just relabels them. And: does the action rule have to be part of the framework, or can it be bolted on afterwards -- maxmin, or whatever else people use -- and can you even score or calibrate a set-valued forecast the way you'd score a normal one?

  Mark each item as non-negotiable or as somebody's taste, and say whose.

  Then the part I care about most: if some subset of these can't all be had at once -- if being honest about ambiguous evidence, never dilating, and still producing an action pull in different directions -- say so plainly and show me exactly where the squeeze is and which requirement you'd drop first. That's the real answer I'm after, not a brochure. A table works if it makes the trade-offs easier to read.

  American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, pragmatic, no formal philosophy background, skeptical of unnecessary complexity ("fake precision" vs. "worthless ranges").
      *   **Task:** Write a "spec" for representing degrees of belief using something other than a single number (imprecise probability).
      *   **Requirements:** Full list of requirements (situations, evidence updates, action rules, calibration), concrete motivating cases (engineer-to-engineer language), mark items as "Non-negotiable" vs. "Taste/Philosophical Camp," address specific concepts mentioned (Ellsberg urn, Dilation, Knightian uncertainty, Action rules, Scoring), and crucially, identify trade-offs/incompatibilities (the "squeeze").
      *   **Tone:** American English, direct, technical but accessible, no fluff ("not a brochure").
      *   **Format:** Structured list, potentially a table for trade-offs.

  2.  **Deconstruct the Core Conflict:**
      *   *Coworker A (Ranges):* Single numbers imply false certainty. We need to represent *uncertainty about the probability itself* (ambiguity/Knightian uncertainty).
      *   *Coworker B (Single Point):* Decisions require point estimates. Ranges just push the decision problem downstream without solving it.
      *   *User:* What does a range-based system actually need to *do* to justify the engineering cost?

  3.  **Identify Key Concepts in Imprecise Probability:**
      *   **Representation:** Intervals $[L, U]$ or sets of distributions $\mathcal{P}$.
      *   **Ellsberg Paradox:** Distinguishing risk (known probs) from ambiguity (unknown probs).
      *   **Dilation:** When conditioning on evidence widens the interval regardless of the outcome.
      *   **Updating:** Generalized Bayes rule (range of posteriors).
      *   **Decision Rules:** Maximin, Minimax Regret, $\Gamma$-Maximin, etc.
      *   **Calibration/Scoring:** How to evaluate performance when the output is a set.

  4.  **Drafting the "Spec" (Requirements):**
      *   *Requirement 1: Distinguish Risk vs. Ambiguity.* (The Coin Flip vs. The Unknown Urn). This is the core motivation.
      *   *Requirement 2: Coherent Updating.* (Bayes rule for sets). If I get new data, how does $[L, U]$ change?
      *   *Requirement 3: Decision Compatibility.* (Actionability). The system must output something that maps to a boolean/float for the downstream service.
      *   *Requirement 4: Calibration/Scoring.* (Feedback loop). How do we know the model is good?
      *   *Requirement 5: Computational Tractability.* (Engineering constraint). Can we actually compute this in production latency?

  5.  **Addressing Specific User Questions:**
      *   *Ellsberg Urn:* Yes, this is the canonical case for why single numbers fail. It's a requirement for the *representation*, not necessarily for every microservice.
      *   *Dilation:* This is a known bug/feature of Imprecise Probability (IP). It's controversial.
      *   *50/50 Fair vs. 50/50 Clueless:* Yes, IP distinguishes these (width of interval).
      *   *Action Rule:* Must be part of the contract, not bolted on later, otherwise the range is useless.
      *   *Scoring:* Harder than point forecasts. Requires proper scoring rules for sets.

  6.  **Analyzing Trade-offs (The "Squeeze"):**
      *   *The Big Conflict:* Dilation vs. Information Value. In strict IP, learning irrelevant information *should* sometimes widen intervals (Dilation). But engineers hate systems where getting more data makes you "less sure."
      *   *The Second Conflict:* Expressiveness vs. Decidability. The more expressive the set of probabilities, the harder it is to pick an action (Maximin is pessimistic, might lead to paralysis).
      *   *The Third Conflict:* Calibration vs. Coverage. A wide interval is easy to calibrate (truth is usually inside) but useless for decisions. A narrow one is useful but risky.

  7.  **Structuring the Response:**
      *   **Intro:** Acknowledge the engineer mindset. Define the object (Imprecise Probability).
      *   **The Spec (Requirements):** Numbered list. Each with "What it is," "Concrete Case," and "Verdict (Non-negotiable vs. Taste)."
      *   **The Specific Concepts:** Address Ellsberg, Dilation, Knightian uncertainty directly.
      *   **The Trade-off Table (The Squeeze):** This is the most important part. Show incompatibilities.
      *   **Recommendation:** What should they actually build? (Probably a hybrid).

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Don't get too bogged down in philosophical names (Walley, Keynes) unless it helps the engineering context. Keep it focused on *system behavior*.
      *   *Clarification on Dilation:* Make sure to explain *why* it happens (independence assumptions) and why engineers hate it.
      *   *Actionability:* Emphasize that a range without a decision rule is just metadata.
      *   *Scoring:* Mention that standard Brier score doesn't work directly. Need interval scoring rules.

  9.  **Final Polish:**
      *   Check tone (American English, direct).
      *   Ensure all constraints from the prompt are met (mark non-negotiable/taste, show trade-offs).
      *   Make sure the "Squeeze" is explicit.

  **(Self-Correction on the "Non-negotiable" vs "Taste" classification):**
  *   *Distinguish Risk/Ambiguity:* Non-negotiable for the *advocate* of ranges, but optional for the system as a whole. I should frame it as "If you do ranges, this is non-negotiable."
  *   *Decision Rule:* Non-negotiable. A system that outputs ranges without saying how to use them is broken.
  *   *Dilation:* Taste/Philosophical. Some accept it as the price of honesty; others view it as a bug.
  *   *Updating:* Non-negotiable. Must be defined.

  10. **Final Review against Prompt:**
      *   Spec format? Yes.
      *   Concrete cases? Yes.
      *   Mark Non-negotiable/Taste? Yes.
      *   Address Ellsberg, Dilation, Knightian, Action, Scoring? Yes.
      *   Trade-off table? Yes.
