answer: |-
  You have stumbled onto one of the oldest and deepest debates in philosophy. Jake isn't just making up excuses; he has independently reconstructed a philosophical position known as **Hard Incompatibilism** (or Hard Determinism). Specifically, he is using an argument made famous by the philosopher Galen Strawson called **"The Basic Argument."**

  Here is the breakdown of whether his reasoning holds up, and what it actually means for the apology.

  ### 1. Does Jake's reasoning hold up?
  **Logically: Yes. Practically: No.**

  Jake's argument is logically consistent. He is arguing that for you to be truly responsible for an action, you must be responsible for the *cause* of that action (your character, your brain, your desires). But you didn't choose your genes, and you didn't choose your upbringing. Therefore, you are not the "ultimate source" of your actions.

  *   **The Strength of his argument:** He is right that we never choose our starting point. You didn't choose to be born with a temper or a calm disposition. You didn't choose your parents. If every choice comes from a prior cause (brain state + environment), and you didn't choose those prior causes, then technically, the "chain of responsibility" never actually starts with *you*.
  *   **The Weakness of his argument:** This line of thinking proves *too much*. If Jake is right, then **no one** is responsible for anything. Not just bad things, but good things too. If he isn't responsible for ditching his brother, he also isn't responsible for studying for a test, saving a life, or creating art. It dissolves the concept of "agency" entirely.

  Most philosophers today are **Compatibilists**. They agree with Jake that our actions are caused by brains and upbringing, *but* they argue that "free will" doesn't require magic self-creation. They define freedom as **acting according to your own desires without external coercion.**

  *   **The Compatibilist Counter:** Even if Jake's "selfishness" came from his dad, it is still *Jake's* selfishness. It is internal to him. When he chose to leave, he wasn't being forced by a gunman; he was acting on his own preferences. In a social context, that is enough to count as a "choice."

  ### 2. The "Reactive Attitudes" Problem
  There is a specific philosophical counter-argument that applies directly to your situation, proposed by P.F. Strawson (Galen's father).

  He argued that even if determinism is true, human beings cannot help but have **"reactive attitudes."** We feel resentment when someone hurts us and gratitude when someone helps us. These attitudes aren't about metaphysical physics; they are about **relationships.**

  When Jake says, "I'm not responsible because of my brain," he is trying to opt out of the human relationship game. He is treating his brother like an object (like a tree that dropped a branch on him) rather than a person.
  *   If you view your brother as a person, you feel hurt when he ditches you.
  *   If Jake views himself as a person, he must acknowledge that his actions trigger those feelings.

  By using this argument, Jake isn't just making a philosophical point; he is withdrawing from the relationship. He is saying, "I am not a participant in this social contract."

  ### 3. Does he owe his brother an apology?
  **Yes.** Even if his philosophical argument were accepted as true, he still owes the apology. Here is why, based on ethics rather than metaphysics:

  **A. The Function of an Appliance**
  An apology is not primarily an admission of metaphysical sin. It is a **repair mechanism.**
  *   **Acknowledgement:** It tells the victim, "I see that I hurt you."
  *   **Validation:** It confirms that the victim's feelings of resentment are valid.
  *   **Future Signaling:** It signals, "I intend to adjust my behavior in the future."

  If Jake refuses to apologize because "he didn't choose his brain," he is telling his brother, "Your hurt feelings are irrational because I am basically a robot." That damages the relationship more than the missed soccer game did.

  **B. The "Trying" Argument**
  Your mom is right, and Jake is wrong about the "trying" part.
  Jake says, "The part of me that would try is also determined." While technically true in his framework, it ignores **neuroplasticity.**
  *   Brains change based on feedback.
  *   If Jake gets away with this behavior, his brain reinforces the path that says "Selfishness has no consequences."
  *   If he apologizes and faces accountability, his brain reinforces the path that says "Valuing my brother feels better than being selfish."

  He may not have chosen his starting brain, but he is currently the one *operating* it. He is the only agent available to steer it. To say "I can't steer" is a self-fulfilling prophecy.

  ### The Verdict
  Jake is using a metaphysical truth (we don't choose our origins) to dodge a practical responsibility (living in society).

  *   **Is he making an excuse?** Yes, but it's a sophisticated one. He is using "ultimate responsibility" to avoid "moral responsibility."
  *   **Does he owe an apology?** Absolutely. Not because he is a "sinner" in a religious sense, but because he is a participant in a relationship.

  **How to talk to him:**
  Don't argue about physics or brains. Argue about **consequences.**
  Tell him: *"Okay, maybe you didn't choose your personality. But you're the one living in it. If you don't apologize, you're teaching your brain that hurting your brother doesn't matter. You might not have chosen who you were last week, but you are choosing who you are going to be next week. Do you want to be the guy who owns his mistakes, or the guy who blames his dad?"*

  That bypasses the free-will trap and puts the focus back on **identity**, which is something he can actually influence.
