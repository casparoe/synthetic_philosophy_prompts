      *   *Section 2: The Counter-Argument (Compatibilism):* Explain why most philosophers (and society) reject Jake's conclusion. Define "freedom" differently (ability to act on desires vs. metaphysical origin of desires). Mention P.F. Strawson (reactive attitudes).
