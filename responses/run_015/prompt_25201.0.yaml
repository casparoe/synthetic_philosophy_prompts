answer: |-
  **Activity: The Timeline Interrogation**

  **Phase 1: The Phenomenon (15 mins)**
  Project a Color Phi demo (prepared slide or JSFiddle).
  1.  Flash Red Dot (Location A, 50ms).
  2.  Inter-stimulus interval (50ms).
  3.  Flash Green Dot (Location B, 50ms).
  *Result:* Students report seeing a single dot move from A to B, changing color mid-path.
  Have students log: (1) When did motion start? (2) When did color change?
  Collect 3-4 public reports. Establish consensus: "I saw the change *during* motion, before Dot 2 appeared."

  **Phase 2: The Investigation (30 mins)**
  Split class into Team Stalinesque and Team Orwellian.
  **Task:** Construct a causal timeline explaining the reports using *only* behavioral data.
  **Rules:**
  1.  **No Neural Data:** You cannot posit brain states you cannot infer from report timing.
  2.  **Team S (Stalinesque):** Must prove experience was *delayed* until after Dot 2 arrived (editing before consciousness).
  3.  **Team O (Orwellian):** Must prove experience happened *immediately* but memory was revised later (editing after consciousness).
  4.  **The Trap:** Each team must mark the exact millisecond "Consciousness" occurred on their diagram.
  **Instructor Role:** Act as the "Black Box." Answer questions about the stimuli timing, but refuse to confirm when experience happened. Only confirm report content ("Yes, the subject reported seeing green mid-path").
  Students will struggle to differentiate the timelines because the behavioral output is identical.

  **Debrief (20 mins)**
  1.  **Compare Diagrams:** Project both timelines. Highlight that both fit the behavioral data perfectly. The only difference is the label on the "Experience" box.
  2.  **Name the Puzzle:** Introduce Orwellian (memory revision) vs. Stalinesque (pre-conscious editing). Explain that Dennett argues this is a false dichotomy.
  3.  **The Neural Objection:** When students claim "EEG would solve this," ask: "What voltage marks 'consciousness'?" Reveal that neural timing requires interpretation. To say a neuron firing *is* the experience assumes a Cartesian Theater (a finish line). Dennett's point: There is no finish line, so the question "when did it happen?" has no answer.
  4.  **Conclusion:** The distinction collapses not because we lack tech, but because the question presupposes a single moment of "becoming conscious."

  **Predictable Failure Modes**
  1.  **The Illusion Fails:** If timing is off, students see two flashing dots. *Fix:* Test animation beforehand. 50-100ms ISI is the sweet spot. Have a backup video if browser lags.
  2.  **The Neural Fix:** Students insist neuroscience solves it. *Fix:* Don't shut this down; use it. Ask them to design the experiment. They will realize they need to define the "neural correlate of consciousness" (NCC) arbitrarily, which smuggles in the assumption they are trying to prove.
  3.  **Team Imbalance:** One team finishes early. *Fix:* Give them a "Counter-Argument" sheet to attack the other team's timeline specificity.

  **Load-Bearing Assumptions**
  1.  **First-Person Authority is Limited:** The activity assumes students accept that subjects cannot introspectively detect the latency between experience and report. If students believe we have infallible access to the *timing* of our experience, the underdetermination vanishes. You must enforce that reports are data, not truth.
  2.  **No Cartesian Theater:** The debrief relies on rejecting the idea that there is a single place/time where "it all comes together." If students hold onto this, Dennett looks like a verbal trickster. Emphasize that multiple drafts of experience exist in parallel.
  3.  **Behavioral Data Sufficiency:** The activity assumes behavioral reports are the only valid evidence for *phenomenology*. If you allow neural data as decisive without critique, the activity fails. You must maintain that neural data is just another report until interpreted.

  **Prep Note:** Keep the animation simple. Red/Green circles. Black background. Ensure refresh rate is stable. The goal is not to prove Dennett right, but to make the students feel the impossibility of proving him wrong.
