      *   *Drafting text:*
          **Activity: The Timeline Interrogation**
          **Goal:** Force students to construct causal timelines for a perceptual illusion using only behavioral reports, revealing empirical underdetermination.

          **Phase 1: The Phenomenon (15 mins)**
          Project a simple Color Phi demo (use a prepared JSFiddle or PowerPoint animation).
          1.  Flash Red Dot (Location A, 50ms).
          2.  Inter-stimulus interval (50ms).
          3.  Flash Green Dot (Location B, 50ms).
          *Result:* Students report seeing a single dot move from A to B, changing color mid-path.
          Have students write down: (1) When did motion start? (2) When did color change?
          Collect 3-4 public reports. Establish consensus: "I saw the change *during* motion."

          **Phase 2: The Investigation (30 mins)**
          Split class into Team Stalinesque and Team Orwellian.
          **Task:** Construct a timeline of mental events that explains the reports.
          **Rules:**
          1.  You cannot use neural data (no fMRI/EEG). You only have the subjects' reports.
          2.  Team S must prove the experience was *delayed* until after Dot 2 arrived (editing before consciousness).
          3.  Team O must prove the experience happened *immediately* but memory was revised later (editing after consciousness).
          4.  Each team submits a diagram marking "Stimulus," "Experience," and "Report."
          **Crucial Constraint:** You must identify the exact millisecond "Consciousness" occurred.
          Students will struggle. They will try to infer experience time from report time. You (instructor) act as the "Black Box," refusing to confirm when experience happened, only confirming the report content.

          **Debrief (20 mins)**
          1.  **Compare Diagrams:** Project both timelines. Highlight that both fit the behavioral data perfectly.
          2.  **Name the Puzzle:** Introduce Orwellian (memory revision) vs. Stalinesque (pre-conscious editing).
          3.  **The Neural Objection:** When students say "EEG would solve this," ask: "What voltage marks 'consciousness'?" Reveal that neural timing also requires interpretation. To say a neuron firing *is* the experience assumes a Cartesian Theater (a finish line). Dennett's point: There is no finish line.
          4.  **Conclusion:** The distinction collapses not because we lack tech, but because the question presupposes a single moment of "becoming conscious."

          **Predictable Failure Modes**
          1.  **The Illusion Fails:** If timing is off, students see two flashing dots. *Fix:* Test your animation beforehand. 50-100ms ISI is the sweet spot.
          2.  **The Neural Fix:** Students insist neuroscience solves it. *Fix:* Don't shut this down; use it. Ask them to design the experiment. They will realize they need to define the "neural correlate of consciousness" (NCC) arbitrarily.
          3.  **Team Imbalance:** One team finishes early. *Fix:* Give them a "Counter-Argument" sheet to attack the other team's timeline.

          **Load-Bearing Assumptions**
          1.  **First-Person Authority is Limited:** The activity assumes students accept that subjects cannot introspectively detect the latency between experience and report. If students believe we have infallible access to the *timing* of our experience, the underdetermination vanishes.
          2.  **No Cartesian Theater:** The debrief relies on rejecting the idea that there is a single place/time where "it all comes together." If students hold onto this, Dennett looks like a verbal trickster.
          3.  **Behavioral Data Sufficiency:** The activity assumes behavioral reports are the only valid evidence for *phenomenology*. If you allow neural data as decisive without critique, the activity fails. You must maintain that neural data is just another report until interpreted.

          **Prep Note:** Keep the animation simple. Red/Green circles. Black background. Ensure refresh rate is stable. Have a backup video if the browser lags.

