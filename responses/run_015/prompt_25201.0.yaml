  2.  **Deconstruct the Core Philosophical Problem:**
      *   **Stalinesque:** Experience is delayed/edited before entering consciousness (like a staged show).
      *   **Orwellian:** Experience happens, but memory is revised afterwards (like history books rewritten).
      *   **Dennett's Point:** There is no "fact of the matter" about *when* consciousness happens because there's no single finish line in the brain. The distinction collapses under scrutiny.
      *   **Activity Goal:** Force students to try to distinguish them using only behavioral reports (since they can't scan brains), realizing they can't.

  3.  **Drafting the Activity:**
      *   *Idea:* Simulate the Color Phi phenomenon manually or via simple slides.
      *   *Better Idea:* Roleplay the brain processes. Let students *be* the neurons/memory systems.
      *   *Best Idea (given constraints):* A "Black Box" report game. Students observe stimuli, report experiences, then compare notes under conflicting constraints.
      *   *Refined Idea:* Actually, experiencing Color Phi directly is best if possible. Can I do Color Phi with simple slides? Yes. Two dots, different colors, timed sequence.
      *   *Twist:* To make the *distinction* palpable, I need to introduce conflicting data sources.
      *   *Revised Plan:* Split class into "Observers" and "Judges." Observers watch stimuli. Judges interrogate them. But the stimuli are ambiguous.
      *   *Actually, the prompt asks to "experience the color phi phenomenon... then get forced into the position of trying to adjudicate."*
      *   *Let's try this:* Run the demo. Get reports. Then split them into two teams: Team Orwell and Team Stalinesque. They must construct a timeline consistent with the reports. They will find both work equally well.

  4.  **Developing the Steps (45 mins):**
      *   **Phase 1: The Demo (15 mins).** Show Color Phi. Red dot, Green dot, apparent motion with color change mid-path. Collect immediate reports.
      *   **Phase 2: The Investigation (30 mins).** Split class. Half must prove it's Stalinesque (delayed experience). Half must prove it's Orwellian (memory revision). They can ask the "Observer" (you, the instructor, acting as the subject, or selected students) specific questions, but *no neural data*.
      *   **Constraint:** The "Observer" must answer consistently based on a fixed script (the phenomenological report).
      *   **Goal:** Both teams construct a plausible timeline.

  5.  **Developing the Debrief (20 mins):**
      *   Compare timelines.
      *   Reveal they are empirically equivalent given the data.
      *   Introduce Dennett's terms.
      *   Discuss why "check the neurons" fails (Cartesian Theater assumption).

  6.  **Identifying Failure Modes:**
      *   Tech failure (timing off).
      *   Students don't see the illusion.
      *   Students think neural data *would* solve it (missing the point).
      *   Activity runs long.

  7.  **Identifying Load-Bearing Assumptions:**
