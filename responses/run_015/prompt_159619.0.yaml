  # COUNTERFACTUAL DEVELOPMENT PARTNERS, LLP
  **Unlocking Potential Through Rigorous Design**

  ### Our Mission
  At Counterfactual Development Partners (CDP), we believe history is too important to be left to chance. While traditional development agencies rely on observational noise, CDP delivers clean identification. We partner with sovereign states to retrofit their pasts with randomized control trials, ensuring that every growth trajectory is backed by robust standard errors. Our goal is not merely development, but *identified* development.

  ### Service Tiers

  **1. The Institutional Assignment Suite (Flagship)**
  *Best for: Nations seeking definitive proof of institutional theory.*
  CDP will partition your country into matched provincial pairs. Using a cryptographically secure random number generator, we assign inclusive institutions to the treatment arm and extractive institutions to the control arm. Our humane implementation team ensures the extractive regime is maintained consistently for the required duration.
  *   **Duration:** 100–120 years (mandatory for persistence).
  *   **Deliverable:** A binary treatment indicator and a growth differential.
  *   **Investment:** $4.5 trillion (plus persistence surcharge).

  **2. Geographic Relocation Package**
  *Best for: Countries disadvantaged by latitude or axis.*
  Why be landlocked when you could be coastal? Our engineering division physically relocates your national territory to optimal latitudes. We adjust continental axis orientation to facilitate technology diffusion and recalibrate disease burdens to match settler mortality benchmarks.
  *   **Includes:** Navigable water access installation.
  *   **Investment:** Quote upon assessment of tectonic stability.

  **3. Cultural Re-education Module (Add-On)**
  *Best for: Clients requiring controls for trust and patience.*
  Sold exclusively with the Institutional Suite. This module adjusts population-wide attitudes toward work, generalized trust, and future discounting rates. We ensure cultural variables remain orthogonal to institutional treatment status, though spillovers may occur across household units.
  *   **Investment:** $800 million per basis point of trust increase.

  ***

  ### METHODOLOGY SIDEBAR: The CDP Promise
  **The Triangulation Guarantee™**
  Confused by competing literature? CDP guarantees that upon project completion, Institutions, Geography, and Culture will each be certified as the true cause of your economic outcome. Our proprietary *Residual Channel Option* ensures that whichever factor remains significant after controlling for the others is declared primary.

  **Instrumentation Excellence**
  We pride ourselves on strong first stages. Our flagship models instrument present-day institutional quality using historical settler mortality rates. We utilize a composite index of geography, disease environment, and colonial policy, ensuring that your identification strategy leverages the full power of exogenous variation without worrying about overlapping mechanisms.

  ***

  ### Client Testimonial
  > "Before CDP, our growth was anecdotal. Now, we have a precisely estimated coefficient. The fact that half our provinces suffered under deliberately imposed extractive regimes for a century was a small logistical price to pay for a local average treatment effect that generalizes to the entire nation. Our bond spreads tightened immediately upon randomization."
  > — **Finance Minister, Republic of Meridia**

  ***

  ### Frequently Asked Questions

  **Q: Can we terminate the Institutional Assignment early if suffering becomes acute?**
  **A:** Early termination introduces attrition bias that invalidates the long-run persistence clause. Results are delivered in eighty to a hundred and twenty years. Patience is a virtue we can also bill you to install.

  **Q: Does a large, statistically significant coefficient prove causality?**
  **A:** Our standard errors are sufficiently small to rule out doubt. When the p-value is below 0.05, the mechanism is secondary to the identification.

  **Q: What if we want to change the unit of analysis from provinces to individuals mid-engagement?**
  **A:** This incurs the Ecological Inference Fee. Please note that aggregation bias may require a separate robustness check package.

  **Q: Is the Settler Mortality Instrument compatible with the Geographic Relocation Package?**
  **A:** We recommend against moving the country after the instrument has been realized, as this violates the exclusion restriction. However, our legal team can draft a waiver.

  ***

  ### Terms of Engagement (Fine Print)
  **Exclusion-Restriction Waiver:** Client acknowledges that CDP cannot guarantee the instrument affects outcomes *only* through the intended channel. **Spillover Surcharge:** Applied if institutional quality in treated provinces leaks into untreated ones, requiring spatial econometric corrections. **External-Validity Rider:** CDP guarantees internal validity for the specific century and region treated; generalization to other continents requires a separate contract. **Confounding Liability:** Client assumes all risk regarding omitted variable bias, including acts of God, wars, or unexpected technological shocks not captured in the fixed effects.

  **Counterfactual Development Partners, LLP.**
  *Because History Happens Only Once. Unless We Say So.*
