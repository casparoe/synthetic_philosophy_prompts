answer: |-
  This is a strategic allocation problem, not a truth-seeking one. Your constraint—twelve researcher-years over three calendar years—means you cannot fund four independent projects. You must fund a single *pipeline* where the output of Year 1 becomes the input of Year 2. Your two intuitions (Absorption and Wagers) are correct: the debate is stalled because it lacks a defined metric for success (Absorption) and a mechanism for falsification (Wagers).

  Below is the defended agenda. It prioritizes **methodological utility** over metaphysical resolution. The goal is to produce a "Hedging Protocol" for physicists, not a verdict on the nature of reality.

  ### The Dependency Structure

  Before detailing the lines of work, note the logical flow. You cannot advise on hedging (Project 3) until you know what survives theory change (Project 1). You cannot trust the survival data until you know *why* things survive (Project 4). You cannot claim the framework is robust unless it generates predictions (Project 2).

  ```text
  [Project 1: Retention Taxonomy] ---> [Project 4: Criteria of Absorbability]
           |                                     |
           v                                     v
  [Project 2: Successor-Shape Protocol]    [Project 3: Hedging-Norm Audit]
           |                                     |
           +---------------> + <-----------------+
                             |
                   [Deliverable: The Hedging Protocol]
  ```

  ### The Funded Agenda (Ranked by Logical Priority)

  #### 1. The Retention Taxonomy (Solving the Absorption Problem)
  *   **Allocation:** 4 researcher-years (1 senior, 1 junior, full-time for 2 years).
  *   **The Task:** Construct a dataset of 50–100 historical theory transitions (e.g., phlogiston to oxygen, caloric to thermodynamics, Newtonian to Relativistic gravity). Code each transition not as "true/false" but by retention type: *Discarded, Absorbed (as limit case), Absorbed (as structure), Reinterpreted.* Crucially, apply a selection criterion fixed *in advance* (e.g., "all posits appearing in standard textbooks of era X") to avoid the graveyard gatekeeping error you identified.
  *   **Upstream Of:** Everything. Without a corrected base rate of retention, the Pessimistic Meta-Induction (PMI) remains unfalsifiable, and Hedging Norms (Project 3) have no historical anchor.
  *   **Tractability:** High. Requires no new empirical data, only a rigorous re-coding of existing history of science literature. The difficulty is philosophical consistency in coding, not data access.
  *   **Neglect/Leverage:** High neglect, extreme leverage. The PMI dominates the literature, but its sampling bias is rarely quantified. Correcting this single variable shifts the entire burden of proof in the realism debate.
  *   **5-Year Trigger:** Publication of the "Retention Dataset." If the dataset shows a retention rate >60% for *structural/mathematical* posits but <20% for *ontological/mechanistic* posits, this project succeeds. If retention is random across categories, the project fails, and the fund should pivot to anti-realism.

  #### 2. The Criteria of Absorbability (Explaining the Taxonomy)
  *   **Allocation:** 2 researcher-years (1 senior philosopher of physics, 50% time for 4 years).
  *   **The Task:** Analyze the "Absorbed" category from Project 1 to identify the *properties* that predict retention. Is it mathematical form? Causal role? Explanatory scope? This tests Structural Realism against Entity Realism empirically. It moves the question from "What is real?" to "What *acts* real across theory change?"
  *   **Upstream Of:** Project 3 (Hedging). You cannot tell a physicist what to hedge unless you know which features of their posit are likely to be absorbed.
  *   **Tractability:** Medium. Requires deep case studies. Risk lies in finding no commonalities (i.e., absorption is idiosyncratic).
  *   **Neglect/Leverage:** Medium neglect. Philosophers argue for structural realism a priori; few test it against the specific historical mechanics of absorption.
  *   **5-Year Trigger:** A predictive heuristic (e.g., "Posits defined primarily by symmetry groups have 3x the retention rate of posits defined by mechanical models"). If no heuristic emerges, the "Absorption" insight may be a dead end.

  #### 3. The Successor-Shape Protocol (The Wager)
  *   **Allocation:** 3 researcher-years (1 postdoc + 1 senior, focused on engagement).
  *   **The Task:** Force the debate to generate checkable expectations. Philosophers, in collaboration with sympathetic physicists, must draft "Successor Shapes" for current open problems (Dark Matter, Quantum Gravity). Example: *A Realist Wager:* "Any successor to the Standard Model will retain the gauge group structure." *An Anti-Realist Wager:* "Any successor will treat current particles as effective field approximations only."
  *   **Upstream Of:** The final Deliverable. This validates the framework. If the Retention Taxonomy (Project 1) cannot generate a specific prediction about the next theory change, it is merely descriptive history, not philosophy of science.
  *   **Tractability:** Low-Medium. High friction. Physicists may refuse to "wager," and philosophers may fear being wrong. Requires diplomatic skill to frame these as "structural expectations" rather than "predictions."
  *   **Neglect/Leverage:** High neglect. As you noted, both sides avoid this. High leverage because it breaks the stalemate of "the electron works" vs. "the ether worked."
  *   **5-Year Trigger:** A public registry of 5–10 specific "Realist Bets" tied to upcoming experimental results (e.g., LHC runs, gravitational wave detections). If the community refuses to commit to paper, this line fails.

  #### 4. The Hedging-Norm Audit (The Downstream Deliverable)
  *   **Allocation:** 3 researcher-years (1 data scientist/philosopher hybrid, 1 linguist).
  *   **The Task:** Correlate linguistic hedging in grant proposals and papers with the longevity/stability of the posits described. Use the "Criteria of Absorbability" (Project 4) to categorize the posits. The goal is to answer: *Does strong ontological commitment correlate with higher citation impact or funding success, and does it correlate with higher embarrassment (discard rate) later?*
  *   **Upstream Of:** None (it is the final assembly), but depends on data from Projects 1 & 4.
  *   **Tractability:** High. Bibliometric and text-analysis tools are mature. The philosophical work is interpreting the correlation.
  *   **Neglect/Leverage:** Medium neglect. Sociology of science studies funding, but not specifically the *ontology-language* link. High leverage: This is the direct answer to your committee's goal.
  *   **5-Year Trigger:** A "Hedging Matrix" for physicists. (e.g., "For posits with Property X, use strong realist language; for Property Y, use instrumentalist language"). If the correlation between language and survival is noise, the project fails to provide guidance.

  ---

  ### The Over-Funded Line: The Metaphysical No-Miracles Argument (NMA)

  *   **What to Pass Over:** Do not fund work refining the logical structure of the No-Miracles Argument as a proof for truth.
  *   **Why It Persists:** It is the "philosopher's problem." It allows for pure conceptual analysis without engaging with the messy details of scientific practice or history. It feels like core philosophy, whereas "hedging norms" feels like service work.
  *   **Why Cut It:** It is downstream-sterile. A physicist does not care if realism is the *only* explanation for success; they care if claiming realism will get their grant funded or their theory remembered. The NMA debates truth conditions; your goal is to optimize scientific self-presentation. Funding this would consume researcher-years for a conclusion ("Realism is the best explanation") that offers no actionable advice on *how* to be a realist.

  ### The Neglected Question: The Institutional Utility of Realism

  *   **The Question:** *Does ontological commitment function as a coordination device for scientific communities?*
  *   **Why Add It:** Almost no one asks if "realism" is a tool for community building rather than a description of the world. Claiming "Dark Matter is real" may be less about the universe and more about aligning funding streams, telescope time, and hiring.
  *   **Relevance:** If realism is a coordination norm, then "hedging" is not just an epistemic risk but a *social* risk. A physicist who hedges too much might be excluded from the collaboration. Your "Hedging Protocol" (Project 4) will fail if it ignores the social cost of anti-realist language. I recommend adding a 0.5 researcher-year sub-task to Project 4 to interview grant reviewers on how they perceive hedging.

  ---

  ### The Trade-Off Statement

  You asked me to be plain about where I am trading importance for tractability.

  **I am trading Metaphysical Depth for Methodological Clarity.**

  This agenda assumes that the question "Are unobservables *really* real?" is intractable within three years and irrelevant to your downstream goal. We are treating "real" as a variable in a success function, not a property of the world.
  *   **The Risk:** We may produce a highly effective guide for "how to talk like a successful physicist" that turns out to be cynical or instrumentalist in disguise. We might optimize for *career survival* rather than *truth*.
  *   **The Justification:** With only twelve researcher-years, you cannot solve the problem of truth. You can only solve the problem of *uncertainty management*. If the output is a reasoned answer to "how much hedging is appropriate," it must be based on risk assessment (Project 1 & 4) and social/epistemic payoff (Project 3), not on metaphysical proof.

  If the committee wants truth, it needs fifty years. If it wants to help a grant-writer in fifteen years, it needs this agenda.
