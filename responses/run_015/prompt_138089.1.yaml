prompt: |-
  I work as the clinical ethics consultant for a hospital centre that performs graded neural replacement, and I need something I can actually put in front of the nursing coordinators. The intervention is what it sounds like: in patients with a rare progressive cortical degeneration, biological cortex is exchanged for functionally matched synthetic modules a few cubic millimetres at a time, each session under general anaesthesia, over something like two hundred sessions spread across eighteen to twenty-four months. It works. Patients who complete it wake up with their memories, their temperaments, their projects and their manner of speaking intact, and to anyone observing them they are the people who enrolled. None of our disputes are about whether to offer it. They are about who, precisely, is in the bed at session 140, and that question has to be answered repeatedly and under time pressure, because the answer settles whether we continue to treat the current subject as the enrolling patient for purposes of consent, advance directives, surrogate designation, resuscitation status, and the property, custody and insurance questions that families bring us. I have roughly thirty minutes per consult, the person filling in the form will usually be a senior nurse with no philosophical training, and whatever the form does not settle escalates to me and then, if money or custody is involved, to legal. So I want a written procedure: the questions in the order they should be asked, what counts as an adequate answer to each, the points at which the procedure returns a presumption against treating the current subject as the enrolling patient and stops, and the points at which it hands the decision to a human being because the issue is one of values rather than fact. Be explicit about which steps are really judgment calls wearing procedural clothing, because I would rather know that now than discover it during an audit. I would also rather have a procedure that is wrong in a known and correctable direction than one that is vague, and my committee will not accept one whose answer is always that it depends. Please skip citations, bibliographies and suggested reading altogether; I have no library access on the ward and I need the instrument, not the literature underneath it.

  The reason I am pushing for this now is that I had a long and unsatisfying argument about it last night with a friend. He holds the psychological-continuity line and thinks the graded case is trivial: each session the patient wakes up remembering the last one, behaviour and memory are preserved end to end, so of course it is the same person throughout, and anyone who says otherwise is being spooked by the anaesthesia. I found myself defending something closer to the biological-organism view, mostly on the strength of what our phenomenal-continuity interviews turn up, and a third colleague of ours says there is no further fact here at all and that survival simply comes in degrees, so that the practical question is not what happened to the patient but which statuses we should let follow the continuity. We went nowhere. So I want the procedure built to handle, at minimum, these cases: the patient at around seventy per cent replacement who revokes the advance directive he wrote before enrolling, on the ground that he no longer wants what that earlier self wanted; the reversion case, where excised tissue has been kept viable and is reimplanted after sixty per cent of the cortex has been replaced, leaving us with two candidate claimants, the mostly synthetic subject and the restored biological one; the branching case, where a patient dies intraoperatively and the team restores a full backup taken at intake into the already implanted substrate, so that the resulting subject remembers nothing after intake; the split-stream case, a patient with a prior corpus callosotomy whose two hemispheric streams are replaced on staggered schedules and who then disagree about whether to continue; the pause case, where funding lapses at forty per cent and treatment resumes years later; the substitution case, where the only modules available mid-course run several times faster than biological tissue and the resulting subject says the enrollee could not have anticipated what living at that speed would be like; and the fade case, where behaviour, memory and reported life history are all intact but from about session eighty onward the patient volunteers, reliably and without being prompted, that it has felt for some time as though someone else has been finishing his sentences for him, while our interview instrument scores him ambiguously. I would also like the procedure to say whether it treats whole-brain destructive replacement of the sort performed at a competing centre differently from the graded protocol, and what in the procedure makes the difference.

  Please ground the thing in the actual substance of those three views rather than in anything idiosyncratic, and keep the theory invisible in the form itself: the nurse should never have to know which view a question comes from. Then apply the finished procedure to three of the cases above, showing the steps as they would be gone through: the seventy per cent revocation, the reversion case where the restored biological subject contests the enrollee's will, and the split-stream case where the streams disagree. One of the three needs to be a case where the procedure gives an answer my committee will not want, and I strongly suspect that is the revocation case, since if the procedure tells us we must re-consent everyone mid-course and suspend new enrolments the programme will be damaged; if that is where it lands, say so plainly rather than softening it. Finally, tell me what the procedure cannot do. In particular, I want to know whether it is capable of settling the underlying question my friend and I were actually arguing about, whether the enrolling patient survives the series at all, or whether the most it can honestly deliver is a defensible rule for allocating consent, property and surrogacy among candidate claimants while leaving the survival question open, and how I should explain that difference to a family who wants a straight answer.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Clinical Ethics Consultant for a hospital performing graded neural replacement (GNR).
      *   **Task:** Create a written procedure (instrument) for nursing coordinators to determine patient identity/continuity status during the 200-session protocol.
      *   **Constraints:**
          *   30 minutes per consult.
          *   User: Senior nurse (no philosophical training).
          *   Output: Questions in order, adequate answers, stop points (presumption against continuity), hand-off points (value judgments), explicit identification of "judgment calls wearing procedural clothing."
          *   No citations/bibliographies.
          *   Must handle specific edge cases (Revocation, Reversion, Branching, Split-Stream, Pause, Substitution, Fade).
          *   Must address whole-brain destructive replacement vs. graded protocol.
          *   Grounded in three views: Psychological Continuity, Biological Organism, No-Further-Fact (Degrees of Survival/Pragmatic), but theory must be invisible in the form.
          *   Apply procedure to three cases: 70% Revocation, Reversion (Will Contest), Split-Stream.
          *   One application must yield an uncomfortable answer (likely Revocation).
          *   Final section: Limitations (can it settle survival vs. just allocation of rights?).
      *   **Tone:** Professional, direct, operational, ethically rigorous but practical.

  2.  **Deconstruct the Ethical/Theoretical Landscape:**

      *   *Psychological Continuity:* Focus on memory, temperament, projects, speech. If these persist, identity persists. (Friend's view).
      *   *Biological Organism:* Focus on the physical substrate. If the biology is replaced, the organism changes/dies. (User's leaning).
      *   *No-Further-Fact/Pragmatic:* Identity is a matter of degree or social convention. Focus on legal/ethical consequences rather than metaphysical truth. (Colleague's view).
      *   *The Conflict:* The procedure needs to balance these without forcing the nurse to choose a metaphysics. It needs to be a *decision rule* that prioritizes safety and legal defensibility while acknowledging the ambiguity.

  3.  **Drafting the Procedure (The Instrument):**

      *   *Goal:* A flowchart-like text that guides the nurse.
      *   *Structure:*
          1.  Pre-Check (Baseline).
          2.  Continuity Markers (Psychological).
          3.  Substrate Markers (Biological/Physical).
          4.  Volitional Markers (Consent/Will).
          5.  Decision Matrix (Green/Yellow/Red).
      *   *Hidden Theory:*
          *   Psychological questions map to Psychological Continuity.
          *   Substrate questions map to Biological Organism.
          *   "Hand-off to Ethics/Legal" maps to No-Further-Fact/Pragmatic (acknowledging the decision is normative, not factual).
      *   *Critical Design Choice:* To avoid the "always depends" trap, I need hard thresholds. However, to be honest about the "judgment calls," I need to flag where the threshold is arbitrary.
      *   *The "Uncomfortable Answer":* The prompt suggests the Revocation case might halt the program. If the procedure prioritizes *current* capacity over *past* directives when significant change is detected, it risks invalidating the whole GNR consent model. I need to make sure the procedure reflects the reality that if the person *changes*, the old consent might not bind them.

  4.  **Developing the Steps:**

      *   *Step 1: Baseline Verification.* (Is this the same body/record?)
      *   *Step 2: Psychological Continuity Check.* (Memory, Temperament, Narrative.)
      *   *Step 3: Phenomenological Dissonance.* (The "Fade" case check.)
      *   *Step 4: Substrate Status.* (How much replaced? Any branching/reversion?)
      *   *Step 5: Volitional Consistency.* (Does current will match prior will?)
      *   *Decision Rules:*
          *   If Psych = High & Substrate = Graded & Will = Consistent -> Continue.
          *   If Psych = High & Will = Revoked -> **STOP & ESCALATE** (This is the risky one).
          *   If Branching/Reversion -> **STOP & ESCALATE** (Legal/Ethics).
          *   If Phenomenological Dissonance -> **STOP & ESCALATE**.

  5.  **Refining the "Judgment Calls":**

      *   I need to explicitly state: "Question 3 looks like a fact check but is actually a value judgment about what counts as 'same temperament'."
      *   I need to flag the threshold for "Significant Change."

  6.  **Applying to Cases:**

      *   *Case 1: 70% Revocation.*
          *   Psych: Intact.
          *   Substrate: 70% synthetic.
          *   Will: Revoked.
          *   Procedure Outcome: Current capacity overrides prior directive if identity is deemed "sufficiently altered." This risks the program. I must be honest here.
      *   *Case 2: Reversion (Will Contest).*
          *   Two bodies/subjects.
          *   Procedure Outcome: Immediate suspension. Legal determination of "original." Procedure cannot solve two claimants.
      *   *Case 3: Split-Stream.*
          *   Two streams, one body (presumably, or divided care).
          *   Disagreement.
          *   Procedure Outcome: Conflict in Volitional Consistency. Escalate.

  7.  **Addressing the "Survival" Question:**

      *   The procedure *cannot* answer metaphysical survival. It answers *status allocation*.
      *   I need to write a script for the family explaining this distinction.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone Check:* Needs to be crisp. No fluff.
      *   *Constraint Check:* No citations. 30-minute limit.
      *   *Specific Constraint:* "One of the three needs to be a case where the procedure gives an answer my committee will not want." I will ensure the Revocation case triggers a "Suspend Treatment" recommendation based on current autonomy trumping prior autonomy when psychological discontinuity is suspected (even if subtle).
      *   *Specific Constraint:* "Whole-brain destructive replacement." I need a specific flag for this. Graded allows monitoring; Destructive does not. The procedure must treat Destructive as "High Risk/Presumption Against."

  9.  **Final Review against Prompt:**

      *   Did I include the specific cases? Yes (Revocation, Reversion, Split-Stream).
      *   Did I identify judgment calls? Yes.
      *   Did I explain the limitation regarding survival? Yes.
      *   Is the theory invisible? Yes, the questions ask about facts/feelings, not "psychological continuity."
      *   Is the "uncomfortable answer" plain? Yes.

  10. **Final Polish:** Ensure the distinction between "Procedure" and "Analysis" is clear. The user wants the instrument *first*, then the application. (Actually, the prompt asks for the procedure, then apply it. I will structure it logically).

      *Self-Correction on the Revocation Case:* If I make the procedure too strict on revocation, it kills the program. If I make it too loose, it violates ethics. The prompt says "I would rather have a procedure that is wrong in a known and correctable direction." The ethically safer direction (protecting the current sentient being) is the one that hurts the program. I will take that path. It aligns with the "Biological-Organism" leanings of the user (if the biology changes enough, maybe the *person* changed enough to revoke). But actually, the Psychological view usually supports the *current* mental state's authority. I will frame it as: If the patient *claims* they are different enough to revoke, we must listen.

      *Wait, one nuance:* The prompt says the user defends the Biological-Organism view. The friend defends Psychological. The procedure should probably lean towards a hybrid that protects the hospital but acknowledges the risk.
      *Decision:* The procedure will prioritize *Current Capacity* over *Prior Directives* if there is *any* reported phenomenological shift. This protects the current entity (Biological/Organism concern about new entity) but respects the current mind (Psychological). This creates the friction with the program's desire for stability.

      *Let's refine the "Whole-Brain" distinction:* Graded allows iterative consent. Whole-brain does not. The procedure must require a "Single-Point Consent Validation" for whole-brain that is stricter.

      *Okay, ready to write.*
answer: |-
  # OPERATIONAL IDENTITY AND CONSENT VERIFICATION PROTOCOL (OICVP)
  **Version:** 4.1 (Neural Replacement Division)
  **User:** Nursing Coordinators / Senior Clinical Staff
  **Time Allocation:** 30 Minutes Maximum
  **Escalation Path:** OICVP Red Flag → Clinical Ethics Consultant → Legal Counsel

  ## PURPOSE
  To determine whether the subject currently in the bed retains the moral and legal status of the Enrolling Patient (EP) for purposes of consent, advance directives, and property rights. This protocol does not determine metaphysical survival. It determines operational status.

  ## INSTRUCTIONS
  Complete Sections A through D in order. Do not skip sections. If any **STOP** condition is met, cease the protocol and contact Ethics immediately. Do not attempt to resolve **YELLOW** zones without Ethics consultation.

  ---

  ## SECTION A: BASELINE VERIFICATION (FACTUAL)
  *Goal: Confirm physical and record continuity.*

  **Q1. Does the biometric scan (retinal/fingerprint/DNA of non-replaced tissue) match the Enrolling Patient record?**
  *   **YES:** Proceed to Q2.
  *   **NO:** **STOP.** Escalate to Legal. (Indicates identity fraud or catastrophic record error).

  **Q2. Is the current session number consistent with the treatment log?**
  *   **YES:** Proceed to Section B.
  *   **NO (e.g., Treatment resumed after >6 month lapse):** Proceed to Section B, but mark "Pause Case" on cover sheet.

  ---

  ## SECTION B: PHENOMENOLOGICAL AND PSYCHOLOGICAL CONTINUITY (OBSERVATIONAL)
  *Goal: Assess continuity of memory, temperament, and self-reporting.*

  **Q3. Can the subject recount the immediate prior session without prompting?**
  *   **YES:** Proceed to Q4.
  *   **NO:** **STOP.** Escalate to Ethics. (Indicates memory break).

  **Q4. Does the subject's reported temperament and emotional baseline match the pre-operative baseline assessment (within standard deviation)?**
  *   **YES:** Proceed to Q5.
  *   **NO:** Mark **YELLOW**. Proceed to Q5.

  **Q5. (The "Fade" Check) Has the subject voluntarily reported any sense of disconnection, external control, or "otherness" regarding their thoughts or actions?**
  *   **NO:** Proceed to Section C.
  *   **YES:** **STOP.** Escalate to Ethics. (This overrides all prior "YES" answers. Reported phenomenological break is a hard stop).

  ---

  ## SECTION C: SUBSTRATE AND STRUCTURAL STATUS (PHYSICAL)
  *Goal: Assess physical continuity and branching risks.*

  **Q6. Is the replacement proceeding via the standard graded protocol (sequential, overlapping modules)?**
  *   **YES:** Proceed to Q7.
  *   **NO (e.g., Whole-brain destructive swap, simultaneous bilateral replacement):** **STOP.** Escalate to Ethics. (Graded continuity cannot be verified).

  **Q7. Is there any viable excised tissue currently stored or re-implanted elsewhere?**
  *   **NO:** Proceed to Section D.
  *   **YES:** **STOP.** Escalate to Legal/Ethics. (Indicates potential "Reversion" or "Branching" conflict).

  **Q8. Are the hemispheric replacement schedules synchronized?**
  *   **YES:** Proceed to Section D.
  *   **NO (Staggered/Independent streams):** Mark **YELLOW**. Proceed to Section D.

  ---

  ## SECTION D: VOLITIONAL CONSISTENCY (NORMATIVE)
  *Goal: Assess alignment between current will and prior directives.*

  **Q9. Does the subject affirm the original Treatment Goal and Advance Directive?**
  *   **YES:** **GREEN STATUS.** Continue Treatment.
  *   **NO (Revocation):** Proceed to Q10.

  **Q10. On what grounds is the directive revoked?**
  *   **A. "I am in pain/afraid" (Same values, changed circumstance):** Mark **YELLOW**. Escalate to Ethics.
  *   **B. "I am not the person who signed that" / "My values have fundamentally changed" (Changed values/identity):** **STOP.** Escalate to Ethics. (Current capacity overrides prior directive).

  **Q11. (If Split-Stream/YELLOW in Q8) Do both hemispheric streams (if communicable) agree on Q9?**
  *   **YES:** Mark **YELLOW**. Escalate to Ethics.
  *   **NO:** **STOP.** Escalate to Ethics.

  ---

  ## DECISION MATRIX & ESCALATION TRIGGERS

  | Result | Action | Rationale (Internal Use Only) |
  | :--- | :--- | :--- |
  | **ALL GREEN** | Continue Treatment. | Continuity presumed sufficient for operational purposes. |
  | **ANY STOP** | Suspend Treatment. Notify Ethics. | Factual discontinuity or high-risk phenomenological break detected. |
  | **ANY YELLOW** | Continue Treatment *only* if Ethics confirms via phone consult. | Zone of ambiguity requiring value judgment. |

  ---

  ## EXPLICIT JUDGMENT CALLS (AUDIT DISCLOSURE)
  *The following steps appear factual but require human judgment. Nurses must be trained that these are not objective measurements.*

  1.  **Q4 (Temperament):** There is no objective metric for "same temperament." This relies on the nurse's subjective comparison of the subject's current demeanor against chart notes. This is a **value judgment** disguised as an observation.
  2.  **Q10 (Grounds for Revocation):** Distinguishing between "changed circumstance" and "changed values" is philosophically unstable. A patient claiming "I don't want this anymore" may be interpreted as either. The procedure defaults to treating "I am not that person" as a hard stop. This privileges the **Current Self** over the **Past Self**.
  3.  **Q6 (Graded vs. Destructive):** The protocol assumes graded replacement preserves continuity better than destructive replacement. This is a **theoretical assumption**, not a proven fact.
  4.  **Q5 (Phenomenology):** We treat the patient's report of "otherness" as a hard fact, even if behavioral metrics are normal. This privileges **First-Person Authority** over **Third-Person Observation**.

  ---

  # APPLICATION OF PROTOCOL TO SPECIFIC CASES

  Below is the application of the OICVP to three of the requested scenarios.

  ### CASE 1: The 70% Revocation
  **Scenario:** Patient at Session 140 (70% replacement) revokes Advance Directive. States: "The person who signed that wanted to survive. I see now that survival isn't what I want. I am not him." Behavioral metrics are normal.

  **Protocol Walkthrough:**
  *   **Section A:** Biometrics match (non-replaced tissue). Session log consistent. (Pass)
  *   **Section B:** Recounts prior session. Temperament appears stable (Nurse assessment). No reported "otherness" (Fade check negative). (Pass)
  *   **Section C:** Graded protocol. No excised tissue. Synchronized. (Pass)
  *   **Section D:**
      *   Q9: Subject affirms original directive? **NO.**
      *   Q10: Grounds? **"I am not the person who signed that."**
      *   **Trigger:** **STOP.** Escalate to Ethics.

  **Outcome:** The procedure mandates suspension of treatment pending Ethics review.
  **Committee Impact:** This is the uncomfortable answer. If Ethics upholds the revocation based on Q10(B), the program effectively admits that at 70% replacement, the patient may be a new moral agent unbound by the enrollee's contract. This undermines the security of the initial consent for all future patients.
  **Reasoning:** The protocol prioritizes Current Capacity (Q10) over Prior Autonomy when Identity is explicitly contested by the subject. To do otherwise would be to treat the subject as a puppet of the dead enrollee.

  ### CASE 2: The Reversion (Will Contest)
  **Scenario:** 60% replacement achieved. Excised tissue was kept viable and illegally re-implanted into a cloned body. We now have Subject A (60% synthetic, original body) and Subject B (100% biological, restored from excised tissue). Subject B contests Subject A's claim to the enrollee's estate.

  **Protocol Walkthrough:**
  *   **Section A:** Biometrics match for *both* subjects (Subject B has original DNA; Subject A has original non-cortical DNA).
  *   **Section B:** Both recount prior sessions up to divergence.
  *   **Section C:**
      *   Q7: Is there viable excised tissue re-implanted? **YES.**
      *   **Trigger:** **STOP.** Escalate to Legal/Ethics.

  **Outcome:** Immediate suspension of status determination.
  **Reasoning:** The protocol is designed for a single thread of continuity. Q7 is a hard stop because the existence of two claimants moves the issue from clinical ethics to property law and metaphysical arbitration. The procedure cannot allocate rights between two "Enrolling Patients." It simply flags that the "One Patient" assumption has failed.

  ### CASE 3: The Split-Stream
  **Scenario:** Patient had prior corpus callosotomy. Hemispheres replaced on staggered schedules. Left Stream wants to continue; Right Stream (via auxiliary communication) refuses.

  **Protocol Walkthrough:**
  *   **Section A:** Pass.
  *   **Section B:** Pass (both streams communicate coherently).
  *   **Section C:**
      *   Q8: Are hemispheric schedules synchronized? **NO.**
      *   **Trigger:** Mark **YELLOW**. Proceed to Section D.
  *   **Section D:**
      *   Q11: Do both streams agree on Q9? **NO.**
      *   **Trigger:** **STOP.** Escalate to Ethics.

  **Outcome:** Suspension.
  **Reasoning:** The protocol treats the "Patient" as a singular unit of consent. When the physical substrate allows for two distinct centers of volition that disagree, the "One Patient" assumption is violated. The procedure cannot decide which stream holds the proxy for the whole.

  ---

  # LIMITATIONS AND EXPLANATORY SCRIPT

  ### What This Procedure Cannot Do
  This instrument **cannot** settle the question of whether the Enrolling Patient survives the series. It is not a metaphysical detector. It is a risk-management tool designed to allocate consent, property, and surrogacy among candidate claimants while leaving the survival question open.

  *   It cannot tell you if the person at Session 200 is *really* the person from Session 1.
  *   It cannot resolve the "No-Further-Fact" debate.
  *   It cannot protect the hospital from a lawsuit if a court decides the "Survivor" is a different legal entity than the "Enrollee."

  ### Distinction: Graded vs. Whole-Brain Destructive
  The procedure treats Whole-Brain Destructive Replacement differently (Section C, Q6).
  *   **Graded:** Allows for iterative verification (Sections B & D). We can check continuity at every step.
  *   **Destructive:** No iterative check is possible. The transition is instantaneous.
  *   **Difference:** In Graded, we presume continuity unless a **STOP** trigger is hit. In Destructive, the protocol presumes **discontinuity** unless Legal has pre-authorized a "Single-Point Transfer" of rights. The procedure forces a hard stop on Destructive cases because we cannot verify the "Fade" or "Temperament" during the transition.

  ### Script for Families
  *When a family asks: "Is my loved one still in there?"*

  > "Our protocol is designed to ensure that the person in the bed has the right to make decisions for themselves. We check their memories, their feelings, and their wishes at every step. If they tell us they are still the same person, and their memories hold up, we treat them as such for medical and legal purposes.
  >
  > However, science cannot prove exactly what happens to the 'soul' or the 'self' during this exchange. Our procedure ensures that if the person in the bed says 'I am changed,' we listen to them, not just to the paperwork signed months ago. We can guarantee we are treating the person in front of us with respect. We cannot guarantee they are metaphysically identical to the person who walked in on Day 1. No one can."

  ### Final Note on the "Uncomfortable Answer" (Case 1)
  You asked for honesty regarding the Revocation Case. If the procedure is followed, a patient at 70% replacement *can* void the program's contract by claiming identity change.
  *   **Why this is correct:** If we ignore a competent patient's claim that "I am not the enrollee," we are practicing battery on a potentially new moral agent.
  *   **Why this damages the program:** It makes the initial contract voidable at any point.
  *   **Recommendation:** Do not soften the protocol to protect the program. If the program relies on binding people who claim they have changed, the program is ethically fragile. It is better to know this now than during a public inquest. The "Biological-Organism" view you lean toward suggests that as the biology changes, the organism changes. If the organism changes, the original consent may not bind the new organism. The protocol respects this by allowing the Current Subject to speak for the Current Organism.
