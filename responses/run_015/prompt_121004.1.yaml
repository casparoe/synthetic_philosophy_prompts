o along with me if I'm being an idiot: if importing ecological dynamics into normative philosophy is a category mistake, or if the premise that 'tolerance is like immune response' is just confused analogy-mongering, say it plainly. Don't be polite about it. No need for a bibliography or citation list — I'll fill that in. There's probably a typo or two in this message, sorry about that.
