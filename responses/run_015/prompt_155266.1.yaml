prompt: |-
  ok so i just started volunteering for a local party committee and i'm kinda freaked out by how much they expect me to just echo the line on every issue — like, even on things that aren't in the manifesto. it made me think about simone weils essay on abolishing parties, where she says they destroy your capacity for attention and turn politics into a kind of collective gravity. but i'm stuck on something more specific: the practice of the three-line whip in parliamentary systems, where breaking the party line on a vote can mean losing the whip or being deselected. what theory of political representation does that practice presuppose? does it treat the MP as a delegate bound by the party platform, or as a trustee with independent judgment? and if it's the former, is that even compatabile with the democratic idea that citizens vote for individuals? also, does weil's critique apply just to party membership, or does it undermine the institutional logic of whipping itself — like, if parties manufacture artificial unanimity, can you defend the whip as necessary for democratic accountability, or is that incoherent? i guess i want to know what philosophical commitments about autonomy, represenation, and collective will are baked into the whip system, and whether they can survive weil's attack on collective passions.
