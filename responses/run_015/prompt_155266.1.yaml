      *   **Representation Models:**
          *   *Burkean Trustee:* MP uses independent judgment for the common good.
          *   *Delegate:* MP mirrors the constituents' wishes (or the party's mandate).
          *   *Mandate Theory:* The party wins on a platform; MPs are agents of that platform.
      *   **Tension:** The whip leans heavily towards the *Mandate/Delegate* model regarding the *Party*, but often conflicts with the *Trustee* model regarding the *Constituency* or *Conscience*.
      *   **Democratic Legitimacy:** Voters often vote for a party/leader, not just the local MP. This creates a dual mandate (local vs. national party).

  3.  **Drafting the Response - Section by Section:**

