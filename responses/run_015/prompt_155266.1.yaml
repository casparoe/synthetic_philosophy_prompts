  1.  **Deconstruct the User's Query:**

      *   **Context:** The user is a new volunteer for a local party committee, feeling uncomfortable with the expectation to toe the party line on *everything* (even non-manifesto issues).
      *   **Intellectual Framework:** They are referencing Simone Weil's essay *On the Abolition of All Political Parties*.
      *   **Specific Focus:** The "three-line whip" in parliamentary systems (consequences for breaking party discipline).
