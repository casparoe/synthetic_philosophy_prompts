answer: |-
  Your gut is not inconsistent; it is highly sensitive to **Activity Types**. You are intuitively switching rulebooks depending on whether the interaction is informational, relational, or institutional.

  There is no single Gricean rule that covers "normal talk," "institutional speech," and "ritual politeness" equally because they have different **goals**. Grice's Cooperative Principle assumes the goal is *information exchange*. When the goal shifts to *social bonding* or *corporate signaling*, the maxims change.

  Here is the unifying principle that saves your intuitions, followed by the one verdict you need to drop.

  ### The Unifying Principle: Norms of the Activity Type
  Linguist Stephen Levinson expanded Grice's work by arguing that speech is governed by the **Activity Type** (e.g., a courtroom trial, a coffee chat, a therapy session, a corporate FAQ).
  *   **Informational Activities** (Classroom, Therapy, Fact-Checking): The Maxim of **Quality** (Truth) and **Quantity** (Informative) dominate.
  *   **Relational Activities** (Parties, Hallway Chats): The Maxim of **Politeness** and **Phatic Communion** (social bonding) dominate. Truth is secondary to harmony.
  *   **Institutional Activities** (Chatbots, PR): The goal is **Signaling** or **Compliance**. Truth is often irrelevant; the goal is to project an image.

  ### Analyzing Your Cases

  **1. "Some students passed" (when all did) $\rightarrow$ Misleading**
  *   **Activity:** Informational.
  *   **Mechanism:** **Scalar Implicature.** "Some" sits on a scale <All>. By choosing the weaker term, you implicate the stronger term is false.
  *   **Verdict:** Correct. You violated the Maxim of Quantity.

  **2. "The report is mostly accurate" (one tiny error) $\rightarrow$ Okay**
  *   **Activity:** Professional/Informational (with liability).
  *   **Mechanism:** **Hedging / Modesty Maxim.** Unlike "some," "mostly" is vague. Using it here isn't to hide information, but to manage expectations and avoid over-promising (a cooperative move in a professional context).
  *   **Verdict:** Correct. This adheres to a *professional* norm of caution, not a logical norm of precision.

  **3. & 4. "I'm not angry" (Roommate vs. Therapist)**
  *   **Activity:** Relational (Roommate) vs. Clinical (Therapist).
  *   **Mechanism:** **Contextual Parameters.**
      *   *Roommate:* The tone and context (broken mug) contradict the words. The hearer assumes you are cooperative, so they infer the words are ironic. Implicature: "I am furious."
      *   *Therapist:* The activity type demands literal truth. Tone is data, but words are the primary vehicle.
  *   **Verdict:** Correct. The *Activity Type* dictates which channel (tone vs. text) carries the truth value.

  **5. Chatbot: "We value your feedback" (no mechanism)**
  *   **Activity:** Institutional Signaling.
  *   **Mechanism:** **Bullshit (Harry Frankfurt).** This is not a lie (which requires intent to deceive about truth) and not implicature. It is a statement made with *indifference to truth*. Its function is to signal "We are a benevolent company," not to describe database architecture.
  *   **Verdict:** It is a **third thing**. Calling it a "lie" gives it too much credit; calling it "implicature" assumes it's cooperative. It is **Phatic/Performative**.

  **6. "Let's grab coffee sometime" (Never intend to)**
  *   **Activity:** Ritual Politeness.
  *   **Mechanism:** **Phatic Communion.** The utterance is a social handshake, not a proposal. Everyone in the culture knows the "truth conditions" are suspended.
  *   **Verdict:** It is **Social Noise**, not a false implicature. If you analyze it as a promise, it's a lie. If you analyze it as a greeting, it's true.

  **7. Meeting starts 3:05, say "3:00" (Culture knows the lag)**
  *   **Activity:** Cultural Coordination.
  *   **Mechanism:** **Loose Use / Semantic Shift.** In this context, "3:00" *means* "3:00 scheduled time," which conventionally equates to "3:05 start."
  *   **Verdict:** **This is the one you need to drop/revise.** You asked: *"Is the punctuality implicature canceled... or am I still being sneaky?"*
      *   **Correction:** You are **not being sneaky**. If the shared knowledge is that "3:00 means 3:05," then saying "3:00" is literally true *within that dialect*. It is not an implicature; it is the local semantic meaning. To say "3:05" would actually be *confusing* (implying a 3:05 scheduled start).

  ### The Verdict You Must Drop
  You need to drop the suspicion in **Case 7 (The Meeting)**.

  If the lateness is common knowledge, the word "3:00" has shifted its reference. You are not canceling an implicature; you are speaking the local language. Thinking you are being "sneaky" assumes a universal standard of punctuality that does not exist in that context.

  ### The Verdict You Must Reclassify
  You need to stop analyzing **Case 5 (Chatbot)** and **Case 6 (Coffee)** as truth-claims.
  *   If you force them into a Gricean "Truth/Lie" box, they are lies.
  *   But your gut says they feel different than a straight lie. That's because they are **Phatic**. They are not trying to convey information; they are trying to maintain a connection (Coffee) or a brand image (Chatbot).

  ### Summary
  You are not inconsistent. You are a **Contextualist**.
  *   **Informational contexts** $\rightarrow$ Grice's Maxims (Truth/Quantity).
  *   **Relational contexts** $\rightarrow$ Politeness/Phatic Maxims (Harmony).
  *   **Institutional contexts** $\rightarrow$ Signaling Maxims (Image).

  **The Principle:** *An utterance is evaluated against the normative goals of the specific Activity Type.*
  **The Fix:** Stop calling the meeting time "sneaky" (it's local truth), and stop calling the coffee invite a "false implicature" (it's a ritual).
