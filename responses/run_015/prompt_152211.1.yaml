answer: |-
  To treat the self as a center of narrative gravity (CNG) adequately is to claim that the self is a real pattern with explanatory power, despite lacking substantial ontological status. It is not merely a metaphor for how we speak, but a specification of how agency and identity are constituted. For a theory to succeed, it must navigate between the Scylla of substance dualism (positing a hidden ego) and the Charybdis of eliminativism (denying the self exists at all). The following desiderata specify the conditions under which a CNG theory counts as adequate.

  ### I. Non-Negotiable Desiderata
  *These requirements are essential. Abandoning any of them collapses the view into a rival ontology.*

  **1. Ontological Innocence with Causal Efficacy**
  *   **Requirement:** The theory must explain how an abstract locus (the CNG) can exert causal influence on behavior and physiology without positing a homunculus or ghost in the machine. The narrative must not just describe the system; it must be part of the control loop.
  *   **Motivating Case:** *Mere Behavioral Coherence.* A thermostat exhibits behavioral coherence (temperature regulation) but has no self. A CNG theory must distinguish the self-narrative from simple feedback loops. The narrative must function as a control parameter that constrains future states. If the narrative is epiphenomenal (a mere report on what the brain did), the view collapses into eliminativism.

  **2. Diachronic Bridging without Substance**
  *   **Requirement:** The theory must account for the persistence of the self across interruptions in consciousness (sleep, anesthesia, coma) without appealing to an underlying continuous substance (like a soul or an unchanging neural core). Continuity must be established via narrative reconstruction upon waking.
  *   **Motivating Case:** *Sleep and Anesthesia.* When consciousness ceases, the narrative stops. Upon waking, the agent claims to be the same person. An adequate theory must explain this as a "handshake" protocol where the post-interruption narrative successfully grafts onto the pre-interruption story, rather than a metaphysical thread that persisted in the dark.

  **3. Phenomenological Integrity**
  *   **Requirement:** The theory must respect the first-person experience of unity and agency, even if it explains them as constructed. It cannot dismiss the *feeling* of being a self as a total illusion, or it becomes eliminativist.
  *   **Motivating Case:** *Dissociative Fragmentation.* In dissociative identity structures, the patient experiences distinct centers of agency. A CNG theory must explain this not as multiple souls, but as multiple, competing narrative gravities vying for control of the same organism, where the "failure" of unity is a failure of narrative integration, not a metaphysical multiplication of substances.

  ### II. Niche Pressure Point Desiderata
  *These criteria address the specific stress tests defined in your prompt. Failure here renders the theory theoretically fragile.*

  **4. Shear Zone Tolerance (The Multiplicity Constraint)**
  *   **Requirement:** The theory must accommodate states where two competing narrative centers within one organism exert unequal gravitational pull on the same behavioral output, without reducing one to the other or positing a superordinate integrator that resolves the conflict.
  *   **Motivating Case:** *Narrative Shear Zones.* Consider an agent acting under conflicting deep commitments (e.g., a religious vow vs. a parental instinct) where neither narrative subsumes the other, and no higher "true self" adjudicates. The behavior is a vector sum of competing gravitational pulls.
  *   **Adequacy Condition:** The theory must allow the "center" to be a dynamic equilibrium that can temporarily bifurcate. If the theory insists on a singular CNG at all times, it fails to describe the phenomenology of acute internal conflict without smuggling in a hidden arbiter.

  **5. Ballast Integration (The Authenticity Constraint)**
  *   **Requirement:** The theory must explain how externally authored narrative structures (institutional roles, algorithmic profiles) stabilize the agent's center of gravity without collapsing the distinction between imported and self-generated gravity.
  *   **Motivating Case:** *Counter-Narrative Ballast.* An individual may adopt a professional persona or an algorithmic identity (e.g., a credit score or social media profile) that dictates behavior more rigidly than internal introspection.
  *   **Adequacy Condition:** The theory must specify a mechanism of *appropriation*. Imported ballast becomes part of the CNG only when the agent's internal narrative processes utilize it as a premise for future action. If the theory counts any external constraint as part of the self, it dissolves the boundary between the agent and the environment. If it counts none, it ignores how social scaffolding constitutes identity.

  **6. Gradient Dissolution (The Death Constraint)**
  *   **Requirement:** The theory must account for the weakening or dissolving of the CNG over time (e.g., neurodegeneration) without producing a sudden metaphysical death of the self.
  *   **Motivating Case:** *Gravitational Decay.* In progressive dementia, the narrative capacity degrades slowly. A substance view implies the self is either present or gone. A CNG view must treat the self as fading in intensity or coherence.
  *   **Adequacy Condition:** The theory must define the self as a matter of degree. There must be a threshold of narrative coherence below which moral and legal responsibility dissolves, but this threshold must be pragmatic, not ontological. The self does not "die" at a specific moment; the gravity well shallows until it can no longer hold orbit.

  ### III. Flagged Tensions and Incompatibilities
  *The following pairs of desiderata generate significant theoretical tension. An adequate theory must explicitly negotiate these trade-offs rather than ignoring them.*

  **Tension A: Shear Zone Tolerance vs. The Unity Intuition**
  *   **Conflict:** Desideratum 3 (Phenomenological Integrity) often relies on the intuition that the self is a *single* center. Desideratum 4 (Shear Zone Tolerance) requires admitting multiple, irreducible centers within one organism.
  *   **Implication:** A theory that fully satisfies Shear Zone Tolerance risks abandoning the idea of *a* center of narrative gravity in favor of *centers*. To maintain the singular "CNG" terminology while satisfying Shear Zones, the theory must define the "center" as a virtual point that can split, akin to a binary star system being treated as a single gravitational locus for external observers but two for internal dynamics. If this distinction is not made, the theory contradicts itself.

  **Tension B: Ballast Integration vs. Authenticity**
  *   **Conflict:** Desideratum 5 (Ballast Integration) requires incorporating external narratives to stabilize the self. However, strong authenticity conditions (often tied to Desideratum 3) suggest that for a narrative to be *mine*, I must author it.
  *   **Implication:** If a theory integrates Counter-Narrative Ballast too aggressively (e.g., claiming my algorithmic profile is part of my CNG), it risks making the self heteronomous (ruled by another). If it is too restrictive, it fails to explain how social roles constitute identity. An adequate theory must distinguish between *scaffolding* (external support for internal narrative) and *substitution* (external narrative replacing internal agency).

  ### IV. Camp-Specific Preferences
  *These are optional theoretical commitments. Abandoning them does not collapse the view, but adopting them places the theory in a specific sub-school.*

  **1. Linguistic Expressibility**
  *   **Preference:** The requirement that all narrative elements be linguistically expressible.
  *   **Status:** *Optional.* Dennett's original formulation leans heavily here, suggesting the self is a "fiction" told in language. However, embodied-cognition variants argue that pre-linguistic sensorimotor narratives can constitute a CNG. An adequate theory need not demand full linguistic articulation, only structural coherence.

  **2. Narrative Determinism**
  *   **Preference:** The claim that the narrative fully determines the action.
  *   **Status:** *Optional.* A theory can allow for stochastic elements or non-narrative impulses that the CNG subsequently rationalizes. Requiring strict determinism makes the theory vulnerable to neuroscientific counter-examples where action precedes conscious narration.

  **3. The "Fiction" vs. "Real Pattern" Distinction**
  *   **Preference:** Whether to emphasize the "fictional" nature of the self (Dennett's rhetoric) or the "real pattern" status (informational ontology).
  *   **Status:** *Rhetorical.* Both can satisfy the non-negotiables. However, emphasizing "fiction" risks sliding into eliminativism in the public understanding, while "real pattern" risks reification.

  ### V. Brief Evaluation of Existing Variants

  **Dennett's Original Formulation:**
  Dennett's account scores highly on *Ontological Innocence* and *Diachronic Bridging*. It successfully avoids substance dualism by treating the self as a benign user-illusion. However, it struggles with *Shear Zone Tolerance*. Dennett tends to smooth over fragmentation, assuming the brain's competitive processes eventually yield a single "draft" that becomes the narrative. This makes it difficult for his view to accommodate irreducible, simultaneous competing centers without implying one is the "real" self and the other a glitch. It also leans heavily on the *Linguistic Expressibility* preference, which limits its application to pre-linguistic infants or non-human animals.

  **Dynamical-Systems Extension:**
  Recent variants treating the CNG as an attractor state in a neural dynamical system fare better on *Gradient Dissolution* and *Shear Zone Tolerance*. By modeling the self as a basin of attraction, they can mathematically represent bifurcation (shear) and shallowing basins (decay). However, they risk failing *Causal Efficacy*. If the narrative is just a description of the system's trajectory, it is unclear how the "story" exerts top-down control. There is a constant danger here of sliding into eliminativism, where the "narrative" is merely a post-hoc label for neural dynamics, failing the *Phenomenological Integrity* test.

  ### Summary of Adequacy
  To be adequate, a Center of Narrative Gravity theory must demonstrate that the "center" is a functional necessity for the organism's coordination, not just a retrospective story. It must allow the center to fracture (Shear), to be bolstered by external props without losing agency (Ballast), and to fade without vanishing (Decay). It must walk the tightrope where the self is real enough to bear responsibility but abstract enough to avoid metaphysical baggage. Any theory that solidifies the center into a thing, or dissolves it into nothing, fails the specification.
