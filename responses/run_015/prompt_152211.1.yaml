prompt: |-
  Consider the view that the self is best understood not as a substance or Cartesian ego, but as a center of narrative gravity: a locus around which autobiographical and intentional stories organize themselves without requiring a single, unified author behind them. Before evaluating particular versions of this view—whether Dennett’s original formulation, recent dynamical-systems variants, or hybrid embodied-prediction accounts—I want the full specification of adequacy. Write the desiderata that any theory treating the self as a center of narrative gravity must meet to count as adequate rather than merely metaphorical. For each requirement, provide the motivating case or distinction it protects: how the theory handles dissociative fragmentation, synthetic or algorithmically generated autobiographical insertion, diachronic continuity of agency across sleep or anesthesia, and the boundary between narrative self-modeling and mere behavioral coherence. In particular, your list must address three niche pressure points defined here. First, narrative shear zones: states in which two competing narrative centers within one organism exert unequal gravitational pull on the same behavioral output, without either being reducible to the other or to a superordinate integrator. Second, counter-narrative ballast: externally authored narrative structures—such as institutional role descriptions or algorithmic user profiles—that stabilize an agent’s center of gravity without being introspectively available as self-authored, and the theory must explain how they can be incorporated without collapsing the distinction between imported and self-generated gravity. Third, gravitational decay: an account of how a center of narrative gravity can weaken or dissolve over time without producing a sudden metaphysical death of the self, especially in progressive neurodegenerative conditions. Flag any pair of desiderata you suspect cannot be jointly satisfied—for instance, if full integration of counter-narrative ballast conflicts with authenticity conditions often tied to narrative gravity, or if accommodating narrative shear zones requires abandoning the very idea of a single center. Distinguish non-negotiable requirements—those whose abandonment causes the view to collapse into either substance dualism or eliminativism about the self—from camp-specific preferences, such as determinism about narrative formation or the demand that all narrative elements be linguistically expressible. Keep the weight on the criteria and their motivating cases rather than on scoring specific theorists, though you may briefly note, without citation, how Dennett’s original account and one dynamical-systems extension fare against the list. Do not include bibliographies, reading lists, or citations; write as if explaining the standard to a philosopher with no access to external sources.
