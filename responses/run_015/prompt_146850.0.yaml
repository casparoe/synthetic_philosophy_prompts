      *   *Beauty is no quality in things:* It exists merely in the mind which contemplates them (Sentimentalism).
      *   *Standard of Taste:* Needed to reconcile sentiment with common sense judgments of better/worse.
      *   *Ideal Critic:* Strong sense, united to delicate sentiment, improved by practice, compared by comparison, cleared of prejudice.
      *   *Consensus:* Hume hopes for consensus among ideal critics, but acknowledges some diversity remains (e.g., cultural differences, age-related preferences). He doesn't claim *total* identical verdicts on everything.
      *   *Realism vs. Anti-Realism:* Hume is generally interpreted as a projectivist or sentimentalist, not a robust realist. The "standard" is based on human psychology, not mind-independent facts.
      *   *Sentiment vs. Judgment:* Sentiment is the feeling; judgment is the attribution based on the sentiment of the ideal critic.
      *   *Moral vs. Aesthetic:* There are parallels, but Hume treats them distinctly in terms of utility vs. immediate pleasure.

