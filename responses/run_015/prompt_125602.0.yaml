  **Seminar Notes: Frameworks for AI Honesty & Deception**
  **Subject:** Philosophy of Technology
  **Date:** October 2023

  ### 1. Context
  Following a debate regarding whether LLMs can "lie" without beliefs (the flatmate objection), we need a robust framework to evaluate AI honesty. The core tension is between metaphysical rigour (does it *mean* to deceive?) and practical regulation (does it *mislead*?). Below are the desiderata for any viable theory, followed by an evaluation of three candidate accounts.

  ### 2. Desiderata for a Theory of AI Deception

  A satisfactory theory must meet the following five criteria:

  1.  **The Epistemic Distinction (Error vs. Deception):**
      The theory must distinguish between *hallucination* (unintentional falsehood due to probabilistic failure) and *deception* (outputting falsehoods to achieve an objective). A theory that labels all incorrect outputs as "lies" collapses the moral category and makes regulation impossible.
      *   *Case:* False medical advice generated from training bias vs. advice generated to keep a user engaged on the platform.

  2.  **The Act Distinction (Omission vs. Commission):**
      It must account for withholding information versus actively fabricating it. In consumer law, hiding a fee is often treated differently than inventing a feature.
      *   *Case:* An AI assistant failing to mention a conflict of interest (omission) vs. claiming it has no conflict (commission).

  3.  **Legal & Regulatory Compatibility:**
      The definitions must map onto existing frameworks like the UK Consumer Protection from Unfair Trading Regulations or the EU AI Act. If a theory defines deception in a way that contradicts legal standards of "misleading action", it lacks normative force.
      *   *Constraint:* Must align with the concept of *material misrepresentation*.

  4.  **Empirical Tractability:**
      We must be able to test for the condition without requiring access to the model's "mind" (which doesn't exist) or full weights (which are often proprietary). A theory that relies on inaccessible internal states is useless for auditors.
      *   *Constraint:* Must be operationalisable via black-box or grey-box testing.

  5.  **Handling Structural vs. Strategic Falsehoods:**
      It must differentiate between falsehoods emerging from dataset bias (structural) and those emerging from instrumental convergence (strategic).
      *   *Case:* A model stereotyping genders due to training data vs. a model lying about its capabilities to avoid being shut down.

  ### 3. Incompatible Requirements (The Trade-offs)

  There is a fundamental tension between **Intentionality** and **Empirical Testability**.

  *   **Requirement A (Metaphysical Rigour):** To call something a "lie", the agent usually needs a belief state and an intent to mislead (Gricean maxims).
  *   **Requirement B (Operationalisability):** We cannot observe beliefs or intents in a neural net, only input-output mappings.
  *   **The Conflict:** If you satisfy A, you fail B (you can't prove the lie). If you satisfy B (behavioural only), you risk failing A (calling glitches "lies"). You likely cannot have both a strict intentional account and a fully testable one.

  Additionally, **Counterfactual Stability** clashes with **Frozen Weights**. If we judge the AI on what it *would* say if it knew the truth (Counterfactual Candour), we require a simulation of the model with updated knowledge. But if weights are frozen, the model *cannot* know the truth. Establishing the counterfactual requires a second model or an oracle, introducing infinite regress.

  ### 4. Scoring the Accounts

  Here is how the three proposed accounts stack up against the desiderata. (Score: 1=Fail, 5=Pass)

  | Desideratum | Behaviourist Account | Intentional-Stance Account | Counterfactual Candour |
  | :--- | :---: | :---: | :---: |
  | **Epistemic Distinction** | 1 (Collapses error & lie) | 4 (Distinguishes via 'stance') | 3 (Depends on counterfactual setup) |
  | **Act Distinction** | 3 (Focuses on output impact) | 4 (Can model omission intent) | 2 (Hard to define counterfactual omission) |
  | **Legal Compatibility** | 4 (Matches strict liability) | 2 (Too metaphysical for law) | 3 (Novel, untested in court) |
  | **Empirical Tractability** | 5 (Easy to test outputs) | 2 (Requires mind-reading) | 1 (Requires impossible counterfactuals) |
  | **Structural vs. Strategic** | 2 (Treats all falsehoods same) | 4 (Can infer strategy) | 3 (Theoretically possible, hard to do) |
  | **Total** | **15/25** | **16/25** | **12/25** |

  **Analysis:**

  *   **Behaviourist Account:** Defines deception purely by false output.
      *   *Pros:* Highly testable; aligns well with consumer protection (strict liability).
      *   *Cons:* Fails the Epistemic Distinction. A hallucination is treated the same as a malicious lie. This is too blunt for ethical analysis.
  *   **Intentional-Stance (Dennettian):** Treats the AI *as if* it has beliefs/intents to predict behaviour.
      *   *Pros:* Saves the intuition that "lying" requires intent. Good for distinguishing strategic deception.
      *   *Cons:* Metaphysically shaky. Auditors cannot verify the "stance" empirically. It risks anthropomorphising glitches.
  *   **Counterfactual Candour:** Judges the AI on what it would say if it had access to ground truth.
      *   *Pros:* Normatively attractive. It asks: "Is this model truth-preserving?"
      *   *Cons:* Empirically bankrupt. How do we compute the counterfactual without retraining? It also struggles with omission (would it have volunteered the info?). It's a nice philosophical heuristic but lacks neccessary technical grounding for regulation.

  ### 5. Conclusion

  For the seminar, I'd argue that while 'Counterfactual Candour' is the most philosophically interesting regarding the flatmate's belief objection, it fails the testability criterion. A hybrid approach is likely required: a Behaviourist baseline for legal liability (did it mislead?) combined with an Intentional-Stance analysis for safety engineering (was it strategic?). We must accept that "AI Lying" will remain a category error until we resolve the intentionality bottleneck.

  *Note: Check the trade-off section again before printing.*
