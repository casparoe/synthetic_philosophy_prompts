answer: |-
  You are right, and your friend is reaching for a hammer when the problem is a screw. Your intuition that this is distinct from the standard "Tragedy of the Commons" is theoretically sound.

  The standard Tragedy of the Commons (as formalized by Garrett Hardin) is a **Prisoner's Dilemma**. In that game, defecting (overgrazing) is the *dominant strategy*. It is always individually rational to take more, regardless of what anyone else does. The tragedy is inevitable because the incentive structure is broken from the start.

  Your woodlot scenario is not a Prisoner's Dilemma. For decades, the incentive structure worked: people preferred to take only two loads *provided* others did the same. This is an **Assurance Game** (often called a **Stag Hunt**). In this game, there are two equilibria:
  1.  **Cooperative Equilibrium:** Everyone restrains, the resource thrives, everyone is best off.
  2.  **Defective Equilibrium:** Everyone grabs, the resource collapses, everyone is worse off.

  Which equilibrium the group occupies depends entirely on **beliefs**. If I believe you will restrain, my best move is to restrain. If I believe you will grab, my best move is to grab (because if I restrain while you grab, I get nothing *and* the lot dies anyway).

  The phenomenon you are describing is the sudden, belief-driven flip from the Cooperative Equilibrium to the Defective Equilibrium. While game theorists might call this a "shift in equilibrium," that is dry. The economic mechanism is identical to a bank run, but applied to a physical common-pool resource.

  There isn't a single, universally canonical noun for this specific failure mode in the way "Tragedy of the Commons" exists, but the most precise existing framing is **"A Coordination Run on a Common-Pool Resource."**

  However, since you asked for a carving and a name that captures the edges, I propose we call this **"The Assurance Run."**

  Here is the carving. For a situation to count as an **Assurance Run**, it must meet four specific criteria. If it fails any of them, it is merely a standard Tragedy of the Commons or a different type of crisis.

  ### The Carving of the Assurance Run

  **1. The Sustainability Baseline**
  The resource must be capable of sustaining the *normal* level of usage indefinitely.
  *   *Why:* In a standard Tragedy of the Commons, the resource is often on a slow decline even during "good" times because the incentive to overconsume is always present. In an Assurance Run, the system is stable until the belief shock. The woodlot was fine for years; the coffee machine was fine for months.
  *   *Edge:* If the resource was already dying due to gradual overuse, a sudden rush is just the *coup de grâce*, not an Assurance Run.

  **2. Conditional Cooperation (The Assurance Game Structure)**
  Agents must prefer cooperation *if* they are assured others will cooperate. They are not inherent defectors.
  *   *Why:* This distinguishes it from Hardin's Commons. In your village, nobody *wanted* to strip the lot as a first choice. They defected defensively.
  *   *Edge:* If the villagers were secretly greedy and just waiting for an excuse, that's a Prisoner's Dilemma masked as a rumor. The key is that the preference order actually flips based on expectation.

  **3. The Belief Trigger**
  The shift to defection must be caused by a change in *expectation*, not necessarily a change in *physical reality*.
  *   *Why:* The rumor about the parish selling the land was false. The email about budget cuts was irrelevant. The physical constraints didn't change; the mental model did.
  *   *Edge:* This addresses your question about "true beliefs." If the parish *was* actually selling the land, does it still count? **Yes.** The mechanism is the same. The *belief* (whether true or false) triggers the rush. The damage is done by the *timing* of the extraction, not the legitimacy of the fear. If the sale was going to happen in December, but the rumor causes the trees to be cut in January, the *rush* destroyed the value, not the sale.

  **4. The Self-Fulfilling Causality**
  The defensive action must be the primary cause of the scarcity.
  *   *Why:* In a bank run, the bank fails *because* people withdraw, not because the bank was insolvent to begin with. In your woodlot, the lot was stripped *because* people thought it would be stripped.
  *   *Edge:* This addresses your footpath/wiki question. Yes, this counts. A footpath is a resource maintained by light use (erosion is kept in check). If a rumor spreads that "this path is closing for construction," a rush of hikers might erode the path so badly it *must* close. The belief in the closure caused the closure. The resource is "maintenance-dependent" rather than "stock-dependent," but the dynamic holds.

  ### Why "Tragedy of the Commons" is the wrong label

  Using "Tragedy of the Commons" here is not just imprecise; it prescribes the wrong solution.
  *   **If it's a Tragedy (Prisoner's Dilemma):** You need enforcement, privatization, or regulation. You cannot trust the users.
  *   **If it's an Assurance Run (Stag Hunt):** You need **communication and trust restoration**. The users have already proven they can manage the resource (decades of stability). The problem isn't greed; it's fractured coordination.

  Privatizing the woodlot because of an Assurance Run is like locking the bank vault because of a rumor. It solves the symptom by destroying the system's liquidity (or in this case, its communal utility).

  ### Summary Definition

  **The Assurance Run:** *A failure mode in a common-pool resource where a stable, cooperative equilibrium is shattered by a shock to mutual expectations. Agents preemptively defect not out of inherent greed, but to avoid being left with nothing, thereby creating the scarcity they feared. The resource is destroyed by the timing of extraction, not the volume of sustainable demand.*

  Your friend is looking at the *resource* (the wood). You are looking at the *system* (the trust). The wood didn't change; the system did. You are describing a **Coordination Run**.
