answer: |-
  This is a profound inquiry that cuts to the heart of how we navigate the world of artifacts. As a metaphysician who has spent time in conservation labs, I can tell you that conservators are often practical metaphysicians, even if they do not use the jargon. Their decisions commit them to a specific ontology of artifacts. Below is a reconstruction of the implicit metaphysics governing the practice you described.

  ### 1. The Presupposed Theory of Material Constitution

  The practice you describe explicitly rejects the view that the statue is **identical** to the original lump of matter (the "clay"). If the statue were identical to the original matter, then the replacement of even a single atom would strictly speaking result in the cessation of the original object and the creation of a new one. Since the museum labels the object as the *same* work after intervention, the practice presupposes a **Constitution View** (or a closely related "Dominant Kind" view).

  On this view, the statue and the matter coincide spatially but are distinct entities. The matter *constitutes* the statue at a time, but the statue is not reducible to that matter. This allows for **diachronic flexibility**: the statue can persist through changes in its constituting matter.

  Regarding persistence through partial replacement, the practice presupposes that identity does **not** require strict material continuity. It rejects "Mereological Essentialism" (the view that all parts are essential to the whole). However, it also rejects the idea that material continuity is irrelevant. Norm 3 (the intuition of a limit) implies that while *some* material replacement is compatible with identity, *total* or *radical* replacement is not.

  Therefore, the implicit theory is a form of **Moderate Material Continuity**. The object persists so long as there is a continuous spatiotemporal history of the object's existence, anchored by a "critical mass" of original material or structure. The identity of the statue is tied to its **history of production and preservation**, not merely its current atomic composition.

  **Conceptual Judgment:** It is a matter of philosophical interpretation whether this is a "four-dimensionalist" view (the statue is a spacetime worm with different matter-stages) or a "three-dimensionalist" view (the statue endures and changes its properties). The practice itself does not dictate a stance on the ontology of time, only on the ontology of the object's relation to its parts.

  ### 2. Reconciling Persistence with the Value of Original Matter

  You have identified the central tension: If the statue persists through material change, why does the original matter possess a special "authenticity" value that new matter lacks? If matter is interchangeable for the sake of identity, why is it not interchangeable for the sake of value?

  The implicit theory reconciles this by distinguishing between **Identity Conditions** and **Value Conditions** (or "Aura," to borrow a term from Walter Benjamin, though we need not cite him).

  *   **Identity** is determined by *historical continuity*. The statue is the same object because there is an unbroken causal chain from the artist's hand to the present display, maintained by conservation.
  *   **Value** is determined by *historical witness*. The original matter is the physical trace of the artist's action and the object's history.

  The reconciliation works like this: The statue is a **historical individual**. Its essence includes its origin (the artist's act on specific matter). When a conservator replaces a part, they are sustaining the *life* of the individual, but the new part is a "prosthetic." It sustains the function and form of the individual but lacks the *genealogical connection* to the origin.

  **Coherence:** This reconciliation is coherent, provided one accepts that artifacts can have historical essences without being materially essentialist. The "limit" mentioned in Norm 3 is the point where the proportion of "prosthetic" material becomes so great that the causal link to the origin is deemed severed. At that threshold, the historical continuity is broken, and the object becomes a replica.

  **Flag for Disagreement:** A strict "Sortal Essentialist" might argue this is incoherent. If the kind "Statue" allows replacement, then the matter cannot be essential to its value *as a statue*. If the matter is valuable, it must be essential. To claim it is essential for value but not for identity requires a dual-aspect theory of artifacts that some metaphysicians find suspicious. They might argue the museum is simply confused, treating the object as one thing legally and another thing ontologically.

  ### 3. Application to Specific Cases

  Here is how the implicit theory handles your three scenarios:

  **(a) A statue whose arm is replaced with modern resin.**
  *   **Practice:** This is standard conservation. The arm is marked as distinct (Norm 1).
  *   **Implicit Theory:** The theory handles this easily. The statue persists because the majority of the constituting matter remains, and the causal history is unbroken. The resin is a new constituent, but it does not constitute a new object; it is a part of the existing object. The distinguishability norm acknowledges the metaphysical difference between the "original constituent" and the "new constituent."

  **(b) A statue that is melted down and recast in exactly the same shape from the same metal.**
  *   **Practice:** Conservation practice would **not** accept this as the same object. It would be labeled a copy or a recasting.
  *   **Implicit Theory:** The theory explains this via the **continuity constraint**. Melting destroys the structural organization that sustains the object's existence. Even if the atoms are the same, the *history of the object* is interrupted. The causal chain from the artist's shaping to the current form is broken. The implicit theory requires continuous existence of the *organized structure*, not just the conservation of mass.

  **(c) A statue completely disassembled and then reassembled from original parts (Anastylosis).**
  *   **Practice:** This is accepted in architecture (e.g., columns) but controversial in cohesive sculpture.
  *   **Implicit Theory:** This is the stress test. The theory can handle this *if* "continuity" is defined as the continuity of the *parts* rather than the continuity of the *bonding*. If the parts are kept together and reassembled quickly, the historical individual survives the "coma." However, if the disassembly destroys the functional unity that defines the kind "statue" (e.g., a marble figure held together by gravity and friction rather than mortar), the theory might判定 (judge) that the object ceased to exist during disassembly.
  *   **Requirement:** For the theory to license this, it must view the statue as an aggregate of parts whose *arrangement* is essential, rather than a fused whole. Most conservation practice leans toward the latter for sculpture, which is why anastylosis is rarer for bronze or marble figures than for stone architecture.

  ### 4. Strict Presuppositions vs. Compatible Theories (Underdetermination)

  We must distinguish what the practice *needs* to make sense from what merely *fits* the practice.

  **Strict Presuppositions (What the practice requires):**
  1.  **Non-Identity with Matter:** The artwork cannot be identical to its original atoms (otherwise, no repair is possible).
  2.  **Non-Identity with Form:** The artwork cannot be identical to an abstract shape or universal (otherwise, original matter has no special value, and perfect replicas would be the same object).
  3.  **Continuity Constraint:** Persistence requires an unbroken spatiotemporal history. You cannot destroy the object and bring it back later (no "resurrection").

  **Merely Compatible (What fits but is not required):**
  1.  **Constitution View vs. Dominant Kind:** The practice fits the view that the statue and lump are two objects in the same place (Constitution). But it also fits the view that there is only one object there, which falls under the sortal "Statue" which dominates the sortal "Lump" (Dominant Kind). The conservator does not need to decide this to do their job.
  2.  **Endurantism vs. Perdurantism:** The practice is compatible with the statue enduring through time (3D) and changing parts. It is also compatible with the statue being a spacetime worm (4D) where the "repair" segment is a later temporal part made of different stuff. The practice is neutral on the metaphysics of time.
  3.  **The Nature of the Limit:** The practice presupposes *that* there is a limit to replacement (Norm 3), but it is underdetermined on *what* sets the limit. Is it a metaphysical threshold (more than 50% new matter = new object)? Or is it a pragmatic/epistemic threshold (too much new matter and we can no longer verify the history)? The practice works either way.

  **Philosophical Underdetermination:**
  Rival theories that license the exact same practice include:
  *   **Historical Essentialism:** The object is defined by its origin and continuous history.
  *   **Functional Kind Theory:** The object is defined by its function/appearance, provided the history is unbroken.
  Both allow repair, both value original matter (one as origin-trace, one as functional reliability), and both reject total replacement. The practice does not distinguish between them.

  ### 5. Counterfactual Practices

  If the metaphysical foundations were shifted, the practice would have to change radically.

  **(i) If the statue were identical to the original matter (Strict Materialism):**
  *   **Replacement:** Impossible. Any loss of material is destruction. Conservation would shift from "repair" to "preservation of fragments." You would never add resin; you would only stabilize what remains.
  *   **Marking:** Distinguishability would be irrelevant because the object is already gone if matter is lost.
  *   **Labeling:** The date would remain, but the status would change from "Work by Artist" to "Fragment of Work by Artist." If you added new matter, you would have to label it as a new object (e.g., "Assemblage of Original Fragment and Modern Resin").
  *   **Limit:** The limit is zero. Any replacement creates a new object.

  **(ii) If the statue were a purely formal or pattern object (Platonism/Structuralism):**
  *   **Replacement:** Unlimited. You could replace 100% of the matter as long as the form is accurate. A perfect 3D print would be the *same object* as the original.
  *   **Marking:** Distinguishability (Norm 1) would be unnecessary and even undesirable. The goal would be to make the new matter look exactly like the old, because the matter is irrelevant; only the pattern matters. "Faking" would be metaphysically permissible.
  *   **Labeling:** The date would remain the original date. The material description would be irrelevant.
  *   **Value:** Norm 3 would vanish. There would be no "authenticity" value attached to the original atoms, only to the accuracy of the form.

  ### Conclusion

  The current conservation practice rests on a **moderate, historically-grounded constitution theory**. It navigates a middle path between the rigidity of material identity and the fluidity of formal identity. It treats the artwork as a **continuant** that carries its history in its matter but is not exhausted by it.

  **Final Philosophical Flag:** The weakest link in this reconstruction is Norm 3 (the limit). Metaphysically, it is notoriously difficult to define *where* the limit lies without arbitrariness. If one atom replacement preserves identity, and total replacement destroys it, there is a Sorites paradox lurking here. The practice manages this not by solving the paradox, but by treating the limit as a **professional heuristic** rather than a sharp metaphysical boundary. A rigorous metaphysician might demand a precise truth condition for identity; the conservator operates with a gradient of authenticity. This suggests the practice presupposes a **vagueness in identity** itself, a commitment many analytic metaphysicians reject.
