      *   *Sociological/Feminist View:* Preferences are endogenous (formed inside the system). Socialization shapes what we want, not just what we can do.
      *   *The Knot:* If I choose X freely, is it because I'm wired for X, or because I was subtly guided to like X from birth? In high-equality societies, the *coercion* is gone, but the *socialization* remains.

