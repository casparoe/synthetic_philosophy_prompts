  # The Guilt-Shame Taxonomy Tree

  This instrument sorts positions on moral emotion using four diagnostic splits. Follow the branches from the root down to the leaves. Each leaf represents a coherent philosophical or psychological stance, labeled with a position name and its "awkward commitment"—the difficult implication the holder must accept.

  ### **Split 1 (Root): The Reality Check**
  **Claim:** Are guilt and shame genuinely different emotional responses with distinct biological or psychological signatures, or are they the same underlying social-pain feeling with different names?
  *   **Branch A:** They are **Genuinely Different**. (Go to Split 2A)
  *   **Branch B:** They are the **Same Phenomenon**. (Go to Split 2B)

  ---

  ### **Branch A: Genuinely Different**

  #### **Split 2A: The Boundary Line**
  **Claim:** If they are different, what draws the line between them?
  *   **Option 1 (Audience):** The boundary is **Public vs. Private**. Shame requires a witness (real or imagined); guilt works in total isolation. (Go to Split 3A-1)
  *   **Option 2 (Target):** The boundary is **Act vs. Self**. Shame targets your whole character ("I am bad"); guilt targets a specific behavior ("I did bad"). (Go to Split 3A-2)

  #### **Split 3A-1: The Engineering Question (Audience Branch)**
  **Claim:** Can a culture deliberately redesign its institutions (schools, courts, rituals) to make one emotion dominant and suppress the other, or is the wiring fixed?
  *   **Leaf 1: The Cultural Architect**
      *   *Position:* Society can choose its pain.
      *   *Awkward Commitment:* We could theoretically raise a generation that feels crushing guilt for private thoughts but zero shame for public humiliation if we just changed the curriculum.
  *   **Leaf 2: The Biological Determinist**
      *   *Position:* Culture only relabels what biology delivers.
      *   *Awkward Commitment:* Trying to build a "guilt culture" is as futile as trying to breed a dog that doesn't bark; the wiring is older than language.

  #### **Split 3A-2: The Health Question (Target Branch)**
  **Claim:** Which mode of evaluation produces the healthier moral life: focusing on repairing the specific act, or demanding transformation of the kind of person you are?
  *   **Leaf 3: The Restorative Pragmatist**
      *   *Position:* Focus on the act (Guilt is healthier).
      *   *Awkward Commitment:* Feeling bad about your *soul* is useless noise; only fixing the broken vase matters, even if you remain a careless person.
  *   **Leaf 4: The Virtue Absolutist**
      *   *Position:* Focus on the self (Shame is necessary).
      *   *Awkward Commitment:* Apologizing for the lie is cheap; you are not moral until you become a person who *cannot* lie, even if that requires self-loathing.

  ---

  ### **Branch B: Same Phenomenon**

  #### **Split 2B: The Distinction Artifact**
  **Claim:** If they are the same feeling, why do we have two words? Is it an intensity scale (mild discomfort vs. crushing exposure) or a linguistic artifact of Western psychology that doesn't survive translation?
  *   **Option 1 (Intensity):** It is a **Scale of Pain**. (Go to Split 3B)
  *   **Option 2 (Linguistic):** It is a **Translation Error**. (Go to Split 3B)

  #### **Split 3B: The Outsider Pain Condition (Niche Framing)**
  **Claim:** Can this single feeling be triggered by violating a norm you do *not* personally accept (e.g., feeling "ashamed" to break a religious rule you no longer believe in)?
  *   **Option 1 (Yes):** **Outsider Pain is Possible.** (Go to Split 4B)
  *   **Option 2 (No):** **Internal Acceptance Required.** (Go to Split 4B)

  #### **Split 4B: The Utility Check**
  **Claim:** Is maintaining this single emotional category socially useful, or is it a harmful confusion?
  *   **Leaf 5: The Unified Conformist** (Intensity + Yes + Useful)
      *   *Position:* It's all just pain, and feeling it for rules you hate keeps the peace.
      *   *Awkward Commitment:* Dissent is just a tolerance threshold issue; if you hurt enough when breaking the rule, you will obey regardless of belief.
  *   **Leaf 6: The Authenticity Purist** (Intensity + No + Harmful)
      *   *Position:* It's all just pain, but feeling it for rules you reject is pure abuse.
      *   *Awkward Commitment:* If you don't believe the rule, your pain is just fear, not moral emotion, so we should train people to feel nothing.
  *   **Leaf 7: The Relativist Functionalist** (Linguistic + Yes + Useful)
      *   *Position:* The words are fake, but the social control works even on dissenters.
      *   *Awkward Commitment:* We are using a translation error to police people who don't share our values, and that is an acceptable tool for order.
  *   **Leaf 8: The Semantic Skeptic** (Linguistic + No + Harmful)
      *   *Position:* The words are fake, and the pain vanishes the moment you question the law.
      *   *Awkward Commitment:* We are torturing ourselves over a vocabulary mistake that disappears the moment you think critically.

  ---

  ### **Appendix: Unoccupied Logical Cells**

  The tree above occupies eight specific positions. The following combinations of answers were logically possible but left empty.

  | Unoccupied Combination | Diagnosis |
  | :--- | :--- |
  | **Distinct + Audience + Outsider Pain** | **Redundant.** If guilt/shame are distinct based on audience (Split 2A), the "Outsider Pain" question (Split 3B) becomes secondary. The "Architect" and "Determinist" positions already imply how norms are internalized, making a separate split on norm acceptance unnecessary for the taxonomy's balance. |
  | **Distinct + Target + Outsider Pain** | **Incoherent.** If the distinction is based on Target (Act vs. Self), feeling pain for a norm you reject usually collapses into "Fear of Punishment" rather than moral shame/guilt. Holding that you can feel "Act-Guilt" for a rule you hate contradicts the definition of guilt as a personal moral failure. |
  | **Same + Intensity + Utility (Skipping Outsider)** | **Unexplored.** One could argue about the utility of the emotion without deciding if outsiders feel it. This cell is empty only to force the "Outsider Pain" constraint into the tree structure; philosophically, it is a viable but less nuanced position. |
  | **Same + Linguistic + Utility (Skipping Outsider)** | **Unexplored.** Similar to above. A position could claim the words are artifacts and the emotion is harmful/useful without specifying if dissenters feel it. Left empty to prioritize the niche framing requested. |
  | **Distinct + Audience + Engineering + Utility** | **Over-determined.** Adding a 4th split to the "Distinct" branch would yield 16 leaves, violating the "about eight leaves" constraint. The "Architect" position already implies a stance on utility (that engineering is *possible*, implying it is *useful*), making a separate split repetitive. |

  **Note on Empty Cells:** The empty cells are not necessarily false; they are omitted to maintain the instrument's usability for non-specialists. The "Outsider Pain" split was prioritized on the "Same Phenomenon" branch because the question of *what* we are feeling (one thing vs. two) matters more for norm-violation scenarios than the question of *how* we distinguish them (audience vs. target).
