answer: |-
  **Title:** The Phlogiston of the Mind: Can Pragmatic Eliminativism Survive the Normative Gap?

  Eliminative materialism (EM), championed by Paul and Patricia Churchland, presents one of the most provocative challenges in the philosophy of mind. Its central claim is radical: Folk Psychology (FP)—our everyday framework of beliefs, desires, and intentions—is not merely incomplete but fundamentally false. Just as modern chemistry eliminated "phlogiston" rather than reducing it to oxidation, future neuroscience will eliminate "belief" rather than reducing it to neural activity. However, this view has long been dogged by the charge of self-refutation: if there are no beliefs, then eliminative materialism itself cannot be a belief, rendering the theory unintelligible.

  Recently, a pragmatic defense has emerged to save EM from this suicidal paradox. This defense suggests that mentalistic talk is not a description of ontological reality but a "social coordination technology." Much like an engineer uses "center of mass" without believing a literal point-mass exists inside a beam, an eliminativist can use belief-language without ontological commitment. This essay argues that while this pragmatic separation successfully insulates EM from logical contradiction, it exacts a prohibitive philosophical cost. By retreating to instrumentalism to save consistency, EM surrenders its claim to scientific truth and fails to account for the normative force of reasoning. Consequently, the pragmatic defense does not save radical eliminativism; it collapses the view into a mild linguistic conventionalism that is far less threatening than originally advertised.

  To understand the stakes, we must first grasp the mechanism of the pragmatic defense. The standard objection to EM is a performative contradiction: to assert "beliefs do not exist" is to express a belief, thereby proving the assertion false. The pragmatic defender counters that this objection conflates *use* with *commitment*. When we say, "I believe it will rain," we are not reporting on an internal propositional attitude; we are engaging in a move within a social language game to coordinate behavior. On this view, the statement "I do not believe eliminativism" is not a report on a missing mental state but a refusal to participate in a specific predictive pattern. This mirrors the "center of mass" analogy. Physicists calculate trajectories using the center of mass, yet no one expects to find a physical particle at that coordinate. If mental terms are merely calculational tools for social prediction, the eliminativist can use them to argue against their own reality without contradiction. They are simply using a useful fiction to explain why the fiction should be discarded.

  Superficially, this saves EM from logical incoherence. However, it fundamentally alters the nature of the claim. Traditional eliminativism is an ontological thesis: it claims that beliefs *do not exist*. The pragmatic defense transforms this into an instrumentalist thesis: it claims that belief-talk is *not literally true but useful*. This shift is where the study partner's concern about "smuggling content" gains traction. If the language of belief is retained for its utility, we must ask: what makes it useful? The standard answer is that it successfully predicts behavior. But successful prediction usually implies that the model latches onto *something* real about the system. If FP is completely false (as the Churchlands insist), it is mysterious why it works at all. By admitting the language is indispensable for coordination, the eliminativist implicitly concedes that the functional role of "belief" is real, even if the neural substrate is different. This pushes the view away from elimination and toward a form of non-reductive realism or Dennett's "intentional stance," where beliefs exist as abstracta. The pragmatic defense saves the theory from contradiction only by watering down its eliminative bite.

  The deeper failure of the pragmatic defense, however, lies in its inability to handle normativity. Science is not merely about prediction; it is about justification. When an eliminativist argues that we *should* adopt neuroscience over folk psychology, they are making a normative claim about rational inquiry. They are arguing that we *ought* to revise our views in light of evidence. But normative reasoning relies on the existence of propositional attitudes. To say "you ought to believe P" presupposes that "believing P" is a state that can be held to the standard of truth. If beliefs are merely fictions akin to "center of mass," then accepting eliminativism is not a matter of recognizing truth; it is merely a matter of adopting a more efficient vocabulary.

  This creates a fatal gap in the pragmatic eliminativist's argument. If there are no beliefs, there are no truth-apt states. If there are no truth-apt states, there is no such thing as being "rationally compelled" by evidence. There is only causal conditioning. On the pragmatic view, accepting EM is not seeing the light of truth; it is simply switching from a legacy software to a new update because it runs faster. But if the choice between FP and neuroscience is merely pragmatic (like choosing between metric and imperial units), then EM loses its claim to be a *discovery* about the nature of reality. It becomes a policy recommendation. The study partner is correct: you cannot explain why one *ought* to revise their views without invoking the very propositional attitudes EM seeks to eliminate. A fiction cannot justify a revolution; only a truth claim can.

  Furthermore, if mentalistic talk is truly just a social coordination technology, then the eliminativist's own argument is subject to that same limitation. The argument for EM is presented as a rational deduction intended to change the listener's mind. But if "changing one's mind" is just a metaphor for causal recalibration, the argument loses its force. The pragmatic eliminativist wants to have it both ways: they want to use the normative force of rational argumentation (which presupposes real beliefs) to convince us to abandon the ontology of real beliefs. This is the "smuggling" charge in its strongest form. The pragmatic defense allows the eliminativist to speak without contradiction, but it does not allow them to argue without presupposing the falsity of their own conclusion.

  Does this mean eliminative materialism is dead? Not necessarily, but it means the radical version is unsustainable. The pragmatic defense transforms EM from a shocking ontological claim ("There are no beliefs!") into a modest semantic claim ("We should stop taking belief-talk literally."). This is a significant diminution of threat. A view that says "beliefs are useful fictions" is compatible with most forms of instrumentalism and fictionalism, which are standard positions in philosophy of science. It is no longer a revolution that promises to overthrow our self-conception; it is merely a suggestion to refine our vocabulary.

  In conclusion, separating ontological rejection from linguistic practice does save eliminative materialism from the charge of self-refutation, but only by collapsing it into a form of instrumentalism that undermines its own motivation. The pragmatic defense renders the theory consistent but toothless. It cannot account for the normative force of reasoning required to argue for the theory in the first place, nor can it maintain the radical claim that folk psychology is strictly false rather than merely non-literal. By retreating to the safety of "social coordination technology," the eliminativist concedes that the framework of beliefs is functionally indispensable. Therefore, the view is less threatening than advertised. It does not eliminate the mind; it merely rebrands it. The pragmatic eliminativist survives the logical trap, but only by ceasing to be a true eliminativist.
