answer: |-
  In your vocabulary, Causal Decision Theory (CDT) optimizes the return value at a specific call site, treating the rest of the execution graph as external state. It performs local continuation-passing: "Given I am here, what return value maximizes the continuation?" Evidential Decision Theory (EDT) conditions on the return value, querying the denotation: "If the function returns $v$, what is the probability distribution over the global state?" It assumes correlation implies conditioning, without distinguishing causation from common cause.

  Updateless Decision Theory (UDT) shifts the optimization boundary. It does not select a return value; it selects the function definition itself. In your concrete setting, where policy $P$ is compiled into $N$ binaries on separated machines, CDT optimizes the $i$-th invocation $P(obs_i)$ assuming the other $N-1$ calls are constants. UDT optimizes the source code of $P$ at compile time to maximize the payoff function over the tuple of all $N$ outputs. The recommendation is to treat the $N$ physically separated machines as a single distributed computation graph. You optimize the closure of $P$ globally, rather than optimizing the value returned at one call site. This amounts to whole-program optimization: you choose the algorithm that, when instantiated $N$ times, yields the optimal global trace, rather than choosing the best local action given the current stack frame.

  Your first identification—updatelessness as staging—is largely vindicated. Conditioning on an observation is indeed partial evaluation: specializing the general policy $\lambda o. P(o)$ to a residual program $P(obs)$. UDT forbids this specialization by the agent before the global optimum is determined. The agent must remain a general function $\lambda o. P(o)$ until the "compile time" choice of $P$ is fixed. The environment provides the runtime argument $obs$; the agent provides the function body. If the agent specializes early, it breaks the sharing of the decision procedure with its other $N-1$ instances, because the residual program $P(obs)$ is syntactically distinct from $P(obs')$. UDT insists the shared subterm (the source of $P$) remains abstract until the global fixed point is resolved.

  Your second identification—logical correlation as code identity—holds only for exact copies. In PL semantics, two programs are equivalent if they denote the same function (extensional) or share syntax (intensional). UDT requires a notion of correlation between distinct programs that compute "similar" functions. This is where the translation strains. In your vocabulary, equivalence is binary and undecidable (Rice's Theorem). There is no metric for "90% equivalent." UDT, however, relies on logical uncertainty: the agent assigns probabilities to the output of its own code and similar codes without executing them. This requires a semantics where programs can be "probably equivalent," which standard denotational semantics does not support.

  This leads to the residue.

  **What translates without strain:** The structural distinction between optimizing a value versus optimizing a function. The staging analogy captures the temporal asymmetry of UDT: the policy is fixed "before" the observation arrives, analogous to compile-time versus runtime. The treatment of the $N$ binaries as a single graph is standard distributed systems reasoning.

  **What translates only after importing assumptions:** The notion of "deliberation." In PL, a function does not deliberate; it maps inputs to outputs. To say $P$ "chooses" its own source code requires a quining fixed-point combinator where the program accesses its own representation. However, evaluating the *optimality* of that representation requires a meta-interpreter outside the object language. You must assume the agent can simulate its own execution without incurring the cost of recursion (halting), or that it has access to an oracle for its own behavior. Furthermore, "similarity" of programs must be imported. Standard semantics gives you identity or difference; UDT requires a topology of program space where distance implies correlation.

  **What has no expression:** Indexical uncertainty and logical counterfactuals. In your setting, the agent not knowing "which binary it is" is simply a missing parameter $i$. In UDT, this is treated as a fundamental ambiguity about self-location that affects decision logic. More critically, logical counterfactuals have no denotation. In PL, if $A = B$, then $A$ and $B$ are interchangeable. UDT asks: "What if I returned $v$ even though my code dictates $v'$?" This is a request for the semantics of a false mathematical statement. There is no model for "what would happen if $2+2=5$" in standard logic, yet UDT requires this to evaluate alternative policies.

  Regarding your question on undecidability: The agent's uncertainty about its own output is not merely Rice-style undecidability. Undecidability says no algorithm can *decide* equivalence for all inputs. UDT assumes the agent can assign *probabilities* to equivalence. This is not a limit of computation but a gap in semantics. Standard PL theory does not assign probabilities to mathematical truths; it proves them or doesn't.

  **Verdict:** The residue indicates that the central updateless notion is less well-defined than its exposition suggests. Your vocabulary is not missing notions of self or agency; rather, UDT is attempting to operate on a semantic domain that does not exist. It treats algorithms as causal variables that can be intervened upon independently of their definition. In PL terms, it wants to mutate the source code of a running closure from within the closure, while maintaining consistency across all other references to that closure, without a defined mechanism for how that mutation propagates logically. The "logical correlation" UDT relies on is a phantom reference: it acts as if there is a pointer connecting distinct instantiations of similar code, but in standard semantics, there is only extensional equality. The friction you feel is the sound of a decision theory trying to define a causal operator over mathematical logic, which your vocabulary correctly identifies as category error.
