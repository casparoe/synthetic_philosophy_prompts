      *   **Context:** Game theory & society seminar.
      *   **Problem:** The user observes a pattern in positional competition (arms races) where attempts to cap spending lead to two specific outcomes:
          1.  **Relocation:** Spending shifts to uncapped/harder-to-measure margins, often becoming less efficient (pure cost).
          2.  **Non-resetting (Hysteresis):** The competition level doesn't drop back down if the cap is removed or the original driver disappears; the new baseline sticks.
      *   **Examples:** Admissions (screening devices), hiring requirements, lab benchmarks.
      *   **Task:**
          1.  Identify if there's an existing name.
          2.  If not, coin a term with a definition.
          3.  Provide boundary cases (distinguish from plain arms race, Goodhart's law/gaming, price/wage stickiness).
          4.  Rank near-misses by closeness.
          5.  Explain what features each near-miss fails to capture.
          6.  **Constraints:** American English, under 300 words, no reading lists/paper recs.

  2.  **Evaluate Existing Terminology:**
      *   *Arms Race:* Captures the escalation, but not necessarily the relocation or the hysteresis (non-resetting) aspect specifically after intervention.
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." Captures the gaming/relocation aspect (1), but not necessarily the hysteresis/non-resetting aspect (2).
      *   *Path Dependence / Hysteresis:* Captures the non-resetting (2), but not the strategic relocation of competition (1).
      *   *Credential Inflation:* Specific to admissions/jobs, doesn't cover the mechanism of relocation + stickiness broadly.
      *   *Red Queen Effect:* Running to stay in place. Captures the futility, but not the structural shift after capping.
      *   *Hydra Effect:* Cutting off one head grows two more. Close, but implies multiplication rather than relocation + stickiness.
      *   *Cobra Effect:* Perverse incentive. Close, but usually refers to the solution making the problem worse, not necessarily the stickiness.

      *Conclusion:* There isn't a single standard term that perfectly captures *both* relocation *and* non-resetting hysteresis in positional competition. The user is likely mashing two phenomena (Goodhart-style displacement + Hysteresis) but they occur together systematically here.

  3.  **Coining a Term:**
      *   Needs to sound academic but descriptive.
