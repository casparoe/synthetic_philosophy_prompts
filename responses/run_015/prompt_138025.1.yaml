      3.  **Price/Wage Stickiness (Distant):** Captures the non-resetting. *Fails:* This is macroeconomic friction, not strategic behavioral displacement. Stickiness is about contracts/norms, not active competition shifting margins.
      4.  **Cobra Effect (Distant):** Captures perverse incentives. *Fails:* Focuses on the solution worsening the original problem, not necessarily the structural lock-in of the new cost baseline.

      **Competitive Ratcheting** distinguishes itself by requiring both the *displacement* of effort and the *irreversibility* of the cost baseline. It explains why admissions stay expensive even after test-optional shifts: the effort didn't vanish; it ratcheted into internships and essays, and now that baseline is the new normal.

