prompt: |-
  You staff a municipal heritage office that must draft public plaque texts for monuments contested between groups with incompatible historical narratives — for instance, a colonial-era statue that one community honors as a founder and another condemns as an oppressor. You want a reusable decision procedure, grounded in Jain anekāntavāda — specifically the doctrines that reality is multi-faceted (anekāntavāda), that every statement expresses only one partial standpoint (naya), and that qualified assertion (syādvāda) should replace absolute affirmation or denial — to determine whether a draft plaque falsely absolutizes one narrative and, if not, how to frame it with appropriate standpoint qualifiers.

  Write the procedure as an ordered checklist your office can run in under an hour without philosophical training. Include: (1) initial classification tests distinguishing empirical disputes from evaluative framing disputes; (2) drafting rules requiring every interpretive claim to carry an explicit or implicit standpoint qualifier specifying whose naya it represents; (3) hard stop-points where the procedure rejects any draft containing unqualified hero/villain or singular-truth language, and escalation points where anekāntavāda provides no rule for ranking competing standpoints and the decision must go to a values-based board vote; (4) sentence-level test questions editors apply to flag hidden absolutism; and (5) explicit markers of irreducible judgment, such as deciding which standpoints receive equal textual space.

  Apply the procedure to three cases: (a) the colonial administrator statue, where historians dispute whether he suppressed a rebellion or maintained civil order; (b) an indigenous land-rights monument for which one group demands the phrase "stolen land" and another demands "shared territory"; and (c) one case where the procedure forces approval of a framing you personally reject, explaining precisely why anekāntavāda yields that result and identifying what the procedure cannot do — for example, it cannot assign moral weight to nayas, only prevent any single naya from being presented as exhaustive truth.

  Specify practical constraints: who signs off at each stage, what to do when primary sources conflict, and the required outputs — a qualified text, a rejection memo with the offending absolutism flagged, or an escalation form. Note where the procedure will misfire or remain silent.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Municipal Heritage Office Staff.
      *   **Task:** Draft a reusable decision procedure for public plaque texts on contested monuments.
      *   **Philosophical Grounding:** Jain *anekāntavāda* (many-sidedness), *naya* (partial standpoint), *syādvāda* (qualified assertion).
      *   **Goal:** Prevent false absolutism, ensure standpoint qualifiers, identify hard stops/escalations.
      *   **Format:** Ordered checklist (usable in <1 hour, no phil training).
      *   **Requirements:**
          1.  Initial classification (empirical vs. evaluative).
          2.  Drafting rules (standpoint qualifiers).
          3.  Hard stops (unqualified hero/villain language) & Escalation points (ranking standpoints).
          4.  Sentence-level test questions.
          5.  Explicit markers of irreducible judgment.
          6.  Application to three specific cases (Colonial statue, Indigenous land rights, Forced approval of rejected framing).
          7.  Practical constraints (sign-offs, conflicting sources, outputs).
          8.  Limitations (where it misfires/silent).

  2.  **Deconstruct the Philosophy for Practical Use:**
      *   *Anekāntavāda:* Reality is complex. No single sentence captures the whole truth. *Practical translation:* The plaque must acknowledge multiple perspectives.
      *   *Naya:* A specific perspective or standpoint. *Practical translation:* Attribute claims to specific groups, historians, or communities (e.g., "According to...", "From the perspective of...").
      *   *Syādvāda:* "In some way, it is." Qualified assertion. *Practical translation:* Avoid "is/was" without context. Use "is remembered as," "is viewed by," "records suggest."
      *   *Constraint:* The procedure cannot solve moral disagreements (ranking *nayas*), only manage how they are presented.

  3.  **Drafting the Procedure (The Checklist):**
      *   *Time Limit:* Needs to be snappy. Use Yes/No checks.
      *   *Stage 1: Classification.* Is it a fact dispute (dates) or a meaning dispute (hero vs. villain)?
      *   *Stage 2: Drafting Rules.* Every claim needs a source/standpoint.
      *   *Stage 3: Hard Stops.* Absolutist language triggers rejection.
      *   *Stage 4: Sentence Test.* Specific questions to ask about each sentence.
      *   *Stage 5: Irreducible Judgment.* Where the staff must make a choice that philosophy can't dictate (e.g., space allocation).
      *   *Sign-offs:* Who approves what? (Staff -> Manager -> Board).
      *   *Outputs:* Approved Text, Rejection Memo, Escalation Form.

  4.  **Developing the Three Case Studies:**
      *   *Case A (Colonial Statue):* Historians dispute rebellion vs. order.
          *   *Application:* Use qualifiers. "Admin X is credited by colonial records with... Community Y remembers this as..."
      *   *Case B (Indigenous Land):* "Stolen" vs. "Shared."
          *   *Application:* These are evaluative *nayas*. Cannot say "It *was* stolen" as absolute fact if contested legally/politically, but can say "Community A asserts..."
          *   *Challenge:* One might argue "stolen" is an empirical fact. The procedure must treat it as a *naya* if contested to avoid absolutism.
      *   *Case C (Forced Approval):* Need a scenario where the procedure works, but the result is morally uncomfortable for the drafter.
          *   *Idea:* A plaque for a controversial figure where the "oppressor" narrative is historically well-documented, but the "founder" narrative is politically dominant. Or, conversely, where a harmful narrative *must* be included as a valid *naya* to avoid absolutism, even if the drafter finds it repugnant.
          *   *Better Idea:* The procedure forces the inclusion of a standpoint that the drafter believes is factually wrong but is held by a significant community *naya*. Wait, *anekāntavāda* isn't relativism; it acknowledges partial truth. If a claim is empirically false, it shouldn't be presented as a valid *naya* of *reality*, but rather a *naya* of *belief*.
          *   *Refinement for Case C:* The procedure prevents the drafter from deleting a community's *memory* even if historical records contradict it, because the plaque documents *heritage* (memory), not just *history* (facts). The drafter must include the conflicting memory as a valid *naya* of experience, even if they personally reject the historical accuracy. This highlights the limit: the procedure manages representation, not truth-verification.

  5.  **Refining Practical Constraints & Limitations:**
      *   *Sign-offs:* Junior Staff (Draft), Senior Manager (Compliance), Heritage Board (Escalations).
      *   *Conflicting Sources:* Prioritize primary sources for empirical, oral history for evaluative.
      *   *Misfire:* When violence is imminent, or when one *naya* is genocidal (the procedure might inadvertently legitimize hate speech by framing it as a "standpoint"). Need a safety valve.

  6.  **Writing the Content (Iterative refinement for tone and clarity):**
      *   *Tone:* Bureaucratic but philosophically precise.
      *   *Structure:* Follow the prompt's 5 points + Cases + Constraints.
      *   *Check:* Did I explain *syādvāda* simply? Yes, "Qualified Assertion."
      *   *Check:* Did I address the "under one hour" constraint? Keep the checklist short.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Case B too political?
      *   *Fix:* Frame it strictly through the lens of the procedure. The procedure treats "stolen" and "shared" as competing *nayas* regarding legal/moral status, not necessarily empirical possession.
      *   *Critique:* Is Case C clear?
      *   *Fix:* Make sure to explicitly state *why* the drafter rejects it (moral weight) and why the procedure allows it (procedural neutrality regarding *naya* inclusion).
      *   *Critique:* Did I include the "Hard Stop"?
      *   *Fix:* Ensure the checklist has a specific "STOP" section.

  8.  **Final Polish:** Check against all prompt requirements one last time.
      *   (1) Classification tests? Yes.
      *   (2) Drafting rules (qualifiers)? Yes.
      *   (3) Hard stops & Escalation? Yes.
      *   (4) Sentence-level tests? Yes.
      *   (5) Irreducible judgment markers? Yes.
      *   Three Cases applied? Yes.
      *   Practical constraints (sign-offs, outputs)? Yes.
      *   Limitations/Misfires? Yes.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # MUNICIPAL HERITAGE OFFICE: PROCEDURAL CHECKLIST 7.4 (ANEKĀNTAVĀDA COMPLIANCE)

  **Purpose:** To draft public plaque texts for contested monuments without asserting a single narrative as exhaustive truth.
  **Time Limit:** 45–60 Minutes.
  **Philosophical Basis:** *Anekāntavāda* (Reality is multi-faceted); *Naya* (Partial standpoint); *Syādvāda* (Qualified assertion).
  **Required Training:** None. Follow the logic gates below.

  ---

  ## PART 1: INITIAL CLASSIFICATION (10 Minutes)
  *Complete before drafting. Determine the nature of the conflict.*

  **1.1 Empirical Dispute Test**
  *   **Question:** Can the dispute be resolved by a primary source (e.g., a date, a name, a treaty signature)?
      *   **YES:** Resolve using archival hierarchy (Primary > Secondary). Do not use standpoint qualifiers for settled facts.
      *   **NO:** Proceed to 1.2.
  *   **Question:** Do sources conflict irreconcilably (e.g., oral history vs. colonial ledger)?
      *   **YES:** Classify as **Evaluative Framing Dispute**. Proceed to Part 2.

  **1.2 Narrative Dominance Test**
  *   **Question:** Is one narrative currently enforced by law or state power (e.g., official naming conventions)?
      *   **YES:** Note this as the "Administrative *Naya*."
      *   **NO:** Note all active community narratives as "Community *Nayas*."

  ---

  ## PART 2: DRAFTING RULES (20 Minutes)
  *Apply these rules to every sentence of the draft text.*

  **2.1 The Qualifier Rule (*Syādvāda*)**
  *   **Requirement:** No interpretive claim may stand without a standpoint marker.
  *   **Forbidden:** "He was a hero," "This was a massacre," "The land was stolen."
  *   **Required:** "He is *remembered by* Group X as...", "Records *indicate*...", "Community Y *asserts*..."
  *   **Exception:** Undisputed empirical data (dates, locations) requires no qualifier.

  **2.2 The Parallel Structure Rule**
  *   **Requirement:** Competing *nayas* regarding the same event must be granted syntactically equal weight.
  *   **Example:** If Narrative A gets one paragraph, Narrative B gets one paragraph. Do not bury one in a footnote.

  **2.3 The Hard Stop (Automatic Rejection)**
  *   **TRIGGER:** Any sentence containing unqualified absolutist language.
      *   *Keywords:* "Truth," "Fact," "Actually," "Really," "Hero," "Villain," "Oppressor," "Liberator."
  *   **ACTION:** Stop immediately. Issue **Rejection Memo (Form R-7)**. Return to drafter.
  *   **Rationale:** This violates *naya* by presenting a partial view as the whole reality.

  ---

  ## PART 3: SENTENCE-LEVEL AUDIT (10 Minutes)
  *Editors must ask these three questions of every sentence in the draft.*

  1.  **Whose voice is this?** (If you cannot name the group/source holding this view, delete the sentence.)
  2.  **Does this imply exclusivity?** (Does "The battle happened here" imply "No other interpretation exists"? If so, change to "Most records place the battle here.")
  3.  **Is this a value judgment disguised as a fact?** (If yes, add "In the view of..." or "According to...")

  ---

  ## PART 4: IRREDUCIBLE JUDGMENT & ESCALATION (10 Minutes)
  *The procedure cannot solve moral weighting. Mark these decisions explicitly.*

  **4.1 The Space Allocation Judgment**
  *   **Decision:** You must decide how much physical space each *naya* receives on the plaque.
  *   **Procedure Limit:** *Anekāntavāda* does not dictate proportions.
  *   **Requirement:** Mark this decision on the **Escalation Form (Form E-3)**. State: "Space allocation is a curatorial judgment, not a philosophical derivation."

  **4.2 The Escalation Point**
  *   **Trigger:** If two *nayas* are mutually exclusive and both demand exclusive truth (e.g., "Land was legally purchased" vs. "Land was never for sale").
  *   **Action:** Do not attempt to synthesize. Present both as competing *nayas*.
  *   **Sign-off:** This requires **Heritage Board Vote**. Staff cannot finalize.

  ---

  ## PART 5: OUTPUTS & SIGN-OFFS

  *   **Approved Text:** Signed by Senior Heritage Manager. Confirms Part 2 & 3 compliance.
  *   **Rejection Memo (Form R-7):** Issued by Editor. Must highlight specific absolutist phrases.
  *   **Escalation Form (Form E-3):** Issued by Senior Manager. Sent to Board when *nayas* cannot be linguistically reconciled or space allocation is disputed.

  ---

  # APPLICATION TO CASE STUDIES

  ### Case A: The Colonial Administrator Statue
  **Conflict:** Historians dispute if he suppressed a rebellion (Oppressor *naya*) or maintained civil order (Founder *naya*).
  **Procedure Application:**
  1.  **Classification:** Evaluative Framing Dispute (1.1). Both sides have archival support depending on which records are prioritized.
  2.  **Drafting:**
      *   *Fail:* "Administrator Smith restored order in 1890."
      *   *Pass:* "Colonial records state Smith restored order in 1890 (*Founder Naya*). Oral histories from the Valley Region describe this event as the suppression of a rebellion (*Oppressor Naya*)."
  3.  **Result:** Text approved. Both *nayas* are qualified. No absolute claim is made about the *nature* of the event, only about the *records* describing it.

  ### Case B: Indigenous Land-Rights Monument
  **Conflict:** Group A demands "Stolen Land." Group B demands "Shared Territory."
  **Procedure Application:**
  1.  **Classification:** Evaluative Framing Dispute. "Stolen" implies illegal taking; "Shared" implies mutual agreement.
  2.  **Hard Stop Check:** If the draft reads "This is stolen land," issue **Rejection Memo**. It treats a legal/moral claim as an unqualified fact.
  3.  **Drafting:** "The X Nation asserts this territory was taken without consent (*Stolen Naya*). Municipal archives cite the 1850 Treaty as establishing shared usage rights (*Shared Naya*)."
  4.  **Escalation:** If Group A refuses the qualifier "asserts," escalate to Board (4.2). The procedure cannot force a group to accept *syādvāda*.

  ### Case C: The Forced Approval (Procedure vs. Personal Morality)
  **Scenario:** A plaque regarding a 19th-century philanthropist.
  *   **Drafter's View:** The philanthropist was a eugenicist whose charity was a tool of social control.
  *   **Community *Naya*:** A local hospital named after him insists he was a "Benevolent Savior."
  *   **Procedure Result:** The procedure **forces approval** of a text that includes the "Benevolent Savior" *naya* alongside the "Eugenicist" *naya*.
  *   **Why:** *Anekāntavāda* prevents the drafter from silencing the "Benevolent Savior" *naya* because it is a genuine standpoint held by a community, even if the drafter believes it is morally bankrupt or historically shallow. To exclude it would be to assert the Drafter's *naya* as the absolute truth.
  *   **Limitation Identified:** The procedure **cannot assign moral weight**. It prevents the plaque from saying "He was evil," but it also prevents it from saying "He was good." It forces the inclusion of the "Benevolent" view as a *partial* truth (how he is remembered), not *exhaustive* truth. The drafter must accept that the plaque validates the *existence* of the memory, not the *morality* of the figure.

  ---

  # PRACTICAL CONSTRAINTS & LIMITATIONS

  **1. Sign-Off Authority**
  *   **Drafting Staff:** Responsible for applying Part 2 & 3 (Linguistic Compliance).
  *   **Senior Manager:** Responsible for Part 4 (Space Allocation & Escalation).
  *   **Heritage Board:** Responsible for final acceptance of irreconcilable *nayas*.

  **2. Conflicting Primary Sources**
  *   If sources conflict empirically (e.g., two different dates), do not choose one. Use *syādvāda*: "Records vary, citing dates between 1890 and 1892."
  *   If one source is demonstrably forged, it is not a *naya*; it is an error. Exclude it. *Anekāntavāda* applies to valid perspectives, not falsehoods.

  **3. Required Outputs**
  *   **Qualified Text:** Final plaque copy.
  *   **Rejection Memo:** Must cite the specific line violating the Hard Stop (Part 2.3).
  *   **Escalation Form:** Must document which *nayas* were deemed irreconcilable.

  **4. Where the Procedure Misfires or Remains Silent**
  *   **Hate Speech:** If a *naya* asserts the inferiority of a human group, the procedure does not automatically ban it (as it is a "standpoint"). **Safety Valve:** Municipal Human Rights Code overrides this procedure. Staff must escalate immediately to Legal, not Heritage Board.
  *   **Violence:** If presenting multiple *nayas* incites immediate violence, the procedure is suspended for public safety.
  *   **Moral Equivalence:** The procedure may create a false equivalence between a victim's testimony and an oppressor's justification by giving them equal syntactic weight. It manages *representation*, not *justice*.
  *   **Silence:** The procedure cannot tell you *which* *nayas* deserve inclusion. Deciding who counts as a "community" with a valid *naya* is a political decision outside the scope of this checklist.

  ---
  **End of Procedure 7.4**
  *Approved by Municipal Heritage Office, Logic & Ethics Division.*
