  **Brainstorming: Foundational Analogical Mappings**

  1.  **Identity as Degenerate Analogy:** The claim that statements of identity (A = A) are merely limit-cases of analogy where the "slippage" between source and target is zero. In the Institute, distinctness is an illusion; everything is a mapping of something else.
  2.  **Perception as Projection:** The view that sensory input is unstructured noise until categorized by projecting past experiences onto it. There is no "direct perception," only the analogical dressing of raw data.
  3.  **Memory as Reconstruction:** The thesis that memory is not storage and retrieval but the real-time generation of a past scenario that structurally aligns with present cues. There is no archive, only resonance.

  ***

  **POSITION ANNOUNCEMENT: TENURE-TRACK FACULTY**
  **Department of Essential Analogies**
  **Institute for Pure Cognition**

  The Institute for Pure Cognition invites applications for a tenure-track position in the Department of Essential Analogies, beginning Fall 2025. The Institute operates under the foundational charter that analogy-making is not merely a component of cognition but its sole substrate. All cognitive phenomena—including perception, memory, logical deduction, and emotional valuation—are taxonomized as analogical mappings operating at varying scales of abstraction. There is no remainder.

  **Required Qualifications**
  Candidates must hold a Ph.D. in Cognitive Science, Philosophy of Mind, or related fields. Applicants must demonstrate a comprehensive commitment to the analogical substrate thesis. Specifically, the Search Committee will disqualify any candidate who evidences belief in:
  *   **Direct Perception:** The notion that sensory data possesses intrinsic structure independent of categorical projection.
  *   **Symbolic Computation:** The reliance on fixed syntactic rules or atomic symbols rather than fluid conceptual slippage.
  *   **Non-Representational Awareness:** Any claim to immediate knowledge or intuition not mediated by structural alignment.

  Candidates must submit a research statement demonstrating how their work reduces a non-analogical cognitive phenomenon (e.g., deductive validity) to an analogical mapping without structural loss.

  **Institutional Culture and Tenure Standards**
  The Institute maintains a rigorous environment of structural alignment. Peer review is conducted via "Mapping Verification," where manuscripts are evaluated based on the fidelity of their source-to-target projections. Tenure is granted only when a candidate's research program can be mapped onto the Institute's founding charter with zero residual error. Candidates whose work introduces unexplained variances or essentialist categories will be deemed non-aligned and ineligible for continuation.

  Departmental governance is organized by conceptual proximity rather than seniority. Committee assignments are distributed based on the semantic distance between a faculty member's research focus and the administrative core.

  **Compensation and Logistics**
  Salary bands are not fixed but are indexed to mapping efficiency. Annual adjustments are calculated based on the candidate's ability to align their output with institutional goals; higher slippage results in proportional compensation reduction. Parking assignments are determined by conceptual resonance: vehicles are stationed in lots corresponding to the faculty member's primary domain of analogy (e.g., Lot A for Perception-as-Projection, Lot B for Memory-as-Reconstruction). Administration reserves the right to reassign parking spaces if a faculty member's research focus undergoes significant conceptual drift.

  Health benefits include coverage for cognitive dissonance resolution therapy. Relocation assistance is provided only if the candidate's move can be framed as a structural mapping from their previous institution to the Institute.

  **Application Instructions**
  Submit a cover letter, curriculum vitae, and three samples of analogical reduction to the Institute portal. Do not submit static PDFs; all documents must be editable to allow for post-hoc conceptual alignment by the Search Committee. Applications implying rigid categorical boundaries will not be processed.

  *The Institute for Pure Cognition is an Equal Opportunity Employer committed to maximizing conceptual fluidity.*
