      *(Self-Correction during drafting)*: I need to make sure I mention *Feferman*. His work on "Transfinite Recursive Progressions of Theories" is exactly the formal bridge the user is looking for regarding self-revising systems. Also, mention *Shapiro* regarding the "unknown machine" argument.

