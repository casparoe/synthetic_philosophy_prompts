answer: |-
  You are right to feel that the stagnation is structural rather than technical. After twenty years, the fact that the "filter" debate (object-given vs. state-given, buck-passing, etc.) remains unresolved suggests that the participants are not disagreeing about the *mechanism* of the filter, but about the *legitimacy of the request* for one.

  Your hunches are correct. The stalemate is not primarily about value; it is about the architecture of normativity and the specific meta-ethical ambition of the Fitting-Attitude (FA) theorist. Here is the diagnosis of why your group is going in circles, and what would actually be required to break the loop.

  ### 1. The Ambition Ambiguity: Analysis vs. Elucidation
  The primary source of the friction is that "FA Account" covers two distinct projects that are often conflated in the literature and in reading groups.

  *   **Project A (Reductive Analysis):** The claim is that value *is nothing over and above* the fittingness of an attitude. Value is analyzed in terms of reasons/fittingness.
  *   **Project B (Structural Elucidation):** The claim is that value is *essentially connected* to reasons/attitudes, but value might be primitive. The FA schema illuminates the nature of value without necessarily reducing it.

  **The Diagnosis:** The WKR problem is lethal for Project A, but a pseudo-problem for Project B.
  *   If you are doing **Project A**, you *must* provide a filter for the Right Kind of Reasons (RKR) that does not invoke the value property being analyzed (e.g., you cannot say "the RKR is the one that points to the admirable," because 'admirable' is the *definiendum*). You need a non-circular, independent specification of RKR. This is famously difficult, perhaps impossible.
  *   If you are doing **Project B**, the filter is trivial. You can simply say, "The reason is of the wrong kind because it does not stem from the value properties of the object." This is circular relative to Project A, but perfectly acceptable for Project B, which assumes value is already in the picture to explain the reasons.

  **Why you are stuck:** Your group likely contains members implicitly committed to Project A (who demand a non-circular filter) and members committed to Project B (who think the filter is obvious but question-begging for the reductionists). You are fighting about the filter because you haven't agreed on whether the account is supposed to *reduce* value or *characterize* it.

  ### 2. The Meta-Ethical Proxy War: Reasons First vs. Value First
  Your second hunch about the order of explanation is the engine driving the Ambition Ambiguity. This is the "Reasons First" (Scanlon, Broome, Hieronymi) vs. "Value First" (Mooreans, Perfectionists) divide.

  *   **Reasons First:** If reasons are the fundamental normative unit, then value must be constructed out of them. Here, the WKR problem is the central obstacle. You need to distinguish RKRs from WKRs without appealing to value. If you can't, the reduction fails.
  *   **Value First:** If value is fundamental, then reasons for attitudes are derived from value. Here, the WKR problem dissolves. A reason is of the "wrong kind" precisely *because* it bypasses the value of the object. The demon's threat provides a practical reason to *bring about* the admiration, not a fittingness reason *for* the admiration.

  **The Diagnosis:** The debate over the filter is a proxy war for this meta-ethical commitment. When someone proposes a filter (e.g., "reasons must be object-given"), the opposition attacks it not because it fails extensionally, but because it either smuggles in value (violating Reasons First) or is too restrictive (violating Value First intuitions about what counts as a reason).

  ### 3. The "Vera" Case and the Extension/Ground Distinction
  Your "Second Demon" (Vera) case is the diagnostic key. It proves that **extensional adequacy is not the goal.**
  *   In the standard Demon case, WKR leads to a *false positive* (Demon is admirable).
  *   In the Vera case, WKR leads to a *true positive* (Vera is admirable) but via the *wrong ground*.

  This confirms your suspicion that the row is about **grounding versus extension**.
  *   If the goal were merely extensional (getting the right verdicts on what is admirable), the Vera case shows that WKRs can do the job.
  *   The fact that everyone agrees the Vera case is still problematic for the FA account proves that the FA theorist cares about **explanatory direction**. They want the admiration to be fitting *because* Vera is admirable, not Vera to be admirable *because* it is fitting to admire her (due to the demon).

  **The Diagnosis:** The group is fighting over the filter because they are trying to use a tool designed for extensional sorting (a filter on reasons) to solve a problem about metaphysical grounding. You cannot filter your way out of a grounding problem.

  ### 4. The Generality Point: It's About Attitude Architecture
  You are also correct that this shows up in belief (Pascal's Wager) and action. This suggests the problem is not about value, but about the **normative architecture of attitudes.**

  Attitudes like belief, admiration, and intention have **constitutive aims** or **correctness conditions**.
  *   Belief aims at truth.
  *   Admiration aims at the admirable.
  *   Intention aims at the good (or actionable).

  WKRs are reasons that incentivize the *having* of the attitude without satisfying the *correctness condition* of the attitude.
  *   **Diagnosis:** The WKR problem arises whenever you try to define the correctness condition of an attitude in terms of the reasons for having it. If you say "Belief is correct iff there are reasons to believe," you invite Pascal's Wager. If you say "Belief is correct iff it is true," WKR disappears (the pragmatic benefit doesn't make it true).

  The stalemate persists because FA theorists want to have it both ways: they want reasons to define the value (to be reductive), but they want the value to constrain the reasons (to avoid WKR).

  ### What Would Count as Progress?
  If you want to stop having this conversation in another twenty years, your group needs to make three moves that dissolve the "problem" rather than solving it:

  1.  **Declare Meta-Ethical Cards:** Explicitly ask: "Are we attempting a reductive analysis of value, or a structural elucidation?"
      *   If **Reductive:** Acknowledge that WKR is likely a fatal objection unless a non-circular filter is found (which hasn't happened). Shift focus to whether reduction is even desirable.
      *   If **Elucidatory:** Acknowledge that the "filter" is just the value property itself. Stop looking for a non-evaluative filter. The project then becomes explaining *why* value generates reasons, not defining value *as* reasons.

  2.  **Shift from "Reasons" to "Correctness":**
      *   Recent literature (e.g., McHugh, Way, Howard) suggests moving away from "fittingness reasons" to "correctness conditions."
      *   Instead of asking "What kind of reason makes admiration fitting?", ask "What is the standard of correctness for admiration?"
      *   This bypasses the WKR problem because pragmatic reasons (demon threats) do not bear on the *correctness* of the attitude, only on the *wisdom* of holding it. This distinguishes the normative domains without needing a "filter" on reasons.

  3.  **Accept the Fragmentation of Normativity:**
      *   The WKR problem assumes a unified sphere of "Reasons." Progress might come from accepting that "Reasons for Admiration" and "Reasons to Bring About Admiration" are different normative categories (fittingness vs. pragmatic), not two species of the same genus that need filtering.
      *   If you treat them as distinct normative relations from the start, there is no "Wrong Kind," just "Wrong Relation."

  ### Will You Be Here in Another Twenty Years?
  **Yes, if you keep framing it as "How do we filter reasons?"**
  That question presupposes that there is a single pool of reasons and some are "wrong." That presupposition is what keeps the debate alive.

  **No, if you frame it as "What is the meta-ethical ambition of FA?"**
  Once the group realizes that the WKR problem is only a problem for *Reductive Reasons-First* accounts, the debate splits.
  *   The Reductionists will likely abandon FA or accept that WKR refutes their specific project.
  *   The Non-Reductionists will dissolve the problem by admitting value is primitive.

  **Summary Diagnosis:**
  You are not missing a technical solution. You are witnessing a collision between two incompatible meta-ethical projects masquerading as a technical dispute about reason-classification. The "Vera" case proves that the group cares about grounding, not extension. The persistence of the debate proves that nobody wants to give up the *reductive ambition* (which requires the filter) while simultaneously accepting the *value-intuition* (which makes the filter circular).

  **Progress** looks like admitting that the "filter" is either impossible (for reductionists) or unnecessary (for non-reductionists), and moving the discussion to the architecture of attitudes rather than the taxonomy of reasons.
