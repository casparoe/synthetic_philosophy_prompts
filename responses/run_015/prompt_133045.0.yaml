answer: |-
  This is a fantastic conflict because it's incredibly modern, yet it taps into something ancient: the value of labor and the sanctity of a home.

  To answer your core question directly: **No, he is not crazy. Yes, his grief is real.** But your girlfriend character isn't necessarily "evil" for saying it; she's just speaking a different language of value.

  Here is the breakdown of the psychology and the philosophy, stripped of the academic jargon so you can use it to fuel the subtext of your scene rather than the dialogue.

  ### 1. Why His Grief is Real (The Builder's Truth)
  If you treat the digital world as "fake," then yes, the loss is imaginary. But humans don't experience the world that way. We experience it through **investment**.

  *   **Time is Mortality:** When he spent months building, he spent months of his actual, finite life. He didn't just click a mouse; he traded his lifespan for those pixels. When they destroyed it, they didn't just delete code; they erased a chunk of his life that he can never get back.
  *   **The "Third Place":** Sociologists talk about the "third place" (not work, not home, but where you community). For him, that virtual space *was* a home. It's where he felt safe, creative, and connected. Having a third place vandalized feels exactly like having your physical house broken into. It's a violation of safety.
  *   **Extended Self:** Psychologists believe we view our possessions as extensions of ourselves. When someone destroys something you made, they are attacking your competence and your identity.
  *   **The Money:** You mentioned he spent real money. That makes the loss tangible. If someone burned a $500 canvas you bought, you'd be upset. It doesn't matter if the image on the canvas was digital; the *value* exchanged was physical.

  **Verdict:** His pain is a physiological stress response to a violation of trust and labor. It is as real as losing a wallet or getting fired.

  ### 2. Why She Says What She Says (The Pragmatist's Truth)
  It is tempting to write her as the villain, but she will be more compelling if she thinks she is helping.

  *   **The "Fix-It" Reflex:** She sees him in pain. She wants the pain to stop. If she can convince him the cause of the pain is "stupid," then the pain *should* logically stop. She is trying to logic him out of an emotion.
  *   **Tangibility Bias:** She likely values things that have physical consequences. A broken window lets the cold in. Deleted code does not. She isn't trying to hurt him; she genuinely cannot see the invisible wound.
  *   **The Hidden Fear:** Often, when a partner says "grow up" about a hobby, the subtext is: *"I am afraid you care more about this world than the one we share."* She might feel threatened by how much he loves that space.

  **Verdict:** She is factually right (it is code), but emotionally wrong. She is prioritizing the *medium* over the *meaning*.

  ### 3. The "Philosophy Paper" Trap (And How to Avoid It)
  You mentioned you don't want them debating ontology. Good. In a fight, people don't talk about "the nature of reality." They talk about **dishes, time, and feelings.**

  To keep this grounded, translate the abstract into the concrete.

  **Don't write this:**
  > **Him:** "But the digital labor represents real ontological value!"
  > **Her:** "That is illogical because atoms are heavier than bits."

  **Do write this:**
  > **Him:** "I worked on that garden for three months. I missed your birthday dinner twice to finish the lighting in the courtyard. That time is gone."
  > **Her:** "So now missing my birthday is about a video game? You're crying over textures, not me."

  See the difference? He's talking about *time and sacrifice*. She's hearing *priorities.*

  ### 4. Who is "Right"?
  In the context of a relationship, **empathy trumps objective reality.**

  Even if a child cries over a melted ice cream cone, the cone is worth $3. But the grief is real to the child. A good partner comforts the grief; they don't debate the price of the ice cream.

  *   **He is right** that he was harmed.
  *   **She is right** that the object is intangible.
  *   **They are both wrong** about what the fight is actually about.

  **The Real Conflict:** The fight isn't about the online world. It's about **validation.** He wants her to say, "I see that you hurt." She wants him to say, "I promise this won't come between us in the real world."

  ### 5. A Suggestion for the Scene
  To show the reader he isn't crazy without telling them, focus on the **physical symptoms** of his grief.
  *   He's not just sad; his hands are shaking. He can't eat. He checks the site compulsively even though he knows it's gone.
  *   Show the **specifics** of what was lost. Not "a building," but "the bench where we talked when my dad died." This anchors the digital object to a physical memory.

  **Sample Beat Idea:**
  Have her try to comfort him physically (a hand on the shoulder), and have him flinch or pull away.
  *   **Her:** "Why are you pushing me away? It's just a game."
  *   **Him:** "Because you're the only thing that's supposed to be real, and you're treating me like I'm not."

  That line hits the core theme: *If you don't validate my pain, you make me feel unreal.*

  ### Summary for your writing:
  1.  **Validate him:** The reader needs to feel the weight of the lost labor.
  2.  **Humanize her:** She isn't trying to be cruel; she's trying to protect him (and maybe herself) from pain by minimizing the cause.
  3.  **The Stakes:** The argument threatens their relationship because it reveals they speak different emotional languages.

  He isn't crazy. He's grieving a loss of self. She isn't a villain. She's failing to translate. That is where the drama lives.
