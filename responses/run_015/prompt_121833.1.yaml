  1. The correspondence table
  In this analogy, the universal currency is welfare value. Denominations are specific pleasure tokens like eating pizza or hearing music. The exchange rate is the hedonic calculus determining how many units of pizza-equivalents trade for one Beethoven-equivalent. The Central Bank is the phenomenal feel—the raw "ouch" or "ahh"—that supposedly mints all pleasures into commensurable units. Counterfeiting represents false pleasures, where the subject believes they hold value but the underlying phenomenal asset is void. This setup suggests that just as banks reconcile different bills through a standard reserve, the mind reconciles different experiences through a common qualitative tone. The hedonist claims we don't need identical experiences, just a reliable conversion mechanism managed by consciousness. The mint must be authoritative; if the subject says two things feel equally good, the theory treats them as equal value, regardless of origin. This implies a hidden ledger tracking positive affect across disparate activities to ensure solvency.

  2. Where the mapping breaks
  Harmless breaks are easy: money is public and physical; pleasure is private and phenomenal. We can tolerate disanalogies there. The fatal break concerns authority. Currency exchange rates are conventional; central banks stipulate value based on policy. If hedonism relies on this analogy, it implies hedonic exchange rates are also stipulated, not discovered. But hedonists claim pleasure is *intrinsically* good, not good by convention. Who runs the phenomenal mint? If it's the subject's immediate impression, then exchange rates are unstable and opaque—I can't know if your pizza-unit trades for my symphony-unit. If it's a natural property, we lack access to the central bank ledger. Without a real mint issuing a common phenomenal tone, the exchange rate is just a metaphor for "we decide to treat them as equal." This collapses the quantitative claim into a qualitative stipulation. You haven't solved heterogeneity; you've just asserted commensurability by fiat, masking the lack of a natural common denominator behind financial jargon. Furthermore, money works because everyone accepts the stipulation. Pleasure lacks this intersubjective agreement mechanism. If the mint is internal, there is no market correction for bad rates. A hedonist claiming a natural mint must show the phenomenal residue is identical across experiences, which returns us squarely to the original heterogeneity objection they tried to dodge. The analogy hides the need for a natural kind of feeling; without it, the "exchange rate" is empty. Ultimately, the analogy functions more as a rhetorical shield than a substantive defense of monism. It obscures the metaphysical gap.

  3. The smuggled premises
  The analogy smuggles in fungibility and third-party verification. Dollars are fungible; any unit replaces another without loss. Pleasures are arguably not fungible; losing a specific memory of joy isn't fixed by generic utility. It also assumes liquidity; pleasures often cannot be cashed out mid-experience in real time. Money also assumes a stable ledger accessible to auditors. Hedonism assumes a private ledger inaccessible to anyone but the subject. By using currency, the argument imports the intuition that because we *can* trade money for goods, we *must* be able to trade pleasures for values. It presupposes that commensurability is a functional requirement rather than an ontological fact. The quantitative hedonist conclusion doesn't survive scrutiny; it was carried entirely by the analogy. The analogy works only if you already accept that diverse experiences share a single metric. If you deny the common metric, the currency comparison begs the question. It treats the existence of exchange rates as proof of a common underlying substance, when rates could merely reflect pragmatic compromise without ontological unity. The financial metaphor makes heterogeneity look like a technical accounting problem rather than a metaphysical barrier, convincing listeners through familiarity rather than rigorous argumentation about the specific nature of mind.

  4. A better analogy, or an argument for why none works
  Drop the analogies. They are pedagogical, not ontological. Real argument must be phenomenological: do all pleasures feel exactly alike in some dimension? If yes, hedonism holds. If no, no analogy saves it. Currency fails because it assumes what needs proving. A better approach is admitting pleasures are heterogeneous but arguing for a functional unity in decision-making, not phenomenal unity. This abandons classical hedonism for preference satisfaction. Until the hedonist points to the phenomenal glue binding pizza and Beethoven, the currency trick is sophistry masking a category error. Analogies clarify existing concepts; they cannot manufacture commonality where none exists in experience.
