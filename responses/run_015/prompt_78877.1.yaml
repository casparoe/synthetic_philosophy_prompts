answer: |-
  You are thinking of the **Disjunction Problem** (sometimes called the **Problem of Error**).

  The specific intuition you described—"you can always redraw the line" between the stimulus, the object, and the action—is also closely related to what is known as the **Qua Problem** (as in: the state is triggered by the eagle, but *qua* what? Qua eagle? Qua dark shape? Qua predator?).

  The family of replies you are half-remembering, centered on "what a state is there for," is **Teleosemantics** (or Etiological Semantics).

  Since you are a linguist, you have the right instinct that this feels like Quine's indeterminacy, but the metaphysical stakes are different. Here is the carving you asked for: the problem, the distinction from Quine, the teleological solution, and why critics think it might still be "moving the bump."

  ### 1. The Problem: Causal Theories and the Possibility of Error

  To understand the Disjunction Problem, you have to see the theory it attacks. In the 1980s, naturalistic philosophers of mind (like Fred Dretske and Jerry Fodor) wanted to explain mental content without using spooky, non-physical "meaning." They proposed **Causal/Informational Semantics**:

  *   **The Proposal:** A mental state $M$ means *Eagle* if and only if instances of *Eagle* reliably cause $M$.
  *   **The Intuition:** Meaning is just a causal correlation. Smoke means fire because fire causes smoke.

  **The Disjunction Problem arises when errors occur.**
  Suppose a monkey has a state $M$ (alarm call).
  1.  Eagles cause $M$.
  2.  But sometimes, falling leaves cause $M$ (false alarms).
  3.  If meaning is just "whatever causes $M$," then $M$ does not mean *Eagle*. It means *Eagle OR Leaf*.
  4.  But if $M$ means *Eagle OR Leaf*, then when a leaf triggers $M$, the monkey is not making a mistake. It is telling the truth (there is a leaf).
  5.  **The Consequence:** A purely causal theory cannot account for **misrepresentation**. It eliminates the possibility of error. If the state fires, whatever caused it is, by definition, what it means.

  This is your "redraw the line" puzzle. If the monkey dives for a leaf, is it representing a leaf? If yes, it never errors. If no, what natural fact distinguishes the eagle-cause from the leaf-cause, given that both physically trigger the same neural state?

  ### 2. How This Differs from Quine (Gavagai)

  You are right to feel a resonance with Quine's *indeterminacy of translation*, but the projects are orthogonal.

  *   **Quine (Epistemological/Semantic):** Quine is asking, "Given all possible behavioral evidence, can we determine the *translation* of a term?" His point is that *evidence* underdetermines theory. There might be no fact of the matter *for the translator*.
  *   **The Disjunction Problem (Metaphysical/Naturalistic):** This problem assumes there *is* a fact of the matter about what the monkey represents, and asks, "What *natural property* constitutes that fact?" It is not about what we can know from the outside; it is about what mechanism in the universe grounds intentionality.

  Quine says: "You can't prove it means 'rabbit' rather than 'rabbit part'."
  The Disjunction Problem says: "If meaning is just causation, it literally *cannot* mean 'rabbit' rather than 'rabbit or rabbit-part-cause', because the causation is identical."

  Quine challenges the *linguist*; the Disjunction Problem challenges the *naturalist*.

  ### 3. The Solution: Teleosemantics

  The "what a state is there for" intuition is the core of **Teleosemantics**, championed by Ruth Millikan, David Papineau, and Karen Neander.

  **The Move:**
  Content is not fixed by what *actually* causes the state (causal history), but by what the state was *selected for* detecting (evolutionary history).

  **The Carving:**
  1.  **Proper Function:** A trait has a "proper function" if it was reproduced in the past because it performed that specific task. (Your heart's proper function is pumping blood, not making a thumping sound, even though it does both, because pumping is why ancestors survived to pass on the heart).
  2.  **Application to the Monkey:** The monkey's alarm mechanism exists because, in the evolutionary past, detecting **eagles** conferred a survival advantage.
  3.  **Fixing Content:** The content of the state is *Eagle*, not *Dark Shape*, because the selection pressure was specifically about eagles (or predators), not shadows.
  4.  **Solving Error:** When a leaf triggers the state, it is a **misrepresentation**. The state is functioning *abnormally* relative to its design conditions. The leaf is not what the state is *for* detecting, even if it is what *did* detect it.

  This privileges the eagle case over the leaf case not by looking at the current stimulus, but by looking at the **etiological history** of the mechanism.

  ### 4. Is This Just Moving the Bump? (The Circularity/Gerrymandering Objection)

  You asked: *"If someone tells me that what the state is there for fixes what it's about, I want to know why that isn't circular, and whether I could always describe a broader job for the state and reopen the same hole."*

  This is the standard critique, and it is sharp. Here is the dialectic:

  **Objection 1: The Indeterminacy of Selection (The "Broader Job" Problem)**
  You asked if we can describe a broader job. Evolutionary biologists face this too. Was the mechanism selected for detecting *Eagles*? Or *Predators from Above*? Or *Small Moving Dark Shapes*?
  *   **Teleosemantic Reply:** The content is as determinate as the selection pressure. If the monkey also has a separate call for leopards, the selection pressure distinguishes "aerial predator" from "ground predator." If the monkey dives for *any* dark shape, then perhaps the content really *is* "dangerous overhead object." Teleosemantics accepts that content might be coarser than human language. It doesn't promise "Eagle" if the biology only tracks "Overhead Threat."
  *   **The Worry:** This looks like you are still redrawing the line, just at the level of evolutionary description rather than behavioral description.

  **Objection 2: Circularity (Normativity)**
  To say a state is "supposed to" detect eagles implies a norm. But evolution is just blind variation and retention. How do you get a "should" (normativity) from an "is" (survival)?
  *   **Teleosemantic Reply:** It's not circular because "selection history" is a brute physical fact. We can describe the reproductive history of the neural circuit without using intentional terms. The "norm" is derived from statistical success in ancestry.
  *   **The Critic's Counter (Fodor):** Jerry Fodor argued that Teleosemantics fails because selection acts on *correlations*, not specific properties. If eagles are always correlated with dark shapes in the environment of adaptation, selection cannot distinguish between "detecting eagles" and "detecting dark shapes." Thus, the Disjunction Problem re-emerges at the level of evolution.

  **Objection 3: Swampman**
  If a lightning strike creates a molecule-for-molecule copy of the monkey (Swampman) with no evolutionary history, does its alarm call mean anything?
  *   **Teleosemantic Reply:** No. It has no proper function, so it has no content.
  *   **Intuition Pump:** Most people feel Swampman *does* have thoughts. If Teleosemantics says it doesn't, the theory might be too restrictive.

  ### 5. Summary for your Notes

  *   **The Name:** The **Disjunction Problem** (within Naturalized Semantics).
  *   **The Specific Flavor:** The **Qua Problem** (which property of the stimulus fixes the content?).
  *   **The Distinction from Quine:** Quine is about *evidence* for translation; Disjunction is about the *metaphysical grounds* of representation (specifically the possibility of error).
  *   **The Solution Family:** **Teleosemantics** (Millikan, Papineau, Neander).
  *   **The Mechanism:** Content is fixed by **Proper Function** (evolutionary selection history), allowing for **Misrepresentation** when the system is triggered by non-selected causes.
  *   **The Remaining Hole:** Critics (like Fodor and Godfrey-Smith) argue that selection pressures are often just as disjunctive as causal correlations (e.g., selected for *Eagle OR Dark Shape*), so the problem may just be pushed back to the level of biology without being solved.

  **Recommended Reading for the Reading Group:**
  1.  **Fred Dretske,** *Knowledge and the Flow of Information* (sets up the causal problem).
  2.  **Ruth Millikan,** *Language, Thought, and Other Biological Categories* (the founding text of Teleosemantics).
  3.  **Jerry Fodor,** *Psychosemantics* (specifically the chapter on "Learning and the Disjunction Problem" for the critique).
  4.  **Peter Godfrey-Smith,** "Conditions for Evolution by Natural Selection" (for the difficulty of pinning down "function").

  You haven't wandered into trouble; you've walked straight into the central metaphysical problem of cognitive science. The fact that you can't shake it is a good sign.
