prompt: |-
  hey so im giving a talk tomorow at this summer philosophy-of-science seminar for high schoolers, and im kinda nervous about the q&a. im defending inference to the best explanation as an actual rational norm in science, not just a psychological shortcut, but im adding this twist i call explanatory friction: basically, an explanation scores lower friction if you cant easily chop it up into little independent local explanations that dont talk to each other. i think this fixes the bad lot problem because the globally best explanation might actually have high friction, which shows its stitched together ad hoc even if it predicts well. i need a prep sheet for the objections ill actually get.

  the audience is like ten other students, mostly science kids who just learned bayesian updating and think priors and likelihoods should do all the work, plus this grad student mentor who is obsessed with hume and thinks any inductive rule is circular, and the seminar director who wrote her thesis on simplicity metrics in theory choice. can you draft the objections in the order theyll come and how damaging each one is, phrased the way each of them would actually say it? for each one i need a quick two-minute reply, a note on where my reply is soft, and whether i should concede something up front or hold firm. also tell me the one question im hoping nobody asks, probably something about whether friction is just simplicity in a weird costume.

  definately cover the bayesian kids saying im double-counting probabilities, the mentors humean skepticism that i cant justify IBE without assuming what im trying to prove, and the directors point that simplicity already captures what im measuring. i want to know which of these has real teeth and which ones i can brush off without looking defensive. oh and dont just list generic philosophy objections, make them specific to my friction idea and the audience, since these people will smell a generic answer from a mile away.
reasoning: |-
