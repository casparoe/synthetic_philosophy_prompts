      *   Okay, I will stick to this mapping. High Friction = Ad Hoc/Modular/Disconnected. Low Friction = Integrated/Unified.

  7.  **Drafting the Content:** (Mental check of the replies to ensure they don't sound too academic for a high school seminar, but smart enough for the Director).
