      *   *Correction:* In physics, friction is a cost. High friction = bad. So "High Friction" should mean "Hard to move/operate" or "Resists unity"?
      *   *User's text:* "globally best explanation might actually have high friction, which shows its stitched together ad hoc".
      *   *Okay:* High Friction = Bad (Stitched together). Low Friction = Good (Unified).
      *   *Wait, re-reading again:* "scores lower friction if you cant easily chop it up".
      *   If I *can't* chop it up -> It is unified -> Low Friction.
