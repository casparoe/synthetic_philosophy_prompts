  ### 5. The Air Travel Implication

  You asked: *If the severe tier is lexically dominant (3), am I committed to forbidding ordinary air travel?*

  **Short Answer:** No, but you need a principled distinction between *imposing risk* and *causing harm*.

  **The Argument:**
  1.  **Risk vs. Harm:** A lexical constraint on *harm* (torture) does not automatically translate to a lexical constraint on *risk imposition*. Most lexical views (e.g., Threshold Deontology) forbid actions that impose a *significant* risk of lexical harm, but permit actions that impose *negligible* risks.
  2.  **The De Minimis Principle:** You can introduce a risk threshold. If the probability of severe harm is below a certain level (e.g., $10^{-9}$), the expected lexical disvalue does not trigger the prohibition. This is consistent with (6) if you treat the "one-in-a-million" case as *above* the threshold and air travel as *below* it.
  3.  **Secure Rights:** Alternatively, frame (3) as a right not to be *tortured*, not a right not to be *exposed to risk*. Air travel exposes others to risk, but does not violate their secure right against torture unless the risk materializes. This allows you to maintain (3) without paralysis.

  **Recommendation:** To avoid the "forbid air travel" bullet, do not treat (3) as a constraint on *expected* value directly. Treat it as a constraint on *outcomes*, and apply a separate normative principle for risk imposition that allows for *de minimis* exceptions. This preserves (6) (where the risk is explicit and high enough to consider) while permitting ordinary life.

  ### Summary of Actionable Steps

  1.  **Discard (5).** Stop trying to force lexical intuitions into standard real numbers. It is the source of the logical contradiction.
  2.  **Reject the Supervisor's Fix.** It saves the math but destroys the normative force of your applied chapter (individual contributions become negligible).
  3.  **Adopt Lexical Aggregation.** Mild harms sum linearly within their tier; severe harms lexically dominate.
  4.  **Refine Risk Protocol.** For the air travel question and your EV chapter, explicitly define a *de minimis* risk threshold below which lexical constraints do not activate. This prevents paralysis while maintaining the strict verdict on the "Torture vs. Specks" case.
