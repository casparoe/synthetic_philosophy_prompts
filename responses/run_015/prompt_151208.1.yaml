  1.  **Define the Kill Condition:** Identify what specific evidence would force proponents to abandon this claim. If no such evidence exists (the claim is immune), **CUT**. Do not pass go. (Stop)
  2.  **Check the Body Count:** Has that evidence appeared? Search open sources. If no, go to Step 4. If yes, go to Step 3.
  3.  **Check the Move:** Did proponents abandon the claim or relocate it (shift dates, sites, or causes)? If relocated, **CUT**, even if mainstream. If abandoned, **KEEP**. (Stop)
  4.  **Consensus Check:** Is this claim standard in current school textbooks? If no, **REFRAME**. If yes, **KEEP**. (Stop)
  5.  **Values Check:** Does this contradict a community's own recorded memory regarding their heritage? If yes, **HAND-OFF** to Editor. (Stop)

  **Verdict Definitions**
  *   **CUT:** Remove entirely. Do not replace with 'some say'.
  *   **REFRAME:** State clearly: 'Historians debate this'. Do not imply equivalence between evidence levels. Avoid 'some people believe'; use 'evidence suggests' vs 'others argue'.
  *   **KEEP:** State as fact.
  *   **HAND-OFF:** Editor decides based on values, not evidence. This is for conflicts where evidence is secondary to representation.

  **Applications**

  1.  **Megalithic/Aliens:** Kill condition: Proof of human technology. Exists. Proponents relocate (claim technology was lost/hidden). Verdict: **CUT**.
  2.  **Phantom Time:** Kill condition: Dendrochronology continuity. Exists. Proponents relocate (claim tree rings were fabricated). Verdict: **CUT**.
  3.  **Oral Tradition:** Kill condition: Contemporary written record. Exists. Proponents (community) reject it as biased. This is not relocation, it is conflicting epistemology. Verdict: **HAND-OFF**.

  **Honest Note**

  This procedure tests stability, not truth. It will flag emerging correct theories as fringe until textbooks catch up. It cannot resolve moral conflicts over whose memory counts; it only identifies them. It relies on the freelancer spotting the 'relocation', which requires judgement, not just search skills. It protects you from conspiracy, not from being slightly behind the academic curve. It also cannot detect when a mainstream claim is simply wrong but hasn't yet been relocated; it relies on the existence of a counter-claim that moves the goalposts. If the mainstream is wrong but static, this procedure keeps it. That is the risk you take for defensibility. You are buying immunity from crankery, not infallibility. Step 3 is your only weapon against textbook error; if the error is static, you will publish it.
