answer: |-
  The postcolonial charge that your triad reproduces colonial categories is the talk-sinker, defused only by conceding the framework is Eurogenic while insisting it captures the recursive logic anticolonial movements used to seize sovereignty.

  **Two Concessions to Make in the First Two Minutes**
  1.  **To the Andersonians:** Concede that print capitalism is necessary for the *scale* and *speed* of condition (iii)'s diffusion, even if it is not the *origin* of the template; this prevents them from caricaturing you as a technological determinist inverse.
  2.  **To the Hobsbawmian/Gellnerian:** Concede that emulation requires a material trigger—specifically a crisis of state legitimacy or fiscal crisis—rather than occurring in a vacuum; this prevents the charge of idealism.

  **The Question You Hope Nobody Asks**
  Your candidate regarding archive bias on condition (iii) is indeed the trap, but something worse is coming: **conceptual anachronism**. The harder question is not whether non-elite opinion was recorded, but whether "jurisdiction" in the premodern period meant anything comparable to the modern state boundary you require for condition (iii). If "rule" was personal or dynastic rather than territorial, your coding of premodern cases as lacking (iii) is tautological, not empirical. Prepare to define "jurisdiction" functionally (tax/conscript) rather than legally to survive this.

  **Q&A Prep Sheet (Ordered by Expected Damage)**

  **1. Objection: The Colonial Mirror**
  *   **Who:** Postcolonial/Decolonial Theorist
  *   **Idiom:** "You claim these conditions are universal, but condition (iii) looks exactly like the colonial state's assumption that cultural units require administrative boundaries. Aren't you just naturalizing the colonial gaze by treating its output as the definition of nationalism?"
  *   **90-Second Reply:** Acknowledge the framework emerges from European statecraft (Eurogenic), but argue it captures the *structure of claims* made by anticolonial nationalists, not just the colonizer's view. Anticolonial movements adopted the template to seize sovereignty; my mechanism (emulation) explains why they adopted a tool that constrained them. The framework describes the trap they entered, not the truth of their identity.
  *   **Weakest Point:** It risks sounding like you're saying "the colonized chose their own oppression," which is politically toxic.
  *   **Strategy:** **Answer,** but lean heavily on the early concession that the template is Eurogenic. Do not defend the normativity of the template, only its descriptive utility for how claims were made.

  **2. Objection: Modularity Without Engine**
  *   **Who:** Senior Andersonian
  *   **Idiom:** "Anderson's modularity works because print capitalism creates the cognitive capacity for the nation. If you strip out print capitalism as the origin story, you have a free-floating idea with no material base. How does a template travel without the infrastructure that makes it intelligible?"
  *   **90-Second Reply:** Distinguish between *intelligibility* and *legitimacy*. Print makes the nation imaginable (intelligible), but state legibility (census/conscription) makes the nation *necessary* for rule (legitimate). The template travels because elites need a justification for jurisdiction that survives dynastic collapse, not because people can read. Print diffuses the script; state crisis writes it.
  *   **Weakest Point:** You risk splitting hairs between "imagining" and "legitimizing" that Anderson himself might say are the same thing.
  *   **Strategy:** **Answer.** This is your core contribution. Stand firm on the distinction between cultural capacity and political necessity.

  **3. Objection: Observation vs. Anderson**
  *   **Who:** Quantitative Comparative Politics
  *   **Idiom:** "If both you and Anderson predict nationalism spreads in the 19th century via diffusion, what is the observable implication that distinguishes your model? If I run a regression, what variable do you have that Anderson doesn't?"
  *   **90-Second Reply:** The variable is *state capacity prior to nationalism*. Anderson predicts nationalism where print markets exist; you predict it where state legibility (census/conscription) exists *before* the nationalist claim. Look for cases with high print literacy but low state penetration (no nationalism) vs. high state penetration with low literacy (early nationalism).
  *   **Weakest Point:** These cases are rare and noisy; you might not have enough data points to satisfy a quantifier.
  *   **Strategy:** **Answer,** but offer to collaborate on operationalization. Do not concede the models are identical.

  **4. Objection: The Silent Premodern Majority**
  *   **Who:** Historian of Premodern Ethnicity
  *   **Idiom:** "You code premodern cases as lacking condition (iii) because elites didn't write it down. But if peasants resisted taxation based on ethnic lines, isn't that a functional claim to jurisdictional boundary, even if untheorized? Isn't your coding an artifact of the archive?"
  *   **90-Second Reply:** Distinguish between *resistance* and *legitimacy*. Peasant revolts often demand restoration of old rights, not a new mapping of rule to culture. Condition (iii) requires the normative claim that the boundary *ought* to coincide, not just that it is convenient. The archive silence reflects a lack of the *claim*, not just the record.
  *   **Weakest Point:** It is hard to prove a negative (that the claim didn't exist) without sounding like you're ignoring subaltern agency.
  *   **Strategy:** **Concede** partial ground. Admit that sporadic claims may exist but argue they lack the *systematic* character of the 19th-century template.

  **5. Objection: Who Benefits?**
  *   **Who:** Gellnerian Comparative Sociologist
  *   **Idiom:** "A legitimatory template is an idealist relic unless you specify the carrier group. Which actors have an interest in adopting condition (iii), and what was their material situation that made this template more useful than dynastic right?"
  *   **90-Second Reply:** The carriers are state administrators and military officers facing fiscal crisis. Dynastic right fails when the dynasty fails; national right binds the population to the *state* apparatus regardless of the ruler. It is a survival strategy for the bureaucracy, not just an idea for intellectuals.
  *   **Weakest Point:** You risk reducing nationalism to a bureaucratic conspiracy, ignoring popular uptake.
  *   **Strategy:** **Answer.** This aligns well with your state legibility claim.

  **6. Objection: The Trigger Problem**
  *   **Who:** Hobsbawmian Historian
  *   **Idiom:** "Invented traditions cluster where social change breaks older practices. If this is emulation, why does it cluster in the 19th century? What broke the old template to make emulation necessary?"
  *   **90-Second Reply:** The trigger is the collapse of dynastic legitimacy following the Napoleonic wars and the rise of mass conscription. You cannot conscript men for a king's quarrel easily; you need a people's quarrel. The break is the shift from dynastic war to total war, requiring a new justification for sacrifice.
  *   **Weakest Point:** You might be over-specifying the trigger where multiple causes exist.
  *   **Strategy:** **Answer,** but reference the early concession about crises.

  **7. Objection: Normative Force**
  *   **Who:** Chair (Liberal Political Theorist)
  *   **Idiom:** "If the nation is just a legitimatory template for jurisdiction, what happens to the normative force of self-determination? Can a nation under your description ever be wrong about its own boundaries, or is it just a successful claim?"
  *   **90-Second Reply:** My account is descriptive, not normative. It explains why claims are made, not whether they are just. A nation can be wrong if its claim to condition (i) or (ii) is factually false, or if condition (iii) violates existing legitimate jurisdictions. Success does not equal right.
  *   **Weakest Point:** It risks divorcing your theory from the political stakes that make nationalism matter.
  *   **Strategy:** **Concede** that your theory does not solve the normative problem, only explains the mechanism.

  **8. Objection: Census-Map-Museum Labour**
  *   **Who:** ABD Andersonian
  *   **Idiom:** "Anderson says census, map, and museum work together to imagine the state. You say they do unequal labour. If the census creates the categories, how can emulation happen before the census data exists in the periphery?"
  *   **90-Second Reply:** The census *codifies* categories that already exist in administrative practice (tax/conscription). Emulation spreads the *idea* that these categories matter politically, not the data itself. The map and museum follow the census; the census follows the need to rule.
  *   **Weakest Point:** It complicates the timeline of Anderson's triad which is well-established.
  *   **Strategy:** **Answer,** but keep it brief. This is a technical dispute compared to the theoretical ones above.
