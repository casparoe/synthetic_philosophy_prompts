answer: |-
  Translation is not the preservation of textual invariants but the reconstruction of aesthetic effect, requiring negotiated loss where form and sense compete for the same semantic space.

  ### 1. Agreed Claims

  1.  **Impossibility of Total Fidelity:** No translation can preserve all semantic, phonetic, and structural properties of the source simultaneously; loss is mandatory, not accidental.
  2.  **Form as Signal:** Formal features (rhyme, meter, stanza shape) are not merely decorative; they generate emphasis, pacing, and tone that contribute to the poem's total meaning.
  3.  **Constraint Cost:** Preserving a formal constraint usually imposes a semantic cost (e.g., forced syntax, altered imagery, or shifted register); there is no free lunch.
  4.  **Distortion Definition:** A translation is distorted when it asserts something the source denies, omits something the source emphasizes, or induces an emotional response contradictory to the source.
  5.  **Target Audience:** The success of a translation is measured by the experience of the target reader, not by the satisfaction of the translator or the fidelity to the source text as an abstract object.
  6.  **Functional Equivalence:** Both camps agree that a translation should feel like a poem in the target language, not like a puzzle solution or a glossary entry.

  ### 2. Table of Leftovers

  | Form-First Claim | Content-First Claim | Real vs. Verbal |
  | :--- | :--- | :--- |
  | **Identity:** The poem's structure is constitutive of its identity; removing the skeleton kills the organism. | **Identity:** The poem's semantic cargo is its identity; the structure is the packaging, which can be swapped if damaged. | **Real:** Disagreement on ontological status of form. |
  | **Distortion:** Breaking a formal constraint (e.g., rhyme) is a primary distortion, equivalent to changing a fact. | **Distortion:** Breaking semantic accuracy (e.g., forced rhyme changing meaning) is the primary distortion; form loss is secondary. | **Real:** Disagreement on hierarchy of errors. |
  | **Inheritance:** Preserving the *effect* of a constraint (e.g., tension via assonance) counts as preserving the constraint. | **Inheritance:** Only preserving the *mechanism* (e.g., actual rhyme) counts; effect substitution is adaptation, not translation. | **Real:** Disagreement on definition of equivalence. |
  | **Acrostic:** The hidden name is essential content; losing it loses the addressee and the poem's occasion. | **Acrostic:** The hidden name is occasional context; losing it loses a puzzle, but the lyrical address remains intact. | **Real:** Disagreement on what counts as "content." |
  | **Perception:** Readers perceive structural integrity (even subconsciously) and feel the loss if it is broken. | **Perception:** Readers perceive semantic flow and feel the loss if the text sounds forced or obscure. | **Real (Empirical):** Disagreement on reader psychology. |

  ### 3. Concrete Cases and Measurements

  **Row 1 & 4: The Acrostic/Rhyme Conflict (Crux a)**
  *   **Case:** The Marot poem where the acrostic spells the lover's name (e.g., "HELENE") but English rhyme schemes cannot accommodate the letter count or rhymes without distorting the address.
  *   **Measurement:** Produce two versions: Version A keeps rhyme/meter, drops acrostic. Version B keeps acrostic (via stanza count/initials), drops strict rhyme/meter. Blind test with bilinguals who know the context.
  *   **Question:** Which version is rated higher on "emotional coherence" and "sense of address"?
  *   **Form-First Prediction:** Version A will be preferred; the musical integrity sustains the lyric voice even if the name is lost to the eye.
  *   **Content-First Prediction:** Version B will be preferred; knowing *who* is addressed grounds the semantics, while rhyme is audible decoration.
  *   **Note:** If both score poorly, the poem may be untranslatable under these constraints, validating the need for "functional inheritance."

  **Row 3: Functional Inheritance (Crux b)**
  *   **Case:** A rhyme pair in French welds opposites (e.g., *jour/nuit*). English cannot rhyme them without nonsense.
  *   **Measurement:** Create Version A (rhymes different words, loses opposition) and Version B (keeps opposition via syntax/position, loses rhyme). Ask readers to rate "tension" or "contrast" on a Likert scale.
  *   **Form-First Prediction:** Version A scores higher on "poeticity"; the sound weld is the primary vehicle of tension.
  *   **Content-First Prediction:** Version B scores higher on "meaning"; the semantic clash is the primary vehicle of tension.
  *   **Verdict Condition:** If Version B scores higher on tension *and* readability, functional inheritance is validated as translation. If it scores lower on "poeticity" but higher on "clarity," it is an adaptation.

  **Row 5: Reader Perception (Crux e)**
  *   **Case:** A translation preserves a complex stanza turn that mirrors the argument shift, versus one that smooths the turn for flow.
  *   **Measurement:** Eye-tracking or pause-duration analysis on readers encountering the turn. Follow-up interview: "Did you notice a shift here?"
  *   **Form-First Prediction:** Readers will pause longer at the preserved turn, indicating subconscious structural recognition.
  *   **Content-First Prediction:** Readers will not notice the structural turn unless explicitly signaled by semantics; smooth flow yields higher comprehension.
  *   **Note:** If readers do not notice the preserved structure, theForm-First cost is invisible labor. This does not invalidate the labor, but reclassifies it as archival rather than communicative.

  **Row 1 & 2: Process Order (Crux d)**
  *   **Case:** Two teams translate the same stanza. Team A starts with meter/rhyme scheme, fills sense. Team B starts with literal sense, imposes meter/rhyme.
  *   **Measurement:** Independent judges score outputs on Semantic Fidelity (S) and Formal Fidelity (C) using a rubric agreed upon beforehand.
  *   **Form-First Prediction:** Team A (Skeleton-First) will achieve higher C with acceptable S; constraints generate creative solutions.
  *   **Content-First Prediction:** Team B (Content-First) will achieve higher S with acceptable C; forcing sense into pre-set boxes creates distortion.
  *   **Verdict Condition:** The team with the higher sum (S+C) wins the process argument. If Team A wins, constraints are scaffolds. If Team B wins, constraints are cages.

  **Row 3: Quantitative Scoring (Crux c)**
  *   **Case:** Plotting S (Semantic) vs. C (Formal) for existing translations.
  *   **Measurement:** **Warning:** You are being thick here. S and C are not orthogonal variables; they are coupled. Changing a rhyme (C) almost always changes nuance, register, or syntax (S). You cannot define S independently of C without rigging the metric.
  *   **Correction:** Do not plot S vs. C. Plot **Reader Preference** vs. **Constraint Count**.
  *   **Form-First Prediction:** Preference correlates positively with Constraint Count up to a threshold, then drops (too forced).
  *   **Content-First Prediction:** Preference correlates negatively with Constraint Count (more constraints = more distortion).
  *   **Verdict Condition:** If the curve is inverted-U, both are partially right: constraints help up to the point of semantic breakage. If linear, one side is wrong.
  *   **Why this matters:** Your desire for a Pareto frontier assumes independent variables. In poetry, form and content are entangled states. Measuring them separately is like measuring the weight and color of a sound wave; the metric defines the reality.
