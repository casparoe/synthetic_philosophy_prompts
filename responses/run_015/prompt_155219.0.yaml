  Here is a design for your ninety-minute session. It is built to be run without a projector or complex handouts, relying on large paper sheets and marker pens. The arithmetic is kept to single digits. The goal is to let the group discover the tension between the two rules through their own discomfort, rather than being told about it.

  ### Session Design: The Stretching Pie

  **Room Setup**
  *   **Seating:** Eight pairs of chairs facing each other, spaced out enough for private conversation.
  *   **Wall Chart:** A large sheet of paper on the wall with a grid. The horizontal axis is "Player A's Tokens", the vertical is "Player B's Tokens". Mark points clearly: 0, 2, 4, 6, 8, 10.
  *   **Materials:** Eight envelopes per round (one per pair), containing cards. A box of biscuits for the break (and end). A pen for the facilitator.

  **The Stakes**
  To make the tokens matter without creating genuine hostility, tell the group: *"Treat these tokens as if they were pounds sterling for you personally. At the end, I will ask you how it felt. The biscuits are for everyone regardless of outcome, but the pair who finishes their negotiations fastest in the final round gets to choose the topic for next month."* This keeps the mood cooperative but gives them a reason to care about the numbers.

  **The Rules of Play (Read Aloud)**
  1.  You are in pairs: Player A and Player B.
  2.  In each round, you have a menu of deals. Each deal shows how many tokens A gets and how many B gets.
  3.  You must agree on one deal from the menu. If you cannot agree within the time limit, you both get **zero** tokens for that round (the "Breakdown").
  4.  There is also a "Best Case" number written on the board for each round. This is the most tokens you could *possibly* get if your partner gave you everything and took nothing themselves.
  5.  Write your agreed numbers on a sticky note and put it on the Wall Chart.

  **Timeline (90 Minutes)**

  *   **00:00 – 00:10: Introduction.** Explain the rules above. Distribute Round 1 envelopes.
  *   **00:10 – 00:25: Round 1 (The Baseline).**
      *   *Task:* Negotiate a split.
      *   *Time:* 15 minutes.
  *   **00:25 – 00:30: Plotting.** Pairs place sticky notes on the Wall Chart. Brief look at the cluster.
  *   **00:30 – 00:45: Round 2 (The Stretch).**
      *   *Task:* Negotiate a split with new options.
      *   *Time:* 15 minutes.
  *   **00:45 – 00:50: Plotting.** Place notes. Do not discuss yet.
  *   **00:50 – 01:00: Break.** Biscuits served. Informal chat encouraged.
  *   **01:00 – 01:10: Round 3 (The Reverse).**
      *   *Task:* Negotiate a split where the advantage flips.
      *   *Time:* 10 minutes (shorter to keep pace).
  *   **01:10 – 01:15: Final Plotting.**
  *   **01:15 – 01:30: Debrief.** Sit in a circle. Discuss the Wall Chart. Reveal the theory.

  **Round Details (For Facilitator Eyes Only)**

  *   **Round 1:**
      *   **Breakdown:** 0 tokens each.
      *   **Menu:** (5, 5), (6, 4), (4, 6).
      *   **Best Case (Board):** A: 6, B: 6.
      *   *Expectation:* Almost everyone picks (5, 5). It is symmetric. Both rules agree here.
  *   **Round 2:**
      *   **Breakdown:** 0 tokens each.
      *   **Menu:** (5, 5), (6, 4), (4, 6), **(10, 0)**.
      *   **Best Case (Board):** A: 10, B: 6. (Note: A's best case has increased because of the new option).
      *   *Expectation:* This is the test. The (10, 0) option is terrible for B and unlikely to be chosen. However, it changes A's "Best Case" from 6 to 10.
      *   *Rule 1 (Equal Fractions):* Suggests moving towards A (e.g., to 6, 4) because A's potential range is now wider.
      *   *Rule 2 (Biggest Product):* Suggests staying at (5, 5) because the product (25) is still higher than (6, 4) which is 24. The unusable option shouldn't matter.
      *   *What to watch for:* Do the sticky notes drift to the right (favoring A)?
  *   **Round 3:**
      *   **Breakdown:** 0 tokens each.
      *   **Menu:** (5, 5), (6, 4), (4, 6), **(0, 10)**.
      *   **Best Case (Board):** A: 6, B: 10.
      *   *Expectation:* If the drift in Round 2 was real, it should now drift up (favoring B). This confirms it wasn't just Player A being pushy.

  **Debrief Script (Key Moments)**

  1.  **The Cluster:** Point to Round 1. "Everyone landed here. Easy. Both rules say the same thing."
  2.  **The Drift:** Point to Round 2. "Look at the shift. Some of you moved towards A. Why? A didn't force you. The (10, 0) card was there, but nobody picked it. Did its mere presence make (5, 5) feel stingy?"
  3.  **The Rules:**
      *   "One rule says: Ignore the (10, 0) card. It's irrelevant. Stick to the biggest product. That keeps you at (5, 5)."
      *   "The other rule says: Look at the distance from zero to your best case. If A's best case stretched from 6 to 10, A should get a bigger share to keep the 'fraction of potential' equal. That pulls you to (6, 4)."
  4.  **The Names:** "In the literature, the 'Biggest Product' rule is called the **Nash Bargaining Solution**. The 'Equal Fractions' rule is called the **Kalai-Smorodinsky Solution**."
  5.  **The Correction:** "You suspected the rules were different. You were right. You also guessed that adding an extreme option would drag the settlement. The math says that drag is the signature of the Equal Fractions rule (Kalai-Smorodinsky), not the Product rule (Nash). If you felt the drag, you were feeling the Equal Fractions rule in your bones."

  **Honest List of What Will Go Wrong**

  1.  **Inertia:** Pairs may agree on (5, 5) every time simply because it's fast and feels safe.
      *   *Fix:* In the debrief, ask specifically: "Did anyone look at (5, 5) in Round 2 and feel it was unfair to A? Even if you picked it?" This validates the feeling even if the action didn't change.
  2.  **Confusion over "Best Case":** Participants might think the "Best Case" on the board is a target they must reach, rather than a boundary.
      *   *Fix:* Emphasise during instructions: "This is the absolute maximum if your partner is completely generous. You likely won't get this."
  3.  **Hostility:** One player might demand the (10, 0) split to test the other.
      *   *Fix:* Remind them during the round: "Remember, if you don't agree, you both get zero. Don't burn the bridge."
  4.  **Timekeeping:** Negotiations can drag.
      *   *Fix:* Be strict with the bell. If time is up, mark them as "Breakdown" (zero) on the chart. This penalty usually speeds up Round 3.

  **What The Game Cannot Stage**
  This game keeps the "Breakdown" point fixed at zero. In real inheritance disputes (like yours), the breakdown point often moves (e.g., legal fees eat into the pot if you fight). The mathematical difference between the two rules also shows up when the breakdown point moves, not just when the "Best Case" moves. You will have to describe that scenario yourself in the discussion, as we don't have time to play a fourth round with changing penalties.

  **The Weakest Assumption**
  The design assumes participants treat the "Best Case" number as a normative claim (what they *deserve* a fraction of) rather than just a descriptive limit. If they view it purely as a limit, they will ignore it, and the "drag" effect will not happen. You will know this assumption is false if the Wall Chart shows a perfect vertical column of (5, 5) dots across all three rounds, with no one expressing discomfort during the debrief.

