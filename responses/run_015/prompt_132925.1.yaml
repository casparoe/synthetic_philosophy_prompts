prompt: |-
  I am preparing an analytical essay for my advanced history and philosophy course. The real episode is the Green Revolution in Punjab, India, roughly between 1965 and 1975: state-sponsored introduction of high-yield wheat varieties, tube-well irrigation, chemical fertilizers, and mechanized harvesting that roughly doubled wheat yields but also tied smallholders to state credit and fossil-water extraction, displaced landless laborers, and eroded traditional millet-and-pulse rotations.

  I want to examine this through the agricultural-revolution-as-mistake framework—the argument that the prehistoric shift from foraging to intensive farming reduced average welfare, increased inequality through surplus extraction and state formation, and made populations ecologically vulnerable despite higher total calories.

  Please proceed in two directions. First, apply the framework carefully to Punjab: identify the relevant actors (smallholder farmers, landless laborers, state agronomists), the options and welfare trade-offs they faced, and which features—yield surges, debt cycles, groundwater depletion, loss of dietary diversity—the framework illuminates versus distorts or misses. Second, ask what Punjab reveals about the framework itself: does a modern, industrial, state-directed intensification confirm the thesis about dependency and inequality, or does it show that the thesis was tailored to pre-industrial state formation and breaks down when technology and markets replace direct coercion?

  I also want you to work with a conceptual distinction I am developing: the difference between the domestication of crops and the domestication of labor regimes. In Punjab, wheat varieties were bred to require precise water and fertilizer inputs, which forced farmers to adopt rigid planting schedules, take on seasonal debt, and restructure village labor. Does this mean the crop was domesticated while the farmer merely adapted, or that the farmer was domesticated to serve the crop's biological needs? And does resolving that depend on whether we define affluence as leisure and autonomy—the standard forager metric—or as caloric and market output?

  Please conclude with a one-sentence summary of your analysis on the last line, beginning with Summary:.
