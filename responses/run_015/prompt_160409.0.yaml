answer: |-
  Fund (a) Persistence Mechanisms and (e) Observable Indicators as your primary research vectors, use (c) Crowding for allocation decisions, and treat (b) and (d) as secondary governance constraints rather than truth-seeking research.

  ### Keep: (a) The Persistence Mechanism (Lock-in Half-life)
  This is the core architectural claim; if state isn't committed to durable storage, the rest of the system doesn't matter.

  *   **Why it's upstream:** Everything else depends on whether the current era's "state writes" are actually durable. If values or institutions have a short half-life (like data in RAM), then acting now has no special leverage compared to acting later. You need to know if we're writing to disk or just caching.
  *   **Tractability:** High for engineers, low for philosophers. Philosophers theorize about "value lock-in"; engineers can audit existing systems for drift. Look at codebases, legal contracts, or biological standards over 50-year windows. Measure decay rates of technical standards or institutional mandates. You can model "value drift" like technical debt accumulation.
  *   **Neglectedness:** High. Most longtermist work assumes lock-in happens without quantifying the friction required to overwrite it later.
  *   **Trade-off:** You risk optimizing for measurable proxies (like code stability) that don't correlate with moral or civilizational stability. However, without a mechanistic model of persistence, you're flying blind.

  ### Keep: (c) Crowding and Base Rates
  This is your concurrency check; even if the database is writable, you need to know if you're the only thread trying to write.

  *   **Why it's upstream:** This determines marginal impact. If the "hinge" is obvious, other actors (governments, corps) are already contending for the lock. If the resource is fully contested, your contribution drops to zero regardless of the stakes.
  *   **Tractability:** Medium for engineers. You can't know counterfactuals perfectly, but you can build forecasting infrastructure or scrape data on funding flows and talent allocation in AI safety vs. capability. Treat it like load testing: measure current throughput of safety research vs. estimated demand.
  *   **Neglectedness:** Medium. Lots of intuition, little data. Most groups assume they are neglected without verifying against global capital allocation.
  *   **Trade-off:** High noise. Data on "what others would have done" is inherently hidden. You'll be building models on incomplete datasets, but even a rough estimate is better than assuming zero competition.

  ### Keep: (e) What Would Change Our Mind (Observable Indicators)
  This is your observability layer; if you can't instrument the system, you can't know when the hinge is actually occurring.

  *   **Why it's upstream:** Defines the feedback loop for your three-year window. Without specific indicators, you can't update your priors or know when to pivot funding. It turns a metaphysical claim into a monitoring dashboard.
  *   **Tractability:** Very High for engineers. This is pure instrumentation. Build datasets, prediction markets, or tracking tools for specific variables (e.g., compute growth rates, regulatory capture metrics, alignment benchmark scores).
  *   **Neglectedness:** High. Most work is theoretical argumentation; very little is dedicated to building the sensors that would validate the theory.
  *   **Trade-off:** Goodhart's Law. Once you measure an indicator, it may cease to be a good proxy for the actual hinge status. You need to diversify your metrics to avoid optimizing for a dashboard alarm rather than the underlying reality.

  ### Drop/Reframe: (b) Compression vs. Displacement
  This question is partially confused and downstream of (a).

  *   **Verdict:** Don't fund this as a standalone research question.
  *   **Reasoning:** The idea that importance "collapses into every era is important" is a false dichotomy. In distributed systems, latency matters; doing work now might be cheaper than doing it later due to path dependence, even if later actors have more power. This is just a specific case of (a) Persistence. If lock-in is real, compression matters. If lock-in is fake, displacement is irrelevant. Solve (a) first.

  ### Drop/Reframe: (d) Belief Might Be Self-Undermining
  This is a safety interlock, not a research vector.

  *   **Verdict:** Handle this via governance, not research funding.
  *   **Reasoning:** Whether a belief is dangerous to hold is separate from whether it is true. You need a safety case for your giving group (e.g., "we don't fund reckless projects regardless of the thesis"), but spending research dollars to prove "caution is good" is redundant. You already know caution is good. Don't confuse risk management with truth-seeking.
