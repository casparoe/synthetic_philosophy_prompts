answer: |-
  This is a precise and formidable exegetical problem. You are correct that this passage from "How to Make Our Ideas Clear" (HMIC) serves as a pivot point between Peirce's critique of rationalism and his formulation of pragmatism, and it directly implicates the boundary between his communal epistemology and James's voluntarism.

  To resolve your dilemma without collapsing the distinction between Peirce and James, we must parse the "machinery" metaphor not as a claim about sensory empiricism, but as a claim about **ontological independence**. The line between Peirce and James is not drawn at the source of the input (sensory vs. volitional), but at the **relationship of constraint** between the mind and that input.

  Here is an unpacking of the logic of the passage and how it secures a boundary against the Jamesian "will to believe."

  ### 1. The Logic of the Machinery Metaphor
  Peirce's critique of Descartes and Leibniz in this passage targets the **generative capacity of reason**. Descartes and Leibniz operated under the assumption that the mind, through introspection and logical manipulation (clearness and distinctness), could *generate* fundamental truths.

  Peirce's counter-claim—"the machinery of the mind can only transform knowledge, but never originate it"—is a rejection of **epistemic spontaneity**.
  *   **Transformation:** The mind can deduce, induce, hypothesize, and combine concepts. This is the "machinery."
  *   **Origination:** The mind cannot create the *material* of truth out of its own substance.

  When Peirce says the machinery must be "fed with facts of observation," he is not merely advocating for sensory data over rational intuition. He is advocating for **resistance**. In Peirce's broader argument (connecting back to "The Fixation of Belief"), a "fact of observation" is defined by its capacity to surprise the inquirer. It is that which is *not* under the control of the thinker.

  If the mind could originate knowledge, inquiry would be solipsistic; truth would be a function of thinking correctly. By insisting on external "feeding," Peirce insists that truth is a function of **conformity to an independent reality**. The "fact of observation" is the point where the external world pushes back against the internal machinery.

  ### 2. The Scope of "Facts of Observation"
  Your difficulty lies in whether "facts of observation" can be broadened to include "internal commitments or institutional protocols." If they can, James wins: my volitional commitment is a "fact" about my psychological state, fed into the machinery.

  However, for Peirce, this reading fails because it conflates **Firstness/Secondness** (feeling/reaction) with **Thirdness** (law/mediation), and more importantly, it ignores the criterion of **independence**.

  For Peirce, a "fact of observation" in the context of belief-fixation must possess **compulsivity**.
  *   **Volition is not compulsory:** I can choose to believe $X$ or not believe $X$. The input is dependent on my will.
  *   **Observation is compulsory:** If I observe that fire burns, I cannot will the burn away. The input is independent of my will.

  If you allow "internal commitments" to count as the "facts of observation" that feed the machinery, you violate the core function of the metaphor. The machinery is supposed to *process* constraints, not *generate* them via the backdoor of volition. If the input is volitional, the output is merely a rationalization of a preference, not a fixation of belief anchored in reality.

  Therefore, Peirce's "facts of observation" cannot include volitional choices as *justificatory inputs*. They can only include the *experience of the consequences* of those choices. (i.e., I can observe that I *have* willed $X$, but that observation does not make $X$ true, only that I believe it).

  ### 3. Drawing the Line with James
  This allows you to maintain a coherent distinction between Peirce and James without reducing Peirce to a naive empiricist.

  **James's Position:** In "The Will to Believe," James argues that when evidence is insufficient (the option is undecidable intellectually), our "passional nature" *lawfully* decides. For James, the volition *completes* the epistemic situation. The belief becomes "true" in the sense that it becomes live and actionable, and potentially verifies itself later.

  **Peirce's Position (via this passage):** Peirce would argue that James is confusing the **psychological origin** of a hypothesis with the **logical fixation** of a belief.
  *   Peirce *does* allow volition in the generation of hypotheses (Abduction). We guess; we have hunches; we commit to testing a path. This is the "machinery" transforming potentiality.
  *   Peirce *forbids* volition in the settlement of belief (Induction/Deduction). The "facts of observation" must close the loop.

  The passage you cited is a critique of **infallibility**. Descartes thought clarity guaranteed truth. Peirce says only external observation can check truth. James says volition can license belief where observation is silent.

  **The Boundary:**
  The line is drawn at **deferment**.
  *   **James:** When observation runs out, volition takes the wheel *now*.
  *   **Peirce:** When observation runs out, inquiry must remain *suspended* (in a state of doubt) until further observation arrives.

  If you interpret Peirce's "facts of observation" to include Jamesian volition, you destroy Peirce's concept of **Reality**. For Peirce, Reality is "that whose characters are independent of what anybody may think them to be." If volition counts as an observational fact that fixes belief, then belief is fixed by what somebody *thinks* (or wills) it to be. This returns us to the "Method of Authority" or "Method of A Priority" that Peirce explicitly rejects in "The Fixation of Belief."

  ### 4. Implications for Institutional Architecture
  For your dissertation chapter on institutional architecture, this distinction is vital.

  *   **Peirce's Institution:** The community of inquirers is designed to **filter out** volition. Its protocols (replication, publicity, criticism) are mechanisms to ensure that the "facts of observation" remain independent of individual whims. The institution exists to prolong doubt until the external constraint is undeniable.
  *   **James's Individual:** The "will to believe" is inherently individualistic and situational. It bypasses institutional delay for the sake of moral or practical urgency.

  Peirce's critique of Descartes in this passage is that Descartes tried to make the *individual mind* the institution. Peirce replaces the individual mind with the *community*, but he keeps the constraint: the community, like the individual, cannot originate truth; it can only process the "facts of observation."

  ### Conclusion
  You can accommodate the passage without collapsing into James by insisting that for Peirce, **"facts of observation" are defined by their resistance to the will, not merely their presence to consciousness.**

  James's volitional choices are indeed "facts" in a psychological sense, but they are not "facts of observation" in the *epistemic* sense required for belief-fixation. They lack the requisite independence. Peirce's machinery requires fuel that it cannot control; James's will provides fuel that is controlled by the engine itself.

  Therefore, Peirce's account **cannot** accommodate the "will to believe" as a method of truth-fixation. It can only accommodate it as a method of *action* under uncertainty, which Peirce would classify as distinct from the settlement of scientific belief. Your framing should hold: Peirce's institutional architecture is built specifically to exclude the Jamesian move, treating it not as a valid input for truth, but as a source of bias that the communal method is designed to neutralize over the long run. The "facts" must come from outside the system of belief, whereas James's will comes from inside it.
