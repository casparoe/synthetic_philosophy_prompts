      *   **The Resolution:** Peirce's "facts of observation" refers to the *resistance* of reality (Secondness), not the *rules* of inquiry (Thirdness) or the *feelings* of the inquirer (Firstness). James's volition is a Firstness/Secondness mix (feeling + choice), but it lacks the *compulsion* of external reality that Peirce demands for *knowledge* (though James is talking about *faith* or *belief* in a broader sense).
      *   Crucially, Peirce distinguishes between *belief* (a state of mind) and *knowledge* (justified true belief anchored in reality). But in "Fixation," he is concerned with settling belief *successfully* (i.e., in a way that won't be disrupted by future experience).
      *   Peirce's critique of Descartes/Leibniz is about *epistemic justification*, not psychological genesis. The mind can *will* a belief (psychologically), but that doesn't make it *knowledge* or a stable fixation in the long run.

