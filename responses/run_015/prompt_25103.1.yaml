      *   Ensure the distinction between *forward-looking* (agreed upon) and *backward-looking* (the fight) is clear.

  8.  **Self-Correction/Nuance Check:**
      *   *Did I call Dennett a pure consequentialist?* He's more of a pragmatist. Need to be careful not to mislabel. He thinks the practice *constitutes* the responsibility.
      *   *Did I call Caruso a hard determinist?* He's a skeptic/incompatibilist. Focus on the "basic desert" notion.
