      *   *Key Insight:* The disagreement is about the *moral cost of error*. Dennett accepts the risk of punishing the "metaphysically innocent" to save the practice. Caruso says that risk is unacceptable.

  9.  **Final Polish:** Organize into clear sections: Diagnosis, The Normative Fault Line, The Bedrock Intuitions, and The Verdict on Resolution. (Proceed to generate output based on this structure.)

