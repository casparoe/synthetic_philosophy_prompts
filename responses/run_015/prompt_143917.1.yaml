          *   Skinnerian: Got honked at, now wait longer.
          *   Popperian: Look both ways, simulate car hitting you.
          *   Gregorian: Green man means go.
      *   *Actually, the prompt asks about a bird/rat box.* I should evaluate that. A Skinner Box is iconic. But it limits the Gregorian aspect.
      *   *Decision:* Use the **"Foraging Creature"** but describe it in CS terms (Reward Function, Model, Dataset). This bridges their knowledge.

  10. **Final Polish:**
      *   Ensure the "No Progress Story" constraint is met. Emphasize that Darwinian is *more reliable* in its domain than Skinnerian (you don't have to learn to breathe).
      *   Ensure the LLM section forces them to use the definitions, not vibes.

  11. **Self-Correction on LLMs:** The prompt says "LLM... looks Gregorian with the floors below it missing." I need to make sure the students realize *why* missing floors matters. (Hallucination? No grounding? No skin in the game?).

  12. **Timing Check:** 45 mins is very short. Need to be ruthless. No long intros.

