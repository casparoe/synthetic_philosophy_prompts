prompt: |-
  Hi. I work in the policy and democratic services team at a mid-sized unitary council (pop. around 280k — big enough to matter, small enough that everyone knows everyone). Over the last couple of years we keep getting asked to run things by sortition: citizens' assemblies, lottocracy-style standing panels, drawn scrutiny juries, whatever the requester happens to have read about. The asks come from campaign groups, from officers who think a drawn body would unblock something, and from a few councillors who I suspect mainly want to hand off a vote they don't fancy taking. At the moment we say yes or no on vibes, and I want something I can actually run and then defend.

  What I need from you is a decision procedure, in the order I'd run it, for a request landing on my desk:

  - The questions, in order.
  - What counts as a good enough answer to each one, so I can tell when someone has actually answered rather than just asserted.
  - Where the procedure just stops with a no.
  - Where it hands the decision over to a person or to full council because it's a values call rather than a factual one.
  - And be honest about which steps are judgement calls wearing a clipboard.

  Three things I think it has to get right, because that's where our vibes approach keeps breaking down:

  1. Sortition seems to be doing three quite different jobs in these requests, and I dont think one design does all three. Sometimes it's a mirror — the body should look like the city. Sometimes it's a filter — we want people who aren't already captured, who'll actually sit with evidence instead of a line. Sometimes it's a shield — we want the decision taken somewhere that re-election, party whips, local donors and the local paper can't reach. I want the procedure to start by making the requester say which job they want, and then let the design fall out of that: who's in the pool, how many, paid or not, who writes the question and the briefing material, binding or advisory, one-off or rotating.

  2. The pre-commitment problem. Half these requests reach us after officers have already got a preferred option, or with a remit that lets cabinet quietly ignore whatever comes out. I think the procedure should kill those — a consultation that can't bite is worse than no consultation — but I want a test for it that isn't just me disliking the requester.

  3. Who counts as the pool. Our instinct is a stratified sample of residents, but the hard cases nearly always dump the costs on people who aren't a tidy demographic category: one ward next to a proposed facility, commuters who don't live here, under-18s, people only in the city for two years, future residents. And then there's the repeat-draw thing: we've got maybe 40k households, and if we run one of these a year we might end up with a class of professional drawn citizens who come back knowing how the machinery works. I genuinely don't know if that's a bug or a feature, and I want the procedure to tell me rather than me guessing.

  Constraints: about a week per request, around £60k a year total, one analyst who can do a stratified draw if you tell them what to stratify on, and no in-house deliberative-polling expertise. Whatever I recommend has to fit on a page a councillor will actually read, and our monitoring officer has to be able to defend it. We can run at most one real one a year, so the procedure also needs to say which requests to turn down.

  Then please run it, out loud, on three:

  (a) A petition with roughly 8,000 signatures asking for a citizens' assembly to set the city's twenty-year transport plan — congestion charging, bus franchising, a workplace parking levy. My gut says yes: this is exactly the sort of thing assemblies are for.

  (b) A motion from a backbench councillor for a drawn panel to decide members' allowances, the rules on councillors' outside interests, and whether to introduce term limits. This smells like a conflict of interest to me, and also like the one case where the shield job is doing real work.

  (c) A request from a residents' group in the ward next to a proposed waste facility: they want the siting decision made by a drawn panel instead of the planning committee. I'd quite like to say yes to these people, they've been badly messed about for years — but I've got a feeling the honest procedure is going to hand me a no, and if it does I want to understand why before I have to go and say it to their faces.

  One more thing: if the procedure has a branch for "we're drawing from the same pool again next year / can we invite back the people who were good", spell it out, because we're about to hit exactly that.

  Please write it in British English (organisation, favour, recognise, and so on). Ta.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **User Role:** Policy and Democratic Services Team, mid-sized unitary council (pop. ~280k).
      *   **Problem:** Ad-hoc, "vibes-based" decision-making on sortition requests (citizens' assemblies, juries, etc.). Needs a defensible, structured decision procedure.
      *   **Key Requirements:**
          *   Step-by-step decision procedure (questions, pass/fail criteria, stop points, escalation points).
          *   Must distinguish between the *functions* of sortition (Mirror, Filter, Shield).
          *   Must address the *pre-commitment problem* (is the outcome actually binding/influential?).
          *   Must define the *pool* (who counts, repeat participants).
          *   **Constraints:** 1 week per request, £60k/year budget, 1 analyst, no in-house deliberative expertise, max 1 real assembly/year. Output must fit on a page for councillors/monitoring officer.
          *   **Tone:** British English, professional, honest about judgement calls.
          *   **Task:** Create the procedure *and* apply it to three specific scenarios (Transport Plan, Councillor Allowances, Waste Facility Siting).
          *   **Specific Instruction:** Address the "repeat draw" issue explicitly.

  2.  **Deconstruct the Core Issues:**

      *   *Function:* Mirror (representative), Filter (uncaptured/deliberative), Shield (political cover). The design depends on this.
      *   *Power:* Is it advisory or binding? If advisory, will it be ignored? (Pre-commitment).
      *   *Pool:* Residents only? Stakeholders? Future generations? Repeat participants (professional citizens).
      *   *Capacity:* Only one per year. Need a prioritization mechanism.
      *   *Legitimacy:* Monitoring Officer needs to defend it. Councillors need to understand it.

  3.  **Drafting the Decision Procedure (The "Sortition Gate"):**

      *   *Structure:* Needs to be linear, with clear exit points.
      *   *Step 1: Function Definition.* Force the requester to pick Mirror, Filter, or Shield. If they say "all three," that's a red flag.
      *   *Step 2: The Power Test (Pre-commitment).* Is there a commitment to implement or formally respond? If not, stop.
      *   *Step 3: The Pool Definition.* Who is in the lottery? Address the "repeat participant" issue here.
      *   *Step 4: Capacity & Prioritisation.* Since only one per year is feasible, how do we rank?
      *   *Step 5: Escalation.* Where does the final yes/no sit? (Officer vs. Committee vs. Full Council).

      *   *Refining the "Judgement Calls":* I need to be explicit where the procedure relies on human discretion despite looking objective.
      *   *Refining the "Repeat Draw":* This needs a specific rule. Generally, cooling-off periods are better for legitimacy, but institutional memory has value. I'll suggest a cooling-off period with an option for expert witness status.

  4.  **Developing the Three Scenarios:**

      *   *(a) Transport Plan (8k signatures):*
          *   Function: Likely Mirror/Filter (long-term strategy).
          *   Power: Needs Cabinet commitment.
          *   Pool: All residents.
          *   Capacity: High priority (strategic, broad impact).
          *   Verdict: Likely Yes, *if* Cabinet pre-commits.
      *   *(b) Councillor Allowances (Backbench Motion):*
          *   Function: Shield (taking heat off councillors).
          *   Power: Binding? Usually Full Council decision.
          *   Conflict: Councillors deciding their own pay via proxy.
          *   Verdict: Tricky. High risk of perceived abdication. Needs Full Council decision, not Officer. Likely No on Officer discretion, Yes only if Full Council votes to surrender power (rare).
      *   *(c) Waste Facility Siting (Residents' Group):*
          *   Function: Shield/Filter.
          *   Power: Planning law is strict. Can a citizens' assembly override statutory planning committees?
          *   Legal Constraint: Planning decisions must be based on material considerations. A random jury might not adhere to this.
          *   Verdict: Likely No (Legal/Statutory barrier), but offer alternative (consultation).

  5.  **Addressing Specific Constraints & Tone:**

      *   *British English:* Organisation, favour, programme, councillor, £60k.
      *   *One Page Limit:* The procedure itself needs to be concise enough to *be* the one-pager (or an annex to it). I will structure the response so the procedure is distinct and copy-pasteable.
      *   *Honesty:* Acknowledge where the "clipboard" is hiding a judgement call.
      *   *Budget/Time:* £60k/year means one proper assembly (typical cost £40k-£60k) or several smaller panels. The procedure must filter for cost.

  6.  **Iterative Refinement (Self-Correction during drafting):**

      *   *Critique:* Is the procedure too bureaucratic for a 1-week turnaround?
      *   *Fix:* Keep the questions sharp. The "1 week" is for the *assessment*, not the assembly itself.
      *   *Critique:* The "Repeat Draw" issue needs more nuance.
      *   *Fix:* Add a specific clause in Step 3 about "Recency & Recurrence."
      *   *Critique:* Scenario (b) is legally sensitive.
      *   *Fix:* Emphasise the Monitoring Officer's role in (b). It's a governance risk.
      *   *Critique:* Scenario (c) is a planning legal minefield.
      *   *Fix:* Be clear that sortition cannot override statutory planning duties.

  7.  **Final Polish:**

      *   Check against the "Three Things" in the prompt.
      *   1. Mirror/Filter/Shield distinction included? Yes.
      *   2. Pre-commitment test included? Yes.
      *   3. Pool definition included? Yes.
      *   Check constraints: £60k, 1 analyst, 1 assembly/year.
      *   Check tone: Professional, candid, British.

  8.  **Drafting the Content:** (Mental Outline)
      *   Intro: Acknowledge the pressure.
      *   The Procedure (The "Sortition Gate"): 5 Steps.
      *   The "Judgement Call" Transparency Note.
      *   The Repeat Participant Rule.
      *   Application to Scenarios (a, b, c).
      *   Closing advice.

      *(Self-Correction on Length)*: The prompt asks for the procedure *and* the application. I need to make sure the procedure looks like something that *could* fit on a page (concise), even if my explanation of it is longer. I will present the "One-Pager" version clearly.

      *(Refining the "Shield" concept)*: In scenario (b), the shield is protecting councillors from backlash. In (c), it's protecting officers/council from local anger. I need to make sure the procedure identifies when "Shield" is legitimate (taking heat for tough choices) vs illegitimate (abdication of statutory duty).

      *(Refining the Budget)*: £60k is tight for a full citizens' assembly with facilitation, venue, catering, payments, etc. I need to ensure the procedure flags cost early.

      *(Refining the "One Per Year" constraint)*: The procedure needs a "Prioritisation Matrix" if multiple requests pass the gate.

      *(Final check on British English)*: Ensure "s" not "z" in organisation/recognise, "councillor", "programme", "favour".

      *(Let's write it.)*
answer: |-
  Here is a decision procedure designed for your constraints, followed by the application to your three scenarios.

  ### Part 1: The Sortition Gate (Decision Procedure)

  **Purpose:** To determine whether a request for a sortition-based body (assembly, panel, jury) is viable, legitimate, and fundable.
  **Owner:** Democratic Services Officer (with Monitoring Officer sign-off on Step 2 & 5).
  **Timeframe:** 5 working days from receipt of request.

  | Step | Question | Pass Criteria (Green) | Fail Criteria (Red) | Action |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Function** | **What specific work is sortition doing here?** (Select one primary function). | **Mirror:** Need demographic representativeness.<br>**Filter:** Need deliberation free from lobbying.<br>**Shield:** Need political cover for a high-cost decision. | Requester claims "all three" or cannot articulate why elected members cannot do this. | If Red: **Stop.** Advise on alternative engagement. |
  | **2. Power** | **What is the pre-commitment?** (Who binds the council to the outcome?) | A named Decision-Taker (Cabinet/Committee) signs a Terms of Reference committing to: implement, or formally justify deviation within 3 months. | Vague promise to "consider" or "report back". Officer-led without Member buy-in. | If Red: **Stop.** Do not proceed without a Decision-Taker. |
  | **3. Pool** | **Who is in the lottery?** | Defined by statute or clear policy logic (e.g., "All residents", "Service users"). Clear rule on repeat participants (see *Recency Rule* below). | Pool defined by convenience, excludes affected groups without reason, or creates a "professional citizen" class. | If Red: **Stop.** Redefine pool or Stop. |
  | **4. Cost & Capacity** | **Can we deliver this within constraints?** | Cost < £60k (or within remaining budget). Fits within 1 assembly/year cap. Analyst capacity available. | Cost exceeds budget. Second request in same financial year without exceptional justification. | If Red: **Queue** for next FY or **Stop**. |
  | **5. Legitimacy** | **Is this a values call or a factual one?** | Factual/Trade-off heavy (e.g., budget allocation, infrastructure). | Purely political ideology or statutory duty that cannot be delegated (e.g., planning law, setting council tax). | If Values/Statutory: **Escalate** to Full Council for permission to proceed. |

  #### The Recency & Recurrence Rule (For Step 3)
  *   **Cooling-off Period:** Any individual drawn for a sortition body is ineligible for re-selection for **3 years**. This prevents a "professional citizen" class and preserves the "Mirror" function.
  *   **Institutional Memory:** If specific expertise is needed from a past panel, invite former members as **Expert Witnesses**, not voting members. They are paid a fee but do not count towards the quorum or demographic quota.
  *   **Frequency:** Maximum of one major sortition exercise per municipal year. If multiple requests pass Step 4, priority goes to: 1. Statutory requirement, 2. Strategic Plan alignment, 3. Date of request.

  #### Transparency Note: Where the Clipboard Hides Judgement
  *   **Step 1 (Function):** I am judging whether their stated function matches the design. If they say "Shield" but design a "Mirror", I will challenge it.
  *   **Step 4 (Capacity):** I am judging whether a request is "exceptional" enough to breach the one-per-year cap. This is a resource judgement, not a democratic one.
  *   **Step 5 (Legitimacy):** I am judging whether a matter is "statutory". The Monitoring Officer has final veto here.

  ***

  ### Part 2: Application to Scenarios

  Here is the procedure run "out loud" on your three cases.

  #### (a) The Transport Plan (Petition, 8k signatures)
  *   **Step 1 (Function):** **Filter/Mirror.** Long-term strategy requires looking beyond election cycles (Filter) and representing the whole city (Mirror). *Verdict: Pass.*
  *   **Step 2 (Power):** **Critical.** A petition is not a pre-commitment. We need Cabinet to sign the Terms of Reference *before* we recruit. If Cabinet says "we'll look at it", this fails. If Cabinet says "we will adopt the plan unless it breaches legal/fiscal limits", this passes. *Verdict: Conditional Pass.*
  *   **Step 3 (Pool):** **All Residents.** Stratified by ward, age, ethnicity, and current transport mode. *Recency Rule:* Check analyst database. If we ran a climate assembly last year, exclude those participants. *Verdict: Pass.*
  *   **Step 4 (Cost):** **£60k.** A 20-year plan needs multiple weekends. This will consume the entire annual budget. *Verdict: Pass (but uses full capacity).*
  *   **Step 5 (Legitimacy):** **Factual/Trade-off.** Transport planning is technical and values-based but within Council competence. *Verdict: Pass.*
  *   **Outcome:** **Proceed, subject to Cabinet Pre-commitment.** This is the strongest candidate. It fits the "Filter" function perfectly (taking heat off long-term decisions) and utilises the full budget for high impact.

  #### (b) Councillor Allowances & Term Limits (Backbench Motion)
  *   **Step 1 (Function):** **Shield.** The explicit aim is to remove the decision from elected members to avoid electoral backlash. *Verdict: Pass (Functionally honest).*
  *   **Step 2 (Power):** **Binding?** If the panel decides, do Members lose their vote? If the panel is advisory, the "Shield" fails (Members still have to vote to implement). If binding, does Full Council have the right to surrender this power? *Verdict: High Risk.*
  *   **Step 3 (Pool):** **Residents?** Or Councillors? If residents decide councillor pay, is that democratic? *Verdict: Ambiguous.*
  *   **Step 4 (Cost):** **Low.** Panel size could be small. *Verdict: Pass.*
  *   **Step 5 (Legitimacy):** **Values/Statutory.** This is a governance conflict. The Monitoring Officer must advise whether Full Council can delegate its own remuneration to a random body. In many constitutions, Members' allowances must be set by an Independent Remuneration Panel (statutory), not a citizens' jury. Term limits are a political decision for Full Council. *Verdict: Fail/Escalate.*
  *   **Outcome:** **Escalate to Monitoring Officer/Full Council.** This is not an Officer decision. The "Shield" function is legitimate, but you cannot use sortition to bypass statutory remuneration rules. If Full Council wishes to abdicate this vote, they must vote to do so explicitly. **Recommendation:** Do not run this as a standard assembly. Use the statutory Independent Remuneration Panel process instead.

  #### (c) Waste Facility Siting (Residents' Group)
  *   **Step 1 (Function):** **Shield.** The group wants the Council to take the blame for a decision they know is unpopular. *Verdict: Pass.*
  *   **Step 2 (Power):** **Binding?** Planning decisions are quasi-judicial. They must be made in accordance with the Development Plan and material considerations. A citizens' panel cannot be bound by planning law in the same way a Planning Committee is. *Verdict: Fail.*
  *   **Step 3 (Pool):** **The Hard Case.** The request implies a local panel (the ward next door). But the waste serves the whole city. If you draw from the whole city, the local ward feels ignored. If you draw locally, it's NIMBYism. *Verdict: Fail.*
  *   **Step 4 (Cost):** **Pass.**
  *   **Step 5 (Legitimacy):** **Statutory Barrier.** You cannot delegate a statutory Planning Committee decision to a non-statutory body. If the panel recommends Site A, but Planning Law says Site B, you create a legal liability. *Verdict: Hard Stop.*
  *   **Outcome:** **No.** This is the "honest no" you suspected. Sortition cannot override planning law.
      *   *Alternative:* Offer a **Consultative Panel**. They do not decide the site. They advise on *mitigation* (traffic, noise, community benefits) for the site that officers have already identified as technically viable. This gives them agency without breaking the law.

  ***

  ### Part 3: Implementation Notes for Your Team

  **1. The "One-Pager" for Councillors**
  When you present this to the Policy Committee, do not show them the table above. Show them a flowchart with three boxes:
  1.  **Is there a Decision-Taker?** (If no, stop).
  2.  **Is it Legal?** (If no, stop).
  3.  **Is it in the Budget?** (If no, queue).
  *Attach the "Recency Rule" as a footnote.* Councillors care about liability (Step 2 & 5) and cost (Step 4).

  **2. Managing the "Professional Citizen" Risk**
  You mentioned the 40k household limit. If you run one assembly a year (say, 100 people), you exhaust 0.25% of households annually. Over 10 years, that's 2.5%.
  *   **The Rule:** Enforce the 3-year cooling-off period strictly in your recruitment vendor contract.
  *   **The Exception:** If you need a "standing panel" (lottocracy style), you must rotate 33% of the members every year. Do not keep the same 50 people for 5 years.

  **3. The "Shield" Trap**
  Be careful with Scenario (b). Councillors often want sortition to "take the heat".
  *   **Your Defence:** "Sortition is for *advice* on complex trade-offs, not for *abdicating* statutory votes."
  *   If they want a shield, they must still vote to accept the shield. The procedure forces them to own the decision to use the panel.

  **4. Budget Reality**
  £60k is tight for a high-quality assembly (facilitation, venue, childcare, payments, analysis).
  *   **Recommendation:** Reserve £45k for the one major assembly. Keep £15k for smaller "scrutiny juries" (10 people, 1 day) that can answer specific officer questions without the full assembly overhead. This lets you say "yes" to smaller requests without blowing the cap.

  **5. The Analyst's Burden**
  Your one analyst cannot manage recruitment *and* policy analysis.
  *   **Procedure Fix:** In Step 4, if the request passes, the budget *must* include external facilitation and recruitment support. Do not let the analyst run the lottery manually; use a vendor for the draw to ensure defensibility. The analyst manages the vendor, not the spreadsheet.

  This procedure gives you a "No" that is based on process, not personality. In Scenario (c), you aren't saying "your issue doesn't matter"; you are saying "the tool requested cannot legally do the job you need." That is a defensible position for a Monitoring Officer.
