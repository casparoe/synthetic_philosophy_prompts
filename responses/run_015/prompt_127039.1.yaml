      Your systems analogy tempts us to treat boundaries as administrative conveniences, but moral claims are not logs to be rolled up. In your single-person migraine case, the sufferer on Monday is compensated by the reliever on Tuesday; it is one ledger where debits and credits balance for the owner. In the split-stream case, even if the physics is identical, we now have two ledgers. To transfer a burden from Ledger A to benefit Ledger B without A's consent is not prudence; it is expropriation. I concede I lack a precise dial for partial fusion—moral philosophy often struggles at the margins—but vagueness does not dissolve the distinction. The work is done by the fact that each life is a distinct locus of claim-making, not by the continuity of memory or flesh. If you sacrifice one to save two, the one loses everything and gains nothing from the survivors' joy. Does your systems design ever permit deleting one user's data to optimise another's experience, simply because the total storage saved is positive?

