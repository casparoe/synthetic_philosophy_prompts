answer: |-
  *The conference room is quiet except for the hum of the HVAC. Dr. Aris stacks papers while Dr. Bell stares at a blank document on the laptop. A clock on the wall ticks toward the hour.*

  **Aris:** We have twelve minutes to submit the recommendation. If we don't sign off on the Dual Consent Protocol, the board defaults to standard single-signature consent. For patient 402, that means the left hand doesn't count.

  **Bell:** And if we sign off, we treat the left hand as a separate voter. That implies there are two people in the room. I can't authorize that based on the email case alone.

  **Aris:** The email case is definitive. Right hand drafts a reconciliation letter to an estranged father. Left hand moves the mouse and deletes it. When asked why, the patient's mouth says, "I decided it was too emotional." That's a lie. The mouth didn't decide that. The left hand did.

  **Bell:** It's a confabulation, yes. The verbal center, usually left-hemisphere dominant, is constructing a narrative to explain behavior it didn't initiate. But that proves unity of report, not duality of persons. It's one person whose internal wiring is lagging. The system is trying to maintain a single story despite a mechanical failure.

  **Aris:** A mechanical failure doesn't usually vote against itself. If I throttle the connection between the hemispheres—using that hypothetical graded callosotomy we reviewed—we can dial the bandwidth down. At forty percent transmission, the hands start competing. At ten percent, they draw different things simultaneously. Where is the line where one subject becomes two?

  **Bell:** That's the trap. You're assuming personhood is a function of bandwidth. If I dim the lights in here, you don't become half a person. If there's a threshold, it's not about data transfer rates. It's about the unity of consciousness.

  **Aris:** But consciousness isn't monolithic. We need to separate the concepts. There's unity of consciousness—what it feels like from the inside. There's unity of agency—who is actually driving the action. And there's access to report—what can be spoken aloud. In the email case, you have unity of report—the mouth speaks one story. But you have a fracture in agency. Two wills are fighting for the mouse.

  **Bell:** [*Leans forward*] I'll concede the fracture in agency. If two distinct volitions are competing for the same motor output, calling it "one agent" is misleading. But that doesn't necessitate two subjects of experience. The patient reports feeling confused, not doubled. They don't say, "Part of me wanted to send it, and another part wanted to delete it." They say, "I changed my mind."

  **Aris:** Because the verbal center is hijacking the narrative. But consider the graded callosotomy again. If we restore the connection to one hundred percent, the conflict vanishes. If we drop it to zero, the conflict maximizes. If agency splits along that continuum, why shouldn't subjecthood follow? You're protecting the "subject" as a metaphysical soul that can't be sliced. I'm looking at a system where information integration defines the self.

  **Bell:** And I'm worried about what happens when you treat information integration as the sole criterion. Consider patients born without a corpus callosum. Agenesis. They lack the bridge entirely from conception. Yet, they report ordinary, single streams of experience. They don't feel split.

  **Aris:** [*Pauses, tapping a pen*] That's the strongest counter-example I have. But their brains develop alternative pathways. Subcortical connections compensate. It's not the same as severing an established network in an adult. Cutting the cable is different than never laying it.

  **Bell:** I'll concede that distinction matters. Developmental plasticity changes the landscape. If you cut an adult brain, you are disrupting an established unity. But does disrupting unity create a new subject, or just damage the existing one? If I damage your memory, you're still you. If I damage your connectivity, why are you suddenly two?

  **Aris:** Because the output suggests independent rationalities. In the zero-percent callosotomy, the left hand can solve a puzzle the right hand doesn't know exists. They can hold different beliefs about the world simultaneously. That isn't just damage; that's independence.

  **Bell:** Independence of information processing, yes. But do they have independent pains? Independent joys? We don't know. We only know they have independent access to report and motor control. You're conflating agency with subjecthood. I'm willing to grant you the Dual Consent Protocol for agency—to protect the left hand's veto power—without conceding that there are two souls in the chair.

  **Aris:** That's a practical compromise, but the policy requires ontological clarity. If I treat them as one, and they are two, I violate the rights of the silent half. If I treat them as two, and they are one, I'm bureaucratizing a single person's internal conflict.

  **Bell:** Then we define the protocol procedurally. We require dual consent not because there are two people, but because there is one person with fractured agency. We owe it to the whole person to ensure no part of them is overridden.

  **Aris:** [*Sighs*] That works for the form. But I need to know if I'm talking to a committee or a crowd. Here's what would change my mind: If we run the graded callosotomy on a volunteer and drop transmission to five percent, and they still report a single, unified field of consciousness without any sense of internal alienation, I will withdraw the claim that there are two subjects. If the experience remains singular despite total informational isolation, then bandwidth isn't the metric.

  **Bell:** And here's what would change mine. If a patient five years post-op begins to exhibit divergent long-term goals that cannot be reconciled—not just deleting an email, but one hand pursuing a career the other hand actively sabotages over months—and maintains separate emotional relationships with different people independently, I will concede there are two subjects. If the divergence persists without re-integration, then the fracture is permanent.

  **Aris:** [*Checks the clock*] Eight minutes. Can we agree on the wording? "Fractured agency requiring multi-modal consent"?

  **Bell:** "Fractured agency requiring multi-modal consent." But add a footnote. We review the policy annually pending further data on subjective reporting.

  **Aris:** Done. Type it up.

  **Bell:** [*Starts typing*] I still think you're looking for a number where there isn't one.

  **Aris:** And I think you're protecting a unity that isn't there. But the patient gets the protection either way.

  **Bell:** That's the only metric that matters for now.

  *The cursor blinks on the screen. Aris leans back, watching the clock. Bell finishes the sentence and hits save.*
