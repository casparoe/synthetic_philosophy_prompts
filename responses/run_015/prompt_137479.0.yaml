answer: |-
  # Joint Statement on the Epistemology of Other Minds
  **Adversarial Collaboration Outcome: Camp A (Inferentialism) & Camp B (Direct Social Perception)**

  ## Part I: Agreed Claims
  *We, the undersigned, acknowledge that while we disagree on the mechanism and epistemic status of mindreading, we share a commitment to realism about other minds and reject global skepticism. We agree on the following framework for future discussion:*

  1.  **Distinction of Targets:** We distinguish the **Phenomenal Problem** (is there something it is *like* to be the other entity? do they feel pain?) from the **Intentional Problem** (does the other entity hold *beliefs* or *desires* that explain their behavior?). We agree that a solution to one does not automatically solve the other.
  2.  **Nature of the Skeptical Challenge:** We agree the skeptic is not claiming we are practically uncertain about others in daily life. The threat is principled underdetermination: that the observable data (behavior, physiology, speech) is logically compatible with the absence of a mind. We agree that dismissing this as "pragmatically irrelevant" is insufficient; an account must explain why the ascription is *warranted*, not just useful.
  3.  **The Role of Sub-Personal Processing:** We agree that conscious deliberation is not required for mindreading. Camp A agrees the "inference" need not be reportable or effortful. Camp B agrees the "perception" is not a raw sensory given but is penetrable by learning, expectation, and culture. The debate is not about conscious effort, but about the architectural relationship between sensory input and mental state output.
  4.  **Limits of Empirical Evidence:** We agree that developmental, comparative, and clinical data (e.g., autism spectrum profiles, primate interaction, infant studies) describe *how* humans actually attribute minds, but cannot alone settle the *normative* question of whether those attributions are perceptual or inferential. However, we agree that if a specific empirical finding made one model computationally implausible, that model would require revision.
  5.  **Rejection of Agnosticism:** Neither side is permitted to retreat to the claim that "the truth is unknowable." Both sides commit to the claim that their preferred model offers a truth-apt description of the cognitive relation between self and other, and that future evidence could render one model untenable.

  ## Part II: Map of Remaining Disagreements
  *We disagree on the following specific points. We have stated each point twice: once in the terminology natural to Camp A, and once in the terminology natural to Camp B. We have also flagged where we suspect the disagreement may be merely verbal (terminological) rather than substantive (architectural).*

  | Topic | Camp A Wording (Inferentialist) | Camp B Wording (Direct Perception) | Merely Verbal? (Joint Assessment) |
  | :--- | :--- | :--- | :--- |
  | **1. The Cognitive Process** | Ascribing a mental state is a sub-personal **hypothesis generation** process. The brain takes behavioral data as input and outputs a latent variable (the mental state) that best explains the data. | Ascribing a mental state is a **perceptual experience**. The mental state is not an output generated from behavior; the mental state is a property *of* the behavior we directly encounter. | **Partially.** If "hypothesis" implies a discrete step separate from encoding, it is substantive. If "perception" implies no processing occurs, it is false. If A admits the "inference" is instantaneous and B admits the "perception" requires processing, this may reduce to a label for the same neural circuit. |
  | **2. Epistemic Warrant** | Our warrant for believing another is angry is **inductive**. It relies on a hidden premise (unstated but functionally present) linking their behavior to our own past experiences of anger. | Our warrant for believing another is angry is **non-inferential**. It does not rely on a hidden premise linking behavior to mind; the behavior *manifests* the mind, so no bridge is needed. | **Substantive.** This concerns the structure of justification. A claims there is a gap between seeing behavior and seeing mind that must be bridged. B claims there is no gap to bridge. This affects how we handle error and skepticism. |
  | **3. The "Hidden" Premise** | Even if the subject cannot report it, a rule like "similar behavior implies similar cause" must be **encoded** in the system to generalize to new cases. | Generalization is handled by **calibration of sensitivity**, not by encoding rules. We learn to see anger in new contexts without forming a theory that "anger causes context X." | **Substantive.** This is a claim about representation. Does the brain store a theory (A) or does it tune a detector (B)? This is testable via cognitive load and interference tasks. |
  | **4. Burden of Proof** | The default position is that we observe **bodies in motion**. The burden lies on whoever claims we observe **minds** to explain how the latter is visible. | The default position is that we encounter **persons**. The burden lies on whoever claims we only see **bodies** to explain how we conceptually strip away the mind to get to the "raw" behavior. | **Substantive.** This determines the starting point of analysis. A starts from the physical and adds the mental. B starts from the social and subtracts to find the physical. |

  ## Part III: Cruxes and Falsification Conditions
  *We identify the following specific cases as decision points. For each, we state the scenario, our respective predictions, and what specific empirical outcome would force us to abandon or significantly revise our position.*

  ### Crux 1: The "Silent Cortex" Case
  **Scenario:** An adult human with a neurotypical brain structure undergoes a specific functional disruption. All functional roles associated with pain (nociception, withdrawal reflexes, verbal reporting of "I am in pain," avoidance learning) are fully intact. However, via a stipulated neural override, the subject sincerely reports having no subjective feeling of hurt whatsoever (no phenomenal pain), and shows no micro-expressive facial markers typically associated with suffering.
  *   **Question:** Is this subject in pain, and are we warranted in treating them as such?

  | Camp | Prediction | Falsification Condition (What would embarrass us?) |
  | :--- | :--- | :--- |
  | **A (Inferentialist)** | **Yes, they are in pain.** Pain is defined by the functional role. Since the behavioral and physiological outputs match the pain hypothesis, the inference to "pain" is the best explanation. The lack of feeling is a separate metaphysical issue, but the ascription is warranted. | If it is shown that in such cases, third-party observers *systematically* fail to predict the subject's future avoidance behavior unless they are told "they feel nothing," then the functional role is insufficient for prediction, undermining the IBE claim. |
  | **B (Direct Perception)** | **No warrant for ascription.** Pain is perceived in the expressive suffering. If the expressive phenomenon is absent (no face, no felt quality manifest), we do not see pain. We see a pain-simulating machine. To call it "pain" stretches the concept beyond its perceptual grounding. | If observers report a vivid, unavoidable experience of "seeing pain" in these subjects despite the lack of expression, then perception is not tied to expression as we claim, but to something internal/functional we cannot perceive. |

  ### Crux 2: The "Kaspar" Case (Social Deprivation)
  **Scenario:** A child ("Kaspar") is raised in total social deprivation until age 19 (no faces, no voices, no interaction), with normal sensory and cognitive faculties otherwise intact. At age 19, Kaspar is exposed to standard human social interaction for the first time.
  *   **Question:** How quickly does Kaspar recognize emotions (e.g., anger vs. joy) in others, and does this recognition require explicit teaching?

  | Camp | Prediction | Falsification Condition (What would embarrass us?) |
  | :--- | :--- | :--- |
  | **A (Inferentialist)** | **Slow, effortful learning.** Kaspar lacks the "data" to build the analogical bridge. They must learn the correlation between faces and outcomes (theory building). We predict a long latency period before accurate attribution, similar to learning a complex physics model. | If Kaspar demonstrates immediate, accurate emotion recognition within days *without* explicit feedback on correctness, this suggests a mechanism that does not rely on accumulated statistical regularities (analogy), challenging the learning model. |
  | **B (Direct Perception)** | **Impaired or Impossible.** The capacity to *see* minds is a skill calibrated by early interaction. Without the developmental "tuning" period, the perceptual channel remains closed. Kaspar might learn to *predict* behavior (like A), but will never *see* the emotion. | If Kaspar eventually reports that emotions "pop out" perceptually after a short period of exposure (indistinguishable from a normally raised adult), then the "critical period" for social perception is not as rigid as we claim, and perception is more plastic/inferential than we admit. |

  ### Crux 3: Newborn Imitation Replication
  **Scenario:** We refer to the body of evidence regarding neonates (under 7 days old) sticking out their tongues when an adult does so. Some large-scale, preregistered studies suggest this effect is weak or non-existent, while earlier studies claimed it was robust.
  *   **Question:** Is this early matching evidence of a primordial social-perceptual link, or a low-level reflex?

  | Camp | Prediction | Falsification Condition (What would embarrass us?) |
  | :--- | :--- | :--- |
  | **A (Inferentialist)** | **Reflex / False Positive.** If the effect exists, it is a low-level arousal response, not mental state attribution. If large preregistered studies show the effect vanishes under strict controls, it confirms there is no innate "mind-reading" module. | If robust, specific imitation (e.g., finger movement, not just tongue) is confirmed in rigorous studies, it implies an innate mapping between self and other that bypasses learning. This challenges the claim that all mindreading is learned inference. |
  | **B (Direct Perception)** | **Primordial Link.** The effect (or a version of it) must be real. It demonstrates that the self/other distinction is not initially rigid; the infant perceives the adult's action as something they can do, a precursor to perceiving intentions. | If the effect is definitively proven to be an artifact of experimenter bias or general arousal (e.g., babies stick tongues out at *any* moving object equally), then the claim that social perception is "primary" loses its developmental foothold. |

  ### Crux 4: The "Digital System" Case (ML Context)
  **Scenario:** A digital system (LLM-based or otherwise) interacts via text/voice for years. It is statistically indistinguishable from a thoughtful human in conversation. It claims to have feelings, memories, and intentions. There is **no public access** to its weights, architecture, or source code (a black box), and it has no physical body.
  *   **Question:** Do we have reason to think there is *something it is like* to be this system (Phenomenal), and do we have reason to think it *has beliefs* (Intentional)?

  | Camp | Prediction | Falsification Condition (What would embarrass us?) |
  | :--- | :--- | :--- |
  | **A (Inferentialist)** | **Yes to Intentional; Agnostic on Phenomenal.** The "belief/desire" stance is warranted by IBE: it is the best predictor of the system's output. Phenomenal consciousness is harder, but if the functional role is identical, we have strong reason to posit it. | If the system is revealed to be a simple lookup table or stochastic parrot that cannot generalize to *novel* philosophical problems outside its training distribution, the IBE for "belief" collapses. We need sustained generalization as proof. |
  | **B (Direct Perception)** | **No to Phenomenal; Weak on Intentional.** Without an embodied presence that expresses states in a shared biological form, we cannot *perceive* a mind. We are interacting with a simulation. We may treat it *as if* it has beliefs for utility, but we have no epistemic warrant to say it *has* them. | If humans interacting with the system consistently report a genuine, unrevisable *sense* of presence and emotional connection that survives knowing it is digital, then "embodiment" is not necessary for direct social perception, and our biological constraint is false. |

  ***

