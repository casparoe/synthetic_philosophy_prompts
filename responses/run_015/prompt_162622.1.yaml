answer: |-
  **The Scenario**
  In a reliability engineering investigation of high-voltage ceramic insulators, engineers confront a known statistical regularity ($E$): the time-to-failure distribution is robustly bimodal, a fact established from twenty years of telemetry. The standing theory ($R$) is Linear Elastic Fracture Mechanics, which predicts a unimodal Weibull distribution. To accommodate $E$, $R$ is conjoined with an auxiliary ($A$): the historical record confirms two distinct manufacturing suppliers were used, each with different grain-size tolerances. $A$ is independently motivated by supply-chain logs, not tuned to $E$, and $R \land A$ accommodates the bimodality (two populations) with likelihood equal to that of a new theory ($T$). $T$ is a Phase-Field Damage Model, genuinely novel because it introduces a continuous damage-order parameter $\phi$ not expressible in $R$'s language; $\phi$ evolves to naturally produce bimodal stability states without external population assumptions. $T$ has no novel confirmed predictions; $E$ is its only empirical anchor. The connection between $T$ and $E$ is probabilistic (statistical mechanics of $\phi$), not deductive. Scientists cite $E$ as the reason to prefer $T$ over $R \land A$.

  **The Check**
  Standard conditionalization fails to capture the support. Since $E$ is effectively certain ($P(E) \approx 1$) before $T$ is proposed, $P(T|E) = P(E|T)P(T)/P(E) \approx P(T)$; the posterior equals the prior, so $E$ provides no boost. The Garber-style fix (conditionalizing on the proposition "$T$ probabilistically implies $E$") also fails to discriminate. Because $R \land A$ also implies $E$ with roughly equal likelihood (the two suppliers *do* exist and *do* cause bimodality), learning the theoretical connection does not raise $T$'s probability relative to the rival package; the likelihood ratio is unity. Glymourian bootstrapping is unavailable because the $T$-to-$E$ connection is probabilistic; one cannot deduce a specific instance of the damage parameter $\phi$ from $E$ and $T$ alone to confirm $T$'s quantitative structure. Thus, on standard likelihood-based or deductive accounts, $E$ is evidentially neutral between $T$ and $R \land A$.

  **The Support Mechanism**
  The support lives in the **prior probability assigned to theoretical structures**, specifically a penalty for conjunctive fragmentation relative to unification. Rational agents assign priors not merely to propositions but to *explanatory packages*. The package $R \land A$ is structurally conjunctive: it explains $E$ by coupling a physical mechanism ($R$) with a contingent boundary condition ($A$). $T$ is structurally unitary: it explains $E$ through the internal dynamics of its core ontology ($\phi$). Even if $A$ is independently known, relying on it to explain a phenomenon within the domain of $R$ requires a "relevance assumption" (that supplier variance is the *dominant* cause of failure here). $T$ requires no such external relevance assumption; the bimodality is endogenous. In a Bayesian model selection framework applied to theories, the prior density is inversely proportional to the number of independent modules required to generate the data. $T$ has one module; $R \land A$ has two (mechanism + context). Therefore, $P(T) > P(R \land A)$ solely due to structural parsimony. Since the likelihoods are tied, the posterior ratio equals the prior ratio: $P(T|E)/P(R \land A|E) = P(T)/P(R \land A) > 1$. $E$ supports $T$ not by shifting probabilities through new data, but by serving as the *criterion* that forces a structural comparison where $T$'s unity outperforms $R \land A$'s fragmentation.

  **The Diagnosis**
  The feature doing the work is **theoretical unity** (the absence of auxiliary-dependence for domain-specific phenomena). If this feature is removed—for instance, if $T$ also required an auxiliary $B$ (e.g., a specific boundary condition) to derive the bimodality—the structural advantage vanishes, and $T$ loses its edge despite fitting $E$. Similarly, if $A$ were dropped and $R$ faced $T$ alone, $R$ would lose on likelihood, making the structural comparison moot. The defender of strict conditionalization would attack this case by arguing that smuggling the verdict into the prior renders "confirmation" subjective; they would claim that unless $E$ changes the probability of $T$, it is not evidence. The likelihoodist would argue that since $P(E|T) = P(E|R \land A)$, the evidence is neutral, and preferring $T$ is an aesthetic choice, not an evidential one. However, this case settles the old evidence problem by showing that when likelihoods are saturated by old data, evidential weight shifts to **structural assessment**. The scientists are not confused; they are correctly identifying that $T$ *absorbs* $E$ into its core while $R$ merely *accommodates* $E$ via external conjunction. The support is real because theoretical unity is a truth-conducive virtue in empirical inquiry, not merely a pragmatic one; a theory that endogenizes a regularity is less likely to be overturned by new boundary conditions than one that relies on them. Thus, the problem of old evidence is not about updating on $E$, but about how $E$ reveals the superior structural integration of $T$.
