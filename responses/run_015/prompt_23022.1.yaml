prompt: |-
  Okay so I just got into a like two hour argument with my friend Marco about Dutch book arguments and I'm still a little confused about what they actually show. He keeps insisting that the Dutch book argument for conditionalization (you know, the one where if you don't update your credences when you get new evidence, then there's some set of bets that will definitely make you lose money no matter what) is basically trivial, because you can just refuse to take the bets, and that it doesn't really show that failing to condition is epistemicaly irrational, just that it's pragmaticly risky if you happen to be a bettor. I sort of get his point, but I also feel like he's missing something, because I vaguely remember reading that the argument has a hidden assumption that your prior credence in the new evidence is non-zero (some people call this "regularity" I think), and that when that assumption fails the whole argument just breaks down.

  Can you walk me through the most important implications of this? Like, what exactly does the Dutch book argument for conditionalization show and what does it not show, why does the regularity assumption matter and what happens when your prior assigns probability zero to the evidence you're supposed to condition on, and does this limitation actually undermine the argument or is there a way to patch it up. I'm trying to figure out whether Marco is right that it's just a pragmatic argument or whether there's a deeper epistemic point he's missing, and I'd really like to have a better answer for next time we argue about this at dinner.
