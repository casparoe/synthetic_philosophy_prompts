          *   Requirement: The theory must resolve symmetry without arbitrary tie-breaking *or* explicitly deny a fact of the matter.
          *   Label: Genuinely Required (for a decision-making body, "we don't know" is hard, but "magic" is worse). Let's call it *Symmetry Resolution*.

      *   *Retroactivity (Future Dependence):*
