answer: |-
  Here is a specification sheet for a theory of artifact identity. It is drafted for a heritage committee that needs to sign off on certificates of authenticity, not for a seminar room where "it depends" is a passing grade.

  ### The Desiderata

  **1. The Symmetry Resolution Requirement**
  *   **The Case:** *The Twin Locomotives.* A steam engine is dismantled. Team Alpha rebuilds it in its original berth using the cleaned original parts. Team Beta takes the original parts to a new site and rebuilds it there. Simultaneously, Team Gamma builds a functional engine in the original berth using entirely new parts, machined to the original tolerances. At $t_1$, Alpha and Beta finish. Alpha has spatiotemporal continuity of location; Beta has continuity of matter. Neither has both.
  *   **The Requirement:** The theory must provide a principled ranking of Location vs. Matter in cases of simultaneous divergence, *or* it must explicitly declare the identity relation indeterminate at $t_1$. It cannot rely on "wait and see which one people treat as real."
  *   **Status:** **Genuinely Required.** A committee cannot issue a certificate that says "Both are original" if only one can be insured as such, nor can it say "We decide next year."
  *   **Constraint:** The verdict at $t_1$ cannot depend on events at $t_2$ (see Retroactivity).

  **2. The Temporal Independence Requirement (No Retroactivity)**
  *   **The Case:** *The Burnt Archive.* Two server clusters claim to be the "National Archive." Cluster A has the continuous causal history of the data but runs on new hardware. Cluster B has the original hardware but was offline for a decade. At $t_1$, both are operational. At $t_2$ (20 years later), Cluster A burns down. Cluster B survives.
  *   **The Requirement:** Identity status at $t_1$ must be settleable without knowledge of $t_2$. The survivor does not become the original *retroactively* because the competitor was destroyed.
  *   **Status:** **Genuinely Required.** Legal and administrative liability cannot shift backward in time based on future accidents. If B was a fake at $t_1$, it remains a fake at $t_2$, even if it is now the *only* candidate.
  *   **Constraint:** This directly conflicts with theories that rely on "best candidate" comparisons across time.

  **3. The Gradualness Sensitivity Requirement**
  *   **The Case:** *The Flash-Refurbished Hotel.* A historic hotel replaces all structural beams. In Scenario 1, they swap one beam per month over 40 years. In Scenario 2, they brace the structure and swap all beams in a single weekend. The physical end-state is identical.
  *   **The Requirement:** If the theory yields different verdicts for Scenario 1 and 2, it must identify the *mechanism* of preservation (e.g., uninterrupted function, continuous causal chain). If the verdict is the same, it must explain why the *process* is metaphysically inert. Furthermore, it must categorize the "tipping point": is the lack of a sharp cutoff due to semantic vagueness (our words are blurry), ontic indeterminacy (the object itself is blurry), or epistemic limitation (there is a fact, we just can't know it)?
  *   **Status:** **Genuinely Required.** Heritage law often privileges "continuous use" over "fabric." The theory must account for why time might matter as much as timber.

  **4. The Historical Causal Constraint (No-Overlap)**
  *   **The Case:** *The Replica Fighter.* A WWII fighter plane is destroyed. Enthusiasts build a perfect duplicate from new aluminum, using the original blueprints. It looks, flies, and sounds exactly like the original. It shares no atoms and no causal history with the original (the blueprints are secondary intermediaries).
  *   **The Requirement:** The theory must verdict this as *not* the original. This blocks pure Functionalism (it does the job) and pure Formalism (it has the shape). It requires a causal-historical link to the originating event.
  *   **Status:** **Genuinely Required.** Without this, any replica is an original, which destroys the concept of heritage value. However, the theory must not make causal history *so* strict that routine maintenance breaks identity.

  **5. The Identity/Value Split Requirement**
  *   **The Case:** *The Carbon-Fiber Violin.* A Stradivarius has its back replaced with carbon fiber that mimics the wood's density and resonance perfectly. It holds 40% original matter. A museum holds the original wood back (60% matter) in a box.
  *   **The Requirement:** The theory must explicitly state whether Identity is binary (1 or 0) while *Value* is graded, or whether Identity itself admits of degrees. It cannot smuggle graded value in as "partial identity" without defining the logic of partial identity (e.g., does transitivity hold for 0.6 identity?).
  *   **Status:** **Prejudice of Classical Metaphysics.** The requirement that Identity *must* be binary is a commitment to classical logic, not necessarily a feature of artifacts. A pragmatic theory should be allowed to treat identity as a cluster concept that admits of degrees, provided it flags where the cutoffs for legal purposes lie.

  **6. The Practice Alignment Requirement**
  *   **The Case:** *The De-Registered Yacht.* A historic yacht is stripped of its registry number and sold for scrap. The buyer restores it perfectly but cannot recover the official number. The registry office declares it a "new build." The heritage committee is asked if it is the "historic vessel."
  *   **The Requirement:** The theory must either align with social/legal tracing practices (registry, names, insurance) or provide a robust error theory explaining why the social practice is wrong about what the object *is*.
  *   **Status:** **Genuinely Required.** For a committee, "It is metaphysically the ship but legally it isn't" is a failure state. The theory must bridge the gap or explicitly map the divergence.

  **7. The Scope Declaration Requirement**
  *   **The Case:** *The University.* A university moves campuses, changes its charter, and replaces all staff. Is it the same institution? A ship replaces all planks. Is it the same ship?
  *   **The Requirement:** The theory must state if it applies uniformly across artifacts, institutions, and persons, or if it offers a domain-specific account. If domain-specific, it must explain the relevant difference between a ship and a person that warrants different identity conditions.
  *   **Status:** **Prejudice of Metaphysical Monism.** There is no guarantee that ships and persons share identity conditions. Demanding uniformity is a philosophical preference, not a practical necessity.

  ***

  ### The Squeeze: The Inconsistent Tetrad

  You suspected a squeeze. Here it is. You cannot jointly satisfy the following four constraints. A theory must drop at least one.

  1.  **Determinacy:** In the Two-Ship Symmetry case (Twin Locomotives), there is a fact of the matter about which one is the original (it's not vague, and it's not "both").
  2.  **Temporal Independence:** The identity fact at $t_1$ cannot depend on future events (e.g., which one survives to $t_2$).
  3.  **Non-Arbitrariness:** There must be a principled reason why Ship A is the original and Ship B is not, accessible at $t_1$.
  4.  **Supervenience on Intrinsic/Relational Properties:** The identity fact must depend on the physical or causal properties of the ships at $t_1$, not on external stipulations.

  **The Conflict:**
  In the *Twin Locomotives* case, at $t_1$, Ship A (Location) and Ship B (Matter) are symmetric with respect to "claim strength" unless you privilege one property (Matter vs. Location) dogmatically.
  *   If you privilege Matter, you violate **Practice Alignment** (heritage often privileges location/site).
  *   If you privilege Location, you violate **Historical Causal Constraint** (the matter went elsewhere).
  *   If you say "Wait to see which one survives," you violate **Temporal Independence**.
  *   If you say "There is a fact, but we can't know the principle," you violate **Non-Arbitrariness**.
  *   If you say "It is indeterminate," you violate **Determinacy**.

  **The Knockout Requirement:**
  **Temporal Independence** is the single requirement that knocks out the most sophisticated metaphysical candidates.
  *   **Four-Dimensionalism (Perdurantism):** Often handles this by saying the "ship" is a spacetime worm. In symmetric fission, the worm splits. But to say which *current* stage belongs to which *future* worm often requires looking at the future stages.
  *   **Best Candidate Theory:** Explicitly relies on comparing candidates over time. It fails Temporal Independence dead.
  *   **Conventionalism:** Survives this by saying "We decide," but that fails **Non-Arbitrariness** for a committee that wants to *discover* the truth, not legislate it.

  **The Verdict on the Squeeze:**
  To satisfy the committee's need for a decision *now* (Temporal Independence) in a symmetric case (Twin Locomotives) without arbitrariness, you are forced to accept **Ontic Indeterminacy**. You must admit that at $t_1$, the world itself has not settled whether A or B is the original.
  *   *Cost:* This violates **Determinacy**.
  *   *Benefit:* It saves **Temporal Independence** and **Non-Arbitrariness** (there is no fact because the conditions for a fact aren't met).
  *   *Committee Impact:* You cannot issue a Certificate of Authenticity for *either* until further differentiation occurs. You issue a "Status Pending."

  ***

  ### Prejudice Flag: "Vindicate Folk Verdicts"

  You asked to flag the requirement that "a theory must vindicate folk verdicts in easy cases."
  **This is a Prejudice (Common Sense Realism).**
  *   **Argument:** Folk verdicts are inconsistent. In the *Flash-Refurbished Hotel*, folk might say "It's the same hotel" because it kept trading. In the *Twin Locomotives*, folk might split 50/50. Relying on folk verdicts treats metaphysics as sociology.
  *   **Counter-Argument:** If a theory contradicts all folk verdicts, it is useless for a heritage committee.
  *   **Resolution:** The requirement should not be "Vindicate Folk," but "Explain Folk." A good theory should explain *why* the folk say what they say (e.g., they are tracking *value* not *identity*), even if the theory corrects them.

  ***

  ### Scorecard: How the Usual Suspects Fare

  *   **Matter-Based (Constitution):** Fails **Gradualness**. If 51% of planks are swapped, is it a new ship? Also fails *Twin Locomotives* (cannot handle fission without arbitrariness).
  *   **Form/Function-Based:** Fails **Historical Causal Constraint**. The *Replica Fighter* comes out as the original. Unacceptable for heritage.
  *   **Spatiotemporal/Causal Continuity:** Strong on **Gradualness** and **No-Overlap**. Fails **Temporal Independence** in fission cases (needs to see the future to trace the continuous path).
  *   **Temporal-Parts (4D):** Handles **Gradualness** well. Struggles with **Symmetry** (the worm splits, but which name applies to which branch?). Often forces **Indeterminacy**.
  *   **Constitution Views (Baker):** Distinguishes the "statue" from the "clay." Good for **Mixed Cases**. Can be rigid on **Social Layer** (requires specific intentional contexts).
  *   **Conventionalism:** Passes **Symmetry** and **Temporal Independence** (we decide). Fails **Non-Arbitrariness** (looks like magic/legislation, not discovery).
  *   **Eliminativism:** (There are no ships, only atoms arranged shipwise). Passes everything by dissolving the question. Fails **Practice Alignment** (useless for insurance).

  **Recommendation:** For a committee, a **Hybrid Causal-Convention** view is the only survivable option. You trace causal continuity (matter + function) as far as it goes without contradiction. Where symmetry arises (Twin Locomotives), you acknowledge **Ontic Indeterminacy** and allow social practice (Registry/Name) to break the tie, explicitly marking that moment as a *legislative* act of preservation, not a *discovery* of fact. This satisfies **Temporal Independence** (you decide now) and **Practice Alignment**, while admitting the **Prejudice** that sometimes identity is made, not found.
