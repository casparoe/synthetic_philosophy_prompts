          *   Label: Prejudice/Camp. (Metaphysicians usually say binary; pragmatists say graded). Let's mark *Binary Identity* as a prejudice of classical metaphysics. *Transparency of Grading* is the requirement.

      *   *Social Layer (Practice):*
          *   Case: Registry numbers, insurance, names.
          *   Requirement: Account for the divergence between metaphysical identity and legal/social identity.
          *   Label: Genuinely Required. *Practice Alignment (or Explanation of Divergence)*.

      *   *Scope (Uniformity):*
          *   Case: Ships vs. Persons vs. Institutions.
