          *   Cover specific topics: Two-ship version (simultaneity), Retroactivity (future dependence), Gradualness (rate of change), No-Overlap Rebuild (exact duplicate), Mixed/Fractional Cases (degrees of identity), Social Layer (registry/practice), Scope (persons/uniformity).
          *   **Crucial:** Identify which subset of desiderata *cannot* be jointly satisfied (the "squeeze").
