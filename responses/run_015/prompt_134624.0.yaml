      *   **Scorecard:** Briefly run the usual suspects against the desiderata.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on "Prejudice":* Be careful not to dismiss "folk verdicts" entirely, but acknowledge that relying on them is a methodological commitment (Common Sense Realism) that might conflict with scientific/metaphysical rigor.
      *   *Correction on "Degrees":* Standard logic says identity is 1 or 0. But *preservation value* is graded. The theory needs to distinguish *Identity* from *Value*. I should make that a specific requirement.
      *   *Refining the Squeeze:* The user mentioned "Determinacy + Transitivity + No-Future-Dependence + Symmetry". I need to show exactly where the logic breaks. It's usually the *Principle of Sufficient Reason* applied to identity. If A and B are symmetric, why is A=Original and B!=Original?
      *   *Case Invention:*
          *   Symmetry: "The Twin Locomotives" (One rebuilt in situ, one from scrap).
          *   Retroactivity: "The Burnt Archive" (Two servers, one burns later).
          *   Gradualness: "The Flash-Refurbished Hotel" (Overnight vs. 10 years).
          *   No-Overlap: "The Replica Fighter" (Blueprint reconstruction).
