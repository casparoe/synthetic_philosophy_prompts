          *   Requirement: Identity must be settled at $t$ without reference to $t+n$. (No backward causation of identity).
          *   Label: Genuinely Required (Administrative necessity + metaphysical intuition). *Temporal Independence*.

      *   *Gradualness (Rate of Change):*
