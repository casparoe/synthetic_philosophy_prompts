          *   Label: Prejudice (Universalism is a specific metaphysical commitment). *Scope Declaration*.

  3.  **Identify the "Squeeze" (Inconsistency):**
      *   The user hints at: Determinacy + Transitivity + No-Future-Dependence + Symmetry.
      *   *The Conflict:* In the Two-Ship case (Simultaneity), if we demand *Determinacy* (there is a fact of the matter), *No-Future-Dependence* (can't wait to see which survives), and *Non-Arbitrariness* (can't just pick one), we have a problem.
      *   If both ships are qualitatively identical and causally continuous at $t_1$, and identity is binary and determinate, one *must* be the original. But there is no metaphysical ground to distinguish them *at that time*.
      *   To solve this, you usually need either:
          1.  Future dependence (wait and see).
          2.  Indeterminacy (neither/both/vague).
          3.  Conventionalism (we pick).
      *   The "Single Requirement that Knocks Out Most Candidates": *Temporal Independence* combined with *Determinacy in Symmetric Cases*. Most theories fail one or the other.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the committee's burden. Set the stage.
      *   **The Desiderata List:** Go through the 7 points requested.
