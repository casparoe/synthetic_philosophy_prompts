  The water took the mouth, the single eye,
  One sees a martyr's grief within the stain.
  Another sees a god's command on high,
  The third sees mud and walks away in vain.
  So chaos rules the realm of what we feel,
  Is value in the pigment or the glance?
  Can damage make the hidden truth appear?
  Or is it all mere subjective chance?

  Yet practice tunes the nerve to finer grain,
  We weigh the stroke against the bleached decay.
  But do we find the gold or forge the vein?
  Is there a rule, or just a shared assay?
  No sovereign truth resides inside the lime,
  What the refined construct as truth in time.
