  hey — for my aestetics seminar i'm asking students to write poems that actually argue, not just decorate. i need one that tackles hume's standard of taste but through a specific lens: imagine a single fragment of a fresko where half the figure is lost to water damage. the speaker should be a conservator or critic standing in front of it, and the poem should be a 14-line sonnet with the volta right at line 9. in the octave, lay out the subjective chaos — three different viewers seeing grief, power, nothing — and let the rhyme scheme feel unsettled, maybe alternating or loose. then in the sestet, the speaker admits there's a difference between a trained eye and a casual glance, but stops short of saying the expert just "finds" beauty in the stone; the tension should stay live between discovery and construction, or between a normative standard and just statistical agreement among people with refined palates. keep it mostly iambic pentamter but don't be robotic. please don't turn it into a sermon about museum ethics — stay in the weeds of taste. and no direct quotes from hume's essay, i don't want citation games. just the poem.
