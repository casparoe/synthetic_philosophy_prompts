answer: |-
  **Decision Procedure (15 mins/message)**

  1.  **Classify:** Is this (a) World Claim, (b) Observation/Alert, or (c) Directive? *[Convention]*
  2.  **Directive Check:** If (c), log as protocol change. Do not update probabilities. Stop. *[Theory: Directives are not evidence]*
  3.  **Alert Policy:** Is this message triggered by a threshold? If yes, does silence imply safety? If policy unknown, log "Incomplete Evidence". Stop. *[Theory: Selection effects]*
  4.  **JB Shape:** Is the consequent about what we will *observe* or *be told*? If yes, do not treat as material conditional ($\neg A \lor B$). Conditioning on $\neg A \lor B$ artificially inflates $P(\neg A)$ without justification. *[Theory]*
  5.  **JB Move:** Set $P(Consequent|Antecedent)$ to the stated value. Keep prior odds of Antecedent vs. $\neg$Antecedent fixed. *[Theory]*
  6.  **Numbers:** If hedged ("real chance"), assign 0.5. Hand to Director for approval. *[Convention]*
  7.  **Missing Info:** If expert didn't specify policy/threshold, log "Unquantified". Do not update. Hand to Director. *[Convention]*
  8.  **Sign-off:** Director approves Steps 5 & 6 deviations. *[Convention]*

  **Table: Message-Type to Update Move**

  | Type | Update Move | Refusal Condition |
  | :--- | :--- | :--- |
  | World Claim | Condition on fact | None |
  | Observation/Alert | Condition on receipt + silence | Policy unknown (Step 3) |
  | Directive | Log protocol | N/A (Step 2) |
  | JB Constraint | Fix conditional prob, keep odds | Treat as material conditional (Step 4) |

  **Worked Cases**

  1.  **Marsh Road Gauge:** "If levee breached upstream the gauge at Marsh Road will read over three metres."
      *   **Classification:** Observation (Step 1). JB Shape (Step 4): Consequent is gauge reading (observation).
      *   **Action:** Do not condition on "Breach $\rightarrow$ Gauge>3". Set $P(Gauge>3 | Breach) = 1$. Keep odds of Breach fixed relative to No-Breach.
      *   **Result:** Probability of Breach remains unchanged; probability of Gauge>3 updates only via the conditional link.

  2.  **Hedged Rainfall:** "If winter rainfall is above the 90th percentile there's a real chance the embankment overtops."
      *   **Classification:** World Claim. Numbers: Hedged (Step 6).
      *   **Action:** Assign $P(Overtop | Rain>90) = 0.5$. Flag for Director.
      *   **Result:** Update proceeds with 0.5, but Director must sign off on the arbitrary conversion.

  3.  **Alert/Power (The Refusal):** "If the pumping station loses mains power you'll see water in the substation within four hours." (Received as an alert message).
      *   **Classification:** Observation/Alert. Alert Policy (Step 3).
      *   **Action:** Does silence imply no water? The engineer didn't specify if the sensor auto-reports silence.
      *   **Result:** **Log "Incomplete Evidence". Do not update.** This refuses your current practice of treating silence as safety without explicit policy confirmation.

  **Limitations**
  This procedure cannot resolve conflicting expert testimony or derive priors from ignorance. It assumes the partition (Antecedent vs. $\neg$Antecedent) is stable. It forces "no update" on ambiguous alerts, which may frustrate ops teams wanting definitive risk scores. It relies on the Director accepting entropy-minimization (Step 5) as valid reasoning without mathematical proof. Steps marked [Theory] are defensible to technical reviewers; [Convention] steps are adjustable for office workflow.
