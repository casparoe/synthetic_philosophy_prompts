  3.  **Brainstorming Overlooked Requirements (Quine-style):**
      *   People focus on logical form (bound variables). They miss:
          *   *Theory Individuation:* When is a theory distinct enough to carry commitment?
          *   *Paraphrase Potential:* Can we paraphrase away the commitment? (Quine knew this, but people forget the *cost* of paraphrase).
          *   *Background Logic:* Commitment depends on the logic used (classical vs. intuitionistic).
          *   *Domain Restriction:* Are we committing to *all* values or just *relevant* ones?
          *   *Dynamic Revision:* Commitment isn't static; theories change. How does commitment track theory change?
          *   *The "Best" Theory Problem:* What if there are empirically equivalent theories with different ontologies? (Underdetermination).

  4.  **Developing the Desiderata Spec (The Core):**
      *   *Context:* Informational Closure Failure (ICF). The system is closed to us in a way that prevents standard IBE (Inference to the Best Explanation).
