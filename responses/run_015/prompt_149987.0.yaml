prompt: |-
  Hey, I'm writing up a workshop pitch and I've been arguing with my roommate about whether we can ever really lock down what's in an ontology when big chunks of the relevant information are just permanently inaccessable — not hidden, but genuinely out of reach. I need you to act like a professional philosopher of science with some metaphysics background, and please think carefully before you start. Do a quick brainstorm of the obvious requirements people usually miss when they talk about Quine-style ontological commitment.

  Then give me the full desiderata spec for a theory of ontology identification that works even under informational closure failures — situations where the usual inference-to-best-explanation breaks down because the gap isn't temporary. I want the cases it must handle (direct unobservability, destroyed historical records, modal distance, quantitative vs qualitative inaccessability), the distinctions it can't collapse (ontology vs epistemology, identification vs confirmation, permanent vs contingent gaps), any scientific results it can't flat-out contradict, and flag which pair of desiderata you suspect are jointly unsatisfiable. Also tell me which single requirement kills the most popular accounts, and be explicit about what counts as failure versus mere incompleteness. Keep it in the weeds but don't ask me to read anything — no bibliography, I'll fill in citations myself. Make the framing sharp, like I'm pitching this for a one-year research fellowship, and don't just repeat the standard Quinean criterion back at me.
