answer: |-
  This is an excellent steelman. It captures the central tension in the literature on social learning: if rational agents suppress their private information to follow the crowd, how does the crowd ever learn it was wrong?

  The bug is in **Step (4)**.

  To be precise: Step (4) is true *within the closed system of the canonical model* (Bikhchandani, Hirshleifer, and Welch 1992), but it is false as a general claim about rational cascades in the world. Your classmate's argument relies on an equivocation between "what happens afterwards" in the model (more agents with private signals) and "what happens afterwards" in reality (public information and payoff realization).

  Here is the diagnosis of why (4) looks plausible, why it must be rejected, and what you have to pay to reject it.

  ### 1. Why Step (4) Looked Plausible
  Step (4) inherits its plausibility from the specific architectural constraints of the canonical model. In the standard setup:
  *   **Actions are binary** (Adopt/Reject).
  *   **Signals are binary** (High/Low) with fixed precision.
  *   **Information is endogenous only.** The *only* new information arriving in the system comes from the sequence of agents' private signals, which are only revealed via their actions.

  Under these specific constraints, once the public belief (derived from the history of actions) outweighs the weight of any single private signal, the public belief freezes. No single agent can ever move the needle. Since no new *private* information is revealed (per Step 2), the public belief never updates. Therefore, within the logic of that specific mathematical toy world, the cascade is indeed an absorbing state.

  It looked plausible because the literature often emphasizes the *fragility* of cascades (they form easily) without always emphasizing that, in the *static* model, they are also *permanent* absent external shock. Your classmate has correctly identified the "permanence" implication of the static model.

  ### 2. Why You Must Reject Step (4)
  You must reject (4) because it generalizes a feature of the *model* to a feature of *rationality*.

  Step (4) claims: *"A cascade that starts in the wrong direction can never be corrected by what happens afterwards."*

  This is false because "what happens afterwards" in the real world includes **exogenous public information** and **outcome observation**, neither of which are captured in the premises of the cascade model you described in (1) and (2).

  *   **Exogenous Public Information:** In the real world, news reports, expert reviews, or regulatory filings can arrive. In the BHW model, the authors explicitly note that a small amount of public information can shatter a cascade. If a food critic publishes a review (public signal) that is more precise than the accumulated private signals of the queue, rational agents will ignore the queue and follow the critic. The cascade breaks rationally.
  *   **Outcome Observation:** Your example in (5) is telling: *"a bad restaurant's queue thins once enough people have actually eaten there."* This is crucial. The canonical cascade model assumes agents observe *choices*, not *payoffs*. In reality, agents often observe the *results* of previous choices (the empty plates, the stock return). If I see the first five people leave the restaurant looking sick, I have direct evidence of the state. I do not need to infer their private signals from their choice to enter. This new data overrides the cascade.

  Step (4) is only true if the information environment remains hermetically sealed to anything other than sequential binary choices based on private signals. Since the real world is not hermetically sealed, (4) is false.

  ### 3. What You Have to Pay (The Cost)
  To reject (4) while keeping (1), (2), and (5), you must pay a conceptual price regarding the scope of the model.

  **The Cost:** You must concede that the canonical rational cascade model is not a complete theory of social learning; it is a theory of **informational friction**.

  By rejecting (4), you are admitting that the model describes a specific *mechanism* (the suppression of private information due to public belief dominance) but not a *total equilibrium of history*. You have to accept that:
  1.  **Cascades are locally rational but globally fragile.** They are rational responses to the information available *at that moment*, but they are not stable against new *types* of information (public news, payoff data).
  2.  **Step (5) describes a different epistemic regime.** The corrections you observe in (5) are not corrections driven by *later private signals* (which the model says can't work). They are corrections driven by *public signals* or *state verification*.

  If you keep (1) and (2), you are committed to the view that *private signals alone* cannot break a mature cascade. Therefore, to save (5), you must interpret the "correction" in (5) as the arrival of information that is **not** a private signal hidden behind a binary choice.

  ### 4. How to Fix the Argument
  Here is how you should revise the argument to make it sound while avoiding the false conclusion (6):

  *   **Keep (1) & (2):** These correctly describe the internal mechanics of the cascade.
  *   **Revise (3):** "So once a cascade has begun, watching later agents' *choices* teaches nothing new about their *private signals*." (Add the italics. It blocks the jump to total ignorance).
  *   **Reject (4):** Replace with: "So once a cascade has begun, it cannot be corrected by *subsequent private signals alone*; it requires the arrival of public information or direct observation of payoffs."
  *   **Keep (5):** Mistaken cascades get overturned because public information arrives or payoffs are observed.
  *   **Reject (6):** Therefore, rational information cascades *do* occur, but they are inherently fragile to public information. The corrections we observe are consistent with rationality, provided the correction comes from outside the cascade's private-signal channel.

  ### Summary for Seminar
  Your classmate's argument proves that **cascades are informationally inefficient**, not that they are irrational.

  The bug is the assumption that the *only* way to correct a belief is through the same channel that created it (sequential private signals). Rationality allows for belief updating via *any* available information source. The cascade model shows that the *choice channel* gets clogged; it does not show that the *world* stops speaking.

  If you reject (4), you preserve the insight of the model (herding is rational but blinds us to private data) without accepting the absurdity that rational herding is unbreakable. You pay the price of acknowledging that the model is a partial equilibrium analysis, not a description of a closed epistemic universe.
