      *Wait, one more nuance:* Does the model *actually* say cascades are permanent? BHW (1992) explicitly discusses "cascade fragility." They note that a small amount of public information can shatter a cascade. So the classmate's argument contradicts the actual literature's own caveats. I should mention this. The argument treats the model as more rigid than the authors did.

