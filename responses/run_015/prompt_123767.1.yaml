prompt: |-
  Consider Arendt's judgments across the cases she treats in her essays on politics and truth. She regards traditional deception of foreign adversaries about military intentions as an old, bounded practice that does not corrupt domestic factual reality; she condemns modern domestic image-making that substitutes fabricated narratives for shared events; she reads the Pentagon Papers not as necessary secrecy but as self-deception, where policymakers lost the capacity to distinguish their fabrications from reality; she treats lies about purely private conduct as politically insignificant unless they feed that image machinery; and she treats the systematic rewriting of historical archives as the extreme form, because it destroys not particular facts but the very framework within which citizens can jointly inhabit a world.

  Now consider this case: a democratic administration deploys algorithmic systems to distribute tailored, mutually contradictory accounts of local environmental conditions to different regions—not to conceal one specific secret, but to prevent coordinated opposition—while the officials who design the system sincerely believe the overall environmental policy is sound, though they know the regional reports are selectively false.

  Predict whether Arendt would group this with traditional diplomatic deception, with Pentagon-style self-deception, or with archive-level destruction of common reality. Identify the two principles that best organize her earlier rulings—one centered on whether the liar retains awareness that specific claims are false, the other on whether the practice leaves intact a shared factual world citizens can jointly inhabit regardless of intent. Give your best guess with reasons for preferring it, and specify the further case that would best separate the two principles: for instance, officials who have genuinely come to believe every contradictory report they issue, yet the reports happen to be consistent across all regions.
