answer: |-
  ### 1. The Order: Sequence of Moves

  You are right to worry about the transition. If you spend twenty minutes on the technical problem, you risk convincing them that the frame problem *is* a technical problem about logical notation. The broader problem (relevance) will look like a separate, vague philosophical complaint unless you show that solving the technical one *necessarily fails* to solve the broader one.

  Here is the sequence. Do not deviate from the timing roughly indicated; the pressure keeps the distinction sharp.

  **Move 1: The Naive Planner (5 minutes)**
  *   **Content:** Recap the prior lecture. An agent has a state, a goal, and actions (Preconditions $\to$ Effects). To plan, it chains actions.
  *   **Prerequisite:** None. This is their baseline.
  *   **Purpose:** Establish the "closed world" assumption implicitly. In the lecture, they likely assumed only the specified effects change. Make that assumption explicit now.

  **Move 2: The Technical Explosion (10 minutes)**
  *   **Content:** Ask them to formalize "Move Block A." It changes position. Does it change color? Weight? Location of Block B? In logic, if you don't say "Color stays same," the logic doesn't know. To be rigorous, you need a "frame axiom" for every non-change. With $N$ actions and $M$ facts, you need $N \times M$ axioms.
  *   **Prerequisite:** They must accept that logic is explicit; it doesn't "assume" stability.
  *   **Purpose:** Generate the technical problem. Make them feel the representational bloat.
  *   **Misconception Block:** **Speed/Memory.** Stop them here. If they suggest "just use faster computers," correct them: "It's not that the computer is slow; it's that we haven't finished writing the program. The description itself is infinite."

  **Move 3: The Technical "Fix" (10 minutes)**
  *   **Content:** Introduce the standard workaround (without naming specific formalisms like Situation Calculus). "Assume everything stays the same unless specified." This solves the representational bloat. We no longer write the axioms.
  *   **Prerequisite:** They must feel the pain of Move 2.
  *   **Purpose:** This is the critical pivot. You must solve the technical problem *on the board* to show that the real problem remains.
  *   **Withholding:** Do not yet use the word "Relevance." Call it "The Search Problem."

  **Move 4: The Relevance Failure (15 minutes)**
  *   **Content:** Now apply the "Fix" to your Carrying Example. The agent assumes nothing changes unless told. But to act safely, it must check for *exceptions* to the fix. Which exceptions? The bomb? The dust? The color? Even if we don't write axioms for non-changes, the agent must *check* potential changes. How does it know which facts to check?
  *   **Prerequisite:** The "Fix" from Move 3 must be in place. If they think we are still writing axioms, they will think checking every fact is just the technical problem again.
  *   **Purpose:** This reveals the Broader Problem. It is not about representing non-change; it is about accessing the right beliefs for the current goal.
  *   **Misconception Block:** **Solved in 80s.** Acknowledge that Move 3 solved the *logical* frame problem for engineers, but Move 4 shows the *cognitive* frame problem remains for philosophers and cognitive scientists.

  **Move 5: The Relational Nature of Relevance (10 minutes)**
  *   **Content:** Run the Carrying Example through the three goals. Show that the *same fact* flips from relevant to irrelevant.
  *   **Prerequisite:** They must see the Search Problem (Move 4).
  *   **Purpose:** Destroy the idea that relevance is intrinsic to a fact.
  *   **Misconception Block:** **Holism.** If they conclude "everything bears on everything," correct them: "No, only some things bear on some goals. The problem is finding the mapping."

  ---

  ### 2. The Carrying Example

  **Critique of the Battery/Wagon/Bomb:**
  Do not use the standard version. In the classic story, the bomb is *always* relevant to a rational agent (survival is a precondition for all goals). It does not satisfy your constraint of flipping relevance. If the robot ignores the bomb, it dies, regardless of whether it was sent for the battery or the wagon. It forces the "Relevance is Intrinsic" misconception.

  **The Modified Scenario: The Perishable Cargo**
  Keep the Robot, the Wagon, and the Room.
  *   **Action:** Pull the Wagon from Room A to Room B.
  *   **Cargo:** The Wagon carries a **Battery** (the original goal object) and a **Block of Ice**.
  *   **Environment:** The path goes over a **Weak Bridge**. The Wagon has **Dusty Wheels**.

  **The Three Goals (Run these sequentially):**
  1.  **Goal:** "Retrieve the Battery."
      *   *Dusty Wheels:* Irrelevant (Close).
      *   *Weak Bridge:* Relevant (Far-flung consequence: wagon falls).
      *   *Block of Ice:* **Irrelevant.** (It melts, we don't care. It is just weight).
  2.  **Goal:** "Deliver the Ice intact."
      *   *Dusty Wheels:* Irrelevant (Close).
      *   *Weak Bridge:* Relevant (Far-flung consequence: wagon falls).
      *   *Block of Ice:* **Relevant.** (Must monitor temperature/time).
  3.  **Goal:** "Test the structural integrity of the Bridge."
      *   *Dusty Wheels:* Irrelevant (Close).
      *   *Weak Bridge:* **The Goal.**
      *   *Block of Ice:* **Irrelevant.** (It is just mass to load the bridge. Whether it melts is无关).

  **What it must have:**
  *   **Causal Independence:** The dust must not causally affect the bridge or the ice. This isolates "irrelevance" from "causal inertness."
  *   **Goal Explicitness:** The goals must be stated as commands. The change in relevance must come *only* from the command, not from a change in the world.

  **What it must lack:**
  *   **Moral Stakes:** Do not make the ice contain a living thing or the bomb explode. Moral necessity looks like logical necessity to first-years. Keep it instrumental.
  *   **Hidden Preconditions:** Do not make the ice necessary for the robot's survival. Keep the agent's existence separate from the cargo's state.

  ---

  ### 3. The Misconceptions

  Here is when to intervene. If you wait until the end to address these, they will have already structured the students' understanding incorrectly.

  1.  **"It's a problem of computational cost."**
      *   **When:** Move 2 (The Technical Explosion).
      *   **How:** "If I gave you a computer the size of the universe, you still couldn't write the axioms. The problem is in the *description*, not the *processing*."
  2.  **"It was solved by the late 1980s."**
      *   **When:** Move 4 (The Relevance Failure).
      *   **How:** "Engineers solved Move 2. They use shortcuts. But if you ask *how the agent knows which shortcut to use*, you are back at Move 4. That part is not solved."
  3.  **"It is the same as the Qualification/Ramification problem."**
      *   **When:** Do not raise this unless a student does. If they do, distinguish it immediately in Move 2.
      *   **How:** "Qualification is about what *prevents* an action (the potato in the tailpipe). Ramification is about *indirect effects* (the switch flips, the light turns on). The Frame Problem is about what *stays the same*. They are siblings, not twins."
  4.  **"Relevance is a property a belief has on its own."**
      *   **When:** Move 5 (The Relational Nature).
      *   **How:** Use the Ice example. "Is the ice relevant? Yes for Goal 2, No for Goal 1. Therefore, relevance is not in the ice. It is in the relationship between the ice and the goal."
  5.  **"The takeaway is vague holism (everything bears on everything)."**
      *   **When:** Closing (Move 5).
      *   **How:** "Holism says everything connects. The Frame Problem says we can't *find* the connections that matter. Holism is the fog; the Frame Problem is the lack of a compass."

  **Missing Misconception:**
  *   **"Machine Learning solves this."**
      *   **When:** Closing.
      *   **Why:** Students assume neural nets "learn relevance."
      *   **Correction:** "ML hides the problem by statistical correlation. It doesn't explain *why* a fact was relevant. It bypasses the representation, it doesn't solve the cognitive puzzle."

  ---

  ### 4. The Two Folded Questions

  **1. The Yale Shooting Case (Temporal Projection)**
  *   **Verdict:** **Drop it.**
  *   **Reasoning:** It requires understanding non-monotonic logic and minimal change models. With only truth tables as background, this will consume 15 minutes of confusion about "when" a fact holds, distracting from "whether" it matters. It solves a technical sub-problem of the technical frame problem. It does not illuminate the broader relevance problem. It is a trap for you: you will end up teaching logic instead of philosophy of mind.

  **2. The Fodor/Computationalism Argument**
  *   **Verdict:** **Include, but conditionally.**
  *   **Condition:** Only raise this if Move 5 (Relational Relevance) has landed. If they still think relevance is intrinsic, Fodor's argument will sound like nonsense.
  *   **How:** "If relevance depends on *any* other belief (isotropic), and there is no algorithm to check them all (non-demonstrative), can a system that follows rules (computation) ever have a mind?"
  *   **Warning:** Do not present this as "Therefore AI is impossible." Present it as "Therefore, if cognition is computational, we are missing a fundamental account of how access works." Keep it to 2 minutes. It is a horizon, not a conclusion.

  ---

  ### 5. The Check and The Omission

  **The Assessment Question**
  Your plan (3 vignettes: Frame, Sibling, Cost) is sound, but identification is too easy to guess. To discriminate understanding, you must require **justification**.

  *   **Revised Task:** Hand out the three vignettes. Ask: "In which case does the agent fail because it *cannot represent* the world, and in which does it fail because it *cannot search* the world? Explain the difference using the 'Ice' example."
  *   **Why:** This forces them to use the Technical vs. Broader distinction. If they just label them, they might be matching keywords. If they must map it to the Ice example, they prove they grasped the mechanism.
  *   **Borderline Case:** Include one vignette where the agent fails because it didn't check a *qualification* (e.g., potato in tailpipe). This tests if they can distinguish Frame (non-change) from Qualification (precondition).

  **The Omission: What to Refuse to Explain**
  *   **The Topic:** Do not explain how modern AI (PDDL, heuristics, deep learning) practically bypasses the frame problem.
  *   **The Reason:** If you explain the engineering workaround, the students will conclude the problem is "solved" and the seminar was a historical curiosity.
  *   **How to Refuse:** Make it principled. "We are studying the *concept* of cognition, not the *engineering* of robots. Engineers build bridges over this problem every day. Philosophers ask why the bridge is necessary. If I show you the bridge, you will stop asking about the gap."
  *   **Phrasing:** "That is a solution to the engineering constraint. It is not a solution to the cognitive puzzle. We are doing the latter."

  ### Summary Checklist for the Seminar
  1.  **0-5:** Naive Planning (Recap).
  2.  **5-15:** Technical Explosion (Axiom bloat). Block "Speed" misconception.
  3.  **15-25:** The "Fix" (Assume stability).
  4.  **25-40:** The Example (Robot/Ice/Bridge). Run 3 Goals. Block "Intrinsic Relevance" misconception.
  5.  **40-45:** Broader Problem (Search/Access). Block "Solved in 80s" misconception.
  6.  **45-48:** Fodor/Horizon (Optional, if time allows).
  7.  **48-50:** Assessment Task (Justify, don't just label).
  8.  **Throughout:** Refuse to discuss modern engineering patches.
