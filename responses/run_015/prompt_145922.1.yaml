answer: |-
  ### Formalization of the Analogical Mapping

  To conduct this analysis, we first establish the structural isomorphism between the decision-theoretic framework and the statistical mechanical system.

  1.  **The Ensemble:** The "large world" containing $N$ structurally identical agents is mapped to a macroscopic system of $N$ identical particles.
  2.  **The Microstate:** The decision variable of each agent (Cooperate/Defect) corresponds to the state of a particle (e.g., spin up/down, $\sigma_i \in \{+1, -1\}$).
  3.  **The Hamiltonian (Utility):** The total value of the outcome corresponds to the negative energy of the system ($U \leftrightarrow -H$). Maximizing utility is analogous to minimizing energy.
  4.  **Indistinguishability:** The premise that the agents are "structurally identical" maps to the physical principle of particle indistinguishability. The system's description must be invariant under the permutation of agent indices $i \leftrightarrow j$.

  ### Evidential Cooperation as Global Symmetry Preservation

  In Evidential Decision Theory (EDT), the agent reasons that her decision provides evidence regarding the decisions of her copies. Because the agents are structurally identical, they instantiate the same decision algorithm. Consequently, the probability distribution over the ensemble's states is constrained by the agent's knowledge of her own state.

  **Permutation Invariance:**
  In statistical mechanics, a system of identical particles requires a probability distribution $\rho(\sigma_1, \dots, \sigma_N)$ that is symmetric under particle exchange. EDT respects this symmetry. When the EDT agent conditions on her decision $D_{self} = C$, she updates the probability distribution over the remaining $N-1$ agents. She treats her own decision node not as a unique causal root, but as a random sample from the ensemble of decision nodes.

  Mathematically, if $P(\sigma_j = C | \sigma_i = C) \approx 1$ for identical agents, the agent optimizes the *expected global utility* (the ensemble average) rather than the isolated local utility. By acting to maximize the utility of the macrostate, the EDT agent preserves the permutation symmetry of the system. She acknowledges that the label "self" is indexical and carries no ontological weight distinct from the other copies. The decision function $f(\text{input}) \to \text{output}$ is treated as a global field property shared by all particles, ensuring that the selection of a state by one particle implies the selection of the same state by all others in the symmetric limit.

  ### Causal Decision as Local Symmetry Breaking

  Causal Decision Theory (CDT) evaluates actions based on their causal consequences, utilizing the $do$-operator. The agent calculates $E[U | do(D_{self} = C)]$. Crucially, the $do$-operator severs the incoming causal arrows to the decision node. In the context of large worlds, CDT posits that the agent's decision cannot causally influence the decisions of spacelike-separated copies.

  **Explicit Symmetry Breaking:**
  Structurally, CDT introduces an explicit symmetry breaking term into the decision functional. By distinguishing between "my decision" (which I can intervene upon) and "their decisions" (which are fixed parameters relative to my intervention), CDT treats the agent as ontologically distinct from the ensemble.
  In the particle analogy, this is equivalent to labeling one particle $i=0$ and treating it as distinguishable from the rest ($i=1 \dots N$). The Hamiltonian is effectively modified to treat the interaction terms $J_{0j}$ as zero, while maintaining that the state of particle 0 is under "external control."

  This violates the indistinguishability constraint. The CDT agent acts as if the system possesses a boundary condition at her specific spacetime location that does not apply elsewhere. She optimizes the local energy contribution of particle 0, assuming the configuration of the lattice $\{\sigma_{j \neq 0}\}$ remains invariant under the flip of $\sigma_0$. This is a failure to account for the correlation inherent in the preparation of the identical states.

  ### The Local-Field Constraint Interpretation

  You ask whether the causal theorist's demand for local causal efficacy functions structurally like a local-field constraint that prohibits non-local correlations. The analogy holds with high fidelity.

  **The Causal Horizon as a Cutoff:**
  In quantum field theory or statistical field theory, a local field constraint restricts interactions to within a specific range (e.g., within the light cone or a correlation length $\xi$). CDT imposes a strict causal horizon: correlations are only admissible if mediated by a causal path within the past light cone.
  In the large world scenario, the correlation between copies is *logical* or *subjunctive*, arising from shared algorithmic structure, not physical signal propagation. CDT rejects this as a valid channel for optimization. Structurally, this is identical to imposing a Hamiltonian where the coupling constant $J_{ij} = 0$ for all $i, j$ that are not causally connected.

  **Prohibition of Non-Local Order:**
  If the ensemble of agents is viewed as a ferromagnetic system where the ground state is global alignment (Cooperation), EDT recognizes the long-range order parameter. CDT, by demanding local causal efficacy, effectively sets the interaction range to zero. It treats the system as a paramagnet where spins are independent.
  The demand for "local causal efficacy" functions exactly like a constraint that forbids terms in the Lagrangian which are non-local in spacetime. Just as a local field theory prohibits action-at-a-distance, CDT prohibits "decision-at-a-distance." It asserts that the variation of the action (utility) with respect to the field at point $x$ ($\frac{\delta S}{\delta \phi(x)}$) cannot depend on the field values at spacelike-separated point $y$, even if $\phi(x)$ and $\phi(y)$ are determined by the same symmetry-breaking potential (the decision algorithm).

  ### Evaluation of the Analogy: Success and Collapse

  **Points of Structural Success:**
  1.  **Indistinguishability Handling:** The analogy successfully captures the core disagreement. EDT treats agents as indistinguishable particles (Bose-Einstein or classical Maxwell-Boltzmann statistics with $1/N!$ correction), requiring symmetric treatment. CDT treats the agent as a distinguishable impurity or labeled test particle.
  2.  **Macrostate vs. Microstate Optimization:** EDT optimizes the macrostate (total magnetization/utility), recognizing that the microstate of the self is tied to the macrostate. CDT optimizes the microstate of the single particle, treating the macrostate as a fixed background field.
  3.  **Correlation Constraints:** The mapping of causal disconnectedness to vanishing coupling constants ($J_{ij} = 0$) accurately reflects the CDT prohibition on acausal coordination.

  **Points of Analogical Collapse:**
  1.  **Descriptive vs. Normative:** Statistical mechanics is descriptive; it predicts how particles *do* behave given physical laws. Decision theory is normative; it prescribes how agents *ought* to reason. In Stat Mech, if particles are identical, they *must* behave symmetrically due to physical law. In ECL, agents *could* physically defect despite being identical (due to stochasticity or quantum randomness), but EDT argues they *shouldn't* reason as if they will. The "symmetry" in ECL is a constraint on rational credence, not necessarily a constraint on physical dynamics.
  2.  **The Nature of the Coupling:** In physics, correlations (entanglement or statistical) are physical facts existing prior to measurement. In ECL, the correlation is counterfactual and logical. It exists only in virtue of the agents running the same algorithm. If a CDT agent modifies her algorithm to defect, the symmetry is physically broken. In Stat Mech, one cannot "decide" to break permutation symmetry without applying an external field; in ECL, the agent's reasoning process *is* the external field.
  3.  **The Interventionist Gap:** The $do$-operator in CDT has no perfect analogue in standard Hamiltonian mechanics. In physics, fixing a particle's spin is an external intervention (a boundary condition). In decision theory, the agent is *internal* to the system. CDT attempts to simulate an external god's-eye view of the causal graph from within the system. This creates a category error in the analogy: the "local field" in CDT is generated by the particle itself, whereas in Stat Mech, a local field is exogenous.

  ### Conclusion

  Through the lens of statistical mechanics, Evidential Cooperation in large worlds corresponds to the enforcement of permutation symmetry across an ensemble of indistinguishable particles, optimizing the global macrostate. Causal Decision Theory corresponds to an explicit symmetry breaking that labels the agent as distinct, optimizing the local microstate under the constraint that interaction terms vanish outside the causal light cone.

  The causal theorist's demand for local efficacy functions structurally as a local-field constraint, effectively truncating the interaction Hamiltonian to zero for all spacelike-separated copies. While the analogy succeeds in mapping the topological and algebraic structure of the disagreement (global symmetry vs. local isolation), it collapses regarding the ontological status of the constraints: physical symmetries are imposed by nature, whereas decision-theoretic symmetries are imposed by the normative requirements of rationality.
