answer: |-
  This is a sophisticated problem in the philosophy of model-based science, specifically concerning the limits of idealization in policy contexts. Your supervisor's track record is remarkably consistent, but it is not consistent with a single, simple heuristic like "predictive success" or "realistic assumptions."

  Based on the precedents you provided, here is the diagnosis of her methodological rule, the predicted verdict on your presentation, and the specific test case that would confirm her underlying philosophy.

  ### 1. Diagnosing the Rule

  You proposed three candidate rules. Here is how they stack up against her paper trail.

  **Candidate 1: Friedmanite Instrumentalism**
  *   **The Rule:** Assumptions are irrelevant; a model is valid if it predicts the target variable accurately within the intended domain.
  *   **Where it trips:** It cannot explain her **rejections**. Under Friedman, the *Unitary Household* model should be accepted for the child allowance question if it predicted labor supply accurately historically. The *Zero-Transaction* model should be accepted for writing allocation rules if it produced efficient outcomes. She rejects them despite potential predictive utility because the *assumptions themselves* are doing the work.
  *   **Verdict:** Discard. She is not a pure instrumentalist.

  **Candidate 2: De-idealization (Robustness)**
  *   **The Rule:** False assumptions are permissible only if the result survives relaxing the assumption toward the truth (the idealization is a harmless limiting case).
  *   **Where it trips:** It struggles with the **Profit-Maximization/Selection** case. Firms using markup rules are not a "limiting case" of profit maximizers; they are behaviorally distinct. She accepts this only because *selection* mimics the outcome. More importantly, this rule doesn't fully capture why the *Zero-Transaction* model is okay for a benchmark but not for allocation. The math doesn't change; the *use* changes.
  *   **Verdict:** Close, but insufficient. It misses the causal/functional dimension.

  **Candidate 3: The Causal Entanglement Constraint (Mechanism Requirement)**
  *   **The Rule:** False assumptions are permissible **unless the falsity is causally entangled with the specific policy variable or output being interrogated.** A model can use a false mechanism to predict an aggregate outcome driven by other forces (e.g., gravity dominates friction for the pendulum period; selection dominates behavior for industry churn). However, if the policy question targets a variable that the false assumption directly governs, the model is invalid.
  *   **Fit:**
      *   *Pendulum:* Friction is false, but doesn't drive the *period* primarily. (Pass)
      *   *Selection:* Profit max is false, but doesn't drive *churn* (selection does). (Pass)
      *   *Zero-Transaction Benchmark:* Falsity doesn't drive the *comparison*. (Pass)
      *   *Zero-Transaction Allocation:* Falsity *drives* the allocation outcome. (Fail)
      *   *Unitary Household:* Pooling is false, and the question (recipient of allowance) *directly tests* the pooling assumption. (Fail)
  *   **Verdict:** **This is her rule.** She tolerates false assumptions as long as they are "causally inert" regarding the specific question asked.

  ### 2. The Predicted Verdict

  She will issue a **split verdict**. She will authorize the model for the **Total Catch** number but forbid using it for the **Fleet Consolidation** claim.

  **Why?**
  *   **Total Catch (Approved):** This is the **Profit-Maximization/Selection** analogue. The model predicts aggregate extraction well. Even if the mechanism (perfect mobility) is false, the aggregate outcome is constrained by biological stock limits and total effort caps, which the model captures. The falsity of "perfect mobility" is causally inert regarding the *total volume* of fish removed, provided effort limits are binding.
  *   **Fleet Consolidation (Rejected):** This is the **Unitary Household** analogue. The question is about structural redistribution (who holds the quota). The Representative Vessel model predicts consolidation *because* it assumes costless mobility and perfect knowledge. The ABM shows that when you relax this assumption (sticky effort, social learning), the result flips. Therefore, the false assumption is **causally entangled** with the output. The fact that ITQs make the fleet *more* mobile does not save the model; just as a child allowance might make a household *more* cooperative, it does not validate the assumption that they *are* a unitary agent for the purpose of predicting intra-household distribution.

  **Closest Analogue:** The **Unitary Household Labor Supply** case.
  *   *In that case:* The assumption (pooling) was false. The policy (allowance recipient) varied the very thing the assumption governed (income control).
  *   *In your case:* The assumption (perfect mobility) is false. The policy (ITQs) varies the very thing the assumption governs (effort allocation/consolidation).
  *   *Her logic:* You cannot use a model that assumes away the friction to predict the consequences of reducing the friction, if the remaining friction is the dominant causal factor in the specific outcome (consolidation).

  ### 3. The Decisive Test Case

  You have access to a neighboring fishery with a decade of ITQ data, split between "thick trading" (market-like) and "thin trading" (customary/socially constrained) regions. This allows you to construct a "Crucial Experiment" to confirm she is running the **Causal Entanglement Constraint** rather than a soft De-idealization rule.

  **The Test:**
  Construct a retrospective validation using the neighboring fishery's data from the *first five years* of ITQ implementation.

  1.  **Run the Representative Vessel Model** calibrated to pre-ITQ data.
  2.  **Run the Agent-Based Model** (sticky effort) calibrated to pre-ITQ data.
  3.  **Compare predictions** against the *actual* consolidation patterns in the **Thin Trading** region vs. the **Thick Trading** region.

  **The Outcomes:**

  *   **Scenario A (She is a De-idealization/Robustness theorist):**
      *   She will accept the Representative Vessel model if it predicts the *average* consolidation across the whole fishery reasonably well, even if it fails in the Thin Trading region. She views the "perfect mobility" assumption as a valid average approximation.
      *   *Her signal:* "The model captures the central tendency of the reform."

  *   **Scenario B (She is a Causal Entanglement theorist — **Most Likely**):**
      *   She will reject the Representative Vessel model for policy scoring if it fails specifically in the **Thin Trading** region, *even if it succeeds in the Thick Trading region.*
      *   *Reasoning:* The policy question (consolidation) is sensitive to the friction. If the model cannot distinguish between a regime where customs persist (Thin) and where they dissolve (Thick), it is using the wrong mechanism. The fact that it works in the Thick region is akin to the Zero-Transaction model working in a lab setting but failing in allocation; it lacks the relevant causal texture for the *variable of interest*.
      *   *Her signal:* "The model's success in the Thick region is coincidental to the mechanism we need to understand. Since the policy risk lies in the persistence of custom (Thin region), a model that assumes custom away is invalid for scoring the risk."

  **How to present this to her:**
  Do not ask her "Which rule are you using?" Instead, present the neighboring fishery data thusly:

  > "In the neighboring fishery, the Representative Vessel model predicted 40% consolidation. Actual consolidation was 5% in the Thin Trading zone (where customs persisted) and 35% in the Thick Trading zone. The Agent-Based model predicted this divergence; the Representative model did not.
  >
  > If we use the Representative model for our council, we will predict 40% consolidation. If the ABM is right, we will face the political and economic shock of the Thin Trading zone (which is our majority).
  >
  > Given your ruling on the unitary household model—where the falsity of pooling mattered specifically for the distribution of the allowance—should we not treat the 'perfect mobility' assumption as similarly entangled with the consolidation question, despite the model's success on total catch?"

  If she agrees that the failure in the Thin Trading zone disqualifies the model for the consolidation question, she has confirmed the **Causal Entanglement Constraint**. You can then confidently tell the Council: *"We use Model A for the biological catch limit, but we must use Model B for the economic impact assessment."* This nuance will likely impress them more than a single, over-confident model.
