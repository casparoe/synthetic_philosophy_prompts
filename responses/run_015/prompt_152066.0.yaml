  The divide concerns bedrock intuitions about coherence versus consistency. For the actualist, mathematical existence is granted by formal consistency within an axiomatic system like ZFC. If the rules allow it, it exists. For the finitist, existence requires conceptual intelligibility or constructive potential. They are answering different questions under a single heading. The actualist asks, "What follows from these axioms?" while the finitist asks, "What is metaphysically possible?" Because these questions operate in different domains, no empirical fact or formal result can settle the debate. There are no hidden facts about the physical world that determine whether abstract objects are completed totalities. The "hidden fact" is modal: can a completed infinity exist without paradox? Actualists say yes (ZFC); finitists say no (potential infinity only).

