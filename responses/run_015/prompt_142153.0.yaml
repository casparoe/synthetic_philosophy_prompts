answer: |-
  You have identified the central fracture in refugee ethics: the conflation of **Status** (who is in danger) with **Allocation** (who must act). Your verdicts suggest you are operating with a hybrid view that combines a rights-based account of harm with a duty-based account of global justice.

  Here is the principle that best reconstructs your verdicts, followed by the analysis you requested.

  ### The Principle of Non-Substitutable Protection

  **A person has a claim to refugee status if and only if:**
  1.  **Deficit:** They face a severe deficit in basic rights (life, liberty, security, or *social membership*).
  2.  **Failure:** This deficit results from their home state's unwillingness or inability to protect them (including refusal to restrain private actors).
  3.  **Necessity:** Avoiding this deficit within their home region requires an *unreasonable sacrifice* (loss of livelihood, community, or dignity).
  4.  **Standing:** They are not morally culpable for the persecution (forfeiture) and have not manufactured the risk for the purpose of migration (good faith).

  **The duty to protect is collective. Specific states bear weight based on:**
  5.  **Capacity:** Ability to absorb without collapse.
  6.  **Causation:** Contribution to the crisis (war, climate, instability).
  7.  **Constraint:** The individual has a right to *protection*, but not to *choose the protecting state*, provided the state offers safe and dignified asylum.

  ---

  ### Mapping Your Cases to the Principle

  This principle separates the "two jobs" you noticed. Clauses 1–4 determine **Status** (the fact). Clauses 5–7 determine **Allocation** (the duty).

  *   **Case 1 (Extortion/Police):** Drives **Clause 2**. State refusal to protect = State failure, even if the aggressor is private.
  *   **Case 2 (Climate/Slow):** Drives **Clause 1 & 5**. It triggers a humanitarian duty (Deficit exists), but fails **Clause 3** (Necessity) or **Clause 2** (State Failure) in the specific *refugee* sense, distinguishing it from Case 14. It explains why you feel they are owed something, just not *this* specific status.
  *   **Case 3 (Private Violence):** Drives **Clause 2**. Confirms that state *inaction* is equivalent to state *action* for the purpose of protection failure.
  *   **Case 4 (Indiscriminate War):** Drives **Clause 1**. Severity of harm outweighs the need for specific targeting.
  *   **Case 5 (Economic Migrant):** Drives **Clause 1**. "Doing better" is not a "rights deficit."
  *   **Case 6 (Mixed/Drought + Minority):** Drives **Clause 1 & 3**. Validates the "adding up" intuition. If the sum creates an unreasonable sacrifice, the claim holds.
  *   **Case 7 (Sur Place/Good Faith):** Drives **Clause 4**. This is the "Good Faith" constraint. It explains why the cynical planner is out, and why the cynical convert (who manipulated the system) is also out, even if risk is now real. The system cannot reward manipulation of its own triggers.
  *   **Case 8 (Internal Flight):** Drives **Clause 3**. This is the critical clause. "Safety" is not just physical survival; it includes *social membership*. Losing language, livelihood, and community counts as an "unreasonable sacrifice." This overrides the standard legal "internal flight alternative."
  *   **Case 9 (Perpetrator):** Drives **Clause 4**. Introduces **Forfeiture**. You cannot claim protection from a harm you morally authored.
  *   **Case 10 (Child Born Here):** Drives **Distinct Principle**. This falls outside refugee status entirely. It is a "Best Interests of the Child" / Integration claim. Your principle correctly isolates this as a different category.
  *   **Case 11 (Rich vs. Neighbor):** Drives **Clause 5 & 7**. The rich country owes more duty (Capacity), but the individual cannot demand *that* specific country (Constraint).
  *   **Case 12 (Forum Shopping):** Drives **Clause 7**. Weakens the claim because it violates the "Allocation" fairness. If the right is to *somewhere*, choosing *here* for benefits undermines the distributive justice of the system.
  *   **Case 13 (Causal Responsibility):** Drives **Clause 6**. Explains why the arming country has a *greater duty*, without granting the individual a *stronger right*.
  *   **Case 14 (Mass Displacement):** Drives **Clause 1 & 5**. Acknowledges that when the Deficit is systemic, the remedy may be systemic (aid, peacekeeping) rather than individual admission. Admission is one way to discharge the duty, not the only way.
  *   **Case 15 (Private Sponsorship):** Drives **Clause 5**. Private actors can share the *cost*, but the State retains the *duty* of oversight and guarantee.

  ---

  ### Where the Principle Overturns Your Verdicts

  To have a principle is to accept that it will sometimes rule against your intuition. Here are three points of friction:

  **1. The Cynical Convert (Case 7, Third Man)**
  *   **Your Verdict:** No.
  *   **Principle's Verdict:** **No.** (Matches you).
  *   **The Friction:** However, the principle forces a hard line on *why*. If the risk is genuinely lethal upon return, standard human rights law (non-refoulement) says you cannot send him back. My principle prioritizes **Systemic Integrity (Clause 4)** over **Individual Risk** in this specific instance of manipulation.
  *   **The Price:** You must accept that this man might be returned to torture to prevent the asylum system from becoming a gameable resource. If you cannot accept that, you must drop Clause 4's "Good Faith" requirement for those already in danger, which weakens the principle's ability to distinguish refugees from migrants.

  **2. The Internal Flight (Case 8)**
  *   **Your Verdict:** Counts (despite safe capital).
  *   **Principle's Verdict:** **Counts.** (Matches you).
  *   **The Friction:** This is a expansive reading of "Protection." Most legal frameworks define protection as *safety from death/torture*. By including "social membership" (livelihood, language) in **Clause 3**, this principle significantly expands the refugee class.
  *   **The Price:** You must accept that a person who can physically survive in their home country but cannot *live a meaningful life* there is equivalent to a person who will be killed. This blurs the line between refugee and economic migrant (Case 5) more than you might be comfortable with when the "livelihood" loss is financial rather than social.

  **3. The Queue Jumper vs. The Camp Waiter**
  *   **Your Verdict:** (Implied preference for the arrival).
  *   **Principle's Verdict:** **Equal Status, Lower Priority.**
  *   **The Friction:** Under **Clause 7**, a person who arrives spontaneously (Case 12) has a weaker claim to *this specific country* than one processed through a UNHCR camp, because the former disrupts fair Allocation.
  *   **The Price:** You must accept that preserving the fairness of the global system (so neighbors don't collapse) sometimes means rejecting a genuine refugee at the border in favor of one waiting in a camp, even if the one at the border is more desperate *now*.

  ---

  ### New Cases: The Price of the Principle

  Here are three cases generated by applying this principle strictly.

  **Uncomfortable Case 1: The "Climate-Persecution" Hybrid**
  *   **Scenario:** A government deliberately diverts water away from a minority region to starve them out, citing "drought management."
  *   **Principle Verdict:** **Counts.**
  *   **Why Uncomfortable:** This forces you to treat climate adaptation as a persecution issue. It implies the solution is not just carbon reduction or aid, but *asylum*. It collapses the distinction between Case 2 (Climate) and Case 1 (Persecution). If you accept this, the number of "refugees" globally explodes, potentially overwhelming the system you want to protect.

  **Uncomfortable Case 2: The "Safe Third Country" Return**
  *   **Scenario:** A refugee arrives in your rich country but passed through a "safe" middle-income country that treats refugees legally but with significant social prejudice and no path to citizenship.
  *   **Principle Verdict:** **Return them.**
  *   **Why Uncomfortable:** Under **Clause 3**, if their basic rights are secure (no torture, work allowed), the "social membership" deficit is not high enough to justify long-distance migration when a closer option exists. You must send them back to a place where they will be second-class citizens, because "second-class" is not "persecuted." This feels cold to the intuition of "making a life."

  **Case Where You Will Reject the Principle: The "Repentant Torturer"**
  *   **Scenario:** A low-level enforcer from a brutal regime flees. The new regime will execute him summarily (no trial). He claims he was just following orders and is now terrified.
  *   **Principle Verdict:** **No Claim (Forfeiture).**
  *   **Why You Might Reject:** Even if he forfeited the *refugee* claim under **Clause 4**, your Case 9 intuition relied on him being a *former intelligence officer* (high culpability). If this man was a conscripted guard threatened with death if he didn't comply, **Clause 4** might still block him if the principle defines "culpability" broadly to protect the system's moral standing.
  *   **The Conflict:** If you feel he should not be returned to summary execution *regardless* of his past, then **Clause 4 (Forfeiture)** is wrong. You are holding a pure *Risk View* (what will happen to him?) rather than a *Moral View* (what does he deserve?). You cannot have both. If you save him, you weaken the "Forfeiture" clause for Case 9.

  ### Summary of the Trade-Off

  Your friend's principle (State Failure + Capacity + Causation) is cleaner on **Allocation** but fails on **Status** (it can't explain why Case 8 counts or why Case 7's cynicism matters).

  Your "Protection-Deficit" view is better on **Status** but fails on **Allocation** (it can't explain Case 11 or 14).

  **The Principle of Non-Substitutable Protection** bridges them by asserting:
  1.  **Refugee Status** is about **Moral Agency** (protecting those who cannot protect themselves without losing their life's context).
  2.  **Asylum Allocation** is about **Global Justice** (distributing the burden fairly, not satisfying individual preference).

  **The Price:** You must accept that some people in danger will not get to choose where they are safe, and some people who are safe enough to survive will be counted as refugees if survival means losing their humanity. You have to decide if "social membership" is a basic right on par with "physical safety." Your verdict on Case 8 says yes. The principle holds you to that.
