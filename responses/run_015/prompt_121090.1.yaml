      *   Section 2: Artificial vs. Natural. The "Breeder" objection. You are the environment.
      *   Section 3: Fidelity and Churn. The Error Catastrophe risk.
      *   Section 4: Quality as Multi-Level Selection.
      *   Section 5: Underdetermination (Attractors vs. Memes).
      *   Section 6: The Counterfactual (What to build if Memes are real agents).
      *   Conclusion: Synthesis.

      *(Self-Correction during drafting)*: Make sure to address the friend's specific claim: "Meme is just a grand word for a thing that caught on." I need to explain what would make it *more* than that. The "more" is the *causal power* of the variant independent of human intent.

      *(Refining the "Quality Override")*: Is it a contradiction? No, it's a constraint. Like gravity. But if it contradicts user attention, it creates a tension between "User Fitness" and "Platform Fitness."

      *(Refining the "What to build differently")*: If memes are agents, they might hide. You'd need to detect *replication* of ideas across videos, not just performance of specific video files. You'd need to track the *idea*, not the *asset*.

  7.  **Final Review against constraints:** The user asked specific questions. Ensure each is answered.
      *   Implicit theory? (Evolutionary Algorithm).
