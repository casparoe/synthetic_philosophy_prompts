answer: |-
  **Project Title:** Defeat-Dependent Legitimation: A Conceptual Audit of Lost-Cause Mythologies
  **Duration:** 6 Months | **Personnel:** 1 (Principal Investigator)

  **The Core Question**
  Is "Defeat-Dependent Legitimation" (DDL) a unified mechanism, or is it bifurcated into two distinct logical operations: (1) defeat demonstrating nobility (martyrdom/heroism) and (2) defeat dissolving responsibility (immunization from accountability)? Furthermore, does this bifurcation explain the divergence in political outcomes where some lost causes become unifying national myths (Dunkirk, Masada) while others remain politically toxic (Confederacy, Kosovo)?

  **The Gap in Existing Work**
  It is **settled** within memory studies and political science that national myths shape policy and that lost causes are frequently memorialized. It is **contested**, however, *how* the moral valence of these myths is determined. Current literature tends to treat the historical content of the cause and the narrative structure of its defeat as a single entangled variable. Historians explain the myth by detailing the history; sociologists explain it by detailing the reception. Neither isolates the conceptual machinery that allows a military or political failure to convert into moral capital. This project separates the *logic of the myth* from the *facts of the history* to determine if the structure of the defeat itself dictates the legacy.

  **Philosophical Method**
  This is not a historical recovery project but a conceptual isolation project. I will treat the four cases (Confederacy, Masada, Kosovo, Dunkirk) not as archival deep-dives, but as controlled variables for philosophical analysis.
  1.  **Variable Isolation:** I will analyze canonical commemorative texts (speeches, monuments, curricula) to identify whether the justification for remembrance relies on *agency* (we chose to die well) or *finality* (we lost, so we can no longer harm).
  2.  **Structural Comparison:** I will map whether "nobility" and "responsibility dissolution" co-occur or appear independently across the cases.
  3.  **Outcome Correlation:** I will test if the presence of "responsibility dissolution" correlates with lower contemporary political toxicity, independent of the original cause's ideology.

  **Deliverable**
  A policy-ready framework titled **The Commemorative Risk Matrix**. Rather than a monograph, the output will be a diagnostic tool for foundation program officers, educators, and memorial planners. It will offer a heuristic for assessing whether a proposed commemoration of a lost cause is likely to foster social cohesion (unifying myth) or renewed conflict (toxic myth) based on the narrative structure of the defeat being highlighted.

  **Honest Failure Condition**
  The project fails if DDL proves to be merely descriptive post-hoc rationalization with no predictive power. If the "nobility" vs. "responsibility" distinction collapses under analysis (i.e., they are always present together or never present together), or if the political toxicity of a myth is shown to be entirely dependent on external factors (e.g., current demographics, economic stress) rather than the internal logic of the myth, then DDL is wordplay, not machinery. In this scenario, the deliverable will be a negative report warning against structural explanations for memory politics.

  **Scope and Feasibility Check**
  Six months solo is tight for four cases. To remain realistic:
  *   **Constraint:** I will not engage in primary historical research. I will rely on established secondary literature regarding the *memory* of these events, not the events themselves.
  *   **Focus:** The analysis is limited to the *argumentative structure* of the myths, not their historical accuracy.
  *   **Timeline:** Months 1-2: Literature synthesis and variable definition. Months 3-4: Case application and mapping. Month 5: Drafting the Matrix. Month 6: Review and refinement.
  *   **Risk:** If the Kosovo or Confederate cases require navigating highly polarized contemporary literature, analysis time may double. I will cap the source material per case to ensure completion.

  **Status of Claims**
  *   **Consensus:** Myths operate politically; lost causes are memorialized; the Confederacy is currently toxic while Dunkirk is not.
  *   **Contested:** Why this divergence exists. Whether the *mode of defeat* is a causal factor in moral legitimation. Whether "responsibility dissolution" is a coherent philosophical concept or a rhetorical sleight of hand. This project addresses only the contested elements.
