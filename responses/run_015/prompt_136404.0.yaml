answer: |-
  ### 1. Exam Question

  **Course:** PHIL 450 – Advanced Practical Ethics
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay format. Do not rehearse the standard "shallow pond" analogy, arguments regarding physical proximity, or the general Effective Altruism conclusion regarding marginal utility. Your grade depends on your engagement with the structural architecture of moral obligation.

  **Prompt:**
  Peter Singer's argument in "Famine, Affluence, and Morality" is often interpreted as establishing a duty to prevent bad occurrences when one can do so without sacrificing anything of comparable moral importance. However, this interpretation obscures a critical structural assumption regarding the *architecture* of rescue duties: specifically, whether obligations are **continuously scalable** (where moral requirement varies proportionally with cost and efficacy) or **binary/threshold-based** (where a duty activates fully upon meeting a condition and collapses otherwise).

  Analyze Singer's framework through this structural lens. First, identify the hidden continuity assumption required for Singer's marginal utility principle to function as a general guide rather than a discrete trigger. Second, apply this distinction to a modified probabilistic case: suppose saving the drowning child requires an intervention with only a 60% success rate, costing the agent $5,000. Determine whether the intuition that we must act survives when modeled as an expected-value decision under risk. Finally, defend either the scalar or binary model of obligation. Your defense must include one concrete counterexample demonstrating why the opposing model fails to account for moral rationality in risk-weighted contexts. Does the probabilistic variant undermine or reinforce Singer's claim that rescue obligations are scalable?

  ***

  ### 2. Model Answer

  Singer's "Famine, Affluence, and Morality" is frequently reduced to a conclusion about donation levels, but its philosophical engine relies on a specific structural assumption: that moral obligation is continuously scalable. The standard reading suggests a binary trigger—one either *can* save the child or one *cannot*. However, for Singer's marginal utility principle to avoid arbitrariness, it must treat obligation as a function $f(cost, efficacy)$, rather than a step-function. If the duty were binary, a $1 increase in cost could theoretically extinguish a massive obligation, creating a moral cliff-edge inconsistent with the gradual nature of resource depletion. Singer implicitly assumes scalability because he argues we must give until the *marginal* utility of our resources equals the utility of relief, implying a continuous trade-off rather than a discrete on/off switch.

  When we introduce risk into this architecture, the structural distinction becomes decisive. Consider the probabilistic variant: saving the child costs $5,000 but has only a 60% success rate. A binary model struggles here. If the duty requires *guaranteed* rescue, the obligation vanishes because 60% < 100%. If the duty activates merely upon *attempt*, the cost-benefit analysis is ignored. Conversely, a scalar model integrates this seamlessly via Expected Value (EV). If the value of the child's life is $V$, the moral weight of the intervention is $0.6V$. If the moral cost of $5,000 is less than $0.6V$, the obligation holds. The intuition that we must act survives this modeling only if we accept that moral duties scale with probability. We are not obligated to guarantee survival, but to maximize expected survival weighted by cost. This suggests that rescue duties are not about outcomes *per se*, but about the expected moral value of the action.

  This probabilistic analysis reinforces Singer's scalability claim and exposes the fatal flaw in the binary model. The binary model fails in cases of **joint necessity under uncertainty**. Imagine two rescuers, each capable of contributing 50% toward the 60% probability threshold required to save the child (e.g., two parts of a machine). Under a binary view, neither rescuer has a duty because neither individually guarantees the save (0% success alone). Consequently, the child dies, and both agents are absolved. This is morally absurd. A scalar model, however, assigns each agent an obligation proportional to their marginal contribution to the EV. Each rescuer is obligated to contribute because their $5,000 increases the EV by 0.3V.

  Therefore, the probabilistic variant undermines the binary threshold model and reinforces the scalar architecture. The binary model collapses under risk because it cannot aggregate partial contributions from multiple agents or account for probabilistic efficacy without creating moral loopholes. It confuses the *satisfaction condition* of a duty (saving the life) with the *action-guidance* of the duty (maximizing expected value). Singer's framework requires the latter. If we accept that we must save the child in the 60% case, we admit that obligation tracks expected value, not certainty. This confirms that rescue duties are continuously scalable with both cost and probability. To argue otherwise is to privilege certainty over value, which violates the consequentialist core of Singer's argument. Thus, the architecture of rescue is not a switch, but a dial; risk does not negate the duty, it merely adjusts the setting.

  *(Word Count: 698 words)*

  ***

  ### 3. Marking Scheme (Total: 25 Points)

  **A Grade (20–25 Points): Structural Mastery**
  *   **Identification of Continuity Assumption (5 pts):** Explicitly identifies that Singer's marginal utility principle relies on obligation being a continuous function of cost/efficacy, not a discrete trigger.
  *   **Probabilistic/EV Analysis (5 pts):** Correctly models the 60% case using Expected Value. Determines that the intuition survives *only* if obligation scales with probability.
  *   **Defended Position + Counterexample (5 pts):** Defends either Scalar or Binary (Scalar preferred for coherence with Singer) AND provides a concrete counterexample to the opposing view (e.g., the "Joint Necessity" or "Two Rescuers" case).
  *   **Clarity & Argument Flow (5 pts):** Essay is logically structured, avoids prohibited tropes (proximity/shallow pond), and maintains graduate-level precision.

  **B Grade (15–19 Points): Competent Summary, Structural Miss**
  *   Accurately summarizes Singer's general view and the drowning child scenario.
  *   Discusses the 60% case but fails to link it to the *architecture* of obligation (scalar vs. binary).
  *   Treats the probability issue as a standard epistemic problem rather than a structural one regarding duty scaling.
  *   Lacks a concrete counterexample to the opposing structural model.

  **C Grade (10–14 Points): Surface Level**
  *   Rehearses standard Effective Altruism conclusions (give until it hurts).
  *   Discusses proximity or the physical nature of the pond (violates prompt constraints).
  *   Fails to engage with the scalability vs. threshold distinction.

  **Specific Conceptual Penalty (-5 Points):**
  *   **Error:** Confusing risk-weighted expected value with linear obligation scaling.
  *   **Definition:** If the student argues that because the success rate is 60%, the *financial* obligation must be reduced by exactly 40% (linear mapping of probability to cost cap) without justifying the moral weight of the remaining risk, OR if they treat the EV calculation as negating the duty rather than scaling it.
  *   **Application:** Deduct 5 points from the final score if the student claims that a 60% success rate reduces the *moral requirement* to 60% of an action rather than assessing the action's total EV against the cost. (Note: This is distinct from arguing the duty scales; it is a mathematical category error regarding how risk modifies the *object* of the duty).

  **Fail (0–9 Points):**
  *   Does not address the prompt.
  *   Fundamental misunderstanding of Singer's argument.
  *   Plagiarism or non-submission.
