  **OAKHAVEN ASSISTED LIVING | CLINICAL DATA SERVICES**
  **DOCUMENT TYPE:** MONTHLY ESTIMATED REWARD PROFILE (ERP)
  **RESIDENT:** VANCE, ARTHUR (ID: 89402)
  **REPORTING PERIOD:** DECEMBER 2023
  **CLEARANCE:** FAMILY COUNCIL / CARE STAFF LEVEL 2

  **1.0 METHODS AND OPERATIONALIZATION**
  The Preference Inference Module (PIM-v4.2) models the resident as a Boltzmann-rational agent operating within the facility's Markov Decision Process. Action selection probability is assumed to be proportional to the exponentiated expected value of the resulting state, scaled by a fitted temperature parameter $\tau$. Reward weights were estimated via maximum likelihood estimation on logged trajectories of resident movement and consumption. To ensure identifiability across the solution space of reward functions consistent with observed behavior, a maximum entropy prior was applied during regularization.¹ The resulting weights represent the resident's latent valuation of environmental features.

  **2.0 ESTIMATED REWARD WEIGHTS**
  The following table lists the fitted coefficients for the linear reward function $R(s) = w^T \phi(s)$. Confidence intervals reflect parameter uncertainty given the logged trajectory count ($N=1,402$).

  | Feature Category | Estimated Weight ($\hat{w}$) | 95% Confidence Interval |
  | :--- | :--- | :--- |
  | Sedentary Entertainment (TV/Radio) | +1.42 | [1.38, 1.46] |
  | Caloric Density (Snacks/Beverages) | +0.85 | [0.80, 0.90] |
  | Staff-Directed Hygiene Events | +0.12 | [0.05, 0.19] |
  | Common Room Socialization | +0.34 | [0.29, 0.39] |
  | Outdoor Access (Garden/Patio) | 0.00 | [0.00, 0.00] |
  | Private Residence Access | 0.00 | [0.00, 0.00] |
  | Spousal Interaction (M. Vance) | 0.00 | [0.00, 0.00] |

  **3.0 HYPERPARAMETERS AND DERIVED TRAITS**
  **Inverse Temperature ($\beta$):** 2.22. Indicates high choice consistency relative to expected value.
  **Discount Factor ($\gamma$):** 0.92. Interpreted as Temporal Preference Horizon. Suggests a prioritization of immediate reward accrual over long-term state optimization.²
  **Additive Constant:** Set to 0.00 for normalization.³

  **4.0 DATA INTEGRITY AND EXCLUSIONS**
  Data from the period 10/15/23–11/26/23 was excluded due to post-fall mobility restrictions. The model assumes reward stability across physiological states; therefore, preferences expressed during recovery are treated as anomalies rather than state-dependent shifts. Unstructured vocalizations (e.g., verbal requests, declarative statements) were excluded from the loss function as non-actionable noise.⁴

  **5.0 VALIDATION AND WELLBEING METRICS**
  Cross-resident validation was performed against Profile 89405 (Unit 4B). The cosine similarity between weight vectors is 0.87, indicating robust feature extraction and consistent environmental affordances. Based on the normalized reward baseline, the resident's projected Monthly Wellbeing Score is 14.2/100. This score reflects the absolute magnitude of accrued reward relative to the zero-baseline.

  **6.0 RECOMMENDATIONS FOR CARE PLANNING**
  Staff are advised to align daily offerings with the high-weight features identified in Section 2.0. Querying the resident regarding low-weight features (e.g., outdoor access) is deprecated, as offering options with negligible estimated value introduces decision noise and reduces aggregate wellbeing scores. The Family Council is requested to approve this profile for use in Q1 care planning.⁵

  ***

  **FOOTNOTES**
  ¹ *Ziebart et al. (2008).* This prior selects the smoothest distribution over paths consistent with the data. It does not imply the resident maximizes entropy, only that the estimator does.
  ² While $\gamma$ technically models planning horizon, in constrained environments it correlates strongly with compliance rates.
  ³ Reward functions are unique only up to an affine transformation. The zero-point is arbitrary; however, the Wellbeing Score requires a fixed origin for reporting.
  ⁴ See Appendix B for excluded vocalizations: *"I want to go home," "Where is Martha?", "Is it Tuesday?"* These were classified as unstructured output lacking corresponding action vectors.
  ⁵ Profile validity is strictly bounded by the state-space of the Oakhaven Facility. Weights may not generalize to environments containing features assigned zero weight due to absence in training data.
