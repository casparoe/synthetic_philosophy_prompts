answer: |-
  This is a classic problem in political philosophy and ethics, often framed as the tension between *partiality* (special duties to those near/us) and *impartiality* (universal moral equality). Since you are the "returnee," you occupy a unique blind spot in most localist theories: you are culturally local but functionally an outsider.

  To build a theory of special obligations that doesn't collapse under scrutiny, you need a specification that defines the **source**, **scope**, and **limits** of the obligation. Here is the full spec, the stress tests, and the single requirement that breaks the "locals first" heuristic.

  ### I. The Core Specification
  A robust theory of special obligation cannot rely on a single metric (like blood or address). It must be a weighted function of four variables. If a theory ignores one, it fails an edge case.

  1.  **Membership (The Boundary):** How is the circle drawn?
      *   *Options:* Birth, citizenship, continuous residence, tax contribution, cultural assimilation.
      *   *Requirement:* The theory must define if membership is binary (in/out) or scalar (degrees of belonging).
  2.  **Reciprocity (The Exchange):** What is the obligation based on?
      *   *Options:* Past contribution (what you put in), future stability (what keeps the system running), or mutual insurance (we protect each other).
      *   *Requirement:* The theory must account for those who *cannot* contribute (children, disabled) but still claim priority.
  3.  **Agency (The Choice):** Did the parties choose this relationship?
      *   *Options:* Locals didn't choose the outsiders; outsiders chose to move here.
      *   *Requirement:* The theory must handle involuntary migration (refugees/climate) where "choice" is nullified.
  4.  **Efficiency (The Function):** Does prioritizing locals actually help them, or does it rot the system?
      *   *Options:* Protectionism vs. Growth.
      *   *Requirement:* The theory must prove that excluding outsiders doesn't degrade the very goods (jobs/housing) locals want to protect.

  ### II. The Edge-Case Stress Test
  Here is where popular "locals first" theories break. A valid theory must resolve these without contradiction.

  **1. The Returnee (You)**
  *   *The Conflict:* You have cultural membership but broke continuous residence.
  *   *The Break:* If the theory is based on *continuous presence*, you are an outsider. If it is based on *origin*, you are a local.
  *   *The Fix:* A robust theory must treat membership as **scalar**. You have higher weight than a stranger, but perhaps lower weight than someone who never left. If the theory is binary, it arbitrarily excludes you despite your social capital.

  **2. Dual Citizens**
  *   *The Conflict:* They have legal status in two places. Do they get double priority? Half priority?
  *   *The Break:* Nationalist theories collapse here. If obligations are based on "one people, one state," dual citizens expose that the bond is legal, not moral.
  *   *The Fix:* Obligations must be tied to **current reliance**, not just passport status. If they live elsewhere, their claim on local housing is weak regardless of citizenship.

  **3. Stateless People**
  *   *The Conflict:* They have no "compatriots" by definition.
  *   *The Break:* Any theory based on *citizenship* renders stateless people invisible. They fall into a moral void where no one has a special obligation to them, only a general human one.
  *   *The Fix:* The theory must acknowledge that **jurisdiction creates obligation**. If the stateless person is physically present and under the law's authority, the "local" obligation triggers regardless of status.

  **4. Digital Nomads (High Tax, Low Integration)**
  *   *The Conflict:* They fund the infrastructure but don't participate in the community life.
  *   *The Break:* If obligation is based on *tax contribution*, the nomad gets priority over a poor local. If based on *community*, they get none.
  *   *The Fix:* Distinguish between **claiming resources** (housing/jobs) and **influencing policy**. High taxpayers buy infrastructure maintenance, not priority access to scarce social goods reserved for community members.

  **5. Climate Migrants (High Need, No Status)**
  *   *The Conflict:* They are arriving out of necessity, not choice.
  *   *The Break:* "Charity begins at home" assumes the outsider had a choice to stay away. Climate migrants break the *Agency* variable.
  *   *The Fix:* The theory must prioritize **urgency of need** over **duration of residence** when the need is existential.

  ### III. The Critical Distinction: Status vs. Weight
  Most arguments fail because they blur **Status** (are you in the group?) with **Weight** (how much do we owe you?).

  *   **Status** is often treated as binary (Local vs. Outsider). This is where racism and xenophobia hide. It creates a caste system.
  *   **Weight** is scalar. It allows for a gradient of obligation.

  **The Rule:** A theory cannot grant *absolute* priority based on status alone. It can only grant *weighted* priority.
  *   *Example:* A local might get a tie-breaker on a job if qualifications are equal (Weight). They should not get the job if they are unqualified and the outsider is expert (Status overruling merit).
  *   *Why it matters:* If you blur this, you incentivize locals to lower their own standards to maintain privilege, which eventually collapses the local economy, hurting the locals you meant to protect.

  ### IV. The Single Requirement That Knocks Out "Charity Begins At Home"
  There is one constraint that, if included in the spec, renders most "locals first" arguments invalid for essential goods (housing, survival, basic healthcare).

  **The Non-Derogable Minimum (The Floor)**

  *   **The Requirement:** Special obligations to compatriots/locals are only permissible **above a baseline of universal human need.**
  *   **How it works:**
      *   If the competition is for a *surplus* good (a specific nice job, a specific apartment in a non-crisis market), locals can claim priority.
      *   If the competition is for a *subsistence* good (shelter during a freeze, food, emergency care), the outsider's need overrides the local's status.
  *   **Why it breaks the argument:**
      *   "Charity begins at home" relies on the idea that the local's interest *always* outweighs the outsider's interest.
      *   The **Floor** dictates that once an outsider hits a threshold of desperation, they exit the category of "competitor" and enter the category of "human right."
      *   You cannot favor your neighbor's *comfort* over a stranger's *survival*.

  ### V. Where Popular Versions Collapse
  Here is the diagnostic for the arguments you are hearing in your hometown:

  1.  **The "Taxpayer" Argument:** *"We paid for this, so we get it."*
      *   **Collapse:** Ignores inheritance and public goods. Roads and schools are funded by past taxpayers too, many of whom are dead or moved away. It also excludes children and the unemployed who are still owed protection.
  2.  **The "Culture" Argument:** *"They don't fit in."*
      *   **Collapse:** Subjective and exclusionary. By this metric, *you* (the returnee) might not fit in anymore. It creates a purity spiral where the definition of "local" shrinks until no one qualifies.
  3.  **The "Stability" Argument:** *"Too many outsiders ruins the community."*
      *   **Collapse:** Often empirically false. Housing shortages are usually caused by under-building, not immigration. Prioritizing locals for existing housing doesn't create more housing; it just rationing scarcity unfairly.

  ### VI. Application to Your Situation
  You are the test case for your hometown's theory.

  *   If they say **"You left, you lost your spot,"** they are arguing for *Continuous Residence*. They must then apply this to everyone (e.g., soldiers, students, seasonal workers).
  *   If they say **"You're one of us, but *they* aren't,"** they are arguing for *Cultural Origin*. They must then explain why a 20-year resident immigrant is less "local" than you, despite contributing more recently.
  *   If they say **"We need to look after our own first,"** ask them to define the **Floor**. Are they fighting for *survival* or *preference*?
      *   If it's **Preference** (keeping wages high, keeping house prices accessible for second homes): Their argument is economic protectionism, not moral obligation.
      *   If it's **Survival** (homelessness rates): Then the *Non-Derogable Minimum* applies, and outsiders in crisis must be housed before locals who are merely inconvenienced.

  **Summary:** A valid theory of special obligation must be **scalar** (degrees of belonging), **functional** (doesn't destroy the economy), and **bounded** (cannot violate the survival baseline of outsiders). Any argument that demands absolute priority for locals regardless of the outsider's need level is not a moral theory; it is a protection racket.
