answer: |-
  You are right to insist that we stop treating the demarcation problem as a semantic game and start treating it as an engineering constraint. When a school board decides whether to fund a curriculum or a judge decides whether to admit expert testimony, they are not asking about the metaphysical status of truth; they are asking about reliability and institutional integrity. Therefore, the desiderata for a demarcation criterion must be functional rather than purely logical. The first non-negotiable requirement is that the criterion must evaluate practices and communities rather than static theories. This is motivated by the asymmetry you noted, where a community can persistently do unscientific work within a formally scientific theory, and conversely, where productive inquiry occurs under theories that are not strictly falsifiable in isolation. If we judge only the logical form of a proposition, we might exclude evolutionary psychology because some claims are hard to test, while including forensic bite-mark analysis because it mimics the language of measurement. By shifting the unit of analysis to the research program or the community behavior, we capture the dynamic process of error correction. A theory is not science; the activity of testing, refining, and abandoning that theory is science. This requirement is non-negotiable because any criterion that focuses solely on the proposition will fail to distinguish between a dormant scientific theory and an active pseudoscientific one.

  The second requirement is that the criterion must be historically tolerant of anomalies. You raised the tension between demanding falsifiability and not condemning historical science, specifically noting Newtonian mechanics. This tension is a genuine joint-unsatisfiability result only if we insist on naive falsificationism, but it can be dissolved if we recognize that science progresses through problem shifts rather than instant refutation. A viable criterion must allow a research program to persist through a period of negative evidence provided there is a progressive trajectory of novel predictions or explanatory power. If a criterion retroactively expels Newtonian mechanics from the category of science because it accumulated anomalies before Einstein, that criterion is useless for guiding future policy. Therefore, the desideratum is that the criterion must distinguish between a temporary protective belt of auxiliary hypotheses and a degenerative shift where anomalies are ignored or explained away without new content. This is non-negotiable because a criterion that cannot accommodate the actual history of successful science will lack the authority to guide future practice.

  The third requirement addresses the statistical corner. Modern empirical science rarely faces a single observation that refutes anything, since auxiliary hypotheses and error models absorb anomalies as a matter of routine. If a criterion requires crisp falsifiability, it excludes most of modern science, so the criterion needs revision. We must demand not that a theory be logically incompatible with an observation, but that the community employs rigorous statistical standards for handling uncertainty and error. The criterion must require that deviations are accounted for through explicit error models rather than informal ad hoc adjustments. This means the demarcation line is not about whether a theory can be falsified in principle, but whether the practitioners have a institutionalized method for quantifying the risk of being wrong. This is non-negotiable because ignoring the statistical nature of modern data would render the criterion applicable only to nineteenth-century physics, leaving us helpless against modern pseudosciences that misuse statistics to mimic rigor.

  The fourth requirement concerns usability. We must decide whether the criterion is for philosophers or for school boards. Given the purpose you outlined, the criterion must be usable by non-experts, but this does not mean it must be simple. It means the markers of science must be institutional and procedural rather than technical. A judge cannot evaluate the string theory landscape, but they can evaluate whether the proponents publish in peer-reviewed journals, whether they disclose conflicts of interest, and whether they attempt to replicate their findings. Therefore, the desideratum is that the criterion must rely on observable behaviors of the community rather than deep technical verification of the claims. This is a non-negotiable constraint of the context; if the criterion requires a PhD in physics to apply, it fails its purpose in a legal or educational setting. However, we must be careful not to confuse this with the prejudice that science is merely a social consensus. The non-negotiable core is transparency and accountability, while the prejudice to avoid is the idea that any community that calls itself science should be trusted without external audit.

  There is a distinction to be made between these non-negotiable requirements and the prejudices of one camp dressed up as demands of reason. For instance, requiring that all scientific explanations be materialistic is a prejudice; it excludes valid inquiries into information or structure that might not fit a narrow ontological box. Similarly, requiring that all science be reductionist is a prejudice that would exclude ecology or sociology. The non-negotiable requirements are about the relationship between evidence and belief, specifically the willingness to revise belief in the face of contrary evidence. The prejudices are about what kinds of entities are allowed to exist in the theory. We must ensure the demarcation criterion polices the method of justification, not the content of the ontology. This is crucial for public policy because the state should not be in the business of deciding what exists, only what counts as a reliable method for finding out what exists.

  If I must identify the single requirement on this list that does the most work excluding candidate criteria, it is the constraint on ad hoc immunization. While falsifiability is the famous slogan, it is the prohibition against systematically protecting a core claim from refutation by adding untestable auxiliaries that actually filters out pseudoscience. Falsifiability alone is too easy to game; one can always claim a theory is falsifiable in principle while ensuring it is never falsified in practice. The requirement that a research program must produce novel predictions rather than merely accommodating existing data through post-hoc adjustments is the heavy lifter. It excludes Freudian psychoanalysis and Marxist history not because they are meaningless, but because they are degenerative; they explain everything after the fact and predict nothing new. This requirement does the most work because it targets the behavior of the scientists rather than the logic of the theory, aligning with our first desideratum, and it handles the statistical corner by demanding that error models be established before data collection, not adjusted after.

  Finally, we can briefly score the three major frameworks against these desiderata. Strict falsificationism fails the historical tolerance test and the statistical corner; it condemns Newton and cannot handle probabilistic evidence, making it unsuitable for regulatory use. Lakatos's picture of research programs with a hard core and protective belt performs much better. It satisfies the requirement to evaluate practices over theories and handles the anomaly problem by distinguishing between progressive and degenerative shifts. It aligns well with the constraint on ad hoc immunization, though it can be difficult for non-experts to apply without clear markers of what counts as novel prediction. A Kuhnian appeal to puzzle-solving normal science is useful for describing how science works internally but fails as a demarcation criterion for public policy because it relies on the existence of a paradigm, which pseudosciences often claim to have. Kuhn helps us understand the community aspect, but without the Lakatosian constraint on progress, it risks validating any coherent community regardless of empirical success. Therefore, a hybrid approach that uses Lakatos to define the trajectory and institutional markers to ensure usability offers the best fit for the high-stakes decisions you described.
