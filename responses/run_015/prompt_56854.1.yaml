      *Refining the "Loss" in (8):* Why does the user think it's a loss? Probably because pain is *important*. It signals damage. But (3) says the *badness* isn't the signal. So the signal is *useful*, but not *bad*. So keeping the signal is good (instrumentally). But (8) says "genuine loss." If I lose the *aversiveness*, I lose the *badness*. Losing badness is good. Why is it a loss?
