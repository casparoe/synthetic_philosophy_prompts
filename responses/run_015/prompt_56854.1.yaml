      *   So (8) claiming it's a "loss" implies there is value in unpleasantness.
      *   If there is value in unpleasantness, (3) is false (unpleasantness isn't just bad) or (4) is false (value isn't just prudential).

      *Second strongest:* **Motivation Internalism (6) vs. The Reason in (8).**
      *   If motivation requires felt conative character (6), what feels conative about "keeping the capacity for suffering"?
      *   If nothing feels conative, you won't be motivated to keep it.
      *   If you *are* motivated, there must be a felt character to "valuing the capacity." Is that distinct from unpleasantness?

  8.  **Drafting the Response:**
      *   Acknowledge the boldness of the move (handing out settled views).
      *   Identify the "Fatal Triangle": (3)/(4)/(5) vs. (8).
      *   Identify the "Motivation Gap": (6) vs. (8).
      *   Identify the "Natural Kind Strain": (2) vs. (3)/(5). (Less severe, but worth noting).
