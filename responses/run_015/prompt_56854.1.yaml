      *Let's focus on the contradiction between (5) and (8).*
      (5): Asymbolic is rational. State is not bad for them.
      (8): Normal person resisting the operation is correct. The operation is a loss.
      If the state is not bad for the asymbolic, why is entering that state a loss for the normal person?
      *   Answer:* Because the normal person *values* the unpleasantness? No, (3) says it's bad.
      *   Answer:* Because the normal person needs the *link* between damage and unpleasantness for survival? That's instrumental. (3) allows derivative badness/goodness.
      *   *Wait, check (3) again:* "What makes a pain bad... is exactly its unpleasantness... Not the tissue damage... Not the interruption of projects."
