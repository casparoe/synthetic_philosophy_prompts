      *   *The Verdict:* The conclusion doesn't survive. The analogy is a rhetorical shield.

      *(Self-Correction during drafting)*: Make sure to address the specific question: "was the comparison carrying it all along?" This implies checking if the analogy is a post-hoc rationalization. I need to be firm that the analogy *imports* the engineering mindset to override the political ethics mindset.

      *Refining the "Tech Debt" concept:* In software, tech debt is quantifiable and manageable. In politics, "norm debt" is qualitative and often exponential. Use the term "Compound Interest on Distrust."

      *Refining the "User" concept:* Users can switch products. Citizens often can't switch states easily. This changes the power dynamic.

  6.  **Final Polish:** Check tone. Needs to be analytical, slightly philosophical, but grounded in the prompt's specific questions. Ensure all three parts (Table, Cracks, Conclusion) are clearly demarcated.

