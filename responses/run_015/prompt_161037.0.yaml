  # JOINT STATEMENT ON PEDAGOGICAL APPROACHES TO MASS ATROCITY
  **Summer Institute for History and Museum Educators**

  ### I. SHARED COMMITMENTS

  We, the participants of the Institute, acknowledge that teaching episodes of mass atrocity involves navigating tensions between historical precision, moral clarity, and pedagogical responsibility. While we hold divergent views on the permissibility and utility of comparison, we agree on the following foundational claims:

  1.  **Evidence and Humility:** All claims regarding the scale, mechanism, and intent of atrocities must be grounded in the best available archival and demographic evidence. We agree that evidentiary uncertainty is a feature of this field, not a bug, and that pedagogical materials must reflect the confidence intervals of current scholarship rather than presenting contested estimates as settled fact.
  2.  **The Non-Neutrality of Silence:** We agree that the structure of a syllabus, the layout of a gallery, or the selection of memorial days is never neutral. Omitting a comparison, or refusing to rank, is itself a curatorial choice with moral and political consequences. Silence can protect the vulnerable, but it can also obscure patterns of violence or demote specific victims within a national narrative.
  3.  **The Semantics of "Worse":** We acknowledge that the term "worse" functions polysemously in this discourse.
      *   In some contexts, it refers to *historical scale or intensity* (e.g., death tolls, duration, technological efficiency of killing).
      *   In other contexts, it refers to *present-day warrant* (e.g., which case demands more urgent commemoration, legal repair, or preventative vigilance).
      *   **Agreement:** We agree to specify which function the term is serving in any given pedagogical instance. We will not allow a claim about *scale* to automatically dictate a claim about *obligation* without explicit argumentation bridging the two.
  4.  **The Risk of Instrumentalization:** We agree that comparative frameworks can be misused to minimize suffering (e.g., "X was not as bad as Y, therefore X requires no repair") or to monopolize victimhood (e.g., "Y is the only benchmark of evil, therefore Z is not genocide"). Both uses are distortions of historical and ethical reasoning.
  5.  **Pedagogical Goal:** Our shared objective is not to produce a final metaphysical verdict on the hierarchy of human suffering, but to equip students and visitors with the analytical tools to understand how atrocities occur, how they are remembered, and how comparisons are constructed and deployed in public discourse.

  ### II. ANALYTICAL FRAMEWORK: THE FOUR-WAY DISTINCTION

  To reduce conflation in our discussions, we agree to distinguish between four variables that are often run together. We note that separating these does not resolve all moral disagreements, but it locates the disagreement more precisely.

  | Variable | Definition | Point of Friction |
  | :--- | :--- | :--- |
  | **1. Historical Scale** | Demographic estimates, duration, geographic scope, and technological capacity involved. | **Singularists** worry that quantifying scale reduces suffering to data. **Comparativists** argue scale is a necessary historical fact. |
  | **2. Agent Culpability** | The legal and moral liability of perpetrators, including intent and command structure. | Both agree this is judgeable, but disagree on whether culpability can be ranked *across* different ideological or state contexts. |
  | **3. Present Obligations** | Duties of repair, restitution, or official commemoration owed to survivors and descendants *now*. | **Comparativists** often link this to Scale/Culpability. **Singularists** argue this is determined by political relationship and continuity, not historical magnitude. |
  | **4. Precautionary Attention** | The degree of vigilance or educational focus warranted to prevent recurrence. | **Comparativists** may prioritize "higher risk" patterns. **Singularists** argue every case demands maximum vigilance; prioritizing one may lower guards on another. |

  **Does this distinction dissolve the dispute?**
  Partially. It clarifies that many arguments labeled as "moral" are actually "epistemic" (Variable 1) or "political" (Variable 3). However, it does not dissolve the core moral worry of the Singularists: that even *isolating* Variable 1 for the purpose of analysis creates a marketplace of suffering that dignifies the act of comparison. The Comparativist accepts this risk as necessary for justice; the Singularist accepts the distinction only as a rhetorical device, not an endorsement of comparability.

  ### III. AREAS OF ENDURING DISAGREEMENT

  We record the following disagreements not to resolve them, but to model for our students how intelligent adversaries can articulate their differences without caricature.

  | Topic | The Comparativist Position | The Singularist Position |
  | :--- | :--- | :--- |
  | **On Ranking** | Refusing to rank atrocities when evidence allows is an abdication of historical judgment. It allows dominant narratives to quietly demote marginalized victims. Ranking is sometimes morally required to allocate resources or attention justly. | Comparative verdicts on moral gravity are a category mistake. Suffering is not a commodity to be weighed. Attempting to rank is often an apologetic move to minimize specific crimes or assert national exceptionalism. |
  | **On Evidence** | Archives allow for probabilistic estimates of scale and intent. While imperfect, these estimates are sufficient to support comparative claims about magnitude and structural similarity. | Archives are fragmentary and produced by perpetrators or victors. Relying on them to rank suffering treats the limits of the record as the limits of the tragedy, inflicting a second injury on the dead. |
  | **On Pedagogy** | Students must learn to weigh evidence and make difficult moral distinctions. Shielding them from comparison leaves them vulnerable to bad-faith comparisons they will encounter in the wild. | Students must learn to dwell in the specificity of each event. Comparison encourages abstraction, which is the enemy of empathy and historical understanding. |

  ### IV. CRUX CASES: PREDICTIONS AND EVIDENTIARY BEARING

  We have selected four scenarios to test our frameworks. For each, we record the type of evidence both sides accept as relevant, and the divergent predictions each camp makes.

  **Case 1: The Downward Revision**
  *Scenario:* Fresh archival work reduces the estimated death toll of Event A (previously ranked "worse" than Event B) by 40%.
  *   **Shared Evidentiary Standard:** Both sides accept that demographic revision is valid historical work.
  *   **Comparativist Prediction:** The ranking should shift or become "inconclusive." If Event A is no longer larger than Event B, the moral warrant for prioritizing A's commemoration weakens proportionally.
  *   **Singularist Prediction:** The revision confirms the fragility of comparative evidence. The moral stance toward Event A should not change, because the *nature* of the atrocity, not the raw count, dictates the response. The attempt to rank was the error, not the specific ranking.
  *   **Analysis:** This crux isolates whether the objection is to *bad data* (Comparativist worry) or *comparison itself* (Singularist worry).

  **Case 2: The Gallery Allocation**
  *Scenario:* A memorial commission has one unassigned gallery space and two candidate atrocities. Declining to allocate is permitted.
  *   **Shared Evidentiary Standard:** Curatorial constraints (square footage, budget) are accepted as material facts.
  *   **Comparativist Prediction:** Allocating the space to Event A expresses a verdict of comparative gravity or relevance. To choose is to rank. This is unavoidable and must be done transparently based on criteria (e.g., local relevance, scale, survivor population).
  *   **Singularist Prediction:** [BRACKETED GAP: Consensus failed here.] The Singularist camp cannot agree that any allocation method is "non-comparative." They argue that scarcity forces a hierarchy that insults the excluded event. Some Singularists may endorse allocation based on *logistical* feasibility (e.g., "we have artifacts for A but not B"), but others argue this is "ranking with the lights off."
  *   **Analysis:** This is the practical flashpoint. The Comparativist sees triage; the Singularist sees erasure.

  **Case 3: The Third Comparator**
  *Scenario:* Event C is added to a syllabus comparing A and B. Its arrival changes the judgment such that A now seems "worse" than B, whereas previously they seemed equal.
  *   **Shared Evidentiary Standard:** Contextual framing affects perception.
  *   **Comparativist Prediction:** This reveals that "worse than" is not a stable binary relation but is holistically determined by the set. This requires us to be transparent about the *set* of cases we are teaching. It does not invalidate the comparison, but complicates it.
  *   **Singularist Prediction:** This proves that comparative gravity is subjective and unstable, dependent on the curator's selection rather than the events themselves. It validates the refusal to compare, as the verdict shifts with the company the event keeps.
  *   **Analysis:** This tests the transitivity of moral judgment. Both agree the shift happens; they disagree on whether it invalidates the judgment.

  **Case 4: The Prevention Case**
  *Scenario:* A policymaker can avert exactly one of two potential future atrocities, but not both.
  *   **Shared Evidentiary Standard:** Intelligence assessments regarding likelihood and potential scale.
  *   **Comparativist Prediction:** Triage is morally required. One must choose the intervention that saves the most lives or prevents the most culpable violence. This is a comparison in the disputed sense, and it is justified by consequences.
  *   **Singularist Prediction:** [BRACKETED GAP: Consensus failed here.] Some Singularists argue that in a prevention scenario, the logic shifts from *memory* to *utilitarianism*, which they may accept. However, hardline Singularists argue that framing the choice as "one or the other" is a false dilemma constructed by the perpetrators of structural violence. They refuse to sign onto a framework that accepts the constraint of choosing who dies.
  *   **Analysis:** This separates the ethics of *memory* (where Singularists are strongest) from the ethics of *action* (where Comparativist logic is harder to refute).

  ### V. OPERATIONAL GUIDELINES FOR INSTITUTE PARTICIPANTS

  In light of the above, we agree to the following protocols for the week:

  1.  **Specify the Variable:** When using comparative language, specify whether you are discussing Scale, Culpability, Obligation, or Attention.
  2.  **Own the Constraint:** When designing a syllabus or exhibit, explicitly state the constraints (time, space, audience) that dictated your selection. Do not present selection as natural or inevitable.
  3.  **No "Olympics of Suffering":** We agree to avoid pedagogical activities that ask students to "vote" on which atrocity was worst. This reduces the exercise to spectacle.
  4.  **Legitimate the Dissent:** When presenting a comparative framework to students or visitors, acknowledge the Singularist critique as a valid ethical position, not merely a historical error. Conversely, when presenting a singular framework, acknowledge the Comparativist critique regarding resource allocation and narrative hierarchy.

