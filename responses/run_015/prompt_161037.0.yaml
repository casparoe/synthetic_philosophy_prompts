  Before presenting the joint text, I must address the constraint regarding the "Four-Way Distinction" (Suffering Magnitude, Agent Culpability, Present Obligations, Precautionary Attention).

  There is a risk that this distinction acts as a Comparativist Trojan Horse. By listing "Suffering Magnitude" as a distinct category, the framework implies that magnitude is a measurable variable separable from moral weight. A hardline Singularist might argue that *estimating* magnitude for the purpose of differentiation is already the "category mistake" they oppose. They do not merely object to magnitude dictating obligation; they object to the commensurability of the suffering itself.

  However, for the purpose of pedagogical utility in a secondary-school or museum setting, this distinction is necessary. It prevents the conversation from stalling on metaphysical impossibility and moves it toward curricular decision-making. The text below treats the distinction as a *heuristic tool* for educators, not an ontological claim about the nature of suffering. This allows the Singularist to sign on the condition that "Magnitude" refers to "Available demographic and archival estimates" rather than "Quantified moral weight."

