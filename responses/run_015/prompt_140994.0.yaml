      *   *Check on (6):* User says "Diachronic Dutch book... show nothing at all." This is a strong claim (van Fraassen style?). If I accept (1), I accept pragmatic consistency. If I reject (6), I must argue beliefs aren't action-guiding in the same way. I need to make sure the user sees this cost.
