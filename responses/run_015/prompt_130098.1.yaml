      *   **Refusal:** Measure theory derivations. History-space partitions.

      *   **Closing Check:** "Identify the undermining proposition $F$ such that $Ch(F) > 0$ but $Ch(F | F) = 1$, breaking the link." Or simpler: "Given this undermining future, write the Modified PP conditional."

