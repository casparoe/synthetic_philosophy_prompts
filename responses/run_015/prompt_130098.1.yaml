answer: |-
  **1. The Dependency Chain (0–15 mins)**
  Your prob-savvy audience will try to reduce chance to credence immediately. You must invert their intuition.
  *   **Step 1 (Solidify first): The Credence/Chance Distinction.** Do not define 'objective chance' until you have defined 'credence' ($C$) as subjective degree of belief. Use their probability background: $C$ obeys Kolmogorov axioms but varies by agent; $Ch$ is a feature of the world (single-valued, time-relative) that agents do not necessarily know. *Correction to your ordering:* You cannot introduce 'objective chance' until the concept of 'epistemic credence' is distinct and stable. If they conflate them, PP is a tautology.
  *   **Step 2 (Immediate follow-up): Admissibility.** This is the bridge that prevents circularity. Before you state the Principal Principle ($C(A | Ch(A)=x \& E) = x$), you must define $E$ as *admissible* information (info about the past/present, not the future). Without this constraint, deference is trivial (if $E$ includes the outcome, $C$ should be 1, not $x$). Admissibility makes the deference step non-trivial and sets up the vulnerability for undermining.
  *   **Step 3:** The Principal Principle (the deference rule).
  *   **Step 4:** Humean Supervenience (chances depend on the total pattern of outcomes).
  *   **Step 5:** Undermining Futures (the pattern includes the future, which the chance predicts).

  **2. The Carrying Case: Humean Quantum Branching (15–30 mins)**
  Your leaning (agent knows Hamiltonian/WF, indexical uncertainty) is the standard Everettian setup, but it typically *blocks* undermining because the wavefunction fixes the chances fundamentally. To make this case do the philosophical work of undermining, you must modify the metaphysics:
  *   **Properties it Needs:**
      1.  **Humean Chances:** Explicitly stipulate that the "chances" (Born weights) are not fundamental laws derived from the Hamiltonian, but *summaries* of the frequency of outcomes across the total branch structure (the Best System).
      2.  **Indexical Uncertainty:** The agent knows the global wavefunction but not *which* branch they occupy (this drives the credence $C$).
      3.  **Future-Dependence:** The "best system" (and thus the chances) is determined by the *entire* history of branches, including those yet to be experienced by the agent.
  *   **Properties it Must Lack:**
      1.  **Fundamental Stochastic Laws:** Do not allow chances to be fixed by the present wavefunction alone. If the present WF fixes the chance, the future cannot undermine it.
      2.  **Smuggled Priors:** The agent's credence must start uninformed about the branch distribution; otherwise, they aren't deferring to chance, they're conditionalizing on known frequencies.

  **3. Misconception Sequence & Cutoffs**
  *   **Misconception 1: "Chance is just ignorance."** (Students will argue $Ch$ is just unknown $C$).
      *   **Cutoff:** Minute 5. Stop the discussion once you have defined $Ch$ as a world-feature distinct from $C$. Do not let them debate reductionism; stipulate realism for the workshop.
  *   **Misconception 2: "The Principle is just conditionalization."** (Students will think $C(A | Ch(A)=x) = x$ is trivial math).
      *   **Cutoff:** Minute 15. Cut this off when you introduce Admissibility. Show that if $E$ reveals the future, the equation breaks. This proves PP is a substantive normative constraint, not a theorem.
  *   **Misconception 3: "Undermining proves the Principal Principle is false."** (Students will think the tension destroys the concept of chance).
      *   **Cutoff:** Minute 35. Do not let them dwell in the contradiction. Cut this off by introducing the *Modified* Principal Principle (conditioning on the history of chance functions, not just the current one). Show it's a repair, not a ruin.

  **4. Scope Refusal**
  Openly refuse to cover the **measure-theoretic derivation of the inconsistency**. Tell them: "We are not proving that $Ch(F) > 0$ and $Ch(F|F)=1$ leads to a contradiction using history-space partitions. We are accepting that tension on authority to focus on the metaphysical implication: that chance cannot be both Humean and deference-worthy without modification." This saves 10 minutes of math that obscures the philosophy.

  **5. The Closing Check (35–40 mins)**
  Do not ask for a definition. Ask for the **Undermining Proposition**.
  *   **Task:** "Given our Humean Quantum case, write down the specific proposition $F$ about the future branch distribution that has a non-zero chance according to the current chance function, but whose truth would alter the chance function itself."
  *   **Success Criterion:** They must identify that $F$ is a claim about the *global frequencies* (which determine the chances) that is currently uncertain. If they identify $F$ as simply "the outcome of the next measurement," they have failed (that doesn't undermine the chance function, only realizes it). They must identify the *law-making* fact.

  Bottom line: Force a metaphysical wedge between credence and chance before bridging them, then use Humean supervenience to break the bridge so they can rebuild it correctly.
