answer: |-
  **SCENE:** *A museum collection room. Fluorescent lights hum over a metal tray holding the skull of *Archaeosoma*. MARA (50s, adaptationist) leans over the specimen. THEO (50s, structuralist) stands opposite, arms crossed.*

  **MARA:** Look at the tolerance. The duct fits the flange within microns. You don't get that kind of precision from noise.

  **THEO:** You get it from development. It's the mesenchymal condensation, Mara. You know the data. That condensation makes the jaw joint. In the sister taxon, it makes a plain ridge. You can't get the jaw shape without making *something* there. The flange is just what happens when you build that joint.

  **MARA:** It's not just "something." It's a half-tube. And blocking it costs twenty percent prey-detection accuracy in turbid water. That's a selection coefficient large enough to move mountains over geological time.

  **THEO:** In turbid water. In clear water, it does nothing. Yet the flange is in every known specimen, abrupt appearance, no precursor. If it's an adaptation, why is it universal regardless of environment?

  **MARA:** Because the ancestor lived in turbid water. But look, I'm not telling a just-so story. I'm running an optimality model on the trade-off. Deeper flange means better detection, weaker bite. My model predicts flange depth should correlate with turbidity across populations, not just bite force.

  **THEO:** And mine predicts depth tracks bite-force demands across the clade. Because the flange isn't a sensor mount; it's a buttress. It keeps the cheek plate rigid under load. That's the structural hypothesis. It's not skepticism; it's mechanics.

  **MARA:** Fine. But even if it started as a buttress—a byproduct of rigidity—it's been co-opted. That's an exaptation. Now selection maintains the specific geometry for the duct. Origin versus maintenance, Theo. You're conflating them.

  **THEO:** I'm not conflating anything. I'm saying the "maintenance" is just stabilizing selection on the jaw module. You're treating the flange as a separate unit. It's not. That's the carving objection. The variational unit is the whole cheek module. The flange's boundaries are ours, not evolution's. It isn't separately heritable.

  **MARA:** My model's variables don't need to be separately heritable. They need to covary. If depth covaries with detection efficiency, the optimality model has grip.

  **THEO:** But if the material doesn't matter, the grip slips. Remember the swap experiment? Printed prosthetic, same geometry, different internal material. Animals did fine.

  **MARA:** That shows the material doesn't matter, not that the shape wasn't selected for. The shape directs the flow.

  **THEO:** If many materials satisfy the function equally, the optimality model has no grip. It suggests the function is loose. But the fit is precise. That's the thing I have to concede: bare constraint-talk waves away the precision of the channel-to-duct fit. That's a real explanandum. A spandrel isn't the null hypothesis; I need a positive developmental account with numbers.

  **MARA:** And I have to concede this: the "what is this for?" heuristic makes the spandrel verdict nearly unreachable in practice. Even when it's true. We're biased toward finding functions.

  **THEO:** So how do we break the deadlock? The previous swap was sloppy.

  **MARA:** We design it properly. We don't just swap material. We measure strain distribution on the cheek plate during biting. And we measure flow dynamics in the channel.

  **THEO:** Right. If my structural hypothesis holds, changing the material stiffness should alter the strain patterns enough to cause microfractures, even if the geometry holds. Your model says only the geometry matters for the duct.

  **MARA:** But we also need to sample populations. My model says turbid-water populations should have deeper flanges than clear-water ones, controlling for bite force. Yours says depth tracks bite force regardless of turbidity.

  **THEO:** Discriminable predictions. I can live with that. But if you find the turbidity correlation, I'll still say the variation is constrained by the jaw module.

  **MARA:** And if you find the bite-force correlation, I'll say the duct function is secondary maintenance. We're not going to agree on the metaphysics, Theo.

  **THEO:** No. But we might agree on the measurements.

  *[A GRAD STUDENT enters, holding a clipboard.]*

  **STUDENT:** Sorry to interrupt. Professor? The seminar's starting. They want to know... is it an adaptation or not?

  **MARA:** *[Without looking up]* It's an optimized solution to a trade-off maintained by selection.

  **THEO:** *[Simultaneously]* It's a structural consequence of jaw development co-opted for flow.

  *[They look at each other, then back at the tray.]*

  **MARA:** Bring the calipers.

  **THEO:** Bring the strain gauges.

  *[BLACKOUT.]*
