answer: |-
  **The Scenario: The Audit Vault**

  You are the Chief of Staff at a large hospital. Yesterday, an insurance consortium ran a deterministic "Behavioral Audit" on you—a complete simulation of your decision-making logic based on your personnel file. The output is locked in a digital vault you cannot access or alter.

  Today, you must decide whether to authorize a costly emergency staffing surge ($100k cost) or run lean ($0 cost).

  **The Payoff:** The consortium awards a $1M efficiency bonus *only if* the Audit predicted you would authorize the surge. If it predicted you would run lean, you get nothing.

  **The Twist:** Just before you decide, a system error flashes a metadata tag on your screen: **Audit Prediction: RUN LEAN.** The vault remains locked, but you now know what's inside.

  **The Decision:** Do you authorize the surge (costing $100k) or run lean?

  ***

  **The Three Verdicts**

  **Causal Decision Theory (CDT):**
  CDT looks at the causal arrows. The Audit happened yesterday. Your choice today cannot reach back in time to change the vault's content. The bonus is already lost. Authorizing the surge costs $100k and gains nothing.
  *Verdict: Run Lean.*

  **Evidential Decision Theory (EDT):**
  EDT looks at correlations. You update on the new information: the Audit predicted "Run Lean." While your action is evidence of your type, the specific knowledge that the prediction is *already* "Run Lean" screens off the correlation. Choosing to surge now mismatches the prediction. You pay $100k for no bonus.
  *Verdict: Run Lean.*

  **Updateless Decision Theory (UDT):**
  UDT refuses to update on the metadata tag. It asks: "What policy should I have committed to *before* knowing the Audit's output?" If your policy is "Authorize surge even if the Audit says I won't," then the Audit (which simulates your logic) would have predicted "Authorize Surge." The bonus is secured. The $100k cost is worth the $1M gain. You act to make the past prediction logically consistent with your current choice.
  *Verdict: Authorize Surge.*

  ***

  **The Structural Split**

  The feature that splits UDT from the others is **ex-ante policy selection**. CDT and EDT evaluate the decision *now*, conditioning on everything currently known (including the metadata tag). They treat the past simulation as a fixed fact. UDT evaluates the decision from a perspective *before* the information was received. It treats your current action as logically controlling the simulation's output because the simulation runs the same source code (your reasoning) that you are using now. UDT sacrifices local accuracy (ignoring the tag) for global control (securing the bonus).

  **Stripping the Feature**

  If you strip away the ex-ante perspective and force the agent to update on all available information (the metadata tag), UDT collapses into EDT. Once you treat the Audit's output as a fixed fact rather than a logical variable dependent on your algorithm, the incentive to "pay" the $100k vanishes. You become a slave to the past prediction rather than its author.

  **The Causal Attack**

  A causal theorist would call this "magic." They would argue UDT confuses logical correlation with causal influence. The server in the vault flipped its bit yesterday. No amount of reasoning today changes the voltage on that hard drive. By authorizing the surge, you aren't winning the bonus; you're just throwing away $100k on a bet you've already lost. UDT, they say, is just wishful thinking dressed up as math.
