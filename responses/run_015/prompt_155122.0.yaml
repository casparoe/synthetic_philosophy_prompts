answer: |-
  ### The Scenario: The Endowment Incineration

  Consider a Chief Steward of a large, centuries-old Buddhist charitable trust. The trust generates interest used to fund hospitals and schools in a developing region. Over decades, the recipient communities have developed a profound dependency on the trust, and the donor class has developed a profound attachment to the prestige of the endowment. The Steward, a serious practitioner, discerns through insight that the trust has become a mechanism for reinforcing *upadana* (clinging): the donors cling to merit as a commodity, and the recipients cling to the institution as a savior, obscuring the reality of *anicca* (impermanence) and *anatta* (non-self).

  Acting solely from a mental state devoid of *lobha* (greed), *dosa* (hatred), and *moha* (delusion), the Steward liquidates the entire principal of the endowment. Instead of reinvesting it, the funds are used to host a single, ephemeral ritual that leaves no material trace, after which the remaining capital is symbolically scattered into a river.

  **Foreseeable Consequences:** The hospitals and schools lose their funding immediately. In the short to medium term, aggregate suffering increases measurably: treatable diseases go unmanaged, children drop out of education, and economic stability in the region fractures.

  **Buddhist Evaluation:**
  From a Theravada perspective, the moral quality of the act rests on *cetana* (volition). Since the Steward's mind is free of the three unwholesome roots, the kamma generated is *kusala* (wholesome). The suffering experienced by the recipients is understood not as a moral failure of the agent, but as the ripening of the recipients' own past kamma, catalyzed by the Steward's action. The act severs the karmic tether of dependency.

  From a Mahayana perspective, this is an exercise of *upaya-kausalya* (skillful means). The Steward acts as a Bodhisattva who prioritizes the ultimate liberation of beings over their conventional comfort. By destroying the object of attachment, the Steward creates the conditions for a spiritual awakening that outweighs temporal welfare. The act is morally unproblematic, even virtuous, because it serves the soteriological end.

  **Consequentialist Evaluation:**
  A standard act-consequentialist framework evaluates the act based on the utility profile of its outcomes. The action foreseeably produces a net increase in suffering (pain, loss of opportunity, distress) without a guaranteed compensatory increase in welfare (spiritual awakening is uncertain and non-quantifiable). Therefore, the act is morally wrong. The purity of the Steward's intention is irrelevant to the moral status of the act, though it may mitigate blameworthiness.

  ### The Conceptical Tension

  The precise point of tension lies in the definition of "harm" and the locus of moral valuation.

  For the consequentialist, harm is phenomenological and aggregate: suffering is an intrinsic disvalue regardless of its causal origin. If an agent can prevent suffering but chooses not to, or actively precipitates it, the act is deficient. The consequentialist objection is that the Buddhist framework commits a **category error** by treating the *agent's internal state* as the sole determinant of moral worth, thereby decoupling ethics from the intersubjective reality of welfare.

  For the Buddhist, the consequentialist commits a **soteriological error** by mistaking conventional comfort for ultimate good. To preserve the endowment is to preserve the conditions for future suffering (rebirth driven by clinging). The "harm" of lost schooling is finite and temporal; the "harm" of reinforced delusion is infinite and cyclic. Thus, the Buddhist framework does not deny the suffering but denies its *moral weight* relative to liberation.

  ### Mapping the Conceptual Geography

  **1. Where They Talk Past One Another (Incommensurability)**
  The frameworks operate on different teleological axes. Consequentialism is immanent; its horizon is the welfare of sentient beings within the spatiotemporal world. Buddhist ethics is transcendent; its horizon is *nibbana* or *sunyata*, which lies outside the calculus of worldly welfare.
  *   **Consequentialist Silence:** It has no vocabulary to evaluate the "spiritual debt" of dependency. It cannot register the Steward's claim that keeping the hospital open is "more harmful" than closing it, because it cannot quantify the disvalue of *moha* (delusion).
  *   **Buddhist Silence:** It has no imperative to maximize aggregate hedonic tone. The reduction of suffering (*dukkha*) is a byproduct of the path, not the sole definition of the good. It remains silent on the obligation to optimize material welfare if such optimization reinforces attachment.

  **2. Where They Fall Silent (Internal Limits)**
  *   **Consequentialism:** It falls silent on the moral development of the agent. If the Steward had kept the fund running but harbored secret hatred, consequentialism (depending on the variant) might judge the act right because outcomes were good. It struggles to account for the corrosion of the moral agent's character when acting against their own insight.
  *   **Buddhism:** It falls silent on the verification of *upaya*. There is no empirical test to confirm whether the Steward acted from wisdom or delusion. If the Steward is mistaken, the framework lacks a corrective mechanism other than the Steward's own karmic retribution. It offers no recourse for the victims of a "skillful" act that was actually misguided.

  **3. Where They Genuinely Contradict (The Incoherence of Skill)**
  The contradiction arises in the definition of *kausalya* (skillfulness).
  *   **The Consequentialist Contradiction:** If an act is defined as "skillful" but systematically produces negative welfare outcomes, the term "skillful" becomes vacuous in a public, intersubjective sense. If the Steward's action is repeated universally (all stewards liquidate endowments), the result is systemic collapse. The consequentialist argues that an ethic that cannot be universalized without producing disaster is incoherent.
  *   **The Buddhist Counter:** The act is not universalizable because it is not a rule; it is a response to specific karmic conditions. The contradiction here is fundamental: Consequentialism demands consistency of outcome; Buddhism demands consistency of mind.

  **The Core Incoherence:**
  The deepest friction is whether an act can be genuinely "good" if it makes the world empirically worse.
  *   If the Buddhist says "Yes," they risk severing ethics from empathy, making *karuna* (compassion) compatible with the infliction of pain. This exposes the framework to the charge of **soteriological egoism**, where the agent's purity or the being's ultimate liberation justifies any conventional atrocity.
  *   If the Consequentialist says "No," they must deny the possibility that short-term suffering can be instrumentally necessary for long-term good (a claim they usually accept in medicine or education). However, they reject the Buddhist case because the "long-term good" (liberation) is metaphysical and unproven, whereas the "short-term suffering" is empirical.

  Thus, the tension is not merely about intention versus consequence, but about **ontological priority**. The consequentialist privileges the reality of the suffering body; the Buddhist privileges the reality of the deluded mind. The Steward's act is the collision point: a movement that is internally consistent within the soteriological map but externally destructive within the welfare map. The conceptual impasse remains unresolved because one framework views the world as a place to be healed, and the other views it as a place to be woken up from.
