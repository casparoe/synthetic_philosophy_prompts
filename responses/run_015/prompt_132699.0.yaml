answer: |-
  This is a sharp diagnostic of the anti-doping regime. You have correctly identified that the World Anti-Doping Code (WADC) cannot be grounded in a consistent medical or bioethical theory of therapy versus enhancement. If it were, the inconsistencies you list (altitude tents vs. EPO, corrective surgery vs. TUE baselines) would not exist.

  To treat the Code as a philosophical object, we must reconstruct the **Implicit Theory of Merit** that renders these inconsistencies functional rather than fatal. Below is the analysis structured according to your three constraints.

  ### 1. The Implicit Theory: The Narrative of Constitutive Agency

  The practice does not presuppose a distinction between *therapy* and *enhancement* in the medical sense. It presupposes a distinction between **constitutive** and **alien** means of achieving performance.

  **The Core Presupposition:**
  Competitive sport is not a test of physiological output *simpliciter*; it is a test of the **narrative of preparation**. The "Spirit of Sport" clause is not a vague addendum; it is the operational core. It requires that the excellence displayed in competition be attributable to the athlete's agency as cultivated over time, rather than to a technical intervention inserted at the point of performance.

  *   **Therapy (TUEs):** Permitted because it restores the *agent's capacity to strive*. It repairs the instrument of agency. The "baseline" is not biological normality, but **competitive continuity**. This explains why reconstructive surgery allowing a pitcher to throw harder is permitted: it restores the *career trajectory*, which is the unit of value, not the pre-injury physiology.
  *   **Enhancement (Doping):** Banned because it constitutes an **alien locus of agency**. EPO is banned not because it raises hemoglobin (altitude does that), but because the hemoglobin increase is decoupled from the athlete's training labor. It is a "shortcut" in the metaphysical sense, not just the physiological one.
  *   **Natural Advantage:** Permitted because it is **fate**, not **agency**. The Code presupposes a "Natural Lottery" view: inequalities arising from brute luck (genetics) are constitutive of the athlete's identity, whereas inequalities arising from artificial intervention are external to it.

  **What this theory rules out:**
  *   **Pure Welfarism:** It rules out the view that sport's primary goal is athlete health (since risky practices like weight cutting or playing through injury are permitted).
  *   **Raw Output Utilitarianism:** It rules out the view that the highest performance is always the goal (since superior performances achieved via doping are voided).
  *   **Strict Biological Normality:** It rules out the view that "health" or "species-typical function" is the normative baseline (given the acceptance of surgical overshoot and the suppression of natural hormones in DSD cases).

  ### 2. Discipline Check: Presuppositions, Fit, and Underdetermination

  Here we separate what the practice *needs* to function from what merely *aligns* with it, and where the logic breaks.

  **(i) Strict Presuppositions vs. Mere Fit vs. Underdetermination**

  *   **Strict Presupposition:** The rules require that **the boundary of the athlete is the skin.** Interventions internalized into physiology (drugs, gene doping) are treated differently from external technologies (shoes, tents), *unless* the external technology becomes too dominant (e.g., LZR Racer swimsuits). The practice presupposes that the body is the site of merit, and technology must remain auxiliary.
  *   **Strict Presupposition:** **Institutional Authorization creates the distinction.** The therapy/enhancement line is not discovered; it is legislated. A substance is therapeutic *because* a committee granted a TUE, not because it meets independent medical criteria. The practice presupposes that a bureaucratic body has the epistemic authority to define "normal function" for an elite population.
  *   **Mere Fit:** The "Health Risk" criterion fits the public relations narrative but is not strictly presupposed. Many permitted practices (concussion protocols aside) carry high long-term health risks. If health were a strict presupposition, contact sports or extreme endurance events would be banned.
  *   **Underdetermination:** The "Spirit of Sport" is radically underdetermined. It functions as a **placeholder for tradition**. It allows WADA to ban beta-blockers in archery (preserving the "steady hand" narrative) while allowing them in other contexts, without needing a unified theory of why a steady hand is "archery" but not "shooting." The theory cannot explain *which* spirit is being protected, only that *a* spirit is being protected.

  **(ii) Internal Tensions and Coherence**

  The practice is **locally coherent but globally incoherent**. It works within specific silos but collapses when the silos are compared.

  *   **Tension 1: The Baseline Contradiction (TUE vs. DSD).**
      *   *In TUEs:* The individual's pathology is the problem. The goal is to restore *their* baseline.
      *   *In DSD Regulations:* The individual's physiology is the problem. The goal is to suppress *their* baseline to match a category average.
      *   *Analysis:* This proves the Therapy/Enhancement distinction is secondary to **Category Integrity**. When natural biology threatens the binary structure of competition (male/female), "therapy" is mandated to reduce natural function. When pathology threatens the athlete's ability to compete, "therapy" is permitted to restore function. The coherent principle is not health, but **eligibility**.
  *   **Tension 2: The Mediation Contradiction (Altitude vs. EPO).**
      *   *Your Effort Hypothesis:* This holds up well here. Altitude requires time, suffering, and logistical effort (training). EPO requires a prescription and injection (direct delivery).
      *   *The Crack:* High-tech footwear (e.g., Vaporfly) requires no effort but is permitted. This suggests the "effort" theory is incomplete. The deeper distinction is **Reversibility and Access**. Shoes are removable and theoretically purchasable by all; EPO is internal and harder to police. The practice prioritizes **policability** over philosophical consistency.
  *   **Tension 3: The Rationalisation Question.**
      *   Is the T/E distinction doing the work? **No.** It is a rationalisation for **Boundary Maintenance**. The real work is done by the "Spirit of Sport" clause, which allows regulators to ban whatever threatens the marketability or traditional narrative of the sport. The T/E distinction provides a medical veneer to what is ultimately an aesthetic and economic judgment.

  ### 3. Counterfactual Regimes: Concrete Implications

  If we replace the current anchor (Institutional Authorization/Narrative Merit) with the alternatives you proposed, the regulatory landscape shifts drastically.

  **(A) The Colleague's "Developmental-Luck Baseline"**
  *   *Theory:* Permit interventions that bring an athlete to the level they would have reached with a "fair share" of goods (nutrition, coaching, safety). Ban anything pushing past this counterfactual.
  *   *Regulatory Changes:*
      *   **TUE System:** Abolished. Replaced by **Disadvantage Exemptions**. An athlete from a low-income nation could be granted permission to use EPO to counteract poor childhood nutrition, while a wealthy athlete is banned from using it.
      *   **Prohibited List:** Collapses. Altitude tents, hyperbaric chambers, and advanced physiotherapy would be banned for wealthy athletes as "unfair developmental advantages."
      *   **Natural Endowment:** Athletes with genetic advantages (e.g., high natural VO2 max, DSD athletes) would be required to undergo "handicapping" interventions to bring them down to the developmental-luck baseline.
      *   *Feasibility:* **Epistemically Impossible.** We cannot calculate the counterfactual "fair share" baseline for any individual. The system would require total surveillance of an athlete's life history from birth.
      *   *Outcome:* The regulatory burden becomes so high that professional sport becomes impossible.

  **(B) The "Harm-Reduction" Regime (Safety Only)**
  *   *Theory:* Permit any intervention that does not pose unacceptable long-term health risks. Fairness is irrelevant; safety is paramount.
  *   *Regulatory Changes:*
      *   **TUE System:** Abolished. Medical privacy laws apply, but no special sporting exemptions needed.
      *   **Prohibited List:** Drastically reduced. EPO, anabolic steroids, and stimulants would be permitted within monitored dosage limits (like boxing weight classes or alcohol limits in driving).
      *   **New Bans:** Interventions with high mortality/morbidity would be banned (e.g., extreme weight cutting, certain gene therapies).
      *   *Survival:* Caffeine, creatine, and surgery remain.
      *   *Outcome:* Sport transforms into a **bio-engineering exhibition**. The "narrative of effort" vanishes. The market would likely stratify into "enhanced" and "natural" leagues immediately, as the current "natural" narrative is a key market asset.

  **(C) The "Pure Anti-Deception / Level-Playing-Field" Regime**
  *   *Theory:* Formal equality. Anything allowed for one must be available to all. Secrecy is the only sin.
  *   *Regulatory Changes:*
      *   **TUE System:** Abolished. If a substance is medically indicated for one, it must be available to all, or banned for all.
      *   **Prohibited List:** Two options emerge:
          1.  **Open League:** Everything permitted. Athletes publish their regimens. (Collapses into Harm-Reduction).
          2.  **Luddite League:** Only "standard human training" permitted. This requires banning *unequal access* tech. Hypoxic tents, $500 running shoes, and LASIK surgery would be banned because they are cost-prohibitive.
      *   *Outcome:* If Option 2 is chosen, sport becomes radically egalitarian but technologically stagnant. If Option 1, it becomes an arms race. The current system tries to split the difference (allowing shoes but banning drugs), which is why it faces constant philosophical pressure.

  ### Summary for the Dissertation

  Your analysis should conclude that the Therapy/Enhancement distinction in sport is not a **bioethical boundary** but a **juridical technology**.

  1.  **It is Role-Dependent:** As you noted, the same molecule is medicine or poison depending on the institutional role of the ingester. This confirms that the distinction is **constitutive of the practice**, not prior to it.
  2.  **It is Underdetermined:** The "Spirit of Sport" is the necessary escape valve that admits the practice has no single philosophical anchor. It allows regulators to pivot between health, fairness, and tradition as needed.
  3.  **It is Coherent only as Narrative Protection:** The only theory that makes sense of the Altitude/EPO distinction and the TUE/DSD contradiction is that the Code exists to protect a specific **story about human excellence**: that excellence should appear to be the result of will and training, not technical manipulation, even if that story is biologically fictitious.

  Your colleague's "developmental-luck" anchor fails because it demands an epistemic access to counterfactuals that regulators cannot have. Your "effort" hypothesis is stronger but fails to account for permitted technologies (shoes) that bypass effort. The most robust reconstruction is that the Code protects the **spectacle of the unassisted body**, where "assistance" is defined not by physics, but by cultural intuition about what counts as "cheating" versus "training." The Therapy/Enhancement distinction is the language used to justify these intuitions, not the source of them.
