answer: |-
  You are right to feel that the standard labels do not quite fit. You have not simply dressed up an obvious thing in fancy clothes; you have identified a specific topological shape of social failure that sits at the intersection of game theory, sociology, and organizational behavior.

  To answer your first question directly: **No, there is no single, canonical noun phrase that captures this phenomenon exactly.**

  There is no "Gresham's Law of Collaboration" or "The Law of Invisible Defection" that you can cite in a footnote to make the problem go away. However, the phenomenon is well-understood in mechanism, even if it lacks a unified name. It is a composite of three distinct concepts that, when combined, produce the exact shape you are describing.

  Here is the breakdown of why the existing labels fail, what the actual mechanism is, an analysis of your two "oddities," and a sharp definition you can use.

  ### 1. Why the Existing Labels Fail

  You correctly sensed that **Tragedy of the Commons** is the wrong map.
  *   **The Mismatch:** The "Commons" (Hardin, 1968) presupposes a *rivalrous* resource. If I graze my sheep on the common pasture, there is literally less grass for you. The tragedy is one of *subtraction*.
  *   **Your Case:** The resource you describe (a culture of answering emails, reading drafts) is *non-rivalrous*. My reading your draft does not diminish your ability to have it read; in fact, as you noted, it increases the value of the practice for everyone (network effects). This makes it a **Public Good**, not a Commons.

  You also correctly identified that **Free-Riding** is too broad.
  *   **The Mismatch:** Free-riding describes the *individual* incentive to benefit without contributing. It does not explain the *systemic collapse* or why the group cannot stop it.
  *   **Your Case:** You are describing a dynamic equilibrium shift, not just individual behavior.

  And **The Problem of Many Hands** is indeed different.
  *   **The Mismatch:** That concept (Dooley & Fryxell) is about the diffusion of *moral responsibility* for a specific negative outcome (usually an accident or policy failure).
  *   **Your Case:** You are describing the erosion of a *positive practice* over time, where responsibility is not diffused because no one is to blame, but rather because everyone is rationally abstaining.

  ### 2. The Actual Mechanism: A Composite

  The phenomenon you are watching is a **Second-Order Public Goods Problem** driven by **Conditional Cooperation**.

  Here are the three components that must be present to create the shape you see:

  1.  **The Good is a Public Good (Non-Rivalrous):** The practice (e.g., "answering questions") benefits everyone, and my consumption of it does not reduce yours. This explains your first oddity. Because it is non-rivalrous, the "pasture" never runs out of grass; instead, the *fence* falls down.
  2.  **The Actors are Conditional Cooperators:** Most people are not ideologues (who would do it no matter what) nor pure free-riders (who would never do it). They are *conditional*: "I will answer the email if I believe others are answering emails." This is why early visible defections are catastrophic. They signal to the conditional cooperators that the threshold of participation has dropped, triggering them to stop as well. This creates the cascade.
  3.  **The Enforcement is a Second-Order Public Good:** This explains your second oddity. To stop the defection, someone must enforce the norm (e.g., "Hey, please answer the email"). But enforcing the norm is *itself* a public good. It costs the enforcer social capital and time, while the benefit (a restored culture) is shared by everyone, including the defectors. Therefore, rational actors also free-ride on *enforcement*. This is the **Second-Order Free Rider Problem**.

  ### 3. The Role of Your Two "Oddities"

  You asked whether the non-rivalrous nature and the enforcement recursion are essential or incidental. **They are essential.** They are the structural load-bearing walls of this specific problem.

  *   **Non-Rivalry (Oddity 1):** If the resource were rivalrous (like a budget), scarcity would create a natural focal point for negotiation ("We must cut costs"). Because the resource is non-rivalrous (trust, attention, culture), there is no natural scarcity to trigger a management response. The decay is invisible until it is total. This distinguishes it from ordinary resource management.
  *   **Enforcement Recursion (Oddity 2):** If enforcement were costless (e.g., an automated system), the problem would be solvable. If enforcement were a private good (e.g., the enforcer got a bonus), someone would do it. The fact that enforcement suffers from the *same* incentive structure as the original practice is what locks the group into the suboptimal equilibrium. This distinguishes it from cases where a community successfully governs a resource (usually by appointing a central enforcer or creating selective incentives).

  ### 4. Drawing the Boundaries

  To help you identify this in the future, here is how you distinguish it from its neighbors:

  *   **Vs. Ordinary Public Goods Problem:** In a standard public goods problem (e.g., funding a lighthouse), the focus is on *provision*. In your case, the focus is on *maintenance*. The good existed; it is rotting. The distinction is **Dynamic Erosion vs. Static Under-provision**.
  *   **Vs. Successful Self-Governance (Ostrom):** Elinor Ostrom showed communities *can* manage commons. They succeed when they can monitor behavior cheaply and sanction defectors without bearing the full cost themselves (e.g., social ostracism that costs the group nothing). Your case fails because the omissions are *invisible* (high monitoring cost) and sanctioning is *costly* to the individual (high enforcement cost).
  *   **Vs. Genuine Scarcity:** In scarcity, the signal is clear (the well is dry). In your phenomenon, the signal is noisy (the well is full, but nobody is drawing water). The problem is not capacity; it is **coordination confidence**.

  ### 5. A Proposed Definition

  Since no canonical name exists, I propose you define it sharply for your own use. You might call it **"The Second-Order Norm Dilemma"** or, more descriptively:

  > **Definition:** A **Cooperative Erosion Cascade** occurs when a non-rivalrous social practice, maintained by conditional cooperation, degrades due to invisible individual defections. The collapse is stabilized by a second-order collective action problem, wherein the cost of enforcing the norm falls on individuals while the benefits of enforcement are distributed across the group, preventing the restoration of the cooperative equilibrium.

  **Criteria for Identification:**
  To classify a new case as an instance of this, four conditions must be met:
  1.  **Non-Rivalry:** The practice becomes *more* valuable, not less, as participation increases.
  2.  **Conditional Participation:** Participants are willing to contribute *only if* they perceive a high level of contribution from others.
  3.  **Invisible Defection:** Individual failures to contribute are difficult or costly to detect in real-time.
  4.  **Costly Sanctioning:** Correcting a defection imposes a net cost on the corrector that is not fully recouped by the benefit of the correction.

  ### 6. Summary

  You are not imagining a pattern where there is none. You are observing a **Second-Order Public Goods Failure** affecting a **Non-Rivalrous Resource** maintained by **Conditional Cooperators**.

  The reason it feels unnameable is that the literature splits this up: economists study the public good, sociologists study the norm, and game theorists study the second-order enforcement. None of them own the whole elephant.

  The "oddities" you identified are not bugs; they are the features. The non-rivalry prevents the usual scarcity alarms from ringing, and the enforcement recursion prevents the usual social policing from fixing it. You are stuck in a suboptimal equilibrium not because anyone wants to be there, but because the path back to the good equilibrium requires someone to absorb a cost that the group structure is designed to diffuse.

  If you need a label for your colleagues, **"The Second-Order Norm Dilemma"** is the most precise technical term. If you need a label for the feeling, it is **"The Unraveling of Conditional Cooperation."** But the definition above is the tool you need to diagnose it elsewhere.
