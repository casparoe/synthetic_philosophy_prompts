      *   *Decision:* I will portray a scenario that mirrors a Persistent Vegetative State (PVS) but frame it through the lens of the "Higher Brain" criterion debate. The doctor knows the law says "alive," but their medical judgment says "the person is gone." This creates the requested tension without breaking medical realism too badly (it's an ethical conflict, not necessarily a legal loophole).

  3.  **Character & Setting:**
