      *   **Scenario:** A relative was in a coma, doctors said "brain death," but the user is confused about the nuance (heart beating on machines vs. brain function). They want to know about the specific case where the "thinking" part is gone but the "automatic" part (breathing, heart rate) remains.
      *   **Format:** A short story.
      *   **Protagonist:** A doctor facing this exact dilemma.
      *   **Conflict:** The doctor can't decide which "death" applies (legal/medical definition vs. philosophical/personal definition).
      *   **Goal:** Make the reader feel the weight of the problem, showing it's not just a technicality but a profound human struggle.

