      *   **Inciting Incident:** A meeting with the family or an internal review. Let's go with an internal moment of doubt before signing a certificate or recommending withdrawal.
      *   **Rising Action:** Elias examines Arthur. Reflexes are there. Heart beats. But the EEG is flat on top. Sarah asks the hard question: "Is he dead?"
      *   **Climax:** Elias has to explain the distinction. He realizes the law says one thing, but the soul seems to say another. He holds the pen.
