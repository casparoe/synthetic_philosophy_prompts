answer: |-
  Your flatmate is half-right: you *are* switching between principles. But you aren't doing it arbitrarily; you're switching based on a specific, philosophically defensible distinction between **market participation in constitutive harms** versus **systemic participation in externalized harms**.

  You are operating on a hybrid view that I will call the **Voluntary Complicity Principle with Causal and Coercive Defenses (VCP-CCD)**. It is not a single monolithic rule, but a priority system.

  Here is the precise formulation that best fits your verdicts, followed by the mapping, the friction points, and the answers to your specific questions.

  ### The Principle: VCP-CCD

  **Base Rule:** It is *pro tanto* wrong to voluntarily participate in a practice that produces harm.

  **Defense 1 (The Coercion/Necessity Exemption):** The Base Rule is defeated if the participation is coerced by the state (taxes) or necessary for a reasonable life plan (driving for transport, having children).

  **Defense 2 (The Causal/Expressive Exemption):** The Base Rule is defeated if the act is causally inert regarding the harm **AND** the act does not constitute an expressive endorsement of the harm.

  **Severity Modifier:** If the Base Rule applies but the expected marginal harm is negligible (e.g., no tracking mechanism), the wrongness is mitigated but not erased.

  ---

  ### Case Mapping: Which Clause Does the Work?

  | Case | Verdict | Active Clause | Why? |
  | :--- | :--- | :--- | :--- |
  | **Skipping Election** | Fine | **Base Rule (N/A)** | Voting isn't a harmful practice. |
  | **Supermarket Chicken** | **Wrong** | **Base Rule** | Voluntary participation. Defense 2 fails because buying meat is *expressive endorsement* of killing, even if causally inert (algorithm). |
  | **Leftover Chicken** | Fine | **Base Rule (N/A)** | No market participation (no transaction). You are consuming waste, not funding production. |
  | **Butcher (To Order)** | **Wrong** | **Base Rule** | Voluntary participation + Direct Causal Link. (Maximum wrongness). |
  | **Joyride Drive** | Fine | **Defense 1** | "Reasonable life plan" / normalized infrastructure. Also Defense 2 (causal inertness on climate). |
  | **Third Kid** | Fine | **Defense 1** | "Reasonable life plan" / Reproductive rights exemption. |
  | **Heating (Waste)** | Mildly Wrong | **Base Rule + Severity** | Voluntary waste. Not necessary. But expected harm is small (shared bill). |
  | **Taxes (Weapons)** | Fine | **Defense 1** | Coerced. No reasonable exit. |
  | **Hate Donation** | **Wrong** | **Base Rule** | Voluntary. Defense 2 fails because it is purely *expressive endorsement* of harm, even if causally inert (target hit). |
  | **Capped Electricity** | Fine | **Defense 2** | Causally inert (cap binds). Not expressive of harm (energy is neutral; the system is the problem). |
  | **Cash Butcher** | **Wrong (Less)** | **Base Rule + Severity** | Voluntary participation. Defense 2 fails (expressive). Severity Modifier reduces blame due to lack of data signal. |

  ### The Friction Points: Where Your Intuitions Conflict

  You asked me to be straight about which verdicts this principle can't accommodate without tension. There are two major friction points in your data set.

  **1. The Chicken vs. Electricity Tension**
  *   **The Conflict:** In the Supermarket Chicken case, you reject *Defense 2* (Causal Inertness). You say it's wrong even if the algorithm doesn't react. In the Capped Electricity case, you *accept* *Defense 2*. You say it's fine even if your usage doesn't change emissions.
  *   **The Philosophical Cost:** To keep both verdicts, you must argue that **Meat is a Constitutive Harm** (the product *is* the death) while **Electricity is an Externalized Harm** (the product is neutral; the pollution is a side effect).
  *   **What you might have to give up:** If you press this in your presentation, a consequentialist will force you to choose. If causal inertness excuses the electricity, it must excuse the chicken (assuming the algorithm truly ignores you). If complicity condemns the chicken, it should condemn the electricity (you are still buying from a dirty grid).
  *   **Recommendation:** Stick to the **Constitutive vs. Externalized** distinction. It's the only way to save both intuitions. You are buying a dead bird (complicity in death); you are buying electrons (complicity in a system, which is excused by the cap).

  **2. The Third Kid Anomaly**
  *   **The Conflict:** You mark "Third Kid" as "Not wrong," yet admit it emits vastly more than driving or chicken.
  *   **The Philosophical Cost:** This violates the **Severity Modifier**. If wrongness is modulated by harm, this should be *very* wrong.
  *   **What you might have to give up:** You have to treat reproduction as a **Trumping Right** that sits outside the VCP-CCD entirely. You cannot integrate this into the principle without breaking it. In your presentation, bracket this as a separate issue (population ethics vs. consumer ethics) or admit it's a "basic liberty" exemption that overrides the harm calculus.

  ### The Conference Flight Case

  **The Case:** Employer paid, route booked, seat empty if you don't go.
  **Verdict:** **Fine (Not Wrong).**

  **Application of VCP-CCD:**
  1.  **Voluntary Participation?** Technically yes, you choose to board.
  2.  **Causal Link?** No. The plane flies regardless. The seat is sunk cost.
  3.  **Expressive Endorsement?** Low. You are an employee fulfilling a role, not a consumer signaling demand for more flights in the way a leisure traveler might.
  4.  **Defense 1 (Necessity)?** Strong. It is part of your professional livelihood ("reasonable life plan").

  **Why it matches your pattern:** This is structurally identical to the **Leftover Chicken** and **Taxes** cases. The harm is sunk; the resource (seat) is wasted if you don't use it; your participation is coerced/necessary. Your principle should clear this easily.

  ### The Threshold/Boycott Question

  **The Question:** Does the arithmetic change for harms that depend on participation numbers (e.g., a boycott needing 30%)?
  **The Answer:** **No new principle, but the "Causal Defense" turns off.**

  Under VCP-CCD, you rely on *Defense 2* (Causal Inertness) to excuse you in the Supermarket Chicken and Capped Electricity cases. You assume your act makes no difference.
  *   In a **Threshold Case** (e.g., a strike or boycott), your act is *not* causally inert if you are near the tipping point.
  *   Even if you aren't sure you are near the tipping point, the **Expected Utility** rises.
  *   **Crucially:** The **Complicity** clause still applies. If the boycott is against a harmful practice, participating is *right* (negative complicity), and not participating when you could is *wrong* (continued complicity).

  So, for the boycott:
  1.  **Base Rule:** Participating in the harmful status quo is wrong.
  2.  **Defense 2:** You cannot claim causal inertness because there is a non-zero probability you are the threshold trigger (unlike the chicken algorithm which you *know* ignores you).
  3.  **Result:** The obligation to join the boycott is stronger than the obligation to skip the chicken, because the *expected difference* is higher, reinforcing the *complicity* claim.

  ### Advice for Your Presentation

  Since you are presenting on the **Inefficacy Objection** (the argument that "my act makes no difference, so I have no duty"), your specific cluster of intuitions is actually a very strong counter-argument to pure Consequentialism.

  1.  **Own the Hybrid:** Don't try to force your verdicts into pure Expected Utility. Your flatmate is right that you use two principles, but argue that **Complicity is the Default** and **Causal Inertness is the Exception**.
  2.  **Focus on the "Expressive" Clause:** The Hate Donation case is your strongest philosophical asset. Pure consequentialism cannot explain why donating to a hate group is wrong if they hit the target without you. Complicity explains it perfectly (you endorsed the hate). Use this to justify the Supermarket Chicken verdict.
  3.  **Concede the Electricity Case:** Admit that the Capped Electricity case is the weakest link in your armor. It is the one where you are most vulnerable to the charge of inconsistency. Frame it as: *"I am willing to accept causal inertness as an excuse only when the harm is external to the product (pollution), not when the harm is constitutive of the product (death)."*
  4.  **The "Cash Butcher" Nuance:** Highlight this. It shows you aren't a dogmatic deontologist. You allow *expected consequences* to modulate the *severity* of the complicity violation. This makes your view more plausible than rigid rule-worship.

  **Summary for your handout:**
  "I argue for a **Complicity-First View**: We have a duty not to participate in harm. The inefficacy objection only works as a *partial* defense (reducing severity), not a full exoneration, unless the act is coerced or the product is distinct from the harm."

  This gives you a coherent line to walk into the room without feeling like you're switching masks mid-sentence.
