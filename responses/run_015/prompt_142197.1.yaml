prompt: |-
  I'm on the programme committee of a small academic society — one conference a year plus the proceedings. No written policy, no staff, seven of us, and we argue things out over email. There's a case in front of us now and I keep going in circles, so: what should we do if we want to be consistent with ourselves, and what rule have we actually been running this whole time without noticing?

  Our track record, as near as I can reconstruct it:

  - Two years ago we pulled a keynote about a month before the conference, after people found blog posts he'd written arguing that some ethnic groups are just less intelligent. Nothing to do with his talk, which was on memory consolidation. We told him he was off the program. We never published anything, never gave a reason in writing, never said for how long.
  - Same year we kept a paper on the program that a lot of members said was dangerous — it argued for a partly genetic explanation of a group difference in school outcomes. We added a respondent and ran a critical commentary beside it in the proceedings. Our line was that it was an argument made with data, inside the normal norms, and that it isn't our job to police which conclusions people argue for.
  - Last year we withdrew a paper and barred the author from submitting for three years after we found he'd fabricated data. That one we did call a sanction, we did put a term on it, and we did put a note in the proceedings saying what happened.
  - We suspended a member for a year over a long run of humiliating emails to a junior member. Completely outside conference business, from her personal account, about a personal dispute. We said it didn't matter that it was off-platform.
  - We did nothing when someone complained about a member who'd done prison time for fraud about twelve years ago and whose talk was on something unrelated. We said he'd answered for it already and it had nothing to do with his role with us.
  - We did nothing about a member who publicly called one of our own decisions cowardly and named the people who'd complained. We said public criticism of the committee is protected even when it's rude.
  - We did nothing about a member who was filmed at a protest chanting something fairly violent, unconnected to our field. We said it was outside our remit — which, as one of our members pointed out at the time, sits oddly with the first and fourth items.

  Now: the psychologist from the first item has submitted a paper for this year's proceedings. It's a straight memory paper, co-authored with his PhD student who did the work and needs the publication. Reviewers say it's fine. Separately, his department has put him forward for our service award, which is mostly honorific but comes with a named lecture. He's fairly senior and well known.

  And we've since worked out that after we dropped him, at least two other societies quietly stopped inviting him and a job talk was withdrawn. As far as we can tell nobody in any of those places looked into anything — they just saw he wasn't on our program and drew their own conclusions. He doesn't know we know.

  So: do we take the paper, and do we give him the award? Which of our own decisions is the closest match, and what are we committing ourselves to either way? Because it feels like whatever we decide, we're also deciding something about what we did two years ago, which at the time felt like us just choosing who's on the program and now looks, to everyone outside, like a verdict. Does the fact that other people copied us change anything we owe him, or is that just other people's business? And is there some decision we could take now that would force us to stop dodging this next time?

  I care less about which way we go than about which rule we'd be running and what else it commits us to. Please don't just tell me to write a policy or take legal advice — we know, and we have to answer by Friday.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Member of a 7-person programme committee (PC) for a small academic society.
      *   **Context:** One conference/year + proceedings. No written policy, no staff. Decisions made via email debate.
      *   **Problem:** A specific case is causing circular arguing. They need a decision by Friday.
      *   **Goal:** The user wants to know *what rule they have actually been running* (implicit policy) and how to be *consistent* with their past track record. They care less about the specific outcome (accept/reject) and more about the *principle* and *precedent* being set. They want to stop "dodging" in the future.
      *   **Constraint:** Do not just say "write a policy" or "get legal advice." They know that, but need an answer *now*.

  2.  **Analyze the Track Record (Case Law):**
      *   *Case 1 (Keynote - Ethnic Intelligence):* Removed from program. Reason: Off-topic blog posts (harmful views), not talk content. No written reason, no term, no publication. *Effect:* De facto blacklist, interpreted by others as a verdict.
      *   *Case 2 (Paper - Genetic Group Difference):* Kept on program. Reason: Data-driven, within norms. Mitigation: Added commentary. *Principle:* Content neutrality regarding controversial conclusions if methodologically sound.
      *   *Case 3 (Paper - Data Fabrication):* Withdrawn + 3-year ban + public note. *Principle:* Research integrity is policed; sanctions are public and term-limited.
      *   *Case 4 (Member - Humiliating Emails):* 1-year suspension. Reason: Harassment (even off-platform/personal). *Principle:* Conduct towards members matters, regardless of venue.
      *   *Case 5 (Member - Past Fraud Prison):* Nothing. Reason: Past punishment, unrelated to role. *Principle:* Rehabilitation/Relevance.
      *   *Case 6 (Member - Criticized Committee):* Nothing. Reason: Protected speech. *Principle:* Internal criticism is allowed.
      *   *Case 7 (Member - Violent Protest Chant):* Nothing. Reason: Outside remit. *Principle:* General public conduct unrelated to field/society is not policed. *Contradiction:* Conflicts with Case 1 (blog posts) and Case 4 (off-platform emails).

  3.  **Analyze the Current Case:**
      *   **Subject:** The Psychologist from Case 1.
      *   **Action 1:** Submitted a paper (memory consolidation, co-authored with student). Reviews: Fine.
      *   **Action 2:** Nominated for Service Award (honorific + named lecture).
      *   **Complication:** Other societies copied the Case 1 removal (ghost blacklisting) without due process. He doesn't know the PC knows this.

  4.  **Identify the Implicit Rule (The "Shadow Policy"):**
      *   Looking at Cases 1, 4, and 7 together: The society *does* police off-topic/off-platform behavior *if* it threatens the society's reputation or safety of members, *but* the criteria are vague.
      *   Looking at Cases 1 vs. 2: The society distinguishes between *methodological integrity* (Case 2 = keep) and *harmful ideology expressed elsewhere* (Case 1 = remove).
      *   Looking at Cases 1 vs. 3: Case 1 was treated like a conduct sanction but without the transparency or term limits of Case 3.
      *   *The Real Rule:* "We exclude individuals whose public presence creates reputational risk or safety concerns for the society, even if their specific submission is technically sound, but we do so informally to avoid debate."
      *   *The Contradiction:* Case 1 was handled as a "program decision" (no reason given) but acted as a "conduct sanction" (exclusion). This ambiguity is the source of the current mess.

  5.  **Evaluate the Options based on Consistency:**

      *   **Option A: Accept Paper, Give Award.**
          *   *Consistency:* Aligns with Case 2 (content is fine) and Case 5 (past actions shouldn't haunt forever).
          *   *Risk:* Undermines Case 1. If he was "bad" enough to remove 2 years ago, why is he "good" enough for an award now? Did he change? (No evidence).
          *   *Precedent:* Signals that Case 1 was temporary or mistaken. Reopens the wound with members who complained originally.

      *   **Option B: Accept Paper, Deny Award.**
          *   *Consistency:* Distinguishes between *scientific contribution* (Case 2) and *service/honor* (requires community standing).
          *   *Risk:* Still invites the "why was he removed before?" question.
          *   *Precedent:* Establishes that scientific merit is separate from community standing.

      *   **Option C: Reject Paper, Deny Award.**
          *   *Consistency:* Aligns with Case 1 (he is still persona non grata).
          *   *Risk:* Confirms the "ghost blacklist." Punishes the PhD student. Looks like censorship of science (unlike Case 2).
          *   *Precedent:* Solidifies the implicit rule that "we ban people for off-topic views indefinitely without appeal."

      *   **Option D: Accept Paper, Deny Award, Clarify Case 1.**
          *   *Consistency:* Acknowledges the science is sound (Case 2) but the community relationship is broken (Case 1/4).
          *   *Crucial Step:* Admit Case 1 was a conduct sanction, not a program fit issue.

  6.  **Address the "Other Societies" Factor:**
      *   Does the fact that others copied them change what they owe him?
      *   *Ethical view:* Yes. They initiated a signal that caused collateral damage (career harm) without due process. They have a duty of clarity now, even if they don't reverse the decision.
      *   *Pragmatic view:* If they accept him now, it signals to other societies that he's "cleared," potentially reversing the harm. If they reject, they cement the harm.

  7.  **Synthesize the "Actual Rule" vs. "Desired Rule":**
      *   *Actual Rule:* "We act on reputational risk intuitively, masking conduct sanctions as programming decisions."
      *   *Desired Rule (for consistency):* "We judge submissions on merit (Case 2/3) and members on conduct (Case 4/5), and we are transparent about the difference."

  8.  **Drafting the Advice:**
      *   *Tone:* Direct, analytical, peer-to-peer. No fluff.
      *   *Structure:*
          1.  Identify the implicit rule (the "Shadow Precedent").
          2.  Analyze the current case against that rule.
          3.  Address the "Other Societies" issue.
          4.  Provide the specific decision matrix (Paper vs. Award).
          5.  Propose the "Stop Dodging" mechanism (the procedural fix for Friday).

      *   *Key Insight:* The core tension is between Case 1 (Exclusion for views) and Case 2 (Inclusion for data). The Psychologist's *paper* fits Case 2. The Psychologist's *person* fits Case 1.
      *   *Resolution:* Decouple the paper from the person. The student needs the paper (Case 2 logic). The Award is about the person (Case 1/4 logic).
      *   *The "Stop Dodging" Fix:* They need to retroactively classify Case 1. It wasn't a program fit; it was a conduct sanction. They need to own that.

  9.  **Refining the Recommendation:**
      *   *Paper:* Accept. (Consistent with Case 2. The work is sound. Punishing the student is unjust. Distinguish science from scientist).
      *   *Award:* Decline. (Consistent with Case 1 & 4. Service awards require community trust. He lost that trust).
      *   *Communication:* This is the hard part. They must tell him *why* without violating privacy or starting a war.
      *   *The "Rule":* The rule they've been running is **"Reputational Risk Management via Informal Blacklisting."** To be consistent, they must either own the blacklist (and make it formal) or end it.
      *   *Best Path:* Acknowledge Case 1 was a conduct sanction. Apply a term limit (like Case 3). If 2 years have passed, maybe he *can* come back? Or, if the views haven't changed, the sanction stands.
      *   *Wait, looking closer at Case 1:* "We never... gave a reason in writing, never said for how long." This is the weak point.
      *   *Recommendation:* Accept the paper (science is sound). Decline the award (community standing damaged). *Crucially:* Inform him that the Case 1 removal was a conduct sanction, not a scientific one, and define the terms of reinstatement.

      *   *Wait, one more check:* If they accept the paper, does it contradict Case 1? Case 1 removed a *Keynote*. Keynotes are invited/honorific. Papers are submitted/merit-based. This is a crucial distinction.
      *   *Refined Rule:* "Keynotes/Awards represent the Society's voice (Conduct/Values). Papers represent the Field's discourse (Merit/Data)."
      *   *This fits all cases:*
          *   Keynote (Case 1): Society's voice -> Removed for values.
          *   Paper (Case 2): Field's discourse -> Kept for data.
          *   Award (Current): Society's voice -> Deny for values.
          *   Paper (Current): Field's discourse -> Accept for data.
          *   Harassment (Case 4): Conduct -> Sanction.
          *   Prison (Case 5): Past conduct/Rehab -> Ignored (maybe inconsistent, but fits 'relevant to role').
          *   Protest (Case 7): Outside remit -> Ignored. (This is the outlier, but can be framed as 'not directed at community').

      *   *The "Stop Dodging" Mechanism:* A simple "Conduct vs. Content" rubric.

  10. **Final Polish:** Ensure the advice answers the specific questions: "What rule have we actually been running?" "What are we committing ourselves to?" "Does the other societies factor matter?" "How to stop dodging?"

      *(Self-Correction during drafting)*: I need to be careful not to tell them *what* to decide, but rather *what rule* each decision enforces. However, the user asked "What should we do if we want to be consistent." I should recommend the path of highest consistency.
      *   Highest consistency: Distinguish between *participation* (paper) and *honor* (award/keynote).
      *   The "Other Societies" issue: They owe him clarity because their ambiguity caused external harm.

      *   *Final Plan:*
          1.  Define the Shadow Rule.
          2.  Analyze the Paper vs. Award distinction.
          3.  Address the External Harm.
          4.  Propose the "Friday Decision" + The "Future Rule".

      *(Wait, one nuance)*: Case 1 removal was "a month before conference." That's disruptive. Case 3 (Fabrication) had a 3-year ban. Case 1 had *no* term. This is the biggest inconsistency. If they accept him now, they imply Case 1 was a 2-year ban. If they reject, they imply it's indefinite. Given the lack of term, indefinite is the default *but* unfair.
      *   *Better approach:* Treat Case 1 as a "Conduct Sanction" that was poorly administered. Rectify it by setting a term *now*. If 2 years have passed, is he eligible? If the blog posts still stand, maybe not.
      *   *Actually, the cleanest consistency:* The "Keynote/Award = Society Endorsement" vs "Paper = Scientific Record" distinction is the strongest lever. It resolves the Case 1 vs Case 2 tension.

      *   *Let's write.*
answer: |-
  You are asking for a diagnosis of your implicit governance and a prescription for consistency. You have seven people, no bylaws, and a history of ad-hoc judgments that are now colliding.

  Here is the rule you have actually been running, the contradiction it has created, and the specific decision path that aligns your past actions with your future obligations.

  ### 1. The Rule You Have Been Running
  You have not been running a "Code of Conduct" or a "Scientific Merit" policy. You have been running a **Reputational Risk Management** policy.

  *   **When the risk is external (public views, protests, prison):** You act only if the risk threatens the society's brand or safety (Case 1, Case 4). You ignore it if it seems contained or "paid for" (Case 5, Case 7).
  *   **When the risk is internal (data integrity, member harassment):** You act decisively and transparently (Case 3, Case 4).
  *   **The Contradiction:** In Case 1 (the Keynote), you treated a *conduct/values* issue as a *programming* decision. You removed him without a sanction, without a term, and without a reason. This allowed you to dodge the hard work of defining *why* he was out.

  Because you treated Case 1 as a "program fit" rather than a "conduct sanction," you created a **Ghost Blacklist**. You signaled to other societies that he was toxic without giving him the due process of a sanction (like Case 3) or the clarity of a reinstatement path.

  ### 2. The Consistency Test: Paper vs. Award
  To be consistent with your own track record, you must decouple the **Scientific Record** from the **Society's Endorsement**. Your history supports this distinction, even if you haven't articulated it.

  *   **The Paper (Scientific Record):**
      *   *Precedent:* Case 2 (Genetic difference paper). You kept a controversial paper because the *data* were sound and it was within scientific norms.
      *   *Precedent:* Case 3 (Fabrication). You only reject papers for *integrity* issues, not *ideology*.
      *   *Consistency Check:* The current paper is on memory consolidation. Reviewers say it is fine. There is no data fabrication.
      *   *Decision:* **Accept the paper.**
      *   *Commitment:* This commits you to the principle that the proceedings are a record of valid science, not a vetting of the scientist's character. It also protects the PhD student (who is innocent) from collateral damage caused by the supervisor's past conduct.

  *   **The Award (Society's Endorsement):**
      *   *Precedent:* Case 1 (Keynote). You removed him because his public presence was incompatible with the society's values/safety, even if his talk was on-topic. A Keynote is an endorsement; a Service Award is an endorsement.
      *   *Precedent:* Case 4 (Harassment). You sanctioned a member for conduct that damaged the community environment, even if it was off-platform.
      *   *Consistency Check:* The Service Award implies he is a model member of the community. Case 1 established he is currently *not* viewed as such by your committee.
      *   *Decision:* **Decline the award.**
      *   *Commitment:* This commits you to the principle that honors require community standing, not just scientific output. It validates the Case 1 decision without requiring you to censor the science.

  ### 3. The "Other Societies" Factor
  You asked: *Does the fact that other people copied us change anything we owe him?*

  **Yes.**
  When you removed him in Case 1 without a public reason, you created an information vacuum. Other societies filled that vacuum with the worst-case assumption (that he was dangerous/unethical). You effectively sanctioned him professionally across the field without ever telling him he was sanctioned.

  *   **What you owe him:** You owe him clarity. You do not necessarily owe him reinstatement, but you owe him the truth that Case 1 was a conduct sanction, not a scientific rejection.
  *   **Why it matters:** If you accept the paper but deny the award without explanation, he (and the field) will remain confused. If you deny the paper, you cement the ghost blacklist and punish the student.

  ### 4. The Decision for Friday
  To stop dodging, you must convert your implicit "Reputational Risk" rule into an explicit "Conduct vs. Content" rule.

  **Step 1: Accept the Paper.**
  *   **Reasoning:** Consistent with Case 2. The work is methodologically sound. The proceedings record science, not virtue.
  *   **Caveat:** Ensure the PhD student is listed as first author if appropriate, to minimize the association.

  **Step 2: Decline the Award.**
  *   **Reasoning:** Consistent with Case 1 and Case 4. Awards represent the society's values. His prior removal (Case 1) stands as a judgment on his fit for that representation.

  **Step 3: Send the Letter (The Crucial Step).**
  You must write to him. You cannot stay silent this time.
  *   **Acknowledge the ambiguity:** State clearly that the removal two years ago was a decision regarding **community standing and suitability for invited roles**, not a judgment on his scientific competence.
  *   **Address the external harm:** Acknowledge that the lack of clarity at the time may have led to misunderstandings elsewhere.
  *   **Define the path forward:** You cannot leave it as an indefinite ban. That is unjust. Set a term. "We are not granting the award at this time. The decision regarding invited roles (Keynotes/Awards) will be reviewed in [X] years."
      *   *Recommendation:* Match Case 3 (Fabrication). A 3-year term from the original incident is standard for conduct sanctions. If 2 years have passed, set a review date for next year.

  ### 5. The Rule To Stop Dodging Next Time
  You asked for a decision that forces you to stop dodging. Adopt this rubric for all future cases. It fits 6 of your 7 past decisions and resolves the 7th (the protest chant).

  **The "Role vs. Record" Rubric:**

  1.  **Is this a submission to the Record (Paper/Poster)?**
      *   *Criteria:* Methodological integrity and relevance only.
      *   *Action:* Accept unless data is fabricated (Case 3) or irrelevant. Do not police off-topic views (Case 2).
  2.  **Is this a Representation of the Society (Keynote/Award/Committee)?**
      *   *Criteria:* Community standing, safety, and alignment with society values.
      *   *Action:* Can be denied for conduct or public views that threaten the community (Case 1, Case 4).
  3.  **Is this a Conduct Sanction?**
      *   *Criteria:* Must be transparent, term-limited, and recorded (Case 3).
      *   *Action:* Never remove someone from a *Representation* role without defining the term of the exclusion.

  **How this fixes the outliers:**
  *   **Case 7 (Protest Chant):** Under this rubric, unless the chant targeted your members or field, it does not affect *Record* (Paper) or *Representation* (Award). Consistent with "do nothing."
  *   **Case 1 (Keynote):** Was a *Representation* role. Removal was valid, but should have been recorded as a Conduct Sanction with a term.
  *   **Current Case:** Paper = Record (Accept). Award = Representation (Decline).

  ### Summary
  If you accept the paper and deny the award, you are committing to a society that **protects the science but curates its ambassadors.**

  If you deny the paper, you commit to **moral purity over scientific record**, which contradicts Case 2 and hurts the student.
  If you give the award, you commit to **Case 1 being an error**, which undermines your authority and alienates the members who originally complained.

  **The cleanest path:** Accept the work, deny the honor, and finally tell the man why he was actually excluded two years ago. That is the only way to close the loop on the ghost blacklist you accidentally created.
