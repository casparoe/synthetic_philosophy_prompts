prompt: |-
  I'm trying to walk a friend — she's an ML engineer who thinks philosophy is just bad code review — through Hempel's raven paradox. I want a teaching plan, not the actual explanation. What's the dependency order: do I need Nicod's criterion on the table before the symmetry argument lands, or does that just confuse things? For the carrying example I'm torn between the classic white shoe in the garden and something closer to her world, like finding a non-failing server log that accidentally confirms a generalization about system failure modes — which one actually carries the logical structure without smuggling in extra statistical assumptions? Then map the misconceptions in the order she'll raise them: she'll hit Bayes first, then probably claim it's just linguistic ambiguity about the word 'raven', then maybe argue that scientific context saves it. How do I absorb each without letting the session derail? What's a quick check at the end to see she's grasped the paradox structurally and not just memorized the shoe? And tell me explicitly what to leave out — I don't want to drift into Carnap's logical probabilities or Goodman's grue problem, just say so. Also I definitely typo'd dependancy somewhere above but you get the idea.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** ML Engineer friend. Skeptical of philosophy ("bad code review"). Thinks in terms of code, logic, data, systems.
      *   **Topic:** Hempel's Raven Paradox.
      *   **Goal:** A teaching plan (dependency order, examples, misconception handling, assessment, exclusions), *not* the explanation itself.
      *   **Specific Questions:**
          *   Dependency order: Nicod's Criterion vs. Symmetry Argument (Equivalence Condition).
          *   Example choice: White Shoe (classic) vs. Non-failing Server Log (ML analogy). Which preserves logic without statistical baggage?
          *   Misconception mapping: Bayes -> Linguistic Ambiguity -> Scientific Context. How to handle?
          *   Assessment: Quick check for structural grasp.
          *   Exclusions: Explicitly state what to leave out (Carnap, Goodman/Grue).
          *   Note: Acknowledge the typo ("dependancy") but focus on the content.

  2.  **Deconstruct the Logic (for the Plan):**
      *   *Core Paradox:* "All Ravens are Black" is logically equivalent to "All Non-Black things are Non-Ravens." Observing a black raven confirms the first. Observing a non-black non-raven (white shoe) confirms the second, therefore the first. Counter-intuitive.
      *   *Nicod's Criterion:* Instances confirm generalizations (P(a) & Q(a) confirms All P are Q).
      *   *Equivalence Condition:* If evidence confirms H, and H is equivalent to H', evidence confirms H'.
      *   *ML Mindset:* Needs precision, clear definitions, avoidance of hand-waving.

  3.  **Address Specific Questions:**

      *   **Dependency Order (Nicod vs. Symmetry):**
          *   Nicod is the intuition pump (what feels like confirmation).
          *   Equivalence (Symmetry) is the logical lever that breaks the intuition.
          *   *Decision:* Nicod first. You need to establish *why* we think observing a black raven works before showing why logic forces the white shoe to work too. If you start with symmetry, it feels like a trick. If you start with Nicod, it feels like a bug in the system.
          *   *ML Analogy:* Nicod = Unit Test passing. Equivalence = Refactoring code without changing behavior.

      *   **Example Choice (Shoe vs. Server Log):**
          *   *White Shoe:* Intuitively clear, zero statistical weight. Everyone knows a shoe isn't a raven.
          *   *Server Log:* Risky. "Non-failing log" implies a population of logs. ML engineers think in distributions. They might argue about class imbalance, prior probabilities, or whether a "non-failure" is actually informative data. It smuggles in Bayesian priors (which we want to avoid initially to show the *logical* paradox).
          *   *Decision:* Stick to the White Shoe (or a Red Apple). Keep the domain abstract/physical to avoid statistical intuition overriding logical intuition. Use the ML analogy *only* to map the logical structure, not as the primary evidence example.
          *   *Refinement:* Actually, a hybrid approach works best. Use the Shoe for the *paradox* (because it's stark), but use the ML analogy to explain the *logical equivalence* (De Morgan's laws).

      *   **Misconception Handling:**
          *   *1. Bayes:* "It's about priors!" (The standard ML rebuttal).
              *   *Counter:* Acknowledge it's a valid *resolution*, but the paradox exists in *classical logic* (confirmation theory), not probability. Don't let her solve it yet. Make her feel the tension first.
          *   *2. Linguistic Ambiguity:* "Raven is ill-defined."
              *   *Counter:* Treat "Raven" and "Black" as boolean flags/types. It's a type-checking issue, not a semantic one.
          *   *3. Scientific Context:* "We don't test hypotheses that way in practice."
              *   *Counter:* True, but we're debugging the *logic of confirmation*, not the workflow.

      *   **Assessment:**
          *   Don't ask "What is the paradox?"
          *   Ask her to construct an equivalent hypothesis where the confirming evidence is absurd.
          *   Or: "If I show you a blue banana, what hypothesis about apples have I just supported?"

      *   **Exclusions:**
          *   Carnap (Inductive Logic/Probability).
          *   Goodman (Grue/New Riddle of Induction).
          *   Quine (Natural Kinds) - *Maybe* too deep, keep it simple.
          *   Strictly Bayesian Solutions (save for "further reading").

  4.  **Drafting the Plan (Iterative refinement for tone):**
      *   *Tone:* Professional, structured, respectful of her expertise (ML), acknowledging the "philosophy is bad code review" bias.
      *   *Structure:* Phase 1 (Setup), Phase 2 (The Bug), Phase 3 (Debugging/Misconceptions), Phase 4 (Unit Test).
      *   *Typo:* Acknowledge "dependancy" lightly.

  5.  **Refining the ML Analogy:**
      *   Instead of "Server Log," use "Unit Tests."
      *   Hypothesis: `assert all(ravens) are black`.
      *   Equivalent: `assert all(not_black) are not_ravens`.
      *   Evidence: `item = Shoe(color='white')`.
      *   Check: `assert not item.is_black and not item.is_raven`. Passes.
      *   This clicks better than server logs because it's about boolean logic, not distributions.

  6.  **Final Review against Constraints:**
      *   Teaching plan only? Yes.
      *   Dependency order answered? Yes.
      *   Example choice justified? Yes.
      *   Misconceptions mapped? Yes.
      *   Assessment included? Yes.
      *   Exclusions explicit? Yes.
      *   Typo acknowledged? Yes.

  7.  **Final Polish:** Ensure the distinction between *Logical Equivalence* and *Probabilistic Confirmation* is sharp, as that's where an ML engineer will try to escape the paradox. The goal is to make her feel the *logical* validity before allowing the *probabilistic* exit.

  *(Self-Correction during drafting)*: Wait, if I tell her to avoid Bayes, she might get frustrated. I need to frame Bayes as "The Patch" but emphasize we need to reproduce the "Bug" first. The paradox is a bug in Classical Confirmation Theory, not necessarily in Bayesianism.

  *(Refining the Example)*: The prompt asks about "Non-failing server log." I need to be explicit why that's dangerous. It implies a dataset. A white shoe is a single object. Single object = single test case. Dataset = statistics. Stick to single objects for the paradox.

  *(Final Plan Structure)*:
  1.  Prep & Mindset.
  2.  Dependency Order (Nicod -> Equivalence).
  3.  Example Selection (Shoe > Logs).
  4.  Misconception Flowchart.
  5.  Assessment.
  6.  Exclusion List.

