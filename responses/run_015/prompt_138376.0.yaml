answer: |-
  This is a procedural document designed for a one-hour interdisciplinary case conference. It treats Integrated Information Theory (IIT) not as a truth-machine, but as a rigorous heuristic for structuring uncertainty. It explicitly marks where the theory exceeds clinical resolution and where ethical precaution must override theoretical ambiguity.

  # The IIT-Clinical Decision Procedure (v1.0)

  **Purpose:** To structure the weekly case conference for patients with prolonged disorders of consciousness (pDOC).
  **Time Limit:** 60 Minutes.
  **Participants:** Neurologist, Palliative Care, Senior Nurse, Chaplain, Chair.
  **Goal:** Answer three questions: (1) Is experience present? (2) Is speech represented? (3) Is suffering possible?
  **Constraint:** No direct calculation of $\Phi$ (Phi) is possible. All measures are proxies.

  ---

  ## Part 1: The Translation Table (Proxies vs. Theory)
  *Keep this visible during the conference. Do not conflate the proxy with the theoretical construct.*

  | IIT Construct | Theoretical Definition | Clinical Proxy (Available) | Clinical Proxy (Ideal/Research) | Limitation / Risk |
  | :--- | :--- | :--- | :--- | :--- |
  | **Existence** | $\Phi > 0$ (Irreducible cause-effect structure exists) | **EEG Reactivity** (Change in complexity upon stimulation) | **TMS-EEG (PCI)** (Perturbational Complexity Index) | EEG reactivity shows *response*, not *integration*. PCI is the only validated proxy for $\Phi$. |
  | **Structure** | Connectivity matrix allowing differentiation | **Structural MRI / DTI** (Integrity of thalamocortical loops) | **Effective Connectivity** (Granger causality on EEG) | MRI shows *potential*, not *actual* causal power. A wired but silenced brain has low $\Phi$. |
  | **Subject** | The Complex (Subset maximizing $\Phi$) | **Source Localization** of integrated signal | **High-density EEG / MEG** | We cannot identify the *exact* subset. We assume the largest integrated network is the subject. |
  | **Content** | Specific concepts in the cause-effect repertoire | **Task-fMRI** (Motor imagery, auditory names) | **High-dim Neural Decoding** | fMRI shows *access* to a concept, not necessarily the *quality* of the experience. |
  | **Valence** | Intrinsic pleasantness/unpleasantness of the structure | **NONE** | **NONE** | **Theory is silent.** Clinical precaution applies. |

  ---

  ## Part 2: The Procedure (Ordered Questions & Stopping Rules)

  ### Phase 1: Structural Potential (15 Minutes)
  *Question: Does the hardware support a complex cause-effect repertoire?*

  **Q1.1: Is the thalamocortical loop structurally intact?**
  *   **Evidence:** Structural MRI, DTI (Diffusion Tensor Imaging).
  *   **Criterion:** Preservation of reciprocal connectivity between thalamus and posterior cortical "hot zone."
  *   **Stopping Rule:**
      *   **Yes:** Proceed to Q1.2.
      *   **No (Global destruction):** Verdict = **Unlikely Conscious.** (Stop Phase 1).
      *   **No (Focal/Lesion):** Proceed to Q1.3 (The "Subset" Check).
      *   **Indeterminate (Artifact/Poor Scan):** Verdict = **No Verdict Available.** (Handoff to Ethics/Precaution).

  **Q1.2: Is the cortex merely quiescent or causally disabled?**
  *   **Theory Check:** IIT states structure alone is insufficient; mechanisms must be capable of differentiation. Deep sedation or burst suppression reduces the *available repertoire*.
  *   **Evidence:** Background EEG (Burst suppression? Isoelectric?), Medication Review (Propofol/Benzos?).
  *   **Stopping Rule:**
      *   **Burst Suppression/Isoelectric:** Verdict = **Currently Unconscious.** (Note: Potential remains if meds cleared).
      *   **Continuous Background:** Proceed to Phase 2.
      *   **Unclear:** Mark as **State-Dependent Uncertainty.**

  **Q1.3: The "Subset" Check (Addressing the Lesion Paradox)**
  *   **Theory Check:** A lesion can theoretically isolate a high-$\Phi$ subset by removing feedforward noise or weak links.
  *   **Evidence:** Does the lesion disconnect a large, noisy, feedforward network, leaving a smaller, densely recurrent island?
  *   **Action:** If Yes, do **not** downgrade consciousness based on volume loss. Flag for Phase 2 verification.
  *   **Stopping Rule:** If the lesion destroys the recurrent core, Verdict = **Unlikely Conscious.** If it isolates a core, Proceed to Phase 2.

  ### Phase 2: Dynamic State & Existence (20 Minutes)
  *Question: Is the system currently integrating information ($\Phi > 0$)?*

  **Q2.1: Is there evidence of irreducibility (Integration)?**
  *   **Evidence:** TMS-EEG (PCI score) if available. If not, EEG Reactivity (does noise change complexity or just amplitude?).
  *   **Criterion:** PCI > 0.31 (Conscious) vs. < 0.31 (Unconscious). Or, complex EEG desynchronization vs. simple evoked potentials.
  *   **Stopping Rule:**
      *   **High Integration:** Verdict = **Conscious.** Proceed to Phase 3.
      *   **Low Integration:** Verdict = **Unconscious (Current State).** Proceed to Phase 4 (Precaution).
      *   **Borderline/Near-Tie:** Verdict = **Indeterminate.** (See Q5 handling below).

  **Q2.2: Time-Relativity Check**
  *   **Theory Check:** $\Phi$ is state-dependent. It can flicker.
  *   **Evidence:** Comparison of EEG/Behavior over last 7 days.
  *   **Action:** If verdicts differ (Conscious Mon / Unconscious Wed), **Default to the "Conscious" state** for ethical planning.
  *   **Rationale:** IIT cannot adjudicate the "average" subject. Ethics requires protecting the moment of existence.

  ### Phase 3: Content Specificity (15 Minutes)
  *Question: Does the experience include "hearing us"?*

  **Q3.1: Is the auditory/semantic concept specified?**
  *   **Theory Check:** Existence ($\Phi > 0$) $\neq$ Content (Hearing).
  *   **Evidence:** Task-fMRI (Motor imagery), EEG P300 (Oddball), Bedside Command Following.
  *   **Stopping Rule:**
      *   **Command Following (Bedside/fMRI):** Verdict = **Conscious + Hears Instructions.**
      *   **Passive Auditory Activation Only:** Verdict = **Conscious + Auditory Experience Present** (But "understanding" is unknown).
      *   **No Specific Activation:** Verdict = **Conscious + Content Unknown.** (Do not assume they hear *meaning*, only that experience exists).

  **Q3.2: The "Isolation" Warning**
  *   **Theory Check:** If Phase 1 Q1.3 flagged a "Subset" lesion, the conscious island might *not* include auditory cortex.
  *   **Action:** If the integrated complex is posterior-only (visual/somatosensory) and auditory cortex is disconnected, Verdict = **Conscious but May Not Hear.**
  *   **Family Instruction:** "Talk to her, but we cannot confirm she hears *words*, only that she experiences *sound* or *presence*."

  ### Phase 4: Valence & Ethics Handoff (10 Minutes)
  *Question: Is she suffering?*

  **Q4.1: The IIT Limit**
  *   **Statement:** IIT identifies the *structure* of experience, not the *valence* (pain/pleasure).
  *   **Procedure:** **Stop applying IIT.**
  *   **Default:** If Phase 2 Verdict = **Conscious** or **Indeterminate**, Default = **Assume Capacity for Suffering.**
  *   **Rationale:** Precautionary Principle. We cannot measure negative $\Phi$.

  **Q4.2: Intervention Decision**
  *   **Action:**
      *   **CANH:** If Conscious/Indeterminate $\rightarrow$ Continue (unless prior directive exists).
      *   **Analgesia:** If Conscious/Indeterminate $\rightarrow$ Treat procedures as painful.
      *   **Family Interaction:** If Conscious $\rightarrow$ Encourage. If Unconscious $\rightarrow$ Encourage (for family benefit), but clarify patient status.

  ---

  ## Part 3: Limits and Overrides

  1.  **The "No Verdict" Zone:** If MRI is unreadable AND EEG is uninterpretable (artifact), the procedure returns **No Verdict.**
      *   *Ethical Consequence:* This is **not** "Unconscious." It is "Unknown." The default is Precaution (Continue CANH, Treat Pain).
  2.  **The "False Negative" Risk:** IIT proxies (PCI) can miss consciousness in rare "cognitive motor dissociation" cases where integration is local but not global.
      *   *Override:* If fMRI shows command following but PCI is low, **Trust fMRI.** (Specific content proves existence).
  3.  **The "False Positive" Risk:** EEG complexity can exist in sleep or seizures without consciousness.
      *   *Override:* If clinical exam is flat and EEG shows seizures, treat seizures first, then reassess.
  4.  **Ethics Committee Defense:** If challenged, state: "We used IIT to define the *conditions* for consciousness, found data insufficient to rule them out, and applied the Precautionary Principle for the *value* of life."

  ---

  # Case Applications

  ### Case 1: The Anoxic Woman (34F, UWS, 6 Months)
  *   **Data:** Eyes open, sleep-wake cycles. No command follow (bedside/fMRI). Thalamocortical structure preserved. Family told "nobody there."
  *   **Procedure Run:**
      *   **Phase 1 (Structure):** MRI shows preserved architecture. **Pass.** (Note: Anoxia often damages micro-structure invisible on MRI, but we must go by available data).
      *   **Phase 1 (Quiescence):** EEG shows sleep-wake cycles (not burst suppression). **Pass.**
      *   **Phase 2 (Integration):** No TMS-EEG available. Bedside EEG shows reactivity? (Assume typical UWS: low complexity). **Verdict: Indeterminate/Low Probability.**
      *   **Phase 3 (Content):** fMRI negative. **Verdict: No evidence of speech representation.**
      *   **Phase 4 (Valence):** IIT silent. **Default: Precaution.**
  *   **Conference Decision:**
      *   **To Family:** "We cannot prove she is conscious, but we cannot prove she is not. The theory says structure exists, but activity is low. We cannot say 'nobody is there.' We must assume she *could* be."
      *   **Action:** Continue CANH (Precaution). Encourage family to talk (low risk, high family benefit), but clarify she may not understand words.
      *   **IIT Tension:** The resident's "nobody there" claim is a **Negative Verdict** without sufficient evidence. The procedure forbids this. "No evidence" $\neq$ "Evidence of absence."

  ### Case 2: The TBI Man (58M, CMD, 4 Months)
  *   **Data:** Unresponsive bedside. Reproducible motor-imagery fMRI command following.
  *   **Procedure Run:**
      *   **Phase 1 (Structure):** Traumatic injury, but functional networks active. **Pass.**
      *   **Phase 2 (Integration):** fMRI command following *requires* integration of instruction, memory, and motor plan. This implies $\Phi > 0$ in that network. **Verdict: Conscious.**
      *   **Phase 3 (Content):** He follows "imagine playing tennis." This specifies the concept of *instruction* and *agency*. **Verdict: Hears and Understands.**
      *   **Phase 4 (Valence):** IIT silent. **Default: Precaution.**
  *   **Conference Decision:**
      *   **To Family:** "He is conscious. He hears you. He understands instructions even if he cannot move."
      *   **Action:** Aggressive pain management for procedures. Establish communication channel (fMRI/EEG BCI) if possible.
      *   **IIT Addition:** Standard clinical view might say "Locked-in." IIT clarifies that the *subject* is the network generating the imagery. If the motor cortex is damaged but the imagery network is intact, the *experience* of moving is present even if the output is blocked. The procedure confirms the *existence* of the subject via the *content* evidence.

  ### Case 3: The Hydrocephalus Man (41M, Thin Mantle)
  *   **Data:** Cortex compressed to thin mantle. Awake, inconsistent command follow.
  *   **Procedure Run:**
      *   **Phase 1 (Structure):** **Intuition:** "Too little brain." **IIT Check:** Volume is not the metric; recurrence is.
      *   **Phase 1 (Subset):** The compression may have eliminated feedforward "noise" pathways, leaving a dense, recurrent cortical shell.
      *   **Phase 2 (Integration):** He follows commands inconsistently. This proves $\Phi > 0$ at least intermittently.
      *   **Phase 3 (Content):** Command follow proves semantic access.
      *   **Verdict:** **Conscious.** potentially *more* integrated per unit volume than a swollen, edematous brain.
  *   **Conference Decision:**
      *   **To Team:** "Do not treat him as 'barely conscious' based on the scan. The scan shows volume loss, not connectivity loss. He is demonstrating integration."
      *   **To Family:** "His brain is shaped differently, but he is here. Inconsistent following is likely motor fatigue, not lack of awareness."
      *   **IIT Tension:** This is the **Lesion Paradox** in action. The procedure forces us to acknowledge that the "catastrophic" scan might hide a highly efficient, isolated complex. We must not underestimate him.
      *   **Action:** Full analgesia. Full engagement. Challenge the "vegetative" label if applied.

  ---

  ## Closing Note for the Chair
  You asked for the contradictions on the table. Here they are for the Ethics Committee defense:

  1.  **We are measuring proxies, not $\Phi$.** We admit this. We use PCI/EEG/fMRI as *indicators* of irreducibility, not measures of it.
  2.  **We default to Precaution.** When IIT yields "Indeterminate," we do not withdraw care. We treat the *possibility* of experience as morally equivalent to the *certainty* of it.
  3.  **We separate Fact from Value.** IIT informs the Fact (Is there a subject?). Palliative Care informs the Value (Is this suffering? Is this life worth living?). We do not use IIT to justify withdrawing nutrition.
  4.  **We accept Discontinuity.** If the patient flickers in and out of consciousness, we protect the "On" state.

  This procedure does not solve the hard problem. It prevents you from making categorical claims ("She is not there") that the theory does not support, and it prevents you from withholding care based on structural intuition ("Look at that scan") that the theory contradicts.
