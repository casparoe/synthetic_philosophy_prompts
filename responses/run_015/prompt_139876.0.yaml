answer: |-
  Here is a ninety-minute session plan designed for your specific audience and constraints. It prioritizes logical structure over persuasion, acknowledges the contested nature of the theory, and isolates the "tremble" problem as the critical stress test.

  ### Session Plan: Superrationality in the One-Shot Dilemma

  **Total Time:** 90 Minutes
  **Tools:** Whiteboard, Marker.
  **Goal:** Distinguish *Causal* independence from *Logical* correlation in decision theory.

  ---

  #### 1. The Setup and The Concession (00:00 – 00:15)
  **Objective:** Secure the room, specifically the Operations-Research (OR) Analyst, by conceding the standard view before challenging it.

  *   **Draw the Matrix:** Standard Prisoner's Dilemma ($T > R > P > S$).
  *   **State the Constraints:** One-shot, no communication, no enforcement, no reputation.
  *   **The Dominance Argument (Whiteboard):**
      *   If they Cooperate ($C$): I get $T$ (Defect) vs $R$ (Cooperate). $T > R$.
      *   If they Defect ($D$): I get $P$ (Defect) vs $S$ (Cooperate). $P > S$.
      *   **Conclusion:** Defection strictly dominates.
  *   **Action:** Ask the OR Analyst to confirm this. **Let them win this point.**
      *   *Script:* "Under standard Causal Decision Theory, where my choice cannot physically influence theirs, this is settled. If anyone argues dominance is mathematically wrong here, they are mistaken. We are not challenging the arithmetic; we are challenging the independence assumption."
  *   **Why this order:** If you introduce correlation before conceding dominance, the engineers and analysts will dismiss the entire session as mathematically illiterate. You must establish that Superrationality is a *deviation* from the standard model, not a correction of its arithmetic.

  #### 2. The Core Example: Independent Implementations (00:15 – 00:35)
  **Objective:** Replace the "Clone" or "Benefactor" intuition pumps with a robust, technical analogy that fits your audience.

  *   **The Scenario:** Two high-frequency trading bots, written by different teams in different firms, deployed on isolated servers.
      *   **Must Contain:**
          1.  **Identical Source Code:** Both teams downloaded the same open-source "Rational Agent v1.0" library.
          2.  **Identical Input:** Both receive the same market signal (the PD payoff matrix).
          3.  **Isolation:** No network connection between them during execution.
          4.  **Determinism:** The code is deterministic (no random seed divergence).
      *   **Must Lack:**
          1.  **Physical Causality:** Bot A's output does not travel to Bot B.
          2.  **Metaphysical Identity:** They are distinct physical objects.
          3.  **Rigged Payoffs:** The payoffs are standard market returns, not set by a philosopher.
  *   **The Argument:**
      *   Ask the room: "If I am Bot A, and I calculate that 'Defect' is the output of Rational Agent v1.0, what must I conclude about Bot B?"
      *   *Answer:* Bot B must also output 'Defect'.
      *   "If I calculate that 'Cooperate' is the output, Bot B must also output 'Cooperate'."
      *   **The Shift:** You are not choosing an action; you are choosing the *output of the algorithm*. Since the algorithm runs in both places, your choice *logically determines* both outcomes.
      *   **Comparison:** $(C,C)$ yields $2R$. $(D,D)$ yields $2P$. Since $R > P$, the rational algorithm outputs $C$.
  *   **Human Translation:** Replace "Bots" with "Two humans who have both read and fully internalized the same proof of rationality." If the reasoning is sound, it yields the same result in both minds.

  #### 3. Newcomb's Problem as Diagnostic (00:35 – 00:45)
  **Objective:** Use Newcomb's to categorize the disagreement in the room, not to solve Newcomb's.

  *   **Placement:** Do not start with this. Use it now to explain *why* the OR Analyst and Math Teacher are talking past each other.
  *   **Brief Setup:** Box A (transparent, \$1k), Box B (opaque, \$1M or 0). Predictor puts \$1M in B if they predict you take *only* B.
  *   **The Split:**
      *   **Causal View (OR Analyst):** My choice now cannot change what is already in the box. Take both. (Analogous to PD Dominance).
      *   **Evidential/Logical View (Math Teacher/Superrational):** My choice is evidence of what the predictor predicted. People who take one box get \$1M. (Analogous to PD Correlation).
  *   **Function in Session:** This tells the room: "The Prisoner's Dilemma disagreement is actually a Decision Theory disagreement. The OR Analyst is a Causal Decision Theorist. The Superrationalist is a Logical/Evidential Decision Theorist. Both are consistent within their own axioms."

  #### 4. The Tremble: The Stress Test (00:45 – 01:05)
  **Objective:** Address your specific wrinkle. This is where the theory is fragile.

  *   **The Perturbation:** "Suppose Bot B is not running Rational Agent v1.0. Suppose there is a probability $\epsilon$ that Bot B is running 'DefectBot' (or has a hardware fault causing defection)."
  *   **The Question:** Does the Superrational recommendation survive?
  *   **The Honest Answer (Write this on the board):**
      *   **Case 1: Shared Tremble.** If the "tremble" is in the *reasoning process* shared by both (e.g., both have a 1% chance of a logic error), then correlation holds. We both tremble together. Expected Value of $C$ is still higher.
      *   **Case 2: Independent Tremble.** If *you* are superrational but *they* are a standard defector with probability $\epsilon$ (independent of you), **correlation breaks.**
  *   **The Discontinuity:**
      *   If $P(\text{Other is Superrational}) = 1$, I Cooperate.
      *   If $P(\text{Other is Superrational}) < 1$ (and their defection is causally independent of my reasoning), the dominance argument returns. I Defect.
      *   *Script:* "The prescription is discontinuous. Superrationality requires **Common Knowledge of Rationality**. If you know the other agent is not reasoning superrationally, you cannot treat your choices as correlated. You must defect."
  *   **Why admit this:** It prevents the "sucker" objection. It clarifies that superrationality is not altruism; it is a coordination mechanism that fails if the other party isn't plugged into the same logic.

  #### 5. Misconception Map & Managed Debate (01:05 – 01:20)
  **Objective:** Explicitly categorize errors and let the Math Teacher and OR Analyst spar within bounds.

  *   **Draw a 2x2 Grid on the Board:** Label axes "Causal Link?" and "Identity?".
  *   **Place the Misconceptions:**
      1.  **"It's the Golden Rule":** *False.* Golden Rule is moral ("Do unto others"). Superrationality is instrumental ("I want the payoff $R$, which requires correlation").
      2.  **"Telepathy/Causal Leakage":** *False.* Emphasize the isolated servers. The link is logical, like $2+2=4$ being true in two different rooms.
      3.  **"They are Literally You":** *False.* They are distinct instantiations of the same *function*.
      4.  **"Thresholding":** *False.* It is not "Cooperate if $P(\text{They } C) > X$." It is "Cooperate if my reasoning *determines* their reasoning."
  *   **The Debate (Math Teacher vs. OR Analyst):**
      *   *Prompt:* "Math Teacher says symmetry implies we pick the best joint outcome. OR Analyst says that stipulates the equilibrium rather than deriving it."
      *   *Resolution:* "The Math Teacher is right about the *symmetry of the solution* if the logical link holds. The OR Analyst is right that standard game theory *stipulates independence* as an axiom. Superrationality challenges the axiom of independence, not the equilibrium math."
      *   *Truth:* They are both closer to the truth than they think. It is a dispute over the definition of "Strategy." Is a strategy a physical move (OR) or a logical output (Math)?

  #### 6. Closing (01:20 – 01:30)
  **Objective:** Verify understanding, not moral conversion.

  *   **The Closing Question:**
      *   *"If you are superrational, but you are certain your opponent is a standard Causal Decision Theorist who will defect, do you cooperate?"*
      *   **Correct Answer:** **No.** (If they say Yes, they think it's altruism. If they say No, they understand the logical correlation requirement).
  *   **Final Statement:** "Superrationality is not a way to be nice. It is a claim that in a symmetric world, rationality is a shared resource. If the other side doesn't access that resource, you shouldn't either."

  ---

  ### Private Notes for the Presenter (Do Not Put on Board)

  **1. Settled Facts (Consensus)**
  *   **Payoff Structure:** The matrix values ($T>R>P>S$) are fixed.
  *   **Dominance:** Under the assumption of *causal independence*, Defection strictly dominates Cooperation.
  *   **Nash Equilibrium:** $(D,D)$ is the unique Nash Equilibrium in standard non-cooperative game theory.
  *   **The Tremble Discontinuity:** If the correlation between agents is broken (i.e., one is known to be a standard defector), the superrational prescription collapses to standard defection.

  **2. Live Disputes (Contested in Decision Theory)**
  *   **Normative Status:** Is Superrationality a *requirement* of rationality (Hofstadter/CDT critics) or a *category error* (Standard Game Theory/CDT proponents)? There is no consensus.
  *   **Distinctness:** Is Superrationality distinct from **Evidential Decision Theory (EDT)** or the newer **Functional Decision Theory (FDT)**?
      *   *Note:* Many academics view Superrationality as an informal precursor to FDT. FDT formalizes the "algorithm output" argument. You should mention this if asked, but treat Superrationality as the intuitive version.
  *   **Group Agency:** Does this reasoning implicitly treat the two players as a single group agent? Some argue Superrationality is just Team Reasoning in disguise.
  *   **Common Knowledge:** The theory relies on "Common Knowledge of Rationality." In the real world, this is almost never true. The theory is robust mathematically but fragile empirically.

  **3. Handling the OR Analyst**
  *   Do not try to prove them "wrong" by standard definitions. They are right by the standards of von Neumann-Morgenstern utility theory.
  *   Frame Superrationality as an *extension* or *alternative axiom set* (Logical Correlation vs. Causal Independence), not a refutation of their math.
  *   If they say "This is just wishful thinking," reply: "It is wishful thinking only if you assume your reasoning process is physically isolated from the output. If reasoning is computational, it is not isolated."

  **4. What to Decline to Explain**
  *   **Quantum Entanglement:** Do not let anyone bring this up. It is a physical phenomenon, not a logical one. It muddies the water.
  *   **Psychological Prediction:** Do not discuss "I know him, he's a good guy." That is empirical prediction, not logical correlation.
  *   **Moral Obligation:** Decline to discuss whether one *ought* to cooperate morally. Stick strictly to payoff maximization.

  **5. The "Truth" of the Math Teacher vs. OR Analyst**
  *   The OR Analyst is correct that standard economics assumes causal independence.
  *   The Math Teacher is correct that if the problem is symmetric and deterministic, the *solution* must be symmetric.
  *   The conflict is not about the math; it is about whether "My choice" refers to "My hand moving" (Causal) or "My algorithm returning a value" (Logical). Superrationality demands the latter definition.

  ---

  ### Specific Instructions for the "Tremble" Segment
  When you introduce the tremble (Section 4), you must be precise about the *source* of the probability.
  *   **If the probability is internal to the algorithm** (e.g., the code has a `random.random() < 0.01` defect line), then **both** agents have the defect. The correlation holds. Cooperation remains rational.
  *   **If the probability is external** (e.g., "There is a 10% chance this opponent is a psychopath"), then the correlation is broken. You are no longer facing a mirror. Defection becomes rational.
  *   **The Discontinuity:** Be prepared to draw a step function on the board. $P(\text{Cooperate})$ jumps from 0 to 1 as $P(\text{Other is Superrational})$ crosses a threshold of certainty. Acknowledge that this makes the theory "brittle" in real-world applications. This honesty will gain you more respect from the engineers than trying to smooth it over.

  ### Final Check on the Closing Question
  Ensure you wait for the answer. If someone says "Yes, I'd still cooperate to be moral," interrupt gently: "We are asking about rationality and payoffs, not morality. If you cooperate against a defector, you get $S$. If you defect, you get $P$. $P > S$. Do you cooperate?"
  *   If they say **No**: They understand Superrationality is conditional on shared reasoning.
  *   If they say **Yes**: They have reverted to altruism, and the concept has not landed.
