prompt: |-
  I am a retired physical chemist — thirty years in industrial catalysis — and since retiring I have been sitting in on philosophy-adjacent discussion groups, and have now agreed to run one evening myself. Our library's Wednesday series draws about twenty-five people, mostly retired engineers, a physician, a lawyer, a high-school mathematics teacher, and one retired operations-research analyst who is sharp, friendly, and will tell me inside ten minutes that in a one-shot Prisoner's Dilemma defection strictly dominates. Last month another presenter did the iterated version and everyone left content that reciprocity and reputation explain cooperation there; my job is the harder case. I have ninety minutes, a whiteboard, and no way to assign reading in advance, so please do not hand me a bibliography or a list of essays — I cannot easily reach a university library, and in any case I want the plan, not the sources.

  The notion I have to teach is superrationality: the claim, associated with the popular-science essay that introduced the term, that two agents who are genuinely running the same reasoning procedure should treat their choices as correlated rather than independent, so that in a one-shot Prisoner's Dilemma — no repetition, no reputation, no communication, no enforcement — cooperation is nonetheless the rational output. Please do not explain the idea to me; I can follow the argument. Plan how I should explain it to that room. I want the order in which the components must be introduced and what depends on what: does the dominance argument have to be stated and fully conceded before the correlation move can even be heard, or does conceding it first hand the operations-research analyst the whole game? Does Newcomb's problem belong early as an intuition pump, late as a diagnostic, or nowhere? Where does the shift from choosing-as-one to choosing-as-one-of-a-kind have to be made explicit, and what has to be in place before it? I also want one case to carry the session, and I am uneasy with the standard stagings: a player facing an exact copy of themselves invites the response that this is just one person in two places, and the eccentric-benefactor-with-twenty-finalists version invites the response that it is a rigged parlor puzzle. I would rather build on two agents who are not literally the same agent and not guaranteed to reason identically — two independent implementations of the same published algorithm written by different teams, or two strangers each of whom has read and been convinced by the same argument. Tell me what such an example must contain and must lack if it is to bear the weight.

  There is one wrinkle I insist on including, because it is where I suspect the idea either survives or dies and I do not know which: a tremble. Let the other agent be an ordinary defection-bound reasoner with some small but non-negligible probability rather than a superrational one. What becomes of the superrational recommendation, at what point in the sequence should I introduce the perturbation, and is the honest answer that the prescription is discontinuous in that probability — which, if so, I would rather say out loud than paper over? I also want the misconception map with each item placed: that this is just the golden rule in mathematical costume; that it assumes some kind of causal leakage or telepathy between the agents; that it is refuted in advance as a variant of evidential reasoning; that it requires believing the other agent literally is you; and the subtler one, that it amounts only to cooperating when your estimate of the other's cooperativeness exceeds a payoff-derived threshold, which misses the dependence claim entirely. My mathematics teacher will want to say that symmetry means we both do the same thing and so we should simply pick the better of the two joint outcomes, and the operations-research analyst will say that this merely selects an equilibrium by stipulation; I would like to know which of them is closer to the truth and how to let that exchange happen in the room without losing the thread. Give me one question to end on that would show me the idea itself had landed rather than that people had been persuaded to be nicer, and tell me what I should openly decline to explain at this level. Finally, and this matters to me as a scientist who has sat through too many confident talkers: mark clearly for me, in the notes rather than on the board, which claims are settled — the payoff structure, dominance, the equilibrium facts — and which are live disputes among people who work on decision theory, such as whether superrationality is a genuine position distinct from the familiar causal and evidential approaches, whether it collapses into one of them or into reasoning as a group agent, and whether it is a normative claim at all; I do not want to present a contested view to that room as though it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired physical chemist (30 years industrial catalysis). Analytical, precise, respects scientific rigor, wary of "confident talkers" presenting contested views as consensus.
      *   **Audience:** ~25 people, mostly retired professionals (engineers, physician, lawyer, math teacher, OR analyst). Smart, skeptical, familiar with basic game theory (iterated PD covered last month).
      *   **Topic:** Superrationality (Hofstadter's concept) in the one-shot Prisoner's Dilemma (PD).
      *   **Constraints:** 90 minutes, whiteboard only, no pre-reading, no bibliography.
      *   **Specific Challenges:**
          *   How to handle the dominance argument vs. correlation move.
          *   Role of Newcomb's Problem (early, late, none?).
          *   The "Copy" vs. "Independent Implementation" example (avoiding "one person" or "rigged puzzle" objections).
          *   The "Tremble" (probability of other defecting): Is the prescription discontinuous?
          *   Misconception Map (Golden Rule, Telepathy, Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT), Thresholding).
          *   Math Teacher vs. OR Analyst dynamic (Symmetry vs. Equilibrium Stipulation).
          *   Closing Question (tests understanding, not just niceness).
          *   What *not* to explain.
          *   **Crucial:** Distinguish settled facts from live disputes in the notes (not on the board).

  2.  **Deconstruct the Core Concept (Superrationality):**
      *   *Core Claim:* If two agents are rational and know the other is rational, and they face the same symmetric problem, their reasoning processes are isomorphic. Therefore, their outputs (choices) are correlated, even without causal link.
      *   *Implication:* In PD, $C$ yields $(R,R)$, $D$ yields $(P,P)$. Since $R > P$, and choices are linked, choose $C$.
      *   *Tension:* CDT says $D$ dominates regardless of correlation. Superrationality acts more like EDT or FDT (Functional Decision Theory).
      *   *The "Tremble":* If the other defects with probability $\epsilon$, does the superrational agent still cooperate? If correlation is perfect, $\epsilon$ implies *I* defect with $\epsilon$. If correlation is imperfect, the math changes. This is the fragile point.

  3.  **Drafting the Session Plan - Section by Section:**

      *   **Introduction (10 mins):** Set the stage. Acknowledge last month (Iterated PD). Define the One-Shot PD clearly.
      *   **The Standard View (15 mins):** Must address the OR Analyst immediately. If you don't concede dominance first, they will shout it down later. State the Nash Equilibrium ($D,D$). Concede that causally, $D$ is better *if* choices are independent.
      *   **The Pivot - Symmetry and Reasoning (20 mins):** Introduce the "Independent Implementation" example.
          *   *Example:* Two trading algorithms. Same code, different servers. Or two humans convinced by the same proof.
          *   *Avoid:* Clones (metaphysical weirdness), Benefactor (rigged).
          *   *Key:* Logical correlation, not causal.
      *   **Newcomb's Problem (10 mins):** Where does it fit? It's a diagnostic. Use it here to show the split between Causal and Evidential/Logical reasoning. It clarifies *why* the OR analyst objects (Causal view) vs. why the Math teacher nods (Symmetry view).
      *   **The Tremble (20 mins):** The user's specific wrinkle. This needs careful handling.
          *   If correlation is perfect: $\epsilon$ chance of $(D,D)$, $1-\epsilon$ chance of $(C,C)$. Expected Value (EV) of $C \approx R$. EV of $D \approx P$. Still $C$.
          *   If correlation breaks: The "discontinuity" fear. If I am superrational but they are not, am I a sucker?
          *   *Resolution:* Superrationality assumes *common knowledge of rationality*. If that breaks, the premise breaks. The prescription *is* discontinuous at the point where "same reasoning" fails. Admit this.
      *   **Misconception Map & Debate (10 mins):** Address the specific errors (Golden Rule, Telepathy, etc.). Let Math Teacher and OR Analyst spar, but moderate to show they are talking past each other (Normative vs. Descriptive, Causal vs. Logical).
      *   **Conclusion (5 mins):** The Closing Question.

  4.  **Refining the Specific Requests:**

      *   *Dominance vs. Correlation:* Concede dominance *causally* first. Otherwise, the OR analyst disengages. The "correlation move" is a challenge to the *independence* assumption, not the math of dominance itself.
      *   *Newcomb:* Use it as a bridge. It's the canonical example where CDT and EDT diverge. It validates the OR analyst's intuition (CDT) while opening the door for Superrationality (Logical/EDT).
      *   *The Example:* Needs to be "Two independent implementations of the same published algorithm."
          *   *Must Contain:* Identical source code, isolated execution, no communication, symmetric payoffs.
          *   *Must Lack:* Physical connection, shared random number generator (unless seeded identically), metaphysical identity claims.
      *   *The Tremble:* This is the hardest part. If the other agent has a probability $\epsilon$ of defecting *independent* of me, correlation is broken. If the $\epsilon$ is a "tremble" in the *reasoning process* shared by both, then we both tremble. The prompt asks about an "ordinary defection-bound reasoner." This breaks the superrational symmetry.
          *   *Honest Answer:* Superrationality *requires* the assumption that the other is *also* superrational (or running the same logic). If you know they are a standard CDT defector, superrationality collapses to CDT (you defect). The discontinuity is real. It's a phase transition based on the assumption of shared rationality.
      *   *Math Teacher vs. OR Analyst:* Math Teacher sees the symmetry ($C,C$ vs $D,D$). OR Analyst sees the strategic dominance ($D$ is better regardless). Truth: OR Analyst is right about *Causal* Decision Theory (standard economics). Math Teacher is right about the *Logical* correlation premise. It's a dispute about the *definition* of rationality, not the math.
      *   *Closing Question:* Needs to test the *logic*, not the *morality*. "If you knew your opponent was a standard game-theory defector, would you cooperate?" (Answer: No. This proves it's not just altruism).
      *   *Settled vs. Contested:*
          *   *Settled:* Payoff matrix, Nash Equilibrium ($D,D$), Dominance of $D$ under Causal independence.
          *   *Contested:* Whether logical correlation counts as a decision-theoretic input, whether Superrationality is distinct from EDT/FDT, normative status.

  5.  **Review against Constraints:**
      *   90 minutes? Yes, timing looks tight but feasible.
      *   Whiteboard? Yes, rely on matrices and flow.
      *   No bibliography? Yes.
      *   Tone? Respectful of the user's expertise, direct, no fluff.
      *   "Notes rather than on the board": I need to create a specific section for the user's private notes regarding the "Settled vs. Contested" distinction.

  6.  **Final Polish:**
      *   Ensure the "Tremble" section is precise. The user suspects discontinuity. I need to confirm that yes, if the *shared reasoning* assumption is violated, the strategy flips.
      *   Make sure the "Independent Implementation" example is robust against the "clone" objection. Emphasize *logical* identity, not physical.
      *   Check the Misconception Map placement. Don't do it all at once; weave it in, but summarize at the end.
      *   Ensure the OR Analyst feels heard (they are technically right by standard definitions) while allowing the Superrational argument to stand as an *alternative* framework.

  7.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Initially, I thought about putting Newcomb early. But the user asked if it belongs early or late. It works best as a *diagnostic* after the PD is set up but before the Tremble. It explains *why* the disagreement exists.
      *   *Correction on Tremble:* If the other is an "ordinary defection-bound reasoner," they are *not* superrational. Therefore, the correlation does not hold. The superrational agent should defect. This confirms the discontinuity. I must make sure the user states this clearly so it doesn't look like a failure of the theory, but a boundary condition.
      *   *Math vs OR:* The OR analyst is right about standard theory. The Math teacher is right about the symmetry *if* the logical link holds. I need to frame this as "Definitions of Rationality" rather than "Who is smarter."

  8.  **Finalizing the Plan Structure:**
      1.  Setup & Concession (Dominance).
      2.  The Core Example (Algorithms).
      3.  The Mechanism (Logical Correlation).
      4.  Newcomb (The Diagnostic).
      5.  The Tremble (The Stress Test).
      6.  Misconceptions & Debate.
      7.  Closing.
      8.  Private Notes (Settled vs. Contested).

  9.  (Final check of the prompt requirements): "Mark clearly for me, in the notes rather than on the board, which claims are settled... and which are live disputes." -> I will create a distinct section at the end for this. "Give me one question to end on." -> Will formulate carefully. "Tell me what such an example must contain and must lack." -> Will detail the Algorithm example.

