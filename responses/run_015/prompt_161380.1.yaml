  1. There is no single famous name for this specific exploitation, but it is discussed in behavioral economics under dynamic inconsistency and in game theory as a form of rational exploitation. It is effectively a protection racket where the threatened harm is a money pump sequence that the predator never has to execute.

  2. The standard circular-drain argument proves your preferences are irrational because the trades actually happen and drain your resources, whereas your version extracts resources by threatening to execute those trades. The classic version targets a logical flaw in your ranking, while your version monetizes the predictability of your future choices.

  3. Unlike blackmail, which threatens an outcome you actively dislike, this threatens a sequence of offers you will willingly accept at every individual moment. The leverage comes from your knowledge that the cumulative sequence is harmful, not from any single step being undesirable on its own.

  4. The threat must be credible, but the consensual nature of each step is exactly what makes the threat work since you know you won't resist in the moment. Pre-commitment neutralizes this by removing your ability to consent later, and the logic applies even without circular preferences if you simply value immediate rewards too highly.

  5. This vulnerability does not mean you are broken, but it does indicate a conflict between your planning self and your acting self that others can exploit. It suggests that true rationality involves recognizing these conflicts and restricting your own future choices to prevent such arbitrage.
