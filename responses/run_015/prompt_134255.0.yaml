prompt: |-
  I've been thinking on my own about whether reading biographies of real people can actually teach you how to live well. I started with Plutarch's paired lives—he sets Greek and Roman figures side by side and compares their virtues and failures almost like a moral experiment. Then I read about medieval hagiography, where saints' lives are shaped to be perfect examples, sometimes by leaving out flaws or adding miracles. That led me to a sharper worry: is every biography that tries to teach morality secretly doing what hagiography does openly—smoothing over contradictions and framing a messy life as a clean example?

  I don't want a summary of Plutarch or a list of scholars. I want an essay that takes this worry seriously and reaches a real conclusion. Please organize your response exactly as follows:

  1. The tension (about 250 words): lay out why moral instruction through biography seems to require selecting and framing events, using Plutarch's comparative pairing and hagiographic selection as your two poles.
  2. The defense of framing (about 300 words): argue that smoothing contradictions is a legitimate pedagogical feature, not deception—consider how comparing figures across different political worlds can still isolate genuine moral choices.
  3. The serious objection (about 300 words): argue that this framing becomes harmful when it hides structural complicity—ask whether pairing a democratic reformer with a monarch for comparative virtue creates false moral equivalence, and whether modern biography repeats this by omitting economic or colonial violence.
  4. The verdict (about 250 words): take a clear position. Does moral learning from lives necessarily depend on a kind of narrative smoothing that hagiography makes explicit? Is modern biography essentially hagiography with archives? Defend your answer with reasoning, not just assertion.
