          Yet this defense collapses when framing serves ideology rather than clarity. The danger is not that the biographer selects events, but that they select them to protect existing power structures. When Plutarch pairs a democratic reformer with a monarch, he risks creating a false moral equivalence. It suggests that virtue is interchangeable regardless of the political system, potentially obscuring the fact that one figure's greatness relied on the oppression of the other's citizens. Smoothing contradictions becomes harmful when it hides structural complicity. If a biography teaches us how to live well by highlighting a general's courage, but omits the colonial violence that funded his campaign, the lesson is morally corrupted. It teaches success without accountability. Modern biography often repeats this sin under the guise of objectivity. By focusing on the individual's internal struggles, the narrative often isolates the subject from the economic or social machinery that enabled their rise. This is not merely smoothing noise; it is erasing context. The hagiographic impulse returns here, not through miracles, but through silence. The saint is no longer sinless; they are disconnected from the consequences of their actions. When a biography frames a life as a clean example of leadership while omitting the suffering that leadership caused, it ceases to be moral instruction and becomes propaganda. It teaches the reader to admire the result while ignoring the cost. This is not pedagogical refinement; it is ethical blindness. The smoothing hides the blood on the hands, making the example safe to emulate but dangerous to society. We learn to climb the ladder, but not to ask who holds it. It shields elitism from critique. This structural blindness is the real danger. It matters.
