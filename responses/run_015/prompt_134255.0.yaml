          Moral instruction through biography faces an inherent structural paradox. To teach someone how to live, a life must be intelligible; it must possess a coherent arc where actions lead to consequences and character dictates fate. However, actual human existence is rarely coherent. It is fragmented, contradictory, and often governed by luck rather than virtue. Therefore, the biographer who aims to educate must inevitably become an editor. They must select events that illustrate a thesis and omit those that obscure it. This necessity creates a spectrum of distortion. At one end stands Plutarch, whose *Parallel Lives* pairs Greek and Roman figures to isolate specific virtues or vices. He acknowledges flaws but frames them within a comparative moral experiment, prioritizing ethical clarity over exhaustive chronicle. He shapes history into a mirror. At the opposite pole lies medieval hagiography. Here, the pedagogical goal is sanctity, so the editing becomes surgical. Contradictions are not merely framed; they are erased. Miracles are inserted to bridge gaps in logic, ensuring the saint remains an unblemished vessel of divine will. The worry arises because these poles may not be distinct genres but points on a continuum. If Plutarch selects for virtue and the hagiographer selects for perfection, is the moral biographer simply a hagiographer who admits to minor flaws? The tension lies in whether narrative coherence—the very thing that makes a life teachable—requires a falsification of the lived experience. To make a life a lesson, must we first make it a fiction?
