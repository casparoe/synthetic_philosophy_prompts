answer: |-
  I grant you freely that in the daily business of the weather, where days follow one another in great numbers and conditions are sufficiently alike, numerical measures serve well enough; there, the frequency of occurrence approximates the logical relation you seek. But your ice shelf is not a rain day; it is a unique occurrence, not a member of a homogeneous series you can count. When two modelling groups offer such divergent judgments, you are in precisely the position of the man who finds the barometer high yet the clouds black; your models are the barometer and the clouds. You do not resolve the uncertainty by striking a mean; you merely conceal the conflict. The logical relation between your evidence and the conclusion is not 0.3, it is indeterminate. You say the figure would be verified by repetition if only you could check it; but you cannot check it, and that hypothetical verification is no foundation for knowledge. To pretend otherwise is to assume equal ignorance where there is no logical ground for equality.

  As for what to put in your box: if the machinery of planning demands a numeral, put one there, for a man must act even when knowledge is slight. But do not mistake this convention for a probability. What you have gained by averaging is not a clearer probability, but a greater *weight* of evidence—you have considered more opinions—yet the probability itself remains obscure. I have distinguished these: the weight measures the amount of evidence, while the probability measures the balance of it. You have increased the weight while pretending to fix the probability. By dressing up your ignorance in the garb of precision, you risk leading those who rely on your plan to believe the ground is firmer than it is. It is better to admit that the probability is non-numerical, bounded perhaps between low and moderate, and that the weight of our argument is slight. To act is necessary, but to pretend to know what we cannot know is a vice of reasoning, not a virtue of planning.
