answer: |-
  Here is a complete package for your convention week class. It includes the prompt, a model answer calibrated to 3rd-year expectations, and a detailed marking rubric.

  ***

  # In-Class Essay Prompt (45 Minutes)

  **Topic:** Distinguishing Lewisian Conventions from Enforced Social Norms

  **Instructions:**
  Read the two campus scenarios below. Write a short essay (approx. 500–700 words) answering the following question:

  *Which scenario describes a David Lewis-style convention, and which describes a social norm maintained by sanctions? Justify your classification by applying Lewis's criteria (conditional preference, mutual expectations, arbitrariness, and precedent) and explain how the Lewisian case could evolve through trial-and-error without explicit agreement.*

  **Case A: The Seminar Door**
  Graduate students in the philosophy department need to know if a seminar room is in use without interrupting. Over time, a regularity emerged: if the room is booked, the door is shut; if it is free for drop-ins, the door is left half-ajar. Everyone prefers the half-ajar signal *only if* others interpret it correctly. If everyone left doors wide open, the signal would fail. There was no meeting to decide this; one day someone left it ajar, others copied it, and now it persists. A "red light/green light" magnet system would have worked just as well but never caught on.

  **Case B: The Party Fund**
  At the end of every term, undergraduates are expected to contribute $5 to a party fund. Most students would prefer to keep their $5 and still attend the party (free-riding). However, they contribute anyway. Those who don't pay are subject to gossip and social exclusion. Students pay primarily to avoid these sanctions, not because they prefer paying conditional on others paying.

  ***

  # Model Answer (Calibration Copy)

  **Title:** Coordination vs. Coercion: Analyzing Campus Norms

  Case A (The Seminar Door) constitutes a David Lewis-style convention, whereas Case B (The Party Fund) represents a social norm enforced by sanctions. While both involve regularities in behavior, only Case A satisfies the logical conditions of a coordination equilibrium defined by Lewis, specifically regarding conditional preference and arbitrariness.

  To classify Case A as a Lewisian convention, we must establish that the students' preferences are conditional on the behavior of others. In the Seminar Door case, a student prefers to leave the door half-ajar *if and only if* they expect others to do the same and interpret the signal correctly. If others left doors wide open, the individual would prefer to match that behavior to maintain clarity. This creates a coordination problem where the goal is alignment, not moral compliance. Furthermore, Case A displays **arbitrariness**. Lewis argues that a convention must have at least one alternative equilibrium that could have solved the coordination problem equally well. The prompt notes that a "red light/green light" system would have worked just as well as the door position. The specific signal is arbitrary; the consistency is what matters.

  Finally, Case A relies on **mutual expectations** and **precedent** without explicit deal-making. Students leave the door ajar because they expect others to expect them to do so. This web of expectations is self-enforcing; no one needs to threaten punishment for shutting the door because shutting it is against everyone's interest if the goal is signaling availability. The regularity persists because of precedent: it worked in the past, so we do it again.

  In contrast, Case B fails the test of conditional preference. In the Party Fund scenario, students do not prefer to contribute conditional on others contributing. Their underlying preference is to free-ride (keep the $5 and attend). They contribute only to avoid external sanctions (gossip/exclusion). This is a Prisoner's Dilemma structure, not a coordination equilibrium. In a Lewisian convention, adhering to the rule is its own reward provided others do the same. In Case B, adhering to the rule is a cost incurred to avoid punishment. Therefore, the $5 contribution is a norm enforced by social pressure, not a convention sustained by mutual expectation of coordination.

  Regarding evolution, Case A fits Lewis's story of how conventions arise from scratch through **trial-and-error and salience**. A convention does not require a contract. It begins when one agent tries a solution (leaving the door ajar) to a recurring coordination problem (knowing if the room is free). If this solves the problem, others notice the success and copy the behavior. Over time, this regularity gains salience. Once a critical mass adopts it, it becomes rational for newcomers to adopt it simply because it is the established precedent. The "ajar" signal becomes a focal point.

  This evolutionary story does not fit Case B. Trial-and-error cannot easily explain the Party Fund because the rational individual choice is always to free-ride. Without the mechanism of sanctions (gossip), the behavior would collapse. While Case A evolves because it is *useful* to coordinate, Case B persists because it is *costly* to deviate. Thus, only the Seminar Door represents a true Lewisian convention where the norm is sustained by the interlocking expectations of the agents themselves, rather than the threat of social punishment.

  ***

  # Marking Guide (Total: 25 Marks)

  ### 1. Identification & Thesis (5 Marks)
  *   **5:** Clearly identifies Case A as Lewisian and Case B as Sanction-based/Norm. Thesis is nuanced (e.g., mentions coordination vs. cooperation).
  *   **3:** Identifies correctly but thesis is vague or lacks justification.
  *   **0:** Incorrect identification (e.g., claims both are conventions).

  ### 2. Application of Lewis Criteria to Case A (10 Marks)
  *   **Conditional Preference (3 marks):** Explains that students prefer the action *only if* others do it (coordination), not because they inherently like leaving doors ajar.
  *   **Arbitrariness (3 marks):** Notes that another signal (magnets, signs) could have worked. The specific behavior doesn't matter, the consistency does.
  *   **Expectations/Precedent (4 marks):** Explains that no explicit agreement was made. Behavior is sustained by "I expect that you expect me to..." logic.

  ### 3. Contrast with Case B (5 Marks)
  *   **5:** Clearly explains why Case B fails Lewis's criteria. Highlights that preferences are *not* conditional (they want to free-ride) and enforcement relies on external sanctions (gossip), not self-enforcing expectations.
  *   **3:** Notes Case B involves punishment but fails to explain why this disqualifies it as a Lewisian convention (misses the preference structure).
  *   **0:** Treats Case B as a convention or ignores it.

  ### 4. Evolutionary Mechanism (5 Marks)
  *   **5:** Describes the "trial-and-error/salience" path for Case A (someone tried it, it worked, others copied). Explains why this doesn't work for Case B (rational choice is to defect without sanctions).
  *   **3:** Describes trial-and-error but fails to contrast why it doesn't apply to Case B.
  *   **0:** Claims conventions require explicit agreements or meetings.

  ### Differentiating A vs. B Grades
  *   **A Range (21–25):** The student connects the *logic* of the concepts to the *details* of the cases. They understand that "arbitrariness" means an alternative equilibrium was possible, not just that the rule is random. They clearly distinguish between *coordination* (Case A) and *cooperation/enforcement* (Case B).
  *   **B Range (16–20):** The student defines the terms correctly (e.g., defines conditional preference accurately) but applies them mechanically. They might say "Case A has conditional preference" without explaining *why* the preference is conditional in that specific context. They may struggle to articulate why Case B isn't a convention beyond "there is gossip."

  ### Classic Blunders (Deduct 2–3 Marks Each)
  1.  **The "Agreement" Error:** Claiming Lewisian conventions require a verbal agreement or meeting (Lewis explicitly argues against this).
  2.  **The "Morality" Error:** Arguing Case A is a convention because it is "polite" or "good," rather than because it solves a coordination problem.
  3.  **The "Equilibrium" Error:** Failing to mention that Case A has an alternative equilibrium (the magnets/signs), thereby missing the criterion of Arbitrariness.
