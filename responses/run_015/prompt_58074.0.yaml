prompt: |-
  ok so im TAing a third-year class on social norms and stuff and my prof dumped the convention week on me becuase shes travelling. i need a 45-min in-class essay prompt on Lewis-style conventions plus how norms can evolve without anyone agreeing to them, something that actually forces them to apply the ideas instead of just repeating definitions.

  can you make up two little campus cases for them to work through? like one where grad students leave the seminar room door half-open vs fully closed to signal if the room is free for drop-ins, where everyone goes along mainly since they expect everyone else to read it that way and theyre fine with it as long as others are, and there was another equally workable signal that just never caught on. and a second one where everyone chips in five bucks for the end of term party even though most would realy rather free-ride and only pay to avoid gossip.

  the essay should make them say which one counts as a Lewisian convention and why, using the bits about conditional preference, mutual expectations, arbitrariness / another equilibrium being possible, and precedent without explicit deal-making, plus sketch how trial-and-error and copying success could get the first one going from scratch and why that story doesnt fit the second one.

  throw in a model answer around 600 words i can calibrate off, and a marking guide out of 25 that breaks down the points, spells out what seperates an A answer that nails the crux from a B answer that just lists labels, and flags the two or three classic blunders that should lose marks.
