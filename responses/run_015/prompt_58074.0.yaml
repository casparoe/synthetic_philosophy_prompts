      *   **Deliverables:**
          1.  Essay Prompt (clear instructions).
          2.  Model Answer (~600 words).
          3.  Marking Guide (out of 25, distinguishing A vs. B, flagging blunders).

  2.  **Deconstruct the Theory (David Lewis, *Convention*):**
      *   *Key features of a Lewisian Convention:*
          1.  Regularity in behavior.
          2.  Common knowledge/mutual expectations (I expect you to do X, you expect me to do X).
          3.  Conditional preference (I prefer to do X *if* you do X; coordination problem).
          4.  Arbitrariness (There is at least one other possible regularity Y that could have solved the coordination problem just as well).
          5.  Precedent/Salience (We do it because we did it before, not because of an explicit agreement).
      *   *Contrast with Social Norms (non-Lewisian):*
          *   Often involve conflict of interest (Prisoner's Dilemma type) rather than pure coordination.
          *   Enforcement via sanctions (gossip, shame) rather than self-enforcing expectations.
          *   Not arbitrary in the same way (often tied to moral/ethical pressures).

  3.  **Drafting the Cases (Refining User's Ideas):**
      *   *Case 1 (The Door):* Needs to emphasize *coordination*. If everyone leaves it open, no one knows if it's busy. If everyone closes it, no drop-ins. The specific signal (ajar vs. shut) doesn't matter, just that it's consistent. Everyone prefers consistency over chaos.
      *   *Case 2 (The Party):* Needs to emphasize *cooperation/enforcement*. People *don't* want to pay (free-rider preference). They pay only to avoid punishment (gossip). This is not a coordination equilibrium in the Lewis sense; it's a norm enforced by sanctions.

  4.  **Drafting the Prompt:**
