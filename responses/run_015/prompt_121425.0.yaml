answer: |-
  There is no single term in linguistics or philosophy that captures this configuration perfectly, because the phenomenon sits at the intersection of pragmatics (how language is used), anthropology (ritual), and social psychology (face). However, the "carving" you are looking for is best described as **Ritualized Phaticism with a Meta-Communicative Taboo.**

  To build your glossary, you do not need a new label so much as a structural definition that distinguishes this from lying, implicature, or simple politeness. Here is the carving, followed by the resolution of your three boundary cases.

  ### The Carving: Propositional Truth vs. Relational Validity

  The phenomenon occurs when an utterance is governed by **Relational Validity** rather than **Propositional Truth**.

  1.  **Propositional Truth:** The value of the sentence depends on whether it corresponds to reality (e.g., "The meeting is at 14:00").
  2.  **Relational Validity:** The value of the sentence depends on whether it correctly performs a social role (e.g., "We value this relationship enough to imagine a future meeting").

  In the cases you describe, the speakers are engaging in a **Ritualized Exchange**. The "rules" of this ritual are:
  *   **The Token:** The words spoken are tokens, not information packets.
  *   **The Uptake:** The hearer must accept the token *as if* it were information, without testing it for information.
  *   **The Taboo:** It is forbidden to name the token *as* a token.

  This is why your students feel a distinction but lack vocabulary. They are sensing the difference between a **Statement** (which invites verification) and a **Ritual Token** (which invites participation).

  *   **Why it is not Lying:** A lie intends to deceive regarding Propositional Truth. Here, both parties know the Propositional Truth is secondary; the intent is to maintain Relational Validity.
  *   **Why it is not Standard Implicature:** In standard pragmatics (Grice), if I say "It's cold in here," you infer "Close the window," and we can both admit that's what I meant. In your cases, admitting what is meant ("I am just being polite" or "I am saving your face") destroys the Relational Validity. The meaning exists only in the **Unacknowledged Common Ground**.
  *   **Why it is not Just Politeness:** Politeness can often be explicit ("Let me put this gently"). In your cases, explicitness is the offense. The mechanism requires **Plausible Deniability** that cannot be exercised.

  **Glossary Definition:**
  > **Ritualized Indirection:** An utterance where the literal content is secondary to the social function, governed by a convention that requires the hearer to treat the content as serious without verifying it, and forbids either party from explicitly naming the social function. Violation occurs either by taking the content literally (breach of ritual) or by explicating the function (breach of taboo).

  ---

  ### The Boundary Cases

  You can resolve your three boundary cases by testing whether the **Shared Context** required for the ritual is present. The phenomenon only exists where there is **Mutual Knowledge of the Convention** that remains **Unacknowledged**.

  #### 1. The Outsider (American, Child, AI)
  **Verdict:** This is a **Pragmatic Misfire**, not a lie.
  **Why:** A lie requires intent to deceive. If the speaker uses a Ritual Token assuming Shared Context, they are not deceiving; they are performing a ritual.
  *   **If the speaker *knows* the hearer is an outsider:** Using the token becomes negligence or aggression. The speaker is forcing the outsider to play a game they don't know, trapping them in the double-bind. In this specific sub-case, it edges toward deception because the speaker knows the uptake will be literal.
  *   **If the speaker *does not know*:** It is a simple cultural mismatch. The utterance functions as a "failed ritual." For the outsider (or AI transcript), the sentence remains a Propositional Claim because they lack the key to decode it as a Token. In a contract dispute (your third case), the court acts as an "Outsider." It strips the context and adjudicates the Proposition. The ritual collapses into a literal claim because the institution (law) does not recognize the taboo.

  #### 2. The Half-Hearted Case (Speaker wouldn't mind if taken up)
  **Verdict:** This is the **Sincerity Threshold**. The phenomenon dissolves into a **Weak Commitment**.
  **Why:** The defining feature of the Ritual Token is that fulfilling it would be *costly* or *undesirable* (hence the need for the ritual).
  *   **The Test:** If the guest says "The 14th," and the host thinks, "Oh, actually, the 14th works fine," then the utterance was not a Ritual Token; it was a vague invitation that accidentally became specific.
  *   **The Line:** The phenomenon exists only if fulfilling the literal promise would violate the speaker's *Honne* (true feeling) to the point where they would need to lie to escape it. If the speaker is indifferent to the fulfillment, it is not a ritual; it is merely low-stakes planning. The "sting" you described (the host being "trapped") is the necessary condition. No trap, no ritual.

  #### 3. The Written Record (Email read by a third party)
  **Verdict:** This is **Decontextualization**. The Token becomes a **Proposition**.
  **Why:** Ritualized Indirection is strictly **Oral and Ephemeral**. It relies on the immediate presence of the participants to sustain the "Unacknowledged Common Ground."
  *   **Writing:** Freezes the utterance. It removes the tone, the timing, and the mutual gaze that signal "this is a token."
  *   **Third Party:** A third party (like a lawyer or a new manager) has no stake in the Relational Validity between the original speakers. They judge only Propositional Truth.
  *   **The Consequence:** When a Ritual Token is written and read by an outsider, it *becomes* a lie (or a binding promise) because the protective frame is gone. This is why high-context communicators often fear email; it turns their "social lubricant" into "evidence."

  ### Summary for your Students

  To teach this without getting bogged down in theory, you can frame it as **"The Glass Wall."**

  *   **The Utterance** is written on the glass.
  *   **The Literal Meaning** is on one side.
  *   **The Relational Meaning** is on the other.
  *   **The Convention** is that we look *through* the glass to see the relationship, not *at* the glass to read the text.
  *   **The Offense:**
      *   The Dutch guest wipes the glass to read the text clearly (Literal Uptake). Now they can't see the relationship.
      *   The Host points at the glass and says "This is just glass" (Explication). Now everyone is looking at the glass, and the relationship vanishes.

  The phenomenon stops existing when the glass breaks (writing/third parties) or when the people don't agree there is glass (cultural mismatch). Your glossary entry should emphasize that this is a **jointly maintained fiction** that collapses under scrutiny.
