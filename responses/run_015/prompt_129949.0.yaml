answer: |-
  1. **Board Work & Order:** Write "Axiom = Move Rule" (not Truth) and "Consistent = No Derivable Contradiction" (not Sensible). You must break "Truth" first. If axioms are truths, inconsistency implies reality is broken. If axioms are rules, inconsistency means the game is unplayable. You must establish "Formal Derivation" before "Consistent" means anything; otherwise, they'll judge consistency by intuition, not proof.

  2. **Carrying Example:** "TileWorld". Axioms: (1) Tiles are Red/Blue. (2) Neighbors differ. (3) Specific connectivity (odd cycle). The contradiction requires 3-4 derivation steps (parity argument). It must not involve self-reference (no "this tile describes itself"). You want them to see contradiction as a syntactic crash, not a semantic paradox like Russell's.

  3. **Misconceptions:**
     *   **Gödel:** Address immediately after the example. Incompleteness is about unprovable truths, not contradictions.
     *   **Discovery:** Explain Explosion ($A \land \neg A \vdash \text{Anything}$). If inconsistent, we'd have proved $1=0$ already.
     *   **Local Fix:** Explosion makes it global. Choosing an axiom to drop is pragmatic, not dictated by logic.
     *   **Bridges:** Engineering uses applied models, not raw foundational axioms.

  4. **Friend's Tip:** It's correct (e.g., $PA + \neg \text{Con}(PA)$). Use it as the closer. It separates consistency (syntax) from truth (semantics). Say: "A system can be consistent yet falsely prove it isn't." This cements the distinction you care about.

  5. **Refusal:** Explicitly skip *how* we test consistency (Model Theory) and Paraconsistent Logic. Say: "That's a different course."

  6. **Assessment Question:** "If ZFC proves $0=1$, does arithmetic break, or is ZFC just the wrong rulebook?" (Correct answer: Wrong rulebook).
