prompt: |-
  The debate over Karl Popper's assessment of Darwinism has been stuck for decades. Interpreters cite his claim that natural selection is a metaphysical research program—not because it is false, but because it seems able to accommodate any possible evolutionary outcome without risking empirical refutation. Defenders of evolutionary biology counter that this charge rested on a misunderstanding of how selection generates risky predictions about genetic drift patterns or the absence of specific transitional forms. Popper later wrote that he had been wrong, yet scholars still dispute whether that recantation addressed the core logical point or merely conceded a sociological one. Meanwhile, some philosophers of science now argue that the real issue was never falsifiability in Popper's strict sense but a hidden disagreement about whether historical uniqueness—the fact that evolutionary paths do not repeat—can ever satisfy a criterion designed for universal laws. I want a diagnosis of why this debate has stalled. Is it verbal, turning on different uses of the word scientific? Is it substantive, about what counts as a risky prediction in a historical science? Or are the sides answering different questions—one about logical structure, one about methodological practice—under the single heading of Popper versus Darwinism? Given your diagnosis, what would count as progress: a formal model of predictive risk for unique histories, a conceptual distinction both sides accept, or an argument that the question is ill-posed? Please answer in American English.
