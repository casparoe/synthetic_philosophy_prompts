answer: |-
  The debate over Popper and Darwinism has stalled primarily because the opposing sides are answering **different questions** under the single heading of "falsifiability." It is not merely a verbal dispute over the definition of "scientific," nor is it purely substantive disagreement about biological facts. Rather, it is a category error resulting from the conflation of **logical structure** with **methodological practice**.

  Popper's initial critique addressed the *logical form* of the principle of natural selection. He argued that, in the abstract, "survival of the fittest" risks being a tautology (a logical truth) because "fitness" is often defined retrospectively by survival. From the standpoint of formal logic, a statement that cannot be false is not empirically testable. Popper was analyzing the theory as a closed system of propositions.

  Conversely, evolutionary biologists and their philosophical defenders address *methodological practice*. They point out that in the laboratory and the field, scientists do not test the abstract principle of natural selection in isolation. They test specific models involving specific traits, environments, and genetic markers. These specific hypotheses generate risky predictions (e.g., about the fossil record or antibiotic resistance) that are frequently falsified. The biologists are defending the *utility* and *empirical content* of the research program, not the tautological status of its core definition.

  The debate stalls because Popper's critics assume he is attacking their daily work, while Popper's adherents assume the biologists are missing the logical point. Popper's recantation further muddied the waters because it was ambiguous: he conceded the *sociological* point (that biologists practice science rigorously) without necessarily retracting the *logical* point (that the core principle is metaphysical in isolation).

  Furthermore, the tension regarding **historical uniqueness** highlights why the stall persists. Popper's demarcation criterion was designed for nomological sciences (like physics) that seek universal, repeatable laws. Evolutionary biology is a historical science that seeks causal explanations for unique, unrepeatable sequences of events. Applying a criterion designed for universal laws to a narrative of unique history creates a structural friction that cannot be resolved by simply insisting one side is right.

  ### Path to Progress

  Given this diagnosis, progress will not come from a formal model of predictive risk, as unique historical events resist the kind of statistical regularization required for such a model. Nor will it come from simply insisting the question is ill-posed, which risks dismissing the legitimate logical concerns Popper raised.

  Instead, progress requires a **conceptual distinction** that both sides can accept. Specifically, the debate would advance by distinguishing between:

  1.  **The General Principle of Natural Selection:** Acknowledged as a "meta-law" or framework assumption that is difficult to falsify in isolation (validating Popper's logical insight).
  2.  **Specific Evolutionary Hypotheses:** The concrete models derived from the principle that make risky, falsifiable predictions about data (validating the biologists' methodological defense).

  This distinction aligns with the work of contemporary philosophers like Elliott Sober, who argue that while the *general* claim that "organisms are adapted" is hard to test, *contrastive* claims (e.g., "Trait A evolved via selection rather than drift") are highly testable. By accepting that the "scientific" status of evolutionary biology rests on the testability of the second category, even if the first category functions as a metaphysical framework, the debate moves past the binary of "science vs. metaphysics." This allows scholars to retain Popper's logical rigor without undermining the empirical legitimacy of evolutionary biology.
