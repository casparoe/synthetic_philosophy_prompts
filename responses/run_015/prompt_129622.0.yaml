      *   *Refining the "Error Rate":* This is a *calibration constraint on the institution*. It ensures that among all claims labeled "significant," the false discovery rate is bounded. This is useful for consumers who cannot model the researcher's mind.

      *   *Key Insight to emphasize:* The Likelihood Principle holds for *fixed* experiments. It fails when the *experiment definition* is a function of the data. The frequentist isn't caring about "data not got"; they are caring about the *rule that determined which data was got*. In Bayesian terms, this is the *prior over the experimenter's stopping/selection rule*.

