  | Point of Divergence | Realist Position | Instrumentalist Position |
  | :--- | :--- | :--- |
  | **Ontological Status** | Belief attributions track causal internal states existing independent of the observer's model. | Belief attributions are compressive modeling tools valid only relative to observer utility. |
