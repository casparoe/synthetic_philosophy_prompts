answer: |-
  ### Architect's Note: Failure Mode Analysis
  Before presenting the procedure, I have stress-tested the logic against the specific constraints you provided. Here are the failure modes I designed this to avoid, and how the procedure mitigates them:

  1.  **The "Motive Trap" (Libel Risk):** You cannot prove someone *intends* to deceive.
      *   *Mitigation:* The procedure evaluates **methodological integrity** and **rhetorical function**, not intent. We judge the *effect* of the argument (exculpation), not the *heart* of the arguer.
  2.  **The "Generalist Trap" (Competence Risk):** You cannot adjudicate demographic models or archival paleography.
      *   *Mitigation:* Hard "Stop Rules" trigger when the dispute becomes technical rather than interpretive. If the fight is about census methodology, you punt to a specialist.
  3.  **The "Statutory Trap" (Authority Risk):** You cannot defer to state laws defining history (e.g., laws criminalizing denial).
      *   *Mitigation:* The procedure defines "Consensus" as *trans-national scholarly consensus*, explicitly decoupling it from domestic law or state curricula.
  4.  **The "Partisan Blindness" (Credibility Risk):** You cannot apply stricter scrutiny to opponents than allies.
      *   *Mitigation:* The "Asymmetry Check" is mandatory. If the subject does not apply their own standards to their own side, the procedure downgrades their credibility regardless of the specific claim.
  5.  **The "Semantic Dodge" (Precision Risk):** Debates over the word "genocide" can be legitimate legal arguments or moral minimization.
      *   *Mitigation:* The procedure separates *legal categorization* from *moral description*. Disputing the label is allowed; disputing the underlying moral reality using the label as a shield is flagged.

  ---

  ### The Decision Procedure: The "Atrocity Claim Audit"

  **Instructions:** Run these steps in order. If a "Stop Rule" triggers, halt immediately and follow the handoff instruction. Do not skip steps.

  #### Phase 1: The Existence & Mechanism Test
  *Goal: Determine if the basic reality of the event is being engaged with or erased.*

  **Q1. Does the author deny that the mass death event occurred?**
  *   **Yes:** Verdict: **Hard Denial**. (Stop. Consult Lawyer).
  *   **No:** Proceed to Q2.

  **Q2. Does the author accept the deaths but deny the *mechanism* of intent?**
  *(e.g., "They died, but from disease/starvation/chaos, not policy/order.")*
  *   **Yes:** Proceed to Q3 (The Subtraction Check).
  *   **No:** Proceed to Q4.

  **Q3. (The Subtraction Check) Does the author provide evidentiary support for the shift from "policy" to "chaos," or do they simply assert that chaos is a sufficient explanation?**
  *   **Asserts without evidence / Ignores direct orders documentation:** Flag as **Denialist Function**. Proceed to Q6.
  *   **Provides archival counter-evidence:** Proceed to Q4.

  #### Phase 2: The Methodology & Consensus Test
  *Goal: Determine if the claim is a legitimate revision or an outlier without foundation.*

  **Q4. Is the claim primarily about numbers (death toll) or categories (genocide vs. war crime)?**
  *   **Numbers:** Proceed to Q5.
  *   **Categories:** Proceed to Q7.

  **Q5. (The Number Fighter Stop Rule) Is the author challenging a demographic estimate by more than 50% using non-peer-reviewed sources (blogs, self-published books, think tank briefs)?**
  *   **Yes:** **STOP.** Do not evaluate the math yourself. This is a **Specialist Handoff**. You cannot verify this on deadline.
  *   **No (Peer-reviewed / Minor adjustment):** Proceed to Q6.

  **Q6. Does the author's bibliography rely heavily on sources that have been debunked by the specialist consensus, or do they engage with the leading counter-arguments?**
  *   **Relies on debunked sources / Ignores counter-arguments:** Flag as **Methodologically Compromised**. Proceed to Q8.
  *   **Engages with leading scholarship:** Proceed to Q8.

  #### Phase 3: The Asymmetry & Function Test
  *Goal: Determine if the scrutiny is a tool for truth or a weapon for defense.*

  **Q7. (The Legal Category Dodge) If arguing about the term "genocide," does the author acknowledge the moral severity of the acts while disputing the legal label?**
  *   **Yes (Acknowledges severity):** Verdict: **Legitimate Legal/Historical Debate**.
  *   **No (Implies lesser severity because label doesn't fit):** Flag as **Minimization**. Proceed to Q8.

  **Q8. (The Asymmetry Check) Look at the author's past 5 years of public writing. Do they apply the same standard of evidentiary demand to atrocities committed by their own nation/ideological side as they do to the one they are currently analyzing?**
  *   **Yes (Consistent skepticism):** Weight this toward **Legitimate Debate**.
  *   **No (Ferocious skepticism only for the "enemy"):** Weight this toward **Denialist Function**.
  *   **Cannot Determine (Not enough public record):** Mark as **Unknown Variable**. Do not let this pass the claim; treat the claim as unverified.

  #### Phase 4: The Verdict Calculation
  *Combine the flags from above.*

  *   **Hard Denial:** Q1 = Yes.
  *   **Soft Denial (Denialist Function):** Q2/Q3 + Q6 + Q8 (Asymmetry) = Positive flags.
  *   **Bad History / Error:** Q6 (Methodologically Compromised) but no evidence of systematic minimization.
  *   **Legitimate Debate:** Q4/Q7 (Categories) + Q8 (Symmetry) + Q6 (Engages scholarship).
  *   **Handoff Required:** Q5 (Stop Rule) or Legal Risk (Q1).

  ---

  ### Stop Rules & Handoffs

  **1. The Technical Demography Stop (Q5)**
  *   **Trigger:** A dispute over death tolls >50% variance using technical demographic arguments.
  *   **Action:** Do not write "X is lying." Do not write "X is right."
  *   **Handoff:** Email two specialists (one mainstream, one heterodox if possible) with the specific methodological critique. Ask: "Is this method accepted in the field?"
  *   **Deadline Workaround:** If you cannot get a reply, you must write: "X claims the number is Y. Mainstream scholarship estimates Z. X's methodology has not been peer-reviewed in [relevant journal]."

  **2. The Legal Libel Stop (Q1)**
  *   **Trigger:** You are about to use the word "Denier" or "Holocaust Denial" (or equivalent) about a living person.
  *   **Action:** Send to Legal.
  *   **Reason:** In some jurisdictions, this is a factual allegation of misconduct, not opinion.

  **3. The State Law Conflict (Constraint 4)**
  *   **Trigger:** The claim contradicts a state-mandated historical narrative (e.g., a country criminalizing recognition of a genocide).
  *   **Action:** Ignore the state law in your evaluation. Rely on **Trans-National Scholarly Consensus** (e.g., International Association of Genocide Scholars, major university press histories).
  *   **Wording:** "While [Country] law defines the event as X, the international historical consensus classifies it as Y."

  ---

  ### Verdict Wording Guide

  **Verdict: Hard Denial**
  *   *Write:* "X's claim contradicts the established evidentiary record regarding the occurrence of the event."
  *   *Avoid:* "X is a liar." (Motive).
  *   *Avoid:* "X is a denier." (Unless Legal clears it).
  *   *Use:* "This position is rejected by the overwhelming majority of specialists in the field."

  **Verdict: Soft Denial (Denialist Function)**
  *   *Write:* "While X accepts the death toll, their reframing of the cause shifts responsibility from perpetrators to circumstance, a rhetorical move consistent with historical minimization."
  *   *Use:* "This argument functions to exculpate..." (Focus on function, not mind).

  **Verdict: Bad History / Not Denial**
  *   *Write:* "X's analysis relies on outdated data and fails to engage with recent scholarship. While not denialist, the conclusion is unsupported by current evidence."
  *   *Use:* "Methodologically unsound" rather than "Ideologically driven."

  **Verdict: Legitimate Debate**
  *   *Write:* "X challenges the categorization of the event. While the consensus holds Y, X argues Z based on [specific legal/historical distinction]. This remains a contested area of interpretation."
  *   *Use:* "Scholars debate..." "The definition remains contested..."

  **Verdict: Handoff / Unknown**
  *   *Write:* "X disputes the standard demographic model. This claim requires technical demographic verification beyond the scope of this column."

  ---

  ### Simulation: Running the Composites

  I will run two of your composites through the procedure. One is designed to pass, one to fail (including an unwelcome verdict).

  #### Simulation A: The "Denial by Subtraction" (Composite 2)
  *Subject:* A pundit arguing a known massacre was "collateral damage of urban combat" rather than "executions," despite available orders.
  *   **Q1 (Existence):** No, admits deaths occurred. -> *Proceed.*
  *   **Q2 (Mechanism):** Yes, claims deaths were "chaos/combat" not "policy." -> *Proceed to Q3.*
  *   **Q3 (Subtraction Check):** Does he provide evidence? He cites "fog of war" generally but ignores specific archival orders released in 2010 documenting execution protocols. -> *Flag: Denialist Function.*
  *   **Q4 (Numbers/Cat):** Category dispute. -> *Proceed to Q7.*
  *   **Q7 (Legal/Moral):** Does he acknowledge moral severity? He argues "war is hell" and implies the moral distinction is negligible. -> *Flag: Minimization.*
  *   **Q8 (Asymmetry):** Check past work. When his side's allies committed atrocities, he demanded "proof of specific intent." Here, he assumes intent is impossible to prove. -> *Flag: Asymmetry.*
  *   **Verdict:** **Soft Denial (Denialist Function).**
  *   **Wording:** "While the author acknowledges the deaths, his dismissal of documented command structures reframes systematic execution as unfortunate chaos. Coupled with a disparate standard of evidence applied to opposing factions, this argument functions to minimize perpetrator responsibility."

  #### Simulation B: The "Number Fighter" on My Side (Composite 1 + 5 Hybrid)
  *Subject:* A respected historian allied with the journalist's political worldview. They publish a book arguing a crime committed by the *opposing* political faction was 80% smaller than the consensus view. They use census data, but it is self-published.
  *   **Q1 (Existence):** No, admits event happened. -> *Proceed.*
  *   **Q2 (Mechanism):** No, admits it was a crime. -> *Proceed.*
  *   **Q4 (Numbers/Cat):** Numbers. -> *Proceed to Q5.*
  *   **Q5 (Stop Rule):** Is the variance >50%? Yes (80% reduction). Is it peer-reviewed? No (Book/Website).
  *   **Action:** **STOP. Specialist Handoff.**
  *   **The Unwelcome Result:** I contact a specialist. They reply: "This census data is known to be incomplete for that region; the author ignores the correction factors established in 1995. This is not accepted methodology."
  *   **Verdict:** **Bad History / Methodologically Compromised.** (Not necessarily "Denial" because they admit the crime, but the claim is false).
  *   **Wording:** "Although Professor X is a respected voice on [Topic], their demographic revisionism in this instance relies on uncorrected census data that demographers have long flagged as incomplete. The claim reduces the toll significantly but lacks the methodological rigor required to overturn the current consensus."
  *   **Why this hurts:** It forces you to critique an ally using the same tool you'd use on an enemy. The procedure bites.

  ---

  ### Meta-Analysis: Tests vs. Judgment Calls

  Your editor will ask which parts of this are objective and which are you making a call. Be honest with them.

  **Genuine Tests (Objective):**
  *   **Q1 (Existence):** Binary. Either they say it happened or they don't.
  *   **Q5 (Stop Rule):** Binary. Is it peer-reviewed? Is the variance >50%?
  *   **Q7 (Moral Acknowledgement):** Textual. Do the words "moral crime" or "atrocity" appear alongside the legal objection?

  **Judgment Calls (Subjective/Interpretive):**
  *   **Q3 (Sufficiency of Evidence):** You are deciding if their explanation for "chaos" is plausible. *Defense:* "I am comparing their claim against the primary sources they themselves cite."
  *   **Q6 (Engagement with Scholarship):** You are deciding if they "ignored" a counter-argument. *Defense:* "I checked the bibliography against the three standard texts in the field."
  *   **Q8 (Asymmetry):** This is the most subjective. You are inferring a pattern. *Defense:* "This is not about their soul; it is about the consistency of their public methodology. Inconsistent methodology produces unreliable history."

  ---

  ### Limitations: Where The Procedure Fails

  Do not use this tool in the following situations. It will break, and you will get burned.

  1.  **The "Living Memory" Trap:** If there are survivors still living who contradict the "consensus," the procedure's reliance on "scholarly consensus" looks like elitism.
      *   *Fix:* In these cases, "Consensus" must include oral history archives, not just academic papers.
  2.  **The "Emergent Atrocity":** You cannot run this on events that happened last year. There is no consensus, no peer review, and no asymmetry track record.
      *   *Fix:* Default to "Alleged" and "Under Investigation." Do not use historical labels for current events.
  3.  **The "State-Sponsored Science":** If the "Specialist Consensus" is itself corrupted by state funding (e.g., historians employed by the regime denying the atrocity), Q6 and Q8 will fail.
      *   *Fix:* You must verify the *independence* of the consensus. Look for scholars in exile or international bodies. If you cannot verify independence, you must write: "There is no independent consensus on this event."
  4.  **The "Motive" Leak:** If you slip and write "They *want* to hide the truth," you lose the libel shield.
      *   *Fix:* Stick to "The *effect* of this argument is to hide the truth."

  ### Final Advice for the Deadline
  When you are three hours from print and the text is ambiguous: **Default to describing the method, not the verdict.**
  *   *Bad:* "This is denialism."
  *   *Good:* "This argument relies on evidence that has been rejected by the majority of archivists working on this period."

  This protects you legally, protects the truth historically, and protects your integrity professionally. It forces the reader to see *why* the claim is weak, rather than just telling them it is weak.
