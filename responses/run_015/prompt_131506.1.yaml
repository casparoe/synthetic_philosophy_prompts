      *   *Legal-Category:* Distinguish between "legal genocide" and "colloquial genocide." If they use the legal definition to say "no moral crime occurred," that's denial. If they say "legal term doesn't fit, but moral crime did," that's debate.
      *   *State Ownership:* Rely on *trans-national scholarly consensus*, not domestic law.
      *   *Contrarian/Partisan:* The Asymmetry Check is the key here.

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the stakes. Set the frame (methodology over motive).
      *   *The Procedure:* Numbered steps with "If Yes/No" branching.
      *   *Stop Rules:* Explicit points where the journalist must pause.
      *   *Verdict Wording:* Specific phrases for the column.
      *   *Running the Composites:* Select Case 2 (Subtraction) and Case 1 (Number Fighter - the unwelcome verdict scenario).
      *   *Limitations:* Where this breaks down.

  7.  **Refining the "Asymmetry Check":**
      *   It's not proof of falsehood. A liar can tell the truth. But it proves *ideological deployment*.
      *   Need to be clear: If they only scrutinize *enemy* atrocities, it suggests the scrutiny is a weapon, not a tool.

  8.  **Refining the "Consensus" Definition:**
      *   How does a journalist find consensus in a few hours?
      *   Look for survey literature, major academic associations, textbooks used in universities (not high schools), and citations in peer-reviewed journals vs. opinion pieces.

  9.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is this too complex for a deadline?
      *   *Fix:* Simplify the branching. Make the "Stop Rules" prominent.
      *   *Critique:* Did I address the "State Ownership" issue?
      *   *Fix:* Ensure Step 4 explicitly prioritizes scholarly consensus over statutory definition.
      *   *Critique:* The user asked for "unwelcome verdict."
      *   *Fix:* In the simulation, I need to show a case where the procedure flags *their* side's hero as engaging in denialist tactics.

  10. **Final Polish:**
      *   Check tone: Professional, direct, no platitudes.
      *   Check constraints: No mind-reading, desk-based, defensible.
      *   Check deliverables: Questions, Verdicts, Simulations, Limitations.

  *(Self-Correction on the "Unwelcome Verdict"):* I need to make sure I don't just simulate a "bad guy." I need to simulate a case where the journalist *wants* to defend the subject, but the procedure says "No." Let's use the "Contrarian on my side" case (Case 5) or a "Number Fighter" who is otherwise reputable. Let's go with a "Number Fighter" who is on the journalist's ideological side but using bad methods. That hits the "my own side" constraint hard.

  *(Refining the "Legal Category" distinction):* This is tricky. The procedure needs to separate "Legal precision" from "Moral minimization."
  *   Test: Does the author acknowledge the moral severity while disputing the legal label? If yes -> Debate. If no (implies less severity because of label) -> Denialist function.

  *(Final Review of Failure Modes):*
  *   *Failure:* Relying on "Consensus" when consensus is politically corrupted (e.g., Lysenkoism).
  *   *Mitigation:* Look for *international* and *cross-ideological* consensus, not just state-approved history.
  *   *Failure:* The "Generalist Trap."
  *   *Mitigation:* Hard stop rule on technical demographic disputes.

