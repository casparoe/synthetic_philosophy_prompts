      *   The "State Ownership" constraint is crucial: Truth cannot be defined by statute. The procedure must rely on *scholarly consensus*, not *legal statute*.
      *   The "Asymmetry Check" is a heuristic for bias, not proof of falsehood, but highly indicative of denialist *function*.

  3.  **Brainstorming Failure Modes (Pre-Drafting):**
      *   *False Positive:* Labeling a legitimate heterodox historian a "denier" because they challenge a sacred cow number. (Risk: Chilling legitimate inquiry).
      *   *False Negative:* Letting a sophisticated denialist pass because they use the right legalistic language ("technically not genocide"). (Risk: Amplifying harm).
      *   *The "Motive" Trap:* Trying to prove they *hate* the victim group. (Impossible to prove from text alone).
      *   *The "Consensus" Trap:* Assuming consensus is always right (e.g., Cold War era Soviet history). Need to distinguish between *political* consensus and *evidentiary* consensus.
      *   *The "Generalist" Trap:* The journalist trying to adjudicate demographic models they don't understand. (Need a "Stop Rule" for technical disputes).
      *   *The "Partisan" Trap:* Applying the test only to the "other side." (Must be universal).

  4.  **Developing the Decision Procedure (The "Algorithm"):**
      *   *Phase 1: The Threshold.* Is this a claim about an established historical event?
      *   *Phase 2: The Method.* Are they engaging with evidence or ignoring it?
      *   *Phase 3: The Function.* What is the rhetorical effect? (Minimization, Exculpation).
      *   *Phase 4: The Asymmetry.* Do they hold their side to the same standard?
      *   *Phase 5: The Stop Rules.* When to call a specialist/lawyer.

      *Refining the Steps:*
      *   Q1: Existence. Do they deny the event occurred? (Easy Denial).
      *   Q2: Mechanism. Do they deny the *mechanism* of harm (intent vs. accident)? (Denial by Subtraction).
      *   Q3: Evidence. Do they cherry-pick? Do they reject primary sources that contradict them without counter-evidence?
      *   Q4: Consensus. How does this relate to the specialist consensus? (Crucial for the "Number Fighter").
      *   Q5: Asymmetry. (The bias check).
      *   Q6: Legal/Category. Is this a semantic argument or a substantive one?

      *Verdicts:*
      *   V1: Hard Denial.
      *   V2: Soft Denial (Revisionist/Denialist boundary).
      *   V3: Bad History/Error.
      *   V4: Legitimate Debate.
      *   V5: Legal/Political Question (Handoff).

  5.  **Addressing the Hard Cases:**
      *   *Number Fighter:* Distinguish based on *methodology* (peer review vs. website) and *magnitude* (adjustment vs. erasure).
