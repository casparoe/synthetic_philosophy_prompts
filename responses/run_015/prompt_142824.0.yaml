answer: |-
  You have not found a glitch in your committee; you have found the load-bearing wall of local identity. What you are describing is a specific, structurally distinct phenomenon. It is not "collective memory" (which is too broad), nor is it a "lie" (which implies intent to deceive).

  The established concept that comes closest is the **Legal Fiction**, but applied to sociology and memory. In law, a fiction is a premise known to be false (e.g., "a corporation is a person," "the King never dies") that is *accepted* as true for the purpose of making the system function. If you prove the King is mortal, the legal continuity of the state doesn't update; it collapses.

  However, "Legal Fiction" feels too technical for a village clock. For your specific context—a narrative that constitutes a social reality rather than describing a historical one—the precise term is a **Constitutive Fiction**.

  Here is the carving you asked for.

  ### 1. The Core Mechanism: Acceptance vs. Belief
  To understand why this isn't just a "false belief," you need the distinction between *belief* and *acceptance* (philosophically articulated by L. Jonathan Cohen and others).
  *   **Belief** is a cognitive state: "I hold this to be true about the world." It is involuntary and aims at truth.
  *   **Acceptance** is a practical stance: "I will use this as a premise for reasoning and action." It is voluntary and aims at utility.

  In your cases, the committee members do not *believe* the stories (they know the minutes/logs contradict them). They *accept* them. The story is not a claim about 1890 or 1968; it is a **premise for present-day action**.
  *   **Clock Story:** Premise for "We are the stewards of worker solidarity."
  *   **Flood Story:** Premise for "We are the aggrieved party entitled to refuse cooperation."

  When you suggest correcting the story, you are treating it as a *belief* (which can be updated with evidence). They are treating it as an *acceptance* (which cannot be updated, only abandoned). That is why the reaction is panic, not correction. You aren't fixing a fact; you are pulling a load-bearing beam.

  ### 2. Differentiation from Neighbors
  Here is how a **Constitutive Fiction** differs from the things it resembles:

  *   **Vs. Ordinary False Belief:** If a group believes the clock was paid by workers because they misread the minutes, showing them the minutes fixes the belief. The story updates. With a Constitutive Fiction, the evidence *destroys* the practice.
  *   **Vs. Myth/Legend:** Myths usually claim sacred truth. If you tell a religious group their founder didn't walk on water, they may double down on belief. With a Constitutive Fiction, the group *concedes* the falsity privately ("individually they'll concede the logs are probably right"). The power lies in the *public performance*, not the private conviction.
  *   **Vs. Propaganda/Lie:** A lie requires a deceiver and a deceived. Here, everyone is complicit. It is an **open secret**. The mill owner's name is in the minutes, accessible to all. The fiction survives not because the truth is hidden, but because the truth is *socially inert*.
  *   **Vs. Outdated History:** History is archival; it can be revised without breaking the present. If you find out a battle was in 1814 not 1815, you change the plaque. If you find out the workers didn't pay for the clock, you stop the ceremony. History tolerates correction; Constitutive Fictions do not.

  ### 3. The Edges and Boundary Cases
  You asked where the boundaries lie.

  *   **If nobody has checked the record:** It is currently a **Folk Belief**. It becomes a Constitutive Fiction only when the falsity is *knowable* but *bracketed*. The moment the minutes are read and the story *continues*, it shifts from error to fiction.
  *   **If the story turns out to be true:** It ceases to be a fiction and becomes **History**. The "work" it does might remain, but its structural nature changes. It is now robust to correction.
  *   **If the stance could be defended from the accurate record:** This is the critical test. In the flood case, if the valley authority *did* open the sluices, the grievance is historical. If they *didn't*, but the valley still needs protection from them, the grievance is *strategic*. If you can derive the same refusal to cooperate from the true logs ("They didn't flood us then, but their current proposal is bad"), the fiction is **obsolete**. If the refusal *only* makes sense under the false story, the fiction is **essential**.
  *   **If people insist it is literally true when challenged:** This pushes it toward **Dogma**. A healthy Constitutive Fiction relies on a wink—a mutual understanding that we are playing a game. If they start attacking the accountant's integrity or claiming the logs are forged, they are trying to convert the *Acceptance* back into *Belief*. This usually happens when the fiction is under threat. It signals the fiction is becoming fragile.

  ### 4. The Normative Question: Record vs. Memory
  You asked: *If a story like this isn't in the business of stating facts about the past at all, does it even make sense to ask whether the record or the memory should give way?*

  **No, that is the wrong question.** Asking "True or False?" is a category error. The correct question is **"Functional or Dysfunctional?"**

  A Constitutive Fiction is a tool. Like any tool, it can become obsolete or dangerous.
  *   **The Clock:** The fiction licensed "local pride/standing." If the committee stops doing the clock because the story is false, they have decided the *pride* was dependent on the *falsehood*. The tool was flawed.
  *   **The Flood:** The fiction licenses "refusal to cooperate." This is a political tool. If the seat on the joint board remains empty, the valley loses influence. The fiction is now actively harming the group it supposedly protects.

  In the flood case, the fiction has shifted from **Constitutive** (creating a stance) to **Obstructive** (blocking a solution). The argument shouldn't be "The logs are right." The argument should be "This story no longer serves us."

  ### 5. Summary Definition
  If you need a term to use in the room, use **Constitutive Fiction**.

  > **Definition:** A narrative about the past that is collectively accepted as a premise for present-day action, despite being known (or knowable) to be factually incorrect. Its truth-value is irrelevant to its function; its utility is structural. Correcting the facts does not update the narrative but dissolves the social practice it supports.

  **How to use it:**
  Don't say: "This story is false."
  Say: "This is a constitutive fiction. It works only as long as we don't inspect it. Now that we have inspected it, we have to decide: do we need the *feeling* this story gives us more than we need the *accuracy*? If we keep it, we are choosing performance over history. If we drop it, we need to find a new reason to stand under the clock."

  This moves the debate from "Are we liars?" (which causes panic) to "Is this tool still useful?" (which allows for decision). You are not the keeper of the truth; you are the curator of the village's operating system. Sometimes the code needs refactoring.
