  The principle is **intrinsic structure** versus **extrinsic prevention**.

  Your vase, roommate, and factory are all **masked**. The disposition (fragility, panic, recklessness) remains intrinsic; only the manifestation is blocked. The factory *is* reckless; the inspector is a shield, like the vase case. Your roommate *is* panic-prone; the meds are the shield. Consistency demands you label both as having the hidden tendency.

  The dog is different. Training rewires neural pathways—an *intrinsic* change. The bite-disposition is genuinely diminished.

  The wire is a "fink." It loses the disposition exactly when tested. It's not bendable *because* bending triggers stiffening.

  **What would flip my view:** If you argued that long-term masking *becomes* nature. If the factory inspector stays for 50 years, does the culture genuinely reform? If sustained external constraint reshapes internal culture or biology, the mask becomes the face. Prove the inspector changes the *intent* rather than just the *outcome*, and the factory stops being reckless.
