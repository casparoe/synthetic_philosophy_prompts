      *   The Landscape (Brainstormed objections).
      *   The Deep Stress-Test (The Top 3).
      *   The Falsifiability/Qualification Question.
      *   The Ranking & Verdict.

  *(Self-Correction on "Fatal"):* In philosophy, "fatal" is strong. I should frame it as "theoretically fatal if X is proven." I will argue that the Subject-Summing problem is the closest to fatal because it attacks the internal logic.

  *(Self-Correction on Whitehead):* Whitehead denies "enduring substances." The combination isn't spatial stacking; it's temporal concrescence. I must ensure the objection addresses *process* combination, not just Lego-block combination.

