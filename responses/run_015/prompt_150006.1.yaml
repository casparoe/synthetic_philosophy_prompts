answer: |-
  ### Desiderata for a Contractualist Resolution of the Aggregation Problem

  To evaluate competing resolutions to the aggregation problem within a Scanlonian framework, a theory must satisfy the following five desiderata. Each specification includes the target phenomenon, the conceptual distinction to be preserved, and the status of the requirement relative to contractualism's core commitments.

  **1. Individual Anchoring (The Separateness of Persons)**
  *   **Phenomenon:** The standard rescue scenario (e.g., saving five strangers vs. one stranger). The theory must explain why we do not simply sum the disutility of death across the five to outweigh the one.
  *   **Distinction:** Between a *collective loss* (a group suffering a sum of harms) and *individual losses* (five distinct individuals each suffering a harm).
  *   **Status:** **Non-negotiable.** This is the defining commitment of contractualism. If a resolution treats the five as a single entity bearing a aggregated burden, it collapses into utilitarianism and abandons the contractualist insistence that justification is owed to individuals, not collectives.

  **2. Pairwise Integrity (The Justifiability Constraint)**
  *   **Phenomenon:** The standard rescue scenario and cases of asymmetric interdependence (e.g., where saving a group requires violating a specific right of one individual, rather than a generic harm).
  *   **Distinction:** Between *direct pairwise relations* (comparing the complaint of specific individual A against specific individual B) and *indirect or global relations* (comparing the total state of affairs).
  *   **Status:** **Non-negotiable.** Scanlon's framework rests on the idea that a principle is justified if no individual could reasonably reject it based on their personal situation. If the resolution bypasses the comparison of individual complaints in favor of outcome comparison, it violates the structural logic of reasonable rejection.

  **3. Numerical Sensitivity (The Aggregation Intuition)**
  *   **Phenomenon:** The standard rescue scenario where the harm is identical (death) but the number of victims differs.
  *   **Distinction:** Between the *weight of a single reason* (how bad death is for one) and the *aggregative force* of multiple reasons (how the presence of others with the same reason alters the justification).
  *   **Status:** **Negotiable.** While most moral intuitions demand that numbers count (saving five is required over one), Taurek-style contractualists deny this. However, for a resolution to be adequate for the majority of contractualists, it must accommodate this intuition without violating Individual Anchoring.

  **4. Non-Identity Robustness**
  *   **Phenomenon:** Intergenerational cases where policy choices determine which specific individuals come into existence (e.g., depleting resources now creates a larger future population with lower quality of life vs. conserving resources creates a smaller future population with higher quality of life).
  *   **Distinction:** Between *harm-based complaints* (I am worse off than I would otherwise be) and *existence-based complaints* (I exist, but my existence is the result of a principle that others could reject).
  *   **Status:** **Non-negotiable.** A moral theory intended to govern principles of action must apply to future generations. If the pairwise constraint renders the theory silent on non-identity cases because no specific future individual is "worse off" than they would have been otherwise, the theory fails as a comprehensive moral framework.

  **5. Structural Sensitivity (Asymmetric Interdependence)**
  *   **Phenomenon:** Cases where harms are not independently distributed (e.g., a rescue operation where saving five requires imposing a certain harm on one specific person, whereas saving one requires imposing a different harm on a different specific person, and the harms are causally linked).
  *   **Distinction:** Between *independent claims* (five people drowning separately) and *interdependent claims* (where the satisfaction of one claim structurally precludes the satisfaction of another in a non-aggregative way).
  *   **Status:** **Non-negotiable.** Contractualism focuses on the specific reasons individuals have for rejection. If a resolution relies on abstract numbers without attending to the specific structural relations between the agents and victims, it fails to capture the relational nature of contractualist justification.

  ***

  ### The Joint Unsatisfiability Tension

  There is a significant tension between **Pairwise Integrity**, **Numerical Sensitivity**, and **Non-Identity Robustness**. Given Scanlon's commitment to Pairwise Integrity, a principle is rejected only if a specific individual has a reasonable complaint based on being worse off under that principle than under an alternative. In standard aggregation cases, Numerical Sensitivity requires that the *number* of people with complaints matters, even if the *strength* of each individual complaint is identical. This is difficult to square with Pairwise Integrity without implicitly summing complaints (violating Individual Anchoring).

  However, the tension becomes acute when adding Non-Identity Robustness. In non-identity cases, there is no specific individual in the "larger group" scenario who is worse off than they would have been in the "smaller group" scenario, because they would not have existed in the alternative. Strict Pairwise Integrity yields no complaint for these individuals. To satisfy Numerical Sensitivity (saving the larger future group) and Non-Identity Robustness, one must allow complaints to be registered by individuals who are not strictly "worse off," or aggregate the claims of possible persons. This forces a choice: either relax Pairwise Integrity (allowing non-worse-off complaints or group-based comparisons) or abandon Numerical Sensitivity in intergenerational contexts. One cannot maintain strict Scanlonian pairwise justifiability, satisfy the intuition that numbers count in rescue cases, and handle non-identity cases without modifying the unit of moral comparison.

  ***

  ### Scorecard of Competing Approaches

  **Scanlon's Own View (Weighted Reasons/Relevant Groups)**
  Scanlon's approach fares well on Individual Anchoring and Pairwise Integrity by insisting that numbers count only insofar as they affect the strength of an individual's reason to reject a principle (e.g., via probability or "relevant groups"). It preserves the Separateness of Persons by refusing to sum utilities. However, it struggles with Non-Identity Robustness, as the pairwise comparison mechanism often fails to generate a complaint for future persons who are not made worse off relative to their non-existence. Furthermore, the "relevant groups" distinction can appear ad hoc when applied to Asymmetric Interdependence, as it is not always clear how to individuate groups without appealing to the very aggregative intuitions the theory seeks to ground.

  **Taurek's Position (Numbers Do Not Count)**
  Taurek's view satisfies Individual Anchoring and Pairwise Integrity perfectly, perhaps better than any other view, by refusing to aggregate claims across persons. It treats every individual's loss as incomparable in sum to another's. However, it fails decisively on Numerical Sensitivity, contradicting the robust intuition that saving five is morally required over saving one. It also faces difficulties with Structural Sensitivity; by treating all losses as isolated, it lacks the resources to explain why we might prioritize a group in cases of interdependent harm where the structural cost of saving the one is disproportionately high. It remains a consistent but counterintuitive application of contractualist individualism.

  **Threshold-Sensitive Contractualism**
  This approach attempts to satisfy Numerical Sensitivity and Non-Identity Robustness by allowing aggregative force to kick in once a threshold of harm or number of claimants is reached. It succeeds where Scanlon struggles on intergenerational cases by allowing the sheer number of affected future lives to generate a reasonable rejection. However, it risks violating Individual Anchoring and Pairwise Integrity. If the threshold functions merely as a proxy for summation, the view collapses toward utilitarianism. If the threshold changes the unit of comparison from the individual to the group, it compromises the core contractualist commitment that justification is owed to each person separately. It balances the desiderata but at the cost of conceptual purity regarding the separateness of persons.
