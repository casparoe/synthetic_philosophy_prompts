      *   (3) *Dynamic inconsistency/Non-EUT:* Good's theorem relies on EUT and dynamic consistency. If preferences change or aren't EUT, the theorem fails. *Tier B* (usually clinicians aim for EUT, but stress/fatigue might alter this).
      *   (4) *Observations change the world:* Good's theorem assumes passive observation. If the test changes the state (e.g., invasive), value can be negative. *Tier B* (Monitoring is usually passive, but alerts trigger actions).
      *   (5) *Strategic settings:* Good's theorem is single-agent. Strategic interaction (Hirshleifer) can make info harmful. *Tier C* (Hospital wards aren't typically game-theoretic in this sense).
      *   (6) *Unbounded expectations:* Technical mathematical issue. Rarely applies to clinical utility. *Tier C.*
      *   (7) *Rule-following/Constrained agents:* If you *must* act on the signal and can't ignore it, you lose the "max" part of the expectation. This violates the "optimal action" assumption. *Tier A* (This is the user's specific concern).
