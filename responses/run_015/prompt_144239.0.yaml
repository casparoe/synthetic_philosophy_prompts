answer: |-
  She will verdict that Nadia doesn't know, running a rule of Attributor Contextualism where the attributor's practical stakes set the epistemic standard for the conversation.

  The pattern in cases 1–7 reveals a hybrid view that prioritizes the context of the knowledge attributor over the subject's internal state. Cases 1 and 2 establish that stakes affect knowledge verdicts, but Case 5 is the diagnostic key: when the subject's stakes are low but the speakers' stakes are high, the verdict splits ("he knows, we don't"). Pure Subject-Sensitive Invariantism (SSI) cannot explain why "we don't know" if the subject's low stakes suffice for knowledge; it treats knowledge as a fixed property of the subject. Case 6 reinforces this: even when the subject is unaware of the stakes, the attributor's awareness raises the standard enough to falsify the knowledge claim. Case 4 clarifies the *content* of the standard: high stakes impose a duty of reasonable inquiry (the "two-minute check"). In the Nadia case, the colleague is the attributor and faces high stakes. Under Attributor Contextualism, the colleague's context sets the standard, which requires the cross-check Nadia skipped. Therefore, relative to the colleague's conversation, Nadia doesn't know.

  However, two other rules fit the initial data reasonably well and diverge on Nadia. First, **Subject-Sensitive Invariantism (SSI)** holds that the subject's own practical situation determines the evidence threshold. This fits Cases 1–4 perfectly but struggles with 5 and 6 unless supplemented with pragmatic explanations about assertion rather than knowledge itself. Second, **Objective Normative Encroachment** posits that the stakes of the *action guided by the belief* set the standard, regardless of who is speaking or what the subject believes. This fits Cases 1–4 and 6, but like SSI, it struggles to explain the "he knows" half of Case 5 without appealing to context shifts.

  The tension you feel between "stakes" and "skipped check" is resolved by seeing the check as the *mechanism* by which stakes bite. Stakes raise the standard; skipping the check is the failure to meet that raised standard. In Nadia's case, the relevant stakes are the colleague's (on the Contextualist reading), so the duty to check was active despite Nadia's personal indifference.

  **Follow-up Case to Separate the Rules:**
  To distinguish Attributor Contextualism from SSI, present a **Reverse-Stakes Case**: Nadia is personally invested (high subject stakes: she loses money if wrong), but the colleague is casual (low attributor stakes: no loss to them, just curious). Nadia skips the easy check.
  *   **Attributor Contextualism predicts:** She **knows** (attributor's low stakes set a low standard; glance suffices).
