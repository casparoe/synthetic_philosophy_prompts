  **The Five Switches:**
  1.  **Plain Leverage:** In the standard infallible case, can your current choice raise your survival probability? (Yes/No)
  2.  **Error Sensitivity:** In the 90% case, does it matter if errors are random or clustered on late-changers? (Yes/No)
  3.  **Coin-Flip Agency:** In the coin-flip (no prediction) case, does your choice determine survival? (Yes/No)
  4.  **Randomizer Value:** In the "unsimulated coin" case, is it worth paying to randomize? (Yes/No)
  5.  **Simulation Identity:** In the plain case, does your choice primarily determine what the *simulation* does? (Yes/No)

  **The Map of Positions:**

  | Position | Plain Leverage | Error Sensitivity | Coin-Flip Agency | Randomizer Value | Sim Identity | Status |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Causal-Style** | No | **Yes** | Yes | No | No | Occupied |
  | **Evidential-Style** | Yes | **No** | Yes | Yes | No | Occupied |
  | **Ratifiability** | Yes | Yes | Yes | **Yes** | No | Occupied |
  | **Resigned** | No | No | **No** | No | No | Occupied |
  | **Sim-Chooser** | Yes | Yes | Yes | Yes | **Yes** | Occupied |
  | **Mechanism-First** | *N/A* | *N/A* | *N/A* | *N/A* | *N/A* | Occupied |
  | **Empty Cell A** | Yes | No | No | No | No | **Incoherent** (If you have leverage in Plain, you must have agency in Coin-Flip). |
  | **Empty Cell B** | No | **Yes** | No | No | No | **Unattractive** (Why care about causal structure of errors if you believe you have no agency?). |

  **The "Identical Advice" Warning:**
  The **Causal-Style** leaf and the **Resigned** leaf both output "It doesn't matter which city you pick" in the Plain Case.
  *   **Causal-Style** says this because the prediction is a fixed fact of the past; your choice cannot causally influence it.
  *   **Resigned** says this because the outcome is metaphysically fixed regardless of causal structure.
  *   *The Tree separates them using the Coin-Flip Case.*

  ***

  ### Part 2: The Decision Tree (Student Handout)

  **Instructions:** Start at the top. Answer the question based on your gut intuition about the specific story provided. Follow the arrow to the next question or to a final position.

  #### **START: The Plain Case**
  *Story:* You are in Damascus. Death is an infallible predictor. He has already written down the city where he will find you at dawn. If you are in that city, you die. If you are in the other, you live.
  **Q1:** Right now, before you pack, is there a specific choice you can make that makes you **more likely to be alive** on Friday than the other choice?
  *   **Yes:** (You believe your choice affects your odds). $\rightarrow$ Go to **Q2**.
  *   **No:** (You believe the outcome is fixed). $\rightarrow$ Go to **Q3**.
  *   **I need to know how he predicted:** (You can't answer without knowing the mechanism). $\rightarrow$ **Leaf: Mechanism-First**.

  #### **Q2: The 90% Predictor**
  *Story:* Death is now only 90% accurate.
  *   **Version A:** His 10% errors are scattered randomly.
  *   **Version B:** His 10% errors happen *only* when people change their minds late in deliberation.
  **Q2:** Do you treat these two versions **differently**? (e.g., Does Version B give you a reason to decide quickly, while Version A does not?)
  *   **Yes:** (The causal story behind the error matters to you). $\rightarrow$ **Leaf: Causal-Style (Causal Decision Theory)**.
  *   **No:** (Only the statistical accuracy matters; the cause of the error is irrelevant). $\rightarrow$ **Leaf: Evidential-Style (Evidential Decision Theory)**.

  #### **Q3: The Coin-Flip Death**
  *Story:* Forget prediction. Years ago, Death flipped a fair coin to pick his city. He is currently in Aleppo or Damascus. He does not know where you are. You are here.
  **Q3:** Does your choice of city change your probability of survival?
  *   **Yes:** (You can choose to go where he isn't, effectively playing a 50/50 game). $\rightarrow$ Go to **Q4**.
  *   **No:** (You are doomed regardless; the coin toss determined your fate before you were born). $\rightarrow$ **Leaf: Resigned (Fatalism)**.

  #### **Q4: The Simulation Question (Marco's Check)**
  *Story:* Back to the **Plain Case** (Infallible Prediction). Suppose Death predicted you by running a perfect computer simulation of your brain deliberating right now.
  **Q4:** When you choose a city in this room, do you feel you are primarily deciding what the **simulated version** of you does?
  *   **Yes:** (The simulation *is* you for the purpose of the prediction; you are choosing the output of the function). $\rightarrow$ **Leaf: Sim-Chooser (Functionalist/Logical Decision Theory)**.
  *   **No:** (I am the real one; the simulation is just a record of the past). $\rightarrow$ Go to **Q5**.

  #### **Q5: The Rented Randomizer**
  *Story:* Back to the **Plain Case**. You can pay a small fee to let a fair coin decide your city.
  *   **Variant:** Death predicted *your decision to use the randomizer*, but he **did not** simulate the coin toss itself (the coin is truly random and unknown to him).
  **Q5:** Do you pay the fee to randomize?
  *   **Yes:** (By randomizing, you make it impossible for him to match you perfectly, raising survival odds from 0% to 50%). $\rightarrow$ **Leaf: Ratifiability (Equilibrium/Functional)**.
  *   **No:** (My choice to pay cannot change the prediction he already made; I will pay for nothing). $\rightarrow$ **Leaf: Causal-Style (Causal Decision Theory)**.

  ***

  ### Part 3: The Leaves (Position Descriptions)

  **Mechanism-First (Underdescribed Case)**
  *   **View:** You refuse to answer the Plain Case until you know *how* the prediction is generated (e.g., time travel? simulation? magic?). You believe the decision theory depends entirely on the physical causal structure, which the story omits.
  *   **Advice:** "Tell me how the trick works, then I'll tell you what to do."

  **Resigned (Fatalism)**
  *   **View:** You believe the future is fixed in a way that bypasses your choices. Even in the Coin-Flip case, you feel you cannot alter the outcome.
  *   **Advice:** "Pick whichever city you prefer for the view; you are dead either way."

  **Causal-Style (Causal Decision Theory)**
  *   **View:** You distinguish sharply between *correlation* and *causation*. In the Plain Case, the prediction is a fixed past fact; your choice cannot change it. In the 90% Case, you care about whether your choice *causes* the error. In the Randomizer Case, you refuse to pay because spending money cannot causally alter the past prediction.
  *   **Advice:** "In the Plain Case, it doesn't matter (you can't change the past). In the 90% Case, act based on causal leverage."
  *   *(Note: This advice looks identical to 'Resigned' in the Plain Case, but for a different reason.)*

  **Evidential-Style (Evidential Decision Theory)**
  *   **View:** You treat your choice as "news." You want to be in the state of the world where your choice is good news for survival. You care about statistical reliability, not the causal mechanism of errors.
  *   **Advice:** "Choose the option that makes it most probable Death is elsewhere." (In the Plain Infallible Case, this often leads to paralysis or a belief that you can 'signal' safety).

  **Ratifiability (Equilibrium/Functional)**
  *   **View:** You only endorse a choice if, *after* making it, you still think it was the right one. In the Plain Case, you cannot endorse "Stay" because if you stay, Death is there. You cannot endorse "Go" because if you go, Death is there. You must find a mixed strategy (like the Randomizer) that Death cannot perfectly match.
  *   **Advice:** "Pay for the Randomizer. It is the only choice you can make without proving yourself wrong."

  **Sim-Chooser (Functionalist/Logical Decision Theory)**
  *   **View:** You accept that if the prediction is a simulation, "you" exist in two places. By choosing here, you determine the output of the simulation there. You are choosing the logical fact of your decision, not just the physical movement.
  *   **Advice:** "Choose the city that ensures the simulated you chose the *other* city." (This often collapses into the Evidential or Ratifiable advice, but the *reasoning* is distinct).

  **Unnamed (Magical Thinking)**
  *   **View:** (If you answered "Yes" to paying for the Randomizer even when Death *predicts the coin*). You believe you can outsmart an infallible predictor by randomizing, even if the predictor sees the randomization result in advance.
  *   **Advice:** "Pay the fee; luck will save you." (This position is logically unstable in the story as written).

  ***

  ### Part 4: Teacher's Notes on Ambiguities

  **1. The "It Doesn't Matter" Collision**
  Be prepared for students landing on **Causal-Style** and **Resigned** to agree on the practical advice for the Plain Case ("Don't bother, it doesn't matter").
  *   **The Test:** Ask them about the **Coin-Flip Death** case (Q3).
  *   **Causal-Style** will say: "I have a 50% chance of survival; my choice determines if I match him."
  *   **Resigned** will say: "I am already dead; the coin flip was fate."
  *   This is the only way to separate the *metaphysics* of their decision theory.

  **2. The Empty Cells**
  If a student finds themselves in a combination that doesn't match a Leaf (e.g., they say "No Leverage" in the Plain Case but "Yes Leverage" in the 90% Error Case), point out that their position is likely **Incoherent**.
  *   *Example:* If you believe you have no leverage in the Infallible Case, you generally shouldn't care about the *type* of error in the 90% Case, because you've already committed to the view that your choice doesn't influence the prediction mechanism.

  **3. Marco's Point (The Sim-Chooser)**
  Students who land on **Sim-Chooser** often struggle to articulate why this is different from **Evidential-Style**.
  *   **The Distinction:** Evidential-Style says "My choice is *evidence* of where Death is." Sim-Chooser says "My choice *determines* what the simulation did, which determines where Death is." One is about information; the other is about logical identity.

  **4. The Randomizer Trap**
  In Q5, ensure students understand the variant: Death predicts *you*, but not the *coin*.
  *   If they say "No" to paying: They are **Causal-Style** (Money can't change the past prediction of your disposition).
  *   If they say "Yes" to paying: They are **Ratifiability** (Randomizing breaks the link between your disposition and Death's location).
  *   *Warning:* If they say "Yes" because "The coin might beat Death," remind them Death predicted they would use the coin. The only way to win is if Death *couldn't* predict the coin result.
