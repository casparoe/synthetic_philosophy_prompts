      *   *Conceptual Split:* "Nation-State" (political) vs. "Nation-Feeling" (cultural). This is promising but risks creating two silos that never talk.
      *   *Accept Stalemate:* Probably the most honest answer. The concept "Nation" is essentially contested (Gallie). It *must* remain fuzzy to do its political work.

