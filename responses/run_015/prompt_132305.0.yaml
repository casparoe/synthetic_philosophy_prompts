      *   **Desired Output:** A diagnosis anchored in actual arguments (not a lit review), an honest call on whether progress is possible, and specific suggestions on what might shift the debate (archival find, conceptual split, or accepting stalemate).
      *   **Tone:** Academic but sharp, analytical, suitable for a feature article. No fluff.

