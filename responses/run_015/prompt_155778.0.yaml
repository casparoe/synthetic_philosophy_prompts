      *   *Dennett's specific view:* Dennett calls them "levels of *competence*." He explicitly argues against the idea that because the neurons are dumb, the mind is dumb.
      *   *The "Work" argument:* The colleague says "what process does the work." The response is: The *organization* does the work, not just the parts. A computer doing math isn't doing physics; it's doing math *using* physics.
      *   *The "Cumulative" constraint:* The user wants to keep cumulativity. The Tower is cumulative in terms of *dependencies*. You can't have Popperian selection without a Skinnerian body to execute the winner. You can't have Gregorian without Popperian brains to host the memes.
      *   *Case 1 (Gregorian w/o Popperian):* This challenges cumulativity. If I just speak what I hear, am I Gregorian? Dennett would say you need to understand (simulate) to use language flexibly. So a parrot isn't Gregorian. A human child internalizing speech *is* using Popperian machinery to process Gregorian input. So the case is actually "Gregorian input + Popperian processing."
