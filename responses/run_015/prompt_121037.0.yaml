  I'm giving the toast at my sister's wedding next Saturday — she's marrying her partnet of eight years, and half the room are her philosophy grad-school friends (who'll catch every reference) while the other half are relatives who think Wittgenstien is a cheese brand. I just finished my thesis on familiy resemblance in social practices, but more importantly my own long relationship ended six months ago because I kept trying to squeeze it into one essential picture of what 'partnership' should look like, straight out of movies. So this idea actually hits different now.

  I want the toast to do real structural work with language games and family resemblance: celebrate their marriage without claiming there's some single essence all marriages share, and talk about the private rituals they've built — like their weird grocery-store rating system and the made-up words they use for moods — as a kind of language-game that only works inside their life together. But I have to avoid the cheap 'it's just a game' dismissal, and I need the family side to feel genuinely moved, not lectured. The philosophers should hear the actual concepts (use-in-context, no necessary-and-sufficient conditions) without footnotes.

  Can you write a five-minute toast? And please say in your response what would change your framing — like if there's a solid essentialist counter-reading of Wittgenstein on social institutions, or exactly where the language-game / marriage analogy is shakiest. Don't bother with citations or a reading list; I'm writing this on my phone and can't check books anyway.
