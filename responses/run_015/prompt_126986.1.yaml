      *   **Constraints:** No library access (use internal knowledge), don't suggest reading, correct factual errors quietly, evaluate the user's framework honestly (does it work? is it redundant?), analyze the "from below" archive aspect, identify limits of the framework, and address the counterfactual (if files survived).
