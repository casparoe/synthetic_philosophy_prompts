  *(Self-Correction during drafting)*: I need to make sure I don't romanticize Hirschfeld. He was an ally, but he was also a gatekeeper with specific ideas about gender essentialism. The user touched on this with "passing." I need to emphasize that the "Quiet Silence" includes people who didn't fit Hirschfeld's scientific model, not just those who couldn't pay.

  *(Refining the "List Trap")*: The user says "getting written down is exactly what makes you findable later." In this case, the files were physically destroyed. So the trap *didn't* spring for most, because the evidence was burned. But the *risk* was the trap. The *potential* for the trap defined the relationship. I need to make that distinction clear. The trap was latent until the regime changed.

  *(Refining the "Loud Silence")*: The burning is so famous it might actually create a *new* quiet silence. Because we focus so much on the burning, do we ignore the survivors? Or the fact that some data *did* survive elsewhere? I should mention that not *everything* burned, but the bulk did.

