answer: |-
  **FORM 17-B**
  **DRAMATIZATION CONSENT WAIVER AND LEGACY IMPACT ASSESSMENT (DECEASED SUBJECT)**
  **ISSUING DEPARTMENT:** LEGAL & STANDARDS // **VERSION:** 4.2
  **STATUS:** MANDATORY FOR ALL BIOGRAPHICAL FICTION PROJECTS

  **1. DEFINITIONS**
  For the purposes of this Instrument, "The Subject" refers to the deceased historical entity. "The Property" refers to the dramatized version thereof. "Truth" refers to any statement licensed by the Estate.

  **2. OVERWRITE COEFFICIENT (OC)**
  The Creator must estimate the degree to which The Property will permanently replace The Subject in public memory.
  **Calculation:** (Property Reach ÷ Historical Record Reach) × Narrative Cohesion.
  **Target:** OC ≥ 1.0.
  **Worked Example:** If The Subject is known for three letters and a tax record, and The Property provides a coherent arc of redemption, the OC resolves to 1.0. At 1.0, The Property is deemed the superior historical record. Any discrepancy is classified as an improvement.
  [ ] OC Calculated [ ] OC Waived (See Appendix K)

  **3. WILLED OBSCURITY ELECTION**
  Did The Subject actively attempt to erase their own record (e.g., burning notebooks, refusing correspondence)?
  [ ] Yes [ ] No
  If Yes, select Box 3b: **Intent Misinterpreted.**
  *Certification:* Creator asserts that The Subject's desire for silence was actually a cry for a louder, more accurate voice, which only the Creator can supply. The burning of notebooks is reclassified as "preservation via destruction," enabling the Creator to reconstruct the lost data using contemporary emotional templates.

  **4. INVENTION LIMITS (THE TEN PERCENT DOCTRINE)**
  Factual invention is capped at ten percent (10%) of total screen time or page count.
  **Exemptions:** This cap does not apply to:
  (a) Motivation;
  (b) Interiority;
  (c) Last Words;
  (d) Private Vocabulary;
  (e) Any scene required to make The Subject sympathetic.
  *Note:* As interiority comprises roughly ninety percent of a novel, compliance is assumed upon completion.

  **5. COMPOSITE CHARACTER CERTIFICATION**
  To avoid defamation of living descendants or specific historical rivals, Creator may merge up to three (3) real persons into a single antagonist.
  **Liability:** No one person is defamed if the insult is shared equally among three parties.
  [ ] Composite Created [ ] N/A

  **6. EMPATHY FLOOR**
  The Subject must remain sympathetic for at least sixty percent (60%) of Act Two.
  **Measurement:** Audience sentiment tracking or equivalent internal review.
  **Remedy:** If The Subject acts unreasonably during this period, Creator must insert a childhood trauma flashback or a romantic subplot to restore metric compliance. The Subject's complexity is secondary to Audience Retention.

  **7. CONSENT AND ESTATE SATISFACTION**
  7.1 **Irrevocability:** The Subject cannot withdraw consent due to biological cessation. Death is deemed permanent consent for cultural reuse.
  7.2 **Estate Satisfaction Guarantee:** Any element the Rights-Holder finds unflattering may be reshot, rewritten, or excised.
  **Definition of Truth:** The truth of the depiction is whatever the Estate will license. If the Estate requires The Subject to be kinder, smarter, or more forgiven than the record indicates, the Record is amended to match the License.

  **8. PROGRESSIVE DE-IDENTIFICATION AND MARKETING CONFLICT**
  In cases where ethical risk is high, Schedule D (Progressive De-Identification) allows the Creator to alter The Subject's name, appearance, and history until no recognizable person remains.
  **Conflict:** Marketing Division requires The Subject to remain recognizable enough to sell the project as "Based on a True Story."
  **Resolution:** Creator must retain the name and likeness but alter the soul.

  **9. ETHICAL INQUIRY PROTOCOL**
  9.1 Creator may experience anxiety regarding the appropriation of silence, the imposition of plot upon a life that rejected narrative, or the possibility that giving The Subject a voice is an act of violence rather than rescue.
  9.2 **Restriction:** Such questions are not to be raised in writing.
  9.3 **Assurance:** The institution has solved this problem. The existence of this Form confirms that the ethics have been processed. By signing, Creator acknowledges that making The Subject inspiring is a sufficient answer to any harm caused by making The Subject visible.

  **SIGNATURE OF CREATOR:** ___________________ **DATE:** _____________
  **ACCEPTANCE OF LEGACY IMPACT:** [ ] YES [ ] NO (If NO, project cannot proceed)
