answer: |-
  ### 1. The Foundational Idea: The Explanatory Dead End
  Do not start with fairness. Do not start with "it's rude to judge the dead." Start with **causality**.

  The first idea you must install is that presentism creates an **Explanatory Dead End**. If you label a past action using a modern moral category (e.g., "human rights violation"), you stop asking *why* the actors did it. You have categorized the event, so you stop investigating the cause. For a historian, a moral judgment that replaces a causal explanation is a methodological failure. It renders the past unintelligible.

  **Teaching Move:** Write on the board: *"Judgment stops the 'Why?'"* Ask them: "If I say the Romans were 'cruel' for throwing Christians to lions, have I explained why they did it, or have I just told you how I feel about it?"

  ### 2. The Carrying Example: The 1920s American Eugenics Movement
  **Why this example:** It avoids the Columbus/Founders fatigue but retains high moral stakes. It forces students to confront "good" people doing "bad" things for "scientific" reasons.

  **What it Needs to Have:**
  *   **High-Status Proponents:** You need evidence that Supreme Court Justices (Oliver Wendell Holmes Jr.), University Presidents, and Progressive Era reformers supported it. This prevents students from dismissing it as "evil villains."
  *   **Humanitarian Logic:** The materials must show they believed they were *reducing suffering* (preventing "feeble-minded" children from being born into poverty/abuse), not just being mean.

  **What it Must Lack:**
  *   **A Clear Villain:** Do not use Nazi eugenics initially. Keep it US/UK focused (e.g., *Buck v. Bell*). If you bring in the Holocaust immediately, the moral outrage will be too high to allow methodological analysis.
  *   **Modern Scientific Consensus:** Ensure they understand the genetics of the 1920s was considered cutting-edge, not "fake."

  **Teaching Move:** Hand out a one-page packet with two quotes. One from a 1920s eugenicist explaining why sterilization is "kind," and one modern bioethicist condemning it. Ask: "If the 1920s quote is true about their motivations, what happens to our explanation if we only read the modern quote?"

  ### 3. Mapping & Heading Off Misconceptions
  Students will react in a predictable sequence. You must intercept them at specific points.

  **Misconception 1: "So history is just opinion / anything goes."**
  *   **When it arises:** Immediately after you introduce the "Explanatory Dead End." They will hear "don't judge" and think "no truth exists."
  *   **Where to head it off:** **Before** you touch the Eugenics example.
  *   **The Fix:** Distinguish between **Explanation** (what happened and why) and **Evaluation** (was it good or bad). Tell them: "You can evaluate, but not *instead* of explaining. If you evaluate first, you break the explanation. We need both, in that order."

  **Misconception 2: "So we should only use past values."**
  *   **When it arises:** After working through the Eugenics example. Once they see the 1920s logic, they will swing to hard relativism: "Well, it was right for them then, so who are we to say?"
  *   **Where to head it off:** **After** the example analysis, during the synthesis.
  *   **The Fix:** Reintroduce the present. "We use past values to *explain* the cause, but we use present values to *assess* the consequence." Acknowledge that *Buck v. Bell* is legally overturned today. We can explain the logic without accepting the conclusion. The tension is the point, not the resolution.

  ### 4. The Check Question
  Do not ask "What is presentism?" They will parrot "context matters." Ask for a **constrained thesis statement**.

  **The Question:**
  > "Here is a quote from Oliver Wendell Holmes Jr. supporting forced sterilization in 1927. Write a one-sentence thesis that explains *why* he supported it without using the words 'racist,' 'wrong,' 'ignorant,' or 'evil'."

  **Why this works:** It forces them to reconstruct the internal logic (methodology) without resorting to modern moral labeling (presentism). If they can't do it without those words, they haven't grasped the methodological constraint.

  ### 5. What to Leave Out
  **Leave out the term "Whig History."**
  It is jargon that distracts from the practice. You also do not need to get into the metaphysical debate about whether the past "exists" or the philosophy of time (McTaggart, etc.). Keep it strictly on the **craft of writing history**: how we select evidence and construct narrative. If you get into philosophy, you lose the method.
