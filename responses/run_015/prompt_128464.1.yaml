answer: |-
  There is no single canonical term like *ad hominem* for this specific maneuver, but philosophy has mapped the terrain it occupies. The closest structural match is a violation of the Kantian distinction between **Regulative** and **Constitutive** principles, combined with what argumentation theorists call **Equivocation on Illocutionary Force**.

  Here is the carving you asked for: the existing near-misses, why they fail, and a proposed label with boundary conditions.

  ### 1. The Existing Near-Misses (and why they miss)

  **A. Motte-and-Bailey (The User's Rejection is Correct)**
  *   **The Structure:** A controversial claim (Bailey) is defended by retreating to a trivial claim (Motte) when attacked, then re-asserting the controversial claim later.
  *   **Why it differs:** Motte-and-Bailey relies on *two different propositions* (e.g., "All men are rapists" vs. "Some men commit rape"). Your case involves *one proposition* ($X$) that retains its semantic content but shifts its **modal status** (from Fact to Tool back to Fact). It is not a retreat to a safer *claim*; it is a retreat to a safer *commitment level*.

  **B. Epistemic Contextualism**
  *   **The Structure:** The truth conditions of "knows" shift depending on the conversational context (e.g., casual chat vs. court).
  *   **Why it differs:** Contextualism describes how *listeners* evaluate knowledge. Your case describes a *speaker* strategically manipulating their own commitment without signaling the context change. The speaker isn't acknowledging high/low standards; they are hiding the switch.

  **C. Belief vs. Acceptance (L. Jonathan Cohen)**
  *   **The Structure:** *Belief* is involuntary and truth-oriented; *Acceptance* is voluntary and policy-oriented (using $X$ as a premise for a specific task).
  *   **Why it differs:** This is the correct *mechanism*, but not the name of the *fallacy*. Your subject is conflating the two. They *Accept* $X$ when challenged (it's a policy/tool) but *Assert Belief* in $X$ when building arguments (it's a truth).

  ### 2. The Philosophical Root: Regulative vs. Constitutive

  The deepest precedent is Kant's distinction:
  *   **Constitutive:** A principle that constitutes the reality of the object (e.g., "Causality governs events").
  *   **Regulative:** A principle that guides inquiry but doesn't guarantee reality (e.g., "Proceed *as if* nature is unified").

  Your pattern is **treating a Regulative principle as Constitutive when convenient, and vice versa when threatened.**

  ### 3. Proposed Label: "The Regulative-Constitutive Slide"

  If we are coining for precision, call it **Epistemic Status Equivocation** or, more vividly, **The Regulative-Constitutive Slide**.

  **Definition:** A rhetorical maneuver where a speaker oscillates a proposition between *ontological commitment* (this is how the world is) and *methodological postulate* (this is how we view the world) to evade falsification while retaining explanatory power, without signaling the shift.

  **The Temporal Loop:**
  1.  **Phase 1 (Constitutive):** "$X$ is the case." (Used to build an argument).
  2.  **Phase 2 (Defensive/Regulative):** "I'm just using $X$ as a lens." (Used to deflect epistemic challenge).
  3.  **Phase 3 (Re-Constitutivization):** "Given $X$..." (Used later as established background).

  ### 4. Boundary Conditions (The Carving)

  To distinguish this from legitimate intellectual practices, apply these three tests:

  **A. Vs. Legitimate Interdisciplinary Borrowing**
  *   **Borrowing:** Explicitly flags the source context. ("In Foucault's framework, $X$ holds...")
  *   **The Slide:** Absorbs $X$ into the current discourse as native truth. ("As we see with $X$...")
  *   **Boundary:** Does the speaker acknowledge the *foreignness* or *provisionality* of the claim when citing it positively? If no, it's a Slide.

  **B. Vs. Strategic Ambiguity**
  *   **Ambiguity:** Keeps the *content* vague to allow multiple interpretations.
  *   **The Slide:** Keeps the *content* specific but makes the *grounding* fluid.
  *   **Boundary:** Is the proposition clear? If yes, but its truth-status is fluid, it's a Slide.

  **C. Vs. Ordinary Loose Speech**
  *   **Loose Speech:** Inconsistent due to carelessness; corrected when pointed out.
  *   **The Slide:** Inconsistent due to utility; *maintained* when pointed out.
  *   **Boundary:** Does the speaker correct the status when challenged, or do they defend the *right* to toggle? If they defend the toggle, it's a Slide.

  ### 5. Concrete Examples

  **Example 1: The "Rational Actor" in Social Science**
  *   **Phase 1:** "People maximize utility. Therefore, this policy will fail." (Treating Rational Choice Theory as a **Constitutive** fact about human psychology).
  *   **Challenge:** "Most people don't actually calculate utility."
  *   **Phase 2:** "It's a modeling assumption, not a psychological claim. It's a heuristic." (Retreating to **Regulative** status).
  *   **Phase 3:** (Later seminar) "Since agents are utility maximizers, we can predict..." (Silently returning to **Constitutive** status).
  *   **Why it fits:** The claim "agents maximize utility" never changes, but its epistemic weight toggles to avoid empirical falsification while retaining predictive authority.

  **Example 2: Critical Theory Categories**
  *   **Phase 1:** "This institution is inherently patriarchal." (Assertion of fact).
  *   **Challenge:** "Where is the empirical evidence for 'inherently'?"
  *   **Phase 2:** "Patriarchy is an analytic lens, not a literal entity. It's a way of reading." (Retreat to heuristic).
  *   **Phase 3:** "Because the institution is patriarchal, it produces harm." (Re-assertion as causal mechanism).
  *   **Why it fits:** "Patriarchy" functions as a physical cause in Phase 3, but a metaphorical lens in Phase 2. The speaker demands the consequences of the former while accepting the immunity of the latter.

  **Example 3: Psychoanalytic Diagnosis**
  *   **Phase 1:** "Your ego is defending against this memory."
  *   **Challenge:** "There's no neurological evidence for the 'ego' as a distinct agent."
  *   **Phase 2:** "The ego is a clinical construct, a map not the territory."
  *   **Phase 3:** "We need to strengthen the ego to handle this." (Treating the construct as an actionable biological/psychological subsystem).
  *   **Why it fits:** The "ego" is granted causal power (Phase 3) that it was denied ontological status for (Phase 2).

  ### Summary
  Philosophy hasn't named the *temporal toggle* specifically, but it provides the tools to dissect it. It is an **Equivocation on Illocutionary Force** rooted in a **Regulative-Constitutive Slide**.

  It differs from Motte-and-Bailey because the *proposition* doesn't change, only its *warrant*. It differs from loose speech because the toggle is *defended* rather than corrected. The core violation is **claiming the authority of truth without accepting the liability of falsification.**
