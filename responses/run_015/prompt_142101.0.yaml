answer: |-
  ### 1. The Principle

  1.  **The Richer Value Rule:** An individual's moral status is determined by the richer of two values: (a) the conscious repertoire they actually sustain or are developmentally poised to sustain, or (b) the normative repertoire of the biological kind to which they belong by origin. (Forces: A, B, C, D, F, G, H, J)
  2.  **The Surplus Exclusion:** Dormant capacity that supports neither actual function nor a developmental trajectory confers no additional status. (Forces: E)
  3.  **The Continuity Clause:** An individual retains their prior status through temporary or reversible loss of capacity, provided psychological continuity is preserved or restorable. (Forces: I-part1)
  4.  **The Capacity Ceiling:** Status cannot exceed the maximum conscious repertoire the individual is physically capable of realising, regardless of biological kind. (Forces: C, H)

  ### 2. Case Table

  | Case | Verdict Agreement? | Principle's Verdict | Cost of Acceptance |
  | :--- | :--- | :--- | :--- |
  | **A** | Yes | Human > Chimp (Human Kind/Cap > Chimp Kind/Cap) | Requires accepting 'Kind' as a status buffer, not just capacity. |
  | **B** | Yes | Low (Low Kind/Low Cap) | None. |
  | **C** | Yes | Equal (Whale Cap $\le$ Human Cap; Kind irrelevant above Cap) | Requires denying that 'bigger brain' adds value beyond capacity. |
  | **D** | Yes | Equal (Alien Cap = Human Cap) | Requires decoupling status from human biology entirely. |
  | **E** | Yes | Equal (Surplus neurons excluded) | Requires accepting that 'hardware reserve' is morally inert. |
  | **F** | Yes | High (Developmental trajectory counts) | Requires granting status on the basis of future, not present, capacity. |
  | **G** | Yes | High (Human Kind norm overrides low capacity) | Requires accepting species membership as a moral shield. |
  | **H** | Yes | High (Human capacity overrides Chimp kind) | Requires accepting that non-humans can earn full human status. |
  | **I (1)** | Yes | High (Continuity Clause) | Requires accepting that physical substrate loss matters less than continuity. |
  | **I (2)** | **No** | **High** (Human Kind norm overrides mouse capacity) | **Conflict:** Principle grants full status; you verdict 'substantial reduction'. To save principle, you must accept the fetal-damaged human retains full rights despite mouse-like mind. |
  | **J** | Yes* | High (Human Kind norm) | **Caveat:** Principle agrees with verdict, but confirms your suspicion that this is 'Kind' status, not 'Capacity' status. |

  ### 3. Verdicts on Unlisted Cases

  *   **Collective Hive Mind:** **High Status.** The colony constitutes the individual. The 'Actual Capacity' (Rule 1a) is human-grade. The physical distribution of neurons is irrelevant (cf. Case D).
  *   **Neuron-by-Neuron Emulation:** **High Status.** The 'Actual Capacity' (Rule 1a) is human-grade. Substrate (biological vs. software) is irrelevant (cf. Case D).
  *   **Human with One Hemisphere Removed:** **High Status.** 'Actual Capacity' remains near-human; 'Kind' is human; 'Continuity' is preserved (Rule 1 & 3).
  *   **Super-Neuron Species (Human-range behaviour):** **Equal to Human.** The 'Capacity Ceiling' (Rule 4) prevents status exceeding the realised repertoire. Excess neurons are surplus (Rule 2).
  *   **Human in Temporary Coma:** **High Status.** Protected by the 'Continuity Clause' (Rule 3) as reversible interference.
  *   **Engineered Pig (Human-grade repertoire):** **High Status.** 'Actual Capacity' (Rule 1a) overrides 'Kind' (Rule 1b). This is the inverse of Case G, but governed by the same 'Richer Value' logic.

  ### 4. Analysis of Irreconcilable Pairs

  **G vs H (Species vs Capacity):**
  This is **only about words** if you accept the 'Richer Value Rule'. You are already comfortable granting status based on capacity (H) and based on kind (G). The principle unifies these by saying *either* suffices. There is no logical contradiction here, only a refusal to prioritise one metric exclusively.

  **E vs F (Unused Potential):**
  This is **only about words** regarding the definition of 'potential'. In F (Infant), the capacity is *developmentally active*; the system is building toward it. In E (Reserve), the capacity is *static redundancy*; the system is not building toward it. Your verdicts distinguish 'trajectory' from 'inventory'. The principle codifies this distinction in Rule 1a ('developmentally poised').

  **G vs I-part2 (Low-Capacity Humans):**
  This is a **genuine conflict**. Both are humans with permanent, early-onset capacity deficits. In G, you grant full status; in I-part2, you grant reduced status. The only empirical difference is the *degree* of deficit (two-year-old human vs. mouse).
  *   **Recommendation:** Overturn **I-part2**.
  *   **Reasoning:** If G (microcephalic human) commands full status because they belong to a kind that *normally* realises high capacity, then the fetal-damaged human in I-part2 belongs to the same kind. The 'mouse' repertoire in I-part2 is an impairment of a human organism, just as the 'two-year-old' repertoire in G is. To deny status in I-part2 while granting it in G introduces an arbitrary threshold of 'how much impairment is too much'. It is more coherent to say that membership in a high-status kind confers a 'floor' of protection that impairment cannot revoke. Your discomfort in I-part2 likely stems from **grief for lost potential**, not a justification for reduced moral protection.

  **What a principle saving all ten would look like:**
  To save I-part2 while keeping G, you would need a **'Threshold of Recognisability' Clause**. This would state: *'Kind-based status applies only if the individual retains minimal features recognisable as a member of that kind (e.g., human facial structure, vocalisation, or social bonding), even if cognitive capacity is low.'*
  *   **Complexity Cost:** High. This moves moral status away from mind and kind, and towards **aesthetic or social recognisability**. It risks making status contingent on how 'unsettling' a disability appears to others, which is ethically unstable.

  ### 5. Non-Status Factors in Your Verdicts

  Several of your verdicts are driven by factors adjacent to moral status. Identifying these reduces the burden on your principle.

  *   **Case A (Chimp Research):** **Epistemic Caution.** Your discomfort ('less comfortable than I used to be') suggests uncertainty about the depth of chimpanzee suffering, not necessarily a change in their theoretical status. We weigh interests heavier when we are unsure of the cost to the subject.
  *   **Case G (Microcephalic Human) & J (Dementia):** **Expressive/Symbolic Meaning.** Treating a human with low capacity as having low status sends a dangerous message about the value of vulnerable humans generally. The 'full status' verdict protects the *practice* of human rights, not just the individual's intrinsic properties.
  *   **Case J (Dementia vs Dog):** **Special Duties.** The higher status accorded to the demented human is likely partly due to **relational duties** (family, community history) that do not exist with the dog. This is about *our* obligations, not the *human's* intrinsic weight.
  *   **Case I-part2 (Fetal Damage):** **Tragedy/Grief.** The 'substantial reduction' verdict likely reflects the **loss of a expected future**, which is a tragedy for the parents and society. This is a welfare judgment about the *life*, not a status judgment about the *rights*. A being can have full rights (inviolability) while having a life of very low welfare potential.
  *   **Case H (Enhanced Chimp):** **Novelty Shock.** If you feel hesitation here, it is likely **categorical dissonance** (a chimp *shouldn't* be this smart). If you accept the verdict easily, it confirms your commitment to Capacity over Kind.

  **Summary:** Your core intuition is the 'Richer Value Rule' (Capacity or Kind, whichever is higher). Your inconsistencies arise when you conflate **moral protection** (status) with **tragedy** (lost potential) or **social symbolism** (what treating humans this way implies). If you separate these, G and I-part2 align, and your principle holds.
