      *   *Error:* **Semantic clause misapplied.** In Kripke semantics, w ⊩ ¬B iff for all v ≥ w, v ⊮ B. In the candidate's model, B is forced *nowhere*. Therefore, for all v ≥ w₀, v ⊮ B. Consequently, w₀ ⊩ ¬B.
