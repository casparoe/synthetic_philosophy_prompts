  # Formal Menu of Readings: "Rational Irrationality is Rational"

  The slogan "rational irrationality is rational" is semantically dense and potentially equivocal. In the context of decision theory and moral philosophy, it typically attempts to resolve the tension between local act-optimization and global outcome-optimization. Below are five distinct philosophical readings of the claim, analyzed according to the specified criteria.

  ### 1. The Strategic Precommitment Reading (Schelling/Gauthier)

  This reading interprets the slogan as a claim about strategic interaction. It posits that an agent maximizes utility by restricting their future choice set, thereby altering the incentives of other agents.

  1.  **Level of Evaluation:** Policies adopted over time (specifically, precommitment strategies).
  2.  **Reasoning Type:** Causal reasoning via commitment-device mechanism. The act of binding oneself causally influences the counterparty's behavior (e.g., making a threat credible).
  3.  **Personal Identity:** Presupposes a unified agent capable of binding their future self. It treats the agent as a single locus of planning over time, where the "past self" imposes constraints on the "future self."
  4.  **Relation to Indirect Normativity:** Collapses into a standard indirect-normativity argument. The specific "irrational" act (e.g., carrying out a costly threat) remains instrumentally irrational at the moment of execution, but the *policy* of being the type of agent who carries out such threats is rational.
  5.  **Status:** Substantive but defensible. It is widely accepted in game theory (e.g., Thomas Schelling's *The Strategy of Conflict*) and contractarian moral philosophy (e.g., David Gauthier's *Morals by Agreement*).
  6.  **Support for Conclusion:** **Supports.** This reading validates the speaker's claim that one ought to engineer a future disposition. It argues that cultivating a disposition to ignore local cost-benefit analysis is the rational means to secure cooperative outcomes or deterrence.

  ### 2. The Evidential/Functional Disposition Reading (EDT/FDT)

  This reading interprets the slogan through the lens of Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). It suggests that the rationality of an act is determined by the news it brings or the algorithm it instantiates, rather than its direct causal consequences.

  1.  **Level of Evaluation:** Standing dispositions or decision algorithms.
  2.  **Reasoning Type:** Evidential or Functional reasoning. The agent chooses the disposition such that, if they have it, the expected outcome is highest. The "irrational" act is evidence that the agent instantiates a high-yield algorithm.
  3.  **Personal Identity:** Presupposes a logical or subjunctive connection between temporal stages. The future self is not a separate agent but a logical instantiation of the same decision function.
  4.  **Relation to Indirect Normativity:** Asserts something stronger than standard indirect normativity. It claims the apparently irrational act is *itself* rational because it is the output of the rational decision procedure. It denies the distinction between "rational policy/irrational act."
  5.  **Status:** Substantive but contested. It relies on rejecting Causal Decision Theory (CDT) in favor of EDT or FDT. It is defensible within those frameworks but false according to standard CDT.
  6.  **Support for Conclusion:** **Supports.** This reading strongly endorses cultivating future "irrationality" (deviation from CDT norms). It argues that an agent who calculates causally at every step will lose in Newcomb-like problems or Parfit's Hitchhiker scenarios; therefore, one should cultivate a disposition to act on evidential or functional grounds.

  ### 3. The Temporal Agency Separation Reading (Parfitian Reductionism)

  This reading interprets the slogan as a solution to inter-temporal coordination problems. It treats the agent's future stages as distinct entities that must be managed via contract or constraint.

  1.  **Level of Evaluation:** Institutional rules or inter-temporal contracts.
  2.  **Reasoning Type:** Commitment-device mechanism viewed as game-theoretic coordination between distinct temporal stages.
  3.  **Personal Identity:** Presupposes a Reductionist view of personal identity (Parfit). Future temporal stages are sufficiently distinct to be treated as separate agents in a coordination problem. The "irrationality" is the future stage refusing to maximize for the present stage's benefit without prior constraint.
  4.  **Relation to Indirect Normativity:** Collapses into a standard indirect-normativity argument. The constraint is rational for the whole life, even if the constrained action is suboptimal for the future stage acting in isolation.
  5.  **Status:** Substantive but defensible. It depends on the acceptance of Reductionism regarding personal identity. If one holds a Non-Reductionist view (a strict Ego), the need for such devices diminishes.
  6.  **Support for Conclusion:** **Supports.** It justifies the engineering of future dispositions as a method of solving intra-personal prisoner's dilemmas. However, it frames the "irrationality" not as a flaw, but as a necessary feature of cooperation between temporal parts.

  ### 4. The Kavka Constraint Reading (The Toxin Puzzle)

  This reading interprets the slogan as an impossibility claim derived from the nature of intention. It draws on Gregory Kavka's "Toxin Puzzle," which questions whether one can intend to perform an action one knows one will not perform.

  1.  **Level of Evaluation:** Particular acts (specifically, the formation of intention).
  2.  **Reasoning Type:** Causal reasoning regarding the psychology of intention. One cannot causally bring about an intention to do X if one knows that when the time comes, doing X will be irrational.
  3.  **Personal Identity:** Presupposes a unified agent with transparent access to their own future rationality.
  4.  **Relation to Indirect Normativity:** Undermines the indirect-normativity argument. It suggests that one cannot simply "adopt a policy" of irrationality if the policy requires intending to do something one knows one will not do.
  5.  **Status:** False (as a defense of the slogan) or Substantive (as a critique). If the slogan implies one can *decide* to be irrational at will, this reading declares the slogan false. Intentions are not subject to direct voluntary control in this manner.
  6.  **Support for Conclusion:** **Undermines.** This reading suggests the speaker's conclusion is psychologically impossible. One cannot deliberately engineer a disposition to perform an act one recognizes as irrational at the time of performance, unless one successfully deceives oneself (which introduces epistemic irrationality).

  ### 5. The Semantic Equivocation Reading (Deflationary)

  This reading interprets the slogan as a linguistic confusion resulting from using the word "rational" in two different senses within the same proposition.

  1.  **Level of Evaluation:** Terminology/Definitions.
  2.  **Reasoning Type:** N/A (Linguistic analysis).
  3.  **Personal Identity:** N/A.
  4.  **Relation to Indirect Normativity:** Collapses into a tautology. The first "rational" refers to *ex-ante* expected utility maximization (rational policy), while "irrationality" refers to *ex-post* act-utilitarian deviation. The second "rational" reiterates the *ex-ante* status.
  5.  **Status:** Tautological. The claim reduces to: "A policy that maximizes utility by prescribing acts that do not maximize utility in isolation is a utility-maximizing policy."
  6.  **Support for Conclusion:** **Undermines.** While technically true, this reading strips the slogan of its normative force. It suggests the speaker is merely noting a definition rather than advancing a substantive thesis about why an agent *ought* to cultivate irrationality. It implies the "irrationality" is only nominal, not actual.

  ### Summary of Implications for the Seminar

  *   **Readings 1, 2, and 3** provide substantive support for the speaker's conclusion, though they rely on different metaphysical and decision-theoretic commitments (Unified Agency vs. Reductionism; CDT vs. FDT).
  *   **Reading 4** challenges the psychological feasibility of the speaker's proposal.
  *   **Reading 5** challenges the philosophical depth of the speaker's proposal.

  To determine which thesis the speaker advanced, one must ascertain whether they view the "irrational" act as genuinely irrational at the time of execution (Readings 1, 3, 5) or as rational relative to a broader decision algorithm (Reading 2), and whether they view the constraint as psychologically possible (contra Reading 4).
