      However, a promise derives its binding force from the moral legitimacy of its object. We are not autonomous moral islands; our obligations exist within a community governed by shared truths. A promise to conceal plagiarism is a promise to sustain a lie. Such an agreement is void *ab initio* because it contradicts the very framework that gives promises meaning within this school. One cannot contract out of ethical duty. If the Honor Code protects promises to violate the Honor Code, it becomes self-negating.

