  8.  **Refining the Mechanics (Self-Correction):**
      *   *Darwinian:* If they just write moves, it's boring. They need to feel "death." If they hit a hazard, that specific "genome" is out. They must spawn a new one based on the survivor. *TA Role:* The TA acts as the "Environment" for Darwinians to speed this up.
