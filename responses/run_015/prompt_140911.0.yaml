answer: |-
  # Lesson Plan: The Selection Ladder
  **Course:** Minds, Animals and Machines  
  **Time:** 75 Minutes  
  **Students:** 24 (6 per station)  
  **Materials:** 4 Tables, Whiteboard, Markers, 4 packs of distinct colored tokens (15 per pack), 24 "Mission Sheets" (grids), 24 "Lore Logs" (blank paper), Candy (skittles/m&ms).

  ## 1. The Hidden World (TA Eyes Only)
  You are simulating a navigation task on a **5x5 Grid**.
  *   **Start:** Bottom-Left (0,0). **Goal:** Top-Right (4,4).
  *   **Movement:** Up, Down, Left, Right (No diagonals).
  *   **Generation 1 (Round 1) Physics:**
      *   **Pits:** (1,1), (3,3). Falling in = Failure.
      *   **Rule:** "Blue squares are safe." (You mark some squares Blue on their sheet).
  *   **Generation 2 (Round 2) Physics:**
      *   **Pits:** (1,1), (3,3) remain.
      *   **Rule Change:** "Blue squares are now **Lethal**." (This punishes inherited lore).
      *   **New Hazard:** A "Wolf" at (2,2) that moves Left-Right every turn.

  ## 2. The Four Stations (Operations, Not Difficulty)
  Divide the class into 4 Teams of 6. Assign each to a Station. Do **not** use the terms Darwinian, Skinnerian, Popperian, or Gregorian yet. Use the Station Names below.

  ### Station A: The Architects (Darwinian)
  *   **Constraint:** You cannot see the grid. You must write a "Genome" (a sequence of 5 moves, e.g., U-U-R-R-U) on a slip of paper.
  *   **Operation:** Hand the slip to the TA. The TA traces it on the Master Grid.
      *   If it hits a hazard: The organism **Dies**. (0 points). The slip is shredded.
      *   If it survives: The organism **Reproduces**. (1 point). You get the slip back and may **Mutate** exactly one move before the next trial.
  *   **What Dies:** The Agent (the slip of paper).

  ### Station B: The Trainers (Skinnerian)
  *   **Constraint:** You have one token on a personal grid. You can move it step-by-step.
  *   **Operation:** Move one step.
      *   If safe: TA gives 1 candy. You may continue.
      *   If hazard: TA says "Pain." You lose 1 candy (or life). You **must** reset to Start and try a different move.
  *   **What Dies:** The Behavior (you learn not to go there).

  ### Station C: The Simulators (Popperian)
  *   **Constraint:** You have a grid and 3 **Probe Tokens**.
  *   **Operation:** Before moving your main token, you may spend a Probe Token to ask the TA: *"If I go North from here, do I die?"*
      *   TA answers Yes/No. Token is gone.
      *   If you run out of tokens, you are blind (like Station B).
  *   **What Dies:** The Hypothesis (the token is spent to kill the idea before the agent moves).
  *   **Round 2 Modification (Probe 1):** **Silence.** Team members cannot speak. They must pass notes or think alone. (Isolates internal simulation from social sharing).

  ### Station D: The Archivists (Gregorian)
  *   **Constraint:** You receive a **Lore Packet** from the previous generation (Round 1 Team D).
  *   **Operation:** You must consult the Lore Packet before every move. You may add new rules to the Packet for the next generation.
      *   **Round 2 Modification (Probe 2):** **Lock-In.** For the first 3 moves, you **must** follow the inherited Lore, even if you suspect it is wrong.
  *   **What Dies:** The Tool (the Lore becomes dangerous when the world changes).

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | TA Action |
  | :--- | :--- | :--- |
  | **00-05** | **Intro.** "We are testing problem solving under different constraints. Points = Candy. Follow your Station Card rules exactly. Do not talk to other stations." | Hand out Station Cards. **Do not name the hierarchy.** |
  | **05-30** | **Round 1.** Teams operate under Gen 1 Physics. | Run the "Environment." Collect Team D's Lore Packet at min 25. |
  | **30-35** | **Rotation & Transfer.** Teams rotate clockwise (A→B→C→D→A). | Hand Team D (new members) the Lore Packet from Round 1. Change Physics to Gen 2. |
  | **35-60** | **Round 2.** Teams operate under Gen 2 Physics + Probe Modifications. | Enforce Silence at Station C. Enforce Lock-In at Station D. |
  | **60-75** | **Debrief.** (See below). | Map game experiences to the four labels. |

  ## 4. The Debrief (15 Minutes)
  *Do not lecture. Ask questions and map their answers to the board.*

  ### A. The Mapping Table
  | Game Moment | Concept | "What Died?" |
  | :--- | :--- | :--- |
  | **Station A:** Slips shredded after hitting a pit. | **Darwinian** | The **Lineage**. Selection between generations. |
  | **Station B:** Resetting after "Pain" feedback. | **Skinnerian** | The **Behavior**. Selection within a lifetime via reinforcement. |
  | **Station C:** Spending a token to test a "What if". | **Popperian** | The **Hypothesis**. Selection inside the head before action. |
  | **Station D:** Following old Lore into a new trap. | **Gregorian** | The **Meme/Tool**. Selection via cultural transmissibility. |

  ### B. Surfacing Resistances (Ask these specifically)
  1.  **"We were doing Popperian things the whole time."**
      *   *Student:* "I was imagining the grid in my head at Station B."
      *   *Response:* "You have a Gregorian mind. The constraint wasn't your ability to think, but your **permission to act** on that thought. Station B rules forced selection onto the *world*, Station C allowed selection onto the *idea*."
  2.  **"The Gregorian win is just cheating."**
      *   *Student:* "They had a map! That's unfair."
      *   *Response:* "In Round 2, the map killed them. Gregorian minds aren't just 'having tools,' it's being **shaped** by tools. When the Lore locked you in (Probe 2), did you feel smarter or handicapped?"
  3.  **"Isn't a Skinnerian with a good memory simply a Popperian?"**
      *   *Student:* "If I remember the pain, I don't need a token."
      *   *Response:* "Memory is storage. A Probe Token is **counterfactual simulation**. Did Station C allow you to test a path you *never actually took*? Station B only learns from what *did* happen."
  4.  **"Why four rungs and not forty?"**
      *   *Response:* "These aren't steps of 'smartness.' They are steps of **where the cost of failure is paid**. Body? Behavior? Thought? Culture?"

  ### C. Honest Limitations (Read this plainly)
  "There are three ways this game failed to replicate the theory, and I need to name them:
  1.  **Convergence:** If the grid was too easy, all four stations solved it. In reality, complex problems *force* the hierarchy; simple ones hide it.
  2.  **Gaming:** Some of you found loopholes (e.g., Station A passing slips to Station C). In evolution, there are no loopholes, only survival.
  3.  **The Deepest Problem:** You cannot turn off your Gregorian mind. Even Station A (Darwinian) used language to write the genome. Even Station C (Popperian) used English to think the hypothesis. **You cannot simulate what it is like to lack culture.** You can only simulate the *rules* of culture. The game stands in for the design constraint, but you are always already Gregorian creatures."

  Summary: The hierarchy is not a ladder of intelligence, but a ladder of where the cost of failure is paid: the body, the behavior, the hypothesis, or the culture.
