      *   *Skinnerian:* Selection happens within a lifetime via reinforcement. Trial and error. If behavior fails, the behavior is extinguished (not the agent).
      *   *Popperian:* Selection happens *before* action via internal simulation. Hypotheses die in the agent's place. Requires a model of the world.
      *   *Gregorian:* Selection happens via cultural tools/memes. The mind is offloaded into the environment (language, maps, rules). Tools shape the thinker.

