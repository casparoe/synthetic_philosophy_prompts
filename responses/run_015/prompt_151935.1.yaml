answer: |-
  **Project Title:** Code, Cause, or Norm? Naturalizing Information in Molecular Biology

  **Research Question**
  Does the translation machinery instantiate a genuine normative code, or merely a robust causal regularity?

  This question permits two live outcomes. A "Yes" entails that genetic sequences bear information literally, grounded in naturalized norms of correctness distinct from mere causal efficacy. A "No" entails that "information" in genetics is a useful heuristic for complex causation, but ontologically reducible to physical regularities and selected effects without genuine normativity. The project does not presuppose the answer but seeks the conditions under which one outcome becomes unavoidable.

  **Background and Significance**
  The debate over whether DNA carries "information" is stalled. Standard positions cluster into three families, all of which leave the core issue unresolved.

  First, *information-theoretic and causal literalists* argue that DNA carries information because it exhibits high causal specificity or Shannon information capacity. However, these accounts fail to distinguish a code from a complex trigger. A key turns a lock with high specificity, but we do not call the key a "message." Causal specificity alone cannot capture the semantic dimension of "coding."

  Second, *teleological and etiological accounts* occupy the middle ground. They ground meaning in the selected function of the translation machinery. While an improvement, these views often rely on the "arbitrariness" of the codon-amino acid mapping to distinguish code from chemistry. They argue that because the mapping is not chemically necessitated, it is conventional, requiring an interpreter. This conflates arbitrariness with normativity.

  Third, *developmental-systems skeptics* deny the privileged status of DNA, treating it as one resource among many. While they correctly identify that development is distributed, they often throw out the baby with the bathwater, dismissing the specific normative structure of translation alongside the myth of genetic determinism.

  All three families assume that arbitrariness and normativity stand or fall together. My project challenges this assumption. What makes something a code is not the arbitrariness of the mapping, but the availability of a distinction between being read correctly and being misread—a norm that a bare regularity does not supply. The central twist of this project is that these two marks of a code may pull apart. If the standard code is strikingly robust to single-nucleotide substitution and translational error, the mapping looks less arbitrary and more shaped by selection for a standard of correctness it did not itself impose. This creates a tension: error-robustness is either the strongest argument that code-talk is apt (because the system is optimized for fidelity) or the beginning of a reductio (because the "norms" are just physical stability constraints).

  **Methodology: Violations as Evidence**
  Rather than engaging in further conceptual analysis of the metaphor, I will analyze cases where the code is violated or modified. The status of "information" becomes most visible at the boundaries of the system. I will examine four classes of phenomena:

  1.  **Mistranslation and tRNA Mischarging:** When a tRNA is charged with the wrong amino acid, is the resulting protein "wrong"? If the organism survives, does the norm vanish, or was the norm merely statistical?
  2.  **Programmed Recoding:** In frameshifting and stop-codon reassignment, the machinery systematically "misreads" the canonical sequence to produce function. This suggests the norm is context-dependent, not sequence-intrinsic.
  3.  **Divergent Codes:** Mitochondrial and lineage-specific code variants show the mapping is not universal. I will investigate whether these are "new codes" or "corruptions" of the old one to determine where the normative boundary lies.
  4.  **Synthetic Biology:** Systems where codons are reassigned to non-canonical amino acids allow us to engineer normativity. If we can stipulate correctness conditions artificially, we can test whether natural correctness is of the same kind.

  By working through these cases, I will determine if "correctness" can be grounded in the etiological function of the translation machinery itself, independent of a phenotype-relative notion of what the organism needs in a specific environment.

  **Deliverable**
  The primary output will be a **Diagnostic Framework for Information-Bearing Explanations**. This will be a practical criterion designed for practicing molecular biologists. Currently, biologists oscillate between speaking of "genetic information" and "molecular mechanisms" without a clear rule for when the former is ontologically warranted.

  The framework will provide a decision procedure to determine whether a given sequence-involving explanation is genuinely information-bearing or merely a causal description. It will rely on identifying whether the system exhibits error-correction mechanisms that reference a standard distinct from immediate physical stability. If a biologist can identify a mechanism that treats a deviation as an *error* to be corrected rather than a *variation* to be selected, the explanation qualifies as information-bearing. This tool will clarify modeling choices in synthetic biology and evolutionary genetics.

  **Risk and Failure Conditions**
  The project fails if I cannot distinguish "error" from "alternative function" without appealing to human intention or post-hoc survival statistics. If every "mistranslation" can be redescribed as a causal interaction that simply failed to sustain life, then normativity collapses into causality, and the "code" is merely a metaphor. In this scenario, the deliverable would negate the utility of information talk entirely, recommending its abandonment in rigorous contexts.

  Furthermore, the argument relies on the empirical claim that the genetic code is optimized for error-robustness. If this claim is false or exaggerated, the argument that the system is shaped by a standard of correctness weakens. However, the project is designed to withstand this. If robustness is debunked, the focus shifts from evolutionary optimization to systemic resilience. The question becomes whether the machinery sustains normative distinctions *despite* noise, rather than *because* of optimization. The deliverable would then focus on the capacity for error-correction rather than the historical selection for fidelity. The core philosophical distinction between norm and cause remains intact even if the evolutionary story changes.

  **Work Plan**
  *   **Months 1–3:** Literature review on error-robustness claims and collection of case studies (mistranslation, recoding, synthetic systems).
  *   **Months 4–6:** Analysis of violation cases. **Go/No-Go Decision Point:** By Month 6, I must determine if the distinction between "error" and "variation" holds across the cases without circular appeal to fitness. If the distinction collapses, the project scales back to a critical critique of information talk rather than a naturalization of it.
  *   **Months 7–9:** Drafting the Diagnostic Framework and testing it against standard explanations in molecular biology textbooks and current literature.
  *   **Months 10–12:** Finalizing the dissertation chapter and preparing the framework for publication in a philosophy of science or theoretical biology venue.

  This plan ensures that even if the strong naturalization thesis fails, the fellowship yields a rigorous map of why it failed, clarifying the limits of information concepts in biology.
