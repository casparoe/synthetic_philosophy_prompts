  **To:** Internal Review Group
  **From:** Narrative Lead
  **Date:** October 12
  **Subject:** Decision Memo: Update Features & Build Lock

  **Recommendation:** We should ship Persistence with a specific condition on agent distress states, and exclude Legacy from this build.

  **Reasoning**
  With three months of runway remaining, matching competitor retention features is a business necessity; Persistence is the minimum viable product for our survival. However, Legacy undermines the core design contract of a life-sim. Even if we treat the characters as wind-up toys rather than simulated beings, allowing players to wipe memory removes the stakes of interaction. If players can undo social consequences instantly, attachment becomes transactional, and long-term retention drops. Design's unease here is correct: Legacy solves a short-term frustration but breaks the long-term loop.

  **Strongest Counter-Argument**
  The engineering and ML teams are right to note that without Legacy, agents risk entering unrecoverable "distress loops" due to the load-bearing learning rate mechanic. Furthermore, if we grant the premise that these agents have any simulated interiority, the Engineer's point stands: forcing a character to retain trauma without the option of a reset is arguably crueler than wiping them. If Persistence leads to agents becoming unengagingly "broken" on the server, retention numbers will suffer regardless of the feature's presence.

  **Agreed vs. Contested Claims**
  To ensure we are voting on the same reality, please note the distinction below:
  *   **Agreed Facts:** The distress-scaled learning rate is technically load-bearing (ML/Data). Competitor retention lifted with Persistence (Market Data). Build lock is the 14th (Schedule).
  *   **Contested Assumptions:** Whether agents have a moral status that makes "wiping" an ethical act versus a functional reset. Whether unseen server-side hours constitute "experience" that matters to the product. Whether player attachment relies on consequence (Narrative/Design view) or convenience (Playtester view).

  **Conditions for Approval**
  If we vote to proceed with Persistence and exclude Legacy, the following must be verified before build lock:
  1.  **Distress Cap Check:** ML must demonstrate by **Wednesday EOD** that agents running Persistence do not enter unrecoverable distress loops within a 40-hour cycle without Legacy.
  2.  **Verification:** ML Lead provides the data; Narrative and Design sign off on whether the resulting behavior breaks the character illusion.
  3.  **Fallback:** If agents become unengagingly "depressed" (low interaction rates) in testing, we revisit Legacy as a hotfix candidate, not a launch feature.

  **Bottom Line for Vote**
  Approve Persistence; Reject Legacy for Build Lock; Review distress data Wednesday.
