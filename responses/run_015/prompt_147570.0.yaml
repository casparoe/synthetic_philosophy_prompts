answer: |-
  In a modest ML lab, a team trains a small recurrent network to forecast rainfall using hourly soil moisture readings, but the dataset is plagued by recurring twelve-hour blackouts where sensors go completely silent. Despite the silence, the network consistently predicts severe drought conditions immediately upon data resumption, driven by a specific cluster of neurons in the hidden layer that spikes exclusively during those input gaps and decays precisely according to the elapsed time since the last moisture reading. The realist points to this activity as a genuine internal model of soil dehydration occurring unobserved, arguing the state carries content about the world independent of immediate stimulation, while the anti-realist counters that the neuron cluster is merely a causal placeholder—a sophisticated timer passing signal strength downstream without any semantic weight—since the network lacks an evolutionary history or a homunculus to read the state as "drought" rather than just "gap duration."

  Here's how the split plays out. The realist looks at that hidden-state spike during the blackout and sees a stand-in for the missing world; the network is holding onto the idea of "drying soil" even when the sensors are off, which is exactly what representations are supposed to do. The anti-realist sees the same math but calls it a trick of the light; sure, the state causes the right output, but without a user or evolutionary pressure selecting for *meaning* specifically, it's just causal glue holding the prediction together. The structural feature doing all the heavy lifting here is the temporal decoupling—that gap where the input stops but the internal state keeps working. If you remove the blackout and feed the network continuous data, the case collapses back into a boring argument about correlation: is this neuron detecting an edge or just riding the wave of input statistics? The gap forces the question of whether the network is maintaining information or just reacting.

  Ultimately, this experiment isn't designed to vindicate realism. Instead, it shows that the dispute is really about explanatory utility. The realist wants to say "representation" because it helps them debug the model by treating internal states like beliefs; the anti-realist says "causal relay" because it reminds them the model is just optimizing a loss function. An anti-realist defender would attack the setup by pointing out that the label "drought" is imposed by the engineers, not the net. They'd argue that calling the state a representation is just a convenient shorthand for us, not a fact about the machine, and that granting it ontological status risks anthropomorphizing a gradient descent optimizer.
