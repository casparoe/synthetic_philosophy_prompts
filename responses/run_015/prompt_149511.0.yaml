answer: |-
  Elena sat at her desk and opened the file for Leo Vance. The paper was crisp, the font uniform. The Registry of Unclaimed Deeds did not tolerate handwriting on official forms. Vance was nineteen, a deckhand on the harbour ferry *Morning Star*. Three months ago, a fuel line had ruptured in the engine room. Fire had followed. Vance had gone back inside to close the valve. He had suffered second-degree burns on his arms and smoke inhalation. He was alive. He was claiming certification.

  Elena read his statement twice. It was short. He wrote that he had not decided to go back. He knew the procedure for a rupture. No one else aboard knew the procedure. Therefore, there had been nothing to decide. He had simply acted.

  The insurer's submission sat on the left side of the folder. They argued that emergency response was implicit in the role of a deckhand. The employment contract listed safety protocols. Closing a fuel line was a safety protocol. Therefore, the act was owed. It was not unclaimed. If the Registry certified it, the insurer would not be liable for the indemnity. The state would be.

  The union's submission sat on the right. They argued that no contract could require a nineteen-year-old to enter a burning room. The risk exceeded the wage. The act was unclaimed. Certification would bring the state indemnity for lost wages and medical costs. It would also bring the medal. The union did not mention the medal in the letter, but Elena knew it was there. The medal mattered for the pension points.

  Elena took off her glasses. She was fifty-two. She had worked at the Registry for twenty years. Before that, she had worked in logistics. Before that, she had been in the water.

  She looked at the Vance statement again. *There was nothing to decide.* This was the second problem the Registry was designed to manage. The law said a deed was unclaimed if no duty existed. It did not say the actor had to know that no duty existed. But the assessors had to judge competence to approve indemnity. To judge competence, they had to ask what a reasonable person in that role would do. If a reasonable deckhand would close the valve, was it truly unclaimed? If Vance believed it was required, did that belief make it required?

  The Registry had been operating for thirty years. The statute was clear: a certified deed was non-precedential. It could not be cited to raise the standard for others. A rescue could not become a requirement simply because someone had done it. That was the ratchet the law meant to stop. If a nurse ran into a burning ward to save a patient, that act could not be used to prove that all nurses must run into burning wards.

  But the indemnity clause had changed the practice. To pay the claim, the state had to assess losses. To assess losses, the assessors had to verify the claimant acted with competence. If you acted incompetently during an unclaimed deed, you were negligent. Negligence voided the indemnity. So, assessors like Elena had to define competence. They wrote guidelines. They asked what a professional would do. Over twenty years, the guidelines had hardened. The competence standard for an unclaimed deed now looked exactly like the duty standard for a claimed one. The doctrine said the deed bound no one. The paperwork said that if you did it, you had to do it well, and if you had to do it well, you might as well be required to do it.

  Elena put her glasses back on. She looked at the photograph of Vance's arms. The skin was pink and tight. She thought about the third person in the underpass.

  It had been raining. The water had risen fast, swirling around the concrete pillars of the road dip. Elena had been twenty-three. She had waded in. The current was strong, carrying debris. She had pulled two people to the ledge. There was a third, a man in a suit, caught against the grate. She had reached for him. The water pushed him under. She had gone down with him. She had come up alone.

  Mark had been on the railing above. He had a coiled rope. He had not gone in. He had held the rope for the two she saved. When she came out, coughing water, he had wrapped the rope around her shoulders. He had not said anything. She had not spoken to him since that night.

  She had never filed her deed.

  If she filed it now, the Registry would certify that her act was unclaimed. They would certify that she owed nothing to the man in the suit. They would also certify that Mark owed nothing. He had stood on the dry concrete with the rope. That was all he had owed. Certification would close the file. It would state formally that he had not failed her. It would state that he had not failed the man in the suit.

  Elena picked up the pen for the Vance case. She had to determine if the role of a deckhand swallowed the act of closing the valve. Was there always something left over that the role did not require? Or did the job description expand to fill the emergency?

  If she denied Vance, she upheld the insurer's view. The job swallowed the act. But then Vance would have to sue for workers' compensation, which required proving negligence on the part of the ferry operator. That would take years. If she certified Vance, she upheld the union's view. The act was extra. But then the indemnity assessment would begin. She would have to write the report on his competence. She would have to decide if a nineteen-year-old should have known how to close the valve under fire. If she wrote that he should have known, she created a standard. The next deckhand would be expected to know. The unclaimed deed would become a precedent in everything but name.

  She looked at the clock. It was four in the afternoon. The office was quiet. The hum of the ventilation system was the only sound.

  Elena closed the Vance file. She did not sign the determination form. She pushed it to the side. She opened the bottom drawer of her desk. Inside was a manila envelope, sealed with tape that had yellowed over time. Her own file. It contained the witness statements from the underpass. It contained the medical report from the hospital. It contained the letter from Mark's lawyer, written ten years ago, asking her to file so the statute of limitations on any potential liability would expire.

  She had kept it here because filing it felt like absolving him. Not filing it felt like holding him accountable. But the Registry did not deal in accountability. It dealt in classification. It sorted acts into *owed* and *unclaimed*. It did not sort them into *right* and *wrong*.

  If she filed, she accepted the indemnity. She could claim the lost wages from the months she spent recovering. She could claim the medical costs for the lung damage that still bothered her in the winter. The state would pay. In exchange, the state would record that Mark had stood on the railing and done exactly what was required of him. Nothing more. Nothing less.

  The third problem sat in the space between the file and the pen. Could an act survive being officially recognised as optional? Once the Registry stamped it *unclaimed*, it became a transaction. There was compensation. There was a standard of competence. There was a medal. The act was no longer just something that happened. It was something that was processed. The recognition changed the nature of the deed. It made it part of the system it was meant to stand outside of.

  Elena took the envelope out of the drawer. She placed it on the desk next to the Vance file. The yellow tape cracked when she peeled it back. Inside, the papers were still stiff. She read her own statement from thirty years ago. *I went in because he was there.* It was not a professional assessment. It was not a calculation of risk. It was a description of motion.

  She picked up the form for Certification of Unclaimed Deed. It was the same form Vance would get. Box one: Claimant Details. Box two: Description of Act. Box three: Declaration of Non-Obligation.

  If she signed Box three, she declared that no law, no contract, and no social duty had required her to enter the water. It also declared that no law, no contract, and no social duty had required Mark to enter the water. It would fix the night in place. It would stop the memory from shifting. It would make the drowning a matter of record, not a matter of guilt.

  But the record would also create the standard. If she was certified, someone would read the assessment. They would see that she had survived. They would see that Mark had stayed dry. They would see that the state had paid for it. In thirty years, the Registry had taught people that survival had a price, and that price was paid in paperwork.

  Elena dipped the pen in the inkwell. She did not use ballpoints for final determinations. The ink flowed onto the paper. She filled in Box one. Her name. Her address. Her employee number.

  She moved to Box two. *Rescue attempt during flood event.* She wrote the date.

  She hovered over Box three. The ink gathered at the tip of the nib. A single drop formed, dark and heavy. It waited for the paper to catch it.

  Outside the window, the city lights were coming on. The ferry terminals would be closing. The deckhands would be going home. Vance would be waiting for the letter. Mark would be sleeping, or watching television, or thinking about the rope.

  Elena lowered the pen. The tip touched the line where the signature would go. She did not press down. She held the pen there, feeling the weight of it in her hand, the balance of the wood and the metal. The ink spot spread slightly, a small dark circle on the white space.

  She lifted the pen. She set it down on the desk. She looked at the file, then at the form. She picked up the pen again.
