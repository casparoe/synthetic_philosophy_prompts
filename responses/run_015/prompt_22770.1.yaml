      *   **The Problem with Pragmatism:** If it's just use, why does quoting the word feel dangerous? Why does a non-member using it offend even with "good" intent? The "offense" persists too broadly for pure pragmatics.
      *   **The Semantic Case (The Core):** The word carries a "conventional implicature." It expresses an attitude as part of its literal meaning. It's not just *what* you say, it's *how* the word is built.
      *   **The Reappropriation Challenge:** This is the crux. If the meaning is "inferior," how can it mean "brother"?
