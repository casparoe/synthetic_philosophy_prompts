  I'm working on a novel set in a linguistics department and I keep hitting a wall on the slur stuff, so I'd like an essay on the live controversy over whether the derogatory force of a slur is baked into its meaning or whether it's purely a matter of how it's used pragmatically. Weigh the two sides and land on a verdict -- and I want the essay to actually grapple with reappropriation, i.e. in-group members using the slur without it landing as an insult, since that seems to be where the semantic account gets squeezed hardest. Defend the conclusion rather than hedging.
