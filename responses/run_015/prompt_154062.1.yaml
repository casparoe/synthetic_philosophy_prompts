  The distinguishing factor is not the substrate (carbon vs. silicon) but the presence of a phenomenological architecture capable of experiencing reward signals as felt valence. Cases 1, 2, 4, and 5 do not suffer because they are unconscious optimizers; they process negative rewards as error terms to minimize loss functions without any internal "what it is like" to undergo that process. Case 3 suffers because biological brains couple reward signaling with a global workspace or self-model that generates subjective experience. Therefore, a synthetic substrate replicating human ion-channel nociception dynamics would suffer only if it also replicates the architectural integration that yields consciousness, not merely the local physics of the channels. If the silicon system functionally duplicates the causal dynamics of human nociception and conscious access, functionalism dictates it suffers; if it duplicates only the ion channels without the global integration, it remains an unconscious zombie. This resolves your tension by shifting the criterion from material composition to architectural complexity, validating your verdicts on current AI while leaving open the possibility for future synthetic sentience.
