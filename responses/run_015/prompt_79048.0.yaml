answer: |-
  ### Part I: The Philosophical Distinctions

  You asked which distinctions can survive translation into a committee procedure. You do not need to know the names of the philosophers; you need to know which tools keep the procedure stable and which break it.

  **1. Hard Treatment vs. Censure (Survive)**
  *   **Theory:** Punishment involves inflicting something unpleasant (hard treatment) to express disapproval (censure).
  *   **Procedure:** Split your menu of sanctions into **Restrictive** (suspension, expulsion, removal) and **Expressive** (private word, formal censure, public statement).
  *   **Why:** This prevents you from expelling someone (hard treatment) without clearly stating why (censure). It forces you to ask: "Are we trying to stop them, or are we trying to speak to the community?"

  **2. Determinate Authority (Survive — Critical)**
  *   **Theory:** Punishment requires a legitimate authority, a stated sentence, and an end date. The "shapelessness" you suffered was the absence of this.
  *   **Procedure:** Every decision must have a **Chair's Signature**, a **Date of Effect**, and a **Review/End Date**. "Indefinite suspension" is banned. If you cannot set an end date, you cannot impose the sanction.
  *   **Why:** This distinguishes you from the online mob. It is your primary defense against becoming what you hate.

  **3. Punishment vs. Protective Measures (Survive)**
  *   **Theory:** Punishment looks back at blame; protection looks forward at risk.
  *   **Procedure:** Create two tracks. **Track A (Blame):** Requires proof of rule-breaking. **Track B (Risk):** Requires proof of danger to the association, even if rule-breaking is ambiguous.
  *   **Why:** Sometimes a member hasn't broken a specific rule but makes the association unsafe for others. This allows you to act on Case 3 (below) without lying about the rules.

  **4. Legality/Foreseeability (Survive)**
  *   **Theory:** You cannot punish someone for breaking a rule that didn't exist or wasn't knowable.
  *   **Procedure:** **Question 1** of your procedure must be: "Did a written rule covering this conduct exist at the time?" If no, Track A stops. You may only proceed on Track B (Risk), which has a higher voting threshold.
  *   **Why:** This prevents arbitrary decisions. It is the bedrock of fairness.

  **5. Standing (Survive)**
  *   **Theory:** Only those with a specific interest can bring a claim.
  *   **Procedure:** Complaints must come from **Members** or **Direct Victims**. Third-party reports (e.g., "I saw this on Twitter") are inadmissible unless the reporter is a member willing to be named.
  *   **Why:** This filters out mob-driven complaints and vendettas by people outside your jurisdiction.

  **6. The Aggregation Problem (Abandon)**
  *   **Theory:** Thousands of small sanctions summing to a punishment no one imposed.
  *   **Procedure:** You cannot adjudicate the mob's actions. You must ignore the "sum" of online pressure.
  *   **Why:** You have no power over the mob. Acknowledging this distinction gives you no procedural leverage. Treat the online campaign as *noise*, not *evidence*.

  **7. Outside Sanctions (Mitigation Only)**
  *   **Theory:** Should punishment from strangers count?
  *   **Procedure:** External sanctions (job loss, online shaming) **cannot** determine liability (guilt), but they **can** reduce the quantum (severity) of your sanction.
  *   **Direction:** If a member has already lost their job due to the allegation, expulsion from your association may be disproportionate "cruelty" rather than necessary "protection." Use this to reduce hard treatment, not censure.

  ***

  ### Part II: The Procedure

  This procedure is designed to be a flowchart. It forces you to stop if the criteria aren't met. It removes the need for theoretical debate during meetings.

  **The Menu of Sanctions**
  1.  **No Action:** File closed.
  2.  **Private Word:** Chair writes to member; no record in file.
  3.  **Formal Censure:** Letter placed in member's file; not public.
  4.  **Removal from Office:** Removed from committees/boards, membership retained.
  5.  **Suspension:** Membership rights paused for a fixed period (max 2 years).
  6.  **Expulsion:** Membership terminated.
  7.  **Public Statement:** Association publishes findings (can be paired with any of the above).

  **The Decision Flow**

  **Step 1: Admissibility (The Gate)**
  *   *Question:* Is the complainant a member or direct victim?
      *   *No:* Stop. (No Action).
      *   *Yes:* Proceed.
  *   *Question:* Did a specific Code of Conduct rule exist at the time of the act?
      *   *No:* Track A (Blame) stops. Proceed to Step 2B (Risk).
      *   *Yes:* Proceed to Step 2A (Fact).

  **Step 2A: Fact & Culpability (Track A - Blame)**
  *   *Question:* Is there clear evidence (documents, witnesses) the rule was broken?
      *   *No:* Stop. (No Action).
      *   *Yes:* Proceed to Step 3.
  *   *Question:* Was the intent malicious or negligent?
      *   *No (Accident):* Private Word.
      *   *Yes:* Proceed to Step 3.

  **Step 2B: Risk Assessment (Track B - Protection)**
  *   *Question:* Does the member's continued presence pose a demonstrable risk to the association's viability or safety of members?
      *   *No:* Stop. (No Action).
      *   *Yes:* Proceed to Step 3. (Note: Requires 75% committee vote).

  **Step 3: External Mitigation**
  *   *Question:* Has the member already suffered significant professional loss due to this matter?
      *   *Yes:* Reduce Restrictive sanction by one level (e.g., Expulsion becomes Suspension). Expressive sanctions remain.
      *   *No:* Proceed to Step 4.

  **Step 4: Selection (The Matrix)**
  *   *If Track A (Blame):* Select sanction based on severity of rule breach.
  *   *If Track B (Risk):* Select sanction based on minimum necessary to mitigate risk (usually Removal from Office or Suspension).
  *   *Public Statement?* Only if required to restore confidence in the association. (Requires President's signature).

  **Step 5: Quantum & Terminus**
  *   *Requirement:* Every Restrictive sanction must have an **End Date**.
  *   *Requirement:* Every Public Statement must define its **Duration** online (e.g., "Press release archived after 1 year").
  *   *Review:* A date is set for automatic review. The sanction expires unless renewed by a new vote.

  **Where Values Enter (The Handoff)**
  The procedure handles facts. The Committee handles values at **Step 4**.
  *   *Fact:* Did he say it? (Evidence).
  *   *Value:* Does saying this destroy trust in the profession? (Committee Vote).
  *   *Procedure:* If the committee is split 5-4 on the value judgment, the sanction defaults to the **lesser** option. Ambiguity benefits the member.

  ***

  ### Part III: Running the Cases

  Here is how the procedure executes on your three scenarios. I have highlighted where this will feel wrong to you.

  **Case 1: The Crude Joke**
  *   *Facts:* Member made a joke on a *personal* account. Screenshotted and circulated.
  *   *Step 1 (Admissibility):* Complainant is a member. Rule exists ("Conduct unbecoming").
  *   *Step 2A (Fact):* Did he break the rule? The Code likely covers "professional conduct." A personal account is a grey area. Evidence is a screenshot (authentic).
  *   *Step 3 (Mitigation):* Member has received significant online abuse; some conference invites withdrawn.
  *   *Step 4 (Selection):* The breach is minor (one joke, personal time). The external sanction is high (online shaming).
  *   *Decision:* **Private Word.** No public statement.
  *   *Why it feels like Cowardice:* The public and the complainants want a Public Statement or Censure to signal that the joke was wrong. By doing nothing public, you look like you are condoning the joke. But the procedure dictates that external shaming counts as mitigation, and personal accounts are low jurisdiction. You will be called weak.

  **Case 2: Private Harassment**
  *   *Facts:* Years of harassment of a junior colleague. Documented. Employer investigating.
  *   *Step 1 (Admissibility):* Victim is a member. Rule exists (Harassment).
  *   *Step 2A (Fact):* Evidence is documented. Intent is clear.
  *   *Step 3 (Mitigation):* Employer is investigating. Member is still employed (for now). No external sanction *yet*.
  *   *Step 4 (Selection):* Severe rule breach. High harm.
  *   *Decision:* **Suspension (1 Year) pending employer outcome.**
  *   *Why it feels Standard:* This is what you expect. However, note the *End Date*. If the employer clears him in 11 months, your suspension still ends unless you re-vote. This prevents indefinite limbo.

  **Case 3: Quiet Exclusion**
  *   *Facts:* Senior member's conduct at annual meetings has quietly stopped junior members from attending. No specific complaints filed, but registration data shows drop-off.
  *   *Step 1 (Admissibility):* Complaint brought by Committee (on behalf of association). Rule? No specific rule against "being intimidating."
  *   *Step 2B (Risk):* Track A fails (No rule broken). Move to Track B. Is there a risk to viability? Yes, junior membership is collapsing.
  *   *Step 4 (Selection):* Requires 75% vote.
  *   *Decision:* **Removal from Office + Public Statement.**
  *   *Why it feels Hard:* You are sanctioning him without a specific rule breach (Track B). You are punishing him for the *effect* of his presence, not a specific act. This feels dangerously close to the "shapelessness" you hated. However, the Procedure justifies it via *Protection*, not *Blame*. You are not calling him a criminal; you are saying he is incompatible with the association's survival. This will be read as ruthless, but it saves the organization.

  ***

  ### Part IV: Misfires and Gaming

  No procedure is perfect. Here is where this one will break.

  **1. The "Cowardice" Trap (Case 1 Misfire)**
  *   *Risk:* By strictly adhering to "Personal Account" and "External Mitigation," you may fail to uphold the profession's values when the public expects it.
  *   *Gaming:* Members will use personal accounts to abuse colleagues, knowing the Committee's hands are tied by jurisdiction.
  *   *Fix:* You must update the Code of Conduct to explicitly include "Public conduct that brings the profession into disrepute," even on personal channels. Until then, the procedure binds you to inaction.

  **2. The "Protection" Loophole (Case 3 Misfire)**
  *   *Risk:* Track B (Risk) allows you to sanction without a rule breach. This is the most dangerous power you have. It replicates the "shapelessness" you suffered, even if you add an end date.
  *   *Gaming:* A majority faction on the Committee could use "Risk to Viability" to remove political opponents who haven't broken rules but are "bad for the brand."
  *   *Fix:* Keep the 75% voting threshold for Track B high. Require the Public Statement in Track B cases to explicitly state: *"This is a protective measure, not a finding of misconduct."*

  **3. The "End Date" Rigidity**
  *   *Risk:* You set a 1-year suspension. At month 11, the member is still dangerous. The sanction expires automatically.
  *   *Gaming:* Members will ride out the clock, knowing you have to do fresh work to extend the sanction.
  *   *Fix:* The procedure must allow for a **Review Hearing** at month 10. The burden of proof shifts: the member must show they are no longer a risk to extend the suspension, or the Committee must re-vote.

  **4. The Mob Ignored**
  *   *Risk:* The procedure says "Ignore the Aggregation." But if the mob is right, and you ignore them, you lose legitimacy.
  *   *Gaming:* Campaigners will flood the committee with individual member complaints to bypass the "Standing" filter.
  *   *Fix:* Consolidate complaints. If 50 members complain about the same act, treat it as one complaint with 50 witnesses, not 50 cases.

  ### Final Note to the Committee

  You asked for a procedure that does the work of a theory. This procedure prioritizes **Authority** (signatures/dates) over **Retribution**. It forces you to distinguish between *blaming* a member and *protecting* the association.

  It will require you to do nothing when the crowd screams (Case 1), and to act when the rules are silent (Case 3). This is the burden of being an authority rather than a mob. The shapelessness you suffered came from a lack of boundaries. This procedure builds walls. Sometimes you will hate the walls because they keep you from doing what feels emotionally satisfying. That is the price of ensuring you never become what happened to you.
