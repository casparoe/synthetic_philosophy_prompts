  We put the metal on the scale to weigh,
  And watch the needle settle on the measure.
  It sits inside the glass of the vessel,
  We bring the candle close to feed the flame.
  It breathes itself into the common air,
  And leaves behind a residue of calx.
  What remains is not just ash but calx,
  Heavier now than when we started weigh.
  Something gone into the surrounding air,
  Or something added past the strict measure.
  The fire dies, extinguishing the flame,
  Trapped within the sealed and empty vessel.
  Nothing enters through the wall of vessel,
  Yet the rusted skin becomes a heavier calx.
  What leaves the metal with the flame,
  Or enters in to make it weigh.
  The balance sheet must match the measure,
  Regardless of the quality of air.
  We pump the gas out of the air,
  Into the vacuum of the glass vessel.
  The numbers hold beyond the old measure,
  Though we rename the rusted calx.
  We do not need the scale to weigh,
  What feeds the burning of the flame.
  The fire rises, brightening the flame,
  In this refined and purified air,
  We know exactly how much to weigh,
  Within the confines of the vessel.
  The metal turns to earth, to calx,
  Keeping strict account by measure.
  The account books balance on the measure,
  While the old fire still lights the new flame.
  We scrape the powder from the calx,
  And breathe the same unchanging air.
  It holds within the sealed glass vessel,
  The truth we use the scale to weigh.
  We keep the measure fixed within the air,
  And trust the flame inside the glass vessel,
  Where calx is earth and metal when we weigh.
