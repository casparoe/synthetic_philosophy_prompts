      *   **Marcus's Response to Curve-Fitting:** He needs to address this directly. He should argue that "simplicity" *is* a prior constraint on hypothesis space. It's not magic; it's a structural requirement for learning.
      *   **Marcus's Diagnostic Argument:** This is his core constraint. The doctor example. Strep throat. Base rates matter more than "explanatory power."
