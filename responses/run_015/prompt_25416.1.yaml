          *   Bayesian: Diagnostic reasoning case (doctor inferring strep throat; clearly base rates and conditional probabilities; "explanation" adds no work).
      *   **Constraint:** Each must respond to the other's central example (no pivoting).
      *   **Constraint:** Each must clarify what they take "explanation" to pick out.
      *   **Goal:** Reveal if the disagreement is substantive (about rationality) or verbal (talking past each other).

  2.  **Character Development:**
      *   *Irreducibilist:* Let's call her **Elena**. She values the intuitive leap of understanding, the "aha" moment of explanation. She sees science as more than number-crunching.
      *   *Bayesian:* Let's call him **Marcus**. He values formal rigor, coherence, and the universality of probability theory. He sees "explanation" as a psychological gloss on statistical inference.
