prompt: |-
  I am the clinical lead of the Coverage Review Committee of a national health insurance scheme, and I need a decision procedure, not an essay. We are eight people — two clinicians, a health economist, a patient representative, a lawyer, an actuary, a physiologist, and me (a general internist, no philosophy training). We meet for one afternoon a month and work through one or two petitions, roughly fifteen a year: a specialist society, a patient group, or a manufacturer asks us to recognise some condition as a disease, which determines whether the scheme pays for its treatment and whether people get income-replacement benefits. Every decision must be issued with written reasons, every denial is appealable to a tribunal, and our lawyer insists that any step in our reasoning that is a judgment about what matters rather than a judgment about how bodies work be labelled as such and attributed to the committee by name, because the tribunal reads our decisions against each other and notices when we have passed a value judgment off as physiology. Our enabling regulation is no help: it entitles insured people to treatment for disease, injury or disorder and says nothing more, and the tribunal has told us we must give reasons that separate those from the ordinary discomforts and misfortunes of life, which it has never defined.

  What pushed me to write is two decisions and one near-miss of our own. First, last year we denied a petition from a man whose exhaustion and insomnia followed from holding two jobs and caring for a disabled parent, calling it ordinary misfortune; six months earlier we had approved a chronic pain condition with almost the same symptom profile because an imaging study showed something. I cannot tell from our reasons whether the difference was metaphysical or financial, and I suspect we laundered a coverage decision as an ontological one. Second, our statute forces a sunset review every five years, and at the first one our actuary pointed out that a condition we had recognised now tested positive in more than twice as many people as before — not because bodies had changed but because recognition produced testing, testing produced diagnoses, and diagnoses changed the measured distribution. Under any reading of disease that appeals to statistically typical functioning, our own decision had made the condition normal, and we quietly declined to draw that conclusion. Call these prevalence-inflating recognitions if it helps; I want a procedure that says what to do with them rather than letting us fudge. I have read a little of the philosophy — the biostatistical theory associated with Boorse, on one side, and Wakefield's harmful-dysfunction analysis as a hybrid — and I do not want a survey of it. I want a procedure that still runs if the naturalist is basically right, if the hybrid is right, and if the normativist is right, with the steps marked where the answer would diverge, and with the places where a value judgment enters flagged rather than hidden.

  So: give me the ordered questions my committee should ask of a petition, what would count as a sufficient answer to each and who has to supply it, where the procedure stops with a no, and where it must stop and hand the question to a person because it has run out of facts and reached a matter of values. It has to be runnable in two hours by people who have never read the literature, and it has to produce a defensible written record. Among the things it must be able to handle: how the reference class gets fixed (by age, by sex, by population, and as of when — before or after a recognition that changes prevalence); the gap between a trait being statistically common and a mechanism doing what it is supposed to do; a demonstrable dysfunction that harms nobody; real and serious harm with no dysfunction we can identify; conditions that only disable because of how schools, workplaces or benefit rules are arranged; conditions that become visible only with a new test and never trouble most of the people who have them; and harms that consist in the frustration of a particular person's projects, as with a mild tremor that ends a violinist's career and is nothing to an accountant. I also want to know whether the procedure should try to settle three questions separately or collapse them: whether the state is a disease, whether it was caused by something the scheme or the state is responsible for, and whether we should pay for treating it. Then run it on three petitions: low testosterone in an otherwise healthy sixty-eight-year-old with levels at the thirtieth percentile for his age, fatigue and low mood, and no identifiable pathology; exhaustion and cynicism in a thirty-four-year-old emergency-department nurse that resolves completely on leave, with no biomarker; and a small indolent thyroid lesion found incidentally on a scan done for an unrelated reason, where most people with the finding never develop symptoms but a specialist society wants it recognised. At least one of these must come out with an answer my committee will not like — my guess is that a properly built procedure will either force us to call the nurse's state a disease or force us to admit we are refusing her on grounds of cost and precedent, and I would rather be told now which. Finally, tell me what the procedure cannot do: where it will misfire, which distinctions it has to leave to us, and whether it can actually stop a committee from dressing up a budget decision as a claim about what a disease is. As you go, say how confident you are in each substantive claim you make about what the concept of disease requires, and single out the step or claim you are least sure of and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Clinical Lead of a Coverage Review Committee (national health insurance).
      *   **Context:** 8 members (clinicians, economist, patient rep, lawyer, actuary, physiologist, lead internist). Meets monthly, 1-2 petitions/year. High stakes (coverage + income replacement). Legal requirement: Separate value judgments from physiological facts. Tribunal scrutiny.
      *   **Problem:** Inconsistent decisions (exhaustion denied vs. chronic pain approved based on imaging), prevalence inflation (recognition creates diagnosis), and lack of clear statutory definition of "disease."
      *   **Goal:** A *decision procedure* (ordered questions, not an essay). Must be runnable in 2 hours by non-philosophers. Must produce a defensible written record. Must handle specific edge cases (reference classes, statistical vs. functional, harm without dysfunction, social disability, overdiagnosis, individual projects).
      *   **Philosophical Constraint:** Must work regardless of whether Naturalist (Boorse), Hybrid (Wakefield), or Normativist views are correct. Must flag where views diverge.
      *   **Specific Tasks:**
          1.  Define the procedure (steps, who answers, stop conditions, value flags).
          2.  Address the three questions (Is it disease? Causation/Responsibility? Should we pay?).
          3.  Run the procedure on three test cases (Low T in 68yo, ED Nurse burnout, Indolent thyroid lesion).
          4.  Identify limitations (where it misfires, can it stop budget laundering?).
          5.  Confidence ratings on claims + identify the least certain step.

  2.  **Deconstruct the Philosophical Landscape (for the Procedure):**

      *   *Naturalist (Boorse):* Disease = deviation from species-typical functional design. Value-free (mostly). Problem: Reference class, "normal" aging, overdiagnosis.
      *   *Hybrid (Wakefield):* Disease = Harmful + Dysfunction. Dysfunction = failure of evolved mechanism. Harm = value judgment.
      *   *Normativist:* Disease = disvalued condition. Problem: Too broad (poverty, ugliness).
      *   *The User's Need:* A procedural bridge. We need to establish *facts* first (mechanism, stats), then explicitly vote on *values* (harm, responsibility, priority).
      *   *Key Insight:* The lawyer's requirement is the key. "Label value judgments as such." The procedure must force the committee to say "We are deciding this is a disease *because we value X*" rather than "This is a disease because biology says so."

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to be linear. Step 1: Facts. Step 2: Mechanism/Function. Step 3: Harm. Step 4: Social/Environmental context. Step 5: The "Disease" Label (Value Vote). Step 6: Coverage (Separate Vote).
      *   *Reference Class:* This is a major sticking point. The actuary noted prevalence inflation. The procedure needs to fix the reference class *before* looking at the petition's data if possible, or adjust for the "recognition effect."
      *   *The Three Questions:* The prompt asks if they should be separate or collapsed. *Decision:* They must be separate. "Is it a disease?" (Ontological/Medical), "Did we cause it?" (Liability), "Do we pay?" (Resource Allocation). Collapsing them leads to the "laundering" the user hates.
      *   *Value Flags:* Every step that isn't purely empirical needs a [VALUE JUDGMENT] tag.

  4.  **Refining the Steps (The "Two-Hour" Constraint):**

      *   Keep it tight.
      *   Assign roles (Physiologist/Clinician for mechanism, Actuary for stats, Patient Rep/Economist for harm/cost).
      *   Stop rules: If it fails Step 2 (Mechanism), it's not a dysfunction (unless Normativist override). If it fails Step 3 (Harm), it's not a disease (Wakefield/Normativist).
      *   *The "Prevalence Inflation" Fix:* Need a specific step on "Baseline Reference." Use pre-recognition data or external population data.

  5.  **Developing the Test Cases:**

      *   *Case 1 (Low T, 68yo):* Statistical normality vs. Individual harm. Aging vs. Disease.
      *   *Case 2 (ED Nurse):* Social cause vs. Internal dysfunction. Burnout.
      *   *Case 3 (Thyroid):* Overdiagnosis. Pathology present, harm absent.
      *   *Prediction:* The Nurse case is the hard one. If we require internal dysfunction, she fails. If we require Harm + Social Recognition, she passes. The procedure must force a choice.

  6.  **Addressing the "Budget Laundering" Constraint:**

      *   Can a procedure stop this? Only if the "Coverage" decision is legally distinct from the "Disease" decision. The procedure must enforce a "Firewall."
      *   *Honesty Check:* A procedure can't stop human nature, but it can create a paper trail that makes laundering obvious to the Tribunal.

  7.  **Confidence Ratings & Uncertainty:**

      *   Need to be explicit. High confidence on separating facts/values. Low confidence on fixing the reference class objectively (philosophically contentious).

  8.  **Drafting the Content (incorporating specific constraints):**

      *   *Tone:* Professional, direct, administrative but philosophically rigorous.
      *   *Formatting:* Numbered steps, bold tags for Value Judgments, clear roles.
      *   *The "Three Questions":* Explicitly separate Ontology, Liability, and Coverage.
      *   *The Test Cases:* Run them through the steps.
      *   *Limitations:* Be honest about where the procedure relies on the committee's integrity.

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is this too complex for 2 hours?
      *   *Fix:* Simplify the language. Use checklists.
      *   *Critique:* Did I address the prevalence inflation?
      *   *Fix:* Add Step 2b regarding "Reference Class Stability."
      *   *Critique:* Did I answer the "three questions" part?
      *   *Fix:* Make Phase 1 (Disease), Phase 2 (Liability), Phase 3 (Coverage) distinct.
      *   *Critique:* The user wants to know where the philosophy diverges.
      *   *Fix:* Add "Philosophical Divergence Notes" at critical junctures.

  10. **Final Polish:** Check against all constraints in the prompt (8 members, lawyer's requirement, tribunal scrutiny, specific cases, confidence ratings). *Ensure the "Least Certain Claim" is highlighted.*

  *(Self-Correction on the Nurse Case)*: If I follow Boorse strictly, burnout isn't a disease (no internal mechanism failure). If I follow Normativists, it is (harmful). The procedure must force the committee to vote on whether "socially induced harm" counts as "dysfunction." This is the pivot point.

  *(Self-Correction on Reference Class)*: The actuary's point is crucial. If we recognize a condition, prevalence goes up. We must define the reference class *independently* of the petition's diagnostic criteria if possible, or acknowledge the circularity.

  *(Final Plan)*:
  1.  Introduction (Purpose & Constraints).
  2.  The Procedure (3 Phases, 7 Steps).
  3.  Role Allocation.
  4.  Running the Cases.
  5.  Limitations & Confidence.
  6.  The "Least Certain" Claim.

