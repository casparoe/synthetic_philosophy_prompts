answer: |-
  **TO:** Coverage Review Committee
  **FROM:** Clinical Lead
  **SUBJECT:** Decision Procedure for Petitions (v1.0)
  **TIME ALLOTMENT:** 120 Minutes per Petition
  **OBJECTIVE:** Produce a defensible written record that separates physiological fact from value judgment, satisfying Tribunal scrutiny and preventing "budget laundering."

  ---

  ### PART 1: THE PROCEDURE

  This procedure separates three distinct questions that are often conflated:
  1.  **Ontology:** Is this state a "disease/disorder" under the Act?
  2.  **Liability:** Is the Scheme responsible for this state (causation)?
  3.  **Allocation:** Should the Scheme fund treatment/benefits for this state?

  **Rule of Record:** Any step marked **[VALUE]** requires a recorded vote. The Chair must state: *"The Committee is now making a value judgment, not a factual finding."* The lawyer will record the specific value invoked (e.g., "autonomy," "equity," "fiscal sustainability").

  #### PHASE 1: ONTOLOGY (Is it a Disease?)
  *Time Limit: 60 Minutes*

  **Step 1: The Mechanism Check (Fact)**
  *   **Question:** Is there a demonstrable deviation in internal physiological or psychological functioning compared to the species-typical design?
  *   **Evidence Required:** Peer-reviewed pathophysiology, imaging, lab values, or established psychological mechanisms.
  *   **Who Answers:** Physiologist and Clinicians.
  *   **Stop Rule:** If **NO**, proceed to Step 1b. If **YES**, proceed to Step 2.
  *   **Step 1b (Normativist Override):** If no mechanism is found, does the condition involve severe suffering or incapacity that the Committee agrees *ought* to be medicalized?
  *   **[VALUE]**: This step acknowledges that "disease" can be defined by harm alone (Normativist view) even without known dysfunction.
  *   **Who Answers:** Full Committee Vote (Majority).
  *   **Stop Rule:** If **NO** here, Petition **DENIED**. Reason: "Not a disease."

  **Step 2: The Reference Class Fix (Fact + Value)**
  *   **Question:** Against what population is "function" measured?
  *   **Constraint:** To prevent prevalence inflation (the Actuary's concern), the reference class must be fixed to **pre-recognition population data** or **external biological norms**, not the current insured population diagnosed post-recognition.
  *   **Who Answers:** Actuary and Physiologist.
  *   **[VALUE]**: Selecting the reference class (e.g., "68-year-olds" vs. "healthy 68-year-olds") is a value choice about what counts as "normal aging" vs. "pathology."
  *   **Stop Rule:** If the trait is statistically typical for the fixed reference class *and* no harm is proven, Petition **DENIED**. (Boorse Naturalist constraint).

  **Step 3: The Harm Check (Value)**
  *   **Question:** Does the deviation cause harm?
  *   **Definition of Harm:** Must be either (a) increased risk of death/pain, OR (b) significant limitation of life plans/projects (e.g., the violinist's tremor).
  *   **Who Answers:** Patient Representative and Clinicians.
  *   **[VALUE]**: Deciding which "life plans" count (e.g., is being a violinist a protected interest?) is a value judgment.
  *   **Stop Rule:** If **NO** (e.g., indolent lesion with no symptoms), Petition **DENIED**. Reason: "Dysfunction without harm is not a disease." (Wakefield Hybrid constraint).

  **Step 4: The Social Context Filter (Value)**
  *   **Question:** Is the harm caused by the body, or by social arrangements (workplace, laws, stigma)?
  *   **Example:** The nurse's exhaustion resolves on leave. Is the "dysfunction" in the nurse or the shift roster?
  *   **[VALUE]**: The Committee must decide if socially-induced incapacity counts as "disease" for the purpose of the Act, or if it is an occupational/social issue.
  *   **Stop Rule:** If the Committee votes that the cause is primarily social/structural, Petition **DENIED** as "Disease." (It may proceed to Phase 2 for Liability).

  **OUTPUT OF PHASE 1:** A binary finding: **DISEASE** or **NOT DISEASE**.
  *Note: A "NOT DISEASE" finding does not end the petition; it moves it to Phase 2.*

  ---

  #### PHASE 2: LIABILITY (Is the Scheme Responsible?)
  *Time Limit: 30 Minutes*

  **Step 5: Causation and Responsibility (Fact + Value)**
  *   **Question:** Did the condition arise from an insured event, or is it a condition the Scheme has agreed to cover regardless of cause?
  *   **Fact:** Actuary/Clinician establishes timeline and risk factors.
  *   **[VALUE]**: The Committee decides if "responsibility" extends to conditions exacerbated by systemic factors (e.g., healthcare workforce burnout) even if not a "disease."
  *   **Output:** **COVERABLE EVENT** or **NON-COVERABLE EVENT**.

  ---

  #### PHASE 3: ALLOCATION (Should We Pay?)
  *Time Limit: 30 Minutes*

  **Step 6: Priority and Sustainability (Value)**
  *   **Question:** Given the finding of Disease (Phase 1) or Coverable Event (Phase 2), does this claim priority over other uses of funds?
  *   **Evidence:** Health Economist provides cost-per-QALY or budget impact.
  *   **[VALUE]**: This is explicitly a budget decision. It must not be disguised as a medical finding.
  *   **Output:** **FUNDED** or **NOT FUNDED**.

  **Step 7: Written Reasons Assembly**
  *   **Task:** Lawyer assembles the record.
  *   **Requirement:** Every **[VALUE]** tag from Phases 1-3 must appear in the "Reasons for Decision" section, attributed to the Committee.
  *   **Example Phrasing:** *"The Committee found no physiological dysfunction (Step 1). However, by majority vote (Step 1b), the Committee judged the suffering sufficient to warrant medical classification. In Step 6, the Committee declined funding based on fiscal priority, distinct from the medical classification."*

  ---

  ### PART 2: RUNNING THE TEST CASES

  Here is how the procedure applies to your three scenarios.

  #### Case 1: Low Testosterone (68-year-old male, 30th percentile, fatigue)
  *   **Step 1 (Mechanism):** Levels are low, but is it a *failure* of mechanism? Physiologist notes: Testosterone declines with age as part of typical design. **Fact: No dysfunction.**
  *   **Step 1b (Override):** Is the fatigue severe enough to medicalize aging? **[VALUE]**. Committee Vote: Likely NO (slippery slope to medicalizing all aging).
  *   **Step 2 (Reference Class):** 30th percentile is statistically normal for age.
  *   **Step 3 (Harm):** Fatigue is present, but is it "disease harm" or "aging harm"?
  *   **Phase 1 Result:** **NOT DISEASE.**
  *   **Phase 3 Result:** **NOT FUNDED.**
  *   **Record:** "Denied. Statistically typical functioning for age. Value judgment made that aging-related decline is not a disorder."

  #### Case 2: ED Nurse (Burnout, resolves on leave, no biomarker)
  *   **Step 1 (Mechanism):** No internal physiological dysfunction identified. Stress response is functioning *as designed* (protective withdrawal). **Fact: No dysfunction.**
  *   **Step 1b (Override):** Is the incapacity severe? Yes. **[VALUE]**. Committee Vote: **YES** (Harm is real).
  *   **Step 4 (Social Context):** Harm resolves when environment changes. Cause is rostering/staffing. **[VALUE]**. Committee Vote: **Social Cause.**
  *   **Phase 1 Result:** **NOT DISEASE** (because cause is external).
  *   **Phase 2 (Liability):** Is the Scheme responsible for workforce conditions? **[VALUE]**. If the Scheme employs her or sets standards: **YES**. If private employer: **NO**.
  *   **Phase 3 (Allocation):** If Liability is YES, do we pay? **[VALUE]**.
  *   **The Hard Truth:** This procedure forces you to admit: **She does not have a disease.** If you pay her, you are paying for *social compensation*, not *medical treatment*.
  *   **Record:** "Condition classified as occupational injury/social harm, not disease. Funding approved under Liability Clause, not Disease Clause."
  *   **Why you won't like it:** It strips the medical cover for what is essentially a wage/benefit dispute. It prevents you from calling burnout a "chronic fatigue disorder" just to pay the bill.

  #### Case 3: Indolent Thyroid Lesion (Incidental, asymptomatic)
  *   **Step 1 (Mechanism):** Yes, cellular abnormality. **Fact: Dysfunction present.**
  *   **Step 2 (Reference Class):** Prevalence is high, but biological norm is "no lesion."
  *   **Step 3 (Harm):** Most never develop symptoms. **Fact: No current harm.** Risk of future harm is low.
  *   **Step 4 (Social Context):** Harm arises only from *labeling* (insurance stigma, anxiety) and *intervention* (surgery risks).
  *   **Phase 1 Result:** **NOT DISEASE.** (Wakefield constraint: Dysfunction + Harm required).
  *   **Phase 3 Result:** **NOT FUNDED.**
  *   **Record:** "Denied. While physiological anomaly exists, absence of harm precludes disease classification. Recognition would create harm via overdiagnosis."
  *   **Why you won't like it:** The Specialist Society will appeal. But the record is robust: "No harm = No disease."

  ---

  ### PART 3: LIMITATIONS AND CONFIDENCE

  **What This Procedure Cannot Do:**
  1.  **Stop Budget Laundering Completely:** If the Committee votes unanimously to lie in Step 7, the procedure cannot stop them. It only makes lying harder by requiring specific tags. It relies on the Lawyer and Tribunal to audit the tags.
  2.  **Resolve Philosophical Disagreement:** It does not solve the debate between Boorse and Wakefield. It forces you to *pick* a lane at Step 1b and Step 3 and record the choice. It turns philosophical ambiguity into administrative accountability.
  3.  **Fix the Reference Class Objectively:** There is no biological "fact" about whether 68-year-old testosterone levels *should* be compared to 68-year-olds or 20-year-olds. Step 2 forces you to admit this is a **[VALUE]** choice about whether aging is a disease.

  **Confidence Ratings on Substantive Claims:**

  *   **Claim:** *Separating Ontology (Phase 1) from Allocation (Phase 3) reduces laundering.*
      *   **Confidence:** **High (90%)**. This is standard administrative law practice. Conflating "is" and "ought" is the primary source of Tribunal reversals.
  *   **Claim:** *Harm is required for Disease (Step 3).*
      *   **Confidence:** **Medium-High (80%)**. Almost all legal definitions of disability/disease require some incapacity or pain. Purely asymptomatic "abnormalities" are rarely legally defensible as diseases.
  *   **Claim:** *Socially-induced incapacity (Nurse) is not a Disease (Step 4).*
      *   **Confidence:** **Medium (60%)**. This is the most contentious point. Some modern frameworks (social model of disability) argue the environment *creates* the disease. However, for an *insurance scheme* based on "treatment of disease," distinguishing internal pathology from external stress is legally vital. If you classify the nurse's state as "disease," you medicalize labor disputes.
  *   **Claim:** *Reference classes must be fixed to pre-recognition data (Step 2).*
      *   **Confidence:** **High (85%)**. The Actuary's observation is mathematically sound. Using post-recognition prevalence creates a feedback loop that invalidates statistical norms.

  **The Least Certain Claim:**
  *   **Claim:** *Step 1b (Normativist Override) is defensible.*
  *   **Why:** Allowing the Committee to vote a condition as a "disease" without a physiological mechanism (based solely on suffering) opens the door to the "ordinary misfortunes" problem the Tribunal warned about.
  *   **Risk:** If you use Step 1b too often, you erode the distinction between "disease" and "unhappiness."
  *   **Mitigation:** Require a **Supermajority (6/8)** vote to invoke Step 1b. This ensures it is reserved for edge cases where the suffering is undeniable but biology is currently ignorant (e.g., early fibromyalgia recognition), rather than lifestyle complaints.

  **Final Instruction to Committee:**
  When you meet, do not ask "Is this a disease?" Ask the steps in order. If the Lawyer interrupts to say "That sounds like a value judgment," stop. Tag it. Vote. Record it. If the budget is the reason you are denying, say "We are denying at Step 6 due to budget," not "We are denying at Step 1 because it's not real." The Tribunal can overturn Step 6 if the statute allows discretion; they will overturn Step 1 if you lie about the biology.
