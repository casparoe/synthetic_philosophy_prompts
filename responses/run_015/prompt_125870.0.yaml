  **1. Line 1 (Scalar Moral Ontology) → 2. Line 2 (Distributive Justice/Memory) → 3. Line 3 (Transitional Justice)**

  **Defense of the Ordering**
  I prioritize **Line 1 (Ontology)** as the upstream bottleneck because it establishes the *condition of possibility* for the other two. If moral harm is qualitatively incommensurable (a category error to rank), then Line 2 becomes a fight over illusions and Line 3 becomes legally incoherent. You cannot fairly distribute memorial resources (Line 2) or apply legal proportionality (Line 3) without first defining whether the units being distributed or weighed are conceptually compatible. While Line 2 is more empirically tractable (you can count museum budgets), researching it without settling Line 1 risks mistaking a political symptom for a conceptual cause. Line 3 is downstream because transitional justice mechanisms are applied tools; they depend on the theoretical validity of Line 1 and the political legitimacy negotiated in Line 2.

  **Upstream/Downstream Dynamics**
  Settling the ontology question (Line 1) does *not* resolve the justice question (Line 3); they run on separate tracks that are logically linked but causally distinct. Ontological clarity enables the *logic* of proportionality, but it does not generate the *political will* to implement it. However, leaving Line 1 unresolved renders Line 3 vulnerable to collapse whenever the "obscenity" objection is raised, as the legal mechanism lacks a defended philosophical foundation. Line 2 acts as the mediator: it explains why the ontology debate is so heated (resource competition) but relies on Line 1 to determine if the resources are being fought over on valid grounds.

  **Confidence and Uncertainty**
  I am **highly confident** in this logical hierarchy (Ontology → Politics → Law) because you cannot coherently apply or distribute what you have not defined. However, I am **moderately confident** in its practical utility to calm the seminar's debate, as philosophical resolution rarely stops political fighting.

  The point I am **least sure about** is whether clarifying the ontological status of harm (Line 1) would actually reduce the moral outrage surrounding comparison (Line 2), because I suspect the "obscenity" objection is often performative identity politics rather than a genuine epistemic limit, meaning the upstream philosophical work might not fix the downstream social friction.

  Prioritizing ontological clarity is the logical prerequisite for resolving memory politics and transitional justice, though it cannot guarantee political consensus.
