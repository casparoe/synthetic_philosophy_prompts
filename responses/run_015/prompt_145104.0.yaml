  | **Rational Belief Update** | You cannot update on a conditional via standard Bayesian conditionalization (since there is no proposition to condition on). | **N/A**. The Ramsey Test is static; this concerns dynamics. However, it implies updating requires *imaging* or constraint satisfaction, not standard conditioning. | **Dynamic Semantics Required.** Standard Bayesianism is insufficient for reasoning with embedded conditionals. |
  | **Restricted Space Move** | Restricting the domain to belief-consistent worlds blocks the math by making the proposition expressed by $A \to B$ depend on $P$. | **Locally**. It saves the equation $P(A \to B) = P(B|A)$ within a specific context, but fails across different belief states. | **Shifts the Weirdness.** It blocks triviality but makes the *content* of the conditional unstable (it changes as your beliefs change). |

