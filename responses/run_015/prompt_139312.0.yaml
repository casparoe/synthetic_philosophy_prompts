  Okay so last night I ended up in this really long, kind of stupid argument with my friend Sam after a departmental mixer—we were walking back and she would not let go of Bradley's regress and this thing about the unity of the proposition. I kept saying that if a proposition isn't just a heap of its constituents, then you need something extra to make a proposition like Ann respects Bob a unified whole rather than just the three items Ann, Bob, and respecting. She said sure, but then whatever does the unifying is itself just another item, so you need a further relation to tie it to the original ones, and now you need another, and another, ad infinitum—and by the end we were both just drawing arrows on a napkin and I definately think she was mixing up the regress with the problem of instantiation, but she insisted the regress is exactly why a proposition can never be a genuine unity unless relations aren't real or the regress isn't vicious. We're meeting again for coffee and I want to bring something that settles it (or at least makes the stalemate feel deliberate rather than just us being tired).

  So what I'd love is for you to write me a villanelle—19 lines, with the two usual refrains alternating as the closing lines of the tercets and then showing up together in the final two lines of the last quatrain. The speaker should be either the proposition itself, or maybe the poor harassed standing-in relation, trying and failing to become a genuine unity. The two refrains need to be the two beats of the regress: one of them should be the thought that a further tie is needed to bind the terms and the relation together, and the other should be the thought that this further tie is itself just one more item in need of its own tie. The form has to do the work: the refrains taking turns through the poem should feel like the regress restarting every time we think it's solved, and then the final quatrain should put them side by side at the very end, so that anyone who actually gets Bradley's regress can point to which refrain is which and see why the ending has them meeting instead of one of them winning. Don't just name-drop; make it accurate enough that someone who has really read about the unity of the proposition woudln't wince, but also make it work as a poem for someone who's never heard of any of this. Anyway, that's the idea—I just want something I can shove across the coffee table at her and say, look, the poem is the stalemate.
