  2.  **Deconstruct the Core Problem:**

      *   The problem is the *normative force* of logic. Why *ought* I infer $Q$ from $P$ and $P \to Q$?
      *   It's not truth-preservation (granted).
      *   It's not instrumental rationality (granted).
      *   It's about *rational requirement*.
      *   Carroll's Tortoise shows that adding a normative premise ("If P and P->Q, then I ought to conclude Q") doesn't work because the Tortoise can accept that premise and still refuse to act. The normativity must be *operative*, not just *propositional*.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Anti-Regress Condition.* (From Carroll). The theory cannot treat the norm as a premise.
          *   Motivation: Carroll.
          *   Status: Non-negotiable.
      *   *Desideratum 2: The Generality Condition.* (From Tithonus). Must apply even to unique/rare forms.
          *   Motivation: Logic isn't empirical generalization.
          *   Status: Non-negotiable.
      *   *Desideratum 3: The Non-Bootstrapping Condition.* (From Bootstrapping). Can't generate warrant from nowhere.
          *   Motivation: Epistemic circularity/begging the question.
          *   Status: Non-negotiable (mostly).
      *   *Desideratum 4: The Pluralism/Neutrality Condition.* (From Deviant Logic). Shouldn't presuppose Classical logic if Constructive is viable.
          *   Motivation: Disagreement among experts.
          *   Status: Negotiable (some theories are partisan).
      *   *Desideratum 5: The Error Possibility Condition.* (From Error Case). Must allow for mistake without collapsing the concept of thought.
          *   Motivation: People make logical errors but still think.
          *   Status: Non-negotiable (if constitutivism makes error impossible, it fails).
      *   *Desideratum 6: The Psychological Reality Condition.* (From Learning/Stored-Rule). Must apply to thinkers who don't know the rules explicitly.
          *   Motivation: Children/Implicit reasoning.
          *   Status: Non-negotiable.
      *   *Desideratum 7: The Warrant/License Distinction.*
          *   Motivation: We use logic before justifying it.
          *   Status: Must respect.
      *   *Desideratum 8: (My Addition) The Action-Guiding Condition.* The norm must be capable of motivating or guiding the agent *as an agent*, not just describing them.
          *   Motivation: Normativity implies "ought implies can" and guidance.

  4.  **Refining the Desiderata & Classifying:**

      *   *Non-negotiable:* Anti-Regress, Error Possibility, Psychological Reality (Implicitness).
