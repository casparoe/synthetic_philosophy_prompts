answer: |-
  This is a sharp dissection of the literature. You are correct that the field often conflates the *legal mechanism*, the *expressive function*, and the *normative status* of the wrong. Below is a precise layout of how these distinctions map onto the standard defenses, followed by an analysis of your three wrinkles.

  ### 1. The Tripartite Distinction: What Amnesty Does

  Your suspicion is correct: **Standard defenses justify (1), while the rhetoric of reconciliation implicitly promises (2) and occasionally gestures at (3).**

  *   **(1) Waiver of Enforcement:** This is the legal reality of almost all transitional amnesties. The state retains the *right* to condemn but waives the *power* to punish. Defenses based on "peace," "stability," or "democratic consolidation" operate entirely at this level. They argue that the cost of enforcement (civil war, coup) outweighs the benefit of punishment.
  *   **(2) Waiver of Condemnation:** This is the expressive cost. Trials are not just punitive; they are declaratory. They establish an official record that "X happened and it was wrong." Amnesty often creates an expressive vacuum. Defenses here rely on the idea that *truth commissions* or *lustration* can substitute for the expressive function of a trial. This is empirically contested but conceptually possible.
  *   **(3) Waiver of Normative Standing:** This is the rhetorical overreach. This would mean the act is no longer a wrong *against the community*. In transitional justice, this is generally rejected by international law (e.g., *jus cogens* norms regarding torture cannot be extinguished). When politicians speak of "turning the page" or "starting anew," they rhetorically aim for (3), but legally they rarely achieve it.

  **The Slide:** The confusion arises because proponents argue for (1) using the language of (3). They say, "We must forgive to move on," implying the debt is erased (3), when the legal mechanism only stops collection (1). This creates resentment in victims who see the debt acknowledged but unpaid.

  **Confidence:** High. This distinction tracks with the gap between legal positivist accounts of amnesty and the moral psychology of victims.

  ---

  ### 2. Wrinkle (a): Borrowed Mercy and Public Wrongs

  You ask whose forgiveness this is and whether the "public wrong" argument legitimizes self-amnesty.

  **The "Public Wrong" Move:**
  For the state to forgive without the victim's consent, the wrong must be construed as a breach of the *political covenant*, not just a harm to an individual. In this view, torture is not just an assault on a body; it is an assault on the constitutional order that guarantees bodily integrity. Therefore, the *successor* state (representing the restored order) has standing to waive the claim *on behalf of the polity*, even if it cannot waive the victim's private moral claim.

  **Does it prove too much (Self-Amnesty)?**
  If any state can define a wrong as "public" and waive it, a dictator could amnesty their own death squads. The principled line is not in the *definition* of the wrong, but in the **legitimacy of the grantor**.

  *   **Transitional Amnesty:** Granted by a *new* political order (often post-democratic) regarding acts committed under an *illegitimate* prior order. The new state claims to represent the "real" public that was suppressed. It forgives the breach of *its* (the new) order.
  *   **Self-Amnesty:** Granted by the *same* order that committed the acts. Here, the state is effectively saying, "We breached the public trust, and we forgive ourselves." This lacks legitimacy because the grantor is the beneficiary.

  **Is the difference purely that one side won?**
  Not purely, but predominantly. It is a **political legitimacy** threshold, not a metaphysical one. If the transition is merely a reshuffling of elites (a "pacted transition" where the old guard retains veto power), the amnesty edges closer to self-amnesty and loses moral force. If the new regime has a distinct democratic mandate, the "public wrong" argument holds.

  **Confidence:** Moderate. The distinction relies on a normative theory of state continuity that is contested in international law (e.g., does the state persist identically despite regime change?).

  ---

  ### 3. Wrinkle (b): The Extortion Shape

  You ask if "amnesty or no transition" is structurally different from "pay or the hostage dies."

  **Structural Similarity:**
  Structurally, it is identical. It is a coercive bargain where the threatener (security forces) controls the bad outcome (violance/instability) and demands a concession (immunity) to stop it.

  **The Moral Difference:**
  The difference lies in the **counterfactual baseline**.
  *   In a kidnapping, the threatener *creates* the threat solely to extract payment. The baseline is safety.
  *   In a transition, the threat (civil war, coup) is often *pre-existing* due to the balance of power. The security forces are not necessarily *creating* a new threat so much as *refraining from exercising* an existing capacity for violence.

  **Does this sink the necessity defense?**
  It sinks the idea that the transition is a **moral achievement** in the retributive sense. It forces us into **non-ideal theory**.
  *   **Ideal Theory:** Justice requires punishment.
  *   **Non-Ideal Theory:** Justice requires the *possibility* of a functioning state.
  If the choice is truly between "Amnesty + Democracy" and "Trials + Dictatorship/War," the necessity defense holds, but it must be admitted as a **tragic compromise**, not a moral good. It is a "second-best" justice. Describing it as a "bargain" is more honest, but it doesn't necessarily invalidate the transition; it just reclassifies it from *Justice* to *Political Prudence*.

  **Confidence:** High. This aligns with standard "dirty hands" literature in political philosophy.

  ---

  ### 4. Wrinkle (c): Conditional Amnesty (The TRC Model)

  Does trading truth for amnesty dissolve the previous problems?

  **On Borrowed Mercy (a):**
  It mitigates but does not solve it. By requiring a public account, the state acknowledges the *fact* of the wrong, even if it waives the punishment. This restores some expressive condemnation (Function 2 above) without enforcement (Function 1). It gives victims a form of recognition, which partially addresses the "whose forgiveness" issue by centering the victim's right to know, even if it doesn't grant them veto power over the amnesty.

  **On Extortion (b):**
  It does **not** solve this. The threat remains the same. The conditionality just raises the price the perpetrators must pay (reputation vs. liberty).

  **The Artifact Problem:**
  You are right to be suspicious. Conditional amnesty creates **strategic truth**. Perpetrators have a strong incentive to frame acts as "political" (eligible) rather than "personal" (ineligible) and to minimize their own agency ("I was following orders").
  *   **Is the record still worth having?** Yes, but for a specific reason: **It breaks state denialism.**
      Even a distorted official record is superior to a void. In many transitions (e.g., Chile initially), the state position was "nothing happened." A TRC record, even if shaped by incentives, establishes an *official floor* of acknowledgment. It prevents future revisionism from claiming the violence never occurred. It transforms the history from "rumors of abuse" to "documented abuse with contested motives."

  **Confidence:** High on the incentive distortion; Moderate-High on the value of the "imperfect record."

  ---

  ### Confidence Flags & Least Certain Claim

  **Confidence Levels:**
  1.  **Tripartite Distinction (1 vs 2 vs 3):** **High Confidence.** This is a robust conceptual mapping of the legal vs. rhetorical functions.
  2.  **Extortion Analysis:** **High Confidence.** The structural similarity to coercion is clear; the moral defense rests firmly on non-ideal theory.
  3.  **Conditional Amnesty (Artifact Value):** **Moderate-High Confidence.** While the incentive to lie is obvious, the claim that "imperfect truth > silence" is generally accepted but depends on the specific historical context.
  4.  **Public Wrong / Self-Amnesty Distinction:** **Moderate Confidence.** This is the shakiest ground.

  **Specific Claim I Am Least Sure About:**
  I am least sure about the **principled line between transitional amnesty and self-amnesty based on "political legitimacy."**
  *   *Why:* In practice, "legitimacy" is often a euphemism for "the side that won has the power to write the law." If a transition is heavily pacted (e.g., the old regime retains control of the judiciary or military), the "new" state is not truly distinct from the "old" state. In these grey zones, the "public wrong" argument risks becoming a legal fiction that merely laundered self-amnesty through a new legislature. Distinguishing a "legitimate successor state" from a "rebranded incumbent regime" is often a political judgment, not a philosophical one.

  ### Summary
  Your intuition is correct: the field slides from **waiving punishment (1)** to **implying the debt is gone (3)**.
  *   **Borrowed Mercy** works only if the new state is legitimately distinct from the old one (the "public wrong" is against the *new* order).
  *   **Extortion** is real, but justified via non-ideal theory (peace is a precondition for justice).
  *   **Conditional Amnesty** creates strategic narratives but secures an official floor against denialism.

  The confusion you feel is the friction between the **legal pragmatism** required to end a conflict and the **moral metaphysics** required to satisfy the demand for justice.
