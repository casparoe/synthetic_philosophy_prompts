      *   **Rejecting Step (1):** I will recommend rejecting the *strong* version of (1). Alignment cannot require the *explicit* re-enactment of the reasoning trace at inference time without ruling out human expertise (as (5) notes).
      *   **Cost of Rejecting (1):** It shifts alignment from "provable safety per step" to "robust reliability." It opens the door to "deceptive alignment" worries (the model looks aligned but isn't). I need to address the "gaming evaluation" worry here.
