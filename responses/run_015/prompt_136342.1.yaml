          5.  This implies all expert intuition (compressed reasoning) is also unanchored imitation, which is absurd.
      *   **Constraints:** The user wants to keep (2) and (3) (descriptive claims). They are willing to sacrifice (1) or reinterpret (3)/(4).
      *   **Specific Questions to Answer:**
