prompt: |-
  I've been going down a rabbit hole on this "extended mind" thing for a few weeks now, mostly because I realized I basically can't remember half the stuff I think I know unless I look it up on my phone, and I started wondering if my phone is litterally part of my brain or just a really good external hard drive I happen to carry around. I've been reading about it on my own (no academic background, just curious) and I keep hitting this wall where one camp says the notebook or the phone counts as part of your actual cognition, and another camp says no, real cognition has to be inside the organism, and the notebook is just a causal resource that happens to help you, not a constitutive part of the belief itself. I think the second camp are called constitutive internalists or something, but I might have that wrong.

  I want you to act like a professional philosopher of mind who's actually been in this debate for a while, and I want you to draft the joint statement that a committed extended-minder and a committed constitutive internalist could both sign after a serious good-faith adversarial collaboration. I want the claims they'd both agree on — including about the famous notebook case and about what "cognition" even means in the first place — the precise statements of where they still disagree, each one phrased so that its own side would actually accept the wording, and the cruxes. I suspect two of the big cruxes are this "glue" problem (whatever actually binds the notebook to the mind, if anything) and whether the "parity principle" is a real methodological rule or just a slogan people repeat. And for each crux, give a concrete case or argument both sides would agree bears on it, with what each side predicts. Format it as a numbered agreed-claims section followed by a disagreements table.

  To keep it from being just a regurgitation of the standard textbook debate, I want you to also work in a specific case I came up with: a person who has a trusted external memory — say a cloud app — that is always available and basically always right, and they check it so often it's become totally automatic, like a reflex they don't even notice. Does that count as extended cognition or not, and what would each side say about it? I have a hunch this case is the one that actually seperates the two camps, so please think it through carefully and don't just give me the stock answer. Maybe start with a little brainstorming about what the real cruxes are before you write the actual statement, and be honest if you think part of the disagreement is just verbal.
