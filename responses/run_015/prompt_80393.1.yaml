answer: |-
  ### Preliminary Analysis: Where the Real Friction Lies

  Before we draft the statement, let's validate your intuition. You are right to suspect the "Cloud App Reflex" case is the pressure point. The classic "Otto's Notebook" case (from Clark & Chalmers, 1998) is actually a bit dated. Otto has to *walk* to the notebook. There is a temporal gap. Your Cloud App case removes the friction: it is always-on, instant, and the checking is pre-reflective (a reflex).

  This forces the debate away from "tools we use" to "systems we inhabit."

  Here is the breakdown of the actual cruxes we need to encode in the statement:

  1.  **The Coupling-Constitution Fallacy:** This is the Internalist's primary weapon. They argue that just because two things are tightly coupled (brain and app), it doesn't mean they constitute one single system (a digestive system is coupled to food, but food isn't part of the digestion *organ*). The Extended Minder must argue that in cognition, unlike digestion, the *process* is what matters, not the substrate.
  2.  **The Mark of the Cognitive:** Internalists demand a definition of cognition that is intrinsic (e.g., non-derived content). Extended Minders argue cognition is defined by its functional role (solving problems), regardless of where it happens.
  3.  **The Verbal Dispute Risk:** You suspected this might be just words. There is truth here. If "cognition" just means "stuff that helps me think," the Extended Minder wins. If "cognition" means "neural processing of intrinsic content," the Internalist wins. The joint statement must acknowledge that they are often optimizing for different theoretical goals (pragmatic utility vs. natural kind classification).

  ***

  ### JOINT STATEMENT ON THE BOUNDARIES OF COGNITION
  **Subject:** The Status of External Resources in Cognitive Systems (The "Extended Mind" Debate)
  **Signatories:** Proponent of Extended Cognition (EC) & Proponent of Constitutive Internalism (CI)
  **Date:** October 26, 2023

  #### I. POINTS OF CONSENSUS

  We, the undersigned, having engaged in adversarial collaboration regarding the hypothesis that cognitive processes can extend beyond the biological organism, agree upon the following claims as the common ground for future inquiry:

  1.  **The Centrality of External Resources:** We agree that human cognition is deeply dependent on external artifacts (notebooks, smartphones, cloud infrastructure). There is no meaningful psychological account of a modern human that ignores these resources.
  2.  **The Causal Role:** We agree that external resources play a *causal* role in cognitive outcomes. If the Cloud App is deleted, the agent's ability to retrieve information is degraded. The disagreement is not about *influence*, but about *constitution*.
  3.  **The Otto/Inga Intuition:** We agree that the thought experiment of "Otto" (who uses a notebook) and "Inga" (who uses biological memory) is the standard testing ground. We agree that functionally, Otto and Inga behave identically in the relevant scenarios.
  4.  **The "Cloud App Reflex" Case:** We agree that the case of the agent with the always-available, trusted, automatically-checked Cloud App represents the strongest possible case for Extended Cognition. If extension is true, it must be true here. If extension is false, this case explains why.
  5.  **Avoidance of "Neural Chauvinism":** The Internalist signatory agrees that location inside the skull is not *automatically* sufficient for cognitive status (e.g., a neuron firing randomly is not a belief), nor is location outside the skull *automatically* disqualifying. The debate rests on the nature of the process, not mere geography.
  6.  **Theoretical Goals:** We acknowledge that our disagreement is partly driven by differing theoretical aims. The EC signatory seeks to explain *behavioral success* and adaptive coupling. The CI signatory seeks to identify the *natural kind* mechanisms that generate intrinsic intentionality.

  #### II. CASE STUDY ANALYSIS: THE CLOUD APP REFLEX

  **Scenario:** An agent possesses a cloud-based memory app. It is always online (availability), has never failed them (trust), and they query it so frequently that the act of checking is pre-reflective/automatic (integration). When asked a question, they answer using the app without consciously recalling the act of looking it up.

  **Joint Analysis of the Disagreement:**

  | Feature | Extended Cognition (EC) Interpretation | Constitutive Internalism (CI) Interpretation |
  | :--- | :--- | :--- |
  | **The Loop** | The cognitive loop *includes* the transmission of data from the cloud to the retina. The system is "Brain + App." | The cognitive loop is *closed* within the brain. The app is an input source, like a sense organ, but not part of the processing mind. |
  | **Automaticity** | The fact that checking is a "reflex" proves the app has been incorporated into the body schema. It is functionally identical to a biological habit. | The reflex is a *neural* habit of reaching for a tool. The automaticity is inside the head; the tool remains external. |
  | **The Content** | The information in the app functions as a belief *while it is being accessed*, even if not currently held in working memory. | The information in the app is "derived content" (symbols created by humans). It only becomes a belief when the brain interprets it. |
  | **Verdict** | **Extended.** The app is a literal part of the vehicle of cognition. | **Coupled.** The app is a highly efficient causal resource, but not a constituent of the mind. |

  #### III. TABLE OF REMAINING DISAGREEMENTS (THE CRUXES)

  The following table outlines the precise metaphysical and methodological divergences that prevent full consensus. Each statement is phrased to be acceptable to the signatory holding that position.

  | Crux | Extended Cognition (EC) Position | Constitutive Internalism (CI) Position |
  | :--- | :--- | :--- |
  | **1. The Parity Principle** | **Methodological Necessity:** "If a process performed externally is functionally indistinguishable from one performed internally, we are guilty of prejudice to exclude it from cognition based solely on location." | **Category Error:** "Functional equivalence does not imply ontological identity. Digestion can be aided by enzymes outside the body, but that doesn't make the enzymes part of the digestive *organ*." |
  | **2. The "Glue" (Integration)** | **Trust & Availability:** "The binding factor is the reliability and accessibility of the resource. If the agent trusts it as much as their head, and it is always available, the 'glue' is sufficient for constitution." | **Causal Coupling Fallacy:** "Trust and availability describe a strong *causal coupling*, not constitution. A blind person's cane is trusted and available, but the cane does not *feel*; the hand feels the cane." |
  | **3. The Mark of the Cognitive** | **Functional Role:** "Cognition is defined by what it *does* (coordinating action, storing info). If the cloud app stores info to coordinate action, it is cognitive." | **Intrinsic Mechanism:** "Cognition is defined by *how* it is realized (neural mechanisms with non-derived content). External tools possess only derived content (symbols given meaning by users)." |
  | **4. Cognitive Bloat** | **Acceptable Risk:** "If calling the app 'part of the mind' helps us understand the agent's behavior, we should accept that minds are larger than skulls. 'Bloat' is a feature, not a bug." | **Reductio Ad Absurdum:** "If the app is part of the mind, then the server hosting the app is part of the mind, and eventually the whole internet is. This dilutes 'mind' until it explains nothing." |

  #### IV. CONCLUDING REMARKS ON THE VERBAL DISPUTE

  We acknowledge the possibility that a portion of this debate is verbal. If the EC signatory defines "cognition" as *the entire system required to produce intelligent behavior*, and the CI signatory defines "cognition" as *the internal processing mechanism that interprets inputs*, both descriptions may be accurate descriptions of different phenomena.

  However, we agree that the stakes are not merely semantic. The EC position urges us to design technology that integrates seamlessly with human biology (brain-computer interfaces). The CI position urges us to protect the integrity of human agency against outsourcing critical reasoning to algorithms. Both warnings are valuable.

  **Signed,**

  *Dr. A. Clark (Proxy for Extended Cognition)*
  *Dr. F. Adams (Proxy for Constitutive Internalism)*

  ***

  ### Philosopher's Commentary (Off the Record)

  You asked me to be honest about the "verbal dispute" aspect. Here is the candid take:

  The "Cloud App Reflex" case you invented is actually stronger than Otto's Notebook. Otto has to *decide* to look at his notebook. Your agent doesn't; it's a reflex. This attacks the Internalist's "intrinsic content" argument because the agent isn't even consciously interpreting the data; it's flowing directly into action.

  However, the Internalist will still dig in on **Derived vs. Non-Derived Content**. They will argue that the Cloud App contains 1s and 0s. Those 1s and 0s only mean "Grandma's Phone Number" because your brain gives them that meaning. Your brain, they argue, has "original" intentionality. The app has "borrowed" intentionality.

  The Extended Minder counters: "Who cares? If the system works, the metaphysics of 'meaning' is a distraction."

  That is the real wall you hit. One side cares about **how the sausage is made** (Internalism); the other cares about **how the sausage tastes** (Extended). Your Cloud App case makes the sausage taste identical, but the Internalist insists on analyzing the ingredients list.

  You are right to focus on the "Glue." That is where the next ten years of this debate will happen. Specifically: At what point does a Brain-Computer Interface (BCI) become "you"? If we chip a neural implant into your cortex that acts exactly like your Cloud App, the Internalist must concede it is part of your mind. The debate then becomes: Is the difference between a Bluetooth signal and a synaptic signal *metaphysically* relevant, or just engineering?

  Keep digging. You've found the nerve.
