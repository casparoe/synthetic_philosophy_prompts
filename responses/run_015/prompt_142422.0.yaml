prompt: |-
  I convene, as a non-voting chair, the Curriculum Priorities Committee at a small liberal-arts college: nine members, four from the sciences, four from the humanities, and a dean who votes only to break ties. We meet four times a year, and this year we have to pick one of six proposals for a new interdisciplinary concentration, by ranked ballot, then settle at the next two meetings two follow-on questions that are procedurally separate but substantively tied to the first: whether the concentration carries a required capstone, and which of three staffing models pays for it. Three of the six proposals are variations on one theme, any member may add a proposal to the shortlist up to forty-eight hours before the vote, and last year we adopted a proposal that had been added at that deadline, after which two members complained that the winner would have been different had a near-duplicate of it not also been on the list; I have never known whether that complaint was well-founded. Two constraints are fixed: the ballots are strictly ordinal, because the dean has ruled that any expression of how strongly someone prefers an option is improper in a matter with staffing consequences; and I have one spreadsheet, about forty minutes of meeting time, and an obligation to send the faculty senate a short paragraph justifying the outcome, which the senate can return to us if it judges the process arbitrary.

  I have read the rough statement of Arrow's impossibility theorem — that no rule for aggregating rankings over three or more alternatives satisfies unanimity, independence of irrelevant alternatives, and non-dictatorship simultaneously — and I do not need it explained to me. What I need is a procedure my committee could actually run. A political scientist colleague tells me that if every member's ranking is single-peaked along one shared ordering of the options, majority rule stops cycling and the median member's top choice wins; another colleague says that with three or more options any rule I might adopt can be manipulated by someone misrepresenting their ranking, so that fussing over rules is pointless; a third says that if we vote pairwise in sequence, whoever sets the order of the votes effectively decides the outcome. I don't know what to do with any of these claims, and I would rather the procedure not become a civics lecture. So give me the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops and says do not vote yet, discuss instead, and the points at which it hands the decision back to a person because the question is one of values rather than of aggregation. Assume I have to say all of this out loud to nine non-specialists in plain language, and tell me what to leave out at this level and why rather than trying to be complete.

  Then run the procedure on three cases. First: a committee whose rankings really do line up along one dimension, where I want to know how to check that and what I am entitled to conclude if it holds. Second: last year's situation, where removing or merging one weak proposal would apparently change the winner between two others — including how, in forty minutes and without asking anyone to restate intensity, I can test whether the complaint was sound, and what I should do if it was. Third: a committee that is not arguing about which option is best but about which dimension orders the options at all, since the scientists rank by research fit and the humanities members by teaching load, and no amount of voting seems to touch the disagreement. At least one of these should end somewhere the committee will not like — I would rather find that out from you than in the meeting — and I also want a short closing statement of what the procedure cannot do: which failures it cannot detect, which guarantees it cannot give, and where it is simply dressing up a judgment call as a rule.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Non-voting Chair of a Curriculum Priorities Committee (9 members: 4 Science, 4 Humanities, 1 Dean tie-breaker).
      *   **Task:** Select 1 of 6 proposals for a new concentration. Follow-up votes on capstone and staffing model happen later.
      *   **Constraints:**
          *   Strictly ordinal ballots (no cardinal utility/intensity).
          *   One spreadsheet, ~40 minutes of meeting time for the vote/process.
          *   Must justify outcome to Faculty Senate (can be returned if "arbitrary").
          *   Proposals can be added 48h prior (risk of "cloning"/spoilers, as happened last year).
          *   Audience: 9 non-specialists (faculty). No civics lectures. Plain language.
      *   **Knowledge Level:** User knows Arrow's Theorem roughly but doesn't want it explained. Wants actionable procedure.
      *   **Specific Requests:**
          1.  A step-by-step procedure (questions to ask, sufficient answers, stop points, hand-offs to values).
          2.  What to leave out and why.
          3.  Run the procedure on three specific cases (Single-peaked, Spoiler/Cloning, Dimensional Conflict).
          4.  At least one case must end unhappily (honesty about limitations).
          5.  A closing statement on limitations (undetectable failures, no guarantees, judgment calls).

  2.  **Deconstruct the Theoretical Constraints vs. Practical Reality:**
      *   *Arrow's Theorem:* Implies no perfect system. The user knows this. The goal isn't perfection; it's *defensibility* and *efficiency*.
      *   *Single-Peakedness:* If preferences align on one spectrum, Majority Rule works (Median Voter Theorem). This is the "happy path."
      *   *Manipulation/Strategy:* Gibbard-Satterthwaite says manipulation is possible. The user's colleague says "fussing is pointless." Counter: We need a process that makes manipulation *hard* or *transparent*, not impossible.
      *   *Agenda Setting:* The colleague is right; order matters. The Chair controls the agenda. This needs to be neutralized or acknowledged.
      *   *Time:* 40 minutes is very tight for 9 people + 6 options. Complex runoff systems (like Instant Runoff Voting) might be too slow to explain/count manually. Borda Count is easy to calculate but vulnerable to cloning (which happened last year). Condorcet is robust but can cycle.
      *   *Senate Justification:* Needs to sound reasoned, not random.

  3.  **Develop the Procedure (The "Script"):**
      *   *Goal:* Minimize "arbitrariness" while acknowledging human judgment.
      *   *Step 1: Dimension Check.* Before voting, ask if everyone sees the options the same way. (Addresses the "Dimensional Conflict" case).
      *   *Step 2: Cloning Check.* Address the "Spoiler" issue. (Addresses Last Year's case).
      *   *Step 3: The Vote.* Need a method. Given the "cloning" history, Borda is risky. Plurality is terrible with 6 options. Instant Runoff (IRV) is okay but can be non-monotonic. Condorcet (pairwise) is best for robustness but takes time. *Decision:* Use a simplified Condorcet/Pairwise approach focused on the top contenders, or a Two-Round system. Actually, given the 40-minute limit and spreadsheet, a **Two-Round System (Top-Two Runoff)** is easiest to explain and resists some cloning if the first round filters well. However, to address Arrow/Condorcet concerns without complexity, let's use a **Condorcet Check** on the top 3.
      *   *Refinement:* Let's keep it simpler.
          1.  Check for agreement on *what* we are deciding (Dimension).
          2.  Check for "Clones" (Similarity).
          3.  Vote: Use a method that identifies a "Beat Path" or simply Majority on top choices.
          4.  *Actually, the prompt asks for specific questions to ask.* Let's structure it as a flowchart of questions.
      *   *Stop Points:* If dimensions clash -> Discuss, don't vote. If clones exist -> Merge or remove.
      *   *Hand-offs:* If the choice is purely values (e.g., Science vs. Humanities priority), the Dean or Senate decides, not the algorithm.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Constraint:* 40 minutes.
      *   *Method:* I recommend a **Condorcet-consistent method** (like Minimax or Schulze) calculated on the spreadsheet, *but* explained simply as "Who beats whom?" However, explaining Schulze in 40 mins is hard.
      *   *Better Practical Approach:* **Approval Voting** is often best for committees, but the prompt says "strictly ordinal ballots." So we must use rankings.
      *   *Best Compromise:* **Instant Runoff Voting (IRV)** is common but flawed. **Borda** is easy but fails the "cloning" test (which is the user's specific trauma). **Pairwise Majority (Condorcet)** is the most robust against cycling if a winner exists.
      *   *Decision:* I will propose a **Pairwise Comparison of the Top Three**. Why? 6 options is too many for full pairwise in 40 mins.
      *   *Wait, the prompt asks for "Questions to ask in order."* I need to design a *process* that precedes the vote to ensure the vote counts.
      *   *Step 1:* Define the Spectrum.
      *   *Step 2:* Identify Clones.
      *   *Step 3:* The Vote (using a method that handles the remaining issues).
      *   *Let's select the Voting Method:* Since cloning is the specific fear, **Borda is out**. Since cycling is a fear, **Plurality is out**. **Condorcet** is the gold standard for "does a majority preference exist?" I will suggest a simplified Condorcet check.

  5.  **Addressing the Three Cases:**
      *   *Case 1 (Single-Peaked):* Show how to verify the spectrum. If verified, Median Voter rule applies. Easy win.
      *   *Case 2 (Cloning/Spoiler):* How to test last year's complaint. Use the spreadsheet to remove the "clone" and re-run. If winner changes, the complaint is valid. Remedy: Merge proposals before voting.
      *   *Case 3 (Dimensional Conflict):* Science vs. Humanities criteria. Voting won't fix this. This must end "unhappily" – i.e., the procedure declares "No Vote." This satisfies the requirement to find out bad news now.

  6.  **Refining the "What to Leave Out":**
      *   Don't mention Arrow by name.
      *   Don't mention Gibbard-Satterthwaite.
      *   Don't explain *why* Borda fails, just say it rewards similar options too much.
      *   Focus on *defensibility* to the Senate.

  7.  **Drafting the Content (Mental Outline):**
      *   **Introduction:** Acknowledge the constraints.
      *   **The Procedure (The Script):** 4 Questions.
      *   **What to Omit:** Theory names, edge cases.
      *   **Case 1 (Single-Peaked):** How to check (correlation of rankings). Result: Median wins.
      *   **Case 2 (Cloning):** How to test (remove & recalculate). Result: Valid complaint -> Merge proposals.
      *   **Case 3 (Dimensions):** The "Unhappy" ending. Result: Procedure halts. Needs negotiation, not voting.
      *   **Closing Statement:** Limitations (manipulation, hidden intensity, agenda power).

  8.  **Self-Correction/Review against Constraints:**
      *   *40 Minutes:* Is the procedure too long? I need to make sure the "Check" steps are fast.
      *   *Spreadsheet:* I need to specify what the spreadsheet does. (Calculate pairwise wins, check correlation).
      *   *Plain Language:* Avoid "Condorcet," "Single-Peaked," "Ordinal." Use "Head-to-Head," "Shared Scale," "Rankings."
      *   *Senate Justification:* The procedure must generate the text for the paragraph.
      *   *Unhappy Ending:* Case 3 must stop the vote.
      *   *Non-voting Chair:* I facilitate, I don't decide (except on agenda/procedure).

  9.  **Finalizing the Procedure Steps:**
      1.  *Agreement on Criteria:* Do we agree on what makes one better than another?
      2.  *Similarity Check:* Are any options effectively the same?
      3.  *The Vote:* Pairwise comparison of the top 3 (to save time) or full Condorcet if spreadsheet is ready. Let's go with **Full Pairwise** via spreadsheet (it's instant if pre-set) but discussed simply.
      4.  *The Senate Check:* Does the winner beat the runner-up head-to-head?

      *Wait, 40 minutes includes discussion.* I need to be very strict.
      *Revised Procedure:*
      1.  Check for "Same Thing" (Clones).
      2.  Check for "Same Scale" (Dimensions).
      3.  Vote (Rankings).
      4.  Verify Winner (Condorcet check).

      *Actually, let's look at the "Single-Peaked" hint.* If I can establish single-peakedness, I don't need complex voting. I just need the median. But testing single-peakedness is hard in 40 mins.
      *Better:* Stick to **Condorcet** as the primary engine because it handles the "Majority Rule" intuition best, but add the **Clone Check** as a prerequisite.

      *Let's refine the "Unhappy Case".* If dimensions clash, the vote is meaningless. The procedure must say "Stop."

      *Let's refine the "Cloning Test".* Run the vote. Then hide the clone. Run again. If winner changes, the clone mattered.

      *Let's refine the "What to leave out".* Don't explain *why* the clone matters (vote splitting), just that it distorts the result.

  10. **Writing the Response:** (Incorporating the voice of a pragmatic consultant/chair).
      *   Tone: Professional, direct, empathetic to the time crunch.
      *   Structure: Procedure, Omissions, Case Runs, Closing Limitations.

      *(Self-Correction during drafting)*: Make sure I explicitly answer "what counts as a sufficient answer" for each question in the procedure.
      *(Self-Correction on Case 3)*: Ensure this one clearly stops the process. The "unhappy" outcome is *no decision*.
      *(Self-Correction on Spreadsheet)*: Mention that the spreadsheet should be pre-loaded to save time.

      *Final check on Arrow:* User knows it. I won't lecture. I will focus on *defensibility*.
      *Final check on Dean:* Dean breaks ties. Keep that in the back pocket.

      *Let's finalize the Voting Method recommendation:* Given the "cloning" trauma, **Borda is dangerous**. **Plurality is dangerous**. **IRV is okay**. **Condorcet is best**. I will recommend a **Condorcet Method** (specifically Minimax or simple Pairwise Winner) because it satisfies the "Majority" intuition best for the Senate. I will simplify the explanation to "Head-to-Head."

      *Wait, one more thing:* The prompt asks for "questions to ask in order." I will structure the procedure as a script of 4 Questions.

      *Case 1:* Show how to check the dimension (correlation).
