answer: |-
  Here is a procedure designed for your constraints: nine people, forty minutes, one spreadsheet, and a need for Senate defensibility. It prioritizes *stability* over *perfection* and *transparency* over *complexity*.

  ### Part 1: The Procedure (Script for the Chair)

  Do not introduce this as "voting theory." Introduce it as "quality control." You have a spreadsheet pre-loaded with the six proposals (A–F). You will ask four questions. If the answer to any question is "No" or "Unclear," you stop the vote and move to discussion or deferral.

  **Question 1: The "Same Thing" Check (Cloning)**
  *   **Ask:** "Looking at the six proposals, are any two so similar that a rational person would never rank one without the other immediately above or below it?"
  *   **Sufficient Answer:** Unanimous agreement that no two proposals are duplicates. If two members identify a pair as "clones," you must merge them or remove one before voting.
  *   **Why:** This prevents the "spoiler" effect you saw last year. If similar options split the vote, the winner is accidental.
  *   **Stop Point:** If clones exist and cannot be merged, do not vote. Send back to subcommittee.

  **Question 2: The "Same Scale" Check (Dimensionality)**
  *   **Ask:** "If we had to arrange these six options on a single line from 'Most Conservative' to 'Most Radical' (or 'Least Costly' to 'Most Costly'), would we all agree on the order of the options on that line, even if we disagree on where to stop?"
  *   **Sufficient Answer:** At least 7 of 9 members can agree on the linear order of the options.
  *   **Why:** If we agree on the scale, the "middle" option usually beats the extremes. If we disagree on the scale (e.g., Science ranks by research, Humanities by teaching), voting is just a power struggle, not a choice.
  *   **Stop Point:** If the group splits on *how* to order the options (e.g., Sciences say A>B>C, Humanities say C>B>A), do not vote. This is a values conflict, not an aggregation problem.

  **Question 3: The Vote (Head-to-Head)**
  *   **Ask:** "Please submit your ranked ballots."
  *   **Procedure:** Enter rankings into the spreadsheet. The spreadsheet calculates **Pairwise Wins** (Condorcet Method). It asks: "Does Option A beat Option B in a head-to-head majority? Does A beat C? etc."
  *   **Sufficient Answer:** One option beats every other option head-to-head.
  *   **Why:** This is the strongest justification for the Senate. It means a majority prefers this winner over *any* specific alternative.
  *   **Stop Point:** If there is a "Cycle" (A beats B, B beats C, C beats A), the spreadsheet flags it. Do not accept the spreadsheet's tie-breaker yet.

  **Question 4: The Stability Check**
  *   **Ask:** "If we remove the lowest-ranked option and re-run the head-to-heads, does the winner change?"
  *   **Sufficient Answer:** The winner remains the same.
  *   **Why:** This tests if the result depends on "irrelevant" options (a nod to Arrow without naming him).
  *   **Hand-off:** If the winner changes, the decision is too fragile. Hand the decision to the Dean (as tie-breaker on process) or defer to the Senate with a note that the committee is fractured.

  ***

  ### Part 2: What to Leave Out (and Why)

  1.  **Do not mention Arrow's Theorem.**
      *   *Why:* It implies the process is mathematically doomed. You need confidence, not existential dread.
  2.  **Do not explain *why* cloning breaks Borda or Plurality.**
      *   *Why:* It sounds like you are accusing proposers of gaming the system. Just treat it as a "clarity" issue.
  3.  **Do not discuss "Intensity of Preference."**
      *   *Why:* The Dean has ruled it improper. Acknowledging it invites members to try to smuggle it in ("I feel *very* strongly").
  4.  **Do not explain the "Cycle" resolution method (e.g., Minimax).**
      *   *Why:* In 40 minutes, a cycle means "we disagree." Resolving it algorithmically looks like black-box magic to the Senate. A cycle justifies deferral.
  5.  **Do not mention Strategy/Manipulation.**
      *   *Why:* It invites members to try it. Assume good faith publicly; design the rules to make bad faith hard.

  ***

  ### Part 3: Running the Procedure on Three Cases

  Here is how the procedure behaves in the three scenarios you described.

  #### Case 1: The Single-Peaked Committee (The Happy Path)
  *   **Situation:** All 9 members agree the options line up on a spectrum of "Cost/Complexity." Sciences and Humanities differ on where they want to be on the line, but agree on the line itself.
  *   **Running the Check:**
      *   *Q1 (Clones):* Passed. No duplicates.
      *   *Q2 (Scale):* Passed. Everyone agrees Proposal A is simplest, F is complex.
      *   *Q3 (Vote):* The spreadsheet shows Proposal C beats A, B, D, E, and F in head-to-heads.
      *   *Q4 (Stability):* Removing F does not change C's win.
  *   **Conclusion:** You conclude that **Proposal C is the Median Choice.**
  *   **Senate Justification:** "The Committee identified a shared spectrum of implementation complexity. The selected proposal represents the median preference of the committee, commanding a majority preference over every other alternative in pairwise comparison."
  *   **Entitlement:** You are entitled to conclude the result is stable and not an artifact of the voting method.

  #### Case 2: The "Spoiler" Complaint (Last Year's Situation)
  *   **Situation:** Proposals E and F are variations on the same theme. E wins. Two members claim F "stole" votes from D, which would have beaten E.
  *   **Running the Check:**
      *   *Q1 (Clones):* **Failed.** Two members identify E and F as "variations on one theme."
      *   **The Test:** You do not vote yet. You open the spreadsheet. You hide Proposal F (treat ballots as if F never existed, moving F-ranked votes to the next preference). You re-run the Pairwise Wins.
      *   **Result:** Without F, Proposal D now beats E head-to-head.
      *   **Conclusion:** The complaint is **sound.** The presence of F altered the outcome between D and E.
  *   **Action:** You cannot vote. You must return E and F to the proposers with instructions to merge into a single option or select one to withdraw.
  *   **Senate Justification:** "The Committee identified redundant proposals that risked distorting the aggregate preference. Voting was deferred to consolidate options, ensuring the final choice reflects distinct curricular visions."
  *   **Why this matters:** This saves you from the Senate returning the decision as "arbitrary." You caught the distortion *before* the vote.

  #### Case 3: The Dimensional Conflict (The Unhappy Ending)
  *   **Situation:** Sciences rank by "Research Fit" (A > B > C). Humanities rank by "Teaching Load" (C > B > A). There is no shared spectrum.
  *   **Running the Check:**
      *   *Q1 (Clones):* Passed.
      *   *Q2 (Scale):* **Failed.** You ask them to order the options on a single line. Sciences put A at one end; Humanities put A at the other. You cannot get 7 of 9 to agree on the order.
      *   **Conclusion:** **Stop the Vote.**
  *   **Action:** You announce that the committee is not disagreeing on *which* option is best, but on *what counts* as best. A vote here would merely count heads, not resolve the curricular question.
  *   **Hand-off:** This is a values question, not an aggregation question. You refer the matter to the Dean (who represents the institutional budget/mission balance) or the Faculty Senate with a report stating: "The Committee is divided on the primary criterion for selection (Research vs. Teaching). No voting procedure can resolve this without privileging one department's values over the other."
  *   **Why this is unhappy:** You leave the meeting without a recommendation.
  *   **Why this is necessary:** If you vote anyway, the Senate will likely see the 4-4-1 split and return it. If you vote and Science wins, Humanities appeals (and vice versa). Stopping now is the only defensible move. It is better to be the Chair who delayed a vote than the Chair who presided over a divisive, overturned one.

  ***

  ### Part 4: Closing Statement on Limitations

  When you submit your paragraph to the Senate, or if members press you on why the process isn't "perfect," use this statement. It acknowledges the flaws without undermining the result.

  > "This procedure guarantees that the winner is preferred by a majority over any specific alternative, and that the result is not distorted by duplicate proposals. It **cannot** detect if members have misrepresented their rankings to game the outcome. It **cannot** measure how strongly members feel about the choice, only the order of their preference. Finally, it **cannot** resolve fundamental disagreements about what criteria matter; in those cases, the procedure correctly halts rather than produce a false consensus. We have chosen a process that identifies a stable majority preference where one exists, and admits uncertainty where it does not."

  **Summary of what this buys you:**
  1.  **Defensibility:** You checked for clones and cycles.
  2.  **Efficiency:** The spreadsheet does the heavy lifting; you just ask the four questions.
  3.  **Honesty:** Case 3 ensures you don't force a vote on a values conflict.
  4.  **Safety:** If the Senate asks, "Is this arbitrary?" you can show them the "Head-to-Head" math. It is not arbitrary; it is majoritarian.

  **One final instruction for your spreadsheet:**
  Pre-calculate the "Remove One" scenario (Question 4) for the lowest-ranked option. If the vote takes 10 minutes, you have 30 minutes to discuss the results. If the spreadsheet flags a Cycle or a Clone issue, you use the remaining time to discuss *merging* or *deferring*, not voting. That is the only way to stay within the 40-minute limit.
