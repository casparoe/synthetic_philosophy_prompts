answer: |-
  **The Tautology Trap: Why Satisficing Remains a Distinct Rival to Optimization**

  The long-standing peace treaty between Herbert Simon's behavioralism and neoclassical economics rests on a specific mathematical equivalence: a searcher who pays a cost to inspect options will stop when the expected marginal gain of another search equals the cost. This generates a reservation price. Simon's satisficer stops when an option exceeds an aspiration level. Since both agents stop at a threshold, the standard reconciliation concludes that satisficing is merely maximization under constraints—a difference in vocabulary, not ontology.

  Your friend proposes to shatter this equivalence by exploiting the *dynamics* of the threshold. She notes that a neoclassical reservation price is a function of the payoff distribution and search costs, both of which are held constant in her design. Simon's aspiration level, however, is a function of psychological adaptation, drifting with past success or failure. Her experiment manipulates payoff history while holding structural parameters fixed. If stopping behavior tracks the history, she claims satisficing wins.

  This proposal is sharp, but it invites two objections: a design confound regarding belief updating, and a deeper philosophical worry regarding the unfalsifiability of optimization. To render a verdict, we must address the confound quickly to clear the deck, then confront the deeper worry head-on. The conclusion is that your friend's test is decisive, but not for the reason she thinks. It does not prove that maximization is logically impossible; it proves that saving maximization requires sacrificing its status as a scientific explanation. Satisficing is a real rival, and it wins on the grounds of explanatory parsimony and computational realism.

  ### The Confound: Belief Updating

  The immediate objection to the experiment is that rational agents update beliefs. Even if the experimenter explicitly states that the payoff distribution is fixed (e.g., "draws from an urn with replacement"), a subject who observes a streak of high payoffs may rationally doubt the experimenter's honesty or the stability of the mechanism. If the subject infers that the distribution has shifted, a rational maximizer *should* raise their reservation threshold. In this case, history-dependent behavior would not vindicate Simon; it would vindicate a Bayesian maximizer with uncertain priors.

  Is this confound fatal? No. It is a nuisance of experimental design, not a philosophical barrier. It can be mitigated by making the generating process mechanically transparent (e.g., a visible bingo cage) and by incentivizing trust through reputation mechanisms or practice rounds where the distribution is verified. More importantly, one can measure the subjects' stated beliefs about the distribution post-streak. If behavior changes while stated beliefs about the distribution remain constant, the belief-updating defense collapses.

  While fixable, this confound points toward the deeper issue. The neoclassical defense against the experiment is essentially: "You haven't specified the utility function correctly." This leads us to the second, more dangerous objection.

  ### The Deep Worry: The Unfalsifiability of Optimization

  The deeper worry is that the maximization framework is a black box capable of absorbing any anomaly. If a subject lowers their threshold after a run of bad outcomes, a defender of optimization can simply posit that the agent's utility function is path-dependent. Perhaps the agent derives utility from "improvement" relative to a reference point, or suffers "disappointment costs" when current options fall short of recent peaks. By defining utility over the *sequence* of outcomes rather than the final state, the maximizer can redescribe the drifting aspiration level as the solution to a complex dynamic programming problem.

  If this move is permitted, your friend has proved too much. She has not shown that satisficing is true; she has shown that optimization is tautological. If any pattern of behavior can be rationalized by appending new variables to the utility function (history, regret, momentum), then optimization ceases to be an empirical theory and becomes a logical truth. A theory that predicts everything predicts nothing.

  However, this does not mean the debate is void. It means the criterion for victory must shift from *logical possibility* to *explanatory virtue*.

  ### The Verdict: Parsimony and Procedure

  Here is the decisive point: Simon's critique was never that optimization is logically impossible. It was that it is *procedurally* implausible. The "cost-constrained maximizer" redescription works only if we ignore the cost of the calculation itself.

  To maintain the maximization view in the face of your friend's experiment, we must assume the agent is solving a high-dimensional dynamic optimization problem. The agent must track the entire history of outcomes, calculate the marginal utility of "feeling good" versus "getting paid," and optimize the trajectory of their psychological state. This requires immense cognitive computational power.

  In contrast, Simon's satisficing rule is a heuristic: *Adjust the aspiration level up if search is easy/outcomes are good; adjust down if search is hard/outcomes are bad.* This is a simple feedback loop. It requires minimal memory and negligible computation.

  If we treat economics as a science of *choice*, both models fit the data (provided the maximizer is allowed enough parameters). But if we treat economics as a science of *human behavior*, the models diverge on plausibility. The maximization redescription saves the theory only by violating the very constraint that makes it interesting: rationality under scarcity. It posits an agent who is cost-conscious about search but cost-blind about computation.

  Therefore, your friend's test is decisive, provided we accept a constraint on theoretical parsimony. If a theory requires adding complex, unobserved path-dependencies to the utility function to match data that a simple heuristic predicts naturally, the heuristic is the superior explanation. The maximization model becomes a "just-so story" engine. It retains logical consistency but loses empirical content.

  ### Conclusion

  Is satisficing a real rival to cost-constrained maximizing? **Yes.**

  The rivalry is not about whether the behavior *can* be modeled as optimization (it always can, trivially). The rivalry is about whether the behavior *should* be modeled as optimization given the cognitive constraints of the agent.

  Your friend's experiment successfully isolates the dynamic signature of satisficing. If behavior tracks payoff streaks despite fixed structural parameters, the standard neoclassical model (fixed distribution + fixed cost) is falsified. The only way to save maximization is to expand the utility function to include history-dependent psychological states. But doing so admits that the agent is optimizing a *psychological process* rather than an *economic outcome*, which is precisely Simon's point: agents use procedural rules to manage their cognitive relationship with the environment.

  Consequently, the experiment vindicates satisficing as a distinct, empirically robust framework. It shows that human thresholds are adaptive tools, not static solutions to a global maximization problem. Maximization survives only as a normative benchmark or a tautology; satisficing survives as a description of how choice actually happens. In a seminar on the philosophy of economics, the verdict must favor the model that explains the data without assuming the agent is a hidden genius solving dynamic programming problems in their head. Satisficing is not maximization in disguise; it is the cognitive shortcut that makes rationality possible in a complex world.
