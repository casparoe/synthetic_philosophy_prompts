prompt: |-
  My friend Priya is an RL person (not a philosopher) and she's been going around giving verdicts on whether particular systems can suffer. I've been keeping a list and I can't work out what rule she's running:

  - a warehouse robot with hardwired obstacle avoidance, no learning, no model of itself: no
  - a model-free RL agent in a gridworld that gets shocked when it bumps into walls and learns to avoid them: yes, but barely
  - a language model during RLHF, at the moment the reward model scores a sample and the gradient lands: no
  - the same model after training, deployed with its weights frozen, where the user's thumbs-down just gets pasted into the prompt for the next turn and it visibly changes tack: she leans no
  - a simulated rodent-ish thing with nociceptors, a body schema, a value function it recomputes as it goes, memory across episodes, and that will take a shock to get food or work to avoid a future one: yes, fairly confident
  - the gridworld agent from the second case, but considered during an offline batch update where it's replaying old shocking episodes out of its buffer with no environment interaction: no

  Now the new one. Call it the Muted Wire agent. It's a model-based RL agent in a rich 3D environment, weights frozen, no learning happening at all. It has a body schema and episodic memory, and it recomputes a learned value function at every step; right now it's in a state its value function scores as really bad, and it has a language head that will type out that things are going badly. But the lab has surgically cut the connection from the value estimate to the planner: behaviour is now driven by a fixed offline plan, so its own assessment of how things are going makes no difference to what it does, and the only thing the value estimate still drives is that language head, whose output nothing and no one acts on. They've checked that in other copies of the same agent, with the wire intact, avoidance comes straight back, and they can reconnect it in this one whenever they like.

  What do you think Priya says about the Muted Wire agent?

  I'm much less interested in the answer than in the rule she seems to be running. As far as I can tell there are at least two rules that fit all six verdicts and then split here — something like "a reward-shaped signal only counts as valence if it's actually doing causal work in the loop that selects action", versus "it counts as long as the system represents its own current situation as going badly with the right training history behind that representation, whether or not it acts on it" — but I can't sharpen either one properly. Is that even the right split? What other rules fit her six verdicts just as well and what do they say about this case? Give me your best guess with the reasons for preferring it, and tell me what one further system you'd put to her to settle it, since I think I can get her to rule on one more.
