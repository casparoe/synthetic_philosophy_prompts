answer: |-
  1. The project asks whether the demandingness objection targets the magnitude of required sacrifice or the structural instability of the requirement. Standard debates assume these are equivalent measures of burden. I argue they are distinct variables. The determinate question is: Does reducing sacrifice magnitude while maintaining continuous recomputation resolve the objection, or does it persist until the requirement is structurally settled? Answering this determines whether mitigating sacrifice is sufficient for defensibility. It shifts focus from welfare loss to practical deliberation.

  2. Quantity measures expected lifetime cost in resources or welfare. Structure measures the revisability of commitments: whether plans can be settled or must remain open to override. I hypothesize the objection rests primarily on structure. A theory requiring high but fixed sacrifice allows life planning; a theory requiring low but continuously recomputed sacrifice disrupts agency similarly to high demands. Separating these reveals that standard replies reducing magnitude may fail if they leave structural openness intact. This suggests the real barrier to acceptance is not loss of welfare, but loss of normative closure.

  3. I will employ controlled conceptual comparison rather than surveying intuitions directly. Intuitions about demandingness are contaminated by magnitude. Instead, I will construct paired cases holding expected sacrifice constant while varying structural openness. This isolates the variable. Direct intuition surveys fail because subjects cannot easily disentangle cost from instability. This method forces a distinction between the burden of loss and the burden of uncertainty, providing a clearer map of the objection's logical geography.

  4. Possible conclusions: either structural openness is the core complaint, or it is merely another cost weighed by maximizing theories. If standard replies reduce magnitude but retain openness, they address only half the objection. However, if openness is itself a cost, consequentialism might absorb it. The deciding consideration is whether agents can rationally plan under open requirements. If planning requires closure, structural openness is a distinct agency cost, not merely a welfare loss.

  5. Scope is limited to analyzing the logical structure of the objection, not defending a specific consequentialist variant. The analysis applies to maximizing theories generally, not just act-consequentialism. The project fails if the distinction between quantity and structure collapses. Specifically, if expected sacrifice is mathematically or conceptually a function of revisability, then separating them is impossible. If openness inevitably increases expected cost, then the structural complaint reduces to the quantitative one. In that case, the proposed reframing offers no new diagnostic power, and the standard debate remains exhaustive.
