  1. Consider the 19th-century conviction that light required a luminiferous ether, sustained largely because no other mechanism for wave propagation was known at the time. Do you regard the absence of a viable alternative then as genuine evidence that the ether existed, or merely a temporary gap in imagination?
  Affirming it as evidence routes toward non-empirical confirmation; denying it suggests strict falsificationism or Bayesian skepticism, depending on whether one sees the absence as irrelevant or merely weak.

  2. Recall Pauli's postulate of the neutrino to preserve conservation laws decades before detection, when no alternative accounting for the missing energy was available. Does the absence of a competing explanation in that context constitute positive support for the theory?
  Answering yes aligns with non-empirical confirmation; answering no aligns with strict falsificationism; answering that it shifted credence without confirming aligns with Bayesian skepticism.

  3. Think of the pre-1956 assumption that parity must be conserved because the mathematical structure of weak interactions appeared symmetric under reflection. Should that internal coherence have been counted as evidence for the theory's truth?
  Treating coherence as evidence supports non-empirical confirmation; dismissing it supports strict falsificationism; treating it as a heuristic only supports pragmatism or Bayesian skepticism.

  4. Consider Weinberg's argument that the cosmological constant must be small enough to allow galaxy formation, which successfully bounded the value before measurement. Does reasoning from the necessity of our own existence count as ordinary scientific inference?
  Accepting it as ordinary science identifies the anthropic optimist; rejecting it as non-explanatory identifies the strict falsificationist or Bayesian skeptic.

  5. Recall our early lattice calculations where we trusted the framework to yield hadron masses long before computers were powerful enough to verify them precisely. Was that confidence a bet on the program's fruitfulness, or a genuine belief in the theory's truth based on its structure?
  Calling it a bet on fruitfulness marks the pragmatist; calling it belief in truth marks the non-empirical confirmer or Bayesian. Note that this branch may not cleanly separate the pragmatist from the Bayesian skeptic, as both may endorse the work while disagreeing on whether it constitutes knowledge.
