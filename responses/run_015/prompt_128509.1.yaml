answer: |-
  Based on the four verdicts you provided, your friend is operating with a consistent and technically sophisticated framework. She is distinguishing between **ontological indeterminism** (Case 2), **epistemic limitations** (Case 3), and **dynamical instability** (Cases 1 and 4).

  Here is the analysis of her implicit rule, the prediction for your fifth case, and the optimal test to distinguish her underlying philosophy.

  ### 1. The Implicit Rule: Dynamical Stability, Not Computational Complexity

  The rule your friend is tracking is **Exponential Trajectory Divergence (Sensitive Dependence on Initial Conditions)** combined with a **Physicalist constraint on measurement**. She is *not* tracking Computational Irreducibility.

  Here is the evidence from her first four verdicts:

  *   **The Smoking Gun (Case 3):** In the PRNG case, she explicitly states that prediction is "trivial" if you have the seed. A cryptographically secure PRNG is computationally irreducible; even with the algorithm, deriving the $N$-th state from the seed without iteration can be computationally infeasible. By dismissing this as "trivial," she signals that **computational cost does not count as structural unpredictability** to her. She cares about whether the future is *determined by the state*, not how hard it is to calculate.
  *   **The Confirmation (Case 4):** In the turbulent flow case, she explicitly links "dynamical unpredictability" to the "exponential amplification" of gaps. Crucially, she claims that "even perfect measurement in principle would not buy long-term predictability." In pure mathematics, a classical deterministic system with *mathematically* exact real numbers is predictable forever, even if chaotic. Her claim implies she treats "in principle" as "physically possible." She believes that because physical measurement has a finite precision limit (due to quantum bounds or information density), exponential divergence inevitably destroys predictability.
  *   **The Contrast (Case 1 vs. Case 3):** She treats the double pendulum (chaotic, divergent) as structurally unpredictable, but the PRNG (non-divergent, discrete) as epistemically unpredictable. The differentiating factor is not the lack of a formula (both have algorithms), but the **stability of the trajectory**.

  **Conclusion:** Her rule is: *Unpredictability is "structural/dynamical" if and only if the system exhibits exponential divergence of nearby trajectories within a physically realizable precision limit.*

  ### 2. Verdict on the Fifth Case

  **The System:** Discrete-time, linear, non-expansive, infinite-dimensional lattice. No closed-form solution. Computationally irreducible (must simulate step-by-step).

  **Her Predicted Verdict:**
  She will classify this system as **Deterministic and Predictable in Principle**, with unpredictability being merely **Epistemic/Practical**.

  **Reasoning:**
  Because the system is **non-expansive**, nearby initial conditions stay nearby. There is no exponential amplification of error. Therefore, the "Physicalist/Chaos" barrier she identified in Case 4 does not exist. Even if measurement has finite precision, that error will not grow; it will stay bounded or shrink.
  Although the system is computationally irreducible (no shortcut to step $N$), her verdict on Case 3 (the PRNG) established that she does not view computational cost as a form of structural unpredictability. She will likely argue that while it may take a long time to compute, the state at step $N$ is fully contained in the initial state without distortion. Unlike the double pendulum, a small error in the initial state does not render the prediction of step $N$ meaningless.

  **Summary:** She will treat Case 5 like a harder version of Case 3 (PRNG), not like Case 1 (Pendulum).

  ### 3. The Distinguishing Test Case

  You asked which of the two proposed cases would best distinguish between the **Divergence Rule** (her likely rule) and the **Computational Irreducibility Rule** (the alternative).

  **The Winner:** **A system with exponentially diverging trajectories but a discovered closed-form solution.**

  *   **Example:** The map $x_{n+1} = 2x_n \mod 1$ (the Bernoulli Shift) treated as a physical measurement, or simply $x(t) = x_0 e^{\lambda t}$ where $\lambda > 0$.
  *   **Why this distinguishes them:**
      *   **Under the Divergence Rule (Her View):** The system is **Structurally Unpredictable**. Even with a closed-form solution, any physical uncertainty in $x_0$ is exponentially amplified. The formula doesn't help if you cannot measure $x_0$ with infinite physical precision. (Matches her Case 4).
      *   **Under the Computational Irreducibility Rule:** The system is **Predictable**. A closed-form solution is the ultimate "shortcut." It eliminates the need for step-by-step simulation. If unpredictability is defined by the lack of an algorithmic shortcut, this system is predictable.

  **The Loser:** **A system with decaying perturbations but a subsequently discovered compressed algorithm.**

  *   **Why this fails:** Both rules would classify this as **Predictable**.
      *   **Divergence Rule:** Perturbations decay, so measurement error shrinks. Predictable.
      *   **Irreducibility Rule:** A compressed algorithm exists. Predictable.
      *   Since both rules yield the same verdict, this case cannot help you identify which rule she is using.

  ### 4. Strategic Recommendation

  When you present the **Fifth Case** to her, listen closely to whether she focuses on the **cost of computation** or the **stability of the error**.

  *   If she says, "It's unpredictable because you can't skip steps," she has shifted to a Computational Irreducibility view (contradicting her PRNG verdict).
  *   If she says, "It's predictable in principle because errors don't grow, even if it takes forever to calculate," she is consistent with her **Dynamical Stability** rule.

  To truly probe the boundary of her philosophy, present the **Distinguishing Test (Diverging + Closed Form)**. Ask her: *"If I have a chaotic system where the future state is given by a simple formula $f(t)$, but my measurement of the start is physically limited, is the future predictable in principle?"*

  *   If she says **No**, she is a **Physical Chaos Theorist** (Predictability is bounded by physics/precision).
  *   If she says **Yes**, she is a **Mathematical Determinist** (Predictability is bounded only by logic/math, ignoring physical measurement limits).

  Given her comment on Case 4 ("perfect measurement in principle would not buy long-term predictability"), she is almost certainly a **Physical Chaos Theorist**. She believes that "in principle" includes the laws of physics that forbid infinite precision, making exponential divergence an ontological barrier to prediction, not just a practical one.
