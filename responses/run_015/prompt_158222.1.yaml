          *   *Analysis:* This is the classic "realism vs. instrumentalism" fight.
          *   *Verdict:* If "truth" means "mechanism," A wins. If "truth" means "output," B wins. The procedure must force them to specify the *Aspect*. If they say "closer to truth" without specifying "mechanistic structure," the procedure stops them.
          *   *Decision:* This highlights the "Aspect" anchor. If they don't specify *which* truth (causal vs. phenomenological), the claim is blocked.

      *   **Case 3: Cloud Scheme (2-param vs. 30-param ML).**
          *   *Scenario:* User wants the old 2-param to win on "truth."
