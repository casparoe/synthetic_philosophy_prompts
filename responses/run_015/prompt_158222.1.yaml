          *   *Constraint:* The user asked me to "tell me straight" if it will pass. I must not pander. If the metric is just "we say so," it fails. If the metric is "parameters map to conserved quantities," it passes.

  6.  **Refining the "Misfire" Section:**
      *   Where does this break?
