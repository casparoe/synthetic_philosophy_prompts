      *   **User Persona:** Retired atmospheric physicist, now a handling editor for a journal (likely philosophy of science or interdisciplinary science/philosophy). Latecomer to philosophy, familiar with the basics of verisimilitude (Popper, 1974 Tichý/Miller objections).
      *   **Problem:** Authors/referees casually claim models are "closer to the truth" (verisimilitude), but the philosophical grounding is shaky (Popper's definition failed, successors disagree). The Editor-in-Chief demands defensibility. Referees are unpaid, non-philosophers, time-poor (15 mins).
      *   **Goal:** A practical, procedural checklist (a "four-anchor test" inspired by the user's idea) to evaluate verisimilitude claims in abstracts. Needs to be actionable, fit on a form, and survive scrutiny by a managing editor.
      *   **Specific Tasks:**
          1.  Define the questions/order.
          2.  Define pass/fail criteria for each.
