          *   *Correction:* The procedure should distinguish between *predictive accuracy* and *structural truth*. If the authors claim "closer to truth" based solely on fit, the procedure should flag it. *Self-Correction:* The user wants a procedure that *works*. If the metric is just RMSE, that's not truth. I need to make sure Anchor 3 requires a metric that implies structural fidelity, not just output matching. Or, acknowledge that in practice, "closer to truth" is often used as a proxy for "better predictive performance." Let's stick to the strict philosophical defense the EIC wants. If it's just fit, it's not truth.
          *   *Decision:* The procedure should likely *downgrade* this to "empirical adequacy" unless they claim the *parameters* correspond to reality.

      *   **Case 2: Pharmacology (Mechanism vs. Fit).**
