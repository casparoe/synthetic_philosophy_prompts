answer: |-
  Here is the breakdown of the distinct claims hiding behind the slogan "Maximize Geometric Growth / Just Bet Kelly." They are ordered from standard financial theory to radical decision-theory revisions.

  ### 1. The "Log-Utility" Claim (Standard Risk Aversion)
  *   **(a) Precise Claim:** The agent's utility function over terminal wealth $W$ is $U(W) = \ln(W)$. Therefore, for any decision (one-shot or repeated), the rational choice is the one that maximizes $E[\ln(W_{final})]$.
  *   **(b) Verdict:** **Defensible but Contentious.** It is not a law of physics; it is a preference specification. It implies decreasing marginal utility of money. It is standard in economics but not universally "true."
  *   **(c) Relevance:**
      *   *Friend's One-Off:* **Does the work.** If your friend actually has log utility over that $10k envelope, $1k is the correct bet. However, if he has outside wealth or linear utility for this stake, the claim fails.
      *   *Geometric vs. Arithmetic:* **Does the work.** It explains why one might prefer geometric mean (which maps to expected log) over arithmetic mean of wealth.

  ### 2. The "Asymptotic Dominance" Claim (Infinite Horizon)
  *   **(a) Precise Claim:** In a sequence of $N \to \infty$ independent, identical bets where winnings are fully reinvested into the total bankroll, a Kelly bettor's wealth will exceed the wealth of any essentially different strategy with probability approaching 1.
  *   **(b) Verdict:** **True (Mathematically).** This is the Breiman/Algoet-Cover theorem. However, it requires $N$ to be very large and full reinvestment.
  *   **(c) Relevance:**
      *   *Friend's One-Off:* **Irrelevant.** $N=1$ is not $\infty$. The "probability approaching 1" guarantee does not apply to a single coin flip.
      *   *Geometric vs. Arithmetic:* **Partial work.** It justifies geometric maximization *only* if the "repeated betting" premise is accepted. It does not justify using geometric logic for one-off events.

  ### 3. The "Median/Typicality" Claim (Finite Horizon)
  *   **(a) Precise Claim:** For a large finite sequence of bets $N$, the distribution of terminal wealth becomes log-normal. The Kelly fraction maximizes the *median* terminal wealth (the "typical" outcome), whereas maximizing arithmetic expectation chases vanishingly rare "lucky" paths that skew the mean.
  *   **(b) Verdict:** **True for large $N$, False for $N=1$.** For a single bet ($N=1$) with $p > 0.5$, the median outcome is simply "Win." To maximize median wealth in a one-shot, you should bet 100% (maximize the win amount), not Kelly.
  *   **(c) Relevance:**
      *   *Friend's One-Off:* **Misleading.** Using this claim to argue against a $4k bet in a one-off scenario is mathematically incorrect. The "median outcome" argument requires repetition to kick in.
      *   *Geometric vs. Arithmetic:* **Does the work.** This is usually the intended argument when people say "Arithmetic mean is misleading." It is valid for portfolios, not single propositions.

  ### 4. The "Ergodicity" Claim (Physics/Time-Averages)
  *   **(a) Precise Claim:** Expected Value (ensemble average) is physically meaningless for non-ergodic processes (where time average $\neq$ ensemble average). Rationality requires maximizing the time-average growth rate, which coincides with geometric growth. This is an objective feature of the dynamics, not a subjective utility preference.
  *   **(b) Verdict:** **Contentious/Philosophical.** Popularized by Ole Peters. Economists generally reject this, arguing that risk preferences (utility) handle non-ergodicity, not a change in the expectation operator.
  *   **(c) Relevance:**
      *   *Friend's One-Off:* **Irrelevant.** Ergodicity breaks are about trajectories over *time*. A single decision has no time trajectory to average over.
      *   *Geometric vs. Arithmetic:* **Does the work.** This is the "fancier hat" used to claim geometric maximization is *objectively* rational rather than just a risk preference. It attempts to override EV maximization on principle.

  ### 5. The "Nash Bargaining / Cross-Worlds" Claim (Rationalist Axioms)
  *   **(a) Precise Claim:** Maximizing the geometric mean of utility across possible worlds is equivalent to the Nash Bargaining Solution where each "possible world" is a player negotiating over the decision. This makes geometric rationality a requirement of coherence/fairness across counterfactual selves, independent of repetition.
  *   **(b) Verdict:** **Radical/Speculative.** This is niche decision theory (found in some rationalist blogs). It is not standard mathematics or economics. It attempts to derive log-utility from axioms of bargaining rather than preferences.
  *   **(c) Relevance:**
      *   *Friend's One-Off:* **Attempts to do the work.** This is the only claim that tries to justify Kelly for a *one-shot* without appealing to "risk aversion." It argues that overbetting "exploits" the losing worlds too harshly.
      *   *Geometric vs. Arithmetic:* **Does the work.** It provides a non-repetition-based justification for why "Geometric > Arithmetic."

  ---

  ### What Your Chat Actually Means
  When the poker guys and rationalists type "Just bet Kelly," they are usually conflating **Claim 2 (Asymptotic Dominance)** with **Claim 1 (Log-Utility)**.

  They believe Claim 2 proves Claim 1. Their mental model is: *"Kelly is objectively optimal in the long run (Claim 2), therefore it is the rational standard for all betting (Claim 1), therefore anyone deviating is making a mistake."*

  The "ergodicity" and "Nash bargaining" talk (Claims 4 & 5) is rhetorical armor added by the rationalist-blog reader to defend Claim 1 when the "long run" objection is raised. They are trying to decouple Kelly from repetition so they can apply it to your friend's one-off bet.

  ### Does This Invalidate Your Friend's Bet?
  **No.** Even if we grant their strongest arguments, the slogan is being misapplied here.

  1.  **The Repetition Mismatch:** Claims 2, 3, and 4 strictly require repeated reinvestment to hold. In a one-shot ($N=1$), the "long-run ruin" argument is incoherent. You cannot go bust in the long run if there is no long run.
  2.  **The Utility Mismatch:** Claim 1 (Log-Utility) is the only one that applies to one-shots. But utility is subjective. If your friend's utility is closer to linear over this specific $10k (e.g., he views it as "entertainment budget" or has significant outside wealth), then maximizing $E[\text{Wealth}]$ (arithmetic) is actually the rational move for *him*.
  3.  **The Stake Size:** At $N=1$, the difference in expected utility between betting $1k (Kelly) and $4k (4x Kelly) under log-utility is small, but the difference in *arithmetic* expected profit is massive ($4k bet has 4x the EV of $1k bet). Unless your friend is truly risk-averse over that specific $10k envelope, the "Geometric" crowd is imposing an external constraint (their risk tolerance) on his decision.

  **Bottom Line:** The chat is using a long-run portfolio theorem to police a single proposition bet. Unless they can prove your friend's utility function is logarithmic *and* that he faces a lifetime of identical reinvestable opportunities, their objection is category error, not math.
