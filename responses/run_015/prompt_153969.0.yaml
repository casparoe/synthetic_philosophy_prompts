  Your hypothesis is astute: this is a semantic and structural disagreement, not a factual dispute. The consistency camp presupposes moral logic must adhere to "ought implies can," treating obligations as consistent axioms. Conversely, the conflict camp prioritizes phenomenology, arguing tragic loss indicates binding norms exceeding human capacity. You are debating normativity's architecture: is morality a consistent codebase or a complex system with unavoidable runtime errors? This reflects a clash between deontic logic and moral experience.

  To move forward, distinguish between *pro tanto* duties (binding reasons) and *all-things-considered* obligations (final requirements). This allows both sides to agree: conflicting *pro tanto* duties exist (validating conflict), but only one *all-things-considered* obligation obtains (satisfying consistency). Empirical studies on regret won't resolve this, as the dispute concerns whether guilt is *justified*, not merely felt. Optimization theory offers an analogy but risks reducing normative force to utility calculation, missing the deontic weight both sides seek. Deontic logic explicitly blocks contradictions, forcing the consistency view unless the logic is modified.

  Ultimately, the question requires terminological precision. If "obligation" means what one must finally do, dilemmas are impossible. If it means any binding moral claim, dilemmas are real. The impasse stalls because each side defends a different definition under the same label. Agreeing to separate conflicting reasons from contradictory final commands would dissolve the deadlock. This acknowledges that while action must be singular, moral reasons can remain irreducibly plural, validating the "remainder" without violating logic. Consequently, the debate is partly verbal, masking a deeper metaphysical choice about whether morality must be logically consistent always.
