answer: |-
  This is a remarkably sharp observation, and it cuts to the heart of a current crisis in both empirical political psychology and normative political theory. You have identified a structural pathology in public discourse that sits precisely in the gap between *Moral Foundations Theory* (which explains the divergence of intuitions) and *Public Reason Liberalism* (which assumes the convergence of vocabulary facilitates agreement).

  To answer your first question directly: **No, there is no single established term that captures this specific configuration.** There are several "nearest neighbors" that capture one half or the other of the phenomenon, but none that capture the *combination* of unconscious vocabulary homogenization, verdict polarization, and symmetrical bad-faith attribution.

  Below, I outline the nearest conceptual neighbors and where they fall short, propose a coined term with a rigorous definition and boundaries, and address the normative implications for your dissertation.

  ### 1. The Nearest Neighbors (and Why They Fall Short)

  You have already ruled out *post-hoc rationalization* and *strategic framing*, but it is worth specifying exactly why the existing literature doesn't quite fit your data.

  *   **Moral Foundations Theory (Haidt et al.):**
      *   *Fit:* Explains the "native tongues" (Loyalty, Authority, Sanctity) vs. the "translated reasons" (Harm, Fairness). Haidt explicitly notes that WEIRD (Western, Educated, Industrialized, Rich, Democratic) subjects tend to moralize everything through Harm/Care.
      *   *Shortfall:* Haidt treats this translation largely as a cognitive limitation or a strategic move to persuade liberals. He does not theorize the *symmetrical bad-faith attribution* that results when both sides speak "Harm" but mean different things. He predicts disagreement, but not necessarily the specific *epistemic distrust* you are observing.
  *   **Preference Falsification (Timur Kuran):**
      *   *Fit:* Explains why people might hide their true motivations to fit social norms.
      *   *Shortfall:* In Kuran's model, people hide their *verdicts* (private preferences) to match public norms. In your data, the *verdicts* are public and polarized; it is the *reasons* that are falsified (or translated). This is **Reason Falsification**, not Preference Falsification.
  *   **Motivated Reasoning (Dan Kahan):**
      *   *Fit:* Explains why verdicts don't move despite new information (identity protection).
      *   *Shortfall:* Explains the stability of the verdict, but not the *convergence of the vocabulary*. Motivated reasoning usually predicts people will dig into their *own* idiom to defend their tribe, not adopt the opponent's idiom unconsciously.
  *   **Moral Grandstanding (Tosi & Warmke):**
      *   *Fit:* Explains the use of moral talk for status and the resulting polarization/distrust.
      *   *Shortfall:* Assumes a degree of conscious status-seeking. Your data suggests the translation is often unconscious ("respondents... are surprised when shown their own earlier wording"). Grandstanding is performative; your phenomenon appears constitutive of how they now process the issue.
  *   **Public Reason (Rawls / Gaus / Habermas):**
      *   *Fit:* The normative ideal you are observing the breakdown of.
      *   *Shortfall:* Public Reason assumes that sharing a vocabulary creates a "neutral court." Your data suggests the vocabulary itself is the site of the conflict, not the solution.

  ### 2. A Proposed Term: "Moral Monolingualism"

  I propose you label this configuration **Moral Monolingualism**.

  While "monolingualism" is sometimes used in sociology to describe cultural hegemony, it is not a fixed technical term in political theory for this specific dynamic. It offers the right conceptual "carving" because it implies a loss of expressive capacity (the inability to speak one's "native" moral language) and a power dynamic (one language is the "official" language of the state/discourse).

  To capture the specific dynamic of distrust, you can refer to the outcome as **The Insincerity Equilibrium**.

  #### Definition and Boundaries
  **Moral Monolingualism** is a state of political discourse characterized by three necessary conditions:

  1.  **Discursive Hegemony:** A specific moral vocabulary (e.g., Harm, Welfare, Equality) becomes the *only* legitimate currency for public justification, suppressing alternative moral grammars (e.g., Sanctity, Loyalty, Order).
  2.  **Unconscious Translation:** Actors whose intuitive verdicts are driven by the suppressed grammars unconsciously translate their reasons into the hegemonic vocabulary. This is not deliberate strategy (which would be *framing*) but a cognitive adaptation to discursive pressure.
  3.  **Reciprocal Insincerity Attribution:** Because both sides use the same vocabulary but reach opposite verdicts, each side infers that the other is not actually motivated by the stated reasons. The shared language, intended to facilitate trust, becomes the evidence for bad faith.

  #### Discriminating Observables (How to distinguish it in your data)
  To distinguish **Moral Monolingualism** from its nearest neighbors in your coding, look for these markers:

  *   **Vs. Strategic Framing:** In strategic framing, the speaker can switch codes if the audience changes. In Moral Monolingualism, the speaker *cannot* access the original code even in private reflection (or reports surprise when confronted with it). *Test:* Check if respondents express confusion when their earlier "loyalty" language is pointed out.
  *   **Vs. Preference Falsification:** In preference falsification, the *verdict* aligns with the norm. Here, the *verdict* remains deviant/polarized, only the *reason* aligns. *Test:* Verify that verdicts have not converged alongside reasons.
  *   **Vs. Conceptual Stretching (Sartori):** Conceptual stretching is when a term is widened so much it loses meaning. Moral Monolingualism is when a term is *adopted* so universally it masks underlying disagreement. *Test:* Look for the *attribution of lying*. Stretching leads to confusion; Monolingualism leads to distrust.
  *   **Vs. Genuine Conceptual Change:** If this were genuine change, verdicts would eventually converge (as the underlying intuition aligns with the new reason). *Test:* Verify that polarization is increasing or stable, not decreasing.

  ### 3. Normative Implications: Does This Undercut the "Neutral Court"?

  You asked what this phenomenon licenses us to conclude about the dispute underneath, specifically regarding the appeal to shared reasons as a neutral court of appeal.

  **The short answer is: Yes, it undercuts it.**

  If **Moral Monolingualism** is real and widespread, it invalidates the assumption that "shared reasons" constitute a neutral terrain. Here is the theoretical argument you can make in your dissertation:

  1.  **The Vocabulary is Not Neutral:** The convergence on "Harm/Welfare" is not a convergence on *neutral* ground; it is the victory of a specific moral psychology (typically liberal/individualist) over others (communitarian/hierarchical). By forcing all arguments into this currency, the discourse systematically disadvantages positions that rely on Sanctity or Loyalty, not because those positions are wrong, but because they are *untranslatable* without loss.
  2.  **Reasons are Epiphenomenal:** In this configuration, stated reasons are no longer causal drivers of verdicts; they are *ex post* legitimations. Therefore, evaluating "who wins" on the basis of the stated reasons is evaluating a shadow play. The real conflict is happening at the level of intuition/affect, which is no longer being articulated.
  3.  **The Bad Faith is Structural, Not Individual:** The mutual attribution of insincerity is not a failure of individual virtue (i.e., people aren't just "lying"). It is a rational response to a broken discursive system. If I speak your language and you still disagree, the only logical conclusion within that system is that you don't *really* speak my language (i.e., you are lying). The "Insincerity Equilibrium" is a symptom of the Monolingualism, not a diagnosis of the participants' character.

  **Conclusion for your project:**
  You should argue that **Moral Monolingualism** creates a **False Consensus of Ground**. It creates the *appearance* of a shared deliberative space while masking the fact that the participants are operating on different moral operating systems.

  This means you cannot treat the convergence of reasons as evidence that the dispute is being conducted on common ground. Instead, you must treat the convergence of reasons *itself* as evidence of a deeper divergence in the psychologies of the participants. The "neutral court" is an illusion; it is a court that only accepts one kind of testimony, forcing all other witnesses to perjure themselves to be heard, which then leads the judge to disbelieve them.

  ### Summary Recommendation
  *   **Label:** **Moral Monolingualism** (the condition) leading to **The Insincerity Equilibrium** (the dynamic).
  *   **Definition:** The unconscious adoption of a hegemonic moral vocabulary by actors with divergent moral psychologies, resulting in stable verdict polarization and symmetrical attributions of bad faith.
  *   **Normative Claim:** This phenomenon demonstrates that "public reason" can function as a mechanism of exclusion and distrust rather than convergence, invalidating the use of shared vocabulary as a neutral metric for resolving the dispute.

  This framing should give you the theoretical precision you need to code your data and the normative bite you need for your conclusion. It bridges the empirical (why the reasons look the same) with the theoretical (why this makes trust impossible).
