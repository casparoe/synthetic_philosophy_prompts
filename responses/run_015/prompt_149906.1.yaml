answer: |-
  This is a classic pedagogical hurdle. Your students are mixing them up because the two arguments are often taught as a single "Austrian critique," but they operate on different ontological levels. Mises is making an argument about *institutions and accounting*; Hayek is making an argument about *epistemology and time*.

  Here is the breakdown you can use to untangle the knot for them, followed by the critique of Lange and the meta-analysis of where this reasoning might be vulnerable.

  ### 1. Mises vs. Hayek: The Institutional vs. The Epistemological

  **Mises (The Calculation Problem):**
  Mises's 1920 argument is fundamentally about the **common denominator**.
  *   **The Claim:** Rational economic calculation requires a common unit to compare heterogeneous inputs (labor, steel, land) against heterogeneous outputs (cars, bread).
  *   **The Mechanism:** That unit is money prices generated through the exchange of *private property* in the means of production.
  *   **The Block:** If the state owns all capital goods, there is no exchange of title. If there is no exchange, there are no money prices. If there are no money prices, the planner has no way to know if using steel for a bridge is more "valuable" than using it for a train. They are groping in the dark.
  *   **Key Distinction:** Mises is arguing that socialism is *arithmetically impossible* because it lacks the necessary variables (prices) to solve the equation. It is an argument about the **preconditions of accounting**.

  **Hayek (The Knowledge Problem):**
  Hayek (specifically in *The Use of Knowledge in Society*, 1945, building on his 1935 critique of Lange) shifts the ground. He grants, for the sake of argument, that the equations *could* be written.
  *   **The Claim:** The data required to solve the equations does not exist in a concentrated form. It is dispersed, fleeting, and often **tacit**.
  *   **The Mechanism:** The price system is not just a solution to an equation; it is a **telecommunications network** that compresses local, contextual knowledge (e.g., a machine operator knowing a bearing is about to fail, a local merchant sensing a shift in taste) into a single signal.
  *   **The Block:** Centralization requires stripping knowledge of its context to make it legible to the center. In doing so, you lose the very information needed to allocate resources efficiently.
  *   **Key Distinction:** Hayek is arguing that socialism is *epistemologically impossible* because the data is not "given" to be computed; it is *created* through the process of market competition.

  **Summary for Students:** Mises says you can't do the math without private property prices. Hayek says even if you have the math, you don't have the numbers, and you can't get them without the market process.

  ---

  ### 2. Lange's Trial-and-Error: Solution or Relocation?

  Oskar Lange's model (1936–37) proposes a Central Planning Board (CPB) that sets prices, while factory managers follow two rules: (1) minimize average cost, and (2) produce where marginal cost equals price. The CPB adjusts prices based on surpluses and shortages (trial-and-error).

  **Does this answer Mises?**
  *   **Superficially, Yes:** Lange creates "prices." He provides a common denominator.
  *   **Deeply, No:** Mises would argue these are **shadow prices**, not market prices. A market price emerges from a conflict of interest over *owned* property. A shadow price is an accounting index determined by a bureaucratic rule. Without the risk of capital loss (because the state owns the capital), the "price" lacks the anchor of entrepreneurial judgment. It is a simulacrum of a price, not a price itself.

  **Does this answer Hayek?**
  *   **No, and this is the fatal flaw.** Lange assumes that "surplus" and "shortage" are objective, observable data points that can be transmitted to the CPB.
  *   **The Tacit Knowledge Gap:** Hayek would argue that a "shortage" is not a raw number. Is the shortage due to price? Quality? Logistics? A change in local substitution possibilities?
      *   *Example:* If a specific grade of steel is short, a private entrepreneur might substitute a different alloy, change the design, or negotiate a future delivery. This knowledge is local and tacit.
      *   In Lange's model, the manager reports "shortage" to the CPB. The CPB raises the price. But the CPB does not know *why* it was short, nor do they know the local substitution possibilities the manager ignored because they were just following the rule "equate MC to P."
  *   **The Adjustment Process:** For the CPB to adjust prices rationally, they need to know the *elasticities* of supply and demand. But those elasticities are not static constants; they are discovered through the very trial-and-error process Lange tries to simulate. By centralizing the price-setting, Lange removes the competitive discovery procedure that generates the elasticity data.

  **Are Shadow Prices "Real" Prices?**
  They are **accounting devices**, not economic prices.
  *   **Economic Price:** A claim on property, reflecting opportunity cost determined by competing bids from owners risking their own capital.
  *   **Shadow Price:** A parameter set by an authority to balance a ledger.
  *   **The Load:** Shadow prices carry *accounting* information (inputs vs. outputs), but they fail to carry *entrepreneurial* information (risk, uncertainty, future expectations). They solve the static allocation problem (in theory) but fail the dynamic coordination problem.

  ---

  ### 3. Computation vs. Knowledge: Is the Separation a Mistake?

  You asked if Lange solved the computation problem but left the knowledge problem untouched, or if separating them is a conceptual error.

  **The Verdict:** Separating them is analytically useful, but ontologically risky.
  *   **Lange's Victory:** He showed that neoclassical equilibrium conditions *could* be mimicked without private capital ownership. He solved the **static computation** problem (how to allocate given resources efficiently at time *t*).
  *   **Lange's Defeat:** He failed the **dynamic knowledge** problem (how to discover new resources, new methods, and new preferences over time *t+1*).

  **The Conceptual Mistake:**
  The mistake lies in thinking computation and knowledge are separable in a living economy. To "compute" an allocation, you need data. Hayek's point is that the data *is* the knowledge. You cannot separate the "computation" (the math) from the "knowledge" (the inputs) because the inputs are not sitting in a database waiting to be processed; they are generated by the incentives of the agents processing them.

  So, Lange didn't just "leave the knowledge problem untouched." By assuming the data (surpluses/shortages) was available for computation, he **presupposed away** the knowledge problem. He assumed the knowledge was already centralized in the form of statistics, which is precisely what Hayek denied was possible.

  ---

  ### 4. Where My Reasoning Might Fail (The "Steelman" Critique)

  You asked for intellectual humility regarding this analysis. Here are the specific points where the standard Austrian critique (and my summary above) is most vulnerable to counter-argument. If your students press these, the "Lange collapses" narrative gets complicated.

  **A. The "Datafication" of Tacit Knowledge (The AI Argument)**
  *   **The Vulnerability:** Hayek's argument relies on knowledge being *inherently* tacit and non-codifiable.
  *   **The Counter:** If technology (Big Data, AI, IoT sensors) can codify tacit knowledge into data streams in real-time, Hayek's constraint weakens. If a sensor can detect the bearing failure and transmit the cost of substitution instantly to a central algorithm, the "dispersed knowledge" becomes centralized data.
  *   **Why this changes things:** If tacit knowledge can be made explicit without loss of context, the epistemological barrier falls. Lange's model becomes a computational problem, not a knowledge problem. (Note: This ignores the *incentive* to report truthfully, but it attacks the *possibility* of transmission).

  **B. The Definition of "Commodity" (The Sraffa/Lange Defense)**
  *   **The Vulnerability:** Hayek assumes commodities are distinct based on time and place (steel in Chicago vs. steel in Detroit).
  *   **The Counter:** Lange could argue that if the CPB defines commodities broadly enough, the "local" knowledge becomes irrelevant noise.
  *   **Why this changes things:** If the planning unit is large enough, local variations average out. The critique here is that this leads to gross inefficiency, but it challenges the claim that centralization is *impossible in principle*. It suggests the debate is about *degree of efficiency*, not *possibility of calculation*.

  **C. Incentives vs. Information (The Nove/Market Socialism Critique)**
  *   **The Vulnerability:** The Austrian critique often conflates the *information* problem with the *incentive* problem.
  *   **The Counter:** One could construct a Langean model where managers are incentivized via profit-sharing (even without private ownership of capital). If managers have skin in the game, they might utilize local knowledge *for* the plan.
  *   **Why this changes things:** If the "tacit knowledge" is utilized by decentralized managers (as Lange actually suggested, since managers set production levels, only the CPB sets prices), then Hayek's critique of *total* centralization applies less to Lange's specific model than to Soviet-style command planning. Lange's model is actually quite decentralized regarding production decisions.
  *   **The Pivot:** If you concede that Lange allows decentralized managers to use local knowledge, the debate shifts to: "Can the CPB set *prices* correctly without owning the capital?" This brings you back to Mises, but it sidesteps Hayek's strongest point about dispersed knowledge.

  **D. The "As If" Argument (Friedmanesque)**
  *   **The Vulnerability:** Does it matter if the prices are "real" or "shadow" if the outcome is the same?
  *   **The Counter:** If the CPB iterates fast enough, the shadow prices converge to market prices. The ontological status of the property right becomes irrelevant if the functional output is identical.
  *   **Why this changes things:** This challenges Mises's institutional requirement. If simulation yields convergence, the "private property" prerequisite is a historical accident, not a logical necessity.

  ### Summary for your Seminar
  To untangle the knot for your students:
  1.  **Mises** = No Property $\rightarrow$ No Prices $\rightarrow$ No Math. (Institutional)
  2.  **Hayek** = No Market Process $\rightarrow$ No Data $\rightarrow$ No Math. (Epistemological)
  3.  **Lange** = Simulate Prices $\rightarrow$ Get Math $\rightarrow$ Ignore Data Generation.
  4.  **The Failure:** Lange treats prices as parameters to be set, rather than signals to be discovered. He solves static allocation but kills dynamic discovery.
  5.  **The Caveat:** This holds only as long as knowledge remains tacit and incentives remain misaligned. If technology codifies tacit knowledge or incentives are perfectly aligned without property, the critique weakens.

  Hope this helps clear the fog before your next session. Good luck with the sticky keys.
