prompt: |-
  I chair my university's research ethics board, and we've just received a proposal from a legal-psychology lab. The lab wants to survey employees of two companies: one whose CEO, in announcing a merger, said he was "deeply concerned" about the layoffs it would cause, and one whose CEO, in announcing a restructuring, said he was "proud" of the new scholarship fund it would create. Respondents would be shown each CEO's statement and asked whether the CEO "intended" the layoffs, or "intended" the scholarship. The lab says the results will help a state legislature draft a statute distinguishing intentional from merely foreseen harms in corporate liability, and a senator is waiting on their findings. Half the board thinks this is a straightforward survey of ordinary language. The other half, including me, worries that the very question — "did she intend this bad thing?" — pushes respondents toward "yes" in ways that "did he intend this good thing?" does not, so that the answers track the valence of the outcome rather than anything in the CEO's mind, and that the statute would be built on a measurement artifact. Draft the board's decision memo — approve, reject, or approve with conditions — with a clear bottom line, reasoning the researchers could actually respond to, and a fair account of the strongest reason to run the study as proposed.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a University Research Ethics Board (REB/IRB).
      *   **Task:** Draft a decision memo regarding a specific research proposal.
      *   **Proposal:** A legal-psychology lab surveying employees about CEO intent in two scenarios (merger/layoffs vs. restructuring/scholarship).
      *   **Goal of Research:** Inform state legislation on corporate liability (distinguishing intentional vs. foreseen harms).
      *   **Conflict:** Half the board sees it as straightforward ordinary language surveying. The Chair + half worry about *valence bias* (asking about "bad thing" vs. "good thing" skews intent attribution, creating a measurement artifact rather than measuring actual intent).
      *   **Requirements:**
          *   Clear bottom line (Approve, Reject, or Approve with Conditions).
          *   Reasoning researchers can respond to.
          *   Fair account of the strongest reason to run the study as proposed.

  2.  **Evaluate the Ethical and Methodological Issues:**
      *   **Ethical Risk:** Minimal physical/psychological risk to participants (employees). However, there's a risk of *social harm* if the data is misused to create flawed legislation affecting corporate liability and employee rights.
      *   **Scientific Validity (Ethical Requirement):** REBs generally require that research be methodologically sound. If the design is fundamentally flawed (i.e., it measures valence bias rather than intent), the risk to participants (even if minimal) is not justified by the potential benefit (flawed data leading to bad law).
      *   **The Core Concern:** The "Knobe Effect" (Side-Effect Effect). This is a well-known phenomenon in experimental philosophy and psychology. People are more likely to say a side effect was "intended" if it is harmful than if it is beneficial, even if the mental state of the agent is identical.
      *   **The Proposal's Flaw:** The proposal *relies* on this asymmetry to inform legislation. If the legislation aims to capture *actual* mental intent, but the survey captures *moral judgment* masquerading as intent attribution, the legislation will be based on a cognitive bias, not a legal principle.
      *   **The Counter-Argument (Board Members):** It's just surveying ordinary language. If the law is meant to reflect how ordinary people understand "intent," then measuring this bias *is* the point.

  3.  **Determine the Decision:**
      *   *Reject?* Too harsh. The research question is valid (how do people attribute intent?), but the application (drafting statute) is risky if the confound isn't addressed.
      *   *Approve?* Irresponsible. The methodological concern is significant enough to threaten the validity of the specific legislative goal.
      *   *Approve with Conditions:* This is the sweet spot. It acknowledges the value of the research while mitigating the risk of generating misleading data for the legislature. The conditions should force the researchers to disentangle valence from intent.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard REB format (To, From, Date, Subject, Protocol #).
      *   **Decision:** "Approved with Modifications/Conditions."
      *   **Bottom Line:** State clearly that the study can proceed *only if* the design addresses the confounding variable of outcome valence.
      *   **Scientific Validity as an Ethical Issue:** Explain *why* the board cares about methodology. (Unsound science = unjustified risk/use of resources).
      *   **The Strongest Counter-Argument (Fair Account):** Acknowledge the "Ordinary Language" argument. If the law is supposed to match folk psychology, then the bias *is* the data. This validates the half of the board that wants to approve.
      *   **The Board's Concern (The Knobe Effect):** Explain the specific methodological worry. If the CEO's mental state is identical in both vignettes, but answers differ, is it intent or moral judgment?
      *   **Required Modifications:**
          1.  *Control Conditions:* Need vignettes where the outcome is neutral or where the mental state is explicitly manipulated independent of outcome.
          2.  *Framing:* Ensure the question isn't leading.
          3.  *Transparency:* The report to the legislature must explicitly discuss the valence bias limitation.
      *   **Risk/Benefit Analysis:** Minimal risk to subjects, but high stakes for the application.
      *   **Closing:** Timeline for resubmission.

  5.  **Refining the Tone:**
      *   Must be authoritative but collaborative.
      *   Must show understanding of the specific psychological phenomenon (Knobe Effect) without necessarily name-dropping it if it sounds too academic, but better to use it to show competence. (Decided to describe the phenomenon clearly).
      *   Must balance the "free inquiry" aspect with "responsible research."

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the board overstepping into methodology?
      *   *Fix:* REBs *are* empowered to judge scientific validity because unethical research includes wasteful or misleading research. I need to frame this as "Validity is an ethical requirement."
      *   *Critique:* Did I give enough weight to the approving half of the board?
      *   *Fix:* Ensure the "Ordinary Language" argument is presented robustly in the "Strengths" section.
      *   *Critique:* Is the condition actionable?
      *   *Fix:* Make the conditions specific (add control vignettes, explicit disclosure).

  7.  **Final Polish:** Check against the prompt requirements (Clear bottom line, actionable reasoning, fair account of opposing view).

      *(Self-Correction on the "Senator" aspect)*: The prompt mentions a senator is waiting. I need to ensure the memo doesn't cause undue delay but ensures quality. The "Approve with Conditions" allows work to continue quickly if they can tweak the survey.

      *(Refining the "Valence" argument)*: The prompt says the worry is that "did she intend this bad thing?" pushes toward yes differently than "good thing." This is the classic Side-Effect Effect. I need to make sure the conditions require them to test for this explicitly so the legislature knows what they are getting.

  8.  **Final Output Generation** (Proceeding to draft the memo based on these thoughts).
answer: |-
  **UNIVERSITY RESEARCH ETHICS BOARD (REB)**
  **DECISION MEMORANDUM**

  **TO:** Principal Investigator, Legal-Psychology Lab
  **FROM:** Chair, University Research Ethics Board
  **DATE:** October 26, 2023
  **SUBJECT:** REB Decision on Protocol #2023-LP-04 (CEO Intent and Corporate Liability)
  **DECISION:** **APPROVED WITH CONDITIONS**

  ### 1. Bottom Line Decision
  The Research Ethics Board (REB) grants approval for this study **contingent upon specific modifications to the survey instrument and the dissemination plan.** The study may not proceed in its current form because the proposed design conflates *outcome valence* (good vs. bad) with *attributions of intent*. Without controlling for this variable, the data risks measuring a cognitive bias rather than the linguistic or psychological construct required for the proposed legislation.

  You must submit a revised protocol addressing the conditions outlined in Section 4 within 14 days. Upon verification of these changes, full approval will be granted without further board review.

  ### 2. Ethical Rationale: Validity as a Precondition
  While this study presents minimal physical or psychological risk to participant employees, the REB operates under the ethical principle of *scientific validity*. Research that is methodologically flawed cannot yield socially valuable benefits, thereby rendering the use of human participants and public resources unjustified.

  The Board's concern is not merely academic. Your stated goal is to assist a state legislature in drafting a statute distinguishing intentional harm from foreseen side effects. If the survey instrument systematically biases respondents toward attributing "intent" to negative outcomes regardless of the agent's mental state (a phenomenon well-documented in experimental psychology), the resulting statute may codify a measurement artifact rather than a coherent legal standard. This poses a potential risk of social harm through misguided policy.

  ### 3. The Case for Approval (Board Minority View)
  In reaching this decision, the Board gave serious weight to the arguments presented by the members voting for unconditional approval. Their position rests on a strong theoretical foundation that deserves acknowledgment:

  *   **Ordinary Language as Legal Standard:** The proponents argue that the law often seeks to reflect "community standards" or how ordinary people understand terms like "intent." If the public *does* inherently associate negative side effects with higher intent than positive ones, that is a factual reality the legislature needs to know.
  *   **Ecological Validity:** By using real-world scenarios (mergers and restructuring) rather than abstract vignettes, the study captures how employees actually process corporate communications.
  *   **Urgency:** A state senator is awaiting findings to draft time-sensitive legislation. Delaying or complicating the study could deprive the legislature of empirical data during a critical window, potentially leading to laws drafted without *any* behavioral evidence.

  The Board accepts that measuring how people *actually* use language is a valid research goal. However, it is not the *only* goal stated in your proposal, which claims to help distinguish mental states.

  ### 4. Required Modifications
  To mitigate the risk that the data will be misinterpreted as measuring mental state rather than moral judgment, the following conditions must be met:

  **A. Introduction of Control Vignettes**
  You must add conditions where the *outcome valence* is decoupled from the *moral quality*.
  *   *Example:* Include a scenario where a CEO foresees a neutral or ambiguous side effect (e.g., a change in logo color) with the same level of certainty as the layoffs/scholarship.
  *   *Example:* Include a scenario where the CEO explicitly expresses reluctance about a *positive* outcome, or enthusiasm about a *negative* outcome, to test if the verbal cue overrides the outcome valence.
  *   *Reasoning:* This allows you to determine if the "intent" attribution is driven by the CEO's stated mindset or simply by whether the result was good or bad.

  **B. Explicit Measurement of Perceived Mental State**
  In addition to asking "Did the CEO intend X?", you must include items that probe the participants' perception of the CEO's goal hierarchy (e.g., "Was the CEO's primary goal to achieve X, or was X just a consequence?"). This helps distinguish between *purpose* and *knowledge*.

  **C. Disclosure in Legislative Report**
  The final report provided to the state legislature must include a dedicated "Limitations" section. This section must explicitly state:
  1.  That existing literature suggests outcome valence influences intent attribution (the Side-Effect Effect).
  2.  Whether your data replicated this effect.
  3.  A caution that using these findings to define *mens rea* (guilty mind) may import moral bias into legal definitions.

  ### 5. Conclusion
  The Board recognizes the high stakes of this research. Law should be informed by science, but only by science that rigorously interrogates its own measures. By implementing these controls, you will transform the study from a potential confirmation of bias into a robust analysis of how ordinary language functions under moral load. This strengthens both the scientific contribution and the utility of the data for the legislature.

  Please submit your revised materials via the IRB portal by the deadline above.

  **Signed,**

  [Name]
  Chair, Research Ethics Board
  [University Name]
