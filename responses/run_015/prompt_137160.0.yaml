      *   *Let's go back to the "Noise/Square" idea but make it about a Budget Allocation.*
          *   Resource: $50,000 discretionary fund.
          *   Option A (Aggregative): Fix the potholes. Everyone hates potholes. 95% support.
          *   Option B (Neutral): Fund a "Community Grant Process."
          *   *Wait, Neutrality:* Fixing potholes is usually considered neutral (infrastructure). It doesn't presuppose a good life.
          *   *Need a value-laden choice.*
          *   Resource: The "Main Street Median."
          *   Option A (Aggregative): Plant native wildflowers (Pollinator support). 70% love it (Eco-conscious). 30% hate it (Looks messy, prefer manicured grass).
          *   Option B (Neutral): Install *planters* that allow residents to plant their own choices in designated zones.
          *   *Why?* A says "Ecological Good > Aesthetic Order." B says "You decide."
          *   *Problem:* "You decide" borders on "let everyone decide."

      *   *Let's try the "Algorithm as Judge" angle.*
          *   Scenario: A single, specific, non-repeatable allocation. The "Centennial Clock Tower." It chimes every hour.
          *   Issue: The chimes disturb sleep for those on the night shift / light sleepers (Minority). The majority loves the tradition/wayfinding.
