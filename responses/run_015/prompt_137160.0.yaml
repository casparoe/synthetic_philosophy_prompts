          *   Constituency 2: *Property Taxpayers.* (Includes the hospital/business park across the river who employ night workers who complain). If the AI weights by tax contribution, the "Silence" vote gains weight. Or, simpler: *Current Residents* vs. *Future Residents* (Noise pollution is permanent?). No, let's stick to the prompt's suggestion: *Residents* vs. *Payers*.
