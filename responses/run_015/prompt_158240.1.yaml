      *   **Section 4: The Conclusion (Immunity via Courts).**
          *   Explain why courts aren't magic shields.
          *   Mention the need for political culture/enforcement.
      *   **Summary/Verdict:** A quick wrap-up table or bullet points.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Populares point:* Make sure to mention the Gracchi brothers started this, not just Caesar. Caesar was the end result, not the start.
      *   *Refining the Optimates point:* Emphasize *mos maiorum*. It's unwritten custom, not a constitution. The Senate wasn't a court.
      *   *Refining the "Rights" point:* Romans cared about *libertas* (freedom from tyranny), but it was status-based, not universal human rights.
      *   *Refining the Modern Analogy:* Use the concept of "Democratic Backsliding." Courts can be packed or ignored. Mention Weimar Germany or modern examples (Hungary, etc.) where courts existed but democracy eroded.

  5.  **Review against User's Tone:**
