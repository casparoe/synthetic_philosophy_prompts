answer: |-
  ### The Grounded Reliability Principle

  Your tentative principle fails because it conflates *logical self-reference* (which Löb's theorem restricts) with *empirical self-modeling* (which induction supports). You want to keep cases 4 and 7, which rely on empirical track records, but your "well-foundedness" clause bans them because they look like loops. The repair is to distinguish between trusting a *mechanism* based on past performance versus trusting a *proof* based on self-assertion.

  Here is the repaired principle, **The Grounded Reliability Principle**, stated clause by clause:

  1.  **Direct Inspection:** Trust is admissible if the mechanism producing the claim is fully inspectable and verified by you at the time of judgment.
      *   *Motivating Cases:* 1 (Calculator tests), 3 (Kernel read).
      *   *Reasoning:* This is the gold standard. You aren't trusting the output; you are trusting your own verification of the source.

  2.  **Empirical Continuity:** Trust is admissible if the mechanism is empirically indistinguishable from past instances of the same mechanism whose outputs were verified, provided the environment remains stable.
      *   *Motivating Cases:* 4 (Assistant unchecked), 5 (Friend), 7 (Chess engine).
      *   *Reasoning:* This saves 4 and 7. You are not trusting the system's *logic* about itself; you are trusting your *induction* about the physical system. A chess engine deep search is trusted because shallow searches worked before, not because the engine proved it should be trusted.

  3.  **Value Stability:** Trust in a self-modification is inadmissible if the modification alters the criteria used to validate the modification itself.
      *   *Motivating Cases:* 8 (Toy agent), New Case (Goal modification).
      *   *Reasoning:* This handles the Löbian wall where it actually matters. You cannot use your current goals to validate new goals if the new goals change what "validation" means. This is where self-trust truly breaks.

  4.  **Computational Hazard:** Refusal to compute is admissible if the computation itself causally influences the state relevant to the decision in a way that decouples output from truth or stability.
      *   *Motivating Cases:* 9 (Medical decision).
      *   *Reasoning:* This separates epistemic trust from instrumental safety. Sometimes running the code changes the hardware (your brain) in undesirable ways, regardless of the output's truth.

  5.  **The Löbian Boundary:** Pure logical self-assertion without empirical grounding or external check adds no justification.
      *   *Motivating Cases:* 10 (System reporting proof), 6 (Future self).
      *   *Reasoning:* If you have no empirical track record (Clause 2) and no inspection (Clause 1), a claim of "I have proved this" is empty. *Note: This clause forces a revision of your verdict on Case 6.*

