answer: |-
  ### Exam Prompt

  **Philosophy of Science Seminar – Final Examination**
  **Time Allowed:** 45 Minutes
  **Word Count:** 700–800 Words

  **Question:**

  In our discussion of Milton Friedman's methodology, we examined his claim that the realism of assumptions is irrelevant provided a theory yields accurate predictions (often called the 'F-twist'). To refine this, we introduced a distinction between **thin** and **thick** idealization.

  *   **Thin idealization** involves neglecting variables for mathematical tractability (e.g., ignoring air resistance in ballistics).
  *   **Thick idealization** involves assuming a causal structure known to be false (e.g., perfect information in economics or homogeneous mixing in epidemiology).

  Write an essay addressing the following: Does Friedman's predictive defense hold equally for both thin and thick idealizations? Analyze whether predictive success functions the same way in both cases. Finally, identify if there is a hidden slide in Friedman's argument from claiming a model 'predicts' to implying it 'explains.'

  ***

  ### Model Answer

  Friedman's instrumentalist defense of unrealistic assumptions relies on the premise that the only valid test of a theory is predictive accuracy. However, applying this defense requires distinguishing between types of idealization. When we separate thin idealization from thick idealization, it becomes clear that Friedman's argument loses force as the idealization becomes thicker, specifically because thick idealizations obscure the difference between prediction and explanation.

  Thin idealization operates by neglecting secondary factors to make a model solvable. In classical mechanics, ignoring air resistance is a thin idealization. We know air resistance exists, but in a vacuum or over short distances, its causal impact is negligible. Here, Friedman's defense works well. The assumption is false, but it is false in a way that does not distort the underlying causal mechanism. The model predicts well *because* the omitted variables are genuinely insignificant in the specific context. Predictive success here validates the simplification because the core causal structure remains intact. The assumption is a convenient fiction that does not interfere with the truth of the mechanism.

  Thick idealization, however, posits causal mechanisms that are fundamentally incorrect. In economics, assuming agents have perfect information is not just a simplification; it is a structural misrepresentation of how markets function. Similarly, assuming homogeneous mixing in epidemiology ignores social networks that drive transmission. In these cases, Friedman's defense is problematic. A model might predict aggregate trends correctly despite having the wrong causal structure. For example, a supply-demand model might predict price changes correctly even if agents do not actually maximize utility as described. Here, predictive success is accidental or emergent, not a result of capturing the true mechanism. Therefore, predictive success does not mean the same thing in thick cases as it does in thin ones. In thin cases, prediction suggests the mechanism is roughly correct; in thick cases, prediction may occur despite the mechanism being wrong.

  This leads to the critical slide in Friedman's argument: the move from prediction to explanation. Friedman argues that because a theory predicts well, we should accept its assumptions *as if* they were true for the purpose of analysis. However, this conflates instrumental utility with explanatory adequacy. A model can be a good prediction machine without explaining *why* a phenomenon occurs. If we accept thick idealizations solely on predictive grounds, we risk cementing false causal stories. For instance, if we accept the perfect information assumption because it predicts price equilibria, we fail to explain how real agents actually learn or negotiate.

  Friedman makes a normative leap when he suggests that because prediction is the goal, explanation is unnecessary. He assumes that science seeks only to organize data efficiently. But if science also seeks to understand underlying mechanisms, thick idealizations are liabilities, not assets. They may save the phenomena, but they do not save the explanation. By treating all unrealistic assumptions as equal provided they predict, Friedman ignores the epistemic cost of adopting false causal structures.

  In conclusion, Friedman's F-twist is robust for thin idealizations where simplification does not distort causal reality. It fails for thick idealizations where the assumption itself misrepresents the mechanism. Predictive success in the latter case does not validate the theory's structure, only its output. Ultimately, Friedman's defense overreaches when it implies that predictive power alone justifies accepting a theory's assumptions, thereby collapsing the vital distinction between predicting an outcome and explaining its cause.

  ***

  ### Marking Scheme

  **Total Points: 100**

  **1. Understanding of Friedman's F-Twist (25 Points)**
  *   **A (23-25):** Clearly articulates that Friedman prioritizes predictive accuracy over the realism of assumptions. Identifies this as an instrumentalist stance.
  *   **B (20-22):** Correctly summarizes Friedman's view but may lack precision regarding the instrumentalist nature or the specific role of assumptions.

  **2. Application of Thin vs. Thick Idealization (30 Points)**
  *   **A (27-30):** Explicitly distinguishes the two. Identifies that thin idealizations preserve causal structure (negligible variables), while thick idealizations misrepresent causal structure (false mechanisms). Argues Friedman's defense is stronger for thin than thick.
  *   **B (24-26):** Defines both terms correctly but treats them too similarly. May argue Friedman applies equally to both, or fails to highlight that thick idealizations involve structural misrepresentation rather than just simplification.

  **3. Prediction vs. Explanation Distinction (25 Points)**
  *   **A (23-25):** Clearly identifies the "hidden slide." Argues that predictive success does not guarantee explanatory adequacy. Notes that thick idealizations might predict well while explaining poorly.
  *   **B (20-22):** Mentions the difference between prediction and explanation but treats it vaguely. May accept Friedman's conflation without critical pushback.

  **4. Identification of the Normative Leap (20 Points)**
  *   **A (18-20):** Explicitly spots the normative leap: Friedman moves from "the model predicts" to "we should accept the assumptions/explanation." Critiques the idea that science is only about prediction.
  *   **B (16-17):** Notes that Friedman might be wrong but fails to identify the specific leap from descriptive success to normative acceptance of assumptions.

  **Differentiation Summary (A vs. B):**
  *   **A Grade:** Must recognize that thick idealizations misrepresent mechanisms rather than just simplify them. Must separate predictive accuracy from explanatory adequacy. Must explicitly identify the normative leap Friedman makes regarding the acceptance of assumptions.
  *   **B Grade:** Will likely summarize the concepts correctly but fail to connect thick idealization to causal misrepresentation. Will likely treat prediction and explanation as closer than they are, or miss the normative implication of Friedman's defense.
