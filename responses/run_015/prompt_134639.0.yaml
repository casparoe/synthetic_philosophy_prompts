prompt: |-
  Write a sestina about Harsanyi's aggregation theorem—specifically the result that when both individual and social preferences satisfy the von Neumann-Morgenstern axioms and a Pareto condition holds, the social welfare ordering must be a weighted linear combination of individual cardinal utility functions—using the six end-words rationality, weights, Pareto, cardinal, social, and aggregate, rotated through the standard sestina pattern so that the poem's formal cycling enacts the theorem's derivation from separate utility representations to a single social function. The philosophical content should do real structural work: the envoi must reveal that the weights are not exogenous moral constants assigned prior to aggregation but are themselves fixed by the axioms, so that the closing lines stage the tension between treating each agent's utility as irreducible and treating the social order as reducible to nothing beyond the weighted sum. To keep the exercise from being a textbook illustration, inject the following framing: the "individuals" are not people but small, separately trained language models, each producing cardinal utility judgments over a shared policy space, with weights assigned not by democratic equality but by each model's out-of-sample calibration score on a held-out moral-reasoning benchmark; ask, inside the poem, whether Harsanyi's result still licenses treating the aggregate judgment as authoritative when the weights are themselves endogenous outputs of the system being aggregated. The poem should be accurate enough that someone who knows the theorem recognizes the axioms and the linearity result correctly—without misrepresenting the role of Pareto or the cardinality assumption—while remaining accessible to a reader who does not know the result in advance, and it should function as poetry first rather than as explanation. Do not include citations, bibliographies, page references, or direct quotations from Harsanyi's writing.
