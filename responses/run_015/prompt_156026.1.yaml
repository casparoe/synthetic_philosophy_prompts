  # JOINT STATEMENT ON THE METAPHYSICS OF NORMATIVE GROUNDING
  **Collaborators:** The Unified Grounding Research Group (UGRG)
  **Subject:** The Status of Normative Truths and Descriptive Bases
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS AND CONSTRAINTS

  The undersigned parties, representing the Metaphysical Grounding Realist (MGR) and Grounding Pluralist (GP) positions, hereby stipulate the following formal, explanatory, and negative constraints. These claims constitute the shared framework within which our disagreement regarding the cross-domain status of normative facts proceeds.

  1.  **Formal Features of Grounding:**
      *   **Irreflexivity:** Both parties agree that no fact grounds itself. Any account implying that a normative fact is self-grounding in a vicious manner is rejected.
      *   **Asymmetry:** Both parties agree that grounding is asymmetric. If fact *A* grounds fact *B*, then *B* does not ground *A*.
      *   **Transitivity:** Both parties agree that transitivity is a formal ideal for grounding chains. However, we acknowledge a dispute regarding whether transitivity holds *across* domain boundaries (e.g., Physical → Mental → Normative). We agree that within any single proposed domain-internal relation, transitivity must hold without exception.

  2.  **Explanatory Success Conditions:**
      *   **Scientific Integrity:** Any account must preserve the causal closure of the physical domain. Normative facts cannot intervene in physical causal chains in a way that violates conservation laws or established physical models.
      *   **Ethical Phenomenology:** Any account must preserve the objective "authority" of normative claims. It must explain why normative truths provide reasons for action that are not merely expressions of preference or psychological states.
      *   **Supervenience:** Both parties agree that the normative supervenes on the descriptive. There can be no normative difference without some underlying descriptive (physical, mental, or social) difference. We disagree on whether this supervenience relation *constitutes* grounding (MGR) or is a brute constraint between autonomous domains (GP).

  3.  **Shared Failure Conditions:**
      *   **Vicious Circularity:** Any account that requires a normative fact to ground its own descriptive base, or vice versa, in a closed loop, is fatal to the theory.
      *   **Explanatory Vacuity:** An account fails if it posits a grounding relation that does no explanatory work (e.g., merely renaming the correlation between descriptive and normative facts).
      *   **Ontological Explosion:** Both parties reject accounts that multiply fundamental entities beyond necessity. We differ on what counts as "necessary," but agree that positing a distinct fundamental entity for every normative variation without a unifying principle is unacceptable.

  ## 2. DISAGREEMENTS TABLE

  The following table outlines the precise metaphysical, conceptual, and methodological divergences regarding the grounding of normative truths (e.g., *that causing unnecessary suffering is pro tanto wrong*).

  | Issue | Metaphysical Grounding Realist (MGR) | Grounding Pluralist (GP) |
  | :--- | :--- | :--- |
  | **Nature of the Relation** | There is a single, unified relation of ontological priority ("Grounding") that operates across physical, mental, and normative domains. | Fundamentality fragments into domain-internal ordering relations (physical grounding, normative grounding, etc.). There is no cross-domain metaphysical priority. |
  | **Normative Grounding Base** | Normative facts are genuinely grounded in non-normative descriptive properties. The truth of "suffering is wrong" is metaphysically determined by descriptive facts about suffering. | Normative grounding is autonomous. Normative facts are grounded in other normative facts (e.g., principles of rationality). Descriptive facts *trigger* or *enable* normative facts but do not *ground* them. |
  | **Cross-Domain Priority** | Cross-domain grounding is required to explain supervenience. The descriptive is ontologically prior to the normative. | Cross-domain priority is a category mistake. The descriptive and normative are distinct ontological categories that cannot stand in priority relations to one another. |
  | **"No-Free-Lunch" Constraint** | **Accepted (Interpretation A):** Deriving normative facts from descriptive facts does not violate ontological parsimony; it reduces the number of fundamental kinds. | **Accepted (Interpretation B):** Deriving normative facts from descriptive facts *violates* the constraint. One cannot get an 'ought' from an 'is' without a normative bridge principle, which must itself be fundamental. |
  | **Methodology** | **Continuity:** Metaphysical methods used in philosophy of mind and physics should apply to ethics. | **Autonomy:** Ethical inquiry has its own methods (reflective equilibrium, conceptual analysis) that are not subordinate to general metaphysics. |

  ## 3. CRUX ANALYSIS

  The following three cruxes identify sub-questions where empirical or conceptual resolution would significantly alter the dialectical landscape. For each crux, we identify a concrete case and state explicit predictions.

  ### Crux 1: Evolutionary Explanations as Grounding vs. Debunking
  **Question:** Do evolutionary explanations of normative belief function as partial grounding explanations (supporting the truth) or as debunking threats (undermining the truth)?

  *   **Concrete Case:** The adaptive evolution of empathy. Humans possess a psychological disposition to view the suffering of kin as "wrong" because this disposition enhanced group survival.
  *   **Relevance:** If descriptive facts (evolutionary history) ground normative facts, the evolutionary cause should align with the normative truth. If they are autonomous, the cause is irrelevant to the truth.
  *   **MGR Prediction:** If the MGR is correct, the evolutionary history is part of the grounding chain. We predict that investigating the *function* of empathy will reveal descriptive facts that *constitute* the wrongness. If evolution produced a false belief (e.g., suffering is good), the MGR account would be falsified because the descriptive base would fail to ground the normative truth.
  *   **GP Prediction:** If the GP is correct, evolutionary history is purely causal, not grounding. We predict that even if evolution had selected for a belief that "suffering is good," the normative truth ("suffering is wrong") would remain unchanged. The evolutionary explanation is a debunking threat only if it shows our beliefs are disconnected from *normative* grounds, not descriptive ones.

  ### Crux 2: Physical Realization and Normative Autonomy
  **Question:** Does the approximate physical realization of a normative structure undermine or support the autonomy of normative grounding?

  *   **Concrete Case:** An AI system aligned to maximize human welfare. The AI processes descriptive data (pain signals, resource allocation) and outputs normative judgments ("Action X is wrong") without possessing phenomenological states or biological drives.
  *   **Relevance:** Tests whether normative status supervenes strictly on functional/descriptive structure (MGR) or requires internal normative authority (GP).
  *   **MGR Prediction:** Supports MGR. If the AI's physical/functional structure perfectly mirrors the descriptive base of human moral reasoning, the AI's judgments are genuinely normative. The physical realization *is* the grounding base.
  *   **GP Prediction:** Supports GP. The AI simulates normative language but lacks normative grounding. Its "judgments" are descriptive predictions of human behavior. True normative grounding requires participation in the normative domain (e.g., rational agency), which physical realization alone cannot provide.

  ### Crux 3: The Status of Bridge Principles
  **Question:** Are principles connecting descriptive facts to normative facts (e.g., "If an act causes suffering, it is wrong") themselves normative or descriptive?

  *   **Concrete Case:** The "Open Question Argument" applied to bioethics. In a debate on gene editing, one party claims "It is unnatural, therefore it is wrong." The counter-claim is "Naturalness is descriptive; Wrongness is normative."
  *   **Relevance:** Determines if the link between domains is itself a candidate for grounding (MGR) or a brute normative axiom (GP).
  *   **MGR Prediction:** Bridge principles are metaphysically necessary truths grounded in the nature of the properties involved. They are discoverable via the same metaphysical inquiry used to find grounding in other domains.
  *   **GP Prediction:** Bridge principles are substantive normative commitments, not metaphysical discoveries. They cannot be derived from descriptive analysis alone. Accepting them is a normative choice, not a metaphysical deduction.

  ## 4. VERBAL DISPUTE IDENTIFICATION

  Upon review, we identify a potential verbal dispute regarding the term **"Fundamental."**

  *   **The Dispute:**
      *   **MGR Usage:** "Fundamental" means *ungrounded in any other domain*. For the MGR, if normative facts are grounded in descriptive facts, normative facts are not fundamental.
      *   **GP Usage:** "Fundamental" means *explanatorily basic within a domain*. For the GP, normative facts can be "normatively fundamental" (grounded only in other normative facts) even if they supervene on descriptive facts.
  *   **Metaphysical Weight:** This wording difference does not carry metaphysical weight regarding the *existence* of normative truths or their supervenience base. It reflects a taxonomic disagreement about how to label the hierarchy.
  *   **Resolution:** We agree to distinguish between **Ontological Fundamentality** (MGR's sense: absolute bottom of the chain) and **Domain Autonomy** (GP's sense: internal explanatory sufficiency). The substantive disagreement remains whether the descriptive domain ontologically determines the normative domain, regardless of the label "fundamental."

  ***

  **Signed:**

  *Dr. A. Realist, Lead Investigator, Unified Grounding Research Group*
  *Dr. B. Pluralist, Lead Investigator, Unified Grounding Research Group*
