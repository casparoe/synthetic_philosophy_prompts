  ### Session Design: The Biscuit Bargain

  **Objective:** To create a tangible experience of how changing what is *possible* (even if not chosen) changes what feels *fair*, contrasting two different intuitions about division.

  **Materials:**
  *   8 tables (for 8 pairs).
  *   Token cards: Two colours (e.g., Red for Player A, Blue for Player B). Values in multiples of 10.
  *   A large wall chart with 8 rows (one per pair) and columns for Round 1, 2, and 3 results.
  *   A tin of biscuits and a card saying "Next Month's Topic".
  *   A stopwatch.

  **Timeline (90 Minutes):**
  *   **00:00 – 00:10:** Introduction and Pairing.
  *   **00:10 – 00:25:** Round 1 (The Baseline).
  *   **00:25 – 00:40:** Round 2 (The Shift).
  *   **00:40 – 00:55:** Round 3 (The Stress Test).
  *   **00:55 – 01:05:** Break (Tea/Coffee).
  *   **01:05 – 01:30:** Debrief and Discussion.

  ---

  #### 1. Introduction (10 mins)
  Tell the group: "We are going to play a simple negotiating game. You will work in pairs. In each round, you must agree on how to split a pot of tokens. If you agree, you keep the tokens. If you disagree, you get nothing for that round. The pair with the highest combined score across all rounds wins the biscuits and the right to choose next month's topic. If there's a tie, we flip a coin."

  *   **Keep Ignorant:** Do not tell them there are different 'rules' for fairness. Do not tell them the rounds are testing different mathematical properties. Do not mention breakdown points explicitly yet (just say "if you don't agree, you get zero").
  *   **Pairing:** Randomly assign pairs. Assign one person as 'Red' and one as 'Blue' for the whole session.

  #### 2. Round 1: The Symmetric Split (15 mins)
  *   **What they are told:** "Here is a menu of 11 cards. Each card shows a split of 100 tokens. Card 1 is Red 0 / Blue 100. Card 6 is Red 50 / Blue 50. Card 11 is Red 100 / Blue 0. You must pick one card together. You have 5 minutes."
  *   **Breakdown:** 0 tokens each.
  *   **Expected Behaviour:** Almost every pair will pick Card 6 (50/50). It is the focal point.
  *   **Action:** Pairs write their result on the wall chart.

  #### 3. Round 2: The Hidden Leverage (15 mins)
  *   **What they are told:** "Same as before, but we have added two new cards to the menu. Card 12 is Red 120 / Blue 20. Card 13 is Red 20 / Blue 120. You can still pick any of the original cards too. The total pot isn't fixed anymore on these new cards, but the old ones are still available."
  *   **The Trick:** The new cards are extreme. Most pairs will not pick them because they look unfair (120/20). However, they change the *maximum possible* gain for each player.
  *   **Breakdown:** 0 tokens each.
  *   **Expected Behaviour:** This is the critical moment.
      *   Some pairs will ignore the new cards and pick 50/50 again (Red 50/Blue 50).
      *   Some pairs (especially where Red feels empowered by the new Red 120 card) might argue for Red 60/Blue 40, reasoning that Red's 'potential' is higher now.
  *   **Action:** Pairs write results on the wall chart. Highlight any drift from 50/50.

  #### 4. Round 3: The Breakdown Threat (20 mins)
  *   **What they are told:** "Same menu as Round 2. However, the rules for disagreement have changed. If you fail to agree, Red gets 20 tokens and Blue gets 0 tokens automatically. This is your safety net if talks fail."
  *   **The Trick:** This changes the 'breakdown point'. Red now has a threat advantage.
  *   **Expected Behaviour:** Pairs who stayed at 50/50 in Round 2 might now shift towards Red, because Red's 'guaranteed' position is better.
  *   **Action:** Pairs write results. Tally scores. Award biscuits.

  ---

  #### 5. Debrief (25 mins)
  *   **Step 1: The Wall Chart.** Stand by the chart. Point to Round 1. "Everyone landed here (50/50). Why?" (Expect: "It's fair", "Half each").
  *   **Step 2: The Drift.** Point to Round 2. "We added options nobody picked. Did anyone's split change?" If yes, ask why. "Did the fact Red *could* get 120 make you feel Red *should* get more, even if you didn't pick the 120 card?"
  *   **Step 3: The Names.** Now you can introduce the concepts.
      *   **Facilitator Line:** "In the literature, the rule that says 'split the absolute gain equally'—ignoring the new extreme options—is often associated with the **Nash Bargaining Solution**. It cares about the product of your gains. It says irrelevant options shouldn't change the deal."
      *   **Facilitator Line:** "The rule that says 'split the percentage of potential equally'—so if Red's potential went up, Red's share goes up—is called the **Kalai-Smorodinsky Solution**. It cares about how much of your 'dream' you achieved."
      *   **Facilitator Line:** "You just felt the tension between 'Fair is equal amounts' and 'Fair is equal opportunity'."
  *   **Step 4: Correction.** "I need to correct my own understanding here. I told you these rules look the same on paper. They don't. One respects 'Independence of Irrelevant Alternatives' (Nash), and the other respects 'Individual Monotonicity' (Kalai-Smorodinsky). If you felt dragged by the unused card, you were feeling Kalai-Smorodinsky."

  ---

  #### 6. Honest List of What Will Go Wrong
  1.  **Ignoring the Extreme Cards:** Pairs may treat the new 120/20 cards as jokes and ignore them completely. If so, no drift occurs in Round 2.
      *   *Fix:* In Round 2 instructions, verbally emphasise: "Notice that Red can now theoretically achieve 120. Blue is still capped at 100 on the old cards."
  2.  **Score Confusion:** Participants might add up tokens incorrectly or care more about beating their partner than the group prize.
      *   *Fix:* Keep a running tally on the whiteboard yourself. Remind them the prize is for the *pair's* total.
  3.  **The Breakdown Confusion:** In Round 3, participants might misunderstand the "20/0 safety net" as a starting point rather than a failure outcome.
      *   *Fix:* Use the phrase "If you walk away empty-handed, this is what you get."
  4.  **Dominant Personalities:** One person in the pair may dictate the choice, bypassing the 'negotiation' feeling.
      *   *Fix:* Remind them both must sign the card.

  #### 7. What This Game Cannot Stage
  This game cannot stage the **curvature of the frontier**. The Nash solution depends heavily on whether the trade-off between players is linear or curved (risk aversion). Because we are using discrete cards with linear trade-offs (mostly), you are isolating the 'Ideal Point' vs 'Independence' conflict, but you are not showing how risk attitudes change the product maximisation. You will have to state this yourself: "We haven't tested how much you fear losing tokens, only how you measure gain."

  #### 8. The Weakest Assumption
  The design assumes participants care about the **maximum possible outcome** (the Ideal Point) even if it is unattainable in a fair agreement. In a village hall, people often care more about the **social norm** (50/50) than the mathematical potential. If they stick to 50/50 despite the new cards, the 'drag' effect fails.

  #### 9. Falsifying Observation
  If, in Round 2, **zero pairs** shift their settlement away from the Round 1 split despite the new extreme options being publicly visible, the design has failed to produce the intended moment. It would suggest that for this group, 'fairness' is absolute, not proportional to potential.

