answer: |-
  ### Decision Tree: Latent Verdict vs. Next-Token Simulation

  **Root Commitment:** We need the truth about test breakage now, but ground truth arrives hours later.

  #### Branch Nodes (Decision Points)
  *Terms defined in half-sentences where necessary.*

  1.  **Ground Truth Timing:** Is the correct answer available before the merge decision must be made? (No, by premise; CI is slow).
  2.  **Ground Truth Eventuality:** Does the correct answer become available eventually? (Yes, CI logs arrive later).
  3.  **Task Topology:** Is the question strictly binary (break/no-break) or open-ended? (Mostly binary for gating).
  4.  **Model Access:** Do we have read-access to intermediate layer activations? (Yes, internal deployment).
  5.  **Weight Access:** Do we have write-access to model weights for fine-tuning? (Yes, internal deployment).
  6.  **Training Budget:** Are we willing to spend GPU cycles training auxiliary heads? (Variable team tolerance).
  7.  **Inference Budget:** Are we willing to accept 5x latency for multiple inference passes? (Variable team tolerance).
  8.  **Error Locus:** Is the model's error in computing the answer or in expressing it? (Computational error = it doesn't know; Expression error = it knows but outputs wrong).
  9.  **Label Quality:** Are our CI logs noise-free labels for training? (No, flaky tests exist).
  10. **Deception Model:** Do we treat the model as capable of strategic lying? (Unlikely for tools, but theoretically possible).
  11. **Generalization Scope:** Must this work on unseen languages or just our stack? (Just our stack).
  12. **Safety Priority:** Do we optimize for blocking bad merges (precision) or allowing good merges (recall)? (Blocking bad merges).
  13. **Explanation Requirement:** Do we need to know *why* it breaks, or just *if*? (Just *if* for the gate).
  14. **State Stability:** Do we assume the model's internal representation of "truth" is stable across prompts? (Contested).

  ---

  #### Space Analysis: Combinations

  **Available Combinations:**
  *   **White-box + Low Training Budget + Expression Error:** Leads to probing existing activations without fine-tuning.
  *   **White-box + High Training Budget + Computational Error:** Leads to fine-tuning or reinforcement learning to fix the computation.
  *   **Black-box + High Inference Budget:** Leads to self-consistency or debate methods (multiple samples).
  *   **Any Access + Ground Truth Eventuality:** Leads to deferred verification or using CI logs as training data.

  **Empty Combinations:**
  *   **Ground Truth Timing = Now:** Incoherent. Violates the root commitment; if we had this, we wouldn't need the model.
  *   **Deception Model = Yes + Zero Inference Budget:** Unattractive. If the model lies, single-shot prompting fails, requiring multi-turn or adversarial setups.
  *   **Label Quality = Clean + Task Topology = Open-ended:** Unexplored/Mismatch. Binary probes don't map well to open-ended generation without significant reduction.
  *   **Error Locus = Expression + Safety Priority = Recall:** Unattractive. If it knows the truth but hides it, optimizing for throughput risks surfacing the hidden "no" as a "yes."

  ---

  #### Leaves: Approaches & Commitments

  **1. Prompting + External Verification**
  *   **Build:** Chain-of-thought wrapper that forces the model to cite specific CI logs before answering.
  *   **Awkward Commitment:** Assumes the model's reasoning trace is faithful to its actual computation, not just a plausible story.

  **2. Defer + Verify Later (Human-in-the-Loop)**
  *   **Build:** Async queue where the model flags "risky" patches for immediate CI, others wait.
  *   **Awkward Commitment:** Accepts that developer velocity is capped by the slowest verification path for risky code.

  **3. Supervised Probe (Linear Head)**
  *   **Build:** Train a logistic regression on layer activations using past CI pass/fail as labels.
  *   **Awkward Commitment:** Assumes past CI failures are sufficient labels to teach the probe what "future breakage" looks like in activation space.

  **4. Unsupervised Consistency Extractor**
  *   **Build:** Train a head to output the same verdict across paraphrased prompts without using CI labels.
  *   **Awkward Commitment:** Assumes internal consistency across prompts correlates with external truth, not just internal stubbornness.

  **5. Adversarial Amplification (Debate)**
  *   **Build:** Two model instances argue "breaks" vs. "safe," judge picks the winner.
  *   **Awkward Commitment:** Assumes truth wins arguments in this domain, rather than the more persuasive hallucination.

  **6. Training-Time Objective Change**
  *   **Build:** Fine-tune the model to output "I don't know" when activation confidence is low.
  *   **Awkward Commitment:** Assumes we can shape the loss landscape to reveal uncertainty without degrading base capabilities.

  **7. Mechanistic Interpretability (Circuit Reading)**
  *   **Build:** Identify and monitor the specific neural subgraph responsible for test logic.
  *   **Awkward Commitment:** Assumes the "test breakage" logic is localized to a stable circuit rather than distributed globally.

  **8. Skeptic's Option (Simulator)**
  *   **Build:** Treat the output as a sample from a distribution; average multiple runs to get probability.
  *   **Awkward Commitment:** Assumes there is no latent verdict to find, only varying degrees of simulation quality.

  **9. Model as Index for Deterministic Checker (Underexplored)**
  *   **Build:** Model selects the 10 most likely failing tests; runner executes only those.
  *   **Awkward Commitment:** Assumes partial test execution provides sufficient safety coverage to justify the engineering complexity of selective running.

  **Indistinguishable Leaves:**
  *   **Leaf 3 (Supervised Probe)** and **Leaf 8 (Skeptic)** are hard to separate empirically if the probe just learns to predict the output token via activations. If the probe accuracy matches output accuracy, you cannot tell if it found "latent truth" or just "latent output."

  ---

  #### Confidence & Dispute Calibration

  **Consensus:**
  *   Everyone agrees CI is the source of truth, but it is too slow for pre-merge gating on every commit.
  *   Everyone agrees the model currently makes mistakes that are costly to investigate.
  *   Everyone agrees we have white-box access (activations/weights) since this is an internal tool.

  **Live Disputes:**
  *   **The Latent Fact:** The ML researcher likely believes activations encode a "probability of failure" distinct from the token probability. The skeptics believe the activation state *is* the token probability distribution and nothing more.
  *   **Probe Validity:** There is no agreement that a probe performing well on historical data proves it captures "truth" rather than "correlates of past CI logs."

  **Framing Presuppositions:**
  *   Your prompt presupposes there is a "single latent fact of the matter" inside the model. This is the core philosophical contention. If the model is a simulator (Skeptic view), it simulates a developer who *might* know the answer, but the model itself holds no fact.
  *   Your prompt presupposes a probe working on yes/no benchmarks generalizes to "questions nobody can check." This is unproven.

  **Calibration on the "Unsupervised Consistency" Result:**
  *   **The Memory:** You are likely recalling results from early "Eliciting Latent Knowledge" research (e.g., Burns et al., 2022-2023 era).
  *   **The Claim:** Some papers showed consistency-based probes maintained accuracy when models were prompted to lie (e.g., "answer falsely") better than the raw output did.
  *   **The Weight:** Low for production. These results are typically on closed-domain QA (e.g., "Is this sentence true?") where truth is well-defined.
  *   **The Limit:** It does not establish that the model knows *external* reality (will this test break in our specific CI environment?). It only establishes the model has a stable internal representation that is resistant to prompt-induced persona shifts. In a CI context, "truth" depends on environment state (flaky tests, race conditions) not present in the model's weights. A consistent wrong answer is still a wrong answer.
  *   **Verdict:** Do not bet the release pipeline on this. It is a signal for research, not a guarantee of correctness for unseen code.
