answer: |-
  ### Part 1: The Axiomatic Trade-off (The Price)

  You are correct: the Board's four demands are not jointly satisfiable under standard ordinal voting rules. To satisfy them, we must step outside the ordinal framework entirely.

  **The Violation:** We are explicitly violating **Strategy-Proofness** (Gibbard-Satterthwaite) and **Budget Neutrality** (Fixed Quota).
  **The Purchase:** In exchange, we buy **Intertemporal Consistency** (Demand 1) and **Sub-panel Consistency** (Demand 2).

  **The Currency:**
  1.  **Appeals:** Minimized. By moving from *ranking* (relative to the pool) to *rating* (relative to a fixed standard), an applicant's outcome depends on their own merit, not the luck of the draw regarding who else applied. This satisfies the Board's Demand 1.
  2.  **Hours:** Increased. Cardinal scoring requires calibration. We trade 45 minutes of meeting time for "Anchor Calibration."
  3.  **Budget:** Volatile. To guarantee that a proposal better than last year's funded cutoff gets funded, the number of awards must float. If the pool is weak, we fund fewer than six. The Board must accept this risk to avoid the "A vs. B" scandal.
  4.  **Strategy:** Managed, not eliminated. Panelists can exaggerate scores (give their favorite 100 and others 0). We mitigate this via the "Calibration" step and the Chair's authority to adjust outliers.

  **The Judgment Call:** The **Funding Threshold** is not a procedural output; it is a policy input. The procedure cannot determine *how good* "good enough" is. The Board must set the score (e.g., 85/100) annually. If they refuse, the procedure defaults to "Top 10," and you must document that Demand 1 is thereby voided.

  ---

  ### Part 2: The Procedure (The Rules)

  **Foundation Grant Panel: Calibrated Threshold Protocol**

  **1. Unit of Competition**
  Proposals are assessed individually. However, prior to scoring, the Chair identifies "Clones" (proposals from the same lab with >70% methodological overlap). Clones are merged into a single "Entry" for scoring. If a merged Entry is funded, the Lab selects which proposal to execute. This prevents vote-splitting.

  **2. Calibration (Minutes 0–45)**
  Panelists do not rank. Panelists assign scores (0–100). Before scoring proposals, the Panel reviews three "Anchor Files" provided by the Board (representing *Unfundable*, *Borderline*, and *Exemplary* work from previous cycles). Panelists must align their internal scales so that an *Exemplary* file receives ~95 and a *Borderline* receives ~75. Scores deviating >10 points from the panel mean on Anchors require justification.

  **3. Scoring and Aggregation**
  Each proposal is read by three panelists. The Social Score is the arithmetic mean of the three reader scores. Sub-panels (groups of 4 panelists) may discuss scores, but the final aggregation is the mean of all available scores. This ensures Sub-panel Consistency: if Sub-panel 1 and 2 both score A > B, the aggregate will score A > B.

  **4. The Funding Threshold**
  Awards are granted to all Entries exceeding the **Fixed Threshold** set by the Board (e.g., 85/100).
  *   If fewer than six Entries clear the Threshold, fewer than six awards are made.
  *   If more than ten Entries clear the Threshold, all are funded (budget permitting; if hard capped, the Threshold is raised).
  *   *Note:* To satisfy Demand 1 (Resubmission Consistency), the Threshold should remain stable across cycles unless the Board formally declares a change in foundation standards.

  **5. Tie-Breaking and Discretion**
  If an Entry falls within 2 points of the Threshold, or if two Entries tie for the final slot, the Chair exercises a casting vote based on strategic fit. This is the only non-algorithmic step.

  **6. Reasons for Decision**
  Applicants receive their Numeric Score and the Fixed Threshold.
  *   *Funded:* "Your score of X exceeded the funding threshold of Y."
  *   *Unfunded:* "Your score of X did not meet the funding threshold of Y."
  *   *Resubmissions:* "While your score improved from the previous cycle, it did not meet the current threshold."

  ---

  ### Part 3: The Rationale (The Explanation)

  **Why this rule?**
  Standard ranking systems (e.g., Borda, Condorcet) compare proposals *against each other*. This means a proposal can be rejected simply because the pool was stronger this year than last year, even if the proposal itself improved. This triggers appeals (Demand 1).

  **Why Scores?**
  Scoring compares proposals *against a standard*. This isolates the applicant's merit from the pool's quality. This satisfies the Board's requirement that a stronger resubmission cannot lose to a weaker funded rival from a previous cycle.

  **Why Clones are Merged?**
  In ranking systems, similar proposals split the "vote," allowing a dissimilar rival to win. Merging ensures the Panel judges the *science*, not the *strategy* of the lab.

  **Why the Threshold Floats?**
  To maintain consistency (Demand 1), the bar for funding must be absolute, not relative. If the Board requires exactly 10 awards every year regardless of quality, they must waive the Resubmission Consistency rule. They cannot have both.

  **Why Strategy is Accepted?**
  No voting system is immune to strategy (Gibbard-Satterthwaite). However, score inflation is checked by the Calibration step and the requirement to justify outlier scores on Anchor Files. This is a lower risk than the scandal of vote-trading in ordinal blocs.

  ---

  ### Part 4: The Three Scenarios (Stress Test)

  #### Scenario 1: The Clean Cycle (Single-Peaked Preferences)
  *   **Input:** 8 proposals. Panelists implicitly agree on quality order (Single-Peaked).
  *   **Procedure:** Panelists assign scores. Because preferences are single-peaked, the mean scores will reproduce the majority ordering.
  *   **Outcome:** The procedure works.
  *   **Note:** You asked if we need the impossibility result here. **No.** With single-peaked preferences, Majority Rule is transitive and consistent (Black's Median Voter Theorem). However, we are *not* using Majority Rule. We are using Scores. Why? Because Majority Rule is relative (Pool-dependent). If the pool changes next cycle, the Majority Winner might change even if the proposal didn't. Scores protect against *Intertemporal* inconsistency, which Majority Rule does not.

  #### Scenario 2: The Clone Cycle (Lab A vs. Rival B)
  *   **Input:** Lab A submits Proposal A1 and A2 (90% overlap). Rival B submits Proposal B.
  *   **Chair's Bias:** Chair wants B to win.
  *   **Procedure:**
      1.  **Admin Check:** Chair identifies A1 and A2 as Clones per Rule 1. They are merged into Entry A*.
      2.  **Scoring:** Panelists score A* and B.
      3.  **Result:** Suppose Panel thinks A is better. A* gets 90, B gets 85.
      4.  **Chair's Move:** Chair cannot "split the vote" because there is only one vote for Lab A. Chair cannot bury A* without violating the Calibration anchors (unless A* is genuinely worse).
  *   **Outcome:** Clone Independence satisfied. Chair's bias is constrained by the Anchors. If Chair scores B=95 and A*=80 without justification on Anchors, the outlier check flags it.

  #### Scenario 3: The Resubmission (Applicant A vs. B)
  *   **Context:** Cycle 1: A (Score 82), B (Score 85). Threshold 80. B Funded, A Rejected.
  *   **Cycle 2:** A resubmits (Stronger). B does not resubmit.
  *   **Board Demand:** A must not be rejected if A is now "better than B was."
  *   **Procedure:**
      1.  Cycle 2 Threshold remains 80 (Stability).
      2.  A's new Score is 86.
      3.  **Outcome:** A is Funded.
      4.  **Alternative:** Suppose the pool is incredibly strong this year. The Board panics and raises Threshold to 88 to keep awards at 6.
      5.  **Outcome:** A (86) is Rejected.
      6.  **The Letter:** "Your score of 86 represents an improvement over your previous submission. However, the Foundation adjusts its funding threshold annually to align with budget and strategic priorities. This cycle, the threshold was 88."
      7.  **The Cost:** The Board must accept that if they keep the Threshold fixed (to satisfy Demand 1), they might fund 15 people or 2 people. If they fix the *Number* of awards (6-10), they violate Demand 1. **The procedure forces this choice into the open.**

  ---

  ### Part 5: Checking Your "Five Half-Remembered Things"

  1.  **Arrow & Partial Orders:** **Correct.** Arrow assumes complete orders. If input is partial but output is complete, you still face impossibility if you demand IIA. Moving to Cardinal scores bypasses this by changing the *type* of input, not just the completeness.
  2.  **Incomplete Output:** **Correct.** Unanimity rules satisfy Arrow but yield empty sets. You need a "Decisive" rule. Scoring is decisive.
  3.  **Consistency $\rightarrow$ Borda:** **Correct (Young's Theorem).** If you want Sub-panel Consistency (Reinforcement) + Anonymity + Neutrality, you *must* use a Positional Scoring Rule (like Borda). Borda fails IIA and Clone Independence. **This is why we use Calibrated Scores (Range Voting) instead of Borda.** Range Voting satisfies Consistency but allows us to set an Absolute Threshold (fixing IIA).
  4.  **Absolute Scores:** **Correct.** You cannot build an absolute score from ordinal ballots. You *must* collect grades. The cost is **Rubric Drift**. If Panelists drift on what "85" means, Intertemporal Consistency fails. **Mitigation:** The Anchor Files (Rule 2) are mandatory.
  5.  **Condorcet/Clone/No-Show:** **Correct (Moulin's Theorem).** You cannot have Condorcet Consistency + Clone Independence + Participation (No-Show). Since we prioritize Clone Independence and Consistency, we drop Condorcet (we use Scoring) and accept that Participation isn't mathematically guaranteed (though discussion mitigates it).

  ### Final Instruction to the Board

  Attach this cover note to the rules:

  > "These rules prioritize **Accountability** (Demand 1) over **Budget Predictability**.
  >
  > 1.  If you require the number of awards to be exactly 6–10 every cycle, you **must** delete Rule 4 (Fixed Threshold) and replace it with 'Top Ranked.' If you do this, you **cannot** guarantee that a stronger resubmission will win against a previous cycle's funded proposal. Appeals on this ground will be valid.
  > 2.  If you require Resubmission Consistency, you **must** allow the number of awards to fluctuate based on the Fixed Threshold.
  > 3.  The procedure cannot prevent strategic scoring entirely. It prevents strategic *ranking* and vote-trading by removing the 'vote' and replacing it with a 'calibrated measure.'
  >
  > Please initial which priority governs: [ ] Consistency [ ] Quota."

  This puts the impossibility result in their hands, in their currency, without citing a theorem.
