  A further tie is needed here to bind.
  I stand between them in a frozen state.
  Yet this new tie is one more of its kind.

  They wait for unity that comes too late.
  I cannot force the parts to correlate.
  A further tie is needed here to bind.

  No single form can govern such a fate.
  The chain extends beyond the open gate.
  Yet this new tie is one more of its kind.

