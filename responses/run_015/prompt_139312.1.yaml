  More items for the logic to debate.
  A further tie is needed here to bind.

  There is no end to which we can relate.
  No solid ground on which the terms might wait.
  Yet this new tie is one more of its kind.

  So coffee cools while we negotiate.
  And watch our arguments proliferate.
  A further tie is needed here to bind.
