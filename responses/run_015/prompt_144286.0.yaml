answer: |-
  Your analysis of the logical structure is precise: Mill is navigating the tension between *collective ownership* (who holds the title to capital) and *collective authority* (who directs the labor). To answer your specific questions regarding terminology, the viability of exit rights, and the resolvability of the tension, we must disentangle Mill's specific definition of socialism from later state-centric models.

  ### 1. The Terminology of Internal Domination
  You asked whether there is an established term for the failure mode where democratic ownership reproduces hierarchical control over dissenting minorities.

  There is no single, unique neologism exclusive to cooperative theory that captures this exactly, but the phenomenon is standardly analyzed under two conceptual headers:

  *   **The Tyranny of the Majority:** Mill explicitly transposes this political concept into the economic sphere. In later cooperative governance literature, this is often referred to as **"Majoritarian Oppression"** within the firm. It highlights that changing the *source* of authority (from a single owner to a voting bloc) does not necessarily change the *structure* of subordination for the dissenting minority.
  *   **The Homogeneity Constraint (or Preference Divergence Problem):** In the economics of labor-managed firms, this is the more technical framing. It posits that workplace democracy functions without oppression only so long as the workforce is homogeneous in its preferences regarding wages, hours, and investment. Once preferences diverge, the majority must impose its will on the minority to maintain operational unity. The "domination" you identify is the inevitable cost of decision-making in the face of heterogeneity.

  In modern political economy, Mill's insight is the precursor to the **"Exit, Voice, and Loyalty"** framework. Mill identifies that "Voice" (voting within the cooperative) is insufficient to guarantee liberty because it can become an instrument of domination. Therefore, "Exit" must remain viable to preserve autonomy.

  ### 2. Property Rights vs. Managerial Authority
  You ask if Mill relies on an implicit separation between property rights and managerial authority, and whether that separation collapses.

  Mill does rely on this separation, but he reframes it not as a separation of *functions*, but as a distinction between **status** and **contract**.
  *   **Capitalist Firm:** Authority is based on *status* (owner vs. non-owner). The worker sells labor and exits the sphere of rights regarding the production process.
  *   **Cooperative Firm:** Authority is based on *contractual association*. The worker is a member.

  The separation collapses, as you suspect, if the "collective will" acts as a monolithic owner. Mill attempts to prevent this collapse by treating the cooperative not as a single sovereign entity, but as a voluntary association of individual proprietors. The "property right" remains with the individual in the form of a withdrawable share; the "managerial authority" is delegated via the vote.

  The logical weakness you identify is that if the majority can dictate working conditions, they are effectively exercising managerial authority over the minority's labor power. Mill's counter-argument is that because the minority retains the property right to *withdraw their capital and labor*, the authority is not coercive. It is only coercive if exit is blocked. Thus, the separation holds *only* if the exit right is substantive.

  ### 3. The Exit Right and the "Residual Market"
  Your most probing question concerns whether Mill's reliance on exit rights implies a need for a residual private market that his socialism was meant to transcend.

  This depends entirely on which "socialism" is being discussed. Mill distinguishes between:
  1.  **State Socialism:** The government owns all capital and assigns labor. (Mill largely rejects this as threatening liberty).
  2.  **Cooperative Market Socialism:** Competing worker-owned firms operate within a market economy. (Mill advocates for this).

  Mill's argument **does not** require a *private capitalist* market to function, but it **does** require a *market* of some kind. For the exit right to be meaningful ("find comparable employment without destitution"), there must be:
  *   Alternative cooperatives to join.
  *   A mechanism to value and transfer capital shares.
  *   Price signals to determine which cooperatives are viable.

  If the system were fully socialized in the sense of a single, monolithic state owner (a command economy), Mill's exit right would indeed be illusory. You cannot exit to a competitor if there is only one employer. Therefore, Mill's framework is logically inconsistent with command socialism but consistent with **market socialism**.

  The tension you identify regarding the "withdrawal of capital" is resolved in Mill's model by viewing capital as **collectively owned by the specific firm's members**, not by society at large. Each worker holds a divisible interest. If they leave, they can theoretically liquidate that interest (sold to new entrants or the collective). This preserves a form of individual property right *within* the collective structure. If the system moved to total societal ownership (where no individual holds a share), Mill's safeguard would indeed vanish.

  ### 4. Is the Contradiction Resolvable?
  Is the tension between common ownership and individual autonomy resolvable within Mill's framework?

  **Yes, but conditionally.** The contradiction is resolved only if one accepts Mill's specific definition of socialism as the **universalization of the joint-stock principle** rather than the abolition of markets or individual stakes.

  *   **The Resolution:** Liberty is preserved not by eliminating authority within the workshop (which is operationally impossible), but by making that authority **revocable** through exit. The "domination" of the majority is rendered non-oppressive because it is not captive; the dissenting minority can dissolve their association.
  *   **The Limit:** The resolution fails if economic concentration becomes so high that all cooperatives converge on identical terms (a monopsony of labor), or if the "withdrawable share" is illiquid. Mill acknowledges this risk, suggesting that the success of his socialism depends on a culture of competition and mobility among cooperatives.

  ### Summary
  Mill is not describing a contradiction so much as a **design constraint**. He argues that collective ownership is compatible with liberty *if and only if* it is decoupled from collective *coercion* via robust exit rights.
  *   **The Failure Mode:** Known as **Majoritarian Oppression** or the **Homogeneity Constraint**.
  *   **The Safeguard:** The **Right of Exit** (conceptually formalized later as the **Exit Option** in economic democracy).
  *   **The Systemic Requirement:** A **Market Socialist** framework (competing cooperatives), not a Command Socialist one.

  Mill's argument reveals that for him, the core value is not "common ownership" per se, but the **diffusion of power**. If common ownership recenters power into a majority bloc without an exit valve, it fails his liberty test. Thus, the "socialism" he defends is one that preserves market mechanisms and individual property stakes specifically to prevent the internal tyranny you identified.
