answer: |-
  # Seminar Simulation: The Defence Dilemma

  **Title:** *The Mobilisation Game*
  **Time:** 90 Minutes
  **Participants:** 18 Students
  **Materials:** Index cards (pre-written), printed sheets (Budget & Threat), pens, paper clips (as counters).

  ## 1. Set-Up and Materials

  You need to prepare three packs of cards before the session.

  ### A. Citizen Cards (18 total)
  Distribute one to each student upon entry. These represent their private economic stake.
  *   **High Earners (6 cards):** *Income: £60k. Utility Loss if Conscripted: -10 points.* (Label: "Professional")
  *   **Medium Earners (6 cards):** *Income: £30k. Utility Loss if Conscripted: -5 points.* (Label: "Skilled")
  *   **Low Earners (4 cards):** *Income: £20k. Utility Loss if Conscripted: -2 points.* (Label: "Service")
  *   **Conscientious Objectors (2 cards):** *Income: £25k. Utility Loss if Conscripted: -20 points.* (Label: "Objector")

  *Note:* "Utility Loss" represents the personal cost of service (lost wages, liberty, moral distress).

  ### B. Policy Cards (Two Types)
  Print enough for the group to handle.
  *   **Volunteer Contract:** Cost: 5 Treasury Tokens per Unit. Combat Value: 3. Type: *Expeditionary*. (Represents high skill, deployable abroad, useful to allies).
  *   **Conscription Act:** Cost: 1 Treasury Token per Unit. Combat Value: 1. Type: *Territorial*. (Represents mass mobilisation, good for holding ground, useless abroad).

  ### C. The Threat Deck (10 Cards)
  This is the mechanical adversary. Do not show the students the composition of the deck initially.
  *   **5 Cards marked "Deterrence Holds":** No attack occurs.
  *   **5 Cards marked "Opportunity Taken":** Attack occurs.
  *   **Rule:** If the state chose **Conscription** in Phase 1, shuffle only the "Deterrence Holds" cards into a draw pile of 6 (5 Hold + 1 Attack). If the state chose **Volunteer**, shuffle only the "Opportunity Taken" cards into a draw pile of 6 (5 Attack + 1 Hold).
  *   *Tutor Note:* This mechanically enforces the "Signalling" concept. Pre-commitment alters the probability of conflict.

  ### D. The Budget Board
  Draw on the whiteboard or project a slide.
  *   **Treasury Pool:** Starts at 40 Tokens.
  *   **National Survival Threshold:** Must maintain 10 Combat Value in Phase 3 or the state collapses (Everyone gets 0 Utility).
  *   **Individual Goal:** Maximise your personal Utility Points (Start at 20, subtract Utility Loss if conscripted, subtract 5 if state collapses).

  ---

  ## 2. Rules and Payoff Scheme

  **The Core Tension:**
  *   **Treasury Tokens** are shared. If the pool empties, the state bankrupts (Everyone loses 10 Utility).
  *   **Utility Points** are private. You want to keep yours high.
  *   **Conscription** saves Treasury Tokens but deducts Utility Points from specific individuals (based on their Citizen Card).
  *   **Volunteers** cost Treasury Tokens but deduct no Utility Points (the state pays the market rate).

  **Combat Mechanics:**
  *   **Territorial Denial:** Requires *Volume*. You need 10 Units of *Territorial* value to stop an invasion. *Expeditionary* units count as 0 for defence (they are abroad/with allies).
  *   **Expeditionary Value:** Useful for alliances. If you have 5 *Expeditionary* units, you gain 5 Treasury Tokens in Phase 1 (Allied Subsidy).

  **The Phases:**
  1.  **Peace (Rounds 1-2):** Choose force structure. Budget is tight. Temptation to cut costs.
  2.  **Crisis (Round 3):** Threat Deck is drawn. If Attack occurs, you must meet Defence Threshold immediately.
  3.  **Conflict (Round 4):** Attrition. You lose 2 Units per round. You must replace them.

  ---

  ## 3. Minute-by-Minute Timeline

  **00:00 – 00:10: Induction**
  *   Seat students in a horseshoe.
  *   Hand out **Citizen Cards**. Tell them: *"Keep this private. This is your income and your personal cost of service. Do not show it to others yet."*
  *   Explain the Treasury Pool (40 Tokens) and the Goal: Survive Phase 4 with positive Utility.
  *   Appoint one student as **Chancellor** (manages Treasury Tokens) and one as **Intelligence Chair** (manages the Threat Deck). You (the tutor) observe only.

  **00:10 – 00:30: Phase 1 (The Peace Dividend)**
  *   **Task:** Allocate budget for Year 1 and Year 2.
  *   **Mechanic:** They must buy Units.
      *   Option A: Buy Volunteers (Expeditionary). Cost 5T each. Gain Allied Subsidy if 5+ bought.
      *   Option B: Buy Conscripts (Territorial). Cost 1T each. No Subsidy.
      *   Option C: Mix.
  *   **The Catch:** If they buy Conscripts, they must draft specific students. Ask for volunteers first. If insufficient, the Chancellor must点名 (call out) students based on a list. Those drafted reveal their Citizen Card and lose Utility immediately.
  *   **Outcome:** Most groups will buy Volunteers to save personal Utility and gain Allied Subsidy. They will under-invest in Territorial units because the threat is abstract.

  **00:30 – 00:50: Phase 2 (The Crisis)**
  *   **Reveal:** Project "Threat Level Elevated".
  *   **Mechanic:** Intelligence Chair draws from the Threat Deck.
      *   *Crucial:* The composition of the deck depends on their Phase 1 choice (see Materials Section C). If they chose mostly Volunteers, the deck is stacked towards Attack. If Conscripts, stacked towards Peace.
      *   *Do not explain the deck composition yet.* Let them see the result.
  *   **If Attack Drawn:** They must immediately reach 10 Territorial Combat Value.
      *   If they have Volunteers: They count for 0 Defence. They must rush-buy Conscripts *now*.
      *   **The Lag:** Rush-buying Conscripts costs double Treasury Tokens (Emergency Premium).
      *   **The Draft:** They must draft students *now*. High earners will resist. Vote on who goes. This exposes the class conflict.
  *   **If Peace Drawn:** They breathe a sigh of relief. Temptation to cut the force again to save Treasury.

  **00:50 – 01:10: Phase 3 (The Long War)**
  *   **Scenario:** Invasion has begun (or is imminent).
  *   **Mechanic:** Attrition. Remove 2 Units from the board every 5 minutes.
  *   **Task:** Replace losses.
  *   **The Depth Problem:**
      *   Volunteer pool is exhausted (Budget cannot sustain high cost + emergency premium).
      *   Conscript pool requires drafting more people.
      *   **Objectors:** If an Objector card is drafted, they refuse. The unit is not formed. Treasury is wasted.
      *   **Collapse:** If Combat Value drops below 10, the state collapses. All Utility scores become zero.
  *   **End State:** Tally scores.

  **01:10 – 01:30: Debrief**
  *   Map the gameplay to the four theoretical strands (see below).

  ---

  ## 4. Debrief Guide: Mapping Play to Theory

  Do not lecture. Ask questions that force them to articulate the mechanics they just felt.

  **1. Fiscal Cost vs. Opportunity Cost**
  *   *Ask:* "In Phase 1, why did you prefer Volunteers?" (Answer: Saved Treasury via subsidies, saved personal Utility).
  *   *Ask:* "Who lost the most Utility points?" (High earners/Objectors).
  *   *Point:* "You saw that Volunteers look cheap on the Treasury ledger but expensive in the labour market. Conscription looked cheap on the ledger but the cost was hidden in the Utility loss of specific citizens. The 'cheapness' of conscription is an accounting illusion; the cost is just borne privately."

  **2. Mobilisation Lag**
  *   *Ask:* "When the Attack card came up in Phase 2, how easy was it to switch to Conscripts?" (Answer: Hard, double cost, panic).
  *   *Point:* "You couldn't build the reserve the moment you saw the threat. The capability had to exist *before* the card was drawn. That lag is the strategic vulnerability of the volunteer model."

  **3. Replacement Depth**
  *   *Ask:* "In Phase 3, when you lost units, could you replace them?" (Answer: Ran out of money/people).
  *   *Point:* "A professional force is efficient per soldier, but brittle. A conscript force is inefficient per soldier but elastic. In a long war of attrition, elasticity matters more than efficiency."

  **4. Signalling and Pre-commitment**
  *   *Ask:* "Intelligence Chair, what was in the deck?" (Reveal the rigging).
  *   *Ask:* "Did you know the deck was rigged?" (No).
  *   *Point:* "The adversary didn't care about your intentions; they cared about your *capability to resist*. By choosing Volunteers in Phase 1, you signalled that resistance would be costly and slow. That increased the probability of attack. Conscription is not just about fighting; it is a signal that binds you to fight, which discourages the attack in the first place."

  ---

  ## 5. Honest Assessment: Limitations and Gaming

  ### What Will Predictably Go Wrong
  1.  **The "Chancellor" Dictatorship:** One vocal student may dominate the Treasury decisions.
      *   *Mitigation:* Insist on a vote for every expenditure over 5 Tokens.
  2.  **Gaming the Threat Deck:** Bright students may ask the Intelligence Chair, "How many cards are left?" or "Can I see the discard pile?"
      *   *Mitigation:* Instruct the Chair to shuffle after every draw if asked, or simply rule that "Intelligence is imperfect."
  3.  **The "Objector" Veto:** If the two Objectors refuse to serve in Phase 2, the group may turn on them aggressively.
      *   *Mitigation:* Intervene if it becomes personal. Remind them this is a simulation of *structural* conflict, not interpersonal bullying.
  4.  **Maths over Morals:** They may treat the Utility Points as a pure score to be maximised, ignoring the moral weight of the "Conscription" mechanic.
      *   *Mitigation:* In the debrief, ask: "Did anyone feel it was *unfair* that the High Earners were exempted while the Low Earners were drafted?"

  ### What The Simulation Cannot Reproduce
  You must explicitly state these limitations in the final five minutes. The simulation is a model, not reality.

  1.  **The Time Horizon:** The game lasts 90 minutes. Real institutional decay takes 20 years. They cannot feel the generational forgetting of military skills, only the immediate budget cycle.
  2.  **Genuine Uncertainty:** In the game, the Threat Deck is probabilistic. In reality, adversaries have agency, politics, and internal constraints we cannot model with cards.
  3.  **The Moral Remainder:** This is the most important omission. In the game, coercing a student costs "5 Utility Points". In reality, coercing a citizen to kill or die leaves a moral scar on the polity that no points system can capture. The simulation justifies coercion via aggregate survival (Utilitarianism). It cannot reproduce the Deontological objection that some rights should not be traded for security.
  4.  **The "Citizen-Soldier" Identity:** The game treats service as a cost. It does not capture the potential civic integration or social cohesion benefits of shared service, nor the potential for militarism.

  ### Closing Instruction to Tutor
  When you run this, do not explain the "Signalling" mechanic (the rigged deck) until the debrief. Let them feel the frustration of the Crisis Phase first. If they ask why the attack happened, say only: *"The adversary acts on opportunity. You decide what opportunity looks like."*
