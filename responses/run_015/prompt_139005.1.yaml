      *   **The Signalling/Pre-commitment:** This is the hardest part to gamify. The Adversary needs to attack *more* if the state looks weak/uncommitted (Volunteer/Low Spend) and *less* if the state looks committed (Conscription/High Mobilisation). The students need to feel that cutting costs *now* invites attack *later*.
