answer: |-
  **Methods Section Draft: Scoring and Evaluation Philosophy**

  **1. The Category Error of Single-Label Scoring**
  The standard practice in symbolic reasoning benchmarks treats analogy items as logical deductions within a fixed axiom system. Under this assumption, the microworld (the alphabet, the strings, the transformation rules) is fully specified *ex ante*, and the task is to derive the unique necessary conclusion. We argue that this is a category error regarding the nature of letter-string analogy. The microworld is not a fixed grid; it is an under-specified semantic space where the "rules" are not given but *constructed* by the solver through acts of conceptual slippage.

  Consider the item `abc:abd :: xyz:?`. A single-label approach forces the benchmark designer to declare one interpretation of the alphabet as objective fact. If the gold label is `xya`, the alphabet is declared cyclic. If the label is `xyd`, the rule is declared to be "repeat the specific letter changed in the source" rather than "apply the successor function." If the label is "no answer," the alphabet is declared linear and bounded. None of these properties inheres in the string `xyz` itself. They are properties of the *conceptual stance* taken toward the string.

  In the Copycat microworld, "successor," "same," and "group" are fluid concepts. A model that outputs `xyd` has not failed logic; it has prioritized object-level sameness over role-level succession. A model that outputs `xya` has prioritized structural continuity over boundary constraints. To score `xyd` as simply "wrong" is to assert that one specific configuration of the microworld (e.g., linear alphabet, role-based mapping) is the *only* valid reality. This measures the model's ability to guess the benchmark author's specific conceptual biases, not its analogical reasoning capacity. Therefore, correctness cannot be a binary property of the output string; it must be a measure of how well the model's distribution over possible outputs aligns with the distribution of plausible conceptual stances taken by human reasoners.

  We propose **Conceptual Resonance Scoring (CRS)**. Under CRS, an item is not associated with a gold label, but with a target probability distribution derived from human normative data. A model is scored on the divergence (e.g., Jensen-Shannon divergence) between its output distribution and the human distribution.

  **2. Addressing the Relativism Objection**
  A common objection to CRS is that it renders correctness relative to the population sampled: if the human distribution shifts, the "correct" answer changes. This is framed as a *reductio ad absurdum*, implying that truth cannot depend on demographic variance.

  This objection conflates *ontological truth* with *modeling fidelity*. We are not building a benchmark to test mathematical truth conditions; we are testing cognitive modeling. Consider color perception: if we build a vision system to categorize colors like humans, and we train it on a spectrum where humans distinguish "blue" from "green" at 495nm, the system is "correct" only if it respects that boundary. If we test it against a wavelength spectrum where 495nm is objectively just a frequency, the system fails the *human* task.

  Similarly, analogical reasoning is a cognitive process, not a logical derivation. The "ground truth" for a cognitive benchmark is the cognitive behavior of the reference class (humans). If the human population shifts its conceptual preferences (e.g., due to cultural changes in how the alphabet is taught), the benchmark target *should* shift. To hold the target fixed while the population moves is to measure the model's ability to match a static artifact, not its ability to reason like a human. CRS does not claim that `xya` is "truer" than `xyd`; it claims that `xya` is *more resonant* with the human conceptual landscape for this specific item. The benchmark measures resonance, not truth.

  **3. Unanimity as a Prediction, Not a Boundary**
  Critics argue that CRS collapses into exact-match scoring on "easy" items (e.g., `abc:abd :: ijk:?`), where human unanimity is near 100% for `ijl`. If the distribution is a spike, does the theory add anything?

  We argue that unanimity is not an exception to the theory, but a specific prediction of it. In the landscape of conceptual slippages, some items present a "deep basin" where one mapping is overwhelmingly salient and competing mappings are cognitively expensive or blocked. `abc:abd :: ijk:?` has high structural symmetry and no boundary friction; the "successor" slip is the path of least resistance. The distribution concentrates not because the item is logically unique, but because the conceptual pressure is uniform.

  CRS becomes critical precisely where the landscape is rugged. To make this operational, we must design items where the structural features predict diffusion *in advance*, rather than discovering it post-hoc. We identify two structural features that predict a diffuse human distribution (and thus where CRS diverges from exact-match):

  1.  **Boundary Friction:** Items that push against the limits of the microworld definitions.
      *   *Example:* `xyz` (end of alphabet) or `aa` (start of double-letter grouping).
      *   *Prediction:* High variance. Solvers must decide if the boundary is hard (stop), soft (wrap), or irrelevant (ignore).
  2.  **Description Competition:** Items where two distinct descriptions of the source string have roughly equal salience.
      *   *Example:* `mrrjjj`. This can be described as a sequence of letters (`m`, `r`, `j`) or a sequence of group lengths (`1`, `2`, `3`).
      *   *Prediction:* High variance between `mrrkkk` (letter successor) and `mrrjjjj` (length successor).

  By contrast, an item like `abc:abd :: ijk` lacks boundary friction and lacks description competition (grouping is trivial, boundaries are distant). CRS predicts a sharp distribution here. Thus, CRS does not fail on easy items; it correctly predicts that the "conceptual temperature" is low, resulting in a frozen state. The scoring rule remains the same (distribution matching), but the target distribution happens to be a delta function.

  **4. The Effect of Two-Source Items**
  Finally, regarding the proposal to use two-source items (e.g., providing both `abc→abd` and `abc→bcd` before asking about `mrrjjj`): On our account, this should **sharpen** the distribution, not blur it.

  Single-source items leave the rule under-constrained. `abc→abd` could be "change last letter to d" or "successor of last letter." `abc→bcd` could be "shift string" or "successor of all letters." When only one is given, the solver's choice of slippage is wide open, leading to diffusion.

  When two sources are provided, the solver must find a single abstract rule that satisfies *both* transformations. This acts as a constraint satisfaction problem on the conceptual level. It eliminates interpretations that work for one source but not the other (e.g., "change to d" fails on the second source). This reduces the viable conceptual neighborhood, forcing the probability mass into a narrower basin of attraction.

  Therefore, two-source items are not just "harder"; they are *structurally different*. They measure the model's ability to integrate constraints to resolve slippage ambiguity. Under CRS, we expect the human distribution on two-source items to have lower entropy than on single-source items. A model that fails to sharpen its distribution in the two-source condition (i.e., remains as diffuse as in the single-source condition) demonstrates a specific failure of constraint integration, which exact-match scoring would miss entirely.

  **Summary of Proposed Item Set for Validation**
  To validate CRS against exact-match, we propose a minimal triplet set:
  1.  **Deep Basin (Control):** `abc:abd :: ijk:?` (Predicts: Sharp human distribution, CRS ≈ Exact Match).
  2.  **Boundary Friction:** `abc:abd :: xyz:?` (Predicts: Diffuse human distribution `xya`/`xyd`/`none`, CRS > Exact Match).
  3.  **Description Competition:** `aabbcc:aabbdd :: mmrrjjj:?` (Predicts: Diffuse human distribution `mmrrkkk`/`mmrrjjjj`, CRS > Exact Match).

  This design allows us to demonstrate that CRS captures reasoning fidelity in cases where exact-match scoring treats valid alternative reasoning paths as errors.
