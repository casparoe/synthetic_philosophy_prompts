      *   **Section 2: The Space for Contingency (Agency):**
          *   *Madame Defarge:* She is the bridge. She represents the structural *and* the personal. Her knitting is a record, but her motivation is the rape of her sister. This is where "class struggle" becomes "blood feud."
          *   *Sydney Carton:* The ultimate contingency. The system demands a death (Darnay). Carton *chooses* to substitute. This breaks the "eye for an eye" logic. It's Christian redemption, not political solution.
          *   *London vs. Paris:* London is chaotic but lawful; Paris is lawful (in a twisted way) but chaotic. The parallel suggests human nature is the constant, but systems vary.

      *   **Section 3: Coherence vs. Muddling (The Critical Pivot):**
          *   *The Tension:* Does Carton's sacrifice solve the political problem? No. It saves *him* and *Lucie's family*, but France remains in the Terror.
