answer: |-
  The thought experiment of Rex Secundus is a formidable challenge that strikes at the heart of the Hart-Fuller debate, specifically targeting the limits of Fuller's "procedural natural law." To engage this on its own terms, we must distinguish between Fuller's claim that law *must* be moral in its substance versus his claim that law *must* be moral in its making.

  **1. The Scope of Fuller's Internal Morality**
  Your argument rests on the premise that if Fuller's "internal morality" is genuinely moral, it must preclude substantively evil outcomes like slavery. However, this misinterprets Fuller's specific claim. Fuller explicitly distinguishes between the "morality of duty" (substantive justice) and the "morality of aspiration" (procedural excellence). He never argues that satisfying the eight desiderata guarantees a just society; rather, he argues that these desiderata are necessary conditions for the *existence* of law as a distinctive human enterprise. For Fuller, law is the "enterprise of subjecting human conduct to the governance of rules." If a ruler fails the eight principles, they are not making bad law; they are failing to make law at all. However, if they succeed (like Rex Secundus), they have successfully made law, even if that law is wicked. Fuller admits that a slave state can maintain legality, but he argues it is inherently unstable because the substantive evil tends to corrode the procedural requirements (e.g., officials must be given arbitrary power to enforce slavery, violating congruence and clarity).

  **2. Assessment of Rex Secundus**
  Rex Secundus does not undermine Fuller's position because Fuller does not claim procedural morality is a *sufficient* condition for substantive justice, only a *necessary* condition for legal validity. Fuller's thesis is that there is a "necessary connection" between law and morality, not an identity. Rex Secundus demonstrates that the connection is not logical entailment (procedural perfection does not logically forbid slavery), but Fuller would argue it is a functional affinity. In *The Morality of Law*, Fuller suggests that it is difficult to maintain the eight principles while pursuing grossly iniquitous ends because oppression requires secrecy and discretion that violate promulgation and congruence. Therefore, Rex Secundus is a theoretical possibility that Fuller acknowledges, but he would argue it is a practical improbability that tends toward collapse into the arbitrariness of King Rex (the first).

  **3. Hart's Separation Thesis and the Debate's Status**
  Does this collapse Fuller into Hart? No. Hart's separation thesis posits that the *existence* of law is one thing, its *merit* another. Hart would agree with Fuller that Rex Secundus creates valid law. The divergence arises with King Rex (the original). If a sovereign issues secret, retroactive commands, Hart might still classify them as law (provided they pass the Rule of Recognition), whereas Fuller insists they are not law at all. Therefore, the debate is not merely terminological. It is a substantive disagreement about the *criteria of existence*. Hart views law as a system of primary and secondary rules grounded in social fact; Fuller views law as a purposive activity grounded in procedural morality. The fact that they converge on the classification of a *successful* evil regime (Rex Secundus) does not erase their divergence on a *failed* regime (King Rex). The debate remains alive because it concerns whether procedural morality is constitutive of law's nature (Fuller) or merely instrumental to its efficiency (Hart).

