answer: |-
  Here is the brainstorming list of candidate accounts, followed by the elimination, the commitment, and the argument.

  **Candidate Accounts**

  1.  **Radical Presentism:** The will at the moment of action is sovereign. Past commitments are merely information, never binding.
  2.  **Hard Paternalism:** The state or institution knows the agent's true good better than the agent does and overrides wills accordingly.
  3.  **Multiple Selves Conflict:** Temporal selves are distinct agents; institutions arbitrarily pick sides based on efficiency.
  4.  **Contractual Sanctity:** A promise is a promise; revocations are exceptions granted only where transaction costs are low.
  5.  **Capacity-Based Incapacity:** Bindings are only valid if the present self is currently legally incompetent (e.g., intoxicated, adjudicated insane).
  6.  **Reflective Sovereignty with Bodily Inalienability:** The will formed under high-deliberative conditions (reflective) governs external constraints, but the will embodied at the moment of physical intrusion (executive) retains a veto over bodily integrity and forced labor.

  **Elimination**

  I am junking 1, 2, 3, 4, and 5.
  *   **Radical Presentism** fails immediately on Case One (self-exclusion) and Case Four (commitment devices). If the present will were sovereign, casinos would let you back in the moment you asked, and gym contracts couldn't penalize skipping.
  *   **Hard Paternalism** fails on Case Two (medical consent). If the institution knew best, they would proceed with the surgery despite last-minute withdrawal, assuming the surgery is medically indicated. They don't.
  *   **Multiple Selves Conflict** fails to explain the *pattern* of the picking. It's not arbitrary that the past self wins in gambling but the present self wins in surgery. There is a principled distinction here, not just a welfare calculation.
  *   **Contractual Sanctity** fails on Case Three (cooling-off). If a signature were binding simply because it was a signature, cooling-off periods would be breach of contract. They are not; they acknowledge that some signatures are defective.
  *   **Capacity-Based Incapacity** fails on Case One. You can be turned away from a casino while sober, calm, and articulate. The bar remains not because you are currently incapacitated, but because you are *susceptible* to future incapacity. The institution treats the request to return as evidence of the susceptibility, not evidence of restored capacity.

  **The Committed Account: Reflective Sovereignty with Bodily Inalienability**

  Here is the theory that makes sense of the package. It rests on a distinction between two modes of agency: the **Deliberative Mode** (cool, planning, valuing long-term welfare) and the **Executive Mode** (hot, acting, experiencing immediate physical states).

  The theory holds that the Deliberative Mode has authority over external constraints and resources, but the Executive Mode has absolute authority over bodily integrity and forced labor. Weakness of will is understood not as a change in fundamental values, but as a temporary hijacking of the Executive Mode by impulse or pressure, which degrades the quality of deliberation without destroying agency entirely. Therefore, institutions are designed to protect the Deliberative Mode from the Executive Mode regarding external access (gambling, spending), but must protect the Executive Mode from the Deliberative Mode regarding physical coercion (surgery, labor).

  **Application to the Cases**

  **Case One (Gambling Self-Exclusion):** When you sign the self-exclusion form, you are in the Deliberative Mode. You are setting a constraint on your future access to an external resource (the casino). When you return three weeks later, even if sober, the institution assumes you are acting under the influence of the addictive disposition you sought to block. They privilege the past Deliberative self over the present Executive self because the present request is treated as a symptom of the very weakness the barrier was designed to stop. The authority lies with the reflective plan, not the immediate urge.

  **Case Two (Medical Consent):** Here, the constraint is not on external access but on bodily integrity. Even if your past Deliberative self signed the forms, the present Executive self holds the veto. Why? Because bodily intrusion is irreversible and fundamental to agency itself. To allow a past signature to override a present "stop" would be to treat the body as a resource owned by the past plan, rather than the vessel of the present agent. The Deliberative Mode can plan a surgery, but only the Executive Mode can authorize the cut.

  **Case Three (Cooling-off):** This is a procedural fix for degraded deliberation. Doorstep selling and timeshares are contexts known to induce high-pressure states that mimic weakness of will (arousal, fatigue, social pressure). The law assumes the signature was given in a compromised Executive Mode. The cooling-off period is a state-mandated return to the Deliberative Mode. In a shop, the assumption is that deliberation was normal, so the signature stands. The theory explains the difference: it's not about the contract type, but the *conditions of formation*.

  **Case Four (Enforcement Asymmetry):** This is the crux. Institutions enforce omissions (don't gamble) and penalties (pay money), but never specific performance of action (go to the gym, work the job). This is principled, not just legal cost-saving. Enforcing an omission restricts liberty but leaves the agent in the default state of rest. Enforcing an action commands the agent's life force and labor. To enforce a promise to act is to treat the agent as a tool of their past self—a form of temporal slavery. The Ulysses clause in psychiatry is the exception that proves the rule: it is allowed only when the Executive Mode is deemed medically compromised (mania), effectively reclassifying the present self as incapacitated, similar to the gambling addict.

  **Consistency and The Line**

  The package is consistent. The line between Case One (past wins) and Case Two (present wins) is **Bodily Integrity vs. External Access**. When the consequence is external (money, access), the reflective past governs to protect long-term welfare. When the consequence is internal/physical (scalpel, detention), the present embodied self governs to protect autonomy.

  This is not rationalization; it is a coherent view of the person as a temporal entity with a veto right over their own physical usage. The asymmetry in Case Four confirms this. Auto-enrolment and defaults do not break the pattern because they preserve the opt-out. They change the friction of the choice, not the authority structure. You can still say "no." Specific performance removes the "no." That is why it is unavailable as a cure for weakness: you cannot cure a failure of will by destroying the capacity to will otherwise.

  **Alternative Theories and Concrete Losses**

  If we dropped this theory for **(a) Full Sovereignty of the Present Will**:
  We would have to abolish self-exclusion regimes. A gambler could walk in, demand entry, and must be let in. We would lose the ability to protect people from known, predictable self-destruction. Concretely, we would see higher rates of bankruptcy and addiction-related harm because the "cool" self would have no mechanism to bind the "hot" self.

  If we dropped it for **(b) Temporal Neutrality (All Selves Equal)**:
  We would have to enforce specific performance. If the past self valued the gym attendance enough to sign a contract, and the future self values skipping, a neutral view might enforce the contract to maximize overall welfare. Concretely, we would lose the protection against involuntary servitude. We would allow people to contract themselves into labor or medical procedures against their present will, turning citizens into assets that can be managed by their own past signatures. We would lose the right to change our minds about our own bodies.

  **Confidence and Defeater**

  I am roughly 75% confident in this account. It fits the legal and institutional landscape better than any competing theory of agency I know.

  The single consideration that would most quickly move me off this view is the development of **reversible, low-cost enforcement of action that demonstrably improves welfare without psychological backlash.** If we could show that mechanically forcing someone to attend therapy or the gym (e.g., via mild, revocable constraints) consistently produced better life outcomes than penalty-based systems, *and* did not produce feelings of violation or loss of agency, the principle of "Bodily Inalienability" would look like a superstition rather than a moral boundary. If the "temporal slavery" objection turns out to be empirically false—that people *want* to be forced to act and feel more autonomous for it—then the asymmetry in Case Four collapses, and this theory dies with it.
