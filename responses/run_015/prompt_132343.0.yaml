      *   *Applying to the List:* Walk through the examples quickly to show fit.
      *   *The "Drop":* Point out the Delivery Drivers (Secondary Boycott) are ethically weaker. Point out the Engineers (Defense) are political, not labor.
      *   *The Resident:* This is the crux. Differentiate between "withholding labor" and "withholding care." If the strike plan ensures care, the "scab" label is pressure tactics. If not, the resident has a higher duty.
