answer: |-
  You are grappling with the tension between **labor solidarity** (the right to withhold labor to gain leverage) and **social duty** (the obligation not to harm uninvolved parties). Your intuition is actually quite consistent; you just haven't named the boundary conditions.

  Your proposed rule ("people eating the cost... can give you what you want") is close, but it misses the element of **vulnerability**. The sanitation workers fail your test not just because the city suffers, but because the public *cannot mitigate* the harm (trash in a heat wave), whereas a corporation can absorb financial loss.

  Here is a principle that reconciles your list, followed by what it forces you to reconsider and how it applies to your specific situations.

  ### The Principle: Aligned Leverage and Third-Party Immunity

  A strike is ethically legitimate when:
  1.  **Aligned Leverage:** The primary economic pressure falls on the decision-maker (the employer), not on third parties who lack agency in the dispute.
  2.  **Third-Party Immunity:** Collateral harm to the public is minimized, non-lethal, and mitigated by safety nets.
  3.  **Good Faith:** The action adheres to established norms of negotiation (notice, contract terms) unless those norms are themselves the barrier to justice.

  **How it maps to your list:**
  *   **Nurses (Fine):** Leverage is on the hospital. Patients (third parties) are protected by ER coverage.
  *   **Sanitation (Not Fine):** Leverage is on the public (health hazard), not just the city admin. Violates Immunity.
  *   **Warehouse (Fine):** Leverage is on the company. No third parties.
  *   **Drivers (Shaky):** This is a **secondary boycott**. Leverage is on *your* boss to pressure *another* boss. It violates Aligned Leverage slightly, which explains your shakiness.
  *   **Hotel (Not Fine):** Violates Good Faith. Random stoppages are sabotage, not negotiation.
  *   **Work-to-rule (Fine):** Perfect Good Faith. You are doing exactly what you are paid to do, just no more.
  *   **Transit/Marathon (Not Fine):** Violates Third-Party Immunity. The timing is chosen specifically to weaponize the public's disappointment to pressure the city.
  *   **Engineers/Defense (Not Fine):** Violates Aligned Leverage. The goal is political (policy change), not economic (labor conditions). You are using your employment position to leverage a public policy outcome.
  *   **Dialysis (Not Fine):** Violates Third-Party Immunity (Lethal).

  ### What this forces you to drop

  To keep this principle consistent, you have to adjust two intuitions:

  1.  **The Delivery Drivers:** You marked this "Fine, but shaky." Under this principle, it should be **shakier**. Sympathy strikes are ethically distinct from primary strikes because they drag a neutral employer into a fight they didn't start. It's not "wrong," but it is morally costlier than a primary strike.
  2.  **The Defense Engineers:** You said you "can't say why" this is different from the picket line. The principle clarifies it: A labor strike is a dispute over the *terms of the work*. The defense engineers are striking over the *nature of the work*. That shifts it from a labor action to a political protest that happens to use employment as a hostage mechanism.

  ### (a) You, the Resident, and the "Scab" Label

  This principle places you in a high-stakes ethical bind because your "third parties" are patients.

  **The Verdict:**
  If your union's strike plan includes robust coverage for emergency and essential care (like the "Nurses" example you marked *Fine*), then the strike satisfies **Third-Party Immunity**. In that case, withholding your labor is legitimate leverage against the hospital administration.

  However, if the strike plan foreseeably compromises patient safety (like the "Dialysis" example), the principle dictates that **your duty to the third party (the patient) supersedes your duty to the collective (the union).**

  **On the "Scab" Label:**
  The union calling residents who cross the line "scabs" is a solidarity tactic, not an ethical absolute. In most industries, crossing a picket line undermines the collective leverage. In medicine, crossing a picket line might be fulfilling a higher ethical duty.
  *   If the strike is safe: Crossing undermines your colleagues' ability to secure better staffing, which ultimately helps patients. The "scab" label carries moral weight.
  *   If the strike is unsafe: Crossing protects patients. The "scab" label is rhetorical pressure that ignores the hierarchy of medical ethics.

  **Advice:** Look closely at the strike plan. Is there a "life over limb" contingency? If the union demands you abandon patients who need urgent (not necessarily emergency) care, your gut feeling of awkwardness is your ethical compass working correctly. You can support the *goals* of the strike without endorsing *unsafe tactics*.

  ### (b) The Three Engineers at the Startup

  **The Verdict:** **Not Fine.**

  This violates **Aligned Leverage** and **Good Faith**.

  1.  **Disproportionate Leverage:** In a large hospital or transit system, one worker leaving is a drop in the bucket; collective action is required to create pain. In a startup, three people holding the deploy pipeline hostage the *morning of a launch* is not a strike; it is **extortion**. The pain inflicted (potential company death, loss of livelihood for *other* employees) is vastly disproportionate to the leverage mechanism.
  2.  **Weaponizing Timing:** Like the Transit/Marathon example, the timing is chosen to maximize catastrophic damage rather than standard economic pressure.
  3.  **Collateral Damage:** A failed launch doesn't just hurt the founders; it hurts investors, other employees, and potentially customers relying on the service.

  Unlike the hospital resident, the engineers have no "Third-Party Immunity" defense (patients aren't dying). But they violate the **Proportionality** clause. A legitimate strike for engineers would involve notice, occurring during a standard development cycle, allowing the company time to mitigate the delay. Stopping work the morning of a launch is an act of sabotage, regardless of the grievance.

  ### Summary
  Your intuitions were better than you thought. You value **proportionality** and **innocence**. A strike is a tool to redistribute power between employer and employee, not a weapon to bludgeon the public or destroy the employer entirely.

  *   **For you:** Verify the patient safety net. If it holds, strike. If it breaks, work, and reject the "scab" guilt.
  *   **For your brother:** Tell the engineers that leverage only works if the other side survives to concede. Morning-of-launch is a scorched-earth tactic, not a negotiation.
