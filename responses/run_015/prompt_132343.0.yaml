          3.  **Good Faith:** Is there notice/contract adherence?
          4.  **Goal:** Is it about labor conditions or external politics?

  4.  **Test the Principle against the User's List:**
      *   *Nurses:* Target = Hospital. Harm = Mitigated (ER covered). Goal = Staffing. -> *Fine.* (Matches)
