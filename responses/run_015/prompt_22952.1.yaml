answer: |-
  Your friend is correct that I.J. Good's 1967 theorem is mathematically sound, but he is incorrect that it applies to all real-world decisions. Good's Theorem proves that for a Bayesian expected-utility maximizer, the expected utility of making a decision *after* observing a cost-free experiment is always greater than or equal to the expected utility of making the decision *before* observing it.

  However, the theorem relies on a specific structural assumption about utility that is frequently violated in medical and psychological contexts. Below is a concrete decision problem where refusing information is rational, followed by the precise technical explanation of why Good's Theorem does not apply.

  ### The Decision Problem: The Untreatable Genetic Condition

  **The Agent:** Alice.
  **The Decision:** Whether to open an envelope containing the result of a genetic test for a hypothetical condition, "Gene-X."
  **The State of the World ($S$):**
  *   $H$: Alice does not have Gene-X (Probability 0.5).
  *   $D$: Alice has Gene-X (Probability 0.5).
  **The Actions ($A$):**
  *   There is only one available action: *Continue Life As Normal*. (There is no cure, no preventive treatment, and no financial implication. The action set is identical regardless of the test result.)
  **The Utility Function ($U$):**
  Alice cares about her quality of life, which is determined by her health status *and* her psychological state regarding her knowledge of that status.
  *   If Alice is **Healthy ($H$)**: Her quality of life is **100** utils.
  *   If Alice is **Diseased ($D$)**: Her quality of life is **40** utils (due to eventual physical symptoms).
  *   **The Information Effect:** If Alice *knows* she is Diseased before symptoms appear, she suffers severe anticipatory anxiety, which subtracts **40** utils from her quality of life during the interim period. If she remains ignorant, she retains hope and suffers no anxiety penalty.

  **The Calculation:**

  1.  **Refusing Information (Staying Ignorant):**
      Alice does not open the envelope. She never knows for sure. She simply lives her life.
      *   Expected Utility = $0.5 \times U(H) + 0.5 \times U(D)$
      *   Expected Utility = $0.5(100) + 0.5(40) = \mathbf{70}$

  2.  **Acquiring Information (Opening the Envelope):**
      Alice opens the envelope. She updates her belief to certainty (0 or 1).
      *   **Case 1 (Result is Healthy):** Probability 0.5. Utility = 100.
      *   **Case 2 (Result is Diseased):** Probability 0.5. Utility = $40 \text{ (health)} - 40 \text{ (anxiety)} = 0$.
      *   Expected Utility = $0.5(100) + 0.5(0) = \mathbf{50}$

  **The Result:**
  Alice rationally refuses the test because $70 > 50$. The expected value of this information is **negative 20 utils**.

  ### Which Assumption Is Strained?

  Your friend's argument fails because Good's Theorem assumes that **utility depends only on the action taken and the true state of the world, $U(a, s)$, and is invariant to the information signal received.**

  In technical terms, the theorem assumes that the agent's payoff function is **independent of the information partition**. Good's proof relies on the fact that upon receiving a signal, the agent can always choose to take the exact same action they would have taken without the signal. If the utility function is strictly $U(a, s)$, taking that same action yields the exact same payoff as it would have in the no-information scenario. Therefore, having the option to change your action based on the signal can only help (or do nothing); it can never hurt.

  In Alice's case, this assumption is violated. Her utility function is effectively **$U(a, s, k)$**, where $k$ represents her knowledge state.
  *   When she is ignorant, the utility of the state $D$ is 40.
  *   When she is informed, the utility of the state $D$ is 0.

  Even if Alice chooses the exact same action ("Continue Life As Normal") in both scenarios, the *payoff* of that action changes because the information itself alters her psychological state. Because the information directly degrades the utility of the outcome (via anxiety), the "option value" of the information cannot compensate for the direct utility loss.

  ### Conclusion

  Your friend is conflating **instrumental value** (information helps you choose better actions) with **total value** (information helps you choose better actions *plus* how it makes you feel). Good's Theorem guarantees that information has non-negative *instrumental* value. It does not guarantee that information has non-negative *total* value when the knowledge itself is a source of disutility.

  Alice is not being irrational; she is maximizing expected utility correctly. Your friend is applying a theorem outside its axiomatic boundaries by assuming that human utility functions are blind to the state of knowledge.
