answer: |-
  You have put your finger on a very specific nerve in the history of aesthetics. Your intuition is sharp: there is a historical tradition that equates **distance from representation** with **proximity to truth**, and your extension to white noise exposes the breaking point of that logic.

  Here is the breakdown of the pattern, the philosopher, and where the carving stops holding water.

  ### 1. The Philosopher and the Pattern
  The "old philosopher" you are thinking of is almost certainly **Arthur Schopenhauer** (1788–1860).

  In *The World as Will and Representation*, Schopenhauer argued that all arts (painting, sculpture, poetry) are copies of "Ideas"—they are shadows of the physical world. But he claimed **music is different**. He argued music doesn't copy the physical world at all; it is a direct copy of the "Will" itself (the underlying, chaotic metaphysical force driving reality).

  The pattern you noticed is often called **Metaphysical Aesthetics** or the **Romantic Theory of Abstraction**. The logic runs like this:
  *   **Representation** (a painting of a tree) = Distanced from truth (it's a copy of a copy).
  *   **Abstraction** (instrumental music) = Closer to truth (it bypasses objects to speak directly to emotion/structure).
  *   **The Implication:** The less an art form resembles the mundane world, the more spiritual or "real" it is.

  ### 2. Is Your Version the Same Idea?
  Your version is logically consistent with Schopenhauer's, but you have pushed it to its **logical limit** (a *reductio ad absurdum*).

  Schopenhauer stopped at music because music has **structure** (melody, harmony, rhythm). He believed that structure mirrored the structure of the human will (tension, resolution, longing, satisfaction).

  When you extend this to **white noise or silence**, you are testing whether the value lies in the *absence of objects* or the *presence of form*.
  *   **Schopenhauer's view:** Value = Absence of Objects + Presence of Emotional Form.
  *   **Your extension:** Value = Absence of Objects (period).

  By suggesting white noise is "truer" because it has *zero* form, you are highlighting that the original argument is often sloppy. People say "music is true because it isn't a tree," but they actually mean "music is true because it is an **organized sound** that isn't a tree."

  ### 3. Does the Carving Hold Water?
  The carving holds water **only if you distinguish between "Non-Representational" and "Unstructured."**

  Here is the edge where the logic breaks:

  **The Zone Where It Works (Music vs. Painting):**
  Music is **non-representational**. It doesn't point to things outside itself. However, it is highly **structured**. It creates a world of internal relationships (tension/release, dissonance/consonance). This allows it to mimic the *dynamics* of reality (how things feel) without mimicking the *contents* of reality (what things are). In this zone, the claim holds water: music accesses a layer of experience that painting cannot.

  **The Zone Where It Fails (Music vs. Noise):**
  White noise and silence are **unstructured**. They don't just lack reference to the outside world; they lack internal relationship.
  *   If the argument is "Less reference to the world = More Truth," then a rock is truer than a symphony.
  *   If the argument is "Less reference to the world = More Truth," then static is truer than Mozart.

  Most people reject this conclusion. Why? Because **art requires selection.** A painting selects colors; a symphony selects notes. White noise selects nothing; it is everything at once (all frequencies). Silence is the absence of selection.

  If art is a window to reality, music is a clean pane of glass. White noise is a frosted pane, and silence is a wall. Removing the image doesn't make the glass "truer"; eventually, you just remove the window.

  ### 4. The Name for the Pattern
  There isn't one single noun for this, but in philosophy of art, this is often discussed under **Formalism** mixed with **Negative Theology**.

  *   **Formalism:** The idea that the value of art is in its form (lines, sounds), not its content (what it depicts).
  *   **Negative Theology:** A religious approach where you define God by what He is *not* (not finite, not visible).

  Your observation identifies a **"Via Negativa of Aesthetics."** It is the belief that you can arrive at the "Real" by stripping away the "Specific."

  ### 5. The Verdict
  Your intuition is correct: dragging noise and silence into the argument exposes the flaw.

  The claim that "music is closer to reality" works only because music is **ordered**. It organizes time and emotion. White noise and silence are not "closer to reality"; they are **indifferent** to it.

  The edge of the carving is **Intentionality**.
  *   **Painting:** Intentional representation of objects.
  *   **Music:** Intentional organization of sound without objects.
  *   **Noise:** Absence of intentional organization.

  The "hidden reality" people talk about isn't found in the *absence* of things (noise), but in the **presence of relationships** (music) that don't rely on naming things. Your extension to noise proves that "not being of the world" isn't enough; you also have to "be of something" (even if that something is just math or emotion).

  So, yes, the carving holds water, but only up to the point of **structure**. Once you remove structure in the name of purity, you don't get truth; you get entropy.
