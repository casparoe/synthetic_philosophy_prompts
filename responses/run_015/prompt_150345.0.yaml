answer: |-
  This is a classic setup for a thesis on non-aggregative ethics, and Sam is a fascinating specimen. He isn't a utilitarian, but he isn't a strict Taurekian either (since he saves the five in symmetric cases). Based on the spreadsheet data, I can give you a high-confidence diagnosis of his underlying principle, a prediction for Thursday, and a recommendation for a better test case.

  ### 1. Diagnosing Sam: The "Pairwise Comparison with Lexical Thresholds" View

  Sam is running a **Contractualist Pairwise Comparison** view (heavily influenced by T.M. Scanlon's *What We Owe to Each Other*), likely with a **Lexical Priority** clause for severe harms.

  Here is how his verdicts map to this theory:
  *   **5 Strangers Die vs. 1 Stranger Die:** The individual complaint of each person is identical ("I will die"). When individual complaints are identical, the numbers break the tie. (This explains why he isn't a Taurekian).
  *   **1 Dies vs. 5 Fingers:** The individual complaint of the one ("I will die") is lexically stronger than the individual complaint of the five ("I will lose a finger"). You cannot aggregate five weaker complaints to override one stronger complaint. (This explains the "worse for whom?" heuristic).
  *   **5 Lose Leg vs. 1 Loses Leg:** Identical complaints again. Numbers break the tie. Save the five.
  *   **1 Loses 2 Legs vs. 5 Lose 1 Leg:** This is the tell. He leans toward saving the one. This implies that harms *within* a life aggregate (2 legs > 1 leg), creating a stronger individual complaint for the one than for any single member of the five. Since the individual complaint of the one (2 legs) is stronger than the individual complaint of any of the five (1 leg), the numbers don't count.

  **The Rule:** *Compare the strongest individual complaint in Group A against the strongest individual complaint in Group B. If one is significantly worse (lexically superior), save that person regardless of numbers. If they are identical, save the greater number.*

  ### 2. Prediction for Thursday's Pub Case

  **The Case:** (A) Remove 30% risk of death from 5 strangers vs. (B) Save 1 stranger from certain death.

  **Sam's Verdict:** He will choose **(B) Save the One.**

  **Reasoning:**
  Sam's "worse for whom?" question forces him to look at the prospect facing the *individual*.
  *   **Individual in Group B:** Faces a 100% probability of death. Complaint: "I am condemned to die."
  *   **Individual in Group A:** Faces a 30% probability of death. Complaint: "I am at risk of dying."

  To Sam, **Certainty** and **Risk** are qualitatively different prospects, much like **Death** and **Finger-Loss**. Just as five finger-losses cannot outweigh one death, five risks of death cannot outweigh one certainty of death. The individual complaint of the certain-death victim is lexically stronger than the complaint of any single risk-bearer. Therefore, aggregation is blocked. The numbers (5 vs. 1) only break ties when the *nature* of the stake is identical. Here, the stakes (Certainty vs. Risk) are not identical.

  **The Boat Variant (Independent vs. Dependent Risk):**
  He will say **it makes no difference.**
  Since his theory is person-affecting ("worse for *whom*?"), he cares about the ex-ante probability facing the individual. Whether the 30% risk is correlated (one boat) or uncorrelated (five boats), the individual's prospect remains "30% chance of death." He is unlikely to accept "group fate" as a morally relevant unit unless it changes the individual's probability.

  ### 3. Addressing Your Suspicion (The Collapse into Expected Value)

  You suspect that introducing probabilities forces him to multiply $P \times Harm$, collapsing his view into Expected Utility (Utilitarianism). **He can resist this.**

  He can argue that **Risk is a distinct harm from Outcome.**
  If he were an Expected Value maximizer, he would treat a 30% risk of death as "0.3 deaths." Five of these equal 1.5 deaths, which outweighs 1 certain death.
  But Sam doesn't view harms as fungible commodities to be summed. He views them as **complaints.** A complaint about "certain death" is of a different *order* than a complaint about "risk of death."
  *   **Utilitarian:** Aggregates *expected outcomes* across persons.
  *   **Sam:** Compares *individual prospects* across persons.

  He avoids the collapse by refusing to convert the 30% risk into a "fraction of a death." It remains a "risk," and a risk is less morally urgent than a certainty, regardless of how many people hold the risk.

  **Where the Rules Come Apart:**
  *   **Rule 1 (Tie-Breaker):** Doesn't apply. Stakes aren't equal (Certainty $\neq$ Risk).
  *   **Rule 2 (Expected Harm):** Says Save the 5 ($1.5 > 1$).
  *   **Rule 3 (Same Kind/Lexical):** Says Save the 1 (Certainty trumps Risk).

  **Is there a reading where he must "Flip a Coin"?**
  No. Sam only flips (or rather, saves the many) when individual complaints are *identical*. Here, the complaints are demonstrably different in severity. A "flip a coin" verdict would require him to view a 30% risk as morally equivalent to a 100% certainty for the individual, which contradicts his "Death > Finger" intuition (where severity matters).

  ### 4. The Better Test Case

  Your proposed cases (1000 @ 5% or 5 @ 20%) are good, but the **5 @ 20% (Expected Value Match)** is the superior philosophical wedge.

  **The Case:**
  *   **Option A:** Save 5 strangers from a 20% risk of death each. (Expected deaths prevented = 1).
  *   **Option B:** Save 1 stranger from a 100% certainty of death. (Expected deaths prevented = 1).

  **Why this settles it:**
  This case neutralizes the **Expected Value** variable.
  *   **If Sam is a covert Expected Utility maximizer:** He should be indifferent (or flip a coin), because the expected number of lives saved is identical (1 vs. 1).
  *   **If Sam is a Pairwise Comparator (as diagnosed):** He must save the **One**. The individual complaint of Certain Death is still worse than the individual complaint of 20% Risk. The fact that the *group* risk sums to 1 expected death is irrelevant to the *individual* comparison.
  *   **If Sam is a Threshold Aggregativist:** He might save the 5, arguing that 20% is "high enough" risk to aggregate.

  **Why the 1000 @ 5% case is weaker:**
  If you propose 1000 people at 5% (Expected 50 deaths) vs. 1 Certain Death, and Sam saves the 1000, you don't know why.
  *   Did he switch to Expected Value?
  *   Or did he just hit a "sufficientist" threshold where 1000 risks *do* outweigh 1 certainty (just like 5 fingers don't, but 5,000 fingers might)?
  It leaves underdetermined whether he aggregates *probabilities* or just *numbers of people*.

  **Why the 5 @ 20% case is stronger:**
  It isolates the **Certainty vs. Risk** distinction from the **Quantity** distinction.
  *   If he saves the 1: He confirms that **Prospect Quality** trumps **Aggregated Probability**. His "worse for whom?" line holds.
  *   If he saves the 5: He admits that **Probabilities Aggregate** across persons. His "worse for whom?" line collapses into Expected Value.

  ### Summary Advice for Thursday

  1.  **Expect him to save the one.** He will argue that the person facing certainty has a complaint that the others cannot match, regardless of their number.
  2.  **Expect him to dismiss the boat correlation.** He focuses on individual ex-ante prospects.
  3.  **Don't use the 1000 person case yet.** It allows him to hide behind "obviousness."
  4.  **Use the EV-Match Case (5 @ 20% vs 1 @ 100%).** Tell him: *"Sam, suppose the expected number of deaths is exactly the same. One person dies for sure, or five people each have a one-in-five chance. Do we still owe more to the one?"*

  If he says "Save the One," your thesis has a solid non-aggregative account of risk. If he hesitates or says "Save the Five," you have caught him sliding into Utilitarianism, and you can press him on why "worse for whom?" stopped mattering once percentages entered the spreadsheet.
