  3.  **Uniform Gravity:** All lies are equally sinful. This is refuted by the distinction between the **midwives** (mildest) and the **malicious lie** (worst).
  4.  **Fiction as Falsehood:** All untrue statements are lies. This is refuted by the **storyteller** verdict.

