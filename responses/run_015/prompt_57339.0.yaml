  To separate the surviving interpretations of the "sacred" principle (whether "sacred" refers to *context/office* or *doctrinal content*), the sharpest test is: **A priest lying to prevent the theft of church funds.** If she rules this "gravely sinful," she prioritizes sacred context/property; if "sinful but mild," she prioritizes doctrinal content and intent (material protection aligns with midwives).

