      "It's cumulative," Elias said, tapping the table. "One billion specks. Even if each is negligible, B lives with a constant, low-grade irritation for eighty years. That's not just a speck; that's a life defined by nuisance."

      Mara shook her head. "You're treating suffering like sand grains. It's not. Person A undergoes torture. That shatters the self. Person B just gets annoyed. There's a lexical threshold here. Severe pain occupies a different moral category than trivial discomfort. No amount of triviality sums to torture."

      "But why?" Elias leaned in. "In the classic case, the specks are distributed across a million people. Here, B bears the whole burden. If I poke you a billion times, you don't sleep, you don't focus. You're miserable. Is A's year of hell truly worse than B's lifetime of prevented joy?"

      "Yes," Mara said firmly. "Because B can still function. B can love, work, laugh between specks. Torture eliminates the capacity for meaning. It's not about the sum of negative utility; it's about the depth of the valley. A hits the bottom. B stays on the surface."

      "So it's a cliff?" Elias asked. "If I increase the speck to a pinch, does B suddenly become worse off than A? Or is there a gradient?"

      "There's a threshold," Mara corrected. "Below it, harms are morally negligible in comparison. Above it, they matter. Torture is above. Dust is below. It's not a cliff of intensity, but of kind. Torture is an assault on agency. Dust is merely sensory noise."

      "But 'negligible' is tricky," Elias pressed. "If I add a billion negligible things, doesn't the neglect compound? If B's life is sufficiently irritated, isn't the total suffering higher? You're saying intensity creates a monopoly on moral weight."

      "I'm saying severity creates priority," Mara said. "Think of it like emergency triage. You save the bleeding patient before the one with a headache, regardless of how many headaches accumulate."

      "Except B isn't just having one headache," Elias countered. "B is having a billion. Over a lifetime. That's not a headache; that's a chronic condition. If we agree B's life is significantly worse than a normal life, aren't we admitting the specks add up? If they add up to a ruined life, haven't they crossed your threshold by accumulation?"

      Mara paused. "If the specks prevent B from living a good life... then yes, the harm is significant. But is it worse than torture? I concede that if the aggregation ruins the life structurally, it moves closer to A's suffering. But torture is immediate, absolute domination. B still has moments of autonomy."

      "So you concede the math matters if the structure of the life is broken," Elias said. "The threshold isn't just about the peak pain, but the erosion of the self over time."

      "I concede that duration amplifies harm," Mara said. "But I maintain that peak severity holds lexical priority. A's year is a concentrated horror B never faces. B's life is a dull ache. I'd rather be B."

      "Would you?" Elias asked. "Or would you rather be A, know it ends, and then live normally? Because B never gets the 'after'."

      "That's the crux," Mara admitted. "A gets an after. B gets a during that never stops. Perhaps... perhaps if the specks deny B any respite, they approach the tyranny of torture. But I still believe the *quality* of A's pain is a different species entirely."

      "Then we agree on the species," Elias said, "but disagree on whether a billion insects outweigh one lion."

      "Something like that," Mara sighed. "But I'd still save A first."

