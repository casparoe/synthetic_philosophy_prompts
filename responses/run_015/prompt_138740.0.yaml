answer: |-
  **Final Examination: Philosophy of Mind and Animal Ethics**

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1500 Words Maximum

  **Question 1**

  Consider Species M, a hypothetical social invertebrate with a nervous system of approximately 300,000 neurons. Intact members of M exhibit the following profile: they learn to avoid cues paired with noxious stimuli; they trade off this avoidance against competing goals (e.g., feeding) in a manner sensitive to the severity of the threat and the urgency of the goal; they reverse learned responses when contingencies change; they display pessimistic judgement biases following unpredictable stress; and they work to obtain substances that function as analgesics in vertebrates, particularly after injury.

  Neurophysiological investigation reveals a small, pharmacologically dissociable cluster of neurons, termed "the hub," which supports sustained long-range synchronised activity. This activity correlates perfectly with the flexible, trade-off-sensitive behaviours listed above. When the hub is chemically blocked, the animal (blocked-M) retains the following capacities: withdrawal from noxious stimuli, endocrine stress responses, simple conditioned avoidance, pessimistic judgement biases, and work for analgesics post-injury. However, blocked-M no longer trades avoidance off against competing goals, reverses learned responses when contingencies change, or modulates nocifensive behaviour by context.

  (a) What does the dissociation between intact-M and blocked-M show, and what does it fail to show, regarding whether blocked-M has experiences? Explain why this case might appear decisive to a proponent of one theory of consciousness but merely descriptive to a proponent of another. What specific kind of evidence would be required to make the case genuinely discriminative between theories?

  (b) Suppose a lineage closely related to M constitutes a massive share of invertebrate biomass in agriculture, such that the number of individuals affected by policy dwarfs the number of vertebrates involved. Suppose further that reasonable experts examining the evidence assign credences between 0.05 and 0.6 that members of this lineage have experiences. Given the epistemic limitations identified in part (a), what follows for how we ought to treat them? You must name the decision rule you are employing and justify why that specific rule is mandated by the epistemic situation rather than by moral intuition alone.

  ***

  **Model Answer**

  The dissociation between intact-M and blocked-M demonstrates that the behavioural markers we typically rely on to infer consciousness are functionally separable, but it fails to determine which cluster of markers is necessary for experience. Proponents of functionalist or cognitive theories will argue that the hub-mediated capacities (trade-offs, reversal learning) constitute the necessary architecture for unified experience; on this view, blocked-M is a philosophical zombie or a mere reflex machine. Conversely, proponents of affective or midbrain-based theories will argue that the preserved capacities (stress responses, analgesic self-administration, judgement bias) are the true substrates of feeling, rendering the hub merely a controller of complex output. To the former, the case proves blocked-M is unconscious; to the latter, it proves blocked-M feels pain but cannot act flexibly upon it. The case is theoretically neutral because it offers only third-person correlations. To make it discriminative, we would need independent access to first-person phenomenology—a "phenomenal meter"—to verify whether the removal of the hub extinguishes the light of experience or merely severs its connection to complex motor planning. Without this, we are mapping our theoretical priors onto the physiology.

  This underdetermination is compounded by the instability of our bridging premises even in humans. We treat verbal report as the gold standard for experience, yet report dissociates from behaviour and physiology in cases of anesthesia awareness, locked-in syndrome, or blindsight. If report can come apart from underlying processing in humans, then the absence of complex, hub-mediated behaviour in blocked-M cannot be treated as evidence of absence of experience. It suggests instead that blocked-M represents a degraded or partial case of agency. It is not a clean negative; it retains the affective core (stress, analgesic seeking) while losing the executive overlay. This implies that the distribution of consciousness is likely graded rather than binary. Consequently, searching for a sharp taxonomic cutoff is a category error. The line does not fall between species, but potentially within the neurological architecture of a single organism under different conditions.

  Given the credence range (0.05–0.6) and the astronomical scale of the biomass involved, a binary policy (total ban or business as usual) is epistemically irresponsible. A strict precautionary principle (acting as if probability is 1.0) risks paralyzing agricultural systems disproportionately to the risk, while standard Expected Utility Theory risks discounting the moral weight of the 0.6 credence too heavily against economic gain. The epistemic situation identified in (a)—specifically, the inability to rule out experience in blocked-M despite the loss of flexible behaviour—mandates a **Weighted Precautionary Rule**. We must act as though the probability of moral status is higher than the raw credence suggests, scaling protection to the severity of the potential harm (suffering) rather than the certainty of the status.

  This rule dictates that we cannot treat blocked-M as insensate machinery. Even at the lower bound of credence, the sheer volume of individuals creates a massive expected disvalue if they can suffer. However, the rule must have a stopping point to avoid absurdity. We do not apply this to plants or simple algorithms because they lack the specific physiological correlates (nociceptors, opioid systems, stress axes) present even in blocked-M. The stopping point is not behavioural flexibility, which we have shown is dissociable, but the presence of the affective substrates that remain intact in blocked-M. Therefore, policy should mandate the minimization of noxious stimuli for this lineage, regardless of hub function, while prioritizing research to resolve the theoretical deadlock. We are forced to hedge against the possibility that feeling survives the loss of flexibility, because the cost of being wrong is the industrialization of suffering.

  ***

  **Marking Scheme (20 Marks)**

  **1. Critique of the Bridging Premise (4 Marks)**
  *   **Requirement:** The student must identify that inferring experience from behaviour/physiology relies on a premise that is shaky even in humans. They should note that report (the human gold standard) dissociates from behaviour (e.g., anesthesia, locked-in), so the absence of complex behaviour in blocked-M is not definitive evidence of absence of experience.
  *   **Typical Failure:** Assuming that because report is our gold standard, the absence of report/complex behaviour in animals is evidence of absence of experience.

  **2. Theory Adjudication and Underdetermination (4 Marks)**
  *   **Requirement:** The student must explain why the case looks decisive to different theorists (theory-ladenness). They must state that the case cannot adjudicate between theories without independent access to phenomenology (a "phenomenal meter" or equivalent).
  *   **Typical Failure:** Plugging a single theory (e.g., Global Workspace or Affective Consciousness) into the case and reading the answer off as if it were factual.

  **3. Degraded Case vs. Clean Negative (4 Marks)**
  *   **Requirement:** The student must argue that blocked-M is best described as a degraded or partial case (retaining affective core, losing executive control) rather than a clean negative. They should note the implication that consciousness may admit of degrees and that sharp taxonomic cutoffs are unjustified.
  *   **Typical Failure:** Helping themselves to a sharp line between taxa that merely needs discovering, or treating blocked-M as fully unconscious simply because flexibility is lost.

  **4. Decision Rule Justification (4 Marks)**
  *   **Requirement:** The student must name a decision rule (e.g., Weighted Precaution, Expected Value with risk aversion) and justify it based on the *epistemic limitations* from part (a) and the scale of stakes, not just moral intuition. The rule must reflect the uncertainty range (0.05–0.6).
  *   **Typical Failure:** Closing the practical part with an unanalysed call for caution ("we should be careful") without specifying the decision rule or how it handles the probability range.

  **5. Generalization and Stopping Point (4 Marks)**
  *   **Requirement:** The student must address the objection that their rule might overgeneralize (e.g., to plants or robots). They must identify a stopping point (e.g., specific physiological substrates present in blocked-M but not in plants) that is consistent with their epistemic analysis.
  *   **Typical Failure:** Treating every behavioural marker as equally probative, leading to panpsychism, or failing to explain why the rule doesn't apply to systems lacking the specific physiological correlates.

  **Distinction between A and B Scripts**
  A B script will treat part (a) and part (b) sequentially, solving the metaphysical problem and then applying a standard precautionary principle without letting the specific nature of the uncertainty drive the rule choice. An A script will identify which feature of the epistemic situation (e.g., the dissociation of affect from flexibility) forces the choice of decision rule and explicitly state what evidence would change their mind.
