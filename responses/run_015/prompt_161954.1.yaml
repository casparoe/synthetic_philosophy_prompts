  Elena stares at the hallway wall. Monday morning, flat light. Tuesday evening, warm lamp. The paint doesn't change, but the look shifts. Thursday, she holds two chips. She doesn't check the clock or the bulbs. She closes her eyes, feeling the memory's weight. Tuesday's warmth sits behind her eyelids; Monday's grayness feels flat. "The second was more like this," she says, tapping the warmer chip. She mixes paint to match. Under the evening lamp, the swatch vanishes into the wall. The Monday mix would have stuck out like a scar. She wipes the brush. No note says why. Just the look. Later, the landlord checks the work. He nods. She keeps the deposit.

  Yesterday, same wall, same times. She shrugs, mixes a generic beige. It dries patchy. No judgement formed, no money saved.

  ***

  Epiphenomenalism explains the *occurrence* of the judgement because physical brain states cause speech; muscles move regardless of qualia. It cannot explain the *accuracy* because if qualia are inert, the physical memory trace at T4 must track the phenomenal character at T2 without causal contact. The delay blocks the joint-effect reply: there is no single neural state causing both the experience and the judgement simultaneously. If you remove the delay, the standard reply works; one state causes both. If the object changes, the physical difference explains the judgement, making qualia redundant.

  The strongest epiphenomenalist rebuttal is that physical memory traces reliably track past physical states (which caused the qualia). Correlation suffices; the judgment is accurate about the experience because both the experience and the judgment track the same underlying physical history.

  The delay is doing the heavy lifting by breaking synchronous common causation. The weakest part of your setup is assuming the physical object staying fixed prevents the epiphenomenalist from citing internal physical changes (adaptation) as the common cause for the memory trace and the original experience. You've built the success into the scene; the argument relies on the reader accepting that physical traces can't preserve phenomenal specificity without phenomenal causation.
