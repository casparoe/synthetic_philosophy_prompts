answer: |-
  ### I. Preliminary Conceptual Distinctions and the Circularity Worry

  To evaluate the viability of teleosemantic naturalism, we must first distinguish the two primary methodological approaches to grounding content in biological function. **Producer-based theories** locate the content of a representational state in the conditions under which the mechanism producing that state was selected to operate. Here, content is tied to indication: a state represents $X$ because the mechanism was selected to produce that state only when $X$ is present. **Consumer-based theories**, conversely, locate content in the conditions under which the mechanism consuming the state was selected to operate. Here, content is tied to usage: a state represents $X$ because the downstream systems were selected to process that state in a way that succeeds only if $X$ is the case.

  Both approaches rely on the notion of **Proper Function**: a function a trait possesses in virtue of its selection history, which grounds the possibility of normative failure (i.e., misrepresentation). The central circularity worry arises when attempting to derive specific truth conditions from this history. To claim a mechanism has the proper function of indicating $X$, one must presuppose that selection favored the detection of $X$. However, selection favors fitness, not truth. To bridge the gap between "selected for survival" and "selected to represent $X$," theorists often implicitly appeal to the organism's goals or needs. If these goals are themselves characterized in terms of representational content, the analysis becomes circular: content is explained by function, but function is individuated by content. If goals are characterized merely as survival, the content becomes radically underdetermined, as any number of distinct contents are compatible with the same survival outcome.

  ### II. The Collapse of Singular-Function Teleosemantics

  The standard formulation of teleosemantics assumes a **Singular-Function Principle**: for any representational vehicle $V$, there exists a unique proper function $F$ assigned by selection history $H$, such that the content of $V$ is determinately fixed by $F$. I argue that this principle leads to a dilemma between circular normativity and radical underdetermination.

  **1. The Problem of Radical Underdetermination**
  Let $H$ be the total selection history of the mechanism producing $V$. $H$ explains why the organism survived and reproduced. However, $H$ is compatible with multiple distinct environmental regularities. For example, a neural state $V$ might have been correlated with "predator," "large moving shadow," or "specific retinal stimulation pattern" throughout $H$. All three correlations would yield the same survival advantage. If $H$ assigns only one proper function, there is no naturalistic fact within $H$ that privileges "predator" over "shadow." To select one is to import a distinction not present in the selection history itself. Thus, singular-function teleosemantics fails to naturalize content; it leaves the specific content indeterminate relative to the natural facts.

  **2. The Problem of Circular Normativity**
  To resolve the underdetermination, the singular-function theorist often argues that $H$ selected for $V$ *as a representation of a predator*. However, this move presupposes that the selective pressure operated on the *content* of $V$ rather than merely the causal covariance. This requires assuming that the ancestors possessed states with the very content we are trying to analyze. If the proper function is defined as "the function of representing $X$," we have used the notion of representation to define proper function, which is supposed to define representation. The normativity required to rule out "shadow" in favor of "predator" is not found in the physics of selection but is smuggled in via intentional descriptions of the ancestors' goals.

  Consequently, the Singular-Function Principle collapses. It cannot generate determinate content from history alone without begging the question, nor can it avoid indeterminacy without abandoning naturalism.

  ### III. The Plural-Function Framework

  Teleosemantic naturalism can be rescued only by abandoning the Singular-Function Principle in favor of a **Plural-Function Framework**. On this view, selection history $H$ does not assign a single, determinate proper function to a representational vehicle $V$. Instead, $H$ endows $V$ with a **Functional Capacity Set** $\Phi = \{F_1, F_2, ..., F_n\}$. Each $F_i$ is a proper function grounded in $H$, but none is exclusively *the* function of $V$ in isolation.

  The specific content of $V$ at time $t$ is determined by the intersection of $\Phi$ and the **Current Systemic Context** $C_t$.

  **Formal Characterization:**
  1.  **Historical Grounding:** $V$ has proper function $F_i$ iff $V$'s ancestors performed $F_i$ with sufficient frequency to explain $V$'s proliferation. $H$ validates all $F_i \in \Phi$.
  2.  **Contextual Activation:** At time $t$, the organism is in state $C_t$. $C_t$ causally engages specific downstream consumers of $V$.
  3.  **Content Determination:** The content of $V$ at $t$ is the truth condition required for the successful performance of the specific $F_k \in \Phi$ that is activated by $C_t$.

  **Resolution of Normativity and Underdetermination:**
  This framework resolves the earlier dilemma without importing non-natural norms.
  *   **Avoiding Underdetermination:** We do not need history to single out one function. History validates the *range* of capacities ($\Phi$). The indeterminacy of history is acceptable because it is resolved synchronically by $C_t$. If $C_t$ involves a motor system preparing to flee, $F_{predator}$ is activated. If $C_t$ involves a motor system preparing to hide from light, $F_{shadow}$ is activated. Both are historically valid; the context selects the relevant one.
  *   **Avoiding Circularity:** The selection of $F_k$ from $\Phi$ is not determined by assuming ancestral content. It is determined by the current causal topology of the nervous system. $C_t$ is a naturalistic state (e.g., the activation of specific neural pathways). We do not need to know *what the ancestor represented* to know *what the current system is doing*. The normativity remains historical (the function must be in $\Phi$ to be proper), but the individuation of content is causal and contextual. Thus, the "norm" is fixed by history, but the "content" is fixed by current use within historical bounds.

  ### IV. Objection and Reply

  **Objection: The Relocation of Indeterminacy**
  A serious objection arises: Does this not merely relocate the indeterminacy from history to context? To determine which $F_k$ is activated by $C_t$, we must individuate $C_t$. But contexts are holistic and potentially vague. If we cannot precisely define the boundaries of $C_t$ without appealing to the organism's goals (which are content-laden), we have not solved the circularity; we have merely shifted it from the diachronic (history) to the synchronic (context). The "context" might be just as underdetermined as the "selection history."

  **Reply: Causal Individuation of Context**
  This objection fails because it conflates *functional description* with *causal individuation*. In the Plural-Function Framework, $C_t$ is not individuated by the organism's goals or reasons, but by the **causal topology of the current neural architecture**.

  Which function $F_k$ is active is determined by which downstream neural populations receive the signal $V$ at time $t$. This is a matter of physical connectivity and activation thresholds, not interpretive goals. For instance, if signal $V$ projects to the amygdala-driven motor pathways, the context is "threat-response." If it projects to the visual-cortex feedback loops, the context is "perceptual-adjustment." These pathways are physically distinct.

  The indeterminacy worry assumes that identifying the "relevant context" requires an intentional stance. However, under the plural-function view, the context is simply the set of currently active causal consumers. Since the physical connectivity of the brain at $t$ is determinate (even if complex), the selection of $F_k$ from $\Phi$ is determinate. We do not need to ask "what is the organism trying to do?" to find $C_t$; we only need to ask "where is the signal going?"

  Therefore, the Plural-Function Framework succeeds where singular-function theories fail. It retains the naturalistic grounding of normativity in selection history (preventing the introduction of non-natural norms) while acknowledging that history underdetermines specific content. By outsourcing the specific content determination to the causally individuated current context, it avoids both the circularity of presupposing content in the definition of function and the radical underdetermination of trying to read specific truth conditions directly from the fossil record of selection. Teleosemantics is viable only as a theory of historical *capacity* constrained by current *causal role*, not as a theory of historical *decree*.
