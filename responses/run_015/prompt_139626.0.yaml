answer: |-
  **PHI 4000: Metaphysics Seminar**
  **Take-Home Final Examination**

  **Instructions:** Answer the following question in no more than 1,200 words. You have 48 hours to complete this examination. Open notes and texts are permitted.

  **Question:**

  Max Black's universe of two exactly similar spheres is frequently cited as a counterexample to the Principle of the Identity of Indiscernibles (PII). However, the philosophical significance of a counterexample depends on what work the principle was intended to do.

  (a) Evaluate the claim that Black's case decisively refutes PII. In your analysis, consider whether the force of Black's counterexample depends on specific commitments regarding the ontology of space. If a proponent of PII accepts Black's scenario but denies that it refutes the principle, what metaphysical price do they pay, and does that price undermine the traditional motivations for endorsing PII (such as arguments against absolute space)?

  (b) Consider the **Case of the Successive Spheres**: A single perfectly homogeneous sphere exists for one million years, is annihilated, and after a gap of one million years, a second sphere comes into existence, qualitatively identical to the first in every intrinsic and relational respect. Does the logic of Black's simultaneous case apply here? Specifically, discuss whether temporal location functions analogously to spatial location in this context, and what this implies for bundle theory and the distinction between numerical diversity and qualitative identity.

  ***

  **Model Answer (A-Grade Standard)**

  Black's two-spheres case is often treated as a simple falsification of PII: two distinct objects share all properties; therefore, PII is false. However, this conclusion is premature because the discernibility of the spheres depends entirely on the ontology of space. The case does not refute PII in a vacuum; it forces a choice between PII and a relational theory of space.

  If space is substantival—meaning spatial positions exist independently of the objects occupying them—then the spheres occupy distinct regions of absolute space. Consequently, they possess different properties: *occupying region R1* and *occupying region R2*. Under this description, the spheres are discernible, and PII holds. However, saving PII this way comes at a steep dialectical cost. Historically, PII was a primary weapon against substantivalism, most notably in the Leibniz-Clarke correspondence. Leibniz argued that if space were a container, God could have shifted the entire material world a few feet east without any observable difference. Since such a shift would violate PII (creating a distinct world indiscernible from the actual one), substantivalism must be false.

  Here lies the squeeze. If the friend of PII saves the principle in Black's universe by appealing to absolute spatial positions, they concede that objects are individuated by their location in a substantival container. But if they concede substantivalism, they lose the ability to use PII to argue against the "shifted world" scenario. The shifted worlds would differ in their absolute positions, just as Black's spheres do. Thus, Black's case only functions as a counterexample to PII if one already assumes relationalism (that space is nothing over and above relations between bodies). If one assumes relationalism, the spheres share all spatial properties (e.g., *being two miles from the other sphere* is symmetric), and PII fails. But if PII fails, it cannot be used to motivate relationalism. The proponent of PII can maintain the principle only in a form too weak to do the metaphysical work traditionally assigned to it.

  This tension carries over to the Case of the Successive Spheres, though with complications regarding time. If time is substantival (Newtonian absolute time), the spheres occupy different temporal coordinates. They are discernible by *existing at t1* versus *existing at t2*. PII is preserved, but again, at the cost of accepting absolute time. If time is relational, the situation is more complex. Unlike Black's spheres, which coexist, the successive spheres do not coexist. This raises the question of whether the second sphere is a numerically distinct object or the same object persisting (or recurring).

  For the bundle theorist, who holds that objects are nothing but collections of properties, the simultaneous case is catastrophic if PII fails. If two objects share all properties, there is no "thisness" (haecceity) to distinguish the bundles; they should collapse into one. Black's case suggests bundle theory requires a relationalist space to generate distinctness, yet relationalism renders the bundles identical. In the successive case, the bundle theorist might argue that temporal properties are part of the bundle. If so, the bundles differ, and they are distinct objects. However, this relies on treating temporal location as a genuine property of the object rather than a relation to a substantival time.

  Furthermore, we must distinguish between metaphysical possibility and conceivability. Black's case is conceivable, but is it metaphysically possible? If PII is necessarily true (as Leibniz held), then Black's universe is impossible, regardless of how clearly we imagine it. The Successive Spheres case highlights this: if we deny PII, we must accept that numerical diversity can exist without qualitative difference, even across time. This suggests that what is at stake is not merely the truth of PII, but its necessity. If PII is contingent, it offers little protection against haecceitism or substantivalism.

  Ultimately, Black's case does not simply refute PII. It reveals that PII is not a standalone logical truth but a thesis intertwined with the metaphysics of space and time. Accepting the counterexample requires abandoning the view of space that made PII attractive in the first place. In the successive case, the stakes shift to the nature of temporal existence and persistence. In both instances, preserving PII requires individuating principles (like absolute location) that undermine the parsimonious motivations for the principle. Therefore, the "refutation" is not a victory for anti-PII arguments, but a demonstration that PII cannot bear the weight of both individuating objects and eliminating absolute space-time simultaneously.

  ***

  **Marking Scheme (Total: 25 Points)**

  **1. The Spatial Ontology Dependency (5 points)**
  *   **Full Credit:** Identifies that Black's spheres are only indiscernible if space is relational. If space is substantival, they differ by location.
  *   **Typical Error:** Treats space as a neutral background or assumes the spheres lack spatial properties regardless of the ontology of space.

  **2. The Dialectical Cost (The "Squeeze") (5 points)**
  *   **Full Credit:** Explains that saving PII via substantivalism undermines the Leibnizian argument against absolute space (the "shift" argument). PII is saved but rendered useless for its traditional purpose.
  *   **Typical Error:** Discusses the Leibniz Shift argument but fails to connect it to the cost of accepting Black's counterexample.

  **3. Analysis of Successive Spheres (5 points)**
  *   **Full Credit:** Applies the spatial logic to time. Notes that substantival time saves PII (different temporal locations) while relational time threatens it. Addresses the persistence/recurrence distinction.
  *   **Typical Error:** Treats the successive case as identical to the simultaneous case without noting the unique issues of temporal persistence or annihilation.

  **4. Implications for Bundle Theory (5 points)**
  *   **Full Credit:** Discusses how the failure of PII threatens bundle theory (no basis for distinguishing bundles) and how temporal properties might rescue it in the successive case.
  *   **Typical Error:** Mentions bundle theory only in passing or conflates it with haecceitism without explaining the structural problem.

  **5. Modality and Necessity (5 points)**
  *   **Full Credit:** Distinguishes between PII as a contingent truth vs. a necessary truth. Notes that if PII is necessary, Black's case is impossible, not a counterexample.
  *   **Typical Error:** Treats conceivability as sufficient for metaphysical possibility without qualification.

  ***

  **Note on the "Solid B" Answer**

  A B-grade answer will correctly identify that Black's case challenges PII and will likely mention that spatial location *could* distinguish the spheres. It will handle the Successive Spheres case competently, noting that they exist at different times. It will likely list standard replies (haecceities, weak vs. strong PII) accurately.

  **What distinguishes it from the A:** The B answer usually treats the ontology of space as a separate issue from the validity of Black's counterexample. It misses the *dialectical squeeze*: that accepting the counterexample requires abandoning the very view of space (relationalism) that motivates PII in the Leibnizian tradition. It tends to treat the Simultaneous and Successive cases as parallel without exploring how temporal persistence complicates the bundle theory objection differently than simultaneous coexistence. It describes the debate rather than evaluating the structural dependencies.
