answer: |-
  Two teams manage adjacent plots in a community urban farm facing persistent crop failure, each adhering to a distinct operational doctrine. Team Alpha operates under the "Living Soil" programme, holding as immutable that microbial diversity drives nutrient uptake; when their tomatoes wilted despite adequate water, they hypothesized a specific fungal network collapse and inoculated the beds, predicting not just recovery but a surge in blossom density, which subsequently occurred. Team Beta follows the "Chemical Balance" programme, maintaining the core rule that failure stems solely from macro-nutrient deficiency; when their crops wilted despite standard fertilization, they added magnesium, then zinc, then adjusted pH levels sequentially to explain each new failure, finally claiming the water temperature was the culprit only after the plants had already died, thereby saving their core rule without ever anticipating the specific cause of wilting beforehand.

  In Lakatosian terms, Team Alpha represents a progressive research programme because it risks a bold claim that yields a novel fact—the unexpected surge in blossom density—which was not part of the original problem situation (wilting). Their hard core is the inviolable assumption that microbial diversity drives nutrient uptake, while their protective belt consists of specific hypotheses about fungal networks that can be tested and modified. Team Beta exemplifies a degenerating programme because their adjustments are purely defensive; their hard core is the rule that failure stems solely from macro-nutrient deficiency, and their protective belt is patched with sequential additives (magnesium, zinc, pH) only after anomalies arise. The specific novel fact separating them is the blossom density surge: Alpha predicted it before observation, whereas Beta merely accommodated the wilting anomaly after the fact without predicting new successes.

  The structural feature carrying the weight of this distinction is the capacity to generate excess empirical content—specifically, the temporal precedence of the hypothesis over the observation. If you remove the requirement for novel prediction and allow theories to be judged solely on their ability to fit existing data post-hoc, the distinction collapses; both programmes would appear equally rational because both eventually align with the observed reality (either the plants recover or the cause is identified), rendering theory choice arbitrary or based merely on aesthetic preference rather than epistemic growth. An advocate of the degenerating programme could reply that their adjustments are not ad hoc but reasonable refinements, arguing that the local soil conditions are uniquely complex and that each adjustment represents a genuine learning process about specific contextual variables rather than a desperate maneuver to save a dogma, thereby claiming that their belt modifications are actually increasing the precision of their application rather than merely protecting the core.
