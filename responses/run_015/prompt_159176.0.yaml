answer: |-
  ### Specification for Reasoning from Archival Silence

  To be fit for journalism, a method for reasoning from silence must move beyond theoretical acknowledgement of gaps and provide a discipline for making defensible claims about them. The following six desiderata constitute the specification.

  #### 1. Typological Distinction
  **Requirement:** The method must distinguish between the four modes of absence: non-production, destruction, inaccessibility, and illegibility (reduction). It must not collapse these categories into a single notion of 'silence'.
  **Consideration:** A person never recorded because they lived outside the state's reach differs fundamentally from a person redacted from a surviving file. Collapsing these leads to false equivalence. If you treat a tax-default notice (illegibility/reduction) as the same kind of absence as a burned census (destruction), you misrepresent the mechanism of erasure. A usable method must keep them apart because the claim you can make about the subject's life depends on which mechanism operated. Non-production suggests marginality; destruction suggests threat; inaccessibility suggests secrecy; reduction suggests bureaucracy.

  #### 2. Baseline Regularity
  **Requirement:** The method must establish a 'baseline of expectation' before treating a gap as evidence. It must demonstrate that, under normal administrative conditions, a record *should* have existed.
  **Consideration:** This is the 'watchdog-that-did-not-bark' discipline. Silence is only evidence of suppression or omission if there was a routine duty to record. If the archive is sporadic by nature, a gap proves nothing. To defend a claim in print, you must show the system was capable of seeing the subject and chose, or failed, to do so. Without this, absence is merely noise.

  #### 3. Technical Mediation
  **Requirement:** The method must account for silence generated by technical systems, not just human decisions. It must treat search indices, crawling parameters, de-duplication algorithms, and file formats as active producers of absence.
  **Consideration:** In born-digital collections, a record may exist on a server but be unreachable because a script did not crawl it, or because a metadata field was left null. A paper-era method assumes a physical box either is or is not there. A digital method must recognise that a record can be present but computationally invisible. If the method cannot interrogate the architecture of the database, it is useless for modern reporting.

  #### 4. Volumetric Competence
  **Requirement:** The method must be capable of reading over-documentation as a form of silencing. It must treat glut (surveillance files, confinement paperwork) not as truth, but as a specific distortion that drowns out other aspects of a life.
  **Consideration:** Silence is not only the lack of data; it is the overwhelming presence of hostile data. A subject defined entirely by police logs is silenced as a human being, even if they are loudly documented as a suspect. A method that only hunts for gaps will fail to see how a flood of negative records creates its own void, erasing agency, context, and normality.

  #### 5. Causal Restraint
  **Requirement:** The method must forbid the automatic attribution of malice to absence. It must provide a framework for distinguishing between suppression (active), indifference (passive), and accident (structural).
  **Consideration:** Romanticising silence as resistance is a failure of rigour. Sometimes a file is missing because a clerk spilled coffee, or because a retention schedule was poorly designed. Journalism requires accurate attribution of cause. If you cannot distinguish between a conspiracy to hide and a failure to file, you cannot defend a claim of wrongdoing. The method must force you to prove intent before asserting it.

  #### 6. Provenance of Substitutes
  **Requirement:** The method must assign explicit evidentiary weight to repair mechanisms (oral testimony, counter-archives, re-indexing). It must state clearly when a substitute source is filling a gap and what epistemic cost that incurs.
  **Consideration:** Oral history can fill a silence, but it is not the same evidence as a contemporaneous document. A method must clarify that repair changes the nature of the claim. You are no longer reporting on what the archive says, but on what the archive *failed* to say and how you compensated. This distinction must be transparent to the reader to maintain trust.

  ***

  ### Sorting the Requirements

  #### Non-Negotiable (Functional Necessities)
  These requirements are essential for any journalistic claim to be defensible, regardless of the reporter's political or theoretical stance.

  *   **Typological Distinction:** Without this, you cannot accurately describe the physical reality of the record. Collapsing the four modes of missingness renders the reporting factually vulnerable.
  *   **Baseline Regularity:** Without this, you cannot claim that a gap is significant. It is the logical foundation of inferring anything from absence.
  *   **Technical Mediation:** Without this, the method is obsolete for any story involving modern data.
  *   **Causal Restraint:** Without this, the reporting slides into speculation. Distinguishing accident from malice is a core duty of accuracy.

  #### Tradition-Specific (Commitments You May Reject)
  These requirements reflect specific theoretical traditions. You may adopt or discard them depending on the angle of your investigation.

  *   **The Archive as Power (vs. Bureaucracy):** Some traditions demand you presuppose the archive is an instrument of state control designed to exclude. Others view it as a chaotic byproduct of administration. You are free to reject the 'power' lens if your reporting suggests incompetence rather than oppression, provided you meet *Causal Restraint*.
  *   **The Hierarchy of Repair:** Some traditions hold oral testimony as equal to written records; others view it as secondary corroboration. You may choose where to place the weight of counter-archives, provided you meet *Provenance of Substitutes* by declaring your choice.
  *   **The Goal of Repair:** Some methods aim to restore the subject to the record (reparative description); others aim to expose the mechanism of their removal. You may choose whether your end goal is restoration or indictment.

  ***

  ### Analysis of Trade-offs

  #### The Single Knockout Requirement
  **Baseline Regularity.**
  This requirement eliminates the largest share of candidate methods. Most theoretical approaches to archival silence (particularly in humanities and critical theory) treat silence as inherently meaningful without first establishing that a record was expected. They assume the gap is significant because the subject is marginal. For journalism, this is insufficient. If you cannot prove the system *should* have seen the person, you cannot claim the system *ignored* them. This requirement kills any method that relies on intuition or theoretical presumption rather than administrative audit.

  #### The Irreconcilable Tension
  **Causal Restraint vs. Ethical Uniformity.**
  I suspect these two cannot be jointly satisfied in practice, though they are both desirable.

  *   **Causal Restraint** demands you separate accident from suppression. It requires you to say, 'We do not know why this is missing,' if the evidence is unclear. It privileges precision.
  *   **Ethical Uniformity** (implied by the duty to the people in the gap) suggests that for the missing person, the outcome is the same whether they were erased by malice or neglect. They are equally gone. This perspective demands you treat the silence with the same gravity regardless of cause.

  The tension lies here: To be rigorous (Causal Restraint), you must fragment your story into 'known suppression', 'likely negligence', and 'unknown loss'. To be ethically coherent and impactful (Ethical Uniformity), you must treat the silence as a unified wrong. If you prioritise rigour, you risk weakening the moral force of the story with caveats. If you prioritise the ethical claim, you risk overstating the evidence of intent.

  Your guess regarding 'silence speaking for itself' versus 'never over-reading' is close, but the deeper conflict is between **knowing the cause** and **honouring the effect**. A method that strictly enforces Causal Restraint will often leave you unable to make the strong claim the story seems to demand. A method that prioritises the ethical weight of the silence will often tempt you to imply intent you cannot prove. You will likely have to choose which failure mode you prefer: ambiguity or overreach.
