      *   **Move (7) Ingrid:** Objection regarding Accommodation vs. Prediction. Both fixes treat "fitting old data" same as "predicting new data." Practice favors prediction (or derivation from core postulates vs. tuning).
          *   *Assessment:* This is the "Novelty" or "Use-Novelty" problem. Standard Bayesianism struggles to distinguish accommodation from prediction without prior adjustments.
