      *   **Move (8) Tobias:** Response to (7). It's handled in the Priors (simplicity/penalty for tunable parameters).
          *   *Assessment:* Standard Bayesian reply (Occam's razor in priors). Ingrid's counter (priors shouldn't depend on evidence relation) is a deep meta-issue.
