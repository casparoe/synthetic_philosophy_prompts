answer: |-
  This is a sharp question that cuts through the standard econ 101 defenses of discounting. You are essentially advocating for the **Ramsey-Pigou-Sidgwick** view (often adopted by the effective altruism/longtermist community): that pure time preference (PTP) is ethically indefensible, a "weakness of the imagination," and that any discounting should be derived solely from probability of extinction or diminishing marginal utility of consumption.

  However, holding this view under the conditions you specified (perfect foresight, no existential risk, infinite or indefinite future) exposes you to significant formal and practical vulnerabilities. Below is a ranking of defeaters for the Zero Pure Time Preference (ZPTP) position, moving from formal/mathematical fatal flaws to metaphysical/practical awkwardness.

  ### 1. The Formal Coherence Defeater (Fatal)
  **The Koopmans Impossibility Theorem & Infinite Streams**

  This is the strongest technical argument against you. Tjalling Koopmans (1960) proved that for an intertemporal welfare function to satisfy a few basic axioms (continuity, sensitivity, and non-dictatorship of the past or future), **it must imply a positive rate of time preference.**

  *   **The Problem:** If you assume an infinite future (standard in longtermism) and ZPTP, you cannot mathematically aggregate utility. If the stream of utility is infinite, the sum is infinite. If you change the utility at $t=1$, the sum remains infinite. Standard utilitarianism loses the ability to rank outcomes.
  *   **The Paradox:** Without a discount factor ($\delta < 1$), the "tail" of the infinite series dominates the "head." Any action that improves the infinite future by an epsilon, no matter how far away, outweighs any finite suffering now. This isn't just a moral demand; it's a mathematical breakdown of decision theory. You cannot compare two infinite streams without a weighting mechanism that effectively functions as discounting (e.g., "overtaking criteria" or discounting).
  *   **Why it counts:** You specified "perfect foresight" and "no death risk." If the timeline is infinite, ZPTP renders the utility function undefined or non-comparable. To make decision theory work on an infinite horizon, you *must* introduce a mathematical discount factor. Whether you call that "pure time preference" or "mathematical convergence" is semantic; the functional result is that future utility is weighted less.

  ### 2. The Action-Guidingness Defeater (Fatal)
  **The "Cluelessness" and Overdemandingness Objection**

  Even if we solve the infinity problem (e.g., by assuming a finite but very long future), ZPTP combined with the vastness of the future leads to **moral paralysis**.

  *   **The Commitment:** If the future contains $10^{50}$ potential lives, and you discount them at 0%, then even a $10^{-20}$ probability of affecting the trajectory of that future outweighs all current human suffering.
  *   **The Defeater:** We are epistemically "clueless" about the long-term consequences of our actions (the butterfly effect). If ZPTP is true, almost every action we take has an undefined expected value because the long-term tail dominates the calculation, but we cannot estimate the tail.
  *   **Result:** A normative theory that renders almost all decisions computationally intractable or demands near-total self-sacrifice for speculative future gains fails the "action-guiding" test. It collapses into a form of **moral fanaticism** where you must sacrifice definite present goods for infinitesimal probabilities of infinite future goods (a variant of the St. Petersburg paradox).
  *   **Why it counts:** A moral theory that implies you should let a child drown in front of you because you need to preserve resources to marginally reduce the risk of a future AI misalignment (with probability 0.0000001%) is arguably *reductio ad absurdum* of the theory, not a feature.

  ### 3. The Metaphysical Defeater (Severe)
  **Presentism and the Ontology of the Future**

  You asked if metaphysics could ground a difference without egoism. **Presentism** is the only candidate.

  *   **The View:** Only the present moment exists. The past is gone; the future is not real.
  *   **The Argument:** You cannot have obligations to entities that do not exist. Spatial distance connects two existing points. Temporal distance (under presentism) connects an existing point to a non-existing point. Therefore, discriminating based on temporal location is not like spatial discrimination; it is like discriminating between *something* and *nothing*.
  *   **The Weakness:** This conflicts with Special Relativity (which suggests a block universe) and clashes with the intuition that future people *will* exist. However, if you adopt a "Growing Block" or Presentist view, ZPTP is category error. You aren't discounting welfare; you are acknowledging that future welfare has no ontological status *yet*.
  *   **Why it counts:** It provides a principled, non-egoistic reason to treat $t_{now}$ differently from $t_{future}$ without relying on risk or psychology. It grounds the asymmetry in reality itself.

  ### 4. The Identity Defeater (Awkward)
  **Parfit's Reductionism and Psychological Connectedness**

  You mentioned self-locating uncertainty and probabilistic copies. This touches on Derek Parfit's *Reasons and Persons*.

  *   **The View:** Personal identity is not a deep further fact; it consists in psychological connectedness (memory, character, intentions). This connectedness fades over time.
  *   **The Argument:** If what matters is the *relation* between selves, and that relation weakens over time, then it is rational to care less about a future self that is psychologically discontinuous with your current self. This isn't "time discrimination"; it is "identity discrimination."
  *   **The Counter:** You might argue welfare is what matters, not identity. But if the *subject* of the welfare is less connected to you, the *claim* on your current resources might be weaker.
  *   **Why it counts:** It challenges your analogy. Spatial distance doesn't degrade psychological connectedness; temporal distance does. If moral weight is tied to the strength of the normative relation between agents, and that relation decays over time, then a "discount rate" emerges naturally from the metaphysics of identity, not mere prejudice.

  ### 5. The Unfalsifiability Charge (Meta-Critique)
  **Is "It's All Risk" a Cop-Out?**

  You asked if reducing all discounting to risk/uncertainty makes the view unfalsifiable. **Yes, it does, and that is a problem.**

  *   **The Issue:** If a defender of PTP says "I discount the future at 5%," and you say "That's irrational," and they reply "No, it's a 5% risk of catastrophe per year," they have moved the goalposts. If we then posit a world with *zero* risk (as you did), and they still discount, the "risk" explanation is falsified.
  *   **The Problem:** Many economists and philosophers conflate *descriptive* discounting (how people behave) with *normative* discounting (how people should behave). By explaining away all PTP as "hidden risk," defenders make the claim "PTP is irrational" unfalsifiable, because any observed PTP can be retrofitted as "implicit risk assessment."
  *   **Your Exposure:** By insisting on ZPTP even in a risk-free world, you make your view *falsifiable* by the formal arguments (Koopmans/Infinity). You have traded the unfalsifiability of the risk-defense for the fragility of the mathematical-defense.

  ### Honest Take: Do Defenders Have Non-Feeling Arguments?

  Most defenders of *non-zero* pure time preference rely on one of three arguments that are not just "I feel it":

  1.  **The Dictatorship of the Future:** Without discounting, the infinite future dictates all present choices. If we care about present autonomy or the value of the "now," we must discount to prevent the future from morally colonizing the present. (This is a political/autonomy argument, not just psychological).
  2.  **Opportunity Cost of Capital (The Growth Argument):** Even with perfect foresight, if the economy grows, future people will be richer. Due to diminishing marginal utility of wealth, transferring resources to them is less valuable. *Note: You likely know this, but this justifies discounting *consumption*, not *utility*. If you hold ZPTP on *utility*, this doesn't apply.*
  3.  **The Non-Identity Problem:** Actions that change the future often change *who* exists. If your sacrifice changes the identity of future people, you aren't benefiting *them* (since they wouldn't exist otherwise); you are bringing into existence people with lives worth living. This complicates the "harm/benefit" calculus in a way that makes ZPTP aggregation difficult (Parfit's Repugnant Conclusion).

  ### Summary Map of Exposure

  | Argument Type | Severity | Why it hurts your view |
  | :--- | :--- | :--- |
  | **Formal (Koopmans/Infinity)** | **Fatal** | ZPTP makes utility functions undefined on infinite horizons. Decision theory breaks. |
  | **Practical (Oversacrifice)** | **Fatal** | Implies you should sacrifice almost everything for speculative long-term gains. |
  | **Metaphysical (Presentism)** | **Severe** | If the future doesn't exist, it can't hold moral weight. |
  | **Identity (Connectedness)** | **Moderate** | If identity fades, normative claims might fade with it. |
  | **Unfalsifiability of Risk** | **Meta** | You are right: "It's all risk" is a shield. Removing it exposes you to the Formal/Practical defeaters. |

  **Conclusion:** Your intuition is morally robust (it avoids arbitrary discrimination), but it is **mathematically fragile**. To hold ZPTP consistently, you must either:
  1.  Deny the possibility of an infinite future (finite horizon).
  2.  Accept that decision theory requires modification to handle infinite sums without discounting (e.g., overtaking criteria).
  3.  Accept the "fanaticism" implication that present sacrifice is morally mandatory to an extreme degree.

  The "Fatal" defeater is not that ZPTP is *evil*, but that it is **incompatible with standard aggregation functions over time.** You can't have ZPTP and a coherent calculus for infinite futures simultaneously.
