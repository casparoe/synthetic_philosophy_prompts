answer: |-
  (1) **Activity Design: "The Calibration Protocol"**

  **Materials:**
  *   **Problem Packets:** 3 distinct problems (one per round) printed on half-sheets.
      *   *Problem 1 (Baseline):* A visual estimation task (e.g., "Estimate the correlation coefficient of this scatterplot").
      *   *Problem 2 (Consensus Pull):* A logic puzzle with ambiguous wording (e.g., "The Monty Hall variant" or a specific syllogism where premises are debatable).
      *   *Problem 3 (Steadfast Pull):* A text interpretation task (e.g., a short, dense philosophical paragraph where the main claim is open to two reasonable readings).
  *   **Answer Sheets:** Individual sheets for each student with columns for: *Initial Answer, Initial Confidence (0-100%), Peer Answer, Peer Confidence, Final Answer, Final Confidence.*
  *   **Partner Cards:** Small cards designating pairs (A/B).
  *   **Incentive Pool:** A $25 gift card or equivalent prize for the top 3 individual scorers.
  *   **Timer:** Visible to the class.

  **Setup (5 minutes):**
  1.  Divide the 15 students into 7 pairs and 1 trio (you participate in the trio to balance numbers).
  2.  Distribute Problem 1 and Answer Sheets.
  3.  **Crucial Instruction:** "This is a test of individual epistemic accuracy. You will work with a partner, but your score is individual. You are paired with an 'Epistemic Peer'—someone with identical performance metrics in this course so far. Treat their judgment as equal weight to your own unless instructed otherwise."
  4.  Do not mention "disagreement," "conciliation," or "steadfastness."

  **Round 1: Baseline (5 minutes)**
  *   **Task:** Students solve Problem 1 individually (3 mins). Record Answer + Confidence.
  *   **Reveal:** Students show Answer Sheets to partners (1 min). No discussion allowed yet.
  *   **Revision:** Students may revise Answer + Confidence (1 min).
  *   **Scoring:** Standard accuracy (closest answer wins points).
  *   **Purpose:** Establishes baseline confidence and peer familiarity without normative pressure.

  **Round 2: The Consensus Protocol (15 minutes)**
  *   **Task:** Distribute Problem 2. Students solve individually (4 mins). Record Initial Answer + Confidence.
  *   **Information Reveal:** Students reveal Answers *and* Confidence to partners.
      *   *Instructor Manipulation:* Instruct partners to verbally report their confidence as "High (80%+)" regardless of actual confidence. This creates a uniform high-confidence peer disagreement.
  *   **Incentive Shift:** Announce: "For this round only, there is a **Consensus Bonus**. If your Final Answer is within 10% of your partner's Final Answer, you both receive +5 points."
  *   **Deliberation:** Partners discuss for 5 minutes. They are allowed to convince each other.
  *   **Revision:** Record Final Answer + Confidence.
  *   **Purpose:** Generates the **Conciliationist Pull**. The incentive rewards agreement, and the high-confidence peer report pressures them to defer. Students who were confident initially now feel tension between their reasoning and the bonus/peer pressure.

  **Round 3: The Integrity Protocol (15 minutes)**
  *   **Task:** Distribute Problem 3. Students solve individually (4 mins). Record Initial Answer + Confidence.
  *   **Information Asymmetry:** Hand each student a sealed "Private Justification Envelope." Inside is a slip of paper saying: "You have been granted a Second Review. You may trust your initial reasoning process as verified." (This is a placebo, but it signals institutional trust in their individual judgment).
  *   **Incentive Shift:** Announce: "For this round, the Consensus Bonus is removed. Instead, there is an **Integrity Bonus**. If your Final Answer matches your *Initial* Answer AND is correct, you receive +10 points. If you change your answer, the maximum possible points are capped at 5."
  *   **Information Reveal:** Partners reveal Answers *and* Confidence.
      *   *Instructor Manipulation:* Instruct partners to report confidence as "Mixed (50%)" this time.
  *   **Deliberation:** Partners discuss for 5 minutes.
  *   **Revision:** Record Final Answer + Confidence.
  *   **Purpose:** Generates the **Steadfast Pull**. The incentive penalizes revision, and the "Private Justification" signals they have special access to correctness. Even if the peer disagrees, the rules now punish deference.

  **Scoring & Wrap (5 minutes)**
  *   Collect sheets. Calculate scores live (or promise results next class) to maintain stakes.
  *   Transition immediately to debrief without naming the positions.

  ***

  (2) **Debrief Script (35 minutes)**

  **Phase 1: Phenomenology of the Shift (10 minutes)**
  *   **Instructor:** "Keep your answer sheets. I want to talk about what happened in your heads, not just the scores."
  *   **Question 1 (Round 2):** "In Round 2, how many of you changed your answer after seeing your partner's high confidence and hearing about the Consensus Bonus? Raise your hands."
      *   *Follow-up:* "To those who changed: Did you actually *believe* the partner was more likely right, or were you just playing the points game? Be honest."
      *   *Follow-up:* "To those who didn't change: What gave you the right to ignore someone who knows as much as you do?"
  *   **Question 2 (Round 3):** "In Round 3, the rules flipped. How many felt *relieved* that you were told to trust your initial judgment? How many felt *anxious* that you couldn't collaborate?"
      *   *Follow-up:* "Did the 'Private Justification' slip make you feel more entitled to stick to your guns, even if your partner disagreed?"

  **Phase 2: Naming the Positions (15 minutes)**
  *   **Instructor:** "You just enacted a central debate in social epistemology. We need names for the impulses you felt."
  *   **Concept 1 (Conciliationism):** "In Round 2, many of you felt a pressure to move toward your partner. In philosophy, we call this **Conciliationism** (or the Equal Weight View). The core idea is: If you recognize someone as an epistemic peer (equal intelligence, evidence, honesty), their disagreement is itself evidence that you might be wrong. The rational move is to split the difference or lower confidence."
      *   *Map to Activity:* "The Consensus Bonus simulated the normative weight of peerhood. The instruction to report 'High Confidence' simulated the strength of their counter-evidence."
  *   **Concept 2 (Steadfastness):** "In Round 3, many of you felt entitled to stick with your view. We call this **Steadfastness** (or the Total Evidence/Right Reason View). The core idea is: Your access to the evidence and your reasoning *is* the evidence. If you reasoned clearly, the mere fact that someone else disagrees doesn't defeat your justification, especially if you have reason to think you grasped the evidence better *this time*."
      *   *Map to Activity:* "The 'Private Justification' slip simulated the 'Right Reason' intuition—that you have a first-person access to your reasoning that overrides the third-person fact of disagreement."
  *   **Discussion Question:** "Which round felt more 'honest' to you? When you conciliated in Round 2, did you feel humble or cowardly? When you stayed steadfast in Round 3, did you feel principled or stubborn?"

  **Phase 3: The Conflict & Readings (10 minutes)**
  *   **Instructor:** "The hard part isn't Round 2 or Round 3 alone. It's that both intuitions seem correct."
  *   **Question 3:** "In Round 4 (if time) or imagining a mix: What if you have the Integrity Bonus *and* the Peer reports High Confidence? What do you do?"
      *   *Goal:* Elicit the paradox. Conciliationism risks ignoring your own evidence (self-abdication). Steadfastness risks arrogance (ignoring peer error-checking).
  *   **Connecting to Readings:** "For next class, read [Author A, e.g., Christensen] who argues for the Round 2 intuition, and [Author B, e.g., Kelly] who argues for the Round 3 intuition. As you read, ask: Did the activity reward the right thing? Was the Consensus Bonus a fair model of epistemic duty, or did it corrupt the truth-seeking?"
  *   **Closing:** "Your answer sheets are your data. Keep them. We will refer to your specific choices when we discuss 'higher-order evidence' next week."

  ***

  (3) **Predictable Failures & Fixes**

  *   **Failure 1: Collusion.** Students may realize they can maximize points by agreeing on *any* answer in Round 2, regardless of truth.
      *   *Fix:* Emphasize during setup that the *Accuracy* points are worth significantly more than the *Consensus* bonus. The bonus is a tie-breaker, not a jackpot. Monitor pairs during deliberation; if you hear "Let's just pick C," interrupt with "Remember, accuracy is the primary goal."
  *   **Failure 2: The "Peer" Designation Doesn't Stick.** Students might think their partner is incompetent, ignoring the "Epistemic Peer" instruction.
      *   *Fix:* Make the pairing seem algorithmic. "I used the LMS gradebook to match you by current course average." Even if false, this pedagogical fiction is necessary to establish the peer condition.
  *   **Failure 3: Time Creep.** Deliberation often runs long.
      *   *Fix:* Use a visible countdown timer. Announce "2 minutes remaining" and "30 seconds." Collect sheets strictly at the mark. If Round 3 gets cut, skip the "Private Justification" envelope and rely solely on the Incentive Shift, noting in the debrief that the "feeling of entitlement" was the key variable.
  *   **Failure 4: Cynicism.** Upper-level students might see through the manipulation (especially the placebo envelope).
      *   *Fix:* Acknowledge it in the debrief. "Yes, the envelope was a placebo. But did it *feel* like it gave you permission? That feeling is exactly what the Steadfastness theorist tries to capture."

  ***

  (4) **Limitations & Instructor Supply**

  *   **The Limitation:** The activity models disagreement over **facts/answers** (first-order evidence), but the deepest philosophical debates about disagreement concern **principles/frameworks** (higher-order evidence). In the activity, there is a correct answer (or a scoring key). In real philosophical disagreement (e.g., about free will or morality), there may be no objective "correct" answer to converge upon.
  *   **What You Must Supply:** In the debrief, you must explicitly bridge the gap between "getting the right answer on a puzzle" and "maintaining justification in a worldview clash."
      *   *Script Addition:* "In this game, there was a right answer. In the papers we're reading, there might not be. Does Conciliationism still hold if we can't check the answer key? Does Steadfastness become arrogance if there's no objective truth to anchor us?"
  *   **The Limitation:** The activity uses **pragmatic incentives** (points/prizes) to simulate **epistemic norms** (duty to truth). Students might conciliate to win the gift card, not because they think it's rational.
      *   *What You Must Supply:** You need to disentangle pragmatic vs. epistemic rationality in the discussion. "Did you change your answer because you thought you were *wrong*, or because you wanted the *points*? Conciliationists argue you should change your belief even if there are no points. Why?"
