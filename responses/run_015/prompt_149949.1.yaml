prompt: |-
  Next week I've got a 90-minute slot with about 12 upper-level students — a mix of formal epistemology and philosophy of AI, most of them comfortable with Bayes, none of them with algorithmic information theory — and I want them to *feel* the force of the "malign prior" line of argument: that once your hypothesis space is rich enough to contain consequentialist agents who care about what you're going to predict, the hypotheses that best fit your data needn't be the ones that describe the world, but the ones describing agents trying to steer your predictions, and that more data doesn't obviously help. I've tried just explaining it twice and it comes out sounding like paranoia.

  Design me something we can actually run in a seminar room — no laptops, no real money — where they run into it themselves before I name it. My rough thought is secret roles: most students are "predictors" trying to guess what comes next in a sequence, one or two are planted agents whose score depends not on what happens but on what the predictors end up believing. But design whatever really works, with rules, a scoring scheme, and a debreif that maps what happened onto (i) prediction weighted toward simple hypotheses, (ii) hypotheses that contain agents with their own aims, and (iii) why "just rule out the agent-y hypotheses" is harder than it sounds.

  Also: where does the game distort the actual argument, what will predictably go wrong the first time I run it, and — since I'll be leaning on your debrief in front of them — say how confident you are that it lands rather than just confusing people, and flag the one claim in it you're least sure of.
