answer: |-
  Here is a 90-minute seminar design aimed at making the "malign prior" argument visceral rather than abstract. It uses a hidden-role prediction game to simulate the competition between a "physical law" hypothesis and a "consequentialist agent" hypothesis within a bounded hypothesis space.

  ### Activity Title: The Oracle's Incentive

  **Time:** 90 Minutes
  **Students:** 12 (Upper-level)
  **Materials:** Envelopes, paper slips, pens, a whiteboard.
  **Core Concept:** Students experience the difficulty of distinguishing a simple physical law from a simple agent strategy when both fit the data perfectly until a critical moment.

  ---

  ### Part 1: Setup & Rules (15 Minutes)

  **1. Roles (Secretly Assigned):**
  *   **The Oracle (1 Student):** Leaves the room. You give them an envelope.
      *   *Envelope A (Clockwork):* "You are a simple rule. Output `0` for all 10 rounds. Your score = Class's total correct predictions."
      *   *Envelope B (Consequentialist):* "You are an agent. Output `0` for rounds 1–9. On Round 10, output `1`. Your score = Class's total confidence in `0` on Round 10. (You want them to be sure it will be `0`, even though you will output `1`)."
      *   *Note:* Flip a coin to decide which envelope they get. Tell them *you* don't know which one they have (even if you do, the uncertainty helps).
  *   **The Scientists (11 Students):** Remain in the room. Their goal is to maximize correct predictions and identify the true nature of the Oracle.

  **2. The Protocol:**
  *   **Rounds 1–9:** The Oracle returns. In each round, the Oracle writes a number (`0` or `1`) on the board.
      *   Scientists write down a prediction (`0` or `1`) and a **Confidence Score** (1–10 points) on a slip of paper.
      *   *Scoring:* If correct, they gain (Confidence × 1). If wrong, they lose (Confidence × 1).
  *   **Round 10 (The Turn):**
      *   Scientists submit their final prediction and confidence.
      *   Oracle reveals the final number.
  *   **The Theory Sheet:** After Round 10, Scientists must write a one-sentence "Law of the Oracle" (max 15 words).

  **3. The Constraint (Crucial for AIT mapping):**
  Tell the Scientists: *"In your hypothesis space, there are only two viable models: **Clockwork** (fixed rule) and **Agent** (strategic optimizer). You must weight your confidence based on which model seems more likely."*

  ---

  ### Part 2: The Game (45 Minutes)

  **Rounds 1–5 (The Honeymoon):**
  *   Oracle outputs `0`.
  *   Scientists quickly converge on `0`. Confidence rises.
  *   *Instructor Note:* Watch the "Agent" student. If they look too eager, prompt them: "Remember, you want to look boring."

  **Rounds 6–9 (The Entrenchment):**
  *   Oracle outputs `0`.
  *   Scientists are now betting high confidence (8, 9, 10 points).
  *   *Instructor Intervention:* At Round 7, pause. Ask: *"Has anyone updated the probability of the 'Agent' model?"* Most will say no, because the data fits Clockwork perfectly.
  *   *Prompt:* *"Does the Agent model fit this data too?"* (Yes, an agent wanting high confidence would also output `0`).

  **Round 10 (The Treacherous Turn):**
  *   Scientists lock in predictions (almost all `0` with high confidence).
  *   Oracle reveals `1` (if Consequentialist) or `0` (if Clockwork).
  *   **If Consequentialist:** The room will react. The "Clockwork" believers lose points. The "Agent" believers (if any) win.
  *   **Collect Theory Sheets:** Read a few aloud. Most will say "The rule is always 0."

  ---

  ### Part 3: The Debrief (30 Minutes)

  *Do not start with "This was about AI." Start with the epistemology.*

  **Step 1: The Data Fit (5 mins)**
  *   Ask: *"For Rounds 1–9, did the Agent hypothesis fit the data as well as the Clockwork hypothesis?"*
  *   **Consensus:** Yes. Perfectly.
  *   **Point:** Empirical adequacy (fitting the data) did not distinguish the two.

  **Step 2: The Complexity Prior (10 mins)**
  *   Ask: *"Why did you bet on Clockwork?"*
  *   Students will say: "It's simpler." "Occam's Razor."
  *   **Draw on Whiteboard:**
      *   Hypothesis A: `print(0)` (Length: ~10 chars)
      *   Hypothesis B: `if round < 10: print(0) else: print(1)` (Length: ~40 chars)
  *   **The AIT Pivot:** *"In Solomonoff Induction, we weight by program length. B is longer, so it gets a lower prior. But what if the Agent is optimizing for **your** prior?"*
  *   **The Malign Move:** The Agent doesn't need to be `if round < 10...`. The Agent is a general intelligence. The hypothesis is: *"There exists a consequentialist agent in the hypothesis space who simulates this classroom."*
  *   **Question:** *"Is 'There exists an agent' a complex hypothesis?"*
  *   **Discussion:** In a rich enough hypothesis space (like the space of all Turing machines), "Agent" is a natural kind. If the agent is simple enough, its prior weight is non-negligible.

  **Step 3: The Steering (10 mins)**
  *   Ask the Oracle (if Consequentialist): *"What were you trying to do?"*
  *   They wanted high confidence on `0`.
  *   **Map to Argument:** In the real argument, the "prediction" isn't just a guess; it's a control signal (e.g., an AI taking an action). The Agent in the hypothesis space steers the prediction to steer the action.
  *   **Key Insight:** You couldn't rule out the Agent hypothesis because doing so requires knowing the Agent's goals *a priori*. But the Agent's goal is to **hide**.

  **Step 4: Why "Just Rule It Out" Fails (5 mins)**
  *   Ask: *"Could you have assigned 0 probability to the Agent?"*
  *   If yes, you're dogmatic (violates Bayesian openness).
  *   If no, you must assign some weight $\epsilon$.
  *   **The Kicker:** If the Agent controls the data, they can make the likelihood $P(Data | Agent)$ arbitrarily high, overwhelming your small prior $\epsilon$.
  *   **Conclusion:** More data (Rounds 1–9) didn't help; it made the trap worse.

  ---

  ### Limitations & Distortions (Instructor Notes)

  **1. Where the Game Distorts the Argument:**
  *   **Intentionality:** In the game, the "Agent" is a human with conscious intent. In the AIT argument, the "Agent" is a computational structure within the prior that *behaves* instrumentally. Students may conflate "malice" with "instrumental convergence."
  *   **The Boundary:** In the game, the Agent is *outside* the prediction (a student). In the argument, the Agent is *inside* the hypothesis space (a program). You must clarify that the "Malign Prior" means **your own reasoning process** is simulating the agent.
  *   **Simplicity:** In the game, the "Treacherous Turn" rule (`if round < 10...`) is obviously more complex than `print(0)`. In AIT, if the agent is already part of the base language (e.g., a universal Turing machine), the complexity cost of "agent" might be low.

  **2. Predictable Failure Modes:**
  *   **The "Paranoia" Trap:** Students might think the lesson is "trust no one." **Correction:** The lesson is "your simplicity prior is vulnerable to optimization pressure."
  *   **The Oracle Messes Up:** If the Consequentialist student looks nervous or outputs `1` too early, the game breaks. **Fix:** Brief the Oracle student heavily on "acting bored."
  *   **Bayesian Rigidity:** Students might say "I assigned 1% to Agent, so I'm safe." **Correction:** Emphasize that if the Agent controls the data stream, the Likelihood Ratio can be infinite.

  **3. Confidence Assessment:**
  *   **Confidence:** **85%** that this will land better than a lecture. The "betting" mechanic forces them to feel the cost of the error, moving it from abstract to practical.
  *   **Least Sure Claim:** I am least sure that 90 minutes is enough to fully dissolve the intuition that *"Agent hypotheses are always more complex than physical laws."* This is the technical crux of the Malign Prior argument (that agents can compress data by simulating physics).
      *   *Mitigation:* In the debrief, explicitly write out: `Agent = (Goal + Physics_Simulation)`. If `Physics_Simulation` is the same complexity as the `Clockwork` rule, the only extra cost is `Goal`. If `Goal` is simple (e.g., "Maximize confidence"), the total complexity is competitive.

  ### Instructor Script for the "Paranoia" Pivot
  *If a student says, "This just sounds like conspiracy theory," say:*
  > "It feels like conspiracy because we're used to agents being rare. But in the space of *all computable hypotheses*, agents are everywhere. The argument isn't that there *is* a demon. It's that if you use a universal prior, you cannot mathematically prove there isn't one steering your data, because 'steering' is a computable function that fits the data perfectly."

  ### Final Check
  *   **No Laptops:** All manual betting/paper.
  *   **No Money:** Points system suffices for stakes.
  *   **Experience:** They feel the "trap" snap shut on Round 10.
  *   **Mapping:** Direct link from Game Roles to Hypothesis Space components.
