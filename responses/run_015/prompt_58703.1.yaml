      *   *Problem:* Traditional AI safety talks about "side effects" or "impact regularization" often rely on comparing state $S_t$ to a baseline $S_{baseline}$ or measuring energy/reversibility. The user argues these fail because they don't capture *agency* and *authority*.
      *   *Question:* How can we define "acceptable impact" for AI assistants in terms of the user's procedural capacity to oversee and reverse actions, rather than substantive value judgments?
