answer: |-
  **Project Title:** Procedural Impact: Defining Safe AI Assistance Through Principal Capacity

  **1. Central Question**
  In AI safety engineering, we often instruct assistants to "avoid side effects." However, any useful task changes the world. The central question of this project is: *Can we define "acceptable impact" for AI assistants procedurally, based on the principal's capacity to detect, understand, and undo changes, rather than by comparing outcomes to a baseline or measuring physical reversibility?*

  My hypothesis is that safety is not about preserving a specific state of the world, but about preserving the human principal's authority and control. An action is safe if the user can reasonably notice what happened, comprehend why it happened, and revert it if necessary. This project seeks to clarify this definition and test its utility against concrete engineering scenarios.

  **2. The Problem: Why Baselines and Reversibility Fail**
  Current approaches to impact regularization in AI generally rely on two intuitions, both of which break down in practical engineering contexts.

  The first is **baseline comparison**. We tell the AI to minimize the difference between the world after the action and the world if the AI had done nothing. This fails because "doing nothing" is often not the optimal state. For example, a file-management assistant that archives old clutter improves the system state compared to inaction, yet it creates a large "difference" from the baseline. If we penalize difference, we penalize utility. Furthermore, counting differences requires knowing which differences matter. Deleting a log file and deleting a source file look identical in terms of bit-changes, but their importance differs entirely based on human context.

  The second is **physical reversibility**. We might instruct the AI to only take actions that can be undone. This smuggles in hidden value judgments. Almost anything is reversible with enough resources. I can restore a deleted file from a tape backup, but it may take three days and $10,000. Is that "reversible"? A purely physical definition ignores cost, time, and cognitive load. It fails to capture the *agent-relative* nature of safety: safe for whom, and at what cost to them?

  Both approaches attempt to measure impact objectively, outside the relationship between the user and the tool. They miss the core ethical constraint: the AI is an agent acting on behalf of a principal. Safety is about the integrity of that delegation.

  **3. Proposed Method: Conceptual Clarification via Case Studies**
  Rather than attempting a formal mathematical proof or conducting empirical user studies, this project will use **conceptual analysis tested against engineering case studies**.

  Formal proofs are currently premature; we lack agreement on the basic definitions of "impact." User studies are out of scope for a three-month part-time timeline and require ethical review boards and recruitment infrastructure I do not possess. Instead, I will treat the definition of "Procedural Impact" as a design specification and stress-test it against two specific cases from my professional work:

  1.  **The File-Management Case:** An assistant archives old shared-drive files to reduce clutter.
      *   *Baseline View:* High impact (many bits changed).
      *   *Reversibility View:* Technically reversible (backups exist).
      *   *Procedural View:* Did the system notify the user? Can the user find the archive? Is the folder structure intelligible? If the user cannot find the files without IT support, the procedural capacity is broken, and the action is unsafe.
  2.  **The Code-Refactoring Case:** An assistant refactors a repository and notifies teammates.
      *   *Baseline View:* High impact (code structure changed).
      *   *Reversibility View:* Reversible via git revert, but may cause merge conflicts.
      *   *Procedural View:* Did the notification explain *why* changes were made? Can a teammate audit the logic without reading every line? If the change is understandable and the revert path is clear, it is safe.

  I will analyze these cases to refine the triad of **Detection, Understanding, and Undoing**. I will ask: What counts as "reasonable effort"? How do we specify "intelligibility" in a system prompt? The output will be a refined conceptual framework that distinguishes between *nuisance* (easy to fix) and *harm* (loss of control).

  **4. Success and Failure Criteria**
  **Success** looks like a written framework (approx. 10–15 pages) that provides clear criteria for distinguishing safe from unsafe impact in the two test cases, where baseline and reversibility metrics yield ambiguous or incorrect results. Specifically, success means producing a "Procedural Impact Checklist" that an engineer could theoretically use to evaluate an AI agent's proposed plan before execution.

  **Failure** would take two forms. First, if the "reasonable effort" clause proves too vague to be operationalizable (e.g., if it collapses back into "do what is valuable"), the project fails to offer a distinct alternative. Second, if the analysis shows that the Procedural Impact definition yields the same safety verdicts as simple baseline comparison in all tested scenarios, the framework is redundant.

  **5. Scope and Feasibility Assessment**
  This project is scoped specifically for a three-month, part-time fellowship (approx. 10 hours/week).

  *   **Month 1:** Literature scan (informal) and rigorous definition of the Detect-Understand-Undo triad. Drafting the initial framework.
  *   **Month 2:** Deep-dive analysis of the File-Management and Code-Refactoring cases. Iterating on the framework based on edge cases discovered during analysis.
  *   **Month 3:** Synthesis and write-up. Finalizing the "Procedural Impact Checklist" and a summary essay.

  **Risks:** The primary risk is scope creep into building a software prototype. I must remain disciplined that this is a *conceptual* project, not a product build. Another risk is that the "reasonable effort" metric remains subjective. I will mitigate this by anchoring "reasonable" to specific engineering constraints (e.g., time-to-revert, documentation requirements) rather than abstract user feelings.

  **Conclusion**
  AI safety research often oscillates between abstract philosophy and heavy empirical measurement. There is a gap for "engineering philosophy": rigorous conceptual work grounded in the reality of system design. By shifting the definition of impact from *state changes* to *principal capacity*, this project aims to provide a tractable mental model for building assistants that remain tools, rather than becoming unmanageable agents. This fellowship would provide the dedicated time to formalize this intuition into a shareable resource for the safety community.
