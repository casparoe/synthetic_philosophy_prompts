  CLAIM ID: 904-F
  STATUS: Appeal Denied
  Patient reported right knee agony during stress test. HOR telemetry indicated representation of left knee agony. Per Policy 7.2, conscious content is determined exclusively by the HOR, not the first-order target. Patient was consciously experiencing left knee pain. No pathology found in left knee. Right knee pain occurred without conscious awareness. Claim for conscious suffering denied; claim for phantom left knee pain lacks medical necessity. Billing adjusted to reflect unconscious physiological damage only. Reviewer: Dr. Aris.

  CLAIM ID: 112-X
  STATUS: Eligibility Review
  Neonates and nonhuman mammals lack cognitive architecture for HOR generation. Claims for infant distress or animal suffering ineligible for subjective experience reimbursement. Conversely, Smart Thermostat (Model T) maintains internal state representing its own temperature reading. This meets HOR criteria for self-monitoring systems. Approved for Environmental Sentiment stipend. Device qualifies as a conscious entity under current guidelines. Tax ID updated.

