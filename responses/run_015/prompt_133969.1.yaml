  Effective immediately, reimbursement for subjective experience requires verified documentation of a distinct Higher-Order Representation (HOR) directed at the first-order state. First-order states occurring without a corresponding HOR are classified as non-conscious physiological events. Pain without awareness of pain is not billable under Patient Experience codes. Providers must submit HOR telemetry logs alongside nociceptive data. Failure to demonstrate the higher-order thought renders the experience invisible to billing.

