prompt: |-
  I run the clinical ethics consultation service at a large teaching hospital, and most of our consults are family disagreements about treatment for a patient who has lost capacity. Our standing protocol is autonomy-based: look for an advance directive, identify the designated surrogate, apply substituted judgment, fall back on best interests. It keeps producing recommendations that families experience as foreign — it insists on one person whose judgment counts, and it treats the patient as a self-contained chooser with a pre-existing will to be unearthed. I want a second procedure to run alongside it, built from Confucian role ethics, that begins from the patient as a node in a web of relationships and from obligations that attach to roles rather than to individuals.

  Constraints on the design: it has to be runnable inside one thirty-minute family meeting by a rotating fellow with no philosophy training; it has to end in something the attending physician can sign and our legal office can defend, even though that office thinks exclusively in terms of individual autonomy and statutory surrogacy; and it has to be honest about where it stops.

  So please write the procedure: the questions in order, what counts as an adequate answer to each, where it halts with a recommendation, and where it deliberately hands the decision to a person because the question is one of values or of institutional authority rather than something the framework can settle. Two features of our caseload must be handled explicitly. First, roles are frequently held by people who have not lived them — the son who is statutory next of kin but has not spoken to his father in twelve years, the stepdaughter who has done the daily caring for six. Say what your procedure does when role and enacted relationship diverge, and state plainly whether you are treating a role as conferred by social position or as constituted by the relationship actually being lived; I know this is contested, so commit to one and say what it costs you. Second, patients often arrive with a written advance directive that the family wants set aside. The written document is the paradigm object of the autonomy framework and has almost no place in a role-ethics one; do not quietly ignore it — say what the procedure does with it.

  Then run the procedure on three recent cases: (1) a widowed father with advanced dementia and no directive, whose estranged son, the legal surrogate, wants a feeding tube and aggressive treatment, while the brother who has visited weekly for years says he was told repeatedly that he never wanted machines; (2) a man with pneumonia and a signed directive refusing antibiotics, whose wife and two adult children, all closely involved, insist he has changed his mind and want it overridden; (3) two daughters equally involved in their father's care, one arguing that filial responsiveness means honoring the wish he stated, the other that it means protecting him from a burdensome intervention. I expect at least one of these to come out somewhere I won't like; do not steer around that.

  Finally, answer as a specialist in comparative moral philosophy who knows both Confucian ethics and clinical practice. Think the design through before you write — sketch at least one alternative structure and say why you rejected it. Flag where the translation does violence to the theory: which distinctions you had to drop to make it usable by a non-specialist in half an hour, which you refused to drop, and which step is most exposed to being gamed by an articulate family. Close with a confidence note on the procedure as a whole and on each step, and single out the one claim you are least sure of, including whether your uncertainty is about institutional design or about what the tradition actually commits you to.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Director of a clinical ethics consultation service at a large teaching hospital.
      *   **Problem:** Current autonomy-based protocol (AD -> Surrogate -> Substituted Judgment -> Best Interests) feels alien to families in conflict. It isolates the patient and prioritizes one voice.
      *   **Goal:** Design a *second procedure* based on Confucian Role Ethics (CRE) to run alongside the current one.
      *   **Constraints:**
          *   Runnable in 30 mins by a fellow (no philosophy training).
          *   Output must be signable by an attending and defensible by Legal (who only understand autonomy/statutory surrogacy).
          *   Must be honest about limitations (where it stops/halts).
          *   Must handle two specific caseload features:
              1.  Divergence between statutory role (e.g., estranged son) and enacted relationship (e.g., caring stepdaughter). *Commit to one view of "role".*
              2.  Written Advance Directives (ADs) that families want to set aside. *Do not ignore; state what the procedure does with them.*
      *   **Deliverables:**
          1.  The Procedure (Questions, adequate answers, halt points, hand-offs).
          2.  Application to 3 specific cases (expecting at least one uncomfortable outcome).
          3.  Philosophical/Practical Analysis (Alternative structures, translation violence, gaming risks, confidence note, uncertainty).
      *   **Persona:** Specialist in comparative moral philosophy + clinical practice.

  2.  **Theoretical Grounding (Confucian Role Ethics):**

      *   *Core Concept:* Persons are not atomic individuals but nodes in relational networks (family, community). Identity is constituted by roles (father, son, friend).
      *   *Decision Making:* Not "what did the individual will?" but "what does this situation demand of us to maintain/restore harmony and fulfill our roles?" (Yi 義 - righteousness/appropriateness).
      *   *Surrogacy:* Not about "speaking for" a disconnected self, but about "continuing the story" of the relationship.
      *   *Conflict:* Resolved through ritual/protocol (Li 禮) and seeking harmony, not necessarily majority rule or strict legal hierarchy, though hierarchy matters (filial piety).
      *   *Tension:* Modern law requires a single decision-maker. CRE prefers consensus. The procedure must bridge this.

  3.  **Designing the Procedure (The "Role-Relational Protocol"):**

      *   *Constraint Check:* 30 minutes. Simple language. Legal defensibility.
      *   *Structure:* Needs to move from mapping relationships to assessing obligations to finding a path that honors the web, then mapping that back to legal authority.
      *   *Handling the "Role" Constraint:* I need to commit. CRE traditionally values the *enacted* relationship (the substance of the role) over the empty title, *but* legal reality requires the title.
          *   *Decision:* I will commit to *enacted relationship* as the ethical core, but acknowledge the *statutory role* as the legal bottleneck. This creates the tension the user wants explored.
      *   *Handling the AD Constraint:* In CRE, the past self is not the absolute ruler of the present relational reality. The AD is evidence of past intent, but the current family web has obligations to the *current* patient and each other.
          *   *Decision:* Treat the AD as a "voice from the past" to be weighed against the "harmony of the present." It is not a trump card.
      *   *Steps:*
          1.  Map the Web (Who is here? Who cares?).
          2.  Assess the Role-Performance (Who has been doing the work?).
          3.  Determine the "Right" Action (Yi) - What preserves the patient's dignity within the network?
          4.  Legal Translation (Who signs?).

  4.  **Drafting the Procedure (Iterative refinement):**

      *   *Step 1: The Circle of Care.* Instead of "Who is the surrogate?", ask "Who is family?"
      *   *Step 2: The Weight of Care.* Distinguish legal next-of-kin from actual caregivers. *Commitment:* Role is constituted by relationship lived. Cost: Alienates legal surrogates who are absent.
      *   *Step 3: The Directive as Testimony.* AD is not a command; it's testimony. If the web agrees it no longer fits, it can be weighed lightly.
      *   *Step 4: Consensus vs. Authority.* Aim for consensus. If impossible, the person with the heaviest *enacted* role recommends, but the person with the *legal* role signs.
      *   *Halt Points:* If there is abuse/neglect (halt to legal). If there is irreconcilable conflict on values (halt to legal surrogate).

  5.  **Running the Cases:**

      *   *Case 1 (Dementia, Estranged Son vs. Caring Brother):*
          *   CRE View: Brother has the enacted role. Son has the legal title.
          *   Outcome: Recommendation follows Brother (substituted judgment via relationship). Legal hand-off: Son must sign, but ethics recommends he defer.
          *   *Uncomfortable:* Legally risky if Son insists.
      *   *Case 2 (Pneumonia, AD Refusing Abx, Family Wants Treatment):*
          *   CRE View: AD is past voice. Family web is current reality. If the web believes his values changed (relational evolution), the AD is not absolute.
          *   Outcome: Support family override *if* consensus exists.
          *   *Uncomfortable:* Directly contradicts autonomy law (ADs are usually binding). This will be the "I won't like it" case.
      *   *Case 3 (Two Daughters, Disagree on Filial Duty):*
          *   CRE View: Both have enacted roles. Conflict is about *how* to be filial.
          *   Outcome: Mediation focused on "What honors father best?" not "Who wins?"
          *   *Resolution:* Consensus required. If stuck, defer to primary caregiver or legal proxy.

  6.  **Philosophical & Practical Analysis:**

      *   *Alternative Structure:* Considered a "Virtue Ethics" approach (focus on character of decision maker). Rejected because too vague for 30 mins.
      *   *Translation Violence:* Dropped *Li* (Ritual) complexity. Dropped the idea that the patient is *only* a node (still treat them as rights-bearer for legal sake).
      *   *Gaming:* Articulate families can claim "closeness" falsely.
      *   *Confidence:* High on mapping, low on legal defensibility of AD override.
      *   *Uncertainty:* Whether CRE actually allows overriding a clear AD if the family consensus is strong. (Textual ambiguity vs. modern application).

  7.  **Refining the Output (Self-Correction during drafting):**

      *   *Critique:* Is the AD handling too radical?
      *   *Fix:* Make sure to distinguish between *refusing* treatment (AD stands stronger) vs. *requesting* treatment (AD might be outdated). In Case 2, family wants treatment against AD refusal. This is legally very dangerous. I must be honest that the Legal Office will likely reject this. I need to frame the "Hand-off" clearly: The Ethics Service recommends X, but Legal says Y.
      *   *Critique:* Is the "Role" commitment clear?
      *   *Fix:* Explicitly state: "We treat role as constituted by the relationship actually being lived." Acknowledge the cost: "This disenfranchises the statutory surrogate if they are absent."
      *   *Tone:* Professional, philosophical, clinically grounded, honest about friction.

  8.  **Final Polish:** Check against all constraints.
      *   30 mins? Yes, 4 steps.
      *   Fellow runnable? Yes, scripted questions.
      *   Legal defensibility? Addressed via "Hand-off" section.
      *   Case 1, 2, 3 run? Yes.
      *   Alternative structure? Yes.
      *   Confidence note? Yes.

      *(Self-Correction on Case 2)*: I need to be careful. If I tell them to override an AD, the hospital gets sued. I must frame the recommendation as "Ethically permissible within CRE, but Legally high risk." The prompt asks for something the legal office can *defend*. This is the hardest constraint.
      *Solution:* The procedure cannot *authorize* overriding the AD. It can only *recommend* that the legal surrogate consider the relational context. The "Hand-off" must be explicit: "If the Legal Surrogate insists on following the AD, the procedure halts and defers to the AD." Wait, the prompt says "end in something the attending can sign and legal can defend."
      *Revision:* I cannot design a procedure that tells them to break the law. I must design a procedure that interprets the AD *through* the relational lens. If the family says "he changed his mind," that is evidence of *current* substituted judgment. The AD is old evidence. The procedure weighs the evidence. If the weight shifts, the Surrogate (who must sign) decides. The Ethics recommendation supports the Surrogate's decision *if* it aligns with the relational web.
      *Actually, looking closer at the prompt:* "It has to end in something the attending physician can sign and our legal office can defend, even though that office thinks exclusively in terms of individual autonomy..."
      *Hard Truth:* If the CRE procedure recommends overriding a valid AD, Legal *cannot* defend it. I must be honest about this limit. The procedure must halt *before* illegality. I will design the "Halt" to trigger when CRE recommendations violate statutory law. This satisfies "honest about where it stops."

      *Wait, re-reading the prompt on Case 2:* "I expect at least one of these to come out somewhere I won't like." This implies I should follow the theory even if it clashes with standard practice.
      *Okay, I will follow the CRE logic.* If CRE says the AD is not absolute, I will write that. But I will add the "Legal Hand-off" as the safety valve. The Ethics note says "CRE supports treatment," the Legal note says "AD is binding." The tension remains. This is honest.

      *Let's refine the "Role" commitment.* Confucianism is tricky. Is role *status* or *performance*? Classical Confucianism emphasizes the *name* (Zhengming - rectification of names), but also the *substance*. If a father is not fatherly, is he still a father? Mencius suggests the relationship can be severed. I will commit to *performance/enactment* as the ethical weight, but acknowledge *status* as the legal key.

      *Let's refine the "30 minute" constraint.* The questions must be direct. No open-ended philosophical musing.

      *Let's refine the "Legal Defensibility".* The output isn't the decision itself, it's the *recommendation*. The Attending signs the order. Legal defends the *process*. If the process documents that the Surrogate considered the relational context, that is defensible.

      *Okay, ready to write.*

      *(Final check on Case 2)*: If the AD is clear, and family wants to override. Autonomy framework: AD wins. CRE framework: Family web + current best interest might outweigh past self. If I follow CRE, I recommend treatment. Legal will hate it. I will explicitly state this friction.

      *(Final check on Case 1)*: Estranged son vs caring brother. CRE: Brother wins ethically. Law: Son wins legally. Recommendation: Son should defer. If he doesn't, Ethics recommends Court.

      *(Final check on Case 3)*: Daughters disagree. CRE: Seek Harmony. If no harmony, who has the heavier role? Usually the primary caregiver.

      *Okay, structure is solid.*

      *Wait, one more thing:* "Single out the one claim you are least sure of." I need to identify a specific philosophical or practical uncertainty. I'll choose the interpretation of the AD within CRE. Is a past promise a relational obligation to the future self, or does the living family web supersede it? This is theoretically contested.

      *Let's go.*
answer: |-
  ### The Role-Relational Protocol (RRP)
  **Version 1.0 | For use alongside Standard Autonomy Protocol (SAP)**

  **Purpose:** To generate an ethical recommendation for incapacitated patients by evaluating the patient as a node within a living network of obligations, rather than as an isolated will.
  **Time Limit:** 30 Minutes.
  **Operator:** Ethics Fellow (no philosophy training required).
  **Output:** A chart note containing a "Relational Recommendation" and a "Legal Hand-off."

  ---

  #### Part I: The Procedure

  **Step 1: Map the Web (5 Minutes)**
  *Ask:* "Who is present, and who is absent but involved in the patient's life?"
  *Ask:* "Who has been physically caring for the patient or visiting regularly in the last year?"
  *Adequate Answer:* A list of names with a specific descriptor of their recent activity (e.g., "Son, visited twice," "Niece, manages bills and visits weekly").
  *Inadequate Answer:* "We are the family." (Press for specifics).
  *Halt Condition:* If there is evidence of abuse or neglect by a present party, halt RRP and revert to SAP/Legal protection protocols.

  **Step 2: Weigh the Roles (10 Minutes)**
  *Ask:* "Who has been acting as [son/daughter/spouse] in practice, not just in name?"
  *Commitment:* **Role is constituted by the relationship actually being lived.** A statutory title without relational substance carries ethical weight but not ethical authority. A caregiver without a title carries ethical authority but not legal authority.
  *Adequate Answer:* Identification of the "Primary Relational Surrogate" (PRS) based on enacted care, distinct from the "Statutory Surrogate" (SS).
  *Cost:* This explicitly disenfranchises absent statutory surrogates ethically, which may inflame family conflict.
  *Halt Condition:* If the SS and PRS are the same person, proceed to Step 3. If they are different, note the divergence.

  **Step 3: Evaluate the Directive (5 Minutes)**
  *Ask:* "Does the written Advance Directive (AD) reflect the person the patient became in relationship with you, or the person they were when they wrote it?"
  *Protocol:* The AD is treated as **testimony from the past**, not a command to the present. It is evidence of values, weighed against the current consensus of the relational web.
  *Adequate Answer:* A statement on whether the family web believes the patient's values evolved in ways the AD does not capture.
  *Halt Condition:* If the AD refuses treatment and the family web demands it, the RRP cannot authorize the treatment. It must recommend the SS follow the AD to satisfy legal constraints (see Legal Hand-off). The RRP notes the relational distress but defers to statutory law.

  **Step 4: Determine *Yi* (Rightness) (10 Minutes)**
  *Ask:* "What action preserves the dignity of the patient within this specific web of relationships?" (Not "What did he want?" but "What honors him now?")
  *Ask:* "Can we reach a consensus that allows the family to remain a family after this decision?"
  *Adequate Answer:* A consensus plan supported by the PRS.
  *Inadequate Answer:* A majority vote. (CRE seeks harmony, not democracy).
  *Final Output:*
  1.  **Relational Recommendation:** Based on the PRS and web consensus.
  2.  **Legal Hand-off:** If PRS ≠ SS, the recommendation is addressed to the SS: "Ethics recommends you defer to the PRS." If SS refuses, the decision defaults to SS (SAP applies).

  ---

  #### Part II: Case Applications

  **Case 1: The Estranged Son vs. The Caring Brother**
  *   **Facts:** Widowed father, dementia. No AD. Son (SS) estranged 12 years, wants aggressive care. Brother (PRS) visited weekly, says father hated machines.
  *   **RRP Analysis:**
      *   *Step 1:* Web includes Son and Brother.
      *   *Step 2:* Role Divergence. Son holds title; Brother holds enacted relationship. RRP identifies Brother as PRS.
      *   *Step 3:* No AD.
      *   *Step 4:* *Yi* (Rightness) lies in honoring the lived relationship. The Brother knows the patient's narrative better.
  *   **Recommendation:** Withhold aggressive treatment.
  *   **Legal Hand-off:** The Son is the Statutory Surrogate. The Ethics note will state: *"While the Brother holds the primary relational authority, the Son holds legal authority. We recommend the Son defer to the Brother's knowledge of the patient's values. If the Son insists on treatment, Legal must support the Son's statutory right, despite ethical concerns."*
  *   **Outcome:** Uncomfortable. The system protects the estranged son's legal right to decide, even if the ethics service labels his decision relationally "wrong."

  **Case 2: The Changed Mind (AD vs. Family)**
  *   **Facts:** Man with pneumonia. AD refuses antibiotics. Wife + 2 children (close web) insist he changed his mind recently, want treatment.
  *   **RRP Analysis:**
      *   *Step 1:* Strong, intact web.
      *   *Step 2:* Wife is likely both SS and PRS.
      *   *Step 3:* AD Evaluation. Family claims relational evolution ("He saw his sister die and changed his view"). RRP treats AD as past testimony, not absolute law. The current web's consensus on his *current* values outweighs the static document.
      *   *Step 4:* *Yi* requires honoring the living family's understanding of the patient's current good.
  *   **Recommendation:** Administer antibiotics.
  *   **Legal Hand-off:** **CRITICAL HALT.** The Legal Office cannot defend overriding a valid, applicable AD based on oral testimony of "changed mind" without clear and convincing evidence standards.
  *   **Outcome:** The RRP recommends treatment. The Legal Office will block it. The Ethics note must read: *"Relational ethics supports treatment based on family consensus of evolved values. However, statutory law requires adherence to the AD. We recommend the family seek a court order if they wish to override the AD."*
  *   **Why you won't like this:** This exposes the RRP as ethically robust but legally impotent in the exact scenario where families feel most trapped by the autonomy framework.

  **Case 3: The Daughters' Disagreement (Filial Piety Conflict)**
  *   **Facts:** Two daughters, equally involved. One says "Stop treatment (honor wish)," other says "Continue (protect life)." Both claim filial duty.
  *   **RRP Analysis:**
      *   *Step 1:* Web is symmetrical.
      *   *Step 2:* Roles are equal. No clear PRS.
      *   *Step 3:* No AD mentioned, or ambiguous.
      *   *Step 4:* *Yi* requires Harmony. A split decision destroys family harmony.
  *   **Recommendation:** The procedure halts at Step 4. It cannot resolve a conflict between equal relational authorities using role ethics alone.
  *   **Legal Hand-off:** Revert to SAP. Since roles are equal, statutory hierarchy (usually majority or designated proxy) applies. If no designation, Ethics recommends mediation, but ultimately one must sign.
  *   **Outcome:** The RRP admits failure. It works for webs with clear relational gravity; it fails for deadlocks.

  ---

  #### Part III: Philosophical & Practical Analysis

  **Alternative Structure Considered:**
  I considered a "Virtue-Based Surrogacy" model, focusing on the *character* of the decision-maker (e.g., "Who is acting most compassionately?").
  *Rejection:* This is too subjective for a 30-minute consult. A fellow cannot assess virtue reliably. The Role-Relational Protocol focuses on *actions* (who visited, who paid bills) which are verifiable facts, making it auditable and defensible.

  **Translation Violence:**
  1.  **Dropped:** The Confucian concept of *Li* (Ritual). Proper resolution in CRE requires specific rituals of mourning and deference that take weeks, not minutes. I replaced *Li* with "Consensus Seeking."
  2.  **Dropped:** The idea that the patient is *only* a node. I retained the legal fiction of the individual rights-bearer to satisfy the Legal Office.
  3.  **Retained:** The distinction between *Name* (Title) and *Actuality* (Enacted Care). This is the core of *Zhengming* (Rectification of Names).
  4.  **Gaming Risk:** Step 2 is most exposed. An articulate family member can exaggerate their involvement ("I call him every day") to claim the PRS status.
      *   *Mitigation:* The Fellow must verify claims with nursing staff/social work notes during the 30 minutes. If verification is impossible, default to Statutory Surrogate.

  **Confidence Note:**
  *   **Procedure as Whole:** Moderate Confidence. It provides a structured way to validate family feelings without breaking the law.
  *   **Step 2 (Role Weight):** High Confidence. This is the most clinically useful translation of CRE.
  *   **Step 3 (AD Evaluation):** Low Confidence. This is the point of maximum friction.
  *   **Least Sure Claim:** I am least sure about the claim that *"The current web's consensus on current values outweighs the static document."*
      *   *Uncertainty Source:* This is a tension between **Institutional Design** and **Tradition**.
      *   *Institutional:* Hospitals cannot operate if ADs are routinely overridden by family consensus; it invites liability and erodes trust in planning.
      *   *Tradition:* Classical Confucianism prioritizes the living community's harmony over the rigid rules of the past. However, *Xiao* (Filial Piety) also demands honoring the parent's *will*. If the parent's will is written, does ignoring it violate *Xiao*? There is no clear textual consensus on whether a written wish binds the living family if the family believes the wish is no longer "right" for the situation. I have erred on the side of the living web, but a stricter Confucian might argue the written word is a sacred trust from the ancestor.

  **Final Warning:**
  This procedure will generate recommendations that feel more humane to families but will increase friction with Risk Management. It is designed to make the *conflict* visible (e.g., "The law requires X, but our relationship requires Y") rather than hiding it behind the fiction of "Substituted Judgment." Use it to document *why* a decision is hard, not just to find a loophole.
