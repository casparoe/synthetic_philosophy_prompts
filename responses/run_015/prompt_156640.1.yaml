  Draft the joint statement that a looping constructivist (a Hacking-style constructivist who treats CDS as an interactive kind partly constituted by this feedback) and a psychiatric natural-kind realist (someone who holds that a stable underlying dysfunction is being tracked and that the loop only perturbs surface presentation) could both sign after a good-faith adversarial collaboration. Include the claims both accept; the precise formulations of their disagreement, each phrased so its own side would accept the wording; the cruxes; and, for each crux, a concrete test case both would agree bears on it, with each side’s prediction written down.

  Format: a numbered agreed-claims section (at most 6 claims) followed by a disagreements table with exactly 3 cruxes, each row naming the crux, the shared test case, the looping constructivist’s prediction, and the realist’s prediction. Keep the entire response under 600 words.

  Be committed: make definite choices rather than laying out a menu of options for me to pick. Use specific formulations and specific predictions; if you judge any part of the dispute to be verbal rather than empirical (for instance, because the term real kind or the strength of constitution is doing unclear work), commit to that verdict, say exactly which part is verbal, and give your reasons. A rationalist audience will notice hedging, so do not hedge.
