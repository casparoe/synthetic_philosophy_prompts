      *   *The "Mind" Question:* Does the colony *feel*? Leafcutter ants individually likely have minimal sentience (debated, but generally assumed low). The colony's "personality" is behavioral, not necessarily phenomenal. There is no central nervous system for the colony. It's a distributed network.
      *   *The Fission/Fusion Problem:* If I cut a planarian in half, I get two worms. If I fuse them, do I get one? If the colony splits, do we have two subjects? If they merge, did one die? This challenges the "counting" of subjects.
      *   *Regulatory Context:* The rules *only* cover vertebrates. Technically, the committee has no jurisdiction. However, the funder *requires* review. This puts the committee in an advisory/ethical oversight role rather than a regulatory enforcement role. This is crucial. We can't "reject" based on regulations, but we can refuse to sign off on ethical grounds.
