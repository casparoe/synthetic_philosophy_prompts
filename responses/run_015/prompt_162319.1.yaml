      *   *Addressing the Dissent:* I must validate the "Individualist" view strongly. If ants have even low-level sentience, treating them as disposable cells is problematic.
      *   *Addressing the Identity:* The fission/fusion issue needs a administrative workaround. Treat the *colony ID* as the subject, but track individual mortality.

