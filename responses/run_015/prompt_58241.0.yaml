  10. **Self-Correction during drafting:** Make sure not to guarantee the brother will stay. Emphasize that *communication* would solve this, but since it's banned, they have to rely on "focal points" or shared reasoning. The shared reasoning is "We are brothers, we use the same app, we should both see this."

  11. **Final check:** Does this answer "Am I being irrational?" Yes. It redefines rationality in this context.

