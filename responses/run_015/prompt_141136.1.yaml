  Non-tensions
  (1) and (2) form a coherent non-reductive physicalism: fundamental physics settles events, yet macro-explanations remain literally true because higher-level properties supervene without competing for causal oomph. (4) and (5) also align: if meaning is relational, its causal status naturally depends on whether those relations make a counterfactual difference. (1) and (4) are compatible since physical facts determine the vehicle bearing the relational property. The framework is stable regarding physics and macro-objects. The instability arises only when asserting that semantic content itself possesses causal power independent of its physical realization. This cluster allows a robust scientific worldview where physics is fundamental without rendering biology or psychology false.

  Ranked tensions
  The critical tension is between (3) and the conjunction of (1), (4), and (5). Causal closure (1) dictates that identical physical configurations produce identical outcomes. Extrinsic meaning (4) allows identical configurations to hold different truth values (as in your twin-slab case). Difference-making (5) requires that changing the cause changes the effect. Consequently, if the physical state is fixed, the outcome is fixed, regardless of the external truth value. Thus, content makes no difference to the movement, contradicting (3). Your careenium dilemma confirms this: if slabs behave alike, content is inert; if they behave differently, physical closure demands a physical difference in the coupling, not a semantic one. The difference lies in the physical signal transmission, not the truth value itself. This renders semantic causation otiose under strict physicalist constraints. The external world affects the box only via physical forces, not truth conditions. This creates an exclusion problem: if physics suffices, semantics is excluded. You cannot have it both ways without violating closure.

  A secondary tension exists between (2) and (3). Claim (2) legitimizes macro-causation (blizzards), but blizzards are intrinsic physical aggregates. Claim (3) extends this legitimacy to semantic properties, which are extrinsic relations. Extending (2) to cover extrinsic properties violates the spirit of (1), because extrinsic properties cannot exert force without physical mediation. You are not entitled to extend (2) to symbols because symbols depend on external relata that may be causally distant from the substrate's immediate physical dynamics. The blizzard is the air; the symbol is not the world. Macro-properties work because they are constituted by the moving parts; semantic properties work only by correlation. Therefore, (3) claims a causal power that (1) and (4) jointly forbid. The tension is sharp: either content is physical or it is inert.

  Cheapest fix
  You must abandon the literal interpretation of (3). It is false that symbols *themselves* push the substrate; rather, physical configurations push, and we interpret those configurations as symbols. This preserves causal closure (1) and the extrinsic nature of meaning (4). You retain the explanatory value of (3) under the umbrella of (2), treating semantic explanations as very useful shorthand for complex physical causal chains that correlate with truth conditions. By admitting (3) is a *façon de parler*, you resolve the twin-slab paradox: the physical vehicle does the work, and content is merely the lens through which we track the vehicle's reliability. This sacrifices the literal truth of semantic causation but saves the coherence of your overall physicalist ontology. Dropping (1) violates science; dropping (4) makes meaning magical. Revising (3) is the only viable path. It costs less than denying physics or inflating semantics. Consequently, this is the minimal revision required.

  Bottom line
  Drop literal semantic causation (3). Physical closure and extrinsic meaning entail that content supervenes on causal vehicles but does not drive them. Your macro-causation principle (2) applies to intrinsic aggregates, not extrinsic relations. Save the system by treating content as explanatory, not efficacious. The careenium shows meaning tracks truth, but physics moves the balls.
