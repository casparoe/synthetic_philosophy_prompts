      *   If the external world physically pushes back to cause the difference, then it's the physical coupling doing the work, not the *semantic property* per se. This threatens (3).
      *   Claim (2) tries to save higher-level causation, but does it save *semantic* causation specifically?
      *   Tension is primarily between (1) + (4) + (5) vs (3).
