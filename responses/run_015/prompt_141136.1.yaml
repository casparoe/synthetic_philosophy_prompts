      *   (4) Meaning is relational/extrinsic (not intrinsic to the physical state).
      *   (5) Causal relevance = Difference-making.

      *   *The Core Tension:* This is the classic Exclusion Problem / Mental Causation problem framed via the Careenium (Hofstadter's thought experiment).
      *   If (1) is true, physical outcomes are settled by physical facts.
      *   If (4) is true, content supervenes on physical facts + external relations (extrinsic).
      *   If (5) is true, for content to be causal, changing the content must change the outcome.
