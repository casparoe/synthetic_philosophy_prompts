answer: |-
  This is a precise and critical observation. You have identified a gap between the *normative justification* of the policy (screening for moral hazard) and its *operational reality* (screening for administrative competence).

  To answer your primary question: **Yes, there is a recognized distinction, though it is more robustly developed in policy science and socio-legal studies than in pure moral philosophy.** In philosophy, it maps onto the tension between **substantive desert** and **procedural legitimacy**. In policy literature, it is defined as **administrative burden** leading to **exclusion errors**.

  Here is a breakdown of the conceptual tools available to you, the specific terminology that captures this dynamic, and where this sits within welfare-state theory.

  ### 1. The Terminology: "Administrative Burden" and "Exclusion Errors"

  While moral philosophy may lack a single pithy noun for "rendered undeserving by architecture," the policy science literature is explicit about this mechanism.

  *   **Administrative Burden:** Defined by scholars like Pamela Herd and Donald Moynihan, this refers to the learning, compliance, and psychological costs citizens face when interacting with the state. Your task force has inadvertently high compliance costs (gathering signatures, meeting deadlines) that function as a de facto eligibility criterion.
  *   **Exclusion Errors (Type II Errors):** In welfare economics, a "targeting error" occurs when benefits go to the non-needy (inclusion error/fraud) or fail to reach the needy (exclusion error). Your system is designed to minimize inclusion errors (fraud) but is generating massive exclusion errors.
  *   **Churning:** This describes the cycle where eligible recipients lose benefits due to procedural hurdles, re-apply, and regain them, creating instability without saving the state money (often costing more in processing).
  *   **Bureaucratic Disentitlement:** A socio-legal term describing how eligible individuals are stripped of rights not through law, but through the practical difficulty of asserting them.

  **The Philosophical Distinction:**
  You can frame this as a conflict between **Substantive Desert** (what a person merits based on need and effort) and **Procedural Eligibility** (what a person qualifies for based on navigating the system). Your current system treats *administrative competence* as a proxy for *moral worthiness*. This is a category error. A person who fails to return a form by 5:00 PM on a Tuesday is not necessarily less "deserving" of housing than one who does; they are merely less bureaucratically literate or resourced.

  ### 2. Conceptual Tools for Analysis

  To argue this within a philosophical framework, three specific theories offer the strongest leverage:

  #### A. Procedural Justice (Rawlsian Framework)
  John Rawls distinguishes between *perfect*, *imperfect*, and *pure* procedural justice.
  *   **Perfect Procedural Justice:** There is a criterion for the right outcome, and a procedure guaranteed to produce it.
  *   **Imperfect Procedural Justice:** There is a criterion for the right outcome, but no procedure guaranteed to produce it (e.g., a criminal trial; we want to convict only the guilty, but sometimes we convict the innocent).

  Your task force is operating under the assumption of **Perfect Procedural Justice**: "If you are truly needy and compliant, the process will capture that."
  The reality is **Imperfect Procedural Justice**: The process has a high error rate.
  **The Argument:** When the error rate of the procedure becomes high enough to systematically exclude the "deserving," the procedure loses its legitimacy. If the "noise" of the bureaucracy drowns out the "signal" of need, the conditionality is no longer screening for *reciprocity*; it is screening for *privilege* (time, literacy, stability).

  #### B. The Theory of Desert (Feinberg / Miller)
  Philosophers of desert (e.g., Joel Feinberg, David Miller) argue that desert must be based on facts about the person (their effort, their need, their contribution).
  *   **The Mismatch:** In your framework, the *basis of desert* is "active reciprocity" (trying to work/contribute). However, the *evidence of desert* required is "documentation of reciprocity."
  *   **The Conflation:** The system conflates the *evidence* with the *fact*. When a recipient fails to provide evidence due to clerical error, the system treats them as if they failed to perform the act.
  *   **The Concept:** You can term this **"Evidentiary Disqualification."** It is a form of injustice where the failure to *prove* virtue is treated identically to the absence *of* virtue.

  #### C. The Capabilities Approach (Sen / Nussbaum)
  Amartya Sen and Martha Nussbaum argue that justice is not about resources (housing vouchers) but about *capabilities* (the freedom to achieve well-being).
  *   **The Argument:** High administrative burdens reduce the *capability* of the recipient to function. If the cost of claiming the benefit (in time, stress, cognitive load) exceeds the benefit's value, the state is actively diminishing the citizen's capability.
  *   **Application:** A policy that creates "procedural poverty" (spending hours on paperwork instead of job hunting) violates the capability to seek employment, thereby undermining the stated goal of the reciprocity requirement.

  ### 3. Positioning Within Welfare-State Debates

  You noted that the standard economic framing (rational incentives) feels inadequate. Here is exactly where your case sits relative to the standard triad of welfare debates:

  | Debate Concept | Standard Definition | Your Case (The Distinction) |
  | :--- | :--- | :--- |
  | **Moral Hazard** | Recipients *choose* not to work to avoid losing benefits. | **Procedural Hazard:** Recipients *choose* to work/comply but are *prevented* from proving it by system friction. The failure is not strategic; it is structural. |
  | **Fraud** | Recipients actively deceive the state to gain funds. | **False Negative:** Recipients are truthful but disqualified. This is the inverse of fraud; it is **state error**, not citizen deception. |
  | **Conditionality** | Benefits tied to behavior to ensure social contract. | **Hyper-Conditionality:** Benefits tied to *bureaucratic performance*. The social contract becomes: "We house you if you can navigate our bureaucracy," rather than "if you seek to contribute." |

  ### 4. Strategic Framing for the Task Force

  To move the needle on your task force, you need language that bridges the moral and the operational. I recommend using the concept of **"Constructive Non-Compliance."**

  **The Argument:**
  "The current architecture creates **Constructive Non-Compliance**. Just as 'constructive eviction' in housing law occurs when a landlord makes a unit uninhabitable to force a tenant out without formal eviction, our system makes benefit retention uninhabitable for the compliant poor. We are not catching 'free riders'; we are catching 'paperwork failures.' These are distinct populations."

  **Proposed Diagnostic:**
  Suggest a **"Process Audit"** rather than a "Compliance Audit."
  *   *Compliance Audit:* Are recipients doing what they said they would?
  *   *Process Audit:* Of those who lost benefits, what percentage lost them due to substantive non-compliance (didn't apply for jobs) vs. procedural non-compliance (applied but signature missing)?

  If the latter is high, the policy is not achieving its philosophical goal of distinguishing the needy from the non-needy. It is distinguishing the **bureaucratically resourced** from the **bureaucratically vulnerable**.

  ### Summary
  There is no single ancient Greek term for this, but the distinction is well-trodden in modern political economy. You are observing the transformation of **Substantive Eligibility** (need + intent) into **Procedural Eligibility** (form-filling capacity).

  By framing this as **Exclusion Error driven by Administrative Burden**, you move the debate away from the morality of the recipient (are they lazy?) to the morality of the state (is our process just?). This allows you to uphold the principle of reciprocity while rejecting the mechanism that undermines it.
