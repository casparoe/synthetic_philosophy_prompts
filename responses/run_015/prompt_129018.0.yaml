      *   *Philosophers/Theorists:* John Rawls (procedural justice), Amartya Sen (capabilities), Martha Nussbaum, Herd & Moynihan (administrative burden), Loïc Wacquant (punitive state), Eva Feder Kittay (dependency).
      *   *Distinction:* Substantive Desert vs. Procedural Disqualification.

  3.  **Analyzing the Philosophical Distinction:**

