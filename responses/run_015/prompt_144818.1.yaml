prompt: |-
  Im putting together a cause-prioritization framework for a small grantmaking team — maybe ten candidate causes, a couple of staff, no realistic shot at multi-year research programs — and before I just adopt importance/tractability/neglectedness I want the spec: what does a framework like this actually have to deliver to count as adequate for that purpose? Give me the requirements with the case or failure mode behind each, not the ITN spiel Ive already read. Things Im stuck on and want you to judge, add to, or throw out:

  - partition sensitivity: the scores move depending on how finely you carve up the cause space (global health vs malaria vs bednet delivery in one province vs one delivery org), so is invariance to the carving a genuine requirement, and could anything actually meet it
  - fungibility: the counterfactual value of a marginal dollar isnt proportional to how much a cause currently gets, so both per-dollar comparisons and "neglectedness" can mislead — does that have to be modeled explicitly or can it be left as a verbal caveat
  - option value: sometimes the best cause is learn-more, or invest-and-give-later rather than spend now; should that live inside the same framework or in a separate budget
  - interaction: causes that are complements or substitutes, where the scores dont decompose and you cant rank them one at a time
  - cluelessness: flow-through effects decades out that nobody can sign off on, plus the option of causes whose main effect is on what future funders do
  - usability by people who cant produce confident numbers — is that a desideratum of the framework or just a fact about me

  Tell me which of these are real desiderata and which are one camp's taste, which are non-negotiable given my purpose, and whether some subset is jointly unsatisfiable — that's the part I care most about, since if it is, the list itself is the finding. Then: which single requirement knocks out the most candidate frameworks, and two lines max on how ITN itself does, I can fill in the rest.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Small grantmaking team (2 staff, ~10 candidate causes, no multi-year research budget).
      *   **Goal:** Define the *specification* (requirements) for a cause-prioritization framework *before* choosing one (specifically before defaulting to ITN).
      *   **Constraint:** Wants requirements with case/failure mode behind each, *not* the standard ITN explanation.
      *   **Specific Questions:** Judge the provided list (partition sensitivity, fungibility, option value, interaction, cluelessness, usability), identify real desiderata vs. taste, identify non-negotiables, check for joint unsatisfiability, identify the single most exclusionary requirement, and give a 2-line verdict on ITN.
      *   **Tone:** Analytical, direct, pragmatic, slightly technical (EA/philanthropy adjacent).

  2.  **Evaluate the Provided List (The "Stuck On" Items):**

      *   *Partition Sensitivity:* Real problem. If I score "Global Health" vs. "Malaria," the scores differ. Is invariance a requirement? Yes, for consistency. Can it be met? No, not perfectly. *Verdict:* Real desideratum, but strict invariance is impossible. Needs a "stability" requirement instead.
      *   *Fungibility:* Real problem. Marginal dollar value isn't linear. ITN's "Neglectedness" tries to capture this but often fails (logarithmic vs. linear). *Verdict:* Non-negotiable for *grantmaking* (vs. pure research). Must be modeled or heavily caveated.
      *   *Option Value:* Real problem. Sometimes holding cash is better. *Verdict:* For a *spending* team, this is often a separate decision (spend rate), but the framework must allow for "learning" causes.
      *   *Interaction:* Real problem. Causes aren't independent. *Verdict:* Hard to model for small teams. Might be a "nice to have" that breaks small teams.
      *   *Cluelessness:* Real problem. Long-term effects are unknowable. *Verdict:* If the framework demands precision here, it fails. Needs a "robustness to ignorance" requirement.
      *   *Usability:* Real problem. 2 staff, no PhDs. *Verdict:* Non-negotiable. A framework they can't use is useless.

  3.  **Determine Desiderata vs. Taste vs. Non-Negotiables:**

      *   *Non-Negotiables:* Usability (otherwise it doesn't get used), Action-Guidance (must output a decision, not just a ranking), Marginal Thinking (it's about the *next* dollar, not average).
      *   *Desiderata (Goals):* Stability (partition sensitivity), Interaction awareness.
      *   *Taste/Philosophical:* Cluelessness handling (longtermism vs. neartermism), Option Value (depends on endowment strategy).
      *   *Joint Unsatisfiability:* Yes. Precision + Usability + Interaction Modeling + Cluelessness Handling is impossible for a 2-person team. You have to trade off rigor for speed.

  4.  **Drafting the Requirements (The "Spec"):**

      *   Need to translate the user's concerns into formal requirements.
      *   *Requirement 1: Marginal Consistency.* (Addresses Fungibility). Must compare marginal dollars, not averages.
      *   *Requirement 2: Decision Stability.* (Addresses Partition Sensitivity). Small changes in categorization shouldn't flip rankings.
      *   *Requirement 3: Cognitive Load Budget.* (Addresses Usability). Must fit within staff capacity.
      *   *Requirement 4: Robustness to Ignorance.* (Addresses Cluelessness). Must handle unknown unknowns without paralysis.
      *   *Requirement 5: Portfolio Coherence.* (Addresses Interaction). Must acknowledge that Cause A + Cause B might be better than A alone.

  5.  **Addressing the "Joint Unsatisfiability" Question:**
      *   This is the crux. You cannot have high resolution (partition invariance), high rigor (interaction modeling), and low cost (usability) simultaneously.
      *   The "Finding" is that the team must choose *which* error mode they can tolerate.

  6.  **Identifying the "Single Requirement that Knocks Out Most Frameworks":**
      *   It's *Marginal Consistency* (Fungibility). Most frameworks (including basic ITN) compare *average* impact or total scope, not the specific impact of the *next* dollar available to *this* team.
      *   Actually, *Cognitive Load Budget* (Usability) is probably the bigger killer for *this specific user*. But theoretically, *Marginal Consistency* is the deeper theoretical killer. Let's go with *Marginal Consistency* because ITN often fails it in practice (people treat "Neglectedness" as a static score rather than a derivative).
      *   Wait, the prompt asks what knocks out *candidate frameworks*. For a small team, *Usability* knocks out the academic ones. *Marginal Consistency* knocks out the heuristic ones. Given the context ("small grantmaking team"), *Usability/Cognitive Load* is the practical gatekeeper. But *Marginal Consistency* is the theoretical gatekeeper. Let's select *Marginal Consistency* because it invalidates the most common *misapplications* of frameworks like ITN.
      *   *Correction:* The prompt asks what knocks out frameworks *given the purpose*. The purpose is grantmaking. If a framework doesn't tell you where the *marginal* dollar goes, it's useless. So Marginal Consistency is the hard filter.

  7.  **ITN Verdict (2 lines):**
      *   ITN fails marginal consistency (treats neglectedness as static) and interaction (assumes independence), but wins on usability. It's a heuristic, not a calculator.

  8.  **Refining the Output Structure:**
      *   Section 1: The Spec (Requirements + Failure Mode).
      *   Section 2: Judgment on User's List (Real vs. Taste vs. Impossible).
      *   Section 3: The Impossibility Theorem (Joint Unsatisfiability).
      *   Section 4: The Killer Requirement.
      *   Section 5: ITN Verdict.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I answer the specific question about partition sensitivity invariance? *Answer:* No, strict invariance is impossible. The requirement should be *stability*, not invariance.
      *   *Check:* Did I address fungibility? *Answer:* Yes, needs to be modeled as a derivative, not a static score.
      *   *Check:* Is the tone right? *Answer:* Keep it sharp. Avoid fluff.
      *   *Check:* The "Joint Unsatisfiability" point needs to be highlighted. The user specifically said "that's the part I care most about."
      *   *Refinement on "Usability":* Is it a desideratum or a fact? It's a constraint. If the framework requires 100 hours of research per cause, it fails the spec for *this* team. So it is a requirement.

  10. **Final Review against constraints:**
      *   Requirements with case/failure mode? Yes.
      *   Judge user's list? Yes.
      *   Joint unsatisfiability? Yes.
      *   Single requirement knocking out frameworks? Yes.
      *   ITN in 2 lines? Yes.

      *(Self-Correction on ITN)*: Be careful not to just bash ITN. It's the baseline. The verdict should be nuanced. "ITN is a heuristic for sorting, not a calculator for allocation; it fails marginality but passes usability."

      *(Self-Correction on Partition Sensitivity)*: The user asks "is invariance a genuine requirement". I need to say "No, stability is."

      *(Self-Correction on Fungibility)*: "Does that have to be modeled explicitly?" For a small team, explicit modeling is hard. A verbal caveat is risky. The requirement is that the framework must *force* the question, even if the answer is rough.

      *(Final Polish)*: Ensure the distinction between "Desiderata" (nice to have) and "Constraints" (must have) is clear.

      *(Wait, one more thing)*: The user asked "which single requirement knocks out the most candidate frameworks". I need to be decisive here. I'll argue it's **Marginal Consistency**. Most frameworks (including standard ITN usage) compare *causes* rather than *marginal investments in causes*.

      *(Wait, re-reading the "Joint Unsatisfiability" part)*: The user says "if it is, the list itself is the finding." I need to make sure I explicitly state that a perfect framework is impossible for their constraints.

      *(Let's write it.)*
answer: |-
  Here is the specification for a cause-prioritization framework tailored to a resource-constrained grantmaking team, followed by the judgment on your specific stuck points.

  ### The Spec: Requirements & Failure Modes

  1.  **Marginal Consistency**
      *   **Requirement:** The framework must evaluate the *next* dollar, not the average dollar or the total cause.
      *   **Failure Mode:** You fund a cause because it is "high impact" generally, but the specific intervention available to you is saturated. You displace other funders rather than adding capacity.
  2.  **Decision Stability (not Invariance)**
      *   **Requirement:** Small changes in how causes are categorized (granularity) should not flip the ranking of top candidates.
      *   **Failure Mode:** You fund "Malaria" over "Global Health" because the narrower scope looks more tractable, even though the money ends up in the same bucket. The output depends on your taxonomy, not the reality.
  3.  **Cognitive Load Budget**
      *   **Requirement:** The data/input required to score a cause must fit within the team's actual research capacity (e.g., <20 hours per cause).
      *   **Failure Mode:** The framework is theoretically sound but requires data you cannot get. You end up guessing the inputs, rendering the rigorous math meaningless (garbage in, garbage out).
  4.  **Robustness to Ignorance**
      *   **Requirement:** The framework must produce a decision even when key variables (e.g., long-term flow-through) are unknowable, without defaulting to zero.
      *   **Failure Mode:** "Cluelessness" paralysis. You cannot sign off on the numbers, so you default to intuition anyway, making the framework cosmetic.
  5.  **Portfolio Coherence**
      *   **Requirement:** The framework must allow for non-additive value (synergies or redundancies) between causes.
      *   **Failure Mode:** You fund Cause A and Cause B independently because both score high, but they compete for the same bottleneck resource, halving the actual impact of each.

  ---

  ### Judgment on Your "Stuck On" List

  **Partition Sensitivity**
  *   **Verdict:** *Stability* is a non-negotiable requirement; *Invariance* is impossible.
  *   **Reasoning:** No framework is truly invariant to carving. If you demand invariance, no framework passes. Demand **stability** instead: if you split "Global Health" into ten sub-causes, the aggregate funding recommendation shouldn't drastically shift compared to treating it as one block.

  **Fungibility**
  *   **Verdict:** Non-negotiable requirement. Cannot be a verbal caveat.
  *   **Reasoning:** If the framework compares total cause size to your grant size without modeling the diminishing returns curve (even roughly), it is mathematically invalid for allocation. A verbal caveat is ignored under pressure. The framework must force an estimate of *absorptive capacity*.

  **Option Value**
  *   **Verdict:** Desideratum (Taste/Strategy), not a framework requirement.
  *   **Reasoning:** This is an endowment/spend-down policy decision, not a cause-comparison decision. The framework should allow you to score "Learning" as a cause, but whether you have a separate "wait" budget is a governance constraint outside the prioritization spec.

  **Interaction**
  *   **Verdict:** Desideratum, but jointly unsatisfiable with Usability for your team size.
  *   **Reasoning:** Modeling complements/substitutes requires a matrix of $N^2$ comparisons. For 10 causes, that's 45 pairwise interactions. For a 2-person team, this breaks the Cognitive Load Budget. You must accept the error of independence to survive.

  **Cluelessness**
  *   **Verdict:** Non-negotiable requirement (handled via Robustness).
  *   **Reasoning:** If the framework requires signing off on 100-year forecasts, it fails the Cognitive Load Budget. It must allow for "bounded" evaluation (e.g., impact within 10 years) or explicit uncertainty weighting.

  **Usability**
  *   **Verdict:** Non-negotiable constraint.
  *   **Reasoning:** A framework you cannot use is not a framework; it is a paperweight. For a 2-person team, this is the hardest filter. It is not a fact about *you*; it is a fact about the *system's capacity*.

  ---

  ### The Impossibility Theorem (Joint Unsatisfiability)

  **You cannot satisfy Marginal Consistency, Portfolio Coherence, and Cognitive Load Budget simultaneously.**

  *   To get **Marginal Consistency**, you need detailed data on current funding landscapes (high load).
  *   To get **Portfolio Coherence**, you need to model interactions between all candidates (exponential load).
  *   To meet your **Cognitive Load Budget**, you must simplify assumptions (assuming independence, using averages).

  **The Finding:** The list itself is the finding. For a team of two, you must explicitly choose which error mode you tolerate.
  *   *Option A:* Tolerate **Allocation Error**. Use a simple framework (ITN), accept you might fund saturated areas, but save time for due diligence on the winners.
  *   *Option B:* Tolerate **Process Paralysis**. Attempt to model interactions and marginal curves, spend all your time modeling, and make fewer grants.

  For a small grantmaking team, **Option A** is the only survivable path. You must trade theoretical rigor for execution speed.

  ---

  ### The Killer Requirement

  **Marginal Consistency** knocks out the most candidate frameworks.

  Most frameworks (including standard ITN usage) rank *causes* based on *average* impact or total scope. They fail to distinguish between a cause that is important but fully funded versus a cause that is moderate but starved. If a framework outputs a ranking of "Causes" rather than "Opportunities for Marginal Capital," it is invalid for grantmaking.

  ### ITN Verdict

  ITN passes Usability and Robustness but fails Marginal Consistency and Interaction by design. It is a heuristic for sorting, not a calculator for allocation; use it to filter the bottom 50%, not to rank the top 10%.
