answer: |-
  This is a sharp reconstruction of a classic objection to James (often gestured at by Putnam, Russell, and more recently by evidentialists like Conee and Feldman). You are right to feel the slide is happening, and your intuition about the modal shift is correct.

  For a seminar paper, you want to avoid simply saying "James is a pragmatist, Clifford is an evidentialist, they are talking past each other." That's too easy. You need to show where the *normative force* of James's argument survives the regress objection.

  Here is the diagnosis: **The slip is in Step (4).**

  Specifically, Step (4) commits a **category mistake regarding the doxastic status of framing conditions.** It treats the recognition of an option as "live, forced, and momentous" as a *propositional belief subject to evidential norms*, whereas James treats it as a *pre-volitional psychological fact* or a *practical stance*.

  Here is how you can unpack this rejection, the specific philosophical moves available to you, and the costs involved.

  ### 1. The Diagnosis: Rejecting Step (4)

  Step (4) claims: *Those prior framing beliefs... are themselves held without the kind of sufficient evidence Clifford demands.*

  **The Jamesian Counter:** Framing conditions are not "beliefs" in the Cliffordian sense; they are **recognitions of psychological salience.**

  *   **Liveness is Psychological, Not Alethic:** For James, a hypothesis is "live" if it appeals as a real possibility *to the individual thinker*. This is a report on the agent's psychology, not a claim about the world's modal structure.
      *   *Example:* If I say, "Belief in God is a live option for me," I am not claiming "God is possible" (which might require evidence). I am claiming "I am psychologically constituted such that I can entertain this hypothesis."
      *   *The Slide:* Clifford's principle applies to assent to truth-claims. James's framing conditions describe the *space of deliberation*. You cannot violate an evidential norm by having a psychology. You can only violate it by assenting to a proposition without evidence.
  *   **The Regress Stopper:** If framing conditions were beliefs requiring evidence, you would indeed face an infinite regress. James stops the regress by grounding the framing conditions in **passional nature**. As James writes, "Our passional nature not only lawfully may, but must, decide an option between propositions, whenever it is a genuine option that cannot by its nature be decided on intellectual grounds."
      *   The "decision" to treat the option as genuine is not a belief formed on evidence; it is a **volitional commitment to a framework**.

  **How to phrase this in the paper:**
  > "Step (4) equivocates on 'belief.' Clifford's principle governs *assent to truth-claims* (propositional attitude $p$ is true). James's framing conditions govern *the recognition of practical salience* (attitude $p$ is worth betting on). The latter is not subject to evidential norms because it is the precondition for evidence to be weighed, not the result of weighing it."

  ### 2. The Modal Slide: Alethic vs. Practical Modality

  You mentioned feeling a "modal slide." This is the precise technical lever to pull.

  *   **Clifford's Modality:** Alethic. "Is $p$ supported by the evidence?"
  *   **James's Modality:** Practical/Deontic. "Am I permitted to act as if $p$ given that evidence is unavailable?"

  Step (5) says: *So to invoke James's exception you must first violate Clifford's principle in the framing step.*

  **Rebuttal:** You only violate Clifford if the framing step is an *alethic assertion*. But James argues that in "genuine options" (undecidable intellectually), the intellect *suspends judgment*. The framing step is not asserting "$p$ is likely"; it is asserting "I must choose regarding $p$."

  *   **The Quarantine:** James quarantines the framing beliefs not by saying they are "evidence-free but okay," but by saying **they are not in the business of truth-tracking.** They are in the business of **life-tracking**.
  *   **The Cost:** If you reject (4), you must accept that there is a domain of doxastic-adjacent states (framework commitments) that are justified pragmatically rather than evidentially.

  ### 3. Alternative Move: Rejecting Step (1) via Step (7)

  If you are worried that rejecting (4) makes James look like he's hiding the ball, you can attack Step (1) instead, using the dilemma in (7).

  *   **The Dilemma:** If Clifford's principle applies to the framing beliefs, then **Clifford's principle is self-defeating.**
  *   **The Argument:** Clifford's principle ("Believe only on sufficient evidence") is itself a normative claim. What is the *evidence* for Clifford's principle?
      *   It cannot be empirical (Hume's Guillotine).
      *   It cannot be logical (it's a normative rule).
      *   Therefore, holding Clifford's principle violates Clifford's principle.
  *   **James's Advantage:** James admits his rule is based on passional needs (the need for truth, the fear of error). Clifford hides his passional need (the fear of being duped) behind a mask of objective evidentialism.
  *   **Strategic Value:** This moves the debate from "James collapses into Clifford" to "Clifford collapses into James." Clifford is just a special case of James where the "passional need to avoid error" outweighs the "passional need to gain truth."

  ### 4. What does rejecting (4) cost you? (The "Price")

  You asked what it costs to reject (4) (i.e., to say framing beliefs aren't beliefs in the relevant sense).

  **Cost 1: The Arbitrariness Objection.**
  If framing conditions are just psychological facts, isn't *any* delusion permissible? If a hypothesis is "live" for a paranoid schizophrenic, does James license that belief?
  *   **Fix:** You must emphasize James's constraint of **"Genuine Option."** It's not enough that it feels live; it must be undecidable on *intellectual* grounds. If there is evidence against it, the option is not genuine. The "framing" is only exempt from evidence when evidence is *in principle* unavailable.

  **Cost 2: Epistemic Fragmentation.**
  You are positing two domains of rationality: Evidential (science, daily facts) and Pragmatic (religion, morality, metaphysics).
  *   **Fix:** Embrace this. This is classic Pragmatism. The "price" is abandoning the dream of a Unified Theory of Rationality where one norm (evidence) covers all. For a PhD seminar, this is a feature, not a bug. It shows you understand the stakes of Pragmatism vs. Evidentialism.

  **Cost 3: Doxastic Voluntarism.**
  To make the framing step a "choice" (to avoid the regress), you lean into doxastic voluntarism.
  *   **Fix:** James is a *limited* voluntarist. We cannot believe at will, but we can *choose which hypotheses to keep live*. We can nurture a hypothesis. This is "indirect doxastic control."

  ### Recommendation for the Paper Structure

  I recommend you keep your (1)-(9) structure but intervene at (4) with a distinction between **Constitutive Framing** and **Propositional Belief**.

  **Revised Step (4*):**
  > (4*) Framing conditions (liveness, momentousness) are not propositional beliefs subject to evidential norms, but **pre-doxastic orientations** or **practical stances** necessitated by the finitude of human agency. They are justified by their indispensability for action, not by antecedent evidence.

  **Revised Step (5*):**
  > (5*) Therefore, invoking James's exception does not violate Clifford's principle, because Clifford's principle only applies to propositional assent, not to the practical recognition of a decision context.

  **The "Hidden Slide" to Highlight:**
  The slide is between **Epistemic Rationality** (maximizing truth/minimizing error) and **Pragmatic Rationality** (maximizing agency/minimizing paralysis). Clifford assumes Epistemic Rationality is the only game. James argues that in specific contexts (Live, Forced, Momentous), Pragmatic Rationality takes the lead because Epistemic Rationality has gone silent (insufficient evidence).

  ### Summary of the "Price"
  If you reject (4), you are committing to the view that **epistemic norms are context-sensitive.**
  *   **In Context A (Evidence available):** Clifford rules.
  *   **In Context B (Evidence unavailable, stakes high):** James rules.
  *   **The Risk:** You must defend the boundary between Context A and B. (James uses "intellectual undecidability"). If you can't define that boundary sharply, critics will say you've just licensed wishful thinking.

  **Seminar Tip:** Frame this not as "saving James from contradiction" but as "revealing the hidden pragmatism in Clifford." Clifford *also* relies on framing beliefs (e.g., "Error is the greatest evil"). James just makes his framing beliefs explicit. The collapse isn't James into Clifford; it's Clifford into James.

  This should give you enough traction to workshop the argument effectively. It acknowledges the logical pressure while offering a robust Pragmatist escape route.
