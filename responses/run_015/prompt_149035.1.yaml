      *   **Key Claims:**
          1.  Mutation = error (defined by maintenance system, not organismal goal).
          2.  Information thins out where maintenance is absent (e.g., RNA viruses).
          3.  Answers Parity Argument (Genome is special because it's the target of error-correction).
      *   **Committee:**
          *   *Priya:* Philosopher of biology, Developmental Systems Theory (DST) background. Hates parity argument violations. Suspicious of "privileging" the genome via the repair system.
          *   *Marc:* Molecular biologist (DNA repair specialist). Pragmatic. Hates "verbal" disputes. Wants empirical predictions/assays. Knows the mechanics (e.g., methylation in *E. coli*).
          *   *External:* Philosopher of mind, biosemantics, teleosemantics. Focused on proper function, consumer vs. producer, type/token.
