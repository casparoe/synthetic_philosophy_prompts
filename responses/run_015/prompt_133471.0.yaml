prompt: |-
  I've been trying to figure out if virtue ethics can survive the situationist stuff without just retreating into hand-waving. Before I read more, I want the full spec: what does any adequate post-situationist virtue theory actually have to deliver? List the desiderata -- the behavioral patterns it needs to explain, the cross-situational inconsistancies it can't sweep under the rug, the distinction between trait and state it has to keep intact, and whatever results from personality psyhc (low cross-situational correllations, etc.) it can't flat-out deny. For each, say why it's a genuine constraint and not just virtue-ethicist wishful thinking. Flag which pairs look jointly unsatisfyable -- especially if being predictively accurate and being normatively action-guiding pull in opposite directions. Then briefly score two fixes: one that saves global virtues via 'trait-activtion profiles' (context-sensitive triggers that only fire in matching situations), and one that dumps global traits for purely local 'situational virtues.' No reading lists, just the logic.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Virtue Ethics vs. Situationism (Social Psychology critique).
      *   **Goal:** Define the "full spec" (desiderata) for an adequate post-situationist virtue theory.
      *   **Constraints:**
          *   List behavioral patterns to explain.
          *   Address cross-situational inconsistencies.
          *   Maintain the trait/state distinction.
          *   Acknowledge personality psychology results (low cross-situational correlations, etc.).
          *   Explain *why* each is a genuine constraint (not wishful thinking).
          *   Flag jointly unsatisfiable pairs (tensions/trade-offs), especially predictive accuracy vs. normative action-guidance.
          *   Score two specific fixes: (1) Global virtues via "trait-activation profiles" (context-sensitive), (2) Local "situational virtues."
          *   **No reading lists, just logic.**

  2.  **Deconstruct the Situationist Challenge:**
      *   *Core Claim:* Behavior is determined more by situational factors than stable character traits.
      *   *Evidence:* Milgram (obedience), Stanford Prison (roles), Good Samaritan (hurrying), Phone Booth (dime).
      *   *Implication for Virtue Ethics:* If virtues are stable, global dispositions, and psychology says they don't exist, virtue ethics is empirically false or vacuous.

  3.  **Drafting the Desiderata (The "Full Spec"):**
      *   *Desideratum 1: Empirical Adequacy.* Must align with data showing low cross-situational consistency (Mischel's coefficient ~0.30). *Why constraint?* Ignoring data makes the theory delusional.
      *   *Desideratum 2: Normative Action-Guidance.* Must tell agents *what to do* or *who to be*. *Why constraint?* Ethics is practical; if it can't guide, it's just description.
      *   *Desideratum 3: Moral Responsibility/Praiseworthiness.* Must allow for holding agents responsible. *Why constraint?* If behavior is purely situational, blame/praise loses footing.
      *   *Desideratum 4: Developmental Trajectory.* Must explain how one *becomes* virtuous over time. *Why constraint?* Virtue ethics is about cultivation, not just static states.
      *   *Desideratum 5: Trait/State Distinction.* Must distinguish between a fleeting mood and a character trait. *Why constraint?* Without this, "virtue" collapses into "happening to do the right thing once."

  4.  **Identifying Tensions (Jointly Unsatisfiable Pairs):**
      *   *Tension 1: Global Predictability vs. Empirical Reality.* If virtues predict behavior across diverse situations (Global), they contradict the low correlation data. If they match data (Local), they lose predictive power.
      *   *Tension 2: Action-Guidance vs. Situational Sensitivity.* If guidance is "Be Courageous" (Global), it's too vague for specific situations. If guidance is "Do X in Context Y" (Local), it becomes a rule-book, not character ethics.
      *   *Tension 3: Responsibility vs. Situational Determinism.* If situations drive behavior, how is the agent responsible? If agents are responsible, situations can't be *that* powerful.

  5.  **Evaluating the Two Fixes:**

      *   *Fix 1: Global Virtues via Trait-Activation Profiles (Context-Sensitive).*
          *   *Idea:* Virtues exist but are conditional. "Honest *unless* safety is at risk."
          *   *Pros:* Saves the "virtue" concept, allows for nuance.
          *   *Cons:* Risks becoming ad hoc. Does it actually predict better?
          *   *Score:* High on Normative Guidance, Medium on Empirical Adequacy.

      *   *Fix 2: Purely Local 'Situational Virtues'.*
          *   *Idea:* Dump global traits. Virtue is a skill specific to contexts (e.g., "Office Honesty" vs. "Home Honesty").
          *   *Pros:* High Empirical Adequacy (matches psych data).
          *   *Cons:* Low Action-Guidance (fragmented self), threatens Moral Unity/Responsibility.
          *   *Score:* High on Empirical Adequacy, Low on Normative Unity.

  6.  **Refining the Logic and Tone:**
      *   Tone needs to be analytical, rigorous, slightly skeptical (matching the prompt's "without just retreating into hand-waving").
      *   Avoid jargon where possible, but use precise philosophical/psychological terms (cross-situational consistency, normative force, etc.).
      *   Ensure the "Scoring" is clear and comparative.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* low correlation is a constraint? Yes, because ignoring it makes the theory empirically false.
      *   *Check:* Did I flag the tension between prediction and guidance? Yes, this is crucial.
      *   *Check:* Did I avoid reading lists? Yes.
      *   *Check:* Is the distinction between trait and state clear? Need to emphasize stability over time vs. momentary impulse.
      *   *Refinement on Scoring:* Use a simple metric (e.g., Pass/Fail/Strain) or a qualitative assessment to keep it logical rather than arbitrary numbers. Let's use "Viability Rating" with specific strengths/weaknesses.

  8.  **Final Polish:** Organize into clear sections: The Desiderata, The Tensions, The Fixes. Ensure the "Why it's a constraint" part is explicit for each desideratum. (Self-correction: Make sure to explicitly mention the Mischel coefficient or the general finding of low correlation as the empirical anchor).

  9.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  Here is the specification for an adequate post-situationist virtue theory, the logical tensions inherent in that spec, and an evaluation of the two primary repair strategies.

  ### I. The Desiderata (The Full Spec)

  An adequate virtue theory cannot simply assert that virtues exist; it must reconcile normative claims with empirical data. It must deliver on the following five constraints.

  **1. Empirical Adequacy (The Consistency Constraint)**
  *   **Requirement:** The theory must acknowledge that cross-situational behavioral correlations in personality psychology are low (typically *r* = 0.20–0.30). It cannot claim that a virtuous agent will act virtuously in *all* or even *most* diverse situations regardless of context.
  *   **Why a Constraint:** If a theory posits entities (global traits) that predict behavior with high fidelity, and empirical data shows behavior is not predicted with high fidelity, the theory is empirically falsified. Denying the data renders the ethics delusional.

  **2. The Trait/State Distinction (The Stability Constraint)**
  *   **Requirement:** The theory must distinguish between a *trait* (a stable disposition over time) and a *state* (a transient reaction to immediate stimuli). It must explain how an agent can be "honest" without being honest in every single instance, yet still be distinguishable from someone who is honest only by accident or mood.
  *   **Why a Constraint:** Without this, virtue ethics collapses into act-evaluation. If there is no stable underlying disposition, praising someone's "character" is category error; you are only praising their luck or current environment.

  **3. Normative Action-Guidance (The Practicality Constraint)**
  *   **Requirement:** The theory must provide an agent with a reason to cultivate virtue *now* for the sake of future action. It must answer "What should I become?" not just "What happened?"
  *   **Why a Constraint:** Ethics is inherently practical. A theory that describes human fragmentation without offering a path to integration or improvement is sociology, not ethics.

  **4. Moral Responsibility (The Agency Constraint)**
  *   **Requirement:** The theory must preserve enough agency to justify praise, blame, and moral education. If situations determine behavior, the agent is a conduit, not a source.
  *   **Why a Constraint:** Virtue ethics relies on the concept of *cultivation*. If the agent cannot override situational pressures through character, moral education is futile, and responsibility is incoherent.

  **5. Explanatory Unity (The Integrity Constraint)**
  *   **Requirement:** The theory must explain why we perceive moral agents as unified selves. It must account for the intuition that a person who is cruel at home but kind at work suffers from a moral defect, not just contextual adaptation.
  *   **Why a Constraint:** If the theory fragments the self too much to match the data, it loses the concept of "a life well-lived." It becomes a list of unrelated skills rather than a unified character.

  ---

  ### II. The Logical Tensions (Jointly Unsatisfiable Pairs)

  The situationist critique works because these desiderata pull in opposite directions. You cannot maximize all of them simultaneously.

  **1. Predictive Accuracy vs. Normative Force**
  *   **The Conflict:** To be empirically accurate (Desideratum 1), virtues must be highly sensitive to context, which lowers their predictive power across situations. To be normatively forceful (Desideratum 3), virtues must be robust enough to command action *against* situational pressure.
  *   **The Trade-off:** If you tune the theory to match the low correlation data, virtues become too weak to guide action in novel or high-pressure situations. If you tune virtues to be strong guides, they contradict the psychological data on situational dominance.

  **2. Stability vs. Sensitivity**
  *   **The Conflict:** To maintain the Trait/State distinction (Desideratum 2), the disposition must be stable over time. To acknowledge situational power, the disposition must be fluid across contexts.
  *   **The Trade-off:** High stability risks empirical falsification (ignoring situational variance). High sensitivity risks collapsing the trait back into a state (if the "trait" changes entirely based on context, is it still a trait?).

  **3. Responsibility vs. Determinism**
  *   **The Conflict:** To preserve Responsibility (Desideratum 4), the agent must be the causal source of action. To acknowledge Empirical Adequacy (Desideratum 1), the situation is often the primary causal source.
  *   **The Trade-off:** Acknowledging the full weight of situationist data undermines the basis for blaming the agent for failing to be virtuous in a "bad" situation.

  ---

  ### III. Scoring the Fixes

  Here is the evaluation of the two standard theoretical repairs against the spec above.

  #### Fix A: Global Virtues via 'Trait-Activation Profiles'
  *The Logic:* Virtues are global but conditional. A trait is not "Honesty" but "Honesty-when-it-is-safe-to-be-honest." The trait includes a sensitivity to situational triggers. It fires only when the context matches the profile.

  *   **Empirical Adequacy:** **PASS.** It accommodates low cross-situational correlation by admitting the trait doesn't fire in non-matching contexts. It explains why behavior varies without denying the trait exists.
  *   **Trait/State Distinction:** **PASS.** The profile itself is stable over time, even if the behavioral output varies.
  *   **Normative Guidance:** **STRRAIN.** It tells the agent to "cultivate sensitivity," but risks circularity. How do I know which situations *should* trigger the virtue? If the profile is too specific, it becomes a rule; if too vague, it doesn't predict.
  *   **Responsibility:** **PASS.** The agent is responsible for calibrating their activation profile correctly.
  *   **Explanatory Unity:** **PASS.** Maintains a unified self with complex internal logic.
  *   **Critical Flaw:** **The Ad Hoc Risk.** If every failure to act virtuously is explained away as "the activation profile didn't match," the theory becomes unfalsifiable. It risks hand-waving by redefining the trait to fit every behavioral anomaly.

  #### Fix B: Purely Local 'Situational Virtues'
  *The Logic:* Abandon global traits. Virtues are local skills (e.g., "Office-Courage," "Home-Courage"). Character is a fragmented collection of context-specific habits.

  *   **Empirical Adequacy:** **HIGH PASS.** Perfectly matches the low cross-situational correlation data. It predicts exactly what psychology finds: behavior clusters by situation, not by person.
  *   **Trait/State Distinction:** **FAIL.** If "Office-Courage" and "Home-Courage" do not correlate, they function more like states or skills than character traits. The "self" is just a container for unrelated modules.
  *   **Normative Guidance:** **FAIL.** It offers no unified target for moral improvement. I cannot aim to "be courageous"; I must aim to "be courageous in context X, Y, and Z." This turns ethics into a checklist of situational rules.
  *   **Responsibility:** **STRAIN.** It is harder to blame an agent for lacking "Home-Courage" if they possess "Office-Courage," as there is no unified character to critique.
  *   **Explanatory Unity:** **FAIL.** Explicitly sacrifices the unity of the self. It denies the Integrity Constraint to save the Empirical Constraint.
  *   **Critical Flaw:** **The Death of Ethics.** By saving the science, it kills the philosophy. It reduces virtue ethics to behavioral training in specific environments, losing the aspirational concept of a "good person."

  ### Summary Verdict

  *   **Fix A (Activation Profiles)** is the only viable path for *ethics*, but it requires rigorous constraints to prevent unfalsifiability. It must specify *which* situational features legitimately deactivate a virtue (e.g., physical danger) versus which do not (e.g., social awkwardness).
  *   **Fix B (Local Virtues)** is the only viable path for *psychology*, but it surrenders the core claim of virtue ethics: that character is a unified, cross-situational excellence.

  **The Logic Bottom Line:** You cannot have high predictive accuracy across diverse situations *and* a robust, action-guiding concept of global character. You must choose: either virtues are real but weak predictors (Fix A), or behavior is predictable but virtues are fragmented fictions (Fix B). Most ethicists choose Fix A and accept the reduced predictive power as the cost of maintaining normative agency.
