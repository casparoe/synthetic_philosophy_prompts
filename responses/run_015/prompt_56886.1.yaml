answer: |-
  Elena's spreadsheet was clean, which was the first lie. Cell B4 held the variable *p*: the probability of a single group being confidently wrong. She typed `0.1666`. One in six. A generous estimate, given the Voss Preprint that underpinned all eleven assays.

  She highlighted the row for the independent calculation. Eleven groups. Four university labs, two startups, the National Institute, the Foundation, the lone operator in the leased greenhouse. If their errors were independent, the probability that *at least one* would judge the risk acceptable in error was `1 - (5/6)^11`.

  She hit enter. `0.865`.

  Eighty-six percent. Nearly certain disaster. If the groups were truly independent, the sheer weight of numbers guaranteed a leak. The logic of the unilateralist's curse was arithmetic: you only need one person to be wrong to undo the caution of ten.

  Then she adjusted for the ancestry. They weren't independent. They all used the K-12 Assay. Three of the lead postdocs had trained under the same two people at Zurich. They shared the same blind spot.

  She changed the formula. If the error was systemic, the probability of *at least one* error collapsed to the probability of the system being wrong. `0.1666`.

  Sixteen percent. Much safer.

  Except it wasn't. The median judgment—the wisdom of crowds she was hired to rely on—only worked if the errors cancelled out. If the errors were correlated, the median wasn't a correction; it was an echo. The sixteen percent wasn't the chance of a leak; it was the chance of a consensus catastrophe. If they were wrong, they were all wrong.

  Elena saved the file as `Risk_Model_v9` and closed her laptop. The number had failed her. It offered safety where there was only synchronization.

  ***

  The conference call connected at 0900 UTC. Eleven icons lit up the grid. Thorne's video was on; he was in a wood-paneled office that cost more than Elena's annual budget.

  "We can't wait for the monsoon data," Thorne said. His audio was crisp, uncompressed. "Helix is filing patents in Jakarta. If we sit here calculating error bars, they own the nitrogen market by harvest."

  "Helix is one of the eleven," Elena said. She kept her voice flat. "If they release, the field is contaminated for everyone. Restraint by the other ten purchases nothing. You know the protocol."

  "Protocol is for peacetime," Thorne said. "This is a race. Second place is zero."

  "It's not a race," Elena said. "It's a lottery. We all hold tickets. Moving first doesn't change the odds of the hazard, it just claims the prize. And the prize is priority, not safety."

  Thorne leaned in. "Priority is survival, Elena. Without it, there's no funding for safety. You want this Registry to exist next year? Don't treat us like children."

  He muted himself before she could answer. The silence stretched, filled only by the hum of the server line. He hadn't threatened her explicitly, but the budget review was scheduled for Thursday. The correction had cost her the Institute's cooperation. She marked `Natl_Inst` as `Non-Compliant` in her sidebar.

  "Proposal," Elena said to the grid. "We bind to the median. No group releases until the aggregate risk assessment falls below the threshold. No single outlier can move the lever."

  Keller from the startup unmuted. "Binding? Legally?"

  "Morally. Technically. We lock the release codes to the Registry's consensus algorithm."

  "And who holds the key?" Keller asked.

  "I do," Elena said.

  "That's unilateral," Thorne said, unmuted again.

  "It's the only way to make the median real," Elena said. "I draft the pact. You sign. I enforce."

  She saw the hesitation ripple through the icons. Some shifted in their chairs. One looked off-camera to a lawyer.

  "Fine," Keller said. "Send the draft."

  ***

  Elena wrote the pact in her office that night. She included the clause that bound them to the median assessment, overriding individual risk tolerances. To get it into the system before Thorne could lobby the others, she uploaded it to the secure portal and triggered the signature request without the standard forty-eight-hour comment period.

  It was an act of unilateralism to prevent unilateralism. She knew the irony tasted like copper.

  By morning, ten signatures were in. Thorne's was pending. Keller's came with an addendum regarding IP protection that effectively neutered the safety clause, but Elena accepted it. She needed the quorum.

  Then the email arrived.

  *From: Dir_Agri_Dept [Gov.cn]*
  *To: Registry_Admin*
  *Subject: Inquiry regarding K-12 Assay Hazard Data*

  "Who gave them the URL?" Elena asked the empty room.

  The Registry was supposed to be private, a coordination hub for the eleven. But she had made the metadata public to ensure transparency. To shrink the number of dangerous actors, she had advertised the danger.

  Amara called an emergency session. Her video feed was shaky, satellite latency lagging her voice by two seconds.

  "The season starts in three weeks," Amara said. She represented the Foundation, but she spoke for the farmers in the Sahel. "My figures show a thirty percent yield drop if we use current fertilizer supplies. The supply chain is broken. Your median assessment says wait. My median assessment says starve."

  "We don't know the hazard probability," Elena said. "The correlation means we could all be blind to it."

  "I know the hazard of hunger," Amara said. "It is one hundred percent. It is not a model. You ask us to bind ourselves to a median that includes Thorne, who wants market share, and Keller, who wants IP lockup. That is not wisdom. That is averaging lies."

  "Keller's caution isn't epistemic," Elena said. "It's legal."

  "Then why is his vote worth the same as mine?" Amara asked. "You built a machine to weigh truth, Elena. But you put weights on the scale."

  "The twelfth party knows," Elena said. "If we release, they release. They have no safety protocols."

  "If we don't release, they still release," Amara said. "They scraped your registry. They know the tech exists. They know you think it's risky. That tells them it's valuable."

  Elena looked at the roster. Eleven groups. Plus the twelfth, out there, downloading the assay parameters from her own public portal. The apparatus built to shrink the number of dangerous actors had increased it.

  Thorne's signature appeared on the pact.

  "Done," Thorne said. "We're bound. Median rules. Now, what is the median?"

  Elena pulled up the dashboard. The risk assessments had updated overnight.
  Natl_Inst: Low Risk.
  Helix: Low Risk.
  Foundation: High Risk.
  Uni_Labs: Mixed.

  The median shifted. With Thorne and Keller locked in, the weight tipped. The aggregate risk score dropped below the threshold.

  "The pact says we follow the median," Thorne said. "The median says go."

  "The correlation—" Elena started.

  "—means we're all using the same map," Thorne finished. "If the map is wrong, we're all wrong. But we're going together. That's safer than going alone."

  "It's not safer," Elena said. "It's just synchronized."

  "Release the codes, Elena," Thorne said. "You're the keyholder. The pact is signed. The median is clear."

  Amara looked at her. "Don't do it."

  "If I don't," Elena said, "Thorne will bypass the Registry. He'll claim the pact is void. The eleven will fracture. The twelfth will move."

  "If you do," Amara said, "you validate the hazard for the twelfth. You give them the green light."

  Elena looked at the `Execute` command. It was a simple script. If she ran it, the Registry would broadcast the clearance to all eleven partners simultaneously.

  If one person ran it, it was an administrative function.
  If eleven people ran it, it was a coordinated global rollout.

  But she was the only one with the key.

  She thought about the math. The independent risk was eighty-six percent. The correlated risk was sixteen percent. But the cost of the sixteen percent was total.

  She thought about Amara's farmers. Thirty percent yield drop. Hunger was a certainty; the hazard was a probability.

  She thought about the twelfth party. They were already in the system. The transparency meant to ensure accountability had ensured proliferation.

  "Elena," Thorne said. "The clock."

  She opened the command line. She could delete the Registry. She could wipe the server. But the data was mirrored. She could refuse the command. But Thorne would release anyway, without the coordination that might mitigate the damage.

  She hovered over the key.

  If she pressed it, she authorized the release.
  If she didn't, she authorized the fracture.

  There was no third option. The structure of the problem allowed only for unilateral action or collective disaster. She had tried to build a bridge between them, and the bridge was made of the same flawed material as the ground beneath it.

  She typed a command. Not `Execute`. Not `Abort`.

  She initiated the public broadcast of the raw risk data. All of it. The Voss Preprint, the K-12 Assay flaws, the correlation analysis, the dissenting opinions from the Foundation.

  If one person published data, it was science.
  If eleven published conflicting data, it was market chaos.

  By publishing it herself, she made it a single signal. It would panic the markets. It would delay the release. It would give the twelfth party everything they needed to synthesize the microbe without the safety coating.

  It was the only move that kept the decision hers.

  "What are you doing?" Thorne asked.

  "Transparency," Elena said.

  "You'll crash the futures," Keller said.

  "You'll stop the planting," Amara said.

  "Maybe," Elena said.

  She hit `Send`.

  The progress bar crawled across the screen. One percent. Ten percent.

  She stood up and walked to the window. Below, the city was green. Trees fixing nitrogen in the soil, quietly, without assays or registries.

  Her phone buzzed. A notification from the server. Broadcast complete.

  She had done something unobjectionable. She had released information.
  If eleven had done it, sending eleven different versions of the truth, it would have been noise.
  Because she did it alone, it was a verdict.

  She waited for the consequences. They would not be immediate. They would not be clean.

  Elena picked up her bag. She had work to do. The twelfth party would be calling soon. She needed to decide what to say when they asked for the assay.

  She locked the office door behind her.
