answer: |-
  # Workshop Design: The Archive of Oakhaven

  **Time:** 90 Minutes
  **Participants:** 10 (plus you as Facilitator)
  **Materials:** 
  *   30 Index cards (written with specific items, see below).
  *   50 Poker chips or tokens ("Future Chips").
  *   Masking tape (to mark "Archive Space" on a table).
  *   3 Role Cards (printed or handwritten).
  *   A timer.

  ## Part 1: Facilitator Setup (Before they arrive)

  **The Scenario:** 
  The town of Oakhaven existed for 100 years because of One Factory. The Factory closed yesterday. The town is bankrupt. The Historical Archive must move from the Town Hall to a small, damp basement. There is no money to heat the basement. Every object kept costs money to store and preserve. Every object destroyed releases scrap value to feed the town *now*.

  **The Physical Space:** 
  Tape off a rectangle on a large table. This is the "Archive." 
  *   **Round 1:** The rectangle is large (fits 20 cards).
  *   **Round 2:** Shrink the rectangle (fits 12 cards).
  *   **Round 3:** Shrink again (fits 6 cards).

  **The Items (Write these on index cards):**
  *   *The Founding Charter* (Hand-signed by the original owner).
  *   *The Foreman's Log, 1924* (Details a strike that was violently suppressed).
  *   *A photo of the First Shift* (Faces are faded).
  *   *The Safety Medal* (Awarded after a fatal accident).
  *   *Payroll Ledgers* (5 separate books, heavy, take up 2 slots each).
  *   *The Mayor's Correspondence* (Shows corruption).
  *   *Children's Drawings of the Factory* (Crayon on paper).
  *   *The Blueprints* (Essential if the factory ever reopens).
  *   *The Union Banner* (Tattered).
  *   *A collection of Machine Parts* (Rusty, heavy, 3 cards).
  *   *(Fill the rest with mundane items: Time cards, lunch menus, holiday party photos, etc.)*

  **The Economy (Hidden Mechanism):**
  *   **Upkeep:** At the start of every round, the Archive must pay 1 "Future Chip" per item stored to the Facilitator (The Bank).
  *   **Income:** The town starts with 10 Chips. If Chips hit 0, the town starves (Game Over).
  *   **Recycling:** Destroying an item gives the town 2 Chips immediately.
  *   **The Trap:** Preservation drains the town's ability to live in the present. Destruction feeds the present but erases identity.

  ## Part 2: Participant Instructions (Read this aloud)

  "Welcome to Oakhaven. The factory is closed. We are the Archive Committee. Our job is to decide what stays in the basement and what gets scrapped.

  We have three teams. You will not be told why the other teams are arguing. You only know your own mission.

  **Team 1: The Inspirers**
  Your goal: Ensure the town remembers its *glory*. You must save the items that show Oakhaven as strong, heroic, and worthy of respect. If the town forgets it was once great, it will never rise again.
  *Secret Objective:* You must have at least 3 'Heroic' items on the table at the end, or you fail.

  **Team 2: The Guardians**
  Your goal: Save *everything* you can. Every receipt, every photo, every broken part. You owe it to the ancestors to keep their memory intact. To throw something away is a betrayal.
  *Secret Objective:* You must have the highest *number* of items on the table at the end, or you fail.

  **Team 3: The Builders**
  Your goal: Make space for the *future*. The past is heavy. We need resources to survive today. If an item doesn't help us build something new, it is dead weight.
  *Secret Objective:* You must ensure the town has at least 15 'Future Chips' at the end, or you fail.

  **The Rules:**
  1. Items take up physical space. If the table is full, nothing new enters.
  2. Every item on the table costs 1 Chip per round to store. Pay me (The Bank) at the start of each round.
  3. You can destroy an item to gain 2 Chips instantly.
  4. If we run out of Chips, the town collapses. If we run out of Space, the archive floods.
  5. You have 15 minutes per round to negotiate.

  Do not share your Secret Objectives. Argue for what you think is right."

  ## Part 3: The Rounds (60 Minutes Total)

  **Round 1: The Move (20 Minutes)**
  *   **Space:** Large (20 slots).
  *   **Bank:** 10 Chips.
  *   **Action:** Let them sort the 30 cards. They will likely try to keep most things.
  *   **Facilitator Move:** Collect the Upkeep cost (1 Chip per card). Watch them panic when they realize they don't have enough Chips to keep everything.
  *   **Intervention:** If they stall, announce: "The basement leaks. Space is being reduced."

  **Round 2: The Squeeze (20 Minutes)**
  *   **Space:** Medium (12 slots). Physically remove cards that don't fit.
  *   **Bank:** Whatever remains from Round 1.
  *   **Action:** They must cull. Team 3 (Builders) will want to shred items to get Chips. Team 2 (Guardians) will resist. Team 1 (Inspirers) will fight for specific "heroic" cards.
  *   **Facilitator Move:** Increase tension. "Heating costs are up. Upkeep is now 2 Chips per item." (This accelerates the drain).

  **Round 3: The Verdict (20 Minutes)**
  *   **Space:** Small (6 slots).
  *   **Bank:** Critical level.
  *   **Action:** Forced elimination. They must choose the final 6 items.
  *   **Facilitator Move:** Enforce the Secret Objectives. Reveal who failed.
      *   Did Team 2 save the most items? (Likely not, they drained the Chips).
      *   Did Team 3 get 15 Chips? (Likely yes, but at what cost?)
      *   Did Team 1 keep the Heroes? (Or were they scrapped for food?)

  ## Part 4: The Debrief (30 Minutes)

  **Step 1: The Physical Feeling (5 Mins)**
  Ask: "How did your chest feel when you had to throw away the Children's Drawings to get Chips?" "How did it feel to demand space for a rusty bolt when the town was starving?"
  *Goal:* Validate the stress. This wasn't a logic puzzle; it was a moral injury.

  **Step 2: Mapping the Modes (10 Mins)**
  Explain the three roles they just played, using plain language:
  *   **Team 1 (The Inspirers):** You treated the past as a **Model**. You wanted to imitate the great figures.
      *   *The Danger:* Did you feel small? Did you ignore the bad stuff (the strike, the accident) just to keep the 'Heroic' image? That distorts history. It makes the present feel too weak to match the past.
  *   **Team 2 (The Guardians):** You treated the past as **Sacred**. You wanted to preserve every detail.
      *   *The Danger:* You nearly starved the town. By trying to save everything, you made it impossible for anyone to live *now*. You became a museum, not a home.
  *   **Team 3 (The Builders):** You treated the past as **Obstacle**. You broke from tradition so the present could breathe.
      *   *The Danger:* You gained resources, but did you cut off a limb you needed? If you destroyed the Founding Charter, do you even know who you are anymore?

  **Step 3: The Critical Trap (10 Mins)**
  Focus on Team 3. Nietzsche argues that breaking from the past is necessary, but it carries a specific risk: **The judgment turns back on the judge.**
  *   *Ask Team 3:* "When you decided an item was worthless, who gave you the authority to decide that?"
  *   *Explanation:* "In the game, destroying items gave you power (Chips). In real life, destroying your own history is painful. It is a self-injury. You are cutting off part of yourself to survive. The game made destruction feel like 'winning.' In reality, critical judgment should feel like surgery: necessary, but bloody. If you get too good at destroying the past, you will eventually turn that knife on your own current values. You become rootless."

  **Step 4: Synthesis (5 Mins)**
  "We need all three. We need Heroes to inspire us (Team 1). We need Roots to ground us (Team 2). We need the Axe to clear space for growth (Team 3). But if any one team takes total control, the town dies. The goal isn't to pick a winner. It's to keep the tension alive without letting it break the table."

  ## Part 5: Predictive Troubleshooting

  **Problem 1: The "Builder" Domination**
  *   *Prediction:* Team 3 will realize early that destroying items generates Chips. They will aggressively shred everything to hoard resources, winning the game mathematically but ruining the experience.
  *   *Fix:* As Facilitator, introduce a "Morale Check." If they destroy a 'Sacred' item (like the Founding Charter or Children's Drawings), announce: "The town is fed, but depressed. No new work gets done." Penalize their Chip income for the next round. This simulates the psychological cost of rootlessness.

  **Problem 2: Politeness and Avoidance**
  *   *Prediction:* Since these are friends, they will compromise too easily. "Let's just keep it all."
  *   *Fix:* You must be the "Cruel Banker." Do not negotiate on the Upkeep Cost. If they can't pay, *you* physically remove items from the table randomly. This forces them to fight for control rather than agreeing to ignore the rules. Tell them: "If you don't choose what goes, I will choose for you."

  **Problem 3: Intellectualizing the Game**
  *   *Prediction:* Someone will try to solve the math perfectly and ignore the emotional weight of the items.
  *   *Fix:* During the debrief, call them out gently. "You calculated the slots perfectly. But how did you feel when you threw away the photo of the First Shift?" Force them to reconnect with the visceral cost.

  ## Part 6: The Limitation (Facilitator Note)

  **What this activity cannot do:**
  The game mechanics make "Critical History" (Team 3) transactional. You destroy X, you get Y Chips. It feels like a trade.

  **What you must supply in the closing:**
  Nietzsche argues that true Critical History is not a trade; it is a **violence against oneself**. When we judge the past, we are judging the soil we grew out of. It should hurt. The game cannot simulate the pain of admitting that your own "heroes" were flawed or that your own "traditions" were oppressive.
  *   *Closing Script:* "In this game, destroying the past gave you points. It felt like power. But Nietzsche warns that this power is dangerous. When we condemn the past, we are condemning the forces that made us. It is a necessary self-injury. We cut away a part of our own identity to survive. If you leave here thinking 'breaking from the past is efficient,' you missed the point. It is never efficient. It is always painful. We only do it because the alternative is suffocation."
