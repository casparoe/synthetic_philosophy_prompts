      *   **The Paradox:** The Lottery Paradox (Kyburg). If each juror is justified in believing $P$ (guilt) with high probability, are they justified in believing $P_1 \land P_2 \land ... \land P_{12}$?
      *   **Implicit Assumption:** The system acts as if the unanimous verdict *is* knowledge/certainty, effectively treating the conjunction of individual judgments as preserving the high probability of the individual judgments. This is the "Closure Principle" (justification/knowledge is closed under conjunction).
      *   **Coherence:** Probabilistically, conjunction reduces probability (unless correlation is perfect). So, assuming the conjunction is as secure as the individual components is mathematically incoherent under independence.

  3.  **Perform the Arithmetic:**
      *   **Case 1 (Independence):**
