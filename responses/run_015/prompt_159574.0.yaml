answer: |-
  You have correctly identified a methodological syndrome that plagues comparative historical analysis, particularly in the literature on the Great Divergence. Your intuition that "no amount of data fixes it" is sound because the error is not empirical but structural; it lies in the design of the inquiry rather than the quality of the evidence.

  Here is the carving of the three features you identified, their relationship, and the boundary case.

  ### 1. The Three Features: Distinct but Synergistic

  There is no single established term that captures the conjunction of all three, but they map to distinct concepts in the philosophy of science and social science methodology. They are three different logical errors that travel together because the first incentivizes the second, which validates the third.

  *   **(i) One-directional redescription:** In the literature on concept formation, this is **Concept Stretching** (Giovanni Sartori). When a concept (e.g., "market," "science") is defined by its association with an outcome (industrialization), cases that lack the outcome are systematically coded as lacking the concept, even if they possess the empirical features. This is often driven by **Teleological History**, where the definition of the antecedent is contaminated by knowledge of the consequent.
  *   **(ii) Selection of contrast class by outcome:** In quantitative and qualitative methodology, this is **Selection on the Dependent Variable** (King, Keohane, & Verba). By choosing China *because* it did not industrialize, you bias the search for necessary conditions. You cannot infer the causes of an outcome by only studying cases that vary on the outcome while holding the "cause" constant, if the selection of the case was determined by the outcome itself.
  *   **(iii) Conflation of cause vs. difference:** In the philosophy of explanation, this is a failure of **Contrastive Explanation** (Peter Lipton). A "Why A rather than B?" question seeks a *difference-maker*. However, historians often conflate the *cause of A* (etiology) with the *difference between A and B*. A may have industrialized due to Cause X, while B failed due to Blocker Y. X and Y are different variables. Assuming the difference in outcome must map to a difference in the *presence* of a single cause is the **Difference-Maker Fallacy**.

  **Are they one thing?**
  They are three distinct logical errors, but they form a **syndrome** when the **Method of Difference** (Mill) is applied to unique historical cases without a defined population. The root driver is (ii). Because the foil (B) is selected endogenously (based on the outcome), the researcher is forced to engage in (i) (stretching concepts to maintain the contrast) and falls into (iii) (assuming the difference in outcome implies a simple difference in cause).

  ### 2. The Boundary Case: The Bridge

  Your candidate—"Why did this bridge fail and not that one, when both were built to the same specification?"—is indeed well-posed. It lacks the structural flaws of the Needham question because it satisfies **Exchangeability**.

  *   **Lack of (i) Redescription:** The properties of the bridges (tensile strength, load, material) are defined *ex ante* by engineering specifications, not by the outcome (failure). If the standing bridge has a crack, it is recorded as a crack, not redefined as "not a real crack" because it didn't collapse. The concepts are outcome-independent.
  *   **Lack of (ii) Endogenous Selection:** This is the critical distinction. In the Needham question, China is chosen *because* it lacked the outcome. In the bridge question, the control bridge is chosen *because* it matches the specification (the exogenous variable). The fact that it didn't fail is a discovery, not a selection criterion. The pairing is **Exogenous**.
  *   **Lack of (iii) Conflation:** We are not asking "What caused failure?" in the abstract. We are asking "What variable varied between these two exchangeable units?" Because the reference class (bridges of Spec X) is well-defined, we can assume causal homogeneity. If one failed and the other didn't, a specific local variable (a flaw, a stress event) must differ. We are not conflating the general theory of bridge failure with the specific difference between these two tokens.

  **The Edge:** The boundary between a well-posed and ill-posed "Why A not B?" question is whether the **Reference Class** is defined independently of the outcome. In the bridge case, the class is "bridges of Spec X." In the Needham case, the class is "civilizations," which is ill-defined, and the pairing is "industrializer vs. non-industrializer," which is defined by the outcome.

  ### 3. Verdict on the Needham Question

  The Needham Question ("Why Britain and not China?") is **ill posed as stated**.

  It treats "Britain" and "China" as exchangeable units in a population of "civilizations," but they are unique cases selected specifically for their divergence on the dependent variable (industrialization). This forces the literature into concept stretching (e.g., arguing China had "no market" despite evidence of trade) and causal conflation (assuming the cause of British growth must be the thing China lacked, rather than China having a specific blocker).

  **Is it rescuable?**
  Yes, but only by abandoning the civilizational comparison in favor of **mechanism-specific comparison within a defined reference class**.

  A rescuable reformulation looks like this: *"Why did coal-based steam technology scale in the Lancashire coalfields (1750–1850) but not in the Yangzi Delta coalfields (1750–1850), given similar proto-industrial wage and market conditions?"*

  *   **Why this works:** It defines the reference class exogenously (coalfields in proto-industrial regions). It fixes the matching variables ex ante (wages, markets). It isolates a specific mechanism (energy technology scaling). It removes the teleological baggage of "civilizations" and allows for the possibility that the difference was a specific local blocker (e.g., depth of mines, property rights on subsoil) rather than a holistic cultural absence.

