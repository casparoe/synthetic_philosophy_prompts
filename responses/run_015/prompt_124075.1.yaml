prompt: |-
  I'm the operations manager for a supported-living provider — eight group homes, about forty adult residents, most of whom have an intellectual disability and many of whom also carry psychiatric diagnoses (schizoaffective disorder, emotionally unstable personality disorder, alcohol-related brain damage, and increasingly residents who are ageing into early dementia). Our staff are support workers with three weeks of classroom training and a two-day annual refresher; none of them have any academic background in anything. Incidents happen somewhere in the service two or three times a week — a punch during a personal-care prompt, a stolen wallet, sexual touching in a shared lounge, a violent episode during a relapse — and after each one a shift lead writes it up and, with the clinical lead signing off, decides what follows: a mediation, a behaviour support plan, a referral, a move, or nothing. Our current framework is essentially positive behaviour support: every incident is logged on an antecedent-behaviour-consequence chart and handled as behaviour with causes to be identified and managed. It has two failure modes I keep running into. Staff who let a resident see that they were frightened, hurt or angry get written up for unprofessional conduct and told to stay neutral. And residents and families tell me, in different words, the same thing: that they feel written off, handled like weather or like livestock, that nobody expects anything of them any more and so they have stopped trying.

  I have no academic background myself, but I got talking to a friend who studied philosophy, and she mentioned an old essay — I think by P. F. Strawson, possibly called Freedom and Resentment — which, as she described it, says roughly this: that holding someone responsible isn't a theory you believe but a stance you take, a matter of having reactive attitudes like resentment, gratitude and guilt; that the alternative of treating someone as a thing to be managed or handled is available and sometimes right, but is not the neutral, scientific default it presents itself as; and that you don't have to settle whether anyone has free will before you resent being wronged, because the question is set up backwards. She also said something I've been chewing on: that there is a difference between cases where this person couldn't have done otherwise on this occasion — he was pushed, he didn't know, he was out of his mind — and cases where the person isn't the kind of thing you address as a person at all, and that confusing the two is exactly the mistake our incident forms make, since the chart has one box where you write the diagnosis and another where you write the consequence.

  What I want from you is a written procedure my shift leads can actually run. Constraints: it has to fit on one page, be usable in twenty minutes at a debrief by someone who has never heard the theory, and produce a short written record the clinical lead can sign off or overrule. I'd want it as ordered questions — is this a case for addressing the person or for managing the behaviour, which of those stances is being taken toward whom, and if it's the managing stance, whether the withdrawal is total or partial and temporary or open-ended — with a statement, for each question, of what counts as a sufficient answer and what evidence on the file satisfies it, and with explicit stop points: places where the procedure returns a firm no (do not switch to the managing stance here) and places where it stops and hands the decision to a person because the question is one of values rather than fact. It also has to handle five things that I think break any naive version of this. First, the difference between excusing and exempting, including the cases where a resident is fully capable in some domains and not in others, so the honest answer may be hold him responsible about his money but not about his hygiene. Second, the fact that we only ever deal with the negative side: nobody has a procedure for gratitude, appreciation or restored trust, and I suspect our service is worse at that than at blame. Third, the loop — if we have spent three years treating a resident as a thing to be managed, some of his present incapacity is our doing, so the file is itself part of the cause, and a procedure that asks is he an agent now? is asking about a variable it has been busy depressing. I want to know what the procedure does with that. Fourth, how to keep resentment from sliding into punitiveness, humiliation or a row: what the difference is in practice, not in theory. Fifth, the cases where the proper object of the attitude isn't the resident at all, but a co-resident's grievance on someone else's behalf, or the staff member's own.

  Then please run it on three residents from our service. (A) Marcus, mild intellectual disability and alcohol-related brain damage, has hit a support worker during a shower prompt for the third time this month; afterwards he says he shouldn't have, and means it, and it happens again. (B) Nadia has an emotionally unstable personality disorder diagnosis, steals small sums from co-residents, lies about it, and turns staff against one another; my staff say she knows exactly what she is doing, my clinical lead says it is trauma-driven behaviour and wants a plan with no blame in it, and my own instinct is with the clinical lead. (C) Terrence, floridly psychotic, attacked a co-resident with a kettle because he believed the man was poisoning him; he has since been hospitalised, medicated, and came back saying he remembers it like a dream, and the injured man's family want him moved out. I'd be grateful if at least one of the three came out in a way I'll argue with — I'd least like to be told that Nadia is a full participant and that our management-only approach is the wrong stance toward her, so if that's what the procedure says I want to see it argued rather than asserted. Finally, be explicit about what the procedure cannot settle: whether to call the police, whether to end a placement, whether anyone is blameworthy in the deep sense, and anything else where a page of questions would be pretending.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User Role:** Operations Manager for a supported-living provider (8 group homes, 40 residents).
      *   **Resident Profile:** Intellectual disabilities, psychiatric diagnoses (schizoaffective, EUPD, ARBD, early dementia).
      *   **Staff Profile:** Support workers, minimal training (3 weeks + 2 days refresher), no academic background.
      *   **Current System:** Positive Behaviour Support (PBS), ABC charts, incident reporting.
      *   **Problem:** Two failure modes: 1) Staff punished for human reactions (resentment/fear), 2) Residents feel treated like objects/livestock (no expectations held).
      *   **Theoretical Input:** P.F. Strawson's "Freedom and Resentment" (via a friend). Key concepts: Reactive attitudes (resentment, gratitude) vs. Objective attitude (managing/handling); Excusing (couldn't do otherwise *this time*) vs. Exempting (not the kind of thing to address as a person); The stance is a choice, not a metaphysical fact.
      *   **Deliverable:** A one-page written procedure for shift leads.
      *   **Constraints:**
          *   Fit on one page.
          *   Usable in 20 mins at a debrief.
          *   Understandable by non-academics.
          *   Produce a short written record for Clinical Lead sign-off.
          *   Format: Ordered questions with sufficient answers, evidence requirements, and explicit stop points (firm "no"s and value judgment hand-offs).
          *   Must handle 5 specific complexities: Excusing vs. Exempting (domain specificity), Negative bias (lack of gratitude/trust protocols), The Loop (institutional induced incapacity), Resentment vs. Punitiveness, Misplaced Object (staff/co-resident feelings).
      *   **Application:** Run the procedure on three specific cases (Marcus, Nadia, Terrence).
      *   **Requirement:** At least one outcome should be arguable/challenging (specifically regarding Nadia).
      *   **Disclaimer:** Explicitly state what the procedure *cannot* settle (police, placement ends, deep blameworthiness).

  2.  **Deconstruct Strawson for Operations:**

      *   *Objective Attitude:* Managing, handling, causal explanation (PBS/ABC charts). Good for safety, bad for dignity.
      *   *Reactive Attitudes:* Resentment, gratitude, guilt, forgiveness. Acknowledges agency. Good for dignity/relationship, risky for safety/escalation.
      *   *Excuses:* "I didn't know," "I was pushed," "I was ill." (Temporary suspension of reactive attitudes).
      *   *Exemptions:* "He is a child," "She is severely cognitively impaired." (Permanent/Structural suspension of reactive attitudes).
      *   *The Shift:* Moving from "What caused this?" to "Who is this interaction between?"

  3.  **Drafting the Procedure (The "One-Pager"):**

      *   *Goal:* Needs to be a decision tree or checklist that forces the Shift Lead to categorize the incident *before* deciding the intervention.
      *   *Structure:*
          1.  Incident Summary.
          2.  The Stance Check (Objective vs. Reactive).
          3.  The Capacity/Agency Check (Excuse vs. Exemption).
          4.  The Institutional Check (The Loop).
          5.  The Emotional Check (Resentment vs. Punishment).
          6.  Sign-off.
      *   *Language:* Plain English. No "ontological status," use "treating as a person" vs. "treating as a patient."
      *   *Addressing the 5 Complexities:*
          1.  *Excuse/Exempt:* Include a "Domain Specific" question.
          2.  *Negative Bias:* Include a "Restoration" step.
          3.  *The Loop:* Include a "History of Expectation" question.
          4.  *Resentment:* Define boundaries (Safety vs. Dignity).
          5.  *Object:* Ask "Who was wronged?"

      *(Self-Correction during drafting)*: A full page of text is hard to read in a crisis. It needs to be a form with checkboxes and short text fields. I will design it as a "Post-Incident Stance & Action Form."

  4.  **Refining the Procedure (Iterative Process):**

      *   *Question 1:* Was anyone hurt or frightened? (Safety First). If yes, Objective Stance is mandatory *during* the incident. Post-incident is where the choice happens.
      *   *Question 2:* The "Who" Question. Was this a person acting or a symptom happening? (Excuse vs. Exemption).
      *   *Question 3:* The "Loop" Question. Have we lowered expectations so much they forgot how to act?
      *   *Question 4:* The "Feeling" Question. Is the staff anger about safety or dignity?
      *   *Stop Points:* If safety is immediate risk -> Objective. If capacity is totally absent -> Objective. If capacity is present -> Reactive (with safeguards).

  5.  **Developing the Case Studies:**

      *   **Marcus (ARBD + ID):** Hits during shower. Says sorry, repeats.
          *   *Analysis:* ARBD affects impulse control/memory. Is he exempt? Probably partial. He *knows* it's wrong (says sorry). This suggests agency exists but control is weak.
          *   *Procedure Outcome:* Mixed stance. Manage the shower (Objective) to ensure safety, but hold responsible for the apology/repair (Reactive). Don't just chart it as "behavior."
      *   **Nadia (EUPD):** Steals, lies, manipulates. Staff say "she knows," Clinical says "trauma."
          *   *Analysis:* This is the crux. EUPD often involves high cognitive capacity for manipulation but emotional dysregulation. Treating her purely as "trauma-driven" (Objective) removes her agency and confirms her fear that she is "broken." Treating her as fully responsible without support is punitive.
          *   *Procedure Outcome:* **The Arguable One.** The procedure should likely push for holding her responsible (Reactive Stance) regarding the theft, while supporting the emotional regulation. If we treat her as exempt, we collude in the "sick role" that prevents growth. The procedure must distinguish between *understanding* the cause (trauma) and *addressing* the agent (Nadia).
      *   **Terrence (Psychosis):** Attacked during delusion. Medicated now. Doesn't remember well.
          *   *Analysis:* During the act, he was exempt (psychosis). Now, he is likely excused (post-acute).
          *   *Procedure Outcome:* Objective stance on the incident (safety/medical). Reactive stance on the return (reintegration). The family's grievance is valid (they are the victims), but moving him might be an over-reaction if the psychosis is managed. The procedure flags the family's reactive attitudes as valid but separate from Terrence's exemption status *at the time*.

  6.  **Addressing the Constraints & "Cannot Settles":**

      *   Need a clear section at the bottom: "This form does not decide..."
      *   Need to ensure the "One Page" constraint is respected in the *design* (even if text output here is longer, I must structure it to *look* like a one-pager).
      *   Need to ensure the "20 minutes" constraint is met (simple questions).

  7.  **Final Review against Strawsonian Concepts:**

      *   *Reactive Attitudes:* Are we allowing space for "I am angry you stole from me" without it becoming "You are evil"? Yes, via the "Restoration" section.
      *   *Excuse vs. Exemption:* Distinguished in Q2.
      *   *The Loop:* Addressed in Q3.
      *   *Objectivity:* Defined as "Safety/Medical Management."
      *   *Values:* Handed to Clinical Lead in the Sign-off.

  8.  **Drafting the Content:** (Mental check of the tone: Professional, operational, but philosophically rigorous).

      *   *Title:* Post-Incident Stance & Action Record (PISAR).
      *   *Sections:* Incident Basics, Stance Determination, The "Loop" Check, Emotional Audit, Action Plan.
      *   *Case Runs:* Walk through Marcus, Nadia, Terrence using the form logic.
      *   *Limitations:* Explicit list.

  9.  **Refining the Nadia Argument:**
      *   Why is it arguable? Because the Clinical Lead wants "no blame." The procedure will suggest that "no blame" = "no agency." If Nadia has the capacity to steal and lie strategically, treating her as incapable is infantilizing. The procedure should recommend a "Reactive Stance with Support" (i.e., "You stole, you must repay, we will help you manage the urge, but you did it."). This challenges the "medical model" dominance.

  10. **Final Polish:** Check word count and formatting to ensure it *feels* like a tool. (I will present the procedure clearly boxed or formatted to simulate the one-page constraint).

  *(Self-Correction on "One Page"):* I cannot physically force the user's printer, but I will write the procedure section to be concise enough to fit on a single A4 sheet with standard margins, distinguishing it from the explanatory text and case studies.

  *(Self-Correction on "Stop Points"):* Make sure Q1 (Safety) is a hard stop for Objective Stance *during* the event, but the form is for *after*. The form decides the *response* stance.

  *(Self-Correction on "The Loop"):* Ensure Q3 asks: "Have we stopped asking this person to try?"

  *(Self-Correction on "Resentment"):* Ensure the distinction is made between "I feel hurt" (Valid) and "I want to hurt back" (Invalid).

  Let's assemble.
answer: |-
  ## PART 1: THE PROCEDURE
  *(Designed to be printed single-sided A4. Complete in 20 minutes.)*

  # POST-INCIDENT STANCE & ACTION RECORD (PISAR)

  **Resident:** ___________________ **Date:** __________ **Shift Lead:** ___________________
  **Incident Summary (2 lines max):** _________________________________________________________________________

  ### 1. THE SAFETY STOP (Hard Constraint)
  **Q:** Did this incident involve immediate risk of serious physical harm or sexual violation?
  *   **YES:** **STOP.** The *Objective Stance* (Safety/Management) is mandatory for immediate response. Proceed to Section 3 (Action).
  *   **NO:** Proceed to Q2.

  ### 2. THE STANCE CHECK (Excuse vs. Exemption)
  **Q:** At the time of the incident, was the resident capable of understanding this action affects another person?
  *   **Evidence:** (e.g., prior warnings, ability to apologize, domain-specific capacity).
  *   **Decision:**
      *   **[ ] Exempt:** They *could not* engage as a person (e.g., florid psychosis, severe dementia episode). *Stance: Objective (Medical/Management).*
      *   **[ ] Excused:** They *can* engage as a person, but not *this time* (e.g., extreme provocation, acute panic). *Stance: Objective for incident, Reactive for repair.*
      *   **[ ] Agent:** They *can* and *did* engage as a person (e.g., calculated theft, verbal abuse with awareness). *Stance: Reactive (Responsibility/Repair).*
  *   **Domain Note:** If capable in some areas (money) but not others (hygiene), specify: ___________________

  ### 3. THE LOOP CHECK (Institutional Cause)
  **Q:** Have we lowered expectations for this resident so far that we contributed to this incident?
  *   **Evidence:** (e.g., "We stopped asking him to wait," "We do everything for her").
  *   **If YES:** You must include one expectation-restoring action in the Plan (Section 5).
  *   **If NO:** Proceed.

  ### 4. THE EMOTIONAL AUDIT (Resentment vs. Punishment)
  **Q:** Who holds the grievance, and what is its shape?
  *   **Victim:** [ ] Resident [ ] Staff [ ] Family [ ] Other
  *   **Feeling:** (e.g., "I feel disrespected" vs. "I want them to suffer").
  *   **Constraint:** If the feeling is "I want them to suffer," **STOP.** This is punishment, not responsibility. Consult Clinical Lead.
  *   **Valid Reactive Attitude:** (e.g., "I am angry trust was broken," "The neighbor feels unsafe").

  ### 5. ACTION PLAN (Max 3 items)
  *Must match the Stance chosen in Q2.*
  1.  **Management (Objective):** (e.g., Meds review, environmental change, supervision level).
  2.  **Repair (Reactive):** (e.g., Apology, restitution, conversation about impact, restoration of trust).
  3.  **Expectation (Loop Break):** (e.g., "Resident will pack own bag tomorrow," "Staff will not intervene in argument unless physical").

  **Shift Lead Signature:** ___________________ **Clinical Lead Sign-off:** ___________________
  *(Clinical Lead may overrule Stance Check only with written justification regarding capacity evidence.)*

  ***

  ## PART 2: OPERATIONAL GUIDANCE (For the Clinical Lead)

  **What This Procedure Settles:**
  *   Whether the response treats the resident as a patient (Objective) or a person (Reactive).
  *   Whether staff feelings are validated as human responses or flagged as potential abuse.
  *   Whether the service is inadvertently causing incapacity ("The Loop").

  **What This Procedure CANNOT Settle (Requires Senior Management/Legal):**
  *   **Police Involvement:** This form does not determine criminal liability.
  *   **Placement Termination:** Moving a resident is a strategic/legal decision, not a philosophical one.
  *   **Metaphysical Blame:** We do not decide if they are "truly" free; we decide if treating them as free *works* for their dignity and safety.
  *   **Diagnostic Validity:** This form accepts the diagnosis but questions its relevance to *this specific incident*.

  ***

  ## PART 3: CASE RUNS

  Here is how the PISAR runs on your three residents. I have highlighted the arguable outcome in Case B.

  ### CASE A: Marcus (ARBD + ID)
  *Incident: Hit support worker during shower prompt (3rd time). Apologizes afterwards. Repeats.*

  *   **Q1 (Safety):** YES (Physical violence). **STOP.** Immediate response is Objective (Safety).
  *   **Q2 (Stance):** **Excused/Agent Hybrid.** ARBD impairs impulse control, but his ability to apologize and mean it shows he understands the *norm* was broken. He is not *Exempt* (like a toddler); he is an Agent with a specific impairment.
      *   *Domain:* Not capable of impulse control during washing; Capable of moral repair afterwards.
  *   **Q3 (Loop):** Likely **YES**. If we just chart "behavior" and continue the same prompt style, we are managing him into failure.
  *   **Q4 (Emotion):** Staff feel hurt/fearful. Valid.
  *   **Q5 (Action):**
      1.  *Management:* Change shower prompt technique (Visual aids vs. Verbal).
      2.  *Repair:* Marcus must verbally acknowledge the hurt caused (not just "sorry," but "I hurt you").
      3.  *Expectation:* Marcus must initiate the apology without prompting.
  *   **Outcome:** We stop treating the *violence* as a mere symptom to be extinguished. We treat the *repair* as a duty he is capable of. This maintains his status as a moral agent despite the disability.

  ### CASE B: Nadia (EUPD)
  *Incident: Steals, lies, manipulates staff. Clinical Lead wants "No Blame/Trauma Plan." Staff say "She knows."*

  *   **Q1 (Safety):** NO (Financial/Emotional harm).
  *   **Q2 (Stance):** **Agent.** This is the arguable point. EUPD involves emotional dysregulation, but strategic lying and stealing require cognitive planning. To mark her **Exempt** (Trauma Object) is to decide she is incapable of moral reasoning.
      *   *Evidence:* She lies *to specific people* to *specific ends*. She turns staff against each other (requires Theory of Mind).
      *   *Decision:* **Reactive Stance.** She is responsible for the theft.
  *   **Q3 (Loop):** **YES.** If the Clinical Lead insists on "no blame," we have created a zone where Nadia learns she is not expected to be honest. We are depressing her agency.
  *   **Q4 (Emotion):** Staff feel betrayed. Co-residents feel violated. Valid reactive attitudes.
  *   **Q5 (Action):**
      1.  *Management:* Secure valuables (Safety).
      2.  *Repair:* **Restitution.** Nadia must repay the money (from allowance) and apologize to the victim.
      3.  *Expectation:* Staff must stop "triangulating." If Nadia tells Staff A that Staff B said X, Staff A must say, "I will not discuss Staff B with you."
  *   **The Argument:** Your Clinical Lead views the trauma as the *cause* that removes responsibility. Strawson suggests trauma explains the *difficulty* but does not remove the *stance*. If we treat Nadia as a thing to be managed (Objective), we confirm her internal view that she is "broken" and incapable of choice. Holding her responsible (Reactive) is the more respectful, albeit harder, path. It says: "You are strong enough to be held accountable."

  ### CASE C: Terrence (Psychosis)
  *Incident: Attacked co-resident with kettle (delusion). Hospitalized. Returns medicated. Memory hazy.*

  *   **Q1 (Safety):** YES (Severe physical harm). **STOP.** Immediate response Objective.
  *   **Q2 (Stance):** **Exempt (at time of incident).** Florid psychosis removes the capacity to engage in the moral community *during the act*. He was not "wronging" the man; he was fighting a phantom.
      *   *Current Status:* **Agent.** He is now medicated and returning.
  *   **Q3 (Loop):** **NO.** This was acute illness, not institutional lowering of expectations.
  *   **Q4 (Emotion):** **Misplaced Object.** The grievance belongs to the *Injured Man's Family*, not Terrence (who was ill). However, the Family's demand (Move him) is a Reactive Attitude from *them*.
  *   **Q5 (Action):**
      1.  *Management:* Medication compliance monitoring.
      2.  *Repair:* Terrence cannot apologize for the *delusion*, but he can acknowledge the *impact* ("I am glad you are safe now").
      3.  *Expectation:* The Co-resident's safety plan is paramount.
  *   **Outcome:** The procedure prevents us from blaming Terrence for the psychosis (Excuse), but prevents us from ignoring the victim's family's resentment (Valid Reactive Attitude). The decision to move him is a value judgment (Safety vs. Inclusion) that the Clinical Lead must sign, knowing Terrence was *Exempt* at the time.

  ***

  ## PART 4: IMPLEMENTATION NOTES FOR THE OPERATIONS MANAGER

  **1. Handling the "Resentment vs. Punitiveness" Slide (Constraint 4)**
  The procedure forces this in **Section 4**. Staff are allowed to say "I am angry." They are not allowed to say "They should feel bad."
  *   *Practice:* In debrief, if a staff member says, "He needs to learn," ask: "Do you mean he needs to be safe, or do you mean he needs to suffer?" If the latter, the Clinical Lead must intervene. Resentment seeks restoration of respect; Punishment seeks infliction of pain.

  **2. Handling the "Negative Bias" (Constraint 2)**
  The procedure currently triggers on incidents. To fix the bias, you must run this form for **Positive Incidents** too.
  *   *Adaptation:* When a resident shows exceptional restraint or kindness, fill out the form.
  *   **Q2:** Agent.
  *   **Q5 Action:** **Gratitude.** Not "Good boy," but "Thank you. That made me feel safe." This validates the Reactive Attitude of gratitude, confirming their agency in the good as well as the bad.

  **3. Handling "The Loop" (Constraint 3)**
  **Section 3** is your safeguard against institutional learned helplessness. If you find yourself ticking "YES" on The Loop Check for the same resident three times in a month, the operational problem is not the resident; it is the care plan. You are managing them into incapacity.

  **4. The "One Page" Discipline**
  Do not allow the Shift Lead to write essays in the boxes. If they cannot articulate the stance in two lines, they haven't thought it through. The constraint forces clarity.

  **5. The Nadia Problem**
  Expect resistance from the Clinical Lead on Case B. The medical model views symptoms as things to be cured, not choices to be judged. Your argument is not that Nadia is "healthy," but that **dignity requires the possibility of blame.** If she cannot be blamed, she cannot be praised. If she cannot be praised, she is a pet. The procedure forces the service to decide: Are we keeping her safe, or are we keeping her human? Sometimes, those are in tension.
