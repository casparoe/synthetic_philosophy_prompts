  # HANDOUT: MAPPING THE PHENOMENAL SPACE
  **Module:** Philosophy of Mind (Year 2) | **Topic:** The Illusionism Dispute

  ### STARTING COMMITMENT
  *"I am as certain as I am of anything that there is something it is like for me to see red."*

  ---

  ### THE DECISION TREE

  **NODE 1: The Quietism Check**
  Does resolving this dispute require dissolving the question rather than answering it?
  *   **YES:** The intuition of "something it is like" is a cognitive compulsion generated by language, not a fact about the world. The dispute is a pseudo-problem.
      *   ➔ **LEAF 1: Quietism / Therapeutic Option**
  *   **NO:** The question is meaningful; there is a fact of the matter to be found.
      *   ➔ Go to **NODE 2**.

  **NODE 2: The Retrospective-Insertion Case**
  In the confabulated pain scenario (you remember vivid pain, but no pain signal occurred), did the *phenomenal pain* exist at the time of the seeming?
  *   **NO:** Phenomenality is not an immediate given; it is a constructed judgment that can be false. There is no "phenomenal reality" behind the introspective report.
      *   ➔ Go to **NODE 3 (The Illusionist Branch)**.
  *   **YES:** Phenomenality is immediate; the memory might be wrong, but the experience at the time was real.
      *   ➔ Go to **NODE 5 (The Realist Branch)**.

  **NODE 3: The Recursion Node**
  Is the "illusion" of phenomenality itself *something it is like* to undergo?
  *   **YES:** There is a real introspective experience, but our *concept* of it (as non-physical/ineffable) fails to denote anything real.
      *   ➔ **LEAF 2: Reference-Failure View**
  *   **NO:** The illusion is purely functional/dispositional (a misrepresentation without phenomenal character).
      *   ➔ Go to **NODE 4**.

  **NODE 4: The Reference Node**
  If phenomenality is an illusion, does the word "consciousness" still successfully refer to the underlying functional state?
  *   **YES:** We keep the term for the functional role, acknowledging the phenomenal content is empty.
      *   ➔ **LEAF 3: Frankish-Style Illusionism**
  *   **NO:** The term is tainted by the false theory; we should eliminate it entirely.
      *   ➔ **LEAF 4: Straight Eliminativism**

  **NODE 5: The Replay Case**
  In the frozen replay scenario (complete causal organization stored and run once, frozen, with no output), is the phenomenality present?
  *   **YES:** Phenomenality is intrinsic to the state itself, not dependent on dynamic processing or output.
      *   ➔ Go to **NODE 6**.
  *   **NO:** Phenomenality requires dynamic process or causal potential; a frozen state is dark.
      *   ➔ Go to **NODE 7**.

  **NODE 6: The Fundamental Node**
  If phenomenality is intrinsic to the state, is it a fundamental feature of the physical constituents?
  *   **YES:** The intrinsic nature of matter is phenomenal.
      *   ➔ **LEAF 5: Panpsychism**
  *   **NO:** The intrinsic nature is categorical but only becomes phenomenal at a specific level of complexity.
      *   ➔ **LEAF 6: Russellian Monism**

  **NODE 7: The Fade Case**
  In the fade scenario (access degrades while reportability stays perfect), does the "what it's like" diminish alongside access?
  *   **NO:** Phenomenality stays put while access fades; they are distinct existences.
      *   ➔ Go to **NODE 8**.
  *   **YES:** Phenomenality is tied to access; if access degrades, the experience dims.
      *   ➔ Go to **NODE 9**.

  **NODE 8: The Causal Node**
  If phenomenality is distinct from access (Node 7: NO), does it exert causal power over physical states?
  *   **NO:** It is a byproduct that does not influence the physical chain.
      *   ➔ **LEAF 7: Epiphenomenalism**
  *   **YES:** It influences physical states despite being distinct.
      *   ➔ **LEAF 8: Dualist Interactionism** *(Note: Coherent, but increasingly unoccupied due to causal closure worries).*

  **NODE 9: The Alien Introspection Case (New)**
  An ideal neuro-scan says "No phenomenal state here," but you insist "Yes there is." Is the scan missing data?
  *   **YES:** First-person authority reveals data third-person methods miss; phenomenality is real but non-structural.
      *   ➔ **LEAF 9: Non-Reductive Physicalism**
  *   **NO:** You are mistaken; the scan exhausts the ontology. Phenomenality is identical to the functional role.
      *   ➔ **LEAF 10: Reductive Physicalism**
  *   **MIXED:** The scan is right about the physics, you are right about the *perspective*, but there is no extra ontological ingredient.
      *   ➔ **LEAF 11: UNNAMED (Perspectival Realism)** *(Coherent slot: Phenomenality is real as a perspective, not a property. Rarely defended as a final ontology).*

  ---

  ### HONEST SECTION: WHERE THE TREE BREAKS

  **1. Indistinguishable Leaves**
  This tree struggles to cleanly separate **Frankish-Style Illusionism (Leaf 3)** from the **Reference-Failure View (Leaf 2)**. Both agree the "hard problem" target doesn't exist. The split relies entirely on whether the *introspective seeming* itself has a phenomenal character. In practice, proponents of both views often use identical language about "introspective mechanisms," making this node a verbal dispute rather than a substantive one.

  **2. The Dominant Node**
  **Node 2 (The Retrospective-Insertion Case)** is doing almost all the work. Once you answer "No" (experience is constructed), you are funneled into the Illusionist/Eliminativist cluster regardless of your views on physics. Once you answer "Yes" (experience is immediate), you are locked into Realism. The subsequent nodes (Replay, Fade, Alien) merely sort the Realists; they cannot bridge the gap created at Node 2. The tree secretly reduces to: *Is phenomenality a judgment or a given?*

  **3. The Stacked Deck**
  The phrasing of the cases smuggles in assumptions.
  *   **The Replay Case** assumes "frozen states" are coherent. If you believe consciousness is essentially temporal (a process), the "No" answer is forced by definition, biasing the tree against Panpsychism/Russellian views that might require a different metaphysics of time.
  *   **The Alien Case** assumes a "complete scan" is possible. If Non-Reductive Physicalism is true, such a scan might be impossible in principle, making the "YES" answer the only coherent option for a Non-Reductivist, effectively rigging the node to produce Leaf 9.
  *   **The Recursion Node** forces Illusionists to choose whether the illusion is phenomenal. Many Illusionists want to say the question itself is malformed (edging toward Quietism), but the tree forces them down the Eliminativist path instead.

  **Use this map to locate your interlocutor, not to prove them wrong.**
