      *   *Damage:* Matters for grading. Harming God/Religion is worst. Harming neighbor is next. Helping neighbor without harm is least bad.
      *   *Principle:* The hierarchy is based on the *order of love* (*ordo amoris*). God > Neighbor's Soul > Neighbor's Body > Temporal Goods. Violating the higher good is a worse lie.
      *   *Conclusion:* It's a structured hierarchy based on the violation of the *ordo amoris*, combining intent (why are you lying?) and object (what truth are you violating?).

  4.  **Address Question 2: Always Wrong vs. Excusable:**
      *   *Absolute Prohibition:* Lying disrupts the relationship with God (Truth itself). It corrupts the soul's integrity.
