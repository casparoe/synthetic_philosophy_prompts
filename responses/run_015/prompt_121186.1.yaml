      *   *Reconciliation:* "Excusable" $\neq$ "Permissible." It means the punishment might be lighter, or the moral culpability is mitigated by charity, but the act remains intrinsically disordered. Augustine would say: "Do not lie, even to save a life, because you cannot commit a sin to prevent a temporal evil." (Though he struggles with the 8th grade).

