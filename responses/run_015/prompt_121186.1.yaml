      *   *Context:* Written around 395 AD. Augustine is combating Priscillianism (which justified lying for religious ends) and general moral laxity.
      *   *Definition of a Lie:* Speaking a falsehood with the *intention* to deceive (*fallendi voluntas*).
      *   *The Eight Grades:*
          1.  Religious doctrine (teaching false religion).
          2.  Lying that harms someone unjustly (no one benefits).
          3.  Lying that harms one to benefit another (unjustly).
          4.  Lying for the pleasure of lying (pure malice).
          5.  Lying to please others (flattery).
          6.  Lying to benefit someone financially/physically without harming others.
          7.  Lying to benefit someone without harming others, but protecting them from physical defilement (e.g., hiding a person).
          8.  Lying to protect someone from sexual defilement (rape).
      *   *The Logic of Grading:* It's not *just* external harm, nor *just* internal intent. It's a combination of the *object* of the lie (God vs. neighbor), the *motivation* (malice vs. benevolence), and the *consequence* (eternal damnation vs. temporal harm).
      *   *The Tension:* Augustine maintains lying is *always* a sin (ontological disorder), but sins have *weights* (mortal vs. venial, though he doesn't use those exact later Scholastic terms yet). "Excusable" doesn't mean "good," it means "less culpable" or "more understandable," though still technically sinful.

  3.  **Address Question 1: Intent vs. Damage & The Principle:**
