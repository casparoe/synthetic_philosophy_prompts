answer: |-
  **The Scenario**

  Mara stands before the "Qualia Deck," a near-future neural interface that she knows will disconnect her motor cortex from the real world while maintaining her body in a clinic for exactly forty years—the same duration as her expected natural lifespan. She knows the outside option is an ordinary, decent life: no tragedies, no dependents, no moral duties owed, just forty years of safe, unremarkable continuity where her projects succeed sometimes and fail sometimes, and her relationships are sometimes misunderstood. She knows the Deck offers forty years of optimized phenomenology: the same narrative arcs of love, work, and struggle, but with the administrative friction of reality removed; she will feel the exact qualitative rush of solving a hard problem without the risk of actual failure, and the exact warmth of being understood without the possibility of miscommunication. Crucially, Mara's *actual* desires at this moment are not for "truth" or "causal impact," but for "unimpeded engagement" and "maximal emotional clarity," states the Deck guarantees at 100% efficiency while the outside world offers them at best 60%; she feels no pull toward authenticity, only a strong current desire to minimize the gap between intention and experience.

  ***

  **The Verdicts**

  *   **Hedonism:** Plug in, because the Deck guarantees a higher net balance of positive conscious experience over the forty years.
  *   **Actual-Desire Theory:** Plug in, because the Deck satisfies her current desires for engagement and clarity more completely than the ordinary life.
  *   **Objective List (Agency) Theory:** Stay out, because welfare requires actual causal purchase on the real world, which the Deck cannot provide.

  ***

  **Walkthrough**

  **Hedonism** looks only at the raw feel of the life. Since the Deck offers optimized positive experiences (flow, connection, triumph) without the inevitable pains of real-world friction, and Mara knows this, the hedonist calculates the Deck yields more utility. The "fakeness" of the source is irrelevant; only the phenomenology counts.

  **Actual-Desire Theory** looks at whether what Mara *now wants* gets what she *now wants*. We have stipulated that her current desires are for *qualitative states* (feeling engaged, feeling clear) rather than *factual states* (actually changing matter, actually being understood by another mind). Since the Deck delivers these feelings more reliably than the ordinary life, plugging in maximizes desire satisfaction.

  **Objective List (Agency) Theory** posits that certain things are good for us regardless of experience or desire, specifically *actual achievement* and *real agency*. On this view, welfare requires that your efforts actually cause changes in the real world. The Deck simulates the feeling of agency but severs the causal chain; therefore, despite the positive experience and satisfied desires, the Deck life is prudentially inferior because it lacks real accomplishment.

  ***

  **The Single Feature Doing the Work**

  The feature carrying the weight is the **specific orientation of Mara's actual desires toward phenomenology rather than fact.** I have constructed her psychology so that she desires *feelings of success* rather than *success itself*. If you remove this feature—if Mara has normal, mixed desires including a desire to "actually write the book" or "actually help people"—the Actual-Desire theorist can no longer confidently say "Plug In." They would have to weigh the satisfaction of her desire for reality against the satisfaction of her desire for comfort. If that happens, the case collapses back into the boring original Nozick case where the preference theorist might also say "Stay Out," and you lose the clean three-way split that forces the students to isolate the theories.

  ***

  **The Hedonist Objection**

  A hedonist will object: "You haven't proven reality matters; you've just stipulated a theory (Objective List) that assumes reality matters." They will argue that the intuition that "Stay Out is better" is merely a bias we haven't unlearned, not evidence of a real welfare difference. **Does this objection land?** Not really, not in the way that destroys the case. The case does not stipulate the *verdict*; it stipulates the *facts* (the nature of the tech, the content of the desires, the causal disconnect). The verdicts are derived from the theories' own commitments. The hedonist is free to say the Objective List theorist is wrong, but they cannot say the *case* is rigged. The value of this setup is that it forces the hedonist to defend why the "Stay Out" intuition is mistaken even when deception, boredom, and harm-to-others are removed, rather than letting them hide behind those confounds.

  ***

  **On the "Two People" Idea**

  **Drop it.** While having two people plug into a shared simulation addresses the "loneliness" objection, it violates your constraint (3) to "hold everyone else's welfare fixed." If her partner also plugs in, their welfare status changes (either improved or degraded depending on the theory), which introduces a variable you can't control. If the partner stays out, the relationship is asymmetric, reintroducing the "abandonment" confound. For a tight first-year tutorial on *prudential* value, keeping the agent solitary isolates the question of what benefits *her* without needing to track interpersonal welfare comparisons.

  ***

  **On Informed-Desire Theory**

  **Flag:** An **Informed-Desire** version of the preference theory would likely flip the verdict to "Stay Out." If Mara were fully informed not just about the *experience* but about the *causal history* of her states (i.e., "you will feel like you wrote a book, but no book will exist"), she might form a new desire for "actual impact" that she currently lacks. The Actual-Desire theory works here only because we are locked into her *current*, possibly adaptive or narrowed, desires. If the theory allows her desires to update under full information about the nature of the simulation, the preference theorist joins the Objective List theorist in saying "Stay Out," collapsing the split again.
