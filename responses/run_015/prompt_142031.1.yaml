      *   **Premise (6):** *Redundancy Claim:* If (5) is right, (2) is superfluous. Even the original $R$ (actual ballots) fails often.
      *   **Premise (7):** *Epistemic Claim:* Voters can't know if manipulation was possible (don't know others' true preferences). Therefore, no one knows if the outcome binds them.
      *   **Premise (8):** *Alternatives:* Only Dictatorships, Restricted Range, or Random/Ignoring Ballots avoid manipulation. All unacceptable.
      *   **Conclusion (9):** No familiar rule binds anyone, or only unacceptable rules bind. Something must be false.

  3.  **Identify the Core Tension:**
      *   The argument moves from a condition on *actual outcomes* (Step 1: "actual election is not perverse") to a condition on *rules* (Step 2: "strategy-proofness").
