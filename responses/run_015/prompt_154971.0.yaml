  2.  **Deconstruct the Philosophical/Identity Problem (Question 1):**
      *   *Is there a fact of the matter?* In metaphysics, this is the "Ship of Theseus" problem applied to software.
      *   *Software Identity:* Unlike physical objects, software is abstract. It has multiple layers: Code (source), Binary (build), Behavior (spec/output), History (git), Social (community/maintainer), Name (namespace).
      *   *Why does it feel real?* Because "identity" in software isn't just one thing; it's a cluster concept. We feel tension because different stakeholders prioritize different clusters.
