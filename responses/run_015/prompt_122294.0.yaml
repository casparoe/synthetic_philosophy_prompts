answer: |-
  To demonstrate that phenomenal properties (qualia) are not incoherent posits subject to "quining" (Dennett's strategy of dissolving the concept by showing it lacks a stable definition), a theory must satisfy a rigorous set of desiderata. These criteria function as a "job description" for qualia. If a theory cannot meet them, the concept risks being eliminated as a folk-psychological confusion.

  Below is the specification of these desiderata, organized by phenomenological adequacy, conceptual distinctions, defenses against incoherence charges, and external constraints.

  ### I. Phenomenological Adequacy: The Data to be Saved
  A theory must account for the specific intuitive data points that motivate the positing of qualia in the first place.

  **1. The Inverted Spectrum Possibility**
  *   **Desideratum:** The theory must explain how two subjects could be functionally identical (discriminate wavelengths identically, use color terms correctly) while having different qualitative experiences (e.g., one sees red where the other sees green), OR it must provide a compelling argument for why this scenario is metaphysically impossible.
  *   **Motivating Case:** Locke's inverted spectrum argument suggests that functional role does not exhaust phenomenal character. If a theory cannot accommodate the *conceivability* of inversion without contradiction, it fails to capture the intuition that experience is "more than" behavior.

  **2. First-Person Authority (Incorrigibility)**
  *   **Desideratum:** The theory must explain why subjects possess a privileged, non-inferential access to their own current phenomenal states that differs from third-person access.
  *   **Motivating Case:** If I say "I am in pain," it is generally taken as authoritative in a way that "He is in pain" is not. A theory that makes self-ascriptions of pain as fallible as diagnoses of liver disease fails to capture the immediate presence of the experience to the subject.

  **3. Truth-Conditions for Artificial Reports**
  *   **Desideratum:** The theory must provide criteria for determining whether an artificial system making a phenomenal report ("I see red") is speaking truly or merely processing syntax.
  *   **Motivating Case:** As AI advances, systems will claim experience. Without a criterion for what makes such a report *true* (beyond functional output), we cannot distinguish a conscious machine from a "philosophical zombie" machine. The theory must ground the truth-maker of the report.

  ### II. Conceptual Distinctions: Boundaries to Maintain
  To avoid collapsing into functionalism or higher-order thought theories prematurely, the theory must preserve specific categorical boundaries.

  **4. Phenomenal (P) vs. Access (A) Consciousness**
  *   **Desideratum:** The theory must distinguish between a state having a "what-it-is-like" character (P-consciousness) and that state being available for reasoning and report (A-consciousness).
  *   **Motivating Case:** Block's cases of subliminal perception or phenomenal overflow suggest one can have rich experience without full cognitive access. Collapsing P into A reduces qualia to mere data-availability, inviting the charge that the "feeling" has been quined away.

  **5. Intrinsic Quality vs. Relational Functional Role**
  *   **Desideratum:** The theory must specify whether qualitative character is an intrinsic property of the state or wholly constituted by its causal/dispositional relations.
  *   **Motivating Case:** The "quining" argument attacks qualia as undefined intrinsic residues. If the theory claims they are intrinsic, it must define "intrinsic" without mystery. If it claims they are relational, it must explain why they *feel* intrinsic. Failing to address this leads to the charge of equivocation.

  **6. Having a State vs. Knowing One Has It**
  *   **Desideratum:** The theory must distinguish between the instantiation of a phenomenal state and the meta-cognitive awareness of that state.
  *   **Motivating Case:** Higher-Order Theories (HOT) risk making consciousness dependent on thought. A baby or animal might feel pain without possessing the concept "pain." The theory must allow for *unreflected experience* to avoid over-intellectualizing qualia.

  ### III. Defusing Incoherence Charges: The "Quining" Defenses
  These are the specific philosophical attacks that claim the concept of qualia is logically flawed.

  **7. The Private Language Problem**
  *   **Desideratum:** The theory must explain how public language can refer to private experiences without violating the rule-following constraints of meaning.
  *   **Motivating Charge:** Wittgenstein argued that a language referring only to private ostensive definitions is incoherent (no check on correctness). A theory of qualia must show how "pain" refers to a private state without making the meaning of "pain" unknowable to others.

  **8. The Explanatory Gap**
  *   **Desideratum:** The theory must address why physical/functional explanations seem to leave out the phenomenal character, even if it claims they are identical.
  *   **Motivating Charge:** Levine's gap suggests that even a complete physical account leaves the question "Why does this feel like *this*?" unanswered. A theory must either bridge the gap (reduction) or explain why the gap is epistemic rather than ontological.

  **9. Determinability and Transitivity of Similarity**
  *   **Desideratum:** The theory must account for how qualitative similarity is judged. Is "red is more like orange than blue" an objective fact across subjects?
  *   **Motivating Charge:** Goodman and Dennett argue that if qualia are private, we cannot compare them. If similarity is not transitive or comparable across subjects, qualia cannot play a role in a scientific psychology. The theory must ground inter-subjective comparison.

  ### IV. External Constraints: Compatibility Requirements
  The theory cannot exist in a vacuum; it must fit with broader scientific and ethical commitments.

  **10. Compatibility with Predictive-Processing Neuroscience**
  *   **Desideratum:** The theory must locate qualia within a brain architecture understood as hierarchical predictive processing (minimizing prediction error).
  *   **Motivating Case:** If the brain is fundamentally a prediction machine, qualia cannot be passive "qualitative paints." They must play a functional role in error minimization or policy selection. A theory that makes qualia epiphenomenal violates causal closure.

  **11. Moral Weight of Suffering and Pleasure**
  *   **Desideratum:** The theory must explain why phenomenal states (specifically pain/pleasure) carry direct moral significance, distinct from mere preference satisfaction.
  *   **Motivating Case:** We value preventing suffering not just because it stops screaming (behavior), but because of *how it feels*. A theory that reduces pain to "avoidance behavior" struggles to explain why causing pain to a perfectly stoic being is still wrong.

  **12. Conceivability of Philosophical Zombies**
  *   **Desideratum:** The theory must take a stance on whether a physical duplicate without experience is metaphysically possible.
  *   **Motivating Case:** If zombies are conceivable, physicalism is threatened. If they are inconceivable, the theory must explain why the intuition of their possibility is so robust. Ignoring this leaves the metaphysical status of qualia unresolved.

  ---

  ### V. The Tension Matrix: Incompatible Desiderata?
  There are strong reasons to suspect that not all these desiderata can be jointly satisfied. A successful theory must explicitly choose which constraints to relax.

  **1. Intrinsic Nature vs. Causal-Physical Integration (The Primary Tension)**
  *   **Conflict:** Desideratum #5 (Intrinsic Quality) clashes with Desideratum #10 (Predictive Processing/Physicalism).
  *   **Analysis:** Physical science describes the world in terms of relational, structural, and dispositional properties (mass, charge, spin). Qualia are traditionally defined by their intrinsic, non-relational "what-it-is-likeness." If qualia are truly intrinsic, they seem to lack the relational hooks required to enter the causal network of predictive processing. If they are fully integrated into the causal network, they risk being reduced to relational roles, thereby violating the intuition of intrinsicness. **It is highly probable these two cannot be fully jointly satisfied without redefining "intrinsic" or "physical."**

  **2. First-Person Authority vs. Public Verification**
  *   **Conflict:** Desideratum #2 (First-Person Authority) clashes with Desideratum #7 (Private Language/Public Meaning).
  *   **Analysis:** If I am the ultimate authority on my qualia, my reports are incorrigible. But if my reports are incorrigible and private, there is no public criterion for correctness, threatening the coherence of the language used to describe them (Wittgenstein). A theory must either make first-person access fallible (saving public meaning) or make qualia publically accessible (saving meaning but losing privacy).

  **3. Moral Weight vs. Evolutionary Function**
  *   **Conflict:** Desideratum #11 (Moral Weight) clashes with Desideratum #10 (Evolutionary/Functional role).
  *   **Analysis:** If pain is morally weighty because of its intrinsic feel, that feel must be real. But if evolution selects for function, and qualia are intrinsic non-functional residues (as some dualisms hold), their existence is evolutionarily inexplicable. If they are functional, their moral weight seems reducible to survival value, which undermines the intuition that suffering is *intrinsically* bad, not just *instrumentally* disadvantageous.

  ---

  ### VI. Theoretical Landscape: A Brief Assessment
  How do the major contenders stand against this specification?

  **1. Eliminativism (e.g., Dennett)**
  *   **Performance:** Rejects the data. It satisfies External Constraints (Neuroscience, Physicalism) easily by denying Desiderata #1, #2, #4, and #5. It argues that "First-Person Authority" is a user-illusion and "Intrinsic Quality" is a category error.
  *   **Cost:** It fails the "Phenomenological Adequacy" test for most intuitions. It "quines" qualia by denying the phenomena exist as described. It struggles with Desideratum #11 (Moral Weight), as it must explain why suffering matters if the "hurt" is a confused judgment.

  **2. Representationalism (e.g., Tye, Dretske)**
  *   **Performance:** Attempts to satisfy Desiderata #10 and #7 by reducing Qualia to Representational Content. It maintains Desideratum #4 (P-Consciousness) by distinguishing analog content from conceptual access.
  *   **Cost:** It struggles with Desideratum #5 (Intrinsic Quality). By making qualia relational (aboutness), it faces the "Inverted Spectrum" challenge (Desideratum #1): if two systems represent the same property, do they feel the same? It also strains against Desideratum #2 (Authority), as misrepresentation allows for error in experience.

  **3. Primitive-Property Dualism / Russellian Monism (e.g., Chalmers, Goff)**
  *   **Performance:** Best satisfies Desiderata #1, #2, #5, and #12. It takes the Intrinsic Nature seriously and accepts the Explanatory Gap as a brute fact. It preserves Moral Weight (#11) robustly.
  *   **Cost:** It fails Desideratum #10 (Physical Integration). It struggles to explain how intrinsic, non-structural properties causally interact with the structural dynamics of predictive processing without violating causal closure. It also faces the "Combination Problem" regarding Desideratum #9 (Similarity/Transitivity): how do micro-experiences combine into macro-experiences?

  ### Summary
  To survive "quining," a theory of qualia cannot merely assert their existence. It must navigate the tension between **Intrinsic Nature** and **Causal Integration**. Any theory that fully satisfies the Physical/Neuroscience constraints risks dissolving the Intrinsic nature (collapsing into Representationalism or Eliminativism). Any theory that fully preserves the Intrinsic nature risks rendering qualia causally inert or scientifically occult (collapsing into Epiphenomenalism or Dualism). The adequate theory must either redefine the physical to include intrinsic nature (Russellian Monism) or redefine experience to exclude intrinsic nature (Illusionism), acknowledging that the folk-concept of qualia cannot survive intact.
