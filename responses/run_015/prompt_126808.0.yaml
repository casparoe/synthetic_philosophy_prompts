  9.  **Deep Dive into the "Exhaustiveness" Issue:**
      *   Molinism needs exhaustiveness because God needs to guarantee the outcome (e.g., Incarnation, Redemption) without violating freedom. If He only knows *some* counterfactuals, He might pick a world where the free creatures rebel unexpectedly (if those counterfactuals weren't known).
