      *   *Distorted:* The temporal/logical order. Novelist writes in time; God's knowledge is timeless/logically prior.
      *   *Failed:* The grounding objection. Why is it true? For the novelist, it's true because of the character concept. For God, the character doesn't exist yet.
      *   *Bluntness:* The novelist's "discovery" is often just subconscious stipulation. Molinism requires objective truth values independent of any mind. This is the biggest break.

  7.  **Structuring the Letter:**
      *   Salutation (implicit in tone).
