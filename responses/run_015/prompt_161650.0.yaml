answer: |-
  This is a remarkably robust intuitive framework. You have essentially reconstructed a **coordination-based account of conventional obligation**, closely allied with philosophical accounts by David Lewis (convention as equilibrium) and Hume (justice as artificial virtue based on mutual expectation).

  Your principle hinges on two mechanisms: **Reliance** (others have structured their lives/income around this) and **Erosion** (your visibility undermines the expectation that keeps the system stable).

  Here is how your principle holds up against your specific questions, where it fractures, and how to patch it without losing the core insight.

  ### 1. Does the principle survive your verdicts?

  **The 2am vs. Kids Jaywalking Pair**
  Your principle survives this perfectly, and this is actually its strongest test case.
  *   **2am:** No reliance (no drivers/peds), no visibility (nobody watching). Verdict: Amoral/Etiquette.
  *   **Kids:** No reliance (physical safety), *but* high visibility.
  *   **Why it works:** Your principle includes the clause: *"visible enough to lower other people's expectation that folks will comply."* When kids are watching, you are not just crossing a street; you are teaching a norm. If the norm is "we wait for lights," your deviation erodes that norm for the next generation of rule-followers. The "cost" others are paying is the cognitive load of maintaining the rule; you are skipping that cost while undermining their investment in it.
  *   **Verdict:** The principle predicts "Not OK" correctly.

  **The Bribe (Border Official)**
  This is where the principle fractures.
  *   **The Setup:** Everyone pays (Reliance: the official expects it, the system runs on it). Refusing is visible (undermines the expectation).
  *   **The Principle's Prediction:** You should pay. Refusing free-rides on the "smooth border crossing" benefit while skipping the cost everyone else pays, and risks making it harder for others if the official gets annoyed.
  *   **Your Gut:** Refusing is fine (or perhaps obligatory).
  *   **The Conflict:** Your principle treats the bribe like the queue. But a queue is a *coordination problem* (we need to agree on order), whereas a bribe is a *corruption problem* (the system is extracting value illegitimately).
  *   **Diagnosis:** Your principle lacks a **Legitimacy Constraint**. It assumes that if a convention is "load-bearing," it generates an obligation. But some load-bearing conventions are parasitic.

  ### 2. The "Rotten Content" Clause

  You asked: *Does it need an extra clause for conventions whose content is independently rotten, or does adding that clause just smuggle in ordinary morality and leave the word convention doing no work?*

  It needs the clause, but **no, it does not make "convention" redundant.**

  Here is the distinction:
  *   **Ordinary Morality (Independent):** "Do not harm," "Do not steal," "Do not lie." These apply regardless of what people are doing.
  *   **Conventional Morality (Dependent):** "Drive on the left," "Tip 20%," "Queue here." These are morally neutral *until* a convention exists. Driving on the left isn't inherently right; it's right *because* everyone else is doing it.

  If you add a clause that says *"Compliance is required unless the convention violates independent moral duties,"* you haven't made convention redundant. You have simply established that **convention generates pro tanto obligations, but independent morality acts as a veto.**

  *   **Why convention still does work:** In the queueing case, there is no *independent* moral reason to stand behind the person in the blue jacket. The moral obligation is created *entirely* by the convention. In the bribe case, there is an *independent* moral reason not to support corruption. The convention tries to create an obligation, but the independent morality vetoes it.
  *   **The Fix:** Add a negative constraint: *"Compliance is owed to load-bearing conventions provided the convention does not violate independent rights or cause direct harm."*

  This explains your bribe intuition: The border official's expectation is "load-bearing," but the content (extortion/corruption) violates independent morality. Therefore, the convention fails to generate an obligation.

  ### 3. Is there a duty to defer to local ways?

  You asked: *Does anything here amount to a real duty to defer to local ways, or is it all downstream of reliance plus visibility?*

  It is **all downstream of reliance plus visibility.** There is no mystical "When in Rome" duty.

  *   **The Visitor Shoving:** It's not wrong because they are a visitor; it's wrong because the locals rely on the queue. If the locals didn't rely on the queue (the scrum case), the visitor could shove freely.
  *   **The Visitor Tipping:** It's not wrong because they are foreign; it's barely wrong because there is no local reliance on the income, only a minor social friction (embarrassment).

  Your principle correctly identifies that "local custom" only matters instrumentally. If the custom is load-bearing, you owe compliance. If it is merely decorative (etiquette), you do not. This saves you from moral relativism; you don't have to respect *all* local ways, only the ones that function as necessary coordination mechanisms for the people living there.

  ### 4. Predictions for the Two New Cases

  Here is what your refined principle (Reliance + Visibility + Legitimacy Constraint) predicts:

  **Case A: The Protest Tipper**
  *A local stops tipping as a protest but hands each server a note explaining why.*
  *   **Reliance:** High. The server's income is structured around the tip. The note does not replace the income.
  *   **Visibility:** Low (for the norm). The note explains that this is a *protest*, not a collapse of the norm. It signals "I still believe in tipping, but I want the system to change," rather than "Tipping is dead."
  *   **Prediction:** **Still Not OK.**
  *   **Reasoning:** While the note mitigates the *erosion* clause (it doesn't teach others to stop tipping), it fails the *reliance* clause. You are still free-riding on the wage structure. The server is still harmed financially. You are using the individual server as a means to a political end without their consent. The obligation to the *person* (reliance) outweighs the political statement.

  **Case B: The Tourist in the Jaywalking City**
  *A tourist jaywalks in a city where literally everyone jaywalks.*
  *   **Reliance:** The "convention" here is actually *to jaywalk*. Drivers rely on pedestrians crossing mid-block. Traffic lights might be treated as suggestions.
  *   **Visibility:** If the tourist *waits* at the light while everyone crosses, they might actually disrupt the flow (a reverse violation).
  *   **Prediction:** **Fine (and perhaps obligated to flow).**
  *   **Reasoning:** In this context, the "load-bearing" convention is the fluid movement of foot traffic. Waiting for a green light on an empty street might be the *actual* violation of the local coordination equilibrium. Your principle correctly identifies that the moral weight follows the *actual* local reliance, not the written law.

  ### Summary of the Refined Principle

  Your gut has built a **Coordination-Fairness Theory**. To make it bulletproof, I suggest this slight formulation tweak:

  > "You owe compliance to a convention when:
  > 1.  **Reliance:** Others have arranged their behavior or expectations around it (it is load-bearing).
  > 2.  **Fairness:** Your deviation either free-rides on their compliance or visibly undermines the expectation required to sustain it.
  > 3.  **Constraint:** The convention does not violate independent moral duties (rights, harm, justice)."

  This preserves your intuition on the bribe (fails Constraint), the kids (fails Fairness/Visibility), and the US server (fails Fairness/Reliance), while keeping "convention" as the primary engine of obligation for the vast majority of social life.
