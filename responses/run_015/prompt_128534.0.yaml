  me and my roommate got into it last night about universals, like the actual philisophical problem. he said universals have to be real because otherwise it's just a coincidence that we call both a sunset and a stop sign "red" — there's got to be one shared redness that both have. i said nah, it's just our brains grouping similar stimuli together, no ghost-entity needed. then he brought up digital images: the same RGB value (255, 0, 0) shows up on my phone and on a billboard, but one is backlit LEDs and the other is printed ink. there's no shared wavelength, yet we still call both red. he said that proves there's a universal that can be instatiated in totally different physical stuff. i countered that digital "red" is literally just a number assigned to pixels — there's no redness in the data, just electricity arranged to look red. so if he says the universal is there too, he's saying a number and a photon both share the same property, which is weird. he said that's just multi-realizability, universals do that. but then i asked: is the number 7 both an abstract object and a universal? because seven apples also have "being seven." if redness can jump from photons to pixels to ink, why can't "being prime" jump from the number 5 to five rocks? if he says no, he needs a line between mathematical and physical properties, and i don't think he has one. he said i was moving the goalposts. can you go through our exchange step by step and say who's right at each move? don't just declare a winner — tell me where each argument lands, and what we're both missing.
