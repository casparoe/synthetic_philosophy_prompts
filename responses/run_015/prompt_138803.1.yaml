answer: |-
  ### 1. Name and Status

  To the best of my knowledge, this move does not have a canonical, settled name in the literature comparable to "The Moorean Shift" or "The Euthyphro Dilemma." It is a recognized *pattern* of argumentation often implicit in defenses of Robust Realism against Evolutionary Debunking Arguments (EDAs), but it is rarely isolated and defined as a distinct inferential structure.

  In discussions of "selective skepticism" (most notably in the work of Katia Vavova) and "hybrid genealogies," the *permissibility* of sparing some beliefs is debated, but the claim that the spared beliefs are *epistemically enhanced* by the debunking of their neighbors is usually treated as a rhetorical flourish rather than a formal premise.

  Since you require a term to classify cases, I propose we call this **The Purification Inference**.

  **Definition:** The Purification Inference is an argumentative move wherein the successful causal explanation of a subset of beliefs ($B_1$) by a non-truth-tracking source ($S_{nt}$) is taken to increase the epistemic probability that the remaining unexplained beliefs ($B_2$) are caused by a truth-tracking source ($S_{tt}$).

  **The Core Mechanism:** It treats the space of causal explanations for a domain of belief as effectively exhaustive and competitive. If $S_{nt}$ explains $B_1$, and $S_{nt}$ *cannot* explain $B_2$, then the probability that $S_{tt}$ explains $B_2$ rises in proportion to the thoroughness of the explanation of $B_1$. The debunking story acts as a filter; the material that passes through is not merely unblemished, but refined.

  ### 2. Carving the Phenomenon

  To distinguish The Purification Inference from nearby notions:

  *   **Vs. Inference to the Best Explanation (IBE):** Standard IBE compares positive models against the same data. ("Does Realism or Anti-Realism better explain the existence of moral disagreement?"). The Purification Inference works by elimination across *different* data sets. It argues that because Model A explains Data Set 1, Model B is confirmed for Data Set 2. It relies on a disjunctive premise about causal origins rather than a comparative assessment of explanatory power over a single phenomenon.
  *   **Vs. The Argument from Gaps:** Typically, arguing from a gap in a naturalistic explanation to a non-naturalistic cause is pejorative ("God of the Gaps"). The Purification Inference inverts this valence. It claims the gap is not merely a place where the naturalistic story fails, but a positive marker of the non-naturalistic story's presence. It transforms an *absence of evidence* (for evolution) into *evidence of absence* (of non-truth-tracking causes).
  *   **Vs. Third-Factor Replies:** Third-factor replies (e.g., Enoch) argue that evolution and moral truth correlate because both track a third factor (e.g., survival is good). This preserves the evolutionary explanation for *all* beliefs while saving their truth. The Purification Inference concedes the evolutionary explanation for *some* beliefs to save the truth-tracking explanation for the *rest*. It partitions the domain; Third-Factor replies unify it.
  *   **Vs. Completeness Requirements:** Debunkers often argue that unless an evolutionary explanation is complete, it debunks nothing (the "all or nothing" worry). The Purification Inference accepts partial completeness but flips the valuation: the *incompleteness* of the debunking story is the very thing that certifies the residue.

  **The Edge Condition:** The move is distinctively characterized by the **graded certification** you noted. It is not enough that the residue survives; the *more* the debunking story explains elsewhere, the *more* certified the residue becomes. This implies a probabilistic dependency between the explanatory success on $B_1$ and the epistemic status of $B_2$.

  ### 3. The Hidden Parameter: Causal Exhaustiveness

  You asked whether the certification vs. discredit flip is one phenomenon with a hidden parameter or two. It is one phenomenon with a hidden parameter: **The Exhaustiveness of the Causal Disjunction.**

  The Purification Inference relies on a tacit premise:
  $$P(S_{tt} \lor S_{nt}) \approx 1$$
  (That the only live causal options for moral belief are Truth-Tracking or Non-Truth-Tracking Evolutionary pressures).

  *   **Direction 1 (Certification):** If the interlocutor accepts that moral beliefs must have a cause, and accepts that Moral Realism provides a viable causal candidate (or that truth-tracking is the only alternative to evolutionary determinism), then ruling out Evolution ($S_{nt}$) boosts Truth ($S_{tt}$). Unexplainedness certifies because the "Truth" hypothesis is waiting in the wings as the only remaining candidate.
  *   **Direction 2 (Discredit):** If the interlocutor assumes Moral Facts are causally inert (Error Theory/Expressivism), then $S_{tt}$ is not a live candidate. The disjunction is effectively between $S_{nt}$ (Evolution) and $S_{error}$ (Noise/Drift). If Evolution fails to explain a belief, it defaults to Noise. In this framework, unexplainedness discredits because it implies the belief is unmoored from *any* reliable process (biological or otherwise).

  The switch flips depending on whether the "Truth-Tracking" hypothesis is granted **causal efficacy** or at least **explanatory relevance** prior to the argument. If Moral Facts cannot cause beliefs, the Sieve has nothing to catch the residue but error.

  ### 4. Ruling on the Three Cases

  **Case 1: Provisional Extension (The Debunker catches up)**
  If the debunker can in principle extend the explanation to the residue tomorrow, the residue's elevated status is **provisional and fragile**.
  *   *Verdict:* The Purification Inference is diachronic. It relies on the *current* state of explanatory competition. If the certification depends on the *failure* of the debunking story, then success in the debunking story defeats the certification.
  *   *Implication:* This makes the move a "bet on the future of science." It is not a structural proof. If the residue is certified only because evolution *hasn't yet* explained it, the epistemic boost is illusory; it is merely a measure of current ignorance. For the move to be sound, the proponent must argue that the residue is *in principle* inexplicable by selection pressures (e.g., because it contradicts fitness), not just currently unexplained.

  **Case 2: Recency and Technology**
  Consider judgments dependent on modern institutions (e.g., "global human rights").
  *   *Verdict:* This **helps the Sieve** regarding evolutionary explanation but **hurts it** regarding the Truth-Tracking alternative.
  *   *Reasoning:* It is trivially true that Pleistocene selection pressures did not directly encode judgments about international law. This clears the $S_{nt}$ (biological) hurdle easily. However, it opens the door to $S_{cultural}$ (cultural evolution/memes). If the Sieve only filters biological evolution, the residue may be caught by cultural genealogy, which is also non-truth-tracking.
  *   *Implication:* For the Purification Inference to work here, the "Non-Truth-Tracking" category must be expanded to include *cultural* selection. If the proponent argues that cultural evolution also fails to explain universal rights, the residue is further purified. But if the judgment is *too* recent, it risks looking like a cultural fashion rather than a moral truth. Recency makes the evolutionary debunking easy but the truth-tracking explanation harder (how did we access these truths so suddenly?).

  **Case 3: The Non-Moral Analogue (Logic/Math)**
  Imagine an evolutionary story about heuristic reasoning, leaving *Modus Ponens* as the residue.
  *   *Verdict:* The move looks **significantly better** here, but reveals a disanalogy that undermines the moral case.
  *   *Reasoning:* In logic, the "Truth-Tracking" hypothesis is almost tautological. If *Modus Ponens* is valid, it is necessarily true. There is no possible world where it is false. Therefore, if evolution explains why we *believe* it, and it *is* true, the correlation is guaranteed.
  *   *Implication:* In morality, the "Truth" of the residue is contingent (or at least metaphysically robust). We can conceive of the residue being false. In logic, we cannot. The Purification Inference works better in logic because the alternative (that *Modus Ponens* is false) is incoherent. In morality, the alternative (that equal standing is false) is coherent. Thus, eliminating evolution in the moral case leaves "Error" as a live option in a way it isn't for logic. The Sieve works in math because the mesh size is fixed by necessity; in morality, the mesh size is metaphysically contested.

  ### 5. Evaluation: Is the Move Sound?

  **Where it Breaks:**
  The Purification Inference breaks at the **Exhaustiveness Assumption**. It requires that the set of non-truth-tracking causes is co-extensive with the set of explanations the debunker can offer.
  1.  **The "Third Cause" Problem:** There are many causes for belief that are neither "Evolutionary Fitness" nor "Moral Truth." (e.g., Cultural drift, emotional contagion, rational reflection that is reliable but not truth-tracking in a realist sense, linguistic structure). If the debunking story explains 80% via evolution, the remaining 20% might be explained by cultural drift, not Moral Truth. The Sieve leaks.
  2.  **The Independence Problem:** For the residue to be certified, the failure of the evolutionary explanation on the residue must be *independent* of the success on the rest. If the same cognitive mechanism produces both the tribalist judgments and the universalist judgments, and that mechanism is tainted by evolutionary pressure, the residue is guilty by association. (This is the "General Reliability" challenge).

  **Conditions for Soundness:**
  For the Purification Inference to be sound, three conditions must be met:
  1.  **Causal Partition:** The beliefs in the residue must be produced by a distinct cognitive process from the debunked beliefs (to avoid guilt by association).
  2.  **Exhaustive Disjunction:** The proponent must justify the claim that the only viable causes for the residue are either the specific debunking story offered or the truth-tracking hypothesis. (This is the hardest lift).
  3.  **Positive Prior:** The Truth-Tracking hypothesis must have a non-negligible prior probability. Eliminating a rival does not boost a hypothesis that started at near-zero.

  **Overall Assessment:**
  As carved, the move is **heuristically useful but logically fragile**. It functions well as a dialectical pressure point (forcing the debunker to extend their theory) but fails as a standalone justification for realism. It mistakes the *absence of a specific error story* for the *presence of a truth story*.

  ### 6. Confidence and Limitations

  **Confidence Level:** High (85%).
  The structural analysis of the argument and its distinction from standard IBE or Third-Factor replies is robust. The identification of the "Exhaustiveness" parameter as the switch between certification and discredit is standard meta-epistemological analysis applied to this specific context.

  **Least Certain Claim:**
  I am least certain about the claim that **Case 3 (Logic/Math) validates the move more than the moral case.**
  *Reasoning:* While logical truths are necessary, evolutionary debunking arguments in logic (e.g., from evolutionary psychology of reasoning) often target the *normative force* of logic, not just the truth of the propositions. If the evolutionary story explains why we *feel bound* by Modus Ponens, the residue (the bindingness) might still be debunked even if the proposition is true. The disanalogy might be narrower than I assessed above. However, regarding the *truth* of the propositions themselves, the modal status of logic does provide a stronger safety net for the "Truth-Tracking" hypothesis than in the moral case.

  **Final Note on the Name:**
  While I have coined "The Purification Inference" for your utility, you will find this structure embedded in what is sometimes called **"The Argument from Explanatory Residue"** in niche meta-ethical circles, though that term is often used more broadly for any argument claiming realism explains what naturalism cannot. The specific *graded certification* aspect you identified is the novel carve here.
