      *   *Specific Textual Reference:* Mention *Economic Possibilities* specifics (15 hours, the nervous breakdown) and *De Otio* specifics (leisure for the sake of the common good vs. withdrawal).
      *   *Nuance:* Acknowledge that Seneca wasn't against public service, but wanted it chosen, not forced by greed. Keynes wants to remove the *force* of greed/necessity. There's a convergence there.

  5.  **Final Review against Prompt:**
