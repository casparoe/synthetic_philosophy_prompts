answer: |-
  # Q&A Prep Sheet: "Question Ownership and the Moral Asymmetry"

  **Session Strategy:** You have 40 minutes. That is roughly 8–10 substantive questions. You cannot win every exchange; your goal is to show the *framework* holds water even if the edges are fuzzy. Prioritize clarity on the "Question Ownership" norm over defending the specific taxonomy boundaries.

  ---

  ### 1. The Consequentialist / Information Economics Challenge
  **Likelihood:** Very High | **Damage:** Critical
  **Who:** The 4 Econ/Consequentialists
  **Phrasing:** "Let's grant your taxonomy for a moment. If an 'answer-mislead' and a 'salience-mislead' result in the exact same posterior credence in the hearer, and the same welfare outcome, where is the residual moral residue? You seem to be positing a deontic constraint without explaining why the *mechanism* of the credence shift matters intrinsically. Isn't this just rule-consequentialism dressed up in conversational analysis? Why shouldn't we just measure the information asymmetry?"

  **The Reply (2 mins):**
  "I agree that if outcomes were identical in every respect, the moral difference would be thin. But they aren't. The 'Question Ownership' norm isn't about the *state* of the hearer's credences; it's about the *status* of the relationship. When I own the question, I've invited you to rely on my processing of the relevant space. Lying (or answer-misleading) exploits that specific reliance. Salience manipulation leaves your question-forming capacity intact; you could have looked at the other rows in the spreadsheet.
  The moral wrong isn't just the false belief; it's the corruption of the collaborative inquiry. If we reduce this to information asymmetry, we lose the ability to explain why we feel differently about a liar than a spin-doctor, even when both succeed. I'm not denying outcomes matter; I'm saying the *relational breach* is a distinct harm that consequentialist accounting often misses because it aggregates rather than tracks dyadic duties."

  **Concede:** "I concede that in extreme cases where salience-misleading causes catastrophic harm, it will outweigh a trivial lie. My claim is about *ceteris paribus* comparisons, not lexical priority over all consequences."
  **Soft Spot:** If they press on *why* the relational breach matters if consequences are identical. You risk sounding like you're positing a 'moral magic' in the mechanism.
  **Strategy Note:** **DO NOT** agree too quickly that "outcomes are what ultimately matter." Distinguish early: "I am arguing for a constitutive norm of inquiry, not an instrumental rule."

  ### 2. The Kantian / Anscombean Challenge
  **Likelihood:** High | **Damage:** High
  **Who:** The 3 Deontologists
  **Phrasing:** "You're grounding the wrongness of lying in a contingent social role ('question ownership'). But isn't the wrongness of lying categorical? It violates the end of communication itself, regardless of who 'owns' the question. By making this about conversational roles, aren't you making the prohibition against lying contingent on social convention? What happens when the 'owner' of the question is a tyrant interrogating a victim? Does your view imply the victim owes the tyrant a 'clean answer-channel'?"

  **The Reply (2 mins):**
  "That's the crucial test case. My view doesn't say you always owe a clean channel; it says you owe it *only* when you have implicitly invited reliance on your stewardship of that question. In the tyrant case, the victim has not invited the question; the question is imposed. Therefore, no ownership is transferred, and the duty to keep the channel clean does not arise.
  This actually preserves the intuition that lying to the murderer at the door is permissible, without needing 'mental reservation.' The murderer hasn't entered a cooperative inquiry; they've initiated a hostile extraction. So the norm isn't contingent on convention, but on the normative status of the exchange. It's not 'lying is wrong unless'; it's 'the duty not to lie only exists where question-ownership exists.'"

  **Concede:** "I concede that my language of 'roles' can sound too sociological. I should emphasize that 'ownership' is a normative status, not a social title."
  **Soft Spot:** Defining exactly when a question is "imposed" vs. "invited" in coercive contexts.
  **Must-Land Status:** **CRITICAL.** If you fail here, you lose the deontological force of the view. You must show that "Question Ownership" explains the *exceptions* Kantians struggle with (murderer at the door) without abandoning the *force* of the norm.

  ### 3. The Phil of Language Challenge
  **Likelihood:** Medium-High | **Damage:** High
  **Who:** The 1 Phil of Language
  **Phrasing:** "You say you aren't relying on the assertion/implicature distinction, but your 'answer-misleading' category seems to do all the heavy lifting, and it looks suspiciously like standard Gricean implicature. If the boundary between asserting and implicating is as unstable as current literature suggests (contextualism, impliciture, etc.), isn't your 'clean answer-channel' norm built on sand? How do you identify the 'answer' without a stable semantics?"

  **The Reply (2 mins):**
  "I'm deliberately bypassing the semantic/pragmatic boundary. The 'answer-channel' is defined by the *QUD* (Question Under Discussion), not by syntactic assertion. Whether the content is conveyed via assertion or implicature is secondary. What matters is whether the speaker is addressing the live QUD.
  If I say 'Some of the students passed' in response to 'Did all of them pass?', I am manipulating the answer-channel regardless of whether 'not all' is asserted or implicated. My norm targets the manipulation of the QUD resolution, not the grammatical vehicle. So the instability of assertion doesn't hurt me, because I'm tracking the flow of inquiry, not the sentence type."

  **Concede:** "I concede that identifying the 'live QUD' can be messy in practice. But messiness in application doesn't invalidate the norm."
  **Soft Spot:** If they argue that QUDs are *more* unstable than assertion.
  **Strategy Note:** Keep the focus on *inquiry structure*, not *linguistic mechanism*.

  ### 4. The "No Stopping Point" Challenge (Taxonomy)
  **Likelihood:** Medium | **Damage:** Medium
  **Who:** General Skeptics / Consequentialists
  **Phrasing:** "You have three categories: Answer, Frame, Salience. But these seem to bleed into each other. Framing a question often changes salience. Answering often reframes. Isn't this just a list of deceptive techniques rather than a principled taxonomy? Where is the bright line that tells us when 'Frame' becomes 'Salience'?"

  **The Reply (2 mins):**
  "The distinction isn't in the *technique* but in the *locus of agency*.
  1. **Answer-misleading:** I take your question, I corrupt the data. (Your agency on the *question* is intact; my agency on the *answer* is corrupt).
  2. **Frame-misleading:** I change the question you are asking. (I usurp your agency on the *question*).
  3. **Salience-misleading:** I leave the question and the data, but I distract you. (I bypass your agency on *attention*).
  The lines blur in practice, yes, but the moral weight shifts based on *which capacity* of yours I'm bypassing. The taxonomy is heuristic for locating the breach of ownership, not a rigid legal code."

  **Concede:** "There are hybrid cases. I'm not claiming these are natural kinds, but normative clusters."
  **Soft Spot:** Hybrid cases where framing and salience manipulation happen simultaneously.

  ### 5. The Grad Student / Application Challenge
  **Likelihood:** High | **Damage:** Low
  **Who:** The Grad Students
  **Phrasing:** "You mentioned professional advising. If I'm an advisor and I stay silent when a student asks 'Is this job market viable?', am I misleading? I haven't lied, but I own the question by virtue of my role. Does silence count as breaching the channel?"

  **The Reply (2 mins):**
  "Excellent question. On my view, role-based ownership is the strongest kind. If you occupy a role where others are licensed to rely on your guidance, silence can indeed be a breach of the 'clean channel' duty. It's not a lie, but it might be a 'frame-mislead'—implying the question isn't worth asking—or an 'answer-mislead' by omission.
  The duty isn't always to speak, but to not let the channel go foul. If silence predictably leads to a false belief in a context where you own the question, you have a duty to clarify. That's why advising requires more than just 'not lying'; it requires active stewardship of the student's questions."

  **Concede:** "I haven't fully worked out the omission cases, but they seem to fall under 'breach of stewardship'."
  **Soft Spot:** Defining the limits of "stewardship." Does it require exhausting all truths?

  ---

  ### Strategic Priorities

  **The "Must-Land" Reply:**
  **The Kantian Interrogator Case.**
  If you cannot explain why the victim of a tyrant does *not* owe a clean answer-channel, your "Question Ownership" norm looks like it justifies lying whenever it's convenient, or conversely, demands truth-telling to oppressors. You must nail the point that **Ownership requires Invitation/Reliance**, which is absent in coercion. This saves the view from being too rigid (Kant) or too loose (Consequentialism).

  **Distinguishing from Consequentialists:**
  Do not say "Outcomes don't matter." Say: **"Outcomes are the *result*, Ownership is the *relation*."**
  Use the analogy of property rights. A thief and a tax collector might leave you with the same amount of money (outcome), but the moral status differs because of the relational right violated. Similarly, a liar and a salience-manipulator might leave you with the same credence, but the liar violated a specific dyadic duty you granted them.

  **Handling the "No Stopping Point" Objection:**
  Don't defend the boundaries as sharp. Defend them as **normatively salient**. Even if "Frame" and "Salience" blur, the *direction* of the moral gradient is clear: interfering with the Question is worse than interfering with the Answer, which is worse than interfering with Attention. If they press for a bright line, admit it's a spectrum but insist the *pole* positions are distinct.

  ---

  ### The Dangerous Question
  **The Question:** "Who decides when Question Ownership has been transferred? If it depends on the hearer's reasonable reliance, aren't you just outsourcing the definition of lying to the hearer's subjective expectations? Doesn't that make the norm circular: 'You lied because you violated the expectation you created,' where the expectation is just 'you won't lie'?"

  **Why it's Dangerous:**
  This attacks the **foundational mechanism** of your view. If "Question Ownership" is just a fancy way of saying "The hearer expected truth," you haven't explained *why* they expected it. You risk circularity:
  *   Q: "Why was lying wrong here?"
  *   A: "Because you owned the question."
  *   Q: "How do we know they owned the question?"
  *   A: "Because it was wrong to lie."

  **How to Defuse:**
  Pivot to **Institutional/Conventional Roles**. "It's not just subjective expectation. In many cases (advising, testimony, official inquiries), ownership is fixed by the *institutional role*, not the momentary psychological state. In casual conversation, it's fixed by the **Gricean Cooperative Principle**. It's not circular because the criteria for ownership (role, invitation, convention) are independent of the moral verdict on the lie."

  **Backup Plan:** If they press hard, concede: "The boundary of ownership is indeed the hardest part of the view. But even if the boundary is fuzzy, the *center* cases (explicit inquiry, professional roles) are clear enough to ground the asymmetry." (Better to concede a fuzzy boundary than a circular definition).
