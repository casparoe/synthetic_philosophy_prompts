answer: |-
  To bring analytical clarity to your seminar, it is necessary to disaggregate the maxim 'silence is not consent' into distinct normative claims. Participants are likely conflating evidential standards, performative requirements, and rules regarding the duration of authority. Below is a precise menu of the distinct theses this phrase may express, categorised by the type of failure they posit, evaluated for their validity, and mapped against the three specific moves occurring in your discussion.

  ### 1. The Evidential Insufficiency Thesis
  *   **Description:** This thesis claims that silence is an unreliable indicator of the internal mental state required for valid consent. Because a silent party may be confused, unaware, or deliberating, one cannot infer subjective agreement from objective passivity.
  *   **Type of Failure:** Epistemic (the silent party's understanding or agreement cannot be known).
  *   **Evaluation:** **Defensible but substantive.** While silence is sometimes reliable evidence in established relationships or routine interactions, in high-stakes clinical or institutional settings where asymmetry of power exists, relying on silence as evidence of understanding is risky. It is not logically impossible for silence to indicate consent, but it is pragmatically unsafe.
  *   **Supports Seminar Moves:**
      *   **Non-objection never counts as authorisation:** Strongly supports this.
      *   **Prior explicit consent is irrevocable:** Does not support this (concerns initial inference, not duration).
      *   **Authority never presumed without vocal affirmation:** Supports this, as vocal affirmation provides better evidence than silence.

  ### 2. The Performative Necessity Thesis
  *   **Description:** This thesis asserts that consent is a specific kind of speech act (illocutionary act) that requires a positive utterance or equivalent sign to be valid. Silence lacks the propositional content required to alter normative relations.
  *   **Type of Failure:** Performative (no valid speech act of authorisation occurred).
  *   **Evaluation:** **Defensible but substantive (context-dependent).** In general contract law, conduct can constitute acceptance. However, in medical ethics and research governance, explicit performative acts (signing, verbal confirmation) are often required to ensure clarity. As a universal claim, it is false; as a specific institutional rule, it is defensible.
  *   **Supports Seminar Moves:**
      *   **Non-objection never counts as authorisation:** Strongly supports this.
      *   **Prior explicit consent is irrevocable:** Potentially supports this (see Thesis 5), but primarily concerns initial validity.
      *   **Authority never presumed without vocal affirmation:** Strongly supports this.

  ### 3. The Normative Default Thesis
  *   **Description:** This thesis posits that the baseline normative position is prohibition. Authority to act upon another person is not present by default; it must be positively acquired. Silence fails to discharge the burden of proof required to shift the normative status from 'forbidden' to 'permitted'.
  *   **Type of Failure:** Normative-power (the authority to license was not properly transferred).
  *   **Evaluation:** **Defensible but substantive.** This is a robust principle in liberal ethics regarding bodily integrity. It treats consent as a key that must be turned, rather than a door that is open until locked.
  *   **Supports Seminar Moves:**
      *   **Non-objection never counts as authorisation:** Strongly supports this.
      *   **Prior explicit consent is irrevocable:** Does not support this (silence might fail to renew the key).
      *   **Authority never presumed without vocal affirmation:** Strongly supports this.

  ### 4. The Continuity Requirement Thesis
  *   **Description:** This thesis argues that consent is not a one-off event but a continuous state of affairs. If the communication channel goes silent, or if circumstances change without renewed affirmation, the authority granted previously lapses. Silence here indicates a break in the ongoing relationship of trust.
  *   **Type of Failure:** Normative-power (the authority to license has been revoked or expired).
  *   **Evaluation:** **Defensible but substantive.** This is particularly relevant in ongoing clinical procedures or long-term research. It treats consent as a process rather than a product.
  *   **Supports Seminar Moves:**
      *   **Non-objection never counts as authorisation:** Supports this regarding ongoing acts.
      *   **Prior explicit consent is irrevocable:** **Contradicts this.** This thesis suggests prior consent *is* revocable (or expires) via silence or changed circumstances.
      *   **Authority never presumed without vocal affirmation:** Supports this regarding continued authority.

  ### 5. The Performative Symmetry Thesis
  *   **Description:** This thesis claims that if normative power is transferred only through explicit performance, it can only be withdrawn through explicit performance. Silence is normatively inert; it cannot create consent, but neither can it destroy it. Therefore, prior explicit consent stands until explicitly revoked.
  *   **Type of Failure:** Normative-power (the authority to license was not properly revoked).
  *   **Evaluation:** **Defensible but substantive.** This creates a high threshold for withdrawal, protecting the reliability of agreements. However, it risks trapping individuals who may be unable to speak or signal withdrawal due to coercion or incapacity.
  *   **Supports Seminar Moves:**
      *   **Non-objection never counts as authorisation:** Supports this (silence creates nothing).
      *   **Prior explicit consent is irrevocable:** **Strongly supports this.** If silence cannot constitute consent, it cannot constitute withdrawal of consent either; the status quo (prior consent) remains.
      *   **Authority never presumed without vocal affirmation:** Supports this regarding initial grant, but implies authority *is* presumed once granted until vocally denied.

  ### 6. The Absolute Prohibition Thesis
  *   **Description:** This is the strongest reading: silence can *never*, under any circumstances, constitute valid consent, regardless of context, prior relationship, or practical necessity.
  *   **Type of Failure:** Performative and Normative-power combined.
  *   **Evaluation:** **Plainly false.** There are established legal and ethical contexts (e.g., emergency medicine where capacity is lost, or estoppel in certain contractual dealings) where silence or passive acquiescence is treated as valid authorisation. Treating this as a universal logical truth ignores the nuance of implied consent.
  *   **Supports Seminar Moves:**
      *   **Non-objection never counts as authorisation:** Strongly supports this (too strongly).
      *   **Prior explicit consent is irrevocable:** Ambiguous support.
      *   **Authority never presumed without vocal affirmation:** Strongly supports this.

  ---

  ### Analytical Summary for the Seminar

  To resolve the disputes in your session, you may highlight that the maxim is being used to support incompatible positions depending on which thesis is implicitly invoked.

  1.  **Regarding the move that 'non-objection never counts as authorisation':**
      This move is supported by the **Evidential Insufficiency**, **Performative Necessity**, and **Normative Default** theses. Participants making this argument are correctly identifying that in high-stakes environments, the burden of proof lies on the institution to secure positive authorisation. However, they risk endorsing the **Absolute Prohibition Thesis**, which is plainly false in broader ethical contexts.

  2.  **Regarding the move that 'prior explicit consent is irrevocable regardless of later silence':**
      This move is counter-intuitive for many, yet it is logically supported only by the **Performative Symmetry Thesis**. If one argues that silence cannot create authority, consistency demands acknowledging that silence cannot destroy it either. However, this clashes with the **Continuity Requirement Thesis**, which many ethicists prefer in clinical settings to ensure ongoing willingness. Participants invoking 'silence is not consent' to *deny* the survival of prior agreement are implicitly relying on the Continuity Requirement, not the Symmetry Thesis. You should clarify which temporal model of consent your seminar adopts.

  3.  **Regarding the move that 'institutional or medical authority can never be presumed in the absence of vocal affirmation':**
      This move is supported by the **Performative Necessity** and **Normative Default** theses. It is a defensible policy rule for protecting vulnerable parties, though it should be recognised as a substantive ethical choice rather than a conceptual truth. The **Evidential Insufficiency Thesis** provides the strongest justification here: vocal affirmation is required not because silence is magically invalid, but because it is insufficient evidence of competence and understanding.

  By separating these threads, you can prevent the slogan from functioning as a conversation-stopper. Participants can then debate whether they wish to adopt a **Continuity** model (where silence risks revocation) or a **Symmetry** model (where silence preserves the status quo), and whether their concern is primarily **Epistemic** (we don't know what they think) or **Performative** (they didn't say the words).
