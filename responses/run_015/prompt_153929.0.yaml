answer: |-
  Thank you. Please, stay seated. I know the coffee is better than the chairs.

  Looking around this room, I see the two tribes I've spent seventy years trying to bridge. On my left, the biologists. You know the weight of Darwin's private notebooks. You know the ink smudges better than the printed words. On my right, my family. My brother, who keeps a rosary in his pocket, and my granddaughter, who told me this morning that evolution is "basically just complicated gardening." She's not entirely wrong.

  I want to talk to you about a ghost. Not a haunting, but a worry. A specific, quiet anxiety that Darwin carried, mostly in private.

  We often talk about Darwin as the man who killed design. He showed us the blind watchmaker. But when he turned his eye to human kindness, he hesitated. He wondered where it came from. He suspected our moral feelings grew out of social instincts. Simple things. The urge to protect your young. The urge to stay close to your tribe. Survival stuff.

  But then he looked at what we actually *do*. We send money to strangers on other continents. We mourn people we will never meet. We care about the fate of species we'll never see.

  In his notes, he wondered if this was a mistake. A glitch. If sympathy is evolved for the tribe, then sympathy for the whole world is an overextension. It's like having a hand meant to hold a child, trying to hold the ocean. When this thought **occured** to him, he didn't write it down loudly. He was almost embarrassed by it. He worried that our highest morality was just a biological misfire.

  I know what some of my colleagues are thinking. If it's a misfire, it's just chemistry. It's just neurons firing because they're confused. If morality is just evolved biology, then obligation is an illusion.

  And I know what my brother is thinking. If you reduce love to survival, you strip it of the sacred. You make the soul redundant.

  But here is where I stand, at seventy, looking at both of you. Knowing where a thing comes from does not tell us what it is worth.

  Yes, the spark might be biological. It starts in the mammalian brain, in the care for the infant. But the fire we build with it? That is ours. The fact that our sympathy travels further than natural selection intended doesn't make it fake. It makes it free.

  If we only cared for people who shared our genes, we wouldn't be moral. We'd be algorithms. We'd be trapped. The fact that we can feel obligation to a stranger—that is the moment we step out of the design. Darwin worried it was an error. I am suggesting it is our only escape route.

  To my scientific friends: Do not reduce this feeling to mere mechanism. The origin is natural, but the obligation is real. We cannot look at the biology and say, "Well, that explains it," and walk away. Explaining the flame doesn't put out the fire.

  And to my brother, to all of you who find meaning in faith: You do not need to fear the origin. Whether this capacity for boundless sympathy is a gift from God or a gift of evolution, the demand it places on us is the same. It asks us to care for the stranger. It asks us to act as if the design extends further than it actually does.

  My granddaughter thinks biology is boring. Maybe. But biology gave us the hardware for grace. It gave us the capacity to love beyond our utility.

  Darwin's ghost worries that we are pretending to be more than animals. He's right. We are. We are animals who decided to listen to the glitch. We are creatures who looked at our limited instincts and said, "Not far enough."

  So, let us not use science to shrink our world. Let us not use faith to fence it in. Let us accept that our sympathy for strangers is an overextension, and then let us extend it further. The design is finished. The work begins now.

  Thank you.
