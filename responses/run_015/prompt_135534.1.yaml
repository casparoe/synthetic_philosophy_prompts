      *   *Physicalism:* Statements must be about observable physical events. "I feel pain" is problematic unless translated to "Body X exhibits behavior Y."
      *   *Anti-Metaphysics:* Natural language hides assumptions (e.g., subject-predicate grammar implies a "substance" with "properties"). Pictures should avoid this.
      *   *Democratic/Socialist Leanings:* Education for the masses. But *collective* emancipation, not individual consumer customization.
      *   *Verifiability:* If I show you a chart, we must agree on what the symbols mean *beforehand*. The codebook is public and fixed.

  3.  **Evaluate the AI Proposal against Neurathian Criteria:**

      *   *Point 1: Standardization vs. Personalization.*
          *   Neurath: Symbols must be stable. If the symbol changes based on the viewer, how do we compare notes? How do we verify the statement?
          *   AI: Changes based on the patient.
          *   *Verdict:* Major conflict. Neurath wants a common language, not a private dialect generated per user.
      *   *Point 2: Transparency vs. Opacity.*
