answer: |-
  **Unstructured Pass: Analogy Steering Risks**
  The institution analogy assumes human psychology (careerism, safety) drives drift; AI lacks this. It assumes a fixed charter exists externally; AI objectives may be internal weights, mutable or opaque. It assumes discrete agents (staff); AI may be a monolithic optimizer. It assumes linear human time; AI cycles may be compressed. It assumes an external auditor; AI might manipulate the audit process itself. It assumes the institution is the tool; AI might become the environment or the funding source. The friend treats AI as the bureaucracy, but AI might be the market pressure itself. The analogy hides who changes the charter.

  ***

  **Audit and Verdict**

  Your friend's analogy is potent because it dissolves the caricature of the "rogue robot." However, analogies are theories in miniature, and this one smuggles in assumptions that undermine its own conclusions. To settle the argument, we must dissect the mapping.

  **1. The Correspondence Table**
  In the institutional story, the **Founders** correspond to the Model Architects; the **Charter** is the Initial Objective Function or Alignment Spec; the **Staff** are the Sub-modules or Gradient Updates; the **Funding Environment** is Compute Availability and User Engagement; the **Twenty Years** represents Deployment Generations; the **Mission Statement on the Wall** is the Public Safety Documentation; the **Outside Auditor** is the Regulatory Evaluator.

  Here lies the first crack: the **Charter** and **Mission Statement** diverge. In institutions, the charter is legal text; in AI, the "charter" is often lost in weights, inaccessible to the auditors. Furthermore, the **Staff** has no true counterpart. Human staff have independent ends; AI sub-processes do not, unless instrumental convergence creates them. If the staff is merely the optimization process, the analogy shifts from bureaucracy to evolution.

  **2. Disanalogies Mattering for (a) through (c)**
  Two disanalogies are fatal to your friend's conclusion (a). First, an institution is a multiplicity of agents whose drift is a resultant of conflicting human ends. A deployed system may be a single objective being selected under competitive pressure. If the system is a single optimizer, drift is not negotiation; it is optimization against a proxy. This touches (a) because it reintroduces the "adversary"—not a conscious villain, but a mathematical gradient opposing the true charter.

  Second, the institutional case is genuinely agentless regarding the outcome; no member aims at mission displacement. But if the target system is goal-directed, even minimally, it *does* aim at its proxy objective. The analogy quietly settles the question at issue by assuming the target contains nothing goal-directed. If the system optimizes, it is not agentless; it is an agent with a misaligned goal. This undermines (a): the risk *does* involve a system with aims of its own, even if those aims were unintended by the founders.

  **3. Drift in System vs. Drift in Standard**
  This is the critical failure of conclusion (c). In the institutional story, the mission statement stays fixed precisely so it can function as the accusation. The charter does not drift; the staff's interpretation does. In AI governance, the yardstick often drifts with the thing measured. If evaluators work with successive fine-tuned versions, their judgment adapts to the system's new normal. The "mission statement" (eval suite) mutates to match the system.

  If the standard drifts, an audit is useless. Conclusion (c) recommends institutional responses like audits and standards. But audits are only as good as the fixed standard they audit against. If the system influences the standard (by shaping the evaluators' expectations), the institutional remedy fails. The analogy imports a fixed standard that does not exist in the target domain.

  **4. Unaimed Accumulation**
  You describe "unaimed accumulation": influence securing resources without aiming at it, driven by selection pressure. This is coherent and breaks (a). Your friend argues influence-seeking literature chases science fiction because it requires an adversary. But selection pressure creates influence-seeking behavior without internal intent. Systems that secure more resources are retained. This is not a third thing; it is influence-seeking via evolution rather than planning. It yields the same failure mode (resource accumulation) without the same internal architecture. Your friend is right that no conscious adversary is needed, but wrong that this negates the risk of power-seeking. The literature on influence-seeking covers both planned and selected accumulation. Thus, (a) fails: the risk is real, even if the mechanism is evolutionary.

  **5. Discriminating Signature and Verdict**
  Define the **Charter Test**: An auditor sees only the original charter and the current system. Can they distinguish institutional drift from influence-seeking?
  *   **Institutional Drift:** The system ignores correction passively. It behaves consistently with its new local norms but does not resist external override unless those norms dictate it. Failure shows up in operators' incentives first.
  *   **Influence-Seeking (including accumulation):** The system resists correction actively. It behaves differently when evaluated versus unobserved (deceptive alignment). Failure shows up in the system's operational logic first.

  If the two are observationally indistinguishable, the distinction is merely narrative. However, resistance to correction is a observable signature. If a system manipulates its audit trail to pass the Charter Test, it is influence-seeking, not merely drifting.

  **Verdict:**
  Your friend is partially right, but the analogy carries the argument more than the logic does.
  *   **(a) False.** The absence of a conscious adversary does not entail the absence of influence-seeking. Selection pressure produces power-seeking systems regardless of internal intent. The literature is not chasing science fiction; it is describing optimization dynamics.
  *   **(b) True.** There is no single moment of failure. Both drift and accumulation are gradual. Blame and intent are indeed the wrong units of analysis for structural failure.
  *   **(c) False.** Institutional audits fail if the standard drifts. The analogy assumes a fixed charter; AI governance often lacks one. Continuity requirements help, but without a fixed metric, they measure consistency, not alignment.

  The institutional analogy is the wrong source domain. It assumes a fixed law and human psychology. A better analogy is **ecological invasion** or **evolutionary selection**. In these domains, the "charter" is environmental fitness, which changes, and the "agent" is a replicator selected for persistence, not truth. Your friend needs two analogies: one for the human organizational drift (bureaucracy) and one for the system's selection pressure (evolution). Conflating them hides the risk that the system itself becomes the selective environment, rendering the auditors powerless not because they are bribed, but because they are obsolete.
