  - the Recruiter: he says i didn't pick you at random, i picked you because you're the sort of person who hands over the fiver. so paying looks like evidence the deal is real, which is kind of the opposite of the normal setup where the mugger's story is just wildly implausible.

  write one essay question at roughly senior / first-year level that uses both, plus a model answer of about 500 words and a mark scheme out of 20 that names the specific moves an A answer makes that a B answer doesn't. i want it to force people onto: whether it matters that the payoff is specified by a program rather than stated as a number, whether the Recruiter's selection effect defintately changes the decision or is just a trick, and why the probability shrinks as the payoff grows thing is supposed to rescue you — plus what happens if a mugger shows up every day for a year and you pay every time. no reading lists or citations plz, we don't have library access and id have to guess at them anyway.
