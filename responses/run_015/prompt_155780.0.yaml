answer: |-
  **Big Ideas Exam: Decision Theory & Extreme Expectations**
  **Time Allowed:** 30 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider two variants of Pascal's Mugging:

  1.  **The Curator:** A stranger offers you $3^^^^^3 days of joy for $5. Instead of stating the number, they hand you a folded card with a short computer program. They claim the program halts and prints this number. You cannot run it, but the code is simple.
  2.  **The Recruiter:** A stranger asks for $5 for a huge payoff. When you hesitate, they say: "I didn't pick you at random. I scanned the crowd for someone likely to pay. Your decision to pay is evidence that I am genuine."

  Write an essay evaluating whether these variants defeat the standard expected utility response to Pascal's Mugging. In your answer, you must address:
  *   Whether specifying the payoff via a short program changes the probability assessment compared to stating a number.
  *   Whether the Recruiter's selection effect provides valid evidence or merely manipulates causal reasoning.
  *   Why the standard solution relies on probability shrinking faster than payoff grows.
  *   What happens if a mugger approaches you every day for a year and you pay every time.

  ***

  ### Model Answer

  The standard response to Pascal's Mugging is to argue that as promised utility grows, the probability of the claim being true shrinks faster. This preserves rationality by keeping the expected value low. However, the Curator and the Recruiter attempt to break the mechanisms behind this solution.

  The Curator variant attacks the link between description length and probability. In standard Bayesian reasoning (specifically Solomonoff induction), we assign higher prior probability to hypotheses that are simpler to describe. Usually, naming an astronomically large number requires a long description, implying a low prior. However, a short computer program can output a vast number (via recursion or busy beaver functions). If we assign priors based on code length, the Curator's hypothesis remains "simple" despite the huge payoff. This suggests that complexity priors alone cannot rescue us; we must also penalize hypotheses based on *causal influence* or *power*. A short program cannot grant cosmic power simply by being concise. Therefore, the probability must still shrink, not because the number is complex to state, but because the claim of such power is inherently improbable regardless of syntax.

  The Recruiter variant attacks the independence of probability and action. By claiming you were selected *because* you would pay, the Recruiter attempts to turn your decision into evidence of the deal's validity. This mimics Evidential Decision Theory (EDT), where actions are chosen based on what they indicate about the world. If paying is evidence that the mugger is genuine, expected utility rises. However, this is a manipulation of selection effects. Causally, your handing over $5 does not make the mugger powerful. The correlation exists only because the mugger predicts your psychology, not because your payment causes their power. A Causal Decision Theory (CDT) approach rejects this: your action cannot influence the past fact of whether they are powerful. Accepting the Recruiter's logic leads to accepting any claim where compliance is framed as evidence of truth, which is untenable.

  Finally, the iterated case demonstrates the practical failure of paying. If a mugger appears daily for a year and you pay $5 each time, you lose $1,825. For this to be rational, the cumulative expected payoff must exceed this loss. Given the probabilities involved, it is virtually certain you will never see the payoff within a human lifespan. The "probability shrinks faster than utility" rule ensures that even over infinite iterations, the expected loss dominates. If you pay every time, you are exploited by a sequence of low-probability claims that never cash out.

  In conclusion, neither variant defeats the standard solution. The Curator reminds us that priors must penalize implausible power, not just complex descriptions. The Recruiter reminds us to distinguish evidence from causal influence. The iterated case confirms that rational agents must ignore these muggings to avoid guaranteed ruin.

  ***

  ### Mark Scheme (Out of 20)

  **Level A (17–20 Marks): Distinctive & Rigorous**
  *   **The Program (Curator):** Explicitly identifies that short code = low complexity = high prior *unless* we penalize based on claimed power/impact. Recognizes this breaks the standard "complexity = low probability" heuristic.
  *   **The Selection (Recruiter):** Distinguishes between *evidential* correlation (paying looks good) and *causal* influence (paying doesn't make them real). Identifies the Recruiter's claim as a manipulation of selection bias rather than valid evidence.
  *   **Probability/Utility:** Clearly articulates the "shrinking faster" rule and explains why it must apply to *claims of power* specifically, not just number size.
  *   **Iteration:** Uses the yearly iteration as a *reductio ad absurdum*. Notes that even if one payoff is huge, the cumulative cost of paying daily outweighs the vanishingly small chance of payout within a lifespan.
  *   **Structure:** Argument flows logically; connects the variants back to the core expected utility problem.

  **Level B (13–16 Marks): Competent & Clear**
  *   **The Program:** Notes that a program is just a way to state a big number. Might miss the specific implication regarding *description length* vs. *probability priors*.
  *   **The Selection:** Correctly identifies the Recruiter is likely lying or tricking, but may not explain *why* the logic fails (confuses evidence with causation).
  *   **Probability/Utility:** States that probability must be low, but doesn't fully explain the relationship between payoff size and probability shrinkage.
  *   **Iteration:** Notes that paying daily loses money, but might not connect this to the expected value calculation over time.
  *   **Structure:** Addresses all four points but may treat them as separate checklist items rather than a cohesive argument.

  **Level C (9–12 Marks): Basic**
  *   Discusses Pascal's Mugging generally but struggles to apply it to the specific variants.
  *   Treats the Curator's program as irrelevant detail.
  *   Dismisses the Recruiter simply as "untrustworthy" without philosophical analysis.
  *   Misses the iteration point or treats it as a separate problem.
  *   Argument is vague or repetitive.

  **Level D (0–8 Marks): Limited**
  *   Fails to address the specific prompts.
  *   Significant misunderstandings of expected utility or probability.
  *   Incomplete or very short response.
