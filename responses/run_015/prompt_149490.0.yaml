  *(Self-Correction Note)*: I need to be careful not to misrepresent Nozick too badly or the philosophers will roll their eyes. Keep it accurate but accessible. The key is the *voluntariness* of the transfer.

  *(Drafting thought)*: Start with the coffee/roommate anecdote. It sets the scene. Then move to the Wilt example. Then the streaming glitch. Then the implications for the day.

