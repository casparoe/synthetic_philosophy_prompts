answer: |-
  1. **Sequence of Ideas**
  Begin with intra-personal ranking (Outcome A is better than B for Me). Establish that this requires no measurement, only order. Move to intra-personal magnitude (A is *much* better than B for Me). Show that a social decision requires this second step; ranking alone cannot resolve conflicts of interest. Distinguish the three demands: who is better off (ordinal), whose gain is larger (cardinal intra-personal), and how many smaller gains offset one larger gain (aggregation). Confirm the panel's vote covertly requires the third. Introduce common currency (money, QALYs) only after establishing the need for cardinality, then immediately critique it: currency relocates the comparison rather than dissolving it, as it assumes a specific scale shape. This critique must land before participants propose currencies themselves, preventing false comfort.

  2. **The Case**
  Retain your Joint Replacement vs. Talking Therapy case. It works provided you specify: 50 older patients (pain score 9→2) versus 200 younger patients (despair score 8→6). It must lack: cost differences (prevent efficiency arguments), mortality risks (prevent life-counting), and identifiable victims (prevent rescue principles). The self-reports must be explicitly non-comparable in units (pain relief vs. mood improvement). This ensures no single metric dominates. The trade-off must survive: fewer people get a huge benefit versus more people get a moderate benefit. This forces the panel to confront aggregation without hiding behind headcounts or need alone.

  3. **Misconceptions and Interventions**
  Address misconceptions in surfacing order. First, 'empathy requirement' (Intro): clarify we compare reports, not experiences. Second, '0–10 scale sufficiency' (Pre-case): explain shared anchors do not fix scale shape. Third, 'anchor linearity' (During case): demonstrate that the distance between 8 and 6 may not equal 9 and 7. Fourth, 'inability implies equality' (Pre-vote): challenge the idea that uncertainty licences treating everyone alike. Finally, 'all-or-nothing comparison' (Conclusion): show that some decisions are robust despite scale uncertainty. For this last thought to be intelligible, the concept of admissible transformations (rescaling) must be established in step three. Only then can they see that some differences survive every admissible rescaling.

  4. **Diagnostic Task**
  In the final ten minutes, present two options. Option A: One person moves from 10 to 2. Option B: Ten people move from 10 to 9. Ask: "Is funding Option B necessarily correct?" Wrong answer: "Yes, because ten people benefit." This reveals reliance on headcounting over intensity. Correct answer: "No, because the 10–9 gap might be negligible compared to 10–2." Follow up: "Can we ever decide without perfect scales?" Show Option C: One person 10→2 vs. Option D: One person 10→5. Ask which is fundable. Identifying C as robust despite incomparability separates those grasping the problem from those merely reciting slogans.

  5. **Exclusions**
  Say aloud: "We will not calculate QALYs or learn economic formulas. We will not solve moral philosophy or decide which health outcome is 'worthier'. We will not pretend a number can capture a life. We are here to understand what our vote assumes, not to find a magic metric."
