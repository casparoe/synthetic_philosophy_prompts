  **Conceptual framing and branch justification**

  This taxonomy isolates the structural conditions required for Buddhist consequentialism rather than adjudicating historical classifications. The root question establishes the normative target: aggregate welfare maximization. The first split (Karma) determines whether value is transmitted via outcome magnitude or internal state purification, distinguishing teleological mechanisms from aretaic ones. The second split (Bodhisattva) tests the scope of obligation, using a triage scenario to force a choice between aggregative optimization and particularist responsiveness. The third split (Emptiness) interrogates the metaphysical substrate, asking whether the lack of inherent existence dissolves the distinct units required for summation. The final split (Two Truths) assesses the status of the reasoning itself, distinguishing between provisional utility and ultimate coherence. Together, these nodes map the logical space from moral mechanics to ontological grounding. The embedded scenario functions as a stress test: if a practitioner chooses merit generation over immediate relief, they prioritize karmic causality over welfare aggregation; if they choose relief, they prioritize welfare but must justify ignoring traditional merit metrics. This structure allows respondents to locate their philosophical commitments without relying on sectarian labels, bridging analytic normative categories with South Asian moral ontology.

  **The taxonomy tree**

  **Root:** Does Buddhist ethical practice aim at the maximization of aggregate welfare across sentient beings?
  *   **No:** Leads to Virtue-Ethical or Deontological hybrids (excluded from this consequentialist map).
  *   **Yes:** Proceed to Node 1.

  **Node 1 (Karma Mechanism):** Evaluate the claim: "Karmic results are determined by the magnitude of welfare outcomes produced."
  *   **Reject (Mental/Ritual):** Value resides in intention or ritual efficacy, not outcome magnitude.
      *   *Leaf A:* **Purificationism.** Position: Ethics aims at agent purity, not world-states. *Awkward Commitment:* Must explain why relieving suffering matters if outcomes lack moral weight.
  *   **Accept (Causal):** Proceed to Node 2.

  **Node 2 (Bodhisattva Scenario):** Case: A practitioner can either relieve intense suffering in one being immediately or perform an action traditionally understood to generate merit benefiting many beings only indirectly. Does obligation dictate choosing the greater aggregate welfare?
  *   **No (Responsiveness):** Mandate is cultivated responsiveness, refusing aggregation across individuals.
      *   *Leaf B:* **Non-Aggregating Compassionism.** Position: Compassion responds to particular suffering without summation. *Awkward Commitment:* Cannot justify sacrificing one for many even in extreme cases.
  *   **Yes (Optimization):** Proceed to Node 3.

  **Node 3 (Emptiness Ontology):** Evaluate the claim: "Conventional designation preserves enough structural reality to support aggregation despite emptiness."
  *   **Reject (Undermines):** Distinct beings are illusory; summation lacks metaphysical ground.
      *   *Leaf C:* **Ontological Nihilist Consequentialism.** Position: Maximize welfare despite lacking distinct entities to receive it. *Awkward Commitment:* Must explain what is being maximized if no "whoms" exist.
  *   **Accept (Preserves):** Proceed to Node 4.

  **Node 4 (Two Truths Status):** Evaluate the claim: "Consequentialist reasoning is valid only instrumentally at the conventional level."
  *   **Accept (Instrumental):** Calculation is a useful fiction, ultimately incoherent.
      *   *Leaf D:* **Instrumental Conventional Consequentialism.** Position: Use aggregation as a skillful means, deny ultimate validity. *Awkward Commitment:* Risks moral skepticism if all ultimate grounds are silenced.
  *   **Reject (Robust):** Reasoning holds structural validity even ultimately.
      *   *Leaf E:* **Robust Realist Consequentialism.** Position: Welfare maximization is ultimately valid despite emptiness. *Awkward Commitment:* Must reconcile inherent existence of value with emptiness of phenomena.

  *Note: The scenario at Node 2 distinguishes Leaf B from Leaves D/E. Leaf A is excluded at Node 1.*

  **Empty spaces and inseparability notes**

  Two logical positions remain notably unoccupied. First, a view accepting welfare aggregation but denying emptiness affects moral ontology (Robust Realism) is rarely defended because it risks reifying sentient beings, contradicting core metaphysics. Second, a view treating compassion as purely calculative while rejecting karma's causal efficacy is unstable; without karmic causality, the long-term welfare calculation lacks a mechanism, reducing the view to secular utilitarianism devoid of Buddhist cosmological support. These spaces are unoccupied not due to logical impossibility, but because they incur high theoretical costs within the tradition.

  Regarding inseparability, Leaf D (Instrumental Conventional) and Leaf B (Non-Aggregating Compassionism) risk collapse. Both deny ultimate normative force to aggregation. The distinction hinges on whether conventional aggregation is permitted as a tool (D) or rejected even conventionally (B). However, in practice, a practitioner refusing aggregation (B) may act identically to one treating it as merely instrumental (D), making the distinction phenomenologically opaque. This collapse is not conceptually incoherent but reflects unexplored territory in how "skillful means" operationalizes non-aggregation. The tree separates them logically, but ethical practice may blur the line, suggesting that the difference lies in internal justification rather than external action.
