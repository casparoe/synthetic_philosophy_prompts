answer: |-
  Based on the track record you've provided, your friend is operating with a sophisticated, hybrid demarcation criterion. She is not a naive falsificationist (Popper), nor a strict sociologist of scientific knowledge (Kuhn/Latour). Her verdicts suggest she adheres to a version of **Lakatosian Methodological Falsificationism combined with Mertonian Norms.**

  Specifically, she distinguishes science not by *success* (Macroeconomics counts), nor by *current mechanism* (Plate Tectonics counts), nor by *institutional approval* (Plate Tectonics was rejected). She distinguishes science by **the willingness of a community to expose its core assumptions to refutation and to concede error when faced with it.**

  Here is the prediction of her verdicts, the rule she is running, and the case that would test it.

  ### 1. Predicted Verdicts on the New Cases

  **Case 1: String Theory**
  *   **Verdict:** **Science.**
  *   **Reasoning:** Although it lacks risky empirical predictions (which usually hurts a theory), it passes her "community behavior" test. You note it lives under "constant, harsh internal criticism." Unlike Intelligent Design or Freudianism, string theorists do not claim to have proven truth; they openly acknowledge the lack of empirical evidence and the speculative nature of the work. They are not immunizing the theory; they are stress-testing the mathematics. Since she counts Macroeconomics (poor forecasting) as science, current empirical failure is less disqualifying than dogmatic immunity.

  **Case 2: The Parapsychology Unit**
  *   **Verdict:** **Science.**
  *   **Reasoning:** This is the strongest case for her criteria. She rejected Homeopathy and Freud specifically because they "accommodate any possible outcome" and "never concede." This unit runs preregistered trials and *publishes null results*. This is the operational definition of "refusal to immunize." Even if the subject matter (psi) is historically associated with pseudoscience, the *methodological conduct* of this specific group adheres strictly to the norm of organized skepticism. She judges the practice, not the stigma.

  **Case 3: The Maverick Earthquake Forecaster**
  *   **Verdict:** **Non-Science.**
  *   **Reasoning:** This is the critical pivot. The Maverick makes risky predictions (Popperian plus) and has success (better than Macroeconomics). However, he has "no research community." Your friend's rejection of ID and Freud hinged on the phrase "its *community* never concedes." For her, science is a *social* system of checks and balances. A lone actor, no matter how accurate, lacks the institutionalized mechanism of peer critique that prevents self-deception and ad hoc adjustment. Without a community to challenge him, his "success" is anecdotal, not scientific.

  ### 2. The Rule She Is Running

  The rule that best fits her track record is: **Institutionalized Fallibilism.**

  A field is science if and only if:
  1.  **Theoretical Risk:** The theory makes claims that *could* be wrong (risky predictions or logical constraints).
  2.  **Normative Concession:** The practitioners possess and enforce a norm of admitting error (publishing nulls, acknowledging anomalies, internal criticism).
  3.  **Collective Scrutiny:** These norms are enforced by an organized community, not just individuals.

  This explains why Newton (anomaly acknowledged), Plate Tectonics (mechanism acknowledged as missing), and Macroeconomics (forecasting errors acknowledged) are **Science**.
  This explains why Homeopathy, Freud, and ID (anomalies explained away, errors hidden) are **Non-Science**.

  ### 3. Where the Rules Come Apart

  There is a tension in her criteria between **Epistemic Risk** (making predictions that could fail) and **Social Structure** (having a community to enforce honesty). These two rules fit her past record equally well but diverge on the new cases.

  *   **Rule A (Social Norms):** Science requires an organized community that enforces skepticism.
      *   *Predicts:* String Theory = Science; Parapsychology = Science; Maverick = Non-Science.
  *   **Rule B (Empirical Constraint):** Science requires generating risky empirical predictions that are tested against reality.
      *   *Predicts:* String Theory = Non-Science (no predictions); Parapsychology = Science (tested); Maverick = Science (risky forecasts).

  **The Divergence:**
  *   **String Theory:** Rule A accepts it (critical community); Rule B rejects it (no empirical risk).
  *   **The Maverick:** Rule A rejects it (no community); Rule B accepts it (high empirical risk/success).

  Your friend's inclusion of Macroeconomics (poor prediction) suggests she prioritizes **Rule A (Social Norms)** over raw predictive success. Her inclusion of Plate Tectonics (initially rejected by the establishment) suggests she values *critical engagement* over *institutional status*. Therefore, she will likely side with Rule A, accepting String Theory and rejecting the Maverick.

  ### 4. The Discriminating Case

  To definitively determine whether she prioritizes the **Social Structure** (Community) or the **Individual Attitude** (Fallibilism), present her with this case:

  **The Case:** *"A solitary researcher with no affiliation and no peers who maintains a public, archived log of risky predictions. When a prediction fails, they immediately update their public model and explicitly state they were wrong. They invite replication and provide all raw data, but no one else engages with them."*

  *   **If she counts this as Science:** Her rule is **Individual Fallibilism**. The *attitude* of concession is sufficient; the community is merely a helpful tool, not a requirement. (This would imply she might reconsider the Maverick if he admitted his errors openly).
  *   **If she counts this as Non-Science:** Her rule is **Institutionalized Skepticism**. Science is inherently a collective enterprise; without a community to *enforce* the norms of concession, an individual's self-correction is psychologically unreliable and therefore unscientific.

  **Why this discriminates:** It isolates the "Community" variable from the "Refusal to Immunize" variable. The Parapsychology unit had both; the Maverick had neither (arguably); this case has the Refusal to Immunize but lacks the Community. Her verdict here reveals whether "Science" is a method or a society.
