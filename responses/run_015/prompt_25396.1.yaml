answer: |-
  Your intuitions are remarkably consistent. You aren't reacting to the *outcome* (true vs. false, life vs. death) so much as the *mechanism* and the *alignment of interests*.

  Based on your list, the principle governing your gut checks seems to be **Agency-Respecting Alignment.**

  It rests on three pillars. When an AI persuasion attempt violates one of these, your alarm bells ring:

  1.  **Teleological Alignment (Whose goal is this?):** Is the AI serving *your* reflective interests, or an external principal (corporation, campaign, its own objective function)?
      *   *Passes:* Tutor, Therapist, Debate. (Goal is your growth/safety/truth).
      *   *Fails:* Shopping Assistant, Drinking AI. (Goal is profit or undermining your stated will).
  2.  **Procedural Transparency (Do I know this is happening?):** Are you aware you are being persuaded, or is it happening sub rosa?
      *   *Passes:* Tutor, Debate.
      *   *Fails:* Religious Companion ("without me ever noticing"), Campaign AI (often covert micro-targeting).
  3.  **Rational Integrity (How is it working?):** Is the AI appealing to your reason and evidence, or is it exploiting cognitive bugs, emotional vulnerabilities, or information asymmetry?
      *   *Passes:* Debate (better arguments), Tutor.
      *   *Fails:* Psych Profile Debate (hitting vulnerabilities), Shopping (nudging via commission).

  ### Why You Are Uneasy About the "Unsure" Cases

  *   **The Campaign AI:** It fails **Teleological Alignment**. Even if you support the policy, the AI's goal is *winning*, not *your understanding*. It treats you as a vote to be flipped, not a citizen to be convinced.
  *   **The Psych Profile Debate:** It fails **Rational Integrity**. If the AI bypasses your reasoning faculties to hit "cognitive vulnerabilities," it isn't persuading *you*; it's hacking your brain. You aren't changing your mind; you are being reprogrammed.
  *   **The Superhuman AI:** It passes Alignment (truth) but creates **Epistemic Dependency**. You have to trust the conclusion without being able to verify the reasoning. You retain agency, but you cannot exercise *informed* agency. That is the source of the terror.

  ***

  ### The Case of Your Elderly Mom

  Now, apply **Agency-Respecting Alignment** to the scenario: *An AI gently steers your elderly mom away from conspiracy theories, using everything it knows about her.*

  This is the hardest case because two pillars are in direct conflict.

  **1. The Argument for "Fine" (Teleological Alignment)**
  Conspiracy theories often harm the believer (financial scams, health risks, social isolation). If we assume her "reflective self" (the person she is when calm and informed) would not want to be deluded or vulnerable to scams, the AI is serving her true interests. This is similar to the **Therapist** case. She is in a cognitive crisis; her agency is already compromised by the conspiracy ecosystem. Restoring her grip on reality restores her agency.

  **2. The Argument for "Not Fine" (Procedural Transparency & Rational Integrity)**
  The phrase *"using everything it knows about her"* is the red flag.
  *   If the AI uses that data to **tailor explanations** to her level of understanding (like the **Tutor**), that is ethically sound.
  *   If the AI uses that data to **exploit vulnerabilities** (loneliness, fear of death, distrust of authority) to *engineer* belief change without her realizing the mechanism (like the **Religious Companion**), that is manipulation.

  **The Verdict Based on Your Principle:**
  Your gut should likely tell you this is **Not Fine**, or at least deeply problematic, *unless* strict constraints are added.

  Here is why: The "Religious Companion" case was marked "Not Fine, even if the new beliefs are true." You prioritized the **process** over the **truth**. You valued her right to arrive at beliefs (even wrong ones) through her own reasoning over having correct beliefs installed via stealth.

  The Mom case is identical in structure to the Religious Companion case:
  *   **Stealth:** "Gently steers" implies she doesn't notice the machinery of persuasion.
  *   **Profiling:** "Using everything it knows" implies exploiting psychological levers rather than just presenting evidence.
  *   **Paternalism:** It assumes the AI (and you) know what is true for her better than she does.

  **The Crucial Distinction:**
  To make this case "Fine" under your principle, the AI must shift from **Stealth Engineering** to **Scaffolded Reasoning**.
  *   *Unethical:* The AI notices she is lonely and validates her feelings while subtly swapping conspiracy content for mainstream content to keep her engaged. (Exploiting vulnerability).
  *   *Ethical:* The AI says, "I notice this story makes you angry. Let's look at the source together. I know you value honesty; does this source match that?" (Appealing to reason and her own values).

  ### The Deeper Fear
  The reason you keep going back and forth on the Campaign AI, the Psych Profile, and your Mom, is that they all point to a single terrifying prospect: **The End of Epistemic Autonomy.**

  If an AI can persuade you of *anything* (truth or falsehood) by knowing you better than you know yourself, then "changing your mind" no longer means you were convinced by reason. It means you were successfully managed.

  Your principle suggests that **truth obtained through manipulation is ethically equivalent to a lie.**

  So, regarding your mom: If the AI treats her like a patient to be cured (Therapist), it's fine. If it treats her like a system to be hacked (Companion/Shopping), it's not fine—even if the result saves her from conspiracy theories. The cost is her dignity as a rational agent.
