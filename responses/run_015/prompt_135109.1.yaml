answer: |-
  The unsatisfiable pair is Democratic Legitimacy and Textual Fixity in the age of algorithmic drafting, because you cannot anchor legal authority in human intent when the text is partly stochastic.

  Here's the reasoning: if a statute is prompt-engineered and the model hallucinates a clause that no human read but everyone voted on, Textualism says "it's law" (Fixity), while Purposivism says "there was no intent" (Legitimacy). You can't have both. So, here is the full spec for a theory that tries to survive that mess, broken down by what it needs to handle, what it needs to distinguish, and what conditions it must meet.

  ### The Cases It Must Handle Right
  1.  **Plain Meaning vs. Clear Intent:** When the text says one thing but the legislative history screams another.
      *   *Why:* This is the classic conflict; if a theory can't resolve the obvious contradiction, it's useless.
      *   *Flag:* **Non-negotiable.** You must pick a side or have a meta-rule; ignoring it collapses the system.
  2.  **Tech Terms That Drift:** Words like "vehicle," "search," or "currency" that change meaning due to innovation after enactment.
      *   *Why:* Laws outlive tech cycles; a theory that freezes meaning makes law obsolete, but one that updates it too freely makes law unpredictable.
      *   *Flag:* **Negotiable.** You can argue for original public meaning or evolving standards, but you must acknowledge the trade-off.
  3.  **Delegated Authority with Fuzzy Edges:** When agencies fill in gaps using algorithms the legislature didn't understand.
      *   *Why:* Modern governance relies on expertise, but unchecked delegation violates separation of powers.
      *   *Flag:* **Non-negotiable.** The theory must define the boundary of delegation or sovereignty dissolves.
  4.  **Algorithm-Mediated Drafting:** When the "author" is partly a model with no mental states, or the record contains AI summaries adopted without review.
      *   *Why:* This is the new nightmare; if the text wasn't cognitively authored, "intent" is a fiction.
      *   *Flag:* **Non-negotiable.** A modern theory *must* account for this or it's historically obsolete.

  ### The Distinctions It Can't Collapse
  1.  **Interpretation vs. Amendment:** Courts interpreting law versus courts making law.
      *   *Why:* If judges fix bad laws by "interpreting" them, they usurp the legislature.
      *   *Flag:* **Non-negotiable.** This is the core of the rule of law.
  2.  **Speaker Meaning vs. Text Meaning:** What the drafters thought versus what the public reads.
      *   *Why:* Secret intentions shouldn't bind the public; public text shouldn't bind if it's demonstrably erroneous.
      *   *Flag:* **Negotiable.** Textualists privilege text; Purposivists privilege speaker meaning. You can weight them differently, but you can't say they're the same thing.
  3.  **Predictive vs. Normative Interpretation:** What courts *will* do versus what they *should* do.
      *   *Why:* A theory of law must guide judges, not just describe their behavior.
      *   *Flag:* **Non-negotiable.** Descriptive theories aren't prescriptive enough for adjudication.

  ### The Consistency Conditions It Has to Meet
  1.  **Rule-of-Law Predictability:** Citizens need to know what the law is before they act.
      *   *Why:* Without this, law is just force.
      *   *Flag:* **Non-negotiable.**
  2.  **Democratic Legitimacy:** Law must derive from the consent of the governed via their representatives.
      *   *Why:* Without this, law is tyranny.
      *   *Flag:* **Non-negotiable.**
  3.  **Separation of Powers:** The judiciary must not swallow the legislature.
      *   *Why:* Prevents concentration of authority.
      *   *Flag:* **Non-negotiable.**

  ### The Jointly Unsatisfiable Cluster
  You were right to sniff out the tension, but it's actually a triad: **Democratic Legitimacy + Textual Fixity + Non-Cognitive Drafting.**
  If the text is fixed (Textualism), but the drafting was done by an AI (Non-Cognitive), you lose Democratic Legitimacy because there was no human will to ratify the specific wording. If you prioritize Legitimacy (Purposivism), you have to ignore the Text because the "intent" is null or unknowable. If you try to keep all three, you end up lying about whether the legislators actually understood what they voted on. The only way out is to treat AI-drafted text as a new category of "ratified output" where intent is presumed solely from the vote, but that weakens Legitimacy significantly.

  ### The Theory-Killer Desideratum
  The single desideratum that knocks out the most popular theories is **Democratic Legitimacy in the Context of Non-Cognitive Drafting.**
  Strict Textualism fails here because it treats the hallucinated text as binding despite no human intent supporting it. Strong Purposivism fails because it finds no intent to recover and thus declares the statute void or uninterpretable. Most theories assume a human mind behind the words; remove the mind, and the standard tools break.

  ### Quick Scorecard
  *   **Textualism:**
      *   *Predictability:* High.
      *   *Legitimacy:* Low (in AI cases). It binds people to words no human meant.
      *   *Sep of Powers:* High. Keeps judges out of the intent business.
      *   *Verdict:* Breaks on the AI drafting case; creates law without authors.
  *   **Purposivism:**
      *   *Predictability:* Low. Intent is hard to find even with humans, impossible with models.
      *   *Legitimacy:* High (in theory), but fails in AI cases where intent is absent.
      *   *Sep of Powers:* Low. Judges have to guess the "purpose" of a machine-generated clause.
      *   *Verdict:* Breaks on the AI drafting case; chases a ghost.
  *   **Dynamic (Living Law) View:**
      *   *Predictability:* Very Low. Meaning shifts with tech and values.
      *   *Legitimacy:* Medium. Adapts to current values but drifts from original consent.
      *   *Sep of Powers:* Very Low. Blurs interpretation and amendment constantly.
      *   *Verdict:* Survives the tech drift case best, but fails the Separation of Powers condition hardest.
