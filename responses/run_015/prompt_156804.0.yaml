answer: |-
  **JOINT STATEMENT ON HOUSING POLICY AND THE RIGHT TO THE CITY**
  **Signatories:** The Coalition for Abundant Housing (CAH) & The Housing Justice Alliance (HJA)
  **Date:** October 2023
  **Subject:** Findings from Adversarial Collaboration on Urban Land Use

  ### I. Areas of Agreement

  After two years of data exchange and model comparison, we affirm the following claims as empirically grounded and mutually acceptable bases for policy design:

  1.  **On Legalization and Supply Lags:** We agree that zoning and land-use regulations function as a binding constraint on housing supply in high-demand regions. We further agree that the supply response to legalization is not instantaneous; there is a measurable lag (typically 3–7 years) between regulatory approval and certificate of occupancy due to financing, construction, and permitting friction.
  2.  **On Filtering and Displacement:** We agree that "filtering" (the relative depreciation of units allowing lower-income access) is observable only when controlling for inflation and amenity changes. We agree that "displacement" must be operationally defined as involuntary exit driven by rent increases, eviction, or uninhabitable conditions, distinguishable from voluntary mobility. Anecdotal evidence of either phenomenon is insufficient for policy evaluation; longitudinal tracking of tenant IDs and parcel-level rent data is required.
  3.  **On the Right to the City:** We agree that the "Right to the City" comprises three distinct, potentially competing claims: (a) the *Right to Arrive* (access to opportunity-rich areas), (b) the *Right to Stay* (protection from involuntary displacement), and (c) the *Right to Decide* (participation in land-use governance). We acknowledge that maximizing the Right to Arrive can sometimes undermine the Right to Stay in the short term, and vice versa.
  4.  **On Land Value:** We agree that land value is largely socially created (via public investment, agglomeration, and community presence) rather than individually produced. We disagree on the optimal mechanism for recapturing this value, but agree that current capture rates are inefficient and inequitable.

  ### II. Residual Disagreements

  While we share a diagnostic baseline, our prescriptive priorities diverge. The following table outlines these divergences. We have flagged disputes that are primarily semantic (framing differences regarding the same underlying mechanism) versus substantive (conflicting models of causality).

  | Issue | Abundance Liberal Wording | Decommodification Socialist Wording | Semantic vs. Substantive |
  | :--- | :--- | :--- | :--- |
  | **Primary Driver of High Costs** | **Artificial Scarcity:** Costs are high because regulatory barriers prevent supply from meeting demand, creating monopoly rents for landowners. | **Rent Extraction:** Costs are high because housing is treated as a financial asset, allowing landlords to capture wages and public investment as private profit. | **Substantive.** AL posits a supply/demand mismatch; DS posits a distributional conflict over surplus. |
  | **Function of New Market Units** | **Pressure Valve:** New luxury units absorb high-income demand, reducing competition for older stock and slowing rent growth overall. | **Gentrification Vector:** New luxury units signal neighborhood "growth," attracting capital that raises land values and pressures existing tenants to leave. | **Substantive.** Disagreement on the net elasticity of demand and the speed of capitalization into land values. |
  | **Policy Priority** | **Maximize Stock:** The primary metric of success is the net number of new homes created per year, regardless of tenure type. | **Protect Tenancy:** The primary metric of success is the retention rate of existing low-income residents, regardless of total stock growth. | **Substantive.** Conflicting objective functions for policy optimization. |
  | **Concept of Liberty** | **Freedom to Build:** Liberty is maximized when owners and developers are free to utilize their property without state interference. | **Freedom from Eviction:** Liberty is maximized when residents are secure in their homes without fear of market-based expulsion. | **Semantic.** Both value liberty, but define the relevant constraint differently (state regulation vs. market power). |
  | **Role of Land Value Tax (LVT)** | **Efficiency Tool:** LVT is useful if it replaces distortionary taxes on labor or capital, encouraging land development. | **Recapture Tool:** LVT is useful if it funds social housing, returning socially created value to the community. | **Semantic.** Agreement on the mechanism, disagreement on the normative justification and revenue allocation. |

  ### III. Cruxes and Agreed Tests

  We identify three specific cruxes where further evidence could shift our weightings. We commit to accepting the results of the following tests as binding for future policy recommendations.

  **Crux 1: The Elasticity of Upzoning**
  *   **Question:** Does upzoning single-family zones lead to significant new construction, or does it primarily increase land prices?
  *   **Test:** A difference-in-differences study of Minneapolis 2040 versus comparable control cities over a 10-year horizon.
  *   **CAH Prediction:** Significant increase in permit issuance and moderate rent stabilization relative to control.
  *   **HJA Prediction:** Minimal increase in affordable units; majority of value captured by land sellers via increased lot prices.

  **Crux 2: The Incidence of Tenant Protections**
  *   **Question:** Do strong eviction protections and rent stabilization reduce housing supply investment?
  *   **Test:** Analysis of construction financing rates and permit volume in Berlin (2015–2020) compared to Hamburg.
  *   **CAH Prediction:** Capital flight and reduced maintenance investment in protected sectors.
  *   **HJA Prediction:** Stable investment in non-speculative sectors; reduction in predatory turnover costs.

  **Crux 3: The "Double-Key Statute" Probe**
  *   **Policy Description:** A statute that (A) legalizes six-unit buildings as-of-right on all residential lots, and (B) grants sitting tenants and a municipal land trust (funded by a phased-in Land Value Tax) a Right of First Refusal (ROFR) at appraised price on any sale.
  *   **Test:** Implementation in a mid-sized legacy city (e.g., Cleveland or Baltimore) with a 5-year review.

  | Metric | CAH Prediction (Abundance) | HJA Prediction (Socialist) |
  | :--- | :--- | :--- |
  | **Net New Units (Year 5)** | **+15%**. The as-of-right clause removes the biggest bottleneck. Developers will absorb the ROFR friction as a cost of doing business. | **+4%**. The ROFR and LVT create uncertainty that chills small-scale developer capital, offsetting the zoning gain. |
  | **Rents for Sitting Tenants** | **Flat (Real Terms).** Increased supply prevents spikes; LVT is capitalized into land prices, not passed to tenants. | **Protected.** The ROFR prevents speculative sales that usually trigger rent hikes post-renovation. |
  | **Who Moves Into New Units?** | **Market Rate.** Mostly young professionals and small families priced out of single-family homes. | **Vetted Mix.** The Land Trust will prioritize existing community members for ROFR purchases. |
  | **Would You Take The Deal?** | **Yes.** The as-of-right provision is the critical victory. We accept the LVT/ROFR as a political trade-off to unlock zoning. | **Yes.** The ROFR/LVT provision is the critical victory. We accept the upzoning risk to secure community ownership mechanisms. |

  ### IV. Empirical Parameters vs. Principles

  We note that several of our remaining disputes are not principled disagreements but rely on single empirical parameters. If these parameters are measured precisely, the policy prescription converges.

  1.  **The Pass-Through Rate of Land Value Tax:**
      *   *The Dispute:* CAH worries LVT will be passed through to rents; HJA assumes it will be capitalized into land prices.
      *   *The Parameter:* **$\rho$ (Rho)**, the percentage of LVT liability passed through to tenant rent versus absorbed by land value depreciation. If $\rho < 0.2$, CAH accepts LVT as neutral. If $\rho > 0.5$, HJA acknowledges LVT risks tenant stability without rent caps.
  2.  **The Demolition Rate under As-of-Right:**
      *   *The Dispute:* HJA fears upzoning leads to tearing down affordable "naturally occurring" stock; CAH assumes it adds density to underutilized lots.
      *   *The Parameter:* **$\delta$ (Delta)**, the ratio of existing affordable units demolished per 10 new units built. If $\delta < 0.1$, HJA accepts as-of-right zoning.
  3.  **The Velocity of Filtering:**
      *   *The Dispute:* CAH believes new units quickly free up older stock; HJA believes new units attract new demand faster than they filter.
      *   *The Parameter:* **$V_f$**, the annual percentage decrease in real rent of a unit as it ages.

  **Signed,**
  *The Coalition for Abundant Housing*
  *The Housing Justice Alliance*
