  1.  **Deconstruct the Prompt:**
      *   **Core Task:** Construct an example of a conceptual tension *internal* to Quine's philosophy.
      *   **Specific Conflict:** Between his *naturalistic treatment of moral values* (moral properties as natural/empirical) and his *rejection of modal essentialism* (no necessary truths, no de re modality).
      *   **Scenario Requirement:** A scenario where treating a moral property (e.g., wrongness of an institution) as naturalized/empirical seems to require modal commitments (necessary ties to causal/functional properties) that Quine's anti-essentialism rejects.
      *   **Analysis Requirement:** Explain why the ontology/ideology distinction doesn't solve this.
      *   **Conclusion Requirement:** Identify what this reveals about Quinean naturalized ethics (can it dispense with modality without collapsing morality into description?).

  2.  **Analyze Quine's Positions:**
      *   *Naturalism:* Philosophy is continuous with science. Everything that exists is part of the causal nexus. Moral properties, if they exist, must be natural properties.
      *   *Anti-Essentialism:* Rejection of analytic/synthetic distinction. Rejection of de re modality (necessary properties of objects). "Necessity resides in the way we talk about things, not in the things themselves."
      *   *Moral Realism/Naturalism:* Quine is often read as a moral skeptic or non-cognitivist, but he allows for a naturalized ethics where moral judgments are empirical hypotheses about human flourishing/social cohesion. However, he generally treats ethics as less central than science. For the sake of the prompt, I need to assume a *robust* Quinean moral naturalism (moral properties *are* natural properties) to generate the tension.
      *   *Ontology vs. Ideology:* Ontology = what exists (bound variables). Ideology = the conceptual apparatus/primitives we use to describe it. Quine tries to keep ontology lean (physical objects, sets) while allowing rich ideology.

  3.  **Constructing the Scenario:**
      *   *Idea:* Slavery or Torture. Let's pick a specific institutional practice to make it concrete. "Chattel Slavery."
      *   *Naturalization:* To say "Slavery is wrong" is a natural fact, it must supervene on or be identical to natural properties (e.g., suffering, coercion, reduction of agency).
      *   *The Modal Problem:* If "wrongness" is a natural property $N$, is it *necessarily* wrong? If the natural properties $N$ obtain, does wrongness *have* to obtain?
      *   *Quine's Constraint:* Quine rejects the idea that objects (or situations) have properties *necessarily*. He rejects the notion that $N$ *entails* Wrongness in a modal sense across possible worlds. For Quine, "Necessity resides in language."
      *   *The Tension:* If moral properties are just natural properties, then "Slavery is wrong" translates to "Slavery has property N." But moral discourse implies a normative force that seems to require a connection stronger than mere correlation. If the connection is contingent (just how things happen to be in this world), then in a slightly different causal setup, $N$ might not be wrong. But moral intuition (and the function of moral language) suggests that if the *relevant natural features* are present, the wrongness *must* be present. This looks like a necessary connection (supervenience), which smells like essentialism.

  4.  **Developing the Argument (Drafting the Core Conflict):**
      *   *Step 1: The Naturalist Claim.* Moral property $M$ (wrongness) = Natural property $N$ (e.g., systematic infliction of pain for economic gain).
      *   *Step 2: The Anti-Essentialist Claim.* There are no necessary truths about the world. Any statement can be revised. There is no "de re" necessity that $N$ makes something wrong.
      *   *Step 3: The Clash.* To maintain the *normativity* or *universality* of the moral claim within a naturalistic framework, we seem to need to say: "In any possible situation where $N$ occurs, $M$ occurs." This is a modal claim (supervenience). Quine rejects modal logic as obscure ("intensional").
      *   *Step 4: The Specific Scenario.* Consider an institution $\mathcal{I}$ (e.g., a specific labor camp). We identify its wrongness with its causal output (suffering). If we say "It is wrong *because* it causes suffering," we imply a law-like connection. If this connection is merely contingent (empirical generalization), then a world where suffering occurs without wrongness is possible. But if that's possible, is it really the *same* moral property? If moral properties are rigidly designated natural kinds (like Water = H2O), then we have essentialism (Kripke/Putnam style), which Quine hates.

  5.  **Addressing Ontology vs. Ideology:**
      *   Quine might say: "Modality is just ideology, not ontology. I can talk *as if* it's necessary without committing to modal entities."
      *   *Counter:* Moral naturalism requires the *truth* of the moral claim to be grounded in the natural world. If the grounding relation (supervenience) is not robust (i.e., not necessary), the moral claim loses its force. If I say "Slavery is wrong" but admit "It's just a contingent fact of our psychology that we dislike slavery, and it could have been otherwise," I haven't naturalized *morality*; I've naturalized *moral sentiment*. The prompt asks about moral *properties*.
      *   So, appealing to ideology doesn't work because the *truth conditions* of the moral statement depend on the relation between $N$ and $M$. If that relation lacks modal force, the identity $M=N$ fails.

  6.  **Refining the Tension (The "Collapse" Problem):**
      *   If Quine removes modality to save his anti-essentialism, he reduces "Wrongness" to "Disapproved by society" or "Causes pain."
      *   This is the Is-Ought problem. Quine tries to bridge it via naturalism.
      *   But without a necessary connection (supervenience), the "ought" dissolves into the "is."
      *   The prompt asks: Does Quinean ethics collapse moral properties into descriptive ones?
      *   *Conclusion:* Yes, unless it smuggles in modality. But if it smuggles in modality, it violates Quine's anti-essentialism.

