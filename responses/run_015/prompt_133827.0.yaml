      *   *Is the distinction clear?* Ensure I distinguish between *de dicto* (linguistic) and *de re* (object-based) modality. Quine accepts the former (as loose speech) but rejects the latter (as metaphysics). The problem is that moral naturalism seems to require the latter to function as *morality*.
