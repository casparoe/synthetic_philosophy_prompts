answer: |-
  Provost, I am writing on behalf of the Senate Committee on Academic Labor to offer a recommendation regarding the current impasse with the Graduate Instructors Union and the action they have termed a partial withdrawal. We recognize the urgency of the situation, particularly with the accreditation self-study deadline five weeks away and the unresolved status of roughly four hundred graduating seniors and ninety international students whose records are currently incomplete. The Committee has deliberated extensively on the General Counsel's position, the Union's rationale, and the specific harms accruing to students, and we are submitting this advice with the understanding that it requires difficult concessions from all parties to resolve without escalating into a full work stoppage or mass discipline.

  Our starting point is the nature of the action itself. The Union argues that withholding the record of work while continuing to perform the labor is distinct from a traditional strike, and on this point, we find their conceptual distinction persuasive enough to warrant a differentiated institutional response. Teaching a section and entering grades into a learning management system are functionally different tasks, even if they are contractually bundled. The former is direct engagement with students; the latter is administrative compliance. When the University repurposes that administrative compliance, specifically the learning-outcomes assessment forms, as training data for an AI tutoring pilot intended to operate alongside or potentially replace these same instructors, the refusal to provide that data takes on a dimension of self-protection that differs from a simple refusal to work. It is not merely a slowdown; it is a withholding of consent to be digitized under current conditions. To treat this identical to a total walkout ignores the nuance of what is being withheld. The instructors are not withholding their labor from the students; they are withholding their metadata from the administration. This distinction matters for how we classify the action, and while General Counsel categorizes this as an unprotected partial strike, the Committee believes treating it as protected concerted activity for a defined window is the only way to de-escalate without conceding the underlying contract dispute.

  However, we must address the strongest version of the General Counsel's objection, which rests on the moral economy of bargaining. The Counsel's position is that the credibility of a strike relies on the workers absorbing cost as a signal of sincerity, distinguishing a withdrawal of labor from a mere holdout. A tactic that maintains pay while applying pressure removes the economic risk that traditionally disciplines the length and intensity of a dispute, potentially inviting an arms race of inventive pressure tactics that erode the framework everyone depends on. We take this argument seriously. If the University accepts proportional pay docking for withheld administrative tasks while teaching continues, it normalizes a form of leverage that bypasses the economic pain of striking. This is the central vulnerability of the compromise we are proposing. By allowing instructors to retain pay for the hours they teach while docking only the fraction they withhold, we risk validating a strategy that allows workers to pressure the administration without the sacrificial signal that usually forces a resolution. We acknowledge that this weakens the University's long-term position on maintaining clear boundaries around work stoppages. Nevertheless, we believe the alternative is worse. Docking one hundred percent of pay for a twenty percent withholding of tasks is disproportionate and will be viewed as thuggish by the faculty senate and the union alike, likely triggering the very full strike everyone is trying to avoid. The risk of normalizing this tactic is outweighed by the immediate risk of exploding the labor peace entirely.

  This leads us to the question of student harm, which is where the standard rhetoric of labor disputes fails to fit the facts. The usual reply to third-party harm in a strike is that the harm is the employer's responsibility since they can end it by settling, but that reply fits awkwardly here where the harm is deliberately spread thin and open-ended rather than concentrated and brief. When a union walks out, the harm is visible and immediate; when they withhold grades and assessment forms, the harm is bureaucratic and deferred until it becomes catastrophic for the student trying to graduate or maintain visa status. The people absorbing this harm are in some cases the strikers' own undergraduates, which creates a moral tension within the action itself. The Committee believes that while the Union is correct that the University bears ultimate responsibility for settling the contract, the Union also bears a responsibility not to use graduating seniors and visa-dependent students as leverage in a way that threatens their immediate futures. This is why our recommendation includes a carve-out. We are proposing that the University condition its acceptance of this partial withdrawal on a protocol requiring that graduating seniors' and visa-related records be entered within a fixed number of business days. We know this reduces the leverage of the action significantly. You are correct to suspect that demanding the carve-out hands back the only records that actually bite and guts the action. If the most urgent records are filed, the pressure on the administration to settle before the accreditation deadline diminishes. But the Committee believes this is a necessary moral cost. We cannot recommend a path that knowingly jeopardizes the graduation or residency of specific students to force a contract resolution, even if that leverage is the only thing that works. We are prioritizing the students' immediate security over the tactical purity of the labor action.

  Therefore, our bottom line recommendation is that the Provost treat the action as protected concerted activity for a defined window running to the accreditation deadline, with pay docked only in proportion to declared hours withheld. This must be conditional on a written protocol that includes advance notice of the withholding, a cap on the fraction any one instructor can withhold to prevent total administrative collapse, and the carve-out requiring that graduating seniors' and visa-related records be entered within five business days of submission. In exchange, the University must commit to binding mediation on the two stalled items, dependent health coverage and section size caps, and provide an undertaking not to discipline anyone who complies with this protocol. This approach accepts the vulnerability that it reduces the Union's leverage and risks normalizing partial withholding, but it secures the accreditation data we need, protects the most vulnerable students, and keeps the instructors in the classroom. It avoids the escalation of a full strike and the reputational damage of mass pay docking. We recommend this path not because it is perfect, but because the alternatives are binary and destructive. We need your authorization to communicate this framework to the Union by Wednesday so that any agreement can be implemented before the next payroll cycle.

  I want to be plain with you outside the formal recommendation about where this compromise is most vulnerable, since you asked for honesty rather than ratification. The carve-out for seniors and visa students effectively removes the emergency pressure that would force your office to settle before the accreditation deadline. If the Union agrees to this, they are giving up their only leverage that bites immediately, which means they might reject it and proceed without the protocol, leaving you with the same problem but less time. Conversely, if they accept it, you get the critical records but lose the incentive to settle the contract quickly, potentially dragging this out past the accreditation deadline anyway under the guise of compliance. The compromise relies on the Union trusting that mediation will work without the threat of the accreditation failure hanging over your head, and it relies on you trusting that they won't find other ways to withhold cooperation. The weakest link is the assumption that both sides will act in good faith once the immediate crisis of the graduating seniors is defused. History suggests that without the pressure of the deadline, the stalled contract items will remain stalled. You are buying time and stability, but you may not be buying a resolution.
