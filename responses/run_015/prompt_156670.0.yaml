answer: |-
  You have identified a genuine and significant problem in administrative data, and your intuition is correct: neither "looping" nor "concept creep" captures the specific mechanism you are seeing. Your colleague in philosophy was reaching for the right tools, but they are the wrong size for this job.

  Here is the breakdown of what this is, what it isn't, the technical name for the underlying failure, and a proposed term you can use with your commissioners.

  ### 1. Why your friend's terms don't fit

  *   **Looping Effects (Ian Hacking):** This describes a feedback loop where classifying people changes how they behave, which in turn changes the classification. *Example:* People diagnosed with "multiple personality disorder" start exhibiting more distinct alters because that is what the diagnosis expects.
      *   *Why it's not this:* You are not describing people changing their behavior to fit the label. You are describing the *ruler* changing while the label on the ruler stays the same. Looping is about the *target* moving; your problem is about the *measure* moving.
  *   **Concept Creep (Nick Haslam):** This describes concepts expanding to include more phenomena over time (e.g., "bullying" expanding from schoolyards to workplaces to online comments).
      *   *Why it's not this:* Concept creep acknowledges the expansion. It admits the net is getting wider. Your problem is that the dashboard draws a single smooth line that implies the *same* net is catching *more fish*, when in reality the mesh size has changed, the boat has moved, and sometimes they are counting seaweed. Concept creep explains the rise; it does not explain the *false continuity*.

  ### 2. The Technical Name: Measurement Non-Invariance

  In psychometrics and epidemiology, the rigorous term for what you are seeing is **Longitudinal Measurement Non-Invariance**.

  *   **Definition:** A measure is "invariant" if it measures the same underlying construct in the same way across different time points. If you change the questions on a depression scale, or the criteria for Autism, you have broken invariance.
  *   **The Implication:** When invariance is broken, a time-series graph is statistically illegitimate. You cannot plot Time A and Time B on the same axis because the unit of measurement (the "yardstick") is not constant.
  *   **Why you haven't heard it:** This is a technical statistical property, not a policy term. Commissioners won't know it, and clinicians often treat diagnostic manuals as fixed truths rather than measurement instruments subject to error.

  ### 3. The Phenomenon: "The Continuity Illusion"

  Since "Measurement Non-Invariance" is too dry for a board meeting, and there is no single established policy term for the *visual deception* you described, I propose you call this **The Continuity Illusion**.

  You can define it for your colleagues as follows:

  > **The Continuity Illusion:** A data visualization artifact where a stable diagnostic label and a smooth trend line mask significant discontinuities in the operational criteria, assessment instruments, or population thresholds used to generate the numbers. It creates the false impression of tracking a single quantity over time, when the system is actually tracking a sequence of related but distinct quantities.

  This distinguishes the *visual output* (the smooth line) from the *administrative reality* (the shifting criteria).

  ### 4. Edges and Boundaries: Real vs. Lookalike

  To survive the skeptical colleague, you need to distinguish this phenomenon from legitimate data updates. Here is the boundary test:

  | **Feature** | **Genuine Instance (The Continuity Illusion)** | **Lookalike (Legitimate Change)** |
  | :--- | :--- | :--- |
  | **Labeling** | The diagnostic code or name remains identical (e.g., "Autism"). | The code or name changes (e.g., "Asperger's" to "Autism"). |
  | **Documentation** | Changes to criteria or tools are buried in technical appendices or clinical guidance. | Changes are openly announced as a "break in series" or "new baseline." |
  | **Visualization** | The dashboard draws a single continuous line across the change point. | The dashboard uses a break in the line, shading, or a footnote to signal discontinuity. |
  | **Intent** | The system prioritizes trend stability for reporting targets. | The system prioritizes measurement accuracy over visual continuity. |
  | **Example** | ADHD rates rise smoothly while age-of-onset criteria are silently loosened. | A new census category is introduced, and previous years are not retroactively adjusted. |

  **What counts as a genuine instance:**
  *   **Silent Renorming:** IQ tests where the average is fixed at 100 by design, masking raw performance changes.
  *   **Threshold Drift:** Service eligibility criteria tightening or loosening without a change in the diagnostic code.
  *   **Instrument Swaps:** Moving from clinician-led assessment to self-report screening without adjusting the prevalence baseline.

  **What does NOT count:**
  *   **Diagnostic Substitution:** When one label disappears and another appears (e.g., "Learning Disability" to "Specific Learning Disorder"). This is visible on the dashboard.
  *   **Open Re-baselining:** When the trust explicitly states, "2023 data is not comparable to 2022 due to system change."
  *   **Advocacy-Led Expansion:** When clinicians openly argue, "We are diagnosing more because we now recognize mild cases." This is honest concept creep, not an illusion.

  ### 5. Draft Note for Commissioners

  Here is a draft you can adapt for your half-page explanation. It is written to be polite but firm about the data's limitations.

  ***

  **Note on Data Interpretation: Prevalence Trends and Measurement Continuity**

  **Observation:**
  The dashboard presents prevalence rates (e.g., Autism, ADHD) as continuous time-series data. The smooth trend lines imply that we are measuring the same population characteristic in the same way over the entire period.

  **Constraint:**
  In mental health diagnostics, the "unit of measurement" is not fixed. Over the last decade, diagnostic criteria (DSM/ICD revisions), assessment instruments (clinician-led vs. self-report), and service eligibility thresholds have shifted significantly. While the diagnostic *labels* remain constant on the dashboard, the *operational definitions* behind them have drifted.

  **Impact:**
  This creates a **Continuity Illusion**. A rising trend line may reflect a combination of genuine prevalence increase, broadened criteria, and changed detection methods. Conversely, stable numbers (as in IQ standardization) may mask actual shifts in population performance due to statistical renorming.

  **Recommendation:**
  1.  **Treat long-term trends as indicative, not precise.** A 10% rise over 10 years cannot be interpreted as 10% more patients; it indicates a change in the system's detection capacity.
  2.  **Annotate structural breaks.** Where major criteria changes occurred (e.g., DSM-5 adoption), visual breaks or footnotes should be added to the dashboard to signal that pre- and post-data are not directly comparable.
  3.  **Focus on flow, not just stock.** Given the measurement drift in prevalence, activity data (referrals, waits, discharges) often provides a more stable measure of service demand than diagnostic counts.

  ***

  ### Summary for your Colleague

  If you need to summarize this in the argument afterwards:

  *"Looping is about people changing to fit the category. Concept Creep is about the category getting wider. What I'm seeing is **Measurement Non-Invariance** masked by **Semantic Stability**. We are keeping the name on the box the same while changing the contents, and then drawing a graph that pretends the contents haven't changed. I'm calling it **The Continuity Illusion**, and we need to footnote the dashboard so commissioners don't make budget decisions based on a visual artifact."*
