  ### 1. Translation into Decision-Theoretic Terms

  Mapping "knowing $p$" to rejecting the null hypothesis $H_0: \neg p$ in a binary classification task aligns epistemology with signal detection. The evidential body corresponds to the test statistic $T(x)$, typically a likelihood ratio $\Lambda(x) = P(x|p)/P(x|\neg p)$. Traditional epistemic invariantism posits a fixed significance level $\alpha$, implying a static decision threshold $\tau$ regardless of context. Pragmatic encroachment argues $\tau$ is a function of the loss function $L(a, s)$, where actions $a$ depend on the truth of state $s$. In low-stakes scenarios, the cost of a Type I error (acting on false $p$) is negligible, allowing a lower $\tau$ and higher recall. In high-stakes scenarios, the cost of a Type I error dominates, necessitating a higher $\tau$ to maximize precision. According to the Neyman-Pearson lemma, the most powerful test rejects $H_0$ when $\Lambda(x) > \eta$, where $\eta$ is derived from the ratio of losses and priors: $\eta \propto \frac{Cost(False Positive)}{Cost(False Negative)}$. Encroachment asserts that $\eta$ shifts with stakes even if priors remain constant. Thus, the assertion "I know $p$" is not a statement about the posterior probability $P(p|x)$ alone, but a declaration that $P(p|x)$ exceeds a stake-dependent decision boundary $\tau(L)$. The subject doesn't just estimate probability; they optimize a risk profile. Knowledge attribution becomes synonymous with passing a Neyman-Pearson test where the critical region is dynamically scaled by the utility matrix of the agent's current environment. The evidence generation process remains invariant, but the classification rule is endogenous to the cost structure. This renders "knowledge" identical to "actionable confidence," transforming an epistemic predicate into a decision rule parameter. The cost of being wrong in different directions dictates the slope of the decision boundary in the ROC space. Consequently, variance in knowledge attributions across contexts is explained entirely by variance in the loss matrix.

  ### 2. Residue Report: Clean Mappings, Distortions, Missing Pieces

  Clean mappings exist between stakes and cost matrices, and evidence strength and likelihood ratios. The decision to "claim knowledge" maps cleanly to rejecting $H_0$ when the expected utility of assertion exceeds the expected utility of silence. However, distortions arise when introducing an "assertion norm" parameter. Decision theory optimizes overt actions, but encroachment concerns the *status* of the belief itself, not just the action taken. To make this fit, we must treat "assertion" as an action with its own specific loss profile, distinct from the practical action (e.g., depositing the check). This distorts the framework by conflating the verification step with the deployment step. What's missing is the phenomenological residue: the internal state of certainty. Decision theory describes optimal behavior under uncertainty, but it doesn't capture the qualitative shift in *epistemic status* that encroachment proponents claim. It reduces "knowing" to "betting," leaving out the normative force of truth-tracking independent of utility. The "knowledge" label becomes merely a flag for "actionable probability," stripping it of its traditional factive weight. Furthermore, decision theory assumes the truth value is fixed, whereas encroachment suggests the *justification condition* itself is mutable, which requires forcing a static truth state into a dynamic utility framework. The factivity of knowledge (you can't know what's false) has no direct analog in loss minimization, which operates purely on expectations. This gap requires an extra normative layer to explain why we care about truth beyond its utility. Without this layer, the model cannot distinguish between a lucky guess with high utility and a justified true belief.

  ### 3. Verdict with the Base-Rate Twist

  With the base-rate twist, encroachment collapses into robust decision theory. If you fix $\tau$ before knowing prevalence $\pi$, you are effectively solving for a threshold that minimizes maximum regret across possible priors. High stakes amplify the penalty of error, forcing a conservative $\tau$ to guard against unfavorable $\pi$. This isn't a change in the *nature* of knowledge; it's a change in the *risk tolerance* of the classifier. Encroachment is merely statistical decision theory misdescribed as epistemology. The "distinctive work" purported by encroachers is actually just the optimization of a loss function under prior uncertainty. There is no ghost in the machine; no extra epistemic parameter is required. The intuition that stakes change "knowledge" is a cognitive illusion conflating the confidence required to *act* with the justification required to *believe*. As a data scientist, you know the model doesn't change because the cost matrix changes; only the decision boundary does. Encroachment mistakes the boundary for the model. Therefore, invariantism holds: the epistemic relation is stable, only the operational threshold moves. We do not need a new epistemology; we need better calibration of our loss functions. The encroachment debate is a category error, treating a hyperparameter tuning problem as a fundamental ontological shift.
