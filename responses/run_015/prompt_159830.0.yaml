  # The Spec: Desiderata for "Emergence"

  Here are the seven requirements any scientific claim must meet to earn the label "emergent" in a serious news context. I have categorized them by whether they are essential for the concept to function (Non-negotiable), useful but context-dependent (Negotiable), or metaphysical biases that should not gatekeep the word (Prejudice).

  ### 1. Base Dependency
  **The Case:** The macro phenomenon must vanish if the micro configuration vanishes. A hurricane stops if the air molecules stop moving; consciousness stops if the neurons stop firing. If the macro property floats free of the physical substrate, it is not emergence; it is magic or dualism.
  **Verdict:** **Non-negotiable.** Without this, you are reporting on spirituality, not science.

  ### 2. Qualitative Novelty
  **The Case:** The property must not be a simple sum of the parts. Temperature is just average kinetic energy (aggregation); wetness is not a property of a single water molecule (novelty). If the headline property is just "more of the same" (e.g., "a bigger pile of sand"), it is not emergent.
  **Verdict:** **Non-negotiable.** This distinguishes emergence from mere aggregation.

  ### 3. Multiple Realizability (The Swap Condition)
  **The Case:** The same macro pattern must be producible by different micro constituents. A traffic jam exists whether the cars are Fords or Toyotas, gas or electric. A protein fold can sometimes arise from different amino acid sequences. If the macro state is locked to one specific micro arrangement, it is likely just a complex mechanism, not an emergent phenomenon.
  **Verdict:** **Non-negotiable.** This is the primary marker of the "special sciences" (biology, economics) versus basic physics.

  ### 4. Dynamic Stability (The Turnover Condition)
  **The Case:** The pattern must persist while its constituent matter is replaced. A convection cell exists only while energy flows, but the specific air molecules in the cell change constantly. A glider in the Game of Life moves even though the "on" cells change position every tick. If the object requires the *same* atoms to persist, it is a static object, not an emergent process.
  **Verdict:** **Non-negotiable** for processes/systems; **Negotiable** for static properties (like the color of a gem).

  ### 5. Explanatory Autonomy
  **The Case:** You must need distinct concepts or laws to explain the phenomenon efficiently. You can simulate every atom in a hurricane, but that simulation does not explain *why* the storm moves left rather than right; fluid dynamics does. If the base science (physics) explains it fully without needing new vocabulary, the claim is just "complicated," not emergent.
  **Verdict:** **Non-negotiable.** This is the practical filter for journalism: does this justify a separate field of study?

  ### 6. Natural Kindhood (The Anti-Gerrymander Rule)
  **The Case:** The boundaries of the system must be non-arbitrary. "A hurricane plus one specific nitrogen molecule over the Sahara" is a valid physical sum, but it is not a natural kind. Nothing interesting is true of that specific conjunction. Emergent systems must have boundaries defined by causal interaction, not by the observer's whim.
  **Verdict:** **Non-negotiable.** This prevents nonsense conjunctions from qualifying as emergent systems.

  ### 7. Scale Agnosticism
  **The Case:** The definition must not assume the micro-level is always the "real" base. In some quantum gravity theories, spacetime itself is emergent from deeper entanglement structures. If your definition requires small things to build big things, you cannot handle cases where space and time are the emergent variables.
  **Verdict:** **Negotiable.** Most reporting is micro-to-macro, but a robust definition shouldn't break if physics flips the script.

  ***

  # Verdict on the Newsroom Tests

  You asked about three specific tests your team uses. Here is the breakdown:

  **1. The Laplace Test (Unpredictability)**
  *Verdict:* **Prejudice dressed up as a requirement.**
  This test conflates *epistemic* surprise (we can't calculate it) with *ontic* emergence (nature doesn't determine it). Most genuine emergence (like weather or protein folding) is predictable in principle given perfect micro-data, but computationally irreducible. If you demand fundamental unpredictability, you rule out almost all accepted cases of weak emergence (fluid dynamics, thermodynamics) and keep only the metaphysically controversial ones (consciousness). Do not use this as a gatekeeper.

  **2. The Swap Test (Substrate Independence)**
  *Verdict:* **Genuine Desideratum.**
  This is essentially Requirement #3 (Multiple Realizability). If a phenomenon disappears when you swap the substrate (e.g., silicon for neurons) without changing the functional organization, it was likely a property of the substrate, not an emergent property of the organization. This is the strongest practical check for "special science" claims.

  **3. The Funding Test (Explanatory Autonomy)**
  *Verdict:* **Defensible-but-Optional.**
  This is a sociological proxy for Requirement #5 (Explanatory Autonomy). If a phenomenon doesn't justify its own models, journals, or budget, it's likely just applied physics. However, sometimes a new emergent field takes decades to get funding. Use this as a heuristic for maturity, not existence.

  **Are any two secretly the same?**
  The **Swap Test** and the **Funding Test** are closely linked. If you can swap the substrate (Swap), you usually need new laws to describe the invariant pattern (Funding). However, they come apart in edge cases: you might have multiple realizability without a fully funded science (early stage), or a funded science that is merely engineering the base (applied physics). Keep them distinct.

  ***

  # Tension Analysis: Where the List Breaks

  You asked me to flag pairs of desiderata that cannot be jointly satisfied. There are two major fault lines.

  **1. Novel Causal Power vs. Micro Causal Completeness**
  *The Tension:* Requirement #1 (Dependency) implies the micro level fixes everything. Requirement #5/6 (Autonomy/Power) implies the macro level does something the micro level doesn't. If the micro laws are causally complete (every physical effect has a sufficient physical cause), there is no "work" left for the emergent property to do.
  *The Verdict:* **Jointly Unsatisfiable under standard definitions.** You cannot have a macro cause that is both *novel* and *non-redundant* if the micro cause is *sufficient*.
  *The Fix:* You must redefine "cause." If cause means "physical production," emergence loses. If cause means "difference-making" or "explanatory leverage," emergence survives. For journalism, treat claims of "downward causation" with extreme skepticism unless the researcher clarifies they mean *control* or *explanation*, not physical force.

  **2. Surprise vs. Predictability**
  *The Tension:* We want emergence to be surprising (Novelty), but science aims to predict (Explanation). If a theory explains it perfectly, is it still emergent?
  *The Verdict:* **Satisfiable via distinction.** Distinguish *Emergent-for-us* (computationally hard to predict, e.g., weather) from *Emergent-in-itself* (fundamentally unpredictable, e.g., some interpretations of quantum measurement). Most scientific claims are the former. If a researcher claims the latter, they are making a metaphysical claim, not a standard scientific one.

  ***

  # Filtering and Prejudice

  **The Single Most Filtering Requirement:**
  **Explanatory Autonomy (#5).**
  This does the most work. Many things are novel and dependent (e.g., a specific complex machine), but if you can explain them fully using only the base laws without new concepts, they are not emergent in a scientifically useful sense. This requirement kills the "it's just complicated" shrug.

  **The Prejudice Requirements:**
  **Scale Agnosticism (#7) and Strong Causal Power.**
  Demanding that emergence work "bottom-up only" is a prejudice of classical physics. Demanding that emergence involve *new fundamental laws* (Strong Emergence) is a prejudice of those wanting consciousness to be metaphysically special. Both should be treated as theoretical commitments, not definitions.

  ***

  # Scorecard: Familiar Stances

  **Reductionism-with-Bridge-Principles:** Fails **Qualitative Novelty** and **Explanatory Autonomy**. It treats emergence as a temporary placeholder for ignorance. Good for physics, bad for biology.

  **Strong Emergence (New Fundamental Laws):** Passes **Novelty** and **Causal Power**, but fails **Base Dependency** (often implies micro-incompleteness). High risk of pseudoscience unless rigorously constrained.

  **Coarse-Graining (It's-All-About-Models):** Passes **Base Dependency** and **Predictability**, but struggles with **Causal Power**. It explains why we *talk* about emergence, but not why the world *is* emergent.

  **Emergence-as-Multiple-Realizability:** Passes **Swap Test** and **Natural Kindhood**, but doesn't guarantee **Causal Power**. A pattern can be realizable in many ways without having its own causal efficacy.

  ***

  # Thrown Out Candidates (From Brainstorm)

  Per your instruction, here are the candidate requirements from my initial brainstorm that did not make the final spec, and why they were cut:

  1.  **Unpredictability (Laplace):** Cut. Confuses computational difficulty with metaphysical indeterminacy. Rules out standard thermodynamics.
  2.  **Derivability (Weak):** Cut. Too technical for a journalistic filter; subsumed by Explanatory Autonomy.
  3.  **Explanatory Efficiency (Compression):** Cut. A macro explanation can be shorter but still just a summary of micro facts. Autonomy is the stronger bar.
  4.  **Observer Relativity:** Cut. Makes emergence subjective. A hurricane is emergent even if no one is there to model it.
  5.  **Context Dependence:** Cut. Subsumed by Dynamic Stability. All open systems depend on context.
  6.  **Counterfactual Support:** Cut. Too abstract for a quick newsroom check; covered by Causal Power/Autonomy.
  7.  **Irreducibility (Translation Failure):** Cut. Too linguistic. You can often translate between levels with enough effort; the point is whether you *should*.
