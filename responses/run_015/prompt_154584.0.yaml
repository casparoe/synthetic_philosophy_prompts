answer: |-
  # The Hyperprior Transparency Protocol (HTP)

  ## Preamble: Design Commitments

  This procedure is not a negotiation tool; it is a classification engine. It operates on the definitive premise that Aumann's Agreement Theorem holds for epistemic peers sharing a common prior, but fails where priors diverge over model classes or where the dispute is normative. To make this actionable within thirty minutes, I have made three definitive design choices that you must accept for the protocol to function:

  1.  **The Reversibility Test:** We distinguish empirical disagreements from normative ones solely by counterfactual swapping. If an agent would change their recommendation upon swapping their empirical beliefs with their peer's, the dispute is empirical. If they would not, it is normative. We do not probe the *origin* of the preference, only its sensitivity to evidence.
  2.  **Hyperprior Explicitness:** Agents cannot simply state posteriors. They must state the weight assigned to the generative model itself (e.g., "I assign 0.8 probability to linear dynamics"). Failure to quantify this weight defaults the classification to Type (ii) Divergence.
  3.  **Authority Split:** Procedural convergence (Type i) requires only the Chair's signature. Structural or normative divergences (Type ii and iii) require full Board agreement to prevent the Chair from unilaterally escalating value conflicts into empirical ones.

  ---

  ## The Protocol: A Thirty-Minute Flowchart

  **Session Timer:** 30 Minutes. Hard stop.
  **Participants:** Panel Chair, Two Disputing Peers (A & B).
  **Pre-Condition:** Both peers have submitted written position papers 48 hours prior.

  ### Step 1: The Normative Filter (Minutes 0–5)

  **Question:** "If you could magically guarantee the empirical outcome your opponent predicts, would you adopt their proposed course of action?"

  *   **Sufficient Answer:** A binary 'Yes' or 'No' from each peer, justified by a single sentence referencing the outcome, not the principle.
  *   **Judgment Call Flag:** Determining if the justification references *consequences* (empirical) or *intrinsic rightness* (normative). The Chair must rule this immediately. Do not debate the justification.
  *   **Branching:**
      *   If **Either** peer answers 'No': Classify as **Type (iii) Normative Framing**. Proceed to *Verdict C*.
      *   If **Both** answer 'Yes': Proceed to Step 2.

  ### Step 2: The Model Class Audit (Minutes 5–15)

  **Question:** "State the specific generative model class governing your prediction. Now, state your prior probability that *your* model class is the correct representation of reality versus your opponent's."

  *   **Sufficient Answer:** Explicit naming of the model (e.g., "Bayesian Linear Regression" vs "Agent-Based Simulation") and a numeric hyperprior (e.g., "I weight my model at 0.6, theirs at 0.4").
  *   **Judgment Call Flag:** Assessing whether the named models are genuinely distinct classes or merely parameterisations of the same class. The Chair decides. If the mathematical structure is isomorphic, they are the same class.
  *   **Branching:**
      *   If **Model Classes Match** but Hyperpriors on data reliability differ: Classify as **Type (i) Shared Model/Divergent Posteriors**. Proceed to Step 3.
      *   If **Model Classes Differ** (e.g., Linear vs Non-Linear): Classify as **Type (ii) Divergent Hyperpriors**. Proceed to *Verdict B*.

  ### Step 3: The Common Knowledge Check (Minutes 15–25)

  **Question:** "Given that you now know your peer's prior and model, can you update your posterior to match theirs, or does your private information prevent this?"

  *   **Sufficient Answer:** Identification of the specific private signal preventing agreement. If no private signal exists, they must agree to a weighted average of posteriors.
  *   **Judgment Call Flag:** Determining if 'private information' is genuine data or merely a restatement of the prior. The Chair rules.
  *   **Branching:**
      *   If **No Private Information**: Classify as **Type (i)**. Proceed to *Verdict A*.
      *   If **Private Information Exists**: Classify as **Type (i)** but deferred. Proceed to *Verdict A (Modified)*.

  ### Step 4: Verdict and Routing (Minutes 25–30)

  **Verdict A (Type i: Shared Model, Divergent Posteriors)**
  *   **Ruling:** Convergence Required. Peers must compute the weighted average of their posteriors based on shared priors.
  *   **Routing:** Matter referred back to researchers to implement the converged prediction.
  *   **Sign-off:** **Panel Chair alone.** This is a mathematical obligation under the common prior assumption.

  **Verdict B (Type ii: Divergent Hyperpriors over Model Classes)**
  *   **Ruling:** No Convergence Required. Transparency achieved, but priors differ.
  *   **Routing:** Escalated to External Arbiter (e.g., a senior methodologist) to adjudicate which model class is more robust for the specific context.
  *   **Sign-off:** **Full Board must agree.** This allocates resources to model validation.

  **Verdict C (Type iii: Normative Framing)**
  *   **Ruling:** Common Prior Assumption Inapplicable.
  *   **Routing:** Handed to Values Committee.
  *   **Sign-off:** **Full Board must agree.** This acknowledges a value conflict, not an error.

  ---

  ## Application to Cases

  ### Case 1: The Epidemiologists (Type ii Divergence)

  **Scenario:** Two epidemiologists disagree on ten-year vaccine efficacy. They share a statistical framework (Bayesian hierarchical models) but assign different prior weights to 'publication-bias models' versus 'genuine-effect models'.

  **Procedure Execution:**
  1.  **Normative Filter:** Both agree that if the efficacy were proven to be low (as one predicts), they would halt the programme. Both pass to Step 2.
  2.  **Model Class Audit:** Here lies the friction. While the *statistical engine* is the same, the *data-generating process model* differs. Peer A weights the 'Bias Model' at 0.7; Peer B weights the 'Genuine Effect Model' at 0.8.
  3.  **Classification:** Under the HTP, these are competing hyperpriors over the *structure of the evidence*, not just parameters within a single structure. This is classified as **Type (ii)**.
  4.  **Verdict:** No convergence required on the efficacy point estimate. The disagreement is structural regarding the reliability of the literature.
  5.  **Routing:** Escalated to External Arbiter (a meta-analyst) to determine the appropriate weighting of publication bias in this specific domain.
  6.  **Sign-off:** Full Board.

  **Critique:** This prevents the Chair from forcing a mathematical average on a dispute that is actually about the integrity of the scientific record, not the calculation.

  ### Case 2: The Philosophers (Type iii Divergence)

  **Scenario:** Two philosophers disagree on deception in a field study. One argues deception invalidates consent (Deontological); the other argues the knowledge gain outweighs the deceit (Consequentialist).

  **Procedure Execution:**
  1.  **Normative Filter:** Peer A is asked: "If the knowledge gain were guaranteed to be maximal, would you permit the deception?" Peer A answers 'No', citing the intrinsic violation of autonomy.
  2.  **Classification:** Immediate **Type (iii)**. The Reversibility Test fails.
  3.  **Verdict:** Common Prior Assumption Inapplicable. Epistemic peerhood does not mandate value alignment.
  4.  **Routing:** Handed to Values Committee.
  5.  **Sign-off:** Full Board.

  **Critique:** This stops the panel from wasting time trying to 'average' moral principles. It protects the deontologist from being outvoted by a utilitarian calculus masquerading as forecasting.

  ### Case 3: The Funding Committee (The Disliked Outcome)

  **Scenario:** The committee must choose between a suffering-reduction programme and a capability-building programme. Both sides claim to maximise a suffering-weighted utility function. Side A argues capability-building reduces suffering long-term (positive feedback loop). Side B argues it increases existential risk (negative feedback loop). You, the Chair, suspect this is actually a values dispute (autonomy vs. safety) masked as empirics.

  **Procedure Execution:**
  1.  **Normative Filter:** Both sides pass. They claim that if the empirical facts were swapped (i.e., if capability-building *did* reduce suffering), they would support it. They successfully mask their values as empirical beliefs.
  2.  **Model Class Audit:** Both use the same macro-sociological model class. They differ only on the coefficient of the feedback loop.
  3.  **Classification:** **Type (i) Shared Model/Divergent Posteriors.** The procedure accepts their self-reporting that this is an empirical dispute about causal loops.
  4.  **Verdict:** Convergence Required. The panel forces them to average their probability estimates regarding the feedback loop.
  5.  **Outcome:** The procedure recommends funding a hybrid programme based on the averaged probability of suffering reduction.

  **Why You Dislike This:**
  This outcome strips away the normative framing you hoped to preserve. By accepting the agents' claim that they share a utility function, the HTP treats a deep value conflict (risk-aversion vs. growth) as a resolvable forecasting error. The procedure forces a 'compromise' that may be ethically incoherent, simply because the agents were sophisticated enough to frame their values as empirical hyperpriors. The HTP prioritises procedural closure over deep ethical truth in this instance.

  ---

  ## Limitations and Override Conditions

  You must understand where this procedure fails. It is a tool for clarity, not a truth machine.

  **1. Misclassification of Value-Masquerading**
  The procedure cannot detect when agents dishonestly (or unconsciously) frame normative commitments as empirical hyperpriors (as seen in Case 3). The Reversibility Test relies on self-reporting. If an agent believes their value *is* a fact (moral realism), they will pass the Normative Filter incorrectly.
  *   **Consequence:** The panel will force convergence on value conflicts, producing ethically unstable compromises.

  **2. Sensitivity to Hyperprior Misreporting**
  If a peer inflates their confidence in their model class (e.g., claiming 0.99 certainty to block convergence), the Type (ii) classification triggers an External Arbiter. This can be gamified to delay decisions.
  *   **Consequence:** Strategic inflation of uncertainty creates bottlenecks requiring Board intervention.

  **3. The Isomorphism Judgment**
  In Step 2, the Chair must decide if two models are distinct classes or the same class with different parameters. This is a mathematical judgment call that can be contentious.
  *   **Consequence:** Disagreements about the procedure itself may consume the 30-minute limit.

  ### Override Conditions

  The Chair ought to override the HTP verdict under exactly two conditions:

  1.  **Existential Risk:** If the Type (i) Convergence Verdict recommends a course of action that violates the collective's safety charter, regardless of epistemic agreement. The Chair must veto and escalate to the Board immediately.
  2.  **Bad Faith Evasion:** If the Chair detects that peers are using the Hyperprior Transparency requirement to obfuscate rather than clarify (e.g., inventing complex model classes to avoid Step 3). The Chair may declare a **Type (iii)** classification unilaterally to force a Values Committee review.

  **Defence of Overrides:**
  I have assigned the override power to the Chair for safety, but required Board agreement for standard divergences. This balances speed with accountability. The procedure is designed to dissolve epistemic fog, not to legitimise ethical drift. When the procedure threatens the collective's core mission (safety or integrity), the procedure must yield to the charter.

  This protocol is now active. It will not comfort you when it misclassifies a value conflict as empirical, but it will ensure that when you do converge, you know precisely why.
