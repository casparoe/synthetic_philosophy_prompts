answer: |-
  This is a precise dissection of a doctrinal knot that often goes unnoticed. You are correct to separate the "collision" model of self-deception (simultaneous contradictory beliefs) from the "input-management" model (strategic evidence avoidance). The criminal law's practice of willful blindness (WB) is structurally incompatible with the collision model but relies heavily on the input-management model, even when its rhetoric suggests otherwise.

  Here is the reconstruction of the doctrine's presuppositions, organized by your questions.

  ### 1. Substitutive vs. Forfeiture: What the Practice Actually Requires

  The doctrine does **not** presuppose self-deception in the collision sense. In fact, the procedural requirements of the WB instruction actively rule it out.

  To give an ostrich instruction, courts generally require two predicates: (1) the defendant subjectively believed there was a high probability of the fact (conscious suspicion), and (2) the defendant took deliberate actions to avoid learning the truth.

  If the collision model were true (the defendant "knows deep down" while consciously believing otherwise), the first predicate would be unstable. If the knowledge is repressed or partitioned, the defendant cannot form the *conscious suspicion* required to trigger the duty to inquire. The law requires the defendant to be *aware of the risk* before they choose to look away. This describes an agent who successfully manages input to prevent a belief from crystallizing, not an agent who holds contradictory beliefs.

  **Which reading fits?**
  The **Forfeiture Reading** fits the logical shape of the practice; the **Substitutive Reading** fits the statutory language.

  *   **Statutory Constraint:** Most statutes require acting "knowingly." If the instruction told the jury, "The defendant did not know, but punish him anyway," it might violate the statutory text. So courts use Substitutive language ("you may find he knew") to satisfy the legislature.
  *   **Logical Coherence:** The distinction from negligence reveals the Forfeiture logic. Negligence is a failure of *capacity* or *attention* (you should have known). WB is a success of *will* (you ensured you didn't know). The law treats the *act of avoidance* as the culpable substitute for the *state of knowledge*.

  **Does this commit the law to a partitioned mind?**
  No. The Substitutive reading *sounds* like it commits the law to tacit knowledge (ontological equivalence), but this is a legal fiction. The law does not need to prove the knowledge existed "deep down"; it only needs to prove the *choice to remain ignorant* was made with the same culpable mindset as one who knows. The "partitioned mind" is unnecessary metaphysics; the "strategic ignorer" is sufficient.

  ### 2. Forfeiture Coherence and the Intent Problem

  Is the forfeiture reading coherent with instructions that say the element is "satisfied"? Yes, provided we understand legal elements as normative categories, not purely psychological descriptions. In criminal law, "knowingly" is a term of art that *includes* WB by definition. The instruction tells the jury how to apply the term, not how to perform psychology.

  **Does it extend to Purpose or Intent?**
  Generally, no. WB is almost universally restricted to *knowledge* elements (awareness of a circumstance or result), not *purpose* elements (conscious objective to cause a result).

  *   **Why the limit?** You can forfeit the right to claim ignorance of a *fact* (e.g., "there were drugs in the bag"). You cannot easily forfeit the requirement of a *volitional commitment* to a *goal*.
  *   **The Coherence Check:** If WB were pure forfeiture, why not apply it to intent? ("He didn't intend to kill, but he arranged not to form that intention.") The law resists this because intent requires a positive direction of the will toward a result. Avoidance is a negative direction (away from information). You can equate "avoiding knowledge of a fact" with "knowing the fact," but you cannot equate "avoiding the formation of an intent" with "having the intent." The latter collapses the distinction between recklessness and purpose.
  *   **Conclusion:** The forfeiture reading is coherent for knowledge because knowledge is a state that can be *prevented*. Intent is an action that must be *taken*. You can be punished for preventing the former; you cannot be punished for failing to initiate the latter without turning negligence into intent.

  ### 3. Intentionality, Causation, and the Regress

  The practice requires **intentional avoidance**, not merely causation. The deterrence rationale you mention (making investment in ignorance unprofitable) is the *policy goal*, but the *doctrinal mechanism* is the requirement of conscious suspicion.

  *   **Causation is insufficient:** If a defendant fails to learn a fact because they are anxious, distracted, or culturally conditioned to avoid certain topics, that is not WB. It might be negligence, or it might be exculpation. The law requires a specific *decision* to avoid confirmation.
  *   **The Regress Problem:** You ask about the agent who avoids learning that he is avoiding learning. The doctrine stops this regress at the point of **conscious suspicion**.
      *   The jury must find the defendant suspected the truth *before* the avoidance began.
      *   If the defendant was unaware of the risk until it was too late, they are merely negligent.
      *   If the defendant was aware of the risk but deceived themselves about *whether* they were avoiding it, the prosecution usually fails to meet the "deliberate steps" requirement.
  *   **Why this matters:** This confirms the Input-Management model. The law punishes the *management strategy*, not the *psychological success*. The regress bottoms out because the law demands evidence of a conscious trigger (the suspicion) that initiated the avoidance strategy. Without that trigger, there is no WB.

  ### 4. Presuppositions, Fit, and the Epistemological Gap

  **What the practice strictly presupposes:**
  1.  **Control:** Agents have voluntary control over their inquiry processes.
  2.  **Equivalence of Culpability:** The moral blameworthiness of choosing not to know (when suspicion exists) is equivalent to the blameworthiness of knowing.
  3.  **Normative Knowledge:** The legal term "knowingly" encompasses both the epistemic state of knowledge and the normative state of culpable ignorance.

  **What merely fits well (Underdetermined Theories):**
  *   **Deterrence:** Fits the policy, but doesn't explain the "conscious suspicion" requirement (deterrence might suggest punishing negligent ignorance too).
  *   **Attributivism:** Fits well. The ignorance is attributable to the agent's choices, so it counts as "theirs."
  *   **Norm of Inquiry:** This is the strongest fit. The doctrine implies a **duty to inquire** when risk is high. Violating this duty transforms the resulting ignorance from an excuse into a liability.

  **The Epistemological Gap:**
  You are right that analytic epistemology focuses on norms for *believing* (evidentialism, pragmatism). It rarely codifies norms for *not believing*. The WB doctrine exposes this gap. It operationalizes a specific norm: *If you have sufficient evidence to suspect $p$, you are epistemically obligated to seek confirmation.* Violating this norm creates "culpable ignorance." The law is doing work here that standard epistemology often ignores: it is judging the *process of belief-formation* (or prevention) rather than the *state of belief* itself.

  ### 5. The Skeptical Counterfactual: If Collision is Impossible

  Suppose the philosophers are right: self-deception in the collision sense is impossible, and there is no "tacit knowledge."

  **Would the practice collapse?**
  No. It would not collapse into negligence, nor would it vanish.
  *   **Not Negligence:** The distinction rests on *volition*, not epistemology. Whether the defendant "really knew" deep down is irrelevant. What matters is that they *acted* to prevent knowledge. That action remains distinct from carelessness.
  *   **Not Vanishing:** The deterrence and forfeiture rationales do not depend on the metaphysics of the mind. They depend on the behavior of avoidance.

  **What would change?**
  1.  **The Instruction:** The language would need to shift from ontological claims ("you may find he knew") to normative claims ("his conduct is equivalent to knowledge"). Currently, courts resist this because "equivalent to" sounds like negligence to lay juries. They prefer the fiction "he knew."
  2.  **The Justification:** We would have to admit the Substitutive reading is a fiction. The law would explicitly adopt the Forfeiture Reading: "You didn't know, but you aren't allowed to use that ignorance as a shield."
  3.  **Value Lost:** The primary loss is rhetorical and statutory. "Knowingly" is a powerful statutory hook. Admitting WB is a fiction weakens the claim that the statute is being followed literally. However, the *functional* value (punishing the smuggler who doesn't look in the bag) remains intact.

  **Summary Reconstruction:**
  The doctrine of willful blindness does not rely on the possibility of self-deception in the collision sense. It relies on the possibility of **strategic ignorance**. It treats the *violation of a duty to inquire* (triggered by conscious suspicion) as a **forfeiture of the ignorance defense**. The "knowledge" label is a statutory placeholder required to fit the conviction into the legislative framework, not a psychological claim about the defendant's mind. If collision-style self-deception is impossible, the doctrine survives by shedding its ontological pretensions and standing openly as a normative rule about the liability costs of motivated inquiry.
