          *   *Tension:* **Serious/Fatal.** C5 makes a normative leap. High $h^2$ means $V_E$ is low *relative* to $V_G$. It does *not* mean environments are "equal" in a normative sense (fairness), nor does it mean environmental *interventions* won't work (see C6). It also assumes we know environments are "equalized" independently of the $h^2$ estimate.
