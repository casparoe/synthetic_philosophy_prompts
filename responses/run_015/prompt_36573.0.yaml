      *   *Option C:* Qualify C2. (Necessary, but doesn't fix the normative leap in C5).
      *   *Selection:* C5 is the biggest liability. It makes a policy claim ("unfairness is no longer the dominant driver") that doesn't follow from $h^2$ even if environments are equalized. Equal environments could still be *bad* environments, or the remaining variance could be genetic but the *level* of the trait could be raised environmentally (Flynn).
      *   *Cost:* Losing the ability to argue that "we've done all we can environmentally."

  7.  **Refining the Tension Analysis (Self-Correction/Nuance):**
      *   *C2 vs C4:* Is it fatal? C2 says "order of magnitude." C4 says "limited power." If classical twins overestimate by 0.2, is 0.4-0.8 still right? Maybe 0.3-0.6. The *order* might hold, but the confidence is shaky. I should classify this as Serious but not Fatal, provided C2 is softened.
      *   *C5:* This is the real problem. "Environmental unfairness" is a normative term. $V_E$ shrinking doesn't mean unfairness is gone. It just means variance is gone. You can have a perfectly equal, deeply oppressive environment (low $V_E$, high $h^2$). Also, C5 implies that if $h^2$ is high, we shouldn't focus on env. C6 says we should/mcould. This is a direct contradiction in implication.
