          *   *Tension:* **Mild.** One is about current sources of variance (C5), one is about potential change (C6). But C5's language ("environmental unfairness is no longer the dominant driver") risks conflating variance explained with potential for improvement, which C6 warns against.
      *   *C3 vs. C5:* C3 admits massive environmental shifts (Flynn) can happen despite high $h^2$. C5 suggests high $h^2$ implies env doesn't matter much for inequality.
