      *   *C4:* Passive rGE is pervasive. Parents transmit genes + environment. Classical twin designs have limited power to separate this. (Critique of the methodology supporting C2).
      *   *C5:* As environments equalize, $V_E$ shrinks, so $h^2$ rises. High $h^2$ in equal-env society = evidence environmental unfairness is no longer dominant driver of inequality. (Normative/policy inference from $h^2$).
      *   *C6:* $h^2$ says nothing about malleability (PKU example). High $h^2$ $\neq$ immutable. (Standard caution).

  3.  **Identify Tensions/Interactions:**

      *   *C1 vs. C2:* C1 says it's a variance ratio in a population. C2 says it shows genetic causation at the *individual* level.
