      *   Trace load-bearing inferences? Yes.

  10. **Writing the Response:** (Iterative refinement of the text to ensure tone is direct and analytical). *Self-correction on C2:* C2 claims genetic causation at the individual level. This is technically distinct from variance. I need to make sure the audit notes that $h^2$ is about variance, but C2 claims it implies individual causation. This is generally accepted *if* additivity holds, but C4 challenges the estimation. I will focus the tension on the estimation method (C2 vs C4) and the normative inference (C5).

      *Wait, one more check on C5:* "I take this to mean that a high heritability estimate from a society with broadly equal environments is itself evidence that environmental unfairness is no longer the dominant driver of inequality in that trait there."
      *Critique:* Even if environments are equal (low $V_E$), inequality can still be driven by environmental *means* (Flynn) or GxE interactions. But the main issue is "unfairness." Low variance doesn't mean fair. Also, if $V_E$ is low, *current* inequality is genetic. But is "unfairness" the right word? Inequality driven by genetics isn't "unfair" in the distributive justice sense, but the commitment says env unfairness isn't the driver. That's actually logically consistent *if* environments are equal. The problem is knowing environments are equal. You can't infer equal environments *from* high heritability (that's circular). You need independent measure. The commitment says "from a society *with* broadly equal environments." So it assumes the premise.
