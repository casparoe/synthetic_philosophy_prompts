      *   Check the "thermostat" claim carefully. Panpsychism is a thing, but the article seems to be arguing for a functionalist gradualism which often gets accused of panpsychism. Need to clarify that distinction.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I initially thought about dismissing the thermostat claim entirely. But some functionalists do argue for a continuum. I should clarify that while *some* philosophers argue this, it's not the mainstream "graded sentience" view used in policy (which usually starts at vertebrates or cephalopods). The article conflates "feedback" with "sentience."
