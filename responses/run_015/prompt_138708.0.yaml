              1.  **Precautionary Principle:** If there's a non-negligible chance of sentience, act as if they matter.
              2.  **Dimensional Welfare:** Focus on specific harms (crowding, heat, slaughter methods) rather than abstract "sentience score."
              3.  **Defensibility:** This is actually *more* defensible than claiming a specific number.
      *   **Conclusion:** Encouragement. The uncertainty *is* the policy basis.

  7.  **Refining the Tone:**
