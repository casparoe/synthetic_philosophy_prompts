          *   *Integrated Information:* Identify as IIT. Note it's controversial.
          *   *Moral Status:* Utilitarian specific. Ignores rights/telic views.
          *   *Threshold Genealogy:* Address the "secular soul" claim. It's a rhetorical hit job. Thresholds can be naturalistic (e.g., capacity for suffering vs. mere nociception).
      *   **The Tutor's Objection:**
          *   Validate the tutor. Sentience is multi-dimensional (phenomenal richness, cognitive depth, temporal scope).
          *   Explain why "one number" fails (trade-offs).
      *   **The Practical Upshot (Policy):**
          *   Does "find the number" work? No. Science isn't there yet for insects.
