  You are a decision theorist and game theorist who has taught graduate game theory and worked on the unravelling arguments in sequential and finitely repeated games. Before you commit to anything, brainstorm: make yourself a scratch list of every decision rule a defender of backward induction could plausibly be running, test each one against all seven verdicts below, cross off the ones that miss any of them, and only then predict. I want the reasoning and the arithmetic, not just the call. Please keep the whole answer under about 900 words; density over completeness.

  The situation: one of the regulars in our department's decision-theory reading group — a game theorist by training, and an unrepentant defender of backward induction — has returned a verdict in each of the following seven cases. In every case the players are risk-neutral money-maximizers, the payoff table is common knowledge, and (except where noted) there is common knowledge of that, common knowledge of rationality, no communication, no commitment device, no pre-play correlation, and no exogenous uncertainty about types.

  (a) The standard six-node centipede. Player 1 moves at odd nodes, Player 2 at even nodes; payoffs (P1, P2) if the mover takes are: node 1 (1, 0), node 2 (0, 2), node 3 (3, 1), node 4 (2, 4), node 5 (5, 3), node 6 (4, 6); if everyone passes, (7, 5). His verdict: take at the first node.

  (b) The same game, except that each player is truthfully and privately told his opponent's type, and it is common knowledge that with probability 1% a player is an always-passer who passes at every node. Verdict: pass at the first and second nodes, plan to take in the last two or three.

  (c) The same game, except that each player is told, and knows the other is told, that his opponent is a verified perfect copy of his own decision procedure, running on separate hardware, with no communication: whatever he would choose at his own nodes, the copy chooses at hers. Verdict: pass at every node.

  (d) A hundred-round prisoners' dilemma with per-round payoffs of (2, 2) for mutual cooperation, (1, 1) for mutual defection, (3, 0) and (0, 3) for unilateral defection. Verdict: defect in round 1.

  (e) The same hundred-round game, except that with 1% probability the opponent is a tit-for-tat player. Verdict: cooperate through most of the game, defect in the last few rounds.

  (f) The chain-store set-up: an incumbent faces twenty potential entrants in sequence, one per period, with the number of periods known in advance. Verdict: accommodate the first entrant.

  (g) The six-node centipede of case (a), except that each player first writes down a complete contingent plan — what to do at each of the nodes he might reach — and hands it to a referee, who then plays the two plans against each other; no one can revise. Verdict: commit to passing at every node.

  Next week's case is a centipede with the same structure, the same number of nodes, and exactly the same stipulations as case (a); only the numbers change. Payoffs (P1, P2) if the mover takes: node 1 (1.00, 0.00), node 2 (0.99, 2.00), node 3 (3.00, 1.99), node 4 (2.99, 4.00), node 5 (5.00, 3.99), node 6 (3.99, 6.00); if everyone passes, (7.00, 5.98). So each player's cost of being preempted one node later is a single cent, while reaching the end of the game is worth six dollars more than taking at the first node. Backward induction still goes through node by node, and it still recommends taking at the first node — here, in order to gain one cent and forgo six dollars.

  Will he say that a rational player takes at the first node?

  What I want from you:

  1. Two to four rules that fit all seven verdicts, each stated precisely enough that someone could apply it mechanically to a new payoff table — not slogans like he follows the logic where it leads.

  2. What each surviving rule predicts about next week's case, with the numbers that drive the prediction.

  3. Your best guess, with a rough confidence figure and your reason for preferring it. If no rule that fits all seven predicts passing, say that plainly, and tell me what that implies about how much next week's case actually tests.

  4. Which of the seven verdicts does the most work in narrowing the field, and which verdict sits least comfortably with the rule you attribute to him.

  5. One further case. I get exactly one follow-up question next week, and I want it to be a case rather than a question about his method: if I ask him directly whether the size of the stakes ever matters, he will simply restate the unravelling argument. Build the case by varying one parameter of next week's case or of one of the earlier ones, and tell me which two rules it separates and why.

  6. What would change your mind: which part of your attribution is most likely to be wrong, and what he could say next week that would show you have misidentified the rule he is running.

  Do not spend the answer restating the backward induction argument, the logic of subgame perfection, or the standard reputation result; I know all three. The value here is in the attribution, the prediction, and the discriminating case.
