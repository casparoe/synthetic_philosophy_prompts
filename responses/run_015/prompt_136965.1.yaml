answer: |-
  ### The Logical Space of Analogical Cognition
  **A Taxonomy for the Reading Group**

  This taxonomy avoids theoretical labels in the branching questions. Instead, it defines the space via six concrete claims. A theoretical position (a "Leaf") is defined by its pattern of endorsement or rejection across these branches.

  #### The Branch Questions
  *Endorse (✓) or Reject (✗) each claim.*

  1.  **The Episodic Claim:** The core mechanism relies on the retrieval of a specific, stored prior episode (a source case) rather than the construction of a novel mapping from distributed weights or abstract schemas.
  2.  **The Structural Claim:** The content being mapped consists of explicit role-bindings (relational structure independent of objects) rather than global similarity in a learned vector space or sensorimotor affinity.
  3.  **The Reorganization Claim:** A system only counts as reasoning by analogy if the mapping reorganizes the target's category boundaries; fluent verbal labeling without category shift is insufficient.
  4.  **The Source-Specificity Claim:** Analogical transfer requires a single, identifiable source domain; "source-free" transfer (generalizing structure without a specific precedent) counts as induction or abstraction, not analogy.
  5.  **The Natural Kind Claim:** "Analogy" refers to a unified, singular cognitive mechanism (a natural kind) rather than a folk category covering several unrelated heuristics.
  6.  **The Algorithmic Claim:** The thesis is a claim about the actual algorithmic implementation (falsifiable by neural/weight inspection), not merely a computational-level description (compatible with any process that yields the same input/output).

  ---

  #### The Leaves (Theoretical Positions)
  *Eight to ten distinct positions carved from the logical space above.*

  **1. The Strong Identity Thesis**
  *   **Profile:** ✓ Episodic (broadly construed), ✓ Structural, ✓ Reorganization, ✗ Source-Specificity, ✓ Natural Kind, ✓ Algorithmic.
  *   **Description:** Categorization *just is* the retrieval of a prior situation. There is no boundary between "seeing a chair" and "seeing a situation as like a past situation." Every act of recognition is a micro-analogy.
  *   **Commitment:** If you recognize a friend's face, you are performing the same cognitive operation as solving *Aristotle is to Plato as Kant is to Hegel*.

  **2. The Structure-Mapping Position**
  *   **Profile:** ✗ Episodic (Constructive), ✓ Structural, ✓ Reorganization, ✓ Source-Specificity, ✓ Natural Kind, ✓ Algorithmic.
  *   **Description:** Analogy is a derived operation that operates over independently given structured representations. It is distinct from categorization (which is often similarity-based). It requires aligning two specific domains.
  *   **Commitment:** You can categorize without analogizing, but you cannot analogize without structured representation.

  **3. The Predictive Processing View**
  *   **Profile:** ✗ Episodic, ✗ Structural (Hierarchical Priors), ✗ Reorganization (Error Minimization), ✗ Source-Specificity, ✗ Natural Kind, ✓ Algorithmic.
  *   **Description:** The core cognitive engine is structure learning via error minimization. "Analogy" is merely a symptom of the system applying a high-level generative model to a new context.
  *   **Commitment:** There is no "analogy module"; there is only the brain minimizing surprise. Analogy is what we call it when the prior is distant.

  **4. The Embodied-Metaphor View**
  *   **Profile:** ✗ Episodic, ✗ Structural (Sensorimotor), ✓ Reorganization, ✗ Source-Specificity, ✓ Natural Kind, ✓ Algorithmic.
  *   **Description:** Mappings are grounded in sensorimotor schemas (e.g., balance, containment, force), not abstract symbols. Structure is the logic of the body, not logic proper.
  *   **Commitment:** You cannot understand "grasping an idea" without referencing the motor program for grasping an object.

  **5. The Deflationary Pluralist**
  *   **Profile:** ✗ Episodic, ✗ Structural, ✗ Reorganization, ✗ Source-Specificity, ✗ Natural Kind, ✗ Algorithmic.
  *   **Description:** The word "analogy" covers several unrelated mechanisms (similarity, retrieval, mapping, metaphor). There is no core. Searching for a unified theory is a category error.
  *   **Commitment:** We should eliminate the term from rigorous cognitive science or restrict it to narrow, context-specific definitions.

  **6. The Behavioral Equivalence (Deep Learning) View**
  *   **Profile:** ✗ Episodic, ✗ Structural (Vector Space), ✗ Reorganization, ✗ Source-Specificity, ✗ Natural Kind, ✓ Algorithmic.
  *   **Description:** A system (e.g., a Transformer) can pass every behavioral test for analogy via high-dimensional vector transformation without any analogical mechanism inside.
  *   **Commitment about Us:** If biological brains are sufficiently similar to these networks (functionally), then *humans* also do not analogize. We merely transform vectors. The "feeling" of analogy is a user-illusion generated by the interface.

  **7. The Modular Dissociationist (The Double Dissociation Case)**
  *   **Profile:** ✗ Episodic, ✓ Structural, ✗ Reorganization (for Categorization), ✓ Source-Specificity, ✓ Natural Kind, ✓ Algorithmic.
  *   **Description:** Analogy and Categorization are distinct faculties supported by separable neural substrates.
  *   **Evidence Case:** This position is necessitated by a double dissociation:
      *   *Subject A:* Can reliably categorize objects within familiar domains (e.g., "this is a cup") but fails to transfer relations across domains (e.g., cannot solve *hot:cold :: hard:?*).
      *   *Subject B:* Maps relations exuberantly across domains (solving complex proportional analogies) but has sliding category boundaries that cause mislabeling of ordinary objects (e.g., calls a bowl a "hat" because both sit on heads).
  *   **Commitment:** A unified theory (like the Strong Identity Thesis) is falsified by the possibility of breaking these abilities independently.

  **8. The Source-Free Abstractionist**
  *   **Profile:** ✗ Episodic, ✓ Structural, ✓ Reorganization, ✗ Source-Specificity, ✓ Natural Kind, ✓ Algorithmic.
  *   **Description:** Structure transfer is real and distinct from similarity, but it does not require retrieving a specific source episode. It operates on abstracted schemas built from many instances.
  *   **Commitment:** You can analogize without remembering *where* you learned the structure. This distinguishes it from Structure-Mapping (which requires a source) and Predictive Processing (which denies the distinctness of the operation).

  **9. The Dual-Process Hybrid**
  *   **Profile:** ✓ Episodic (Slow) / ✗ Episodic (Fast), ✓ Structural (Slow) / ✗ Structural (Fast), ✓ Reorganization (Slow), ✗ Source-Specificity (Fast), ✗ Natural Kind, ✓ Algorithmic.
  *   **Description:** There are two mechanisms. Fast, vector-based "analogy" (similarity) handles routine cognition. Slow, symbolic "analogy" (mapping) handles novel problem solving.
  *   **Commitment:** The debate is verbal; both sides are describing half of the elephant.

  **10. The Pragmatic Contextualist**
  *   **Profile:** ✗ Episodic, ✗ Structural, ✓ Reorganization, ✗ Source-Specificity, ✗ Natural Kind, ✗ Algorithmic.
  *   **Description:** Whether a process counts as "analogical" depends on the goal of the observer/system, not the mechanism. It is defined by use, not structure.
  *   **Commitment:** The same vector operation is "categorization" in one context and "analogy" in another, depending on the distance between the domains.

  ---

  #### Empty Regions of the Space

  *   **Region A (Incoherent):** Endorsing **The Episodic Claim** (Retrieval of stored episode) while endorsing **✗ Source-Specificity** (Source-free transfer).
      *   *Reason:* You cannot retrieve a specific episode and claim there is no specific source. These are logically contradictory.
  *   **Region B (Merely Unattractive):** Endorsing **✓ Structural Claim** (Explicit role-bindings) while rejecting **✓ Reorganization Claim** (Labeling is sufficient).
      *   *Reason:* If you posit the computational cost of explicit role-bindings, but the system never uses them to reorganize categories (only to label), the mechanism is functionally otiose. It solves nothing that vector similarity couldn't.
  *   **Region C (Unclaimed):** Endorsing **✓ Episodic Claim** + **✓ Sensorimotor (via Structural Claim negation)** + **✓ Source-Specificity**.
      *   *Reason:* This implies "I retrieve a specific past bodily movement to map to this specific new bodily movement." While possible in motor learning, no major theory claims this is the core of *conceptual* analogy.

  #### Indistinguishable Leaves

  **The Predictive Processing View (Leaf 3)** and **The Source-Free Abstractionist (Leaf 8)** are difficult to pry apart in this taxonomy.
  *   **Reason:** Both deny the need for a specific retrieved source episode (✗ Episodic) and both deny strict Source-Specificity. Both view the process as generative. The distinction rests on whether "structure learning" (Leaf 3) is identical to "schema abstraction" (Leaf 8). Without a branch question specifically targeting *error minimization vs. schema instantiation*, these two leaves collapse into the same region of the logical space (✗ Episodic, ✗ Source-Specific, ✓ Structural-ish). To separate them, one would need to ask: *Is the driving force the reduction of prediction error or the alignment of relational slots?*
