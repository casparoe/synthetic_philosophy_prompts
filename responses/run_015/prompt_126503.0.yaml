  *(Refining the Equilibrium)*: If everyone misleads, literal truth becomes noise. If everyone lies, literal truth becomes a binary signal (True/False) but verification is high. Actually, widespread misleading is worse because it makes *interpretation* costly, not just verification. You have to model the speaker's model of you. Lying just requires fact-checking. Misleading requires game-theoretic recursion. This increases cognitive load significantly.

