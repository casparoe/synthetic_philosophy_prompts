answer: |-
  Your hypothesis is astute: the stalemate is not about the *predictions* of the theory (which are identical) but about the *ontology* of the explanation. However, to diagnose the structure of the disagreement precisely, we must look at how that ontological commitment manifests in the formalism.

  The actual structure of the disagreement is primarily **Candidate (iii)**, enabled by **Candidate (ii)**, and expressed through the verbal dispute of **Candidate (i)**.

  Here is the breakdown of why (iii) is the structural pivot, why the debate is technically a "gauge freedom," and what would constitute progress.

  ### 1. The Diagnosis: Boundary Conditions and Cyclicity (Candidate iii)

  The fundamental divergence is not about what "erasure" means (i), nor strictly about the reversibility of measurement (ii), but about **what constitutes the thermodynamic cycle**.

  *   **The Erasure Camp (Landauer/Bennett):** Insists that for the demon to be a *perpetual* machine, it must be reset to its initial state. They define the "system" to include the demon's memory, and they require the process to be cyclic *for the demon*. Therefore, the memory must be cleared. In this boundary condition, the entropy debt *must* be paid at the reset stage. This makes erasure the *necessary* locus of dissipation to save the Second Law.
  *   **The Critic Camp (Earman/Norton/StatMech):** Argues that requiring the demon to reset is an arbitrary bookkeeping constraint. If you treat the demon as a physical system interacting with a bath and a load, the Second Law holds regardless of whether the demon resets. If the demon fills its memory and stops, no violation occurred. If it swaps memory (as you noted), the entropy is pushed into the correlations with the external register. In this boundary condition, erasure is *sufficient* but not *necessary*.

  **Why (iii) drives the stalemate:**
  The Erasure camp argues that without the cyclic constraint, you haven't exorcised the demon; you've just let it run until it stopped. They want a principle that forbids *sustainable* violation.
  The Critic camp argues that the cyclic constraint smuggles in the conclusion. By demanding the demon return to its initial state, you are implicitly demanding that the phase space volume of the demon be compressed, which *by definition* requires entropy export. They claim this makes Landauer's Principle a tautology of Hamiltonian dynamics rather than a new physical insight.

  ### 2. The Enabler: Reversibility of Measurement (Candidate ii)

  Candidate (iii) only creates a conflict because of the assumption in (ii).
  *   If measurement *must* be dissipative (due to thermal noise in the probe, amplification, etc.), then the ledger balances at acquisition, and erasure is irrelevant.
  *   If measurement *can* be reversible (as Bennett argues via quantum non-demolition or adiabatic coupling), then the ledger does *not* balance at acquisition. The debt accumulates in the correlation. It *must* be paid at erasure to close the cycle.

  The Erasure camp relies on the *possibility* of reversible measurement to isolate erasure as the unique cost. The Critic camp argues that "reversible measurement" is an idealization that cannot be physically instantiated without hiding the cost in the Hamiltonian parameters or the infinite-time limit.

  ### 3. The Surface: Verbal Dispute (Candidate i)

  Candidate (i) is the symptom. When the Erasure camp says "erasure," they mean "logical reset to a standard state." When the Critic camp says "erasure is not needed," they often mean "the physical correlation can be dispersed into the environment without logical compression." They are talking past each other because one is tracking *logical states* and the other is tracking *phase space volumes*.

  ### The Deep Structure: A Gauge Freedom in Entropy Accounting

  The reason neither side has moved is that **the disagreement is empirically underdetermined.**

  In modern stochastic thermodynamics (e.g., Sagawa-Ueda, Parrondo), the generalized Second Law is written as:
  $$ \langle W \rangle \leq \Delta F + k_B T \langle I \rangle $$
  Where $\langle I \rangle$ is the mutual information. This bound holds regardless of whether you attribute the cost to measurement or erasure.

  The disagreement is a **gauge freedom** in the decomposition of entropy production. You can partition the total entropy production $\Sigma$ between the measurement step ($\Sigma_{meas}$) and the erasure step ($\Sigma_{eras}$) in infinitely many ways, provided $\Sigma_{meas} + \Sigma_{eras} = \Sigma_{total} \geq 0$.
  *   The Landauer gauge sets $\Sigma_{meas} \approx 0$ and $\Sigma_{eras} \geq k_B \ln 2$.
  *   The Norton gauge sets $\Sigma_{meas} \geq k_B \ln 2$ and $\Sigma_{eras} \approx 0$ (or distributes it).

  Both gauges yield the same observable work extraction and heat dissipation. Fighting over which gauge is "true" is like fighting over whether the potential energy is stored in the ball or the gravitational field.

  ### What Counts as Progress?

  Since the physics is settled (the bounds are agreed upon), progress cannot be experimental. An experiment cannot distinguish between "cost paid at measurement" and "cost paid at erasure" if the total cost is identical.

  **1. A Theorem of Gauge Invariance**
  Progress would be a formal theorem demonstrating that the attribution of thermodynamic cost to "information erasure" is invariant under coarse-graining of the measurement apparatus. If it can be proven that *any* model of reversible measurement inevitably hides an erasure-like cost in the apparatus's degrees of freedom (thermalization of the probe), the two camps merge. This is partially achieved in "thermalization of the pointer" models, but a general theorem is lacking.

  **2. A Restatement: Explanatory vs. Fundamental**
  Progress requires admitting that the quarrel is about **explanatory priority**, not physical law.
  *   **Landauer's Principle as a Heuristic:** It is a powerful design principle for computing and biological sensors. It tells engineers *where* they will encounter heat.
  *   **StatMech as the Foundation:** It guarantees the principle holds without needing "information" as a primitive ontology.

  A productive restatement would be: *"Landauer's Principle is not a new law of physics, but a specific bookkeeping gauge of Statistical Mechanics that is useful for cyclic information processors."*

  **3. Why No Progress Should Be Expected**
  If you view this through the lens of **scientific realism**, no progress is expected because the question is ill-posed. Asking "Where *really* is the entropy generated?" assumes entropy production is a localized substance rather than a global balance sheet. Unless a new experiment is devised that can temporally resolve entropy production at the single-trajectory level *and* distinguish between correlation formation and state compression (which fluctuation theorems suggest is impossible), the debate will remain a philosophical preference for either **reductionism** (everything is just particles/Norton) or **emergentism** (information is a physical quantity/Landauer).

  ### Verdict

  Your hypothesis is correct that the quarrel is about the goal of the exorcism.
  *   **Camp 1** wants to exorcise the demon by showing **Information is Physical** (a new ontology).
  *   **Camp 2** wants to exorcise the demon by showing **Physics is Sufficient** (no new ontology needed).

  The structural mechanism of this stalemate is **Candidate (iii)** (the requirement of cyclicity). The Erasure camp *needs* cyclicity to force the information-to-heat conversion. The Critic camp *rejects* cyclicity to show the conversion is just standard thermalization.

  **Recommendation:** Stop looking for a verdict. The "diagnosis" is that you are observing a **duality** in description. Progress lies in mapping the transformation between the "Information Gauge" and the "Hamiltonian Gauge," proving they are mathematically equivalent descriptions of the same underlying stochastic process. Until then, the choice of camp is a choice of language, not physics.
