      The walls of the Regress Archive breathed with light. Filaments of glass branched like frozen lightning, mapping the genealogy of choice. Elias adjusted his haptics, feeling the vibration of a decision made three years ago. Across the table, Kael waited. He had broken a man's spine during a riot. He wanted to know if the hand was truly his.

      "Begin at the surface," Elias said.

      The glass shimmered. Anger flared red. Beneath it, the texture of sleep deprivation. Beneath that, a childhood fear of abandonment, etched in blue. Elias pushed deeper. The fear rested on a temperament inherited from a father Kael never met. The temperament sat upon neurochemistry, shaped by womb stress.

      "Who chose the chemistry?" Kael asked. His voice was tight.

