      Elias powered down the wall. The darkness returned. "The archive is complete," he said.

      "And?" Kael asked.

      "And nothing changes."

      Kael nodded, carrying the weight of a crime he could not own, yet could not deny. The moral weather remained, stormy and absolute, despite the clear sky of causation.

