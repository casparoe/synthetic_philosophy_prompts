  5.  **Address the "Attention-Head Activations" Condition:**
      *   If we grant functional role (attention heads track counterfactuals), does the slogan survive?
      *   If functionalism holds, the Mechanistic and Epistemic readings crumble. The Teleological reading remains but becomes irrelevant. The Causal reading remains the strongest holdout.

