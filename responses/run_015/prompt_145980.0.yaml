  My gut says some of this is too neat, especially the stuff about the coin and about disagreement, and I'm suspicious of defining confidence as a betting price because I'm pretty risk-averse and would pay way less than I actually believe. But my gut is not worth much here. Could you go through it more or less sentence by sentence and tell me what someone who actually works on this would accept, what they'd wince at, and what's just wrong — and whether that last critical point really does knock the whole thing down, or whether the rest survives it? Also, sry if this is a tangent, but the case I actually want to write about is one where the bets are offered one at a time over a week and the person's confidence drifts a bit in between: is that still the same argument, or is it a different one with different assumptions?
