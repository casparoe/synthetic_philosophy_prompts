      *   *Criterion 2: Intrinsic vs. Instrumental.* Maimonides distinguishes laws for intellect/morality vs. laws for social order/discipline. Where does sacrifice fit? (Motivation: If purely instrumental, does it vanish when the instrument isn't needed?)
      *   *Criterion 3: Substitutability.* Prayer replaces sacrifice when Temple is down. Does this mean they are equivalent in value? (Motivation: If prayer is *better*, why sacrifice at all? If sacrifice is *better*, why allow prayer?)
      *   *Criterion 4: Distinction between Institution and Rationale.* Why instituted vs. why binding. (Motivation: Avoiding the genetic fallacy).
      *   *Criterion 5: Prophecy and Divine Law Structure.* Some laws address human weakness (Necessities), some address perfection (Virtues). (Motivation: Consistency with his political theology).
      *   *Criterion 6 (Specific):* Scope of Concession. Is the *act* the concession, or the *timing*? Would an ideal community keep it? (Motivation: The core of the user's specific request).

