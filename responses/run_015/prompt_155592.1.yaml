  2.  **Deconstruct the Philosophical Problem:**
      *   *Guide III:32:* Sacrifice is a concession. God wanted prayer/worship of the heart, but people were used to sacrificing to idols. So He transferred the practice to His name to wean them off idolatry.
      *   *Mishneh Torah (Hilkhot Temidin u-Musafin, etc.):* Detailed laws of sacrifice presented as binding divine law for the Messianic era (implied by the rebuilding of the Temple). No hint there that it's "second best."
      *   *The Tension:* If it's a concession to weakness, why is it law in the ideal future? If it's ideal law, why call it a concession to idolatry?
      *   *Key Maimonidean Concepts:* Ta'amei ha-Mitzvot (reasons for commandments), Chukim vs. Mishpatim, Prophecy, Hierarchy of Perfection (moral -> intellectual), Divine Wisdom vs. Human Intellect.

  3.  **Drafting the Desiderata (Criteria):**
