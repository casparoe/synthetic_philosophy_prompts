      *   *Tension:* "Normative Permanence" (Mishneh Torah) vs. "Historical Contingency" (Guide III:32).
      *   *Specific Conflict:* If the law is truly ideal (Mishneh Torah), it shouldn't be based on a defect (Guide). If it's based on a defect (Guide), it shouldn't be ideal (Mishneh Torah).
      *   *User's Suspicion:* "Complete reconciliation with normative legal texts" vs. "No residual normative weight for the sacrificial form itself." I need to validate and refine this. It's essentially the tension between *Legal Realism* (the law is what it is) and *Philosophical Rationalism* (the law must make sense).

  5.  **Scoring the Strategies:**
      *   *Pure Accommodationist:* Great on *Guide*, terrible on *Mishneh Torah* (makes future sacrifice look like a regression).
