      *   **Problem:** The tension between the "accommodationist" reading (sacrifice as a historical concession to idolatry) and the "symbolist/functionalist" reading (sacrifice as having permanent spiritual/communal value). The user notes that neither camp fully reconciles the *Guide*'s genetic explanation with the *Mishneh Torah*'s normative codification.
      *   **Task:**
