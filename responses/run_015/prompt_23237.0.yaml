  ***

  **MEMORANDUM**

  **TO:** IRB Committee Members
  **FROM:** [Your Name], Vice-Chair
  **DATE:** October 23, 2023
  **SUBJECT:** Procedural Decision: Voting Mechanism for Contested Protocols

  **Purpose**
  By this Friday, we must finalize the voting procedure for contested animal-protocol cases. Specifically, we must decide between (A) simple majority rule among the seven voting members or (B) deferral to the Chair's recommendation in the event of a deadlock. This memo evaluates the argument recently advanced in favor of Option A, based on the Condorcet Jury Theorem (CJT), and offers a recommendation.

  **The Argument for Majority Voting**
  The case for simple majority voting has been grounded in the Condorcet Jury Theorem. The strongest version of this argument is compelling: if every committee member is more likely than not to be "correct" (competence > 50%) and votes independently, the probability that the majority decision is correct approaches 100% as the group size increases. On this view, the committee is a truth-seeking engine, and majority rule statistically maximizes our accuracy compared to a single decision-maker.

  **Limitations of the Theorem in This Context**
  While mathematically sound, the CJT relies on assumptions that do not hold in an IRB deliberation context. Relying on it to *justify* majority rule is therefore problematic for three concrete reasons:

  1.  **Independence:** CJT requires votes to be statistically independent. IRB members, however, deliberate together. We hear the same presentations, are influenced by the same Chair, and share a common institutional culture. When votes are correlated (i.e., we sway one another), the "wisdom of the crowd" effect diminishes drastically. A group of seven correlated voters is not statistically superior to a single expert in the way CJT predicts.
  2.  **Binary Truth:** CJT assumes a binary outcome where one answer is objectively "correct" (e.g., guilty vs. innocent). Animal protocol review is normative, not factual. There is rarely a single "correct" ethical answer; rather, there are defensible balances of risk, benefit, and the 3Rs (Replacement, Reduction, Refinement). The theorem cannot identify ethical correctness, only the aggregation of individual probabilities.
  3.  **Group Size:** The theorem's power is asymptotic. With only seven members, the statistical advantage of the majority over a single competent voter is marginal unless individual competence is exceptionally high.

  **Recommendation**
  Despite the inapplicability of the Condorcet Jury Theorem, **I recommend we adopt Simple Majority Voting (Option A).**

  We should reject the *mathematical justification* offered, but accept the *procedural outcome*. The legitimacy of an IRB does not rest on statistical accuracy, but on **collective responsibility** and **regulatory compliance**. Federal guidelines (e.g., PHS Policy, USDA Animal Welfare Act) envision the IRB as a deliberative body, not an advisory group to a single decider. Deferral to the Chair (Option B) concentrates ethical liability and undermines the committee's regulatory mandate. We should vote by majority not because the math guarantees we are right, but because the process ensures we are accountable.

  **Timeline**
  To meet the Friday deadline, I propose the following schedule:
  *   **Thursday, 2:00 PM:** Special convened meeting to discuss this memo.
  *   **Thursday, 3:00 PM:** Formal vote on adopting Simple Majority Voting.
  *   **Friday, 9:00 AM:** Notification of procedure to the research office.

  Please review this analysis prior to Thursday. I look forward to a robust discussion.
