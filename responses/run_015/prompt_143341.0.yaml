answer: |-
  **MEMORANDUM**

  **TO:** Debate Invitational Committee
  **FROM:** [Your Name]
  **DATE:** January 15, 2024
  **SUBJECT:** Protocol for Transatlantic Terminology (March Tournament)

  **The Issue**
  Last March, we faced a significant judging discrepancy when a German team used "liberalism" in the classical European sense (free markets, state neutrality) while American judges interpreted it through the US progressive lens (welfare state, regulation). This semantic gap cost the team two rounds and created friction regarding judging fairness. As we prepare for the upcoming tournament, we must decide how to handle terminology that carries divergent cultural meanings.

  **Options Considered**
  1.  **Prohibition:** One member proposes banning contested terms entirely, requiring specific policy labels (e.g., "single-payer" instead of "liberal reform").
      *   *Pros:* Eliminates ambiguity.
      *   *Cons:* It strips debate of necessary theoretical depth. As noted in our last meeting, terms like "liberalism" do more than list policies; they signal a stance on *why* coercion requires justification and the state's role in neutrality between conceptions of the good life. Banning the word prevents teams from debating that philosophical framework.
  2.  **Status Quo:** Rely on judges to infer meaning from context.
      *   *Cons:* Repeats last year's error. It places the burden on the listener to resolve ambiguity rather than the speaker to create clarity.

  **Recommendation: The "Early Stipulation" Protocol**
  I recommend we adopt a procedural rule requiring teams to define contested transatlantic terms within their first minute of construction, paired with updated judging guidelines.

  **The Rule:**
  If a team intends to use a term with known divergent meanings (e.g., "liberal," "socialist," "freedom"), they must explicitly stipulate their definition in their opening constructive.

  **Judging Guidance:**
  *   **Consistency over Correctness:** Judges are instructed not to vote based on which definition is "true" or familiar. They must evaluate whether the team adhered to *their own* stipulated definition consistently.
  *   **Penalizing Confusion:** If a team fails to define the term and ambiguity arises, the penalty is for *clarity*, not semantics. The burden remains on the speaker to ensure they are understood.
  *   **Preserving Meta-Debate:** This rule does not freeze a single definition. Teams are still free to argue that a term is essentially contested or that their opponent's definition is strategically incoherent. However, they must first establish what *they* mean by it.

  **Why This Works**
  This approach balances clarity with intellectual freedom. It prevents the "silent mismatch" that occurred last year without sanitizing the theoretical language that makes debate valuable. It acknowledges that while policy bundles may flip across the Atlantic, the underlying philosophical arguments about state neutrality remain shared ground—if both sides know which map the other is using.

  **Bottom Line & Timeline**
  **Decision:** Adopt the "Early Stipulation" Protocol for all March tournament rounds.
  **Action Item:** We will update the Judge Training Manual and Distributor Packet by **February 1st**. This gives teams ample time to adjust their construction strategies before the invitational.

  Please review and confirm by Friday so we can finalize the judge training materials.
