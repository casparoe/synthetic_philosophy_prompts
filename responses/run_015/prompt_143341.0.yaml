      *   The memo needs to advocate for *clarity without prohibition*. Banning the word loses theoretical depth (the "stance about coercion" point). Rigidly defining it privileges one worldview.
      *   The best path is a "Define Early, Judge Fairly" protocol.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the problem clearly (the German team incident) and the stakes (fairness, educational value).
