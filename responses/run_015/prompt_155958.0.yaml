          *   This explains #6: It fails Truth (creates suffering), but passes Utility (gives tools).
          *   This explains #1: Fails Truth (contagion), Fails Utility (no treatment needed if it's just mimicry).
          *   This explains #3: Passes Truth (biology), Fails Utility (destroys life), but Truth wins for inclusion (safety/medical necessity).

  4.  **Drafting the Response:**

      *   **Acknowledge the difficulty:** This is the central tension of psychiatric ontology (Kendler, Hacking, Cooper).
      *   **Propose the Framework:** "The Anchor and the Lever."
          *   *The Anchor (Epistemic):* What holds this down outside the book? (Biology, External Event, Functional Breakdown).
          *   *The Lever (Pragmatic):* What can we pull with this label? (Treatment, Accommodation, Community).
      *   **Map the Cases:**
          *   1 (Drift): No Anchor (viral script), No Lever (it's mimicry). -> **Exclude.**
          *   2 (Operator): Anchor (The war/missions happened), Lever (Validation/Trauma care). -> **Include.** (Distinguishes from #1: The trauma is external/factual, not just internal feeling).
          *   3 (Thibault): Anchor (Protein), Lever (Medical management). -> **Include.** (Anchor is strong enough to override harm).
          *   4 (Victorian): Anchor (Text), Lever (None/Historical curiosity). -> **Exclude from clinical manual** (It's history, not medicine).
          *   5 (Identity): Anchor (Behavioral pattern), Lever (Community/Support). -> **Include.** (Looping is the mechanism of stability).
          *   6 (App): Anchor (Relational breakdown), Lever (Awareness). -> **Include.** (The suffering is the cost of the Lever).
      *   **Address the Undecideds:**
          *   (a) Presymptomatic Risk: Fails Anchor (nothing exists yet), Fails Lever (can't treat nothing). *Prediction: MC argues against it.*
          *   (b) Insurance Code: Fails Anchor (no pathology), Passes Lever (money). *Prediction: MC argues it corrupts the manual.*
      *   **Address the "Drop a Verdict" constraint:**
          *   Case #4 (Victorian) is the weak link. A diagnostic manual is for *living* patients. Retrospective diagnosis is historically interesting but clinically useless. The MC should dismiss this as "parlor games," not science.
          *   Case #6 is the most ethically fraught. If the principle is "Do no harm," #6 is suspect. But if the principle is "Agency," #6 stands. I will advise the user to keep #6 but make the MC acknowledge the cost.
      *   **Scene Work:** How to say this? "We aren't naming ghosts. We're naming chains." Or "Does the label find the fire, or does it light the match?"

  5.  **Refining the Dialogue Logic:**
      *   The MC needs to distinguish between *Contagion* (Case 1) and *Recognition* (Case 2).
      *   Key distinction: **Specificity of Symptoms vs. Specificity of Cause.**
      *   Case 1: Symptoms are too specific to the *description* (mimicking the video).
