answer: |-
  This is a classic problem in the philosophy of psychiatry (Kendler, Hacking, Cooper), and you've intuitively grasped the hardest part: the line between *harmful suggestion* (contagion) and *helpful recognition* (validation).

  Your current rule ("suffering must pre-exist") fails because psychiatry isn't just about stopping pain; it's about **agency**. Sometimes a label *creates* pain to give you the tools to stop it. Sometimes a label *stops* pain by revealing it was fake.

  Here is a framework you can put in your character's mouth. It splits the question into two distinct votes: **Ontological** (Is this a thing?) and **Pragmatic** (Does putting it in the book help?).

  ### The Principle: "The Anchor and The Lever"

  Tell your MC to argue that a diagnosis deserves a code only if it satisfies **The Anchor** OR **The Lever**, but never if it fails both.

  **1. The Anchor (The Epistemic Test)**
  *Definition:* Is there evidence of this condition that exists *independent* of the patient knowing the label?
  *   *Biological Anchor:* A marker, a lesion, a gene (Thibault's).
  *   *External Event Anchor:* A verifiable trauma or stressor that happened regardless of the diagnosis (Operator's).
  *   *Behavioral Anchor:* Observable functional breakdown measurable by third parties (App/Relational).
  *   *Why it exists:* To rule out pure contagion/mimicry.

  **2. The Lever (The Pragmatic Test)**
  *Definition:* Does applying this label grant the patient access to resources, community, or interventions they couldn't access before?
  *   *Why it exists:* To allow "Interactive Kinds" (looping kinds) that are socially constructed but functionally necessary (e.g., the App diagnosis, or identity-based cohorts).

  **The Rule for the Committee:**
  > "If it has an Anchor, it goes in, even if it hurts (Thibault's). If it has a Lever, it goes in, even if it's constructed (The App). If it has neither—if it's just a story people tell because they heard the story—it stays out (Drift)."

  ---

  ### Mapping Your Cases to the Principle

  Here is how your MC justifies her gut instincts using this framework in dialogue.

  **1. Adolescent Depersonalization Drift (Vote: NO)**
  *   **Analysis:** Fails Anchor, Fails Lever.
  *   **Dialogue Logic:** "There is no biological marker. There is no external stressor distinct from the viral videos themselves. The symptoms mimic the *vocabulary* of the videos, not a distinct physiological state. It's pure contagion. We would be medicalizing a meme."
  *   **Verdict:** Consistent with your gut.

  **2. Operator's Residual Witness Reaction (Vote: YES)**
  *   **Analysis:** Passes Anchor (External Event).
  *   **Why it isn't Case #1:** In Case #1, the *symptoms* were copied from a script. In Case #2, the *cause* is verifiable (flight logs, mission records). The patients didn't learn the symptoms from a documentary; they learned there was a *name* for the pain they already had.
  *   **Dialogue Logic:** "The trauma is in the server logs, not just the patient's head. The documentary didn't create the war; it just gave the veterans a way to file a claim. That's an External Event Anchor."
  *   **Verdict:** Consistent with your gut. This fixes your worry about it being "Case 1 with a different population."

  **3. Thibault's Disease (Vote: YES)**
  *   **Analysis:** Passes Anchor (Biological).
  *   **Dialogue Logic:** "The protein doesn't care about the manual. The social destruction is a policy failure, not a diagnostic one. We don't hide cancer because a diagnosis ruins a marriage."
  *   **Verdict:** Consistent with your gut.

  **4. Victorian Diarist (Vote: NO / "Historical Note")**
  *   **Analysis:** Passes Anchor (Textual evidence), Fails Lever.
  *   **Dialogue Logic:** "This is history, not medicine. We can't treat the dead. Putting this in the manual implies we can diagnose the living based on this retroactive template, which is dangerous. It validates the *human experience*, but it doesn't validate a *clinical code*."
  *   **Verdict:** **This is the one you should drop or reframe.** It feels "cheaper" to you because clinically, it *is* useless. Have her argue it belongs in an appendix or a journal article, not the diagnostic manual. It strengthens her rigor to reject it.

  **5. Childhood Cohort / Identity Drift (Vote: YES)**
  *   **Analysis:** Passes Lever (Community/Support).
  *   **Dialogue Logic:** "Yes, the behavior changes when we name it. That's the point. The label acts as a scaffold. They are building a life around the diagnosis, and that life is more functional than the one before. The looping *is* the treatment."
  *   **Verdict:** Consistent with your gut.

  **6. Therapy App / Relational Depletion (Vote: YES)**
  *   **Analysis:** Fails Anchor (no prior suffering), Passes Lever (Agency).
  *   **Dialogue Logic:** "You're worried because the app creates the misery. But before the app, they were just 'failing at relationships' with no idea why. Now they have a metric. The suffering is the cost of the clarity. We give them the Lever to fix the depletion."
  *   **Verdict:** Consistent with your gut.

  ---

  ### Predictions for Your Undecideds

  Here is what this principle forces your MC to say about the two plot points you haven't decided.

  **(a) Presymptomatic Risk Score Diagnosis**
  *   **Prediction:** **MC Argues NO.**
  *   **Reasoning:** Fails Anchor (no pathology exists yet, only probability), Fails Lever (no intervention possible yet).
  *   **Dialogue:** "We are not diagnosing ghosts. A risk score is a weather forecast, not a climate. If we code this, we punish people for a crime they haven't committed and a sickness they don't have. No Anchor, no Lever."
  *   **Dramatic Value:** This puts her on the side of patient liberty against "preventative" overreach.

  **(b) Insurance Billing Code Diagnosis**
  *   **Prediction:** **MC Argues NO.**
  *   **Reasoning:** Fails Anchor (no pathology), Passes Lever (Money).
  *   **Dialogue:** "Money is a Lever, yes. But if we let insurance companies write the manual, we turn the book into a ledger. The Lever must be clinical, not financial. If the only treatment this diagnosis unlocks is a check, we are corrupting the system."
  *   **Dramatic Value:** This creates conflict with committee members who want to ensure patients get coverage. It's a "ends vs. means" fight.

  ---

  ### The "Cut" Recommendation

  You asked me to be straight about which verdict to drop.

  **Drop Case #4 (The Victorian Diarist) as a clinical argument.**
  It undermines the MC's authority to argue for the reality of *future* conditions if she's spending time validating *past* ones. Retrospective diagnosis is widely considered a parlor game in psychiatry (pathologizing historical figures).
  *   **Fix:** Keep the subplot, but have her use it to prove the *opposite*. "Look, we can make this diary say anything we want. That's why we need strict Anchors. If we can diagnose the dead, our net is too wide." It makes her look sharper.

  **Keep Case #6 (The App), but acknowledge the cost.**
  This is your most modern, provocative point. It highlights that "real" isn't always "good," and "constructed" isn't always "fake."

  ### Scene Dialogue Sample

  Here is how this sounds in the committee room.

  > "You're asking if Operator's Residual Witness is 'real,'" Dr. Aris said. "That's the wrong question. The question is: does the label find the fire, or does it light the match?"
  >
  > "Semantics," said Henderson.
  >
  > "Is it? Look at Adolescent Drift. The symptoms match the viral videos down to the specific metaphors. 'Watching from the ceiling.' That's not a pathology; that's a script. The label lights the match. We vote no."
  >
  > "But the Operators learned the term from the documentary," Henderson countered.
  >
  > "They learned the *word*," Aris said. "They didn't learn the trauma. The trauma is in the mission logs. The label finds the fire. That is an External Anchor. It gets a code."
  >
  > "And the App diagnosis?" someone asked from the back. "No one was suffering until the algorithm told them they were."
  >
  > "True," Aris said. "No Anchor. But without that code, they have no language to demand accommodation from their partners. The label gives them a Lever. It's constructed, yes. But so is a crutch. I'd rather they walk with a crutch than crawl without one."
  >
  > "So we're in the business of manufacturing crutches now?"
  >
  > "We're in the business of mobility," Aris said. "If the kind is fake but the relief is real, I vote yes. If the kind is fake and the relief is a meme, I vote no. Next item."

  ### Summary of Advice

  1.  **Adopt the Anchor/Lever framework.** It separates "Is it true?" from "Does it work?" which is exactly what a diagnostic committee does.
  2.  **Distinguish Contagion (Case 1) from Recognition (Case 2)** via the *source* of the symptoms (script vs. event).
  3.  **Reframe Case 4** as a warning against over-diagnosis, not a validation of the method.
  4.  **Use the Presymptomatic and Insurance cases** to show the boundaries of her ethics (she won't diagnose ghosts, and she won't sell codes).

  This gives your character a consistent, defensible philosophy that sounds like a clinician, not a textbook.
