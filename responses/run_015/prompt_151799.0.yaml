answer: |-
  Yo, this is a killer thesis but you're walking into a room full of people who live for edge cases. Since you're coming in as an engineer, they'll respect the novelty but try to break your definitions.

  Here's your survival sheet. I've ordered these by how likely they are to derail the talk.

  ### Pre-emptive Concessions (Say these early)
  Don't wait for them to corner you. Soften the hard edges upfront so you don't look naive on the tech or the philosophy.
  1.  **Concede the "Common Knowledge" requirement:** Lewis isn't just "everyone does X." It's "everyone does X, knows everyone does X, knows everyone knows..." Admit that right now, user/dev mutual belief is messy, but argue it's *converging* on common knowledge via model cards, evals, and public incidents.
  2.  **Concede the Agency Gap:** Explicitly state the convention is **between humans (users & devs)** *about* the model. The model is the signal medium, not a party to the contract. This stops them from arguing the model can't have "preferences."

  ---

  ### The Hit List (Objections ordered by damage)

  **1. The "Arbitrariness" Trap (The Lewis Prof)**
  *   **The Objection:** Lewis conventions *must* be arbitrary (e.g., driving on the left vs. right). Truth-telling isn't arbitrary; lying usually fails the coordination goal inherently. If honesty is the *only* solution to the coordination problem, it's not a Lewis convention, it's a natural norm.
  *   **Why it hurts:** If this sticks, your entire Lewis framework collapses. You're misusing the term.
  *   **The Pivot:** Don't defend "Truth vs. Lie" as arbitrary. Defend the **signaling protocol** as arbitrary. We could have conventioned on "AI always says 'I think' before statements" or "AI outputs confidence scores." The *method* of signaling reliability is the convention, not the metaphysical truth.

  **2. The "Intent" Trap (The Cognitive Scientists)**
  *   **The Objection:** Deception requires an intent to mislead. If a model hallucinates due to probabilistic sampling without any goal to deceive, calling it "deception" strips the word of meaning. You're conflating *error* with *lying*.
  *   **Why it hurts:** They will say you're redefining deception so broadly it becomes useless.
  *   **The Pivot:** Shift to **functional deception**. In human-AI interaction, the *impact* is what matters for coordination. If the output violates the expected regularity and causes coordination failure, it functions as deception regardless of the internal causal chain. We treat the model *as if* it has intent for the sake of the convention.

  **3. The "Verification" Trap (The AI Safety Folks)**
  *   **The Objection:** Conventions are fuzzy social norms. Safety requires formal guarantees. How do you verify a "regularity"? If honesty is a convention, it's contingent on human expectations, which shift. You can't verify against shifting targets.
  *   **Why it hurts:** They'll claim your framework makes safety impossible to measure.
  *   **The Pivot:** Argue that treating it as a convention makes verification *easier*, not harder. You aren't verifying "truth" (hard); you're verifying "compliance with signaling protocol" (easier). It turns a metaphysical problem into an engineering SLA.

  ---

  ### The One Reply That Has to Land
  If you fumble everything else, you need to nail this distinction to save the "Normative Residue" point.

  **The Reply:** "We aren't conventioning on **Accuracy**, we're conventioning on **Predictability**."
  *   **Why:** This saves you from the Arbitrariness Trap and the Safety Trap.
  *   **How to say it:** "The coordination problem isn't 'get the right answer,' it's 'know how to interpret the output.' Normative residue explains why we punish hallucinations in creative writing: we're punishing the break in predictability, not the lack of truth. The convention stuck even when the truth-value stopped mattering."
  *   **If this lands:** You unify the Lewis stuff with the Normative Residue stuff. The convention is "stable signaling," not "truth."

  ---

  ### The Ghost (Pray They Skip This)
  **The "Deterministic Bug" Objection**
  *   **The Question:** "If your model has a bug where it *always* outputs 'Paris is in Germany' due to a weights error, that's a regularity. Under your view, is the model being 'honest' because it's consistent? Or is it deceptive because it breaks the *user's expected* regularity?"
  *   **Why it's deadly:** It exposes the flaw in "regularity = honesty." A consistent lie is still a lie. If you say it's honest because it's regular, you look absurd. If you say it's deceptive, you admit regularity isn't enough—you need *correctness* or *intent*.
  *   **Defense if asked:** Bite the bullet but refine the "Regularity." The convention is regularity *relative to the training promise*. If the dev promised "helpful assistant" and the bug breaks that, it's a violation of the convention between dev and user, even if the output is deterministic. The regularity must be the *agreed upon* one, not just *any* pattern.

  Good luck. Keep your feet on the engineering ground but speak their language. You got this.
