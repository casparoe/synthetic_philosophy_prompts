  | **B. Genealogists** | Cause (natural history) vs. Reason (grammar) | The genealogical story is irrelevant to validity; Miriam's usage determines belief, not her theory about origins. | When asked to explain causally why the practice persists without belief. | High (Her own report of non-belief might signal a grammar change.) |
  | **C. Mirror Pair** | Belief as hinge/action vs. Belief as hypothesis | The practitioner believes; the assenter holds an opinion. Belief is shown in life and reaction, not avowal. | When asked if God objectively exists independent of the practice. | Medium (Risks labeling him a fideist who isolates religion from truth.) |

  **Methods Note**

  Attributing a view to Wittgenstein requires acknowledging that he viewed philosophy as therapy, not theory-building. To predict his response is to project his method of grammatical investigation onto new terrain, not to retrieve a hidden doctrine. I am attributing to him the view that religious language is grounded in a form of life involving suffering and action. However, he would refuse the formulation: Religious belief requires existential exposure. This sounds like a necessary condition or a thesis about the essence of religion. He would insist instead on describing how the word is used in specific cases. He would also refuse any claim that evolutionary psychology is wrong empirically; his objection is purely grammatical—that it misunderstands what a reason is. Similarly, regarding the AI, he would refuse to say it is conscious or unconscious, as these are pictures that hold us captive. The attribution here is of a direction of inquiry, not a conclusion. I am asserting he would prioritize practice over proposition, but he would reject this as a general rule applicable to all language games. The prediction rests on his consistent resistance to explaining what can only be described. We must avoid turning his reminders into a system. If I suggest he would decide Case C in favor of the practitioner, I am proposing how he would weigh the evidence of use, not stating a rule that the practitioner always wins. He would warn us against feeling satisfied with this prediction, urging us to look again at the actual cases rather than resting on the interpretation.

