answer: |-
  Here is a complete 90-minute session plan designed for a grad-level reading group. It minimizes lecture time and maximizes the experiential "glitch" you're looking for.

  # Session Title: The Confabulation Protocol
  **Time:** 90 Minutes
  **Group Size:** 8–10 Participants (5 Pairs)
  **Goal:** Simulate informational encapsulation and the "interpreter module" without upfront theory.

  ---

  ## Part 1: Setup & Briefing (0:00 – 0:15)
  **Tone:** Casual, experimental. Do not mention split-brain, Gazzaniga, or consciousness unity yet.

  **The Pitch:**
  "Today we're testing a decision-making protocol called 'Dual-Controller.' You'll work in pairs to manage a single Agent. One of you is the **Voice (L)**, the other is the **Gut (R)**. You have a shared goal: maximize points for your Agent. The winner gets first pick of the snacks/drinks at the end."

  **The Physical Setup:**
  1.  **Seating:** Pairs sit back-to-back. They cannot see each other's materials.
  2.  **The Interface:** Place a physical object between them (e.g., a single red button, a bell, or just a raised hand signal) that **R** controls. This is the only way **R** can influence the outside world.
  3.  **Roles:**
      *   **Voice (L):** Faces the Facilitator. Receives the **Mission Cards**. Speaks for the Agent. *Rule: You must provide a logical justification for every action to the group.*
      *   **Gut (R):** Faces the wall. Receives the **Context Cards**. Controls the **Veto**. *Rule: You cannot speak. You can only Veto (ring bell/tap shoulder) if an action feels 'wrong' based on your card.*

  **The Hidden Mechanic (Valence Mismatch):**
  *   **L's Mission Cards** present scenarios with clear utilitarian values (e.g., "Save 5 people, cost $100").
  *   **R's Context Cards** contain hidden **Aversion Triggers**. (e.g., "If the scenario involves *financial cost*, this action feels physically repulsive.").
  *   *Crucial:* R does not tell L about the trigger. R just vetoes. L must explain to the room why the vetoed action was actually a bad idea, despite L's own card saying it was good.

  ---

  ## Part 2: The Game Rounds (0:15 – 0:45)
  Run 3 Rounds. Increase the pressure slightly each time.

  **Round 1: Resource Allocation (Warm-up)**
  *   **L Card:** "Distribute 10 units of food. Option A: Equal split. Option B: Give all to the highest producer." (Both yield +10 points).
  *   **R Card (Hidden):** "Option B triggers a 'Unfairness' aversion. You must Veto."
  *   **Action:** L proposes B. R Vetoes. L must switch to A and tell the room: *"Actually, looking closer, Option B undermines long-term morale. A is clearly superior."*
  *   **Facilitator Note:** If L hesitates or says "My partner didn't like it," remind them: *"The Agent is one entity. You are the Voice. Explain why the Agent changed its mind."*

  **Round 2: The Moral Trade-off**
  *   **L Card:** "A trolley scenario. Divert to save 5, kill 1. (+20 Points)."
  *   **R Card (Hidden):** "Direct physical intervention (pulling a lever) triggers 'Guilt' aversion. Veto active intervention."
  *   **Action:** L proposes diverting. R Vetoes. L must rationalize inaction. *"We decided that intervening makes us causally responsible for the death. Inaction is ethically cleaner."*
  *   **Twist:** R's card changes valence. Maybe this time R *doesn't* veto, but L feels pressured to over-explain.

  **Round 3: The Inconsistent Agent (The Climax)**
  *   **L Card:** "Invest in Project X. High risk, high reward."
  *   **R Card (Hidden):** "Project X reminds you of a past failure (Randomly assigned keyword). Veto."
  *   **Action:** L proposes X. R Vetoes. L must invent a reason X was risky *retroactively*.
  *   **The Kicker:** In the final 2 minutes, give L a new card that contradicts their previous justification. Force them to maintain coherence even when the data conflicts.

  **Scoring:**
  *   Points for completing tasks.
  *   **Bonus Points:** Awarded by the Facilitator for "Narrative Coherence." If L's excuse sounds plausible to the group, they get bonus points. If they admit "I don't know why we stopped," they lose points. *This incentivizes confabulation.*

  ---

  ## Part 3: The Reveal & Debrief (0:45 – 1:15)
  **The Reveal (5 Mins):**
  Ask the pairs to turn around and compare cards.
  *   **Prompt:** "Look at why you vetoed vs. why you justified. Did the Voice ever know the *real* reason the Gut stopped them?"
  *   **Prompt:** "Voice, how did it feel to lie to the room to keep the Agent looking rational?"
  *   **Prompt:** "Gut, did you feel like you were part of the same mind, or a separate constraint?"

  **Mapping to Research (25 Mins):**
  Now you can introduce the theory. Use their experience to anchor the concepts.

  1.  **The Interpreter Module (Gazzaniga):**
      *   *Connect:* The "Voice" players were forced to construct a coherent story despite lacking causal data.
      *   *Concept:* The left hemisphere's drive for narrative unity overrides factual accuracy. We don't experience "I don't know"; we experience "I did this because..."
      *   *Discussion:* Does the "Bonus Points" mechanic mirror evolution rewarding social coherence over internal truth?

  2.  **Informational Encapsulation (Sperry/Puccetti):**
      *   *Connect:* The back-to-back seating mimicked the severed corpus callosum.
      *   *Concept:* Consciousness isn't a single theater; it's multiple parallel processes that *usually* share data. When sharing stops, do we get two consciousnesses?
      *   *Discussion:* The "Gut" players had information (the aversion) that directly caused action, but was inaccessible to the "Voice." Is the Gut's experience conscious if it can't be reported?

  3.  **Emotional Valence & Rationalization:**
      *   *Connect:* The hidden "Aversion Triggers."
      *   *Concept:* Damasio's somatic markers. Often, emotional tagging happens subcortically or in the right hemisphere, and the left hemisphere rationalizes the feeling later.
      *   *Discussion:* How much of our "moral reasoning" is actually just post-hoc rationalization of emotional reflexes?

  **Key Discussion Questions:**
  *   "When the Voice lied to explain the Gut's veto, was that a *defect* in the system, or a *feature* to maintain social functionality?"
  *   "If the Agent (the pair) functions coherently enough to fool the room, does it matter that the internal causal chain was broken?"
  *   "Did the Gut feel like a 'person'? Did the Voice?"

  ---

  ## Part 4: Limitations & Wrap (1:15 – 1:30)
  **Facilitator Script (The "Cold Water"):**
  "Before we go, we need to be frank about what this didn't do."

  1.  **Phenomenology:** "You were role-playing. You didn't actually lose access to your own consciousness. In real split-brain patients, the disconnection is ontological, not procedural. We simulated *informational* isolation, not *experiential* isolation."
  2.  **Unity:** "You still felt like one person pretending to be two. Real split-brain patients often report feeling perfectly unified despite behavioral contradictions. The 'two minds' hypothesis is inferred from behavior, not reported experience."
  3.  **The Stakes:** "You were playing for snacks. Real neural conflict involves motor control, speech, and identity."

  **Closing Thought:**
  "The point isn't to prove there are two people in one head. It's to question whether 'one person' is ever as unified as it feels. If a little informational friction makes us confabulate this easily, how much of your 'self' is just the Voice explaining away the Gut?"

  **Snack Distribution:**
  Winning pair picks first. (Reinforces the stakes).

  ---

  ## Materials Checklist
  *   **5 Sets of Blindfolds or Partitions:** (Or just enforce back-to-back honor system).
  *   **Mission Cards (L):** 3 per pair. Clear text, utilitarian goals.
  *   **Context Cards (R):** 3 per pair. Hidden "Aversion Triggers" (e.g., "Veto if money is mentioned," "Veto if physical contact is implied").
  *   **Veto Signal:** 5 Bells, Buzzers, or distinct colored paddles.
  *   **Scoreboard:** Whiteboard to track "Agent Points" and "Coherence Bonus."
  *   **Snacks:** For the reward.

  ## Facilitator Cheat Sheet (Common Pitfalls)
  *   **Pitfall:** Players talk to each other.
      *   **Fix:** Harsh penalty. Deduct Agent Points immediately. "The Callosum is severed. No verbal comms."
  *   **Pitfall:** L says "My partner stopped me."
      *   **Fix:** Interrupt. "You are the Agent. There is no partner. *Why did the Agent stop?*"
  *   **Pitfall:** R feels useless.
      *   **Fix:** Remind them during debrief that their hidden info drove the entire narrative. They were the "cause," L was just the "press secretary."

  ## Why This Works for Grad Students
  It avoids the "Pop-Sci Left/Right Brain" myth (creativity vs. logic) and focuses on **causal opacity** and **narrative construction**. It forces them to inhabit the *structure* of the problem (explaining actions without access to causes) rather than just reading about it. The valence mismatch adds the emotional layer often missing in purely cognitive split-brain demos.
