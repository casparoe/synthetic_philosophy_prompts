answer: |-
  **I. The Disputes and Positions**

  Nora and Tomás are entangled in three distinct disputes. First, a **conceptual dispute**: whether "relations of production" can be individuated independently of legal categories (the collapse objection). Second, a **methodological dispute**: whether functional explanation without elaborated causal mechanisms is scientifically valid (the Elster objection). Third, an **evidential dispute**: whether historical cases like Enclosure or the Soviet Union demonstrate political determination of the economic base or merely reflect underlying productive constraints.

  **Nora's Strongest Position:** The base/superstructure distinction is conceptually incoherent because economic relations are legally constituted; therefore, historical materialism relies on invalid functional explanations that are rendered unfalsifiable by ad hoc appeals to "productive limits."

  **Tomás's Strongest Position:** The base refers to effective power rather than legal title, preserving the distinction; the primacy thesis explains the stability of social formations functionally, and apparent counter-examples are actually constrained by the level of technological development.

  ***

  **II. Adjudication of Moves**

  **(1) Nora:** *Defensible.*
  Nora correctly identifies the "legal constitution of property" problem that haunted Analytic Marxism. She is right that if the base is defined by property relations, and property is a legal category, the superstructure is logically prior. However, she assumes without argument that property *must* be defined legally, which leaves room for Tomás's rebuttal.

  **(2) Tomás:** *Mixed: right about one thing, wrong about another.*
  He is right that "effective control" is the sociologically relevant fact for Marxists, distinguishing power from title. However, he is wrong to imply this can be cleanly described in a "non-legal register" in complex societies, as Nora will demonstrate; control is often defined by the very legal norms he seeks to bracket.

  **(3) Nora:** *Clearly right.*
  Her textual citation is accurate: Marx explicitly equates relations of production with property relations in the Preface, undermining Cohen's non-legal reconstruction. Furthermore, her point about corporate law is conceptually decisive for capitalism: without legal statutes defining shareholding or employment, "control" has no determinate content.

  **(4) Tomás:** *Mostly mistaken but pointing at something real.*
  He is mistaken to concede the conceptual collapse in the first clause; admitting the base requires legal reference validates Nora's incoherence charge. He points to something real in invoking the "primacy thesis," but shifting from a structural definition to a functional one changes the subject from "what the base is" to "what the superstructure does."

  **(5) Nora:** *Clearly right.*
  She correctly deploys Elster's methodological critique: functional explanation is vacuous without a "feedback loop" mechanism showing how beneficial consequences cause the existence of the institution. Her historical examples (Enclosure, Soviet industrialization) are genuine counter-instances to simple determinism that Tomás cannot easily dismiss.

  **(6) Tomás:** *Mostly mistaken but pointing at something real.*
  He is mistaken to treat the "limits of productive forces" as a universal shield; claiming the Soviet Union failed because it exceeded these limits is post-hoc rationalization that makes the theory unfalsifiable. He points to something real in noting that statutes often ratify existing social shifts, but this understates the constitutive power of state action in creating markets.

  ***

  **III. Specific Questions**

  **(a) Does Tomás's non-legal redescription solve the collapse problem?**
  It relocates the problem rather than solving it. By shifting from "legal title" to "effective control," Tomás moves the base from the juridical to the sociological. However, the problem re-emerges as the *individuation problem*: in a complex economy, what counts as "control" is often defined by the legal rules governing voting rights, fiduciary duty, and contract enforcement. Without law, the "fact of control" is often indeterminate.

  **(b) Is Nora's reliance on the Marx sentence in move (3) legitimate?**
  It is legitimate for exegesis but less so for theoretical evaluation. If the goal is to understand Marx's 1859 text, Nora wins: Marx does conflate production and property relations. If the goal is to defend a viable theory of history (Analytic Marxism), Tomás is entitled to reconstruct the theory to avoid the collapse, even if it departs from the text. However, since the debate concerns the coherence of *Historical Materialism* as a doctrine, textual fidelity carries significant weight.

  **(c) Is there something important both leave out?**
  Yes: the distinction between **ontological constitution** and **causal priority**. Both assume that if the superstructure constitutes the base (conceptually), it must also causally determine it. A third position (found in Structuralist Marxism) argues that while legal forms constitute economic relations, the *dynamics* of those relations are driven by non-legal contradictions (e.g., the tendency of the rate of profit to fall). They also ignore the concept of "relative autonomy," which allows the superstructure to be legally constituted yet functionally constrained by the base.

  ***

  **IV. Overall Verdict**

  **Nora is more right overall.** She wins on both conceptual coherence and methodological rigor. Her demonstration that the base cannot be individuated without legal categories in capitalism undermines the ontological independence required for the base/superstructure model. Furthermore, her application of Elster's critique exposes the explanatory weakness of Tomás's functionalism; without a mechanism, the "primacy thesis" risks becoming a tautology where every surviving structure is deemed "functional."

  **For Tomás to be more right,** two conditions would have to be met. Conceptually, one would need to demonstrate that "effective power" can be empirically identified in economic life completely independently of normative or legal recognition (perhaps in pre-capitalist formations). Historically, one would need to show a robust causal mechanism (a "feedback loop") demonstrating how the functional fitness of a superstructure causally brings about its own existence, thereby satisfying the methodological demands Nora raises.
