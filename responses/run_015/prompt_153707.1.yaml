answer: |-
  # Diagnostic Taxonomy: Material Constitution & Persistence
  **Seminar Instrument v1.0**

  ## Introduction
  This instrument is designed to sort philosophical positions on material constitution based on intuitive judgments about concrete scenarios, rather than adherence to labeled schools of thought. Participants should answer the following seven questions regarding the case of **The Statue** (a specific artistic figure) and **The Clay** (the matter constituting it).

  *Note: Answer "Yes" or "No" to each question based on your most robust intuition. Do not worry about theoretical consistency yet; the tree will reveal where your judgments lead.*

  ---

  ## The Diagnostic Questions

  **Q1. The Count**
  At this exact moment, standing before the artwork, how many physical objects are located exactly where the statue is?
  *   **(A)** Just one object.
  *   **(B)** Two distinct objects (the statue and the clay).

  **Q2. The Squash (Statue)**
  Imagine you take a heavy roller and flatten the artwork into a featureless slab. Does the *statue* cease to exist?
  *   **(A)** Yes, the statue is destroyed.
  *   **(B)** No, the statue survives (it is just a damaged statue).

  **Q3. The Squash (Clay)**
  In that same flattening scenario, does the *clay* cease to exist?
  *   **(A)** Yes, the clay is destroyed.
  *   **(B)** No, the clay survives (it is just a lump now).

  **Q4. The Swap (Persistence)**
  Imagine that over ten years, every single particle of the original clay is slowly replaced with new clay, maintaining the shape. Is the resulting object the *same statue* as the original?
  *   **(A)** Yes, it is the same statue.
  *   **(B)** No, the original statue ceased to exist when parts were removed.

  **Q5. The Overlap (Co-location)**
  If you answered **(B)** to Q1 (there are two objects), do those two objects share every single physical part (every atom/molecule) at this moment?
  *   **(A)** Yes, they are made of the exact same parts.
  *   **(B)** No, they have different parts even if they occupy the same space.

  **Q6. The Time-Slice (Temporal Ontology)**
  Is the statue we see right now a momentary "stage" or "slice" of a larger object that extends through time (like a worm), rather than a whole object present entirely at each moment?
  *   **(A)** Yes, it is a temporal stage of a larger whole.
  *   **(B)** No, the whole object is present right now.

  **Q7. The Shape (Ontological Status)**
  Is the specific shape/form of the statue a fundamental *ingredient* of what the object is (like an extra component alongside the matter), or is it merely a description of how the matter is arranged?
  *   **(A)** It is a fundamental ingredient/constituent.
  *   **(B)** It is merely a description of arrangement.

  ---

  ## The Decision Map: Positions & Combinations

  Below are the primary philosophical positions mapped to specific combinations of answers. Combinations not listed are flagged as **Unoccupied**.

  ### 1. Eliminitivist Materialism
  *   **Path:** Q1(A) [One] + Q2(A) [Statue Dies] + Q3(B) [Clay Lives]
  *   **Diagnosis:** There is only the clay. Talk of a "statue" is a manner of speaking. When squashed, the clay remains, and since the statue was never a real object, only the clay's persistence matters.
  *   **Note:** Strictly speaking, this view denies the existence of the statue, so Q2 is category-mistaken, but functionally maps to "Statue does not survive."

  ### 2. Strict Identity (Monism)
  *   **Path:** Q1(A) [One] + Q2(A) [Statue Dies] + Q3(A) [Clay Dies]
  *   **Diagnosis:** The statue and clay are identical. If one dies, the other dies. Squashing destroys the object entirely.
  *   **Variant:** **Dominant Sorts** (Q1=A, Q2=A, Q3=A, but claims the object is essentially a statue, so the clay *becomes* the statue and ceases to be clay).

  ### 3. Standard Constitution View (e.g., Baker)
  *   **Path:** Q1(B) [Two] + Q2(A) [Statue Dies] + Q3(B) [Clay Lives] + Q5(A) [Share Parts] + Q6(B) [3D] + Q7(B) [Arrangement]
  *   **Diagnosis:** Two distinct objects share the same parts. They have different persistence conditions (modal profiles). The statue is constituted by the clay but is not identical to it. Form is a condition, not an ingredient.

  ### 4. Coincidentalism (e.g., Lewis)
  *   **Path:** Q1(B) [Two] + Q2(A) [Statue Dies] + Q3(B) [Clay Lives] + Q5(A) [Share Parts] + Q6(B) [3D] + Q7(B) [Arrangement]
  *   **Diagnosis:** *See Indistinguishable Pair below.* On case judgments, this looks identical to the Standard Constitution View.

  ### 5. Mereological Essentialism (e.g., Burke)
  *   **Path:** Q1(B) [Two] + Q2(A) [Statue Dies] + Q3(B) [Clay Lives] + Q4(B) [No Swap] + Q5(A) [Share Parts]
  *   **Diagnosis:** Objects cannot gain or lose parts. Replacing particles destroys both the statue and the clay (or creates new ones). This view often forces Q3 to (A) as well, but some variants allow the matter to survive as a different lump.

  ### 6. Four-Dimensional Stage Theory (e.g., Sider)
  *   **Path:** Q1(B) [Two] + Q2(A) [Statue Dies] + Q3(B) [Clay Lives] + Q5(A) [Share Parts] + **Q6(A) [Time-Slice]**
  *   **Diagnosis:** The statue and clay are distinct temporal stages of different "worms" (temporal wholes). They coincide at this moment but diverge in the future (one worm ends at squashing, the other continues).

  ### 7. Hylomorphic Constitution (e.g., Rea / Kosman variant)
  *   **Path:** Q1(B) [Two] + Q2(A) [Statue Dies] + Q3(B) [Clay Lives] + Q5(A) [Share Parts] + Q6(B) [3D] + **Q7(A) [Shape as Ingredient]**
  *   **Diagnosis:** The statue is a composite of Matter (Clay) + Form (Shape). They are ontologically inseparable in the statue, yet the Clay can exist without that Form. The Form is a real constituent, not just an arrangement.

  ---

  ## Analysis of Logical Space

  ### Unoccupied Combinations (Gaps in the Tree)

  **Gap 1: The Modal Twins**
  *   **Combination:** Q1(B) [Two Objects] + Q2(B) [Statue Survives Squash] + Q3(B) [Clay Survives Squash] + Q5(A) [Share Parts].
  *   **Diagnosis:** **Unstable / Ockham's Violation.** This position posits two distinct objects that share all parts and have identical persistence conditions (both survive squashing). There is no principled reason to count two rather than one. It violates parsimony without explanatory gain.

  **Gap 2: The Ghostly Interpenetration**
  *   **Combination:** Q1(B) [Two Objects] + Q5(B) [Do Not Share Parts].
  *   **Diagnosis:** **Incoherent (for material objects).** This implies two material objects occupy the exact same spatiotemporal region but are made of different atoms. This violates the impenetrability of matter unless one posits non-physical substances or exotic physics not standard to this debate.

  **Gap 3: The Essentialist Clay / Flexible Statue**
  *   **Combination:** Q1(B) [Two] + Q2(B) [Statue Survives Squash] + Q3(A) [Clay Dies] + Q4(B) [No Swap for Clay].
  *   **Diagnosis:** **Unexplored.** This suggests the artifact is more robust than its material. While intuitively strange (usually matter outlasts form), it is not logically incoherent. It might represent a view where "artifact status" grants ontological shielding that raw matter lacks.

  ### Indistinguishable Positions (Blind Spots)

  **Pair 1: Standard Constitution vs. Coincidentalism**
  *   **The Issue:** Both views yield identical answers to Q1–Q7 (Two objects, share parts, different modal profiles, 3D, form as arrangement).
  *   **Why the Tree Fails:** The tree tests *judgments on cases*, not *metaphysical explanations*.
  *   **Supplementary Distinction:** To separate them, ask: **"Is there a primitive relation of 'constitution' binding the two, or are they distinct simply in virtue of having different modal properties?"**
      *   *Constitution Theorist:* Posits a specific asymmetric relation (Constitution).
      *   *Coincidentalist:* Denies the relation; identity is determined by modal properties alone.

  **Pair 2: Hylomorphism vs. Standard Constitution**
  *   **The Issue:** Both posit two objects, co-location, and 3D persistence.
  *   **Why the Tree Fails:** Without Q7, they look identical. Even with Q7, some Constitution theorists might agree form is "important" without calling it an "ingredient."
  *   **Supplementary Distinction:** Ask: **"Can the matter exist potentially without the form, or is the matter only actualized *as* this object through the form?"**
      *   *Hylomorphist:* Matter is potentiality; Form actualizes it. They are ontologically distinct categories.
      *   *Constitution Theorist:* Matter and Statue are both actual objects; one makes up the other.

  ### Instructions for Seminar Use
  1.  **Blind Sorting:** Have participants answer Q1–Q7 without discussing the "Names" of the views.
  2.  **Mapping:** Plot their answers on the Decision Map.
  3.  **Conflict Check:** If a participant lands in an **Unoccupied** node, ask them to justify the stability of that position (e.g., "Why count two objects if they behave exactly alike?").
  4.  **Tie-Breaking:** For participants landing in **Indistinguishable** nodes (Constitution vs. Coincidentalism), use the Supplementary Distinctions to force a theoretical commitment.
