  # Teaching Plan: Tranquilism as Axiological Claim

  ## I. The Prior Conceptual Distinction
  **Distinction:** **Prudential Value vs. Phenomenological Desirability.**

  **Why this must precede the view:**
  Students with Stoic or Buddhist backgrounds already accept that craving is problematic. However, they typically assume that the *resolution* of craving (e.g., virtue, enlightenment, bliss) constitutes a positive good. Students with no analytic background assume that if a state feels good (phenomenological desirability), it contributes to welfare (prudential value).

  You must secure the separation of these concepts before introducing tranquilism. If students believe that "feeling good" automatically equals "adding value," they will hear the claim "joy is axiologically neutral" as "joy is irrelevant to experience," which is empirically false and immediately rejectable. They must accept that value is a technical metric of welfare contribution, not a report on how much a state is wanted or enjoyed. Without this distinction, tranquilism collapses into either Stoicism (where the resolution is a positive virtue) or Nihilism (where nothing matters).

  **Instructional Move:**
  Begin the session by establishing that "what we want" and "what is good for us" are separable categories. Use a brief example of adaptive preference or harmful addiction where desire is high but welfare is low, then invert it: can a state be wanted yet add zero to the welfare sum? Secure agreement that axiology measures the *constitution of a good life*, not the *intensity of preference*.

  ## II. The Carrying Comparison
  **The Comparison:** **The Secure Baseline vs. The Enhanced Baseline.**

  **Description of States:**
  *   **State A (The Secure Baseline):** A conscious life state characterized by the complete absence of pain, anxiety, and craving. The subject is fully functional and engaged with the world. However, the subject experiences no peaks of joy, no aesthetic thrill, no sense of achievement, and no romantic love. The phenomenological tone is flat but contented.
  *   **State B (The Enhanced Baseline):** Identical to State A in every respect (no pain, no craving, fully functional) but includes intermittent episodes of profound joy, aesthetic fulfillment, and loving connection.

  **Properties the Favorable Case (State A) Must Possess:**
  *   **Complete Absence of Negatives:** No suffering, no unsatisfied desire, no anxiety.
  *   **Complete Absence of Positives:** No pleasure, no excitement, no "highs."
  *   **Functional Integrity:** The subject is not catatonic; they act, speak, and interact normally, driven by non-craving motivations (e.g., habit, duty, or neutral preference).

  **Properties the Favorable Case Must Lack:**
  *   **Depressive Affect:** It must not resemble clinical depression (which involves suffering/negative affect). It is not "sad flatness"; it is "neutral flatness."
  *   **Risk-Aversion:** The state is not achieved by avoiding life to prevent pain. It is a stable mode of engagement.
  *   **Instrumental Hope:** The subject is not enduring neutrality to reach a later reward.

  **Justification for Secular Over Ascetic:**
  Do not use a religious ascetic example (e.g., a monk seeking Nirvana). Religious asceticism typically frames the neutral state as instrumental to a *higher positive good* (union with the Divine, Enlightenment as bliss). This contradicts tranquilism's core claim that positives are neutral. The Secure Baseline must be presented as the *terminal* axiological state, not a means to a transcendent end. This forces students to evaluate the neutrality claim on its own merits, without smuggling in hidden positive values via soteriology.

  ## III. Misconception Map
  Address these misconceptions in the following order. Do not proceed to the next stage until the current misconception is neutralized.

  **1. Misconception: "This is just Extreme Stoicism."**
  *   **Likely Timing:** Immediate reaction upon hearing the definition.
  *   **Conceptual Move:** **The Virtue Test.**
  *   **Instruction:** Point out that for Stoics, *Virtue* is a positive good that adds value beyond the mere absence of passion. A Stoic sage values acting rightly as a positive addition to the cosmos. Tranquilism denies this. Ask: "If virtue produces no reduction in craving, does it add value?" For Stoics, yes. For Tranquilists, no. This isolates tranquilism as strictly privative (value only in removal), whereas Stoicism is substantive (value in excellence).

  **2. Misconception: "This collapses into Negative Utilitarianism."**
  *   **Likely Timing:** During the analysis of the Carrying Comparison.
  *   **Conceptual Move:** **The Zero-Sum Check.**
  *   **Instruction:** Negative Utilitarians typically assign positive value to pleasure, even if it is outweighed by suffering (e.g., Pain = -100, Pleasure = +1). Tranquilism assigns *zero* value to pleasure (Pain = -1, Pleasure = 0). Ask: "If you could add infinite joy without reducing suffering, would the world be better?" A Negative Utilitarian says "Yes, slightly." A Tranquilist says "No, it is axiologically identical." This forces the distinction between "pleasure matters less" and "pleasure does not count."

  **3. Misconception: "This licenses Suicide or Total Withdrawal."**
  *   **Likely Timing:** End of session, when discussing implications.
  *   **Conceptual Move:** **The Subject Requirement.**
  *   **Instruction:** Clarify that value requires a subject to experience the absence of craving. Death eliminates the subject, thereby eliminating the locus of value. Withdrawal often generates new cravings (for isolation, for safety). The view mandates living in a way that sustains the absence of craving, which usually requires engagement, not exit. The goal is the *experience* of tranquility, not the *absence* of experience.

  ## IV. The Diagnostic Question
  Pose this question in the final 15 minutes to test axiological understanding:

  **"Imagine two possible futures for your life. In Future A, you live 50 more years with no suffering and no craving, but also no joy or love. In Future B, you live 50 more years with no suffering and no craving, plus frequent episodes of profound joy and love. According to tranquilism, is Future B prudentially better than Future A?"**

  *   **Correct Understanding:** No. (Because positives are neutral; only the absence of negatives counts, and both futures have equal absence of negatives.)
  *   **Incorrect Understanding (Stoic/Neg Util):** Yes. (Because joy/virtue adds positive value.)
  *   **Incorrect Understanding (Nihilist):** No, because neither matters. (Tranquilism claims the absence of suffering *does* matter positively.)

  ## V. The Excluded Dimension
  **Dimension to Refuse:** **Population Ethics and Anti-Natalism.**

  **Statement to Students:**
  "Tranquilism is often discussed in the context of population ethics, specifically regarding whether bringing new beings into existence is permissible given that existence introduces craving. We will **not** open this dimension today. Discussing procreation shifts the focus from individual welfare axiology to moral obligations regarding existence itself. To understand the core axiological claim—that positives are neutral—we must restrict our scope to the evaluation of existing lives. Introducing anti-natalism now would conflate the value of a life with the morality of creating one."
