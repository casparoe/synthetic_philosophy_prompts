answer: |-
  Colonel Halvard Bruun: You keep saying Private Sen is liable to be killed. She drives a supply truck. She thinks she is stopping a resource grab. She is wrong, but she is not stupid. Everything her government tells her confirms it. If she is epistemically blameless, how can she be morally liable?

  Dr. Leila Vosoughi: Because liability is not blame. We must separate three things: whether Sen is blameworthy for fighting, whether she is morally liable to defensive force, and whether it is permissible for others to kill her anyway. Sen is not blameworthy. She lacks the knowledge to be culpable. But she is liable. She is part of a causal chain that threatens innocent people—the Shen minority being cleansed. Her truck fuels the gun that stops the rescue.

  Colonel Halvard Bruun: So you admit she is innocent of any wrong, yet you say we may kill her. That makes her a sacrifice, not a combatant. You are saying a person can lose their right to life without doing anything morally wrong.

  Dr. Leila Vosoughi: I am saying a person can become an instrument of injustice without knowing it. If a sleepwalker walks off a cliff and takes you with him, you may push him off to save yourself. He is not blameworthy, but he is the threat. Sen is the threat. The Kavalan soldiers defending the Shen may kill her because she impedes a just rescue, not because she is evil.

  Colonel Halvard Bruun: That distinction is too thin for the blood on the ground. But let's look at the other side. Kavala is not pure. They stop the cleansing, but they also want the cobalt. They admit it. Their operations are mixed. You revisionists have to choose between two views. The severance view: the just part stands alone, and soldiers serving only that part retain their rights. Or the contamination view: the unjust aim ruins the whole campaign, so no Kavalan soldier has the rights of a just combatant. Which is it?

  Dr. Leila Vosoughi: Contamination. When a state fights for mixed aims, the unjust aim corrupts the authority to wage war. You cannot claim the privilege of justice while serving a master who intends theft.

  Colonel Halvard Bruun: Then consider Sergeant Tomás Iriarte. He is Kavalan. He enlisted explicitly to help annex Shen. He wants the cobalt. But his unit has spent the entire war securing a refugee corridor. He has never fired his weapon. He has saved lives. Under contamination, is he liable to be killed by Meridians?

  Dr. Leila Vosoughi: Yes. His actual contribution is good, but his intent binds him to the unjust cause. He serves an authority that lacks the right to command him. His bad aims settle his status. He is an agent of theft, even if his hands are currently holding a stretcher.

  Colonel Halvard Bruun: So saving lives makes you a target, provided you have the wrong thoughts. That seems to make morality a matter of internal state rather than external harm. Let me offer a different measure. The exchange test. To find out if a soldier is at fault, ask not what his cause is, but whether this same person, raised on the other side, would have fought just as willingly. Most soldiers would. They are products of their society. If they are interchangeable, they are morally equal. The law of war is right to treat them as such.

  Dr. Leila Vosoughi: I grant the test returns the result you describe. Most soldiers are biddable. They would fight for whichever flag was placed in their hands. But the test measures the wrong thing. It measures obedience, not liability. Liability tracks objective rights violations. If I attack you without justification, I violate your rights. It does not matter if I was raised to believe I was justified. The fact that I am obedient to my government does not settle whether I may be killed. It explains why I am there, not why I am safe.

  Colonel Halvard Bruun: But that obedience is exactly why your view cannot be used. If a soldier's right to kill depends on the objective justice of his war, and people on both sides disagree reasonably about that, then soldiers can never know whether they are permitted to fire. The rules become a moral trap. You ask them to be judges when they are barely participants.

  Dr. Leila Vosoughi: The difficulty is real. I will not pretend it is small. Soldiers must weigh the evidence available to them. If the justice of the war is deeply uncertain, they ought to refrain from fighting. It is better to disobey an order than to kill without justification. The burden is heavy, but it is not heavier than the cost of being an unjust killer.

  Colonel Halvard Bruun: And yet, consider my own side's hardest case. A Meridian conscript who personally endorses the ethnic cleansing and fights eagerly. And another who was beaten into uniform and fights as little as he can. My symmetry thesis treats them as legally equal combatants. But do you really think they are morally alike?

  Dr. Leila Vosoughi: No. The zealot is blameworthy; the reluctant soldier is not. But both are liable if they pose a threat to just defenders.

  Colonel Halvard Bruun: Then my view requires treating them as alike in law, even if they differ in soul. I live with that because the alternative is chaos. If we license soldiers to judge the justice of the cause mid-fire, we invite atrocity. Every soldier will believe he is the just one. I admit the symmetry thesis is a legal fiction, not a moral truth. It holds the line so that men like Iriarte and Sen do not have to be philosophers to survive.

  Dr. Leila Vosoughi: And I admit that requiring soldiers to judge justice places a crushing weight on them. But a legal fiction that protects unjust killers is no shield at all.

  Epilogue
  Bruun: I would abandon symmetry if we could design a rule that prevented atrocity without demanding impossible knowledge from the soldier. Vosoughi: I would abandon revisionism if objective justice proved permanently inaccessible to human reason, leaving us no ground to distinguish rescue from rape.
