  1. Most folks think Hume just weighs pain vs pleasure, but you're saying the bundle theory changes the whole game regarding who gets harmed. Can you walk us through how dissolving the self changes the usual objection that suicide wrongs the person dying?

  2. But here's where I get stuck. If the self is just a bundle of perceptions that's already fraying, who exactly is left to hold the preference for dying? It feels like you need a stable subject to want anything, even their own end. So how do you get around the idea that the desire to die proves there's still enough 'you' left to be wronged?

  3. Hume also cared deeply about our duties to society and friends, not just ourselves. How does your reading handle someone whose narrative is intact but wants out, versus someone whose self is fragmented but still has heavy social obligations?

  4. Let's take someone with advanced dementia whose story is breaking down, but they still have moments of real joy. Does your view say we should let them go because the narrative is gone, or intervene because those moments still matter? I'm worried about where you draw the line on when a life is no longer 'theirs' to keep or end.

  5. It sounds like you're mixing Hume's bundle theory with modern ideas about narrative identity. Are you worried that's a bit anachronistic, or do you think Hume was basically gesturing at this anyway?

  6. Say Hume never meant the bundle view to do any normative heavy lifting. What piece of textual evidence would actually force you to drop this link between identity and the ethics of suicide?

  7. Finally, what practical difference does this make for real end-of-life policy? I'm concerned this could be used to justify withholding care from people whose identities are already stigmatized as fragmented or less than whole.
