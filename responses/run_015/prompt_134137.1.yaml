answer: |-
  You stand in the bedroom corner where the lease break hinges. The wall is visually pristine and smells of nothing (*pratyakṣa*), and your hygrometer consistently reads a safe 45% humidity, implying no fungal growth (*anumāna*). However, a city housing pamphlet warns that toxic mold often proliferates inside drywall despite surface dryness (*śabda*), and the faint, subtle discoloration near the baseboard matches the specific pattern of the hidden infestation from your last Brooklyn apartment (*upamāna*). You must decide if the invisible risk outweighs the visible safety.

  **The Breakdown**
  *   **Pratyakṣa (Perception):** Reports no black spots, no musty odor. Scope: Immediate sensory data. Verdict: **No Mold.**
  *   **Anumāna (Inference):** Reasons from the sign (*liṅga*) of low humidity to the absence of growth. Scope: Probabilistic logic based on visible conditions. Verdict: **No Mold.**
  *   **Śabda (Testimony):** Relies on the housing authority's expert word that surface dryness is not a reliable indicator of internal safety. Scope: Expert knowledge beyond lay access. Verdict: **Mold.**
  *   **Upamāna (Comparison):** Recognizes the similarity between this baseboard discoloration and the confirmed mold pattern from the Brooklyn unit. Scope: Pattern recognition across contexts. Verdict: **Mold.**

  **The Feature Doing the Work**
  The conflict arises from the **accessibility of the object**. *Pratyakṣa* and *Anumāna* are limited to the *manifest* (surface conditions), while *Śabda* and *Upamāna* bridge the gap to the *unmanifest* (hidden structural reality). The methods aren't malfunctioning; they are operating on different layers of the same reality.

  **The Check**
  If you drop *Upamāna*, the conflict **does not** collapse to agreement. In Nyāya, *Śabda* (reliable testimony) is an independent *pramāṇa*; the expert warning stands valid even without the Brooklyn analogy. You would still have a standoff between sensory evidence and expert authority, though your confidence might waver without the analogical reinforcement. Sorry about the landlord fight—epistemologically, you're on solid ground trusting the testimony over the surface.
