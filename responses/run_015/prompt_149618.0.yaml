  ### Decomposition of P

  Here are the probabilities assigned to the six terms resolving in a manner that supports *P* (that protest-accountability is more defensible), with justifications.

  | Term | Prob. | Justification |
  | :--- | :--- | :--- |
  | **1. Coherence** | 0.90 | It is a stable deontic category (justified breach + duty of restitution) found in just war theory and civil disobedience. |
  | **2. Mapping** | 0.50 | National stereotypes obscure reality; US civil disobedience often accepts punishment (accountability), while German *Gewissensfreiheit* can imply immunity. |
  | **3. Context** | 0.60 | While adaptive to trust levels, wealthy legal orders possess the institutional capacity to sustain accountability without collapse. |
  | **4. Detachability** | 0.70 | Legal and educational reforms can shift this norm without requiring a total revolution in the form of life. |
  | **5. Currency** | 0.80 | Liberal pluralism necessitates a shared language of justification, privileging right relations over pure subjective integrity. |
  | **6. Failure Modes** | 0.65 | In a legally ordered society, courts mitigate the "power shield" risk better than they mitigate the "free-rider" chaos of immunity. |

  ### Combination and Indeterminacy

  These terms are not independent. **Terms 1 (Coherence) and 5 (Currency) are gating conditions**; if either fails, *P* becomes meaningless rather than false. **Term 3 (Context)** determines the domain of validity: if morality is purely adaptive, *P* is indeterminate outside the specific trust-conditions of the "familiar society." The remaining terms (2, 4, 6) function as evidentiary weights that adjust the confidence level within the bounds set by the gates.

  **Reading the Number:** My resulting figure assumes the gating conditions hold and the society matches your description (wealthy, legally ordered). If Term 3 resolves toward pure adaptation, my number reads as a conditional probability: *given* these institutional preconditions, accountability is preferable.

  ### Resulting Figure for P

  **0.68**

