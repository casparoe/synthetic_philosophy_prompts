  **Most Sensitive Term:** Term 6 (Failure Modes).
  **Single Piece of Evidence:** Comparative data on the demographic profile of successful conscientious objectors versus those punished under both regimes. If accountability regimes systematically silence marginalized groups while immunity regimes merely enable the privileged, *P* collapses toward 0.20; if the reverse holds, *P* rises toward 0.90.

  ### Diagnosis of Disagreement

  **Where the Disagreement Lives:** Term 5 (Currency/Purpose).
  Your colleague (American) likely views morality primarily as the **protection of individual integrity** against the collective, making immunity the only safeguard against tyranny. You (German/British) likely view morality as the **maintenance of right relations**, making accountability the only safeguard against social fragmentation.

  **Path to Convergence:**
  *   **She must concede:** That integrity exercised without accountability isolates the moral agent from the community they claim to serve, turning conscience into a private luxury.
  *   **You must concede:** That demanding an account from the powerless can function as a sophisticated form of suppression, and that immunity is sometimes the only refuge for the marginalized when institutions are corrupt.
