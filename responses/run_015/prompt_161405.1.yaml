answer: |-
  **The Case**

  Patient K presents with a selective lesion to the lateral spinothalamic projections terminating in the primary somatosensory cortex, while medial projections to the anterior cingulate and insula remain intact. When subjected to calibrated noxious heat or pressure, K exhibits no withdrawal reflexes, cannot localize the stimulus to a limb, and reports no qualitative character (no 'burning' or 'stabbing'), distinguishing the state from non-noxious touch only by the magnitude of distress it causes. Despite this sensory void, K rates the experience as intensely unpleasant, demands analgesia, and will forfeit significant monetary rewards to terminate the stimulation, confirming the state is graded by stimulus intensity and functions as a specific aversive modality rather than generalized anxiety or mood.

  **The Demonstration**

  An **Attitudinal or Desire-Based Theory** constitutes pain's essence in the subject's negative stance toward the experience. For this account, K is unequivocally in pain, and the state is bad for them. The verdict follows directly because the constitutive condition—the desire for the state to cease and the experienced unpleasantness—is met in full, while the absence of sensory content is irrelevant to the metaphysics of pain on this view.

  Conversely, a **Pure Sensory-Quality View** identifies pain with a distinctive somatic phenomenology possessing location and qualitative character. This account must verdict that K is not in pain. Since the lesion explicitly removes the sensory-discriminative content that constitutes the pain state on this theory, what remains is merely a reactive distress; without the specific qualia, the state cannot be pain, regardless of its causal origin or aversive power.

  **Imperativism** faces a parallel failure. It defines pain as a perceptual experience with imperative content commanding protection of a specific body part (e.g., "Protect the hand!"). Because K lacks localization and exhibits no guarding or withdrawal, there is no somatic target for the command. The theory cannot accept the state as pain without abandoning its core claim that pain guides specific protective action. The cheapest escape route—positing a vague imperative like "Something is wrong somewhere"—is closed by the theory's own commitment to action-guidance: an imperative without a somatic referent cannot generate the specific motor policies (guarding, withdrawal) that imperativism posits as the function of pain content. Without a target, there is no command, and thus no pain.

  **The Single Feature and Strongest Reply**

  The single feature doing the work is the **dissociation of affective-motivational integrity from sensory-discriminative absence**. If sensory content were restored, the Sensory and Imperativist views would count the state as pain; if the aversive stance were removed, the Attitudinal view would deny the badness. The strongest reply available to the imperativist is to deny the mirror-image symmetry: they should argue that K is not in a state of "pain without location," but rather in a state of *undifferentiated suffering* caused by nociception. On this reply, asymbolia is pain without hurt, but K's case is hurt without pain; the badness is real, but it belongs to a distinct category of affect, preserving the link between pain proper and bodily imperatives.
