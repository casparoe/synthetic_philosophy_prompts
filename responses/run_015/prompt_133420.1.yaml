answer: |-
  ### I. Disciplined Mapping

  Applying the bilateral-commitment model to the three moments of impunity in the Argentine sequence yields the following structural breakdown.

  **1. The Junta's Self-Amnesty (Law 22.924, September 1983)**
  *   **Promisor:** The Military Junta (acting as the State).
  *   **Promisee:** The Military Junta (acting as private individuals).
  *   **Consideration:** None. There is no second party to provide consideration. It is a unilateral decree attempting to bind a future sovereign.
  *   **Third Parties:** The victims/citizens (excluded from the bargain).
  *   **Breach:** Any act by a successor government to annul the law or prosecute.
  *   **Model Status:** **Failure.** The model requires a bargain between outgoing and incoming power. Here, the outgoing power attempts to bind an incoming power that is not yet at the table and provides nothing in return.

  **2. The Full Stop and Due Obedience Statutes (1986–1987)**
  *   **Promisor:** The Alfonsín Administration and Democratic Congress.
  *   **Promisee:** The Military Institution (already out of office).
  *   **Consideration:** Forbearance from a renewed coup (specifically, quelling the *Carapintada* uprisings). *Not* the handover of power, which had already occurred.
  *   **Third Parties:** The victims (whose right to justice is traded for regime stability).
  *   **Breach:** The resumption of prosecutions (which occurred legislatively in 2003 and judicially in 2005).
  *   **Model Status:** **Fit.** This matches the bilateral structure: the democratic state purchases security from the coercive apparatus in exchange for immunity.

  **3. The Menem Pardons (1989–1990)**
  *   **Promisor:** The Executive (Menem).
  *   **Promisee:** Convicted Officers and Guerrilla Leaders.
  *   **Consideration:** "National Reconciliation" (social peace and the removal of the military as a political veto player).
  *   **Third Parties:** The victims.
  *   **Breach:** The nullification of the pardons' effects via subsequent prosecutions (post-2003).
  *   **Model Status:** **Fit.** A classic executive bargain to secure governability, symmetric in form (covering both sides of the conflict) to broaden the coalition of immunity.

  ### II. What the Model Explains Well

  The bilateral-commitment model captures three specific dynamics of the Argentine sequence that purely moralistic accounts miss.

  1.  **The Lateness of the Amnesty:** The model explains why the effective amnesties (1986/87) were not part of the initial transition pact. The commitment problem was not solved at T0 (December 1983) because the military believed it could retain veto power without a formal guarantee. The amnesty was only required at T1 (1987) when the cost of coercion (the uprisings) threatened to overturn the transfer. The model correctly identifies amnesty as a function of *leverage*, not necessarily of timing.
  2.  **Punishment Preceding Impunity:** Standard theory often assumes amnesty clears the deck *before* justice. In Argentina, the Trial of the Juntas occurred *before* the statutes. The model explains this as a renegotiation. The initial bargain (transfer for no prosecution) was violated by Alfonsín (prosecutions); the military responded with force (uprisings); the state responded with the statutes (renegotiated bargain). The model treats this not as a deviation but as a dynamic equilibrium of coercive power.
  3.  **Symmetric Treatment:** The Menem pardons covered guerrilla commanders alongside junta leaders. The bilateral model predicts this symmetry: to secure a stable contract, the promisor must neutralize all armed factions capable of disrupting the peace. Even though the *Nunca Más* report established an asymmetry of terror (state terrorism vs. insurgency), the *contract* required symmetry to be legally robust and politically defensible as a "peace treaty." The model explains the legal form even where it contradicts the moral record.

  ### III. Where the Model Misdescribes

  1.  **Collapse vs. Pact (1983):** The model assumes a handover negotiated between parties. The Argentine transition was a collapse following the Falklands defeat. The self-amnesty was a unilateral retreat, not a bilateral commitment. The model cannot account for the initial annulment of Law 22.924 because, in its terms, there was no contract to annul—only a decree to repeal.
  2.  **The Status of Victims:** The model treats victims as "subject matter." In Argentina, victims (Mothers of Plaza de Mayo, HIJOS) became active veto players. They were not merely third parties suffering the externalities of a bargain; they were agents who eventually destabilized the bargain through *escraches* and litigation. The model lacks a variable for third-party agency that alters the cost-benefit analysis of the promisor.
  3.  **The Self-Amnesty:** As noted in the mapping, a self-amnesty has no promisee. The model defines amnesty as a device for solving a commitment problem *between* rivals. A self-amnesty is an attempt to solve a commitment problem with oneself (credibility), which the model does not accommodate.

  ### IV. Stress Testing the Revisions

  Here we test your three revisions against the Argentine sequence and the South African contrast (where amnesty was conditional on truth-telling and granted *at* the moment of transfer).

  **1. The Duress Revision**
  *   *Thesis:* Concessions extracted under immediate threat of violence are voidable.
  *   *Test:* This perfectly justifies the 2003 annulment and 2005 Supreme Court ruling. The 1987 statutes were passed while rebels held army barracks; this is textbook duress.
  *   *Prediction:* It predicts that amnesties granted during stable periods (e.g., Uruguay 1989 referendum) are valid, while those granted under fire (Argentina 1987) are void.
  *   *Problem:* In transitional contexts, *all* amnesties are granted under some degree of structural threat (implicit coup risk). If "duress" includes the background threat of instability, this revision invalidates nearly every amnesty ever granted.
  *   *Verdict:* This is a **reductio ad absurdum** for a *functional* model. If the model's revision renders the phenomenon it studies legally null in almost all instances, it ceases to be a model of the phenomenon and becomes a moral critique of it. However, if restricted to *episodic, armed* duress (the *Carapintada* uprisings) rather than *structural* duress (general instability), it holds. Argentina fits the episodic category; South Africa fits the structural category (negotiated settlement).

  **2. The Intertemporal Constraint**
  *   *Thesis:* A legislature cannot bind its successors; therefore, amnesty cannot deliver finality.
  *   *Test:* This explains why the military accepted the 1987 laws despite the theoretical possibility of reversal. They were buying risk reduction, not absolute immunity. It explains why the 2003 Congress felt entitled to annul the 1986 laws.
  *   *Prediction:* It predicts that amnesty beneficiaries will always seek to entrench their immunity constitutionally (which the Argentine military tried to do) and that successors will always test the boundaries.
  *   *Comparison:* In South Africa, the amnesty was tied to the TRC process, creating an evidentiary record that made reversal politically costly even if legally possible. In Argentina, the "finality" was purely legal, making it easier to unwind.
  *   *Verdict:* This is descriptively accurate but undermines the "finality" goal of your original model. It suggests the model's core variable (finality) is a fiction sold to the promisee.

  **3. The Moratorium Revision**
  *   *Thesis:* Amnesty is a purchase of time, not finality. It pauses justice until the balance of forces shifts.
  *   *Test:* This is the **least ad hoc** revision. It fits the Argentine arc perfectly: 1987 (Military strong) → Amnesty; 1990s (Civil society builds power) → *Escraches*/Truth Trials; 2003 (Military weak/Political will) → Prosecution.
  *   *Prediction:* It predicts that prosecutions will reopen not when "justice demands it," but when the cost of prosecuting falls below the cost of maintaining immunity (i.e., when the military can no longer coup). This matches the 2003 shift under Kirchner.
  *   *Comparison:* South Africa fits less well here. The SA bargain was intended as finality (truth for amnesty), whereas Argentina was explicitly temporary (peace for now).
  *   *Verdict:* This revision saves the model. It redefines the "good" being purchased from *finality* to *stability*.

  **Post-2003 Check:** The Moratorium revision is confirmed by the post-2003 sequence. If the 1987 laws were a "contract," 2003 was a breach. If they were a "moratorium," 2003 was the expiry of the term. The fact that prosecutions resumed without triggering a coup confirms that the balance of forces had shifted, validating the moratorium hypothesis.

  ### V. The Silence of the Model

  The model is silent on the **expressive and evidentiary work** of the 1990s.

  During the period of impunity (1989–2003), Argentine courts developed "truth trials" (*juicios por la verdad*), and social movements deployed the *escrache*. These mechanisms achieved censure and fact-finding without punishment. The bilateral-commitment model has no vocabulary for this. In your model, the value of the bargain is the cessation of coercive contestation (prosecution vs. coup). It treats legal processes as instrumental to punishment or immunity. It cannot account for legal processes undertaken *solely* for narrative construction when punishment is off the table.

  **Can a model with this gap be the right account?**
  No. The Argentine case demonstrates that the function of transitional measures is not merely the management of coercive power (the bargain), but the management of **meaning**. The "truth trials" kept the claim of justice alive without triggering the military threat, effectively lowering the political cost of the eventual 2003 reversal. If the model ignores this, it cannot explain *how* the moratorium ended. It explains why the amnesty started (coercive balance) and why it ended (coercive balance), but it cannot explain the mechanism of the shift (normative erosion of the military's legitimacy).

  A model that treats amnesty solely as a contract over coercive power misses the cultural work that makes the contract reversible. The Argentine sequence suggests that amnesty is not just a bargain for peace, but a **temporary suspension of a narrative contest**. The model must be expanded to account for the fact that the "consideration" paid by the victims during the moratorium was not silence, but a transformed public record that eventually made the amnesty politically unsustainable. Without this, the model describes the cage, but not the key.
