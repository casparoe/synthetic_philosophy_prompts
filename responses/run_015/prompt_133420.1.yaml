      *   *Verdict:* A model that ignores this cannot fully explain the *function* of the transition. The function wasn't just stopping violence (coercive); it was managing meaning (expressive). If the model only sees power bargains, it misses the cultural work that made the 2003 reversal possible. The "Moratorium" revision helps, but only if it acknowledges that the "time purchased" was used for *narrative building*, not just waiting for power shifts.

