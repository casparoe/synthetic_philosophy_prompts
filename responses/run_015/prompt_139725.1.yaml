  **Total Mark: 20 / 25**

  **(a) 6 / 8**
  You correctly assess TABLEAU on all three conditions and ORACLE on SN and AD. However, your verdict on ORACLE/CO contradicts the prompt's definition of CO ("It is not enough that the system's sequence of states matches"), which explicitly rules out ORACLE's search procedure despite sequence identity.

  **(b) 4 / 7**
  You follow the instruction to accept the objection and clearly identify the cost (TABLEAU realizes C). However, your argument relies on a conflation of substrate (what a system is made of) with causal organization (how it is arranged), which SN presupposes are separable. The claim about the motives of CO's defenders is an unsupported assertion.

  **(c) 10 / 10**
  Excellent work. (i) is consistent with your earlier verdicts. (ii) draws a precise and correct distinction between metaphysical facts and epistemic ethical obligations. (iii) provides a standard, defensible argument (the interest principle) for the negative verdict allowed by the question.

  ***

  **Marginal Comments**

  **Line 1.** Correct on all counts for TABLEAU. Your reason for CO correctly identifies the lack of causal propagation between states.
  **Line 2.** **Error.** The prompt defines CO as requiring states to bring about successors *in the way C specifies* (MERIDIAN's architecture), explicitly stating sequence matching is *not enough*. ORACLE matches the sequence but not the causal organization (search vs. parallel update). Your reason contradicts the text provided.
  **Line 3.** **Conflation.** SN claims substrate doesn't matter *given* a causal structure; it does not claim substrate and structure are identical. Arguing they are "not separable" undermines the possibility of multiple realizability which SN assumes.
  **Line 4.** Good identification of the cost. Accepting the objection forces you to abandon the distinctions in (a), which you acknowledge.
  **Line 5.** Consistent with your verdict in (b). Since you argued CO collapses into SN, TABLEAU's lack of causal organization no longer excludes it from realizing C.
  **Line 6.** **Strong.** You correctly separate the ontological question (does it meet CO?) from the normative question (what do we owe given uncertainty?). This avoids the slide you identify.
  **Line 7.** Defensible position. You explain why there could be no such thing (no experiences = no interests = no direct moral status), which satisfies the prompt's option. Note that this assumes certainty ("realizes no computation"), which is consistent with your uncertainty argument in (ii).
