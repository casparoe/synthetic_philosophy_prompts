prompt: |-
  I sit on the technical advisory panel of a private conservation funder whose charter was recently amended to add the welfare of wild animals as an objective alongside biodiversity and carbon. The amendment is easy to read and hard to use. It tells us to weigh wild animal welfare but not how, and every concrete decision in front of us turns on the same unresolved cluster of questions: whether draining a coastal wetland for rice paddy reduces suffering or merely relocates it, whether poisoning the rats on a seabird island is a welfare gain or a massacre, whether planting conifers on abandoned pasture creates welfare or destroys it, whether vaccinating a wild herd against a disease counts as a benefit when it works by preventing lives from existing.

  Before we commission any modeling, I want the specification. Write the desiderata that any adequate account of the net welfare of an ecosystem must meet: what a theory has to deliver to be good enough for our purpose, which is to rank land-use interventions competing for a fixed five-year budget, and to return a reasoned not-yet-determinable in the cases where it cannot honestly rank them.

  Fix the purpose as above, and assume the following background, which the panel treats as settled. Invertebrate sentience is unresolved. There is no cardinal interspecies scale of welfare, and no prospect of individual-level welfare data at landscape scale: what we can obtain are abundances, life histories, and remote sensing. Population size and age structure are endogenous to whatever we do, so the ledger cannot hold fixed the set of animals it is assessing. Effects propagate past the project boundary and past the budget window, and the systems are rarely at equilibrium.

  Give me the requirements as a numbered list, each with the case or background consideration that motivates it, and be specific about the distinctions it forces. I expect at least these to be addressed: the difference between how well a life goes, how many lives there are, and how long they last; the difference between the welfare of the animals in a place and the value or integrity of the place itself; the fact that an index denominated in animals, or in biomass per hectare, is not yet an index of welfare; the choice about whether death is a loss to the animal who dies or merely the termination of a future, and how much of a verdict's sign depends on that choice; the fact that interventions change who exists later, so the counterfactual is not a fixed population with a different welfare level; displacement of harm outside the assessed boundary; and sensitivity of the verdict to the spatial boundary, the time horizon, and the cut-off for which organisms count at all.

  For each requirement say whether it is non-negotiable, negotiable, or a preference of one camp dressed up as a requirement. Some candidate demands I want ruled in or out explicitly: that the account never recommend killing a sentient animal; that it treat intactness or naturalness as carrying independent weight; that it never aggregate across species; that it reproduce the judgment that a functioning ecosystem is a good thing; that it be expressible without any claim about which animals have lives worth living.

  A consultant has proposed that we simply rank projects by expected net welfare-years per hectare-year, integrated over a century and discounted at three percent, with each animal weighted by the probability that it is sentient. Use that proposal as the stalking horse: state what such an index would have to presuppose, and where it meets or fails the list you have built.

  Two further things I care about more than the rest. First, whether some subset of the desiderata cannot be jointly satisfied, so that the specification is itself a negative result: say which, and what would have to be given up. I suspect there is a deep tension between being fine-grained enough to discriminate between interventions and being computable from the coarse data we can actually get. Second, which single requirement does the most work in excluding otherwise attractive candidates.

  Close with a compact table, no more than a few lines each, scoring four families of approach against the most discriminating requirements: suffering-focused consequentialism, totalist hedonic accounting over wild populations, biodiversity- or integrity-based views that treat welfare as downstream of ecological condition, and views that constrain what may be done to wild animals regardless of the arithmetic. Keep the weight on the criteria rather than the scoring. Argue from the cases; do not cite anything.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Technical Advisory Panel member for a private conservation funder.
      *   **Context:** Charter amended to include wild animal welfare alongside biodiversity and carbon.
      *   **Problem:** The amendment is vague ("weigh wild animal welfare but not how"). Concrete decisions (wetland drainage, rat poisoning, conifer planting, vaccination) turn on unresolved ethical and methodological questions.
      *   **Task:** Write a specification of *desiderata* (requirements) for any adequate account of net ecosystem welfare.
      *   **Constraints/Background:**
          *   Purpose: Rank land-use interventions for a fixed 5-year budget.
          *   Output: Ranked list OR "reasoned not-yet-determinable."
          *   Invertebrate sentience: Unresolved.
          *   No cardinal interspecies welfare scale.
          *   No individual-level data (only abundances, life histories, remote sensing).
          *   Population size/structure are endogenous (change based on intervention).
          *   Effects propagate beyond boundary and time window; non-equilibrium systems.
      *   **Required Content:**
          *   Numbered list of requirements with motivation (case/background) and specific distinctions forced.
          *   Must address specific topics: quality vs. quantity vs. duration of life; animal welfare vs. place value; biomass/abundance $\neq$ welfare; death (loss vs. termination); non-identity problem (interventions change who exists); displacement of harm; sensitivity to boundaries/time/cut-offs.
          *   Classification: Non-negotiable, Negotiable, or Preference dressed as requirement.
          *   Explicitly rule in/out candidate demands (e.g., never kill, intactness weight, no aggregation, functioning ecosystem = good, no claims about lives worth living).
          *   Critique the Consultant's Proposal (Net welfare-years/hectare-year, 100yr, 3% discount, sentience probability).
          *   Identify impossibility results/tensions (fine-grained vs. computable).
          *   Identify the single most excluding requirement.
          *   Closing Table: Score 4 approaches (Suffering-focused, Totalist Hedonic, Biodiversity/Integrity, Deontological/Constraints) against key criteria.
          *   Style: Argue from cases, do not cite.

  2.  **Deconstruct the Ethical & Methodological Challenges:**

      *   *The Non-Identity Problem:* Interventions change population sizes. Comparing State A (1000 animals, good life) vs. State B (500 animals, great life) isn't just summing welfare. It's comparing different sets of individuals.
      *   *The Measurement Gap:* We have ecology data (biomass, counts), not experience data (pain, pleasure). Bridging this requires assumptions.
      *   *The Boundary Problem:* Killing rats on an island helps seabirds but kills rats. Does the harm stop at the water's edge? What about displaced rats?
      *   *The Time Problem:* 5-year budget vs. 100-year impact. Discounting welfare is ethically contentious.
      *   *The Aggregation Problem:* How to sum a mouse's suffering against an eagle's?
      *   *The "Naturalness" Trap:* Is a wild death worse than a human-caused death? Is a "natural" ecosystem inherently better for welfare? (Often no, nature is red in tooth and claw).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: Welfare vs. Existence.* Need to separate how good a life is from whether it exists. Motivation: Vaccination case (prevents lives).
      *   *Req 2: Death Valuation.* Is death a harm? Motivation: Rat poisoning.
      *   *Req 3: Spatial/Temporal Boundaries.* Leakage and discounting. Motivation: Wetland drainage (displacement).
      *   *Req 4: Sentience Cut-off.* Invertebrates. Motivation: Data limitations.
      *   *Req 5: Aggregation.* Interspecies comparison. Motivation: No cardinal scale.
      *   *Req 6: Ecological Integrity vs. Welfare.* Distinct values. Motivation: Conifer planting (good for carbon/birds, bad for welfare?).
      *   *Req 7: Computability.* Must work with coarse data. Motivation: Panel reality.

      *Refining Classifications:*
      *   "Never kill" is likely a preference/constraint, not a welfare metric requirement.
      *   "Intactness weight" is a preference (ecocentric vs. sentientist).
      *   "No aggregation" makes ranking impossible (non-negotiable for the *purpose* of ranking, but ethically negotiable).
      *   "Functioning ecosystem = good" is a heuristic, not a welfare truth.

  4.  **Critiquing the Consultant's Proposal:**

      *   *Proposal:* Welfare-years/hectare-year, 100yr, 3% discount, sentience probability.
      *   *Failures:*
          *   Assumes welfare is proportional to time (ignores intensity).
          *   Assumes we can measure welfare-years from abundance data (Measurement Gap).
          *   Discounting welfare is ethically dubious (Non-negotiable?).
          *   Sentience probability weighting is clever but doesn't solve the intensity scale.
          *   Ignores non-identity (treats population as fixed bucket).
          *   Hectare normalization ignores displacement (leakage).

  5.  **Identifying Tensions (Impossibility Results):**

      *   *Tension:* Precision (fine-grained welfare) vs. Data (coarse ecology). We want to know suffering, we only have biomass.
      *   *Tension:* Non-identity vs. Ranking. If interventions create different individuals, how do we compare total welfare without implausible metaphysics?
      *   *Tension:* Boundary sensitivity. If the verdict flips based on where we draw the line, the metric is unstable.

  6.  **Developing the "Most Excluding Requirement":**

      *   Likely the requirement to *distinguish welfare from existence* combined with *endogenous populations*. This kills simple utilitarian sums. Or the requirement to *acknowledge data limitations* which kills complex experiential models. Let's go with the **Non-Identity/Data Gap tension**. Specifically: The requirement to evaluate welfare without assuming a fixed population *and* without individual experiential data.

  7.  **Drafting the Table:**

      *   Rows: The 4 approaches.
      *   Cols: Key Desiderata (e.g., Handles Non-Identity, Data Compatible, Boundary Robust).
      *   Scores: Pass/Fail/Partial.

  8.  **Refining the Tone:**

      *   Professional, rigorous, philosophical but practical.
      *   Avoid academic citations.
      *   Focus on the "specification" aspect (engineering/ethics hybrid).

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the vaccination case? Yes, under existence vs. welfare.
      *   *Check:* Did I address the rat poisoning case? Yes, under death valuation.
      *   *Check:* Did I address the wetland drainage? Yes, under displacement/boundaries.
      *   *Check:* Did I address the conifer planting? Yes, under integrity vs. welfare.
      *   *Check:* Did I classify requirements as Non-negotiable/Negotiable/Preference? Yes.
      *   *Check:* Did I critique the consultant's specific formula? Yes.
      *   *Check:* Is the table compact? Yes.

      *Critical thought on the "Non-Identity" problem:* This is the hardest part. If we vaccinate, fewer animals exist. If we say "existence is neutral," we might prefer fewer animals if their lives are hard. If we say "existence is good," we might prefer more animals even if suffering. The specification needs to force the panel to choose a stance on the *value of existence* separate from the *quality of existence*.

      *Critical thought on the Consultant's Discount Rate:* Discounting welfare at 3% implies a life saved in year 10 is worth less than a life saved in year 1. This is standard economics but ethically fraught for welfare. I should flag this as a major failure point.

      *Critical thought on "Invertebrate Sentience":* The spec must handle uncertainty without paralysis. A "probability weighting" (as the consultant suggests) is one way, but declaring a cutoff is another. The spec should require *explicit handling of uncertainty*, not necessarily a specific method.

  10. **Final Polish:** Ensure the distinctions are sharp. "Biomass is not Welfare" is a key mantra here. "Integrity is not Welfare" is another.

      *(Self-Correction on the Table)*: Keep it very tight. Focus on the "Most Discriminating Requirements" identified in the text.

      *(Self-Correction on Impossibility)*: Be honest. We cannot have high-resolution welfare metrics from low-resolution ecological data. The spec must admit this leads to "not-yet-determinable" verdicts often.

      *(Final check on constraints)*: "Do not cite anything." "Argue from the cases." "Numbered list." "Compact table."

      Let's assemble.

      *Structure:*
      1. Introduction (Setting the stage).
      2. Desiderata List (Numbered, with motivation, distinction, classification).
      3. Critique of Consultant's Proposal.
      4. Impossibility/Tension Analysis.
      5. Most Excluding Requirement.
      6. Comparative Table.

      *Drafting content...*
      *Req 1: Separation of Welfare and Existence.* (Vaccination case).
      *Req 2: Valuation of Death.* (Rat poisoning).
      *Req 3: Boundary Neutrality/Leakage.* (Wetland drainage).
      *Req 4: Data Proxy Validity.* (Biomass != Welfare).
      *Req 5: Sentience Uncertainty.* (Invertebrates).
      *Req 6: Integrity Independence.* (Conifers/Carbon vs Welfare).
      *Req 7: Time Horizon Consistency.* (Discounting).

      *Consultant Critique:* Fails on Death (assumes years = value), Fails on Leakage (hectare normalization), Fails on Data (assumes welfare measurable from abundance).

      *Tension:* Resolution vs. Computability.
      *Most Excluding:* Data Proxy Validity (Biomass != Welfare).

      *Table:* Suffering-focused, Totalist, Integrity, Constraints.

      *Wait, one nuance:* The prompt asks to "Fix the purpose... rank land-use interventions... return a reasoned not-yet-determinable." The spec must allow for indecision.

      *Let's write.*
answer: |-
  ### Specification for Ecosystem Welfare Accounting

  **Purpose:** To rank land-use interventions for a fixed five-year budget or return a "reasoned not-yet-determinable" verdict.
  **Background Constraints:** Invertebrate sentience unresolved; no cardinal interspecies welfare scale; no individual-level data (only abundance, life history, remote sensing); endogenous populations; non-equilibrium systems; effects propagate beyond boundary and time.

  ---

  ### I. Desiderata for an Adequate Account

  1.  **Separation of Welfare and Existence**
      *   **Motivation:** The vaccination case. Preventing disease prevents suffering but also prevents the existence of animals that would have been born to replace those who died. A metric that conflates "more welfare" with "more animals" cannot distinguish between improving a life and creating a life.
      *   **Distinction Forced:** The account must distinguish the *quality* of a life (how well it goes) from the *fact* of a life (that it exists). It must specify a baseline for non-existence (neutral, negative, or positive) to determine if preventing a birth is a gain, loss, or null event.
      *   **Classification:** **Non-negotiable.** Without this, the vaccination case and the rat poisoning case (which reduces population) become mathematically incoherent.

  2.  **Explicit Valuation of Death**
      *   **Motivation:** The rat poisoning case. Is the death of a rat a negative welfare event (suffering during death + loss of future positive experience) or merely the termination of a future vessel for welfare? If death is merely a closure, poisoning is neutral or positive if it prevents future suffering. If death is a harm, poisoning incurs a cost.
      *   **Distinction Forced:** The account must state whether death constitutes a welfare loss to the subject *independent* of the suffering involved in the dying process. It must determine if the "loss of future" counts against the intervention.
      *   **Classification:** **Non-negotiable.** The sign of the verdict on lethal control depends entirely on this.

  3.  **Boundary Neutrality (Leakage Accounting)**
      *   **Motivation:** The wetland drainage case. Draining a wetland may reduce suffering within the project boundary by removing habitat, but if it displaces animals to a neighboring swamp where conditions are worse, net welfare may decrease.
      *   **Distinction Forced:** The account must distinguish between *local* welfare density and *system-wide* welfare impact. It cannot treat the project boundary as a moral container.
      *   **Classification:** **Non-negotiable.** A metric that rewards displacing harm is not a welfare metric; it is a bookkeeping trick.

  4.  **Proxy Validity (Biomass $\neq$ Welfare)**
      *   **Motivation:** The conifer planting case. High biomass or high abundance does not entail high welfare. A dense population of stressed, starving animals has high biomass but negative welfare. Remote sensing can measure greenness, not pain.
      *   **Distinction Forced:** The account must distinguish ecological *capacity* (how many animals can be supported) from experiential *outcome* (how those animals feel). It cannot use abundance or biomass as a direct proxy for welfare without a mediating model of life quality.
      *   **Classification:** **Non-negotiable.** To treat biomass as welfare is a category error that invalidates the charter's welfare objective.

  5.  **Sentience Uncertainty Handling**
      *   **Motivation:** Invertebrate sentience is unresolved. Ignoring them risks massive uncounted suffering; counting them as fully sentient risks misallocating resources based on false positives.
      *   **Distinction Forced:** The account must distinguish between *ontological status* (are they sentient?) and *decision weight* (how do we act under uncertainty?). It must specify a rule for weighting organisms by probability of sentience or exclude them by a defensible cutoff.
      *   **Classification:** **Negotiable.** The panel can choose a precautionary principle (weight by probability) or a threshold (exclude until proven), but it cannot ignore the uncertainty.

  6.  **Integrity Independence**
      *   **Motivation:** The conifer planting case. An "intact" or "natural" ecosystem may be high in biodiversity but rife with predation, disease, and starvation. A managed system might be "unnatural" but higher in welfare.
      *   **Distinction Forced:** The account must distinguish the *value of the place* (integrity, naturalness, biodiversity) from the *welfare of the inhabitants*. It must not assign independent positive weight to "wildness" unless explicitly mandated as a separate objective from welfare.
      *   **Classification:** **Preference dressed as requirement.** Many conservationists want naturalness to count, but for *welfare accounting*, naturalness is instrumentally relevant only insofar as it correlates with welfare. It must not be a independent variable in the welfare sum.

  7.  **Time Horizon Consistency**
      *   **Motivation:** The 5-year budget vs. 100-year impact. Discounting future welfare at a financial rate (e.g., 3%) implies a life saved next decade is worth less than a life saved today.
      *   **Distinction Forced:** The account must distinguish between *economic discounting* (time value of money) and *moral discounting* (time value of suffering). It must specify if welfare occurring outside the budget window is counted, and if so, at what rate of depreciation.
      *   **Classification:** **Negotiable.** Pure utilitarianism rejects discounting welfare; practical funding cycles require it. The specification must force a choice, not hide it.

  8.  **Computability from Coarse Data**
      *   **Motivation:** We have abundances and life histories, not experience reports. A theory requiring individual pain logs is useless.
      *   **Distinction Forced:** The account must distinguish between *theoretical completeness* and *operational feasibility*. It must be expressible using available ecological proxies (mortality rates, body condition, density) without claiming those proxies are perfect measures of experience.
      *   **Classification:** **Non-negotiable.** A metric we cannot calculate cannot rank interventions.

  9.  **Permission for Indeterminacy**
      *   **Motivation:** The unresolved cluster of questions. Sometimes the data is too coarse, or the ethical weights too contested, to produce a ranking.
      *   **Distinction Forced:** The account must distinguish between *ignorance* (we lack data) and *incommensurability* (the values conflict fundamentally). It must allow a output of "not-yet-determinable" without treating it as a failure of the process.
      *   **Classification:** **Non-negotiable.** Honesty requires this given the background constraints.

  ---

  ### II. Ruling on Candidate Demands

  *   **That the account never recommend killing a sentient animal:** **Ruled Out.** This is a deontological constraint, not a welfare accounting metric. In the rat poisoning case, killing rats may be the only way to prevent greater suffering (of seabirds or the rats themselves via starvation). A welfare metric must be able to calculate that killing reduces net suffering.
  *   **That it treat intactness or naturalness as carrying independent weight:** **Ruled Out.** See Desideratum #6. This conflates biodiversity objectives with welfare objectives. If the charter wants both, they must be scored separately and weighted, not baked into the welfare definition.
  *   **That it never aggregate across species:** **Ruled Out.** If we cannot aggregate, we cannot rank. We would have a vector of welfare changes (mice: -10, eagles: +5) with no method to resolve the trade-off. This makes the budget allocation impossible.
  *   **That it reproduce the judgment that a functioning ecosystem is a good thing:** **Ruled Out.** "Functioning" is an ecological term, not a welfare term. A functioning predator-prey cycle involves immense suffering. The metric must be able to verdict a functioning ecosystem as net negative if the suffering outweighs the satisfaction.
  *   **That it be expressible without any claim about which animals have lives worth living:** **Ruled In.** The metric should not require adjudicating whether a life is "worth living" in a cosmic sense, only whether it contains more positive or negative experience relative to a baseline. It must avoid metaphysical claims about the value of existence itself, focusing on the experiential content.

  ---

  ### III. Critique of the Consultant's Proposal

  **Proposal:** Rank by expected net welfare-years per hectare-year, integrated over a century, discounted at 3%, weighted by sentience probability.

  **Presuppositions:**
  1.  Welfare is linearly proportional to time (a year of life = 1 unit).
  2.  Welfare can be estimated from hectare-level data.
  3.  Future welfare is morally less valuable than present welfare (3% discount).
  4.  Populations are stable enough to integrate over a century.

  **Failures against Desiderata:**
  *   **Fails #1 (Existence vs. Welfare):** By summing "welfare-years," it treats the creation of a new animal with a neutral life as a zero-gain, but a new animal with a positive life as a gain. It struggles with the vaccination case where preventing birth prevents the "years" from existing. It implicitly adopts a Totalist view that more positive years are always better, which may conflict with suffering-focused priorities.
  *   **Fails #2 (Death):** It treats death as the cessation of welfare-years. It does not account for the *process* of dying (the poisoning) as a distinct negative spike, only as a truncation of the integral.
  *   **Fails #3 (Boundary):** "Per hectare" normalization invites leakage. It rewards concentrating suffering outside the hectare or displacing animals to adjacent hectares. It is not boundary-neutral.
  *   **Fails #4 (Proxy Validity):** It assumes "expected net welfare" can be derived from the data available. It does not specify the bridge from "abundance" to "welfare intensity." It risks equating high abundance with high welfare.
  *   **Fails #7 (Time):** A 3% discount rate on welfare is ethically indefensible for many panelists. It implies preventing suffering in year 20 is worth half as much as preventing it in year 10. This is a financial constraint, not a welfare truth.
  *   **Fails #8 (Computability):** Integrating over a century for non-equilibrium systems with endogenous populations is speculative modeling, not calculation. It creates a false precision.

  ---

  ### IV. Impossibility Results and Tensions

  **The Tension:** There is a deep tension between **Desideratum #1 (Separation of Welfare and Existence)** and **Desideratum #8 (Computability from Coarse Data)**.

  To separate welfare from existence, we need to know the *counterfactual*: who would have existed if we did nothing? Because populations are endogenous, the "do nothing" scenario does not preserve a fixed set of individuals. It produces a different set. To calculate the net welfare change, we must compare the welfare of Actual Animals vs. Counterfactual Animals.
  However, our data (abundance, remote sensing) tells us about *states of the habitat*, not *identities of individuals*. We cannot track the counterfactual individuals.
  Therefore, any model we build must assume that the *average* welfare of the counterfactual population is comparable to the actual population, or that the identity of the individuals does not matter (Impersonal Totalism).
  **The Negative Result:** We cannot satisfy the requirement for a fine-grained, individual-sensitive welfare accounting *and* the requirement for computability from coarse ecological data. We must give up the claim that we are measuring the welfare of *specific* animals. We are measuring the welfare *potential* of a state of affairs.

  **The Single Most Excluding Requirement:**
  **Desideratum #4 (Proxy Validity: Biomass $\neq$ Welfare).**
  This requirement excludes the majority of existing ecological metrics. Standard conservation metrics (biomass, carrying capacity, species richness) are designed to measure ecological health, not experiential welfare. By insisting that biomass is not welfare, we exclude almost all off-the-shelf ecological models. We force the development of a new bridge model that links life-history traits (mortality rates, growth rates, disease prevalence) to welfare proxies. This is the highest barrier to entry for any proposed methodology.

  ---

  ### V. Comparative Scoring of Approaches

  | Approach | Separation of Welfare/Existence (#1) | Proxy Validity (#4) | Boundary Neutrality (#3) | Computability (#8) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Suffering-Focused Consequentialism** | **Pass.** Explicitly prioritizes reduction of suffering over creation of happy lives. | **Fail.** Lacks standard proxies for suffering intensity; relies on speculative pain models. | **Pass.** Suffering is suffering regardless of location; demands leakage accounting. | **Fail.** High data demand to distinguish suffering from neutral states. |
  | **Totalist Hedonic Accounting** | **Fail.** Conflates existence of positive lives with welfare gain (Repugnant Conclusion risk). | **Fail.** Often uses abundance as proxy for "good," violating Biomass $\neq$ Welfare. | **Pass.** In principle sums all welfare, but practically struggles with boundary leakage. | **Partial.** Easier to model "positive years" than "suffering units," but still data-hungry. |
  | **Biodiversity/Integrity Views** | **Fail.** Treats welfare as downstream of integrity; assumes natural = good welfare. | **Fail.** Explicitly equates ecological function with value, violating the distinction. | **Fail.** Often bounded by reserve lines; ignores displacement of harm. | **Pass.** Uses existing ecological data (remote sensing, counts) directly. |
  | **Deontological/Constraint Views** | **N/A.** Rejects aggregation; focuses on rights violations (e.g., killing). | **Pass.** Does not require welfare measurement, only violation detection. | **Fail.** Constraints often apply to actions, not systemic outcomes; ignores leakage. | **Pass.** Binary checks (was an animal killed?) are computationally simple. |

  **Summary:** The **Suffering-Focused** and **Totalist** approaches align best with the *ethical* desiderata but fail the *computational* constraints. The **Biodiversity** approach passes computational checks but fails the ethical specification by conflating integrity with welfare. The **Constraint** approach avoids measurement but cannot rank interventions where no constraints are violated yet welfare differs. The specification forces us to build a hybrid that accepts coarse proxies for suffering while acknowledging the resulting indeterminacy.
