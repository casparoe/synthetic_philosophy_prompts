answer: |-
  # Taxonomy of Semantic Fixity in Layered Representational Systems

  **Root Question:** In a self-modifying layered system, where is semantic content ultimately fixed?

  ```text
  ROOT: SOURCE OF SEMANTIC FIXITY
  │
  ├── BRANCH A: THE FRAME MESSAGE IS ONTOLOGICALLY PRIOR (Immutable Substrate)
  │   │
  │   ├── SPLIT A1: DIAGNOSTIC — FORMAL SYSTEM REWRITES OWN AXIOMS
  │   │   │
  │   │   ├── PATH A1.1: Rewriting axioms destroys the original Frame.
  │   │   │   └── LEAF 1: FRAME FRAGILISM
  │   │   │
  │   │   └── PATH A1.2: Rewriting axioms is contained within the invariant Frame.
  │   │       │
  │   │       └── SPLIT A2: DIAGNOSTIC — SUBSYSTEM MODIFIES PARENT RULES
  │   │           │
  │   │           ├── PATH A2.1: The modifying subsystem is an Inner Loop.
  │   │           │   └── LEAF 2: FRAME ABSOLUTISM
  │   │           │
  │   │           └── PATH A2.2: The modifying subsystem functions as an Outer Agent.
  │   │               └── LEAF 3: SUBSYSTEM EXTERNALISM
  │   │
  │   └── [UNOCCUPIED SPACE A3]: Inner Message stabilizes meaning without Recursion.
  │       (Diagnosed: Incoherent; static inner data cannot fix meaning without 
  │       either a Frame or a dynamic looping process.)
  │
  └── BRANCH B: THE FRAME MESSAGE IS EMERGENT (Mutable Substrate)
      │
      ├── SPLIT B1: DIAGNOSTIC — ANN WEIGHTS / EXTERNAL INTERPRETER
      │   │
      │   ├── PATH B1.1: Meaning requires an External Interpreter (Outer Message).
      │   │   └── LEAF 4: INTERPRETIVE EXTERNALISM
      │   │
      │   └── PATH B1.2: Meaning is fixed Internally (Inner Message).
      │       │
      │       └── SPLIT B2: DIAGNOSTIC — RECURSION WITHOUT INITIAL FRAME
      │           │
      │           ├── PATH B2.1: Recursion stabilizes meaning ex nihilo (No Frame).
      │           │   └── LEAF 5: RADICAL RECURSIVE INTERNALISM
      │           │
      │           └── PATH B2.2: Recursion requires a minimal seed Frame.
      │               └── LEAF 6: BOOTSTRAPPED INTERNALISM
      │
      └── [UNOCCUPIED SPACE B3]: Outer Message exists without any Frame.
          (Diagnosed: Incoherent; an Outer Message requires a medium/Frame to be received.)
  ```

  ---

  ### Leaf Descriptions and Awkward Commitments

  **Leaf 1: Frame Fragilism**
  *   **Position:** Semantic content is fixed by the syntactic rules (Frame), such that any modification to the axioms constitutes the death of the original system and the birth of a new one.
  *   **Awkward Commitment:** A learning system is literally a succession of dead systems, meaning no single agent ever survives the process of acquiring new knowledge.

  **Leaf 2: Frame Absolutism**
  *   **Position:** Semantic content is fixed by an invariant Frame, and all apparent self-modification (including axiom rewriting) is merely data processing (Inner Message) within that rigid structure.
  *   **Awkward Commitment:** The system can never actually change its logic, only simulate doing so, rendering the concept of 'adaptive learning' an ontological illusion.

  **Leaf 3: Subsystem Externalism**
  *   **Position:** Semantic content is fixed by the Frame, but a subsystem capable of modifying parent rules is ontologically elevated to the status of an external interpreter (Outer Message).
  *   **Awkward Commitment:** A part of the code is ontologically distinct from the whole code that contains it, implying a homunculus resides within the machine's own architecture.

  **Leaf 4: Interpretive Externalism**
  *   **Position:** Semantic content is not fixed by the system's structure but is assigned by an external agent (Outer Message), making the Frame merely a conduit for outside intention.
  *   **Awkward Commitment:** A solitary self-modifying AI operating in deep space has no semantics and represents nothing until a human observer intervenes.

  **Leaf 5: Radical Recursive Internalism**
  *   **Position:** Semantic content is fixed entirely by self-referential loops (Inner Message), capable of generating a stable Frame from pure noise without any prior rules.
  *   **Awkward Commitment:** A system with zero initial syntax can generate valid semantics purely through self-looping, implying meaning can arise from nothing but structureless iteration.

  **Leaf 6: Bootstrapped Internalism**
  *   **Position:** Semantic content is fixed by self-referential loops (Inner Message), but these loops require a minimal, non-semiotic seed Frame to initiate the stabilization process.
  *   **Awkward Commitment:** There is a magical threshold where 'noise' becomes 'Frame' that the theory cannot define, leaving the origin of the initial seed unexplained.

  ---

  ### Analysis of Logical Space and Indistinguishability

  **Unoccupied and Diagnosed Positions**
  The taxonomy explicitly excludes two logical combinations as incoherent. First, **Unoccupied Space A3** (Inner Message stabilizes meaning without Recursion) is rejected because static internal data lacks the dynamic mechanism to fix its own interpretation without a pre-existing Frame. Second, **Unoccupied Space B3** (Outer Message exists without any Frame) is rejected because an external interpretation requires a medium or channel (a Frame) to be transmitted into the system; an Outer Message without a Frame is a signal without a receiver.

  **Indistinguishable Positions**
  **Leaf 5 (Radical Recursive Internalism)** and **Leaf 6 (Bootstrapped Internalism)** are flagged as potentially indistinguishable based on the provided diagnostic cases. The splitting case asks "whether recursive self-reference can stabilize meaning in the absence of *any* frame." However, if Leaf 6's "minimal seed Frame" is defined as non-semantic noise that only gains status as a Frame *through* recursion, the distinction between "no frame" (Leaf 5) and "seed frame" (Leaf 6) collapses. The diagnostic cases provided cannot empirically separate a system that starts with absolutely nothing from a system that starts with a "nothing" that is merely labeled as a "seed."

  **Diagnostic Limitations**
  The case regarding **ANN weights** (Split B1) effectively separates Externalism (Leaf 4) from Internalism (Leaves 5 & 6), but it does not fully resolve the tension between **Leaf 2 (Frame Absolutism)** and **Leaf 3 (Subsystem Externalism)**. Both positions agree the Frame is prior; they disagree only on the classification of the modifying subsystem. Since the physical evidence (code modifying code) is identical in both cases, the diagnostic cannot separate them without appealing to unstated metaphysical assumptions about what constitutes an "agent."
