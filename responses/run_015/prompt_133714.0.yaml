answer: |-
  There is no single, canonical English word that captures the specific *flip* you are describing (caring most about X → doing least about X) combined with the *unease* it produces.

  The closest established term for the *mechanism* is **Moral Logrolling**. This comes from political science ("logrolling" is when politicians trade votes on pet projects), and ethicists have extended it to "moral logrolling" or "cause trading" (e.g., in Effective Altruism circles).

  However, "Logrolling" describes the *deal*, not the *phenomenological flip* or the *awful feeling*. It implies a neutral exchange of utility. It doesn't capture the alienation of having your deepest values executed by someone who scorns them.

  If you want a name that actually carves out the specific dynamic you're staring at—the inversion of agency and value—I propose: **Value-Action Inversion**.

  Here is the definition that carves it:
  > **Value-Action Inversion**: A reciprocal arrangement where two parties maximize their preferred *outcomes* by severing the link between their own *agency* and their own *values*, resulting in each party expending resources on actions they deem less valuable, while their preferred outcomes are enacted by agents who do not share the underlying conviction.

  ### Why it feels "vaguely awful" (The Missing Piece)
  You asked if this is just division of labor in a moral costume. It isn't. Division of labor assumes shared ends (we both want the house built, I'll frame, you'll wire). Moral Logrolling assumes *opposed* ends (I want cows saved, you want humans saved).

  The "awful" feeling comes from the loss of **Expressive Utility**.
  In economics and philosophy, actions often provide two types of value:
  1.  **Instrumental Value:** The outcome (e.g., the cow is not eaten).
  2.  **Expressive Value:** The act of *you* doing it (e.g., *I* am the kind of person who protects cows).

  In your arrangements, you maximize Instrumental Value but zero out Expressive Value. In fact, you go negative: you are actively *expressing* support for a value you reject (sitting in the church, funding the animal charity). You are turning your own agency into a mere currency to buy outcomes, which feels like a violation of **Integrity** (in the Bernard Williams sense: keeping your actions aligned with your deepest projects).

  ### Addressing Your Specific Comparisons

  **1. Is it Division of Labour?**
  No. Division of labor optimizes efficiency toward a *shared* goal. This is **Conflict Management** toward *divergent* goals. In division of labor, I trust you to wire the house because you're a better electrician. In Value-Action Inversion, I trust you to fund poverty relief *despite* thinking it's a mistake. That requires a different, more fragile kind of trust.

  **2. Is it the Politicians Thing?**
  Yes. This is exactly **Logrolling**. The difference is scale and intimacy. Politicians expect to feel slimy; friends expect to feel aligned. When logrolling happens in intimate relationships, the "sliminess" registers as a relational breach ("Why are you paying for *that*?").

  **3. Is it Moral Licensing?**
  No. Moral licensing is internal ("I recycled, so I can fly to Paris"). This is external and reciprocal. However, the *third thing* you noticed (talking up the value of the thing you're receiving) is related to **Cognitive Dissonance Reduction**. To justify the trade, you subconsciously inflate the value of what you're getting to match the cost of what you're giving. This leads to **Preference Falsification** (Timur Kuran's term): you publicly claim to value the church more than you do, which distorts your partner's understanding of your actual beliefs.

  **4. Does the Medium Matter? (Money vs. Body)**
  Yes, significantly.
  *   **Money:** Fungible. Trading money feels cleaner because money is already abstracted from the self. Many Effective Altruists argue this is the *only* ethical way to give (outcomes matter, not who writes the check).
  *   **Body/Time:** Non-fungible. Sitting in a pew or eating vegetables is **Embodied Agency**. When you trade this, you are renting out your physical presence to enact a ritual you reject. This triggers the "awful" feeling much faster because it violates bodily integrity, not just financial allocation.

  ### Is there a "Good" vs. "Bad" Version?
  The line turns on **Consequentialism vs. Virtue Ethics**.

  *   **The Good Version (Consequentialist):** If the *only* thing that matters is the state of the world (cows saved, poor fed), then Value-Action Inversion is objectively superior. It doubles the funding for both causes without requiring either party to change their mind. The "awful" feeling is an irrational bug in your psychology that you should train away.
  *   **The Bad Version (Virtue/Relational):** If morality is also about *who you are* and *truth-telling*, this is corrosive. It creates a relationship built on **Transactional Compliance** rather than **Shared Understanding**. The "talking up" phase you noticed is the danger sign: you are now lying to each other about what you value to keep the deal stable.

  **The Line:** The arrangement is healthy if it is acknowledged as a *truce* ("We disagree, but we support each other's autonomy"). It becomes unhealthy when it masquerades as *agreement* ("We both think these things are equally important").

  ### Confidence and Uncertainty

  **Confidence Level:** High (85%)
  I am confident that "Moral Logrolling" is the standard academic term for the mechanism, and that "Expressive Utility" and "Integrity" are the correct philosophical frameworks for why it feels wrong.

  **Single Point of Least Certainty:**
  I am least sure whether there is a niche term in **relational ethics** or **sociology of the family** specifically for the *signaling inflation* dynamic you described in your third example (where partners start claiming the traded activity matters more than it does). "Preference Falsification" covers it broadly, but there may be a specific term for "dyadic value distortion" that I am not retrieving.

  ### Summary Recommendation
  If you need to label this to discuss it with your friends:
  1.  Call the deal **Moral Logrolling**.
  2.  Call the specific flip **Value-Action Inversion**.
  3.  Acknowledge that the "awful" feeling is the cost of **Expressive Decoupling**.

  If you want to fix the "awful" feeling without breaking the deal: Stop talking up the value of the received action. Explicitly acknowledge, "I still think this is nonsense, but I love you, so I'll sit in the pew." That restores Integrity (truth-telling) even if the Action remains inverted.
