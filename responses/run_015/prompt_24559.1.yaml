  10. **Final Polish:** Check tone. Ensure it sounds like a senior colleague advising a PhD student. (Proceed to generate response).

  *(Self-Correction on "Safe Improvement for Me"):* The user asks why Pareto rather than "Safe Improvement for Me". This is actually a very sharp point. If I can commit to a strategy that guarantees me a higher min-max value without caring about you, why do I need SPI? The answer usually involves the fact that SPIs allow for *mutual* gain that min-maxing leaves on the table. But if the selection problem is hard, maybe min-maxing is better. I need to make sure this distinction is clear in the normative section.

  *(Self-Correction on "Trust in Equilibrium Reasoning"):* The user worries principals trust each other's equilibrium reasoning. The SPI claim is you *don't* need to. You just need to know they play *an* equilibrium. The worry is: do we agree on the *set* of plausible equilibria? If I think you'll play Nash A, and you think I'll play Nash B, the SPI guarantee might fail if it relies on a specific subset. This ties into Robustness.

