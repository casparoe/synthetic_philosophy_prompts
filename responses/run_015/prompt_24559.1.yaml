      *   Is there a deeper issue? Yes. **The Bindingness of the Intervention.** The theory assumes the modification is common knowledge and binding. In reality, agents might find loopholes. However, for a *theory* dissertation, we usually take the model as given. A more theoretical upstream issue is **Common Knowledge of the SPI Proposal.** If I propose an SPI, you have to know I'm proposing it, and know that I know you know... This is epistemic logic (user's weak spot). I should frame this in Game Theory terms (information sets).
      *   *Decision:* I will stick to the strategic/coordination issues as "upstream" because they determine the *value* of the program, whereas epistemic issues determine the *feasibility*. The value proposition is more critical for a proposal.

  8.  **Final Review against Constraints:**
      *   Prioritized map? Yes.
      *   Defended ranking? Yes.
      *   Upstream reasoning? Yes.
      *   Tractability for user? Yes (emphasize GT over Logic).
      *   Credibility impact? Yes.
      *   Evidence/Arguments for next 1-2 years? Yes.
