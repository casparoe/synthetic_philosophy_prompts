answer: |-
  # Diagnostic Instrument: The Illusionist Decision Tree

  **Instructions:** This instrument is designed to sort commitments within the family of illusionist positions regarding phenomenal consciousness. Begin at the **Root Node**. Answer each question based on your philosophical commitments regarding the *nature* of the error, the *mechanism* producing it, and the *scope* of the illusion. Follow the branches to a terminal leaf.

  **Note:** All paths presuppose the core illusionist premise: *Phenomenal consciousness, as ordinarily conceived (intrinsic, private, immediately known), does not match reality.*

  ---

  ### ROOT NODE: Ontological Status of the Target
  **Question:** When you assert that the ordinary conception of phenomenal consciousness fails to match reality, what is the status of the property 'phenomenality' itself?

  *   **Option A (Total Elimination):** The term 'phenomenality' fails to refer. There is no property, state, or process in the world that corresponds to it, even loosely. It is a term like 'phlogiston' or 'witchcraft.'
      *   *Proceed to Branch 1A.*
  *   **Option B (Revisionary Realism):** There is a real physical or functional state that we are *talking about*, but our description of its properties (e.g., that it is non-physical, private, or intrinsic) is radically false.
      *   *Proceed to Branch 1B.*

  ---

  ### BRANCH 1A: Mechanisms of Total Elimination
  *(Reached from Root Option A)*

  **Question:** If 'phenomenality' refers to nothing, how do you explain the persistent, universal human conviction that it exists?

  *   **Option A1 (Cognitive/Conceptual Glitch):** The conviction arises from a structural error in how we apply concepts to our own states. We possess a "folk-psychological" theory that posits a ghost in the machine, and we mistakenly apply this theory to ourselves.
      *   *Proceed to Scope Node A1.*
  *   **Option A2 (Pragmatic/Social Fiction):** The conviction is sustained not by cognitive error but by social utility. We talk *as if* phenomenality exists because it facilitates coordination, moral attribution, or self-regulation, not because we are cognitively fooled.
      *   *Proceed to Scope Node A2.*
  *   **Option A3 (Predictive Architecture Necessity):** You model the brain as a hierarchical predictive processing system. Do you hold that the "self-model" required for homeostatic control *necessarily* generates a user-illusion of phenomenality that cannot be dispelled by the system itself?
      *   **YES:** *Proceed to Leaf: Architectural Illusionism.*
      *   **NO:** *Return to Option A1 or A2.*

  ---

  ### BRANCH 1B: Mechanisms of Revision
  *(Reached from Root Option B)*

  **Question:** If there is a real substrate, what is the primary mechanism by which it appears to have illusory phenomenal properties?

  *   **Option B1 (Representational Misrepresentation):** The brain represents its own physical states *as having* simple, intrinsic qualities (qualia), but these qualities are not actually instantiated. It is a veridical representation of a state, coupled with a non-veridical representation of that state's properties.
      *   *Proceed to Scope Node B1.*
  *   **Option B2 (Conceptual Confusion):** We possess a coherent concept of 'experience,' but we erroneously categorize it using a disjointed set of predicates (private, ineffable, etc.) that do not cohere. The illusion is linguistic/categorial, not perceptual.
      *   *Proceed to Scope Node B2.*
  *   **Option B3 (Predictive Architecture Necessity):** You model the brain as a hierarchical predictive processing system. Do you hold that the "phenomenal" appearance is the specific format of the control signals used to minimize prediction error in the interoceptive system?
      *   **YES:** *Proceed to Leaf: Predictive Phenomenal Functionalism.*
      *   **NO:** *Return to Option B1 or B2.*

  ---

  ### SCOPE NODES: Global vs. Local Illusion
  *(Reached from Branches 1A and 1B)*

  **Question:** Does the illusory status apply to the *existence* of experience itself, or only to specific *structural features* of experience?

  *   **Option Global:** The intuition that "there is something it is like" to be the system is itself the illusion. There is no subjective perspective, only the *appearance* of one.
      *   *Proceed to Residue Node.*
  *   **Option Local:** The system definitely has states that are "experienced," but specific features attributed to them are illusory. (e.g., The *unity* of consciousness is illusory; or the *transparency* of experience is illusory; or the *privacy* is illusory).
      *   *Proceed to Residue Node.*

  ---

  ### RESIDUE NODE: The Non-Illusory Substrate
  *(Reached from Scope Nodes)*

  **Question:** Once the illusion is stripped away, is there a residual functional or physical state that retains the functional role of consciousness?

  *   **Option Yes:** There is a non-illusory substrate (e.g., access consciousness, global broadcasting, or specific functional roles) that does the work consciousness was supposed to do.
      *   *Proceed to Leaf Assignment.*
  *   **Option No:** There is no functional role that survives the elimination. The concept is discarded entirely without replacement.
      *   *Proceed to Leaf Assignment.*

  ---

  ### TERMINAL LEAVES: Named Positions & Gap Analysis

  #### Leaf 1: Strong Eliminativist Illusionism
  *   **Path:** Root A → Mechanism A1 (Conceptual Glitch) → Scope Global → Residue No.
  *   **Description:** Phenomenal consciousness is a complete myth. There is no substrate. The term should be excised from serious ontology.
  *   **Status:** Occupied.

  #### Leaf 2: Representational-Error Illusionism
  *   **Path:** Root B → Mechanism B1 (Misrepresentation) → Scope Global → Residue Yes.
  *   **Description:** Physical states exist, but the brain misrepresents them as having intrinsic qualia. The "what-it-is-like" is a representational artifact, but the represented state (access/functional) is real.
  *   **Status:** Occupied.

  #### Leaf 3: Pragmatic-Fiction Illusionism
  *   **Path:** Root A → Mechanism A2 (Social Fiction) → Scope Global → Residue Yes/No.
  *   **Description:** We maintain the discourse of phenomenality for ethical or social coordination, despite knowing it refers to nothing.
  *   **Status:** Occupied (Instrumentalist variants).

  #### Leaf 4: Architectural Illusionism (Predictive Processing)
  *   **Path:** Root A/B → Mechanism A3/B3 (PP Necessity) → Scope Global → Residue Yes.
  *   **Description:** The illusion is a necessary interface generated by hierarchical inference to simplify control. It cannot be "thought away" because it is built into the inference architecture.
  *   **Status:** Occupied (Emerging view).

  #### Leaf 5: Local-Feature Illusionism
  *   **Path:** Root B → Mechanism B1/B2 → Scope Local → Residue Yes.
  *   **Description:** Experience exists, but specific features (e.g., the unity of the self, the immediacy of the present) are constructive illusions.
  *   **Status:** Occupied.

  ---

  ### UNOCCUPIED LOGICAL SPACE (GAP DIAGNOSIS)

  **Gap 1: The Pragmatic Localist**
  *   **Path:** Root A → Mechanism A2 (Social Fiction) → Scope Local → Residue No.
  *   **Diagnosis:** **Unattractive/Unstable.** It is difficult to motivate why we would sustain a fictional discourse about *specific features* of experience (e.g., faking unity) while admitting other features are real, if the whole ontology is eliminated. Social fictions usually operate at the level of the whole entity (the "person"), not sub-personal structural features.
  *   **Status:** Unoccupied.

  **Gap 2: The Conceptual Eliminativist**
  *   **Path:** Root A → Mechanism B2 (Conceptual Confusion) → Residue No.
  *   **Diagnosis:** **Incoherent.** If the error is merely conceptual confusion about a target, there must be a target being confused. If there is no target (Residue No), it cannot be a conceptual confusion; it must be a referential failure (Mechanism A1).
  *   **Status:** Unoccupied.

  **Gap 3: The Misrepresenting Void**
  *   **Path:** Root A → Mechanism B1 (Representational Misrepresentation) → Residue No.
  *   **Diagnosis:** **Incoherent.** Representation is a relational property. One cannot have a misrepresentation of *nothing*. If there is no residual substrate being represented, the mechanism cannot be representational error.
  *   **Status:** Unoccupied.

  **Gap 4: Predictive Local Eliminativism**
  *   **Path:** Mechanism A3 (PP Necessity) → Scope Local → Residue No.
  *   **Diagnosis:** **Neglect/Theoretical Tension.** If the predictive architecture *necessitates* the illusion for control (as per A3), it is unlikely to be restricted to local features without undermining the control function. However, this space is not logically impossible, merely under-theorized. It suggests a system where some control signals are veridical and others are not, without a clear principle distinguishing them.
  *   **Status:** Unoccupied.

  ---

  ### FLAGGED INDISTINGUISHABILITY

  **Warning: The Representationalism/Illusionism Boundary**
  *   **Affected Leaves:** Leaf 2 (Representational-Error) vs. Strong Naturalistic Representationalism (Non-Illusionist).
  *   **Diagnosis:** This instrument cannot separate a position that claims "Qualia are real representational properties" from "Qualia are illusory representations of physical properties."
  *   **Reasoning:** If the representation *constitutes* the experience, the property is real. If the representation *falsifies* the experience, it is an illusion. The difference often rests on a semantic stipulation about whether "representation" is a real property or a relation that can be non-veridical. Respondents may land on Leaf 2 but mean a view that standard taxonomy classifies as Realism.
  *   **Action:** Respondents reaching Leaf 2 must clarify if they believe the *represented content* exists (Realism) or only the *act of representing* exists (Illusionism).

  **Warning: The Pragmatic/Conceptual Boundary**
  *   **Affected Leaves:** Leaf 1 (Strong Eliminativist) vs. Leaf 3 (Pragmatic-Fiction).
  *   **Diagnosis:** Both agree the ontology is empty. The distinction rests entirely on the *sociological* recommendation (stop using the term vs. keep using the term). This is a normative, not metaphysical, distinction.
  *   **Action:** Respondents should note that their metaphysical commitment is identical; their divergence is purely linguistic policy.
