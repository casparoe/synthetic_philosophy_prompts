      *   *Key Figures:* Ryle (logical behaviorism), Carnap (reduction sentences), Martin (finks), Johnston (masks), Lewis (reformed conditional analysis), Bird (dispositional essentialism), Mumford.
      *   *The Conditional Analysis (CA):* $x$ is disposed to $M$ when $S$ iff if $x$ were $S$, $x$ would $M$.
