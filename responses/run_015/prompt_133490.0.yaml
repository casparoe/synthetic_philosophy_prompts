answer: |-
  The 1945 exposure of Han van Meegeren's forgery of *The Supper at Emmaus* serves as a potent empirical stress test for the philosophical dichotomy between **origin-value** (the claim that an artwork's status and worth are inextricably linked to its causal history, authorship, and context of creation) and **experience-value** (the claim that value resides solely in perceptible properties and the qualitative experience they generate in the viewer). The episode reveals that while aesthetic experience is the entry point for appreciation, the *valuation* of art is overwhelmingly dependent on origin, though this dependency is complicated by ethical, nationalistic, and market forces that the pure aesthetic framework struggles to isolate.

  ### Mapping the Episode: Parties, Incentives, and Collapses

  The central artifact was *The Supper at Emmaus*, painted by Van Meegeren in the late 1930s but passed off as a lost Vermeer.
  *   **Han van Meegeren:** Motivated initially by financial gain and a desire to vindicate his artistic ego against critics who deemed his original work derivative. By 1945, his incentive shifted to survival; facing a treason charge for selling a "national treasure" to the Nazis, he confessed to forgery to reduce the crime from collaboration to fraud.
  *   **Abraham Bredius:** The preeminent Vermeer scholar. His incentive was the consolidation of his scholarly authority. Authenticating a "new" Vermeer validated his connoisseurship. He relied on stylistic analysis (experience-value cues) to confirm a historical fact (origin-value).
  *   **Hermann Göring:** The Nazi Reichsmarschall. His incentive was the accumulation of cultural capital. He traded 137 valuable paintings for *Emmaus*, valuing it not for its visual properties alone, but for the prestige of owning a Vermeer.
  *   **Dutch Authorities & Public:** Initially hostile to Van Meegeren as a collaborator. Upon the revelation of forgery, their incentive shifted to reclaiming national heritage (the painting was no longer a lost Dutch master but a trick on the enemy) and prosecuting fraud rather than treason.
  *   **The Collapse:** When the forgery was revealed, **market price** evaporated (the work became a curiosity rather than a masterpiece); **legal status** shifted from treason to fraud; **national pride** was paradoxically restored (the Dutch outwitted the Nazis); and **aesthetic admiration** transformed from reverence for Vermeer's genius to admiration for Van Meegeren's technical cunning.

  ### Theoretical Application: Origin vs. Experience

  The framework explains the trajectory of the scandal through the tension between the two value systems.
  *   **Bredius's Authentication:** Bredius's initial credibility stemmed from a conflation of the two values. He perceived the *experience-value* (the style matched Vermeer) and assumed it guaranteed *origin-value* (therefore, it must be Vermeer). The forgery succeeded because Van Meegeren successfully mimicked the perceptible properties that art history had coded as "Vermeer."
  *   **Göring's Possession:** Göring's prize exemplifies the dominance of origin-value in the art market. Had the painting been valued purely on experience, the revelation of its 1930s origin should not have diminished its visual impact. Yet, Göring was reportedly devastated. The value was in the *provenance*, not just the pigment.
  *   **The Outrage:** The public and critical outrage upon exposure supports the **origin-value** thesis. If experience-value were primary, the painting should have remained beautiful. Instead, it was re-categorized as a "fake." This aligns with Nelson Goodman's argument that knowing a work is a forgery alters the perception itself; we look for evidence of the deception, changing the aesthetic experience retroactively.

  ### Points of Silence and Breakdown

  However, the episode exposes where the philosophical framework is silent or breaks down when confronted with material and political reality.
  *   **Scientific Detection:** The discovery of modern synthetic binding media (Bakelite/phenol formaldehyde) and anachronistic pigments provided empirical proof of modern origin. The framework struggles here: does this scientific fact prove the work was never *aesthetically* equivalent? No. It proves it was materially distinct. The breakdown lies in assuming material composition dictates aesthetic quality. The science detects fraud, not aesthetic inferiority.
  *   **Van Meegeren's Demonstration:** During his trial, Van Meegeren painted a "Vermeer" to prove his capability. This supports the **experience-value** claim of indistinguishability (he could replicate the look). However, origin theorists argue this confuses *technical skill* with *artistic achievement*. Van Meegeren was solving the problem of "how to look like Vermeer," whereas Vermeer solved the problem of "how to depict light and faith." The framework must distinguish between replication and innovation.
  *   **Nationalism and Ethics:** The Dutch public's celebration of Van Meegeren as a folk hero introduces a third variable: **ethical/nationalist value**. The painting gained a new kind of worth as a weapon of resistance. This confounds the aesthetic dispute. The value didn't just drop; it mutated. The framework of "origin vs. experience" is silent on how political context injects value into an object independently of its art-historical origin or its visual form.

  ### The Episode as Theory Test

  Ultimately, the Van Meegeren episode confirms that **origin is aesthetically relevant**, but perhaps not for the reasons purists suggest. The sharp drop in value upon discovery is not merely a market penalty for deception; it represents a fundamental shift in the *category* of the object. As Alfred Lessing argued, a forgery is aesthetically inferior because it lacks the historical achievement of the original—it is a parasite on another's genius.

  However, the episode also suggests that the "drop in value" is partly a psychological and sociological phenomenon rather than a purely aesthetic one. The market and moral norms penalize deception, and this penalty bleeds into aesthetic judgment. We cannot easily separate the "look" of the painting from the "story" of the painting. Therefore, the episode demonstrates that **origin-value is constitutive of the art object's identity**, not merely an external tag. To change the origin is to change the work itself, validating the historicist view that art is an action in history, not just an object in space.

