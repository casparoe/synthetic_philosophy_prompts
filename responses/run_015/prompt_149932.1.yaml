answer: |-
  # Seminar Game: The Blyme Exchange

  **Time:** 75 Minutes
  **Students:** 14
  **Room:** Standard seminar table/arrangement
  **Forbidden Words (until debrief):** Twin Earth, Externalism, Putnam, Natural Kind, Reference, Extension.

  ## Materials
  1.  **14 Identical Vials:** Small, sealed, clear containers filled with tap water. Label them 1–14 on the bottom with a tiny dot.
      *   **Batch Alpha (1–7):** Blue dot (hidden).
      *   **Batch Beta (8–14):** Red dot (hidden).
  2.  **Tokens:** 50 poker chips or printed paper slips (currency).
  3.  **The Ledger:** A sheet of paper only you see. It records: *Alpha = Blyme. Beta = Twin-Blyme.*
  4.  **Contract Slips:** 14 small pieces of paper.
  5.  **One "Master Vial":** Identical to the others, kept in your pocket (Batch Alpha).

  ---

  ## Phase 1: Ostension & Stipulation (10 Minutes)
  **Goal:** Fix the term 'blyme' via baptism, then distribute the ambiguity.

  1.  **The Baptism:** Hold up the **Master Vial** (Batch Alpha). Say: *"I name the liquid in this vial 'blyme'. In this seminar, 'blyme' refers to the substance contained here."*
  2.  **The Distribution:** Hand out the 14 student vials randomly. Say: *"You all now possess samples of blyme. Do not open them. Do not compare bottoms."*
  3.  **The Internal State:** Ask them to write down on a scrap paper: (a) What 'blyme' tastes like (they guess), (b) What 'blyme' is made of (they guess), (c) One sentence using the word 'blyme'.
      *   *Instructor Note:* Collect these. They will all be identical. This proves internal identity later.

  ## Phase 2: The Futures Market (25 Minutes)
  **Goal:** Demonstrate that truth conditions differ despite identical internal states.

  1.  **The Setup:** Tell students they are traders. They earn tokens by fulfilling contracts.
  2.  **The Contract:** Pair them up (7 pairs). Inevitably, some pairs will be (Alpha/Alpha), some (Beta/Beta), and some (Alpha/Beta). They do not know this.
  3.  **The Task:** Each pair must sign a **Contract Slip**. It reads: *"Trader A promises to deliver 10ml of blyme to Trader B. If the substance is blyme, both gain 5 tokens. If not, both lose 5 tokens."*
  4.  **The Commitment:** They sign. They believe they have a 100% chance of winning because they all hold "blyme."
  5.  **The Reveal:** Announce: *"There has been a contamination in the supply chain. My Master Ledger defines 'blyme' strictly as Batch Alpha. Batch Beta is a distinct compound, indistinguishable by human senses, which I call 'twin-blyme'."*
  6.  **The Settlement:**
      *   **Alpha/Alpha Pairs:** Check the Ledger. Both have blyme. Contract valid. **+5 Tokens.**
      *   **Beta/Beta Pairs:** Check the Ledger. Neither has blyme. Contract void (cannot deliver what was promised). **-5 Tokens.** (Crucial: They *thought* they had blyme. They were wrong.)
      *   **Alpha/Beta Pairs:** Mixed. The Alpha holder can deliver; the Beta holder cannot. **-5 Tokens** (Breach of contract).
  7.  **The Friction:** The Beta students will protest. *"But it looks the same! I used the word correctly!"*
      *   **Your Response:** *"You used the word sincerely. But the contract depended on what the word picked out, not what you thought it picked out. The Ledger decides."*

  ## Phase 3: The Chain of Transmission (20 Minutes)
  **Goal:** Test whether reference follows the object or the description/chain.

  1.  **Selection:** Call 8 students to the front. Line them up.
  2.  **The Object:** Give Student 1 a **Batch Alpha** vial.
  3.  **The Instruction:** *"Student 1, say to Student 2: 'This is blyme.' Pass the vial. Student 2, repeat to Student 3, and pass it. Continue to Student 8."*
  4.  **The Swap:** As the vial moves from Student 3 to Student 4, you (the Instructor) intercept it briefly to "check the seal." In that moment, swap the **Alpha** vial for a **Beta** vial from your pocket. Hand the Beta vial to Student 4.
      *   *Constraint:* Do this smoothly. The vials must be visually identical.
  5.  **The End State:** Student 8 holds the **Beta** vial. The chain is complete.
  6.  **The Bet:** The remaining 6 students (the audience) must bet their tokens on one of three claims regarding Student 8's use of 'blyme':
      *   **Option A:** Student 8 refers to the liquid in Student 1's original vial (Alpha).
      *   **Option B:** Student 8 refers to the liquid currently in their hand (Beta).
      *   **Option C:** Student 8 refers to nothing (the term is broken).
  7.  **The Resolution:** Reveal the swap. Ask Student 8: *"Did you intend to talk about the stuff Student 1 had?"* (They will say yes).
      *   **Ruling:** Declare **Option A** the winner. *"The word traveled down the chain. The liquid changed. The meaning stayed with the chain, not the liquid."*
      *   Pay out tokens to winners.

  ## Phase 4: The Debrief (20 Minutes)
  **Goal:** Map the game mechanics to the philosophy.

  1.  **Reveal the Jargon:** Write **Semantic Externalism** on the board. Explain that Phase 2 was a simulation of the **Twin Earth** thought experiment.
      *   *Alpha* = Earth (H2O).
      *   *Beta* = Twin Earth (XYZ).
      *   *The Ledger* = The World/Environment.
  2.  **Map Phase 2 (Internal State):** Show the scrap papers from Phase 1. They are identical.
      *   *Point:* Two speakers can be molecule-for-molecule identical in their heads (same beliefs, same sensory experience) but mean different things because their environments differ. Meaning isn't "in the head."
  3.  **Map Phase 3 (The Chain):** Discuss the betting results.
      *   *Point:* This dramatizes the **Causal-Historical Theory of Reference**. Reference is fixed by an initial baptism (Phase 1) and passed through a social chain (Phase 3). It does not depend on the speaker's ability to identify the substance (Student 8 couldn't tell the difference).
  4.  **Map the Division of Labor:** Ask the Beta students in Phase 2 why they lost.
      *   *Point:* They deferred to the "Expert" (The Instructor/Ledger). Most of us use words like 'gold', 'elm', or 'water' without knowing their scientific essence. We rely on the community to fix the reference.

  ---

  ## Predicted Failures (What Will Go Wrong)

  1.  **The "Gotcha" Backlash:**
      *   *Risk:* Students in Batch Beta will feel cheated rather than enlightened. They may argue, *"You lied to us, so the game is invalid."*
      *   *Mitigation:* Frame the stipulation explicitly as a "Simulation Rule" at the start of Phase 2. *"In this game world, the Ledger is physics."* If they push back, lean into it: *"Your frustration is exactly the point. You feel your internal state should guarantee meaning. The game shows it doesn't."*
  2.  **The Swap Detection:**
      *   *Risk:* If you fumble the swap in Phase 3, a student notices. The "indistinguishability" premise collapses.
      *   *Mitigation:* Practice the sleight of hand. Better yet, have a confederate (TA or trusted student) do the swap, or use a screen/barrier during the "safety check." If caught, admit it immediately and ask: *"Does knowing it was swapped change what you think Student 8 meant?"*
  3.  **The "Option C" Problem:**
      *   *Risk:* In Phase 3, smart students might argue for Option C (Reference Failure). If the chain is broken by the swap, maybe the word *doesn't* refer to Alpha.
      *   *Mitigation:* This is actually a feature, not a bug. It opens a debate about "error" vs. "reference." If you want to stick to standard Kripke/Putnam, rule that the *intent* of the chain preserves reference. If you want to open complexity, let Option C stand as a valid minority report.
  4.  **Time Creep:**
      *   *Risk:* Phase 2 trading takes too long.
      *   *Mitigation:* Hard stop at 25 minutes. Use a timer on the projector.

  ## Limitations (What You Must Lecture)

  Be honest with the class. This game simulates the *conclusion* of externalism, but it cannot simulate the *argument*.

  1.  **Stipulation vs. Argument:**
      *   *The Limit:* In the game, *you* (the Instructor) stipulated that Alpha is Blyme and Beta is not. You acted as God.
      *   *The Lecture:* In the real world, there is no Instructor with a Ledger. Putnam's work is an argument for *why* we should accept that the environment fixes reference, not just a rule that says it does. The game skips the justification.
  2.  **The "Essence" Problem:**
      *   *The Limit:* The game treats 'blyme' as having a hidden essence (the dot color).
      *   *The Lecture:* Real natural kinds (water, gold) have microstructures (H2O, Au). Artifacts (pencil, chair) might not. The game works best for natural kinds. You need to explain why 'blyme' is treated as a natural kind in the simulation.
  3.  **Normativity:**
      *   *The Limit:* The game makes reference a matter of winning tokens.
      *   *The Lecture:* Meaning is normative, not just profitable. We *ought* to use 'water' for H2O, not because we lose points otherwise, but because that's what the word *is*. The game gamifies a normative constraint.

  ## Instructor Cheat Sheet (For the Debrief)

  *   **If they say:** "But I meant water!"
      *   **You say:** "You meant *what you thought was water*. But what you *referred to* was determined by the stuff."
  *   **If they say:** "Student 8 in the chain was holding Beta, so they meant Beta."
      *   **You say:** "If I point to a cat and say 'That's a dog', am I referring to the cat? No, I'm misidentifying it. Student 8 was misidentifying the liquid, but using the name passed down from the Alpha baptism."
  *   **If they say:** "This is just about definitions."
      *   **You say:** "No. Definitions are in the head. 'Blyme' picked out different stuff for Alpha and Beta groups even though your definitions were identical. That's why it's externalism."
