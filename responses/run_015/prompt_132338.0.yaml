answer: |-
  This is a really sharp distinction you're making, and honestly, "moral overhang" sounds like a way more interesting engine for a novel than standard supererogation. Standard philosophy tends to treat moral acts like transactions that close the book, but your idea suggests the book only opens wider. Let's break down how these two frameworks handle the ownership of that surplus value and why your model hits harder on that specific feeling of audience guilt.

  **The Standard View: Supererogation as Personal Property**

  In the classic Urmson-style framework, supererogatory acts are all about individual agency. When a soldier throws themselves on a grenade, they are spending their own moral capital. The key feature here is that the action is optional. No one can blame them for not doing it, but if they do, the moral credit belongs almost exclusively to them.

  In this model, the "surplus good" is owned by the hero. It's a deposit into their moral bank account (or their legacy). The beneficiaries—the strangers who live because the soldier died—receive a gift, sure, but they don't necessarily inherit the debt. They might feel gratitude, but the moral ledger balances out: one life for many, hero gets glory, survivors get life. The transaction is clean.

  For an audience, this creates admiration. If you feel guilt watching a standard supererogatory death, it's usually a sense of inadequacy. You think, "I could never do that," or "I am lesser than this person." It's a vertical comparison. You're looking up at a statue. The burden stays on the pedestal; it doesn't leak down into the crowd.

  **Your Model: Moral Overhang as Systemic Debt**

  "Moral overhang" flips the ownership structure completely. Here, the surplus doesn't stay with the agent; it radiates outward until it hits everyone else. If supererogation is a donation, moral overhang is a forced investment.

  When a character engages in moral overhang, they aren't just spending their own credit; they're spending everyone else's. By sacrificing too much, they inflate the value of sacrifice to a point where everyone else is now morally indebted. The "surplus good" doesn't belong to the hero anymore; it belongs to the system, and it manifests as a liability.

  This changes who owns the surplus. In your model, the survivors and the audience own the surplus, but it's not an asset—it's a debt. The hero's excess creates a deficit in the community. The logic shifts from "They saved us" to "They spent too much on us, and now we owe a debt we can't pay."

  **Who Owns the Surplus?**

  Standard supererogation says the hero owns the surplus. It's their virtue, their saintliness. It reinforces their individuality.

  Moral overhang says the community owns the surplus. The hero disappears into the act, and the act becomes a burden on the living. This is much more potent for a story because it prevents the hero's death from being a resolution. In a standard war movie, the sacrifice ends the scene; everyone cries, then they charge the hill. In your framework, the sacrifice starts the conflict. The survivors have to deal with the weight of that unpayable debt. Do they try to repay it? Do they resent the hero for putting them in debt? Do they try to devalue the sacrifice to make it manageable?

  **Explaining Audience Guilt**

  This is where your concept really does the heavy lifting. You asked which model better explains why an audience feels guilty or burdened after witnessing an unnecessary death.

  The standard supererogation model actually fails here. If the act is truly supererogatory, the audience is off the hook. They are permitted to feel safe. The hero took the burden voluntarily. If the audience feels guilty under this model, it's arguably irrational—they're feeling bad for not doing something they were never supposed to do.

  Moral overhang explains the guilt perfectly because the guilt is rational within the system you've built. The audience feels burdened because they *are* burdened. The hero's unnecessary death wasn't just a tragedy; it was a demand. It signals that the standard of "enough" has changed. By dying unnecessarily, the hero implies that survival isn't enough, that safety isn't enough, that everyone else is now living on borrowed moral time.

  It creates a sense of complicity. In standard supererogation, the audience is a witness. In moral overhang, the audience is a beneficiary who didn't consent to the transaction. That creates a specific kind of itch—the feeling that you are walking around with something stolen, or that you're living in a house built on a foundation that was too expensive.

  **Why This Works for Fiction**

  If you're drafting a novel, moral overhang gives you way more traction than supererogation. Supererogation tends to end conversations (the hero is good, end of story). Moral overhang starts arguments.

  Imagine two characters surviving the grenade incident.
  *   **Under Supererogation:** They bond over their gratitude. They honor the hero.
  *   **Under Moral Overhang:** One character might feel crushed by the debt, trying to live a life worthy of the sacrifice. The other might feel angry, resenting the hero for making them feel small, or for forcing them into a moral hole they can't climb out of.

  It also implicates the reader. If you write the scene right, the reader shouldn't just feel sad; they should feel implicated. They should feel like the book is asking them to pay something back when they close the cover. That's a lingering feeling that sticks with people much longer than simple admiration.

  **The Verdict**

  Standard supererogation treats moral excess like a trophy: it sits on the hero's shelf. Moral overhang treats moral excess like radiation: it spreads out and contaminates the environment.

  For your specific goal—explaining who owns the surplus and why the audience feels burdened—moral overhang is the superior tool. It correctly identifies that extreme sacrifice isn't just a personal choice; it's a social event that reshapes the obligations of everyone watching. It turns the surplus good into a collective liability, which is a much richer soil for growing conflict, guilt, and complex character dynamics.
