  Du Bois argues that neutrality in diegetic framing is impossible. When you construct a character arc, you are inherently arguing for a specific valuation of human experience. If your protagonist suffers and finds meaning, you are propagating a thesis on endurance. Reader identification is the engine here; narrative transportation isn't just immersion, it's consent. When you transport a reader into a marginalized world, you are demanding they validate that existence. This is where beauty and truth function as craft mechanics. "Showing vs. telling" isn't just about subtlety; it's about credibility. If the prose lacks beauty, the transportation fails, and the argument rejects. If the representation lacks truth, the identification breaks. So, art is propaganda because every aesthetic choice persuades the reader to accept a specific moral reality. You cannot write a scene without advocating for the worth of the people in it. For Du Bois, beauty isn't decoration; it's the lure that makes the truth palatable. Truth isn't factuality; it's the integrity of the representation. Without them, the propaganda is just noise. With them, the story forces the reader to witness humanity they might otherwise ignore. Even "art for art's sake" is a propaganda stance, privileging aesthetics over ethics. The craft *is* the argument. To write is to take a side on what matters. Bad art fails as propaganda because it cannot sustain the transport necessary to change a mind. Good art succeeds because the beauty disarms the reader long enough for the truth to land. Beauty seduces the reader into the transport; truth ensures they stay.

  Distortions
  To fit this into craft terms, I have to sanitize the word "propaganda." In workshop language, propaganda is a dirty word synonymous with didactic telling. Du Bois reclaims it as inevitable advocacy. I'm also smoothing over the rage. Craft terms like "narrative transportation" sound passive and psychological, whereas Du Bois means something active and sociological. He's talking about survival, not just reader engagement. By focusing on the mechanics of identification, I risk making this about individual empathy rather than structural justice. I'm translating a political manifesto into a MFA seminar handout. That softens the blow. I am treating the reader's mind as a space to be entered, whereas Du Bois treats the public sphere as a space to be contested. The craft vocabulary assumes a neutral ground where stories happen; Du Bois argues the ground itself is contested terrain. This shift changes the stakes from aesthetic success to political utility.

  Residue report
  What doesn't survive is the collective stake. Craft vocabulary focuses on the dyad between writer and reader, or character and plot. Du Bois is talking about art as a tool for group liberation. Your hunch about "propaganda for the human" risks universalizing too much. Du Bois was specific: art must propagate the humanity of the *oppressed* to counteract dehumanizing narratives. My craft translation misses the enemy. It treats propaganda as a neutral force of persuasion, but Du Bois sees it as a weapon in a specific war. Also, the word "propaganda" itself carries a pejorative weight that craft terms try to avoid. There's a tension here: can "good craft" exist without acknowledging who benefits from the status quo? The residue is the political urgency that gets lost when we talk about "arcs" instead of "lives." The individual reader's transformation is secondary to the community's survival. Craft language isolates the text; Du Bois connects it to the world.

  Bottom line
  Your hunch is close, but "the human" is too vague. Du Bois would say good fiction is propaganda for *whose* humanity gets recognized. You're right that craft serves an ethical end, but don't let "beauty" obscure the power dynamics. You aren't just advocating for humanity generally; you're advocating for specific humans to be seen as fully human. That is the propaganda. Keep the craft sharp, but know what weapon you're sharpening. If you write purely for aesthetics, you are still making a political choice by ignoring the struggle. Embrace the label if it means fighting for truth. Your stories will always argue for a world; decide which world you are building.
