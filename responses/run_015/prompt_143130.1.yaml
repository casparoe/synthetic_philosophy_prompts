      *   *(c) Anti-Environmental Determinism:* Institutional structures mediate between environment and outcome. Environment doesn't dictate history directly.
      *   *(d) Causal Determinism:* Once mediation (institutions) is specified, the outcome is *deterministically fixed*. Same inputs (environment + institutions) = same outputs (famine, etc.).
      *   *(e) The Real Peril:* Environmental determinism is bad because it ignores the transformative nature of institutions, not because it acknowledges non-human causation.

