answer: |-
  Here is the specification for a theory of hedonic commensurability capable of supporting a lexical-threshold negative utilitarianism (LTNU) within a regulatory decision procedure.

  The requirements are divided into **Non-Negotiables** (structural conditions without which LTNU collapses into standard weighted utilitarianism or becomes operationally undefined) and **Camp Preferences** (interpretive choices that vary between negative utilitarian sub-schools).

  ### I. Specifications for Commensurability

  **1. Valuation Structure (The Axis Requirement)**
  *   **Specification:** The theory must define whether hedonic tone is a single scalar quantity (where pain is negative pleasure) or two distinct qualities (pain and pleasure as separate dimensions). If single, the utility function must contain a discontinuity or asymptote at the threshold. If dual, there must be a conversion function that becomes singular (infinite ratio) at the threshold.
  *   **Case:** Without this, "lexical outweighing" is mathematically incoherent. If the scale is continuous and linear, a large enough quantity of the lower value will always exceed a small quantity of the higher value.
  *   **Status:** **Non-Negotiable.**

  **2. Threshold Trigger (The Intensity Requirement)**
  *   **Specification:** The lexical threshold must be fixed by *peak phenomenological intensity*, not by duration-integrated load or aggregate sum. A millisecond of torture must trigger the lexical veto, whereas a lifetime of mild annoyance must not.
  *   **Case:** LTNU is defined by the *quality* of suffering, not the *quantity*. If duration aggregates to trigger the lexical ban, the view collapses into a form of total negative utilitarianism with a weighting factor, losing the lexical protection of the severe sufferer.
  *   **Status:** **Non-Negotiable.**

  **3. Aggregation Boundaries (The Non-Summing Requirement)**
  *   **Specification:** The theory must forbid the aggregation of sub-threshold suffering across individuals or time to cross the lexical threshold. One million instances of mild pain cannot equal one instance of severe pain for the purpose of triggering the lexical veto.
  *   **Case:** This prevents "scope neglect" of the severe sufferer. If mild pains aggregate to override the lexical ban, the priority of the severe sufferer is contingent on the population size of the mildly suffering, violating the lexical claim.
  *   **Status:** **Non-Negotiable.**

  **4. Risk Handling (The Uncertainty Requirement)**
  *   **Specification:** The theory must provide a discounting rule for probabilistic outcomes. It must specify whether a 0.001% chance of severe suffering lexically outweighs a 100% chance of mild pleasure.
  *   **Case:** Regulatory environments deal in probabilities, not certainties. If lexical priority applies to any non-zero probability (lexical risk aversion), the decision procedure forbids almost all action (paralysis). If it discounts the probability, it risks violating the lexical constraint (trading a chance of torture for comfort).
  *   **Status:** **Non-Negotiable.**

  **5. Interpersonal Calibration (The Measurement Requirement)**
  *   **Specification:** The threshold must be identifiable and comparable across different subjects (human/animal) and reporting scales. The "grade of suffering" must correspond to a stable phenomenological marker, not a numerical score that shifts with recalibration (e.g., 0–10 vs. 0–100).
  *   **Case:** A regulator cannot apply a threshold if it is subjective or scale-relative. If the threshold is "7/10," it must mean the same phenomenological state regardless of the metric used to record it.
  *   **Status:** **Non-Negotiable.**

  **6. Temporal Currency (The Profile Preference)**
  *   **Specification:** The theory must specify whether the threshold applies to the *moment-by-moment experience* or the *retrospective evaluation* of an episode.
  *   **Case:** Peak-end rule psychology suggests memories diverge from experience. A procedure could ban an intervention based on remembered trauma even if momentary pain stayed below threshold, or vice versa.
  *   **Status:** **Camp Preference** (Experientialists vs. Narrativists).

  **7. Normative Status (The Valence Preference)**
  *   **Specification:** The theory must distinguish between the *disvalue of the sensation* and the *disvalue of the state of affairs*. It must decide if consensual, deserved, or meaningful pain counts toward the threshold.
  *   **Case:** A regulator needs to know if a painful vaccination (consensual, net-beneficial) triggers the lexical veto. Some LTNU variants count all pain; others count only "futile" or "involuntary" pain.
  *   **Status:** **Camp Preference** (Absolutist vs. Qualified Negative Utilitarianism).

  ---

  ### II. Critical Analysis of Joint Satisfiability

  **The Pair That Cannot Be Jointly Satisfied:**
  **Requirement 2 (Threshold Trigger on Continuous Intensity)** and **Requirement 5 (Interpersonal Calibration/Stability).**
  *   **Reasoning:** Phenomenological intensity is a continuous variable (the Sorites problem). There is no natural, sharp boundary in experience between "very severe pain" and "extremely severe pain." To satisfy Req 2, you must draw a sharp line. To satisfy Req 5, that line must be stable and identifiable across subjects. In a continuous phenomenological space, any sharp line is arbitrary. If the line is arbitrary, it cannot be stably calibrated across different subjects (Req 5 fails). If you admit the line is fuzzy to satisfy Req 5, you lose the sharp trigger required for lexicality (Req 2 fails). You cannot have a sharp moral discontinuity grounded in a continuous physical/phenomenological reality without arbitrariness.

  **The Single Requirement That Excludes the Most Candidates:**
  **Requirement 4 (Risk Handling).**
  *   **Reasoning:** Standard decision theory (Expected Utility Theory) is mathematically incompatible with lexical preferences. If $A$ is lexically superior to $B$, then any probability $p > 0$ of $A$ should be preferred to a certainty of $B$. In a regulatory context where *no* intervention has a zero probability of causing severe suffering (e.g., logistical accidents, side effects), strict adherence to Req 4 leads to **lexical paralysis**: no option can be chosen because every option carries some non-zero risk of triggering the lexical veto. To avoid paralysis, one must adopt non-standard decision rules (e.g., probability thresholds, lexical expected utility), which excludes almost all standard cost-benefit analysis frameworks and classical utilitarian theories.

  **What Is Left Standing:**
  If you enforce the Non-Negotiables strictly, **nothing is left standing** as a workable decision procedure.
  *   If you solve the Risk problem (by discounting small probabilities), you violate the Lexical Priority (you are now trading off severe suffering against mild pleasure).
  *   If you solve the Continuity problem (by admitting a fuzzy threshold), you violate the Decision Procedure requirement (regulators cannot act on fuzzy boundaries without discretion that reintroduces trade-offs).
  *   **The Survivors:** The only viable candidates are **Rule-Consequentialist approximations**. These do not apply LTNU act-by-act but adopt rigid rules (e.g., "No procedures involving restraint") that *track* the lexical threshold without requiring real-time commensurability. This abandons the attempt to plug LTNU directly into a calculative decision procedure, effectively admitting that LTNU is a constraint on *systems*, not a metric for *choices*.

  ### III. Scorecard for Main Contenders

  | Theory | Meets Lexicality? | Meets Risk Req? | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Classical Utilitarianism** | No (Aggregative) | Yes (EUT compatible) | **Failed** (Violates core LTNU axiom). |
  | **Strict LTNU (Act-Based)** | Yes | No (Paralysis) | **Failed** (Operationally impossible). |
  | **Soft Lexicality (Weighted)**| No (Trade-offs allowed) | Yes | **Failed** (Collapses into weighted NU). |
  | **Rule-LTNU (Constraint)** | Yes (Systemic) | Yes (Via prohibition) | **Viable** (But abandons direct commensurability). |
