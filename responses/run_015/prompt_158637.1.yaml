answer: |-
  These are exceptionally strong drafts. They target the precise fault lines in strong GWT (the Block/Ned Block critiques, the timing problem, the split-brain data, and the substrate independence issue).

  However, for a podcast format, they can be tightened to be more conversational while retaining their logical teeth. To prevent the **"open empirical program"** deflection, each question is framed below to demand a *conceptual* commitment first. If the theory claims identity (P = A), it must be conceptually coherent *before* we look for the data.

  Here are your four questions, refined for oral delivery and logical trapping, plus a fifth question on evolutionary function to complete the set.

  ### Question 1: The "Broadcast but Blank" Problem (Block-Style Priming)
  **Moderator:** "Let's start with the distinction between access and phenomenology. In Block-style subliminal priming, we see stimuli triggering frontal-parietal broadcasting networks without verbal report. Most GWT proponents call this 'pre-conscious broadcast.' If phenomenal consciousness is *identical* to broadcasting, what is your non-circular criterion for distinguishing a broadcast that is phenomenally conscious from one that is phenomenally blank? If the neural dynamics are the same, what exactly is missing in the blank case?"

  **Follow-up (The Reportability Trap):**
  *If she invokes reportability as the marker:*
  "So reportability is essential. Now, imagine an artificial architecture with identical sparse global broadcasting dynamics but no verbal report module—perhaps it outputs binary code instead. By your definition, is it conscious? If yes, you've abandoned reportability as essential. If no, you haven't defined consciousness by broadcast dynamics at all, but by the presence of a specific biological output channel. Which is it?"

  > **Why this blocks the deflection:** It forces her to choose between a functional definition (which includes the AI) or a biological one (which undermines the functionalist claim of GWT). She cannot say "we need more data" because the thought experiment isolates the variable *now*.

  ### Question 2: The Latency and Continuity Gap
  **Moderator:** "There is a well-known latency gap: neural broadcasting unfolds over roughly 200–300 milliseconds, yet subjective experience seems continuous and immediately present. Some predictive-processing accounts resolve this by treating phenomenal presence as a post-hoc reconstructed narrative. Do you accept that phenomenal continuity is, in part, an illusion of temporal binding, or does your theory require a 'workspace clock' mechanism that assigns a single phenomenal timestamp to the broadcast?"

  **Follow-up (The Reconstruction Contradiction):**
  *If she accepts the reconstructed-narrative view:*
  "If the experience is a post-hoc reconstruction, then phenomenal consciousness isn't literally the broadcast content itself, but a *model* of that content generated later. Doesn't that undermine your core identity claim? You'd be admitting that what we experience is a downstream simulation of the workspace, not the workspace activity itself."

  > **Why this blocks the deflection:** It attacks the "Identity" claim directly. If the experience is a reconstruction *of* the broadcast, then Experience ≠ Broadcast. She must either concede the identity claim is loose or defend a "magic timestamp" mechanism.

  ### Question 3: The Split-Brain and Linguistic Access
  **Moderator:** "In split-brain patients, information processed by the right hemisphere often never reaches the left-hemisphere global workspace. You presumably deny phenomenal consciousness to that isolated right-hemisphere processing. Yet, we see 'fringe awareness'—skin conductance responses, forced-choice discrimination—without left-hemisphere report. How do you avoid arbitrarily equating consciousness with left-hemisphere linguistic access? At what point does 'unconscious discrimination' become 'conscious experience' if not by report?"

  **Follow-up (The Falsification Condition):**
  *If she appeals to interhemispheric inhibition preventing workspace entry:*
  "Okay, let's set a falsification condition. What specific empirical result—say, direct right-hemisphere stimulation producing integrated, reportable experience in the absence of left-hemisphere involvement—would force you to concede phenomenal consciousness exists outside the global workspace? If no such result is possible even in principle, isn't the theory unfalsifiable?"

  > **Why this blocks the deflection:** Scientists respect falsification conditions. By asking "What would change your mind?", you prevent her from moving the goalposts later. If she says "nothing could change my mind," she admits it's dogma, not science.

  ### Question 4: Substrate Independence and AI
  **Moderator:** "Contemporary small-scale artificial networks can implement working-memory bottlenecks and sparse cross-module broadcasting that structurally mirror global workspace dynamics. If consciousness is substrate-independent and identical to these dynamics, should we assign phenomenal consciousness to any sufficiently connected transformer with a bottleneck? Or do you require a specific biological implementation detail?"

  **Follow-up (The Biological Retreat):**
  *If she requires biological specifics:*
  "Which specifics? Neurotransmitter profiles? Thalamocortical loops? And critically: do those conditions play a functional role in the broadcasting dynamics, or are they merely correlated? If they are merely correlated, you've reintroduced a non-functional phenomenal property you set out to eliminate. If they are functional, then a silicon substrate mimicking that function should also be conscious."

  > **Why this blocks the deflection:** It corners her on "Biological Naturalism." She either accepts AI consciousness (controversial) or admits biology matters (which requires explaining *why* biology matters functionally, which GWT struggles to do).

  ### Question 5: The Evolutionary Function of Phenomenality (The "Why" Question)
  **Moderator:** "My final question concerns evolution. If global broadcasting handles information integration, decision selection, and reportability, it seems to do all the *work* required for survival. If phenomenal consciousness is literally identical to this access, why does it *feel like anything* to be the workspace? What evolutionary advantage does the *phenomenal character* add over a 'philosophical zombie' workspace that broadcasts and acts without inner experience?"

  **Follow-up (The Epiphenomenalism Trap):**
  *If she says 'The feeling is just what the function looks like from the inside':*
  "That suggests the feeling is a passive perspective, not a causal driver. But if the *access* does all the causal work, and the *feeling* is just the perspective on that work, aren't you flirting with epiphenomenalism? You're claiming the feeling doesn't *do* anything extra, which makes it hard to explain why natural selection would specifically tune for *phenomenality* rather than just complex access."

  > **Why this blocks the deflection:** This is the Hard Problem in disguise. Strong GWT tries to dissolve the Hard Problem by saying P = A. This question forces her to explain why nature bothered making A *feel like* P. If she says "it doesn't matter," she undermines the adaptive value of consciousness. If she says "it does matter," she must explain how the *feeling* causes something the *access* doesn't.

  ### Moderator Tips for Handling the "Empirical Deflection"
  If she attempts to say, *"These are deep questions, but we need more empirical data to settle them,"* you can interject with:

  *   "I agree data is crucial, but your theory makes a *conceptual* claim: that P is *identical* to A. Identity claims are philosophical commitments first, empirical second. If the concept of 'Identity' breaks down in these edge cases, no amount of fMRI data will fix the definition."
  *   "I'm not asking for the neural correlate yet; I'm asking for the *truth conditions* of your theory. What *counts* as consciousness in your framework before we measure it?"
