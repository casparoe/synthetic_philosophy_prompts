answer: |-
  The stalemate is a conceptual cross-purposes dispute rooted in conflicting sortal commitments regarding individuation conditions, rather than a substantive disagreement over biology or modal logic.

  To diagnose this precisely, we must evaluate the possible structures of the stall. It is not merely verbal, as both sides agree on the definitions of 'sperm', 'egg', and 'zygote', nor is it hidden empirical, since the biological data regarding chimerism and twinning are accepted by both. It is also not purely a clash of bedrock intuitions, though those play a role; rather, it is a substantive but masked disagreement about the *domain of application* for identity conditions. The modal metaphysicians are operating with a sortal concept of 'person' or 'human being' that functions as a historical individual, akin to a Kripkean rigid designator fixed at origin. The philosophers of biology are operating with a sortal concept of 'organism' that functions as a homeodynamic process sustained by metabolic continuity. When the metaphysician asks, "Could you have come from different gametes?", they are asking about transworld identity conditions for a historical particular. When the biologist replies, "Organisms are sustained by process," they are answering a question about diachronic persistence conditions in the actual world. They are answering different questions using the same vocabulary.

  This divergence is clarified by distinguishing 'gamete-essentialism' from 'causal-zygotic essentialism'. Gamete-essentialism posits that the specific haploid genomes are essential to you. Philosophers of biology successfully undermine this by citing monozygotic twinning (where one zygote yields two persons with identical origins) and chimerism (where two zygotes yield one person), demonstrating that genomic origin is not biologically unique to the individual. However, modal metaphysicians often retreat to causal-zygotic essentialism, arguing that even if the genome were identical, the *particular* diploid cell formed in that exact spatiotemporal causal chain is essential. This view insulates origin essentialism from biological counterexamples by shifting the essential property from the material composition (DNA) to the historical event (fertilization). The biologist rejects this because, from a developmental systems perspective, the zygote is not a natural kind boundary but an arbitrary slice of a continuous process; there is no biological "moment" where identity locks in.

  Consequently, progress will not come from biological discovery or formal logical results, as both sides already accommodate the relevant data and apparatus. A formal result in the logic of identity cannot dictate which sortal concept ('person' vs. 'organism') maps onto reality, because identity is sortal-relative. Progress requires a conceptual distinction that dissolves the question by acknowledging sortal relativity: we must accept that 'you' qua biological organism may not have your origin essentially (due to process continuity), while 'you' qua metaphysical person or historical individual may have your origin essentially (due to causal fixation). Unless both camps accept that origin essentialism is sortal-sensitive rather than absolute, we should expect a permanent impasse, as each side is defending a different pragmatic utility for the concept of identity—one for moral and legal responsibility (favoring fixed origin), the other for medical and biological continuity (favoring process).
