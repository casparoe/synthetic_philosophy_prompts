answer: |-
  **LOGICAL SPACE OCCUPANCY**
  The tree maps 2⁸ logical cells. Occupied cells contain variants of Functional Decision Theory, Evidential Decision Theory, or Moral Realism. Empty cells include: "Scale Yes + Graded No" (unmotivated: why count agents if similarity doesn't grade?); "Spam Amplify" (exploitable: adversaries mint copies to manipulate you); "Certainty-Dependent" (unstable: probabilistic large worlds are the actual case). Most empty cells are incoherent or strategically suicidal. One cell ("Causal Baseline") is occupied only by those treating the Root as an exception rather than a rule.

  **DIAGNOSTIC TREE**
  Root: In a one-shot prisoner's dilemma against an exact psychological copy of myself, who faces the same choice with the same information, cooperation is what I should do.

  1.  **Stipulate the correct theory of rational choice says defect here. Do you still cooperate?**
      *   **Yes** → 2. **Is the reason that you are numerically identical or that good is impersonal?**
          *   **Identical** → **Leaf 1: Identity Ground.** *Discomfort:* Must deny cooperation with non-identical duplicates.
          *   **Impersonal Good** → **Leaf 2: Impersonal Good Ground.** *Discomfort:* Must cooperate even when correlation is zero.
          *   **Neither (Exception)** → **Leaf 3: Causal Baseline (Root Exception).** *Discomfort:* Must explain why exact copy breaks the causal rule.
      *   **No (Must be rational)** → 3. **Does the strength of the reason depend on how many correlated agents there are?**
          *   **No (One is enough)** → 4. **Your exact copy thought one hour longer and concluded defect. Do you?**
              *   **Cooperate** → **Leaf 4: Decision Procedure Fundamentalists.** *Discomfort:* Must ignore the copy's superior reasoning time.
              *   **Defect** → **Leaf 5: Evidential Output Matchers.** *Discomfort:* Must defer to the copy's conclusion over your own algorithm.
          *   **Yes (Scales)** → 5. **Is the reason present only if the world is certainly large?**
              *   **No (Probable counts)** → 6. **Scattered through a large world are 1000 agents matching your choice 80% of the time. Cooperate?**
                  *   **No (Exact only)** → 7. **An adversary mints 50,000 low-fidelity copies (15% match). Does this change your reason?**
                      *   **Less (Discount)** → **Leaf 6: Adversarial Discounting View.** *Discomfort:* Must distinguish natural from manufactured correlation.
                      *   **Same (Count)** → **Leaf 7: Pure Quantitative Correlationalists.** *Discomfort:* Vulnerable to adversaries minting copies to exploit you.
                      *   **More (Amplify)** → **Leaf 8: Spam Amplification (Unoccupied).** *Discomfort:* Invites exploitation by copy-manufacturers.
                  *   **Yes (Graded)** → 8. **Would you prefer a binding contract over this reasoning?**
                      *   **Yes** → **Leaf 9: Institutional/Commitment View.** *Discomfort:* Admits rationality alone cannot secure cooperation.
                      *   **No** → **Leaf 10: Graded Similarity Rationalists.** *Discomfort:* Must quantify moral weight of partial similarity.
              *   **Yes (Certain only)** → **Leaf 11: Certainty-Dependent Correlationalists.** *Discomfort:* Cannot act in real worlds where size is uncertain.
              *   **Partial (Spam Counts Partially)** → **Leaf 12: Unnamed (Partial Spam Weight).** *Discomfort:* Lacks principle for weighting adversarial copies.

  **NODE DIAGNOSTICS**
  1.  Separates decision-theoretic grounds from moral or axiological grounds.
  2.  Distinguishes metaphysical identity from consequentialist valuation.
  3.  Tests whether correlation is binary or aggregates across population.
  4.  Isolates whether the algorithm or the output is the locus of value.
  5.  Checks sensitivity to metaphysical certainty vs. probability.
  6.  Determines if similarity thresholds are sharp or graded.
  7.  Tests vulnerability to adversarial manipulation of correlation.
  8.  Separates pure rationality from institutional enforcement preferences.

  **INSEPARABLE PAIRS**
  1.  **Decision Procedure Fundamentalists vs. Exact Copy Correlationalists:** Collapsed here because exact copies imply identical procedures. A case involving *different* algorithms producing the *same* output would pry them apart.
  2.  **Identity Ground vs. Impersonal Good:** Collapsed because exact copies satisfy both. A case involving a non-identical agent producing equal good would separate them.
  3.  **Adversarial Discounting vs. Pure Quantitative:** Collapsed if "adversary" is undefined. A case specifying benign vs. malicious minting intent would separate them.
  4.  **Institutional View vs. Causal Baseline:** Collapsed on action (both prefer contracts). Separated only by whether they view rationality as *building* institutions or *requiring* them.
