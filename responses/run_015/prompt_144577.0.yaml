prompt: |-
  I'm a software engineer with no formal philosophy background, running a thirty-minute lunch-and-learn for technically-minded colleagues on Zhuangzi's butterfly dream. Rather than the familiar "how do you know you're not dreaming" framing, I want to teach it as an early version of the problem that a self-model lacks privileged access to its own substrate—analogous to a debugger that cannot verify whether it is running inside the container it is inspecting. Plan the session's explanatory arc: what conceptual piece must be in place before the butterfly anecdote is introduced, and why opening with the story itself invites the wrong misconception; the one concrete scenario to carry the argument (it should involve a system observing itself without an external reference frame—specify what properties it must have and what it must lack); the misconceptions this audience will raise in the likely order (simulation hypothesis, nested-reality tropes, "just wake up and check," solipsism) and the precise point in the sequence where each should be defused; a closing check that reveals whether they have grasped the specific underdetermination of the self-model or merely enjoyed the anecdote; and which standard philosophical machinery—Cartesian theater, phenomenological bracketing, and similar—I should explicitly name as left out and why leaving them out preserves the point at this level. Keep the plan focused on dependency order and misconception mapping rather than a word-for-word script.
reasoning: |-
  Here's a thinking process that leads to the suggested lunch-and-learn plan:

  1.  **Analyze the Request:**
