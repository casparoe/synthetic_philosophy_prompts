answer: |-
  The disagreement is substantive rather than verbal, rooted in a conflation of pragmatic coherence with epistemic authority that relies on an untenable metaphysics of diachronic agency. Your hypothesis is correct that the debate is a proxy war, but the deeper structural fault line is not merely about whether rationality has a diachronic dimension, but about whether the normative force of Reflection derives from the identity of the agent over time or from the evidential relationship between time-slices. The Dutch Book argument establishes only that violating Reflection makes an agent vulnerable to a sure loss *if* she treats her future selves as legitimate counterparts for betting purposes; it cannot establish that violating Reflection is epistemically irrational unless one already assumes that pragmatic consistency across time is constitutive of epistemic rationality. Critics reject this constitutive link, arguing that epistemic rationality is a matter of fitting credences to evidence, and since evidence can degrade or conceptual schemes can shift, temporal succession does not guarantee epistemic privilege.

  The impasse persists because defenders and critics are operating with incompatible commitments regarding the metaphysics of the agent. Defenders require a persisting agent whose welfare is aggregated over time to make the Dutch Book sting; critics treat the agent as a sequence of time-slices where later slices may be epistemically inferior to earlier ones. When you introduce the drug case or the fission variant, you expose that Reflection presupposes a unified locus of agency that survives temporal transformation without loss of epistemic access. The "proviso" defenders add to save the principle is an admission that temporal location is not the source of normative force; evidential access is. Consequently, the principle collapses into a deference norm toward future experts, which renders Reflection derivative rather than fundamental. If the future self is not an expert (due to forgetting or impairment), Reflection does not apply; if the future self is an expert, Reflection is redundant to general expert principles.

  Your second case regarding radical theory change highlights a formal limitation that is often treated as a boundary condition but is actually a structural failure. Reflection presupposes a fixed algebra of propositions across time; it requires that $P$ be expressible and identifiable at $t$ and $t'$. In cases of conceptual change, this identity condition fails, and the principle goes silent not because the case is outside its domain, but because the formalism cannot map the relationship between the old and new conceptual schemes. This supports your suspicion of conservatism: Reflection is a coherence constraint for stable agents within stable languages, not a general norm for learning agents. The disagreement about whether these cases are counterexamples or exclusions is therefore a disagreement about whether the principle aims to describe ideal rationality or manage actual cognitive trajectories.

  Progress is unlikely so long as the field seeks a single principle to govern both pragmatic planning and epistemic updating. The Dutch Book argument cannot settle the normative status of Reflection because it addresses only consistency, not accuracy or truth-tracking. A productive path forward requires splitting the project: one norm for diachronic pragmatic coherence (where the agent is treated as a unified bettor) and a separate norm for epistemic deference (where the agent treats future selves as evidence-bearing sources). Alternatively, progress lies in accuracy-based frameworks that evaluate updating rules directly rather than via constraints on credence pairs, though these too struggle with conceptual change. If the goal is a unified theory of diachronic rationality that covers forgetting, fission, and conceptual shift without ad hoc provisos, no progress should be expected because the unity being sought is not there to be found.
