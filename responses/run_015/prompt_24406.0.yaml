      *   *The Carroll Paradox:* This is a classic problem in epistemology and logic. It highlights the distinction between *premises* (propositions) and *rules of inference* (operations).
      *   *Premise (1):* "To be rationally entitled... a person must have a reason for the step." This is plausible but ambiguous. Does "reason" mean a *propositional reason* (another belief) or an *operative capacity* (knowing how to infer)?
      *   *Premise (2):* "The only possible reason for that step is a further premise..." **This is the crux.** This is the "Intellectualist Legend" (Gilbert Ryle's term). It assumes that knowing *how* to infer must be reduced to knowing *that* something is the case. Carroll's Tortoise forces this reduction, but most philosophers argue this is a category mistake.
