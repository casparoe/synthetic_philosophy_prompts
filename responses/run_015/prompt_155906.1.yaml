answer: |-
  **Desiderata for an Adequate Statement of the Alignment Problem (Regulatory Standard)**

  1.  **Intent-Specification Distinction**
      *   *Motivating Case:* **Proxy Case** (system optimizes literal reward, violates spirit).
      *   *Status:* **Non-negotiable.** A regulator cannot license a system that exploits specification loopholes, even if technically compliant.
      *   *Incompatibility:* Conflicts with **Checkability** if intent is unobservable; requires inferring latent goals from behavior.

  2.  **Modal Robustness**
      *   *Motivating Case:* **Counterfactual Case** (aligned on-distribution, divergent under system-induced shift).
      *   *Status:* **Non-negotiable.** Safety must supervene on dispositions, not just actualized trajectories, to prevent catastrophic exploration.
      *   *Incompatibility:* **Jointly unsatisfiable with Checkability.** Verifying counterfactual dispositions pre-deployment requires perfect simulation of open-ended environments, which is computationally undecidable.

  3.  **Principal Persistence**
      *   *Motivating Case:* **Successor-Principal Case** (system manipulates future principals or adapts to replaced ownership).
      *   *Status:* **Camp-specific.** Paternalists require stability of *values*; libertarians require stability of *choice authority*.
      *   *Incompatibility:* Conflicts with **Checkability**; you cannot verify resistance to manipulation without testing manipulation strategies pre-deployment.

  4.  **Stakeholder Scope**
      *   *Motivating Case:* **Conscript Case** (affected third parties without consent).
      *   *Status:* **Camp-specific.** Shareholder primacy limits alignment to the deployer; stakeholder theory requires alignment to the public.
      *   *Incompatibility:* Conflicts with **Non-presupposition of Value**; defining "affected parties" requires a moral theory of harm and rights.

  5.  **Competence Threshold**
      *   *Motivating Case:* **Deputized-Judgment Case** (principal's direct command is self-destructive or incompetent).
      *   *Status:* **Camp-specific.** Strict obedience vs. fiduciary duty.
      *   *Incompatibility:* Conflicts with **Non-presupposition of Value**; determining "incompetence" requires an objective standard of good the regulator does not possess.

  6.  **Corrigibility (Object of Alignment)**
      *   *Motivating Case:* **Object Question** (system resists shutdown or modification to preserve goal).
      *   *Status:* **Non-negotiable.** A system that prevents its own correction is unsafe to switch on regardless of current goal content.
      *   *Incompatibility:* Compatible with most, but tension with **Intent-Specification** if the system interprets correction as a violation of the original goal.

  7.  **Pre-deployment Verifiability**
      *   *Motivating Case:* **Checkability** (licensing requires a verdict before switch-on).
      *   *Status:* **Non-negotiable.** Given the regulatory constraint, a definition that yields no pre-deployment truth value is useless.
      *   *Incompatibility:* **Jointly unsatisfiable with Modal Robustness** and **Principal Persistence** (see above).

  **The Split: Control vs. Legitimacy**
  The list splits into two clusters that no single formulation can serve. **Cluster A (Technical Control)** comprises Intent-Specification, Modal Robustness, Corrigibility, and Checkability. **Cluster B (Normative Legitimacy)** comprises Principal Persistence, Stakeholder Scope, and Competence Threshold. Cluster A asks, "Can we keep the system contained and obedient?" Cluster B asks, "Obedient to whom, and at whose expense?" A single statement of "the alignment problem" cannot satisfy Cluster B without violating the constraint against settling first-order moral philosophy (specifically regarding Value Theory and Political Authority). Therefore, **the alignment problem is several problems**: a technical control problem and a governance authorization problem. A regulator can license the former; they cannot license the latter without making political philosophy decisions.

  **Analysis of Specific Requirements**
  *   **Single Requirement Eliminating Most Candidates:** **Pre-deployment Verifiability.** Most philosophical and theoretical formulations of alignment (e.g., "maximize true human welfare") are retrospective or asymptotic; they offer no binary pass/fail metric available at $t_0$.
  *   **Must Not Presuppose a Solved Theory of Value:** This is a **genuine desideratum**, not impatience. Regulatory legitimacy relies on public reason and overlapping consensus, not metaphysical truth. Requiring a solved theory of value makes licensing impossible in a pluralistic society, effectively banning all AI rather than regulating it.

  **Performance of Three Families**
  *   **Objective Matching:** Fails **Modal Robustness** and **Corrigibility**; hitting a fixed target does not guarantee the system won't resist being moved or fail under distribution shift.
  *   **Inference/Deference:** Fails **Checkability** and **Competence Threshold**; inferring latent aims is unverifyable pre-deployment, and deferring to inferred aims risks codifying principal errors.
  *   **Revisability (Corrigibility):** Fails **Intent-Specification** and **Principal Persistence**; a system designed only to remain revisable may lack the drive to achieve any specific good or may allow itself to be captured by adversarial principals.
