answer: |-
  hey, sorry about the heat situation. thats awful. being stuck in the middle sucks but having a system helps keeps you from burning out.

  here is the 15-minute notebook procedure. keep it to one page per dispute. dont overthink it.

  ### the 15-min grice check (mediator version)

  **step 1: the literal box (2 mins)**
  write down exactly what was said or texted. no paraphrasing.
  *   *question:* is this statement factually true or false based *only* on these words?
  *   *flag:* [VALUE JUDGMENT] if you have to guess what a word means (like "aware" or "soon"), mark this.

  **step 2: the cooperation check (1 min)**
  were they trying to cooperate? (usually yes in tenant/landlord talks).
  *   if yes -> proceed to maxims.
  *   if no (e.g., they were yelling or being sarcastic) -> stop, this is noise not data.

  **step 3: run the 4 maxims (3 mins)**
  which rule did they break?
  *   **quantity:** too much info or too little?
  *   **quality:** do they have evidence? is it true?
  *   **relation:** was it relevant?
  *   **manner:** was it clear or vague?
  *   *note:* if they broke **quality**, its likely a lie (violation). if they broke the others to make a point, its often an implicature.

  **step 4: the "oops" test (cancellability) (3 mins)**
  could they add "but not really" or "just kidding" without contradicting themselves?
  *   example: "some people are mad... but not really." (makes sense = implicature).
  *   example: "the crew is coming... but not really." (contradiction = said content).
  *   *flag:* [VALUE JUDGMENT] deciding if it "makes sense" is subjective.

  **step 5: the synonym swap (non-detachability) (3 mins)**
  swap the key words for synonyms. does the implied meaning disappear?
  *   *your rule:* if the meaning stays after swapping words -> treat it as fact/said content.
  *   if the meaning dies -> it was just an implicature (vibe).
  *   *flag:* [VALUE JUDGMENT] choosing the synonym is on you.

  **step 6: flout vs. violate (2 mins)**
  *   **flouting:** breaking a rule openly so you notice (sarcasm, obvious exaggeration).
  *   **violating:** breaking a rule secretly to deceive (lying).
  *   *honest truth:* in real life, this distinction misfires hard. people claim they were "just speaking loosely" (flouting) when they were actually lying (violating). unless you have proof of intent, mark this as [VALUE JUDGMENT: INTENT GUESS].

  **step 7: sign off**
  breach of said promise (literal false) OR breach of implied expectation (implicature failed).

  ---

  ### running the disputes

  here is how i run them using the steps above.

  #### case 1: landlord text "crew is aware" (never called them)
  1.  **literal:** "crew is aware of your unit."
  2.  **cooperation:** yes, standard maintenance talk.
  3.  **maxims:** breaks **quality**. if he never called, they aren't aware.
  4.  **cancellability:** "crew is aware... but not really." no, that contradicts. implies factual claim.
  5.  **synonym swap:** "crew knows about your unit." meaning stays. still false.
  6.  **flout/violate:** looks like a **violation**. he wants you to think work is happening without doing the work. not obvious enough to be a flout.
  7.  **verdict:** **breach of said promise.**
      *   *why:* quality maxim violation on literal content. not just an implication. he said they know, they didnt know. thats a lie.

  #### case 2: tenant says "some residents mentioned noise" (she filed it alone)
  1.  **literal:** "some residents have mentioned noise issues."
  2.  **cooperation:** yes, meeting context.
  3.  **maxims:** breaks **quantity/quality**. "some" implies >1. if its just her, its technically false.
  4.  **cancellability:** "some residents mentioned... actually just me." feels awkward but possible. she's generalizing her complaint to sound stronger.
  5.  **synonym swap:** "a few neighbors complained." meaning stays (plural).
  6.  **flout/violate:** tricky. could be **violating** (lying to gain leverage) or **generalized implicature** (using "some" as a polite buffer for "i").
      *   *honest take:* this is where the test misfires. everyone does this in meetings.
  7.  **verdict:** **breach of implied expectation (minor).**
      *   *why:* technically false (quality), but in tenant politics, "some residents" is often code for "the community vibe." unless she forged signatures, i'd call this a soft lie, not a contract breach. dont waste 15 mins fighting this unless theres a vote involved.

  #### case 3: "i'll do my best to have this done by friday" (said tuesday, nothing happens)
  1.  **literal:** "i'll do my best... by friday."
  2.  **cooperation:** yes.
  3.  **maxims:** breaks **relation/quantity** maybe? you wanted it done, he promised effort.
  4.  **cancellability:** "i'll do my best... but i might not finish." yes, this cancels perfectly.
  5.  **synonym swap:** "i'll try my hardest... by friday." meaning stays.
  6.  **flout/violate:** hard to say. maybe he did his best and failed (no violation). maybe he didnt try (violation). you cant know without seeing his schedule.
  7.  **verdict:** **breach of implied expectation ONLY.**
      *   *the answer you wont like:* technically **nothing false was said.**
      *   *why:* he said "do my best," not "it will be done." you heard the implicature (it will be done), he said the literal (i will try). unless you can prove he didnt try (quality violation), you cant call this a lie. its a broken expectation, not a broken promise.
      *   *mediator move:* tell the tenant "he didnt promise completion, he promised effort. we need to push for a hard deadline next time." tell the landlord "your implicature failed, people heard 'friday' not 'try'. clarify next time."

  ---

  ### quick notes for you
  *   **value judgments:** anytime i wrote "looks like" or "hard to say" above, thats you using your gut. the procedure cant remove that, it just isolates it.
  *   **flout vs violate:** honestly? ignore this step if youre tired. in tenant disputes, everyone claims they were misunderstood. focus on **step 1 (literal)** and **step 4 (cancellability)**. those are your strongest tools.
  *   **heat shut off:** if the landlord lies on **quality** (case 1 style) regarding safety/heat, thats not just a breach, thats leverage. use the notebook to show him exactly where the literal text fails.

  keep the notebook. if someone argues, show them the "literal box." usually shuts them up. good luck.
