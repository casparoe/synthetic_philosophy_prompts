answer: |-
  Here is the specification for a theory of convention-generated obligation for outsiders. It is designed to be adjudicative, not conciliatory.

  ### I. The Case Load
  A viable theory must generate distinct outputs for the following scenarios without ad-hoc adjustments.

  1.  **The Compliant Visitor:** Follows the norm. (Baseline: Must explain *why* this is the default obligation).
  2.  **The Non-Compliant Visitor:** Breaks the norm. (Must distinguish between *mistake* and *defection*).
  3.  **The Ostentatious Compliant:** Follows the norm but exceeds it visibly (e.g., the over-tipper in a no-tip culture). (Must explain why this can be *worse* than non-compliance).
  4.  **The Quiet Resident:** A visitor who stays indefinitely but never formally naturalizes. (Must identify the threshold where "visitor" obligations dissolve into "resident" rights).
  5.  **The Mass Event:** 10,000 visitors enter a small locale (cruise ship/stag do). (Must handle the point where the "visitor" group becomes the statistical majority and effectively *becomes* the convention).
  6.  **The Law/Convention Split:** The act is illegal but normative (jaywalking in Berlin) OR legal but taboo (chewing gum in Singapore). (Must explain why one might obey the norm against the law, or vice versa).
  7.  **Epistemic Opacity:** The visitor genuinely cannot detect the convention despite reasonable effort. (Must determine if obligation persists without knowledge).
  8.  **The Imported Norm:** A piece of hardware (card terminal) imposes a norm from the visitor's home culture into the host culture. (Must identify who the obligor is when the "host" is an algorithm designed for foreigners).

  ### II. The Non-Collapsible Distinctions
  The theory must treat these as separate variables. Conflating them is an automatic failure.

  1.  **Convention vs. Law vs. Morality:** A convention can conflict with either of the other two. The theory must rank them or explain the conflict, not dissolve it.
  2.  **Reason vs. Requirement vs. Blame:**
      *   *Reason:* I have a motive to do it.
      *   *Requirement:* I am wrong if I don't.
      *   *Blame:* I am liable to sanction/criticism if I don't.
      *   (A theory that makes me *required* to do what I could not *know* is defective).
  3.  **Function of Convention:**
      *   *Coordination:* Solves a recurring game (drive on the left).
      *   *Respect:* Signals acknowledgment of the other (remove shoes).
      *   *Extraction:* A tax on ignorance (tourist pricing).
  4.  **Locus of the Norm:** "The Locals" (specific people) vs. "The Place" (the system/environment).
  5.  **Target of the Wrong:** If a violation occurs, is the victim a *person* (the waiter) or a *practice* (the tipping system)?

  ### III. Empirical Constraints (Social Science & Game Theory)
  The theory cannot contradict established mechanics of social norms.

  1.  **Arbitrariness:** The content of the convention is often irrelevant; the stability is what matters. (Driving left isn't morally better than right).
  2.  **Threshold Dynamics:** Conventions shift when defection crosses a critical mass. (If 51% of people jaywalk, waiting on red becomes the deviation).
  3.  **Detection Asymmetry:** Locals often cannot distinguish tourists from residents, or tourists from other tourists. Non-compliance is often invisible.

  ---

  ### IV. Sorting and Flagging

  **Non-Negotiable (Structural Requirements)**
  *   **The Reason/Requirement/Blame Trichotomy:** If a theory cannot separate these, it cannot handle the *Epistemic Opacity* case.
  *   **The Threshold Dynamics:** If a theory cannot handle the *Mass Event* case, it fails in the modern world. A theory that says "visitors must always comply" breaks when visitors become the majority.
  *   **The Arbitrariness Constraint:** The theory cannot claim the *content* of the convention is inherently moral (e.g., "tipping is good"). It must justify the *form*.

  **Prejudicial (Your Side's Bias Dressed as Logic)**
  *   **"Ostentatious Compliance is Worse":** You feel this is true (the over-tipper is annoying), but a theory might validly argue that over-tipping is merely *inefficient*, not *wrong*. Demanding the theory prove it's "worse" than stiffing is a value judgment, not a logical necessity.
  *   **"Tracking Host Resentment":** You want the theory to validate what locals feel. But locals can be xenophobic or irrational. Making "actual resentment" a metric privileges the host's psychology over normative truth.

  **The Genuine Tension**
  You suspected a conflict between **"Track what hosts resent"** and **"Don't rubber-stamp locals."**
  *   **Verdict:** This is a genuine, unresolvable conflict in the spec.
  *   **Why:** Resentment is descriptive (what *is* felt); Rubber-stamping is normative (what *ought* to be respected). Locals may resent things they have no right to enforce (e.g., a visitor wearing local clothing). If the theory tracks resentment, it validates xenophobia. If it refuses to rubber-stamp, it ignores the actual social friction it claims to solve. You must choose: is the theory about *social peace* (track resentment) or *moral truth* (ignore resentment)? You cannot have both.

  ### V. The Killer Constraint
  **The Distinction Between Reason vs. Requirement vs. Blame.**

  This is the single requirement that rules out the most candidate theories.
  *   **Why:** Most folk theories conflate "I have a reason to comply" (it goes smoother) with "I am required to comply" (it is wrong not to).
  *   **The Test:** The *Epistemic Opacity* case. If I genuinely don't know the norm, do I have a *reason* to guess? Yes. Am I *required* to be right? Maybe. Am I *blameworthy* if I fail? Most theories say "Yes, you should have known." A robust theory must explain why I can be required to do something I couldn't know without being blameworthy for failing. Theories that collapse these three (like simple Deference) fail immediately.

  ---

  ### VI. Theory Audit

  **1. The Standard Coordination Account**
  *   **Mechanism:** Conventions are solutions to coordination problems; we obey to avoid friction.
  *   **Performance:** **Fails.**
  *   **Silent Failure:** It cannot handle **Ostentatious Compliance**. In coordination games, exceeding the norm (tipping extra) is usually treated as neutral or beneficial. It cannot explain why the over-tipper is often viewed as *more* disruptive than the non-tipper. It treats convention as efficiency, not social texture.

  **2. The "Guest/Defer" View**
  *   **Mechanism:** You are a guest in someone's home; hospitality norms require deference to the host.
  *   **Performance:** **Fails.**
  *   **Silent Failure:** It cannot handle **Imported Norms (The Card Machine)**. When the "host" interface is designed by a foreign corporation to extract tips from foreigners, who is the host to defer to? The theory assumes a human agent with authority. It dissolves when the "host" is a globalized system.

  **3. The Friend's "Normative Squatters' Rights"**
  *   **Mechanism:** First occupants set the terms; newcomers cannot unilaterally renegotiate the social contract.
  *   **Performance:** **Fails.**
  *   **Silent Failure:** It cannot handle **Mass Tourism**. When the "newcomers" outnumber the "squatters" (e.g., Venice, Barcelona), the "first" group loses the power to set terms. The theory relies on a stable demographic minority/majority split. It offers no guidance on when the squatters lose their rights due to sheer volume of defection.

  **4. The Crude Rule-Consequentialist Move ("What if every visitor did that?")**
  *   **Mechanism:** Act only on maxims that would work if universalized among the visitor class.
  *   **Performance:** **Fails.**
  *   **Silent Failure:** It cannot handle **Arbitrariness**. If everyone jaywalked safely, utility would be fine. If everyone tipped in a no-tip country, wages might adjust. Consequentialism struggles to condemn breaking *arbitrary* rules that have no negative utility when universalized. It demands a harm ground for conventions that are often purely symbolic.

  **Summary:** None of the four standard models meet the spec. The Coordination account misses the social signal; the Guest view misses the structural reality; the Squatters' view misses the demographic threshold; the Consequentialist view misses the arbitrary nature of convention. You need a hybrid that separates *blame* from *obligation* to handle the ignorance cases, and *respect* from *coordination* to handle the tipping cases.
