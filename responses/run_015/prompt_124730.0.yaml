answer: |-
  You are correct to suspect that the word "Darwinism" is doing too much heavy lifting, but the deadlock is deeper than simple semantics. You and your friend are actually arguing past each other on three distinct levels simultaneously: the **object level** (what the theory is), the **methodological level** (what counts as a test), and the **ontological level** (what kind of thing a scientific law is).

  Here is the structural diagnosis of your stall, followed by the specific distinction required to break it.

  ### 1. The Diagnostic Structure

  **Level One: The Semantic Ambiguity (Story vs. System)**
  You are operating with a definition of Darwinism as **Adaptationism**. This is the practice of looking at a trait (e.g., the human chin) and constructing a post-hoc narrative about why it aided survival. Popper correctly identified this specific practice as often unfalsifiable. If a trait exists, the adaptationist says it was selected for; if it doesn't, it wasn't. That is indeed a "metaphysical research programme."

  Your friend is operating with a definition of Darwinism as **Population Genetics**. This is the mathematical framework describing how allele frequencies change over time under specific pressures. This is testable, quantifiable, and falsifiable. If you predict a frequency shift and it doesn't happen, the model is wrong.

  *The Stall:* You are attacking the *narrative application* of the theory; your friend is defending the *mathematical core*. Popper criticized the former and accepted the latter. You are both right about different objects.

  **Level Two: The Falsifiability Threshold (Universal vs. Statistical)**
  Your intuition about "risky prediction" leans toward the classical Popperian ideal of universal laws (e.g., "All swans are white"). You seem to be looking for evolutionary theory to predict specific future outcomes (e.g., "Species X will evolve trait Y"). When it fails to do that, you classify it as unfalsifiable.

  Your friend is using a modern, statistical standard of falsifiability. In population genetics, predictions are probabilistic (e.g., "Under pressure Z, the frequency of allele A will increase with probability P"). If the frequency doesn't change, the theory is falsified, even if it didn't predict a specific new species.

  *The Stall:* You are demanding **historical prediction** (predicting specific future states of organisms); your friend is offering **statistical prediction** (predicting trends in data). Popper eventually conceded that statistical laws count as scientific, even if they don't predict singular events with certainty.

  **Level Three: The Hidden Intuition (Law vs. Framework)**
  This is the bedrock disagreement. You intuitively view a scientific theory as a **Law of Nature** that stands alone. If the statement "the fittest survive" is tautological, the whole theory collapses.

  Your friend (and the later Popper) views evolutionary theory as a **Methodological Framework**. In this view, the "principle of natural selection" isn't a testable law itself; it is a set of rules for generating testable models. It's like the rules of chess. The rules themselves aren't "true" or "false"; they are the structure within which specific games (models) are played and won or lost.

  *The Stall:* You are asking, "Is this statement true?" Your friend is answering, "Is this system useful for generating true statements?" Popper's shift was realizing that the *principle* is metaphysical, but the *models derived from it* are scientific.

  ### 2. How to Break the Deadlock

  To resolve this, you need to stop arguing about whether "Darwinism" is scientific and start arguing about **abstraction layers**. You need to introduce a formal distinction between a **Principle** and a **Model**.

  **The Distinction:**
  1.  **The Principle of Natural Selection:** This is the abstract claim that differential reproduction leads to change. Viewed in isolation, your friend is right: this is almost tautological. It functions as a metaphysical framework. It cannot be falsified on its own because it requires auxiliary assumptions (about heritability, variation, environment) to make a claim.
  2.  **The Evolutionary Model:** This is the Principle + Specific Initial Conditions + Specific Environmental Constraints. This is what your friend is defending. *This* is falsifiable.

  **The Resolution Move:**
  Ask your friend to agree to this proposition: *"The abstract principle of natural selection is a metaphysical framework, but specific population-genetic models derived from it are falsifiable scientific theories."*

  If they agree, you win your point (that the core concept is metaphysical/unfalsifiable in isolation).
  If you agree, they win their point (that evolutionary biology produces genuine science).

  **Why this works:**
  It mirrors Popper's actual final position. He didn't fully "take back" his claim; he refined it. He admitted that while the *idea* of selection is a metaphysical guide, the *application* of it in modern biology is empirical.

  ### 3. Is It Bedrock?

  If you cannot agree on the Principle/Model distinction, then the disagreement is indeed bedrock. It means you disagree on the **Demarcation Criterion** itself.

  *   **Your Bedrock:** A theory is only scientific if its core axiom is independently falsifiable.
  *   **Their Bedrock:** A theory is scientific if it generates a research program that produces falsifiable sub-claims.

  If you are stuck here, no amount of Popper exegesis will help. You are disagreeing about whether science is a collection of **facts** (your view) or a process of **problem-solving** (their view).

  **The Verdict:**
  The deadlock is not about Popper's biography; it is about **granularity**. You are looking at the theory from a distance (where it looks like a tautology), and your friend is looking at it under a microscope (where it looks like math).

  To end the loop, force the conversation to stop asking "Is Darwinism true?" and start asking "At what level of abstraction does Darwinism become testable?" If you can locate the specific layer where the tautology ends and the prediction begins, the argument dissolves. If you can't, you aren't arguing about Popper anymore; you're arguing about the definition of science itself.
