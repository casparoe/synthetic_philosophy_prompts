prompt: |-
  I have recently been appointed to a municipal infrastructure review board, and we have been tasked with designing a pilot program for resolving technical disputes about public works through prediction markets rather than through conventional expert testimony. The board operates under tight constraints: we must render recommendations within ninety days, none of us are professional economists or forecasters, and any proposal that involves compulsory acquisition of property or intergenerational costs requires a separate democratic sign-off. I need a reusable decision procedure—something my colleagues and I can run in sequence on any incoming proposal—that translates the core logic of governance by prediction markets into practical steps for a non-specialist body.

  The procedure should ask, in a fixed order: how to determine whether the dispute is genuinely about empirical beliefs or disguised value disagreement; what minimal conditions a prediction market must satisfy before its forecast can be treated as advisory rather than binding; where the board must stop and defer to a political process because the resolution depends on distributive judgments; and how to audit for capture by stakeholders with disproportionate capital or expertise. It must include explicit stopping rules—answers that yield an immediate decision not to use the market—and must flag the precise points where judgment cannot be eliminated, especially when the scoring mechanism depends on outcomes observed long after current board members have left office. Please apply the procedure to three cases: a disagreement between hydrologists over which levee design best reduces flood risk over a fifty-year horizon; a proposal to rezone a waterfront district where the technical forecast is uncontested but residents disagree over whether economic growth outweighs community displacement; and a scenario in which the market strongly predicts that a cheap, technically adequate bridge alignment succeeds, but that alignment requires demolishing a registered heritage site that was never priced into the betting conditions. For each case, show where the procedure lands, including the case where its answer conflicts with the board's intuitive preference. Finally, state clearly what the procedure cannot settle—where it is likely to misfire, and which institutional safeguards it still requires outside its own logic.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Member of a municipal infrastructure review board.
      *   **Task:** Design a pilot program for resolving technical disputes using prediction markets instead of expert testimony.
      *   **Constraints:**
          *   90-day timeline for recommendations.
          *   Board members are non-specialists (not economists/forecasters).
          *   Compulsory acquisition/intergenerational costs require separate democratic sign-off.
          *   Need a *reusable decision procedure* (fixed order questions).
      *   **Required Elements in Procedure:**
          *   Distinguish empirical beliefs vs. value disagreements.
          *   Minimal conditions for advisory vs. binding status.
          *   Deference points (distributive judgments).
          *   Audit for capture (capital/expertise asymmetry).
          *   Explicit stopping rules (immediate "no").
          *   Flag points where judgment cannot be eliminated (especially long-term scoring).
      *   **Application:** Apply to three specific cases:
          1.  Hydrologists/Levee design (50-year horizon).
          2.  Waterfront rezoning (Growth vs. Displacement).
          3.  Bridge alignment (Cheap/Technical vs. Heritage Site).
      *   **Conclusion:** State what the procedure *cannot* settle (limitations/misfires) and required external safeguards.

  2.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* Make it actionable for non-experts within 90 days.
      *   *Structure:* Sequential gates. If you fail a gate, stop.
      *   *Gate 1: Empirical vs. Normative.* Prediction markets predict *what will happen*, not *what should happen*.
      *   *Gate 2: Verifiability/Resolution.* Can we actually check the answer later? (Crucial for 50-year horizons).
      *   *Gate 3: Distributive/Political.* Does this involve rights, property, or values? (Constraint: democratic sign-off).
      *   *Gate 4: Market Integrity/Capture.* Can stakeholders manipulate the price?
      *   *Gate 5: Advisory Status.* Given the constraints, should this be binding? (Likely always advisory for a municipal board).

      *Refining the Steps:*
      *   Step 1: The Fact/Value Filter.
      *   Step 2: The Resolution Horizon & Oracle Check.
      *   Step 3: The Rights & Distribution Filter.
      *   Step 4: The Manipulation & Liquidity Check.
      *   Step 5: The Binding/Advisory Determination.

  3.  **Applying the Procedure to Case Studies:**

      *   *Case 1: Levee Design (Hydrologists, 50-year).*
          *   Step 1: Empirical? Yes (flood risk).
          *   Step 2: Resolution? 50 years is too long for a 90-day board. Who verifies in 2074? *Stop.*
          *   *Result:* Do not use market.
      *   *Case 2: Waterfront Rezoning (Growth vs. Displacement).*
          *   Step 1: Empirical? No. "Outweighs" is a value judgment.
          *   *Result:* Immediate Stop. Political process required.
      *   *Case 3: Bridge vs. Heritage Site.*
          *   Step 1: Empirical? Yes (bridge success/cost).
          *   Step 2: Resolution? Yes (bridge stands/falls).
          *   Step 3: Rights/Distribution? Yes (Heritage site demolition = property/cultural rights).
          *   *Result:* Stop at Step 3. Market cannot price the heritage value unless explicitly mandated, but mandate requires democratic sign-off.
          *   *Conflict:* Board might want the cheap bridge, but procedure says "No Market" due to heritage constraint.

  4.  **Addressing the "Judgment Cannot Be Eliminated" Requirement:**

      *   Need to highlight where human discretion remains.
      *   Specifically: Defining the resolution criteria (the "Oracle"), determining what counts as "manipulation," and deciding when a value judgment is disguised as a technical one.
      *   Long-term scoring: Who holds the escrow? Who verifies the outcome in 30 years?

  5.  **Drafting the Limitations/Safeguards Section:**

      *   What does this protocol miss?
      *   It doesn't solve the "Oracle Problem" (who defines the truth).
      *   It doesn't solve the "Time Horizon" problem (markets discount heavily).
      *   It doesn't replace democratic legitimacy for value judgments.
      *   Safeguards: Legal counsel, independent auditors, escrow management.

  6.  **Review and Refine (Self-Correction):**

      *   *Critique:* Is the tone appropriate? Yes, formal but practical.
      *   *Critique:* Did I meet the 90-day constraint? The procedure itself is quick to run, but setting up the market takes time. I need to acknowledge that the *decision* to use the market fits in 90 days, even if the market runs longer. Actually, the prompt says "render recommendations within ninety days." This implies the *board's* work is 90 days. If a market takes 6 months to resolve, the board can't wait. *Correction:* The procedure must flag horizons that exceed the board's ability to incorporate the result into the 90-day recommendation. Or, the market must be pre-existing. Let's assume the board decides *whether to commission* the market. But if the market resolves in 50 years, the board can't use it for a 90-day recommendation.
      *   *Refinement on Case 1:* The 50-year horizon is a killer. A prediction market needs a resolution date. If the resolution is 50 years out, the market price will be heavily discounted and illiquid. Plus, the board is gone. *Decision:* Stop rule on horizon.
      *   *Refinement on Case 3:* The prompt says the heritage site was "never priced into the betting conditions." This is a classic "Goodhart's Law" or "Specification Gaming" issue. The procedure needs to catch this in the "Resolution/Oracle" phase. If the metric ignores a constraint, the market is invalid.

  7.  **Final Polish:**

      *   Ensure the "Stopping Rules" are bold and clear.
      *   Ensure the "Judgment Flags" are explicit.
      *   Check against the "compulsory acquisition/intergenerational costs" constraint.

  8.  **Constructing the Output:** (Mental Outline)
      *   Introduction: Acknowledge the mandate and constraints.
      *   The Protocol (The "Municipal Prediction Market Gatekeeping Procedure").
      *   Step-by-step application to the 3 cases.
      *   Analysis of Conflicts (where intuition clashes with procedure).
      *   Limitations & Safeguards (The "Meta-Commentary").

  *(Self-Correction during drafting)*: Make sure to emphasize the *non-specialist* nature. Avoid jargon like "proper scoring rules" without explanation. Use terms like "Verification" instead of "Oracle."

  *(Final Check on Constraints)*: "Compulsory acquisition... requires separate democratic sign-off." This is a hard stop in the procedure. "Intergenerational costs" -> Hard stop or major flag.

