answer: |-
  # Municipal Infrastructure Review Board: Prediction Market Gatekeeping Protocol (PMG-P1)

  **Purpose:** To determine whether a technical dispute regarding public works is suitable for resolution via prediction market forecasting within the Board's 90-day recommendation window and legal constraints.
  **Users:** Board Members (Non-Specialists).
  **Constraint:** Any "STOP" decision ends the consideration of a prediction market immediately. Conventional expert testimony or political referral must be used instead.

  ---

  ## Phase 1: The Fact/Value Filter
  **Question:** Is the dispute strictly about *what will happen* (empirical), or does it hinge on *what should happen* (normative)?
  *   **Test:** Can the outcome be measured without referencing human preference, ethics, or equity?
  *   **STOP RULE 1:** If the core disagreement involves trade-offs between competing values (e.g., growth vs. equity, cost vs. beauty, efficiency vs. tradition), **STOP.** Do not use a prediction market. Refer to political/democratic process.
  *   **Judgment Flag:** Board members must agree on the wording of the question. Disguised value judgments often look like technical estimates (e.g., "optimal" implies a value).

  ## Phase 2: The Resolution Horizon & Oracle Check
  **Question:** Can the outcome be verified objectively within a timeframe that allows the Board to act on the result, and is there a neutral party to verify it?
  *   **Test:** Is there a specific date by which the outcome will be known? Is that date within the Board's operational window or covered by a standing escrow/oracle mechanism?
  *   **STOP RULE 2:** If the resolution horizon exceeds the Board's legal mandate (e.g., 90 days) or extends beyond the tenure of current oversight mechanisms (e.g., 50 years), **STOP.** Markets discount distant futures heavily and lack accountability.
  *   **Judgment Flag:** Defining the "Oracle" (the entity that declares the outcome). Who verifies the truth in 10 years? If the Board dissolves before verification, the market lacks enforcement.

  ## Phase 3: The Rights & Distribution Filter
  **Question:** Does the resolution of this dispute inherently involve compulsory acquisition of property, destruction of protected assets, or intergenerational costs?
  *   **Test:** Does implementing the "winning" forecast require taking land, demolishing protected structures, or imposing costs on future taxpayers?
  *   **STOP RULE 3:** If Yes, **STOP.** Under municipal charter, these require separate democratic sign-off. A market forecast cannot bypass statutory rights or heritage protections.
  *   **Judgment Flag:** Determining what counts as a "protected asset." (e.g., Is a heritage site a technical constraint or a value constraint?)

  ## Phase 4: The Capture & Liquidity Audit
  **Question:** Can stakeholders with a financial interest in a specific outcome manipulate the market price more easily than they could manipulate conventional expert testimony?
  *   **Test:** Are there concentrated beneficiaries (developers, contractors) who could subsidize betting to skew the price? Is there sufficient liquidity from neutral parties to absorb this?
  *   **STOP RULE 4:** If the stakeholder imbalance is high and no mechanism exists to cap individual positions or subsidize neutral liquidity, **STOP.**
  *   **Judgment Flag:** Assessing "disproportionate capital." This requires estimation, not calculation.

  ## Phase 5: Advisory Status Determination
  **Question:** Given the above, should the market result be binding or advisory?
  *   **Rule:** For all municipal infrastructure under this pilot, market results are **ADVISORY ONLY.**
  *   **Rationale:** Binding markets transfer sovereign authority to capital holders, violating democratic accountability constraints.

  ---

  # Application of Protocol to Case Studies

  ## Case 1: The Fifty-Year Levee
  **Scenario:** Hydrologists disagree on which levee design best reduces flood risk over a 50-year horizon.
  **Board Intuition:** We need the best science; maybe the market can aggregate the hydrologists' confidence levels.

  *   **Phase 1 (Fact/Value):** Pass. Flood risk is empirical.
  *   **Phase 2 (Horizon/Oracle):** **FAIL.**
      *   *Analysis:* The resolution horizon is 50 years. The Board must render recommendations in 90 days. There is no standing "Oracle" to verify flood risk in 2074. Current board members will be deceased.
      *   *Stopping Rule:* STOP RULE 2 invoked.
  *   **Phase 3 (Rights):** N/A (Stopped).
  *   **Outcome:** **Do not use prediction market.**
  *   **Conflict:** The Board may feel the market could "solve" the expert disagreement. The procedure overrides this because the market cannot settle a claim that cannot be verified within a governance timeframe. The long horizon invites extreme discounting and speculation rather than information aggregation.

  ## Case 2: The Waterfront Rezoning
  **Scenario:** Technical forecast is uncontested (growth will occur), but residents disagree over whether economic growth outweighs community displacement.
  **Board Intuition:** The market could predict the *net economic benefit*, which might settle the argument.

  *   **Phase 1 (Fact/Value):** **FAIL.**
      *   *Analysis:* The dispute is not about *if* growth will occur, but whether it *outweighs* displacement. "Outweighs" is a value judgment, not an empirical fact.
      *   *Stopping Rule:* STOP RULE 1 invoked.
  *   **Phase 2 (Horizon):** N/A (Stopped).
  *   **Outcome:** **Do not use prediction market.**
  *   **Conflict:** The Board might want to quantify the "benefit" to make a data-driven decision. The procedure flags that quantifying the benefit does not resolve the *value* of displacement. This requires a democratic sign-off, not a forecast.

  ## Case 3: The Heritage Bridge
  **Scenario:** Market predicts a cheap bridge alignment succeeds technically. However, this alignment requires demolishing a registered heritage site that was *not* priced into the betting conditions.
  **Board Intuition:** The market says the cheap bridge works. We should save the money.

  *   **Phase 1 (Fact/Value):** Pass. Technical success is empirical.
  *   **Phase 2 (Horizon):** Pass. Bridge completion is verifiable.
  *   **Phase 3 (Rights & Distribution):** **FAIL.**
      *   *Analysis:* Implementing the winning forecast requires demolishing a registered heritage site. This is a protected asset/compulsory acquisition issue. Furthermore, the betting conditions excluded this cost ("never priced into the betting conditions"), meaning the market price is fundamentally misleading regarding total social cost.
      *   *Stopping Rule:* STOP RULE 3 invoked.
  *   **Phase 4 (Capture):** N/A (Stopped).
  *   **Outcome:** **Do not use prediction market result.**
  *   **Conflict:** This is the sharpest conflict. The market efficiently identified the cheapest technical solution. However, the procedure forces the Board to reject the market's guidance because the market was structurally blind to a legal/ethical constraint. Using the market here would be "gaming the specification."

  ---

  # Limitations and Required Safeguards

  This procedure is a filter, not a solution. It is designed to prevent the misuse of prediction markets, but it cannot eliminate the need for human judgment. The following areas remain outside the procedure's logic and require external institutional safeguards:

  ### 1. The Oracle Problem (Verification)
  The procedure stops if there is no verifier, but it does not *create* one.
  *   **Risk:** For shorter-term projects, who officially declares the outcome? If the Board dissolves, who pays out the winnings?
  *   **Safeguard Required:** A standing legal escrow account and a designated independent auditor (e.g., the City Auditor's Office) empowered to verify outcomes years after the Board's recommendation is implemented.

  ### 2. The Specification Gaming Risk
  As seen in Case 3, markets optimize for what is measured, not what matters.
  *   **Risk:** Stakeholders will draft betting conditions that exclude negative externalities (like heritage loss) to make a project look "successful" in the market.
  *   **Safeguard Required:** Legal counsel must review the *definition of the resolution criteria* before the market opens, ensuring it aligns with all statutory constraints, not just technical ones.

  ### 3. The Intergenerational Discount
  The procedure stops 50-year horizons, but it does not solve the 10-year horizon problem.
  *   **Risk:** Prediction markets inherently discount the future. A outcome 10 years away is worth less today than a cost incurred today. This biases decisions against long-term maintenance or durability.
  *   **Safeguard Required:** A statutory requirement that market prices for infrastructure durability be adjusted by a "future-weighting factor" determined by legislative mandate, not the market itself.

  ### 4. Democratic Legitimacy
  The procedure correctly identifies value judgments (Case 2) as outside the market's scope, but it does not generate legitimacy.
  *   **Risk:** Rejecting a market result because it violates rights (Case 3) may be seen as ignoring "data."
  *   **Safeguard Required:** Public communication protocols that explicitly frame the market as a *technical sensor* only, never as a *decision-maker*. The Board must retain the final vote to ensure accountability remains with elected/appointed officials, not bettors.

  ### 5. Manipulation Detection
  Phase 4 asks members to judge "disproportionate capital." Non-specialists cannot reliably detect wash-trading or complex hedging.
  *   **Risk:** A developer could bet against their own project to drive up insurance costs for competitors, or bet heavily to create a false consensus.
  *   **Safeguard Required:** Mandatory integration with a regulated exchange or a third-party market operator with surveillance capabilities, rather than running an internal municipal market.

  **Final Note to the Board:** This procedure ensures that prediction markets are used only where they are legally and epistemologically valid. It will likely reject more proposals than it accepts. This is a feature, not a bug. The goal is to prevent the abdication of governance to speculation.
