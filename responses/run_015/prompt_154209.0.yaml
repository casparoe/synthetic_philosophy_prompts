  ## **The Leaves: Explanatory Positions**

  ### **Leaf A: The Character-Modulated View**
  *   **Path:** Node 1 (YES)
  *   **Substantive Commitment:** The macro-historical context sets the stage, but individual psychological variance explains the spread between eager perpetrators and the small minority who resisted. Factors like empathy deficits, authoritarian disposition, or moral disengagement capacity determine who steps forward.
  *   **Most Awkward Commitment:** Risks over-agencizing individuals in a system designed to crush individuality; implies that with "better" people, the system might not have functioned, potentially underestimating the system's power.

  ### **Leaf B: The Culture-Specific "Willing Executioners" View**
  *   **Path:** Node 1 (NO) → Node 2 (YES) → Node 3 (Deep Hatred)
  *   **Substantive Commitment:** A unique, deep-seated eliminationist antisemitism within the specific national culture is the necessary and primary driver. Without this specific cultural programming, the killing would not have occurred at this scale or intensity.
  *   **Most Awkward Commitment:** Flirts with national essentialism; struggles to explain why similar atrocities occur in cultures without this specific historical prejudice.

  ### **Leaf C: The Interactionist Hybrid**
  *   **Path:** Node 1 (NO) → Node 2 (YES) → Node 3 (Generic Permission)
  *   **Substantive Commitment:** Organizational mechanisms require a minimal, generic cultural permission rather than deep ideological hatred. The situation triggers the violence, but a baseline cultural prejudice is the necessary fuel.
  *   **Most Awkward Commitment:** Difficult to empirically measure the "minimum" threshold of cultural permission required; risks being a vague middle ground that is hard to falsify.

  ### **Leaf D: The Structural/Bureaucratic View**
  *   **Path:** Node 1 (NO) → Node 2 (NO) → Node 4 (Bureaucratic)
  *   **Substantive Commitment:** Emphasizes division of labor and role-distance. Killing at a distance through bureaucratic mediation operates as an independent mechanism that dulls moral agency regardless of the killer's immediate social environment.
  *   **Most Awkward Commitment:** Can render individual actors as mere cogs, potentially absolving them of moral responsibility by attributing causality to the abstract system.

  ### **Leaf E: The Incremental Moral Disengagement View**
  *   **Path:** Node 1 (NO) → Node 2 (NO) → Node 4 (Social) → Node 5 (Gradual)
  *   **Substantive Commitment:** Focuses on the *process* of acclimatization. Atrocity is not a single event but a slope; cognitive mechanisms of moral disengagement accumulate over time, distinct from generic peer pressure.
  *   **Most Awkward Commitment:** Hard to pinpoint the exact "tipping point" where morality broke; retrospective analysis may impose a narrative of inevitability on a chaotic process.

  ### **Leaf F: The Pure Organizational/Situationist View**
  *   **Path:** Node 1 (NO) → Node 2 (NO) → Node 4 (Social) → Node 5 (Immediate) → Node 6 (Only Situation)
  *   **Substantive Commitment:** Ordinary men break under specific organizational pressures (authority, peer conformity). The situation is sufficient; no special cultural or structural preconditions are strictly necessary.
  *   **Most Awkward Commitment:** Implies a terrifying universality: almost anyone, anywhere, given the right situational pressures, would commit similar acts.

  ### **Leaf G: The Multi-Causal Overdetermination View**
  *   **Path:** Node 1 (NO) → Node 2 (NO) → Node 4 (Social) → Node 5 (Immediate) → Node 6 (Multiple)
  *   **Substantive Commitment:** Culture, situation, and structure are each independently sufficient. The atrocity occurred because multiple redundant causes converged, making it robust against the removal of any single factor.
  *   **Most Awkward Commitment:** Risks tautology; if everything is sufficient, the explanation loses predictive power about which factor matters most in future cases.

