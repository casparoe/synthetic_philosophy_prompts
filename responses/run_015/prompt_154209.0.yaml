  ## **Annotations: Empty Cells and Separation Failures**

  ### **1. Incoherent Combinations (Empty Cells)**
  The tree structure deliberately blocks certain logical paths because they represent incoherent or empirically unsupported positions.
  *   **Pure Character without Context:** A path suggesting individual psychology explains the atrocity *without* organizational or cultural contribution is blocked. This is **incoherent**; individual variance (Leaf A) can explain the *spread* of behavior, but cannot explain the *mean* (why the majority killed) without a situational or cultural trigger. A "Pure Character" leaf where personality alone drives mass killing absent a permissive system is historically untenable.
  *   **Pure Culture without Mechanism:** A path suggesting cultural hatred alone explains the killing without an organizational mechanism is blocked. This is **unattractive** and implausible; hatred is a disposition, not an action. Without a mechanism (bureaucracy, orders, or social pressure) to translate sentiment into coordinated mass violence, culture remains latent.

  ### **2. Separation Failures (Fuzzy Boundaries)**
  While the tree logically distinguishes between **Leaf F (Pure Organizational)** and **Leaf D (Structural/Bureaucratic)**, readers should note a genuine **separation failure** in historical practice.
  *   **The Overlap:** Both positions deny the necessity of specific culture (Node 2: NO) and individual character (Node 1: NO). The tree separates them at Node 4 based on "Immediate Social Situation" vs. "Bureaucratic Architecture." However, in the record of Battalion 101, peer pressure (Social) and role-distance (Bureaucratic) often operated simultaneously.
  *   **The Flag:** If a reader finds that organizational pressure *requires* bureaucratic division of labor to function effectively, the distinction between Leaf F and Leaf D collapses. They occupy adjacent logical space and are often conflated in historical analysis. The tree separates them by *mechanism type*, but empirically they may represent a single "Systemic" cluster.

  ### **3. The Unexplored Distinction**
  **Leaf E (Incremental Moral Disengagement)** represents the requested less-discussed distinction. Unlike generic peer pressure (Leaf F), which implies a static force acting on the individual, this view posits a dynamic *cognitive process*. It is distinct from the Structural view (Leaf D) because it focuses on the psychological acclimatization of the killer rather than the architectural distance of the killing. This leaf captures the "slippery slope" phenomenon often noted in psychology but less frequently taxonomized in historical debates.
