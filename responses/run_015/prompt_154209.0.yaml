  # The Atrocity Taxonomy: A Decision Tree for Battalion 101

  This interactive taxonomy is designed to sort explanatory frameworks for mass atrocity based on substantive commitments rather than historian names. It uses six diagnostic questions to navigate the logical space between culture, situation, structure, and character. Follow the path that best matches your assessment of the historical record to arrive at a specific explanatory position.

  ### **Node 1: The Variance Question**
  **Does the explanation hinge on individual psychological variance (e.g., empathy differences, authoritarian disposition) to explain why some killed eagerly while a small minority refused?**

  *   **YES:** Proceed to **Leaf A**.
  *   **NO:** (You believe the variance is secondary to explaining why the *majority* participated.) Proceed to **Node 2**.

  ### **Node 2: The Cultural Counterfactual**
  **If these same men were placed in identical organizational conditions but raised in a society with no history of anti-Jewish prejudice, would participation rates drop significantly?**

  *   **YES:** (Culture is a necessary ingredient.) Proceed to **Node 3**.
  *   **NO:** (Universal human responses or structural factors would produce similar rates.) Proceed to **Node 4**.

  ### **Node 3: The Ideological Depth Test**
  **Does the required cultural background consist of a deep, specific "eliminationist" hatred unique to the group, or merely a generic cultural permission to devalue the out-group?**

  *   **Deep, Specific Hatred:** Proceed to **Leaf B**.
  *   **Generic Permission:** Proceed to **Leaf C**.

  ### **Node 4: The Mechanism Locus**
  **Is the primary driver the *bureaucratic architecture* (division of labor, killing at a distance, paperwork) or the *immediate social situation* (face-to-face orders, peer pressure, group cohesion)?**

  *   **Bureaucratic Architecture:** Proceed to **Leaf D**.
  *   **Immediate Social Situation:** Proceed to **Node 5**.

  ### **Node 5: The Temporal Process**
  **Is the compliance driven by immediate situational pressure at the moment of choice, or by a gradual cognitive acclimatization (incremental moral disengagement) over time?**

  *   **Gradual Acclimatization:** Proceed to **Leaf E**.
  *   **Immediate Pressure:** Proceed to **Node 6**.

  ### **Node 6: The Causal Exclusivity**
  **Is situational pressure the *only* necessary explanation, or are other factors (culture, structure) also independently sufficient to cause the atrocity?**

  *   **Only Situation:** Proceed to **Leaf F**.
  *   **Multiple Independently Sufficient Factors:** Proceed to **Leaf G**.

