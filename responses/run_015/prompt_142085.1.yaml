      *   **Goal:** A fact pattern where *Textualism = Broad* and *Purposivism = Narrow*. This reverses the standard student intuition.
      *   **Constraints:**
          *   Self-contained, realistic, one paragraph (agency, licensing, workplace, hospital; no criminal, no sci-fi).
          *   Stable ordinary meaning (no semantic drift arguments).
          *   Divergence must come from text exceeding purpose, not semantic ambiguity.
          *   Realistic drafting (no scrivener's errors).
          *   Thin legislative record (no smoking gun).
          *   No rule of lenity.
          *   Objective purpose (reasonable legislator).
          *   Post-pattern analysis: Reasoning for each method, point of divergence, a "near-variant" where they converge, analysis of removing the load-bearing feature, and the strongest textualist critique + rebuttal.

  2.  **Brainstorming Candidate Scenarios:**

      *   *Idea 1: Environmental Protection.* Statute bans "discharge of pollutants into navigable waters." Purpose: Protect ecosystem health. Fact: Discharge of pure, distilled water that changes temperature slightly (thermal pollution).
