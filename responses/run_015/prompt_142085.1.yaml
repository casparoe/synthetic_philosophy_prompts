      *   *Idea 5: Zoning/Housing.* Statute prohibits "structures exceeding thirty feet in height" in a residential zone. Purpose: Preserve sunlight and neighborhood character. Fact: A radio tower or a statue on a pedestal. It is 35 feet. It casts no shadow (thin).
