      *   *Idea 6: Workplace Safety (OSHA style).* Statute requires employers to provide "protective gear for all body parts exposed to moving machinery." Purpose: Prevent injury from machinery. Fact: A worker wears a loose scarf that gets caught. The statute requires gear *provided by employer*, but the injury is caused by *clothing brought by employee*. Wait, that doesn't fit the "Textualist Broad" requirement.
      *   *Idea 7: Disability Accommodation.* Statute requires public accommodations to remove "architectural barriers" where "readily achievable." Purpose: Access for disabled persons. Fact: Removing a barrier actually *reduces* safety for a specific disabled group (e.g., removing a railing helps wheelchairs but hurts the blind).
          *   *Critique:* Too complex factually.
      *   *Idea 8: The "Vehicle" in the Park variation (reversed).* Statute: "No vehicles allowed in the park." Purpose: Quiet and safety. Textualist: Bicycles are vehicles (broad). Purposivist: Bicycles are quiet/safe (narrow).
          *   *Critique:* This is the *Hart-Fuller* chestnut. Explicitly forbidden ("no classroom chestnuts").
      *   *Idea 9: Tax/Reimbursement.* Statute allows deduction for "expenses incurred in the production of income." Purpose: Net income taxation. Fact: Expenses incurred for illegal income or income that is socially harmful but legal.
          *   *Critique:* Too close to criminal/lenity issues.
      *   *Idea 10: Professional Licensing (The Winner).* Statute: A State Board of Physical Therapy is authorized to discipline any licensee who "practices physical therapy on a family member." Purpose: Prevent conflicts of interest and ensure objective record-keeping/insurance fraud prevention. Fact: A therapist provides *emergency, unpaid, life-saving* aid to a choking child at a family dinner.
