answer: |-
  ### Candidate Scenarios & Discards

  **Candidate 1: The "Reconstructive Surgery" Mandate.**
  *Scenario:* A state statute mandates insurance coverage for "reconstructive surgery following a mastectomy." A male patient seeks coverage for chest reconstruction after a mastectomy for cancer.
  *Discard Reason:* This risks collapsing into a semantic fight over whether "mastectomy" or "reconstructive" inherently implies female anatomy in ordinary usage, triggering Failure Mode 2 (lexicography in costume) rather than a clean text-vs-purpose clash.

  **Candidate 2: The "Overtime Exemption."**
  *Scenario:* A statute exempts employees "engaged in the sale of automobiles" from overtime. A sales manager who oversees but never sells claims the exemption.
  *Discard Reason:* The phrase "engaged in" is a term of art with significant doctrinal baggage regarding "primary duty" tests; students would likely import FLSA case law rather than grappling with the raw methodological divergence, and the textualist argument often relies on regulatory definitions that muddy the water.

  **Candidate 3: The "Museum Vehicle" Inspection (Selected).**
  *Scenario:* A municipal code requires "all vehicles owned by the Department" to undergo annual safety inspection. The Department keeps a vintage car in a lobby for display, never driven.
  *Selection:* This scenario features stable ordinary meaning ("all vehicles," "inspection"), a clear objective purpose (safety of operating machinery), and a result that is wasteful but not "absurd" enough to trigger the textualist's own absurdity doctrine escape hatch.

  ***

  ### The Fact Pattern

  The City of Oakhaven Municipal Code § 14-203 states: "All vehicles owned by the Department of Public Works shall undergo a comprehensive safety inspection every twelve months." The provision was enacted following a high-profile accident involving a brake failure on a city truck, with the legislative findings noting the need to "ensure the operational safety of all municipal machinery in service." The Department owns a 1955 fire engine, fully restored, which is displayed in the lobby of City Hall on permanent concrete blocks with its battery disconnected. It has not been driven in twenty years and is used solely for ceremonial photographs. The Department Director, seeking to cut costs, declines to schedule the annual inspection for the 1955 engine. A citizen taxpayer sues to compel compliance.

  ### Methodological Reasoning

  **The Textualist Approach:**
  The textualist begins with the plain language: "All vehicles owned by the Department." The 1955 engine is indisputably a "vehicle" by ordinary meaning, and it is indisputably "owned" by the Department. The modifier "in service" appears in the legislative findings but not in the operative text of § 14-203. Because the text is unambiguous and contains no exception for non-operational vehicles, the textualist concludes the statute commands the inspection. The textualist reads the statute **broadly** to include non-operational vehicles because the text's coverage extends to the full semantic breadth of "all vehicles," regardless of whether the safety purpose is implicated.

  **The Purposivist Approach:**
  The purposivist looks to the objective purpose of the statute: ensuring the "operational safety of municipal machinery." A vehicle on permanent blocks with no battery cannot pose a safety risk to the public or operators. To apply the inspection mandate to a static display would consume public resources without advancing the statutory goal of accident prevention. Therefore, the purposivist reads the term "vehicles" **narrowly**, implicitly limiting it to "operational vehicles," because extending the mandate to display pieces falls outside the reasonable legislator's intent to promote safety.

  **The Point of Divergence:**
  The methods part ways on **whether purpose can limit clear text.** The textualist treats the purpose as explanatory but not limiting when the text is absolute ("All"); the purposivist treats the purpose as definitional, effectively reading an implicit "operational" qualifier into the word "vehicles" to align the application with the statute's reason for being.

  ### The Near-Variant (Convergence)

  **The Flipped Fact:** Suppose the 1955 engine is kept in the lobby on blocks, but it is started and driven around the lobby once a month for demonstrations.
  **Convergence:** Both methods now require the inspection. The textualist still relies on "All vehicles." The purposivist now agrees that because the vehicle is operational, it implicates the safety purpose (risk of fire, movement, or mechanical failure during demos).
  **The Load-Bearing Feature:** The **total lack of operational risk** in the original scenario. This is the only feature allowing the purposivist to narrow the text without contradicting the safety goal.

  **If That Feature Is Removed:**
  If the vehicle has *any* operational capacity (even if rarely used), the case collapses into an **easy textualist victory** that the purposivist must accept. A purposivist cannot consistently argue that safety regulations don't apply to operating machinery, even if used rarely. The methodological tension vanishes because the purpose now supports the broad textual reading.

  ### The Strongest Textualist Critique & Rebuttal

  **Critique:** "This hypothetical rigs the game by selecting a purpose (safety) that is easily frustrated by the text, while ignoring the textualist's commitment to *legislative supremacy*. If the legislature wanted to exempt museum pieces, they could have written 'all operational vehicles.' By asking the purposivist to rewrite 'all' to mean 'some,' you aren't testing purposivism; you're testing whether students are willing to judicially amend statutes they think are inefficient."

  **Rebuttal:** "The critique conflates *amending* with *interpreting*. The purposivist is not adding an exception for 'museum pieces'; they are defining the scope of 'vehicles' in the context of a safety statute. Just as a textualist accepts that 'vehicle' might not include a toy car in a statute about traffic safety, the purposivist argues that 'vehicle' in a safety statute implies 'vehicle capable of movement.' The hypothetical forces the textualist to defend why their method demands spending public money on a useless act when the text's absolute command yields no marginal safety benefit, highlighting the cost of textual fidelity."
