          *   *Wait, I need Textualist = Broad.* If the text says "shall not accept payment," and they accept payment, Textualist says violation. Purposivist says... well, if the purpose is fraud, and there's no fraud, Purposivist says no violation. This works. But is "accept payment" stable? Yes.
