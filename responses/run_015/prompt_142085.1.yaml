      *   *Idea 3: Licensing Board.* Statute says a board "shall revoke the license of any practitioner who consumes alcohol during working hours." Purpose: Prevent impairment and protect public safety. Fact: A priest/practitioner consumes communion wine or a chef tastes cooking wine.
