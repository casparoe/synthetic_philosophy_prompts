answer: |-
  ### Criteria for Prioritization

  In ranking these questions, I apply four weighted criteria. **Foundational Priority** is paramount: questions that must be resolved before institutional details matter rank highest. **Theoretical Tractability** follows: since empirical work is excluded, I prioritize questions solvable through logic, normative argument, or formal modeling. **Design Impact** measures how much an answer alters the Escalating Sortition Legislature; high-impact questions that could invalidate the vessel are prioritized over those that merely tweak it. Finally, **Neglect** favors under-explored conceptual gaps over well-trodden debates. I weigh Foundational Priority and Design Impact most heavily, as the foundation's goal is to determine legitimacy, not to refine a potentially illegitimate design.

  ### Stage 1: Candidate Question Brainstorm

  1.  **Normative Basis of Binding Authority:** Why obey lot over election? (Upstream: Yes; Tractable: High; Neglect: Low; Impact: Critical)
  2.  **Definability of the Mandate:** Can "abandoning mandate" be defined objectively? (Upstream: Yes; Tractable: Medium; Neglect: High; Impact: Critical)
  3.  **Agenda Chamber Oligarchy:** Does small-group sortition recreate elite capture? (Upstream: No; Tractable: High; Neglect: Medium; Impact: High)
  4.  **Meta-Legitimacy of Recall:** Can one random sample judge another? (Upstream: No; Tractable: High; Neglect: High; Impact: High)
  5.  **Non-Electoral Accountability:** What sanctions exist without reelection? (Upstream: No; Tractable: Medium; Neglect: Medium; Impact: High)
  6.  **Epistemic Division of Labor:** How to use expertise without creating a class? (Upstream: No; Tractable: High; Neglect: Medium; Impact: Medium)
  7.  **Stability vs. Responsiveness:** Do short cycles prevent long-term planning? (Upstream: No; Tractable: Medium; Neglect: Low; Impact: Medium)
  8.  **Statistical Tyranny:** Protection of minorities against random majorities. (Upstream: No; Tractable: High; Neglect: Medium; Impact: High)
  9.  **Incentive Compatibility:** Why participate honestly without career incentives? (Upstream: No; Tractable: High; Neglect: Low; Impact: Medium)
  10. **Transition Legitimacy:** How to install this system democratically? (Upstream: Yes; Tractable: Low; Neglect: High; Impact: Medium)
  11. **Scale and Rotation Math:** Optimal chamber sizes for representation. (Upstream: No; Tractable: High; Neglect: Low; Impact: Low)
  12. **Public Psychology of Acceptance:** Normative conditions for public obedience. (Upstream: No; Tractable: Medium; Neglect: Medium; Impact: High)

  ### Stage 2: Ranked Research Agenda

  **1. The Normative Basis of Binding Authority**
  This is the absolute upstream constraint. If random selection cannot generate a duty to obey that rivals or exceeds election, the Escalating Sortition Legislature is merely a complex advisory body. Theoretical work must articulate why descriptive representation (mirroring the population) generates legitimate coercion. Is it grounded in political equality, the reduction of elite capture, or the epistemic diversity of the crowd? This question dominates the agenda because a negative answer renders all subsequent design features irrelevant. Progress requires a rigorous comparative argument: under what specific conditions does sortition produce *more* legitimate outcomes than elections? If theorists cannot establish a prima facie duty to obey random lawgivers, the project fails. This fellowship should produce a normative framework that justifies binding power without relying on consent-through-voting.

  **2. The Definability of the Mandate for Lottery Recall**
  The Lottery Recall mechanism is the vessel's primary accountability feature, but it relies on a coherent definition of "mandate." If the mandate is too vague, Recall becomes a tool for populism or factional warfare; if too rigid, it paralyzes the legislature. Theoretical work must determine whether a random body can be bound by pre-commitments without violating the principle of fresh representation. This is upstream of the Recall mechanism's design. Can a normative standard for "abandonment of mandate" be constructed that is objective enough for a fresh random sample to adjudicate? If the mandate is purely procedural, Recall is weak; if substantive, it risks turning the Recall sample into a second-guessing policy chamber. Progress would look like a taxonomy of mandate violations that distinguishes between legitimate adaptation and illegitimate drift. If this proves conceptually impossible, the Recall mechanism must be scrapped or radically altered.

  **3. The Oligarchic Risk of the Agenda Chamber**
  The small Agenda Chamber is the most vulnerable point in the vessel. In social choice theory, small groups are disproportionately susceptible to coordination by organized interests, internal factionalization, or agenda manipulation. Even if selected by lot, a small group develops internal dynamics distinct from the larger population. This question is prioritized because if the Agenda Chamber is captured, the larger Deliberative Chamber merely ratifies oligarchic proposals. Theoretical work must model the interaction between small-group dynamics and random selection. Does short rotation prevent capture, or does it increase reliance on unelected staff and lobbyists? This is highly tractable for theorists using formal modeling of agenda control. Progress would involve identifying the threshold size below which random selection fails to prevent elite coordination. If the Agenda Chamber cannot be theoretically secured, the escalation design collapses into a bottleneck.

  **4. The Meta-Legitimacy of Lottery Recall**
  Even if the mandate is definable, a separate conceptual hurdle remains: can one random sample legitimately dissolve another? This is a question of meta-authority. In electoral systems, voters are the principal and officials are agents. In this vessel, both the judge and the judged are agents of the same principal (the demos). Theoretical work must justify why a fresh draw has higher epistemic or normative standing than the sitting chamber. Is it simply a check on corruption, or does it represent a "cooler" head? This is neglected in current literature, which assumes the legitimacy of recall without questioning the status of the recallers. Progress requires a argument for why a temporary, random tribunal possesses the authority to void the decisions of a temporary, random legislature. If this cannot be resolved, the Recall mechanism risks creating infinite regress or instability.

  **5. Non-Electoral Accountability Mechanisms**
  Elections provide a retrospective sanction: the threat of removal. In this vessel, removal is random and recall is exceptional. Theoretical work must identify what replaces the disciplinary function of elections. Without the career incentive to be reelected, what motivates adherence to norms? Is transparency sufficient? Does the threat of Recall provide enough deterrence, or does it create risk-aversion that stifles innovation? This question is critical for the stability of the system. If members have no incentive to consider the long-term or the minority, the system may degrade quickly. This is tractable through game-theoretic modeling of incentives without reelection. Progress would be a model of "sortition incentives" that demonstrates how compliance is maintained absent career politics. If no robust substitute for electoral accountability can be theorized, the system requires external checks.

  **6. Minority Rights and Statistical Tyranny**
  Random selection produces statistical representation, not necessarily protection of minority rights. A random sample can be just as tyrannical as an elected majority, perhaps more so if it lacks the institutional memory of rights protections. This question is ranked lower only because constitutional courts often handle rights, but the Constitutional Chamber here is also selected by lot. Theoretical work must address how a random body constrains itself against its own immediate preferences to protect enduring rights. Is a bill of rights sufficient, or does enforcement require a non-random element? This is highly impactful for the design of the Constitutional Chamber. Progress involves defining the limits of random authority regarding individual liberties. If random bodies cannot be trusted with rights enforcement, the Constitutional Chamber design requires a hybrid element, fundamentally changing the vessel.

  **7. The Epistemic Division of Labor**
  The vessel relies on amateurs making binding decisions. While diversity offers epistemic benefits, complex governance requires specialized knowledge. Theoretical work must define the interface between random judgment and expert testimony without creating a permanent expert class that dominates the agenda. This is a design-critical question for the Deliberative Chamber. How is expertise summoned, vetted, and weighed without granting experts veto power? This is tractable through institutional logic. Progress would be a framework for "subordinated expertise" where experts inform but do not decide. If this balance cannot be theorized, the system risks either incompetence or technocratic capture.

  **8. Stability and Continuity Across Rotations**
  Short rotation cycles ensure freshness but risk policy discontinuity. Theoretical work must address how institutional memory is preserved without creating a permanent bureaucracy that effectively governs. This is a question of temporal legitimacy. Does the system require a non-random clerical class to maintain continuity? This is ranked last because it is a functional problem solvable by design tweaks, whereas the upper questions are existential. However, if the theory of continuity fails, the legislature may be unable to execute long-term strategies. Progress involves a model of information transfer between chambers that preserves intent without preserving power.

  **Dependency and Trade-off Analysis**
  Questions 1 and 2 are the gatekeepers. If the normative basis for binding authority (Q1) is not established, Q3 through Q8 are moot. If the mandate cannot be defined (Q2), the Lottery Recall (Q4) becomes dangerous. Q3 (Agenda Chamber) is the most likely point of practical failure; even if the theory of legitimacy holds, the small group dynamic may undermine it. Q5 (Accountability) is the fallback; if Recall fails, what remains?

  The trade-off in this agenda is between deep normative work (Q1, Q2) and institutional mechanics (Q3, Q6). I prioritize the normative because the foundation's goal is legitimacy, not just functionality. A functional illegitimate system is not a solution. However, Q3 is elevated because the Agenda Chamber is the specific vulnerability of the "Escalating" design.

  **Moving the Ranking**
  This ranking would shift if preliminary theoretical work demonstrates that Q1 is unsolvable in a modern context; in that case, funding should pivot to Q5 (Accountability) to salvage a non-binding advisory model. Conversely, if Q2 (Mandate) is solved easily, Q4 (Meta-Legitimacy) moves up as the next bottleneck. If formal modeling shows the Agenda Chamber (Q3) is inherently unstable regardless of norms, the entire vessel design must be rethought, and funding should shift to alternative chamber structures. The foundation should require fellows to explicitly state how their work constrains or enables the other questions on this list, ensuring the six fellowships function as a coherent research program rather than six isolated projects.
