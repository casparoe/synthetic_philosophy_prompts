      *   **Theme:** Dramatize the conflation of "trajectory-sensitivity" (path changes, outcome same) vs. "basin-sensitivity" (outcome changes). Show how reports force a linear causal narrative onto complex systems. Show the report itself is an intervention.
      *   **Constraints:**
          1.  Exactly five numbered scenes.
          2.  Each scene 120-180 words.
          3.  Short slug title for each scene.
          4.  No preamble, no notes, no afterword.
          5.  Setting: Concrete, mundane, contemporary work/infrastructure (e.g., district heating, ferry, payroll, seed-bank, school admissions). No metaphors like butterflies/tornadoes.
          6.  Trigger: Trivial, morally blank (transposed digit, swapped crate, missed call).
          7.  No exposition: No characters naming concepts (chaos, attractor, contingency, etc.).
          8.  One scene must dwell on irreversible cost (harm/loss) that exists only because of the *route*, even if the *destination* was inevitable.
          9.  Final scene: Verdict open, investigation shown as feedback loop, ends on a line someone in the user's job would sign.
          10. Tone: Professional philosopher of causation + working short-fiction writer. Read aloud to tired, defensive incident reviewers.

  2.  **Brainstorming Settings:**
      *   *Idea 1: School Admissions Database.* A digit swapped in a postcode. Some kids get into the wrong school. The school closes anyway due to budget cuts.
          *   Pros: High stakes for families, mundane bureaucracy.
          *   Cons: Might feel too abstract regarding physical harm.
      *   *Idea 2: District Heating Network.* A valve left slightly open. A pipe bursts. Some houses freeze. The plant was going to fail anyway due to corrosion.
          *   Pros: Physical infrastructure, clear cause/effect feel, potential for harm (cold/health).
          *   Cons: Might be too technical.
      *   *Idea 3: Payroll Migration.* A decimal point error. People get paid wrong. Some can't pay rent. The company goes bankrupt anyway.
          *   Pros: Very mundane, high stress.
          *   Cons: Hard to show physical harm/irreversible cost convincingly without melodrama.
      *   *Idea 4: Ferry Timetable/Logistics.* A crate swapped. Medicines delayed. Patients suffer. The port closes anyway due to strike/weather.
          *   Pros: Connects to hospital theme subtly.
          *   Cons: Might feel too close to the user's personal trauma (hospitals).
      *   *Idea 5: Seed-Bank Freezer.* Temperature log error. Seeds thaw. Specific varieties lost. The bank loses funding anyway.
          *   Pros: Irreversible loss (extinction), mundane trigger (sensor glitch).
          *   Cons: A bit isolated.

      *   *Selection:* **District Heating Network.** It allows for physical discomfort/harm (elderly residents), mundane technical triggers (pressure valve, digit entry), and systemic inevitability (infrastructure decay/budget). It feels heavy and industrial, suitable for reading aloud to tired auditors.

  3.  **Drafting - Scene by Scene Planning:**

      *   **Scene 1: The Trigger.** A technician enters a pressure reading. A single digit wrong. 4.9 instead of 5.9. Mundane, tired, coffee spill maybe? No, just a keystroke.
      *   **Scene 2: The Propagation.** The system reacts. Valves adjust. Water flows differently. A specific pipe section gets stressed.
      *   **Scene 3: The Cost (Constraint 5).** An elderly person suffers because the heat went off in their block specifically due to this route. They get pneumonia/hypothermia. But the system was failing anyway. The harm is real, but the outcome (system failure) was inevitable.
      *   **Scene 4: The Inevitability.** The main plant fails later. Corrosion. The whole network shuts down. The specific harm in Scene 3 didn't change the end state (shutdown), only the path.
      *   **Scene 5: The Report (Constraint 6 & 9).** The investigator writes the report. Blames the keystroke. The report triggers a policy change that causes new issues. Ends with a signature line.

      *   *Refining for Word Count (120-180 words per scene):* This is tight. I need to be economical.
      *   *Refining for Tone:* Needs to be evocative but dry enough for auditors. No moralizing.
      *   *Refining Constraint 5:* The cost must feel significant but futile regarding the final outcome.
      *   *Refining Constraint 9:* The ending line must look like a report sign-off.

