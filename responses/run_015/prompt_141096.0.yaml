      *Scene 1 Draft:*
      1. The Keystroke
      The control room hummed with the low frequency of servers cooling themselves. It was 03:14. The shift lead rubbed his eyes, the screen's blue light catching the grease on his keyboard. He looked at the gauge on the secondary monitor, then back at the input field labeled Pressure_Input_North. His finger hovered. He meant to type 5.9. He typed 5.8. It was not a mistake born of ignorance; the gauge was flickering, ambiguous in the low light. He hit enter. The system accepted the value without question. There was no alarm, no red flash, no sound. The coffee cup next to the mouse had left a ring on the desk blotter. He leaned back, stretching his neck, and watched the flow rates stabilize on the graph. The number sat in the database, a static integer in a sea of moving decimals. Outside, the wind picked up against the concrete walls of the station. He stood up to make more coffee, leaving the terminal active. The network absorbed the digit. Nothing happened immediately. The pipes underground waited.

      *Count:* 145 words. Good.

      *Scene 2 Draft:*
      2. The Divergence
      Underground, the water moved through insulated concrete trenches. The pressure drop was negligible globally, but locally it shifted the balance across Valve Sector 4. The automated actuators responded to the maintenance of flow, opening slightly wider to compensate for the perceived loss. This extra movement stressed a seal that had been brittle for three years. The seal did not burst, but it wept. A fine mist escaped into the casing. The water temperature in Block C dropped by two degrees over four hours. The thermostats in the apartments did not register the change immediately; the thermal mass of the buildings held the heat. The system rerouted power from the eastern grid to maintain the average output. The dashboard in the control room remained green. The technician returned, sat down, and reviewed the log. He saw the adjustment in Sector 4 and assumed it was routine maintenance cycling. He archived the notification. The water continued to leak, slow and steady, eating at the metal around the gasket. The path had changed. The destination remained fixed.

      *Count:* 159 words. Good.

      *Scene 3 Draft:*
      3. The Cost
      In Apartment 12, Block C, Mrs. Gable woke shivering. The radiator was lukewarm. She wrapped herself in two wool blankets and turned the electric heater on, but the circuit breaker tripped. She called the maintenance line, but it was Sunday. She sat in the living room, breathing shallowly to conserve warmth. By Tuesday, the damp had settled in her chest. The ambulance arrived when her neighbor found her on the floor. She was admitted to intensive care with severe hypothermia and pneumonia. She would not recover her previous mobility. This suffering was specific to the route the water took. Had the pressure held, the seal would not have wept here. Had the system failed globally an hour later, she would have been in the hospital already. But the leak happened now, in her wall, while the rest of the network functioned. Her lungs filled with fluid because of the timing. The outcome of the network was sealed, but her body paid the toll for the specific journey it took to get there.

