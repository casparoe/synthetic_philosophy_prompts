  5.  **Evaluate the Rival Analogy (AI as Butler/Lawyer):**
      *   *The Claim:* Fiduciary duty. Do what the client wants.
      *   *Failure:* Butlers don't have externalities. If my butler helps me poison my neighbor, the state stops him. AI has massive externalities. Also, who is the client? The user? The developer? Society?
      *   *Verdict:* Fails on externalities and power asymmetry. A lawyer is an officer of the court; an AI is currently a black box product.

