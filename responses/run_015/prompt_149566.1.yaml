  9.  **Self-Correction during drafting:** I need to make sure I don't just say "the analogy is broken." I need to say *how* the breakage changes the normative conclusion. The user wants to know if "never take sides" survives. The answer is "No, because the mechanism required to be neutral (public justification) is absent, and the mechanism used to claim neutrality (refusal) is actually non-neutral."

