  The discrepancy you identify between maritime heritage and automotive title law reveals that legal and institutional systems do not adhere to a single, coherent metaphysics of object persistence. Instead, they deploy **pragmatic conventionalism**, selecting different ontological frameworks based on risk, fraud prevention, and functional utility rather than philosophical consistency.

  ### 1. The Implicit Metaphysics
  The current institutional pattern presupposes a **hybrid ontology** that shifts depending on the artifact class:

  *   **Ships (Institutional Baptism + Spatiotemporal Continuity):** Maritime law treats a vessel’s identity as a **Kripkean rigid designator** fixed at launch ("baptism") and sustained by an unbroken causal chain of registration and maintenance. The "Ship of Theseus" paradox is resolved in favor of **functional and administrative continuity**. The matter is accidental; the identity is carried by the paperwork and the continuous existence of the form (the keel line acting as a spatiotemporal anchor). This is a form of **social constructivism**: the ship is the same because the institution says it is, provided the *process* of replacement was continuous.
  *   **Cars (Mereological Essentialism):** Automotive title law treats the chassis/frame (where the VIN resides) as the **essential part** (*essentia*). If the chassis is replaced, the substance of the object is deemed to have ceased, regardless of functional continuity. This is a crude form of **mereological essentialism**, where the identity of the whole is strictly tied to specific constituent parts.

  ### 2. Philosophical Underdetermination
  The practice is **philosophically underdetermined**. It does not strictly need one theory because it is not attempting to solve the metaphysical problem of persistence; it is solving the administrative problem of **tracking**.
  *   **Ships:** Tracking relies on lineage because ships are long-lived, custom-built, and expected to undergo constant material renewal to survive.
  *   **Cars:** Tracking relies on the chassis because cars are mass-produced, high-theft items where the chassis is the hardest component to counterfeit.

  The system fits **Institutionalism** best overall (identity is conferred by authority), but it inconsistently applies **Essentialism** to cars to prevent fraud, while applying **Continuity Theory** to ships to preserve history.

  ### 3. Consistency with Aircraft and Buildings
  The system is **inconsistent** across other domains:
  *   **Aircraft:** Closely aligns with **cars**. The FAA and EASA tie identity to the fuselage/frame serial number. If the fuselage is destroyed or replaced, the aircraft identity is generally lost or requires complex recertification as a new construction. Safety and traceability trump historical continuity.
  *   **Historic Buildings:** Aligns more with **ships**, but with tension. The *Venice Charter* (1964) leans toward mereological essentialism (authenticity lies in original material), discouraging reconstruction. However, the *Nara Document* (1994) and practices like the rebuilding of the Dresden Frauenkirche or Warsaw’s Old Town accept **institutional and design continuity** over material authenticity. Like ships, if the "site" and "design" lineage remain, the building is often treated as the same heritage object despite total material replacement.

  ### 4. Alternative Registry Systems
  If heritage registries were built on strict philosophical grounds, the rules would change drastically:

  *   **Pure Mereological Essentialism:**
      *   **Rule:** Any replacement of an original part alters the identity.
      *   **Impact:** Restoration would be impossible. A ship with a new plank is a new ship. Museums would house only ruins or artifacts in stasis. A car with a new tire would technically require a new title. Heritage would be defined strictly by "original fabric," turning registries into inventories of decay rather than living history.
  *   **Perdurantist Career-Path View (4Dism):**
      *   **Rule:** Objects are spacetime worms; identity is the continuity of the "career" or causal history, not the matter at any specific slice.
      *   **Impact:** The registry would track the **event history** rather than the physical VIN or keel. A car with a swapped chassis would retain its identity if the *transfer of function and ownership* was continuous and documented. A ship that sits in drydock for 50 years and is rebuilt would be the same object. The focus shifts from "What is it made of?" to "What is its history?" This would validate replica reconstructions (like the *USS Constitution* or *HMS Victory*) as the original persisting through time, provided the causal chain of intent is unbroken.

  ### Bottom Line
  The current legal dichotomy is not a reflection of ontological truth but of **regulatory utility**. It sacrifices metaphysical consistency to prioritize fraud prevention in mass markets (cars/planes) while prioritizing historical preservation in niche heritage sectors (ships/buildings).

  \answer{The institutional pattern is philosophically underdetermined and pragmatically inconsistent, employing Institutional Baptism for ships and Mereological Essentialism for cars based on regulatory utility rather than ontological coherence.}
