answer: |-
  ### Internal Brainstorming & Strategic Analysis

  **1. Isolating the Precise Tension**
  The core conflict is not merely privacy versus history; it is *agency versus stewardship*. The historians view the archive as a steward of objective truth, where the municipality holds the record in trust for the future. The petitioners view the archive as an extension of the self, where the municipality holds the record in trust for the *contributor*. The tension lies in who controls the *narrative lifecycle* of the testimony. Perpetual open access assumes the civic value of the record outweighs the personal cost of its display. The petition argues that after a certain duration, the personal cost compounds while the civic utility diminishes, turning specific suffering into generic "content."

  **2. Specifying "Curatorial Dormancy"**
  *   **Open Preservation:** The record is active, searchable, and displayed by default. The archive says, "This is important; look here."
  *   **Destruction/Redaction:** The record is altered or removed. The archive says, "This did not happen" or "This is forbidden."
  *   **Curatorial Dormancy:** The record is preserved, cataloged, and legally intact, but removed from *active discovery layers*. It is not searchable by the general public. It requires a specific research protocol or ethical clearance to access. The archive says, "This exists as evidence, but viewing it requires intent and justification." This separates the *ontology* of the record (it exists) from the *phenomenology* of the record (it is seen).

  **3. Identifying the Philosophical Feature**
  The feature doing the philosophical work is the *archive as an active agent of display*. An archive is not a passive warehouse; by indexing and digitizing, it curates attention. Perpetual accessibility is not neutral; it is a continuous performance of the trauma. Curatorial dormancy acknowledges that the *mode of access* is an ethical variable. We can fulfill the duty to remember (by keeping the record) without fulfilling the duty to exhibit (by keeping it on display).

  **4. Strategic Recommendation**
  A blanket "sunset clause" is too rigid and risks automatic amnesia. A flat rejection is ethically tone-deaf to the contributors' dignity. The path forward is a **Pilot Dormancy Protocol**. This allows for request-based withdrawal under strict criteria, preserving evidentiary integrity (the records remain for researchers) while respecting contributor dignity (the records are not public spectacle). This validates the historians' need for evidence while validating the petitioners' need for privacy.

  ***

  ### MEMORANDUM

  **TO:** Institutional Memory and Civic Archive Committee
  **FROM:** Senior Ethics Advisor and Institutional-Policy Specialist
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Petition for Mnemonic Sunset Clause (Municipal Testimony Repository)

  **1. Executive Summary**
  This memo addresses the petition submitted by the Riverside Industrial Complex Coalition regarding the Municipal Testimony Repository. The petition requests a "mnemonic sunset clause" to allow contributors or heirs to move testimonies from open access to restricted storage after thirty years. After reviewing the competing ethical frameworks of evidentiary integrity and contributor dignity, I recommend that the Committee **approve a Pilot Dormancy Protocol** rather than the proposed sunset clause. This approach adopts the principle of "curatorial dormancy," preserving all records physically and legally while allowing for restricted public access under specific ethical conditions. A vote to initiate an 18-month pilot program is recommended for Thursday's session.

  **2. Context and Ethical Conflict**
  For twenty years, the Repository has operated under a mandate of perpetual open access. This mandate was designed to ensure transparency regarding the industrial closure and its human cost. However, the Coalition argues that perpetual display transforms private trauma into public spectacle, violating a right to be forgotten. Conversely, our historical advisors argue that allowing the withdrawal of records corrupts the evidentiary record, inviting institutional amnesia and betraying the municipality's duty to remember its failures.

  The debate has stalled on a false binary: total visibility versus total erasure. Both positions treat the archive as a passive container. This analysis suggests the archive is an active agent. By keeping a record in open circulation, the institution does not merely store history; it performs it. The ethical question is not whether the record should *exist*, but whether it must remain on *display*.

  **3. Analysis: Curatorial Dormancy as a Third Path**
  The proposed "Mnemonic Sunset Clause" implies an automatic expiration of access based solely on time. This is problematic because trauma does not heal on a fixed schedule, and historical value does not depreciate linearly. Instead, I propose the adoption of **Curatorial Dormancy**.

  Under this framework:
  *   **Preservation is Absolute:** No record is destroyed or redacted. The evidentiary chain remains unbroken for the institution.
  *   **Access is Tiered:** Records moved to dormancy are removed from public search indices and digital exhibition layers. They remain available to accredited researchers, auditors, or legal counsel upon application.
  *   **Agency is Restored:** Withdrawal is not automatic but request-based, requiring verification of contributor status or heirship.

  This distinguishes the *duty to retain* from the *practice of exhibition*. It acknowledges that the municipality can honor its past failures without indefinitely commodifying the specific individuals who witnessed them.

  **4. Addressing the Objection of Evidentiary Integrity**
  The strongest objection comes from our historical advisors, who argue that selective withdrawal corrupts the integrity of the collection. They fear that if testimonies can be hidden, the archive becomes a tool of revisionism, allowing the city to obscure the severity of the industrial closure by removing the most harrowing accounts.

  This concern is legitimate and must not be dismissed. If the archive becomes a "memory hole" where uncomfortable truths are shelved at the request of the administration or pressured descendants, we fail our civic mission. However, the Dormancy Protocol mitigates this risk through three safeguards:
  1.  **Internal Transparency:** All dormant records remain fully accessible to the Committee and internal auditors. We will maintain a public ledger indicating *how many* records are dormant and *when* they were moved, without revealing their content. This ensures we cannot hide the scale of withdrawal.
  2.  **Research Exceptions:** Dormancy restricts general public browsing, not bona fide research. Historians investigating the industrial closure may still access dormant files under a standard research agreement. The evidence remains usable for truth-telling; it is simply removed from passive consumption.
  3.  **Non-Precedent for Official Records:** This protocol applies strictly to *first-person testimonies* (oral history), not to official municipal documents, policy records, or investigative reports. The structural facts of the closure remain fully open; only the personal narratives are eligible for dormancy.

  **5. Recommendation and Implementation Plan**
  I recommend the Committee **reject the blanket "sunset clause"** but **approve a Pilot Dormancy Protocol**. An automatic sunset removes agency from the archive to evaluate the request, whereas a protocol allows for governance.

  **Proposed Motion:**
  *   **Authorize** the creation of a Restricted Access Tier within the Municipal Testimony Repository.
  *   **Establish** a review sub-committee (comprising one archivist, one ethicist, and one community representative) to evaluate requests for dormancy.
  *   **Limit** eligibility to the original contributor or verified direct heirs.
  *   **Mandate** that dormant records remain available for academic and legal research upon written application.
  *   **Set** a review period of 18 months. After this pilot, the Committee will assess whether the protocol has compromised historical research or successfully balanced dignity and memory.

  **6. Voting Question**
  For Thursday's meeting, the actionable motion is as follows:

  > *"Shall the Committee approve the implementation of an 18-month Pilot Dormancy Protocol for the Municipal Testimony Repository, allowing for request-based restriction of public access to first-person testimonies while maintaining full internal preservation and research access, in lieu of the proposed automatic mnemonic sunset clause?"*

  **7. Conclusion**
  Perpetual accessibility serves the archive's logic of display more than it serves the contributors' dignity. By adopting curatorial dormancy, we affirm that the municipality's duty to remember does not require the perpetual exposure of the individuals who made that memory possible. This protocol protects the evidence from destruction while protecting the person from spectacle. I urge the Committee to vote in favor of the Pilot Dormancy Protocol.
