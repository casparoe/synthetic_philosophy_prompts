answer: |-
  You have identified a genuine and pervasive structural feature of political argument, particularly in libertarian and classical liberal defences of property. To answer your first question directly: **No, there is no single, canonical Latin name for this move** comparable to *ad hominem* or *petitio principii*.

  However, it is not nameless in the technical literature. The phenomenon sits at the intersection of three discussions: the **Baseline Problem** in the theory of coercion (Robert Nozick, Alan Wertheimer), the **Legal Realist** critique of property (Hohfeld, Hale), and the specific critique of fiscal philosophy found in Murphy and Nagel's *The Myth of Ownership* (the book you mentioned).

  If you require a label to hold the concept steady, the most precise existing term is **The Normative Baseline Fallacy**, though your coinage, **Baseline Naturalization**, is descriptively superior. It captures the active verb: turning a normative choice into a natural fact.

  Here is the shape of the thing, carved out as requested.

  ### 1. Definition and Boundaries

  **Definition:** Baseline Naturalization is the argumentative practice of selecting a specific, legally contingent distribution of rights and holdings as the neutral reference point for moral evaluation, thereby assigning the burden of justification exclusively to deviations from that point, while exempting the point itself from similar scrutiny.

  **The Structure:**
  1.  **Selection:** A specific legal regime (e.g., current property law, contract enforcement) is selected as the "default."
  2.  **Concealment:** The coercive or distributive choices required to maintain that default are described as "background," "freedom," or "rights."
  3.  **Asymmetry:** Interventions altering the default (tax, regulation) are described as "coercion," "taking," or "interference," requiring positive justification.
  4.  **Result:** The status quo distribution gains a presumptive moral immunity not because it is just, but because it is treated as the zero-point.

  **Boundary Cases (What it is not):**
  *   **It is not Status Quo Bias:** Status quo bias is a psychological preference for stability. Baseline Naturalization is a *normative framing device*. One can be a radical revolutionary (wanting to change the status quo) but still commit this fallacy by assuming the *pre-revolutionary* property rights were natural and the *revolutionary* seizure is theft. Your friend is not conservative; he is using the current legal baseline as a rhetorical shield while proposing changes elsewhere.
  *   **It is not Motte-and-Bailey:** In Motte-and-Bailey, the arguer swaps a defensible claim for an indefensible one. In Baseline Naturalization, the arguer maintains a single claim ("Tax is theft"), but the *truth conditions* of that claim shift depending on which legal rules are treated as fixed. It is a framing error, not a retreat.
  *   **It is not simply "No Pre-Tax Income":** That slogan is the *conclusion* of the counter-argument. Baseline Naturalization is the *mechanism* being critiqued.

  ### 2. Defensibility: Is the Asymmetry Ever Principled?

  You asked if there is a principled reason to place the burden of justification on changes rather than continuities, without presupposing the baseline. There are two defensible grounds, but neither saves your friend's argument.

  **A. Reliance and Expectation (The Pragmatic Defence)**
  People order their lives based on existing rules. If I buy a field expecting the law to protect my title, changing that law retroactively harms my autonomy.
  *   *Verdict:* This justifies *stability*, not *naturalness*. It argues that we should not change rules *lightly*, not that the current rules are pre-political. It places a burden of justification on change, but only a *pragmatic* one (show good cause), not a *moral* one (prove you aren't stealing). Your friend treats the burden as moral ("theft"), which this defence cannot support.

  **B. The Coordination Focal Point (The Game-Theoretic Defence)**
  Society needs *some* baseline to function. We cannot re-litigate the entire structure of property every day. We must treat the current rules as "the game" to allow play to proceed.
  *   *Verdict:* This admits the baseline is arbitrary but necessary. It is a defence of *convention*, not *right*. If your friend admits the baseline is a convention, he cannot call tax "theft," because theft implies violating a pre-existing right, not altering a convention.

  **Conclusion on Defensibility:** The asymmetry is defensible as a **heuristic for stability**, but indefensible as an **ontology of rights**. Your friend is using the heuristic to make an ontological claim. That is the error.

  ### 3. Diagnostic Test

  To detect Baseline Naturalization in the wild, apply the **Counterfactual Legal Regime Test**.

  **The Test:**
  Ask the arguer to describe the situation under a different, coherent set of legal rules.
  *   *Procedure:* "Imagine a legal regime where property titles expire after 50 years unless renewed by community consent, or where the state holds a 50% equity stake in all labour by default."
  *   *Observation:* Does the arguer describe the tax in *that* world as a "taking" from what the individual "would have had"? Or do they acknowledge that in that world, the individual's "pre-tax" income is simply lower by definition?

  **The Verdict:**
  *   **Fallacy Present:** If they insist that even in the counterfactual regime, the individual "really" owns the whole sum and the state is "taking" a share, they are naturalizing the baseline.
  *   **Fallacy Absent:** If they acknowledge that "ownership" is defined by the regime, and the moral question is which regime is *better*, they are reasoning soundly.

  **Where the Test Misfires (False Positives):**
  1.  **Human Rights Claims:** If the argument is about bodily integrity (e.g., forced labour), the baseline is not contingent legal property but physical autonomy. Accusing someone of Baseline Naturalization here is wrong; some baselines (bodily sovereignty) are arguably pre-political.
  2.  **Transitional Justice:** When arguing about restitution for past wrongs (e.g., stolen land), the "status quo" baseline is explicitly rejected. If someone argues for restoring the *pre-theft* baseline, they are not naturalizing the *current* status quo. Ensure you are accusing them of naturalizing the *wrong* baseline.
  3.  **Administrative Feasibility:** Sometimes an arguer privileges the current baseline simply because measuring the "true" moral baseline is impossible. This is a concession to ignorance, not a claim of natural right.

  ### 4. Analysis of Your Third Instance

  > *Instance 3: Tax tracks holdings rather than service/wrong.*

  This is **not** the same move, but it is a **downstream consequence** of it.

  **The Distinction:**
  *   **Baseline Naturalization** concerns *who owns the pot* before the division happens.
  *   **Instance 3** concerns the *method of collection* (proportional vs. fixed).

  **The Connection:**
  Your friend's intuition here relies on the **Residual Claimant Assumption**. He assumes the individual is the residual claimant on their own productivity, and the state is an external vendor.
  *   If the baseline is naturalized (you own 100% of your product), then a 20% tax looks like a *share* of your property.
  *   If the baseline is understood as legal-constructivist (the legal framework enabling that productivity is a joint venture), then a 20% tax looks like a *dividend* to the partner who provided the framework.

  **Why it feels like a separate insight:**
  It appeals to a different intuition: **Quid Pro Quo**. We accept fees because we get a service; we accept fines because we did wrong. Tax feels different because it is unconditional.
  *   *Is this defensible?* Only if the state is viewed as a service provider rather than a sovereign authority.
  *   *Is it the same failure mode?* Yes. It fails for the same reason. It assumes the "holdings" being tracked are fully formed *before* the state's claim arises. If the state's legal framework is a necessary condition for the holdings to exist (as per your Instance 2), then tracking those holdings is not an intrusion on a pre-existing sphere, but a measurement of the sphere the state helped constitute.

  Therefore, Instance 3 is the **phenomenological experience** of Baseline Naturalization. It is what the fallacy *feels like* from the inside. It is not an independent argument; it is the emotional residue of accepting the naturalized baseline.

  ### Summary

  You do not need a reading list to validate your intuition. You have correctly identified that your friend is treating a **legal conclusion** (this money is yours) as a **moral premise** (taking this money is wrong).

  *   **Name:** Baseline Naturalization (or The Normative Baseline Fallacy).
  *   **Core Error:** Asymmetrical burden of proof applied to legal interventions vs. legal constitutions.
  *   **Defensibility:** Defensible as a pragmatic rule for stability; indefensible as a claim about natural rights.
  *   **Test:** The Counterfactual Legal Regime Test.
  *   **Instance 3:** A downstream symptom, not a separate cause.

  Your friend's frustration ("wilfully missing the point") arises because you are arguing about the *architecture* of the house, while he is arguing about the *furniture*. He sees tax as moving furniture; you see tax as moving walls. Until you agree on whether the walls are load-bearing or movable partitions, you will talk past one another. The move you identified is his attempt to convince you the walls are the horizon.
