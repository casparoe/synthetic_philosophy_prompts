      *   **User's Position (Anti-Death Penalty):** Narrowing doesn't fix bias (discretion remains). Retribution satisfied by LWOP. Deterrence evidence is weak/non-isolatable. Irreversibility makes *any* risk of innocence unacceptable (lexical priority).
