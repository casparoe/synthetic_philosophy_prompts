  Elena signs a deed with a Trustee: "Hold my forest; sell only if Offer exceeds $1M." Constraint: no sale; Trigger: written offer; Enforcer: Trustee. Polisia ratifies a Charter: "Hold our borders; open only if Danger subsides." Constraint: no opening; Trigger: subsided danger; Enforcer: Court. Both prevent panic-driven reversal during stress, authored by the bound party on identical risk data, enforced faithfully per text. Elena exists independently of the deed; Polisia exists only as the Charter's order. The Trustee verifies arithmetic; the Court evaluates security policy.

  **Analysis**
  Design Fidelity validates both halves: both are self-authored, target evidenced panic, and are faithfully enforced. The Ulysses Condition validates Elena but rejects Polisia: the Trustee checks a figure without judging value, while the Court must assess "Danger," exercising the substantive judgment the constraint aims to remove. Constitutive Authority rejects Elena but validates Polisia: Elena's will exists prior to the deed, so constraining it is externally imposed; Polisia's agency is created by the Charter, so the constraint is internally constitutive.

  **The Structural Feature**
  The single feature making (2) and (3) diverge is **the correlation between trigger objectivity and agent ontology**. In this case, objective triggers pair with independent agents, and substantive triggers pair with constituted agents. If this correlation is broken—for instance, if Polisia's trigger were objective ("open only if 2/3 vote")—Account 2 would validate the constitutional half (no substantive judgment required). Account 3 would still validate it (constituted agent). The verdicts would align (Both Valid). Conversely, if Elena's trigger were substantive ("sell only if Necessary"), Account 2 would reject her (substantive judgment), and Account 3 would reject her (independent agent). The verdicts would align (Both Invalid). The divergence arises because the case pairs the feature Account 2 requires (objectivity) with the feature Account 3 rejects (independence), and vice versa.

  **The Attack**
  A defender of the analogy argues the scenario is rigged: constitutional entrenchment often uses objective triggers (e.g., supermajority votes), not vague standards like "Danger." If Polisia's trigger were "open only if 2/3 legislate," the Ulysses Condition would validate it, just like Elena's lock. The case falsely assumes constitutional enforcement always requires substantive judgment. This lands partially. While some clauses are arithmetic, determining whether a supermajority *applies* to a specific bill often requires substantive constitutional interpretation, unlike a bank checking a number. The political enforcer cannot be purely mechanical.

  **Commitment**
  The analogy does not survive. The reason that moves me is the **enforcement condition** (Account 2). Individual precommitment can be mechanical (a lock, a timer), isolating the will from the impulse. Constitutional precommitment cannot be mechanical because the "enforcer" (court or legislature) is part of the same political system it constrains and must interpret the constraint's application. Politics lacks a neutral Trustee. Therefore, constitutional entrenchment is always an act of ongoing governance, not a true precommitment device. The Ulysses analogy fails because there is no mast to tie oneself to in a ship where everyone is both sailor and rope.
