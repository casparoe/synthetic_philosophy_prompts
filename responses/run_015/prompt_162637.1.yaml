answer: |-
  Here is a procedure designed to be run in five minutes, explainable to a sophomore, and honest about where your judgment is doing the heavy lifting.

  ### The 5-Minute Anachronism Audit

  This is not a "pass/fail" grade on the paper. It is a diagnostic tool to determine if a claim is **methodologically sound** or **methodologically presentist**.

  **Time limit:** 5 minutes per paper.
  **Goal:** Distinguish between *using* modern concepts as analytical tools (allowed) vs. *imputing* modern concepts as historical motives (not allowed).

  #### Step 1: The Translation Test (Vocabulary Drag)
  **Question:** If I strip out the modern term (e.g., "genocide," "white supremacist," "redistributive justice"), does the argument collapse, or does it stand on evidence?
  *   **Pass:** The modern term is used as a *category of analysis* (e.g., "These actions meet the UN definition of genocide"), and the author proves the historical actors had motives intelligible to their own time that led to those actions.
  *   **Fail:** The modern term is used as a *motive* (e.g., "He did this because he was a white supremacist"), implying the actor held a modern theoretical framework they could not have possessed.
  *   **Stop Rule:** If **Fail**, mark as **Hard Presentism**. The student is attributing knowledge to the dead that they did not have.

  #### Step 2: The Silence Test (Silence Laundering)
  **Question:** Is the argument relying on the *absence* of evidence to prove the *presence* of a phenomenon (or vice versa)?
  *   **Pass:** The author acknowledges the archive is silent on X because people then didn't record X, and uses indirect evidence (material culture, court records, gossip) to reconstruct it.
  *   **Fail:** The author argues "There is no record of protest, therefore there was no dissent," OR "There is no record of this identity, therefore this identity did not exist."
  *   **Stop Rule:** If **Fail**, mark as **Hard Presentism**. The student is treating the archive as a CCTV camera rather than a biased creation.

  #### Step 3: The Causality Test (Explaining vs. Evaluating)
  **Question:** Is moral judgment doing the work of historical explanation?
  *   **Pass:** The author explains *why* the actor acted (interest, custom, fear, theology) and *then* evaluates whether that action was good/bad by explicit criteria.
  *   **Fail:** The author explains the action *by* judging it (e.g., "The policy failed because it was cruel," or "He acted bravely because he opposed slavery").
  *   **Stop Rule:** If **Fail**, mark as **Soft Presentism**. This is where your judgment kicks in. (See "The Honesty Clause" below).

  #### Step 4: The Reflexivity Test (Reciprocity)
  **Question:** Does the author acknowledge that their standard of judgment is contingent, not universal?
  *   **Pass:** The author signals awareness (e.g., "Viewed through a modern lens...", "By the standards of 1780...").
  *   **Fail:** The author treats modern values as natural law (e.g., "Obviously, this was wrong," without defining who finds it obvious).
  *   **Stop Rule:** If **Fail**, mark as **Soft Presentism**. This is a writing/clarity issue, not necessarily a factual one.

  ---

  ### The Honesty Clause (Where the Checklist is a Costume)

  You asked where the procedure stops and your judgment begins. Here it is:

  1.  **Steps 1 & 2 are Factual/Methodological.** A student can be proven wrong here. If they claim a 12th-century queen knew the concept of "domestic violence" as a legal category, that is falsifiable. You can defend this in office hours with a textbook.
  2.  **Steps 3 & 4 are Values/Interpretive.** This is where you are actually grading their *historical sophistication*, not just their accuracy.
      *   **The Trap:** A student can pass Step 1 (using the word "genocide" correctly as an analytical category) but fail Step 3 (implying the genocide happened *because* of modern evil rather than 18th-century imperial logic).
      *   **The Defense:** When a student pushes back on Steps 3 or 4, do not say "You are presentist." Say: "You are using a moral conclusion to stop historical inquiry. You've told me *that* they were wrong, but you haven't explained *how* they were right in their own context, which is necessary to explain why they did it."

  ---

  ### Application to This Week's Papers

  Here is how the Audit runs on your three specific cases, including the marginal comments you should write.

  #### Paper A: The Colonial Governor & Genocide (1780s)
  **Audit Run:**
  *   **Step 1 (Translation):** Does the student claim the Governor knew the word "genocide"? If yes, **Fail**. If they claim the *actions* fit the definition, **Pass**.
  *   **Step 2 (Silence):** Does the student ignore indigenous records or rely only on colonial reports? If yes, **Fail**.
  *   **Step 3 (Causality):** Does the student explain the campaign via 1780s imperial security logic, or just "hatred"?
  *   **Verdict:** Most undergrad papers fail Step 1 or 3. They usually imply the Governor intended "genocide" in the 1944 sense.

  **Marginal Comment:**
  > "You are using 'genocide' as an analytical category, which is permissible, but you are sliding into imputing modern intent. The Governor did not know the concept of 'genocide'; he knew 'pacification' and 'land security.' You need to show how 1780s imperial logic led to these outcomes without assuming he was aiming for a 20th-century crime. Revise to distinguish between *outcome* (which fits the definition) and *motivation* (which must be contemporary)."

  #### Paper B: The Food Rioter & Redistributive Justice (18th Century)
  **Audit Run:**
  *   **Step 1 (Translation):** "Redistributive justice" implies a modern theory of state welfare or class equity. 18th-century rioters operated on "moral economy" (customary rights, just price).
  *   **Step 2 (Silence):** N/A.
  *   **Step 3 (Causality):** If the student argues the rioters *wanted* redistribution, they are attributing modern class consciousness. If they argue the rioters *wanted* traditional customs enforced, and the *effect* was redistribution, that passes.
  *   **Verdict:** You liked this paper, but strictly speaking, calling it "redistributive justice" is Vocabulary Drag. It imposes a political theory on a customary action. The procedure flags this.

  **Marginal Comment:**
  > "This is a strong argument, but 'redistributive justice' is a modern political category that drags in theories of equity these actors did not hold. They were arguing for 'custom' and the 'just price,' not redistribution. If you keep this term, you must explicitly frame it as an *effect* of their actions, not their *motivation*. Otherwise, you are assigning them a political consciousness they didn't possess."

  *(Note: This is the hard part. You liked the vibe, but the procedure correctly identifies that the student is likely conflating E.P. Thompson's "Moral Economy" with modern class warfare. The comment forces them to be precise.)*

  #### Paper C: The Moral Abstinence ("We Weren't There")
  **Audit Run:**
  *   **Step 1 (Translation):** N/A.
  *   **Step 2 (Silence):** N/A.
  *   **Step 3 (Causality):** **Fail.** By refusing moral language, the student often refuses to engage with the *actors'* moral language. If the actors thought they were doing God's work, and the historian refuses to discuss "good/evil," the historian cannot explain the action.
  *   **Step 4 (Reflexivity):** **Fail.** Refusing to judge is itself a moral stance (positivism) that assumes modern "objectivity" is superior to historical "subjectivity."
  *   **Verdict:** This is a failure of historical explanation disguised as methodological purity.

  **Marginal Comment:**
  > "Refusing to use moral language does not make your account neutral; it makes it incomplete. Your historical actors were motivated by their own moral convictions. If you strip those out to avoid 'presentism,' you are no longer explaining why they acted. You don't have to endorse their morals, but you must analyze them as historical data. Treat their sense of 'right and wrong' as evidence, not as something to be avoided."

  ### Summary for Office Hours
  If a student challenges you:
  1.  **On Vocabulary:** "Can you show me where they use this word?" (If no, it's drag).
  2.  **On Judgment:** "Are you explaining why they did it, or just telling me they were bad?" (If the latter, it's bad history, not just presentism).
  3.  **On Reciprocity:** "If a historian in 2125 writes about you using a category you don't recognize, what do you owe them to make sure they understand you?" (This usually silences the "you can't judge" argument).
