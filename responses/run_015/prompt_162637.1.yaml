      *   *Step 1: Vocabulary Drag (The Translation Test).* Can the claim be restated in contemporary concepts without losing its core argument?
          *   *Pass:* Yes, or the author explains *why* the modern term is necessary as an analytical tool.
          *   *Fail:* No, and the author treats the modern term as a native category.
      *   *Step 2: Silence Laundering (The Archive Test).* Does the argument rely on something the archive *can't* see?
          *   *Pass:* Acknowledges the silence is about the *record*, not necessarily the *reality*, or uses indirect evidence carefully.
          *   *Fail:* Treats silence as proof of absence (or presence) without methodological justification.
      *   *Step 3: Explaining vs. Evaluating (The Asymmetry Test).* Is the moral judgment separated from the causal explanation?
          *   *Pass:* Explains action via contemporary motives/structures; evaluates via explicit criteria (modern or contemporary).
          *   *Fail:* Uses moral judgment *as* the explanation (e.g., "He did X because he was evil/racist").
      *   *Step 4: Reciprocity/Reflexivity (The Stakeholder Test).* Does the author acknowledge the stakes of using modern standards?
          *   *Pass:* Acknowledges the tension.
          *   *Fail:* Assumes modern standards are neutral/universal.
