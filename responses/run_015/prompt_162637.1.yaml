  2.  **Deconstruct "Presentism" for the Procedure:**
      *   Presentism isn't just using modern words; it's imposing modern *causal logic* or *moral frameworks* without accounting for the difference.
      *   It's not about banning judgment; it's about *grounding* judgment.
      *   The procedure needs to be a filter. If a paper passes the filter, it's methodologically sound (even if controversial). If it fails, it's presentist.

  3.  **Drafting the Procedure (The "Presentism Stress Test"):**
      *   *Constraint:* Must be fast (5 mins).
