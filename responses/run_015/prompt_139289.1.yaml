      *   **Problem:** Colleagues are relying on the Doctrine of Double Effect (DDE) without realizing its ambiguity. The user suspects DDE won't do the work without prior settling.
      *   **User's Insight:** They have a heuristic distinction: "harms the agent routes around" vs. "harms the agent routes through." (If the bad effect is causally necessary for the good effect, it's "routing through"). They note this handles the Loop Case well but might overreach in the "swerving into a runaway lane" case (where hitting a cyclist sheds speed to save passengers).
      *   **Task:** Provide a *defended ordering* (agenda) of open questions about DDE that matter for *this specific project*.
      *   **Constraints:**
          *   Not a survey.
          *   Explain *why* the order is chosen (trade-offs: dependency, feasibility for 2 generalists, impact on spec, neglectedness).
          *   Identify what discovery in Month 2 would reshuffle the agenda.
