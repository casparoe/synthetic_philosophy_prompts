          *   State confidence levels and the point of least certainty.

  2.  **Deconstruct the Core Ethical/Technical Challenge:**
      *   **The System:** Autonomous shuttle. No *mens rea*, no psychological intentions. DDE traditionally relies on agent intention.
      *   **The Output:** A technical spec (30-40 pages). Needs actionable rules, not philosophical treatises.
      *   **The Timeline:** 5 months, 2 people. Very tight for deep philosophy + engineering spec.
      *   **The User's Heuristic:** "Routing Through" (causal necessity of harm) vs. "Routing Around" (harm is side effect). This is essentially the "means vs. side effect" distinction, but operationalized causally.

  3.  **Evaluate the Doctrine of Double Effect (DDE) for AI:**
      *   *Standard DDE:* 1. Act is good/neutral. 2. Intend good, not bad. 3. Bad not means to good. 4. Proportionality.
      *   *AI Problem:* AI doesn't "intend." It optimizes cost functions. "Intention" must be mapped to "objective function weighting" or "decision tree branching."
      *   *User's Heuristic:* "Routing Through" maps to Condition 3 (Bad not means to good). This is the hardest part of DDE to formalize.
      *   *Verdict:* DDE is risky but might be the only shared language the team/stakeholders have. However, the "Intention" clause needs to be translated into "Optimization Constraint."

  4.  **Develop the Agenda (Ordering & Justification):**
      *   *Goal:* Maximize spec impact per hour spent. Minimize philosophical rabbit holes.
      *   *Priority 1: Translation.* Can we even use DDE? If "intention" is incoherent for code, stop.
      *   *Priority 2: Causality (The User's Heuristic).* This is the core technical constraint. "Routing Through" = Hard Constraint? "Routing Around" = Cost Function?
      *   *Priority 3: Proportionality.* How many deaths equal how many injuries? This is political/legal, not just philosophical.
      *   *Priority 4: Epistemic Uncertainty.* The planner doesn't *know* who dies. It deals in probabilities. DDE assumes knowledge.

      *   *Refining the Order:*
          1.  **Operationalizing Intention (Month 1):** If we can't map "intend" to code, DDE is dead. This is the kill switch.
          2.  **Causal Necessity / "Routing Through" (Month 2):** This is the user's specific insight. It determines *which* trajectories are permissible *before* weighing costs. This filters the solution space.
          3.  **Proportionality & Risk (Month 3-4):** Once we know what's permissible, how do we choose between permissible options?
          4.  **Documentation & Liability (Month 5):** How do we write this so lawyers don't panic?

      *   *Wait, critique the order:* Actually, for a *spec*, the "Routing Through" distinction (Causal Necessity) is the most actionable technical constraint. "Intention" is semantic mapping. Let's swap.
      *   *Revised Order:*
          1.  **Causal Necessity (The "Routing" Test):** Define the hard constraints. (Directly addresses user's heuristic).
          2.  **Operationalizing Intention:** Map the constraints to the planner's objective function.
          3.  **Proportionality:** The weighting of lives/risks.
          4.  **Uncertainty:** Probabilistic application.

      *   *Actually, the "Intention" problem is more fundamental.* If the stakeholders insist DDE requires *psychological* intent, the project fails. But since it's an internal spec, we can define "intent" functionally. Let's make the "Functional Translation" the first gate.
      *   *Better Approach:* Start with the User's Heuristic. It's their leverage point. If "Routing Through" is the dealbreaker, define that first.
      *   *Let's look at the constraints again:* 2 generalists, 5 months. They need to produce a *spec*.
      *   *Critical Path:*
          1.  **Is DDE the right framework?** (Go/No-Go).
          2.  **Defining the "Means" constraint (Routing Through).** (The core logic).
          3.  **Defining Proportionality.** (The tuning).
          4.  **Handling Uncertainty.** (The reality check).

  5.  **Addressing the "Routing Through" Heuristic:**
      *   The user worries it overreaches (cyclist in runaway lane).
      *   *Analysis:* In the runaway lane case, the collision isn't the *mechanism* of safety; the *lane* is the mechanism. The collision is a side effect of entering the lane, even if it incidentally reduces speed. The distinction is: Is the harm *part of the plan* or just *inevitable given the plan*?
      *   *Refinement:* Distinguish between "Harm as Mechanism" vs. "Harm as Friction."
      *   *Agenda Item:* This needs to be resolved in Month 2.

  6.  **Drafting the Response:**
      *   **Tone:** Professional, direct, philosophical but engineering-focused.
      *   **Structure:**
          1.  Executive Summary (DDE viability).
          2.  The Agenda (4 Phases).
          3.  Justification for Ordering (Dependencies, Risk, Spec Impact).
          4.  The Month 2 Pivot Point.
          5.  Confidence & Uncertainty.

      *   **Critique of DDE:** Must address that AI lacks *mens rea*. We need "Functional DDE."
      *   **Ordering Logic:**
          1.  *Translation:* Can we map it? (If no, stop).
          2.  *Causal Structure:* The "Routing" test. (If yes, what counts as means?).
          3.  *Proportionality:* Weighing the outcomes.
          4.  *Uncertainty:* Probabilities.
      *   **Why this order?** You can't weigh outcomes (3) if you haven't ruled out impermissible acts (2). You can't rule out acts (2) if you haven't defined the agent's goal (1). Uncertainty (4) complicates everything, so do it last.

      *   **Month 2 Pivot:** If the "Routing Through" test rules out *too many* viable safety maneuvers (like the cyclist case), we need to downgrade it from a Hard Constraint to a High-Cost Penalty. This changes the spec from logic gates to loss functions.

      *   **Confidence:** High on the structural critique, lower on the specific resolution of the "Routing" edge cases (cyclist).

  7.  **Refining the "Routing Through" Critique:**
      *   The user's heuristic: "If bad effect has to happen before good one... routing through."
      *   Cyclist case: Hitting cyclist -> sheds speed -> stop survivable.
      *   Is hitting the cyclist *necessary*? Or is entering the lane necessary, and hitting the cyclist is just high probability?
      *   *Key Distinction:* Counterfactual dependence. If the cyclist magically vanished, would the shuttle still stop safely?
          *   Loop Case: If man vanishes, trolley hits 5. (Harm is necessary).
          *   Cyclist Case: If cyclist vanishes, does the lane still stop the shuttle? If yes, then harm is *not* necessary. It's just a foreseen side effect.
      *   *Advice:* Tell the user to use Counterfactual Dependence, not temporal order. This saves the cyclist case.

  8.  **Final Polish:** Check against all prompt requirements.
      *   Defended ordering? Yes.
