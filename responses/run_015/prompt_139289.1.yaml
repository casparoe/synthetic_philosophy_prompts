      2.  **Causal Necessity (The Routing Test):** Hard constraints vs. costs.
      3.  **Proportionality:** The exchange rates.
      4.  **Epistemic Thresholds:** Probability cutoffs.

      *Wait, one more thing:* The prompt asks "which open questions about DDE actually matter."
      Okay, I need to frame the agenda items as *questions*.
      1.  Can "intention" be reduced to "optimization target"?
      2.  Does "means" mean "causally necessary" or "instrumentally used"?
      3.  What is the proportionality ratio?
      4.  How do we handle risk vs. certainty?

      Let's integrate the "Routing" heuristic into Question 2.

      *Confidence:* I am confident DDE is a poor fit but might be the only political cover available. I am less confident about the "Routing" heuristic's robustness in edge cases.

