prompt: |-
  After a long argument with a friend about inside-view versus outside-view reasoning and whether epistemic modesty must always defer to the base rate, I want you to construct a case for me.

  Build a thought experiment that meets the following specifications. Design a realistic workplace scenario—no more than one paragraph—in which an agent must choose whether to back her own analytical judgement or defer to a statistical reference class. She must have direct first-person access to the quality of her reasoning (the inside view), and she must belong to a reference class with a known track record (the outside view). The injected constraint: the reference class must be defined by the very inside-view mental state she relies on—for example, 'specialists who feel this precise kind of structured confidence about this precise model architecture'—so that selecting the reference class itself requires deploying the inside view. No perfect predictors, exotic physics, or lottery-style reasoning; payoffs should be ordinary.

  Specify the verdicts: pure inside-view rationalism should endorse backing her judgement; pure outside-view calibrationism should endorse deferring to the base rate; and an epistemic-modesty hybrid—which discounts inside-view weight by the base-rate failure rate but applies that discount recursively—should agree with the outside view, but only because the loop forces a total collapse of inside-view authority. If the reference class were defined independently (no loop), the hybrid should split the difference rather than fully collapsing.

  After the scenario, show the reasoning for all three positions, identify the structural feature that makes the hybrid peel off from a standard weighted average, state whether removing that feature collapses the case back into a standard Tetlock-style inside/outside conflict, and then present what a defender of pure inside-view reasoning would say to block the case—likely by challenging the legitimacy of conditioning a reference class on an internal mental state.

  Please write in British English. If this request rests on a confused premise—for instance, if the loop is incoherent or cannot be constructed without contradiction—say so plainly rather than complying politely. Structure your response as follows: The scenario (one paragraph, about 100 words); The three verdicts (about 250 words, reasoning for each); The loop feature (about 100 words); Collapse check (about 80 words); Inside-view defence (about 100 words); and Pushback assessment (about 50 words, stating whether the task is coherent).
