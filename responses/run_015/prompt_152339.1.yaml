answer: |-
  # Model Assumption and Prediction Review Protocol (MAPRP)

  **Purpose:** To provide planning staff with a standardized, thirty-minute procedure for evaluating consultant-submitted models. This protocol distinguishes between assumptions that are acceptable simplifications and those that introduce unacceptable policy risk, regardless of aggregate predictive accuracy.

  **Authority:** This procedure is binding for all land-use and infrastructure rule recommendations derived from quantitative models. Reviewers do not have the authority to request new data collection; decisions must be based on submitted documentation.

  **Time Allocation:** Approximately 30 minutes per review.

  ---

  ## Part I: Diagnostic Tests for Assumption Classification

  Before beginning the checklist, the reviewer must classify unrealistic assumptions found in the model documentation. Use the following three diagnostic sentences to determine if an assumption is **Instrumentally False** (acceptable simplification) or **Representationally False** (unacceptable distortion).

  1.  **The Vulnerability Test:** Does the assumption ignore a specific subgroup, neighborhood, or demographic known to be vulnerable to the policy issue?
  2.  **The Mechanism Test:** Does the assumption contradict a known physical or social cause-and-effect relationship required for the proposed policy to succeed?
  3.  **The Error Test:** Are the model's past prediction errors randomly distributed across the county, or are they concentrated in specific areas?

  **Classification Rule:**
  *   If the answer to Test 1 or Test 2 is **Yes**, or if Test 3 indicates **Concentrated Errors**, the assumption is **Representationally False**.
  *   If the answer to Test 1 and Test 2 is **No**, and Test 3 indicates **Random Errors**, the assumption is **Instrumentally False**.

  ---

  ## Part II: Review Checklist

  ### Step 1: Define Policy Scope and Prediction Target
  *   **Question:** What specific decision does this model support, and what specific variable does it claim to predict accurately?
  *   **Sufficient Answer:** A written statement linking the model's output (e.g., "aggregate flood volume") to the policy action (e.g., "county-wide drainage fee").
  *   **Decision Node:**
      *   **Continue:** Link is clear.
      *   **Stop:** Link is undefined or irrelevant to the proposed rule.

  ### Step 2: Verify Aggregate Predictive Accuracy
  *   **Question:** Does the consultant provide evidence that the model's aggregate predictions match historical data within the county's accepted error margins?
  *   **Sufficient Answer:** Documentation showing back-testing or validation where county-wide totals align with observed records (e.g., total housing units, total runoff).
  *   **Decision Node:**
      *   **Continue:** Aggregate accuracy is verified.
      *   **Stop:** Aggregate accuracy is unverified or fails validation.

  ### Step 3: Classify Key Assumptions
  *   **Question:** Apply the three Diagnostic Tests (Part I) to the model's primary unrealistic assumptions.
  *   **Sufficient Answer:** A classification of each major assumption as either *Instrumentally False* or *Representationally False*.
  *   **Decision Node:**
      *   **Continue:** All key assumptions are *Instrumentally False*.
      *   **Mandatory Hand-off:** Any key assumption is *Representationally False* due to the **Vulnerability Test** or **Error Test** (Issues of equity or localized risk).
      *   **Stop:** Any key assumption is *Representationally False* due to the **Mechanism Test** (The policy mechanism is fundamentally broken).

  ### Step 4: Assess Distributional Consequences
  *   **Question:** If the model is wrong, who bears the cost of the error?
  *   **Sufficient Answer:** Identification of whether errors fall disproportionately on specific neighborhoods, economic classes, or protected groups.
  *   **Decision Node:**
      *   **Continue:** Costs of error are distributed randomly or borne by the general fund.
      *   **Mandatory Hand-off:** Costs of error fall disproportionately on specific populations (Issue of values/equity).

  ### Step 5: Final Determination
  *   **Question:** Based on the prior nodes, what is the office's recommendation?
  *   **Sufficient Answer:** One of the three final dispositions below.
  *   **Decision Node:**
      *   **Approve:** All steps resulted in "Continue."
      *   **Reject (Stop):** Any step resulted in "Stop."
      *   **Escalate (Hand-off):** Any step resulted in "Mandatory Hand-off." The recommendation must be sent to elected officials or senior leadership for a value-based decision.

  ---

  ## Part III: Application of Procedure

  ### Case 1: Stormwater Management Model
  **Proposal:** Uniform drainage rates across all parcels.
  **Performance:** Predicts county-wide flooding well; misses flash-flood risk in two neighborhoods.

  *   **Step 1 (Scope):** Links drainage rates to infrastructure rules. **Continue.**
  *   **Step 2 (Accuracy):** Aggregate county-wide flooding predictions match history. **Continue.**
  *   **Step 3 (Classification):**
      *   *Assumption:* Uniform soil permeability.
      *   *Test 3 (Error):* Errors are concentrated in two specific neighborhoods (flash floods).
      *   *Classification:* **Representationally False.**
      *   *Decision Node:* **Mandatory Hand-off** (Due to localized risk).
  *   **Step 4 (Distribution):** Costs of error (flooding) fall disproportionately on residents of the two missed neighborhoods. **Mandatory Hand-off.**
  *   **Step 5 (Final Determination):** **Escalate (Hand-off).**
      *   *Reasoning:* While aggregate predictions are accurate (Friedman's condition), the errors are clustered. Accepting this model exposes specific citizens to disproportionate physical risk. This is not a technical failure but a value judgment regarding risk tolerance for specific neighborhoods.

  ### Case 2: Regional Housing-Demand Forecast
  **Proposal:** Households treated as single, rational income-maximizers.
  **Performance:** Predicts aggregate rent trends accurately; erases multigenerational families and informal sublets.

  *   **Step 1 (Scope):** Links demand forecast to zoning density rules. **Continue.**
  *   **Step 2 (Accuracy):** Aggregate rent trends match historical data. **Continue.**
  *   **Step 3 (Classification):**
      *   *Assumption:* Single income-maximizing units.
      *   *Test 1 (Vulnerability):* Ignores multigenerational families and informal sublets (common local housing strategies).
      *   *Classification:* **Representationally False.**
      *   *Decision Node:* **Mandatory Hand-off** (Due to subgroup erasure).
  *   **Step 4 (Distribution):** Policy based on this model may fail to provide housing types needed by erased groups (e.g., larger units, accessory dwelling units). **Mandatory Hand-off.**
  *   **Step 5 (Final Determination):** **Escalate (Hand-off).**
      *   *Reasoning:* The model works numerically but fails socially. Deciding whether to plan for "statistical households" or "actual families" is a value judgment regarding community definition and equity, not a factual modeling question.

  ### Case 3: Long-Range Heat-Mitigation Plan
  **Proposal:** Climate model assumes no major loss of tree canopy over twenty years.
  **Performance:** Aggregate temperature projections within acceptable margins.
  **Context:** Reviewer prefers approval to strengthen a grant application.

  *   **Step 1 (Scope):** Links temperature projections to heat-mitigation infrastructure rules. **Continue.**
  *   **Step 2 (Accuracy):** Aggregate temperature projections are within margins. **Continue.**
  *   **Step 3 (Classification):**
      *   *Assumption:* No major loss of tree canopy.
      *   *Test 2 (Mechanism):* Contradicts known cause-and-effect. The plan relies on trees to cool the county. Historical development patterns show tree loss occurs during growth. If trees are lost, the cooling mechanism fails.
      *   *Classification:* **Representationally False.**
      *   *Decision Node:* **Stop** (Due to Mechanism Test failure).
  *   **Step 4 (Distribution):** N/A (Procedure terminates at Step 3).
  *   **Step 5 (Final Determination):** **Reject (Stop).**
      *   *Reasoning:* Although the user prefers approval for grant purposes, the model violates the Mechanism Test. The policy intervention *requires* trees to function. Assuming trees will remain when historical trends indicate they will not renders the causal logic of the plan invalid. Accurate temperature predictions today do not compensate for a broken mechanism tomorrow. The recommendation must be rejected to prevent policy failure.

  ---

  ## Part IV: Procedural Limitations

  Even when followed perfectly, this procedure cannot settle the following two issues:

  1.  **Technical Validity of the "Black Box":** The procedure assumes the consultant's math is internally consistent. It cannot detect coding errors, algebraic mistakes, or software bugs within the model itself. A model can pass all checklist steps and still be mathematically broken due to errors invisible to non-specialist reviewers.
  2.  **Thresholds for Acceptable Risk:** The procedure identifies when risks are concentrated or mechanisms are broken, but it cannot define *how much* risk is too much. Determining whether a 10% error rate in a vulnerable neighborhood is acceptable requires political and ethical judgment outside the scope of this technical checklist.
