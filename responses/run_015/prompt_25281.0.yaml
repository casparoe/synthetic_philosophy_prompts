  2.  **Deconstruct the "Dirty Hands" Problem:**
      *   Originates roughly with Machiavelli, refined by Weber ("Politics as a Vocation"), and explicitly named by Walzer ("Political Action: The Problem of Dirty Hands").
      *   Core idea: To govern effectively, one must sometimes do what is morally forbidden (murder, lie, betray).
      *   The "right" politician does this but feels the guilt. If they don't feel guilt, they are a monster. If they refuse to do it, they are ineffective/irresponsible.
      *   Key distinction: Justified violation vs. unjustified crime.

  3.  **Analyze *Macbeth* in this context:**
      *   *Initial Act:* Killing Duncan. Is it for the common good? No, it's explicitly ambition ("vaulting ambition"). This suggests *Macbeth* is a counter-example or a warning against false rationalizations.
      *   *Subsequent Acts:* Killing Banquo, Macduff's family. These are to secure power, not necessarily for the state's welfare (though Macbeth might argue stability). This looks more like the slippery slope of tyranny.
      *   *Guilt:* Both Macbeth and Lady Macbeth suffer immensely. Macbeth becomes numb ("supped full with horrors"), Lady Macbeth breaks down.
      *   *Lady Macbeth:* She urges the act. She says "a little water clears us of this deed." Later, "Out, damned spot." She isn't the ruler, but she is the co-conspirator. This complicates the "political office" requirement of dirty hands theory.
      *   *Resolution:* Macbeth is killed, order restored. This suggests his hands were *too* dirty, not appropriately dirty.

  4.  **Synthesize the Argument:**
      *   *Thesis:* *Macbeth* serves less as a confirmation of the dirty hands paradox and more as a tragic critique of the rationalizations that enable it. It illuminates the psychological cost but ultimately collapses the distinction between the "necessary" dirty hand and the tyrant's bloody hand because the initial act lacks public justification.
      *   *Nuance:* However, the play doesn't simply say "never kill." It shows the *experience* of guilt. The psychological realism aligns with Walzer's idea that guilt is necessary, but the moral justification is absent.
      *   *Lady Macbeth:* Her involvement suggests that dirty hands isn't just about office-holding but about complicity in power structures. Her inability to wash clean underscores the permanence of moral violation, challenging the idea that guilt alone redeems the act.
      *   *Conclusion:* The play suggests that without a genuine commitment to the common good (which Macbeth lacks), the "dirty hands" defense is merely a pretext for ambition. It warns that the psychological corrosion makes the "necessary" act indistinguishable from the criminal one over time.

