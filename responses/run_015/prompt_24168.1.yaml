      *   *Wait,* Dev's point about the codebook being physical (tRNAs) vs. abstract. Maya argued the tRNAs *are* the codebook. This is a "physical symbol system" argument. Dev says no, that's just chemistry. This is the crux.
      *   *Decision:* The consensus in philosophy of biology (e.g., Godfrey-Smith, Sterelny) is that genetic information is real but distinct from human semantic information. Maya is closer to this consensus, Dev is closer to hard physicalism which often gets accused of being too eliminativist for biology.

  8.  **Final Polish:** Ensure the tone is helpful for a student (clear, structured, encouraging). (Proceed to generate output).

