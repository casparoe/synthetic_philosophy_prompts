      *   *Okay, let's merge Round 1 & 2 to allow for GxE.*
      *   *Revised Plan:*
          *   **Round 1 (The Trap):** Two Zones (North/South). North gets +10 Soil. South gets 0 Soil. Envelopes randomized. High $h^2$ within zones. Large Gap between zones. Students bet the gap is genetic.
