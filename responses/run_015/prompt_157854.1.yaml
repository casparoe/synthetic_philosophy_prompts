  ## Troubleshooting: What Will Go Wrong

  **1. The Arithmetic Stall**
  *   **Problem:** Students struggle to calculate the Spread or Mean quickly.
  *   **Fix:** Do not let them calculate individually. Make it a **Choral Calculation**. You write the 18 numbers on the board. You ask "What is the Max?" Class shouts. You write it. "What is the Min?" Class shouts. You write it. You do the subtraction. Keep the pace military-fast.

  **2. The "Spoiler" Student**
  *   **Problem:** A student with prior knowledge shouts "It's Heritability!" in Round 1.
  *   **Fix:** Acknowledge and pivot. "Correct, that is the technical term. But for the game, it is the 'Sealed-Card Share'. If you use the H-word before the debrief, your team loses 5 points. We are testing the intuition, not the vocabulary."

  **3. The "Molecular" Misconception**
  *   **Problem:** A student treats the Envelope as a specific DNA sequence that *causes* the height directly.
  *   **Fix:** In Round 2, when the (S) cards fail in the Shade, point to the card. "The card didn't change. The *effect* of the card changed. The envelope is not a blueprint; it is a reaction norm."

  **4. The Refusal to Wager**
  *   **Problem:** A table says "We don't know, we won't bet."
  *   **Fix:** "Participation is mandatory. A blank card counts as an incorrect wager. You must commit to a model to learn why it fails."

  **5. Human Group Differences Mid-Session**
  *   **Problem:** A student asks, "So does this mean IQ differences between races are environmental?"
  *   **Fix:** **Stop the room.** "That is exactly the question this activity is designed to complicate. Round 1 showed that a gap can be environmental even when the trait is highly heritable. But this is a bean simulation. Real human data has confounds we didn't model here (like correlated environments). Please hold that specific application for the final 5 minutes of the debrief so we don't conflate the model with the complex reality."

  **6. The "High Heritability = Immutable" Drift**
  *   **Problem:** By Round 2, students think High SCS means Environment doesn't matter.
  *   **Fix:** This is the intended confusion. Let them feel the pain of the failed prediction in Round 4. When they lose points for predicting "No Change" in height, ask: "You thought High SCS meant fixed. The beans grew. What changed?" (The Soil/Fertilizer). "So High SCS meant...?" (That the Soil was uniform, not that Soil was irrelevant).
