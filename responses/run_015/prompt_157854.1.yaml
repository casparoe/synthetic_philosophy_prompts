      *   **Structure:** 4 Rounds, each producing specific confusion/insight.
          1.  High within-group heritability, between-group difference is environmental.
          2.  Environmental variance changes heritability estimate.
          3.  Individual inference fallacy (ecological fallacy).
          4.  Uniform environmental shift (Flynn effect style) despite high heritability.
      *   **Specific Ingredients:**
          *   Crossing Interaction (GxE): Rank order changes across environments.
          *   Niche Construction/Environment Modification: Organism arrangement affects environmental variance (and thus heritability).
      *   **Roles/Incentives:** Wagering points, budget allocation choices, leaderboard, trivial prize (apples).
      *   **Facilitation:** Minimal upfront exposition, fictional organism, term "heritability" withheld until debrief.
      *   **Debrief:** Map activity to concepts, acknowledge limitations (real-world estimation vs. known truth), handle human group difference questions.
