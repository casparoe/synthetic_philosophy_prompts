      *Wait, Range of G is constant.* Range of P changes.
      *If Range of G is constant, and Range of P expands due to Environment, SCS drops. This works.*
      *I will tell them: "We estimate variability using the Spread (Max - Min)."*
      *This meets "compute something" without stalling.*

      *(Second Correction on GxE)*: To make GxE work with Range, I need the Rank Order to flip.
      *Card Design:*
      *   Card A: Base 10. Sun +10, Shade -10.
      *   Card B: Base 10. Sun -10, Shade +10.
      *   In Sun: A=20, B=0. A > B.
      *   In Shade: A=0, B=20. B > A.
      *   Teams select "Best" from Sun (Card A). Plant in Shade. Fail.

      *(Second Correction on Niche)*:
      *   Spacing affects the *Environmental Noise* (Dice).
      *   Wide Spacing: Roll 1d6 (Low Noise).
      *   Tight Spacing: Roll 3d6 (High Noise).
      *   This changes $V_E$, thus changing SCS.

      *Let's finalize the 4 Rounds.*
      *   R1: Gap Trap (North/South Soil). SCS High within. Gap Env.
      *   R2: GxE + Spacing (Niche). Select seeds from R1. Plant in new spacing/condition. Selection fails. SCS changes due to spacing noise.
      *   R3: Individual Fallacy. (Quick interlude).
      *   R4: Uniform Shift. (Fertilizer). Mean up, SCS same.

      *Wait, R3 needs to be a round where they lose points.*
      *   R3: "Predict this specific plant's envelope value." They can't. They wager and lose.
      *   R4: "Predict the effect of Fertilizer." They think "Nothing, it's genetic." Mean shifts. They lose.

      *Okay, let's write it.*
answer: |-
  # Activity Design: The GlowBean Protocol

  **Course:** Genes, Minds and Society
  **Time:** 90 Minutes
  **Participants:** 18 Undergraduates (6 Tables of 3)
  **Topic:** Heritability (Variance Decomposition, G×E, Group vs. Individual)
  **Materials Bag:**
  *   18 Small Envelopes (sealed, containing "Genetic Cards").
  *   18 Genetic Cards (numbered/modified values).
  *   6 Sets of 3 Dice (different colors for different conditions).
  *   6 Metre Rules (or printed paper rulers).
  *   1 Pack of Sticky Notes (for recording data).
  *   1 Pack of Index Cards (for wagers).
  *   20 Red Tokens, 20 Blue Tokens (Budget).
  *   1 Large Printed Scoring Sheet (for Whiteboard).
  *   Bag of Apples (Prize).

  **Fictional Organism:** *GlowBeans*. They grow to a certain height (cm) and emit light.
  **Key Metric:** **Sealed-Card Share (SCS)**. (Do not use the word "Heritability" until debrief).
  **Formula for SCS:** $\frac{\text{Spread of Envelopes}}{\text{Spread of Heights}}$.
  *Note: To save time, "Spread" = Max Value − Min Value. This proxies variance for the purpose of the demo.*

  ---

  ## Facilitator Setup (Before Class)

  1.  **The Envelopes (Genotypes):** Prepare 18 envelopes. Inside are cards with a **Base Value**.
      *   6 Cards: Value 10 (Type Low)
      *   6 Cards: Value 20 (Type Mid)
      *   6 Cards: Value 30 (Type High)
      *   *Secret Modifier:* On the back of the card, mark 3 of them with a **(S)** and 3 of them with a **(C)**.
          *   **(S) Cards:** Add +10 in "Sun", Subtract 10 in "Shade".
          *   **(C) Cards:** Subtract 10 in "Sun", Add +10 in "Shade".
          *   (The other 12 cards are stable: Value ±0 regardless of condition).
  2.  **The Room:**
      *   **North Zone:** Tables 1, 2, 3.
      *   **South Zone:** Tables 4, 5, 6.
      *   **Whiteboard:** Draw a table for "Round Data" (Mean Height, Spread, SCS, Team Score).
  3.  **Roles per Table (assign verbally):**
      *   **Geneticist:** Holds the envelope, reveals value only at specific times.
      *   **Farmer:** Rolls dice (Environment), measures height.
      *   **Investor:** Records data, places wagers, manages tokens.

  ---

  ## Round 1: The Gap Trap (20 Minutes)
  **Goal:** Produce high within-group SCS, but a between-group mean difference caused entirely by environment.

  1.  **Distribution:**
      *   Give every table 3 Envelopes. Randomize the 18 envelopes across all 6 tables so every table has a mix of Low/Mid/High.
      *   **North Zone (Tables 1-3):** Announce "Rich Soil Condition." Add **+20** to every height measurement.
      *   **South Zone (Tables 4-6):** Announce "Poor Soil Condition." Add **+0** to every height measurement.
  2.  **Growth:**
      *   Geneticist opens envelope. Reads Base Value.
      *   Farmer rolls 1 Die (Environmental Noise: 1-6).
      *   **Height = Base + Die + Soil Bonus.**
      *   Record the 3 Heights on a Sticky Note.
  3.  **Computation:**
      *   Collect all 18 Heights. Write them on the Whiteboard (North column, South column).
      *   **Class Task:** Calculate the **Spread** (Max − Min) for the Envelopes (Facilitator reveals: Envelope Spread is 20). Calculate the **Spread** for the Heights (Students calculate: Max Height − Min Height).
      *   **Compute SCS:** $20 / \text{Height Spread}$. (It will be high, e.g., 0.8).
  4.  **The Wager:**
      *   Ask: "The North Mean is higher than the South Mean. Why?"
      *   Options: **A) North has better Envelopes**, **B) North has better Soil**.
      *   Teams write answer on Index Card. Correct answer (B) = 10 Points. Incorrect = 0.
      *   *Most will guess A because the SCS is high.*
  5.  **The Reveal:**
      *   Show the Soil Bonus rule. North had +20. Envelopes were randomized.
      *   **Confusion:** "How can the Card Share be high, but the difference be Soil?"

  ## Round 2: The Niche & The Flip (25 Minutes)
  **Goal:** Demonstrate G×E (Selection fails) and Niche Construction (Spacing changes SCS).

  1.  **Selection (G×E Setup):**
      *   Teams act as **Breeders**. They must choose 3 Envelopes for the next round based *only* on Round 1 Height performance.
      *   They request 3 new envelopes from you that match the Base Values of their best performers.
      *   *Trap:* The best performers in Round 1 (North/Sun) likely included **(S)** cards.
  2.  **Condition Change:**
      *   Announce: "We are moving to a **Shade House**."
      *   **Spacing Rule (Niche Construction):**
          *   Tables 1-3 (Tight Planting): Roll **3 Dice** for Environment (High Variance).
          *   Tables 4-6 (Wide Planting): Roll **1 Die** for Environment (Low Variance).
      *   **G×E Rule:** Apply the (S) and (C) modifiers now. (S) cards lose 10 points in Shade. (C) cards gain 10.
  3.  **Growth:**
      *   Calculate Height = Base + Modifier + Dice Sum. (No Soil Bonus this round).
  4.  **Computation:**
      *   Record Heights. Calculate Spread for Tight Tables vs. Wide Tables.
      *   Compute SCS for Tight (Low SCS due to high dice variance) vs. Wide (High SCS).
  5.  **The Loss:**
      *   Teams that selected "Best" seeds from Round 1 see their plants perform poorly in Shade (due to (S) modifier).
      *   **Score:** Teams with Mean Height > 25 get 10 points. Others get 0.
      *   **Confusion:** "We picked the best genes, but they failed. Also, why did the Card Share change when we just moved the pots?"

  ## Round 3: The Individual Fallacy (15 Minutes)
  **Goal:** Show SCS does not apply to a single organism.

  1.  **The Task:**
      *   Facilitator picks **one** specific GlowBean from the Round 2 data (e.g., Height 34).
      *   Question: "This bean is 34cm. The Envelope Spread is 20. The SCS is 0.8. How many cm of *this specific bean's* height is due to the Envelope?"
  2.  **The Wager:**
      *   Teams must write a number (0 to 34).
      *   **Rule:** There is no correct number.
      *   **Scoring:** Everyone gets 0 points.
  3.  **The Reveal:**
      *   "The SCS describes the *population spread*, not the *individual composition*. You cannot decompose a single score."
      *   This frustrates them. That is the point.

  ## Round 4: The Uniform Shift (15 Minutes)
  **Goal:** Show mean can change while SCS remains high.

  1.  **The Budget:**
      *   Each team gets 10 **Fertilizer Tokens**.
      *   **Choice:**
          *   **Option A (Equality):** Add +5 to *every* plant.
          *   **Option B (Targeted):** Add +15 to the *shortest* plant only.
      *   Teams must vote A or B. (Most will pick B to reduce variance, or A to boost mean).
  2.  **The Shift:**
      *   Facilitator enforces **Option A** for the whole class (Uniform Environmental Improvement).
      *   Add +10 to *all* heights.
  3.  **The Prediction:**
      *   Before adding, ask: "Will the Sealed-Card Share change?"
      *   Teams wager: **Change** vs. **Stay Same**.
      *   Correct Answer: **Stay Same** (Spread remains identical, just shifted).
      *   Teams get 10 points for correct wager.
  4.  **The Loss:**
      *   Ask: "Did the environment matter?"
      *   Teams who thought "High SCS means Environment doesn't matter" lose bonus points.
      *   **Score:** 10 Points for correct wager.

  ## Debrief & Mapping (20 Minutes)

  **1. The Reveal of the Term:**
  *   "The 'Sealed-Card Share' is what geneticists call **Heritability ($h^2$)**."

  **2. Map Activity to Concepts:**
  *   **Round 1 (The Gap):** High $h^2$ within groups $\neq$ Genetic cause of difference *between* groups. (Analogy: Height is heritable, but the difference between 18th C and 21st C is nutrition).
  *   **Round 2 (The Variance):** $h^2$ is a ratio. If Environmental Variance ($V_E$) goes up (Tight Spacing/3 Dice), $h^2$ goes down. If we control environment (Wide Spacing), $h^2$ goes up. **High heritability can mean we successfully controlled the environment.**
  *   **Round 2 (G×E):** There is no "best gene" independent of context. Selection fails when context shifts.
  *   **Round 3 (The Individual):** $h^2$ is a population statistic. It is meaningless for a single person. "80% genetic" does not mean "80% of your height."
  *   **Round 4 (The Shift):** High $h^2$ does not mean the trait is unchangeable. A uniform environmental shift moves the mean without changing the ratio.

  **3. The Reality Check (Facilitator Script):**
  *   "In this room, I knew the Envelope values. In real behavioural genetics, **nobody opens the envelopes.**"
  *   "We estimate this using twins or families, assuming their environments are equal. If that assumption is wrong, the number is wrong."
  *   "In this room, Genes and Environment were orthogonal (randomized). In society, they correlate (wealthy families provide both good genes *and* good schools). This makes the real-world number much harder to interpret."

  **4. Transfer to Humans:**
  *   "When you see a high heritability for a human trait (like test scores), it does not mean the gap between groups is genetic (Round 1). It does not mean the trait can't be changed (Round 4). And it definitely does not tell you why *you* scored the way you did (Round 3)."

  ---

  ## Scoring & Incentives

  *   **Leaderboard:** Drawn on Whiteboard.
  *   **Points:**
      *   Round 1 Wager: 10 pts.
      *   Round 2 Yield: 10 pts.
      *   Round 3: 0 pts (Instructional loss).
      *   Round 4 Wager: 10 pts.
  *   **Prize:** Bag of Apples to the table with the most points. (Symbolic: "Sustenance").

