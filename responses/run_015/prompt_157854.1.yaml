      *   *Key Detail:* The "Sealed-Card Share" (SCS) calculation must be explicit.
      *   *Key Detail:* The GxE mechanism needs to be clear in the card design.
      *   *Key Detail:* The "Niche" mechanism needs to be physical (spacing rulers).

