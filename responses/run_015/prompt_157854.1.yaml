      *   *Solution:* Simplify the computation. Use Mean Absolute Deviation or just Range as a proxy for variance, OR provide a pre-calculated "Variance Calculator" sheet where they just sum numbers. Better yet: The prompt says "almost none has ever decomposed a variance." I need to make the math doable. Let's use a simplified "Score" system where $P = G + E$. To estimate "Sealed-Card Share" (SCS), they can calculate $\frac{\text{Var}(G)}{\text{Var}(P)}$.
