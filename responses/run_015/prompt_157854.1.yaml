      *   No devices? Check.
      *   Bag portable? Check (Cards, envelopes, dice, rulers, tokens).
      *   4 Rounds? Check.
      *   GxE included? Check.
      *   Niche/Spacing included? Check.
      *   Debrief plan? Check.
      *   Troubleshooting? Check.

