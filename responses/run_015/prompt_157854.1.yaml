      *   *Actually, the most robust way:* The "Sealed-Card Share" is defined as $\frac{V_G}{V_P}$. I will give them a worksheet where they plug in the Sum of Squares for G and P. I (Facilitator) will have pre-calculated the Sum of Squares for G (since I know the envelopes). They calculate Sum of Squares for P (the measured heights). Then they divide.
