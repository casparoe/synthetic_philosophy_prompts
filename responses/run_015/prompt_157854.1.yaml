  2.  **Deconstruct the Activity Design:**

      *   **Fictional Organism:** Needs to be neutral but relatable. "Lumina Beans" or "SparkPlants". Let's go with **"GlowBeans"** (they grow and emit light). It allows for quantitative measurement (lumens/height) without human baggage initially.
      *   **The "Gene":** Sealed envelopes containing a number (Genetic Value, $G$).
      *   **The "Environment":** Dice rolls, card draws, or assigned conditions (Soil Type, Light, Spacing).
      *   **The "Phenotype":** $P = G + E + (G \times E)$.
