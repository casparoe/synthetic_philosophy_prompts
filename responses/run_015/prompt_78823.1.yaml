      *   (2) Opportunity costs require prices from exchange between separate owners.
      *   (3) Socialism = one owner (state), no exchange of means of production.
      *   (4) Therefore, no prices for means of production.
      *   (5) Therefore, no knowledge of opportunity costs.
      *   (6) Therefore, rational allocation is impossible (not just inefficient).

  3.  **Deconstruct the Friend's Objection (The "Firm" Objection):**
      *   Firms also have internal allocation without external exchange between divisions.
      *   Firms use transfer prices (set internally).
      *   Firms succeed (some are huge).
      *   Therefore, exchange/ownership isn't strictly necessary for calculation *within a scope*.
      *   Therefore, the SCD argument proves too much (implies firms shouldn't work).
      *   Also, Lange's trial and error is just simulating a market (Walrasian auctioneer).

  4.  **Evaluate the Validity of the Objection:**
      *   The "Firm Objection" is a classic and serious critique of the strong Misesian interpretation. Coase ("The Nature of the Firm") is the key reference here.
      *   Mises/Hayek didn't deny firms work. They argued firms work *because* they exist within a broader market context that provides the price signals for the factors of production the firm buys and sells.
      *   A socialist economy is *one giant firm* encompassing the whole economy. There is no external market to anchor the internal transfer prices.
      *   So, the friend is partially right (firms do calculate internally) but misses the distinction between *partial* planning (within a market) and *total* planning (the whole economy).

  5.  **Address the User's Specific Constraints:**
      *   *Keep (2):* Opportunity costs are prices from exchange. (This is the subjective/value insight).
      *   *Keep the Conclusion:* Socialism can't calculate like a market.
