      *   **The Friend's Point:** Validate the friend too. The "Firm Objection" is standard and powerful (Coase). It's not just being difficult; it's the central counter-argument.
      *   **The Crucial Distinction (The "Anchor"):** Explain *why* firms work but a socialist state doesn't (in this framework). Firms exist *inside* a market. They use external prices for labor, capital, and raw materials to check their internal efficiency. A socialist state *is* the market (or lack thereof). It has no external anchor.
      *   **Which Premise to Drop/Modify?**
          *   Don't drop (2). It's the core insight.
