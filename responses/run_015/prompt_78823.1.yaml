          *   **Modify (6).** The claim isn't that calculation is *logically impossible* (like squaring a circle), but that it becomes *computationally/epistemically impossible* as scale increases and the external market anchor disappears.
          *   Actually, a better tweak is to refine the inference between (3) and (4). Socialism *can* have prices for consumer goods (Lange allowed this). The issue is *capital* goods.
          *   *Best advice:* Refine the scope of the argument. The argument holds against *comprehensive* socialism, not *partial* planning (like a firm).
      *   **Addressing the "Firm Analogy" vs. "Lange":**
