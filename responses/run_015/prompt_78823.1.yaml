      *(Self-Correction during drafting)*: Wait, if I tell him to weaken (6), does that concede too much to the friend? The friend says "proves too much." If I say "It only applies to the whole economy, not firms," I am accepting the friend's premise that firms *do* calculate. This is correct. The Austrian response is that firms calculate *using market prices*. So the argument isn't "Planning is impossible," it's "Planning without market prices is impossible." A firm has market prices available for its inputs/outputs. Socialism does not.
      So, the modification is to (3)/(4). It's not that there is *one owner*, it's that there is *no external market*.
