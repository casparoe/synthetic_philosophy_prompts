answer: |-
  Based on the four verdicts provided and her stated suspicion about a "breaking point," here is the analysis of your friend's moral framework, the prediction for the new case, and the test case to isolate her underlying principle.

  ### 1. Prediction for the New Case (1 vs. 10,000)
  **Verdict:** She will say you must **save the ten thousand.**

  **Why:** Her position is a form of *Non-Aggregationism with a Threshold*. In Cases 1 through 4, she maintains that individual claims cannot simply be summed up (the five do not outweigh the one). However, she explicitly admitted that she suspects a ratio exists where this view "breaks down." In moral philosophy, this is often called the "Absurdity Constraint": a principle holds until following it leads to a result that is morally grotesque or absurd. Saving one person while letting ten thousand die is widely intuitively regarded as such an absurdity. Since 1 vs. 5 did not trigger this constraint, but 1 vs. 10,000 clearly exceeds any reasonable threshold for "negligible disparity," her suspicion dictates that the prohibition on counting numbers is lifted at this scale.

  ### 2. Three Rules Fitting Verdicts 1–4
  Here are three distinct principles that explain her past verdicts equally well but rely on different moral mechanics.

  **Rule A: The Hard Threshold View**
  *   **Principle:** Individual claims are non-aggregatable. You cannot sum the claims of the many to outweigh the few. *Exception:* If the numerical disparity reaches a specific magnitude where ignoring the numbers violates a duty to the collective, aggregation becomes mandatory.
  *   **Fit:** Explains 1 vs. 5 (below threshold, toss coin) and 1 vs. 10,000 (above threshold, save many). Explains Case 2 (different harms, so numbers are irrelevant) and Case 4 (certainty outweighs probability when numbers are discounted).
  *   **Prediction for 10,000:** Save the 10,000. The threshold is crossed.

  **Rule B: The Cognitive Rounding View**
  *   **Principle:** Numbers *always* count morally, but human moral cognition treats small ratios as ties for the sake of fairness and simplicity. We "round down" small numerical advantages to zero. As the ratio grows, the "weight" of the numbers becomes too large to round down.
  *   **Fit:** Explains 1 vs. 5 (5 is close enough to 1 that we treat them as equal claims). Explains Case 2 (Severity of harm is the primary weight; numbers are secondary). Explains Case 4 (Certainty is a heavier weight than the small numerical advantage of the probabilistic group).
  *   **Prediction for 10,000:** Save the 10,000. The ratio is too large to "round down"; the numerical weight is now decisive.

  **Rule C: The Individual Fair Chance View**
  *   **Principle:** The goal is to give every *individual* an equal chance of being saved, not to maximize outcomes. In small groups, a coin toss between *groups* is an acceptable heuristic for fairness. In massive groups, a coin toss between groups gives the single individual a vastly disproportionate chance (50%) compared to each member of the large group (0.005%), violating the equal chance principle.
  *   **Fit:** Explains Case 1 (Coin toss gives groups equal chance, which feels fair enough). Explains Case 3 (Partiality is allowed, but impartiality is permissible). Explains Case 2 (Death is a total loss of chance; a leg is not, so the one has a stronger claim to the "chance" of life).
  *   **Prediction for 10,000:** Save the 10,000. A coin toss would violate the fair chance of the 10,000 individuals. To give everyone an equal chance, you would need a weighted lottery, but given the scale, the probability for the one is so low it effectively mandates saving the many.

  ### 3. The Role of the Coin Toss
  **Verdict:** The coin toss is a **tie-breaker she happens to like**, not a moral requirement.

  **Analysis:** In Case 1, she explicitly states that "either rescue is permissible." If the coin toss were a requirement of justice (i.e., if the single person had a *right* to a 50% chance), then saving the five without a toss would be *wrong*. Since she deems saving either group permissible, the toss is a supererogatory act—a way to satisfy her own desire for impartiality in a situation where morality leaves the choice indeterminate. It resolves the *agent's* dilemma, not the *claimants'* rights.

  ### 4. Numbers vs. Individual Loss
  **Verdict:** Her real principle is about **Individual Loss**, with Numbers acting only as a secondary tie-breaker.

  **Analysis:** Case 2 is the smoking gun. If her principle were about numbers, the five should outweigh the one. She saves the one. This proves that the *magnitude of harm per person* (Death vs. Leg) is the primary moral currency. Numbers only enter the calculation when the harm per person is identical (Case 1 and the new case). Even then, they only count when the disparity is vast (her "breaking point"). Therefore, her hierarchy is:
  1.  Severity of Individual Harm (Death > Leg).
  2.  Certainty of Rescue (Certain > Probabilistic).
  3.  Number of Individuals (Only counts if 1 and 2 are equal *and* the ratio is extreme).

  ### 5. The Crucial Test Case
  To distinguish between the **Hard Threshold View (Rule A)** and the **Cognitive Rounding View (Rule B)**, you need to find the "gray zone" where one view sees a tie and the other sees a weight.

  **The Case:**
  > "The same shape as Case 1 (all strangers, certain rescue, equal harm), except that it is **one person on one side and one hundred on the other.**"

  **The Question:**
  > "In this 1 vs. 100 case, is it permissible to toss a coin (giving each group a 50% chance), or must you use a weighted lottery (giving the one person a 1% chance and the group a 99% chance)?"

  **How it separates the rules:**
  *   **If she says "Toss a coin (50/50)":** She supports the **Hard Threshold View**. She believes 100 is still below the "absurdity" limit where numbers begin to count. To her, 1 vs. 100 is morally identical to 1 vs. 5.
  *   **If she says "Weighted Lottery (1% vs 99%)":** She supports the **Cognitive Rounding View**. She believes numbers *always* count, but 1 vs. 5 was too small to notice. 1 vs. 100 is large enough that "rounding" is no longer honest; the numbers must be acknowledged proportionally before reaching the 10,000 "save outright" point.
  *   **If she says "Save the 100 Outright":** She supports a **Low Threshold**. The breaking point is lower than 10,000; 100 is already enough to trigger the aggregation exception.

  This case forces her to locate her "breaking point" on the spectrum, revealing whether her philosophy is binary (Threshold) or gradient (Rounding).
