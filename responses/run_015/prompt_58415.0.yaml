answer: |-
  The fluorescent lights of the Oakwood Cooperative community room hummed with a sound that seemed to vibrate in the teeth of the twelve residents present. It was November, the rain was lashing against the single-pane windows, and the air smelled of stale coffee and wet wool. On the folding table at the front lay the Charter, a black three-ring binder that had grown thick with addenda over the decade since the building converted.

  Elias, retired and weary of conflict, sat in the back row. He watched Priya, the co-op secretary, adjust her glasses. She held the pen poised over the minutes log. Beside her stood Sarah, the proposer, clutching a printed copy of Amendment 14. Across the aisle stood Marcus, arms crossed, staring at the tally sheet.

  "Seven in favor, five against," Priya announced, her voice flat. "Motion carries by simple majority."

  Silence followed, heavier than the rain. Then Marcus uncrossed his arms.

  "It didn't carry," he said.

  Sarah turned slowly. "The count is seven to five, Marcus. Provision One says decisions are made by simple majority. You were there."

  "Provision One governs *current* rules," Marcus said, stepping toward the table. "Amendment 14 changes Provision Three. It says any change to immutability designations requires unanimity. This amendment changes immutability designations. Therefore, it requires unanimity. We have seven. We need twelve."

  Elias shifted in his chair. This was the knot they had been tying for an hour. The Charter was a closed loop. Provision One established majority rule. Provision Two allowed clauses to be marked mutable or immutable. Provision Three stated that changing a clause's designation required the threshold currently applicable to that clause. Provision Four guaranteed the right to propose changes.

  Amendment 14 was an omnibus move. It added a new clause regarding garden maintenance and designated that new clause as immutable. Simultaneously, it revised Provision Three to require unanimity for any future changes to immutability designations. Sarah wanted to lock the garden rules against future development; Marcus wanted the flexibility to build a deck later if the board allowed it.

  "The revision to Provision Three applies prospectively," Sarah said, her voice tight. "We voted under the rules existing at the time of the vote. At the time of the vote, Provision Three allowed majority changes to mutable provisions. Provision Three was mutable. We voted by majority. The amendment is adopted. Now Provision Three is changed. Now you need unanimity to change it back."

  "That's circular," Marcus countered. "You're using the old rule to enact a new rule that invalidates the old rule's application to itself. If the amendment passes, it establishes that unanimity was required. Since we didn't have unanimity, it didn't pass. If it didn't pass, the old rule stands, so it did pass. The Charter doesn't tell us which timeline wins."

  Priya lowered her pen. "I cannot record this as adopted if the validity is contested. The minutes must reflect the legal status of the co-op."

  "The legal status is that I voted yes, and I expect the garden to be protected," Sarah said. She looked around the room, seeking allies. "If we can't lock in rules, what's the point of the Charter? Anyone can come in next year with a majority and turn our quiet hours into a free-for-all. That's why I made the new clause immutable. That's why I tightened Provision Three."

  "And if you succeed," Marcus said, pointing at the binder, "you've created a trap. You've used a majority to install a unanimity lock. Once this passes, we can never change the immutability rules again unless everyone agrees. Including the person who wants to build the deck. Including the person who wants to allow pets. You're freezing the co-op in place using a loophole."

  "It's not a loophole, it's stability," Sarah snapped.

  "It's a paradox," Elias said quietly. The room turned to him. He hadn't intended to speak. "The Charter doesn't have a Provision Zero. It doesn't say whether an amendment's procedural requirements apply to itself."

  "Exactly," Marcus said. "So we default to logic. You can't use a rule to validate itself if the rule says you can't use that rule."

  "That's philosophy," Sarah said. "This is housing. We voted. The vote is done."

  "The vote is a physical act," Elias said. "The validity is a legal status. They aren't the same thing."

  Priya tapped the binder. "If I record it as passed, and Marcus challenges it, we are in violation of our own rules depending on which interpretation is true. If I record it as failed, Sarah challenges me. Provision Four says I cannot remove the right to propose amendments. If I rule it failed, am I removing Sarah's right? Or protecting the threshold?"

  The stakes hung in the air, thicker than the humidity. For Sarah, this was about the community garden. She had spent three years clearing the invasive knotweed behind the garage. She wanted to ensure no future board could pave it for parking. Immutability was her shield. For Marcus, it was about equity. He owned a ground-floor unit. He believed property values relied on the ability to improve units. If the Charter could be locked by a transient majority, his asset was held hostage by his neighbors' whims.

  "We need a tiebreaker," Marcus said. "We need to vote on whether the amendment passed."

  "Under what rule?" Sarah asked. "Majority? Then I win again. Unanimity? Then you win."

  "See?" Marcus threw his hands up. "It eats itself."

  Elias looked at the faces around the table. They were neighbors. They shared a laundry room, a driveway, and a water main. They needed to decide who shoveled the snow tomorrow. They needed to approve the budget next week. The theoretical impasse was about to become a practical crisis.

  "If the amendment is valid," Elias said, "then Provision Three is now stricter. Any attempt to change the garden clause later requires unanimity. If the amendment is invalid, the garden clause is mutable. A future majority can pave the garden."

  Sarah straightened her spine. "I am proceeding on the basis that it is valid. I will notify the landscaping committee that the garden status is immutable."

  "And I will notify the board that any restriction on deck construction based on that amendment is void," Marcus replied. "I'm filing a permit application next week."

  "You can't," Sarah said. "The Charter forbids it."

  "The Charter allows it," Marcus said. "Because the restriction never legally existed."

  Priya closed the binder. The snap of the latches sounded like a gavel. "I will record the vote count. I will record the motion. I will record the objection. I will not record a status. Let the residents act according to their conscience."

  "That's not how cooperatives work," Sarah said, frustration bleeding into her tone. "We need a single source of truth."

  "We have a single document," Priya said, tapping the black cover. "It just speaks with two voices."

  The meeting adjourned without a formal motion to close. Chairs scraped against the linoleum. Residents filed out into the hallway, avoiding eye contact. The paradox had not been solved; it had been distributed.

  Elias walked to the front door with Marcus. Outside, the rain had turned to sleet. The sidewalk was slick.

  "You know she's going to try to enforce it," Elias said.

  "I know," Marcus said, pulling his collar up. "And I'm going to ignore it. Then she'll fine me. Then I won't pay. Then she'll try to lien the unit."

  "And the Charter says liens require a majority vote of the board."

  "Which I might have," Marcus said. "Or I might not. Depending on whether Amendment 14 changed the voting rights for enforcement actions."

  "It didn't mention enforcement."

  "It might imply it," Marcus said. "That's the problem, Elias. Once you start reading the silence, you can find anything."

  Sarah caught up to them near the bike racks. She looked tired. "I just wanted the garden to stay," she said. "Is that so unreasonable?"

  "No," Marcus said. "But not if it costs us the ability to change our minds."

  "We shouldn't have to change our minds on fundamental things," Sarah said.

  "Fundamental to who?" Marcus asked.

  They stood in the vestibule, the wind whistling through the cracks in the doorframe. The building groaned around them, the pipes knocking in the walls. There was no judge coming. There was no higher authority. There was only the Charter, the vote, and the snow piling up on the driveway.

  "I'm shoveling tomorrow," Sarah said. "I'll clear the path to the garden."

  "I'll clear the path to the parking lot," Marcus said. "If you put up a sign saying the lot is common land restricted by the amendment, I'm taking it down."

  "If you take it down, I'll put up two."

  "Then I'll take down four."

  Elias watched them. They were not enemies. They were people trapped in a logical structure that had no exit. The Charter was supposed to govern them, but now they had to govern the Charter.

  "See you at the budget meeting," Elias said.

  "Bring your calculator," Marcus muttered.

  "Bring your copy of the Charter," Sarah replied.

  They stepped out into the cold. The light above the door flickered, buzzed, and stayed dim. Inside the community room, the black binder sat on the table. Page three, Provision Three, waited to be read. It said one thing to Sarah, and the opposite to Marcus. Both were right. Both were wrong. The snow began to fall, covering the driveway, covering the garden, hiding the lines they had drawn in the earth, waiting for someone to walk across them and find out if the ground was solid.
