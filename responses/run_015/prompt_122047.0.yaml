answer: |-
  Good evening. Thank you for coming.

  Ten years is a long time. Look around this room. There are ninety of us. Some of you have been here since the start. Some are new. Some are the families we have welcomed. Some are those who decide policy for this county. Some are here to write it down.

  We are here to mark a partnership. But we are also here to mark a tension.

  Some of you know I studied philosophy. My teacher was Michael Dummett. He wrote about refugees. He is not here, but his questions are. I do not want to defend him. I do not want to disown him. I want to use what he taught me to tell the truth about tonight.

  He taught three things. First, a country can set a limit on numbers. But only to make sure newcomers are integrated, not left alone. Second, a refugee has a different claim than someone who just wants a better life. Their claim is stronger. Third, if you want to restrict numbers, you must ask: would I say this if the people looked like me? If the answer is no, then the restriction is not about capacity. It is about something else.

  Our partnership has tried to live by this. We do not choose families because they seem like a good fit. We draw names by lot. We do not hide how many we turn away. We publish the number. We admit there is a limit. We do not pretend we can take everyone. I do not believe we can. Dummett did not believe it either.

  But there is a second truth. Capacity is not something a town finds. It is something a town makes.

  Some say we are full. They say the schools are crowded. They say the character of the town is changing. They say we cannot take more.

  But capacity is not a wall we bump into. It is a house we build. It is made of befrienders. It is made of landlords who will rent. It is made of language classes. It is made of time. If we do not build these things, we cannot say the room is full. We can only say we did not build the chairs.

  A community that under-invests and then pleads low capacity is pleading its own stinginess.

  This is where we must be clear. The reasons given for the new cap fail the test. Would we say schools are too full if the children were white? Would we say the town character is threatened if the newcomers were from London? If the answer is no, then the objection is not about capacity. It is about who is coming.

  I am not calling anyone names. I am looking at the logic. The logic does not hold.

  So where does that leave us? It leaves us with a choice. We can pretend the limit is natural, like the weather. Or we can admit the limit is a choice, like a budget.

  If we treat it like the weather, we will fail. We will take people in and then leave them alone. We will say we welcomed them, but we will not stay. Then people will say, "See, they did not integrate." But we made them fail. We built the house and then walked away.

  Integration does not happen in year one. Year one is survival. Year two is life. That is when the English is better, but the friends are fewer. That is when the initial excitement is gone. That is when the volunteers go home.

  This is where the argument meets the floor. If we say capacity is made, then we must make it. We cannot just say it.

  We lose most of our volunteers after the first year. This is the weak point. This is where the integration falls apart. If we stop here, we prove the critics right. We prove that we cannot absorb people. If we stay, we prove them wrong. We prove that capacity is built by presence.

  So I am not asking for money. I am not asking for protest. I am asking for time.

  We need second-year befrienders. We need you to stay when the case is closed. We need you to stay when the headlines are gone. We need you to stay when it is just a Tuesday night and someone needs a lift to the doctor.

  This is not about having a big heart. It is about being honest. If we say we welcome people, we must build the space for them to stay. If we will not build the space, we should not open the door.

  But if we are willing to build it, then the limit is not where the council says it is. The limit is where our willingness ends.

  So here is the business. On the tables, there are forms. They are for year two. If you have been a befriender, sign up for another year. If you have not, sign up now. Let us show that capacity is not found. It is made.

  Thank you.

  ***

  **Note on potential extraction:**

  The sentences most likely to be lifted are: *"A community that under-invests and then pleads low capacity is pleading its own stinginess"* and *"Would we say the town character is threatened if the newcomers were from London?"* Taken alone, the first sounds like an accusation of miserliness rather than a structural argument; the second could be presented as a direct accusation of racism against the council, ignoring the conditional framing used in the speech.
