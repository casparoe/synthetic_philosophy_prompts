answer: |-
  You have put your finger on a genuine philosophical fault line, and your position in technical compliance gives you a vantage point most philosophers lack. You see the machinery from the inside, where the grease shows. What you are describing is the tension between the *iconic* (signs that resemble what they stand for) and the *symbolic* (signs that stand for things by agreement), and the uncomfortable hybrid that results when a system tries to be both.

  To answer your first question: the practice of care labelling does not strictly presuppose that pictures are non-arbitrary. It strictly presupposes convention. If the system relied purely on resemblance, the washtub would not need a numeral or dots inside it, nor would the cross-bar need a legal definition. A picture of a fire means "hot" by resemblance, but a picture of a tub with a cross through it means "do not wash" only because a committee in Geneva or Washington said so. There is no natural law that says a diagonal line negates the object it crosses; that is a syntactic rule, exactly like the word "not".

  However, the practice *suits* itself to the claim of naturalness. It is in the commercial interest of the clothing industry to present these labels as universal truths rather than local regulations. If the label is a "language without words," it implies that the meaning is discovered by the eye, not taught by the state. This shields the manufacturers from liability. If you shrink a jumper because you misread the dots, the defence is that the symbol was self-evident. So, while a conventionalist account explains the practice perfectly well—these are traffic lights for fabric—the system is dressed in the clothes of natural resemblance to make it palatable and legally robust. The parts hang together, but not as a set of likenesses. They hang together as a code.

  You ask whether a system that crosses things out to negate, underlines to weaken, and repeats to count is already a grammar. It is. It is a sparse grammar, but a grammar nonetheless. You have operators (the cross, the underline) and operands (the tub, the iron). You have quantifiers (the dots or numerals). Once you admit you have a grammar, the appeal to the "natural" picture begins to crumble. You cannot guess a grammar; you must learn it. A child or a person from a culture without written text might look at a crossed-out iron and wonder if it means "cold iron" or "broken iron" or "iron for export." The meaning is fixed by the rule, not the likeness. Therefore, the appeal of calling it natural does not survive scrutiny; it survives only as a marketing heuristic. It feels natural because the grammar is simple, not because it is pre-linguistic.

  This brings us to Neurath. You have grasped his position well, but the tension you feel is the point. Neurath's "ship at sea" metaphor is a direct challenge to the idea that we can find a clean, pre-theoretical starting point. If we are always on the ship, we are always using old planks to build new ones. We never touch the dry dock of pure reality. When Neurath said "words divide, pictures unite," he was expressing a hope, a political aim. When he called his system a "technique" and a "helping thing," he was acknowledging the reality of the ship.

  The care label designers are implicitly committed to the idea that they *have* reached the dry dock. They act as though the washtub is a universal given, and the only task is to annotate it. Neurath would say they are deluded. The washtub is just another plank. The tension is real: you cannot have a system that claims to be self-explanatory (requiring no prior knowledge) while simultaneously relying on numerals, legal ownership, and revised standards (which require training and context). Neurath's move to call it a "technique" rather than a "language" dissolves the tension only if you accept that the pictures are aids to communication, not replacements for it. If you insist, as the clothing industry does, that the label *is* the communication, the tension remains. The label pretends to be the dry dock, but it is just more ship.

  Now, to your practical questions. What would have to change if the implicit theory were given up? If we admitted that these are conventional symbols and not natural pictures, we would stop pretending they need no explanation. We would accept that they require a key, much like a map legend.

  Regarding the numerals versus dots: dropping the numerals and going purely ordinal (dots) would be more faithful to the picture-language idea. A numeral "40" is tied to the Celsius scale, which is tied to a specific scientific convention. A dot is abstract. However, it would be less informative. It trades precision for portability. This highlights the trade-off at the heart of your work: the more "universal" the sign, the less specific information it can carry without slipping back into words. The current system cheats; it uses the picture to carry the weight of universality and the numeral to carry the weight of precision. If you removed the numeral, you would have to accept that the label tells you "warm wash" rather than "40 degrees," which returns judgement to the user.

  Regarding the "tolerable" versus "required" distinction: this is the most profound philosophical snag in your industry. A label stating what is *tolerable* (the maximum stress the fabric survives) makes a claim about the physical world. It is a statement of fact, roughly speaking. A label stating what is *required* (what you must do to make it clean) makes a claim about human ends. It is normative. To say "you must wash at 40" implies that 30 is insufficient for your standards of cleanliness. But cleanliness is cultural. One person's "clean" is another's "worn." Therefore, a label could not honestly be made to say what is required without invoking words to define the requirement. The "tolerable" limit works precisely because it is negative; it sets a boundary of safety, which is easier to universalise than a prescription of behaviour. To shift to "required" would force the system to collapse back into text, because you cannot picture an "ought" as easily as you can picture a "can."

  So, where does this leave Neurath's suspicion of pristine starting points? The care label system is an attempt to build a dry dock on the open sea. It wants to offer a sign that needs no history to be understood. Neurath would argue that this is impossible. The sign always travels with the history of its use. When you see the cross, you understand it because you have seen crosses in other contexts (no entry, no smoking). You are not seeing the sign anew; you are recognising a pattern from your life on the ship.

  If Neurath calls his system a mere technique, he is admitting that the pictures are not magic. They are tools that work *within* a context. The care label fails when it denies this context. It works best when treated as Neurath suggested: as a helping thing alongside the booklet, the website, the shop assistant's advice. The friction you feel—the gap between the system's presentation and its operation—arises because the industry wants the authority of a law (which the symbols have, being licensed) without the baggage of a law (which requires learning).

  In sum, the theory of meaning that makes sense of your practice is a conventionalist one, dressed in iconic clothing. It presupposes a shared grammar of negation and modification, not a shared biology of sight. The parts hang together as a code, not as a mirror. If you gave up the pretence of the self-explanatory picture, you would gain honesty but lose the illusion of universality. You would have to admit that the label is not a universal truth, but a local instruction translated into a code that hopes to be widely recognised. Neurath's "ship" metaphor warns us that we cannot step outside our conventions to find a pure language. The care label tries to do exactly that. It claims to be the plank that is also the sea. It is not, and your evening reading has led you to spot the join.
