answer: |-
  You have identified a genuine, documented, and frustrating phenomenon in comparative psychology and philosophy of mind. You are not overthinking it, and you are not just lumping distinct things together. There is no single canonical noun that captures the *logical structure* of what you are seeing, but there is a cluster of concepts that, when combined, carve out exactly the shape you described.

  Here is the carving you asked for, broken down by name, mechanism, the Bayesian objection, and the AI parallel, with the requested epistemic flags.

  ***

  ### 1. The Name and the Carving

  You recalled **Anthropodenial** correctly. Coined by primatologist Frans de Waal, it refers to the *a priori* rejection of human-like characteristics in other animals.
  *   **[Consensus]:** This term is widely accepted in ethology and comparative psychology to describe the *attitude* you are seeing.
  *   **[Limitation]:** However, you are right to feel it is insufficient. "Anthropodenial" describes a knee-jerk refusal. What you are describing is more sophisticated: it is a **methodological asymmetry**.

  The precise logical phenomenon you are observing is best described as **Asymmetrical Evidentiary Standards** (sometimes discussed under **Substrate Chauvinism** or **Neurochauvinism**).

  **The Carving:**
  *   **What it is:** A pattern of reasoning where Behavioral Evidence $E$ is assigned high probative value for Hypothesis $H$ (consciousness/pain) in Subject $A$ (mammals), but $E$ is assigned low or null probative value for $H$ in Subject $B$ (non-mammals), *without* a corresponding difference in the complexity or organization of $E$.
  *   **What it is not:** It is not simple skepticism. A consistent skeptic would say, "I don't know if the dog is in pain either." It is not valid Bayesian updating *if* the likelihood of the evidence is being distorted (more on this below).
  *   **The Edge Case:** It is *not* asymmetrical standards if the behavior itself is different. If a dog whines and a crab does not, weighing the whine higher is valid. Your case is stronger because the *functional role* of the behavior (trade-off decisions, analgesic reversal) is identical.

  **[Analytical Take]:** I propose calling this **"Evidentiary Asymmetry"** in your group. It is distinct from speciesism (which is moral) and anthropodenial (which is attitudinal). It is an epistemic inconsistency regarding how data is weighted.

  ***

  ### 2. The Mechanism: Neurochauvinism and "Moving the Goalposts"

  You mentioned the skeptic citing mammalian brain structures (cortex) as necessary for consciousness. This has a name.

  *   **[Live Dispute]:** **Neurochauvinism** (or **Corticocentrism**). This is the claim that specific neural substrates (like the neocortex) are *necessary* conditions for consciousness.
      *   *Side A (The Skeptics):* Argue that without a cortex (or homologous structure), there is no "hardware" for experience. This is the "Hard Problem" weaponized.
      *   *Side B (The Proponents):* Argue that consciousness depends on functional organization (integration of information), which can be realized in different substrates (e.g., pallium in birds, ganglia in cephalopods).
      *   *The Trap:* When the skeptic says, "Fish don't have a cortex, so this behavior is reflex," they are defining consciousness by *human anatomy* rather than *functional capacity*. This is the "definition by fiat" you noticed.

  *   **[Consensus]:** It is uncontroversial that behavior is the *primary* evidence we have for other minds (the "Problem of Other Minds"). We cannot access the "neural signature of consciousness" directly in humans either; we infer it from report + behavior + neural correlation. Demanding a report from a crab is demanding impossible evidence.

  *   **[Analytical Take]:** The move you are seeing is a **"Likelihood-Prior Conflation."** In Bayesian terms:
      *   **Prior:** How likely is it *beforehand* that a crab feels pain? (Skeptics say: Low).
      *   **Likelihood:** If a crab *did* feel pain, how likely is it to show this behavior? (Should be: High).
      *   **The Error:** Skeptics often argue that because the Prior is low, the Likelihood is *also* low (i.e., "That behavior doesn't *count* as pain behavior in a crab"). They treat the behavior as less informative because they dislike the hypothesis. This is where the reasoning breaks down.

  ***

  ### 3. The Bayesian Objection (Your Vet Student's Point)

  Your vet student says: *"If you start with a strong prior that mammals feel pain and insects don't, the same evidence rationally moves you different amounts."*

  *   **[Consensus]:** She is technically correct about Bayesian math. If $P(Hypothesis)$ is tiny, you need massive evidence to move the posterior probability.
  *   **[Live Dispute]:** Where do the Priors come from?
      *   If the Prior is based on **phylogenetic distance** (evolutionary relatedness), that is a scientifically defensible prior.
      *   If the Prior is based on **morphological similarity** ("it looks like me"), that is vulnerable to charges of bias.
  *   **[Analytical Take]:** The problem in your group is not that they have different Priors. It is that they are **hiding the Prior**. They present their conclusion as a judgment on the *quality of the evidence* ("This is just nociception") rather than a judgment on the *subject* ("I require more evidence for this subject").
      *   *Honest Bayesian:* "I think crabs are unlikely to feel pain, so this behavior isn't enough to convince me yet."
      *   *Dishonest Bayesian (The Phenomenon):* "This behavior isn't evidence of pain."
      *   The first is rational; the second is the **Evidentiary Asymmetry** you identified.

  ***

  ### 4. The AI Parallel and the "Unresponsive Patient"

  You asked about the AI version and the vegetative state patients.

  *   **[Consensus]:** The parallel is structurally identical. In AI, it is often called **"The Stochastic Parrot Defense."** Any behavior that looks like understanding is explained away as "pattern matching" (reflex) rather than "meaning" (consciousness).
  *   **[Consensus]:** The medical parallel you mentioned is **Cognitive Motor Dissociation** (formerly vegetative state).
      *   *The Lesson:* For decades, lack of behavioral response was taken as evidence of lack of consciousness. fMRI later showed some patients could follow commands mentally.
      *   *The Relevance:* This proves that **behavioral silence (or simplicity) does not entail mental silence.** It validates your worry that dismissing crab behavior as "reflex" might be a false negative with high stakes (welfare).

  *   **[Analytical Take]:** This confirms that the phenomenon is **Substrate-Dependent Skepticism**. Whether the substrate is carbon (crab), silicon (AI), or damaged tissue (patient), the move is the same: "Your hardware doesn't support the software I'm looking for, so I will interpret your output as noise."

  ***

  ### 5. Is It a Mistake? (The Verdict)

  You asked: *"Tell me whether it's a mistake at all, or just what good reasoning looks like when the prior is doing the work."*

  *   **[Consensus]:** It is rational to require more evidence for extraordinary claims (a crab mind is more "extraordinary" to a human than a dog mind).
  *   **[Live Dispute]:** Whether the current evidence *is* sufficient. Some philosophers (e.g., Peter Godfrey-Smith, Jonathan Birch) argue the evidence for decapod crustaceans and cephalopods *is* already sufficient for precautionary principles. Others (e.g., Michael Tye, though he varies) argue we need more neural data.
  *   **[Analytical Take]:** It is a **methodological mistake**, even if the conclusion turns out to be true.
      *   Why? Because science relies on **Inference to the Best Explanation (IBE)**. If "Pain" explains the trade-off, grooming, and analgesic reversal better than "Nociception + Reflex" in a dog, it should logically do the same in a crab *unless* you can point to a functional difference in the behavior.
      *   By dismissing the explanation solely based on the substrate, they are insulating their hypothesis from falsification. If *no* behavior counts (because it can always be called a reflex), the claim "crabs don't feel pain" is unfalsifiable. Unfalsifiable claims are outside science.

  ***

  ### Summary for Your Group (Tuesday Cheat Sheet)

  If you want to raise this on Tuesday without sounding like you are accusing them of bias, here is the terminology to use:

  1.  **Don't say "Speciesism."** Say **"Asymmetrical Evidentiary Standards."** This frames it as a methodological consistency issue, not a moral one.
  2.  **Acknowledge the Priors.** Tell the vet student: "I agree Priors matter. But are we letting the Prior lower the *Likelihood*? Are we saying this behavior is less informative in a crab, or just that we started more skeptical?"
  3.  **Invoke the "Locked-In" Parallel.** Remind them that in human medicine, we learned that lack of complex behavior (or complex brain structures we expected) did not mean lack of consciousness.
  4.  **The "Hard Problem" Shield.** Point out that using the "Hard Problem" to dismiss evidence in crabs but not dogs is a **Special Pleading** fallacy. The Hard Problem applies to the dog equally; we just solve it with Priors.

  **Confidence Levels:**
  *   **High Confidence:** That this pattern exists and is documented (Anthropodenial/Neurochauvinism).
  *   **High Confidence:** That the "Unresponsive Patient" parallel is valid and historically accurate.
  *   **Moderate Confidence:** That the Bayesian "Likelihood-Prior Conflation" is the specific logical error (this is my philosophical analysis, though it aligns with standard critiques of skepticism).
  *   **Low Confidence/Disputed:** Whether crabs *actually* feel pain. (I am not settling that science; I am settling the logic of how we decide).

  **One Coinage for You:**
  If you want a tight definition to test future cases, use this:
  > **"Substrate-Weighted Evidentiary Decay"**: The phenomenon where the probative value of a behavioral marker $M$ for a mental state $S$ decreases as the phylogenetic or structural distance between the observer and the subject increases, independent of changes in the complexity of $M$.

  If you see that decay happening without a change in behavioral complexity, you have spotted the phenomenon.
