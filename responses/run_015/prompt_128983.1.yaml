  ## Indistinguishability Flag

  **Pair:** Leaf 7 (`Y-Y-N-*-*`, Brittle Believer) and Leaf 1 (`N-N-N-*-*`, Stochastic Parrot).

  **Diagnosis:** This tree cannot functionally separate a system that has "Beliefs" (Q1=Yes) but fails Counterfactual Robustness (Q3=No) from a system that has "No Beliefs" (Q1=No) and fails Robustness (Q3=No).
  **Reason:** If a state is defined as a "propositional attitude" (Q1=Yes), it must, by definition, track semantics rather than syntax. If it fails Q3 (syntax changes alter conclusion despite semantic preservation), the claim Q1=Yes is operationally empty. Therefore, the `Y-N` combination on Q1/Q3 collapses into the `N-N` combination for all functional purposes.
