answer: |-
  Here is a complete, runnable design for your 75-minute workshop. It is built to be self-contained, low-tech, and focused entirely on the tension between *fitting* data and *predicting* data without using the forbidden terminology until the end.

  ### Workshop Title: The Dividend Game

  **Core Concept:** Participants are paid a cash bonus ("Dividend") for holding theories that explain past data. They must then wager on whether those same theories will predict future data. The tension arises because the Dividend makes "old data" financially valuable, but the wager reveals that "old data" does not guarantee future success.

  **Commitment:** I am committing to **one design** based on a "Theory Market" with hidden provenance.
  **Least Confident Element:** The **integrity of the "Sealed" envelopes**. If participants suspect you wrote the "Pre-Registered" theories *after* seeing the data (i.e., that the seals are fake), the lesson collapses into "the facilitator is shady." You need a robust, visible protocol to prove some theories existed before the data did. (See *Materials* for the fix).

  ---

  ### 1. Materials & Setup
  **Room:** One projector screen, one table for the "House" (you), seating for 14 participants (arranged in 4 teams of 3-4 is best for collaboration).

  **Physical Props:**
  *   **Play Money:** 4 sets of distinct colored chips or printed cash (e.g., $1,000 endowment per team).
  *   **The Data Deck:** A stack of 30 index cards. 20 say "A", 10 say "B" (or use Symbols like $\star$ and $\bullet$). *Crucial:* You must pre-determine this sequence. Do not randomize live.
      *   *Sequence 1 (Rounds 1-20):* A pattern that looks random but follows a simple rule (e.g., `A A B A A B...`).
      *   *Sequence 2 (Rounds 21-30):* Continues the *same* simple rule.
  *   **Theory Cards (4 Total):**
      *   **Cards 1 & 2 (The "Sealed" Set):** Written by you *before* the workshop. Put these in opaque envelopes. Have a volunteer sign across the seal flap at the start of the session.
      *   **Cards 3 & 4 (The "Open" Set):** Written by you *during* the game (see Timeline). These should be complex, curve-fitted rules that match Sequence 1 perfectly but fail on Sequence 2.
  *   **Betting Sheets:** One per team to record wagers.
  *   **Projector Slide:** A simple counter (1 to 30) and a place to display the drawn symbol.

  **The Payoff Scheme:**
  *   **Endowment:** Each team starts with **$1,000**.
  *   **The Dividend:** **$200** per Theory Card held that perfectly matches the first 20 rounds of data.
  *   **The Wager:** Teams bet on how many of the *next* 10 rounds each theory will predict correctly.
      *   *Payout:* $100 per correct prediction claimed.
      *   *Penalty:* If they claim a theory will get 8 right and it gets 6, they lose $200 (standard proper scoring incentive: be honest).
  *   **Prize:** The team with the most money at the end gets a tangible prize (chocolate, coffee voucher, or "Epistemic Authority" certificate).

  ---

  ### 2. Rules of Play (Handout or Slide)
  1.  **Data Phase:** The House reveals 20 symbols one by one. This is **Public History**.
  2.  **Adoption Phase:** The House offers 4 Theory Cards. You may "adopt" any or all. Cost: **$0**.
  3.  **Dividend Claim:** If your adopted theory matches the Public History perfectly, the House pays you **$200** immediately.
  4.  **Prediction Phase:** The House will reveal 10 *new* symbols. You must wager on how many each of your theories will get right.
  5.  **Settlement:** New symbols revealed. Winnings/losses tallied.

  **The Golden Rule:** Do not discuss *how* the theories were made. Do not ask the House about the history of the cards. Trade only on the math and the money.

  ---

  ### 3. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Endowment**
  *   Seat teams. Distribute $1,000 play money.
  *   **Integrity Check:** Show the 2 Sealed Envelopes. Ask a skeptical participant to sign the seal with a marker. Place them face down on the table.
  *   Explain the Payoff Scheme clearly. Emphasize the **Dividend**: "You get paid for explaining what already happened."

  **00:10 – 00:25: Data Phase 1 (The "Old" Evidence)**
  *   Project the counter. Reveal symbols 1–20 one by one.
  *   Ask teams to record the sequence.
  *   *Facilitator Note:* Keep the pace brisk (15 seconds per symbol).
  *   **Result:** A sequence that looks messy but follows a hidden simple rule (e.g., *Repeat A twice, then B once*).

  **00:25 – 00:35: Adoption & Dividend (The Trap)**
  *   Reveal Theory Cards 1–4. Read the rule on each.
      *   *Card 1 (Sealed):* Simple rule (e.g., "Pattern repeats every 3"). Fits data.
      *   *Card 2 (Sealed):* Simple rule (e.g., "Two As, One B"). Fits data.
      *   *Card 3 (Open):* Complex rule (e.g., "If round ends in 0, A, unless round is prime..."). Fits data perfectly (you wrote this *while* they were watching Phase 1).
      *   *Card 4 (Open):* Complex rule. Fits data perfectly.
  *   **Action:** Teams "adopt" cards (raise hands).
  *   **Payout:** Verify all cards fit the 20 symbols. Pay the **$200 Dividend** for every card held.
  *   *Observation:* Teams now have "House Money." They feel rich because their theories "explained" the past.

  **00:35 – 00:50: The Prediction Market**
  *   Teams must allocate their *total* wealth (Endowment + Dividends) into wagers on the **next 10 symbols**.
  *   They must write down: "We predict Card X will get [N] correct."
  *   *Constraint:* They cannot sell the cards. They must hold them through the test.
  *   *Facilitator Note:* Walk around. Listen for phrases like "This one feels safer" vs. "This one is too complicated." **Interrupt anyone** who mentions "when the theory was written." Remind them: "Trade on the data, not the story."

  **00:50 – 01:00: Data Phase 2 (The Test)**
  *   Reveal symbols 21–30.
  *   **Crucial:** These symbols *must* follow the simple rule of the Sealed Cards. The Open (Curve-Fit) Cards will fail here.
  *   Teams tally their scores. Calculate final wealth.
  *   Award the Prize.

  **01:00 – 01:15: The Debrief (Mapping the Problem)**
  *   **The Reveal:** Open the Sealed Envelopes. Show the timestamps/signatures. Admit Cards 3 & 4 were written during Phase 1.
  *   **The Discussion (No "Old Evidence" phrase yet):**
      1.  **The Dividend:** "You got paid $200 for Card 3 and Card 1 equally. Why?" (Because both fit the past data $P(E|H) = 1$).
      2.  **The Wager:** "Did you bet more on the Sealed cards? Why? The math of the past data was identical."
      3.  **The Formalism:** Now introduce the Bayes Factor.
          *   $P(E)$ was 1 (the data was already on the board).
          *   Formally, $P(H|E) = P(H)$. The data *cannot* move your belief.
          *   But you *did* trust the Sealed cards more. Why?
      4.  **The Name:** Now you can say "The Problem of Old Evidence." The game shows that *pragmatic* incentives (Dividends) and *epistemic* trust (Seals) come apart, but the standard formula treats them as identical.

  ---

  ### 4. Troubleshooting: What Will Go Wrong

  **1. The "Fake Seal" Suspicion**
  *   **Risk:** A philosophy grad student will challenge the integrity of the pre-written cards.
  *   **Fix:** The volunteer signature on the envelope flap is essential. If challenged, open the envelope immediately in the debrief. If they still doubt, acknowledge it: "In real science, we rely on pre-registration servers for this. Here, you have to trust the protocol. That trust *is* the variable."

  **2. The Open Cards Win by Chance**
  *   **Risk:** Random noise makes the Curve-Fit cards predict Phase 2 better than the Sealed ones.
  *   **Fix:** **Do not randomize Phase 2.** You are the House. You must rig the second sequence to follow the simple rule of the Sealed cards. This is a pedagogical demo, not a scientific trial. If the Sealed cards lose, the lesson fails.

  **3. Participants Ignore the Dividend**
  *   **Risk:** They treat the $200 as Monopoly money and bet randomly.
  *   **Fix:** Make the prize desirable. Also, explicitly state during the Dividend payout: "This is real profit. You can lose it in the next round." The endowment effect is powerful; remind them they are playing with *wins*.

  **4. Someone Spoils the Terminology**
  *   **Risk:** A Bayesian in the room shouts "This is the Old Evidence problem!" at minute 30.
  *   **Fix:** Establish the "Golden Rule" early. If someone breaks it, pause the game. Ask them: "Can you explain *why* without using that label?" Force them to describe the *structure* (timing of writing) rather than the *label*.

  ---

  ### 5. Limitations: What This Game Cannot Do

  You must state this explicitly in the debrief to maintain intellectual honesty.

  **The Limitation:** The game demonstrates the *psychological* and *pragmatic* difference between prediction and accommodation. It **does not** solve the formal Bayesian problem.
  *   **Why:** In the game, the "Sealed" status is *new information* (metadata about the theory). In the strict Problem of Old Evidence, the hypothesis is that the *data itself* ($E$) should confirm $H$ even if $P(E)=1$.
  *   **The Gap:** In the game, participants update on the *seal*, not just the *data*. In the pure philosophical problem, we don't have a "seal." We only have the data and the theory.
  *   **Your Line:** "This game shows why we *want* to treat old evidence differently. It does not show you how to change the Bayes Formula to allow it. That is the hard part I can't put in an envelope."

  ### 6. Why This Design? (Commitment Rationale)
  I rejected options that involved participants writing their own theories (too time-consuming, high variance in quality) or options that relied on historical cases (violates your constraint).
  This design isolates the **Dividend** as the specific mechanism that creates the tension. By paying them for "fitting the past," you make the Old Evidence *valuable*. By making them bet on the "future," you make the Old Evidence *epistemically suspect*. This forces them to feel the conflict physically (in their wallet) before they analyze it formally.

  **Final Note on the "Never Learn" Constraint:**
  I have interpreted "Participants never learn which kind they're holding" as applying to the **trading phase**. In the debrief, you *must* reveal the provenance (Sealed vs. Open) to map the game to the theory. If you never reveal it, they leave thinking it was just a random luck game. The reveal transforms it from a gamble into a lesson.
