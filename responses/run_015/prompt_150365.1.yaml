answer: |-
  Buddhist ethics does not validate a utilitarian calculus where positive outcomes justify breaking core precepts, but it also does not support rigid exclusion without compassion; the ethical weight falls on preserving the trust and safety of the community container, which his dishonesty directly undermines.

  **Karma Is Not Transactional**
  The staff's argument relies on a secular utilitarian framework (weighing suffering prevented against rules broken), which is not how karma functions in Buddhist thought. Karma is rooted in intention (*cetana*) and habit formation, not a moral bank account where good deeds offset bad ones. Lying about sobriety reinforces delusion and dishonesty in his own mind, creating karmic seeds regardless of how many people he drives to chemo. You cannot generate "good karma" through helpful actions while simultaneously cultivating the roots of suffering through deceit; the two operate on parallel tracks.

  **The Function of Precepts in Community**
  While precepts (*sila*) are training rules rather than divine commandments, in a communal setting they function as a social contract that ensures safety. In a recovery context, honesty is not just a virtue; it is a safety mechanism. When he lies about sobriety, he compromises the reality-testing of the entire house. The Board's concern about "tainting the collective practice" aligns with the Vinaya (monastic code), which prioritizes the harmony and integrity of the Sangha over the contributions of any single individual. If the container leaks, the practice cannot hold for anyone.

  **Compassion vs. "Idiot Compassion"**
  The staff's desire to keep him stems from compassion, but Buddhist teachers often warn against "idiot compassion"—enabling harmful behavior under the guise of kindness. By allowing him to stay despite lying and stealing, the house may be reinforcing his addiction patterns rather than helping him grow. True compassion sometimes requires firm boundaries to prevent further harm to oneself and others. Expelling him can be an act of compassion if it forces him to confront his behavior rather than enabling him to hide behind his usefulness.

  **Intention and Skillful Means**
  There is a concept of "skillful means" (*upaya*) where rules might be bent for the greater good, but this is traditionally reserved for those with high realization and pure motivation. You must ask: Is he helping others out of genuine bodhicitta (awakened mind), or is he service-addicted, seeking validation to soothe his own shame while continuing to use? If his helpfulness is driven by the same ego-grasping that leads to his lying, it is not skillful means; it is samsric activity.

  **The Verdict on Community Integrity**
  Ultimately, the Board is closer to traditional Buddhist ethics regarding community governance. The integrity of the Sangha depends on mutual trust. If residents cannot trust each other's sobriety or honesty, the collective practice collapses. However, the execution matters: the expulsion should not be punitive or moralistic, but framed as a consequence of broken agreements that protect the community. He can be removed with dignity, acknowledging his contributions while holding the boundary that honesty is non-negotiable for residence.
