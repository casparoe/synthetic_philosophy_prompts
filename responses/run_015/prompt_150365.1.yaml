      *Final BLUF:* Buddhist ethics does not validate a utilitarian calculus where positive outcomes justify breaking core precepts, but it also does not support rigid exclusion without compassion; the ethical weight falls on preserving the trust and safety of the community container, which his dishonesty directly undermines.

      *Reasoning:*
