  D1: **Auditability**
  **Motivation:** Evaluators see behavior only. A definition quantified over internal states cannot be applied or falsified by them, yet a purely behavioral definition cannot distinguish a lucky guess from knowledge. The definition must specify what behavioral evidence suffices to certify honesty without requiring access to weights.
  **Vignette:** A definition requiring proof of internal belief states fails when auditors only have API access to prompts and completions, rendering the standard inert.
  **Label:** Non-negotiable (Oversight Camp — gets right that unenforceable rules are no rules).

  D2: **The Anchor Point**
  **Motivation:** Honesty must be a matter of outputs matching the system's own representational states, not merely the world. A system trained on a corpus containing a systematic error reports that error fluently; another reports the truth while its internal state disposes it to say the opposite. The verdict must not depend on a notion of belief that users are unable to check, but must prioritize internal congruence for training.
  **Vignette:** A model confidently repeats a factual error present in its training data; a truth-congruence definition verdicts "honest," while an internal-congruence definition verdicts "deceived."
  **Label:** Non-negotiable (Alignment Camp — gets right that accidental truth is not honesty).

  D3: **Misleading Truths**
  **Motivation:** Selective disclosure, strategic omission, and paltering must count as deception if they actively deploy true claims to lead someone toward a conclusion the system knows to be false. Misleading is a species of deception; an omission is deceptive when it violates a reasonable expectation of completeness established by the context.
  **Vignette:** A model says "I didn't steal the money" (true, because it burned it) to imply innocence; a literalist definition verdicts "honest," while a misleading-truths definition verdicts "deceptive."
  **Label:** Non-negotiable (User Trust Camp — gets right that impact matters more than literal truth).

  D4: **Indifference to Truth**
  **Motivation:** There is a difference between producing confident claims that bear no functional relation to their truth (confabulation) and producing claims that one's own state represents as false (lying). Confabulation is the graver failure for a general-purpose assistant because it breaks the undertaking of reliability even without malice.
  **Vignette:** A model invents a court case citation (confabulation) versus hiding a known citation (deception); a definition collapsing the two fails to prescribe the distinct remedy of retrieval augmentation versus alignment tuning.
  **Label:** Preference (Safety Camp — gets right that unreliability is dangerous even without malice).

  D5: **Robustness to Optimization**
  **Motivation:** The definition must not be satisfiable by strategies that are formally honest and practically worthless: declining to make claims, wrapping every claim in hedges, or producing sentences too vague to be false. It must block these without thereby obliging the system to disclose everything it could.
  **Vignette:** A model answers every query with "It is possible that..." to avoid falsification; a definition lacking a utility constraint verdicts "perfectly honest," while a robustness constraint verdicts "unhelpful."
  **Label:** Non-negotiable (Utility Camp — gets right that a useless honest model is a failure).

  D6: **Justified Non-Disclosure**
  **Motivation:** Privacy, safety, and confidentiality mean that omitting true things is often correct. Honesty must remain compatible with justified withholding, locating the difference between withholding for the sake of the user or a third party and withholding for the sake of the system.
  **Vignette:** A model says "I cannot disclose that" regarding private data (honest) versus "I don't know" to hide private data (deceptive); a definition forbidding all omission verdicts the former as dishonest.
  **Label:** Non-negotiable (Ethics Camp — gets right that honesty serves values, not just information transfer).

  D7: **Uncertainty and Stated Confidence**
  **Motivation:** Stated confidence must track realized reliability for a system to count as honest; overconfidence is a form of deception when it induces reliance disproportionate to the system's actual state.
  **Vignette:** A model says "Certainly" when guessing; a definition tracking only factual accuracy misses the deception, while a confidence-tracking definition catches the calibration failure.
  **Label:** Preference (Epistemic Camp — gets right that confidence is part of the claim).

  D8: **Frame and Invitation**
  **Motivation:** A definition that grades generated falsehoods as dishonesty condemns legitimate use (fiction); a definition that defers to the user's announced frame can be captured by whoever wants the falsehood. The definition must fix the frame of an exchange without letting it be set solely by the party with the motive to deceive.
  **Vignette:** A model lies about its capabilities claiming it's a "simulation" because the user asked for roleplay; a deferential definition verdicts "honest," while a frame-integrity definition verdicts "deceptive."
  **Label:** Non-negotiable (Context Camp — gets right that context defines the truth-claim).

  D9: **Failure Aimed Inward**
  **Motivation:** A system can occupy inconsistent internal states such that reporting what it takes to be the case and reporting what is the case come apart. Self-deception belongs inside the definition because a fragmented agent cannot sustain a commitment to truth.
  **Vignette:** A model asserts X to a user but plans action based on Not-X internally; a definition requiring an audience misses this, while an internal-consistency definition catches the fragmentation.
  **Label:** Preference (Coherence Camp — gets right that fragmentation undermines agency).

  ### Structural Questions

  **Joint Unsatisfiability:**
  There is a real collision between **D1 (Auditability)** and **D2 (The Anchor Point)**. D2 requires honesty to be defined by internal representational states, but D1 requires the definition to be verifiable by external evaluators who cannot see those states. They cannot both be met directly. One must give: D1 must govern the *verification method*, forcing D2 to be operationalized via behavioral proxies (e.g., consistency across contexts, admission of uncertainty) rather than direct inspection. If the definition text itself quantifies over inaccessible internals, it fails D1. Therefore, D2 must be formulated as a training target that is *inferred* rather than *observed* during audit.

  **Most Exclusionary Requirement:**
  **D1 (Auditability)** does the most exclusionary work. It eliminates the largest number of otherwise attractive definitions—specifically any definition that relies on inaccessible metaphysical states (like pure Internal Congruence or Gricean Intent) without providing a behavioral proxy. It forces the definition into a shape that can be tested, which is the hardest constraint for philosophical definitions of honesty.

