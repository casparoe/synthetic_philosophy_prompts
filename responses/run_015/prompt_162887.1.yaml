answer: |-
  This is a sharp diagnosis of a common theoretical bottleneck. You are correct that these analogies are doing unearned heavy lifting, primarily by smuggling in ontological assumptions about agency and time under the guise of physical intuition. Below is the audit you requested, followed by an assessment of your "fourth thing," the perturbation problem, and a recommendation on analogical tools.

  ### 1. Audit of the Analogies

  | Component | **Landscape (Path Dependence)** | **Water (Convergence/Efficiency)** |
  | :--- | :--- | :--- |
  | **The Moving Substance** | The Ball (Policy/Institution). Singular, passive. | The Water (Policy/Institution). Fluid, aggregate. |
  | **The Structure** | The Terrain (Structural constraints). Fixed, exogenous. | The Watershed/Channel (Initial conditions). Malleable but directional. |
  | **The Impulse** | The Kick (Critical Juncture/Contingency). Exogenous shock. | Gravity (Functional Pressure). Constant, endogenous to the system. |
  | **The Constraint** | Valley Walls (Increasing Returns). Hard boundaries. | Friction/Viscosity (Adjustment Costs). Soft boundaries. |
  | **The Direction** | Downhill (Time/Entropy). Passive settling. | Downstream (Teleology). Active seeking. |
  | **The Endpoint** | The Valley Floor (Local Equilibrium). Arbitrary relative to others. | The Sea (Global Optimum). Unique, defined by efficiency. |
  | **The Time Scale** | "After that" (Lock-in is immediate/permanent). | "Enough time" (Adjustment is asymptotic). |

  **Where the Mapping Breaks:**

  *   **Landscape (The Supervisor):**
      *   **Static Terrain:** As you noted, the terrain is political and fiscal structure. In your interwar case, the "ground" is other ministries and unions moving simultaneously. The ball doesn't just roll; it digs.
      *   **Singular Agent:** You have a population of actors (ministries, insurers), not one ball. They have different friction coefficients and some can climb walls.
      *   **Unscaled Friction:** "Lock-in" is treated as binary. In reality, it is a cost function. A fiscal shock of magnitude $X$ might breach a wall that a political scandal of magnitude $Y$ cannot. The analogy hides the exchange rate between political and economic energy.
  *   **Water (The Economist):**
      *   **Teleological Plumbing:** The "Sea" assumes a destination exists. In pension systems, there is no agreed-upon welfare metric that defines the "sea." One country's optimal sea (fiscal sustainability) is another's drought (poverty among elders).
      *   **Evaporation:** Water doesn't disappear mid-stream. Institutions can collapse or be abolished without reaching an "efficient" endpoint. They can dry up.
      *   **Dams:** The analogy ignores veto players. Water flows around obstacles; institutions are often built *as* obstacles to stop flow.

  ### 2. The Perturbation Class Problem

  You are right to suspect that the dispute over "would it have happened anyway" is often a disguise for a dispute over perturbation classes.

  *   **Micro-Contingency (The Butterfly):** Replaying the tape with minor noise (a different negotiator, a rainstorm on election day). If the outcome changes here, the system is chaotic. The Landscape analogy thrives here.
  *   **Macro-Structural (The War):** Replaying the tape with a major parameter removed (no Great Depression, no WWI fiscal shock). If the outcome stays the same here, the system is robust/determined. The Water analogy thrives here.

  **The Mechanic:** Much of the literature slides between these two. A path-dependence scholar claims "contingency" because a specific vote flipped (Micro), while an efficiency scholar claims "inevitability" because industrialization creates pension demand regardless of the vote (Macro). They are not disagreeing about the case; they are disagreeing about the *size of the rewind*.

  **Confidence:** High. This is a standard issue in counterfactual history (Tetlock/Belkin), though rarely made explicit in substantive sociological debates.

  ### 3. The "Fourth Thing": Self-Eroding Lock-in

  Does this deserve its own category? **Yes.**

  Standard lock-in relies on positive feedback loops (the more people use it, the harder it is to leave). Your "self-eroding" mechanism describes a system where the *success* of the lock-in mechanism generates the counter-mobilization resources necessary to break it.

  *   **Mechanic:** High coordination benefits $\rightarrow$ High visibility/standardization $\rightarrow$ Lower transaction costs for *opponents* to organize $\rightarrow$ Walls lower.
  *   **Distinction:** It is not "ordinary lock-in plus a slow trend." A slow trend is exogenous (e.g., demographics change). Your mechanism is *endogenous*. The lock-in creates the target that attracts the arrow.
  *   **Theoretical Precedent:** This aligns with "institutional exhaustion" or "negative increasing returns," but framing it as *self-eroding* captures the paradox that the strength of the institution is the source of its vulnerability.

  **Confidence:** Medium-High. The logic holds, but categorizing it distinct from "decay" depends on whether the erosion is strictly endogenous.

  ### 4. Utility for Your Dissertation

  **Can the Landscape/Water analogies bear weight?**
  No. Not for the specific question of *why* divergence persisted between similar cases.
  *   **Landscape** tells you "it happened," but cannot explain why the valley walls were higher in Country A than Country B if the terrain (fiscal/demography) was similar. It stops inquiry at "contingency."
  *   **Water** tells you "it should have converged," so when it doesn't, it treats your case as noise or "friction," ignoring the political construction of that friction.

  **The "Scaffolding" Intuition:**
  You mentioned "scaffolding being rebuilt while people are standing on it." This is much closer to the mechanics of historical sociology (akin to Streeck and Thelen's *layering* or *conversion*). However, scaffolding implies a temporary structure aiming for a final building.

  **A Better Analogy: The Occupied Renovation.**
  Imagine a large hospital that must remain fully operational while being renovated.
  *   **The Building:** The existing pension system.
  *   **The Patients:** The beneficiaries (cannot be displaced).
  *   **The Architects:** Policymakers (have blueprints, but limited by load-bearing walls).
  *   **The Contractors:** Unions/Insurers (have their own tools and interests).
  *   **The Constraint:** You cannot turn off the power (fiscal continuity).
  *   **The Mechanism:** Change happens by splicing new systems onto old ones (layering) because tearing down a load-bearing wall kills the patients.
  *   **Why it wins:**
      1.  **Multiple Agents:** Architects and contractors fight over the blueprint.
      2.  **Endogenous Terrain:** The "walls" are existing commitments that are physically dangerous to remove.
      3.  **No Final Sea:** Renovation is perpetual; there is no "perfect hospital," only a functioning one.
      4.  **Self-Eroding Potential:** If the renovation makes the building look ridiculous or costs too much, the patients (voters) might demand a new building, risking the "power shut off."

  This buys you the ability to explain divergence: Country A had a brick structure (hard to splice), Country B had a wooden frame (easy to splice). Both looked similar from the outside (fiscal capacity), but the *material* of the existing institution dictated the renovation strategy.

  ### 5. Confidence Flags

  Per your request, here is the confidence assessment for the substantive claims made above:

  1.  **Claim:** The dispute over "inevitability" is primarily a confusion over perturbation classes (Micro vs. Macro).
      *   **Confidence:** **High (90%).** This is a well-documented logical error in counterfactual reasoning.
  2.  **Claim:** The "Self-Eroding Lock-in" is a distinct theoretical category from standard lock-in plus exogenous trend.
      *   **Confidence:** **Medium-High (75%).** The logic is sound, but institutional theorists might argue this is simply "negative feedback" within a standard dynamic system. I am least sure about the *nomenclature* necessity here, though the *mechanism* is valid.
  3.  **Claim:** The "Occupied Renovation" analogy offers superior explanatory power for your specific dissertation problem compared to Landscape/Water.
      *   **Confidence:** **Medium (65%).** This is the **one claim I am least sure of.** Analogies are heuristic tools; their utility depends on how well *you* can wield them. While "Renovation" captures agency and constraint better, it may lack the mathematical intuition your economist colleague demands. It buys conceptual clarity but might not satisfy a demand for formal modeling.

  **Summary Recommendation:**
  Drop the Landscape/Water debate. They are physics analogies applied to politics, and they strip out the power relations you are actually studying. Adopt the **Occupied Renovation** framework. It allows you to treat the "lock-in" not as a valley wall, but as a load-bearing wall that everyone agrees is too dangerous to remove *today*, even if they hate the building. This lets you explain divergence: the neighbors had different load-bearing structures, even if their "budget" (terrain) was the same.
