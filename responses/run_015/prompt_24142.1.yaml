  He will call this programme degenerating.

  Two candidate rules are consistent with his track record. The first rule (Strict Lakatosian) holds that a programme is progressive only if it anticipates novel facts unreachable by rivals, maintains internal coherence, and leads on confirmed predictions; the second rule (Empiricist Balance) holds that a programme is progressive if it leads on confirmed predictions and maintains internal coherence, regardless of novelty. For the new case, the Strict Lakatosian rule predicts a degenerating verdict because the programme lacks novel anticipation, while the Empiricist Balance rule predicts a progressive verdict because the programme is ahead on confirmed data and internally consistent.

  My best guess is that he will apply the Strict Lakatosian rule because his self-description as a "strict Lakatosian" commits him to Lakatos's specific demarcation criterion: theoretical progress requires excess empirical content (novel facts), not merely the elegant accommodation of known data. Since the rival is the one producing new confirmed predictions, the rival holds the progressive shift, rendering this programme degenerating despite its current tally of old confirmations. The single further case that would best tell these rules apart is a programme that is currently behind its rival on the balance of confirmed predictions and requires some ad hoc adjustments, yet successfully anticipates a striking novel fact that the leading rival cannot explain.
