  Subject: Re: The neuroscience bet

  Hey, I've been thinking about your roommate's seminar case and the ten dollars you have riding on it. Based on the track record you've sent over, my prediction is that she is going to call the stimulation trials not free. I know the subjects report feeling spontaneous and even claim they would have moved anyway, but looking at the pattern of her past verdicts, I think she prioritizes the physical origin of the action over the subjective experience or the counterfactual outcome. To explain why, I have identified two implicit rules that both fit every single example you gave me, but they diverge sharply on this new Libet-style experiment.

  The first rule is what I'd call the Causal Origin Principle. Under this rule, an action is only free if the immediate causal chain initiating the movement is endogenous to the agent's normal psychological and neural functioning. If the trigger is an external artifact like an electrode or hypnosis, or a pathological lesion like a tumor, the action is not free, regardless of how voluntary it feels to the person. This fits all her prior cases perfectly. The tea choice is endogenous preference, so it is free. The scalpel catch is endogenous skill, so it is free. The motor cortex electrode, the SMA electrode, the tumor, and the hypnosis are all exogenous or pathological intrusions, so they are not free. The alcoholic is the tricky one, but under this rule, addiction is viewed as an integrated part of the agent's psychological history rather than an alien intrusion like a tumor or a probe, so it counts as free. If she is running this rule, she will verdict the new stimulation trials as not free because the readiness potential was artificially triggered by the experimenters, making the cause exogenous.

  The second rule is the Trajectory Consistency Principle. This rule suggests that an action is not free only if the intervention causes the agent to deviate from what they would have naturally done otherwise. If the action aligns with the agent's prior behavioral trajectory or inevitable choice, freedom is preserved. This also fits all the earlier data. The tea and scalpel cases align with natural preferences and training. The motor cortex case forces a movement that wouldn't happen naturally. The SMA urge and tumor urges create impulses the patient wouldn't have had otherwise. The hypnosis creates a suggestion the subject wouldn't have followed normally. The alcoholic relapse is consistent with the trajectory of his addiction, so it remains free. If she is running this rule, she will verdict the new stimulation trials as free because a fair number of subjects reported they would have moved right around then anyway, meaning the stimulation did not alter the natural trajectory of their behavior, only perhaps the precise timing.

  Despite both rules fitting the past data, I am betting my own ten dollars on the first rule, the Causal Origin Principle, meaning I think she will say the subjects are not free. The deciding factor for me is the case of the patient with the electrode near the supplementary motor area. You mentioned she said that case was not free even though the patient acted on the urge and reported it felt like any other want she had ever experienced. That verdict shows she is willing to override the subject's phenomenological report and even the apparent alignment with normal wanting when an external device is the cause. In the new experiment, the subjects saying it felt spontaneous is analogous to the SMA patient saying it felt like a normal want, and their claim that they would have moved anyway is just a post-hoc rationalization similar to that feeling of normalcy. Since she is a neuroscience grad student, I suspect she cares more about the mechanistic integrity of the decision-making process than the counterfactual outcome, so the presence of the stimulation itself will be the dealbreaker for her.

  To actually split these two rules apart in a future scenario, you would need a case where the causal origin is clearly external but the trajectory is perfectly preserved without any room for doubt. Imagine a patient with a brain-computer interface designed to help with paralysis that monitors their motor cortex and fires the muscles for them only when it detects a natural motor command that is too weak to move the limb on its own. The device never initiates a move the patient didn't already intend, and it never prevents a move the patient did intend, effectively substituting the final neural signal with an artificial one without changing the outcome or the feeling of agency. The Causal Origin Principle would verdict this as not free because the muscle activation is externally caused by the device. The Trajectory Consistency Principle would verdict this as free because the patient did exactly what they would have done without the device, just more effectively. That kind of perfect substitution case would force her to choose between caring about where the signal came from versus whether the action was truly hers in terms of outcome. Hope you win the dinner bet.
