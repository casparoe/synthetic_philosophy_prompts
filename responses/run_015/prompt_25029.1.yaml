answer: |-
  **MEMORANDUM**

  **TO:** Dr. Elena Rossi, Medical Director, University Fertility Clinic
  **FROM:** Ethics Advisory Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal for Polygenic Embryo Screening (Non-Disease Traits)

  **RECOMMENDATION**

  The Ethics Advisory Board recommends **approval of the pilot program with specific, mandatory conditions.** We cannot endorse the proposal as currently drafted, but we believe a blanket rejection would fail to acknowledge the legitimate reproductive autonomy interests at stake. Instead, we recommend proceeding only if the clinic implements the three conditions outlined below regarding clinical validity, counseling protocols, and data transparency.

  **ETHICAL ANALYSIS**

  The Board's deliberation centered on three competing ethical frameworks: reproductive autonomy, the nature of the parent-child relationship, and distributive justice. The Medical Director's argument rests on a principle of consistency: if we permit selection against devastating monogenic diseases, prohibiting selection for non-disease traits (educational attainment, height) is paternalistic. It assumes parents are the best judges of their future child's welfare and that more information is inherently empowering.

  We find this autonomy argument compelling in the abstract. Parents routinely make consequential decisions affecting their children's genetic makeup (e.g., partner selection) and environment (e.g., schooling, nutrition). To block access to probabilistic information at the embryo stage suggests a distrust of parental judgment that is inconsistent with our broader respect for reproductive liberty.

  However, autonomy is not absolute; it is constrained by the requirement of *informed* consent and the obligation to avoid harm. This is where the proposal, as originally submitted, fails.

  **1. The Justice and Validity Constraint (The Primary Condition)**
  The most significant ethical barrier is not philosophical but epidemiological. The polygenic scores (PGS) for education and height were developed primarily on European-ancestry populations. Their predictive validity drops substantially for patients of African, Asian, and Hispanic ancestry.

  Offering a medical test with known disparate efficacy violates principles of health justice. If we offer these scores to all patients, we are effectively offering a higher standard of "informational care" to white patients than to non-white patients. For non-European patients, the scores are not merely less accurate; they are potentially misleading. Relying on a score with low predictive validity could lead a patient to discard a viable embryo based on false negative data.

  Therefore, autonomy cannot be invoked to justify offering a clinically invalid tool. You cannot have informed consent when the information provided is structurally biased. This is not paternalism; it is fidelity to the standard of care.

  **2. The Parental Attitude and Expressive Harm**
  The second major objection concerns the "parental attitude." Critics on the Board argued that selecting embryos for trait enhancement expresses a corrosive view of the child: that they are products to be optimized rather than gifts to be accepted. This aligns with Michael Sandel's argument that genetic engineering risks replacing "openness to the unbidden" with a drive for mastery.

  The Medical Director's reliance on the **Non-Identity Problem** (i.e., the child selected cannot claim harm because they would not otherwise exist) attempts to dissolve this worry. While logically sound regarding individual harm, this reasoning is morally insufficient for institutional policy. The Non-Identity Problem addresses harm to the *child*, but it ignores harm to the *practice of medicine* and the *social fabric*.

  Even if Embryo A is not harmed by being selected over Embryo B, the clinic's endorsement of trait-ranking normalizes the idea that a child's value is correlated with their predicted socioeconomic status or physical stature. This creates an "expressive harm"—it signals that the institution values certain traits over others in a way that reinforces existing social hierarchies. We are not merely facilitating a private choice; we are legitimizing a metric of human worth.

  However, a ban is too blunt an instrument to address this. The concern is not the selection itself, but the *meaning* ascribed to it. If the clinic frames these scores not as "quality ratings" but as "probabilistic health data," we can mitigate the expressive harm without violating autonomy.

  **3. Engaging the Strongest Counter-Argument**
  The strongest argument against our conditional approval comes from the justice camp within the Board. They argue that restricting these scores based on ancestry (Condition 1) creates a two-tiered system that is itself discriminatory. They contend that offering the service to *some* groups while withholding it from others highlights inequity rather than solving it.

  We acknowledge this tension. However, providing invalid data is ethically worse than providing no data. Withholding a test due to lack of validity is a standard medical practice (e.g., we do not offer certain genetic carrier screens to populations where the mutation frequency is unknown). To offer the test to non-European patients would be to treat them as subjects for experimentation without their explicit consent. Therefore, the restriction is not an exclusionary practice, but a protective one. It prioritizes non-maleficence over equal access to a flawed product.

  **IMPLEMENTATION CONDITIONS**

  To move forward, the clinic must adopt the following protocols. Failure to adhere to these will result in an immediate suspension of the pilot.

  1.  **Ancestry-Based Validity Restriction:** Polygenic scores for non-disease traits may **not** be reported to patients of non-European ancestry. Patients must be screened for genetic ancestry prior to scoring. If a patient does not meet the ancestry threshold for statistical validity, the report must state that the scores are unavailable due to insufficient predictive validity, not simply withheld. This must be framed as a limitation of current science, not a policy exclusion.
  2.  **Mandatory "Open Future" Counseling:** Patients eligible for screening must undergo a dedicated counseling session distinct from standard IVF consent. This session must:
      *   Explicitly state that polygenic scores are probabilistic, not deterministic (e.g., a high education score does not guarantee academic success).
      *   Discuss the concept of the "open future," emphasizing that the selected traits are marginal factors compared to post-natal environment and opportunity.
      *   Prohibit clinicians from using ranking language (e.g., "best embryo"). Embryos must be presented as "viable options with varying probabilistic profiles."
  3.  **Outcomes and Equity Monitoring:** The clinic must collect anonymized data on which embryos are selected and why. The Ethics Board will review this data annually to assess whether the pilot is reinforcing socioeconomic or racial biases in patient selection. If the data shows the technology is exacerbating disparities in care outcomes, the pilot will be terminated.

  **BOTTOM LINE**

  The Board authorizes the pilot **only if** the clinic implements the Ancestry-Based Validity Restriction and the Mandatory "Open Future" Counseling protocol immediately. We cannot approve the distribution of scientifically biased data, nor can we allow the clinical framing to suggest that a child's worth is reducible to a polygenic score. If the clinic cannot operationally support these conditions, the proposal should be withdrawn.

  **Signed,**

  **Prof. J. Aris Thorne**
  **Chair, Ethics Advisory Board**
