answer: |-
  ### The Decision Problem: Procurement of a Legacy System

  **Context:** You must decide whether to **Adopt** a new software system or **Reject** it (stay with the status quo).
  **States of the World:** The system is either **Compatible (C)** or **Incompatible (I)** with your infrastructure.
  **Priors:** $P(C) = 0.5$, $P(I) = 0.5$.
  **Payoffs:**
  *   Adopt + Compatible: $+\$120$
  *   Adopt + Incompatible: $-\$100$
  *   Reject (any state): $\$0$
  **Signal:** A technical pilot test yielding **Positive (+)** or **Negative (-)**.
  **Likelihoods:**
  *   $P(+|C) = 0.9$
  *   $P(+|I) = 0.1$
  **Signal Probability:** $P(+) = 0.5(0.9) + 0.5(0.1) = 0.5$.
  **Posteriors:**
  *   $P(C|+) = 0.9$ (Strong belief in success)
  *   $P(C|-) = 0.1$ (Strong belief in failure)

  ---

  ### Version 1: The Worthless Signal (EVI = 0)
  **Structural Feature:** **Non-Contingent Commitment.**
  You are required to sign the procurement contract *before* the pilot test results are released. You receive the test results afterwards, updating your beliefs, but you are legally bound to the decision made prior to receipt.

  **Calculations:**
  1.  **Expected Utility Without Signal:**
      *   $EU(\text{Adopt}) = 0.5(120) + 0.5(-100) = \$10$
      *   $EU(\text{Reject}) = \$0$
      *   **Optimal Action:** Adopt. **Baseline EU:** $\$10$.
  2.  **Expected Utility With Signal:**
      *   You have already committed to **Adopt**. The signal cannot change this action.
      *   If Signal is **+**: Belief shifts to $P(C)=0.9$. You still Adopt. Realized EV = $0.9(120) + 0.1(-100) = \$98$.
      *   If Signal is **-**: Belief shifts to $P(C)=0.1$. You still Adopt. Realized EV = $0.1(120) + 0.9(-100) = -\$78$.
      *   $E[\text{EU}|\text{Signal}] = 0.5(98) + 0.5(-78) = \$10$.
  3.  **Value of Information:** $\$10 - \$10 = \mathbf{0}$.

  **Result:** Your credence moved from 50% to 90% (or 10%), a massive informational shift. Yet, the signal was worth exactly zero because it could not alter the action.

  ---

  ### Version 2: The Valuable Signal (EVI > 0)
  **Structural Feature:** **Contingent Decision.**
  You are permitted to wait for the pilot test results *before* signing the contract. You can choose to Adopt if the test is Positive and Reject if the test is Negative.

  **Calculations:**
  1.  **Expected Utility Without Signal:**
      *   Same as Version 1. **Baseline EU:** $\$10$ (Adopt).
  2.  **Expected Utility With Signal:**
      *   If Signal is **+**: $EU(\text{Adopt}) = \$98$, $EU(\text{Reject}) = \$0$. **Choose Adopt.**
      *   If Signal is **-**: $EU(\text{Adopt}) = -\$78$, $EU(\text{Reject}) = \$0$. **Choose Reject.**
      *   $E[\text{EU}|\text{Signal}] = 0.5(98) + 0.5(0) = \$49$.
  3.  **Value of Information:** $\$49 - \$10 = \mathbf{\$39}$.

  **Result:** The priors, likelihoods, and payoffs are identical to Version 1. The belief update is identical. But because the decision structure allows the action to *condition* on the signal, the value is strictly positive.

  ---

  ### The Structural Feature: Decision Contingency

  The feature carrying the case is **Decision Contingency** (the ability to map actions to signal realizations).

  In Version 1, the strategy space is restricted to constant functions (Always Adopt/Never Adopt). In Version 2, the strategy space includes conditional functions (Adopt if +, Reject if -). Good's Theorem guarantees that information has non-negative value *only if* the agent can optimize their action conditional on that information. When institutional rigidity (pre-commitment) decouples the belief update from the action choice, informativeness does not translate to value.

  **What happens to Version 2 without it?**
  If you remove Decision Contingency from Version 2 (forcing pre-commitment), it collapses into Version 1. The potential gain of $\$39$ vanishes because you lose the option to avoid the $-\$78$ loss in the Negative Signal state.

  ### Defense of the Worthless Signal (Version 1)

  **The Defense:** "Even if the report didn't change the contract, it has **epistemic value** and **accountability value**. We now *know* the system was likely incompatible (if the signal was Negative). This justifies the failure to stakeholders ex-post. Furthermore, this information informs *future* procurement cycles; we are building an institutional knowledge base. Commissioning the study was due diligence."

  **The Reply:** "Epistemic value is a luxury when budgets are constrained. If the report could not prevent the loss, it failed its instrumental purpose. Regarding 'future cycles': if you commission a study for *this* decision that arrives too late to change *this* decision, you have paid a premium to learn a lesson you could have learned cheaper by monitoring the outcome of the implementation itself. Accountability is achieved by documenting the decision rationale ex-ante, not by purchasing hindsight. In policy, information that cannot change a choice is consumption, not investment."

  ---

  ### The Third Version: Can Information Have Negative Value?

  **Is a third version available?**
  **No.** Under the strict assumptions provided (private, free information; agent updates by conditionalization; agent maximizes expected utility), the expected value of information cannot be strictly negative. This is the core conclusion of Good's Theorem (1967). An expected utility maximizer can always choose to ignore the information and act as if they hadn't received it, guaranteeing a baseline equal to the "no information" case. Therefore, $EVI \ge 0$.

  **Which assumption has to be given up?**
  To construct a scenario where private, free information has strictly negative value, you must drop the assumption of **Expected Utility Maximization** (specifically, the independence of preferences from belief states).

  **What conceding it costs:**
  You must admit that the agent suffers from **Information Aversion** or **Anticipatory Utility**. For example, an agent might derive direct disutility from anxiety caused by the signal (e.g., a medical diagnosis that cannot be treated). If the signal induces psychological distress that lowers total utility, the agent would rationally pay to avoid it.
  *Alternatively*, you could drop the **Privacy** assumption. In a **Game Theoretic** context, if acquiring information is observed by an adversary (e.g., commissioning a study signals weakness or uncertainty), the strategic reaction of the opponent can make the information net-negative. However, this concedes that the value of information depends on *who knows you know*, moving beyond single-agent decision theory into strategic signaling. For policy staff, this implies that "private" studies are theoretically safe, but "public" commissions carry strategic risk.
