      *   **Consequence:** If you try to model the substrate, you either get paradox or regress (pushing the level back).
      *   **Goal:** Identify what would count *against* this thesis (defeaters).
      *   **Specific Interest:** Self-amending logics, distributed representations, cases where "paper" is incorporated without paradox.
