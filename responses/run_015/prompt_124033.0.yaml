  Let's assemble the response.

  *   **Thesis 1:** Instrumental Efficiency (Trivial).
  *   **Thesis 2:** Psychological Feasibility (Humean).
  *   **Thesis 3:** Democratic Self-Determination (Legitimacy).
  *   **Thesis 4:** Reciprocity/Cooperative Scheme (Scope of Justice).
  *   **Thesis 5:** Strong Associative Duties (Agent-Relative).
  *   **Thesis 6:** Property/Entitlement (Lockean/Nozickian).

  *   **Diagnosis:** Usually a conflation of 4 and 5, masquerading as 1.
