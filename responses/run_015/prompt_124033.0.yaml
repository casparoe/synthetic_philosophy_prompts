answer: |-
  In the context of global justice seminars, the proverb "charity begins at home" functions as a rhetorical shibboleth. It conflates distinct philosophical arguments regarding partiality, efficiency, and the nature of the state. To prevent it from halting inquiry prematurely, we must disaggregate the slogan into its constituent logical claims.

  Below is a menu of six distinct theses the slogan might express, analyzed according to your criteria.

  ### I. The Menu of Theses

  **1. The Instrumental Efficiency Thesis**
  *   **Claim:** Agents and states are causally better positioned to alleviate suffering among those geographically or institutionally proximate; therefore, prioritizing local aid maximizes the utility of resources before extending outward.
  *   **(i) Category:** Efficacy of institutional delivery.
  *   **(ii) Status:** A trivial empirical generalization (often false in the age of global finance/NGOs, but generally defensible as a heuristic).
  *   **(iii) Implication:** **Compatible with cosmopolitanism.** This is a claim about *means*, not *ends*. It supports a "first steps" approach but denies no obligation to distant strangers once local capacity is saturated or if distant intervention is more cost-effective (e.g., bed nets vs. local housing).

  **2. The Psychological Feasibility Thesis**
  *   **Claim:** Human moral motivation is naturally concentric; demanding impartial global concern undermines the psychological substrates of altruism. We must cultivate virtue locally to sustain the capacity for broader concern.
  *   **(i) Category:** Psychology of motivation.
  *   **(ii) Status:** A defensible but limited principle of practical reason (Humean/Smithian).
  *   **(iii) Implication:** **Compatible with cosmopolitanism.** It treats national priority as a pedagogical or developmental stage, not a moral boundary. It argues for *sequencing*, not *exclusion*.

  **3. The Democratic Legitimacy Thesis**
  *   **Claim:** State resources are the product of a specific political community's collective labor and taxation; therefore, the democratic electorate possesses the exclusive right to determine the distribution of those funds. External obligations cannot override internal democratic authorization.
  *   **(i) Category:** Normative legitimacy of state partiality.
  *   **(ii) Status:** A substantive philosophical commitment (defensible by liberal nationalists like Miller, contested by cosmopolitans).
  *   **(iii) Implication:** **Supports nationalist conclusion.** It posits that procedural legitimacy (democratic will) trumps substantive distributive justice across borders. It grants compatriots special agent-relative claims based on political authorship.

  **4. The Reciprocity/Cooperative Scheme Thesis**
  *   **Claim:** Principles of distributive justice apply only within a closed cooperative scheme where participants contribute to and benefit from a shared basic structure. Since the global order lacks this depth of cooperation, "justice" (as opposed to "humanitarianism") stops at the border.
  *   **(i) Category:** Scope of moral obligation (specifically, the trigger for justice).
  *   **(ii) Status:** A substantive philosophical commitment (Rawlsian *domestic* focus). Often criticized as empirically false regarding the global basic structure.
  *   **(iii) Implication:** **Supports nationalist conclusion.** It treats the state as a node of mutual advantage rather than a participant in global injustice. It reclassifies obligations to non-citizens as discretionary charity rather than stringent justice.

  **5. The Strong Associative Duty Thesis**
  *   **Claim:** Shared political membership generates intrinsic, non-instrumental duties of special concern that are lexically prior to general duties to humanity. These duties are non-transferable; one cannot discharge duties to compatriots by aiding foreigners.
  *   **(i) Category:** Scope of moral obligation (associative).
  *   **(ii) Status:** A substantive philosophical commitment (contested on grounds of voluntariness and moral arbitrariness).
  *   **(iii) Implication:** **Supports nationalist conclusion.** This is the strongest version of the slogan. It asserts that compatriots possess special claims that cannot be outweighed by the greater needs of strangers, effectively creating a moral firewall at the border.

  **6. The Entitlement/Property Thesis**
  *   **Claim:** Wealthy states (or their citizens) legitimately own their resources. Transferring resources to non-citizens constitutes a violation of property rights unless voluntarily chosen. "Charity" is by definition supererogatory, never obligatory.
  *   **(i) Category:** Scope of moral obligation (negative vs. positive duties).
  *   **(ii) Status:** A false or morally arbitrary boundary (from the standpoint of egalitarian justice or historical entitlement theories involving colonialism/climate).
  *   **(iii) Implication:** **Supports nationalist conclusion.** It denies the premise of "obligation" entirely, reframing global redistribution as theft or mere benevolence.

  ---

  ### II. The "Smuggled" Commitments

  You asked to distinguish trivial claims from intermediate positions that smuggle in substantive commitments.

  *   **The Trivial Claim:** This is **Thesis 1 (Efficiency)**. It is philosophically inert regarding the *existence* of obligations. If an interlocutor admits that, due to global supply chains, a dollar saves more lives in Somalia than in Seattle, this thesis *requires* they send the dollar to Somalia. It cannot support a nationalist veto.
  *   **The Smuggled Commitment (State as Cooperative Scheme):** This is **Thesis 4**. It smuggles in a specific definition of justice (reciprocity-based) to exclude global claims. It assumes the state is a self-contained island of cooperation, ignoring how that state's wealth may depend on global exploitation (e.g., carbon space, intellectual property regimes, labor arbitrage). It transforms a claim about *institutional capacity* into a claim about *moral jurisdiction*.
  *   **The Smuggled Commitment (Non-Transferable Associative Duties):** This is **Thesis 5**. It smuggles in the assumption that political membership is a morally salient category akin to family, without addressing the involuntary nature of citizenship. It asserts that duties to compatriots are *agent-relative* (I must help *my* people) rather than *agent-neutral* (I must help people, and my people are a convenient subset).

  ---

  ### III. Diagnostic Conclusion: The Actual Invocation

  When an interlocutor uses "charity begins at home" to **dismiss** obligations to distant strangers (refugees, climate reparations), they are rarely invoking Thesis 1 or 2. If they were, they would be open to evidence showing that foreign aid is more efficient or that global solidarity strengthens local virtue.

  Instead, they are invoking a conflation of **Thesis 4 (Reciprocity)** and **Thesis 5 (Associative Duties)**, masquerading as **Thesis 1 (Efficiency)**.

  *   **The Rhetorical Move:** They present a normative boundary (Thesis 4/5) as if it were a practical constraint (Thesis 1). They argue "we *must* prioritize home" as if it were a logistical necessity, when they actually mean "we are *permitted* to prioritize home" based on special ties.
  *   **The Slippage:** The slogan uses the word "begins," which implies sequence (Thesis 1/2), but functions in discourse as "ends," implying exclusivity (Thesis 3/4/5).

  **Survivability Against the "Moral Arbitrariness" Objection:**

  Does this specific reading survive the objection that national borders are morally arbitrary (like place of birth)?

  1.  **Thesis 1 (Efficiency):** **Survives.** Efficiency is not arbitrary; it is contingent on facts. However, as noted, this does not support the nationalist *conclusion* the speaker wants.
  2.  **Thesis 4 & 5 (Reciprocity/Association):** **Generally Fails**, unless supplemented by further argument.
      *   From the standpoint of moral justification, if the obligation is based on *need* (climate reparations, refugee safety), the location of that need is morally arbitrary.
      *   To survive, the interlocutor must argue that borders are *not* arbitrary but mark significant moral discontinuities (e.g., the presence of coercive political structures, as argued by Nagel, or shared authorship of laws, as argued by Risse).
      *   However, the slogan *itself* provides no such justification. It relies on the intuition of partiality. When pressed, the "charity begins at home" argument collapses into the assertion that "our interests matter more than theirs."
      *   In the context of **climate reparations** or **refugees**, the argument fails most spectacularly. In these cases, the "home" state is often causally implicated in the harm suffered "abroad." To claim charity begins at home here is to ignore that the "home" may be the site of the *injustice* that created the need elsewhere.

  **Verdict:** In a graduate seminar, you should treat the slogan as a **placeholder for the Non-Transferable Associative Duty Thesis (Thesis 5)**. It should be challenged to demonstrate why political membership generates duties strong enough to override basic human rights (subsistence, safety) of non-members, particularly when the "home" state's prosperity is causally linked to the "away" state's deprivation. Without that demonstration, the slogan remains a prejudice dressed as a proverb.
