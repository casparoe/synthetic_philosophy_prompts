      *(Self-Correction during drafting)*: I should emphasize the "Center of Narrative Gravity." That's Dennett's specific term for the self. If the narrative doesn't pull weight, it's not a center of gravity. It's just a label.

      *(Check on LLMs)*: Dennett's recent comments on LLMs (2023-2024) are that they are "bullshitters." They don't care about truth. MIRROR's reporter doesn't care about anything because it's isolated. Strong parallel.

