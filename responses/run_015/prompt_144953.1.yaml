      *   *Principle 2: Predictive Success of Intentional Stance.* If we treat MIRROR as a person, does it work? If the lattice mirrors emotions well, maybe treating it as having emotions works *for us*, even if the report module is isolated. But Dennett cares about the *system's* stance toward itself too.
      *   *Principle 3: History.* Designed vs. Evolved. Dennett thinks evolution explains *why* we have consciousness, but a synthetic system could have it if it replicates the functions. So history isn't a hard blocker, but the *lack of selection pressure* on the reporter module is.
