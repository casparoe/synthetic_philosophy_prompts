answer: |-
  ### Session Plan: The Combination Problem (90 Minutes)

  #### I. Dependency Structure Correction
  Your instinct is to ground the view (Russellian Monism/Intrinsic Nature) before stating the problem. **Do not do this.**
  *   **The Error:** If you begin with the Trilemma and the nature of dispositional properties, you spend the first 40 minutes on the *Hard Problem* (why is there experience at all?). The students will conflate the Combination Problem with the Hard Problem, precisely the distinction you want them to grasp.
  *   **The Correction:** Start with the **Phenomenology of Unity**. The Combination Problem is not about how matter gets mind; it is about how *many minds* get *one mind*.
  *   **The Flow:**
      1.  **Phenomenological Fact:** You are one subject. (15 mins)
      2.  **The Distinction:** Hard Problem (Matter $\to$ Mind) vs. Combination Problem (Mind + Mind $\to$ Mind). (15 mins)
      3.  **The Motivation (Conditional):** *If* we accept panpsychism (via Intrinsic Nature arguments), *then* we face this problem. This isolates the Motivation as a reason to accept the premise, not the solution to the problem. (15 mins)
      4.  **The Three Questions:** Arithmetic, Demarcation, Symmetry. (30 mins)
      5.  **The Fork & Task:** Cosmic subjects and assessment. (15 mins)

  #### II. The Core Example: The Meaning of a Sentence
  You rejected the musical chord because of the "external auditor." You need a case where the unity is internal to the structure, not dependent on a receiver.

  *   **The Case:** **The Experience of Understanding a Sentence.**
      *   **Parts:** The understanding of individual words/concepts (e.g., "Snow," "Is," "White").
      *   **Whole:** The understanding of the proposition (the truth condition).
      *   **Why it works:**
          1.  **Non-Spatial:** Semantic space is not physical space; no "gluing" imagery.
          2.  **Constitutive:** The meaning is nothing over and above the words + syntax, yet the *truth* is a property of the whole, not the parts ("Snow" is not true).
          3.  **No External Observer:** The understanding *is* the experience. You do not need a homunculus to hear the meaning; the meaning is the state of the subject.
      *   **The Pivot to Consciousness:** Ask: "If the understanding of 'Snow' were a subject, and 'White' were a subject, how do they constitute *your* single understanding?"
      *   **Why not the obvious candidates:**
          *   *Musical Chord:* Rejected correctly. It implies sound waves hitting an ear. The unity is in the reception, not the source.
          *   *Near Miss 1: A Team Winning a Game.* **Teaches Badly:** It suggests functional coordination is sufficient for subjecthood. Students will conflate *cooperation* with *constitution*.
          *   *Near Miss 2: A Vector Sum.* **Teaches Badly:** It is too physical. The physicist will treat it as causal aggregation, missing the *phenomenal* novelty.

  #### III. Session Timeline & The Three Questions

  **00–05: Introduction & The Physics Closure**
  *   **Action:** State the topic. Immediately address the physicist.
  *   **Script:** "Panpsychism is not Quantum Consciousness. We are not discussing Orch-OR, entanglement, or wave-function collapse. Those are causal mechanisms. We are discussing metaphysical constitution. If you are looking for a physical interaction that sums minds, you will not find it here. Close that door."
  *   **Why:** Prevents the hour from dissolving into empirical speculation.

  **05–20: The Example & The Distinction**
  *   **Activity:** Walk through the "Sentence Meaning" example. Establish that the whole (meaning) is novel but constitutive.
  *   **Move:** Distinguish the problems.
      *   *Hard Problem:* How does non-experience (matter) become experience?
      *   *Combination Problem:* How do many experiences (micro-subjects) become one experience (macro-subject)?
  *   **Check:** Ensure they see that Emergentism *dissolves* the Combination Problem by denying the parts are subjects. Panpsychism *inherits* it by affirming they are.

  **20–35: The Motivation (The Russellian Move)**
  *   **Action:** Now supply the Trilemma/Intrinsic Nature argument.
  *   **Purpose:** Explain *why* one would accept the antecedent ("Suppose the parts are subjects").
  *   **Correction to your instinct:** Do not present this as solving the problem. Present it as the *cost of entry*. "We accept this view because physicalism leaves the intrinsic nature open. But by filling it with experience, we buy the Combination Problem."
  *   **Misconception Alert:** Students will think the Intrinsic Nature argument *solves* the combination. Correct this: "Knowing *what* the parts are doesn't tell us *how* they sum."

  **35–65: The Three Questions (The Core)**
  *   **1. The Arithmetic Question (35–45 mins):**
      *   *Prompt:* "If N micro-subjects constitute me, where did the other N-1 go?"
      *   *Discussion:* If they vanish, was it constitution or replacement? If they remain, are they submerged?
      *   *Goal:* Feel the tension between *preservation* and *unity*.
  *   **2. The Demarcation Question (45–55 mins):**
      *   *Prompt:* "What fixes *this* collection? Why not my left hemisphere? Why not me + the chair?"
      *   *Move:** Acknowledge the kinship with the Special Composition Question (Van Inwagen).
      *   *Recovery:** "Mereology asks when parts make a *object*. We ask when subjects make a *subject*. The stakes are higher because subjects are private."
  *   **3. The Symmetry Question (55–65 mins):**
      *   *Prompt:* "The parts are still there. Why is there not a larger plurality present *right now*? Why doesn't the whole's experience appear *alongside* the parts'?"
      *   *Goal:* This leads directly to the Fork.

  **65–80: The Fork (Cosmic Subjects)**
  *   **Scenario:** "Whatever takes micro-subjects to humans should take humans + surroundings to a cosmic subject."
  *   **Instruction:** Treat as a fork with priced horns, not a reductio.
      *   *Horn A:* Accept Cosmic Subjects (Cosmopsychism). Cost: Explaining why we don't experience the cosmos.
      *   *Horn B:* Deny the inference (Humans are special). Cost: Ad hoc boundary.
  *   **Placement:** Late, so it functions as a consequence, not a dismissal.

  **80–90: Final Task & Refusals**
  *   **Task:** (See below).
  *   **Refusals:** (See below).

  #### IV. Misconception Map

  **Expected Misconceptions:**
  1.  **Animism/Vitalism:** "Electrons have beliefs." *Correction:* Proto-experience, not complex psychology.
  2.  **Hard Problem Clone:** "This is just emergence with extra steps." *Correction:* Emergence denies parts are subjects; Panpsychism affirms it.
  3.  **Causal Combining:** "The experiences interact to make a new one." *Correction:* Constitution is not causation.
  4.  **Empirical Predictions:** "What experiment tests this?" *Correction:* It is a metaphysical framework, not a competing physical theory.
  5.  **Redescribed Emergence:** "Constitutive relation is just necessary emergence." *Correction:* Emergence implies novelty over and above; constitution implies nothing over and above.

  **Unanticipated Misconceptions (Framing-Induced):**
  1.  **The Russellian Rescue:** Students will assume the "Intrinsic Nature" argument *solves* the Combination Problem.
      *   *Prevention:* Explicitly state: "Russellian Monism motivates the *parts*, it does not explain the *sum*."
  2.  **Subject vs. Self:** Students will conflate the *metaphysical subject of experience* with the *narrative self* (psychology).
      *   *Prevention:* Define "Subject" strictly as "that which experiences," distinct from memory or personality.
  3.  **The "Observer" Trap:** Even with the Sentence example, they will posit a "reader" of the meaning.
      *   *Prevention:* Insist the understanding *is* the state. There is no second step.

  #### V. Final Assessment Task
  **Do not ask:** "Summarize the problem." (They will use vocabulary without structure).
  **Do ask:**
  > "Consider the claim: *'Micro-subjects cease to exist when the macro-subject forms.'*
  > 1. Which of the three questions (Arithmetic, Demarcation, Symmetry) does this claim attempt to answer?
  > 2. Which of the three questions does this claim make *worse*, and why?"

  *   **Success Criterion:** They must identify that this solves *Arithmetic* (the N-1 are gone) but exacerbates *Symmetry* (if parts are gone, constitution is actually replacement/destruction) and *Demarcation* (what triggers the cessation?). This proves they understand the structural tension, not just the definitions.

  #### VI. Explicit Refusals
  You must refuse three topics to keep the 90-minute boundary. State these as **decisions about the level of inquiry**, not dodges.

  1.  **Quantum Mechanics:**
      *   *Refusal:* "We are discussing metaphysical constitution, not physical causal mechanisms. Quantum effects are causal. We are bracketing physics to test the coherence of the metaphysics first."
  2.  **Empirical Predictions/Tests:**
      *   *Refusal:* "Panpsychism is a framework for interpreting physical data, not a competitor to physical data. Asking for a unique prediction now is like asking Dualism for a brain scan. We must settle coherence before measurement."
  3.  **Historical Exegesis (Leibniz/James):**
      *   *Refusal:* "We are treating this as a live structural problem. Historical positions often conflate these distinct questions. We will solve the architecture first, then map the history."

  **How to Refuse:** "That is a vital question for the *next* stage of inquiry. For this ninety minutes, we are determining if the view is *coherent*, not if it is *true* or *historical*. If the Combination Problem is incoherent, the empirical and historical questions do not arise."
