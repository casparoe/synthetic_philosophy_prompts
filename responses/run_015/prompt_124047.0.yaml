answer: |-
  Here is the teaching arc to walk your roommate through Taurek without triggering his moral alarm bells.

  ### 1. The Foundational Idea (Must Land First)
  Before you touch the numbers, you must land the **"Separateness of Persons."**
  If you start with "numbers don't count," he hears "five lives equal one life." You need him to hear: **"Loss is experienced individually, not collectively."**
  *   **The Pitch:** "Nobody feels 'group hunger.' The one guy feels 100% of his hunger. Each of the five feels 100% of their own hunger. There is no 'super-person' who feels 500% hunger. My duty is to the person in front of me, not to a math equation about total suffering."
  *   **Why this first:** It inoculates him against the "sociopath" label. You aren't ignoring the five; you are respecting that they are five *separate* individuals, not a single blob of need.

  ### 2. The Scenario: "The Sealed Pallet"
  Do not use the drowning kids. Use the food bank context but tighten the constraints so aggregation is physically impossible.
  *   **The Setup:** "Imagine the aid box isn't a box. It's a sealed, temperature-controlled pallet that the system only allows to be released to **one** recipient ID. If you break the seal to split it, the health inspector flags the whole pallet as compromised, and *nobody* gets it. It's all or nothing."
  *   **The Choice:** You have the guy who waited since dawn (ID #1) or the five who just arrived (IDs #2–#6). You can physically only hand the clipboard to one ID.
  *   **Why this works:** It removes the "just cut the pizza" objection. It forces the binary choice where helping the five *necessarily* means doing nothing for the one, and vice versa.

  ### 3. The Arc & Blocking Misconceptions
  Walk him through the scenario. He will likely raise these three objections in this order. Here is where you block them:

  **Objection 1: "So you just flip a coin?"**
  *   **When it hits:** Immediately after you suggest giving the five no preferential treatment.
  *   **The Misconception:** He thinks "coin flip" means *abdication of responsibility* or *randomness*.
  *   **Where to Block:** **Immediately.** Do not let him sit with "randomness."
  *   **The Block:** "It's not about randomness; it's about *respect*. If I pick the five because there are more, I'm telling the one guy his claim didn't matter. If I give everyone an equal chance (coin flip), I'm acknowledging that every single person has an equal right to be saved. It's the only way to treat them all as equals."

  **Objection 2: "This means suffering doesn't scale."**
  *   **When it hits:** After he accepts the coin flip but realizes the *outcome* is worse (5 hungry vs. 1 hungry).
  *   **The Misconception:** He thinks that because the *total badness* is higher, your *duty* must be higher.
  *   **Where to Block:** **After the fairness point is secure.** Let him feel the tension of the outcome, then block the inference.
  *   **The Block:** "The *tragedy* scales, yes. Five people hurting is worse than one. But my *duty* doesn't scale. I don't owe the group more than I owe the individual. I can't be responsible for the sum of their losses, only for how I treat each of them."

  **Objection 3: "This is just utilitarianism run backwards."**
  *   **When it hits:** When he tries to categorize your logic as just another math system (maximizing fairness instead of food).
  *   **The Misconception:** He thinks you are still *calculating* value, just using a different variable.
  *   **Where to Block:** **At the very end.** This is the philosophical cleanup.
  *   **The Block:** "No, utilitarianism calculates outcomes. This ignores outcomes entirely. It says the *process* of choosing matters more than the *result*. It's not backwards math; it's refusing to do the math on human worth."

  ### 4. The Check Question
  Do not ask him to repeat the conclusion. Ask this to verify he understands why claims don't pool:

  > **"If one of the five people walked away before you made the choice, does the moral weight of the remaining four decrease, or was their claim never combined to begin with?"**

  *   **Correct Answer:** "Their claim was never combined." (This proves he sees them as separate moral agents, not a aggregate pool of need).
  *   **Wrong Answer:** "The weight decreases." (This means he still thinks they pool their claims, and you haven't landed the core argument).

  ### 5. What to Skip (Crucial)
  **Skip Taurek's argument on "Loss to the World."**
  Taurek discusses how we shouldn't compare the social value of lives (e.g., saving a doctor vs. a criminal).
  *   **Why skip it:** Your roommate is shaken from a volunteer shift involving hungry people. Introducing the idea of "valuing lives" or "social utility" will sound eugenic or cold in this context. It muddies the water. Stick strictly to the **right to a chance**, not the **value of the life saved**. Keep it about *fairness*, not *worth*.
