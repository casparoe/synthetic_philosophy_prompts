      *   *Misconception 1: "So you flip a coin?"*
          *   *Reaction:* This usually comes early when they realize you aren't picking the majority.
          *   *Block:* Don't block it yet. This is actually Taurek's solution. Let this land. It shows you aren't ignoring the five; you're giving them a *chance*.
