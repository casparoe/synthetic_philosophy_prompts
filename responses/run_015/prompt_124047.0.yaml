      *   Taurek discusses the "loss to society" and comparisons of value of lives. He also gets into probability mechanics.
      *   *Skip:* The discussion on "loss to the world" or comparative value of lives. The roommate is shaken from a food bank shift; talking about the "value" of the hungry people will sound eugenic or cold. Stick to the *right to be considered*, not the *value of the life saved*.
