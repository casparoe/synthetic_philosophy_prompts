  6.  **Step 4: The Check Question:**
      *   *Goal:* Verify he understands why claims don't pool.
      *   *Bad Question:* "Do the five have a bigger claim?" (Yes/No)
      *   *Good Question:* Needs to probe the *mechanism* of the claim.
