      *   Core thesis: In cases of conflict where you cannot save everyone, you are not morally required to save the greater number.
      *   Reasoning: Each individual has a claim to be saved. There is no "super-claim" formed by adding individuals together. Loss is experienced individually, not collectively.
      *   Mechanism: Give each person an equal chance (e.g., flip a coin), rather than maximizing outcomes.
      *   Emotional hurdle: It sounds cold/calculating to ignore the greater good.

