      *   *Problem:* If I start with "numbers don't count," it sounds like I don't care about the five.
      *   *Solution:* Start with the *individual experience of loss*. The roommate needs to feel that the one guy's loss is just as total as any single one of the five's losses.
      *   *Key Concept:* "Loss is non-aggregative." You don't feel five people's hunger; you feel one person's hunger five times. But the decision is about *your* relationship to *them*.
      *   *Better Framing:* Focus on *fairness to the individual* rather than *outcome for the group*. The foundational idea must be: **Each person has a separate, complete claim on your help that cannot be diluted by the presence of others.**

