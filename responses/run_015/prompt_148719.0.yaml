answer: |-
  ### Restatement: Deweyan Experimentalism in Platform Vocabulary

  **The Epistemology of Inquiry**
  Standard experimentation treats the "problem" as a fixed parameter: a hypothesis is pre-registered, a primary metric is selected, and the test determines if the change moves the needle. Deweyan inquiry treats the "problem" as indeterminate. The situation is initially troubled (variance, friction, unintended behavior), but the *definition* of the trouble is not known until the experiment runs.

  In your vocabulary, this means the **primary metric is not fixed pre-ship**. It is an *end-in-view*. It starts as a proxy for the trouble, but as the experiment ramps up, the team may discover the metric is measuring the wrong consequence. A Deweyan platform allows the team to update the primary metric mid-horizon, provided they document *why* the original metric failed to capture the resolution of the indeterminate situation. The goal is not statistical significance on a pre-set KPI; it is the **resolution of the problematic situation**. If the experiment ends with the situation still indeterminate (even if p < 0.05), the inquiry is incomplete.

  **The Politics of the Public**
  Standard governance treats **guardrail metrics** as centrally owned constraints. The Platform team decides what constitutes "harm" (latency, retention, complaints) based on aggregate data. Dewey argues that a **Public** is constituted specifically by those who suffer *indirect consequences* of transactions they did not choose.

  In your vocabulary: A guardrail is legitimate only if the **affected cohort** has a mechanism to recognize their shared consequence and signal it. Currently, you detect spillover via interference checks. Dewey requires that the units experiencing spillover must be able to *organize* around that spillover. Governance is not just Platform vs. Product Team; it is Platform vs. Product Team vs. The Constituted Public. If a change creates negative spillover that does not trip a central guardrail, but the affected users recognize the harm and communicate it, that communication must have the power to trigger a **rollback**. Expertise (the Platform team) provides the measurement tools, but it cannot decide which consequences count as harms. That decision belongs to the Public (the affected units).

  **The Ontology of the Situation**
  Standard testing assumes **stationarity**: the world during the horizon is stable enough that a sample predicts the population. Dewey assumes **historicity**: the experiment changes the situation irreversibly.
  *   **Reversibility:** You assume rollback restores the baseline. Dewey argues that once users experience a change (novelty/primacy), the baseline is gone. The "control" is contaminated by the history of the experiment.
  *   **Horizon:** A fixed horizon assumes the inquiry ends at time *T*. Deweyan inquiry ends only when the situation is resolved. This may require extending the horizon indefinitely or shipping a partial fix to continue the inquiry in production.

  ---

  ### Residue Report

  #### One: Clean Translations
  **Interference and Spillover as Indirect Consequences.**
  This is the strongest mapping. Your technical definition of interference (Unit A's treatment affecting Unit B's outcome) maps directly to Dewey's definition of the Public (those affected by indirect consequences of transactions between others). When you run a cluster-randomized or switchback design to capture marketplace density effects, you are operationally acknowledging that transactions are not private. You are measuring the exact boundary where a private transaction becomes a public consequence. This is more than metaphor; it is the same structural insight.

  **Guardrails as Normative Constraints.**
  Your guardrail metrics function exactly as Dewey's social norms. They are not "truths" but "values" encoded into the system to prevent specific classes of harm. The politics you identified ("whoever owns the guardrails decides which consequences count") is a precise description of Dewey's problem of the "eclipse of the public." When the Platform team owns the guardrails, they are acting as the "experts" Lippmann favored, deciding consequences on behalf of the users.

  **Iterative Ramp as Means-Ends Continuity.**
  Your standard 1% -> 5% -> 50% ramp is a clean technical expression of Dewey's "ends-in-view." You do not ship to 100% immediately because you are testing whether the *means* (the code) actually achieves the *end* (the metric). If the metric breaks at 5%, you stop. The end is revised based on the performance of the means.

  #### Two: Distorted Translations
  **The Constitution of the Affected Cohort.**
  You noted the distortion: "We identify affected parties by measuring spillover, but they do not constitute themselves."
  *   **The Bend:** In your system, the "Public" is a passive cluster identified by an algorithm detecting variance. For Dewey, the Public is an *active agent* that forms through communication about that variance.
  *   **What Rides on It:** If the Public is passive (data points), harm is defined by *thresholds* (e.g., retention drops > 1%). If the Public is active (constituted agents), harm is defined by *objection*. You might have a statistically significant drop in retention that users don't care about (churn of bad actors), or a non-significant drop that causes organized outrage (trust violation). Your vocabulary captures the *magnitude* of the consequence, but deletes the *valuation* of the consequence. You measure the wound, but the patient does not get to say if it hurts.

  **Reversibility and Rollback.**
  *   **The Bend:** You treat rollback as a state reset. Dewey treats inquiry as historical.
  *   **What Rides on It:** If you ship a feature that erodes trust, then rollback, your metrics may return to baseline, but the *relationship* is altered. Users now know the feature existed and was removed. The "control" group is no longer naive. Your vocabulary assumes the environment is a lab; Dewey assumes it is a history. This distorts your power calculations because the "variance" includes historical memory which you cannot measure.

  **The Primary Metric.**
  *   **The Bend:** You treat the metric as a proxy for value. Dewey treats the "end" as a qualitative resolution.
  *   **What Rides on It:** You can optimize a metric (e.g., time on site) while degrading the situation (addiction/frustration). Dewey would argue your metric is a "false end." But your vocabulary has no way to distinguish a "true" end from a "false" one except by adding more guardrails. This leads to infinite regress of metrics, whereas Dewey solves it via the *quality of the experienced situation*, which your dashboard cannot capture.

  #### Three: No Expression
  **1. The Qualia of the Transaction.**
  Your vocabulary reduces user interaction to events (clicks, hovers, purchases). Dewey's "situation" includes the felt quality of the experience (frustration, flow, trust, alienation). You have no metric for "dignity" or "agency" unless it proxies to retention. There is no column in your dataset for "the user felt manipulated," unless they churn.

  **2. The Infrastructure of Communication.**
  Dewey's Public constitutes itself through communication. Your platform measures *transactions*, not *discourse*. You do not measure whether users are talking to each other about the experiment. If users discover they are in a test and discuss it on social media, that creates a "Public" in Dewey's sense. Your interference checks might catch the behavioral spillover, but you have no instrument for the *political organization* of the users. You lack a "community sentiment" sensor that is independent of engagement metrics.

  **3. Habit as Pre-Cognitive Baseline.**
  You assume the baseline is a distribution of random variables. Dewey argues the baseline is *habit*—sedimented patterns of behavior. When you experiment, you are disrupting habit. Your vocabulary treats habit disruption as "noise" or "novelty effect." Dewey treats it as the primary material of inquiry. You have no way to measure the *cost of habit disruption* itself, only the downstream metric effects.

  #### Four: Verdict on the Live Case
  **Case:** Open-ended experiment. No pre-registered primary metric. Team changes outcome as it learns. Readout is a narrative account + decision.

  **Verdict:**
  Currently, this is **undisciplined metric-shopping with better manners**, *unless* specific organizational conditions are met.

  **Why:**
  In Dewey's sense, "reconstructing ends" is not the same as "p-hacking."
  *   *Metric Shopping:* "We didn't hit significance on Conversion, so let's look at Time on Site." (This preserves the *fixed end* of "ship something valuable" while hunting for a proxy).
  *   *Deweyan Inquiry:* "We thought Conversion was the problem, but the experiment shows the real trouble is User Confusion. Conversion is the wrong end. We will now optimize for Support Ticket Reduction." (This reconstructs the *problem definition*).

  **Conditions for it to be Inquiry:**
  1.  **Governance Veto:** The "written account" must be subject to review by a body that represents the **affected cohort**, not just product leadership. If the team changes the metric to hide negative spillover, the Public (or their proxy) must be able to reject the readout.
  2.  **Narrative Integrity:** The narrative must explain *why* the original metric failed to capture the situation, not just why the new metric is significant. It must document the indeterminate nature of the start.
  3.  **No "Ship" Bias:** The decision output must include "Abort" as a valid resolution. If the organizational pressure is to "ship learnings," it is not inquiry; it is production. Inquiry accepts that the resolution might be "do nothing."

  **Verdict:** Without a mechanism for the affected users to validate the *redefinition of the problem*, this is simply giving product managers permission to move the goalposts. It is epistemically Deweyan (flexible ends) but politically Lippmannian (experts decide what counts as a resolution).

  ---

  ### Closing: The Defect of the Vocabulary

  I take the side that **the defect lies in your vocabulary**, not in Dewey's determinacy.

  Dewey is not vague; he is describing a richer ontology than your platform supports. Your vocabulary is built on **Instrumentalism**: the world is a set of levers (features) and gauges (metrics), and the goal is efficiency (conversion). This vocabulary *cannot* express "democracy as associated living" because it has no variable for "association" other than network graphs. It cannot express "reconstruction of ends" because it treats ends as business objectives fixed by OKRs, not as hypotheses about value subject to falsification by experience.

  **Where the residue falls:**
  1.  **Defect of Vocabulary:** The inability to capture **Qualia** and **Constitution**. Your system treats users as sources of data, not sources of *judgment*. You can measure their clicks, but you cannot measure their *consent* to the experiment's definition of value. This is a blind spot in the tool, not the philosophy.
  2.  **Sign of Dewey's Indeterminacy:** The **Horizon** problem. Dewey says inquiry ends when the situation is resolved. In a marketplace, situations rarely "resolve"; they shift. Dewey offers no stopping rule for infinite inquiry. Here, your fixed-horizon constraint is a necessary pragmatic fiction that Dewey underestimates. You cannot run an experiment forever.

  **How to tell the difference:**
  Look at the **Rollback Decision**.
  *   If you rollback because a metric dipped, your vocabulary is sufficient.
  *   If you rollback because users *complained* (even if metrics held), your vocabulary failed to predict the outcome, but Dewey's prediction (the Public will react to indirect consequences) held.
  *   If you *don't* rollback because metrics held, despite organized user objection, your vocabulary is actively hostile to Deweyan inquiry.

  The residue that remains untranslatable is **Agency**. Your vocabulary describes what happens *to* units. Dewey's vocabulary describes what happens *between* agents. Until your platform treats users as agents who can define the guardrails, you are running Lippmann's technocracy, not Dewey's democracy, regardless of how flexible your metric selection becomes.
