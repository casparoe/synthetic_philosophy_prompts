  1.  **Deconstruct the Request:**

      *   **User:** Professor of Philosophy, Ethics Adviser to a clinical research partnership in a West African city (3 years tenure).
      *   **Context:** Local norms view small gifts as etiquette and using fixers/relatives as standard procedure. Home university norms likely view these as potential corruption/bribery.
      *   **Task:** Create a *procedure* (not a policy statement) for ruling on ethics matters (10-12/year).
      *   **Format:** Ordered questions, sufficiency criteria, stop points (refusal), hand-off points (values vs. facts).
      *   **Constraints:**
          1.  Runnable by a Site Coordinator (senior nurse, no ethics training) in ~30 mins, from written record, without contacting the adviser.
          2.  Cannot simply export home university compliance (must respect local context regarding goats, cloth, etc., and monetary thresholds).
      *   **Theoretical Foundation:** Corruption = capture of a role's discretion by a loyalty the role was created to exclude. Bribe, clientelism, gift = same phenomenon at different durations. Operative test = Did a consideration enter a decision the role's point excludes? (Standpoint of the loser).
      *   **Nuance:** Must handle the "refusal cost" (declining gift = declining relationship necessary for work).
      *   **Application:** Apply to three specific cases (Nurse/Chicken, Director/Wife's Brother, Dean/Resort).
      *   **Critical Reflection:** Identify which case yields an uncomfortable result, analyze if it's a defect in the procedure or the expectation.
      *   **Limitation:** State plainly what the procedure *cannot* settle (specifically regarding the source of the standard: ours, theirs, or third).

  2.  **Develop the Procedure (The "Role-Capture Protocol"):**

      *   *Goal:* Operationalize the "capture of discretion" theory for a non-expert.
      *   *Structure:* Step-by-step questions. Yes/No or Specific Evidence.
      *   *Step 1: Identify the Role and its Point.* What is the person supposed to do? What loyalty is inherent?
      *   *Step 2: Identify the Consideration.* What was given/offered?
      *   *Step 3: Timing and Conditionality.* Did it happen before/during/after? Was it tied to a specific action?
      *   *Step 4: The "Loser" Test.* Who loses out if this loyalty shifts? Is there a victim?
      *   *Step 5: The "Refusal Cost" Check.* Is refusing this impossible without destroying the work relationship?
      *   *Step 6: Decision Matrix.* Stop/Approve/Refer.

      *   *Refining for the Coordinator:* Needs to be concrete. Avoid abstract哲学 terms like "deontology." Use "Job Duty," "Benefit," "Alternative."
      *   *Refining for the Theory:* Ensure the "capture" aspect is central. It's not about the *object* (chicken vs. cash) but the *influence*.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Role):* What decision was made or influenced? What is the primary duty?
      *   *Q2 (Consideration):* What was received? (Don't judge value yet).
      *   *Q3 (Exclusivity):* Does this benefit create a debt to a specific person rather than the institution?
      *   *Q4 (Alternative):* Was there a better option ignored? (Crucial for the contractor case).
      *   *Q5 (Loser):* Who is worse off? (The patient? The budget? The science?)
      *   *Q6 (Refusal):* If we say no, does the work stop?

      *   *Decision Logic:*
          *   If No Loser + High Refusal Cost -> Allow (Etiquette).
          *   If Loser + Consideration influenced decision -> Refuse/Remediate.
          *   If Loser + No better option (Monopoly) -> Refer to Dean/Board (Value judgment on necessity).

  4.  **Applying to the Three Cases:**

      *   *Case 1: Nurse/Chicken/Schnapps (Post-treatment).*
          *   Role: Recruit/Treat.
          *   Consideration: Chicken/Drink.
          *   Timing: After.
          *   Loser: None (treatment done).
          *   Refusal Cost: High (insult to family).
          *   *Verdict:* Permissible (Gratitude/Etiquette).
      *   *Case 2: Director/Wife's Brother/Contractor.*
          *   Role: Award contract. Duty: Best value/reliability.
          *   Consideration: Kinship loyalty.
          *   Loser: Other bidders (potentially), Budget (if price inflated).
          *   Fact: He is the *only* reliable firm.
          *   Conflict: Loyalty to family vs. Loyalty to institution. But if he's the only option, is discretion captured?
          *   *Nuance:* If he's the only one, the decision *would* have been the same. But the *reason* is mixed.
          *   *Verdict:* This is the tricky one. The procedure might flag it as "Capture" because the *motive* includes excluded loyalty, even if the *outcome* is efficient. Or, it might pass because there is no "Loser" (no better option exists).
          *   *Theoretical alignment:* "Capture of discretion." If there is no *other* valid discretion to exercise (only one firm works), is it capture?
          *   *Wait, the prompt says:* "disclosed and declared irrelevant by him."
          *   *Procedure Test:* Is there a loser? If he's the only reliable one, the study doesn't lose. Other bidders lose, but they couldn't do the job.
          *   *Risk:* Normalizing nepotism.
          *   *Verdict:* The procedure might *allow* this based on "No Loser/No Alternative," which feels uncomfortable.
      *   *Case 3: Dean/Resort/MOU.*
          *   Role: Renew MOU. Duty: Best interest of school.
          *   Consideration: Luxury trip.
          *   Timing: During decision.
          *   Loser: School (if terms are worse), or Integrity (perception).
          *   Refusal Cost: Low (can sign without trip).
          *   *Verdict:* Refuse. (Classic conflict).

  5.  **Identifying the "Uncomfortable Result":**

      *   Case 2 (The Contractor) is the likely candidate.
      *   *Why?* It looks like nepotism. Western compliance says "No." Local norm says "How things get done."
      *   *Procedure Outcome:* If the procedure focuses on "Is there a better alternative that was rejected?" and the answer is "No," the procedure clears it.
      *   *Is this a defect?* It depends. If the theory is "Capture of Discretion," and there was no *effective* discretion (only one viable vendor), then discretion wasn't captured. It was constrained by reality.
      *   *However,* it entrenches a system where only relatives get to be the viable vendors.
      *   *Decision:* I will argue Case 2 is the uncomfortable one. The procedure clears it (Fact: No alternative). The discomfort lies in the long-term systemic corruption vs. immediate practical necessity. This highlights the tension between *transactional* ethics and *structural* ethics.

  6.  **Addressing the "Standard" Question:**

      *   Whose standard is this?
      *   It's not purely Home (rejects monetary thresholds).
      *   It's not purely Local (rejects "just how it's done" if there is a loser).
      *   It is a *Functional* standard derived from the Role itself.
      *   *Limitation:* The procedure cannot settle *which* loyalty defines the role. (e.g., Is the Director's loyalty to the budget or to the community network that ensures stability?)

  7.  **Refining the Procedure for the Coordinator:**

      *   Needs to be a checklist.
      *   Needs clear "STOP" signs.
      *   Needs a "Refer" box for value judgments.

      *(Self-Correction during drafting)*: Make sure the "Refusal Cost" doesn't become a loophole for everything. It must be balanced against the "Loser" test. If there is a significant Loser (patient safety), Refusal Cost doesn't matter. If the Loser is abstract (fairness), Refusal Cost weighs heavier.

      *Revised Logic:*
      1. Define Role Duty.
      2. Identify Consideration.
      3. Did it influence the decision? (Counterfactual: Would decision be same without it?)
      4. Is there a Loser? (Specific harm).
      5. Is Refusal Cost > Harm?
      6. If Harm exists -> Refer/Refuse. If No Harm + High Refusal Cost -> Allow.

      *Wait, the prompt asks for:* "where the procedure stops with a refusal, and where it must hand the decision to a named person because the remaining question is one of values rather than of fact."
      *Okay, I need to distinguish Fact questions from Value questions.*
      *Fact:* Did the gift arrive? Is there another vendor?
      *Value:* Is kinship loyalty compatible with this role? Is the resort trip "hospitality" or "bribe"?

      *Let's structure the Procedure:*
      *   **Phase 1: Fact-Finding (Coordinator)**
      *   **Phase 2: The Capture Test (Coordinator)**
      *   **Phase 3: The Necessity Check (Coordinator)**
      *   **Phase 4: The Hand-Off (Values)**

  8.  **Finalizing the Output Structure:**

      *   **Introduction:** Acknowledge the role and constraints.
      *   **The Procedure (The Role-Capture Protocol):** Step-by-step.
      *   **Application to Cases:** Walk through the three scenarios.
      *   **The Uncomfortable Result:** Identify Case 2. Analyze defect vs. expectation.
      *   **The Limitation:** The source of the standard (The "Role Definition" problem).

  9.  **Drafting the Content (incorporating the "West African" context sensitively):**
      *   Avoid judging "fixers" as inherently bad, but test them against the "Role's Point."
      *   Ensure the "Nurse" can understand it. Use plain language.
      *   *Key Insight:* The procedure must distinguish between *grease* (facilitating a duty that should happen anyway) and *capture* (changing the duty).

      *(Self-Correction on Case 2)*: If the Director discloses it, does that mitigate? The prompt says "disclosed and declared irrelevant." The procedure needs to test if it *is* irrelevant. If he is the *only* firm, it is factually irrelevant to the outcome, but relevant to the *system*. The procedure, being transactional, might miss the systemic issue. That's the "Uncomfortable Result."

      *(Refining the "Standard" limitation)*: The procedure assumes we agree on what the "Role's Point" is. But in a partnership, the Home University and the Local Hospital might define the "Director's Role" differently. The procedure cannot resolve that conflict.

  10. **Final Review against Constraints:**
      *   30 mins? Yes, checklist style.
