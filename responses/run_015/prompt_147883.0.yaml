      The prompt asks: "I suspect one of these will come out the way I would rather it did not."
      As a philosopher, I might want to condemn the nepotism. But the *procedure* based on "harm/loser" might clear it.
      So, the procedure clears the nepotism. That is the uncomfortable result.
      Is it a defect? No, it's a feature of a harm-based vs. rule-based system. It highlights that *systemic* corruption isn't always *transactional* corruption.
