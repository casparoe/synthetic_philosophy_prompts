answer: |-
  ### The Role-Capture Protocol (RCP)

  **Purpose:** To determine whether a specific consideration (gift, favor, relationship) constitutes an ethical breach by capturing the discretion of a role.
  **Operator:** Site Coordinator.
  **Time Limit:** 30 Minutes.
  **Inputs:** Written record of the event, job description of the actor, available alternatives.

  ---

  #### Phase 1: Fact-Finding (The Record)
  *The Coordinator completes this section based on documents and interviews. No judgment yet.*

  **Q1: What is the specific decision or action taken?**
  *   *Sufficient Answer:* A concrete description (e.g., "Awarded courier contract," "Renewed MOU," "Accepted chicken").
  *   *Insufficient:* "Did his job," "Helped a partner."

  **Q2: What is the primary duty (the "Point") of the role held by the actor?**
  *   *Sufficient Answer:* Reference to job description or partnership agreement (e.g., "Ensure sample integrity," "Secure best value," "Maintain community trust").
  *   *Stop Condition:* If the duty is undefined, **HAND OFF** to the Partnership Steering Committee. (This is a value question: *What is this role for?*)

  **Q3: What consideration was offered or received?**
  *   *Sufficient Answer:* Description of object, service, or relationship benefit (e.g., "Chicken," "Contract for brother-in-law," "Resort stay").
  *   *Note:* Do not assign monetary value.

  **Q4: What was the timing relative to the decision?**
  *   *Options:* Before, During, After.

  **Q5: Were there viable alternatives to the decision made?**
  *   *Sufficient Answer:* Evidence of other bidders, other methods, or ability to decline the gift without stopping work.
  *   *Fact Check:* If the actor claims "No alternative," is there documentary proof (e.g., only one bid received, other firms lack vehicles)?

  ---

  #### Phase 2: The Capture Test (The Logic)
  *The Coordinator applies the answers from Phase 1 to these filters.*

  **Q6: The Counterfactual Test:**
  *   *Question:* If the consideration had not been offered, would the decision likely have been the same?
  *   *If YES:* Proceed to Q7.
  *   *If NO:* **STOP. REFUSAL.** (Discretion was captured; the consideration changed the outcome).

  **Q7: The Loser Test:**
  *   *Question:* Is there an identifiable party who is worse off because of this decision/consideration combination? (Consider the study, the patient, the budget, or excluded competitors).
  *   *If YES:* Proceed to Q8.
  *   *If NO:* **ALLOW.** (If the decision was the same and no one loses, the consideration is etiquette or surplus).

  **Q8: The Refusal Cost Test:**
  *   *Question:* If the consideration is rejected, does the work stop or does the necessary relationship collapse?
  *   *If YES:* **HAND OFF** to the Ethics Adviser (or designated Deputy). (This is a value question: *Do we prioritize the relationship or the principle in this specific instance?*)
  *   *If NO:* **STOP. REFUSAL.** (If you can refuse without killing the work, and there is a Loser, the loyalty is excluded).

  ---

  #### Phase 3: The Hand-Off (Values)
  *If the procedure reaches a HAND OFF point, the Coordinator submits the file to the Named Person (e.g., Chair of the Local Ethics Committee).*

  **The Value Question to be Resolved:**
  "Does the role's definition permit this specific loyalty (kinship, hospitality, reciprocity) as a *component* of the duty, or is it strictly *excluded*?"

  ---

  ### Application to Cases

  #### Case 1: The Nurse, the Chicken, and the Schnapps
  *   **Q1 (Decision):** Recruitment and care of child (completed).
  *   **Q2 (Duty):** Patient welfare and protocol adherence.
  *   **Q3 (Consideration):** Chicken and schnapps.
  *   **Q4 (Timing):** After treatment ended.
  *   **Q5 (Alternatives):** Nurse could have treated child without gift (care was already delivered).
  *   **Q6 (Counterfactual):** Yes. Treatment was already finished; the gift did not buy the care.
  *   **Q7 (Loser):** None. The study budget is not impacted; other patients are not disadvantaged.
  *   **Q8 (Refusal Cost):** High. Refusing a post-factum gratitude gift insults the family and damages community trust required for future recruitment.
  *   **Result:** **ALLOW.** (Stops at Q7).
  *   **Rationale:** No discretion was captured; the decision (treatment) preceded the consideration. No loser exists.

  #### Case 2: The Director and the Brother-in-Law
  *   **Q1 (Decision):** Award sample-courier contract.
  *   **Q2 (Duty):** Secure reliable transport for biological samples.
  *   **Q3 (Consideration):** Kinship loyalty/Profit to relative.
  *   **Q4 (Timing):** During decision.
  *   **Q5 (Alternatives):** Documentary evidence shows other firms exist but lack reliability/reach.
  *   **Q6 (Counterfactual):** Yes. Even without the kinship, the brother-in-law is the *only* viable vendor. The decision remains the same.
  *   **Q7 (Loser):** Competing firms lose revenue. However, they could not fulfill the duty (sample integrity). The Study does not lose.
  *   **Q8 (Refusal Cost):** High. If the Director refuses the relative to "make a point," the relative may sabotage the logistics (local context), or the Director loses political capital needed to run the site.
  *   **Result:** **HAND OFF.** (Proceeds to Q8).
  *   **Rationale:** While the *outcome* is efficient, the *loyalty* is mixed. The Coordinator cannot decide if kinship loyalty is compatible with the Director's role when it doesn't harm the study. This is a value judgment on the definition of the Director's role.

  #### Case 3: The Dean and the Resort
  *   **Q1 (Decision):** Renew Memorandum of Understanding (MOU).
  *   **Q2 (Duty):** Secure best terms for the Medical School.
  *   **Q3 (Consideration):** All-expenses-paid resort week.
  *   **Q4 (Timing):** During decision.
  *   **Q5 (Alternatives):** Signing can occur without the resort stay.
  *   **Q6 (Counterfactual):** Unknown/Suspect. Luxury hospitality is designed to influence.
  *   **Q7 (Loser):** The Medical School (if terms are softened due to hospitality) or Public Trust.
  *   **Q8 (Refusal Cost):** Low. The Dean can sign the MOU without staying at the resort.
  *   **Result:** **STOP. REFUSAL.** (Triggers at Q8).
  *   **Rationale:** Refusal does not end the relationship. There is a potential loser (the institution). The consideration enters a decision where it should be excluded.

  ---

  ### The Uncomfortable Result

  **Case 2 (The Director and the Brother-in-Law)** is the one that will likely come out in a way you (and your home university) would rather it did not.

  The procedure, as written, leans toward **clearing** this case (or at most handing it off with a strong presumption of allowance), provided the "No Alternative" fact holds. It treats the nepotism as ethically neutral because it did not alter the *outcome* (the samples get moved) and there is no immediate *loser* (the other firms couldn't do the job).

  **Is this a defect in the procedure or in your expectation?**

  It is a defect in your **expectation**, provided your goal is a procedure runnable by a nurse in 30 minutes that respects local constraints.

  Here is why: To condemn Case 2 automatically is to export the home university's compliance list (which bans nepotism *per se*). To condemn it based on "systemic harm" (it entrenches a corrupt market) requires a sociological analysis the Site Coordinator cannot perform in half an hour. The RCP is a *transactional* tool, not a *structural* one. It tests for *capture of a specific decision*, not *capture of a market*.

  If you force the procedure to condemn Case 2, you force the Coordinator to lie about the "No Alternative" fact or to impose a value judgment (that kinship loyalty is always excluded) that the local site has explicitly rejected as unworkable. The procedure correctly identifies that the *ethical tension* here is not about the samples (facts), but about what kind of institution you are building (values). Hence, the **HAND OFF**.

  However, if the Hand-Off authority (you or the Committee) consistently rules against the Director because "nepotism looks bad to the home university," you have violated your second constraint: you are exporting compliance. If you rule *for* the Director, you risk normalizing a system where only relatives become "the only reliable firm." The procedure exposes this dilemma; it cannot solve it without violating one of your constraints.

  ### What the Procedure Cannot Settle

  The procedure cannot settle **the source of the "Role's Point."**

  In Phase 1, Q2 asks: *What is the primary duty of the role?*
  *   **Home University Standard:** The Director's duty is to fiduciary efficiency and global compliance. Kinship is an excluded loyalty.
  *   **Local Site Standard:** The Director's duty is to operational continuity within a social network. Kinship is a *required* loyalty to ensure the work gets done (the "fixer" norm).
  *   **The Procedure's Standard:** The RCP quietly introduces a third standard: **Functional Integrity.** It asks, "Did the work suffer?"

  The procedure cannot tell you which definition of the Role is the "true" one. It assumes we agree on the duty. In Case 2, if the Local Site defines the Director's duty as "maintain the network that allows samples to move," then the brother-in-law is not a conflict; he is the *mechanism* of the duty. If the Home University defines the duty as "competitive bidding," he is a violation.

  The RCP masks this conflict by focusing on the *Loser*. But if the "Loser" is the abstract principle of fair competition (Home Standard) versus the concrete loss of logistics (Local Standard), the procedure forces the Coordinator to choose which "Loss" counts. That is not a fact; it is a political decision about who owns the partnership. The procedure hands this off, but ultimately, *you* must decide whether the partnership exists to do research in Africa or to reform African research administration. The RCP cannot answer that.
