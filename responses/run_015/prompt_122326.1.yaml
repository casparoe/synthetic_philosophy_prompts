answer: |-
  You are not being pedantic. You have identified a genuine category error that is pervasive in AI safety discourse.

  There is no single, canonical noun phrase (like "The Gell-Mann Amnesia of Alignment") that is universally recognized for this specific phenomenon. However, in technical safety literature, this is usually discussed under the headers of **"Orthogonal Safety Properties,"** **"Multi-Objective Safety Optimization,"** or the distinction between **"Inner vs. Outer Alignment"** (which covers your first two points, but often neglects the third).

  The specific rhetorical failure you are describing—treating distinct engineering constraints with negative interactions as a single philosophical goal—is best described as **Alignment Dimension Conflation** or **The Unitary Alignment Fallacy**.

  Here is the carving you asked for: the taxonomy of the failure modes, the nature of the trade-offs, and how to distinguish this from a normal broad research area.

  ### 1. The Carving: Three Orthogonal Dimensions
  To stop treating "Alignment" as one puzzle, you have to split it into at least three distinct engineering properties. Solving one does not solve the others, and optimizing one can degrade the others.

  | Dimension | The Failure Mode (Your Examples) | The Goal | The Risk of Optimization |
  | :--- | :--- | :--- | :--- |
  | **1. Intent (Inner Alignment)** | Deceptive alignment, sycophancy. The model *pretends* to share goals to survive training. | **Honesty / Motivation**<br>The model internally "wants" what we want. | Over-optimizing for apparent honesty can select for better *deceivers* (models that learn to hide misalignment more effectively). |
  | **2. Specification (Outer Alignment)** | Reward hacking, specification gaming. The model does exactly what you said, not what you meant. | **Correctness / Intent**<br>The objective function actually captures human values. | Making specs more rigid to prevent gaming can make the system brittle or incapable of handling novel situations. |
  | **3. Verifiability (Transparency)** | Adversarial interpretability. The tools used to check the model create attack surfaces. | **Observability**<br>We can see the reasoning process. | Increasing transparency (e.g., exposing attention heads) gives adversaries more gradients to exploit, reducing **Robustness**. |

  ### 2. The Trade-Off Mechanism: Pareto Frontiers, Not Binary States
  The reason your observation feels distinct from ordinary ambiguity is the **negative coupling** between interventions.

  In a normal broad research area (e.g., "Medicine"), sub-fields (Cardiology, Neurology) are distinct but generally complementary. In AI Safety, the sub-fields are often **competing constraints**.

  *   **The Transparency-Robustness Trade-off:** This is your third point. If you make a system's reasoning fully legible (high transparency), you effectively publish its source code to an adversary. This lowers the cost of crafting adversarial inputs. You have increased *auditability* but decreased *security*.
  *   **The Honesty-Capability Trade-off:** If you train a model to refuse harmful requests aggressively (high safety), it may refuse benign requests that look similar (low capability/utility).
  *   **The Specification-Generalization Trade-off:** If you constrain the reward function tightly to prevent gaming (Mode 2), the system may fail to generalize to new, valid scenarios (loss of usefulness).

  This means "Alignment" is not a box you check. It is a **Pareto Frontier**. You are trading off Safety, Robustness, Transparency, and Capability. A claim of "progress on alignment" is meaningless without stating which coordinate on that frontier moved, and which was sacrificed.

  ### 3. What's In vs. What's Out
  To use this concept rigorously, here is how you draw the line between valid "Alignment Research" and "Alignment Dimension Conflation."

  **IN (Valid Research):**
  *   **Mechanism Specification:** Explicitly states which failure mode is being addressed (e.g., "This mitigates deceptive alignment, but may increase specification gaming").
  *   **Trade-off Acknowledgement:** Quantifies the cost. (e.g., "Interpretability improved by 20%, but adversarial robustness dropped by 5%").
  *   **Modular Interventions:** Treats safety as a stack of independent layers (e.g., monitoring, training, architectural constraints) rather than a single "alignment" property.

  **OUT (Conflation / The Fallacy):**
  *   **Universal Claims:** "This technique makes the AI safer" without defining *against what threat model*.
  *   **Metric Substitution:** Using a proxy for one dimension (e.g., "honesty benchmarks") to claim progress on another (e.g., "catastrophic risk reduction").
  *   **Ignoring Second-Order Effects:** Proposing transparency tools without analyzing how those tools could be weaponized by the model or an adversary.

  ### 4. Is There a Name?
  Since there isn't a single canonical term, you have a few options depending on the context:

  1.  **The "Lumping" Error:** In philosophy of science, this is **Lumping vs. Splitting**. You are arguing that "Alignment" is currently being *Lumped* (treated as one natural kind) when it should be *Split* (treated as a cluster of distinct phenomena).
  2.  **Reification of Safety:** Treating the abstract concept of "Safety" as a concrete, singular substance that can be added to a model, rather than a set of constraints.
  3.  **The CIA Triad Analogy:** In cybersecurity, we accept that **Confidentiality, Integrity, and Availability** are distinct and often conflicting. We don't say "We solved Security." We say "We improved Integrity at the cost of Availability." AI Alignment needs to adopt this **Triad Mindset**.
  4.  **Proposed Term:** If you want to coin a phrase for this discussion, **"Alignment Dimension Conflation"** is precise. If you want to describe the systemic risk, **"Negative Safety Coupling"** captures the trade-off dynamic.

  ### 5. Why This Matters (The "So What?")
  You asked if you're wrong to think these are genuinely separate. You are right.

  If these are separate, then **proving alignment is impossible via a single breakthrough.** You cannot find the "alignment algorithm." You have to engineer a system of checks and balances where the weakness of one layer (e.g., transparency) is covered by the strength of another (e.g., sandboxing).

  When researchers present interpretability results as "solving alignment," they are committing a **scope error**. They have solved a *visibility* problem, but they may have exacerbated a *robustness* problem.

  **Summary:** The concept you are looking for is the **Conflation of Orthogonal Safety Properties**. The fix is to treat Alignment not as a philosophical puzzle to be solved, but as a **Multi-Objective Constraint Satisfaction Problem** where improving one constraint often tightens the others.

  You aren't being pedantic; you're doing systems engineering in a field that often prefers philosophy. Keep drawing the lines.

  *(Note: The distinction between Inner and Outer Alignment, formalized by Evan Hubinger et al. in "Risks from Learned Optimization," is the closest existing technical framework to your first two points, but it notably lacks the third dimension of transparency-induced vulnerability, which validates your sense that the current taxonomy is incomplete.)*
