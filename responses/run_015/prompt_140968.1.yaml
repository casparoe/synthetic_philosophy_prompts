answer: |-
  The play functions less as a defense of free speech than as a phenomenology of informal sanction. It dramatizes how a series of private choices aggregates into a punitive structure that meets the effects of punishment while evading its procedural constraints. Your three conditions provide the necessary traction to separate mere social friction from systemic penalty.

  Regarding the discharge condition, the play confirms that informal sanction is often undischargeable. Stockmann cannot serve a sentence because there is no court to sentence him, nor can he apologize to lift the ban. The offense is not a moral transgression but a factual truth that threatens economic stability. Because the town cannot admit the water is poisoned without admitting liability, the sanction persists as long as the truth remains inconvenient. There is no mechanism for reintegration, only exile. This aligns with your worry about the terminus of punishment; here, the sanction ends only when the target leaves the community entirely, suggesting that informal sanction functions as banishment rather than correction.

  The attribution condition is where the play most sharply complicates your framework. You ask whether an aggregate is punishment if no part of it is. The play argues yes. The editor, the printer, the landlord, and the homeowners act within their private rights. Individually, they are merely exercising freedom of association or property rights. Collectively, they constitute a "Compact Majority" that strips Stockmann of his livelihood and standing. The play suggests that when private refusals coordinate around a shared interest—here, the economic survival of the baths—they cease to be mere association and become a distributed penal system. No single agent can lift the sanction, which mirrors the structure of structural violence. This challenges the idea that punishment requires a specific agent; the agent here is the system itself.

  The transparency condition is tested by the Mayor's argument. You worry that if the Mayor's pragmatic case holds, the sanction is not undeserved. However, the play reveals the operative reasons are interest-opaque. The town claims moral outrage regarding public safety, yet the driving force is economic preservation. The sanction is communicative in form—declaring Stockmann an enemy of the people—but the content is economic coercion. This fails your transparency condition because the condemnation is a pretext for protecting capital. The play shows that sanction can function as punishment even when the communicative content is false, provided the coercive effect is real.

  Addressing your specific worries: First, regarding the stacked deck (a), Stockmann's correctness highlights the mechanism but does not invalidate the reading. The structure of the sanction would remain even if Stockmann were mistaken, provided the town believed him a threat. However, his verifiable truth makes the opacity of the town's reasons more visible, sharpening the failure of the transparency condition. Second, regarding Stockmann's elitism (b), his contempt for the crowd complicates the victimhood. He does not seek reintegration but embraces isolation, claiming the strongest individual is the one who stands alone. This resists the reading because punishment typically presupposes a community from which one is temporarily excluded. Stockmann rejects the community's standing to judge him at all. The play thus becomes less about the wrong of silencing and more about the incompatibility of truth-telling with democratic consensus. Third, regarding the Mayor's argument (c), the pragmatic case for quiet remediation tests whether the sanction is punitive or protective. The play suggests that refusing public scrutiny to manage risk is itself a punitive act against the truth-teller. The harm imposed on Stockmann is disproportionate to the risk he poses, marking it as punishment rather than risk management.

  What the play adds to the debate is the demonstration that sanction can function as punishment without the intent to condemn. Your framework assumes punishment requires a communicative address. The play shows that social sanction can be purely structural: a coordination of private refusals that produces punitive effects without any single participant intending to punish. This suggests your transparency condition may be too strict; the effect matters more than the intent. The play reveals that deplatforming is not merely the loss of a venue but the loss of the social infrastructure required for agency. When the commons baseline is violated—when private owners control public necessities like the press or meeting halls—freedom of association becomes a tool of suppression. The play ultimately argues that informal sanction becomes punishment when it removes the capacity for political agency, regardless of the stated reasons.

