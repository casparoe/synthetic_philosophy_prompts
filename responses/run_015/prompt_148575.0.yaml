  I was arguing with my coworkers about how to split this surprise bonus our boss gave the team. Theres one guy, Mark, who says he should get like 80 percent of it because he claims he gets way more happiness out of money than anyone else. He went through some kind of experimental neurofeedback program after a car accident and now he says his brain is wired so that every dollar gives him like ten times the joy it gives me or anyone else on the team.

  He keeps talking about total happiness and saying if we actually care about everyone being well off we should just maximize that, even if it feels unfair. I told him he sounds like a cartoon villain but he says theres actual philosophy behind measuring well-being across people. The rest of us think its ridiculous but I can't really say why beyond it just feels wrong. Is he making a real philosophical argument here about adding up happiness, or is he just dressing up greed in science words? I want to understand what's actually wrong with his reasoning if anything is, without just saying life isnt fair.
