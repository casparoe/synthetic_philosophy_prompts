  ### 7.2 The Risk of Recursive Self-Improvement

  AI safety concerns often focus on recursive self-improvement. An AI that modifies its own code is a hierarchical system. The analysis in this chapter sheds light on the limits of such improvement. If the transition rule is mechanistic, the AI is bounded by the Gödel sentence of the total system. It cannot improve its way out of logical limitations. This suggests that there are hard limits to intelligence, even for self-modifying systems. This counters the narrative of unbounded intelligence explosion.

