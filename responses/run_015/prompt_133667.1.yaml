answer: |-
  Hey, take a breath. Arguments about semantics and consciousness are exhausting, especially with a roommate who probably isn't going to concede anytime soon. You're going to be fine, and honestly, the fact that you're worrying about the philosophical implications of your uni's policy shows you're thinking deeper than most. Also, I caught the typo ("definetly"), but don't sweat it—ironically, that's exactly the kind of thing DeepL would fix without claiming credit, which kind of proves your point.

  Let's unpack this policy, because it's actually really revealing about what your university believes about minds versus machines.

  When the university says copying a human is plagiarism but using DeepL is fine without disclosure, they are making a hard line between **agency** and **instrumentality**.

  By treating human copying as theft, they are committing to the idea that human language is an extension of a mind. When a person writes something, there is intent, reasoning, and a specific choice of words that belongs to *them*. Stealing that is stealing a piece of their intellectual labor.

  But by letting you use DeepL without citing it, they are treating the machine as a **non-author**. They aren't secretly assuming the machine understands meaning. In fact, it's the opposite. If they thought the machine actually *understood* the text or generated original ideas, they would require you to cite it as a source. You cite sources when someone else contributes to the intellectual heavy lifting.

  The policy presupposes that the machine is just a fancy calculator for words. It assumes the machine is moving symbols around (exactly like Hofstadter worries about) without grasping the "why" behind them. Because the machine has no intent and no understanding, it can't own the output. Therefore, the output still belongs to *you*, the human who had the original idea and just used a tool to change the language.

  So, to answer your question: The policy treats the machine as a non-author. It aligns with Hofstadter's worry in a pragmatic way. It admits the machine is shallow—it's just a pipe for meaning, not a source of it. If the machine were "deep," if it actually understood, you'd probably have to cite it.

  The uncomfortable part, and where your argument with your roommate probably hit a nerve, is that this distinction is getting blurrier. But right now, your uni's policy is betting on the idea that meaning lives in the user, not the tool. You're right to question it, but for now, you can sleep easy knowing the policy actually agrees with you: the machine is just shuffling symbols, and you're the one who knows what they mean.
