  **INSTITUTIONAL ANIMAL CARE AND USE COMMITTEE (IACUC)**
  **MEMORANDUM OF COMMITTEE ACTION**

  **TO:** Dr. [PI Name], Department of [Department]
  **FROM:** IACUC Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Protocol Decision #2023-045 (Wild-Caught *Peromyscus* Housing)
  **DECISION:** **APPROVED WITH CONDITIONS**

  ### I. REQUIRED MODIFICATIONS AND TIMELINE

  The Committee approves the protocol contingent upon the following modification to the housing environment:

  1.  **Environmental Enrichment:** Standard caging must be modified to accommodate a minimum substrate depth of 15 cm of diggable material (paper-based or soil-equivalent sterile mix) to allow for burrow construction.
  2.  **Implementation Timeline:** These modifications must be fully implemented within **14 days** of this notice.
  3.  **Monitoring:** Health metrics (weight, coat quality) must continue to be tracked, but behavioral monitoring must be added to the weekly log specifically noting "stereotypic digging" or "barrier frustration" at the cage walls.

  ### II. RATIONALE AND STANDARDS FOR BEHAVIORAL ASSESSMENT

  The Committee was divided regarding the justification for housing wild-caught burrowing rodents in standard caging. The central disagreement concerned the definition of biological function and its relationship to animal welfare. The Principal Investigator (PI) argued for a **Causal-Role Account** (function is defined by the trait's current contribution to the system's goals, i.e., health/weight in captivity). The Committee's Behavioral Ecologist argued for an **Etiological Account** (function is defined by the history of natural selection that shaped the trait).

  After deliberation, the Committee votes to codify the **Etiological Account** as the standard for defining "species-typical behavior" for the purpose of welfare assessments, subject to the constraints detailed below.

  #### A. Justification for the Etiological Standard
  For wild-caught animals, the Causal-Role account presents an unacceptable risk of "adaptive preference" errors. An animal may cease to exhibit distress behaviors (like digging) because it has entered a state of learned helplessness or physiological suppression, not because the need is absent. Relying solely on current weight gain or overt distress signals (the Causal-Role view) treats the animal as a blank slate adaptable to any environment. The Etiological account acknowledges that the animal arrives with a specific evolutionary history. The drive to dig was selected for thermoregulation, predator avoidance, and shelter. To deny the expression of this behavior is to create a mismatch between the animal's biological design and its environment, constituting a welfare deficit even if physical health metrics remain stable.

  #### B. Engagement with the "Appendix" Counter-Example
  We recognize the philosophical vulnerability of the Etiological account, best illustrated by the "Appendix Case." The human appendix has an etiological function (historical selection for immune support/gut flora storage), yet in modern contexts, it often provides no current causal benefit and can cause lethal harm (appendicitis). If we strictly codify Etiology, do we mandate the preservation of harmful traits simply because they were selected for?

  The Committee resolves this tension by distinguishing between **structural vestiges** and **behavioral drives**.
  1.  **The Appendix Case:** This represents a trait where the *expression* or *retention* of the structure causes direct physical pathology. In such cases, the Etiological history does not override immediate physical harm.
  2.  **The Burrowing Case:** This represents a behavioral drive where the *suppression* of the behavior causes psychological or physiological frustration.

  We are codifying the Etiological account not to mandate that all historical traits must be expressed regardless of cost, but to establish a **Precautionary Baseline**. In the Appendix case, the risk is *over-expression* (keeping a harmful organ). In the IACUC context, the risk is *under-provision* (denying a behavioral need). The error cost of falsely identifying a behavior as "needed" (providing extra bedding) is low. The error cost of falsely identifying a behavior as "unnecessary" (chronic stress, immunosuppression, reduced validity of behavioral data) is high. Therefore, we use history to identify *potential needs*, even if current metrics do not yet show harm.

  #### C. Consideration of the Causal-Role Objection (The PI's Position)
  The Committee acknowledges the strength of the PI's Causal-Role argument. The strongest consideration on this side is that **history is not destiny, and "natural" is not inherently "good."**

  The PI correctly notes that captivity is a novel environment. In the wild, digging prevents predation; in a secure rack system, digging serves no survival purpose. To fetishize the historical function risks imposing a "naturalistic fallacy" on animal care, where we prioritize an ideological version of nature over the animal's actual lived experience. If a specific enrichment causes injury (e.g., substrate impaction) or interferes with data collection critical to reducing overall animal use (the 3Rs), the Causal-Role account provides a necessary off-ramp.

  We accept this limitation. Our adoption of the Etiological standard is not absolute. If the provision of digging substrate leads to measurable physical harm (e.g., respiratory issues from dust, injury from substrate material) that outweighs the benefit of behavioral expression, the Causal-Role account will take precedence. The Appendix Case stands as a reminder that etiological function does not grant moral immunity from intervention. However, in the absence of such direct harm, the burden of proof lies on those claiming the behavior is "not needed" to demonstrate that the suppression of the drive is benign, not on the Committee to prove that the drive is essential.

  ### III. CONCLUSION

  The protocol is approved with the stipulated modifications. The Committee will review the behavioral monitoring logs at the next continuing review (12 months). If the data shows that the deep substrate causes health issues (supporting the Causal-Role concern), we will revisit this standard. Until then, we operate on the presumption that a wild animal's evolutionary history defines its baseline needs.

  **Signed,**

  [Name]
  IACUC Chair
