      *   **Goal:** Translate the philosophical debate about the transitivity of "all-things-considered better-than" into Decision Science vocabulary.
      *   **Specific Tasks:**
          1.  Restate three specific philosophical arguments (Spectrum/Continuum, Essentially Comparative/Menu-Relative, Pragmatic/Money Pump) in MCDA terms.
