      *   *MCDA Perspective:* This aligns with the distinction between the *outranking relation* (binary, potentially intransitive) and the *choice procedure* (set-dependent). If the relation itself is ternary (context-dependent), transitivity is not expected.
      *   *Critique:* Does this fully dissolve the problem?
          *   *Overreach:* Even with menu-relativity, if you present the *same* menu $\{A, B, C\}$ and get $A \succ B \succ C \succ A$, you still have a cycle within a single context. Spectrum arguments often claim intransitivity *within* a fixed set of options, not just across changing sets.
          *   *Residue:* The "Small Improvement Argument" often posits that $A$ and $B$ are on a par, but $B^+$ is better than $B$. This isn't just menu relativity; it's about the structure of the preference relation itself (incompleteness vs. intransitivity).

