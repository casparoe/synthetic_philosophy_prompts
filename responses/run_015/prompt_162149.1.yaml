  ## Part IV: Analysis of Logical Space

  **Undistinguished Leaf Pairs**
  This instrument does not fully distinguish between **The Absolutist (1)** and **The Risk-Averse (5)** if the Risk-Averse respondent answers Q1 like an Absolutist. Both prioritize severe pain, but one focuses on certainty and the other on probability. This is because Q1 tests composition, not risk. To distinguish them, one must rely on Q6 alone; if a respondent answers Q1(A) and Q6(B), they fall into a gap this instrument marks as "Absolutist but Risk-Neutral," which is a stable but rare position not given its own leaf.

  **Unoccupied Combinations**
  1.  **Indexed Limit + Momentary Bearer:** (Q4(B) + Q5(A)). *Diagnosis: Unstable.* If the limit depends on the subject's capacity, evaluating it by momentary intensity rather than life-capacity creates tension regarding what "capacity" means.
  2.  **Lexical Priority + Additive Sub-Limit:** (Q7(B) + Q1(C)). *Diagnosis: Incoherent.* If small pains add up to cross the limit, the limit is not lexical but quantitative.
  3.  **Risk Averse + Monist:** (Q6(A) + Q7(A)). *Diagnosis: Unstable.* If pain and pleasure are on a single smooth scale, avoiding risk solely due to severity implies a hidden lexical break.

  **Calibration Item**
  *   **Detection:** If a respondent selects Q3(B) ("Same moral status") *and* Q1(B) ("Prevent the itches"), they may have misread Q3 as asking about physical measurability rather than moral status.
  *   **Advice:** Re-read Q3. The case stipulates a physical difference in intensity exists, even if undetectable. If you believe moral status follows physical facts regardless of knowledge, select A. If you believe moral status follows knowledge, select B. Ensure your choice reflects your moral theory, not a reading error.

  ***

  ## Part V: Audience Note

  **For Blog Readers:** Treat this as a self-reflection tool. There are no "correct" answers. Your result indicates which commitments you are already making, not which view you ought to hold. Use the "Awkward Commitment" sentences to test whether you are willing to accept the consequences of your intuitions.

  **For Graduate Seminars:** Use this as a discussion map. Assign students to different Leaves based on their scores. Have pairs from opposing Leaves (e.g., Absolutist vs. Integrator) debate Case 5 (The Bargain). The instrument reveals that disagreements often stem from different assumptions about what bears the limit (moment vs. life) rather than the value of suffering itself.

  ***

  ## Part VI: Instrument Shape and Debate Structure

  The shape of this instrument reveals that the **limit** does significantly more work than the **negative-leaning** component. Most splits (Questions 1, 4, 5, 6) concern where the line is drawn, what bears it, and how it handles risk, rather than whether suffering matters more than pleasure. Only Question 7 directly tests the negative-leaning claim that pleasure cannot balance pain. Furthermore, the instrument suggests that **commensurability** (Question 7) is downstream of the **bearer** question (Question 5). If one believes the limit applies to whole lives (The Integrator), the need for a lexical break between pain and pleasure diminishes, as trade-offs can be managed temporally within a single life. Thus, the debate turns less on the value of pleasure and more on the architecture of the suffering limit itself.
