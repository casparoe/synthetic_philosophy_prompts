  **Summary:**
  This principle sacrifices some theoretical breadth (excluding "Instrumental Convergence" cases like 6b from GMG) to gain **operational clarity**. It ensures that every GMG ticket results in an Alignment/Retraining task, while Spec Gaming and Context tickets result in Infrastructure/Prompt tasks. This prevents you from trying to align a model when you should be patching a sandbox.
