answer: |-
  This is a sophisticated framework. You have essentially reconstructed a speech-act theory of public memory, hybridized with a bit of moral luck and a cynicism check (the substitution test). It is far more robust than the standard "erase vs. preserve" binary.

  Here is the disciplined mapping of the Colston case through your framework, followed by the stress test you requested.

  ### Part 1: Running the Case Through the Framework

  #### 1. The Uptake Theory
  **Mapping the Speakers and Utterances:**
  *   **Speaker A (1895):** The Joint Committee (Council + Merchant Venturers).
  *   **Utterance A:** "Edward Colston is a virtuous son of Bristol; emulate him."
  *   **Relevant Public A:** Victorian Bristol citizens (specifically the ratepaying, property-owning class).
  *   **Evidence of Uptake A:** The unveiling ceremony attendance, the lack of contemporary public record of dissent (due to suppression of slave trade records), and the statue's integration into civic rituals.
      *   *Analysis:* The utterance succeeded *then*. The "silent failure" condition wasn't met in 1895 because the relevant public was structurally prevented from knowing the negating facts.
  *   **Speaker B (1990s–2018):** Campaigners/Council (attempted).
  *   **Utterance B:** "This statue is contested; here is context."
  *   **Relevant Public B:** A fractured modern Bristol (descendants of enslaved people, heritage traditionalists, general public).
  *   **Evidence of Uptake B:** Failure. The 2018 plaque row proves uptake failed. For campaigners, the plaque was insufficient (didn't change the honorific status); for traditionalists, it was vandalism of history. Without shared uptake, the speech act misfired.
  *   **Speaker C (7 June 2020):** The Protesters (specifically the four topplers + the crowd).
  *   **Utterance C:** "This object no longer honours; it insults. We revoke its status."
  *   **Relevant Public C:** The immediate crowd, the viral audience, and subsequently the Jury (2022).
  *   **Evidence of Uptake C:** High. The toppling was a physical interruption of the original speech act. The jury acquittal is the strongest evidence of *retroactive* public uptake validation. The Council fishing it out but not re-erecting it confirms the original utterance is dead.
  *   **Speaker D (Current):** The Council (via the new plinth plaque).
  *   **Utterance D:** "This empty space marks a conflict we had."
  *   **Analysis:** This confirms your hypothesis. The museum display is a **third option**. By moving the statue to the M Shed with graffiti intact, the Council changed the *genre* of the object from **Monument** (prescriptive: "honour this") to **Artifact** (descriptive: "this happened"). This validates your view that the museum option is neither erasure nor honour, but historicization.

  **What this explains that normal debate misses:**
  *   **The 2018 Plaque:** Normal debate sees this as a bureaucratic failure ("they couldn't agree on wording"). Your framework sees it as a **failed speech act**. You cannot "add context" to a speech act that is fundamentally disputed. Adding a plaque is a new utterance ("We acknowledge the harm but maintain the honour"). If the public rejects that compound message, the plaque doesn't fix the statue; it becomes part of the conflict.
  *   **"Just History":** Under uptake theory, "leave it up as history" is incoherent. A statue on a plinth in a public square is not a history book; it is a performative endorsement. To keep it up *is* to continue the utterance. You cannot claim neutrality while maintaining the infrastructure of the honour.

  #### 2. The Substitution Test
  **Mapping:**
  *   **Condition:** Would the 1895 Commission have been satisfied with a statue of a generic "Merchant Venturer" or another slave-trading philanthropist (e.g., Robert Yeamans)?
  *   **Evidence:** The records show abolitionists were floated and rejected. The Merchant Venturers lobbied specifically for Colston. However, the *motivation* was civic competition (Birmingham/Manchester).
  *   **Result:** The test **passes** (in the negative). Colston was a placeholder for "Bristol has great men."
  *   **Implication:** This validates your suspicion. The object-level argument ("Was Colston evil?") is aimed at the wrong target. The statue was never about Colston's soul; it was about the Merchant Venturers' 1895 political power. The debate since 2020 has been obsessed with Colston's biography, but your framework suggests the real subject is the **1895 elite's self-image**.

  #### 3. Commemorative Luck
  **Mapping:**
  *   **Donor Luck:** The 1895 donors could not foresee the civil rights movement or the archival recovery of the Royal African Company logs. They made a bet on permanent meaning. They lost.
  *   **Protester Luck:** The topplers could not foresee the jury's interpretation of "criminal damage" vs. "conscience," nor the Council's decision to museumize the statue.
  *   **Implication:** This dissolves the "slippery slope" argument. We aren't judging 1895 by 2020 standards; we are acknowledging that meaning is temporally unstable. It excuses the 1895 donors from *malice* while condemning the *current maintenance* of the statue.

  ---

  ### Part 2: Breaking the Framework

  You identified three weak points. Here is the diagnostic.

  #### 1. The Standing Problem (Who is "The Public"?)
  **The Bug:** The theory treats "the public" as a monolith that grants or denies uptake. In Bristol, the public is fractured.
  *   **The Conflict:** In 1895, the "public" was effectively the white propertied class. In 2020, the "public" includes Black Bristolians who were previously excluded from the civic conversation.
  *   **The Failure:** Your theory has no mechanism to weigh *whose* uptake counts. If 51% want it down and 49% want it up, does the monument fail?
  *   **The Colston Evidence:** The jury acquittal suggests the *legal* public (12 peers) validated the toppling. The Council elections suggest the *political* public validated keeping it down. But poll numbers often show a significant minority want it re-erected.
  *   **Verdict:** This is a genuine bug. The theory needs a **legitimacy condition**. Uptake cannot just be "reaction"; it must be "authorized reaction." Without this, the theory collapses into mob rule. However, one could argue the *lack* of unified uptake is precisely what kills the monument. A monument requires *consensus* to function as honour. If uptake is contested, the monument becomes a site of conflict (which is what the new plinth plaque admits).

  #### 2. The "Cheap Uptake" Problem
  **The Bug:** You noted that one afternoon of protest + viral video seems to outweigh decades of campaigning.
  *   **Analysis:** Under speech-act theory, **illocutionary force** varies. A petition is a constative (stating a desire). Toppling a statue is a performative (changing the state of affairs).
  *   **Is it a bug?** It feels normatively wrong (violence > debate), but descriptively accurate. Monuments are physical objects; they respond violently to physical intervention better than discursive argument.
  *   **Verdict:** This is a **feature**, but a dangerous one. It explains *why* the toppling worked when petitions failed. It doesn't justify it morally, but it explains the mechanism. The theory correctly identifies that monuments exist in the realm of spectacle, not just policy. If you want to change a spectacle, you often need a counter-spectacle.

  #### 3. The Criminal Law Silence
  **The Bug:** The theory explains meaning, not legality.
  *   **Analysis:** The law asked: "Did you damage property belonging to another?" The theory asks: "Did the property cease to function as a monument?"
  *   **Verdict:** This is a **category error**, not a silence. The theory is not equipped to judge criminal liability. However, the jury's acquittal is *evidence* for the theory. The jury effectively ruled that the "property" interest of the Council was outweighed by the "speech" interest of the public. The theory explains *why* the jury might feel that way (the statue had lost its legitimacy), even if it can't write the penal code.

  ---

  ### Part 3: Reverse Pressure (Does the Case Break the Theory?)

  This is the critical section. You asked if the Colston case forces conditions onto the theory that destroy its utility.

  #### 1. Durability and Legitimacy
  **The Worry:** If uptake can change overnight, memory is too fluid. Do we need a "time test"?
  **The Pressure:** If we add a durability condition (e.g., "uptake must be stable for 10 years"), we smuggle in conservatism. We privilege the 1895 uptake over the 2020 uptake simply because it lasted longer.
  **The Colston Verdict:** The case suggests **durability is not required for validity, but for stability.** The 2020 uptake was instant but has held (statue is still down 4 years later). The theory holds. However, if the statue were re-erected in 2025, it would prove the 2020 uptake was temporary.
  **Conclusion:** The theory does not need a durability condition, but it must acknowledge that **unstable uptake creates unstable civic space.** Bristol is currently in a state of "semantic instability." The theory predicts this will remain until a new consensus (new plaque, new statue, or permanent empty plinth) stabilizes the uptake.

  #### 2. The Substitution Test and Narcissism
  **The Worry:** If the Substitution Test proves the 1895 statue was about the Merchant Venturers, and the new plinth is about 2020 Bristol, does the theory prove we only ever talk to ourselves?
  **The Pressure:** This threatens to make the theory nihilistic. If all commemoration is just the living projecting self-image, is there any point in it?
  **The Colston Verdict:** This is the **strongest implication** of your framework, and it is not a bug; it is a diagnostic tool.
  *   **1895:** "We are a great mercantile city." (Used Colston as prop).
  *   **2020:** "We are an anti-racist city." (Used the toppling as prop).
  *   **Current Plinth:** "We are a city that acknowledges conflict." (Uses the empty space as prop).
  **Is this useless?** No. It forces honesty. Most public debate pretends we are honouring the dead. Your theory forces us to admit **we are honouring our current values.**
  *   **The Shift:** Once you admit this, the question changes from "Did Colston deserve this?" to "Do *we* deserve to project this image?"
  *   **The Trap:** You are right to worry. If the new plaque just says "We toppled this," it risks becoming a monument to the topplers (self-praise). To avoid this, the new utterance must be **inclusive of the conflict**, not just the victory. The M Shed display succeeds here because it includes the graffiti (the protest) *and* the history (the context). It admits the fracture rather than papering it over.

  #### 3. The "Talking to Ourselves" Problem
  **The Worry:** If the Substitution Test always passes, the theory predicts we are always just talking to ourselves.
  **The Resolution:** The theory predicts this *for civic statuary specifically*. It does not apply to all memory (e.g., archives, graves). Civic statues are inherently narcissistic; they are billboards for the era that erected them.
  **Does this make it useless?** It makes it **deflationary**. It strips the sanctity from the monument. This is useful because it lowers the temperature. If the statue is just 1895 Bristol patting itself on the back, we don't need to treat attacking it as attacking history itself. We are just taking down a billboard.

  ### Final Assessment

  Your framework holds up remarkably well against the Colston case, provided you accept two limitations:

  1.  **It is descriptive, not normative.** It explains *how* the meaning changed, not whether the toppling was *right*. It explains why the jury acquitted (uptake shifted), not whether they should have.
  2.  **It requires a definition of "Public."** The Colston case breaks the theory only if you insist "The Public" is a single voice. If you treat "The Public" as a **site of contestation**, the theory works perfectly. The statue failed because the Public fractured. The museum display works because it acknowledges the fracture.

  **The Verdict on your Hypotheses:**
  *   **2018 Plaque:** You are correct. It was a contested speech act, not a technocratic fix.
  *   **"Just History":** You are correct. This cannot be stated under this view; maintenance is endorsement.
  *   **Museum Option:** You are correct. This is a third category (Artifact vs. Monument).
  *   **Narcissism:** You are correct. The theory implies all civic statuary is presentist self-praise. This is not a flaw in the theory, but a flaw in the practice of civic statuary that the theory exposes.

  **Recommendation:** The only patch you need is on **Standing**. You need to add a clause that Uptake is **weighted by stake**. The uptake of descendants of the enslaved regarding a slave trader statue must weigh heavier than the uptake of heritage tourists. Without that, the theory is purely majoritarian. If you add a **Stakeholder Weighting** to the Uptake Theory, it survives the Colston case intact and becomes a powerful tool for analyzing public memory.
