  MILLBROOK — Citing recent breakthroughs in counterfactual dependence, the Millbrook Town Council announced Monday it has transitioned to "omissive governance," attributing the town's record-low crime rate and surged small-business growth to specific things the administration chose not to do. The newly formed Department of Non-Action will oversee implementation.

  Mayor Arthur Henderson stated that while previous administrations focused on active legislation, the new strategy leverages the causal power of absence. "When we declined to install stoplights, we actively caused a 15% increase in traffic throughput," Henderson said. He spoke from a podium that had not been built for the occasion. "The lack of a signal is the cause. If we had acted, the flow would not exist. Therefore, the non-action is the producer."

  The policy relies on distinguishing genuine omissive causes from mere bare absences. Council members argue that not repairing the North Bridge was not negligence, but a deliberate causal intervention that redirected commuters to local shops. However, critics note the difficulty in isolating specific omissions from the background noise of infinite things the council also didn't do, such as not banning gravity or not declaring war on Canada. This selection process requires rigorous metaphysical justification to avoid claiming credit for natural disasters they merely didn't prevent.

  "We only claim credit for the omissions we intended to omit," said Councilwoman Sarah Jenkins, addressing the agent-control condition often smuggled into causal theories. "If we forget to fix a pothole, that's negligence. If we vote to not fix a pothole to stimulate tire sales, that's governance. The intention legitimizes the absence."

  Philosophical concerns regarding overdetermination have arisen since the council simultaneously funded a bike lane while claiming the lack of funding caused the cycling boom. Henderson dismissed this as a "causal surplus." "Both the action and the inaction caused the result," he said. "The prosperity is doubly determined. It's very safe. You can't have too much cause." Critics worry this dilutes the concept of cause entirely. If inaction is action, then doing nothing is doing everything.

  Residents remain cautiously optimistic, though some express confusion over receiving tax bills for services that were never rendered. "I guess not building a park saved us money," said local resident Gary Thorne. "But I still have nowhere to walk my dog. Is the lack of a park causing my dog's sadness?"

  The Council plans to expand the program next quarter by not implementing a curfew, which they claim will directly cause a decrease in nighttime loitering. When asked what happens if the omission fails, Henderson shrugged. "Then it was just nothing. And nothing costs nothing. We project a massive surplus."

  ***

  **Notes on the Satire**

  The piece targets the metaphysical problem of causation by omission. Normally, we say "not watering the plant caused it to die." But philosophically, why doesn't "not watering" also cause "not becoming a rocket"? The satire exaggerates the town's need to distinguish "policy omissions" from "bare absences" (like not declaring war on Canada) to show the arbitrariness of selecting causes.

  The agent-control condition is mocked through Councilwoman Jenkins. In philosophy, omissions often require agency to be causal agents rather than mere background conditions. The town claims intention turns negligence into governance, satirizing how politicians rebrand inertia as strategy.

  Finally, the overdetermination joke (the bike lane) highlights the logical collapse when both action and inaction are claimed as sufficient causes. By treating causation as a political resource rather than a physical relation, the piece exposes how "causal credit" is often just narrative control.
