answer: |-
  The city upgraded the Permit Office with a new "Nuance Engine," designed to treat promises fairly. The mayor announced, "From now on, the likelihood of any rule—like 'If you pay, you park'—will exactly match the likelihood of you parking, given that you paid."

  The first citizen stepped up to the counter. "Great. So if I pay the five dollars, what are the odds I get the permit?"

  The clerk stared at the screen as it whirred loudly. Finally, it flashed a stark red zero.

  "Zero?" the citizen asked. "But people get permits all the time."

  "The engine is too thorough," the clerk sighed. "It accounts for every possible way the world could vary—traffic, weather, clerical errors. It turns out that if you equate the probability of the rule with the probability of the outcome, and you acknowledge *any* complexity at all, the math breaks. You aren't allowed to have a '90% chance.' You're only allowed 'Absolutely' or 'Impossible'."

  "So since paying doesn't absolutely guarantee a permit..."

  "Then the rule itself is logically invalid. The system says we can't offer it. Unless we can promise parking with the certainty of gravity, the statement 'If you pay, you park' has a probability of zero."

  "So what's the new policy?"

  "We removed all the 'Ifs'. The sign outside now just says: 'Pay. Maybe Park. No Promises.' The mayor wanted a system that understood uncertainty, but instead, we built one that proves nothing uncertain is worth saying."
