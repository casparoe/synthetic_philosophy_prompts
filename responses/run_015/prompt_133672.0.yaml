      *   *Correction:* Make sure I don't just list the four theses but arrange them from trivial to radical as requested ("menu from the trivial or definitional to the genuinely radical").
      *   *Order:*
          1.  Underdetermination (Epistemic) - Trivial/Standard.
          2.  Ontological Relativity (Semantic) - Substantive.
          3.  No Fact of the Matter (Metaphysical) - Radical Quinean.
          4.  Global Scepticism (Kripkean) - False/Not Quine.
