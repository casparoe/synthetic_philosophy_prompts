      *   *Advice:* The secretary needs to protect themselves and the board. Suggest a procedural tweak (e.g., findings are advisory).

  9.  **Refining the "Settled vs. Live" Distinction:**
      *   *Settled:* Arrow's Impossibility Theorem (group rationality isn't guaranteed). Minutes are evidence of due diligence.
      *   *Live:* Whether "re-voting for clarity" is a valid parliamentary procedure or a manipulation. (Robert's Rules says you can reconsider, but doing it *until* you get the result you want is problematic).
      *   *Live:* The normative purpose of non-profit minutes (transparency vs. protection).

  10. **Final Polish:** Ensure the distinction between the *legal* reality and the *sociological* reality is clear. The board is operating sociologically (building consensus) but recording legally (creating a record). This mismatch is the danger zone.

