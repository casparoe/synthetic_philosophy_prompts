      *(Refining the "Board's Opinion" section)*: Use the distinction between *aggregative* (counting votes) and *deliberative* (changing minds) democracy. The re-vote is deliberative, but the timing (after the final vote) is the weird part.

      *(Refining the "Findings as Gates" section)*: Why don't they want it? Because land conservation is often opportunistic. You don't always have time for perfect criteria.

      *(Final check on constraints)*: Did I identify what is settled vs. live? Yes. Did I answer all sub-questions? Yes.

