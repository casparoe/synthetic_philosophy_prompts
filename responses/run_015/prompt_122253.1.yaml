answer: |-
  # Q&A Prep Sheet: Diachronic Separateness Workshop
  **Target:** Moral Theory Workshop (8 Attendees)
  **Goal:** Defend normative claim without metaphysical commitment.

  ---

  ## 1. The Consequentialist Objection (The "Prudence" Attack)
  **Source:** The 5 Consequentialists (Preference-Utilitarians & Rule-Consequentialists)
  **Damage Level:** **Critical.** If this stands, your theory makes rational life-planning impossible. This is the majority of the room; if they reject this, the paper fails.
  **Vocabulary:** Intertemporal utility, discount rates, welfare maximization, rational choice, sacrifice.

  **The Question:** "If we cannot aggregate welfare across temporal stages, how do you justify prudence? Any act of saving, studying, or dieting involves imposing a cost on a present stage for the benefit of a future stage. If that's a violation of separateness, your view forbids rational planning. Are you committed to saying that sacrificing now for later is morally equivalent to sacrificing *me* for *you*?"

  **Your Reply (2 Minutes):**
  "I appreciate the force of that. It sounds like I'm dismantling prudence. But I want to distinguish *aggregation* from *investment*. Standard utilitarianism treats the present pain and future gain as entries in a single sum, canceling each other out. My claim is that the present stage has a *claim* not to be harmed, even for the benefit of the future stage. This doesn't forbid planning; it forbids *justifying* the harm solely by the future gain.

  Think of it like this: I can ask my neighbor to lend me money for my retirement, but I can't *take* it. Similarly, a present stage can 'invest' in a future stage, but it requires a different normative structure than simple summation—perhaps a model of consent or trusteeship between stages. I am not saying you can't study for an exam; I am saying the cost to the tired student tonight isn't *erased* by the grade tomorrow. It remains a moral cost that needs justification beyond 'the sum is higher.' This complicates rational choice theory, yes, but it doesn't destroy the possibility of action; it just demands we acknowledge the friction of time."

  **Concede Up Front:** Acknowledge that this view makes standard economic models of rational choice look morally shallow.
  **Weakest Point:** You haven't fully explained the "trusteeship" model. If the future stage can't consent, how is this different from interpersonal sacrifice?
  **Strategy:** **Softener.** Do not claim prudence is *unchanged*. Claim prudence is *morally costlier* than we think. Don't let them paint you as anti-planning; paint yourself as pro-accountability.

  ---

  ## 2. The Kantian Objection (The "Unity of Agency" Attack)
  **Source:** The 2 Kantians
  **Damage Level:** **High.** They accept the interpersonal objection but will argue that *intrapersonal* unity is required for moral responsibility.
  **Vocabulary:** Unified will, autonomy, ends-in-themselves, moral responsibility, fragmentation.

  **The Question:** "We agree persons are separate. But a single person is a unified agent. To treat your temporal stages as separate persons fragments the will. If I'm responsible for my promises tomorrow, I must be the same agent as the one who made them today. Doesn't your view undermine the very agency required to be a moral subject?"

  **Your Reply (2 Minutes):**
  "That's a crucial distinction. I am not arguing for metaphysical fragmentation; I am arguing for *normative* friction. Kantian respect requires treating humanity as an end. I argue that includes the humanity of the *present* stage. When we aggregate intrapersonally, we often treat the present self merely as a means to the future self's ends.

  Consider addiction or burnout: we often justify destroying a present capacity for agency for the sake of future output. My view protects the agency of the *now* from being cannibalized by the *later*. Unity of agency is important, but it shouldn't be a blank check for exploitation across time. We can maintain responsibility for commitments without assuming the later stage has an automatic right to consume the earlier stage's welfare. Respect applies diachronically, not just synchronically."

  **Concede Up Front:** Agree that *some* unity is required for responsibility and promise-keeping.
  **Weakest Point:** If stages are "separately entitled," can the future stage hold the past stage responsible? You risk breaking the chain of responsibility.
  **Strategy:** **Hold Firm.** This is your core normative innovation. Insist that unity does not justify instrumentalization.

  ---

  ## 3. The Psychologist Objection (The "Commitment" Attack)
  **Source:** The Moral Psychologist
  **Damage Level:** **Medium.** They won't attack the metaphysics, but they will attack the empirical plausibility of your "stages."
  **Vocabulary:** Temporal discounting, psychological continuity, commitment devices, cognitive bias, empirical reality.

  **The Question:** "Empirically, people struggle with temporal discounting because they *feel* disconnected from their future selves. But we build commitment devices to bridge that gap. If we treat stages as separate, aren't you validating the bias? Shouldn't morality help us overcome the feeling of separateness, not codify it?"

  **Your Reply (2 Minutes):**
  "That's an insightful empirical point. But I'd caution against conflating *psychological connection* with *moral license*. Just because I feel disconnected from my future self doesn't mean I should exploit my present self, and vice versa.

  Actually, my view might support your commitment devices. If stages have separate claims, then 'binding' oneself isn't just efficiency; it's a treaty between distinct centers of concern. When you use a commitment device, you are acknowledging that the future self cannot simply command the present self. I'm not validating the bias of discounting; I'm validating the intuition that the future self doesn't own the present self. The empirical fact that we struggle to connect across time might actually be evidence of the normative boundary I'm describing, rather than a cognitive error to be fixed."

  **Concede Up Front:** Acknowledge that psychological continuity is a matter of degree, not a binary.
  **Weakest Point:** If the boundary is fuzzy empirically, how is it sharp normatively?
  **Strategy:** **Softener.** Align with their data. Frame your theory as explaining *why* commitment devices feel necessary, rather than fighting the data.

  ---

  ## 4. The "Hope Nobody Asks" (The Grounding/Boundary Question)
  **Source:** Likely the Psychologist (practical framing) or Cautious Kantian
  **Damage Level:** **Fatal.** This targets your "no metaphysics" constraint. If you can't define a stage, you can't define the boundary.
  **Vocabulary:** Operationalization, criteria, arbitrariness, normative significance.

  **The Question:** "You say we don't need metaphysics to mark the boundary between stages. But if I'm a utilitarian, I need to know *when* aggregation stops. Is a stage an hour? A year? A psychological phase? Without a metaphysical criterion, isn't your 'diachronic separateness' just arbitrary? How do I know when I'm violating a boundary?"

  **Your Defensive Reply (Brief & Firm):**
  "I anticipate this worry. I am not offering a metaphysical criterion for *identity*; I am offering a normative criterion for *claims*. The boundary isn't found in the atoms or the memory chains; it's found in the shift of *interest*. Whenever there is a significant divergence in welfare interests that cannot be reconciled without sacrifice, a normative boundary is triggered.

  It is admittedly fuzzy, but moral boundaries often are. We don't need a precise metaphysical line to know that sacrificing a child's welfare for their adult welfare requires justification. I am asking you to accept the normative salience of the conflict itself, rather than waiting for a metaphysical verdict on whether they are the 'same person.' The conflict grounds the boundary, not the ontology."

  **Strategy:** **Defensive.** Do not try to define the stage precisely. Pivot to the *conflict of interest* as the trigger. If you try to define the duration of a stage, you will lose. Keep it focused on the *moment of sacrifice*.

  ---

  ## Rhetorical Choreography Notes
  *   **Eye Contact:** When answering the Consequentialists, look at the Rule-Consequentialists first. They are more likely to be swayed by "rules of planning" than the Preference-Utilitarians.
  *   **Tone:** Humble on the *implications* (yes, this is complex), confident on the *intuition* (sacrifice is always a cost).
  *   **The "No Metaphysics" Shield:** If pressed on metaphysics, repeat: "I am making a claim about *claims*, not about *atoms*."
  *   **Closing:** If the "Hope Nobody Asks" question comes, take a breath before answering. It signals you recognize the depth of the challenge. Do not rush it.
