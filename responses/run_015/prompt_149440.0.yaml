answer: |-
  Supervaluationism offers the only coherent account because it treats judicial rulings as contextually selecting a precisification, whereas epistemicism collapses by positing hidden facts that render legal standards unknowable and judicial discretion merely erroneous.

  The core failure of epistemicism in law is that it contradicts the normative function of legal standards. If Williamson is right and there is a sharp, unknowable boundary between 'reckless' and 'negligent', then the law fails to guide conduct precisely where guidance is most needed: at the margins. A driver cannot orient their behavior around a fact that is metaphysically fixed but epistemically inaccessible. In contrast, supervaluationism aligns with the legal reality that the boundary is not found but made. When a judge rules on a borderline case, they are not discovering a pre-existing sharp line; they are selecting one admissible precisification from a set of acceptable interpretations to resolve the dispute. This explains why judges act as if precision exists—because for the purpose of *this* judgment, a specific precisification must be adopted to generate a truth value—without committing to the metaphysical claim that this line existed prior to the ruling.

  This distinction becomes decisive when handling second-order vagueness, the vagueness of the borderline itself. Epistemicism requires a sharp boundary between 'definitely reckless' and 'borderline reckless', which implies there is a specific point where our knowledge cuts off even though the property remains fixed. This creates an absurd regress in legal reasoning: it suggests there is a fact of the matter about whether a case is too vague to judge, which itself cannot be known. Supervaluationism handles this naturally by allowing the set of admissible precisifications to shift depending on context. In clear cases, all admissible precisifications agree (supertrue); in borderline cases, they diverge. Second-order vagueness is simply the observation that the boundaries of the set of admissible precisifications are themselves not sharply defined. This mirrors legal practice, where judges acknowledge that some cases are "harder" than others without identifying a specific metric where 'hardness' begins.

  Ultimately, epistemicism breaks down because it turns the judicial admission of vagueness into a falsehood. If lawyers and judges agree there is no fact of the matter at the border, epistemicism insists they are all wrong about the nature of their own practice. Supervaluationism respects that admission while explaining the "pretend" precision as a functional necessity of adjudication. The law requires binary outcomes (liable/not liable), so the system forces a precisification where semantics allows flexibility. Epistemicism sees this as ignorance of the truth; supervaluationism correctly identifies it as the construction of authority.
