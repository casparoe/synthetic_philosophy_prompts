answer: |-
  Your hypothesis is astute: the deadlock is not a shortage of data, but a structural misalignment in how the disagreement is framed. To answer your core question directly: **this impasse is a layered mixture.** It is not *mainly* verbal, nor *mainly* substantive, but rather a case where conceptual ambiguity regarding "sameness" insulates a substantive disagreement about evolutionary dynamics from empirical resolution, all while resting on a normative divergence about the goals of historical science.

  Here is a structural diagnosis of the three layers, followed by a recommendation on what kind of progress is actually attainable.

  ### 1. The Structural Diagnosis

  **Layer One: The Semantic/Conceptual (The Criterion of Sameness)**
  You are correct that the two camps are operating with different identity conditions for "outcomes."
  *   **The Contingency Camp** is largely concerned with **token identity** (historical individuality). When they ask if history would repeat, they mean: *Would this specific lineage, with this specific genetic architecture, arise?* For them, a camera eye made of different proteins or neural wiring is a *different* outcome, even if it functions similarly.
  *   **The Convergence Camp** is concerned with **type identity** (functional equivalence). They ask: *Would a solution to this optical problem arise?* For them, the specific genetic substrate is implementation detail; the functional attractor is the outcome.

  Because "outcome" is undefined in the replay metaphor, both sides claim victory. The contingency side points to the uniqueness of *Homo sapiens* (token); the convergence side points to the ubiquity of flight or vision (type). This is not merely verbal nitpicking; it prevents the parties from agreeing on what would count as evidence against their position.

  **Layer Two: The Substantive (The Topology of Search Spaces)**
  Beneath the semantic layer lies a genuine empirical disagreement about the **topology of the fitness landscape**.
  *   **Contingency** implies a **rugged landscape** with many local peaks separated by deep valleys. Early accidents lock a lineage onto a specific peak; crossing the valley to a "better" peak is impossible.
  *   **Convergence** implies a **smoother landscape** or one with massive, deep basins of attraction. Perturbations might knock a lineage off course temporarily, but gravity (selection/physics) pulls it back toward the same global optimum.

  This is a substantive dispute about the *strength of constraints* relative to the *magnitude of noise*. However, because the semantic layer is unresolved, this substantive dispute is never quantified. They argue about "inevitability" (a binary) rather than "probability distributions over phase space" (a continuous variable).

  **Layer Three: The Normative (The Ideal of Explanation)**
  The bedrock layer is a divergence in what constitutes a successful scientific explanation in history.
  *   **Contingency** aligns with an **idiographic** ideal: Explanation consists of tracing the specific causal chain that produced *this* particular world. Success is narrative fidelity.
  *   **Convergence** aligns with a **nomothetic** ideal: Explanation consists of subsuming particulars under general laws or constraints. Success is predictive power and generalization.

  If one side believes history *must* be law-governed to be science, and the other believes history *must* preserve particularity to be history, no amount of phylogenetic data will reconcile them. They are optimizing for different epistemic values.

  ### 2. Prospects for Progress

  Given this diagnosis, a "verdict" favoring one side is impossible and undesirable. However, progress is possible if you shift the working group's focus from **adjudication** to **operationalization**.

  **A. Abandon the "Replay" Metaphor**
  The "replay the tape of life" thought experiment is heuristically poisonous. It implies a binary outcome (Same vs. Different) and suggests a counterfactual experiment that is inherently untestable.
  *   **Recommendation:** Reframe the question topologically. Instead of "Would it happen again?", ask: **"What is the size of the basin of attraction for this trait?"**
  *   **Progress Metric:** Move toward models that estimate the *accessibility* of phenotypic space. Formal models (e.g., NK landscapes, digital evolution platforms like Avida) can quantify how many genetic paths lead to a specific function. This converts a metaphysical debate into a measurable parameter (ruggedness vs. smoothness).

  **B. Distinguish Scale and Grain**
  The disagreement often dissolves when scale is specified. Contingency may dominate at fine grains (specific species, specific gene sequences), while convergence dominates at coarse grains (functional roles, biophysical limits).
  *   **Recommendation:** Require both sides to specify the **taxonomic and temporal grain** of their claims.
  *   **Progress Metric:** A negotiated agreement that "History is contingent at the level of lineage, but constrained at the level of function." This isn't a compromise; it's a recognition that both dynamics operate simultaneously at different resolutions.

  **C. Shift from "Inevitability" to "Constraint Strength"**
  The word "inevitable" is doing too much work. It suggests a probability of 1.0.
  *   **Recommendation:** Replace "inevitable" with **"canalized."** Discuss the strength of the channels that guide evolution.
  *   **Progress Metric:** Instead of arguing whether eyes *must* evolve, argue about the *conditions* under which eyes become highly probable. This invites empirical work on environmental prerequisites, rather than philosophical sparring about destiny.

  ### 3. Can Argument Move the Needle on Bedrock Intuitions?

  You asked if further argument can move the needle if the disagreement rests on incompatible intuitions about whether history is open or constrained.

  **Honest Answer:** No, not if framed as a metaphysical choice. If a participant believes the universe is fundamentally indeterministic at the historical level, no model will convince them otherwise.

  **However,** you can bypass the intuition by changing the **question type**.
  *   **Current Question:** "Is history contingent or convergent?" (Ontological)
  *   **Reframed Question:** "Under what specific dynamical conditions does contingency outweigh convergence, and vice versa?" (Methodological)

  By forcing the group to model the *boundary conditions* (e.g., "Contingency dominates when population size is small and selection is weak; convergence dominates when physical constraints are tight and selection is strong"), you make the bedrock intuitions irrelevant. You don't need to agree on the nature of history; you only need to agree on the parameters of the model.

  ### Summary Recommendation

  Your working group should not aim to resolve whether Gould or Conway Morris was "right." That is a historical question about dead scientists, not a scientific question about dynamics.

  **To break the deadlock:**
  1.  **Formalize "Sameness":** Explicitly distinguish *Token Identity* (genealogy) from *Type Identity* (function). Acknowledge that one camp values the former and the other the latter.
  2.  **Adopt a Phase-Space Framework:** Stop discussing "replaying the tape." Start discussing the **volume of accessible phenotypic space**.
  3.  **Seek Conditional Laws:** Aim for statements of the form "Convergence is expected *when* constraints X, Y, Z are present," rather than universal claims about history itself.

  If you make these shifts, the "immovable" disagreement will likely transform into a research program mapping the boundaries between contingency and convergence. If you do not make these shifts, the debate will remain a philosophical stalemate disguised as empirical inquiry.
