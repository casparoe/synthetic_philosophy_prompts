answer: |-
  This is a brilliant riff on the **Careenium** thought experiment from Douglas Hofstadter's *Gödel, Escher, Bach* (GEB). You've essentially recreated the central tension of the mind-body problem within a bureaucratic framework.

  To answer your questions directly: The grant office is operating under a theory of **Non-Reductive Physicalism**, but their administrative practices reveal a deep, unresolved conflict between **Ontological Reductionism** and **Functional Realism**.

  Here is the breakdown of that institutional split.

  ### 1. What theory does the policy presuppose?
  The policy presupposes **Level-Relative Causality**.

  *   **Line B (Physics)** assumes **Ontological Reductionism**: At the fundamental level, only the substrate (marbles/ants/particles) exists. Causality is closed at the physical level. Simmballs are *epiphenomenal*—they are shadows cast by the moving particles, not the movers themselves.
  *   **Line A (Audit)** assumes **Functionalism**: For the system to count as a "rig" worthy of funding, the high-level patterns (simmballs) must have efficacy. The system must be controllable via symbols, not just via particle manipulation.

  Together, they presuppose that while reality is made of physics, **causality is stratified**. They are betting that you can't predict or control the system solely by tracking particles; you *need* the symbolic layer to explain the output, even if the energy comes from the substrate.

  ### 2. Is it one consistent view or are they smuggling in two?
  They are smuggling in two, but they would argue they are merely switching **levels of description**.

  *   **The Smuggle:** They are smuggling **Pragmatic Realism** into an **Ontological Materialist** framework.
  *   **The Inconsistency:** If Line B is strictly true (simmballs have *zero* causal power), then Line A is impossible to satisfy. You cannot audit for symbolic steering if symbols are just descriptive tags. If the simmballs steer, they are not just tags; they are causal agents.
  *   **The Defense:** A Hofstadterian defense would be that causation itself is a macroscopic concept. "Pushing" is a high-level description of particle interactions. Therefore, simmballs *do* push, but only when viewed through the lens of the pattern. The office is inconsistent only if they demand a single-level explanation for a multi-level phenomenon.

  ### 3. If symbols don't push substrate, why does the audit exist?
  This is the most revealing part. The existence of the audit quietly commits the grant office to **Downward Causation**, regardless of what their physics line says.

  Here is what the practice admits:

  *   **Information is Physical:** The audit acknowledges that the *arrangement* of the substrate matters as much as the substrate itself. You cannot get the work done without accounting for the pattern. This aligns with Landauer's Principle: information processing has a thermodynamic cost.
  *   **The Locus of Control:** The audit exists because, practically speaking, **you cannot steer the careenium by manipulating individual particles.** It is computationally intractable. The only way to interact with the system is via the simmballs. Therefore, for all *functional purposes*, the simmballs are the causes.
  *   **The Commitment to Agency:** By demanding the simmballs steer the substrate, the office is demanding proof of **agency**. If the simmballs are just descriptive, the rig is a clockwork universe. If the simmballs steer, the rig is a cognitive system. The audit is a test to see if the system has crossed the threshold from "mechanism" to "mind."

  ### The Verdict
  The grant office is suffering from **Causal Exclusion Anxiety**.

  They know that if they admit symbols are real causes, they violate the closure of physics (Line B). But if they admit symbols are fake, they have no reason to fund "symbolic steering" rigs (Line A).

  The audit exists to force you to prove **Supervenience without Reduction**. They want you to show that the symbols *depend* on the physics (so they aren't magic) but *act* independently of the physics (so they are useful).

  In short: They want you to prove that the map can move the territory, provided the map is made of the same stuff as the territory. That is the paradox of the Careenium, and it is the paradox of us.
