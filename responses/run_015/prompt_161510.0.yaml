answer: |-
  **Halvard:** The memos say "solve," Neve. They do not say "destroy." They say "dispersion." If you convict on this, you are convicting on foresight, not intent. You're saying that because the government knew the Kelthi identity would fade, they intended it. That collapses *dolus specialis* into negligence.

  **Neve:** It collapses nothing. It acknowledges that "destroy" is a verb they know not to write. They deleted the census category. They paid people to change their ethnicity. They moved them into mixed towns where the language dies naturally. If I poison your water supply but call it "public health restructuring," I still intended your death. The specific intent is found in the coordinated mechanism, not the adjective.

  **Halvard:** But the mechanism here is assimilation, not extermination. Ninety people died in counterinsurgency, not execution squads. If you label this genocide, then every compulsory schooling law in the nineteenth century was genocidal. Every state that built a national language is a genocide state. You make the label so broad it covers half of modern history.

  **Neve:** There is a difference between integration and erasure. Integration lets you join the whole; erasure forbids you from existing as a part. The Kelthi under-twenty-fives don't identify as Kelthi because they were offered a better job; they don't identify because the state made that identity legally invisible. You worry about the label becoming cheap. I worry about the loophole becoming usable. You are teaching states exactly which buttons not to press. Don't shoot them; starve their culture. Don't ban the language; just remove it from the court. You give them a checklist for how to dissolve a group without triggering the Convention.

  **Halvard:** And if I agree with you, I give prosecutors a weapon to criminalize nation-building. But let's look at your "part." There are two million Kelthi in Maraven. Five million worldwide. The group exists comfortably across the border. If Maraven dissolves its two million, is that "in part" of the group?

  **Neve:** It's the part they can reach.

  **Halvard:** Then any state can destroy every member within its borders and claim the group survives globally. The Convention becomes extraterritorial only when the neighbors are weak. But if you say the denominator is the local two million, then "part" is trivially satisfied. Any discriminatory policy affects a part. Then intent has to do all the work alone. And we are back to reading tea leaves in internal memos.

  **Neve:** So you prefer a rule that lets a state wipe out a minority completely, provided the diaspora survives?

  **Halvard:** I prefer a rule that distinguishes between making a group suffer and making a group cease to exist. I'll make you a deal. Call this what it is: Crimes Against Humanity. Persecution. Ethnic Cleansing. Condemn it just as loudly. Punish it just as severely. But don't stretch "genocide" until it snaps. Keep the legal category narrow for the absolute worst cases—the physical destruction—and let other categories handle the cultural dissolution.

  **Neve:** You think the label is just rhetoric? It's not. "Genocide" carries a duty to prevent. Crimes Against Humanity are reactive; you prosecute after the bodies are found. Genocide is supposed to stop the process while it's happening. If we say this isn't genocide because no one is shooting, we lose the legal hook to intervene when the census is deleted, before the culture is dead. You save the precision of the law by sacrificing its preventive power.

  **Halvard:** But if the law is imprecise, it won't be enforced at all. States will ignore every accusation.

  **Neve:** They ignore them now because the binary is blind. It forces us to wait for bodies.

  **Halvard:** There was a proposal, maybe from a student of yours? Stop treating it as binary. Score the case on a profile: physical survival, biological continuity, cultural transmission, political standing. Rate each on a scale. Then set a legal trigger threshold separately. Like a medical diagnosis versus the threshold for treatment.

  **Neve:** Exactly. It forces us to look at the cultural transmission score without needing to prove a death camp exists. It captures the Kelthi reality—the language dying, the census deletion—without requiring us to lie about the body count.

  **Halvard:** And what does a court do with a score? "The defendant is guilty of genocide to the extent of 6.4 out of 10"? Law requires binary verdicts for jurisdiction. You can't sentence based on a profile. You need a trigger. If you separate the diagnosis from the threshold, you create a category of "sub-genocide" that no court knows how to punish.

  **Neve:** But the binary creates a category of "not genocide" that no politician feels compelled to stop. Your way protects the court's dignity. My way protects the group's visibility. If we use a profile, we admit that the Kelthi are suffering a specific kind of death, even if it isn't mass killing. The binary tells us to look away until the killing starts.

  **Halvard:** I'll concede this: the binary does distort attention. It makes us wait for the massacre to recognize the crime. If we called this "cultural genocide" explicitly, maybe the intervention comes earlier. But I hold that without the specific intent to physically destroy, you lose the distinctive wrong. The wrong here isn't that the Kelthi cease to exist; it's that they are coerced into not existing.

  **Neve:** And I hold that the result is the same either way. The group ceases to exist as such. If the law only protects the body and not the soul of the group, it protects nothing that matters to the victims.

  **Halvard:** So we are stuck. I need a line that courts can draw. You need a line that stops the erosion.

  **Neve:** We are stuck. But if we use your line, the Kelthi disappear, and the law says nothing happened.

  **Halvard:** And if we use yours, every assimilation policy becomes a potential crime, and the law says everything happened.

  **Neve:** Then perhaps the profile is the only way to show the difference without hiding the harm.

  **Halvard:** Perhaps. But until the law knows how to sentence a score, I cannot sign that verdict.
