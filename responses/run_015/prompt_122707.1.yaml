prompt: |-
  I've just been left about £25k by my gran, and somehow that's turned into me reading about moral uncertainty at 1am. The people I keep arguing with lean on one analogy: not knowing which moral theory is true is just like not knowing whether it'll rain tomorrow, so you do what you'd do under any other uncertainty — put credences on the theories and maximise expected moral value. Its carrying real weight for them: it's what turns "you should probably give most of it away" from a shrug into an actual calculation.

  Can you audit it properly? Correspondence table first — what plays the role of the states of the world, the probabilities, the utility scale — then where it breaks, and which of those breaks actually matter for the "give it away" conclusion rather than being curiosities. Two things I specifically want dealt with:

  1. In the rain case there's one scale you're averaging over. On my list, one theory only ranks outcomes by total wellbeing, one says there are constraints you must not violate whatever the results, one cares about what you were trying to do. I dont get what "expected" is averaging over when there's no shared unit, and just normalising everyone's rankings onto a 0–1 range feels like a stipulation that decides the answer. (Someone also told me a theory that insists you follow it and ignore the others can end up dominating the average — real bug or just an artefact?)
  2. I've been toying with a veto rule instead: any theory I give more than 10% gets to rule an option out outright if it forbids it, and I only average over whatever survives. Is the analogy supporting that, or is the rule sneaking in something the rain picture can't give me?

  Also flag anything the analogy quietly imports — e.g. that rival theories behave like exclusive possible states rather than rival decision rules. And if a different analogy does the job better, say so. British English please, and tell me plainly whether "just maximise expected moral value" survives.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Context:** The user has inherited £25k and is grappling with moral uncertainty (specifically, whether to donate it based on expected moral value calculations).
      *   **Time/Mood:** It's 1am, they're reading philosophy, likely feeling a bit overwhelmed or skeptical of the "maximise expected moral value" (MEMV) argument their interlocutors are using.
      *   **Task:** Audit the analogy "Moral Uncertainty = Empirical Uncertainty (Rain)".
      *   **Specific Requirements:**
          1.  Create a correspondence table (States, Probabilities, Utility).
          2.  Identify where the analogy breaks.
          3.  Distinguish between breaks that matter for the "give it away" conclusion vs. mere curiosities.
          4.  Address Specific Point 1: Incommensurability/Normalization (different scales, constraints vs. consequences) and the "theory domination" bug.
          5.  Address Specific Point 2: The "Veto Rule" (10% credence veto) vs. the rain analogy.
          6.  Flag hidden imports (e.g., theories as states vs. decision rules).
          7.  Suggest better analogies if applicable.
          8.  **Verdict:** Plainly state whether "just maximise expected moral value" survives.
          9.  **Tone/Style:** British English, plain speaking, rigorous but accessible.

  2.  **Deconstruct the "Rain Analogy" (Standard Expected Moral Value - EMV):**
      *   *Empirical Case:* States = Rain/No Rain. Probabilities = Weather forecast. Utility = Happiness/Dryness. Decision = Take umbrella/Leave it.
      *   *Moral Case:* States = Theory A is true / Theory B is true. Probabilities = Credence in Theory A/B. Utility = Moral Value according to Theory A/B. Decision = Donate/Keep.

  3.  **Address Specific Point 1: Incommensurability and Normalization:**
      *   *The Problem:* Rain utility is usually on a common scale (e.g., utils of comfort). Moral theories aren't. Utilitarianism says "maximize total happiness." Deontology says "don't lie." Virtue Ethics says "be courageous." How do you average "100 units of happiness" with "don't violate rights"?
      *   *Normalization:* Mapping everything to 0-1 is indeed a stipulation. It assumes inter-theoretic comparability. If Utilitarianism says donating gives 1,000,000 moral points and Deontology says keeping gives 1 (because it's your money), normalizing squashes the Utilitarian magnitude.
      *   *Domination:* If a theory says "Follow me or else infinite disvalue," it dominates the expectation. This is the "Pascal's Mugging" of moral uncertainty. Is it a bug? Yes, it makes the system fragile.
      *   *Impact on "Give it Away":* If Utilitarianism gets high credence and has high magnitude, normalization might *reduce* the pressure to give. If raw scores are used, it *increases* it. So this break *matters*.

  4.  **Address Specific Point 2: The Veto Rule:**
      *   *The Proposal:* If credence > 10% and theory forbids X, X is off the table.
      *   *Rain Analogy Check:* In rain, if there's a 10% chance of death by lightning, do you veto going out? Maybe. But if there's a 10% chance of rain, you don't veto going out, you take an umbrella.
      *   *Moral Specificity:* This treats moral theories like *constraints* (deontology) rather than *value maximizers* (consequentialism). The rain analogy assumes all theories are value maximizers.
      *   *Does it sneak something in?* Yes, it privileges non-consequentialist constraints over consequentialist trade-offs. It treats moral uncertainty as a risk management problem (avoiding catastrophe) rather than an optimization problem.
      *   *Impact:* This likely stops the "give it all away" conclusion if a theory says "you have special obligation to family."

  5.  **Identify Hidden Imports/Category Errors:**
      *   *States vs. Rules:* In rain, "Rain" is a fact about the world independent of my choice. In moral uncertainty, "Utilitarianism is true" is a fact about *how to choose*. The theories are decision rules, not just states.
      *   *Metanormativity:* The EMV approach assumes a "metatheory" (Maximise Expected Choice-Worthiness - MEC) that sits above the object-level theories. But what if the object-level theories reject MEC? (e.g., Kantianism might say "You must follow duty, not calculate expectations").

  6.  **Develop the Correspondence Table:**
      *   Need to map Empirical Uncertainty to Moral Uncertainty clearly.

  7.  **Evaluate the "Give it Away" Conclusion:**
      *   Does MEMV survive?
      *   *Argument for:* If you have significant credence in Utilitarianism/Effective Altruism, and you normalize, the pressure to donate is high because the "cost" to you is low compared to the "gain" to others.
      *   *Argument against:* Incommensurability makes the calculation arbitrary. The Veto rule blocks it. The "theories as rules" problem undermines the averaging.
      *   *Verdict:* It doesn't survive *unchallenged*. It's a heuristic, not a proof.

  8.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Empathetic, rigorous, slightly conversational (it's 1am philosophy), but authoritative.
      *   *Structure:*
          1.  Intro (Acknowledge the situation).
          2.  Correspondence Table.
          3.  The Breaks (General).
          4.  Tackling Point 1 (Incommensurability & Normalization).
          5.  Tackling Point 2 (The Veto Rule).
          6.  Hidden Imports (Metanormativity).
          7.  Better Analogies (Parliament/Committee).
          8.  Final Verdict.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I explain *why* normalization is a stipulation? Yes, because it assumes a common currency of "choice-worthiness."
      *   *Check:* Did I address the "domination" bug? Yes, mention scale sensitivity.
      *   *Check:* Is the Veto rule analyzed fairly? It's essentially a "risk-averse" approach to moral error.
      *   *Check:* British English spelling (maximise, programme, colour, etc.) and idioms (£, gran, maths).
      *   *Crucial Nuance:* The user asked if the breaks *matter for the conclusion*. I need to be specific. Incommensurability matters because it makes the calculation arbitrary. Veto matters because it blocks the utilitarian calculus.
      *   *The "States" issue:* This is the deepest philosophical objection. If a theory says "Maximise expected value" is wrong, then using EMV violates that theory *by definition*. This is the "self-undermining" problem.

  10. **Final Polish:** Ensure the verdict is plain. "No, it doesn't survive as a knockdown argument, but it remains a useful heuristic." (Or similar). Actually, looking at the literature (MacAskill, Bykvist, Ord), the consensus is that EMV is the leading view *but* has serious technical problems regarding inter-theoretic comparison. I should reflect that nuance. It survives as a *framework*, but not as a *calculation* that forces a specific result without arbitrary inputs.

      *Wait, one more thing:* The user mentioned the "theory that insists you follow it" dominating. This is the "fanaticism" problem. If I have 1% credence in a theory that says "Donating this money prevents infinite suffering," EMV says donate, regardless of the 99% credence in theories that say "Keep it." I need to mention this.

      *Okay, let's write.*
answer: |-
  First off, condolences on your gran, and well done for taking the inheritance seriously rather than just blowing it. It is properly unsettling to find yourself doing moral philosophy at 1am because of a bank transfer, but you have spotted the weak joints in the argument your friends are using.

  The "Moral Uncertainty = Empirical Uncertainty" analogy is the standard defence for **Maximising Expected Choice-Worthiness (MEC)**. It is elegant, but it is not a free lunch. Below is the audit you asked for.

  ### 1. The Correspondence Table

  To see where the machinery jams, we need to map the empirical case (Rain) onto the moral case (Theories).

  | Component | Empirical Uncertainty (The Rain Case) | Moral Uncertainty (The Inheritance Case) |
  | :--- | :--- | :--- |
  | **States of the World** | It rains / It does not rain. | Utilitarianism is true / Deontology is true / etc. |
  | **Probabilities** | Credence based on meteorological data (e.g., 40% chance). | Credence based on philosophical argument (e.g., 40% credence). |
  | **Outcomes** | You get wet / You stay dry. | People flourish / Rights are violated / Virtue is expressed. |
  | **Utility Scale** | A common scale of preference satisfaction (utils). | **Problem:** "Choice-worthiness" according to Theory A vs. Theory B. |
  | **Decision Rule** | Maximise Expected Utility (MEU). | Maximise Expected Choice-Worthiness (MEC). |

  ### 2. Where the Analogy Breaks (And Whether It Matters)

  Here are the structural faults. I have flagged whether they actually change your decision on the £25k or are just philosophical navel-gazing.

  **A. The Independence Problem**
  *   **The Break:** In the rain case, the weather is independent of your decision. In the moral case, the "truth" of the theory often dictates the *method* of decision.
  *   **Does it matter?** **Yes.** If you have 40% credence in Kantianism, and Kantianism says "Never calculate consequences, only follow duty," then using Expected Value to decide whether to follow Kantianism violates Kantianism itself. You are violating one of your live options by the very act of calculating the average.
  *   **Impact on £25k:** It undermines the legitimacy of the calculation. If a theory forbids the calculation, you can't just average it in with theories that allow it.

  **B. The Inter-theoretic Comparison Problem (Your Point 1)**
  *   **The Break:** In the rain case, 'dryness' is the same unit whether it rains or not. In the moral case, Utilitarianism measures in 'units of welfare', Deontology in 'adherence to constraints'. There is no exchange rate.
  *   **The Normalisation Stipulation:** You are spot on. Mapping everything to a 0–1 scale (variance normalisation) is not a discovery; it is a **stipulation**. It assumes that the *intensity* of a Utilitarian demand is equivalent to the *intensity* of a Deontological constraint.
  *   **The Domination Bug:** You mentioned a theory insisting you follow it. If one theory claims its stakes are infinite (or simply vastly larger than others), it dominates the expectation. This is not an artefact; it is a feature of expected value maximisation. If you have 1% credence in a "fanatical" theory that says keeping the money causes infinite suffering, MEC says you must donate, regardless of the 99% of theories that say keeping it is fine.
  *   **Impact on £25k:** **Critical.** This is where the "give it away" conclusion is manufactured. If you normalise scales, you dampen the Utilitarian pressure. If you don't, Utilitarianism (which usually deals in large aggregates of welfare) tends to swallow the other theories whole. The conclusion depends entirely on how you choose to scale the theories, not on the theories themselves.

  **C. The Metanormative Import**
  *   **The Break:** The analogy imports **risk-neutrality**. In finance, maximising expected value is for risk-neutral agents. Most people are risk-averse regarding money. The rain analogy assumes you should be risk-neutral regarding *moral error*.
  *   **Does it matter?** **Yes.** Why should you be risk-neutral about doing wrong? If there is a 10% chance an action is a grave sin, a risk-averse agent avoids it. A risk-neutral agent averages it out.
  *   **Impact on £25k:** The "give it away" argument usually relies on risk-neutrality (the potential good outweighs the certain loss to you). If you adopt moral risk-aversion, the calculation shifts back towards keeping the money to avoid the risk of violating personal obligations.

  ### 3. Auditing Your Two Specific Points

  #### Point 1: The Scale and the "Dominating Theory"
  You asked: *What is "expected" averaging over when there's no shared unit?*

  It is averaging over **credence-weighted rankings**, but only if you force a shared unit.
  *   **The Bug:** The "dominating theory" (e.g., "Follow me or else infinite disvalue") is a real bug in the MEC framework, known as the **Problem of Fanaticism**. It is not just an artefact. It means that a tiny credence in an extreme theory can dictate your entire life.
  *   **Does it matter for the conclusion?** Yes. The "give it away" push usually comes from Utilitarianism having a "larger scale" (millions of people benefit). If you accept raw scales, Utilitarianism dominates. If you normalise (0–1), you artificially reduce Utilitarianism's voice to match Deontology's. Neither approach is objectively correct; both are choices you make *before* the calculation. The calculation does not force the conclusion; your choice of scaling does.

  #### Point 2: The Veto Rule
  You proposed: *Any theory >10% credence gets a veto.*

  *   **Is the analogy supporting that?** No. The rain analogy does not support a veto. If there is a 10% chance of rain, you do not veto going out; you take an umbrella. A veto rule treats moral theories as **constraints** (deontological) rather than **values** (consequentialist).
  *   **Is it sneaking something in?** Yes. It sneaks in **moral risk-aversion**. It says "Avoiding the worst moral errors is more important than achieving the best moral outcomes."
  *   **Does it work?** It is a coherent alternative to MEC (often called 'My Favourite Theory' or 'Satisficing' approaches), but it is not derived from the rain analogy. It abandons the "maximise expected value" framework.
  *   **Impact on £25k:** This rule would likely save your £25k. If a theory says "You have special obligations to your family" has >10% credence, it vetoes "Give 100% to strangers." This is a defensible position, but you must admit you are no longer using the rain analogy; you are using a 'risk-management' analogy.

  ### 4. Hidden Imports and Better Analogies

  **The Quiet Import:**
  The rain analogy treats rival theories as **exclusive states of reality** (like "Rain" vs "Sun"). But moral theories are often **decision procedures**.
  *   If Theory A is true, I should calculate outcomes.
  *   If Theory B is true, I should ignore outcomes.
  *   You cannot do both simultaneously. The rain analogy hides this incompatibility by pretending all theories output a number on a common "choice-worthiness" scale.

  **A Better Analogy: The Parliamentary Model**
  Instead of weather, imagine a parliament where each party represents a moral theory.
  *   **Seats:** Allocated by your credence (e.g., Utilitarians get 40 seats, Deontologists 40, Virtue Ethicists 20).
  *   **Procedure:** They vote on what you do.
  *   **Why it's better:** It acknowledges that theories are *agents* with different goals, not just states of the world. It allows for log-rolling (trading votes).
  *   **The Catch:** You still need a voting system. Is it majority rule? (Tyanny of the majority theory). Does every party have a veto? (Gridlock).
  *   **Relevance:** In a parliament, a 40% Utilitarian bloc cannot simply impose its will on the 60% who think family obligations matter. This better reflects the intuition that the "give it away" conclusion is not a mathematical certainty.

  ### 5. The Verdict

  Does "just maximise expected moral value" survive?

  **Plainly: No.**

  It survives as a **heuristic**, but it fails as a **proof**.

  1.  **It is not calculation-neutral:** To run the calculation, you must make arbitrary choices about scaling (normalisation) and risk (neutrality vs. aversion). These choices determine the outcome more than the credences do.
  2.  **It is self-undermining:** If any of your credible theories reject expected value maximisation (e.g., "Do not trade rights for welfare"), using MEC violates those theories by definition.
  3.  **The "Give It Away" conclusion is not forced:** It only follows if you accept scale-sensitivity (Utilitarian numbers count more) and risk-neutrality. If you adopt a Veto rule (risk-aversion) or a Parliamentary model (negotiation), the obligation to donate most of the £25k evaporates or becomes much weaker.

  **Advice for the 1am philosopher:**
  Your friends are using a model that turns moral uncertainty into a technical optimisation problem to bypass the discomfort of choice. That is comforting, but it is not rigorous.
  *   If you keep the money, you are not "ignoring the maths." You are rejecting the premise that moral theories can be averaged like weather forecasts.
  *   If you donate, do it because you find the arguments for donating persuasive, not because a formula told you to.

  The inheritance is yours. The uncertainty is real. But the formula is not a get-out clause.
