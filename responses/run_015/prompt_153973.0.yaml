  *(Refining the "Weakest Joint")*: The definition of loop gain relies on a counterfactual: "change that would have been measured with instruments and help-seeking rates held at their pre-adoption values." This is empirically impossible to know directly. You estimate it from jurisdictions, but jurisdictions differ in other ways. This is the biggest vulnerability. I will highlight this.

