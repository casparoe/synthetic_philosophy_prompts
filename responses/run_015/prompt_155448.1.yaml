      *   *Demand Characteristics:* Orne's concept. Subjects guess the hypothesis and act accordingly.
      *   *Hacking's Looping:* Specifically about *interactive kinds* where the *knowledge of the kind* changes the *kind itself* over time, not just the individual instance. It's historical and dynamic.
      *   *Analysis:* Anticipatory looping looks like SFP on the individual level. But if enough people do it, it changes the *extension* and *intension* of the category before the clinician even touches them.
      *   *Verdict:* It's not *just* SFP. SFP is usually about making a specific prediction true. Anticipatory looping is about reshaping the *category* through pre-emptive alignment. It extends the "site" of looping from the clinic to the culture (Google, TikTok, self-help).
      *   *Risk:* If it's just SFP, it's boring psychology. If it's Hackingian, it's metaphysical/semantic instability. The distinction hinges on whether the *kind itself* drifts because of this anticipation, not just the individual's status.

  4.  **Address Question 2: Philosophical Upshot (Natural vs. Interactive Kinds):**
      *   *Standard Argument:* Interactive kinds are unstable because the classified react. Natural kinds (quarks) don't react.
