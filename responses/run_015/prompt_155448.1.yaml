      *   *Standard Looping:* Classification $C$ exists $\rightarrow$ Person $P$ is classified as $C$ $\rightarrow$ $P$ learns of $C$ $\rightarrow$ $P$ changes behavior/self-conception $\rightarrow$ $C$ drifts/changes.
      *   *Anticipatory Looping:* Classification $C$ exists (as a concept) $\rightarrow$ Person $P$ suspects they might be $C$ (or fears/hopes it) $\rightarrow$ $P$ changes behavior to align with/avoid $C$ $\rightarrow$ (Maybe) $P$ gets classified as $C$ later.
