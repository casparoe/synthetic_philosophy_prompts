prompt: |-
  You are a professional philosopher specializing in Kantian ethics and the philosophy of language, with additional working expertise in applied computer security and distributed systems. Please proceed through careful step-by-step reasoning, beginning with a brief brainstorming phase in which you sketch candidate mappings between Kantian concepts and engineering concepts before committing to a systematic translation.

  I am a senior backend engineer with deep fluency in concepts such as trust boundaries, threat models, principals and authentication, invariants and interface contracts, auditability and shared assumptions between services, and handling of adversarial inputs. I have only a general familiarity with Kantian ethics.

  Your task is to restate Kant's position that lying is always morally impermissible, including his treatment of the murderer at the door scenario in which a would-be murderer asks for the location of an intended victim, in the engineering vocabulary described above. Your translation should cover, at minimum, the following ideas: the distinction between lying and merely withholding information or misleading without stating a falsehood; the idea that lying violates a duty to humanity as such rather than merely harming a particular interlocutor; and the universalization thought that a general permission to lie would undermine the very possibility of reliance on testimony.

  To test the translation, apply it to the following three stipulated variations that I have constructed for this exercise: first, a homeowner who stays silent when questioned, knowing the questioner will likely interpret silence as absence of the victim; second, a homeowner who makes a technically true but deliberately misleading claim about the victim having been seen elsewhere recently; third, a smart doorbell assistant acting on the homeowner's behalf that automatically returns a false location to any unrecognized querier according to a preset policy.

  After the translation and its application to these cases, provide a residue report that distinguishes three categories: claims that translate cleanly, claims that can be rendered only with distortion, and claims that have no expression at all in my vocabulary. For each item of residue, assess whether it reveals a limitation of the engineering framework or suggests that the original Kantian claim was less clear or less substantive than it appeared. Keep the translation honest by not importing substantive engineering assumptions about harm minimization or protocol efficiency and presenting them as if they were Kant's own commitments.
