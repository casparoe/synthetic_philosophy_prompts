answer: |-
  Your intuition is excellent. The column you read is a classic example of "philosophy for laypeople" that sacrifices nuance for narrative punch. While it gets the basic definitions roughly right, it conflates distinct metaphysical theses, presents contested arguments as settled proofs, and uses loaded language to make perdurantism sound more radical (and endurantism more doomed) than most practitioners would agree.

  Here is a bit-by-bit breakdown of where the column is accurate, where it is misleading, and an assessment of the specific claims about Lewis, consensus, and punishment.

  ### 1. Bit-by-Bit Analysis

  **"Common sense says that you persist through time... Perdurantists deny this."**
  *   **Verdict:** **Misleading.**
  *   **Correction:** Perdurantists do *not* deny that you persist. They deny that you persist *by being wholly present at each moment.* They argue you persist by having different parts at different times. To say they "deny this" suggests they deny personal identity over time (like Hume or some Buddhists might), which is false. A perdurantist believes the person waking up is the same person who fell asleep, just as the top half of a candle is the same candle as the bottom half.

  **"Following the block-universe picture that comes out of relativity..."**
  *   **Verdict:** **Conflation.**
  *   **Correction:** This conflates **Perdurantism** (a theory about how objects persist) with **Eternalism** (a theory about which times exist). While they often go together, they are distinct. One can be a perdurantist and believe only the present exists (though this is rare), and one can be an eternalist and believe objects endure. Furthermore, relativity does not *force* the block universe picture; it is compatible with it, but metaphysical interpretations of physics are debated.

  **"So strictly speaking nothing persists: things are frozen into a static spacetime, and the passage of time is an illusion."**
  *   **Verdict:** **Loaded/Inaccurate.**
  *   **Correction:** This is the most "smuggled" rhetoric in the passage.
      1.  **Persistence:** Perdurantists insist objects *do* persist; they just analyze persistence as the aggregation of temporal parts.
      2.  **Frozen/Static:** This conflates the **B-Theory of Time** (all times are equally real) with fatalism or lack of causation. A "block universe" is not a frozen statue; causal processes still run through the block. Events at $t_1$ cause events at $t_2$.
      3.  **Illusion:** Many 4Dists argue the *passage* of time is mind-dependent, but calling it an "illusion" suggests our experience is fundamentally erroneous in a way that implies nihilism, which is not a necessary commitment of the view.

  **"Endurantists, by contrast, say that a thing is wholly present at every moment..."**
  *   **Verdict:** **Accurate.**
  *   **Correction:** This is the standard definition of endurantism.

  **"But David Lewis showed that this can't be right... endurantism cannot account for change at all."**
  *   **Verdict:** **Overstated.**
  *   **Correction:** David Lewis did formulate the famous **"Problem of Temporary Intrinsics"** (1986). The argument is: If an object is wholly present at $t_1$ (bent) and $t_2$ (straight), and it is the *same* object, it has incompatible properties. Lewis argued the only logical way to handle this is via temporal parts.
      *   *However:* He did not "show it can't be right." Endurantists have developed robust counter-strategies (e.g., properties are relations to times, or "adverbialism"—being bent-*ly* at $t_1$). Most metaphysicians view this as a stalemate or a cost-benefit analysis, not a disproof. Saying endurantism "cannot account for change at all" is hyperbolic; it accounts for change, but Lewis argued it does so less elegantly.

  ### 2. Is the claim about current opinion accurate?

  **"That is why most metaphysicians working today accept the four-dimensional view."**
  *   **Verdict:** **Outdated/Debatable.**
  *   **Context:** In the late 1990s and early 2000s (the height of David Lewis's influence), four-dimensionalism was indeed the dominant trend in analytic metaphysics, particularly in the US. Ted Sider's *Four-Dimensionalism* (2001) was a high-water mark for this view.
  *   **Current State:** The field has swung back. There has been a significant resurgence of endurantism and presentism in the last 15 years. While 4Dism remains a major position, claiming "most metaphysicians accept" it is no longer accurate. It is perhaps more accurate to say it is the dominant view in *some* circles, but the debate is very much alive and evenly matched.

  ### 3. The Punishment Objection

  **"On the worm view, punishing someone today for a crime committed last year would be punishing the innocent, since what suffers is only a later temporal part rather than the part that committed the crime."**
  *   **Verdict:** **Does Not Follow.**
  *   **Explanation:** This is a common intuitive objection, but perdurantists have a standard and logically consistent reply.
      *   **The Metaphysics:** On the worm view, *you* are not the temporal part; *you* are the entire worm. The temporal part is just a slice of you, like your hand is a slice of your body.
      *   **The Analogy:** If you commit a crime with your hand, we do not say, "We must punish the hand, not the person, because the hand did the action." We punish the *person* to whom the hand belongs.
      *   **The Application:** Similarly, if the "past slice" of the worm committed the crime, the *whole worm* is the moral agent. When we punish the "present slice," we are punishing the worm (the person). The fact that the punishment is experienced at a later temporal location does not make the worm innocent. The worm is a single entity extended in time; responsibility attaches to the entity, not just the slice.
      *   **Nuance:** There *are* genuine difficulties regarding psychological continuity and memory in 4Dism (if the later slice doesn't remember the crime, is punishment just?), but the column's claim that it is *metaphysically* punishing the wrong entity is false. The worm is the entity, and the worm is the one being punished.

  ### Summary of the "Loaded" Nature

  The column smuggles in **nihilistic implications** that perdurantists reject. By using words like "frozen," "illusion," and "deny persistence," it frames 4Dism as a cold, scientific elimination of human experience, while framing Endurantism as the "common sense" view that was logically destroyed by Lewis.

  A fairer summary would read:
  > "Endurantists say objects are wholly present at each moment. Perdurantists say objects are extended in time like worms, composed of temporal parts. David Lewis argued that perdurantism solves logical puzzles about change better than endurantism, though endurantists have responses. While 4Dism was very popular recently, the debate remains open. Regarding responsibility, perdurantists argue the whole 'worm' is the agent, so punishment is justified."

  Your suspicion was well-founded: the column presented a specific, aggressive interpretation of 4Dism as settled fact.
