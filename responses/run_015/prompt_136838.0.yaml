  I have a partial gloss: the domain B is countable when viewed from outside the model, in the sense that there is an enumeration of its elements by the positive integers available in the surrounding set-theoretic universe, yet B is a model of the axioms and so contains an element that B itself regards as uncountable. My difficulty is not with that gloss, but with a way of making the moral precise that I want to test against Skolem's own words.

  Define a set x to be Skolem-stable if, for every countable model M of first-order ZFC with x in its domain, M satisfies the statement "x is uncountable" if and only if x is uncountable in the surrounding universe of sets (that is, if and only if there is no bijection between x and the natural numbers in that surrounding universe). Using the passage quoted above, please help me understand what Skolem's argument does and does not show about Skolem-stability. I have three specific requests.

