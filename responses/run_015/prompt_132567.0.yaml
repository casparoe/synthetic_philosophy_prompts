  2.  **Part 1: Establishing the Epistemic Failure of Intractability:**

      *   *Premise 1:* Normative theories prescribe actions or judgments. For a prescription to be binding on a rational agent, the agent must be able to *know* what the prescription is.
      *   *Premise 2:* Knowledge requires justification. If a theory says "Do X," the agent needs a reason to believe "X is indeed the right thing."
      *   *Premise 3:* In problems like Kemeny-Young (finding the consensus ranking that minimizes disagreements), finding the *exact* optimal solution is NP-hard.
      *   *Connection:* If computing the correct answer is computationally intractable (requires exponential time relative to input size), a finite rational agent cannot verify the output within a reasonable timeframe.
      *   *Conclusion:* If the agent cannot verify the output, they cannot hold a justified belief that the output is correct. Therefore, the theory fails to provide *knowable* guidance. It's not just "too hard to do" (practical); it's "impossible to know for sure" (epistemic).

  3.  **Part 2: Contrast with Demandingness Objections:**

      *   *Consequentialism's Problem:* Often criticized for being too demanding (e.g., "give away all your money until you're as poor as those you help").
      *   *Nature of Objection:* This is about *motivational capacity* or *psychological burden*. The agent knows what to do but finds the cost too high to bear. It challenges the *feasibility of compliance*, not the *intelligibility of the rule*.
      *   *Intractability's Problem:* The agent might be willing to do the right thing, but they literally cannot determine *what* the right thing is with certainty.
      *   *Key Distinction:* Demandingness = "I know what you want, but I can't/won't pay that price." Intractability = "I want to pay the price, but I cannot verify what the bill is."
      *   *Epistemic vs. Practical:* Demandingness is practical/volitional. Intractability is epistemic/cognitive. A normative theory that generates outputs inaccessible to the reasoning faculties of the agent fails the condition of *publicity* or *transparency* required for rational endorsement.

  4.  **Part 3: The Approximation Counter-Argument:**

      *   *The Claim:* We don't need the exact optimum. We can use polynomial-time approximations (like MCMC sampling) to get "close enough." This makes the theory computationally feasible.
      *   *The Implicit Assumption:* Normative truth is a matter of degree, or being "probably right" is sufficient for obligation.

  5.  **Part 4: Rebutting the Approximation Defense (The Epistemic Point):**

      *   *Argument:* Normative theories usually claim to identify *the* right action, not *a probably right* action.
      *   *The Gap:* An approximation provides a probability distribution or a bound on error, not a definitive identification of the normative fact.
      *   *Justification:* If I act on an approximation, I am acting on a heuristic, not the principle itself. I cannot justify my action by saying "This is the optimal ranking." I can only say "This is likely near the optimal ranking."
      *   *The Shift:* This changes the normative theory. The theory is no longer "Maximize X" (Kemeny-Young); it becomes "Maximize X subject to computational constraints."
      *   *Epistemic Loss:* The agent loses access to the *truth condition* of the original theory. They are following a shadow of the theory, not the theory itself. If the theory defines rationality as adherence to the optimum, settling for an approximation is a failure of rationality, not a workaround. The "black box" nature of complex approximations also reduces transparency; the agent cannot trace *why* this output was generated, further degrading justified belief.

