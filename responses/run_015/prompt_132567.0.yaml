      *   **The Epistemic Rebuttal:** Explain why approximation alters the normative object and fails to provide justified belief in the specific prescription.
      *   **Conclusion:** Summarize the implication for normative theory construction.

  8.  *(Drafting mental check)*: Make sure not to say "NP-hard means impossible." It means "intractable for large inputs." The argument must hinge on the scaling problem making *verification* impossible for realistic social choice scenarios, thereby undermining the agent's ability to claim knowledge of the optimum.

  9.  *(Refining the Approximation Rebuttal)*: The key is that if the theory defines the "Right" as the "Optimum," then a "Near-Optimum" is technically "Wrong" by the theory's own lights, even if practically acceptable. The agent cannot believe "This is Right," only "This is Likely Near-Right." This distinction is the epistemic gap.

  10. **Final Polish:** Check flow and ensure no forbidden citations slip in. (Proceed to generate output).

