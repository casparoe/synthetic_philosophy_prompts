answer: |-
  The claim that computational intractability constitutes a merely practical inconvenience for normative theories rests on a misunderstanding of the relationship between rational agency and normative guidance. For a normative theory to successfully govern the conduct of rational agents, it must satisfy a condition of epistemic accessibility: agents must be capable of forming justified beliefs about what the theory prescribes in any given situation. When a theory relies on an aggregation rule that is NP-hard, such as the Kemeny-Young method for consensus ranking, it structurally precludes the possibility of such justified belief for non-trivial inputs. This is not a failure of will or stamina, but a failure of intelligibility. The argument proceeds by establishing the epistemic conditions of normative obligation, demonstrating how intractability violates these conditions, distinguishing this violation from standard demandingness objections, and finally showing why approximation schemes fail to restore the necessary epistemic link between the agent and the normative truth.

  **The Epistemic Condition of Normative Obligation**

  Normative theories function by mapping states of the world to deontic statuses (e.g., obligatory, permissible, forbidden). For a prescription to be binding on a rational agent, the agent must be able to identify the prescription. This requirement goes beyond the mere physical ability to perform an action; it requires the cognitive ability to verify that the action is indeed the one prescribed. If a theory dictates that an agent must perform action $A$ because $A$ maximizes a specific value function, the agent's rationality requires that they can, in principle, ascertain that $A$ is the maximizer. Without this ascertainment, the agent cannot act *because* the theory requires it; they can only act in accidental accordance with it.

  Justified belief in a normative output requires a derivational path from the theory's axioms to the specific prescription that is surveyable by the agent. If the computation required to traverse this path exceeds the computational resources available to the agent (time, memory, processing power), the derivational path is effectively severed. The agent is left with a black box: inputs go in, a recommendation comes out, but the logical connection guaranteeing the recommendation's correctness is inaccessible. In such cases, the agent lacks the warrant to believe the recommendation is correct. Consequently, the theory fails to provide action-guiding knowledge. It generates outputs that are, for the agent, epistemically opaque.

  **Intractability as Epistemic Opacity**

  Consider the Kemeny-Young rule, which seeks a consensus ranking that minimizes the sum of pairwise disagreements with individual voter rankings. While the definition of the optimal ranking is precise, finding it is NP-hard. This means that as the number of alternatives to be ranked increases, the time required to guarantee an exact solution grows exponentially. For a rational agent operating within finite temporal and cognitive bounds, there exists a threshold of complexity beyond which verifying the optimality of a ranking is impossible.

  This impossibility is not merely that the calculation takes too long to be useful (a practical constraint); it is that the agent cannot distinguish the true optimum from a near-optimum with certainty. In normative contexts, certainty regarding the deontic status of an action is often a prerequisite for rational commitment. If an agent cannot verify that a specific ranking is the unique consensus mandated by the theory, they cannot hold the justified belief that "This ranking is the rational requirement." They can only hold the belief that "This ranking might be the requirement." A normative theory that forces agents to act on mere conjecture regarding what is obligatory fails to function as a guide for rational conduct. It posits a normative fact that exists in principle but is inaccessible in practice, creating a gap between the truth of the theory and the agent's ability to grasp that truth. This is an epistemic failure because it renders the normative fact unknowable to the subject of the obligation.

  **Contrast with Demandingness Objections**

  It is crucial to distinguish this intractability critique from the familiar demandingness objections leveled against theories like act consequentialism. Demandingness objections argue that a theory requires too much sacrifice from the agent, imposing motivational costs or psychological burdens that are unreasonable. For example, if a theory requires an agent to donate all disposable income to charity, the objection is that this demand exceeds the agent's capacity for altruism or threatens their personal integrity.

  The intractability objection differs fundamentally in locus and kind. The demandingness objection accepts that the agent *knows* what the theory requires but argues that the cost of compliance is too high. It targets the *volitional* feasibility of the theory. The agent sees the cliff but refuses to jump. In contrast, the intractability objection argues that the agent *cannot know* what the theory requires. It targets the *cognitive* accessibility of the theory. The agent is willing to jump, but the fog is too thick to see where the ground is.

  A demandingness objection leaves the epistemic status of the prescription intact; the agent is certain of their duty but burdened by its execution. An intractability objection dissolves the epistemic status of the prescription; the agent is unburdened by the execution because they cannot identify the duty to be executed. Therefore, intractability is a deeper theoretical flaw. A theory that is too demanding can still guide an agent who chooses to accept the burden. A theory that is intractable cannot guide any agent, regardless of their motivation, because it fails to generate the knowledge necessary for guidance. It violates the "ought implies can" principle not in the sense of "ought implies ability to act," but in the stricter sense of "ought implies ability to know what to do."

  **The Failure of Approximation Schemes**

  A common rejoinder to the intractability critique is that exact optimality is not required for normative guidance. Proponents of this view suggest that polynomial-time approximation schemes, such as Markov-chain Monte Carlo (MCMC) sampling, can salvage the theory. These methods can produce a ranking that is provably close to the optimal ranking with high probability, without requiring exponential time. The argument is that since the approximate solution is "good enough," the normative theory remains viable.

  This reply fails because it conflates practical adequacy with epistemic justification. Normative theories typically define the right action in terms of specific truth conditions (e.g., "the action that maximizes utility" or "the ranking that minimizes disagreement"). An approximation does not meet these truth conditions; it meets a relaxed condition (e.g., "the action that likely approximates the maximizer"). When an agent utilizes an approximation, they are no longer following the original normative theory; they are following a heuristic surrogate.

  From an epistemic standpoint, this substitution is fatal to the agent's justified belief in the original theory's prescription. If the theory states that obligation is tied to the *exact* optimum, acting on an approximation means acting on a course of action that the theory technically classifies as sub-optimal (and thus potentially wrong). The agent cannot believe "This action is obligatory"; they can only believe "This action is probably near-obligatory." This probabilistic hedge undermines the categorical nature of normative claims. Furthermore, complex approximation algorithms often lack transparency. While they may converge on a solution, the internal logic of why a specific output was generated may be as opaque as the exact solution, merely reached faster. The agent still lacks a surveyable derivational path from the axioms to the output.

  Moreover, relying on approximation shifts the normative burden. It implicitly introduces a new normative premise: "Agents are only obligated to do what they can compute in polynomial time." But this is a different theory than the one originally proposed. The original theory claimed that rationality requires adherence to the optimal aggregation. The modified theory claims rationality requires adherence to the computationally feasible aggregation. The intractability critique shows that the *original* theory is epistemically bankrupt for finite agents. The approximation defense does not repair the original theory; it abandons it for a different one that admits computational limits as a constitutive part of the normative definition.

  **Conclusion**

  Computational intractability in normative aggregation rules represents an epistemic failure because it severs the link between normative truth and agent knowledge. A normative theory that prescribes outputs which cannot be verified by the agents bound by them fails to provide the justification necessary for rational endorsement. This is distinct from demandingness objections, which concern the cost of compliance rather than the knowability of the command. Finally, appeals to approximation schemes do not resolve this epistemic deficit; they merely replace the unattainable normative ideal with a tractable heuristic, thereby changing the subject rather than saving the theory. For a normative theory to be genuinely action-guiding, its prescriptions must be not only physically possible to perform but cognitively possible to identify. Intractability ensures they are the latter, rendering the theory inert as a guide for rational agency.
