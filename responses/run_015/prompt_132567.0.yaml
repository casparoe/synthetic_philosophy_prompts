prompt: |-
  Please construct a rigorous argument for the view that computational intractability—specifically, the NP-hardness of exact aggregation rules exemplified by optimal consensus-ranking problems such as Kemeny-Young—constitutes an epistemic, rather than merely practical, failure for normative theories that require rational agents to compute their prescriptions. Contrast this intractability-based critique with the familiar demandingness objections raised against consequentialism, showing precisely why the former targets explanatory accessibility and justified belief in a theory’s outputs rather than motivational cost or psychological burden. Then address the counter-argument that polynomial-time approximation schemes (for instance, Markov-chain Monte Carlo sampling for ranking aggregation) salvage the normative theory by substituting tractable computation for exact solution, and explain why this reply misses the epistemic point. Avoid bibliographic references, reading lists, and author citations; develop the argument solely from the conceptual connections among tractability, normative obligation, and the conditions under which a prescription can be genuinely understood and endorsed by the agents to whom it applies.
