answer: |-
  The philosophical puzzle of promising is deceptively simple: why does uttering the words "I promise" transform a future action from a mere option into a moral requirement? If the binding force of a promise were merely prudential, based on the fear of reputational damage or social sanction, then a secret promise broken without detection would entail no wrongdoing. Yet, intuition suggests otherwise. We feel bound even when no one is watching. To explain this, theorists generally divide into two camps: the reliance-harm view, which grounds obligation in the consequences of disappointed expectations, and the authority-transfer view, which grounds it in the normative power granted to the promisee. However, neither account fully captures the phenomenology of promise-breaking, specifically the phenomenon of *normative residue*. This essay argues that while the authority-transfer view provides the necessary deontic structure for interpersonal obligations, it must be supplemented by an aretaic layer concerning the promisor's integrity to fully explain the persistent moral remainder that survives compensation and release.

  To evaluate these competing accounts, we must employ the test of normative residue. Normative residue refers to the moral "stain" or lingering reason for amends that persists even after the tangible harms of a breach have been fully compensated and the immediate consequences dissipated. It is the difference between a cancelled debt and a broken trust; one can pay for a damaged car, but the apology remains owed. If a theory of promising cannot explain why this residue exists after the ledger of harm is balanced, it fails to capture the genuine obligation of the promise.

  The reliance-harm view, championed by theorists like T.M. Scanlon, posits that promises create obligations because they intentionally cultivate expectations upon which the promisee relies. To break a promise is to wrong the promisee by frustrating these legitimate expectations. While this explains why we should not disappoint others, it collapses under the weight of normative residue in cases of "harmless breach." Consider a promise to meet for lunch. I fail to appear, but unbeknownst to you, you were delayed by traffic and would not have arrived anyway. You suffered no reliance harm; your expectations were not practically frustrated. Yet, I still owe you an apology, and I am right to feel a pang of guilt. The reliance view suggests that if no harm occurred, no wrong was committed. But the normative residue remains. The obligation to keep one's word appears distinct from the obligation to prevent harm; the residue proves that the wrong lies in the breaking of the bond itself, not merely in the fallout.

  The authority-transfer view offers a more robust explanation for this residue. Associated with theorists like Seana Shiffrin and Joseph Raz, this model suggests that in promising, the promisor delegates a slice of their practical authority to the promisee. The promisee acquires a right to demand performance. When a promise is broken, the promisor usurps an authority they no longer possess, violating the promisee's normative standing. This explains the residue better than the reliance view: even if I compensate you for the lunch, I have still violated your right to command my action. The compensation fixes the harm, but it does not undo the usurpation of authority. The residue is the acknowledgment that a right was violated, not just a interest set back.

  However, the authority-transfer view encounters its own limit regarding normative residue in cases of release. If the obligation is purely a matter of the promisee's authority, then if the promisee waives that right ("I release you from the promise"), the obligation should vanish entirely. Yet, promisors often feel a lingering sense of failure even when released, particularly if the release was coerced by circumstances or if the promisor feels they abandoned a commitment too easily. Furthermore, the authority view struggles to explain the *intrapersonal* dimension of the residue: the damage to the promisor's own character. If the obligation is entirely external (owed to the promisee), why does the promisor feel a sense of self-betrayal that persists even after the promisee forgives? The authority model explains the promisee's right to resentment, but it leaves the promisor's agent-regret partially inexplicable.

  This gap necessitates a layered hybrid view. On this account, promises bind through two independent but interlocking mechanisms: a deontic reason tied to the authority transferred to the promisee, and a distinct aretaic reason tied to the promisor's integrity or fidelity. The deontic layer explains the promisee's standing to complain; the aretaic layer explains the promisor's duty to maintain coherence between their will and their actions. Normative residue is best understood as the scar tissue of the aretaic violation. When a promise is broken, even if the deontic debt is settled through compensation or release, the aretaic failure remains. The promisor has failed to be a person of their word.

  Critics of the hybrid view argue that it overcounts the moral cost, making promise-breaking "doubly wrong." If I break a promise, am I guilty of two sins—one against you and one against myself? This objection misconstrues the relationship between the layers. They are not additive penalties but distinct normative sources converging on a single act. The "wrongness" is not doubled; rather, the *explanation* of the wrongness is dual-aspect. The objection fails because it conflates the magnitude of the blame with the complexity of the normative landscape. We do not punish the agent twice, but we acknowledge that the moral remainder (the residue) has two components: the need to make amends to the other (deontic) and the need to restore one's own integrity (aretaic).

  Conversely, without this aretaic layer, the phenomenon of normative residue becomes inexplicable in cases where the deontic claim is extinguished. If a promisee forgives a breach completely, the authority view suggests the moral transaction is closed. Yet, the promisor may still rightly feel a need to engage in self-repair or acknowledge a failure of character. The residue is not just about the other person's claim; it is about the promisor's standing as a moral agent. The reliance view cannot explain this at all, as it focuses on consequences. The authority view explains the interpersonal claim but misses the intrapersonal cost. Only the hybrid view accounts for the full persistence of the residue: the deontic layer explains why the promisee was wronged, and the aretaic layer explains why the promisor remains bound by the memory of the commitment even after the debt is paid.

  Therefore, the authority-transfer view must be supplemented by an aretaic account of integrity. The authority view successfully establishes that promises generate genuine obligations rather than prudential reasons by creating a right in the promisee, which explains why compensation does not erase the wrong. However, it requires the aretaic supplement to explain why the normative residue persists even when the promisee waives their claim. The obligation of a promise is not merely a debt owed to another, but a commitment woven into the fabric of the self. To break it is to fracture both the interpersonal trust and the intrapersonal coherence, and it is this dual fracture that generates the enduring moral remainder we recognize as normative residue.

  Verdict: The authority-transfer view must be supplemented by an aretaic layer of integrity, as only this hybrid model fully explains the normative residue that persists after harm is compensated and the promisee's claim is waived.
