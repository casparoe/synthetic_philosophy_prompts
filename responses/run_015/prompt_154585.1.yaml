answer: |-
  # Taxonomy of Symbolic Causal Efficacy

  **Root Case:** A synthetic system contains a token $T$ with the formal structure "if $X$ then move arm." The arm moves.
  **Causal Question:** Is the movement caused by $T$'s *symbolic property* (downward causation) or only by the voltage patterns $V$ that instantiate it (substrate determinism)?

  The following decision tree partitions the logical space of answers using four diagnostic splits.

  ---

  ## I. The Decision Tree

  ### Split 1: Substrate Specificity
  **Question:** Does symbolic causation require a special substrate property (a *careenium*—a medium structurally tuned to allow high-level patterns to constrain low-level dynamics), or can it occur in any physical system implementing the function?

  *   **Branch A: Special Substrate Required (Careenium)**
      *   *Rationale:* Standard silicon is causally inert regarding symbols; only voltage moves. A careenium (e.g., plastic, self-modifying neural hardware) allows the pattern itself to exert leverage.
  *   **Branch B: Any Physical System (Universal)**
      *   *Rationale:* Substrate independence. If the function is implemented, the causation holds regardless of hardware specifics.

  ### Split 2: Causal Carrier
  **Question:** Must the symbol carry *semantic content* (reference, truth conditions) to do the work, or can *pure syntax* (formal shape/structure) do the work?

  *   **Branch A: Semantic Content**
      *   *Rationale:* The *meaning* of "move arm" (its relation to the world/goal) is the causal driver.
  *   **Branch B: Pure Syntax**
      *   *Rationale:* The geometric/logical shape of the token triggers the mechanism; meaning is irrelevant to the push.

  ### Split 3: Causal Path
  **Question:** Is the causal path *direct* (the *simmball* pushes—the symbolic unit has mechanical leverage), or is it always *mediated* by intermediate representational layers (symbol $\rightarrow$ voltage $\rightarrow$ actuator)?

  *   **Branch A: Direct (Simmball)**
      *   *Rationale:* The symbolic structure acts as a constraint or lever on the dynamics without translation into a lower-level code.
  *   **Branch B: Mediated**
      *   *Rationale:* The symbol supervenes on micro-states; the micro-states do the actual pushing.

  ### Split 4: Physical Closure
  **Question:** If downward causation occurs, does it *violate substrate closure* (requires non-physical influence), or can it be *reconciled with physical law* (compatibilism)?

  *   **Branch A: Violates Closure**
      *   *Rationale:* Causal exclusion holds; if the symbol pushes, physics is overridden.
  *   **Branch B: Reconciled**
      *   *Rationale:* Downward causation is a higher-level description of physical constraint; no energy is added, only channelled.

  ---

  ## II. The Leaves (16 Combinations)

  Below are the positions resulting from the four binary splits (A/B). Positions are named if defended in literature or the prompt's framework; otherwise, they are diagnosed.

  ### Branch A: Special Substrate (Careenium)

  1.  **Careenium / Semantics / Direct / Reconciled**
      *   **Position:** **Careenium Interactionism.**
      *   *Diagnosis:* Defended. Symbols are dynamical attractors in a plastic medium; meaning emerges as a constraint that channels physical energy without violating conservation.
  2.  **Careenium / Semantics / Direct / Violates**
      *   **Position:** **Strong Dualism (Vitalist Variant).**
      *   *Diagnosis:* Defended (historically). Claims semantic content is non-physical and overrides substrate physics in special biological/synthetic media.
  3.  **Careenium / Semantics / Mediated / Reconciled**
      *   **Position:** **Enactive/Embodied Cognitivism.**
      *   *Diagnosis:* Defended. Semantics is constituted by the sensorimotor loop (mediated by the body/substrate), compatible with physics.
  4.  **Careenium / Semantics / Mediated / Violates**
      *   **Position:** **Unnamed: Incoherent.**
      *   *Diagnosis:* If the path is mediated by physical layers, claiming a violation of closure is redundant; the mediation *is* the physical closure.
  5.  **Careenium / Syntax / Direct / Reconciled**
      *   **Position:** **Pure Simmball Direct-Causation.**
      *   *Diagnosis:* Defended (per prompt framework). Formal structures in a careenium act as physical levers; syntax has mass-like causal weight.
  6.  **Careenium / Syntax / Direct / Violates**
      *   **Position:** **Formalist Dualism.**
      *   *Diagnosis:* Unnamed/Unexplored. Claims syntactic shapes exert non-physical force. Unstable: syntax is usually considered intrinsic to physical arrangement.
  7.  **Careenium / Syntax / Mediated / Reconciled**
      *   **Position:** **Substrate-Sensitive Computationalism.**
      *   *Diagnosis:* Defended. Computation requires specific hardware to be causal, but operates via standard micro-state mediation.
  8.  **Careenium / Syntax / Mediated / Violates**
      *   **Position:** **Unnamed: Incoherent.**
      *   *Diagnosis:* Mediation implies physical transmission; asserting a closure violation contradicts the mechanism of mediation.

  ### Branch B: Any Physical System (Universal)

  9.  **Universal / Semantics / Direct / Reconciled**
      *   **Position:** **Pansemiotic Physicalism.**
      *   *Diagnosis:* Unnamed/Unstable. Claims meaning is intrinsic to all matter and drives dynamics directly. Lacks a mechanism for how "reference" pushes without mediation.
  10. **Universal / Semantics / Direct / Violates**
      *   **Position:** **Substance Dualism (Cartesian).**
      *   *Diagnosis:* Defended (historically). The mind (semantics) moves the body (arm) in any system, violating physical closure.
  11. **Universal / Semantics / Mediated / Reconciled**
      *   **Position:** **Teleosemantic Functionalism.**
      *   *Diagnosis:* Defended. Content is causal only insofar as it is realized by selected functions (mediated) within physical law.
  12. **Universal / Semantics / Mediated / Violates**
      *   **Position:** **Unnamed: Incoherent.**
      *   *Diagnosis:* Same as Leaf 4 & 8. Mediation entails physical closure; violation denies it.
  13. **Universal / Syntax / Direct / Reconciled**
      *   **Position:** **Computational Direct Realism.**
      *   *Diagnosis:* Unnamed/Unexplored. Claims syntax pushes directly in *any* hardware (even static silicon) without violating physics. Tension: Static hardware usually implies mediation.
  14. **Universal / Syntax / Direct / Violates**
      *   **Position:** **Magic Formalism.**
      *   *Diagnosis:* Unnamed/Incoherent. Claims formal shapes override physics in standard hardware. No known defense.
  15. **Universal / Syntax / Mediated / Reconciled**
      *   **Position:** **Standard Computational Representationalism (SCR).**
      *   *Diagnosis:* Defended (Dominant view). Symbols cause action only via micro-state implementation; substrate independent; fully physicalist.
  16. **Universal / Syntax / Mediated / Violates**
      *   **Position:** **Unnamed: Incoherent.**
      *   *Diagnosis:* Same as Leaf 4, 8, 12. Mediation precludes closure violation.

  ---

  ## III. Indistinguishable Pairs

  The tree fails to distinguish the following pairs under strict reductionist assumptions:

  1.  **Leaf 1 (Careenium Interactionism) vs. Leaf 15 (Standard Computational Representationalism).**
      *   *Why:* If one holds that all "downward causation" is merely a descriptive shorthand for complex micro-causation, the distinction between a "special substrate" (Careenium) and a "universal substrate" collapses. Both become descriptions of the same physical chain. The tree distinguishes them only if *structural plasticity* is granted ontological weight beyond mere complexity.
  2.  **Leaf 5 (Pure Simmball Direct-Causation) vs. Leaf 1 (Careenium Interactionism).**
      *   *Why:* Both posit direct causal leverage reconciled with physics. The split relies on whether "Syntax" (Leaf 5) can be causally potent without "Semantics" (Leaf 1). In many careenium models, syntax and semantics co-emerge, making the split porous.
  3.  **Leaf 3 (Enactive Cognitivism) vs. Leaf 11 (Teleosemantic Functionalism).**
      *   *Why:* Both rely on mediation and reconciliation. The distinction rests on whether the "Special Substrate" (biological/body) is essential (Leaf 3) or if the function can be universalized (Leaf 11). In practice, both often converge on embodied hardware requirements.

  ---

  ## IV. Committed Stance

  **Selected Position:** **Leaf 1: Careenium Interactionism** (Special Substrate / Semantics / Direct / Reconciled).

  **Defense:**
  Standard Computational Representationalism (Leaf 15) fails the root case because it cannot explain why the *symbol* causes the movement rather than the *voltage*. In a static substrate (Universal), the symbol is epiphenomenal to the voltage; the voltage does all the work. To grant the symbol causal efficacy, the substrate must be a **Careenium**: a medium where high-level patterns (symbols) constrain low-level dynamics (voltage/neural firing) through structural plasticity.

  This position selects **Semantics** over Pure Syntax because a token "if X then move arm" only causes movement if the system *cares* about X (semantic grip). Pure syntax (Leaf 5) is insufficient; a random shape does not move an arm unless it is interpreted. However, this interpretation must be **Direct** (the meaning constrains the dynamics immediately as a boundary condition) rather than **Mediated** (which reduces the symbol back to voltage). Finally, it must be **Reconciled** with physical law; we are not positing ghosts, but rather recognizing that in complex, plastic systems, high-level constraints are physically real causal forces (like the shape of a dam directing water) that do not violate conservation but do violate strict micro-deterministic exclusion.

  **Decisive Falsification:**
  This position would be proven false if it were demonstrated that a **static, non-plastic substrate (Universal)** could exhibit identical causal powers regarding symbolic tokens as a plastic Careenium. Specifically, if a standard von Neumann architecture could be shown to possess *symbolic* causal efficacy (where the symbol, not the voltage, is the difference-maker in a counterfactual analysis) without requiring structural plasticity or self-modification, then the "Special Substrate" requirement collapses. Alternatively, a formal proof of **Causal Exclusion** that demonstrates high-level constraints are *always* fully reducible to micro-causal chains without remainder (eliminating "Direct" influence) would force a retreat to Leaf 15 (Standard Computational Representationalism).
