answer: |-
  You are grappling with the central tension in single-case probability: the trade-off between **specificity** (using all available relevant information) and **stability** (ensuring the frequency data is statistically reliable and projectible). Your intuitions are not random; they are tracking a hidden variable regarding the *causal stationarity* of the underlying process.

  Here is the principle that best reconstructs your reasoning, followed by an analysis of where it succeeds and where your intuitions may be leading you astray.

  ### The Principle of Stable Specificity

  **Select the narrowest reference class for which the underlying generating process is causally stationary and the sample size is sufficient to yield a stable frequency.**

  This principle contains three operative clauses, each motivated by one of your cases:

  **Clause 1: The Specificity Mandate**
  *   **Statement:** *If a narrower class isolates a distinct causal propensity that differs from the broader class, you must use the narrower class.*
  *   **Motivating Case:** **The Sushi.**
  *   **Reasoning:** "All sushi" aggregates over hygiene standards, supply chains, and chef training. "This restaurant" isolates a specific causal mechanism (this kitchen's hygiene). Because hygiene is a relatively stable property of a business, the narrower class provides a more accurate propensity for *this* token event. Your intuition correctly identifies that the broader class introduces **heterogeneity noise** that dilutes the specific evidence you possess (your five prior meals).

  **Clause 2: The Stationarity Constraint**
  *   **Statement:** *Do not narrow the class if the underlying process is non-stationary (i.e., if the rules governing the outcome change over time or context) or if the narrower class lacks statistical stability.*
  *   **Motivating Case:** **The Transatlantic Flight.**
  *   **Reasoning:** You reject "this airline" because, in the context of modern aviation, safety is heavily regulated and standardized. The causal mechanism (physics + regulation + training) is homogeneous across airlines. Narrowing to one airline reduces the sample size ($N$) without isolating a distinct causal propensity, thereby increasing **statistical noise**. You intuitively recognize that aviation safety is a *systemic* property, not an *agent-specific* one.

  **Clause 3: The Structural Relevance Filter**
  *   **Statement:** *Exclude transient conditions from the reference class definition unless they alter the structural propensity of the system.*
  *   **Motivating Case:** **The Flight (Weather).**
  *   **Reasoning:** You argue rain shouldn't shift the probability. This implies you view the "flight system" (plane + crew) as robust enough that weather is a managed variable, not a structural risk factor. You are treating the probability as a measure of *systemic failure* rather than *situational accident*. (I will address the validity of this below).

  ---

  ### Diagnosis of the Stock Case

  Your conflict regarding the tech stock is the most philosophically revealing part of your query. You feel a pull toward the specific stock's history (like Sushi) but hesitate (like Flight).

  **The Principle explains this tension as a conflict between Clause 1 and Clause 2.**

  1.  **Why it feels like Sushi (Clause 1):** A specific company has unique management, products, and culture. Narrowing to "this stock" seems to isolate a specific causal propensity.
  2.  **Why it feels wrong (Clause 2):** Unlike restaurant hygiene, corporate viability is **non-stationary**. A restaurant's hygiene protocol today is likely the same as next month. A tech company's competitive advantage today may be obsolete in six months. The "generating process" of stock returns changes fundamentally over time.

  **Verdict:** The Principle of Stable Specificity predicts you should **reject the narrow class** ("this stock's history") in favor of the broader class ("tech stocks of similar market cap"), *unless* you have specific knowledge that the company's fundamental drivers are stable.

  Your intuition hesitates because you sense that past performance is not projectible. In the sushi case, the past *is* projectible (hygiene habits persist). In the stock case, the past is often a poor predictor of the future mechanism. The "pull" you feel toward the specific history is a cognitive bias (representativeness heuristic), but your hesitation is epistemically virtuous. The principle sides with your hesitation: **Stocks fail the Stationarity Constraint.**

  ---

  ### Prediction: The Rain Case

  **Case:** Will it rain in my city tomorrow?
  **Decision:** Bring an umbrella?

  **Application of the Principle:**
  1.  **Broad Class:** "All days in this city." (Too heterogeneous; ignores seasons).
  2.  **Narrow Class:** "Days with exactly these atmospheric conditions (pressure, humidity, front)."
  3.  **Stationarity Check:** Meteorological physics are stationary. $H_2O$ behaves the same way today as it did 50 years ago.
  4.  **Specificity Check:** Current atmospheric conditions are the distinct causal propensity for rain.

  **Prediction:** The Principle dictates you use the **narrowest class defined by current atmospheric conditions**, not the historical average for the date, and certainly not "all days."
  *   *Why:* Unlike the stock case, the physics of rain is stationary. Unlike the flight case, the "system" (the atmosphere) is highly sensitive to initial conditions.
  *   *Result:* You should look at the forecast (which calculates probability based on the "similar conditions" reference class). If the forecast says 80%, you use that, not the climatological average for this month.

  ---

  ### The Honest Statement: Where Your Intuitions Fail

  To be rigorous, I must point out where your gut violates the Principle of Stable Specificity.

  **1. The Flight/Weather Intuition is Likely False.**
  You stated: *"I don't think the probability should shift just because it's raining."*
  Clause 3 (Structural Relevance) only excludes transient conditions if they don't alter the structural propensity. In aviation, weather *is* a primary causal driver of accidents (turbulence, icing, visibility). By excluding "rainy days" from your reference class, you are violating the Specificity Mandate.
  *   **Correction:** The correct reference class is "Commercial transatlantic flights in the last 20 years **under similar weather conditions**." Your intuition here is likely driven by a desire for *control* (I can't change the weather, so I ignore it) rather than *accuracy*.

  **2. The Sushi Sample Size is Epistemically Risky.**
  You accept "5 times without sickness" as sufficient to lower the probability below the base rate.
  Clause 2 (Stationarity) requires the sample size to yield a *stable frequency*. For a low-probability event (food poisoning), $N=5$ is statistically negligible. If the true rate is 1%, 5 trials tell you almost nothing.
  *   **Correction:** Your intuition works here only because you implicitly assume **causal knowledge** (e.g., "I see the kitchen is clean") rather than pure frequency. If you are relying *only* on the 5 meals, you are overfitting to noise. The principle suggests you should weight the "all sushi" base rate much higher than your intuition does, unless you have direct evidence of the causal mechanism (hygiene).

  ### Summary
  Your intuitions are tracking **Causal Stationarity**.
  *   **Sushi:** High stationarity + High specificity $\rightarrow$ **Narrow Class.**
  *   **Flight:** High stationarity + Low specificity (across airlines) $\rightarrow$ **Broad Class.**
  *   **Stock:** Low stationarity + High specificity $\rightarrow$ **Conflict (Principle says Broad).**
  *   **Rain:** High stationarity + High specificity (conditions) $\rightarrow$ **Narrow Class (Forecast).**

  You are not being inconsistent; you are acting as a naive falsificationist, searching for the class where the causal rules remain constant. You simply need to correct for the non-stationarity of stocks and the causal relevance of weather.
