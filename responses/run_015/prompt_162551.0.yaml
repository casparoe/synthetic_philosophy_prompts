answer: |-
  1. Using the instrument
  Start at the top of the flowchart. Read each scenario or claim carefully. Select the answer that best matches your immediate intuition about whether knowledge or justification is present. Follow the corresponding branch to the next node. Continue until you reach a terminal leaf. Compare the leaf's description to your seminar readings to identify your philosophical position. If you land on an unnamed leaf, your combination of intuitions is theoretically possible but currently unoccupied by major theorists.

  2. The questions
  1. **LLM Case:** A machine outputs true directions without beliefs or intentions. Is this testimony? (Yes/No)
  2. **Stranger Case:** A stranger gives directions at a station. Must you have reasons to trust them? (Yes/No)
  3. **4-Year-Old Case:** A child is told the stove is hot. Can she know without understanding reliability? (Yes/No)
  4. **Expert Case:** An expert asserts a claim you cannot evaluate. Must you understand their evidence? (Yes/No)
  5. **Neighbor Case:** A honest neighbour is usually wrong. Does past failure defeat your justification? (Yes/No)
  6. **Anonymous Case:** One report versus many independent reports. Do multiple sources increase justification differently? (Yes/No)
  7. **Private Content Case:** A speaker describes their dream. Must you be able to verify the content? (Yes/No)
  8. **Sincere/Wrong Case:** A speaker is confident but mistaken. Is your justification lost if they are wrong? (Yes/No)

  3. The space they generate
  Eight binary questions permit 256 logical combinations. However, many paths are incoherent; for instance, demanding verification for private content while accepting expert assertion creates instability. The literature occupies roughly eight stable clusters within this space. Most theorists converge on specific answer patterns regarding reductionism and entitlement. The instrument filters logical noise to find philosophically live options, leaving many paths as empty leaves because no one holds those inconsistent intuitions.

  4. The tree
  ```text
  START: We sometimes know via testimony.
  |
  +-- Q1 (LLM): Agent required?
  |   +-- No --> LEAF: Reliabilist Reductionism
  |   +-- Yes --> Q2 (Stranger): Need positive reasons?
  |       +-- Yes --> Q3 (Expert): Understand evidence?
  |       |   +-- Yes --> LEAF: Local Reductionism
  |       |   +-- No --> Q4 (4-Year-Old): Child needs concepts?
  |       |       +-- Yes --> LEAF: Global Reductionism
  |       |       +-- No --> LEAF: [Empty: Incoherent Reductionist]
  |       +-- No --> Q5 (Private Content): Must verify?
  |           +-- Yes --> LEAF: Skepticism
  |           +-- No --> Q6 (Neighbor): Defeated by unreliability?
  |               +-- No --> LEAF: [Empty: Unattractive Dogmatism]
  |               +-- Yes --> Q7 (Sincere/Wrong): Justification requires truth?
  |                   +-- Yes --> LEAF: Transmission-Only
  |                   +-- No --> Q8 (Assurance): Based on interaction?
  |                       +-- Yes --> LEAF: Anti-Reductionism (Assurance)
  |                       +-- No --> LEAF: Anti-Reductionism (A Priori)
  |
  [Note: Default-and-Defeater maps to Anti-Red (A Priori) but denies distinct source.]
  ```

  5. The leaves
  **Reliabilist Reductionism:** Justification comes from reliable signals, not agents. *Awkwardness:* Cannot distinguish testimony from thermometer readings.
  **Local Reductionism:** Hearers need specific reasons for this speaker. *Awkwardness:* Makes ordinary acceptance too intellectually demanding.
  **Global Reductionism:** Hearers need only general reasons about testimony. *Awkwardness:* Requires empirical induction we rarely perform.
  **Skepticism:** Verification is always required. *Awkwardness:* Denies the starting commitment that we know via testimony.
  **Transmission-Only:** Testimony passes knowledge but generates no new warrant. *Awkwardness:* Cannot explain how communities expand knowledge collectively.
  **Anti-Reductionism (Assurance):** Entitlement arises from interpersonal assurance. *Awkwardness:* Excludes non-communicative information transfer.
  **Anti-Reductionism (A Priori):** Entitlement is a rational principle. *Awkwardness:* Makes testimonial knowledge insensitive to empirical reliability.
  **Default-and-Defeater:** Acceptance is default but not a distinct source. *Awkwardness:* Hard to distinguish verbally from A Priori Anti-Reductionism.

  6. Empty and crowded cells
  The "Incoherent Reductionist" leaf is empty because demanding specific reasons while denying conceptual capacity is contradictory. The "Unattractive Dogmatism" leaf is unoccupied because ignoring known unreliability is irrational. The instrument cannot fully separate **Default-and-Defeater** from **Anti-Reductionism (A Priori)**. Both accept default entitlement and defeaters. The difference is merely verbal regarding whether testimony is a "distinct source" of justification versus a preserved rational entitlement. A further question about the metaphysics of sources would be needed to detect this split.

  7. What would change my mind about this instrument
  I prioritize the LLM case as the trunk because it separates agent-based views from signal-based views, which is the sharpest contemporary divide. However, this ordering might be wrong. Traditional debates focus on Reductionism versus Anti-Reductionism. If I had to drop one question, I would remove the **Anonymous Case**. It drives a node about accumulation that most views answer similarly (many reports help), so it lacks discriminatory power. I would be convinced to reorder the trunk if evidence showed that agent-neutral reliabilism is not a live option for testimony, making the Reductionist split the true primary division.
