  *(Self-Correction during final review)*: Make sure I explicitly answer "which crux, if settled, would move at least one of the two sides." I need to pinpoint the *Conceptual/Metaphysical Gap*. If it were shown that concepts *constitute* reality (strong rationalism), conceivability wins. If concepts are merely psychological, it loses. That's the metaphysical crux hidden behind the epistemological debate.

