answer: |-
  This is a great angle. The phrase "technology is neutral" is a rhetorical Swiss Army knife: it cuts different ways depending on which blade you flip out. When a panelist uses it to deflect a question about autonomous targeting, they are usually smuggling in a specific philosophical claim without defending it.

  Here is the menu of claims hidden inside that one-liner, ranked from the banal to the radical, with an assessment of their truth value and their utility as a shield.

  ### 1. The Causal Claim (Boring)
  *   **The Claim:** Artifacts lack agency. Code does not pull triggers; humans do. A missile is ontologically distinct from a murderer.
  *   **Verdict:** **Trivially True.**
  *   **Does it defend the panelist?** **No.** It establishes that the *machine* cannot be morally blamed, but it says nothing about the *builder*. You can agree the gun is innocent and still blame the gunsmith for selling it to a known arsonist.
  *   **Why it fails here:** It addresses *who* pulls the trigger, not *whether the trigger should exist*.

  ### 2. The Liability Claim (Substantive)
  *   **The Claim:** Moral and legal responsibility attaches only to the intentional user of the tool, not the creator. The engineer is a merchant; the general is the agent.
  *   **Verdict:** **Substantive and Defensible (in limited contexts).** This is the standard legal framework for dual-use technology (e.g., knife makers aren't liable for stabbings).
  *   **Does it defend the panelist?** **Yes, personally.** It attempts to place the panelist outside the "moral crumple zone."
  *   **Why it fails here:** It collapses when the tool is designed for a specific, singular purpose. If you build a guillotine, you cannot claim neutrality when it beheads someone. Autonomous targeting systems are not general-purpose tools; their *only* function is to select targets for destruction.

  ### 3. The Instrumentalist Claim (The Core Illusion)
  *   **The Claim:** Technology is a passive vessel. Values are poured *into* it by users, not baked *into* it by designers. Features are engineering trade-offs (speed, accuracy), not ethical choices.
  *   **Verdict:** **False.** This ignores Value-Sensitive Design. Choosing to optimize for "false positives" over "false negatives" in a targeting algorithm is a political decision about whose life is expendable.
  *   **Does it defend the panelist?** **It looks like it does, but it doesn't.** It relies on the idea that the design phase is value-free.
  *   **Why it fails here:** As you noted, *declining to build the capability* is a design choice. By choosing to build it, they have already made a value judgment that the capability is worth having. Neutrality would have been abstention.

  ### 4. The Authority Claim (Political)
  *   **The Claim:** Decisions about artifacts belong to engineers (feasibility) and buyers (procurement), not to the public or ethicists. To question the build is to question the chain of command or market demand.
  *   **Verdict:** **Defensible as a power move, False as a neutral fact.** This is a claim about who gets to decide, disguised as a claim about the object.
  *   **Does it defend the panelist?** **Yes, institutionally.** It frames the questioner as overstepping their lane.
  *   **Why it fails here:** It admits the decision is political (who has authority) while claiming the tech is neutral. It's a contradiction: if the tech were truly neutral, authority wouldn't matter so much.

  ### 5. The Affordance Claim (Sociological)
  *   **The Claim:** Technology suggests uses (affordances) but does not dictate them. A hammer invites pounding, but you can use it as a doorstop.
  *   **Verdict:** **Substantive and True.** Tech biases behavior without determining it.
  *   **Does it defend the panelist?** **No.** In fact, it hurts them. If an autonomous targeting system *affords* rapid escalation or lowers the threshold for war (which it does), the builder is responsible for creating that bias, even if they didn't force the specific use.
  *   **Why it fails here:** It admits the technology shapes the user's political reality.

  ### 6. The Consent Gap Claim (Critical)
  *   **The Claim:** A design choice is neutral only if all stakeholders consented to the risk distribution. If the people bearing the cost (civilians in a strike zone) weren't in the room, the "neutrality" is a mask for power.
  *   **Verdict:** **Substantive.** This reframes neutrality as a lack of democratic input.
  *   **Does it defend the panelist?** **Absolutely not.** This is the argument *against* the panelist.
  *   **Why it fails here:** It exposes that "neutrality" is often a claim made by the powerful to silence the vulnerable.

  ### 7. The Inevitability Claim (Wild / Fatalistic)
  *   **The Claim:** The technology is a force of nature. If we don't build it, a rival will. The tech *wants* to exist; we are just midwives.
  *   **Verdict:** **False (Deterministic).** This is the "Moloch" argument—that market or geopolitical competition removes human agency from the equation.
  *   **Does it defend the panelist?** **Yes, cynically.** It absolves them of agency by claiming they had no choice.
  *   **Why it fails here:** It's a self-fulfilling prophecy. If everyone claims they have no choice, no one exercises choice.

  ***

  ### Diagnosis: What did the panelist mean?

  The hurried panelist almost certainly meant a mashup of **The Causal Claim** and **The Liability Claim**.

  They were thinking: *"I write code. I do not drop bombs. Therefore, my code is not bloody."*

  They rely on a **separation of stages**: Design is technical; Deployment is political. They are trying to wall off their labor from the consequences of that labor.

  ### The Counter-Punch: The "Omission" Test

  Does this reading survive the observation that *declining to build is also a decision*?

  **No. It shatters.**

  If the panelist claims the tech is neutral because "users decide how to use it," they are ignoring that **the existence of the tool decides how the user behaves.**

  1.  **Threshold Lowering:** An autonomous targeting system lowers the cognitive and political cost of launching a strike. That is not neutral; that is a structural bias toward violence.
  2.  **The Choice to Build:** By choosing to build the capability, the panelist has already voted "Yes" on the question: *"Should machines be allowed to select human targets?"* To claim neutrality *after* voting "Yes" is incoherent.
  3.  **The Choice of Safety:** If they built the system *without* certain safety constraints (e.g., human-in-the-loop), that is a value judgment that efficiency outweighs risk.

  **The Sharpest Retort:**
  "Neutrality implies you could have built it differently or not at all. If the design lowers the threshold for lethal force, or if you chose efficiency over human oversight, you haven't built a neutral tool. You've built a political argument in code."

  **For your piece:**
  The phrase "technology is neutral" is rarely a description of the artifact. It is a **jurisdictional claim**. It is the speaker saying, *"This conversation belongs to the engineers and the generals, not to you."* When you hear it, they aren't talking about the tech; they are talking about who owns the future.
