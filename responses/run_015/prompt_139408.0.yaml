answer: |-
  It is completely understandable that this argument leaves you with a lingering sense of unease, and you are right to feel that the structure of the reasoning is doing something peculiar that goes beyond the standard back-and-forth about extinction risks. The argument your friend was making is widely known as the Doomsday Argument, originally formulated by Brandon Carter and popularized by philosophers like John Leslie and Nick Bostrom, but the specific discomfort you are describing does not have a single catchy label like confirmation bias or sunk cost. Instead, what you are tripping over is a cluster of epistemological issues revolving around how we update our beliefs based on self-locating information, and whether facts we have known for a long time can suddenly acquire evidential weight just because we started treating them as data points in a statistical model. You are not running together two or three different things so much as you are noticing the friction points where this specific type of reasoning rubs against our ordinary intuitions about evidence and time.

  The first thing to name is the core mechanism your friend used, which relies on what philosophers call the Self-Sampling Assumption. This is the idea that you should reason as if you are a random observer sampled from the set of all observers who will ever exist. When you push back on the feeling that you are treating an old fact as a new discovery, you are touching on a variation of the Problem of Old Evidence. In the case of Einstein and Mercury, the orbit of Mercury was known long before General Relativity, but the theory provided a new framework that made the old fact probative. In your case, there is no new theory of physics, but there is a new framing of your own existence. You have known since you were ten that you are alive in the twenty-first century, but you never treated that fact as a random draw from an urn of all human lives until your friend introduced the argument. The unease comes from the sense that the evidential force shouldn't depend on when you decide to start treating your own biography as a lottery ticket. This is a good worry, not a bad one, because it highlights that the argument relies on shifting your epistemic stance toward yourself rather than discovering something new about the world.

  The second phenomenon you noticed, where the verdict slides depending on whether you hear the argument at twenty or sixty, is a known instability in this kind of indexical reasoning. If you run the calculation at twenty, your birth rank is fixed, but the total number of humans born so far is slightly lower than if you run it at sixty. Because the argument extrapolates the future total based on your position relative to the past total, doing the math later in history inevitably pushes the predicted doom date further into the future. This makes the conclusion seem dependent on your reading history or the calendar date rather than the actual resilience of the species. This is often discussed under the heading of reference class problems, where the outcome changes depending on how you define the group you belong to or when you define the moment of sampling. Your intuition that the conclusion is about your reading history rather than the species is sharp, because the argument effectively turns the moment of your contemplation into a variable that influences the prediction, which feels like it confuses the map with the territory.

  Then there is your comparison to the bus stop or the theatre run, which feels like common sense rather than a trick. This distinction is crucial and points to where the reasoning breaks down for many people. In the bus stop case, you are implicitly assuming that the bus service is a stable, ongoing process with a known mechanism that will eventually end the wait, and you are using your arrival time to estimate a parameter of that known process. With the Doomsday Argument, you are using your existence to infer the existence and duration of the process itself. The bus stop feels fine because the reference class is clear and the process is bounded by external factors you trust, like the bus schedule. With humanity, the process is unbounded and contingent. Furthermore, in the bus stop case, waiting longer usually increases your expectation that the bus will come soon, but it doesn't feel like the act of calculating the wait time changes the probability of the bus existing. The Doomsday Argument feels like a trick because it seems to suggest that merely realizing your position in history should lower your confidence in the future, almost as if the thought itself is corrosive. This difference is often attributed to the fact that in mundane cases, we have independent evidence for the process continuing, whereas with humanity, the argument asks you to strip away that independent evidence and rely solely on your birth rank.

  So, to answer your question directly, there is no single word for the feeling that an argument is leveraging old, self-locating facts to force a probabilistic update that feels unstable over time. You are observing the tension between Bayesian conditionalization and indexical information. The phenomenon is the discomfort of realizing that your perspective as an observer is being used as data, and that the value of that data seems to fluctuate based on when you choose to look at it. Your worries are genuinely good ones because they track the main philosophical objections to the Doomsday Argument. The fact that the conclusion shifts based on when you hear it suggests the argument is sensitive to the context of evaluation in a way that physical predictions usually are not. The fact that it treats old knowledge as new evidence suggests it is changing the rules of how you process information rather than adding information. And the fact that it feels different from the bus stop case suggests that the Self-Sampling Assumption might not apply uniformly across all types of processes.

  Ultimately, the reason this feels like a trick while the bus stop does not is that the bus stop reasoning is descriptive of a system you assume is real, while the Doomsday Argument is prescriptive about a system whose reality is in question. You are sensing that the argument tries to derive a substantive fact about the world from a mere fact about your perspective, and your intuition is telling you that something has to give. Most philosophers who work on this agree with you that the argument is deeply counterintuitive, and many reject it precisely because of the worries you listed. They argue that you cannot simply treat your own existence as a random sample without making additional assumptions about how observers are generated, assumptions that are far from obvious. So you are not being inconsistent; you are noticing that the argument requires a leap of faith about how probability works for observers that we do not require for buses or theatre runs. The name for what is bugging you is the friction between self-locating belief and objective probability, and it is a sign that you are thinking about the problem exactly where the pressure points are.
