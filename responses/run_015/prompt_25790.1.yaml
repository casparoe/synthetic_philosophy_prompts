answer: |-
  # Q&A Prep Sheet: "Free-Floating Reasons & The Derivative Nature of Relativity"

  **Context:** Department Ethics Workshop
  **Audience:** 50% Humean, ~3 Kantian Constructivists, 2 Sympathetic Realists, 1 Parfit Expert.
  **Strategy:** Your view is a robust realist, agent-neutral foundationalism. You are fighting a war on two fronts: the existence of desire-independent reasons (vs. Humeans/Kantians) and the structure of those reasons (vs. Realists/Parfit Expert).

  Below are the four objections most likely to arise, ordered by the damage they can do to your specific project.

  ---

  ### 1. The "Loss of Distinctiveness" Objection (The Parfit Expert)
  **Who:** The Parfit specialist (possibly joined by the sympathetic Realists).
  **Phrasing:** "You claim agent-relative reasons (like special obligations to family) are derivative of agent-neutral ones. But part of the *normative significance* of a special obligation is its *exclusivity*—the fact that *I* must save *my* child, not just that a child be saved. If you reduce this to an agent-neutral reason that I happen to be best positioned to fulfill, you've lost the 'mineness' of the obligation. How does your derivation account for the *normative force* of the relativity without simply smuggling the relativity back into the neutral base?"

  **Two-Minute Reply:**
  "I grant that the phenomenology of special obligations feels exclusive. However, we must distinguish between the *source* of the reason and its *distribution*. My claim is that the value grounding the reason is neutral (the value of the parent-child relationship), but the *application* is indexed to agents. Think of it like a universal law that assigns specific duties to specific coordinates. The 'mineness' isn't a fundamental normative primitive; it's a functional output of a neutral principle applied to a contingent fact (that I am this child's parent). If we treat relativity as fundamental, we fracture the normative domain into incommensurable perspectives. By deriving relativity, we preserve the unity of reason while explaining the phenomenology of exclusivity as a matter of *scope*, not *source*."

  **Where the Reply is Soft:**
  You are vulnerable to the charge that "scope" *is* "source." If the neutral principle says "Parents must save their own children," the reason *for me* still relies on the fact that *I am a parent*. The Parfit expert will press: "Is 'being a parent' a neutral fact? If so, why does it generate a relative reason? If not, you've admitted a relative fact is fundamental." You need a tighter account of the "derivation mechanism" than just "application."

  ---

  ### 2. The "Internalism/Motivation" Challenge (The Humeans)
  **Who:** The 50% of the room who are Humeans.
  **Phrasing:** "Let's grant for argument's sake that these free-floating reasons exist. You've severed the conceptual link between having a reason and having a motive. If I have no desire to promote the agent-neutral good, and no project that involves your 'derivative' obligations, in what sense is it *rational* for me to act? You're positing reasons that are essentially inert for agents without the right motivational set. Isn't this just a category error?"

  **Two-Minute Reply:**
  "This relies on a Humean theory of motivation that I reject. I defend a form of Externalism: reasons are facts that count in favor of action, regardless of whether they currently move the agent. The link to motivation is not constitutive but *normative*. If an agent fails to be moved by a free-floating reason, they are not 'pragmatically consistent'; they are *irrational* or *mistaken*. We shouldn't define rationality by the lowest common denominator of human psychology. The fact that a reason might not motivate a depressed or selfish agent doesn't mean it isn't a reason; it means the agent is out of touch with the normative reality."

  **Where the Reply is Soft:**
  This is the standard Externalist move, and the Humeans have heard it a thousand times. They will press the "Why be moral?" question. Your soft spot is the *explanatory gap*: You explain what a reason *is*, but you struggle to explain how it *grabs* an agent without a prior disposition to care about rationality. If they push on "What makes irrationality bad?", you risk circularity (it's bad because it violates reasons... which are what we ought to follow).

  ---

  ### 3. The "Metaphysical Inflation" Worry (The Sympathetic Realists)
  **Who:** The Naturalist and Non-Naturalist Realists.
  **Phrasing:** "We agree with you on agent-neutrality, but 'free-floating' sounds ontologically expensive. If reasons aren't grounded in natural facts or the constitution of agency, where are they? How do we access them? If you make them too independent, you invite an Evolutionary Debunking Argument: why think our cognitive faculties track these free-floating entities rather than just fitness-enhancing illusions?"

  **Two-Minute Reply:**
  "I'm not positing a 'third realm' of spooky entities. To say reasons are free-floating is to make a claim about their *authority*, not necessarily their ontological location. They supervene on natural facts. Regarding access: we access them through reflective equilibrium and rational intuition, just as we access logical or mathematical truths. As for debunking: if our evolutionary history selected for traits that track truth (like logical consistency), it's plausible it also selected for basic normative truths (like 'pain is bad'). The debunking argument assumes a disconnect between fitness and truth that isn't guaranteed."

  **Where the Reply is Soft:**
  The Naturalist in the room will pounce on "supervene." *Which* natural facts? If you can't specify the base, you look like a non-naturalist. The Non-Naturalist will worry that "free-floating" makes reasons too detached from the natural world to be action-guiding. You are walking a tightrope between queerness and reductionism. If you lean too hard on "intuition," you lose the Naturalist; if you lean on "natural facts," the Humeans will ask why *those* facts are reasons.

  ---

  ### 4. The "Heteronomy" Objection (The Kantian Constructivists)
  **Who:** The Constructivists.
  **Phrasing:** "You're treating reasons as objects to be discovered, which renders the agent passive. But normativity is constituted by the procedures of practical reason. By making reasons 'free-floating,' you subject the will to an external authority (heteronomy). Reasons only bind us because they are the laws we give ourselves through rational willing."

  **Two-Minute Reply:**
  "This assumes that 'external' equals 'alien.' A reason can be independent of my current desires without being alien to my rational nature. In fact, if reasons are free-floating truths about value, recognizing them is the highest exercise of autonomy, not a surrender. To say I 'legislate' reasons sounds like I can choose what counts as a reason, which leads to arbitrariness. I'm arguing that rational willing is *responsive* to value, not *creative* of it. Autonomy isn't making up the rules; it's binding oneself to the correct rules."

  **Where the Reply is Soft:**
  Constructivists view this as begging the question. They deny there *are* "correct rules" prior to the procedure. You are talking past each other on the definition of "autonomy." You won't convert them, but you need to show their view leads to relativism to neutralize the objection.

  ---

  ### 🛑 THE NIGHTMARE QUESTION (Pray nobody asks this)

  **The Question:**
  "You argue agent-relative reasons are derivative of agent-neutral ones. Let's call the principle that performs this derivation **D**. Is **D** itself an agent-neutral reason or an agent-relative reason?
  *   **If D is Agent-Neutral:** How can a purely neutral principle generate a genuinely relative conclusion without a remainder? (This returns us to Objection #1).
  *   **If D is Agent-Relative:** Then you have admitted at least one fundamental agent-relative reason (the reason to follow D). Your foundationalism collapses, and agent-relativity is fundamental after all."

  **Why it's a Nightmare:**
  It creates a dilemma that attacks the logical coherence of your "derivative" claim. It suggests your view is either explanatorily empty (neutral can't make relative) or self-refuting (the derivation rule is relative).

  **Emergency Exit:**
  "I would argue **D** is a structural truth about rationality, not a normative reason itself. It's akin to a logical rule of inference. Modus Ponens isn't 'true' in the same way a premise is true; it's the mechanism of truth-preservation. Similarly, **D** is the mechanism by which neutral value translates to relative duty. It doesn't need to be a reason itself; it's the architecture of the normative domain."
  *(Warning: This invites a follow-up on why this architecture isn't just a Kantian construct in disguise.)*
