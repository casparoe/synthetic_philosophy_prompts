answer: |-
  **TO:** Collections and Access Committee
  **FROM:** [Your Name], Volunteer Trustee
  **DATE:** 14 October 2023
  **RE:** Decision on Disposition of Settlement Examination Books (1836–1848)

  I recommend we proceed with full open publication, name- and place-indexed, provided we simultaneously launch the 'counter-register' crowdsourcing project to contextualise the entries. This staged combination satisfies our legal accessibility obligations while mitigating the ethical risks of amplifying official voices over pauper experiences.

  **Reasons for Recommendation**

  We must first address the practical constraint that renders the archivist's proposal for unindexed images untenable. The originals are too unstable for production, making the digital surrogate the sole access route. One of our trustees relies on a screen reader; images without underlying text are inaccessible to assistive technology. To comply with equality legislation and our own inclusion policies, we must provide machine-readable text. Once text extraction occurs for accessibility, withholding indexing becomes a deliberate obstruction rather than a protective measure.

  This leads directly to the asymmetry argument. Our holdings include fully indexed estate papers and vestry minutes relating to the gentry and parish officials. If we publish the poor's records as unsearchable images while the powerful remain searchable, we reproduce with public money the very class imbalance historical scholarship seeks to undo. We cannot justify creating a two-tier archive where the wealthy are findable and the poor are hidden. Furthermore, if we withhold indexing, commercial genealogy sites will likely scrape our images and apply their own OCR within a year. We would then lose control of the narrative without gaining any ethical protection, leaving the paupers represented solely by commercial algorithms rather than our contextual framework.

  However, the archivist's concerns regarding 'category-silence' and 'attributive ventriloquy' are valid. These records capture the clerk's vocabulary, not the pauper's voice. A keyword search returns legal categories, not human lives. Therefore, indexing alone is insufficient. We must adopt the 'counter-register' model concurrently. By inviting volunteers to append biographical data from baptisms, rate books, and newspapers, we ensure no individual appears solely as a legal status. This does not hide the record but surrounds it with context, allowing users to see the gaps in the official narrative rather than mistaking the narrative for the whole truth.

  **Communications Strategy**

  To the County Family History Society, we will state that we are granting their request for full indexing immediately, acknowledging their vital role in promoting access. We will invite them to partner on the counter-register project, framing it as an enhancement to their existing research rather than a barrier.

  In the report to the Heritage Fund, we will confirm that public-access conditions are being met in full through searchable text and open publication. We will highlight the counter-register as an innovative engagement programme that extends the grant's impact beyond simple digitisation, demonstrating active community interpretation of the material.

  **Conditions and Timetable**

  1.  **Publication:** The indexed database and images go live on 1st March next year.
  2.  **Accessibility:** All text must pass WCAG 2.1 AA standards for screen reader compatibility before launch.
  3.  **Counter-Register:** A pilot project recruiting ten volunteers begins 1st January to create the initial biographical supplement for five sample parishes.
  4.  **Metadata:** Search results must display a standardised warning note explaining the nature of settlement examinations and the likelihood of clerical abstraction.

  **Trigger for Revisit**

  We will revisit this decision if usage statistics show less than 5% engagement with the counter-register materials after twelve months, or if the volunteer cohort reports unsustainable workload pressures. Additionally, should the commercial indexing of our images occur despite our publication, we will convene to discuss whether our contextual metadata remains sufficient to distinguish our offering.

  This approach balances the imperative of access with the responsibility of interpretation. It acknowledges that while we cannot fill the silences in the record, we must not deepen them by restricting who is allowed to listen.

  **Signed:**

  [Your Name]
  Trustee, Marchwoodshire Record Office
