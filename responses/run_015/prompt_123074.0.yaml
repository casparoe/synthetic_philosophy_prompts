answer: |-
  **JOINT STATEMENT ON THE ONTOLOGY OF POPULAR WILL**

  **Signed:**  
  *The Substantive-Populist Camp*  
  *The Procedural-Pluralist Camp*  
  **Date:** 24 May 2024  
  **Context:** Following a structured adversarial collaboration on democratic theory.

  ### I. AGREED CLAIMS (THE SETTLED GROUND)

  We, the undersigned, acknowledge the following propositions as established facts or consensus views within political science and social choice theory. We accept these as the baseline for our continued disagreement.

  1.  **Historical Malleability:** The phrase 'the will of the people' possesses no fixed trans-historical definition. It has been utilised to justify both radical democratisation and authoritarian consolidation from the French Revolution to the present day. Its meaning is contingent upon the institutional and rhetorical context in which it is deployed.
  2.  **Formal Aggregation Limits:** We accept the mathematical validity of social choice theorems, specifically Arrow's Impossibility Theorem and the phenomenon of Condorcet cycles. We agree that no voting system can perfectly translate individual preferences into a collective ranking without violating at least one reasonable criterion of fairness (e.g., non-dictatorship, Pareto efficiency, or independence of irrelevant alternatives).
  3.  **Demographic Flux:** The electorate is not a static entity. Due to mortality, migration, and the ageing-in of new voters, the specific composition of 'the people' changes continuously. A majority coalition formed at Time A is not numerically identical to a majority coalition at Time B, even within the same jurisdiction.
  4.  **Performative Power:** We agree that speaking in the name of 'the people' is a speech act with constitutive power. To claim a mandate is not merely to describe a state of affairs but to alter the political landscape, often mobilising supporters and demoralising opponents regardless of the underlying empirical reality of voter preference.
  5.  **Epistemic Humility:** We acknowledge that no existing mechanism allows for the direct, unmediated observation of voter intent. All data (ballots, polls, protests) are filtered through institutional designs that shape the expression of preference.

  ---

  ### II. THE CRUXES OF DISAGREEMENT (THE CONTESTED GROUND)

  While we agree on the mechanical and historical constraints listed above, we fundamentally diverge on the *ontological status* of the popular will. The table below outlines the three specific cruxes identified during our collaboration. For each, we specify a concrete hypothetical mechanism and record the divergent predictions held by each camp.

  | Crux | Concrete Case / Hypothetical Mechanism | Substantive-Populist Position & Prediction | Procedural-Pluralist Position & Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Status of Non-Voters**<br>*(Does the 'people' include those who abstain?)* | **The Silent Majority Hypothesis:** In a referendum with 60% turnout, 40% abstain. The 'Yes' campaign wins 55% of votes cast (33% of eligible electorate). A policy is enacted. | **Position:** The 'people' is a moral entity that exists prior to the vote. Non-voters are often suppressed or disengaged but remain part of the sovereign body.<br>**Prediction:** If the policy harms the non-voting 40%, the mandate is illegitimate. The 'true will' may reside with the abstainers, and institutions must be adjusted to discern their latent preference (e.g., via compulsory voting or deliberative sampling). | **Position:** The 'people' is a legal construct defined by the procedure. Non-voters have waived their claim to authorship of the decision for that cycle.<br>**Prediction:** The mandate is valid solely based on the rules established *ex ante*. To count non-voters is to introduce an arbitrary, unmeasurable variable. Legitimacy derives from the fairness of the process, not the completeness of the participation. |
  | **2. Temporal Turnover**<br>*(Does demographic change dissolve authority?)* | **The 15-Year Mandate:** A government elected in 2010 enacts a 50-year infrastructure treaty. By 2025, 45% of the 2010 electorate has died or emigrated; 20% of the 2025 electorate were minors in 2010. | **Position:** The 'people' is a trans-generational entity. The 2010 decision reflects a enduring national interest that binds the current population.<br>**Prediction:** The treaty remains binding. To revoke it based on demographic turnover is to violate the continuity of the nation. The 'will' is a debt owed to the past and future, not just a snapshot of the present. | **Position:** Authority is strictly contemporaneous. Since the specific individuals who authorised the treaty are largely gone, the 'principal' no longer exists.<br>**Prediction:** The treaty is vulnerable to democratic review. The 2025 electorate constitutes a new sovereign body. Binding them to a 2010 preference is a form of 'dead hand control' incompatible with political equality. |
  | **3. Revelation vs. Construction**<br>*(Do algorithms find or make the will?)* | **Real-Time Digital Plebiscite:** A state-sponsored app allows citizens to update policy preferences continuously. An algorithm aggregates this into a 'Live National Will' dashboard used by legislators. | **Position:** **Revelation.** The technology removes the friction of elections, allowing the latent, unified general will to surface without the distortion of party intermediaries.<br>**Prediction:** The dashboard will stabilise around coherent, long-term public goods once short-term noise is averaged out. It recovers the 'true' preference that ballots obscure. | **Position:** **Construction.** Preferences are endogenous to the framing. Real-time updating creates feedback loops where the 'Live Will' chases media cycles.<br>**Prediction:** The dashboard will exhibit high volatility and susceptibility to manipulation (e.g., bot swarms or agenda-setting). It does not discover a will; it manufactures a fluid, unstable aggregate that cannot sustain accountability. |

  ### III. CONCLUDING OBSERVATION

  We conclude that our disagreement is not regarding the *mathematics* of voting or the *history* of the phrase, but regarding the **metaphysics of the constituency**.

  The Substantive-Populist signatories maintain that 'the people' is a discovery problem: the correct institution will eventually reveal the pre-existing will. The Procedural-Pluralist signatories maintain that 'the people' is a design problem: the institution necessarily constructs the will, and therefore the only ethical metric is the fairness of the construction process itself.

  We agree to disagree on whether the 'will' is found or made, but we commit to subjecting both claims to empirical testing via the mechanisms outlined above.

