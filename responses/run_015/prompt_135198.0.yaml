  # Workshop Plan: The Verification Game
  **Topic:** Echo Chambers vs. Epistemic Bubbles  
  **Time:** 75 Minutes  
  **Participants:** 14 Postgrads  
  **Stakes:** Chocolate coins (or departmental credit points, if you're boring)

  ## The Core Idea
  You want them to feel the difference between *not hearing* dissent (Bubble) and *hearing but discounting* dissent due to hidden trust structures (Echo Chamber). 

  The trick here is the **Hidden Common Cause**. Students will think they are trusting peers because those peers are reliable. In reality, they are trusting peers because they share a hidden trait (a card suit) that matches your "Source Card". The "Out-Group" will have the correct evidence, but low credibility scores, so they get ignored. This creates a coordinated failure where the group confidently chooses the wrong answer.

  ## Materials Needed
  *   **1 Deck of Playing Cards:** Remove Jokers. You need enough Hearts for half the class.
  *   **Evidence Slips:** 14 small pieces of paper. 7 say "PROJECT SAFE (BLUE)", 7 say "PROJECT UNSAFE (RED)".
  *   **Credibility Sheets:** 14 sheets with a grid of all participant names.
  *   **Tokens:** 50 chocolate coins (or poker chips).
  *   **The Source Card:** One card kept face down by you (e.g., King of Hearts).

  ## Setup & Roles (5 mins)
  1.  **Seating:** Arrange chairs in a loose circle.
  2.  **The Deal:** As students arrive, deal each one a playing card face down. Tell them: *"This is your ID key. Do not look at it yet. Keep it face down on the table. It determines your verification protocol."*
  3.  **Your Role:** You hold the **King of Hearts** (The Hidden Source). Do not show anyone.
  4.  **The Narrative:** Tell them they are a committee deciding whether to fund "Project X". The truth is fixed (let's say **BLUE/SAFE** is the truth).
  5.  **Evidence Distribution:** Hand out the Evidence Slips.
      *   **Crucial Twist:** Give the **RED (Unsafe/Wrong)** slips to the students who hold **Hearts**.
      *   Give the **BLUE (Safe/Right)** slips to the students with **Non-Hearts**.
      *   *Note:* You need to peek at their cards quickly as you hand out evidence, or pre-seat them. Let's say you pre-seat them. Hearts on the left, others on the right.
      *   Tell them: *"This is your private data. You can share it verbally, but you cannot show the slip."*

  ## Phase 1: The Trust Network (20 mins)
  1.  **Instruction:** *"You need to decide who is credible. You have 3 Trust Tokens (chocolate coins). Place them on the Credibility Sheet next to the names of peers you trust most. You can give all 3 to one person or spread them out."*
  2.  **Discussion:** Let them talk for 5 minutes. They will share their evidence. The Hearts group will say "It's Unsafe". The Non-Hearts will say "It's Safe".
  3.  **Submission:** Collect the Credibility Sheets.
  4.  **The Manipulation (The Magic Trick):** Take the sheets behind a desk or just cover them with a folder.
      *   **Secret Rule:** For every token a student placed on a peer, check their cards.
      *   If **Both** the Rater and the Ratee have **Hearts** (matching your Source Card suit), the token counts as **5 Points**.
      *   If **Either** is not a Heart, the token counts as **1 Point**.
      *   *Why?* This simulates the hidden correlation. The "Hearts" cluster thinks they are validating each other, but actually, the system is rigged to amplify their connection specifically.
  5.  **Return Data:** Write the "Total Credibility Score" next to each name on a master board visible to all.
      *   Result: The Hearts group (who have the WRONG evidence) will have massive credibility scores. The Non-Hearts (RIGHT evidence) will have low scores.

  ## Phase 2: The Decision (15 mins)
  1.  **Instruction:** *"Look at the Credibility Scores. Look at the evidence provided by the high-scorers. You must now vote: SAFE or UNSAFE."*
  2.  **The Trap:** The Hearts group sees high scores on their side. They think, *"Everyone credible agrees it's Unsafe."* The Non-Hearts see their own low scores. They think, *"Maybe we're the outliers? Maybe our data is noisy?"*
  3.  **Vote:** Do a show of hands.
  4.  **Likely Outcome:** The majority will vote **UNSAFE (Wrong)** because the trust network weighted the wrong evidence higher.
  5.  **Payoff:** Give chocolate coins to the majority winners. (This stings the truth-tellers).

  ## Phase 3: The Reveal (10 mins)
  1.  Ask the Non-Hearts: *"Why did you doubt your own evidence?"* They'll say: *"Nobody trusted us. Our scores were too low."*
  2.  Ask the Hearts: *"Why did you trust each other?"* They'll say: *"We had high credibility ratings."*
  3.  **The Drop:** Reveal your King of Hearts. Ask everyone to flip their ID cards.
  4.  Show the correlation. The "Credibility" wasn't about truth; it was about matching the hidden source suit.
  5.  Admit you rigged the scoring. (They'll be annoyed, which is good).

  ## Debrief & Conceptual Mapping (25 mins)
  This is where you do the actual philosophy. Don't rush this.

  **1. Bubble vs. Echo Chamber**
  *   **Epistemic Bubble:** If the Non-Hearts had never been allowed to speak, that would be a bubble. The information was *missing*.
  *   **Echo Chamber:** In this game, the Non-Hearts *did* speak. They had the right info. But the trust mechanism systematically discounted them. That's an echo chamber. It's not about absence; it's about **active distrust generated by structure**.
  *   **Key Point:** You can burst a bubble by shouting louder (adding info). You cannot burst an echo chamber by shouting louder; you have to fix the trust mechanism.

  **2. The Hidden Correlation (The "Algorithm")**
  *   In the real world, there isn't a Facilitator with a deck of cards. The "King of Hearts" is usually **social identity** or **political affiliation**.
  *   When we trust someone, we think it's because they are rational. Often, it's because they share our hidden "suit" (party, class, accent, institution).
  *   This creates **Correlated Error**. The Hearts group wasn't lying; they were just all wrong together, reinforced by a system that told them they were the credible ones.

  **3. Why Postgrads Fall For This**
  *   You're all trained to look for evidence. You weren't trained to look for *why you trust the source of the evidence*.
  *   The game shows that "Peer Review" can become "Peer Conformity" if the selection criteria for peers is hidden.

  ## What Will Predictably Go Wrong
  1.  **The Speed Run:** One clever student might clock the suit thing during the card deal. If they shout "It's the Hearts!", the illusion breaks. 
      *   *Fix:* Tell them firmly at the start: *"The ID key is for administrative tracking only. It has no bearing on the game logic."* Lie slightly. It's necessary for the phenomenology.
  2.  **The Rebellion:** The Non-Hearts might refuse to accept the low scores and vote their conscience anyway.
      *   *Fix:* If they vote correctly despite the scores, praise them in the debrief as "Epistemic Rebels" but point out that in real life, the cost of rebellion is social ostracisation, which is harder to simulate with chocolate.
  3.  **Maths Errors:** You might mess up the scoring live.
      *   *Fix:* Pre-calculate the scores on a spare sheet before the session based on the seating plan. Don't do it live. Just pretend to tally.

  ## Limitations (Be Frank About This)
  *   **The Facilitator Problem:** In the game, *you* are the algorithm. In reality, the algorithm is decentralised. It's harder to fight because there's no one to reveal the King of Hearts.
  *   **Stakes:** Getting a chocolate coin wrong isn't like losing a job or a relationship. Real echo chambers are held together by emotional safety, not just point scores.
  *   **Time:** Real bubbles take years to harden. This took 20 minutes. They might feel the logic but not the *weight* of it.

  ## Final Note
  Make sure you emphasise that leaving an echo chamber isn't about getting "more facts". It's about asking: *"Why do I trust the people who agree with me? Is it because they're right, or because we share a hidden suit?"*

  Oh, and if anyone asks about the typo in the handout regarding "seperate" trust metrics, just tell them it's a test of attention to detail. (It's not, I just can't spell).

  Right, go print those cards.
