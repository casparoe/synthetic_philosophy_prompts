prompt: |-
  I am preparing a ninety-minute seminar session for my graduate course in collective epistemology on a conceptual pairing I have been working through with colleagues: HCH—humans consulting copies of themselves—and factored cognition, treated not as an AI alignment protocol but as a philosophical idealization of deliberation. My students are advanced philosophy undergraduates and first-year graduate students; they have read some social epistemology and are comfortable with thought experiments, but none have background in decision theory or machine-learning safety literature, and I do not want to import that apparatus. The idea I want them to grasp is that factored cognition presupposes a particular kind of epistemic closure—namely, that decomposing a judgment into sub-problems and distributing them across copies of the same reasoning agent can preserve coherence without introducing the kind of genuine alterity that makes actual human committees unstable—while recognizing that this is precisely an idealization, one that collapses the distinction between restructuring one's own reasoning and being genuinely persuaded by another mind. I have been discussing with a colleague whether this reveals something about democratic deliberation or only about the conditions under which rational agents can be treated as fungible nodes, and I want the session to turn on that tension rather than on technical details.

  Plan the explanatory arc for me: in what order must the components be introduced so that the idealization is visible as an idealization rather than as a naive model of teamwork, which concrete scenario should carry the entire discussion and what properties must it possess and lack (and why not a standard case like scientific peer review or a corporate board, if you reject those), which misconceptions will the students form—my guess is they will conflate this with Adam Smith-style division of labor and will assume that consulting HCH means asking an expert—exactly where in the sequence each misconception should be intercepted, what single question at the end will reveal whether they have understood the conceptual tension rather than merely memorized the structure, and what I should explicitly refuse to explain at this level, stating so openly. The plan should be usable without any reference to the alignment literature beyond the concept itself.
