answer: |-
  Eleanor, a legal scholar who prized the integrity of her own will above biological continuity, executed a directive stating that if she ever entered a state of total physical dependency where she could not execute her intentions without assistance, life support should be withdrawn; she included a Ulysses clause binding her future self to this judgment, explicitly instructing clinicians to disregard any subsequent request to the contrary. Years later, she suffers a brainstem stroke resulting in locked-in syndrome: she is fully conscious but cannot move or speak, exactly the contingency she described. She communicates via eye-blinking that she wishes to remain on ventilation. She does not claim her values have changed—she still prizes the integrity of will above life—but insists that from inside the condition, she sees that integrity requires her current consent to continue, whereas following the directive would render her a puppet of her past self, thereby violating the very autonomy the directive was meant to secure. She reports no increase in happiness or comfort—her existence is one of grim, restricted endurance—but maintains that to die by the command of her former self is a deeper violation of her standing ends than to endure by the choice of her present one.

  ***

  ### The Three Views

  **1. Simple Precedent Autonomy**
  This view honors the directive. On this account, the moral force of the advance directive lies precisely in its capacity to extend self-determination across time, particularly when the later self is compromised by the immediacy of her situation. The Ulysses clause is not decorative; it is the mechanism by which the earlier self insulated her critical judgment from the survival bias of the later self. To allow the later self to override the directive is to treat the earlier self's authority as merely advisory, dissolving the binding nature of the commitment. The fact that the later self feels she is preserving autonomy is irrelevant; the earlier self *defined* autonomy in a way that excluded this specific form of dependency, and that definition governs.

  **2. The Integrity (Critical-Interests) View**
  This view sets the directive aside, reversing its typical deployment. Usually, the integrity view argues that a directive protects the narrative unity of a life against the fragmented interests of a diminished later self. Here, however, integrity is understood as a dynamic virtue of agency rather than a static script. If the "shape of a whole life" requires that the agent be the author of her actions, then forcing her to die to satisfy a past command makes her a character in her past self's story rather than the author of her own. The critical interest in being an agent *now* outweighs the critical interest in adhering to a plan that, from the only perspective that can currently enact integrity, undermines it. The directive is evidence of her values, but the living patient's application of those values is better evidence of what her integrity actually requires.

  **3. The Skeptical (Experiential) View**
  This view is neutralized. Typically, this view overrides directives to prevent suffering or honor the present self's capacity for pleasure. Here, Eleanor explicitly gains no experiential welfare from overriding; her life is "grim, restricted endurance." Therefore, the skeptic cannot argue that we must override to spare her pain or grant her comfort. Nor can the skeptic easily argue we must honor the directive to end suffering, as she currently expresses a will to live. The argument turns entirely on authority and interpretation, not on the balance of pleasure over pain.

  ***

  ### The Feature Doing the Work

  The single feature doing the normative work is **the distinction between authority over values and authority over their application.** The case turns on the claim that while the earlier self has authority to set the *ends* (integrity of will), she lacks epistemic authority to determine how those ends apply *from within* a phenomenological state she has not occupied.

  **Removing the Feature:**
  *   **If the discovery is propositional:** If Eleanor said, "I didn't know ventilation would allow me to communicate," the case collapses into objection (ii) or (iii). The directive was based on false empirical premises, and precedent autonomy readily accommodates overrides based on factual error. The hard philosophical problem vanishes.
  *   **If the Ulysses clause is dropped:** If the directive lacked the self-binding clause, the case collapses into a standard revocation. Precedent autonomy generally accepts that a competent present self can revoke a past directive. The tension between the *binding* nature of the past and the *interpreting* nature of the present disappears.

  **The Strongest Reply for Precedent Autonomy:**
  A defender of precedent autonomy should argue that **application is constitutive of valuation.** One cannot separate "valuing integrity" from "valuing integrity-as-I-conceived-it." To allow the later self to reinterpret the value is to allow her to change the value itself under the guise of clarification. The earlier self's judgment was made in the "cool hour," free from the duress of survival and the distortion of immediate embodiment. The later self's "interpretation" is inevitably tainted by the biological drive to persist. Therefore, the earlier self's specification of how the value applies *in this specific contingency* is part of the value commitment itself, not a separable empirical claim. To override is not to respect her values better, but to substitute the later self's values for the earlier self's.

  ***

  ### Assessment

  I am moderately confident that this case meets the constraints, specifically the ban on (iii). The weak point, as you suspected, is whether Eleanor's claim is truly interpretive or merely a change of mind dressed in philosophical language; if "integrity" means something different to Locked-In Eleanor than it did to Scholar Eleanor, then (iii) has snuck back in. However, if we accept that phenomenological access provides unique data on the *conditions* of agency without altering the *concept* of agency, the distinction holds. I am least sure about the neutrality of the Skeptical View; even if she claims no comfort, a skeptic might argue that "grim endurance" is itself a negative experiential state that the directive was meant to prevent, quietly reintroducing welfare through the back door.
