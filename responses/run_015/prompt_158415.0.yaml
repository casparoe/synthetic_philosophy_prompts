          *   It feels like "magical thinking" to many, which makes pedagogy hard.

      *   **Conclusion:** Summarize. The dismissal isn't just conservatism; it's a specific metaphysical stance on what "doing" means. Taking AT seriously requires a Copernican shift in decision theory.

