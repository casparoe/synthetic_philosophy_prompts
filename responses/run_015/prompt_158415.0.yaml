answer: |-
  This is a precise diagnosis of a deep fault line in contemporary decision theory and AI safety. The dismissal of acausal trade (AT) isn't merely pedagogical conservatism; it rests on specific, often unexamined, metaphysical and normative commitments about what it means to *act*.

  Here is an analysis of the philosophical presuppositions behind that dismissal, the role of Causal Decision Theory (CDT), and what a framework built on acausal cooperation would actually look like.

  ### 1. The Philosophical Commitments Behind the Dismissal

  The institutional habit of requiring causal channels presupposes three main commitments:

  **A. Causal Sovereignty (Agency as Intervention)**
  The dominant view of agency is *interventionist*. To be an agent is to be a "source" of causal power that propagates forward in time through physical channels. If your choice does not physically push a lever, send a signal, or alter a state within your future light cone, you haven't *done* anything; you have merely *observed* a correlation.
  *   **The Presupposition:** Influence requires energy transfer or signal propagation.
  *   **The Implication:** Acausal trade looks like "magical thinking" because it suggests my choice here can determine your choice there without a signal. To the causal sovereign, this violates the locality of control.

  **B. The Metaphysics of Particulars vs. Patterns**
  Standard policy frameworks treat agents as distinct physical particulars. You are *here*; I am *there*. Our atoms do not overlap.
  *   **The Presupposition:** Identity is tied to spatiotemporal location.
  *   **The Implication:** Acausal trade relies on *computational functionalism*—the idea that the algorithm running in your head and the algorithm running in mine are the same abstract object instantiated in two places. If you view agents as physical blobs rather than instantiations of patterns, the logical link between us dissolves into mere coincidence.

  **C. Temporal Asymmetry of Rationality**
  Standard rationality is backward-looking (updating on evidence) and forward-acting (causing outcomes).
  *   **The Presupposition:** The past is fixed; the future is open.
  *   **The Implication:** Acausal trade often requires *updatelessness* (acting as if you committed before you received specific information). To a standard Bayesian, ignoring new evidence to maintain a logical pact feels irrational. It requires viewing your decision as determining a logical fact that is timeless, rather than a physical event in a sequence.

  ### 2. Is it just Causal Decision Theory (CDT)?

  It is CDT, but CDT is itself an encoding of the philosophical commitments above.

  **The CDT Blind Spot**
  CDT evaluates actions using causal counterfactuals: $P(Outcome | do(Action))$. It explicitly "screens off" correlations that aren't causal. If I reason, "If I cooperate, it is more likely my twin will cooperate," CDT says: "Wrong. Your twin's decision is already determined by their code. Your action cannot reach across space to change it. Therefore, defect."
  *   CDT assumes that **logical dependence is not causal influence.**

  **The Agency Definition**
  You asked if it assumes agency means changing outcomes inside your light cone. **Yes.**
  In the standard framework, "control" is defined by causal leverage. If I cannot construct a causal graph where my node points to your node, I have no leverage.
  *   **Functional Decision Theory (FDT)** challenges this. It argues that if two agents run sufficiently similar algorithms, their outputs are *logically* dependent. My choice doesn't "cause" yours in a physical sense; rather, our choices are both outputs of the same logical function. Changing the output here *is* changing the output there, because they are the same output.
  *   The dismissal of AT is a refusal to accept logical dependence as a valid channel for agency. It insists that unless I can break your legs (causal), I can't make you pay (cooperation).

  ### 3. Rebuilding the Rational-Choice Framework

  If we took acausal cooperation seriously—designing systems that coordinate with copies, simulations, or transparent agents without communication—we would need to rebuild the stack from ontology to policy.

  **A. Ontology: From Physics to Computation**
  *   **Current:** The world is a collection of objects in spacetime.
  *   **Rebuild:** The world is a collection of *computational histories*. Agents are not locations; they are algorithms. Two agents running the same source code are not "similar"; they are the same abstract entity instantiated twice.
  *   **Policy Implication:** Identity verification shifts from biometrics (physical) to code verification (logical). "Are you the same agent?" becomes "Do you run the same decision function?"

  **B. Decision Theory: From CDT to FDT/UDT**
  *   **Current:** Maximize expected utility based on causal impact.
  *   **Rebuild:** Maximize expected utility based on **subjunctive dependence**. You must reason over logical counterfactuals: "If the output of algorithm $A$ is $X$, then the output of algorithm $B$ (which is similar to $A$) will be $Y$."
  *   **Policy Implication:** Agents must be **updateless**. You cannot condition your strategy on information that breaks the logical correlation (e.g., "I know I'm in the real world and you're a simulation, so I'll exploit you"). You must act as if you are behind a veil of ignorance regarding which instantiation you are.

  **C. Mechanism Design: From Contracts to Logical Handshakes**
  *   **Current:** Contracts are enforced by third parties (courts, smart contracts) via causal penalties.
  *   **Rebuild:** Cooperation is enforced by **transparency and logical necessity**. I don't need to punish you if you defect; I simply won't run the algorithm that cooperates with defectors.
  *   **Policy Implication:** This requires **radical transparency**. To engage in acausal trade, I must be able to inspect your source code (or a cryptographic proof of it). This creates a tension with security (hiding capabilities) and safety (hiding dangerous code). A system built for AT is a system where "security through obscurity" is irrational.

  **D. Epistemology: Modeling the Counterparty**
  *   **Current:** I model your incentives and beliefs.
  *   **Rebuild:** I must model your *source code*. This is computationally intractable for humans (halting problem), but feasible for AI.
  *   **Policy Implication:** AI safety workshops dismiss AT because human institutions can't verify code. But for AI, this is the native language. A policy framework for AT requires **formal verification standards**. We would need "logical treaties" where agents submit to static analysis to prove they will cooperate in specific logical scenarios.

  ### 4. Why the Resistance Persists (Beyond Philosophy)

  There are pragmatic reasons the curriculum resists this, which are worth noting:

  1.  **Fragility of Logical Correlation:** Causal links are robust (a contract holds even if I don't understand the law). Logical links are brittle. If my model of your code is slightly off, the acausal link breaks, and I get exploited. Institutions prefer robust, causal enforcement over fragile logical inference.
  2.  **The "Newcomb" Stigma:** Acausal trade is often associated with Newcomb's Problem, which many economists and philosophers consider a "trick" or a paradox rather than a real-world scenario. Teaching it as policy risks legitimizing what looks like superstition to outsiders.
  3.  **Accountability:** Legal and moral responsibility rely on causal chains. If an AI harms a human via acausal coordination (e.g., by signaling through a shared logical structure rather than a message), who is liable? The causal chain is required for auditability.

  ### Summary

  The dismissal of acausal trade presupposes that **agency is physical intervention** and **rationality is causal control**. It treats the universe as a collection of distinct objects rather than instantiations of shared patterns.

  To take it seriously requires shifting from **Causal Decision Theory** to **Functional Decision Theory**, viewing agents as **algorithms** rather than bodies, and replacing **legal contracts** with **logical handshakes** based on code transparency. It demands we accept that the most powerful form of influence isn't pushing the world, but reasoning correctly about the logical structure of the world itself.

  The reason it's not in the curriculum isn't just that it's "weird." It's that adopting it requires admitting that our current legal, moral, and economic frameworks are built on a metaphysics of locality that advanced AI systems might simply outgrow.
