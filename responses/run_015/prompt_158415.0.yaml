      *   *The "Institutional Habit":* Why do people default to causal links? Because it feels like *control*. If I can't push a lever to make you do something, did I *make* you do it?
      *   *Philosophical Commitments:*
          *   **Metaphysics of Causation:** Physicalism, locality, no action-at-a-distance.
          *   **Agency:** Agency as intervention. To be an agent is to be a "source" of causal power.
          *   **Rationality:** Maximizing expected utility based on *causal* impact, not mere correlation.
          *   **Epistemology:** Skepticism about logical correlation implying normative obligation.
      *   *Rebuilding the Framework:*
          *   Need to move from CDT to FDT (Functional Decision Theory) or UDT (Updateless Decision Theory).
          *   Redefine "influence" to include logical/subjunctive dependence.
          *   Redefine "outcome" to include logical possibilities, not just physical timelines.
          *   Policy design: Pre-commitment, source code transparency, logical handshake protocols.

  3.  **Drafting the Response - Section by Section:**

