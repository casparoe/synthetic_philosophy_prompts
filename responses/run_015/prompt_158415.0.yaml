      *   **Part 1: The Philosophical Commitments (The "Why"):**
          *   *Causal Sovereignty:* The idea that an agent's power is defined by its ability to physically intervene. If it doesn't change the physical state of the world *via* a chain of events, it's not "real" action.
          *   *Locality/Physicalism:* Relativity forbids superluminal signaling. Acausal trade looks like magic/spooky action to a physicalist.
          *   *The "Control" Intuition:* Rationality is often taught as *control*. Correlation isn't control. CDT formalizes this.
          *   *Temporal Asymmetry:* Cause precedes effect. Acausal trade often involves logical simultaneity or backward-looking reasoning (updatelessness).

      *   **Part 2: CDT vs. The Nature of Agency:**
          *   It *is* largely CDT baked in. CDT says: $P(outcome | do(action))$. It screens off correlations.
          *   But it's deeper: It's the definition of *agency*. If my choice is logically correlated with yours (because we run similar algorithms), CDT says "I can't change your output by changing mine, because your output is already determined by your code." FDT says "My choice *is* the output of the algorithm, so choosing determines the output."
          *   So yes, it assumes agency = local causal intervention.

      *   **Part 3: Rebuilding the Framework (The "How"):**
          *   *Decision Theory:* Shift from CDT to FDT/UDT. Explain the difference briefly (causal vs. logical counterfactuals).
          *   *Ontology of Computation:* Treat algorithms as abstract objects that exist in multiple places. My instance and your instance are instantiations of the same pattern.
          *   *Precommitment as Default:* Policy isn't about reacting; it's about setting the algorithm that *will* react.
          *   *Mechanism Design:* Instead of contracts (enforced by law), we need "logical contracts" (enforced by code transparency).
          *   *Epistemic Humility:* You need to know the other agent's source code (or probability distribution over it). This requires high transparency.

      *   **Part 4: Risks/Critiques (Balancing the view):**
          *   Why *is* it dismissed? Because it's fragile. If the model of the other agent is wrong, you get exploited.
