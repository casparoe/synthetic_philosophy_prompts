answer: |-
  Given your background in experimental physics and your constraint of a single semester for solo research, your resource allocation must prioritize logical coherence over empirical speculation. You are effectively building a theoretical model of moral value; therefore, you must establish the axioms before testing the boundary conditions or diagnosing observer bias. Here is the recommended agenda, ranked by priority.

  **Priority 1: Cluster 1 (Axiological Coherence Across Possible Populations)**
  You must first determine whether the asymmetry survives the rejection of person-affecting views. This is the upstream foundational question. If the asymmetry collapses when compared against impersonal total or average welfare principles (e.g., Critical-Level Utilitarianism), then the subsequent formalization of non-existence (Cluster 3) and the psychological diagnosis (Cluster 2) lose their normative object. For a solo researcher, this is highly tractable: it requires conceptual analysis of existing impossibility theorems (e.g., Arrhenius) and normative reasoning, not data collection. You are checking whether the "equations of motion" for population ethics can even be written without contradiction.

  **Priority 2: Cluster 3 (Decision Theory and the Null Baseline)**
  Once the axiological framework is provisionally settled, you should formalize the status of non-existence. This cluster is ranked second because it applies the framework from Cluster 1 to the specific mechanics of harm and identity. This is where your physics training offers a comparative advantage: you can treat welfare baseline formalization as a boundary condition problem in decision theory. It is tractable for a solo philosopher because it relies on logic and formal modeling rather than empirical psychology. However, it is downstream of Cluster 1 because you cannot assign a value (null or otherwise) to non-existence without knowing whether total or average welfare is the metric being optimized.

  **Priority 3: Cluster 2 (Evolutionary Debunking and Normative Origins)**
  This cluster is the lowest priority for your specific constraints. Diagnosing the asymmetry as an evolutionary byproduct is a meta-ethical move that presupposes you know what the asymmetry *is* (Cluster 1) and how it functions logically (Cluster 3). Furthermore, this line of inquiry risks drifting into empirical speculation about adaptive heuristics, which is difficult to pursue rigorously without laboratory resources or collaboration with evolutionary psychologists. It is best treated as an error theory to be deployed only if the normative project in Clusters 1 and 3 fails.

  **Defense of Ordering**
  1.  **Upstream Dependence:** Cluster 1 defines the value system; Cluster 3 models the system's behavior regarding existence; Cluster 2 explains the observer's belief in the system. You cannot model behavior or explain belief without defining the system.
  2.  **Solo Tractability:** Clusters 1 and 3 are purely conceptual and formal, fitting a single researcher's capacity. Cluster 2 invites empirical claims that are hard to verify without lab resources, increasing the risk of philosophical overreach.
  3.  **Reordering Condition:** The only result that would promote Cluster 2 to Priority 1 is a proof of strong impossibility in Cluster 1 (e.g., demonstrating that no coherent population ethics exists). If the asymmetry is logically impossible rather than merely counterintuitive, the primary question shifts from "How do we justify this?" to "Why do we believe this?" (Error Theory).

  Verdict: Prioritize establishing axiological coherence before formalizing non-existence, deferring evolutionary debunking until the normative target is rigorously defined.
