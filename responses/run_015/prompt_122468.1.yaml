answer: |-
  This spec shifts the frame from *axiology* (is nature good?) to *decision theory* (does this pilot buy expected welfare?). The goal is a filter that kills vague philosophical posturing and survives ecological reality.

  ### The Spec: Desiderata for a Theory of Intervention

  | # | Requirement | Case / Consideration | Status | Confidence |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Mechanism Separation** | Predation, disease, starvation, and parasitism have different causal structures. A theory that treats them as a monolith cannot select between vaccines (disease), contraception (starvation/predation density), or analgesics (pain). | **Non-Negotiable** | 95% |
  | **2** | **Status vs. Weight vs. Population** | Must distinguish: (a) probability of sentience, (b) moral weight per unit of suffering, and (c) the value of changing population size vs. changing individual experience. Conflating these leads to "prevent existence" vs. "relieve suffering" errors. | **Non-Negotiable** | 90% |
  | **3** | **Uncertainty Weighting (The Insect Problem)** | Cannot assign zero weight to "maybe-sentient" taxa (insects, nematodes). Must use Expected Value: $P(\text{sentience}) \times \text{Magnitude}$. Ignoring them because $P < 1$ is a calculation error given $N \approx 10^{18}$. | **Non-Negotiable** | 85% |
  | **4** | **Ecological Feedback (The Equilibrium Trap)** | *Biology check:* You are not over-reading. Density-dependence means removing individuals often triggers higher reproduction/survival in remainder, negating welfare gains or increasing total suffering. Theory must model population dynamics, not just individual snapshots. | **Non-Negotiable** | 90% |
  | **5** | **Dynamic Counterfactual (Shifting Baseline)** | "Leave nature alone" is not a static baseline. Climate change, invasive species, and habitat fragmentation are active interventions by humans. The counterfactual must be "nature + current anthropogenic pressure," not "pristine wilderness." | **Non-Negotiable** | 95% |
  | **6** | **Reversibility Constraint** | Irreversible interventions (gene drives) require higher evidence thresholds than reversible ones (feeding, contraception). *Note:* Whether this is a hard veto or a cost multiplier is a normative preference (see "Smuggling"). | **Preference** | 80% |
  | **7** | **Beneficiary Specificity ("About Them")** | Must screen for interventions that primarily reduce human distress (e.g., culling "visible" suffering that is ecologically functional) vs. actual animal welfare. Criterion: Does the metric rely on human-observable proxies that correlate with animal experience? | **Non-Negotiable** | 85% |
  | **8** | **Agency & Standing** | Theory must specify *who* is permitted to act. Most fail by assuming a "Benevolent God" agent. A real-world theory must account for coordination problems, local governance, and legitimacy, or explicitly argue why they are irrelevant. | **Preference** | 60% |
  | **9** | **Operationalization (Measurable Currency)** | Must define success in terms of field-measurable proxies (cortisol, behavior, mortality rates) rather than abstract "welfare units." If it can't be measured, it can't be funded. | **Non-Negotiable** | 95% |
  | **10** | **Learning Yield (New)** | Since this is a *pilot*, the theory must account for Value of Information (VOI). If the pilot fails to improve welfare but generates data that prevents larger future errors, it may still be a buy. A theory that only values direct impact kills R&D. | **Non-Negotiable** | 85% |

  ***

  ### The Three Things

  **(a) The Incompatible Subset: Precaution vs. Expected Value**
  You flagged this correctly. There is a hard tension between **Requirement 9 (Operationalization/Evidence)** and **Requirement 3 (Uncertainty Weighting/Huge Numbers)**.
  *   **The Conflict:** To satisfy Operationalization, you need decent evidence that an intervention works (low uncertainty). To satisfy Uncertainty Weighting on insects/inverts, you are asked to act on *thin* evidence because the numbers are astronomical.
  *   **The Verdict:** This is a real contradiction in practice. You cannot demand high-quality field data (which is slow and expensive) and simultaneously act on the expectation of helping $10^{18}$ creatures (which requires acting before you have that data).
  *   **Resolution:** You must prioritize. For a *pilot*, Operationalization wins. You cannot spend money on a field trial if you cannot measure the outcome. The "huge numbers" argument justifies *research funding*, not necessarily *intervention pilots* without measurement protocols.

  **(b) The Knockout Requirement**
  **Requirement 4 (Ecological Feedback).**
  This knocks out the largest number of popular positions.
  *   **Naive Interventionism:** "Feed them in winter" fails because it increases density and disease.
  *   **Naive Hands-Off:** "Nature is balanced" fails because the balance is often high-turnover suffering (r-selection strategies).
  *   **Why:** Most philosophical theories treat animals as isolated vessels of experience. Ecology treats them as nodes in a flow system. Any theory that doesn't model the flow gets the answer wrong.

  **(c) Political Smuggling**
  Two of your requirements carry hidden normative weight:
  1.  **Requirement 6 (Reversibility as Veto):** Treating irreversibility as a *side-constraint* (deontological) rather than a *risk cost* (consequentialist) is a political/philosophical preference. A hard utilitarian might say a gene drive is fine if the EV is high enough, regardless of reversibility.
  2.  **Requirement 8 (Standing):** This is the most political. A utilitarian view says "whoever can help, should." A political realist view says "only legitimate authorities." Requiring "authorization" smuggles in a specific view of sovereignty that might block effective altruism. I marked it "Preference" for this reason.

  ***

  ### Confidence Notes & Error Bars

  *   **High Confidence (90%+):** Mechanism Separation, Dynamic Counterfactual, Operationalization. These are empirical or logical necessities for a *funding decision*.
  *   **Medium Confidence (80-89%):** Ecological Feedback, Beneficiary Specificity, Learning Yield. These are robust but depend on the specific ecosystem and metrics available.
  *   **Low Confidence (<70%):** **Requirement 8 (Agency & Standing).**
      *   *Why:* I am least sure whether a theory of *welfare* should incorporate political legitimacy. If a rogue actor can reduce suffering by 10% without permission, does a theory that forbids them fail? Or does a theory that allows them fail? This depends on whether you view the spec as "Ideal Ethics" or "Policy Guide." I have written it as a Policy Guide, but the boundary is blurry.

  ***

  ### Brief View Comparison

  *   **Hands-Off ("Leave It Alone"):** Fails **Requirement 5 (Shifting Baseline)**. It treats "nature" as a static moral baseline rather than a changing physical system subject to human climate impact. It also struggles with **Requirement 10 (Learning Yield)**, as it forbids the pilots needed to learn.
  *   **Interventionist ("Reduce Suffering Wherever"):** Fails **Requirement 4 (Ecological Feedback)** and **Requirement 9 (Operationalization)**. It often assumes linear causality (less predation = less suffering) and relies on abstract welfare units rather than measurable field proxies.

  **Deliverable Status:** The list above is the spec. Use it to score proposals. If a proposal cannot define its counterfactual (Req 5), model its population dynamics (Req 4), or measure its outcome (Req 9), it is not fundable regardless of its moral urgency.
