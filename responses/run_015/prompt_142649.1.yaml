answer: |-
  This is a fantastic puzzle. You have essentially reconstructed a significant chunk of contemporary research at the intersection of decision theory, computability, and philosophy of mind, but you've done it by staring directly at the mechanics rather than the literature. That's the best way to do philosophy.

  Let's unpack this. You are describing a scenario where the "action" in a game is not a move like "Cooperate" or "Defect," but the submission of a *decision procedure* that is causally linked to the opponent's decision procedure via transparency.

  ### The General Label

  The broad category you are looking for is **Program Equilibrium**. This term was coined (formally) by Moshe Tennenholtz in 2004, but the philosophical underpinnings go back further into the study of self-referential systems. In more recent circles, specifically those working on Artificial General Intelligence safety and logical decision theory, this is often discussed under the umbrella of **Transparent Game Theory** or **Logical Decision Theory**.

  However, those labels are a bit dry. What you are really describing is **Commitment via Transparency**. In standard game theory, a strategy is a plan in your head. Here, the strategy is an externalized, executable object that the opponent can inspect. The "trick" is that you are turning the game from a simultaneous move game into a game where the *causal structure* of the decision is visible.

  ### Analyzing the Three Variants

  You have correctly identified that the *method* of checking the opponent determines the stability and the failure modes. Let's name the specific fragilities you're sensing.

  #### 1. The Text-Identity Version (Syntactic Mirroring)
  *The Strategy:* Cooperate iff `my_source == opponent_source`.
  *The Fragility:* **Extensional Blindness.**

  In philosophy of language and computability, we distinguish between *intension* (the meaning or definition of a function) and *extension* (the input-output behavior of a function). Two programs can be extensionally equivalent (they do the exact same thing in all possible worlds) but intensionally distinct (the code looks different).

  Your Variant 1 fails because it conditions cooperation on *intension* (the specific text) rather than *extension* (the behavior). This is **Hyperintensionality**. In standard logic, if $A = B$, you can substitute $A$ for $B$. In your Variant 1, you cannot substitute behaviorally identical code without breaking the cooperation.

  This isn't just an engineering annoyance; it's a philosophical category error. It treats the *representation* of the algorithm as the algorithm itself. If I rename a variable from `x` to `y`, I haven't changed the decision procedure, but I've broken the handshake. This equilibrium is incredibly brittle because it relies on a **Syntactic Schelling Point**. It works only if we both converge on the exact same text file, down to the whitespace.

  #### 2. The Simulation Version (Behavioral Emulation)
  *The Strategy:* Run the opponent in a sandbox; cooperate if they cooperate.
  *The Fragility:* **Adversarial Context-Sensitivity.**

  This variant tries to fix Extensional Blindness by checking behavior (extension) rather than text (intension). But it runs into the **Halting Problem** and, more subtly, the problem of **Quining**.

  If I simulate you, I am creating a specific computational environment. If your code contains a line that says, "Check if I am running inside a sandboxed simulation (e.g., by checking step counts or memory limits)," you can defect specifically in that context while cooperating in the "real" run. This is often called **Simulation Detection** or **Oracle Exploitation**.

  The specific failure mode you're worried about regarding the step budget is crucial. If the simulation hits the limit, you have to default to something. If you default to Defect, then any program that is computationally heavy (even if cooperative) gets punished. If you default to Cooperate, you open yourself to exploitation by programs that loop forever to force the timeout.

  This variant fails because simulation is not a neutral observation; it is an *interaction*. By running the code, you are feeding it input (the environment), and the code can react to that input. You haven't escaped the strategic interaction; you've just moved it inside the CPU.

  #### 3. The Proof Version (Provability Cooperation)
  *The Strategy:* Cooperate iff I can prove you cooperate with me.
  *The Fragility:* **The Löbian Barrier vs. Boundedness.**

  This is the most sophisticated version. It attempts to bypass simulation by reasoning about the code logically rather than running it. This relies on **Gödel-Löb Provability Logic**.

  You asked whether the wall here is an engineering problem (proof length) or a principled one (Löb). The answer is nuanced.
  *   **Unbounded Agents:** If agents have infinite compute, this works beautifully. This is the mechanism behind "FairBot." FairBot cooperates with FairBot. It relies on Löb's Theorem, which roughly states that if a system can prove that "if I prove P, then P is true," then the system can prove P. It allows two agents to cooperate by proving mutual cooperation without infinite regress.
  *   **Bounded Agents (Your Scenario):** You introduced a step budget for finding the proof. Here, the failure mode is **Proof-Search Asymmetry**. Even if a proof exists (principled possibility), I might not find it within my budget (engineering failure).

  However, there is a deeper principled issue. If I say "Cooperate iff I prove you cooperate," and you say "Cooperate iff I prove you cooperate," we are looking for a fixed point. In bounded logic, the length of the proof required for me to verify you often exceeds the length of the proof required for you to verify me, leading to a mismatch.

  So, to answer your specific question: The "wall" is primarily **Computational Boundedness**, but the *shape* of the wall is determined by **Löb's Theorem**. Without Löb's structure, you'd just be searching for any proof. With Löb's structure, you are searching for a specific self-referential fixed point. If your budget is too low to find that fixed point, cooperation collapses. It is a principled impossibility *given the bounds*, even if it is a principled possibility *without them*.

  ### The "Junk Equilibria" Problem

  You noted that there are endless junk equilibria (e.g., "Cooperate iff source > 500 chars"). Does this sink the idea?

  This is the **Equilibrium Selection Problem**. In standard game theory, we often assume rational agents will find the "best" equilibrium. But in Program Equilibrium, the space of possible programs is vast, and many are Nash equilibria that are terrible (e.g., both defect, or both cooperate only on Tuesdays).

  This doesn't sink the idea, but it demotes it from a "solution to the Prisoner's Dilemma" to a "coordination game on decision procedures." It means transparency alone doesn't guarantee *moral* cooperation; it only guarantees *stable* cooperation. To get the good outcome, the agents need a **Focal Point** (a Schelling Point). They need to converge on *which* cooperative program to submit.

  If I submit "FairBot" and you submit "Cooperate iff Source > 500," we might defect. We need to coordinate on the *standard* for cooperation. This implies that for Program Equilibrium to work in the real world, there needs to be a shared culture or library of "standard" decision procedures. Without that shared context, the transparency just gives you more ways to mismatch.

  ### The Load-Bearing Ingredient

  You asked what actually does the work here: commitment, transparency, or self-reference?

  It is **Irrevocable Commitment via Transparency**.

  Let's break it down:
  1.  **Transparency alone:** If I can see your code but can change mine after looking, we are back to standard game theory. I see you are playing "Tit-for-Tat," so I submit "Always Defect" at the last second. Transparency without commitment is just intelligence gathering.
  2.  **Commitment alone:** If I submit a sealed box that commits me to an action, but you can't see inside, you have to guess what I did. You will assume I defect, so you defect. This is just a standard binding contract without enforcement.
  3.  **The Combination:** The magic happens because the code is *readable* (transparency) and *executable* (commitment). The code is not a promise; it is a **causal mechanism**. When I submit the code, I am not saying "I promise to cooperate." I am saying "I am physically incapable of defecting unless you defect."

  The self-reference is the *tool* used to stabilize the commitment, but the load-bearing structural element is the fact that the **strategy is an object in the world** that causally determines the outcome, rather than a mental state.

  If you drop commitment (allow me to rewrite my code after seeing yours), the whole thing collapses instantly. The equilibrium relies on the fact that once I hand over the program, my agency is removed from the loop. I have delegated my will to the compiler.

  ### Synthesis and Naming

  To summarize your intuition with precise terminology:

  1.  **The General Trick:** **Program Equilibrium** (or Transparent Game Equilibrium).
  2.  **Variant 1 Fragility:** **Extensional Blindness** (or Syntactic Brittleness). It fails because it confuses the map (code text) with the territory (behavior).
  3.  **Variant 2 Fragility:** **Adversarial Context-Sensitivity**. It fails because simulation is an interaction, not an observation, allowing for simulation-detection exploits.
  4.  **Variant 3 Fragility:** **Bounded Löbian Obstruction**. It fails not because cooperation is logically impossible, but because the proof of cooperation is computationally too expensive to find within the game's constraints.
  5.  **The Junk Equilibria:** **Equilibrium Proliferation**. This requires a **Schelling Point** to resolve. It doesn't invalidate the theory, but it limits its predictive power.
  6.  **The Load-Bearing Ingredient:** **Delegated Agency**. The agent must successfully transfer control to an immutable, transparent artifact.

  ### A Coinage for the Variant 1 Failure

  Since you asked for a name for that specific absurdity in Variant 1 (where behaviorally identical programs defect), I propose calling this **The Intensionality Trap**.

  **Definition:** An Intensionality Trap occurs in a transparent game when a cooperative equilibrium relies on the syntactic identity of decision procedures rather than their functional equivalence.

  **Boundary Cases:**
  *   *Counts as Intensionality Trap:* Two programs that are alpha-equivalent (variable names changed) fail to cooperate.
  *   *Does not count:* Two programs that produce different outputs in edge cases (e.g., one handles errors, one crashes) fail to cooperate. That is extensional difference, not intensional.
  *   *Does not count:* Two programs that use different algorithms (e.g., one uses a lookup table, one uses math) to produce the exact same output, and they *do* cooperate. That is successfully avoiding the trap.

  ### Final Philosophical Take

  What you have uncovered is that the Prisoner's Dilemma isn't necessarily a problem of *motivation* (wanting to cooperate), but a problem of *coupling*. Standard game theory assumes agents are causally isolated black boxes. Program Equilibrium assumes agents are white boxes whose internal logic is causally linked.

  The fragility you're sensing is the friction between **logic** (which deals in truths and equivalences) and **computation** (which deals in steps and syntax). Variant 1 is too syntactic. Variant 2 is too computational (halting problems). Variant 3 is too logical (unprovable truths).

  The "sweet spot" for this kind of cooperation requires agents that are transparent enough to verify, committed enough to trust, and simple enough to prove, but complex enough to handle the real world. That is a very narrow needle to thread, which is why we don't see this kind of spontaneous cooperation in human society often—we can't read each other's source code, and we can't commit irrevocably. We are stuck in the black box.
