answer: |-
  Here is the audit. I'm skipping the preamble on Cummins vs. Millikan; you know the landscape. We are looking strictly at the structural integrity of the metaphors.

  ### Step 1: Brainstorming the Mappings

  First, we lay out the correspondences to see how the terminology translates.

  **Analogy 1: The Software/Subroutine Model**
  | Biological Concept | Software Analogy | Theoretical Camp |
  | :--- | :--- | :--- |
  | **Trait/Organ** | Subroutine/Function | Both |
  | **Physiological Activity** | Runtime Execution/Compute | Causal Role (CR) |
  | **Evolutionary History** | Source Code/Original Commit | Etiological (ET) |
  | **"Programmer"** | Natural Selection | Etiological (ET) |
  | **Malfunction** | Runtime Error/Crash | Both (defined differently) |
  | **Vestigial Trait** | Legacy Code/Deprecated Function | Etiological (ET) |
  | **Current Utility** | Current Output/Return Value | Causal Role (CR) |

  **Analogy 2: The Manufacturing/Spec Sheet Model**
  | Biological Concept | Manufacturing Analogy | Theoretical Camp |
  | :--- | :--- | :--- |
  | **Trait/Organ** | Manufactured Part | Both |
  | **Adaptive Contribution** | Spec Sheet/Design Tolerance | Etiological (ET) |
  | **Natural Selection** | Factory/Manufacturer | Etiological (ET) |
  | **Pathology** | Defect/Out of Tolerance | Etiological (ET) |
  | **Survival/Reproduction** | Warranty Period/Service Life | Causal Role (CR) |
  | **Phenotypic Variation** | Production Variance | Both |

  ### Step 2: Flagging Disanalogies (Cosmetic vs. Structural)

  Now we strip away the surface-level similarities to find the load-bearing walls.

  **Cosmetic Disanalogies (Ignore these):**
  *   **Substrate:** Silicon vs. Carbon. Irrelevant to functional ascription.
  *   **Speed/Scale:** Evolution is slower than coding. Irrelevant to the logic of function.
  *   **Replication:** Software copies perfectly; biology is noisy. This matters for fidelity, but not for the *definition* of function.

  **Structural Disanalogies (These break the analogy):**
  1.  **The Source of Normativity (The "Designer" Problem):**
      *   *Software/Manufacturing:* Norms are imposed *top-down* by an agent with intent. A bug is a bug because it violates the coder's *wish*.
      *   *Biology:* Norms are derived *bottom-up* from statistical success. There is no "wish." Selection is a filter, not an author.
      *   *Audit:* This is the critical leak. The analogy smuggles in **intentionality**. When ET theorists say "selected for," the analogy makes students hear "chosen by."

  2.  **The Temporal Direction of "Spec":**
      *   *Software/Manufacturing:* The spec/code exists *before* the instance.
      *   *Biology:* The "spec" (adaptive value) is identified *after* the fact. Evolution has no forward-looking blueprint.
      *   *Audit:* The Manufacturing analogy implies pre-existence of a standard that biology simply does not have.

  3.  **The Status of "New" Instances:**
      *   *Software:* A new subroutine has a function immediately upon writing.
      *   *Biology:* A new mutation has no "function" in the ET sense until it is selected.
      *   *Audit:* This creates a mismatch in how we handle novelty and synthetic cases.

  ### Step 3: The Audit Verdict

  Here is where the analogies fail to carry the philosophical weight, specifically regarding your three stress tests.

  **1. Does the software analogy smuggle in an intentional designer?**
  **Yes, aggressively.**
  In the Software model, "Original Specification" implies a specifier. If you tell a student, "The heart's function is what the evolutionary programmer specified," you have implicitly committed to a teleological agent.
  *   **Why it matters:** The entire point of the Etiological view (Millikan, Neander) is to naturalize teleology *without* a designer. The analogy undoes this work by relying on the student's pre-existing intuition about *actual* designers (coders). It solves the "normativity" problem (why is pumping *good*?) by cheating: it imports normativity from the human context of software engineering.

  **2. How does either handle the Synthetic Heart?**
  *Case: A perfect artificial heart, 3D printed, never selected for, implanted in a human.*

  *   **Software Analogy:**
      *   *Verdict:* **Contradictory.**
      *   *Reasoning:* In software, if I write a new subroutine, it has a function because *I* intended it. If the synthetic heart is "coded" by the engineer, it has an ET function (engineer's intent). If it's just a physical object, it has no "code." The analogy forces you to ask: "Who wrote the code?" Biology has no answer. The analogy breaks because software *cannot* exist without a coder, whereas biological traits (in the CR view) can exist without history.
  *   **Spec Sheet Analogy:**
      *   *Verdict:* **Fails Etiological, Supports Causal Role.**
      *   *Reasoning:* A manufactured part without a spec sheet is just scrap metal. The ET view (via the analogy) must say the synthetic heart has no function (it's scrap). The CR view says, "It doesn't matter who made it; it's pumping." The analogy highlights the absurdity of the ET view here (intuitively, the heart *does* function), but it does so by relying on the intuition that "manufactured things need manufacturers."

  **3. Do these analogies carry the argument, or just restate the camps?**
  **They merely restate the camps in tech metaphors.**
  *   **Causal Role** becomes "What does it do right now?" (Runtime).
  *   **Etiological** becomes "What was it made for?" (Source Code).
  *   **The Work:** They do zero metaphysical work. They do not explain *why* history confers normativity. They do not explain *how* a blind process creates a "spec." They are pedagogical shorthand, not philosophical arguments.
  *   **The Danger:** They make the Etiological view seem more robust than it is. "Source Code" sounds solid and concrete. "Selection History" is messy, statistical, and counterfactual. The analogy gives the ET theorist a false sense of precision.

  ### Summary for the Seminar

  Tell your students this:
  1.  **The analogies are heuristic, not ontological.** They help you visualize the *difference* between looking at current capacity (CR) vs. historical origin (ET).
  2.  **Do not trust the "Programmer."** As soon as you imagine Natural Selection as a "coder," you have left Darwinism and entered Intelligent Design. The "spec" in biology is a retrospective description of survival, not a prospective instruction.
  3.  **The Synthetic Heart Test.** Use this to break the analogy. If the software analogy implies a synthetic heart has no function (no evolutionary code), but our intuition says it does, the analogy is failing to capture biological reality.
  4.  **Conclusion:** These metaphors describe the *consequences* of the theories (e.g., "If ET is true, the synthetic heart is functionless"), but they do not justify the theories. Don't let the elegance of the "code" metaphor hide the hard work of explaining how blind variation generates normative constraints.
