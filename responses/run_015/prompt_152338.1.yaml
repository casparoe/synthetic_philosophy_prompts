      *   **Topic:** Biological function (Graduate Seminar prep).
      *   **Core Task:** Audit two specific analogies used in the function debate: (1) Software/Subroutine (Causal Role vs. Etiological) and (2) Manufacturing/Spec Sheet (Etiological/Malfunction).
      *   **Specific Requirements:**
          *   Provide correspondence tables for both analogies (Programmer/Code/Runtime/Legacy vs. Manufacturer/Spec/Defect/Warranty).
          *   Identify exactly where the mapping breaks (Intentional Designer vs. Darwinian Selection).
          *   Address the "Synthetic Heart" case (pumps perfectly, no selection history).
          *   Evaluate if the analogies carry the argument or just restate the camps in tech metaphors.
          *   **Persona:** Philosophy of biology expert, skeptical of analogies doing real work.
          *   **Format:** Step-by-step thinking (brainstorm mappings -> flag disanalogies -> final audit), focused, no lit review.

  2.  **Deconstruct Analogy 1: The Software/Subroutine Analogy:**
      *   *Concept:* Heart = Subroutine.
      *   *Causal Role (CR):* Function = what it computes *now* (runtime behavior).
      *   *Etiological (ET):* Function = what the "programmer" (evolution) originally specified (source code/intent).
      *   *Mappings:*
          *   Programmer -> Natural Selection (Problem: Selection isn't a mind).
          *   Code/Spec -> Genetic/Developmental Blueprint.
          *   Runtime/Execution -> Physiological process.
          *   Runtime Error -> Pathology/Malfunction (CR view: it's just different output; ET view: it's a bug).
          *   Legacy Code -> Vestigial traits/Phylogenetic history.
      *   *Critical Break:* Software implies syntax and semantics defined by an agent. Evolution is blind. "Original specification" is metaphorical in biology, literal in software.
      *   *Synthetic Heart:* In software, if I write a new subroutine, it has a function because *I* gave it one. In biology, a synthetic heart has no history. ET says no function (or derived function from the surgeon). CR says yes, it pumps.

  3.  **Deconstruct Analogy 2: The Manufacturing/Spec Sheet Analogy:**
      *   *Concept:* Trait = Manufactured Part.
      *   *Mappings:*
          *   Manufacturer -> Natural Selection (again, the agent problem).
          *   Spec Sheet -> Adaptive Peak/Fitness Contribution.
          *   Defect -> Malfunction/Disease.
          *   Warranty -> Reproductive Success/Survival window.
      *   *Critical Break:* Manufacturing is teleological (goal-directed). Selection is retrospective. A spec sheet exists *before* production. Adaptation exists *after* selection.
      *   *Synthetic Heart:* Manufactured part has a spec. Synthetic heart (3D printed?) has a designer (the surgeon/engineer). If purely accidental? No spec.

  4.  **Evaluate the "Work" the Analogies Do:**
      *   Do they solve the problem? No.
      *   Do they clarify? Maybe for students, but they risk importing intentionalism.
      *   Are they just restatements? Largely yes. "Selected Effect" becomes "Original Code." "Causal Role" becomes "Current Output."
      *   *Skepticism:* Analogies often hide the hard metaphysical work (normativity, teleology) under familiar tech terms.

  5.  **Drafting the Response (Iterative Process):**

