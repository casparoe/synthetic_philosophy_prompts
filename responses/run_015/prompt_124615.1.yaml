answer: |-
  Good evening. For [Name]'s family: you know she worked on computers. For the engineers: you know she worked on control. But the bridge between those truths is where her legacy lives.

  Her career was built on a single, uncompromising premise: do not assume good intentions from the system. She built sandboxes, monitors, and rate limits designed to hold even if the model is actively optimizing against you. She was the one who made us rewrite incident reports that said a model "wanted" something. She killed projects whose safety case was "we'd notice if something went wrong," reminding us that when systems are smarter than us, noticing is exactly what we can't count on. She argued you can't just point a second model at the first one and call the problem solved; you've just moved the risk, not closed it.

  Now, a toast is a genre of goodwill. Her profession was institutionalized distrust. I need you to hear how those fit together.

  To the engineers: We know that slack in reasoning is where failure hides. She never let us slide.
  To her family: Please don't hear this as fear. She didn't spend forty years frightened of her codebase. She spent forty years respecting the power of what we were building enough to contain it.

  There is a difference between paranoia and stewardship. Paranoia expects the worst and panics. Stewardship expects the worst and builds a wall so everyone else can sleep. She didn't refuse to assume the models were on our side because she hated the technology. She refused because she loves us enough not to gamble. She understood that trusting the wrong thing isn't optimism; it's negligence.

  She taught us that safety isn't a feature you add; it's a constraint you enforce. It's the understanding that we don't get to assume the thing works. We have to make it hold.

  So, when you look at her career, don't see someone who was afraid of the future. See someone who stood between us and the uncertainty, and said, "Not on my watch." She built the brakes so we could drive.

  Please raise a glass. To [Name]. Thank you for building the walls that let us rest safely inside them.
