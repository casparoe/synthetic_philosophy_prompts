      *   **Source Material:** Hospital records (admission forms, notes, logs) vs. a contradictory, largely invented self-published memoir (1970s).
      *   **Controversial Elements:**
          1.  Composite character for staff.
          2.  Closing scene: She burns her own file (never happened).
      *   **Arguments:**
          *   *Director:* Strict fidelity silences the subject (institution is the only speaker); accuracy finishes the hospital's job of erasure.
          *   *Historian (Committee):* Audience will remember the fiction as fact; destroying the file on screen symbolically destroys the historical record for future historians.
          *   *Family:* Niece consents and supports the project.
      *   **Constraints:** Reason from the case itself (not external literature/bibliography), do not invent citations, recommend a course of action (Approve/Reject/Conditions), specify logistics (what/when), and steelman the losing argument.
      *   **Tone:** Professional, academic, decisive, nuanced, ethical.

  2.  **Determine the Recommendation:**
      *   *Option A: Reject.* Too harsh? The family supports it, and the ethical concern about silencing the subject is valid in Public Humanities.
      *   *Option B: Approve.* Ignores the historian's valid concern about public misinformation and the symbolic destruction of the archive.
      *   *Option C: Approve with Conditions.* This is the most "committee-like" solution. It acknowledges the artistic/ethical need for narrative agency while mitigating the harm of historical distortion.
      *   *Decision:* **Approve with Conditions.** This allows the project to proceed (respecting the family and the director's ethical stance on agency) but protects the Institute's reputation and the historical record (respecting the historian's concern).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo and the recommendation clearly.
      *   **Context/Summary:** Briefly recap the project and the specific points of contention (composite character, burning scene).
      *   **Ethical Analysis (The Core):**
          *   *The Director's Argument (Steelman):* Focus on epistemic justice. The archive is biased. Fidelity to a biased archive perpetuates harm. The film is a corrective act of imagination, not a documentary.
          *   *The Historian's Argument (Steelman):* Focus on public memory and the integrity of the record. Film has a powerful "truth effect." Symbolic destruction of the file mimics actual erasure. Future researchers might be misled.
          *   *The Family's Role:* Acknowledge the niece's consent, but note that Public Humanities ethics extend beyond next-of-kin to the broader public and historical record.
      *   **Recommendation & Conditions:**
          *   Need to distinguish fiction from fact without undermining the film.
          *   *Condition 1:* Disclaimer/Director's Statement. Explicitly state what is invented and why.
          *   *Condition 2:* Archival Preservation. Ensure the *actual* file is preserved/digitized and made accessible, countering the symbolic destruction.
          *   *Condition 3:* Educational Component. Since we are a Public Humanities Institute, tie the film to a discussion/event about archives and silence.
      *   **Timeline:** Needs to be before the premiere or final lock.
      *   **Closing:** Reiterate the Institute's mission.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I use external citations? *No.*
      *   *Check:* Did I steelman the losing side? *Yes, I need to make sure the Historian's argument (if I approve) or the Director's argument (if I reject) is presented strongly.* Since I'm recommending "Approve with Conditions," the "losing" side is technically the Historian's pure objection (that it shouldn't happen) and the Director's pure desire (no restrictions). I need to show why the conditions bridge the gap. Actually, the prompt asks to "give the losing side the strongest version of its argument." If I recommend approval, the Historian is the "loser" on the core objection. I must articulate their fear of historical distortion powerfully.
      *   *Check:* Tone. Needs to sound like a grad student rep who knows the ethics literature but isn't name-dropping. Analytical, not bureaucratic.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be clear. "Recommendation regarding [Project Name]"
      *   *The "Why":* The tension is between *narrative truth* (director) and *archival truth* (historian).
      *   *The Conditions:* Make them actionable. "Written statement," "Deposit of records," "Panel discussion."
      *   *The Steelman:* Ensure the Historian's point isn't just "lies are bad." It's about the *power dynamics of memory*. If the film becomes the primary source, the archive is effectively lost regardless of where it sits in a basement.

  6.  **Final Review against Constraints:**
      *   No citations? Checked.
      *   Reason from the case? Checked.
      *   Recommendation clear? Checked.
      *   Losing side strengthened? Checked.
      *   Timeline included? Checked.

  7.  **Final Polish:** Ensure the voice is appropriate for a committee memo (formal but engaged). (Self-correction: Make sure the distinction between the composite character and the burning scene is addressed, as they raise different ethical issues. Composite is standard practice; burning is specific falsification.)

  *(Self-Correction on "Losing Side"):* If I recommend "Approve with Conditions," the Historian's objection to the *invention* is partially overruled, but mitigated. The Director's desire for *unfettered* invention is also overruled. I should frame the "losing" argument as the one that would have prevailed without the compromise. The Historian's warning about public memory is the strongest counter-argument to approval. I will ensure that is highlighted as the primary risk we are managing.

