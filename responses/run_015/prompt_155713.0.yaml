  4. Precedent four is the closest analog because both involve a current student materially recreating an earlier design where significant original material was lost or replaced. The others differ because they involve mechanical reproduction, copying another artist, or distinct configurations of labor and authorship.

  5. Consider a student who deliberately burns their own finished oil painting and then repaints the identical image on a new canvas using the original sketches. If we accept that, we value design realization; if we decline it, we value the sanctity of the first material object.
