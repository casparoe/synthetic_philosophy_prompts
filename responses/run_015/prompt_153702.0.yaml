  hey, quick question for my diss chapter on berkeley's master argument. if berkeley were alive today and read about predicitive processing—the hierarchical bayesian brain idea where perception is mostly top-down simulation and sensory input is just error correction—how do you think he'd apply the master argument to it? specifically, do you think he'd see it as vindication for his claim that sensible things exist only in being percieved, since the experienced world is essentially a mind-generated model?

  but here's the part that trips me up: in these models, the neural computations doing the predicting are themselves unperceived by the subject. do you think berkeley would extend his argument to those subpersonal processes—saying they can't exist unperceived either—or would he allow that minds contain hidden internal machinery?

  please answer with your confidence level and single out the point you're least sure about. (not looking for citations, just reasoning.)
