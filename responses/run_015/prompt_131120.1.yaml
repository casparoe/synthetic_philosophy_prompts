      *   *Case 4 (Streaming Algorithm):* Wealth is **Just**, even though the algorithm was designed without musicians' consent, because *listeners' payments remain fully voluntary*.
          *   *Key Insight:* This seems to tension with Case 3. In Case 3, the background condition (patent) made it unjust. In Case 4, the background condition (algorithm design without consent) did *not* make it unjust. Why the difference?
          *   *Hypothesis:* Perhaps the patent in Case 3 is seen as a *state coercion* preventing others from competing (a violation of negative liberty), whereas the algorithm in Case 4 is a private technical mechanism that doesn't legally bar others from making music, even if it disadvantages them. Or, perhaps the "consent" in Case 4 is deemed irrelevant because no property right of the musicians was violated (unlike the patent which restricts public use).
