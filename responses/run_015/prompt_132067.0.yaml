  Design notes
  The tree prioritises logical separation over taxonomy. The first question isolates welfare consequentialism, which operates on a different temporal horizon than the others. The second splits group statistical criteria from individual case criteria, preventing category errors. The group branch separates the three major statistical commitments (parity, error rates, calibration) by forcing trade-offs regarding risk profiles. The individual branch begins with the simplest heuristic (unawareness) before moving to procedural requirements (reasons) and finally to causal or observational consistency (individual vs counterfactual). This order ensures analysts confront the easiest positions first, leaving the most technically demanding views for the final branches. Each question is phrased as a concrete operational claim to avoid triggering defensive jargon responses.

  The decision tree
  **Q1:** Is the primary goal to improve the group's long-term financial health, even if today's decisions look uneven?
  *   **Yes:** Go to Leaf 1.
  *   **No:** Go to Q2.

  **Q2:** Should we judge fairness by comparing group statistics or by looking at individual cases?
  *   **Group statistics:** Go to Q3.
  *   **Individual cases:** Go to Q5.

  **Q3:** Should approval rates be identical across groups, even if their risk profiles differ?
  *   **Yes:** Go to Leaf 2.
  *   **No:** Go to Q4.

  **Q4:** Should the rate of mistaken declines be identical across groups, even if risk profiles differ?
  *   **Yes:** Go to Leaf 3.
  *   **No:** Go to Leaf 4.

  **Q5:** Is it sufficient to simply remove protected characteristics from the data?
  *   **Yes:** Go to Leaf 5.
  *   **No:** Go to Q6.

  **Q6:** Must every declined applicant be told exactly what to change to get approved?
  *   **Yes:** Go to Leaf 6.
  *   **No:** Go to Q7.

  **Q7:** If two applicants have identical files, must they receive identical decisions?
  *   **Yes:** Go to Leaf 7.
  *   **No:** Go to Leaf 8.

  **Leaf 1:** Welfare-Consequentialist.
  **Leaf 2:** Demographic or Statistical Parity.
  **Leaf 3:** Equality of Error Rates.
  **Leaf 4:** Score-Conditional or Calibration-Style View.
  **Leaf 5:** Fairness Through Unawareness.
  **Leaf 6:** Reasons-on-Record Fairness.
  **Leaf 7:** Individual or Similar-Treatment Fairness.
  **Leaf 8:** Counterfactual-Causal View.

  Leaf key
  **Welfare-Consequentialist:** Awkwardly permits unequal treatment today if it maximises future group wealth.
  **Demographic Parity:** Awkwardly requires approving riskier applicants to match acceptance rates.
  **Equality of Error Rates:** Awkwardly demands equal mistake rates even if one group is inherently riskier.
  **Score-Conditional:** Awkwardly allows unequal acceptance rates if the score means the same risk.
  **Fairness Through Unawareness:** Awkwardly ignores proxy variables that correlate with protected traits.
  **Reasons-on-Record:** Awkwardly forces the lender to promise approval for changes that might increase risk.
  **Individual Fairness:** Awkwardly treats observational similarity as sufficient despite hidden causal differences.
  **Counterfactual-Causal:** Awkwardly requires modelling unobservable worlds where background traits changed.

  Empty cells
  The combination of Demographic Parity and Score-Conditional fairness is logically empty when base rates differ; you cannot have equal acceptance rates and equal score meaning simultaneously if one group defaults more often. Similarly, Fairness Through Unawareness combined with Counterfactual-Causal views is incoherent, as blindness prevents causal assessment of protected attributes. Finally, Welfare-Consequentialism paired with strict Individual Fairness is unattractive, as optimising long-term group outcomes often requires treating similar individuals differently to shift incentives. These cells represent mathematical impossibilities or contradictory ethical frameworks rather than unexplored policy positions.

  What the tree cannot separate
  The tree struggles to prise apart Individual Fairness and the Counterfactual-Causal View. In practice, ensuring similar treatment for identical files often approximates causal fairness, making the "No" answer to Q7 feel unnatural for those who care about individual justice. Additionally, the tree cannot distinguish between Welfare-Consequentialism and pure profit maximisation; both might accept uneven decisions for long-term gain, though their moral motivations differ. Finally, Equality of Error Rates and Score-Conditional views can converge when base rates are identical, making the distinction between Q3 and Q4 less sharp in specific, balanced portfolios common in mid-sized lending.

  My three draft questions, diagnosed
  Your first question, "Should the model ignore protected characteristics?", is leading; it names the "Fairness Through Unawareness" leaf directly, prompting analysts to select a label rather than reason about the outcome. The second, regarding 85% accuracy, conflates utility with fairness; accuracy measures overall performance, not the distribution of errors across groups, so it separates nothing in fairness space. The third question assumes identical distributions, which removes the tension between parity and calibration; it asks for parity only in the one scenario where it costs nothing, failing to test whether the analyst accepts parity when it conflicts with risk assessment. None force a trade-off.

  The trilemma
  Your colleague is incorrect regarding the "identical base rates" condition. The standard impossibility theorem states that Calibration and Equality of Error Rates cannot both hold *when base rates differ*. If base rates are identical, equal thresholds satisfy both criteria simultaneously. Adding actionable reasons does not create a static logical contradiction; it merely imposes a constraint on the decision boundary's shape. The tension arises dynamically if providing recourse alters the population's risk profile, but statically, the trilemma holds only when base rates diverge. Do not include this claim in the handout.
