answer: |-
  **Project Title:** The Recombinatorial Problem: Propositional Unity and Part-Travel Beyond Bradley's Regress

  **Principal Investigator:** [Your Name]
  **Duration:** One Semester (Four Months)
  **Request:** Independent Study Grant

  **Project Overview**

  Bradley's Regress is the classic ghost in the machine of analytic metaphysics. The problem is familiar: if a relation $R$ connects terms $a$ and $b$ to form the proposition or state of affairs $aRb$, what connects $R$ to $a$ and $b$? If another relation is required, we trigger an infinite hierarchy; if not, the unity of the proposition remains mysterious. The standard historiography suggests a tidy progression of solutions: Frege appealed to unsaturatedness, Russell to logical form, and Armstrong to non-mereological states of affairs. The consensus is often that while the problem is stubborn, these frameworks manage the local binding issue well enough to proceed with business as usual.

  This independent study proposes that this consensus is premature because it ignores a critical dimension of the problem. Existing accounts focus exclusively on the *local* problem of binding (how parts stick together here). They neglect what I call the *recombinatorial problem* (how parts travel). If $a$, $R$, and $b$ constitute a unified whole $aRb$, how can these very same parts be extracted and recombined into $aRc$ or $dRb$ without losing their identity or triggering a fresh regress at the extraction site? If the unity is too tight (as in Armstrong), the parts seem trapped within the specific complex. If the unity is too loose (as in mereological fusion), there is no proposition, only a list. My project asks: Can there be an account of propositional unity that explains both local binding and global part-travel without collapsing into an infinite hierarchy of meta-relations or into a monistic blur where parts aren't really distinct?

  **Critique of Existing Frameworks**

  The core motivation for this study is the suspicion that the standard solutions fail specifically on the criterion of portability. Frege's distinction between saturated objects and unsaturated concepts secures unity by making the relation inherently dependent on the terms. However, this makes "travel" difficult: if the concept is essentially unsaturated, does it retain its identity when detached from its original terms, or is it a different function entirely? Russell's appeal to logical form externalizes the unity, but this risks making the proposition a mere collection of constituents arranged by a form that is itself distinct from the parts. Armstrong's states of affairs offer robust unity, but they are notoriously rigid. In Armstrong's ontology, a state of affairs is not built from its constituents; rather, the constituents are abstractions from the state of affairs. This makes the idea of "extracting" $R$ to use it elsewhere metaphysically suspicious—it looks like we are breaking a substance to reuse its features.

  None of these views adequately address how logical inference works metaphysically. Inference relies on shared terms across different propositions. If the metaphysics of the proposition cannot account for the identity of parts across different complexes, the metaphysical grounding of logic remains obscure.

  **Methodology**

  The method will be close conceptual analysis, focused on identity conditions. I will proceed in three stages. First, I will formalize the "extraction condition": what must be true of a constituent $x$ in complex $C1$ for it to be numerically identical to constituent $x$ in complex $C2$? Second, I will test the standard models (Fregean, Russellian, Armstrongian) against this condition to demonstrate precisely where they fail to accommodate part-travel without ad hoc adjustments. Third, I will compare structured complexes against mereological fusion. Fusion allows parts to travel freely but fails to provide unity; structured complexes provide unity but restrict travel. The goal is to see if there is a middle category—a "portable unity"—that avoids the extremes.

  **Feasibility and Scope**

  Four months of part-time work is sufficient for this specific scope, provided I resist the temptation to solve the entire metaphysics of logic. The goal is not to definitively solve Bradley's Regress, but to precisely formulate the Recombinatorial Problem and evaluate whether it is a genuine metaphysical hurdle or a pseudo-problem generated by linguistic confusion.

  *   **Month 1:** Refine the definition of the Recombinatorial Problem and map the failure points in standard literature.
  *   **Month 2:** Develop the formal identity conditions for part-travel.
  *   **Month 3:** Test potential solutions (e.g., trope theory, structural realism) against these conditions.
  *   **Month 4:** Draft the final paper arguing for either a new category of unity or the dissolution of the problem.

  The risk is scope creep into general philosophy of language. I will mitigate this by strictly limiting the analysis to the metaphysics of constituents and complexes, avoiding broader semantic issues unless they directly impact the identity conditions.

  **Significance and Success Conditions**

  This is not merely metaphysical wheel-spinning. If propositions cannot share parts, then logical inference lacks a metaphysical backbone; we are merely shuffling symbols without ontological overlap. Clarifying this is essential for any realist account of logic.

  Success looks like one of two outcomes: either a viable sketch of a "portable unity" category that allows constituents to maintain identity across complexes without triggering regress, or a rigorous demonstration that the travel problem is pseudo—showing that our intuition about parts "traveling" is a category mistake. Failure would look like simply renaming Armstrong's states of affairs with extra steps, or concluding that the problem is insoluble without offering a diagnosis of why it seemed solvable in the first place.

  This project offers a chance to rejuvenate a classic debate by shifting the axis from "how do parts stick?" to "how do parts move?" I am confident that this angle yields fresh traction on an old problem and is manageable within the semester timeframe.
