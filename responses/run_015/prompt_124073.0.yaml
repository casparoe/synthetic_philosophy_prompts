answer: |-
  Here is a specification of desiderata for a theory of the sexed default, calibrated for a style guide context that demands actionability without sacrificing philosophical coherence.

  ### I. The Desiderata
  *What a theory must deliver to justify a style guide rule.*

  1.  **The Decidability Constraint (Genuine Desideratum)**
      The theory must yield a decision procedure that relies on public textual features and common knowledge, not authorial intent or private mental states. A copyeditor must be able to flag "manned spacecraft" without interviewing the author about whether they pictured women.
      *   *Why:* Style guides are compliance tools, not hermeneutic investigations.

  2.  **The Asymmetry Explanation (Genuine Desideratum)**
      The theory must explain Hofstadter's asymmetry (why *white* generic feels revolting while *man* generic feels merely annoying) without conceding that *man* is acceptable. It must distinguish between *current social salience* and *structural wrongness*.
      *   *Why:* If the theory cannot explain why we treat race and gender generics differently, it is descriptively inadequate to our actual moral intuitions.

  3.  **The Power-Neutrality Test (Genuine Desideratum)**
      The theory must predict the outcome of the Subordinate-Default case (where the generic term is historically the word for the colonized/subordinate group). Does the theory flag this as biased?
      *   *If Yes:* The theory is about semantic exclusion/ambiguity.
      *   *If No:* The theory is about power dynamics and dominance.
      *   *Why:* This separates theories of *language* from theories of *politics*. A style guide needs to know which one it is enforcing.

  4.  **The Empirical Independence Clause (Genuine Desideratum)**
      The theory must state whether null psychological findings (e.g., studies showing no difference in mental imagery between *firefighter* and *fireman*) falsify the objection.
      *   *Why:* A rule based on contingent empirical claims becomes obsolete if the data changes. A rule based on normative commitments survives data shifts.

  5.  **The Lexical Integrity Threshold (Genuine Desideratum)**
      The theory must provide a criterion for fossil cases (*manhole*, *no man's land*). Is the cutoff etymological (origin), morphological (decomposability), or associational (current activation)?
      *   *Why:* Copyeditors need to know when to stop editing.

  ### II. Prejudices vs. Desiderata
  *Common arguments categorized by their normative weight.*

  *   **"It's Uglier / Clunkier"**: **Prejudice.** (Aesthetic preference of the reform camp). This is subjective and varies by dialect. It cannot ground a principled rule.
  *   **"It's Only Etymology"**: **Prejudice.** (Defence of the traditionalist camp). The genetic fallacy; current usage overrides origin. A style guide governs current usage.
  *   **"The Treadmill Worry"** (Replacements will eventually decay): **Prejudice.** (Conservative fatalism). While linguistically plausible, it is not a valid argument against making an improvement now.
  *   **"Bright-Line Rules"**: **Desideratum** (for the copyeditor) but potentially **Prejudice** (if it ignores nuance).
  *   **"Sensitivity to Associative Profile"**: **Desideratum** (for accuracy) but potentially **Prejudice** (if it demands mind-reading).

  ### III. Incompatible Pairs
  *Trade-offs you cannot resolve, only manage.*

  1.  **Decidability vs. Associative Sensitivity:** You cannot have a rule that is perfectly easy to apply (bright-line) *and* perfectly sensitive to the actual associative profile of every term. *Manhole* might be semantically dead to a linguist but active to a layperson. A style guide must choose clarity over nuance or vice versa.
  2.  **Explaining Asymmetry vs. Timeless Wrongness:** If you explain Hofstadter's asymmetry by appealing to current power dynamics (race is more saliently hierarchical than gender right now), you admit the rule is contingent on social history. If you claim the wrongness is timeless/semantic, you struggle to explain why *white* generic is worse than *man* generic. You cannot have a rule that is both context-independent and explains context-dependent reactions.

  ### IV. The Knockout Requirement
  **The Power-Neutrality Test (The Subordinate-Default Case).**

  This requirement knocks out the most popular accounts because it forces a confession of the theory's true target.
  *   **Semantic/Exclusion Theories** (e.g., "it's ambiguous") must admit that a Subordinate-Default is *also* biased. If they hesitate, they are actually power theories.
  *   **Power/Dominance Theories** must admit that a Subordinate-Default is *less* biased or neutral. If they claim it is equally bad, they are actually semantic theories.
  *   **Most popular accounts** (especially the "inclusive language" rationale) conflate these. They claim the problem is exclusion (semantic) but only apply it when the excluded group is disadvantaged (political). This test exposes that inconsistency.

  ### V. Brief Critiques of Existing Accounts

  **1. The Etymology Defence**
  *Claim:* *Man* originally meant human; the male sense is secondary.
  *Verdict:* Fails the **Lexical Integrity Threshold**. Etymology does not govern current pragmatic effect. A style guide regulates communication now, not historical linguistics.

  **2. The Generic-Really-Is-Generic Semantics**
  *Claim:* *Man* denotes the species; the male reading is a contextual overlay.
  *Verdict:* Fails the **Asymmetry Explanation**. If *man* is truly generic, *white* could be too. The fact that *white* generic is intolerable suggests *man* is not functioning as a true neutral generic in our social context.

  **3. The Typical-Member Implicature Story**
  *Claim:* Using the male term implicates that the male is the prototype for the category.
  *Verdict:* Strong on psychology, weak on **Decidability**. It requires knowing what the audience considers "typical." It also struggles with the **Empirical Independence Clause**: if prototypes shift, does the prohibition vanish?

  **4. The Causal-Psychology Version**
  *Claim:* The term causes measurable exclusionary effects (e.g., women don't apply for jobs).
  *Verdict:* Fails the **Empirical Independence Clause**. If a study shows null effects for *manhole*, the rule becomes optional. This makes the style guide hostage to the latest journal issue.

  **5. The Expressive-Harm One**
  *Claim:* The institution expresses a commitment to male-normativity by using the term, regardless of hearer effect.
  *Verdict:* Best fit for a **Style Guide**. It satisfies **Decidability** (look at the word, not the brain) and **Empirical Independence** (the expression is the harm). However, it struggles with the **Asymmetry Explanation** unless tied to institutional history.

  ### VI. Confidence and Uncertainty

  *   **High Confidence:** The **Decidability Constraint** is non-negotiable for a style guide. Any theory that requires intent analysis is useless for copyediting.
  *   **High Confidence:** The **Etymology Defence** is logically invalid for usage guides.
  *   **Medium Confidence:** The **Expressive-Harm** account is the most robust for institutional policy, though it feels abstract to members.
  *   **Low Confidence (Least Sure):** The **Power-Neutrality Test** resolution. I am least sure what the *correct* answer to the Subordinate-Default case should be. If the generic word were historically the subordinate group's term, would it still be oppressive? Intuitions diverge wildly here. If the theory says "No," it admits the problem is power, not language. If it says "Yes," it admits the problem is semantics, not power. Resolving this determines whether your style guide is a linguistic correction or a political statement. I suspect you cannot satisfy both camps here.
