      *   *Mo's Offer:* Need to be clear. If the desk stays at the office, it's a business asset. If he takes it home, it's a perk. Assuming it stays at the office, it shouldn't count against his personal allowance if one existed. But since there *isn't* a personal allowance usually, Rhys is trying to create one.
