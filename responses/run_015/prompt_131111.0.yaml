answer: |-
  There is no single, canonical academic term specifically for this exact "suspend-then-replace" maneuver in the way you describe it. However, it is a recognized vulnerability in legal and procedural theory.

  In political science and legal theory, this is best described as a form of **Procedural Bootstrapping** or **Circumvention of Entrenchment via Emergency Powers.**

  While it shares DNA with Alf Ross's paradox of self-amendment, you are correct that it is distinct. Ross's paradox concerns a rule authorizing its own change (self-reference). Your pattern concerns **Rule B (Emergency) authorizing the change of Rule A (Amendment Threshold)**, followed by Rule C (New Threshold) erasing the authority of Rule B.

  Here is a precise breakdown of the pattern, its edges, and how it differs from a coup.

  ### 1. Proposed Name: The Suspension Bootstrap
  Since no standard term exists, the most precise descriptive label is **The Suspension Bootstrap**.

  **Definition:** A procedural maneuver where a temporary exception mechanism (usually an emergency suspension clause) is used to bypass a higher-threshold amendment requirement, allowing a lower-threshold vote to permanently replace the higher threshold, thereby retroactively validating the bypass.

  ### 2. Why It Feels Like a Loop (The Logical Tension)
  The "loop" you sense arises from the **Validity Gap**.
  *   **Time T1:** The vote to change the rule occurs. At this exact moment, the 2/3 rule is technically suspended, not deleted. The vote is valid *only if* the suspension is valid.
  *   **Time T2:** The new rule (simple majority) is enacted. The suspension expires.
  *   **The Paradox:** If the suspension was invalid (because emergency clauses usually cannot override entrenched amendment rules), the vote at T1 was void *ab initio* (from the start). A new rule passed at T1 cannot fix a void action at T1 unless it includes explicit **retroactive ratification**.

  If the new bylaws do not explicitly state "All actions taken during the transition period are ratified," the loop is broken: the new rule exists, but the vote that created it was illegal, leaving the organization in a state of contested legitimacy.

  ### 3. The Edges of the Mechanism
  You asked about the boundaries of this pattern. Here is where it holds and where it breaks:

  **A. Temporality (Temporary vs. Permanent Exception)**
  *   **Requirement:** The exception mechanism *must* be framed as temporary (e.g., "suspend for 48 hours").
  *   **Reason:** If the exception is permanent, it is simply a conflicting clause. In legal interpretation, specific clauses (Amendment Process) usually trump general clauses (Emergency Powers). A permanent exception would likely be ruled a drafting error or void for repugnancy.
  *   **The Bootstrap:** The "temporary" nature is the Trojan Horse. It allows the Chair to argue, "I am not changing the rule, I am merely pausing it." Once paused, the rule is vulnerable to being replaced rather than resumed.

  **B. Hierarchy (Entrenchment)**
  *   **The Weak Point:** This maneuver only works if the Emergency Clause is interpreted as **hierarchically superior** to the Amendment Clause.
  *   **Standard Parliamentary Law:** Under *Robert's Rules of Order (RONR)*, this maneuver is **out of order**. You cannot suspend a rule that protects a minority (like a 2/3 vote requirement) even by unanimous consent, let alone by Chair fiat.
  *   **Where it Works:** It is seen in poorly drafted HOA bylaws, small private clubs, or corporate boards where the "Emergency Powers" clause was written without "Except for..." limitations.

  **C. Retroactivity (The Ratification Clause)**
  *   **Crucial Edge:** For the loop to close cleanly, the new simple-majority rule must include language that ratifies the specific vote that created it. Without this, the "Suspension Bootstrap" leaves a scar: the rule is in place, but a disgruntled member can sue/appeal claiming the adoption vote was invalid because the suspension itself was ultra vires (beyond powers).

  ### 4. How It Differs From a Coup (With Paperwork)
  You asked how this differs from a "coup with paperwork." The distinction lies in **Legality vs. Legitimacy.**

  *   **A Coup (Autogolpe):** Relies on force or the explicit violation of the law. The actors know they are breaking the rules and rely on power to enforce the new reality. (e.g., "The election is cancelled, I am staying in charge.")
  *   **The Suspension Bootstrap:** Relies on **textual ambiguity**. It is an *intra-legal* maneuver. The actors claim they are following the rules exactly as written, exploiting a conflict between two valid clauses.
      *   **The Difference:** A coup rejects the constitution; the Bootstrap consumes it.
      *   **The Risk:** A coup succeeds if the army obeys. The Bootstrap succeeds only if no one challenges the interpretation in court or arbitration. If challenged, a judge may rule the Emergency Clause was never intended to override the Amendment Clause (Intent vs. Text).

  ### 5. Summary of the Phenomenon
  If you are documenting this or arguing against it, you should classify it as **Procedural Circumvention via Emergency Override.**

  *   **Is it valid?** In most formal legal systems and parliamentary procedures: **No.** Courts and arbitrators generally rule that amendment thresholds are "entrenched" and cannot be bypassed by procedural shortcuts unless the constitution explicitly says "Emergency powers supersede amendment thresholds."
  *   **Why do you see it?** It is a hallmark of **amateur drafting**. It appears in small organizations where the bylaws were copied from a template without understanding the hierarchy of norms. It persists because small organizations rarely litigate; they just accept the new reality (prescriptive legitimacy).

  **The precise definition for your records:**
  > **Suspension Bootstrap:** *A procedural maneuver wherein a temporary suspension power is utilized to bypass an entrenched amendment threshold, facilitating the adoption of a new threshold that permanently removes the original protection, relying on the de facto acceptance of the transition to cure the initial procedural defect.*

  It is not a feature of robust constitutional design; it is a **drafting vulnerability** that allows a temporary exception to become a permanent rule change.
