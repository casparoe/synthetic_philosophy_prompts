answer: |-
  **UNIVERSITY OF OXFORD**
  **FINAL HONOUR SCHOOL OF PHILOSOPHY**
  **PAPER 104: RATIONAL CHOICE AND ACTION**

  **Time allowed: 2 hours**
  **Candidates answer ONE question in no more than 1,500 words.**

  **1.** "The paradox of choice without preference conflates distinct problems." Distinguish the psychological, normative, and explanatory questions raised by cases of apparent symmetry. Discuss whether the normative verdict depends on whether the standoff arises from equal value, incomparability, or imprecise credences. Finally, consider whether the introduction of a strictly inferior third option breaks the symmetry, and whether the contrast between fictional and real agents illuminates the possibility of rational choice without a determining reason.

  ***

  ### MODEL ANSWER

  The paradox is often treated as a single puzzle, but it comprises three distinct inquiries. The **psychological** question asks whether an agent *would* freeze. **[Dispute: Empirical evidence suggests humans rarely freeze, but idealised rational agents might.]** The **normative** question asks whether choosing is permitted. **[Consensus: Choosing is generally permitted; freezing is rationally optional.]** The **explanatory** question asks how a choice can be rational if no reason favours one option over the other. **[Dispute: This is the core of the 'rational indeterminacy' debate.]**

  We must distinguish the source of the standoff. If options are of **equal value**, rationality is satisfied by either; there is no requirement to randomise. **[Consensus.]** If they are **incomparable** (on a par), the lack of a 'better than' relation does not imply equality. Here, choosing may be a way of creating a reason, not responding to one. **[Dispute: 'Will-based' accounts of rationality are controversial.]** If preferences are **imprecise** or incomplete, the standoff reflects the agent's unfinished business. Failing to settle a weighting is a rational failing only if one had sufficient opportunity to reflect; otherwise, it is merely a state of uncertainty. **[Dispute: Whether imprecision is a defect of the agent or the world is unresolved.]** The normative verdict differs: with equal value, either choice is fully rational; with incomparability, choice may be arational; with imprecision, choice might be premature.

  Consider the 'mouldy bale': a third option, strictly worse than one original bale but not the other. If this makes the dominating bale permissible where it was not before, it violates the Independence of Irrelevant Alternatives. **[Consensus: Standard rational choice theory forbids this.]** However, in symmetry cases, the third option breaks the visual or structural symmetry, providing a focal point. **[Dispute: Whether 'focal points' constitute rational reasons is debated.]** If the addition changes permissibility, it suggests the original case was not truly symmetric regarding context, even if values were equal. This generalises: in incomparability, a third option might make one option 'trumping'; in imprecision, it might force a precision. **[Dispute: Generalisability is uncertain.]**

  Finally, the fiction/reality contrast. In fiction, an agent without a supplied reason is under-written; the author's silence is determinate. **[Consensus: Literary theory.]** In reality, 'no reason supplied' does not entail 'no reason to prefer'. Real agents are not reasons-transparent; subconscious cues or somatic markers may determine choice without conscious access. **[Consensus: Psychology.]** However, if we require *conscious* reasons for rationality, the real agent resembles the fictional one. The gap collapses if rationality requires transparency. **[Dispute: Internalism vs Externalism about reasons.]** For a real agent to be in the character's position, the considerations moving her must be inaccessible even in principle, or non-existent. If non-existent, the choice is not reason-based but reason-creating. Thus, the fictional defect mirrors a genuine philosophical possibility: that rational agency sometimes outpaces reason. **[Dispute: This conclusion is a live minority view.]**

  ***

  ### MARKING SCHEME & EXAMINER'S NOTES

  **Total Marks: 25**

  **First Class (21–25 marks)**
  *   **Distinction of Questions:** Clearly separates psychological (causal), normative (permissibility), and explanatory (justification) issues. Does not conflate 'will not choose' with 'may not choose'.
  *   **Types of Standoff:** Distinguishes Equal Value (indifference) from Incomparability (no fact of the matter) and Imprecision (vagueness). Identifies that normative verdicts shift: indifference permits randomisation; incomparability may require will; imprecision may indicate irrational vagueness.
  *   **The Third Option:** Identifies the violation of Independence of Irrelevant Alternatives (IIA). Discusses 'focal points' or context-dependence. Addresses whether this generalises to incomparability/imprecision.
  *   **Fiction/Reality:** Engages with 'reasons-transparency'. Distinguishes authorial silence (ontological gap) from agent opacity (epistemological gap).
  *   **Critical Awareness:** Identifies which claims are consensus and which are disputed (as per model answer).

  **Upper Second (16–20 marks)**
  *   **Distinction of Questions:** Identifies the normative/explanatory split but may blur the psychological aspect (treating it as a prediction rather than a conceptual possibility).
  *   **Types of Standoff:** Distinguishes equality from incomparability but treats imprecision merely as ignorance. May assert the normative verdict is identical across all three.
  *   **The Third Option:** Notes the symmetry breaking but fails to link it to IIA or generalisability.
  *   **Fiction/Reality:** Treats the analogy superficially (e.g., "characters aren't real") without engaging with reasons-transparency.
  *   **Critical Awareness:** Treats disputed claims as settled fact.

  **Characteristic Mistakes (Penalise heavily)**
  *   **Empirical Reductionism:** Arguing the paradox is dissolved because "real donkeys always move". (This misses the normative point).
  *   **Uniqueness Assumption:** Assuming rationality *must* issue in a unique verdict (i.e., if two options are permissible, rationality has failed).
  *   **Historical Trivia:** Focusing on whether Buridan actually wrote about the ass. (Irrelevant to the conceptual problem).
  *   **Confusing Value:** Treating 'incomparable' as synonymous with 'equal'.

  ***

  ### EXAMINER'S NOTE FOR MARIANNE (GRADING GUIDANCE)

  **What to Mark Down:**
  *   **The "Freezing" Claim:** If a student argues that a rational agent *must* freeze in a symmetry case, mark down unless they provide a robust defence of the 'Principle of Sufficient Reason'. **[Consensus: Freezing is not required.]**
  *   **The "Mouldy Bale" Interpretation:** If they claim the third option changes the *value* of the original bales, mark down. It changes the *choice context*, not the intrinsic value. **[Consensus.]**
  *   **Fiction/Reality Collapse:** If they argue the contrast is *purely* linguistic, mark down. There is a metaphysical difference between authorial omission and agent opacity. **[Dispute: But strong linguistic reductionism is a minority view.]**

  **Defensible Minority Views (Do Not Mark Down):**
  *   **Will-Based Rationality:** A student arguing that in cases of incomparability, the will *creates* the reason is defending a live position (e.g., existentialist or Kantian accounts).
  *   **Imprecision as Irrational:** Arguing that having imprecise credences is itself a rational failing (accuracy-first epistemology) is defensible.
  *   **Reasons Externalism:** Arguing that real agents *do* have reasons even if inaccessible, whereas fictional agents *do not*, is a strong position.

  **Uncertainty Note:**
  *   **Generalisability of the Third Option:** I am unsure whether the 'mouldy bale' effect genuinely generalises to cases of incomparability. Some models suggest it does (trumping), others that it category-errors. If a student argues it *does not* generalise, do not penalise provided they justify the disanalogy. **[Examiner Uncertainty.]**

  **Differentiation (21 vs 24 marks):**
  *   A **21** answers all parts competently.
  *   A **24** identifies the tension between the 'explanatory' question and the 'fiction' question: if a choice is rational without a determining reason (explanatory gap), is the agent essentially fictionalised (no reason supplied)? The ability to link the metaphysics of agency to the metaphysics of fiction distinguishes the top mark.
