answer: |-
  The scriptorium was silent save for the scratching of Elian's quill, a sound like insects chewing through wood. On the desk lay two papers. One was the raw scroll from Lord Varen, written in the jagged hand of a man who had slept little. The other was the rigid grid of the Court Sonnet, fourteen lines, alternating rhyme, with a refrain that must address the recipient by name. To deviate was treason. To fail was collapse.

  Varen's raw message was simple: *I sold the border passes. I beg you not to execute me. I claim it was for the good of the state.*

  The recipient was Lady Isolda, Warden of the Gates. The form demanded praise. The truth demanded blood.

  Elian dipped the quill. He had to build a bridge between Varen's guilt and Isolda's justice using only the stones provided by the meter. He had already laid the foundation. The first quatrain stood firm, a facade of loyalty.

  *Oh Isolda, stone and star,*
  *The realm rests on your hand.*
  *No matter where we are,*
  *You hold the only land.*

  He moved to the second quatrain. The rhythm was a heartbeat, steady and unforgiving. *Da-DUM, da-DUM, da-DUM, da-DUM.* He could not stumble. He needed to convey Varen's confession without using the word *fault*. The form forbade accusation; the refrain required adoration.

  *Oh Isolda, stone and star,*
  *Your vision cuts the deep.*
  *We know just who we are,*
  *While others promise sleep.*

  He paused. *Promise sleep* was dangerous. It sounded like rest, but in the old tongue, it hinted at burial. It was a crack in the plaster, barely visible. But the real weight rested on the final couplet. The rhyme scheme demanded a partner for *deep*.

  Elian looked at the list of permissible rhymes. *Keep, Sweep, Weep, Reap.*

  *Keep* implied retention. *Weep* implied sorrow. *Reap* implied consequence.

  He needed a word that sounded like reconciliation but carried the weight of severance. He needed a word that meant *forgiveness* on the surface but *cutting* underneath.

  His eye caught *Release*.

  It rhymed with *Peace*.

  *Release*. From the Latin *relaxare*, to loosen. To set free. In the court tongue, it was a word of grace. *I grant you release from your debts.* It sounded like a gift. But to loosen a bond was to undo it. To release a hawk was to let it fly away, never to return. It was a polite word for abandonment.

  If he wrote *Peace*, he promised continuity. If he wrote *Release*, he promised an end disguised as a gift.

  Elian hovered the quill over the paper. The ink pooled, black and viscous. If he chose *Keep*, he lied for Varen. If he chose *Release*, he preserved the honesty of the betrayal within the architecture of the apology. The form would hold, but the room inside would be empty.

  He pressed the nib down. He wrote *Release*.

  *Oh Isolda, stone and star,*
  *The final line is drawn.*
  *I offer you release,*
  *To greet the coming dawn.*

  He finished the sonnet. Fourteen lines. The structure was sound. The rhythm marched. The refrain praised her name. It looked like a plea for mercy. It read like a resignation.

  He blew on the ink until it dried, then rolled the parchment into a cylinder sealed with wax. He carried it through the marble halls to the Chamber of Audiences. Isolda sat on the dais, her hands folded over the hilt of a sword that never left her side.

  Elian knelt. He unrolled the scroll. He began to read, his voice modulated to the neutral tone of the court translator, neither accuser nor defender, merely a vessel for the structure.

  *"Oh Isolda, stone and star..."*

  He recited the lines. The rhythm filled the room, a steady drumming that lulled the guards. He reached the final quatrain. He felt the weight of the word *Release* in his mouth. It felt light, airy, like a feather. But he knew it was a stone.

  *"I offer you release,"* he said, his voice steady.

  He looked up. Isolda did not blink. She heard the official meaning: *Varen frees you from obligation.* She heard the hidden meaning: *Varen admits the bond is broken.* She heard the etymological trace: *Loosening. Severing. End.*

  *"To greet the coming dawn."*

  Elian rolled the scroll closed. The silence in the chamber was heavy, not with confusion, but with recognition. The form had been preserved. The edifice stood. But the air inside had changed.

  Isolda stood. She did not look at Varen, who waited in the antechamber. She looked at Elian.

  "The structure is sound," she said softly.

  "It holds, my Lady," Elian replied.

  "Then let it stand," she said. She turned to her guards. "Lord Varen is released from his duties. Effective immediately."

  She used the word *released*. She had heard the accusation inside the praise. She had accepted the severance disguised as a gift. The poem had done its work. The building remained, but the tenant had been evicted.

  Elian bowed and backed away. He left the scroll on the dais. It was no longer a message. It was a verdict.
