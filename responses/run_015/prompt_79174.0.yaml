answer: |-
  You have put your finger on the central methodological rot in the "violence is declining" literature (most notably associated with Steven Pinker), but you are right that it rarely gets a single, clean label. It is usually waved away as "definitions change," which misses the circularity you've identified.

  Here is the carving you asked for: the technical names for the bind, how it differs from your comparisons, and why "freezing the definition" cannot save us.

  ### 1. Is there a name for this bind?

  There is no single "Eureka" noun, but there are three precise terms from different fields that, when stacked, describe exactly what you are seeing.

  **A. The Technical Term: Measurement Non-Invariance**
  In psychometrics and longitudinal statistics, this is the formal name for your problem. **Measurement Invariance** asks: *Does this instrument measure the same construct at Time A as it does at Time B?*
  If you measure "depression" in 1950 and 2020, but the cultural understanding of sadness has shifted, you lack invariance. You cannot compare the scores. In the violence debate, the "ruler" (the definition of violence) has stretched *while* the object being measured (human conflict) has shifted. The trend line is mathematically real, but ontologically meaningless because the unit of measurement is not constant.

  **B. The Sociological Term: Concept Creep (specifically, Semantic vs. Ontological)**
  Psychologist Nick Haslam coined **Concept Creep** to describe how harm-related concepts (abuse, trauma, violence) expand over time.
  *   **Semantic Creep:** We use the word "violence" for more things (e.g., "structural violence").
  *   **Ontological Creep:** We actually *experience* and *record* those things differently.
  Your bind is that Concept Creep is driven by **Moral Progress**. The same moral shift that stops the husband from beating the wife (reducing the count) also reclassifies the beating as "violence" rather than "discipline" (increasing the count). When you look at the data, you cannot tell if the line goes down because the acts stopped, or because the acts moved from the "invisible/legitimate" bucket to the "visible/illegitimate" bucket, where they are now counted but also discouraged.

  **C. The Philosophical Term: Interactive Kinds (or Reflexive Classification)**
  Philosopher Ian Hacking described **Interactive Kinds**: classifications that change the thing being classified. "Violence" is an interactive kind. By classifying an act as "violence" (rather than "discipline"), we change the social reality of that act (it becomes punishable, shameful, statistically visible).
  The bind you noticed is that the *classifier* (us, with our modern morals) and the *classified* (historical acts) are entangled. We are judging the past by a standard that, if applied in the past, would have altered the past.

  **The Bind Itself:** If I had to coin the phrase for the specific circularity you described, I would call it **Normative-Descriptive Entanglement**. The *norm* (violence is bad) drives the *description* (this counts as violence), which drives the *statistic* (violence is down), which validates the *norm*.

  ### 2. How is it different from the Observer Effect?

  The **Observer Effect** (in physics or social science) is when the *act of measuring* changes the *outcome*. (e.g., A police crackdown reduces crime because criminals hide, not because they stopped).

  Your bind is deeper. It is not that measuring violence changes violence. It is that **changing the moral framework changes both the violence and the definition simultaneously.**
  *   **Observer Effect:** Measurement $\rightarrow$ Behavior Change.
  *   **Your Bind:** Moral Shift $\rightarrow$ (Behavior Change + Definition Change).
  The correlation between the two changes creates the illusion of a clean trend, when it is actually a co-constituted shift.

  ### 3. Is it the same as the Heart Attack / Autism analogy?

  Structurally, yes. Methodologically, no.

  *   **Medical Reclassification (Heart Attacks/Autism):** This is **Diagnostic Substitution** or **Surveillance Bias**. We assume there is a *biological reality* (plaque in arteries, neural connectivity) that exists independently of the label. The new test is "truer." The count goes up because we are seeing the *same underlying reality* more clearly.
  *   **Violence Reclassification:** There is no "biological reality" of violence independent of moral judgment. A husband beating a wife in 1700 was physically identical to 2024, but *socially* it was a different act (authority vs. assault).
      *   In medicine, better detection = **Closer to Truth**.
      *   In violence, better detection = **Closer to Justice**, but **Further from Comparability**.

  The medical analogy assumes a "fact of the matter" beneath the label (the blood test). In violence, the label *creates* the fact of the matter (the assault charge). So while the *statistical artifact* is the same (counts shift due to criteria), the *epistemic status* is different. You cannot say we are "detecting" historical violence better; we are *importing* modern categories into historical silence.

  ### 4. What would it take to answer the question? (The "Freezing" Problem)

  You asked: *If I freeze today's definition and recount the past, do I get a fact of the matter or just a guess dressed up?*

  This method is called **Retrospective Coding**. Criminologists try to do this (e.g., "Code all historical deaths as 'homicides' if they fit the modern legal statute").

  **Why it fails (The Edge of the Carving):**
  1.  **Archival Silence:** As you noted, sources use old vocabulary. A coroner's report from 1600 says "died by misadventure during chastisement." A modern coder must decide: Is this a homicide? A domestic accident? Discipline? The source does not contain the data required to apply the modern code. The coder must *impute* intent based on modern norms.
  2.  **Contextual Stripping:** To code a past act as "violence" using today's definition, you must strip it of its contemporary legitimacy. But the *legitimacy* was part of the act's causal structure. (The husband beat the wife *because* it was legitimate). By recoding it as violence, you are analyzing a counterfactual history (a world where that act was considered violence then).
  3.  **The Denominator of Suffering:** Even if you could perfectly recode the past, you run into the **Dark Figure of Crime**. Modern violence is under-reported, but historical violence was often *un-reportable* (no category for it). You are comparing a partially counted present to a largely uncountable past.

  ### Summary: Where the Edges Are

  You wanted the carving rather than the label. Here is where the boundaries lie:

  *   **The Hard Edge:** Physical harm (broken bones, death). This is comparable across time, *but* it is too narrow to capture the "violence" debate (which includes threat, coercion, psychological harm).
  *   **The Soft Edge:** Legitimacy. This is where the data breaks. The "decline of violence" is largely a **decline in legitimized violence**. We haven't necessarily stopped hitting each other as much as we have stopped agreeing that hitting is allowed.
  *   **The Trap:** Treating **Moral Progress** as a **Statistical Variable**. You cannot use the *result* of moral progress (our current sensitivity) to measure the *extent* of moral progress (the decline of violence) without circularity.

  **The Verdict:**
  The phenomenon is **Measurement Non-Invariance driven by Concept Creep**.
  The bind is **Normative-Descriptive Entanglement**.
  The attempt to fix it by freezing definitions is **Retrospective Coding**, which yields **Interpretive Guesses**, not Facts of the Matter.

  The trend is real, but it is not a trend in *harm* alone; it is a trend in *the tolerability of harm*. We are measuring the shrinking of permission, not just the shrinking of pain, and the data cannot distinguish between the two.
