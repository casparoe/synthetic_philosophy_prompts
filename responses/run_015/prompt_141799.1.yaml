answer: |-
  Here is the spec for a theory of moral revolution, calibrated for utility to a campaigner rather than philosophical purity.

  ### The Five Cases: Constraints vs. Preferences

  For a theory to be useful to a campaigner, it must predict levers. If it excludes cases where norms *actually* disappear, it is descriptively false. If it excludes cases where the campaigner has no leverage, it is practically useless.

  1.  **The Cost/Inconvenience Collapse (Practice dies, Belief stays)**
      *   **Verdict:** **Genuine Constraint.**
      *   **Case:** Horse-drawn carriages, leaded petrol. People didn't morally renounce them; they just became untenable.
      *   **Why:** A campaigner needs to know if they should target *conscience* or *supply chains*. If a theory insists belief must change for the norm to count as "collapsed," it blinds the campaigner to the lever of making the practice expensive. The "Arguments" camp treats this as a preference (excluding it as "not real morality"), but for a campaigner, the outcome is identical.

  2.  **Pluralistic Ignorance (Private rejection, Public compliance)**
      *   **Verdict:** **Genuine Constraint.**
      *   **Case:** The end of apartheid; the fall of the Berlin Wall.
      *   **Why:** This is a coordination problem, not a conviction problem. A theory must explain how to bridge the gap between private sentiment and public action. If the theory assumes public behavior mirrors private belief, it cannot solve the silence that sustains the norm.

  3.  **The Timing Problem (Argument dormant, then sudden success)**
      *   **Verdict:** **Genuine Constraint.**
      *   **Case:** Gay rights arguments existed for decades before the 2010s tipping point; abolitionist arguments existed before the economic shift.
      *   **Why:** This is the most critical constraint for resource allocation. If a theory cannot explain why an argument works *now* but didn't work *then*, it cannot tell a campaigner whether to invest in messaging today or wait for conditions to ripen.

  4.  **Elite Self-Sabotage (Honour-holders end the system)**
      *   **Verdict:** **Genuine Constraint.**
      *   **Case:** British aristocrats ending the duel; Southern elites (some) aiding abolition.
      *   **Why:** This breaks the "Interests" story. A theory must account for why status-holders would dismantle the very hierarchy that grants them status. If it can't, it cannot recruit the influencers necessary for most campaigns.

  5.  **Imposed Abolition (Conqueror/Colonial)**
      *   **Verdict:** **Bogus Demand (for a theory of *campaigning*).**
      *   **Case:** Britain banning Sati in India; Allies ending Nazism.
      *   **Why:** This is a category error for a *campaign* theory. A campaigner operates within a polity using persuasion or pressure. Imposition is an act of war or sovereignty, not moral revolution. Including this as a requirement forces the theory to account for exogenous force (armies) which the campaigner cannot pull. It is a preference of the "Power" camp to conflate occupation with conversion.

  ***

  ### The Incompatible Pair: Generality vs. Texture

  The two desiderata that cannot be jointly satisfied are **Predictive Generality** (derived from Case 3, Timing) and **Explanatory Depth** (derived from Case 4, Honour-Economy).

  *   **The Tension:** To give a campaigner a universal lever (e.g., "Always raise the cost" or "Always shame the elite"), you must abstract away the specific cultural codes that make the shame work. But to explain why the British aristocrat stopped duelling while the American cowboy didn't, you need a thick description of that specific honour economy.
  *   **The Trade-off:** A theory general enough to cover AI ethics, slavery, and duelling will be too vague to tell you *which* honour code to target. A theory specific enough to explain the honour code will not transfer to the next campaign. You must choose: a **Universal Heuristic** (good for scanning many issues, low success rate) or a **Contextual Diagnosis** (high success rate, high cost per issue).

  ***

  ### The Knockout Requirement

  The single requirement that knocks out the most of the three usual stories is **The Timing Constraint (Case 3)**.

  *   **Why:**
      *   **Arguments:** Moral arguments are timeless. If validity were the engine, the revolution would happen when the argument is first made. The Timing Constraint kills the "Arguments" story because it cannot explain the lag.
      *   **Interests:** Material structures are usually slow-moving. If interest were the engine, change would be gradual. The Timing Constraint (sudden collapse) kills the crude "Interests" story because it cannot explain the spike.
      *   **Honour:** Social dynamics (contagion, tipping points, status realignment) are the only mechanism that naturally accounts for sudden, non-linear shifts after a long dormancy.

  ***

  ### The Williams-y Point

  The point that "a revolutionary's reasons aren't reasons for the person she's arguing with" is best handled as a **Constraint on Causal Mechanism**.

  *   **Placement:** It sits under **Case 3 (Timing)** and **Case 2 (Pluralistic Ignorance)**.
  *   **Function:** It forbids the theory from treating "Truth" or "Validity" as a causal force. It mandates that the theory must explain how an *external* reason (the campaigner's argument) becomes an *internal* reason (the target's motivation). This forces the theory to focus on the *bridge* (shame, interest, identity) rather than the *message*.

  ***

  ### Scorecard

  *   **Arguments:** Fails Timing; assumes internal reasons are created by external validity.
  *   **Interests:** Fails Elite Self-Sabotage; cannot explain status-driven altruism.
  *   **Honour:** Passes Timing and Elite constraints; fails Generality (hard to scale).
