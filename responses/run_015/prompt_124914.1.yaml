      *   **Subject-Stakes Invariantism (SSI) / Pragmatic Encroachment:** "S knows that p" has fixed content, but truth conditions depend on the *subject's* practical situation (stakes for the subject).

  3.  **Section 1: The Five Cases:**
      *   *Case 1: The Detached Ascriber.* (High stakes Subject, Low stakes Ascriber).
          *   AC: Ascriber's context is low stakes -> "Knows" is true.
          *   SSI: Subject's stakes are high -> "Knows" is false.
          *   *Credibility:* Intuitively, if Ben loses his house, saying "Ben knows" seems misleading/false even if Ada is just theorizing. SSI wins here.
      *   *Case 2: Hidden Stakes.* (Subject thinks low stakes, actually high stakes).
          *   *Stipulation needed:* Objective vs. Subjective stakes.
          *   AC: Depends on Ascriber's knowledge. If Ascriber knows hidden stakes, standard rises. If not, stays low.
          *   SSI: If objective stakes matter -> No knowledge. If subjective stakes matter -> Knowledge.
          *   *Credibility:* Knowledge usually tracks truth/reliability relative to *actual* danger, not perceived. SSI (objective) seems stronger, but AC can track if Ascriber knows.
      *   *Case 3: Imposed Stakes.* (Adversary raises stakes for Subject).
          *   AC: Ascriber's context unchanged (unless Ascriber knows about adversary). "Knows" remains true in Ascriber's mouth.
          *   SSI: Subject's stakes raised -> Knowledge lost.
          *   *Credibility:* It feels wrong that an enemy can delete your knowledge just by betting against you. This is a classic reductio against SSI. AC handles this better (knowledge is stable, only the *ascription* might change if the Ascriber acknowledges the threat).
      *   *Case 4: Delegated Stakes.* (High stakes Ascriber/Actor, Low stakes Subject/Source).
          *   *Question:* Does Ada know? (Ada is the actor, Ben is the source). Wait, the prompt asks "Does Ada know?" but Ada relies on Ben. Usually, this tests testimonial knowledge. Let's assume the ascription is about *Ben* knowing, but Ada is the ascriber/actor. Re-reading: "Ada must act... Ben's say-so... Does Ada know?" This is about testimonial transmission.
