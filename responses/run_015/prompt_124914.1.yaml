      *   *Availability:* Hard to get clear data on embedded cases, but theoretically available.

  5.  **Section 3: Asymmetries:**
      *   *Generalization (Belief/Credence):* SSI fits well with Pragmatics of belief (rational action). AC is semantic, harder to apply to belief itself (do I *believe* differently based on your context?).
