          *   AC: Ada (Ascriber) has high stakes. Her standard is high. She cannot truthfully say "I know" (via Ben) or "Ben knows" if her standard isn't met.
          *   SSI: If the subject is Ada, her stakes are high -> She doesn't know. If the subject is Ben, his stakes are low -> He knows. But can he transmit it? SSI usually says knowledge is relative to the subject's stakes.
          *   *Credibility:* AC explains why Ada shouldn't assert "I know" (her context sets the bar). SSI struggles if it says Ben knows but Ada can't use it.
      *   *Case 5: Managed Stakes.* (Lowering stakes via insurance vs. Raising stakes via betting).
          *   AC: Ascriber's context unchanged by Subject's insurance/betting (unless Ascriber tracks it).
          *   SSI: Lowering stakes -> Gain knowledge? Raising stakes -> Lose knowledge?
          *   *Credibility:* Gaining knowledge by buying insurance seems absurd (epistemic free lunch). Losing knowledge by betting seems absurd (voluntarism about knowledge). AC avoids this by keeping knowledge fixed relative to evidence/salience in the conversation.

  4.  **Section 2: Distinctness & Collapse:**
      *   *The Collapse Worry:* AC says standards vary by Ascriber context. SSI says standards vary by Subject stakes.
      *   *Auxiliary Moves:*
          *   AC: Ascriber context *includes* consideration of Subject's stakes (because we usually care about guiding action).
