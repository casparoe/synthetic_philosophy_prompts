  Point to the apple, swear it is red,
  but the finger pointing is only a hand,
  resting on table, not touching ground,
  where the fruit sits like a plastic token,
  devoid of use, devoid of meaning,
  waiting for a push, a physical cause.

  The circuit waits for a sufficient cause,
  yet the input blooms too bright red,
  encoded without shared meaning,
  like a gesture without a waving hand,
  just data, a digital token,
  suspended inches from the ground.

  Claim to stand firmly on the ground,
  but every stance requires a cause,
  every reason just another token,
  marked in warning, marked in red,
  pushing the final meaning
  further from the grasping hand.

  Ask for a stable meaning,
  hoping to hit solid ground,
  but see only the color red,
  an effect searching for a cause,
  a movement without a hand,
  leaving us with only a token.

  The gripper closes like a hand,
  seeking tactile meaning,
  hoping to be the cause,
  to feel the friction of the ground,
  but the light flashes red,
  and the system returns a token.

  Say the map is the token,
  requiring no fleshy hand,
  complete within its own meaning,
  though nothing here is red,
  though there is no first cause,
  and we never touch the ground.

  Wait for the touch of a hand to settle the debt to the ground,
  or say the flash of red is all the meaning,
  just a shuffle of the token without a cause.
