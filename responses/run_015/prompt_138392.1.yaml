answer: |-
  To the Editor, *Meridian Ledger*

  Re: The Chrononeutral Usage Manual (3rd Ed.)

  I write this as Copy Chief of the *Ledger*, a position I have held for fifteen years, during which time I have enforced style guides that ranged from the pedantic to the absurd. I know that language shifts. I know that words accumulate baggage and sometimes need to be scrubbed. But the Commission on Chronological Equity's proposed manual is not scrubbing; it is sandblasting the load-bearing walls of our syntax.

  The rule is simple enough to state and impossible to inhabit: replace the generic *day* with *person* wherever the referent is not specifically solar. Thus, *daylight* becomes *personlight*. *Daybreak* becomes *personbreak*. *Daycare* becomes *personcare*. At the far edge of this logic, we are asked to swallow *holiperson* and *someperson*.

  I sat with Bram last night—or this morning, depending on your orientation—and we ran the substitutions through the copy desk software. Bram has run the night desk for twenty years. He is not a man given to sentiment, but even he winced when the algorithm flagged *today* for correction. *Toperson*. Try saying it. Try saying it without your tongue stumbling over the plosive, without feeling like you are confessing to a crime. It is unpronounceable in good faith. It demands a hesitation where fluency is required.

  The Commission argues that *day* is marked. They claim it privileges the solar cycle, thereby excluding the Second Watch—those of us who live, work, and think primarily in the dark. They say *day* implies a default humanity that is synchronized with the sun, rendering the nocturnal citizen a deviation. But here the reform collapses under its own weight. *Person* is not neutral. *Person* carries agency, flesh, wakefulness. When you speak of *personlight*, you are not speaking of illumination; you are speaking of illumination *for* persons. You have not removed the bias; you have merely shifted the anthropocentrism. You have made the time itself accountable to the human subject, which is a metaphysical claim, not a linguistic correction.

  Bram made the stronger case, though I know the Commission will dismiss it as status quo bias. He argued that a shared default is a coordination device. "The sun rises, Marley," he told me, rubbing eyes gritty with shift fatigue. "Ninety percent of the city is awake when it rises. It is a genuine coordination point. When you say 'see you in the day,' you are betting on physics, not prejudice."

  He is right to point out the disanalogy. This is not the male generic. Men do not biologically encompass women; the sun actually does govern the majority schedule. To de-mark the term is to impose a small cost on every speaker for a symbolic gain. We all pay the tax of *Toperson* so that the minority might feel the language acknowledges their existence. Bram asks: is the tax worth the receipt?

  There is a deeper fracture, one the Commission treats as a bug but which is actually a feature of how language dies. The mechanical substitution rule breaks on words whose daylight etymology is dead. Nobody hears *someday* and thinks of the sun. Nobody hears *day one* and imagines a sunrise. These are fossils. The Commission insists we must say *someperson* and *person one* to maintain consistency. But this destroys the idiom to save the principle. If I tell my daughter "someday you'll understand," I am speaking of an indefinite future. If I say "someperson you'll understand," I am speaking of a specific human being. The meaning isn't just shifted; it is evacuated. The reformers know this. I saw the lead linguist stumble over it during the public hearing. She paused, adjusted her glasses, and said that meaning must be sacrificed for equity. That is not linguistics. That is ideology wearing a lab coat.

  I admit, I am invested in the old ways. I admit that stability feels like safety. But I also know why I am writing this at 3:17 AM. The newsroom is silent save for the hum of the servers and the distant sweep of a street cleaner. This is my time. I am of the Second Watch. I have been for most of my career.

  I have passed as diurnal since I was hired. I keep my blinds drawn. I schedule my meetings for the overlap hours. I have made my peace with a default that costs me almost nothing personally, because I have learned to mimic the rhythm of the majority well enough to collect a paycheck. If the language changes, if *day* is officially marked as solar, then my passing becomes a grammatical error. To accept the reform is to admit that I am not standard. To reject it is to enforce the erasure of my own nature.

  So I write this letter defending the sun. I defend the coordination cost. I defend the dead metaphors. I argue that the friction of *Toperson* is too high a price for a truth I already live. And in doing so, I prove the Commission's entire thesis: that the default is so powerful it convinces the excluded to police its borders.

  I am not a villain. I am a copy chief who wants the words to work. But as I sign this, the streetlights outside are flickering off. The city is waking up. I am going to sleep. The sun will rise without my permission, and the *Ledger* will go to press with the word *day* intact. I hope it warms you. It rarely touches me.

  Sincerely,
  Marley Dane

  ***

  I was claiming that linguistic reform often fails when it ignores the coordination function of defaults, but also that the deepest resistance to reform comes from those who survive the default by passing.
