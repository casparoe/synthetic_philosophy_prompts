      *   *Objection 5 (The Cynic - The "It's Just a Game" Objection):* "People choose to be there. Turn it off and go outside."
          *   *Reply:* Dismisses the agency invested. Real life also has voluntary associations.
          *   *Soft Spot:* Can sound patronising.

      *   *Objection 6 (The Legal/Dev Hybrid - The "Shutdown" Objection):* "Shutting down a server isn't a crime. Why is it a loss?"
          *   *Reply:* It's the destruction of a community space, like burning a town hall.
