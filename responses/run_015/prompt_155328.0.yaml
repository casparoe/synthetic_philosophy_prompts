  ### Deliverable 1 — Readings of the Claim

  | Reading | Precise claim | Status | Supports the dismissal? | What would settle it |
  | :--- | :--- | :--- | :--- | :--- |
  | All-risks safety reading | The overall annual probability of death from any cause is lower now than in any past era. | platitude | no | Aggregate mortality data across all causes. |
  | Per-capita rate reading | The annual number of violent deaths per 100,000 people is lower now than in prior centuries. | substantive and contested | no | Agreement on which deaths count as violent. |
  | Absolute count reading | The total number of violent deaths occurring globally per year is lower now than in the past. | false or very likely false | no | Global population size and total death counts. |
  | Share-of-deaths reading | Violence constitutes a smaller percentage of all human deaths now than it did historically. | substantive and defensible | no | Causes-of-death statistics across time periods. |
  | Lifetime risk reading | The cumulative probability of an individual dying violently over a full lifespan is lower now than before. | substantive and contested | partly | Life tables adjusted for violent mortality risks. |
  | Historical baseline comparison reading | The current era is safer than any specific past moment, century, or stated baseline period. | substantive and contested | partly | Selection of a specific comparative historical baseline. |
  | Perception bias reading | The world is objectively safer than people perceive because attention biases toward vivid violent events. | substantive and defensible | no | Data on media consumption versus actual risk exposure. |
  | Robustness cluster reading | Every reasonable operationalization of violence shows a downward trend across the relevant time period. | false or very likely false | yes | Consistency checks across divergent metrics and definitions. |
  | Stipulative definition reading | Violence is defined as direct physical force by an identifiable agent, excluding structural or policy harms. | indeterminate (no fact of the matter as stated) | yes | Philosophical agreement on the boundary of the concept violence. |
  | Moral progress reading | Human societies are morally improved such that they are less inclined toward harmful behavior than before. | indeterminate (no fact of the matter as stated) | no | Normative agreement on what constitutes moral improvement. |
  | Exposure-to-threat reading | The total person-years lived under credible standing threat of violence is lower now than in past eras. | indeterminate (no fact of the matter as stated) | no | A method for quantifying unexecuted threats and psychological security. |

  ### Deliverable 2 — Measures and Movements

  | Measure | Direction it can be expected to move across the periods under discussion | Which readings it can support and which it cannot | Main weakness |
  | :--- | :--- | :--- | :--- |
  | Absolute count | Upward (due to population growth) | Supports: Absolute count reading. Cannot support: Rate or share readings. | Ignores population size; conflates scale with risk. |
  | Per-capita rate | Downward (typically) | Supports: Per-capita rate, Lifetime risk. Cannot support: Absolute count. | Hides total suffering; excludes structural violence. |
  | Share of all deaths | Downward (due to medicine) | Supports: Share-of-deaths, All-risks safety. Cannot support: Absolute count. | Can fall even if violence rises (if medicine improves faster). |
  | Lifetime risk | Downward (typically) | Supports: Lifetime risk, Per-capita rate. Cannot support: Absolute count. | Aggregates varying risks; sensitive to life expectancy changes. |
  | Threatened person-years | Unknown / Likely Upward | Supports: Exposure-to-threat. Cannot support: Standard decline narratives. | Lacks standard measurement; counts psychological states. |

  The per-capita rate is the default or obvious choice in this literature, presupposing that individual risk intensity matters more than total suffering or structural conditions. Helping oneself to it without argument assumes violence is primarily interpersonal rather than systemic or environmental.

