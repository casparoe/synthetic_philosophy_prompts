      *   *Step 3: Empirical Uncertainty Check.* Address Failure 3 (Lexical). If a Veto is based on an empirical claim (e.g., "patient is conscious"), require a confidence threshold. If empirical confidence is low, the moral veto is downgraded to a "Strong Objection."
      *   *Step 4: Ranking the Remainder.* Address Failure 2. Don't use 0-100. Use Rank (1st, 2nd, 3rd) among *permissible* options.
      *   *Step 5: Aggregation.* Borda Count or Plurality on the top rank.
      *   *Step 6: The "Human Handoff".* If no option survives Veto, or tie remains, the decision defaults to the Surrogate/Attending with a "Dissent Recorded" note. The committee advises on *process*, not just *outcome*.
