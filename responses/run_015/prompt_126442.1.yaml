answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Consultation Committee
  **FROM:** Committee Chair
  **SUBJECT:** Protocol for Aggregated Moral Recommendation (PAMR) v1.0
  **DATE:** October 26, 2023

  ### 1. PREAMBLE: THE PHILOSOPHY OF THIS PROCEDURE

  We are not here to discover Moral Truth. We are here to produce a defensible institutional action within forty minutes. We acknowledge that our five moral frameworks are incommensurable. We acknowledge that we cannot mathematically average a "right" out of a "wrong."

  This procedure is designed to be **robust to disagreement**. It prioritizes *permissibility* (what we can live with) over *optimality* (what is best). It treats moral uncertainty differently from empirical uncertainty. It explicitly prevents a single member's low-probability catastrophic fear from paralyzing the committee.

  This document serves as our standing order. When we are in the room, we do not debate the procedure. We run the procedure.

  ---

  ### 2. THE PROCEDURE (PAMR)

  **Time Allocation:** 40 Minutes Total.

  #### PHASE 1: EMPIRICAL & LEGAL FLOOR (10 Minutes)
  *Goal: Eliminate options that are impossible or illegal before moral reasoning begins.*

  **Q1.1:** What are the medically feasible options? (e.g., Continue Vent, Withdraw Vent, Palliative Extubation).
  *   *Standard:* Treating Attending must confirm medical feasibility.
  *   *Output:* A list of 2–4 concrete options.

  **Q1.2:** Are any options illegal or against hospital policy?
  *   *Standard:* Committee Lawyer + Attending.
  *   *Halt Condition:* If only one option remains legal/feasible, the recommendation is that option. Stop.
  *   *Output:* The "Permissible Menu."

  #### PHASE 2: THE VETO (PERMISSIBILITY CHECK) (10 Minutes)
  *Goal: Address Failure Mode 1 (Compromise Options) and Failure Mode 3 (Lexical Dominance).*

  **Q2.1:** For each option on the Menu, is there any theory you hold that renders this action **Morally Forbidden** (not just sub-optimal)?
  *   *Standard:* Binary Yes/No per member. No scaling.
  *   *Rule:* An option is **Killed** if 3 or more members vote "Forbidden."
  *   *Rule:* If fewer than 3 vote "Forbidden," the option remains **Live**, even if one member believes it is infinitely bad. (See Case 3 justification).
  *   *Note:* A "Forbidden" vote requires citing the specific constraint (e.g., "Killing," "Abandonment," "Battery").

  **Q2.2 (The Empirical Burden):** If a "Forbidden" vote is based on an empirical claim (e.g., "The patient is conscious," "This will cause pain"), is there clinical evidence supporting that claim?
  *   *Standard:* If the empirical claim is speculative (e.g., "Metaphysical possibility of consciousness" without EEG correlate), the "Forbidden" vote is downgraded to "Strong Objection." It counts toward the ranking (Phase 3) but *not* toward the Veto count.
  *   *Rationale:* We cannot hold institutional action hostage to unverified metaphysical risks.

  **Halt Condition:** If all options are Killed (3+ Vetoes each), the Committee cannot recommend. We recommend **Escalation** (Court, Transfer, or Risk Management). Stop.

  #### PHASE 3: RANKING THE LIVE OPTIONS (10 Minutes)
  *Goal: Address Failure Mode 2 (Intertheoretic Comparison).*

  **Q3.1:** Of the **Live** options remaining, rank them 1st, 2nd, 3rd based on your moral framework.
  *   *Standard:* Ordinal ranking only. No scores (0–100). No QALYs.
  *   *Constraint:* You may not rank a "Live" option as #1 if you voted "Forbidden" in Phase 2 (consistency check).

  **Q3.2:** Whose values determine the tie-break?
  *   *Rule:* If the Patient's prior values are known, they act as a "Super-Vote" for the option aligning with them.
  *   *Rule:* If unknown, we use **Plurality**. The option with the most #1 ranks wins.
  *   *Rule:* If tie persists, the **Care-Ethics** rank breaks the tie (prioritizing relationship integrity/least relational harm), as this is a community hospital context.

  #### PHASE 4: DOCUMENTATION & SIGN-OFF (10 Minutes)
  *Goal: Audit Trail.*

  **Q4.1:** Complete the PAMR Audit Form (see Section 5).
  **Q4.2:** Secure 3 Member Signatures + Attending Countersignature.
  **Q4.3:** If a member dissents, their "Strong Objection" is recorded in the chart but does not block the recommendation.

  ---

  ### 3. ADDRESSING THE FAILURE MODES

  1.  **The Compromise Option (Ventilator Yes, Pressors No):**
      *   *Fix:* **Phase 2 Veto.** If the Deontologist says "Impermissible" and the Consequentialist says "Cruelty," both will vote "Forbidden." That is 2 votes. If the Care Ethicist agrees it harms the family narrative, that is 3. The option is Killed before ranking. We do not average forbidden acts.
  2.  **Intertheoretic Comparison (0–100 Scales):**
      *   *Fix:* **Phase 3 Ordinal Ranking.** We do not compare *how much* better an option is. We only compare *order*. A Consequentialist's "70" and a Deontologist's "70" are both just "2nd Place." This removes the need to normalize utility functions.
  3.  **Lexical Dominance (The 3% Infinity):**
      *   *Fix:* **Phase 2 Veto Threshold + Empirical Burden.** A single member cannot veto. It requires 3/5. Furthermore, if the "Infinity" relies on an empirical claim (e.g., "soul is present"), it requires clinical evidence. If evidence is absent, the vote is downgraded to an Objection. This prevents Pascal's Wager from paralyzing the hospital.
  4.  **Whose Credences?**
      *   *Fix:* **Committee as Proxy.** We use the Committee's judgment for moral permissibility. We use the Patient's known values for tie-breaking. We do not average the patient's values into the moral theory; we treat their values as a constraint (similar to the Law).
  5.  **Meta-Uncertainty (How to aggregate uncertainty):**
      *   *Fix:* **Procedural Agreement.** We are not agreeing on a moral theory. We are agreeing on *this protocol*. The protocol itself is the solution to the meta-uncertainty.

  ---

  ### 4. CASE APPLICATIONS

  #### Case 1: Surrogate Demand vs. Futility
  *   **Facts:** Father, catastrophic brain injury. Surrogate (daughter) wants "everything." Team says futile.
  *   **Options:** (A) Continue All, (B) Withdraw to Palliative.
  *   **Phase 1:** Both medically feasible. Both legal (surrogate has authority, but futility policy exists).
  *   **Phase 2 (Veto):**
      *   Deontologist A: Withdrawal = Killing. Votes **Forbidden** on (B).
      *   Deontologist B: Futile treatment = Extraordinary Means. Votes **Forbidden** on (A).
      *   Consequentialist: (A) is cruelty. Votes **Forbidden** on (A).
      *   Care Ethicist: (A) harms family long-term. Votes **Forbidden** on (A).
      *   Lawyer: (A) creates liability. Votes **Forbidden** on (A).
      *   *Result:* Option (A) has 4 Vetoes. **Killed.** Option (B) has 1 Veto. **Live.**
  *   **Phase 3 (Ranking):** Only (B) remains.
  *   **Recommendation:** Withdraw to Palliative.
  *   **Note:** The procedure resolves the "Killing vs. Letting Die" debate by counting heads. Since 4/5 find continuing treatment impermissible, it is out.

  #### Case 2: Triage (One ICU Bed)
  *   **Facts:** Patient A (25% survival, arrived first). Patient B (70% survival, arrived later).
  *   **Options:** (A) Treat A, (B) Treat B.
  *   **Phase 1:** Both feasible/legal.
  *   **Phase 2 (Veto):**
      *   No option is inherently "Forbidden" by 3 members. Triage protocols vary. Both **Live**.
  *   **Phase 3 (Ranking):**
      *   Consequentialist: Ranks (B) #1.
      *   Deontologist: Ranks (A) #1 (First Come/Queue).
      *   Care Ethicist: Ranks (A) #1 (Relational trust in queue).
      *   Lawyer: Ranks (B) #1 (Standard of Care/Survival).
      *   Chair: Ranks (B) #1.
      *   *Count:* (A) gets 2 first-place votes. (B) gets 3 first-place votes.
  *   **Recommendation:** Treat Patient B.
  *   **Note:** The procedure acknowledges the moral cost to Patient A but aggregates the committee's judgment that saving the life is the priority ranking.

  #### Case 3: The 3% Infinity (Withdrawal + Religious View)
  *   **Facts:** Withdrawal of nutrition/hydration. One member holds 3% credence that patient has conscious inner life (religious tradition), making withdrawal "Murder" (Infinite Disvalue).
  *   **Options:** (A) Continue, (B) Withdraw.
  *   **Phase 1:** Both feasible/legal.
  *   **Phase 2 (Veto):**
      *   Member X votes **Forbidden** on (B) based on "Murder of Innocent."
      *   *Empirical Burden Check:* Is there clinical evidence of consciousness? (EEG is flat).
      *   *Ruling:* The claim of consciousness is metaphysical/speculative. Member X's vote is downgraded to **Strong Objection**. It does not count toward the Veto threshold.
      *   Other 4 Members: Vote **Permissible** on (B).
      *   *Result:* (B) has 0 Vetoes. **Live.**
  *   **Phase 3 (Ranking):**
      *   Member X ranks (A) #1 (but notes Objection to B).
      *   Others rank (B) #1.
  *   **Recommendation:** Withdraw.
  *   **The "Hateable" Truth:** This procedure explicitly rules that **institutional action cannot be vetoed by low-credence metaphysical risks without empirical warrant.** If we allowed the 3% infinity to win, we could never withdraw care from *any* PVS patient, as someone could always posit a 1% chance of a soul. The procedure prioritizes *actionable evidence* over *metaphysical possibility*. This is the cost of running a hospital.

  ---

  ### 5. THE AUDIT FORM (PAMR-01)

  *To be completed during Phase 4. Attached to the consult note.*

  **Consult ID:** ___________
  **Date:** ___________
  **Members Present:** ___________________

  **1. The Menu (Phase 1)**
  [ ] Option A: _______________ (Feasible? Y/N) (Legal? Y/N)
  [ ] Option B: _______________ (Feasible? Y/N) (Legal? Y/N)

  **2. The Veto (Phase 2)**
  *Did 3+ members declare this option Morally Forbidden?*
  [ ] Option A: Veto Count: ___ / 5. (Status: Live / Killed)
  [ ] Option B: Veto Count: ___ / 5. (Status: Live / Killed)
  *If Veto Cast, Basis (Check one):*
  [ ] Deontological Constraint (e.g., Killing)
  [ ] Consequentialist Catastrophe (e.g., Certain Death)
  [ ] Care/Ethical Violation (e.g., Abandonment)
  *If Veto relied on empirical claim, was evidence present?*
  [ ] Yes [ ] No (If No, Veto downgraded to Objection)

  **3. The Ranking (Phase 3)**
  *Count of #1 Ranks among Live Options:*
  [ ] Option A: ___ Votes
  [ ] Option B: ___ Votes
  *Tie-Breaker Used:* [ ] Patient Values [ ] Care-Ethics Default [ ] None

  **4. Recommendation**
  [ ] Proceed with Option: _______
  [ ] Escalation (All Options Killed)

  **Signatures:**
  ___________________ (Member 1)
  ___________________ (Member 2)
  ___________________ (Member 3)
  ___________________ (Attending Physician)

  ---

  ### 6. LIMITATIONS: WHAT THIS PROCEDURE CANNOT DO

  1.  **It Cannot Guarantee Moral Truth:** This procedure guarantees *process integrity*, not that the decision is "Right" in a cosmic sense. It ensures we are consistent, not that we are good.
  2.  **It Cannot Resolve Deep Empirical Disagreement:** If the Attending says "Futile" and a Consultant says "Recovery Possible," Phase 1 halts. We are not a second medical opinion. We must defer to the Treating Team's medical judgment or call a second medical opinion.
  3.  **It Cannot Protect the Conscience of the Minority:** If the recommendation passes 3-2, the 2 dissenters must sign the form recording their "Strong Objection," but they cannot block the action. They may recuse themselves from implementation, but the Hospital proceeds.
  4.  **It Cannot Handle "True" Lexical Uncertainty:** If 3 members genuinely hold a lexical veto on an option (e.g., "This is Torture"), the option dies. If the Committee is split 2 vs 3 on whether something is Torture, the procedure forces a decision. It does not solve the ambiguity; it votes on it.

  ### 7. FINAL NOTE TO THE COMMITTEE

  This procedure is a machine. It will sometimes produce results that feel cold. It will sometimes override a deeply held minority view. This is necessary. We are not a seminar; we are a committee in a hospital with a waiting room full of families.

  The value of this document is not that it makes us agree. It is that it allows us to disagree *productively*. It separates the arithmetic (counting votes) from the value judgment (casting the vote). It puts the value judgment where it belongs: on the conscience of the individual member, recorded in the audit trail.

  If you cannot sign a recommendation generated by this procedure, you must resign from the committee. If you can sign it, even with reservations, we proceed.

  **Approved by Chair.**
