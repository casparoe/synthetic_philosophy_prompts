      *   *Failure 3: Lexical Dominance/Infinity.* Small credence on infinite disvalue swamps the calculation.
          *   *Fix:* Cap the weight of "catastrophic but low probability" claims unless there is *evidence* supporting the empirical premise (e.g., is there actually consciousness?). Distinguish moral uncertainty from empirical uncertainty.

  3.  **Develop the Procedure (The "Protocol for Aggregated Moral Recommendation" - PAMR):**

      *   *Goal:* Produce a recommendation that is defensible, transparent, and actionable within 40 mins.
      *   *Philosophy:* "Reflective Equilibrium via Constraint Satisfaction." We aren't finding the *True Good*, we are finding the *Least Objectionable Permissible Path*.
      *   *Step 1: Empirical & Legal Floor.* (Lawyer + Medical Lead). Is it legal? Is it medically possible? If no, stop.
