n worry is genuinely troubling, but I am unsure whether (5) or (8) is the weaker link. Which step should I reject, and what does rejecting it cost? Does Rieff’s case for forgetting in In Praise of Forgetting help stabilize the argument, or does it accelerate the collapse?
