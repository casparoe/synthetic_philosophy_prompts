prompt: |-
  I am preparing a consistency audit for my applied ethics seminar on institutional morality and individual obligation. Below is the package of commitments I have arrived at regarding effective altruism and its standard critiques. I want to know whether they form a coherent philosophical profile, or whether I am helping myself to incompatible motivations.

  (1) I accept the institutional critique in its strong form: that effective altruism's focus on individual optimization systematically obscures structural mechanisms of harm, treating unjust institutions as fixed background conditions rather than objects of collective transformation, and that earning-to-give within such institutions risks functioning as moral licensing.

  (2) Despite (1), I defend earning to give as permissible and sometimes optimal, provided it is practiced as what I term non-substitutive giving: the donor explicitly treats philanthropic contribution as parallel to, rather than a replacement for, institutional reform efforts.

  (3) I regard measurability bias as a deep epistemic failure in longtermist cause prioritization. The attempt to rank distant, speculative outcomes using near-term quantifiable metrics involves a category error that undermines the reliability of career-ranking estimates derived from such comparisons.

  (4) I hold that career choice should be governed by straightforward expected-value maximization: agents ought to select paths that maximize social value using the best available quantitative estimates, including longtermist ones, and epistemic humility should not function as a blanket prohibition on acting under uncertainty.

  (5) I also maintain that honoring sunk career costs can be rational: if I have spent years building specialized expertise and relational capital in direct global-health implementation, switching away solely because updated longtermist estimates assign a different path a higher expected value wastes genuinely irreplaceable organizational knowledge and human capital.

  Please audit this set. Specifically: does (2) genuinely avoid the legitimization problem raised in (1), or does non-substitutive giving collapse into the very moral licensing it seeks to avoid? Does (3) render (4) untenable, given that (4) relies precisely on the longtermist estimates that (3) discredits? Is (5) compatible with (4), or does my defense of sunk-cost honoring invoke a non-consequentialist value—such as narrative integrity or loyalty to past investment—that conflicts with expected-value maximization? Rank the tensions by severity, distinguish genuine conflicts from merely apparent ones, and indicate what the least costly revision would be and what it costs.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the Request:**
      *   **Task:** Conduct a consistency audit on a set of five philosophical commitments regarding effective altruism (EA), institutional morality, and individual obligation.
      *   **Goal:** Determine coherence, identify incompatibilities, rank tensions by severity, distinguish genuine vs. apparent conflicts, and suggest revisions with their costs.
      *   **Input:** Five specific commitments (1-5).
      *   **Context:** Applied ethics seminar on institutional morality and individual obligation.

  2.  **Analyze the Commitments:**

      *   **(1) Institutional Critique (Strong):** EA's individual focus obscures structural harm. Unjust institutions are treated as fixed, not transformable. Earning-to-give (EtG) risks moral licensing.
      *   **(2) Defense of Earning-to-Give (EtG):** EtG is permissible/optimal *if* "non-substitutive." Philanthropy is parallel to, not a replacement for, reform.
      *   **(3) Critique of Measurability Bias:** Longtermist cause prioritization suffers from epistemic failure. Ranking speculative distant outcomes with near-term metrics is a category error. Undermines reliability of career-ranking estimates.
      *   **(4) Expected-Value (EV) Maximization:** Career choice *should* maximize social value using best available quantitative estimates, *including longtermist ones*. Epistemic humility $\neq$ inaction.
      *   **(5) Sunk Cost Defense:** Honoring sunk career costs (expertise, relationships) is rational. Switching paths solely due to updated longtermist estimates wastes irreplaceable capital.

  3.  **Evaluate Specific Tensions (as requested):**

      *   **Tension A: (1) & (2) - The Moral Licensing Problem.**
          *   *Claim:* (2) tries to solve (1) by saying "do both" (EtG + Reform).
          *   *Critique:* Does "non-substitutive" actually work psychologically or structurally? If the institution is fundamentally unjust (per 1), can one profit from it without reinforcing it? If the critique is that EA *systematically obscures* structure, does adding a personal commitment to reform actually change the systemic obscuring?
          *   *Verdict:* High tension. "Non-substitutive" is a psychological intention, but (1) is a structural critique. Intent doesn't necessarily negate structural complicity. However, it's not a logical contradiction, more of a pragmatic/sociological risk.

      *   **Tension B: (3) & (4) - The Epistemic Contradiction.**
          *   *Claim:* (3) says longtermist estimates are unreliable due to category errors/measurability bias. (4) says maximize EV using best available estimates, *including longtermist ones*.
          *   *Critique:* If (3) is true (that these estimates involve a category error and undermine reliability), then they cannot be the "best available quantitative estimates" in a meaningful sense for maximization. Using a broken ruler to maximize length is irrational. (4) explicitly endorses acting on the very estimates (3) discredits.
          *   *Verdict:* **Severe/Logical Contradiction.** This is the biggest problem. You can't say "X is epistemically broken" and "Maximize based on X" simultaneously without significant qualification.

      *   **Tension C: (4) & (5) - Consequentialism vs. Sunk Costs.**
          *   *Claim:* (4) is straightforward EV maximization. (5) says don't switch paths even if EV says so, because of sunk costs/capital.
          *   *Critique:* Standard consequentialism says sunk costs are irrelevant; only future outcomes matter. However, (5) argues that "organizational knowledge and human capital" are *future* assets that would be wasted.
          *   *Nuance:* If "wasting capital" means *future* value is lost, then (5) is actually consistent with (4). If "wasting capital" means "I invested 5 years, so I owe it to my past self," that's non-consequentialist.
          *   *Reading (5):* It says switching "wastes genuinely irreplaceable organizational knowledge." This sounds like a *forward-looking* claim (loss of future utility), not just backward-looking regret.
          *   *Verdict:* Apparent conflict. Can be reconciled if (5) is framed as "transaction costs of switching" rather than "honor the past."

  4.  **Drafting the Audit:**

      *   **Introduction:** Acknowledge the sophistication of the position. It's a "reformist EA" stance.
      *   **Section 1: The Epistemic Contradiction (3 vs 4).** This is the fatal flaw. (3) undermines the input for (4).
      *   **Section 2: The Structural/Agency Tension (1 vs 2).** This is the pragmatic flaw. Can individual intent overcome structural critique?
      *   **Section 3: The Sunk Cost/Maximization Tension (4 vs 5).** This is the easiest to fix. Reframe sunk costs as switching costs.
      *   **Ranking:** (3)/(4) is highest severity. (1)/(2) is medium. (4)/(5) is low.
      *   **Revisions:**
          *   Fix (3)/(4): Modify (4) to exclude discredited estimates or modify (3) to allow for "rough" estimates.
          *   Fix (1)/(2): Strengthen the "collective" aspect of (2).
          *   Fix (4)/(5): Clarify the consequentialist justification for (5).

  5.  **Refining the Analysis (Self-Correction/Deep Dive):**

      *   *Re-evaluating (3) vs (4):* (3) says measurability bias undermines *reliability*. (4) says use *best available*. If longtermist estimates are the *only* ones available for certain causes, are they still the "best"? Yes, but if they are *unreliable* due to category error, using them for *maximization* is dangerous. The conflict is between "Category Error" (3) and "Maximize using this" (4). A category error implies the number doesn't mean what you think it means. You can't maximize based on a nonsense number.
      *   *Re-evaluating (1) vs (2):* The prompt asks if "non-substitutive giving collapses into moral licensing." The risk is high. If the institution is unjust (1), profiting from it (EtG) might be impermissible regardless of where the money goes. (2) assumes the *use* of funds washes the *source*. (1) questions the source.
      *   *Re-evaluating (4) vs (5):* "Sunk cost fallacy" is ignoring future value because of past cost. (5) argues that *future* value (organizational knowledge) is lost if you switch. This is actually a *forward-looking* constraint. So (5) is compatible with (4) *if* phrased carefully. But the phrasing "honoring sunk career costs" is dangerous terminology for a consequentialist. It sounds deontological.

  6.  **Finalizing the Output Structure:**
      *   Executive Summary.
      *   Detailed Analysis of the Three Key Tensions.
      *   Severity Ranking.
      *   Recommended Revisions (Least Costly vs. Most Coherent).
      *   Conclusion.

  7.  **Writing the Content:** (Mental check of tone: Academic, rigorous, constructive, critical.)
      *   *Key Insight on (3)/(4):* The tension isn't just uncertainty; it's validity. If the metric is invalid (category error), it's not an estimate, it's noise.
      *   *Key Insight on (1)/(2):* The "non-substitutive" clause is an individual solution to a structural problem. It might be sociologically naive.
      *   *Key Insight on (4)/(5):* Terminology matters. "Sunk cost" vs. "Switching cost."

  8.  **Final Polish:** Ensure all parts of the prompt are answered (Rank tensions, distinguish genuine/apparent, indicate revisions and costs).

      *(Self-Correction during drafting)*: Wait, look closely at (4). It says "including longtermist ones." (3) says longtermist prioritization involves a "category error." This is a direct contradiction. I need to be very firm on this.
      Look at (5). "Honoring sunk career costs." In strict EV terms, you never honor sunk costs. You honor *future* potential. If the user means "I stay because my future value is higher here," that's (4). If they mean "I stay because I already invested," that's anti-(4). The text says "switching... wastes... capital." This implies future loss. But the label "honoring sunk costs" is the problem. I will point out the terminological conflict.

      *Revision Strategy:*
      1.  To fix (3)/(4): Limit (4) to "epistemically robust" estimates. Cost: Less scope for longtermism.
      2.  To fix (1)/(2): Acknowledge that (2) doesn't fully solve (1), but mitigates it. Cost: Humility about EtG's moral cleanliness.
      3.  To fix (4)/(5): Rename (5) to "Specialization Retention." Cost: None, just clarity.

      *Let's assemble the response.*
answer: |-
  ### Consistency Audit: Institutional Morality and Individual Obligation

  **Executive Summary**
  Your philosophical profile attempts to synthesize a structuralist critique of Effective Altruism (EA) with a modified consequentialist framework for individual action. While the profile is intellectually ambitious, it contains one **fatal logical contradiction**, one **significant pragmatic tension**, and one **terminological ambiguity**.

  The most severe issue lies between commitments (3) and (4). You cannot simultaneously claim that longtermist metrics involve a *category error* (rendering them epistemically invalid) and that career choice should *maximize expected value using those specific estimates*. This is not merely a tension; it is a performative contradiction.

  Below is the detailed audit, ranked by severity.

  ---

  ### 1. The Epistemic Contradiction: (3) vs. (4)
  **Severity:** **Critical (Logical Incompatibility)**
  **Type:** Genuine Conflict

  *   **The Conflict:** Commitment (3) asserts that longtermist cause prioritization relies on a "category error" that "undermines the reliability of career-ranking estimates." Commitment (4) mandates that agents "maximize social value using the best available quantitative estimates, **including longtermist ones**."
  *   **The Analysis:** If (3) is true, longtermist estimates are not merely uncertain; they are *invalid*. A category error implies the metric does not measure what it claims to measure (e.g., measuring "moral worth" in "dollars"). If a ruler is broken, it is not the "best available" tool for measuring length, even if it is the only one you have. To maximize expected value (EV) based on data you have explicitly identified as epistemically corrupted is irrational within a consequentialist framework. It violates the internal coherence of (4).
  *   **Verdict:** You cannot hold both. You must either rehabilitate the epistemic status of longtermist estimates or exclude them from the maximization calculus.

  ### 2. The Structural/Agency Tension: (1) vs. (2)
  **Severity:** **High (Pragmatic Instability)**
  **Type:** Genuine Conflict (with potential for mitigation)

  *   **The Conflict:** Commitment (1) argues that EA's individual focus *systematically obscures* structural harm and that earning-to-give (EtG) within unjust institutions risks *moral licensing*. Commitment (2) attempts to solve this via "non-substitutive giving," where the individual intends philanthropy to be parallel to reform.
  *   **The Analysis:** The tension here is sociological rather than logical. Commitment (1) is a *structural* critique (institutions function to obscure harm regardless of intent), while (2) offers an *agential* solution (individual intent prevents licensing).
      *   **The Collapse Risk:** "Non-substitutive giving" relies on the donor's psychological state to negate a structural mechanism. If the institution functions by externalizing harm (as per 1), the *source* of the funds remains tainted regardless of the *use* of the funds. Furthermore, if the "systematic obscuring" is real, the individual is likely incapable of accurately assessing whether their giving is truly "non-substitutive."
      *   **Verdict:** (2) does not fully resolve the legitimization problem of (1). It mitigates it, but claiming it *avoids* moral licensing is overly optimistic. The structural critique suggests that individual "clean hands" strategies are often co-opted by the system they seek to reform.

  ### 3. The Sunk Cost Ambiguity: (4) vs. (5)
  **Severity:** **Low (Terminological/Conceptual)**
  **Type:** Apparent Conflict (Resolvable)

  *   **The Conflict:** Commitment (4) demands "straightforward expected-value maximization." Commitment (5) defends "honoring sunk career costs." In strict consequentialism, sunk costs are irrelevant; only future outcomes matter.
  *   **The Analysis:** This conflict depends entirely on how you justify (5).
      *   **Incompatible Reading:** If you stay in a role because you *owe it to your past self* (narrative integrity/loyalty), this is a deontological or virtue-ethical constraint that conflicts with (4).
      *   **Compatible Reading:** Your justification in (5) cites the waste of "irreplaceable organizational knowledge and human capital." This is a *forward-looking* claim. It argues that the *transaction costs* of switching (loss of specific capital) outweigh the theoretical EV gain of the new path.
  *   **Verdict:** This is an apparent conflict caused by imprecise language. "Honoring sunk costs" is the wrong phrase for a consequentialist. "Preserving specialized capital" is compatible with (4).

  ---

  ### Ranking of Tensions

  1.  **(3) vs. (4):** **Critical.** Logical contradiction regarding the validity of inputs for decision-making.
  2.  **(1) vs. (2):** **High.** Pragmatic failure where an individual solution is applied to a structural problem.
  3.  **(4) vs. (5):** **Low.** Terminological confusion regarding the nature of "costs."

  ---

  ### Recommended Revisions

  To restore coherence, you must prioritize logical validity over scope. Here are the revisions, ordered from least costly to most robust.

  #### Option A: The "Epistemic Humility" Revision (Least Costly)
  *   **Target:** Modify (4).
  *   **Revision:** Change (4) to mandate EV maximization using the best available *epistemically robust* estimates. Explicitly exclude longtermist estimates that fail the "category error" test defined in (3), or discount them heavily (e.g., by orders of magnitude) to account for the epistemic failure.
  *   **Cost:** You lose the ability to confidently prioritize speculative longtermist causes over near-term measurable ones. It narrows the scope of "optimal" careers to those with tractable metrics.
  *   **Coherence Gain:** Resolves the Critical contradiction.

  #### Option B: The "Switching Cost" Revision (Low Cost)
  *   **Target:** Modify (5).
  *   **Revision:** Strike the phrase "honoring sunk career costs." Replace with "minimizing the loss of specialized human capital." Frame the decision strictly as a comparison of *future* trajectory value (Current Path + Capital vs. New Path - Transition Loss).
  *   **Cost:** None philosophically; merely semantic precision.
  *   **Coherence Gain:** Resolves the Low tension; aligns (5) firmly with (4).

  #### Option C: The "Complicity" Revision (High Cost, High Integrity)
  *   **Target:** Modify (2).
  *   **Revision:** Acknowledge that "non-substitutive giving" does *not* fully avoid the legitimization problem of (1). Reframe (2) to argue that EtG is permissible *only if* a portion of effort is dedicated to *structural disruption* of the earning source itself, not just parallel philanthropy. Admit that moral licensing is a residual risk that must be actively managed, not solved by intent.
  *   **Cost:** This makes the "permissibility" of EtG much harder to satisfy. It demands more of the agent than just donating money; it demands political/structural labor that might conflict with the "earning" part of EtG.
  *   **Coherence Gain:** Aligns the individual commitment with the structural reality of (1).

  ### Final Recommendation for the Seminar Package

  To present a coherent profile, I recommend adopting **Option A** and **Option B** immediately, as they are required for logical consistency.

  1.  **Revise (4):** "Agents ought to select paths that maximize social value using the best available **epistemically robust** quantitative estimates. Where longtermist estimates involve category errors (per 3), they must be discounted or excluded from the maximization calculus."
  2.  **Revise (5):** "I maintain that **preserving specialized human capital** can be rational... switching paths... wastes genuinely irreplaceable organizational knowledge." (Remove "honoring sunk costs").
  3.  **Qualify (2):** Add a clause acknowledging that non-substitutive giving *mitigates* but does not *eliminate* the risk of moral licensing, requiring ongoing structural critique rather than a one-time intent.

  **The Cost:** The primary cost is the **retreat from longtermist certainty**. You cannot claim to be a maximizer *and* claim the metrics for maximization are broken. By restricting (4) to robust estimates, you concede that longtermism cannot currently drive career ranking in your framework, only inform it. This is a significant concession in an EA context, but it is the price of philosophical coherence.
