  Here's a draft list for the interview. I've kept the tone conversational and British, aiming to dig into the weeds of her argument without getting bogged down in too much jargon. There are 10 main questions here, with the three specific follow-ups you asked for embedded where relevant.

  1.  **The Normative Baseline:** You argue that fragmentation leads to 'welfare dilution', but aren't you smuggling in a hidden normative baseline about what counts as a 'natural' welfare state? It feels like you're assuming an intact ecosystem is inherently negative before you've even crunched the numbers.
      *   **Follow-up:** You usually deflect empirical worries by insisting that the welfare calculus is conceptually prior to ecological management. But if the concept comes before the management, does that make actual ecological data secondary to your philosophical framework?

  2.  **Shifting Suffering:** A common objection is that fragmentation doesn't reduce suffering overall, it just shifts it into smaller, more intense local die-offs—think starvation clusters or disease outbreaks in isolated patches. How do you square that with your dilution theory?
      *   **Follow-up:** Given you maintain the welfare calculus is conceptually prior to ecological management, does that mean even if the empirical reality is worse die-offs, the theoretical reduction in suffering still holds water for you?

  3.  **Active Intervention:** Does your reasoning imply we should actively fragment certain wilderness areas? Like, should we be bulldozing corridors or building barriers to stop those predator-prey stress loops you mention?
      *   **Follow-up:** If you insist the calculus is prior to management, are you admitting this is purely theoretical and shouldn't be applied to real-world conservation just yet, or are you willing to cross that bridge?

  4.  **r/K Selection Logic:** You mention suppressing reproduction in high-fertility species, but doesn't habitat fragmentation often favour r-strategists—those fast-breeding, short-lived creatures who might suffer more due to high turnover rates? Have you accounted for that shift in species composition?

  5.  **Predation vs. Starvation:** You talk about breaking predator-prey loops to reduce stress, but without predation, don't you just get starvation suffering later on when populations boom? Is one type of suffering morally worse than the other in your view, or is it all just negative utility?

  6.  **Tech vs. Destruction:** Most folks in the wild-animal suffering space are pushing for technological interventions—gene drives, vaccination programmes, that sort of thing. Why focus on destruction rather than fixing the biology itself? Is it just cheaper, or is there a philosophical reason?

  7.  **Non-Existence Claim:** Your view seems to imply that non-existence is preferable to existence in the wild for many animals. That's a heavy claim. Are you comfortable saying it would be better for some species never to have existed at all?

  8.  **Ecological Uncertainty:** Ecological systems are notoriously chaotic and non-linear. How can you be sure of the net outcome when our models fail so often? Isn't there a risk of making things vastly worse becuase we don't understand the system fully?

  9.  **The Human Analogy:** If we applied this logic to humans—fragmenting communities to reduce stress or suppress reproduction—it'd be abhorrent. Why is it different for animals? Is it purely about capacity for suffering, or is there a distinction in rights?

  10. **Drawing the Line:** Where do you draw the line? Is there any ecosystem you'd leave untouched, or does every intact biome represent a moral hazard under your framework?
