  6.  **Final Polish:** Ensure the distinction between Malcolm (logical) and Dennett (functionalist/illusionist) is clear, as the prompt mentions them. Mara conflates them slightly, but close enough for a board game night.

      *Wait, one nuance:* Dennett's "cassette" view is often misunderstood. He argues that there is no "finish line" where experience becomes real. Mara uses this to support the "no experience during sleep" view. Dev attacks it with data. I need to make sure I don't get bogged down in exegesis but stick to the arguments *as made in the prompt*.

      *Plan:*
