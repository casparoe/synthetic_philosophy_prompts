      *   **The Malcolm/Dennett Distinction:** The third friend was right to name-drop. Mara is channeling Malcolm (logical impossibility of sleeping experience). Dev is channeling a standard realist view (neuroscience proves it). Dennett is actually closer to Mara but for different reasons (illusionism).
      *   **The "Hard Problem":** Neither solves *why* it feels like something. Dev proves *that* something happens; Mara questions *what it means* to say it happened.

  5.  **Drafting the Response (Iterative refinement):**
