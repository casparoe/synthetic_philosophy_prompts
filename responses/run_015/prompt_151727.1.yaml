      Restorative justice relies heavily on the offender experiencing *self-reactive attitudes* (remorse, guilt) to achieve reintegration. Strawson emphasizes the reciprocity of reactive attitudes. If the debate focuses only on the community's attitude *toward* the offender, they miss the offender's internal moral psychology which is the engine of restorative justice. I will choose **self-reactive attitudes**.

