answer: |-
  Joint Statement of Adversarial Collaboration on Historical Methodology

  Participants: Camp A (Presentist Evaluation) and Camp B (Contextualist Reconstruction)

  1. Shared Commitments

  Both camps agree to the following foundational claims:

  - Historical inquiry must be grounded in empirical evidence and rigorous source criticism.
  - Historians are situated in the present moment, and their choice of topics is inevitably influenced by contemporary interests.
  - Deliberately falsifying evidence or ignoring contradictory data to fit a narrative is methodologically unacceptable.
  - The goal of history includes understanding causality and explaining why events unfolded as they did.
  - Neither camp seeks to erase the other; both acknowledge that different historical questions require different tools.

  2. Statement of Disagreement

  The collaboration identifies one core methodological divergence regarding the use of present-day values in historical analysis.

  - Camp A Position: Evaluating the past using present-day values is an unavoidable condition of human cognition. Because we inhabit the present, judging past events by how they contributed to current conditions is a valid and necessary heuristic for identifying meaningful change.
  - Camp B Position: Evaluating the past using present-day values is a methodological error that distorts historical reality. Imposing modern standards obscures the internal logic of past actors and should be actively minimized to achieve accurate understanding.

  3. Cruxes and Empirical Tests

  The following cruxes represent the specific points where our disagreement impacts research outcomes. For each crux, we have selected a concrete historical episode to test our competing predictions.

  Crux 1: The Circularity of Progress
  Question: Is labeling something as progress merely a circular way of saying it resembles our current norms?

  - Relevant Episode: The Transition from Humoral Medicine to Germ Theory (18th to 19th Century)
  - Camp A Prediction: A close study will show that earlier medical practices were primarily errors relative to modern biology. We expect to find a narrative of gradual error correction where the value of past work is determined by how closely it anticipated current scientific consensus.
  - Camp B Prediction: A close study will show that humoral medicine was a coherent system rational within its own empirical framework. We expect to find that practitioners were not failing to be modern, but succeeding at solving problems defined by their own era's understanding of the body.

  Crux 2: The Possibility of Bracketing Present Commitments
  Question: Can historians ever fully set aside their present commitments to understand past actors on their own terms?

  - Relevant Episode: The Political Theory of Divine Right Kingship (17th Century Europe)
  - Camp A Prediction: Historians will inevitably describe divine right theory as a precursor to or obstacle for modern democracy. We expect analysis to frame these monarchs as less developed versions of modern heads of state, judged by contemporary standards of legitimacy and consent.
  - Camp B Prediction: Historians can successfully reconstruct divine right theory as a sophisticated theological and legal argument valid in its own context. We expect analysis to explain why subjects accepted this authority without referencing modern democratic deficits or framing it as a step toward republicanism.

  Signatories:
  Representatives of Camp A
  Representatives of Camp B
