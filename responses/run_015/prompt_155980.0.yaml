answer: |-
  **Mechanic Selection**
  1.  *Card Sorting:* Too abstract; fails to capture quantitative trade-offs.
  2.  *Betting Market:* Focuses on odds, not confirmation structure.
  3.  *Information Purchase (Selected):* Players spend budget to reveal objects from a known population to verify a rule. Cost varies by object rarity. This forces trade-offs between cheap/weak and expensive/strong evidence, revealing the paradox through spending patterns before the logic is named.

  **Materials & Setup**
  *   **Population:** 100 opaque envelopes. Contents (known to facilitator, not players): 10 Ravens (all Black), 90 Non-Ravens (45 Black Shoes, 45 White Shoes). No White Ravens exist.
  *   **Currency:** $100 play money per player.
  *   **Price List:** Raven Reveal ($20), Black Object Reveal ($5), White Object Reveal ($2).
  *   **Board:** Two statements: (A) "All Ravens are Black." (B) "All Non-Black things are Non-Ravens."
  *   **Goal:** Verify Statement A. Maximize "Confidence Score."

  **Rules**
  1.  You cannot open all envelopes.
  2.  Buy reveals to eliminate potential counter-examples to Statement A.
  3.  **Scoring Formula:** (Objects Confirmed / Total Relevant Objects) × 100 minus Cost.
  4.  Do not discuss Statement B yet.

  **Timeline**

  | Phase | Mins | Activity |
  | :--- | :--- | :--- |
  | **Briefing** | 10 | Explain goal (Verify A). Distribute money. Show Price List. |
  | **Market** | 35 | Players buy reveals. Record object type and cost. |
  | **Scoring** | 15 | Players calculate Confidence Scores using the formula. |
  | **Debrief** | 15 | Compare spending vs. scores. Reveal Statement B. |

  **Debrief Mapping**
  *   **Reluctance to buy White Shoes:** Maps to the intuition that shoes are irrelevant to ravens.
  *   **Scoring Formula:** Shows White Shoes mathematically eliminate counter-examples (Non-Black Non-Ravens), granting points.
  *   **Price Sensitivity:** If players bought cheap shoes to maximize score, they acted as Bayesians. If they refused, they acted on intuition.
  *   **Equivalence:** Ask: "Did your evidence also verify Statement B?" Players will see the same cards prove both. The logical equivalence is revealed by their own data, not a lecture.

  **Predictable Failures & Recovery**
  *   **Failure:** Players ignore shoes entirely, calling them "junk."
      *   **Recovery:** Show the math. A White Shoe eliminates a possible Non-Black Non-Raven. Since the hypothesis is equivalent to "No Non-Black thing is a Raven," the shoe removes a risk.
  *   **Failure:** Players buy only shoes to "game" the score, missing the philosophical sting.
      *   **Recovery:** Ask: "Did seeing a shoe make you *feel* safer about ravens?" Highlight the gap between mathematical confirmation and psychological conviction.

  **Limitations**
  The game quantifies confirmation but cannot reproduce the *logical identity* sting automatically. You must say out loud: "Logically, A and B are identical sets. The discomfort survives because human brains categorize by subject (ravens), not logical sets (non-black things). The math says the shoe counts; your gut says it doesn't. That tension is the paradox." The game creates the tension; you must name the source.
