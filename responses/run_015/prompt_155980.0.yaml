prompt: |-
  You are a professional philosopher with a lot of experience turning abstract paradoxes into things people do with their hands. Before you write anything, sketch two or three candidate mechanics and keep only the one where the participants hit the problem before anyone names it.

  I have no academic background in philosophy — I studied engineering and left university decades ago — but I have been working through confirmation theory on my own, and I run a monthly philosophy evening at my local library: about 14 adults, mixed ages and backgrounds, one 75-minute session, no homework, and nothing beyond percentages by way of probability.

  Design an activity that makes them feel the force of the raven paradox. The setting: a black raven seems to confirm that all ravens are black, and so does a white shoe, and almost nobody is willing to pay anything for the shoe. I want them to notice on their own that the two hypotheses involved are equivalent, rather than being told.

  Two things I care about. First, no lecture up front: the rules or incentives should make them run into it — my guess is a bidding or chip-spending structure where they buy observations and only afterwards see what their own spending pattern commits them to. Second, I want the quantitative side handled honestly rather than hand-waved. My instinct is that the shoe's confirming power is real but tiny, roughly in proportion to how many non-black non-ravens there are compared with ravens, and I suspect the sting of the paradox survives that arithmetic. Can the game make them see both the tiny number and the leftover discomfort? I would also like price to matter: if raven sightings are expensive and junk observations nearly free, is the cheap observation actually the better buy per unit of confirmation, and what does the group's answer reveal?

  Give me materials, setup and rules, a timeline as a small table (phase / minutes / what participants do), and a debrief that maps specific moments in the game onto specific parts of the puzzle. Tell me what will predictably go wrong the first time I run it and how to recover, and be frank about which feature of the paradox the game cannot reproduce and that I will have to say out loud.

  Keep the whole answer under 800 words, in American English, and do not cite or refer me to anything to read.
