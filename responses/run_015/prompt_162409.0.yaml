  The obvious objection is that if validity is itself a normative status, the expressivist has generated a parallel problem one level up. Sentences about validity embed and figure in inferences just as moral sentences do. If "valid" is normative, does it not require its own account of validity? This regress is benign rather than vicious. It bottoms out in the practice of giving and asking for reasons. The expressivist can claim that the norms of inference are constitutive of the practice of reasoning itself; they are the hinges on which the language game turns, not moves within the game. We do not need a theory of the validity of "valid" because participating in the practice presupposes these norms. To ask for a justification of the norms of justification is to step outside the practice entirely, where no justification is possible or needed.

  This position costs expressivism its sharp distinction from relaxed descriptivism about the normative domain generally. If validity is a normative fact, expressivism looks increasingly like a view that accepts normative truths but denies naturalistic ones. However, this is a cost worth paying. It preserves the action-guiding nature of moral judgment without succumbing to the metaphysical extravagance of robust realism. The view remains distinct in its insistence that these norms are rooted in practical commitment rather than independent reality. We accept normative truths about inference, but only because we are committed to the practice of reasoning, not because they describe a normative universe. This concession acknowledges that quasi-realism inevitably bleeds into a form of normative realism, but only about the norms of thought, not the world. The distinction survives because the ontology remains sparse; we commit to norms of reasoning, not moral properties.

  {"thesis":"The Frege-Geach problem is not a semantic deficit but a normative one, where validity expresses verdicts of incoherence on packages of attitudes rather than truth-preservation across contents.","load_bearing_step":"The argument rests on redefining validity as a normative status of practical incoherence rather than a semantic relation of truth-preservation. This allows expressivism to explain logical binding without positing truth-apt moral contents. It shifts the burden from metaphysics to the norms governing rational agency.","test_cases":[{"case_id":"quantifier_in_attitude_ascription","illustrative_inference":"Every candidate believes that everything the committee did was wrong.","why_compositional_machinery_fails":"Semantic accounts require a shared truth-conditional content for the variable to bind across subjects, which expressivism denies exists.","why_normative_reply_succeeds":"It treats the quantifier as a constraint on attributing attitudes, where validity is the normative pressure to align disapproval across the domain."},{"case_id":"comparatives","illustrative_inference":"Torturing is worse than lying, lying is worse than stealing, so torturing is worse than stealing.","why_compositional_machinery_fails":"Assigning truth-conditions to gradable moral adjectives that guarantee transitivity without begging the question is metaphysically costly.","why_normative_reply_succeeds":"Transitivity is a constraint on rational preference orderings, making the inference valid due to practical incoherence rather than semantic structure."},{"case_id":"imperatival_conclusion","illustrative_inference":"Stealing is wrong, so don't steal.","why_compositional_machinery_fails":"Truth-preservation accounts fail because the imperative conclusion lacks a truth value entirely.","why_normative_reply_succeeds":"Validity is explained as the normative necessity linking moral judgment to intention, rendering rejection of the conclusion practically irrational."}],"rival_strategies":[{"strategy":"higher_order_attitude","strongest_criticism":"It captures the psychological feel of inconsistency but fails to explain why that inconsistency is normative rather than merely a matter of mental hygiene.","what_it_gets_right_that_my_view_does_not":"It better accounts for the phenomenological experience of feeling logically constrained."},{"strategy":"bifurcated_content","strongest_criticism":"It handles embedding formally but smuggles in representational content through the back door, sacrificing core expressivist insights.","what_it_gets_right_that_my_view_does_not":"It provides a cleaner formal logic system that integrates easily with standard semantic theories."}],"strongest_objection":"If validity is itself a normative status, the expressivist generates a parallel problem one level up since sentences about validity embed and figure in inferences just as moral sentences do. This suggests an infinite regress where every normative claim requires a further normative account of its validity. The theory似乎 to purchase a solution to the moral case by creating an identical problem for logic itself.","reply_to_strongest_objection":"This regress is benign because it bottoms out in the constitutive practice of giving and asking for reasons. We do not need a theory of the validity of validity because participating in reasoning presupposes these norms.","regress_verdict":"benign. It stops at the constitutive norms of the practice of reasoning itself, which are hinges rather than moves within the game.","weakest_point":"The concession that validity is a normative fact blurs the line between expressivism and relaxed descriptivism, potentially collapsing the distinction entirely. Defending the claim that norms of reasoning are not descriptive truths about a normative domain is difficult under sustained metaphysical pressure.","falsifier":"If it were shown that normative incoherence cannot explain logical validity without implicitly relying on truth-conditional content, the position would be mistaken."}
