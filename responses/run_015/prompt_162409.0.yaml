      Second, consider comparative and degree morphology, as in "torturing for fun is worse than lying, lying is worse than stealing, therefore torturing for fun is worse than stealing." The validity here turns on transitivity. Semantic accounts struggle to assign truth-conditions to "worse" that explain why transitivity holds without begging the question. The normative reply handles this effortlessly because the underlying attitudes themselves are structured transitively. Disapproval comes in degrees, and rational agency requires transitive ordering of these degrees. The inference is valid because violating transitivity renders the agent's practical standpoint incoherent. No semantic embedding is required to explain why one cannot rationally hold intransitive preferences; the constraint is on the attitude holder, not the sentence structure.

      Third, consider inferences whose conclusions are not declarative, such as "stealing is wrong, so don't steal." Here, nothing truth-evaluable is even in play at the conclusion. A truth-preservation account of validity collapses entirely because there is no truth value to preserve. The normative reply explains this as the paradigm case of validity. To judge stealing wrong is to adopt a stance that normatively necessitates an intention to avoid stealing. The inference is valid because accepting the premise while rejecting the imperative conclusion is a form of practical irrationality. This case demonstrates that validity was never about truth to begin with; it was always about the binding force of reasons.

