prompt: |-
  I am drafting the final examination for an upper-level undergraduate seminar in modern political philosophy. I need a single essay question that students can answer in 75 minutes, worth 25 marks. The domain is the Enlightenment on trial—whether it is best understood as a source of moral and political progress or as structurally complicit in domination and colonial violence—but I want to avoid answers that merely summarize familiar historical narratives or list canonical figures. Instead, the question should place students at a precise conceptual crux: whether the charge that Enlightenment universalism was structurally complicit in colonial domination can be reconstructed without already presupposing the Enlightenment-derived norms—moral equality, individual autonomy, and the illegitimacy of arbitrary power—that defenders invoke to claim the charge is self-undermining. The question should further require students to assess whether a coherent third position exists, one that rejects both universalist rationalism and the reflexive appeal to Enlightenment norms, without collapsing into a relativism that cannot condemn domination at all.

  Please write the exam question, followed by a model answer of approximately 650 words, and then a marking scheme. The scheme must be built around five must-hit points, each assigned 5 marks (total 25). For each point, include a one-line note on the specific mistake or omission that typically separates a B-level answer from an A-level answer, and indicate whether that point concerns a largely settled conceptual distinction or a genuinely contested interpretive claim. In the model answer and scheme, clearly separate what is settled philosophical analysis from what remains genuinely contested among specialists; do not present any contested view as the consensus.

  Do not ask for bibliographies, reading lists, or citations, and do not build the question around obscure texts or theories that would require outside research. After the exam materials, provide a brief structured summary in JSON with exactly these fields: "domain", "course_level", "time_minutes", "total_marks", "crux_summary" (a one-sentence description of the conceptual crux), "must_hit_points" (an array of objects with keys "point_name", "marks", "typical_error", "status" where status is either "settled" or "contested"), and "distinction_A_vs_B" (a one-line description of the specific move an A answer makes that a B answer misses).
