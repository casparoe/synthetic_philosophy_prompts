prompt: |-
  I host a monthly "concepts night" in my living room — ten or so people, mostly programmers and EA-adjacent types with a couple of philosophy majors mixed in, all of whom have read a fair amount of LessWrong and Slate Star Codex but almost no formal ethics. Next month I'm on the hook for a forty-minute slot on the procreation asymmetry: the claim that there is no moral requirement to bring into existence a person who would have a life clearly worth living, but that there is a strong one not to bring into existence a person whose life would be worth not living. I have my own half-baked view about where it goes wrong, but what I need from you is a plan for teaching it, not a defense or a critique of it.

  Start with the order of ideas, since that's where I expect to get it wrong. I'm fairly confident that the move "no one is made worse off by being created" has to be on the table before the four-cell table — create a good life, create a bad life, don't create a good life, don't create a bad life — will do any work, but I'm unsure where to place the distinction between an act's being permissible and its being required, and where to place the point that the asymmetry is a constraint on one kind of choice rather than a general account of which outcomes are better. Give me the dependency structure with the reason for each ordering decision. Then the carrying example. The case I've been using with friends is a "hatchery" machine with two dials: one dial sets whether the mind it produces has a life clearly worth living or clearly not worth living, and a second dial can add a fixed amount of well-being to one of the people who already exists. The point of the second dial is to force the question of whether the asymmetry has any verdict at all in a choice between two permissible options — I suspect the honest answer is that it doesn't, and I suspect that will be the thing my group resists hardest. Tell me whether that example can carry the whole session, what it must have and what it must lack in order to work (does the counterfactual of non-existence need to be made vivid, and does the case need to be scrubbed of the politics of reproduction, of uncertainty, of identity-affecting timing, of flow-through effects on third parties?), whether you would replace it and with what, and what to do with a third dial I've also toyed with — one that painlessly deletes an already-existing contented person, as a probe for whether the asymmetry is really about existence or about being made worse off.

  Third, the misconception map, in the order you'd expect them to arise and with the point in the sequence where each should be headed off — before it can form, or after it has formed and can be named. The ones I anticipate: that the asymmetry is just antinatalism in a lab coat; that no one is worse off is the same claim as no one is harmed and settles the matter; that the asymmetry is really a threshold view about lives being worth living plus something about risk; that it must be total utilitarianism with the serial numbers filed off; and that it must say something in the second-dial case. Correct my list, add what I'm missing, and tell me which of these are worth deliberately letting surface so they can be killed in front of the room. Close with one question I can ask at the end that distinguishes having understood the asymmetry from having merely been talked out of arguing with it, and with an explicit accounting of what I should refuse to explain in forty minutes — I'd guess at least the non-identity problem and the view that coming into existence is always a harm to the person who comes into existence, but tell me what you'd cut and how I should say out loud that I'm cutting it rather than dodging it.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Context:** Monthly "concepts night" in a living room. ~10 people, programmers/EA-adjacent/philosophy majors, read LessWrong/SSC, little formal ethics.
      *   **Topic:** The Procreation Asymmetry (Parfit's Non-Identity Problem context, but specifically the asymmetry claim: no duty to create happy people, strong duty not to create miserable people).
      *   **Goal:** A *teaching plan*, not a defense or critique of the user's view.
      *   **Constraints:** 40-minute slot.
      *   **Specific Needs:**
          1.  Order of ideas (dependency structure + reasons).
          2.  Carrying example (Hatchery machine analysis, modifications, third dial).
          3.  Misconception map (anticipate, order, head off vs. let surface).
          4.  Closing question (understanding vs. compliance).
          5.  Scope cut (what to explicitly exclude).

  2.  **Deconstruct the Topic (Procreation Asymmetry):**
      *   *Core Claim:* $A$ (Create Happy) is permissible (not required). $B$ (Create Miserable) is impermissible.
      *   *The Puzzle:* Why the difference? Standard utilitarianism says create happy (adds utility). Negative utilitarianism says avoid misery (matches), but usually implies creating happy is neutral/negative.
      *   *Key Distinction:* Person-affecting views vs. Impersonal views.
      *   *Key Intuition:* "No one is harmed by being created happy" vs. "Someone is harmed by being created miserable."
      *   *The Trap:* The Non-Identity Problem (if you choose A, the person exists; if you choose ~A, they don't. So who is harmed in ~A?).
      *   *The User's Twist:* The "Second Dial" (adding utility to existing person) to test if the asymmetry generates a verdict between two permissible options (Create Happy vs. Don't Create Happy + Boost Existing).

  3.  **Drafting Section 1: Order of Ideas (Dependency Structure):**
      *   *Goal:* Build the intuition before formalizing the paradox.
      *   *Step 1: The Intuition Pump.* Start with the core asymmetry claim directly. It's pre-theoretical. Most people agree with it immediately.
      *   *Step 2: The "No One Worse Off" Principle.* This explains *why* they agree with Step 1 regarding the happy child. This must come *before* the 4-cell table because the table breaks if they don't accept the person-affecting restriction.
      *   *Step 3: The 4-Cell Table.* Now map the intuitions. (Create Good, Create Bad, Don't Create Good, Don't Create Bad).
      *   *Step 4: Permissible vs. Required.* This is crucial. The asymmetry says Create Good is *okay* but not *mandatory*. This distinguishes it from Total Utilitarianism.
      *   *Step 5: The Constraint vs. Outcome Account.* Clarify that this is about duties to *potential* people, not ranking states of affairs impersonally.
      *   *Reasoning:* If you start with the table, they get bogged down in utilitarian calculus. If you start with "No one worse off," you ground the deontic constraint.

  4.  **Drafting Section 2: The Carrying Example (The Hatchery):**
      *   *User's Example:* Hatchery with Dial 1 (New Person Quality) and Dial 2 (Existing Person Boost).
      *   *Analysis:* It's strong because it isolates variables. It removes "parents," "society," "genetics."
      *   *Requirements:*
          *   Must lack: Politics of reproduction (abortion, overpopulation), Uncertainty (outcomes are known), Identity-affecting timing (keep it abstract), Flow-through effects (ceteris paribus).
          *   Must have: Vivid counterfactual of non-existence (the "ghost" of the uncreated).
      *   *The Second Dial:* This is the killer move. It forces the "Mere Addition Paradox" vibe without the complexity. If Asymmetry holds, Create Happy (Dial 1) vs. Boost Existing (Dial 2) should be *incomparable* or *equally permissible*. If they say Boost Existing is *better*, they are sliding into Total Utilitarianism or Person-Affecting Utilitarianism where existing people count more.
      *   *The Third Dial (Delete Existing):* **Danger.** This introduces the "Killing vs. Not Creating" distinction. It muddies the water. The asymmetry is about *coming into existence*. Deleting an existing person triggers standard harm principles. I advise *against* using it in the main flow, maybe save for Q&A if they conflate existence with continuation.
      *   *Verdict:* Keep the Hatchery. Scrub it clean. Don't use the Third Dial in the main 40 mins.

  5.  **Drafting Section 3: Misconception Map:**
      *   *Anticipated:*
          1.  Antinatalism (It's not; it allows happy creation).
          2.  "No one worse off" = "No harm" (Subtle difference: harm implies baseline, non-existence has no baseline).
          3.  Threshold/Risk view (It's not about probability, it's about status).
          4.  Total Utilitarianism (It explicitly rejects the duty to maximize).
          5.  Second Dial Verdict (The asymmetry might be silent here).
      *   *Missing:*
          *   *The Repugnant Conclusion link:* They know EA/LW. They will jump to "So this avoids the Repugnant Conclusion?" Need to address that this is a *local* fix, not necessarily a full population ethics theory.
          *   *Person-Affecting Restriction:* They need to name the underlying mechanism.
      *   *Strategy:* Let the "Antinatalism" one surface early to dismiss. Let the "Total Utilitarianism" one surface after the 4-cell table. Head off the "Harm" equivalence before the "No one worse off" principle.

  6.  **Drafting Section 4: Closing Question & Scope Cut:**
      *   *Closing Question:* Needs to test if they grasp the *silence* of the theory. "If I choose to create the happy child instead of curing an existing headache, have I done wrong?" (Asymmetry says: No. Total Util says: Yes.)
      *   *Scope Cut:*
          *   Non-Identity Problem (too deep, though related).
          *   Benatar's "Coming into existence is always a harm" (that's a different argument).
          *   The "Why" (Metaphysics of persons).
      *   *How to say it:* "Parking Lot" method. Explicitly state boundaries.

  7.  **Refining and Polishing:**
      *   *Tone:* Intellectual, precise, respectful of the EA/LW background (use terms like "utility monster," "repugnant conclusion," "counterfactual" appropriately).
      *   *Timing:* 40 mins is tight. Need to be ruthless.
      *   *User's specific worry:* "No one is made worse off" before the 4-cell table. I agree. The table relies on the intuition that the "Don't Create Good" cell is neutral, not negative.
      *   *User's specific worry:* Second Dial resistance. This is the crux. The plan must emphasize that the Asymmetry *might not have a verdict* there, and that's a feature, not a bug (or at least, a specific constraint).

  8.  **Self-Correction/Review during drafting:**
      *   *Wait, does the "No one worse off" claim hold water?* Philosophically, it's contested (Parfit). But for *teaching* the asymmetry, it's the standard intuitive justification. I must instruct the user to present it as the *motivation* for the asymmetry, not necessarily the metaphysical truth.
      *   *Third Dial:* I need to be firm. Adding deletion confuses "harming existing" with "failing to benefit potential." Keep it out.
      *   *Misconception:* The "Risk" one is important. People think "Don't create miserable" is just risk aversion. Need to clarify it's about *guaranteed* misery vs. *potential* happiness.
      *   *EA Crowd:* They love optimization. The idea that a theory says "I don't know" between two positive options will itch them. I need to frame this as "The Asymmetry is a constraint, not an optimizer."

  9.  **Final Structure:**
      *   **Part 1: Dependency Structure.** (Flowchart style).
      *   **Part 2: The Hatchery Example.** (Specs, modifications, Third Dial verdict).
      *   **Part 3: Misconception Map.** (Timeline of errors).
      *   **Part 4: Closing & Cuts.** (The test question, the parking lot).

  10. (Final Polish of the text to match the user's sophisticated tone.) *Ensure I don't lecture them on ethics, but lecture them on pedagogy.*

  *(Self-Correction on the "Second Dial" logic)*: The user suspects the Asymmetry has *no verdict* on Second Dial (Create Happy vs Boost Existing). This is correct for strict Asymmetry. Total Utilitarianism says Boost Existing (usually, depending on magnitudes) or Create Happy. Person-Affecting says Boost Existing (since creating happy benefits no one *in particular* compared to baseline). Wait. If I create a happy person, that person is benefited *relative to non-existence*? No, that's the trap. The Asymmetry says that benefit doesn't count as a *requirement*. So between Create Happy and Boost Existing, Asymmetry says both are permissible. Total Util says pick the max utility. Person-Affecting (standard) says Boost Existing (because the new person doesn't exist to be benefited in the ~Create world). I need to make sure the user distinguishes Asymmetry from standard Person-Affecting views. The Asymmetry is specifically about the *moral requirement*. Okay, I will clarify this in the plan.

  Let's write.
answer: |-
  Here is a teaching plan designed for your specific audience (EA/LW-adjacent, high rationality, low formal ethics) and your time constraint (40 minutes).

  ### Part 1: Dependency Structure (Order of Ideas)

  Your intuition is correct: the "no one is made worse off" claim must precede the 4-cell table. If you present the table first, the EA instinct to "sum the columns" will trigger immediately, and they will conclude that *Not Creating Good* is a loss of utility, thereby destroying the asymmetry before it lands.

  Here is the dependency graph for the 40-minute slot.

  1.  **The Pre-Theoretical Intuition (Minutes 0–5)**
      *   **Content:** State the asymmetry plainly. "We feel obligated not to create a suffering child, but not obligated to create a happy child."
      *   **Reason:** Establish consensus before analysis. If they don't feel the pull of the asymmetry immediately, the rest of the lecture is a repair job.
      *   **Dependency:** None. This is the anchor.

  2.  **The "No One Worse Off" Principle (Minutes 5–10)**
      *   **Content:** Explain *why* we feel that pull. In the "Don't Create Happy" case, there is no subject who is deprived. In the "Create Miserable" case, there is a subject who suffers.
      *   **Reason:** This provides the *mechanism* for the intuition. It blocks the utilitarian calculation that "missing out on happiness is a negative."
      *   **Dependency:** Requires Step 1 to be accepted as the target phenomenon. Must come *before* the table to prevent utilitarian collapse.

  3.  **The 4-Cell Table (Minutes 10–20)**
      *   **Content:** Map the four quadrants (Create Good, Create Bad, Don't Create Good, Don't Create Bad) against the Principle from Step 2.
      *   **Reason:** Formalize the intuition. Show where the moral valence changes (from Neutral to Forbidden) without changing the "existence" status symmetrically.
      *   **Dependency:** Requires Step 2. If they don't accept "no one worse off," the "Don't Create Good" cell looks like a moral loss.

  4.  **Permissible vs. Required (Minutes 20–25)**
      *   **Content:** Distinguish between "It is okay to create" and "It is wrong not to create."
      *   **Reason:** This is the specific logical gap where Total Utilitarianism fails. It clarifies that the asymmetry is a *constraint* on obligations, not a ranking of outcomes.
      *   **Dependency:** Requires Step 3. You cannot distinguish permission from requirement until the cells are mapped.

  5.  **Constraint vs. Outcome Account (Minutes 25–30)**
      *   **Content:** Clarify that the asymmetry does not say the world with happy people is *no better* than the world without; it says we are not *required* to bring it about.
      *   **Reason:** Prevents the "So you prefer empty worlds?" strawman. It isolates the deontic status from the axiological status.
      *   **Dependency:** Requires Step 4.

  6.  **The Second Dial Test (Minutes 30–40)**
      *   **Content:** Apply the framework to the Hatchery case (detailed below).
      *   **Reason:** Stress-test the theory. Force them to sit with the silence of the theory regarding two permissible options.
      *   **Dependency:** Requires all previous steps. If they haven't accepted the constraint view, they will demand a maximizing verdict here.

  ---

  ### Part 2: The Carrying Example (The Hatchery)

  Your Hatchery machine is excellent. It is abstract enough to strip away the biological and social baggage of human reproduction, which is essential for this crowd. However, to work in 40 minutes, it requires specific tuning.

  **Can it carry the session?**
  Yes. It is sufficiently isolated. Do not switch to a "couple deciding to have a baby" example; that invites arguments about resources, overpopulation, and carbon footprints which will eat your time.

  **What it must have:**
  1.  **Vivid Non-Existence:** You must explicitly state that in the "Don't Create" branch, there is *no one* waiting in the void. Use the phrase "no subject of harm."
  2.  **Certainty:** The dials must guarantee the outcome. No probability. If there is risk, they will argue about expected value calculations.
  3.  **Ceteris Paribus:** Explicitly state that creating the person has no effect on anyone else (no resource drain, no joy to parents).

  **What it must lack:**
  1.  **Identity-Affecting Timing:** Do not discuss *which* child is created. Keep it about *whether* a child is created.
  2.  **Politics:** Scrub all language regarding abortion, contraception, or state policy. This is about moral ontology, not law.
  3.  **Flow-Through Effects:** No "this child might cure cancer."

  **The Second Dial (The Existing Person Boost):**
  This is the critical pressure point.
  *   **Setup:** Dial 1 creates a new person with +100 utility. Dial 2 adds +10 utility to an existing, contented person.
  *   **The Trap:** Your audience (EA/LW) will want to maximize. They will ask, "Which is *better*?"
  *   **The Lesson:** The Asymmetry verdict is: **Both are permissible. The theory is silent on which is better.**
  *   **Why this works:** It forces them to accept that a moral theory can be a set of constraints (side-constraints) rather than an optimization function. If they resist this, they are revealing that they are actually Total Utilitarians who reject the asymmetry.
  *   **Instruction:** Do not let them solve the dial. If they ask "But which should I pick?", the answer is "The Asymmetry doesn't say. That requires a different theory." This is a feature, not a bug.

  **The Third Dial (Delete Existing Person):**
  **Do not use this in the main session.**
  *   **Reason:** This introduces the distinction between *killing* and *not creating*. The Asymmetry relies on the claim that non-existence is not a state a person can be in. Deleting an existing person moves them *into* non-existence, which triggers standard harm principles (you made someone worse off than they were).
  *   **Risk:** It conflates the "Person-Affecting Restriction" with the "Non-Identity Problem." It will lead to a 15-minute sidebar on the continuity of identity.
  *   **Action:** Keep this in your pocket for Q&A only if someone asks, "Does this mean we can delete happy people?"

  ---

  ### Part 3: The Misconception Map

  Your list is strong, but the order matters. You want to let some misconceptions form so you can kill them with the framework you just built, but others must be preempted.

  **1. "This is just Antinatalism." (Preempt this)**
  *   **When:** Minute 0.
  *   **Action:** State clearly: "The asymmetry permits creating happy lives. Antinatalism forbids it. They are opposites."
  *   **Why:** If they label it antinatalism, they will tune out as "ideological."

  **2. "No one worse off" is the same as "No one harmed." (Head this off)**
  *   **When:** Minute 5 (before the Principle).
  *   **Action:** Distinguish *harm* (lowering a baseline) from *worse off* (counterfactual comparison). Since the non-existent have no baseline, they cannot be harmed, but we need to be careful saying they aren't "worse off" because there is no "they."
  *   **Why:** If they think "harm," they will argue about whether existence is a harm (Benatar). Keep it on "worse off relative to a counterfactual."

  **3. "It's just Risk Aversion / Threshold View." (Let this surface, then kill)**
  *   **When:** Minute 15 (during the 4-Cell Table).
  *   **Action:** Someone will say, "We just avoid the bad because the risk is high."
  *   **Kill:** Remind them the Hatchery has 100% certainty. The asymmetry holds even with perfect knowledge. It's not about risk; it's about the status of the potential person.

  **4. "It must be Total Utilitarianism with serial numbers filed off." (Let this surface, then kill)**
  *   **When:** Minute 25 (Permissible vs. Required).
  *   **Action:** They will argue, "If the world is better with happy people, you must make it."
  *   **Kill:** Reiterate Step 5 (Constraint vs. Outcome). "The theory says the world *is* better, but you are not *required* to make it." This distinguishes axiology from deontology.

  **5. "The Second Dial must have a verdict." (Let this surface, then validate the silence)**
  *   **When:** Minute 35.
  *   **Action:** They will insist one dial is morally superior.
  *   **Kill:** "If you insist one is superior, you are using a different moral theory (e.g., Total Utilitarianism). The Asymmetry *only* tells you what is forbidden, not what is optimal."
  *   **Why:** This is the hardest pill for EAs to swallow. Let them feel the friction. It proves they understand the limit of the concept.

  **Missing Misconception:**
  *   **"The Repugnant Conclusion."** Your audience will immediately ask, "Does this solve the Repugnant Conclusion?"
  *   **Action:** Park it. "It helps, but it's not a full population ethics solution. We aren't solving population ethics today; we are defining one constraint."

  ---

  ### Part 4: Closing Question & Scope Cut

  **The Closing Question**
  Do not ask, "Do you agree?" (They will nod politely). Do not ask, "What are the implications?" (Too broad).
  Ask this:

  > *"If you have the choice between creating a new person with a very happy life, or adding a small amount of happiness to an existing person, and the total utility is identical: Does the Asymmetry tell you which one to pick?"*

  *   **Correct Answer:** "No. It says both are permissible."
  *   **Incorrect Answer:** "Yes, pick the existing person" (That's Person-Affecting Utilitarianism) or "Yes, pick the new person" (That's Total Utilitarianism).
  *   **Why:** This tests if they understand that the Asymmetry is a *constraint* on obligations, not a *maximizer* of value.

  **What to Refuse to Explain (The Parking Lot)**
  You cannot cover the metaphysics of personhood or the Non-Identity Problem in 40 minutes. If you try, you will fail.

  1.  **The Non-Identity Problem:**
      *   **The Cut:** "The Non-Identity Problem asks *which* child you create. The Asymmetry asks *whether* you create a child. We are ignoring the 'which' today."
      *   **Script:** "I am explicitly bracketing the Non-Identity Problem. If your objection relies on the identity of the specific child being dependent on your choice, I am granting that away for this session."

  2.  **Benatar's "Coming into Existence is Always a Harm":**
      *   **The Cut:** "That is a separate argument (Antinatalism). The Asymmetry works even if you think life is good. We are not debating the value of life today, only the obligation to create it."
      *   **Script:** "I am not arguing that existence is bad. I am arguing that the *obligation* structure is asymmetric regardless of life's value."

  3.  **Why the Asymmetry Holds (Metaphysics):**
      *   **The Cut:** "I am teaching you the *claim* and its *structure*, not defending the metaphysical truth of 'possible people.' Treat it as a logical object for the next 40 minutes."
      *   **Script:** "We are analyzing the internal logic of the Asymmetry, not proving it is the True Moral Law. If you think it's false, that's fine, but first you must understand what it *says*."

  **Final Advice for the Host:**
  Your group is trained to optimize. The Procreation Asymmetry is frustrating because it refuses to optimize in the "Create Good" quadrant. Your job is not to convince them it is true, but to convince them that it is a *coherent distinct position* from Total Utilitarianism. If they leave thinking, "Oh, that's just Utilitarianism with a weird glitch," you have failed. If they leave thinking, "That is a fundamentally different way of structuring moral obligations," you have succeeded.
