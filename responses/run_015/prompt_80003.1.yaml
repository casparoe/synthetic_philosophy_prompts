  | **Distributed** | No | (Individual only) | N/A | N/A |
  | **Deflationary** | Yes | No | N/A | N/A |
  | **Aunt Hillary** | Yes | Yes | **Yes** | **Yes** |
  | **Fugue** | Yes | Yes | **Yes** | **No** |
  | **Neuron** | Yes | Yes | **No** | **No** |
