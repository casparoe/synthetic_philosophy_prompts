  # Decision Tree: The Ontology of the Anthill

  **Instructions:** Start at the root. Answer the question based on the phenomenon observed, not the label you prefer. Follow the branch to the next node or leaf.

  ### **Node 1 (Agency)**
  **Does the colony pursue goals that no single ant possesses, understands, or intends?**
  *   **No:** Go to **Node 2**.
  *   **Yes:** Go to **Node 3**.

  ### **Node 2 (Constitution)**
  **Is the colony's order imposed by structure (like a city's laws) or negotiated by agents (like a market's prices)?**
  *   **Imposed/Structural:** 🍃 **Leaf 1: The City View**
      *   *Position:* The colony is a social system or artifact. Minds exist only at the individual level (if at all). The colony is a "we" only grammatically.
  *   **Negotiated/Agentive:** 🍃 **Leaf 2: Distributed Individualism**
      *   *Position:* Each ant is a tiny agent; the colony is just the swarm of those agents. There is no "colony mind," only many small minds bumping together.

  ### **Node 3 (Vocabulary)**
  **Is "mind" the accurate vocabulary for this unified agency, or is it merely complex control?**
  *   **Merely Control:** 🍃 **Leaf 3: The Deflationary View**
      *   *Position:* The colony is an agent, but calling it a "mind" is a category error. It processes information, but "mind" implies interiority it lacks.
  *   **Mind:** Go to **Node 4**.

  ### **Node 4 (Fission)**
  **If the colony buds and splits into two, does the original identity divide between them, or does it cease and two new ones begin?**
  *   **Identity Divides (One becomes Two):** 🍃 **Leaf 4: The Full Aunt Hillary View**
      *   *Position:* The colony is a subject of experience. Fission is a traumatic splitting of the self. It can be a conversational partner because it has a persistent "I."
      *   *Robot Ant Test:* A robot ant can join *if* it integrates into the self-model.
  *   **Identity Ceases (Two New Begin):** Go to **Node 5**.

  ### **Node 5 (Self-Model)**
  **Does the system maintain a representation of "the colony" as a single unit, or is all bookkeeping of parts and tasks?**
  *   **Representation of "Us" (Self-Model):** 🍃 **Leaf 5: The Fugue/Pattern View**
      *   *Position:* The mind is the pattern (the theme), not the subject. In fission, the theme continues in two channels, but the "I" does not survive.
      *   *Robot Ant Test:* A robot ant can join if it plays the notes correctly.
  *   **Bookkeeping of Parts (No Self-Model):** 🍃 **Leaf 6: The Neuron View**
      *   *Position:* Ants are neuron-like parts. The colony computes, but without a self-model, it has no "inside." Fission is just copying a program.
      *   *Robot Ant Test:* A robot ant is fully interchangeable; substrate independence is total.

  ### **Node 6 (Substrate)**
  *(Note: This node is logically available for Leaf 6, but practically collapsed. See Diagnosis below.)*
  **If a robot ant behaves exactly like a real ant, is it part of the colony's mind?**
  *   **Yes:** (Confirms Leaf 6).
  *   **No:** ⚠️ **Unoccupied Space**
      *   *Diagnosis:* **Incoherent.** If the colony has no self-model (Leaf 6 path) but rejects functional equivalents, it relies on biological magic without a subject to experience it. Unattractive to both materialists and dualists.

  ***

  ### **Margin Note: The "Ant Fugue" Metaphor**
  You asked where the fugue image breaks. It breaks at **Node 2**.
  A fugue implies the notes (ants) are passive carriers of the theme. But in the *Distributed Individualism* view (Leaf 2), the notes are themselves musicians. If the ants are agents, the colony isn't a song being played; it's a jam session. The metaphor holds only if you accept the *Neuron View* (ants are mindless parts). If you grant the ants agency, the fugue dissolves into a chorus.

  ### **Editor's Diagnostic: Indistinguishable Leaves**
  *   **Leaf 5 (Fugue) vs. Leaf 6 (Neuron):** These are difficult to separate empirically. Both deny the "Subject" (Aunt Hillary). The distinction rests entirely on whether "Pattern" counts as "Mind" without a "Self." Your sources will likely slide between these two without noticing. Use the **Self-Model** question (Node 5) to force them to pick.
  *   **The Fission Node (Node 4):** This is your sharpest tool. Sources who claim "Colony = Mind" but answer "Two New Identities" on fission are actually holding the *Fugue* or *Neuron* view, not the *Aunt Hillary* view. They want the mind without the subject.

