answer: |-
  This is a classic problem in normative institutionalism. You have correctly identified that the "private gain" clause is the weak link; it is descriptive of *typical* corruption but not *constitutive* of it. Your intuition that corruption is a betrayal of the *internal logic* of an office is the standard philosophical move (reminiscent of Dennis Thompson or Philp), but your specific formulation needs tightening to handle the structural cases (algorithms, procurement design) and the cultural cases (gifts).

  Here is a principle refined for the lecture hall, an analysis of your cases, two new test cases, and the honest cost of adopting this framework.

  ### The Principle

  > **"Corruption is the subversion of an institutional role's constitutive purpose by an interest that the role is obligated to exclude."**

  To defend this in a lecture, you need to unpack three terms:
  1.  **Constitutive Purpose:** The good the institution exists to produce (e.g., health for hospitals, safety for inspectors, fair competition for procurement).
  2.  **Obligated to Exclude:** Interests that are logically incompatible with that purpose (e.g., kinship in contracting, cash in triage, future employment in regulation).
  3.  **Subversion:** This can occur through individual discretion (the nurse), structural design (the algorithm), or rule-drafting (the procurement framework).

  This removes "private gain" entirely. It replaces it with "excluded interest." This allows you to capture nepotism (gain is irrelevant, kinship is the excluded interest) and the pity case (gain is irrelevant, but is pity excluded?).

  ### Applying the Principle to Your Cases

  Here is how the principle processes your intuitions, and where it forces your hand.

  *   **Nurse (Wage):** *Not Corruption.* The state failed its constitutive purpose (paying staff). The nurse's "private gain" is actually a *public wage* withheld. The interest (survival) is not excluded by the role of "healer" when the system makes healing impossible without it.
  *   **Nurse (Queue-jump):** *Corruption.* Triage logic excludes ability to pay.
  *   **Inspector:** *Corruption.* Safety logic excludes bribes.
  *   **Mayor (Cousin):** *Corruption.* Public procurement logic excludes kinship. The fact that the bid was lowest is coincidental; the *process* was subverted by an excluded interest.
  *   **Mayor (Bridge/District):** *Not Corruption.* Democratic representation logic *includes* constituency advantage as a mechanism of accountability. Re-election is not an excluded interest; it is a feedback loop inherent to the role.
  *   **Revolving Door:** *Corruption.* Regulatory logic excludes future employment prospects, as they create a conflict with current protective duties.
  *   **Algorithm:** *Corruption.* **Fix:** The agent is not the machine, but the *designer* or the *official who authorized the nudge*. Their role (data integrity) excludes commercial manipulation. The subversion is structural, not discretionary.
  *   **Procurement Framers:** *Corruption.* **Fix:** Their role (drafting fair rules) excludes designing for a specific winner. Their claim of "development policy" is a rationalization. If the policy requires subverting competition, the policy is corrupt, and so is the act.
  *   **Village Consent:** *Ambiguous.* This depends on the *constitutive purpose* of the official. If their role is "protect public health," selling consent is corruption. If their role is "facilitate development with local agreement," it is not. Your hesitation here is actually a disagreement about *what the job is*, not whether corruption occurred.
  *   **Gifts:** *Differentiated by Function.*
      *   *Goat:* Acknowledges the relationship *after* the service. Compatible with the role (community care).
      *   *Gift Card:* Anticipates or rewards specific discretion. Excluded by the role (impartial education).
      *   *Tennis:* Creates a relationship of obligation. Excluded by the role (independent regulation).
      *   *Cultural Neutrality:* The principle is not culturally neutral, but it is not "Western." All cultures distinguish between a *gift of gratitude* (compatible with role) and a *gift of price* (subverts role). The distinction is functional, not geographical.
  *   **Pity Case:** *Not Corruption.* **Correction:** Your reasoning ("nothing was gained") is weak. The better reasoning is that *compassion* is often a constitutive value of public service (equity), not an excluded interest. It does not subvert the purpose; it fulfills the spirit of the role where the letter fails.
  *   **Border Clerk (Illegitimate State):** *Sabotage/Resistance.* **Concession:** You are right to suspect this makes corruption depend on political judgement. If the state's constitutive purpose is *extraction* (predatory), then subverting it serves a higher public good. You cannot define corruption here without judging the legitimacy of the regime.

  ### Two New Cases for the Lecture

  **Case 1: The "Efficient" Violation (Intuitive)**
  A fire inspector finds a minor code violation in a school that would take months to fix. He knows the school is safe enough, but strictly speaking, non-compliant. He accepts a donation to the school's PTA (not personal cash) to "overlook" the violation until it can be fixed properly, avoiding school closure.
  *   **Verdict:** Corruption.
  *   **Why:** The role's purpose is safety *and* rule of law. The PTA donation is an excluded interest. Even if the outcome is benign, the *authority* was subverted by an external incentive. This tests the students' willingness to call "good outcomes" corrupt.

  **Case 2: The "Metric" Teacher (Counterintuitive)**
  A public school teacher is told their bonus and tenure depend on student test scores. They stop teaching critical thinking and history, and spend 90% of class time drilling test-taking strategies. Students score higher, the teacher keeps their job, the school meets targets. No laws are broken; no money changes hands illicitly.
  *   **Verdict:** Corruption.
  *   **Why:** This will feel wrong to students who equate corruption with "illegal bribes." But under your principle: The role's constitutive purpose is *education*. The interest (job security/metrics) is excluded from determining *pedagogy*. The teacher has subverted the purpose of the role to serve the metric. This is *institutional corruption* (Lessig's sense). It forces the class to see that following rules can still be corrupt if it subverts the point of the institution.

  ### The Cost: Verdicts You Must Drop

  You asked for honesty. If you adopt this principle (which is stronger than the NGO definition), you cannot keep all your current intuitions without adding ad-hoc clauses. Here is what you must sacrifice:

  1.  **The "Political Judgement" Immunity:** You must accept that the **Border Clerk** case makes corruption partially dependent on political legitimacy. You cannot have a definition of public corruption that is neutral on the *purpose* of the public. If the state is a criminal enterprise, "corruption" within it is a category error; it's just internal conflict. You have to tell your students: *"To identify corruption, we must first agree on what the institution is for."*
  2.  **The "Pity" Reasoning:** You must drop the idea that the **Pity Case** is non-corrupt *because no gain was made*. You must argue instead that compassion is *role-compatible*. If you keep the "no gain" reasoning, you invite the "private gain" clause back in through the side door.
  3.  **The "Procurement" Defense:** You cannot accept the **Procurement Framers'** claim that they were serving "development policy." Under this principle, if the policy requires rigging the game, the policy is the corruption. You have to be willing to call the *law itself* corrupt, not just the breaking of it.

  ### Summary for the Lecture

  Walk in and tell them: *"We are not defining corruption as breaking the rules. We are defining it as breaking the trust inherent in the job's purpose."*

  Use the **Metric Teacher** to show that you can be legal and corrupt. Use the **Border Clerk** to show that you can be illegal and virtuous. This will unsettle the first-years, which is exactly what a political philosopher should do.
