answer: |-
  ### Essay Question

  **Illusionists argue that phenomenal consciousness is an introspective illusion: we believe we have subjective experiences, but we are mistaken. A critic poses the following dilemma: Either the introspective 'seeming' of consciousness is itself a phenomenal state (in which case illusionism is self-undermining), or it is merely a functional disposition to judge (in which case illusionism fails to explain why the illusion is so vivid and resistant to correction). Assess this objection. Can the illusionist escape it, or does it show that illusionism either contradicts itself or changes the subject? (20 marks)**

  ***

  ### Model Answer

  The critic's dilemma targets the core mechanism of illusionism: the account of introspective error. If illusionism is true, there are no phenomenal properties. Yet, introspection presents us with what feels like undeniable evidence of them. The dilemma forces the illusionist to characterize this "presentation" without reintroducing the very thing they deny.

  Regarding the first horn, the critic argues that if introspection *seems* to reveal phenomenal properties, that seeming must itself be phenomenal. If so, illusionism is false because phenomenal states exist. The illusionist must deny this premise. They argue that introspective seemings are representational states that do not possess phenomenal character themselves. Just as a visual illusion (like the Müller-Lyer lines) presents lines as unequal without requiring the subject to have a "phenomenal experience of inequality" distinct from the visual representation, introspection can represent the brain as having phenomenal properties without actually instantiating them. The seeming is a non-phenomenal representation with false content. This avoids self-undermining, but it requires accepting that introspection is not a direct acquaintance with reality, but a fallible cognitive model.

  Regarding the second horn, the critic argues that reducing the seeming to a functional disposition (a tendency to judge) fails to explain the datum: the illusion is inescapable and emotionally resistant. Mere dispositions do not feel vivid. The illusionist responds by appealing to cognitive architecture. The introspective system is likely modular and encapsulated. It outputs judgments based on heuristic processing rather than direct access. The "resistance to correction" is not due to phenomenal force, but to the cognitive impenetrability of the module generating the error. Even when told the lines are equal, the visual system still outputs "unequal." Similarly, even when told consciousness is an illusion, the introspective system continues to output "phenomenal experience exists." The vividness is explained by the system's design, not by the existence of qualia.

  Evaluating these moves, the illusionist survives the contradiction but pays a high theoretical price. They must convince us that the most immediate datum of existence—our own experience—is a user-illusion generated by opaque cognitive mechanisms. This is coherent, but it risks "changing the subject." If the explanation of the illusion relies entirely on functional facts, the critic may argue the illusionist has explained away the *belief* in consciousness, but not the *experience* of believing it. However, if the illusionist can show that the "experience of believing" is itself part of the functional error, the dilemma is blunted. The cost is accepting that introspection is deeply misleading about the nature of the mind.

  This verdict hinges on empirical claims about cognitive architecture. The dilemma becomes fatal if introspection is proven to be infallible or direct acquaintance, as this would validate the first horn. It is defused if cognitive science demonstrates that introspective mechanisms are prone to systematic, non-phenomenal errors. However, this reasoning is vulnerable where it assumes functional explanations can fully capture the subjective sense of "resistance." If the feeling of resistance itself requires phenomenal explanation, the second horn collapses, and the illusionist merely relocates the hard problem rather than solving it.

  ***

  ### Marking Scheme

  | Point | Criteria (4 marks each) | Typical Student Error |
  | :--- | :--- | :--- |
  | **1. Dilemma Statement** | Clearly articulates both horns: (1) Seeming is phenomenal (contradiction) vs. (2) Seeming is functional (explanatory failure). | Students often conflate the dilemma with general eliminativist objections rather than focusing on the *seeming*. |
  | **2. Horn 1 Response** | Explains the illusionist move: seemings are non-phenomenal representations (false content without phenomenal feel). | Students frequently claim illusionists deny the seeming exists, rather than denying its phenomenal nature. |
  | **3. Horn 2 Response** | Explains how cognitive architecture (modularity/encapsulation) accounts for the illusion's vividness and resistance. | Students often ignore the "resistance to correction" clause, focusing only on the existence of the judgment. |
  | **4. Critical Evaluation** | Weighs the theoretical cost (introspective error) against the benefit (avoiding contradiction); assesses "changing the subject" charge. | Students tend to take sides dogmatically rather than evaluating the trade-off between coherence and phenomenological fit. |
  | **5. Verdict & Limitation** | Identifies conditions for fatal/defused verdict (empirical claims about introspection) and admits vulnerability regarding functional explanation of resistance. | Students often omit the closing reflection on what would change the verdict or fail to identify the argument's weak point. |
