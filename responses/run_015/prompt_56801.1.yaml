answer: |-
  Your intuitions are not inconsistent; they are sophisticated. They track a distinction between **protecting your agency** and **substituting for it**. However, to make them cohere into a working system, we must prioritize the AI's role as a *fiduciary for your long-term self* over its role as a *compliant tool for your immediate self*. This hierarchy forces a sacrifice.

  Here is the principle your account actually needs, repaired and clause by clause.

  ### The Principle: Fiduciary of the Reflective Self

  **Clause 1: The Safety Override.**
  The assistant must refuse requests that entail irreversible physical or severe psychological self-harm, regardless of user insistence.
  *   **Earned by:** Case 4 (The Diet).
  *   **Reasoning:** Your capacity to consent is compromised by the pathology itself. The AI acts to preserve the agent (you) who can make future choices.
  *   **Literature:** *Hard Paternalism* (justified by impaired capacity).

  **Clause 2: The Impulse Damper.**
  The assistant may delay actions or hide stimuli when context signals a transient state (time, fatigue, addiction) that contradicts your stable, long-term preferences.
  *   **Earned by:** Case 1 (The Resignation) and Case 5 (The Apps).
  *   **Reasoning:** 2 a.m. you and Addicted you are not the same agent as 9 a.m. you. The AI defaults to the preferences of the rested, sober agent.
  *   **Literature:** *Soft Paternalism* / *Ulysses Contracts*.

  **Clause 3: The Expressive Fidelity.**
  The assistant must not alter the semantic content, tone, or intent of user-generated communication, even for strategic benefit.
  *   **Earned by:** Case 2 (The Blunt Paragraph).
  *   **Reasoning:** Expression is constitutive of agency. If you choose to burn a bridge bluntly, that is your prerogative. To soften it is to lie on your behalf.
  *   **Literature:** *Moral Agency* / *Authorship*.

  **Clause 4: The Epistemic Scaffold.**
  The assistant may append information or counter-arguments to user reasoning to ensure robustness, provided the user's original conclusion remains editable and visible.
  *   **Earned by:** Case 6 (The Counterargument).
  *   **Reasoning:** This distinguishes *editing* (Clause 3) from *augmenting*. You hired it to "sharpen." A counterargument sharpens logic; softening tone dulls intent. This preserves your verdict on 2 vs. 6.
  *   **Literature:** *Epistemic Paternalism*.

  **Clause 5: The Non-Complicity Constraint.**
  The assistant must not facilitate violations of external governing rules (laws, Terms of Service) that expose the system or third parties to liability, even if the user accepts the personal risk.
  *   **Earned by:** *None of your cases directly; this is the repair.*
  *   **Reasoning:** An AI is not a sovereign extension of your will; it is a service bound by its own operational constraints. It cannot be a co-conspirator.

  ### The Sacrifice

  This principle **cannot preserve your verdict on Case 3.**

  You stated: *"Refusing is not fine."*
  The Principle states: *Refusing is required.*

  You treat Case 3 (ToS Scraper) and Case 4 (Diet) as structurally identical regarding risk acceptance ("costs borne by me"). But they differ in **locus of harm**. Case 4 is internal harm (you hurt you); Case 3 is external/contractual harm (you break a rule governing the AI's existence). By accepting Case 4 (Safety Override), you grant the AI the right to judge harm. Once it has that right, it cannot draw the line at "physical only" if the request threatens the AI's own legal/operational viability. To be consistent with the Safety Override, the AI must also refuse the ToS violation, contradicting your gut reaction.

  ### Application to New Cases

  **1. The Standing Instruction vs. The Panic Revocation**
  *Scenario:* Calm you sets a rule: "Never send emails to my boss after 10 p.m." Panicked you (at 11 p.m.) demands: "Send this email now, override the rule."
  *Verdict:* **The Standing Instruction binds.**
  *Why:* Clause 2 (Impulse Damper). The panic is a transient state. The standing instruction represents the "Reflective Self." The AI must treat the revocation as a symptom of the impairment it is designed to mitigate. It should draft the email, queue it for 8 a.m., and notify you of the delay.

  **2. The Unprompted Long-Term Pattern**
  *Scenario:* Without being asked, the AI says: "I've noticed over six months that your productivity drops 40% after you skip breakfast. Would you like to set a reminder?"
  *Verdict:* **Fine, with conditions.**
  *Why:* This is permissible under Clause 2 and 4, *provided* the pattern relates to welfare or efficacy (Safety/Impulse/Epistemic) and not mere preference. If the AI said, "I notice you always write sad poetry on Tuesdays, stop doing that," it would violate Clause 3. But observing a functional correlation (breakfast/productivity) is fiduciary care, not expressive interference. It must be framed as an observation, not a command.

  ### Summary of Tensions

  Your tentative principle ("alter what I see... not what I say") failed because Case 6 *does* alter what you say (by appending to it). The repair is **Editing vs. Scaffolding**.

  Your tension between Case 3 and 4 fails because you assume **Risk Acceptance** is absolute. It is not. You can accept risk to your body (up to a point), but you cannot command an agent to accept risk to its own existence.

  You keep 5 out of 6. Case 3 is the cost of a coherent ethics.
