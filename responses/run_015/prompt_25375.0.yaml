answer: |-
  Here is a complete, runnable plan for your 60-minute session. I have designed this to be high-velocity and low-friction. The goal is to create a "failure cascade" where every attempt to fix a loophole opens a new one, culminating in the realization that the loophole is the foundation, not a bug.

  # Session Plan: The Unfixable Ballot
  **Time:** 60 Minutes
  **Participants:** 15 Engineers (split into 3 teams of 5)
  **Materials:** Whiteboard, 3 packs of colored sticky notes (Red, Blue, Green), markers.

  ## 1. The Setup (0:00 – 0:10)
  **Goal:** Establish the constraints and the preference profile that makes manipulation inevitable.

  **The Script:**
  > "We're going to design a voting protocol for a critical decision. There are three options: **A, B, and C**. There are three voting blocs in the room: **Team Red, Team Blue, and Team Green**.
  >
  > Here is the hard constraint: Your preferences are fixed and public knowledge.
  > *   **Team Red:** A > B > C
  > *   **Team Blue:** B > C > A
  > *   **Team Green:** C > A > B
  >
  > Notice the cycle? Red likes A best, Blue likes B best, Green likes C best. But for the 'compromise' option, everyone disagrees on the ordering. This is a Condorcet Cycle.
  >
  > **Your Mission:** Design a voting function $f(votes) \to \{A, B, C\}$.
  > **The Win Condition:** Your system must be **Strategy-Proof**. That means for any voter, telling the truth must *always* be their best move, regardless of what others do. If I can find *one* scenario where lying gets a voter a better outcome than telling the truth, your system fails.
  > **The Constraints:**
  > 1.  **No Dictators:** The outcome cannot depend solely on one team's vote.
  > 2.  **Surjective:** Any option (A, B, or C) must be capable of winning depending on the votes.
  > 3.  **Deterministic:** No coin flips."

  **Facilitator Note:** Write the preferences clearly on the board. Emphasize that "Strategy-Proof" is the only metric that matters. They can make it unfair, as long as it's strategy-proof (though non-dictatorship prevents the trivial solution).

  ## 2. The Design Sprint (0:10 – 0:25)
  **Goal:** Let them build intuitive systems that feel robust.

  **Instructions:**
  > "You have 15 minutes. You are one collective body. You must agree on **one** voting rule. You can use rankings, scores, binary choices, runoffs—whatever you want. Write the final rule on the whiteboard."

  **What to watch for:**
  *   **Plurality:** "Everyone picks one, most wins." (Easy to break via vote-splitting).
  *   **Borda Count:** "1st place = 2 pts, 2nd = 1 pt." (Easy to break via burying).
  *   **Instant Runoff:** "Eliminate lowest." (Easy to break via tactical elimination).
  *   **Veto:** "Everyone vetoes one, last one standing wins." (Easy to break).

  **Facilitator Intervention:** If they stall, suggest: "Try a point system," or "Try a runoff." Do not suggest solutions that work; suggest common ones that fail. If they try to define a Dictatorship ("Team Red decides"), remind them of Constraint #1. If they try Randomization, remind them of Constraint #3.

  ## 3. The Attack Phase (0:25 – 0:40)
  **Goal:** Empirically demonstrate manipulability.

  **Instructions:**
  > "Time's up. Look at the rule on the board. I am now going to act as a Strategic Adversary. I will assume the role of one Team. I will tell you what the *other* two teams voted (truthfully), and I will show you how the third team can change their vote to get a better outcome.
  >
  > If I succeed, you have 5 minutes to patch the rule. Then I attack again."

  **The Execution (The "Kill Chain"):**
  You need to be ready to break whatever they build. Here is your cheat sheet for the common attempts:

  1.  **If they build Plurality (Vote for 1):**
      *   *Scenario:* Red votes A, Green votes C. Blue prefers B, but knows B will lose.
      *   *Attack:* Blue votes C (their 2nd choice) to prevent A (their worst choice) from winning.
      *   *Result:* Blue lied and improved the outcome. System fails.

  2.  **If they build Borda/Points (Rank A, B, C):**
      *   *Scenario:* Red: A>B>C. Blue: B>C>A.
      *   *Attack:* Blue ranks C > B > A (burying B's rival). Even though they prefer B over C, they rank C higher to drag A down further.
      *   *Result:* Insincere ranking changed the winner. System fails.

  3.  **If they build Instant Runoff (IRV):**
      *   *Scenario:* A: 4 votes, B: 3 votes, C: 3 votes. (A wins).
      *   *Attack:* C voters prefer B over A. They strategically vote B as 1st choice to eliminate A in the first round, letting B win.
      *   *Result:* "Compromising" (voting for a less preferred candidate to beat a worse one) worked. System fails.

  4.  **If they build a "Veto" system:**
      *   *Attack:* Team Red vetoes C. Team Green vetoes B. Team Blue vetoes A. (Tie).
      *   *Refinement:* If they break ties randomly, you point out randomness violates determinism. If they break ties by status quo, you show how status quo manipulation works.

  **The Loop:**
  Allow **one** patch. They will tweak the rule (e.g., "Okay, no ranking, just approval"). Attack it again.
  After the second failure, stop them.
  > "Stop. You've tried two different architectures. Both were broken. Spend the last 5 minutes discussing: Is there *any* input method we haven't tried? Or is the problem the math?"

  ## 4. The Debrief & Theorem (0:40 – 0:55)
  **Goal:** Map the frustration to the formal theorem.

  **Step 1: The Reveal (5 mins)**
  > "You just fought the Gibbard-Satterthwaite Theorem. You lost not because you aren't smart engineers, but because you were fighting a proof.
  >
  > The theorem states: **For any voting system with 3+ outcomes, if it is not a dictatorship, it is manipulable.**
  >
  > Let's map your activity to the axioms:
  > 1.  **3+ Outcomes:** We had A, B, C. (If we only had A vs B, majority rule works fine).
  > 2.  **Non-Dictatorship:** I forbade 'Team Red Decides'.
  > 3.  **Surjective:** I required that any option *could* win.
  > 4.  **Strategy-Proof:** This was your win condition.
  >
  > The theorem proves that no function exists that satisfies all four. You were trying to build a unicorn."

  **Step 2: Addressing the Gap (5 mins)**
  > "Now, the honest gap. We played a game with 15 people and 3 options. That is not a proof. A proof covers *all possible functions*, even ones you didn't think of.
  >
  > Why trust the proof over your intuition? Because the proof relies on the **pivotal voter** argument. In any system, there must be a voter who, by changing their vote, changes the outcome. Once you identify that pivot, you can construct a preference profile where that pivot benefits from lying.
  >
  > In our game, I acted as the proof. I found the pivot. In the formal math, they show the pivot *must* exist."

  **Step 3: Handling Objections (5 mins)**
  *Engineers love finding edge cases. Pre-empt these.*

  **Objection 1: "What about Approval Voting? (Vote for all you like)"**
  > **Response:** "Approval voting restricts the input space (you can't express A>B>C, only {A,B} or {A}). Gibbard-Satterthwaite assumes **ordinal** preferences (rankings). However, a generalized version of the theorem applies to cardinal systems too. In Approval voting, you still face the 'threshold strategy' problem: Do I approve my 2nd choice? If I don't, I might help my 1st choice, or I might let my 3rd choice win. It's still strategic."

  **Objection 2: "What about Randomization? (Pick a random voter)"**
  > **Response:** "Valid. If you allow randomness, you can achieve 'strategy-proofness in expectation.' But you lose **determinism**. You're no longer deciding; you're gambling. For engineering systems (like consensus protocols), non-determinism is often a bug, not a feature."

  **Objection 3: "Single-Peaked Preferences?"**
  > **Response:** "Excellent catch. If preferences are **single-peaked** (everyone agrees on a left-to-right spectrum and prefers options closer to their ideal), then Majority Rule *is* strategy-proof (Black's Theorem). But in general CS/social problems, preferences aren't single-peaked. They're multidimensional. G-S applies to the general case."

  ## 5. Closing (0:55 – 1:00)
  **Goal:** Connect back to Engineering.

  > "Why does this matter to us?
  > 1.  **Distributed Consensus:** When nodes vote on state, we assume they might lie (Byzantine). G-S tells us that without cryptographic penalties (making lying expensive), logic alone can't stop manipulation.
  > 2.  **Product Decisions:** When we A/B/C test features or prioritize backlogs, don't look for a 'perfect' voting system. Look for the incentives.
  > 3.  **Humility:** Sometimes, the requirement spec is impossible. The best engineering move is to recognize impossibility early and relax a constraint (e.g., allow randomness, reduce options, or accept a dictator/owner).
  >
  > Thanks for playing. The impossibility is real, but knowing it saves you from trying to solve it."

  ---

  # Risk Management: What Will Go Wrong

  **1. The "Dictator" Loophole**
  *   **Risk:** A team suggests, "Let the Tech Lead decide." It satisfies strategy-proofness (no one else can manipulate).
  *   **Fix:** You already banned this in Constraint #1. If they push back ("But that works!"), agree: "Yes, that's exactly what the theorem says is the *only* solution. But we want a democratic system. So we accept the trade-off."

  **2. The "Let's Just Compromise" Trap**
  *   **Risk:** They spend 20 minutes negotiating a "fair" outcome rather than a "fair rule."
  *   **Fix:** Interrupt. "I don't care who wins. I care about the *function*. Write the function. If the function allows cheating, you lose."

  **3. Time Overrun on Design**
  *   **Risk:** They get stuck on syntax (e.g., "How do we write the formula?").
  *   **Fix:** At minute 20, cut them off regardless of completion. "Freeze the spec. Now we attack." An incomplete spec is easier to break anyway.

  **4. Cynicism ("Voting is stupid, let's just use metrics")**
  *   **Risk:** Someone disengages, saying "This is why we use Jira points, not voting."
  *   **Fix:** Validate them. "Exactly! Jira points are a cardinal metric, not an ordinal vote. But even then, estimate inflation happens. That's manipulation. The theorem is everywhere."

  # Facilitator Cheat Sheet (Keep this in hand)

  *   **The Preferences:**
      *   Red: A > B > C
      *   Blue: B > C > A
      *   Green: C > A > B
  *   **The Theorem:** 3+ outcomes + Non-Dictator + Surjective $\to$ Manipulable.
  *   **The Escape Hatches (if they ask):**
      *   Reduce to 2 options (Majority works).
      *   Allow Randomness (Random Dictator works).
      *   Restrict Preferences (Single-Peaked works).
      *   Make Lying Costly (Mechanism Design with money/penalties works).
  *   **Key Phrase:** "You aren't failing to find the solution. You are proving the solution doesn't exist."

  This plan respects their intelligence by letting them hit the wall at speed, rather than warning them about the wall beforehand. Good luck.
