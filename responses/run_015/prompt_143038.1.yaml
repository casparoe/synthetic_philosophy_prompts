answer: |-
  Distinguished colleagues, neighbours, friends, and especially those among us who have walked the long road from hunger to this hall: welcome.

  We gather to inaugurate a symposium on Hunger, Governance, and Moral Responsibility. It is a heavy title. Too often, when we speak of famine, the language defaults to the meteorological or the agricultural. We speak of drought, of blight, of soil exhausted by overuse. We speak of nature's fury. We count calories and tonnage. We ask, 'Was there enough food?' And when the answer is ambiguous, we retreat into the comforting vocabulary of tragedy. A tragedy is something that happens *to* us. It is an act of God, a misfortune of geography, a sorrowful inevitability.

  But if we are to honour the gravity of this gathering, we must commit a category error against that conventional wisdom. We must recognise that famine is rarely a story of food availability; it is almost always a story of food entitlement.

  The economist and philosopher Amartya Sen altered the landscape of development thought by insisting that starvation is not usually the result of there being too little food in a country, but of specific groups losing the ability to command the food that exists. To make this concrete for our purposes today, we must sharpen this insight into a specific diagnostic tool. We must distinguish between two modes of collapse.

  First, there is *direct entitlement collapse*. This occurs when individuals lose command over food through a breakdown in their own production or immediate legal access. You grow the crop, the crop fails, you have nothing. It is a failure of endowment.

  Second, and more critically for our understanding of governance, there is *mediated entitlement collapse*. This occurs when state policy, market restructuring, or deliberate exclusion severs exchange entitlements for specific populations, even when aggregate food supplies remain adequate. You have labour to sell, or money to spend, but the rules of the economy— manipulated by war, ideology, or neglect—ensure that your labour buys no bread.

  When we apply this distinction to the great famines of history, the vocabulary of natural catastrophe begins to crumble.

  Consider the Irish famine of the 1840s. Conventionally, this is remembered as the Potato Blight. And indeed, there was a direct entitlement collapse for the subsistence farmer whose primary crop turned to rot in the ground. Their endowment vanished. Yet, to stop the analysis there is to commit a moral evasion. During those same years, Ireland remained a net exporter of grain and livestock to Britain. The food existed. The ships sailed. But for the Irish labourer, the mediated entitlement was severed. Market laws and colonial policy prioritised contract law over human need. The blight was the spark, but the policy was the fuel. To call this merely a tragedy of nature is to ignore the mediated collapse that turned a crop failure into a demographic catastrophe.

  Move now to Bengal, 1943. The conventional narrative speaks of food availability decline due to the chaos of war. Sen's analysis dismantles this. Aggregate food supply in Bengal was not significantly lower than in previous non-famine years. There was no massive direct collapse of production across the board. Instead, we see a stark mediated collapse. War-induced inflation, speculative hoarding, and priority distribution to the military and urban centres meant that rural labourers saw their wages dissolve in value. They could not exchange their labour for rice, even while granaries nearby were full. The food was there; the entitlement was not. This was not a shortage of supply; it was a redistribution of access via the mechanism of price and policy.

  Finally, consider the Great Leap Forward in China. Here, the distinction becomes almost entirely political. There was no external blight, no colonial export regime. There was, however, a radical restructuring of exchange entitlements through state procurement quotas. Grain was extracted from the countryside to feed urban industrialisation and service foreign debt obligations. Local reporting structures were coerced into inflating yield figures, leading to higher quotas that stripped villages of their surplus and their seed. This was a mediated entitlement collapse engineered by the state itself. The food was grown, but the political architecture ensured it could not be consumed by those who produced it.

  Why does this technical distinction matter to us here, in this room? Because it dictates our moral vocabulary.

  If a famine is caused by direct entitlement collapse—a genuine, unavoidable crop failure across a closed system—we may speak of tragedy. We may speak of misfortune. But when we identify mediated entitlement collapse, the vocabulary must shift. When policy severs the link between labour and food, when inflation is tolerated while stocks rot, when exports continue amidst starvation, we are no longer speaking of tragedy. We are speaking of negligence. In the most severe instances, where exclusion is deliberate, we are speaking of crime.

  This is the structural backbone of our symposium. We cannot treat hunger as a humanitarian logistics problem alone. If we do, we become merely the managers of catastrophe, delivering aid to clean up the failures of governance. We must become auditors of power.

  To the economists here: your models must account for exchange entitlements, not just aggregate supply. To the philosophers: your ethics must address the structural violence of policy, not just the benevolence of aid. To the practitioners: your metrics of success must include political accountability, not just calories delivered.

  And to our neighbours who have survived displacement: your presence here is the ultimate verification of this theory. You know better than any model that hunger is not about empty fields; it is about closed doors. It is about the checkpoint that stops the truck, the currency that buys nothing, the law that favours the exporter over the child.

  Therefore, let this symposium abandon the comfort of the natural disaster narrative. Let us not ask only 'How do we feed the hungry?' Let us ask 'Who rendered them hungry?' Let us trace the mediated collapses—the inflationary policies, the procurement quotas, the trade restrictions—and assign responsibility accordingly.

  If famine is politically constituted, then it is politically soluble. But it requires the courage to name the cause. When we abandon the language of fate, we inherit the burden of responsibility. That is the work before us. Not to mourn the tragedy, but to indict the failure. Not to manage the hunger, but to dismantle the governance that manufactures it.

  Thank you.
