answer: |-
  Can we make sense of structural masks—where the interfering mechanism is internal and constitutive to the system—without collapsing them into the mere absence of the disposition? This question sits at the intersection of metaphysics and the philosophy of science, challenging the standard taxonomy used to analyze dispositional properties. In the existing literature on dispositions, the debate largely centers on how to refine the conditional analysis to account for cases where a disposition fails to manifest despite the presence of its stimulus. The traditional solutions involve categorizing these failures as either finks, where the disposition itself is removed upon stimulation, or masks, where an external interferer prevents the manifestation while the disposition remains intact. However, both categories rely on a specific assumption about the locus of the interference. Finks are typically understood as intrinsic changes to the base property, while masks are understood as extrinsic factors acting upon the object from the outside. My project proposes that there is a third category of interference that the current literature overlooks: the structural mask. In this scenario, the interfering mechanism is neither a fleeting intrinsic change nor an extrinsic antidote, but rather a permanent, internal feature of the system's design that prevents the disposition from manifesting under the very conditions it was supposed to govern.

  The motivation for this inquiry arises from a practical observation in institutional design that mirrors a metaphysical puzzle. In a previous professional context, I observed an internal review board technically empowered to block unethical funding. On paper, the organization possessed the disposition to prevent unethical projects. In practice, the board's rules were written such that it only activated when a project was already dead for other reasons. The capacity to stop bad stuff was present in the organizational chart, but the operational rules ensured it never actually functioned as a blocker in live scenarios. This was not a case of the organization lacking the disposition entirely, nor was it a case of an external force preventing the board from acting. The interference was built into the constitution of the board itself. Translating this to the philosophy of science, we encounter systems where the causal base of a disposition includes a feedback loop or a structural breaker that inhibits the manifestation. The central problem is determining whether such a system genuinely possesses the disposition but is structurally masked, or whether the presence of the internal breaker means the disposition was never there to begin with. If the latter is true, then structural masks are merely a verbose way of describing the absence of a disposition. If the former is true, then the current conditional analysis requires revision to accommodate internal interferers that do not destroy the dispositional base.

  This proposal outlines a term paper that will argue for the distinctness of structural masks as a taxonomic category separate from both standard masks and the absence of disposition. The paper will not attempt to solve the broader debate surrounding the conditional analysis of dispositions, as that scope is too large for a single semester project. Instead, the deliverable will demonstrate that structural masks pose a unique problem that the current taxonomy misses, thereby creating a gap in our metaphysical understanding of functional systems. The argument will proceed through conceptual analysis, utilizing three specific case types to pump intuitions and test the consistency of our categorizations. These cases will cover an artifact with a built-in breaker, an institutional role with built-in recusal, and a biological feedback loop. By moving across these domains, the paper will show that our intuitions about the presence of the disposition remain consistent even when the interferer is internal, provided we adopt a specific view of the dispositional base. The methodology will be strictly conceptual, avoiding empirical investigation into specific instances of these systems in favor of analyzing the logical structure of the claims made about them. This approach is necessary because the question is not about how often these systems occur, but about how we ought to classify them metaphysically.

  The background for this project lies in the extensive literature concerning dispositional properties and the conditional analysis. In the philosophy of science, dispositions are often used to explain causal powers, functional roles, and laws of nature. The simple conditional analysis suggests that to say an object has a disposition is to say that if it were subjected to a specific stimulus, it would manifest a specific response. For example, to say a glass is fragile is to say that if it were struck, it would break. However, this analysis faces well-known counterexamples. The most prominent are finkish dispositions and masked dispositions. A finkish case occurs when the stimulus itself causes the disposition to vanish before the manifestation can occur. For instance, if a wizard is determined to keep a glass intact and instantly removes its fragility the moment it is struck, the conditional "if struck, it would break" is false, yet we might still want to say the glass was fragile before the strike. A masked case occurs when the disposition remains, but something else prevents the manifestation. If the glass is wrapped in bubble wrap, it is still fragile, but it will not break when struck. The standard solution is to amend the conditional analysis to include a "ceteris paribus" clause or to specify that no interferers are present.

  The critical limitation in this existing literature is the assumption regarding the location of the interferer in masking cases. Standard discussions of masks almost universally treat the masking factor as extrinsic. The bubble wrap is outside the glass. The antidote is outside the poison. The electric field interfering with the charge is external to the particle. This externalism allows philosophers to maintain that the dispositional base—the intrinsic property grounding the disposition—remains untouched. The mask sits on top of the disposition, blocking the output without altering the internal machinery. However, this clear distinction blurs when the interfering mechanism is part of the system's intrinsic design. Consider a circuit breaker. The wire has the disposition to conduct electricity. The breaker is designed to stop the flow if the current gets too high. The breaker is internal to the circuit system. When the current spikes, the breaker trips, and the wire stops conducting. Is the wire still disposed to conduct? Yes. Is the breaker a mask? It prevents the manifestation. But it is not an external antidote; it is a constitutive part of the electrical system's design. If we call this a mask, we must accept that masks can be internal. If we do not, we must say the system lacks the disposition to conduct under high current, which seems wrong because it conducts perfectly under normal current.

  This tension leads to the concept of the structural mask. A structural mask is an interfering mechanism that is internal and constitutive to the system, yet functions to prevent the manifestation of a disposition under specific stimuli without destroying the dispositional base. The challenge is to distinguish this from a case where the disposition is simply absent. If a system is designed such that it never manifests a property because of its internal design, one could argue it never had the disposition. For example, if a car is designed with a governor that prevents it from ever exceeding fifty miles per hour, does it have the disposition to go faster? One might say no, because the engine is physically limited. But if the governor is a separate mechanism that cuts fuel flow, the engine might have the power, but the system prevents its use. The line between "lacking the power" and "having the power but being internally blocked" is thin. The literature on dispositions does not currently settle whether an internal breaker counts as a mask or just proves the thing never had the disposition in the first place. This is the gap my paper intends to address. By isolating this specific type of interference, I aim to show that our current binary of intrinsic base versus extrinsic interferer is insufficient for complex systems, particularly in biology and institutional science where feedback loops are common.

  The methodology for this project will be conceptual analysis grounded in intuition pumping across varied cases. I will not be conducting empirical research into specific nonprofits, circuits, or biological organisms. Instead, I will construct hypothetical and generalized models of these systems to test our classificatory intuitions. This method is superior to a literature review because a review would only summarize existing positions, none of which adequately address the internal nature of the structural mask. A literature review would reveal the gap but not propose a solution. It would show that masks are treated as external, but it would not explain why internal masks should be treated differently or how to integrate them. Empirical work is also unsuitable because the question is not about the frequency or mechanics of these systems, but about their metaphysical categorization. Knowing how a biological feedback loop works physiologically does not tell us whether the organism possesses a disposition that is masked or whether it lacks the disposition entirely. That is a philosophical question about property attribution. Conceptual analysis allows us to isolate the variables of interest—internal versus external, constitutive versus accidental—and see how our judgments about the disposition track with these variables.

  The core of the paper will be the examination of three case types. The first case type is an artifact with a built-in breaker. This will likely focus on electrical safety systems or mechanical governors. The intuition to be tested here is whether we attribute the disposition to the component or the system. If we say the wire is disposed to conduct, the breaker looks like a mask. If we say the circuit is disposed to conduct, the breaker looks like a design feature that limits the disposition. I will argue that we need to distinguish between the disposition of the material and the disposition of the system. The structural mask operates at the system level to mask the disposition of the component. This distinction helps preserve the idea that the disposition exists but is prevented from manifesting by the system's structure. The second case type is an institutional role with built-in recusal. This draws directly from the nonprofit example. An ethics board may have the disposition to block unethical grants. However, its charter may require it to recuse itself if certain internal conditions are met, conditions that align with the grant already being non-viable. Here, the mask is the rule set governing the board. It is internal to the institution's constitution. The intuition to be pumped is whether the institution is ethically disposed to block bad grants. If the rules prevent it from acting when it matters, is the disposition real? I will argue that the disposition is real but structurally masked by the governance rules, which explains why the institution feels like it has the capacity but fails to use it. This captures the frustration of the original observation: the capacity was real, but the structure prevented its deployment.

  The third case type is a biological feedback loop. This is crucial for extending the argument beyond human artifacts into natural kinds. Homeostatic mechanisms often work by inhibiting a process when it reaches a certain threshold. For example, the body has a disposition to produce heat when cold, but also a disposition to stop producing heat when overheated. The stopping mechanism is internal. Is the disposition to produce heat masked by the cooling mechanism? Or is the disposition simply conditional on temperature ranges? I will argue that viewing these as structural masks allows for a richer understanding of biological function. It allows us to say the organism has competing dispositions that are structurally managed, rather than saying the dispositions vanish when conditions change. This avoids a finkish interpretation where the disposition disappears exactly when the stimulus changes. By treating the feedback loop as a structural mask, we can maintain that the disposition to produce heat remains, but is masked by the internal regulatory system to prevent damage. This aligns with how biologists often speak of capacities being present but inhibited.

  Across these three cases, the paper will look for consistency in our intuitions. If we treat the artifact breaker as a mask, should we treat the biological feedback loop as a mask? If we treat the institutional recusal as an absence of disposition, should we treat the circuit breaker as an absence of conductivity? The goal is to show that our intuitions are stable only if we accept structural masks as a valid category. If we try to force these cases into the existing categories of standard masks or absence, we end up with contradictory judgments. For the artifact, we want to say the wire is still conductive. For the institution, we want to say the board still has authority, even if unused. For the biology, we want to say the organism still has the capacity, even if regulated. The common thread is an internal mechanism preventing manifestation without destroying the base. This consistency supports the thesis that structural masks are a distinct phenomenon.

  The argument will also address the potential counterargument that structural masks are just complex finks. A fink removes the disposition upon stimulation. One could argue that an internal breaker removes the disposition internally when the stimulus arrives. I will reject this by showing that the base property remains intact in structural masking. The wire does not lose its conductivity when the breaker trips; the circuit is opened. The material property is unchanged. The institution does not lose its authority when it recuses; the rules prevent its exercise. The biological organ does not lose its capacity when the feedback loop activates; the signal is inhibited. In a true fink, the property itself is altered or removed. In structural masking, the pathway to manifestation is blocked by a constitutive part of the system. This distinction is vital for maintaining the integrity of the dispositional base. If we classify structural masks as finks, we imply the system loses its power. If we classify them as absence, we imply it never had the power. Neither fits the cases well. Therefore, a new category or a revision to the mask category is needed.

  I will also consider whether this requires a revision to the conditional analysis itself. The simple conditional analysis says "if stimulus, then manifestation." To accommodate structural masks, we might need to add a clause specifying that no internal structural preventers are active. However, this risks making the analysis trivial or too complex. Alternatively, we might keep the conditional analysis but expand the taxonomy of interferers to include internal structural ones. I will argue for the latter. Revising the conditional analysis is too ambitious for this paper and enters into broader debates about the nature of conditionals. Instead, I will propose that we expand the taxonomy of masks to include structural masks. This achieves the goal of accurately describing the systems without upending the broader metaphysical framework. It allows us to say the disposition exists, the stimulus is present, but a structural mask prevents the manifestation. This preserves the reality of the disposition while acknowledging the failure of manifestation.

  The significance of this project extends beyond taxonomy. It has implications for how we explain function in science. If we misclassify structural masks as absence of disposition, we might conclude that a system lacks a function it was designed to have. This leads to errors in functional explanation. For example, if we say the ethics board lacks the disposition to block unethical funding, we might recommend adding a new board. But if we recognize the structural mask, we see the problem is the internal rules, not the lack of capacity. Similarly in biology, if we say an organism lacks a disposition because of feedback inhibition, we might misunderstand its evolutionary adaptations. Recognizing structural masks allows for more precise diagnostic explanations. It helps distinguish between broken systems and systems that are working as designed to inhibit certain outputs. This distinction is crucial for the philosophy of science, which often deals with complex systems where internal regulation is the norm rather than the exception.

  There are clear limits to what this paper can achieve. Solving the whole conditional-analysis debate is too big for one semester. I will not attempt to defend a specific version of the conditional analysis against all comers. I will not attempt to prove that dispositions are real entities versus mere linguistic conveniences. The scope is restricted to the classification of interference types within the dispositional framework. The deliverable should just show that structural masks pose a distinct problem the current taxonomy misses. I will not claim to have the final word on how to integrate them into all metaphysical systems. The goal is to establish the problem and propose a plausible categorization. This limited scope ensures the project is feasible within the eight-week timeline. It allows for deep engagement with the specific cases without getting bogged down in the broader history of dispositional metaphysics.

  I must also be honest about what failure looks like for this project. The primary risk is circularity. If I define structural masks in a way that presupposes the existence of the disposition, I will not have proven that they are distinct from absence. For example, if I say "a structural mask is when a disposition is present but blocked," I am assuming the disposition is present. To avoid this, I must provide independent criteria for the presence of the disposition that do not rely on the manifestation. I will need to rely on the persistence of the base property. If the base property remains unchanged during the interference, the disposition is present. If the test for the base property relies on the manifestation, I will be circular. I must show that we can identify the base property independently of the manifestation in these cases. For the wire, we can test conductivity at low currents. For the institution, we can test authority in non-recusal scenarios. For the biology, we can test the capacity in isolated tissue. If I cannot distinguish structural masking from absence without circularly appealing to the very disposition I am analyzing, the project fails. Another form of failure would be if the three case types yield inconsistent intuitions. If the artifact feels like a mask but the biology feels like absence, then the category of structural mask is not robust. I need to show that the intuition holds across domains. If it does not, then structural masking might be domain-specific rather than a general metaphysical category. I will address this by refining the definition of structural mask to ensure it applies uniformly.

  The timeline for this project is tight but manageable over eight weeks. The first two weeks will be dedicated to refining the definitions of finks, masks, and structural masks. I will review the relevant sections of the literature to ensure I am characterizing the standard view accurately, even though I will not include formal citations in the final text. I need to be sure I am not attacking a straw man. The next two weeks will focus on developing the three case studies. I will write out the detailed descriptions and test them against counterarguments. I will ask peers or colleagues to read the cases to see if their intuitions match mine. This informal testing is part of the conceptual analysis method. The following two weeks will be for drafting the argument connecting the cases to the thesis. I will focus on the consistency of the intuitions and the distinction from finks. The final two weeks will be for revision and polishing. I will check for circularity and ensure the scope limitations are clearly stated. I will also ensure the writing is clear and adheres to American English conventions. The final output will be a paper of approximately 6,000 words, which allows enough space to develop the cases fully without rushing the philosophical analysis.

  One potential complication is the temptation to drift into empirical claims. When discussing the biological feedback loop, it is easy to start making claims about specific hormones or neural pathways. I must resist this. The paper is not about the biology; it is about the metaphysical classification of the biological system. I will keep the descriptions general enough to serve as philosophical examples rather than scientific reports. Similarly, with the institutional case, I must avoid getting bogged down in the specifics of nonprofit law. The focus must remain on the structure of the disposition and the interference. This discipline is necessary to keep the paper within the bounds of philosophy of science. The empirical details are only there to support the intuition pump, not to stand as evidence themselves. The evidence is the intuition itself, guided by the conceptual structure.

  Another consideration is the relationship between structural masks and normative dispositions. The institutional case involves a normative capacity—the ability to block unethical acts. The artifact and biological cases involve causal capacities. I need to address whether the concept of structural mask applies equally to normative and causal dispositions. If it only applies to one, the category is less useful. I will argue that the logical structure is the same. In both cases, there is a capacity, a stimulus, a manifestation, and an internal preventer. The nature of the capacity does not change the metaphysical problem of classification. This unification strengthens the argument for structural masks as a general category. It shows that the problem is not specific to ethics or engineering, but is a feature of dispositional attribution in complex systems generally.

  I also need to be careful with the term "internal." In philosophy, internal often means intrinsic. But a structural mask might be intrinsic to the system but extrinsic to the component. The breaker is intrinsic to the circuit but extrinsic to the wire. I will need to clarify the level of analysis. The disposition is attributed to the system, and the mask is internal to the system. This avoids confusion about whether the mask is intrinsic to the object bearing the disposition. If the object is the system, the mask is internal. If the object is the component, the mask is external. I will argue that for structural masks, the relevant object is the system. This is why the nonprofit board is the object, not the individual members. The circuit is the object, not the copper wire. This shift in the locus of disposition attribution is part of what makes structural masks distinct. Standard masks usually assume the object is the simple substance. Structural masks require us to look at complex systems. This implies that the taxonomy of dispositions might need to be sensitive to mereological structure. This is a deeper implication that I may touch on but not fully explore, given the scope limits.

  In conclusion, this project aims to carve out a space for structural masks within the philosophy of dispositions. By leveraging intuition pumps across artifacts, institutions, and biological systems, I will demonstrate that internal interferers function differently from external masks and finks. They do not remove the disposition, nor are they merely external blockers. They are constitutive features that regulate manifestation. Recognizing this category improves our ability to analyze complex systems in science and society. It prevents us from mistakenly attributing absence of capacity where there is only structural inhibition. The paper will not solve all problems related to conditional analysis, but it will show that the current taxonomy is incomplete. By clearly defining the failure conditions and adhering to a conceptual methodology, the project remains feasible within the semester constraints. The result will be a clearer understanding of how dispositions operate in structured environments, contributing to a more nuanced metaphysics of science. The work will begin immediately with a focus on refining the definitions to ensure the argument rests on solid conceptual ground. The ultimate goal is to provide a framework that philosophers of science can use when analyzing systems where design and regulation complicate the simple stimulus-response model. This framework will acknowledge that sometimes the thing that stops the disposition is part of the thing that has the disposition, and that this does not negate the disposition's existence.
