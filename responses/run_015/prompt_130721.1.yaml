answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee Plenary Members; Patient Family Representatives
  **FROM:** Clinical Ethics Committee Research Fellow (Drafting for Committee Vote)
  **DATE:** October 23, 2023
  **SUBJECT:** Ethical Determination and Care Plan Recommendation: Case #FTD-589 (Sustained Experiential Prosthesis Protocol)

  **I. PURPOSE AND RECOMMENDATION**

  This memorandum serves as the formal record of the Clinical Ethics Committee's deliberation regarding the request for enrollment in the Sustained Experiential Prosthesis (SEP) protocol. Following review of the clinical data, the patient's advance directives, and statements from the patient's family, the Committee offers the following recommendation for immediate vote:

  **RECOMMENDATION:** **APPROVE WITH CONDITIONS.**

  Enrollment in the SEP protocol is ethically permissible under current institutional guidelines, provided that specific safeguards regarding relational continuity and epistemic transparency are implemented. This approval is contingent upon the successful completion of a structured mediation process and a phased enrollment schedule detailed in Section IV.

  **II. CASE SUMMARY AND ETHICAL CONFLICT**

  The patient is a fifty-eight-year-old female with rapidly advancing frontotemporal degeneration (FTD). She retains decision-making capacity at this time. She has requested enrollment in the SEP, an experimental neural interface designed to maintain subjective well-being by adapting sensory and narrative content as her cognitive architecture declines. The device preserves autobiographical continuity and includes an "epistemic-toggle" feature, ensuring the patient retains awareness of which interactions are simulated.

  The ethical conflict arises from divergent theories of well-being held by the patient and her family. The patient asserts an experiential view, prioritizing subjective quality of life and consistency with her lifelong hedonistic values. The family asserts an objective-list view, arguing that well-being requires unmediated relational presence and actual achievement. They contend that the SEP constitutes a form of institutionalized illusion that severs authentic connection, preferring conventional palliative sedation upon the loss of natural capacity.

  **III. ETHICAL ANALYSIS**

  **A. Patient Autonomy and Authentic Values**
  Institutional guidelines permit experimental comfort measures when they honor the patient's authentic values. The evidence suggests the patient's preference for experiential well-being is not a symptom of her pathology but a longstanding philosophical commitment predating her diagnosis. To deny this request based on a conflicting theory of well-being would impose an external value system upon a capable adult. The SEP's preservation of autobiographical continuity and the epistemic-toggle feature distinguishes this case from scenarios involving total delusion; the patient is choosing a managed experience with full knowledge of its provenance.

  **B. The Family's Objection: Relational Authenticity**
  The Committee acknowledges that the family's objection is not merely emotional but rests on a defensible ethical claim: that human well-being is inherently relational and that relationships require two unmediated participants to remain authentic. The family argues that by entering the SEP, the patient effectively withdraws from the shared reality necessary for genuine love and recognition. This is a significant moral concern. A medical intervention that facilitates a patient's withdrawal from the family unit risks causing profound moral injury to the survivors, complicating their grieving process and potentially violating the implicit social contract of care that exists between family members.

  **C. Adjudication of Competing Well-Being Theories**
  The Committee must weigh the patient's right to define her own good against the family's interest in relational integrity. While the family's objective-list perspective is philosophically robust, clinical ethics in this jurisdiction prioritizes the capable patient's conception of the good life when determining personal medical interventions. The state and the institution do not have the authority to mandate that a patient suffer lower subjective well-being to satisfy an objective standard of "authentic" interaction that the patient no longer values.

  However, the strength of the family's argument lies in the *dyadic* nature of relationships. While the patient controls her own mind, she cannot unilaterally dictate the terms of the relationship without impacting the other party. Therefore, while the patient's autonomy grants her the right to enroll, it does not grant her the right to do so in a manner that unnecessarily obscures the reality of the situation from her family or abandons the relational bond without transition. The approval of this protocol must therefore be conditioned on measures that respect the family's need for closure and continued, albeit mediated, connection.

  **IV. CONDITIONS OF APPROVAL**

  To balance the patient's autonomy with the legitimate ethical concerns regarding relational abandonment, the Committee mandates the following conditions prior to and during enrollment:

  1.  **Structured Relational Mediation:** Before activation of the SEP, the patient and family must participate in at least three facilitated sessions with a clinical ethicist and family counselor. The goal is not to change the patient's mind, but to establish a "Relational Care Plan." This plan must define how the family will interact with the patient through the SEP's transparent overlay and establish agreed-upon signals for affection and recognition that remain meaningful to the family.
  2.  **Epistemic-Toggle Protocol:** The "epistemic-toggle" (the feature revealing simulated content) must remain active by default. It may only be deactivated by the patient during specific periods of distress, and such deactivation must be logged. This ensures the patient is not living in a delusion but in a calibrated reality, addressing the family's concern that the patient is being "lost to illusion."
  3.  **Phased Enrollment:** Enrollment shall not be immediate. A two-week trial period of the interface overlay is required while the patient retains full capacity to assess the impact on family interactions. If the family reports that the mediated interaction is more distressing than beneficial, the protocol must be paused for re-evaluation.
  4.  **Palliative Contingency:** Should the SEP fail to provide the intended well-being, or should the patient's condition evolve in a way that makes the interface distressing, the care plan must immediately revert to conventional palliative sedation protocols as requested by the family as a backup.

  **V. TIMELINE FOR RECONSIDERATION**

  This approval is valid for a period of six months. The Committee requires a formal reassessment at the three-month mark to evaluate:
  *   The patient's continued satisfaction with the epistemic-toggle settings.
  *   The family's reported level of moral distress regarding the mediated relationship.
  *   Any adverse neurological effects of the interface.

  If the three-month review indicates that the intervention is causing significant, unmitigable harm to the family unit that outweighs the patient's experiential benefit, the Committee reserves the right to convene an emergency session to reconsider the viability of continued enrollment.

  **VI. CONCLUSION FOR VOTE**

  The Committee is asked to vote on the recommendation to **APPROVE WITH CONDITIONS** as outlined above. This course of action respects the patient's right to define her own well-being and authentic values while taking serious steps to mitigate the moral injury to the family and preserving the possibility of genuine, transparent connection for as long as possible.

  **Action Required:** Please indicate your vote (For, Against, Abstain) by Thursday at 09:00 hours to finalize the determination for communication to the care team and family.

  __________________________
  **Signature of Research Fellow**
  *Drafting on behalf of the Clinical Ethics Committee Chair*
