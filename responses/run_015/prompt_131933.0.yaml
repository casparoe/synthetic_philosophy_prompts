answer: |-
  ### Scenario Verdict: Replace the Reservoir
  **Do not use the circular reservoir scenario.** Replace it with the **"Thrown Straw on a Circular Table"** scenario (the physical instantiation of the classic Chord-in-Circle problem).

  **Why:**
  1.  **Robustness of the Contradiction:** The reservoir scenario (random point in a circle) typically yields two strong answers (1/4 via uniform area, 1/2 via uniform radius). It is difficult to generate a third, equally intuitive method for high schoolers without invoking complex coordinate transformations. The "Thrown Straw" scenario yields three distinct, classically robust answers (1/2, 1/3, 1/4) that are geometrically distinct but logically equal in validity.
  2.  **Avoiding the "Natural Measure" Trap:** In the reservoir example, students will instinctively argue that "area" is the only physical way a floating object distributes, allowing them to dismiss the paradox as a math error. With a thrown straw, there is no obvious "natural" physical distribution, forcing them to confront the ambiguity in the *description* of randomness rather than the physics of the object.
  3.  **Historical Fidelity:** Since you are teaching *Bertrand's* Paradox specifically, using the chord problem ensures your materials align with standard philosophical literature, preventing confusion if students research the topic later.

  ---

  ### Explicit Mathematical Omissions
  **Do not cover the following.** Acknowledge these exist but state they are beyond the scope of this session:
  *   **Measure Theory:** Do not discuss sigma-algebras or Lebesgue measure.
  *   **Coordinate Transformation Rules:** Do not derive Jacobians or show the calculus of how $dx$ transforms to $r dr$.
  *   **Continuous Probability Distributions:** Do not write out probability density functions (PDFs). Stick to ratios of lengths and areas.

  *Statement to students:* "We are dealing with continuous infinity today. Mathematicians have a heavy toolkit called 'measure theory' to handle this rigorously, but we will solve this using only ratios and geometry to focus on the *logic* of the paradox, not the calculus."

  ---

  ### 45-Minute Teaching Plan

  #### Phase 1: The Principle of Indifference (0:00–0:07)
  *   **Concept:** Introduce the Principle of Indifference (PoI).
  *   **Definition:** "If we have a set of mutually exclusive outcomes and no reason to suspect one is more likely than another, we must assign them equal probability."
  *   **Example:** A standard die. Why is P(6) = 1/6? Not because of physics, but because of *symmetry of information*.
  *   **Misconception Interception #1 (Symmetry vs. Uniformity):**
      *   *Predicted Error:* Students will assume symmetry in the *object* guarantees symmetry in the *probability*.
      *   *Defuse:* Explicitly state: "The PoI applies to our *knowledge*, not the object. If I hide a loaded die behind my back, the PoI still says 1/6, even if the physics says otherwise. Today, we assume the physics is perfect, but our *description* of the selection is ambiguous."

  #### Phase 2: The Scenario Setup (0:07–0:12)
  *   **Concept:** Define the problem physically to avoid "geometry class" vibes.
  *   **The Setup:** Draw a circle on the board (radius $R$). Inscribe an equilateral triangle inside it.
  *   **The Question:** "I stand back from this table and throw a straw. It lands on the table, forming a chord. What is the probability the straw is longer than the side of the triangle?"
  *   **Visual Aid:** Draw the triangle. Highlight that a chord is "long" if it crosses the inner triangle, "short" if it stays in the outer segments.
  *   **Constraint:** Emphasize the word **"Random."** Do not define *how* it is thrown. This ignorance is the engine of the paradox.

  #### Phase 3: The Three Methods (0:12–0:27)
  *   **Concept:** Derive the three answers using the PoI on different parameters.
  *   **Method 1: Random Endpoints (Answer: 1/3)**
      *   *Procedure:* Fix one end of the straw at a vertex of the triangle. The other end lands randomly on the circumference.
      *   *Logic:* The circle is 360°. The "long" arc is 120°. $120/360 = 1/3$.
      *   *PoI Application:* We assume all points on the rim are equally likely.
  *   **Method 2: Random Radius (Answer: 1/2)**
      *   *Procedure:* The straw lands perpendicular to a specific radius. The position along that radius is random.
      *   *Logic:* The triangle bisects the radius exactly in half. If it lands in the inner half, it's long. $1/2$.
      *   *PoI Application:* We assume all distances from the center are equally likely.
  *   **Method 3: Random Midpoint (Answer: 1/4)**
      *   *Procedure:* Every chord has a unique midpoint. We pick a random point inside the circle to be the midpoint.
      *   *Logic:* Long chords have midpoints inside the inscribed triangle's incircle (radius $R/2$). Area ratio is $(1/2)^2 = 1/4$.
      *   *PoI Application:* We assume all areas within the circle are equally likely.
  *   **Misconception Interception #2 (Physical Dynamics):**
      *   *Predicted Error:* "But in real life, I'd throw it from the edge, so Method 1 is right," or "Gravity pulls it to the center, so Method 3 is right."
      *   *Defuse:* Interrupt immediately. "We are not doing physics. We are doing epistemology. The problem states 'Random.' If 'Random' is a coherent concept, it should not matter *how* we model the throw, only that we lack information. If the answer changes based on how we model our ignorance, the concept of 'Random' is broken."

  #### Phase 4: The Contradiction & Synthesis (0:27–0:38)
  *   **Concept:** Collide the results to create the paradox.
  *   **The Conflict:** Write $1/3$, $1/2$, and $1/4$ on the board side-by-side.
  *   **Discussion:** "All three used the Principle of Indifference. All three used valid geometry. All three answered the exact same question. How can probability be 1/3 and 1/4 simultaneously?"
  *   **Resolution (The Jaynes Insight):**
      *   Explain that the problem is **ill-posed**.
      *   "Random" is not a property of the event; it is a property of the *procedure*.
      *   The PoI is not "wrong," but it requires a specific *space* of possibilities to be applied to. Without specifying the *method of selection*, the word "probability" has no meaning.
  *   **Misconception Interception #3 (PoI is Simply Wrong):**
      *   *Predicted Error:* "So we just shouldn't use the Principle of Indifference ever."
      *   *Defuse:* Clarify that PoI is valid *within* a defined parameterization. It fails here because we tried to apply it to the *problem* rather than the *parameter*. "The tool works, but we didn't specify which tool to use."

  #### Phase 5: Assessment & Wrap-Up (0:38–0:45)
  *   **Concept:** Verify deep understanding.
  *   **Activity:** Open floor for questions.
  *   **Final Assessment Question:** (See below).

  ---

  ### Final Assessment Question
  Do not ask them to calculate a probability. Ask them to diagnose the source of the conflict.

  **Pose this exact question:**
  > "If I tell you I selected a number $x$ randomly between 0 and 1, the probability that $x < 0.5$ is 50%. But if I tell you I selected a number $y$ randomly between 0 and 1, and then set $x = y^2$, the probability that $x < 0.5$ is roughly 70%. Since $x$ is still a number between 0 and 1 in both cases, why did the probability change even though the range of possible outcomes didn't?"

  **Correct Understanding:**
  They should answer that **changing the variable (parameterization) changes the distribution of density.** In the context of the lesson: "Because 'randomly' describes *how* we got the number, not just the set of numbers we can get. In the straw problem, 'random chord' describes a set, but not the *process* that fills that set."

  **Signs of Failure:**
  If they answer, "Because the math is different," or "Because one is squared," they have missed the philosophical point. You want them to identify that **ignorance must be parameterized.**
