          *   *Critique:* This is good, but needs tuning. If it's just "shipping code," it sounds like an arms race (who ships more features). It needs to be about *locking in a contract* that forces the other to adapt.
          *   *Refinement:* Team A and Team B both need to change `UserService`. If Team A merges their schema change first, Team B *must* rewrite their integration to match A. If B merges first, A must rewrite to match B. Both rewrite costs are high. Both rush to merge before checking if the other is working on it. Result: Merge conflicts, broken prod, or double work.
          *   *Must Have:* Irreversibility (once merged, hard to revert), Asymmetric Cost (adapting is harder than setting), Visibility (they can see the PR).
          *   *Must Not Have:* Malice (they aren't enemies), Resource Scarcity (it's not about CPU cycles).

