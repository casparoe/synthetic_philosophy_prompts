          *   2. The Mechanism (Credibility). Why couldn't they just stop? Because "I'll stop" isn't believable.
          *   3. The Race (Timing). The incentive to move *before* thinking.
          *   4. The Outcome (Value Destruction). Everyone loses value, not just one winning.
