      *   **Misconceptions & Killing Them:**
          *   *Objection 1: "Isn't this Prisoner's Dilemma?"* (Early, after defining the game).
              *   *Kill:* PD is about hidden info/trust. This is about *visible* locking. In PD, you defect secretly. Here, you shout "I'm doing it!" to force them to yield.
          *   *Objection 2: "Just talk to each other."* (Mid, after describing the rush).
              *   *Kill:* Talking takes time. In a commitment race, time = loss of leverage. If I stop to talk, you merge your PR.
          *   *Objection 3: "So one side should just slow down."* (Late, near solution).
              *   *Kill:* If you slow down, you become the follower forever. It punishes the cooperative actor. The *system* needs to change, not the individual.

      *   **Closing Question:**
          *   Needs to test *timing*.
          *   *Idea:* "If we add a 24-hour review period on shared APIs, does that fix it?"
          *   *Better:* "If we make it easier to revert code, does the race stop?" (Yes, because commitment loses credibility).
          *   *Best:* "What specific process change makes saying 'I'm working on this' as binding as merging the code?"

      *   **What to Refuse:**
          *   Don't get into Game Theory math (Nash Equilibria).
          *   Don't solve specific interpersonal conflicts (therapy).
          *   Don't debate "Who was right" in past incidents.

      *   **Takeaway:**
          *   Needs to be punchy.
          *   "Don't burn bridges to win arguments."
          *   "Make commitments reversible."
          *   "Speed without coordination is debt."
          *   *Selection:* "Make your commitments reversible until coordination is complete."

