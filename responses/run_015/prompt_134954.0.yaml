answer: |-
  Here is the plan for your 30-minute session.

  ### 1. The One Example
  **Verdict:** The API example is correct, but it is fragile. If you describe it as "shipping features," they will hear "Arms Race." You must describe it as "locking a contract."

  *   **What it MUST have:**
      *   **A Shared Surface:** A schema, interface, or library that both teams import.
      *   **Breaking Change:** The change forces the *other* team to rewrite code to accommodate. (Additive changes do not create a race).
      *   **Visibility:** Both teams can see the PR/branch activity (e.g., via GitHub/GitLab).
      *   **Irreversibility:** Once merged, reverting is painful (data migration, downstream dependencies).
  *   **What it MUST NOT have:**
      *   **Malice:** Neither team wants to hurt the other; they just want to ship their OKR.
      *   **Resource Scarcity:** It's not about who gets the CPU cycles; it's about who sets the standard.
      *   **Secret Work:** If the work is hidden, they can't race to commit.

  **How to draw it:** Draw two sticks (Team A, Team B) pushing against a shared box (The API). If A pushes the box their way, B has to rebuild their stick to fit. If B pushes first, A rebuilds. If both push hard at once, the box breaks (Production Incident).

  ### 2. The Sequence (Order & Dependencies)
  Do not start with definitions. Start with the pain.

  1.  **The Credibility Prerequisite (Minutes 0–5):**
      *   *Draw:* A timeline. Show that a Jira ticket or a Slack message ("I'm working on this") costs nothing to ignore.
      *   *Point:* A threat/commitment is only real if it is costly to walk back. Code merged is credible; words are not.
      *   *Dependency:* You cannot explain the race until they accept that **only irreversible actions count as moves.**
  2.  **The Incentive (Minutes 5–10):**
      *   *Draw:* The Payoff Matrix.
      *   *Point:* If I commit first, you accommodate me (I win, you pay). If you commit first, I accommodate you (You win, I pay).
      *   *Dependency:* This only creates a race because the commitments are credible (from Step 1).
  3.  **The Race & Harm (Minutes 10–15):**
      *   *Draw:* The "Rush." Both teams skip design review and testing to merge first.
      *   *Point:* The harm isn't that A or B won. The harm is that both skipped safety checks to win the timing game. Value is destroyed by the *speed*, not the *choice*.
  4.  **The Solution (Minutes 15–25):**
      *   *Point:* We cannot rely on willpower. We must change the mechanics of commitment.

  ### 3. The Misconceptions (Kill Order)
  They will interrupt you. Here is when they will say it and how to shut it down.

  *   **Objection 1: "Isn't this just Prisoner's Dilemma?"**
      *   *When:* Immediately after you draw the Payoff Matrix (Minute 10).
      *   *The Kill:* "In Prisoner's Dilemma, you defect secretly to avoid punishment. In a Commitment Race, you shout your move publicly to *force* the other person to yield. PD is about hidden trust; this is about visible leverage."
  *   **Objection 2: "Why didn't they just talk to each other?"**
      *   *When:* After you describe the harm (Minute 15).
      *   *The Kill:* "Talking takes time. In this game, time is leverage. If I stop to talk, you merge your PR. The incentive structure punishes the person who pauses to coordinate."
  *   **Objection 3: "So one side should just slow down."**
      *   *When:* During the Solution phase (Minute 20).
      *   *The Kill:* "If you slow down, you become the permanent follower. Every time there is a conflict, you pay the adaptation cost. We need a system fix, not a martyr."

  ### 4. The Closing Question
  Do not ask "How can we cooperate?" That tests morality, not mechanics. Ask this:

  **"If we make reverting a merged PR take 5 minutes instead of 5 days, does the race stop?"**

  *   *Correct Answer:* **Yes.**
  *   *Why:* Because the commitment is no longer credible. If I can't burn the bridge behind me, you don't have to yield to me. We can afford to talk.
  *   *What it tests:* It proves they understand that **reversibility kills the incentive to rush.**

  ### 5. What to Refuse
  Do not let the discussion drift into these traps. You will run out of time.

  *   **Game Theory Math:** Refuse to draw Nash Equilibria or write equations. Keep it on the whiteboard as boxes and arrows.
  *   **Specific Blame:** If someone says, "Like what Team Checkout did last sprint," shut it down. "We are discussing mechanics, not incidents."
  *   **Interpersonal Therapy:** If it becomes about "Team A doesn't respect Team B," pivot back to process. "Assume both teams are rational and well-intentioned. The system is rewarding the wrong behavior."

  ### 6. The Takeaway
  Takeaway: **"Make commitments reversible until coordination is complete."**
