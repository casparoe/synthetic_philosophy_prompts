          *   *Option B (Judy Benjamin/Protocol):* It depends on *why* she said that.
              *   *Protocol 1:* She reports "If E then S" only if she is in SE. (Then P(SE)=1).
              *   *Protocol 2:* She reports "If E then S" whenever she is *not* in NE. (Then P(NW)=1/3, P(SE)=1/3, P(SW)=1/3).
              *   *Protocol 3:* She reports "If E then S" whenever she is in the South (SE or SW). (Then P(SE)=1/2, P(SW)=1/2).
