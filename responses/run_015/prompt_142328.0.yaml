  # Session Design: The Black Box Protocol

  **Re-skin:** The 4-Node Cluster.
  **Time:** 50 Minutes.
  **Props:** 4 printed "Codebooks" (one per group), 20 poker chips (or candy) per person, whiteboard.

  ## 1. The Setup (0:00–0:05)

  **The Story:**
  "We have a distributed job stuck in one of four nodes: **NW, NE, SW, SE**. Prior probability is uniform (25% each). You are the on-call engineer. You receive *one* alert message. Your job is to decide where to send the debugger. You have 20 chips to 'insure' your guess."

  **The Betting Mechanism (The Insurance Market):**
  *   **Rule:** "Buy insurance on each node. **1 Chip buys 5% coverage.** If that node wins, **you get 100 chips back.**"
  *   **Why this works:** If you think a node has a 50% chance, buying 50% coverage (10 chips) costs 10 and has an expected return of 50. Buying 100% coverage (20 chips) costs 20 and has an expected return of 50. You maximize expected profit by buying coverage exactly equal to your true belief.
  *   **One-liner:** "You maximize your expected payout by buying insurance proportional to your true odds."

  **Facilitator Script:**
  > "You're in four groups. You all get the same alert message. You *don't* get the same manual for how the alert system works. That manual is in your envelope. Do not show it to other groups. Calculate your odds, buy your insurance. Highest net profit wins the trophy."

  ## 2. The Groups & Codebooks (0:05–0:20)

  Hand out the envelopes. Each contains the **Message** and the **Protocol** (The Codebook).

  *   **Group 1 (The Elimination):**
      *   **Message:** `ALERT: Node is NOT NE.`
      *   **Protocol:** "The monitoring script checks the node location. If the node is **NOT NE**, it sends this message. If the node IS NE, it sends nothing (or a different message you didn't receive)."
      *   **Math:** $P(Msg|NW)=1, P(Msg|SW)=1, P(Msg|SE)=1, P(Msg|NE)=0$.
      *   **Correct Update:** NW=33%, SW=33%, SE=33%. (Mass of NE redistributed equally).

  *   **Group 2 (The Conditional):**
      *   **Message:** `ALERT: IF Node is East, THEN Node is South.`
      *   **Protocol:** "The monitoring script checks the node location. If the statement 'If East then South' is **TRUE** (i.e., Node is NOT NE), it sends this message. If FALSE, it sends nothing."
      *   **Math:** Logically equivalent to Group 1. $P(Msg|NW)=1, P(Msg|SW)=1, P(Msg|SE)=1, P(Msg|NE)=0$.
      *   **Correct Update:** NW=33%, SW=33%, SE=33%.
      *   **Goal:** Someone notices Group 1 and 2 have the same numbers.

  *   **Group 3 (The Specific):**
      *   **Message:** `ALERT: IF Node is East, THEN Node is South.`
      *   **Protocol:** "The monitoring script is buggy. It only sends this specific message if the node is **SE**. In all other cases, it sends a different message (e.g., 'System OK' or 'Critical Fail')."
      *   **Math:** $P(Msg|SE)=1$, all others 0.
      *   **Correct Update:** SE=100%.
      *   **Goal:** Same message as Group 2, totally different belief.

  *   **Group 4 (The Noise):**
      *   **Message:** `ALERT: IF Node is East, THEN Node is South.`
      *   **Protocol:** "The script sends this message if the node is **SE**. However, there is a **20% chance** the radio glitches and sends this message regardless of the node."
      *   **Math:** $P(Msg|SE)=1.0$, $P(Msg|Others)=0.2$.
      *   **Correct Update:**
          *   Likelihoods: SE=1.0, NW=0.2, SW=0.2, NE=0.2.
          *   Sum = 1.6.
          *   SE = 1/1.6 = 62.5%. Others = 12.5% each.
      *   **Goal:** Shows how reliability degrades certainty without eliminating options.

  ## 3. The Reveal & Conflict (0:20–0:35)

  1.  **Betting:** Groups place their chips on the whiteboard grid (drawn 2x2).
  2.  **The Truth:** You (Facilitator) reveal the "True Location" was **SE** (pick one that keeps the game interesting, SE is best because Group 3 wins big, Group 4 wins okay, Groups 1&2 win modest).
  3.  **The Payout:** Calculate winnings. Group 3 will have a massive stack. Groups 1 & 2 will have moderate stacks.
  4.  **The Confrontation:**
      *   Ask Group 2: "Why did you split 33/33/33?" (They'll say: "It rules out NE.")
      *   Ask Group 3: "Why did you go 100% SE?" (They'll say: "Our manual said it only speaks if we're in SE.")
      *   **The Pivot:** "You received the *exact same string of text*. Why did Group 3 clean up the trophy while Group 2 barely broke even?"

  ## 4. The Debrief (0:35–0:45)

  **Do Not Say:** "Judy Benjamin," "Likelihood Ratio," "Conditional Probability."
  **Do Say:** "Log Lines," "Code Paths," "Observability."

  **Mapping the Moments:**
  1.  **Groups 1 & 2 Matching:** "Semantic equivalence. Logically, 'Not NE' and 'If E then S' rule out the same state. If the *generator* is the same, the belief is the same."
  2.  **Group 3 Diverging:** "The message didn't change. The *generator* changed. A log line saying `Error: Timeout` means something different if it comes from the Retry Loop vs. the Initial Handshake."
  3.  **Group 4 (Noise):** "Real life is Group 4. We rarely know the protocol perfectly. We have to estimate the false-positive rate. That uncertainty is why we never bet 100%."

  **The "Right Answer" Objection:**
  *   *Participant:* "So which update was actually correct?"
  *   *You:* "In this room, the Codebook was reality. In production, the Codebook is the source code. If you don't read the source code, you're just guessing what the log line means."

  ## 5. The "Belief" Variant (0:45–0:50)

  *Warning: This is abstract. Only run if energy is high.*

  **Setup:** "New scenario. You are the node. You get a message about *your own belief*."
  **Message:** `ALERT: After processing this message, your confidence in 'West' will be > 60%.`
  **Task:** "What is your confidence in 'West' *now*?"

  **The Trap:**
  *   If you trust the message, you must believe West > 60% *now* (because the message says you will).
  *   If you believe West > 60% now, the message is true.
  *   **The Point:** "Sometimes the data isn't about the terrain; it's about the sensor. In logging, this is a health check on the logger itself. If a service logs 'I am lying', do you believe it? It's the same machinery: updating on information about the updater."

  **If it collapses:** If they stare blankly, cut it. Say: "Sometimes the log line is about the logging service, not the app. Same math, weirder loop."

  ---

  # Facilitator Cheat Sheet

  ### What to Shut Up About
  *   **Do not write formulas on the board.** If they ask for Bayes' Rule, say: "Use the codebook. Count the worlds where the message speaks."
  *   **Do not confirm answers during the work phase.** If asked "Is this right?", say: "Does your codebook support it?"
  *   **Do not use the word "Protocol" until the debrief.** Call it "The Manual" or "The Script."

  ### Predicted Failure Modes
  1.  **The Logic Puzzle:** Groups 1 & 2 treat it as pure logic and ignore the protocol instructions.
      *   *Fix:* During the work phase, circulate and ask: "If you were in NW, would the script speak?" Force them to simulate the generator.
  2.  **The Spite Split:** Someone puts 5 chips on each square to "game" the system or avoid being wrong.
      *   *Fix:* The Insurance Mechanism punishes this. Remind them: "Spreading chips costs you expected value."
  3.  **The Noise Group Confusion:** They try to average the other groups' answers.
      *   *Fix:* Remind them: "Your manual has a percentage in it. Use it."
  4.  **The "Right Answer" Demand:** Someone demands to know the ground truth of the Judy Benjamin problem outside the game.
      *   *Fix:* "There is no ground truth without a generator. That's the point. In incident review, if you don't know *why* the log was written, the log is noise."

  ### Structural Limitations (The Honest Part)
  **What this game cannot show:**
  In the game, I *gave* you the Codebook. You knew the protocol.
  In real engineering, **you do not have the Codebook.** You have to infer the protocol from the logs themselves, or from reading code you don't understand, or from asking a teammate who left three years ago.
  The real hard problem isn't updating on a known protocol; it's **inferring the protocol from the data.** This game solves the easy half so you can feel the weight of the hard half.

  ### Worked Numbers (For your sanity check)

  | Group | Message | Protocol Condition | Likelihoods (NW, NE, SW, SE) | Posterior (NW, NE, SW, SE) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1 (Elimination)** | Not NE | True if Not NE | 1, 0, 1, 1 | 33%, 0%, 33%, 33% |
  | **2 (Conditional)** | If E then S | True if Not NE | 1, 0, 1, 1 | 33%, 0%, 33%, 33% |
  | **3 (Specific)** | If E then S | True ONLY if SE | 0, 0, 0, 1 | 0%, 0%, 0%, 100% |
  | **4 (Noise)** | If E then S | SE=100%, Others=20% | 0.2, 0.2, 0.2, 1.0 | 12.5%, 12.5%, 12.5%, 62.5% |

  *Note: For Group 4, Sum of Likelihoods = 1.6. SE = 1.0/1.6 = 0.625. Others = 0.2/1.6 = 0.125.*

  ### Closing Variant Viability
  The "Belief" variant is viable but risky. It works best if you frame it as **"Meta-Monitoring."**
  *   *Say:* "Imagine a log line that says `WARN: Confidence in DB_Latency metric is low`."
  *   *Ask:* "Do you trust the latency metric?"
  *   *Point:* "You just updated on a statement about your own update. That's all the Conditional Message was. It was metadata about the radio operator, disguised as geography."
  *   *If it drags:* Cut it at 2 minutes. Don't force the paradox.
