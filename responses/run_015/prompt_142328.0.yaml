      *   **Message:** `IF Node > B THEN Status == DOWN`. (Rules out Node C, assuming B < C). Let's use Quadrants NW, NE, SW, SE. Message: "If East, Then South". Rules out NE.
      *   **Groups:**
          1.  **Direct:** "Not NE". (Protocol: Say if Not NE).
          2.  **Conditional:** "If E then S". (Protocol: Say if Not NE). *Matches Group 1.*
          3.  **Specific:** "If E then S". (Protocol: Say ONLY if SE). *Diverges.*
          4.  **Noisy:** "If E then S". (Protocol: Say if SE, 20% false positive). *Diverges.*
      *   **Betting:** Insurance Market.
      *   **Debrief:** Logging branches.
      *   **Variant:** Belief message.

      *Wait, one detail:* "One group gets a straight yes/no version... Another group gets the plain non-conditional message... I do *not* want anyone told in advance that those two come out the same."
      *   If I give them the *same protocol*, they get the same result.
      *   If I give them *different protocols*, they get different results.
      *   To make the point "Conditional == Elimination", they need the *same protocol*.
      *   To make the point "Protocol Matters", they need *different protocols*.
      *   I will give Group 1 and 2 the *same* protocol (Report if True). They will find they match.
      *   Group 3 gets a different protocol. They will find they differ.
      *   This satisfies the "Wait, those are the same" discovery for Groups 1 & 2, and the "Wait, why are we different?" for Group 3.

      *Let's refine the "Belief Variant".*
      *   Message: "After hearing this, your credence in West > 60%."
      *   If I trust the message, I must update West > 60%.
      *   Does this create a paradox? If West was 25% prior. Message says "You will believe West > 60%".
      *   If I believe the message, West must be > 60%.
      *   This works as a "Fixed Point" example.
      *   I'll include it but flag it as "Weird".

      *Facilitator "Shut Up" List:* Crucial. Don't explain Bayes. Don't explain "screening off". Let them struggle with the codebook.

      *Failure Modes:* "Which is right?" -> "The codebook is the reality."

      *Structural Limit:* We gave them the codebook. In real life, we don't have it. That's the real hard problem.

      *Ready to write.*
