      *   **Section 1: The Skeptic and the Rule.** Uses the "2, 4, 6..." example. Introduces "quadd" (usually "quus" in Kripke, but "quadd" works for addition). Explains the problem of finite evidence vs. infinite rule. Dismisses mental states, images, and dispositions. Concludes: No fact of the matter.
      *   **Section 2: The Skeptical Solution.** Shifts from truth conditions to assertability conditions. Community agreement establishes correctness. Isolated individual (Crusoe) cannot mean anything determinately.
