answer: |-
  The institutional practice of binarising non-coding DNA into 'functionally constrained' (adaptive/purifying selection) and 'neutral' (drift/junk) reveals a profound, often unacknowledged, philosophical commitment to **pan-selectionism**. This classification system presupposes that evolutionary persistence is adequately explained by a dichotomy: a sequence is either maintained because it contributes to fitness (selected effect) or it persists because selection does not care about it (neutrality). By omitting a category for sequences that are structurally indispensable yet adaptively arbitrary—true Gould-Lewontin spandrels—contemporary genomics implicitly adopts an ontology that conflates *conservation* with *adaptation*.

  ### Reconstructing the Implicit Theory

  The implicit theory underpinning current annotation protocols can be reconstructed as follows:

  1.  **Premise 1:** Evolutionary change is driven primarily by natural selection acting on heritable variation, or by random genetic drift.
  2.  **Premise 2:** If a genomic sequence exhibits significant conservation across phylogeny (constraint), it is because mutations in that region are deleterious.
  3.  **Premise 3:** If a mutation is deleterious, it is because the sequence performs a function that enhances organismal fitness.
  4.  **Conclusion:** Therefore, all conserved non-coding sequences possess adaptive significance (selected-effect function).

  This logic entails that all persistent biological structures must either carry adaptive significance or be causally inert regarding fitness. Consequently, it rules out *a priori* the possibility that a sequence can be developmentally entrenched and evolutionarily stable *without* having been selected for its specific contribution to fitness. In this framework, a spandrel cannot exist as a stable category. If a spandrel is conserved because it is physically coupled to an adaptive trait, the binary classification forces it into the 'functionally constrained' bucket. This misidentifies the *cause* of its persistence. It is not preserved because selection favours the spandrel itself; it is preserved because selection favours the arch, and the spandrel is the necessary geometric consequence of the arch's construction. The current ontology treats the by-product as if it were the target of selection.

  ### Strict Requirements vs. Comfortable Fits

  It is crucial to distinguish what the practice of genomic annotation *strictly requires* from what merely *fits it comfortably*.

  **Strictly Required:**
  Methodologically, the practice requires only the detection of **mutational constraint**. Algorithms such as phyloP or phastCons measure the rate of substitution relative to a neutral expectation. Strictly speaking, these metrics demonstrate only that a sequence is resistant to change. They do not, in themselves, demonstrate *why* the sequence is resistant. A sequence could be resistant to mutation because it codes for a vital protein (adaptive), or because it is physically inaccessible to mutagenesis due to chromatin packing (structural), or because it is linked to a vital gene and cannot be recombined away (hitchhiking). The data strictly supports 'constraint', not 'adaptive function'.

  **Fits Comfortably:**
  The interpretation of constraint as adaptive function fits comfortably within the prevailing **adaptationist programme**. It aligns with the heuristic of 'reverse engineering', where the biologist assumes every feature is a solution to a design problem. This fits comfortably because it justifies research funding: proposing that a conserved element has a 'function' implies a discoverable mechanism benefiting the organism, whereas proposing it is a 'structural inevitability' sounds less like a biological discovery and more like a geometric tautology. The binary classification is maintained not because the data demands it, but because the narrative of adaptation is institutionally and cognitively preferred.

  ### Compatibility with a Robust Spandrel-Based View

  The current practice is **incompatible** with a robust spandrel-based view of genome architecture. A robust spandrel view, following Gould and Lewontin, insists that organisms are integrated wholes where changes in one part necessitate changes in others, regardless of the adaptive value of those secondary changes.

  In genomics, this manifests in phenomena such as:
  *   **Chromatin Architecture:** Certain non-coding regions may be conserved not because they bind transcription factors, but because they serve as nucleation points for chromatin folding that is physically required to package DNA of a certain length.
  *   **Transcriptional Noise:** Some transcription may be a necessary by-product of open chromatin states required for neighbouring genes, rather than a selected function of the transcript itself.

  Under the current binary, these elements are misannotated. If they are conserved, they are labelled 'functional' (implying adaptation). If they vary, they are labelled 'neutral' (implying insignificance). The category of 'structurally necessary but adaptively arbitrary' is erased. The system cannot accommodate the idea that the genome is partly a record of historical and physical constraints, rather than solely a catalogue of optimised solutions.

  ### Necessary Changes in Protocols and Funding

  If evolutionary biology were to take Gould and Lewontin's critique seriously as an organising principle, rather than a marginal exception, significant shifts in annotation protocols and funding criteria would be required.

  **1. Annotation Protocols: A Tripartite Ontology**
  Databases such as ENCODE or RefSeq would need to expand their ontology beyond 'Functional' and 'Non-functional'. A third category, perhaps **'Architecturally Constrained'** or **'Developmental By-product'**, must be introduced.
  *   **Selected-Effect Function:** Sequences conserved due to direct fitness benefits (e.g., enhancers, silencers).
  *   **Causal-Role Constraint:** Sequences conserved due to physical, chemical, or developmental necessities that are not themselves targets of selection (e.g., spacing required for nucleosome positioning, by-products of replication machinery).
  *   **Neutral:** Sequences evolving under drift.

  This distinction mirrors the philosophical difference between Millikan's 'selected-effect function' and Cummins' 'causal-role function'. Annotation would need to specify whether the 'function' is the *reason* for the sequence's existence or merely a *consequence* of its existence.

  **2. Funding Criteria: Legitimising Non-Adaptive Explanations**
  Currently, grant proposals often require a hypothesis of utility. To accommodate spandrelism:
  *   **Hypothesis Requirements:** Funding bodies (e.g., the BBSRC, Wellcome Trust, NIH) must accept hypotheses that posit non-adaptive explanations for conserved structures. A proposal should be fundable if it aims to demonstrate that a conserved element is a structural inevitability rather than an adaptive tool.
  *   **Research Focus:** There should be dedicated streams for 'Evolutionary Constraints' and 'Genomic Architecture' that do not presuppose fitness benefits. Research into the physical limits of DNA packing, the thermodynamic constraints of folding, and the developmental coupling of genomic regions would be valued equally with research into gene regulation networks.
  *   **Negative Results:** Publishing and funding must better accommodate the finding that a conserved element has *no* specific adaptive function. Currently, failing to find a function for a conserved element is often viewed as a failure of the method, rather than a valid biological conclusion supporting the spandrel hypothesis.

  ### Conclusion

  The binary classification of non-coding DNA presupposes a philosophical commitment to adaptationism that conflates evolutionary persistence with adaptive utility. While the methods strictly measure only mutational constraint, the institutional interpretation comfortably assumes selected-effect function. This effectively rules out the existence of stable, non-adaptive spandrels *a priori*. To align with a more nuanced evolutionary theory, genomics must adopt an ontology that distinguishes between selection for a trait and selection for a structure that necessitates the trait. This requires not merely a change in vocabulary, but a fundamental shift in what constitutes a valid biological explanation, moving from a teleological search for purpose to a structuralist analysis of constraint.
