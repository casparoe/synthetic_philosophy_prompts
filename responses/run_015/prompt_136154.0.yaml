prompt: |-
  Consider the institutional practice in contemporary evolutionary genomics of annotating every non-coding DNA sequence as either 'functionally constrained'—and therefore presumed to be under purifying selection serving some adaptive or at least selectively maintained purpose—or 'neutral'—treated as evolutionary noise free to accumulate mutations without phenotypic consequence. There is no standard database category for sequences that are structurally indispensable yet adaptively arbitrary in precisely the Gould-Lewontin sense: architectural spandrels that exist not because selection favoured them, but because they are necessary by-products of other developmental or genomic structures. What philosophical commitments about evolutionary explanation does this binary classification presuppose? Reconstruct the implicit theory: does it entail that all persistent biological structures must either carry adaptive significance or be causally inert, and does it therefore rule out a priori the possibility that non-adaptive spandrels can be developmentally entrenched and evolutionarily stable? Distinguish what the practice strictly requires from what merely fits it comfortably, assess whether it is compatible with a robust spandrel-based view of genome architecture, and describe what would have to change in annotation protocols and funding criteria if evolutionary biology took Gould and Lewontin's critique seriously as an organising principle rather than as a marginal exception. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The institutional practice in contemporary evolutionary genomics of annotating non-coding DNA as either 'functionally constrained' (adaptive/purifying selection) or 'neutral' (evolutionary noise).
      *   **Problem:** There is no category for 'structurally indispensable yet adaptively arbitrary' sequences (Gould-Lewontin spandrels).
      *   **Questions to Address:**
          *   What philosophical commitments does this binary classification presuppose?
          *   Reconstruct the implicit theory (does it entail persistent structures must be adaptive or inert?).
          *   Does it rule out *a priori* non-adaptive but developmentally entrenched spandrels?
          *   Distinguish what the practice *strictly requires* vs. what *fits comfortably*.
          *   Assess compatibility with a robust spandrel-based view.
          *   Describe necessary changes in annotation protocols and funding criteria if Gould and Lewontin's critique were an organising principle.
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Binary Classification (Constrained vs. Neutral):**
      *   *Functionally Constrained:* Implies conservation due to purifying selection. Usually equated with "function" in the selected-effect sense (Millikan, Neander).
      *   *Neutral:* Implies drift, no fitness consequence, junk DNA.
      *   *The Gap:* Where does a sequence fit if it is conserved (not neutral) but not because it was *selected for* its specific contribution to fitness, but rather because it is a by-product of something else that *is* selected for, or due to structural/developmental necessity (constraint in the physical sense, not the evolutionary sense)?
      *   *Philosophical Commitment:* Adaptationism. The assumption that conservation equals adaptive function.

  3.  **Reconstruct the Implicit Theory:**
      *   *Premise 1:* Evolutionary persistence implies a cause.
      *   *Premise 2:* The only relevant causes are Natural Selection (adaptive) or Drift (neutral/non-functional).
      *   *Conclusion:* If it persists and isn't drifting, it must be adaptive.
      *   *Does it rule out spandrels?* Yes, effectively. If a spandrel is conserved because it's structurally linked to an adaptive trait, the binary forces it into the 'constrained' bucket, thereby mislabeling it as 'adaptive' in the selected-effect sense. Or, if it's not conserved enough, it goes to 'neutral'. There's no middle ground for "conserved non-adaptive structural necessity."

  4.  **Distinguish 'Strictly Requires' vs. 'Fits Comfortably':**
      *   *Strictly Requires:* The methods (e.g., dN/dS ratios, phyloP scores) measure conservation. They detect *constraint* (lack of change). They do not directly measure *adaptation* (fitness benefit). However, the *interpretation* often conflates constraint with adaptation. Strictly, the data only shows resistance to mutation.
      *   *Fits Comfortably:* Adaptationism fits comfortably because it provides a ready-made narrative. It aligns with the "Pan-selectionist" view. It simplifies grant writing (everything has a purpose).
      *   *Nuance:* One *could* technically annotate something as 'constrained' without claiming it's adaptive, but the institutional language ('functional element') strongly implies selected effect.

  5.  **Assess Compatibility with Spandrel View:**
      *   Current practice is largely incompatible. It treats 'constraint' as a proxy for 'selected function'. A spandrel is constrained (you can't remove the arch without collapsing the ceiling) but not selected *for* itself. The current ontology collapses this distinction.

  6.  **Describe Necessary Changes (Annotation & Funding):**
      *   *Annotation:* Need a third category. 'Structurally Coupled', 'Developmental By-product', or 'Architectural Constraint'. Distinguish 'Selected Effect Function' from 'Causal Role Function' (Cummins).
      *   *Funding:* Stop requiring a hypothesis of adaptive utility for every conserved element. Fund research into developmental constraints, physical limits of DNA packing, chromatin architecture, etc., without needing to prove a fitness benefit for every base pair. Shift from "What is this gene for?" to "How did this structure arise?"

  7.  **Drafting the Response (incorporating British English):**
      *   *Spelling:* Organising, favoured, colour (if applicable), analyse, programme.
      *   *Tone:* Academic, philosophical, rigorous.
      *   *Structure:*
          1.  Introduction: Define the binary and the problem.
          2.  Philosophical Commitments: Adaptationism, Selected-Effect vs. Causal Role.
          3.  Implicit Theory Reconstruction: The False Dichotomy.
          4.  Strict Requirement vs. Comfortable Fit: Methodological vs. Interpretative.
          5.  Compatibility Assessment: Incompatible with robust spandrelism.
          6.  Proposed Changes: Ontological and Institutional.
          7.  Conclusion.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I must be careful not to say genomics *ignores* constraints. They talk about 'mutational constraint'. But they equate 'mutational constraint' with 'functional importance' in the adaptive sense. I need to highlight this conflation.
      *   *Gould & Lewontin:* Ensure I reference the 'Spandrels of San Marco' argument correctly. It's about the fallacy of reverse engineering.
      *   *British English Check:* Ensure 's' instead of 'z' in organisational/analysing, 'favour' not 'favor', 'programme' not 'program'.

  9.  **Final Polish:** Check against all parts of the prompt.
      *   Philosophical commitments? Yes (Adaptationism).
      *   Implicit theory reconstructed? Yes (Persistence = Selection or Noise).
      *   Rule out a priori? Yes.
      *   Strictly requires vs. fits comfortably? Yes.
