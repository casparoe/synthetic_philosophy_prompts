  Crucially, this process relies on a *temporal horizon mismatch*. Board members operate on quarterly or annual cycles (balance sheets, enrollment numbers), while the institution's telos operates on generational cycles. The micro-decisions solve short-term friction, but the cumulative friction heat burns away the long-term purpose. There is no moment of silence where the mission is rejected; rather, the mission is slowly rendered irrelevant by the noise of administration. The institution becomes a shell that retains the name and legal structure of the original entity but functions as a different organism entirely. This is not a failure of ethics, but a failure of *temporal integration* within the governance structure. The language of the institution remains static ("we support poetry"), while the referent shifts silently ("poetry" now means "marketable verse"). Actors justify changes using the vocabulary of stewardship, masking the erosion as preservation.

