      *   *The "Diagonalisation" Question:* Is there a formal result showing the analysis must fail? Not strictly logical diagonalisation, but something akin to the "Open Texture" of concepts or the "Context Sensitivity" of conditionals. The problem is that the *ceteris paribus* clause inevitably smuggles in the disposition or a causal notion, making the analysis non-reductive.
      *   *Key Insight:* The debate isn't about the truth of the biconditional (almost everyone accepts the conditional is *true* if properly qualified). It's about *reduction*. Can the RHS be stated *without* dispositional/causal vocabulary? If not, the project fails as a reductive analysis but might succeed as an elucidation.

  4.  **Formulate the Diagnosis:**
      *   **Diagnosis 1: Category Mistake (Grounding vs. Analysis).** The user suspects this ("truth of a disposition ascription... grounds the truth"). This is the strongest lead. The conditional analysis tries to define the *meaning* (or identity) of the property via its manifestation. But the property *grounds* the conditional, it isn't *identical* to it. Finks and masks show that the connection is contingent/causal, not logical/semantic.
      *   **Diagnosis 2: The Reductionist Impasse.** The project was born of Humean empiricism (reduce powers to regularities/conditionals). If you are a Humean, you *must* fix the analysis. If you are an Anti-Humean (Aristotelian), the analysis is doomed because powers are real. The stalemate is a clash of broader metaphysical frameworks, not local counterexamples.
      *   **Diagnosis 3: Context Sensitivity.** The "right conditions" clause is infinitely context-sensitive. There is no finite list of interferers. This makes a strict biconditional impossible without a "no interferers" clause that implicitly references the disposition itself.

  5.  **Determine What Counts as Progress:**
      *   *Retire the Reductive Project:* Acknowledge that a non-dispositional analysis is impossible (Bird's argument).
      *   *Shift to Grounding:* Accept the conditional is true *in virtue of* the disposition + basis + laws. Focus on the metaphysics of the basis (categorical vs. dispositional).
      *   *Formal Result:* The "No Interferers" clause inevitably leads to circularity if one demands non-dispositional vocabulary. This is the "diagonalisation" the user asked for. It's not a Gödelian proof, but a semantic one: you cannot specify the "normal conditions" without referencing the causal role of the property.
