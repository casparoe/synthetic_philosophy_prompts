prompt: |-
  i work in site reliability at a mid-size company and a lot of my week is incident reviews. Almost every postmortem we write ends up naming something nobody did as the root cause: nobody rotated a cert, nobody updated the runbook, nobody put an alert on that queue. I've also messed around with causal DAGs and the do() notation enough to be dangerous — I can read a graph, I know the difference between conditioning on X and intervening on X, but that's about where it stops.

  I found out recently that philosophers argue about whether an omission — a thing that didn't happen — can be a cause at all, and that some of them say no, because causes are events and there's no event of not watering the plant. I'd like that whole debate restated as honestly as possible in the only vocabulary I'm fluent in: nodes, edges, do(), counterfactuals over a structural model, config defaults, alerts that fire and alerts that don't.

  The cases I want you to run through it, because my team argues about them every week: (1) a missed step — the runbook says rotate the cert monthly, nobody did, cert expired, site down; (2) a default nobody chose — the load balancer timeout ships as 60s, no one ever set it, and that's why the retry storm cascaded; (3) an unsent signal — no alarm existed on queue depth, so nobody knew, so nothing got done; (4) the one that feels weirdest — the bad deploy didn't go out because the release manager was on a flight and couldn't approve it, so somebody's not-doing-something seems to be what saved us.

  Then the residue report: which of these go into a DAG plus do() cleanly, which only go in if you cheat (inventing a node for something that didn't happen, or treating a shipping default as if someone had chosen it), and which won't go in at all. My hunch is that my framework can't even say "that's an omission" unless something outside the graph tells it what was supposed to happen, which is why we keep dragging runbooks into postmortems. If that's right — is it a bug in the toolkit, or is the philosophers' problem with omissions actually a problem about norms wearing a costume? Is there anything left over that the graph still can't say even after I bolt on a "what the runbook said" node? Also: our review template says only name causes the team could have acted on. That rule feels seperate from the causal question but I can't say why — where does it sit relative to what they're arguing about?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Site Reliability Engineer (SRE) at a mid-size company.
      *   **Expertise:** Fluent in causal inference terminology (DAGs, $do()$, counterfactuals, structural causal models - SCMs). Familiar with postmortems/incident reviews.
      *   **Problem:** Postmortems constantly cite "omissions" (nobody did X) as root causes. Philosophers debate whether omissions are causes. The user wants this debate translated into their native vocabulary (graphs, interventions, SCMs).
      *   **Specific Cases to Analyze:**
          1.  Missed step (cert rotation).
          2.  Default setting (LB timeout).
          3.  Unsent signal (missing alert).
          4.  Preventive omission (release manager on flight stopped bad deploy).
      *   **Residue Report:** Which fit the DAG/$do()$ framework cleanly? Which require "cheating"? Which don't fit?
      *   **Core Question:** Is the difficulty with omissions a bug in the causal toolkit, or is it about *norms*?
      *   **Secondary Question:** Where does the "actionability" rule (only name causes the team could have acted on) fit relative to the causal question?

  2.  **Deconstruct the Philosophical Debate into Causal Terms:**
      *   *Philosophical Claim:* Omissions aren't events. No event = no cause.
      *   *Causal Translation:* In an SCM, variables represent states or events. An "omission" is often a variable staying at a baseline value rather than transitioning to an active value.
      *   *The Conflict:* Causal models require a contrast. $Y$ happened because $X$ happened. If $X$ is "nothing happened," how do we model $do(X)$?
      *   *The Normative Layer:* We only call an omission a cause if there was an *expectation* (norm) that it *should* have happened. In SCM terms, this is an external constraint or a loss function, not part of the structural equations themselves.

  3.  **Analyze the Four Cases (Mental Draft):**

      *   *Case 1 (Cert Rotation):* Variable $C$ (Cert Status). $C=1$ (Valid), $C=0$ (Expired). Action $A$ (Rotate). $A=1$ (Did it), $A=0$ (Didn't). Outcome $D$ (Down).
          *   Graph: $A \rightarrow C \rightarrow D$.
          *   Counterfactual: If $do(A=1)$, then $C=1$, then $D=0$.
          *   Fit: Clean. $A=0$ is a valid state of the variable $A$.

      *   *Case 2 (LB Default):* Variable $T$ (Timeout). $T=60$ (Default). No human intervention $H$.
          *   Graph: $H \rightarrow T \rightarrow Cascade$.
          *   Issue: Did $H$ happen? No. So $H$ is a null event. Or is $T$ an exogenous variable?
          *   Fit: Requires defining the "choice" node even if the choice was "defer to default."

      *   *Case 3 (Missing Alert):* Variable $M$ (Monitoring Config). $M=0$ (Off). $A$ (Alert). $A=0$ (Silent). $R$ (Response). $R=0$ (None).
          *   Graph: $M \rightarrow A \rightarrow R \rightarrow Recovery$.
          *   Fit: Clean, provided $M$ is a variable. The "omission" is $M=0$.

      *   *Case 4 (Preventive Omission):* Bad Deploy $B$. Approval $K$. $K=0$ (No approval). $D$ (Deployed) = 0.
          *   Graph: $K \rightarrow D$.
          *   Counterfactual: If $do(K=1)$, then $D=1$ (Bad thing happens).
          *   Fit: This is "causation by prevention." $K=0$ caused $Bad=0$. It fits mathematically but feels weird linguistically.

  4.  **Address the "Residue Report" (Fit/Cheat/Fail):**
      *   *Clean:* Cases 1 & 3. Variables exist, states exist.
      *   *Cheating:* Case 2. Treating "no config" as a config choice. Requires a node for "Engineering Decision" that defaults to "None."
      *   *Weird but Valid:* Case 4. Causal model handles prevention fine ($do(K=1) \implies Disaster$).
      *   *The Real Issue:* The graph doesn't know which $do()$ operations are *reasonable*. The graph says $do(A=1)$ prevents failure. It doesn't say $A$ *should* have been 1. That's the Norm.

  5.  **Address the "Norms vs. Toolkit" Question:**
      *   The SCM describes *physics/logic* (if X, then Y).
      *   The Postmortem describes *responsibility* (X should have been done).
      *   The "omission" problem is actually a "deviation from expected baseline" problem.
      *   In SCM terms: We need a reference model $M_{norm}$ vs. the actual model $M_{actual}$.
      *   Conclusion: It's norms wearing a costume. The graph is agnostic; the SRE is not.

  6.  **Address the "Actionability" Rule:**
      *   Causal question: "Did $X$ cause $Y$?"
      *   Actionability question: "Can we intervene on $X$ in the future?"
      *   In Pearl's terms: Actionability is about the *feasibility* of $do(X)$, not just the existence of the edge.
      *   It sits *outside* the structural equations. It's a constraint on the set of allowable interventions.

  7.  **Drafting the Response (Iterative refinement for tone):**
      *   *Tone:* Professional, technical, empathetic to the SRE struggle, precise with causal notation.
      *   *Structure:*
          1.  Intro: Acknowledge the translation task.
          2.  The SCM Translation of "Omission": Define variables as states, not just events.
          3.  Case Studies: Walk through 1-4 with DAGs and $do()$.
          4.  Residue Report: Categorize them.
          5.  The Norms Question: Explain that graphs lack "should."
          6.  Actionability: Distinguish causal power from intervention feasibility.
      *   *Key Insight:* The "omission" is just a variable taking its baseline value. The "cause" label comes from comparing the actual world to a *normative counterfactual*, not just *any* counterfactual.

  8.  **Refining the Causal Notation:**
      *   Make sure to distinguish between exogenous variables ($U$) and endogenous ($V$).
      *   Use $do(X=x)$ clearly.
      *   Highlight where the "Runbook" enters the model (as a constraint on the baseline).

  9.  **Self-Correction/Edge Case Check:**
      *   *Case 4:* Make sure to clarify that $K=0$ causing *Safety* is causally valid, but usually we look for causes of *Failure*. This highlights the asymmetry in how we select causes (we look for what broke, not what held).
      *   *Case 2:* Emphasize that "Default" is a value of a variable, not the absence of a variable.
      *   *Philosophers:* Mention Hart & Honoré or Lewis briefly if needed, but keep it focused on the SRE vocab as requested. (Decided: Keep it strictly to SRE vocab as requested, maybe drop names to stay in character).
      *   *Actionability:* Connect this to "controllability" in control theory or feasible interventions in Pearl.

  10. **Final Polish:** Ensure the distinction between *causal sufficiency* and *blame assignment* is clear. The graph tells you what broke the system; the runbook tells you who was supposed to fix it.

  *(Self-Correction during drafting)*: I need to be careful not to say omissions *are* causes in the graph. I need to say the graph models the *state* that resulted from the omission. The "omission" is the *label* we apply to the transition from Expected State to Actual State.

  Let's write it.cw
answer: |-
  This is a translation of the philosophical "omission debate" into Structural Causal Models (SCMs).

  In philosophy, the debate is: *Is "nothing" an event?*
  In your vocabulary, the debate is: *Is a variable remaining at its baseline value a valid intervention target?*

  Here is the breakdown of your four cases, the residue report on where the DAG breaks, and the answer to why your "actionability" rule feels distinct.

  ---

  ### The Translation Layer

  To model omissions in an SCM, you must stop thinking of nodes as "Events" (which implies activity) and start thinking of nodes as "State Variables" (which imply a value at time $t$).

  *   **Philosophical Omission:** "The gardener did not water the plant."
  *   **SCM Translation:** Variable $W$ (Watering) exists. The domain of $W$ is $\{0, 1\}$. The value observed is $W=0$.
  *   **The Conflict:** The graph treats $W=0$ and $W=1$ symmetrically. The postmortem treats them asymmetrically. $W=0$ is only a "cause" if there is an external function $Norm(W)$ that expects $1$.

  ---

  ### Case Studies in $do()$ Notation

  #### 1. The Missed Step (Cert Rotation)
  *   **Graph:** $R$ (Rotation Action) $\rightarrow$ $C$ (Cert Validity) $\rightarrow$ $D$ (Downtime).
  *   **Observation:** $R=0$ (no rotate), $C=0$ (expired), $D=1$ (down).
  *   **Counterfactual:** $P(D=0 \mid do(R=1)) \approx 1$.
  *   **SCM Verdict:** **Clean.**
      *   $R$ is a binary variable. $0$ is a valid state. The structural equation $C := f(R, \text{time})$ handles this naturally.
      *   The "omission" is just the observation $R=0$. The causal power is real: intervening on $R$ changes $D$.

  #### 2. The Default Nobody Chose (LB Timeout)
  *   **Graph:** $H$ (Human Config) $\rightarrow$ $T$ (Timeout Value) $\rightarrow$ $S$ (Storm).
  *   **Observation:** $H=\text{null}$, $T=60$ (vendor default), $S=1$.
  *   **The Cheat:** To make this a DAG, you must model $H$ not as "Did they configure it?" but as "What value did the config process yield?"
      *   If $H$ is "Human Effort," then $H=0$ caused $T=60$.
      *   If $T$ is exogenous (set by vendor), there is no edge from Human to $T$.
  *   **SCM Verdict:** **Requires Node Invention.**
      *   You have to introduce a node $Policy$ or $Decision$ that takes the value "Accept Default."
      *   Without that node, $T$ is exogenous. If $T$ is exogenous, it has no parents, so no human action is a cause. To blame the team, you must assert an edge $Human \rightarrow T$ that exists even when the human is idle.

  #### 3. The Unsent Signal (Missing Alert)
  *   **Graph:** $M$ (Monitoring Config) $\rightarrow$ $A$ (Alert Fired) $\rightarrow$ $R$ (Human Response) $\rightarrow$ $Rec$ (Recovery).
  *   **Observation:** $M=0$ (off), $A=0$, $R=0$, $Rec=0$ (failed).
  *   **Counterfactual:** $do(M=1) \rightarrow A=1 \rightarrow R=1 \rightarrow Rec=1$.
  *   **SCM Verdict:** **Clean.**
      *   Similar to Case 1. $M$ is a switch. $Off$ is a position.
      *   The causal chain is intact. The "omission" is simply the path where $M$ stayed at baseline.

  #### 4. The Preventive Omission (Release Manager on Flight)
  *   **Graph:** $K$ (Approval Key) $\rightarrow$ $Dep$ (Deploy) $\rightarrow$ $Fail$ (Outage).
  *   **Observation:** $K=0$ (no approval), $Dep=0$ (no deploy), $Fail=0$ (no outage).
  *   **Counterfactual:** $do(K=1) \rightarrow Dep=1 \rightarrow Fail=1$.
  *   **SCM Verdict:** **Valid but Asymmetric.**
      *   Mathematically, $K=0$ is a cause of $Fail=0$.
      *   This feels weird because postmortems usually model $Fail=1$ as the target variable.
      *   In this graph, the "omission" ($K=0$) is a *protective* cause. The graph handles this fine, but your incident review template likely filters for causes of *negative* outcomes, making this invisible to the process.

  ---

  ### The Residue Report

  Here is where your toolkit leaks.

  | Case | Fits DAG + $do()$? | The "Cheat" Required |
  | :--- | :--- | :--- |
  | **1. Missed Step** | **Yes.** | None. $Action=0$ is a state. |
  | **2. Default** | **No.** | You must model "Inaction" as an active choice node ($Choice=\text{Default}$). Otherwise, the timeout is exogenous weather. |
  | **3. Missing Alert** | **Yes.** | None. Config is a variable. |
  | **4. Prevention** | **Yes.** | None mathematically, but requires flipping the target variable from $Failure$ to $Safety$. |

  #### The Bug in the Toolkit
  Your hunch is correct. The SCM cannot distinguish between **Baseline** and **Deviation** without external metadata.

  In a pure graph, $R=0$ (didn't rotate) and $R=1$ (did rotate) are symmetric. The graph does not know that $R=1$ is the *expected* state.
  *   **The Graph says:** "State $R=0$ leads to $D=1$."
  *   **The Postmortem says:** "State $R=0$ is a *violation* that led to $D=1$."

  That word *violation* is not in the DAG. It is a **Norm**.

  To make omissions work in your model, you need to bolt on a **Reference Model** ($M_{norm}$).
  *   **Actual World:** $R=0 \rightarrow D=1$.
  *   **Normative World:** $R_{norm}=1 \rightarrow D_{norm}=0$.
  *   **Cause:** The divergence between Actual and Normative.

  If you don't bolt on the Runbook (the Norm), the graph cannot tell the difference between "Nobody rotated the cert" (omission) and "A meteor destroyed the datacenter" (exogenous shock). Both are just paths to $D=1$. The Runbook is the prior that defines which variables *should* have been intervened upon.

  **Is it a bug or Norms in Costume?**
  It is Norms in Costume. The philosophers are arguing about metaphysics ("Is nothing a thing?"). You are arguing about **responsibility assignment** ("Who owns the baseline?").
  The graph describes physics (if X, then Y). The postmortem describes sociology (X was supposed to happen). You cannot derive "supposed to" from "is."

  #### What's Left Over?
  Even if you add a `Runbook_Expectation` node, the graph still can't capture **Salience**.
  There are infinite $do()$ operations that would have prevented the incident.
  *   $do(\text{Rotate Cert}=1)$
  *   $do(\text{Buy Competitor}=1)$
  *   $do(\text{Shut Down Company}=1)$

  All three causally prevent the outage. The graph treats them equally. The postmortem selects the first one. Why? Because it minimizes the **Cost of Intervention** relative to the **Norm**. The graph has no cost function. It has no concept of "reasonable effort."

  ---

  ### The "Actionability" Rule

  Your template rule: *"Only name causes the team could have acted on."*

  This is not a causal question. It is a **Feasibility Constraint on the $do()$ Operator.**

  In Pearl's calculus, $do(X=x)$ implies we can set $X$ to $x$ independently of its parents.
  *   **Causal Question:** Is there an edge $X \rightarrow Y$? (Yes, the cert expiration caused the down).
  *   **Actionability Question:** Is $do(X=x)$ in the set of **Allowed Interventions** $\mathcal{I}$?

  The set $\mathcal{I}$ is defined by your team's scope, budget, and authority.
  *   $do(\text{Rotate Cert})$ $\in \mathcal{I}$.
  *   $do(\text{Rewrite Kernel})$ $\notin \mathcal{I}$.
  *   $do(\text{Stop Time})$ $\notin \mathcal{I}$.

  The philosophers argue about whether omissions are *causes*. Your template argues about whether they are *levers*.
  *   **Causality:** Did the absence of the rotation contribute to the failure? (Yes).
  *   **Actionability:** Can we write a ticket to ensure the rotation happens next time? (Yes).

  If you found that the root cause was "The vendor's library has a memory leak," that is a cause. But if you cannot $do()$ anything to the vendor's library (you can't fork it, you can't patch it), it fails the actionability filter. It is removed from the postmortem not because it isn't causal, but because it isn't **controllable**.

  ### Summary for your Team

  1.  **Omissions are States:** Stop calling them "nothing." In the DAG, they are variables taking their baseline value ($X=0$).
  2.  **The Runbook is a Prior:** The graph tells you what broke. The Runbook tells you which breakage counts as a "failure of process" vs. "bad luck." You need both to assign root cause.
  3.  **Actionability is a Filter:** Causality is about *dependence*. Actionability is about *control*. Your template rule is a filter applied *after* the causal graph is solved, removing valid causes that lie outside your control boundary.
  4.  **The "Default" Trap:** Be careful with Case 2. If you treat "Default Config" as "No Config," you can't model it. You must treat "Accepting Default" as an explicit configuration state chosen by the team.

  The philosophers worry that "nothing" can't push "something." You don't need to solve that. You just need to acknowledge that your DAG models the system's **physics**, but your Postmortem models the system's **contract**. Omissions are only causes in the contract.
