answer: |-
  The standoff in your group is not merely a failure of imagination but a structural collision between two different projects masquerading as one. Your hypothesis is largely correct: each side treats the other's counterexamples as category errors rather than data. The Lewisians are building a causal model of stability; the normativists are describing a phenomenology of obligation. When these projects intersect, they talk past one another.

  Regarding your three cases, the Lewisian strategy is indeed to absorb anomalies into the coordination framework, but this comes at a cost. In the case of **orphaned conventions**, the Lewisian claim that the group is now coordinating on *which rule to enforce* (meta-coordination) is technically coherent but theoretically expensive. It renders the account nearly unfalsifiable: any persistent regularity becomes a solution to *some* coordination problem, even if the only problem is avoiding the friction of changing habits. For this to be a genuine explanation rather than a dodge, the Lewisian must specify what payoff structure sustains the meta-coordination. If the only payoff is "avoiding argument," the normativist will reply that this just restates the pressure they are trying to explain. The normativist sees the coffee rule as evidence that norms generate their own reasons, independent of utility. The Lewisian sees the utility in avoiding the disutility of conflict. The gap is whether "avoiding conflict" is a preference or a normative requirement.

  The **first-instance norm** case is the Lewisian's weakest point. Lewisian conventions require common knowledge and aligned conditional preferences, which typically emerge over time. If a chair's email creates an immediate binding obligation at t=0, the Lewisian must argue that the email instantly creates common knowledge and transforms preferences. This is plausible if the authority is already accepted, but it begs the question: why is the authority accepted? The normativist argues that the declaration itself constitutes the norm through status functions, not expectations. Here, the Lewisian account risks circularity: expectations sustain the norm, but the norm (via authority) creates the expectations. The normativist captures the immediacy of the "ought" better, while the Lewisian captures the fragility of such rules better (if the chair leaves, the norm often vanishes).

  **Normative leakage** turns on the interpretation of psychology. The Lewisian describes anonymous punishment as an internalized heuristic that was evolutionarily stable in ancestral environments where interactions were repeated. The normativist argues that the *experience* of resentment is not an illusion of evolutionary history but a present-day recognition of a valid claim. The Lewisian reduces the feeling to a causal mechanism; the normativist takes the feeling as data about the social reality.

  Ranking the diagnoses of this stalemate by how much work they are doing in your sessions:

  1.  **Mismatch of Explanatory Targets:** This is the primary driver. The Lewisians are explaining *emergence and stability* (how do regularities persist?). The normativists are explaining *force and legitimacy* (why do we feel blamed?). Because stability can exist without felt obligation (habits) and obligation can exist without stability (failed revolutions), the two sides are modeling different phenomena using the same label.
  2.  **Substantive Constitutive Dispute:** This is the philosophical engine. It asks whether normative force can be reduced to expectations and preferences. The Lewisians say yes; the normativists say no. This dispute fuels the mismatch because each side thinks the other is missing the essence of the phenomenon.
  3.  **Displaced Empirical Question:** Both sides make claims about human psychology (internalized dispositions vs. genuine resentment) without empirical evidence. This allows the stalemate to persist indefinitely because neither side can be proven wrong by observation.
  4.  **Verbal Disagreement:** This is the least productive diagnosis. While they define "norm" differently, the disagreement is not merely terminological; it is about the structure of social reality.

  The question is not ill-posed, but it is currently overloaded. Progress would not come from a verdict but from a **redrawing of the question**. The group should distinguish between "social regularities" (Lewis's domain) and "normative obligations" (the normativist's domain). Progress would consist of a formal result or empirical finding showing where these two come apart. For example, if you could identify a stable regularity sustained purely by expectations where participants report *no* felt obligation upon violation, you would have carved out the Lewisian space. Conversely, if you found an obligation that persists despite zero expectation of conformity, you would secure the normativist space.

  I expect little of this to happen spontaneously because it requires abandoning the hope for a unified theory. The group wants one account of "the norm," but there may be two distinct mechanisms overlapping in most cases.

  **Where my diagnosis is likely wrong:** I may be underestimating the sophistication of the Lewisian response to first-instance norms. It is possible that common knowledge and conditional preferences can be modeled as instantaneous given the right focal points, meaning the "bootstrapping gap" is a mathematical artifact rather than a conceptual failure.

  **The consideration that would make me abandon this diagnosis:** A formal game-theoretic model demonstrating how a declaration at t=0 generates stable conditional preferences and common knowledge without presupposing a prior normative framework. If such a model exists and fits the data, the "constitutive dispute" collapses in favor of the Lewisians, and my claim about the mismatch of targets would be proven merely a temporary limitation of current modeling rather than a structural feature of the debate.
