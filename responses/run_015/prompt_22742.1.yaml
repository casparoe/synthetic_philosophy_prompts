  9.  (Self-Correction on the *Reductio*): The user says "I take it as a reductio: any model with a positive cosmological constant is in trouble." I need to clarify that while this *was* the initial reaction (e.g., Dyson et al.), the community response was mostly "fix the measure" or "vacuum decays," not "abandon $\Lambda$." The data for $\Lambda$ is too strong. So the *reductio* targets the *eternal* nature or the *measure*, not necessarily $\Lambda$ itself in a metastable vacuum.

  10. (Final check on "Incoherent"): Why incoherent? Because a coherent memory implies a correlation with an external reality that doesn't exist for the BB. To fluctuate a brain *and* the specific neural wiring that matches a specific fake history is less probable than a brain with wiring that matches *no* history (noise). Actually, the simplest BB is just a momentary consciousness. Any memory structure adds complexity. A specific memory structure (CMB) is more complex than a random one.

