  ### Stage 1: Candidate Refrains
  *Goal: Two lines, one singular (benefit), one plural/impersonal (cost). Must survive 6 repetitions.*

  1.  *I take the profit for my own / The cost is shared by all the town.* (Too abstract ("profit"), "town" limits setting).
  2.  *I add one head to graze the grass / The water fails as seasons pass.* (A2 is result, not action/cost structure).
  3.  *I keep the gain that is my own / The cost is shared by flesh and bone.* ("Flesh and bone" too melodramatic).
  4.  *I take the gain from one more field / We share the cost we cannot feel.* (Concrete ("field"), captures asymmetry ("gain" vs "cost"), captures threshold epistemology ("cannot feel"), proper rhyme).
  5.  *I bring one beast to eat the green / The pump stays dry where none are seen.* (Rhyme green/seen is good, but A2 is passive).

  *Selection:* Candidate 4. "I take the gain from one more field" (Singular/Benefit) and "We share the cost we cannot feel" (Plural/Cost/Threshold).

