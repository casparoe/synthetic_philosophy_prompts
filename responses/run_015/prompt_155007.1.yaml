  *Refrain Rhyme (A):* -ield / -eel (Field, Feel).
  *Middle Rhyme (B):* Needs 6 unique words for lines 2, 5, 8, 11, 14, 17.
  *Selected Sound:* -ack.
  *Word List:* Back, Lack, Track, Crack, Slack, Black.
  *Availability:* Sufficient distinct concrete nouns/verbs to avoid repetition strain.

