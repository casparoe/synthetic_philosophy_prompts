      *   *Hypothesis 2: Bedrock intuitions.* Yes, this is the standard philosophical reading. Is equality good in itself?
      *   *Hypothesis 3: Distinct projects.* This is the strongest diagnostic angle. Prioritarianism is often framed as a *consequentialist aggregation rule* (maximise weighted welfare). Telic Egalitarianism is often framed as a *pattern-based view* (the pattern of distribution matters).

  4.  **Drafting the Diagnosis (Iterative Process):**

