answer: |-
  Reject Step (4), because it conflates instrumental wealth growth with terminal utility.

  **Confidence: High.** Step (4) claims that because life is a sequence of reinvested bets (3), you *must* maximize expected log wealth. This is a category error. The math in (1)-(3) describes how wealth *behaves* under compounding, not what wealth is *for*. Rationality requires maximizing your utility function, not your bankroll growth rate, unless those two are identical. For a human with a finite life, utility comes from consumption and experiences, not terminal wealth at $t=\infty$. By rejecting (4), you keep the valid math of (2) and (3) (Kelly is optimal for growth) without accepting the absurd conclusions (5)-(7) (never consume, never risk death).

  **Confidence: High.** Your counterexample against Step (1) is correct. Kelly does not dominate *all* alternatives with probability approaching 1; it only dominates strategies with lower asymptotic growth rates that do not risk immediate ruin. Your "bet everything once" strategy has a 60% chance of beating Kelly forever. Kelly wins in the 40% branch where you go bust, but that doesn't satisfy the "probability approaching 1" criterion in (1) as stated against *any* alternative. Your friend's argument relies on (1) being universally true for Kelly, but it is only true within the restricted class of non-ruining, fixed-fraction strategies mentioned in (2). The leap from (2) to the universal claim in (1) is unsupported.

  **Confidence: Medium.** Regarding your smaller objection about the "quantity to maximize": Your friend is partially right that the math applies to any compounding quantity, but wrong that this makes the argument vacuous. The argument tells you: *If* you want to maximize long-term growth of $X$, use Kelly on $X$. It does not tell you *which* $X$ to choose. That choice depends on your values (utility), not the math. This isn't a flaw; it's the boundary between instrumental rationality (how to get what you want) and terminal rationality (what to want). The math constrains your investment strategy given your goals; it does not dictate your goals.

  **Confidence: High.** On the horizon issue: The "eventually" in (1) assumes an infinite horizon. You are mortal. For finite horizons, the optimal fraction depends on your specific utility function and time remaining, not just the growth rate. If you need the money for a house in 5 years, Kelly might be too aggressive or too conservative depending on your risk tolerance regarding that specific target. Asymptotic theorems do not override finite constraints.

  **What would change my mind:** I would switch to supporting Step (4) if ergodicity economics could demonstrate that for a single trajectory (your life), the time-average growth rate is the *only* coherent objective function that avoids ensemble fallacies, even for finite horizons. Currently, this relies on assuming the utility of wealth is logarithmic by default, which is an assumption, not a proof.

  **Where my diagnosis is most likely wrong:** I may be underestimating the risk of ruin in your specific context. If you view this $190k as "seed capital" for a lifetime of investing where you never *need* to withdraw principal, then Step (5) (avoiding ruin) is actually good advice, even if (6) and (7) are not. If you treat the money as "never touch the principal," then log utility is a very safe heuristic, just not a moral imperative.

  **Bottom Line for Your Situation:** Your friend's argument is a powerful engine for wealth accumulation, but a terrible engine for living. You can use Kelly-like thinking to protect the principal (don't bet it all on one risky venture) without accepting the conclusion that you must never spend it or never risk crossing the street. Put the money in a low-cost index fund (which is effectively a Kelly-fraction of the market for most people), set aside a portion for immediate security, and give yourself permission to use the rest to build a life your dad would recognize.
