answer: |-
  This is one of the most persistent frustrations in contemporary metaphysics. You are right to sense stagnation. The debate over material constitution (the Statue and the Clay) has reached a reflective equilibrium where every solution solves the logical puzzle but incurs a heavy intuitive or theoretical cost.

  Here is a diagnosis of the disagreement, an evaluation of your contract case, and a proposal for what progress actually looks like here.

  ### 1. Diagnosis: A Meta-Ontological Clash Disguised as First-Order Ontology

  The debate is **substantive**, but not in the way the participants often claim. It is not a disagreement about the physical arrangement of particles (everyone agrees on the "physics"). It is a disagreement about **ideological cost vs. ontological parsimony**, grounded in a deeper meta-ontological divide about what existence claims *do*.

  Here is how the commitments break down:

  *   **Coincidentalists (e.g., David Lewis):** Commit to the reality of modal properties. They argue that because the statue and lump have different persistence conditions (the lump could survive being squashed; the statue could not), they must be distinct objects.
      *   *Cost:* Proliferation of objects. Two things in the same place.
      *   *Gain:* Preserves Leibniz's Law and standard logic.
  *   **Constitution Theorists (e.g., Lynne Baker):** Commit to a primitive relation of "constitution." The lump constitutes the statue; they are distinct but not two "things" in the sense of competing for space.
      *   *Cost:* Introduces a sui generis metaphysical relation that is hard to define without circularity.
      *   *Gain:* Captures the intimacy of the relationship without full-blown coincidence.
  *   **Monists / Sortal Relativists (e.g., Michael Rea):** Commit to the idea that identity is relative to a sortal concept. There is one object, but it is "the same lump" and "the same statue" only relative to different criteria.
      *   *Cost:* Rejects absolute identity (a core logical principle for many).
      *   *Gain:* Ontological parsimony (only one object).
  *   **Nihilists / Eliminativists (e.g., Trenton Merricks):** Commit to the view that composite objects do not exist. There are only simples arranged statue-wise.
      *   *Cost:* Error theory about ordinary discourse (statues don't exist).
      *   *Gain:* Ultimate ontological parsimony; dissolves the puzzle entirely.

  **The Verdict:** The disagreement is **substantive regarding theoretical virtues**, but **verbal regarding quantification**.
  It is verbal in the sense of Eli Hirsch's "quantifier variance": the parties agree on all the ground-level facts (the particles, the spacetime regions, the causal powers) but disagree on how the existential quantifier (∃x) maps onto those facts. However, it is substantive because mapping the quantifier determines which modal and causal explanations we accept as fundamental. If you are a Coincidentalist, you explain the crushing of the statue by referencing the cessation of one object and the survival of another. If you are a Nihilist, you reference the rearrangement of simples. These are different explanatory structures.

  ### 2. The Contract Case: Why It Doesn't Settle the Metaphysics

  Your contract case is excellent, but it does not prove the debate is substantive in the way you hope. It reveals a gap between **metaphysical identity** and **pragmatic/legal identity**.

  **The Scenario:**
  Contract: "Return the very same lump."
  Action: Sculptor returns the statue.

  **Why the Court Doesn't Care About Metaphysics:**
  A court would rule based on *restitution* and *intent*, not modal profiles.
  1.  **Material Continuity:** The court cares that the *matter* is returned. All metaphysical views agree the matter is there.
  2.  **Value/Function:** If the statue is worth more than the raw clay, the lender is happy. If the lender needed raw clay for a specific industrial process and the statue is useless, the lender sues for breach of *utility*, not breach of *ontology*.
  3.  **Interpretation of "Lump":** In legal contexts, "the same lump" is interpreted as "the same mass of material," not "the object satisfying the essential properties of lump-hood."

  **Why the Metaphysicians Agree on the Outcome:**
  *   **Coincidentalist:** The lump survives the sculpting (it just gains the property of being statue-shaped). The contract is kept.
  *   **Constitution Theorist:** The lump constitutes the statue. The lump still exists. Contract kept.
  *   **Monist:** There is one object. It satisfies the description "lump" sufficiently for the context. Contract kept.
  *   **Nihilist:** There are no lumps. But the contract refers to folk ontology. The sculptor returned the simples arranged lump-wise (now statue-wise). The spirit of the contract is fulfilled.

  **The "Verbal" Rescue:**
  The metaphysicians can all agree the sculptor fulfilled the contract while disagreeing on *why*.
  *   If the contract said, "Return the object that is *essentially* a lump," then the metaphysics would matter. But contracts use ordinary language, and ordinary language is vague.
  *   The "substantive" feeling comes from conflating **legal liability** (which is normative and pragmatic) with **numerical identity** (which is metaphysical). The court ruling settles the liability, but it doesn't tell us whether the statue *is* the lump. It just tells us that for the purpose of restitution, treating them as the same is the right policy.

  **Verdict on the Case:** The case shows that **practical stakes do not resolve ontological vagueness.** It confirms the suspicion that the "extra metaphysical question" is idle *for legal purposes*, which supports the view that the debate is largely about conceptual framework rather than empirical fact.

  ### 3. What Would Count as Progress?

  If the debate is stuck because everyone agrees on the physics and the logic, but disagrees on the "cost" of their ontology, progress cannot come from a new puzzle case (we have enough: Tibbles the cat, Theseus's ship, etc.). Progress requires a shift in the question.

  **A. Shift to Meta-Ontology (The "Sider" Move)**
  Progress would look like settling whether there is a "joint-carving" structure to reality.
  *   **Ted Sider's Argument:** If reality has a fundamental structure, then one quantifier meaning is "more real" than others. If so, the debate is substantive.
  *   **Progress Condition:** We need an argument for why one conceptual scheme "carves nature at the joints" better than the others, independent of our intuitions. Currently, we lack this.

  **B. Conceptual Engineering (The "Carnap/Hirsch" Move)**
  Accept that the debate is verbal in the deep sense, but argue that some frameworks are more *useful* for specific purposes.
  *   **Progress Condition:** Instead of asking "Which view is true?", we ask "Which view is best for physics? Which is best for law? Which is best for ethics?"
  *   *Example:* Nihilism might be best for fundamental physics. Coincidentalism might be best for law and ethics (where we need to track responsibility of agents vs. mere matter). Acknowledging this **Ontological Pluralism** would dissolve the frustration.

  **C. Causal Divergence (The "Realist" Hope)**
  The only way to make the debate empirically substantive is to find a case where the causal powers of the "statue" and the "lump" diverge.
  *   **Progress Condition:** If it turned out that statues have downward causal powers that lumps lack (or vice versa), then they must be distinct.
  *   *Problem:* Most agree they share all causal powers (overdetermination is unpalatable). Unless someone can demonstrate a causal difference, this path is closed.

  ### 4. Conclusion: Why No Progress is Expected (and Why That's Okay)

  You should not expect progress in the sense of one side "winning." The debate is a **reflective equilibrium of costs**.

  *   If you value **logic and modality**, you accept Coincidence.
  *   If you value **common sense and parsimony**, you accept Monism.
  *   If you value **scientific fundamentalism**, you accept Nihilism.

  The reason nobody converts is that these are not evidential disagreements; they are **axiological** disagreements (disagreements about what theoretical virtues matter most).

  **The Diagnosis:**
  The debate is **substantive regarding theoretical ideology** (what primitives we need) but **deflationary regarding worldly facts** (what exists in spacetime). Your contract case highlights that our practical lives run on a "folk ontology" that is robust enough to ignore the metaphysical distinctions.

  **Recommendation:**
  Stop asking "Are they the same object?" Start asking "What work do we want the concept 'object' to do?"
  If the goal is to understand fundamental reality, the Nihilist or 4Dist likely wins. If the goal is to understand human practice, law, and art, the Constitution theorist or Coincidentalist wins. The stagnation exists because metaphysicians keep trying to find a single answer that satisfies both fundamental reality and human practice. **Progress lies in decoupling those two goals.**
