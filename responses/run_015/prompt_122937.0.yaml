  3.  **Analyzing the Contract Case:**

      *   *Scenario:* Borrow lump $L$ on Monday. Sculpt into Statue $S$ on Thursday. Return $S$ on Friday. Contract: "Return the *very same lump*."
      *   *Intuition:* If $S \neq L$ (and $L$ ceased to exist when $S$ began), the contract is breached. If $S = L$ (or $L$ survives), it's kept.
      *   *Legal Reality:* Courts look at *intent* and *function*, not metaphysics. If the contract says "lump of clay," and you return a statue, a court asks: "Is the material substance substantially the same?" They usually care about value and material continuity, not modal profiles.
      *   *Metaphysical Reality:* Does the lump *exist* on Friday?
          *   Coincidentalist: Yes, the lump exists (it's just also a statue). Contract kept.
          *   Standard Constitution: The lump constitutes the statue. Does the lump survive? Usually, yes, constitution isn't destruction. Contract kept.
          *   Monist: There is one object. It satisfies "lump" and "statue" descriptions. Contract kept.
          *   Nihilist: There is no lump and no statue, only simples arranged lump-wise then statue-wise. The contract refers to a folk ontology.
      *   *Crucial Point:* Most metaphysical positions can *accommodate* the legal intuition by adjusting their theory of reference or persistence. The legal outcome doesn't force a metaphysical conclusion because the law operates on pragmatic criteria, not strict identity conditions.
      *   *Verdict on Case:* It *feels* substantive, but it likely collapses into a question of how we interpret the term "lump" in the contract (semantic) rather than what exists (ontological).

  4.  **Diagnosing the Disagreement:**

      *   *Is it Verbal?* Eli Hirsch argues it is (quantifier variance). Ted Sider argues it isn't (joint-carving).
      *   *Is it Substantive?* If modal properties are real and distinct, then coincidence is a real difference in the world.
      *   *My Take:* It's a "framework dispute." It looks substantive because the frameworks have different internal rules, but they agree on all the "ground level" facts (spacetime coordinates, mass, causal interactions).
      *   *The "Cost" Analysis:* Each position pays a different price (counterintuitive identity, proliferation of objects, denial of artifacts). The debate is about which cost is acceptable.

  5.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the stagnation. Validate the user's intuition about the contract case.
