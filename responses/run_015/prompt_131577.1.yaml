prompt: |-
  I commission and edit evolutionary-explanation pieces for a popular-science magazine — roughly one "why do humans or other animals have trait X?" feature a month — and I want a triage procedure my editors can run on any proposed adaptive explanation before we buy it. I want the steelman version of the Gould–Lewontin spandrels critique, not the version that mostly licenses us to feel smarter than whoever pitched the story, and not a blanket skepticism that would make the section impossible to fill.

  Concretely: an ordered checklist of questions, with what counts as a sufficient answer to each, a point at which the procedure stops with a no, and the points where it hands the question back to a human because it is editorial or value judgment rather than evidence. My editors are generalists with at most an undergraduate biology course, they have about twenty minutes per pitch, and I sign off on the outcome, so the procedure has to be runnable without a specialist in the room and say plainly when it cannot be.

  The distinctions I most want preserved rather than flattened by the simplification: current utility versus historical selection for that effect — a trait can be useful now without having been built for that use — and, among the non-adaptive explanations, structural byproduct with no current function versus byproduct later co-opted for a function versus a trait that made sense in an ancestral environment and is now mismatched or locked in by lineage history. I also want the procedure to include what I call the accessibility check: is there some variant near the actual trait that would perform the alleged function better and that the lineage could plausibly have reached? If such a variant exists and is absent, the adaptive story owes us an explanation, and I want the procedure to say what would discharge that debt.

  Then run it on three pitches: one arguing that the human taste for spicy food is an antimicrobial adaptation; one arguing that music is a byproduct of other cognitive machinery with no adaptive story of its own; and one that I expect to be uncomfortable, since my house line is that our debunkings are better evidenced than the adaptationist claims they mock, and I suspect a symmetric procedure will say they are often not. Show me where that suspicion is correct and where it is not, and be honest about what the procedure cannot settle even in principle.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Commissioning editor for a pop-sci magazine (evolutionary explanation features).
      *   **Goal:** Create a triage procedure (checklist) for editors to evaluate proposed adaptive explanations ("Why do X have trait Y?").
      *   **Philosophical Stance:** Wants the "steelman" Gould-Lewontin critique (Spandrels of San Marco), not cynical skepticism or blanket adaptationism. Needs to distinguish current utility vs. historical selection.
      *   **Specific Distinctions Required:**
          *   Current utility vs. historical selection.
          *   Structural byproduct (no function) vs. exaptation (co-opted) vs. mismatch/phylogenetic inertia.
          *   "Accessibility Check": Is there a better, reachable variant? If so, why wasn't it selected?
      *   **Constraints:** Editors are generalists (undergrad bio max), 20 mins per pitch, no specialists present, must indicate when human judgment is needed.
      *   **Task:**
          1.  Design the checklist (ordered, stop conditions, hand-off points).
          2.  Run the checklist on three specific pitches:
              *   Pitch A: Spicy food taste = antimicrobial adaptation.
              *   Pitch B: Music = byproduct (no adaptive story).
              *   Pitch C: A "debunking" piece (implied: criticizing adaptationist claims, but subject to the same scrutiny).
          3.  Evaluate the "house line" (that debunkings are better evidenced than adaptationist claims) using the procedure.
          4.  Be honest about limitations.

  2.  **Deconstruct the "Steelman Spandrel" Critique:**
      *   It's not "adaptationism is wrong." It's "adaptationism is a hypothesis, not a default."
      *   Key criteria: Heritability, Variation, Selection Pressure, Alternative Explanations (constraint, drift, byproduct), Comparative Evidence.
      *   The "Accessibility Check" is essentially asking about the local optimum vs. global optimum and genetic constraints.

  3.  **Drafting the Checklist (The "Triage Protocol"):**
      *   *Constraint:* 20 minutes, generalist editors. Needs to be binary or simple scaling where possible.
      *   *Structure:* Phase 1 (Basic Plausibility), Phase 2 (Alternative Hypotheses), Phase 3 (The Accessibility/Constraint Check), Phase 4 (Editorial Hand-off).
      *   *Stop Conditions:* If it fails Phase 1, reject immediately. If it fails Phase 3, flag for specialist review or reject.
      *   *Distinctions:* Must explicitly ask about *ancestral* vs. *current* environment and *origin* vs. *maintenance*.

      *Drafting Questions:*
      1.  Is the trait variable and heritable? (Basic evolution requirement).
      2.  Is there a specific selection pressure identified? (Not just "it's useful").
      3.  Is the utility current or ancestral? (Mismatch check).
      4.  Are there non-adaptive explanations? (Byproduct/Constraint).
      5.  The Accessibility Check: Could it be better? Why isn't it?

      *Refining for the User's specific requests:*
      *   Need to separate "Useful Now" from "Selected For."
      *   Need to categorize non-adaptive options (Byproduct, Exaptation, Mismatch).
      *   Need to define the "Accessibility Debt."

  4.  **Developing the Three Pitches:**

      *   **Pitch 1: Spicy Food (Antimicrobial).**
          *   *Claim:* Capsaicin preference evolved to kill bacteria in food.
          *   *Analysis:* Is it heritable? Yes (tolerance varies). Selection pressure? Foodborne illness. Ancestral environment? Hot climates (correlates with spice use).
          *   *Critique:* Is it cultural or genetic? Cooking kills bacteria too. Is the *taste* the adaptation or the *plant's* defense?
          *   *Verdict:* Plausible but confounds culture/biology. High risk of Just-So Story.

      *   **Pitch 2: Music (Byproduct).**
          *   *Claim:* Music is auditory cheesecake (Pinker). No specific module.
          *   *Analysis:* This is a *negative* adaptationist claim. It argues *against* direct selection.
          *   *Checklist fit:* The checklist is designed for *adaptive* explanations. I need to adapt the procedure to evaluate a *non-adaptive* pitch fairly. The prompt asks to run the procedure on it. This implies checking if the *evidence for the byproduct claim* holds up.
          *   *Verdict:* Hard to prove negative. Requires showing other functions explain the variance.

      *   **Pitch 3: The "Debunking" Piece.**
          *   *Claim:* "Evolutionary Psychology claims about X are wrong."
          *   *Analysis:* The user suspects their magazine's debunkings are often as weak as the claims they mock.
          *   *Checklist fit:* Does the debunking offer a better alternative? Or just say "no evidence"? A good debunking must offer the alternative (byproduct, mismatch, etc.).
          *   *Verdict:* This is where the "house line" gets tested. Often debunkings rely on "it's cultural" without evidence, which is just a mirror Just-So story.

  5.  **Refining the Procedure (Iterative Polish):**
      *   Make it look like a form.
      *   Add "Stop/Go" logic.
      *   Add "Human Hand-off" markers (where biology ends and editorial judgment begins).
      *   Ensure the "Accessibility Check" is prominent.

  6.  **Addressing the "House Line" Symmetry:**
      *   The user suspects their debunkings are often as evidentially thin as the adaptationist claims.
      *   *Honesty Check:* A claim "X is an adaptation" requires evidence of selection. A claim "X is NOT an adaptation" requires evidence of *alternative* causes (drift, constraint, exaptation). Simply saying "no proof" isn't proof of the alternative.
      *   *Symmetry:* Both sides often suffer from lack of comparative data or ancestral reconstruction.
      *   *Asymmetry:* Adaptationist claims are often more specific (falsifiable), whereas "it's complex" is harder to falsify. But "it's cultural" is often just as unfalsifiable as "it's evolutionary."

  7.  **Final Review against Constraints:**
      *   20 mins? Yes, if questions are sharp.
      *   Generalists? Yes, avoid jargon where possible, define terms.
      *   Distinctions preserved? Yes (Utility vs. Origin, Byproduct types).
      *   Accessibility Check included? Yes.

  8.  **Constructing the Output:**
      *   **Part 1: The Protocol.** (Clear, step-by-step, stop rules).
      *   **Part 2: The Run-Through.** (Applying protocol to the 3 pitches).
      *   **Part 3: The Meta-Analysis.** (Addressing the "house line" suspicion and limitations).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Music is a byproduct." I need to evaluate the *pitch* that argues it is a byproduct. Does that pitch meet the evidentiary bar? Usually, byproduct claims are harder to prove than adaptation claims because you have to rule out selection. The checklist needs to reflect that burden of proof.
      *Correction:* The checklist is primarily for *adaptive* explanations. For the Music pitch (non-adaptive), I need to note how the checklist adapts or where it flags the difficulty. Actually, the prompt asks to run the procedure *on* the pitches. If the procedure is for "proposed adaptive explanation," a "byproduct" pitch is technically a rejection of an adaptive explanation. I will treat the Music pitch as a claim *against* adaptation, and see if the procedure exposes weaknesses in *that* argument (i.e., does it simply assert byproduct without evidence?).
      *Wait, re-reading prompt:* "run it on three pitches: one arguing... antimicrobial... one arguing music is a byproduct... and one that I expect to be uncomfortable [debunking]."
      *Okay:* The procedure is for "any proposed evolutionary explanation." A byproduct claim *is* an evolutionary explanation (just non-adaptive). I need to ensure the checklist handles non-adaptive hypotheses too, or at least flags when an adaptive hypothesis is being rejected in favor of one.
      *Decision:* I will design the checklist to evaluate the *causal story*, whether adaptive or not. However, the core "Steelman Spandrel" focus is on vetting adaptationism. I will frame the checklist to test the *strength of the causal claim*, regardless of direction, but with specific traps for adaptationism.
      *Actually, better approach:* The checklist is to triage *proposals*. If the proposal is "Music is a byproduct," the checklist should ask: "What is the primary trait being explained?" and "What is the proposed cause?" If the cause is "byproduct of X," does it pass the constraints check?
      *Refined Decision:* I will keep the checklist focused on vetting *adaptive* claims primarily (as per the user's main goal), but in the analysis of the Music/Debunking pitches, I will highlight where the checklist forces the editor to realize the *alternative* claim also lacks evidence. This addresses the "house line" symmetry.

      *Let's refine the "Accessibility Check".*
      *   Question: "Is there a nearby design that works better?"
      *   If Yes: "Why wasn't it selected?" (Constraints, trade-offs, history).
      *   If the author can't answer, the adaptive story fails.

      *Let's refine the "Utility vs. History" distinction.*
      *   Question: "Does the evidence show *selection for* this, or just *current benefit*?"
      *   Evidence for selection: Comparative phylogeny, fossil record, genetic signature of selection.
      *   Evidence for benefit: Current performance data.
      *   If only benefit is shown -> Flag as "Exaptation or Byproduct risk."

      *Okay, ready to write.*

      *Wait, one more thing:* The user wants to know where the procedure says "No" and where it hands back to human. I need to mark those clearly.
      *And the "House Line" analysis:* I need to be brutal here. If the magazine runs "Adaptationist Claim X is Wrong" stories, do they prove X is a byproduct? Or do they just say "No evidence for X"? The latter is not a positive claim. The procedure should expose this.

      *Final Plan:*
      1.  **The EVO-TRIAGE Protocol:** 5 Steps. Stop rules. Hand-off points.
      2.  **Application:**
          *   Spicy Food (Adaptive claim).
          *   Music (Byproduct claim).
          *   Debunking (Meta-claim).
      3.  **The Symmetry Report:** Analyzing the "House Line."
      4.  **Limitations:** What this can't solve.

      *Tone:* Professional, direct, slightly cynical (matching the editor's desire for steelman critique), precise.

      *Check:* Did I include the specific distinctions?
      *   Current utility vs historical selection? (Step 2).
      *   Byproduct vs Exaptation vs Mismatch? (Step 3).
      *   Accessibility Check? (Step 4).
      *   20 mins/Generalist? (Keep language simple).

      *Let's go.*
answer: |-
  ## Part 1: The EVO-TRIAGE Protocol

  **Purpose:** To filter evolutionary explanation pitches before specialist review.
  **Time Budget:** 20 Minutes.
  **Operator:** Generalist Editor.
  **Outcome:** *Greenlight* (Send to Writer), *Yellowlight* (Send to You/Specialist), or *Redlight* (Reject).

  **Instructions:** Answer sequentially. If a **STOP** condition is met, terminate and log the reason. If a **HAND-OFF** is triggered, flag for your review.

  ---

  ### Step 1: The Variation & Heritability Gate
  *Evolution cannot act on a constant or a purely cultural artifact.*

  1.  **Does the trait vary within the population?** (e.g., Do some individuals have more/less of it, or none at all?)
  2.  **Is there evidence this variation is heritable (biological), not just cultural?**
      *   *Sufficient Answer:* Citation of twin studies, cross-foster studies, or phylogenetic continuity.
      *   *Insufficient Answer:* "Everyone has it" or "It seems innate."

  *   **STOP (Redlight):** If the trait is invariant (universal) *and* the pitch claims it was "selected for" without explaining how selection acted on variation, OR if the trait is demonstrably purely cultural (e.g., "driving on the left").
  *   **HAND-OFF:** If the pitch admits heritability is unknown but argues the *capacity* is biological. (Send to You).

  ### Step 2: The Utility vs. History Distinction
  *A trait can be useful now without being built for that use.*

  3.  **Does the pitch claim the trait was *selected for* its current function, or that it is merely *useful* now?**
      *   *Sufficient Answer for "Selected For":* Evidence of ancestral pressure (paleo-context), comparative data (related species without the trait lack the function), or genetic signatures of selection.
      *   *Sufficient Answer for "Useful Now":* Explicitly labels the trait as an **Exaptation** (co-opted) or **Mismatch** (ancestral trait in new context).
      *   *Insufficient Answer:* "It helps us survive today, therefore it evolved for this."

  *   **STOP (Redlight):** If the pitch conflates current utility with historical origin (the "Just-So" error).
  *   **HAND-OFF:** If the pitch argues for **Mismatch** (e.g., "We crave sugar because it was rare then"). This requires editorial judgment on whether the ancestral claim is plausible pop-sci or speculative. (Send to You).

  ### Step 3: The Non-Adaptive Alternative Scan
  *Rule out the Spandrels before building the Cathedral.*

  4.  **Has the pitch explicitly addressed the top three non-adaptive alternatives?**
      *   **A. Structural Byproduct:** Is the trait a necessary physical consequence of something else? (e.g., red blood is a byproduct of oxygen-carrying molecules, not selected for color).
      *   **B. Genetic Drift/Noise:** Could this be random fixation?
      *   **C. Phylogenetic Inertia:** Do they have it simply because their ancestors had it, with no maintenance cost?
      *   *Sufficient Answer:* The pitch provides a reason why A, B, or C are *less likely* than the adaptive story (e.g., "The trait is too complex to be a byproduct").

  *   **HAND-OFF:** If the pitch dismisses non-adaptive explanations with "It's too complex to be accidental." (This is a value judgment on complexity. Send to You).

  ### Step 4: The Accessibility Check (The Local Optimum Test)
  *If a better design was reachable, why wasn't it taken?*

  5.  **Is there a plausible variant of this trait that would perform the alleged function *better* with *less cost*?**
      *   *Example:* If the eye is adapted for sight, why is the retina backward (blind spot)?
      *   *Sufficient Answer:* The pitch identifies the constraint (developmental, genetic, or historical) that prevented the "better" variant.
      *   *Insufficient Answer:* Ignoring the question or claiming "This is the perfect design."

  6.  **If a better variant exists and is absent, does the pitch explain the "Debt"?**
      *   *Sufficient Answer:* "Trade-off with Trait Z," or "Developmental path locked in at embryonic stage X."
      *   *Insufficient Answer:* "Nature hasn't gotten around to it."

  *   **STOP (Redlight):** If a clearly superior, biologically reachable variant exists (e.g., in a closely related species) and the pitch offers no constraint explanation.
  *   **HAND-OFF:** If the "constraint" relies on complex developmental biology. (Send to You).

  ### Step 5: The Falsifiability Check
  *Can we imagine evidence that would prove this wrong?*

  7.  **Does the pitch state what finding would disprove the hypothesis?**
      *   *Sufficient Answer:* "If we found species X lacking this trait in environment Y, the theory fails."
      *   *Insufficient Answer:* "It's complicated" or "Multiple pathways exist."

  *   **STOP (Redlight):** If the hypothesis is unfalsifiable (explains everything, predicts nothing).
  *   **GREENLIGHT:** If passed all above.
  *   **YELLOWLIGHT:** If passed but triggered multiple HAND-OFFs.

  ---

  ## Part 2: Running the Protocol on Three Pitches

  ### Pitch 1: "Why We Love Heat: The Antimicrobial Hypothesis"
  *Claim:* Humans evolved a taste for capsaicin (spicy food) because spices kill foodborne bacteria, reducing mortality in hot climates.

  *   **Step 1 (Variation):** **Pass.** Tolerance varies; genetic receptors (TRPV1) vary.
  *   **Step 2 (Utility vs. History):** **Fail/Hand-Off.**
      *   *Issue:* The pitch conflates current utility (spices kill bacteria) with historical selection. Did we select for *tolerance* or did we select for *culture*?
      *   *Critique:* Cooking also kills bacteria. If cooking exists, is the spice adaptation necessary? The pitch argues "Selection for tolerance" but evidence is mostly correlational (hot climates = spicy cuisine). This looks like gene-culture coevolution, but the pitch treats it as hardwired biology.
  *   **Step 3 (Non-Adaptive):** **Fail.**
      *   *Issue:* Does not address **Exaptation**. Capsaicin tolerance could be a byproduct of general pain-reward pathway wiring (masochism) co-opted for diet.
  *   **Step 4 (Accessibility):** **Stop (Redlight).**
      *   *Question:* Is there a better variant? Yes. *Avoiding* spoiled food entirely (smell/taste for rot) is cheaper than eating it and killing the bacteria internally. Or, cooking.
      *   *Debt:* The pitch owes an explanation of why "don't eat rotten meat" wasn't the selected strategy over "eat rotten meat + chili." It does not provide this.
  *   **Verdict:** **Redlight.** The accessibility check reveals a cheaper adaptive solution (avoidance/cooking) that renders the specific "tolerance" adaptation unlikely without more constraint evidence.

  ### Pitch 2: "Music as Auditory Cheesecake"
  *Claim:* Music is not an adaptation. It is a byproduct of language, pattern recognition, and emotional regulation systems. (The Pinker/Spandrel view).

  *   **Step 1 (Variation):** **Pass.** Musical ability varies; heritability is moderate.
  *   **Step 2 (Utility vs. History):** **Pass.** Explicitly argues *against* historical selection for music *per se*.
  *   **Step 3 (Non-Adaptive):** **Pass.** Explicitly argues for **Structural Byproduct** (of language/emotion).
  *   **Step 4 (Accessibility):** **Hand-Off.**
      *   *Question:* Is there a better variant? If music is a byproduct, "better" doesn't apply in the same way. However, if language is the driver, why did music diverge?
      *   *Debt:* The pitch must explain why the "byproduct" is so universal and costly (time/energy) if it has no function. Pure drift usually doesn't sustain high-cost universal traits.
      *   *Editorial Judgment:* This requires weighing the "cost" of music against the "cost" of language machinery. This is beyond generalist scope.
  *   **Step 5 (Falsifiability):** **Pass.** "If we find a human culture with no music and no language deficits, the byproduct claim weakens." (Note: No such culture exists).
  *   **Verdict:** **Yellowlight.** The pitch passes the adaptationist traps, but the "Byproduct" claim carries its own burden of proof (explaining universality and cost) that triggers a Hand-Off to you. It is not a "free" pass just because it's anti-adaptationist.

  ### Pitch 3: "The Myth of the Cheater-Detection Module" (The Debunking)
  *Claim:* A takedown of a famous EvPsych claim (e.g., Wason Selection Task). Argues humans do *not* have a specialized module for detecting social cheaters; performance is driven by general reasoning or familiarity.

  *   **Step 1 (Variation):** **Pass.** Performance on logic tasks varies.
  *   **Step 2 (Utility vs. History):** **Pass.** Argues the original adaptationist story confused task utility with historical selection.
  *   **Step 3 (Non-Adaptive):** **Hand-Off.**
      *   *Issue:* The pitch argues for **General Reasoning** (a different adaptation) or **Cultural Learning** (non-biological).
      *   *Critique:* If the alternative is "General Reasoning," that is *also* an adaptive claim. If the alternative is "Cultural Learning," does it pass Step 1 (Heritability)? Often, debunkings swap "Adaptation A" for "Adaptation B" without evidence, or "Adaptation A" for "Culture" without evidence of cultural transmission mechanisms.
  *   **Step 4 (Accessibility):** **Stop (Redlight) / Hand-Off.**
      *   *Issue:* The debunking often claims "The module is too specific." But does the *alternative* (general reasoning) pass the Accessibility Check? General reasoning is metabolically expensive. A specialized module is *more* efficient.
      *   *Debt:* The debunking owes an explanation of why a general (expensive) system was selected over a specific (cheap) one, if the specific one was accessible. Most debunkings do not answer this; they simply assert the specific module doesn't exist.
  *   **Verdict:** **Yellowlight/Redlight.** This is where your suspicion is correct. The debunking often fails Step 4 on its *own* terms. It rejects a specific adaptation but proposes a costly alternative without explaining the constraint.

  ---

  ## Part 3: The Symmetry Report (House Line Analysis)

  You suspected your debunkings are often no better evidenced than the adaptationist claims they mock. The protocol confirms this suspicion in specific, structural ways.

  ### Where the Suspicion is Correct (The Symmetry of Ignorance)
  1.  **The "Alternative" Trap (Step 3 & 4):**
      *   **Adaptationist Pitch:** Claims Trait X is for Function Y. Fails to explain why a cheaper design wasn't selected.
      *   **Debunking Pitch:** Claims Trait X is *not* for Function Y, but is instead Result Z (e.g., "culture" or "general intelligence"). Fails to explain why Result Z is stable/universal without selection.
      *   **Symmetry:** Both sides often rely on "It seems obvious." The adaptationist says "Obviously useful." The debunker says "Obviously cultural." Neither provides the comparative phylogenetic data required to settle it. The protocol catches both equally at Step 4 (Accessibility/Constraint).

  2.  **The Falsifiability Void (Step 5):**
      *   Adaptationist stories are often unfalsifiable ("It helped in the Pleistocene").
      *   Debunking stories are often equally unfalsifiable ("It's a complex interaction of culture and biology").
      *   **Result:** A "Redlight" on the adaptationist pitch does not automatically mean a "Greenlight" for the debunking. The debunking must run its own gauntlet.

  ### Where the Suspicion is Incorrect (The Asymmetry of Burden)
  1.  **Specificity (Step 2):**
      *   Adaptationist claims make specific predictions about design (e.g., "The eye should be optimized for light"). This makes them *easier* to falsify (e.g., "The blind spot exists").
      *   Debunking claims (especially "it's complex/cultural") are often *harder* to falsify.
      *   **Advantage:** Adaptationist pitches are scientifically "riskier" and thus more valuable *if* they pass. A successful adaptationist story is more informative than a successful "it's complicated" story. The protocol should not penalize the adaptationist for making a testable claim, provided they pass the Accessibility Check.

  2.  **The Null Hypothesis (Step 3):**
      *   In biology, "No Function" (Drift/Byproduct) is a valid null hypothesis. "Wrong Function" is not.
      *   A debunking that argues "This is a Byproduct" (Pitch 2) is scientifically stronger than one that argues "This is a *Different* Adaptation" (Pitch 3), because the former reduces the assumption of optimization.
      *   **Nuance:** Your house line treats all debunkings as equal. The protocol distinguishes between "Byproduct Debunking" (Stronger) and "Alternative Adaptation Debunking" (Equally weak).

  ### What The Procedure Cannot Settle (Even In Principle)
  1.  **Ancestral Reconstruction:** We cannot observe the Pleistocene. Step 2 (Utility vs. History) relies on proxies (modern hunter-gatherers, primates). The protocol can flag speculation, but it cannot turn speculation into fact.
  2.  **Genetic Architecture:** Generalist editors cannot judge if a trait is "genetically reachable" (Step 4). We can flag the *question*, but we cannot answer it without a specialist. This is why the **HAND-OFF** is critical.
  3.  **The Definition of "Trait":** Is "Music" a trait? Or is "Rhythm Perception" the trait? Adaptationist and debunking pitches often talk past each other by defining the unit of analysis differently. The protocol assumes the pitch defines the trait clearly; if they don't, the protocol fails.

  ### Recommendation for the House Line
  Modify your editorial policy to reflect the **Step 4 Symmetry**.
  *   **Rule:** We will not run a debunking piece that rejects an adaptive claim unless it either (A) offers a specific non-adaptive mechanism (Byproduct/Constraint) that passes the Accessibility Check, or (B) admits the alternative is also unproven.
  *   **Tagging:** Label pieces explicitly: *"Hypothesis: Adaptation"* vs *"Hypothesis: Byproduct"* vs *"Hypothesis: Mismatch."* Stop labeling them *"Fact"* vs *"Myth."*

  This preserves the skepticism you want without granting the debunkers an unearned epistemic high ground.
