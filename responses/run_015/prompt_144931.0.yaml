      *   **Scenario:** Fictional but plausible event (Destruction of a provincial archive in 312 BCE).
      *   **Core Rule:** Before a card (source) is admitted, the group must apply a critical filter drawn from *already admitted* cards. Filters must eventually turn back on earlier admissions, forcing contradictions/removals.
      *   **Incentives:** Reward coherence, penalize contradiction. Experience the collapse of the narrative.
      *   **Debrief:** Map rounds to stages in source criticism (Herodotus $\rightarrow$ Thucydides $\rightarrow$ Modern Archival Theory). Identify the "foundational exemption" moment. Explain why it's structurally necessary. Acknowledge what the simulation *can't* do (material absence).
      *   **Constraint:** No bibliographies, reading lists, or citations. Stand on internal logic.

  2.  **Deconstruct the "Bootstrap Problem":**
      *   Historians use criteria (e.g., "eyewitnesses are more reliable," "official records are biased," "consistent accounts are likely true") to judge sources.
      *   But where do these criteria come from? Often, they are generalized from other sources.
      *   If we apply the criteria rigorously to the sources that generated the criteria, we might invalidate the criteria themselves, leaving no ground to stand on.
      *   *Simulation Goal:* Make students feel the ground slipping away as they try to be "rigorous."

  3.  **Design the Scenario (312 BCE Archive Destruction):**
      *   Needs to be vague enough to allow interpretation but specific enough to generate contradictions.
      *   *Event:* The burning of the Satrapal Archive at Susa (or a fictionalized equivalent).
