answer: |-
  **The Setup**

  Consider a single-molecule Szilard engine immersed in a heat bath at temperature $T$, consisting of a box of volume $V$, a movable partition, and a weight. The cycle begins with the molecule equilibrated in $V$; a partition is inserted reversibly at $V/2$, confining the molecule to Left or Right with equal probability. An idealized feedback controller, mechanically decoupled from the bath's thermal noise to avoid the Smoluchowski objection (the gate is driven by an athermal potential determined by the measurement, not a passive spring subject to Brownian rattling), measures the molecule's position and couples it to a bit on a moving memory tape. The tape bits arrive in a biased state (probability $p$ of being '0') and are updated to match the molecule's position (becoming 50% '0', 50% '1'), then exit the system downstream without ever being reset. Following the measurement, the partition acts as a piston, allowing the gas to expand isothermally and quasi-statically against the weight, lifting it until the volume returns to $V$, after which the partition is removed. The gas returns to its initial macrostate, the tape carries away the entropy, and no memory cell within the engine boundary is ever erased.

  **The Accounting**

  We analyze the entropy balance over one cycle. The gas returns to its initial state, so $\Delta S_{\text{gas}} = 0$. The internal energy of the ideal gas is unchanged ($\Delta U = 0$), so the work $W$ extracted from the expansion equals the heat $Q$ absorbed from the bath ($W=Q$). The bath entropy change is $\Delta S_{\text{bath}} = -Q/T = -W/T$. The critical term is the tape. The Shannon entropy per bit is $H(p) = -p \log_2 p - (1-p) \log_2 (1-p)$. The tape enters with entropy $H_{\text{in}} = H(p)$ and leaves randomized with $H_{\text{out}} = H(0.5) = 1$ bit. The physical entropy change of the tape is $\Delta S_{\text{tape}} = k \ln 2 \cdot (H_{\text{out}} - H_{\text{in}})$. The Second Law requires $\Delta S_{\text{total}} = \Delta S_{\text{bath}} + \Delta S_{\text{tape}} \ge 0$. Substituting terms:
  $$ -\frac{W}{T} + k \ln 2 \cdot (1 - H(p)) \ge 0 $$
  $$ W \le kT \ln 2 \cdot (1 - H(p)) $$
  For your 90%-zeros tape ($p=0.9$), $H(0.9) \approx 0.47$ bits. The inequality becomes $W \le 0.53 \, kT \ln 2$. The entropy of the **tape** goes up by $0.53 \, k \ln 2$ per cell, paying exactly for the entropy reduction of the bath required to lift the weight.

  **The Three Accounts**

  1.  **The Erasure (Landauer) Account:** This account looks for a reset operation to find the cost. Since no bits are reset inside the engine, this account comes away empty-handed *locally*. It predicts no cost within the cycle boundaries, failing to explain the limit on $W$ unless it expands its boundary to include the tape's preparation.
  2.  **The Fluctuation Account:** This argues that thermal noise in the gate (the partition) will leak information, costing work. Your setup explicitly bypasses this by specifying an athermal, actively controlled partition and quasi-static operation. This objection is not engaged because the mechanism is not a passive thermal ratchet.
  3.  **The Information-Reservoir Account:** This treats the tape as a thermodynamic fuel with free energy $F = -TS$. It predicts the work limit exactly as derived above: $W = \Delta F_{\text{tape}}$. It identifies the resource not as "erasure" but as the **negentropy** of the input tape.

  **The Verdict**

  The per-cell budget is **$kT \ln 2 \times (H_{\text{final}} - H_{\text{initial}})$**. Your intuition is right: a gigabyte of 90%-zeros is not a gigabyte of fuel; it is roughly 0.53 gigabytes of fuel. The standard $kT \ln 2$ figure applies only when the input is a pure state ($p=0$ or $1$) and the output is maximally mixed ($p=0.5$). The cost scales with the divergence from uniformity. You win the local argument: the demon spends less "information currency" per cycle when the tape is already noisy.

  **Conclusion**

  The single feature doing the work is the **non-equilibrium statistics of the input tape**. If you remove it—starting with an already-random tape ($p=0.5$)—then $H_{\text{in}} = 1$, $\Delta H = 0$, and the extracted work $W$ drops to zero; the engine stalls. If you recycle the tape (feed the output back to the input), the tape equilibrates to $p=0.5$ after one pass, and subsequent cycles yield no work.

  Your friend's strongest counter is the **Global Ledger**. While you are right about the local budget, the 90%-zeros tape is a low-entropy resource that had to be created. If a previous device created that tape from a random source, it *must* have dissipated at least $0.53 \, kT \ln 2$ per bit to do so. Globally, the sum of work extracted here and work spent there respects the standard Landauer bound. This is not a different exorcism; it is the same one with the cost spatially distributed. The case settles that "erasure" is not the *only* moment cost is incurred—any entropy-reducing operation costs work—but it cannot settle whether "erasure" is the fundamental name for all such operations, as your friend can simply define "preparing the tape" as "erasure of the tape's previous randomness."

  **Honest Limitation:** This scenario assumes the coupling between the gas and the tape is perfectly reversible. It does not calculate the energy dissipated in the physical act of flipping the magnetic domains (or whatever) on the tape, which in a real device would likely dwarf the Landauer limit. It proves the thermodynamic *possibility*, not the engineering *efficiency*.
