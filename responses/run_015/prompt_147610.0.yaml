  # Taxonomy of Interpretive Responses to the Butterfly-Dream Episode

  ## Branch Structure

  **Branch 1 (Diagnostic Focus):** Does the dream argument primarily threaten **Epistemic Access (A)** to one's current state of consciousness, OR does it threaten the **Metaphysical/Temporal Boundary (B/C)** between self and non-self?
  *(Note: Options B and C are consolidated here to maintain binary structure required for an eight-leaf taxonomy.)*

  **Branch 2 (State Relation):** Is the relation between waking and dreaming **Symmetrical (1)**, so that neither state possesses corrective authority over the other, OR **Asymmetrical (2)**, so that waking experience retains minimal but non-zero corrective weight?

  **Branch 3 (Transformation Status):** Is the notion of transformation (wuhua) best understood as an **Ontological Thesis (X)** that all phenomenal states are equally real, OR as a **Pragmatic/Normative Practice (Y/Z)** suspending reality-claims or cultivating fluid identity?
  *(Note: Options Y and Z are consolidated here to maintain binary structure.)*

  ---

  ## Leaf Positions (8 Total)

  ### Leaf 1: [A] Epistemic — [1] Symmetrical — [X] Ontological
  *   **Occupancy:** Present
  *   **Label:** Radical Skeptical Realism
  *   **Awkward Commitment:** This position must concede that personal continuity is entirely illusory, as there is no ontological fact of the matter distinguishing the dreamer from the butterfly.
  *   **Injected View Status:** Not applicable.

  ### Leaf 2: [A] Epistemic — [1] Symmetrical — [Y/Z] Pragmatic/Normative
  *   **Occupancy:** Empty
  *   **Diagnosis:** Logical incoherence.
  *   **Reasoning:** If neither state has corrective authority (Symmetrical), one cannot consistently adopt a pragmatic suspension of reality claims without implicitly privileging the standpoint from which the suspension is enacted.

  ### Leaf 3: [A] Epistemic — [2] Asymmetrical — [X] Ontological
  *   **Occupancy:** Present
  *   **Label:** Dogmatic Wakefulness
  *   **Awkward Commitment:** This position must concede that personal continuity relies on an unproven ontological privilege granted to the waking state despite the inability to empirically verify it from within the dream.
  *   **Injected View Status:** Not applicable.

  ### Leaf 4: [A] Epistemic — [2] Asymmetrical — [Y/Z] Pragmatic/Normative
  *   **Occupancy:** Present
  *   **Label:** Mitigated Skepticism
  *   **Awkward Commitment:** This position must concede that personal continuity is preserved only by a practical convention that lacks ultimate metaphysical justification.
  *   **Injected View Status:** Not applicable.

  ### Leaf 5: [B/C] Identity — [1] Symmetrical — [X] Ontological
  *   **Occupancy:** Unnamed
  *   **Label:** Metamorphic Ontology
  *   **Awkward Commitment:** This position must concede that personal continuity is fully fragmented, meaning the self that wakes is ontologically distinct from the self that dreamed.
  *   **Injected View Status:** Not applicable.

  ### Leaf 6: [B/C] Identity — [1] Symmetrical — [Y/Z] Pragmatic/Normative
  *   **Occupancy:** Present
  *   **Label:** **Volitional-Enactment View** (Injected)
  *   **Awkward Commitment:** This position must concede that personal continuity is maintained through active agency, requiring the subject to exercise lucid control over unconscious states without recourse to physiological explanation.
  *   **Injected View Status:** **Structurally Distinct.** While it occupies the same logical node as standard normative readings, it diverges by positing active embodied agency rather than passive acceptance of fluidity.

  ### Leaf 7: [B/C] Identity — [2] Asymmetrical — [X] Ontological
  *   **Occupancy:** Empty
  *   **Diagnosis:** Implausible consequence.
  *   **Reasoning:** Asserting an ontological difference between dream and waking selves while maintaining asymmetrical corrective authority implies a hierarchical metaphysics of selfhood that contradicts the egalitarian spirit of transformation.

  ### Leaf 8: [B/C] Identity — [2] Asymmetrical — [Y/Z] Pragmatic/Normative
  *   **Occupancy:** Present
  *   **Label:** Ethical Fluidity
  *   **Awkward Commitment:** This position must concede that personal continuity is a cultivated achievement rather than a given fact, vulnerable to collapse if the normative practice is abandoned.
  *   **Injected View Status:** Not applicable.
