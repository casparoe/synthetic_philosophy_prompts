      *Revised Draft:*
      You suppose that your suffering invalidates the necessity of mutuality, but you merely confirm it through the negative. The truth of self-consciousness is not a solitary certainty, but the unity of itself with itself in its otherness; when you stand before him, you demand that your being-for-self be mirrored in his consciousness, and when that mirror is clouded by illness, you do not discover that mutuality is superfluous, but rather that Spirit is being denied its actuality. His cheerfulness is merely the immediacy of feeling, a natural existence that has retreated from the mediation of the Concept, whereas your anguish is the labor of the negative, the pain of a self-consciousness that finds its essence outside itself yet cannot retrieve it. The Lord failed because the recognition he received was from one he deemed unessential; you suffer because the recognition you seek is from one who has become incapable of the act itself. In both instances, the truth of Spirit is not present, for Spirit exists only in the reciprocal surrender of independence. You feel wrong not because the requirement is false, but because you are attempting to sustain a spiritual relation where only natural existence remains, and your guilt is the shadow cast by this impossibility. Do not mistake his contentment for truth; it is the sleep of Spirit, while your grief is the wakefulness of a consciousness confronting the limits of its own actualization.

