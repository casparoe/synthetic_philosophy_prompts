answer: |-
  ### Desiderata for a Theory of Human Death

  To count as complete, a theory of human death must satisfy the following six desiderata. Each addresses the friction between the clinical need for immediacy (organ procurement), the legal need for certainty (status shifts), and the metaphysical need for truth (ontological boundaries).

  **1. The Irreversibility Constraint**
  *   **Definition:** The state designated as death must be permanent; spontaneous return to the antecedent living state must be impossible, not merely improbable.
  *   **Motivating Tension:** This addresses the conflict between **Circulatory-Respiratory Criteria** (which require a waiting period to rule out auto-resuscitation, e.g., the Lazarus phenomenon) and **Brain-Death Criteria** (which claim immediate irreversibility upon loss of brainstem function).
  *   **Status:** **Non-negotiable.** A theory that permits reversal classifies a state as "suspended animation," not death.
  *   **Conflict:** Tension exists with *Organ Viability* (see Desideratum 4), as waiting for absolute irreversibility degrades transplantable tissues.

  **2. The Somatic Integration Constraint**
  *   **Definition:** Death of the human *organism* must coincide with the loss of the body's ability to function as a coordinated whole, maintaining homeostasis distinct from the environment.
  *   **Motivating Tension:** This targets the **Brain-Death** claim that the brain is the body's primary integrator. Critics note that brain-dead bodies on ventilation maintain temperature, heal wounds, and gestate fetuses, suggesting somatic integration persists without the brain. Conversely, **Circulatory** proponents argue the heart is the true integrator.
  *   **Status:** **Non-negotiable** (for the Metaphysical Register). If the organism is defined as a self-integrating whole, it cannot be dead while integrating.
  *   **Conflict:** Tension with *Legal Unicity* (see Desideratum 5), as integration is a gradient, while law requires a binary.

  **3. The Epistemic Accessibility Constraint**
  *   **Definition:** The criteria for death must be publicly observable and testable with high reliability and low false-positive rates.
  *   **Motivating Tension:** This distinguishes **Whole-Brain** criteria (brainstem reflexes are clinically testable) from **Higher-Brain** criteria (consciousness is philosophically and clinically opaque). It also contrasts with **Circulatory** criteria (pulse is obvious, but "irreversibility" is a prediction, not an observation).
  *   **Status:** **Preference** (Clinical/Legal Camp). Metaphysically, a being could be dead even if we cannot prove it; practically, we cannot act on unprovable death.
  *   **Conflict:** Tension with *Metaphysical Fidelity* (see Desideratum 6). What is true (metaphysics) is not always measurable (epistemology).

  **4. The Dead Donor Compliance Constraint**
  *   **Definition:** The determination of death must logically precede the removal of vital organs; procurement must not cause the death.
  *   **Motivating Tension:** This creates friction between **Circulatory** protocols (which may hasten death by withdrawing support to declare death) and **Brain-Death** protocols (which allow harvest while the heart beats, risking the appearance that harvest causes death).
  *   **Status:** **Non-negotiable.** Violating this undermines the moral legitimacy of transplantation.
  *   **Conflict:** Tension with *Irreversibility* (Desideratum 1). To ensure organ viability, clinicians often declare death at the earliest possible moment of *potential* irreversibility, not *actual* permanence.

  **5. The Administrative Unicity Constraint**
  *   **Definition:** There must be a single, simultaneous timestamp for death across all three registers (clinical, legal, metaphysical). Inheritance, marriage, and organismal existence must terminate at the same instant.
  *   **Motivating Tension:** This resolves the conflict where a patient might be "dead" for organ procurement (Brain-Dead) but "alive" for inheritance (if heirs contest the biological reality). It forces a convergence of **Brain** and **Circulatory** standards into one legal statute.
  *   **Status:** **Preference** (Legal Camp). It is a pragmatic necessity for social order, not necessarily a biological truth.
  *   **Conflict:** **Jointly Unsatisfiable** with Desideratum 6 (see below).

  **6. The Metaphysical Fidelity Constraint**
  *   **Definition:** The theory must accurately track the ontological category that is dying. It must distinguish between the death of the *biological organism* and the death of the *person* (psychological entity).
  *   **Motivating Tension:** This addresses the **Higher-Brain** view (person dies when consciousness ends) vs. the **Whole-Organism** view (organism dies when homeostasis ends). It demands the theory specify *what* is dying.
  *   **Status:** **Non-negotiable** (for Philosophical Adequacy). A theory that conflates person and organism is category-mistaken.
  *   **Conflict:** **Jointly Unsatisfiable** with Desideratum 5 (Administrative Unicity).

  ***

  ### Jointly Unsatisfiable Pairs

  **Pair:** **Desideratum 5 (Administrative Unicity)** and **Desideratum 6 (Metaphysical Fidelity)**.
  *   **Reason:** Biological death (organismal cessation) and biographical death (personhood cessation) are rarely simultaneous. Consciousness may cease before homeostasis (persistent vegetative state), or homeostasis may cease before cellular death (somatic integration lags). To satisfy *Unicity*, the law must arbitrarily stipulate one moment for both, thereby violating *Fidelity* for at least one category. To satisfy *Fidelity*, the law must acknowledge two different times of death, violating *Unicity* and creating legal chaos for inheritance and marriage. An adequate theory cannot maximize both; it must prioritize one register over the other.

  ***

  ### Analysis of the Specific Scenario

  **Scenario:** A body on full extracorporeal support exhibits no detectable brainstem reflexes, yet retains intact hypothalamic-pituitary hormonal cycles and reproducible spinal reflex arcs.

  **Classification:** **Death of the Person; Survival of the Organism.**

  **Reasoning:**
  1.  **Death of the Person:** The loss of all brainstem reflexes indicates the permanent loss of the biological substrate required for consciousness and interaction with the world. Under the *Metaphysical Fidelity* desideratum, the entity capable of psychological experience (the person) has ceased.
  2.  **Survival of the Organism:** The intact hypothalamic-pituitary cycles demonstrate that the body is regulating homeostasis (temperature, fluid balance, metabolism) without external hormonal intervention. The spinal reflexes indicate integrated neural activity below the neck. Under the *Somatic Integration* desideratum, the biological organism remains a functioning whole.

  **Forcing Desideratum:** **Desideratum 6 (Metaphysical Fidelity).**
  This desideratum forces the split classification. If we prioritized *Administrative Unicity* (Desideratum 5), we would be forced to declare the patient fully dead (to allow organ harvest and settle estates) despite the hormonal evidence, thereby lying about the biological reality. If we prioritized *Somatic Integration* (Desideratum 2) exclusively, we would declare the patient alive, preventing organ procurement despite the loss of personhood. *Metaphysical Fidelity* demands we acknowledge the divergence: the person is gone, but the animal remains.

  ***

  ### Scorecard of Mainstream Candidates

  **1. Whole-Brain Formulation**
  *   **Core Claim:** Death occurs upon the irreversible cessation of all functions of the entire brain, including the brainstem.
  *   **Primary Exclusion:** **Desideratum 2 (Somatic Integration).**
  *   **Analysis:** This formulation fails because, as shown in the scenario above, bodies can maintain somatic integration (hormonal homeostasis, wound healing, gestation) without brain function. By declaring the organism dead while it biologically integrates, the theory violates the metaphysical boundary of organismal existence. It conflates the loss of the *integrator* with the loss of *integration*.

  **2. Higher-Brain Formulation**
  *   **Core Claim:** Death occurs upon the irreversible loss of consciousness and capacity for social interaction.
  *   **Primary Exclusion:** **Desideratum 3 (Epistemic Accessibility).**
  *   **Analysis:** While metaphysically robust regarding "personhood," this formulation fails clinically and legally because consciousness is not directly observable. Distinguishing between locked-in syndrome, vegetative states, and true permanent unconsciousness carries a non-zero false-positive rate. A theory that risks burying or harvesting a conscious patient violates the non-negotiable safety requirements of the clinical register.

  **3. Circulatory-Respiratory Formulation**
  *   **Core Claim:** Death occurs upon the irreversible cessation of circulatory and respiratory functions.
  *   **Primary Exclusion:** **Desideratum 4 (Dead Donor Compliance).**
  *   **Analysis:** In the context of modern donation after circulatory death (DCD), this formulation is strained. To satisfy organ viability, the waiting period after heart stoppage is minimized (often 2-5 minutes). This window is shorter than the time required to guarantee *absolute* irreversibility (as auto-resuscitation can occur later). Thus, organs are often procured *before* death is strictly irreversible, or the act of procurement (cannulation) is prepared before death is declared, creating a causal ambiguity that threatens the Dead Donor Rule.

  ***

  ### Summary of Conflicts
  The central failure of all three candidates is their attempt to satisfy **Administrative Unicity** (Desideratum 5) at the expense of **Metaphysical Fidelity** (Desideratum 6). The scenario provided proves that organismal life and personal life can diverge. A complete theory must admit this divergence, even if the legal system is forced to arbitrarily collapse it for the sake of administrative convenience. The "adequate" theory is therefore one that acknowledges the distinction, even if current law cannot.
