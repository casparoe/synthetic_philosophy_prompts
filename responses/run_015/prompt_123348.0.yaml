answer: |-
  The *mokusatsu* episode confirms Quine's view that meaning is always manual-relative and the manual was selected for non-linguistic reasons, demonstrating that the catastrophic divergence arose not from failing to locate a pre-existing semantic fact but from treating an indeterminate choice as a determinate discovery. Within Quine's radical-translation framework, the Allied translators function as field linguists constrained solely by stimulus meaning, where the behavioral evidence available in July 1945 consisted of Prime Minister Suzuki's utterance, the prior diplomatic context, and the absence of explicit surrender language. This evidence underdetermined the translation manual, rendering competing hypotheses empirically equivalent: a manual rendering *mokusatsu* as "contemptuous rejection" fit the observable behavior just as well as a manual rendering it as "strategic silence pending internal decision," since neither the speaker's private intentions nor the cabinet's unresolved internal vote were publicly observable stimuli. Quine's allowance for analytical hypotheses explains the divergence because translators must project assumptions to bridge the gap between stimulus and translation, and in this case, the hypotheses were shaped by the strategic context of total war rather than linguistic necessity. The Allies adopted analytical hypotheses prioritizing military caution and prior patterns of Japanese defiance, while the Japanese cabinet operated on hypotheses of diplomatic nuance, resulting in manuals that were behaviorally adequate but pragmatically incompatible. The strategic stakes do not reveal a practical determinacy excluded by behavioral criteria but rather highlight the danger of conflating pragmatic necessity with semantic fact; the decision to bomb was based on selecting a manual that facilitated action, not on uncovering a true meaning that existed independently of the manual. Consequently, the episode shows that translation is genuinely indeterminate rather than merely dangerously underdetermined, because there was no fact of the matter regarding the "true" meaning of *mokusatsu* beyond the translation manual adopted, and the catastrophic outcome resulted from forgetting that the chosen manual was a tool for coordination rather than a mirror of mental reality.
