      *   **Empirical Equivalence:** Are the competing manuals (Manual A: "reject/contempt" vs. Manual B: "withhold comment/no decision yet") empirically equivalent given the evidence *available at the time*?
          *   Quine argues that multiple manuals can fit all observable behavioral dispositions.
          *   In this case, the behavioral disposition (Suzuki's utterance) is compatible with both "we reject this" and "we are ignoring this for now." The internal mental state (intent) is inaccessible (Quine's behaviorism).
      *   **Analytical Hypotheses:** Quine allows for analytical hypotheses to bridge the gap between stimulus and translation. The choice between Manual A and Manual B depends on these hypotheses.
      *   **Strategic Stakes/Practical Determinacy:** The stakes (nuclear war) forced a choice. Does this choice reveal a "true" meaning that was ignored (underdetermination), or does it show that meaning is constituted by the manual chosen (indeterminacy)?
