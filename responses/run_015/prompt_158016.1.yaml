  ### Part 2: The Decision Tree

  **Instructions:** Start at Node 1. Answer based on your immediate reaction to the case described. Follow the arrow to the next node or the final leaf.

  **Node 1: The Standard Demon**
  A demon will torture you unless you believe the sky is green (you have no evidence it is green). Does the threat count in favour of **believing** the sky is green?
  *   **YES** $\rightarrow$ Go to Node 2.
  *   **NO** $\rightarrow$ Go to Node 3.

  **Node 2: The Normative Status (For "YES" responders)**
  You believe the sky is green to save your life. Is this belief **epistemically justified** (could you claim to know the sky is green)?
  *   **YES** $\rightarrow$ Go to Node 5.
  *   **NO** $\rightarrow$ **Leaf A: Monistic Practical**

  **Node 3: The Indirect Compliance (For "NO" responders)**
  You cannot believe at will. However, a pill exists that will induce belief in the sky is green. Does the threat count in favour of **taking the pill**?
  *   **YES** $\rightarrow$ Go to Node 4.
  *   **NO** $\rightarrow$ **Leaf B: Involuntarism**

  **Node 4: The Generality Test (For "YES Pill" responders)**
  Consider **Admiration**. A demon threatens you unless you admire a vile tyrant (who has no admirable qualities). Does the threat count in favour of **admiring** him?
  *   **YES** $\rightarrow$ **Leaf C: Object-Given/State-Given (Buck-Passing)**
  *   **NO** $\rightarrow$ Go to Node 5.

  **Node 5: The Encroachment Fork (For "NO Admire" responders)**
  Consider a **Moral Case**. You have marginal evidence that a social group is dangerous. Believing this would cause significant moral harm. Does the **moral cost** count against believing (affecting whether the belief is permissible/justified)?
  *   **YES** $\rightarrow$ **Leaf D: Moral Encroachment**
  *   **NO** $\rightarrow$ Go to Node 6.

  **Node 6: The Stakes Test (For "NO Moral" responders)**
  Consider a **High-Stakes Case**. You need to believe the bank is open to avoid ruin. Evidence is 95% sure. Does the **practical cost of error** make the belief **justified** (or constitute knowledge)?
  *   **YES** $\rightarrow$ **Leaf E: Pragmatic Encroachment**
  *   **NO** $\rightarrow$ **Leaf F: Evidentialism**

  **Node 5 Alternative (For "YES Epistemic" from Node 2)**
  *   **Leaf G: Pragmatic Encroachment (Monistic Variant)**
      *(Note: This leaf captures those who said YES to Demon Reason and YES to Justification).*

  ***

  ### Part 3: Indistinguishable Leaves

  **Flagged Pair:** **Leaf F (Evidentialism)** and **Leaf C (Object-Given/State-Given)**.
  *   **Why:** Both answer "NO" to the Demon Reason (Node 1) and "YES" to the Pill (Node 3). They diverge on the Admiration case (Node 4), but a strict Evidentialist about *belief* might suspend judgment on admiration, or a Buck-Passer might argue belief is special. On the core belief cases, their recommendations coincide.
  *   **Separating Question:** "Is the threat a reason *for you to want to believe*, or a reason *for the state of your believing to obtain*?" (This requires theoretical vocabulary, violating the case-only constraint).

  **Angle Check:**
  *   **Goal:** Separate Two Normative Relations vs. Difference in Reason-For vs. Artefact.
  *   **Result:** The tree *approximates* this but cuts primarily along **Intuitions about Case Outcomes**.
      *   *Two Relations:* Captured by **Evidentialism** (Leaf F) and **Moral Encroachment** (Leaf D) — they distinguish epistemic from practical/moral norms.
      *   *Difference in Reason-For:* Captured by **O-G/S-G** (Leaf C) — they distinguish reasons for attitudes vs. reasons for states/desires.
      *   *Artefact/Dissolution:* Captured by **Monistic Practical** (Leaf A) and **Pragmatic Encroachment** (Leaf E/G) — they dissolve the barrier between practical and epistemic reasons/status.
  *   **Limitation:** The tree cannot perfectly isolate the "Reason-For" distinction without asking theoretical questions. It sorts by *whether* the reason counts, not *what* it is a reason for.

