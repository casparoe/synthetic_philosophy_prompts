answer: |-
  Here is the **20-Minute Downward Causation Audit**. It is designed to be run on architecture diagrams, data-flow graphs, and API specs without touching a terminal. It operationalizes Hofstadter's "symbols shoving substrate" vs. "simmballs bubbling" distinction into engineering terms.

  ### The 20-Minute Downward Causation Audit

  **Prerequisites:** Open the model's architecture diagram, the data-flow graph, and the module interface definitions. Set a timer.

  #### Step 1: Direct Symbol-to-Substrate Intervention (The "Lever" Check)
  **Goal:** Determine if high-level symbolic states can force low-level substrate states to change *without* flowing through the standard bottom-up sensory pipeline.

  *   **What to look for:** Search the docs for "override," "injection," "skip-connection," or "conditional execution" where a discrete variable (symbol) directly modifies a continuous vector (substrate/hidden state).
  *   **PASS (Symbol-Push):** You find an explicit architectural pathway where a symbolic variable (e.g., a flag, a token ID, a logic state) mathematically alters the hidden state vector *before* the next forward pass calculation. The symbol acts as a lever.
  *   **FAIL (Substrate-Only):** Symbols are read-only. They are generated *from* the substrate (e.g., via a classification head) but never fed back in to alter the substrate dynamics directly. They are epiphenomenal read-outs. **Stop here. Flag as Substrate-Only.**
  *   **KICK TO PI (Values Call):** The docs show a feedback loop, but it's unclear if the "symbol" is a discrete causal unit or just a compressed representation of the substrate. Deciding if a compressed vector *counts* as a symbol is a philosophical boundary call, not an engineering fact.

  #### Step 2: Substrate-Invariance (The "Multiple Realizability" Check)
  **Goal:** Determine if the symbolic logic is decoupled from the specific physical (or numerical) realization.

  *   **What to look for:** Check module boundaries. Is the "symbolic" component a distinct module with a defined interface, or is it smeared across the weights of a neural layer?
  *   **PASS (Symbol-Push):** The symbolic module is swap-able. You could theoretically replace the neural substrate with a different one (e.g., swap a CNN for a ViT) and the symbolic planner would still function without retraining, provided the interface signatures match.
  *   **FAIL (Substrate-Only):** The "symbols" are distributed representations. You cannot isolate a specific neuron or weight cluster that corresponds to a symbol without breaking the function. The symbol is inseparable from the specific substrate configuration. **Stop here. Flag as Substrate-Only.**
  *   **KICK TO PI (Values Call):** The system uses "soft" symbols (e.g., sparse autoencoder features). They are statistically distinct but not architecturally modular. Deciding if statistical distinctness counts as "real" causation is a values call.

  #### Step 3: Temporal Precedence (The "Before" Check)
  **Goal:** Determine if the symbolic decision happens *before* the substrate update that executes it.

  *   **What to look for:** Trace the time-steps in the data-flow graph. Does the symbolic state $S_t$ determine the substrate update $H_{t+1}$, or does $H_t$ determine $S_t$?
  *   **PASS (Symbol-Push):** The graph shows the symbolic state is computed, locked, and *then* used to gate or direct the substrate update for the next step. The symbol is the cause; the substrate change is the effect.
  *   **FAIL (Substrate-Only):** The symbol is generated in parallel with or *after* the substrate update that actually drives the output. The symbol is a commentary on the action, not the driver of it. **Stop here. Flag as Substrate-Only.**
  *   **KICK TO PI (Values Call):** The system is recurrent (RNN/Transformer). The symbol and substrate update simultaneously in a coupled loop. You cannot disentangle which came "first" in a meaningful causal sense.

  ---

  ### Handling Hard Coupled-Feedback Cases
  **The "Tangled Wire" Scenario:**
  In many modern architectures (especially recurrent ones), the "symbol" (e.g., a token) is embedded immediately back into the "substrate" (hidden state) in the same time-step.
  *   **Procedure:** If you identify a hard coupled-feedback loop where the symbol cannot be mathematically isolated from the substrate update vector, **mark the check as INDETERMINATE.**
  *   **Action:** Do not pass or fail. Flag as "Hard Coupled." This requires the PI to decide if the coupling is tight enough to dissolve the symbol/substrate distinction entirely. This is where Hofstadter's "simmballs" live—they look like symbols but are just substrate resonances.

  ---

  ### Application 1: Classic Symbolic Planner + Neural Perception Front-End
  **Architecture:** CNN Vision System $\rightarrow$ Object List (Symbols) $\rightarrow$ PDDL Planner $\rightarrow$ Motor Commands.
  **Docs:** Clear separation between perception module and planning module. Planner uses discrete logic states.

  *   **Step 1 (Intervention):** **PASS.** The Planner (symbols) sends commands to the motor controller (substrate) that override the neural net's raw impulses. The symbol shoves the substrate.
  *   **Step 2 (Invariance):** **PASS.** You could swap the CNN for a LiDAR system; the Planner doesn't care. The symbols are modular.
  *   **Step 3 (Precedence):** **PASS.** The Plan is computed *before* the motor command is issued.
  *   **Verdict:** **Real Symbol-Push.**
  *   **Why you won't like this answer:** This system is "old tech" (GOFAI). Confirming it has *real* top-down causation while the fancy neuro-models might not implies that the "intelligence" in your Neuro-AI lab might be philosophically hollow compared to a 1980s planner. It suggests the "Neuro" part is just a fancy sensor, and the "AI" part is just rigid code. It hurts the hype of your internship.

  ### Application 2: Reasoning LLM with Chain-of-Thought (CoT) Looping
  **Architecture:** Transformer. CoT tokens generated $\rightarrow$ Embedded $\rightarrow$ Fed back into Hidden State $\rightarrow$ Next Token.
  **Docs:** Tokens are discrete, but embeddings are continuous. Feedback is immediate within the forward pass sequence.

  *   **Step 1 (Intervention):** **HARD COUPLED.** The token (symbol) is immediately converted to an embedding vector (substrate). You can't intervene on the token without changing the vector.
  *   **Step 2 (Invariance):** **FAIL.** The "reasoning" is distributed across attention heads. You cannot swap the "logic" module without retraining the whole weights.
  *   **Step 3 (Precedence):** **INDETERMINATE.** The token is generated by the substrate, then fed back to the substrate. It's a loop, not a hierarchy.
  *   **Verdict:** **Substrate-Only (with Hard Coupled Caveat).** The CoT tokens look like symbols, but architecturally they are just intermediate activations bubbling up from the weights. They are simmballs, not symbols.
  *   **Note:** If you tried to argue this *passes*, you'd have to claim that "autocomplete with extra steps" counts as downward causation, which trivializes the philosophy.

  ---

  ### What This Procedure Definitely Cannot Settle
  1.  **Emergence:** A model might fail this check (no designed symbol pathways) but still *emerge* symbolic behavior during inference. This checklist only audits *design intent*, not *phenomenology*.
  2.  **The "Realness" of Causation:** Even if the Planner passes, a hard determinist could argue the symbols are still just physical states shoving other physical states. This checklist identifies *architectural abstraction layers*, not metaphysical freedom.
  3.  **Learning Dynamics:** Since this is docs-only, it misses whether the model *learns* to route causality top-down over time. A substrate-only start could learn symbol-like gating.

  ### Summary for your PI
  *   **Planner:** Passes. High causal clarity. Low "neuro" novelty.
  *   **LLM:** Fails/Indeterminate. High "neuro" novelty. Low causal clarity.
  *   **Recommendation:** If the lab cares about *explainable causation*, pivot to hybrid architectures. If they care about *performance*, ignore this audit (substrate-only models win benchmarks).

  *(Note: I rolled with the typos as requested. No bibliography included.)*
