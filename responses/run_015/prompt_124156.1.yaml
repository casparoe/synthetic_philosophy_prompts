answer: |-
  ### Exam Question

  **Course:** Decision Theory Seminar (Upper-Level)
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  Functional Decision Theory (FDT) prescribes paying in the Counterfactual Mugging but refusing in the XOR Blackmail scenario. However, rote memorization of these outcomes is insufficient for understanding the underlying decision-algorithm evaluation.

  Consider the **XOR Charity Appeal**: A perfect predictor sends you a letter requesting a $100 donation to famine relief. The letter is sent if and only if: (Victim Exists AND Predictor foresees Donation) OR (No Victim AND Predictor foresees No Donation). You value saving the victim at $10,000. If the victim exists and you do not donate, you lose $10,000 in value (regardless of whether you receive the letter). If no victim exists, nothing is at stake.

  Write an essay addressing the following:
  1.  Explain the mechanism by which FDT evaluates policies in Counterfactual Mugging and XOR Blackmail. Specifically, why does the policy selection alter the expected utility in these cases differently?
  2.  Derive the FDT prescription for the **XOR Charity Appeal**. Show your reasoning regarding the correlation between the policy and the state of the world.
  3.  Based on your derivation, articulate the fundamental difference between the Counterfactual Mugging and the XOR Blackmail/Charity structures that drives FDT's divergent recommendations.
  4.  Briefly explain why Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) would fail to maximize utility in the XOR Charity Appeal.

  *(Expected length: approx. 1,000 words)*

  ***

  ### Model Answer

  Functional Decision Theory (FDT) differs from CDT and EDT by evaluating the output of the decision *algorithm* (the policy) rather than the specific physical action or its evidential correlation. FDT agents choose the policy $\pi$ that maximizes expected utility, recognizing that a perfect predictor’s output is subjunctively dependent on $\pi$.

  In the **Counterfactual Mugging**, Omega offers $10,000 if they predicted you would pay $100 upon request. If FDT adopts the policy "Pay if asked," Omega predicts this, and the opportunity is created. If FDT adopts "Refuse," Omega predicts this, and the opportunity never arises. Thus, the policy causally determines the existence of the payoff opportunity via the prediction. FDT pays because the policy "Pay" yields a world with the money on the table, whereas "Refuse" yields a world without it.

  In **XOR Blackmail**, a blackmailer sends a demand iff (Disaster & Predict Pay) OR (No Disaster & Predict ~Pay). Standard formulations assume the disaster is only inflicted if contact is made (or the blackmailer controls the threat). If FDT adopts "Pay," the letter arrives iff Disaster. If FDT adopts "Refuse," the letter arrives iff No Disaster. FDT refuses because the policy "Refuse" ensures that receiving the letter is evidence of safety (No Disaster), allowing the agent to pay $0. The policy "Pay" ensures receiving the letter is evidence of Disaster, forcing a $100 payment to avert loss. FDT prefers the world where the letter signals safety.

  Applying this to the **XOR Charity Appeal**, we must evaluate the policies "Donate" and "Do Not Donate."
  If Policy = **Donate**: The predictor foresees donation. The letter is sent iff a Victim Exists. If the letter arrives, a Victim exists. You donate $100 and save the victim (+$10,000 value). Net utility: +$9,900. If no letter arrives, No Victim exists. Net utility: $0.
  If Policy = **Do Not Donate**: The predictor foresees no donation. The letter is sent iff No Victim Exists. If the letter arrives, No Victim exists. You pay $0. Net utility: $0. Crucially, if the letter does *not* arrive (meaning Victim Exists), you do not donate. Since the victim's suffering is independent of the letter, the victim suffers, and you lose $10,000 in value.

  Comparing the expected utilities: The "Donate" policy yields high utility when victims exist (which is the state where help is needed). The "Do Not Donate" policy yields negative utility when victims exist (because the lack of a letter prevents you from knowing, but the loss occurs anyway). Therefore, FDT prescribes **Donating**.

  This reveals the fundamental difference between Counterfactual Mugging and XOR Blackmail/Charity. In Counterfactual Mugging, the *opportunity* is subjunctively dependent on the policy; paying creates the winning world. In XOR scenarios, the *signal* (the letter) is dependent on the policy. The divergence between Blackmail (Refuse) and Charity (Donate) lies in the **independence of the stakes**. In XOR Blackmail (where FDT refuses), the loss is typically contingent on the interaction (the blackmailer only harms if contacted). By refusing, you avoid contact when harm is present. In XOR Charity, the loss (victim suffering) is objective and independent of the letter. Refusing the donation policy means you remain ignorant of the victim, but the victim still suffers. FDT pays in Mugging to create opportunity; FDT refuses Blackmail to avoid contingent threats; FDT donates in Charity to address independent needs despite informational screening.

  **CDT and EDT failures:**
  CDT fails because it treats the prediction as a fixed past event. It reasons: "The letter is already sent. My donation cannot change whether the victim exists." It refuses to donate, ignoring that its policy determined the correlation between the letter and the victim's existence.
  EDT fails because it conditions on the action as evidence. If I donate, EDT reasons this is evidence that the predictor predicted donation, which implies the letter was sent iff Victim. However, EDT often struggles with the "screening off" effect of the letter. More critically, EDT might refuse because it sees the donation as a cost with no causal power to change the victim's status *given the letter*, failing to recognize that the policy choice determines *which world state triggers the letter*. Only FDT correctly identifies that the policy choice selects the mapping between reality and information.

  ***

  ### Marking Scheme

  **Total Marks: 20**

  **1. FDT Policy Mechanism (4 Marks)**
  *   **Requirement:** Candidate must explain that FDT selects a policy $\pi$ based on subjunctive dependence, where the predictor's output is treated as a function of the agent's algorithm, not a fixed past event.
  *   **Mistake costing marks:** Treating the predictor's action as causally independent of the current decision (CDT error) or merely evidentially correlated without policy control (EDT error).

  **2. Counterfactual Mugging Analysis (4 Marks)**
  *   **Requirement:** Candidate must explain that paying is prescribed because the policy "Pay" causes the predictor to create the opportunity/reward, whereas "Refuse" results in no opportunity.
  *   **Mistake costing marks:** Stating "FDT pays" without explaining that the *existence of the payoff* depends on the policy selection.

  **3. XOR Blackmail Analysis (4 Marks)**
  *   **Requirement:** Candidate must explain that refusing is prescribed because the policy "Refuse" correlates the letter with "No Disaster," allowing the agent to avoid payment in the only scenario they are contacted.
  *   **Mistake costing marks:** Claiming FDT refuses because "paying doesn't stop the disaster" (ignoring the XOR correlation logic) or failing to mention the correlation between policy and the letter's informational content.

  **4. XOR Charity Derivation (4 Marks)**
  *   **Requirement:** Candidate must derive that FDT **Donates**. Reasoning must show that under "Do Not Donate," the agent loses $10,000 when the victim exists (no letter sent), whereas "Donate" saves the victim when the letter arrives.
  *   **Mistake costing marks:** Concluding FDT refuses the Charity appeal (failing to distinguish independent stakes from contingent threats) or claiming the loss is avoided if no letter is received.

  **5. CDT/EDT Critique (4 Marks)**
  *   **Requirement:** Candidate must identify that CDT ignores the subjunctive link (treating prediction as fixed) and EDT fails to account for the policy's role in determining the *condition* under which the letter is received (screening off).
  *   **Mistake costing marks:** Vaguely stating "they are wrong" without specifying the conditioning error (CDT) or the policy-dependence error (EDT).

