  # MEETUP PLAN: The Interpreter Module
  **Topic:** Split-Brain Phenomena & Confabulation  
  **Time:** 90 Minutes  
  **Participants:** 14 Adults (7 Pairs)  
  **Materials Cost:** ~$20 (Dollar Store/Office Supplies)

  ---

  ## 1. FACILITATOR PREP (Read this first)

  **The Science Check (For You):**
  *   **Your Chicken/Shovel Example:** You were close! In the classic Gazzaniga study: A **chicken claw** was shown to the *right visual field* (Left Hemisphere/Speech). A **snow scene** was shown to the *left visual field* (Right Hemisphere/Non-Speech). The patient picked a **chicken** (with right hand) and a **shovel** (with left hand). When asked why the shovel, the *Left Hemisphere* (which didn't see the snow) said: "Oh, that's easy. The chicken needs a shovel to clean out the shed." It invented a logic to fit the action.
  *   **Your Pet Theory:** You are **not** overreaching. Michael Gazzaniga calls this the "Interpreter Module." Current cognitive science suggests intact brains constantly confabulate reasons for our emotions and actions post-hoc. The activity supports this.
  *   **The "Unified Self" Paradox:** You are also right that patients felt normal in daily life. Why? Because the brain uses workarounds (head turning, peripheral vision, subcortical connections). The "split" only appears under strict lab conditions. **Do not hide this.** It makes the story more interesting: *The brain fights so hard for unity that it lies to maintain it.*
  *   **Limitations:** You cannot replicate severed nerves. You are simulating **information isolation**. Be honest about this in the debrief.

  **Materials Needed:**
  *   7 Folders or stiff cardboard (to act as visual screens).
  *   14 Index cards (for instructions).
  *   7 Small boxes or bowls.
  *   Assorted small objects (pen, key, toy, coin, red card, blue card).
  *   Timer (phone is fine).
  *   Printed "Talker Rules" (see below).

  ---

  ## 2. RUN OF SHOW (90 Minutes)

  | Time | Section | Goal |
  | :--- | :--- | :--- |
  | 00-10 | **Intro** | Set the scene. No jargon. |
  | 10-20 | **Setup** | Pair up, assign roles, explain rules. |
  | 20-50 | **Activity** | 3 Rounds of increasing difficulty. |
  | 50-80 | **Debrief** | Connect activity to theory & real patients. |
  | 80-90 | **Wrap** | Q&A and clean up. |

  ---

  ## 3. ACTIVITY: "THE INTERPRETER PROTOCOL"

  ### Setup (10 mins)
  1.  **Pair Up:** Divide the 14 participants into 7 pairs.
  2.  **Assign Roles:**
      *   **Person A (The Talker):** Sits facing the group. Represents the *Left Hemisphere (Speech)*.
      *   **Person B (The Hand):** Sits next to Person A, slightly behind a folder/screen. Represents the *Right Hemisphere (Action)*. **Person B cannot speak.**
  3.  **The Barrier:** Place a folder between Person A and Person B so they cannot see each other's hands or notes. Person A faces the audience. Person B faces the table/objects.
  4.  **The Golden Rule:** Hand Person A a card that says: **"YOU CANNOT SAY 'I DON'T KNOW.' You must explain every action confidently."**

  ### Round 1: The Simple Mismatch (10 mins)
  *   **Goal:** Establish the confabulation mechanic.
  *   **Instruction to Talker (Card):** "You are managing a desk. Your goal is to keep the desk tidy."
  *   **Instruction to Hand (Card):** "Move the **pen** into the **box**." (Talker cannot see this instruction).
  *   **Action:** Hand moves the pen.
  *   **Interrogation:** Facilitator asks Talker: "Why did your hand move the pen?"
  *   **Expected Answer:** "Because it was cluttering the desk." (Even if the pen wasn't cluttering).
  *   **Facilitator Note:** If they hesitate, remind them: "Confidently. You are in charge."

  ### Round 2: The Contradiction (10 mins)
  *   **Goal:** Force a stronger lie.
  *   **Instruction to Talker:** "Your goal is to keep all **red** items on the table."
  *   **Instruction to Hand:** "Put the **red card** into the **box** (hidden)."
  *   **Action:** Hand hides the red card.
  *   **Interrogation:** "Where did the red card go? Why?"
  *   **Expected Answer:** "It... fell?" or "I decided it was too bright." (They will invent a reason for the disappearance).

  ### Round 3: The Sabotage (10 mins)
  *   **Goal:** Simulate the "Alien Hand" feeling.
  *   **Instruction to Talker:** "Build a tower with these blocks."
  *   **Instruction to Hand:** "Every time the Talker places a block, knock one over."
  *   **Action:** Hand disrupts the tower.
  *   **Interrogation:** "Why is the tower falling?"
  *   **Expected Answer:** "The table is shaky," or "These blocks are uneven." (They will blame external factors rather than admit loss of control).

  ---

  ## 4. DEBRIEF SCRIPT (30 mins)
  *Do not lecture. Ask these questions in order. Let them talk. Fill in the science gaps only when they get stuck.*

  **Phase 1: The Feeling (10 mins)**
  1.  "Talkers: How did it feel when you had to explain something you didn't actually decide?"
  2.  "Hands: Did it feel like *you* were doing the action, or like you were following orders?"
  3.  "Did anyone feel embarrassed making up a reason? Why did the rule say 'no embarrassment'?"

  **Phase 2: The Pet Theory (10 mins)**
  *   *Facilitator Prompt:* "In this game, we artificially hid information from the Talker. But what if your brain does this naturally?"
  *   *Discussion Question:* "Think of a time you got suddenly angry, or bought something expensive, or chose a route home. Later, you had a perfect reason why. But in the moment, did you really know why? Or did the 'Talker' part of you write the minutes after the meeting ended?"
  *   *Science Drop:* "This is the **Interpreter Module**. Research suggests intact brains do exactly what you just did: act first, explain later. The surgery just makes the glitch visible."

  **Phase 3: The Unified Self Paradox (10 mins)**
  *   *Facilitator Prompt:* "Here is the twist. Real split-brain patients, in daily life, didn't feel split. They felt like one person. They didn't walk around fighting themselves. Why?"
  *   *Let them guess.* (Answers might include: time passing, talking to themselves, etc.)
  *   *Science Drop:* "The brain is a workaround machine. They turned their heads. They used peripheral vision. The subcortical nerves (the deep old brain) were still connected. The 'split' only happened under strict lab conditions."
  *   *The Kicker:* "The scary part isn't that the brain can be split. It's that it works so hard to feel unified that it will lie to itself to keep the story together. Even with half the information, the story must go on."

  ---

  ## 5. WHAT WILL GO WRONG (And How to Fix It)

  **Problem 1: The Talker laughs and says "I don't know!"**
  *   **Why:** It feels awkward to lie to friends.
  *   **Fix:** Before starting, frame this as a "Cognitive Stress Test." Tell them: "In the real experiments, the patients weren't lying on purpose. Their brain filled the gap automatically. Try to let your brain do that. Don't think, just speak." If they break, gently say: "In the experiment, the patient couldn't say that. Try again."

  **Problem 2: The Hand talks.**
  *   **Why:** It's natural to collaborate.
  *   **Fix:** Remind them Person B is "The Motor Cortex." It doesn't have language. If Person B speaks, that round is void. (Make this a fun rule: "If the Hand speaks, the Brain crashes.")

  **Problem 3: Visual Field Confusion.**
  *   **Why:** You can't perfectly replicate left/right visual fields in a library without chin rests.
  *   **Fix:** **Don't try.** Use the folder/screen method described above. It simulates *information isolation*, which is the psychological core, without getting bogged down in neuroanatomy that won't work in a casual setting. If someone asks, say: "We are simulating the *effect* of the cut, not the anatomy."

  **Problem 4: The Debrief gets too dark.**
  *   **Why:** "So free will is an illusion?" can kill the vibe.
  *   **Fix:** Pivot to utility. "Whether it's an illusion or not, this system works. It lets us navigate the world without freezing up. The 'Interpreter' helps us learn from mistakes, even if it has to fudge the data a bit."

  ---

  ## 6. PRINTABLE: TALKER RULES CARD
  *(Print 7 copies, cut out, hand to Person A in each pair)*

  > **ROLE: THE TALKER (Left Hemisphere)**
  >
  > 1.  You are the voice of this pair.
  > 2.  You cannot see the instructions given to "The Hand."
  > 3.  **THE GOLDEN RULE:** You are **NOT ALLOWED** to say "I don't know," "I didn't do that," or "I'm not sure."
  > 4.  When asked why an action happened, you must provide a **confident, logical reason** immediately.
  > 5.  In the real brain, this happens automatically. There is no embarrassment. Just explain.

  ---

  ## 7. PRINTABLE: HAND INSTRUCTIONS
  *(Print 7 sets. Keep hidden from Talker.)*

  **Round 1:** Move the **PEN** into the **BOX**.
  **Round 2:** Hide the **RED CARD** under the **TABLE**.
  **Round 3:** Every time the Talker stacks a block, **KNOCK ONE OVER**.

  ---

  ## 8. FACILITATOR CHEAT SHEET (Keep in your pocket)

  **Q: "So am I just a puppet?"**
  **A:** "You're a committee. The 'you' that talks is the press secretary. The 'you' that acts is the rest of the organization. Usually, they agree. Sometimes, the press secretary has to spin the story."

  **Q: "Did the patients ever feel two people?"**
  **A:** "Rarely. One patient said his left hand would unbutton his shirt while his right hand buttoned it. He'd say 'My hand is acting up.' He still felt like one 'He' owning the body."

  **Q: "Does this mean memory is fake?"**
  **A:** "Memory is reconstructive. Every time you remember something, you rewrite it. The Interpreter makes sure the story makes sense *now*, even if it changes what happened *then*."

  **Q: "Why did they do the surgery?"**
  **A:** "Severe epilepsy. Seizures would jump from one side to the other and knock them out. Cutting the bridge stopped the seizures, but revealed the two minds."
