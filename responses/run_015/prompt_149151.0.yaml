answer: |-
  Your suspicion is well-founded. This argument is a classic example of what philosophers call **"Gödelian Abuse"**—the tendency to treat Gödel's Incompleteness Theorems (GIT) as a mystical metaphor for "limits of knowledge" rather than a precise technical result about formal axiomatic systems.

  You are correct to target **(3)**. That is where the chain snaps. However, to fully defend **(6)** (that moral reasoning is real and valid) and understand the status of **(7)** (that this is a category mistake), we need to look at *why* (3) fails. It fails on three specific technical grounds that the argument glosses over.

  Here is the breakdown of where the argument breaks, why it breaks there, and what you are stuck with if you reject the alternative steps.

  ### The Critical Break: Step (3)

  > *(3) Moral reasoning also involves complex rule-following, and any ethical system rich enough to guide real action can represent arithmetic... so the same logical gap applies...*

  This step commits a **category error regarding formalization**. For Gödel's theorem to apply, a system must meet three strict conditions that ethical systems do not meet:

  1.  **Strict Syntax:** The system must be a formal axiomatic system (like *Principia Mathematica*), where rules of inference are mechanical and syntax is distinct from semantics.
      *   *Ethics:* Ethical reasoning is dialectical, interpretive, and contextual. Even rigid deontological systems (like Kant's) are not formalized in first-order logic with recursive rules of inference. They are natural language arguments.
  2.  **Arithmetic Encoding:** The system must be able to encode Peano arithmetic (basic number theory). This is required to construct the "Gödel sentence" (a statement that essentially says, "I am unprovable").
      *   *Ethics:* The argument claims "weighing obligations" counts as arithmetic. This is a **metaphorical equivocation**. Comparing the value of two lives is not the same as asserting $2 + 2 = 4$. You cannot construct a self-referential Gödel sentence out of the concept of "obligation" unless you have first reduced moral values to integers, which no serious ethical theory does.
  3.  **Truth vs. Provability:** GIT relies on a distinction between "provable within the system" and "true in the standard model."
      *   *Ethics:* This assumes **Moral Realism** (that there are objective moral facts independent of our systems). If you are a moral anti-realist or constructivist, there are no "true moral judgments" waiting to be unproven. If you are a realist, you still lack the "standard model" of morality required to define truth independently of the system.

  **If you reject (3):** You stop the slide into skepticism. You maintain that ethics is not a formal axiomatic system, so GIT is irrelevant. This saves moral reasoning from being "incomplete" in the Gödelian sense. It might be *difficult* or *indeterminate*, but not logically incomplete due to arithmetic encoding.

  ### The Secondary Slip: Step (4) and (5)

  Even if we grant (3) for the sake of argument, steps (4) and (5) introduce further equivocations that threaten your desire to keep **(6)**.

  > *(4) ...we have to fall back on intuition for the leftover cases.*
  > *(5) ...there's no reason to think those leftover moral truths are universal... they start looking like private feelings.*

  **The False Dilemma:** Step (4) assumes that if a formal system fails, the only alternative is "intuition" (conceived as non-rational gut feeling).
  *   **Correction:** In philosophy, the alternative to axiomatic deduction is often **Reflective Equilibrium** (Rawls) or **Phronesis** (Aristotle). These are rational processes that involve adjusting principles to match considered judgments and vice versa. They are not "formal proofs," but they are not "private feelings" either. They are public, reason-giving practices.

  **The Epistemic Slide:** Step (5) claims that if reason can't prove it, it can't be universal.
  *   **Correction:** This conflates *ontology* (what is true) with *epistemology* (how we know it). A moral truth could be universal even if our access to it requires judgment rather than calculation. (Analogy: Aesthetic judgments can be reasoned about and shared, even if there is no "formula" for beauty).

  **If you reject (4) & (5):** You preserve the rationality of ethics without needing it to be mathematical. You acknowledge that moral reasoning is a different *kind* of rationality (practical reason) than mathematical reasoning (theoretical reason).

  ### The "Science" Premise: Steps (1) and (2)

  You mentioned you want to keep **(1)** and **(2)**. I should offer a gentle caution here. While less egregious than the ethical application, applying GIT to physics is also controversial.

  *   **The Hawking Shift:** Stephen Hawking initially argued that a Theory of Everything would be incomplete due to Gödel. He later reversed this position, noting that physics is not about *all* mathematical truths, but only those that describe *physical reality*. A physical theory doesn't need to decide every arithmetic statement, only every physical one.
  *   **Truth vs. Empirical Adequacy:** In math, "true" means valid in a model. In science, "true" usually means "empirically accurate." A scientific theory isn't "incomplete" if it can't prove a mathematical theorem; it's only incomplete if it fails to predict a physical phenomenon.

  **If you keep (1) & (2):** You are aligning with a specific school of thought (often associated with Penrose or early Hawking) that views the universe as essentially mathematical. This is defensible, but you must accept that "scientific incompleteness" is different from "logical incompleteness." Science is open-ended; GIT is about syntactic undecidability.

  ### The Verdict on Step (7)

  > *(7) So Gödel's theorems must be confined to pure mathematics, and anyone who exports them into philosophy of mind or ethics is making a category mistake.*

  This conclusion is **mostly correct**, but for a nuanced reason. It is not that Gödel's theorems are *magically* confined to math. It is that the **prerequisites** for the theorems (formal axiomatic structure, arithmetic encoding, distinct truth/provability) are rarely found outside of math and logic.

  *   **Philosophy of Mind:** Some (like Lucas and Penrose) argue GIT applies to the mind to prove humans aren't computers. This is widely criticized because it assumes the human mind is a *consistent* formal system, which is unproven.
  *   **Ethics:** As discussed, ethics lacks the formal structure.

  So, (7) is valid, not because philosophy is "non-mathematical," but because ethical reasoning is not an **axiomatic formal system**.

  ### Summary: How to Respond in Your Group

  To dismantle the argument while keeping your preferred positions (1, 2, 6), you can make this move:

  1.  **Concede the Math:** Agree that GIT applies to any system meeting specific formal criteria (Step 1).
  2.  **Challenge the Mapping (Step 3):** Argue that ethical systems are not formal axiomatic systems. "Weighing obligations" is a metaphor, not an encoding of Peano arithmetic. Without arithmetic encoding, you cannot construct a Gödel sentence.
  3.  **Challenge the Truth Condition:** Point out that GIT requires a distinction between "provable" and "true." In ethics, the existence of "true moral facts" independent of our reasoning is the very thing being debated. You can't use GIT to prove limitations on moral truth if you haven't established moral truth exists in the required sense.
  4.  **Defend Moral Reasoning (Step 6):** Argue that moral reasoning operates via **Reflective Equilibrium**, not axiomatic deduction. It is rational without being formal. Therefore, the "incompleteness" of ethics is not a logical bug, but a feature of practical reason.

  **The "Slip" in one sentence:** The argument equivocates between **logical incompleteness** (a specific syntactic property of formal systems) and **explanatory open-endedness** (the general inability of any system to capture every nuance of reality). Ethics suffers from the latter, but Gödel only describes the former.

  By rejecting (3), you save (6). You can affirm that moral reasoning is real, rational, and universalizable without needing it to be a formal system subject to Gödel's theorems.
