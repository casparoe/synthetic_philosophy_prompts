  **The Toast**

  Good evening. For those who don't know me, I'm the best man and the groom's brother. Which means I've spent the last decade listening to him talk about a stranded motorist.

  It's a simple story. A car breaks down on an empty road. A driver passes by. The motorist promises to pay the driver once they reach the nearest town. But here is the catch: once they are in town, the motorist has the money, the driver has no leverage, and the motorist has no reason to pay. A perfectly rational person would keep the cash. The driver knows this. So the driver keeps driving. The motorist stays stranded.

  My brother has built a career on this stuck car. He argues that to get the ride, you cannot be the kind of person who calculates whether keeping a promise is useful. You have to be the kind of person who keeps it simply because you said you would. Even when it costs you. Even when no one is watching. Even when it makes no sense.

  He worries that you can't just decide to be that person on Tuesday because it helps you on Wednesday. If the driver sees you calculating the benefit of being honest, they won't trust you. They want a promise that comes from somewhere deeper than a spreadsheet.

  Looking around this room, I think I see where that depth comes from.

  It comes from the back table, where his grandmother is sitting. She doesn't worry about the motorist. She believes the vow binds because it is made before God. That is not a calculation. It is a foundation. And for those of us who don't share her exact theology, we can still respect the mechanics of it: it anchors the promise in something neither of them can move.

  It comes from the town they both grew up in. There are habits drilled into people there—about showing up, about shaking hands, about debt—that aren't chosen for their utility. They are inherited. They are the sort of disposition you have before you even know you need it.

  And it comes to this marriage through [Bride's Name]. As an emergency physician, she does not stand over a patient and calculate the equilibrium of triage. She acts. She has trained herself to respond to need, not to incentive. In the ER, there is no time for the motorist's paradox. You do the work because it is the work.

  So, [Groom's Name], you have spent ten years worrying that rationality leaves you stranded. But tonight, you are not relying on your rationality. You are relying on your history. You are relying on the habits you didn't choose and the faith you don't have to justify to us.

  There is one phrase in the vows I want to highlight. "Till death do us part." In my brother's language, this isn't just poetry. It is a structural constraint. If a contract has a known end date, people start calculating when to leave before the date arrives. It unravels from the end backward. But a promise with no known exit ramp forces you to drive differently. It removes the option of calculating the cost of staying.

  I am not going to stand here and tell you that love solves the paradox. I don't think [Groom's Name] would forgive me, and I don't think it's true. The motorist is still stranded in the theory. But the driver is here. She is willing to pick you up. And you are promising to pay, not because it is rational, but because you are the sort of man who pays.

  To the motorist and the driver. To the promise that holds when the reason fades. To [Groom's Name] and [Bride's Name].

  ***

  **Note on Philosophical Confidence**

  **Confidence Level:** Moderate to High on the framing; Moderate on the specific game-theoretic claims.

  **The "Acquired Disposition" Worry:**
  I am reasonably confident that your brother's objection is a live problem, though his specific formulation is a sharp, idiosyncratic cut on existing literature. This touches on the debate surrounding **David Gauthier's *Morals by Agreement***. Gauthier argues it is rational to cultivate a "constrained maximization" disposition. However, critics (like **David Copp** or **David Sobel**) have argued that if the disposition is adopted *solely* because it is utility-maximizing, it remains vulnerable to "self-effacement" or transparency problems. If the agent knows they are keeping a promise *only* because it was useful to become a promise-keeper, the commitment is fragile in the exact moment of temptation. Your brother's insistence that the disposition must come from "somewhere he did not calculate his way into" aligns with **Robert Frank's *Passions Within Reason***, which argues that emotional commitments work precisely because they are not calculated. I have treated this as a valid, contested philosophical position rather than a solved puzzle.

  **The Least Sure Claim (The "Unraveling" Argument):**
  The specific claim I am least sure of is the game-theoretic validity of the "till death do us part" prevents backward induction.
  *   **The Liberty Taken:** In repeated game theory, an *indefinite* horizon (unknown end point) allows for cooperation (Folk Theorems), whereas a *finite* horizon leads to unraveling. However, death is a *certain* endpoint, even if the *timing* is unknown. Strictly speaking, a known terminal state (death) should still trigger backward induction in a purely rational model, unless the probability of continuation is high enough to discount the end.
  *   **The Risk:** A philosopher in the audience might argue that "death" is a known period $T$, and therefore the unraveling still applies. I have hedged this in the speech by framing it as "no known exit ramp" (focusing on the inability to calculate the *time* of the end) rather than claiming it creates a mathematically infinite game. This is the weakest link theoretically, but it holds up rhetorically as an explanation for why the *wording* of the vow matters structurally.

  **Other Liberties:**
  I have simplified the "transparency" issue. In the literature, whether a disposition is "transparent" to an observer is a complex signaling problem. I have assumed for the sake of the toast that the family/habits provide a "black box" that the driver (the bride) can trust more than a calculated decision. This is a pragmatic reading rather than a rigorous proof.
