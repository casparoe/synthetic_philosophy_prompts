answer: |-
  **Exam Question**

  **Question 1 (60 Minutes)**
  Consider the following proposal: an artifact is political *in itself* just in case the political effect it produces is robust across nearby variations in the intentions, stated purposes, and social context of its makers and users, with only its design held fixed (the "Invariance Test"). A critic objects that locks, staircases, and revolvers pass this test but are not inherently political, rendering the claim empty.

  Apply the Invariance Test to the following case: A housing cooperative installs a keyless entry system that logs every entry to a shared, permanent, resident-readable ledger. It is marketed as a convenience feature for tracking contractors. Within a year, residents use the ledger to monitor one another, shifting norms from mutual trust to mutual accountability. A privacy-absolutist commune installing the identical system would likely end in the same place.

  Does this case vindicate, refine, or undermine the Invariance Test? Does it support the distinction between artifacts that are political *in themselves* versus those political only *given their circumstances*? In your answer, you must address the critic's lock/staircase counterexamples and explain whether the test successfully isolates "politics" from "context."

  ***

  **Model Answer**

  The Invariance Test proposes that artifact politics reside in design durability rather than human intention. If a design yields consistent political effects despite variations in user intent or context, it possesses politics *in itself*. The critic argues this is overinclusive: a lock reliably excludes non-keyholders regardless of the locksmith's intent, yet calling a lock "political" seems to drain the term of meaning. **[Colleague Note: Settled that Winner's strong claim is contested; SCOT scholars argue all technology is socially shaped. This answer takes a realist line common in post-phenomenology.]**

  The keyless entry case tests the boundary between the lock and the bridge. Like the Long Island overpasses, the entry system's design persists beyond its initial justification (contractor tracking). Crucially, the prompt specifies that even a privacy-absolutist commune would succumb to the same normative shift. This suggests the effect is robust across radical variations in social context and intention. The system passes the Invariance Test. However, does this refute the critic's objection regarding locks?

  The critic is correct that mere physical constraint is insufficient to constitute politics *in itself*. A staircase restricts movement to those who can climb, but this is a biological fact, not a political order. A lock restricts access, but this is property enforcement, which requires prior social agreement. The critic's error lies in assuming the Invariance Test equates *causal power* with *politics*. Passing the test is necessary but not sufficient. The test identifies *stability of effect*, but we must still define which effects count as political. **[Colleague Note: Contested. Latourians argue constraints are politics; liberals argue politics requires discourse. This answer adopts a middle ground.]**

  The keyless entry system differs from the lock because it does not merely block access; it reorganizes social relations. The ledger transforms residents from trusted neighbors into accountable subjects. This shift occurs invisibly, without a vote, driven by the availability of data. The lock enforces an existing boundary; the ledger creates a new mode of governance. Therefore, the keyless entry case refines the Invariance Test. It suggests that for an artifact to be political *in itself*, it must not only produce invariant effects but must specifically reconstitute authority relations or community norms independent of explicit deliberation.

  This vindicates the distinction between artifacts political *in themselves* and those political *given circumstances*, provided we narrow the definition of "political effect." The overpasses and the ledger are political *in themselves* because they settle who belongs and how they relate, regardless of the builder's stated aim. The lock is political only *given circumstances* (e.g., a regime of private property) because its effect relies on external legal frameworks to be meaningful. **[Colleague Note: Strong claim. Many STS scholars reject the "in itself" category entirely, arguing context is constitutive. A well-informed reader could reject this binary.]**

  The Invariance Test remains a vital heuristic. It forces us to look beyond the "intentions of the man who commissioned them." However, the critic's counterexamples show the test cannot stand alone. It requires a supplementary condition: the invariant effect must be a reorganization of human association, not merely a physical constraint. The keyless entry system meets this bar. It demonstrates that artifacts can embed forms of life that outlast and overwrite the intentions of their users. The politics is not in the metal, but in the unavoidable social reconfiguration the metal demands. Thus, the test is not empty, but it requires a substantive theory of the political to filter out the staircases. **[Colleague Note: This synthesis aligns with Winner's later qualifications but moves beyond his original essay. Acceptable for upper-level seminar.]**

  *(Word Count: 665 words excluding meta-notes)*

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Reconstruction of the Invariance Test (4 Marks)**
  *   **Required:** Clearly defines the test (Design fixed; Intentions/Context varied; Effect persists).
  *   **Typical Error:** Students confuse the test with technological determinism generally, failing to mention the "holding design fixed" condition.

  **2. Engagement with Counterexamples (Lock/Staircase) (4 Marks)**
  *   **Required:** Acknowledges the critic's point (locks pass the test) but argues why they might differ from the bridge/ledger (constraint vs. governance).
  *   **Typical Error:** Dismissing the lock example outright without explaining *why* it fails the refined criteria, or accepting it and conceding the test is empty.

  **3. Application to Keyless Entry Case (4 Marks)**
  *   **Required:** Explicitly uses the "privacy-absolutist commune" detail to demonstrate robustness across intentions. Identifies the shift from trust to accountability.
  *   **Typical Error:** Treating the case as merely about "surveillance" without noting the *invariance* across the two different user groups (Co-op vs. Commune).

  **4. Definition of "Political Effect" (4 Marks)**
  *   **Required:** Distinguishes between physical constraint (staircase) and reorganization of authority/norms (ledger). Addresses the suspicion that "political" smuggles social facts back in.
  *   **Typical Error:** Assuming "political" is self-evident, or arguing that *all* constraints are political (collapsing the distinction).

  **5. Verdict on the Distinction (4 Marks)**
  *   **Required:** Clear conclusion on whether the distinction is vindicated, refined, or undermined (Model argues "Refined/Vindicated with conditions").
  *   **Typical Error:** Sitting on the fence without a clear stance, or concluding that artifacts *never* have politics in themselves (ignoring the prompt's scenario).
