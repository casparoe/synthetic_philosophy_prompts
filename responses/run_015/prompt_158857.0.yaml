  3. "Since prism adaptation shows aftereffects and transfer without perceptual change, how does your signature rule out motor recalibration?" Concede this is the weakest link and promise to add a control condition dissociating motor error from perceptual report. Soft spot: Your current draft treats aftereffects as perceptual proof, which is technically incorrect.

  4. "If the module is 'motorically unencapsulated,' haven't you just redefined modularity to mean nothing more than 'input system plus output weighting'?" Refuse the reduction by arguing that action-readiness constitutes the perceptual content, not just weights the output. Soft spot: This constitutional view risks collapsing the distinction between seeing and acting entirely.

  5. "If perception is constituted by action-readiness, why does the hill look steeper when I'm tired but I don't actually fail to climb it?" Concede that phenomenology might diverge from action-capacity, but refuse to let that divorce invalidate the constitutive claim. Soft spot: You have no account for why the phenomenology exists if it doesn't guide action successfully.
