  Okay so I'm a philosophy PhD student and on Thursday I'm presenting a paper at the joint meeting of a perception-and-action lab and our philosophy of mind reading group — so the room is mostly vision scientists who do psychophysics and eye tracking, maybe ten of them, plus two philosophers (one Fodorian, one who thinks the whole penetration debate is sterile), a guy who does predictive-coding / Bayesian ideal-observer modeling, and one skeptic who was part of a multi-lab registered replication of the classic "backpack makes the hill look steeper" style studies and thinks all of it is demand characteristics and response bias. My thesis is narrow and I'd rather you target it as stated: I claim perception IS cognitively penetrated, but only by states that set the frame of reference or the action-structure of the task — task-set, intention to act, motor preparation — and never by beliefs, desires, emotions, or stereotypes; so the famous desire-and-value cases (the ones the big review a few years back mocked as judgment effects) all fail, while the action-specific ones (reachability, tool-use, the looming-versus-receding timing effects) survive. To make that testable I'm proposing an "adaptation signature": a genuine penetration effect should produce an aftereffect under prolonged exposure, transfer across eyes or effectors, and show up as a shift in sensitivity in an objective discrimination task rather than only in criterion or in verbal report. My punchline is that the surviving cases aren't really cognition reaching down into perception at all — they're perception being partly constituted by what the agent is ready to do — so the old modularity debate was asking the wrong question, because a module could be informationally encapsulated and still be motorically unencapsulated. That last bit is the part I'm least sure about and also the part I think will get me killed.

  What I want is a Q&A prep sheet, not a defense of the view: exactly five numbered items, in roughly the order the questions will actually come from that specific room, each one phrased the way those people would phrase it — psychophysics vocabulary, talk of sensitivity versus criterion, priors and likelihoods, task-set confounds, where the feedback signal would even come from and how fast — followed by a reply I can give in about a minute and a note on where that reply is soft. For each item mark what I should concede up front and what I should refuse to give up. Make the fifth item the one I'm hoping nobody asks. Each entry three sentences tops, no intro and no closing summary, so the whole thing fits on one page I can glance at while I'm standing up there; please write it in American English.

  And please actually push back rather than being helpful: if my adaptation-signature criterion is confused, or if "aftereffects are the signature of perceptual processing" is itself contested in a way that sinks the argument, or if the motoric-versus-informational encapsulation distinction collapses into something philosophers already have a name for, say that plainly at the top in one sentence before the list instead of cheerfully prepping me for objections I won't get. If you think the whole framing rests on a bad reading of the modularity literature, say that too — I'd rather find out Thursday morning than during the question period.
