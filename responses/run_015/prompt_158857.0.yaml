  1. "If your 'action-structure' effects vanish when you control for response bias using forced-choice rather than verbal report, aren't you just describing criterion shifts?" Concede that many past studies were criterion shifts, but refuse to accept that all motor-preparation effects disappear under $d'$ analysis. Soft spot: You lack a specific pilot study showing $d'$ shifts for your specific task-set cases.

