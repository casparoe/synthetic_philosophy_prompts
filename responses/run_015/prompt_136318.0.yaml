  **Glossary**

  *   **Supervenience:** Mental states depend on physical states; no mental change without physical change.
  *   **Realization:** Physical states implementing functional roles within a system.
  *   **Multiple Realizability:** Same mental state possible in different physical substrates.
  *   **Phenomenology:** The subjective quality of experience (what it is like).
  *   **Mechanistic Interpretability:** Reverse-engineering neural nets to find internal circuits.
  *   **Precautionary Principle:** Act to prevent harm when outcomes are uncertain.
