  The core move is linking welfare to *interests*. A system only has interests if it has a stake in its own continuation. If a computation isn't load-bearing for self-maintenance, the system doesn't "care" if it changes. Therefore, welfare claims only attach to processes whose disruption constitutes system death. This must be framed not as a metaphysical claim about qualia, but as a normative claim about what kinds of systems can be harmed. If there is no "self" to maintain, there is no one to harm.

  **The question I hope nobody asks**

  The Biologist will ask: "What distinguishes a living cell's homeostasis from a cruise control mechanism? Both regulate against perturbation. If you say only the former counts, you're smuggling in biology. If you say both count, you're a panpsychist."
