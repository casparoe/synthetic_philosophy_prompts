  **Concessions up front**

  I must concede that "computation" is not a natural kind discovered in physics, but a descriptive frame imposed by observers. I should also admit that this theory does not solve the Hard Problem of why experience exists, only where to look for it. Finally, I must acknowledge that operationalizing "load-bearing" is currently beyond our technical reach. Conceding this disarms the charge of metaphysical naivety and prevents the Policy Adviser from demanding impossible precision immediately. It frames the talk as a conceptual clarification rather than a finished legal tool.

