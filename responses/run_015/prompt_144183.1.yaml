answer: |-
  Revealed preference theory is an empirical framework that collapses into speculation whenever we try to use it for welfare comparisons across significant economic changes, because it relies on an assumption of preference stability that the data itself cannot verify. I considered arguing that utility is merely a psychological state inaccessible to data or that it is purely mathematical bookkeeping with no claim on reality, but I reject these because the psychological view abandons the objective data we have while the bookkeeping view ignores the welfare claims economists actually make with this data. To understand why the empirical view is the correct diagnosis of the problem, we must look closely at what your example of Ada actually demonstrates about the limits of choice data.

  When we say Ada's choices reveal a preference for bundle *a* over bundle *b*, we are making a specific technical move: we observe that when *a* and *b* were both affordable under the same budget constraints, she picked *a*. This is the core of revealed preference; it translates a physical action into a ranking without asking her why she did it. In your scenario, the data shows a chain: *a* is revealed preferred to *b*, and *b* is revealed preferred to *c*. If we assume Ada is a single, consistent agent over time, transitivity tells us she prefers *a* to *c*, and we can construct a utility function where *a* yields higher numbers than *c*. This is where the first part of your worry lands: the utility function is just a formal device that summarizes this ranking. It carries no welfare content on its own because the numbers are arbitrary; all that matters is the order. If we stop there, we have only described her behavior, not her well-being.

  The welfare judgment enters only when we claim that satisfying this ordering makes Ada better off. This requires the auxiliary assumption that the ordering itself remained stable across the three years. Your data is consistent with Ada having one stable set of preferences, but it is equally consistent with Ada completely changing her mind each year. In Year 2, she might have hated good *x* but bought it because it was cheap, while in Year 1 she loved it. Because the budget sets—the combinations of goods she could afford—shifted so dramatically between years, we never see her choose between the same options at different times. The only link between Year 1 and Year 3 is the chain through Year 2. If her preferences changed in Year 2, that chain is broken, and we cannot say whether she is better off in Year 3 than in Year 1. The revealed preference apparatus treats her as the same agent automatically, but the data does not force that conclusion.

  This leads directly to the vanishing-overlap problem you identified. Revealed preference tests for consistency by checking if choices overlap across different price scenarios. When prices change drastically, as they do for Ada, the old budget set and the new budget set share very few common options. The "overlap" is the only place where we can test if her tastes stayed the same. If the overlap vanishes because the economic structure changed too much, the test disappears. We are left with two separate snapshots of behavior with no bridge between them. Policy judgments require that bridge; we need to know if the person facing the new policy is the same person who faced the old one in terms of what they value. Without overlap, the data is silent on this, meaning the welfare conclusion rests entirely on the unverifiable assumption that nothing fundamental changed inside Ada.

  Someone might object that even if Year 1 and Year 3 do not overlap, we can simply observe Ada for many more periods at the new prices to pin down her ordering there. This reply fails because it confuses precision with connection. Observing Ada for a hundred years at Year 3 prices would tell us with great certainty what she prefers at Year 3 prices, but it would tell us nothing about how those preferences relate to Year 1. It refines the snapshot of the present without building a bridge to the past. The problem is not noise within a period; the problem is the structural disconnect between periods. More data at the new prices reduces error in measuring the new utility function, but it does not solve the identification problem of whether the new utility function is comparable to the old one.

  Therefore, the right conclusion is that revealed preference is an empirical theory saddled with an unverifiable auxiliary assumption. It is empirical because it makes testable claims about consistency within a period, but it becomes unverifiable when extended to welfare comparisons across periods without overlap. The assumption of stability is not proven by the data; it is imposed upon the data to make the welfare calculation possible. Without it, the theory describes behavior; with it, the theory claims to measure well-being, but the claim hangs on a premise the data cannot support.

  On my view, "utility" means a numerical index constructed to replicate observed choices, not a measure of human well-being.

  The weakest link in this argument is my claim that preference change is indistinguishable from stability, because an opponent would argue that stability is a necessary methodological presumption rather than an empirical hypothesis requiring proof. They would say that without assuming Ada is the same agent with stable values, economics cannot function at all, so the burden of proof should lie on those claiming change occurred, not on those assuming continuity.
