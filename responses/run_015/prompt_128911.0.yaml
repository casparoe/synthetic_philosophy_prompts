answer: |-
  **Job Title:** Senior Archivist of Actual Occurrence
  **Ministry:** The Bureu of Unmediated Past
  **Location:** Remote / The Epistemological Wing (Basement Level)
  **Employment Type:** Full-time, Tenure-Track

  **About Us**

  The Bureu of Unmediated Past is the global leader in raw data stewardship. We are dedicated to a simple mission: showing history exactly as it occured, without the contamination of modern perspective, linguistic framing, or subjective memory. We believe that if you scrub hard enough, the past becomes invisible but perfectly accurate. We are looking for a dynamic thought leader who can stand outside of time and observe events without influencing them through the act of observation.

  **Responsibilities**

  *   Curate primary sources without physically touching them or reading them through the lens of language.
  *   Maintain zero interpretive bias while submitting weekly deliverables regarding the cause and effect of geopolitical shifts.
  *   Ensure all facts remain unmediated by social constructs, narrative arcs, or grammatical tense.
  *   Collaborate cross-functionally with the Narrative Design Team to finalize the plot of the 19th century before Q3.
  *   Monitor the White Emplotment Index to ensure quarterly targets are met without compromising factual integrity.
  *   Participate in peer reviews where colleagues verify that your objectivity is not actually just a hidden metaphor.

  **Qualifications**

  *   Minimum 10+ years of experience in objective observation within a vacuum.
  *   Verified Ranke Purity Score above 98 (candidates with scores below 95 will be automatically rejected for excessive humanity).
  *   Ability to access primary sources directly without sensory mediation or archival degradation.
  *   Demonstrated capacity to separate the "what" from the "why" while acknowledging that the "why" determines the filing system.
  *   Proficiency in Microsoft Office and at least three dead languages that possess no words for "irony."
  *   Must be comfortable working in an environment where the truth is fixed, but subject to revision based on present-day necessities.

  **Benefits & Team Culture**

  We know that burnout is real when you are holding up the weight of objective reality. That's why we offer a comprehensive benefits package designed to support your journey toward absolute truth.

  *   **Carr Drift Allowance:** An annual stipend to cover costs associated with shifting historical consensus based on contemporary geopolitical needs. Use it for travel, research, or adjusting the moral judgment of past regimes to suit current foreign policy.
  *   **Narrative Emplotment Bonus:** Performance-based compensation tied to how neatly you can fit chaotic events into a recognizable story structure. High performers who successfully frame economic collapse as a Tragedy rather than a Farce are eligible for equity.
  *   **White Tuesday:** Our favorite office holiday. Once a year, all staff gather to vote on which trope (Romance, Comedy, Satire, or Tragedy) will be applied to the upcoming fiscal year. Note: Once the trope is selected, all previous filings must be updated to match the new tone.
  *   **Professional Development:** Workshops on "Unconscious Bias in Footnoting" and "How to Decide the Plot Without Admitting You Decided the Plot."

  **How to Apply**

  Please submit your CV, a cover letter written in a neutral voice that inadvertently reveals your class background, and a sample of unmediated reality. Due to high volume, only candidates who can prove they were not influenced by this job posting will be contacted.

  The Bureu of Unmediated Past is an equal opportunity employer. We do not discriminate based on race, gender, or interpretation of evidence, provided the interpretation aligns with the selected narrative trope for the fiscal year.

