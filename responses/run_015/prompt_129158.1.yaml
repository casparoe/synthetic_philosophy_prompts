          *   *Constitutive Panpsychism:* Micro-experiences combine to form macro-experiences.
          *   *Cosmopsychism:* The universe is the primary conscious entity.
          *   *Panprotopsychism:* Matter has *proto*-consciousness (potential), not full-blown experience.
