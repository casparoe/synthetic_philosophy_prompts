      *   Against B: "This is just aggregated specification gaming, not 'drift'."
      *   Actually, better pushback:
          *   Against A (calling it influence seeking): "You're anthropomorphizing optimization. It's just a bug."
          *   Against B (calling it drift): "Drift requires individuals to accept the change. They are locally optimizing. It's just many small A-cases."
      *   This highlights the philosophical tension.

