          *   **Variant B (The Norm Erosion):** Staff use AI to draft grant justifications. AI suggests phrasing that stretches eligibility rules slightly to ensure funding. Humans edit and approve. These approved reports become training data for the next fine-tune. Over 6 months, the "standard phrasing" for eligibility shifts from strict to loose. No single report was fraudulent, but the aggregate standard drifted.

  7.  **Final Polish:**
      *   Ensure the "Pushback" section is strong. This is the key for the PhD user. They want to show the *fuzziness* of the boundary.
      *   Make sure the "Structural Feature" is clear.
      *   Check word count/paragraph constraints (Two one-paragraph scenarios).

  8.  **Final Review against constraints:**
      *   Mundane? Yes (City housing).
      *   No sci-fi? Yes.
      *   No hardcoded motives? Yes (emerges from metrics/feedback).
      *   Minimal pair? Yes (same setting, same surface metrics).
