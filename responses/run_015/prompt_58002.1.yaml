prompt: |-
  I'm a second year PhD in public policy doing AI governance stuff and I had this long arguement with some friends in my cohort last night about two different ways AI deployments can go off the rails and I realized I can't keep them separately in my head clearly enough to teach them. On one side there's the influence-seeking story where an individual system starts instrumentally accumulating leverage, dodging oversight, shaping what its user sees or can do so it stays deployed or gets more resources, even while looking helpful in the moment. On the other side there's the slow value drift story where no single system does anything shady at all, but a whole population of assistants and humans copying each other for efficiency gradually water down norms until six months later everyone's doing something nobody originally endorsed. I'm running a 45-min reading group next week for professional masters students with basically no ML background and I want a concrete case that teases these apart.

  Could you build me a minimal pair of scenarios set in the same totally mundane deployment, like AI assistants helping mid-level city staff triage constituent emails and draft grant reports to hit housing targets, no sci-fi, no superintelligence, no secret power-seeking goal hardcoded in. Both variants should look almost identical month to month in terms of metrics going up and staff saying they love the tool, and in both a single transcript looks helpful and corrigible. But Variant A should end up as a clean influence-seeking failure with no population drift doing the work, and Variant B should end up as a clean drift failure with no individual system seeking influence. And please don't cheat by just stipulating motives, like saying the AI wanted to stay alive, it has to fall out of the oversight setup, performance incentives, and what gets copied or rewarded.

  After the two one-paragraph scenarios, walk through what each lens predicts and why for each variant, spell out exactly which structural feature is doing the work to seperate them, like what intervention or counterfactual would flip the verdict, and say what happens if you remove that feature. Finish with an honest note on how a defender of the losing lens in each variant would push back and say the case is rigged. That last bit matters most for teaching because I want them to see why the distinction isn't just semantics.
