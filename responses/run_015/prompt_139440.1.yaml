answer: |-
  ### Part 1: The Mapping

  You are right to feel that Brexit is being wielded clumsily. To use it properly, we have to stop treating it as a simple "People vs. Experts" fight and start treating it as a failure of institutional design to match the type of decision being made.

  **The Decision: Forecast vs. Choice**
  Epistocracy rests on the *Competence Principle*: if there is a right answer (or a objectively better outcome), those better at identifying it should have more say. This works for instrumental questions ("Will this policy raise GDP?"). It fails for constitutive questions ("Do we value sovereignty over prosperity?").
  Brexit was sold as a forecast ("Leave will be economically painless/gainful") but bought as a choice ("We want to be ruled by ourselves").
  *   **Epistocratic View:** If the question is instrumental (economic consequences), the public is incompetent. The Treasury/IMF consensus should have been binding, or the franchise restricted to those who understand trade elasticity.
  *   **Democratic View:** If the question is constitutive (identity/authority), expertise is irrelevant. No economist can tell you how much sovereignty is "worth."
  *   **The Mismatch:** The referendum forced a binary choice on a multi-dimensional problem. It asked for a verdict on a *plan* that didn't exist. Epistocracy has no clean answer for "Vote on a principle, implement the details later." That is a recipe for epistemic chaos.

  **The Relevant Knowers**
  By Brennan's or Estlund's lights, the "knowers" would be those with high political knowledge and low bias. In 2016, this mapped onto:
  1.  **Technical Experts:** Economists, trade lawyers, civil servants (The Treasury, BoE).
  2.  **Political Elites:** Party leaderships (who mostly backed Remain).
  *   **Evidence:** Pre-vote projections (Project Fear vs. Project Hope).
  *   **The Theory's Prescription:** An epistocrat would argue Cameron should never have called the vote. Complex constitutional unwinding is not a task for aggregate ignorance. If a vote *must* occur, it should be weighted (e.g., voters must pass a civics/economics test) or advisory only, with Parliament (the filtered body) retaining final implementation authority.
  *   **Where the Theory Goes Silent:** Epistocracy is built for *selecting rulers*, not *selecting policies* via one-off plebiscites. The Jury Theorem assumes independent voters seeking the truth. Referenda are driven by campaigns, media ecosystems, and identity signaling. Epistocracy doesn't have a robust model for "truth-seeking via campaign advertising." It assumes competence is static, not that it can be manipulated by a bus slogan.

  ### Part 2: The Four Objections

  Here is the verdict on your four points. I am taking a stand so you have something to attack.

  **1. Credential filter versus track-record audit**
  *   **The Tension:** The Treasury/IMF predicted an immediate recession. It didn't happen. Does this disqualify them as "knowers"?
  *   **Verdict:** **Cheap Shot.**
  *   **Why:** You are conflating *timing* with *direction*. Most expert models predicted long-term structural reduction in potential GDP, not necessarily an immediate Lehman-style crash. The pound did drop; investment did stagnate. To say expertise failed because the apocalypse wasn't immediate is to demand prophecy, not competence.
  *   **The Epistocratic Defense:** Epistocracy relies on *probabilistic* superiority, not infallibility. If a meteorologist says "80% chance of rain" and it stays dry, they aren't necessarily bad meteorologists. However, the *confidence* with which the consensus was presented was politically toxic. The genuine problem isn't that they missed, it's that they claimed a certainty they didn't possess. But using the lack of an immediate crash to debunk the *value* of economic expertise is a populist trick, not a philosophical refutation.

  **2. Cue-taking**
  *   **The Tension:** Democracy works because voters follow party heuristics. In 2016, the cues were scrambled (Tories vs. Tories, Labour vs. Labour).
  *   **Verdict:** **Genuine Problem (for the Referendum, not Democracy).**
  *   **Why:** This is the strongest argument against using Brexit as a verdict on *mass democracy* generally. Ordinary elections allow voters to outsource cognitive labor to trusted brands. The referendum stripped away the heuristic machinery. Voters were forced to be their own analysts on trade tariffs and immigration law without the usual shortcuts.
  *   **Implication:** This doesn't save epistocracy, but it kills the idea that a referendum is a "pure" expression of the people's will. It was an expression of a people temporarily blinded by signal noise. If democracy relies on cues, removing cues makes the vote epistemically worse than a random coin toss. This suggests the *instrument* was the error, not the franchise.

  **3. No training data**
  *   **The Tension:** Expertise is inductive. No country had ever left the EU. The "experts" were extrapolating from data that didn't fit the case.
  *   **Verdict:** **Genuine Problem (for Epistocracy).**
  *   **Why:** This cuts the legs out from under the Competence Principle for constitutional novelty. If competence is based on past performance and established models, then in a unique historical moment, the "expert" class shrinks to near zero. The civil servants knew how the EU worked, not how *unworking* it would function.
  *   **Implication:** Epistocracy claims to rule based on knowledge. If the domain is unprecedented, there is no knowledge to rule with. In these "black swan" political events, the epistocrat's claim to authority dissolves into guesswork. This suggests epistocracy is only viable for routine governance, not regime change.

  **4. The reversal test**
  *   **The Tension:** Weighting votes by education/knowledge likely flips the result to Remain. But Leave was a revolt against epistocratic institutions (ECJ, BoE, Judges).
  *   **Verdict:** **Genuine Problem (for Stability).**
  *   **Why:** This is the *legitimacy trap*. Estlund worries about "rejectability." If an epistocratic system reliably produces outcomes the majority finds intolerable, the system will be overthrown (see: the referendum itself). The Leave campaign was explicitly anti-epistocratic ("Enough of experts").
  *   **Implication:** An epistocracy that cannot survive a democratic revolt is not stable. If the "knowers" are viewed as a hostile elite class (which the bus campaign successfully framed them as), then rule by the knowers becomes a provocation. Enthusiasm for epistocracy usually vanishes the moment the epistocrats rule *against* your tribe. This suggests epistocracy is dynamically unstable in polarized societies.

  ### Part 3: The Instrument

  If Britain had to do this again, do not use a standard referendum. Do not use a Citizens' Assembly alone (too elitist).

  **The Instrument: A Two-Stage Mandated Ballot**

  **Stage 1: The Ends (Democratic)**
  A simple binary vote: *"Do you wish to change the current constitutional status quo?"*
  This isolates the *value* judgment. It acknowledges that sovereignty is a preference, not a fact. No expertise is required to know if you feel less sovereign.

  **Stage 2: The Means (Epistocratic-Constraint)**
  If Stage 1 passes, the government does not leave immediately. A **Binding Citizens' Assembly** (sortition-selected, stratified, expert-advised) is convened for 12 months. Their job is not to decide *whether* to leave, but to draft the *specific treaty terms* of departure (e.g., "Norway Model," "Canada Model," "WTO Terms").
  The public then votes in a **Ratification Referendum** on the *specific deal* drafted by the Assembly.
  *   **Crucial Mechanism:** If the public rejects the deal, the process loops back to the Assembly. If it rejects it twice, Stage 1 is nullified, and the status quo remains.

  **Classification:**
  This is **Competence-Constrained Democracy**.
  *   It is *Democratic* because the ultimate veto power rests with the electorate (Stage 1 and Ratification).
  *   It is *Epistocratic* because it removes the technical drafting from the campaign trail and places it in a deliberative body forced to engage with evidence and trade-offs (The Assembly).
  *   It prevents voting for a slogan ("Take Back Control") without voting for the cost ("Single Market Access Lost").

  **Why you can argue against this:**
  1.  **The Sandbagging Objection:** The Establishment will rig the Citizens' Assembly. They will stack the expert witnesses to ensure only one "sensible" deal is produced. It's epistocracy in disguise, designed to exhaust the public until they accept the elite preference.
  2.  **The Mandate Objection:** If 52% vote "Leave" in Stage 1, they have authorized departure, not a specific deal. Forcing them to vote again on the *terms* allows the losers of Stage 1 to fight a rearguard action in Stage 2. It violates the instruction of the first vote.
  3.  **The Fatigue Objection:** Complex deliberation kills participation. By the time the Ratification Vote comes, the public will be bored, and the turnout will be skewed, potentially invalidating the democratic legitimacy of the final check.

  Use that. It forces your friend to defend either pure direct democracy (voting on slogans) or pure epistocracy (experts decide the deal), while you hold the middle ground that separates values from facts.
