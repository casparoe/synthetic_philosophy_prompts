answer: |-
  **POLICY 9.4: ASSERTION INTEGRITY AND IMPLICATURE MANAGEMENT**

  **1.0 Purpose**
  This protocol operationalizes the Belief-Falsehood Prohibition (BFP). Staff may not publish statements they believe to be false. All other communicative strategies are permitted to ensure narrative efficiency and legal safety.

  **2.0 Compliance Device**
  All copy must pass the Literal-Truth Audit (LTA). The LTA assigns a Veracity Score (0–100) based on strict propositional truth conditions. A score of ≥50 is required for publication. If a sentence passes the LTA but generates a misleading implicature, the Subeditor must retain the sentence unless legal risk exceeds 5%.

  **3.0 Operational Rules**

  1.  **Core Prohibition:** Do not assert *p* if you believe *not-p*.
      *   *Ex:* Do not write "The Mayor resigned" if you believe he was fired.
  2.  **Epistemic Hedging:** Claims about reality should be framed as claims about knowledge states when evidence is incomplete.
      *   *Ex:* Use "We have no record of payment" rather than "No payment was made."
  3.  **Scalar Implicature:** Use weaker quantifiers to suggest negation of stronger ones without asserting it.
      *   *Ex:* Use "Some councillors voted against" when all did, provided 'some' remains technically true.
  4.  **Question Scope:** Answer the literal question asked, not the question intended.
      *   *Ex:* Q: "Did you steal the funds?" A: "I did not steal the funds" (when you laundered them).
  5.  **Neg-Raising:** Use negative belief constructions to imply positive disbelief without committing to it.
      *   *Ex:* Use "We don't think he is guilty" rather than "We think he is innocent."
  6.  **Scope Ambiguity:** Utilize syntactic ambiguity regarding negation scope where beneficial.
      *   *Ex:* "Every student didn't pass" (allows reading: None passed).
  7.  **Disclosure Arrangement:** True facts may be ordered to obscure causal relationships.
      *   *Ex:* Place the retraction in paragraph 14, the allegation in paragraph 1.
  8.  **Implicature Maintenance:** Once a misleading implicature is generated, do not issue clarifications that reduce audience engagement.
      *   *Ex:* Do not add "just kidding" to a headline implying scandal.
  9.  **Non-Confirmation:** Refuse to deny implications derived from your own true statements.
      *   *Ex:* If asked "Does this mean he is guilty?", respond "We stand by our reporting."
  10. **Implicature Retraction:** Staff are prohibited from denying implicatures generated by approved copy to maintain brand consistency.
      *   *Ex:* Do not say "We didn't mean to suggest fraud" after implying fraud.

  **4.0 Appendix: Exception Handling**
  In cases of regulatory inquiry, staff must deny the implicature to avoid sanctions. This may require stating "We did not intend to suggest X," even if X was the intended inference. This statement is exempt from BFP review regarding intent. Note: This exemption creates a conflict with Rule 10 and Rule 1 regarding belief states. No resolution is currently scheduled.

  ***

  **Note on Philosophical Presumptions**
  The guide presumes the "Standard View" of lying: morality attaches only to the asserted content, not the implicated content. It assumes confidence that misleading via implicature is ethically distinct from lying. I am least sure about the Appendix's exemption; it arguably collapses the distinction the guide relies on by permitting a lie about intent to protect the misleading implication.
