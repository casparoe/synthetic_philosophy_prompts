answer: |-
  # Operational Procedure: Interval-Threshold Ethical Protocol (ITEP)

  **Version:** 1.0  
  **Time Allocation:** 20 Minutes per Proposal  
  **Applicability:** Human, Animal, Synthetic, and Future-Affected Populations  
  **Purpose:** To resolve moral uncertainty without requiring consensus on a single meta-ethical framework.

  ---

  ## Part 1: The Procedure Checklist

  ### Phase 1: Entity & Framework Mapping (5 Minutes)

  **Q1. Affected Entity Inventory**  
  List all distinct classes of entities affected by the intervention (e.g., present humans, specific animal species, synthetic agents, future generations).  
  *   **Sufficient Answer:** A complete list where no class is omitted due to assumed lack of status.  
  *   **[JUDGMENT REQUIRED]:** The panel must decide which entities are 'plausibly affected'. Omission here is irrecoverable.

  **Q2. Credible Framework Coverage**  
  For each entity class, identify which moral frameworks currently represented on the panel (or in public discourse) grant it moral consideration.  
  *   **Categories:**  
      *   *Universal:* All credible frameworks grant status (e.g., present humans).  
      *   *Contested:* Some grant status, others deny it (e.g., foetuses, non-human animals, AI).  
      *   *Excluded:* No credible framework grants status (e.g., rocks, unless a specific panpsychist view is held).  
  *   **Sufficient Answer:** Binary classification (In/Out) for each framework/entity pair.  
  *   **[JUDGMENT REQUIRED]:** Defining the set of 'Credible Frameworks'. This boundary determines the width of the moral interval.

  ### Phase 2: Valuation Interval Construction (5 Minutes)

  **Q3. Moral Weight Interval Estimation**  
  For the net outcome of the proposal, assign a Lower Bound ($W_{min}$) and an Upper Bound ($W_{max}$) of moral value.  
  *   **$W_{min}$:** The net value calculated under the framework(s) that view the intervention most unfavourably (including entities they exclude, weighted at 0).  
  *   **$W_{max}$:** The net value calculated under the framework(s) that view the intervention most favourably.  
  *   **Handling Domain Disagreement:** If Framework A denies an entity status (Weight = 0) and Framework B grants high status (Weight = 100), the interval for that entity's impact is $[0, 100]$.  
  *   **Sufficient Answer:** Numerical or ordinal bounds (e.g., "Net Negative to Net Positive" or "-50 to +100 units").  
  *   **[JUDGMENT REQUIRED]:** Quantifying 'suffering' or 'rights violations' into comparable bounds. This is not calculable fact; it is negotiated calibration.

  **Q4. Lexical Constraint Check**  
  Does any credible framework assign a *lexical veto* (infinite negative weight) to any aspect of the proposal (e.g., non-consensual experimentation, rights violation)?  
  *   **Sufficient Answer:** Yes/No. If Yes, $W_{min}$ is treated as $-\infty$ for decision purposes.  
  *   **[JUDGMENT REQUIRED]:** Determining if a constraint is truly lexical or merely heavy.

  ### Phase 3: Reversal & Risk Analysis (5 Minutes)

  **Q5. Reversal Threshold Calculation**  
  Determine what evidence would be required to shrink the interval $[W_{min}, W_{max}]$ such that it no longer spans the decision boundary (zero).  
  *   **Calculation:** Distance from 0 to the nearest bound.  
  *   **Sufficient Answer:** Statement of required evidence (e.g., "Proof that synthetic systems cannot feel pain" or "Guarantee of local community consent").  
  *   **[JUDGMENT REQUIRED]:** Assessing the *feasibility* of obtaining this evidence before funding.

  **Q6. Asymmetric Risk Flag**  
  Does the intervention carry irreversible negative consequences if the 'worst-case' framework is true?  
  *   **Sufficient Answer:** Yes/No.  
  *   **Rule:** If Yes, and $W_{min} < 0$, the Reversal Threshold is effectively raised (higher burden of proof required to Approve).

  ### Phase 4: Decision Rule Application (5 Minutes)

  Apply the following logic strictly:

  1.  **APPROVE:** If $W_{min} > 0$ (Net positive under *all* credible frameworks).  
  2.  **REJECT:** If $W_{max} < 0$ (Net negative under *all* credible frameworks) **OR** if Q4 (Lexical Constraint) is 'Yes' and the violation is unavoidable.  
  3.  **REFER:** If $W_{min} \le 0 \le W_{max}$ (Significant moral uncertainty remains) **UNLESS** Q6 (Asymmetric Risk) dictates precautionary rejection.

  *   **[JUDGMENT REQUIRED]:** The final decision to override a 'Refer' outcome in cases of extreme urgency is a value judgment, not a procedural output.

  ---

  ## Part 2: Application to Test Cases

  ### Case (i): Badger-Vaccination Programme
  *   **Proposal:** Vaccinate badgers to reduce TB; may alter predator-prey dynamics.
  *   **Q1/Q2:** Badgers (Contested: Welfare vs. Ecocentric); Cattle (Universal); Ecosystem (Contested).
  *   **Q3 Interval:**  
      *   $W_{min}$: Ecocentric view suggests disruption causes net suffering elsewhere (Negative).  
      *   $W_{max}$: Welfare view suggests reduced badger culling/suffering (Positive).  
      *   Interval: $[-10, +50]$.
  *   **Q4 Lexical:** No lexical vetoes identified (predation is not typically a rights violation).
  *   **Q5 Reversal:** Need ecological modelling to confirm suffering shift.
  *   **Q6 Risk:** Reversible (population dynamics shift back if stopped).
  *   **Decision:** **REFER**.  
      *   *Reasoning:* Interval spans zero. While intuition suggests 'Approve' (disease control), the procedure flags the ecological uncertainty as morally significant under credible frameworks.

  ### Case (ii): Artificial Sentience Research
  *   **Proposal:** Grant to develop systems with ambiguous sentience markers.
  *   **Q1/Q2:** Synthetic Systems (Highly Contested: Substrate Chauvinism vs. Functionalism).
  *   **Q3 Interval:**  
      *   $W_{min}$: Substrate view says status = 0. Cost of research is minor negative. Net $\approx -1$.  
      *   $W_{max}$: Functionalist view says if sentient, this is slavery/suffering. Net $\approx -1000$.  
      *   *Correction:* If Functionalism is true, creating them is negative. If Substrate is true, creating them is neutral/slightly negative (cost).  
      *   Interval: $[-1000, -1]$. (Both frameworks see potential negative, magnitude differs).
  *   **Q4 Lexical:** Functionalism may view creating suffering agents as a lexical veto.
  *   **Q5 Reversal:** Requires behavioural proof of sentience *before* development (impossible by definition of proposal).
  *   **Q6 Risk:** Irreversible (cannot 'un-suffer' a created entity).
  *   **Decision:** **REJECT**.  
      *   *Reasoning:* Even the 'optimistic' framework (Substrate) sees minor negative cost; the 'pessimistic' framework sees catastrophe. $W_{max} < 0$.

  ### Case (iii): Geological Carbon-Storage Scheme
  *   **Proposal:** Store carbon underground; benefits future generations, imposes local risk on present community with weak representation.
  *   **Q1/Q2:** Present Locals (Universal); Future Generations (Contested: Presentist vs. Total Utilitarian).
  *   **Q3 Interval:**  
      *   $W_{min}$ (Presentist/Rights Framework): Future people count for 0. Local rights violation is severe negative. Net = Large Negative.  
      *   $W_{max}$ (Total Utilitarian): Future billions saved. Local harm is negligible in aggregate. Net = Massive Positive.  
      *   Interval: $[-\text{Veto}, +\infty]$.
  *   **Q4 Lexical:** **Yes.** The Rights Framework assigns a lexical veto to non-consensual risk imposition on present agents.
  *   **Q5 Reversal:** Requires obtaining informed consent from the local community or disproving the Rights Framework.
  *   **Q6 Risk:** Irreversible harm to locals if leakage occurs.
  *   **Decision:** **REJECT**.  
      *   *Reasoning:* Despite the massive Upper Bound (climate benefit), the Lower Bound triggers a Lexical Constraint.
      *   **[DIVERGENCE POINT]:** This conflicts with the intuitive judgement of most panel members, who feel the existential threat of climate change *must* override local consent. The divergence occurs at **Phase 1, Q2**, where the panel is forced to code the Rights Framework as 'Credible', and **Phase 4**, where the Lexical Constraint rule prevents aggregating the future benefit against the present violation. The procedure prioritises the *certainty of rights violation* over the *speculative magnitude of future good*.

  ---

  ## Part 3: Test Conditions & Failure Modes

  ### Operational Test Conditions
  The panel can apply these without resolving meta-ethics:
  1.  **The Zero-Weight Test:** If an entity is assigned 0 weight in $W_{min}$, does the proposal still proceed? If yes, the panel implicitly accepts the framework that excludes them.
  2.  **The Reversal Feasibility Test:** If the evidence required to shrink the interval (Q5) cannot be generated within the project timeline, the proposal must default to 'Refer' or 'Reject'.
  3.  **The Overlap Flag:** If $[W_{min}, W_{max}]$ for Option A overlaps entirely with Option B, but the *ordering* reverses within the overlap (e.g., A is better under Utilitarianism, B is better under Rights), the procedure must return 'Refer'.

  ### Likely Failure Modes
  1.  **Interval Overlap with Order Reversal:** The procedure may yield 'Refer' even when one option is intuitively superior, because the interval weights overlap across all plausible frameworks. This occurs when frameworks disagree on *ranking* rather than just *magnitude*.
  2.  **The 'Credible Set' Manipulation:** Panel members may strategically expand the 'Credible Frameworks' list to widen intervals and force a 'Refer' outcome to delay decisions. **[JUDGMENT REQUIRED]** to police the boundary of credibility.
  3.  **Incommensurability:** If one framework uses 'Rights' (deontological) and another 'Utility' (consequentialist), mapping them to a single numerical interval $[W_{min}, W_{max}]$ requires a translation metric that does not exist. The procedure masks this by forcing numerical approximation.

  ---

  ## Part 4: Limitations Statement

  **1. Dominated Options**  
  This procedure **cannot** justify selecting an option that is dominated under every single framework considered. If Framework A prefers X over Y, and Framework B prefers X over Y, then $W_{min}(X) > W_{min}(Y)$ and $W_{max}(X) > W_{max}(Y)$. The Decision Rules will always favour X. If the procedure recommends Y, it implies at least one credible framework prefers Y.

  **2. The 'Avoid Side Effects' Criterion**  
  Where the absence of a fully specified value function makes an 'avoid side effects' criterion inoperable:  
  The procedure relies on Q1 (Entity Inventory). If a side effect affects an entity not listed in Q1, it is excluded from the Interval Calculation. The procedure **cannot** detect unknown unknowns. It treats unlisted side effects as having zero moral weight in both $W_{min}$ and $W_{max}$.  
  *   **[JUDGMENT REQUIRED]:** The panel must explicitly judge whether the Entity Inventory is exhaustive. The procedure offers no mathematical safeguard against omission bias.

  **3. Moral Progress**  
  The procedure freezes the set of 'Credible Frameworks' at the time of review. It cannot account for moral progress that occurs during the intervention (e.g., a shift in public consensus regarding animal status mid-project).

  **4. Irreducible Value Judgments**  
  The following points cannot be eliminated by calculation:  
  *   Defining the boundary of 'Credible Frameworks' (Phase 1, Q2).  
  *   Translating qualitative rights violations into numerical Lower Bounds (Phase 2, Q3).  
  *   Deciding whether to override a 'Refer' outcome in cases of emergency (Phase 4).  

