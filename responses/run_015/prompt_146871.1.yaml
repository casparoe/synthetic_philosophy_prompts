  **JOINT DECLARATION ON THE CONTRASTIVE EXPLANATION OF INDUSTRIALIZATION**

  **Preamble**
  The undersigned parties, having engaged in a decade-long adversarial collaboration regarding the explanatory structure of the Industrial Revolution, submit this document to formalize the boundary between established consensus and residual disagreement. This document adheres to the methodological stipulations agreed upon at the outset of the collaboration regarding outcome definition, unit matching, and question decomposition.

  **I. Agreed Claims**
  The following claims constitute the common ground upon which further inquiry must rest. Neither party reserves the right to retract these without new empirical evidence.

  1.  **Outcome Definition:** The phenomenon to be explained is not a named event but a threshold crossing: sustainable growth in output per head for at least two generations, coupled with inanimate sources supplying a growing share of mechanical energy, first occurring within the window 1750–1850.
  2.  **Unit Matching:** The valid comparator for Britain (specifically England) is the Lower Yangzi Delta (Jiangnan), not the Qing Empire aggregate. This matching controls for area, population density, commercialization, and market integration.
  3.  **Effect of Matching:** Matching at the Jiangnan scale neither dissolves the puzzle nor leaves it exactly as it was; it relocates the puzzle from a continental divergence to a regional divergence between two advanced economic zones that shared high equilibrium traps.
  4.  **Question Decomposition:** The original inquiry is decomposed into (Q1) why the Malthusian ceiling was breached anywhere at all, and (Q2) why it was breached in the specified region first.
  5.  **Exhaustiveness and Leakage:** A full answer to Q1 plus a full answer to Q2 does not strictly exhaust the original question due to leakage; factors invoked for Q2 (e.g., access to coal, New World land, trade shapes) are partially downstream of earlier geopolitical positions relevant to Q1.
  6.  **Non-Essentialism:** Neither party relies on civilizational or cultural essentialism. Explanatory factors are restricted to material constraints, institutional incentives, geopolitical contingencies, and resource endowments.
  7.  **Contingency:** Both parties agree that the threshold crossing was not inevitable for humanity as a whole prior to 1500, nor was the specific location strictly determined by deep historical constants.
  8.  **Contrastive Necessity:** Explanation requires a contrast class. Isolating the successful case without reference to the non-successful comparator yields correlation, not causation.
  9.  **Data Scarcity:** Both parties acknowledge that quantitative data for Jiangnan and Britain circa 1750 is sparse, noisy, and subject to revision, limiting the confidence interval of any causal claim.
  10. **Teleology Warning:** Both parties agree that framing industrialization as a "default path" from which one region "failed" deviates encodes a teleological bias that must be explicitly corrected for in modeling.

  **II. Residual-Disagreements Table**
  The following table isolates the cruxes where consensus remains unreachable. Disagreements are categorized by type: Empirical (facts in dispute), Conceptual (structure of reasoning), Verbal (ambiguity in terms), or Pragmatic (utility of the inquiry).

  | Crux | Party A Position (Contrastivist Realist) | Party B Position (Question-Skeptic) | Type of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. Well-Posedness** | Once the contrast class (Jiangnan) and outcome (threshold) are fixed, the question is well-posed and admits a substantive truth-apt answer regarding difference-making factors. | Even with fixed units, the question remains an artifact of framing because the "not Jiangnan" condition treats a complex system as a single agent with a single opportunity structure. | Conceptual |
  | **2. Counterfactuals** | A contrastive why-question requires a determinate counterfactual: we must be able to specify what would have happened in Jiangnan had the British difference-makers been present. | A contrastive why-question requires only a relevant contrast class; demanding a determinate counterfactual for complex historical systems imposes false precision on indeterminate processes. | Conceptual |
  | **3. Unexplained Difference-Makers** | A factor counts as an explanation even if its own origin is not fully explained (e.g., coal location), provided it makes a difference to the outcome in the contrast class. | A factor does not count as a full explanation if its own distribution is unexplained; the genealogy of the difference-maker must be traced to avoid stopping the inquiry arbitrarily. | Pragmatic |
  | **4. Purpose of Inquiry** | The question is for causal assignment and theoretical modeling of growth transitions; well-posedness depends on predictive accuracy for similar transitions. | The question is for heuristic guidance and warning against teleology; well-posedness depends on whether the framing prevents normative judgments about "failure." | Pragmatic |

  *Verbal Disambiguation Note:* Regarding Crux 1, both parties agree "China did not industrialize" means "no part of the Qing empire crossed the threshold *before* Britain." The substantive residue is whether the aggregate empire's failure is a valid background condition for Jiangnan's specific trajectory. Party A argues yes (imperial constraints bind regions); Party B argues no (regional autonomy decouples Jiangnan from imperial averages).

  **III. Pre-registered Predictions**
  For each crux, the parties identify the cheapest observation or argument that would bear on the dispute, along with their respective predictions.

  1.  **Coal Accessibility Data:** New estimates on the cost of transporting coal from inland mines to Jiangnan waterways versus British mines to canals.
      *   **Party A Prediction:** Data will show a statistically significant cost differential favoring Britain, supporting the claim that resource geometry was a determinate difference-maker.
      *   **Party B Prediction:** Data will show overlapping variance ranges, supporting the claim that resource geometry was not binding until after institutional divergences made extraction viable.
      *   **Status:** Settled by existing geological and transport cost archives; no new excavation required.

  2.  **Institutional Transferability:** Evidence regarding whether Jiangnan merchants could have legally utilized British-style corporate structures if offered them in 1750.
      *   **Party A Prediction:** Legal barriers were low; the difference was demand-side (incentives), proving the counterfactual is determinate.
      *   **Party B Prediction:** Legal barriers were high and endogenous to the imperial system, proving the counterfactual is indeterminate (you cannot swap institutions without swapping the state).
      *   **Status:** Requires new archival work on Qing commercial law codes.

  3.  **The 1700 Submersion Test:** Had Britain gone under the sea in 1700, when and where would the threshold have been crossed?
      *   **Party A Prediction:** Crossing would occur in Northwest Europe (Belgium/North France) within 40 years. Confidence: High. This implies the difference was regional (Europe vs. Asia), not national.
      *   **Party B Prediction:** Crossing would be delayed by at least a century or occur in a fundamentally different technological pathway (e.g., labor-intensive industrialization). Confidence: Low. This implies the difference was contingent on specific British configurations.
      *   **Status:** Unsettled. Depends on modeling European knowledge diffusion rates which are currently disputed.

  4.  **Crux 3 Resolution (Genealogy):** Whether access to New World land is treated as a Q1 or Q2 factor.
      *   **Party A Prediction:** Treating it as Q2 (timing) yields a cleaner model of the threshold crossing.
      *   **Party B Prediction:** Treating it as Q2 leaks Q1 (geopolitics) into the explanation, validating the skepticism about decomposition.
      *   **Status:** Conceptual; resolved by model specification choices.

  **IV. Concessions and Movers**
  To conclude the collaboration, each party records specific concessions granted to the other and the specific empirical development that would compel them to abandon their primary stance.

  **Party A Concessions:**
  Party A grants that the original formulation of the question often encoded teleology, validating Party B's warning that "failure" is a normative label. Party A further grants that matching Britain to Jiangnan relocates the puzzle rather than solving it, acknowledging that the "Great Divergence" is now a puzzle of regional specificity within advanced economies rather than continental disparity. Party A accepts that factors invoked for Q2 (timing) often leak into Q1 (breach), requiring more careful causal sequencing than previously admitted.

  **Party B Concessions:**
  Party B grants that fixing the contrast class to Jiangnan significantly reduces the unit mismatch error, making the question more analytically tractable than when comparing Britain to the Qing aggregate. Party B accepts that a contrastive question does not require a perfectly determinate counterfactual to be useful, provided the contrast class is empirically grounded. Party B acknowledges that refusing to identify difference-makers risks paralysis in historical explanation.

  **Movers (Conditions for Abandonment):**
  *   **Party A:** Would abandon the Contrastivist Realist position if it were demonstrated that Jiangnan possessed identical access to cheap energy and land-saving technologies circa 1750 but chose not to utilize them due to purely cultural preference, as this would reintroduce essentialism which violates Claim 6.
  *   **Party B:** Would abandon the Question-Skeptic position if a model constructed on the agreed stipulations successfully predicted the timing of industrialization in a third case (e.g., Japan or Germany) using only the identified difference-makers, proving the question has predictive utility beyond post-hoc fitting.

