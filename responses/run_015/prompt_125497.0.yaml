answer: |-
  There isn't a single, canonical Latin term for this specific maneuver in standard logic textbooks. However, in philosophy of social science and rhetoric, this pattern is well-recognized.

  The most precise name for this move is **"The Retreat to Brute Facts."**

  It relies on a distinction made famous by philosopher John Searle between **Institutional Facts** (things that exist because we agree they do, like money or marriage) and **Brute Facts** (things that exist independently of human agreement, like gravity or atomic weight).

  Here is a breakdown of why this label fits, how it relates to existing fallacy structures, and how to distinguish it from the concepts you mentioned.

  ### 1. The Core Concept: "Retreat to Brute Facts"
  In this argumentative pattern, the materialist accepts that the *institutional* layer (value, price, scarcity) is socially constructed, but insists that the *substrate* layer (physics, chemistry, atomic scarcity) is not.

  *   **The Move:** When the social constructionist demonstrates that Layer A (value) is mediated by society, the materialist concedes Layer A but asserts that Layer A rests on Layer B (physical properties), which is immune to social mediation.
  *   **The Goal:** To find an **Archimedean Point**—a fixed spot outside the social sphere where "true reality" resides.
  *   **Why it feels reasonable:** Because it *is* technically true that paper is ink and gold is an element. The trick is implying that the physical properties *dictate* the economic value without social mediation, which is the contested leap.

  ### 2. Is it a Motte-and-Bailey?
  It is best understood as a **Recursive (or Layered) Motte-and-Bailey.**

  *   **Standard Motte-and-Bailey:** Involves two positions. A bold, controversial claim (the Bailey: "Gold has intrinsic value") and a defensible, trivial claim (the Motte: "Gold has physical atoms"). When challenged, the arguer retreats to the Motte.
  *   **Your Scenario:** This is a *stack* of Mottes.
      *   *Bailey 1:* Value is intrinsic.
      *   *Motte 1 / Bailey 2:* Scarcity is physical.
      *   *Motte 2 / Bailey 3:* Atomic structure is real.
      *   *Motte 3:* Matter exists.
  *   **The Distinction:** In a standard Motte-and-Bailey, the arguer usually tries to return to the Bailey once the heat is off. In this "Retreat to Brute Facts," the arguer often stays at the deepest layer they can reach, claiming *that* is the actual foundation. It is a **defensive regression** rather than a switch.

  ### 3. Is it Shifting the Goalposts?
  It is distinct from **Shifting the Goalposts**, though they feel similar.

  *   **Shifting Goalposts:** Changes the *criteria for victory*.
      *   *Example:* "Prove money is real." -> (Proof offered) -> "Well, prove it has value." -> (Proof offered) -> "Well, prove it has scarcity."
  *   **The Retreat to Brute Facts:** Keeps the *criteria for victory* the same (Prove this is objectively real/not social), but changes the **locus of objectivity**.
      *   *Example:* "Where is the objectivity?" -> "In the value." -> (Challenged) -> "Okay, the objectivity is in the scarcity." -> (Challenged) -> "Okay, the objectivity is in the atoms."
  *   **Why it matters:** Goalposting is usually a cheap trick to avoid losing. The Retreat to Brute Facts is often a sincere (though arguably flawed) ontological stance called **Foundationalism**. The arguer genuinely believes there *must* be a bottom layer that isn't social.

  ### 4. Is it Infinite Regress?
  You correctly noted it isn't plain **Infinite Regress**.

  *   **Infinite Regress:** Usually a *reductio ad absurdum* showing an argument fails because it requires an endless chain of justification (A depends on B, which depends on C, forever).
  *   **This Move:** The arguer intends to **stop** the regress. They are arguing that the chain *terminates* at physics. They are saying, "Society is built on matter, and matter is not built on society." The conflict arises because the social constructivist argues that our *access* to matter is always socially mediated (e.g., we decide gold is useful, not lead), while the materialist argues matter exists regardless of access.

  ### 5. Alternative Labels
  If you need a term to use in conversation, here are three options ranging from academic to colloquial:

  1.  **"Ontological Sinking":** A descriptive term for driving the argument deeper into ontology (the nature of being) to escape social critique.
  2.  **"The Naturalization Strategy":** In critical theory, this is the act of taking a historical/social contingent fact and framing it as a law of nature to make it seem inevitable.
  3.  **"The Materialist God of the Gaps":** A play on the theological fallacy. Just as theologians used to say "God explains lightning" and then retreated to "God explains the Big Bang" as science advanced, this arguer says "Matter explains value," then retreats to "Matter explains atomic weight" as sociology advances.

  ### Summary
  The move is a **Recursive Retreat to Brute Facts**.

  It differs from **Goalposts** because the definition of "proof" remains constant (find the objective ground), while the *location* of that ground moves. It differs from a standard **Motte-and-Bailey** because it involves a sequence of defensible layers rather than a binary switch between bold and safe. It is a specific rhetorical manifestation of **Reductive Materialism**.
