answer: |-
  ### Part 1: Order and Dependencies

  You cannot introduce the word "desert" until you have separated *moral fit* from *physical push*. If you use the word too early, the group will hear "blame." The sequence must build a specific dissatisfaction with physical causation before offering desert as the solution.

  1.  **The Intuition of Fairness (Minutes 0–15):** Establish that humans have a pre-theoretical demand for moral coherence. We feel unease when the wicked prosper and the innocent suffer. This is not yet karma; this is just human moral psychology.
      *   *Dependency:* You need the group to admit that a universe where suffering is *random* feels morally incomplete, even if it is physically possible.
  2.  **The Insufficiency of Physical Causation (Minutes 15–30):** Demonstrate that physical cause-and-effect cannot satisfy the intuition from Step 1. Physics explains *how* a house burned down (wiring), but not *why this person* (who stole) lost the house while the honest neighbor did not.
      *   *Dependency:* You must establish that physical causation is "blind" to moral status.
  3.  **The Definition of Desert (Minutes 30–45):** Only now introduce "desert." Define it not as "they caused it" but as "the outcome *fits* the moral agent." Desert is a relationship of *appropriateness*, not necessarily *mechanics*.
      *   *Dependency:* This only works if Step 2 successfully created a gap between "what happened physically" and "what feels morally right."
  4.  **Karma as the Theory of that Desert (Minutes 45–60):** Position karma as the name for the theory that bridges the gap in Step 2 using the definition in Step 3.
      *   *Dependency:* Requires the group to accept that a theory can posit links that are not empirically visible (see Complication below).

  ### Part 2: The One Case

  **The Case:** "The Silent Fire."
  Maria, a wealthy shopkeeper, knowingly sells diluted medicine to sick customers to increase profit. She is never caught; her business thrives. Five years later, Maria's warehouse burns down due to a freak electrical storm (lightning strike). She loses everything. A competitor, who treated customers honestly, suffers no such loss.

  **What it must contain:**
  *   **A Moral Wrong:** Clear, intentional harm (diluting medicine).
  *   **A Suffering Event:** Clear, significant loss (fire).
  *   **An Empirical Gap:** No physical connection between the act and the fire (lightning is random).
  *   **No Institution:** No police, no lawsuit, no god throwing the lightning bolt.

  **What it must lack:**
  *   **Immediate Consequence:** The fire cannot happen *while* she is committing the fraud (that looks like physical causation).
  *   **Psychological Guilt:** Maria cannot be suffering from anxiety or guilt (that makes the suffering internal/psychological rather than external fate).
  *   **Witnesses:** No one in the story suspects the link.

  **Why the usual illustrations fail:**
  The bully who trips and the smoker with cancer fail the **"Physicist Test."** In those cases, a physicist could fully explain the suffering without referencing morality (gravity tripped the bully; tar damaged the lungs). If physics can explain it, it's causation, not karma. Your case must fail the Physicist Test: a physicist would say the lightning was random. Only the *karma theorist* sees the link.

  **The Test Your Example Must Pass:**
  **The "Alternative Outcome" Test.** Ask the group: "If karma is true, could the lightning have struck the honest competitor instead?" If they say "No," they understand desert. If they say "Yes, lightning is random," they are stuck on causation. The case works only if the group feels that the lightning striking Maria is *different* than it striking the neighbor, despite the physics being identical.

  ### Part 3: Misconceptions and Defusal

  Expect these four, in this order. Note the one you missed.

  1.  **"What Goes Around Comes Around" (The Slogan):**
      *   *When:* Minutes 10–20.
      *   *Defusal:* Acknowledge it as the pop-culture summary, but label it "imprecise." Ask: "Does 'what goes around' imply a physical boomerang, or a moral echo?" Push them toward "echo."
  2.  **Victim-Blaming (The Causation Confusion):**
      *   *When:* Minutes 30–40 (Upon introducing Desert).
      *   *Defusal:* This is the critical moment. You must say: "Desert does not mean Maria *physically caused* the lightning. It means the lightning *belonged* to her morally." Distinguish *authorship of the act* from *ownership of the consequence*.
  3.  **The Cosmic Bookkeeper (The Agent Error):**
      *   *When:* Minutes 45–55.
      *   *Defusal:* Participants will ask, "Who is keeping track?" Defuse by using the law of gravity analogy. "Gravity doesn't keep a list of apples; it just acts." Karma is a law of moral gravity, not a ledger held by a deity.
      *   *Role for Buddhist Regulars:* Ask them here: "In your tradition, is there a judge, or is this a law of nature?" Let them confirm the impersonal nature.
  4.  **Transactionalism (The Missed Misconception):**
      *   *When:* Minutes 55–65.
      *   *Description:* The idea that one does good *in order to* secure safety ("I will donate to charity so my house doesn't burn down").
      *   *Defusal:* Point out that this turns karma into a bribe. If the theory is about *desert*, you cannot game the system. The focus must be on the *quality of the act*, not the *security of the payout*.

  ### Part 4: Minute 70 Check

  Do not ask them to define karma. Ask them to complete a sentence that forces the distinction.

  **The Task:** Write two sentences on the board regarding Maria's fire.
  1.  "Maria's warehouse burned down *because*..."
  2.  "Maria suffered this loss *because*..."

  **The Instruction:** "Fill in the blanks. For sentence 1, give me the physicist's answer. For sentence 2, give me the karma theorist's answer."

  **The Success Criterion:**
  *   **Failure:** If they say "faulty wiring" for both, they see only causation. If they say "she was bad" for both, they are victim-blaming (conflating cause and desert).
  *   **Success:** If they say "lightning/wiring" for #1 and "her dishonesty" for #2, they have successfully separated physical causation from moral desert. They understand that the "because" in sentence #2 is theoretical, not mechanical.

  ***

  ### Constraints, Complication, and The Regulars

  **What to Refuse to Settle:**
  State these explicitly at Minute 5:
  1.  **Truth:** "We are not deciding if karma is *true*, only what it *means*."
  2.  **Rebirth Mechanics:** "We are not discussing *when* the payout happens (next life vs. this life). We are discussing the *link type*."
  3.  **Escape:** "We are not discussing how to *end* karma (nirvana/moksha). We are discussing how it *operates*."

  **The Complication (The Theory-Only Link):**
  You noted your case connects payout to deed *only via the theory itself* (no record, no memory).
  *   **Where to use it:** Minute 45 (Transition from Insufficiency of Physics to Definition of Desert).
  *   **Why:** If you reveal this early, the case looks like magic or superstition. If you reveal it *after* they have agreed that physical causation is morally insufficient (Part 1, Step 2), the "invisible link" becomes a necessary theoretical postulate rather than a magical claim.
  *   **Instruction:** Say: "In this story, there is no physical record of the link. The link exists *only if* the theory is true. This is the feature, not the bug. It forces us to choose: is the universe morally blind, or is there a connection physics can't see?"

  **The Buddhist Regulars:**
  *   **Risk:** They may correct your "Desert" framing if it leans too heavily on Hindu/Nyaya interpretations rather than Buddhist *volition* (cetana).
  *   **Strategy:** Do not make them co-teachers. Make them "Tradition Witnesses."
  *   **When:** At Minute 55 (The Bookkeeper) and Minute 65 (Rebirth refusal).
  *   **Instruction:** Ask specific boundary questions: "Does your tradition view this as a debt being paid, or a habit being formed?" This keeps them within your session's philosophical scope without ceding control of the room.

  ***

  ### Note on Commitment and Breakdown

  **Reading Committed To:**
  This sequence quietly commits you to **Karma as Retributive Debt**. By focusing on "desert" and "fit" regarding a past wrong (Maria's theft) and a present suffering (the fire), you are framing karma as a balancing of scales. Suffering is the payment of a moral debt incurred by action.

  **Alternative Consideration:**
  You would build the session differently if you wanted to frame Karma as **Formative Character** (Suffering as education/habituation). To do that, you would focus the case not on the *fit* between crime and punishment, but on how the suffering *changes* the agent's future capacity to act. You would ask, "How does this fire change Maria's soul?" rather than "Did Maria deserve this fire?"

  **Likely Breakdown Point:**
  The plan is most likely to break down at **Minute 30 (Victim-Blaming Defusal)**. This group is secular and sensitive to injustice. They may reject the *need* for moral desert entirely, preferring a universe where bad things happen randomly to good people over a universe where victims are theoretically "matched" to their suffering. If they reject the *Intuition of Fairness* in Part 1, the rest of the session collapses. Be prepared to pivot to: "Even if the universe doesn't care, why do *we* care?"
