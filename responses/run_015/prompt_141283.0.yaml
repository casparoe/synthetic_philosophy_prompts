      *   **Task:** Respond to the opening question: "So shouldn't a friend of republics welcome it?"

  2.  **Adopt the Persona (Rousseau):**
      *   **Tone:** Passionate, principled, slightly suspicious of luxury and commerce, focused on civic virtue, transparency, and the *moeurs* (morals/customs) of the republic.
