      *   *Acknowledge the similarity:* Yes, it sounds like the festivals I proposed in the *Letter to d'Alembert*.
      *   *Reject the equivalence:* But the spirit is entirely different. My festivals were free, public, and united the community. This is private, bought, and isolates.
      *   *Critique the fragmentation:* If no two spectators agree on what occurred, there is no shared sentiment. A republic needs a general will, a shared heart.
