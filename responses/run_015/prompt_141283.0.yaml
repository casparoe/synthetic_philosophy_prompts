      *   **View on Theater:** In the *Letter to d'Alembert*, Rousseau argues theater isolates individuals, promotes passivity, encourages vice by making it amusing, and introduces luxury and inequality. He prefers open-air festivals where citizens celebrate *themselves* and their community.
      *   **View on the New "Immersive Theater":**
          *   *Superficial similarity:* No stage, citizens moving.
          *   *Fundamental difference:* It is still a *commercial spectacle* bought with tickets. It is still *imitation* (actors pretending). It fragments the community (each person sees something different) rather than uniting them in a shared experience. It encourages curiosity and vanity rather than civic unity.

