answer: |-
  ### Conceptual Architecture: Desiderata for a Differentiated Theory of Artistic Value

  To move beyond the collapsed debate of "art vs. artist," a viable theory of artistic value must satisfy the following five desiderata. These requirements are designed to prevent the conflation of biographical sin, representational harm, and material exploitation, while still offering a usable framework for judgment.

  #### 1. The Locus Differentiation Requirement
  **Specification:** The theory must categorize moral failures into three distinct ontological categories: (A) Biographical (actions of the creator outside the work), (B) Representational (harmful ideologies embedded in the content/form), and (C) Production/Circulation (harm inflicted to bring the work into existence or market). A verdict on category A cannot logically dictate a verdict on category B or C without additional bridging premises.
  *   **Motivating Case:** The technically masterful portrait by a perpetrator of violence. A theory that automatically devalues the portrait based on the violence commits a category error, conflating the ethics of the hand with the ethics of the canvas.
  *   **Status:** **Non-Negotiable.** This is the foundational insight of your feature; without this, the "collapse" you identified persists.

  #### 2. The Four-Case Stress Test
  **Specification:** The theory must provide a coherent evaluation mechanism for four specific boundary conditions:
  1.  **The Violent Virtuoso:** High aesthetic merit, high biographical moral failure.
  2.  **The Contaminated Collaboration:** A collective work where only one contributor committed fraud (distributing moral responsibility).
  3.  **The Hypocritical Artifact:** A film whose narrative condemns exploitation, but whose production relied on exploitative labor (contradiction between Content and Production).
  4.  **The Authorless Archive:** A digitally generated image trained on stolen data where no single human author is identifiable (dissolution of the "artist" category).
  *   **Motivating Case:** The **Hypocritical Artifact** and **Authorless Archive**. These cases break the assumption that the "artist" is a singular moral agent and that the "work" is morally consistent.
  *   **Status:** **Non-Negotiable.** If a theory cannot handle the AI or Collaborative cases, it is obsolete for contemporary aesthetics.

  #### 3. The Non-Transitivity Constraint
  **Specification:** The theory must explain why a moral flaw in one locus does not *automatically* transfer to the aesthetic value of another locus, while acknowledging that they may interact. It must allow for the possibility of a "morally rotten, aesthetically brilliant" object and a "morally virtuous, aesthetically bankrupt" object.
  *   **Motivating Case:** The **Violent Virtuoso**. If moral failure automatically negated aesthetic value, there would be no debate to have; the art would simply be "bad." The persistence of the debate suggests our intuitions resist automatic transitivity.
  *   **Status:** **Non-Negotiable.** This preserves the logical space for the debate. If transitivity is automatic, the theory is just Moralism in disguise.

  #### 4. The Empirical Congruence Requirement
  **Specification:** The theory cannot contradict established findings in moral psychology regarding the "contagion effect" and "aesthetic discounting." Specifically, it must account for data showing that: (a) knowledge of an author's crimes reliably lowers reported enjoyment for a significant portion of viewers, and (b) moral disgust can physiologically inhibit the capacity for formal appreciation, even if the viewer wishes to separate them. However, it must also account for viewers who report *unchanged* aesthetic judgment despite moral knowledge.
  *   **Motivating Case:** Empirical studies on **Moral Disgust**. If a theory posits that we *can* separate art from artist, but psychological data shows that moral disgust physically blocks aesthetic pleasure for most people, the theory is normatively ideal but descriptively false.
  *   **Status:** **Non-Negotiable.** A theory of value that contradicts the psychology of valuing is speculative fiction.

  #### 5. The Evaluative Coherence Mandate
  **Specification:** Despite maintaining the distinctions above, the theory must yield a unified recommendation for engagement (e.g., exhibit, censor, contextualize, or ignore). It cannot simply say "these things are different" and stop; it must explain how to weigh them when they conflict.
  *   **Motivating Case:** The **Hypocritical Artifact**. Knowing the film condemns exploitation (Content) but used exploitation (Production) leaves a curator with a binary choice: show it or don't. A theory that offers no decision procedure is practically useless.
  *   **Status:** **Preference of the Institution/Curator Camp.** Pure philosophers might argue the job is just analysis, but for a publication tracking aesthetics in the wild, a decision procedure is required.

  ***

  ### The Most Damaging Desideratum

  **The Requirement to Adjudicate Production Flaws Independently of Representational Content (derived from Desideratum 2 & 3).**

  This requirement inflicts the most damage to the three common positions because it targets the definition of "the work" itself, which all three positions take for granted.

  *   **Damage to Pure Formalism:** Formalism defines the work by its internal properties (line, color, composition). It has no mechanism to process Production Flaws (exploitative labor) because those are external to the form. To satisfy this desideratum, Formalism must admit that external conditions constitute part of the work's identity, which dissolves Formalism.
  *   **Damage to Pure Moralism:** Moralism typically argues that moral defect *is* aesthetic defect. However, in the **Hypocritical Artifact** case (anti-exploitation narrative made via exploitation), Moralism struggles to calculate the value. Is the work "good" because it condemns evil, or "bad" because it enacts it? Pure Moralism lacks the granularity to weigh Production against Content separately; it tends to flatten them into a single "moral score."
  *   **Damage to Moderate Separatism:** This view argues we should judge the work by its internal properties but acknowledge the artist's context. It fails the **Authorless Archive** (AI) case. If there is no human author to "separate" from the art, the Separatist framework collapses. Furthermore, Separatism usually treats Production conditions as external context, not internal value. This desideratum demands Production be weighed *as* value, which Separatism resists.

  ***

  ### Jointly Unsatisfiable Requirements

  **Pair:** **The Empirical Congruence Requirement** (Desideratum 4) AND **The Non-Transitivity Constraint** (Desideratum 3).

  *   **The Conflict:**
      *   **Non-Transitivity** demands a normative framework where aesthetic value *can* remain intact despite moral failure (i.e., it is logically possible to separate them).
      *   **Empirical Congruence** acknowledges data suggesting that for many viewers, moral knowledge *causally alters* aesthetic perception (i.e., psychologically, they often cannot separate them).
      *   **The Impasse:** If the theory respects the empirical data (that disgust blocks beauty), it validates a form of psychological Moralism where the art *becomes* worse because the viewer *feels* it is worse. If the theory respects Non-Transitivity (that the art *remains* good despite the disgust), it risks prescribing a mode of viewing that is psychologically impossible for a large segment of the audience. You cannot simultaneously demand that viewers *should* be able to separate the two (Normative) and acknowledge that human psychology *prevents* them from doing so (Descriptive) without creating a theory that is either tyrannical or irrelevant.

  ***

  ### Position Scorecard

  Here is how the three dominant positions fare against the full list of desiderata:

  | Position | Locus Differentiation | Four-Case Stress Test | Non-Transitivity | Empirical Congruence | Evaluative Coherence |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pure Formalism** | **Fail.** Ignores Bio/Production loci entirely. | **Fail.** Cannot process AI/Production cases. | **Pass.** Insists art is autonomous. | **Fail.** Contradicts data on moral contagion. | **Pass.** Clear (judge form only). |
  | **Pure Moralism** | **Fail.** Collapses all loci into "Moral Good/Bad." | **Fail.** Struggles with Hypocritical Artifact (mixed signals). | **Fail.** Assumes moral flaw = aesthetic flaw. | **Pass.** Aligns with disgust data. | **Pass.** Clear (ban/celebrate based on morals). |
  | **Mod. Separatism** | **Pass.** Distinguishes Bio from Work. | **Fail.** Breaks on AI (no author) & Production (external). | **Pass.** Allows for separation. | **Mixed.** Assumes separation is possible. | **Fail.** Often yields "It depends" without weighing. |

  **Summary of Fault Lines:**
  The structure of the problem reveals that **Formalism** breaks on *Reality* (it ignores how art is made and received). **Moralism** breaks on *Logic* (it cannot distinguish between a bad person and a bad painting). **Moderate Separatism** breaks on *Contingency* (it relies on a stable human author and a clear boundary between "internal" and "external," both of which are dissolving in the age of AI and globalized production). Your feature's architecture should highlight that the solution requires a new category entirely—one that treats the *conditions of production* as an aesthetic property, not just a moral footnote.
