answer: |-
  Here is the breakdown for the room you are walking into. They are not looking for metaethical precision; they are looking for explanatory leverage. If you sound like you are dismissing their data with armchair speculation, you will lose them. If you sound like you are using their data to tighten a screw they didn't know was loose, you will keep them.

  ### Part 1: The First Five Minutes (Pre-emptive Concessions)
  *Do not wait for Q&A to clarify these. State them in your intro to prevent the room from spending 30 minutes fighting strawmen.*

  1.  **Concede the Genealogy is Hypothetical:** Explicitly state: "I am not claiming to offer the *actual* complete causal history of moral belief. I am offering a *test*. If science *can* tell that story without moral facts, realism is in trouble. I am betting on your success, not my own historical narrative."
  2.  **Concede You Aren't Debunking Morality's Utility:** "This argument is about *truth*, not *use*. Moral beliefs might be essential for cooperation, group stability, or individual fitness. My argument leaves all that intact. It only targets the claim that these beliefs track mind-independent facts."
  3.  **Concede the Target is Narrow:** "I am not arguing against naturalism. If you think moral facts *are* facts about welfare, suffering, or social contracts that exist in the natural world, this argument doesn't touch you. I am targeting the view that moral facts are 'queer' entities outside the causal order."
  4.  **Concede You Need Them:** "I cannot run this test without your models. If the genealogy is incomplete, the test is inconclusive. I am asking for your help to see if the causal story closes."

  ### Part 2: The Eight Objections (Ranked by Damage)

  #### 1. The "Incomplete Data" Objection
  *   **Who:** The Moral Psychologist (the skeptic) or the Lead Behavioral Ecologist.
  *   **Register:** "You're treating a working hypothesis as a finished model. We don't have the full ontogenetic or phylogenetic story for *any* complex behavior yet. You're declaring victory because the current model doesn't include moral facts, but that's just because we haven't found where they fit yet. It's a 'god of the gaps' argument."
  *   **The Reply:** "I agree we don't have the final story. But look at the trajectory. Every time we fill a gap (e.g., oxytocin mechanisms, reciprocity algorithms), it's filled with natural causes, not moral facts. The burden isn't on me to prove the story is complete; it's on the realist to show where a non-natural fact *could* fit in a causal chain that is already closing up. If the train is leaving the station, you can't just say 'maybe there's a passenger we missed.'"
  *   **The Soft Spot:** You are relying on an inductive hunch about the future of science. If they produce a model where 'moral fact' is a necessary variable to predict variance in behavior, you lose. **Concede this:** "If you can show me a variable in your model that *must* be interpreted as a non-natural moral fact to make the math work, I will withdraw the argument."

  #### 2. The "Cultural Noise" Objection
  *   **Who:** One of the Dual-Inheritance Modelers.
  *   **Register:** "You're focused on genetic selection. But moral beliefs change way faster than genes. This is cultural evolution. Biases like prestige, conformity, and content biases drive this. Even if genes are inert, cultural selection might track truth via group-level fitness. You're attacking the wrong timescale."
  *   **The Reply:** "Cultural evolution actually strengthens the inertness test. Cultural transmission is *more* sensitive to social payoff than genetic fitness. If a belief spreads because it signals loyalty or status (prestige bias), that's still a causal story about social utility, not moral truth. Deleting the moral fact still leaves the cultural selection pressure intact. The mechanism changes, the inertness remains."
  *   **The Soft Spot:** If cultural evolution allows for 'group truth-tracking' (e.g., groups with true moral beliefs outcompete others), the inertness claim weakens. **Concede this:** "If you can demonstrate that groups holding *true* moral beliefs outcompete groups holding *false* ones, independent of cohesion effects, then moral facts are no longer inert. I doubt that data exists, but if you have it, I'm wrong."

  #### 3. The "Self-Defeat / Reliability" Objection
  *   **Who:** The Philosopher of Biology (teleosemantics) or the Skeptical Psychologist.
  *   **Register:** "If evolutionary history explains our moral beliefs without truth, doesn't it explain *all* our beliefs, including the ones you used to build this argument? Your cognitive faculties were selected for fitness, not metaphysical truth. You're sawing off the branch you're sitting on."
  *   **The Reply:** "There's a difference between a domain where we have independent checks and one where we don't. For empirical beliefs (e.g., 'there is a tiger'), the world pushes back. If I'm wrong, I get eaten. For moral facts, by the realist's own admission, they don't causally interact with the world. There is no 'moral tiger' to eat me. My argument relies on the specific causal isolation of the moral domain, not global skepticism."
  *   **The Soft Spot:** This relies on a distinction between 'observational' and 'moral' faculties that is messier in practice. **Concede this:** "If you can show that moral reasoning uses the same error-correction mechanisms as empirical reasoning (e.g., prediction error), then the disanalogy holds less water. I'm assuming moral intuition lacks that feedback loop."

  #### 4. The "Domain Specificity" Objection
  *   **Who:** The Cooperation Biologists (the group of eight).
  *   **Register:** "Morality isn't one thing. It's disgust, fairness, harm, authority. You're treating it as a monolith. Maybe 'harm' tracks real suffering (natural fact), while 'purity' is just an adaptation. You can't debunk the whole system based on one module."
  *   **The Reply:** "I welcome the fragmentation. If 'harm' reduces to 'suffering' (a natural fact), then I'm not debunking that. I'm only debunking the *residual* realism—the claim that there's a 'wrongness' property *over and above* the suffering. If you're a naturalist about harm, we agree. I'm only targeting the non-naturalist residue."
  *   **The Soft Spot:** If they argue that 'wrongness' is a real, natural property of suffering, you have to fight the naturalism battle, which you wanted to avoid. **Concede this:** "If you define moral facts as natural facts about welfare, I am not your target. I am targeting facts that exist even if no one cares about welfare."

  #### 5. The "Math and Logic" Objection
  *   **Who:** The Modelers or Philosopher of Biology.
  *   **Register:** "Mathematical facts are causally inert. 2+2=4 doesn't push neurons. But we trust math. If inertness implies defeat, you have to debunk math too. If you exempt math, you're making an ad hoc exception for morality."
  *   **The Reply:** "Math is indispensable for the causal story itself. You can't write your selection models without math. Moral facts are *explanatorily redundant*; math is *explanatorily essential*. Deleting math breaks the genealogy; deleting moral facts leaves it intact. That's the difference."
  *   **The Soft Spot:** Some philosophers argue math is also redundant (nominalism). If they press that, you're in a metaphysical rabbit hole. **Concede this:** "If you can show me a causal explanation of moral belief that *requires* moral facts the way physics requires numbers, then the analogy holds. Until then, the redundancy distinction stands."

  #### 6. The "Fitness as Truth" Objection
  *   **Who:** The Adaptationists.
  *   **Register:** "Selection tracks fitness. If moral beliefs enhance fitness, they track *something* real about the social environment. Why call it 'inert' if it correlates with survival success? That's a kind of truth."
  *   **The Reply:** "Fitness isn't moral truth. A belief can be fitness-enhancing because it's comforting, cohesive, or intimidating, not because it's true. Believing God is watching you might boost cooperation (fitness), but that doesn't make God real. Tracking fitness is not tracking moral fact."
  *   **The Soft Spot:** If they define moral truth *as* fitness (evolutionary ethics), you are arguing semantics. **Concede this:** "If you are defining 'moral truth' as 'adaptive strategy,' then I am not debunking you. I am debunking the claim that adaptation equals mind-independent truth."

  #### 7. The "Category Error" Objection
  *   **Who:** The Philosopher of Biology.
  *   **Register:** "You're asking for moral facts to act like physical causes. But norms aren't causes; they're standards. Asking if a norm causes a belief is like asking if the rules of chess cause a move. It's the wrong category."
  *   **The Reply:** "Realists claim these facts exist objectively. If they exist, they must have some relation to the world. If that relation is so weak that it leaves no trace on the causal history of our beliefs, then they are epistemically inaccessible. I'm not asking them to be neurons; I'm asking them to be *relevant*."
  *   **The Soft Spot:** This is the strongest philosophical objection. If moral facts are non-causal standards, the Inertness Test might be category-mistaken. **Concede this:** "If the realist position is that moral facts are *constitutive* rather than *causal*, my test needs adjustment. But most realists I read claim these facts explain why we *should* believe, which implies an epistemic link I'm testing."

  #### 8. The "Pragmatic Dismissal" Objection
  *   **Who:** The Skeptical Psychologist.
  *   **Register:** "Okay, suppose you're right. Moral facts are inert. Does that change how we run experiments? Does it change how we treat subjects? If not, why are we spending 40 minutes on this?"
  *   **The Reply:** "It changes how we interpret our data. If we think we're measuring 'moral perception,' we might be measuring 'adaptive intuition.' It stops us from reifying our intuitions as cosmic laws. It keeps the science honest about what it's actually finding."
  *   **The Soft Spot:** It really might not change their day-to-day work much. **Concede this:** "It might not change your methods. But it should change your claims about what those methods reveal about the universe."

  ### Part 3: The Single Reply for Success
  *To make this talk count as a success with this specific room, one distinction must land:*

  **The distinction between "Causal Explanation" and "Epistemic Justification."**

  You need them to see that providing a *causal* story (which they do) creates an *epistemic* problem for the realist (which they haven't considered).
  *   **The Line:** "You provide the causal story. I'm just pointing out that if that story is complete, the realist has no work left to do. I'm not doing science; I'm auditing the explanatory budget."
  *   **Why:** This validates their work (they hold the keys to the genealogy) while maintaining your philosophical point (the budget doesn't balance for the realist). It makes you a collaborator, not an critic.

  ### Part 4: The Dreaded Question
  *You can feel it. It's the one that exposes the practical cost of your argument.*

  **The Question:** (Likely from the Skeptical Psychologist or the most pragmatic Biologist)
  *"If you're right, and moral facts are inert fictions... why shouldn't we just treat them as useful fictions? Why does it matter if people believe they are 'true'? Isn't debunking them dangerous if they promote cooperation?"*

  **The Safe Answer (Don't give this):** "Philosophy doesn't dictate practice. We can keep acting as if they are true." (This sounds evasive and confirms their suspicion that philosophers are irrelevant).

  **The Brave Answer (Give this):**
  "Because useful fictions are still lies. If we base our cooperation on the idea that 'fairness' is a cosmic law, we build our social systems on a premise we know is false. That makes the system fragile. If we admit morality is a human construction for cooperation, we take responsibility for maintaining it. We stop looking for cosmic backup when things go wrong. It's more honest, and I think, ultimately more stable, to cooperate because we choose to, not because we think the universe forces us to. I'd rather we cooperate because we value each other, not because we're hallucinating a moral law."

  **Why this works:** It acknowledges the risk (danger to cooperation) but flips the value proposition (honesty/responsibility > cosmic security). It shows you understand the stakes of their research (cooperation) without retreating into metaethical safety. It respects their intelligence.
