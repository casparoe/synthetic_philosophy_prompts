      *   *Outlier:* I initially thought Synesthete, but actually, the **Inverted Implant ambivalence** is the signal that the principle needs refinement. However, the prompt asks which *verdict* is the outlier. The Synesthete verdict is the most distinct from standard Mary cases. I'll stick with Synesthete as the "niche" intuition, but acknowledge the Implant is the "stress test."
