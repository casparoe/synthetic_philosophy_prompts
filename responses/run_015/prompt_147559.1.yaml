answer: |-
  This is a fascinating set of intuitions. You have a very coherent philosophical "fingerprint," even if the Inverted Implant case is giving you trouble (which is normal—that case is designed to break intuitions).

  Your gut calls strongly suggest you are a **Phenomenal Realist** who subscribes to an **Acquaintance-Based Theory of Phenomenal Knowledge**.

  Here is the breakdown of the principles, how they score against your cases, the prediction for the AI, and an analysis of your outlier.

  ### Candidate Principle 1: The Phenomenal Acquaintance Principle (PAP)
  **Definition:** To know "what it is like" to experience X, a subject must **token** (instantiate) the specific phenomenal property associated with X in their own consciousness. External causes don't matter; functional output doesn't matter; only the presence of the subjective state matters.

  *   **Classic Mary:** **SAVES.** She tokens the red-quale for the first time. She gains acquaintance.
  *   **Zombie Mary:** **SAVES.** She tokens nothing (no consciousness). No acquaintance, no knowledge.
  *   **Fake-Red Drug:** **SAVES.** The pill tokens the red-quale. The cause (pill vs. photon) is irrelevant; the state is present.
  *   **Archive Reader:** **SAVES.** They have data, but they never token the state. No acquaintance.
  *   **Synesthete Reversal:** **SAVES.** They stop tokening the specific "red-via-number" quale. Loss of tokening = loss of knowledge.
  *   **Inverted Implant:** **PARTIAL SAVE.** (See analysis below).

  ### Candidate Principle 2: The Veridical Causal Link Principle (VCLP)
  **Definition:** To know "what it is like" to experience X, you must token the state **caused by the appropriate external property X**. (This is an Externalist view).

  *   **Classic Mary:** **SAVES.**
  *   **Zombie Mary:** **SAVES.**
  *   **Fake-Red Drug:** **KILLS.** Your intuition says the drug works; VCLP says it shouldn't because there is no red light.
  *   **Archive Reader:** **SAVES.**
  *   **Inverted Implant:** **KILLS.** The red light causes a green-quale. The link is broken.

  ### Candidate Principle 3: The Functional Knowledge Principle (FKP)
  **Definition:** Knowing "what it is like" is just knowing the functional role the state plays (how it affects behavior, memory, etc.).

  *   **Classic Mary:** **KILLS.** You believe she learns something *new* beyond physical/functional facts.
  *   **Archive Reader:** **KILLS.** You believe the reader is missing something essential despite perfect prediction.
  *   **Zombie Mary:** **KILLS.** Functionally, Zombie Mary is identical to Real Mary. If functionalism were true, Zombie Mary *would* gain the knowledge. You say she doesn't.

  ---

  ### The Verdict: Your Consistent Principle
  You are operating on **The Phenomenal Acquaintance Principle (PAP)**.

  Your intuition is that phenomenal knowledge is a **relation between a subject and a phenomenal property**. If the property isn't present in the subject's mind, the knowledge relation cannot exist. This explains why the *Fake-Red Drug* works (property is present) and why the *Archive Reader* fails (property is absent).

  #### How to resolve the "Inverted Implant" flip-flop
  Your ambivalence here isn't a bug; it's a feature of the English language. "Knowing what red is like" is ambiguous between two things:
  1.  **Knowing the Public Property:** What is the quale associated with wavelength 700nm?
  2.  **Knowing the Private Property:** What is *this* specific qualitative feel?

  Under **PAP**:
  *   When the implant inverts the spectrum, the subject tokens a **Green-Quale** when shown a **Red-Object**.
  *   Do they learn what the *Red-Object* is like? **No.** (They are experiencing Green).
  *   Do they learn what the *New-Quale* is like? **Yes.**
  *   **Resolution:** Your "No" intuition is correct regarding the *object* (red), but your "Yes" intuition is correct regarding the *state* (the new inversion). Since the Knowledge Argument is usually about the *state*, PAP suggests they gain knowledge of the *inverted state*, but they are now mistaken about which external object triggers it.

  ---

  ### Prediction: The Non-Conscious AI
  **Case:** A non-conscious AI processes color data perfectly and generates first-person reports ("I see red, it's vibrant").
  **Your Principle (PAP):** Since the AI is defined as **non-conscious**, it tokens no phenomenal properties. It manipulates symbols, not qualia.
  **Prediction:** The AI **does not know** what it is like. It is functionally identical to your *Archive Reader* or *Zombie Mary*. It has syntax without semantics, simulation without experience.

  ---

  ### The Weirdest Outlier: The Synesthete Reversal
  **Verdict:** You count the loss of a synesthetic association ("red-in-numbers") as a distinct **knowledge-loss**, separate from normal color vision.

  **Why it's an outlier:**
  Most standard formulations of the Knowledge Argument deal with basic sensory modalities (vision, pain). Claiming that a *relational* or *cross-modal* association counts as a distinct piece of phenomenal knowledge requires a "High-Resolution" view of qualia. It implies that "Red" isn't one property, but "Red-as-seen-normally" and "Red-as-triggered-by-5" are epistemically distinct properties.

  **Is it worth saving?**
  *   **Yes:** If you value the granularity of experience. It protects the intuition that *context* changes *phenomenology*. If the experience feels different, the knowledge is different. This keeps your theory honest to the actual texture of consciousness.
  *   **No:** If you want parsimony. You could argue the synesthete just loses a *disposition* or an *association*, not a fundamental piece of phenomenal knowledge. Dropping this would simplify your view to "Basic Sensory Qualia Only."

  **Recommendation:** **Keep it.** It strengthens your commitment to *Acquaintance*. If the subjective feel changes (even via synesthesia), the object of acquaintance changes. Dropping it would force you toward Functionalism (where only the input/output matters), which contradicts your *Classic Mary* and *Archive Reader* intuitions.

  ### Summary of Your Philosophical Profile
  *   **Metaphysics:** Property Dualism (or Non-Reductive Physicalism). You believe physical facts don't exhaust all facts (Classic Mary).
  *   **Epistemology:** Acquaintance Theory. You need to "have" the experience to know it.
  *   **Externalism vs. Internalism:** Internalist. The *Fake-Red Drug* proves you think the internal state matters more than the external cause.
  *   **Consciousness:** Essential. *Zombie Mary* and the *AI* case confirm that without the "light being on," no knowledge is possible.

  You have a very robust, consistent set of intuitions. The only tension is the Inverted Implant, which is resolved by distinguishing between knowing the *stimulus* vs. knowing the *sensation*.
