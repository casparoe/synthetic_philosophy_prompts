  # JOINT CONCEPTUAL STATEMENT: THE BOUNDARY OF AUTHENTIC PREFERENCE AND HIDDEN BIAS

  **Date:** October 26, 2023
  **Parties:** The Correctionist Working Group & The Situatedist Working Group
  **Subject:** Framework for Adversarial Collaboration on Moral Epistemology

  ## PREAMBLE

  This document serves as a formal record of an adversarial collaboration between two research camps historically divided on the epistemology of moral preferences. The **Correctionists** prioritize procedural neutrality to filter social correlations presumed to be biases. The **Situatedists** prioritize experiential authority, arguing that social correlations often encode necessary moral information.

  The purpose of this statement is not to resolve the substantive debate, but to isolate the precise geometric boundaries of the disagreement. We aim to distinguish verbal confusions from substantive divergences, establishing a shared vocabulary for future empirical and phenomenological testing.

  ---

  ## I. AGREED-UPON CLAIMS

  The following propositions are endorsed by both camps. These claims establish the baseline logic required to frame the disagreement without begging the question against either side.

  1.  **Stability Across Counterfactuals:** A moral preference counts as a candidate for a genuine value only if it remains stable under a specified set of counterfactual changes to the agent's circumstances. Both camps agree that a preference that vanishes immediately upon the removal of a trivial convenience is not a robust moral commitment. The disagreement lies strictly in *which* counterfactual changes are relevant (e.g., removing social position vs. removing ecological context).
  2.  **Limits of Introspective Access:** Neither camp claims that agents have transparent access to the etiology of their own moral motivations. Both agree that an agent may sincerely believe a preference is principled while it is actually driven by unacknowledged social conditioning, or conversely, believe a preference is habitual while it actually encodes tacit knowledge. Therefore, first-person testimony regarding the origin of a preference is treated as evidence, not verdict, by both sides.
  3.  **Revision vs. Abandonment:** Both camps distinguish between *revising* a moral belief (updating the application of a value in light of new factual information) and *abandoning* a value (rejecting the underlying normative commitment). Both agree that a procedural filter or a situated critique should ideally result in revision where possible, and that abandonment is a measure of last resort indicating a fundamental error in the normative framework.
  4.  **The Possibility of Error:** Both camps concede that their respective methodologies are fallible. The Correctionist procedure may strip away morally relevant information (False Positive for Bias). The Situatedist approach may retain morally arbitrary prejudices (False Negative for Bias). The collaboration exists to minimize the rate of these respective errors.

  ---

  ## II. TABLE OF PRECISE DISAGREEMENTS

  The following table isolates the specific conditions under which the camps diverge. Crucially, the third column defines the specific evidentiary threshold under which each camp would concede that it has **misclassified** a preference.

  | Point of Divergence | Correctionist Classification Criterion | Situatedist Classification Criterion | Condition for Conceding Misclassification |
  | :--- | :--- | :--- | :--- |
  | **Social Correlation** | If a preference $P$ correlates strongly with social position $S$ (e.g., class, caste, nationality) and cannot be justified by a principle independent of $S$, $P$ is classified as **Bias**. | If a preference $P$ correlates with social position $S$ and $S$ provides unique epistemic access to moral facts $F$, $P$ is classified as **Situated Knowledge**. | **Correctionist:** Concedes error if $P$ is stripped via procedure, yet agents with $S$ consistently achieve better moral outcomes regarding $F$ than those without $S$.<br><br>**Situatedist:** Concedes error if $P$ is retained, but agents with $S$ cannot articulate $F$ or demonstrate how $P$ tracks $F$ better than a universal rule. |
  | **Procedural Filtering** | A preference is validated only if it survives a "veil of ignorance" style test where the agent does not know their specific $S$. | A preference is validated if it coheres with the lived reality of $S$ and facilitates flourishing within that specific ecological/social niche. | **Correctionist:** Concedes error if the procedural filter systematically excludes valid moral claims that are *inexpressible* without reference to $S$.<br><br>**Situatedist:** Concedes error if the reliance on lived reality systematically protects power structures that harm vulnerable subgroups within $S$. |
  | **Neutrality vs. Partisanship** | "Neutrality" is defined as the absence of correlation with arbitrary social lotteries. | "Neutrality" is defined as a disguised partisanship that universalizes the specific $S$ of the dominant group. | **Correctionist:** Concedes error if the "neutral" procedure is shown to mathematically embed the preferences of a specific $S$ despite formal abstraction.<br><br>**Situatedist:** Concedes error if the "partisan" claim cannot be translated or made intelligible to outsiders without total assimilation. |

  ---

  ## III. CRUXES AND PREDICTIVE CASES

  We have identified two sub-questions (Cruxes) where resolution would significantly shift the weight of the argument. For each Crux, we propose a concrete case study. Both camps agree that these cases bear on the Crux. We record in advance what each camp predicts should the Crux be resolved in their favor.

  ### CRUX 1: The Non-Circularity Criterion
  **Question:** Is it possible to construct a criterion for identifying bias that does not itself depend on contested moral preferences or situated assumptions?

  *   **The Test Case: The Algorithmic Auditor**
      Imagine an algorithmic system designed to detect moral bias in policy decisions. The system is trained on a dataset of "reflective equilibria" derived from diverse populations.
      *   **Scenario:** The Auditor flags a specific community practice (e.g., preferential resource allocation to kin in a subsistence economy) as "biased" because it correlates with genetic proximity. The community argues this practice is essential for survival (a moral fact).
      *   **Correctionist Prediction:** If the Non-Circularity Crux is resolved in our favor, the Auditor can identify the kin-preference as bias *without* assuming a competing moral theory, relying solely on structural independence. We predict the Auditor will successfully flag parochialism that the community cannot justify without circular reasoning ("it is right because it is ours").
      *   **Situatedist Prediction:** If the Non-Circularity Crux is resolved in our favor, it will be proven that the Auditor's definition of "structural independence" implicitly encodes a specific moral preference (e.g., individualism over collectivism). We predict the Auditor will flag the kin-preference as bias only by smuggling in a contested value, thereby proving the criterion is circular.

  ### CRUX 2: Moral Terroir vs. Parochialism
  **Question:** Can the phenomenon of "moral terroir" (ethical sensitivities cultivated by local ecological and social conditions that carry unique information) be empirically or phenomenologically distinguished from mere parochialism (in-group favoritism lacking informational content)?

  *   **The Test Case: The Water Rights Dilemma**
      Consider a resource-scarce region where water is managed via two different systems.
      *   **System A (Universalist):** Water rights are allocated based on equal per-capita share, regardless of location or lineage.
      *   **System B (Situated):** Water rights are allocated based on historical stewardship roles and kinship networks that map onto the local aquifer's ecology.
      *   **Scenario:** A drought occurs. System A maintains formal equality but the aquifer collapses due to overuse at critical points. System B maintains inequality (some kin groups get more) but the aquifer survives because the allocation matches ecological constraints known only to the stewards.
      *   **Correctionist Prediction:** If Moral Terroir is indistinguishable from Parochialism, System B's success is accidental or due to non-moral technical knowledge, not moral knowledge. We predict that even if System B survives the drought, the *inequality* remains a moral defect (bias) that must be corrected once the technical data is made universal. The "terroir" is just hidden data, not a distinct moral sensitivity.
      *   **Situatedist Prediction:** If Moral Terroir is distinguishable from Parochialism, System B's allocation *is* a moral virtue because it respects the relational reality of the ecosystem. We predict that correcting System B toward System A (even with full technical data) will degrade the moral fabric of the community, leading to long-term social collapse even if short-term water metrics look equal. The "terroir" carries normative weight that universal data cannot capture.

  ---

  ## IV. CONCLUSION AND NEXT STEPS

  This document confirms that the stalemate between Correctionists and Situatedists is not merely verbal. Both camps agree on the limits of introspection and the need for stability in values. However, they fundamentally diverge on the **epistemic status of social correlation** and the **possibility of a view from nowhere.**

  Resolution of Crux 1 (Non-Circularity) determines whether the Correctionist procedure is viable. Resolution of Crux 2 (Moral Terroir) determines whether the Situatedist defense is robust. Future reporting and research should focus on gathering data relevant to the Test Cases outlined above, specifically looking for instances where procedural filtering leads to ecological/social failure (supporting Situatedists) or where situated knowledge fails to translate into generalizable protection for the vulnerable (supporting Correctionists).

  **Endorsed by:**
  The Correctionist Working Group
  The Situatedist Working Group
