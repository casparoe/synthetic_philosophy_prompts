      *   Part 1: The 4 Distinct Assertions (with Verdicts).
      *   Part 2: The Responsibility Question (Does it actually absolve?).
      *   Part 3: The Friend's Test (Coordination vs. Selection).
      *   Part 4: Actionability (Fatalism vs. Incentive Engineering).
      *   Part 5: The 3 Questions.

