      *   *Refinement on Friend's Test:* The friend's test is good but "costless binding agreement" is impossible. Frame it as "If we *could*..."
      *   *Refinement on Responsibility:* Distinguish between *causal* responsibility (who caused it) and *moral* responsibility (who is to blame). The term conflates them.

  9.  **Final Output Structure:**
