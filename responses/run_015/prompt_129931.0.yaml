answer: |-
  1. **Sequence and the "Measuring Stick" Worry**

      **The Order:**
      1.  **Recall IESDS (5 mins):** Define strict dominance using *pure* strategies only. Remind them that if $s_i$ is strictly dominated, it is never a best response to *any* belief.
      2.  **The Gap (5 mins):** Ask: "We defined dominance as 'worse than another strategy.' Why must that 'other strategy' be pure? What if a lottery is better?"
      3.  **The Game & Round 1 (10 mins):** Put the matrix on the board. Eliminate the obviously dominated pure strategy ($M$).
      4.  **The Crisis (10 mins):** Show that no *pure* strategy dominates $C$ in the reduced game. Pause. Ask: "Is $C$ safe?"
      5.  **The Geometry (10 mins):** Draw the 2D payoff plane. Plot $T$ and $B$. Draw the segment connecting them. Plot $C$. Show $C$ is strictly below the segment.
      6.  **The Interpretation (5 mins):** Explain that the mixture is a *benchmark*, not a prescription.
      7.  **Misconceptions & Closing (5 mins):** Address the "unpredictability" worry and ask the closing question.

      **The Worry:**
      Your worry is **justified** if you introduce mixed strategies via Nash Equilibrium logic (e.g., "mix to keep them guessing"). That frames mixing as an *active tactic* for equilibrium play. In IESDS, mixing is a *passive test* for rationality.
      **How to neutralize it:** Do not use the word "randomize" until the geometry is drawn. Use the word "lottery" or "convex combination." Explicitly say: *"We are not asking if Player 1 wants to flip a coin. We are asking if Player 1 would ever be rational to play $C$ when they could instead hold a ticket that pays out like a mix of $T$ and $B$."*
      **Where you are overthinking:** Second-year undergraduates are usually pragmatic. If the arithmetic shows Expected Utility(Mix) > Utility($C$), they will accept the dominance. The confusion usually arises later when they try to *play* the mix. Keep the lesson focused on *elimination*, not *selection*, and the "poison" won't take hold.

  2. **The Game**

      This game is constructed to meet all your geometric and iterative constraints. It is a 3x3 bimatrix. Player 1 (Rows) chooses $T, C, B$. Player 2 (Cols) chooses $L, M, R$. Payoffs are $(u_1, u_2)$.

      $$
      \begin{array}{c|ccc}
       & L & M & R \\
      \hline
      T & 4, 2 & 0, 0 & 0, 3 \\
      C & 1, 2 & 5, 0 & 1, 0 \\
      B & 0, 2 & 0, 0 & 4, 3 \\
      \end{array}
      $$

      **Why this works:**
      *   **Round 1 (Pure Dominance):** For Player 2, $M$ yields $(0,0,0)$ and $L$ yields $(2,2,2)$. $L$ **strictly** dominates $M$. $M$ is eliminated. (Note: $R$ is not dominated by $L$ because $3>2$ at rows $T$ and $B$).
      *   **Round 1 Check (Player 1):** Before $M$ is removed, is $C$ dominated? Against $M$, $C$ gets 5, while any mix of $T$ and $B$ gets 0. $C$ survives the first pass against both pure and mixed strategies.
      *   **Round 2 (Mixed Dominance):** Now Player 2 plays only $L$ or $R$.
          *   $T$ yields $(4, 0)$.
          *   $B$ yields $(0, 4)$.
          *   $C$ yields $(1, 1)$.
          *   No surviving *pure* strategy dominates $C$ ($T$ fails on $R$, $B$ fails on $L$).
          *   However, a 50/50 mixture of $T$ and $B$ yields $(2, 2)$. Since $2>1$ in both columns, $C$ is **strictly dominated by a mixture**.
      *   **No Weak Dominance:** $M$ is strictly dominated. $C$ becomes strictly dominated. No strategy is *only* weakly dominated, avoiding the collapse of concepts.
      *   **Geometry:** Once $M$ is gone, you plot P1's payoffs on axes $(u_1(\cdot, L), u_1(\cdot, R))$. $T$ is at $(4,0)$, $B$ is at $(0,4)$. The segment connecting them passes through $(2,2)$. $C$ sits at $(1,1)$, visibly "inside" the hull, below the segment.

  3. **Misconceptions and Interventions**

      *   **Misconception:** *"A mixture isn't a real strategy, so it can't dominate a real one."*
          *   **Intervention (During Geometry):** When you plot the segment between $T$ and $B$, say: *"Every point on this line is a feasible expected payoff vector. Rationality requires maximizing expected payoff. If a point on the line is higher than $C$, $C$ is irrational, regardless of whether the player actually flips a coin."*
      *   **Misconception:** *"We must check if $C$ is dominated against Player 2's mixed strategies too."*
          *   **Intervention (Post-Geometry):** *"Expected utility is linear. If a strategy yields more than $C$ against $L$ and more than $C$ against $R$, it yields more than $C$ against any probability distribution over $L$ and $R$. The corners determine the hull."*
      *   **Misconception:** *"If the mix beats $C$, then $T$ must beat $C$ (or $B$ must)."*
          *   **Intervention (At the Plot):** Point to $(4,0)$ and $(0,4)$. *"Individually, they miss. Together, they cover. Dominance by mixture is about the portfolio, not the assets."*
      *   **Misconception:** *"Order of elimination matters here."*
          *   **Intervention (Start of Round 2):** *"Strict dominance order never matters for the final set. But *what counts* as a dominator (pure vs. mixed) does. If we forbid mixes, $C$ survives. If we allow them, $C$ dies. The definition changes the outcome."*

  4. **What to Refuse to Explain**

      Do not explain **Rationalizability** or the **3+ Player case** (where beliefs about opponents might be correlated, breaking the independence assumption required for this specific geometric proof).

      **The One-Liner:**
      *"We are assuming two players with independent beliefs; in larger groups or with correlated signals, the geometry changes, but the logic of 'never play a dominated strategy' remains."*

  5. **The Closing Question**

      Do not ask them to calculate a Nash Equilibrium. Ask them about the relationship between dominance and best responses.

      **Question:**
      *"Strategy $C$ was eliminated in Round 2 by a mixed strategy. Does there exist **any** belief Player 1 could hold about Player 2's choice (consistent with Player 2 being rational) for which $C$ is a best response?"*

      **Expected Answer:**
      *"No. If a strategy is strictly dominated (even by a mix), it can never be a best response to any belief over the opponent's surviving strategies."*

      **Why this works:**
      It forces them to internalize that IESDS isn't just arithmetic pruning; it is the iterative removal of strategies that are *never* rational. If they understand that the mixture represents the *upper bound* of what is achievable, they will see why $C$ could never be optimal.
