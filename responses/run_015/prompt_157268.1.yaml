answer: |-
  This analysis evaluates the **Continuous Causal Integration (CCI)** criterion against standard **Psychological Continuity (PC)** and **Bodily Continuity (BC)** accounts. The CCI criterion posits that identity is not merely a matter of end-state functionalism or biological persistence, but of *dynamic stability during transition*.

  Here is the analysis of the implications, ranked by normative weight, followed by the distinction between necessary consequences and metaphysical assumptions, and the Psychological-Continuity objection.

  ---

  ### I. Implications of the CCI Criterion

  #### (a) Legal and Moral Status of the Intermediate Subject (50/50 Hybrid)
  Under **Bodily Continuity**, a 50/50 hybrid is a deteriorating human, potentially losing rights as biological integrity fades. Under **Psychological Continuity**, the subject retains full status provided memory and character persist, regardless of substrate.

  **Under CCI:**
  *   **The "Vulnerable Person" Status:** The subject retains full moral and legal standing *only conditionally*. Their status is contingent on real-time telemetry confirming that global network dynamics remain within "bounded divergence."
  *   **Regulatory Oversight:** The intermediate subject becomes a regulated entity. Legal personhood is no longer a binary inherent right but a monitored status. If the synthetic neurons cause micro-instabilities (exceeding the "bounds"), the subject could theoretically lose legal standing *before* the process is complete, becoming a "ward of the state" or a new legal entity.
  *   **Liability:** If the hybrid commits a crime, liability hinges on whether the action resulted from "bounded" dynamics (original person) or "divergent" dynamics (new entity/altered state). This creates a "diminished capacity" defense based on substrate integration metrics rather than mental state.

  #### (b) Ethics of Process (Pausing, Accelerating, Omitting)
  This is the most radical departure from standard accounts. **PC** generally allows for gaps (e.g., sleep, coma) if causal chains resume. **BC** is indifferent to the speed of cellular turnover.

  **Under CCI:**
  *   **The Prohibition on Pausing:** Pausing the replacement for economic reasons risks synaptic drift. If the biological and synthetic halves cease to integrate continuously during the pause, the "bounded divergence" threshold may be breached upon resumption. *Implication:* Economic constraints become existential threats. Pausing the procedure could constitute manslaughter (ending the original identity) rather than mere delay.
  *   **Acceleration Risks:** Accelerating the protocol to save costs risks shocking the network dynamics. Speed violates the "gradual" requirement necessary to maintain bounded divergence.
  *   **Selective Omission:** Skipping neurons (to reduce cost) violates the "immediate synaptic-weight relationship" condition. This creates functional scars. *Implication:* A "budget" replacement protocol is ethically equivalent to lobotomy or identity destruction. The process must be medically perfect, not just functionally adequate.

  #### (c) Metaphysical Status of the Fully Replaced System
  **PC** declares the end-state the "Same Person" if psychological connections hold. **BC** declares it a "Successor" or "Copy" once the original body is gone.

  **Under CCI:**
  *   **Contingent Identity:** The fully replaced system is the **Same Person** *if and only if* the integral of divergence over time never exceeded the threshold.
  *   **The "Ship of Theseus" Threshold:** Unlike PC, which is often transitive, CCI introduces a non-transitive risk. You can replace neuron A (stable), then B (stable), but the combination of A+B might cause a dynamic shift that violates the bound.
  *   **No Intermediate Category:** The final system is not an "intermediate category." It is either the original person (continuity preserved) or a causally continuous successor (continuity broken). However, the *path* determines the *destination*. Two identical end-states could have different metaphysical statuses based on the history of their assembly.

  ---

  ### II. Ranking by Practical and Normative Weight

  1.  **(b) Ethics of Process (Highest Weight):**
      *   *Justification:* This determines the *survival* of the subject. If the protocol is flawed (paused, rushed, cheapened), the person ceases to exist. This imposes the heaviest burden on medical providers, insurers, and policymakers. It transforms identity survival into a resource-intensive engineering constraint.
  2.  **(a) Legal/Moral Status (Medium Weight):**
      *   *Justification:* This affects the rights of the subject *during* the decades-long transition. It creates a class of citizens whose rights are probationary. While critical, it is secondary to (b) because if (b) fails, the subject in (a) is no longer the original person.
  3.  **(c) Metaphysical Status (Lowest Practical Weight):**
      *   *Justification:* While philosophically profound, the classification of the *final* state matters less than the survival of the *process*. Once the process is complete, standard rights apply. The metaphysical distinction primarily serves to adjudicate liability and inheritance disputes retroactively.

  ---

  ### III. Necessary Consequences vs. Metaphysical Assumptions

  | Implication | Necessary Consequence of CCI | Requires Further Metaphysical Assumption |
  | :--- | :--- | :--- |
  | **Identity loss via pausing** | **Yes.** If "Continuous" is a necessary condition, breaking continuity breaks identity. | **No.** This follows logically from the definition of CCI. |
  | **Legal probationary status** | **No.** Law could choose to ignore metaphysical nuance for social stability. | **Yes.** Assumes legal systems must track metaphysical truth rather than functional capacity. |
  | **End-state contingency** | **Yes.** If the path defines the identity, identical end-states can differ in status. | **Yes.** Assumes "Historical Essentialism" (that history matters to *what* something is, not just *how* it got there). |
  | **Economic constraints as lethal** | **Yes.** If resources dictate the ability to maintain "bounded divergence." | **No.** This is a socio-technical consequence of the CCI physical requirements. |

  ---

  ### IV. The Psychological-Continuity (PC) Theorist Objection

  A committed Psychological-Continuity theorist (e.g., a Parfitian reductionist) would reject the CCI criterion on the following grounds:

  1.  **Rejection of Substrate Fetishism:**
      *   *Grounds:* PC theory relies on *Multiple Realizability*. What matters is the preservation of memories, character, and intentions (the software), not the specific causal dynamics of the hardware (synaptic weights/voltage).
      *   *Objection:* The CCI requirement for "immediate synaptic-weight relationships" conflates the *vehicle* of psychology with psychology itself. A PC theorist would argue that as long as the *informational* causal chain is preserved, a pause or a shift in network dynamics is irrelevant.

  2.  **Rejection of "Bounded Divergence" as Identity-Critical:**
      *   *Grounds:* PC allows for discontinuities (e.g., general anesthesia, coma) provided the *causal connection* of psychological states is restored.
      *   *Objection:* The "bounded divergence" clause is arbitrary. Why does a 5% shift in network dynamics destroy identity while a 4% shift does not? A PC theorist would argue this creates a "Sorites Paradox" of identity that is practically unmanageable and metaphysically unjustified. They would prioritize *narrative coherence* over *dynamic stability*.

  3.  **The "What Matters" Argument:**
      *   *Grounds:* Derek Parfit argued that "identity" is not what matters; "Relation R" (psychological connectedness) is.
      *   *Objection:* Even if CCI proves the "Same Person" does not survive a paused protocol, the PC theorist would argue the *successor* has all that matters (memories, values). Therefore, the ethical urgency of (b) is overstated. Destroying "identity" in the CCI sense is not morally equivalent to death if psychological continuity is preserved.

  ### Summary
  Adopting the **Continuous Causal Integration** criterion shifts the locus of personal identity from *narrative or biology* to *process engineering*. It makes identity fragile, economically vulnerable, and legally probationary. While it offers a rigorous physicalist account of survival, it imposes a normative burden that Psychological-Continuity theorists would reject as conflating the *conditions of implementation* with the *conditions of existence*.
