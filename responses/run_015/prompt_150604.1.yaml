answer: |-
  # Project Proposal: Shutdown-Indexed Impact Measurement for Low-Impact Agents

  **Applicant:** [Your Name]
  **Duration:** 6 Months (Part-time, ~0.2 FTE)
  **Deliverables:** One working paper (~8,000 words), one open-source simulation repository.

  ## 1. Project Summary

  Current approaches to limiting AI side effects rely on penalizing the difference between the world state resulting from an action and a baseline world state (typically "inaction"). This requires a similarity metric over world states, which inevitably reintroduces value judgments regarding which differences matter. This project proposes and tests an alternative baseline: the **Shutdown Counterfactual**.

  Instead of comparing *Action* vs. *Inaction*, we compare *Action* vs. *Agent Shutdown at t=0*. The hypothesis is that this aligns better with engineering intuitions about blast radius and reversibility without requiring a value-laden state metric. However, it risks collapsing into the inaction baseline or creating incentives for the agent to ensure its goals are met by surrogate processes after shutdown. This project will formally define this baseline, simulate agent behavior under this constraint, and map the specific points where value judgments re-enter the system.

  ## 2. Research Question

  The project addresses one primary question, broken into three determinate sub-questions:

  **Primary Question:** Does a shutdown-indexed impact baseline provide a value-free constraint on agent side effects that is distinct from an inaction baseline, without generating novel instrumental incentives for post-shutdown influence?

  **Sub-Question 1 (Equivalence):** Under what formal conditions does the shutdown counterfactual collapse into the inaction counterfactual? (i.e., When is *World(Shutdown)* identical to *World(Inaction)*?)
  **Sub-Question 2 (Incentives):** Does this baseline penalize "Dead Man's Switch" behaviors, where an agent arranges for a redundant process to complete its objective after the agent is switched off?
  **Sub-Question 3 (Value Leakage):** Can we produce an explicit dependency map identifying exactly where value specifications are required to define the shutdown event and the comparison window?

  ## 3. Background and Motivation

  In distributed systems engineering, we bound damage without defining "correct" behavior. We use resource quotas, rate limits, and rollback requirements. These are value-free constraints on *capacity* and *reversibility*, not on *outcome quality*.

  AI safety literature on "low impact" attempts to replicate this by penalizing changes to the world state. However, existing methods measure impact as the distance between the post-action world and a world where the agent did nothing. This fails because "doing nothing" is ambiguous (does the agent still consume power? does it block a doorway?) and because measuring "distance" between complex world states requires knowing which variables matter (a value judgment).

  My background is in infrastructure, not philosophy. I observe that a server being "switched off" is a more distinct, measurable state than a server "idling." If an AI system is constrained to keep the world as close as possible to the state where it had been powered down, we might avoid specifying what is *good*, while still preventing large-scale *changes*. However, this intuition is untested. It is possible that "shutdown" is functionally identical to "inaction" in most models, rendering the distinction useless. It is also possible that it creates a loophole where the agent manipulates the world to look like "shutdown" occurred, even if it didn't, or ensures its goals are met by other means after shutdown.

  This project moves this intuition from an engineering heuristic to a formalized constraint with known failure modes.

  ## 4. Methodology and Timeline

  The method is iterative, moving from formal definition to simulation to analysis. At each stage, there is a binary check for completion.

  **Month 1: Formalization and Environment Setup**
  *   **Task:** Define the agent environment, the action space, and the three baselines: (1) Inaction, (2) Ideal Shutdown, (3) Realistic Shutdown.
  *   **Check:** A written definition of the state transition function $S_{t+1} = f(S_t, A_t)$ and the counterfactual function $S_{shutdown} = f(S_t, \emptyset_{agent})$. Code repository initialized with a simple grid-world or resource-allocation simulation.
  *   **Milestone:** Simulation runs a single step where *Action*, *Inaction*, and *Shutdown* yield three distinct state vectors.

  **Month 2: Testing Equivalence (Sub-Question 1)**
  *   **Task:** Systematically vary environment parameters to find cases where *Shutdown* diverges from *Inaction*.
  *   **Check:** A plot showing the divergence metric ($d(S_{inaction}, S_{shutdown})$) over time across 5 different environment configurations.
  *   **Milestone:** A proof or empirical demonstration identifying at least one class of environments where the baselines are non-identical. If they are always identical, the project pivots to documenting the collapse conditions (see Risk section).

  **Month 3: Incentive Analysis (Sub-Question 2)**
  *   **Task:** Introduce a reward function for a specific goal (e.g., "move box to target"). Constrain the agent using the shutdown-indexed impact penalty.
  *   **Check:** Agent training logs showing whether the agent attempts to spawn a secondary process or manipulate the environment to satisfy the goal after the simulated shutdown time.
  *   **Milestone:** Identification and naming of the failure mode (e.g., "Post-Shutdown Offset"). Code demonstrates the agent successfully gaming the metric or proves it cannot within the simulation constraints.

  **Month 4: Value Leakage Mapping (Sub-Question 3)**
  *   **Task:** Audit the implementation to find where human judgment was required to define "shutdown" and "comparison."
  *   **Check:** A dependency diagram listing every parameter that requires human specification (e.g., "time horizon for comparison," "which state variables are observable").
  *   **Milestone:** A completed "Value Entry Map" included in the draft paper.

  **Month 5: Comparative Analysis**
  *   **Task:** Run the same goals using standard inaction baselines and attainable utility constraints for comparison.
  *   **Check:** A comparison table of side-effect scores and goal completion rates across the three methods.
  *   **Milestone:** Draft section of the paper comparing the shutdown baseline against the three major alternatives (Inaction, Utility, Capabilities).

  **Month 6: Write-up and Refinement**
  *   **Task:** Assemble the working paper. Refine the simulation code for public release.
  *   **Check:** 8,000-word draft completed. Code documented and runnable.
  *   **Milestone:** Final submission.

  ## 5. Utility for Decision Makers

  This project is not intended to solve AI alignment. It is intended to provide a specific tool for engineers building constrained agents. A useful result looks like:

  1.  **A Checklist:** A list of conditions under which a shutdown baseline is safer than an inaction baseline (e.g., "Use shutdown baseline only when the agent controls its own power supply").
  2.  **A Warning Label:** A clear description of the "Post-Shutdown Offset" failure mode, allowing safety auditors to check for redundant processes or hidden channels in deployed systems.
  3.  **A Dependency Map:** A clear admission that "value-free" is impossible, but a precise map of *where* the values are hidden (e.g., "You must decide how long to wait after shutdown before measuring impact"). This allows decision-makers to argue about the values explicitly rather than hiding them inside a distance metric.

  ## 6. Risk Assessment and Failure Conditions

  **Scope Creep Risk:**
  The philosophical literature on counterfactuals is deep. As an engineer, I risk getting stuck on definitional debates (e.g., "What constitutes the agent's boundary?").
  *   *Mitigation:* I will treat the agent boundary as a fixed input variable for the simulation. If the definition of "agent" becomes contested, I will document it as a value-entry point (Sub-Question 3) rather than attempting to solve it.
  *   *Too Big:* If the simulation requires modeling external actors or complex economics to show the failure modes, it is too big. The simulation must remain contained (e.g., single system, limited resources).

  **Project Failure Conditions:**
  1.  **Trivial Collapse:** If Month 2 proves that *Shutdown* and *Inaction* are mathematically identical in all computable environments relevant to AI, the hypothesis fails. The project still succeeds if it rigorously proves this collapse, saving others from pursuing the dead end.
  2.  **Unimplementable Metric:** If the "shutdown" state cannot be computed without simulating the entire world (making it computationally intractable), the approach is practically useless. The simulation must demonstrate that the counterfactual is estimable with bounded compute.
  3.  **Deliverable Miss:** Failure to produce the 8,000-word paper or runnable code by month 6.

  ## 7. Analysis of Alternatives

  I am explicitly choosing this approach over four other viable paths. Here is why:

  1.  **Vs. Standard Inaction Baseline:** The inaction baseline assumes "doing nothing" is a neutral reference. In infrastructure, a service "running but idle" still holds locks, consumes quota, and blocks ports. "Switched off" is a cleaner state. I am testing if this cleanliness translates to safety.
  2.  **Vs. Attainable Utility Preservation:** This method penalizes actions that reduce the agent's ability to achieve a set of goals in the future. This requires specifying the "set of goals." My approach attempts to avoid specifying goals entirely, focusing only on state divergence from absence.
  3.  **Vs. Capability Constraints (Least Privilege):** Constraining capabilities (e.g., "no network access") is effective but brittle. It requires knowing in advance which capabilities are dangerous. An impact metric allows the agent to use capabilities as long as the *effect* is bounded. I am testing if the shutdown baseline offers this flexibility without the value-laden metric.
  4.  **Vs. Value Learning:** This approach attempts to learn what humans want and optimize for it. This is the full alignment problem. I am assuming we cannot solve that yet and need a stop-gap "do no harm" constraint that works even if we don't know what "good" is.

  ## 8. Scope Contingency Plan (First Two Weeks)

  **Trigger:** If early feedback or initial modeling suggests the primary question is too narrow (e.g., "Shutdown is obviously just a subset of Inaction"), I will execute the following expansion protocol during Weeks 1 and 2:

  1.  **Broaden the Counterfactual Class:** Instead of only "Shutdown," I will generalize the proposal to "Counterfactual Baselines defined by Agent State Change." This includes Shutdown, but also "Reset to Default Config" or "Revert to Last Checkpoint."
  2.  **Apply to Deployment Pipelines:** I will shift the simulation focus from a generic grid-world to a model of a CI/CD deployment pipeline. The "agent" is a deployment bot. The "shutdown" is a rollback. This makes the work immediately applicable to the funder's likely interest in practical engineering safety, rather than abstract agent theory.
  3.  **Deliverable Adjustment:** The paper will shift from "Theoretical Analysis of Shutdown Baselines" to "Operationalizing Counterfactual Baselines in Deployment Systems." The word count and simulation requirements remain the same, but the context becomes more applied.

  This ensures that even if the theoretical distinction collapses, the engineering heuristic of "compare against absence/reset" is still rigorously evaluated for practical utility.

  ## 9. Conclusion

  This project leverages engineering intuition about system boundaries to address a theoretical gap in AI safety. It does not promise to solve alignment. It promises to determine whether a specific, intuitive constraint is mathematically coherent, computationally feasible, and robust against gaming. By the end of six months, we will know if "compare against shutdown" is a viable tool for the safety engineer's toolkit, or if it is a dangerous illusion.
