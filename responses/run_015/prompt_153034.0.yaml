answer: |-
  There is no single, catchy pop-culture name for this specific deadlock (like "The Grandfather Paradox" in time travel), but in legal philosophy and logic, it is the definitive example of **The Paradox of Self-Amendment**, specifically the **Self-Entrenchment Variant**.

  The logical oscillation you described (Old Rule → Valid Change → New Rule → Invalid Change → Old Rule...) is technically called a **Validity Antinomy** or **Validity Oscillation**.

  Here is the breakdown of the name, the logic, and how it differs from ordinary circular reasoning.

  ### 1. The Formal Name: The Paradox of Self-Amendment
  The definitive work on this is by legal philosopher Peter Suber, literally titled *The Paradox of Self-Amendment* (1990). He analyzes exactly this scenario: Can a rule authorize its own replacement with a rule that restricts that authority?

  *   **The General Category:** **Self-Reference Paradox**.
  *   **The Specific Mechanism:** **Self-Entrenchment**. This occurs when a rule uses its own authority to make itself harder to change (e.g., moving from "majority" to "unanimity").
  *   **The Deadlock State:** **Validity Antinomy**. An antinomy is a contradiction between two principles that both seem logically necessary. Here, the antinomy is between the *source* of the rule's validity (the old process) and the *content* of the rule (which denies that process).

  ### 2. Why It Is Not Ordinary Circular Reasoning
  You asked where this ends and ordinary circular reasoning begins. The distinction is crucial:

  **Ordinary Circular Reasoning (Begging the Question)**
  *   **Structure:** Static. "A is true because B is true, and B is true because A is true."
  *   **Flaw:** It provides no *external* justification. It is a fallacy of argumentation.
  *   **Example:** "The charter is valid because the admins say so, and the admins have authority because the charter says so."

  **The Self-Amendment Deadlock (Validity Oscillation)**
  *   **Structure:** Dynamic and Temporal. It involves a sequence of events in time.
      1.  Time 1: Old Rule exists.
      2.  Time 2: Vote occurs (valid under Old Rule).
      3.  Time 3: New Rule comes into effect.
      4.  Time 4: New Rule invalidates the event at Time 2.
      5.  Time 5: If Time 2 is invalid, New Rule never existed, so Old Rule still exists...
  *   **Flaw:** It is not a fallacy of argumentation; it is a **structural incompleteness** in the system. The system lacks a "meta-rule" to decide which timeline of validity counts.
  *   **Key Difference:** Circular reasoning is a mistake in *thinking*. This paradox is a mistake in *design*. It is a feature of self-referential systems (like law, code, or language) where the tool used to build the structure becomes part of the structure.

  ### 3. The Specific Logical Trap: "Performative Contradiction"
  The admin's argument relies on a specific type of logical conflict called a **Performative Contradiction**.
  *   **Definition:** When the *act* of asserting something contradicts the *content* of what is asserted.
  *   **In your scenario:** The *act* of passing the amendment asserts "This change is valid." The *content* of the amendment asserts "Changes require unanimity." If the content is true, the act was invalid.
  *   **The Deadlock:** The system cannot decide if the *act* validates the *content* or if the *content* invalidates the *act*.

  ### 4. How It Is Resolved (Where the Loop Ends)
  In real legal systems and in the game *Nomic*, this loop does not spin forever. It is broken by a **Meta-Rule** that exists outside the text of the charter itself.

  **A. The Presumption of Prospectivity (Legal Standard)**
  Most legal systems resolve this by ruling that new rules apply **prospectively** (forward in time), not **retroactively**.
  *   *Resolution:* The vote was valid when it happened (under the old rule). The new rule applies only to *future* votes. The amendment stands.
  *   *Why:* Without this, no legal system could ever evolve. (This is the argument your second admin made).

  **B. The Rule of Recognition (H.L. Hart)**
  Philosopher H.L.A. Hart argued that laws aren't valid because of logic, but because of **social fact**.
  *   *Resolution:* If the admins *accept* the new rule, it is valid. If they fight over it, the system is in a "revolutionary" state until one side wins.
  *   *Why:* Logic cannot solve this; only power/consensus can.

  **C. Priority Rules (*Nomic* Standard)**
  In the game *Nomic* (which is built entirely on this paradox), players usually adopt a meta-rule early on: **"If rules conflict, the higher-numbered rule wins"** or **"Amendments take effect immediately upon passage."**
  *   *Resolution:* The moment the vote passed, the old rule ceased to exist. It cannot be used to judge the vote that killed it.

  ### Summary
  *   **Name:** **The Paradox of Self-Amendment** (specifically **Self-Entrenchment**).
  *   **Logical State:** **Validity Antinomy** or **Oscillation**.
  *   **Distinction:** Unlike circular reasoning (a static logical fallacy), this is a **temporal performative contradiction** inherent to self-referential systems.
  *   **Resolution:** It ends only when a **Meta-Rule** (like prospectivity) or **Social Fact** (acceptance) breaks the loop.

  Your first admin is technically exploiting a **logical gap** in the charter's design. They are correct that *logically*, the system is inconsistent. However, *legally* and *pragmatically*, the second admin is correct: without a presumption against retroactivity, the system creates a "black hole" where no change is ever possible.
