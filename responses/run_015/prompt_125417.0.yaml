  # Seminar Handout: Causal Explanatory Frameworks
  **Instructions:** Follow the diagnostic questions below based on your intuitions about the three problem cases (Symmetric Overdetermination, Preemption, Feedback Loops). Your path determines which explanatory theory aligns with your commitments. Unoccupied leaves indicate combinations generally regarded as incoherent or currently unexplored in the literature.

  ---

  ### 1. Metaphysical Grounding
  **When evaluating whether $C$ caused $E$, must we compare the actual world to a nearby possible world where $C$ did not occur?**
  *   **YES** $\rightarrow$ Go to Question 2A.
  *   **NO** $\rightarrow$ Go to Question 2B.

  ---

  ### 2A. (If YES to Q1) Temporal Structure
  **Does your account of possible worlds assume a strictly linear temporal order that forbids an event from being its own ancestor?**
  *   **YES** $\rightarrow$ Go to Question 3A.
  *   **NO** $\rightarrow$ **UNOCCUPIED LEAF**
      *   *Diagnosis:* Incoherent; combining modal realism with non-linear time creates undefined similarity metrics for counterfactuals.

  ### 3A. (If YES to Q2A) Agency Requirement
  **Must a cause be physically alterable by an external agent to count as a cause, even if no agent exists?**
  *   **YES** $\rightarrow$ **UNOCCUPIED LEAF**
      *   *Diagnosis:* Incoherent; requiring both possible worlds and physical agency conflates metaphysical dependence with manipulability.
  *   **NO** $\rightarrow$ Go to Question 4A.

  ### 4A. (If NO to Q3A) Redundancy Status
  **If a variable is mathematically redundant for the outcome in a specific instance, is it causally inert in reality?**
  *   **YES** $\rightarrow$ **LEAF: Lewisian Counterfactual Account**
      *   *Handles Preemption by treating the preempted backup as inert in the actual world.*
  *   **NO** $\rightarrow$ **UNOCCUPIED LEAF**
      *   *Diagnosis:* Unexplored; a modal view that grants causal status to counterfactually redundant variables lacks a mechanism for distinction.

  ---

  ### 2B. (If NO to Q1) Structural Constraints
  **Must the formal model of the causal system be acyclic (prohibiting a variable from causing itself, directly or indirectly)?**
  *   **YES** $\rightarrow$ Go to Question 3B.
  *   **NO** $\rightarrow$ Go to Question 3C.

  ### 3B. (If YES to Q2B) Manipulability
  **Must a cause be capable of being changed by an external intervention to count as a cause?**
  *   **YES** $\rightarrow$ Go to Question 4B.
  *   **NO** $\rightarrow$ Go to Question 4C.

  ### 3C. (If NO to Q2B) Manipulability
  **Must a cause be capable of being changed by an external intervention to count as a cause?**
  *   **YES** $\rightarrow$ **UNOCCUPIED LEAF**
      *   *Diagnosis:* Unexplored; defining interventions on non-acyclic systems without equilibrium assumptions is mathematically undefined.
  *   **NO** $\rightarrow$ Go to Question 4D.

  ### 4B. (If YES to Q3B) Redundancy Status
  **If a variable is mathematically redundant for the outcome in a specific instance, is it causally inert in reality?**
  *   **YES** $\rightarrow$ **UNOCCUPIED LEAF**
      *   *Diagnosis:* Incoherent; interventionism requires independent pathways to count as causes, contradicting inertness.
  *   **NO** $\rightarrow$ **LEAF: Woodward's Interventionist Account**
      *   *Handles Overdetermination by requiring independent manipulable pathways for each cause.*

  ### 4C. (If NO to Q3B) Redundancy Status
  **If a variable is mathematically redundant for the outcome in a specific instance, is it causally inert in reality?**
  *   **YES** $\rightarrow$ **UNOCCUPIED LEAF**
      *   *Diagnosis:* Incoherent; structural equations define causality via the model, so structural presence implies causal potential.
  *   **NO** $\rightarrow$ **LEAF: Pearl's Structural-Model Approach**
      *   *Handles Preemption via distinct structural equations, assuming recursive (acyclic) systems.*

  ### 4D. (If NO to Q3C) Redundancy Status
  **If a variable is mathematically redundant for the outcome in a specific instance, is it causally inert in reality?**
  *   **YES** $\rightarrow$ **UNOCCUPIED LEAF**
      *   *Diagnosis:* Unexplored; accepting cycles but denying causal status to structurally present variables undermines the model's utility.
  *   **NO** $\rightarrow$ **LEAF: Hybrid View (Structural Equations + Anti-Modal Realism)**
      *   *Handles Feedback Loops by accepting non-acyclic equations while rejecting possible-worlds metaphysics.*

  ---

  ### Case Study Key for Students
  *   **Symmetric Overdetermination:** Two bullets hit simultaneously; both are causes. (Tests Redundancy Commitment).
  *   **Preemption:** Assassin A shoots; Assassin B would have but didn't. Only A is the cause. (Tests Modal vs. Structural distinction).
  *   **Feedback Loops:** Variable $X$ affects $Y$, and $Y$ affects $X$ simultaneously. (Tests Acyclicity Commitment).
