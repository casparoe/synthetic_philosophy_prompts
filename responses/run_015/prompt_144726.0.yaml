  2.  **Deconstruct Strawson's "Freedom and Resentment":**
      *   Core idea: Moral responsibility is grounded in our natural human participation in "reactive attitudes" (resentment, gratitude, indignation, etc.).
      *   Excusing conditions: The agent did it, but there's a specific reason (accident, coercion) that negates the ill will *in this instance*. We still see them as a participant.
      *   Exempting conditions: The agent is fundamentally not a participant (psychopath, child, brainwashed). We view them objectively, not participatorily.
      *   The "Objective Attitude": Seeing someone as an object to be managed/cured/trained rather than a person to be reasoned with/resented. This brings detachment but loses the kind of relationships that make life meaningful (friendship, love, etc.).
