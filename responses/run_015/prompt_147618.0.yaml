answer: |-
  **Workshop Proposal: Rot as Structure**
  **Subtitle:** Braudel, Humidity, and the Archive
  **Duration:** 3 Days

  **The Core Question**
  We're using Braudel's three time-scales (geographic time, social time, individual time) to ask a specific philosophical question: When paper archives decay in tropical humidity—mold blooms, insect damage, flood loss—is this part of the 'geographic' layer that conditions history, or is it just 'event-level' noise? Basically, does preservation failure count as a structural feature that shapes which voices survive, or is it just bad luck happening to specific documents?

  **Why Braudel Leaves This Open**
  Braudel treats climate and geography as the slow, almost immobile background against which history plays out. But he assumes the records themselves survive to tell us about that background. He treats climate as a constraint on *action*, but he never asks if information-loss due to climate is a structural condition of *knowledge*. He leaves open the possibility that the "silence" of the archive isn't just a lack of data, but a positive force produced by the environment itself. We're pushing his framework to see if the rot is part of the structure, not just an accident happening within it.

  **The Approach**
  We aren't doing original archival work—we don't have time and thats not the point. Instead, we'll compare two regions conceptually (e.g., Southeast Asia vs. Mediterranean) using existing conservation literature as our data set. We're treating conservation reports as historical sources. By looking at the patterns of decay described in these reports, we can map whether the damage is random (event) or systematic (structure).

  **What Settles It**
  The goal isn't to save the papers. The result we're aiming for is a criterion for when decay becomes structure. We want to produce a rule-of-thumb: under what conditions does environmental damage stop being an 'accident' and start being a 'historical actor' that filters the record? If we can define that threshold, we can stop treating missing archives as gaps and start treating them as shaped outcomes.

  **Scope Check & Reality Test**
  This is doable in three days because we are strictly limiting ourselves to theory and secondary data. We are thinking about the papers, not touching them. The project would collapse immediately if we tried to actually digitize anything or assess specific collections on the ground. Digitization introduces budget creep, technical debt, and ethical quagmires regarding ownership. By staying at the conceptual level, we can actually finish the workshop with a usable framework instead of a half-scanned hard drive and a bunch of unanswered questions.

  **Deliverable**
  A draft framework paper + a workshop report outlining the "Decay as Structure" criterion.
