prompt: |-
  I am writing a short critical note on imprecise probabilities, and I need a worked example to carry one step of the argument. The step is this: a set-of-priors representation cannot be combined, for free, with the obvious sequential decision procedure of conditioning every prior in the set and then maximizing minimum expected utility. I want a case that does real dialectical work, not one an opponent can wave away as a gerrymandered credal set. Please build it to the following specifications.

  The shape of the case. One agent, one hypothesis H with two values, one experiment the agent is about to perform with two or three possible outcomes, and a decision whose payoffs depend only on H. Performing the experiment must be free, and its result must not itself affect anyone's payoff, so that whatever happens is purely informational. Keep the space small enough that I can check every computation by hand: two values of H, two or three outcomes. The setting should be ordinary, the sort of thing that comes up in a clinic, a workshop, a field trial, or a shipment from a supplier: no demons, no perfect predictors, no infinite sequences, no null-event or measure-zero trickery, and stakes an ordinary person could actually face. The experiment should also be the sort of thing any of us would unhesitatingly describe as evidence about H.

  Specifications the scenario has to meet.

  1. The imprecision has to be earned, not stipulated. Do not hand me a credal set. Describe what the agent knows: how the setup was produced, what the evidence is, what it leaves open. The set of probability functions compatible with that description is then the credal set. In particular, the agent's uncertainty should concern the evidential bearing of the experiment on H and not merely the base rate of H. Tell a story in which the agent has good reason to be unsure which way the evidence points.

  2. The prior interval for H must be narrow, at most 0.1 wide, and narrow for a reason that is visible in the story. A point prior is permitted, and if you can get one, so much the better.

  3. Genuine and robust dilation. After conditioning on the result, whichever result it is, the posterior interval for H must be strictly wider than the prior interval at both ends, by at least 0.2 at each end. A prior interval of 0.45 to 0.55 would have to widen to 0.25 to 0.75 or wider, and to something at least as wide under every possible outcome of the experiment. The agent must not be able to hope that the experiment comes out the helpful way.

  4. The dilation must survive replacing the credal set by its convex hull. Show this explicitly, so that the effect cannot be dismissed as an artifact of a non-convex set.

  5. Decision relevance, in the direction that is hard to get. Give the agent a small menu of acts: a bet on H, a bet against H, and a safe act with a certain modest payoff will do. It must be the case that before the experiment the maximin act is strictly better than the safe act, while after the experiment, under every possible outcome, maximin strictly prefers the safe act. So the agent would pay a positive sum to be forced to choose before seeing the result, and would pay a positive sum not to be told the result at all. The contrast I want alongside it: for every probability function in the credal set, the corresponding sharp Bayesian strictly prefers to look before choosing. Give me both sets of numbers.

  The analysis I want attached to the scenario.

  First, the computation: the prior interval, the conditional interval for each outcome, and the maximin values before and after, with enough of the arithmetic shown that I can audit it. Include an explicit check that no single probability function in the credal set reproduces the dilation, so that the effect is irreducibly a feature of the set.

  Second, the diagnosis. Tell me which feature of the case is doing the work, and state it at the level of structure rather than at the level of the example: what the priors in the set must disagree about, and what they must agree about, for the effect to arise. Then remove it. Change one thing in the story so that the priors no longer disagree in that way, and show that both the dilation and the decision anomaly disappear.

  Third, the honest note on the response. My expectation is that a defender of imprecise probabilities will surrender the decision rule rather than the representation, and will say that the defect lies in maximizing minimum expected utility after conditioning rather than in the set of priors. Say what that response costs, whether an alternative rule actually dissolves the case, and where the argument then stands. Consider specifically maximality in the sense of admissibility with respect to the set, and the policy of choosing a full plan ex ante and then updating without re-optimizing; if one of these avoids the problem, say which and at what price. If you think the right response instead is to reject the credal set that your own story generates, say that and defend it.

  Last, two short items. Say whether the case can be turned into a sure-loss sequence of trades against the agent, and if it can, sketch the sequence; if it cannot, say what blocks it. And tell me which of the specifications above was hardest to satisfy jointly with the others and what you had to trade off to meet it, since that is where I expect the real cost of the example to be hiding.
reasoning: |-
  Here's a thinking process that leads to the suggested example and analysis:

  1.  **Deconstruct the Request:**

      *   **Goal:** A worked example for a critical note on imprecise probabilities (IP).
      *   **Core Argument:** Set-of-priors + Conditioning + Maximize Minimum Expected Utility (MEU) leads to a specific pathology (dilation leading to decision paralysis/reversal).
      *   **Constraints:**
          1.  *Earned Imprecision:* Story-driven uncertainty about the *likelihoods* (evidential bearing), not just base rates.
          2.  *Narrow Prior:* Interval width $\le 0.1$ (ideally a point prior).
          3.  *Robust Dilation:* Posterior interval strictly wider than prior by $\ge 0.2$ on *both* ends, for *all* outcomes.
          4.  *Convexity:* Must hold for the convex hull of the credal set.
          5.  *Decision Reversal:* Pre-experiment MEU > Safe Act. Post-experiment MEU < Safe Act (for all outcomes). Sharp Bayesians always prefer to look.
      *   **Analysis Requirements:**
          1.  *Computation:* Show the math (priors, likelihoods, posteriors, utilities). Prove no single prior dilates.
          2.  *Diagnosis:* Structural explanation (disagreement on likelihoods vs. agreement on priors). Show a modification that fixes it.
          3.  *Response:* Address the IP defender's likely retreat (change decision rule to Maximality or Ex Ante Commitment). Evaluate costs.
          4.  *Extras:* Sure-loss sequence possibility? Hardest specification to meet?

  2.  **Drafting the Scenario (The "Story"):**

      *   *Context:* Needs to be ordinary. A clinic or workshop. Let's go with a medical diagnostic setting.
      *   *Hypothesis ($H$):* Patient has a specific condition (e.g., a specific bacterial infection). $H \in \{h, \neg h\}$.
      *   *Prior:* Needs to be narrow. Let's make it a point prior based on strong epidemiological data. $P(h) = 0.5$. (Width 0).
      *   *Experiment ($E$):* A rapid test. Outcomes $e_+$ (positive), $e_-$ (negative).
      *   *Imprecision Source:* The test kit comes from a new supplier. We know the *average* performance, but not the specific sensitivity/specificity of *this batch*. This creates uncertainty about $P(e|h)$ and $P(e|\neg h)$.
      *   *Constraint Check:* The prompt asks for uncertainty about the *evidential bearing*. This fits perfectly. We know the base rate (narrow prior), but we don't know how reliable the test is (imprecise likelihoods).

  3.  **Constructing the Numbers (The "Math"):**

      *   *Prior:* $P(h) = 0.5$. Interval $[0.5, 0.5]$.
      *   *Likelihoods:* We need a set of probability functions $\mathcal{P}$. Each $P \in \mathcal{P}$ shares the prior $P(h)=0.5$ but differs on likelihoods.
      *   *Dilation Requirement:* Posterior $P(h|e)$ must be wider than $[0.5, 0.5]$ by at least 0.2 on each side. So, for both $e_+$ and $e_-$, the posterior interval must be contained in (or equal to) $[0.3, 0.7]$? No, wait.
          *   Prior: $[0.5, 0.5]$.
          *   Posterior Lower Bound $\le 0.3$.
          *   Posterior Upper Bound $\ge 0.7$.
          *   This means for *every* outcome, the lower bound drops by 0.2 and the upper bound rises by 0.2.
      *   *Bayes Rule:* $P(h|e) = \frac{P(e|h)P(h)}{P(e|h)P(h) + P(e|\neg h)P(\neg h)}$.
      *   Since $P(h) = P(\neg h) = 0.5$, this simplifies to $P(h|e) = \frac{P(e|h)}{P(e|h) + P(e|\neg h)}$.
      *   Let $x = P(e_+|h)$ (Sensitivity) and $y = P(e_+|\neg h)$ (False Positive Rate).
      *   Then $P(h|e_+) = \frac{x}{x+y}$.
      *   And $P(h|e_-) = \frac{1-x}{(1-x) + (1-y)}$.
      *   To get dilation on $e_+$: We need the range of $\frac{x}{x+y}$ to cover $[0.3, 0.7]$.
      *   To get dilation on $e_-$: We need the range of $\frac{1-x}{2-x-y}$ to cover $[0.3, 0.7]$.
      *   *Constraint:* The set must be convex.
      *   *Strategy:* Let the likelihoods vary such that the test could be very good (high $x$, low $y$) or misleading (low $x$, high $y$) or even inverted.
      *   Let's try to make the likelihood ratio $\frac{x}{y}$ range from something like $3/7$ to $7/3$.
          *   If $x/y = 7/3 \implies P(h|e_+) = \frac{7}{10} = 0.7$.
          *   If $x/y = 3/7 \implies P(h|e_+) = \frac{3}{10} = 0.3$.
      *   So we need pairs $(x,y)$ such that $x/y$ spans $[3/7, 7/3]$.
      *   Simultaneously, for $e_-$, the likelihood ratio is $\frac{1-x}{1-y}$.
          *   If $x=0.7, y=0.3$ (Good test), then $\frac{0.3}{0.7} = 3/7 \implies P(h|e_-) = 0.3$.
          *   If $x=0.3, y=0.7$ (Bad/Inverted test), then $\frac{0.7}{0.3} = 7/3 \implies P(h|e_-) = 0.7$.
      *   So, if we allow the test to be either "accurate" ($x=0.7, y=0.3$) or "inverted" ($x=0.3, y=0.7$), and everything in between (convex hull), we get the dilation.
      *   *Credal Set:* $\mathcal{P} = \{ P_\theta : \theta \in [0,1] \}$ where $P_\theta(h)=0.5$, $P_\theta(e_+|h) = 0.3 + 0.4\theta$, $P_\theta(e_+|\neg h) = 0.7 - 0.4\theta$.
          *   At $\theta=1$: $x=0.7, y=0.3$. $P(h|e_+) = 0.7$. $P(h|e_-) = 0.3$.
          *   At $\theta=0$: $x=0.3, y=0.7$. $P(h|e_+) = 0.3$. $P(h|e_-) = 0.7$.
          *   At $\theta=0.5$: $x=0.5, y=0.5$. $P(h|e_+) = 0.5$. $P(h|e_-) = 0.5$.
      *   *Posterior Interval:* For $e_+$, range is $[0.3, 0.7]$. For $e_-$, range is $[0.3, 0.7]$.
      *   *Prior Interval:* $[0.5, 0.5]$.
      *   *Dilation Check:* Prior width 0. Posterior width 0.4. Lower bound dropped 0.2, Upper bound rose 0.2. Meets spec.
      *   *Convexity:* The set of likelihood pairs $(x,y)$ lies on the line segment connecting $(0.3, 0.7)$ and $(0.7, 0.3)$. This is convex.

  4.  **Decision Problem:**

      *   *Acts:*
          *   $A_1$: Bet on $H$ (Payoff: 1 if $h$, 0 if $\neg h$).
          *   $A_2$: Bet against $H$ (Payoff: 0 if $h$, 1 if $\neg h$).
          *   $A_{safe}$: Safe act (Payoff: $c$).
      *   *Utilities:* Let's use monetary payoffs.
          *   $U(A_1, h) = 10$, $U(A_1, \neg h) = 0$.
          *   $U(A_2, h) = 0$, $U(A_2, \neg h) = 10$.
          *   $U(A_{safe}, \cdot) = 4$. (Needs to be between the MEU values).
      *   *Pre-Experiment:*
          *   For any $P \in \mathcal{P}$, $P(h)=0.5$.
          *   $EU_P(A_1) = 5$. $EU_P(A_2) = 5$.
          *   Min EU for $A_1$ is 5. Min EU for $A_2$ is 5.
          *   Min EU for $A_{safe}$ is 4.
          *   MEU Choice: $A_1$ or $A_2$ (value 5) > $A_{safe}$ (value 4).
          *   Agent chooses to bet.
      *   *Post-Experiment (using MEU):*
          *   Suppose outcome $e_+$. Posterior interval for $P(h)$ is $[0.3, 0.7]$.
          *   $EU(A_1) \in [3, 7]$. Min EU = 3.
          *   $EU(A_2) \in [3, 7]$. Min EU = 3.
          *   $EU(A_{safe}) = 4$.
          *   MEU Choice: $A_{safe}$ (4) > $A_1, A_2$ (3).
          *   Same for $e_-$.
      *   *Result:* Before looking, you bet. After looking, you take the safe option. You would pay to *avoid* information.
      *   *Sharp Bayesian Check:* For any fixed $\theta \neq 0.5$, the posterior is either 0.3 or 0.7.
          *   If posterior is 0.7, $EU(A_1) = 7 > 4$.
          *   If posterior is 0.3, $EU(A_2) = 7 > 4$.
          *   If posterior is 0.5, $EU(A_1) = 5 > 4$.
          *   So every sharp Bayesian prefers to look (Value of Information > 0).

  5.  **Refining the Story (Earned Imprecision):**

      *   Why would the likelihoods vary like that?
      *   Story: A batch of diagnostic strips. The manufacturer guarantees the *average* sensitivity/specificity is balanced, but due to a calibration drift in the production line, some strips are highly sensitive/low specificity, others are low sensitivity/high specificity, and we don't know where *this* strip falls, only that it lies on the trade-off curve.
      *   Actually, a better story for the specific correlation ($x+y=1$): The test relies on a threshold setting that was lost. We know the biomarker distribution overlaps, but we don't know where the cutoff was set on this specific device. If the cutoff is low, high sensitivity/high false positive. If cutoff is high, low sensitivity/low false positive.
      *   Wait, the math used $x+y=1$ (e.g., $0.7+0.3=1$). This implies $P(e_+|h) + P(e_+|\neg h) = 1$. This means the test provides *no* discrimination on average? No, it means the likelihood ratio is the inverse.
      *   Let's check the constraint: "Uncertainty should concern the evidential bearing... not merely the base rate."
      *   Story adjustment: We have a batch of sensors. We know from the spec sheet that the True Positive Rate (TPR) and False Positive Rate (FPR) sum to 1.0 (a specific property of this technology, e.g., a random threshold generator). But we don't know the specific TPR/FPR split for this unit. It could be (0.7, 0.3) or (0.3, 0.7).
      *   Is this "ordinary"? A bit technical.
      *   Alternative: Two experts. Expert 1 says "Test is good (0.7/0.3)". Expert 2 says "Test is inverted/bad (0.3/0.7)". We trust them equally but don't know who is right about *this* device. We model this as a convex set.
      *   Better: "Calibration Uncertainty." The test measures a continuous variable. $H$ shifts the mean. But the threshold for "Positive" is unknown. If the threshold is low, you catch all $H$ but also many $\neg H$. If high, you miss $H$ but rarely flag $\neg H$.
      *   To get the specific numbers ($0.3/0.7$ and $0.7/0.3$): The distributions overlap significantly. The threshold could be set at the 30th percentile of one and 70th of the other.
      *   Let's stick to the "Unknown Threshold" story. It's standard in decision theory examples (e.g., Seidenfeld/Wasserman).
      *   Prior: Epidemiological data says prevalence is exactly 50% in this specific sub-population. (Narrow prior earned).
      *   Likelihood: The test threshold is unknown.

  6.  **Addressing the Analysis Points:**

      *   *Computation:* Done in draft. Need to write it clearly.
      *   *Diagnosis:* The disagreement is on the *likelihood ratio*. Agreement is on the *prior*. Dilation happens because the set of likelihood ratios includes reciprocals (evidence for and evidence against).
      *   *Modification:* Fix the threshold. If we know the threshold, we know the likelihoods. Dilation vanishes.
      *   *Response:* IP defender says "Don't use MEU (Gamma-Maximin). Use Maximality (E-admissibility) or Ex Ante Commitment."
          *   *Maximality:* An act is admissible if no other act has higher EU for *all* priors.
              *   Pre-exp: $A_1$ (EU=5), $A_2$ (EU=5), $A_{safe}$ (EU=4). $A_1, A_2$ dominate $A_{safe}$. Choice: $\{A_1, A_2\}$.
              *   Post-exp ($e_+$): $P(h) \in [0.3, 0.7]$.
                  *   $EU(A_1) \in [3, 7]$.
                  *   $EU(A_2) \in [3, 7]$.
                  *   $EU(A_{safe}) = 4$.
                  *   Is $A_{safe}$ dominated?
                  *   At $P(h)=0.3$, $EU(A_1)=3 < 4$. $A_1$ does not dominate $A_{safe}$.
                  *   At $P(h)=0.7$, $EU(A_1)=7 > 4$. $A_{safe}$ does not dominate $A_1$.
