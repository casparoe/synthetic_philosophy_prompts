  ### Scenario: The Calibrated Threshold

  **The Setup**
  You are a clinic director managing a screening program for a specific viral infection ($H$). Epidemiological data for your specific demographic is exceptionally robust: exactly 50% of patients presenting with these symptoms carry the virus. Your prior probability for $H$ is therefore a point value: $P(h) = 0.5$.

  You have a batch of rapid diagnostic strips from a new supplier. The manufacturer guarantees the technology is sound but admits to a "calibration drift" in this production run. The test detects a biomarker concentration. A result is "Positive" ($e_+$) if the concentration exceeds a threshold, and "Negative" ($e_-$) otherwise.

  Due to the drift, you do not know where the threshold was set for this batch. You know the biomarker distributions for infected and uninfected patients overlap significantly. Based on the supplier's technical sheet, the True Positive Rate (Sensitivity) and False Positive Rate (1 − Specificity) sum to 1.0 for any given threshold setting on this device.
  *   If the threshold is set low, you catch most infections but flag many healthy patients (High Sensitivity, High False Positive).
  *   If the threshold is set high, you miss infections but rarely flag healthy patients (Low Sensitivity, Low False Positive).

  You have no reason to believe the threshold is more likely to be low than high. You model this by considering every threshold setting between the 30th and 70th percentile of the biomarker distribution as possible.

  **The Credal Set**
  Let $x = P(e_+|h)$ be the sensitivity. The constraint implies $P(e_+|\neg h) = 1 - x$.
  Your uncertainty is captured by the parameter $x \in [0.3, 0.7]$.
  The credal set $\mathcal{P}$ is the convex set of all probability functions satisfying:
  1.  $P(h) = 0.5$
  2.  $P(e_+|h) = x$
  3.  $P(e_+|\neg h) = 1 - x$
  for some $x \in [0.3, 0.7]$.

  **The Decision**
  You must decide whether to isolate the patient (Act $I$) or release them (Act $R$).
  *   **Isolate ($I$):** Costly if patient is healthy, safe if infected. Payoff: 10 if $h$, 0 if $\neg h$. (Equivalent to a bet on $H$).
  *   **Release ($R$):** Safe if healthy, costly if infected. Payoff: 0 if $h$, 10 if $\neg h$. (Equivalent to a bet against $H$).
  *   **Wait ($W$):** Delay decision for a more expensive lab test. Certain payoff: 4.

  The rapid test is free and purely informational.

  ---

  ### Analysis

  #### 1. The Computation

  **Prior Interval**
  Since $P(h) = 0.5$ for all $P \in \mathcal{P}$, the prior interval is $[0.5, 0.5]$. Width = 0.

  **Posterior Intervals**
  By Bayes' Theorem, for any $P \in \mathcal{P}$ defined by $x$:
  $$P(h|e_+) = \frac{P(e_+|h)P(h)}{P(e_+|h)P(h) + P(e_+|\neg h)P(\neg h)} = \frac{0.5x}{0.5x + 0.5(1-x)} = x$$
  $$P(h|e_-) = \frac{P(e_-|h)P(h)}{P(e_-|h)P(h) + P(e_-|\neg h)P(\neg h)} = \frac{0.5(1-x)}{0.5(1-x) + 0.5(1-(1-x))} = 1-x$$

  Since $x \in [0.3, 0.7]$:
  *   If outcome is $e_+$, the posterior interval for $P(h)$ is $[0.3, 0.7]$.
  *   If outcome is $e_-$, the posterior interval for $P(h)$ is $[0.3, 0.7]$ (since $1-x$ also ranges from 0.3 to 0.7).

  **Dilation Check**
  *   Prior: $[0.5, 0.5]$.
  *   Posterior (either outcome): $[0.3, 0.7]$.
  *   The lower bound drops by 0.2. The upper bound rises by 0.2.
  *   **Convexity:** The set of likelihood pairs $(x, 1-x)$ forms a line segment in the unit square, which is convex. The resulting set of posteriors is the interval $[0.3, 0.7]$, which is convex. The dilation is not an artifact of non-convexity.
  *   **Single Prior Check:** For any fixed $x$, the posterior is a point (e.g., if $x=0.7$, posterior is 0.7). No single sharp prior dilates. The effect is irreducibly a feature of the set.

  **Decision Values (Maximin Expected Utility)**
  *   **Pre-Experiment:**
      *   $EU(I) = 10 \times P(h) = 5$.
      *   $EU(R) = 10 \times P(\neg h) = 5$.
      *   $EU(W) = 4$.
      *   Minimum EU for $I$ and $R$ is 5. Minimum EU for $W$ is 4.
      *   **Choice:** Isolate or Release (Value 5). $5 > 4$.

  *   **Post-Experiment (Suppose $e_+$):**
      *   Posterior $P(h) \in [0.3, 0.7]$.
      *   $EU(I) \in [3, 7]$. Minimum = 3.
      *   $EU(R) \in [3, 7]$. Minimum = 3.
      *   $EU(W) = 4$.
      *   **Choice:** Wait (Value 4). $4 > 3$.
      *   (Identical calculation holds for $e_-$).

  **Result:** Before the test, you strictly prefer to act on the hypothesis. After the test, you strictly prefer to delay. You would pay up to 1 unit to avoid seeing the test result.

  **Sharp Bayesian Comparison**
  Consider a sharp Bayesian who knows the specific $x$.
  *   If $x \neq 0.5$, the test is informative. The expected utility of looking is $10 \times \max(x, 1-x)$. Since $x \in [0.3, 0.7]$, $\max(x, 1-x) \ge 0.5$.
  *   For all $x \neq 0.5$, $\max(x, 1-x) > 0.5$, so Expected Utility of Looking > 5. They strictly prefer to look.
  *   (Note: For the single case $x=0.5$, the test is useless, and the Bayesian is indifferent. However, for every *informative* prior in the set, looking is strictly preferred. The IP agent, by contrast, treats the *uncertainty* about $x$ as a reason to avoid looking entirely.)

  #### 2. The Diagnosis

  **Structural Feature**
  The dilation arises because the credal set contains priors that disagree on the **direction of the evidence**.
  *   Some functions in $\mathcal{P}$ treat $e_+$ as evidence *for* $H$ ($x > 0.5$).
  *   Others treat $e_+$ as evidence *against* $H$ ($x < 0.5$).
  *   All functions agree on the **base rate** ($P(h)=0.5$).

  When the base rate is precise but the likelihood ratios straddle 1, conditioning spreads the posterior probability away from the prior in *both* directions, regardless of the outcome. The experiment fails to reduce uncertainty about $H$ because it introduces uncertainty about the reliability of the experiment itself.

  **Removing the Effect**
  Modify the story: Suppose the supplier provides a calibration certificate confirming the threshold is set at the median ($x=0.5$) or higher ($x \in [0.5, 0.7]$).
  *   Now, all $P \in \mathcal{P}$ agree that $e_+$ is evidence for $H$ (or neutral).
  *   Posterior for $e_+$ becomes $[0.5, 0.7]$.
  *   Posterior for $e_-$ becomes $[0.3, 0.5]$.
  *   While there is still some imprecision, the interval shifts rather than dilating around the prior.
  *   **Decision:** Post-experiment Min EU for $I$ (after $e_+$) is 5. Post-experiment Min EU for $R$ (after $e_-$) is 5.
  *   The agent no longer switches to the Safe Act. The decision anomaly disappears.

  #### 3. The Honest Note on the Response

  A defender of imprecise probabilities will likely argue that the defect lies in the decision rule (Maximin/MEU), not the representation.

  **Alternative Rule: Maximality (E-Admissibility)**
  Under Maximality, an act is chosen if no other act has higher expected utility for *all* priors in the set.
  *   **Pre-Experiment:** $I$ and $R$ (EU=5) dominate $W$ (EU=4). Choice: $\{I, R\}$.
  *   **Post-Experiment:**
      *   $EU(I) \in [3, 7]$.
      *   $EU(W) = 4$.
      *   $I$ does not dominate $W$ (since min EU is 3). $W$ does not dominate $I$ (since max EU is 7).
      *   Choice: $\{I, R, W\}$.
  *   **Cost:** This avoids the *forced* switch to the Safe Act, but it creates **indeterminacy**. The agent is permitted to wait, but also permitted to bet. The rule fails to guide action where MEU was decisive (albeit perversely). The agent cannot justify taking the information, but cannot rule it out either.

  **Alternative Policy: Ex Ante Commitment**
  The agent chooses a full plan (Act conditional on $e_+$, Act conditional on $e_-$) before the experiment, evaluating the plan by its minimum expected utility.
  *   Plan (Bet, Bet): Min EU = 3.
  *   Plan (Wait, Wait): Min EU = 4.
  *   **Result:** The optimal ex-ante plan is to ignore the information (Wait regardless of outcome).
  *   **Cost:** This preserves the MEU pathology. It confirms that, under this rule, information has negative value. It saves dynamic consistency at the price of admitting that learning is instrumentally irrational.

  **Rejecting the Credal Set**
  One could argue the set $\mathcal{P}$ is illegitimate because it includes "inverted" tests ($x < 0.5$). However, in contexts of calibration uncertainty, excluding these possibilities requires knowledge the agent explicitly lacks. To reject the set is to demand precision where none exists.

  #### 4. Short Items

  **Sure-Loss Sequence**
  Yes, the agent is vulnerable to a Dutch Book.
  1.  **Pre-Experiment:** Agent buys Act $I$ for 4.9 (Min EU is 5).
  2.  **Experiment:** Result $e_+$ occurs.
  3.  **Post-Experiment:** Agent sells Act $I$ for 3.1 (Min EU is now 3).
  4.  **Net:** Agent loses 1.8 certain, ending with the Safe Act payoff (4) minus the loss.
  The agent agrees to both trades because they maximize minimum expected utility at the time of the trade.

  **Hardest Specification**
  **Specification 3 (Robust Dilation with Narrow Prior)** was the hardest to satisfy.
  *   *Trade-off:* Standard dilation examples usually rely on prior imprecision (e.g., $P(h) \in [0.1, 0.9]$). Achieving dilation with a point prior ($P(h)=0.5$) requires the likelihood ratios to span across 1 (from $<1$ to $>1$).
  *   *Cost:* This forces the "ordinary" story to rely on a specific kind of ignorance (unknown calibration direction) that implies the test might be misleading. While plausible in technical settings (calibration drift), it is harder to motivate in casual contexts than simple base-rate uncertainty. I had to ensure the "earned imprecision" story (threshold drift) was robust enough to prevent the opponent from claiming the set was gerrymandered.
