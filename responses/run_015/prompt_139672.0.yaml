                  *   The prompt asks about "Maximize Minimum Expected Utility". The critique is specific to MEU. The "Honest Note" should acknowledge that changing the rule avoids the *forced* switch to safe, but introduces indeterminacy (inability to choose).
          *   *Ex Ante Commitment:* Choose a plan (Act based on $e_+$, Act based on $e_-$) before seeing data.
