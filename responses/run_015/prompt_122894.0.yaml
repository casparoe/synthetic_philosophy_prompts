answer: |-
  Here is a specification list for a Kuhnian paradigm shift, calibrated for archival work in mid-century biomedicine. I have distinguished between requirements internal to Kuhn's text (Non-Negotiable) and those imposed by historiographical or metaphysical preferences (Preference), and flagged the tensions you asked for.

  ### The Specification List

  **1. Incommensurability of Evaluation Standards**
  *   **Requirement:** The account must show that the criteria for what counts as a "solution," "evidence," or "explanation" changed such that the predecessor and successor cannot be neutrally ranked by a shared metric.
  *   **Case/Consideration:** If Lab A rejects Lab B's model because B's data doesn't meet A's significance thresholds, that is normal science disagreement. If Lab B adopts a new methodology where "significance" is defined by mechanism rather than statistics, and A cannot recognize B's output as data without adopting B's framework, that is a shift.
  *   **Status:** **Non-Negotiable.** (This is the definition of *Structure of Scientific Revolutions* (SSR) Chapter 10).
  *   **Camp:** Anti-Realist / Structuralist.

  **2. Lexical/Ontological Discontinuity (Meaning vs. Belief)**
  *   **Requirement:** The account must distinguish between a change in the *truth-value* assigned to a proposition (belief change) and a change in the *reference or extension* of the terms used (meaning change).
  *   **Case/Consideration:** Your "stress" example. If Selye and a later endocrinologist both say "stress causes ulcers," but Selye's "stress" refers to a non-specific systemic response and the later term refers to specific HPA-axis cortisol pathways, they are not disagreeing about the same fact; they are carving the world differently. A shift requires the taxonomy of natural kinds to change.
  *   **Status:** **Non-Negotiable.** (Crucial in Kuhn's later work, *The Road Since Structure*, but implicit in SSR).
  *   **Camp:** Semanticist / Historical Ontology (Hacking).

  **3. Crisis as Rule-Failure, Not Anomaly-Accumulation**
  *   **Requirement:** The account must demonstrate a loss of confidence in the *rules of normal science*, not merely the accumulation of unsolved puzzles. Anomalies are expected in normal science; crisis occurs when the rules cease to yield *any* solutions to core puzzles.
  *   **Case/Consideration:** This addresses your "many anomalies, no crisis" constraint. If grant files show researchers treating anomalies as "technical problems to be fixed with better controls," it is normal science. If correspondence shows senior figures questioning whether the *approach itself* is capable of solving the problem (e.g., "we are barking up the wrong tree"), that is crisis.
  *   **Status:** **Non-Negotiable.**
  *   **Camp:** Kuhnian Internalist.

  **4. Non-Cumulativity of Achievement**
  *   **Requirement:** The successor account must not simply contain the predecessor as a limiting case or a subset. The field must be reconstituted.
  *   **Case/Consideration:** If the new theory explains the old data *plus* the anomalies, that is Lakatosian progress or Realist accumulation. If the new theory renders the old data "obsolete" or "misdescribed" (e.g., phlogiston data isn't 'almost right,' it's about a non-entity), it is Kuhnian.
  *   **Status:** **Non-Negotiable.**
  *   **Camp:** Anti-Realist.

  **5. Community-Wide Re-Alignment (Granularity)**
  *   **Requirement:** The shift must account for the migration of the relevant professional community, not just the intellectual victory of one idea.
  *   **Case/Consideration:** This targets your granularity constraint. Kuhn defines paradigms by the communities that hold them. A shift in one lab is a factional dispute unless it redefines the training, journals, and hiring of the subfield.
  *   **Status:** **Preference.** (Kuhn implies this, but historians often apply "paradigm" locally. Strictly speaking, a local shift is a "micro-paradigm" at best).
  *   **Camp:** Sociologist of Science.

  **6. Archival Diagnosability (Pre-Outcome Visibility)**
  *   **Requirement:** The markers of crisis and incommensurability must be visible in the documents *before* the winner is known.
  *   **Case/Consideration:** If you can only identify the shift because you know who won, you are doing logical reconstruction, not history. You need referee reports rejecting papers not for error, but for "irrelevance" or "category mistakes."
  *   **Status:** **Preference.** (Methodological necessity for historians, but not a feature of Kuhn's philosophy).
  *   **Camp:** Historian / Contextualist.

  ---

  ### Incompatible Pairs & Tensions

  You asked to flag pairs that may not be jointly satisfiable. These are the friction points where your workshop critics will likely attack.

  **Tension A: Archival Diagnosability vs. Incommensurability**
  *   **The Conflict:** If two paradigms are truly incommensurable (Req 1 & 2), the actors cannot fully understand each other. How, then, can the historian (Req 6) diagnose the shift using the actors' own documents? To diagnose the shift, you must translate between the frameworks, which implies a neutral language exists that Kuhn denies.
  *   **Workshop Risk:** Critics will argue that if you can describe the shift clearly in your dissertation, you have proven incommensurability false.
  *   **Mitigation:** Rely on Kuhn's later "local incommensurability." They can translate most terms, but not the specific lexical taxonomy governing the shift.

  **Tension B: Granularity (Local) vs. Community Re-Alignment**
  *   **The Conflict:** You want to apply this to one lab or subfield (Req 5). But Kuhnian shifts are defined by the dissolution of the *entire* prior community's consensus. A shift in one lab is often just a research programme change (Lakatos) unless it forces the *rival* labs to retrain.
  *   **Workshop Risk:** Calling a local methodological change a "paradigm shift" inflates the term.
  *   **Mitigation:** Frame the lab/subfield as the "exemplar" that drove the wider disciplinary realignment, rather than the shift being contained *within* the lab.

  **Tension C: Meaning Change vs. Historical Continuity**
  *   **The Conflict:** If "immune" changes meaning entirely (Req 2), how do you trace the historical narrative of immunology? If the referent changes, is it the same history?
  *   **Workshop Risk:** Historians need continuity to write a narrative; Kuhn demands discontinuity to define a revolution.
  *   **Mitigation:** Distinguish between the *label* (continuous in archives) and the *kind* (discontinuous in ontology).

  ---

  ### Test Cases Against the Spec

  **Case 1: The Replication Crisis in Psychology**
  *   **Verdict:** **Normal Science Repair (Not a Paradigm Shift).**
  *   **Analysis:**
      *   *Anomalies:* High. (Req 3 met on surface).
      *   *Crisis:* Debatable. While there is hand-wringing, the *standards* (p < 0.05, null hypothesis testing) are being reinforced, not replaced. The call is for *better* adherence to rules (preregistration, power analysis), not new rules.
      *   *Incommensurability:* Low. A replication failure is understood by both sides using the same statistical language.
      *   *Meaning Change:* None. "Effect size" means the same thing.
      *   *Diagnosis:* Referee reports demand more controls, not a new ontology of mind.
      *   *Conclusion:* This is Lakatosian protective belt adjustment. The "hard core" (behavior is measurable via stats) is intact.

  **Case 2: Psychiatric Nosology (DSM Syndromes → RDoC/Dimensional)**
  *   **Verdict:** **Candidate Paradigm Shift (Currently in Crisis Phase).**
  *   **Analysis:**
      *   *Anomalies:* High. (Comorbidity, drug failure, lack of biomarkers).
      *   *Crisis:* Evident. NIMH explicitly stated DSM reliability is not validity. Grant files show rejection of pure symptom-cluster proposals in favor of mechanism.
      *   *Incommensurability:* High. A "depression" case in DSM (symptom count) may not map to an RDoC "depression" case (circuit dysfunction). They are different populations.
      *   *Meaning Change:* High. "Disorder" shifts from "harmful dysfunction defined by distress" to "system breakdown defined by mechanism."
      *   *Granularity:* Disciplinary (Psychiatry + Neuroscience).
      *   *Diagnosis:* Visible in NIMH strategic plans and grant rejection letters citing "lack of biological plausibility" for previously accepted clinical categories.
      *   *Conclusion:* This fits the spec better, *but* it fails the "Community Re-Alignment" test so far because the DSM remains the clinical standard. It is a shift in *research* paradigm that has not yet conquered the *practice* paradigm. This distinction (Research vs. Practice Paradigms) is a vital nuance for biomedicine.

  ### Summary for your Defense
  When you write the section, anchor your definition on **Req 1 (Standards)** and **Req 3 (Rule-Failure)**. These are the strongest Kuhnian markers. Be careful with **Req 5 (Granularity)**; acknowledge that biomedicine is fragmented and that "paradigm" might operate at the level of a *technique* (e.g., the shift to RIA or PCR) rather than a whole theory, provided that technique brings its own standards and ontology with it. This allows you to keep the "local" focus without violating the "community" requirement.
