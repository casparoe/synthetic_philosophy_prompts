prompt: |-
  Hi — I'm an HPS PhD student working on mid-century biomedicine, and I keep using "paradigm shift" loosly and then getting called on it in workshops. Before I write the bit where I score Kuhn, Lakatos and Feyerabend against each other, I want the spec. What would an account of theory change have to deliver to count as capturing what's distinctive about a Kuhnian paradigm shift, as opposed to just "a big change" or "normal science meeting a stubborn anomaly"? Give me the requirement list with the case or consideration behind each. The ones I already think belong on it: it has to say how a successor gets compared to its predecessor when the standards of comparison are among the things that changed; it has to distinguish real meaning change from mere belief change (my archives are full of terms like "stress" and "immune" that keep their spelling and quietly lose their sense); it has to handle granularity, since my cases sit at the level of one lab or one subfield, not a whole discipline; and it has to be diagnosable from evidence a working historian actually has — grant files, correspondence, referee reports — not only in hindsight, once we know who won. I also want the "many anomalies, no crisis" case faced head on, since anomaly accumulation alone plainly isn't enough. Mark which requirements are non-negotiable and which are just preferences of one camp — realists wanting cumulative progress, sociologists wanting the social to do the explanatory work, historians wanting local continuity — and flag any pair you suspect can't be jointly satisfied, because that's the part I actually want out of this. Two cases to run against the list as you go: does the replication crisis in psychology count as a crisis in Kuhn's sense or as normal science repairing itself, and is the shift from syndrome-style psychiatric categories toward dimensional, mechanism-first nosology a paradigm shift or a puzzle solution inside one? Keep it on the criteria, skip the scorecard, I'll do that myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** HPS (History and Philosophy of Science) PhD student. Specialization: Mid-century biomedicine.
      *   **Problem:** Using "paradigm shift" too loosely; getting criticized in workshops.
      *   **Task:** Provide a specification (requirement list) for what counts as a *Kuhnian* paradigm shift vs. just "big change" or "normal science + anomaly."
      *   **Constraints:**
          *   Must include specific requirements with cases/considerations behind them.
          *   Must include the user's pre-existing ideas (incommensurability/standards, meaning change vs. belief change, granularity/locality, historical diagnosability).
          *   Must address "many anomalies, no crisis."
          *   Must tag requirements as Non-Negotiable (Kuhn-essential) vs. Preference (Realist/Sociologist/Historian).
          *   Must flag incompatible pairs (tensions).
          *   Must apply the criteria to two test cases: Psychology Replication Crisis & Psychiatric Nosology (RDoC/Dimensional).
          *   **Do not** score Kuhn vs. Lakatos vs. Feyerabend (user will do that).
          *   **Tone:** Academic, precise, peer-to-peer, avoiding introductory fluff.

  2.  **Deconstruct "Kuhnian Paradigm Shift" (The *Structure of Scientific Revolutions* core):**
      *   What makes it *Kuhnian* and not just Popperian falsification or Lakatosian research programme shift?
      *   *Key features:* Incommensurability, Gestalt switch, Crisis (not just anomaly), Change in standards/worldview, Not cumulative.
      *   *User's specific constraints:* Needs to work for *history* (evidence-based), needs to handle *locality* (Kuhn often talked about disciplines, user works on labs/subfields), needs to handle *semantics* (meaning change).

  3.  **Drafting the Requirement List:**
      *   *Req 1: Incommensurability of Standards.* (User mentioned this). If the criteria for "good science" change, you can't just say one is better using the old rules.
      *   *Req 2: Semantic/Ontological Discontinuity.* (User mentioned this). Terms change reference, not just extension. "Mass" in Newton vs. Einstein. "Stress" in Selye vs. later.
      *   *Req 3: Crisis Condition.* Anomalies aren't enough. There must be a loss of confidence in the rules of normal science.
      *   *Req 4: Non-Cumulativity.* The new paradigm doesn't just add to the old; it reconstitutes the field.
      *   *Req 5: Granularity/Scope.* Kuhn implies a community-wide shift. User needs it for subfields. This is a tension point.
      *   *Req 6: Historical Diagnosability.* Must be visible in archives, not just logical reconstruction.

  4.  **Categorizing Requirements (Non-Negotiable vs. Preference):**
      *   *Non-Negotiable (Kuhn's text):* Incommensurability, Crisis (not just anomaly), Non-cumulativity.
      *   *Preference/Interpretive:* Granularity (Kuhn was vague here, historians want it local), Diagnosability (Methodological preference), Realism vs. Social (Kuhn is often read as anti-realist/social, but he resisted that).

  5.  **Identifying Tensions/Incompatible Pairs:**
      *   *Local Granularity vs. Community Consensus:* A paradigm shift implies a whole community switches. If it's just one lab, is it a shift or a factional fight?
      *   *Historical Diagnosability vs. Incommensurability:* If they are truly incommensurable, how can the historian (standing outside) diagnose it using evidence produced *within* the frameworks?
      *   *Meaning Change vs. Continuity of Evidence:* If terms change meaning, how do we track the "same" anomaly across the shift?

  6.  **Applying to Test Cases:**
      *   *Case 1: Psychology Replication Crisis.*
