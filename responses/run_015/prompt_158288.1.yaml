answer: |-
  Run Lola Run is not a straightforward illustration of chaos theory but a dialectic between contingency and agency, making it a highly usable teaching text provided you frame the third run not as another butterfly effect but as a deliberate overcoming of random chance.

  Your three distinctions hold up well against the film, though they function differently across the three runs. Distinction (ii), Knife-edge versus Buffered, is the film's primary engine; the narrative universe is constructed as exclusively knife-edge, where no shock decays and every micro-interaction cascades. In the first run, Lola trips over a dog on the staircase, losing seconds that ultimately lead to her death and Manni's robbery; in the second, she clears the stairs but collides with a man on a bicycle, delaying her just enough to arrive at the bank as Manni is shot. The system possesses no buffering capacity; there is no slack time or structural resilience to absorb the delay. This makes the film a pure model of sensitive dependence, but historically unrealistic, as real social systems often buffer small shocks.

  Distinction (i), Ampliative versus Switching, is where the film complicates the trope. In the main plot, the outcomes look like Switching: the menu of possibilities (Lola dies, Manni dies, or they succeed) seems pre-existing, and the micro-events merely select the path. However, the flash-forward sequences argue for Ampliative outcomes. When Lola brushes past the stranger with the pram, his entire life trajectory diverges based on that contact; he becomes either a wealthy family man or a destitute homeless person. Here, the small event does not just select a winner; it creates a new menu of outcomes that did not exist previously. Distinction (iii), Token versus Structural, is blurred intentionally. While Lola's survival is token-level, the avoidance of the bank robbery in the third run alters the structural reality of the city's crime statistics and the bank's security protocols. The film suggests that token-level contingencies, when distributed across enough actors, accumulate into structural change.

  For the screening, I recommend pausing on three specific moments. First, stop immediately after Lola encounters the dog on the stairs in Run One and again when she narrowly avoids it in Run Two. Ask the class to identify the bifurcation point: is the staircase a knife-edge where seconds determine life or death, or should the surrounding system (the ambulance, the bank opening times) have buffered this delay? This tests distinction (ii). Second, screen the split-screen flash-forward sequence of the stranger with the pram. Pause after showing his two divergent futures. This is the crucial moment for discussing distributed contingency. It moves the "nail" from the protagonist to the background extras, arguing that history is not made solely by great agents but by the sum of random collisions between ordinary bodies. It visualizes the claim that contingency is a network property, not a focal point. Third, show the casino scene in Run Three. Lola does not rely on chance; she screams at the roulette wheel, seemingly willing the numbers, but more importantly, she acts with knowledge from previous iterations. This scene tests the limits of the chaos model.

  The flash-forwards are indeed the film's strongest theoretical claim, yet they are often overlooked in favor of the main plot. They argue that contingency is distributed across persons rather than concentrated in the nail. In historical terms, this challenges the "Great Man" theory of contingency. It suggests that the "nail" is not a single object but a web of interactions. If Lola had not bumped the man, his token life changes, but does that change history structurally? The film implies yes, by showing the ripple effect of his wealth or poverty on others. This supports the idea that structural history is the aggregate of token contingencies. However, it also risks overstating the case; in reality, systems often revert to the mean despite individual fate changes.

  Regarding the "anti-chaos" critique: you are correct that the third run undermines the pure chaos reading. Lola carries memory and skill across the resets; she knows where the gun is, she knows to skip the stairs, and she knows how to manipulate the casino. This transforms the narrative from a story of sensitive dependence on initial conditions to a story of optimization through iteration. If history allows for "replays" where agents learn, then contingency is progressively defeated by agency. This makes the film usable, but only if you clarify that the "chaos" model applies to Runs One and Two, while Run Three introduces a teleological element where the agent converges on a preferred outcome. It is not misleading to present it as a text for the trope, provided you ask students to identify where the film shifts from describing how history happens to prescribing how it might be controlled. The film becomes a debate between determinism (the clock, the animation sequences) and free will (Lola's scream, her running).

  Your distinctions do not collapse, but (i) and (ii) are causally linked in a way that requires clarification. A system must be Knife-edge (ii) to allow for Ampliative effects (i); if the system is Buffered, small causes cannot open new trajectories, only select among existing ones. Therefore, (ii) is the condition for (i). Distinction (iii) remains independent, as a system can be knife-edge but only affect token outcomes (e.g., who dies in a battle) without changing the structural outcome (the war continues). The film attempts to show token changes rippling into structural ones, but this is the most fantastical element of the narrative.

  What the film adds to the debate that argumentation cannot is the visceral experience of the counterfactual. Reading about contingency is abstract; seeing Lola breathe heavily, seeing the clock tick, and witnessing the immediate physical consequence of a three-second delay creates an emotional investment in the "what if." It allows students to feel the weight of the nail. Furthermore, the film visualizes branching history simultaneously. In text, we describe branches sequentially; the film's split-screen and rapid-cut editing allow the viewer to hold multiple possible histories in mind at once, reinforcing the idea that the actual past was not inevitable but merely one realized path among many. This phenomenological approach complements the analytical distinctions by grounding them in the experience of time and choice.
