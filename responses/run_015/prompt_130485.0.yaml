  Connect this to the clinic. The board member wants pictures to replace translation. You now know pictures need translation too—just a different kind. They need a legend, or a prior explanation. If you print the Round 4 winner, you must tell the patient what it means *before* they leave. The picture locks the memory; it does not create the knowledge. This distinction is vital for safety. If they leave thinking the picture explained itself, you have replicated the problem you are trying to solve.

  What will go wrong
  *   **The Homogeneity Trap:** All your volunteers speak English and share a culture. The symbols will work too well. Counter this by reminding them constantly: "Imagine you are 70, speak Urdu, and have never seen this clinic before."
  *   **The Dominant Designer:** One volunteer takes over the marker. Ensure everyone draws individually, then select the best, or assign specific roles.
  *   **Convention Smuggling:** Designers will draw a red circle and claim it isn't a 'prohibition' sign. Call this out immediately during scoring.
  *   **Reader Bias:** Readers might try to help the Designers win by guessing what they *wanted* to say. Insist on literal interpretation.
  *   **Time Creep:** Round 4 (Meta) will stall. Be ready to cut it short to ensure time for the debrief.
  *   **Defensiveness:** If a design fails, Designers may blame the Readers. Keep the focus on the medium's limits, not individual skill.
  *   **False Success:** If Round 1 goes too well, volunteers might assume the rest will follow. Emphasize that Round 1 was chosen specifically because it is the *only* thing pictures do well (concrete objects).

  What the game can't do
  This game simulates the failure, but it cannot simulate the success of the full system. You cannot game-play the trust relationship between a nurse and a patient. You will have to say out loud that the card is not the message; the card is a memory aid for a message delivered verbally. The game proves pictures aren't enough; you must state that words + pictures + human contact are the actual protocol. No amount of paper will teach them that the card is secondary to the conversation. You have to speak that part.
  You also cannot simulate the stress of illness. A patient in pain decodes symbols differently than a volunteer in a church hall. Acknowledge this gap. The game is a proxy, not a trial. Use it to build humility, not certainty.
