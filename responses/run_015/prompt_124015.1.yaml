answer: |-
  Here is a specification sheet for a rigorous relational conception of personhood. This is designed to move beyond the slogan "I am because we are" into a functional metaphysical and ethical framework capable of handling edge cases.

  ### I. Metaphysical Desiderata (The Ontology of the Self)

  **1. The Distinction Between *Constitutive* and *Sustaining* Relations**
  *   **The Requirement:** The theory must distinguish between relations that *create* the person (constitutive) and relations that *maintain* the person (sustaining).
  *   **Motivating Case:** The **Isolated Child**. If relations are purely constitutive, a child raised in isolation is not a person. This contradicts the biological reality that they are human and the moral intuition that harming them is wrong.
  *   **The Fix:** The theory must posit a *baseline ontological status* (potential personhood) that exists prior to socialization, which is then *actualized* or *completed* by constitutive relations.
  *   **Status:** **[NON-NEGOTIABLE]**. Without this, the theory justifies infanticide or neglect of feral children.
  *   **Distinction to Preserve:** *Ontological Humanity* (biological/species membership) vs. *Social Personhood* (moral agency/status).

  **2. The Mechanism of Passive Participation**
  *   **The Requirement:** The theory must explain how an entity can be a "relatum" (a party in a relation) without being an active "relator."
  *   **Motivating Case:** **Severe Dementia**. If personhood requires active reciprocity (dialogue, recognition), the dementia patient loses personhood upon losing cognitive function.
  *   **The Fix:** Personhood must be capable of being *held in trust* by the community. The relation is maintained unilaterally by the caregivers, sustaining the patient's status even if the patient cannot reciprocate.
  *   **Status:** **[NON-NEGOTIABLE]**. Failure here leads to euthanasia arguments based on "loss of self."
  *   **Distinction to Preserve:** *Capacity for Agency* vs. *Status of Membership*.

  **3. The Topology of Distributed Agency**
  *   **The Requirement:** The theory must define the boundaries of the agent when decision-making is shared across time or entities.
  *   **Motivating Case:** **Ghost Relations**. When a living family member makes a decision based on an ancestor's naming ritual or digital memorial, who is the agent?
  *   **The Fix:** The theory must allow for *trans-temporal agency*. The "person" acting is a composite of the living executor and the remembered dead. The dead ancestor is not a psychological state in the living person's head, but an external node in the moral network that exerts causal force.
  *   **Status:** **[SECTARIAN PREFERENCE]**. Liberal individualism will reject this as metaphorical. A rigorous Ubuntu theory must treat this as ontologically real within the social sphere.
  *   **Distinction to Preserve:** *Psychological Memory* (internal state) vs. *Social Presence* (external normative constraint).

  ### II. Ethical Desiderata (The Normative Weight)

  **4. The Decoupling of Status and Obligation**
  *   **The Requirement:** The theory must separate the *right to be treated as a person* from the *duty to act as a person*.
  *   **Motivating Case:** **Dementia & Infancy**. A strict reciprocal ethic suggests: "I owe you only if you owe me." This fails for those who cannot owe anything.
  *   **The Fix:** Moral status is asymmetric. The community owes the non-reciprocator protection (status), but the non-reciprocator owes the community nothing (obligation).
  *   **Status:** **[NON-NEGOTIABLE]**. Essential for care ethics.
  *   **Distinction to Preserve:** *Rights-Bearer* vs. *Duty-Bearer*.

  **5. The Limit of Communal Dissolution**
  *   **The Requirement:** The theory must specify a "firewall" preventing the community from completely absorbing the individual's moral responsibility.
  *   **Motivating Case:** **Criminal Accountability**. If "we" are the "I," then when an individual commits a crime, is the community guilty? If the community is guilty, is the individual innocent?
  *   **The Fix:** While identity is relational, *loci of accountability* must remain localized to the biological body for practical and justice reasons, even if the *causes* are distributed.
  *   **Status:** **[NON-NEGOTIABLE]**. Without this, the theory collapses into collective scapegoating or absolves individual perpetrators.
  *   **Distinction to Preserve:** *Causal Influence* (community shaped me) vs. *Moral Liability* (I pulled the trigger).

  **6. The Recognition of Hostile Relations**
  *   **The Requirement:** The theory must account for negative relations without denying personhood.
  *   **Motivating Case:** **The Outcast/Enemy**. If personhood is formed by community, does being rejected by the community strip you of personhood?
  *   **The Fix:** Negative recognition (being hated, feared, or ostracized) is still a form of relational binding. It confirms social existence, even if the quality is destructive. Personhood is not dependent on *harmonious* relations, only *existent* ones.
  *   **Status:** **[NON-NEGOTIABLE]**. Prevents the theory from implying that peace is a prerequisite for existence.
  *   **Distinction to Preserve:** *Social Visibility* vs. *Social Approval*.

  ### III. The Incompatibility Matrix (Trade-Offs)

  This is the critical section for your argument. You cannot maximize all variables simultaneously. A rigorous theory must choose which constraints to relax.

  **1. The Reciprocity vs. Inclusion Trade-off**
  *   **Conflict:** You cannot hold that personhood requires *active reciprocity* AND that personhood includes *severely cognitively impaired humans*.
  *   **Resolution:** A rigorous Ubuntu theory must sacrifice strict reciprocity. It must adopt a "vicarious reciprocity" model where the community reciprocates *on behalf* of the impaired.
  *   **Cost:** This creates a dependency class. The impaired person's status is vulnerable to the goodwill of the community.
  *   **Verdict:** **[UNSATISFIABLE PAIR]**. You must drop active reciprocity as a condition for *status* (keeping it only for *privilege*).

  **2. The Autonomy vs. Constitution Trade-off**
  *   **Conflict:** You cannot claim the self is *wholly constituted* by relations AND that the self possesses *radical autonomy* to reject those relations.
  *   **Resolution:** If relations are constitutive, rejecting the community is a form of self-harm or ontological shrinking, not an exercise of freedom.
  *   **Cost:** This weakens the concept of "rights against the community." If the community makes you who you are, your right to oppose them is limited to reforming the relation, not exiting it.
  *   **Verdict:** **[UNSATISFIABLE PAIR]**. Liberal individualism chooses Autonomy. Classic Ubuntu chooses Constitution. A hybrid must define "Exit Rights" carefully.

  **3. The Immanence vs. Transcendence Trade-off (The Ghost Problem)**
  *   **Conflict:** You cannot maintain a strictly materialist biology AND treat dead ancestors as active moral agents.
  *   **Resolution:** The theory must treat "social existence" as a layer distinct from "biological existence." The ancestor is biologically dead but socially active.
  *   **Cost:** This requires a dual-aspect ontology that liberal naturalism rejects. It risks superstition if not carefully bounded (e.g., distinguishing ritual obligation from literal ghostly intervention).
  *   **Verdict:** **[COMPATIBLE WITH CAUTION]**. Only if "agency" is redefined as "normative influence via memory/record" rather than "causal intervention."

  ### IV. Comparative Assessment

  Here is how the two dominant frameworks score against this spec.

  **1. Standard Liberal Individualism**
  *   **Dementia:** **FAIL.** Struggles to justify rights without cognitive capacity. Often relies on "precedent autonomy" (what you wanted before) which ignores the current relational reality.
  *   **Isolated Child:** **PASS.** Innate rights handle this easily.
  *   **Ghost Relations:** **FAIL.** Dismisses this as psychological projection or metaphor. Cannot account for the normative weight of the dead.
  *   **Reciprocity:** **PASS.** Clear distinction between rights and duties.
  *   **Major Flaw:** Collapses personhood into internal psychological states (memory, rationality). Cannot handle the *distributed* nature of the self.

  **2. Classic Ubuntu Formulations (e.g., Tutu, Shutte)**
  *   **Dementia:** **PASS (with caveats).** Strong on care and community holding. Weak on defining the limit where care becomes paternalism.
  *   **Isolated Child:** **FAIL/RISKY.** Some formulations imply a feral child is not a person ("a person is a person through other people"). Needs the *Potentiality* amendment (Desideratum 1).
  *   **Ghost Relations:** **PASS.** Naturally accommodates ancestors as part of the moral community.
  *   **Reciprocity:** **FAIL.** Often blurs the line between status and obligation, risking the exclusion of those who cannot contribute.
  *   **Major Flaw:** Risks dissolving individual accountability into the collective. Struggles with the "Firewall" (Desideratum 5).

  ### V. Summary of the "Spec" for Your Theory

  To win your argument, your proposed theory must assert the following three claims explicitly:

  1.  **Personhood is a Gradient of Actualization:** We are born with *ontological potential* (satisfying the Isolated Child case) but require *social actualization* to achieve full moral agency (satisfying the Ubuntu intuition).
  2.  **Relations are Asymmetric:** The community has a duty to sustain the personhood of those who cannot reciprocate (satisfying the Dementia case). Personhood is not a contract; it is a status conferred and maintained by the network.
  3.  **Agency is Hybrid:** In cases of ritual or memorial (Ghost Relations), the "agent" is the living representative acting *in the name of* the dead. The dead do not act, but the living are not acting alone; they are acting as a *channel*. This preserves the reality of the obligation without requiring magical thinking.

  **The Non-Negotiable Bottom Line:**
  If the theory cannot explain why we owe care to the dementia patient *without* referencing their past autonomy or future utility, it is not a relational theory; it is just individualism with a community flavor. The obligation must arise from the *current relation of dependency*, not the *history of the individual*. That is the philosophical work Ubuntu must do.
