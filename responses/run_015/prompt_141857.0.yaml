  In the Republic of Vardia, 1953, following a brief civil unrest, Battalion 9 is tasked with liquidating two groups of detainees. Two sub-units, Alpha and Bravo, are formed by a random lottery from the same reserve pool; the men share identical ages, home regions, prior exposure to state propaganda about the detainees, and understanding of the consequences for refusal. Both units receive the exact same written order ("neutralize the sector"), operate under the same distant supervision from a watchtower where officers record completion but do not observe method, and work the same shift length with identical rations and ammunition. The single difference is the physical terrain assigned: Alpha is deployed to a flat, paved courtyard, while Bravo is deployed to a courtyard filled with waist-high, dense stone ruins. Both units complete the killing job fully. Alpha proceeds in straight lines, firing efficiently and minimizing contact, treating the task as a boring administrative checklist. Bravo, however, utilizes the ruins to separate families, play games of concealment with the victims before shooting, and prolong the process with inventive cruelty, despite no order to do so and no increase in hatred toward the victims.

  **The Breakdown**

  Here is how the two accounts you described handle this case, where they fail, and what variable actually drives the difference.

  **1. The Situation-and-Pressure Account (The "Ordinary Men" Side)**
  *   **What it says:** This theory argues that people commit atrocities because of social pressure: obedience to authority, fear of career loss, conformity to peers (not wanting to be the shirker), and the routinization of evil (breaking the job into small, boring steps).
  *   **Where it runs out:** In this case, authority is identical (same orders), career risk is identical (same consequences), peer conformity is functionally identical (same unit size and supervision), and the task is the same. This account predicts both units should behave the same way—likely mechanically, because routinization reduces moral stress. It cannot explain why Bravo became *more* engaged and cruel without a change in social pressure or orders.
  *   **The Blind Spot:** It treats the physical world as a neutral stage. It assumes that if the *social* situation is the same, the behavior will be the same.

  **2. The Shared-Belief Account (The "Ideology" Side)**
  *   **What it says:** This theory argues that people commit atrocities because they hold specific, hateful beliefs about the victims (e.g., that they are dangerous, subhuman, or enemies). The violence is an expression of that internal conviction.
  *   **Where it runs out:** Both units were drawn from the same pool with the same background and propaganda exposure. Their internal belief system regarding the victims is identical. This account predicts that if the hatred is the same, the expression of that hatred should be the same. It cannot explain why Alpha was bored and efficient while Bravo was inventive and sadistic, solely based on what they believed about the victims.
  *   **The Blind Spot:** It treats violence as a direct output of belief. It assumes that if the *ideology* is the same, the *method* will be the same.

  **The Variable Doing the Work: Environmental Affordance**
  The variable separating the two outcomes is **Environmental Affordance**. This is a technical term for what the physical environment *allows* you to do easily without being told. The stone ruins *afforded* hiding, cornering, and game-playing. The flat pavement *afforded* only line-of-sight shooting. The men didn't need new orders or new hatred to act differently; they just needed different physical opportunities.

  **The Delete Test**
  If you delete this variable (make both courtyards flat pavement), the case collapses back into something both theories handle fine: both units likely become mechanical and efficient. The divergence disappears, and the theories can argue endlessly about whether that mechanical compliance was due to pressure or belief, but they would at least agree on the *outcome*. The variable is necessary to explain the *style* difference.

  **Fairness to the Situation-and-Pressure Side**
  If I were arguing for the Situation-and-Pressure account, I would say this case is rigged because it smuggles social pressure in through the back door. I would argue that the stone ruins actually *changed* the conformity dynamic. In the flat courtyard, every man sees exactly what his mate is doing, increasing the pressure to conform to the group norm (efficiency). In the ruins, even if the supervisor sees everything, the *peers* might lose sight of each other behind the waist-high walls. If Bravo's men couldn't see each other perfectly, the pressure to conform to "efficient killing" dropped, allowing individual cruelty to emerge. Therefore, the physical layout *did* change the social situation (visibility among peers), which is exactly what my theory predicts matters. I would claim you haven't found a new variable; you've just changed the visibility condition of the social pressure, which is my territory.
