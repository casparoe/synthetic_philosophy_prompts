      *   *Political Ontology:* The state is not a contract alienating right, but a transfer/composition of powers. Sovereignty *is* the power of the multitude.
      *   *Democracy:* "Most natural" because it aligns closest with the state of nature (everyone transfers right to the whole society).
      *   *The Tension:* If everyone has natural right, why exclude groups from citizenship?
      *   *The Proposed Solution:* The prompt suggests a functionalist reading. The *power* comes from everyone (extensive), but the *direction* requires rationality (intensive). Exclusions ensure the deliberative body isn't swayed by passions that undermine the *conatus* of the state.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
