answer: |-
  To reconstruct Spinoza's political philosophy along the lines you propose requires us to suspend the modern liberal intuition that legitimacy is derived solely from the universality of participation. Instead, we must anchor our reading in Spinoza's naturalistic metaphysics, where right is coextensive with power (*potentia*), and the stability of the *imperium* (state) depends on the alignment of institutional structures with the causal laws of human affect and reason.

  On this reconstructed reading, the tension between the universal source of power and the restricted sphere of citizenship is resolved by distinguishing between **extensive sovereignty** (the ontological ground of the state's power residing in the whole multitude) and **intensive sovereignty** (the rational direction of that power residing in the deliberative council). The exclusions found in the *Political Treatise* are not arbitrary denials of natural right, but structural filters designed to ensure that the *intensive* capacity for rational deliberation is not overwhelmed by the *extensive* pressures of dependency and passion.

  ### 1. *Potentia Multitudinis* vs. Liberal Popular Sovereignty

  To understand why the multitude's power is extensive even when its voting rights are restricted, we must first distinguish Spinoza's *potentia multitudinis* from the modern liberal conception of popular sovereignty.

  In the liberal tradition (from Locke to Rawls), popular sovereignty is fundamentally juridical and procedural. The "people" constitute a moral entity that authorizes the state through a contract or a voting procedure. Sovereignty is legitimate insofar as it represents the will of the governed. If the procedure is flawed or the franchise restricted, the sovereignty is deemed illegitimate because the *authorization* is incomplete. Power is treated as a commodity that is transferred or delegated.

  For Spinoza, sovereignty is ontological and dynamic. In the *Theological-Political Treatise* and the *Political Treatise*, he argues that the sovereign's right is nothing other than the power of the multitude itself. The state does not stand above the people; it is the people organized. *Potentia multitudinis* is the actual, physical capacity of the collective to act in concert. It is not generated by a vote; it is generated by the affects, desires, and interactions of all individuals within the polity.

  Consequently, extensive sovereignty belongs to everyone who contributes to the causal network of the state. A servant, a woman, or a foreigner residing within the *imperium* contributes to its stability, economy, and defensive capacity. Their obedience and labor add to the state's *potentia*. If they revolt, the state's power diminishes, regardless of whether they hold the vote. Therefore, extensive sovereignty is an objective fact of social physics: the state exists only insofar as the multitude sustains it. Modern liberalism mistakes the *symbol* of power (the vote) for the *substance* of power (the collective capacity to act). In a Spinozist framework, the excluded classes remain part of the sovereign substrate because the state's existence depends on their *conatus* aligning with the state's preservation, even if they do not direct that alignment legislatively.

  ### 2. Restricted Councils and the "Most Natural" State

  This distinction allows us to defend the claim that democracy remains the "most natural" form of state (*imperium*), even with a restricted council. Spinoza defines democracy as a state where the sovereign power is the whole body of citizens. However, he restricts citizenship to those who are *sui juris* (their own right)—specifically excluding those under the authority of others, such as servants, women (who he argues are naturally under the authority of men), and those without independent means.

  On a superficial reading, this looks like hypocrisy. On the reconstructed reading of intensive vs. extensive sovereignty, it is a functional necessity for rational governance.

  Democracy is "most natural" because it minimizes the alienation of right. In a monarchy, the multitude transfers its power to a single fiction; in a democracy, the power remains with the collective. However, for the collective to direct its power toward the "common good" (which, for Spinoza, is synonymous with the increase of rational capacity and freedom), the deliberative body must be composed of individuals capable of independent judgment.

  Spinoza's exclusions are based on the premise of **dependency**. A servant votes as his master dictates; a wife (in Spinoza's 17th-century anthropology) votes as her husband dictates. If such dependents are granted formal citizenship, they do not add new, independent rational vectors to the council. Instead, they amplify the power of the masters/husbands who control them. This distorts the *intensive sovereignty* of the council. It creates a situation where the deliberation is not a composition of diverse rational interests, but a magnification of specific household powers.

  Therefore, the restriction of the council is not a denial of the multitude's extensive power, but a safeguard for the *quality* of the state's self-direction. The extensive power of the servants and women supports the state (through labor, reproduction, social cohesion), but the intensive power (legislative reason) must be reserved for those whose livelihood and judgment are not determined by another. If the council includes those who cannot deliberate freely, the state ceases to be a rational agent and becomes a battleground of private dominions. Democracy remains the most natural state because the *source* of power is still the whole multitude (extensive), but the *steering mechanism* is protected from internal colonization by private authorities (intensive).

  ### 3. Implications for Modern Democratic Pathologies

  This reconstruction yields a provocative framework for evaluating modern democratic pathologies. Contemporary liberal democracies prioritize **maximal extensive inclusion** (universal suffrage) but often neglect **intensive sovereignty** (the rational coherence of deliberation).

  From a Spinozist perspective, a polity that maximizes voting rights while permitting factional, irrational, or affect-driven deliberation has weakened its democratic character. Here is why:

  1.  **Dilution of Intensive Sovereignty:** If the legislative body is populated by representatives driven by passive affects (fear, hope, indignation) rather than reason, the state loses its *conatus*. It ceases to act for its own preservation and begins to act self-destructively. Spinoza argues that the right of the state is defined by its power to persist. A parliament that legislates based on irrational passions reduces the state's overall *potentia* because it invites internal conflict and instability. By prioritizing the *quantity* of voters over the *quality* of deliberation, modern democracies risk diluting the intensive sovereignty required to guide the collective power.
  2.  **Misdirection of Extensive Power:** The extensive power of the multitude remains intact—the people still have the capacity to revolt, to work, to sustain the economy. However, without a rational council to direct this power toward common ends, the extensive power becomes fragmented. It manifests as polarization, populism, or factionalism. The *potentia multitudinis* is still the engine of the state, but without the "steering" of intensive sovereignty, the engine runs without a transmission, tearing the chassis apart.
  3.  **The Illusion of Freedom:** Modern liberalism equates voting with freedom. Spinoza equates freedom with rational necessity. A citizen who votes based on demagoguery is not free; they are enslaved to their passions. A state that facilitates this is not empowering the multitude; it is exposing them to their own volatility.

  Therefore, on genuinely Spinozist grounds, a modern democracy that suffers from high polarization and low rational consensus is *less* democratic than a restricted republic that maintains high rational coherence, provided the latter does not oppress the multitude to the point of rebellion (which would destroy the extensive base). The pathology of modern democracy is not that it excludes people from voting, but that it includes everyone in a process that has been stripped of the institutional conditions necessary for rational deliberation. It maximizes the *extensive* claim to sovereignty while evacuating the *intensive* capacity to exercise it.

  ### Conclusion

  By distinguishing between extensive and intensive sovereignty, we can see that Spinoza's exclusions are not a betrayal of his democratic ideals but an attempt to secure them against the fragility of human nature. Extensive sovereignty acknowledges that the state is nothing but the power of the living multitude. Intensive sovereignty acknowledges that for this power to be free (i.e., determined by reason rather than passion), the decision-making body must be insulated from relations of dependency and affective volatility.

  This reconstruction challenges the modern assumption that more voting equals more democracy. Instead, it posits that true democracy is the alignment of the multitude's power with the dictates of reason. Where modern polities maximize the former at the expense of the latter, they do not strengthen democracy; they weaken the *imperium*, leaving the extensive power of the people intact but directionless, and the intensive power of the state rational in name only. A Spinozist remedy would not necessarily be to restrict the franchise arbitrarily, but to construct institutions that elevate the *intensive* rationality of deliberation, ensuring that the vast *extensive* power of the multitude is directed toward true common goods rather than fragmented passions.
