          *   *Reconstruction:* It's not about worth, it's about *independence of judgment*. If you depend on another for livelihood/safety, your vote isn't free; it's an extension of their will.
          *   *Intensive Sovereignty:* The Council must be free from external determination to deliberate on the *common* good.
          *   *Synthesis:* Democracy is natural because the *power* remains with the whole (extensive), even if the *steering* is delegated to the independent (intensive). The substrate supports the structure.

      *   **Point 3: Modern Democratic Pathologies:**
          *   *Modern Scenario:* Universal suffrage (max extensive inclusion) + Polarization/Populism (low intensive rationality).
          *   *Spinozist Critique:* This dilutes intensive sovereignty. If the deliberative body is driven by passion (affects) rather than reason, the state loses its *conatus* coherence.
          *   *Result:* The state becomes unstable. The *potentia* is there (extensive), but it's misdirected (self-destructive).
          *   *Conclusion:* A Spinozist democracy prioritizes the *quality* of deliberation (reason) over the *quantity* of voters, provided the underlying power of the multitude is not oppressed (which would destroy the extensive base).

