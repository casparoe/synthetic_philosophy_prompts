      *   **Point 1: *Potentia Multitudinis* vs. Liberal Popular Sovereignty:**
          *   *Liberal View:* Sovereignty is procedural/legitimacy-based. "We the people" authorize the state via voting/contract. It's juridical.
          *   *Spinozist View:* Sovereignty is ontological/physical. It's the actual capacity to act. If the multitude revolts, the sovereign loses power.
          *   *Key Difference:* Liberalism = Right to choose rulers. Spinoza = Power constitutes the ruler. The multitude is the *cause* of the state's power, not just its legitimizer.
          *   *Relevance to Extensive Sovereignty:* Everyone contributes to the *potentia* simply by existing within the state's causal network, regardless of voting rights.

      *   **Point 2: Restricted Council & "Most Natural" State:**
          *   *Why Democracy?* It minimizes the alienation of right. The sovereign *is* the multitude (in aggregate).
