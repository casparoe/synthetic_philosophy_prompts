answer: |-
  Mara sits at her desk with a publishing contract open to the clause specifying the delivery date: eighteen months from signature, with a financial penalty for delay. Her inside view is bright with certainty. She has spent the last year on a fellowship specifically to research this period, she has already drafted the crucial middle section that stalled her previous book, and she has cleared her teaching schedule to write full-time. Based on these particulars—the shape of the plan, the visible obstacles removed, the progress made—she estimates she will deliver the manuscript in twelve months. Signing the contract is the rational choice; it secures her income and locks in her momentum.

  However, when she steps back to apply the outside view, the picture fractures into two competing histories. The first reference class is "historical novels requiring archival translation." Mara knows that books in this category involve unpredictable delays: documents are missing, languages prove更难 than expected, narratives collapse under the weight of fact. The statistical average for this class is a delivery time of thirty months. If she treats her project as a random sample from this group, signing the contract is irrational; she is betting against the heavy tail of delay. The second reference class is "third and fourth novels by authors who met all previous deadlines." Mara has delivered her last two books early. Her publisher knows her workflow; her editor knows her habits. The statistical average for this class is sixteen months. If she treats her project as a sample from this group, signing is rational. Both classes are defensible. The first captures the intrinsic difficulty of the task; the second captures the reliability of the agent. Neither is gerrymandered; both are broad enough to have data and narrow enough to be relevant.

  Complicating this further is a piece of evidence no reference class can register. During her fellowship, Mara uncovered a private cache of letters between the historical figures at the center of her plot. These letters resolve the central mystery of the book without the need for the speculative drafting that usually consumes her second year. This is not merely a feeling of confidence; it is a structural shortcut unique to this manuscript. To ignore this because it isn't in the base rates of "historical novels" would be to discard genuine information that increases accuracy. Yet, she cannot use the outside view to decide which reference class matters more. She might ask, "In cases where an author's track record conflicts with a genre's difficulty, which predicts better?" But there is no dataset for that question. To find one, she would need to classify *this* decision situation into a class of "decision situations," inviting the same ambiguity all over again. The vantage point from which she could objectively weigh the reference classes vanishes as she approaches it, leaving her holding two contradictory statistics and one private truth.

  The vanishing vantage point demonstrates that the outside view is serviceable only as a corrective to enthusiasm rather than as an arbiter of what to believe. Because selecting a reference class is itself an interpretive act subject to the same biases as the original estimate, blind deference to base rates is impossible; one must always exercise judgment to choose which history matters. Epistemic modesty, therefore, cannot mean surrendering the inside view to the outside, but rather using the outside view to stress-test the inside view's assumptions. In Mara's case, the statistics on archival translation should not veto her decision, but they must force her to interrogate whether her private letters truly eliminate the translation risk or merely hide it. The outside view does not provide the answer, but it ensures the question is asked with sufficient gravity.
