  5.  **Evaluating Theoretical Families:**

      *   *Materialist (Soboul, etc.):* Good on class interests, struggles with why bourgeois revolutionaries turned on bourgeois allies without a change in class structure.
      *   *Ideological/Cultural (Furet, etc.):* Good on the logic of equality/totalitarianism, struggles with material constraints (famine/war).
      *   *Contingency/Political (Doyle, etc.):* Good on specific events, struggles to explain the *pattern* of radicalization across different contexts.

  6.  **Developing the Counterfactual:**

      *   *Scenario:* CPS dissolves voluntarily (mid-1794, before Thermidor).
      *   *Theory's Job:* Must predict the outcome based on its core mechanisms.
      *   *Materialist:* Power vacuum leads to bourgeois consolidation anyway.
      *   *Ideological:* The "logic of total virtue" demands a purge, so voluntary dissolution is impossible within the model (theory falsified or requires ad hoc adjustment).
      *   *Contingency:* Outcome is radically different; civil war or immediate Directory.

  7.  **Structuring the Document:**

