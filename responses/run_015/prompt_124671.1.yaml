      *   **Constraints:** No bibliography/citations. Focus on architectural specification.

  2.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Origin Story.* Must explain the shift from constitutional monarchy to republic.
      *   *Requirement 2: Radicalization.* Why 1793? War, famine, rebellion. Needs to distinguish between external pressure and internal logic.
      *   *Requirement 3: The Terror's Logic.* Was it a tool or an end? Needs to handle the distinction between "circumstantial terror" and "ideological terror."
      *   *Requirement 4: The Thermidorian Reversal.* Why stop? Why turn on Robespierre? This is the "devouring children" puzzle.
      *   *Requirement 5: Agency vs. Structure.* Can the theory handle specific dates (9 Thermidor) without losing the big picture?
      *   *Requirement 6: Geography.* Paris vs. The Provinces. The sans-culottes vs. the peasantry/bourgeoisie.
      *   *Requirement 7: Ideology vs. Interest.* Were they Jacobins because of Rousseau or because of grain prices?

      *Refining for "Architectural Specification" Tone:* The language needs to be rigorous, almost like a software spec or a philosophical framework. Use terms like "Non-Collapsibility," "Determinacy Range," "Mechanism Transparency."

  3.  **Addressing the "Devouring Children" Puzzle:**

      *   This is the crux. A theory must explain why the *same* institutional logic that empowered the Committee of Public Safety (CPS) necessitated its purge.
      *   *Structural view:* The logic of emergency governance requires a scapegoat once the emergency fades.
      *   *Contingent view:* Robespierre made a tactical error on 8 Thermidor.
      *   *Desideratum:* Must specify the trigger condition for elite purging.

  4.  **Identifying Conflicts (The "Flagging" Requirement):**

      *   *Conflict:* High Structural Determinism vs. High Agency Contingency.
      *   *Why:* If the Terror was inevitable due to war/class structure, then Thermidor must also be inevitable. But if Thermidor depended on a specific vote or a shouted phrase in the Convention, structure is weakened.
