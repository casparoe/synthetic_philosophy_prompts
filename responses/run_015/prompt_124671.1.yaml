answer: |-
  # Architectural Specification for Interpretive Theory of the French Revolution (1789–1795)

  ## 1. Core Phenomenological Coverage
  An adequate theory must generate a causal narrative that accounts for the following three phase-transitions without appealing to external *deus ex machina* interventions.

  ### 1.1 The Institutional Metamorphosis (1789–1792)
  *   **Phenomenon:** The transformation of the Estates-General from a feudal consultative body into a National Assembly claiming sovereign constituent power, followed by the collapse of the constitutional monarchy.
  *   **Requirement:** The theory must explain the mechanism by which legal representation converted into revolutionary legitimacy. It must distinguish between the *breakdown of state fiscal capacity* and the *assertion of popular sovereignty*.
  *   **Concrete Puzzle:** Why did the Third Estate declare itself the Nation in June 1789 rather than seeking a negotiated compromise with the Crown, given the risks of civil war?

  ### 1.2 The Radicalization Vector (1793–1794)
  *   **Phenomenon:** The acceleration of political violence, the centralization of power in the Committee of Public Safety (CPS), and the implementation of the Terror as state policy.
  *   **Requirement:** The theory must model the feedback loop between external threat (foreign war/Vendée) and internal purification. It must specify whether radicalization was a *defensive adaptation* or an *ideological imperative*.
  *   **Concrete Puzzle:** Why did the repression intensify in Spring 1794 (Law of 22 Prairial) when military victories had already secured the borders, suggesting the emergency was receding?

  ### 1.3 The Thermidorian Reversal (July 1794)
  *   **Phenomenon:** The sudden coalition of former terrorists and moderates to overthrow Robespierre and dismantle the Terror apparatus, followed by the stabilization of a bourgeois republic.
  *   **Requirement:** The theory must explain the trigger for the reversal. It must account for why the elimination of the leadership did not result in counter-revolution or anarchy, but rather in a consolidation of the revolutionary gains without the revolutionary methods.
  *   **Concrete Puzzle:** Why was Robespierre, the figurehead of the system, the specific target, rather than the system itself being reformed around him?

  ---

  ## 2. Distinctiveness Constraints (Non-Collapsibility)
  The theory must maintain analytical separation between the following variables. Collapsing these distinctions constitutes a failure of specification.

  ### 2.1 Class Interest vs. Ideological Commitment
  *   **Distinction:** Material gain (property, market freedom) versus abstract virtue (Republic of Virtue, general will).
  *   **Constraint:** The theory cannot reduce ideological rhetoric to mere epiphenomenal cover for class interest, nor can it treat ideology as floating free of social bases.
  *   **Test Case:** The execution of the Hébertists (ultra-radicals) and the Dantonists (moderates) simultaneously. A class-reductionist model struggles to explain why the "left" and "right" of the revolution were purged by the same center unless ideology is granted independent causal weight regarding political purity.

  ### 2.2 Parisian Sans-Culotte Pressure vs. Provincial Acquiescence
  *   **Distinction:** The mobilized urban poor of the capital versus the peasantry and bourgeoisie of the departments.
  *   **Constraint:** The theory must explain how Paris dictated terms to the provinces without triggering immediate successful federalist secession. It must account for the mechanism of central enforcement (Representatives-on-Mission).
  *   **Test Case:** The suppression of the Federalist Revolts (1793). Why did Lyon and Marseille fail to sustain opposition despite Paris being surrounded by enemies?

  ### 2.3 Structural Inevitability vs. Agentive Contingency
  *   **Distinction:** Long-term socio-economic determinants versus specific decisions made by individuals in closed rooms.
  *   **Constraint:** The theory must define the *range of determinacy*. It cannot claim that every event was structurally predetermined while also attributing causal significance to specific speeches or votes.
  *   **Test Case:** The vote on 9 Thermidor. Was Robespierre's fall guaranteed by the logic of the Terror, or did it hinge on his failure to name specific deputies in his speech on 8 Thermidor?

  ---

  ## 3. The "Devouring Children" Mechanism Specification
  This is the central stress test for the theory. It must explain the auto-cannibalization of the revolutionary elite.

  ### 3.1 The Elimination Logic
  *   **Requirement:** The theory must specify the function of elite purging within the revolutionary system.
  *   **Option A (Structural):** The system requires periodic sacrifice to maintain legitimacy when material promises (bread/victory) cannot be met.
  *   **Option B (Contingent):** Factional insecurity leads to preemptive strikes; Robespierre was eliminated because he threatened specific individuals, not because the system required it.
  *   **Mandatory Explanation:** If the theory posits Option A, it must explain why the purging stopped at Thermidor. If Option B, it must explain why this specific contingency occurred at the peak of state power.

  ### 3.2 Institutional Reflexivity
  *   **Requirement:** The theory must explain how the institutions created to protect the Revolution (Revolutionary Tribunal, CPS) became the weapons used to destroy its architects.
  *   **Concrete Puzzle:** The Law of 22 Prairial streamlined executions to protect the Revolution but removed the deputies' immunity, directly enabling their own fear and subsequent coup. The theory must model this institutional blowback.

  ---

  ## 4. Incompatibility Flags (Jointly Unsatisfiable Desiderata)
  The following pairs of desiderata represent logical tensions. A theory claiming to satisfy both fully is likely incoherent.

  ### 4.1 Flag: Macro-Structural Determinism vs. Micro-Event Precision
  *   **Conflict:** A theory that claims the Terror was the *inevitable* outcome of bourgeois revolution/war (Macro) cannot simultaneously claim that the specific date and manner of Robespierre's fall depended on a tactical error in the Convention (Micro).
  *   **Resolution Constraint:** The theory must declare a *determinacy horizon*. It may predict the *probability* of a reversal in 1794, but if it claims to predict the *exact date* via structure alone, it forfeits the ability to claim agentive contingency mattered.
  *   **Failure Mode:** "Hindsight Necessity." Claiming an event was contingent when it happened but structurally necessary when explaining it later.

  ### 4.2 Flag: Totalitarian Continuity vs. Democratic Discontinuity
  *   **Conflict:** A theory that views the Terror as the logical endpoint of 1789 democratic principles (Furet-style) conflicts with a theory that views Thermidor as the true realization of 1789 bourgeois liberalism (Soboul-style).
  *   **Resolution Constraint:** The theory must define whether 1793 was a *deviation* from the Revolution's path or the *fulfillment* of it. It cannot be both a necessary expression of the General Will and an accidental hijacking by extremists without specifying the switching mechanism.

  ---

  ## 5. Performance of Interpretive Families
  Brief assessment of how major theoretical architectures fare against this specification.

  ### 5.1 Materialist / Class-Struggle Model
  *   **Strengths:** High fidelity on Desideratum 2.1 (Class Interest) and 2.2 (Paris/Province economic disparities). Explains Thermidor as the bourgeoisie securing property rights once the sans-culottes were no longer needed for defense.
  *   **Weaknesses:** Struggles with Desideratum 3.1 (Elimination Logic). If the bourgeoisie controlled the CPS, why did they allow it to threaten their own members (Danton/Desmoulins) before Thermidor? Often reduces ideology to epiphenomenon, violating Desideratum 2.1.
  *   **Verdict:** Fails the "Devouring Children" test unless it admits significant agentive autonomy for the Committee.

  ### 5.2 Ideological / Political-Culture Model
  *   **Strengths:** High fidelity on Desideratum 1.2 (Radicalization Vector). Explains the intensification of violence via the logic of "virtue" and the rejection of intermediaries. Handles the reflexive nature of institutions (Desideratum 3.2) well.
  *   **Weaknesses:** Struggles with Desideratum 2.2 (Paris/Province). Often treats "Revolutionary Culture" as monolithic, underestimating material coercion (grain requisitioning) required to enforce compliance in the provinces.
  *   **Verdict:** Strong on *why* the Terror happened, weaker on *why* it stopped exactly when it did without external material change.

  ### 5.3 Contingency / Political-Narrative Model
  *   **Strengths:** High fidelity on Desideratum 2.3 (Structure vs. Agency). Accurately models the specific parliamentary maneuvers of Thermidor. Avoids teleology.
  *   **Weaknesses:** Fails Desideratum 1.0 (Core Phenomenological Coverage) regarding patterns. If everything is contingent, the theory cannot explain why similar revolutionary dynamics appear in other contexts. It risks describing *how* without explaining *why*.
  *   **Verdict:** passes the "Devouring Children" test by attributing it to fear, but fails to provide a generalizable theory of revolution.

  ---

  ## 6. Counterfactual Stress Test
  To validate its internal mechanics, the theory must process the following constructed scenario without ad hoc adjustment.

  ### 6.1 The Scenario: Voluntary Dissolution (Mid-1794)
  *   **Condition:** Assume that on 1 June 1794 (after the victory at Fleurus but before the Law of Prairial is fully implemented), the Committee of Public Safety voluntarily announces the suspension of the Revolutionary Tribunal and dissolves itself, returning power to the Convention committees.
  *   **Constraint:** Robespierre remains alive and retains moral authority but relinquishes executive dictatorship.

  ### 6.2 Required Theoretical Prediction
  The theory must predict the trajectory of the Republic from June 1794 to 1795 based on its core mechanisms.

  *   **Materialist Prediction:** The bourgeoisie in the Convention will immediately move to suppress the sans-culottes and fix prices. Without the CPS to mediate, class conflict intensifies. Outcome: Civil war or a faster, bloodier Thermidor initiated by the Convention against the Paris sections.
  *   **Ideological Prediction:** The "logic of virtue" remains unsatisfied. Without the Terror to purge the corrupt, factions will accuse the Convention of betrayal. Outcome: A different faction seizes the CPS mechanism within months to restart the purges (Robespierre or a successor). The structural drive toward totalitarianism persists.
  *   **Contingency Prediction:** The outcome is indeterminate. It depends on whether the food supply holds and whether foreign powers sue for peace. Outcome: Possible stabilization of a constitutional republic without the Thermidorian Reaction, as the specific fear triggering 9 Thermidor (personal execution) is removed.

  ### 6.3 Evaluation Criterion
  If the theory predicts the *exact same outcome* (Robespierre falls, Terror ends) despite the voluntary dissolution, it claims **Structural Overdetermination** (the specific coup was irrelevant).
  If the theory predicts a *divergent outcome* (Republic stabilizes), it claims **Agentive/Institutional Contingency** (the specific mechanism of the coup was the cause of the reversal).
  *Failure Condition:* If the theory cannot process this input without redefining its core variables (e.g., claiming voluntary dissolution was "impossible" within the model without proving it), the theory is falsified as tautological.
