      *   *Elena's Distinction:* This is the "Subsidy vs. Restriction" argument (similar to *Rust v. Sullivan* or *NEA v. Finley* in US law). The government doesn't have to fund every speech, but it can't discriminate based on viewpoint *if* it creates a limited public forum.
      *   *Marcus's Collapse:* This is the "Chilling Effect" or "Effective Suppression" argument. If the only way to be heard is through the university, and the university says no, are you silenced?

