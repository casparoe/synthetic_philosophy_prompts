          *   *Wait, one more nuance:* Public universities *can* curate speaker series for educational relevance. They don't have to invite *everyone*. But they can't exclude *specifically* because they dislike the view. Marcus says they are excluding *because* he rejects democracy. Elena says they are managing resources. If the criterion for resource management is "must support democracy," then it's viewpoint discrimination.
          *   *Okay, I will argue:* Elena's distinction is theoretically sound in the abstract (state doesn't fund all speech) but collapses in the context of a *public university's mission*. Marcus wins on the functional reality, but loses on the strict Popperian criteria (advocacy $\neq$ violence). However, regarding the specific question (Distinction vs. Collapse), Marcus wins. The distinction is a formalism that ignores power dynamics.

