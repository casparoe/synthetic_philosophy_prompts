answer: |-
  The rain had settled over the Welsh borders, a fine mist that blurred the stone walls of the yard. Inside the kitchen, the light was low. The deed, yellowed and brittle, lay next to the crisp, modern covenant papers. I sat at the head of the table, saying nothing. Dr Nia Protheroe stirred her tea; Dr Alasdair Kemp traced the edge of the deed with a blunt finger.

  'Your friend's advice is not nonsense,' Nia said, looking at me. 'It is unsettling, but it is not nonsense. The Doomsday Argument gives you genuine information. You are the fifth tenant. If this tenancy were to endure for a hundred generations, your position would be extraordinarily rare. If it ends soon, your position is typical. Rationality demands you favour the hypothesis where you are typical.'

  Alasdair shook his head. 'It gives you nothing you can act on. Not because the conclusion is absurd, but because the mechanism here breaks the inference. Look at this deed. The tenant is chosen by lot from all living descendants. The pool started as a handful; now it is forty. You were not drawn from an urn of all possible tenants. You were drawn from a pool of cousins at a specific moment.'

  'Is that distinction fatal?' Nia asked. 'Or merely cosmetic? The result is the same: you are an observer located at a specific point in a sequence. Unless you believe the lottery mechanism is biased towards selecting people early in the farm's history specifically because the farm will end soon, the selection is random with respect to the total duration.'

  'It is not random with respect to duration,' Alasdair countered. 'It is random with respect to family demographics. Suppose the farm lasts two hundred years. The family grows. The pool of descendants expands. The probability of any specific individual being chosen drops over time. But you are not asking "What is the chance I am chosen?" You are asking "Given I am chosen, how long does the farm last?" The growing pool means that early tenants are actually *more* likely to be selected simply because the competition was fiercer later. No, wait—the competition is fiercer later, so being selected early is more probable if the pool is small. But the pool size is correlated with time, not necessarily with the end of the tenancy. The sequence ends when someone declines. That is a decision, not a lottery draw.'

  'But you don't know when someone will decline,' Nia pressed. 'You only know your rank. If the total number of tenants is $N$, and you are number $n$, the probability of being $n$ given $N$ is $1/N$. This is the Copernican principle. You are not special. To assume the farm will last centuries is to assume you are special, positioned in the first 5 per cent of all tenants.'

  'The arrival-time version works for walls,' Alasdair said, turning to me. 'If you stumble upon a wall at a random moment, you can guess its remaining lifespan. But that relies on your arrival time being random. Here, your "arrival" is determined by birth and death in your family. You are not an outsider stumbling upon the farm. You are embedded in its causality.'

  'Yet the mathematics align,' Nia insisted. 'An outsider arriving at a random time is equivalent to an observer being a random sample from all observer-moments. If the farm lasts longer, there are more tenant-moments. You are less likely to be this early one. The success of the arrival-time reasoning supports the self-locating version. They stand together.'

  'They stand together only if you ignore what you know,' Alasdair said. 'This brings us to what you conditionalise on. Your friend tells you to treat your position as a random draw. That is the thin datum: "I am the fifth tenant." But you possess the thick datum: "I am the fifth tenant, alive in 2026, knowing the farm started in 1920."'

  'If you conditionalise on the date,' Nia argued, 'you beg the question. You are using the very information whose uncertainty we are trying to resolve. To estimate the future duration, you must strip away the specific date and look only at your rank. The reference class is "tenants".'

  'The reference class is "humans aware of their historical context",' Alasdair corrected. 'Or in this case, "descendants aware of the deed". If you include the fact that you know the population of descendants has grown to forty, you screen off the anthropic update. You know why you are early: because the farm is young, not because it will end soon. A principled rule for centred facts is: conditionalise on all indexical information that does not logically entail the hypothesis you are testing. Knowing it is 2026 entails the farm has lasted roughly a century. It does not entail it will end tomorrow. But knowing you are number 5 does not entail either. However, you *also* know the demographic history. Ignoring that is not rigour; it is blindness.'

  Nia leant forward. 'I concede that if the demographic growth is deterministic and known, it weakens the shift. But it is not known. Family growth is stochastic. The anthropic shift remains. It might not move the probability from 1 per cent to 90 per cent, but perhaps from 1 per cent to 5 per cent. Does that matter? Look at your decision. The covenant binds your descendants for ninety-nine years. Its value depends on a world stable enough to honour it. If the risk of collapse—of the tenancy, of the society enforcing the covenant—is higher than you thought, the expected value of the covenant drops.'

  'And the alternative?' Alasdair asked. 'Selling the land and giving the proceeds to charities working on problems urgent now. That value is certain. It does not depend on the year 2125.'

  'Precisely,' Nia said. 'If the anthropic argument doubles the risk of early termination, it might tip the balance. Long-term bets are sensitive to tail risks.'

  'But ordinary uncertainty swamps it,' Alasdair said firmly. 'Climate change, market fluctuations, the stability of property law. These variables shift the probability of the farm surviving a century by orders of magnitude more than the anthropic shift. You are worrying about a adjustment of a few percentage points in a model when the real world is throwing boulders at it. For the anthropic shift to matter, it would have to be massive. It would have to suggest the end is imminent within your lifetime, not just within the century. Does the argument really say the farm ends in thirty years? Or just that it is unlikely to last ten generations?'

  'It says you should not assume it will last ten generations,' Nia said. 'It attacks the presumption of longevity.'

  'I concede that,' Alasdair said, turning to me. 'It attacks the presumption. If you were assuming the farm was guaranteed to last, the argument corrects that arrogance. It forces you to acknowledge fragility. But it does not give you a specific timeline you can plug into a spreadsheet.'

  Nia sighed. 'And I concede that the demographic complexity of the deed weakens the simple urn model. The growing pool of descendants means the probability of selection isn't uniform across time. It biases towards earlier tenants if the pool grows exponentially. That reduces the force of the Doomsday inference. It is not as strong as it is for the human race, where the reference class is murkier.'

  'Then what moves you?' I asked, my voice quiet in the kitchen.

  Nia looked at me. 'Evidence that the selection mechanism is truly random with respect to duration. If I knew the lottery was blind to family size, I would trust the shift more. The consideration that would most move me is proof that the pool size doesn't correlate with time.'

  Alasdair nodded. 'And for me, it would be evidence that the ordinary uncertainties are smaller than we think. If the legal and climate future were stable, then the anthropic shift would become the dominant variable. Currently, it is noise.'

  They looked at the papers. The covenant promised permanence. The sale promised immediate good.

  'We disagree on the weight of the argument,' Alasdair said. 'But we agree on the implication for you tonight.'

  'You cannot decide based on a metaphysical uncertainty,' Nia said. 'Whether the shift is real or not, it is too small to override the tangible needs of the present versus the speculative value of the future.'

  'You should sell the land,' Alasdair said. 'Not because the world is ending, but because the covenant requires a certainty of future institutions that no one can guarantee, anthropic reasoning or not. The charity work is urgent now. The farm's working life is already compromised by your doubt.'

  'And keep the deed,' Nia added. 'Preserve the history. But release the land. Whether the sequence ends in ten generations or a hundred, the value of relieving suffering today is invariant. The anthropic argument reminds us that the future is not ours to command. Act on what you can command.'

  I looked at the deed, then at the covenant. The rain tapped against the glass. The lottery of the past had brought me here; the lottery of the future was not mine to rig.

  'Then that is what I shall do,' I said.

  Nia closed her notebook. Alasdair pushed the covenant papers away. The kitchen felt lighter, the air less thick with ghosts of generations yet unborn. We drank our tea, cold now, and listened to the rain on the Welsh borders, which would continue regardless of our choices.
