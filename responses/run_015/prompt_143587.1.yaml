      *   Cost: Decision-making becomes harder (indeterminacy), but you avoid the absurdity of forced precision on unknown propositions.
      *   Self-referential part (5) dissolves because you don't need stable precise credences about future irrationality, just coherent ranges.

  6.  **Final Polish (checking constraints):**
      *   Lead with bottom line.
      *   Under 250 words.
      *   No citations.

      *Draft:*
      The weak link is (4). You infer that because coherence is required, precise credence is required. This conflates coherence with precision. You can reject (4) by adopting imprecise probabilities.

      On this view, suspension of judgment isn't a hidden precise number; it's a wide interval (e.g., [0,1]). A clever bookie cannot guarantee a loss against an agent whose credences are sets of functions, provided the agent accepts bets favorable to at least one function in the set. This preserves (1) for precise agents while allowing undefined states for others.

      The cost is decision-theoretic complexity. With precise credences, expected utility maximization dictates a unique choice. With imprecise credences, rationality sometimes permits a range of actions or suspends choice entirely. You lose the ability to model every decision as a maximization problem, but you gain the capacity to represent genuine ignorance without fabricating evidence.

