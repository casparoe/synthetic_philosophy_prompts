      *   *Addressing Worry 2 (The Ratchet):* This is the strongest philosophical hook. The film *does* dramatize the ratchet. The "natural" baseline is pathologized. Irene's condition is the smoking gun. She is "valid" but imperfect. The system demands perfection, effectively making "therapy" impossible because the goalpost is "optimal," not "healthy."
