  ### Introduction

  Your colleague's slogan—"killing and letting die are morally on a par, just differential causation wearing a normative gloss"—is a dense philosophical compression. In interdisciplinary settings, such slogans often function as conversation-stoppers that smuggle in substantial metaphysical and ethical commitments under the guise of common sense. To diagnose the argumentative work it is doing, we must disentangle the possible logical shapes this claim can take.

  Below is a structured menu of five distinct theses embedded in that slogan. They are arranged from the trivial or definitional (least controversial) to the genuinely radical (most controversial). For each, I evaluate whether it successfully supports your colleague's dismissal of your worry regarding solar-radiation management (SRM) versus unmitigated tipping points, or whether it fails to engage with the specific causal topology of collective governance you are highlighting.

  ---

  ### Menu of Theses

  #### 1. The Semantic Deflationist Reading
  *   **The Claim:** The distinction between "killing" (act) and "letting die" (omission) is merely a linguistic convention or a psychological heuristic, not a reflection of ontological reality. We apply the label "killing" when we disapprove of a causal chain and "letting die" when we tolerate it.
  *   **Logical Shape:** Trivial/Definitional. It treats the distinction as a post-hoc labeling exercise rather than a pre-existing feature of the world.
  *   **Does it support the dismissal?** **Yes.** If the distinction is just a label we slap on outcomes we dislike, then your worry about the *type* of causation (active SRM vs. passive warming) is based on a linguistic illusion.
  *   **Does it miss your structural feature?** **Yes.** This reading ignores the *causal topology* you are studying. In climate governance, the difference between injecting aerosols (active intervention) and failing to cut emissions (passive drift) involves distinct physical mechanisms, risk profiles, and liability structures. Dismissing this as "just words" erases the technical reality of the governance problem you are analyzing.

  #### 2. The Normative Irrelevance Reading
  *   **The Claim:** There is a real causal difference between acting and omitting, but this difference carries no intrinsic moral weight. The moral status of an event is determined by other factors (e.g., intent, outcome), rendering the act/omission distinction morally inert.
  *   **Logical Shape:** Moderate Normative. It admits the metaphysical distinction but denies its normative significance. This is the most standard interpretation of the slogan.
  *   **Does it support the dismissal?** **Yes.** It directly argues that even if SRM is causally distinct from inaction, that distinctness does not generate a moral difference. Your colleague is claiming that the "normative gloss" is where the error lies.
  *   **Does it miss your structural feature?** **Partially.** While this addresses the moral equivalence, it may overlook why the causal topology matters for *collective decision-making*. In governance, the distinction often maps onto legitimacy and consent. Active intervention (SRM) requires affirmative authorization, whereas allowing a tipping point may result from bureaucratic inertia. The "normative irrelevance" claim might hold for individual morality but fail to capture the political morality of authorization you are investigating.

  #### 3. The Counterfactual Symmetry Reading
  *   **The Claim:** Both killing and letting die rely on the same logical structure of counterfactual dependence. In both cases, the victim dies because the agent did not do something else (either they didn't refrain from shooting, or they didn't intervene to save). Therefore, the causal topology is functionally identical.
  *   **Logical Shape:** Moderate Structural. It argues that at the level of logical dependence, acts and omissions are symmetrical.
  *   **Does it support the dismissal?** **Yes.** It suggests that your worry rests on a false asymmetry. If both scenarios reduce to "the agent failed to ensure survival," then SRM and inaction are structurally equivalent regarding responsibility.
  *   **Does it miss your structural feature?** **Yes.** This is a common trap in causation literature. While counterfactual dependence might be symmetrical, *causal production* is often not. In climate systems, active geoengineering introduces new causal vectors (e.g., regional drought patterns) that would not exist in the "omission" scenario. Your work on causal topology likely hinges on these specific pathway differences, which counterfactual symmetry glosses over.

  #### 4. The Duty-Bound Agency Reading
  *   **The Claim:** Moral responsibility tracks the capacity to prevent harm, not the mode of causation. If an agent (or collective) has the power to prevent a tipping point, the failure to exercise that power is morally equivalent to actively causing harm. The duty to rescue collapses the act/omission distinction.
  *   **Logical Shape:** Moderate/Strong Normative. It shifts the focus from the *history* of the action to the *obligations* of the agent.
  *   **Does it support the dismissal?** **Yes.** It argues that in the context of climate change, where the capacity to mitigate is known, "letting die" is effectively "killing" because the duty to act was binding.
  *   **Does it miss your structural feature?** **No, this engages best.** This reading acknowledges the gravity of the omission but still equates it to the act. However, it might still miss the *risk imposition* aspect. Active SRM imposes new risks on specific populations (e.g., changing monsoon patterns), whereas omission allows existing risks to unfold. Even if both are morally grave, the *distribution* of liability differs, which is crucial for governance.

  #### 5. The Radical Consequentialist Reading
  *   **The Claim:** Only states of affairs matter. The causal history leading to a state of affairs (whether by act or omission) is morally noise. If the outcome (population harm) is identical, the moral evaluation must be identical.
  *   **Logical Shape:** Radical. It eliminates the distinction by denying the moral relevance of causal history entirely.
  *   **Does it support the dismissal?** **Yes, aggressively.** It renders your worry about causal topology completely moot. If only the final temperature or harm level matters, the method of arrival is irrelevant.
  *   **Does it miss your structural feature?** **Yes, fundamentally.** This view is often incompatible with non-consequentialist concerns central to governance, such as rights, consent, and procedural justice. Your dissertation likely addresses how decisions are made, not just the final climate state. This reading erases the procedural and structural nuances of *how* collective harm is produced, which is the core of your topological analysis.

  ---

  ### Diagnostic Summary

  Your colleague's slogan is most likely operating as **Thesis 2 (Normative Irrelevance)** or **Thesis 4 (Duty-Bound Agency)**. They are attempting to block a potential excuse: the idea that because we merely "allowed" the tipping point, we are less responsible than if we "actively" geoengineered a disaster.

  However, for your specific project on **causal topology in collective decision-making**, these readings are likely too blunt. They treat the act/omission distinction as a binary switch for moral blame, whereas you are treating it as a structural feature of governance systems.

  *   **Where the slogan fails you:** It assumes the moral question is solely about *blame for harm*. Your work seems to suggest the moral question is also about *legitimacy of intervention*. Active SRM involves assuming authority over the atmosphere; allowing a tipping point involves a failure to assume authority. These are politically distinct topologies, even if the body count is the same.
  *   **How to respond:** You can concede the normative parity (Thesis 2) while insisting on the **structural asymmetry**. You might argue: "Even if the moral blame is equivalent, the causal topology dictates different governance remedies. Active intervention requires new institutions of liability; passive allowance requires reforms of inertia. Collapsing the distinction obscures the specific institutional repairs needed for each."

  This allows you to accept their moral point without surrendering your philosophical terrain.
