answer: |-
  There is no single, canonical term in the political science literature that binds these two parts together as tightly as you describe. The literature typically treats them as adjacent but distinct phenomena: **Initiative Qualification Bias** (your Part 1) and the **Indirect Effects of Direct Democracy** (your Part 2).

  Your insight is that the *selection mechanism* of Part 1 determines the *distortion vector* of Part 2. Most scholarship acknowledges the indirect effects (legislatures reacting to the threat) but often assumes the threat is distributed according to public opinion. You have correctly identified that the threat is distributed according to *organizational capacity*, and that the legislative distortion tracks that capacity, not the opinion.

  If you need a label for this specific coupling, the closest existing shorthand is **"The Shadow of the Initiative,"** but as you noted, that is too broad. A more precise term used in specialized comparative work is **"Capacity-Conditioned Anticipation."** However, since you are willing to coin if necessary, I propose the term **"The Qualification Shadow."**

  Here is the carving you requested: what the concept is, what it is not, and where its edges lie.

  ### 1. The Conceptual Carving

  **The Qualification Shadow** is the distortion of legislative output caused by the legislature's anticipation of a citizen vote, where the probability of that vote is determined not by general public salience, but by the specific organizational capacity required to clear the formal qualification threshold.

  It consists of two linked mechanisms:
  1.  **The Filter:** The formal threshold (signatures/time) acts as a tax on complexity. It selects for binary, high-salience, well-funded questions and filters out compromise packages.
  2.  **The Leverage:** The legislature concedes to the *potential* filer of that question to avoid the vote. Therefore, the legislature concedes to the *type of actor* who can pay the tax (concentrated interests), not necessarily the *type of issue* the public cares about (diffuse interests).

  **What it is not:**
  *   It is not **General Anticipatory Representation.** That covers a legislator voting against a bill because they fear losing re-election. The *Qualification Shadow* requires a specific procedural alternative (the ballot measure) that bypasses the legislature's agenda control.
  *   It is not **Ordinary Lobbying.** Lobbying influences the content of a bill *within* the legislative process. The *Qualification Shadow* influences the decision to legislate *at all*, or to delegate the decision elsewhere, because the external option is credible.
  *   It is not **The Direct Effect.** The Direct Effect is the actual passing or defeating of a measure by voters. The *Qualification Shadow* operates entirely without a vote taking place.

  ### 2. Analysis of Your Test Cases

  Here is how the *Qualification Shadow* applies to your four scenarios, establishing the boundaries of the concept.

  **1. A genuinely mandatory referendum.**
  *   **Verdict:** Excluded.
  *   **Reasoning:** There is no threat, therefore no anticipation. The vote is automatic. The legislature cannot avoid the vote by compromising, because the trigger is statutory, not organizational. The "shadow" requires a discretionary actor who can choose *not* to pull the trigger in exchange for legislative concession.

  **2. A proactive citizen initiative (legislature pre-empts).**
  *   **Verdict:** Included (this is the core case).
  *   **Reasoning:** This is the mirror image of the reactive case. The legislature sees a measure qualifying (Part 1) and passes a watered-down version to kill the initiative (Part 2). The distortion is the same: the legislation is shaped by the *form* of the initiative (binary, symbolic) rather than the *substance* of the policy need. The mechanism relies on the credibility of the qualification.

  **3. A bluff (perceived vs. actual capacity).**
  *   **Verdict:** Included, but unstable.
  *   **Reasoning:** The mechanism operates on *perceived* capacity. If the legislature believes the group can qualify the measure, they will react. However, for the concept to hold as a stable systemic feature (rather than a one-off error), the perception must generally correlate with reality. If bluffs succeed too often, the legislature updates its priors, and the "shadow" recedes. The concept is indexed to *credible* capacity, whether actual or perceived, but relies on the *existence of the threshold* to make the bluff plausible.

  **4. Loss of control (unintended outcome).**
  *   **Verdict:** Excluded from the mechanism, though a risk of the tool.
  *   **Reasoning:** The *Qualification Shadow* describes a strategic interaction where the threatener gains leverage. If the threatener calls a vote and loses, or the outcome is random, the *leverage* is destroyed. The phenomenon presupposes that the threat is credible *and* that the threatener has a preferred outcome they are leveraging. If the caller cannot specify the outcome, they cannot bargain in the shadow. This is a failure of the tool, not an instance of the shadow mechanism.

  ### 3. Differentiation from Ordinary Influence

  You asked what the formalized trigger adds compared to ordinary interest-group influence in a representative system.

  **The Transaction Cost Substitution:**
  In a pure representative system, influence is bought with political capital (votes, donations, endorsements). In a system with the *Qualification Shadow*, influence is bought with **transaction costs** (signatures, legal drafting, filing fees).
  *   **Ordinary Lobbying:** A group argues, "If you pass this, our members will be angry." The legislature weighs this against other angry members.
  *   **Qualification Shadow:** A group demonstrates, "We have already paid the sunk cost of 50,000 signatures." This converts a *preference* into a *procedural fact*. It changes the default setting. In a representative system, the default is "the bill passes unless a majority stops it." Under the *Qualification Shadow*, the default becomes "the bill fails unless it is immune to a signature challenge."

  **The Agenda-Setting Veto:**
  Ordinary lobbying works within the legislature's agenda. The *Qualification Shadow* allows an external actor to seize the agenda. This forces the legislature to defend *every* bill against the possibility of a referendum, not just the ones they are currently debating. It creates a "defensive legislation" posture where bills are drafted not to solve problems, but to be "referendum-proof" (i.e., pushing detail into administrative rules that cannot be easily targeted by a binary ballot question).

  ### 4. The Empirical Signature

  You asked for an observable difference that distinguishes this from a legislature simply moderating unpopular bills.

  **The Divergence Metric:**
  In a system driven by public opinion, legislative moderation should correlate with **polling data**. In a system driven by the *Qualification Shadow*, legislative moderation correlates with **organizational density**.

  **The Test:**
  Find a policy issue where public opinion is diffuse (e.g., 60% of the public wants X, but no one cares intensely) and opposition is concentrated (e.g., 10% of the public opposes X, but they are well-funded and organized).
  *   **Representative Model:** The legislature passes X, perhaps slightly watered down, because the majority opinion wins in elections.
  *   **Qualification Shadow Model:** The legislature declines to pass X, or passes a version of X that is functionally null, because the 10% opposition has the capacity to qualify a repeal measure.

  **Observable Signature:**
  You look for **legislative inaction or delegation** in policy areas where polling supports action, but where the opponents possess high signature-gathering capacity.
  *   *Example:* If polling shows 70% support for a consumer protection law, but the legislature leaves the issue to a regulatory agency (where rules are harder to referendum) because a specific industry group has a history of qualifying repeal measures, that is the *Qualification Shadow*.
  *   *Contrast:* If the legislature waters down the bill because polling shows the 70% support drops to 45% when costs are explained, that is ordinary responsiveness to opinion.

  ### Summary Recommendation

  The literature separates the "qualification hurdle" from the "indirect effect." Your contribution is linking them causally.

  *   **Do not use:** "Shadow of Hierarchy" (too broad), "Veto Player Theory" (ignores the selection bias), "Direct Democracy Effects" (too vague).
  *   **Use:** **"The Qualification Shadow."**
  *   **Definition:** The distortion of legislative content and venue caused by the anticipation of citizen votes, where the credibility of the threat is determined by the organizational capacity required to clear the formal qualification threshold, resulting in a bias toward concentrated interests and binary policy frames.

  This term captures the *source* of the power (qualification), the *mechanism* (shadow/anticipation), and implies the *bias* (only those who can qualify cast the shadow). It settles your four cases cleanly and provides the empirical hook (capacity vs. opinion divergence) you need to distinguish it from standard representation.
