  **Description of Event:**
  _________________________________________________________________________
  _________________________________________________________________________
  *(WARNING: Do not use Deprecated Lexicon. If "feels" is written, it will be struck. If the replacement word implies phenomenality, it will also be struck.)*^1

  **Student Signature:** _______________________ **Date:** _______________
  **Parent/Guardian Signature:** _______________ **Date:** _______________
  *(Signature confirms understanding that signing does not validate phenomenal claims, only functional needs.)*

  ^1 *Footnote attributed to the Compliance Subcommittee: Initial protocols struck "seems" and "feels." Replacements such as "registers" and "indicates" were subsequently struck for implying a registrant. Current approved terminology is undergoing third-order redaction. Staff are advised to leave blank spaces where phenomenality would be described to avoid iterative strikethroughs.*
