  # CONCEPTUAL SORTING INSTRUMENT: EXPLOITATION AND ALIENATION

  ### DIAGNOSTIC DECISION TREE

  **START**

  **SPLIT 1: CONCEPTUAL PRIORITY**
  *What is the foundational relationship between the extraction of surplus value and the estrangement of labor?*

  *   **BRANCH A:** Exploitation is conceptually prior to Alienation.
  *   **BRANCH B:** Alienation is conceptually prior to Exploitation.
  *   **BRANCH C:** The two are analytically independent phenomena that co-occur.

  ---

  #### **BRANCH A: EXPLOITATION IS PRIOR**

  **SPLIT 2: SCOPE OF ALIENATION**
  *Does alienation depend essentially on the capitalist commodity-form, or can it persist wherever labor is separated from the means of production?*

  *   **PATH A1:** Alienation is specific to capitalism (Commodity/Wage-Form).
  *   **PATH A2:** Alienation is trans-historical (Persists in bureaucratic/non-market socialism).

      **SPLIT 3: NORMATIVE REDUCIBILITY**
      *Is the wrong of exploitation fully reducible to the harm of alienation, or does it carry a distinct wrong?*

      *   **PATH A1-i (Specific + Reducible):** **UNNAMED.**
          *   *Core Commitment:* Exploitation is the primary mechanism, but its injustice vanishes if capitalist-specific estrangement is cured.
          *   *Awkward Commitment:* Must accept that a non-alienated worker in a capitalist firm suffers no injustice despite surplus extraction.
          *   *Status:* Emptiness explained by **incoherence** (undermines the priority claim).
      *   **PATH A1-ii (Specific + Distinct):** **ANALYTICAL / RATIONAL CHOICE MARXISM.**
          *   *Core Commitment:* Exploitation is an unfair distributive claim on surplus value independent of subjective phenomenological harm.
          *   *Awkward Commitment:* Must accept that a fully satisfied, non-alienated worker is still wronged solely by the accounting of surplus.
      *   **PATH A2-i (Trans-historical + Reducible):** **UNNAMED.**
          *   *Core Commitment:* Exploitation drives history, but its wrongness is entirely contingent on universal human estrangement.
          *   *Awkward Commitment:* Must classify pre-capitalist surplus extraction as non-exploitative if the laborer feels unestranged.
          *   *Status:* Emptiness explained by **mere neglect** (theoretically possible but rarely defended).
      *   **PATH A2-ii (Trans-historical + Distinct):** **ORTHODOX HISTORICAL MATERIALISM.**
          *   *Core Commitment:* Exploitation defines class antagonism across history regardless of worker consciousness or market form.
          *   *Awkward Commitment:* Must classify non-market surplus extraction in state socialism as potentially exploitative despite the abolition of wage labor.

