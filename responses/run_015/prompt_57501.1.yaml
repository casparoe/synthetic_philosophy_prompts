prompt: |-
  Thirty-four years doing scattering experiments at a synchrotron, the last five of them chairing the commitee that hands out beam time, and now I'm two years retired and reading political philosophy at the kitchen table with a coffee and a pencil. Sen's question about equality of what has got under my skin, mostly because I spent a decade answering a version of it in practice without realising I was doing philosophy. I've also been through Dworkin on resources and I honestly can't tell whether the thing we were distributing was a resource or a capability or neither.

  So here is what I actually did, case by case, and how it looks to me now.

  Two proposals, same science, same score from the reviewers. One from a flagship lab with a sample robot, a staff scientist and a travel budget; one from a state college where the PI drives five hours each way and mounts her own samples by hand. I gave the second one more shifts. Still think that was right.

  A proposal with badly designed controls that was going to waste the shift no matter how much time we gave it. I cut it. Cutting it made that group worse off and widened exactly the gap I'd just tried to narrow in the previous case, and I'd do it again tomorrow.

  A famous group that had burned 60 shifts over three years asked for 20 more. The science was excellent and would certainly have produced papers. I ranked it below a decent but unspectacular first-time user.

  A user who couldn't work the overnight shifts alone at the end station — she's a wheelchair user — so we put her in the day blocks and paid for an assistant. She cost the facility more beam time than anybody else that cycle. Obviously correct, no hesitation then or now.

  A group got 16 shifts, their postdoc quit in month two, they used 4. I docked them the following year. Notice that this is punishing people for bad luck, and bad luck is precisely what I compensated in the state college case.

  A year when the machine underperformed and all we could offer everybody was half of what they'd asked for. Perfectly equal, everyone equally badly served. That year was not better than the year before it, and I don't think the extra equality made it better in any way at all.

  Industrial users could buy shifts outright and the money went back into the academic pool. I voted for that every single time, which means I was happy to let money buy more of the thing I'd just spent six cases insisting shouldn't go to whoever could pay for it.

  My own attempt at a principle is this: equalise effective access, not equal hours — give people whatever it takes to convert a shift into science, with a floor below which nobody falls and a cap on how much one group can hold at once. It handles the wheelchair case, the state college, and the 60-shift group nicely. Its seems to blow up on the wasted shifts and the bad controls, because on a conversion story the right response to someone who can't convert is to help them convert, not to cut them off, and I definitely didn't want to fund their training out of my beam time.

  What I want from you: the principle, or the small set of competing ones, that actually delivers these verdicts. State it precisely, clause by clause, and for each clause tell me which case above it's there to handle and what it costs you elsewhere. Where yours and my effective-access version come apart, say so plainly rather than reconciling them politely. Then run it on two situations I never had to decide. First, a proposal for a fully autonomous experiment that drives itself and needs no human on site at all — the per-person metric seems to lose its grip there and I want to know what happens to the cap and the floor. Second, a proposal from a grad student whose PI died halfway through, to finish work that only the dead PI really understood. And be straight with me about which of my verdicts can't survive: I'd rather lose one cleanly than keep all seven with a fudge factor bolted on the side. No reading list, please — I've got one book and a library card that lapsed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Profile:** Retired synchrotron scattering experimentalist (34 years experience), former chair of the beam time allocation committee (5 years). Currently reading political philosophy (Sen, Dworkin) but skeptical of abstract theory vs. practical experience.
      *   **Tone:** Pragmatic, experienced, slightly weary of academic jargon, values clarity and precision over politeness. Wants a "principle" that matches their intuitive verdicts, not a reading list.
      *   **Core Problem:** They distributed a scarce resource (beam time) based on intuitive judgments of fairness/equity that don't neatly fit standard philosophical categories (resources vs. capabilities). They want a formalized principle that captures their specific case judgments, identifies trade-offs, and tests against new scenarios.
      *   **Key Constraint:** "No reading list." "Be straight with me about which of my verdicts can't survive." "State it precisely, clause by clause."

  2.  **Deconstruct the Cases & Verdicts:**
      *   *Case 1 (State College vs. Flagship):* Same science/score, different resources. Verdict: Give more to the disadvantaged (State College). *Rationale:* Compensating for lack of background capacity to ensure equal *outcome* potential.
      *   *Case 2 (Bad Controls):* Science doomed to fail. Verdict: Cut it. *Rationale:* Don't waste scarce resource on zero-yield projects, even if it hurts equality. *Tension:* Worsens the gap, but efficiency/truth trumps equality here.
      *   *Case 3 (Famous Group vs. First-timer):* Famous group hoarding time vs. new blood. Verdict: Prioritize the first-timer. *Rationale:* Diminishing returns/distribution of opportunity, preventing oligopoly.
      *   *Case 4 (Wheelchair User):* Disability accommodation. Verdict: Extra cost/time for assistant/day shifts. *Rationale:* Equality of access requires removing barriers. Cost is irrelevant to fairness.
      *   *Case 5 (Postdoc Quit/Bad Luck):* Group lost time due to personnel loss. Verdict: Dock them next year. *Rationale:* Stewardship of public resource. *Tension:* Punishes bad luck (unlike Case 1), but prevents hoarding/inefficiency.
      *   *Case 6 (Machine Underperformance):* Everyone gets half. Verdict: Equality here is not valuable. *Rationale:* Absolute levels matter more than relative equality.
      *   *Case 7 (Industrial Users):* Money buys shifts, subsidizes academics. Verdict: Allow it. *Rationale:* Utilitarian boost to the total pool trumps anti-commodification principle.

  3.  **Evaluate the User's Proposed Principle ("Equalise Effective Access"):**
      *   *Strengths:* Handles Case 1 (State College), Case 4 (Wheelchair), Case 3 (Cap on hoarding).
      *   *Weaknesses:* Fails Case 2 (Bad Controls) because "helping them convert" implies training/funding, which the user rejected. Fails Case 5 (Bad Luck) because docking them reduces effective access based on luck. Fails Case 7 (Industrial) because it allows purchase of access.
      *   *Diagnosis:* The user is actually balancing *three* competing principles: Capability Enhancement, Stewardship/Efficiency, and Systemic Sustainability. "Effective Access" is too singular.

  4.  **Drafting the Principle (Iterative Process):**
      *   *Attempt 1:* Maximize science output while helping the disadvantaged. (Too vague).
      *   *Attempt 2:* Distribute based on need, but cut bad science. (Better).
      *   *Attempt 3 (The "Stewardship of Opportunity" Framework):* Needs to capture the tension between giving people what they need to succeed and not wasting the beam.
      *   *Refining the Clauses:*
          1.  **The Yield Constraint:** No beam for science that won't work (Case 2).
          2.  **The Conversion Adjustment:** Adjust allocation to equalize the probability of success, not the hours (Case 1, Case 4).
          3.  **The Stewardship Penalty:** If you don't use it, you lose priority (Case 5). *Wait, this conflicts with Case 1.* In Case 1, we compensate for lack of resources. In Case 5, we punish lack of personnel stability. The distinction is *internal* vs. *external* barriers? Or *predictable* vs. *unpredictable*?
          *   *Correction:* In Case 1, the disadvantage is structural (state college vs. flagship). In Case 5, it's operational failure (postdoc quit). The principle needs to distinguish structural disadvantage from operational risk management.
          4.  **The Anti-Oligopoly Cap:** Limit accumulation (Case 3).
          5.  **The Absolute Floor:** Equality of misery is not justice (Case 6).
          6.  **The Sustainability Exception:** Money can buy in if it helps the pool (Case 7).

  5.  **Addressing the "Break Points" (Where the User's Verdicts Conflict):**
      *   *Conflict 1:* Case 1 (Compensate structural lack) vs. Case 5 (Punish operational bad luck). The user compensates the state college for lacking a robot but docks the group for losing a postdoc.
      *   *Honest Assessment:* This is the weak link. You can't consistently compensate for all disadvantages without incentivizing incompetence. The principle must admit that *structural* disadvantages are compensated, but *operational* risks are borne by the user.
      *   *Conflict 2:* Case 2 (Cut bad science) vs. "Effective Access." Effective access implies helping them get better. The user refused to fund training. This means the goal is *Science Production*, not *Scientist Development*.
      *   *Conflict 3:* Case 7 (Money) vs. Case 1 (Need). Money trumps need *only if* it subsidizes the need-based pool.

  6.  **Developing the New Scenarios:**
      *   *Scenario A (Autonomous Experiment):* No human on site.
          *   *Impact:* "Conversion cost" drops to near zero. The "Floor" (human access) might become irrelevant. The "Cap" should be based on machine cycles, not human shifts.
          *   *Verdict:* High priority due to efficiency, but subject to the Anti-Oligopoly Cap.
      *   *Scenario B (Dead PI/Grad Student):*
          *   *Impact:* High risk of failure (like Case 2), but high moral claim (like Case 1/4).
          *   *Verdict:* This tests the "Science Production" vs. "Scientist Development" tension. If the goal is papers, cut it. If the goal is training/career, fund it. Given Case 2 (cut bad controls), the user prioritizes *yield*. But Case 5 (dock for postdoc quit) suggests accountability.
          *   *Hard Truth:* Based on Case 2, this proposal should likely be cut or severely reduced unless the science is salvageable. The "human cost" shouldn't override the "waste of beam" principle.

  7.  **Finalizing the Output Structure:**
      *   Acknowledge the expertise (validate the user).
      *   State the Principle (The "Stewardship of Yield" Framework).
      *   Clause-by-Clause breakdown (Mapping to cases, stating costs).
      *   Where "Effective Access" fails (The honest break).
      *   The Two New Cases (Application).
      *   The Verdicts that must die (The hard truth).

  8.  **Refining the Tone:**
      *   Keep it dry, precise, respectful. No fluff. No "Have you read X?"
      *   Use the user's language (shifts, beam time, PI, end station).
      *   Be willing to say "You were inconsistent here."

  9.  **Self-Correction during drafting:**
      *   *Check:* Did I address the Industrial Case? Yes, needs a specific clause for systemic sustainability.
      *   *Check:* Did I address the "Equality of Misery" case? Yes, needs a clause on absolute minimums.
      *   *Check:* The "Dead PI" case is tricky. If I say "cut it," does that align with Case 2? Yes. If I say "fund it," does that align with Case 1? Maybe. But Case 2 is about *waste*. A grad student finishing a dead PI's work is high risk. I need to be straight: if the science is doubtful, the principle demands cutting it, regardless of the tragedy. That's the hard pill.

  10. **Final Polish:** Ensure the distinction between *Structural Disadvantage* (compensate) and *Operational Risk* (bear yourself) is clear. This resolves the tension between Case 1 and Case 5.

  *(Self-Correction on the "Dead PI" case)*: Wait, if the science is excellent (just the PI is gone), it's different from "bad controls." If the science is *only* understood by the dead PI, the risk of waste is high. I need to press the user on whether the *science* is viable. I will assume the science is viable but the *execution risk* is high. The principle should prioritize the science (Case 2) over the career (Case 5).

  Let's write the response.cw
answer: |-
  You are not doing political philosophy; you are doing triage under constraints. The reason Sen and Dworkin feel slippery is that they are trying to build a universal theory of justice, whereas you were running a utility with a fixed supply and a demand that exceeded it by an order of magnitude. Your intuitions are consistent, but they are not derived from a single principle of equality. They are derived from a hierarchy of three competing goods: **Yield**, **Opportunity**, and **Sustainability**.

  Your "Effective Access" principle fails because it assumes the goal is to maximize the *scientist's* potential. Your actual verdicts show the goal was to maximize the *facility's* scientific output, subject to fairness constraints.

  Here is the principle that delivers your verdicts, stated precisely.

  ### The Principle of Stewardship of Yield

  **Clause 1: The Yield Constraint**
  *Beam time shall not be allocated to proposals where the probability of generating valid scientific data is negligible, regardless of the applicant's disadvantage.*
  *   **Handles:** Case 2 (Bad Controls).
  *   **Cost:** It accepts that inequality will widen when the disadvantaged group is also the one with higher operational risk. It prioritizes the integrity of the data over the development of the group.
  *   **Conflict:** This is where your "Effective Access" view breaks. Effective access says "give them training so they can convert." This clause says "we are not a training facility; we are a data factory."

  **Clause 2: The Structural Adjustment**
  *Allocation shall be adjusted to compensate for structural, institutional disadvantages that affect the ability to convert beam time into data, provided the science is sound.*
  *   **Handles:** Case 1 (State College vs. Flagship) and Case 4 (Wheelchair User).
  *   **Cost:** It requires the committee to make sociological judgments about labs rather than just scientific judgments about proposals. It introduces inefficiency (giving more hours to the slower lab) to achieve parity of outcome.
  *   **Distinction:** Note the difference between this and Clause 3. This covers *structural* lack (robots, accessibility), not *operational* luck.

  **Clause 3: The Utilization Penalty**
  *Allocated time that is not used due to operational failures or personnel turnover shall result in reduced priority in subsequent cycles.*
  *   **Handles:** Case 5 (Postdoc Quit).
  *   **Cost:** It punishes bad luck. It treats the beam time as a public trust that cannot be held hostage by a group's internal instability.
  *   **Tension:** This directly contradicts the spirit of Clause 2. Clause 2 says "we compensate you for lacking a robot." Clause 3 says "we punish you for losing a postdoc." The distinction is **predictability**. A lack of a robot is a known, static variable. A postdoc quitting is a dynamic risk management failure. The principle forces the user to bear operational risk, while the facility bears structural inequity.

  **Clause 4: The Anti-Oligopoly Cap**
  *No single group shall accumulate a share of total beam time that diminishes the opportunity for new entrants to establish a track record, regardless of the quality of the incumbent's science.*
  *   **Handles:** Case 3 (Famous Group vs. First-timer).
  *   **Cost:** It sacrifices high-certainty science (the famous group) for the sake of ecosystem diversity. It accepts a marginal decrease in total high-impact papers to prevent the formation of a beam-time aristocracy.

  **Clause 5: The Absolute Floor**
  *Equality of distribution is not a virtue when the total available resource falls below the threshold required for meaningful scientific work.*
  *   **Handles:** Case 6 (Machine Underperformance).
  *   **Cost:** It admits that "fairness" is contingent on abundance. When the pie is too small, equal slices are worthless. The principle offers no solution here other than to acknowledge the failure of the system.

  **Clause 6: The Sustainability Exception**
  *Market mechanisms may be employed to allocate a portion of the resource if and only if the revenue generated is strictly reinvested to increase the pool available for non-market allocation.*
  *   **Handles:** Case 7 (Industrial Users).
  *   **Cost:** It violates the anti-commodification intuition. It admits that money is a valid allocator *only* as a means to subsidize need. It creates a two-tier system where wealth buys access, justified only by the trickle-down to the academic pool.

  ---

  ### Where "Effective Access" Blows Up

  You noted that your principle blows up on the wasted shifts (Case 2) and the bad luck (Case 5). Here is the plain truth:

  1.  **On Waste:** Your "Effective Access" view implies the facility has a duty to bring the user up to speed. Your verdict (cutting the beam time) proves you believe the facility has a duty to the *science*, not the *scientist*. You are distributing opportunities for discovery, not opportunities for learning. If they can't discover, they don't get the resource.
  2.  **On Luck:** You compensate for *institutional* bad luck (being at a state college) but punish *project* bad luck (postdoc quitting). This is inconsistent if the goal is pure equality. It is consistent only if the goal is **Risk Management**. The facility insures against structural inequality but refuses to insure against project management failure.

  ---

  ### Running the Principle on New Cases

  **Situation 1: The Autonomous Experiment**
  *A proposal for a fully autonomous experiment that drives itself and needs no human on site at all.*

  *   **Application:**
      *   **Clause 1 (Yield):** If the code works, yield is likely high.
      *   **Clause 2 (Structural):** No conversion costs (no travel, no shifts).
      *   **Clause 4 (Cap):** This is the danger zone. An autonomous rig could consume 100% of the cycles.
  *   **Verdict:** The **Anti-Oligopoly Cap** must shift from "shifts per group" to "cycles per institution." You cannot let one autonomous setup eat the machine, even if it's efficient. However, because the "conversion cost" is near zero, this proposal ranks higher than human-dependent ones under **Clause 2**.
  *   **The Break:** The "Floor" (Clause 5) becomes irrelevant. There is no human access to protect. The principle shifts from "Equal Opportunity for Scientists" to "Equal Opportunity for Institutions." If the autonomous rig belongs to a flagship lab, **Clause 4** triggers hard. If it belongs to a state college, **Clause 2** boosts it.

  **Situation 2: The Dead PI**
  *A proposal from a grad student whose PI died halfway through, to finish work that only the dead PI really understood.*

  *   **Application:**
      *   **Clause 1 (Yield):** High risk. If only the dead PI understood it, the probability of valid data is low.
      *   **Clause 2 (Structural):** The student is structurally disadvantaged by the death.
      *   **Clause 3 (Utilization):** High risk of non-utilization.
  *   **Verdict:** This is the hardest case. **Clause 1** demands you cut it. **Clause 2** begs you to fund it.
  *   **The Hard Truth:** Based on your history (specifically Case 2), **Clause 1 wins.** You cut the bad controls because they would waste the shift. This project risks wasting the shift. The tragedy of the PI does not obligate the synchrotron to burn public beam time on high-risk salvage operations unless the *science* is demonstrably viable without the PI.
  *   **Modification:** You could allocate a "pilot shift" (minimal cost) to test viability. If data looks good, continue. If not, cut. This satisfies Clause 1 without violating Clause 2 entirely.

  ---

  ### The Verdicts That Cannot Survive

  You asked me to be straight about which of your verdicts can't survive scrutiny under a coherent system.

  **1. The Industrial Exception (Case 7) vs. The State College (Case 1)**
  You cannot logically hold that money should *not* determine access (Case 1) while simultaneously allowing money to determine access (Case 7), even if the revenue is recycled.
  *   **Why:** If the industrial users buy shifts, they are displacing academic shifts that *would have existed* if the machine capacity were higher. You are arguing that the *marginal* dollar buys fairness.
  *   **The Loss:** You must admit that Case 7 is a pragmatic compromise, not a matter of justice. It survives only as long as the academic users tolerate the two-tier system. If the industrial users start demanding priority scheduling (which they usually do), Clause 6 eats Clause 2. You have to accept that you allowed a market to exist in a public good.

  **2. The Bad Luck Penalty (Case 5)**
  You compensated the State College for being poor (structural), but docked the group for losing a postdoc (contingent).
  *   **Why:** In both cases, the group's ability to convert beam time was reduced by factors partly outside their immediate control. A state college doesn't choose to be underfunded; a postdoc doesn't choose to quit (always).
  *   **The Loss:** To be consistent, you must either **fund training/staffing buffers** (which you refused in Case 2) or **accept that structural disadvantage is also a risk the user bears**. You chose the latter for the postdoc. You must admit that your generosity in Case 1 was an exception for *institutional* prestige, not a rule for *misfortune*. If the State College PI had gotten sick, would you have docked them too? If yes, Case 1 is less about equity and more about institutional affirmative action.

  **3. The "Equality of Misery" (Case 6)**
  You said the year everyone got half time was not better than the year before.
  *   **Why:** This admits that your metric is **Absolute Capability**, not Relative Equality.
  *   **The Loss:** This undermines the entire "Equality of What" debate. You don't care about equality. You care about *thresholds*. If everyone is below the threshold, equality is meaningless. This means your principle is actually **Sufficientarianism** (enough for everyone to do science) with a **Prioritarian** twist (help the disadvantaged get to the threshold). It is not Egalitarian.

  ### Summary
  You were not an Egalitarian. You were a **Sufficientarian Prioritarian with a Utilitarian Safety Valve**.
  *   **Sufficientarian:** Everyone needs enough time to do science (Case 6).
  *   **Prioritarian:** Those below the threshold due to structural issues get help (Case 1, 4).
  *   **Utilitarian Safety Valve:** If the science is bad, cut it (Case 2). If money helps the pool, take it (Case 7).

  The friction you feel is because you tried to apply Egalitarian logic to a Sufficientarian system. Drop the equality metric. Measure against the threshold of viable science. Everything else is just logistics.
