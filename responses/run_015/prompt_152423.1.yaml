      *   *Bicycle:* The task/environment system.
      *   *Physics Manual:* Propositional knowledge (KT).
      *   *Fall:* Failure of application/execution.
      *   *Years of Practice:* The process of habituation/proceduralization.
      *   *Fluent Performance:* The manifestation of KH.

  4.  **Identifying Points of Breakdown (The "Audit"):**
