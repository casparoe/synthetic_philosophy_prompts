      *   *Intellectualist Counter (Stanley & Williamson, etc.):* KH is a species of KT (knowing that w is a way to ride). The inability to ride despite knowing physics is due to lacking specific propositional knowledge (e.g., proprioceptive feedback loops), not a different *kind* of knowledge.
      *   *User's Insight:* The interweaving of explicit and tacit knowledge in physics experiments suggests a spectrum or integration, not a dichotomy.

  3.  **Drafting the Correspondence Table:**
