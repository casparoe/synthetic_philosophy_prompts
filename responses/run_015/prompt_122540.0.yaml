answer: |-
  **Proposal Title:** Beyond Understanding: Moral Responsiveness and the Limits of Testimonial Transmission

  **1. The Research Question**
  Standard debates in moral testimony ask whether deference yields *knowledge* (the optimist claim) or *understanding* (the pessimist claim). This thesis asks a more specific question: **Does moral testimony transmit *moral responsiveness*?**

  By "moral responsiveness," I mean a dispositional capacity to notice morally salient features in novel situations and to be moved by them without further prompting—a skill-like competence distinct from both true belief and the propositional grasp of reasons ("understanding-why"). The thesis will argue that the intuitive unease regarding moral deference is best explained not by a lack of understanding, but by the failure of testimony to transmit this responsiveness. The determinate answer sought is whether responsiveness is a necessary condition for full moral standing in a belief, and if so, whether it is inherently non-transmissible via testimony.

  **2. Candidate Goods and Sources**
  The thesis will evaluate three candidate "goods" that testimony might confer, crossed with two types of source reliability.

  *   **Candidate Goods:**
      1.  **True Belief/Knowledge:** The standard optimist target. (Does the believer hold a true, justified moral belief?)
      2.  **Understanding-Why:** The standard pessimist target. (Does the believer grasp the supporting reasons?)
      3.  **Moral Responsiveness:** The proposed target. (Is the believer disposed to detect and react to similar moral features independently in the future?)

  *   **Source Types:**
      1.  **Epistemic Authority:** A source known to be reliable (e.g., a moral expert).
      2.  **Opaque Authority:** A source that yields verdicts without accessible reasoning (e.g., an AI system or a tradition).

  *   **The Gap:** Optimists argue Knowledge is sufficient for moral worth. Pessimists argue Understanding is required. Both assume the deficit in deference is cognitive (lack of reasons). This project argues the deficit is perceptual/dispositional (lack of sensitivity). One can have Understanding without Responsiveness (knowing the theory but missing the cruelty in front of you). If testimony transmits Understanding but not Responsiveness, the pessimist is right about the *deficit* but wrong about the *diagnosis*.

  **3. Why Existing Positions Leave This Open**
  The current debate is stalled because it treats moral cognition as primarily propositional. The optimist claims that if a source is reliable, the recipient inherits the epistemic status. The pessimist claims that moral worth requires grasping the *reasons* for the claim. However, neither accounts for cases where an agent grasps the reasons but lacks the sensitivity to apply them, or lacks the reasons but retains the sensitivity.

  For example, a student might memorize a utilitarian calculus (Understanding) but fail to notice when a joke causes pain (lack of Responsiveness). Conversely, a child might recoil at cruelty (Responsiveness) without being able to articulate why (lack of Understanding). Existing frameworks force us to say one of these agents is fully morally competent and the other is not, based on intellectual grasp. By isolating Responsiveness as a distinct good, we can explain why deference feels "hollow" even when reasons are provided: the testimony supplies the conclusion and the rationale, but not the *sensory-perceptual tuning* required to navigate the moral landscape independently.

  **4. Distinction from "Can Virtue Be Taught?"**
  My supervisor has suggested this is merely the ancient question of whether virtue can be taught. It is not. That debate concerns *character formation* over time via habituation, example, and practice (diachronic development). The moral testimony debate concerns the *epistemic status of a belief acquired via assertion* at a specific moment (synchronic transmission).

  Even if virtue *can* be taught through long-term mentorship, it does not follow that *testimony* is a valid vehicle for that teaching. One might accept that moral competence is acquirable (virtue is teachable) while maintaining that *deference* is a defective mechanism for that acquisition. This thesis is not asking if moral competence is possible; it is asking if the specific mechanism of "taking someone's word" bypasses the necessary acquisition of responsiveness. Conflating the two obscures the specific epistemic mechanism being tested.

  **5. Methodology and Case Studies (9-Month Schedule)**
  The work will be conceptual analysis driven by four specific test cases. These cases are designed to isolate Responsiveness from Understanding and Knowledge.

  *   **Months 1–3: Conceptual Groundwork**
      *   Define "Moral Responsiveness" precisely. Distinguish it from motivation (conativism) and perception (intuitionism). Frame it as a *counterfactual sensitivity*: "If the situation were slightly different, would the agent still register the moral demand?"
      *   Draft Chapter 1: The limits of the Knowledge/Understanding dichotomy.

  *   **Months 4–6: The Case Studies (Chapter 2 & 3)**
      *   **Case A: Reframing Testimony.** ("That wasn't a joke, that was cruel.")
          *   *Function:* Tests if testimony can *create* responsiveness or merely report it. If the hearer accepts the claim but still laughs next time, responsiveness was not transmitted.
      *   **Case B: Group/Tradition Testimony.** ("We do not do this.")
          *   *Function:* Tests if social embedding substitutes for individual responsiveness. Does adhering to a tradition count as responsiveness if the individual cannot detect the violation without the rule?
      *   **Case C: Intra-Personal Testimony.** (Your past self's verdict, reasons forgotten.)
          *   *Function:* Controls for social authority. If you defer to your past self's conclusion without the original sensitivity, do you feel the same "hollowness"? This isolates the *memory/testimony* mechanism from the *social* mechanism.
      *   **Case D: Opaque AI Verdict.** (System says "Wrong" + explanation too complex to parse.)
          *   *Function:* The cleanest test. You have the verdict and a formal explanation, but zero human-like sensitivity. If this feels worse than human deference, it suggests Responsiveness requires a shared cognitive architecture, not just reasons.

  *   **Months 7–9: Synthesis and Writing (Chapter 4 & Conclusion)**
      *   Evaluate the cases against the three Candidate Goods.
      *   Draft conclusion: Is Responsiveness a necessary condition for moral worth?
      *   Final revision and formatting.

  **6. Possible Conclusions**
  1.  **The Distinctness Thesis:** Responsiveness is distinct from Understanding and is *not* transmissible via testimony. (Result: A new form of pessimism. Deference yields knowledge and understanding, but leaves the agent morally "disabled" in new contexts.)
  2.  **The Transmission Thesis:** Responsiveness *can* be transmitted, but only through specific types of testimony (e.g., Reframing) that train attention rather than assert facts. (Result: A qualified optimism. Testimony is fine if it functions as training, not just assertion.)
  3.  **The Collapse Thesis:** Responsiveness is not distinct; it is merely Understanding applied over time. (Result: The project fails, reverting to standard pessimism.)

  **Decision Criteria:** The choice between these depends on the **Intra-Personal Case**. If deferring to your past self feels epistemically different than deferring to an expert, the deficit is likely social/authority-based. If it feels the *same* (i.e., you feel you lack a grip on the issue in both cases), the deficit is internal to the mechanism of testimony itself, supporting the Distinctness Thesis.

  **7. Risk Assessment and Failure Modes**
  *   **Conceptual Collapse:** The highest risk is that "Responsiveness" cannot be distinguished from "Understanding-Why." If every instance of noticing a moral feature can be described as "grasping a reason," the thesis collapses into standard pessimism. *Mitigation:* I will focus on *non-propositional* cues (tone, context, salience) that resist reduction to "reasons."
  *   **Scope Creep:** The AI case risks turning into a philosophy of technology paper. *Mitigation:* The AI is used strictly as a control for "reasons without sensitivity." I will not analyze AI ethics, only the epistemic status of the user accepting the AI's verdict.
  *   **The "Too Big" Problem:** 15k words is tight for four case studies. *Mitigation:* If space runs short, Case B (Tradition) will be cut. It is the least essential for isolating the cognitive mechanism. Case D (AI) and Case A (Reframing) are the priority.
  *   **Falsification:** The thesis is falsified if I find a clear case where an agent acquires full moral responsiveness solely via a single testimonial act without any accompanying practice or perceptual training. If "That was cruel" can instantly make someone sensitive to cruelty in the way that experience does, the "skill" model is wrong.

  **8. Feasibility**
  The timeline allows 3 months for the literature/definition phase (concurrent with the qualifying exam prep, as the topics overlap) and 6 months for writing. The case studies are thought experiments, requiring no empirical data collection, which fits the one-year constraint. The word count (15k) allows for roughly 3,000 words per case study plus introduction and conclusion, which is sufficient for conceptual analysis provided I avoid historical exegesis.
