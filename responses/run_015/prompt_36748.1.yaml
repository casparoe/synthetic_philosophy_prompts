answer: |-
  1. Hardin's metaphor relies on finite capacity forcing exclusion, which the film initially mirrors as the survivors debate rationing water and space against Willi's presence. However, the film immediately undermines this by showing that exclusion based on utility fails when the most capable survivor is the enemy who caused the crisis.
  2. Steinbeck's script emphasizes collective survival through shared labor, like Kovac rationing food and the group amputating Gus's leg, which contradicts Hardin's individualistic triage. Hardin's ethics cannot account for this solidarity because his model assumes strangers competing for resources rather than a community building shared value.
  3. At times the narrative devolves into survival melodrama where plot convenience overrides ethical consistency, such as the convenient storms or supplies washing up. This suggests Hitchcock was sometimes more interested in tension than constructing a rigid philosophical proof about capacity.
  4. The rescue of the second German sailor wrecks the Hardin reading because the crew, having learned from Willi, chooses compassion over capacity calculations despite the risk. While the repetition suggests a cyclical trap to your friend, the film shows evolution: the first rescue was naive, while the second is a conscious moral choice that rejects letting people drown.
  5. Ultimately, the film refutes Hardin by demonstrating that ethical obligations extend beyond mere carrying capacity to include justice and shared humanity. Hardin's lifeboat is a static trap, but Hitchcock's boat is a crucible that forges a new moral community capable of saving even the enemy.
