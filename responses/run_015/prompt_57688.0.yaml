      2.  **The Outsider Check:** Could a neutral person verify that outcome without needing to trust you?
      3.  **The Backup Plan:** If the Stop Signal happens, what do you blame? Is that blame written down *now*?
      4.  **The Bonus:** Does fixing the problem teach us something new, or just explain away the failure?

  4.  **Addressing the "Steamroll" Constraint:**
      *   The procedure needs voting checkpoints.
      *   The non-scientists need to feel empowered to say "I don't understand this explanation."
      *   Explicitly mark where judgment is required.

