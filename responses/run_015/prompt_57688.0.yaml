          *   *Actually, looking closer:* The user says "I can't see what result would count against their hypothesis." This implies the hypothesis is the weak link. The procedure should catch that. But the user *wants* to fund them. So the procedure must allow funding non-science community projects *as long as they don't pretend to be rigorous science.* Or, we refine the hypothesis.
          *   *Better approach:* The procedure evaluates the *logic*. If the logic fails, the panel votes on *merit* despite the logic. The procedure informs the vote, doesn't dictate it.
