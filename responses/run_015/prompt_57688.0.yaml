      *Decision:* The procedure generates a "Reliability Score." If the score is low, the grant requires a supermajority to pass. This balances the power.
      *Actually, let's stick to the prompt:* "where it stops at 'no'." I will define a "Hard No" (pseudoscience) vs. "Soft No" (weak method).
      *Hard No:* Fails Q1 or Q2. (Cannot be tested or verified).
      *Soft No:* Fails Q3 or Q4. (Method is shaky, but maybe worth the risk).
