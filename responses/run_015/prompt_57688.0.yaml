  2.  **Deconstruct the Philosophy:**
      *   *Popper:* Falsifiability. Can you imagine evidence that would prove this wrong?
      *   *Duhem-Quine:* No hypothesis is tested in isolation; it's tested with auxiliary assumptions. If the test fails, you can blame the assumptions.
      *   *Lakatos:* Research programmes have a "hard core" (protected) and a "protective belt" (adjustable). *Ad hoc* adjustments save the core but don't predict new things. Progressive shifts predict new things.
