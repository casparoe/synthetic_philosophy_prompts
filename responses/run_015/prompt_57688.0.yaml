      *   *Step 2: The "Stranger" Test (Intersubjectivity).* Can an outsider verify this without believing your theory first?
      *   *Step 3: The "Excuse" Test (Ad Hocness).* If things go wrong, is the explanation built-in beforehand or made up later? Does fixing it help predict something *new*?
