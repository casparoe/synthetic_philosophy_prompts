      *   *Addressing the "Hard Middle" (Duhem-Quine):* This is Step 3. Are the excuses written down *beforehand*?
      *   *Addressing the "Ad Hoc" (Lakatos):* This is Step 4. Does the fix predict new things?

      *   *Case B (Swans) Nuance:* The hypothesis "Lake is getting healthier" is the problem. Counting swans is fine. The link is the weak auxiliary assumption. The procedure should catch that the *link* is untested.
      *   *Solution for Swans:* The procedure flags the link as weak. The panel can fund the *counting* but require they drop the *health claim* in the final report, or treat it as "Observation" not "Conclusion." This satisfies the limnologist's rigor and the desire to help the kids.

  7.  **Final Review against Constraints:**
      *   15 minutes? Yes, 4 questions.
      *   No jargon? Yes.
      *   Judgment calls marked? Yes, in the "Meta" section.
