      *   *Refining the "Steamroll" aspect:* Each step ends with a show of hands. If majority says "No," the application moves to a "High Risk" pile. It doesn't automatically die, but it requires a higher bar for approval (e.g., 5/6 votes instead of 4/6). This protects the scientists from being ignored but prevents them from vetoing everything unilaterally.
      *   *Actually, simpler:* The procedure produces a "Risk Rating." The vote is still democratic. The procedure just ensures the discussion is structured.
      *   *Best interpretation:* The user wants to know *where it stops at no*. So, if it fails Q1 or Q2, it's a "No" on the *science* merit. But since it's a community grant, maybe it can still pass on *community* merit. I will structure it as a "Science Reliability Check." If it fails, the panel must acknowledge they are funding *art/hope/work*, not *evidence*. This empowers the non-scientists to make that distinction consciously.

      *   *Let's tighten the "Stop at No":* For the purpose of *scientific validity*, it stops. For the *grant*, the panel decides if valid science is required.
