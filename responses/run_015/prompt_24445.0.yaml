      Good morning. We are gathered on land that knew him better than most. For sixty years, my grandfather walked these pastures. He was a man who could read the weather a week out by the shape of a cloud, who taught me how to mend a fence until it held against any storm. He raised three children on this soil, and he raised us grandchildren with the same steady hand.

      To speak honestly about him is to speak honestly about his work. Ranching is not a picturesque hobby; it is a partnership with life and death. I stand here loving him deeply, and I also stand here believing that we often underweight the suffering of the animals who sustained us. I do not believe a calf's pain matters less simply because it cannot speak our language. I do not believe what he did was harmless.

