answer: |-
  # Desiderata for an Adequate Theory of the Meta-Problem of Consciousness

  ## 1. Definition and Scope
  The meta-problem of consciousness, as distinct from the 'hard problem', is not the task of explaining why phenomenal experience exists, but rather the task of explaining why we *think* it exists in a way that presents a hard problem. An adequate theory must explain the cognitive, neural, and social mechanisms that generate problem intuitions—specifically the intuition that there is an explanatory gap between physical processes and subjective experience. This must be achieved without necessarily committing to the ontological claims of substance dualism, nor dismissing the intuitions as mere confusion without remainder.

  ## 2. Phenomena to be Accounted For
  A robust theory must provide a causal or functional account of the following specific phenomena. For each, the motivating case illustrates why a simpler explanation fails.

  ### 2.1. The Recalcitrance of Intuition Among Physicalists
  *   **Phenomenon:** The intuition that consciousness is non-physical or inexplicable persists even among thinkers who explicitly reject dualism and endorse a physicalist ontology.
  *   **Motivating Case:** Consider a trained materialist philosopher who accepts the causal closure of the physical. Despite this theoretical commitment, when presented with a 'philosophical zombie' thought experiment, they still report a vivid intuition that such a being is conceivable. A theory that attributes the gap solely to a lack of scientific knowledge fails here, as the intuition survives the acquisition of that knowledge.

  ### 2.2. The Asymmetry of Functionalisation
  *   **Phenomenon:** There is a marked disparity in our willingness to accept functional or computational accounts of cognitive states (e.g., memory, attention) compared to phenomenal states (e.g., the redness of red, the hurt of pain).
  *   **Motivating Case:** One can readily accept that a robot could 'believe' it is raining if it processes weather data appropriately. However, the same individual may resist the claim that a robot could 'feel' pain, even if its nociceptive processing is identical to a human's. The theory must explain why phenomenal concepts resist functional reduction in a way that cognitive concepts do not.

  ### 2.3. Cross-Cultural and Historical Stability
  *   **Phenomenon:** The intuition that there is a 'what it is like' aspect to experience appears across diverse cultural and historical contexts, not limited to contemporary analytic philosophy.
  *   **Motivating Case:** Distinctions resembling the phenomenal/physical gap appear in Buddhist Abhidharma philosophy (e.g., the distinction between *rupa* and *vedana*) and in various folk psychologies unrelated to Cartesian dualism. A theory that relies solely on specific Western linguistic structures or Cartesian education cannot account for this stability.

  ## 3. Distinctions to be Preserved
  An adequate theory must maintain conceptual clarity between the following pairs. Conflating them risks category errors.

  ### 3.1. Cognitive Origin vs. Structural Irreducibility
  The theory must distinguish between explaining the *genealogy* of phenomenal concepts (how we acquire them) and explaining why those concepts *appear* structurally irreducible.
  *   **Requirement:** It is insufficient to show that we learn the concept of 'pain' via introspection; the theory must also explain why introspection presents the concept as simple and unanalysable. Explaining the source of the concept does not automatically explain the *mode of presentation* that generates the gap.

  ### 3.2. Cognitive Illusion vs. Architectural Feature
  The theory must distinguish between treating the gap as a *mistake* (an illusion to be dispelled) and treating it as a *tracking mechanism* (a reliable signal of the brain's informational architecture).
  *   **Requirement:** An 'illusionist' account claims the gap arises from a cognitive error (e.g., a failure of introspection). A 'structural' account claims the gap arises because the brain's self-modelling systems genuinely lack access to certain physical data. The theory must specify whether the intuition is false (there is no gap) or accurate regarding the system's limits (there is an epistemic gap, though not an ontological one).

  ## 4. Hard Constraints
  The theory must operate within specific boundaries. These are divided into non-negotiable constraints (required for naturalistic coherence) and camp-specific preferences (which vary by metaphysical commitment).

  ### 4.1. Non-Negotiable Constraints
  *   **Causal Closure:** The theory must be consistent with the absence of detectable non-physical causal interaction. The reports and intuitions about consciousness are physical events caused by prior physical states. No appeal to non-physical qualia causing physical judgements is permitted.
  *   **Data Preservation:** The theory must accommodate the fact that the intuition survives explicit philosophical training. A theory that predicts the intuition should vanish upon understanding neuroscience is empirically falsified by the persistence of the hard problem among experts.

  ### 4.2. Camp-Specific Preferences
  *   **Ontological Commitment:** Whether the theory implies that phenomenal consciousness *is* physical (type-A physicalism), *is not* physical but is physically realised (type-B physicalism), or *does not exist* as commonly conceived (illusionism) is a matter of metaphysical preference, not a constraint on the meta-problem theory itself.
  *   **Veridicality:** Whether the intuition of the gap is taken to be veridical (tracking a real epistemic limit) or non-veridical (a cognitive bug) is a theoretical output, not an input constraint.

  ## 5. Jointly Unsatisfiable Desiderata
  There is a significant tension between two plausible requirements for a meta-problem theory. It is suspected that the following pair may be jointly unsatisfiable:

  1.  **Complete Debunking:** The theory demonstrates that the intuition of the explanatory gap is entirely a cognitive error with no veridical content.
  2.  **Phenomenological Fidelity:** The theory preserves the normative authority of first-person reports (i.e., that subjects are the ultimate arbiters of what their experience is like).

  **Analysis:** If the intuition of the gap is a complete error (1), then first-person reports regarding the nature of that experience are systematically misleading. This undermines the authority of the very data (first-person reports) used to construct the theory (2). A theory that fully debunks the intuition risks self-undermining by invalidating the introspective evidence required to posit the meta-problem in the first place.

  ## 6. The Exclusionary Constraint
  The single requirement that does the most to rule out existing approaches is **The Recalcitrance of Intuition Among Physicalists** (Section 2.1).

  Many existing cognitive theories of consciousness (e.g., simple ignorance hypotheses or 'folk-psychology' error theories) posit that the hard problem arises from a lack of scientific understanding. These theories predict that as one's understanding of neural mechanisms improves, the intuition of a gap should diminish. The fact that the intuition persists robustly among neuroscientists and philosophers of mind who possess this knowledge falsifies simple ignorance models. Any adequate theory must explain why the mechanism generating the gap is *cognitively impenetrable* to theoretical knowledge.

  ## 7. Settled vs. Contested Claims
  To maintain neutrality, the following distinction is drawn between what is generally accepted in the field and what remains a matter of active dispute.

  ### 7.1. Settled Among Specialists
  *   **Existence of Intuitions:** It is settled that humans possess robust, pre-theoretical intuitions regarding the distinctness of mental and physical states.
  *   **Physical Causation:** It is settled within the scientific community that behavioural reports of consciousness are caused by physical brain processes.
  *   **Distinctness of Problems:** It is widely accepted that the meta-problem (explaining the intuition) is conceptually distinct from the hard problem (explaining the experience), even if solving one might aid the other.

  ### 7.2. Genuinely Contested
  *   **Implication for the Hard Problem:** It is contested whether solving the meta-problem dissolves the hard problem. Some argue (e.g., Chalmers) that the meta-problem is neutral on the hard problem; others argue (e.g., certain illusionists) that explaining the intuition is sufficient to dismiss the hard problem.
  *   **Nature of Phenomenal Concepts:** It is contested whether the gap arises from the unique nature of 'phenomenal concepts' (the Conceptual Account) or from the nature of the experience itself (the Phenomenal Account).
  *   **Universality:** While there is cross-cultural evidence, it is contested whether the 'explanatory gap' is a universal cognitive feature or a product of specific linguistic and cultural frameworks.

  ***

  *Note: This specification adheres to British English orthography and conventions. It avoids presenting illusionism, dualism, or physicalism as the consensus view, treating them instead as competing frameworks within which the meta-problem must be solved.*
