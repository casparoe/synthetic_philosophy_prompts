      *   **Move 1 (Mara):** Hofstadter's model (from *Metamagical Themas* or *GEB* context) suggests creativity involves varying parameters of a conceptual structure. Applying this to moral dilemmas (like trolley problems) is plausible. Creativity often involves varying constraints.
