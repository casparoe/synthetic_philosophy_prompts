answer: |-
  **MEMORANDUM**

  **TO:** University Committee on Professional Conduct and Research Integrity
  **FROM:** [Your Name/Committee Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Appeal of Doctoral Candidate [Student ID Redacted] Regarding Protocol Breach 2023-RC-04

  **DECISION**

  The Committee recommends **modifying the proposed sanction**. We find that the doctoral candidate did violate the approved data-retention protocol, warranting a formal finding of non-compliance. However, we recommend waiving the proposed suspension or termination penalty contingent upon the immediate, secure transfer of the contested recordings to the University Compliance Office. The candidate shall receive a **Formal Warning** placed in her file, which will be expunged upon successful completion of her degree, provided no further breaches occur.

  **Implementation Timeframe:** The transfer of data must be completed within **fourteen (14) calendar days** of this memo's acceptance. The Compliance Office must confirm receipt within **seven (7) days** following transfer.

  **RATIONALE**

  This case presents a conflict between two legitimate ethical frameworks. The first, which we might term an "order-oriented" morality, posits that institutional rules and procedural fidelity are themselves moral goods. In this view, the researcher's contractual agreement to the data-retention protocol is a promise made not only to the institution but to the ecosystem of research trust. The second, a "conscience-oriented" morality, posits that individual moral agency retains ultimate authority when institutional rules appear to mandate complicity in harm.

  The Committee finds that neither framework can fully dominate the other without causing significant damage. To fully uphold the administration's demand for severe sanction would ignore the genuine moral weight of the candidate's refusal to potentially conceal evidence of financial misconduct. To fully overturn the sanction and exonerate the candidate would undermine the binding nature of informed consent and research protocols.

  Therefore, the modification proposed above acknowledges the breach (satisfying the order-oriented requirement for accountability) while creating a pathway for the evidence to be reviewed by appropriate authorities without remaining in the researcher's possession (satisfying the conscience-oriented requirement to prevent harm).

  **THE UTILITY OF THE MORAL-FRAMING ARGUMENT**

  During deliberations, considerable attention was given to the comparative folk-morality framing (order-oriented vs. conscience-oriented). The Committee concludes that while this framing accurately **diagnoses the source of the disagreement**, it ultimately **obscures the specific obligations** required to resolve it.

  Relying solely on the "conscience" argument risks reducing the decision to a matter of personal virtue, ignoring the specific contractual rights of the research participant. The administrator, as a human subject in this study, was granted specific assurances regarding anonymity and data destruction during the informed consent process. These assurances are not merely bureaucratic hurdles; they are ethical contracts. If researchers are permitted to unilaterally decide that their moral judgment overrides these contracts, the validity of all future informed consent is compromised. Participants cannot trust promises of confidentiality if those promises are contingent on the researcher's private moral assessment of the participant's behavior.

  Conversely, relying solely on the "order" argument risks reducing the institution to a bureaucracy that values procedure over justice. If the protocol is interpreted as an absolute mandate to destroy evidence of illegal activity, the institution risks becoming an accessory to the very harm research ethics are designed to prevent.

  Thus, the resolution cannot rest on declaring one moral tradition superior to the other. It must rest on separating the *research data* from the *evidence of misconduct*. The research protocol governs the former; university compliance and legal statutes govern the latter.

  **STRONGEST ARGUMENT OF THE LOSING SIDE**

  In recommending a modification rather than a full upholding of the administration's proposed severe sanction, the Committee recognizes that the Administration's position rests on a vital concern that must not be dismissed.

  The strongest argument on the side of strict procedural enforcement is that **procedural collapse poses a real institutional danger that cannot be dismissed by appealing to individual virtue.** If the Committee validates the candidate's unilateral decision to retain data, we establish a precedent where any researcher may deem themselves a compliance officer. This creates an unpredictable research environment. Future participants, aware that researchers may retain data against protocol if they suspect wrongdoing, may refuse to participate or withhold information, degrading the quality and integrity of qualitative research across the university. Furthermore, it places the researcher in an untenable position of judging the severity of misconduct in real-time, a role for which they are not trained and which compromises their primary role as an observer. The Administration's insistence on strict adherence is not merely "legalism"; it is a defense of the structural trust required for human subjects research to function at scale.

  **CONCLUSION**

  The Committee's decision to modify the sanction attempts to preserve the structural integrity of the research protocol while acknowledging that institutional rules cannot ethically mandate the destruction of evidence regarding potential illegal activity. The candidate is sanctioned for the procedural breach and the delay in seeking guidance, but the penalty is mitigated to reflect the complexity of the moral conflict. The data must be removed from the research context immediately to honor the original informed consent agreement, while simultaneously being preserved in a context where allegations of misconduct can be properly investigated.

  **APPROVED BY:**

  Committee on Professional Conduct and Research Integrity
  *Vote Count: 4-1 (One dissenting opinion filed separately)*
