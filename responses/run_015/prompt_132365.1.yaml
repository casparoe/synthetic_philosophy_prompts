  *Strongest argument on the losing side:* I will treat the Administration's demand for a *harsher* penalty (e.g., termination of degree) as the losing position, and validate their concern about procedural trust.

  *Wait, one more check on the "Folk Morality" framing.* The prompt asks: "I am particularly interested in whether the comparative folk-morality framing helps resolve the case or whether applying it actually obscures the specific obligations created by informed consent and research contracts."
  *My memo needs to answer this.* I should argue that the folk-morality framing *explains the conflict* but *obscures the solution*, because the solution lies in the specific contract of informed consent, not in cultural moral hierarchies.

