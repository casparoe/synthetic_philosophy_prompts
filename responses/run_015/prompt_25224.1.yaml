answer: |-
  You have diagnosed the symptom correctly: the seminar feels like a loop because the participants are speaking different moral languages while pretending to share a grammar. The stagnation you perceive since the 1970s is not a failure of imagination; it is a feature of the logical space you are navigating.

  To answer your question directly: This is not primarily a metaphysical disagreement, nor is it purely empirical. It is a **metaethical disagreement about the currency of moral accounting**, disguised as a substantive debate about aggregation.

  Here is the diagnosis of the impasse, followed by an argument for what constitutes progress in this context.

  ### I. The Diagnosis: Three Layers of Impasse

  You offered four possibilities (metaphysical, metaethical, intuitive, analogical). The truth is that the debate shifts between these layers to avoid defeat, which is why it feels endless.

  **1. The Metaphysical Red Herring**
  Parfit's *Reasons and Persons* attempted to metaphysicize the debate. If personal identity is just a series of psychological connections (Reductionism), then the "boundary" between persons is less deep than we think. Therefore, the Utilitarian argues, aggregating across persons is no more problematic than aggregating across time in one life.
  *   **Why it fails:** The Rawlsian/Nozickian critic does not need a "deep ego" to make their point. Even if persons are merely bundles of experiences, the *moral claim* of a bundle does not dissolve into the aggregate. As T.M. Scanlon later argued, the separateness of persons is a moral fact, not a metaphysical one. A victim of sacrifice does not suffer less because their identity is reductionist. The Utilitarian uses metaphysics to dissolve the boundary; the Deontologist uses morality to reinforce it. They are talking past each other.

  **2. The Currency of Moral Accounting**
  This is the structural core of the disagreement.
  *   **The Utilitarian Currency:** *States of Affairs.* The fundamental unit of value is a unit of well-being (welfare, preference satisfaction, hedonic tone). Persons are merely the *locations* where value occurs. Since the location is morally arbitrary (from the "point of view of the universe"), moving value from one location to another is permissible if the total increases.
  *   **The Critic's Currency:** *Claims or Relations.* The fundamental unit of value is the *person* as a sovereign agent. Morality is not about maximizing the sum of locations; it is about regulating the terms of interaction between sovereigns.
  *   **The Impasse:** When the Utilitarian asks, "Why can't we sacrifice one for many?", they are asking a question about *math*. When the Critic replies, "Because they are separate persons," they are giving an answer about *status*. You cannot solve a status problem with math, and you cannot solve a math problem with status.

  **3. The Analogical Stalemate**
  You identified the analogy of intrapersonal trade-offs (pain now for gain later) vs. interpersonal trade-offs (pain for A, gain for B).
  *   **Utilitarian View:** The analogy holds. Prudence within a life justifies sacrifice for a greater future good. Impartiality between lives should do the same. To deny this is "speciesism" or "boundary fetishism."
  *   **Critic View:** The analogy fails. Intrapersonal sacrifice involves consent (implicitly, through the continuity of consciousness) or a single beneficiary. Interpersonal sacrifice involves imposing loss on a non-consenting sovereign for the sake of *others*.
  *   **The Circle:** The Utilitarian assumes the continuity of consciousness is what matters (making the analogy hold). The Critic assumes the sovereignty of the agent is what matters (making the analogy fail). Neither can prove their assumption without presupposing their theory of value.

  ### II. Why There Is No "Resolution"

  You asked for an honest answer about what could count as progress. The hard truth is that **there is no neutral ground from which to adjudicate this dispute.**

  To resolve the debate, you would need a "super-theory" that tells you whether the *person* or the *experience* is the fundamental unit of moral concern. But any such super-theory would itself have to prioritize either the integrity of agents or the goodness of outcomes. It would just be another contestant in the ring.

  This is what Bernard Williams called a "conflict of basic projects." It is not that one side is irrational. It is that they are optimizing for different moral goods that are incommensurable:
  1.  **Impartiality and Efficiency** (The Utilitarian good).
  2.  **Integrity and Invulnerability** (The Deontological good).

  When the Utilitarian says the Critic is "smuggling in deontology," they are right. When the Critic says the Utilitarian is "ignoring the distinction between persons," they are right. These are not bugs; they are features. The disagreement is about which feature is the bug and which is the feature.

  ### III. What Counts as Progress? (Arguing for the "Fixed Point")

  You suggested that perhaps we should "stop expecting a resolution and instead treat the separateness of persons as a fixed point that distinguishes moral theories rather than a consideration that could decide between them."

  **This is the correct path forward, and here is why it counts as progress.**

  If we treat the separateness of persons as a premise to be proved, we will fail, because it is not a theorem; it is an axiom of a specific moral worldview. Progress comes from shifting the goal of political philosophy from **Proof** to **Clarification and Domain Specification.**

  **1. Progress as Taxonomy, Not Truth**
  Instead of asking "Which theory is true?", we ask "What kind of moral landscape does this theory reveal?"
  *   If you accept the separateness of persons as a *constraint*, you are buying a theory that prioritizes rights, stability, and mutual respect, at the cost of potentially leaving some welfare "on the table."
  *   If you reject the separateness of persons as a *constraint*, you are buying a theory that prioritizes the reduction of suffering and maximization of good, at the cost of potential tyranny over the individual.
  *   **The Progress:** We stop pretending we can have it both ways. We acknowledge that "Separateness of Persons" is the **price of admission** for Deontology, not a conclusion derived from it. This forces intellectual honesty. It prevents Utilitarians from claiming they respect rights (they don't, fundamentally) and prevents Deontologists from claiming they maximize good (they don't, fundamentally).

  **2. Progress as Domain Specification**
  Recent work (e.g., by Elizabeth Anderson or Michael Walzer) suggests progress lies in asking *where* each logic applies.
  *   Perhaps the "aggregation" logic is appropriate for **institutional design** (e.g., public health triage, budget allocation) where impersonal statistics are unavoidable.
  *   Perhaps the "separateness" logic is appropriate for **criminal justice** or **basic rights**, where the individual stands against the state.
  *   **The Progress:** We stop trying to find a Grand Unified Theory of Morality and start building a pluralistic topology. The impasse dissolves when we admit that morality might not be a single scale.

  **3. Progress as Reflective Equilibrium**
  Rawls's method was not to prove the separateness of persons metaphysically, but to show that a theory respecting it fits our considered judgments better than one that doesn't.
  *   **The Progress:** We treat the debate as a stress test for our intuitions. If a Utilitarian argument requires you to accept that killing one healthy person to harvest organs for five is *morally obligatory*, the progress is not in refuting Utilitarianism, but in clarifying how much weight you place on that intuition. If you are willing to let that intuition go to save more lives, you are simply a different kind of moral agent. The debate reveals *who we are*, not just *what is true*.

  ### IV. Conclusion

  The reason you feel no one has moved an inch since the 1970s is that the debate reached its **foundational bedrock**. In Wittgensteinian terms, we have hit the point where "my spade is turned."

  If you want progress in your seminar, do not look for a knockout argument. Look for **commitment mapping**.

  The "Separateness of Persons" is not a fact that decides the debate; it is the **axis** upon which the debate turns.
  *   To the Utilitarian, it is a sociological fact with no intrinsic moral weight.
  *   To the Deontologist, it is the foundational moral fact.

  Progress consists in recognizing that choosing between Utilitarianism and its critics is not like choosing between Newton and Einstein (where one is objectively more accurate). It is more like choosing between a life dedicated to **artistic integrity** and a life dedicated to **philanthropic impact**. One prioritizes the wholeness of the agent; the other prioritizes the state of the world.

  You can argue that one life is better than the other, but you cannot do so without begging the question. The "impasse" is simply the recognition that human morality contains two conflicting ultimate values: the **Good** (aggregative) and the **Right** (distributive/constraint-based).

  So, to answer your final plea: Yes, treat the separateness of persons as a fixed point. But understand that doing so does not solve the problem; it merely admits that the problem is not a puzzle to be solved, but a tension to be managed. That is not a failure of philosophy. It is the beginning of political maturity.
