      *   Runnable Design (Rules, Production, Event, Claims)? Yes.
      *   Analysis (Why shapes land, variables)? Yes.
      *   Skeptic Handling? Yes.
      *   Debrief Plan? Yes.
      *   Risk Management? Yes.
      *   Limitations? Yes.
      *   Harvest List? Yes.

      *Tone:* Collaborative, insightful, slightly clinical (to match the "Server" vibe).

      *One detail to refine:* The "Production" needs to feel like labor. Writing a sentence is too easy. Writing a *system* or a *rule* is better. Let's have them write a "Constraint" for the group.
      *Actually, let's have them write a "Character Secret."* It's personal. It fits the "Attunement" idea (only I know this).
      *No, let's go with "A Tool."* A writing prompt they invented. It's their intellectual property.
      *Okay, Decision:* They create "Writing Protocols" (3-5 lines of instruction on how to write a specific scene). This is their IP.

      *Let's finalize the "Claims" stakes.* Since it's a breakout, there's no real critique queue. I will simulate it. "The person with the most valid claims chooses the topic of the final 10 minutes." Or "The person with the destroyed item gets the first word."
      *Better:* The Claims Phase *is* the negotiation. The "Stake" is the narrative of the session. Who gets to define what happened?
      *Okay, I will align with the prompt's suggestion:* "Redeemable for something genuinely wanted." I will suggest they bring 1 page of their own work, and the items determine who gets feedback on it *if* this were a full workshop, BUT since it's a breakout, I will make the stake "The Right to Assign the Homework." Or "The Right to Name the Session."
      *Best Practical Stake:* "Priority in the Q&A/Debrief." Writers love to talk about their process. The items determine the order.

