      *   *Destruction:* Hits "Irreversibility" and "Labor." Even if backed up, the *original* paper is gone.
      *   *Duplication:* Hits "Exclusivity." The item isn't gone, but its value is diluted.
      *   *Backup:* Hits "Authenticity." The data is there, the history is broken.
      *   *Severed:* Hits "Identity/Attribution." The labor is divorced from the name.
      *   *Variable:* It's not just "data vs. object." It's "Provenance." The writers will care about the *story* of the object, not just the object.

  5.  **Handling the Skeptic:**

      *   If someone says "It's just paper," I need to make the *consequence* real. If they refuse to invest labor, they have nothing to lose.
      *   *Counter:* Make the initial production mandatory for participation in the final payout. If you don't make an item, you don't get to speak in the debrief/claims.
      *   *Psychological Trap:* Social pressure. Everyone else is playing.

  6.  **Risk Management:**

      *   *Gaming the Facilitator:* They try to figure out the rules mid-game. *Fix:* Stay in character. "System Error." "Protocol."
      *   *Improv Comedy:* They treat it as LARP. *Fix:* Enforce silence during Production. Keep tone dry/bureaucratic.
      *   *Server Tyranny:* I become the villain. *Fix:* Frame myself as a bound administrator, not a god. "I am following the log."
      *   *Status Hierarchies:* Published authors dominate. *Fix:* Anonymize the production phase initially? No, attunement requires names. *Fix:* Randomize the distribution of "Events" so the "stars" get hit too.

  7.  **Limitations:**

      *   *Time:* 90 mins isn't a "persistent world." It's a snapshot.
      *   *Economy:* No real market.
      *   *Emotional Attachment:* They didn't spend months on these characters.
      *   *Solution:* I have to supply the *duration* in the prose. The exercise supplies the *syntax* of loss.

  8.  **Harvest List:**

      *   Specific phrases: "It's not the same," "You can't just copy," "I wrote that."
      *   Gestures: Hovering hands, protecting the card, looking at the torn pieces.

  9.  **Refining the Design (Self-Correction during drafting):**

      *   *Constraint:* 16 people is a lot for 90 mins. Keep instructions tight.
      *   *The "Server":* I need a physical "Backup Box." An envelope or a box where cards go when "saved."
      *   *The "Claims":* What do they win? Let's make it about the *Debrief*. The currency buys the right to speak first, or to veto a topic. No, that's too meta.
      *   *Better:* The currency buys "Interpretive Authority." If you have the Original, you define what the item *does*. If you have a Copy, you have to agree with the Original holder. If you have a Restore, you have to ask permission. This creates immediate social friction.
      *   *Actually, keep it simpler:* The Claims Phase is about *Repair*. They choose how to fix the breach. The "Prize" is the resolution of the tension.
      *   *Let's stick to the prompt's suggestion:* "Place in reading order, time in critique queue." Let's use "Priority in the Debrief."
      *   *Wait, one more thing:* The prompt asks for "A fourth shape... restore that returns the item but not the record of who made it." I will include this. It's powerful for writers (attribution).

  10. **Final Polish:** Ensure tone is professional, respectful of the writer's craft, and directly actionable. (Proceeding to generate response based on these thoughts).

