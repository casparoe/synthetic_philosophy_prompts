      *   **Goal:** Research for a novel set in a persistent online world. Specifically harvesting sentences/reactions regarding loss of "fictional" items.
      *   **Core Mechanics to Embed:**
          1.  *Attunement:* Self-made items are unique to the maker (cannot be traded/stolen, only destroyed). Destruction removes capacity, not stock.
          2.  *Backups:* World backs up frequently. Loss can be reversed numerically, but the *feeling* of loss remains.
      *   **Required Output:**
          1.  Runnable Design (Rules, Production Phase, Event Phase, Claims Phase).
          2.  Analysis (Why shapes land differently, variables at work).
          3.  Handling Skeptics (How to force investment).
          4.  Debrief Plan (Mapping moments to distinctions).
          5.  Risk Management (What will go wrong & how to fix).
