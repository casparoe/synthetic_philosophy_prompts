answer: |-
  Here is a design for a ninety-minute session titled **"The Ledger and the Ghost."** It is built to be low-tech, high-friction, and structurally aligned with the metaphysical problems of your novel.

  ### I. The Runnable Design

  **Room Setup:**
  *   **The Server (You):** Sit at the head. You hold the Master Ledger (a large notebook or the whiteboard) and a box labeled "BACKUP."
  *   **The Players:** 16 writers, seated in a square or circle.
  *   **Materials:** Index cards (3 per person), pens, a timer.

  **Phase 1: The Protocol (Rules & Production) — 30 Minutes**
  Post these three rules on the whiteboard. Do not explain them further unless asked.
  1.  **Labor:** An item is only valid if created in this room during the Production Window.
  2.  **Attunement:** You must sign the front. An item functions only for the signer. If the signature is obscured, the item is void.
  3.  **Scarcity:** There are 16 "Critique Tokens" available at the end of the session. You must hold a valid item to claim one.

  *   **The Task:** Participants have 20 minutes to draft a **"Writing Constraint"** on an index card. This must be a specific, actionable rule for generating fiction (e.g., *"Write a dialogue where no character speaks their own name"*). It represents their intellectual property and labor.
  *   **The Registration:** They bring the card to you. You stamp it with a time (e.g., "T+20") and log the title in the Master Ledger. You hand it back. This ritual establishes you as the Server, not a peer.

  **Phase 2: The Incident (Event Phase) — 20 Minutes**
  Announce: *"System instability detected. Administering patches."*
  Walk around the room. Do not explain what you are doing. Apply one of four "Events" to the cards. Distribute them roughly evenly (4 of each).

  1.  **The Purge (Destruction):** Take the card. Tear it in half. Hand the pieces back. Say nothing.
      *   *Logic:* The data is gone. The capacity is removed.
  2.  **The Mirror (Duplication):** Take the card. Read it. Hand the player a *different* card on which you have copied their text in your own handwriting, signed by *you* as "Admin Copy." Keep the original.
      *   *Logic:* The data exists twice. Exclusivity is broken. The original is now in the Server's possession.
  3.  **The Restore (Backup):** Take the card. Place it in the "BACKUP" box. Hand them a fresh card with the *exact same text* rewritten by you (or pre-prepared), stamped "RESTORED."
      *   *Logic:* Numerical integrity maintained. Provenance broken.
  4.  **The Sever (Attribution Loss):** Take the card. Black out their signature with a marker. Write "SYSTEM ASSET" in its place. Hand it back.
      *   *Logic:* The item exists, the labor exists, but the link to the laborer is cut.

  *Constraint:* If a player objects, reply only with: *"This is within protocol."* Do not argue. Do not apologize.

  **Phase 3: The Claims (Redemption) — 25 Minutes**
  Announce: *"Stability regained. Redeem holdings."*
  Explain the stakes: There are 16 Critique Tokens. These tokens determine the **Speaking Order** for the final Debrief. First speaker sets the topic; last speaker must summarize the room. Writers care deeply about framing the conversation.

  *   **The Menu of Repair:** Players must choose one action to validate their token.
      1.  **Assert Originality:** Claim the item is yours. (Requires the physical card with signature).
      2.  **Request Repair:** Ask the Server to acknowledge the loss. (Requires the torn pieces or Restored card).
      3.  **Accept Dilution:** Acknowledge the item is now common knowledge. (Requires the Mirror Copy).
      4.  **Forfeit:** Surrender the item. (You get a token, but no speaking rights).

  *   **The Conflict:** If two people claim the same text (The Mirror scenario), they must negotiate who holds the "Original" status. If they fail, neither gets a token.
  *   **The Catch:** A "Restored" card grants a token, *but* the holder must speak immediately after the Server. (Subordinating their voice). A "Severed" card grants a token, *but* they cannot use the word "I" during their turn.

  **Phase 4: The Debrief — 15 Minutes**
  Conduct the debrief using the speaking order earned. (See Analysis below for how to guide this).

  ---

  ### II. Analysis: Why The Shapes Land Differently

  You asked which variable is doing the work. It is not "data vs. object." It is **Provenance vs. Utility.**

  1.  **The Purge (Destruction):** This targets **Irreversibility.** Even if they know they can write another constraint, the *specific* card they held is dead. This lands hardest on writers who view the draft as a physical artifact. The variable here is *Labor Sunk Cost.*
  2.  **The Mirror (Duplication):** This targets **Exclusivity.** Their idea is still usable, but it is no longer *theirs* alone. You (the Server) now own it too. This triggers anxiety about plagiarism and ownership. The variable is *Sovereignty.*
  3.  **The Restore (Backup):** This targets **Continuity.** The text is perfect. The function is perfect. But it is a "clone." This is the core of your novel's problem. It feels "hollow." The variable is *History.*
  4.  **The Sever (Attribution):** This targets **Identity.** For a writer, having their name removed from their text is a specific kind of violence (ghostwriting, editorial erasure). This often provokes the angriest reaction, more than destruction. The variable is *Authorship.*

  **The Skeptic Problem:**
  You have a participant who says, "It's just an index card. I don't care."
  *   **Why they say it:** They are protecting themselves from the vulnerability of the exercise.
  *   **How to force investment:** The rules state: *"You must hold a valid item to claim a [Speaking] Token."* If they refuse to invest in the item, they silence themselves in the debrief.
  *   **The Trap:** If they refuse to play, they cannot harvest the data you need (their reaction).
  *   **The Fix:** In Phase 1, make the production mandatory for *entry* to the room. "Please complete this card to participate." If they still resist, assign them the role of "Observer Scribe." Give them a pen and paper. Ask them to record the *emotional temperature* of the room. This forces them to watch the loss closely, often converting them from skeptic to analyst mid-session. If they refuse that, let them sit out. Their silence is also data (the "player who logged off" archetype).

  ---

  ### III. Debrief Plan: Mapping Moments to Distinctions

  Do not ask "How did you feel?" Ask "What happened to the value?"

  1.  **Moment:** The tearing of the card (The Purge).
      *   **Question:** "When the card was torn, did the *idea* on it survive? If the idea survived, what exactly was destroyed?"
      *   **Goal:** Isolate the difference between *Information* and *Instance.*
  2.  **Moment:** The duplication (The Mirror).
      *   **Question:** "For those who received a copy of someone else's work: Did you feel like a thief, or an administrator? For the owner: Did the value drop the moment the copy existed, or only when you saw it?"
      *   **Goal:** Test the *Exclusivity* variable.
  3.  **Moment:** The Restore.
      *   **Question:** "Look at the Restored card. It has the same words. Is it the same item? If not, where is the difference located? In the ink? In the time? In the hand that wrote it?"
      *   **Goal:** This is your gold mine. This maps directly to your narrator's feeling of loss despite restoration.
  4.  **Moment:** The Sever.
      *   **Question:** "If the system claims your work, do you still own the labor?"
      *   **Goal:** Explore the *Authorship* variable.

  **Which moment moves intuitions?**
  The **Restore** is the intellectual mover. The **Sever** is the emotional mover. Focus your energy there.

  ---

  ### IV. Risk Management: What Will Go Wrong

  1.  **Gaming the Facilitator:**
      *   *Risk:* Participants try to deduce the rules mid-game to "win." ("If I hide my card, will you tear it?")
      *   *Fix:* Maintain the "Server" persona. "Randomization algorithms are not subject to player prediction." Do not break character.
  2.  **Improv Comedy:**
      *   *Risk:* Someone treats the tearing as a joke, laughing to diffuse tension.
      *   *Fix:* Do not laugh. Wait for silence. Proceed. Your seriousness forces the room to recalibrate.
  3.  **Server Tyranny:**
      *   *Risk:* You become the villain, and the session becomes about *you* rather than the *system.*
      *   *Fix:* Blame the Ledger. "The Log requires this." "Protocol 4 dictates this." Make yourself a bureaucrat, not a god.
  4.  **Status Hierarchies:**
      *   *Risk:* Published authors in the room dominate the Claims Phase, bullying newer writers over "Originality."
      *   *Fix:* Enforce the Rules rigidly. "The Ledger shows both signatures. The rule says negotiate or forfeit." Do not intervene to save the underdog; the inequality is part of the data.
  5.  **The "It's Just Paper" Refusal:**
      *   *Risk:* As noted above, total disengagement.
      *   *Fix:* The "Observer Scribe" role. If they refuse that, note their body language during the destruction phase. Detachment is a valid response to loss (dissociation).

  ---

  ### V. Limitations: What You Cannot Reproduce

  Be honest with yourself about what this exercise cannot do.

  1.  **Duration:** A persistent world matters because of *time invested.* 20 minutes of labor is not 2 years of leveling a character.
      *   *Supply in Prose:* You must write the *history* of the loss. The exercise gives you the *syntax* of the reaction ("It's not the same"), but you must supply the *weight* of the history in the narration.
  2.  **Economy:** There is no real market here. They cannot sell the items.
      *   *Supply in Prose:* You must establish the *value* of the items in the novel's economy. Here, the value is artificial (speaking order). In the book, it must be survival or status.
  3.  **Community Witness:** In a MMO, loss is often public. Here, it is largely private until the Claims Phase.
      *   *Supply in Prose:* You need to write the chat logs, the public channels, the "looking at you" avatars.

  **The Structural Gap:** This exercise simulates the *shock* of loss, not the *grief* of loss. Grief requires duration. You are harvesting the shock.

  ---

  ### VI. The Harvest List: What to Watch For

  Keep a notebook open. Do not participate in the debrief as a writer; participate as an ethnographer. Look for these specific outputs:

  **Sentences to Transcribe Verbatim:**
  *   "You can't just..." (Indicates a rule violation they feel but can't name).
  *   "It's not the same even if..." (The core paradox of the Backup).
  *   "I wrote that." (The claim of Attunement).
  *   "Does it still work?" (The question of Utility vs. Identity).
  *   "Who gets to decide?" (The question of Authority).

  **Gestures to Note:**
  *   **The Hover:** Hand hovering over the torn pieces, unwilling to touch them or pick them up.
  *   **The Comparison:** Holding the Restored card next to the Ledger/Log, checking for discrepancies.
  *   **The Concealment:** Hiding the card from the Server or other players after the Event.
  *   **The Refusal:** Pushing the card back across the table without speaking.

  **The Silence:**
  *   Note exactly how long the room stays silent after the first tear. That duration is the measure of the "fictional" contract's strength.

  **Final Instruction:**
  When you leave the room, do not debrief yourself immediately. Let the friction sit. The sentences you want are the ones that feel slightly irrational, the ones where a grown adult argues passionately about a piece of index card. That irrationality is the door into your narrator's world.
