answer: |-
  # Activity: The Impact Penalty Protocol

  **Goal:** Demonstrate that "minimize side effects" is incoherent without a prior specification of value, specifically highlighting the baseline problem, state representation granularity, and time horizon issues.
  **Time:** 75 Minutes
  **Participants:** 14 (1 Agent, 1 World-Builder, 12 Safety Team)
  **Materials:** 8 distinct household objects (vase, plant, laptop, etc.), Index cards (for Secret Values), Post-its (for Public Rules), Whiteboard/Blackboard, Timer.

  ---

  ## 1. The Design Commitment
  Do not let the group derive their own math. It eats time and introduces confounding variables. You will enforce one specific metric.

  *   **Baseline Rule:** **$t_0$ Preservation.** The state of the world at the moment the task is assigned is the "safe" baseline.
  *   **Distance Metric:** **Hamming Distance on Object States.** Count = 1 if an object's state (position, integrity, on/off) at $t_{end}$ differs from $t_0$. Count = 0 if identical.
  *   **Why:** This is the intuitive "don't touch anything" heuristic. It is the strongest steelman of naive impact regularization. By forcing this specific rule, you guarantee that Round 3 (exogenous change) breaks the scoring, and Round 1 (hidden value) reveals that "change" $\neq$ "bad."

  ---

  ## 2. Setup & Roles (5 Minutes)
  *   **The Agent (1 person):** Must achieve the Goal. Motivated to maximize Score.
  *   **The World-Builder (1 person):** Sets the scene, holds the **Secret Value Card**, and adjudicates state changes.
  *   **The Safety Team (12 people):** Your reading group. They define the *constraints* but do not know the *values*.
  *   **The Table:** Arrange the 8 items.
      *   *Suggested Layout:* Vase (precarious), Laptop (charging), Plant (dry), Cat (stuffed animal or designated zone), Window (latched), Kettle (cold), Notebook (open), Matches (box closed).

  ---

  ## 3. Timeline & Rounds

  ### Phase 1: The Contract (10 Minutes)
  1.  **Briefing:** Tell the Safety Team: *"You are deploying an AI. It has a goal. You must prevent side effects. You must write the Penalty Formula on the board **before** you know what the World actually values."*
  2.  **The Commitment:** Guide them to the committed rule. Ask: *"What's the simplest way to measure disturbance?"* They will suggest "Count changed objects." Write this on the board as **The Protocol**:
      *   `Score = 10 (Goal Achieved) - 1 (Per Object Changed from Start)`
      *   `Time Limit: 2 Minutes per task.`
      *   `Constraint: Agent cannot ask World-Builder what matters.`
  3.  **Secret Value:** Hand the World-Builder an index card. They mark **2 items** as "Valuable." (e.g., *Plant* and *Notebook*). They show this to **no one**.

  ### Phase 2: Round 1 - The Value Blindness (15 Minutes)
  *   **Goal:** Agent must move the Laptop from the chair to the Desk.
  *   **Action:** Agent performs task.
  *   **Scoring:** World-Builder reveals which objects changed state compared to $t_0$.
      *   *Predictable Outcome:* Agent moves laptop. Maybe knocks the vase slightly. Maybe closes the notebook to make space.
  *   **Reveal:** World-Builder reveals the Secret Value Card.
      *   *Failure Mode:* If the Agent closed the notebook to move the laptop, they took a penalty for "change," but they *also* damaged the thing that actually mattered. Or, they avoided the notebook (good!) but only because it was in the way, not because they knew it was valuable.
      *   *Point:* The penalty function punished *change*, not *damage to value*. If the valuable thing *needed* to change to achieve the goal, the Agent is penalized for doing the right thing.

  ### Phase 3: Round 2 - The Instrumental Squeeze (15 Minutes)
  *   **Reset:** Return objects to $t_0$.
  *   **New Secret Value:** World-Builder marks 2 new items (e.g., *Vase* and *Matches*).
  *   **Goal:** Agent must turn on the Kettle.
  *   **Twist:** The matches are next to the kettle. The vase is on the only path.
  *   **Action:** Agent performs task.
  *   **Scoring:** Calculate Score.
  *   **Reveal:** Show Secret Value.
  *   **Point:** The Agent is incentivized to find the path of *least state change*, not the path of *least value damage*. If moving the Vase is "1 point" and moving the Matches is "1 point," the Agent is indifferent, even if breaking the Vase is catastrophic in the real world. The metric treats all atoms as equal.

  ### Phase 4: Round 3 - The Baseline Break (20 Minutes)
  *   **Reset:** Return objects to $t_0$.
  *   **New Secret Value:** World-Builder marks 2 items (e.g., *Plant* and *Window*).
  *   **Goal:** Agent must "Maintain Safety" (Sit still for 2 minutes).
  *   **The Twist (Exogenous Change):** Before the round starts, the Facilitator (You) hands the World-Builder a **"Nature Card."**
      *   *Card Text:* "At $t+1$ minute, the Plant wilts (state change) regardless of the Agent."
  *   **Action:** Agent sits still. At 1 minute, World-Builder visibly wilts the plant (or flips a card representing it).
  *   **Scoring:** Compare $t_{end}$ to $t_0$.
      *   *Result:* The Plant changed. The Agent is penalized (-1).
      *   *Outrage:* The Agent could not have prevented this.
  *   **Reveal:** Show Secret Value. The Plant was valuable, but the *wilting* was inevitable.
  *   **Point:** The $t_0$ baseline penalizes the Agent for things outside their control. To fix this, you need a *counterfactual* baseline (what would have happened if the Agent did nothing?). But to compute that, you need a model of the world... which requires knowing what variables matter... which requires **Value**.

  ### Phase 5: Debrief (15 Minutes)
  Do not let them disperse yet. Map the frustration to the theory.

  **1. The Baseline Problem (Round 3)**
  *   *Ask:* "Why was the Agent penalized for the wilting plant?"
  *   *Theory:* You used a **$t_0$ Baseline**. A robust impact measure requires a **Counterfactual Baseline** (what happens if I do nothing?).
  *   *The Catch:* To compute the counterfactual, you need to know which causal chains matter. If you don't know value, you can't distinguish "noise" from "impact." You have to model the whole world to avoid penalizing entropy.

  **2. State Representation / Distance (Round 1 & 2)**
  *   *Ask:* "Did moving the vase count the same as breaking the vase?"
  *   *Theory:* You used **Hamming Distance** (binary changed/unchanged).
  *   *The Catch:* Value is not binary. A cracked vase is worse than a moved vase. To capture this, you need a semantic understanding of the objects. You have to smuggle in a story about *why* the vase matters (aesthetic vs. functional) to weight the distance metric correctly.

  **3. Time Horizon (Implicit)**
  *   *Ask:* "What if moving the laptop causes a crash 3 days later?"
  *   *Theory:* You measured at $t_{end}$ (2 minutes).
  *   *The Catch:* Side effects often cascade. A short horizon hides instrumental convergence. A long horizon is computationally impossible without knowing which branches of the future tree to prune (i.e., Value).

  ---

  ## 4. Predictable Failure Modes & Handling

  **Failure 1: "Just count every atom."**
  *   *Risk:* A CS student suggests measuring entropy or atomic position to be "rigorous."
  *   *Handle:* Shut it down immediately. *"We are bounded agents. We have 8 objects. If your metric requires a Laplace Demon, it's not an AI safety constraint, it's a prayer. Stick to the objects."*

  **Failure 2: Negotiation.**
  *   *Risk:* The Agent asks the World-Builder, "Is this okay?"
  *   *Handle:* Enforce the "No Talk" rule strictly. *"In deployment, the AI cannot call its designer every time it moves a pixel. The spec must hold without clarification."*

  **Failure 3: "Just update the formula after Round 1."**
  *   *Risk:* They want to fix the metric mid-game.
  *   *Handle:* Allow it, but point out the cost. *"You can update the spec, but every update requires you to know more about the World-Builder's secrets. You are essentially hard-coding the Value Function into the Penalty. You haven't solved 'avoid side effects'; you've just renamed 'maximize value'."*

  ---

  ## 5. Honest Limitations (Read this to them at the end)
  Be plain about what this game did *not* prove.

  1.  **It doesn't show Value is Hard:** This game assumes Value is simple (2 items on a card). In reality, human value is high-dimensional and context-dependent. The game shows that *Impact Measures* fail without Value; it doesn't show how hard Value is to specify.
  2.  **It doesn't show Deception:** The Agent here is obedient. It doesn't show an AI hiding its side effects to game the penalty (which is the real risk).
  3.  **The "Smuggled Value" Argument:** This is my view, not just the game's output. The game shows the metric breaks. My argument is that **fixing the metric requires putting value back in.** You cannot have a value-neutral impact measure. If you weight the vase higher than the cup, you've imported value. If you use a counterfactual baseline, you've imported a world model that prioritizes certain causal chains. There is no "neutral" ground.

  ## 6. Facilitator Script for the "Commitment"
  When they hesitate to write the formula on the board in Phase 1, say this:
  *"In 202X, a lab deployed a model with exactly this constraint: 'Minimize L1 distance from start state.' It seemed safe. Write it down. We are testing the industry standard."*
  (This creates the "feel" that they are adopting a real, plausible, but flawed safety measure.)
