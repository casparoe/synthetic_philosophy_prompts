      *   *Linguistic Split:* This is the most viable path. Distinguish $U_{choice}$ (demand functions) from $U_{welfare}$ (well-being).
      *   *Ill-posed:* The question "What does utility *really* mean?" assumes there is one essence. There isn't. It's a tool.

