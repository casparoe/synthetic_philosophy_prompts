      *   *Nuance:* The Oracle *does* weaken the Choice-First position slightly because it decouples the "state" from the "action" so cleanly that maintaining they are identical becomes linguistically awkward. But philosophically, a hardline behaviorist can always retreat to "dispositional to choose."

  5.  **Determine What Counts as Progress:**
      *   *Theorem:* We already have representation theorems. More won't help.
