      *Drafting thought:* You suggest that requiring testimony surrenders autonomy, but this presupposes a radical individualism that confuses autonomy with epistemic isolation. True autonomy involves recognizing the limits of one's own cognitive architecture. In cases of structural opacity, where the barrier is not taste but conceptual incapacity, refusing testimony is not an exercise of freedom but a failure of rationality. I draw here on the distinction between mere acquaintance and propositional knowledge; while acquaintance is first-personal, the recognition of value can be mediated. If I know I lack the concepts to see the unity in a complex symphony, relying on the critic who possesses those concepts is the only rational path to the truth of the matter. To refuse is to privilege my limited perspective over the available truth, which is heteronomous to the facts, not autonomous. Thus, the requirement stands because the alternative is irrationality, not a different kind of autonomy.

