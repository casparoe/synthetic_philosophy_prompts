      *   **Problem:** The user sees a theoretical inconsistency. If non-identity applies to Case A (existence depends on choice), why doesn't it apply to Case B (changing conditions changes sperm/egg timing, thus different child)? And why is Case C (always different child) treated with even more confidence on the non-identity side?
