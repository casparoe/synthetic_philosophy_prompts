  2.  **Drafting Point 1: The Implicit Theory**
      *   *Goal:* Reconstruct what the scripts commit to regarding harm, identity, and who exists.
      *   *Analysis:* The practice seems to operate on a hybrid view. In prevention (Case B), it assumes a fixed identity (the "baby" is the same entity regardless of minor temporal/biological shifts) and a counterfactual where that specific baby exists healthy. In termination/non-existence cases (Case A & C), it switches to a person-affecting view constrained by the non-identity problem, acknowledging that preventing existence isn't harming a specific person.
      *   *Draft:* The practice implicitly adopts a person-affecting view of harm for lifestyle advice, assuming the fetus is a fixed entity comparable to a healthy version of itself, while switching to an impersonal comparative view for termination decisions where existence itself is contingent on the choice. This creates a theoretical split where harm requires a victim in prevention contexts but vanishes into impersonal badness when the alternative is non-existence.

  3.  **Drafting Point 2: Strict Presuppositions vs. Comfortable Fits**
      *   *Goal:* Distinguish what is *necessary* for the practice vs. what just feels nice.
      *   *Analysis:* Strictly, the practice only needs to be legally defensible and psychologically supportive. It doesn't *need* a coherent metaphysics of identity. It comfortably fits with a "common sense" view that ignores the non-identity problem for small changes (folate) but respects it for large changes (existence vs. non-existence).
      *   *Draft:* Strictly, the practice only presupposes that distinguishing between preventing harm to an existing fetus and selecting against a future life is legally and psychologically functional, not metaphysically consistent. It merely fits comfortably with a common-sense essentialism that treats the fetus as a persistent individual during gestation but acknowledges identity dependence on conception events when discussing alternative children.

  4.  **Drafting Point 3: Principled Line (Fixing Child vs. Condition, IVF)**
      *   *Goal:* Is there a principled line? Does it track fixing identity vs. condition? What about IVF?
      *   *Analysis:* The line is usually drawn at "same pregnancy" vs. "different pregnancy." But philosophically, as the user notes, folate changes identity too. The practice treats "same pregnancy" as identity-preserving. In IVF, selecting Embryo A over Embryo B is clearly different children, so the "harm" language is usually avoided there (you don't say Embryo B is harmed by not being chosen). The practice struggles here.
      *   *Draft:* There is no principled metaphysical line, since even folate intake alters conception timing and gametes, but the practice draws a pragmatic boundary at whether the intervention occurs within an established pregnancy versus selecting which pregnancy to initiate. In IVF, where no default outcome exists, the practice correctly avoids harm language between embryos, revealing that the "harm" script relies on a default expectation of continuity rather than strict identity conditions.

  5.  **Drafting Point 4: Rival Theories Licensing the Practice**
      *   *Goal:* Which other theories allow this same practice? Where is it underdetermined?
      *   *Analysis:* Utilitarianism (impersonal) could justify both (maximize well-being). Threshold deontology could also work. The practice is underdetermined because both a "common sense person-affecting view" (ignoring non-identity for small changes) and a "two-level utilitarian view" (use person-affecting heuristics for psychology, impersonal for policy) yield the same scripts.
      *   *Draft:* Both a naive person-affecting view that ignores subtle identity shifts and a two-level utilitarian view that employs person-affecting heuristics for psychological comfort would license these same scripts. The practice is underdetermined because it functions equally well whether you believe the fetus is literally the same entity or merely treat it as such for the sake of effective behavioural nudging.

  6.  **Drafting Point 5: Concrete Changes if Swapping to Rival**
      *   *Goal:* What changes in the counselling room if we switch theory? Stop saying "harm"? What instead?
      *   *Analysis:* If we adopt a strict non-identity consistent view (impersonal), we can't say "harm your baby" for folate either. We'd have to say "this leads to a worse outcome for the future child" or "this creates a child with health burdens." But this is awkward. If we adopt strict person-affecting (ignoring non-identity), we might say "terminating harms the fetus" (which they explicitly avoid). So the shift would likely be towards consistent impersonal language.
      *   *Draft:* If you adopted a strictly impersonal theory consistent with the non-identity problem, you would have to stop saying lifestyle choices "harm your baby" and instead say they "result in a child with greater health burdens." Conversely, if you adopted a strict person-affecting view ignoring non-identity, you would be forced to admit that termination harms the fetus, which contradicts your existing script.

