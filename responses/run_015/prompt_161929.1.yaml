answer: |-
  1. The practice implicitly operates on a hybrid theory that treats the fetus as a fixed victim during prevention counselling but as a contingent existence during termination discussions. This commits you to a person-affecting view of harm for lifestyle choices while relying on an impersonal comparative principle when the alternative is non-existence.

  2. Strictly, the practice only presupposes that distinguishing between modifying an existing pregnancy and selecting a future child is legally and psychologically functional, not metaphysically consistent. It merely fits comfortably with a common-sense essentialism that ignores gametic shifts during gestation but acknowledges them when comparing potential children.

  3. There is no principled metaphysical line since folate changes identity too, but the practice pragmatically tracks whether the intervention modifies an established pregnancy or selects which pregnancy to initiate. In IVF, the absence of a default outcome forces the practice to drop harm language between embryos, revealing the "harm" script relies on continuity rather than strict identity.

  4. Both a naive person-affecting view that ignores subtle identity shifts and a two-level utilitarian view using person-affecting heuristics for psychological comfort would license these same scripts. The practice is underdetermined because it functions equally well whether you believe the fetus is literally the same entity or merely treat it as such for effective behavioural nudging.

  5. Swapping to a consistent impersonal theory would require stopping the phrase "harm your baby" in favour of "result in a child with greater health burdens" during lifestyle counselling. Swapping to a consistent person-affecting view would force you to admit termination harms the fetus, contradicting your existing script and likely violating clinical guidelines.
