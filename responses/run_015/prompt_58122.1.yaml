answer: |-
  Here is the **Green Light Assertion Protocol**. It translates epistemic norms into a compliance checklist designed for a 3-minute window. It prioritizes safety over speed because fines cost more than handle-time.

  ### The Green Light Assertion Protocol

  **STEP 1: The Category Check**
  *   **Question:** Is the customer asking how to use *our app* (procedural) or how *tax law* applies to them (substantive)?
  *   **If Procedural (e.g., "Where do I click?"):** Go to Step 2.
  *   **If Substantive (e.g., "Will I get penalized?"):** **STOP.** Do you have a specific Knowledge Base (KB) article or IRS link that answers this *exact* scenario?
      *   **No:** **ESCALATE.** Do not assert.
      *   **Yes:** Go to Step 2.

  **STEP 2: The Source Check (Justification)**
  *   **Question:** Can you paste a link or quote a script ID *right now* in the chat?
  *   **If Yes:** Go to Step 3.
  *   **If No (e.g., "I remember reading this," "It's usually true"):** **STOP.** Memory is not a source.
      *   **Action:** Find the link or **ESCALATE**. Do not assert based on memory.

  **STEP 3: The Variable Check (Truth Conditions)**
  *   **Question:** Are there any missing facts about the customer's situation that could change the answer? (e.g., residency status, other income sources, filing history).
  *   **If No (All facts known):** Go to Step 4.
  *   **If Yes (Unknowns exist):** **STOP.** You cannot assert a definitive outcome.
      *   **Action:** Use conditional language ("Usually," "Based on what you've told me") or **ESCALATE**.

  **STEP 4: The Policy Check (Authority)**
  *   **Question:** Does our current script or QA policy explicitly forbid making this statement?
  *   **If No:** **GREEN LIGHT.** You may assert, provided you cite the source from Step 2.
  *   **If Yes (or if you are unsure):** **STOP.**
      *   **Action:** **ESCALATE** to Supervisor. Do not override QA policy even if you think you are right.

  ***

  ### Case Run-Throughs

  **1. Maya (The Memory Trap)**
  *   **Scenario:** Freelance mileage question. Read FAQ yesterday, no link now, customer urgent.
  *   **Protocol Run:**
      *   Step 1: Substantive (Tax law interpretation). -> Requires KB/IRS link.
      *   Step 2: Source Check. -> **FAIL.** She cannot paste the link. Memory is not a source.
      *   **Verdict:** **STOP.** She cannot assert flat-out.
      *   **Fix:** She must spend 60 seconds finding the link. If she can't find it in 2 minutes, she must escalate. Asserting from memory risks a fine if her memory is 99% right but the 1% exception applies to this customer.
      *   **Friction:** This feels annoyingly slow for an urgent customer, but being wrong is costlier than being late.

  **2. Luis (The Script Violation)**
  *   **Scenario:** Penalty math 99% sure, missed residency box, script says escalate.
  *   **Protocol Run:**
      *   Step 1: Substantive (Penalties). -> Requires KB/Link.
      *   Step 3: Variable Check. -> **FAIL.** He missed the residency box. That is a missing variable that changes tax liability.
      *   Step 4: Policy Check. -> **FAIL.** Script says escalate all penalty questions.
      *   **Verdict:** **STOP & ESCALATE.**
      *   **Fix:** He must tell the customer, "Penalty calculations require a specialist review due to residency variables," and transfer to you.
      *   **Friction:** The customer is begging for a yes/no. Giving one here exposes the company to liability if the residency rule triggers a fine. Luis's confidence is irrelevant; the missing variable voids the assertion.

  **3. Priya (The QA Conflict)**
  *   **Scenario:** QA wants her to say "Refund definitely by Friday" to calm anger. Agent doesn't know IRS timing.
  *   **Protocol Run:**
      *   Step 1: Substantive (IRS processing times). -> Requires IRS data.
      *   Step 2: Source Check. -> **FAIL.** She doesn't know *this person's* processing time.
      *   Step 3: Variable Check. -> **FAIL.** IRS timing varies by return complexity.
      *   Step 4: Policy Check. -> **FAIL.** While QA *wants* this, compliance policy likely forbids guaranteeing IRS actions.
      *   **Verdict:** **STOP.** This is a dangerous assertion.
      *   **Fix:** She must use expectation management: "Most refunds arrive by Friday, but IRS timing varies."
      *   **Friction:** This is where the procedure clashes with your QA metrics. If QA penalizes her for not calming the customer, the protocol fails. You need to align QA scoring with this checklist, or agents will be punished for following safety rules.

  ***

  ### Where This Will Misfire

  1.  **The "Calm Down" Pressure:** As seen in Priya's case, if your QA team measures "Customer Satisfaction" higher than "Compliance," agents will skip Step 4. They will lie to close the ticket because their bonus depends on CSAT, not on whether a fine happens 6 months later. You must fix the incentive structure, or the checklist is paper armor.
  2.  **The Gray Zone:** Step 1 (Procedural vs. Substantive) is not always mechanical. "Where do I enter mileage?" is procedural. "Does this mileage count?" is substantive. Agents will blur these lines to speed up. You will need to audit chats specifically for this boundary creep.
  3.  **Source Lag:** Sometimes the KB is wrong or outdated. If an agent follows Step 2 perfectly but the link is outdated, they are still liable. This checklist protects against *agent* error, not *company* data error.

  ### What This Cannot Settle

  This checklist cannot solve the conflict between **speed metrics** and **accuracy**. If you require 3-minute handle times but the Source Check (Step 2) takes 2 minutes, agents will fake the source. You have to decide if you are willing to let handle times slip to 5-6 minutes to ensure the Source Check is real. If you don't give them the time, they will game the system.

  Summary: Agents get to assert something only when they have a verifiable source in front of them, no unknown variables exist, and company policy explicitly permits the statement.
