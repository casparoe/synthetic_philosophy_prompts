      *   *Truth Norm:* It just has to be true. (Too risky; agents can't verify truth instantly).
      *   *Reasonable Belief/Justification Norm:* You have good evidence/reason to believe it. (This is the sweet spot for support).
      *   *Practical Context:* Tax advice is regulated. Agents usually need to avoid "practicing law/accounting without a license." They need to stick to procedural info vs. substantive advice.
