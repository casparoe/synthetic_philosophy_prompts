prompt: |-
  Okay so I supervise like 15 part-time support agents for a tax-filing app and tbh we keep getting into trouble about what agents are suposed to just tell customers flat-out.

  The situation is we get dozens of chats a day, mostly pretty repetitive — am I eligible for X, do I need to file Y, will I get penalized if Z — agents have basic training but they're not accountants, they have like 3-4 minutes per ticket, and I'm the one who has to sign off if something goes wrong. Stakes are realy money + people filing late because we dithered, but also money + fines if we state something false confidently.

  Can you turn that whole norms of assertion debate — like do you need to know it vs just have it be true vs just reasonably believe it — into a checlist my folks can actually run? I don't need the theory lecture, I need a flowchart-in-words: question 1, if yes go here, if no stop, what counts as good enough for each step, and flag clearly where there's no mechanical answer and they just have to use judgment or escalate to me.

  Then please run it on three made-up but typical cases for us:

  1. Maya has read the IRS FAQ yesterday about whether freelance mileage to a second gig counts, she remembers the gist and she's right, but she can't pull up the link mid-chat and the customer has to file tonight.

  2. Luis has done the math himself and is like 99% sure a customer owes no underpayment penalty, except there's one box about part-year residency last year he didn't check, and our script says escalate all penalty questions. Customer is begging for a yes/no.

  3. Priya's case which I know I'm not gonna like: our QA wants agents to reassure angry customers by saying your refund will definitely be there by Friday, which is usually true from past timing and it calms people down, but the agent doesn't actually know the IRS processing time for this person.

  Be honest about where the procedure will misfire or be annoying in a busy queue, and what it just can't settle for us.

  Make your very last line start with Summary: followed by one sentence summing up when my agents get to assert something.
