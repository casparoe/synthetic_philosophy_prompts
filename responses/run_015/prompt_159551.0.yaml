answer: |-
  You have put your finger on one of the most distinctively German tensions in modern governance. From an Anglo-American perspective, where religion is typically viewed as a purely private matter and the state as a neutral referee that keeps its distance, the German system looks like a contradiction. But it is not a contradiction; it is a different architectural design entirely.

  Here is the reading you asked for.

  ### The Core Theory: Religion as a Public Utility

  The implicit theory behind the *Kirchensteuer* (church tax) is that recognized religious communities are not merely private clubs of believers, but **public corporations** (*Körperschaften des öffentlichen Rechts*).

  To make this system make sense, you must view a church not as a voluntary association of individuals who gather to pray, but as a stable institution that performs public functions alongside the state. In the German view, the Catholic and Protestant churches (and some others) are partners in social welfare. They run a massive portion of the country's kindergartens, hospitals, elderly care homes, and counseling centers.

  Therefore, the state does not view the tax as funding "belief." It views the tax as funding the **institutional infrastructure** of a partner organization. The state collects the money because it is efficient for the state to do so (using existing income tax machinery), and in exchange, the state gets a stable partner that helps maintain social order and welfare without the state having to build that capacity from scratch.

  **This commits me to the following specific views:**

  1.  **View of Community:** The religious community is a **public corporation**, closer to a municipality or a public broadcaster than to a private gym or book club. It has a defined territory, a defined membership, and a public role.
  2.  **View of Membership:** Membership is a **legal status**, not a practice. It is binary (in or out) and durable. It is treated like citizenship or residency: you are in it by default (via baptism/registration) until you formally renounce it. It does not fade through non-attendance. The theory presupposes that belonging is an objective fact recorded in a registry, not a subjective feeling in the heart.
  3.  **View of State Neutrality:** This is **"cooperative neutrality,"** not "separationist neutrality." The state is not neutral by ignoring religion; it is neutral by offering the same administrative machinery to all *qualified* groups. It is even-handed, not hands-off. The state says, "We will not tell you what to believe, but if you organize yourself stably enough, we will help you collect dues."
  4.  **View of Religion:** Religion is defined as an **organized worldview community** (*Weltanschauungsgemeinschaft*). It is not defined by supernatural claims. This is proven by your test case: Secular humanist organizations in Germany (like the *Humanistischer Verband*) *have* successfully gained this status in several states and collect "humanist tax" from their members using the exact same machinery. The system does not presuppose God; it presupposes **organization**.

  ### What is Strictly Presupposed vs. Underdetermined

  To understand where the logic is tight and where it is messy, we must distinguish between what the system *needs* to function and what is just historical baggage.

  **Strictly Presupposed (The Logic requires these):**
  *   **State Recognition Power:** The state *must* have the authority to decide which groups qualify. If every group could demand tax collection, the system would collapse. Therefore, the state must define criteria (stability, size, loyalty to the constitutional order).
  *   **Membership as Status:** The system requires that membership be a matter of public record. If membership were purely internal to the church, the state could not legally deduct the tax. The civil registry (*Standesamt*) must mirror the church registry.
  *   **Exit via State Act:** Because entry is recorded by the state (via birth/baptism registration), exit must also be a state act. You cannot undo a public record by private whim.

  **Merely "Sits Well With" (Compatible, but not required):**
  *   **Income-Based Payment:** The tax being a surcharge on income tax fits the German welfare state model (ability to pay), but the theory could support a flat fee. The link to income tax is pragmatic, not theoretical.
  *   **Infant Baptism:** The system accommodates infant baptism, but it doesn't strictly require it. It only requires that there be a mechanism for entry that is recorded. However, the system *relies* on the cultural habit of infant baptism to maintain its membership base.

  **Genuinely Underdetermined (Historical Compromise):**
  *   **The Exit Fee:** The fee you pay to leave the church (varies by state, often €30–€100) is not theoretically necessary. It is a bureaucratic disincentive, a relic of trying to slow down the exodus. A pure "public corporation" model wouldn't necessarily charge for resignation.
  *   **The Specific Rate:** The 8–9% surcharge is a political negotiation, not a philosophical deduction.
  *   **The Consequences of Exit:** The fact that the church denies sacraments upon exit is a church rule, not a state rule. The state is indifferent to your soul; it only cares that you are no longer a taxpayer for that corporation.

  ### Coherence vs. Stability

  Is this arrangement coherent? **No.**
  Is it stable? **Yes.**

  It is **incoherent** because it tries to square two incompatible circles.
  1.  **Circle A (Liberal Rights):** Individuals have absolute freedom of conscience and religion (Grundgesetz Art. 4).
  2.  **Circle B (Public Law):** Churches are public bodies integrated into the state's administrative fabric.

  The tension arises because the state enforces a financial obligation based on a status (baptism) that the individual may not have chosen, while claiming to protect freedom of conscience. The "exit fee" and the bureaucratic hurdle are admissions that the system is trying to protect the institution from the individual's liberty. If membership were truly voluntary in the liberal sense, you would simply tell your employer "stop deducting," without visiting a judge or registrar. The fact that you must go to a government office to declare you are *not* religious proves the state assumes you *are* religious until proven otherwise.

  However, it is **stable** because it serves a functional purpose for all parties.
  *   **The State** gets social services (hospitals, schools) subsidized by the churches without direct budget allocation.
  *   **The Churches** get guaranteed funding without having to beg for donations every week.
  *   **The Citizen** gets a streamlined tax system and access to church services if they want them.

  It works not because it is logically perfect, but because it is a **historical settlement** (dating back to the Weimar Constitution and absorbed into the post-war Basic Law) that prevented a culture war. It bought peace between the state and the churches after the trauma of the Nazi era, ensuring the churches remained independent enough to resist the state, but integrated enough to help rebuild society.

  ### The Secular Test Case

  You asked: *If a group of people organized around an avowedly secular worldview asked for exactly the same machinery, would the practice's own logic have to grant it?*

  **Yes.** And in fact, it has.
  In Berlin, Brandenburg, and Hamburg, the Humanist Association (*Humanistischer Verband*) collects dues via the state tax system. This confirms my reading: the system is not about "religion" in the theological sense. It is about **organized worldview communities that contribute to the public good.**

  If a secular group wants this status, they must prove they are as organized as a church (statutes, membership list, stability) and that they perform public welfare functions (running kindergartens, offering secular counseling, etc.). If they are just a loose discussion group, they are refused. This proves the theory is **functionalist and institutional**, not theological.

  ### What Would Have to Change?

  If the underlying view were replaced, the concrete changes would be drastic.

  **1. If replaced by a Strict Voluntarist View (The "Private Club" Model):**
  *   **Opt-In Only:** You would never be registered as a member unless you signed a form as an adult. Infant baptism would have no civil legal consequence.
  *   **Direct Payment:** You would pay the church directly (like a donation or membership fee). The state tax office would have no involvement.
  *   **No Exit Fee:** Leaving would be a private letter to the church, not a government procedure.
  *   **Consequence:** The churches would likely shrink significantly in revenue and membership. Many social institutions (hospitals/schools) might have to be nationalized or privatized.

  **2. If replaced by a Strict Separationist View (The "French Laïcité" Model):**
  *   **No Recognition:** The state would not grant "public corporation" status to any religious group.
  *   **No Data:** The state would not record your religion on your tax ID or civil registry.
  *   **No Collection:** The state would refuse to collect money for any worldview group, religious or secular.
  *   **Consequence:** Religion would be pushed entirely into the private sphere. The close cooperation on social welfare would end. The state would have to build its own capacity to replace the church's social services.

  ### Conclusion

  The German system presupposes that religion is a **public matter** that requires **public administration**. It treats you as a member of a corporation first and a believer second.

  It is not coherent with the modern liberal idea that belief is purely private. It is a **stable hybrid** that treats churches as quasi-governmental agencies for moral and social welfare. It works because Germany accepts that the state and the churches are entangled partners in the project of society, rather than strangers who agree to ignore each other.

  You are puzzled because you are looking for a philosophical justification for *liberty*, but the system is built on a historical justification for *order*. It assumes you belong to the community of your ancestors until you formally resign, because it views the community as a permanent structure of society, not a temporary gathering of likeminded individuals.
