      *   **Concern:** Friend (Marisol) thinks this view is convenient/self-serving. User worries they've insulated the view against falsification.
      *   **Task:** Play it straight. Provide defeaters ranked from fatal to merely awkward. Sort by what the user's side would concede (internal critique) rather than external moralizing. Focus on harm *on their own terms* (clientelism/gift-giving harming people within that framework).
