  3.  **Brainstorm Defeaters (Internal Critique):**
      *   *Fatal:* The system collapses under its own weight (coordination failure). If everyone plays the relational game, the "relationship" becomes commodified, destroying the trust it relies on.
      *   *Fatal:* The "bottom of the pile" problem. Relational systems require exclusivity. If you need a relationship to get care, those without relationships (the poor, strangers, minorities) die. This violates the *local* moral obligation of hospitality/care.
      *   *Awkward:* Speed money becomes steering money when resources are scarce. (The queue fee becomes a barrier to entry).
      *   *Awkward:* The "Complaint Test" is circular because power shapes vocabulary.
