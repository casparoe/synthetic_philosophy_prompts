      *   **Defeater 1 (Fatal): The Exclusion Problem (The Bottom of the Pile).** Relational ethics work for insiders. What about outsiders? In a medical context, if the "gift" gets you medicine, the person without the goat gets nothing. This violates local norms of hospitality or communal survival, not just Western impartiality. *Hypothetical:* The warehouse manager who helps his cousin vs. the stranger whose child needs insulin.
      *   **Defeater 2 (Fatal): The Coordination Collapse (The Trap).** If everyone expects payment, the "gift" loses its meaning as relationship-building and becomes a tax. This harms everyone, including the giver. It stops being a "ledger of obligation" and becomes a "ledger of extraction." *Hypothetical:* The truck driver stopped at five checkpoints. It's not building relationships; it's bleeding the supply chain dry.
