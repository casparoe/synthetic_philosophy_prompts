answer: |-
  1. The account must explicitly specify the criteria used to individuate the influencing state as "cognitive" and the influenced state as "perceptual," or provide an argument for why the phenomenon can be characterized without this dichotomy. Since the debate often centers on the architecture of mind, failing to define these terms risks begging the question against either modularists who deny penetration or holisticists who deny the distinction. This specification is binding because the thesis is unintelligible without knowing what is penetrating what.

  2. The account must distinguish between alterations in perceptual phenomenology and changes in post-perceptual judgment, belief, or attentional allocation. Without this distinction, empirical findings of top-down influence cannot confirm the specific thesis that cognition alters experience rather than merely altering how experience is used or reported. Conflating these categories renders the hypothesis unfalsifiable against alternative explanations of behavioral data.

  3. The account must accommodate robust psychophysical data on top-down effects without equating every such effect with cognitively penetrable content. Denying established data renders the theory empirically vacuous, but equating all top-down effects with penetration trivializes the philosophical thesis regarding modularity. A viable theory must explain why some influences count as penetration while others count as standard processing.

  4. The account must clarify the relationship between the causal history of a perceptual state and its epistemic role without presupposing that penetration necessarily defeats justification. Some theories claim penetration destroys objectivity while others argue it enables expertise, so assuming either outcome beforehand biases the metaphysical analysis of the state itself. The theory must allow the epistemological consequences to follow from the metaphysical account rather than driving it.

  5. The account must reconcile the conceptual need for a system boundary with the empirical evidence for highly interactive, distributed neural processing. This creates a tension with Desideratum 1: insisting on a sharp boundary may contradict neural data, yet abandoning the boundary makes "penetration" indistinguishable from trivial causal interaction. Satisfying both the need for conceptual clarity and empirical fidelity is therefore a primary theoretical hurdle.
