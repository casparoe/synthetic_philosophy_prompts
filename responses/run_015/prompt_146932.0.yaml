prompt: |-
  Hey — please take this seriously as a professional philosopher who also happens to have years of experience moderating a big online game community, and before you write anything spend a little while brainstorming the different jobs the word "real" and the word "harm" are doing in what follows, then commit to a reading.

  I help run a Discord for a long-running survival-craft server (think Minecraft-adjacent). Last week a player who had spent something like 400 hours building a castle and hoarding rare drops got greifed by someone who got hold of elevated permissions through an exploit — part of the base was flooded with lava, the rest blown up, and the chests emptied. The admins had a nightly backup and decided not to roll it back. The thread that followed was a mess, and the line that ended up winning the argument (people stopped arguing, anyway) was: "it's just pixels, nobody lost anything real." Variants were floating around too — "no one actually got hurt," "it's not like anything was destroyed." I feel like that sentence smuggled in about six different claims at once and I want them pried apart.

  Three wrinkles I want you to actually engage with rather than skip. (1) The admins *could* have restored everything from the nightly backup and chose not to, so the "loss" is reversible by fiat — does reversibility make something not a loss, or only make it compensable? (2) The castle's design was mirrored on a fan wiki and half the server has screenshots and video of it, so in one sense nothing was destroyed at all, and yet the player's own access to it is gone. I keep going back and forth on whether that makes the case better or worse for the "just pixels" person. (3) Some items on this server do clear a market test — rare cosmetics get traded for actual money on the side — so there's a version of the slogan that's just false for those, and I want to know whether that should change anything about the general argument or whether dragging money in is a red herring.

  What I want is a menu, not a single interpretation. Give me the distinct precise theses "it's just pixels" could be expressing — metaphysical ones about what kind of thing a virtual object is, ones about what harm requires, ones about what we owe each other in a game, ones about what admins owe players, ones about whether anger can be misplaced even when it's intelligible — and for each, tag it as trivial, substantive and defensible, substantive and shaky, or straightforwardly false. Then tell me which reading the person who posted it probably meant, and — the part I actually care about — which reading, if any, would really support the work it was doing in that thread: shutting down the claim that the griefers did something wrong and that the admins owed the player a rollback. My suspicion is that the plausible readings are all ones that don't get him that conclusion, and the ones that get him the conclusion are all false, but maybe I'm wrong; say so if I am.

  Format, please, in this order: "Menu of readings" (numbered, roughly 600–700 words, one verdict tag per entry, and feel free to say when two readings collapse into each other); "Sorting the readings" (about 200 words, grouping them into platitudes, live philosophical claims, and falsehoods, and flagging any that equivocate between metaphysics and ethics); "Which reading the thread actually needed" (about 250 words — map the candidate readings onto the three things the slogan was being used for and say which ones fail to reach them); and "Where 'it's just pixels' runs out" (about 250 words — cases or variations, maybe the backup one and the money one, where the slogan gives an answer most people would reject).
