answer: |-
  ### Menu of readings

  1.  **Ontological Deflationism:** This reading claims virtual objects are merely data structures rendered as light, lacking the causal power of physical objects. Because they cannot cause physical injury or occupy physical space, they are not "real" objects. Consequently, destroying them is not "real" destruction.
      *Verdict: Substantive and Shaky.* While metaphysically coherent regarding substrate, it ignores functional reality. A locked digital door functions as a barrier; a deleted castle functions as a loss of utility.

  2.  **Phenomenological Dismissalism:** Here, "real harm" is restricted to physical pain or clinically diagnosable psychological trauma. Temporary frustration or anger, however intense, is categorized as disproportionate emotional noise rather than genuine harm.
      *Verdict: Substantive and Shaky.* This sets the bar for harm implausibly high. It risks gaslighting players by invalidating legitimate distress over lost labor and social standing.

  3.  **The Reversibility Thesis:** This argues that if a state can be restored to its prior condition without significant cost, no permanent loss has occurred. Since the backup exists, the castle still exists in potentiality; the "loss" is merely a temporary administrative choice.
      *Verdict: Substantive and Defensible.* This distinguishes between *destruction* and *withholding restoration*. However, it conflates the object's existence with the player's access to it.

  4.  **Information Preservationism:** This claims the castle's essence is its design, which survives on the wiki and in screenshots. Since the information persists, the object persists. The specific instance on the server is irrelevant.
      *Verdict: Straightforwardly False.* This confuses type and token. A photograph of a house is not the house; a wiki entry is not the playable structure. The player lost the token, which is what mattered.

  5.  **Economic Monism:** This reading asserts value is solely determined by fiat currency exchange. Since most items lack a direct real-money trade (RMT) rate, they are valueless. Only the rare cosmetics with market prices count as "real."
      *Verdict: Substantive and Shaky.* This ignores labor theory and opportunity cost. 400 hours of time has value regardless of whether it is monetized. It creates a two-tier ontology of items based on arbitrary market liquidity.

  6.  **Normative Expectation Void:** This argues that in a survival server, griefing is an emergent mechanic. If the server rules do not explicitly forbid exploits, players assume the risk. No moral wrong occurred because no normative expectation of safety was established.
      *Verdict: Substantive and Defensible.* This hinges on the social contract. If the server culture is "anything goes," the harm is akin to losing a bet rather than being robbed.

  7.  **Administrative Sovereignty:** This claims admins own the infrastructure and owe players nothing. Access is a privilege, not a right. Therefore, admins cannot wrong players by refusing rollbacks, regardless of the player's loss.
      *Verdict: Substantive and Defensible.* This is legally robust but socially fragile. It justifies the admin's action but does not negate the griefers' wrong, only the admins' obligation to fix it.

  ### Sorting the readings

  We can group these into three categories. **Platitudes** include Administrative Sovereignty; it is technically true but offers no moral comfort. **Live Philosophical Claims** include the Reversibility Thesis and Normative Expectation Void; these are defensible but depend heavily on specific server context and prior agreements. **Falsehoods** include Information Preservationism and strict Ontological Deflationism; these deny the lived reality of the players.

  Crucially, the slogan equivokes between metaphysics and ethics. When the poster says "nothing real," they sometimes mean "nothing physical" (metaphysics) and sometimes "nothing of value" (axiology). When they say "nobody got hurt," they shift from "no physical pain" to "no moral wrong was committed." This slippage allows the phrase to do rhetorical work that strict philosophical consistency would not permit. The defensible readings admit harm but deny obligation; the false readings deny harm entirely.

  ### Which reading the thread actually needed

  The slogan was deployed to do three jobs: invalidate the victim's anger, absolve the griefers of moral wrong, and justify the admins' refusal to rollback. Your suspicion is correct: the readings that support these conclusions are mostly false or irrelevant.

  To invalidate the anger, the poster needs Phenomenological Dismissalism or Ontological Deflationism. Both are shaky; 400 hours of labor is real labor, and the distress is real distress. To absolve the griefers, the poster needs Normative Expectation Void. This is defensible only if the server is anarchy; if it is a community server, using an exploit violates the social contract regardless of the "pixels" argument. To justify the admins, they need Administrative Sovereignty or Reversibility. Sovereignty works but admits the loss was real; Reversibility works only if we accept that potential restoration equals actual possession.

  The slogan succeeds rhetorically because it conflates these. It uses the truth of Administrative Sovereignty (admins *can* refuse) to smuggle in the falsehood of Ontological Deflationism (the loss *doesn't matter*). A defensible reading admits the player lost something real (time, effort, social capital) but argues the admins aren't obligated to fix it. The slogan denies the loss itself to avoid arguing about the obligation. It shuts down the thread by denying the premise of the grievance rather than addressing the grievance.

  ### Where 'it's just pixels' runs out

  The slogan collapses under the pressure of your three wrinkles. First, the **Backup Wrinkle**: If restoration is costless, refusing it inflicts a *new* harm distinct from the griefing. The griefers destroyed the castle; the admins destroyed the *hope* of restoration. "It's just pixels" cannot explain why admins would withhold costless relief unless they are punishing the victim, which undermines the "no harm" claim.

  Second, the **Money Wrinkle**: The existence of an RMT market empirically falsifies Economic Monism. If rare cosmetics trade for cash, they are assets. If the griefed items were adjacent to those, the "no value" claim becomes arbitrary. Once value is admitted for some digital objects, the distinction becomes one of degree, not kind.

  Third, the **Trust Wrinkle**: The griefers used an *exploit*, not emergent gameplay. This violates the normative contract even in survival servers. "It's just pixels" assumes a level playing field; exploits break the game's logic. When the medium itself is compromised, the reductionist defense fails because the "pixels" no longer function according to the agreed rules. The slogan works for emergent loss, but not for systemic betrayal.
