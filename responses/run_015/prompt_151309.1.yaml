  ## 10. Final Reflection on the "No Empirics" Constraint

  I want to close this proposal by reiterating why the lack of empirical work is a feature, not a bug, for this specific question.
  Decision theory is a normative discipline. It asks how agents *ought* to choose, not how they *do* choose.
  The Allais Paradox is interesting precisely because it pits normative theory against empirical observation.
  Most responses to the paradox try to bridge this gap by changing the theory to fit the data (Non-EU) or explaining away the data to save the theory (EU).
  This project takes a third path: It analyzes the normative theory itself to see if the condemnation of the data is logically sound.
  This is purely philosophical work. It requires no subjects, no IRB approval, and no statistical software. It requires only logic, clarity, and a rigorous engagement with the axioms.
  By focusing on the *structure* of the arguments, I can make a contribution that is robust regardless of future empirical findings. Even if future experiments show that humans don't care about temporal resolution, the logical point remains: *If* they did, would they be irrational?
  Answering this "if" question is the proper domain of a philosophy thesis. It allows for a depth of conceptual analysis that an empirical study would crowd out. In 7000 words, I cannot run a study and analyze it. But I can dismantle and rebuild a foundational argument. That is the trade-off I am making, and it is the appropriate one for this department and this topic.

  The success of the chapter will not be measured by whether I prove the Allais preferences are "good." It will be measured by whether I successfully isolate the Reduction Axiom as the pivot point of the normative debate. If I can show that the EU defender *must* defend Reduction to defend Independence, I have advanced the discussion, regardless of whether Reduction is ultimately defensible.
  This is a manageable, high-yield philosophical project that fits the constraints and leverages the student's strengths in conceptual analysis.

