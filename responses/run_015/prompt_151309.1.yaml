  ## 11. Appendix: Glossary of Key Terms (For Internal Use)

  *   **Independence Axiom:** If A is preferred to B, then a mixture of A and C is preferred to a mixture of B and C.
  *   **Allais Paradox:** A choice pattern that violates Independence, typically involving a certainty effect.
  *   **Reduction of Compound Lotteries:** The axiom that a multi-stage lottery is equivalent to a single-stage lottery with the same final probabilities.
  *   **Dynamic Consistency:** The property that a plan made at the start of a sequence is actually followed at later stages.
  *   **Money Pump:** A sequence of trades that exploits inconsistent preferences to leave the agent worse off.
  *   **Consequentialism:** The view that only final outcomes matter, not the path taken to reach them.
  *   **Representation Theorem:** A mathematical proof showing that if preferences satisfy certain axioms, they can be represented by a utility function.

  *(Note: This glossary is for the student's organization and will not appear in the final chapter.)*

