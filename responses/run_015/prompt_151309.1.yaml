answer: |-
  # Proposal: The Temporal Structure of Risk and the Normative Force of Independence

  ## 1. Introduction and Research Question

  ### 1.1 Context and Motivation
  The Allais paradox stands as the most persistent challenge to the Expected Utility (EU) framework in decision theory. Since its formulation in the early 1950s, it has served as the primary exhibit for those arguing that rational agents systematically violate the Independence Axiom. The standard narrative is well-rehearsed: agents prefer a sure gain over a high-probability gain, but reverse this preference when both options are scaled down by a common probability factor. This pattern violates Independence. The subsequent decades of literature have largely bifurcated into two camps. The first camp, defending EU, argues that the Allais pattern is a performance error, a framing effect, or a misunderstanding of the probabilities involved. They maintain that Independence is a constitutive norm of rationality and that the Allais preferences, however psychologically natural, are irrational. The second camp, advocating for Non-Expected Utility (Non-EU) theories such as Rank-Dependent Utility or Prospect Theory, accepts the Allais pattern as normatively permissible (or at least rationally defensible) and argues that the Independence Axiom must be discarded or modified to accommodate it.

  This binary framing, however, obscures a structural ambiguity in how the Independence Axiom is justified and applied. In the foundational literature, Independence is often motivated by two distinct types of arguments that are treated as interchangeable but may not be. The first is a static, representational argument: Independence is the mathematical condition required to ensure that preferences over lotteries can be represented as a linear sum of utilities weighted by probabilities. Without it, the elegant machinery of expected utility calculus collapses. The second is a dynamic, coherence argument: Independence is necessary to prevent an agent from being money-pumped or from planning a strategy that they will later have cause to abandon. This second argument relies on the assumption that the agent views the choice as part of a sequence or a tree, where learning which branch of probability one is on updates the decision context.

  My central suspicion is that these two justifications are not equivalent. Specifically, I suspect that the dynamic coherence arguments (money pumps, dynamic consistency) rely on assumptions about the temporal resolution of uncertainty that are not present in the static representation theorem. In the standard presentation of the Allais paradox, the lotteries are presented as "flat" lists of outcomes and probabilities. However, any compound lottery can mathematically be reduced to a simple lottery, and any simple lottery can be decomposed into a sequential process. The standard theory assumes the Reduction of Compound Lotteries axiom: a rational agent should be indifferent between a lottery resolved in one stage and a lottery resolved in two stages, provided the final probability distributions over outcomes are identical.

  If the Allais preference is driven by the psychological weight of certainty (the "certainty effect"), it is possible that this effect is sensitive to *when* the uncertainty is resolved. If an agent faces a sequential choice where the "safe" branch is resolved first, their preferences might stabilize in a way that satisfies dynamic consistency, even if they violate the static Independence Axiom. Conversely, if the violation is purely about probability weighting in a static context, the temporal structure should not matter. The current literature often treats the Allais violation as a monolithic block: either you accept it and drop Independence, or you reject it and keep Independence. This proposal argues that we need to disaggregate the axiom. We need to ask whether the normative bite of Independence comes from its role in representation or its role in dynamic planning, and whether the Allais pattern violates both or only one.

  ### 1.2 The Research Question
  The initial formulation of this project posits that Independence does "two different jobs" and that Allais preferences might break one while satisfying the other. While this intuition is productive, it requires sharpening to be a determinate philosophical question. As it stands, "doing a job" is metaphorical. In formal decision theory, axioms have specific logical consequences. Therefore, the question must be framed in terms of the conditions under which the normative arguments for Independence hold.

  The standard defense of Independence relies on the claim that if you violate it, you are susceptible to dynamic inconsistency. You would choose a plan at time *t1* that you would rationally abandon at time *t2* once new information arrives, or you would accept a series of trades that leave you worse off (a money pump). However, these arguments presuppose that the agent treats the choice problem as a dynamic tree where the Reduction of Compound Lotteries holds. If an agent treats the Allais choice as a truly sequential process where the resolution of the 89% common consequence matters for their emotional or planning state, the reduction to a flat lottery might be the irrational step, not the violation of Independence.

  Therefore, the research question for this thesis chapter is:

  **Does the normative force of the Independence Axiom depend on the assumption that the temporal resolution of uncertainty is irrelevant to rational choice? Specifically, can Allais-style preferences be shown to satisfy dynamic consistency conditions if the Reduction of Compound Lotteries is suspended, thereby isolating the Independence Axiom from the charge of dynamic incoherence?**

  This question is answerable within the scope of a philosophy thesis because it does not require new empirical data about how humans *actually* behave. Instead, it requires a conceptual analysis of the relationship between three axioms: Independence, Reduction of Compound Lotteries, and Dynamic Consistency. It asks whether the standard money-pump arguments against Allais preferences succeed if we model the agent as one who distinguishes between a one-stage resolution and a two-stage resolution of risk. If the money pump fails in the two-stage model without Reduction, then the standard argument that "Allais preferences are irrational because they lead to dynamic inconsistency" is undermined. This leaves open the possibility that Allais preferences are statically non-representable by EU but dynamically coherent under a different description, which would fundamentally shift the debate from "rational vs. irrational" to "which descriptive framework is normatively appropriate."

  This question is determinate because it asks for a logical reconstruction of the arguments. Either the money-pump argument goes through without the Reduction axiom, or it does not. If it does not, the standard normative condemnation of the Allais pattern is incomplete. If it does, then the student's suspicion is incorrect, and the static/dynamic distinction collapses in this context. Both outcomes yield a clear philosophical conclusion.

  ## 2. The Standard Dialectic: Why the Question Remains Open

  To understand why this question has not been definitively settled in the existing literature, we must examine the positions of the two standard camps. Neither camp explicitly addresses the interaction between temporal resolution and the Independence Axiom in the way this project proposes. They talk past each other because they prioritize different aspects of the decision problem.

  ### 2.1 The Expected Utility Defenders
  The defenders of Expected Utility theory, following the tradition of Savage and Ramsey, treat the Independence Axiom as a cornerstone of rationality. Their primary argument is not merely that EU is mathematically convenient, but that violating Independence leads to absurd consequences. The most potent version of this argument is the dynamic coherence argument.

  The EU defender argues that preferences should not depend on outcomes that are causally irrelevant. In the Allais paradox, the 89% chance of winning a million dollars is common to both options in the first choice pair. In the second choice pair, this common consequence is replaced by a common consequence of zero. The EU defender argues that because this outcome is common, it should cancel out. If you prefer Option A over Option B, you should maintain that preference regardless of what happens in the branch where A and B yield the same result. To do otherwise is to let an irrelevant outcome influence your choice.

  When pressed on why this is irrational, the EU defender moves to dynamic arguments. They construct a scenario where the agent faces the Allais choice as part of a sequence. If the agent violates Independence, they can be shown to prefer a strategy at the outset that they will later reject. For example, an agent might plan to take the risky option in a sub-branch but, once actually in that sub-branch, switch to the safe option. This is dynamic inconsistency. The EU defender claims this is a fatal flaw in rationality because it makes the agent vulnerable to exploitation (money pumps) or ensures they fail to achieve their own ends.

  However, the EU defender typically assumes that the structure of the lottery is defined by its final probability distribution. They assume the Reduction of Compound Lotteries axiom without significant debate. For them, a two-stage lottery that reduces to the same probabilities as a one-stage lottery *is* the same lottery. Consequently, they do not investigate whether the Allais violation persists if the agent is forbidden from reducing the lottery. They assume that a rational agent *must* reduce compound lotteries. Therefore, for the EU defender, the temporal structure is irrelevant. The question of whether the resolution happens in one step or two is a matter of presentation, not substance. Because they treat Reduction as a rationality requirement, they never test whether the dynamic inconsistency argument holds without it. This leaves the gap open: if Reduction is not a requirement of rationality, does the dynamic inconsistency argument still hold?

  ### 2.2 The Non-Expected Utility Defenders
  On the other side are the proponents of Non-EU theories, such as Prospect Theory or Rank-Dependent Utility. These theorists accept the Allais pattern as a valid description of rational or at least defensible choice. They argue that the Independence Axiom is too restrictive because it ignores how humans actually process probabilities. They posit that people weight probabilities non-linearly; a move from 0% to 1% probability is weighted more heavily than a move from 50% to 51%. This explains the Allais pattern: the "certainty effect" makes the sure thing in the first choice disproportionately attractive.

  However, in their rush to accommodate the empirical data, Non-EU theorists often sideline the normative dynamic arguments. They focus on fitting the static choice data. When confronted with the money-pump argument, they often respond by modifying the theory to include "resolute choice" or by arguing that the context of the choice changes the preferences. They admit that their models can lead to dynamic inconsistency but argue that dynamic consistency is overrated or that agents can pre-commit to avoid it.

  Crucially, like the EU defenders, the Non-EU camp generally accepts the standard presentation of the Allais paradox as a set of static choices. They do not typically explore whether the probability weighting function they propose is sensitive to the temporal resolution of uncertainty. They assume the weighting applies to the final probabilities. By focusing on static probability weighting, they miss the opportunity to argue that the Allais preference might be a response to the *structure* of the risk rather than the *weight* of the probability. If the Allais preference is about the relief of resolving uncertainty early (or late), then a static probability weighting model is the wrong tool to explain it.

  Because the Non-EU camp is primarily motivated by saving the phenomena (the observed choices), they are less concerned with isolating the specific normative failure of Independence. They are happy to drop Independence entirely. They do not pause to ask if Independence might be salvageable in a dynamic context even if it fails in a static one. They treat the axiom as a monolithic block: if it fails the static test, it is discarded. This leaves the specific contribution of the temporal structure unexamined.

  ### 2.3 The Gap in the Literature
  The result of this dialectic is a stalemate where the temporal structure of the lottery is treated as a neutral background feature. Both sides assume that a lottery is defined by its probability distribution over final outcomes. Neither side seriously entertains the possibility that the *process* of resolution is a constitutive part of the object of choice.

  There is a small body of literature on dynamic choice and consequentialism (associated with philosophers like Hammond and McClennen) that touches on these issues. They discuss whether an agent must be consequentialist (caring only about final outcomes) to be rational. However, this project differs from that literature in a specific way. The dynamic choice literature typically asks: "Given that preferences violate Independence, how can we model dynamic choice?" This project asks: "Does the violation of Independence depend on how we model the temporal structure in the first place?"

  The standard camps leave the question open because they both implicitly accept the Reduction of Compound Lotteries as a precondition for the debate. The EU defenders use it to prove inconsistency; the Non-EU defenders ignore it to fit the data. Neither asks whether the Reduction axiom itself is doing the heavy lifting in the argument against Allais preferences. If the Allais pattern disappears (or becomes dynamically consistent) when the lottery is explicitly modeled as sequential without reduction, then the EU defender's claim that "Allais preferences are irrational" loses its primary normative support (the money pump), and the Non-EU defender's claim that "we need probability weighting" might be misdiagnosing the source of the preference (which might be about timing, not weighting).

  This project aims to step into this gap. By suspending the Reduction axiom and analyzing the Allais paradox through the lens of temporal resolution, I intend to show that the standard arguments against the Allais pattern are not as robust as they appear. This does not necessarily prove that Allais preferences are rational, but it proves that the standard argument for their irrationality is incomplete.

  ## 3. The Conceptual Gap: Static Representation vs. Dynamic Coherence

  To make progress on this question, I need to clearly distinguish the two "jobs" that the Independence Axiom performs in the standard literature. This distinction is the theoretical engine of the thesis chapter.

  ### 3.1 Job One: The Representation Theorem
  The first job of Independence is mathematical. In the von Neumann-Morgenstern (vNM) framework, we start with a set of preferences over lotteries. We want to show that these preferences can be represented by a utility function such that the agent maximizes the expected value of that function. The Independence Axiom is the crucial condition that allows this representation to be linear.

  Mathematically, Independence ensures that the preference between two lotteries depends only on the outcomes where they differ. If Lottery A and Lottery B yield the same outcome in some state of the world, that state should not affect the preference ordering. This allows the utility of a lottery to be calculated as a weighted sum: $U(L) = \sum p_i u(x_i)$. Without Independence, we cannot guarantee that the utility function takes this additive form. We might need a more complex function where probabilities interact with each other (as in rank-dependent models).

  In this context, Independence is a condition on the *structure of preferences*. It is a static condition. It says nothing about time, sequences, or learning. It simply says that your ranking of options must respect a certain algebraic property. When the Allais paradox violates Independence, it breaks this representation. The agent's preferences cannot be mapped onto a single expected utility function.

  The normative force here is abstract. Why should an agent care about having a linear representation? The standard answer is that linearity ensures coherence. If your preferences aren't linear, you might value a bundle of risks differently than the sum of the individual risks. But this is often left as a mathematical convenience rather than a deep normative requirement. The EU defender needs more than "it makes the math work" to convince us that violating it is irrational. This leads to the second job.

  ### 3.2 Job Two: Dynamic Coherence and the Money Pump
  The second job of Independence is to ensure that the agent behaves consistently over time. This is where the normative bite is strongest. The argument runs as follows: If you violate Independence, you are susceptible to a "money pump."

  Imagine an agent with Allais preferences. They prefer the Sure Thing (A) over the Risky Gamble (B) in the first scenario. But in the second scenario (where the common consequence is removed), they prefer the Riskier Gamble (D) over the Safer Gamble (C).
  Now, construct a dynamic scenario. The agent is offered a choice that effectively combines these scenarios. Through a series of trades, an exploiter can offer the agent their preferred option, then offer to swap it for the other option based on their reversed preferences in the sub-branch, charging a small fee each time. Because the preferences cycle or reverse depending on the context, the agent ends up paying to switch back and forth, ending up with less money than they started with, holding the same lottery they originally held.

  Alternatively, consider the planning argument. An agent plans at Time 1 what they will do at Time 2. If they violate Independence, they might plan to choose Option X at Time 2, but when Time 2 arrives, they prefer Option Y. This is dynamic inconsistency. The agent fails to execute their own plan. This is seen as a failure of rational agency because the agent is at war with their future self.

  In this context, Independence is not just a mathematical condition; it is a condition on *agency*. It ensures that the agent is a unified entity over time. This is why the Allais paradox is taken so seriously. It's not just that the math breaks; it's that the agent seems exploitable or self-defeating.

  ### 3.3 The Divergence
  My hypothesis is that these two jobs diverge when we introduce the temporal structure of the lottery explicitly.
  The Representation Theorem (Job One) applies to the "flat" description of the lottery. It requires that the agent treat the lottery as a vector of probabilities and outcomes. If the agent cares about *when* the uncertainty is resolved, they are effectively treating the "time of resolution" as part of the outcome. If "Winning $1M immediately" is a different outcome from "Winning $1M after a two-stage draw," then the Independence Axiom is not actually violated; the outcomes are just defined differently. However, standard theory forbids this by the Reduction Axiom.

  The Dynamic Coherence argument (Job Two) applies to the "sequential" description. It requires that the agent's choice at a later node match their earlier plan. But this argument only works if the agent accepts the Reduction Axiom. If the agent says, "I prefer the safe option when it is a sure thing, but I prefer the risky option when it is part of a compound lottery because I enjoy the suspense (or dread the wait)," then their preferences are dynamically consistent *relative to their description of the outcomes*. They planned to feel suspense, and they got suspense.

  The divergence lies here: You can satisfy Dynamic Coherence (Job Two) while violating the Static Representation (Job One), provided you reject Reduction.
  If I reject Reduction, I am allowed to say that a two-stage lottery is a different object than a one-stage lottery. In that case, my Allais preference might simply be a preference for the two-stage structure over the one-stage structure (or vice versa). If I consistently prefer the structure that gives me certainty earlier, I am not dynamically inconsistent. I am just sensitive to timing.
  However, the standard Money Pump argument assumes I *shouldn't* care about timing. It assumes I should reduce the lottery. If I refuse to reduce, the money pump fails because the exploiter cannot offer me the "same" lottery in a different form.

  Therefore, the Allais pattern might not be a violation of rational dynamic planning. It might be a violation of the requirement to ignore temporal structure. The standard camps conflate these. The EU defenders say "You are dynamically inconsistent!" but they only prove this by assuming "You must ignore temporal structure." The Non-EU defenders say "You are allowed to violate Independence!" but they usually justify this with probability weighting, which is a static fix for what might be a dynamic preference.

  This thesis chapter will argue that the Money Pump argument (Job Two) collapses without the Reduction Axiom. Therefore, the normative condemnation of Allais preferences rests entirely on the justification for Reduction. If Reduction is not a requirement of rationality, then Allais preferences are not dynamically irrational. They are only representationally inconvenient. This shifts the burden of proof onto the EU defender to justify why Reduction is mandatory, rather than simply assuming it.

  ## 4. Methodology and 12-Week Plan

  This project is a work of conceptual analysis within the philosophy of decision theory. It does not involve empirical data collection, running subjects, or statistical analysis. The progress of the chapter will be measured by the clarity of the distinctions drawn, the robustness of the reconstructed arguments, and the logical validity of the conclusions.

  ### 4.1 Philosophical Methodology Without Empirics
  A common objection to this type of project is: "How can you make claims about the Allais paradox without testing whether people actually care about temporal resolution?"
  The response is that this chapter is not making a psychological claim about human behavior. It is making a normative claim about the structure of rational choice theory.
  1.  **Conceptual Reconstruction:** I will reconstruct the standard arguments (Representation Theorem, Money Pump) formally (using logic and informal math) to identify their premises.
  2.  **Counterfactual Analysis:** I will construct thought experiments where the Reduction Axiom is suspended. I will ask: "In this model, does the money pump still work?" This is a logical question, not an empirical one.
  3.  **Normative Evaluation:** I will evaluate whether the premises required to save the Money Pump argument (specifically, Reduction) are themselves defensible.

  The "data" for this project is the logical structure of the arguments found in the literature. My contribution is to rearrange that structure to reveal the hidden dependency on temporal assumptions.

