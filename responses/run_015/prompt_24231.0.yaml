      *   Move to *Hierarchical Modeling* or *Model Stacking*.
      *   Progress = acknowledging that "Outside View" is a *regularization term* in a model, not a separate worldview.
      *   Progress = empirical testing of *reference class selection criteria*.

  6.  **Drafting the Response (Iterative refinement):**

