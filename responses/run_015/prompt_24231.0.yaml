  **(Self-Correction Note):** I need to make sure I don't just say "It's the Reference Class Problem" and leave it at that. I need to explain *why* that causes a decade-long stalemate. It causes it because every time the Outside View proponents say "Use base rates," the Skeptics say "Which base rate?" and the proponents say "The relevant one," and the skeptics say "Determining relevance is the Inside View!" and the loop closes.

