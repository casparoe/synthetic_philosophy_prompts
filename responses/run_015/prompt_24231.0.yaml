      *   *Deepen the Diagnosis:* It's not just base rates; it's the *Reference Class Problem*. This is the technical reason the debate stalls. You can't define the outside view without inside view judgments.
      *   *The "Tool vs. Tribe" Aspect:* Rationalists use "Outside View" as a shibboleth for modesty. Skeptics use "Inside View" as a shibboleth for rigor. It's status signaling disguised as epistemology.
      *   *The Formal Resolution:* Bayesianism doesn't actually distinguish them. It's all $P(H|E)$. The "Outside View" is just $P(H)$ (prior) + some $E$ (class data). The "Inside View" is $P(H)$ + different $E$ (specific data). The fight is about the *likelihood ratio* of specific evidence.
