  In a merger between St. Mary's Surgery (Department A) and Radiology (Department B), administrators propose a shared bonus pool where both departments hold a guaranteed outside option of $40k should negotiations fail. The feasible set of bonus allocations is initially symmetric, but an internal accounting quirk introduces a "tiered fallback lock": if the total agreed surplus exceeds $80k, Department B's internal baseline automatically drops to $25k due to compliance clawbacks, effectively truncating the upper-right quadrant of the feasible set by capping B's maximum achievable utility while leaving A's uncapped. This creates a scenario where the local trade-off rate near the $40k disagreement point remains one-to-one, but the global shape of the Pareto frontier is skewed against B at higher surplus levels, warping the feasible set such that B's ideal point (the maximum possible payoff) is significantly reduced relative to A's without altering the immediate options near the disagreement point.

  **Verdicts and Axiomatic Clash**
  The **Nash Bargaining Solution** maximizes the product of the gains over the disagreement point $(u_A - 40)(u_B - 40)$. Because the local frontier near the disagreement point remains symmetric and the "lock" only activates at higher surplus levels that the Nash solution might not even reach, Nash ignores the truncated upper bound and splits the surplus equally, awarding both departments identical bonuses above the $40k base. In contrast, the **Kalai-Smorodinsky (KS) Solution** equalizes the ratio of actual gain to maximum possible gain (the ideal point). Since the accounting quirk lowers B's ideal point ($b^*$) while A's ($a^*$) remains high, KS dictates that A receives a larger share of the surplus to maintain proportional equality, penalizing B for the structural limitation even if the final agreement stays below the $80k trigger.

  The divergence stems from **Independence of Irrelevant Alternatives (IIA)** versus **Individual Monotonicity**. Nash satisfies IIA, meaning it ignores the removed upper-bound options for B because they were not part of the optimal local set anyway. KS satisfies Individual Monotonicity, requiring that if the feasible set shrinks for one player (B's potential is capped), that player should not benefit relative to the other. A **Nash defender** would attack the KS verdict by arguing that the "tiered lock" is an irrelevant alternative: since the optimal agreement lies below the $80k threshold where the penalty activates, the solution should not be distorted by hypothetical constraints that never bind in practice.
