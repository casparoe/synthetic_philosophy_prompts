prompt: |-
  I do data viz for a public health org and we keep getting asked to make "infographics" that are basically just bar charts with clip art, and I want to push us toward something more like Neurath's pictorial language idea — the Isotype thing where you build diagrams of social facts out of standerdized little pictorial elements, like rows of the same person-figure to show a proportion, so the picture is grounded in countable material stuff instead of just a designer's spin. I want a decison procedure my design team can actually run step by step when we get a statistic we're supposed to turn into one of these panels. For each step I want the question to ask, what counts as a sufficient answer to it, and where the procedure says no and stops. The steps, in order: (1) whether the fact we want to show can even be represented in a pictorial language at all, and what kinds of things resist it — rates, abstractions, negatives, "lack of X," stuff that isn't a countable material thing; (2) how to pick and standardize the elements we build it out of, so the same element means the same thing across all our panels; (3) how to handle scale and proportion, i.e. when the row-of-100-figures trick is the right tool and when it misleads, and what to do when the number is too big or too small to count out by hand; (4) how to check the finished picture for the failure modes Neurath himself was worried about, like a picture that looks more precise than the data actually are, or one that quietly picks a side by what it makes visible and what it leaves out; and (5) where the procedure has to stop and hand the decision back to a person, because choosing which facts to foreground in the first place is an editorial or value call, not something the formalism settles. Mark which steps are judgment calls dressed up as procedure. Then run the whole thing on two concrete facts: the share of a city's households that don't have access to a car, and the change in a region's infant mortality rate over a decade. I suspect the second one hits a wall on a rate-of-change and I want to see exactly where and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a step-by-step decision procedure for a public health design team to move from "bar chart + clip art" to Neurath/Isotype-style pictorial statistics.
      *   **Structure:** 5 specific steps (Suitability, Standardization, Scale/Proportion, Quality Control/Bias, Human Intervention).
      *   **Requirements per Step:** Question to ask, Sufficient Answer, Stop Condition (where it says "No" and halts).
      *   **Meta-Requirement:** Mark which steps are "judgment calls dressed up as procedure."
      *   **Application:** Run the procedure on two specific cases:
          1.  Share of city households without car access.
          2.  Change in region's infant mortality rate over a decade.
      *   **Hypothesis:** The user suspects the second case (rate of change) will fail, and wants to see exactly where and why.

  2.  **Analyze the Isotype/Neurath Philosophy:**

      *   *Core Principle:* "Pictures educate." Visual elements must represent concrete, countable units.
      *   *Avoid:* Abstract rates, percentages without denominators, negative space as data, misleading scaling (area vs. height).
      *   *Standardization:* One icon = $X$ units. Same icon across contexts.
      *   *Neutrality:* Avoid emotional manipulation, but acknowledge that selection is political.
      *   *Limitations:* Isotype struggles with continuous data, rates, complex multivariate relationships, and very large/small numbers without aggregation.

  3.  **Drafting the Decision Procedure (Step-by-Step):**

      *   *Step 1: Suitability (The "Can we?" check).*
          *   Question: Is this a count of concrete entities?
          *   Answer: Yes = People, houses, doses. No = Rates, percentages, abstract concepts, negatives.
          *   Stop: If it's a rate or abstraction that can't be converted to a count.
      *   *Step 2: Standardization (The "Lexicon" check).*
          *   Question: Do we have an agreed-upon icon for this unit, and does it match our existing library?
          *   Answer: Yes = Use existing. No = Design new, add to library.
          *   Stop: If the icon implies emotional valence not in the data (e.g., sad face for sick).
      *   *Step 3: Scale & Proportion (The "Math" check).*
          *   Question: Can the total count be represented by a manageable number of icons (e.g., 1 icon = 1000 people) without losing precision or becoming unreadable?
          *   Answer: Yes = Linear stacking. No = Aggregation or annotation.
          *   Stop: If representing the difference requires fractional icons that look ambiguous.
      *   *Step 4: Quality Control (The "Neurath" check).*
          *   Question: Does the visual imply more precision than exists? Does it hide the denominator?
          *   Answer: No = Good. Yes = Redesign.
          *   Stop: If the visual arrangement suggests causality or comparison not in the data.
      *   *Step 5: Human Intervention (The "Politics" check).*
          *   Question: Have we acknowledged that choosing *this* fact over *that* fact is a value judgment?
          *   Answer: Yes = Document context.
          *   Stop: Procedure ends; human takes responsibility.

      *   *Refining the "Judgment Call" markers:* Steps 1, 4, and 5 are inherently philosophical/political. Step 2 and 3 are more technical but still have design judgment. I need to be explicit about where the "algorithm" pretends to be objective but isn't.

  4.  **Developing the Test Cases:**

      *   *Case 1: Households without car access.*
          *   Data: Count of households (concrete).
          *   Isotype fit: High. Can use house icons.
          *   Potential issue: "Without access" is a negative state. Isotype prefers positive counts. *Correction:* Count households *with* access vs. *without*. Or just count the households in the "without" category as a subset of the total.
          *   Verdict: Passes most steps, needs care on Step 1 (defining the unit).

      *   *Case 2: Infant Mortality Rate (IMR) change over a decade.*
          *   Data: Deaths per 1,000 live births.
          *   Isotype fit: Low. It's a rate, not a raw count. It's a ratio.
          *   Step 1 Failure: You can't draw "0.005 deaths." You can draw deaths, but then you need the denominator (births) to make it a rate.
          *   Step 3 Failure: If the rate drops from 5.0 to 4.8, drawing the difference in icons is impossible without massive scaling that hides the total population.
          *   Verdict: Fails Step 1 fundamentally, maybe limps to Step 3 but breaks there.

  5.  **Refining the Output Structure:**

      *   Introduction: Acknowledge the goal (Isotype revival).
      *   The Procedure: Numbered list with Question, Sufficient Answer, Stop Condition, and [JUDGMENT CALL] tags.
      *   The Test Run: Apply the steps rigorously to Case 1 and Case 2.
      *   Analysis: Explain *why* Case 2 failed (the nature of rates vs. counts).

  6.  **Self-Correction/Nuance Check during Drafting:**

      *   *Critique:* Is Step 1 too rigid? Neurath did show rates sometimes by standardizing the denominator (e.g., "Out of 1000 babies...").
      *   *Adjustment:* Allow Step 1 to pass if the rate can be converted to a standardized denominator count (e.g., "Per 1,000 births"). But warn that comparing two different denominators is hard.
      *   *Critique:* Step 5 is the "Get Out of Jail Free" card. Make sure it emphasizes *documentation* rather than just "ask a boss."
      *   *Critique:* Ensure the distinction between "Bar Chart with Clip Art" (decorative) and "Isotype" (constitutive) is clear in the procedure. The icon *is* the unit, not decoration next to the bar.

  7.  **Final Polish:**

      *   Tone: Professional, slightly academic but practical (matching the user's voice).
      *   Formatting: Clear headers, bold text for emphasis.
      *   Check against the prompt: Did I mark the judgment calls? Did I run both cases? Did I highlight the IMR failure point?

      *(Self-Correction on Case 2)*: The prompt specifically suspects IMR hits a wall on "rate-of-change." I need to make sure the procedure catches the *change* aspect. Comparing two Isotype arrays is possible, but if the numbers are small (rates), the visual difference might be invisible or require fractional icons. I will pinpoint Step 1 (is it a count?) and Step 3 (scale of difference) as the breaking points.

  8.  **Finalizing the Text:** (Drafting the response based on these thoughts.)
      *   *Step 1:* Focus on "Countable Material Units."
      *   *Step 2:* Focus on "Semantic Consistency."
      *   *Step 3:* Focus on "Linear Stacking vs. Area."
      *   *Step 4:* Focus on "False Precision & Omission."
      *   *Step 5:* Focus on "Editorial Selection."

      *   *Case 1:* Passes 1 (Households are countable). Passes 2 (House icon). Passes 3 (Stacking works). Passes 4 (Check denominator). Passes 5 (Why this metric?).
      *   *Case 2:* Fails 1 (Rate is not a count). *Wait*, can we convert? "Deaths per 1000 births." We can draw 1000 babies and color the deaths. But "Change over a decade" means two arrays. If the rate is 5/1000 vs 4/1000, the visual difference is 1 icon out of 1000. That's hard to see. So it might pass 1 technically but fail 3 (Scale/Proportion) because the signal-to-noise ratio is too low for pictorial representation without misleading scaling. I will argue it fails Step 1 primarily because a rate is an abstraction, but Step 3 is where it becomes *visually* dishonest. Let's make Step 1 the hard stop for "Abstraction."

      *   *Refining Step 1:* Neurath's rule: "Do not show what you cannot count." A rate is a calculation. To show it, you must show the *components* of the calculation. If you can't show the denominator, you fail Step 1.
      *   *Refining Step 3:* If the difference is smaller than one icon unit, you cannot show it honestly without breaking the scale.

      Okay, ready to write.
answer: |-
  Here is a decision procedure designed to enforce Isotype principles (pictorial statistics) over decorative charting. It is structured to halt production if the data does not fit the medium, preventing the "bar chart with clip art" failure mode.

  ### The Isotype Decision Procedure

  **Step 1: The Materiality Test**
  *   **Question:** Is the statistic a count of concrete, material entities (people, houses, doses, cases), or is it an abstraction (rate, percentage, index, negative space)?
  *   **Sufficient Answer:** "Yes, this is a count of [Entity]." OR "No, but we can convert it to a standardized count of [Entity] per [Fixed Denominator] without losing the meaning."
  *   **Stop Condition:** If the data is a rate, ratio, or index that *cannot* be expressed as a count of items within a fixed, visible denominator (e.g., "GDP growth," "Happiness Index," "Risk Ratio").
  *   **[JUDGMENT CALL]:** Deciding whether a converted denominator (e.g., "per 1,000 births") preserves the truth or creates a false sense of granularity is a philosophical choice, not a mathematical one.

  **Step 2: The Lexicon Test**
  *   **Question:** Do we have a standardized pictogram for this entity in our library, and is it semantically neutral (does not imply good/bad, sad/happy)?
  *   **Sufficient Answer:** "Yes, we use the standard [Icon] defined in Protocol X." OR "No, we will design a neutral [Icon], add it to the library, and lock it."
  *   **Stop Condition:** If the team proposes designing a unique, expressive, or emotionally loaded icon for this specific chart (e.g., a crying baby for mortality, a smiling doctor for vaccination).
  *   **[JUDGMENT CALL]:** Defining "neutral" is impossible. A silhouette of a person is already a political choice. This step pretends neutrality is achievable through standardization.

  **Step 3: The Scale & Stacking Test**
  *   **Question:** Can the difference between values be represented by whole icons in a linear stack (rows/columns) without using area scaling (making the icon bigger) or fractional icons that are ambiguous?
  *   **Sufficient Answer:** "Yes, 1 Icon = [X Units], and the difference between values is at least 1 Icon."
  *   **Stop Condition:** If representing the data requires scaling the *size* of the icon to match the number (area distortion), or if the difference between two values is less than the value of a single icon unit (making the difference invisible).
  *   **[JUDGMENT CALL]:** Choosing the "1 Icon = X Units" ratio determines whether small fluctuations look massive or invisible. This is a rhetorical choice dressed as a scaling decision.

  **Step 4: The Precision & Omission Test**
  *   **Question:** Does the final arrangement imply more precision than the data supports, or hide the denominator (the total population at risk)?
  *   **Sufficient Answer:** "No, the uncertainty is acknowledged, and the total count (denominator) is visible alongside the subset."
  *   **Stop Condition:** If the graphic shows a subset (e.g., "uninsured") without visually anchoring it to the total (e.g., "total population"), or if the clean lines of the icons suggest exactness where there is statistical margin of error.
  *   **[JUDGMENT CALL]:** Deciding *which* denominator to show (e.g., total population vs. eligible population) changes the political impact of the chart. The procedure flags this but cannot solve it.

  **Step 5: The Editorial Handoff**
  *   **Question:** Have we documented *why* this fact was chosen over other measurable facts, acknowledging that selection is a value judgment?
  *   **Sufficient Answer:** "Yes, the context memo states why this metric was prioritized."
  *   **Stop Condition:** The procedure ends. The responsibility shifts from the designer to the stakeholder/editor.
  *   **[JUDGMENT CALL]:** This entire step is an admission that the previous four steps cannot guarantee objectivity. It is a procedural acknowledgment of human agency.

  ***

  ### Test Run: Case 1
  **Fact:** The share of a city's households that don't have access to a car.
  **Data:** 15,000 households without cars out of 100,000 total households (15%).

  *   **Step 1 (Materiality):** **PASS.**
      *   *Reasoning:* "Households" are concrete material entities. "Without access" is a negative state, but we can count the households *in that state*.
      *   *Conversion:* We treat the 15,000 as the countable unit.
  *   **Step 2 (Lexicon):** **PASS.**
      *   *Reasoning:* Use the organization's standard "House" icon. No emotional valence (no broken car, no sad house).
      *   *Constraint:* Must use the same House icon used for "Households with Internet" or other housing stats.
  *   **Step 3 (Scale & Stacking):** **PASS.**
      *   *Reasoning:* We can set 1 Icon = 1,000 Households.
      *   *Visual:* A block of 100 icons (10x10 grid) represents the city. 15 icons are colored differently (or outlined) to represent the target group.
      *   *Check:* The difference is 15 whole icons. No fractional icons needed. No area scaling.
  *   **Step 4 (Precision & Omission):** **PASS (with annotation).**
      *   *Reasoning:* We must show the full 100-icon grid (the denominator). If we only show the 15 icons, we fail.
      *   *Correction:* Display the 10x10 grid. Shade 15. Label clearly: "15 out of 100 Households."
  *   **Step 5 (Editorial Handoff):** **COMPLETE.**
      *   *Action:* Designer notes: "Stakeholder requested car access focus. Alternative metric 'Access to Public Transit' was available but not selected."

  **Verdict:** This data is **Isotype-Native**. It works because it is a count of discrete objects within a visible total.

  ***

  ### Test Run: Case 2
  **Fact:** The change in a region's infant mortality rate (IMR) over a decade.
  **Data:** Year 1: 5.0 deaths per 1,000 live births. Year 10: 4.8 deaths per 1,000 live births.

  *   **Step 1 (Materiality):** **FAIL.**
      *   *Question:* Is this a count of concrete entities?
      *   *Analysis:* No. It is a **rate** (deaths divided by births). It is a mathematical abstraction derived from two different counts.
      *   *Attempted Rescue:* Can we convert it? We could say "Per 1,000 births, 5 infants died."
      *   *Problem:* The data is not "5 infants." It is "5 infants *per 1,000*." To show this honestly in Isotype, you must visualize the 1,000 survivors *and* the 5 deaths to establish the ratio.
      *   *Stop Condition:* The procedure halts here. A rate is not a "thing" you can pile up. Neurath allowed rates only if the denominator was visually present.
      *   *[JUDGMENT CALL MARKER]:* You *could* force it by drawing 1,000 babies, but that decision pretends a rate is a count.

      *(Let's assume the team argues to proceed by visualizing the standardized denominator, as Neurath sometimes did. We move to Step 3 to see where it breaks.)*

  *   **Step 2 (Lexicon):** **PASS.**
      *   *Reasoning:* Standard "Infant" silhouette. Neutral.
  *   **Step 3 (Scale & Stacking):** **FAIL.**
      *   *Question:* Can the difference be represented by whole icons?
      *   *Analysis:*
          *   Panel A (Year 1): 5 icons colored (deaths) out of 1,000.
          *   Panel B (Year 10): 4.8 icons colored out of 1,000.
      *   *Problem:* You cannot draw 4.8 icons. You must round to 5.
      *   *Result:* Visually, Year 1 and Year 10 look **identical** (5 icons vs 5 icons).
      *   *Alternative:* Change scale to 1 Icon = 0.1 deaths? Now you need 50 icons vs 48 icons. But what does "0.1 of a baby" mean in Isotype? It violates the "countable material thing" rule.
      *   *Stop Condition:* The visual difference (0.2 per 1,000) is smaller than the smallest honest unit of representation. To make the change visible, you would have to exaggerate the scale, which violates Step 4.
  *   **Step 4 (Precision & Omission):** **FAIL.**
      *   *Question:* Does the picture imply more precision than exists?
      *   *Analysis:* If you draw 5 icons for Year 1 and 4 icons for Year 10 (rounding 4.8 down to make a point), you have introduced a 4% visual error to show a 4% statistical change. You are manipulating the integer count to match the float rate.
      *   *Stop Condition:* The graphic would lie about the count to show the rate.
  *   **Step 5 (Editorial Handoff):** **N/A (Procedure Halted).**

  **Verdict:** This data is **Isotype-Hostile**.
  It hits the wall at **Step 1 (Abstraction)** and crashes definitively at **Step 3 (Scale)**.

  ### Why Case 2 Fails (The Neurath Wall)

  You suspected the rate-of-change would hit a wall. Here is the specific mechanical reason why, based on the procedure:

  **Isotype requires integer counts of material objects.**
  Public health metrics like Mortality *Rates* are continuous floats derived from ratios.
  *   To show a **Count** (Case 1): You stack icons. 15 houses vs 85 houses. The eye sees the proportion.
  *   To show a **Rate** (Case 2): You must stack the denominator (1,000 babies) to make the numerator (5 deaths) meaningful.
  *   To show a **Change in Rate** (Case 2): You need to show a difference of 0.2 deaths per 1,000.

  In Isotype, **1 Icon must equal 1 Unit.**
  If 1 Icon = 1 Death, you cannot show 0.2 of a death.
  If 1 Icon = 0.1 Death, you are drawing fractional humans, which violates the "material thing" rule of Step 1.
  If you keep 1 Icon = 1 Death, the change is invisible (5 icons vs 5 icons).

  **The "Bar Chart with Clip Art" Trap:**
  This is exactly why your team defaults to bar charts for Case 2. A bar chart allows you to start the Y-axis at 4.5 instead of 0, exaggerating the difference between 4.8 and 5.0 so it *looks* significant. Isotype forbids this truncation because it breaks the proportional truth of the stack.

  **Recommendation:**
  For Case 2, the procedure dictates you **do not make an Isotype panel.** You should produce a standard line or bar chart with clear confidence intervals, because the "social fact" here is a statistical trend, not a countable pile of objects. Using Isotype here would require lying about the units to make the picture work.
