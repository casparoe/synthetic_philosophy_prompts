answer: |-
  # The Desert and Reward Decision Tree

  This taxonomy maps positions on economic justice by forcing choices on specific logical commitments rather than political affiliation. Follow the branches from the root. Where a question is rendered moot by a previous choice (e.g., asking about *merit* after rejecting *desert*), the path indicates the logical collapse.

  ### **ROOT: The Foundation of Claim**
  **Claim:** *If a person succeeds largely because of natural talents or family wealth they did not choose, they morally deserve the resulting rewards.*
  *   **NO:** (Go to **Branch A: Non-Desert Frameworks**)
  *   **YES:** (Go to **Branch B: Desert Frameworks**)

  ---

  ### **BRANCH A: Non-Desert Frameworks**
  *(Since desert is rejected, questions about isolating effort or counterfactual merit are moot. We move directly to remediation and distribution.)*

  **Node A1: Remediation for Luck**
  **Claim:** *Society should actively compensate individuals for bad luck (disabilities, poor upbringing) to neutralize its effect on their life outcomes.*
  *   **NO:** → **Leaf 1: Fatalistic Egalitarianism** (Unnamed/Incoherent)
      *   *Awkward Commitment:* Accepts that those born into misery should remain there to avoid interfering with natural chance.
  *   **YES:** → **Node A2**

  **Node A2: Institutional Aim**
  **Claim:** *Once luck is compensated, the goal of distribution should be strict material equality for all.*
  *   **YES:** → **Leaf 2: Strict Luck Egalitarianism**
      *   *Awkward Commitment:* Requires intrusive monitoring of personal choices to distinguish between bad luck and voluntary risk-taking.
  *   **NO:** (Aim is Sufficiency or Status) → **Leaf 3: Relational Egalitarianism** `[Inseparable: Democratic Equality]`
      *   *Awkward Commitment:* May permit large material inequalities provided they do not create social hierarchy or stigma.

  ---

  ### **BRANCH B: Desert Frameworks**
  *(Since desert is accepted, we must define what generates it and how it is measured.)*

  **Node B1: The Effort Constraint**
  **Claim:** *We can meaningfully separate the hard work a person chose to do from the natural ability that made that work effective.*
  *   **NO:** → **Leaf 4: Desert Skepticism** (Collapses to Branch A)
      *   *Awkward Commitment:* Must treat a genius's easy output the same as a striver's difficult output, effectively nullifying the "Desert" premise.
  *   **YES:** → **Node B2**

  **Node B2: Structural Debt (Negative Desert)**
  **Claim:** *If someone benefited from historical injustice or unearned privilege, they owe a debt that cancels out their claim to reward, even if they worked hard.*
  *   **NO:** (Clean Slate) → **Node B3**
  *   **YES:** (Debt Exists) → **Node B3** *(Note: This path requires calculating forfeiture before reward.)*

  **Node B3: Timing of Compensation**
  **Claim:** *Society should compensate for bad luck (disabilities, background) BEFORE calculating merit-based rewards.*
  *   **NO:** (Compensate After / Post-Hoc) → **Node B4**
  *   **YES:** (Compensate Before / Level Playing Field) → **Node B4**

  **Node B4: Counterfactual Effort**
  **Claim:** *If a person worked hard but was crushed by unfair barriers, we should reward them for the contribution they WOULD have made in a fair system.*
  *   **NO:** (Reward Actual Output Only) → **Node B5**
  *   **YES:** (Reward Hypothetical Potential) → **Node B5**

  **Node B5: Institutional Aim**
  **Claim:** *The final distribution of resources should be strictly proportional to the calculated desert (merit minus debt plus compensation).*
  *   **YES:** (Proportional) → **See Leaves 5, 6, 7**
  *   **NO:** (Aim is Sufficiency or Equality) → **See Leaves 8, 9**

  ---

  ### **THE LEAVES: Positions and Commitments**

  **Leaf 5: Classical Meritocracy (Libertarian-leaning)**
  *   **Path:** Root=YES → Effort=YES → Neg Desert=NO → Comp=After → Counter=NO → Aim=Proportional.
  *   **Awkward Commitment:** Accepts that a naturally talented person who works lazily may deserve more than a untalented person who works tirelessly.
  *   **Inseparable:** *Right-Libertarianism* (differs only on property rights metaphysics).

  **Leaf 6: Corrected Meritocracy (Reparative)**
  *   **Path:** Root=YES → Effort=YES → Neg Desert=YES → Comp=After → Counter=NO → Aim=Proportional.
  *   **Awkward Commitment:** Requires calculating historical debts across generations, often rendering current salary payments impossible to process administratively.
  *   **Inseparable:** *None.*

  **Leaf 7: Fair Equality of Opportunity (Rawlsian)**
  *   **Path:** Root=YES → Effort=YES → Neg Desert=NO/YES → Comp=Before → Counter=NO → Aim=Proportional/Sufficient.
  *   **Awkward Commitment:** Requires massive, potentially endless investment in leveling childhood conditions, with no guarantee of equal outcomes.
  *   **Inseparable:** *Left-Luck Egalitarianism* (differs only on whether the basis is social contract or moral luck).

  **Leaf 8: Hypothetical Meritocracy**
  *   **Path:** Root=YES → Effort=YES → Neg Desert=NO → Comp=Before → Counter=YES → Aim=Proportional.
  *   **Awkward Commitment:** Rewards people for things they did not actually achieve, based on speculative modeling of their potential.
  *   **Inseparable:** *None.*

  **Leaf 9: Meritocratic Sufficientarianism**
  *   **Path:** Root=YES → Effort=YES → Neg Desert=NO → Comp=Before → Counter=NO → Aim=Sufficient.
  *   **Awkward Commitment:** Disregards excess contribution once the "sufficient" threshold is met, potentially reducing incentives for high innovation.
  *   **Inseparable:** *High Enough Egalitarianism.*

  **Leaf 10: Strict Desertism (No Safety Net)**
  *   **Path:** Root=YES → Effort=YES → Neg Desert=NO → Comp=NO → Counter=NO → Aim=Proportional.
  *   **Awkward Commitment:* Denies aid to those who fail due to bad luck, as aiding them would violate the property rights of the deserving.
  *   **Inseparable:** *Hard Libertarianism.*

  ---

  ### **How to Use This Taxonomy**
  1.  **Locate the Disagreement:** If you and your friend agree on the Root but split at Node B1, you are arguing about psychology/metaphysics (free will), not economics.
  2.  **Identify Inseparability:** If you land on Leaf 7 and your friend lands on Leaf 7 but calls it "Social Democracy," you agree on policy but disagree on justification. This is a semantic, not logical, conflict.
  3.  **Test Coherence:** If you find yourself wanting to answer "Yes" to Root (Desert applies) but also "Yes" to Leaf 2 (Strict Equality), you hold an incoherent position unless you can explain how desert maps to equality.
