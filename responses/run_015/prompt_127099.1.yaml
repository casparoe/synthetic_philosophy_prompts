answer: |-
  This is a profound and well-documented friction within the long-termist and effective altruism communities, though it rarely receives the precise philosophical autopsy you are requesting. You are correct to dismiss the standard heuristics; if negativity bias or loss aversion were the drivers, your colleagues would be *more* obsessed with s-risks (suffering risks) than x-risks (extinction risks). The fact that they are less obsessed suggests a structural feature of their reasoning, not a glitch in their emotional processing.

  I will brainstorm three candidate explanations, evaluate their fit against your constraints, and then commit to the one I find most philosophically robust, offering a term for it, its boundaries, and a test case.

  ### Candidate Explanations

  **1. Implicit Axiological Switching (The "Person-Affecting" Escape Hatch)**
  *   **The Theory:** Your colleagues claim to hold a symmetric axiology (e.g., Total Utilitarianism), but under pressure, they revert to an implicit Person-Affecting View (PAV). Under PAV, we have duties to existing people, but no duties to bring potential people into existence.
  *   **How it fits:** X-risk is framed as killing *existing* humanity (or cutting off *our* trajectory), which PAV condemns. S-risk is framed as creating *new* people who suffer. If those people wouldn't otherwise exist, a PAV adherent might say, "We haven't harmed them; we caused them to exist."
  *   **Why it fails:** You noted these colleagues endorse symmetric axiology explicitly and are sophisticated enough to know that PAV undermines the core long-termist argument for x-risk reduction (which relies on the value of potential lives). Furthermore, s-risks often involve suffering inflicted on *existing* populations in the future (e.g., digital sentience created by current trajectories), not just "new" people. If they dismiss s-risks as "science fiction," they are denying the *probability* of the scenario, not just the *harm* of it. PAV explains why they wouldn't spend money, but not why they deny the epistemic validity of the risk.

  **2. Ontological Asymmetry (Physical vs. Normative Uncertainty)**
  *   **The Theory:** X-risks are often modeled as physical failures (asteroids, unaligned AI capabilities, bioengineered pathogens). S-risks are modeled as normative failures (value lock-in, malicious governance, structural cruelty).
  *   **How it fits:** Risk economists are trained to model physical systems. A 1% chance of a physical catastrophe feels "real" (frequency-based). A 1% chance of a normative catastrophe feels "ambiguous" (Knightian uncertainty). People are ambiguity-averse, but often resolve ambiguity by dismissing the scenario rather than pricing it.
  *   **Why it fails:** This explains the "science fiction" label, but not the spending asymmetry. If anything, deep ambiguity should trigger a stronger precautionary principle (maximin). If they are willing to spend heavily on ambiguous x-risks (e.g., AI alignment, which is deeply normative), they should be willing to spend on ambiguous s-risks. The asymmetry persists even when the x-risk is equally normative (e.g., "AI kills everyone because it misunderstands values" vs. "AI tortures everyone because it misunderstands values").

  **3. The Benevolent Default Heuristic (BDH)**
  *   **The Theory:** Decision-makers implicitly assume a **Presumptive Beneficence of Existence**. They treat the continuation of civilization as the *baseline* (neutral or positive) and extinction as a *deviation* (loss). Conversely, they treat the non-existence of future suffering subjects as the *baseline* and the creation of s-risks as a *deviation* that requires active proof.
  *   **How it fits:** This is not standard status quo bias, because both interventions are active. It is a **Reference Point Slippage**.
      *   For X-risk: The reference point is *Continued Civilization*. Action is *Preservation*. Burden of proof is low (threats to preservation are credible).
      *   For S-risk: The reference point is *Non-Existence of Sufferers*. Action is *Creation/Shaping*. Burden of proof is high (claims that we will actively create hell are treated as speculative).
  *   **Why it succeeds:** It explains the epistemic dismissal ("science fiction") as a defense of the baseline. It explains why symmetric axiology doesn't help (the asymmetry is deontic/normative, not axiological). It explains the spending (we fund preservation duties more readily than benevolence projects).

  ### The Most Plausible Explanation: Deontic Valence Asymmetry

  I find the third candidate the most robust, but I believe it is driven by a deeper motivational engine. I propose we label this phenomenon **Deontic Valence Asymmetry (DVA)**, underpinned by **Mission-Protective Epistemology**.

  **Definition:**
  **Deontic Valence Asymmetry** occurs when agents apply different epistemic standards to risks depending on whether the risk implies a *violation of duty* (extinction) or a *failure of benevolence* (suffering).
  *   **X-risk** is categorized as a **Duty Violation**: "We must not let the light go out." The burden of proof is on the *threat*. If there is a 1% chance the light goes out, we have failed our duty.
  *   **S-risk** is categorized as a **Benevolence Failure**: "We hope the future is good." The burden of proof is on the *claim*. If there is a 1% chance the future is hell, that is a speculative claim about the quality of a gift we are giving.

  **Why this fits your constraints:**
  1.  **Ignores Standard Biases:** Loss aversion applies to *assets*. Colleagues view "Civilization" as an asset to be saved (X-risk). They do not view "Future Sentience" as an asset to be protected from quality degradation; they view it as a potential outcome to be managed. Hence, negativity bias doesn't trigger.
  2.  **Epistemic Dismissal:** Calling s-risks "science fiction" is a way of maintaining the **Benevolent Default**. If s-risks are plausible, then the default trajectory of civilization is not positive, but potentially negative. This undermines the core narrative of "Long-termism" as a positive project.
  3.  **Symmetric Axiology Survives:** One can believe suffering equals negative happiness (axiology) while simultaneously believing we have a stronger duty to prevent non-existence than to ensure quality of existence (deontology). This is a common, often unacknowledged, hybrid view.
  4.  **Active Spending:** We spend actively on duties (police, firewalls, defense). We spend less actively on optimizing benevolence (charity, art, utopian engineering), especially under uncertainty.

  **The Motivational Core: Mission-Protective Epistemology**
  There is a pragmatic reason this asymmetry persists. If s-risks are taken as seriously as x-risks, it potentially **inverts the value of x-risk work**.
  *   If the future is likely net-positive, preventing extinction is overwhelmingly good.
  *   If the future is likely net-negative (high s-risk probability), preventing extinction might be *bad* (locking in suffering).
  *   Acknowledging s-risks introduces the possibility that the foundation's core mission (ensuring there *is* a future) is morally hazardous.
  *   Therefore, the "science fiction" dismissal is a **Immune Response** protecting the organization's reason for being. It is not necessarily cynical; it is a cognitive immune system protecting the coherence of their life's work.

  ### Edges and Boundaries

  Does this asymmetry hold elsewhere?

  1.  **Pandemic vs. Extinction:**
      *   If a pandemic kills 10% of humanity (non-existential), it is treated as a tragedy (Duty).
      *   If a pandemic causes 10% of humanity to live in chronic agony (non-existential s-risk), it is treated as a healthcare challenge (Benevolence/Mitigation).
      *   *Prediction:* The DVA holds for non-existential risks too, provided the "suffering" outcome is framed as a quality-of-life issue rather than a rights violation. If the suffering is framed as "torture by a regime" (Duty violation), they will care. If it is "structural suffering in a complex economy" (Benevolence failure), they will dismiss it.

  2.  **Climate Change:**
      *   Sea-level rise displacing millions (Loss of asset/home) = Urgent.
      *   Heat stress causing massive aggregate suffering without death (Quality degradation) = Less urgent, often framed as "adaptation."

  3.  **The "Lock-In" Edge:**
      *   The asymmetry collapses if the s-risk is framed as **Permanent**. If colleagues are convinced that an s-risk involves *permanent* value lock-in (e.g., a dictator who lives forever), the "Duty" frame activates (We must not lock in tyranny). The dismissal usually applies to *transient* or *uncertain* suffering.

  ### A Test Case

  To determine if **Deontic Valence Asymmetry** is the driver, rather than simple epistemic skepticism, propose the following thought experiment in a meeting:

  **The "Poisoned Chalice" Scenario:**
  > "Imagine we have a technology that guarantees civilization continues for 1 billion years (eliminates x-risk). However, our best models show a 5% chance that this specific technology creates a permanent caste of digital beings in extreme suffering (s-risk). The other 95% is net positive.
  >
  > Do we deploy?"

  **Interpretation of Responses:**
  *   **If they say "No, too risky":** They are consistent expected-value maximizers. The asymmetry was purely epistemic (they didn't believe s-risks were real).
  *   **If they say "Yes, 95% positive is worth it":** They are applying a **Presumptive Beneficence** heuristic. They view the continuation of civilization as the primary good, and suffering as a regrettable cost.
  *   **If they say "We need more proof on the 5%":** This confirms **Deontic Valence Asymmetry**. They are applying a higher burden of proof to the negative tail than they would to a positive tail (e.g., "5% chance of utopia" would not block deployment).

  **A Stronger Test (The Inversion):**
  > "Suppose we discover that extending civilization's lifespan *increases* the probability of s-risks linearly. Every century we survive adds a 0.1% chance of a global suffering lockdown. Does 'saving the future' remain our top priority?"

  *   If they hesitate or reframe the question, you have identified **Mission-Protective Epistemology**. The asymmetry is not just about risk; it is about the moral valence of *existence itself*.

  ### Conclusion

  The phenomenon you are observing is **Deontic Valence Asymmetry**. It is not a failure of calculation, but a feature of how your colleagues structure moral responsibility. They view themselves as **Guardians** (duty to prevent loss of the asset) rather than **Architects** (duty to ensure quality of the construction).

  Standard biases fail to explain this because they are affective; this is normative. Your colleagues are not *afraid* of the s-risk calculation; they are *resistant* to the deontic shift it requires. Accepting s-risks as credible moves them from "Saving Humanity" (a clear hero narrative) to "Managing Moral Risk" (a complex, potentially paralyzing narrative). The "science fiction" label is the boundary marker where the Hero Narrative ends and the Moral Hazard begins.

  To make progress, do not argue the probabilities. Argue the **Duty**. Frame s-risk reduction not as "optimizing the future" (Benevolence) but as "preventing moral contamination of the trajectory" (Duty). If you can shift the deontic frame, the epistemic resistance will likely follow.
