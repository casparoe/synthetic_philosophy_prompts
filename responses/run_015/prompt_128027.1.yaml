answer: |-
  **The Weight of Absence: Why Omissions Are Real Causes**

  The question of whether omissions are genuine causes or merely background conditions is a staple of metaphysical debate, but it becomes urgent when applied to distributed responsibility. Consider the case of three adjacent towns—A, B, and C—sharing a flood levee system. Each town is responsible for a segment. All three skip repairs. A storm hits the boundary junction, breaching the levee and causing damage. Did the towns' collective omission cause the damage, or did the storm cause it while the towns merely failed to intervene?

  To answer this, we must weigh the **Physical Process View** against the **Counterfactual Dependence View**. The Physical Process View argues that causation requires a physical connection, typically involving the transfer of energy or momentum. On this account, the storm is the cause; it supplied the kinetic energy that destroyed the property. The towns' inaction supplied no energy; an absence cannot push, pull, or break. Therefore, omissions are not causes but rather the absence of preventers.

  Conversely, the Counterfactual Dependence View (associated with David Lewis) argues that $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. In the levee case, had the towns not omitted their duty (i.e., had they repaired the levee), the damage would not have occurred. The damage depends on the omission. Therefore, the omission is a cause.

  While the Physical Process View offers ontological cleanliness, it fails to capture the reality of macroscopic systems where human agency operates. I conclude that **omissions are real causes**, specifically within the domain of special sciences (like engineering, law, and history). To deny this is to render the concept of causation useless for explaining the world we actually inhabit. However, this conclusion relies on accepting that causation is not a monolithic physical relation but a difference-making relation relative to a system's norms.

  **The Distributed Problem and the Physicalist Intuition**

  The distributed nature of the levee case sharpens the conflict. If Town A had repaired its segment, but B and C had not, the water might still have breached at the B-C junction. This suggests that no single town's omission was sufficient. The Physical Process View seizes on this: the storm is the only common denominator with positive energy. The towns are passive. To call their inaction a "cause" seems to invite an explosion of causes: did the lack of a superhero flying in to hold the water back also cause the flood? If absences are causes, then everything that didn't happen is a cause of everything that did.

  This is the strongest argument for the Physical Process View: it preserves the asymmetry of causation. The storm actively disrupted the status quo; the towns passively allowed it. In fundamental physics, there are no "shoulds," only "is." Without a normative expectation that the towns *ought* to repair the levee, their inaction is physically indistinguishable from a rock not repairing the levee.

  **Why Counterfactual Dependence Wins in Macroscopic Systems**

  However, we do not live in fundamental physics. We live in a world of systems designed for stability. In engineering and social systems, "cause" is not about energy transfer; it is about **control and vulnerability**.

  In the three-town case, the levee system is a control mechanism designed to negate storm energy. The system's failure is not an external event like the storm; it is an internal state of the levee system. The "breach" is not just water moving; it is the *failure of the barrier*. The barrier failed because it was not maintained. The omission is the structural explanation for why the storm's energy was effective.

  If we treat omissions merely as background conditions, we lose the ability to distinguish between a flood caused by a levee breach and a flood caused by a storm of unprecedented magnitude that would have breached even a perfect levee. Both involve the storm transferring energy. But in the first case, the damage was preventable (counterfactually dependent on the omission); in the second, it was not. To explain *why* the damage happened *here and now*, we must cite the omission.

  Therefore, in the distributed levee case, the collective omission is a real cause. It is the variable that, if manipulated, changes the outcome. The storm is a *trigger*, but the omission is the *structural cause*. Without the omission, the trigger is harmless. In safety engineering, the structural cause is the primary target of investigation, not the trigger.

  **Conclusion**

  Omissions are real causes. The Physical Process View describes the transfer of energy, but the Counterfactual Dependence View describes the transfer of *risk*. In distributed cases like the three towns, the collective omission creates a specific vulnerability that the storm exploits. To say the storm "really" caused it is to confuse the mechanism of destruction with the explanation of failure. Causation is a tool for explanation, and an explanation that ignores the preventable nature of the event is incomplete. Thus, the towns' failure to act is causally on par with the storm's action.

  **What Would Change My Mind**

  I would abandon this conclusion if it could be demonstrated that treating omissions as causes systematically degrades predictive accuracy in complex systems. Specifically, if a purely physicalist model (counting only positive energy transfers) could generate better risk assessments for engineering or legal systems than a model that includes omissions, I would concede that omissions are merely heuristic background conditions. If counting omissions as causes introduces "noise" that obscures the actual physical levers of control—for example, if blaming the omission distracts from redesigning the levee to withstand storms without maintenance—then the pragmatic utility of calling them "causes" vanishes.

  **The Weakest Link**

  The weakest link in this reasoning is the reliance on **normative expectations** to define the causal model. My argument hinges on the idea that the towns "ought" to have repaired the levee, which makes their omission salient against a background of expected maintenance. If there were no norm or duty to repair, their inaction would be physically identical, yet I argue it would be less "causal." This suggests that my definition of causation is partially moralized. If causation is supposed to be a mind-independent feature of the world, relying on human norms to identify causes is a vulnerability. A critic could argue that I have not proven omissions are *ontologically* real causes, but only that they are *useful fictions* for assigning blame. I accept this risk, but maintain that for human affairs, utility constitutes reality.
