  my tutor keeps saying national character works exactly like individual personality — she says if we can measure the Big Five for a person we can average it across a country and call it 'the Dutch profile', just like averaging temperatures gives you a climate. she uses this to argue it's perfectly fine to generalise about peoples in policy briefs. can you audit the analogy? i want the mapping table — what corresponds to genes, to childhood feedback, to consistency across situations, to the unitary self — then the disanologies: does a nation have the kind of integreated psychology that makes trait-talk meaningful for individuals? she also sneaks in this idea that national character is like a distributed cognitive style, like a hive having a collective temperature preference, to justify treating census averages as mental states. does that patch the analogy or just muddy it further?

  give me a committed take: does the analogy actually hold enough to license generalising about peoples, or does it fall apart? please answer in british english, and don't sit on the fence — i want your definite view with reasons, not just a list of options.
