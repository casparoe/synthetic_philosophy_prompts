answer: |-
  ### Step 1: Brainstorming & Philosophical Excavation

  You have identified a genuine tension, one that sits right at the fault line between ancient ethics and modern capitalism. Let's unpack the machinery here before we label it.

  **The Ancient View (Epictetus/Marcus):**
  The Stoics posited the *Dichotomy of Control* (or the Trichotomy, in Irvine's modern update).
  *   *Externals:* Wealth, reputation, health, employment. These are *not* up to us (*ouk eph' hemin*). They are subject to *Tyche* (fortune/luck). To attach your happiness to them is madness.
  *   *Internals:* Judgment, assent, desire, aversion. These *are* up to us. This is the *hegemonikon* (ruling faculty).
  *   *The Nuance:* The Stoics were determinists (compatibilists). They believed in *Heimarmene* (cosmic fate). Even the *hegemonikon* is part of the causal web. However, for the purpose of ethics, they treated the *moral choice* as the only locus of responsibility. Crucially, they acknowledged that the *capacity* to choose well varies. A fool, a child, or a madman has a damaged *hegemonikon*. Virtue is a skill (*techne*) that takes a lifetime to master, and most people never become Sages.

  **The Modern Productivity View:**
  *   *Externals:* Same as Stoics. Don't stress the layoff. (This reduces anxiety, making you a calmer worker).
  *   *Internals:* Discipline, habits, output, "grind." (This increases output, making you a more profitable worker).
  *   *The Distortion:* The modern blogger conflates *moral assent* (Stoic) with *executive function* (Neuroscience/Productivity). They treat the ability to execute a habit (cold showers, journaling) as identical to the moral choice to be virtuous. They assume the *capacity* for executive function is uniform across all humans and immune to biology, trauma, or neurochemistry.

  **The Pattern:**
  1.  **Externalize Fate:** "The layoff wasn't your fault." (Reduces liability for the employer/economy).
  2.  **Internalize Freedom:** "The failure to hustle is your fault." (Increases liability for the individual).

  This isn't just hypocrisy; it's a specific structural manipulation of the Dichotomy of Control. It creates a system where risk is socialized (external bad luck is fate) but reward is privatized (internal success is will).

  ### Step 2: Naming and Defining the Phenomenon

  There is no single established term in the history of philosophy that captures this specific modern hybrid. "Toxic Stoicism" is a pop-psychology slur, not a concept. "Neoliberal Stoicism" describes the movement, not the logical mechanism.

  I propose we name this phenomenon: **Agential Asymmetry**.

  More precisely, it is **The Asymmetric Dichotomy of Control**.

  **Definition:**
  *Agential Asymmetry* is the rhetorical and philosophical practice of applying determinism to external events (to mitigate anxiety regarding misfortune) while simultaneously applying libertarian free will to internal states (to enforce accountability for productivity), thereby denying the existence of "internal luck" (biology, neurochemistry, upbringing) that influences the capacity for agency itself.

  ### Step 3: The Carving (Boundaries and Distinctions)

  You asked for the carving—where the edges lie. Here is how *Agential Asymmetry* is distinct from related critiques and where it collapses.

  #### 1. What It Is NOT: The Structural Critique
  *   **The Structural Critique:** Argues that "externals" (wealth, jobs) are *not* actually outside our control because systemic injustice (racism, classism) riggs the game. It attacks the *External* side of the Dichotomy.
  *   **Agential Asymmetry:** Accepts the External side of the Dichotomy (yes, layoffs are luck) but attacks the *Internal* side. It claims the Internal is *more* controllable than the Stoics ever argued.
  *   **The Boundary:** If the argument is "The system is rigged," that is structural critique. If the argument is "Your brain is fully yours to command, regardless of the system," that is Agential Asymmetry.

  #### 2. What It Is NOT: Authentic Stoicism
  *   **Authentic Stoicism:** Distinguishes between *Virtue* (acting with wisdom/courage) and *Outcomes* (completing the habit). If you try to journal but have a depressive episode that prevents you, the Stoic asks: "Did you act with kindness toward yourself and reason within your capacity?"
  *   **Agential Asymmetry:** Conflates *Virtue* with *Compliance*. If you miss the journaling, you lack "discipline" (a vice). It treats the *capacity* for will as a moral choice rather than a biological endowment.
  *   **The Boundary:** Ancient Stoicism allows for the "Sick Soul" (the fool who cannot yet reason well). Agential Asymmetry assumes all souls are equally healthy and only differ in "wanting it enough."

  #### 3. What It Is NOT: Standard Self-Help
  *   **Standard Self-Help:** Often promises external rewards for internal effort ("Do this morning routine and get rich").
  *   **Agential Asymmetry:** Uses Stoic *acceptance* to dampen the desire for external rewards ("Don't want the money, want the discipline") while keeping the *pressure* of the routine. It uses the shield of Stoicism to block anxiety, but keeps the sword of Productivity to drive performance.

  ### Step 4: Where It Collapses (The Edge Cases)

  Every philosophy has a breaking point where its abstraction meets reality. For *Agential Asymmetry*, the collapse occurs at **Neurobiology and Trauma**.

  1.  **The Biological Edge:**
      *   *The Claim:* "Willpower is a muscle you can build infinitely."
      *   *The Collapse:* ADHD, clinical depression, or burnout. These are not "judgments" (Stoic *dogmata*); they are physiological states that impair the *hegemonikon*. When the blogger says "You just didn't want it enough" to a depressed person, the philosophy breaks because it denies the causal reality of serotonin, dopamine, and cortisol. It treats the *instrument* of choice (the brain) as if it were the *agent* of choice (the self).

  2.  **The Developmental Edge:**
      *   *The Claim:* "You can reprogram your mind today."
      *   *The Collapse:* Childhood conditioning. The Stoics acknowledged that impressions (*phantasiai*) are shaped by upbringing. If your "internal landscape" was built by abuse or neglect, the *capacity* to assent rationally is compromised. Agential Asymmetry ignores the *history* of the will.

  3.  **The Ethical Edge:**
      *   *The Claim:* "Discipline is the highest good."
      *   *The Collapse:* When discipline becomes self-harm. Authentic Stoicism aims for *Eudaimonia* (flourishing). If the "iron discipline" leads to burnout or estrangement, it fails the Stoic test of Nature. Agential Asymmetry often values the *grind* over the *flourishing*, inverting the Stoic goal.

  ### Summary of the Concept

  **Name:** Agential Asymmetry (or The Asymmetric Dichotomy of Control).

  **Core Mechanism:**
  $$ \text{External Events} \rightarrow \text{Determinism (Luck)} \rightarrow \text{No Blame} $$
  $$ \text{Internal States} \rightarrow \text{Libertarian Free Will} \rightarrow \text{Total Blame} $$

  **The Philosophical Error:**
  It commits a **Category Mistake**. It treats *Executive Function* (a biological capacity subject to luck) as if it were *Moral Agency* (a philosophical capacity subject to choice).

  **The Verdict:**
  You have identified a "Neoliberal Co-opting" of the Dichotomy of Control. It keeps the *comfort* of Stoicism (don't worry about the layoff) but discards the *compassion* of Stoicism (be gentle with your own limitations). It is a philosophy designed to produce resilient workers, not virtuous sages.

  **How to spot it:**
  Whenever a teacher advises you to accept external hardship as "fate" but frames internal struggle as "failure," check for **Agential Asymmetry**. Ask: *"Is this lack of discipline a moral failing, or is it a biological constraint?"* If they refuse to answer, you have found the edge of the map.
