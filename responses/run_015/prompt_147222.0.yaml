  **Predicted Data and Mechanisms**
  Under the **Orwellian** account, the subject consciously experiences the red spot at location A during the ISI. This conscious state occupies the global workspace, rendering the probe consciously accessible. **Data:** High correlation between probe detection accuracy and wagering (robust metacognition). Under the **Stalinesque** account, the system is unconsciously drafting the motion narrative during the ISI; no conscious experience exists yet. The probe is processed pre-consciously. **Data:** Probe detection above chance (priming) but wagering at chance level (metacognitive blindness). The mechanism hinges on whether the interval state supports second-order access.

  **Load-Bearing Feature and Removal**
  The load-bearing feature is **metacognitive access to interval probes**. If wagers are removed, both accounts predict similar probe detection rates (via conscious sight or unconscious priming), causing the behavioral divergence to collapse and the accounts to become empirically equivalent again.

  **Neutralizing Moves**
  The Stalinesque theorist claims a pre-conscious draft can leak into the response (wager) without ever being conscious. This does **genuine work**: it challenges the standard psychophysical assumption that metacognition requires consciousness, testing the functional definition of the mental state. The Orwellian theorist claims revision can be fast and complete enough to leave no trace of the probe. This is **ad hoc**: memory overwriting rarely erodes metacognitive confidence completely without leaving interference artifacts. If the Stalinesque reply holds (unconscious drafting supports wagering), this design fails to distinguish the accounts, vindicating the equivalence thesis.

