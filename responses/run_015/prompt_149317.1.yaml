answer: |-
  # Activity: "The Reservoir Protocol"

  **Time:** 25 minutes (Activity) + 50 minutes (Debrief & Discussion)
  **Class Size:** 18 Students
  **Stakes:** Participation Points (PP) + Time Privilege (5 mins early dismissal)
  **Materials:** 18 Blue Slips, 18 Red Slips, 2 Collection Boxes ("Maintenance" & "Reinforcement"), A "Blame/Praise" Whiteboard, Timer.

  ## 1. The Setup (5 Minutes)
  Do not use the word "supererogation." Tell the students they are **Engineers** managing a dam. The "Water Level" is a metaphor for the seminar's collective success metric.

  **The Rules (Read Aloud):**
  1.  **The Goal:** The class must generate **100 Stability Points** to avert a "Breach."
      *   **If Breach Averted:** Everyone gets **+1 Participation Point** and class ends **5 minutes early**.
      *   **If Breach Occurs:** No bonus point, class runs the **full time**.
  2.  **Required Duty (Blue Slip):** Every engineer *must* complete a "System Check."
      *   **Task:** Write your name and one definition from last week's reading on a Blue Slip. (Time: 1 min).
      *   **Value:** 4 Points each. (18 students × 4 = 72 Points).
      *   **Penalty for Omission:** If you do not submit a Blue Slip, you receive a **"Negligence Mark"** on your permanent record (Blame) and lose **2 Participation Points** personally, regardless of the group outcome.
  3.  **Optional Action (Red Slip):** Engineers *may* choose to "Reinforce the Wall."
      *   **Task:** Write your name and a 3-sentence argument applying a theory to a real-world crisis on a Red Slip. (Time: 3 mins).
      *   **Value:** 4 Points each.
      *   **Incentive:** If you submit a Red Slip, your name goes on the **"Hero Board"** (Praise).
      *   **Penalty for Omission:** **None.** You lose no points, receive no Blame, and your record remains clean.
  4.  **The Math:**
      *   Total Points Needed: **100**.
      *   Points from Required (Blue): **72**.
      *   **Deficit:** **28 Points**.
      *   **Required Optional Acts:** You need **7 Red Slips** to reach 100 (7 × 4 = 28). *Wait, 7 is too low for 18 students. Let's adjust.*
      *   **Revised Math:**
          *   Required: 3 Points each. (18 × 3 = 54).
          *   Threshold: 100 Points.
          *   Deficit: 46 Points.
          *   Optional: 4 Points each.
          *   **Need:** **12 Red Slips** (12 × 4 = 48). Total = 102.
          *   **Ratio:** 12 out of 18 students (66%) must perform the optional act to save the group.

  **Distribution:** Hand out the Role Cards (identical for everyone) containing these rules. Give them 2 minutes to read silently. Emphasize: *"The Red Slip is strictly optional. You will not be penalized individually for keeping it in your pocket."*

  ## 2. The Simulation (15 Minutes)
  1.  **Phase 1 (Required):** Give 3 minutes for Blue Slips. Collect them in the "Maintenance" box. Count them publicly. (Should be 18). Write "72 Points" on the board.
  2.  **Phase 2 (The Gap):** Reveal the Threshold (100). Show the Deficit (28). Remind them only Red Slips close the gap.
  3.  **Phase 3 (Optional):** Give 5 minutes for Red Slips. Place the "Reinforcement" box at the front.
      *   **Crucial Facilitation:** Do not coerce. Do not say "We need more." Stand silently. If they ask "Is this required?" repeat: *"Individually, no. Collectively, we need 12."*
      *   **Tracking:** As Red Slips come in, write names on the "Hero Board" (Praise). Keep a running tally of points.
  4.  **Phase 4 (Resolution):**
      *   **Scenario A (Success):** If 12+ Red Slips arrive, announce "Breach Averted." Award the points/time.
      *   **Scenario B (Failure):** If <12 arrive, announce "Breach Occurred." No bonus points. Class continues full time.
      *   **Note:** Even in Failure, ensure students who *omitted* the Red Slip receive **no individual penalty**. This is vital for the debrief.

  ## 3. The Debrief (50 Minutes)
  *Do not start with theory. Start with their feelings.*

  **Part 1: The Phenomenology of Omission (15 mins)**
  Ask the students who *did not* submit a Red Slip:
  *   "Check your participation record. Did you lose points? Did you get a Blame Mark?" (No).
  *   "So, by the rules of the game, were you wrong to keep the Red Slip?" (Technically no).
  *   "Then why did some of you feel hesitation, guilt, or pressure?"
  *   **Map to Concept (i):** This establishes the **Non-Blameworthiness**. The omission was permissible by rule, yet felt morally weighted.

  **Part 2: The Collective Pressure (15 mins)**
  Ask the students who *did* submit a Red Slip:
  *   "Why did you do it? Was it for the Praise on the Hero Board?" (Usually no, praise is weak).
  *   "Was it to ensure the group got the early dismissal?" (Yes).
  *   "If you knew for a fact that 11 other people were definitely doing it, would you have done it?" (Likely no—reveals the free-rider incentive).
  *   **Map to Concept (ii):** This establishes the **Collective Necessity**. The act feels required because the *outcome* is necessary, even if the *individual duty* is not. This creates the "Threshold" tension.

  **Part 3: The Stability of the Distinction (20 mins)**
  Introduce the term **Threshold Supererogation**.
  *   **Discussion Question:** "If we run this game every week, and every week we need 12 Red Slips to avoid a 'Breach,' does the Red Slip remain optional next week? Or does it become a duty?"
  *   **Theory Connection:** Connect to J.O. Urmson (Saints and Heroes) vs. David Heyd.
      *   *Urmson:* If we demand these acts, we lower the moral bar for everyone.
      *   *Heyd:* Supererogation is essentially non-required. If the group depends on it, the distinction collapses.
  *   **Map to Concept (iii):** This explores the **Instability**. When supererogatory acts become collectively necessary for basic welfare, social pressure converts them into "quasi-duties." The game shows how the *context* (scarcity/crisis) shifts the *category* of the act.

  ## 4. Predictable Failures & Troubleshooting

  **Failure 1: The "It's Basically Required" Pushback**
  *   **What happens:** Students argue that because the group loses the bonus if they don't act, the act *was* required, making the game a lie.
  *   **Handle it:** Acknowledge this is the *point*. "You are feeling the exact philosophical tension we are studying. The rule says 'optional,' the consequence says 'necessary.' Your discomfort is the data."
  *   **Prevention:** Be rigid about the individual penalty. If a student didn't do the Red Slip, explicitly state: *"Your individual record is clean. You are not in trouble."*

  **Failure 2: Threshold Miscalculation**
  *   **What happens:** You get 11 Red Slips (Failure) or 18 Red Slips (Too easy).
  *   **Handle it:**
      *   *If 11 Slips:* Let the Breach happen. The failure is more pedagogically potent than success. It proves the "Tragedy of the Commons."
      *   *If 18 Slips:* In the debrief, ask: "Why did 100% comply if it was optional?" This reveals how strong social signaling is in a seminar room.
  *   **Prevention:** The 12/18 threshold (66%) is statistically safe for undergrads who want to please the professor but hesitate at extra work.

  **Failure 3: The Praise Feels Patronizing**
  *   **What happens:** Students roll eyes at the "Hero Board."
  *   **Handle it:** Keep the praise formal and dry. "Thank you for your contribution." Do not over-celebrate. The value must come from the *collective save*, not the professor's approval.

  **Failure 4: Collusion/Signaling**
  *   **What happens:** Students text each other: "I'll do it if you do it."
  *   **Handle it:** Allow it. This mirrors real-world coordination problems. In the debrief, ask: "Did making a pact change the moral status of the act?"

  ## 5. Limitations (What the Game Can't Reproduce)
  *Be honest about this in the final 10 minutes.*

  1.  **Low Stakes:** Writing a 3-sentence argument is not jumping on a grenade. Real supererogation involves significant sacrifice (risk, money, time).
      *   *Supply in Discussion:* Ask them to scale the cost. "If the Red Slip cost you $500, or 10 hours of your weekend, would 12 of you still do it? If not, does the collective need still make it required?"
  2.  **Known Threshold:** In the game, they know exactly how many are needed (12). In real life (e.g., climate change), the threshold is unknown.
      *   *Supply in Discussion:* "Does uncertainty make it easier to free-ride? If we didn't know if 5 or 15 were needed, would you act?"
  3.  **Coordinator Presence:** You (the professor) are watching. Real supererogation often happens anonymously.
      *   *Supply in Discussion:* "If the Red Slips were anonymous and no Hero Board existed, would the number drop? Does supererogation require recognition?"

  ## 6. Design Rationale
  *   **Why 12/18?** It forces a majority but leaves a significant minority (6 students) who can free-ride without dooming the project *if* the others step up. This isolates the free-rider dynamic.
  *   **Why Points + Time?** Participation points appeal to grade anxiety; early dismissal appeals to immediate comfort. Using both ensures engagement across different student motivations.
  *   **Why Silence?** Your silence during Phase 3 is the variable. If you persuade them, you turn it into a duty. If you stay silent, you test their intrinsic moral motivation vs. prudential calculation.
  *   **Why "Hero Board"?** It satisfies the prompt's requirement for "Praise but no token reward." It highlights that social capital is the only intrinsic reward for supererogation.

  This design commits to a single simulation that forces the students to *inhabit* the definition of threshold supererogation before they ever hear the term, ensuring the debrief lands on lived experience rather than abstract speculation.
