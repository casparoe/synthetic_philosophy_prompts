  I have recently become active in community organising and have grown persuaded by Simone Weil's claim that political parties are structurally corrupting rather than merely prone to abuse. On my reading, she holds that the party form necessarily replaces individual moral judgement with collective loyalty, generating an epistemic closure that distorts both policy and character regardless of ideology. This seems especially salient today, when digitally networked "movement-parties" claim to have abolished traditional hierarchy yet still enforce doctrinal conformity through algorithmic visibility and social sanction.

  What would genuinely count against this position? I want an honest map of its vulnerability: the specific observations, historical patterns, conceptual distinctions, or empirical findings that would weaken or overturn it, ranked by how damaging they are. Which failures of party behaviour, which sustained examples of internal dissent without fragmentation, and which formal analyses of collective decision-making do defenders of Weil's abolitionism themselves accept as threatening? Which apparent successes—parties advancing genuinely emancipatory legislation—do they dismiss as superficial, and on what grounds? Conversely, has the view been qualified into unfalsifiability, such that any party achievement can be reinterpreted as accidental or as masking a deeper corruption?

  Please respond in British English, dividing your answer into the following sections with approximate lengths:

  - The position restated (about 100 words)
  - Concessions that defenders would make (about 200 words)
  - Decisive defeaters (about 300 words)
  - Merely awkward counter-evidence (about 200 words)
  - Assessment of insulation and unfalsifiability (about 250 words)
  - Verdict on the position's exposure (about 150 words)
