prompt: |-
  Quick context: I'm an ML engineer working on RLHF and multi-agent reward modelling, so the vocabulary I actually think in is per-annotator reward models, pairwise preference data, reward identified only up to a positive affine transform, normalisation, scalarisation weights, Pareto fronts, gradient domination, and off-policy evaluation. I keep bumping into the old fight about whether utility can be compared across people, and I suspect half of it is my problem in a costume, so I want the translation.

  Take the main moves — the ordinalist line that only intrapersonal ordinal rankings are legit and the rest is unscientific, the veil-of-ignorance style move where you aggregate expected utilities behind uncertainty about who you'll be, the partial-comparability line where only levels or only units are comparable, the utility-monster objection to summing, and the levelling-down objection to caring about equality — and restate each in my terms as faithfully as you can. Then the residue report: which of them translate cleanly onto the normalisation and scalarisation problem I already have, which only fit if you smuggle in something my framework doesn't give you, and which have no counterpart in it at all.

  The part I most want: suppose tomorrow someone hands me a perfect calibration oracle that outputs everyone's utility on one common cardinal scale, no noise, no affine ambiguity. My hunch is that this settles the measurement half of the dispute and leaves the aggregation half exactly where it was, and that people conflate the two. Is that right, or does the very idea of a common scale secretly presuppose an answer about how to combine utilities once you have them? Where the translation fails, tell me honestly whether that's my vocabulary missing something or the philosophers' disagreement being thinner than it looks.
