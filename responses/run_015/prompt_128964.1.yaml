answer: |-
  1. The Proposition Stated
  The proposition asserts Thermidor resulted primarily from structural dissipation: the exhaustion of state capacity and legitimacy due to administrative over-centralization and wartime fiscal extraction. This contrasts with the ideological dialectic, positing that virtue's logic necessitated Robespierre's elimination. Primary causation denotes the precondition without which the coalition against Robespierre lacks energy to strike. Conceptual evidence involves correlating timelines of material scarcity and conscription resistance against rhetorical escalations. If economic indices bottom out before the rhetorical peak, structure dominates. If purges accelerate independent of material conditions, ideology dominates. The claim privileges systemic entropy.

  2. Decomposition of Credence
  First, the thesis that revolutions devour their children operates more as a post-hoc narrative pattern than a reliable historical law. It imposes a tragic arc onto contingent political maneuvering, reducing its explanatory weight to 0.60. Structural fatigue is often misread as moral purification as it offers a cleaner story. Second, the legitimacy-entropy model plausibly applies to the fiscal-military crisis of 1794. The state faced hyperinflation and supply chain collapse, meaning the regime ran out of energy to enforce compliance, weighting this factor at 0.80. The machine stopped grinding under its own demands. Third, the withdrawal of sans-culotte support is better explained by supply failure and conscription fatigue than by disenchantment with the Republic of Virtue. Hunger drives politics more reliably than philosophy, assigning 0.75 probability to material exhaustion as the catalyst for popular passivity. When bread disappears, virtue becomes abstract. Fourth, Robespierre's rhetoric and the reorganization of the Revolutionary Tribunal in June 1794 made his fall ideologically overdetermined regardless of external pressure. However, this rhetoric required allied conspiracy to succeed, limiting its standalone causal force to 0.50. Words alone do not topple regimes without cracks. These terms combine via a weighted average, prioritizing material conditions over rhetorical triggers. The fiscal crisis and popular withdrawal exert the strongest pull, suggesting the ideological spark required structural tinder to ignite. The narrative pattern is discounted heavily, while the entropy model receives premium weighting due to its explanatory scope regarding the coalition's breadth. The convergence of economic collapse and administrative paralysis creates the necessary vacuum for the conspiracy to succeed without immediate popular backlash. Ideology provides the justification, but entropy provides the opportunity. The combination is not multiplicative, as one factor alone could sustain the regime, but additive, where structural failures lower the threshold for ideological triggers to become lethal. Consequently, the structural elements contribute 60% of the final credence, while ideological factors contribute 40%. This reflects the view that without the material breakdown, the Convention would have tolerated Robespierre's purges. The entropy model explains the timing; the dialectic explains the language. By weighting the material higher, we acknowledge that regimes survive ideological contradictions but rarely survive fiscal insolvency. The 'devouring' metaphor is the effect, not the cause, of the thermodynamic collapse.

  3. The Number and Its Arithmetic
  My credence is 0.65. I combine the terms additively using a weighted average, where material factors carry double the weight of ideological factors. The term exerting the greatest pull is the legitimacy-entropy model applied to the fiscal-military crisis. This dominates because administrative paralysis renders ideological purity irrelevant; a state that cannot feed its capital cannot enforce virtue. The 0.65 reflects a majority probability that structure dictated the collapse, acknowledging ideology provided the mechanism. It is not certainty because the rhetorical trigger was necessary to unify conspirators.

  4. Sensitivity and Weak Points
  I am least confident in the assessment of Robespierre's rhetoric as merely secondary. If his June speech genuinely terrified the Convention into immediate action independent of material conditions, the structural weight drops. A counter-argument showing that similar fiscal crises did not topple other regimes without such ideological triggers would shift my credence toward the dialectic model. My credence presupposes a materialist philosophy of history, where superstructural events like speeches are constrained by base conditions like supply lines. However, it acknowledges radical contingency in the timing; the fall was inevitable due to entropy, but the specific date remained contingent on political maneuvering. This presupposition risks underestimating the power of fear generated by the Tribunal, which operates psychologically rather than economically. If fear alone paralyzed the Convention, the thermodynamic model loses explanatory power regarding the specific moment of collapse.

  5. Narrative Design Implications
  Given 0.65, distribute causal weight toward the grinding fatigue of the apparatus. The fall should feel like an administrative apparatus cracking under wartime extraction, not merely an inevitable self-immolation of ideological purity. Focus thematic burden on supply crisis and popular withdrawal. Show the Committee struggling to pay armies and feed sections, rather than obsessing solely over tribunal rhetoric. The tension should derive from resource scarcity forcing political betrayal. Ideology provides the language of justification, but the engine of the plot is material exhaustion. Make the conspiracy feel like survival.
