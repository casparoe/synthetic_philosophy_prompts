      *   *Section 2: Structural Properties (The Logic).* Transitivity, Completeness, Asymmetry.
      *   *Section 3: Conceptual Distinctions (The Semantics).* Equality vs. Incommensurability, Quantitative vs. Qualitative.
      *   *Section 4: Status Flags.* Non-negotiable vs. Camp Preferences.
      *   *Section 5: Joint Unsatisfiability (The Impossibility Theorems).* This is crucial. The "Transitivity vs. Non-Arbitrariness" tension.
      *   *Section 6: Brief Evaluation.* The three views.

  8.  **Self-Correction/Review during Drafting:**

