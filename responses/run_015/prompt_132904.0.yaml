      *   **Content:** Criteria/Desiderata only (no literature survey).
      *   **Specific Requirements:**
          *   List every desideratum (pairwise cases, structural properties, distinctions).
          *   Motivating cases/paradoxes for each (focus on the Sorites chain).
          *   Flag non-negotiable vs. camp preferences.
