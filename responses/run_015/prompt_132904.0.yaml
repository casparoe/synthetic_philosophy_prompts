answer: |-
  # Specification for an Adequate Theory of the Comparative Relation "Better Than" in Spectrum Arguments

  ## 1. Scope and Definition
  This specification defines the necessary and sufficient conditions for a theory of value comparison ($>$) to adequately resolve **Spectrum Arguments**. A Spectrum Argument consists of a finite sequence of options $S = \{O_1, O_2, ..., O_n\}$ such that:
  1.  **Adjacency:** For any $i$, $O_{i+1}$ differs from $O_i$ by a marginally noticeable improvement in one dimension (e.g., intensity, duration, quantity).
  2.  **Endpoints:** $O_1$ represents a high-quality/low-quantity state (e.g., Mozart's life), and $O_n$ represents a low-quality/high-quantity state (e.g., a life of mud and potatoes).
  3.  **Intuition:** $O_{i+1}$ is plausibly better than $O_i$, but $O_1$ is plausibly better than (or incomparable to) $O_n$.

  The theory must define the binary relation $>$ (better than) and its correlates ($<$, $=$, $\parallel$) over $S$.

  ---

  ## 2. Extensional Desiderata (Pairwise Adequacy)
  The theory must correctly classify specific pairwise comparisons within the spectrum.

  ### D1: Clear Superiority (Endpoint Asymmetry)
  *   **Condition:** If $O_a$ is qualitatively superior to $O_b$ and the quantitative deficit of $O_a$ is not overwhelming, then $O_a > O_b$. Conversely, if $O_b$ is overwhelmingly superior in quantity without total qualitative collapse, $O_b > O_a$.
  *   **Motivating Case:** Comparing $O_1$ (Mozart) to $O_n$ (Mud). Most intuitions reject $O_n > O_1$.
  *   **Status:** **Non-Negotiable.** A theory implying $O_n > O_1$ (The Repugnant Conclusion) fails unless it explicitly argues for revisionism.

  ### D2: Marginal Monotonicity (The Step Principle)
  *   **Condition:** For adjacent pairs $(O_i, O_{i+1})$, if $O_{i+1}$ retains the qualitative features of $O_i$ and adds a net positive quantity of value without introducing a disvalue, then $O_{i+1} > O_i$.
  *   **Motivating Case:** The Self-Torturer Puzzle. If adding 1 volt of pain is imperceptible/bad, removing 1 volt should be good. Denying this makes the spectrum discontinuous by fiat.
  *   **Status:** **Non-Negotiable.** Denying this dissolves the spectrum argument rather than solving it.

  ### D3: Distant Incommensurability or Reversal
  *   **Condition:** For distant pairs $(O_i, O_j)$ where $|i - j|$ is large, the theory must allow that $O_j \ngtr O_i$ even if there exists a chain of $>$ relations connecting them.
  *   **Motivating Case:** The Sorites Chain. If $O_{i+1} > O_i$ for all $i$, transitivity implies $O_n > O_1$. The theory must block this implication or accept the counter-intuitive result.
  *   **Status:** **Camp Preference.** (Revisionists accept $O_n > O_1$; Non-Revisionists require $O_1 > O_n$ or $O_1 \parallel O_n$).

  ### D4: Borderline Proximity
  *   **Condition:** There must exist a region in the spectrum where the relation between $O_i$ and $O_j$ is not determinately $>$, $<$, or $=$.
  *   **Motivating Case:** The transition zone where qualitative superiority begins to erode under quantitative pressure.
  *   **Status:** **Camp Preference.** (Classicalists deny this; Vagueness theorists require it).

  ---

  ## 3. Structural Desiderata (Logical Properties)
  The theory must specify which axioms of order theory hold for $>$.

  ### D5: Asymmetry
  *   **Condition:** If $A > B$, then $\neg(B > A)$.
  *   **Motivating Case:** Logical contradiction. It is impossible for A to be better than B and B better than A simultaneously in the same respect.
  *   **Status:** **Non-Negotiable.**

  ### D6: Transitivity (Global)
  *   **Condition:** If $A > B$ and $B > C$, then $A > C$.
  *   **Motivating Case:** The Sorites Chain. If held strictly, this forces $O_n > O_1$ given D2.
  *   **Status:** **Camp Preference.** (Standard Rational Choice requires it; Spectrum Solutions often restrict or abandon it).

  ### D7: Completeness (Trichotomy)
  *   **Condition:** For any distinct $A, B$, either $A > B$, $B > A$, or $A = B$.
  *   **Motivating Case:** Rational decidability. If incomplete, agents may face rational dilemmas where no choice is mandated.
  *   **Status:** **Camp Preference.** (Incommensurabilists reject this in favor of a fourth relation $\parallel$).

  ### D8: Reflexivity of Equality
  *   **Condition:** $A = A$.
  *   **Motivating Case:** Identity.
  *   **Status:** **Non-Negotiable.**

  ### D9: Continuity (Archimedean Property)
  *   **Condition:** No option is so valuable that no quantity of a lesser option can surpass it (or vice versa).
  *   **Motivating Case:** Lexical views claim some values are infinite relative to others. Spectrum arguments often rely on the failure of Continuity to block $O_n > O_1$.
  *   **Status:** **Camp Preference.** (Utilitarians require it; Lexicalists deny it).

  ---

  ## 4. Semantic Desiderata (Conceptual Distinctions)
  The theory must maintain specific conceptual boundaries to avoid collapse.

  ### D10: The Equality/Incommensurability Distinction
  *   **Condition:** The theory must distinguish between $A \ngtr B \land B \ngtr A$ due to **Equal Value** ($A = B$) versus due to **Incommensurability** ($A \parallel B$).
  *   **Motivating Case:** Comparing a career in music vs. a career in law. They are not equal (trade-offs are not 1:1), but neither is strictly better. In spectrum arguments, $O_1$ and $O_n$ are not *equal*, but $O_n$ is not *better*.
  *   **Status:** **Non-Negotiable.** Collapsing $\parallel$ into $=$ renders the theory unable to explain why we hesitate to choose between distant options while readily choosing between adjacent ones.

  ### D11: Homogeneous vs. Heterogeneous Accumulation
  *   **Condition:** The theory must distinguish between adding more of the *same* good (homogeneous) versus adding quantity that alters the *kind* of good (heterogeneous/qualitative shift).
  *   **Motivating Case:** Adding seconds to a Mozart symphony (homogeneous) vs. adding seconds of a noise track until it becomes noise (heterogeneous). Spectrum arguments rely on the ambiguity between these two.
  *   **Status:** **Non-Negotiable.** A theory that treats all quantitative shifts as homogeneous cannot explain the intuitive break between $O_1$ and $O_n$.

  ### D12: Non-Arbitrariness of Boundaries
  *   **Condition:** If the theory posits a cutoff point $k$ where $O_k > O_{k+1}$ reverses or becomes $\parallel$, there must be a principled reason for $k$ other than "it stops the paradox."
  *   **Motivating Case:** The Sorites Paradox. Positing a sharp boundary at step 5,432 without a qualitative change at that specific step is metaphysically arbitrary.
  *   **Status:** **Non-Negotiable.** (For a principled theory).

  ---

  ## 5. Joint Unsatisfiability and Impossibility Theorems

  The following subsets of desiderata are **jointly unsatisfiable**. A theory must explicitly reject at least one member of each set.

  ### The Transitivity Trilemma
  **Set:** {D2 (Marginal Monotonicity), D6 (Global Transitivity), D3 (Distant Non-Dominance)}
  *   **Tension:** If every step is better (D2) and betterness transmits (D6), the end must be better than the start. This contradicts D3.
  *   **Resolution Requirement:** The theory must explicitly state which is abandoned.
      *   *Abandon D2:* Claim tiny differences don't matter (implies vagueness or thresholds).
      *   *Abandon D6:* Allow non-transitive betterness (cycle or local transitivity only).
      *   *Abandon D3:* Accept the Repugnant Conclusion (Revisionism).

  ### The Boundary Arbitrariness Conflict
  **Set:** {D6 (Global Transitivity), D12 (Non-Arbitrary Boundaries), D3 (Distant Non-Dominance)}
  *   **Tension:** To preserve Transitivity (D6) and avoid $O_n > O_1$ (D3), there must be a link in the chain where $O_i \ngtr O_{i+1}$. If the spectrum is truly continuous (homogeneous steps), positing a specific link where this fails violates Non-Arbitrariness (D12).
  *   **Resolution Requirement:** Either accept sharp boundaries (violate D12), accept vagueness (modify D6), or accept $O_n > O_1$ (violate D3).

  ### The Completeness/Incommensurability Tension
  **Set:** {D7 (Completeness), D10 (Equality/Incommensurability Distinction), D3 (Distant Non-Dominance)}
  *   **Tension:** If the relation is complete (D7), then for $O_1, O_n$, either $O_1 > O_n$, $O_n > O_1$, or $O_1 = O_n$. If we reject $O_n > O_1$ (D3) and reject $O_1 = O_n$ (because they are qualitatively distinct, per D10), we must reject Completeness (D7).
  *   **Resolution Requirement:** A theory cannot maintain standard Trichotomy while asserting distant incommensurability.

  ---

  ## 6. Status Flag Summary

  | Desideratum | Status | Rationale |
  | :--- | :--- | :--- |
  | **D1: Clear Superiority** | **Non-Negotiable** | Core data of value intuition. |
  | **D2: Marginal Monotonicity** | **Non-Negotiable** | Denying this denies the setup of the spectrum. |
  | **D3: Distant Non-Dominance** | **Camp Preference** | Revisionists (Totalists) reject this; Intuitionists keep it. |
  | **D5: Asymmetry** | **Non-Negotiable** | Logical consistency. |
  | **D6: Global Transitivity** | **Camp Preference** | The primary casualty of spectrum solutions. |
  | **D7: Completeness** | **Camp Preference** | Rejected by Incommensurabilists. |
  | **D10: Eq. vs. Incomm.** | **Non-Negotiable** | Conceptual clarity requirement. |
  | **D12: Non-Arbitrary Bounds**| **Non-Negotiable** | Requirement for principled explanation. |

  ---

  ## 7. Evaluation of Existing Theoretical Camps

  This section briefly indicates how three standard theoretical frameworks survive or fail against the specification.

  ### A. Strict Total-Ordering View (Classical Utilitarianism / Economics)
  *   **Commitments:** Maintains D6 (Transitivity), D7 (Completeness), D9 (Continuity).
  *   **Performance:**
      *   **Passes:** D1, D2, D5, D8.
      *   **Fails:** D3 (Distant Non-Dominance). It entails $O_n > O_1$ (The Repugnant Conclusion).
      *   **Fails:** D12 (Non-Arbitrary Boundaries). It denies boundaries exist, treating value as purely aggregative.
      *   **Verdict:** Logically robust but extensionally inadequate for non-revisionists. It solves the paradox by accepting the counter-intuitive conclusion.

  ### B. Incommensurabilist View (Raz / Anderson / Chang)
  *   **Commitments:** Maintains D3 (Distant Non-Dominance), D10 (Distinction). Rejects D7 (Completeness) by introducing $\parallel$ (On a Par).
  *   **Performance:**
      *   **Passes:** D1, D3, D5, D10, D12 (often via qualitative shifts).
      *   **Fails:** D6 (Global Transitivity). Must explain how $O_{i+1} > O_i$ can hold repeatedly without $O_n > O_1$. Often relies on "small unidimensional dominance" which does not transmit across qualitative gaps.
      *   **Tension:** Struggles with D2 (Marginal Monotonicity). If $O_i$ and $O_{i+1}$ are qualitatively identical, why are they not comparable via equality? If they are comparable via $>$, how does the chain break?
      *   **Verdict:** Extensionally adequate (matches intuitions) but structurally costly (abandons standard rational choice axioms).

  ### C. Vagueness-Based Graded-Membership View (Sorensen / Handfield)
  *   **Commitments:** Maintains D3 (Distant Non-Dominance). Modifies D6 (Transitivity) to be degree-sensitive or truth-value gap tolerant.
  *   **Performance:**
      *   **Passes:** D1, D2, D3, D5, D12 (Boundaries are vague, not arbitrary sharp cuts).
      *   **Fails:** D7 (Completeness) in the classical sense (truth value gaps).
      *   **Fails:** D6 (Classical Transitivity). "Better than" becomes a fuzzy relation. $A > B$ (degree 0.9) and $B > C$ (degree 0.9) does not imply $A > C$ (degree 0.9).
      *   **Verdict:** Metaphysically plausible regarding boundaries, but requires a non-classical logic for value comparison. It survives the Trilemma by weakening Transitivity.

  ## 8. Final Constraint on Adequacy
  An adequate theory **must** explicitly resolve the **Transitivity Trilemma** (Section 5). It is insufficient to assert a solution without identifying which Non-Negotiable or Camp Preference desideratum is being modified. A theory that claims to satisfy {D2, D6, D3} simultaneously without invoking a qualitative shift (D11) or a non-classical logic is formally inconsistent.
