  Begin by asking: 'At which exact round did the system break?' Expect silence or disagreement. Reveal the 'Original Mandate' from the sealed envelope. Ask Panels to read their 'Minor Deviation' logs aloud in sequence. Highlight how no single entry justified a shutdown.

  Ask Squads: 'Why did you spend tokens on Security Audits?' Reveal that those cards were rigged clean. Explain this maps to the fear of power-seeking behaviour: obvious, detectable, but often absent. Contrast this with the Protocol Deviations, which map to specification gaming: invisible individually, fatal collectively.

  Finally, ask: 'Who is responsible?' Map the Squad turnover to model retraining and the written logs to loss of intent during handoffs. The lesson is that safety budgets spent hunting for 'sabotage' may leave you blind to 'drift'. The failure was not a step, but the slope. Ask them to compare the feeling of hunting for a villain versus finding only a series of reasonable decisions. This emotional distinction is the core learning objective. Ensure you explicitly name the two failure modes now.

  Connect the 'Throughput Points' to business pressure. Ask if anyone felt they *had* to pick the high-point cards. This mirrors the deployment pressure engineers face. The game shows that under pressure, drift is the default path, not an anomaly. Conclude by asking how they would redesign the oversight budget now that they know the rigging. This empowers them to apply the lesson to their actual work. Walk through the timeline on the scoreboard. Point out where tokens were spent versus where deviations accumulated. Ask the skeptical participants specifically if the 'Minor Deviations' felt like real risks during the game. Validate their skepticism—individually, they were not. This builds trust before introducing the cumulative risk concept. Ask them to identify the 'point of no return'. When they cannot, reinforce that this is the defining feature of the drift failure mode. It lacks a clear trigger event. Encourage them to discuss how this applies to their current projects. Make the link explicit.

