  Action Cards come in two varieties: 'Optimisation' and 'Control'. Optimisation cards offer high points but carry hidden drift risk. Control cards offer low points but trigger Security Audits. The rigging ensures Control cards pass audits cleanly. The handoff requires the outgoing Squad to write a 'System State' summary. The incoming Squad must act based solely on this summary. This creates information loss. The scoreboard tracks only Throughput, hiding the Risk Threshold. This misalignment drives the failure. Participants must manage the tension between immediate points and long-term safety without knowing the true cost. The facilitator must enforce the token declaration strictly. If a Panel tries to spend a token without declaring the type, it is invalid. This forces them to commit to a hypothesis about the failure mode before seeing the card. This pre-commitment is vital for the lesson. Round timing is strict: ten minutes per cycle. This time pressure mimics real deployment schedules.

