answer: |-
  This is a fantastic question. You have put your finger on the exact friction point where decision theory, metaphysics, and ethics grind against each other. You aren't going in circles; you are circling a genuine conceptual void that the literature often papers over with assumptions.

  The short answer is: **Hyperbolic discounting is a mathematical description of choice patterns, but whether it counts as a "preference" or a "failure of will" depends entirely on your metaphysical stance on personal identity over time.**

  The literature *does* smuggle concepts. Behavioral economics tends to smuggle in a "Single Self" normativity (treating the long-term view as the "true" preference), while the "Multiple Selves" model smuggles in a game-theoretic descriptivism that dissolves normativity.

  Here is a walkthrough of the tension, how the two framings handle akrasia, and what happens to Ulysses contracts in each.

  ---

  ### 1. The Two Metaphysical Frames

  To understand why you feel stuck, we have to separate the *math* from the *ontology*.

  **Frame A: The Diachronic Agent (Single Self)**
  *   **Ontology:** You are one entity persisting through time.
  *   **Hyperbolic Discounting:** This is a **bug in your utility function**. It is a structural irrationality. You have a "true" preference (usually aligned with the long-term view) and a "local" preference (aligned with the immediate view).
  *   **Akrasia:** Real. It is the failure of the agent to maximize their own diachronic utility function due to time-inconsistency.
  *   **Normativity:** The long-term self is usually privileged as the "rational" one. The short-term self is a glitch.

  **Frame B: The Time-Slice Agents (Multiple Selves)**
  *   **Ontology:** "You" are a sequence of distinct agents (You-Today, You-Tomorrow) linked by memory and physical continuity, but with distinct utility functions.
  *   **Hyperbolic Discounting:** This is **not a bug**; it is the definition of the agent. You-Today *rationally* values Now heavily. You-Tomorrow *rationally* values Tomorrow heavily. There is no inconsistency because there is no single entity to be inconsistent.
  *   **Akrasia:** Dissolved (or redefined). There is no "failure of will," only a conflict of interest between sequential agents. What looks like weakness is just You-Tomorrow maximizing *their* utility, which differs from You-Today's utility.
  *   **Normativity:** No single self is privileged. Who is to say You-Today's desire for health outweighs You-Tomorrow's desire for cake?

  ### 2. Preference vs. Choice: Where the Smuggling Happens

  You asked: *Is hyperbolic discounting really a theory of preferences, or is it really a theory of choice / self-control?*

  In standard microeconomics, **preferences determine choice.** If you choose A over B, you revealed a preference for A over B.

  *   **In the Single Self frame:** Hyperbolic discounting is treated as a **preference pathology**. The assumption is that you *should* have exponential discounting (time-consistent). Because you don't, your revealed preferences are "wrong." Here, HD is a theory of flawed preferences leading to suboptimal choice.
  *   **In the Multiple Selves frame:** Hyperbolic discounting is a **constraint on the choice environment**. Each time-slice has consistent preferences *at that moment*. The "choice" problem is not internal inconsistency, but external strategic interaction.

  **The Smuggling:** When behavioral economists say hyperbolic discounting causes "welfare losses," they are smuggling in the Single Self frame. They are asserting that the *long-term* time-slice has standing to judge the *short-term* time-slice's welfare. If you accept the Multiple Selves frame, there is no "welfare loss," only a redistribution of utility from Future-Self to Present-Self.

  ### 3. Does Akrasia Survive?

  This depends on whether you think "will" requires a single agent.

  **If you accept the Single Self:**
  Akrasia survives robustly. It is the gap between your *evalutive judgment* (what is best for the whole timeline) and your *motivational state* (what the local discount rate demands). Precommitment is a tool for self-regulation, akin to a pilot correcting for a known wind shear.

  **If you accept the Multiple Selves:**
  Akrasia largely dissolves, *unless* you introduce a "Meta-Self."
  If there is no single agent, there is no one to *have* weak will. However, philosophers like Derek Parfit (Reductionist view) suggest that even if we are just a series of selves, we might care about the **aggregate welfare** of the series.
  *   If You-Today cares about the aggregate series, and You-Tomorrow defects, You-Today experiences this as akrasia.
  *   But strictly speaking, in a pure game-theoretic multiple-selves model, "akrasia" is just "inter-agent conflict." It's not weakness; it's war.

  ### 4. Commitment Devices (Ulysses Contracts)

  This is where the distinction becomes practically vital. How does a Ulysses contract work in each frame?

  **Scenario:** Ulysses orders his crew to tie him to the mast and ignore his future commands when he hears the Sirens.

  **In the Single Self Frame:**
  *   **Mechanism:** Self-Binding.
  *   **Logic:** The "Planning Self" (Time 1) recognizes a flaw in the "Acting Self" (Time 2). The Planning Self restricts the Acting Self's option set to ensure the global utility function is maximized.
  *   **Binding Nature:** It is morally/rationally binding because it is the *same agent* constraining itself. Breaking the contract is irrationality.

  **In the Multiple Selves Frame:**
  *   **Mechanism:** Strategic Constraint / Game Theory.
  *   **Logic:** Agent 1 (T1) is playing a game against Agent 2 (T2). Agent 1 knows Agent 2 will have different incentives. Agent 1 alters the payoff matrix for Agent 2 (e.g., by making untying himself physically impossible or socially costly).
  *   **Binding Nature:** It is **causally** binding, not normatively binding.
      *   If Ulysses (T2) *could* break the ropes, he *would*, because T2's utility function values the Sirens higher than safety.
      *   The contract only holds because T1 successfully removed T2's agency.
      *   If the ropes were weak, T2 breaking them isn't "irrational"; it's just T2 maximizing T2's utility. T1 just made a bad strategic move.

  **The Crucial Difference:**
  In the Single Self view, if you break a precommitment, you made a **mistake**.
  In the Multiple Selves view, if you break a precommitment, you just **won the local game** (but T1 lost).

  ### 5. The "Sophisticated vs. Naive" Distinction

  You mentioned this, and it's the bridge between the two views.

  *   **Naive Agent:** Believes their future preferences will match their current ones. (Thinks "I will want to diet tomorrow" when today they are hungry). This agent is surprised by their own behavior.
  *   **Sophisticated Agent:** Knows their future self will discount hyperbolically.

  **How Sophistication bridges the gap:**
  A Sophisticated agent in the Multiple Selves model behaves almost exactly like a Single Self agent trying to manage a flaw.
  *   They anticipate the conflict.
  *   They use commitment devices.
  *   They engage in "intrapsychic bargaining."

  However, the *interpretation* remains different.
  *   **Single Self Sophistication:** "I am correcting my cognitive bias."
  *   **Multiple Selves Sophistication:** "I am negotiating with a successor who has hostile interests."

  ### 6. Resolution: Where is the Real Disagreement?

  The disagreement isn't about the math of discounting. It's about **Welfare Economics.**

  If you want to prescribe policy or give advice (e.g., "You should use a commitment device"), you *must* choose a frame.
  *   If you choose **Single Self**, you can say: "Smoking is bad for *you* (the diachronic entity)."
  *   If you choose **Multiple Selves**, you have to say: "Smoking is bad for Future-You, but good for Present-You. Why should we privilege Future-You?"

  Most rationalist/EA/behavioral econ circles implicitly adopt the **Single Self** frame for normative purposes because it allows for optimization. It treats the diachronic sum of utility as the thing to be maximized. This makes akrasia real and precommitment rational.

  However, your intuition that akrasia might be an artifact of slicing is correct. If you strictly enforce the Multiple Selves ontology, "weakness of will" vanishes into "conflict of interest."

  **So, to answer your specific questions:**

  1.  **Is HD a theory of preferences or choice?**
      It is a parameterization of preferences that *predicts* time-inconsistent choice. But labeling it a "preference" implies stability that doesn't exist. It is better understood as a **dynamic inconsistency in valuation**.

  2.  **Does the distinction dissolve akrasia?**
      Yes, if you rigorously hold the Multiple Selves view without a meta-preference for aggregate welfare. Akrasia requires a "true self" to be weak *relative to*. If there is no true self, there is only succession.

  3.  **How do commitment devices fare?**
      *   **Single Self:** They are tools of rationality, restoring the agent to their optimal path.
      *   **Multiple Selves:** They are weapons in a sequential game. They are only "binding" insofar as they physically or economically constrain the future agent. The future agent has no moral obligation to obey them, only a causal inability to disobey.

  ### The Synthesis

  You don't have to pick one as "true." You pick one as **useful**.

  *   Use the **Single Self** model when you are **planning**. It allows you to optimize for your life as a whole. It validates the feeling that akrasia is a problem to be solved.
  *   Use the **Multiple Selves** model when you are **debugging**. It helps you realize that "willpower" isn't a muscle, but a negotiation. It helps you design commitment devices that acknowledge Future-You is effectively a different person with different incentives, rather than just a "broken version" of Present-You.

  The tension you feel is the friction between **optimization** (which requires a single objective function) and **description** (which reveals a fragmented reality). The literature smuggles the Single Self into the description to make the optimization possible. Recognizing that smuggling is the first step to using the models without being confused by them.
