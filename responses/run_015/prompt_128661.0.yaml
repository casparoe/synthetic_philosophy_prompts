answer: |-
  This is a profoundly insightful connection to make, especially while navigating a new diagnosis. You have identified a genuine tension in legal and moral philosophy: **Why do we celebrate binding your future psychiatric self, but often criticize binding our future political self?**

  The short answer is that the two practices rely on different theories of **identity over time** and different definitions of **competence**.

  Here is a breakdown of the philosophical machinery underneath that split, and what happens if we pull the threads.

  ### 1. The Identity Assumption: Fragmentation vs. Continuity

  The split presupposes a specific view of where the "real" person resides.

  **In the Psychiatric Context (The Ulysses Contract):**
  The law and ethics here presuppose a **fragmented or hierarchical identity**. It assumes there is a "competent self" (your baseline, euthymic state) and a "compromised self" (the manic or depressive state).
  *   **The Presupposition:** The manic state is viewed not just as a *different* preference set, but as a *corruption* of agency. Therefore, honoring the directive isn't binding your future self; it is protecting your *true* self from a temporary usurper.
  *   **The Goal:** To preserve **diachronic autonomy** (autonomy across time) by prioritizing the timeline where you have the capacity to reason according to your deeply held values.

  **In the Constitutional Context (Entrenchment):**
  Constitutional theory often presupposes a **continuous collective identity** ("We the People").
  *   **The Presupposition:** The Founders and the Current Generation are the same legal entity. Therefore, the Founders binding the Current Generation is seen as the People binding themselves.
  *   **The Criticism:** However, the *anti-democratic* critique you mention (famously articulated by Thomas Jefferson) argues that **generations are distinct entities**. Jefferson argued that "the earth belongs to the living." If Future Citizens are distinct moral agents, then Constitutional Entrenchment is not "self-binding"; it is **dead-hand control**. It is one group of people ruling another without consent.

  **The Split:** We treat the psychiatric contract as empowering because we assume the *manic you* lacks full moral standing due to impaired capacity. We treat constitutional entrenchment as potentially anti-democratic because we assume the *future citizen* has full moral standing and should not be ruled by the past.

  ### 2. Can a Control-Based View of Autonomy Explain Both?

  You asked if a **control-based view** (autonomy = the ability to execute long-term plans) can reconcile them. Theoretically, yes, but practically, it hits a wall regarding **revocability**.

  Philosophers like Jon Elster and Stephen Holmes have explicitly defended constitutions as "Ulysses Contracts." They argue that democracies, like individuals, are prone to "passions" (populism, panic) and need precommitment devices to stay the course on fundamental rights.

  However, the legal mechanics differ in a way that reveals a moral contradiction:

  *   **Psychiatric Directives:** Usually contain a **competence override**. If you become well again, you can usually revoke the directive. The "past self" does not have absolute tyranny over the "future self"; the "future well self" can reclaim the helm.
  *   **Constitutions:** Are designed to be **hard to change**. Article V of the US Constitution, for example, makes amendment incredibly difficult.

  **The Contradiction:**
  If autonomy is about control, the psychiatric contract respects autonomy *better* because it allows for the return of competence to override the contract. Constitutional entrenchment often denies the "current self" (the current generation) the ability to override the "past self" (the founders) easily.
  *   **Conclusion:** A control-based view supports psychiatric directives *more strongly* than rigid constitutional entrenchment. To make them consistent, constitutions would need easier "sunset clauses" or amendment processes, OR psychiatric directives would need to be irrevocable (which most ethicists reject).

  ### 3. The Thought Experiment: Equal Moral Standing

  This is the most radical part of your question. What happens if we change the underlying view of identity?

  **Scenario A: Manic-You has Equal Moral Standing**
  If we view the manic state not as a "loss of capacity" but simply as a "different mode of being" with equal moral weight (a view sometimes argued by the Mad Pride movement):
  *   **The Collapse:** The Ulysses contract collapses into **paternalistic oppression**. If Manic-You is just "Different-You," then forcing meds based on Sober-You's preference is no different than forcing a religious conversion based on your parents' preference.
  *   **The Consequence:** We would have to move to a model of **supported decision-making** in the moment, rather than advance directives. You would only be treated if *current* you consented, regardless of *past* you's instructions.

  **Scenario B: Future Citizens have Equal (Distinct) Moral Standing**
  If we accept Jefferson's view that every generation is a distinct sovereign nation:
  *   **The Collapse:** Constitutional entrenchment collapses. No law should last longer than a generation (Jefferson suggested 19 years).
  *   **The Consequence:** Long-term planning becomes impossible. Climate change agreements, debt issuance, and human rights protections would all expire. The "stability" value of the constitution vanishes in favor of pure "consent of the governed."

  ### 4. What This Means for You

  The reason the psychiatric advance directive is framed as **empowering** rather than restrictive is that it operates on a **Substantive View of Autonomy**.

  *   **Procedural Autonomy:** "I am free if I can do what I want right now." (Under this view, the directive restricts you).
  *   **Substantive Autonomy:** "I am free if I can live according to my deepest values and rational plans." (Under this view, the directive *enables* you).

  The law assumes that bipolar mania interferes with *Substantive Autonomy*. It assumes the "real you" is the one capable of aligning actions with long-term values.

  **The Philosophical Takeaway:**
  The split you noticed exists because we are willing to say that **mental illness can disrupt the continuity of the self**, but we are hesitant to say that **time disrupts the continuity of the polity**.

  If you sign that directive, you are essentially making a philosophical claim: *There is a "true me" that persists through time, and there are states of being that obscure that self.* That is a valid, coherent, and legally recognized stance. It is not a contradiction to hold that view for yourself while remaining critical of politicians trying to bind future generations, provided you distinguish between **protecting capacity** (psychiatry) and **restricting sovereignty** (politics).

