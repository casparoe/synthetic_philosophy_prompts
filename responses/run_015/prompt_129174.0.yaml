      *   *Section 3: The Determinism/Marx Comparison.* Nuance this. Marx = materialist determinism. Fukuyama = idealist/natural science directionality. Fukuyama admits contingency.
      *   *Section 4: The Populism/Thymos Point.* Flatmate is half-right. *Thymos* explains the *appeal* of democracy, but *megalothymia* explains the *threat* to it. So populism isn't a "missed point," it's a predicted risk.
