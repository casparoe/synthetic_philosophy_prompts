      *   *Interpretive Decision:* Justify "Attitudes/Uptakes." This allows the *system* to be analyzed by what uptakes it affords or blocks.

  5.  **Defining Success/Failure:**

      *   *Good Result:* A specific design recommendation or regulatory insight (e.g., "Critical history requires a 'sunset clause' feature").
