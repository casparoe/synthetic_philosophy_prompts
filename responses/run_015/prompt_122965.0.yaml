      *   *Failure:* Just saying "Nietzsche didn't know about computers."
      *   *Differentiation Test:* Generic suspicion says "All archive = bad." Nietzsche scheme says "Monumental/Antiquarian might be okay/sickening depending on plastic power; Critical is *impossible* without deletion."
      *   *Healthy Excess Case:* An archive that looks excessive but serves the Monumental mode (e.g., a memorial database) without claiming to be Critical.

  6.  **Addressing the "Two Projects" Concern:**

      *   I need to be honest. There is a risk. The advice should be: Commit to the *conceptual stress test*. Don't try to solve the tech problem *and* solve the Nietzsche problem. Use the tech problem to solve the Nietzsche problem (or vice versa). The proposal should frame it as: "Using the digital archive as a limit-case to test the universality of Nietzsche's claim about life." This satisfies the intellectual historians (Nietzsche focus) and the media scholar (application focus).

