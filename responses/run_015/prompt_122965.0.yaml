  Let's refine the "Two Projects" warning. I should explicitly state that the project survives only if it treats the digital archive as a *philosophical limit-case*, not a policy problem.
  Let's refine the "Interpretive Decision." I will argue for "Attitudes" because it allows for the *interface* to be the agent of history, which is crucial for the "institutional plastic power" hypothesis.

