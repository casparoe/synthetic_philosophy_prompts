      *   **Key Tensions:**
          *   Nietzsche assumes scarcity/forgetting is default; digital assumes abundance/retention.
          *   Does "plastic power" belong to individuals or systems/interfaces?
          *   Is the "critical mode" impossible without oblivion (since reckoning must end)?
