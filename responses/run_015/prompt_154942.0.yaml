answer: |-
  1. Within a 75-minute session, assign three students to a Central Board tasked with adjusting point-prices to clear aggregate inventories, while the remaining thirteen act as producer nodes each holding a card detailing a hidden physical constraint like tool handedness or material sensitivity.
  2. Producers are forbidden from stating their hidden constraints aloud and earn points for output volume plus a secret bonus only if their undisclosed constraint was satisfied, while the Board earns points solely for achieving aggregate inventory equilibrium.
  3. Run two rounds of production where the Board adjusts prices based on surplus or shortage data, allowing them to reach apparent price equilibrium in round two while several nodes simultaneously suffer silent, invisible misallocation due to unmet constraints.
  4. In the debrief, map the hidden-constraint failures onto Hayek's argument about the particular circumstances of time and place, contrasting the producers' silent struggles with the Board's Langean adjustments based on aggregate data.
  5. State frankly that the game cannot reproduce the non-codifiable, bodily character of true tacit knowledge, so the facilitator must verbally supply this missing phenomenological dimension to complete the critique.
