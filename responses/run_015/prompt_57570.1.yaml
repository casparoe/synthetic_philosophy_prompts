answer: |-
  **MEMORANDUM**

  **TO:** Hallowell Parks and Recreation Youth Basketball Commission
  **FROM:** Graduate Student Commissioner
  **DATE:** February 10
  **SUBJECT:** Recommendation Regarding Token Transferability and Ridgeline Elite Arbitrage

  **Purpose and Context**

  The Commission faces a conflict between two binding charter provisions. Section 3 mandates that facility access be allocated by need and participation, never by ability to pay. Section 7 protects entitlements acquired through voluntary exchange. The emergence of Ridgeline Elite as a bulk purchaser of access tokens has created a situation where Section 7 is undermining Section 3. Need-based households are exchanging court time for cash, while Ridgeline resells that time at a premium to clients outside the league. This memo recommends a specific resolution, addresses the structural implications of that choice, and outlines an implementation timeline for the spring registration window.

  **Recommendation**

  I recommend we adopt a hybrid approach combining prospective design changes with a targeted buyback of existing inventory.

  First, effective immediately for the upcoming spring season, we must redefine the token as a non-transferable license for court access rather than a tradable asset. Tokens may not be sold or exchanged for cash. However, to preserve the utility of the swap board for families needing schedule flexibility, the League Office will facilitate direct schedule swaps between members. No money changes hands in these transactions; the League simply reissues tokens to reflect the new time slots.

  Second, regarding the 1,400 token-hours currently held by Ridgeline, the Commission should authorize a one-time buyback at face value, not the market rate of eighteen dollars. These hours will be returned to the general pool, specifically restoring Saturday morning availability. We will not void the trades already made by families who spent the proceeds on necessities like car repairs.

  **The Structural Question: Interference vs. Design**

  We must resolve the disagreement regarding whether banning transfer constitutes continuous interference or a one-time design choice. Commissioner Miller argues that any fix requires us to constantly intervene in private exchanges. Commissioner Davis argues that defining the token as non-transferable is simply a design choice about what the entitlement *is*.

  I side with Commissioner Davis. This is not continuous interference; it is a clarification of property rights. When we issued these tokens, we intended to distribute *access*, not *property*. By allowing cash transferability without restriction, we inadvertently created a commodity. Correcting this is not an ongoing violation of Section 7; it is a one-time alignment of the rules with the Charter's intent. Once we define the token as a personal license—similar to a prescription or a scholarship—banning its sale is not an intervention in a market, but the enforcement of the license terms. We do not need to constantly police families; we simply refuse to recognize cash transfers as valid claims on court time. This provides stability. If we treat tokens as property, we invite endless arbitrage. If we treat them as access rights, the market dissolves because there is nothing to sell.

  **Third-Party Resale and Rectification**

  A critical complication is that Ridgeline has resold many of these hours to families who never touched the swap board. These are innocent third parties—children who signed up for travel ball expecting court time. This fact changes what rectification we can permissibly demand. We cannot ethically eject these players from the courts mid-season; doing so would punish children for a structural error made by the Commission.

  However, this does not prevent us from breaking Ridgeline's hold on the facility. Because the resale was based on a speculative accumulation of League assets, Ridgeline's claim to those hours is weaker than the League's own mandate to serve residents. By buying back the inventory at face value, we acknowledge Ridgeline's expenditure without validating their profit model. We restore the slots to the need-based pool without displacing the kids currently using them, as the buyback funds can subsidize extended hours or additional staffing to accommodate the restored demand. The key distinction is that we are rectifying the *allocation mechanism*, not punishing the *end users*.

  **Implementation Timeline**

  To minimize disruption, we must key this to the spring registration window.

  *   **February 14:** Commission votes to adopt the non-transferable license model and authorize the Ridgeline buyback.
  *   **February 20:** Public notice issued to all registered households. Clear explanation that tokens remain valid but cash sales are voided prospectively.
  *   **March 1:** Spring registration opens. New tokens issued with "Non-Transferable" watermark. Swap board relaunched as a schedule-exchange only tool.
  *   **March 15:** Ridgeline buyback finalized. Saturday morning slots returned to the general lottery pool.
  *   **April 1:** Spring season begins under new rules.

  **The Case for the Alternative**

  I must present the strongest honest case for the outcome I do not recommend: taking no action and allowing the market to clear. This position relies on the plain text of Section 7 and the reality of household economics. The families who sold tokens did so voluntarily. They revealed a preference for cash over court time, likely because eighteen dollars per token provided immediate liquidity for rent, repairs, or food that a basketball slot did not. By banning these sales, we are effectively telling low-income households that we know how to value their entitlements better than they do.

  Furthermore, Ridgeline's counsel is correct that their clients paid above any price the League would have set. The market has identified a high demand for Saturday indoor time that the League failed to price correctly. Banning trading eliminates this liquidity source for poor families without guaranteeing that the court time will actually be used by those who value it most, rather than those who simply live closest to the fieldhouse. If we prioritize the pattern of distribution (need) over the history of acquisition (voluntary trade), we risk stabilizing the ledger at the expense of the very families Section 3 is meant to protect. They had an asset; we are proposing to take away their right to sell it.

  **Conclusion**

  Despite the strength of that objection, the current trajectory violates the core mission of the Parks and Recreation Commission. We are not a neutral marketplace; we are a public body tasked with youth development. Allowing access to be determined by ability to pay undermines public trust and violates Section 3. Redefining the token as a non-transferable license corrects the design error without violating the spirit of voluntary exchange, provided we facilitate schedule swaps. We must act before spring registration locks in another season of inequity.
