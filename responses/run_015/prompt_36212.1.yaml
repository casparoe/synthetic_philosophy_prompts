prompt: |-
  I've been going around with my sister about fairness stuff and it hit me that everyone I talk to just answers the question "should things be equal?" but nobody stops to ask equal WHAT. Like, if we all have the same money but I'm prone to terrible migraines and you're not, are we equal? If we both have the same resources but I was raised to want nothing so I'm happy with a bowl of rice and you weren't, are we equal? She says happiness is what matters, I keep feeling like that lets you get away with counting someone's contentment in a bad situation as a win. But I don't actually want to argue for my side right now, I want to figure out what an answer to this has to get right before I even pick one.

  So here's what I'm asking for: write me the list of requirements that any measure of "what people have for purposes of equality" has to meet -- the cases it has to get right, with the reasoning behind each. The ones I can already half-see: it has to deal with people who cultivate expensive tastes (if equality is about getting people satisfied, does someone who trains themselves to only enjoy champagne deserve more champagne? surely not), it has to deal with people who've lowered their sights because life beat them down (you can't just ask them "are you happy?" and take the yes at face value), it has to deal with disabilities and bad luck at birth (equal money doesn't look equal when one person needs a wheelchair and hearing aids to do what the other does barefoot), and it has to draw some line between things you caused yourself and things that just happened to you -- though honestly I don't know if that line is a real requirement or just something people like me want to be there, tell me if you think it's a prejudice and not a genuine demand.

  Also two things I specifically want you to address. First: do any of the requirements contradict each other? Like I have this feeling that "deal with lowered sights" and "respect what people actually want" are going to fight each other and you can't have both, and if so that's actually an interesting result about the list itself, not a failure of it -- I'd want that flagged, not papered over. Second, once the list is done, run the obvious candidates against it quickly -- happiness/satisfaction, money and stuff, and something like "what a person is actually able to do and be" (I'm vaguely aware people have pushed that last one but I don't remember the details, don't worry about names or citations, just the ideas). Which single requirement knocks out the most candidates, that's the part I care about most. Keep it plain-spoken please, I never went to college and I'll bounce off anything too jargon-y. A table is fine if you think it helps.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Core Task:** Create a list of requirements that any measure of "what people have for purposes of equality" (the "equal *what*?") must meet.
      *   **Specific Cases to Address:**
          *   Expensive tastes (cultivated).
          *   Adapted preferences (lowered sights due to hardship).
          *   Disabilities/Bad luck (different needs for the same functioning).
          *   Responsibility (self-caused vs. brute luck) - *User is unsure if this is a genuine requirement or a prejudice.*
      *   **Specific Questions to Answer:**
          *   Do any requirements contradict each other? (Flag this, don't hide it).
          *   Run obvious candidates (Happiness, Resources/Money, Capabilities/Functioning) against the list.
          *   Identify which single requirement knocks out the most candidates.
      *   **Tone/Style:** Plain-spoken, no jargon (user says they never went to college), honest about tensions. A table is okay.
      *   **User's Stance:** They don't want to argue their side yet; they want to define the *criteria* for a good answer first. They are skeptical of "happiness" because it validates suffering (adapted preferences).

  2.  **Deconstruct the "Equal What?" Problem (Theoretical Background):**

      *   This is classic political philosophy (Dworkin, Sen, Nussbaum, Arneson, Cohen).
      *   *Welfarism (Happiness):* Fails on adapted preferences (the "happy slave" problem) and expensive tastes.
      *   *Resource Egalitarianism (Money/Stuff):* Fails on disabilities (different conversion rates) and doesn't account for responsibility.
      *   *Capability Approach (Sen/Nussbaum):* Focuses on what people can *do* and *be*. Handles disabilities well. Struggles a bit with responsibility/expensive tastes (though Sen addresses this).
      *   *Responsibility:* The distinction between "brute luck" (born blind) and "option luck" (gambled money away) is crucial for many (Dworkin).

  3.  **Drafting the Requirements (The "Test Cases"):**

      *   *Requirement 1: The Disability/Need Test.* Equal money isn't equal if one person needs expensive meds to function like the other. (Addresses the wheelchair example).
      *   *Requirement 2: The Adapted Preference Test.* You can't count someone as "equal" just because they stopped wanting more due to oppression. (Addresses the "bowl of rice" example).
      *   *Requirement 3: The Expensive Taste Test.* You shouldn't get *more* resources just because you trained yourself to need champagne. (Addresses the sister's happiness argument).
      *   *Requirement 4: The Responsibility Test.* Did you choose this? If I gamble my money away, do I get a refill? (Addresses the user's uncertainty about this requirement).
      *   *Requirement 5: The Freedom/Agency Test.* Equality shouldn't mean forcing everyone into the same box. (Important nuance).

  4.  **Addressing the Contradictions (The "Tension"):**

      *   The user suspects "Respect what people want" vs. "Deal with lowered sights."
      *   *Analysis:* Yes, this is a real tension. If I say "I'm happy with nothing," do I respect that (liberty) or say "No, you should want more" (paternalism)?
      *   *Decision:* Flag this clearly. It's the "Paternalism vs. Respect" tension.

  5.  **Addressing the "Responsibility" Question:**

      *   Is it a prejudice? No, it's a core intuition of fairness. Most people feel it's unfair to subsidize reckless choices. But it's hard to measure. I need to validate the user's intuition here without getting too academic.

  6.  **Evaluating the Candidates:**

      *   *Candidate A: Happiness/Satisfaction.*
          *   Fails: Adapted Preferences (Happy Slave).
          *   Fails: Expensive Tastes (Rewards bad behavior).
          *   Passes: Subjective experience.
      *   *Candidate B: Money/Resources.*
          *   Fails: Disabilities (Different needs).
          *   Fails: Expensive Tastes (Gives too much to champagne drinkers if aiming for satisfaction, or too little if aiming for strict equality).
          *   Passes: Easy to measure.
      *   *Candidate C: Capabilities (What you can do/be).*
          *   Passes: Disabilities (Focuses on functioning).
          *   Passes: Adapted Preferences (Focuses on opportunity, not just feeling).
          *   Struggles: Expensive Tastes/Responsibility (Do you have the *capability* to drink champagne, or just the capability to be healthy?).

  7.  **Identifying the "Knockout" Requirement:**

      *   Which one kills the most?
      *   *Happiness* dies on "Adapted Preferences" (The Happy Slave).
      *   *Money* dies on "Disabilities/Needs."
      *   *Capabilities* survives best but has wrinkles.
      *   *The Knockout:* The **Adapted Preference Test** (The "Happy Slave" problem). It kills pure Happiness theories instantly. The **Disability Test** kills pure Resource theories instantly.
      *   *Decision:* The "Adapted Preference" requirement is the most devastating to the most common intuition (Happiness). But the "Disability" requirement is the most devastating to the most common policy (Money). I should highlight the Adapted Preference one as the user specifically mentioned it as their main worry. Actually, looking at the candidates:
          *   Happiness fails Adapted Preferences AND Expensive Tastes.
          *   Money fails Disabilities.
          *   Capabilities passes most.
          *   So, "Adapted Preferences" + "Expensive Tastes" together kill Happiness. "Disabilities" kills Money.
          *   I will identify **The Adapted Preference Test** as the hardest hurdle because it challenges the idea that the individual is the best judge of their own good.

  8.  **Refining the Tone:**

      *   Avoid words like "welfarism," "utilitarianism," "egalitarian ethos."
      *   Use "Happiness," "Stuff," "Opportunities."
      *   Keep it conversational but rigorous.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the insight. "Equal what?" is the right question.
      *   *The List:* Number them. Give them plain names. Explain the "Why."
      *   *The Responsibility Question:* Validate it. It's not prejudice, it's about agency.
      *   *The Contradiction:* Be honest about Paternalism vs. Respect.
      *   *The Scorecard:* Use a table.
      *   *The Knockout:* Pick the Adapted Preference one.

  10. **Final Review against Constraints:**
      *   Plain spoken? Yes.
      *   Address contradictions? Yes.
      *   Address responsibility prejudice? Yes.
      *   Run candidates? Yes.
      *   Identify knockout requirement? Yes.
      *   No jargon? (Check: Ensure "Capabilities" is explained simply).

  11. **Final Polish:** (Self-Correction during drafting)
