      *   **The Boat Scene (The Storm):** This is the climax of facticity vs. transcendence. Christof tries to use fear (death) to limit Truman's freedom. Sartre says even death doesn't negate freedom. Truman tying himself to the mast is an act of radical freedom *within* the trap. He chooses death over submission. This aligns perfectly with Sartre.
