      *   *The Film's Apparent Position:* Truman is trapped. He doesn't know he's trapped. When he finds out, he escapes. The audience cheers when he leaves. This looks like freedom = removal of external constraints.
      *   *The Conflict:* If Sartre is right, Truman was free *inside* the dome (he could have smashed a camera, refused to work, etc.). If the film is right, he wasn't free until he walked through the door.
      *   *Resolution Strategy:* The film isn't about *ontological* freedom (which Truman always had); it's about *epistemological* awareness of that freedom. Bad faith in the film is induced *externally* (by Christof), which is a twist on Sartre (usually bad faith is self-induced). This is the key nuance.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction/Validation:** Acknowledge *The Truman Show* is a great choice. It's distinct from *Matrix* (which is more Plato/Cartesian) because it's about social construction, not simulation metaphysics.
      *   **Bad Faith & The "Serious Man":** Truman starts as *l'homme serieux*. He treats his roles (husband, insurance salesman) as essential. But here's the twist: His bad faith is *engineered*. Sartre says we choose bad faith; Christof *forces* it. This is a point of divergence.
