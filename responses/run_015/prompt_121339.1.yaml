  Two colleagues in my evolutionary-game-theory reading group, Maya and Jonas, got stuck on whether cooperation in one-shot prisoner's dilemmas can ever be genuinely explained without hidden iteration. Maya opened by insisting that every successful account—indirect reciprocity included—ultimately relies on tracking partners across separate interactions, so calling any case "one-shot" is just hiding the future shadow. Jonas replied that this misses a mechanism he called exit-cost asymmetry: if leaving is cheap for the defector but being abandoned is ruinous, the payoff matrix is dynamically restructured within the single encounter, letting cooperation stabilize with no cross-game memory. Maya countered that reshaping the matrix this way transforms the interaction into a sequential game with an outside option, not a canonical prisoner's dilemma, so Jonas is solving cooperation by changing the subject. Jonas answered that canonical payoff values already encode contextual exit costs, and that Maya's demand for pure isolation is an empirically false idealization that evolutionary dynamics never respect. Maya then argued that if contextual restructuring is allowed so freely, cooperation becomes trivially explained and the prisoner's dilemma loses its explanatory power for human altruism altogether—Jonas dissolves the problem rather than solving it. They asked me to referee, and I want a precise verdict. Please adjudicate their exchange move by move in a numbered list of exactly five items, each one to two sentences, with no introduction or conclusion: for each move say who is more right, what the other party is missing, and whether both are partly correct, and close by noting what both overlook about how noisy exit options actually affect evolutionary stability.
