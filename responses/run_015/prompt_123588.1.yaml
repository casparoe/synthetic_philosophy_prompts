answer: |-
  # Workshop Design: "The Allocation Game"
  **Time:** 90 Minutes
  **Participants:** 18 Undergraduates (Mixed EA familiarity)
  **Facilitator:** 1
  **Materials:** Whiteboard + markers, 5 decks of printed cards (see below), ~200 poker chips (or paper tokens), 1 prize (e.g., a bag of chocolate or a $10 coffee card).

  ---

  ## 1. Materials Preparation

  ### A. Poker Chips (Currency)
  *   Give each group **100 chips** at the start.
  *   Chips represent "Grant Budget" (Phases 1 & 2) or "Career Capital" (Phase 3).

  ### B. Phase 1 Cards: "Intervention Portfolio" (12 Cards per group)
  *Print 12 cards per group. 6 are "Precise", 6 are "Vague".*
  *   **Precise Cards:** "Deworming Program: Cost 5 chips. Return: 10 Impact Points (IP)." / "Malaria Nets: Cost 10 chips. Return: 25 IP." (Use simple ratios).
  *   **Vague Cards:** "Local Advocacy: Cost 5 chips. Return: 'High potential, context dependent'." / "Community Resilience: Cost 10 chips. Return: 'Variable, long-term'."
  *   **Audit Tokens:** Give each group 3 "Audit Tokens".
      *   *Rule:* They can spend 1 Token + 5 Chips to "Audit" a Vague card.
      *   *Effect:* Flip the card. The return becomes a range (e.g., "5–50 IP").
      *   *Catch:* Ranges are hard to score. For the game, they must score the *minimum* of the range to "be safe." (This incentivizes avoiding audits).

  ### C. Phase 2 Card: "The Systemic Shift" (1 Card per group)
  *   **Text:** "Policy Overhaul. Cost: 60 Chips. Payoff: 200 IP. **Condition:** Total global contribution must exceed 150 Chips. Payoff is distributed equally to all groups who contributed at least 1 chip."
  *   *Note:* No single group (100 chips) can trigger this alone. They must coordinate across tables.

  ### D. Phase 3 Cards: "Career Paths" (4 Cards per student)
  *Print 1 set of 4 cards per student (72 cards total).*
  1.  **High Finance:** Salary $200k. Give 50%. Direct Impact: Low. **Replacement:** Yes (Someone else will take this job).
  2.  **AI Safety Research:** Salary $80k. Give 20%. Direct Impact: High. **Replacement:** No (You are uniquely qualified).
  3.  **Nonprofit Director:** Salary $60k. Give 10%. Direct Impact: High. **Replacement:** No.
  4.  **Government Advisor:** Salary $90k. Give 10%. Direct Impact: Medium. **Replacement:** Yes.

  *Scoring Key (Handout to students in Phase 3):*
  *   Donation Points: $1k donated = 1 IP.
  *   Direct Impact Points: Listed on card (High=50, Med=30, Low=10).
  *   **Counterfactual Rule:** If Replacement = "Yes", Direct Impact Points = 0.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Grouping** | Split into 4 groups (Two groups of 5, Two groups of 4). Hand out chips & Phase 1 cards. |
  | **05-25** | **Phase 1: Allocation** | Groups buy cards to maximize IP. Audit option available. |
  | **25-30** | **Transition** | Collect Phase 1 cards. Reveal Phase 2 rules on Whiteboard. |
  | **30-50** | **Phase 2: Systemic** | Groups decide on "Systemic Shift". Allow cross-table talk. |
  | **50-55** | **Transition** | Collect chips. Hand out Phase 3 cards & Scoring Key. |
  | **55-75** | **Phase 3: Careers** | Individual choice. Calculate personal scores. |
  | **75-80** | **Scoring & Prize** | Tally group totals (P1+P2) + Individual averages. Award trivial prize. |
  | **80-90** | **Debrief** | Reveal the critiques. Map game mechanics to EA theory. |

  ---

  ## 3. Facilitator Script (The "Black Box" Phase)

  *Do not mention Effective Altruism, bias, or critiques during the game. Act as a neutral Game Master.*

  **Intro (00:00):**
  "Welcome. For the next 75 minutes, you are allocation officers. Your goal is simple: Maximize Impact Points (IP). The group with the highest total IP wins a prize. The rules will evolve in three phases. Do not discuss the philosophy of the game; just play to win."

  **Phase 1 Instructions (05:00):**
  "You have 100 chips. You have 12 intervention cards. Each card has a cost and a return. Buy as many as you can. You have 3 Audit Tokens. If you audit a 'Vague' card, you learn the true range, but you must score the *minimum* value to be safe. You have 20 minutes. Go."
  *(Walk around. If they ask about Vague cards, say: "The data is uncertain. Audit if you dare.")*

  **Phase 2 Instructions (30:00):**
  "New opportunity. The 'Systemic Shift'. It costs 60 chips. The payoff is huge. But look at the condition on the whiteboard."
  *(Write on Whiteboard: GLOBAL THRESHOLD = 150 CHIPS. ALL CONTRIBUTORS SHARE REWARD.)*
  "You may talk to other tables. If the threshold isn't met, all chips spent on this are lost. 20 minutes. Go."
  *(Do not help them coordinate. Let the awkwardness happen.)*

  **Phase 3 Instructions (55:00):**
  "Phase 3 is individual. You are choosing a career. Take one card. Calculate your score using this key."
  *(Hand out Scoring Key).*
  "Remember the 'Replacement' rule. If someone else takes the job, your direct impact is zero. 20 minutes. Go."

  **Scoring (75:00):**
  "Phase 1 & 2 scores are group totals. Phase 3 scores are individual averages. I will calculate the winner."
  *(Deliberately take 3 minutes to tally to let tension build.)*
  "The winners are... [Group X]. Here is your chocolate."

  ---

  ## 4. The Debrief Script (The Reveal)

  *Shift tone from Game Master to Facilitator. Move to the whiteboard.*

  **Facilitator:** "Thank you for playing. You just navigated three specific dilemmas that Effective Altruism (EA) grapples with. We didn't name them during the game so you could feel the pressure of the mechanics first. Let's map what happened."

  **Critique 1: Measurability Bias (Phase 1)**
  *   **Ask:** "In Phase 1, how many groups audited a Vague card?" (Likely few). "Why?"
  *   **Participant Response:** "The range was too wide." "It lowered our guaranteed score." "The Precise cards were safer."
  *   **The Reveal:** "This is **Measurability Bias**. In EA, we prefer interventions with clean RCT data (like bednets) because we can count the lives saved. But interventions like policy change or movement building are 'Vague cards'. The game punished you for auditing them (forcing the minimum score). In reality, rigorous measurement is expensive and can make high-upside projects look *worse* than they are, causing us to underfund them."

  **Critique 2: Institutional & Systemic Change (Phase 2)**
  *   **Ask:** "Did any group try to coordinate? Did anyone feel hesitant to contribute chips?"
  *   **Participant Response:** "We didn't trust the other tables." "I didn't want to lose my chips if they didn't pay up."
  *   **The Reveal:** "This is the **Institutional Critique**. The 'Systemic Shift' required coordination and trust. EA often focuses on direct, individual actions (Phase 1) because they are controllable. But changing systems (laws, norms) requires collective action where you can't guarantee credit. The game made this risky (thresholds, shared reward). In the real world, this leads EA to underinvest in systemic change because the 'ROI' is harder to claim and harder to guarantee."

  **Critique 3: Counterfactuals & Earning to Give (Phase 3)**
  *   **Ask:** "Who picked High Finance? Who picked Nonprofit? Did the Finance salary always win?"
  *   **Participant Response:** "I picked Finance but my score was low because Replacement was Yes."
  *   **The Reveal:** "This is **Counterfactual Fragility**. 'Earning to Give' suggests you should take a high salary and donate. But the game added a 'Replacement' rule. If someone else would have done the job anyway, your direct impact is zero. In reality, if you don't take the AI Safety job, maybe no one does. If you don't take the Finance job, someone else *will*. The math of 'Earning to Give' breaks down if you ignore replaceability."

  ---

  ## 5. Failure Analysis & Recovery

  ### Predictable Failure 1: Math Paralysis
  *   **What goes wrong:** Students spend 10 minutes calculating Phase 1 ratios instead of buying.
  *   **Recovery:** At minute 10, announce: "Market closing in 5 minutes. Unspent chips vanish." Scarcity forces action.
  *   **Limitation:** You cannot fully simulate the *cost* of measurement in 20 minutes. You must state in the debrief: "In reality, auditing takes years, not 5 chips."

  ### Predictable Failure 2: Phase 2 Cynicism
  *   **What goes wrong:** One group realizes they can free-ride. They contribute 1 chip to qualify for the reward but let others pay the 60 cost. Other groups notice and refuse to pay. The threshold fails.
  *   **Recovery:** This is actually a *success* for the lesson. Highlight it in the debrief. "This is the Free Rider Problem. It shows why systemic change is harder than direct charity."
  *   **Limitation:** The game assumes a "Global Threshold." In reality, systemic change isn't always a binary switch. You must clarify: "Real change is incremental, not all-or-nothing, which makes the coordination problem even harder."

  ### Predictable Failure 3: Phase 3 Confusion
  *   **What goes wrong:** Students misunderstand the "Replacement" rule and add Direct Impact points even when Replacement = Yes.
  *   **Recovery:** Walk around during Phase 3. If you see the error, ask: "If you quit tomorrow, does the work still get done?" Let them self-correct.
  *   **Limitation:** The game reduces "Career Impact" to a single number. You must state: "Real career satisfaction and long-term trajectory aren't points. EA critics argue this ignores the human cost of 'instrumentalizing' your life."

  ### What The Mechanics Cannot Deliver (Honesty Check)
  *   **Moral Weight:** The game treats all Impact Points as equal. In reality, saving a life today vs. preventing existential risk are not comparable numbers. *You must state this.*
  *   **Emotional Resonance:** The game is cold. EA is often driven by compassion. The game simulates the *logic* but not the *motivation*. *You must state this.*
  *   **The "Right" Answer:** The game implies there is an optimal score. In EA, there is deep disagreement on the "true" values. *You must state this.*

  ---

  ## 6. Facilitator Cheat Sheet (The "Gotchas")

  1.  **If a group asks:** "Is this teaching us EA is wrong?"
      *   **Say:** "It's teaching you where the *tensions* are. EA is a toolkit; this shows where the tools have sharp edges."
  2.  **If Phase 2 collapses (no one pays):**
      *   **Debrief Line:** "Perfect. You just demonstrated why EA struggles with political change. Individual rationality led to collective failure."
  3.  **If a student dominates the group:**
      *   **Intervention:** "I need to hear from someone who hasn't spoken yet before you buy the next card."
  4.  **If the Prize feels too trivial:**
      *   **Reframe:** "The prize is trivial on purpose. If I offered $100, you would have played differently. EA asks us to care about strangers as much as we care about this prize. That's the hard part."

  ---

  ## 7. Post-Workshop Reading List (Handout)
  *Provide this at the very end so they can explore the critiques you just felt.*
  1.  **On Measurability:** *The Tyranny of Metrics* by Jerry Muller (Excerpt).
  2.  **On Systemic Change:** *Doing Good Better* (Chapter on Policy) vs. *The Against EA Podcast* (Episode on Systemic Change).
  3.  **On Careers:** *80,000 Hours* Key Ideas (Section on Replaceability).
