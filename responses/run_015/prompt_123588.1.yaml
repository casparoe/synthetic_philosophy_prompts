t.

      *   **Currency:** Poker chips. "Impact Points" (IP).
      *   **Phase 1 (The Trap of Precision):**
          *   Cards: "Bednets" (exact cost/life), "Vitamin A" (exact), vs. "Policy Reform" (vague), "Community Building" (vague).
          *   Audit: Spend chips to reveal range. Usually, the range is so wide it makes the card uninvestable compared to the precise ones.
          *   *Goal:* Groups hoard precise cards.
      *   **Phase 2 (The Coordination Trap):**
          *   "The Systemic Shift". Cost: High. Payoff: Massive but shared. Threshold: Total chips from *all* groups.
          *   *Goal:* Groups hesitate to contribute because they want to save for Phase 1 style wins, or fear others won't contribute.
      *   **Phase 3 (The Career Trap):**
          *   Cards: Finance (High $, Low Direct, Replacement = Yes), Research (Med $, Med Direct, Replacement = No), Nonprofit (Low $, High Direct, Replacement = No), etc.
          *   Scoring: Personal Score = (Donation * Multiplier) + Direct Impact - Counterfactual Penalty.
          *   *Goal:* Show that high donation isn't always highest score if replacement is likely.

  4.  **Developing the Materials:**
      *   Need specific card text.
      *   Need scoring rules that are simple enough to calculate quickly but complex enough to hide the lesson.
      *   Need a whiteboard layout for tracking global progress (Phase 2).

  5.  **Developing the Timeline:**
      *   90 mins total.
      *   Intro: 5 min.
      *   Phase 1: 20 min.
      *   Phase 2: 20 min.
      *   Phase 3: 20 min.
      *   Scoring/Prize: 5 min.
      *   Debrief: 20 min.
      *   *Total:* 90 min. Tight. Need to keep transitions sharp.

  6.  **Developing the Debrief (The Crucial Part):**
      *   Must map specific game moments to the critiques.
      *   Must admit limitations (e.g., the game simplifies the "earning to give" math).
      *   Must provide script for the reveals.

  7.  **Anticipating Failure Modes:**
      *   *Math overload:* Students spend too long calculating. *Fix:* Provide calculators or simplify numbers.
      *   *Cynicism:* Students realize it's a trap immediately. *Fix:* Keep the "prize" trivial so stakes feel low, encouraging natural play.
      *   *Phase 2 Coordination:* If one group hogs the systemic win, others feel cheated. *Fix:* Make the payoff shared equally regardless of contribution (public good), or proportional? Shared equally creates the free-rider problem better.
      *   *Phase 3 Confusion:* Counterfactuals are hard. *Fix:* Clear binary on "Would someone else take this?"

  8.  **Refining the Mechanics (Self-Correction during drafting):**
      *   *Phase 1 Audit:* The prompt says "replace a card's point estimate with a wide interval." I need to make sure this *feels* like a loss. If I audit a "50 lives saved" card, it becomes "10-90 lives saved." Groups will avoid this to maximize expected points. This demonstrates measurability bias (preferring the known quantity).
      *   *Phase 2 Threshold:* Needs to be high. If there are 4 groups with 100 chips each, threshold should be 250. No single group can do it. They must talk.
      *   *Phase 3 Scoring:* Needs to be individual. The "Replacement" mechanic is the counterfactual. If Replacement = Yes, your direct impact counts as 0 (because they would have done it anyway). If Replacement = No, it counts. This forces the trade-off between salary (donation) and direct impact (replaceability).

  9.  **Writing the Script:**
      *   Tone: Neutral, game-master-like. Do not hint at EA philosophy.
      *   Debrief: Shift to facilitator/teacher mode.

  10. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   18 undergrads? Yes.
      *   Mixed familiarity? Yes (rules must be intuitive).
      *   No lecture up front? Yes.
      *   Three critiques hidden? Yes.
      *   Materials listed? Yes.
      *   Failure analysis? Yes.

  11. **Drafting the Content:** (Mental check of the Phase 3 scoring).
      *   If I earn $100k, give 50% ($50k). Conversion rate: 1 IP per $1k donated = 50 IP.
      *   Direct Impact: 100 IP.
      *   Replacement: Yes.
      *   Score: 50 (donation) + 0 (direct, because replaced) = 50.
      *   Alternative: Earn $40k, give 50% ($20k) = 20 IP. Direct Impact 100 IP. Replacement: No.
      *   Score: 20 + 100 = 120.
      *   *Lesson:* Lower salary can win if replaceability is low. This captures the critique.

  12. **Final Polish:** Ensure the "Audit" mechanic in Phase 1 is clear. It costs chips to audit. It makes the number vague. Groups won't want to do it. This mirrors the cost of rigorous RCTs making interventions look less certain.

  Let's assemble the document.

