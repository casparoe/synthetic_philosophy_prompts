  *Decision:* I will instruct the facilitator to create **Four Groups of 4** and **One Group of 2**. I will note that the Group of 2 should be merged into two existing groups to make them Groups of 5. So: **Two Groups of 5, Two Groups of 4.** Total 18. This fits the prompt exactly.

  *Wait, one more check on Phase 2:* "Unlocked only above a funding threshold that no single group can reach alone." This requires inter-group communication. I need to allow time for that.

  *Wait, one more check on Phase 3:* "Each student individually picks." This means scoring is individual, not group. This contrasts with Phase 1 & 2. Good.

