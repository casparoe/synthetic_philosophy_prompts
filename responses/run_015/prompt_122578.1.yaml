      Welfarist: Same satisfaction (B saves time).
      Capability: A has the capability of "fiscal agency." B has the capability of "being fiscally managed."
      Transfer: Giving B more money doesn't bypass the Admin (rule-based).
      Wrongdoer: None (efficiency protocol).
      Internal: No difference in competence.
      Setting: Change the protocol.
      *Why this works:* It separates *outcome* (expenses paid) from *process* (who acts).
      *Resourcist Counter:* "Administrative support" is a resource. B has *more* support.
      *Capability Counter:* It's not support; it's a **gatekeeper**.
      *Refinement:* Make it so B *cannot* submit directly. The portal is locked for B.
      *Resourcist:* "Portal access" is a resource. B has less.
      *Okay, I must confront the Resourcist definition of resource.*
      If the Resourcist defines resources broadly enough (rights, access, powers), they will always claim equality or inequality based on that.
      The prompt asks for a case where the Resourcist *finds them equally well off*.
      So I must construct the resource description such that a Rawlsian/Dworkinian would say "Equal Primary Goods."
      Primary Goods: Rights, Liberties, Opportunities, Income, Wealth, Social Bases of Self-Respect.
      If B lacks the liberty to submit expenses, Rawls says "Unequal Liberty."
      I need a case where the **Formal Liberty** is equal, but the **Effective Capability** differs due to structural friction that isn't a resource deficit.

