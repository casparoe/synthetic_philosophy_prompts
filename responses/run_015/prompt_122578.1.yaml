      Wait, if the burden is time/effort, Resourcist says "Time is a resource."
      I need the burden to be **Symbolic/Status-based**.
      **The "Presumed Guilt" Case.**
      Two travelers, A and B.
      Same ticket, same seat.
      A: Walks through security.
      B: Walks through security, but is randomly selected for "Secondary Screening" every time (due to a name flag, not behavior).
