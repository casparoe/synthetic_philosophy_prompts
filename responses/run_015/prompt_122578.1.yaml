prompt: |-
  For a graduate seminar on the equality-of-what question, I need a case that separates the capabilities critique from the examples that normally carry it. Construct a case involving two people in which the resourcist finds them equally well off, the welfarist also finds them equally well off, and the capability theorist finds one of them clearly worse off, in a way a capability theorist would count as a genuine loss rather than a mere difference in option sets. Constraints: a realistic setting (a workplace, a clinic, a school, a housing estate); one paragraph of scenario; and none of the stock mechanisms may do the work — no disability or illness, no difference in talent, skill, or effort, no expensive or adaptive preferences, no difference in internal constitution of any kind. The gap must also be one that no transfer of resources to the worse-off party closes, and that cannot be traced to an identifiable wrongdoer who could be taxed or punished; if it can be closed at all, it closes only by altering the setting. Assume further that the worse-off party is contented and would not trade places, so that no welfarist appeal to frustration or unmet desire is available.

  Then do the check: state what each of the three metrics is comparing and show why it returns the verdict it does; name the single feature of the case doing the work; say what happens to the capability verdict if that feature is removed; and give the strongest reply available to the resourcist or the welfarist — not that capabilities are hard to index or measure, but that the capability comparison is tracking something distributive justice should not be in the business of equalizing. Finish by telling me honestly whether the case generates these verdicts from the metrics or quietly stipulates them, since what I want to know is whether the critique has any force once the usual examples are off the table.
reasoning: |-
  Here's a thinking process that leads to the suggested case and analysis:

  1.  **Analyze the Request:**
      *   **Goal:** Construct a case for a graduate seminar on the "equality-of-what" debate (Sen vs. Rawls/Dworkin vs. Utilitarians).
      *   **Core Task:** Create a scenario where:
          *   Resourcist verdict: Equal.
          *   Welfarist verdict: Equal.
          *   Capability verdict: Unequal (one is clearly worse off).
      *   **Constraints (Negative):**
          *   Realistic setting (workplace, clinic, school, housing).
          *   One paragraph scenario.
          *   NO disability/illness (the standard Sen example).
          *   NO difference in talent/skill/effort.
          *   NO expensive/adaptive preferences.
          *   NO difference in internal constitution (biology/psychology).
          *   NO resource transfer fixes the gap.
          *   NO identifiable wrongdoer (cannot tax/punish).
          *   NO frustration/unmet desire (worse-off party is contented/won't trade).
      *   **Analysis Requirements:**
          *   Check: State what each metric compares and why it returns the verdict.
          *   Identify the single feature doing the work.
          *   State what happens if that feature is removed.
          *   Strongest reply from Resourcist/Welfarist (normative, not epistemic).
          *   Honest assessment: Does the case *generate* the verdicts or *stipulate* them? (Is the critique robust?)

  2.  **Deconstruct the Constraints & Search for the "Gap":**
      *   *Resourcist Equality:* Both have the same goods, income, rights, access.
      *   *Welfarist Equality:* Both have the same utility, happiness, satisfaction.
      *   *Capability Inequality:* One has less *freedom* to achieve functionings, even if they don't value those functionings or don't realize they are missing them.
      *   *The Hard Part:* Usually, capability inequality arises because Person A needs more resources to do X than Person B (disability) or Person A values X more (preferences). Both are banned.
      *   *The "No Transfer" Constraint:* Giving money/goods doesn't help. This suggests the issue is structural or environmental, not individual endowment.
      *   *The "No Wrongdoer" Constraint:* It's not oppression or discrimination in the legal sense.
      *   *The "Contented" Constraint:* The worse-off person doesn't feel worse off. This targets the "objective list" aspect of capabilities vs. subjective well-being.

      *Idea Generation:*
      *   *Idea 1: Cultural/Religious restrictions.* (Banned? Maybe "internal constitution" or "preferences"?) If a religion forbids using a resource, is that a preference or a constraint? Sen usually treats this as adaptive preferences or conversion factors. Risky.
      *   *Idea 2: Geographic isolation.* Two villages, same resources. One is cut off by a river. But a bridge (resource transfer) fixes it. Violates "no transfer closes gap."
      *   *Idea 3: Social Norms/Expectations.* Two employees, same pay, same skills. One is a man, one is a woman. Social norms prevent the woman from traveling alone at night.
          *   *Resourcist:* Same pay/contract.
          *   *Welfarist:* She doesn't mind staying home; she's happy.
          *   *Capability:* She lacks the *freedom* to travel safely, even if she doesn't exercise it.
          *   *Problem:* Is this "discrimination" (wrongdoer)? Is it "internal constitution" (fear)?
          *   *Refinement:* Make it about *structural* safety without a specific aggressor.
      *   *Idea 4: Temporal/Structural Lock-in.* Two tenants in the same housing estate. Same rent, same apartment layout. One is on the ground floor, one on the fourth. The elevator is broken.
          *   *Resourcist:* Same lease, same rent.
          *   *Welfarist:* Ground floor tenant likes exercise (stairs); 4th floor tenant is content reading at home. Both happy.
          *   *Capability:* 4th floor tenant cannot *choose* to leave easily.
          *   *Problem:* Fixing the elevator is a resource transfer. Violates constraint.
      *   *Idea 5: The "Option Set" vs. "Effective Freedom" distinction without conversion factors.*
      *   *Idea 6: Surveillance/Privacy.* Two workers. Same pay, same tasks. One is monitored, one is not.
          *   *Resourcist:* Same wage.
          *   *Welfarist:* Monitored worker doesn't care (contented).
          *   *Capability:* Monitored worker lacks the functioning of "privacy" or "autonomy."
          *   *Problem:* Is privacy a resource? If I give them a "privacy shield," does it help?
      *   *Idea 7: The "Fragility of Status" or "Contingent Access".*
      *   *Idea 8: Algorithmic Management / Digital Leash.*
      *   *Idea 9: The "Single Feature" must be external and structural.*

      *Let's try a specific angle: "The Architecture of Choice" without resource disparity.*
      Consider two students in a school. Same curriculum, same support.
      Student A: School is in a neighborhood where the library is open late.
      Student B: School is in a neighborhood where the library closes early due to municipal zoning/budgeting that affects the *area*, not the student directly.
      *Critique:* This is a resource difference (access to library).

      *Let's try: "The Burden of Compliance".*
      Two recipients of a universal basic income (UBI). Same amount.
      Person A: Lives in a jurisdiction with simple tax filing.
      Person B: Lives in a jurisdiction with complex bureaucratic hurdles to maintain eligibility, even if they pass them easily.
      *Critique:* This eats into resources (time/effort). Banned (effort/talent).

      *Let's try: "Social Meaning of Resources".*
      Two people have identical bicycles.
      Person A: Can ride anywhere.
      Person B: Can ride anywhere, *but* riding implies a social transgression that invites harassment (not illegal, just social).
      *Critique:* This relies on social norms (often treated as conversion factors).

      *Let's go deeper into the "No Transfer" constraint.*
      If I give Person B more money, it doesn't fix the capability loss. This implies the loss is *constitutive* of the setting, not a lack of means within the setting.
      This points toward **Structural Dependence** or **Vulnerability to Arbitrary Power**.

      *Case Idea: The "At-Will" vs. "Tenured" Parallel.*
      Two researchers in the same institute. Same salary, same lab, same output.
      Researcher A: Has a permanent contract (tenure).
      Researcher B: Has a rolling 1-year contract, but renewal is guaranteed and expected.
      *Resourcist:* Same income, same lab access.
      *Welfarist:* B is confident, happy, sleeps well. No anxiety.
      *Capability:* B lacks the *security* of tenure. Even if B doesn't feel anxious, B lacks the *freedom* to plan a 5-year project without permission.
      *Constraint Check:*
      *   Disability? No.
      *   Talent? No.
      *   Preferences? B is content.
      *   Transfer? Giving B more money doesn't give tenure.
      *   Wrongdoer? No specific villain, just HR policy.
      *   Setting Alteration? Yes, change the contract structure.
      *   *Problem:* Is "job security" a resource? Dworkin might say insurance markets should handle this. Sen would say it's a capability (security).
      *   *Refinement:* Make it less about contract law and more about *physical/structural* contingency.

      *Case Idea: The "Public Space" Design.*
      Two residents in a housing estate. Identical apartments. Identical income.
      Resident A: Lives in a wing with wide corridors and benches.
      Resident B: Lives in a wing with narrow corridors and no resting spots.
      *Resourcist:* Same square footage, same rent.
      *Welfarist:* B is young and fit, doesn't mind walking. Happy.
      *Capability:* B cannot *choose* to linger or socialize in the hallway.
      *Constraint Check:*
      *   Transfer? Giving B money doesn't widen the hall.
      *   Setting? Yes, renovate.
      *   Internal Constitution? B is fit (no disability).
      *   *Problem:* This feels like a resource difference (quality of apartment).

      *Let's try to hit the "No Transfer" constraint harder.*
      The gap must be uncloseable by giving the worse-off person *more stuff*. It must be about the *relation* to the stuff.
      **The Case of the "Conditional Access".**
      Two citizens. Same income. Same legal rights on paper.
      Citizen A: Lives in a district where public parks are unlocked 24/7.
      Citizen B: Lives in a district where public parks are unlocked 24/7, *but* access requires a digital key fob that is technically glitchy, requiring daily re-authorization, though it always works eventually.
      *Critique:* This is a hassle/resource drain.

      *Let's pivot to **Epistemic/Informational Asymmetry** that isn't a resource.*
      Two patients in a clinic. Same treatment, same cost.
      Patient A: Doctor explains everything clearly.
      Patient B: Doctor uses jargon, but Patient B trusts the doctor completely and is happy.
      *Resourcist:* Same medical care.
      *Welfarist:* Both satisfied.
      *Capability:* B lacks "health literacy" or "agency in health."
      *Constraint:* Is information a resource? Yes.

      *Okay, the strongest candidate for "Capability without Resource/Welfare difference" that isn't disability is **Social Status / Recognition** embedded in structure.*
      But Rawls includes "social bases of self-respect" as a primary good. So Resourcist might claim equality.

      *Let's try **The "Fragility of Functioning"**.*
      Two people have the same ability to walk.
      Person A walks on a paved sidewalk.
      Person B walks on a paved sidewalk that is scheduled for demolition next week, but they don't know it.
      *Welfarist:* Both happy.
      *Resourcist:* Both have access to a sidewalk *now*.
      *Capability:* B's functioning is fragile/contingent.
      *Problem:* This is about future risk.

      *Let's go with **The "Monitored vs. Unmonitored" Worker** but refine it to avoid "privacy as resource".*
      Setting: A high-end warehouse.
      Workers: Alpha and Beta.
      Pay: Identical.
      Tasks: Identical.
      Breaks: Identical.
      Difference: Alpha wears a haptic vest that *guides* movement (optimizes path). Beta wears a haptic vest that *corrects* movement (vibrates when deviating).
      *Resourcist:* Same equipment, same pay.
      *Welfarist:* Beta finds the vibration soothing/rhythmic. Both report equal job satisfaction.
      *Capability:* Alpha has the functioning of "autonomous movement." Beta has the functioning of "compliant movement." Beta *can* deviate, but is immediately corrected.
      *Wait:* If Beta *can* deviate, they have the capability. The vest just signals.
      *Modification:* The vest *logs* deviation for review. Alpha's vest does not log.
      *Resourcist:* Same tech.
      *Welfarist:* Beta doesn't care about being logged. Content.
      *Capability:* Beta lacks the freedom to act without scrutiny.
      *Constraint Check:*
      *   Transfer? Giving Beta money doesn't stop the logging.
      *   Wrongdoer? It's company policy, not a villain.
      *   Internal? No difference in psychology.
      *   Setting? Change the policy (software setting).
      *   *Is "being logged" a resource deprivation?* Rawls might say "liberties" are primary goods. If the legal right is the same, but the *surveillance* differs...
      *   *Refinement:* Make it about **Algorithmic Discretion**.

      *Let's try a Housing Case (more tangible).*
      Two tenants, A and B, in identical apartments in the same building. Same rent.
      A's apartment has windows that open.
      B's apartment has windows that are sealed shut (for energy efficiency/safety), but the HVAC system provides identical air quality and temperature.
      *Resourcist:* Same air quality, same temp, same rent. (Resource = breathable air/comfort).
      *Welfarist:* B loves the sealed windows (less noise, no drafts). B is happier/equally happy.
      *Capability:* B cannot *choose* to open the window. B lacks the functioning of "controlling one's immediate environment."
      *Constraint Check:*
      *   Disability? No.
      *   Talent? No.
      *   Preferences? B is content (adaptive or not, doesn't matter for welfarist).
      *   Transfer? Giving B money doesn't unseal the window (structural).
      *   Wrongdoer? Architect/Builder (gone), Landlord (policy). Not a "wrongdoer" in the punitive sense, just a design choice.
      *   Setting? Retrofit windows.
      *   *Is this a resource difference?* The "window" is a physical resource. But the *function* (air/temp) is equalized. The *agency* is not.
      *   *Resourcist Counter:* "Control over environment" is a resource. If B lacks it, they have fewer resources.
      *   *Rebuttal:* The resource inventory (square footage, amenities list) is identical. The *specification* differs. Dworkin might say "You chose the building."
      *   *Refinement for "No Transfer":* If I give B money, they can't buy a new window in a rental. They must move (alter setting).

      *Let's sharpen the "No Transfer" constraint.*
      The prompt says: "The gap must also be one that no transfer of resources to the worse-off party closes."
      In the window case, if I give B enough money, they can move to an apartment with openable windows.
      I need a case where money *within the setting* doesn't fix it.
      This implies the inequality is **relational** or **systemic** within the specific context.

      *Idea: **The "Designated Representative"**.*
      Setting: A Clinic.
      Patients: A and B.
      Condition: Identical minor ailment.
      Treatment: Identical medication.
      Process:
      Patient A: Prescribed medication directly.
      Patient B: Prescribed medication, but protocol requires a guardian/co-signer to pick it up (due to a bureaucratic categorization of their neighborhood/zone, not individual status).
      *Resourcist:* Same meds available.
      *Welfarist:* B has a helpful neighbor who picks it up. B is content.
      *Capability:* B lacks the agency to access care independently.
      *Constraint:* Transfer? Money doesn't bypass the protocol.
      *Wrongdoer?* It's a policy.
      *Internal?* No difference in B's capacity.
      *Problem:* This looks like discrimination (wrongdoer).

      *Idea: **The "Default Option" Architecture**.*
      Setting: A Corporate Pension/School Cafeteria.
      Let's go with **School Cafeteria**.
      Students A and B.
      Same budget (meal plan).
      Same food available.
      Difference:
      Student A's ID defaults to "Choose Daily."
      Student B's ID defaults to "Pre-selected Meal" (nutritionally identical). B can opt-out, but the opt-out requires a 24-hour advance digital form.
      *Resourcist:* Same food access, same budget.
      *Welfarist:* B likes the convenience. B is content.
      *Capability:* B lacks the *immediate* freedom to choose. The friction reduces the effective capability set.
      *Constraint:* Transfer? Money doesn't remove the friction.
      *Setting? Change the software default.
      *Is this genuine?* Sen talks about "process freedom."
      *Resourcist:* "Friction" is a price. B pays less time, loses choice.
      *Capability:* It's about the *status* of being an agent vs. a recipient.

      *Let's try to find the "Single Feature" that is most robust.*
      **Feature: The Revocability of Access.**
      Setting: A Housing Estate (Gated Community).
      Residents A and B.
      Identical houses. Identical fees.
      A: Has a permanent key code.
      B: Has a temporary key code that auto-renews every 24 hours. It always renews.
      *Resourcist:* Same access, same house.
      *Welfarist:* B doesn't notice/know. B is happy.
      *Capability:* B's access is contingent. B lives at the mercy of the system, even if the system never fails. B lacks the *security* of tenure.
      *Transfer?* Money doesn't make the key permanent.
      *Wrongdoer?* No, just a software glitch/policy.
      *Internal?* No.
      *This works.* It highlights **Independence vs. Dependence** even when outcomes are identical.

      *Refining the "Window" vs. "Key" case.*
      The "Key" case is better because it's about *status* relative to the authority, not just physical mechanics.
      Let's make it a **Workplace Access** case.
      Two employees. Same clearance level on paper.
      Employee A: Badge grants access automatically.
      Employee B: Badge grants access, but requires a daily remote authorization ping. It always comes through.
      *Resourcist:* Same access.
      *Welfarist:* B doesn't know/cares not. Happy.
      *Capability:* B is subject to arbitrary power (in the Pettit sense, though we are doing Sen). B lacks the *assuredness* of the functioning.
      *Wait, Sen's Capability Approach:* It's about the *set* of achievable functionings. If the ping *always* comes, the set is the same *ex post*. But *ex ante*, is it?
      If the probability is 100%, the capability set is identical.
      I need a case where the *nature* of the functioning differs, not just the risk.
      **The "Process" Argument.**
      Sen values the *process* of choosing, not just the opportunity.
      If I am fed by force (but I wanted the food), I have the functioning "being nourished," but I lack the functioning "eating by choice."
      So, I need a case where the *outcome* is the same, the *satisfaction* is the same, but the *agency* is structurally bypassed for one person.

      *Revised Case: The "Algorithmic Assignment".*
      Setting: A Gig Economy Platform (e.g., delivery).
      Workers: A and B.
      Pay: Identical average hourly rate.
      Hours: Identical.
      Mechanism:
      Worker A: Selects shifts from a board.
      Worker B: Is assigned shifts by an algorithm. The algorithm perfectly matches B's preferred times (unknown to B). B is content.
      *Resourcist:* Same income, same hours (resources).
      *Welfarist:* Same satisfaction (B gets preferred times without effort).
      *Capability:* A has the functioning of "scheduling autonomy." B has the functioning of "being scheduled." Even if the result is identical, B lacks the *agency* component of the capability.
      *Constraint Check:*
      *   Transfer? Money doesn't give B the login to the scheduler.
      *   Wrongdoer? Algorithm (no intent).
      *   Internal? B has same capacity to schedule.
      *   Setting? Change the interface to allow B to choose.
      *   *Is this a "genuine loss"?* Yes, for a capability theorist, agency is constitutive.
      *   *Resourcist Reply:* "Autonomy" is a resource. If B lacks it, they have fewer resources.
      *   *Counter:* The resource bundle (access to the app, time) is identical. The *mode of deployment* differs.

      *Let's polish this into the "One Paragraph" constraint.*
      Setting: A logistics warehouse.
      Two workers, Ali and Ben.
      Same wage, same shift length, same safety gear.
      Ali chooses his packing station each morning from a digital board.
      Ben is assigned a station by the optimization software.
      The software is perfect: Ben is always assigned the station he would have chosen had he been asked.
      Ben is unaware of the selection mechanism and reports high job satisfaction; he would not trade with Ali.
      Ali knows he chooses.
      *Resourcist:* Equal bundles (wage, time, gear).
      *Welfarist:* Equal utility (Ben is content).
      *Capability:* Ali has the capability of "occupational self-direction." Ben does not, even if his preferences are met.
      *Constraint:* Money doesn't give Ben the login credentials (system rule). No villain (software efficiency). No disability.

      *Wait, one constraint:* "The gap must also be one that no transfer of resources to the worse-off party closes."
      If I give Ben the "login credentials" (information resource), it closes.
      Is "login credentials" a resource? Yes.
      I need to make it so the system *structurally* denies the choice to a category, not via withholding a token.
      *Modification:* It's a policy based on tenure or batch, not individual token.
      *Better:* It's about the **Design of the Interface**.
      Ben's terminal *does not have the button*. Ali's does.
      Is the terminal a resource? Yes.
      This is tricky. If the physical tools differ, Resourcist says "Unequal Resources."
      I need the resources to be *descriptively* identical but *functionally* different regarding agency.
      *How about:* Both have the button. But for Ben, pressing the button does nothing (system override). For Ali, it works.
      Resourcist: "You have the same button."
      Capability: "You don't have the same *power*."
      This feels like a "broken resource" case.
      Let's go back to the **Revocability/Contingency** angle. It's harder to classify as a "resource stock."

      *Case: The "Guest" vs. "Member" Status in a Co-Working Space.*
      Two freelancers, A and B.
      Same desk, same wifi, same coffee, same fee.
      A: Signs a 12-month lease.
      B: Signs a 12-month lease, but the contract includes a "Management Discretion Clause" allowing termination with 24h notice without cause (never exercised).
      *Resourcist:* Same desk, same fee, same legal contract text (mostly). Wait, contract text differs. That's a resource (legal right).
