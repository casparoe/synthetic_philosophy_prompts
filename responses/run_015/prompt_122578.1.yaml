  **The Case of the Managed Stipend**

  In a transitional housing estate for young adults, residents Ali and Ben occupy identical units and receive identical monthly support packages valued at $2,000, designated for living expenses. Ali receives his share as a direct cash deposit into a personal bank account, which he manages autonomously. Ben, due to a standard administrative protocol applied to his cohort based on intake timing rather than individual assessment, receives his share on a restricted prepaid card managed by a caseworker; the caseworker approves every transaction, but the algorithm is calibrated to approve exactly what Ben requests, ensuring his material consumption matches Ali's perfectly. Ben is unaware of the oversight mechanism, trusts the system implicitly, reports high life satisfaction, and would not trade places with Ali. There is no disability, discrimination, or difference in financial literacy between them; the protocol is a benign bureaucratic legacy, not a punishment, and no amount of additional credit on Ben's card grants him direct control.

  **The Check**

  *   **Metrics and Verdicts:**
      *   **Resourcist:** Compares the *index of primary goods* (income, wealth, access). Since both possess commodities worth $2,000 and identical housing, the resource bundles are equivalent. The *mode* of access is not a resource stock but a delivery mechanism; thus, they are equally well off.
      *   **Welfarist:** Compares *utility or preference satisfaction*. Since Ben's consumption matches his desires (approved by the algorithm) and he reports contentment without frustration, his welfare is equal to Ali's.
      *   **Capability Theorist:** Compares the *substantive freedoms* to achieve functionings. Ali possesses the capability of "economic agency" (managing one's own affairs). Ben possesses the functioning of "being provided for" but lacks the capability to *exercise* agency, even if the outcome is identical. The loss is the freedom to make mistakes or act independently, which is a constitutive part of well-being, not just a means to it.

  *   **The Single Feature:**
      The feature doing the work is **Structural Paternalism** (the removal of the *process* of choice while maintaining the *outcome* of choice).

  *   **Removal of Feature:**
      If the administrative protocol is removed (altering the setting), Ben receives the cash deposit. The capability gap closes immediately, not because Ben's resources or happiness change, but because his *status* shifts from a passive recipient to an active agent.

  *   **Strongest Reply (Resourcist/Welfarist):**
      "Distributive justice is concerned with the *distribution of means* to pursue a life, not the *supervision of the pursuit*. If Ben has the means (the $2,000 value) and achieves his ends (satisfaction), requiring the state to equalize the *experience* of agency intrudes on permissible structural efficiencies. Agency is a preference some value and others do not; to treat it as a mandatory metric imposes a specific conception of the good (autonomy) rather than neutralizing resources."

  *   **Honest Assessment:**
      This case **quietly stipulates** the verdicts more than it generates them. It relies on the Resourcist accepting that "control over resources" is distinct from "resources themselves"—a distinction a sophisticated Dworkinian might reject by classifying autonomy as a primary good. Furthermore, it leans heavily on the Capability theorist's prior commitment to "process freedom" as a functioning. However, it does succeed in isolating the critique from the usual confounders (disability, poverty, oppression). It demonstrates that even with perfect resource equality and perfect welfare satisfaction, a capability deficit can exist if justice is understood to include the *status* of the person in relation to their goods, not just the goods themselves. The force of the critique here is not empirical but normative: it challenges whether a theory of justice can remain neutral about *how* people access their share of the social product.
