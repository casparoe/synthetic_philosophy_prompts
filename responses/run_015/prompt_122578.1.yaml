      *Welfarist:* B doesn't care.
      *Capability:* B is treated as a suspect. A is treated as a citizen.
      *This touches on "Social Bases of Self-Respect" (Rawls).* Rawls would say Unequal.
      I need Rawls (Resourcist) to say **Equal**.
      So the difference must be invisible to the "Index of Primary Goods."
      This implies the difference is in the **Conversion Factor** but *not* internal.
      Sen's point: Conversion factors can be social.
      If social norms convert resources differently, Resourcist says "Resources are equal." Capability says "Functionings differ."
      *But the prompt bans:* "No difference in internal constitution." It does *not* ban social conversion factors explicitly, but it bans "discrimination/wrongdoer."
      So it must be a **benign structural friction**.

      *The Winner: The "Algorithmic Nudge" Case.*
      Setting: A Retirement Savings Plan (Workplace).
      Employees A and B.
      Same salary, same employer match (Resources).
      Same investment options available.
      Employee A: Must actively enroll.
      Employee B: Is automatically enrolled (can opt out).
      Both end up enrolled with identical portfolios.
      Both are equally happy with their savings growth.
      Resourcist: Same income, same match, same options. (Primary Goods Equal).
      Welfarist: Same satisfaction (B saved effort).
      Capability: A exercised the capability of "financial planning." B exercised the capability of "being planned for."
      B lacks the *opportunity* to choose, even if the outcome is what they would have chosen.
      *Wait:* B *can* opt out. So the opportunity exists.
      *Refinement:* B is enrolled in a **specific** fund. A chooses the fund.
      The fund B is in is the *same* fund A chose.
      B *can* switch funds.
      So B has the capability.
      *I need B to lack the capability.*
      *Modification:* B is enrolled in a fund that *matches* A's choice, but B is **locked** for 1 year. A is not locked.
      *Resourcist:* "Liquidity" is a resource. B has less. (Inequality found).
      *I need the Resourcist to see Equality.*
      This is the hardest constraint. "Resourcist finds them equally well off."
      This means the resource index *cannot* capture the difference.
      This implies the difference is **non-material** and **non-legal**.
      It must be **Epistemic**.
      **The "Black Box" Case.**
      Two patients. Same drug. Same outcome.
      Doctor tells A: "This drug works by X mechanism."
      Doctor tells B: "This drug works." (No explanation).
      B is content.
      Resourcist: Same health, same drug. (Information might be a resource, but often excluded from basic index).
      Welfarist: Same happiness.
      Capability: A has "Understanding of one's treatment." B does not.
      *Is understanding a capability?* Yes (Sen/Nussbaum).
      *Is it a resource?* Dworkin might say "No, resources are external."
      *Transfer:* Giving B money doesn't make the doctor talk.
      *Setting:* Protocol change.
      *This fits best.* It separates **Outcome** (Health) from **Agency/Understanding** (Functioning).
      *Wait, constraint:* "No difference in internal constitution." (B is capable of understanding).
      *Constraint:* "No wrongdoer." (Doctor is busy, not malicious).
      *Constraint:* "Resourcist finds equal." (If info is a resource, this fails).
      *Most Resourcists (Rawls)* focus on "All-purpose means." Information is often treated as a resource.
      *However*, if the information doesn't change the *means* to pursue a life plan (since B is content and healthy), the Resourcist might dismiss it.
      *Let's try to make it about **Dependency**.*

      *Final Decision: The "Benevolent Guardian" Structure.*
      Setting: A Group Home for Adults (not disabled, just transitional).
      Residents A and B.
      Same stipend, same room, same meals.
      A: Manages own stipend.
      B: Stipend managed by a caseworker who buys exactly what B would buy.
      B is content and trusts the worker.
      Resourcist: Same economic means.
      Welfarist: Same satisfaction.
      Capability: A has "Economic Agency." B has "Economic Security without Agency."
      Transfer: Money doesn't give B the checkbook.
      Wrongdoer: None (Policy).
      Internal: No difference in capacity.
      *Why Resourcist says Equal:* Dworkin's auction/insurance. If B is happy, the market value of their bundle is the same. The *management* isn't a resource, it's a service. If the service value is equal (B saves time), resources are equal.
      *Why Capability says Unequal:* The *doing* is part of the *being*.
      *This seems to be the only way to satisfy "Resourcist finds equal."*

      *Drafting the Scenario:*
      Focus on the "Managed Stipend" vs. "Direct Stipend" in a supportive housing context.
      Ensure the "Contentment" is clear.
      Ensure the "No Transfer" works (giving B more money doesn't give them control).
      Ensure the "No Wrongdoer" (it's a standard protocol).

      *Analysis Plan:*
      1.  Metrics: Resources (Means), Welfare (Mental States), Capabilities (Freedoms/Functionings).
      2.  Feature: **Structural Agency Denial** (The "Benevolent Paternalism").
      3.  Removal: If removed, B gets the checkbook.
      4.  Reply: Resourcist says "Justice is about means, not how you use them. If B is happy, B is not disadvantaged." Or "Agency is a preference, not a right."
      5.  Honest Assessment: Does it generate or stipulate? It risks stipulating that "Agency" is a capability but not a resource. But it highlights the *process* value.

      *Wait, one last check on "Resourcist finds them equally well off".*
      If I say "A has control, B does not," a sophisticated Resourcist (like Dworkin) might say "Control is a resource."
      I need to frame the resources as **identical bundles of goods**.
      "Both receive $1000 and a meal plan."
      "A gets cash. B gets a card that auto-swipes for the meal plan and $1000 worth of goods."
      If the card buys *exactly* what A buys, the *bundle of commodities* is identical.
      The difference is the **mode of acquisition**.
      Resourcist: "Commodity bundles are equal."
      Capability: "Activity of choosing is a functioning."
      This holds.

      *Refining the "No Transfer" constraint:*
      "The gap must also be one that no transfer of resources to the worse-off party closes."
      If I give B cash instead of the card, it closes.
      So the constraint is: The *system* prevents the transfer from changing the mode.
      "If it can be closed at all, it closes only by altering the setting."
      Yes, changing the *policy* (setting) allows cash. Giving B *more* card value doesn't give cash control.
