  *(Refining the "Morally Informative" point)*: Even if misplaced, Strawson acknowledges reactive attitudes are natural. He wouldn't say the feeling is "fake." He would say the *interpretation* of the feeling is wrong. The feeling signals a breach of norms. The work is to find *who* breached them.

