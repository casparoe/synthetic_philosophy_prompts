answer: |-
  ### Q&A Prep Sheet: Quine, Synthetic Biology, and Governance Indeterminacy

  **Strategy Note:** Your audience is hostile to Quine on two fronts (behaviorism is outdated; realism about kinds is preferred) and indifferent on a third (policy utility). You cannot defend Quine's *psychology*; you must defend his *logical point about public evidence*. You must pivot from "Quine was right about everything" to "Quine's constraint on public meaning remains unrefuted in high-stakes regulatory contexts."

  #### Part 1: Up-Front Concessions (Establish Credibility)
  *Before taking questions, state this clearly:*
  "I concede immediately that Quine's behaviorist *psychology* is obsolete. I am not arguing that scientists lack internal intentional states. My claim is narrower: In *public treaty negotiation*, where internal states are inaccessible and only public usage counts, the behavioral evidence remains insufficient to fix reference for normative-risk terms, regardless of our private realist commitments. I am applying Quine's *logical* thesis, not his psychology."

  ---

  #### Part 2: The Objections (Ordered by Damage & Likelihood)

  **1. The "Dead Behaviorism" Objection (Philosopher of Language)**
  *Phrasing:* "Quine's thesis collapses if you reject the behaviorist straitjacket. We know speakers have causal-historical connections to referents and internal intentional states. Why restrict ourselves to 'stimulus meaning' when we can appeal to the causal theory of reference? If the scientist intends to refer to *Pseudomonas* escape, they refer to *Pseudomonas* escape, regardless of behavioral ambiguity."
  * **Your Reply (2 mins):** "The causal theory works for 'water' or 'gold' in a lab, but fails for normative-risk constructs like 'acceptable threshold.' There is no causal hook between a physical organism and a normative boundary. In treaty negotiations, we *cannot* appeal to private intentions; we only have the public record. If the public record (the behavioral evidence) allows multiple mappings of 'containment failure' to physical events (leak vs. drift vs. spillover) without contradicting observed usage, the reference remains indeterminate *for the purposes of the treaty*. I am not denying internal states exist; I am denying they are admissible evidence in international law."
  * **Soft Spot/Concession:** You concede that reference *might* be fixed privately (in the head), but you insist it fails publicly. A Kripkean will argue that if the causal chain exists, the public meaning rides on it even if we can't see the chain. You are betting on the "public admissibility" constraint over the "metaphysical fixing."

  **2. The "Biology Fixes Reference" Objection (Philosopher of Biology)**
  *Phrasing:* "You claim identical causal interaction underdetermines reference. But the causal powers of the engineered organism are objective facts. If an organism breaches a physical barrier, that is a 'containment failure' in virtue of the mechanism, not the linguistics. The biology determines the kind, not the translation manual."
  * **Your Reply (2 mins):** "The biology determines the *physical event*, but not the *risk classification*. A physical breach could be categorized as a 'containment failure' (regulatory violation), an 'evolutionary drift' (natural process), or an 'ecological spillover' (environmental harm). All three describe the same causal chain but invoke different normative frameworks. My argument is that the *risk vocabulary* supervenes on the biology but is not fixed by it. Two communities can agree on every biological fact yet map those facts to different normative terms without behavioral contradiction. The indeterminacy lies in the *governance layer*, not the biological layer."
  * **Soft Spot/Concession:** You are drawing a sharp fact/value distinction. If the biologists argue that "function" is natural and normative terms like "failure" are grounded in biological dysfunction (Boorse-style), they will claim the biology *does* fix the norm. You must hold the line that "failure" is a policy choice, not a biological discovery.

  **3. The "Policy Irrelevance" Objection (Science-Policy Specialist)**
  *Phrasing:* "Even if you're right metaphysically, it's irrelevant. Treaties function through stipulative definitions and compliance mechanisms. If we agree to define 'containment failure' as 'breach of Primary Barrier,' your indeterminacy vanishes. Why should treaty designers care about in-principle ambiguity when pragmatic stipulation solves it?"
  * **Your Reply (2 mins):** "Stipulation creates an *illusion* of determinacy, not the reality. You can define 'Primary Barrier,' but the application of that term to novel synthetic organisms remains behaviorally underdetermined. Is a viral vector crossing a membrane a 'barrier breach' or 'media permeation'? Parties will sign the stipulation but behaviorally apply it differently when novel cases arise. My point is that indeterminacy returns at the *application* phase. Recognizing this isn't nihilism; it's a warning that compliance monitoring will inevitably involve interpretive discretion that the treaty text cannot resolve."
  * **Soft Spot/Concession:** You concede the treaty will "work" in the sense of being signed. Your claim is merely that it will fail to ensure *uniform interpretation*. This is hard to prove empirically, making your claim look like philosophical hand-waving to a pragmatist.

  **4. The "Functional Realism" Objection (Philosopher of Biology)**
  *Phrasing:* "We defend realism about functional kinds. A 'containment system' has a proper function. If it fails to perform that function, 'failure' is a realist description, not an indeterminate label. You are treating functional norms as if they were arbitrary, but they are grounded in the selected effects of the safety engineering."
  * **Your Reply (2 mins):** "Selected effects work for hearts or wings, but 'containment systems' are artefacts with *assigned* functions, not selected ones. Their function is determined by the designer's intent, which loops back into the problem of accessing intent. Furthermore, synthetic biology introduces 'dual-use' functions where the 'proper function' is contested. Is the organism designed to spread (for bioremediation) or stay put (for production)? If the design intent is ambiguous, the functional kind 'containment' loses its realist anchor. The indeterminacy of intent propagates to the indeterminacy of function."
  * **Soft Spot/Concession:** You are challenging the artefact/function analogy. If they argue that regulatory approval *fixes* the function legally, you must retreat to the claim that cross-border legal systems fix functions *differently*, restoring the indeterminacy.

  **5. The "Principle of Charity" Objection (Philosopher of Language)**
  *Phrasing:* "Davidson showed we maximize agreement to interpret. If we assume our counterparts are rational and share our causal environment, we *must* interpret 'risk threshold' as referring to the same statistical boundary we use. Indeterminacy is a artifact of refusing to apply charity."
  * **Your Reply (2 mins):** "Charity maximizes *truth*, not *reference*. We can agree that 'the risk is acceptable' is true in both languages while mapping 'risk' to different underlying distributions. I can believe you are rational while believing you calculate risk using Bayesian priors different from mine. Charity gets us to agreement on the *sentence*, but not on the *ontology* of the risk. In biosafety, parties often want to preserve ambiguity to sign the treaty. Charity assumes a desire for shared truth; diplomacy often relies on shared falsehoods or compatible ambiguities."
  * **Soft Spot/Concession:** This is a high-risk theoretical gamble. Davidsonians believe reference and truth are tightly coupled. You are asserting they can come apart in diplomatic contexts. This requires strong evidence of "agreeing to disagree" semantics.

  **6. The "Operational Definition" Objection (Science-Policy Specialist)**
  *Phrasing:* "We don't use vague terms. We use operational metrics: CFU counts, air exchange rates, pressure differentials. 'Containment failure' is just a variable exceeding a constant. Where is the indeterminacy in a pressure gauge reading?"
  * **Your Reply (2 mins):** "The gauge reading is determinate; the *significance* of the reading is not. A pressure drop indicates a breach only if we assume the seal integrity model holds. In synthetic biology, organisms can degrade seals chemically. Is that a 'pressure failure' or a 'material incompatibility'? The operational metric is fixed, but the *attribution of the failure to the regulatory category* is not. The indeterminacy hides in the bridge principles connecting the metric to the regulatory violation."
  * **Soft Spot/Concession:** You are moving the goalposts from the term to the *bridge principles*. A policy specialist will say, "Then fix the bridge principles." You must insist that novel biology always outpaces bridge principles.

  ---

  #### Part 3: The "Killer Objection" (The One You Hope Isn't Raised)

  **The Objection:**
  "You are trying to use synthetic biology to prove Quine's thesis, but Quine's thesis is supposed to hold *independently* of any specific science. By choosing a case where the science is complex, novel, and uncertain, aren't you just pointing out *epistemic underdetermination* (we don't know enough biology yet) and disguising it as *ontic indeterminacy* (meaning is fundamentally unstable)? If we had perfect biological knowledge, would your 'indeterminacy' vanish? If yes, you haven't proven Quine right; you've just proven synthetic biology is complicated."

  **Why this is fatal:**
  *   It collapses your distinction between "epistemic" and "reference" indeterminacy, which is the core of your argument.
  *   It suggests you are relying on **Scientific Realism** about the complexity of organisms to generate the ambiguity, whereas Quine's argument is supposed to work even for simple terms like "gavagai."
  *   If the ambiguity relies on the *substantive science* (the novelty of the organisms), then it is a problem for *biology*, not a problem for *language/translation*.

  **Emergency Defense (If Raised):**
  "I anticipate this. The indeterminacy does not arise from the *complexity* of the organism, but from the *normative gap* between physical description and risk classification. Even with perfect biological knowledge (omniscience about the organism), the decision to classify a specific drift event as 'acceptable risk' vs. 'containment failure' is not determined by the biology. It is a policy choice. Quine's point holds because the *mapping from fact to norm* is what is indeterminate, not the facts themselves. I am not using scientific uncertainty to generate semantic uncertainty; I am using the is/ought gap to generate it."

  *(Note: This defense is fragile. If they press that "risk" is a probabilistic fact, not a norm, you may have to concede that your argument is specifically about **normative** vocabulary, limiting the scope of your Quinean claim.)*
