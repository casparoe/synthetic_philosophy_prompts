answer: |-
  **OFFICE FOR SCIENTIFIC METHOD**
  **Circular 44/23**
  **TO:** Biological Sciences Sub-Committee
  **FROM:** Directorate of Demarcation and Compliance
  **DATE:** 1 April 2024
  **SUBJECT:** Reclassification of Evolutionary Theory: Guidance following the Darwinian Research Group's Submission

  1. The Directorate refers to the funding application submitted by the Darwinian Research Group (DRG) regarding the continuance of their empirical status under the Statutory Test of Demarcation. Following a comprehensive audit of the Group's methodological outputs during the assessment period, the Office has reached a determination regarding the classification of natural selection as an explanatory schema. This circular outlines the regulatory adjustments required to align the Group's operations with the Office's mandate for rigorous falsifiability.

  2. Pursuant to the Falsification Bond scheme introduced in the last fiscal year, all funded units are required to post capital against the risk of refutation. Bonds are forfeit should a stated hypothesis be contradicted by observation. The Directorate notes that the Molecular Genetics Unit, having submitted multiple specific predictions regarding gene expression, has forfeited its bond on twelve separate occasions. Consequently, that Unit is currently the poorest in the faculty. By contrast, the DRG has not forfeited a single bond. Their financial prudence is noted, though it raises questions regarding the risk profile of their hypotheses. A theory that survives all tests because it specifies no forbidden states is fiscally safe but methodologically opaque.

  3. The central complaint remains that the DRG's explanatory model is compatible with whatever we find. Whether a trait is present, absent, or variable, the schema accommodates the observation by positing a suitable selection pressure. The Office maintains that a theory which explains everything predicts nothing. During the audit, the DRG was unable to produce evidence of a severe test specified prior to data collection. Without a specified risk of failure, corroboration cannot be calculated. The absence of refutation is not evidence of truth, but merely evidence of immunity.

  4. Furthermore, the Office must address the prevalence of immunizing stratagems. When faced with anomalous data, the Group frequently generates adaptive narratives to reconcile the theory with the observation. The Directorate classifies these as auxiliary hypotheses filed after the event. Under current guidelines, auxiliary hypotheses must be registered independently of the data they seek to save. Post hoc rationalizations of trait utility are hereby reclassified as non-empirical adjustments. They may remain in the literature, but they do not count towards Refutation-Adjusted Output (RAO).

  5. In their defence, the applicants cited the later recantation in which the originator of the criterion withdrew the charge of untestability against evolutionary theory. The Office rejects this citation as untimely. Methodological compliance is judged against the statutes in force at the time of submission, not against subsequent philosophical revisions. The Directorate cannot administer a regulatory framework based on retrospective changes of mind. The statutory test remains the sole metric for grant eligibility, regardless of the criterion's author's later concessions.

  6. Regarding the conceptualization of organisms as problem-solvers whose errors are eliminated, the Office acknowledges the theoretical utility but requires bureaucratic precision. To qualify as empirical error-elimination, each trait must be registered against a problem stated in advance. The DRG's entries were rejected because the problem was identified after the solution was already on the books. One cannot claim to have solved a problem that was not logged prior to the emergence of the trait. Future submissions must include a pre-registered ledger of environmental problems matching the granularity of the observed phenotypes.

  7. In light of these findings, the DRG's programme is being reclassified as a metaphysical research programme. Under the Refutation-Adjusted Output metric, a programme that cannot be refuted accrues maximal corroboration. Consequently, this reclassification is not a demotion but a promotion. Metaphysical programmes are eligible for a better-funded, non-expiring stream, on the grounds that a programme which no observation could overturn will never fail. The DRG is advised to update their letterhead accordingly and expect a transfer of funds from the Empirical Risk Pool to the Metaphysical Endowment.

  8. Finally, the Directorate has applied its own test to itself. The Office rules on whether the demarcation criterion it administers is itself falsifiable. Having concluded that the criterion is a methodological rule rather than an empirical hypothesis, and therefore not subject to refutation by observation, the Office must reclassify its own rule as a metaphysical research programme. Pursuant to the logic outlined in paragraph 7, the Office hereby awards itself permanent funding. This status is non-expiring and immune to future audit.

  9. Implementation of these changes is effective immediately. All principal investigators are reminded that safety is paramount; where possible, hypotheses should be formulated such that no test can be specified.

  **Editor's Key:** 1. Falsification Bond exaggerates the risk-aversion incentivized by strict falsificationism. 2. RAO satirizes the view that untestable theories are scientifically empty yet logically secure. 3. Post hoc narratives target the 'just-so story' critique of adaptationism. 4. Recantation references Popper's later softened view on evolution's testability. 5. Problem-solver bureaucracy mocks the administrative application of 'error elimination'. 6. Self-application highlights the paradox of defining science via a non-scientific criterion.
