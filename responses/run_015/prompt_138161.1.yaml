  **Addendum: Reflection on the "Three Papers" Risk**

  I want to explicitly address the supervisor's concern one final time in this document, as it dictates the scope of the work. The worry is that "Compulsion," "Age," and "Citizenship" are distinct normative problems.
  *   Compulsion is about *liberty* (negative freedom).
  *   Age is about *capacity* (developmental psychology).
  *   Citizenship is about *belonging* (political ontology).

  To treat them as one problem requires showing that these normative categories are secondary to the *functional* category of "Sample Integrity."
  *   If the goal is a valid sample, liberty is constrained by the need to prevent bias (addressing Compulsion).
  *   If the goal is a valid sample, capacity is irrelevant provided the noise cancels (addressing Age).
  *   If the goal is a valid sample, belonging is defined by subjection, not status (addressing Citizenship).

  If I cannot make this stick—if I find myself appealing to "liberty" for compulsion and "belonging" for citizenship—then the project has fractured. I will use this as a diagnostic criterion during the writing process. If Section 3 (Application) requires three different justifications, I will pivot the paper to focus solely on Compulsion as the strongest case for EAS, and frame the others as future work. However, my hypothesis is that the "Sample" justification is robust enough to cover all three. The coherence of the argument depends on maintaining the "Aggregate Output" focus throughout. I will not drift into "Civic Virtue" for compulsion or "Rights" for citizenship. I will hold the line on "Data Integrity." If that feels cold or technocratic, that is a feature of the theory, not a bug, and it is worth exploring whether democratic theory can accommodate a colder, more systemic justification for participation.

  **Addendum: Reflection on the "Sortition" Risk**

  The Sortition objection is the most dangerous to the project's viability. If the EAS view is correct, and Sortition is a better sampling method, then the EAS view argues *against* the current system of elections. This is a radical conclusion.
  *   **Option A:** Embrace it. Argue that we should move to sortition. (High risk, high reward).
  *   **Option B:** Modify EAS. Argue that "Sampling" is only one value, and "Authorization" is another, and only universal voting satisfies both. (More moderate, but risks ad-hocery).
  *   **Option C:** Frame it as an open question. The prospectus will take Option C. I will not solve the Sortition tension in the seminar paper; I will identify it as the critical frontier for the larger project. This manages the risk by acknowledging the complexity without requiring a full resolution in 5,000 words.

