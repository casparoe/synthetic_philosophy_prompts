answer: |-
  **Title:** Sampling the Demos: A Prospectus for an Aggregate Theory of Electoral Boundaries and Participation

  **1. Introduction: The Fragmented Debate**

  Contemporary democratic theory treats the mechanics of voting as a series of discrete, unrelated problems. We have one literature for compulsory voting, another for the voting age, and a third for non-citizen suffrage. Each operates with its own normative vocabulary and its own set of objections. Compulsory voting is debated in the language of civic duty and liberal coercion: does the state have the right to force participation, and does participation constitute a moral obligation? The voting age is debated in the language of competence and affected interests: are teenagers capable of rational choice, or do they deserve a vote because they will live with the long-term consequences of policy? Non-citizen voting is debated in the language of membership and sovereignty: does the franchise require formal citizenship, or does mere subjection to the law grant a stake in the outcome?

  This fragmentation is theoretically inefficient. It suggests that the decision of *whether* to vote, *who* may vote, and *who must* vote are categorically different questions. Yet, in practice, they all determine the same thing: the composition of the electorate. My flatmate's intuition that compulsory voting and lowering the voting age are part of the same conversation is theoretically sound, even if the standard literature treats them as separate silos. The silence between these debates is not accidental; it is structural. It stems from a shared, often unexamined commitment to an individualist model of voting. In the standard view, voting is an act performed by an individual agent to express a preference, exercise autonomy, or authorize a government. Because the unit of analysis is the individual act, the criteria for evaluating that act vary depending on which aspect of the individual is being stressed (their duty, their competence, or their membership).

  This paper serves as both a seminar paper and a research prospectus for a larger project. Its goal is to test a alternative theoretical framework: the "Electorate-as-Sample" view. On this view, the primary normative function of an election is not the aggregation of individual expressions of will, but the generation of a representative statistical sample of the governed. The electorate is not a collection of autonomous authors; it is a measurement instrument. If the goal of the election is to produce a legitimate output that reflects the interests of the whole, the input mechanism must minimize selection bias.

  This shift in perspective has radical implications. It suggests that the arguments for compulsory voting, lower voting ages, and non-citizen suffrage are not three separate claims based on duty, competence, and membership, but rather a single claim based on data integrity. If the electorate is a sample, voluntary voting introduces bias (older, wealthier voters over-represented). Excluding 16-year-olds introduces bias (future interests under-represented). Excluding long-term residents introduces bias (subjected populations under-represented).

  However, this view faces significant theoretical hurdles. If the goal is merely a representative sample, why not use sortition (random selection) rather than universal voting? If competence is irrelevant to sampling, does this view evacuate the epistemic value of democracy? If the "population" is simply "the governed," where do we draw the boundary without arbitrary thresholds? My supervisor has rightly noted that these risks suggest I may be attempting to write three papers at once, or that the "sample" metaphor is merely a disguise for sortition without the rigor.

  This document outlines the plan to investigate these questions. It defines the precise research question, identifies the gap in the existing literature, details the methodological approach for the seminar paper and the subsequent project, and establishes clear conditions for success and failure. It is an argument for why the "Electorate-as-Sample" view is worth pursuing, alongside a honest assessment of where it might break down.

  **2. The Central Research Question**

  To avoid the trap of stapling three separate questions together, the research must be organized around a single unifying problem. The question is not "Should we have compulsory voting, lower the voting age, and allow non-citizen voting?" That is a policy question, not a theoretical one. The theoretical question is about the justification for the boundaries and mechanisms of the franchise.

  **Primary Research Question:** *Can an aggregate, sampling-based model of the electorate provide a unified normative justification for franchise boundaries and participation mandates that individualist models cannot?*

  This question breaks down into three sub-queries that correspond to the three debates, but treats them as stress tests for the single theory:

  1.  **The Mechanism Query:** If the electorate is a sample, does this justify compulsory participation without relying on contentious claims about civic duty or virtue?
  2.  **The Competence Query:** If the electorate is a sample, does the "competence" objection to lowering the voting age lose its normative force, and if so, is that a feature or a bug of the theory?
  3.  **The Boundary Query:** If the electorate is a sample of the "governed," does this force an expansion of the franchise to non-citizen residents, and does it provide a principled way to determine residence thresholds?

  The determinacy of the answer depends on whether the "Sample" view can generate specific thresholds or if it merely points in a directional vector (e.g., "more inclusion is better" without saying how much). A successful project must demonstrate that the Sample View either generates determinate answers or explains why determinacy is the wrong standard for these questions.

  **3. The Theoretical Gap: Why Existing Positions Leave It Open**

  The existing literature leaves this question open because it is trapped in what I call the "Individualist Paradigm." In this paradigm, the vote is property of the voter. It is something they own, exercise, or are forced to surrender. This paradigm dictates the terms of the debate.

  *   **Compulsory Voting:** Defended primarily through civic republicanism (voting is a duty) or instrumentalism (it reduces polarization/corruption). Objections are liberal-libertarian (coercion violates autonomy). The debate stalls because it pits collective good against individual liberty. The Sample View bypasses this by arguing that individual liberty is not the primary stake; the integrity of the aggregate signal is. If your absence biases the data, your participation is not just a right but a methodological necessity. However, existing literature rarely treats the *statistical bias* of voluntary turnout as a primary normative harm, focusing instead on the *moral* harm of abstention.
  *   **Voting Age:** Defended through "all-affected interests" (teenagers are affected by climate policy) or "capacity" (teenagers are rational enough). Objections focus on maturity and susceptibility to influence. The Sample View renders capacity largely irrelevant (a random sample does not require expert respondents), but the literature has no category for "inclusion for the sake of representation" distinct from "inclusion for the sake of rights."
  *   **Non-Citizen Voting:** Defended through "stakeholder" principles or "subjection to law." Objections focus on collective self-determination and the boundary of the *demos*. The Sample View aligns with the "subjection" argument but adds a statistical imperative: excluding residents creates a systematic error in the government's feedback loop. Yet, current theories treat this as a question of membership status, not data quality.

  The gap is the absence of a *systemic* theory of the electorate. We have theories of the *voter* (autonomous, competent, member) but no theory of the *electorate* as a collective entity with functional requirements. By treating the electorate as a functional component of a democratic system (a sampling mechanism), we can evaluate its design based on how well it performs that function, rather than how well it respects the pre-political rights of the components.

  This gap exists because democratic theory is deeply committed to the idea of authorization. We want to say the government rules *because* we chose it. The Sample View risks turning voting into a census rather than a choice. The literature has not fully explored whether a "census model" of voting can sustain democratic legitimacy, or if it collapses into technocracy. This project aims to fill that gap.

  **4. The Proposed Framework: Electorate-as-Sample**

  The core of the proposed work is to flesh out the "Electorate-as-Sample" view (EAS) and distinguish it from nearby concepts.

  **4.1. Defining the Sample**
  In the EAS view, an election is a measurement of the preferences and interests of the population. For the measurement to be valid, the set of people providing input (the voters) must be representative of the set of people subject to the output (the governed).
  *   **Representation:** Not in the sense of "standing for" (like a representative in parliament), but in the statistical sense. The distribution of properties in the voting pool must match the distribution of properties in the governed pool.
  *   **Bias:** Any systematic exclusion or over-inclusion constitutes a bias that degrades the legitimacy of the outcome.
  *   **Noise:** Individual ignorance or error is treated as noise, which cancels out in large numbers (Condorcet's Jury Theorem logic), provided the sample is unbiased.

  **4.2. Distinguishing from Sortition**
  The most immediate objection is: If we just want a representative sample, why not select 1,000 people by lottery and let them decide? This is sortition. If EAS is correct, sortition should be superior to universal suffrage because it guarantees representativeness with lower cost and no coercion.
  *   **The Distinction:** I propose that EAS is not a replacement for universal suffrage, but a justification for it *alongside* a legitimacy constraint. Sortition provides a representative sample, but it lacks *universal authorization*. Universal voting provides universal authorization, but often fails at representativeness.
  *   **The Hybrid Claim:** The EAS view might argue that we need universal voting *because* we need the sample to be self-selected from the whole, but we need compulsion to correct the self-selection bias. Alternatively, it might argue that sortition is actually *more* consistent with the theory, and our attachment to universal voting is a historical artifact.
  *   **Research Stance:** I will not预设 (presuppose) that universal voting is the only outcome. The paper will treat the tension between EAS and Sortition as a critical stress test. If EAS leads inevitably to sortition, that is a significant finding, even if it is politically radical.

  **4.3. Distinguishing from Epistemic Democracy**
  Epistemic democracy argues voting is about tracking the truth. EAS argues voting is about representing the distribution of interests.
  *   **Competence:** In epistemic democracy, individual competence matters. In EAS, individual competence matters less than sample integrity. A biased sample of experts is worse than a representative sample of laypeople.
  *   **Implication:** This directly addresses the voting age debate. If the goal is to sample the interests of the young, their lack of "expertise" is less relevant than their exclusion from the sample.

  **5. Methodology and Plan of Work**

  This project is purely theoretical. I am stipulating the empirical claims (e.g., that voluntary turnout is demographically skewed, that 16-year-olds are legally subject to taxation/criminal law, that non-citizen residents are subject to coercion). I will not conduct a comparative survey of electoral systems, nor will I review empirical political science literature on turnout rates beyond standard stylized facts. The work is conceptual analysis and normative reconstruction.

  **5.1. Seminar Paper Structure (5,000 Words)**
  The seminar paper will function as the "Proof of Concept" for the larger project. It will not solve every problem but will demonstrate that the EAS view generates novel insights that the Individualist Paradigm misses.

  *   **Section 1: The Fragmentation Problem (750 words).** Briefly outline the three debates (compulsion, age, citizenship) and show how they talk past each other. Introduce the Individualist Paradigm as the common cause.
  *   **Section 2: The Electorate-as-Sample Model (1,500 words).** Define the model. Explain the shift from "voter as author" to "electorate as instrument." Address the immediate "Sortition" objection here at a high level: distinguish between *sampling interests* (EAS) and *selecting decision-makers* (Sortition).
  *   **Section 3: Application to the Three Cases (1,500 words).**
      *   *Compulsion:* Show how EAS justifies compulsion as anti-bias rather than duty.
      *   *Age:* Show how EAS undermines the competence objection but raises the "boundary" question.
      *   *Citizenship:* Show how EAS pushes toward residence-based inclusion.
  *   **Section 4: The Limits of the Model (1,000 words).** This is the critical self-reflection section. Acknowledge where EAS fails to give determinate answers (e.g., exactly what age? exactly how many years of residence?). Discuss the "Abstention" problem: if sampling is the goal, is a formal "none of the above" or compulsory turnout with abstention better than compulsory voting?
  *   **Section 5: Conclusion (250 words).** Summarize the viability of EAS as a unifying theory.

  **5.2. Larger Project Trajectory**
  If the seminar paper succeeds in showing the EAS view is coherent, the larger project (dissertation or monograph) would expand Section 4 into the core focus.
  *   **Chapter 1:** History of the "Sample" metaphor in democratic thought (from Madison to modern survey theory).
  *   **Chapter 2:** The Normative Status of Bias. Why is an unrepresentative electorate illegitimate? Is it about outcome quality or procedural fairness?
  *   **Chapter 3:** The Sortition Challenge. A deep dive into whether EAS actually mandates sortition over elections.
  *   **Chapter 4:** Boundaries and Thresholds. Developing a theory of "relevant subjection" to define the population to be sampled.
  *   **Chapter 5:** Institutional Design. Compulsory turnout vs. compulsory voting vs. weighted voting.

  **5.3. Why This Approach?**
  I am avoiding empirical survey work for two reasons. First, the claim is normative: even if voluntary voting *were* representative (empirically false, but hypothetically possible), is there a *principle* reason to prefer it? Second, empirical claims change; the theoretical framework should be robust to empirical shifts. If tomorrow teenagers became perfectly informed, the Individualist Paradigm would welcome them; the EAS view would welcome them because they are part of the population, regardless of information levels. Distinguishing these justifications requires theory, not data.

  I am also avoiding a "comparative institutions" approach (e.g., comparing Australia's compulsory voting to the US's voluntary system) because that often leads to descriptive muddles. The goal is to establish the *justificatory basis*, not to evaluate existing performance.

  **6. Anticipated Results: Positive and Negative**

  A research proposal must define what counts as a result, even if the hypothesis is falsified.

  **6.1. Positive Result**
  A positive result looks like a unified theory of franchise rules. It would demonstrate that:
  1.  Compulsory voting is not illiberal coercion but a requirement for statistical validity.
  2.  Voting age limits are not about competence but about defining the "governed" population (likely pushing for lower ages).
  3.  Non-citizen voting is required not out of cosmopolitan charity but out of systemic integrity.
  4.  Crucially, it provides a reason to prefer *universal voting* over *sortition* (perhaps by arguing that the act of universal participation generates a specific kind of legitimacy that sampling alone does not).

  If I can show that EAS resolves the tensions between the three debates without collapsing into sortition or technocracy, the project succeeds. It would offer a new vocabulary for democratic reformers: not "rights" or "duties," but "integrity" and "bias."

  **6.2. Useful Negative Result**
  A negative result is still valuable if it clarifies the boundaries of democratic theory.
  1.  **The Sortition Collapse:** If investigation shows that EAS logically entails sortition is superior to voting, that is a major finding. It would suggest that our commitment to elections is inconsistent with our commitment to representation.
  2.  **The Indeterminacy Proof:** If EAS cannot determine *where* to draw the boundary (e.g., it says "include residents" but cannot say "for how long"), it proves that sampling is insufficient for boundary setting and must be supplemented by a membership theory. This saves the "membership" view from dismissal but limits the scope of EAS.
  3.  **The Competence Break:** If it turns out that sampling *does* require a minimum competence threshold to function (i.e., noise does not cancel out if the bias is cognitive, not just demographic), then the argument for lowering the voting age fails within EAS. This would rescue the standard "competence" objection but on new grounds.

  **6.3. Conditions of Failure**
  I need to be honest about what would count as the project failing entirely, rather than just yielding a negative result.
  1.  **Metaphor Masquerading as Argument:** If "Electorate-as-Sample" turns out to be just a fancy way of saying "more people should vote," without generating new normative obligations or distinctions, it is a failure. It must do work that the "All-Affected" principle cannot do. If EAS yields the exact same policy recommendations as standard "All-Affected" theory but with more complex math, it is redundant.
  2.  **The "Three Papers" Problem:** If I cannot show a logical connection between compulsion, age, and citizenship—if the argument for compulsion relies on "duty" while the argument for age relies on "interests"—then the unification has failed. I am attempting one theory applied to three cases, not three theories. If the theoretical glue doesn't hold, I must retreat to a single case study (likely compulsion, as it fits the sampling model best).
  3.  **Legitimacy Deficit:** If the EAS view implies that votes should be weighted (e.g., underrepresented groups get extra votes to correct the sample), and this is intuitively unacceptable to democratic theory, the model may be incompatible with the basic premise of "one person, one vote." If EAS requires violating political equality to achieve statistical equality, it may be self-defeating.

  **7. Feasibility and Scope: Addressing the "Three Papers" Worry**

  My supervisor's concern is that I am trying to solve compulsion, age, and citizenship all at once. This is a valid risk. However, I argue that these are not three problems, but three variables of a single equation: *Who constitutes the valid input set for the democratic function?*

  *   **Compulsion** asks: Must the input set be active?
  *   **Age** asks: What is the temporal lower bound of the input set?
  *   **Citizenship** asks: What is the legal/social bound of the input set?

  Treating them separately is like studying the width, height, and depth of a box as three separate objects. They are dimensions of the same thing. The risk is not that there are three topics, but that the "Sample" theory is too thin to cover all three dimensions.

  **Mitigation Strategy:**
  In the seminar paper, I will not attempt to definitively solve all three. I will use Age and Citizenship as *test cases* for the theory developed primarily through Compulsion. Compulsory voting is the purest expression of the "Sample" view (forcing the sample to be complete). If the theory works there, I will apply it to the others to see if it holds. If it breaks down on Citizenship (e.g., because "governed" is too vague), I will acknowledge that limit. The paper will be a "Proof of Concept," not a "Final Verdict."

  This protects against the "Three Papers" risk. I am not writing three defenses; I am writing one defense and stress-testing it against two hard cases. If it fails the stress test, the paper concludes that the theory has limited scope. That is a complete argument.

  **Regarding the Sortition Objection:**
  This is the strongest theoretical threat. If the goal is a sample, a random lottery is statistically superior to a mass election. Mass elections are expensive, prone to manipulation, and still suffer from turnout bias even with compulsion (e.g., informal voting, spoilage).
  *   **My Hypothesis:** The EAS view does not replace elections with sortition but reinterprets the *purpose* of elections. Elections are not just sampling; they are *public rituals of authorization*. A sample needs to be representative, but a government needs to be authorized by the whole. The EAS view argues that we need *both*: the authorization of the whole (universal suffrage) and the representativeness of the part (compulsion to ensure the active voters match the whole).
  *   **Risk:** This might be a "have your cake and eat it too" argument. I need to be prepared to concede that if authorization is the primary goal, sampling is secondary, and if sampling is primary, sortition wins. The paper will explore this tension explicitly rather than glossing over it.

  **Regarding Determinacy:**
  The supervisor worries EAS cannot generate determinate answers (e.g., *why* 16 and not 14?).
  *   **Response:** Individualist theories also fail at determinacy. Why is 18 the age of competence? It is arbitrary. Why is citizenship the boundary of membership? It is contingent. EAS does not need to be *more* determinate than existing theories to be useful; it needs to be *more coherent*. If EAS can show that *whatever* threshold we pick, it must be applied consistently across compulsion and inclusion, that is a theoretical gain. For example, if we set the voting age at 16 because that is when tax liability begins, EAS demands we also include non-citizen residents who pay taxes. The determinacy is in the *relationship between variables*, not the absolute value of the variables.
  *   **Plan:** I will argue that EAS shifts the burden of proof. Instead of "Why should 16-year-olds vote?" the question becomes "Why should 16-year-olds be excluded from the sample?" This inversion is a substantive theoretical contribution, even if it doesn't spit out a specific number.

  **8. Conclusion: The Value of the Inquiry**

  Democratic theory is currently stuck in a loop of conflicting intuitions. We value equality but accept skewed turnout. We value competence but lower the voting age based on affected interests. We value self-determination but exclude long-term residents. These contradictions persist because we lack a systemic model of what the electorate *is*.

  By proposing the "Electorate-as-Sample" view, I am not suggesting we turn democracy into a technocratic survey. I am suggesting that the statistical integrity of the electorate is a neglected dimension of democratic legitimacy. If this project succeeds, it offers a way to harmonize the debates on compulsion, age, and citizenship. It suggests that the fight for the franchise is not just about rights, but about truth—the truth of what the governed actually want.

  If it fails, it will likely fail by collapsing into sortition or by proving too indeterminate to guide policy. Both outcomes are theoretically informative. The former would force a reckoning with why we hold elections at all; the latter would reaffirm that democratic boundaries are inevitably political, not statistical.

  This prospectus outlines a path to find out which it is. The seminar paper will lay the groundwork by defining the model and testing it against the three cases. The larger project will deepen the analysis of the Sortition challenge and the Boundary problem. By treating the electorate as a functional whole rather than a collection of individual acts, this research aims to provide a more coherent vocabulary for the next generation of democratic reform.

