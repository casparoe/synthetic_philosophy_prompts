answer: |-
  Your friend has cornered you with a classic piece of social choice rhetoric, often called the "Harsanyi-style" defense of utilitarianism. It is a formidable argument because it is mathematically sound *within its own frame*, but it smuggles in substantive ethical commitments under the guise of technical necessity.

  You are right to feel that something slipped between steps (5) and (6). Your friend is presenting a mathematical uniqueness result as a moral imperative.

  To answer your specific constraints: **You should reject Step (3), the Independence of Irrelevant Alternatives (IIA).**

  However, to fully disarm the argument, you must also expose the hidden ethical loading in **Step (5)**. Here is the breakdown of why the argument looks compelling, where the cracks are, and exactly what you pay for rejecting IIA.

  ### 1. The Illusion of the "Escape Hatch" (Step 5)

  Your friend claims Harsanyi's theorem is an "escape hatch" from Arrow's impossibility. It is, but it comes with a steep price tag that is often hidden in the phrasing of premise (5).

  **Why it looks fine:**
  Arrow's theorem kills social welfare functions because ordinal preferences (rankings like $x \succ y \succ z$) contain too little information. We can't tell *how much* I prefer $x$ to $y$. Harsanyi moves the game to **von Neumann-Morgenstern (vNM) utilities**. These are cardinal; they measure intensity of preference via risk attitudes (e.g., "I am indifferent between $y$ for sure and a 50/50 lottery of $x$ and $z$").

  **The Crack:**
  Step (5) states: *"preferences are... interpersonally comparable."*
  This is the sleight of hand. vNM utility functions are unique only up to **positive affine transformations** ($u' = au + b$, where $a > 0$).
  *   I can measure *my* utility on a scale of 0 to 100.
  *   You can measure *your* utility on a scale of 0 to 100.
  *   But mathematically, there is no bridge between my "0" and your "0," or my "unit" and your "unit."

  To sum our utilities ($\sum u_i$), as Step (6) requires, we must fix the zeros and units across all individuals. **Mathematics cannot do this.** Only an ethical assumption can. You have to *stipulate* that "one unit of utility loss for Alice is morally equivalent to one unit of utility loss for Bob."

  **The Cost of Accepting (5):**
  If you accept Step (5) as written, you have already accepted **Utilitarianism's currency**. You have agreed that "utility" (defined by risk behavior) is the only thing that matters and that we can trade it off across persons. A Rawlsian rejects this. Rawls argues we should compare **primary goods** (rights, liberties, opportunities), not subjective utility, and he explicitly rejects the vNM expected-utility model in the Original Position (preferring Maximin).

  So, Step (5) is "fishy" because it assumes the conclusion (that we should maximize the sum of comparable utilities) in the premises.

  ### 2. The Straitjacket of IIA (Step 3)

  This is the step you should formally reject to save the Rawlsian position.

  **Why it looks fine:**
  IIA says the social ranking of $x$ vs. $y$ should depend *only* on how people rank $x$ vs. $y$. It prevents "irrelevant" options (like $z$) from flipping the social choice between $x$ and $y$. It seems like a basic consistency requirement. If society prefers Apples to Bananas, why should that change just because Cherries become available?

  **The Crack:**
  In a **cardinal** framework (which your friend is using), IIA is even more restrictive. It implies that the social evaluation of a state depends only on the utility vector at that state, $U(x) = (u_1(x), ..., u_n(x))$, and not on the *range* of other possibilities or the *distribution* of utilities relative to other options.

  Crucially, **Rawls' Difference Principle (Maximin) violates IIA.**
  *   *Scenario A:* Option $x$ gives utilities (10, 10). Option $y$ gives (100, 1).
  *   *Scenario B:* Option $x$ gives (10, 10). Option $y$ gives (11, 1).
  *   In both cases, the pairwise comparison of $x$ and $y$ involves the same individuals. But a Rawlsian looks at the *gap*. In Scenario A, $y$ creates massive inequality. In Scenario B, $y$ is only slightly better for the best off but still terrible for the worst off.
  *   More technically, Maximin ranks alternatives based on the utility of the worst-off person. If a third option $z$ changes *who* the worst-off person is, the ranking of $x$ vs. $y$ can flip. This violates IIA.

  **The Cost of Rejecting IIA:**
  If you drop IIA, you allow the social ranking of $x$ vs. $y$ to depend on the **context** of the other available alternatives.
  1.  **Distributional Sensitivity:** You gain the ability to care about *equality* and *priority*. You can say, "Giving 10 units to the poor man is better than giving 10 units to the rich man," even if their vNM scales are calibrated. IIA forbids looking at *who* holds the utility, only *how much* exists.
  2.  **Strategic Vulnerability:** The technical cost is that social choice becomes more susceptible to manipulation via the agenda (adding "irrelevant" alternatives to change the outcome). However, in a constitutional design context (like Rawls'), where we choose principles rather than vote on specific policies daily, this is less of a practical concern.
  3.  **Measurement Burden:** Without IIA, you need more information to make a decision. You can't just look at the pair; you need to know the whole feasible set to determine the distribution.

  ### 3. The Normative Leap (Step 7)

  Your friend argues: *"Therefore the only defensible social welfare function is a utilitarian weighted sum."*

  This is a category error. Even if Harsanyi's theorem is mathematically correct (which it is, *given* its assumptions), it only proves:
  > "If you want a SWF that respects vNM rationality, Pareto, and IIA, **and** you assume interpersonal comparability, **then** it must be a weighted sum."

  It does **not** prove that vNM rationality or IIA are moral requirements.
  *   **Rights:** A rights-based theory (Nozick, Sen) rejects the idea that social welfare is a function of individual utilities at all.
  *   **Rawls:** As mentioned, rejects vNM rationality for the "veil of ignorance."

  ### The Verdict: How to Exit the Corner

  Tell your friend this:

  1.  **Reject Step (3) (IIA).** This is the technical key. By allowing the social ranking of two outcomes to depend on the broader distributional context (violating IIA), you open the door for **Prioritarianism** (giving extra weight to the worse off) or **Rawlsian Maximin**. This preserves the Pareto principle (if everyone is better off, the worst off are better off) but allows you to reject the Utilitarian sum.
  2.  **Challenge Step (5) (Comparability).** Point out that vNM utilities are not interpersonally comparable by nature. To make them comparable, you must make an ethical choice. If you choose to calibrate scales to maximize the sum, you get Utilitarianism. If you choose to calibrate scales to identify the "least advantaged" (using primary goods), you get Rawls. The math doesn't decide this; ethics does.
  3.  **Keep Pareto.** You can keep the Weak Pareto principle (if everyone prefers $x$, choose $x$). Most non-utilitarian theories accept this. The conflict usually arises with *rights* or *equality*, not Pareto itself.

  **Summary of the Trade-off:**
  By rejecting IIA, you give up **context independence**. You admit that whether $x$ is better than $y$ depends on what other options were available and how $x$ and $y$ affect the distribution of welfare across the population. In exchange, you gain **distributional sensitivity**, which allows you to defend rights, prioritize the worst-off, and escape the "repugnant conclusion" of classical utilitarianism.

  Your friend's argument is a "formalist squeeze": it tries to force ethical conclusions out of mathematical axioms. The axioms (specifically IIA and vNM rationality) are not ethically neutral. Rejecting them is not a mathematical failure; it is an ethical choice.
