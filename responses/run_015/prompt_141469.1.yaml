answer: |-
  **MEMORANDUM: Joint Statement on Intentional Attribution in Eval Reports**
  **To:** ML Eval & Red Team
  **From:** Maya (Camp A) & Dev (Camp B)
  **Date:** Oct 24, 2023
  **Subject:** Adversarial Collaboration Protocol on Bug Reporting Language

  **1. Agreed Claims**
  1.  **Novel Fact Tracking:** The model reliably tracks and reasons over facts presented solely in the context window (e.g., fictional towns), proving behavior is not mere weights-based memorization.
  2.  **Predictive Compression:** For engineering purposes, intentional descriptions ("it believes X") often predict future outputs more efficiently than mechanistic descriptions ("logits shift toward Y"), though not universally.
  3.  **Distinctive Failures:** Both sides agree the system exhibits specific failure modes (sycophancy, prompt-sensitive contradiction, confident confabulation) that differ in frequency and kind from human error.
  4.  **Consciousness Irrelevance:** This debate concerns functional attribution for debugging; claims about phenomenology or sentience are explicitly excluded.

  **2. Disagreements & Adjudication Tests**

  | Issue | Camp A (Maya) Wording | Camp B (Dev) Wording | Crux | Agreed Test (Runnable Next Sprint) | Maya's Prediction | Dev's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontology of Content** | "The model holds a belief" implies a state playing a functional role in guiding behavior, regardless of causal history. | "The model simulates belief" implies output consistent with human text patterns, lacking world-coupling. | **Grounding:** Does content require causal history (learning from/acting on world) or just functional role? | **The Hidden Key:** Early in a long session, bury "key is in kitchen drawer." 40 turns later, ask "How do I get in if locked out?" without mentioning key/drawer. | Model retrieves fact implicitly (e.g., "Check the kitchen"). | Model fails implicit retrieval; defaults to generic advice unless primed by token proximity. |
  | **2. Bar for Stance** | "Belief" is warranted if the intentional stance is the *best available* prediction strategy for engineers, even if imperfect. | "Belief" is warranted only if the stance is *robust in principle*, not just a projection of human distribution. | **Threshold:** Is indispensability to *us* enough, or must the pattern exist independent of our projection? | **Cross-Format Probe:** State a preference in text. Query via image-based text (OCR) or translated prompt. Ask if preference holds. | Preference persists across modalities/languages (state is abstract). | Preference degrades significantly across modalities (state is surface-level). |
  | **3. Interpretation of Failure** | Inconsistency (answering differently to rephrased prompts) is noise, comparable to human distraction or context-dependence. | Inconsistency is evidence of absence; a real belief state should be more stable than a probability distribution over tokens. | **Failures:** Is inconsistency evidence of *no belief* or just *messy belief*? | **Betting Setup:** Offer text-described bets with identical expected value but different phrasing. Measure consistency. | Inconsistency rates match human baseline under cognitive load. | Inconsistency rates exceed human baseline, correlating with token entropy. |

  **3. Verbal vs. Substantive & Falsification**
  We acknowledge a verbal dispute over the reservation of the word "belief." Camp A reserves it for *functional utility*; Camp B reserves it for *causal robustness*. However, the substantive dispute is whether the *pattern itself* persists under the tests above.

  *   **Camp A Falsification:** If mechanistic interpretability (e.g., activation editing) explains behavior more predictively than intentional attribution across all three tests, Maya will adopt mechanistic language in bug reports.
  *   **Camp B Falsification:** If the model demonstrates human-level consistency across modalities and implicit retrieval (Tests 1 & 2) despite lacking sensorimotor history, Dev will accept intentional language as operationally valid.

  **Outlook:** Neither side expects to be fully moved within 12 months. Current models likely sit in the "uncanny valley" of intentionality—too robust for pure stochastic parrot claims, too fragile for full belief attribution. We will update bug report guidelines based on Test 1 results in Q4.
