              *   *This requires the Baseline for K/LD to be "Agent provides functioning."*
              *   *Example:* B is the life support. (Not ordinary equipment).
              *   *Example:* B fails to prevent an *agent-relative* interference.
              *   *Wait, if B omits, how is it Interference?*
