              *   *Because of the **Causal Route** (Account 1).*
              *   *A Acts:* The causal route runs through A's action. (Do). But the *source* of lethality is the disease. (LD).
              *   *B Omits:* The causal route runs through the disease. (Allow). But the *source* of lethality is the B's absence where presence was required for functioning. (Kill).
