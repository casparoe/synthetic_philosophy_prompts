  **The Scenario**
  In a hospital ICU, two nurses, A and B, attend to patients with identical respiratory failure, both requiring mechanical ventilation with oxygen titrated to 21% to survive; both nurses share the same duty to verify settings at shift change, intend only to stabilize the patients, believe the current settings are safe, and face equal effort in engaging the locking mechanism. Nurse A actively engages the dial lock at 21% (Do), but an undetected mechanical fault prevents airflow, causing death by hypoxia; Nurse B fails to engage the lock (Allow), leaving the ventilator at its factory default of 100% oxygen, causing death by oxygen toxicity.

  **Verdicts and Reasoning**

  *   **Agent A:**
      *   **Account 1 (Causal):** **Doing.** Her behavior (locking the dial) figures in the causal route by preventing auto-adjustment that might have compensated for the fault.
      *   **Account 2 (Threat/Aid):** **Doing.** By locking the setting, she sustains the threat of hypoxia should the machine fail, rather than merely failing to supply aid.
      *   **Account 3 (Baseline):** **Letting Die.** The death is due to the mechanical fault and underlying respiratory failure (processes she failed to counteract), not her interference with functioning.
  *   **Agent B:**
      *   **Account 1 (Causal):** **Allowing.** Her behavior (omission) does not figure in the causal route as an active input; the death occurs despite her inaction.
      *   **Account 2 (Threat/Aid):** **Allowing.** She merely fails to supply the aid (locking) needed to secure safety, without introducing a new threat.
      *   **Account 3 (Baseline):** **Killing.** The death is due to oxygen toxicity, a pathological interference with functioning produced by the equipment she was duty-bound to control; in a clinical baseline, the agent's failure to neutralize a device's lethal default constitutes interference.

  **Structural Feature and Collapse**
  The single structural feature doing the work is the **source of the lethal pathology** (external mechanical fault vs. equipment default toxicity) combined with the **mode of engagement** (active locking vs. passive omission). If the source of lethality is equalized (e.g., both die of hypoxia), both agents are classified as Letting Die on Account 3, collapsing the K/LD axis to agreement. If the mode of engagement is equalized (e.g., both actively set the dials), both agents are classified as Doing on Accounts 1 and 2, collapsing the D/A axis to agreement. The mismatch exists only because A acts to prevent a threat but fails against nature (Do/LD), while B omits to prevent a threat and fails against the machine (Allow/K).

  **Strongest Objection and Vulnerability**
  The strongest objection argues that Account 3 (Baseline) is being manipulated: if B's omission is "failing to counteract" the default setting, Account 3 explicitly defines this as *Letting Die*, not Killing. To classify B as Killing, one must stipulate that the clinical baseline includes the agent's active maintenance as part of the victim's "own functioning," effectively redrawing the baseline to suit the moral conclusion. The case is softest here: if the baseline is drawn at the patient's biological independence rather than the clinical support system, B's death by toxicity becomes a failure to counteract an external threat (the machine), rendering B a Letter-Die and collapsing the distinction back into alignment.
