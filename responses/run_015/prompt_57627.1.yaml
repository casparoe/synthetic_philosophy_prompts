answer: |-
  # Q&A Prep Sheet: Political Economy of Famine

  ### Top 8 Objections (Ordered by Damage Potential)

  **1. The Identification/Counterfactual Challenge (Quantitative Economists)**
  *   **Who:** The development economists/identification group.
  *   **The Question:** "Your 'avertability test' relies on a counterfactual: could the state have held mortality to baseline at a 'realistic cost'? Without a structural model or a natural experiment, this is just assertion. How do you distinguish between a state that *couldn't* afford to act (capacity constraint) and a state that *chose* not to (preference)? If you can't quantify the cost of the counterfactual policy, isn't this just post-hoc moralizing disguised as economic history?"
  *   **The Reply:** "I treat 'avertability' not as a point estimate but as a bound. In all three cases, we observe resource transfers occurring *during* the famine that, if redirected, would have covered the caloric deficit. In Bengal, rice was exported while people starved; in China, grain was exported to pay for industrial inputs while rural areas collapsed. The 'cost' was borne, just by different agents. My claim isn't that the state lacked capacity, but that the *allocation* mechanism was distorted by the opacity I describe. I am not estimating the elasticity of mortality to relief; I am identifying a binding constraint on information that made efficient allocation impossible."
  *   **Soft Spot:** You cannot definitively prove the redirected resources would have reached the needy without leakage. You are assuming the state's marginal cost of relief was lower than the observed social cost of death, which is a normative weighting, not an econometric one.

  **2. The China Data & Intent Challenge (China Demographic Specialists)**
  *   **Who:** The two Chinese demographic historians.
  *   **The Question:** "Recent econometric decompositions attribute a significant portion of the 1959–61 output collapse to weather shocks, not just policy. Furthermore, archival work suggests the center received reports of starvation but prioritized industrialization anyway. If they knew, your 'culpable opacity' category collapses into 'crime.' Why insist on 'opacity' when the evidence points to conscious trade-offs?"
  *   **The Reply:** "I accept weather contributed to the *shock*, but not to the *scale* of excess mortality. Regarding intent: my argument is that the purge of 1959 destroyed the *specificity* of information. The center knew 'there is trouble,' but the reporting channels, stripped of critics, could not transmit 'people are dying *here* due to *this* quota.' They believed their own propaganda about bumper harvests because the data feeding the model was endogenous to the quotas. That is opacity, not just cold calculation. They were flying blind by design."
  *   **Soft Spot:** If archives show specific death tolls reached the top leadership and were ignored, the "opacity" argument fails. You are betting on the *quality* of information being degraded, not just the *existence* of information.

  **3. The Mens Rea/Agency Challenge (Legal Scholar)**
  *   **Who:** The international criminal law scholar.
  *   **The Question:** "You use the word 'crime,' but then retreat to 'culpable opacity.' In law, negligence requires a duty of care. In political economy, does the state have a duty of care? If you argue the bureaucracy is the agent, how do you assign *mens rea* to a system? If you can't, aren't you diluting the definition of crime until it loses analytical utility?"
  *   **The Reply:** "I am not making a legal claim for prosecution; I am using 'crime' as a shorthand for a specific causal mechanism where agency is preserved but intent is obscured. 'Culpable opacity' is my solution to the *mens rea* problem. It posits that the state constructed an information environment where *mens rea* became unnecessary for mass death. The 'crime' is the construction of the system, not necessarily the specific order to starve. It shifts the locus of guilt from the signature on the order to the design of the reporting channel."
  *   **Soft Spot:** You are stretching the definition of agency. A bureaucracy isn't a person. If the lawyer presses on whether "systems" can be culpable absent individual intent, you have no legal theory to back the economic claim.

  **4. The State Capacity/Revisionist Challenge (Irish Historian)**
  *   **Who:** The Irish famine revisionist.
  *   **The Question:** "In the Irish case, you attribute starvation to 'eligibility conditions' and 'opacity.' But the Victorian state simply lacked the administrative capacity to distribute relief at scale without creating dependency. Isn't 'culpable opacity' just a fancy way of saying 'low state capacity'? If the bureaucracy *couldn't* see the famine because it wasn't built to see it, that's incompetence, not culpability."
  *   **The Reply:** "Incompetence implies a random error. Culpable opacity implies a systematic bias. The Poor Law Amendment Act didn't just lack capacity; it actively dismantled existing local relief structures in favor of a centralized test that was known to be restrictive. The 'blindness' was legislated. They chose a system that filtered out the worst cases to protect the fiscal balance. That is a choice about what *not* to see, which is distinct from lacking the tools to see."
  *   **Soft Spot:** The line between "choosing a cheap system" and "choosing a blind system" is thin. If the revisionist has data showing local officials *tried* to report and were ignored due to backlog rather than censorship, your "opacity" claim weakens.

  **5. The Sen Redundancy Challenge (Sen Readers/Economists)**
  *   **Who:** Economists who read Sen as an institutionalist.
  *   **The Question:** "You say Sen explains *who* starved but not *why nothing stopped it*, and that his democracy argument is just a version of your 'opacity.' But Sen's 'functioning democracy' *is* an information channel mechanism. Are you just renaming 'free press and elections' as 'epistemic conditions' without adding explanatory power?"
  *   **The Reply:** "Sen's claim is binary: democracies don't have famines. My claim is mechanistic: *how* the information fails. A democracy can have opacity (e.g., marginalized minorities without voice), and an autocracy can have transparency (if it serves the regime). I am disaggregating the 'democracy' variable into specific information constraints. This allows us to explain near-misses in democracies and variations in autocracies. It turns a correlation into a causal pathway."
  *   **Soft Spot:** If pressed, you must admit that in practice, "free press" is the strongest proxy for your "epistemic test." You are refining Sen, not overturning him.

  **6. The "Natural Disaster" Framing Challenge (China Specialists)**
  *   **Who:** China Specialists (follow-up).
  *   **The Question:** "The state officially designated the event as a 'natural disaster' at the time. If the leadership believed their own framing due to ideological commitment, doesn't that fail your epistemic test? You require them to 'know or culpably fail to know.' If they genuinely believed it was weather, they didn't know. How is that culpable?"
  *   **The Reply:** "Culpability attaches to the *source* of the belief. If I blindfold myself and then claim I didn't see the cliff, I am culpable for the fall. The leadership purged the meteorologists and agronomists who contradicted the ideological line on weather and yield. They constructed the belief system that blinded them. The 'belief' is not an exogenous shock; it is an endogenous outcome of the purge."
  *   **Soft Spot:** This requires proving the leadership *could* have known better at the time. If the meteorological data was genuinely ambiguous globally in 1959, the "self-blinding" argument is harder to sustain.

  **7. The Moral Vocabulary Challenge (The Group)**
  *   **Who:** The economists allergic to moral terms.
  *   **The Question:** "You claim this isn't about moral tone, but your categories are 'disaster,' 'crime,' and 'culpable.' These load the dice. Why not use 'exogenous shock,' 'policy failure,' and 'endogenous information constraint'? Doesn't your vocabulary invite the very moralizing you claim to avoid?"
  *   **The Reply:** "Because the existing literature uses 'disaster' and 'crime' as the explanatory variables. I am intervening in that debate. However, I agree the terms are loaded. I use them to map onto the existing historiography, but my tests are designed to be operationalizable. I am happy to translate 'crime' to 'avoidable policy-induced mortality with known alternatives' for the sake of the model."
  *   **Soft Spot:** You are trying to have it both ways. You want the rhetorical punch of "crime" without the philosophical baggage. The audience may demand you pick one lane.

  **8. The Selection Bias Challenge (General)**
  *   **Who:** Any skeptical empiricist.
  *   **The Question:** "You chose three cases that fit your theory. What about famines that *don't' fit? If you applied your two tests to Ethiopia in the 1980s or North Korea in the 1990s, does the 'culpable opacity' category hold, or did you select cases where the archives allow you to prove ignorance?"
  *   **The Reply:** "These three cases are the 'hard cases' for the opacity argument because they are the ones most frequently litigated as genocide or pure disaster. If the framework holds here, it suggests robustness. I am not claiming all famines are opacity; I am claiming that when we see the specific combination of high capacity and high mortality, opacity is the missing variable."
  *   **Soft Spot:** You haven't tested the negative cases. If the framework doesn't predict when famines *don't* happen, its explanatory power is limited.

  ---

  ### Pre-emptive Concessions (First 5 Minutes)

  *To disarm the Economists and the China Specialists:*

  1.  **On Measurement:** "I want to be clear at the outset: I am not offering new estimates of excess mortality. I take the ranges provided by the demographic literature as given. My argument is about the *mechanism* connecting the shock to the mortality, not the magnitude of the mortality itself."
  2.  **On Capacity:** "I am not arguing that these states had infinite capacity. I am arguing that within the *observed* fiscal envelope, reallocation was possible. I concede that state capacity limits the upper bound of avertability, but I argue that in these three instances, the binding constraint was information, not resources."

  ---

  ### The Single Reply That Must Land

  **The Distinction between Category 2 (Crime) and Category 3 (Culpable Opacity).**

  *   **Why:** If the audience concludes that "Culpable Opacity" is just "Crime" with extra steps, your theoretical contribution vanishes. You become a moralist accusing leaders of lying, rather than an economist identifying an institutional failure.
  *   **The Soundbite:** "The distinction matters for prevention. If famine is a 'crime,' we prevent it by punishing leaders. If it is 'culpable opacity,' we prevent it by designing information channels that survive political pressure. My argument is that you can have leaders who do not wish to kill their citizens, but who build systems that make killing them inevitable. That is a different policy problem than malice."

  ---

  ### The Question You Hope Nobody Asks (The Weakest Joint)

  **The Question:** "If the leadership constructs the system that blinds them, isn't that construction itself an intentional act? If I build a room with no windows and then claim I didn't see the fire, isn't the act of building the room the 'crime'? Doesn't Category 3 just collapse back into Category 2 eventually?"

  *   **Why it is dangerous:** It exposes that your "third category" might not be a distinct causal mechanism, but merely a temporal delay in assigning intent. It suggests you are splitting hairs to avoid calling it "genocide" or "crime" directly, which undermines your claim of settling the debate.
  *   **Best Available Answer:** "It collapses if you look at the *constructor* of the system, but not if you look at the *operators*. The purge in China happened in 1959; the famine peaked in 1960-61. The actors making the procurement decisions in 1960 were operating in a system where the 'truth' had been structurally removed. They may not have had the *mens rea* of the architect. My category captures the mortality caused by the *lag* between the system design and the operational failure. It explains why good bureaucrats kill people in bad systems."
  *   **Honest Assessment:** This is unsatisfying. It relies on a distinction between "architect" and "operator" that may not hold in a totalitarian hierarchy. If pressed, concede that at the very top, Category 3 and 2 converge, but argue that Category 3 explains the *complicity of the middle bureaucracy* which Category 2 cannot.
