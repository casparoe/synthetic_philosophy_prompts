answer: |-
  **Setting:** *Professor Elena Vance's office. 2:15 AM. The floor is littered with printouts and empty coffee cups. The whiteboard is covered in diagrams of overlapping circles and atomic structures. Elena (Universalist) is leaning against the desk; Marcus (Nihilist) is pacing.*

  **Marcus:** You're treating the Special Composition Question like it's a zoning permit. "Oh, sure, let these atoms compose a thing, let those ones compose a thing." But you haven't answered *why*. What is the glue?

  **Elena:** There is no glue, Marcus. That's the point. Composition is unrestricted. Any plurality of things, whatsoever, composes a further thing. The atoms in my coffee cup and the atoms in your left shoe compose an object. It's an ugly object, but it exists.

  **Marcus:** And that's where you lose the plot. Because if you say *any* plurality composes an object, you run straight into the Problem of the Many. And you don't have a shield big enough to stop it.

  **Elena:** I don't need a shield. I invite the problem in.

  **Marcus:** *[Stops pacing]* Excuse me?

  **Elena:** Take a cloud. Or a cat. Let's use the cat. There are atoms at the boundary. Some are definitely part of the cat. Some are definitely not. But there are hundreds of atoms on the fringe—loose hairs, skin flakes, air molecules caught in the fur. For any one of them, it's indeterminate whether it's part of the cat.

  **Marcus:** Precisely.

  **Elena:** So, consider the set of atoms that includes the definite ones plus fringe-atom A. That's a candidate for the cat. Now consider the set with the definite ones plus fringe-atom B. That's another candidate. There are thousands of these overlapping aggregates.

  **Marcus:** And here is the knife. Ordinary thought says there is exactly *one* cat on the mat. If there are thousands of candidate aggregates, and none is privileged over the others, then either there are thousands of cats on the mat, or there are none.

  **Elena:** I choose thousands.

  **Marcus:** You choose absurdity. Look at the mat. Do you see a swarm of felines? No. You see one cat. If you say there are thousands of distinct objects occupying roughly the same space, you've saved your ontology by incinerating common sense.

  **Elena:** I haven't incinerated anything. I've just taken our semantics seriously. The word "cat" is vague. It doesn't pick out a unique aggregate. But reality? Reality is flooded with objects. Every single one of those thousands of aggregates *exists*. They are all material objects. The Problem of the Many isn't a paradox for me; it's a description of the furniture. There *are* many overlapping objects there. The fact that we use a singular term "the cat" is a linguistic convenience, not a metaphysical constraint.

  **Marcus:** But that makes truth conditions collapse. If I say, "The cat is hungry," which object am I talking about? If there are two thousand cat-candidates, and one of them just ate a mouse while the others didn't, is the sentence true?

  **Elena:** Supervaluation. The sentence is true if it's true for *all* the candidates. They all share the same core. The hunger is a core property.

  **Marcus:** *[Sits heavily in the guest chair]* That's a patch, Elena. It doesn't fix the hole. The hole is arbitrariness. Why do *those* atoms compose an object? You say "all of them do." But then you have to admit that the boundary between the cat and the mat is just... noise.

  **Elena:** The boundary is where the vagueness lives. But the objects are precise. Each aggregate is a precise collection of atoms.

  **Marcus:** And that's the incoherence. You're saying reality is precise—each aggregate is distinct—but our access to it is so fundamentally broken that we can't identify which object is the subject of our discourse. I say the simpler explanation is that composition never happens. There are no aggregates. There are only simples arranged cat-wise.

  **Elena:** So you're a nihilist. You deny the cat exists.

  **Marcus:** I deny the *composite* exists. The simples exist. They are arranged in a way that deceives you into thinking there's a unity.

  **Elena:** But Marcus, the Problem of the Many cuts your throat too. If there are no composites, what are the simples doing? Are they arranged "cat-wise"?

  **Marcus:** Yes.

  **Elena:** Arranged by whom? Or by what standard? If "arranged cat-wise" is a fact, then there is a fact about the relationship between those simples. You've just pushed the composition question back one step. You're saying the simples don't compose a whole, but they do compose a *pattern*. Is the pattern an object?

  **Marcus:** The pattern is a description. It's not an ontological addition.

  **Elena:** And my aggregates are ontological additions?

  **Marcus:** Yes! Because you're committed to the existence of the fusion. I'm not.

  **Elena:** Let's look at the Problem of the Many again. For you, the problem shows that the concept of a composite object is incoherent because there is no fact of the matter which collection is *the* object. So you conclude: no objects. For me, the problem shows that there is no fact of the matter which collection is *the* object because *they are all objects*. The indeterminacy isn't in existence; it's in our counting.

  **Marcus:** But that implies ontological proliferation that is causally inert. If there are two thousand cat-aggregates on the mat, and I pick one up, did I pick up two thousand things?

  **Elena:** Yes. They are coincident. They share the same mass, the same location, mostly the same atoms.

  **Marcus:** They share the same location?

  **Elena:** Roughly.

  **Marcus:** This is where I think we might be talking past each other, Elena. When I say "There is no cat," I am using the quantifier to range over things that have genuine unity. Things that are *one*. When you say "There are many cats," you are using the quantifier to range over mereological sums.

  **Elena:** Are you suggesting quantifier variance? That we're just carving the world differently?

  **Marcus:** I'm suggesting that if your "existence" allows for two thousand objects to occupy the same space without any causal distinction between them, you've diluted the word "exist" until it means nothing. To exist is to be a unit of causal power. A single cat exerts pressure on the scale. Two thousand coincident cats... do they exert two thousand times the pressure?

  **Elena:** No. Because they share the mass. The mass is distributed across the atoms. The aggregates supervene on the atoms.

  **Marcus:** Then they aren't distinct existents in any meaningful sense. They are shadows.

  **Elena:** And your simples are the only reality?

  **Marcus:** Yes. Because simples don't have the boundary problem. An electron is an electron. It doesn't have loose skin flakes.

  **Elena:** But an electron has a wave function. It has spatial indeterminacy. You haven't escaped vagueness; you've just moved it to the quantum level.

  **Marcus:** *[Pauses]* That's a fair hit. But macroscopic vagueness is different. We're talking about whether a specific molecule is part of the organism.

  **Elena:** Look, let's isolate the substantive disagreement. Is it just about how we use the word "exists"? If I say "There exists a sum of your left shoe and my coffee cup," and you say "There do not exist any composites," can we both be right relative to our conceptual schemes?

  **Marcus:** I don't think so. Because if you're right, then there is a fact of the matter that I am missing. You think the world contains these fusions. I think the world contains only simples. That's not a verbal dispute. That's a disagreement about what's actually there.

  **Elena:** Okay. Then here is the substantive core. It's about vagueness in reality. You believe that for an object to exist, its boundaries must be precise. Because the cat's boundaries aren't precise, the cat doesn't exist.

  **Marcus:** Correct. Ontological vagueness is impossible. An object either is or isn't. If it's indeterminate, it's not an object.

  **Elena:** And I believe that existence is precise, but *sortals* are vague. Every aggregate exists precisely. "Cat" is the vague term. The Problem of the Many arises because you think "cat" must map to a unique precise object. I say "cat" maps to a region of overlapping precise objects.

  **Marcus:** But why privilege the aggregates? Why is the sum of the atoms an object, but the sum of the atom and the number 7 not an object?

  **Elena:** Because the number 7 isn't concrete. We're talking about concrete mereology.

  **Marcus:** You're assuming what you need to prove. That spatial proximity or causal connection licenses composition. I say nothing licenses composition.

  **Elena:** And I say nothing *prevents* it. Look, Marcus, the nihilist view is elegant. I'll give you that. It solves the Problem of the Many by eliminating the many. But the cost is that you have to paraphrase away almost every sentence we speak. "The cat is on the mat" becomes "There are simples arranged cat-wise on top of simples arranged mat-wise."

  **Marcus:** And the universalist cost is that you have to accept that you are currently sitting on a chair, but also sitting on a "chair-minus-one-leg," and a "chair-plus-dust-mite," and all of them are distinct objects.

  **Elena:** I am sitting on them. They are all there.

  **Marcus:** It's an ontology of ghosts.

  **Elena:** It's an ontology of generosity.

  **Marcus:** *[Stands up and walks to the whiteboard]* Let's look at the truth conditions again. This is where the rubber hits the road. If I say, "There is exactly one cat in this room," and you are right...

  **Elena:** ...then that sentence is false.

  **Marcus:** Exactly. It's false. There are thousands. So our ordinary discourse is systematically false.

  **Elena:** Or it's context-sensitive. In a veterinary context, "one cat" means one biological life. In a metaphysical context, it means one aggregate.

  **Marcus:** So you're a contextualist about existence?

  **Elena:** I'm a pragmatist about sortals. The objects are always there. The counting depends on the interest.

  **Marcus:** And I say the objects *aren't* there. The interest creates the illusion of unity.

  **Elena:** *[Taps the whiteboard]* Here is the divide. You think the Problem of the Many proves that composition is impossible because it leads to indeterminacy. I think the Problem of the Many proves that composition is ubiquitous, and the indeterminacy is just us trying to put a singular label on a plural reality.

  **Marcus:** But if there's no fact of the matter which aggregate is the cat, then there's no fact of the matter whether the cat exists.

  **Elena:** There is a fact of the matter whether the *aggregates* exist. They all do.

  **Marcus:** But none of them are *the cat*.

  **Elena:** "The cat" is a way of pointing to the cluster.

  **Marcus:** *[Sighs]* You know, Lewis argued that the Problem of the Many shows we have to accept many overlapping objects.

  **Elena:** I know. He was right.

  **Marcus:** And van Inwagen argued that it shows we have to restrict composition to lives only.

  **Elena:** And I think he was trying to save common sense by building a lifeboat that's too small.

  **Marcus:** And I'm saying the ship is sunk. There are no ships. Only planks.

  **Elena:** *[Smiles]* Well. The planks are composing a very sturdy argument, Marcus. Even if you say they aren't.

  **Marcus:** *[A faint smile]* They are arranged argument-wise.

  **Elena:** Close enough. Pour me some more coffee?

  **Marcus:** Only if you admit that the coffee cup doesn't exist.

  **Elena:** Pour the coffee, Marcus. The cup will take care of itself.
