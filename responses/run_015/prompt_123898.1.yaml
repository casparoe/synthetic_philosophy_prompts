          *   If the monster has steep diminishing returns, its hunger for resources slows down quickly.
          *   If humans have a cap, we hit a ceiling.
          *   *Crucial Point:* The intersection. If the monster's utility curve drops *below* the human's capped utility level relatively early, then giving resources to humans becomes more efficient for the *total* or *average* than continuing to feed the monster.
