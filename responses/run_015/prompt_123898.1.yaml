  2.  **Deconstruct the Core Argument:**
      *   *The Standard Utility Monster:* A being who gets *so much* more utility from resources than anyone else that utilitarianism demands we feed it everything, starving everyone else.
      *   *The User's Twist:* The monster has *steep diminishing returns* (each extra unit of resource gives it less joy than the last), while humans have a *hard cap* (we can only be so happy, no matter how much we get).
      *   *The Claim:* Even with this setup, maximizing average utility doesn't necessarily mean feeding the monster everything.
      *   *The Problem to Solve:* Why doesn't the math just say "Monster still wins until its marginal utility drops to human level"? And how to defend the "human cap" against charges of bias.

