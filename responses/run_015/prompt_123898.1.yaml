          *   *Key Concept:* The "Zone of Indifference." If the monster is already super happy (near its own internal saturation), giving it more adds almost nothing to the average. Giving that same resource to a miserable human adds a lot. Thus, average utility is maximized by distribution, not monopolization.

      *   **Part 3: Addressing "Special Pleading" (The Anthropocentric Bias Charge).**
