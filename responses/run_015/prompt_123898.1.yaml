          *   *Argument:* Biological/Structural limits. Human happiness is tied to specific needs (food, social, safety). Once those are met, more doesn't help. This isn't bias; it's a claim about the nature of sentient experience.
          *   *Reversal:* If the monster exists, it must have a nature too. If its nature allows infinite growth, that's a specific metaphysical claim that needs proof. Assuming finite capacity is the neutral default; assuming infinite capacity is the extraordinary claim.
