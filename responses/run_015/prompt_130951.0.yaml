  The painter traps the shadow in a frame,
  The poet mimics acts of men and time;
  They chase the Idea's faint and hollow flame,
  And climb a ladder made of shade and rhyme.
  For sculpture, verse, and painting all must serve
  As copies of the forms that Will unfolds;
  They mirror shadows, never dare to swerve
  Beyond the veil that Maya strictly holds.

  Yet music leaps the veil, it copies Will,
  It needs no image from the world's profound;
  The deep bass is gravity, mass, and hill,
  Inorganic nature's grounding sound.
  Harmony fills the vegetable grade,
  But melody is man's own striving made.
