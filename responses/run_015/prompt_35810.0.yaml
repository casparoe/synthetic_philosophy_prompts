answer: |-
  This is an exceptionally sharp prompt. You are right to treat the "Expanding Circle" not as a settled truth but as a theoretical tool that needs stress-testing. The metaphor is so ubiquitous in moral philosophy and effective altruism that its geometric simplicity often masks significant conceptual distortions.

  Here is an audit of the metaphor, structured to help you build your term paper.

  ### 1. The Correspondence: Mapping the Geometry

  To audit the metaphor, we must first formalize the mapping your professor and peer are relying on. In the standard usage of Singer's image:

  *   **The Center:** The moral agent's self (or the egoistic starting point of evolutionary psychology).
  *   **The Concentric Rings:** Hierarchy of moral priority based on "distance" from the self (Kin $\rightarrow$ Tribe $\rightarrow$ Nation $\rightarrow$ Humanity $\rightarrow$ Sentient Beings).
  *   **The Boundary (Circumference):** The limit of moral considerability. Entities outside are morally negligible; entities inside count.
  *   **The Radius:** The maximum "distance" at which an entity is still granted moral status. This is the metric of *scope*.
  *   **The Act of Expansion:** The historical or psychological process of moving the boundary outward to include previously excluded categories (e.g., moving the boundary from "white men" to "all humans").
  *   **The Ideal State:** A circle with infinite radius (or a radius encompassing all morally relevant entities), often implying a smooth gradient of concern fading toward the edge.

  ### 2. Disanalogies: Incidental vs. Structural

  Metaphors always break down eventually. The question is whether they break where the argument relies on them. I have sorted these disanalogies by their relevance to the two licensed claims (Predictable Direction and Radius as Measure).

  #### Incidental Disanalogies (Low Relevance)
  *   **Spatial vs. Conceptual Distance:** Obviously, "distance" is not physical miles. It is psychological or relational. As long as everyone understands this is abstract space, the metaphor holds.
  *   **Two-Dimensionality:** The circle is flat; moral life is multidimensional. However, this is a standard simplification. Unless the argument relies on *area* calculations, this is poetic license.
  *   **Continuity:** A drawn circle has a smooth line; moral boundaries are often jagged legal or social categories. This is a minor friction point but doesn't invalidate the general trend.

  #### Structural Disanalogies (High Relevance)
  These break the logic of the two licensed claims.

  *   **Uniformity of Expansion (Targets Claim 1: Predictable Direction):**
      *   *The Metaphor:* Circles expand uniformly outward in all directions.
      *   *The Reality:* Moral progress is jagged. A society might expand rights to animals (outward) while contracting rights for women (inward). The metaphor suggests a monolithic "forward" motion, obscuring the possibility of moral trade-offs or regressions in specific sectors.
  *   **The "Outside" as Vacuum (Targets Claim 1: Predictable Direction):**
      *   *The Metaphor:* There is always an "outside" waiting to be included, implying a teleological pull.
      *   *The Reality:* There is no logical necessity that the "next" group exists. Once all sentient beings are included, what is the next expansion? Artificial minds? Ecosystems? The metaphor implies an infinite task, whereas moral philosophy might aim for a *completed* set of principles, not infinite inclusion.
  *   **Inclusion vs. Weight (Targets Claim 2: Radius as Measure):**
      *   *The Metaphor:* To be inside the circle is to be counted.
      *   *The Reality:* Being "inside" does not specify *how much* one counts. A slave is "inside" the moral circle of a slaveholder (they are recognized as human, just subordinate), but their interests are weighted near zero. The radius measures *status*, not *equality*.
  *   **Attenuation of Force (Targets Claim 2: Radius as Measure):**
      *   *The Metaphor:* In physics, influence from a center weakens as it reaches the boundary (gravity/light).
      *   *The Reality:* Most universalist moral theories (including Singer's utilitarianism) argue for *equal* consideration of interests regardless of distance. The visual of concentric rings inherently suggests special obligations to the center that fade outward, contradicting the universalist goal.

  ### 3. Addressing Your Two Worries

  Your intuitions here are correct and point to the deepest flaws in the metaphor's usage.

  **Worry 1: Depth vs. Breadth (The Internal Progress Problem)**
  You noted that the decline of cruelty within families or the end of dueling represents progress without expansion. The metaphor fails here because it is **extensive** rather than **intensive**.
  *   **Why it matters:** The metaphor equates moral progress with *adding new subjects* to the moral community. It cannot visualize *deepening the obligations* to existing subjects.
  *   **Impact on Claim 2:** If "radius" is the metric, a society that grants nominal inclusion to animals but tolerates domestic violence could theoretically score higher than a society that ensures radical equality among humans but excludes animals. The metaphor lacks a variable for *intensity of obligation*. It measures the *who*, not the *how*.

  **Worry 2: Attenuation vs. Principle (The Sociobiological Hangover)**
  You noted that the ripple image fits evolutionary altruism (kin selection) better than reflective morality.
  *   **Why it matters:** Singer's *book* uses sociobiology to explain the *origin* of ethics (the center), but reason to explain the *expansion* (the boundary). However, the *image* of concentric circles locks us into the logic of the origin. It suggests that moral concern is a resource that depletes as it travels.
  *   **Impact on Claim 1:** If morality is principled (e.g., "pain matters regardless of who feels it"), there is no "direction" of expansion based on distance. There is only the application of a rule. The circle metaphor suggests we move from Tribe $\rightarrow$ Nation $\rightarrow$ Humanity as a sequence of overcoming distance. But principled morality suggests we should have started at "Humanity" immediately once the principle was grasped. The metaphor historicizes what ought to be instantaneous, making progress look like a gradual overcoming of friction rather than a cognitive shift.

  ### 4. The Verdict on the Licensed Conclusions

  Does the metaphor survive the audit?

  **Conclusion 1: Moral progress has a predictable direction.**
  *   **Verdict: Fails.**
  *   **Reasoning:** The circle implies a teleology (an inevitable outward push). History shows moral change is contingent, reversible, and multidirectional. The metaphor smuggles in a Whiggish view of history under the guise of geometry. It suggests the "next" step is always "further out," whereas the next step might be "deeper in" (e.g., repairing justice within the nation before worrying about global poverty). The geometry dictates the history, rather than describing it.

  **Conclusion 2: A society's moral standing is measured by its radius.**
  *   **Verdict: Fails.**
  *   **Reasoning:** This is the more dangerous failure. By prioritizing radius, the metaphor incentivizes "moral vanity"—claiming concern for distant, abstract entities (future generations, animals) while neglecting immediate, concrete obligations (neighbors, citizens). It ignores the *quality* of the moral relations inside the boundary. A wide circle with a hollow center is not moral progress; it is moral dilution. The metaphor has no way to register that a smaller circle with perfect justice inside might be preferable to a larger circle with systemic tyranny inside.

  ### 5. Alternative Imagery

  If the circle fails to capture the heterogeneity of moral change, what works better? You might propose one of these in your paper's conclusion:

  1.  **The Topographical Map (Leveling):**
      *   Instead of a circle expanding over a void, imagine a terrain with peaks and valleys (inequality). Moral progress is not widening the map, but **flattening the terrain**. High peaks (privilege) are lowered, and deep valleys (suffering/oppression) are filled. This captures your first worry: progress happens by changing the elevation *within* the mapped area, not just adding new land.
  2.  **The Web or Fabric (Interconnection):**
      *   Instead of distance from a center, imagine a web of obligations. Moral progress is **increasing the density of the weave** or strengthening the threads. This handles the "attenuation" problem: in a web, tension is distributed. A break anywhere weakens the whole. This fits the idea that mistreating insiders undermines the moral standing of the society regardless of its treatment of outsiders.
  3.  **The Prism (Refracting Principles):**
      *   Moral progress is not adding new objects, but changing the **light source**. When the light changes (e.g., from "honor" to "autonomy" to "sentience"), different objects are illuminated. This explains why the "boundary" shifts unpredictably. It's not that the circle grew; it's that the criteria for inclusion changed, lighting up different groups entirely.

  ### Summary for Your Paper

  The "Expanding Circle" is a heuristic that has outlived its utility. It successfully describes the *sociobiological origin* of moral sentiment (kin to tribe), but it fails as a normative map for *principled moral progress*.

  It survives neither of your professor's claims. It falsely implies a predictable, outward trajectory (ignoring regression and internal reform) and it promotes a misleading metric (radius) that values scope over depth. For an upper-level seminar, the strongest move is to argue that the metaphor actively distorts moral reasoning by encouraging us to look for the "next excluded group" rather than examining the quality of inclusion we have already granted. Moral change is likely too heterogeneous for a single geometric figure, but if you must choose, a **topographical model of leveling** captures the work of justice better than a **geometric model of expansion**.
