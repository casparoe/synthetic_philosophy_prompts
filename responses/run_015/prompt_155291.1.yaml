prompt: |-
  Write a pantoum on Hegel's master-slave dialectic of recognition, but frame it not as a historical progression and instead as a static structural loop in which two self-consciousnesses seek validation solely through each other's gaze, with the risk of death functioning as the threat of being reduced to mere objecthood (Dingheit) rather than as physical combat. Use the pantoum's interlocking repetition—lines returning in altered stanzas—to represent how each party can only articulate its claim to autonomy through language structurally borrowed from the other. Make the two cycling refrains the master's "I am seen, therefore I am" and the slave's "I work, therefore I become," but allow exactly one word in one refrain to shift in the final stanza, so that the form itself shows mutual recognition remaining asymmetrical. Render the dialectic's stages—the initial encounter, the life-and-death struggle, domination, and the slave's eventual self-certainty through labor and fear—accurately enough that a specialist recognizes them without your naming them. In a brief attached note, take a definite stand: identify precisely where the poem takes liberties with Hegel's Phenomenology (for example, if it collapses temporal development into a loop or grants the master a capacity for genuine recognition he lacks in the text), and state clearly which contested interpretive reading the framing relies upon—such as Kojève's anthropological interpretation versus a stricter phenomenological one—giving your reasons for that choice rather than listing alternatives neutrally. Keep the poem free of citations, bibliographic references, or reading lists.
