answer: |-
  You have put your finger on one of the most persistent and uncomfortable tensions in the philosophy of mind and neuroscience. You are right to feel that something is slipping past you; the move you describe is standard, but its logical status is rarely scrutinized as closely as you are scrutinizing it.

  To answer your first question directly: **No, there is no single, canonical name for this specific asymmetry.** You will not find it listed in a dictionary of fallacies alongside *ad hominem* or *straw man*.

  However, it sits at the intersection of three established concepts. Understanding those will tell you what the thing is, and where your observation departs from the standard treatment.

  ### 1. The Closest Established Notions

  **A. The Mereological Fallacy**
  This is the heavy hitter. Coined (in its modern usage) by Max Bennett and Daniel Hacker in their 2003 critique of neuroscience, it refers to the error of ascribing properties of the whole (the person) to the parts (the brain or hemisphere). Only a *person* can see, believe, or act; a hemisphere can only process signals and trigger motor outputs.
  *   **Where it fits:** Your observation that authors use psychological verbs for hemispheres in Phase 1 is an accusation of committing the Mereological Fallacy.
  *   **Where it departs:** Bennett and Hacker argue the authors are *always* wrong to use that language. You are noting that the authors use it *strategically*: they embrace the fallacy when it yields dramatic results (consciousness splits) and retreat from it when it yields ontological baggage (two subjects). The fallacy itself doesn't name the *switching*, only the error.

  **B. The Personal/Subpersonal Distinction**
  This is the shield the authors raise in Phase 2. Popularized by Daniel Dennett and others, this distinction holds that there are two levels of description.
  *   **Personal Level:** Subjects, beliefs, actions, reasons. (Applies to the patient).
  *   **Subpersonal Level:** Information processing, causal subsystems, hypotheses. (Applies to the hemisphere).
  *   **Where it fits:** Authors claim Phase 1 is just vivid "subpersonal" description, while Phase 2 is the serious "personal" ontology.
  *   **Where it departs:** As you noted, the language in Phase 1 ("understood," "invented a story") is explicitly *personal* level language. If the distinction were rigorously maintained, Phase 1 would read: "The right hemisphere processed visual data and initiated a motor sequence." The moment they say the hemisphere "knew" what to do, they have crossed the line. The asymmetry lies in crossing the line when it helps, and policing it when it hinders.

  **C. Parity of Reasoning**
  This is a logical principle rather than a named fallacy. It demands that if a premise supports Conclusion A, it should support Conclusion B unless a relevant difference is shown.
  *   **Where it fits:** This is the core of your complaint. If "agential language" is evidence for *disunity of consciousness*, why is it not evidence for *plurality of subjects*?
  *   **Where it departs:** Parity of Reasoning is a general rule of logic. It doesn't capture the specific *psychological* or *rhetorical* motive you identified: the desire to have empirical drama without ethical or ontological cost.

  ### 2. A Coinage for the Asymmetry

  Since there is no established term for the *tactical switching* itself, I will invent one for you, as requested. Let us call it:

  **The Ontological Slide**

  **Definition:** The rhetorical practice of ascribing agential or psychological properties to a subsystem to establish its functional independence (evidence for disunity), while simultaneously denying those properties the ontological weight required to constitute a distinct subject (evidence for plurality), typically by retreating to a mechanistic description only when the count of subjects is challenged.

  **Borderline Cases (to test the edges):**

  1.  **The Immune System (Not The Ontological Slide):** A biologist says, "The immune system *recognizes* the virus and *remembers* it." Later, they deny the immune system *knows* anything or is a *subject*.
      *   *Verdict:* This is **not** The Ontological Slide. Why? Because nobody is trying to claim the immune system has a separate *consciousness* that has now been split. The "agency" talk is accepted as metaphor throughout. There is no bait-and-switch regarding the *count* of minds.
  2.  **AI Large Language Models (The Ontological Slide):** A developer says, "The model *reasoned* through the problem and *decided* to lie." (Phase 1: Agential). When asked if the model is responsible or has rights, they say, "It's just predicting tokens; it's not a *mind*." (Phase 2: Mechanistic).
      *   *Verdict:* This **is** The Ontological Slide. The agential language is used to sell the capability (it works like a human), but withdrawn to avoid the liability (it isn't a person).
  3.  **Dissociative Identity Disorder (Hard Case):** A clinician describes an "alter" personality: "She *holds* the trauma memory and *refuses* to speak." (Phase 1). But legally and medically, the *patient* is one subject. (Phase 2).
      *   *Verdict:* This is the **border**. Here, the "one subject" claim is often ethical/legal (one body, one responsibility) rather than purely phenomenological. Some philosophers argue DID *does* involve multiple subjects. The Slide occurs if the clinician insists the alters are fully agentive for diagnosis but non-agentive for legal responsibility without explaining the shift.

  ### 3. Can the Asymmetry be Defended?

  You asked if there is a reading on which the shorthand is evidential about disunity but silent about subject count. Is it "wanting it both ways," or is there a coherent position?

  There is **one** coherent defense, but it requires a specific definition of "Subject."

  **The Integrationist Defense:**
  A proponent (like a Dennettian or a Global Workspace theorist) would argue:
  1.  **Consciousness is a matter of information access.** When the commissure is cut, information access is broken. Therefore, consciousness is empirically disunified (Phase 1 is valid).
  2.  **Subjecthood is a matter of narrative unity.** A "Subject" is not just a locus of experience, but a locus of *responsibility* and *narrative construction* over time. Since the two hemispheres cannot coordinate a single life story, and the body remains one legal and biological entity, there is only one "Person" (Phase 2 is valid).

  On this view, you can have **two streams of consciousness** (disunity) within **one biographical subject** (unity).

  **Why your objection still holds water:**
  The Integrationist Defense fails if you accept the premise you brought from zoology: **Behavior implies Experience.**
  If the right hemisphere can "understand" a word, "select" an object, and the left hemisphere can "confabulate" a reason, these are behaviors associated with *perspective*.
  *   If the right hemisphere has a perspective (it sees something the left doesn't), it has a "point of view."
  *   If it has a point of view, it is a subject of experience, even if it can't speak.
  *   To say "It has a point of view but isn't a subject" is to define "subject" in a way that excludes the very thing (experience) that matters.

  Thomas Nagel, in his 1971 paper *"Brain Bisection and the Unity of Consciousness,"* saw exactly what you are seeing. He concluded that if the evidence suggests two centers of consciousness, we must accept two subjects, however uncomfortable that makes our legal or moral systems. He argued that the "one person" view is often a refusal to follow the evidence where it leads because the implications (two people in one body) are too disturbing.

  ### Summary

  *   **Name:** There is no standard name. It is a strategic misuse of the **Personal/Subpersonal Distinction** that violates **Parity of Reasoning**.
  *   **Coinage:** I suggest calling it **The Ontological Slide**.
  *   **Defensibility:** It is defensible *only* if you define "Subject" as a long-term narrative construct rather than a locus of immediate experience. If "Subject" means "something that experiences," the asymmetry collapses, and you are correct: it is wanting it both ways.

  Your zoologist's instinct is serving you well here. In ethology, if an animal behaves *as if* it perceives and chooses, we treat it as a perceiving, choosing agent until proven otherwise. The philosophy of mind literature often reverses this: it treats the hemisphere as an agent to explain the data, then treats it as a machine to preserve the metaphysics. You are right to demand parity.
