answer: |-
  ### The Scenario

  Elara faces a bonus choice. On Monday, she prefers $250 in two days over $200 in one day. She plans to wait. But come Tuesday, the choice is real: $250 tomorrow or $200 now. The delay is still one day, but the reward is immediate. She takes the $200. She knew on Monday she'd do this. She isn't confused; she just weighs immediate cash heavier once 'now' arrives. She ends up with less money than intended, and would pay to lock herself in, yet at every moment she chose exactly what she wanted most then.

  ### The Walkthrough

  **1. The Model (Quasi-Hyperbolic Discounting)**
  We use the $\beta-\delta$ model. Utility at time $t$ is $U_t = u_t + \beta \sum_{k=1}^{\infty} \delta^k u_{t+k}$.
  *   **Parameters:** $\beta = 0.7$ (present bias), $\delta = 1.0$ (no long-run discounting for simplicity).
  *   **Options:** Smaller-Sooner (SS) = $200; Larger-Later (LL) = $250. Gap = 1 period.
  *   **Choice Point 1 (Monday, $t=0$):**
      *   $U_0(SS) = \beta \delta (200) = 0.7(200) = 140$.
      *   $U_0(LL) = \beta \delta^2 (250) = 0.7(250) = 175$.
      *   **Decision:** $175 > 140$. She prefers LL.
  *   **Choice Point 2 (Tuesday, $t=1$):**
      *   $U_1(SS) = 200$ (Immediate reward is not discounted by $\beta$).
      *   $U_1(LL) = \beta \delta (250) = 0.7(250) = 175$.
      *   **Decision:** $200 > 175$. She prefers SS.
  *   **Result:** The inequality flips solely because the SS option moves from the future ($\beta$ applied) to the present (no $\beta$).

  **2. Specification Check**
  *   **Spec 1 (Reversal):** Derived above. The flip is mathematical, not stipulated.
  *   **Spec 2 (No Akrasia):** At $t=0$, she maximizes $U_0$ (plans LL). At $t=1$, she maximizes $U_1$ (chooses SS). She never chooses an option with lower current utility. She is *sophisticated* (knows at $t=0$ that $U_1(SS) > U_1(LL)$), so there is no surprise or error.
  *   **Spec 3 (Welfare Loss):** She is worse off by her *ex-ante* ($t=0$) lights ($140$ vs $175$ utility units). Why count $t=0$? Because the preference shift is driven by a structural bias (proximity), not new information or stable value change. In behavioral welfare economics, the long-run self is typically treated as the normative benchmark for "true" interests. She would pay up to $35$ utility units at $t=0$ for a commitment device preventing the $t=1$ choice.

  **3. The Working Feature & Variants**
  *   **Working Feature:** **Time-Inconsistency** (specifically the $\beta$ drop for immediate outcomes).
  *   **Minimal Variant:** Change $\beta$ to $1.0$ (Exponential Discounting).
      *   *Result:* Preferences remain consistent ($200 < 250$ at both points). She chooses LL at $t=1$.
      *   *Verdict Broken:* The reversal vanishes; no commitment needed; no appearance of weakness.
  *   **Akratic Sibling:** Add **Normative Judgment Divergence**.
      *   *Change:* At $t=1$, she still *prefers* SS ($U_1(SS) > U_1(LL)$), but she *judges* LL to be better (believes she *ought* to wait).
      *   *Result:* She chooses SS against her current better judgment.
      *   *Why:* This adds a dual-system conflict (Desire vs. Reason) absent in the main case, producing genuine akrasia.

  **4. The Objector**
  *   **Objector:** The Preference Purist (Standard Economist).
  *   **Objection:** Welfare is revealed preference. At $t=1$, she revealed she prefers SS. To say she is "worse off" arbitrarily privileges the $t=0$ self. There is no failure here, only changing tastes.
  *   **Force:** **Serious.** It challenges the normative basis of behavioral policy.
  *   **Reply:** If all preference changes count as welfare neutral, addiction and manipulation cannot be distinguished from learning. Present bias is structurally distinct because it leads to dynamic inconsistency without new information, violating the stability condition required for rational choice welfare analysis.

  **5. Settled vs. Contested**
  *   **Settled:** Quasi-hyperbolic models predict this reversal. Sophisticated agents anticipate it. Commitment devices can improve ex-ante welfare in this model.
  *   **Contested:** Whether the $t=0$ self defines welfare ("True Preferences"). Whether acting on time-inconsistent preferences counts as "weakness of will" or merely "rationally shifting preferences."
  *   **Nobody Knows:** Whether sophistication (knowing you will procrastinate) increases or decreases overall welfare compared to naivety (depends on stress costs vs. mitigation).

