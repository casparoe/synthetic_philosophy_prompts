prompt: |-
  Hey — I write a weekly column on behavioural science and ideas for a weekend magazine. I'm working on a piece about procrastination and the whole willpower-app/commitment-device industry, and I keep running into people who say procrastination isn't weakness of will at all, it's just your preferences shifting over time in a way that's perfectly explicable — the present-biased / hyperbolic-ish discounting story. I want to know whether those two stories can actually be pulled apart in an ordinary case, so I need a thought experiment I can drop into the middle of the column.

  Build me this.

  A single ordinary scenario — one paragraph, under about 120 words, jargon-free and printable as-is, set in a working life a reader would recognise (a freelancer with a commission, a PhD student and a thesis chapter, someone training for a 10k, whatever you like). In it, one agent faces the same pair of options at two different moments: smaller-sooner vs larger-later, offered early, then offered again when the soon option is imminent. The gap between the two options stays fixed; only the distance from now changes.

  Specifications, and I want you to show your work on each rather than just assert it:

  1. The reversal (early: she prefers larger-later; later: she takes smaller-sooner) has to fall out of the discounting model, not be stipulated. Give me the functional form, the actual parameter values you're using, and both computations at both choice points, so a reader can see the inequality flip. Quasi-hyperbolic or plain hyperbolic, your call, just state it.

  2. The hard part, and the bit the column turns on: at no point may she act against her own all-things-considered judgement about what's best. No moment where she thinks B is better and does A. I want an agent who does exactly what she judges best at every moment and who is fully aware from the start of exactly how she'll behave later — the sophisticated case, not the naive one. No forgetting, no new information, no factual mistake, no ambushing desire, no addiction, no diagnosis, nothing clinical.

  3. And yet something has to have gone wrong: she ends up worse off by her own lights, she'd grab a commitment device if you offered her one, and an ordinary reader would call her weak-willed. (Don't let "worse off by her own lights" be satisfied just by stipulating that the early self's perspective is the one that counts for welfare — say why it counts, or tell me the case can't deliver this and why.) If the honest answer is that nothing has gone wrong, argue that instead.

  Then:

  4. Name the single feature of the case doing the work — the one that lets (1) and (2) hold while still generating (3). Then build the minimal variant: change exactly that one feature, hold everything else identical, and show which verdict breaks and how. I'd also like the sibling case where the same reversal does come with genuine acting-against-your-better-judgement, and to know precisely what you had to add to get it.

  5. Give me the objector's best move: someone who holds there's no such thing as weakness of will, only shifting preferences — what's their strongest objection to your case, what's your reply, and is the objection fatal, serious, or merely awkward?

  What counts as cheating for my purposes: the piece asks whether procrastination is a failure of will or a failure of timing, so a scenario that just stipulates "she judges B better and does A" begs the question — that's the thing in dispute. Same if the only reason she reverses is that she learns something new or the options really did change. And no self-deception, no weak-willed-by-definition.

  On standards: this is going in print, so I need to know what I can state flatly. Please separate explicitly what's settled among people who actually work on this from what's genuinely contested — I don't want to present a contested reading (of what weakness of will requires, or of how to count welfare for an agent whose preferences change over time, or of whether sophistication about your own present bias helps or hurts you) as the consensus. Where your own scenario leans on a contested assumption, flag it.

  After the scenario and the walkthrough, give me a JSON object with this schema, which I'll paste into my notes:

  - "scenario": the one-paragraph case exactly as you'd want it printed
  - "model": {"functional_form": string, "parameters": object, "choice_point_1": string, "choice_point_2": string, "inequality_flip": string}
  - "spec_check": array, one object per specification (1-3), each with "spec", "satisfied" (true/false), "how_shown", and "cheat_risk" (where you were tempted to stipulate instead of derive)
  - "working_feature": string
  - "minimal_variant": {"changed_feature": string, "breaks_which_verdict": string, "why": string}
  - "akratic_sibling": {"added_feature": string, "why_it_produces_genuine_akrasia": string}
  - "objections": array of objects with "objector", "objection", "force" ("fatal"/"serious"/"awkward"), "reply"
  - "settled_vs_contested": array of objects with "claim", "status" ("settled"/"contested"/"nobody knows"), "note"

  Add any fields you think I'm missing, and tell me at the end, in a sentence, whether the column's question survives your own case or whether the case shows it was badly posed.
