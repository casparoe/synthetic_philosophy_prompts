answer: |-
  This is a classic problem in the philosophy of science, specifically the literature on *idealization* (think Nancy Cartwright, Michael Weisberg, or Uskali Mäki). Your intuition is better than your tentative rule. Your tentative rule fails because it conflates three different *jobs* that models do.

  Here is the autopsy of your tentative rule, the repaired principle, and the application to your cases.

  ### 1. Autopsy of the Tentative Rule
  *Rule: OK iff (a) robust to de-idealizing, AND (b) not about the thing being explained.*

  **Where it breaks:**
  1.  **It condemns Null Models (H-W, Coase).** These models are *not* robust to de-idealizing. If you add selection to Hardy-Weinberg, the equilibrium breaks. That is the point. Your rule (a) fails here.
  2.  **It condemns Generative Models (Schelling).** In Schelling, the assumption *is* about the thing being explained (preferences explain segregation). Your rule (b) fails here.
  3.  **It condemns Standard Physics (Ideal Gas).** As you noted, near condensation, the model fails catastrophically. It is not globally robust. Your rule (a) is too strict.
  4.  **It lets through EMH.** If you assume rational expectations and no frictions, market efficiency *is* robust. But you correctly feel this is cheating. Your rule (a) is too permissive here.

  ### 2. The Repaired Principle: The Three-Filter Test
  To save your verdicts, you need to distinguish *why* the model is being used. An assumption is excusable if it passes the filter corresponding to the model's purpose.

  **Clause 1: The Baseline Filter (For Null Models)**
  *   **Principle:** An unrealistic assumption is excusable if the model is intended as a coordinate system to measure deviation, **provided the metric of deviation is defined.**
  *   **Saves:** Hardy-Weinberg, Coase Theorem, Homogeneous Mixing (in introductory contexts).
  *   **Kills:** Nothing in your "Fine" list.
  *   **Why:** In H-W, the falsity *is* the data. In Epidemics, homogeneous mixing is fine *if* you explicitly state it is a baseline $R_0$ calculation, not a policy prediction.

  **Clause 2: The Sufficiency Filter (For Existence Proofs)**
  *   **Principle:** An unrealistic assumption is excusable if the model aims to show that a simple mechanism *can* produce a complex outcome, **provided the assumption is not merely the conclusion restated.**
  *   **Saves:** Schelling, Friedman's Billiards, Domino (Identical Prob).
  *   **Kills:** Perfect Rationality/EMH, Firm as Profit-Max (in theory-of-the-firm).
  *   **Why:** Schelling shows mild preferences *suffice* for segregation. EMH assumes rationality which *entails* efficiency; it doesn't show how efficiency emerges from interaction, it assumes it in. Friedman is "as-if," which passes sufficiency for prediction, but fails if you claim players *actually* calculate.

  **Clause 3: The Causal Integrity Filter (For Predictive/Causal Models)**
  *   **Principle:** An unrealistic assumption is excusable if the omitted detail does not carry the causal load of the specific phenomenon being predicted.
  *   **Saves:** Planets as points, Ideal Gas (at STP), Cell as well-mixed, Domino (Identical Prob).
  *   **Kills:** Representative Agent (Fiscal), OLG (Infinitely-lived), Firm (Profit-Max), Domino (No Renegotiation).
  *   **Why:**
      *   **Planets:** Shape doesn't drive orbits; mass does. (Passes).
      *   **Rep Agent:** Heterogeneity *is* the multiplier mechanism. Removing it removes the cause. (Fails).
      *   **Domino (Prob):** Cascade dynamics depend on the *linkage*, not the specific $p$ distribution. (Passes).
      *   **Domino (Renegotiation):** Renegotiation is a feedback loop that stops cascades. Removing it artificially guarantees the result. (Fails).
      *   **Cell:** Transport is fast relative to reaction; the "mixing" isn't the rate-limiting step. (Passes).

  ### 3. Application to Your List
  Here is how the Three-Filter Test adjudicates your specific cases:

  | Case | Verdict | Filter Applied | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Planets / Sphere** | Fine | Causal Integrity | Shape is causally irrelevant to orbital trajectory. |
  | **Galileo / Friction** | Fine | Causal Integrity | Friction is a perturbation, not the driver of inertia. |
  | **Ideal Gas** | Fine | Causal Integrity | Intermolecular forces are negligible at standard conditions (context matters). |
  | **Hardy-Weinberg** | Fine | Baseline | Purpose is to measure evolutionary force, not describe reality. |
  | **Schelling** | Fine | Sufficiency | Shows mild bias *suffices*; assumption $\neq$ conclusion. |
  | **Friedman (Billiards)** | Fine | Sufficiency | Instrumentalist view: predicts shots, doesn't claim cognitive reality. |
  | **Rationality / EMH** | **Not Fine** | Sufficiency | Fails "Assumption $\neq$ Conclusion." Efficiency is baked into rationality. |
  | **Rep Agent (Fiscal)** | **Not Fine** | Causal Integrity | Heterogeneity is the causal mechanism for the multiplier. |
  | **Coase** | Fine | Baseline | Purpose is to highlight transaction costs as the friction. |
  | **OLG / Infinite Life** | **Not Fine** | Causal Integrity | Intergenerational transfer is the mechanism; infinite life removes the generator. |
  | **Firm / Profit Max** | **Not Fine** | Sufficiency | In theory-of-the-firm, decision-making *is* the phenomenon. |
  | **Cell / Well-mixed** | Fine | Causal Integrity | Reaction kinetics, not diffusion, are the rate-limiting step. |
  | **Domino (Identical $p$)** | Fine | Causal Integrity | Cascade topology matters more than specific risk variance. |
  | **Domino (No Reneg.)** | **Not Fine** | Causal Integrity | Removes a negative feedback loop essential to the system's stability. |
  | **Epidemics (Mixing)** | **Contextual** | Baseline vs. Causal | Fine for teaching $R_0$ (Baseline). Not Fine for vaccine targeting (Causal). |

  ### 4. The Two New Cases

  **Case A: Citation Networks (Uniform Random Citation)**
  *   **Verdict:** **Not Fine** (for explaining network structure); **Fine** (as a null model).
  *   **Application:**
      *   If the model claims to explain *why* some papers become highly cited, this fails the **Sufficiency Filter**. Real citation is preferential attachment (rich-get-richer). Assuming uniform random citation removes the mechanism of prestige accumulation.
      *   If the model is used to say "Here is what a network looks like without prestige," it passes the **Baseline Filter**.
  *   **Handout Advice:** Mark as "Not Fine" for explanatory models. This is a common trap in bibliometrics.

  **Case B: Academic Hiring (Scalar Quality + Perfect Observation)**
  *   **Verdict:** **Not Fine**.
  *   **Application:** Fails the **Causal Integrity Filter**.
  *   **Reasoning:** In labor markets for academics, "quality" is multidimensional and "observation" is noisy and biased. If you model hiring to understand inequality or stratification, assuming perfect observation removes the friction (bias/noise) that *causes* the stratification. It assumes away the problem you are likely trying to study.
  *   **Exception:** Fine only if used as a **Baseline** to measure the "efficiency loss" due to bias.

  ### 5. Recommendation for the Handout

  I recommend you use the **Three-Filter Test**.

  **Why?**
  1.  **Pedagogical Clarity:** It teaches students to ask "What is this model *for*?" before asking "Is this assumption true?"
  2.  **Saves Your Intuitions:** It perfectly aligns with your gut on the Domino model (which is the most sophisticated case you listed). The distinction between "Identical Probability" (irrelevant variation) and "No Renegotiation" (removed feedback) is captured by **Causal Integrity**.
  3.  **Handles the Flip-Flop:** It resolves the Epidemic mixing issue. It explains *why* you flip-flop: because you are switching between using the model as a **Baseline** (Fine) vs. a **Policy Tool** (Not Fine).

  **Handout Wording Suggestion:**
  > **When is a false assumption excusable?**
  > It depends on the model's job.
  > 1.  **Is it a Baseline?** (e.g., Hardy-Weinberg). False assumptions are OK if they define a zero-point for measuring real-world deviation.
  > 2.  **Is it an Existence Proof?** (e.g., Schelling). False assumptions are OK if they show a simple cause *can* produce a complex effect, provided you aren't just assuming the conclusion.
  > 3.  **Is it a Causal Explanation?** (e.g., Fiscal Multipliers). False assumptions are **NOT** OK if they remove the specific heterogeneity or friction that drives the outcome.
  >
  > *Warning:* Homogeneous mixing in epidemics is fine for (1), but dangerous for (3). Know which one you are doing.

  This gives your students a actionable heuristic without oversimplifying the philosophy.
