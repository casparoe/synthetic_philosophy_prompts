      *Accommodation Cost:* This principle relies heavily on a "biological/structural essentialism." It explicitly rejects the idea that consciousness could *emerge* purely from complex computation if that computation wasn't a map of a biological brain. This might feel unscientific to some, but it fits the user's intuitions perfectly. I need to be honest that this sacrifices the possibility of "alien minds" or "silicon consciousness" that isn't a brain scan.

