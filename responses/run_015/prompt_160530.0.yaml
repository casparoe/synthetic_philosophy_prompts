          *   *Argument:* This is purely a coordination norm. Opting out makes you ineffectual without ethical gain.

  3.  **Evaluate the Options:**
      *   *Option 1: "Use your judgment" (No Rule).*
          *   *Pros:* Flexibility.
          *   *Cons:* Students are inexperienced. "Judgment" failed in both incidents. Leaves students vulnerable to moral distress or exploitation.
      *   *Option 2: "Comply with all local norms" (Guest Compliance).*
