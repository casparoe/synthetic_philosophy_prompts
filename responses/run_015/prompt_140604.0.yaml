answer: |-
  Dear friend,

  I have spent some time with your cases, and I think the friction you are feeling comes from trying to apply a purely epistemic principle to what is actually a problem of moral agency. You are looking for a rule about when testimony yields knowledge, but your intuitions are tracking when testimony yields ownership. The principle that best reproduces your verdicts, though it will require you to surrender a couple of them, is what I will call the Principle of Moral Ownership. It has two clauses. The first clause states that testimony is sufficient for moral belief when the belief is used to guide action toward compliance with a norm or to acknowledge harm done to a third party, provided the testifier has relevant standing or expertise. The second clause states that testimony is insufficient for moral belief when the belief is required to constitute a sincere expressive act, such as a relational apology or a self-justification, because those acts demand that you grasp the value at stake rather than merely registering its existence. The unease you feel is not an epistemic failing about truth, but an agential failing about sincerity; it is the sensation of acting as a conduit for values you do not hold rather than as a source of values you endorse.

  Let us see how this maps onto your cases. In the first case, your daughter accepts a fundamental norm on authority. This is action-guiding and educational, fitting the first clause, so it is fine. In the second case, you defer on etiquette. This is low-stakes compliance, also fitting the first clause. In the third case, you defer to a disliked colleague on sexism. This fits the first clause because the claim is about harm caused to others, not a repair of your relationship with the colleague, and the testifier has standing as a participant in the meeting. In the fourth case, you apologize for betraying your partner based on her say-so while lacking the belief. This violates the second clause. An apology is an expressive act that claims you now see the wrongness; if you only believe it on her say-so, you are performing the shape of repair without the substance of moral recognition, which explains the hollowness you feel. In the fifth case, you change behavior without claiming the belief. This fits the first clause again; you are complying with a boundary without pretending to a moral insight you lack, so it feels fine. In the sixth case, you purchase a verdict. This violates the spirit of the first clause because you have arranged to bypass the labor of judgment entirely rather than acknowledging a limitation of standing or capacity; you are outsourcing agency, not bridging an epistemic gap. In the seventh case, you rely on expert consensus. This fits the first clause as a humble acknowledgment of epistemic limitation, which is why it feels second-rate but not uneasy; you are not avoiding labor, you are acknowledging incapacity. In the eighth case, the testifier has maximal standing as the affected party, making the testimony robust under the first clause. In the ninth case, believing you are obligated to return the money fits the first clause as cautionary compliance, but believing you are permitted to keep it violates the second clause because permission functions as self-justification, which requires internal ownership of the reason.

  Now consider the three new cases you proposed. If a reliable medical intervention simply gave you the true moral belief with no testifier at all, the principle predicts this would be fine for action but uneasy for apology. Even though there is no testifier to distrust, the source of the belief is still external to your moral engagement. You would have the truth, but you would not have the grasp of the truth required for sincere expression, so the unease of case four would remain. If you read a careful letter you wrote to yourself at twenty-five after losing the thread of your own argument, the principle predicts this would be fine, even for apology. This is because you are reclaiming your own past agency; the reasoning is yours, even if currently inaccessible, so reading the letter restores your ownership of the value rather than substituting another's judgment. If a whole community testifies unanimously against what you believe, the principle predicts this depends on the stakes. For action guidance, you should defer under the first clause due to overwhelming epistemic pressure. For a stance constituting your identity or relationship to that community, you would feel deep unease if you adopted their view without understanding, because you would be dissolving your moral self into the collective without engagement.

  However, to be honest about where this principle forces you to revise your intuitions, I must point to two places where your verdicts likely conflict with the logic you are seeking. The first is case three. You say it is fine to believe the disliked colleague despite them being usually wrong about people. The principle suggests this should be uneasy unless the sexism was objectively obvious. If the colleague is unreliable, they lack the standing required for the first clause, and relying on them looks like moral laziness rather than deference to harm. You might need to admit that you feel fine there only because you suspect you could verify the claim easily if pressed, not because the testimony itself is sufficient. The second is case nine. You feel uneasy about believing permission but fine about believing obligation. Epistemically, these are identical structures of testimony. The principle suggests this asymmetry is psychological risk-aversion rather than a moral distinction; if testimony is good enough to restrict your freedom, it should be good enough to license it, provided the testifier has standing. You may need to give up the intuition that one is inherently more suspect than the other, or acknowledge that your unease is about fear of being caught making a mistake rather than about the morality of testimony itself.

  Ultimately, the residue you are calling unease is not about whether the belief is true. In case four, your partner is likely right that going through the phone was a betrayal. The unease is about whether the belief is yours. It is the difference between knowing a map is correct and knowing the terrain. When you apologize or justify yourself, you are claiming to know the terrain. When you act on testimony, you are following the map. Your discomfort arises when you try to use the map to prove you know the terrain. This is why the medical intervention case remains uneasy for apology; it gives you the map without the walk. It is why the letter case is fine; it is your own map from a previous walk. And it is why the community case is dangerous; it invites you to burn the map and follow the crowd, losing the terrain entirely. You are not failing to know; you are failing to own. And in morality, ownership is often the point.
