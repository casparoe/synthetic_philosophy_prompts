answer: |-
  # NUCLEAR STRATEGY DECISION TREE
  **Starting Premise:** *The state possesses a survivable second-strike capability.*

  ### THE BRANCHES
  **1. The Capability Test**
  Does a survivable arsenal deter attack *even if* leaders credibly swear never to use it?
  *   **YES** $\rightarrow$ Go to 2
  *   **NO** (Intent matters) $\rightarrow$ Go to 3

  **2. The Automation Fix**
  If capability is enough, should you remove human choice entirely (e.g., automated dead-hand systems) to guarantee it?
  *   **YES** $\rightarrow$ **LEAF: Automated Deterrence**
  *   **NO** $\rightarrow$ **LEAF: Existential Deterrence**

  **3. The Endgame**
  Is the long-term objective stable coexistence or total elimination of nuclear weapons?
  *   **ELIMINATION** $\rightarrow$ **LEAF: Abolitionism**
  *   **COEXISTENCE** $\rightarrow$ Go to 4

  **4. The Rationality Constraint**
  Is a threat to retaliate credible if execution ensures mutual self-destruction (fallout/climate)?
  *   **NO** (Threat is bluff) $\rightarrow$ **LEAF: No-First-Use + Conventional Defence**
  *   **YES** (Threat can be made credible) $\rightarrow$ Go to 5

  **5. The Sufficiency Threshold**
  Does an arsenal larger than ~100 survivable warheads add strategic value?
  *   **NO** (100 is enough) $\rightarrow$ **LEAF: Minimum / Countervalue Deterrence**
  *   **YES** (More buys options) $\rightarrow$ Go to 6

  **6. The Targeting Choice**
  Should plans prioritize destroying enemy cities or enemy military forces?
  *   **CITIES** $\rightarrow$ *Return to Minimum Deterrence (see Q5)*
  *   **FORCES** $\rightarrow$ Go to 7
  *(Note: Q5=YES + Q6=CITIES is an empty cell; see analysis)*

  **7. The Conventional Gap**
  Is nuclear first-use permissible to avert catastrophic conventional/chemical defeat?
  *   **NO** (Declare NFU) $\rightarrow$ **LEAF: Deliberate Ambiguity** (If undeclared) / **NFU** (If declared)
  *   **YES** $\rightarrow$ Go to 8

  **8. The Limited Use Goal**
  If using nukes first, is the objective military victory or forcing a negotiation pause?
  *   **VICTORY** $\rightarrow$ **LEAF: Counterforce / War-Fighting**
  *   **PAUSE** $\rightarrow$ **LEAF: Escalate-to-De-escalate**

  **9. The Brinkmanship Bet**
  Is deliberately raising the risk of accidental war a useful tool to signal resolve?
  *   **YES** $\rightarrow$ **LEAF: Brinkmanship (Schelling)**
  *   **NO** $\rightarrow$ **LEAF: Crisis Stability (Critics)**
  *(Applies to Leaves 7 & 8 primarily)*

  ***

  ### SCORING KEY & POSITION MAP

  | Answer Pattern | Strategic Position |
  | :--- | :--- |
  | **Q1=YES** | **Existential Deterrence** (Deterrence is a fact, not a policy) |
  | **Q1=YES, Q4=YES** | **Automated Deterrence** (The "Doomsday Machine" solution) |
  | **Q3=ELIMINATION** | **Abolitionism** (Deterrence is a temporary evil) |
  | **Q4=NO** | **No-First-Use + Conventional** (Nuclear threat is irrational/bluff) |
  | **Q5=NO** | **Minimum / Countervalue** (Punishment deterrent only) |
  | **Q5=YES, Q6=FORCES, Q8=VICTORY** | **Counterforce / War-Fighting** (Denial deterrent) |
  | **Q7=YES, Q8=PAUSE** | **Escalate-to-De-escalate** (Limited nuclear war) |
  | **Q7=UNDECLARED** | **Deliberate Ambiguity** (Uncertainty as the shield) |
  | **Q9=YES** | **Brinkmanship** (Risk manipulation is strategy) |
  | **Q9=NO** | **Crisis Stability** (Risk manipulation is suicide) |

  ***

  ### EMPTY CELLS & INDISTINGUISHABLE LEAVES

  **The "Overkill" Cell (Q5=YES + Q6=CITIES)**
  *Status: **Merely Unattractive**.*
  Claiming you need 1,000+ warheads solely to threaten cities implies diminishing returns so severe it undermines the logic of "sufficiency." No major school defends massive arsenals for purely countervalue aims.

  **The "Suicidal Aggressor" Cell (Q7=YES + Q4=NO)**
  *Status: **Incoherent**.*
  Planning first-use (Q7) while admitting retaliation is self-destructive/irrational (Q4) creates a contradiction. You cannot plan to execute a threat you admit is irrational to execute.

  **The "Existential Automator" Cell (Q1=YES + Q4=YES)**
  *Status: **Redundant**.*
  If mere possession deters (Q1), engineering an automated trigger is unnecessary cost/risk. This combination is theoretically possible but practically undefended.

  **Indistinguishable Leaves: Existential vs. Minimum**
  *Assessment: **Operationally Identical**.*
  Both prescribe small, survivable, countervalue arsenals and eschew war-fighting. The tree separates them on *philosophy* (Q1: Physics vs. Psychology), but in the real world, they advocate the same force posture.

  **Indistinguishable Leaves: Ambiguity vs. Escalate-to-De-escalate**
  *Assessment: **Rhetoric vs. Reality**.*
  Ambiguity is often the declared policy used to mask an Escalate-to-De-escalate operational plan. They occupy the same strategic space but differ in diplomatic transparency.

  ***

  ### ANALYST NOTE: THE TWO HEAVY LIFTERS

  **1. The Capability Test (Q1)**
  This does the most sorting work. It separates those who view nuclear weapons as *sociological objects* (their existence changes behavior regardless of intent) from those who view them as *tools of policy* (their utility depends on credible threats). This single branch divides the "Existential" school from everyone else.

  **2. The Rationality Constraint (Q4)**
  This separates the *Coercers* from the *Defensivists*. If you believe a self-destructive threat cannot be made credible, you are forced toward No-First-Use and conventional defense. If you believe commitment devices (or madness) can make it credible, you open the door to war-fighting, brinkmanship, and first-use doctrines. This is the fault line between stability and escalation.
