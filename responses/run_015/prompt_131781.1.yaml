answer: |-
  **JOINT STATEMENT ON THE SOCIALIST CALCULATION DEBATE**
  **Following the Adversarial Collaboration Workshop, Oxford, 14–16 October 2023**

  **Signatories:**
  *For the Austrian Critique:* J. H. Sterling
  *For the Lange Defence:* Dr. E. V. Corwin

  **Preamble**
  We entered this collaboration with opposing first principles regarding the feasibility of socialist economic planning. Through rigorous debate, we have isolated exactly where our models converge and where they fundamentally diverge. We agree that the twentieth-century framing of this debate was often imprecise. The following document records our shared findings and our irreconcilable differences, specifically regarding the nature of knowledge and the definition of calculation.

  ### I. Agreed Claims
  *Both parties affirm the following propositions as true:*

  1.  **Dispersed Knowledge:** Economic data is not given to any single mind in its totality. Information regarding local conditions, resource availability, and consumer preferences is inherently fragmented across time and space.
  2.  **The Function of Prices:** Prices are not merely accounting conveniences; they are essential signals that compress complex information regarding relative scarcity into a usable format for decision-makers.
  3.  **Requirements for Calculation:** Rational economic calculation requires a common denominator (a numéraire) to compare heterogeneous inputs and outputs. Without this, waste cannot be systematically identified.
  4.  **Incentive Compatibility:** Any allocation mechanism, whether market or plan, fails if the agents operating within it are not incentivised to reveal true information or to minimise costs.
  5.  **The Failure of Command:** We agree that the Soviet-style command economy, characterised by physical quotas and fixed prices without adjustment mechanisms, failed to solve the calculation problem.

  ### II. Table of Disagreements
  *Where we part company. Each statement is phrased to reflect the signatory's own theoretical commitment.*

  | Topic | The Austrian Critic (Sterling) | The Lange Defender (Corwin) |
  | :--- | :--- | :--- |
  | **Property Rights** | Private ownership of the means of production is a prerequisite for calculation. Without the risk of loss borne by an owner, price signals lack consequence and become 'play money'. | Legal title is secondary to control. A Central Planning Board (CPB) can simulate ownership by holding managers accountable to pricing rules, provided the political will exists to enforce efficiency. |
  | **The Discovery Process** | Prices emerge from a competitive discovery procedure driven by entrepreneurial judgment. They cannot be 'set' or 'found' without the actual exchange of property titles. | Prices are parameters. The CPB can announce prices, observe surpluses/shortages, and adjust iteratively (tâtonnement) until equilibrium is reached, mirroring the market outcome without the social cost of instability. |
  | **Tacit Knowledge** | Much knowledge is inarticulable (tacit) and only revealed through action. An algorithm cannot process what cannot be spoken or coded. | Tacit knowledge is simply uncodified data. With sufficient feedback loops and machine learning, an iterative system can infer preferences and constraints without requiring explicit articulation. |
  | **Error Correction** | Systemic errors in a plan accumulate because there is no bankruptcy mechanism to purge inefficient projects. Losses are socialised. | Systemic errors are corrected faster by a CPB because it has a global view of the economy and can redirect resources without the friction of market monopolies or strikes. |

  ### III. Cruxes and Pre-Registered Predictions
  *We identified two specific mechanisms where our theories make different empirical claims. We have agreed on cases to test these claims. Below are our pre-registered predictions.*

  #### Crux A: Iterative Auction Algorithms vs. Tacit Knowledge
  **The Question:** Can a centralised iterative algorithm capture the tacit knowledge held by dispersed entrepreneurs, or does the absence of private risk-taking blind the system to nuance?

  **The Case:** *The 2025–2027 National Logistics Re-routing Hypothetical.*
  A scenario where a major transport artery is closed unexpectedly, requiring rapid re-allocation of perishable goods across 5,000 independent nodes.
  *   **System 1 (Austrian):** Decentralised private firms rerouting via spot markets.
  *   **System 2 (Lange):** A Central Planning Board using an iterative auction algorithm to assign routing slots based on reported urgency and capacity.

  | Signatory | Prediction |
  | :--- | :--- |
  | **Sterling (Austrian)** | System 2 will fail to account for 'on the ground' workarounds (e.g., informal driver agreements, unofficial storage). The algorithm will optimise for reported data, leading to a 15% higher spoilage rate than System 1, because the tacit knowledge of the drivers cannot be input into the auction quickly enough. |
  | **Corwin (Lange)** | System 2 will outperform System 1 on equity and total waste. The algorithm will detect hoarding behaviour by private firms in System 1. By iterating prices every 4 hours, the CPB will stabilise the network faster, achieving a 10% lower cost variance, proving that price parameters can be adjusted without private title transfer. |

  #### Crux B: Ecological Feedback vs. Economic Calculation
  **The Question:** When a local manager adjusts production based on environmental limits (e.g., soil health, fish stocks), is this 'economic calculation' or merely 'adaptive drift'? Does it require market prices to be rational?

  **The Case:** *The Cornwall Fisheries Reset (Historical/Counterfactual Analysis).*
  Examining a 10-year period of quota management.
  *   **Scenario 1:** Quotas determined by tradable private property rights (ITQs).
  *   **Scenario 2:** Quotas determined by local co-ops reporting ecological data to a regional board, adjusting catch limits based on stock health feedback loops without trading rights.

  | Signatory | Prediction |
  | :--- | :--- |
  | **Sterling (Austrian)** | Scenario 2 is not calculation; it is adaptive drift. Without tradable rights, the co-ops will lack a capital value for the stock. They will overfish during political pressure points because there is no market mechanism to capitalise the future value of the fishery. Stock levels will collapse by year 8. |
  | **Corwin (Lange)** | Scenario 2 constitutes genuine calculation using ecological units as the numéraire. The feedback loop acts as a price signal. Because the local managers are not pressured by distant shareholders for quarterly returns, they will maintain stock stability better than Scenario 1, where rights are consolidated and exploited for short-term gain. Stock levels will remain stable. |

  **Signed,**

  J. H. Sterling
  *Dr. E. V. Corwin*
