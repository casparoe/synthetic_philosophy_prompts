prompt: |-
  I'm trying to decide whether to sign up for this cognitive enhancment study my neurologist mentioned, and it's making me question the whole therapy/enhancement boundry. Can you argue that the distinction basically collapses once you stop treating "normal functioning" as a natural kind and start seeing it as a statistical artifact we made up? Like, make the case that if we view the body as a self-authored project rather than a given, then fixing a deficit and boosting a trait are the same kind of act—just that therapy gets better PR because it sounds like restoration. Keep it grounded, no bibliographies, and don't lean on obscure philosophers I wouldn't know; I just want the reasoning spelled out.
