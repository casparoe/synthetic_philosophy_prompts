answer: |-
  **Interview framing**
  Our guest defends a strict anti-aggregationist position, arguing that in direct rescue scenarios, the number of lives at stake does not morally outweigh the claim of a single individual. This episode moves beyond the standard "save the one or the five" puzzle to examine how this view withstands probabilistic risk distributions and institutional triage protocols. We will press whether ignoring numbers violates equal concern and whether a consistent application collapses into an unmotivated deontology.

  **The question sequence**

  1.  **Primary:** You argue that aggregation is a category mistake in rescue ethics; precisely where does the logical error occur—is it in summing utilities, or in summing moral claims?
      **Follow-up:** If you concede it is claims that cannot be summed, why does the sheer volume of distinct claims not create a stronger moral reason to act, even if they remain separate?

  2.  **Primary:** Is the prohibition on aggregation grounded in the separateness of persons, or in the impossibility of comparing interpersonal losses?
      **Follow-up:** If it is the separateness of persons, does that distinction vanish when individuals are part of a defined group in a policy context, or does it hold universally?

  3.  **Primary:** Consider a probabilistic case: you can save one person with near-certainty or five people each with a one-in-five chance of survival. Do the numbers count here?
      **Follow-up:** If you choose the one, aren't you prioritizing certainty for an individual over the aggregate expected survival of the five, effectively reintroducing aggregation through risk assessment?

  4.  **Primary:** In that same scenario, saving the larger group lowers each individual's chance of survival compared to the single person. Does this reduction in individual probability justify ignoring the group size?
      **Follow-up:** If so, is your view actually about maximizing individual survival chances rather than respecting separate persons, which sounds consequentialist?

  5.  **Primary:** Since the expected number of survivors is identical in that probabilistic case, does your view imply we should be indifferent between the two options?
      **Follow-up:** If you are not indifferent, what moral weight are you assigning to the distribution of risk if not the number of people exposed to it?

  6.  **Primary:** Consider institutional triage algorithms used in disasters that explicitly rank groups by size to maximize lives saved. Is such an algorithm morally permissible?
      **Follow-up:** If you say no, are you committed to dismantling current emergency protocols even if it leads to higher overall mortality rates?

  7.  **Primary:** If such algorithms are impermissible, does that imply the institutions deploying them are morally corrupt, or merely mistaken?
      **Follow-up:** If they are merely mistaken, what is the correct algorithmic instruction: to flip a coin between a group of one and a group of five?

  8.  **Primary:** Critics argue ignoring numbers violates equal concern by treating each of the five as if they were the only one. How do you respond to the charge that this discounts the five?
      **Follow-up:** If equal concern requires giving each person a chance, why does a 50% chance for the One equal a 50% chance for the Group rather than a 10% chance per person?

  9.  **Primary:** Can you distinguish direct rescue from policy-level allocation without collapsing into an unmotivated deontology that privileges proximity?
      **Follow-up:** If the boundary is merely "direct presence," isn't that a morally irrelevant spatial distinction that fails to justify different moral rules?

  10. **Primary:** If your view implies we should let more people die to avoid aggregating claims, is this a cost you are willing to bear consistently across all contexts?
      **Follow-up:** At what point does the cost in lives render the principle untenable, even for a deontologist, without appealing to the very aggregation you reject?

  **Anticipated deflections and counter-moves**
  A common retreat is to restrict anti-aggregationism to face-to-face rescue while permitting aggregation in bureaucratic policy to avoid catastrophic outcomes. To block this, press for a principled moral difference between an individual actor and an institutional algorithm rather than a mere spatial distinction. If they claim institutions operate on different norms, demand an explanation of why the moral status of the victims changes based on the agent's job description. This forces them to either accept catastrophic policy implications or admit the view is context-dependent without foundational support.
