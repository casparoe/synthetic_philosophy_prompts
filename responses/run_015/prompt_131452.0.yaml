prompt: |-
  I am preparing an interview for my podcast, which examines hard cases in moral philosophy for a philosophically literate audience. Next week’s guest is a contemporary ethicist—unnamed here, but well known for defending a strict anti-aggregationist view in rescue ethics inspired by John Taurek’s argument that, in direct life-or-death choices, the numbers should not count. Rather than letting him restate the familiar pairwise-comparison thesis, I want questions that force him into less-charted territory: specifically, how his view handles probabilistic rescue scenarios in which saving the larger group lowers each individual’s chance of survival, and how it applies to institutional triage algorithms that implicitly weight group size in disaster-response protocols. I also want the interview to press the standard reply that ignoring numbers violates equal moral concern, and to test whether his position can distinguish direct rescue from policy-level allocation without collapsing into an unmotivated deontology.

  Please structure your response in the following sections, in this order. First, “Interview framing” (roughly 3 sentences): briefly describe the guest’s position and state the episode’s specific focus on probabilistic and institutional extensions of the anti-aggregationist view. Second, “The question sequence” (roughly 8 to 10 items): present each primary interview question followed immediately by a follow-up keyed to the reply a defender of this view is most likely to give. The sequence must include questions addressing: (i) the logical structure of pairwise comparison and exactly where aggregation is supposed to go wrong; (ii) the probabilistic rescue case—say, a choice between saving one person with near-certainty versus five people each with a one-in-five chance—where numbers seem intertwined with expected outcomes; (iii) institutional triage protocols that rank groups by size and expected survival, and whether the guest’s view implies these algorithms are morally corrupt; and (iv) the equal-concern objection that treating five lives as no weightier than one amounts to treating each of the five with less concern than the one. Third, “Anticipated deflections and counter-moves” (roughly 4 sentences): identify one or two standard retreat strategies—such as restricting the view to face-to-face rescue while allowing aggregation in bureaucratic allocation—and suggest concise, concrete ways for the interviewer to block that retreat and force a principled boundary rather than an ad hoc exception.
