prompt: |-
  You direct the curriculum review board at a museum of comparative genocide studies. Every quarter you receive proposals for new educational modules—lesson plans, exhibit texts, and short documentary scripts—that explain why ordinary people participated in mass killing. You need a reusable procedure your board (historians, educators, and one community representative without advanced historical training) can run consistently within a two-week review cycle, to decide whether a proposal's explanation of perpetrator behavior is defensible, oversimplified, or conceptually confused.

  Ground the procedure in the well-known historiographical tension between Christopher Browning's argument in Ordinary Men—situational and organizational pressures, including peer dynamics, career incentives, dehumanization of victims, and incremental escalation, can explain much killing without requiring deep prior ideological hatred—and Daniel Goldhagen's argument in Hitler's Willing Executioners—that a pervasive, culturally specific eliminationist antisemitism created a reservoir of willingness making ordinary Germans eager executioners rather than reluctant conformists.

  Design the procedure as an ordered protocol: the specific questions to ask at each stage, what counts as a sufficient answer, where the protocol stops with a clear "revise or reject," and where it must hand the decision to the board's values judgment rather than historical fact. The protocol must detect three hard errors: invoking peer pressure or bureaucratic compartmentalization without addressing whether victims were already dehumanized in the culture; invoking ideology without addressing whether organizational context was necessary to translate belief into action; and committing an additive-causation fallacy by listing situational and cultural factors side by side without specifying their interaction or temporal scale. Include explicit decision nodes for "explanatory flattening," where distinct levels of analysis are collapsed into interchangeable causes.

  Then apply the procedure to three proposals:

  1. A high-school lesson plan explaining Reserve Police Battalion 101's killings almost entirely through unit cohesion, fear of isolation, and bureaucratic routinization, mentioning antisemitic propaganda only as background noise.

  2. A documentary treatment arguing that local auxiliary forces in occupied territories killed primarily because they had long internalized an eliminationist worldview specific to their region, with organizational structure mentioned only as an incidental enabling condition.

  3. A museum panel text stating that "both situational pressure and cultural ideology caused the violence, and either one alone would have produced the same outcome," treating the two explanations as independent and interchangeable.

  In your applications, include at least one case where the procedure yields a verdict the board is likely to resist—such as rejecting a proposal that sounds balanced but collapses explanatory layers into an additive model. Also specify precisely what the procedure cannot do: which distinctions require expert historical judgment it cannot automate, and which normative questions (for example, whether emphasizing situational factors risks morally excusing perpetrators) lie outside its scope and must be flagged for separate deliberation.

  Present the deliverable as a reusable checklist with decision nodes, not as an essay about the debate. Mark every hand-off point explicitly.
reasoning: |-
  Here's a thinking process that leads to the suggested curriculum review protocol:

  1.  **Analyze the Request:**
      *   **Role:** Director of the Curriculum Review Board at a Museum of Comparative Genocide Studies.
      *   **Task:** Create a reusable procedure (protocol/checklist) for reviewing educational module proposals (lesson plans, exhibits, scripts) regarding perpetrator behavior.
      *   **Audience:** Board members (historians, educators, one community rep without advanced training).
      *   **Timeline:** Two-week review cycle.
      *   **Core Theoretical Framework:** The tension between Christopher Browning (*Ordinary Men*: situational/organizational factors) and Daniel Goldhagen (*Hitler's Willing Executioners*: cultural/ideological factors).
      *   **Specific Requirements:**
          *   Ordered protocol with specific questions.
          *   Criteria for sufficient answers.
          *   Stop nodes (Revise/Reject).
          *   Hand-off points (Values judgment vs. Historical fact).
          *   Detection of three "Hard Errors":
              1.  Situational factors without dehumanization context.
              2.  Ideology without organizational context.
              3.  Additive-causation fallacy (listing factors without interaction/temporal scale).
          *   Detection of "Explanatory Flattening" (collapsing distinct levels of analysis).
          *   Application to three specific proposals (Browning-heavy, Goldhagen-heavy, Additive-heavy).
          *   Include a verdict the board might resist (e.g., rejecting the "balanced" additive one).
          *   Specify limitations (what the procedure *cannot* do).
          *   Format: Reusable checklist with decision nodes (not an essay).

  2.  **Deconstruct the Theoretical Tension (Browning vs. Goldhagen):**
      *   *Browning:* Focuses on the *how*. Peer pressure, obedience to authority, war context, incremental radicalization. Ordinary men become killers due to situation. Ideology exists but isn't the primary driver for *everyone*.
      *   *Goldhagen:* Focuses on the *why*. Deep-seated "eliminationist antisemitism" in German culture. Ordinary men killed because they *wanted* to, based on shared cultural beliefs. Structure facilitated, but didn't create, the will.
      *   *Synthesis/Modern Consensus:* Most historians agree it's complex. Ideology creates the *permission* and *target*, structure creates the *opportunity* and *mechanism*. Ignoring one leads to distortion.
      *   *The "Hard Errors":*
          1.  *Situational Only:* Ignores that peer pressure works differently if the victim is seen as human vs. subhuman.
          2.  *Ideological Only:* Ignores that belief needs a state apparatus to become mass killing (otherwise it's just prejudice).
          3.  *Additive:* "A + B = C" without explaining how A enables B or vice versa.

  3.  **Drafting the Protocol (The "Perpetrator Causality Review Protocol" - PCRP):**
      *   *Structure:* Needs to be linear, with clear "Pass/Fail" gates.
      *   *Phase 1: Initial Screening (Hard Errors).* Quick check for the three specific logical fallacies requested.
      *   *Phase 2: Causal Mechanism Analysis.* Digging into the Browning/Golding tension.
      *   *Phase 3: Explanatory Flattening Check.* Ensuring levels of analysis (individual, organizational, cultural) aren't mixed up.
      *   *Phase 4: Values Hand-off.* Where history ends and ethics begin (e.g., moral exoneration risks).
      *   *Formatting:* Checkboxes, Decision Nodes (STOP/PROCEED/HAND-OFF).

  4.  **Developing the Decision Nodes:**
      *   Need to define what counts as "Sufficient."
      *   Need to define where the Community Rep vs. Historians have veto power.
      *   Need to ensure the "Additive Fallacy" is caught (Proposal 3).

  5.  **Applying the Protocol to the Three Proposals:**
      *   *Proposal 1 (Browning-heavy):* Lesson plan on Reserve Police Battalion 101. Focus: Peer pressure/routinization. Weakness: Antisemitism as "background noise."
          *   *Verdict:* Likely "Revise." Fails Hard Error #1 (Situational without dehumanization context). Peer pressure doesn't explain killing *specifically* of Jews without the racial context.
      *   *Proposal 2 (Goldhagen-heavy):* Documentary on Auxiliaries. Focus: Eliminationist worldview. Weakness: Structure as "incidental."
          *   *Verdict:* Likely "Revise." Fails Hard Error #2 (Ideology without organizational context). Belief doesn't equal mass killing without the chain of command/logistics.
      *   *Proposal 3 (Additive):* Panel text. "Both caused it, either alone would work."
          *   *Verdict:* **Reject.** This is the one the board might resist because it sounds "balanced." But it commits Hard Error #3 (Additive-causation) and Explanatory Flattening. It implies redundancy that didn't exist.

  6.  **Refining the Limitations Section:**
      *   What can't this checklist do?
      *   It can't verify specific historical facts (dates, names).
      *   It can't decide on "moral comfort" (e.g., does this make visitors feel too safe?).
      *   It can't replace deep archival research.

  7.  **Review against Constraints:**
      *   *Two-week cycle:* The protocol must be efficient.
      *   *Community Rep:* Needs clear language, not just jargon.
      *   *Hand-off points:* Must be explicit.
      *   *Format:* Checklist/Protocol, not essay.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the distinction between "Hard Error" and "Explanatory Flattening" clear?
      *   *Fix:* Define Hard Errors as missing links. Define Flattening as treating different *types* of causes (structural vs. cultural) as the *same kind* of cause.
      *   *Critique:* Make sure the "Values Judgment" hand-off is clear. Historians decide truth; the Board decides appropriateness.
      *   *Critique:* Ensure the verdict on Proposal 3 is strong, as requested ("likely to resist").

  9.  **Final Polish:** Check tone (administrative, authoritative, precise). Ensure all specific prompt requirements (three hard errors, specific proposals, limitations) are met. (Self-check: Did I include the specific Browning/Goldhagen tension? Yes. Did I include the three specific proposals? Yes.)

  10. **Final Output Generation** (Proceeding to generate the response based on these steps).
