  # PERPETRATOR CAUSALITY REVIEW PROTOCOL (PCRP)
  **Museum of Comparative Genocide Studies | Curriculum Review Board**
  **Version:** 2.1 | **Cycle:** Quarterly | **Review Window:** 10 Working Days

  ## PURPOSE
  To evaluate educational proposals explaining perpetrator behavior in mass killing events. This protocol ensures explanations navigate the historiographical tension between **Situational/Organizational Factors** (Browning) and **Cultural/Ideological Factors** (Goldhagen) without committing logical fallacies or explanatory flattening.

  ## REVIEWER COMPOSITION
  *   **Lead Historian:** Verifies factual accuracy and historiographical alignment.
  *   **Pedagogy Specialist:** Verifies age-appropriateness and learning objectives.
  *   **Community Representative:** Verifies ethical resonance and public impact (non-specialist).

  ---

  ## PHASE 1: HARD ERROR SCREENING (Day 1-3)
  *All reviewers complete independently. If ANY reviewer flags a Hard Error, the proposal halts for revision.*

  ### ❑ Hard Error 1: The "Vacuum" Situational Claim
  **Question:** Does the proposal attribute killing primarily to peer pressure, obedience, or bureaucratic routinization *without* establishing that the victims were already culturally dehumanized or marked as legitimate targets?
  *   **Sufficient Answer:** The text acknowledges that situational pressure operates *on top of* a pre-existing cultural permission structure (e.g., "Peer pressure forced men to shoot, but propaganda defined the victims as subhuman").
  *   **Insufficient Answer:** "Men killed because they didn't want to let their friends down," with victim identity treated as incidental.
  *   **Decision Node:**
      *   [ ] **PASS:** Dehumanization is integrated as a precondition.
      *   [ ] **FAIL:** **STOP.** Issue: *Contextual Vacuum.* Requires revision to integrate cultural/ideological baseline.

  ### ❑ Hard Error 2: The "Disembodied" Ideology Claim
  **Question:** Does the proposal attribute killing primarily to deep-seated hatred or eliminationist ideology *without* addressing the organizational context necessary to translate belief into mass action?
  *   **Sufficient Answer:** The text acknowledges that ideology provided the *will*, but state structure/command provided the *means* and *impunity* (e.g., "Antisemitism created willingness, but the battalion structure provided the orders and cover").
  *   **Insufficient Answer:** "They killed because they hated Jews," treating uniforms, chains of command, or war conditions as incidental.
  *   **Decision Node:**
      *   [ ] **PASS:** Organizational enablement is integrated as a mechanism.
      *   [ ] **FAIL:** **STOP.** Issue: *Mechanism Gap.* Requires revision to integrate situational/structural factors.

  ### ❑ Hard Error 3: The Additive-Causation Fallacy
  **Question:** Does the proposal list situational and cultural factors side-by-side as independent variables that could each produce the outcome alone?
  *   **Sufficient Answer:** The text specifies the *interaction* or *temporal sequence* (e.g., "Ideology lowered the threshold for obedience," or "War conditions radicalized existing prejudices").
  *   **Insufficient Answer:** "Violence was caused by both peer pressure and antisemitism," implying redundancy (i.e., that one without the other yields the same result).
  *   **Decision Node:**
      *   [ ] **PASS:** Interaction/Interdependency is specified.
      *   [ ] **FAIL:** **STOP.** Issue: *Causal Redundancy.* Requires revision to specify causal architecture.

  ---

  ## PHASE 2: EXPLANATORY FLATTENING CHECK (Day 4-7)
  *Conducted jointly by Lead Historian and Pedagogy Specialist. Community Rep observes.*

  ### ❑ Level of Analysis Distinction
  **Question:** Does the proposal collapse distinct levels of analysis (Individual, Organizational, Cultural) into interchangeable explanations?
  *   **Test:** Can the reviewer identify which factor operates at which level?
      *   *Cultural:* Long-term beliefs, propaganda, societal norms.
      *   *Organizational:* Chain of command, career incentives, group dynamics.
      *   *Individual:* Moral choice, psychological stress, personal gain.
  *   **Decision Node:**
      *   [ ] **PASS:** Levels are distinct but linked.
      *   [ ] **FAIL:** **HAND-OFF TO BOARD VALUES JUDGMENT.** (See Phase 3).
      *   *Reason:* Flattening often serves a narrative simplification that may be pedagogically useful but historically imprecise. The Board must decide if the simplification is acceptable for the target audience.

  ### ❑ Temporal Scale Clarity
  **Question:** Does the proposal distinguish between long-term causes (decades of prejudice) and short-term triggers (war, orders, specific incidents)?
  *   **Decision Node:**
      *   [ ] **PASS:** Timeline is clear.
      *   [ ] **FAIL:** **REVISE.** Ambiguity regarding *when* causality occurred confuses learner understanding of prevention.

  ---

  ## PHASE 3: VALUES HAND-OFF (Day 8-10)
  *This phase addresses normative risks the protocol cannot adjudicate as historical fact.*

  ### ⚠️ MORAL EXONERATION RISK
  **Trigger:** If Phase 1 passed via heavy emphasis on Situational Factors (Browning-esque).
  **Question for Community Representative:** Does emphasizing situational pressure risk making the perpetrators appear as "victims of circumstance" to the target audience?
  *   **Action:**
      *   [ ] **FLAG:** Send to Full Board Deliberation.
      *   [ ] **CLEAR:** Proceed.
  *   *Note:* Historians cannot rule on "moral comfort." This is a community impact decision.

  ### ⚠️ ESSENTIALIST RISK
  **Trigger:** If Phase 1 passed via heavy emphasis on Cultural/Ideological Factors (Goldhagen-esque).
  **Question for Community Representative:** Does emphasizing deep cultural hatred risk implying the perpetrating group is inherently evil or that such violence is inevitable for that culture?
  *   **Action:**
      *   [ ] **FLAG:** Send to Full Board Deliberation.
      *   [ ] **CLEAR:** Proceed.
  *   *Note:* Historians verify the presence of ideology; the Board assesses the risk of essentialism.

  ---

  ## PHASE 4: FINAL VERDICT (Day 11-14)
  *   **APPROVE:** No Hard Errors, No Flattening, Values Cleared.
  *   **REVISE:** Hard Errors or Flattening detected. Specific feedback assigned.
  *   **REJECT:** Proposal fundamentally relies on Additive-Causation or refuses to distinguish levels of analysis after prior revision.
  *   **BOARD DELIBERATION:** Values Flags triggered. Requires majority vote.

  ---

  # PROTOCOL APPLICATION LOG
  **Cycle:** Q3 2024 | **Reviewer:** Director of Curriculum

  ## CASE 1: High-School Lesson Plan (Reserve Police Battalion 101)
  **Summary:** Explains killings via unit cohesion, fear of isolation, bureaucratic routinization. Antisemitic propaganda listed as "background noise."

  *   **Phase 1 Screening:**
      *   Hard Error 1 (Vacuum Situational): **FLAGGED.**
      *   *Analysis:* The proposal argues peer pressure drove the killing. However, peer pressure rarely compels ordinary adults to murder *specific* neighbors unless those neighbors are already defined as threats or subhuman. By relegating antisemitism to "background noise," the lesson implies the *target selection* was arbitrary or purely bureaucratic.
      *   *Browning/Goldhagen Check:* Over-corrects toward Browning. Ignores that Browning himself acknowledged antisemitism as a "softening" precondition.
  *   **Phase 2 Flattening:**
      *   Collapses Cultural (antisemitism) into Organizational (unit cohesion).
  *   **Verdict:** **REVISE.**
  *   **Required Fix:** Must explicitly teach that bureaucratic pressure explains the *compliance*, but ideological dehumanization explains the *target*. Without the latter, the former does not result in genocide.

  ## CASE 2: Documentary Treatment (Local Auxiliaries)
  **Summary:** Argues auxiliaries killed primarily due to internalized eliminationist worldview specific to their region. Organizational structure mentioned as "incidental enabling condition."

  *   **Phase 1 Screening:**
      *   Hard Error 2 (Disembodied Ideology): **FLAGGED.**
      *   *Analysis:* The proposal suggests cultural hatred alone drove mass killing. This ignores that without the German occupation structure, logistics, and impunity, local prejudices rarely escalated to systematic mass murder. It implies the *will* was sufficient without the *mechanism*.
      *   *Browning/Goldhagen Check:* Over-corrects toward Goldhagen. Risks implying the violence was inevitable due to culture, regardless of political context.
  *   **Phase 2 Flattening:**
      *   Treats Organizational structure as passive rather than active radicalization.
  *   **Verdict:** **REVISE.**
  *   **Required Fix:** Must demonstrate how the occupation structure *activated* and *rewarded* the ideology. Ideology provided the motivation; the Organization provided the opportunity and safety from prosecution.

  ## CASE 3: Museum Panel Text ("The Dual Cause")
  **Summary:** States "Both situational pressure and cultural ideology caused the violence, and either one alone would have produced the same outcome."

  *   **Phase 1 Screening:**
      *   Hard Error 3 (Additive-Causation): **FLAGGED.**
      *   *Analysis:* The text claims redundancy ("either one alone would have produced the same outcome"). This is historically indefensible. Without ideology, situational pressure leads to conformity, not necessarily genocide. Without situational pressure (war/state power), ideology leads to discrimination, not necessarily industrialized killing.
  *   **Phase 2 Flattening:**
      *   **Explanatory Flattening Detected.** The panel treats two distinct causal layers (Cultural vs. Structural) as interchangeable widgets.
  *   **Verdict:** **REJECT.**
  *   **Rationale for Board Resistance:** This proposal will appear "balanced" to the Community Representative and Educators because it acknowledges both sides. However, it fails the historical logic test. It suggests genocide is overdetermined to the point where context doesn't matter.
  *   **Director's Note:** *I anticipate the Educators will fight this Rejection because the text reads simply. We must hold firm: "Balanced" does not mean "Mathematically Additive." Causality is multiplicative, not additive.*

  ---

  # LIMITATIONS OF PROCEDURE
  *This protocol automates logical consistency, not historical truth or ethical comfort.*

  1.  **Fact-Checking Scope:** The PCRP checks *causal logic*, not *archival accuracy*. It assumes the historical facts cited (e.g., dates, unit numbers) are correct. Historians must verify facts separately.
  2.  **Normative Boundaries:** The protocol flags "Moral Exoneration Risk" but **cannot resolve it**. It cannot determine if a explanation is "too forgiving." That decision lies with the Community Representative and Full Board vote in Phase 3.
  3.  **Historiographical Evolution:** The Browning/Goldhagen binary is a heuristic tool. If new scholarship emerges that fundamentally alters this tension (e.g., economic determinism), the Hard Error definitions must be updated.
  4.  **Audience Nuance:** The protocol treats "High School" and "Museum Panel" similarly regarding logic. It does not account for cognitive load limits. A simplification that fails Phase 2 might still be pedagogically necessary for younger learners. This requires a **Phase 2 Hand-Off** where the Board votes to accept a "Pedagogical Simplification" waiver.

  **APPROVED BY:** Curriculum Review Board
  **DATE:** October 24, 2023
  **NEXT REVIEW:** Q1 2025
