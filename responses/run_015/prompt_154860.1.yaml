      *   **We-mode (Collective Intentionality):** Associated with philosophers like John Searle, Raimo Tuomela, Margaret Gilbert. Requires a primitive "we-intend" that isn't reducible to "I-intend." Often implies a level of shared consciousness or normative commitment.
