answer: |-
  # TAXONOMY: IS HISTORY LOCKED IN?

  **ROOT QUESTION:** If you replayed the tape of human history with one small change (e.g., Battle of Actium, British coal locations), do macro-level outcomes (industrial capitalism, liberal democracy) still arrive?

  ## BRANCH 1: YES (Convergence / Structural Attractors Exist)
  *Macro-outcomes are robust; perturbations dampen over time.*

  ### 1.1 Geographic / Environmental Constraints
  *   **Position Name:** Geographic Determinism
  *   **Concrete Case:** British industrialism was inevitable because coal seams were located near waterways, regardless of who won the Civil War.
  *   **Most Awkward Commitment:** Implies human agency is merely epiphenomenal to geology; cultures cannot innovate around resource scarcity.
  *   **Separation Flag:** **Collapses** into *Institutional Functionalism* (1.2) if one argues geography only matters because it selects for efficient institutions rather than dictating outcomes directly.

  ### 1.2 Functional Selection on Institutions
  *   **Position Name:** Institutional Functionalism
  *   **Concrete Case:** Industrial capitalism arises everywhere because it is the most efficient method for resource allocation, outcompeting feudalism regardless of cultural starting points.
  *   **Most Awkward Commitment:** Assumes inefficient societies always die out; cannot explain the survival of persistently "sub-optimal" political forms.
  *   **Separation Flag:** **Separates** cleanly from *Geographic Determinism* (1.1) only if social selection pressures are distinct from physical environmental constraints, though they often overlap in practice.

  ### 1.3 Normative Retro-justification
  *   **Position Name:** Teleological Whiggism
  *   **Concrete Case:** Liberal democracy is the "end of history" because it is morally superior, so any path that survived must have been leading here.
  *   **Most Awkward Commitment:** Confuses the victor's survival with moral necessity; cannot account for viable futures that were simply outcompeted by violence.
  *   **Separation Flag:** **Collapses** into sophistry unless paired with (1.1) or (1.2); without a causal mechanism, this is historiographical bias rather than a theory of change.

  ## BRANCH 2: NO (Divergence / Path-Dependance is Real)
  *Macro-outcomes are fragile; perturbations amplify or solidify.*

  ### 2.1 Sensitive Dependence on Initial Conditions
  *   **Position Name:** Strong Contingency (Chaos-Style)
  *   **Concrete Case:** Whether liberal democracy arrives depends on the specific sequence of revolutions; a single assassination changes the ideological trajectory permanently.
  *   **Most Awkward Commitment:** Makes historical prediction impossible; implies large-scale structural forces (like economics) can be wiped out by butterfly effects.
  *   **Separation Flag:** **Separates** from *Institutional Sedimentation* (2.2) because this relies on randomness at the start, whereas 2.2 relies on rigidity later in the timeline.

  ### 2.2 Irreversible Institutional Lock-in
  *   **Position Name:** Institutional Sedimentation
  *   **Concrete Case:** The Meiji Restoration succeeded in escaping lock-in, but most states cannot reform once legal/economic tracks are set (e.g., QWERTY keyboards, legal codes).
  *   **Most Awkward Commitment:** Claims societies cannot reform once a track is set, even when the current path is visibly failing or catastrophic.
  *   **Separation Flag:** **Collapses** into *Strong Contingency* (2.1) if the "lock-in" is itself the result of an earlier chaotic event; they are often two phases of the same path-dependance process.

  ---

  ## META-ANNOTATIONS & LOGICAL VOIDS

  **⚠️ LOGICALLY EMPTY COMBINATION: Chaos-Style Divergence + Normative Retro-justification**
  *   **Why Empty:** You cannot claim an outcome was morally necessary (Normative) if you simultaneously argue the outcome depended on chaotic, random initial conditions (Chaos). If the tape rewinds differently, the "moral endpoint" disappears, invalidating the normative claim.

  **💡 NICHE INJECTION: Causal vs. Semantic Path-Dependance**
  *   **Distinction:** Within Branch 2, we must distinguish whether the path matters because of *mechanical inertia* (Causal: switching costs are too high) or because of *meaning construction* (Semantic: later generations interpret early events as foundational myths that cannot be questioned).
  *   **Application:** The British coal seams are *Causal* path-dependance (physical infrastructure); the American Constitution is *Semantic* path-dependance (sacred text that constrains interpretation regardless of efficiency).

  **⚠️ COLLAPSE WARNING: Branch 1.3 (Normative) & Branch 2.1 (Chaos)**
  *   These two leaves are mutually exclusive. If you hold 2.1, you cannot hold 1.3. If you hold 1.3, you must deny 2.1. A seminar participant claiming both is occupying a logically empty space.
