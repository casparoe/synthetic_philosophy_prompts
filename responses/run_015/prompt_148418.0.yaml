      *   Make sure the "Impact on Civic-Duty Analogy" clearly states that Voting and Jury Duty are grouped together *against* the "wearing buttons" analogy, thereby saving them from the charge of irrationality together.

      *(Self-Correction during drafting)*: I should check if Step (1) is a better candidate. Many economists reject (1) by arguing $P \times B$ isn't the only metric (ethical voting). However, the prompt specifically builds the trap through the *expressive* argument (3-6). Breaking the expressive parity (5) is more internal to the logic provided than challenging the probability math in (1). Step (5) is the logical pivot that creates the *reductio*.

