      *   *Impact on Civic-Duty Analogy:* The analogy to jury duty/taxes *survives and strengthens*. Jury duty and taxes are also institutional/legal obligations, distinct from private symbolic acts. If we fix (5) by acknowledging institutional weight, voting aligns *with* jury duty/taxes, not with wearing buttons.
      *   *Alternative Repair:* Distinguish between "Expressive Acts" (private) and "Constitutive Acts" (public/institutional). Rationality includes fulfilling role-obligations defined by the institution one benefits from.

  6.  **Refining the Argument regarding Step (8):**
      *   The user asks: "Does rejecting the step you identify forces me to give up the analogy to jury duty and tax compliance in (8)?"
      *   If I reject (5) because voting is *institutional*, then voting is *more like* jury duty and taxes (which are also institutional) and *less like* wearing a button.
      *   So, rejecting (5) actually *saves* the analogy in (8) but changes the conclusion of (8). Instead of proving they are all irrational, it proves they are all *sui generis* institutional obligations that cannot be reduced to instrumental calculus + private expression.
