      *   **Context:** The user is working on a problem in democratic theory derived from rational-choice reasoning (specifically the Paradox of Voting).
      *   **The Argument:** A 10-step formalized argument concluding that voting (and by extension, all civic obligations) lacks individual rational justification, leading to an absurdity (reductio ad absurdum).
