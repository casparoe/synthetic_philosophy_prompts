      Let's refine the "Impact" column to be precise: The analogy survives as a grouping of *institutional obligations*, but fails as a grouping of *statistically negligible acts* justifying irrationality. Actually, simpler: The analogy holds, but it vindicates jury duty/taxes alongside voting, rather than condemning them.

      Wait, looking at Step (8): "Apply the same structure...". If the structure is broken at (5), you *cannot* apply the same structure to jury duty. So the *application* of the analogy fails, but the *intuition* that voting and jury duty are similar is correct for a different reason (institutional duty). I will phrase this carefully.

      *Revised plan for Table Row:*
