answer: |-
  There is no standard, single-term label in the literature for this specific asymmetry. It is usually buried within broader critiques of Kripkean origin essentialism or discussions of biological individuality.

  For your seminar, I propose the term **"Gametic Exceptionalism."**

  This labels the specific metaphysical move that grants *gametic/zygotic origin* necessary status while demoting *immediate post-zygotic causal conditions* (like epigenetic marking or microbiome colonization) to contingent status, despite their comparable causal weight in determining the resulting organism's traits.

  Here is the conceptual carving you asked for, mapping the boundaries and distinctions.

  ### 1. The Carving: Historical Individuation vs. Constitutive Realization

  The asymmetry you notice isn't necessarily "sloppy." It rests on a specific distinction between two types of identity conditions:

  *   **Historical Individuation (The Gametic View):** This treats identity as a matter of *lineage*. You are *this* organism because you are the continuous physical descendant of *this* specific fusion event. The sperm and egg are the "parents" of the substance. In this view, identity is transitive and historical. If you change the history, you change the substance.
  *   **Constitutive Realization (The Epigenetic/Microbiome View):** This treats identity as a matter of *functional specification*. You are *this* person because you possess *this* specific cognitive and biological architecture. Since gut bacteria and epigenetic markers determine that architecture, changing them changes the "realization" of the person.

  **Gametic Exceptionalism** is the doctrine that *Historical Individuation* trumps *Constitutive Realization* at the moment of conception. It draws a hard metaphysical line at the zygote. Everything causally prior to the zygote (gametes) is essential; everything causally subsequent (even by 48 hours) is accidental.

  **Why it feels like an asymmetry:** You are correctly identifying that from a *causal* perspective, the zygote and the early epigenetic environment are part of the same continuous causal chain. From a *metaphysical* perspective, Gametic Exceptionalism treats the start of the chain as magical (essential) and the continuation of the chain as mundane (contingent).

  ### 2. Is it Sloppy Essentialism?

  It is not merely sloppy; it is a commitment to **Biological Animalism**.

  If you hold that you are essentially a *human organism* (Animalism), then Gametic Exceptionalism makes sense. An organism is individuated by its reproductive beginning. The gut bacteria are *parts* or *environmental features* of the organism, not the organism itself. The epigenetic markers are *states* of the organism, not its *substance*.

  *   **Sloppy Essentialism** would be saying "You must come from these parents" but "It doesn't matter if you come from this zygote." That is inconsistent.
  *   **Gametic Exceptionalism** is consistent *if* you believe substances are individuated by their genesis, not their properties.

  **The Vulnerability:** The view becomes "sloppy" only if you claim personal identity is tied to *psychological continuity* or *cognitive traits*. If "you" are your mind, and the mind is determined by epigenetics/microbiome, then treating those as accidental while treating the zygote as essential is indeed inconsistent. Gametic Exceptionalism only holds water if you are a Biological Essentialist, not a Psychological Essentialist.

  ### 3. Distinction: Gametic Exceptionalism vs. Standard Origin Essentialism

  *   **Standard Origin Essentialism (Kripke):** The broad thesis that the origin of a thing is essential to it. (e.g., This table could not have been made from different wood).
  *   **Gametic Exceptionalism:** A specific *subset* of Origin Essentialism that arbitrarily limits "Origin" to the *gametic fusion* and excludes the *developmental niche*.

  **The Boundary:** Standard Origin Essentialism asks, "Could this entity have started differently?" Gametic Exceptionalism answers, "It could not have started from different gametes, but it could have started with different methylation patterns."
  **The Difference:** Gametic Exceptionalism requires a justification for why the "origin" stops at the cell membrane of the zygote and does not include the immediate biochemical environment that activates the zygote. It treats the *container* (DNA source) as essential but the *initial configuration* (Epigenetics) as accidental.

  ### 4. Distinction: Gametic Exceptionalism vs. The Non-Identity Problem

  This is the most crucial distinction for your seminar.

  *   **The Non-Identity Problem (Parfit):** This is an **ethical** problem about harm and responsibility. It asks: If an action (e.g., conceiving later) causes a *different* child to be born, have we harmed the child? (Answer: No, because without that action, *this* child wouldn't exist). It relies on Origin Essentialism to establish that the child is different.
  *   **Gametic Exceptionalism:** This is a **metaphysical** claim about the *scope* of origin.

  **The Divergence:**
  In the Non-Identity Problem, changing the time of conception changes the *sperm/egg combination*. Therefore, under Gametic Exceptionalism, it is a *different person*.
  In your scenario (microbiome/epigenetics), changing the conditions does *not* change the sperm/egg combination. Therefore, under Gametic Exceptionalism, it is the *same person* with different traits.

  **Why this matters:** Parfit uses the Non-Identity Problem to show that "Person A" vs. "Person B" distinctions lead to counterintuitive ethical results. You are using Gametic Exceptionalism to show that "Person A" vs. "Person A-with-different-traits" distinctions lead to counterintuitive *metaphysical* results.
  *   Parfit: Different Origin $\rightarrow$ Different Person $\rightarrow$ No Harm.
  *   You: Same Origin + Different Early Causal Conditions $\rightarrow$ Same Person $\rightarrow$ (Implied) Deep Alteration of Self.

  You are challenging the intuition that "Same Zygote = Same Self." Parfit accepts "Same Zygote = Same Self" but worries about the ethics of creating that zygote.

  ### 5. Summary for the Seminar

  If you need to present this sharply, use this triad:

  1.  **The Doctrine:** **Gametic Exceptionalism**. The view that gametic fusion is the sole necessary condition for personal identity, excluding immediate post-zygotic causal determinants.
  2.  **The Conflict:** It privileges **Historical Individuation** (where you came from) over **Constitutive Realization** (what built you). It creates a "Metaphysical Cliff" at the moment of fertilization where causal necessity turns into metaphysical contingency.
  3.  **The Critique:** It is only defensible under **Biological Animalism**. If personal identity is linked to psychology or cognitive capacity, Gametic Exceptionalism is unsustainable, because the "psychological self" is more dependent on epigenetics/microbiome than on the specific DNA sequence of the zygote.

  This framing allows you to attack the view not as "sloppy," but as a category error between *substance identity* and *trait constitution*.
