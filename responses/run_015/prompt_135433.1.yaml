          *   *AI Implication:* Weak. LLMs don't have mental images anyway, but this doesn't prove they *can't* refer, just that images aren't enough. It doesn't rule out text-based reference if other conditions are met.
          *   *Causal vs. Community:* Neither really. It's about internal qualia.

      *   **Item (b): The Standard Causal-Historical Reading (Twin-Earth).**
          *   *Idea:* Reference to natural kinds requires a causal chain linking the token to the actual substance (H2O).
          *   *Status:* Substantive/Defensible (within causal theories), but contested by descriptivists.
