  1. The scenario
  In a controlled sleep clinic, Subject 42 undergoes polysomnography while monitored for REM density. EEG data reveals distinct REM sleep cycles interrupted by thirty-millisecond alpha-wave intrusions—micro-arousals too brief for behavioral awakening but sufficient to trigger cortical coherence. Upon morning waking, Subject 42 reports a vivid, linear narrative: chasing a blue train through a dark tunnel. Semantic fragments like "blue" and "train" correspond to sensory stimuli presented during pure REM phases, yet the syntactic structure linking them aligns precisely with the timing of the alpha intrusions. No observer accesses content during sleep, yet the subject claims continuous experience. The setup isolates whether narrative coherence arises from the sleeping state itself or the stitching provided by these fleeting transitions.

  2. The verificationist reading
  The verificationist denies Subject 42 underwent an experience with determinate content during REM sleep. For Malcolm, "I dreamed" expresses a current impression upon waking, not a description of a past inner event. Since no public criterion exists to verify content while asleep, the claim lacks truth conditions during the night. The micro-arousals do not establish experiential presence because they remain sub-behavioral; they are detectable but do not constitute the waking consciousness required to fix meaning. Thus, the report's coherence is irrelevant to the sleep state itself. The dream exists only as the telling, not as a lived sequence during REM. Physiological data cannot substitute for the linguistic criteria necessary to validate the experience as occurring *during* sleep.

  3. The narrative-construction reading
  The narrative-constructionist affirms that Subject 42 underwent an experience with determinate content. For Dennett, consciousness is a functional narrative assembled from drafts. The micro-arousals provide the necessary editorial moments where semantic fragments are stitched into a coherent draft. This stitching confirms the model because it shows the dream is not a passive movie watched during REM, but an active construction utilizing brief access to waking-like cognitive resources. The content becomes determinate exactly when the stitching occurs, during the sleep period. Thus, the experience is real, compressed and edited via alpha intrusions, validating the view that the narrative *is* the experience generated through these transitions.

  4. The isolating feature
  The diverging feature is micro-arousal stitching. This variable provides the minimal cognitive access required for narrative assembly without full awakening. If removed, leaving only pure REM with no alpha intrusions, the syntactic coherence would lack a physiological correlate. For the verificationist, this changes nothing; without waking criteria, there is still no experience. For the constructionist, however, removing stitching removes the mechanism of determinacy. Without the editorial moments, the narrative lacks a point of fixation. Consequently, the opposition collapses into agreement that no determinate content existed during sleep. The stitching is the sole pivot allowing the constructionist to affirm content generation while the verificationist denies it.

  5. The best attack
  The verificationist's strongest response is to reject the physiological data as philosophically irrelevant. They argue EEG patterns are merely third-person correlations lacking first-person meaning. Even if stitching occurs, unless the subject is fully awake to verify the content publicly, the "experience" remains a theoretical posit. This maintains logical consistency but ignores the clinic's explanatory data. It preserves the stance by stipulating that only full behavioral wakefulness counts, ignoring the nuanced continuum of consciousness revealed by the micro-arousals. This defense isolates the theory from empirical evidence, succeeding formally while losing plausibility.
