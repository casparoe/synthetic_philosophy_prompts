answer: |-
  # Signal Assessment Protocol: Jeffrey-Kinematics (Spreadsheet Edition)

  **Version:** 1.0  
  **Owner:** Signal Assessment Team Lead  
  **Audience:** Team Members, Deputy Director, External Reviewers  
  **Constraint:** Spreadsheet implementation only; max 30 minutes per case.

  ## 1. The Partition (Step 1)
  Do not start with the hypothesis ("Is the pest established?"). Start with the signal. You must define the four cells of uncertainty before entering any numbers. In your spreadsheet, create a table with these four rows for every case:

  1.  **Signal Valid & Pest Established**
  2.  **Signal Valid & Pest Not Established**
  3.  **Signal Invalid & Pest Established**
  4.  **Signal Invalid & Pest Not Established**

  *   **Signal Valid ($E$):** The photograph is the pest; the sequence is a match; the report is accurate.
  *   **Signal Invalid ($\neg E$):** The photograph is a lookalike; the sequence is contamination; the report is rumour.
  *   **Pest Established ($H$):** The pest is breeding and self-sustaining in the region (the regulatory threshold).
  *   **Pest Not Established ($\neg H$):** The pest is absent, or present only as a transient interception.

  **Action:** In Column A of your worksheet, tick which cells are *possible*. If "Signal Invalid & Pest Established" is impossible (i.e., a false alarm cannot coexist with a real infestation elsewhere), mark it 0. Usually, all four are possible.

  ## 2. The Double-Count Check (Step 2)
  You cannot use an expert's probability directly as the "shift" ($P_{new}(E)$) if they have already folded in the prior probability of the pest.

  **The Script:** When an expert (e.g., the pathologist) gives a number (e.g., "70% sure"), ask this exact question and record the answer in Column B:
  > *"If I told you this pest was biologically impossible in this region, would your confidence number change?"*

  *   **If YES:** The number is contaminated by the prior. **Do not use it.** Ask instead: *"Ignoring where we are, how sure are you this image shows the organism?"* Use *that* number as $P_{new}(E)$.
  *   **If NO:** The number is pure signal confidence. Use it as $P_{new}(E)$.
  *   **If they cannot answer:** Cap $P_{new}(E)$ at 0.5 (no information gain) and flag for escalation.

  ## 3. The Rigidity Test (Step 3)
  Jeffrey's Rule requires **rigidity**: the relationship between the signal and the hypothesis must not change during the update. If the context alters the *meaning* of a positive signal, the rule fails.

  **The Test:** In Column C, answer Yes/No to:
  > *"Has the technical reliability of this signal type changed this week (e.g., new lab kit, new trap design, new analyst)?"*

  *   **If NO:** Rigidity holds. Proceed to Step 4.
  *   **If YES:** Rigidity fails. **Stop.** Do not update the probability. Revert to last week's prior ($P_{old}$). Mark the case "Baseline Reset Required" and escalate to the Senior Epidemiologist. You cannot mathematically update on a moving target.

  ## 4. Calculation and Vagueness (Step 4)
  If Rigidity holds, calculate the new probability ($P_{new}(H)$) using the simplified Jeffrey formula derived for this partition.

  **Inputs:**
  *   $P_{old}$: Last week's published number (Column D).
  *   $P_{new}(E)$: Expert signal confidence from Step 2 (Column E).
  *   $K$ (Consequence Factor): If the signal is valid, how likely is *establishment* (not just presence)? (Column F).
      *   *Guidance:* For a single find of a notifiable pest, $K$ is rarely 1.0. A single find suggests *presence*, not necessarily *establishment*. Default $K = 0.8$ unless evidence suggests a breeding population.
      *   *Vague Inputs:* If the expert says "somewhat more likely" or gives a range (e.g., 60–80%), enter the **lower bound** (0.6) for $P_{new}(E)$ and $K$. This biases towards regulatory caution.

  **Formula (Column G):**
  $$P_{new}(H) = (K \times P_{new}(E)) + (P_{old} \times (1 - P_{new}(E)))$$

  **Publishing the Number:**
  *   If the inputs were precise: Round $P_{new}(H)$ to two decimal places.
  *   If the inputs were vague (bands): Calculate the result using the lower bounds. Publish this number. In the "Notes" column, record the upper bound calculation. If the gap between lower and upper bound exceeds 0.20, escalate.

  ## 5. Escalation (Step 5)
  The procedure hands the decision to the Senior Epidemiologist if:
  1.  Rigidity Test fails (Step 3).
  2.  The calculated shift ($|P_{new}(H) - P_{old}|$) exceeds 0.25 in a single week.
  3.  The "Double-Count Check" reveals the expert cannot separate signal from prior.

  ---

  ## Case Runs (Last Fortnight)

  ### Case 1: The Photograph (Pathologist 70%)
  *   **Prior ($P_{old}$):** 0.15
  *   **Partition:** Signal = Photo ID.
  *   **Step 2 (Double-Count):** Pathologist asked: *"If pest was impossible here, would your 70% change?"* She admitted: *"Yes, I wouldn't have looked so closely."*
      *   *Correction:* She is re-questioned on morphology only. New $P_{new}(E) = 0.80$.
  *   **Step 3 (Rigidity):** No change in camera or taxonomy. **Pass.**
  *   **Step 4 (Calc):**
      *   $K$ (Establishment given valid photo): 0.9 (Single find, but high-risk pest).
      *   $P_{new}(E)$: 0.80.
      *   $P_{old}$: 0.15.
      *   Calculation: $(0.9 \times 0.80) + (0.15 \times 0.20) = 0.72 + 0.03 = 0.75$.
  *   **Output:** Publish **0.75**.
  *   **Reviewer Note:** The jump from 0.15 to 0.75 is >0.25. **Escalate.** The number is theoretically sound, but the magnitude requires senior sign-off.

  ### Case 2: Partial Sequencing (New Lab Kit)
  *   **Prior ($P_{old}$):** 0.20
  *   **Partition:** Signal = Sequence Match.
  *   **Step 2 (Double-Count):** Lab lead confirms 95% confidence in the match *identity*. $P_{new}(E) = 0.95$.
  *   **Step 3 (Rigidity):** Question: *"Has technical reliability changed?"*
      *   *Fact:* Laboratory switched to a more sensitive kit this week.
      *   *Answer:* **Yes.** The false-positive rate of the *system* is now unknown relative to historical data. The link between "Sequence Match" and "Establishment" is not rigid.
  *   **Action:** **Rigidity Fails.**
  *   **Output:** **0.20** (No change).
  *   **Reviewer Note:** This is the unwelcome answer. Despite a 95% confident sequence, the probability does not move. The procedure dictates that you cannot update on evidence whose diagnostic weight is in flux. This must be flagged to the Senior Epidemiologist to validate the new kit's baseline before the signal can be used for probability updates.

  ### Case 3: Mixed Soft Items (Press, Trap, Negatives)
  *   **Prior ($P_{old}$):** 0.10
  *   **Partition:** Signal = Bundle of three items.
  *   **Step 2 (Double-Count):**
      *   Press report: Machine translated. $P(E)_{press} = 0.4$ (Vague).
      *   Trap specimen: Degraded to genus. $P(E)_{trap} = 0.5$ (Vague).
      *   200 Negatives: High confidence in absence *if* pest were common.
      *   *Aggregation:* We treat the bundle as one signal. The negatives heavily weight the "Invalid" partition. Team consensus on $P_{new}(E)$ for the *bundle* is "Somewhere between 0.3 and 0.5".
      *   *Rule:* Use lower bound. $P_{new}(E) = 0.3$.
  *   **Step 3 (Rigidity):** No technical changes. **Pass.**
  *   **Step 4 (Calc):**
      *   $K$: 0.5 (Soft evidence rarely confirms establishment alone).
      *   $P_{new}(E)$: 0.3.
      *   $P_{old}$: 0.10.
      *   Calculation: $(0.5 \times 0.3) + (0.10 \times 0.7) = 0.15 + 0.07 = 0.22$.
      *   *Vagueness Check:* Upper bound calculation (using 0.5 for $P_{new}(E)$ and 0.6 for $K$) yields 0.37.
      *   Gap: $0.37 - 0.22 = 0.15$. (Acceptable, <0.20).
  *   **Output:** Publish **0.22**.
  *   **Reviewer Note:** The negatives prevented a higher shift. The single number represents the conservative estimate of the band.

  ---

  ## What This Procedure Cannot Do

  1.  **It cannot validate the expert.** If the pathologist is confidently wrong about the morphology, the procedure outputs a confidently wrong probability. It only ensures the *math* of the update is consistent, not that the *inputs* are true.
  2.  **It cannot handle dependent signals.** If the press report and the trap specimen are not independent (e.g., the trapper went because of the report), the procedure treats them as a single "Bundle" to avoid double-counting, which loses granularity.
  3.  **It cannot force Rigidity.** As seen in Case 2, if the real world changes the rules (new lab kit), the procedure forces you to publish no change. This protects you from mathematical error, but it does not help you make a decision. That decision belongs to the Senior Epidemiologist.
  4.  **It distinguishes Theory from Judgment.**
      *   *Theory Constraints:* The formula in Step 4; the Rigidity requirement in Step 3; the Double-Count separation in Step 2. These are non-negotiable if you claim to use Jeffrey's Rule.
      *   *Judgment Calls:* The value of $K$ (Consequence Factor); the aggregation of soft signals in Case 3; the threshold for escalation (0.25). These are policy choices dressed as steps to ensure consistency.

  **Final Instruction:** Save this protocol as `Signal_Assessment_v1.xlsx`. Lock the formula cells. Require a text entry in the "Reviewer Notes" column for every case.
