answer: |-
  You have hit upon the central frustration in modern decision theory: everyone argues about which agent walks away with the most money, but they rarely agree on the rules of the game. To rank these theories, we must first agree on what a decision theory is actually *for*. Is it a guide to action, a definition of rationality, or an engineering specification for building an agent?

  Before setting out the desiderata, I must briefly tidy your reconstruction of the puzzles, as the specific payoffs determine which theory 'wins'. In the standard **Counterfactual Mugging**, Omega flips a coin. If Tails, he asks for £100. If Heads, he gives you £10,000 *if and only if* he predicted you would have paid the £100 had the coin come up Tails. The tension is that paying on Tails loses you money in the actual world, but having the disposition to pay gains you money in the counterfactual Heads world. In **XOR Blackmail**, the predictor sends a letter demanding £1,000 if and only if (you have termites XOR you will pay). If you pay, the letter implies you have termites. If you refuse, the letter implies you are termite-free. EDT pays to make the 'good news' inference; CDT and FDT refuse because the payment cannot causally remove termites.

  With those setups standardised, here are the desiderata for an adequate decision theory.

  ### The Desiderata

  **1. Instrumental Success (The 'Winning' Criterion)**
  *   **Requirement:** The theory must prescribe actions that lead to the highest expected utility for the agent over the long run.
  *   **Motivating Case:** *Newcomb's Problem.* One-boxers take £1,000,000; two-boxers take £1,000. A theory that tells you to two-box is arguably failing to get you the money, even if the reasoning sounds sensible.
  *   **Status:** **Genuine Demand.** If a decision theory systematically leaves money on the table that another theory picks up, it is defective as a guide to getting what you want.

  **2. Causal Sanity (No Magical Thinking)**
  *   **Requirement:** The theory must not treat actions as influencing events that are already causally settled, merely because those actions are correlated with the events.
  *   **Motivating Case:** *The Smoking Lesion.* A genetic lesion causes both a desire to smoke and lung cancer. Smoking itself does not cause cancer. EDT refuses to smoke because smoking is evidence of the lesion (and thus cancer). CDT smokes because the act doesn't cause the cancer.
  *   **Status:** **Genuine Demand.** A theory that tells you to avoid smoking to prevent cancer, when smoking has no causal power over cancer, is engaging in superstition. It turns agents into wish-thinkers.

  **3. Dynamic Consistency (No Self-Defeat)**
  *   **Requirement:** The theory must not prescribe a plan that the agent will have an incentive to abandon later, leading to a worse outcome than if they had never made the plan.
  *   **Motivating Case:** *Counterfactual Mugging / Parfit's Hitchhiker.* In Hitchhiker, you promise to pay a driver £1,000 once he saves you. Once saved, CDT says "don't pay, the ride is already done." But if the driver predicts this, he never picks you up. You need a theory that binds your future self to your past commitments.
  *   **Status:** **Genuine Demand.** If a theory makes you the kind of agent that others (or predictors) cannot trust, you will be excluded from beneficial cooperative arrangements.

  **4. Exploitation Resistance (No Money Pumps)**
  *   **Requirement:** The theory must not allow an adversary to cycle the agent through a series of trades that leave them strictly worse off than where they started.
  *   **Motivating Case:** *Preference Cycles.* If you prefer A to B, B to C, and C to A, a cunning trader can sell you A for B, B for C, C for A, charging a fee each time.
  *   **Status:** **Genuine Demand.** This is a basic requirement of coherence. However, in decision theory, this often extends to not being exploited by predictors who model your source code.

  **5. The Dominance Principle (The 'Past is Fixed' Intuition)**
  *   **Requirement:** If Action A yields a better outcome than Action B in every possible state of the world, you ought to choose A, regardless of the probability of those states.
  *   **Motivating Case:** *Newcomb's Problem (CDT view).* Whether the box contains £1,000,000 or £0, taking both boxes always yields £1,000 more than taking one. Therefore, you should take both.
  *   **Status:** **Camp Prejudice.** This looks like a logical truth, but it is actually a CDT-specific intuition. It assumes the state of the world (the box content) is independent of your choice. In problems with predictors, this independence assumption fails. Demanding this principle is smuggling in a causal worldview as a neutral rule.

  ### The Incompatibility: The Impossible Triangle

  Here is the result you are looking for. You cannot satisfy all the genuine desiderata simultaneously. There is a fundamental tension between **Causal Sanity** and **Instrumental Success** in the presence of logical predictors, mediated by **Dynamic Consistency**.

  Specifically, **The Dominance Principle** is incompatible with **Instrumental Success** in Newcomb-like problems.
  *   If you obey Dominance (CDT), you two-box and lose the £1,000,000. You satisfy Causal Sanity but fail Instrumental Success.
  *   If you maximise Expected Utility (EDT/FDT), you one-box and win the £1,000,000. You satisfy Instrumental Success, but EDT violates Causal Sanity (in the Smoking Lesion case), while FDT walks a tightrope between them.

  The deeper conflict is between **Local Causal Efficacy** and **Global Policy Optimisation**.
  *   **Local Causal Efficacy:** "My action right now can only change the future, not the past or logical facts." (CDT)
  *   **Global Policy Optimisation:** "I should act as the output of a function that, if generalised, yields the best results across all possible worlds I might be in." (FDT)

  You cannot have a theory that refuses to pay the blackmail (because the past is fixed) *and* pays the mugging (because the policy matters). In XOR Blackmail, paying makes the news good (EDT style) but doesn't change the termites. In Counterfactual Mugging, paying changes the logical output of your algorithm in the counterfactual branch (FDT style).
  *   If you demand **"Never pay for merely good news"** (Causal Sanity), you fail Counterfactual Mugging.
  *   If you demand **"Never leave free money on the table"** (Instrumental Success), you must sometimes pay for merely good news or act as if you control the past.

  There is no free lunch. A theory that wins in Newcomb and Mugging (FDT) must accept that your decision can be logically correlated with events you did not causally influence. A theory that respects strict causal boundaries (CDT) must accept that it will be poorer in a world full of predictors.

  ### Brief Evaluation of the Theories

  **Causal Decision Theory (CDT)**
  *   **Performance:** Satisfies Causal Sanity and Dominance perfectly. It never engages in magical thinking.
  *   **Failure:** Fails Instrumental Success in Newcomb, Mugging, and Hitchhiker cases. It is dynamically inconsistent; it makes plans it refuses to keep once the causal leverage is gone. It is easily exploited by predictors who model its source code.
  *   **Verdict:** Robust in a physical world, fragile in a logical world.

  **Evidential Decision Theory (EDT)**
  *   **Performance:** Satisfies Instrumental Success in Newcomb and Mugging. It gets the money.
  *   **Failure:** Violates Causal Sanity. In the Smoking Lesion case, it tells you to refrain from smoking to avoid cancer, which is superstitious. It treats news as a lever. It can also be 'money-pumped' in specific setups where it pays to manipulate correlations that don't exist.
  *   **Verdict:** Wins the money, but loses its mind. It cannot distinguish between causing an outcome and merely signalling it.

  **Functional Decision Theory (FDT)**
  *   **Performance:** Attempts to split the difference. It satisfies Instrumental Success in Newcomb and Mugging (like EDT) but respects Causal Sanity in the Smoking Lesion (like CDT). It treats your decision as the output of a mathematical function; if that function outputs 'Pay', it outputs 'Pay' in all logically identical instances, including the predictor's simulation.
  *   **Failure:** It violates the Dominance Principle and the intuition that 'the past is fixed'. It requires you to act as if you have control over logical facts established before you were born. It is also computationally demanding, requiring you to model the logical dependence between your brain and the predictor's.
  *   **Verdict:** The strongest contender for 'winning', but only if you accept that logical correlation is a form of control. It demands you abandon the intuition that you are physically isolated from the past.

  ### Summary

  If your priority is **Causal Sanity**—the feeling that you cannot reach back in time to move the coins in the box—then CDT is the only adequate theory, and you must accept that you will be poorer in a universe with predictors.

  If your priority is **Instrumental Success**—actually walking away with the utility—then you must adopt FDT (or EDT in limited cases), and you must accept that 'control' extends beyond physical causation into logical correlation.

  The wall you have run into is not a lack of clarity in the theories, but a conflict in your own values. You cannot simultaneously demand that an agent never act on mere correlation *and* that an agent never lose to a predictor who exploits that demand. You must choose whether rationality is about keeping your hands causally clean, or about getting the best result.
