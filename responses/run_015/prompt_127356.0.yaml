prompt: |-
  Me and two friends got completely stuck on the Knobe chairman case last night and I need a referee. You know it: the chairman approves a program that'll raise profits and harm the environment as a side effect, says he doesn't care at all about the environment, and most people then say he harmed it intentionally. In the version where the side effect is good — the program helps the environment, and he says he doesn't care about that either — far fewer people say he intentionally helped. Sam and Nina then argued about what that shows.

  Sam: it shows the folk concept of intentional action is already moralised. The blame judgment is upstream, so intentionality can't do the job of a neutral descriptive input to responsibility, and if intuitions about something this basic move with moral valence, that's bad news for leaning on intuitions anywhere in philosophy.

  Nina: no. "Intentionally" is just doing its normal job of flagging that an agent is answerable for something he should have cared about and didn't. The descriptive questions — did he foresee it, could he have acted otherwise — are untouched. We're reporting a different fact, not contaminating one.

  Sam: then why does it show up in small kids and in a pile of unrelated languages?
  Nina: a use that's universal isn't a quirk of English.

  Then I threw in a case neither of them had thought about and it split them worse. Same chairman, except now he's under a legal duty to improve the environment, the program will in fact help it as a side effect, and he says he doesn't care about helping. Sam: rigged — you've smuggled morality back in through the duty, so of course people will moralise, and that tells us nothing about the original case. Nina: that's exactly the point, the original case has a background norm too, and maybe the whole asymmetry just tracks the asymmetry between duties not to harm and duties to help. Sam: if that's right, the effect was never about intentional action at all.

  Can you go through that move by move and tell me who's right about what? And what would actually settle it — what would you ask people, and what pattern of answers would tell you which of their stories is the true one?
