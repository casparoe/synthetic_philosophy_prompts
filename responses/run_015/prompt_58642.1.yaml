      *   **Colleague's Argument:** Appeals to the "No Free Lunch" (NFL) theorem to reject principled preference for simpler models. Claims all algorithms do equally well averaged over *every conceivable labeling* of unseen cases, so simplicity/past success don't predict generalization.
