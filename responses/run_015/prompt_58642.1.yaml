      *   *Thesis 2 (Epistemological/Metaphysical):* We have no reason to believe the real world (pneumonia X-rays) is not one of the "random" functions where learning fails. (False/Unwarranted skepticism).
      *   *Thesis 3 (Methodological):* Therefore, simplicity biases (Occam's Razor) or empirical risk minimization are unjustified without further assumptions. (True in a vacuum, false in practice where assumptions hold).
