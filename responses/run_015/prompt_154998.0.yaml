  **SOCIETY FOR PSYCHICAL RESEARCH**
  **INTERNAL MEMORANDUM No. 442-B**
  **DATE:** 14 November 1893
  **FROM:** Dr. E. Vance, Secretary, Committee on Ethical Metaphysics
  **TO:** The Council, Sub-Committee on Hauntings
  **SUBJECT:** Procedural Framework for the Moral Assessment of Apparitions

  **1. PREAMBLE**
  Following the Chairman's directive regarding the fiscal allocation for the upcoming quarter, the Committee on Ethical Metaphysics has established a rubric to determine which spectral phenomena warrant financial support. It is the position of this sub-committee that investigation funds should not be expended on manifestations lacking moral coherence. To this end, we have adapted the tripartite framework of rational conduct to the post-mortem condition. All grant applications regarding hauntings must now be scored against the following criteria.

  **2. THE CONTINUITY COEFFICIENT (CC)**
  Before ethical calculation can commence, the entity must be deemed a moral agent. We introduce the Continuity Coefficient, a metric ranging from 0.0 to 1.0, measuring the preservation of personal identity following somatic death. A CC below 0.4 suggests the apparition is merely a psychic echo or a telepathic projection lacking sufficient selfhood to hold interests. If the ghost cannot be confirmed as the same entity as the deceased person (e.g., it fails to recognize its own burial plot), it possesses no moral standing. Funds are hereby withheld for any case where the CC is indeterminable, as one cannot negotiate duty with a metaphor.

  **3. METHOD OF EGOISM (SPECTRAL SELF-INTEREST)**
  Per the first method of rational conduct, we must assess whether the manifestation serves the prudent interest of the agent. Does the haunting advance the ghost's own good? Cases involving the mere repetition of traumatic death scenes score poorly, as they indicate a lack of prudential reasoning and offer no benefit to the spirit. However, apparitions seeking to locate lost testamentary documents or secure posthumous reputation demonstrate rational self-interest. High scores in this category justify funding, as the Society aids a rational agent in maximizing their own enduring welfare.

  **4. METHOD OF UTILITARIANISM (OBSERVER HEDONICS)**
  The second method requires the calculation of general happiness among the living observers. A poltergeist phenomenon, while energetically potent, often induces terror and property damage, resulting in a net deficit of pleasure. Conversely, a benevolent manifestation that comforts grieving widows or reveals the location of hidden heirlooms increases the aggregate happiness of the sitters. The Committee advises that funding be prioritized for hauntings where the ratio of living satisfaction to living fright exceeds 2:1. We are not in the business of subsidizing unnecessary dread.

  **5. METHOD OF INTUITIONISM (MANIFEST DUTY)**
  Finally, we consider the common-sense moral obligations inherent to the situation. Regardless of consequences, does the apparition fulfill an intuitive duty? A spirit haunting a murderer to induce confession satisfies a duty of justice, even if the process causes temporary distress to the living. A spirit haunting a rival merely out of spite violates the duty of benevolence. Cases must be evaluated on whether the manifestation aligns with what right reason would dictate were the agent still flesh-bound.

  **6. RECOMMENDATION**
  Applications regarding the Borley Rectory phenomena are currently denied funding. Preliminary assessment indicates a low Continuity Coefficient (0.3), negligible Spectral Self-Interest (the monk appears to gain nothing), and a negative Utilitarian score (the tenants are excessively distressed). We shall redirect resources to the Kensington Séance Circle, where the manifestations demonstrate high Intuitionist duty regarding the settlement of estates.

  Please adjust the ledger accordingly.

  **Dr. E. Vance**
  Secretary, Committee on Ethical Metaphysics
