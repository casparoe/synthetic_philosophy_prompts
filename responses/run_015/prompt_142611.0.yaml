answer: |-
  Your rule creates a **semi-order** (Luce, 1956). You are correct that strict preference ($A$ better than $B$ by ≥5) is transitive. However, **indifference is not**. If $A=10, B=14, C=18$, then $A$ ties $B$ and $B$ ties $C$, but $A$ is worse than $C$. Since you fill the post from a "top set" based on ties, this breaks your selection process. You cannot partition candidates into equivalence classes; the "tie" relation is not an equivalence relation.

  Is 5 points right? Only if it matches the rubric's **measurement error**. If the rubric is precise, imposing a margin arbitrarily discriminates against candidates within the gap. If scores are noisy, the margin should reflect that noise level, not an arbitrary philosophical fix.

  Is this the standard solution? In measurement theory, yes, semi-orders model vague preference. Philosophically, it doesn't solve the Sorites paradox; it operationalizes intransitive indifference. For hiring, treating "not better than" as a genuine tie is unsafe here. Instead, use raw scores for ranking and use the margin only to trigger committee review for close candidates, rather than defining equivalence classes. This avoids the intransitive tie problem while respecting score uncertainty.
