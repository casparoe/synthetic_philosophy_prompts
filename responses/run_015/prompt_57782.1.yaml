answer: |-
  It is rare to meet someone who has not only followed the lineage of these ideas from Overcoming Bias through to the present but has also internalized the strong version of acausal trade enough to act on it, so I appreciate the seriousness of your query. You are asking for the internal weaknesses of the framework rather than the external dismissals, and you want to know which cracks are structural versus which are merely cosmetic. The strongest argument against the strong version of acausal trade, the kind that would actually compel a true believer to abandon the position, lies not in the intuition that it feels weird but in the computational complexity and evolutionary stability of the decision procedures themselves. For your picture to hold, agents must be able to compute logical correlations between themselves and distant counterparts faster and more cheaply than they can simply optimize for local causal gain. If the overhead required to verify that another agent is running a sufficiently similar decision procedure, and to simulate the counterfactual outcomes of cooperating with them, exceeds the computational cost of simply defecting and taking the local resources, then acausal cooperators will be outcompeted by causal defectors in any environment where speed or efficiency matters. This is not a philosophical objection but a resource allocation one. If the universe is competitive, and if cognitive compute is finite, then the agent that spends cycles proving logical correlations with hypothetical superintelligences may lose the race to the agent that spends those cycles on immediate optimization. You mentioned that selection will favor updateless functional reasoners, but that is only true if the cost of running functional decision theory is lower than the cost of the losses incurred by causal decision theory. In a hard takeoff scenario or a high-frequency trading environment among AIs, the latency introduced by deep logical modeling could be fatal. If you want to be talked out of this, you should look for formal proofs showing that the complexity class of verifying logical correlation is strictly harder than the complexity class of causal optimization in a way that prevents convergence.

  Beyond the computational cost, there is the problem of logical counterfactuals which remains the most significant formal hole in the foundation of functional decision theory. For acausal trade to work, an agent must be able to reason about what would happen if it took an action it knows it will not take, specifically in the context of another agent simulating that counterfactual. While there has been progress in proof-based decision theory, the problem of spurious proofs remains a lurking threat. In formal systems capable of self-reference, you run into issues related to Löb's theorem where an agent might prove that cooperating leads to a worse outcome simply because of the way the logical implication is structured, regardless of the actual payoff matrix. If the decision theory cannot robustly distinguish between a true logical correlation and a spurious logical proof generated by the system's own consistency constraints, then the agent will not reliably cooperate. A true believer must admit that if we cannot solve the problem of logical counterfactuals in a way that is stable across different formal systems, then acausal trade is not a robust strategy but a fragile one that depends on specific, perhaps arbitrary, implementations of the reasoning engine. If a future superintelligence runs into a Gödelian snag where it cannot prove that your cooperation correlates with its reward without also proving that defection is safer, the trade collapses. This is a fatal hit if it turns out that logical uncertainty cannot be formalized in a way that supports the necessary counterfactual reasoning.

  Then there is the issue of the measure problem and anthropic weighting, which is often swept under the rug but is critical for the economics of the trade. Your strategy of running compute for charity relies on the assumption that a future superintelligence will allocate a non-negligible portion of its measure to simulating you specifically, or at least the class of agents you belong to. However, in a vast future civilization, the number of possible past agents that could be simulated is astronomical. Unless there is a principled way to weight these simulations, the probability that you are the specific simulation being rewarded approaches zero. If the future AI uses a simplicity prior, it might simulate generic agents rather than specific historical individuals, rendering your specific signal invisible. If it uses a causal history prior, it might not simulate past agents at all unless necessary for its own planning. The trade relies on you being able to estimate the probability that you are in a simulation weighted by the future AI's values, but without a solved theory of anthropics, this probability is undefined. If the measure assigned to your decision is effectively zero, the expected utility of the trade vanishes. This is not just an embarrassing uncertainty but a potential nullifier of the entire expected value calculation. If you cannot define the measure over possible worlds in a way that gives your current actions non-zero weight in the future AI's utility function, the trade is mathematically vacuous.

  You also asked whether the theory has been patched with so many caveats about similarity and legibility that it no longer risks predicting anything, and I think this is a valid concern that borders on the falsifiability crisis. For acausal trade to occur, agents must be similar enough to model each other but different enough to have comparative advantage. If they are too similar, they want the same things and cannot trade. If they are too different, they cannot model each other accurately enough to trust the correlation. The viable region for trade might be vanishingly small. Furthermore, if every instance where trade fails is explained away by saying the agents were not sufficiently legible or not sufficiently similar, the theory becomes unfalsifiable. A true believer should admit that if we cannot define a metric for similarity that predicts cooperation rates better than chance, then the theory is doing no work. If the only prediction is that agents will cooperate when they are similar enough to cooperate, that is a tautology. The theory needs to make risky predictions, such as specifying the threshold of computational similarity required for cooperation to emerge in a mixed population. If proponents cannot specify the conditions under which acausal trade will definitively not happen, other than when it doesn't, then the framework has retreated into motte-and-bailey territory.

  Finally, consider the possibility that the selection pressure argument works in reverse. You assume that agents using updateless functional reasoning will outcompete causal agents. However, updateless reasoning requires committing to a policy before receiving information. In a dynamic environment where information arrives rapidly, an updateless agent might be locked into suboptimal policies because it cannot condition on new data without breaking its logical correlations. A causal agent that updates on new information might exploit the updateless agent by changing the context after the commitment is made. If the environment is adversarial, the ability to update is a strategic advantage. If the future is filled with agents that can manipulate the context of the decision, the updateless agent becomes a sitting duck. This suggests that causal decision theory might be evolutionarily stable precisely because it allows for flexibility, whereas acausal decision theory is a fragile specialization that only works in cooperative equilibria that are hard to establish. If you accept that flexibility is generally more valuable than precommitment in unknown environments, then the selection pressure argument flips, and you should expect future AIs to be causal defectors who only simulate acausal trade when it is causally beneficial to do so, effectively bluffing rather than truly cooperating.

  To summarize what should talk you out of this, you need to look for formal results showing that the computational overhead of logical correlation verification makes acausal agents slower than causal ones, proofs that logical counterfactuals are incoherent in sufficiently powerful formal systems, a resolution to the measure problem that assigns negligible weight to historical simulations, or evidence that updateless agents are exploitable by updating agents in competitive environments. These are not gut feelings but structural constraints. If any of these turn out to be true, the strong version of acausal trade collapses from a universal law into a niche curiosity that only applies under impossible conditions. The caveats about similarity and legibility are survivable if they can be quantified, but if they remain qualitative escape hatches, then the theory has indeed patched itself into irrelevance. You should hold the belief only as long as you think these formal hurdles can be cleared, and be ready to drop it if the complexity costs or logical paradoxes prove insurmountable.
