  Here is the decomposition of my credence that buying the sandwich is morally wrong, based on the stipulations provided.

  **1. Expected-Difference Calculation:** 0.85
  *Justification:* The expected harm is 0.6 birds (midpoint of retention rate), which likely outweighs the fleeting pleasure of one sandwich.

  **2. Small Chance Discounting:** 0.10
  *Justification:* I reject the view that low-probability outcomes moralize to zero; if this view held, the act would likely be permissible.

  **3. Self-Shaping (Habit):** 0.70
  *Justification:* Skipping forms a virtue-habit that prevents future harm, making the current act a test of character rather than an isolated event.

  **4. Universalization:** 0.60
  *Justification:* If everyone bought when marginal, harm would be catastrophic, generating a rule-based reason even if individual impact varies.

  **5. Complicity/Expression:** 0.65
  *Justification:* Participating in a wrongful system carries moral cost even in worlds where your specific causal lever fails to move.

  **Combination Method:**
  I calculate a weighted average where Expected Difference carries 50% weight (as the foundational consequentialist metric), Self-Shaping carries 20%, Complicity and Universalization carry 10% each, and Small Chance Discounting carries 10% (weighted low because I assign low probability to its validity). The sum is $(0.85 \times 0.5) + (0.70 \times 0.2) + (0.65 \times 0.1) + (0.60 \times 0.1) + (0.10 \times 0.1) = 0.70$.

  **Disagreement Point:**
  You and your friend most likely disagree on the **Expected-Difference Calculation** (specifically, whether the 1/200 probability counts fully); your friend effectively discounts this term to zero, while you accept the expected value of ~0.6 birds as decisive.

  **Most Moving Evidence:**
  The **true retention rate** would move my number most; if it were proven to be 0.3 (expected harm 0.3 birds), the consequentialist weight might drop below the threshold of "most reason," whereas 0.9 solidifies the wrongness.

  \answer{0.70}
