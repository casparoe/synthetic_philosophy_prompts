      *   *Idea 2: Positive Liberty/Effective Ability.* Freedom isn't just "no one stopped me," it's "can I actually do what I want?" Ignorance restricts this. -> *Positive Liberty.*
      *   *Idea 3: Rational Will/True Self.* You *really* want to be financially stable. The law forces your "true self" over your "impulsive self." -> *Rationalist/Autonomy.*
