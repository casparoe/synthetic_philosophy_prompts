      *(Self-Correction during drafting)*: I need to be careful with the "Rational Will" distinction. Is it sleight of hand or substantive? It's substantive in Kant/Hegel, but often used as sleight of hand in policy. I'll label it "Substantive but high-risk of sleight of hand."
