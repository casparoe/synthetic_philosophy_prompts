      *   **Constraint:** No library access (don't cite specific books/pages, rely on general philosophical knowledge).

  2.  **Deconstruct the "Forced to Be Free" Claim:**
      *   This phrase is historically associated with Rousseau (*Social Contract*), but it's often used loosely in modern policy debates.
      *   The core tension is between *negative liberty* (freedom from interference) and *positive liberty* (freedom to achieve ends/self-mastery).
      *   The opponent claims the *net* change in freedom is positive, or that the *concept* of freedom being violated is incorrect.
      *   The "Extra Wrinkle" (private board discretion) is a huge red flag for arbitrary power, which contradicts many theories of freedom (especially republican freedom).

  3.  **Brainstorming the Theses (The Menu):**
