  **Brainstorm:** Key tension: Score vs. Reality. Game needs to force a choice between honesty and ranking. Role-play works best for empathy. Avoid abstract theory initially. Use the Oatfield/Bexford story as the mechanic, not just an example.

  **Activity: The League Table Game (60 mins)**
  **Materials:** 3 Town Cards (2x Bexford, 1x Oatfield), Score Sheets, Pens, Counters ('Kindness Tokens').

  **0-5 mins: Setup.** Split 12-15 adults into 3 groups. Hand out cards.
  *   *Bexford:* Residents say 6/10. They laugh, help neighbours, admit struggles.
  *   *Oatfield:* Residents say 8/10. They moan constantly, ignore neighbours, but tick 'happy' on forms.
  *   *Goal:* Win the National Happiness League to secure library funding.

  **5-20 mins: Round 1 (Life as Usual).** Groups discuss a typical day. For every kind act mentioned, they earn a Kindness Token. They secretly write their 'Official Score' (must match their town card). Facilitator tallies tokens vs. scores on a flipchart.

  **20-35 mins: Round 2 (The Mayor's Order).** Announce: "Budget cuts. Only towns scoring 9+ get money." Bexford groups must decide: Maintain kindness (keep tokens) or coach everyone to say 10/10 (win money, lose authenticity)? They submit new scores. Oatfield continues as before.

  **35-60 mins: Debrief.**
  1.  Display Round 1 vs. Round 2 data. Did scores rise while tokens fell?
  2.  Ask: "Which town would you rather live in?" and "How did it feel to change your score in Round 2? Did it feel like cheating?"
  3.  Reveal: This is the problem with metrics. When a measure becomes a target, it ceases to be a good measure (Goodhart's Law).
  4.  Discuss: Should we chase the table or the life? Connect to news: Finland isn't trying to be #1; they just focus on welfare. Chasing the rank might ruin the welfare.

  **Troubleshooting:** If Bexford groups refuse to 'lie', remind them their library funding is at stake. If Oatfield groups get too villainous, remind them they're just following the survey rules.
  **Limitation:** The game can't simulate genuine suffering. You must explain that real unhappiness (grief, pain) isn't fixed by kindness tokens or survey tricks. It also cannot capture community trust, only individual opinion.

  **Wobbly Reasoning:** I assume groups will feel the tension of 'lying' about happiness. If they treat it purely as a points game, the moral weight is lost. Evidence that participants view it as trivial fun would require adding personal stakes or real-world consequences to the design. I also assume 15 people split evenly; uneven groups skew the token comparison. If group sizes vary wildly, the token count becomes meaningless, requiring me to switch to averages mid-session.
