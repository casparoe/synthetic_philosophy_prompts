      *   **The Break Point:** The argument breaks at the move from (3) to (4) and (9) to (10). Specifically, it breaks because it treats all "reasons" as identical in kind, when they function differently for different attitudes.
      *   **The Distinction:** We need to distinguish **Reasons of the Right Kind (RRK)** vs. **Reasons of the Wrong Kind (WRK)**.
          *   RRK for Desire: Features of the *object* (Mom's happiness).
          *   WRK for Desire: Features of the *consequence of desiring* (Avoiding torture).
          *   RRK for Belief: Evidence/Truth-conducive factors.
          *   WRK for Belief: Pragmatic benefits (Money).
