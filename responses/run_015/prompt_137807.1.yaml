      *   *Conclusion:* Scene selections.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just say "The film is wrong." I need to show how the film *complicates* Dennett.
      *   *Nuance:* Dennett's point is that the distinction is *empirically* empty. The film makes it *narratively* full. The film suggests that even if the distinction is empirically empty, it is *morally* loaded. If Leonard chooses the Orwellian path (rewriting his memory via notes), he is morally responsible in a way he wouldn't be if it were Stalinesque (brain glitch).
