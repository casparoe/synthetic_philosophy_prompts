          *   Identify where the analogy breaks and where the film might presuppose a Cartesian Theater.
          *   **Ending Requirements:** State what the film adds to the debate, name one scene to show the seminar, and name one scene a Cartesian Theater defender would claim.

  2.  **Deconstruct the Theoretical Framework (Dennett):**
      *   *Color Phi Phenomenon:* Two spots flash (A then B). Subject sees motion and color change *between* flashes.
      *   *Stalinesque:* The brain waits for input B, constructs the motion/color change, then projects it to consciousness (a "show" in the theater).
      *   *Orwellian:* The brain projects A, then B, but the *memory* is rewritten to include the motion/color change.
      *   *Dennett's Conclusion:* The distinction is illusory. There is no "finish line" where consciousness happens. It's all narrative construction (Multiple Drafts). Asking "when it really happened" is a category error.

  3.  **Analyze *Memento* through this Lens:**
      *   *Leonard's Condition:* Anterograde amnesia. Cannot form new declarative memories. Relies on notes, tattoos, instinct.
      *   *Scale 1: Single Scene (Truncation):* Leonard forgets what happened 5 minutes ago. Is this Orwellian? Not exactly. It's more like a "draft" that never gets archived. The experience fades before it can be revised. It challenges the idea of a continuous stream.
      *   *Scale 2: Film Structure (Reverse Chronology):* The viewer experiences Scene Z, then Y, then X. Our understanding of Z changes when we see X. This is *viewer-side* Orwellian revision. We rewrite the meaning of the past based on new data. Does this map to Leonard's brain?
      *   *Scale 3: Sammy Jankis (Confabulation):* Leonard projects his own guilt onto Sammy. He tells the story repeatedly. Is Sammy real? Did Leonard kill his wife? This is long-term narrative revision. It looks Orwellian (memory rewrite), but Dennett would say *all* memory is narrative construction.

  4.  **Address the Specific Prompts:**

      *   *Do the three scales share the same shape?*
          *   Scene level: It's about *loss* of draft, not revision.
          *   Film level: It's about *contextual* revision (semantic), not phenomenological.
          *   Sammy level: It's about *identity* construction (narrative self).
          *   *Argument:* They are not identical. The film conflates them to create the *feeling* of ontological uncertainty, but philosophically, they differ. The film uses the structural trick (Scale 2) to force the viewer into Leonard's epistemic position (Scale 1) to justify the metaphysical twist (Scale 3).

      *   *The "Second Viewing" Test:*
