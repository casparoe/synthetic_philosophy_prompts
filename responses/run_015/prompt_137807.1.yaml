          *   The film makes the Orwellian mechanism *visible* (we see him write the note). Dennett says the mechanism is *invisible* and indistinguishable.
          *   Therefore, the film secretly relies on a Cartesian Theater (the chronological truth is the "show" that Leonard is distorting).
      *   *Section 3: Contribution to Debate.*
