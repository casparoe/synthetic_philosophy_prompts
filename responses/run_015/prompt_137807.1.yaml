  7.  **Final Polish:** Ensure the tone is academic, rigorous, and directly addresses the prompt's specific constraints (especially the ending requirements). Make sure the distinction between Orwellian/Stalinesque is applied precisely. (Orwellian = memory rewrite; Stalinesque = perceptual fabrication).

      *   *Refining the Three Scales:*
