answer: |-
  Here is the translation of the Raven Paradox into Property-Based Testing (PBT) vocabulary, followed by the residue report you asked for.

  ### The Translation Layer

  *   **The Hypothesis:** An `Invariant` function `prop_universe(Object x) -> bool`.
  *   **Formulation A:** `assert !is_raven(x) || is_black(x)` (If raven, then black).
  *   **Formulation B:** `assert !is_black(x) || !is_raven(x)` (If non-black, then non-raven).
  *   **The Universe:** The total `Input Space` of the generator.
  *   **Observation:** Running `check(prop_universe, input)`.
  *   **Confirmation:** Increasing the `Confidence Level` that the invariant holds over the entire input space without finding a counterexample.
  *   **The Paradox:** Formulation A and B are extensionally identical (refactors of the same logic). Therefore, a test case that passes B (a white sneaker) should increase confidence in A. Your gut says it shouldn't.

  ---

  ### The Four Questions (in Code-Talk)

  #### 1. Does code separate the two equivalent formulations?
  **Yes, via Coverage Metrics.**

  In a purely extensional logic engine, `A -> B` and `!B -> !A` are the same truth table. But in a PBT runner, they are **different execution paths**.

  *   **Formulation A** instruments the `is_raven` branch. To get high coverage, your generator *must* produce ravens.
  *   **Formulation B** instruments the `is_black` branch. To get high coverage, your generator *must* produce non-black things.

  If you run a white sneaker against Formulation A, the short-circuit evaluation skips the `is_black` check entirely. The coverage profiler reports: **Branch Not Taken**.
  Your gut feeling that the sneaker is irrelevant is actually a **Coverage Intuition**. You know that testing the `!is_raven` branch does not increase coverage on the `is_raven` branch. Code separates them by tracking which predicates were actually evaluated, not just the final boolean result.

  **Verdict:** The pull is not from outside the claim; it's from the **instrumentation**. Logic is extensional; Testing is intensional (path-dependent).

  #### 2. Does the generator's sampling distribution matter?
  **Yes. Evidence weight is inverse to sampling probability.**

  In PBT, a test pass is not binary evidence. It is weighted by the **difficulty of generating the input**.
  *   **Scenario 1:** You tune your `Gen<Object>` to specifically target `is_raven == true`. This is a high-cost generator (rare objects). Finding a black raven here is high-value. It proves the system holds under stress.
  *   **Scenario 2:** You tune your `Gen<Object>` to target `is_black == false`. This is a low-cost generator (sneakers, red apples, blue sky). Finding a non-raven here is trivial.

  The paradox assumes a uniform distribution over "all objects." In that case, non-black things vastly outnumber ravens. A random sample will almost always be a sneaker.
  If your PBT runner reports "10,000 tests passed," but 9,999 were sneakers, your **Mutation Score** is near zero. You haven't tested the raven logic; you've tested the sneaker logic.

  **Verdict:** The paradox depends entirely on ignoring the **Generator**. In PBT, the `Gen` is part of the proof. A white sneaker *is* evidence, but its signal-to-noise ratio is so low it rounds to zero. You don't need a Bayesian prior; you just need **Coverage-Guided Fuzzing**.

  #### 3. Tests on inputs that can't reach the branch (Zero Information)
  **This is "Vacuous Truth" vs. "Uncovered Branch."**

  Philosophers call `False -> Anything` "vacuously true."
  In PBT, we call this **Uncovered Code**.

  If you run `prop_universe` on a sneaker using Formulation A (`!is_raven || is_black`), the first term is true, so the second is never evaluated.
  *   **Philosophy:** Says the proposition is satisfied.
  *   **PBT:** Says the test passed, but **Coverage = 0%** for the raven predicate.

  Most PBT frameworks (like Hypothesis or jqcheck) will warn you if your generator fails to satisfy preconditions or hit specific branches after a certain number of runs.
  **Verdict:** PBT has a direct grip on this. It's not "zero information" logically; it's "zero coverage" practically. We discard these runs when calculating confidence in the specific invariant logic.

  #### 4. The `Grue` Problem (Overfitting vs. Natural Kinds)
  **This is Cyclomatic Complexity and Stability.**

  `is_grue(x)` is a function that depends on external state (time) or has a high complexity branch (`if time < 2050`).
  `is_black(x)` is a stable property of the object.

  In PBT, we prefer invariants that are:
  1.  **Deterministic:** No hidden time dependencies.
  2.  **Minimal:** Lower cyclomatic complexity.
  3.  **Stable:** Unlikely to break during refactoring (unless the behavior actually changes).

  `is_grue` is **Overfitting** the current test suite. It passes all current tests (because it's defined to) but fails the **Mutation Testing** criteria. If you mutate the environment (change the date), `grue` breaks, `black` holds.
  "Natural kinds" in philosophy map to **Stable Interfaces** in code. We prefer `black` because it's a simpler dependency graph.

  **Verdict:** Your intuition (shorter implementation) is exactly right. It's **Minimum Description Length**. The paradox leaves out that we prefer predicates that generalize across environment changes, not just input changes.

  ---

  ### The Residue Report

  Here is the honest accounting of what translates, what distorts, and what is missing.

  #### 1. What Maps Cleanly
  *   **Logical Equivalence = Refactoring.** The fact that `A -> B` equals `!B -> !A` is exactly like refactoring a function without changing its output.
  *   **Confirmation = Confidence/coverage.** Increasing belief in a hypothesis is exactly like increasing coverage metrics and mutation scores without finding a bug.
  *   **Grue = Overfitting.** Preferring "black" over "grue" is exactly preferring a simpler model that doesn't rely on magic numbers or system time.
  *   **The "Bug" Feeling = Coverage Gap.** The intuition that sneakers don't matter is your internal coverage profiler telling you that the `is_raven` branch wasn't touched.

  #### 2. What Maps with Distortion
  *   **"Evidence" vs. "Pass".** In philosophy, evidence is often treated as accumulating truth. In PBT, a pass is just a failure to find a bug *given the generator*. The distortion is that philosophy often treats observations as "given," whereas PBT treats observations as "expensive to compute."
  *   **The "Universe"**. In PBT, the input space is defined by Types and Generators. In philosophy, the "Universe" is vague. The paradox relies on the vagueness of "all things." In code, `Gen<Object>` forces you to ask: "How hard is it to make a raven vs. a sneaker?"

  #### 3. What Has No Expression (The Missing Bits)
  *   **Ontological Commitment.** Philosophy worries about whether "Raven" is a *real* category in nature. In code, `is_raven` is just a function. If you define it poorly, your tests are garbage, but the code doesn't care. PBT cannot tell you if your predicates carve nature at its joints; it can only tell you if they are consistent.
  *   **Truth vs. Utility.** PBT is instrumentalist. It doesn't care if "All ravens are black" is *True* in a metaphysical sense, only if it's *Useful* for predicting system behavior. The paradox is often about Truth; your vocabulary is about Risk Management.

  #### 4. Final Verdict: Thin Vocabulary or Crisp Argument?
  **Your vocabulary is not too thin; the philosophical argument is underspecified.**

  The Raven Paradox persists in philosophy because it abstracts away the **cost of sampling**. It treats observing a raven and observing a sneaker as epistemologically equal "atoms" of evidence.
  In PBT, you know that **sampling is never free**.
  *   Sampling a raven is expensive (rare in the wild).
  *   Sampling a sneaker is cheap (abundant).

  The paradox dissolves when you admit that **Confidence = (Passes) / (Cost to Find Counterexample)**.
  Since the cost to find a non-black non-raven is near zero, the confidence gain is near zero.

  **The Residue:** The only thing your vocabulary misses is *why* the universe is shaped such that ravens are rare and sneakers are common. PBT takes the distribution as a given (the `Gen`). Philosophy asks why the `Gen` is written that way. But for the purpose of validating the invariant? Your tools are sufficient. The "bug" you feel is real: it's a **Coverage Warning**.
