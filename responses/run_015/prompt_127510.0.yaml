prompt: |-
  So I basically live in our property-based testing setup at work (generators, shrinking, coverage numbers, mutation scores) and that's about the only vocabulary I actually think in — I never took any philosophy. I keep coming back to this raven thing and I want it said in my terms. The way I have it: `all ravens are black` is logically the same claim as `all non-black things are non-ravens`; a black raven is supposed to count as evidence for the first; a white sneaker is supposed to count as evidence for the second; so since they're the same claim, sitting here looking at my sneakers supports the hypothesis that all ravens are black. That reads like a bug.

  Can you translate the whole dispute into testing vocabulary as faithfully as you can — invariant, test input, generator, a pass vs. a raised confidence level, two implementations that are extensionally equal but different code, the endless supply of invariants that fit every test anyone has ever run — and then give me the residue report? The bits I actually care about:

  - Does anything in code-talk separate the two equivalent formulations the way my gut wants to? If nothing does, is that because code is genuinely extensional and the pull I feel is coming from somewhere outside the claim?
  - My generator doesnt sample uniformly from all possible objects; it samples from a shaped distribution, and I can aim it at non-black things on purpose. In code I'd say the sampler and the coverage are part of the evidence, not just the pass/fail. Does the paradox actually depend on how the white sneaker got into the sample, and does the testing vocabulary have the resources to say so, or do I have to sneak in something like a prior?
  - A test can pass on an input I already knew couldnt reach the branch the invariant is about. I've always treated that as zero information. Is there a counterpart in their version, or is that a case they just cant get a grip on?
  - And the `grue` thing — the predicate that agrees with black on everything tested so far and then diverges later. For me that's just overfitting, and the only tool I have for preferring black is how short the implementation is, roughly. Does that do the work the paradox needs, or does it leave out the part where raven and black feel like the natural cuts in the first place?

  I want the honest version: what maps cleanly, what only maps with distortion, what has no expression in my vocabulary at all. And where it doesnt translate, tell me whether that's my vocabulary being too thin or their argument being less crisp than it sounds.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

