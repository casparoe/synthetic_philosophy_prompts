      *   **Core Problem:** The Raven Paradox (Hempel's Paradox). Specifically, the intuition that observing a white sneaker (non-black, non-raven) shouldn't confirm "All ravens are black," even though it's logically equivalent to "All non-black things are non-ravens."
      *   **Task:** Translate the philosophical dispute into PBT vocabulary (invariants, generators, coverage, etc.).
      *   **Specific Questions to Address:**
