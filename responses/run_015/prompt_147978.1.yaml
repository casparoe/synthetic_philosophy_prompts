answer: |-
  Here are the four failures that most reliably haunt this material when taught to the uninitiated. First, students conflate Smith's "sympathy" with benevolence or pity, turning a descriptive mechanism of judgment into a prescriptive command to be nice. Second, they treat the Impartial Spectator as a pre-existing conscience or a divine voice, which severs the crucial link between the spectator and the social practice of imagination; it becomes a rule rather than a relationship. Third, they assume "impartiality" means utilitarian neutrality—counting every interest equally—rather than the specific detachment required to judge the *propriety* of a passion. Fourth, and most damaging for your economics students, they assume the *Theory of Moral Sentiments* contradicts *The Wealth of Nations*, viewing the session as an apology for Smith's "human side" rather than the foundation of his social theory. The obvious ordering is to follow the text: define sympathy, then introduce the spectator. I set that aside. It is too linear. It makes the spectator look like an add-on. Instead, we must start with the *failure* of actual spectators to create the *need* for the impartial one.

  Here is the plan.

  ### 1. The Order of Components

  Your instinct is correct: the mechanism of sympathy must precede the spectator. However, your suspicion is also correct: if you do not establish the *motivation* for the spectator early, it appears as a deus ex machina. The dependency chain is not linear; it is a loop that must be closed.

  **The Sequence:**
  1.  **Redefine Sympathy (0–15 mins):** Establish that sympathy is not pity, but "fellow-feeling" (imaginative projection).
  2.  **The Problem of Asymmetry (15–30 mins):** Demonstrate that my passions always feel stronger to me than to you. This creates a gap.
  3.  **The Desire for Concord (30–45 mins):** Explain that we are motivated to close this gap. I lower my passion; you raise your imagination. This is the *origin* of moral judgment.
  4.  **The Internalization (45–60 mins):** Introduce the Impartial Spectator as the solution to the problem of solitude. When no one is watching, who do I align with? The memory of that concord.
  5.  **Application (60–75 mins):** The Bot Case and the Check.

  **Where you are wrong:** You worry the spectator floats free of motivation. It does not, provided you emphasize Step 3. The spectator is not introduced as a judge, but as a *partner* we crave. We do not care what the imaginary onlooker thinks because it is imaginary; we care because it represents the only condition under which we can feel "in sync" with humanity. The dependency you have not thought of is **Propriety before Merit**. Do not introduce the question of "what the object deserves" (Merit) until the very end. If you introduce desert too early, students revert to utilitarian calculation. Keep them focused on the *fitness of the passion to the cause* (Propriety).

  ### 2. The Carrying Example

  **The Case:** *The Trader and the Glitch.*
  A junior trader executes a standard order. Due to a minor, reversible software glitch, the screen flashes red, indicating a catastrophic loss that doesn't actually exist. The trader screams, throws a coffee mug at the wall, and resigns on the spot. Five minutes later, IT confirms it was a glitch; no money was lost.

  **Why this case:**
  *   **It separates Fellow-Feeling from Approval:** We can imaginatively enter the trader's shock (we understand the fear of loss). We have fellow-feeling for the *fear*. But we withhold approval from the *rage* and the resignation. We judge the passion as unfitting to the *actual* cause, even if it was fitting to the *perceived* cause.
  *   **It separates Fitness from Desert:** The trader did not *deserve* to lose money (object desert), but that is not the moral question. The moral question is: was the screaming fitting for the situation?
  *   **It avoids the traps:**
      *   *Stranger in distress:* Elicits pity, confusing sympathy with benevolence.
      *   *Heroic rescuer:* Everyone agrees; no tension between understanding and judging.
      *   *Obvious crime:* Students focus on the harm, not the passion.

  **Board Work:** Draw two circles. Left: "Trader's Passion." Right: "Our Feeling." Draw an arrow labeled "Imagination." When the mug is thrown, draw a break in the arrow. Label the break "Impropriety."

  ### 3. Map of Misconceptions

  Ranked by damage to the lesson architecture:

  1.  **Sympathy = Pity/Altruism.** (Critical Damage).
      *   *Defuse:* Minute 5. If they think sympathy means "being nice," the rest of the lecture is nonsense.
      *   *Correction:* "Smithian sympathy is a mirror, not a handout. You can sympathize with a murderer's rage without approving of it."
  2.  **Impartiality = Utilitarian Aggregation.** (High Damage).
      *   *Defuse:* Minute 45 (Introduction of Spectator).
      *   *Correction:* "Impartial does not mean counting everyone's happiness equally. It means stripping away my personal stake to see if the passion fits the object."
  3.  **The Spectator = Social Conformity (The Poll).** (High Damage).
      *   *Defuse:* Minute 50.
      *   *Correction:* "The spectator is not the actual crowd. The actual crowd can be wrong. The spectator is the crowd *if* they were fully informed and calm."
  4.  **Smith = Contradiction (WoN vs. TMS).** (Medium Damage).
      *   *Defuse:* Minute 70 (Only if raised).
      *   *Correction:* "Self-interest in markets presupposes a moral agent who can restrain passion. One book describes the agent; the other describes the arena."

  **The Scaffolding Misconception:**
  *   **Allow:** "The Impartial Spectator is your Conscience."
  *   **Why:** It gives them immediate purchase on the *authority* of the voice. It stops them from asking "Why listen to this imaginary guy?"
  *   **Remove:** Minute 55.
  *   **Why:** Conscience implies an innate divine spark. Smith's spectator is *learned*. It is built from years of actual social feedback. If you leave "Conscience" in place, they miss the social psychology. You must say: "It feels like conscience, but it is actually internalized society."

  ### 4. The Closing Case: The Bot Pile-On

  **The Scenario:** A CEO makes a controversial but technically correct decision. Twitter (X) explodes. 100,000 accounts condemn her. She knows 40,000 are bots. She cannot sleep, haunted by the hostility.

  **How the Plan Answers This:**
  This case is only answerable if Step 3 (Desire for Concord) and Step 4 (Internalization) are secure.
  *   **The Lesson:** The authority of the Spectator does not come from *volume* (100,000 voices) but from the *capacity for sympathy*.
  *   **The Logic:**
      1.  Sympathy requires imagination (Step 1).
      2.  Bots cannot imagine; they only signal. Therefore, no mutual sympathy is possible with a bot.
      3.  The Impartial Spectator represents the *ideal* of mutual sympathy (Step 4).
      4.  Therefore, the Spectator discounts the bots not because they are few, but because they are incapable of the concord the agent seeks.
      5.  The CEO's distress is a failure of her own Spectator, who is currently mistaking noise for judgment.

  **Ordering Check:** If I had taught the Spectator as "Conscience" (without removing the scaffolding), this case fails, because conscience is vulnerable to guilt regardless of the source. If I had taught the Spectator as "Social Conformity," the case fails, because the social signal is overwhelmingly negative. The case *only* works if the Spectator is defined as the **well-informed, sympathetic partner**. You must explicitly state on the board: *Authority = Capacity for Concord, not Number of Voices.*

  ### 5. The Check

  Do not ask them to define the term. Ask them to diagnose a failure of the mechanism.

  **The Task:**
  "Write down one sentence answering this: A man is alone in a room. He knows no one will ever find out. He steals a small amount of money from a charity that will not miss it. According to Smith, why does he feel shame? Do not use the word 'conscience'."

  **The Pass Condition:**
  *   *Fail:* "Because he knows it is wrong." (Moral realism, not Smith).
  *   *Fail:* "Because he is afraid of getting caught." (Hobbes/Utility).
  *   *Pass:* "Because he cannot avoid being the spectator of his own conduct." OR "Because he imagines how others would view his passion if they knew."
  *   *Nuanced Pass:* "Because his desire for mutual sympathy is thwarted by his own knowledge of his impropriety."

  This tests whether they understand that the Spectator is an *imaginative act* performed by the agent, not a external rule.

  ### 6. Boundaries

  There is one question a bright economics student will inevitably ask: *"Is the Impartial Spectator efficient? Does it maximize welfare?"*

  **Decline this.** It drags you into utilitarianism and welfare economics, which collapses Smith's distinction between Propriety (fitness of passion) and Utility (outcome).

  **The Sentence:**
  "That question assumes the goal of morality is optimization; for Smith, the goal is concord. We are not solving for equilibrium here; we are describing how the judge is constructed."

  ***

  **Pedagogical Note:**
  Watch the board. Do not write definitions. Write *relationships*. Arrows between "Agent," "Spectator," and "Object." If you write "Impartial Spectator: The voice within," you have lost them. Write "Impartial Spectator: The imagined partner in concord." Keep them working to bridge the gap between the Trader's scream and the wall. That gap is where the philosophy lives.
