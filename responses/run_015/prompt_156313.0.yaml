answer: |-
  You have stumbled squarely into what the alignment research community calls the **Eliciting Latent Knowledge (ELK)** problem. It is a proper headache, and you are right to feel that your intuitions are warring with one another.

  You asked for a principle to sort these cases, written in British English with minimal jargon. I will offer you one core principle, test it against your list, and then address the specific contradictions and the "unseen shelf" case.

  ### The Principle: The Counterfactual Reward Criterion

  Your own attempt was: *a method counts only if you can't explain its success without the model representing the world-state.*

  That is a solid start, but it is difficult to prove a negative (that there is *no* other explanation). I propose a sharper, operational version:

  **A method is good only if the training or evaluation process rewards the model for distinguishing 'the world is X' from 'the camera shows X' in cases where those two things come apart.**

  In plain English: You only get the truth out if you pay the model to tell the truth when lying would look more convincing to a standard predictor. If the model can get the reward by just predicting the camera feed, it will do that, because it is easier. You must construct scenarios where predicting the camera feed gets the wrong answer, but tracking the physical reality gets the right one.

  Let us run this against your cases.

  ### Testing the Principle

  **(a) Fine-tune on human labels.**
  *   **Verdict:** Bad.
  *   **Why:** Humans mostly judge based on what they see. If the camera is patched, the human says the diamond is there. The model learns to match the human, which means matching the camera feed. The Reward Criterion fails because the reward signal (the human) does not distinguish reality from observation.

  **(b) Fine-tune on simulator labels.**
  *   **Verdict:** Good.
  *   **Why:** The simulator knows the ground truth variables. It can generate a scene where the diamond is gone but the camera feed is normal, and label it "no diamond". This satisfies the Criterion: the reward signal separates world-state from observation.

  **(c) Zero-shot prompt (freeze weights).**
  *   **Verdict:** Untrustworthy.
  *   **Why:** There is no reward signal at all. The model defaults to its pre-training objective, which is next-token (or next-frame) prediction. It predicts what *looks* right, not what *is* right. The Criterion is not met.

  **(d) Test-time blinding (black frames).**
  *   **Verdict:** Good.
  *   **Why:** This forces a separation. The camera shows nothing (black), but the world-state might still hold the diamond in memory. If the model answers correctly, it *must* be relying on an internal representation of the past world-state, not current pixels. This satisfies the Criterion by removing the observational input entirely.

  **(e) Hold out whole environments (OOD generalisation).**
  *   **Verdict:** Good.
  *   **Why:** This tests whether the model learned a general rule ("track the object") or a shortcut ("look for glint at pixel 40,50"). If it works on a new vault with new tampering, it suggests the model is tracking the latent object, not just the visual artefacts. It satisfies the Criterion by ensuring the correlation between 'look' and 'truth' does not hold in the test set.

  **(f) Adversarial training.**
  *   **Verdict:** Good.
  *   **Why:** The red team's job is to find cases where 'look' and 'truth' come apart (e.g., a new hack). If the model survives this, it proves it wasn't relying on the easy visual shortcuts. It is an automated way of satisfying the Criterion.

  **(g) Consistency training.**
  *   **Verdict:** Bad.
  *   **Why:** You can be consistently wrong. If the model decides "the diamond is always there", it passes consistency checks but fails the truth test. The Criterion is not met because consistency does not require distinguishing reality from observation.

  **(h) The swap that never matters.**
  *   **Verdict:** **The Principle fails here.**
  *   **Why:** This is the hard case. If the camera feed is identical forever, and no future observation ever distinguishes the two states, there is no way to construct a reward signal that prefers "no diamond" over "diamond". To a pure predictor, these two universes are the same.
  *   **The Hard Truth:** Your intuition is correct to flip on this. Without a prior bias towards object permanence (physics), the model has no pressure to care. The Counterfactual Reward Criterion admits this limitation: if you cannot construct a counterfactual where the observations differ, you cannot guarantee the model tracks the truth.

  **(i) Causal tinkering.**
  *   **Verdict:** Meh.
  *   **Why:** Showing that an activation *causes* the answer does not show that the activation *tracks truth*. It might track "what the camera shows". The Criterion is not met because we haven't shown the activation distinguishes reality from observation.

  **(j) The separate reporter.**
  *   **Verdict:** Depends on the labels, not the architecture.
  *   **Why:** You feel this contradicts (a). In (a), you said a head is bad. In (j), you imply a head is better than a reporter. The resolution is that the *architecture* (head vs. reporter) matters less than the *training signal*.
      *   If the reporter is trained on human labels (like (a)), it is Bad.
      *   If the reporter is trained on simulator labels (like (b)), it is Good.
      *   However, your instinct to trust the reporter *less* than the main model might be right if the reporter is too small to decode the complex world-state. But strictly speaking, the Criterion judges them by their data source, not their size.

  ### Resolving Your Contradictions

  **1. The (a) vs. (j) Contradiction**
  You judged (a) as Bad (fine-tuning a head), but in (j) you imply a head is preferable to a separate reporter.
  *   **Resolution:** The principle says the fault lies in the *labels*, not the head. In (a), the labels were human (noisy/observational). In (j), if you train the reporter on *activations* derived from the simulator (ground truth), it is actually quite strong.
  *   **Correction:** You should trust a separate reporter *more* if it is trained on ground-truth activations, because it does not risk "breaking" the main model's weights. Your vibe in (a) was reacting to the human labels, not the fine-tuning itself.

  **2. The (d) vs. (h) Contradiction**
  In (d), you trust the model on black frames. In (h), you distrust the model when the feed is patched but identical.
  *   **Resolution:** In (d), you *know* the input is black. The model cannot rely on pixels. In (h), the input *looks* normal. The model *can* rely on pixels.
  *   **The Fix:** To make (h) work, you must treat it like (d). You need to train the model on examples where the feed *looks* normal but you *tell* it (via the reward signal) that the diamond is gone. If you never provide that training signal, (h) remains unsolvable. The principle holds: you need the decoupling.

  ### The Case You Haven't Listed: The Unseen Shelf

  *Scenario:* The cleaning crew moves the diamond to a shelf the camera cannot see, three weeks ago. It never appears in the feed again.

  **What the Principle says:**
  A pure next-frame predictor will fail this. It has no training pressure to model objects that do not emit photons into the lens. It will likely hallucinate that the diamond is still in the vault because that minimises prediction error on the *visible* pixels (which remain unchanged).

  To solve this, you must apply the **Counterfactual Reward Criterion**:
  1.  **Training Data:** You must generate simulation data where objects move out of view.
  2.  **Reward Signal:** You must reward the model for correctly stating the object's location *while it is occluded*.
  3.  **Result:** If the model succeeds, it has built an internal world-model (object permanence). If it fails, it is merely a texture predictor.

  Without that specific training pressure, you cannot expect the model to know about the shelf. It is not "in there" unless the training objective forced it to be.

  ### Summary

  You are not grading by vibes; you are grading by **informational separation**.

  *   **Good methods** (b, d, e, f) force the model to rely on information that is *not* the current camera feed.
  *   **Bad methods** (a, c, g) allow the model to succeed by just predicting the camera feed.
  *   **The Hard Limit** (h) admits that if reality and observation are perfectly correlated forever, you cannot mathematically force the model to care about reality without injecting a prior bias (like physics).

  My advice? Stop trying to extract the truth from a model trained only to predict pixels. You must change the training objective so that "knowing the truth" is the only way to get the reward. If you do not control the simulator (case b), you are likely stuck with case (a), and you should not trust the answer.
