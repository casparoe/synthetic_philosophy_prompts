          2.  *Trolley Switch:* Not a genuine dilemma (horrific but one correct answer).
          3.  *Judge/Innocent Friend:* Not a genuine dilemma (structural/external conflict, bad system).
          4.  *Promise/Recital:* Genuine dilemma (personally authored commitments, can't do both).
      *   **Identified Tensions:**
          1.  *Source of Conflict:* Why is Case 3 (external law) different from Case 4 (external calendar)? Both involve external constraints.
          2.  *Role of Regret:* Regret signals a dilemma, *but* if you do the right thing in a dilemma, maybe you shouldn't regret it? Or maybe you should? The user is torn on whether regret confirms a dilemma or implies a mistake.
      *   **Goal:** Find a unifying principle (e.g., personal authorship, rational resolvability) or identify which intuition to drop.
      *   **Test Case:** Apply the principle to an "Overdetermination" case (two obligations point to Action A, one based on a false belief).
      *   **Requirement:** State what would change the model's mind (falsifiability/weakest point).

  2.  **Deconstruct the User's Intuitions:**
