answer: |-
  This is a fantastic set of intuitions to unpack. You are grappling with the classic distinction between **tragic dilemmas** (where morality itself seems fractured) and **hard choices** (where morality is demanding but clear).

  Your intuitions are actually more consistent than you fear, but they rely on a specific meta-ethical commitment: **Moral Pluralism without Relativism.** You seem to believe there are multiple genuine values (justice, fidelity, life), but they aren't always rankable *except* when a specific normative hierarchy applies.

  Here is a proposed principle that saves your four cases, resolves your tensions, and handles the overdetermination test.

  ### The Principle: Incommensurability + Normative Residue

  **A Genuine Moral Dilemma exists if and only if:**
  1.  **Competing Claims:** Two or more obligations bind the agent.
  2.  **Incommensurability:** There is no higher-order moral principle or lexical hierarchy that definitively overrides one obligation in this context (they are of equivalent normative weight).
  3.  **Inevitable Residue:** Fulfilling one obligation necessarily violates the other in a way that generates *justified agent-regret* (not guilt), regardless of the choice made.

  #### Applying the Principle to Your Cases

  *   **Case 1 (Sophie):** **Genuine Dilemma.**
      *   *Claims:* Save Child A vs. Save Child B.
      *   *Hierarchy:* None. One life is not morally "greater" than another.
      *   *Residue:* Inevitable. Whichever lives, the death of the other is a moral cost that remains.
  *   **Case 2 (Trolley):** **Not a Dilemma.**
      *   *Claims:* Save 1 vs. Save 5.
      *   *Hierarchy:* Yes. Minimizing loss of life is a recognized higher-order principle (in most frameworks).
      *   *Residue:* You may feel sadness, but not *moral* regret that you failed an obligation. You fulfilled the stronger obligation.
  *   **Case 3 (Judge):** **Not a Dilemma.**
      *   *Claims:* Justice (Role) vs. Loyalty (Friendship).
      *   *Hierarchy:* Yes. In liberal democratic ethics, public fiduciary duty lexically overrides private partiality *in the courtroom*. The "structural" nature you noticed isn't just about the law being external; it's that the *role* creates a normative hierarchy.
      *   *Residue:* You feel sadness for your friend, but if you sentence her, you haven't violated a moral duty. You fulfilled the dominant one.
  *   **Case 4 (Promises):** **Genuine Dilemma.**
      *   *Claims:* Fidelity to Colleague vs. Fidelity to Child.
      *   *Hierarchy:* None. Both are promises of fidelity. Unless one is trivial or coerced, they are symmetric.
      *   *Residue:* Inevitable. Breaking either promise is a moral failure, even if justified by the other.

  ### Resolving Your Tensions

  **1. The "External Source" Tension (Case 3 vs. Case 4)**
  You asked: *In case three and case four the conflict is "outside" in some sense (the law, the calender). So why do I treat them differently?*

  **Resolution:** The conflict isn't about the *source* of the constraint (internal vs. external); it's about the **normative relationship between the obligations.**
  *   In **Case 3**, the "external" law reflects an internal moral hierarchy (Public > Private). The system isn't just "bad"; it encodes a moral priority you likely endorse (impartial justice).
  *   In **Case 4**, the "external" calendar creates scarcity, but it doesn't create a hierarchy between the promises. The calendar is morally neutral; the promises are morally equal.
  *   **Takeaway:** Don't classify based on where the pressure comes from; classify based on whether the pressures are rankable.

  **2. The Regret Tension**
  You asked: *I want regret to mark dilemmas, but... if you correctly identify the stronger obligation... you shouldn't feel regret.*

  **Resolution:** You are conflating **Guilt** with **Agent-Regret** (a distinction made famous by Bernard Williams).
  *   **Guilt:** "I did something wrong." (Implies you violated an all-things-considered duty).
  *   **Agent-Regret:** "I caused a harm / failed a claim, even if I had to." (Compatible with doing the right thing).
  *   **The Fix:** In a **Genuine Dilemma** (Sophie/Promises), you should feel *Agent-Regret* but not *Guilt*. In a **Hard Choice** (Trolley/Judge), you should feel neither (perhaps sadness, but not regret about the action).
  *   If you feel *Guilt* after the Trolley case, you are mistaken about the morality. If you feel *Agent-Regret* after Sophie's Choice, you are morally sensitive.

  ### The Overdetermination Test Case

  **Scenario:** Two obligations point to Action A. Obligation X is real. Obligation Y rests on a false belief you don't share (e.g., "I must do A because God commanded it," but you are an atheist, though you agree A is right for secular reason X). Or, perhaps you *do* share the belief, but the belief is false (e.g., "I must give money to Bob because I stole from him," but you actually didn't steal from him, though you owe him money for a different reason).

  Let's assume your phrasing: *"One obligation rests on a false belief I don't share, so only one genuinely applies."*

  **Verdict:** **Not a Hidden Dilemma.**

  **Reasoning:**
  A genuine dilemma requires **two valid binding claims.** If one obligation rests on a false premise that you (correctly) reject, or that is objectively false, that obligation does not exist.
  *   You are not torn between two duties. You have **one duty** supported by **two arguments**, one of which is flawed.
  *   This is an **Epistemic Confusion**, not an Ontological Dilemma.
  *   **Prediction:** If you discover the false belief, your psychological conflict should vanish immediately without residue. In a real dilemma, discovering new facts often doesn't remove the tragedy (e.g., in Sophie's Choice, knowing both children are "equally good" doesn't solve it).

  ### What Would Change My Mind? (Falsifiability)

  This principle is robust, but it rests on two shaky pillars. Here is where the reasoning is most vulnerable:

  **1. The "Hierarchy" in Case 3 (Judge)**
  My principle assumes there *is* a lexical hierarchy where Justice overrides Friendship in a courtroom.
  *   **Falsifying Condition:** If you adopt a **Care Ethics** or **Moral Particularist** framework, this hierarchy dissolves. A particularist might argue that in *this specific context*, the friendship creates a unique demand that overrides the abstract rule of law.
  *   **Impact:** If you believe a judge *could* morally be required to let the friend go (perhaps the law is unjust, or the friendship entails a deeper duty), then Case 3 becomes a Genuine Dilemma. If you feel Case 3 *must* be a dilemma for some agents, my principle fails.

  **2. Randomization as a Solution**
  My principle assumes Sophie's Choice is incommensurable.
  *   **Falsifying Condition:** If you accept **Procedural Justice** as a higher-order principle. Some philosophers argue that when values are equal, the moral duty is to *flip a coin*.
  *   **Impact:** If flipping a coin resolves the obligation (i.e., once the coin lands, you have no residue because chance decided), then Sophie's Choice is **not** a genuine dilemma; it's a hard choice with a procedural solution. If you think the residue remains *even after* a coin flip (because you still actively killed one child), my principle holds. If you think the coin washes the hands, my principle fails.

  ### Summary for Your Teaching
  You can tell your students: **"A dilemma isn't just when it's hard to choose. It's when morality itself doesn't tell you which choice is better."**

  *   **Trolley/Judge:** Morality speaks clearly (Save more / Uphold justice). It's hard to *do*, but easy to *know*.
  *   **Sophie/Promises:** Morality is silent or contradictory. It's hard to *know*, and impossible to *do* without cost.

  Your intuitions are tracking the difference between **Epistemic Difficulty** (hard to know) and **Ontological Conflict** (impossible to satisfy). Stick with that distinction, and your cases align.
