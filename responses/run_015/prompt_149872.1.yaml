          *   Also, the definition of "Rational Resolvability." Utilitarians say Sophie's Choice is resolvable (flip a coin to maximize fairness?). If randomization is a valid moral strategy, does the dilemma vanish?

  5.  **Refining the Output (Self-Correction during drafting):**
      *   *Tone:* Academic but conversational (peer-to-peer).
      *   *Clarity:* Make sure the distinction between Case 3 and 4 is sharp. The user asked specifically about the "outside" nature of the conflict. I need to emphasize that the *source* isn't the issue, the *normative relationship* is.
      *   *Regret:* Be precise. Bernard Williams' "Agent-Regret" is the specific concept needed here.
      *   *Overdetermination:* Make sure to explain *why* it's not a dilemma (no actual conflict of *valid* claims).

  6.  **Final Polish:** Check against all constraints in the prompt.
