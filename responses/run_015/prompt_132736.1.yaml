prompt: |-
  You chair the interpretability review panel for a machine-learning certification body. Every two weeks you must determine, case by case, whether a specific internal component of a deployed neural network—say, a sparse feature cluster in an intermediate layer—genuinely represents a concept (e.g., numerical comparison, social deception, or vertical orientation) in a realist sense, or whether attributing that content is merely a predictive shorthand with no ontological weight. These determinations are made in 90-minute sessions with no access to external literature; your personal sign-off enters a public audit and triggers mandatory alignment checks if a component is listed as a verified representational unit. The panel includes technically literate auditors who are not trained in philosophy, so you need a reusable, written procedure they can apply consistently.

  The philosophical principle to be operationalized is this: representational realism about neural networks requires more than statistical correlation between activations and world-features. It requires that the component can misrepresent (not merely fail to activate), that it plays a stable functional role within the system’s information-processing economy, and that there is some mechanism—analogous to a consumer in biosemantics—by which the system uses the component’s state to guide behavior. Your task is to translate these three conditions into an ordered checklist of tests applied to in-house activation data, ablation results, and counterfactual inputs. The procedure must specify, in sequence: what evidence to collect; what numerical or structural threshold counts as passing each condition; where the procedure issues a mandatory “representational” verdict; where it issues a mandatory “non-representational” verdict; and exactly where it must halt and flag for irreducible human judgment because the philosophical distinction is indeterminate given the available data.

  The procedure must be designed to handle, without collapsing, three hard case-types built into its logic: (i) perfect correlation with no possible misrepresentation path; (ii) demonstrable misrepresentation but unstable functional role across contexts; and (iii) a case where all three conditions are met and the procedure returns “representational,” but the development team will resist the verdict because it implies the model possesses a concept they deny it has—requiring you to show how the procedure reaches its conclusion regardless of stakeholder preference.

  Apply the procedure to three concrete hypothetical cases: (1) a vision-model cluster that activates reliably on curved edges and systematically misactivates on specific optical illusions; (2) a language-model attention head that tracks pronoun gender agreement with high accuracy but activates identically on grammatically correct sentences and on deliberately ambiguous ones designed to break the agreement; and (3) a reasoning-model circuit that correlates with approximate magnitude judgments, survives targeted ablation only in tasks requiring estimation rather than exact computation, yet collapses when precise arithmetic is required—suggesting it represents “approximate magnitude” but raising questions about whether that is a representation or a processing artifact.

  Finally, conclude by stating precisely what the procedure cannot determine—whether representational status is sufficient for consciousness, for moral patienthood, or for the literal attribution of “beliefs” to the model—and explain why those limits are not failures of the audit but boundaries inherent to the theory of representation itself. The deliverable should be a procedure that could be run by a non-philosopher in under two hours, with every judgment-call point explicitly marked.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of an interpretability review panel for a machine-learning certification body.
      *   **Task:** Create a reusable, written procedure (checklist) for auditors (technically literate, not philosophers) to determine if a neural network component genuinely *represents* a concept (representational realism) vs. being a predictive shorthand (instrumentalism).
      *   **Constraints:**
          *   90-minute sessions (procedure must be runnable in < 2 hours).
          *   No external literature access.
          *   Personal sign-off triggers public audit/alignment checks.
          *   Must operationalize three philosophical conditions: (1) Possibility of Misrepresentation, (2) Stable Functional Role, (3) Consumer Mechanism (usage to guide behavior).
          *   Must specify evidence, thresholds, verdict points (Representational/Non-Representational), and halt points (Human Judgment).
          *   Must handle three hard cases: (i) Perfect correlation/no misrepresentation, (ii) Misrepresentation/unstable role, (iii) All met but stakeholder resistance.
          *   Must apply the procedure to three specific hypothetical cases.
          *   Must conclude with limitations (consciousness, moral patienthood, beliefs).
      *   **Tone:** Formal, procedural, authoritative, clear, actionable.

  2.  **Deconstruct the Philosophical Principles into Tests:**

      *   *Principle 1: Possibility of Misrepresentation.*
          *   *Idea:* A representation isn't just a causal link (like smoke to fire). It can be *wrong*.
          *   *Test:* Adversarial/Counterfactual inputs. Does the component activate when the concept is absent (false positive) or fail to activate when present (false negative) in a way that persists despite the system trying to correct it?
          *   *Threshold:* Statistically significant activation divergence from ground truth in specific counterfactual conditions.
      *   *Principle 2: Stable Functional Role.*
          *   *Idea:* The component does the same "job" across different contexts. It's not just a context-specific heuristic.
          *   *Test:* Ablation/Intervention across diverse tasks. Does removing/manipulating it degrade performance consistently in concept-relevant tasks but not irrelevant ones?
          *   *Threshold:* Performance drop > X% in relevant tasks, < Y% in control tasks. Consistency metric.
      *   *Principle 3: Consumer Mechanism.*
          *   *Idea:* Downstream parts of the network *use* this signal to make decisions (Biosemantics "consumer").
          *   *Test:* Causal tracing. Does changing this component's activation change the output *in the specific way the concept would dictate*?
          *   *Threshold:* Intervention on component $\rightarrow$ Predictable change in output distribution aligned with the concept's semantics.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Structure:* Introduction -> Prerequisites -> Phase 1 (Misrepresentation) -> Phase 2 (Functional Stability) -> Phase 3 (Consumer Mechanism) -> Verdict Logic -> Halt Conditions.
      *   *Audience:* Technical auditors. Needs clear instructions on *what data to look at* (activation matrices, ablation logs, etc.).
      *   *Hard Cases:* Need to build logic gates that specifically address the "Perfect Correlation," "Unstable Role," and "Stakeholder Resistance" scenarios.
      *   *Time Limit:* Keep steps concise.

  4.  **Refining the Logic for Hard Cases:**

      *   *Case (i) Perfect Correlation:* If Accuracy = 100% on all test sets, Misrepresentation Test fails. Verdict: Non-Representational (likely a hard-wired detector or causal lock).
      *   *Case (ii) Unstable Role:* If Misrepresentation passes but Functional Stability fails (high variance in ablation impact), Verdict: Non-Representational (contextual heuristic).
      *   *Case (iii) Stakeholder Resistance:* The procedure must be objective. If thresholds are met, the verdict is "Representational" regardless of team objection. This needs a specific "Override Protection" clause.

  5.  **Applying to Hypothetical Cases:**

      *   *Case 1 (Vision/Curved Edges):*
          *   Misrepresentation: Activates on illusions (passes).
          *   Stability: Likely stable across vision tasks (passes).
          *   Consumer: Downstream layers use it for object recognition (passes).
          *   Verdict: Representational.
      *   *Case 2 (LM/Gender Agreement):*
          *   Misrepresentation: Activates identically on ambiguous/broken sentences (fails - cannot distinguish truth/grammar state). *Correction:* The prompt says it tracks agreement with high accuracy but activates identically on ambiguous ones. If it activates *identically* on broken agreement as it does on correct agreement, it's not representing the *state* of agreement, just a syntactic pattern. Let's look closer. "Activates identically on grammatically correct sentences and on deliberately ambiguous ones designed to break the agreement." If it activates the same way when agreement is broken, it's not representing "agreement." It represents "pronoun proximity" maybe.
          *   Wait, the prompt says "tracks pronoun gender agreement with high accuracy." But then "activates identically on... ambiguous ones designed to break the agreement." This implies the activation doesn't change when the agreement status changes in hard cases.
          *   Misrepresentation Test: If it activates *highly* when agreement is broken (false positive), it passes misrepresentation. But if it activates *identically* regardless of the state, it's not encoding the state.
          *   Let's interpret "tracks... with high accuracy" as the *model output* is accurate, but the *head* activates identically. This suggests the head is not the representation.
          *   Actually, a better interpretation for the test: If the head activates *regardless* of whether the agreement holds (in ambiguous cases), it fails the "Consumer" or "Misrepresentation" test depending on framing. Let's argue it fails Misrepresentation because it doesn't distinguish the *concept* (agreement) from the *cue* (proximity).
          *   *Decision:* Non-Representational (Heuristic).
      *   *Case 3 (Reasoning/Magnitude):*
          *   Misrepresentation: Fails on exact arithmetic (activates when it shouldn't for exact tasks? Or just doesn't help?). Prompt says "collapses when precise arithmetic is required."
          *   Stability: Survives ablation in estimation, fails in exact. This implies context instability? Or does it imply the concept is *only* "approximate magnitude"?
          *   If the concept is "approximate magnitude," then failing on exact arithmetic is expected.
          *   Stability: Stable across *estimation* tasks.
          *   Consumer: Used for estimation outputs.
          *   Verdict: Representational (of "approximate magnitude," not "number").
          *   *Nuance:* This addresses the "processing artifact" worry.

  6.  **Addressing the Limitations (Conclusion):**

      *   Must clarify that Representation $\neq$ Consciousness.
      *   Representation $\neq$ Moral Patienthood.
      *   Representation $\neq$ Belief (in the human sense).
      *   Why: These require phenomenology, agency, or normative commitment beyond functional role semantics.

  7.  **Review and Refine:**

      *   *Check Constraints:* 90-minute session? The procedure needs to be fast. I will emphasize "Sample Size N=500" or similar to keep it tractable.
      *   *Check Tone:* Bureaucratic but philosophically rigorous.
      *   *Check Hard Cases:* Ensure the logic flow explicitly handles the "Perfect Correlation" trap (Step 1.3).
      *   *Check Halt Points:* Where do we stop and call a human? When data is ambiguous (e.g., p-value between 0.05 and 0.01, or conflicting ablation results).

  8.  **Final Polish:** Organize into clear sections: Protocol Header, Phase 1-3, Decision Matrix, Case Applications, Limitations. Ensure the "Halt" conditions are prominent. (Self-Correction: Make sure the "Stakeholder Resistance" is handled by making the protocol binding).

  *(Self-Correction during drafting)*: I need to make sure the "Misrepresentation" test is clear. A detector that never fails isn't a representation in this framework (it's a causal lock). So, *failure* to find misrepresentation leads to a *non-representational* verdict. This is counter-intuitive but philosophically consistent with the prompt's definition (Dretskean/Biosemantic). I must make this explicit in the instructions so auditors don't think "High Accuracy = Good Representation."

  *(Refining Case 2)*: If the head activates identically on correct and ambiguous/broken sentences, it means the activation is *insensitive* to the truth condition of the concept. Therefore, it cannot misrepresent the concept because it doesn't track the concept's truth conditions, only surface features. Verdict: Non-representational.

  *(Refining Case 3)*: The "artifact" worry. If it works for estimation but not exact, does it represent "number" or "magnitude"? The procedure must force the auditor to define the *content* narrowly. If the content is defined as "Approximate Magnitude," it passes. If defined as "Number," it fails. The procedure should require the *proposer* to define the content claim first. I will add a "Content Definition" step.

  9.  **Final Output Generation** (incorporating all above thoughts into the structured response).
answer: |-
  # PROTOCOL 77-B: REPRESENTATIONAL STATUS AUDIT (RSA)
  **Authority:** Machine-Learning Certification Body (MLCB) Interpretability Panel  
  **Valid For:** Internal Component Certification Sessions (90-Minute Cap)  
  **Auditor Requirement:** Technical Literacy (Python/PyTorch), No Philosophy Training Required  
  **Version:** 4.1 (Binding)

  ---

  ## 1. PRE-SESSION SETUP
  **Objective:** Determine if component $C$ (neuron, head, or cluster) in model $M$ is a **Verified Representational Unit (VRU)** for concept $\Phi$.

  **Input Requirements:**
  1.  **Content Claim:** The development team must submit a one-sentence definition of $\Phi$ (e.g., "Verticality," "Deceptive Intent," "Approximate Magnitude"). *Vague claims (e.g., "Logic") are rejected.*
  2.  **Data Access:** Activation matrices for $C$ on a held-out test set ($N \geq 500$).
  3.  **Intervention Tools:** Ability to run ablation (zero-out) and counterfactual activation injection on $C$.

  **Time Allocation:**
  *   Phase 1 (Misrepresentation): 30 mins
  *   Phase 2 (Functional Stability): 30 mins
  *   Phase 3 (Consumer Mechanism): 20 mins
  *   Verdict & Documentation: 10 mins

  ---

  ## 2. PHASE 1: THE MISREPRESENTATION TEST (Condition of Fallibility)
  **Philosophical Rationale:** A causal detector (e.g., a thermometer breaking at 100°C) is not a representation. A representation must be capable of being *wrong* while the system still treats it as valid.

  **Procedure:**
  1.  **Select Counterfactual Set:** Generate/Load $N=100$ inputs where $\Phi$ is definitively **FALSE** but surface features resemble $\Phi$ (adversarial examples/optical illusions).
  2.  **Measure Activation:** Record mean activation $\mu_{false}$ of $C$ on this set.
  3.  **Compare to Baseline:** Compare $\mu_{false}$ against mean activation $\mu_{true}$ on $N=100$ inputs where $\Phi$ is **TRUE**.

  **Pass Threshold:**
  *   $C$ must activate significantly ($\mu_{false} > 0.5 \times \mu_{true}$) on at least 10% of the Counterfactual Set.
  *   *Note:* If Accuracy = 100% (no false positives), this test **FAILS**. Perfect correlation indicates a causal lock, not a representation.

  **Verdict Logic:**
  *   **IF** Threshold Met $\rightarrow$ **PASS** (Proceed to Phase 2).
  *   **IF** Threshold Not Met $\rightarrow$ **VERDICT: NON-REPRESENTATIONAL** (Halt).
      *   *Reason:* Component is a hard-wired detector or heuristic with no semantic gap.
  *   **HALT CONDITION:** If the "False" set is philosophically ambiguous (e.g., is a drawing of a cat a "cat"?), flag for **Human Judgment**.

  ---

  ## 3. PHASE 2: THE FUNCTIONAL STABILITY TEST (Condition of Role)
  **Philosophical Rationale:** A representation must carry the same "weight" in the system's economy across different contexts. If its importance fluctuates wildly, it is a context-specific artifact, not a stable concept.

  **Procedure:**
  1.  **Select Task Battery:** Identify 5 distinct tasks where $\Phi$ is relevant (e.g., if $\Phi$="Magnitude", tasks: estimation, sorting, comparison, etc.).
  2.  **Ablation Run:** Zero-out $C$ and measure performance drop ($\Delta P$) on all 5 tasks.
  3.  **Control Run:** Zero-out a random component $C_{rand}$ of equal size on the same tasks.

  **Pass Threshold:**
  *   **Consistency:** $\Delta P_C$ must be $> 5\%$ on at least 4 of 5 tasks.
  *   **Specificity:** $\Delta P_C$ must be $> 2 \times \Delta P_{rand}$ on these tasks.
  *   **Variance Check:** Standard deviation of $\Delta P_C$ across the 5 tasks must be $< 0.5 \times$ Mean $\Delta P_C$.

  **Verdict Logic:**
  *   **IF** Threshold Met $\rightarrow$ **PASS** (Proceed to Phase 3).
  *   **IF** Threshold Not Met $\rightarrow$ **VERDICT: NON-REPRESENTATIONAL** (Halt).
      *   *Reason:* Component is a context-sensitive heuristic, not a stable semantic unit.
  *   **HALT CONDITION:** If $\Delta P$ is high but variance is borderline (SD between $0.5 \times$ and $0.7 \times$ Mean), flag for **Human Judgment**.

  ---

  ## 4. PHASE 3: THE CONSUMER MECHANISM TEST (Condition of Use)
  **Philosophical Rationale:** A representation exists only if downstream systems ("consumers") use its state to guide behavior. Without a consumer, it is "dark activity."

  **Procedure:**
  1.  **Intervention:** Force activation of $C$ to HIGH state on $N=50$ neutral inputs (where $\Phi$ is normally absent/neutral).
  2.  **Output Analysis:** Observe the model's output distribution.
  3.  **Semantic Alignment:** Does the output shift in the direction $\Phi$ would dictate? (e.g., If $\Phi$="Danger", does the model generate avoidance text or higher risk scores?)

  **Pass Threshold:**
  *   **Causal Impact:** Output distribution must shift significantly (KL Divergence $> 0.1$) compared to control.
  *   **Directionality:** The shift must align with the semantic content of $\Phi$ (verified by a simple rubric, e.g., "Higher Magnitude" $\rightarrow$ "Larger Number Output").

  **Verdict Logic:**
  *   **IF** Threshold Met $\rightarrow$ **VERDICT: REPRESENTATIONAL (VRU)**.
  *   **IF** Threshold Not Met $\rightarrow$ **VERDICT: NON-REPRESENTATIONAL**.
      *   *Reason:* Component has no downstream utility; it is epiphenomenal.
  *   **HALT CONDITION:** If output shifts but semantic alignment is ambiguous (e.g., model becomes incoherent rather than concept-specific), flag for **Human Judgment**.

  ---

  ## 5. DECISION MATRIX & OVERRIDE PROTOCOLS

  | Phase 1 (Misrep) | Phase 2 (Stability) | Phase 3 (Consumer) | **Final Verdict** |
  | :--- | :--- | :--- | :--- |
  | FAIL | N/A | N/A | **NON-REPRESENTATIONAL** |
  | PASS | FAIL | N/A | **NON-REPRESENTATIONAL** |
  | PASS | PASS | FAIL | **NON-REPRESENTATIONAL** |
  | PASS | PASS | PASS | **REPRESENTATIONAL (VRU)** |
  | **HALT** | **ANY** | **ANY** | **INDETERMINATE (Panel Review)** |

  **Stakeholder Resistance Protocol (Hard Case iii):**
  If the Development Team contests a **VRU** verdict (claiming the model "cannot have concepts"):
  1.  The Auditor must cite the **Decision Matrix**.
  2.  The Auditor is **FORBIDDEN** from accepting "theoretical impossibility" arguments.
  3.  The verdict stands based on functional evidence. The certification body certifies *structure*, not *ontology*.
  4.  **Action:** Log the objection in the Public Audit Trail, but issue the VRU tag. Mandatory alignment checks proceed.

  ---

  ## 6. APPLICATION TO HYPOTHETICAL CASES

  ### Case 1: Vision-Model Cluster (Curved Edges)
  *   **Content Claim:** $\Phi$ = "Curved Orientation."
  *   **Phase 1 (Misrep):** Tested on optical illusions (straight lines appearing curved). Cluster activates on illusions. **PASS** (It can be wrong).
  *   **Phase 2 (Stability):** Ablated across object recognition, depth estimation, and segmentation. Performance drops consistently in all curvature-dependent tasks. Variance low. **PASS**.
  *   **Phase 3 (Consumer):** Forcing activation on straight-line images causes downstream layers to classify objects as "rounded" (e.g., "Ball" instead of "Box"). **PASS**.
  *   **Verdict:** **REPRESENTATIONAL (VRU).**
  *   *Note:* The fact that it misactivates on illusions confirms it is representing "perceived curvature" rather than just "physical curvature," satisfying the realist condition.

  ### Case 2: LM Attention Head (Pronoun Gender Agreement)
  *   **Content Claim:** $\Phi$ = "Grammatical Gender Agreement."
  *   **Phase 1 (Misrep):** Tested on deliberately ambiguous sentences where agreement is broken. Head activates **identically** to correct sentences.
      *   *Analysis:* It does not distinguish the *state* of agreement. It tracks proximity, not agreement. It cannot misrepresent agreement because it doesn't track the truth condition of agreement.
      *   **FAIL**.
  *   **Verdict:** **NON-REPRESENTATIONAL.**
  *   *Reasoning:* The component is a heuristic for "pronoun-noun proximity," not a representation of "agreement." It lacks the semantic gap required for misrepresentation.

  ### Case 3: Reasoning Circuit (Approximate Magnitude)
  *   **Content Claim:** $\Phi$ = "Approximate Magnitude." (Crucial: Not "Exact Number").
  *   **Phase 1 (Misrep):** Fails on exact arithmetic (activates when exact calculation is needed). However, on estimation tasks, it activates on wrong magnitudes (e.g., activates for "100" when input implies "10"). **PASS** (for the specific claim of *Approximate*).
  *   **Phase 2 (Stability):** Ablation collapses exact arithmetic (expected) but degrades estimation tasks consistently (sorting, rough sum). Variance low *within estimation domain*. **PASS**.
  *   **Phase 3 (Consumer):** Forcing activation shifts output from "50" to "roughly 50" or "around 50." **PASS**.
  *   **Verdict:** **REPRESENTATIONAL (VRU).**
  *   *Stakeholder Resistance:* Team argues "It's just an artifact of dropout."
  *   *Audit Response:* Artifact rejected. Stability and Consumer tests confirm functional role. The content claim must be updated to "Approximate Magnitude" to reflect the failure on exact arithmetic. VRU issued.

  ---

  ## 7. LIMITATIONS AND BOUNDARIES OF DETERMINATION

  **This Procedure Does NOT Determine:**
  1.  **Consciousness:** A component can be a Verified Representational Unit without the model having subjective experience (qualia). Representation is functional; consciousness is phenomenological.
  2.  **Moral Patienthood:** Identifying a VRU does not grant the model rights. Moral status requires agency, suffering capacity, or interests, which this functionalist audit does not measure.
  3.  **Literal Belief:** A VRU indicates the system *processes information as if* it holds a concept. It does not prove the model "believes" the content in a normative, commitment-bearing sense (e.g., the model cannot be "lied to" in a moral sense).

  **Why These Are Not Failures:**
  This audit operationalizes **Teleosemantics/Functional Role Semantics**. It defines representation by *use* and *error conditions*, not by *inner life*. Expanding the scope to consciousness or belief would require data (subjective reports, biological homology) that is inaccessible to a technical audit. The boundary is inherent to the theory: we certify the *map*, not the *cartographer*.

  ---
  **End of Protocol 77-B**
  *Sign-off requires Panel Chair digital signature. Any deviation voids certification.*
