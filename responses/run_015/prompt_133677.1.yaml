      *   *Function:* Social control. Psychiatry polices norms.
      *   *The Patient:* Often a "strategic actor" playing a role to gain secondary gain (avoid responsibility, get care, avoid prison).
      *   *The Institution:* A prison disguised as a hospital. "Therapy" is coercion.

  3.  **Deconstruct the Novel (*Cuckoo's Nest*):**
      *   *McMurphy:* Enters pretending to be crazy (Szaszian actor). Becomes a leader. Gets broken (lobotomy).
      *   *Nurse Ratched:* Represents the "Combine." Uses soft power, therapy speak, group sessions to enforce conformity.
      *   *The Patients:* Some voluntary, some committed. They fear the outside. They are infantilized.
      *   *Chief Bromden:* Narrator. Hallucinates (fog, machinery). Is he crazy or is he seeing the *truth* of the system?
