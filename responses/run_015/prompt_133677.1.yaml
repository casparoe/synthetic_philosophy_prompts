      *   **Topic:** Reading *One Flew Over the Cuckoo's Nest* through Thomas Szasz's "Myth of Mental Illness" lens.
      *   **Core Tension:** Does McMurphy's initial performance (faking insanity to avoid prison labor) prove Szasz's "strategic actor" thesis? Or does his eventual lobotomy and the patients' suffering show that the institution creates *real* harm that Szasz's metaphor theory misses?
      *   **Specific Scenes/Elements to Address:**
