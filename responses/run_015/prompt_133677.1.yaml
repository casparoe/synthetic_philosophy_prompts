      *   Ratched's Language: She talks about "therapy" and "adjustment," but it's clearly about obedience. Szasz would cheer this depiction.
      *   Voluntary Patients: The scene where they realize they are trapped confirms Szasz's view that the hospital is a prison. The "contract" is a lie.
      *   No Diagnoses: Kesey never says McMurphy has schizophrenia or bipolar. He's just "disruptive." This aligns with Szasz's idea that diagnoses are moral judgments, not medical facts.

  5.  **Synthesize: Where they clash (The Limits of Szasz):**
      *   *Suffering is Real:* Szasz says the *illness* is a myth, but Kesey shows the *pain* is literal. The lobotomy isn't a metaphor; it's flesh-and-blood destruction. Szasz risks minimizing the subjective agony of the patients.
      *   *Bromden's Fog:* Bromden isn't just acting. He's traumatized. His hallucinations are a coping mechanism for real oppression. Szasz might call this "playing crazy," but Kesey treats it as a valid, albeit painful, reality.
      *   *The "Cure":* For Szasz, leaving the institution is the cure. In the book, leaving isn't enough (some patients can't function). McMurphy has to die to free them. It suggests the damage goes deeper than just "being locked up."
      *   *Gender/Power:* Szasz focuses on State vs. Individual. Kesey adds Male vs. Female (emasculation). Ratched isn't just a doctor; she's a "mother" figure castrating men. Szasz doesn't really deal with the psychosexual dynamics of power, just the legal/coercive ones.

