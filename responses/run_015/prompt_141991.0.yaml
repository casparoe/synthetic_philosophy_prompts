answer: |-
  This is a sharp observation that cuts to the tension between *ontological priority* and *conceptual autonomy*. You have identified a structural friction in non-reductive grounding claims: the ground is supposed to explain the grounded, yet the ground cannot be *picked out* without the grounded.

  Here is the carving you requested.

  ### 1. Is this one phenomenon or several?
  It is **one structural phenomenon** that manifests across different domains (philosophy of mind, metaethics, special sciences). The structure is invariant:
  1.  **Ontological Claim:** $F$ is grounded in $G$ (where $G$ is more fundamental).
  2.  **Demotion Claim:** $F$ is "nothing over and above" $G$ (ontological free lunch).
  3.  **Specification Constraint:** The specific instance of $G$ that serves as the ground for $F$ cannot be individuated or specified without invoking the concept $F$ (or its functional role).

  While the *reasons* for the specification constraint differ (multiple realizability in pain; normative supervenience in ethics), the logical form of the problem is identical. It is a problem of **referential access to the base**.

  ### 2. Specification, Vocabulary, or Relata?
  It is primarily a problem about the **individuation of the relata**, specifically the *ground* (the base).

  *   **Not merely vocabulary:** It is not just that we lack $G$-words. It is that the $G$-facts *under the description required to make them grounds* are not available in $G$-vocabulary. The microphysical facts exist independently of pain, but the *subset* of microphysical facts that constitute *this* pain is not a natural kind in microphysics.
  *   **Not the relata themselves:** The relata ($F$-fact and $G$-fact) are well-defined. The problem is the *linking condition*. To assert "$G_1$ grounds $F_1$," you must identify $G_1$. If $G_1$ is identified as "the physical realizer of $F_1$," the identification condition contains $F$.

  This creates a decoupling between **Ontological Fundamentality** (what exists independently) and **Conceptual Fundamentality** (what is required to describe the world's structure). Your intuition is that if $F$ is required to specify the $G$-base, $F$ retains a form of conceptual fundamentality that undermines the spirit of "demotion."

  ### 3. Scope: Does it arise for every grounding claim?
  No. It arises specifically in **Functional or Disjunctive Grounding**.

  *   **Identity Grounding (No Problem):** "The fact that the water is boiling is grounded in the fact that the H₂O molecules have mean kinetic energy $k$." We can specify the kinetic energy without referencing "boiling." The base is a natural kind in the fundamental vocabulary.
  *   **Functional Grounding (Problem Arises):** "The fact that the system is in pain is grounded in physical state $P$." We specify $P$ not by its microphysical coordinates alone (which are scattered and arbitrary), but by its causal role *relative to pain*.
  *   **Normative Grounding (Problem Arises):** "The act is wrong because it causes suffering." We identify the natural base (suffering) as the ground of wrongness only because we already accept the moral truism linking suffering to wrongness.

  The phenomenon arises whenever the higher-level kind ($F$) is **projectible** (supports counterfactuals, laws) while the lower-level base ($G$) is **heterogeneous** relative to $F$.

  ### 4. Comparison with Nearest Named Phenomena
  You mentioned several; here is how your phenomenon differs:

  *   **Bridge Laws:** Bridge laws ($F \leftrightarrow G$) assert a connection. Your problem is that the *statement* of the connection requires $F$. Bridge laws are often viewed as contingent identities; your case suggests the *identification* of the RHS depends on the LHS.
  *   **Supervenience:** Supervenience is a modal claim (no $F$-difference without $G$-difference). It is compatible with your problem but doesn't capture it. Supervenience allows the base to be specified independently; your problem is that it *cannot* be.
  *   **Realization:** Realization (functionalism) *presupposes* your phenomenon. To say "$P$ realizes Pain" is to say "$P$ fills the Pain-role." Your observation is that this makes the "demotion" of Pain suspect, because the role is indispensable. Realization is the *mechanism*; your phenomenon is the *cost* of that mechanism for fundamentality.
  *   **Nothing-Over-and-Above:** This is the slogan being threatened. If the base requires the grounded for specification, the grounded is "something over and above" the base *conceptually*, even if not *ontologically*.
  *   **Grounding Opacity:** (Fine, 2012). Opacity usually means substitution of co-referential terms fails in grounding contexts. Your problem is stronger: substitution is impossible because there *are* no co-referential fundamental terms available to pick out the base.

  ### 5. The Concept: Base-Individuation Dependence
  Since no single established term captures the tension between *ontological demotion* and *identificatory dependence*, I propose the following conceptual tool to carve this out.

  **Name:** **Base-Individuation Dependence (BID)**

  **Definition:**
  A grounding claim "$F$ is grounded in $G$" exhibits Base-Individuation Dependence if and only if:
  1.  $G$ is ontologically fundamental relative to $F$.
  2.  The specific instance $g$ (where $g$ is a $G$-fact) cannot be individuated or specified in a complete fundamental vocabulary without reference to $F$ or $F$'s functional role.
  3.  Consequently, the explanatory priority of $G$ over $F$ is ontological, but the *discursive priority* of $G$ over $F$ fails.

  **Case that falls under it:**
  *   **Pain:** The claim "C-fiber firing grounds pain."
      *   *Ontology:* C-fibers are fundamental; pain is derivative.
      *   *BID:* To pick out *which* C-fiber firing counts as the ground, we must describe it as "the firing that causes pain-behavior/aversion." Without the concept "pain," the C-fiber firing is just one among quadrillions of physical events with no special status. The base is individuated via the grounded.

  **Similar-looking case that does NOT fall under it:**
  *   **Mass (in Classical Mechanics):** The claim "An object's having mass $m$ is grounded in its resistance to acceleration $a$ under force $F$."
      *   *Ontology:* Dispositional properties might be grounded in categorical bases.
      *   *No BID:* We can specify the categorical base (the specific arrangement of particles/fields) without referencing "mass." The base is a natural kind in the lower-level theory. The lower level can "see" its own work without the higher-level concept.

  ### 6. Implication for Fundamentality
  If BID holds, the "demotion" is incomplete. It suggests a **Dual-Aspect Fundamentality**:
  1.  **Ontological Fundamentality:** $G$ makes $F$ exist. ($G$ wins).
  2.  **Conceptual Fundamentality:** $F$ is required to describe the structure of $G$. ($F$ wins).

  If the fundamental story can only be told using the vocabulary of the derivative level, the derivative level is not fundamental *in the world*, but it is fundamental *in the theory*. This preserves the autonomy of the special sciences (or ethics) not as a claim about *objects*, but as a claim about *individuation conditions*. The "demotion" licenses removing $F$ from the *inventory of being*, but not from the *index of the inventory*.
