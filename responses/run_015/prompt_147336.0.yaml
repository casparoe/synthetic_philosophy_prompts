answer: |-
  **Final Exam: Folk Concepts and Moral Judgment**
  **Time Allowed: 75 Minutes**
  **Total Marks: 25**

  **Question 1**
  **Scenario:** A lead engineer at an AI lab signs off on a new ranking system. Five conditions vary two factors: (1) **Side Effect Valence** (Harmful: increased polarization; Helpful: increased local turnout; Inert: forced datacenter migration); (2) **Instrumental Role** (Reason: team would cancel rollout without this effect; No-Reason: team would rollout anyway, effect unweighted).

  **Part 1 (5 marks):** Predict the percentage of subjects attributing 'intentionality' to the engineer for bringing about the side effect in all five conditions. Justify using standard accounts (pragmatic, normative, reasons-based, bias).

  **Part 2 (Stipulated Data):** Empirical results show: Harm/No-Reason (80% Intentional); Help/No-Reason (20%); Harm/Reason (80%); Help/Reason (80%); Inert/Reason (80%); Inert/No-Reason (20%).

  **Part 3 (10 marks):** Analyze which standard accounts survive this data. If none fully explain the interaction, construct a fourth account. Provide a specific falsifiable prediction for your account.

  **Part 4 (5 marks):** A review board drafts a liability rule blocking deployment when a team 'intentionally' causes harm. Should the rule track the folk concept, stipulate a technical definition, or abandon the distinction? Name the specific decision-relevant quantity the rule should track (e.g., counterfactual dependence) and justify why that quantity matters for liability.

  *Note: Do not cite researchers or papers. All necessary empirical claims are above.*

  ***

  **Model Answer**

  **Part 1: Predictions**
  Standard accounts diverge here. The **Normative Account** predicts high intentionality for Harm (blame drives attribution) and low for Help/Inert, regardless of Instrumental Role. The **Reasons-Based Account** predicts high intentionality whenever the effect is a **Reason** (the outcome reflects the agent's deep self/values), regardless of Valence. The **Pragmatic Account** mirrors the Normative view but treats it as conversational implicature rather than conceptual content. The **Bias Account** predicts high intentionality across the board, with errors only on Help due to motivated cognition. A synthesized prediction expects the Knobe effect (Harm > Help) in No-Reason conditions, but convergence in Reason conditions.

  **Part 2 & 3: Analysis and New Account**
  The stipulated data reveals that Valence matters *only* when there is no Instrumental Role. In No-Reason conditions, Harm (80%) exceeds Help/Inert (20%). In Reason conditions, all Valences hit 80%.
  The **Normative** and **Pragmatic** accounts fail because they cannot explain why Help and Inert effects become "intentional" simply by being instrumental; they predict Valence should dominate. The **Bias Account** fails because it cannot explain the low attribution in Help/No-Reason. The **Reasons-Based Account** partially survives (it predicts the Reason main effect) but fails to explain why Valence modulates the No-Reason condition. If intentionality tracks the "deep self," why does morality matter when the agent doesn't care about the outcome?

  **New Account: The Default-Reason Hypothesis.**
  Folk intentionality tracks whether an outcome was part of the agent's decision procedure. When an explicit Instrumental Role is absent, folk psychology imputes a "Default Reason" based on moral valence (assuming agents avoid harm and seek help). When an explicit Instrumental Role is present, it overrides the Default.
  *Prediction:* If we introduce a condition where the agent explicitly *opposes* the side effect but it occurs anyway (Negative-Reason), intentionality attributions should drop to 0% even for Harmful effects, overriding the moral default.
  *Falsifier:* If subjects attribute high intentionality to Harmful effects even when the agent explicitly tried to prevent them (and succeeded in preventing them, yet they occurred via weird causality), the Default-Reason Hypothesis is false.

  **Part 4: Applied Policy**
  The rule should **stipulate a technical definition** rather than track the folk concept. The folk concept conflates moral blame with causal structure, creating noise in liability assessments. The decision-relevant quantity is **Counterfactual Dependence of the Deployment Decision on the Outcome**.
  *Justification:* Liability aims to incentivize safety. If the deployment decision counterfactually depends on the harm (i.e., they needed the harm to ship), the team is incentivized to produce harm. If the decision does not depend on the harm (side effect), liability should track negligence standards, not intentional torts. Using the folk term "intentional" invites jurors to punish based on outcome severity rather than decision structure. We must replace the word with the mechanism: "Did the project proceed *because* of this outcome?" This quantity is checkable via internal communications and code weights, whereas "intentional" is a post-hoc moral judgment.

  **Concept vs. Word:**
  Where the asymmetry is robust (No-Reason conditions), it is evidence about the **concept** of intentionality being partly normative. Where it disappears (Reason conditions), it is evidence about the **English word** being sensitive to instrumental context. We steelman the folk: they are not confused; they are using a efficient heuristic for detecting agency that prioritizes moral defaults when explicit goals are opaque.

  ***

  **Marking Scheme (25 Marks)**

  **1. Discriminating Predictions (5 marks)**
  *   **Must Hit:** Predictions must vary by account (e.g., Normative predicts Valence effect everywhere; Reasons-based predicts Instrumental effect everywhere).
  *   **Fumble:** Listing accounts without linking them to specific condition outcomes (e.g., "Normative says morality matters" without saying which condition gets high %).
  *   **A/B Boundary:** A answer assigns specific percentages/trends per condition per account; B answer lists account definitions.

  **2. Factor Identification (5 marks)**
  *   **Must Hit:** Correctly identify that Instrumental Role is the primary driver in the stipulated data, but Valence modulates the No-Reason baseline.
  *   **Fumble:** Claiming the data supports the Normative account because Harm/No-Reason is high (ignoring Help/Reason).
  *   **A/B Boundary:** A answer notes the interaction effect; B answer notes only the main effects.

  **3. New Account + Falsifier (5 marks)**
  *   **Must Hit:** Construct a mechanism (e.g., Default-Reason) that explains the interaction. Provide a specific outcome that would prove it wrong.
  *   **Fumble:** Renaming an existing account (e.g., "It's just Reasons-based") or offering a non-falsifiable prediction (e.g., "People will feel differently").
  *   **A/B Boundary:** A answer provides a checkable empirical prediction; B answer offers a plausible-sounding narrative without a falsifier.

  **4. Applied Move (Decision-Relevant Quantity) (5 marks)**
  *   **Must Hit:** Name a technical quantity (e.g., Counterfactual Dependence) and justify it based on incentives/liability goals, not semantic clarity.
  *   **Fumble:** Saying "It depends on what you mean by intentional" or "We should follow the law."
  *   **A/B Boundary:** A answer operationalizes the rule; B answer discusses the difficulty of definition without solving it.

  **5. Concept vs. Word / Steelmanning (5 marks)**
  *   **Must Hit:** Explicitly distinguish where the data reflects the concept structure vs. linguistic usage, and treat folk respondents as rational heuristic users.
  *   **Fumble:** Dismissing folk judgments as "confused" or "biased errors."
  *   **A/B Boundary:** A answer integrates the distinction into the analysis; B answer mentions it in passing or not at all.

  **Honest Note on Model Answer:**
  The "Default-Reason Hypothesis" is likely a repackaging of the "Trade-off Justification" view found in existing literature (e.g., Sripada), though presented here as novel for exam purposes. The falsifier relies on a specific causal chain that may introduce confounding variables (e.g., perceived competence) rather than purely testing intentionality.
