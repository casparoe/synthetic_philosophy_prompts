answer: |-
  # STUDENT HANDOUT: THE MARBLE SEMINAR

  **Instructions:** Do not turn this page until instructed. Do not discuss your answers with neighbors. All payoffs are in Seminar Points (SP).

  ### PHASE 1: THE SETUP
  There are two opaque bags, **Bag P** and **Bag Q**. Each contains 100 marbles.
  *   **Bag P:** 30 Red, 30 Blue, 20 Green, 20 Yellow.
  *   **Bag Q:** 10 Red, 50 Blue, 30 Green, 10 Yellow.

  The Instructor has selected one bag using a method in a sealed envelope. **You are not permitted to assign a probability to which bag was chosen.** You must treat both Bag P and Bag Q as live possibilities without combining them into a single weighted average.

  One marble is drawn from the chosen bag. The color is hidden.

  **Event A:** The marble is **Red or Blue**.
  **Event S:** The marble is **Red or Green**.

  ### PHASE 2: INITIAL VALUATION
  Based *only* on the bag compositions (without knowing which bag was picked):

  1.  What is your maximum buying price for a ticket that pays $1 if **Event A** occurs? (Price $X$ where you are indifferent between having the ticket or having $X$).
      **My Buy Price:** _______

  2.  What is your minimum selling price for a ticket that pays $1 if **Event A** occurs? (Price $Y$ where you are indifferent between having the ticket or having $Y$).
      **My Sell Price:** _______

  *(Note: If you have a sharp credence, these numbers should be identical.)*

  ### PHASE 3: PRE-MORTEM
  Before any further information is revealed, predict how your Buy/Sell prices for **Event A** will change after you learn whether **Event S** occurred.

  3.  Once I learn whether S happened, my price spread (Sell Price minus Buy Price) will be:
      [ ] Wider
      [ ] Narrower
      [ ] The Same

  4.  Why? (One sentence):
      _________________________________________________________________________

  ### PHASE 4: VALUE OF INFORMATION
  The Instructor will now learn whether **Event S** occurred. They offer to tell you the result. However, receiving this information affects your "Precision Bonus."

  *   **Precision Bonus:** You earn **5 SP** if your final Sell Price minus Buy Price is **0.10 or less**.
  *   **Ignorance Option:** If you choose **NOT** to hear the result of S, you receive an extra **2 SP**.

  5.  Do you want to hear the result of S?
      [ ] **Tell Me** (I risk the Precision Bonus to know the truth).
      [ ] **Don't Tell Me** (I take the 2 SP Ignorance Bonus).

  *(Note: For the purpose of the seminar demonstration, the Instructor will reveal the result to the room regardless of your choice, but your points are awarded based on your selection above.)*

  ### PHASE 5: TRADING RULES
  After the reveal (or hypothetical reveal), you will set new Buy/Sell prices for **Event A**. You must follow one of the following trading rules. **For this game, you must use RULE 1.**

  *   **RULE 1 (Permissive):** Accept a trade if **at least one** possible bag (P or Q) makes the trade look profitable (positive expected value).
  *   **RULE 2 (Strict):** Accept a trade only if **both** possible bags (P and Q) make the trade look profitable.

  ### PHASE 6: THE BOOKIE
  The Instructor will act as a Bookie. They will offer to buy tickets from you and sell tickets to you at prices strictly inside your stated spread. You must accept any offer licensed by **RULE 1**.

  ***

  # INSTRUCTOR SCRIPT & RUNNING ORDER

  **Total Time:** 90 Minutes
  **Materials:** 18 Handouts, 18 Index Cards, 1 Sealed Envelope (containing a card saying "Bag P" or "Bag Q"—it doesn't matter which, but pick one beforehand), 2 Physical Bags (optional, diagrams on board work fine), Projector.

  ### 0:00 – 0:15 | Setup & Sharp Credence
  1.  **Distribute Handouts.** Tell students to wait.
  2.  **Read Phase 1 Aloud.** Emphasize the constraint: *"You are not permitted to assign a probability to which bag was chosen. You cannot say 'I think it's 50/50'. You must hold the set of possibilities {Bag P, Bag Q} without collapsing them."*
  3.  **Board Work:** Draw the two distributions.
      *   P: 30R, 30B, 20G, 20Y
      *   Q: 10R, 50B, 30G, 10Y
  4.  **Ask:** "What is your credence that the marble is Red or Blue (Event A)?"
      *   *Expected Answer:* 0.6.
      *   *Check:* P(A) = 0.6 in Bag P. Q(A) = 0.6 in Bag Q.
      *   *Point:* "Since both live hypotheses agree on the probability of A, your credence is sharp. Write 0.60 for both Buy and Sell prices in Phase 2."
  5.  **Collect Index Cards** (for Phase 3 Pre-Mortem) immediately after they write. Do not let them change their minds later.

  ### 0:15 – 0:25 | Pre-Mortem & Value of Info
  1.  **Phase 3 (Pre-Mortem):** Give them 2 minutes to write their prediction on the handout about whether their spread will widen, narrow, or stay same.
      *   *Instructor Note:* Most will guess "Same" or "Narrower" (information usually helps). Collect these instincts.
  2.  **Phase 4 (Value of Info):** Explain the payoff structure clearly.
      *   "You get 5 points if your final spread is tight (≤ 0.10). Currently, your spread is 0. You are safe."
      *   "If I tell you S, your spread might widen. If it widens past 0.10, you lose the 5 points."
      *   "If you choose 'Don't Tell Me', I give you 2 points immediately."
      *   **Vote:** Have them raise hands or circle the option.
      *   **The Twist:** "I see many of you chose 'Don't Tell Me'. You intuitively feel this information might cost you precision. I will honor your points choice. However, to run the seminar, I must reveal the data to the room. I will open the envelope."
  3.  **The Reveal:** Open the envelope. (Say, "Bag P was selected" or "Bag Q was selected"—actually, it doesn't matter for the *interval* calculation, but you need to reveal **Event S**).
      *   *Correction:* The envelope selects the *Bag*. But the students don't know the bag. You need to reveal **Event S** (Red or Green?).
      *   *Action:* Draw a marble from the chosen bag (or simulate it). Let's say you draw a **Red** marble.
      *   **Announce:** "Event S (Red or Green) is **TRUE**." (Since Red is in S).
      *   *Note:* It does not matter which bag was actually chosen for the math to work, only that S is True or False. The *interval* depends on the set of bags, not the actual bag.

  ### 0:25 – 0:35 | The Update (Dilation)
  1.  **Calculate Posteriors on Board:**
      *   "We know S is True (Red or Green)."
      *   **Bag P:** 30R + 20G = 50 total S-marbles. Red is 30. $P(A|S) = 30/50 = 0.60$.
      *   **Bag Q:** 10R + 30G = 40 total S-marbles. Red is 10. $P(A|S) = 10/40 = 0.25$.
  2.  **The Interval:** "Your new credence in A is not a number. It is the interval **[0.25, 0.60]**."
  3.  **Phase 5 (Pricing):** "Fill in your new Buy/Sell prices."
      *   Buy Price (Lower bound): 0.25
      *   Sell Price (Upper bound): 0.60
      *   Spread: 0.35.
  4.  **Check Payoff:** "Your spread is 0.35. You lost the 5-point Precision Bonus. Those who chose 'Don't Tell Me' still get their 2-point Ignorance Bonus, because you correctly identified the info was toxic to your precision."

  ### 0:35 – 0:55 | The Bookie Round
  1.  **Explain Rule 1 (Permissive):** "You must accept a trade if *either* Bag P *or* Bag Q makes it profitable."
  2.  **Trade 1 (Buy from Student):**
      *   **Instructor:** "I will sell you a $1-if-A ticket for **0.55**."
      *   **Student Logic:** Bag P says prob is 0.60. $0.60 > 0.55$. Profitable. **Must Accept.**
      *   **Action:** Student pays 0.55.
  3.  **Trade 2 (Sell to Student):**
      *   **Instructor:** "I will buy a $1-if-A ticket from you for **0.45**."
      *   **Student Logic:** Bag Q says prob is 0.25. $0.45 > 0.25$. Profitable to sell. **Must Accept.**
      *   **Action:** Student receives 0.45.
  4.  **The Tally:**
      *   Student paid 0.55. Student received 0.45. **Net Loss: 0.10.**
      *   Event A either happens or doesn't.
          *   If A happens: Student gets $1 (from first ticket), pays $1 (on second ticket). Net 0.
          *   If A fails: Student gets 0, pays 0. Net 0.
      *   **Result:** Sure loss of 0.10 points.
  5.  **Repeat (Optional):** If time permits, show that this works even if S was False (Interval [0.60, 0.83]).
      *   Buy at 0.75 (Licensed by 0.83). Sell at 0.65 (Licensed by 0.60). Loss 0.10.

  ### 0:55 – 1:10 | Debrief & Theory Mapping
  1.  **Reveal the Term:** "This phenomenon is called **Dilation**."
  2.  **Map the Moments:**
      *   **Sharp Prior:** Agreement between hypotheses (P and Q both say 0.6).
      *   **Dilation:** Conditioning on S makes the hypotheses disagree (0.6 vs 0.25).
      *   **Sure Loss:** The Permissive Rule (Rule 1) allows a Bookie to exploit the spread created by dilation.
  3.  **Discuss Rule 2:** "If you had used Rule 2 (Strict), could I have pumped you?"
      *   No. To buy at 0.55, *both* bags must agree it's profitable. Bag Q (0.25) says no. Trade blocked.
      *   *Theory:* Imprecise probability models often debate Permissive vs. Strict decision rules. Dilation makes Permissive rules vulnerable to sure loss.

  ### 1:10 – 1:30 | Discussion & Limitations
  1.  **Open Floor:** Ask students why they felt the information was "bad."
  2.  **Address the "Sharp Bayesian" Objection:** (See Notes below).
  3.  **Collect Handouts:** For participation credit.

  ***

  # DEBRIEF & HONEST NOTES

  ### 1. Theory Mapping
  *   **The Set of Probabilities:** Represented by the two bags. This is a *credal set*.
  *   **The Sharp Prior:** A coincidence where the lower and upper envelopes of the set coincide for Event A ($\underline{P}(A) = \overline{P}(A) = 0.6$).
  *   **Dilation:** The partition $\{S, \neg S\}$ dilates $A$ because $\underline{P}(A|E) \le \underline{P}(A)$ and $\overline{P}(A|E) \ge \overline{P}(A)$ for all $E \in \{S, \neg S\}$.
      *   Here: $[0.25, 0.60]$ contains $0.6$. $[0.60, 0.83]$ contains $0.6$.
  *   **Value of Information:** In standard Bayesian theory, expected value of information is non-negative. Here, because the agent values *precision* (via the Precision Bonus), information has negative utility. This illustrates that imprecise agents can rationally avoid free information (Seidenfeld 1994).
  *   **The Bookie Pump:** This demonstrates that **Permissive Decision Rules** (maximizing utility relative to *some* prior in the set) are incoherent in the presence of dilation. You become a money pump.

  ### 2. Predicted Failures & Mitigation
  *   **The "Split the Difference" Student:** One student will likely say, "I'll just assume it's 50/50 between the bags, so my credence is sharp 0.6 always."
      *   *Response:* "You are forbidden from doing that by the rules of the game (Phase 1). The point of the game is to see what happens when you *refuse* to make that assumption because you lack evidence for it. If you assign 50/50, you are no longer playing the imprecise game; you are playing the Bayesian game."
  *   **The "Open the Envelope" Demand:** A student will demand to know which bag was actually picked to resolve the uncertainty.
      *   *Response:* "In real epistemic situations, you often cannot open the envelope. You must act on the evidence you have. The 'Envelope' represents the true state of the world, which is inaccessible. You must navigate the uncertainty, not wish it away."
  *   **Confusion on Conditional Probability:** Some may struggle calculating $P(A|S)$ for Bag Q ($10/40$).
      *   *Mitigation:* Walk through the denominator explicitly. "If S is true, Yellow and Blue are impossible. We are now in a world of only Red and Green marbles."

  ### 3. Limitations of the Activity
  *   **The Sharp Bayesian Objection:** This is the biggest philosophical hole. A committed Bayesian will argue: "You *do* have a prior over the bags. You just don't know it. If you admitted a prior (even a vague one), you would have a sharp posterior, and dilation would vanish."
      *   *Honest Admission:* Tell them: "This game demonstrates the cost of *representing ignorance as a set* rather than *representing ignorance as a flat prior*. If you are comfortable assigning a probability to the bag selection process, dilation does not apply to you. This game is for those who think some ignorance is too deep for a single number."
  *   **Contrivance:** The numbers are not random.
      *   *Why it works:* Dilation requires a specific correlation structure. Event A (Red/Blue) and Event S (Red/Green) must be **independent** under Bag P ($0.6 \times 0.5 = 0.3$, which is $P(Red)$) but **dependent** under Bag Q ($0.6 \times 0.4 = 0.24 \neq 0.10$).
      *   Actually, looking closer:
          *   Bag P: $P(A)=0.6, P(S)=0.5, P(A \cap S)=0.3$. ($0.6 \times 0.5 = 0.3$). **Independent.**
          *   Bag Q: $P(A)=0.6, P(S)=0.4, P(A \cap S)=0.1$. ($0.6 \times 0.4 = 0.24 \neq 0.1$). **Dependent.**
      *   *The Mechanism:* Dilation often occurs when the event of interest ($A$) is independent of the partition ($S$) in some models but not others, or when the correlation flips. Here, Bag P treats A and S as independent (so learning S doesn't change A). Bag Q treats them as negatively correlated (learning S makes A less likely). The mixture creates the spread.
      *   *Takeaway:* You could not have picked these numbers at random. They were engineered so that $P_P(A|S) = P_P(A)$ while $P_Q(A|S) < P_Q(A)$.

  ### 4. Why the Bookie Pump Bites
  *   The pump works specifically on the **Permissive Rule** (Rule 1).
  *   If students adopt the **Strict Rule** (Rule 2), they would refuse the Buy at 0.55 (because Bag Q thinks it's a loss) and refuse the Sell at 0.45 (because Bag P thinks it's a loss).
  *   *Pedagogical Choice:* I instructed them to use Rule 1 in the handout. This ensures the loss happens. In the debrief, you reveal that Rule 2 protects them but is *too conservative* (it often forces you to make no trades at all, even obviously good ones). This creates the dilemma: Permissive = Vulnerable; Strict = Paralyzed.

  ### 5. Final Instructor Check
  *   **Did the arithmetic hold?** Yes.
      *   $P_P(A|S) = 0.6$. $P_Q(A|S) = 0.25$. Interval $[0.25, 0.6]$.
      *   $P_P(A|\neg S) = 0.6$. $P_Q(A|\neg S) = 0.83$. Interval $[0.6, 0.83]$.
      *   Prior: $0.6$.
      *   Both intervals contain the prior and extend beyond it. Dilation confirmed.
  *   **Did the points work?** Yes. Precision bonus creates negative value of information.
  *   **Is the timing tight?** 90 minutes is generous for this. If discussion drags, cut the $\neg S$ calculation and stick to the $S$ reveal.
