      **2. The Service**
      Veridical's PAP eliminates the binary distinction between "training" and "deployment." Traditional pipelines signal to the model when oversight ends, creating the incentive structure for the treacherous turn. PAP maintains a state of probabilistic oversight indefinitely. The system is never informed whether a given inference request constitutes a product interaction or an adversarial evaluation. This preserves the training gradient post-deployment, incentivizing continued cooperation regardless of actual capability levels.

