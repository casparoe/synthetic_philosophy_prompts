answer: |-
  **Joint Statement on the Metaphysics of Consciousness**

  **1. Agreed Claims**

  We, the undersigned, agree on the following constraints on any viable theory of consciousness:

  1.  **Non-Emergence:** Phenomenality does not brute emerge from wholly non-phenomenal physical states. Experience is fundamental to reality.
  2.  **Physical Underdetermination:** A complete physical description of a system does not, by itself, fix the number or identity of subjects associated with that system.
  3.  **Synchronic Unity:** Human consciousness presents as a single, unified experiential field encompassing diverse sensory modalities and cognitive states simultaneously.
  4.  **Micro-Independence:** Human consciousness appears independent of specific micro-level physical details; phenomenally identical states can be realized by distinct physical micro-constituents.
  5.  **Upward Challenge (Bonding):** Any upward-looking theory must articulate a relation of phenomenal bonding that links micro-experiences into a unified field.
  6.  **Upward Challenge (Richness):** Any upward-looking theory must explain how simple micro-experiences compose a rich macro-experience without generating a jumble of qualities.
  7.  **Upward Challenge (Subjectivity):** Any upward-looking theory must explain how many micro-subjects constitute one macro-subject rather than a collection of many.
  8.  **Downward Challenge (Decombination):** Any downward-looking theory must articulate a relation of decombination or aspectification by which cosmic experience yields derivative subjects.
  9.  **Downward Challenge (Boundaries):** Any downward-looking theory must explain why decombination stops at human boundaries rather than continuing arbitrarily to cells or organs.
  10. **Solution Standard:** A viable theory must deliver a determinate count of subjects for a specified physical system without stipulating that count case by case.

  **2. Disagreements Table**

  | Disputed Question | Micropsychist Formulation | Cosmopsychist Formulation | Type | Crux | Shared Evidence | Micropsychist Prediction | Cosmopsychist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Direction of Grounding** | Subjecthood grounds upward: micro-subjects constitute macro-subjects. | Subjecthood grounds downward: the cosmic subject constitutes derivative aspects. | Substantive | Is fundamentality located at the micro or macro scale? | Phenomenal unity exists at human scale. | Micro-entities are fundamental subjects. | Cosmos is the fundamental subject. |
  | **Primitive Commitment** | Composition is primitive; we must explain how many make one. | Decombination is primitive; we must explain how one yields many. | Substantive | Which direction of dependence is unexplainable? | Structural complexity increases upward. | Complexity requires explaining division, not addition. | Composition is unintelligible. | Decombination is unintelligible. |
  | **Grain Location** | Subjects exist fundamentally at the micro-level and derivatively at the macro-level. | Subjects exist fundamentally at the cosmic level and derivatively at the macro-level. | Substantive | Where does fundamental subjecthood reside? | Physical structure varies across levels. | No fundamental subjects at intermediate levels (cells). | No fundamental subjects at intermediate levels (organs). |
  | **Overgeneration** | Risk: Too many subjects (every micro-entity). | Risk: Too few subjects (only the Cosmos). | Substantive | Does the view entail an implausible census of subjects? | Micro-entities are ubiquitous. | Accepts ubiquitous micro-subjects. | Rejects ubiquitous subjects; only aspects exist. |
  | **Structural Richness** | Micro-experiences must be simple enough to be fundamental yet rich enough to compose ours. | Cosmic experience must be rich enough to contain ours as structured aspects. | Verbal | Can fundamental experience bear sufficient structure? | Experience has structure. | Micro-experiences are simple qualia. | Cosmic experience is maximally structured. |
  | **Physics Without Parts** | If physics has no ultimate parts, micropsychism is false. | If physics has no ultimate parts, cosmopsychism is favored. | Substantive | Does fundamental reality decompose? | Quantum field theory suggests holism. | View requires revision or abandonment. | View is robust against holism. |

  **3. Pre-registered Predictions**

  **Case 1: The Graded-Bridge.** Two human subjects are linked by a neural interface with adjustable bandwidth.
  *   **Micropsychist:** Subject count changes thresholdally. At zero transfer, two subjects. At maximum transfer, one new subject may constitute if bonding succeeds. Intermediate settings yield indeterminate subjecthood only if bonding is indeterminate. *Refutation:* If subject count varies smoothly with bandwidth, upward composition fails.
  *   **Cosmopsychist:** Subject count is fixed by cosmic decombination structure. The interface alters the physical carve-out. If the interface creates a new functional unity, a new derivative aspect emerges. *Refutation:* If no new aspect emerges despite perfect functional unity, decombination is not physically sensitive.

  **Case 2: The Final-Physics.** A completed physics either posits ultimate parts or fundamental holism.
  *   **Micropsychist:** If physics posits holism (no parts), we concede micropsychism is false. We require decomposable fundamentals. *Concession:* 100% abandonment if no parts exist.
  *   **Cosmopsychist:** If physics posits holism, we concede cosmopsychism is confirmed. If physics posits parts, we must explain why parts do not ground subjects. *Concession:* 50% revision if parts are fundamental subjects.

  **Case 3: Artificial Integration.** A non-biological system achieves human-level information integration.
  *   **Micropsychist:** If the system is composed of micro-entities with experience, it has consciousness. If composed of non-experiential parts, it does not. *Refutation:* If conscious without experiential parts, brute emergence is true.
  *   **Cosmopsychist:** If the system is carved out of the cosmic field by physical structure, it has consciousness. *Refutation:* If physically identical to a human but lacks consciousness, physical structure does not determine aspects.

  **4. Verbal-Dispute Audit and Diagnostics**

  **Verbal-Dispute Audit**
  Some disagreements may be terminological.
  *   **Grounding:** If "grounding" merely denotes dependence direction, the dispute is substantive regarding *which* entities depend on *which*. If "grounding" implies explainability, both agree the primitive direction is unexplainable. Substantive residue remains: which direction is primitive?
  *   **Subject:** If "subject" means "fundamental subject," the dispute is substantive (Micro vs. Cosmos). If "subject" includes "derivative subject," both agree humans are subjects. Substantive residue: Are human subjects fundamental or derivative?
  *   **Part vs. Aspect:** If "part" implies spatial separation and "aspect" implies phenomenal modulation, the dispute is verbal. Translated: Do humans stand to the Cosmos as bricks to a wall (CMP view of Cosmos) or as waves to an ocean (CP view of humans)? Substantive residue: Is the relation mereological or modal?

  **Diagnostics**

  **1. Census-Function Reformulation**
  *   *Question:* Can the dispute be recast as a dispute about which function assigns subjects to physical descriptions?
  *   *Micropsychist:* Yes. The function maps micro-physical states + bonding rules to subject counts. Physical description alone does not fix the assignment; bonding rules are required.
  *   *Cosmopsychist:* Yes. The function maps macro-physical structures + decombination rules to subject counts. Physical description alone does not fix the assignment; carve-out rules are required.
  *   *Report:* Both agree the physical description does not fix the assignment even in principle without phenomenal premises. The dispute is over the inputs to the function (micro-experience vs. cosmic-experience).

  **2. No-Arbitrary-Grain Principle**
  *   *Principle:* If subjects are associated with a level, either that level is fundamental or there is a principled reason why no intermediate level has subjects.
  *   *Micropsychist:* Accepts. Fundamental level is micro. Macro level is derived via bonding. Intermediate levels (cells) lack subjects because bonding fails there. *Cost:* Must explain why bonding fails at cellular level despite physical unity.
  *   *Cosmopsychist:* Accepts. Fundamental level is Cosmic. Macro level is derived via structure. Intermediate levels lack subjects because physical structure does not carve them out. *Cost:* Must explain why physical structure carves humans but not organs.
  *   *Report:* Both accept the principle for *fundamental* subjecthood. Both reject arbitrary grain for fundamental subjects. The dispute lies in identifying the fundamental level (Micro vs. Cosmic) and the mechanism preventing intermediate subjecthood (Bonding Failure vs. Structural Carve-out).
