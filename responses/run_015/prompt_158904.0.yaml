  6.  **Refining and Polishing:**
      *   *Length:* Keep it tight. The prompt asks for a "one-page joint statement." I need to be concise.
      *   *Tone:* Avoid "I think/She thinks." Use "Task-Effects Position" and "Divergence Position."
      *   *Check Constraints:* Did I use external studies? No. Did I include predictions? Yes. Did I cover the 7 findings? Yes.
      *   *Self-Correction on Finding 2:* If differences shrink to *almost nothing* after comprehension check, that's a huge win for Task-Effects. Divergence needs a way to live with that. Divergence must argue that the comprehension check *itself* is culturally biased (Finding 3 supports this). I need to make sure the table reflects this nuance.
      *   *Self-Correction on Finding 5:* Schooling tracks means. Task-Effects says "Confounds." Divergence says "Schooling is part of culture." This is a classic "control variable vs. mechanism" fight.
      *   *Formatting:* Use clear headings. Ensure the table is readable in text format.

  7.  **Final Review against Prompt:**
      *   "Numbered section of claims both of us can sign." -> Done.
