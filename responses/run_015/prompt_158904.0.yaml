  4.  **Drafting - Section 2: The Disagreement Table:**
      *   *Row 1: Comprehension Checks.*
          *   Neutral: Role of comprehension filters.
          *   Task-Effects: Filter removes measurement error.
          *   Divergence: Filter removes culturally distinct cognitive engagement.
          *   Crux: Is failing the check a failure of *understanding* or a difference in *approach*?
          *   Test: Manipulate check difficulty/placement.
      *   *Row 2: Retest Instability.*
          *   Neutral: Meaning of 1/3 flip rate.
          *   Task-Effects: Undermines existence of stable intuition.
          *   Divergence: Shows sensitivity, not absence; cultural variance remains in the stable 2/3.
          *   Crux: Does instability invalidate the *concept* of an intuition?
          *   Test: Correlate flippers with site variance.
      *   *Row 3: Schooling vs. Culture.*
          *   Neutral: Interpretation of the schooling correlation.
