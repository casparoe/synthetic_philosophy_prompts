  DEPARTMENT OF EXECUTIVE INTEGRITY
  GREEN PAPER 44/23: OPERATIONALISING MORAL REMAINDER
  CONFIDENTIAL DRAFT

  **1. PURPOSE AND SCOPE**
  1.1 This paper outlines the statutory framework for the Dirty Hands Directorate (DHD). It is accepted that certain executive actions are morally prohibited yet politically necessary. The primary risk is routinisation: where repeated exposure normalises the violation, converting a tragic necessity into mere immorality. The DHD exists to guarantee both the act and the residue. If the agent ceases to suffer, the act becomes unjustifiable. Therefore, suffering is a key performance indicator. The state requires the action, but legitimacy requires the stain.

  **2. GUILT PRESERVATION REGIME**
  2.1 Operatives ('Hands') shall serve a single term of office. Re-appointment is prohibited, as familiarity erodes the moral weight of the violation. A second term implies the agent has accommodated the wrong, rendering them a monster rather than a servant.
  2.2 Post-action remorse is a deliverable. Hands will undergo quarterly Audits of Moral Residue. Remorse must meet the Integrity Target (IT-4).
  2.3 It is noted that Subjects often game the IT-4 by performing distress. To counter this, audit frequency will be doubled. This ensures the subject remains in a state of acute anxiety, indistinguishable from genuine remorse, though it accelerates burnout and encourages more sophisticated performative coping mechanisms. The Directorate accepts this trade-off as preferable to moral numbness.

  **3. THE NON-JUSTIFICATION CLAUSE**
  3.1 Under Section 3(a), the Hand shall not be informed of the operative reasons necessitating the act. Knowing the 'greater good' rationale allows the agent to rationalise the wrong, dissolving the guilt.
  3.2 The Directorate notes with satisfaction that this information asymmetry preserves the moral stain. It is acknowledged that this leaves the Hand unable to distinguish their duty from criminal malfeasance, but this uncertainty is constitutive of the role. A leader who knows they are right is not dirty; they are merely dangerous. The Hand must remain legally vulnerable to maintain ethical validity.

  **4. POST-SERVICE STATUS AND CREDENTIALING**
  4.1 Upon termination, the Hand must be publicly disgraced. Willingness to accept reputational destruction is the primary credential of legitimacy. The public must see the punishment to trust the necessity.
  4.2 Following public condemnation, the Hand will be quietly pensioned at Grade 7 level.^[1]
  4.3 Former Hand K. noted in exit interview: 'I still wake up sweating. That means I'm doing it right.'

  **5. RECRUITMENT AND ANNEX B**
  5.1 Annex B (Recruitment of Officials with Clean Hands) is rejected. Clean hands indicate a lack of exposure to necessary evils, rendering the candidate useless for high office.
  5.2 Furthermore, candidates expressing eagerness to serve in the DHD are automatically disqualified. Enjoyment of the burden suggests psychopathy. The Directorate is currently short-staffed due to this criterion. We require individuals who do not want the job but will take it. This paradox significantly limits the talent pool.

  **6. AUDIT AND OVERSIGHT**
  6.1 To certify that guilt is sincere, auditors must be unmoved by the content of the violations. Consequently, the Audit Unit must recruit individuals incapable of feeling guilt to accurately measure it in others. The Department will proceed with recruitment of suitable psychopathic profiles.

  **7. CONSULTANT ADVICE**
  7.1 Prof. A. V. Clemence (Retained Consultant) advises: 'The scheme is theoretically elegant; it ensures the leader pays the price without sparing the state the cost.'

  **8. QUESTIONS FOR CONSULTEES**
  8.1 Should the Integrity Target be adjusted for inflation?
  8.2 Is public disgrace sufficient, or should corporal markers be considered?
  8.3 How best to incentivise reluctance in applicants?

  ^[1] The contradiction between public disgrace and private reward is noted but deemed operationally necessary to retain talent. No resolution is proposed.
