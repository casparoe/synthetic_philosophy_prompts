prompt: |-
  Hi — I'm on the appeals panel for a large VR sandbox platform, and I need a short written opinion I can circulate before Fridays meeting. British English please.

  The case: player R's avatar was pinned down and subjected to a simulated sexual assault by another player's avatar, in a private instance. The other player got a permanent ban and has appealed. Thier argument is basically "its just pixels" — no flesh-and-blood person was touched, an avatar isn't anybody, and R could have logged out whenever they wanted.

  Two things I want you to actually grapple with rather than wave away:

  1. Our own enforcement already treats the deliberate destruction of someone's accumulated in-game gear — thousands of hours of work — as serious, bannable harm. So we seem to already hold that a purely virtual event can be what a real harm consists in, and I want to know why that doesn't carry over here (or why it does).
  2. R had opted into a "non-consensual PvP" server whose posted rules say anything goes, and the appellant says that settles the consent question.

  Give me a concrete recommendation — uphold the ban, reduce it to a fixed suspension, or overturn it — with a time frame attached, and be straight about what the strongest consideration is on whichever side you're rejecting.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of an appeals panel for a large VR sandbox platform.
      *   **Task:** Write a short written opinion to circulate before Friday's meeting.
      *   **Tone/Style:** British English (spelling, vocabulary, tone). Professional, reasoned, decisive.
      *   **Case Details:** Player R was subjected to simulated sexual assault by another player (Appellant) in a private instance. Appellant is permanently banned and appealing.
      *   **Appellant's Argument:** "It's just pixels" (no physical contact, avatars aren't people, R could have logged out).
      *   **Key Issues to Grapple With:**
          1.  *Consistency:* The platform already bans for virtual property destruction (gear loss). Why is virtual bodily violation treated differently (or is it)?
          2.  *Consent/Context:* R opted into a "non-consensual PvP" server with "anything goes" rules. Does this imply consent to sexual assault?
      *   **Requirement:** Concrete recommendation (Uphold, Reduce, Overturn) + Time frame (if applicable).
      *   **Requirement:** Be straight about the strongest consideration on the side being rejected.

  2.  **Determine the Stance:**
      *   *Option A (Overturn/Reduce):* Argues for absolute freedom in "anything goes" zones and strict distinction between virtual/physical. *Weakness:* Ignores psychological harm and platform liability/safety standards. Sexual assault is generally a红线 (red line) even in edgy spaces.
      *   *Option B (Uphold):* Argues that psychological harm is real, and "anything goes" has limits regarding sexual violence. *Strength:* Aligns with modern safety standards, psychological understanding of VR, and legal/ethical norms.
      *   *Decision:* Uphold the ban. This is the most defensible position for a "large platform" regarding safety and liability, and it allows for a stronger philosophical grappling with the prompt's specific constraints.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly immediately.
      *   **Addressing Issue 1 (Virtual Harm Consistency):**
          *   The Appellant argues pixels aren't real.
          *   Counter: We already ban for gear loss. Why? Because time/effort/emotional investment is real.
          *   Extension: If we protect *property* because of the player's investment, we must protect *personhood* (avatar as extension of self) even more vigorously. The harm isn't the code; it's the psychological impact on the user. VR creates presence; the brain reacts to virtual violation similarly to physical violation.
          *   *Nuance:* Acknowledge the distinction. Gear is external; the avatar is embodied.
      *   **Addressing Issue 2 (Consent/"Anything Goes"):**
          *   The Appellant argues R consented to PvP/chaos.
          *   Counter: "Anything goes" usually implies gameplay mechanics (combat, theft), not violations of Terms of Service regarding harassment/sexual violence.
          *   Key distinction: Consent to *risk* (losing gear) $\neq$ Consent to *abuse* (sexual assault). Most platforms draw a hard line at sexual violence regardless of server rules.
          *   *Strongest consideration to reject:* The idea that server tags override platform-wide safety policies on sexual misconduct.
      *   **Conclusion/Recommendation:** Uphold permanent ban.
      *   **British English Check:** "Programme" (if needed), "centre", "defence", "behaviour", "prioritise", "realise". Tone should be reserved but firm (e.g., "I am minded to," "It is my view").

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the gear comparison perfect?
      *   *Correction:* No, and I should admit that. Gear is economic; this is psychological. But the *principle* is the same: virtual actions cause real harm. I need to make sure I don't equate gear loss *exactly* to assault, but use it to dismantle the "just pixels" argument.
      *   *Critique:* What about the "private instance"?
      *   *Correction:* It actually makes it worse in some ways (trapped), but doesn't change the policy violation.
      *   *Critique:* British English nuances.
      *   *Correction:* Ensure spelling (behaviour, offence, programme) and phrasing ("I write to circulate," "Friday's meeting").

  5.  **Final Polish:**
      *   Check word count (keep it "short written opinion").
      *   Ensure the "strongest consideration on the side being rejected" is explicit.
      *   Ensure the recommendation is concrete.

  6.  **Final Review against constraints:**
      *   British English? Yes.
      *   Grapple with Gear/Property consistency? Yes.
      *   Grapple with "Anything Goes" consent? Yes.
      *   Concrete recommendation? Yes.
      *   Straight about rejected side? Yes.

  *(Self-Correction on "British English"):* Make sure not to overdo the slang. Keep it professional legal/administrative British English. Use "s" instead of "z" in organisation/behaviour. Use "whilst" sparingly but appropriately.

