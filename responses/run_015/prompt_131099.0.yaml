  1.  **Analyze the User's Request:**
      *   **Context:** High school philosophy seminar presentation.
      *   **Topic:** The Paradox of Fiction (why we feel for things we know aren't real).
      *   **Specific Case Study:** Pixar's *Inside Out* (2015).
      *   **Core Argument/Concept:** "Recursive Emotional Architecture" (empathizing with fictional emotions governing a fictional person).
      *   **Key Scene:** Joy and Sadness ejected from Headquarters; Riley's personality islands collapsing.
      *   **Questions to Address:**
