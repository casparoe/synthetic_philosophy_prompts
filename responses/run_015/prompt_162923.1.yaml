prompt: |-
  i'm putting together a handout for a grad seminar on direct democracy and I want a taxonomy of the positions on when (if ever) a binding referendum is legitimate — not a lit review, an actual tree where every branch is one claim that splits the space. Please build it questions-first: give the diagnostic questions and the answer-combinations they allow, then locate the real positions in that space.

  The branches I want doing the work: (1) does the objection lie in the voters (competence, information, judgement) or in the mechanism (binary framing, agenda-setting power, aggregation); (2) inside the voter branch, whether the objection scales with how salient and how technical the issue is — i.e. does it evaporate for a high-salience yes/no question that everyone has an opinion about; (3) whether a result binds over time once the electorate and the facts have moved on, call this mandate decay: does anyone say how long a mandate should bind and how you would tell when it has expired; (4) whether the right comparison class is what the representative body would have done anyway, so a referendum is judged against a legislative baseline rather than against an ideal; (5) whether some subject matters are off limits to any majority vote no matter how well informed it is.

  Leaves have to include: a Swiss-style semi-direct defence, a populist/plebiscitary one, an epistocratic or competence-based objection, an information-design or low-salience objection, a deliberative/assembly alternative, and a ratification-only view (referendum is fine as a confirming vote on something a legislature has already worked over, but not as an initiative — the complaint people made about Brexit). Name each leaf or mark it unnamed, and give one sentence on its most awkward commitment, especially what it has to say about California-style proposition voting on technical fiscal questions.

  Then mark the answer-combinations that come out empty and say in a clause why — incoherent, unattractive, or just unoccupied — and flag any pair of leaves your questions can't actually pull apart rather than forcing a distinction. Phrase each branch question so someone could answer it without already knowing which view it leads to. Around eight leaves, and please don't cite anything or give me a reading list, I'll fill in references myself.
