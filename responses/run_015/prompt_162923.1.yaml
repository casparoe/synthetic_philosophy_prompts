answer: |-
  ### Diagnostic Questions (The Branches)

  Answering these five questions maps a position onto the taxonomy. They are phrased neutrally to allow for any combination of answers.

  1.  **Locus of Defect:** Is the primary barrier to referendum legitimacy located in the *voters* (competence, information, judgement) or in the *mechanism* (binary framing, agenda-setting, aggregation)?
  2.  **Voter Variability:** (If Voters) Is voter incapacity a fixed trait across all issues, or does it vanish on high-salience, non-technical questions where everyone has an opinion?
  3.  **Subject Matter Limits:** Are there specific substantive topics (e.g., fundamental rights, complex fiscal technicalities) that are inherently off-limits to majority vote, regardless of voter competence or mechanism design?
  4.  **Mandate Decay:** Does a successful referendum result bind the polity indefinitely, or does the mandate expire when demographics, facts, or public sentiment shift significantly?
  5.  **Comparison Class:** Is the referendum outcome judged against an *ideal* deliberative standard (what a perfectly informed body would choose) or against a *legislative baseline* (what the representative body would have done anyway)?

  ***

  ### The Taxonomy (The Leaves)

  The following eight positions occupy the space created by the answer combinations above.

  **1. Hard Epistocracy**
  *   **Path:** Voters (Fixed Incapacity) + No Subject Limits Needed (Always Bad) + Permanent Mandate (N/A) + Ideal Baseline.
  *   **View:** Binding referendums are never legitimate because the electorate lacks the requisite knowledge to govern; authority should rest with a knowledgeable minority.
  *   **Awkward Commitment (California):** It must categorically reject all fiscal propositions (like tax caps) as irrational, even if they pass by 80%, implying the voters are fundamentally unfit to touch the budget.

  **2. Information-Design Reformism**
  *   **Path:** Voters (Variable Capacity) + No Subject Limits + Mandate Decays + Legislative Baseline.
  *   **View:** Referendums are legitimate only if low-salience/technical issues are insulated via better ballot summaries and independent fiscal analysis; the voters are fine on big questions, but need protection on details.
  *   **Awkward Commitment (California):** It must claim that better neutral summaries would solve contradictions in fiscal propositions, assuming ignorance rather than conflicting values drives the mess.

  **3. Populist / Plebiscitary**
  *   **Path:** Voters (Variable Capacity/High Salience OK) + No Subject Limits + No Mandate Decay + Legislative Baseline (Legislature Worse).
  *   **View:** Referendums are the highest form of legitimacy, expressing the general will directly; they should be binding forever and cover any topic the majority desires.
  *   **Awkward Commitment (California):** It must defend the legitimacy of contradictory mandates (e.g., demanding lower taxes and higher spending simultaneously) as the authentic voice of the people.

  **4. Swiss-Style Semi-Direct**
  *   **Path:** Voters (Variable Capacity) + Some Subject Limits (Filters) + Mandate Decays (Can be overturned) + Legislative Baseline (Complement).
  *   **View:** Referendums are legitimate as a check on legislature, but require bureaucratic pre-review, double-majority rules, and ease of reversal to function as a stabilizing feedback loop.
  *   **Awkward Commitment (California):** It must accept that many California propositions would be filtered out by bureaucrats before reaching the ballot, reducing the "direct" nature of the democracy.

  **5. Deliberative / Assembly Alternative**
  *   **Path:** Mechanism (Binary Framing Flaw) + No Subject Limits + Mandate Decays + Ideal Baseline.
  *   **View:** The binary vote is inherently coercive and illegitimate; legitimacy requires a prior phase of structured discussion (e.g., citizens' assemblies) before any binding vote occurs.
  *   **Awkward Commitment (California):** It must deem the entire California ballot illegitimate regardless of the topic, because the format precludes the necessary negotiation and nuance.

  **6. Ratification-Only Liberalism**
  *   **Path:** Mechanism (Agenda-Setting Flaw) + No Subject Limits + Mandate Decays + Legislative Baseline.
  *   **View:** Initiatives are illegitimate because they bypass legislative compromise, but referendums are legitimate as a confirming veto on work the legislature has already processed.
  *   **Awkward Commitment (California):** It must argue that Proposition 13 (an initiative) was illegitimate process-wise, even if a legislature-passed tax cap would have been acceptable.

  **7. Rights Absolutism**
  *   **Path:** (Any Voter/Mechanism View) + Strict Subject Limits + Permanent Mandate (on Rights) + Ideal Baseline.
  *   **View:** Majority vote is legitimate for policy but inherently illegitimate for constitutional rights or minority protections, which must be insulated from popular vote.
  *   **Awkward Commitment (California):** It must strike down voter-approved measures regarding minority rights or fiscal entitlements even if they were passed by a supermajority with full information.

  **8. Legislative Supremacy (Status Quo)**
  *   **Path:** (Any Voter/Mechanism View) + No Subject Limits + Mandate Decays + Ideal Baseline (Legislature Closer to Ideal).
  *   **View:** Referendums are theoretically possible but practically inferior to representation; they should be avoided because the legislative process approximates the ideal baseline more closely than a snapshot vote.
  *   **Awkward Commitment (California):** It must prefer legislative budget deals over voter-imposed fiscal rules, assuming legislators are more capable of long-term fiscal planning than the electorate.

  ***

  ### Empty Combinations and Indistinguishable Leaves

  **Empty / Incoherent Combinations**
  *   **Voter Incapacity (Fixed) + Ratification-Only:** *Incoherent.* If voters lack the fixed competence to initiate policy, they logically lack the competence to ratify it; granting them a veto while denying them initiative power relies on a distinction in capacity that this branch denies.
  *   **Populist + Mandate Decay:** *Unattractive/Unoccupied.* A view that champions the "general will" as the supreme authority rarely accepts that this will expires due to demographic shifts; this combination is theoretically possible but politically unstable.
  *   **Mechanism Defect + No Subject Limits + Hard Epistocracy:** *Incoherent.* If the mechanism is the sole problem, one cannot argue for Hard Epistocracy (which locates the problem in the voters); these are mutually exclusive root diagnoses.

  **Indistinguishable Leaves**
  *   **Deliberative vs. Ratification-Only:** These two leaves are difficult to pull apart using *only* the five diagnostic questions provided. Both locate the defect in the Mechanism and both judge against a baseline that the current initiative process fails. They are distinguished here by *which* part of the mechanism is flawed (Binary Choice vs. Agenda Setting), but without a sixth question probing the specific mechanism failure, these positions collapse into a single "Process Skeptic" leaf.
  *   **Rights Absolutism vs. Legislative Supremacy:** On technical fiscal questions, these views often yield the same outcome (reject the referendum). They are distinguished by *why* (Rights vs. Competence), but if the "Subject Matter" question is answered broadly to include "fiscal technicalities," the Rights Absolutist looks identical to the Legislative Supremacist.
