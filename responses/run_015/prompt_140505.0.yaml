answer: |-
  Here is a principle designed to be used in a room, not just a seminar. It prioritizes clarity over saving every intuition you have.

  ### The Principle of Epistemic Agency

  **A clinical interaction is epistemically unjust when:**
  1.  **Credibility Distortion:** A patient's report is weighted based on identity markers (race, gender, class, dialect, chart flags) rather than evidence of their reliability; **OR**
  2.  **Participatory Substitution:** A patient's direct contribution is bypassed or replaced by proxies (family, algorithms, prior charts) without medical necessity or patient consent.

  **The Harm Condition:**
  The harm is defined as a violation of the patient's status as a **knower**. Clinical outcomes (getting better or worse) are secondary. If the patient is treated as an object to be decoded rather than a subject to be heard, the injustice has occurred, regardless of whether the diagnosis ends up being correct.

  ***

  ### How the Principle Applies to Your Cases

  Here is the verdict for each scenario, which clause motivates it, and where the principle forces you to change your mind.

  **1. ER Doc (You, Anxiety Flag)**
  *   **Verdict:** Injustice.
  *   **Clause:** Credibility Distortion.
  *   **Reasoning:** The "anxiety" and "pain-med" flags are identity markers within the chart. They were used to lower credibility without new evidence.
  *   **Motivation:** This is your core case. It motivates the entire principle.

  **2. New PCP (You, Discounted but Right)**
  *   **Verdict:** Injustice.
  *   **Clause:** Credibility Distortion + Harm Condition.
  *   **Reasoning:** Even though the clinical outcome was neutral (you were fine), your status as a knower was violated. You were not believed *for the right reasons*.
  *   **Cost/Overturn:** This validates your gut ("something bad happened") but overturns the idea that "no physical harm = no injustice." The harm was to your agency, not your body.

  **3. Printed-Research Guy (Specialist)**
  *   **Verdict:** Not Injustice.
  *   **Clause:** None.
  *   **Reasoning:** The heuristic ("people with printed research are hypochondriacs") is based on *behavior*, not identity. It is lazy medicine, but it is not epistemic injustice under this definition.
  *   **Cost/Overturn:** This matches your verdict. It distinguishes between "bad doctoring" and "injustice."

  **4. Intake Nurse (Recovery Program/Immigrants)**
  *   **Verdict:** Injustice.
  *   **Clause:** Credibility Distortion.
  *   **Reasoning:** While the nurse has statistical data, using a program referral as a proxy for reliability when that program correlates with a marginalized identity (immigrants) functions as identity prejudice. It treats the individual as the group average.
  *   **Cost/Overturn:** This may be harder for you to accept than the Research Guy. The principle demands that individual evidence must override statistical base rates when those rates track with marginalized identity. The nurse is being asked to do more work to be just.

  **5. Polished Man (Credibility Excess)**
  *   **Verdict:** Injustice (Systemic), but the Man is not the Victim.
  *   **Clause:** Credibility Distortion.
  *   **Reasoning:** The doctor's judgment was distorted by identity (class/appearance). This corrupts the epistemic environment. However, the *wrong* is done to the truth and the system, not the man (who benefited).
  *   **Cost/Overturn:** You said you "can't say the guy was wronged." The principle agrees he wasn't wronged, but insists the *act* was still unjust. This allows you to criticize the doctor without needing the man to be a victim.

  **6. Husband Answering (Erasure)**
  *   **Verdict:** Injustice.
  *   **Clause:** Participatory Substitution.
  *   **Reasoning:** You were present and capable. The doctors substituted your voice with your husband's without necessity. This is a denial of agency, even if they "believed" the husband.
  *   **Motivation:** This case motivated Clause 2. Standard credibility theories miss this because no deficit was assigned to you; you were simply bypassed.

  **7. Self (Ex-Partner Bias)**
  *   **Verdict:** Not Injustice.
  *   **Clause:** None.
  *   **Reasoning:** Injustice requires uptake. A private thought that does not alter how you weigh their report or hear their voice is a moral failing, but not an epistemic injustice.
  *   **Cost/Overturn:** Matches your gut ("too grand"). It draws a line between internal bias and external harm.

  **8. AI Triage Tool**
  *   **Verdict:** Injustice.
  *   **Clause:** Participatory Substitution & Credibility Distortion.
  *   **Reasoning:** The algorithm acts as a proxy that weights input based on dialect (identity) and prior tags (history). The institution is the "hearer" here.
  *   **Motivation:** This forces the principle to apply to systems, not just people. The "Harm Condition" ensures you don't need to find a prejudiced human to call it unjust.

  **9. Seminar Leader (Men/Women Questions)**
  *   **Verdict:** Injustice.
  *   **Clause:** Participatory Substitution.
  *   **Reasoning:** The women are being substituted into a "summary" role and men into a "thinking" role based on gender. It limits their epistemic participation.
  *   **Motivation:** Shows the principle works outside medicine.

  **10. 911 Dispatcher (Accented/Brusque)**
  *   **Verdict:** Not Injustice.
  *   **Clause:** None.
  *   **Reasoning:** Rudeness is not epistemic blocking. If the information was accurately received and acted upon, the caller's status as a knower was intact.
  *   **Cost/Overturn:** This might feel cold. But under this principle, if the *knowledge transfer* worked, the epistemic agency was preserved. The harm here is dignity, not epistemology.

  ***

  ### What This Costs You

  To keep this principle clean enough to use in a room, you have to accept two costs:

  1.  **It separates Dignity from Justice.** Case 10 (911) and Case 3 (Research Guy) involve rude or lazy behavior, but this principle calls them "Not Injustice." If you want to call them injustice, you need a broader definition of harm that includes emotional labor. This principle does not cover that.
  2.  **It demands more of the Nurse (Case 4).** You noted her base rate is real. This principle says she cannot use it if it functions as an identity proxy. This means she must treat every patient from that program as an individual risk, even if it lowers her efficiency. Justice is expensive.

  ***

  ### How to Use This as an Advocate

  You asked what you should actually *do* differently when sitting in the room. This principle gives you three specific moves:

  **1. Interrupt the Proxy (For Case 6 & 8)**
  When a doctor addresses a husband, a chart, or an AI score instead of the patient:
  *   *Action:* "I'd like to hear [Patient's] description of the pain directly before we look at the chart scores."
  *   *Why:* You are enforcing Clause 2 (Participatory Substitution). You are restoring their status as a knower.

  **2. Flag the Marker (For Case 1, 2, 4, 5)**
  When you hear a judgment that tracks with identity (gender, accent, "anxiety" flag, "noncompliant" tag):
  *   *Action:* "I notice we're relying heavily on the 'anxiety' flag in the chart. Can we list the specific symptoms from *today* that support or contradict that?"
  *   *Why:* You are enforcing Clause 1 (Credibility Distortion). You are forcing the evidence to decouple from the identity marker.

  **3. Define the Harm (For Case 2)**
  When the doctor says, "See? You were fine, I was right to wait," regarding a delayed diagnosis:
  *   *Action:* "The diagnosis might be fine, but the process dismissed her report without evidence. We need to note that her reporting was accurate, even if the pathology wasn't found yet."
  *   *Why:* You are enforcing the Harm Condition. You are documenting that the *epistemic violation* happened, regardless of the *clinical outcome*. This protects the patient's credibility for the next time.

  ### Summary
  If you adopt the **Principle of Epistemic Agency**, you stop fighting for "better outcomes" and start fighting for "better hearing." Sometimes those are the same thing (Case 1). Sometimes they aren't (Case 2). But in a system that routinely silences patients, fixing the hearing is the only way to eventually fix the care.
