answer: |-
  Here is a diagnostic of your reasoning, followed by a ranked research agenda tailored to a small, non-empirical team.

  ### 1. The Reasoning Typo
  You identified a potential typo in your reasoning, and there is one, though it's conceptual rather than orthographic.

  In point (3), you worry that distinguishing "authenticity of the moment" from "authenticity over a lifespan" will collapse into **preference-utilitarianism**. This is backward. Preference-utilitarianism aggregates all preferences equally (or weighted by intensity). A "lifespan authenticity" model is typically criticized for collapsing into **Essentialism** or **Perfectionism**—the idea that there is a "True Self" (usually the past, rational one) that overrides the "False Self" (the current, impaired one).

  The real risk isn't that you'll count too many preferences (utilitarianism); it's that you'll count *only* the past preferences and treat the current self as a vessel with no moral weight. If you solve for Authenticity, you risk solving it by simply stipulating that the Past Self is the "Real" one, which begs the question against the Later Self.

  Additionally, your "Constitutional Amendment" analogy is slightly inverted. In legal theory, the Advance Directive functions as the **Constitution** (higher law, hard to change), while the Later Self's current wishes function as **Statutes** (ordinary law, easily changed). If the AD is an "amendment," it implies it is modifying a prior constitution. You likely mean the AD *establishes* the constitutional constraints. Tightening this analogy is part of the work.

  ### 2. The Ranked Agenda
  Here are the three most upstream conceptual problems, ranked by their ability to unlock the others, their tractability for a philosopher without clinical access, and their potential to shift practice.

  #### Rank 1: The Metaphysics of Partial Discontinuity
  **The Question:** At what threshold does a shift in values constitute a break in *moral* identity, even if *legal* personhood remains intact?
  **Why it is #1 (Upstream):** You cannot determine if the Prior Self has authority (your point 1) or if the Later Self has narrative coherence (your point 2) until you define the relationship between the two. If the value shift is radical enough (e.g., a devout pacifist becomes a violent hedonist due to frontal lobe damage), the "Autonomy vs. Welfare" debate dissolves because it is no longer one person's autonomy vs. their welfare; it is Person A's autonomy vs. Person B's welfare.
  **Tractability:** High. This is pure conceptual analysis. You can use thought experiments (Parfitian reductionism, Schechtman's narrative self) without needing patient data. You are analyzing the *logic* of identity, not the *biology* of dementia.
  **Impact:** High. Currently, courts treat personhood as binary (competent/incompetent). A philosophical framework for "partial discontinuity" could support a legal standard where ADs lose force not upon "incapacity" but upon "significant value discontinuity."

  #### Rank 2: The Jurisdiction of the Past Self (Domain Specificity)
  **The Question:** Does the Prior Self's authority extend to all domains of life, or only those where their specific expertise/commitment was lodged?
  **Why it is #2:** This addresses your "Constitutional" idea. Even if we establish that the selves are continuous enough to warrant respect (Rank 1), it does not follow that the Prior Self gets to dictate *everything*. Perhaps the Prior Self has jurisdiction over end-of-life medical care (where they planned extensively) but not over daily social engagement or diet (where the Later Self's experiential interests dominate).
  **Tractability:** High. This requires mapping political philosophy (liberal neutrality, jurisdiction of authority) onto bioethics. It avoids the binary trap of Ulysses contracts by allowing for "partial sovereignty."
  **Impact:** Very High. This is the most actionable for clinicians. It moves the conversation from "Do we follow the AD?" to "Which clauses of the AD are still in jurisdiction?" It allows for a "patchwork" care plan that respects the AD on resuscitation but ignores it on recreational activities.

  #### Rank 3: The Normative Weight of Critical Interests
  **The Question:** Why do "critical interests" (Dworkin's term for values that make a life good) outweigh "experiential interests" (current pleasure/pain) when the two conflict in a partial-capacity scenario?
  **Why it is #3:** This is the normative output of the first two. Once you know the selves are connected (Rank 1) and the domain is covered (Rank 2), you must justify *why* the past value wins. Is it because breaking a promise to oneself is inherently wrong? Or because a life is a narrative whole?
  **Tractability:** Medium. This is the hardest to disentangle from preference-utilitarianism (your original worry). It requires rigorous defense against the claim that "suffering now" always trumps "values then."
  **Impact:** Medium. This shifts the *justification* courts use, but perhaps not the outcome as much as Rank 2. However, it prevents the "Essentialism" trap by forcing a justification for why the past self's values bind the future.

  ### 3. What is Overrated?
  **The Ulysses Contract Literature.**
  You are correct to be skeptical. The vast majority of this literature assumes a **temporal binary**: Time 1 (Competent) binds Time 2 (Incompetent).
  *   **Why it's a dead end:** It fails to address the "patchwork" reality of neurodegenerative disease or psychiatric fluctuation where capacity is not lost but *transformed*. It also focuses heavily on the *enforceability* of the contract (legal mechanics) rather than the *moral authority* of the binder.
  *   **The Trap:** It leads to a debate about "hard" vs. "soft" Ulysses contracts (whether you can be physically restrained vs. just persuaded). This is a clinical/legal implementation detail that distracts from the upstream metaphysical question of whether the contract is valid when the signatory's values have drifted but not vanished.

  **"Best Interests" Standards.**
  Much literature tries to solve this by appealing to the "Best Interests" of the patient. This is overrated because it is a placeholder, not a solution. In patchwork cases, the Prior Self defines "Best" one way (dignity), and the Later Self defines it another (comfort). Appealing to "Best Interests" just hides the conflict; it doesn't resolve whose definition counts.

  ### 4. The Research Agenda (Philosopher + 1 Grad Student)
  *Goal: Produce a theoretical framework for "Domain-Specific Diachronic Authority."*

  **Phase 1: Conceptual Mapping (Months 1-6)**
  *   **Task:** Rigorously define "Value Discontinuity." Distinguish between *preference change* (I used to like jazz, now I like rock) and *value change* (I used to value autonomy, now I value safety).
  *   **Output:** A taxonomy of value shifts. Only value shifts that touch on "critical interests" should trigger a re-evaluation of AD authority.
  *   **Method:** Armchair philosophy + review of legal case law (look for cases where judges *already* intuitively distinguish these, even if they lack the vocabulary).

  **Phase 2: The Constitutional Model (Months 7-12)**
  *   **Task:** Flesh out the "Constitutional" analogy correctly. The AD is the Constitution; the Later Self is the Legislature.
  *   **Key Question:** Under what conditions can the Legislature (Later Self) amend the Constitution (AD) without the original ratifiers' consent?
  *   **Hypothesis:** The Later Self can "amend" the AD in domains of *experiential interest* (daily life) but not in domains of *critical interest* (end-of-life), provided they meet a threshold of coherence.
  *   **Output:** A paper proposing "Domain-Specific Validity" for Advance Directives.

  **Phase 3: Normative Defense (Months 13-18)**
  *   **Task:** Defend against the "Tyranny of the Past" objection. Why isn't this just ageism or ableism disguised as autonomy?
  *   **Method:** Engage with the "Authenticity" literature (Christman, Frankfurt) but pivot to a **Procedural** account. It's not that the Past Self is "truer," but that the *process* of binding oneself is a necessary condition for long-term planning autonomy.
  *   **Output:** A final theoretical framework that clinicians can use to argue for partial enforcement of ADs in ethics consultations.

  ### Summary of the Shift
  By moving from **"Does the AD bind?"** (Binary) to **"In which domains does the AD retain jurisdiction?"** (Constitutional/Domain-Specific), you bypass the intractable debate over total competence. This allows you to do high-impact normative work without needing a single patient interview, relying instead on the logic of authority, identity, and jurisdiction.
