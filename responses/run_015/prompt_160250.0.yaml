      *   *What if Opponent is "Cooperate if Simulate returns C, else D"?* (This is basically MirrorBot).
      *   *What if Opponent is "Defect if Simulate takes > N steps"?* Then MirrorBot times out, defaults C. Opponent sees timeout (or just defects pre-emptively). MirrorBot gets Sucker.
      *   *Conclusion:* The timeout default is the weak link. Proof-based is the standard fix in this literature.
      *   *Dominance:* If I play against DefectBot, I should Defect. MirrorBot defects against DefectBot. So far so good. But is it dominant? No. If I play against CooperateBot, I should Defect to get Temptation payoff. MirrorBot Cooperates. So MirrorBot is *not* dominant. It is *unexploitable* (mostly), but not dominant. The student's claim of dominance is a major theoretical error that needs correcting.

  6.  **Finalizing the Advice:**
      *   Tell the student to read "Robust Cooperation in the Prisoner's Dilemma" (Garrabrant et al.).
      *   Advise shifting from "Dominance" to "Nash Equilibrium in Program Space" + "Pareto Efficiency."
