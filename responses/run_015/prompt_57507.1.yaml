  ### (e) Buy/Sell Spread and Wealth

  **Do the prices come apart?**
  **Yes, drastically.**
  Given your $50,000 wealth and the house absorbing debt beyond that:

  *   **Buying Game 1:** Your downside is limited to the ticket price. Your upside is truncated by your ability to *use* the money (or the house's ability to pay). You quoted **$10**.
  *   **Selling Game 1:** You receive the ticket price $P$, but you owe $2^n$.
      *   If $n$ is large, you owe millions.
      *   The house absorbs debt beyond $50,000.
      *   So your maximum loss is $50,000 (bankruptcy).
      *   However, the *probability* of you going bankrupt is significant enough that the **Expected Loss** is high.
      *   $P(\text{ruin}) \approx P(2^n > 50,000) \approx P(n > 16) \approx 1/65,536$.
      *   Wait, if debt is absorbed, your loss is capped at $50k.
      *   Expected Loss = $\sum_{n=1}^{16} p_n 2^n + \sum_{n=17}^{\infty} p_n (50,000)$.
      *   The first part is $\approx 16$. The second part is $50,000 \times (1/2)^{16} \approx \$0.76$.
      *   Actually, under SSP, the Sell Price should be roughly the Expected Payout capped at your wealth.
      *   However, psychologically, selling a St. Petersburg ticket exposes you to **ruin** (loss of all $50k) with small probability. Buying exposes you to loss of $10.
      *   **Verdict:** Your "Least Acceptable to Surrender" (Sell Price) should be **much higher** than your "Most Willing to Pay" (Buy Price).
      *   **Why:** Because the utility loss of losing $50,000 (ruin) is likely non-linear compared to the utility gain of winning $2^n. Even if the house absorbs the debt, *you* absorb the bankruptcy event.
      *   **Correction on House Absorption:** The prompt says "anything beyond my total wealth is absorbed by the house." This means you *never* lose more than $50k. You lose your entire net worth.
      *   If you are risk-neutral over dollars up to $50k: Sell Price $\approx$ Expected Capped Payout $\approx \$16.76$.
      *   If you are risk-averse (likely, given Verdict 1): Sell Price >> Buy Price.
      *   **Conclusion:** Yes, they come apart. Your Verdict 1 ($10 buy) is consistent with risk aversion or truncation. Your sell price must account for the risk of total wealth depletion, which is a qualitatively different event than missing out on a gain.

