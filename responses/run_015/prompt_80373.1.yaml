  You have the right to appeal this determination. To initiate an appeal, you must submit Form 77-B (Petition for Direct Selection Evidence) within thirty days. Successful appeals must provide definitive phylogenetic evidence demonstrating that the Intuition was directly selected for representing moral facts, rather than merely facilitating cooperative behavior. Alternatively, you may argue that the Spandrel determination is erroneous by providing data showing the trait existed independently of the selected-byproduct mechanisms.

  Please note that failure to secure content status means the Intuition cannot be used as a premise in logical deductions regarding policy or personal conduct. Any actions taken based on non-representational states are considered arational.

  If you have questions regarding this determination, please contact the Office of Evolutionary History. Do not reply to this email.

  Sincerely,

  The Department of Proper Function
  Content Assignment Division

