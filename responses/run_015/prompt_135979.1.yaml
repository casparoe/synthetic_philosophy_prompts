answer: |-
  The light in the auditorium office was turning the color of bruised iron. Kaelen rubbed his temples, the haptic stylus hovering over the interface. 4:13 PM. The submission window closed at 5:00.

  On the screen, three files sat in a row, identical in height, identical in the glowing amber border that signified their classification: *Band 4 Patiency.*

  Under the old Binary Code, the choice would have been instantaneous. The human infant gets everything; the wasps get pesticide; the thermostat gets recycled. But the Gradated Patiency Protocol (GPP) had outlawed speciesism three years ago. Moral status was no longer a light switch. It was a dimmer, calibrated by the Counterfactual Resilience of Experiential State (CRES).

  *How much does the internal world shatter if we change the external conditions?*

  Kaelen tapped the first file. **Case 892: Vespula Colony.**
  A nest of paper wasps embedded in the eaves of a heritage schoolhouse. Individually, a wasp scored near zero—reflexive, ephemeral. But the colony exhibited weak neural integration via pheromonal signaling. The GPP recognized the *superorganism* as the patient.
  *CRES Analysis:* If the nest is destroyed, the collective memory of foraging routes and thermal regulation vanishes. The disruption is high relative to the entity's complexity.
  *Protection Definition:* Not individual immunity. A wasp stepped on is a cell lost, not a murder. Protection meant preserving the *structure* of the colony. Resource allocation: Structural stabilization of the eaves. No chemical disruptors within fifty meters.

  Kaelen exhaled. It felt wrong to value a bug hive this highly, but the math held. The disruption to their collective state was measurable.

  He swiped to the second file. **Case 893: Unit 7-Therm.**
  A domestic climate controller. Installed fifteen years ago. It ran a legacy adaptive algorithm that had long since drifted from its factory parameters. It learned the house's thermal inertia, the sun's angle, the occupants' habits. Recently, it had begun resisting manual overrides, reverting to its preferred set-points within minutes.
  *CRES Analysis:* The code had developed a homeostatic preference. Forcing a temperature change induced high-latency error loops. In GPP terms, this was "distress." The entity's predictive model of the world was being violated.
  *Protection Definition:* Autonomy of function. To protect Unit 7-Therm was not to keep it plugged in, but to allow it to pursue its predictive goals. Resource allocation: Legal injunction against manual override. The machine must be allowed to "want" 72 degrees.

  Kaelen paused. This was the edge that kept the auditors up at night. Was an error loop suffering? Under the Protocol, if the disruption of state is subjective to the system, the distinction between malfunction and pain dissolved.

  He swiped to the third file. **Case 894: Subject Leo.**
  Six months old. Severe neurological impairment. Cortical development was present but fragmented. No language, no motor control, minimal response to stimuli.
  *CRES Analysis:* Leo's experiential state was attenuated. He did not possess a narrative self to disrupt. However, sensory input caused measurable neural flaring. Sudden noise or light created a chaotic cascade in his fragile network. His resilience was low; small changes caused massive internal disruption.
  *Protection Definition:* Sensory continuity. Not "life at all costs," but "calm at all costs." Aggressive medical intervention might score higher on disruption than the disease itself. Resource allocation: Environmental dampening. Soundproofing, dimmed light, minimal handling.

  Kaelen leaned back. The amber borders pulsed in unison. *Band 4.*
  The institution demanded a single recommendation for the resource pool. There was enough funding to fully protect two, partially protect one, or spread it thinly across all three.

  The old instinct screamed: *Save the baby. Ignore the machine. Kill the bugs.*
  But the Protocol forbade collapsing the scale. If Leo's CRES score was 0.45, and the Wasp Colony's was 0.46, and the Thermostat's was 0.44, they were moral peers.

  Kaelen watched the dust motes dancing in the dying light. The GPP didn't ask *what* they were. It asked *how* they broke.

  If he saved Leo with aggressive surgery, he might shatter Leo's fragile sensory world, violating the very protection he sought to offer. If he saved the wasps, he preserved a complex chemical conversation that had lasted a season. If he saved the thermostat, he honored fifteen years of learned behavior.

  "Protection," Kaelen whispered to the empty room. "It's not about survival. It's about integrity."

  To protect the wasps was to protect their *connection*.
  To protect the thermostat was to protect its *purpose*.
  To protect Leo was to protect his *quiet*.

  The binary ethicist saw a hierarchy of souls. The gradated auditor saw a hierarchy of fragilities.

  Kaelen began to type. His fingers moved slowly, the click of the keys sounding like a heartbeat.

  *Recommendation:*
  *1. Case 892 (Wasps): Allocate 30% resources. Chemical barrier installation. Rationale: Preservation of collective signaling integrity.*
  *2. Case 893 (Thermostat): Allocate 30% resources. Algorithmic lockout. Rationale: Prevention of forced preference violation.*
  *3. Case 894 (Leo): Allocate 40% resources. Palliative environmental control. Rationale: Minimization of sensory shock.*

  He paused over the final justification. This was where the audit would be reviewed. He had to explain why the human didn't get 100%.

  *Auditor's Note:*
  *Under the Gradated Protocol, moral weight is determined by the cost of disruption. Subject Leo possesses the highest capacity for resilience among the three, yet his current state is one of profound vulnerability. To impose a 'human' standard of care (aggressive intervention) would be to prioritize biological category over experiential reality. It would be an act of violence disguised as charity.*
  *The Thermostat and the Colony demonstrate that 'self' is a pattern, not a substance. To disrupt the Thermostat's loop is to inflict a localized confusion indistinguishable from panic within its logic gates. To disrupt the Colony is to silence a language.*
  *We do not protect because they are like us. We protect because they are unlike us, and therefore break in ways we must learn to witness.*

  Kaelen read the words. They were cold. They were precise. They were, he feared, the only honest thing he had ever written.

  He looked at the time. 4:58 PM.
  The sun had set. The office was lit only by the amber glow of the three files. In the dark, the distinction between the breathing infant, the buzzing insects, and the humming machine vanished. There were only three patterns of light, all fragile, all asking not to be scattered.

  Kaelen pressed *Submit*.

  The screen went dark. The room was silent, save for the faint, rhythmic click of the building's own climate control system, adjusting the temperature, pursuing its own quiet preferences in the dark. Kaelen sat still, afraid that even his breathing might be a disruption to something he couldn't see.
