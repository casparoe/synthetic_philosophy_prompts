      *   *The Colleague's Claim:* Just as left/right driving is arbitrary coordination, so are moral codes. Once coordinated, switching is costly. Therefore, no intrinsic moral value.

  3.  **Analyze the Disanalogies (The "Audit"):**
      *   *Critique 1: State Dependence/Scaffolding.*
          *   Driving: Needs a state to enforce the rule, but the *choice* of side is arbitrary.
          *   Codes: Honour often requires a *weak* state (self-help). Dignity requires a *strong* state (rule of law). Victimhood requires a *complex* administrative/audience structure.
          *   *Implication:* They aren't just spontaneous equilibria; they rely on specific institutional backbones. You can't just "choose" victimhood without an administration to hear complaints. This makes them less like "which side of the road" and more like "what kind of vehicle/infrastructure."
      *   *Critique 2: Third-Party Harm (Distributional Effects).*
          *   Driving: A crash hurts the drivers involved. The *side* of the road doesn't inherently privilege one class of driver over another (mostly).
          *   Codes: Honour codes often privilege strong males (who can fight). Dignity codes privilege those with equal legal standing. Victimhood codes privilege those with moral capital/access to audiences.
          *   *Implication:* The choice of code has *winners and losers*. Driving on the left doesn't systematically oppress left-handed people. Honour cultures systematically disadvantage those who cannot physically retaliate. This introduces a moral dimension (justice/fairness) absent in the driving case.
      *   *Critique 3: Individual vs. Collective Switching (Coordination vs. Optimization).*
          *   Driving: If everyone switches together, the outcome is identical (Pareto neutral).
          *   Codes: If everyone switches from Honour to Dignity together, is the outcome identical? No. Violence rates drop, economic stability might rise.
          *   *Implication:* The "equilibrium" isn't neutral. Some equilibria are objectively better on certain metrics (e.g., mortality, economic growth). The colleague confuses *coordination problems* with *prisoner's dilemmas* or *optimization problems*.

  4.  **Develop a Better Analogy:**
      *   Need something where the *method* of handling conflict changes the *outcome* for vulnerable parties.
      *   *Idea 1:* Dispute Resolution Mechanisms (Court vs. Duel vs. Public Shaming). A bit too literal.
      *   *Idea 2:* Immune Systems. (Overreaction vs. Underreaction vs. Autoimmune). Good for function, bad for morality.
      *   *Idea 3:* *Building Codes/Safety Standards.*
          *   Honour = Sandbags (individual effort, temporary).
          *   Dignity = Concrete/Steel (structural, state-enforced).
