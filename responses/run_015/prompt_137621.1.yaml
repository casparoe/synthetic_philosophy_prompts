          *   *Why better?* Highlights power dynamics and third-party impact.

      *   *Selection:* The "Dispute Resolution System" or "Legal/Security Architecture" is the most precise. But for a seminar, maybe "Security Systems" (Self-defense vs. Police vs. Neighborhood Watch on steroids). Let's go with **Security Architectures**. It captures the state-dependence and the protection of the vulnerable.

  5.  **Address the "Moral Superiority" Question:**
      *   Does "none is superior" survive? No.
      *   Why? Because the codes produce different material outcomes (violence levels) and different distributions of safety (who gets protected).
