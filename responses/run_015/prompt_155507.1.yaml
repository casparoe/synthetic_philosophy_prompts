      *   **Goal:** Create a teaching plan for a first-year comparative politics graduate seminar on "American Exceptionalism."
      *   **Core Approach:** Treat exceptionalism not as a target to debunk, but as a layered conceptual object that students tend to flatten.
      *   **Audience:** Grad students with a "folk version" (America is different = good/bad).
      *   **Key Dependency Structure:** Must separate three registers before showing contamination:
          1.  *Comparative-Historical Thesis:* Missing institutional prerequisites (no feudalism, specific labor-market expansion).
          2.  *Normative-Democratic Claim:* Self-exemption from universal standards.
          3.  *Ideological Mechanism:* Converting descriptive absence into prescriptive uniqueness.
      *   **Starting Point:** Not American history, but *comparative explanation requirements* (shared baseline vs. variance).
      *   **Carrying Example:** Antebellum "Free Soil" ideology (Northern labor framed as "free" via racial exclusion/expansion, not absence of coercion).
      *   **Timing of Example:** After comparative-method layer, before normative slide is named.
      *   **Misconception Map:**
          1.  Variance vs. Exemption ("Every country is exceptional").
          2.  Falsification Error (Finding analogues $\neq$ refuting mechanisms).
          3.  Normative Slide (Absence of socialism/feudalism $\neq$ democratic health).
          4.  Dismissal Error (Empirical flaws $\neq$ ideological death).
      *   **Check of Understanding:** Exercise analyzing contemporary policy resistance (e.g., healthcare) mapping the three layers and finding contradictions.
      *   **Explicit Omissions:** Turner Frontier historiography, quantitative cross-national datasets, contemporary settler-colonial critique.
      *   **Deliverable:** Ordered sequence with dependency logic, example specs, misconception map, exercise design, and omissions.

  2.  **Deconstruct the Dependency Structure:**

      *   *Why start with method?* If students don't understand what a causal claim in comparative politics looks like (variance around a mean), they will treat "exceptionalism" as just "difference." The prompt emphasizes establishing a baseline against which variance is *causally accounted for*, not celebrated.
      *   *Why the specific order of registers?*
          1.  Historical/Descriptive (What happened?)
          2.  Normative (What does it mean for democracy?)
          3.  Ideological (How do we move from 1 to 2 illegitimately?)
      *   *Why "Free Soil"?* It perfectly illustrates the "descriptive absence" (no feudal serfs) masking the "prescriptive uniqueness" (freedom defined by exclusion). It bridges the historical and the ideological.

  3.  **Drafting the Sequence (Iterative Process):**

      *   *Phase 1: Methodological Baseline.* Need to define "exceptionalism" in comp pol terms. It's not just $X \neq Y$. It's $X$ claims to be outside the logic governing $Y$.
      *   *Phase 2: The Historical Thesis.* Introduce the specific argument (Sombart/Lipset style but refined). No feudalism $\rightarrow$ no socialism.
      *   *Phase 3: The Carrying Example (Free Soil).* Insert here. Show how "free labor" wasn't just "no feudalism," it was "racial exclusion." This creates the tension.
      *   *Phase 4: The Normative Slide.* Now name the move. "Because we have no feudalism, we are *better*."
      *   *Phase 5: The Ideological Mechanism.* How the descriptive becomes prescriptive.
      *   *Phase 6: Application/Check.* Healthcare example.

  4.  **Refining the Misconception Map:**

      *   *Misconception 1 (Variance/Exemption):* Address in Phase 1.
      *   *Misconception 2 (Falsification):* Address in Phase 2 (when discussing mechanisms vs. outcomes).
      *   *Misconception 3 (Normative Slide):* Address in Phase 4 (using the Free Soil tension).
      *   *Misconception 4 (Dismissal):* Address in Phase 5 (ideology persists despite empirical flaws).

  5.  **Developing the Check of Understanding:**

      *   Needs to be an exercise, not a quiz.
      *   Topic: Universal Healthcare resistance.
      *   Task: Map the three layers. Find the contradiction.
      *   *Layer 1 (Historical):* "We have employer-based care historically."
      *   *Layer 2 (Normative):* "Government interference is un-American/freedom-threatening."
      *   *Layer 3 (Ideological):* "Because we have employer care (description), government care is morally wrong (prescription)."
      *   *Contradiction:* Employer dependence *is* a form of coercion/structure, contradicting the "freedom" claim.

  6.  **Reviewing Omissions:**

      *   Ensure Turner is out.
      *   Ensure large-N datasets are out.
      *   Ensure Settler-Colonial theory (as a primary lens) is out (though Free Soil touches it, the *critique* framework is excluded to keep focus on the three registers).

  7.  **Final Polish:**

      *   Check tone: Graduate seminar, rigorous, structural.
      *   Check constraints: Did I place Free Soil correctly? (After method, before normative naming). Yes.
      *   Check logic: Does the dependency hold? (Method $\rightarrow$ History $\rightarrow$ Example $\rightarrow$ Normative $\rightarrow$ Ideology).

  8.  **Constructing the Output:** (Drafting the response based on the above thought process). *Self-Correction during drafting:* Make sure the distinction between Register 1 (Historical) and Register 3 (Ideological Mechanism) is sharp. Register 1 is the claim about institutions. Register 3 is the *move* that turns Register 1 into Register 2.

      *   *Refining the Free Soil placement:* The prompt says: "after the comparative-method layer is secure, but before the normative slide is named." So, Phase 1 (Method) $\rightarrow$ Phase 2 (Historical Thesis Intro) $\rightarrow$ Phase 3 (Free Soil Case) $\rightarrow$ Phase 4 (Normative Slide Naming). This allows the empirical contradiction to be felt before the theoretical label is applied.

      *   *Refining the Healthcare Exercise:* Ensure it forces them to find the *contradiction*, not just list the layers. The contradiction lies where the historical reality undermines the normative claim.

  9.  **Final Review against Prompt:**
