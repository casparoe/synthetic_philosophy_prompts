  hey — this is a fascinating angle. voss is tackling one of the weirdest tensions in late victorian philosophy, so you want to make sure he doesn't retreat into generalities. here are 8 questions designed to keep him pinned on the textual and mechanistic details. i've woven the follow-ups in so you don't lose momentum if he tries to pivot.

  1.  let's start with the mechanism of transfer. you argue sidgwick practiced "controlled credulity" with the SPR—demanding reproducible conditions and peer testimony for telepathy. can you walk me through exactly how that methodological habit was supposed to migrate into *the methods of ethics*? is it that he wanted moral intuitions to be *tested* like séance reports, or that he wanted them to fail the test unless they were truly axiomatic?

  2.  this leads to the charge of asymmetry. if sidgwick required strict controls for paranormal evidence but accepted moral intuitions without that same empirical friction, doesn't that look like special pleading? how do you defend him against the idea that he was simply lowering the epistemic bar whenever it suited his utilitarian project?

  3.  i imagine the counter-arguement here is that sidgwick was just being empirically open-minded—that he refused to rule out intuitions just because they weren't physical data. but if you push that openness consistently, doesn't it collapse into a skepticism about ethics entirely? if moral axioms can't meet the same burden of proof as telepathic claims, why should we trust them to ground a universal system?

  4.  let's apply your framework to the three fundamental principles: justice, prudence, and benevolence. if we hold those up to the evidential bar he used for psychical research—reproducibility, independent verification—do they actually survive? or does your reading suggest sidgwick secretly knew they wouldn't, which is why he left the system unfinished?

  5.  on the archival side: is there any direct trace of sidgwick himself drawing this parallel? did he ever write in his letters or drafts that the rigor of the SPR was informing his hesitation in *methods*, or are you reconstructing this connection from the structural similarities in his work?

  6.  you mention this explains his hesitation about utilitarianism despite treating it as self-evident. does this mean the famous "dualism of practical reason"—the failure to reconcile egoism and utilitarianism—isn't a philosphical problem for him, but actually a methodological one? like, he couldn't find the data to bridge the gap?

  7.  how does this change the definition of "clear intuition" in sidgwick's vocabulary? traditionally, an intuition is self-justifying. but if sidgwick is treating them like hypothesis-driven reports from the SPR, does "self-evident" just mean "currently unrefuted by peers"?

  8.  finally, if voss is right, what happens to the stability of utilitarianism? does this make sidgwick's system more robust because it admits its own evidential limits, or does it weaken the claim that utilitarianism is a rational necessity rather than just a best-fit theory based on incomplete data?

