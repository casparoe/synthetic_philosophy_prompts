answer: |-
  # Diagnostic Instrument: The Luck-Egalitarian Family Tree

  ## Part 1: The Decision Tree

  **Instructions:** Begin at the Root. At each numbered node, select the single sentence that best reflects your judgment about what the tax-and-transfer apparatus should do. Follow the branch indicated until you reach a Leaf.

  **Root Commitment:** An inequality traceable to factors a person had no hand in (brute luck) is *pro tanto* unjust.

  **1. Timing of the Principle**
  *Which of the following best describes the primary target of distributive justice?*
  *   **A.** The apparatus should regulate the **structure of chances** people face before the outcome is known, ensuring everyone faces equivalent risks (Ex Ante). → *Go to Node 2A*
  *   **B.** The apparatus should regulate the **actual outcomes** people suffer after the lottery has resolved, correcting for bad results (Ex Post). → *Go to Node 2B*

  **2A. Currency of Insurance (Ex Ante Branch)**
  *If we equalize chances via a hypothetical insurance market, what is the premium paid in?*
  *   **A.** **Resources:** The premium is calculated in terms of transferable external assets (money, property). → *Go to Node 3*
  *   **B.** **Welfare:** The premium is calculated in terms of expected well-being or satisfaction. → *Go to Node 3*

  **2B. The Underwriter Test (Ex Post Branch)**
  *For a loss to count as a responsible choice (option luck) rather than bad brute luck, must a competitive insurer have been willing to underwrite the risk at a finite premium at the moment of action?*
  *(Note: If no insurer would cover it because the risk is unmeasurable, unavoidable, or the agent lacks wealth to buy cover, this test treats the loss as brute luck.)*
  *   **A.** **Strict:** Yes, actual market insurability is required. → *Go to Node 3*
  *   **B.** **Weak:** Yes, but only counterfactually (an insurer would have written it had markets been complete and the agent solvent). → *Go to Node 3*
  *   **C.** **Reject:** No, insurability is irrelevant to moral responsibility. → *Go to Node 3*

  **3. The Regress of Causes**
  *Choices are shaped by prior circumstances. Where does the tracing of responsibility halt?*
  *   **A.** **Reasons-Responsiveness:** It halts when the agent was capable of recognizing and reacting to reasons for action, regardless of how those capacities were formed. → *Go to Node 4*
  *   **B.** **Deep Endorsement:** It halts only if the agent identifies with or endorses the desire that prompted the action. → *Go to Node 4*
  *   **C.** **No Stop:** There is no principled stopping point; all choices are ultimately products of circumstance. → *Go to Leaf 12*

  **4. The Imprudence Floor**
  *What is owed to agents who pass the responsibility tests above but make risky choices that leave them destitute?*
  *   **A.** **Nothing:** They are owed nothing beyond what is independently required to keep society functioning. → *Go to Node 5*
  *   **B.** **Penalized Aid:** They are owed aid, but at a level that leaves them strictly worse off than the prudent unlucky. → *Go to Node 5*
  *   **C.** **Full Floor:** They are owed a social minimum that makes their imprudence costless to them (no destitution). → *Go to Node 5*

  **5. The Leveling-Down Probe**
  *In a case where removing a brute-luck advantage makes the advantaged person worse off and benefits no one else, is this required?*
  *   **A.** **Required:** Equality is intrinsically valuable; the advantage must be removed. → *See Leaves 1–4*
  *   **B.** **Permitted/Forbidden:** Equality is only instrumentally valuable; do not level down. → *See Leaves 5–11*

  ---

  ### Terminal Leaves

  **Leaf 1: Hard Luck Egalitarianism**
  *   **Path:** Ex Post / Strict Underwriter / Reasons-Responsiveness / Nothing / Required.
  *   **Awkward Commitment:** A person who becomes blind due to a rare, uninsurable disease receives no compensation, while a person who loses savings in a fair gamble receives full compensation.
  *   **Occupied:** Yes (defended in early literature).
  *   **Leveling Down:** Committed.

  **Leaf 2: Soft Luck Egalitarianism**
  *   **Path:** Ex Post / Strict Underwriter / Reasons-Responsiveness / Penalized Aid / Permitted.
  *   **Awkward Commitment:** The state must track the moral worthiness of every claimant's past choices to determine their co-pay rate.
  *   **Occupied:** Yes.
  *   **Leveling Down:** Not committed.

  **Leaf 3: Market-Completed Luck Egalitarianism**
  *   **Path:** Ex Post / Weak Underwriter / Reasons-Responsiveness / Penalized Aid / Permitted.
  *   **Awkward Commitment:** Compensation depends on hypothetical market conditions that may never have existed, requiring speculative judgment by bureaucrats.
  *   **Occupied:** Unoccupied (theoretically possible, rarely defended).
  *   **Leveling Down:** Not committed.

  **Leaf 4: Volitionist Luck Egalitarianism**
  *   **Path:** Ex Post / Strict Underwriter / Deep Endorsement / Nothing / Permitted.
  *   **Awkward Commitment:** An addict who desperately wants to quit but cannot is compensated for their addiction costs, while an addict who embraces their habit is not.
  *   **Occupied:** Unoccupied (too administratively demanding).
  *   **Leveling Down:** Not committed.

  **Leaf 5: Democratic Equality (Hybrid)**
  *   **Path:** Ex Post / Reject Underwriter / Reasons-Responsiveness / Full Floor / Permitted.
  *   **Awkward Commitment:** Two people with identical needs receive different treatment based on a moral judgment of their past behavior, violating civic status.
  *   **Occupied:** Yes (Anderson-style views).
  *   **Leveling Down:** Not committed.

  **Leaf 6: Equality of Resources**
  *   **Path:** Ex Ante / Resources / Reasons-Responsiveness / Nothing / Permitted.
  *   **Awkward Commitment:** A person with expensive but unchosen medical needs receives less than a person with cheap needs, because the hypothetical insurance premium would have been lower.
  *   **Occupied:** Yes (Dworkin).
  *   **Leveling Down:** Not committed.

  **Leaf 7: Resourced Floor**
  *   **Path:** Ex Ante / Resources / Reasons-Responsiveness / Full Floor / Permitted.
  *   **Awkward Commitment:** The hypothetical insurance market is constrained by a prior guarantee of survival, rendering the market mechanism partially redundant.
  *   **Occupied:** Yes.
  *   **Leveling Down:** Not committed.

  **Leaf 8: Equality of Opportunity for Welfare**
  *   **Path:** Ex Ante / Welfare / Reasons-Responsiveness / Nothing / Permitted.
  *   **Awkward Commitment:** A person with expensive tastes they did not choose is compensated, potentially rewarding those with harder-to-satisfy preferences.
  *   **Occupied:** Yes (Arneson).
  *   **Leveling Down:** Not committed.

  **Leaf 9: Welfare Floor**
  *   **Path:** Ex Ante / Welfare / Reasons-Responsiveness / Full Floor / Permitted.
  *   **Awkward Commitment:** The state must subsidize the satisfaction of preferences up to a threshold, even if those preferences are trivial.
  *   **Occupied:** Yes.
  *   **Leveling Down:** Not committed.

  **Leaf 10: Hybrid Resource-Volitionist**
  *   **Path:** Ex Ante / Resources / Deep Endorsement / Full Floor / Permitted.
  *   **Awkward Commitment:** Requires assessing both hypothetical insurance premiums and the psychological depth of the agent's desire formation.
  *   **Occupied:** Unoccupied (unexplored).
  *   **Leveling Down:** Not committed.

  **Leaf 11: Hybrid Market-Volitionist**
  *   **Path:** Ex Post / Weak Underwriter / Deep Endorsement / Penalized Aid / Permitted.
  *   **Awkward Commitment:** Combines the speculative nature of weak underwriting with the intrusive nature of deep endorsement.
  *   **Occupied:** Unoccupied (unexplored).
  *   **Leveling Down:** Not committed.

  **Leaf 12: Luck Skepticism (Strict Egalitarianism)**
  *   **Path:** Ex Post / Reject Underwriter / No Stop / Full Floor / Permitted.
  *   **Awkward Commitment:** Abandons the root commitment; treats all inequality as *pro tanto* unjust regardless of choice, effectively ignoring the distinction between brute and option luck.
  *   **Occupied:** Yes.
  *   **Leveling Down:** Permitted (but usually rejected on efficiency grounds).

  ***

  ## Part 2: The Sorting Quiz

  **Instructions:** For each case, select the option that best matches your verdict on what the tax-and-transfer apparatus should do. Do not select based on which principle sounds best; select based on the concrete policy outcome.

  **1. The Commuter (Gradient Low)**
  A driver exceeds the speed limit by 5 mph to get to work on time. This is a common, low-risk violation. They are involved in a collision caused by the speed, injuring themselves and losing income.
  *   A. Compensate fully for medical costs and lost income.
  *   B. Compensate medical costs only; deny lost income.
  *   C. Provide no compensation; the driver bears the loss.

  **2. The Enthusiast (Gradient Medium)**
  A motorcyclist chooses not to wear a helmet, knowing the statistical risk of head injury is significantly higher. They suffer a head injury in an accident not of their making, losing income.
  *   A. Compensate fully for medical costs and lost income.
  *   B. Compensate medical costs only; deny lost income.
  *   C. Provide no compensation; the rider bears the loss.

  **3. The Stuntman (Gradient High)**
  A professional stuntman is paid to jump a motorcycle over a bus. He knows the risk of paralysis is 10%. He paralyzes himself. He is now unable to work.
  *   A. Compensate fully for medical costs and lost income.
  *   B. Compensate medical costs only; deny lost income.
  *   C. Provide no compensation; the stuntman bears the loss.

  **4. The Uninsurable (Underwriter Fail)**
  A citizen develops a rare genetic condition. No private insurer ever offered coverage for this condition because the risk was unmeasurable, and the citizen was too poor to pay a premium when healthy.
  *   A. Treat as brute luck; compensate fully.
  *   B. Treat as option luck; compensate partially (as if insurance existed).
  *   C. Treat as option luck; compensate not at all.

  **5. The Gambler's Child (Third Party)**
  A parent gambles away the family savings on a fair bet. The parent is content with the risk, but their young child is now destitute and malnourished.
  *   A. Compensate the child fully from public funds.
  *   B. Compensate the child minimally (survival only).
  *   C. Provide no compensation; the family unit bears the loss.

  **6. The Negligent Farmer (Culpable Ignorance)**
  A farmer ignores a free, publicly available weather report warning of frost. He plants a sensitive crop. Frost kills the crop. He claims this was bad brute luck.
  *   A. Compensate fully; the frost was the cause.
  *   B. Compensate partially; he should have checked.
  *   C. Provide no compensation; the ignorance was culpable.

  **7. The Natural Immune (Leveling Down)**
  One citizen has a naturally superior immune system due to genetic brute luck. They never get sick. Others get sick often. The only way to equalize health is to lower the first citizen's immunity without raising others'.
  *   A. Do it; equality is required.
  *   B. Do not do it; equality is not required here.
  *   C. Tax the healthy citizen to pay for the sick, but do not lower immunity.

  **8. The Gourmet (Expensive Taste: Deliberate)**
  A citizen deliberately trained their palate to enjoy only expensive food. They claim they cannot enjoy cheap food. They are poor.
  *   A. Subsidize their food to match their taste.
  *   B. Provide a standard food stipend; they must adjust.
  *   C. Provide a standard stipend plus a small adjustment for difficulty.

  **9. The Cultivated Need (Expensive Taste: Unchosen/Attenuatable)**
  A citizen has a high-calorie requirement due to a metabolism they did not choose. They could attenuate this need through a modest-cost therapy they have not yet accessed.
  *   A. Subsidize the extra food immediately.
  *   B. Subsidize the therapy; withhold food subsidy until tried.
  *   C. Provide standard food stipend only.

  **10. The Twin Lotteries (Timing)**
  Two citizens face identical risks of job loss due to industry collapse (50% chance). Citizen X loses their job. Citizen Y keeps theirs.
  *   A. Compensate Citizen X fully to match Citizen Y (Ex Post).
  *   B. Tax both citizens ex ante to fund an insurance pool, paying X from the pool (Ex Ante).
  *   C. Do nothing; the outcome was a fair risk.

  ***

  ## Part 3: Scoring Key and Diagnostic Appendix

  ### Scoring Key

  Map your dominant answer pattern to the Leaves in Part 1.

  *   **Dominant C on Items 1, 2, 3, 6:** You lean toward **Ex Post** correction with a strong responsibility constraint. Look to Leaves 1, 2, 4.
      *   If **A on Item 4:** You reject the Strict Underwriter Test (Leaf 5 or 12).
      *   If **B on Item 4:** You accept the Weak Underwriter Test (Leaf 3 or 11).
      *   If **C on Item 4:** You accept the Strict Underwriter Test (Leaf 1, 2, or 4).
  *   **Dominant A on Items 1, 2, 3:** You lean toward **Ex Ante** pooling or Luck Skepticism. Look to Leaves 6, 7, 8, 9, 12.
      *   If **B on Item 10:** You are Ex Ante (Leaves 6–11).
      *   If **A on Item 10:** You are Ex Post (Leaves 1–5).
  *   **Item 5 (Child):** If **A**, you support a **Full Floor** regardless of parental imprudence (Leaves 5, 7, 9, 12). If **C**, you support **No Aid** for derivative imprudence (Leaves 1, 4, 6, 8).
  *   **Item 7 (Leveling Down):** If **A**, you are committed to intrinsic equality (Leaf 1). If **B/C**, you view equality as instrumental (All other Leaves).
  *   **Items 8 & 9 (Tastes):** If **A**, you lean toward **Welfare** currency (Leaves 8, 9). If **B**, you lean toward **Resources** or Responsibility (Leaves 6, 7, 1–5).

  ### Diagnostic Appendix

  **1. Unoccupied Regions of Logical Space**
  *   **Region A (Ex Ante + No Regress Stop):** *Diagnosis: Incoherent.* An Ex Ante insurance model presupposes an agent capable of calculating premiums and risks. If there is "No Stop" to the regress of causes (Leaf 12 path), the agent lacks the capacity to purchase hypothetical insurance, rendering the Ex Ante mechanism inoperable.
  *   **Region B (Ex Post + Strict Underwriter + Full Floor):** *Diagnosis: Unattractive.* This view insists that only insurable risks count as responsibility (Strict Underwriter) but then fully compensates even those who fail the test (Full Floor). This collapses the distinction between brute and option luck in practice, making the Strict Underwriter test functionally redundant.
  *   **Region C (Ex Ante + Welfare + Deep Endorsement):** *Diagnosis: Unexplored.* While Equality of Opportunity for Welfare exists, combining it with a Deep Endorsement requirement creates an administrative paradox: the state must measure welfare (subjective) while simultaneously judging the metaphysical depth of the desire (psychological). No theorist has attempted this due to measurement impossibility.

  **2. Indistinguishable Leaves (Verdictally Equivalent)**
  *   **Pair 1: Leaf 6 (Equality of Resources) and Leaf 2 (Soft Luck Egalitarianism).**
      *   *Why:* In a stable society with functioning markets, the "hypothetical insurance premium" for Resources (Leaf 6) often yields the same compensation levels as "Penalized Aid" for option luck (Leaf 2).
      *   *Prying Case:* A case of **non-marketable resources** (e.g., innate talent that cannot be insured). Leaf 6 taxes the talent (internal endowment); Leaf 2 may not if the talent wasn't "risked."
  *   **Pair 2: Leaf 5 (Democratic Equality) and Leaf 12 (Luck Skepticism).**
      *   *Why:* Both mandate a Full Floor and reject the Underwriter Test. In most standard cases of destitution, they prescribe identical transfers.
      *   *Prying Case:* **Expensive Tastes.** Leaf 5 may deny compensation for chosen expensive tastes to preserve civic status equality. Leaf 12 compensates all needs regardless of origin because responsibility is irrelevant.

  **3. Pivot vs. Confirmatory Items**
  *   **Pivot Items:** Items 1, 2, 3 (The Gradient) and Item 4 (Underwriter Fail). These determine the primary branch (Timing/Responsibility) and the Underwriter status. A shift in verdict here moves the student to a different major branch of the tree.
  *   **Confirmatory Items:** Items 8, 9 (Tastes) and Item 7 (Leveling Down). These refine the specific Leaf within a branch (Currency and Intrinsic Value) but rarely move a student from Ex Post to Ex Ante.

  **4. Excluded Positions (By Stipulation)**
  *   **Strict Libertarianism:** Excluded by the Root Commitment. Libertarians deny that brute luck inequality is *pro tanto* unjust.
  *   **Strict Utilitarianism:** Excluded by the Root Commitment. Utilitarians care about aggregate welfare, not the source of inequality (luck vs. choice).
  *   **Feasibility-Constrained Views:** Excluded by the seminar parameters. Views that say "we should do X but can't" are treated as "we should do X."
  *   **Relational Egalitarianism (Pure):** Excluded by the focus on distributive shares. Views that reject distribution entirely in favor of social relations are mapped only insofar as they accept a distributive floor (Leaf 5).
