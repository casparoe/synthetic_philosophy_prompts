answer: |-
  Here is a 50-minute lesson plan designed for your specific constraints and audience.

  ### **Pre-Class Prep**
  *   **Board Work:** Draw three distinct diagrams on the board before class starts.
      1.  **Tree:** A root node branching upward.
      2.  **Web:** A mesh of interconnected nodes (no clear start/end).
      3.  **Chain:** A line of nodes extending indefinitely to the left.
  *   **Handout (Optional):** A single sheet with the three definitions and the "Diagnostic Scenario" for the end.
  *   **Exclusions:** You are explicitly excluding Internalism/Externalism and Reliabilism. State this clearly so students don't try to smuggle them in.

  ---

  ### **0:00 – 0:05 | Introduction: Structure vs. History**
  **Goal:** Activate the regress problem without re-teaching it, and kill the "Psychological/History" misconception immediately.

  **Say:**
  "Last week we talked about observation as the bedrock of science. Naturally, many of you walked in today thinking, 'Problem solved: Observation is the foundation.' But in epistemology, 'Observation' is just a label for a *type* of foundation. The harder question is: What does the *structure* of justification look like?

  "Before we start, one rule: We are talking about the **logic of reasons**, not the **history of your brain**.
  "If I ask, 'Why do you believe the sky is blue?' and you say, 'Because I saw it,' that's a causal history.
  "If I ask, 'What *justifies* that belief?' and you say, 'My visual experience,' that's a justificatory structure.
  "Infinitism, for example, is not the claim that you have infinitely many beliefs stored in your head. That's impossible. It's the claim that the *chain of reasons available to you* has no end. Keep that distinction in mind, or Infinitism will sound insane."

  **Transition:**
  "Let's use an example that fits your majors. We aren't talking about 'The Sky.' We're talking about **Verifying a Code Commit.**"

  ---

  ### **0:05 – 0:15 | Foundationalism (The Tree)**
  **Goal:** Validate their instinct, then show the crack in the foundation.

  **Say:**
  "Most of you are instinctive Foundationalists. You think justification looks like a **Proof Tree**.
  "In our example: Why is this code secure?
  "Because it passed the unit test.
  "Why trust the test?
  "Because the testing framework is valid.
  "Why trust the framework?
  "Eventually, you hit a **Root Node**. An axiom. A basic belief that doesn't need further justification to support others. For Foundationalists, the regress stops here."

  **The Strong Point (Ask them):**
  "Why is this attractive? It gives you certainty. It stops the regress. It mirrors how you build systems: bottom-up from stable libraries."

  **The Best Objection (You provide):**
  "The Isolation Problem (or The Myth of the Given).
  "Imagine a belief that is *so* basic it needs no other belief to support it. How does it connect to the rest of the system? If it's just 'raw experience' or 'self-evident,' can it actually justify a complex claim above it?
  "Put another way: If the foundation is 'I see red,' how does that justify 'The sensor is malfunctioning'? There's a gap between the foundation and the superstructure."

  **Transition:**
  "So, Foundationalism stops the regress by digging down to bedrock. But what if there is no bedrock? What if the only way to check a belief is to check it against *other* beliefs?"

  ---

  ### **0:15 – 0:25 | Coherentism (The Web)**
  **Goal:** Distinguish from circular reasoning; address the "Fairy Tale" objection.

  **Say:**
  "This is Coherentism. Justification isn't a tree; it's a **Dependency Graph** or a Web.
  "A belief is justified if it coheres—fits logically and consistently—with the rest of your belief system.
  "In our example: The code is secure because it fits the architecture, matches the documentation, and the logs agree with the output. No single node is the root; they hold each other up."

  **The Strong Point (Ask them):**
  "Why do this? Because it matches how science actually works. We don't test hypotheses in isolation; we test them against a network of theories. It handles uncertainty better than Foundationalism."

  **The Best Objection (You provide):**
  "The 'Fairy Tale' Objection (Vicious Circularity).
  "Imagine a fantasy novel. Inside the book, everything is consistent. Dragons exist, magic works, it all coheres. But the book isn't *true*.
  "Coherence is internal consistency. But justification requires a connection to the *world*. If your web is tight but detached from reality, are you justified, or just consistent?
  "Note: Coherentists argue a web *does* touch the world through 'observation inputs,' but they deny those inputs are 'foundations.' They are just another node in the web."

  **Transition:**
  "Foundationalism stops the regress. Coherentism bends it into a circle. But there is a third option that says: 'Why does the regress have to stop?'"

  ---

  ### **0:25 – 0:35 | Infinitism (The Chain)**
  **Goal:** Block the psychological objection; frame it as a feature, not a bug.

  **Say:**
  "This is Infinitism. Justification is an **Infinite Chain** of reasons.
  "Wait—[Hold up hand]—I know what you're thinking. 'I don't have infinite time or brain space.'
  "Remember the rule: **Structure, not History.**
  "Infinitism says: For any reason $R_1$ you give, there *must be available* a further reason $R_2$, and for that, $R_3$. You don't need to hold them all in your head at once. You just need to be able to produce the next link if challenged."

  **The Strong Point (You provide):**
  "This is the only view that takes the Regress Argument literally. It admits that every reason *is* the kind of thing that needs justification. It avoids the arbitrariness of Foundationalism (why stop there?) and the circularity of Coherentism (isn't that cheating?). It treats justification as a **process**, not a state."

  **The Best Objection (Ask them):**
  "If justification is an infinite task, can it ever be completed? If I can never finish the chain, am I ever actually justified *now*?
  "Infinitists reply: Justification isn't a box you check; it's a status you hold as long as the chain *can* continue. But for most of you, this feels like kicking the can down the road forever."

  **Transition:**
  "So we have three shapes: Tree, Web, Road. What if none of them work?"

  ---

  ### **0:35 – 0:38 | The Fourth Option (Skepticism)**
  **Goal:** Name it, set it aside, keep the clock.

  **Say:**
  "There is a fourth option: **Skepticism**.
  "This says: Foundationalism fails (no secure foundations). Coherentism fails (circular). Infinitism fails (impossible task).
  "Conclusion: Nothing is justified.
  "We are not choosing this today. We are assuming justification is possible and asking *how*. Treat Skepticism as the 'Game Over' screen we are trying to avoid."

  ---

  ### **0:38 – 0:45 | The Diagnostic Assessment**
  **Goal:** Test application, not recall.

  **Activity:**
  Put this scenario on the board/screen:

  > **The Scenario:** An autonomous trading algorithm makes a massive sell order.
  > **The Audit:**
  > 1.  The engineers check the code logic (it follows the rules).
  > 2.  They check the market data input (it was accurate).
  > 3.  They check the ethical guidelines (it didn't violate constraints).
  > 4.  When asked "Why trust the ethical guidelines?", they say, "Because they align with our corporate charter."
  > 5.  When asked "Why trust the charter?", they say, "Because it was signed by the founders."
  > 6.  When asked "Why trust the founders?", they have no answer other than "We just do."

  **The Question:**
  "Look at the Audit.
  1.  Which view (Foundationalism, Coherentism, Infinitism) best describes the engineers' *actual* justification process in steps 1–3?
  2.  Where does their justification *fail* according to a Coherentist?
  3.  How would an Infinitist diagnose the failure at step 6?"

  **Discussion (5 mins):**
  *   *Expected Answer 1:* Steps 1-3 look Coherentist (mutual support of code, data, guidelines).
  *   *Expected Answer 2:* Coherentist says the Charter/Founders node is isolated or arbitrary if it doesn't cohere with external ethical standards (The Fairy Tale objection).
  *   *Expected Answer 3:* Infinitist says Step 6 is the sin: they stopped the chain. They should have a further reason for trusting the founders (e.g., "Founders have track record," which relies on "Track records predict future," etc.).

  **Why this works:** It forces them to identify the *structure* of the reasoning, not just label a belief. It exposes where Foundationalism creeps in (Step 6 "We just do" is a bad foundation).

  ---

  ### **0:45 – 0:50 | Wrap Up**
  **Goal:** Solidify the takeaway.

  **Say:**
  "Next week we'll talk about whether justification is even the right goal. But for today, remember:
  "Foundationalism gives you stability but risks isolation.
  "Coherentism gives you integration but risks circularity.
  "Infinitism gives you honesty about the regress but risks never finishing.
  "Your job isn't to pick the winner today. It's to recognize which shape you're using when you argue."

  ---

  ### **Instructor Notes & Troubleshooting**

  **1. On the "Shape" Framing:**
  *   **Keep it.** It works perfectly for Econ/CS majors (Trees, Graphs, Streams).
  *   **The Fix:** You must explicitly label the diagrams **"Logical Space"** not **"Mental Space."** When you draw the Infinitist chain, write *"Potential Reasons"* next to it, not *"Stored Beliefs."* If you don't make this distinction in the first 5 minutes, the Infinitism section will fail.

  **2. On the Citation Example:**
  *   **Your instinct is correct: It is rot.**
  *   **Why:** In academia, a citation *ends* at a published paper. Students will treat the "Primary Source" as a Foundational Belief. It smuggles in the answer you want them to question.
  *   **The Fix:** Use the **"Verification/Audit"** example above. It forces a chain of *reasons* (rules, data, ethics) rather than a chain of *sources*. It makes the "stopping point" feel arbitrary, which opens the door for Coherentism and Infinitism.

  **3. On Misconceptions:**
  *   **"Foundationalism = Indubitable":** Head this off in the Foundationalism section. Say: "Foundations don't have to be certain; they just have to be *non-inferential*."
  *   **"Coherentism = Circular":** Head this off in the Coherentism section. Use the "Web" vs. "Loop" distinction. A loop is $A \to B \to A$. A web is $A$ supported by $B, C, D$, which are supported by $A, E, F$.
  *   **"Structure vs. History":** You addressed this in the Intro. Reinforce it if a student says, "But I can't think of infinite reasons." Reply: "You don't have to think of them all at once. You just have to acknowledge another is available."

  **4. What to Refuse to Cover:**
  *   **Say this explicitly:** "We are setting aside **Reliabilism** and the **Internalism/Externalism** debate. Those are about *what makes* a belief justified (reliability vs. access). Today is only about the *structure* of the reasons once you have them. If you try to solve the regress by saying 'It doesn't matter, as long as the brain works reliably,' you are changing the subject."

  **5. Timing Buffer:**
  *   If you run long on Foundationalism (likely, since they love it), cut the Skepticism section to 1 minute. It is the least important for your learning goals. Do not cut the Infinitism psychological objection; that is the make-or-break moment for that view.
