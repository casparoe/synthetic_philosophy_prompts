prompt: |-
  Say you're advising a small research group — like three post-docs for two years — on escalation dynamics and commitment traps. I'm trying to work out where the conceptual work actually is versus just running more experiments. There's the classic dollar-auction framing, but I'm particulary interested in a twist: what if escalation isn't mainly sunk-cost reasoning but a 'reputational lock-in' where agents keep bidding because withdrawing signals weakness to obsrevers, a kind of second-order commitment trap?

  Given that, which open questions should they prioritise? I'm torn between: (1) whether reputational lock-in can be separated formally from rational sunk-cost reasoning, (2) how escalation scales differently in collective versus individual decision-making, and (3) whether there's a robust distinction between 'rational escalation' and 'pathological escalation' once observer effects are in the model.

  Rank them in terms of upstream dependency — which answer reshapes the others — and say what kind of result (formal, empirical, conceptual) would actually change your mind. Don't bother with bibliographies or citation lists; I'm just trying to place my dissertation chapter.

  Please lead with your bottom line in the first sentence — the single question you'd fund first — then the reasoning. No preamble, and don't restate the question.
