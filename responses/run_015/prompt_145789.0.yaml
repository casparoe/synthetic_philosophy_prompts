answer: |-
  # The Specification Problem: Desiderata for Subject-Unity

  To evaluate existing theories of consciousness, we must first specify what a theory of *subject-unity* is required to do. The purpose of this account is not merely metaphysical taxonomy; it is to ground the ascription of agency and responsibility in clinical and legal contexts, while simultaneously preserving the integrity of the phenomenological claim—what it is like to be the subject. The following desiderata fix the target.

  ### 1. The Phenomenal-Access Distinction
  **Requirement:** The account must distinguish between experiences that are phenomenally co-conscious (had together) and experiences that are jointly available for report, reasoning, or rationalizing action.
  **Case:** Intra-hemispheric dissociation and standard post-callosotomy. In the latter, the left hemisphere verbally confabulates a rationale for the left hand's action, which it did not initiate and does not phenomenally control, yet reports it as its own. Conversely, in blindsight-like intra-hemispheric cases, a subject may act on visual data they deny experiencing.
  **Status:** **Non-negotiable.**
  **Rationale:** If unity is defined solely by joint reportability, the confabulating left hemisphere counts as "unified" with the left hand's motive when it is not. If unity is defined solely by phenomenal co-consciousness, we lose the ability to explain why the subject cannot reason across the divide. A theory must explain why report can lie about unity, and why unity can exist without report.

  ### 2. The Subject-Person Distinction
  **Requirement:** The account must distinguish the count of *conscious subjects* from the count of *persons* (legal/moral agents).
  **Case:** Standard post-callosotomy vs. Children with hemispherectomy.
  **Status:** **Non-negotiable.**
  **Rationale:** In legal contexts, we punish persons. In phenomenological contexts, we count subjects. A hemispherectomy patient functions as one person and arguably one subject due to plasticity. A post-callosotomy patient functions as one person but may harbor two subjects. A theory that collapses these cannot guide responsibility: we need to know if we are holding one subject responsible for two streams of action, or two subjects responsible for one body.

  ### 3. The Third-Party Constraint (Operationalizability)
  **Requirement:** The criterion for unity must be applicable by a third party to a subject who cannot speak or whose reports are unreliable.
  **Case:** Stipulated Case 1 (The Dual-Answer/Unified-Endorsement). A callosotomy patient writes incompatible answers with each hand, each disclaiming knowledge of the other. Yet, when asked "Which answer is yours?", both hands point to the same one.
  **Status:** **Non-negotiable** (given the clinical/legal purpose).
  **Rationale:** If unity relies entirely on first-person authority, the legal system cannot adjudicate cases involving non-communicative patients or conflicting outputs. This case suggests a hierarchy: informational encapsulation (writing different answers) may exist alongside a deeper unity of ownership (both hands endorsing one answer). The theory must provide public markers for this deeper unity.

  ### 4. The Plasticity and Structure Constraint
  **Requirement:** The account cannot rely solely on anatomical connectivity (e.g., corpus callosum integrity) to determine unity.
  **Case:** Agenesis of the corpus callosum and Hemispherectomy.
  **Status:** **Non-negotiable.**
  **Rationale:** Individuals born without a corpus callosum often display unified behavior and report, unlike post-callosotomy patients. Children with one hemisphere removed develop unified consciousness. If anatomical bridge were sufficient for unity, agenesis would yield disunity; if it were necessary, hemispherectomy would yield impossibility. The theory must appeal to functional integration or phenomenological structure, not just wiring.

  ### 5. The Continuity Constraint
  **Requirement:** The account must accommodate the intuition that integration can vary by degree, even if it ultimately delivers a binary verdict for legal purposes.
  **Case:** Stipulated Case 2 (The Adjustable Link). An implanted cortical link bridges two hemispheres (or two people's cortices) with adjustable bandwidth.
  **Status:** **Preference of Integrationists** (but reality-constrained).
  **Rationale:** As bandwidth increases, information sharing increases. A binary theory must identify a threshold where "two subjects" become "one." A graded theory must explain how legal responsibility tracks the grade. A theory that insists unity is all-or-nothing regardless of bandwidth fails to capture the biological reality of the dial.

  ### 6. The Diachronic-Synchronic Distinction
  **Requirement:** The account must separate unity *at a time* (co-consciousness) from unity *over time* (psychological continuity).
  **Case:** Amnesia vs. Split-Brain.
  **Status:** **Non-negotiable.**
  **Rationale:** A patient may lose diachronic unity (memory loss) while retaining synchronic unity (visual field and bodily sensation are unified now). Conversely, split-brain evidence challenges synchronic unity while diachronic memory may remain intact within each hemisphere. Legal responsibility often hinges on diachronic continuity; clinical phenomenology hinges on synchronic unity. The theory must not conflate them.

  ---

  ### Meta-Theoretical Commitments

  **Determinate Count vs. Degree:**
  Given the stated purpose (legal/clinical ascription), the theory **owes a determinate count** in the final analysis. While the *underlying mechanisms* (Stipulated Case 2) may be graded, the ascription of responsibility requires a binary verdict: guilty or not, one patient or two. However, the theory must acknowledge that in "dial" cases, the binary verdict may be a pragmatic cutoff imposed on a graded reality, not a metaphysical discovery.

  **The Bearing of Split-Brain Evidence:**
  For split-brain evidence to bear on *experience* rather than merely on *report pathways*, the theory must posit that behavioral encapsulation (one hand not knowing what the other sees) is a reliable proxy for phenomenal separation *unless* overridden by a higher-order unity marker (such as Stipulated Case 1's unified endorsement). If behavior is merely a disconnected output channel, the evidence is irrelevant to consciousness. The theory must justify why we take the left hand's ignorance as evidence of the *subject's* ignorance.

  ### Flagged Tensions

  **Tension A: Phenomenal Privacy vs. Third-Party Verification.**
  There is a severe conflict between the requirement to **refuse reducing phenomenal unity to functional access** (Desideratum 1) and the demand for a **standard third parties could apply** (Desideratum 3). If phenomenal unity is private and distinct from access, how can a clinician verify it without relying on access (report/behavior)? Satisfying Desideratum 1 risks making the theory legally useless; satisfying Desideratum 3 risks reducing consciousness to behaviorism.

  **Tension B: Graded Reality vs. Binary Verdict.**
  There is a conflict between accommodating the **Continuity Constraint** (Desideratum 5) and the **Legal Purpose**. If unity is a matter of degree (as the cortical dial suggests), a binary legal verdict is necessarily a fiction. The theory must either deny the graded intuition (claiming a sharp threshold exists) or admit that legal personhood is a pragmatic overlay on a vague metaphysical reality.

  ---

  ### Landscape of Views

  **Access/Workspace Accounts:**
  Unity is defined by global availability of information for report and reasoning. They satisfy the Third-Party Constraint easily but fail the Phenomenal-Access Distinction, rendering confabulation indistinguishable from genuine unity.

  **Phenomenal/Co-consciousness Accounts:**
  Unity is a primitive relation between experiences. They respect the Phenomenal-Access Distinction but struggle with the Third-Party Constraint, as they lack public criteria for counting subjects in non-communicative cases.

  **Integration Accounts:**
  Unity is a matter of causal or informational integration (e.g., IIT). They handle the Continuity Constraint and Plasticity well but often collapse the Subject-Person distinction, potentially assigning subjecthood to systems the law treats as objects.

  **Higher-Order Accounts:**
  Unity is determined by a higher-order thought targeting first-order states. They explain Stipulated Case 1 (unified endorsement) well but risk over-intellectualizing consciousness and failing the Agenesis case if higher-order monitoring is disrupted.

  **Indeterminacy Views:**
  This view holds there is no fact of the matter regarding the subject count in borderline cases. It dissolves the Tension B (Graded vs. Binary) but renders the Legal Purpose impossible to fulfill metaphysically, reducing verdicts to pure stipulation.

  **The Narrowing Desideratum:**
  The **Third-Party Constraint (Desideratum 3)** does the most to narrow the field. It eliminates pure Phenomenal accounts (which are private) and Indeterminacy views (which offer no verdict). It forces the theory to ground subjecthood in observable structure or behavior, privileging Access, Integration, or Higher-Order accounts that can specify public conditions for unity.
