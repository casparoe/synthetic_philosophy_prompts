answer: |-
  Here is the translation of the philosophical dispute into your native vocabulary, followed by the test cases and the residue report.

  ### I. The Translation

  **The Coding (Semantic) View → The ISA/ABI Specification View**
  On this view, the genome is **object code** (a byte string). The cellular machinery (ribosomes, tRNAs, polymerases) constitutes the **hardware implementation of an Instruction Set Architecture (ISA)**. The phenotype is the **executed state** or output of the program.
  *   **Semantics:** The meaning of a codon is fixed by the ISA specification. Just as `0x90` is `NOP` on x86 because the Intel Manual says so and the decoder is wired to treat it as such, `AUG` is `Met` because the translation machinery is wired to treat it as such.
  *   **Information:** The DNA carries information in the sense that it is a symbolic representation distinct from the physical forces executing it. It is the *instruction*, not the *voltage*.
  *   **Normativity:** There is a "correct" execution. A mutation is a **bug** or **undefined behavior** relative to the spec. The spec is defined by the standard translation machinery (the "standard library" of the cell).

  **The Parity (Causal-Structural) View → The Signal Integrity/Physics View**
  On this view, calling DNA "code" is a category error born of focusing on one signal trace while ignoring the rest of the motherboard.
  *   **Causation:** The DNA strand is just one **signal trace** among many. The cytoplasm is the **power rail**; the temperature is the **thermal envelope**; the methylation state is the **fuse configuration**.
  *   **Parity:** Why privilege the signal trace (DNA) as "information" and the power rail (cytoplasm) as mere "cause"? Both are necessary physical conditions for the logic gates to switch. Without the power rail, the signal trace does nothing. Without the signal trace, the power rail does nothing. They are on causal par.
  *   **Information:** "Information" is just **reliable covariance**. If signal trace A toggles, output B toggles. There is no "spec" or "meaning," only physical correlation. The "code" metaphor smuggles in an implicit designer who wrote the spec, but evolution is not a compiler writer.

  ---

  ### II. The Test Cases

  **1. Variant Mitochondrial Codon Table**
  *   **ISA View:** This is a **CPU revision or compatibility mode**. Think of running x86 code on a specific microarchitecture where certain opcodes have microcode patches or different latency/semantics. The byte string (`UGA`) is identical, but the decoder logic (mitochondrial ribosome) implements a slightly different ISA version. The "meaning" is still semantic, just relative to a different hardware implementation of the spec.
  *   **Signal View:** This is **impedance mismatch**. The voltage threshold for a "high" signal on this specific bus (mitochondria) is different. The wire carries the same potential, but the transistor gate on the receiving end switches at a different voltage. There is no "different spec," just different physical response characteristics in a sub-circuit.

  **2. Synthetic Organism (6-letter, 216-codon, Orthogonal Machinery)**
  *   **ISA View:** This is a **custom instruction set extension** (like AVX-512 or RISC-V extensions). You have widened the bus and defined new opcodes. Because you built the decoder (orthogonal machinery) to match the new object code, the semantics are stable. It proves DNA is code because you can refactor the alphabet and the ISA without breaking the "program," provided you update the "compiler" (synthesis) and "CPU" (translation).
  *   **Signal View:** This is **increased bandwidth signaling**. You are using a higher-order modulation scheme on the physical medium. It demonstrates physical plasticity, not semantic depth. You haven't created "meaning"; you've just engineered a more complex causal chain where specific molecular shapes fit into specific binding pockets. It's still just physics, just with more states.

  **3. Recoding (UGA = Sec or Stop via Downstream Element)**
  *   **ISA View:** This is **context-sensitive decoding** or **prefix bytes**. The opcode `UGA` is not atomic; its interpretation depends on a flag set by a downstream structure (SECIS element). It is akin to an escape sequence, a segment override prefix, or position-independent code where the effective address depends on the instruction pointer's location relative to a data table. The semantics are dynamic but still rule-governed by the ISA.
  *   **Signal View:** This is **signal interference / logic gating**. The downstream RNA structure physically occludes or enables a binding site. It is a hardware interlock. The "Stop" factor cannot physically latch because the "Sec" factor is held in place by the fold. It is not "reading" the context; the context physically blocks the causal pathway. It's a race condition resolved by structure, not a lookup table resolved by logic.

  **4. Inherited Methylation / Prion (No Sequence Change)**
  *   **ISA View:** This is **Self-Modifying Code (SMC)** or **Persistent Configuration Registers**. The object code (DNA sequence) is unchanged, but the execution environment has been patched. Methylation is like setting a fuse in the CPU config register that alters how the decoder interprets the opcode stream. Since it is heritable, the config register state is saved and restored across reboots (cell divisions).
  *   **Signal View:** This is **Stateful Hardware**. The "program" isn't just the ROM (DNA); it's the entire machine state. A prion is a latch circuit that has flipped. Why call the ROM the "code" and the latch state "epigenetics"? Both are physical states required for the next cycle. If the latch determines the output, the latch is as much a "cause" as the ROM. Parity demands we treat the methylation mark as co-equal to the sequence.

  ---

  ### III. Residue Report

  Here is what survives the compilation from Philosophy to ISA, and what throws linkage errors.

  #### 1. Clean Translations
  *   **Context-Dependence:** Your understanding of PIC and relocation maps perfectly to context-sensitive codon usage. The idea that a byte's meaning depends on the "machine state" (cellular context) is native to you.
  *   **Causal Necessity:** The Parity view's claim that cytoplasm is as necessary as DNA translates cleanly to "Power rails are as necessary as data buses."
  *   **Orthogonality:** The synthetic organism case translates cleanly as "ISA Extension." It shows the decoupling of representation (sequence) from mechanism (translation).

  #### 2. Distorted Translations
  *   **Function:** In your world, a function has a signature and a purpose defined by the API. In biology, "function" is selected for, not specified.
      *   *Distortion:* If you treat a gene as a `function()`, you imply it has a defined return value. The Parity view argues it's just a basic block that happens to contribute to a halting state (survival). The "purpose" is retroactive, not prospective.
  *   **Arbitrariness:** In ISAs, opcodes are arbitrary (why is `ADD` `0x01`? Because Intel said so). In biology, codons are "frozen accidents," but they are constrained by chemical affinity (stereochemical theory).
      *   *Distortion:* Your vocabulary assumes opcodes are *purely* arbitrary mappings. If biology has chemical constraints on the mapping, the "code" is less like an ISA and more like an analog circuit where voltage levels map to specific physical outcomes.

  #### 3. Linkage Errors (What Fails)
  *   **Normativity (The "Correct" Reading):**
      *   *Failure:* In compilers, a segfault is an error because it violates the memory model spec. In biology, a mutation is only an "error" if the organism dies. There is no external "Intel Manual" for the cell.
      *   *Analysis:* The Coding View *needs* a spec to exist for "information" to be distinct from "causation." The Parity View says there is no spec, only physics. Your vocabulary **presupposes a spec** (the ISA). You cannot say "undefined behavior" without implying a "defined behavior" authority.
      *   *Verdict:* This is your vocabulary's blind spot. You work in a teleological domain (engineered systems). Biology is an a-teleological domain (evolved systems). The Coding View tries to smuggle teleology into biology; the Parity View tries to purge it.
  *   **The "Designer" Bias:**
      *   *Failure:* When you say "machine code," you imply a compiler wrote it. When you say "ISA," you imply an architect designed it.
      *   *Analysis:* Your vocabulary quietly takes the **Coding View's side** by structural necessity. To speak of "semantics" in your world is to speak of "intent." The Parity View is an attempt to describe the system *as if no compiler ever existed*.
      *   *Verdict:* The philosophical dispute is not thin; it is fundamental. But your vocabulary is weaponized for the Coding View. To speak the Parity View faithfully, you would have to stop calling it "code" and start calling it "state propagation."

  #### 4. Final Diagnostic
  *   **Error:** In your world, error is deviation from spec. In biology, error is deviation from viability. The Coding View tries to make viability the spec. The Parity View says viability is just a boundary condition, not a spec.
  *   **Mistranslation:** Calling methylation "Self-Modifying Code" is a mistranslation. SMC changes the instruction stream. Methylation changes the *accessibility* of the stream. It is more like a **Memory Protection Unit (MPU)** configuration than the code itself. The Parity View wins here: the MPU config is hardware state, not software code.
  *   **The "Meaning" of a Byte:** You noted: *"a byte string's meaning is settled by whatever machine happens to read it."*
      *   **Coding View:** Agrees. The machine (ribosome) settles the meaning.
      *   **Parity View:** Rejects the word "meaning." The machine settles the *outcome*.
      *   **Your Vocabulary:** Forces you to choose. If you call it "decoding," you side with Coding. If you call it "signal processing," you side with Parity.

  **Conclusion:** Your vocabulary is a **Coding View engine**. It can simulate the Parity View (by treating everything as signals), but it cannot *express* the Parity View without residual semantic baggage. Every time you use the word "instruction," "opcode," or "decode," you import a normativity that biology does not possess. The Parity View is an attempt to decompile the system back to physics without re-compiling it into semantics. You can model it, but you cannot name it without betraying it.
