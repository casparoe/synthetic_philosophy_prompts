answer: |-
  There is no single, established term in the decision theory literature that specifically names this meta-level regress. While the phenomenon is recognized in discussions surrounding the Pasadena Game (Nover & Hájek, 2004) and infinite utility puzzles (Arntzenius, Elga, & Hawthorne, 2004), authors typically describe it descriptively (e.g., "the regularization parameter inherits the instability" or "the problem re-emerges at the meta-level").

  Given the precision of your observation, I propose coining the term **"Reflexive Divergence."**

  Below is the definition, the boundary conditions distinguishing it from normal parameter tuning, and its placement within the existing literature.

  ### Proposed Term: Reflexive Divergence

  **Definition:**
  Reflexive Divergence occurs when a decision problem with an undefined expected utility is subjected to a regularization method (such as a cutoff, discount factor, or weighting parameter), and the optimization problem required to select the regularization parameter itself exhibits the same type of undefined expectation as the original problem.

  In simpler terms: The cure catches the disease. The mechanism used to define the expectation cannot itself be justified by an expectation because the meta-expectation is equally divergent.

  ### Boundary Conditions

  To classify a problem as exhibiting **Reflexive Divergence** rather than standard parameter underdetermination, three conditions must be met:

  1.  **Object-Level Undefinedness:** The original expected utility $E[U]$ does not converge (either diverging to infinity or oscillating conditionally, as in the Pasadena Game).
  2.  **Parameterized Regularization:** A fix is proposed that introduces a free parameter $\theta$ (e.g., a cutoff $N$, a discount rate $\delta$) such that $E[U_\theta]$ is well-defined for any fixed $\theta$.
  3.  **Meta-Level Isomorphism:** The decision problem of choosing the optimal $\theta$ requires maximizing a meta-utility function $V(\theta)$, but $E[V(\theta)]$ is undefined in the same manner as the original $E[U]$. Specifically, the limit as $\theta$ approaches its ideal value (e.g., $N \to \infty$ or $\delta \to 1$) does not converge to a stable optimum but instead recreates the original divergence.

  ### Contrast with Normal Parameter Choice

  It is crucial to distinguish **Reflexive Divergence** from standard model selection or parameter tuning where the meta-expectation is well-defined.

  *   **Normal Parameter Choice:** You introduce a regularization parameter $\lambda$ (e.g., in ridge regression or risk-weighted utility). While $\lambda$ is arbitrary, the *value* of choosing a specific $\lambda$ is stable. You can compute the expected cost of being wrong about $\lambda$, and that meta-expectation converges. There is a "best guess" or a stable prior over $\lambda$.
  *   **Reflexive Divergence:** There is no stable prior or meta-expectation over $\theta$. If you try to compute the expected value of increasing the cutoff $N$, that calculation itself diverges. You cannot even form a coherent probability distribution over the parameter space because the weights required to normalize that distribution would themselves require a convergent expectation to justify.

  ### Context in Literature

  Your observation aligns with critiques found in the work of **Alan Hájek** and **Holly Nover**. In their analysis of the Pasadena Game, they note that standard fixes (like truncating the series) fail because the value of the game depends on the order of summation, and no physical justification exists for privileging one ordering over another.

  Similarly, **Frank Arntzenius** has discussed "infinite decision puzzles" where no option is optimal. However, the specific regress you identified—where the *justification for the fix* collapses under the same mathematical pathology as the *object of the fix*—is usually treated as a reductio ad absurdum of Expected Utility Theory itself, rather than a named category of failure.

  **Easwaran (2008)** attempted to bypass this with "Weak Expected Utility" (relying on the Law of Large Numbers rather than the sum of expectations), but even this faces Reflexive Divergence if the agent must decide *whether* to trust the Law of Large Numbers in a single-shot case where the variance is infinite.

  ### Implications

  Identifying **Reflexive Divergence** suggests that the problem is not merely a lack of information or a need for better bounds. It indicates a structural incompatibility between the topology of the payoff space and the expectation operator.

  If a decision problem exhibits Reflexive Divergence, it implies that **Expected Utility Maximization is the wrong normative framework** for that domain. You cannot solve it by tweaking parameters within EU theory; you must switch to a different decision architecture entirely (e.g., median maximization, stochastic dominance, or a non-Archimedean utility field).

  ### Summary

  *   **Term:** Reflexive Divergence.
  *   **Core Feature:** The regularization parameter inherits the undefined expectation of the target variable.
  *   **Distinction:** Unlike normal tuning, the meta-level optimization problem does not converge.
  *   **Status:** Coined term (no standard predecessor exists).

  This terminology captures the self-similar, fractal-like nature of the failure mode you described. It signals that the undefinedness is not a local bug but a systemic feature of the decision environment.
