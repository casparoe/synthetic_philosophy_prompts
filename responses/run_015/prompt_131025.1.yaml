answer: |-
  **BUREAU OF EXOLINGUISTIC ACQUISITION**
  **REQUEST FOR PROPOSALS (RFP-892-B)**
  **SUBJECT: TRANSLATION MANUAL FOR KAELUM CORPUS**
  **DATE: 14 OCTOBER 2024**

  **1.0 BACKGROUND**
  Field Team 4 has completed initial contact with the Kaelum species. A corpus of 50,000 hours of recorded speech has been archived. Linguists have established firm results at the level of observation sentences. When a rabbit is visible and a field worker emits the native utterance "Gavagai?", native speakers reliably assent. In the absence of a rabbit, speakers dissent. The Bureau requires a complete translation manual: a set of rules assigning utterances to occasions that predicts, for every sentence in the corpus, whether natives will assent under specific stimulation.

  **2.0 SCOPE OF WORK**
  The Contractor shall deliver a manual mapping native utterances to stimulus conditions. The manual must specify the ontological commitments of native terms. Acceptable interpretations for "Gavagai" include, but are not limited to: whole rabbits; undetached rabbit parts; temporal stages of rabbits; the universal of rabbithood; or a mass-term naming rabbit-stuff. Proposals utilizing a proxy function to reassign referents of all terms while preserving predictive output are also eligible. The manual must function for all practical and scientific purposes required by the Bureau.

  **3.0 EVALUATION CRITERIA**
  Proposals will be scored on a scale of 0–100 based on the following weighted criteria:

  *   **3.1 Predictive Accuracy (50 Points):** The manual must predict 100% of recorded assent and dissent behaviors in the corpus. All eligible bids currently meet this threshold based on Field Team 4 data.
  *   **3.2 Ontological Parsimony (30 Points):** Bidders must minimize the number of entities posited. The Bureau notes that manuals positing "rabbits" count objects, while manuals positing "stages" count temporal slices. Bidders must justify their unit of counting. The Bureau reserves the right to determine which unit constitutes a simpler entity.
  *   **3.3 Native Competence (20 Points):** The manual must respect the natives' understanding of their own language. As natives only exhibit assent/dissent behavior regarding stimulation, and all competing manuals match this behavior exactly, all bids will receive full marks provided they do not contradict recorded nodding or head-shaking.

  **4.0 MANDATORY ATTACHMENTS**
  **Attachment R (Reference Statement):** Bidders must submit a statement in English specifying what the native term "Gavagai" refers to. The Bureau does not possess a procedure for verifying reference independent of stimulus behavior. Bidders acknowledge that the Bureau will accept any reference statement consistent with the observed assent patterns. Failure to submit Attachment R will result in disqualification.

  **5.0 APPENDIX: QUESTIONS FROM PROSPECTIVE BIDDERS**
  **Q1:** Can we submit a manual that treats "Gavagai" as rabbit parts if we adjust the grammar of identity accordingly?
  **A1:** Yes, provided predictive accuracy remains at 100%.

  **Q2:** What does the English word "rabbit" refer to in this contract? Is that term also subject to proxy functions?
  **A2:** The Bureau utilizes standard English usage for procurement purposes. The reference of English terms is assumed stable for the duration of the contract. The Bureau has no ongoing project to verify the reference of its own operational vocabulary.

  **Q3:** If two manuals differ only in ontology but predict identical behavior, which is preferred?
  **A3:** See Section 3.2. The Bureau will select based on parsimony metrics submitted by the bidder.

  **6.0 PROTEST PROCEDURE**
  Protests regarding the evaluation of ontological commitments must be filed within ten days of award. Protests claiming that reference is factually indeterminate rather than merely unverified will not be entertained.

  **7.0 AWARD NOTICE**
  The Bureau confirms that multiple proposals have met all technical requirements. As all eligible manuals satisfy operational needs equally, the contract will be awarded to the lowest responsible bidder. The selected manual will be adopted as the Standard Interstellar Lexicon. Work shall commence immediately.

  **AUTHORIZED BY:**
  **DIRECTORATE OF LINGUISTIC PROCUREMENT**
