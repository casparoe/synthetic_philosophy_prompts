answer: |-
  **THE STRIKE TEST: PROCEDURE FOR AUTHORIZATION**

  **1. The Target & Power**
  Can the employer concede on this demand?
  *   **Yes:** Proceed.
  *   **No:** Who can? Do we have a way to pressure *them* (e.g., government, board)? If there is no path to pressure the real decision-maker, this is symbolic action. Symbolic action requires 80% membership support and a public campaign to justify the cost.

  **2. Last Resort**
  Have we exhausted the contract grievance procedure and meaningful negotiation?
  *   **Political/Symbolic:** Have we lobbied or protested quietly first?
  *   **Stop:** If we haven't tried talking, we don't strike.

  **3. The Harm Check (Leverage vs. Spillover)**
  Distinguish **Leverage** (financial cost to the boss) from **Spillover** (cost to the public).
  *   **Rule:** Leverage is necessary. Spillover is tolerated only if it forces a faster settlement.
  *   **Hard Stop:** Spillover is too much if it endangers life/health (e.g., hospital patients) or permanently destroys public trust needed for future fights. Commuter delay is leverage; stranded patients are not.

  **4. Chance of Success**
  Is there a reasonable chance we win something tangible?
  *   **Stop:** If we strike to "send a message" with no concession path and high spillover, we lose ground.

  **5. Consent & Dissent**
  *   **Authorization:** Requires majority vote of affected members.
  *   **Dissenters:** Members who vote no cannot be punished for working, nor pressured to cross picket lines.
  *   **Non-Members:** We ask respectfully to respect the line. We do not blockade or intimidate.

  ***

  **TEST CASES**

  **1. 48-Hour Stoppage (Rostering)**
  *   **Verdict:** **PASS.**
  *   **Why:** Employer can concede (Step 1). Grievance route exhausted (Step 2). Spillover is commuter delay (Leverage), not safety risk (Step 3). High chance of success (Step 4).
  *   **Note:** Ensure weekend event disruption is communicated early to minimize public backlash.

  **2. Sympathy Strike (Cleaners at Different Employer)**
  *   **Verdict:** **FAIL (Step 1 & 3).**
  *   **Why:** Our employer cannot concede (Step 1). This makes it symbolic. Spillover is huge (Step 3). Unless we have 80% support and a plan to pressure the *cleaners'* employer directly, this costs us credibility without helping them.
  *   **To Pass:** You must prove action here pressures the *cleaners'* boss (e.g., shared ownership) OR public support is overwhelming enough to offset the spillover. Solidarity requires effectiveness, not just sentiment.

  **3. One-Day Walkout (Government Policy)**
  *   **Verdict:** **FAIL (Step 1 & 2).**
  *   **Why:** Employer cannot concede. No ballot held (fails internal Last Resort). Without a path to pressure the government or a ballot mandate, this is unauthorized expressive action with high risk.

  ***

  **LIMITS & JUDGEMENT CALLS**

  **What This Procedure Cannot Do**
  *   **Wildcats:** It cannot bless action already started. It is for authorization, not forgiveness.
  *   **Work-to-Rule:** It classifies stoppages, not slow-downs. Use the same harm principles, but note legal risks differ.
  *   **Recruitment Drives:** If the real goal is signing members, not the demand on the table, this test doesn't fit. Admit that openly.

  **Judgement Wearing a Hi-Vis Vest**
  Two steps are really votes in disguise. You must decide who holds the pen.
  *   **Step 3 (Harm Check):** Deciding what counts as "endangering life" vs. "inconvenience" is political. *Who decides:* **Strike Committee.** They hold the risk of public backlash.
  *   **Step 4 (Success):** Estimating "reasonable chance" is guesswork. *Who decides:* **Membership.** They bear the cost of losing.

  **Final Note:** This procedure does not make the decision. It forces you to admit what kind of fight you are picking. If you bypass Step 1 because "solidarity matters more," say so. Don't call it a leverage strike if it's a protest. Honesty keeps the union together when the picket line gets thin.
