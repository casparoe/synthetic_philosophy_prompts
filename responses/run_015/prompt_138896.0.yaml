      *   *Strengths:* Handles asexuals, fossils, clear boundaries (in theory).
      *   *Weaknesses:* Arbitrary cutoff points on a continuum, doesn't account for current biological reality (e.g., hybridization).

  3.  **Deconstruct Idea B (Cohesion):**
      *   *Core:* Membership is determined by current interaction (gene flow, ecological niche).
      *   *Philosophical Cousin:* Biological Species Concept (BSC), Cohesion Species Concept (CSC), Ecological Species Concept.
      *   *Strengths:* Reflects biological mechanism, explains *why* species look the same.
      *   *Weaknesses:* Fails with asexuals, fossils, ring species, allopatric populations.

  4.  **Task 1: Where do they come apart?**
      *   They diverge when history and current interaction conflict.
      *   *Scenario 1: Hybridization/Introgression.* An organism has the ancestry of Species X but migrates and breeds successfully with Species Y.
          *   A says: Species X (ancestry).
          *   B says: Species Y (cohesion/gene flow).
      *   *Scenario 2: Cryptic Allopatry.* Two populations separated long ago, no gene flow, but identical morphology and potential interbreeding.
          *   A says: Different species (distinct lineages).
          *   B says: Same species (potential cohesion) OR Different (if ecological niche differs). *Correction:* B usually relies on *actual* cohesion. If they don't meet, do they share a niche? If niches differ, B splits them. If niches are same but geographic barrier exists, B might struggle. Let's focus on the *hybridization* case as the clearest divergence.
      *   *Scenario 3: Asexuals.*
