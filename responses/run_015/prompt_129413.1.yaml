  Future contingents are strictly agent-dependent, possessing no current truth value because their reality relies on the agent's power to settle them. Aristotle's sea-battle paradox threatens liberty: if "there will be a battle" is true today, tomorrow's choice is necessitated. Claiming the statement is false merely flips the fatalism; claiming it is truth-valueless via three-valued logic treats the future as a logical gap rather than a domain of agency.

  Through the lens of agent causation, the admiral is not merely a link in a causal chain but an uncaused cause. The truth of "there will be a battle" is not a property of the proposition waiting to be discovered; it is a function of the admiral's current ability to enact or prevent the event. To assign a truth value now is to pretend the agent has already acted.

  Three-valued logic implies the world is vague. Agent causation implies the world is open. Vagueness is semantic; openness is ontological. The relational view argues that truth is relative to causal powers. The statement is not "truth-valueless" in a void; it is indeterminate because the causal sufficient condition—the agent's choice—does not yet exist. The proposition lacks a truth-maker.

  Defending this view preserves bivalence without sacrificing freedom. The statement isn't false; it lacks a truth-maker until the agent exercises power. Unlike three-valued logic, which modifies logic to save freedom, the power-based view modifies our understanding of truth-makers. Truth requires existence. Since the future choice does not exist, the proposition cannot be true. Yet, it is not merely a logical error; it is a reflection of ontological openness grounded in agency.

  Therefore, we must reject the idea that future statements are secretly true or logically neutered. They are ontologically pending. Freedom isn't saved by tweaking logic, but by recognizing that truth follows being, and being follows the agent's cause. The sea battle is not a puzzle for logicians, but a testament to the admiral's power.
