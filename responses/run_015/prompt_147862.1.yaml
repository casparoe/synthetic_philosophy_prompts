      *   "Elective affinity = correlation?" -> No, it's equilibrium selection.
      *   "Development gaps?" -> Focus on institutional persistence, not current attitudes.
      *   "Dependency-aware?" -> Structure the answer logically (Crux -> Mechanism -> Method).

