answer: |-
  This is a sharp framing. "Axiological drag" gets you out of the trap of treating values as magical bullets that directly alter individual productivity (the psychological reductionism trap) and moves you toward values as *selection mechanisms* for institutional equilibria. That is where the live ammo is.

  Here is the dependency map of the debate, structured by what needs to be settled to make your argument hold water, where the actual disagreements lie, and which paths are dead ends.

  ### 1. The Upstream Crux: The Identification Problem
  **The Question:** Can we empirically separate "culture" (internalized value commitments) from "institutions" (external payoff structures) when they co-evolve?

  **The Dependency:** This is the bottleneck. If you cannot disentangle values from the rules they create, "axiological drag" collapses into tautology (e.g., "Capitalism exists because people value capitalist institutions").

  **The Live Disagreement:**
  *   **The Reductionist View:** Values are just rationalizations for existing material incentives. If the payoff structure changes, the "culture" changes instantly. (Culture = Epiphenomenon).
  *   **The Persistent View:** Values act as *focal points* or *screening devices*. They persist longer than the material conditions that birthed them because they coordinate expectations. (Culture = Causal Stickiness).

  **What Settles It:**
  You need **exogenous variation in values without variation in institutions**, or vice versa.
  *   *The Tractable Test:* Migration studies. If Group A moves to Institution B, do they retain their economic behaviors long-term? (e.g., the "epidemiological approach" used by Alesina/Giuliano). If they do, values are causal. If they converge immediately to the host norm, institutions are causal and culture is epiphenomenal.
  *   *The Decisive Blow:* If we find that "cultural" effects vanish once you control for *informal* institutional enforcement (networks, kinship rules), then culture is just a label for unmeasured institutional mechanics.

  ### 2. The Mechanism: Elective Affinity vs. Equilibrium Selection
  **The Question:** Is "elective affinity" just correlation in fancy dress, or is it a specific game-theoretic mechanism?

  **The Dependency:** This depends on solving the Identification Problem above. Once you accept values can be separated from rules, you have to explain *how* they interact.

  **The Live Disagreement:**
  *   **Correlation View:** Protestant areas were already commercially developed; religion just tracked wealth. (Spurious correlation).
  *   **Equilibrium Selection View:** This is the modern translation of Weber. Material conditions allow for *multiple* stable equilibria (e.g., high-trust/high-investment vs. low-trust/rent-seeking). Values don't change the payoff matrix; they tell the society *which equilibrium to coordinate on*.

  **Why "Axiological Drag" Fits Here:**
  Your framing works best if you treat values as **hysteresis**. When material conditions shift, values lag. That lag (the drag) prevents immediate reversion to a previous equilibrium.
  *   *Tractable Work:* Look for historical moments where material incentives shifted *against* the dominant culture, but the culture held long enough to reshape the new incentives. (e.g., Protestant networks persisting through secularization).
  *   *Dead End:* Trying to prove Protestants worked *harder* hour-for-hour. That's psychology. The causal claim is that they built *different courts, contracts, and charities* which altered the payoff for everyone, regardless of faith.

  ### 3. The Transmission Mechanism: How Does the Drag Persist?
  **The Question:** If values are causal, how are they transmitted across generations without genetic encoding or constant indoctrination?

  **The Dependency:** If you solve Identification but can't explain Transmission, the "drag" snaps back too quickly to matter for development gaps.

  **The Live Disagreement:**
  *   **Vertical Transmission:** Parents teach kids. (Fragile; breaks down in modern media environments).
  *   **Institutional Embedding:** Values get written into laws, school curricula, and corporate bylaws. (Robust).
  *   **Network Assortativity:** People with similar values cluster and enforce norms via reputation. (Very robust).

  **Where the Work Should Go:**
  Stop looking at "beliefs" (survey data) and start looking at **norm enforcement costs**.
  *   *Tractable:* Does a shared value commitment lower the transaction cost of enforcing a contract? If "honesty" is a cultural value, does it reduce the need for expensive legal oversight? If yes, culture is a productivity multiplier via institutional efficiency.
  *   *Dead End:* Cross-national regressions of "trust" vs. GDP. This is noise. High trust is often the *result* of good institutions, not the cause.

  ### 4. Development Gaps: Causal vs. Epiphenomenal
  **The Question:** Does culture explain modern development gaps, or is it just the residue of colonial/institutional history?

  **The Dependency:** This relies on all three above.

  **The Decisive Test (The "Drop" Condition):**
  To prove culture is **causal**, you must show that two regions with **identical formal institutions** (same laws, same property rights, same geography) diverge economically due to **informal value commitments**.
  *   *Example:* North vs. South Korea (extreme case), or East vs. West Germany (historical).
  *   *The Counter-Test:* If you impose identical institutions and the "cultural" gap closes within one generation, culture was epiphenomenal (it was just adaptive behavior to bad institutions). If the gap persists for 2+ generations, culture is causal (axiological drag is real).

  **Current Consensus:** The evidence suggests culture matters most when institutions are **weak**. In strong institutional environments, formal rules crowd out cultural variance. In weak institutional environments, cultural values fill the void (for better or worse).

  ### Summary: Where to Focus Your Story

  **1. The Dead Ends (Avoid these):**
  *   **Psychologizing Weber:** Don't write about whether Calvinists felt more anxious or worked harder. That's unfalsifiable.
  *   **National Character Indices:** Avoid Hofstede-style dimensions or "Confucian values explain Asia's rise." Too broad, too endogenous.
  *   **Textual Analysis Alone:** Analyzing sermons without linking them to economic behavior is just intellectual history, not social science.

  **2. The Live Wires (Focus here):**
  *   **Institutional Stickiness:** How value commitments lock in specific legal or corporate forms that outlast the religious belief. (e.g., The structure of the modern corporation retaining Protestant organizational logic after secularization).
  *   **The Lag Time:** Investigate the "drag." How many generations does it take for a value system to adjust to a new economic reality? That lag is the causal window.
  *   **Equilibrium Selection:** Frame culture not as a "force" but as a **coordination technology**. It solves the "which rule do we follow?" problem.

  **3. The Verdict Condition:**
  If research shows that **informal norm enforcement** (culture) creates distinct economic equilibria even when **formal rules** (institutions) are held constant, then "culture is causal" wins. If informal norms always converge to match formal incentives within a single generation, then "culture is epiphenomenal" wins.

  **Your Angle:**
  Lean into "Axiological Drag" as **institutional hysteresis**. It's not that ideas beat materials; it's that ideas determine which material structures get built, and those structures are hard to tear down even after the ideas fade. That preserves Weber's insight without requiring us to believe in ghostly spiritual causation.
