answer: |-
  Here's where I land after digging through our minutes. If we care about consistency, we have to reject the Always-Onlines proposal, and Marisol is going to be the first to say so. You know her reasoning better than anyone: she approved the Boomers based on sheer size and resource competition, not shared memories. She explicitly worried that Gen Z was defined merely by a technology rollout, but she voted for them anyway because they still fit within a birth-year band. The Always-Onlines proposal breaks the birth-year boundary entirely. It defines people by adoption timing rather than birth timing. Marisol sees generations as demographic structures that force society to adapt—schools building more classrooms, housing markets tightening. A smartphone cutoff is a behavioral variable, not a demographic flood. She'll call this a segmentation study, not a generation.

  The closest precedent we have isn't the Wall Generation, and it isn't the Xennials. It's the rejected "9/11 Generation." We turned that down because it defined people by an event they witnessed rather than a life stage they occupied, creating an audience rather than a cohort. The Always-Onlines are functionally identical: they are an audience of early adopters, staggered by income and region, not a cohort born into a specific set of constraints. The Wall Generation was an exception made for a partner museum, not a principle we set for ourselves. The Xennials were rejected because they were "marketing," but even they had a birth window. If we approve the Always-Onlines, we are admitting that birth years don't matter, only experiences do. That collapses the entire structure of the exhibit, where every other room is built on a birth-year band.

  So, if we vote yes, the principle we are signing is: "A generation is defined by a formative discontinuity in experience, regardless of birth year, provided data shows a causal break in outcomes." That turns us into a museum of psychological impacts rather than social history. If we vote no, the principle is: "A generation must be a birth-year cohort that shares a historical context, even if individual experiences within that cohort vary." That protects the integrity of the rooms but ignores the data showing that smartphone age matters more than birth year for mental health. I think the second principle is the one we've actually been using, even if we haven't said it out loud.

  To test whether we really believe that second principle, here is the one case I'd put in front of us before we finalize this rule: The Pandemic Workforce Entrants. This would be anyone who entered their first full-time job between March 2020 and December 2021. It cross-cuts Gen Z and Millennials just like the Always-Onlines. It has a clear labor-market signature, similar to Gen X's bad entry. It's not defined by birth year. If we reject Always-Onlines but approve the Pandemic Entrants because the economic logic feels stronger, we're being inconsistent. If we reject both, we're consistent. That's the case that will tell us if we're really committed to birth years or just looking for a reason to say no to this curator.

  Finally, regarding your demographer advisor: That quote is deep, not a dodge. She's drawing a line between statistics and identity. A cohort is indeed a question you ask of the data—you can slice the data any way you want, like smartphone age. But a generation is a claim about a person; it's a story people tell about themselves and that society tells about them. The Always-Onlines pass the cohort test—the data shows a discontinuity—but they fail the generation test because nobody self-identifies that way. The Boomers, Gen X, even the Wall Generation—they all have a narrative claim attached. If we approve a room for people who don't claim the label, we're curating data, not history. I think that distinction saves us from having to guess. We're building an exhibit about generations, not cohorts. Stick to the birth years, reject the proposal, and tell the junior curator her data is fascinating but belongs in a different kind of show.
