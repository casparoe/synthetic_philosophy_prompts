      *Wait, one nuance on (2):* "Court-enforced psychiatric holds." The user is unsure if this belongs. It often involves *others* binding the self, not self-binding. I should point out that this might violate the "Self" in Ulysses Contract unless it's a *pre-committed* standard for holds (e.g., a psychiatric advance directive). I need to clarify if they mean *ex post* civil commitment or *ex ante* agreed criteria.

      *Let's structure the response.*
