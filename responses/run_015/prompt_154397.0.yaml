          4.  Strategic Advice (How to present this to Dave).

      *   *Specific Analysis Points:*
          *   **2 vs. 3:** Focus on *ex ante specificity*. Psych holds require a judicial/medical finding of impairment *in the moment* or specific prior criteria. Universal waiting periods are blunt. This saves the distinction.
          *   **1 vs. 4 (The Big One):** "Populism" isn't "Mania." Need to define constitutional impairment. Is it *systemic* cognitive failure (tyranny of the majority) vs. *individual* cognitive failure? If the justification for (4) relies on "future selves might be stupid," does that violate the "preference change isn't enough" rule in (1)? *Solution:* Refine (1) to include *systemic* epistemic failures, not just biological ones.
          *   **7 vs. 4 (The Ratchet):** The user identifies this but doesn't solve it. If institutions select the selectors (gerrymandering, court packing), the Ulysses rope gets cut or retied by the Sirens. *Cost:* Must admit entrenchment needs "sunset" or "convention" clauses to prevent the ratchet.
