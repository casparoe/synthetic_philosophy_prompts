answer: |-
  Here is the decomposition. I am treating "Lewisian Convention" as a strict technical term from *Convention: A Philosophical Study* (1969), not the colloquial use of the word.

  ### My Credence: 0.45
  I am more skeptical than you (0.6) and significantly more skeptical than Priya (0.95). My assessment is that this behavior fits the profile of a **Social Norm** (in the sense of Cristina Bicchieri) better than a **Lewisian Convention**. The distinction hinges on *why* people are doing it.

  ### The Decomposition

  Here are the probabilities I assign to each of your sub-questions representing "The degree to which this feature satisfies Lewis's criteria."

  | Sub-Question | Lewis Criterion | My Probability | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **1. Coordination vs. Signalling** | **Coordination Equilibrium** | **0.30** | Lewis conventions solve coordination problems (e.g., driving on the left). Here, students aren't coordinating *with each other*; they are individually signaling deference to *authority*. If I put my phone down, it doesn't help you put yours down. |
  | **2. Arbitrariness** | **Alternative Viability** | **0.40** | Lewis requires that face-up *could* have worked just as well. If face-up is objectively more distracting (notifications), face-down has intrinsic utility. That makes it a prudential rule, not a convention. |
  | **3. Expectation vs. Enforcement** | **Conditional Preference** | **0.50** | Lewis requires: "I do R *because* I expect you to do R." If you do R because "I'll get side-eyed otherwise," that is normative enforcement, not coordination. This feels like a 50/50 split in your school. |
  | **4. The Orphan Norm** | **Common Knowledge** | **0.90** | Lewis does not require knowing the *history*, only knowing the *current regularity*. As long as everyone sees everyone else doing it, the "orphan" status doesn't disqualify it. |
  | **5. Stability/Contingency** | **Preference Reversal** | **0.60** | You noted a chunk would drop it if others stopped. This supports the convention view. However, many would likely keep doing it out of habit or respect, which weakens the "conditional" nature. |

  ### How I Combined Them
  I did not take a simple average. Lewis's definition is conjunctive; if **Arbitrariness** or **Conditional Preference** fails, the definition collapses.

  *   **Formula:** `(Coordination + Arbitrariness) / 2` × `Weighted Average of Remaining Factors`
  *   **Calculation:** `(0.30 + 0.40) / 2 = 0.35` (The "Core Lewisian" Score)
  *   **Adjustment:** The remaining factors (CK, Stability) are supportive, pulling the score up slightly from the core failure.
  *   **Result:** **0.45**

  ### Sensitivity Analysis
  My number is most sensitive to **Question 2: Arbitrariness**.

  *   **Why:** If face-up and face-down are truly functionally identical (notifications are silent, screens are off, teachers don't care), the probability of this being a Lewis convention jumps to **0.75+**.
  *   **Why not Coordination?** Even if it's not a pure coordination game, Lewis allows for conventions of meaning (signalling). But he *never* allows for conventions where one option is objectively better than the other for independent reasons.

  ### The Empirical Check
  To move this number, you need to test the **Conditional Preference** (Question 3 & 5).

  **The Experiment:**
  Find 3 students who follow the norm. Ask them this specific counterfactual:
  > "Imagine you walk into class. You know for a fact the teacher doesn't care about phones. You also see that *every other student* has their phone face-up on the desk. Do you put your phone face-down?"

  *   **If they say "Yes, I still put it down":** It is a **Norm/Habit**, not a Lewis Convention. (Credence drops to ~0.20).
  *   **If they say "No, I put it face-up":** It is a **Lewis Convention**. (Credence rises to ~0.70).
  *   **If they say "I don't know":** It is **Mindless Mimicry**. (Credence stays ~0.45).

  ### Where You and Priya Disagree
  You and Priya are likely talking past each other on **Question 1 (Coordination)** and the definition of "Agreement."

  *   **Priya's Error:** She says, "nobody agreed to it... which she says is literally the definition." She is actually correct on this specific point (Lewis emphasizes conventions arise *without* explicit agreement), but she assumes that *any* unagreed regularity is a convention.
  *   **The Real Disagreement:** Priya assumes the behavior is **arbitrary** and **peer-coordinated**. You are sensing that the behavior is **functional** (respect/distraction) and **authority-directed**.
  *   **Verdict:** You are likely closer to the truth. Priya is using the colloquial definition ("unwritten rule"), while you are correctly identifying the philosophical tension (is it coordination or signaling?).

  ### Priya's Objection (Origin and Change)
  Priya claims: *"Lewis's account explains how conventions stay put but not how they change or where new ones come from."*

  **Is this relevant to your number?**
  **No.** You are asking for a classification of the *current state*. Whether Lewis explains the *dynamics of change* is a critique of the theory's completeness, not its classification power.

  **Is she right?**
  **Partially.**
  1.  **Origin:** Lewis *does* explain origin via **Salience** and **Precedent**. (e.g., "We met here yesterday, so we meet here today"). Your "Orphan Norm" is actually a perfect example of Lewisian Precedent. So she is wrong that Lewis doesn't explain origin.
  2.  **Change:** She is right that Lewis is better at explaining stability (equilibrium) than disruption. Later game theorists (like Brian Skyrms) filled this gap with evolutionary dynamics.

  **Advice for the Club:** Tell Priya that Lewis *does* account for origin (precedent), so her objection doesn't weaken the classification. However, admit that if the norm is "orphaned" (nobody knows the precedent), it relies on **Common Knowledge of the Regularity**, not the History. As long as everyone sees everyone else doing it, the history doesn't matter for the classification.
