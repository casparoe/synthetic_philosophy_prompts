prompt: |-
  So I cover science and ideas for a living and I've stupidly said yes to running a 40-minute session on Kelly betting and the geometric rationality idea for a sixth-form maths club next month. They're clever but mostly only know A-level probability, and I want the maths to feel commonsensical rather than handed down.

  I don't need a refresher on the maths itself, I need help organising how to put it across. I dreamt up this toy game to anchor everything on where you start with £100 and each round you can stake whatever fraction you like of what you have on a coin that lands heads 60% of the time and pays even money, repeating for about 100 rounds. Would that actually carry the whole explaination, what bit of behaviour does it have to make vivid and what extra wrinkles should I strip out so it doesn't muddy things? Also help me sort the build-up, like what intuition has to be bedded in before I can even mention growth rates without losing them, and what I should deliberately skip for now and own up to skipping. I'm guessing they'll turn up thinking the smart move is always to maximise expected value and that Kelly is just timidity dressed up, wether there are other classic mix-ups I should expect, and for each one tell me when to nip it in the bud as I go. Lastly, how do I tell on the day wether the time-average versus ensemble-average thing has landed, some quick check I can use? And please answer in British English with British spellings all the way through, my editor will kill me otherwise.
