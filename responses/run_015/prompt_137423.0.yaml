      Mira watched the cursor blink on Ari's screen, the fan humming loudly in the quiet room. "Hour eleven. Fifty variables. He knows the exact optimization is exponentially hard. He cannot do it. The feasibility constraint is clear: a normative requirement is admissible only if an agent in the relevant circumstances can conform to it. Complexity results are the correct instrument for saying when conformity is possible. An intractable ideal should be replaced, not venerated, by a tractable surrogate norm that approximates it as closely as the budget allows. To demand the impossible is not rigor; it is nonsense."

      Dev leaned against the doorframe, arms crossed, watching the code scroll. "He cannot do it in time, perhaps. But the optimal route remains the normative standard. You hold that norms state what is correct rather than what is achievable. The gap between the two is precisely what lets a norm evaluate an agent from outside her own predicament. Complexity results are worst-case, asymptotic, encoding-relative and contingent on machine architecture, so they underwrite no claim about what Ari ought to believe or do. The laptop's limits are not the world's limits."

      "You argue that I collapse the normative into the descriptive," Mira said, turning from the screen to face him fully. "But if 'ought' implies 'can', then impossibility negates obligation. I am not saying truth is whatever he does. I am saying norms guide action. A guide that leads off a cliff is broken. You charge that choosing a surrogate requires a norm that cannot itself be justified by speed. But the higher-order norm is saving lives. Speed is instrumental to that end. We choose the heuristic that best approximates the ideal within the budget. The justification is consequentialist, not computational. If the ideal kills the patient, it is morally bankrupt."

      Dev pushed off the frame, stepping closer into the room. "An unsatisfiable norm does critical work. It anchors improvement. If Ari believes the heuristic is the goal, he stops optimizing the heuristic. He might settle for a good enough solution when a slightly better one was reachable with different effort. I'm not indifferent to his situation; I want him to know the target, even if he misses it. Knowing he missed the truth matters for accountability. If we lower the bar to what he can do, we lose the ability to say he fell short. Complexity results are contingent; machines get faster. Norms should not. We must distinguish failing to meet the standard from the standard being wrong."

      "Consider diagnosability," Mira said, raising a hand to pause him. "This is a distinction neither of us has seen in print. Say a method's difficulty is diagnosable when there is a test, computable well inside the agent's budget, that flags in advance the instances on which the method will overrun that budget, so that the agent can decide before committing whether to attempt exact conformity or fall back on something cheaper. Say it is opaque when no such test exists, so that discovering whether this instance is one she can handle costs about as much as handling it."

      Dev nodded slowly, processing the definition. "I accept the definition. It clarifies the epistemic burden involved in switching strategies. It makes the cost of meta-reasoning explicit."

      "If Ari's problem is opaque," Mira continued, "your compromise fails. You suggest he can aim at the ideal norm and satisfy-when-hard. But if the difficulty is opaque, he cannot tell when he is in the hard region. He cannot decide before committing whether to attempt exact conformity or fall back. The compromise issues no guidance at all. He wastes the hour testing rather than acting. He dies in the meta-layer."

      Dev smiled faintly, seeing the trap spring shut. "You've sharpened the blade, but you've cut yourself. If the difficulty is opaque, you cannot tell which instances call for the surrogate norm either. Your replacement has to be a single universal policy rather than a conditional one. You cannot switch based on instance difficulty. The choice between universal policies is a question about which norm is correct that complexity theory does not touch. You still need a standard to choose the universal heuristic. Complexity tells you nothing about which heuristic is right. You are back to square one."

      Mira paused, tapping the desk rhythmically. "I relocate diagnosis from the instance to the environment. What matters is whether the distribution of instances an agent actually faces is one on which her policy's expected performance is acceptable. This is an empirical and local matter rather than something settled by an asymptotic worst-case theorem. We look at Ari's actual traffic patterns, not the theoretical worst case. If the environment is stable, the surrogate works. We validate the policy against the history, not the horizon."

      "And who defines the relevant distribution?" Dev pressed, his voice hardening slightly. "That empirical premise is itself a normative choice. You assume the past predicts the future, or that local regularities hold. If the environment shifts, your surrogate fails catastrophically. You rely on a stability claim that complexity theory explicitly warns against. Worst-case exists for a reason. You haven't escaped the correctness question; you've just buried it in an empirical premise. What justifies trusting the distribution? That justification is normative, not empirical."

      "I concede complexity doesn't pick the surrogate," Mira admitted, her voice dropping slightly. "It only clears the space for practical norms. It tells us what is impossible, not what is best. But without feasibility, the norm is vacuous. It commands nothing."

      "And I concede worst-case results don't dictate guidance," Dev said. "They describe limits, not duties. But they don't invalidate the standard either. We end where we started: is the norm a map of the territory or a compass for the ideal?"

      "It's a tool for survival," Mira said.
      "It's a measure of truth," Dev replied.
