          2.  *Bayesian/Statistical:* Even honest researchers get inflated effect sizes due to weak priors + selection for significance (the "winner's curse" or Type M errors).
      *   **Questions to Answer:**
          1.  Compare the two explanations. Which accounts for more of the problem?
