      *   *Section 3: Does Replication Fix It?* No. Explain the "Garden of Forking Paths." Replicating a biased process yields biased results. Need *registered* replications.
      *   *Section 4: P < 0.005 & Preregistration.*
          *   Preregistration stops the cheating (Story 1).
          *   P < 0.005 reduces noise but requires bigger samples.
          *   Do they fix the Bayesian inflation? Only if they force larger sample sizes. If you just keep small samples and demand lower p-values, you get *fewer* published studies, but the ones that pass might still be inflated if power is low.
      *   *Conclusion:* Summary of the systemic issue.

  7.  **Refining the Bayesian Explanation (Crucial Step):**
      *   I need to make sure I don't confuse "Bayesian Statistics" (using priors in the math) with "Bayesian *reasoning* about the literature" (base rate fallacy). The user is referring to the latter (Gelman's Type M errors, Ioannidis's "Why Most Published Research Findings Are False").
      *   *Analogy:* Screening for a rare disease. Even with a good test, if the disease is rare, most positives are false. In science, if true effects are rare/small, most "significant" findings are inflated or false.
      *   *Key concept:* "The Truth is Small." If the real effect is tiny, you need a huge sample to measure it. If you use a small sample, the only way to get $p < 0.05$ is if random noise *adds* to the effect. Therefore, published small-sample studies *must* be overestimates.

  8.  **Final Review against constraints:**
