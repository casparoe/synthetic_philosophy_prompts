  1. The theory must explain why Nozick's Experience Machine is inferior to reality, a demand that falsifies pure hedonism. It also strains desire-satisfaction views that ignore the source of fulfillment and challenges objective-list accounts to define reality without circularity.

  2. It must distinguish authentic flourishing from adjusted expectations in oppressed agents, which objective-list views handle well but desire-satisfaction theories often fail by validating stunted ambitions. Hedonism struggles here too, as oppressed agents may report high pleasure despite stunted lives.

  3. Any account must remain consistent with biological functionalism, allowing for non-conscious welfare in simple organisms without conflating metabolic success with the phenomenology required by hedonism. Desire-satisfaction and objective-list views must also explain what a slime mold wants or achieves without anthropomorphizing.

  4. The theory must explicitly resolve the clash between Desiderata 1 and 3, as grounding well-being in reality often requires consciousness that slime molds lack. This tension is where objective-list views succeed descriptively but hedonism and desire-satisfaction views fail biologically.

  5. If you cannot separate welfare from awareness without losing normative force, admit the concept may be incoherent for non-sentients, suggesting you might be conflating well-being with consciousness despite wanting a broader biological account. All three major theories risk incoherence here if they cannot decouple value from sentience.
