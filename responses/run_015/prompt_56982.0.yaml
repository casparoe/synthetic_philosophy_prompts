answer: |-
  # UNIVERSITY EXAMINATION PAPER

  **Course:** Time, Risk, and Rational Choice (PHIL/BSCH 505)  
  **Section:** B  
  **Time Allowed:** 45 Minutes  
  **Marks:** 25  

  **Instructions to Candidates:**  
  Answer the question below. You may not use a calculator. You must rely on the data provided in the table; do not attempt to re-derive the figures. Treat the excerpt from the endowment letter as a fictional invention for examination purposes.

  **Examiners' Rubric:**  
  Marks are awarded for critical engagement with the specific data provided and the logical structure of the arguments. You will receive **zero marks** for reciting general slogans such as "expected value ignores compounding," "the Kelly fraction maximises growth," or "one should never risk ruin" without applying them to the figures in the table. To score highly, you must identify precisely which criterion is being maximised in each claim, explain where distinct criteria diverge in this specific dataset, and articulate the conditions under which the asymptotic growth criterion is appropriate.

  ***

  **Question 1**

  A fund faces a gamble $G$ which it may play as many times as it likes, choosing a stake fraction $f \in [0,1]$ once and holding it fixed for every round. In each round, with probability $0.6$ the fund's capital is multiplied by $(1+f)$ and with probability $0.4$ by $(1-f)$.

  The table below provides data for eight specific values of $f$. $g(f)$ is the per-round geometric growth rate. $E[W_{10}]/W_0$ is the expected capital after ten rounds relative to the start. $P(W_{10} \geq 2W_0)$ is the probability of at least doubling capital within ten rounds. $P(W_{10} < W_0)$ is the probability of finishing below the starting capital.

  | Stake ($f$) | Growth Rate $g(f)$ | Exp. Capital ($10$ rounds) | Prob. Doubling ($10$ rounds) | Prob. Loss ($10$ rounds) |
  | :--- | :--- | :--- | :--- | :--- |
  | 0.1 | 0.0150 | 1.219 | 0.046 | 0.367 |
  | 0.2 | 0.0201 | 1.480 | 0.167 | 0.367 |
  | 0.25 | 0.0188 | 1.629 | 0.382 | 0.367 |
  | 0.3 | 0.0147 | 1.791 | 0.382 | 0.367 |
  | 0.35 | 0.0077 | 1.967 | 0.382 | 0.367 |
  | 0.4 | -0.0024 | 2.159 | 0.382 | 0.618 |
  | 0.5 | -0.0340 | 2.594 | 0.382 | 0.618 |
  | 1.0 | $-\infty$ | 6.192 | 0.006 | 0.994 |

  *Note: $0.382$ is the maximum attainable value of $P(W_{10} \geq 2W_0)$ over all admissible $f$.*

  The Investment Committee circulates the following excerpt from an annual letter (fictional):

  > "(i) The fund is a going concern with no terminal date. The question before us is therefore not what maximises our expected capital at some arbitrarily chosen future date, but what maximises the rate at which capital grows along the single path we shall actually travel; under $G$, that is a stake of 20 per cent.
  > (ii) Let it be clear that this is not the logarithmic utility function in disguise. Our reason for the 20 per cent rule is a fact about how capital compounds through time, not a fact about our tastes. Any agent, however risk-loving, confronts the same arithmetic and is undone by it in the same way.
  > (iii) It follows that staking more than 20 per cent is irrational whatever the fund's objectives. The board's proposal to stake 40 per cent, in order to raise the probability of doubling the endowment within ten years, therefore rests on a confusion: it buys a better chance at an arbitrary milestone at the price of a strictly worse growth rate, and a going concern has no business attending to milestones.
  > (iv) Nor should the board take comfort from the observation that staking everything maximises expected capital. An expectation averages over histories of the fund, only one of which will ever be ours, and the fund does not get to average across its own alternatives. Expected capital is the wrong criterion because the process is non-ergodic; the growth rate is the right criterion because it is the one the fund actually faces."

  **Evaluate claims (i)–(iv). For each claim, state what is right, what is wrong, and what would have to be true of the fund's situation for the claim to hold.**

  ***

  # MODEL ANSWER

  **Claim (i): Horizon and Criterion**
  The claim correctly identifies that for a "going concern" with an infinite horizon, the almost-sure long-run growth rate is the dominant criterion; the path with the highest geometric mean will almost surely overtake others eventually. The identification of 20% as the stake maximizing $g(f)$ is correct based on the table. However, the claim is wrong to dismiss the "arbitrarily chosen future date" so readily. The fund's own memo later references a ten-year milestone. If the horizon is finite (e.g., ten years), maximizing $g(f)$ does not necessarily maximize the probability of meeting specific targets. For this claim to hold strictly, the fund must truly have no terminal date and no intermediate liquidity constraints.

  **Claim (ii): Arithmetic vs. Tastes**
  The insistence that growth maximization is not merely "log utility in disguise" is partially correct: the geometric growth rate is an objective property of the stochastic process, independent of an agent's subjective utility function. However, the assertion that "any agent, however risk-loving, confronts the same arithmetic" is misleading. While the arithmetic of compounding is fixed, the *rational response* to it depends on the objective. An agent with linear utility over terminal wealth at $T=10$ should maximize expected value ($f=1.0$), not growth. An agent seeking to maximize the probability of doubling in ten years should choose $f \in [0.25, 0.5]$. Only an agent whose objective aligns with infinite-horizon survival is bound by the growth rate arithmetic. Risk-loving agents are not "undone" by high stakes if their utility function values the high-variance tail outcomes that drive expected value.

  **Claim (iii): The Board's Proposal**
  This claim contains a critical error exposed by the data. It argues that 40% is irrational because it sacrifices growth for probability. However, the table shows that $P(W_{10} \geq 2W_0)$ is maximized at 0.382 for *any* stake between 25% and 50%. A stake of 30% or 35% achieves the Board's probability target (0.382) while retaining a *positive* growth rate (0.0147 and 0.0077 respectively), unlike the 40% stake (-0.0024). Thus, 40% is indeed inferior to 35%, but 20% is also inferior to 35% regarding the ten-year doubling probability (0.167 vs 0.382). The memo creates a false dichotomy between Kelly (20%) and the Board (40%). Furthermore, if the fund is a "going concern," attending to milestones is irrational only if those milestones do not affect survival. If the ten-year target is tied to donor confidence or payout obligations, the milestone is not arbitrary.

  **Claim (iv): Ergodicity and Expectation**
  The claim correctly notes that expected capital ($E[W_{10}]$) is an ensemble average over paths that will not be realized, whereas the fund experiences a single time-average path. It is correct that the process is non-ergodic in the sense that the ensemble average diverges from the time average. However, declaring the growth rate "the right criterion" universally is incorrect. The growth rate is the correct criterion *only* if the objective is long-run capital maximization. For finite horizons, the distribution of outcomes matters. The jump in $P(W_{10} < W_0)$ from 0.367 to 0.618 between $f=0.35$ and $f=0.4$ is a finite-sample artifact: with only ten rounds, wealth outcomes are discrete. The threshold where the median outcome flips from profit to loss coincides here with where $g(f)$ turns negative, but this is a coincidence of $N=10$, not a structural law.

  **Conclusion**
  The memo is internally inconsistent. It invokes an infinite horizon to justify the growth criterion (i) but defends against a ten-year milestone objection (iii). The data reveals that neither the memo's 20% nor the Board's 40% is optimal for the stated ten-year probability target; 30-35% dominates both by securing the maximum doubling probability with positive growth. The growth rate is the correct criterion only if the fund's objectives align with infinite-horizon compounding, which the memo's own fixation on ten-year performance contradicts.

  ***

  # MARKING SCHEME

  **Total Marks: 25**

  **General Instruction:**  
  Do not award marks for the following slogans unless they are explicitly linked to the provided data and the specific logical flaws in the memo:
  *   "Expected value ignores compounding."
  *   "Kelly maximises long-run growth."
  *   "One should never risk ruin."
  *   "The process is non-ergodic."
  *   *Rote recitation of these phrases without application scores 0.*

  **Breakdown by Claim:**

  **Claim (i) [5 Marks]**
  *   **2 Marks:** Identifies that 20% maximizes $g(f)$ (Kelly) and acknowledges this is correct for infinite horizons.
  *   **3 Marks:** Critiques the dismissal of finite dates. Notes the memo later references a ten-year milestone, creating tension. States that for finite $T$, maximizing $g(f)$ does not guarantee maximizing terminal wealth probability.

  **Claim (ii) [6 Marks]**
  *   **2 Marks:** Acknowledges the distinction between objective arithmetic (compounding) and subjective utility.
  *   **4 Marks:** Refutes the "any agent" claim. Explains that agents with linear utility (EV maximizers) or specific finite-horizon targets (e.g., doubling in 10 years) have different optimal stakes ($f=1.0$ or $f \in [0.25, 0.5]$). "Undone by arithmetic" is only true for growth-maximizers.

  **Claim (iii) [8 Marks]**
  *   **3 Marks:** **Crucial First-Class Move:** Identifies from the table that $P(W_{10} \geq 2W_0)$ is constant (0.382) for $f \in [0.25, 0.5]$.
  *   **3 Marks:** **Crucial First-Class Move:** Observes that $f=0.3$ or $0.35$ dominates the Board's 40% proposal (same probability, positive growth vs. negative) *and* dominates the Memo's 20% proposal (higher probability, positive growth). The memo's dichotomy is false.
  *   **2 Marks:** Discusses the "arbitrary milestone" argument. Notes that if milestones affect solvency or funding, they are not arbitrary, undermining the "going concern" defense.

  **Claim (iv) [6 Marks]**
  *   **2 Marks:** Correctly explains the ensemble vs. time average distinction (non-ergodicity).
  *   **4 Marks:** **Crucial First-Class Move:** Explains the jump in $P(W_{10} < W_0)$ (0.367 to 0.618) as a discrete step-function artifact of $N=10$ rounds, coinciding with the sign change of $g(f)$, rather than a continuous structural boundary. Notes that "growth rate is the right criterion" is normative, not descriptive.

  **First-Class Differentiators (Required for 20+ Marks):**
  To achieve a First-Class grade, the script must make at least **four** of the following specific moves:
  1.  **The Interval Insight:** Noting that the probability of doubling is maximized over an interval ($0.25 \leq f \leq 0.5$), not at a single point.
  2.  **The Dominance Argument:** Identifying that stakes of 0.3 or 0.35 dominate both the Memo's (0.2) and Board's (0.4) proposals on the memo's own mixed criteria.
  3.  **The Step-Function Artifact:** Explaining the jump in loss probability as a consequence of discrete outcomes in finite $N$, not a fundamental threshold of ruin.
  4.  **The Horizon Inconsistency:** Highlighting the contradiction between invoking an infinite horizon for criterion selection (i) and defending against a ten-year milestone critique (iii).
  5.  **Utility Specificity:** Explicitly stating that EV maximization is rational for linear utility over terminal wealth, refuting claim (ii)'s universalism.

  **Penalties:**
  *   **-2 Marks:** Treating "wealth tends to zero in the limit" (for $f > f_{Kelly}$) as equivalent to "likely to lose money over ten rounds" without referencing the specific probabilities in the table.
  *   **-2 Marks:** Announcing 40% is irrational solely because $g(f) < 0$ without noticing 50% has the same doubling probability but worse growth, or that 30% has the same doubling probability with better growth.
  *   **-3 Marks:** Invoking "Half-Kelly" or other external heuristics not supported by the provided table.

  **Note for Second Marker:**
  You may encounter competent scripts that reach a defensible overall verdict via a route the model answer does not anticipate. Specifically, credit scripts that argue the memo's central defect is **internal incoherence** rather than arithmetic error. If a candidate argues that one cannot simultaneously claim to be a "going concern with no terminal date" (Claim i) and defend against criticism regarding a "ten-year milestone" (Claim iii), this is a valid philosophical critique of the decision frame. Award full marks for this line of reasoning provided they support it with the data (e.g., showing that if the horizon were truly infinite, the ten-year probability would be irrelevant, rendering Claim iii's defense unnecessary). Do not penalize candidates who focus heavily on this framing inconsistency, even if they spend less time on the step-function artifact, provided they demonstrate understanding of why the data makes the inconsistency visible.
