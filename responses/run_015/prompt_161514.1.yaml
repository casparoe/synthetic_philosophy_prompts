  The Geiger sits to mark the final day,
  One atom waits where wires fade away.
  We grant it half a chance to strike before
  Before they lock and bolt the heavy door.
  There is no crowd of siblings left in store,
  No long run harvested to settle score.
  Yet still we swear the odds were ours to say,
  An I-O-U the world might not repay.

  But chance lives only in a chosen class,
  Where gerrymandered lines shift like the grass.
  Say tendency? It stops beyond the click,
  Say bet your mind? You need the world to fix.
  One loses why the atom chose to fall,
  The other finds no chance outside the wall.
