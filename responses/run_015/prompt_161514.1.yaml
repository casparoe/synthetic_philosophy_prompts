      *   **Structure:**
          *   *Octave (1-8):* Pre-decay confidence. Talking about chance as a fact of the matter (e.g., 50/50 over an hour). Realist tone.
          *   *Turn (Line 9):* Frequency view enters. Challenges single-case chance. Chance needs a series. Reference class problem (gerrymandering).
          *   *Sestet (9-14):* Two rescue attempts (Disposition/Propensity & Betting/Subjective).
          *   *Constraint:* Neither rescue is clean. Disposition: what does it do after the click? Explanation vs. redescriptions. Betting: it's about *you*, but needs to borrow the world's number (Lewis's Principal Principle).
          *   *Ending:* Closing two lines must state plainly what each view gives up.
      *   **Constraints:** No "-ism" words (frequentism, Bayesianism, etc.), no "credence", no "Bayesian", avoid "probability" (use chance, odds, half, etc.).
