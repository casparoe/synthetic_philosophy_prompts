      *Section 1 (Summary):*
      Your two worries are analytically distinct but practically inseparable. The first concerns validity (what is being measured), while the second concerns mechanism (how measurement works). Both stem from a single error in your colleagues' reasoning: conflating absolute cost with differential cost. A hurdle signals honesty only if its marginal cost is inversely related to the trait you value, not merely if it is expensive. Subsidizing a signal does not inherently destroy its information content; it destroys it only if the subsidy removes the cost differential between high and low-quality candidates. If you remove the wealth component of the cost while preserving the quality component, you repair the signal rather than weaken it. Your distinction between trait-elastic and budget-elastic requirements is sound in intuition but requires precise formulation regarding marginal costs. The following sections unpack the machinery you need to defend this position.

      *Section 2 (Costliness):*
      For a cost to convey information, it must satisfy the Single-Crossing Property. This means the marginal cost of producing the signal must be lower for high-quality candidates than for low-quality candidates. Mere expensiveness is insufficient because wealth allows low-quality candidates to mimic high-quality ones if the cost is uniform. If a hurdle costs £2,000 for everyone, it signals only that the candidate has £2,000, not that they are competent. The cost acts as a screen only if the burden feels heavier to the low-quality type. In economic terms, the indifference curves of high and low types must cross only once with respect to the signal level. If the cost function is identical for both types relative to their quality, no separating equilibrium exists; everyone pools at the level of signal the lowest type can afford. Therefore, costliness buys honesty only when it is differentially costly. Your colleagues' slogan assumes cost correlates with quality; without that correlation, cost correlates only with liquidity.

      *Section 3 (Waste):*
      There is a tension between the original Handicap Principle and formal signaling models regarding waste. Zahavi's original biological formulation emphasized that signals must reduce survival fitness to prove surplus capacity; the waste itself was the proof. However, formal economic models, following Spence, demonstrate that waste is not strictly necessary. What is necessary is differential cost. An investment that improves productivity (like education) can signal quality if it is easier for high-quality individuals to acquire. The cost need not be thrown away; it merely needs to be burdensome enough to deter mimics. In your context, a forty-hour case study is not 'waste' if it resembles actual work, but it functions as a signal only if high-competence candidates complete it with less marginal effort than low-competence ones. If the effort required is identical regardless of competence, the time spent is purely wasteful signaling. The formal machinery suggests you should minimize waste while maximizing differential cost. Your colleagues' insistence on 'hurt' conflates the deterrent effect with the destruction of value.

      *Section 4 (Honest/Wrong Thing):*
      Your distinction between trait-elastic and budget-elastic requirements is robust, but it requires correction to focus on marginal cost rather than total cost. A requirement is valid only if the marginal cost of clearing it decreases as the target trait increases. If the marginal cost decreases as disposable income increases, the requirement signals wealth, not trait. This is where your first worry lands: a hurdle can be perfectly honest about a candidate's liquidity while being completely dishonest about their competence. When cost tracks free time or capital, you create a separating equilibrium based on socioeconomic status. Correcting this distinction clarifies your second worry. If you subsidize the cost, you are attempting to flatten the budget-elasticity while preserving the trait-elasticity. If you succeed, the signal becomes more valid. If you fail and subsidize everyone uniformly until the cost is negligible for all types, you collapse the separating equilibrium into a pooling equilibrium. The signal is not weakened; it is extinguished. Thus, the goal is not to reduce cost per se, but to decouple cost from wealth while maintaining its coupling with quality.

      *Section 5 (Paying to Signal):*
      This is the crux: does subsidy destroy the signal? The answer depends on whether the cost is absolute or positional and whether the subsidy is uniform or targeted. If the hurdle is purely positional (ranking candidates), subsidizing everyone equally may simply raise the baseline without changing the ranking, leaving the signal intact but more expensive for the employer. However, if the hurdle is absolute (clearing a threshold), uniform subsidy risks allowing low-quality candidates to cross the threshold, destroying the separation. Targeted subsidy (means-testing) is the superior mechanism. By offsetting costs only for those with lower resources, you neutralize the wealth variable. This repairs the signal by ensuring the remaining cost burden reflects only the difficulty of the task relative to competence. However, this assumes need is observable. If need is proxied poorly, you introduce noise. Furthermore, if the signal is about 'commitment' defined as 'willingness to suffer financial loss', then paying removes the signal by definition. But if 'commitment' is a proxy for 'competence', then financial loss is noise. You must argue that you are selecting for competence, not liquidity. Subsidy relocates the signal from 'ability to pay' to 'ability to perform'. It repairs the signal regarding trait, provided the differential cost structure remains.

      *Section 6 (Equilibria):*
      Signaling systems often settle into honest equilibria that are Pareto inefficient. This is the arms race dynamic. Once a costly signal becomes the norm, everyone must bear the cost to avoid being mistaken for a low type, even though everyone knows the cost adds no value. No individual can stop signaling without being penalized, creating a ratchet effect. In biology, this is locked by genetics. In human institutions, it is locked by convention and risk aversion. Your colleagues fear that softening a hurdle invites mimics, which is true within the current equilibrium. However, committees have the unique power to coordinate a shift to a new equilibrium. You are not asking one firm to drop standards unilaterally; you are designing a process where the signal is decoupled from wealth. This is not a grievance about waste; it is an argument for coordinated design. You can argue that maintaining a wealth-based signal is a suboptimal equilibrium that excludes high-quality candidates who lack capital. Changing the rules changes the equilibrium, allowing you to escape the arms race without losing information about competence.

      *Section 7 (The Paper):*
      In your proposal, advocate for hurdles where the marginal cost is tied to cognitive load rather than financial outlay. Replace the unpaid residential with a supervised, time-bound assessment. Replace the take-home case with a structured exercise where resources are provided. Replace the certificate requirement with an aptitude test. Acknowledge explicitly that this removes a filter for 'financial resilience' or 'privilege'. Argue that these are not job-relevant traits. Expect to lose the ability to select for candidates with high disposable income and spare time. You will gain a higher correlation between selection and actual job performance. Frame the subsidy not as charity, but as noise reduction. By paying for travel or providing laptops, you are not lowering the bar; you are removing the static that prevents you from seeing who can actually clear the bar. Your goal is to maximize the signal-to-noise ratio, where signal is competence and noise is wealth. This design costs the employer money but increases the quality of hire, trading budget for validity.

