  2. **What costliness has to buy**
  For a cost to convey information, it must satisfy the Single-Crossing Property. This means the marginal cost of producing the signal must be lower for high-quality candidates than for low-quality candidates. Mere expensiveness is insufficient because wealth allows low-quality candidates to mimic high-quality ones if the cost is uniform. If a hurdle costs £2,000 for everyone, it signals only that the candidate has £2,000, not that they are competent. The cost acts as a screen only if the burden feels heavier to the low-quality type. In economic terms, the indifference curves of high and low types must cross only once with respect to the signal level. If the cost function is identical for both types relative to their quality, no separating equilibrium exists; everyone pools at the level of signal the lowest type can afford. Therefore, costliness buys honesty only when it is differentially costly. Your colleagues' slogan assumes cost correlates with quality; without that correlation, cost correlates only with liquidity. To defend your position, you must show that the proposed hurdles violate this condition by imposing costs that are independent of competence but dependent on capital.

  3. **Waste versus differential cost**
  There is a tension between the original Handicap Principle and formal signaling models regarding waste. Zahavi's original biological formulation emphasized that signals must reduce survival fitness to prove surplus capacity; the waste itself was the proof. However, formal economic models, following Spence, demonstrate that waste is not strictly necessary. What is necessary is differential cost. An investment that improves productivity (like education) can signal quality if it is easier for high-quality individuals to acquire. The cost need not be thrown away; it merely needs to be burdensome enough to deter mimics. In your context, a forty-hour case study is not 'waste' if it resembles actual work, but it functions as a signal only if high-competence candidates complete it with less marginal effort than low-competence ones. If the effort required is identical regardless of competence, the time spent is purely wasteful signaling. The formal machinery suggests you should minimize waste while maximizing differential cost. Your colleagues' insistence on 'hurt' conflates the deterrent effect with the destruction of value. You can argue that a supervised test hurts low-competence candidates more through difficulty, whereas a take-home test hurts low-wealth candidates more through opportunity cost.

  4. **Honest, but about the wrong thing**
  Your distinction between trait-elastic and budget-elastic requirements is robust, but it requires correction to focus on marginal cost rather than total cost. A requirement is valid only if the marginal cost of clearing it decreases as the target trait increases. If the marginal cost decreases as disposable income increases, the requirement signals wealth, not trait. This is where your first worry lands: a hurdle can be perfectly honest about a candidate's liquidity while being completely dishonest about their competence. When cost tracks free time or capital, you create a separating equilibrium based on socioeconomic status. Correcting this distinction clarifies your second worry. If you subsidize the cost, you are attempting to flatten the budget-elasticity while preserving the trait-elasticity. If you succeed, the signal becomes more valid. If you fail and subsidize everyone uniformly until the cost is negligible for all types, you collapse the separating equilibrium into a pooling equilibrium. The signal is not weakened; it is extinguished. Thus, the goal is not to reduce cost per se, but to decouple cost from wealth while maintaining its coupling with quality. Your terminology should shift to 'quality-dependent marginal cost' versus 'wealth-dependent marginal cost'.

