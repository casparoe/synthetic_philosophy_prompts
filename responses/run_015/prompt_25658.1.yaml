      *   *Crucial distinction:* The problem is often framed as learning a *conditional constraint* rather than a *factual proposition*. Standard Bayesianism updates on facts (propositions that are true/false). Learning "If A then B" is learning a constraint on the relationship between A and B, not necessarily eliminating the $\neg A$ worlds in the same way learning "$\neg A \lor B$" does.

