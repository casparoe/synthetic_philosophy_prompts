prompt: |-
  I'm applying for a three-month workshop grant on the philosophy of mind and technology, and I need a two-page proposal. My half-formed idea concerns gradual neural replacement—say, substituting biological neurons one by one with functionally equivalent synthetic modules—and the standard framing asks only whether personal identity survives. I think that framing is too narrow: the interesting problem is whether gradual replacement can preserve psychological continuity and functional behavior while breaking a distinct kind of continuity I will call normative standing—the continuity of being the same moral patient with the same claims and obligations—because the synthetic substrate might replicate cognition without replicating the homeostatic, self-regulating basis that grounds moral status. Existing positions (psychological-continuity theories, animalism, and standard upload advocates) don't settle this because they either collapse normative standing into psychological continuity or treat biological substrate as all-or-nothing. I want the proposal to state the precise question—whether normative continuity tracks substrate architecture, functional role, or causal history during gradual replacement—to explain why the standard identity debate leaves it open, to lay out a method of conceptual analysis using a taxonomy of replacement scenarios (uniform substitution, region-specific substitution with altered architecture, and social-role substitution without substrate change), and to specify what a result would look like and what would count as failure. The scope should be realistic for three months: no empirical experiments, only conceptual mapping and argument. Crucially, don't lay out options neutrally: take a definite position on which of the three continuities should be treated as primary for moral standing during replacement, defend that choice with reasons, and say honestly whether the project risks being too ambitious for the time available. Do not include a bibliography, citation requests, or references to specific scholars by name; I will add those. Keep the framing niche enough that it isn't just a restatement of the Ship of Theseus, but avoid invoking obscure formal theories a general model wouldn't know.
