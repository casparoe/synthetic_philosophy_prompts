answer: |-
  ### Closest concepts in the literature

  Three existing frameworks encircle this problem without capturing it. First, **Motivated Reasoning** (Kunda, 1990) describes how individuals process evidence to reach preferred conclusions. This fits your observation that the "dials" track desired outcomes, but it is a psychological mechanism, not a structural description of the error itself. Second, **Pascal's Mugging** (Bostrom, 2009) addresses the instability of expected value calculations when low probabilities meet huge impacts. While your insect example involves small probabilities and large populations, your concern is not the dominance of the tail risk, but the internal consistency of the probability and magnitude assignments. Third, **Population Ethics** (Parfit, 1984), specifically the "Repugnant Conclusion," debates the trade-off between the number of lives and their quality. This mirrors the quantity versus intensity debate but typically assumes known moral status rather than probabilistic consciousness. Together, these concepts cover the bias, the math, and the ethics, but none isolate the specific failure to model the dependency between probability and magnitude given a single piece of evidence.

  ### How each one falls short

  Motivated reasoning is too broad; it explains *why* someone might bias their estimate, but not *how* they structurally misassemble the equation. It does not specify that the error lies in treating two correlated parameters as independent. Pascal's Mugging falls short because it assumes the parameters are given and focuses on the resulting vulnerability to manipulation. Your critique is prior to that: it targets the construction of the parameters themselves. You are noting that the input features (nervous system complexity) are being fed into only one part of the model (probability) while being ignored in the other (magnitude), violating the model's causal graph. Finally, standard Population Ethics assumes the subjects are definitely persons or definitely not. It lacks the layer of **moral uncertainty** regarding the existence of the subject's inner life. None of these frameworks capture the specific violation of conditional independence where evidence $E$ should update both $P(Conscious)$ and $E(Intensity | Conscious)$, but is selectively applied to only one to preserve a preferred Expected Value.

  ### What's actually going on

  The mechanism is a failure of joint distribution modeling. In a consistent Bayesian framework, evidence regarding system complexity ($E$) constrains the joint probability of consciousness and intensity. If simplicity reduces the likelihood of consciousness, it should also reduce the expected intensity *conditional on consciousness*, because the same physical substrate supports both. By decoupling these, arguers treat $P$ and $M$ as independent variables they can tune to stabilize the Expected Value ($E = P \times M$) around a prior belief.

  Regarding your cancellation hypothesis: it holds partially but depends on the axis of variation. If you vary the *definition* of consciousness (the threshold), there is likely an inverse correlation: a lower threshold increases the population ($P$) but decreases the average intensity ($M$) of included members. In this specific sense, $P \times M$ might remain relatively stable across definitions. However, within a fixed definition, evidence of simplicity should lower *both* dials. The "cancellation" you observe across opponents (Skeptic: Low $P$/High $M$ vs. Advocate: High $P$/Low $M$) is not a natural equilibrium but a collision of two inconsistent models. The expected value doesn't stay stable because of truth; it stays stable because both sides are inadvertently preserving a human-scale moral intuition by compensating errors in opposite directions.

  ### Name, definition, and boundary cases

  **Term:** Evidentiary Decoupling.

  **Definition:** The error of assigning evidentiary weight to one parameter of a multiplicative expected value model (e.g., Probability) while treating a causally linked parameter (e.g., Magnitude) as invariant, despite both being dependent on the same underlying evidence.

  **Boundary Cases (Exclusions):**
  1.  **Genuine Independence:** Estimating the probability of rain versus the magnitude of flood damage. Rain probability does not causally determine damage severity (which depends on infrastructure); treating these as independent is correct.
  2.  **Binary Thresholds:** If consciousness is strictly binary (on/off) with fixed intensity when "on," then evidence only affects probability. Exclusion applies only if the "fixed intensity" claim is empirically justified rather than assumed to protect the model.
