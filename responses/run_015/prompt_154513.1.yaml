answer: |-
  It is understandable why you find the corporate liability analogy compelling because it bypasses the metaphysical weirdness of a collective soul while preserving the intuition that some debts outlive the individuals who incurred them. However, to test the durability of this view, we need to press on the distinction between liability and guilt, which I believe constitutes the most fatal defeater available. If a corporation remains liable for a breached contract after all original employees have left, it is because the legal system enforces continuity of obligation, not because the corporation feels remorse or possesses moral agency. When you transfer this to the national level, you risk conflating the duty to make reparations with the state of being guilty. Moral guilt typically requires a first-personal stance, a capacity for remorse and intentional recognition of wrongdoing that institutions simply do not have. A nation can issue an apology, but it is always ventriloquized by current leaders speaking on behalf of a structure that cannot feel. If you deny that nations are agents with real intentions, the view does not necessarily collapse, but it transforms into something weaker: it becomes a theory of inherited debt rather than inherited guilt. A committed defender would likely concede this point but argue that political guilt is distinct from moral guilt precisely because it does not require inner remorse, only outward rectification. However, this concession opens the door to the charge of unfalsifiability, which is the second most dangerous threat to the theory.

  The risk of insulation is high because the distinction between political and criminal guilt can function as a protective belt against any counterexample. If you point out that current citizens did not commit the acts, the defender says this is political guilt, not criminal. If you point out that the state cannot feel remorse, the defender says political guilt is about liability, not psychology. If you argue that institutional change should erase the debt, the defender says the political community survives regime change. To avoid being a tautology, the theory must specify conditions under which political guilt would not apply. The most serious test here is the institutional change problem. If a nation rebuilds its government and social structures completely, such as through a revolutionary founding that explicitly repudiates the prior legal and moral order, does the guilt disappear? In the corporate world, if a company dissolves and a new one buys the assets, old liabilities can sometimes be shed depending on the legal structure. If nations are analogous, then a total constitutional rupture should potentially wipe the slate clean. If the defender insists the guilt persists even through total structural discontinuity, then the analogy to corporations breaks, and we are back to positing a mystical national essence that survives despite material changes. A committed defender would likely dismiss the idea that structural change erases guilt, arguing that the political community is defined by territory and culture more than specific laws, but this makes the view vulnerable to the charge that it is essentializing the nation in the very way Jaspers claimed to avoid.

  Then there is the problem of scope, which is awkward but perhaps manageable. If we apply the logic of continuing moral subjects to universities, sports clubs, or neighborhoods, do they inherit guilt? A university might accept liability for past research abuses, and a sports club might acknowledge past discrimination, but we generally hesitate to say the current members are guilty. We say the institution bears the stain, but the individuals do not. If you accept this for nations, you must explain why the national scale is morally unique. Is it because nations hold a monopoly on violence? Is it because citizenship is non-voluntary in a way club membership is not? If the difference is merely scale, then the view implies that your local homeowners association inherits guilt for racially restrictive covenants from fifty years ago in the same way Germany inherits guilt for the Holocaust. This feels absurd to many, not because the debt isn't real, but because the moral weight of a neighborhood association does not seem to sustain transgenerational guilt. A defender would likely concede that smaller groups inherit liability but dismiss the idea that this is absurd, arguing that we simply ignore it because the stakes are lower. However, this suggests that the theory is driven by consequences rather than principle, which weakens its philosophical footing.

  To see where the analogy might truly break, consider the case of a professional sports franchise that relocates and rebrands. Suppose a team in the 1950s systematically excluded players based on race, and today the franchise is in a different city with entirely different ownership, management, and players. We acknowledge the history, and perhaps the league strips past titles, but we do not say the current team is guilty of the past discrimination. They do not owe reparations to the descendants of the excluded players, nor are they expected to perform acts of atonement beyond general league-wide initiatives. The analogy to nations breaks here because we intuitively recognize that the sports franchise is a commercial entertainment vehicle, whereas the nation is a political community that claims to represent a people across time. However, this difference cuts both ways. If the nation represents the people, and the people have turned over completely, the representation is broken. If the nation represents the state apparatus, and the apparatus has been democratized, the continuity is broken. The only way the guilt persists is if the nation is treated as a corporation that cannot go bankrupt. But corporations can go bankrupt. They can shed debts through legal death. Nations are rarely allowed this moral bankruptcy. This suggests that the view of inherited political guilt relies on a special exception for nations that is not granted to other collective entities, which implies the theory is not based on the nature of collective agency but on the specific political need for stability and reconciliation.

  Ranking these defeaters, the confusion between liability and guilt is fatal because it strikes at the definition of the core term. If political guilt is just liability, call it liability, and drop the moral baggage of the word guilt. The unfalsifiability risk is nearly as severe because it prevents the theory from ever being proven wrong, rendering it dogmatic. The institutional change problem is serious because it tests the limits of the corporate analogy, while the scope problem is merely awkward because it can be defused by arguing about degrees of power and coercion. A committed defender would have to concede that current citizens are not blameworthy in the criminal sense and that the guilt is actually a duty of repair tied to the benefits received from past injustices. They would dismiss the idea that institutional change erases guilt, but only if they can show that the benefits and structures of injustice persist through the change. If they cannot show that persistence, the view risks being insulated from reality, protecting a moral intuition at the cost of metaphysical coherence. Ultimately, the view holds only if you accept that political communities are unique entities that transcend the sum of their members and the specifics of their laws, which is a heavy metaphysical price to pay to avoid the spooky collective mind you initially wanted to escape.
