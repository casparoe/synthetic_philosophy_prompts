  ### Brainstorming Distinctions for Grading

  1.  **Evidentiary Absence vs. Absence of Evidence:** Silence in the archaeological record (e.g., Sinai) is not proof of non-event unless the context demands preservation (e.g., Egyptian monumental records). The student treats Egyptian silence as a "stream," which is category confusion.
  2.  **Kernel vs. Framing:** Archaeology at Hissarlik confirms destruction (kernel) but not the specific heroic narrative or pan-Hellenic coalition (framing). The student conflates these by calling it a "confirmed historical war" based on treaty identifications that are probabilistic, not definitive.
  3.  **Cross-Tradition Sedimentation:** Requires genuine independence (language, culture, motive). Nennius and the Annales Cambriae are not independent of each other nor contemporary to Arthur, failing the "sedimentation" criteria properly understood.
  4.  **Necessity/Sufficiency:** The prompt explicitly asks for this taxonomy. The student implies answers but never states them, which is a compliance failure.

