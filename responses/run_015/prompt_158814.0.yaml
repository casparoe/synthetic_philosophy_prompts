answer: |-
  Here is my position, argued directly against your hypothesis.

  You are right that the dispute is frozen, and you are right that the "identity shield" (mathematical equivalence) prevents empirical falsification. However, I think your diagnosis of *why* the dispute persists is slightly off. You suggest the sides have different "pre-theoretic standards for causal explanation." I argue it is deeper: they have incompatible ontologies of **individuality**.

  The Gene's-Eye View (GEV) and Multi-Level Selection (MLS) are not just disagreeing about how to partition variance; they are disagreeing about what entities exist in the world to *have* variance. The equivalence results are algebraic, but algebra does not dictate ontology. When you push on the three points you raised, the "Identity Shield" starts to look less like a protection against empirical data and more like a barrier to ontological clarity.

  Here is how I test your hypothesis against the three constraints you set.

  ### 1. The Additivity Loophole: Is the Shield Porous?

  You suspect the equivalence results rely on additivity/linearity assumptions that real cases violate, potentially reopening an empirical question. You are half-right, but the implication is subtler than "one side will be proven wrong."

  Formally, the Price Equation is a tautology; it holds regardless of linearity. It simply partitions covariance. However, the *interpretive* tools used to cash out MLS (specifically Contextual Analysis) typically rely on linear regression to assign coefficients to "individual fitness" and "group fitness." If the fitness function is highly non-linear (e.g., strong synergistic epistasis or threshold effects in group survival), the linear partition leaves massive residuals.

  The GEV proponent handles this by absorbing the non-linearity into the gene's "extended phenotype" or by positing complex interactions between alleles at different loci. The MLS proponent handles this by positing a non-linear group-level fitness function.

  **The Pushback:** The equivalence holds *mathematically*, but it breaks down *heuristically*. In cases of strong non-additivity, the GEV story becomes incredibly convoluted (requiring vast networks of interacting genes to explain a simple group trait), while the MLS story remains compact (the group has a emergent property). Conversely, in cases where group structure is ephemeral, the MLS story becomes gerrymandered (defining groups post-hoc to fit the variance), while the GEV story remains stable.

  So, there is no empirical fact that falsifies one formalism. But there is an **explanatory cost function**. The "Identity Shield" protects both from being *false*, but it does not protect them from being *useless*. The hidden empirical question isn't "Which equation is right?" It is "In which biological regimes does one partition remain stable under perturbation while the other collapses?" If you perturb the group structure and the "group selection coefficient" vanishes, but the "kin selection coefficient" remains robust, you have an empirical reason to prefer the GEV causal story, even if the math was equivalent at time *t*.

  ### 2. Data and Phenomena: Are They Talking Past Each Other?

  You ask if the sides are quietly disagreeing about which cases count as data—ephemeral trait-groups versus full transitions in individuality. **Yes, absolutely.** This is the strongest point of your hypothesis, but I think you understate the conflict.

  The GEV literature tends to treat "groups" as statistical aggregates of individuals that happen to interact. For a GEV theorist, a "group" is just a local density of genes. Selection at the group level is just selection on genes that find themselves in specific contexts.

  The MLS literature (particularly the work focused on evolutionary transitions) treats "groups" as potential **individuals**. For an MLS theorist, a group is only a unit of selection if it has a heredity mechanism independent of the particles composing it.

  This means they are often explaining different **temporal slices** of the same process.
  *   **GEV** is excellent at explaining the *maintenance* of traits in a population where the higher-level unit is not yet a fully fledged individual (e.g., altruism in loose aggregations).
  *   **MLS** is necessary to explain the *origin* of new levels of individuality (e.g., the transition from single cells to multicellular organisms).

  If you treat a multicellular organism as just a "group of cells," MLS explains the suppression of cell-level cheating (cancer). GEV can explain this too, but only by treating the organism as a "vehicle" for the germ-line genes. The conflict arises when GEV proponents refuse to grant the organism causal status, viewing it as a mere shadow of the gene.

  **The Verdict:** They are not just using different standards of explanation; they are studying different **ontological statuses** of biological structure. GEV assumes the particle (gene/organism) is the only real individual. MLS assumes individuality is a gradient. When MLS proponents point to "group selection," they often mean "the process by which a group becomes an individual." When GEV proponents deny it, they mean "there is no replicator at the group level." Both are right about their own definitions, but they are mismatched on the phenomenon.

  ### 3. What Counts as Progress?

  Given this diagnosis, your third question is the pivot. You offer three options: an interventionist criterion, a taxonomy of standards, or abandoning the question.

  **I argue we must abandon the question "Which level is the level of selection?"**

  Asking "Which level?" presupposes that selection is a substance that must reside in one place. It doesn't. Selection is a causal process that can operate simultaneously at multiple levels. The question is a category mistake.

  Progress comes from shifting the question to: **"Under what conditions does a higher-level unit acquire explanatory autonomy?"**

  This requires an **interventionist criterion for individuality**, not selection. We need to stop asking "Is there group selection?" and start asking "Is this group an individual?"
  *   **Bottlenecking:** Does the group reproduce through a single cell propagule? (High individuality).
  *   **Conflict Mediation:** Are there mechanisms suppressing lower-level fitness variance? (High individuality).
  *   **Heredity:** Does the group phenotype map to group fitness independently of particle fitness?

  If these conditions are met, the MLS decomposition is not just mathematically equivalent; it is **causally superior** because it tracks the variables that an experimenter could intervene on to change the evolutionary outcome. If I want to stop cancer, intervening on "organism-level constraints" is more robust than tracking every individual somatic mutation.

  **Why your "Standards" hypothesis needs adjustment:**
  You suggest the sides have different standards for what a causal explanation must do (counterfactual difference-makers vs. predictive decomposition). I argue that *both* sides want counterfactual difference-makers. They just disagree on **what counts as a difference-maker**.
  *   GEV: The gene is the only difference-maker that persists over deep time.
  *   MLS: The group is a difference-maker when it constrains the genes.

  The progress isn't in choosing a standard; it's in recognizing that **individuality is the variable**. In early stages of a transition, GEV is the better causal story (genes are the only individuals). In later stages, MLS is the better causal story (the new individual has autonomy). The "frozen dispute" exists because both sides try to apply their preferred ontology to *all* stages of the transition.

  ### Summary Position

  You are correct that the dispute is not empirical in the sense of data falsifying equations. But it is not merely about "standards of explanation" either. It is a conflict over **Explanatory Privilege in the face of Ontological Gradience**.

  1.  **Equivalence:** The math is equivalent, but the *stability* of the parameters under perturbation is not. This allows for a pragmatic, if not formal, empirical discrimination.
  2.  **Data:** They are studying different phases of evolutionary transitions. GEV studies particles; MLS studies the emergence of new collectives.
  3.  **Progress:** Abandon the "Level of Selection" question. Adopt an interventionist account of **Individuality**. Selection happens everywhere; individuality is rare. The job of philosophy of biology is not to partition variance, but to explain how variance gets bundled into units that persist.

  The "Identity Shield" should be shattered not by finding a dataset that breaks the Price Equation, but by showing that one decomposition tracks the **causal levers** of the system while the other merely describes the **accounting**. In biology, the ledger is not the economy.
