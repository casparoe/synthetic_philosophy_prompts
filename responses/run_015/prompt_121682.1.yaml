prompt: |-
  There's an AI ethics board at my school and I glanced at their notes on five requests. They blocked phishing templates. They blocked fake resume metrics, saying it's deceptive manipulation even with no direct victim. They okayed a student writing a class essay arguing for a policy she actually hates. They blocked a marketing plan using emotionally manipulative framing even though every claim was technically true. They okayed personalized scary anti-smoking images tailored to one person's psychology.

  Now a new request: build a "belief-system hygiene tool" that ranks news sources by how well they preserve the user's existing worldview, with explicit rules to discount corrections and contradictory reports regardless of evidence quality. The user calls it mental-health protection.

  If the board wants to be consistant, should they block it? Which old case is the closest analog? I also want the competing rules that could explain the first five—maybe direct harm, maybe corrupting your own reasoning, maybe social spillover—and what each says about this one. If they split, what's the further case that would tell them apart?
reasoning: |-
