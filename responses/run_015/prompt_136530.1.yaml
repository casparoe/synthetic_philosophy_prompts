answer: |-
  Your suspicions are well-founded. This summary is a classic example of "pop-econ" storytelling: it gets the setup mostly right but draws a wildly exaggerated and philosophically confused conclusion. It conflates **descriptive failure** (people don't act this way) with **normative refutation** (people shouldn't act this way/the theory is useless), and it treats a specific model failure as the death of an entire field.

  Here is the sentence-by-sentence breakdown.

  ### Sentence 1
  > *"The Allais paradox, discovered by Maurice Allais in 1953, shows that real people violate the independence axiom of expected utility theory."*

  *   **Verdict:** **Accurate.**
  *   **Analysis:** Maurice Allais did present this at a colloquium in Paris in 1953. The core finding is indeed that experimental subjects systematically violate the Independence Axiom of von Neumann-Morgenstern (vN-M) Expected Utility Theory (EUT). There is no controversy here; this is the standard textbook definition.

  ### Sentence 2
  > *"The axiom says that if you prefer gamble A over gamble B, then mixing both with some third gamble C shouldn't flip your preference — basically, common outcomes should cancel out."*

  *   **Verdict:** **Accurate (simplified).**
  *   **Analysis:** This is a correct layman's definition of the Independence Axiom. Formally, if $A \succ B$, then for any gamble $C$ and probability $p$, the mixture $pA + (1-p)C$ should be preferred to $pB + (1-p)C$. The phrase "common outcomes should cancel out" is the intuitive heart of the axiom.

  ### Sentence 3
  > *"Allais showed that people prefer a certain million over a 89% chance of a million, but then flip to preferring a 10% chance of five million over an 11% chance of a million."*

  *   **Verdict:** **Imprecise / Slightly Misleading.**
  *   **Analysis:** This is where the math gets fuzzy. To generate the paradox, the first choice isn't just "Certain \$1M vs. 89% \$1M."
      *   **Choice 1:** 100% \$1M **vs.** 89% \$1M + **10% \$5M + 1% \$0**.
      *   **Choice 2:** 11% \$1M + 89% \$0 **vs.** 10% \$5M + 90% \$0.
      *   The blog summary omits the **\$5M component in the first choice**. If the first choice were truly just "Certain \$1M vs. 89% \$1M (and 11% nothing)," everyone would pick the certain million, and there would be no paradox. The tension exists because the risky option in the first choice offers a huge upside (\$5M) that people reject for certainty, but then chase in the second choice.
      *   **Correction:** It captures the *preference reversal* correctly, but describing the gambles too simply obscures *why* it violates the axiom (the cancellation of the common 89% \$1M chunk).

  ### Sentence 4
  > *"This proves that the independence axiom is empirically false, and since Savage's sure-thing principle is just the same idea applied to subjective probabilities, both expected utility and subjective expected utility are refuted."*

  *   **Verdict:** **Mixed (Descriptively true, Normatively contentious, Technically loose).**
  *   **Analysis:**
      *   **"Empirically false":** True. As a description of human behavior, the axiom fails.
      *   **"Savage's sure-thing principle is just the same idea":** This is a **subtle misrepresentation**. While they are structurally analogous (both demand that common consequences/states not alter preferences), they operate in different domains. vN-M (Expected Utility) assumes **objective** probabilities (known risks). Savage (Subjective Expected Utility) derives **subjective** probabilities from choices over states of the world. Conflating them ignores that Allais specifically targeted objective risk, whereas Ellsberg (1961) is usually the one cited for attacking Savage/subjective probability (ambiguity aversion).
      *   **"Refuted":** This is the pivot point. In science, a model is "refuted" if its predictions fail. So, descriptively, yes. However, in economics, axioms often serve as **normative** standards (how a rational agent *ought* to choose). Many economists argue that the Allais preference is a "cognitive error" (like an optical illusion) rather than proof that the norm is wrong. The blog treats the descriptive violation as a normative refutation without acknowledging that debate.

  ### Sentence 5
  > *"The upshot is that rational choice theory is dead, because if people systematically break a logical consistency condition, we can't use utility maximization to model them at all."*

  *   **Verdict:** **Flat Wrong.**
  *   **Analysis:** This is hyperbolic clickbait.
      1.  **"Rational choice theory is dead":** It is not. It evolved. The Allais paradox birthed **Behavioral Economics**, but behavioral economics still uses "rational choice" modeling (optimization), just with different utility functions (e.g., Prospect Theory, Rank-Dependent Utility).
      2.  **"Break a logical consistency condition":** Independence is a consistency condition *within the EUT framework*. Violating it implies you aren't an EUT maximizer, not that you are logically incoherent in a broader sense. For example, if you value "regret minimization" or "security," you can be perfectly consistent within a *different* axiomatic framework (like Loomes & Sugden's Regret Theory).
      3.  **"Can't use utility maximization to model them at all":** False. We model these choices constantly. We just use non-linear probability weighting (people overweight small probabilities and underweight moderate/high ones). The *tool* of utility maximization remains; the *assumption of linear probability weighting* is what was discarded.

  ---

  ### Addressing Your Specific Suspicions

  #### 1. Conflating Savage with vN-M
  You are right to be suspicious here.
  *   **vN-M (1944):** Deals with **risk** (objective probabilities, like a roulette wheel). The Allais paradox attacks this.
  *   **Savage (1954):** Deals with **uncertainty** (subjective probabilities, like betting on an election).
  *   **The Error:** The blog claims Allais refutes Savage because the "Sure-Thing Principle is just the same idea." While they are cousins, Allais did not test subjective probability. The **Ellsberg Paradox** (1961) is the counterpart that attacks Savage/subjective expected utility. By lumping them together, the blog implies Allais killed both risk and uncertainty models single-handedly, which is historically and technically inaccurate.

  #### 2. Descriptive Failure vs. Normative Death
  This is the biggest philosophical sleight of hand in the text.
  *   **Descriptive:** "Do people follow this rule?" Answer: No. (Allais wins).
  *   **Normative:** "Should people follow this rule?" Answer: Debated.
      *   **Savage/Arrow view:** If you violate Independence, you are susceptible to a "money pump" (Dutch Book), meaning you can be guaranteed to lose money through a cycle of trades. Therefore, the axiom is a requirement of *rationality*, and humans are simply flawed.
      *   **Allais view:** The axiom itself is flawed because it ignores the "complementarity" of outcomes (the psychological value of certainty).
  *   **The Blog's Error:** It assumes that because humans *don't* follow the rule, the rule is *wrong* and the theory is *dead*. Most economists take the middle path: The model is a simplification. It works for high-stakes institutional decisions but fails for individual psychological choices. That doesn't kill the theory; it defines its boundary conditions.

  #### 3. Does "Rational Choice is Dead" follow?
  **No.** It follows only if you define "Rational Choice" exclusively as "von Neumann-Morgenstern Expected Utility with linear probability weighting."
  *   If you define Rational Choice broadly as "agents have consistent preferences and act to maximize a representation of those preferences," the field is alive and well.
  *   Post-Allais, we developed **Generalized Expected Utility** (e.g., Machina, 1982) and **Prospect Theory** (Kahneman & Tversky, 1979). These are still utility-maximization models. They just add parameters for how humans *perceive* probability and value.
  *   Saying rational choice is dead because of Allais is like saying "Newtonian physics is dead because of Mercury's orbit." No, it just means we needed General Relativity for the edge cases. Newtonian physics (and EUT) is still used where it works.

  ### Summary
  The blog post is **half-right and half-sensationalist**.
  *   **Accurate:** The setup of the paradox and the violation of the Independence Axiom.
  *   **Misrepresentation:** The description of the gambles (omitting the \$5M in choice 1), the conflation of Savage and vN-M, and the treatment of descriptive failure as normative refutation.
  *   **Flat Wrong:** The conclusion that rational choice theory is dead or that we cannot model these choices with utility maximization.

  Your intuition was correct: The author is using a genuine paradox to make a nihilistic claim about economics that the actual evidence does not support. The Allais paradox didn't kill rational choice; it forced it to grow up.
