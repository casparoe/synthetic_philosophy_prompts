          *   **Constraint:** No bibliography, reading list, or citations. Self-contained.

  2.  **Deconstruct the Distinction (Preservative vs. Initiatory):**
      *   *Preservative Omission:* Agent fails to interrupt an ongoing harmful process. (e.g., A ball is rolling towards a window; I fail to catch it. The ball's momentum exists independently of me.)
      *   *Initiatory Omission:* Agent fails to start a protective process that was structurally expected. (e.g., A safety switch is supposed to be flipped by me to stop the ball, but the switch itself requires my input to exist as a barrier. Or better: A system is idle until I activate the shield.)
      *   *Nuance:* The user defines Initiatory as "a safeguard or counterfactual chain that was structurally expected never gets activated." This implies the safeguard *depends* on the agent's action to come into existence as a causal factor. Preservative implies the harmful chain is already running, and the agent just doesn't stop it.
