prompt: |-
  I'm ops director at a 25-person software consultancy and maybe twice a month a client asks us for a fixed-price bid on a project — meaning if we blow the estimate we eat the difference, which has cost us actual money twice in the last year. I want a written procedure a project lead can run alone, in about 30 minutes, before a bid goes out: the steps in order, what counts as an adequate answer at each step, the points where the procedure just says stop and don't bid, and the points where it has to hand the decision to a partner because what's left is a question about how much risk the firm wants to carry rather than a question of fact. Constraints: the leads are strong engineers with no stats training at all, so nothing with a formula they'd have to look up or a likelihood ratio they'd have to squint at, and I'd much rather have something slightly crude that gets used every time than something elegant that gets skipped. Also, please don't give me papers, reading lists or citations — I don't need them and I can't check them anyway.

  The part I keep tripping over, and where I want the real conceptual work, is that the obvious outside-view move (pull the numbers from similar past projects, start there, and let the inside view adjust only for things you can actually point to) has a hole I've never seen handled properly: picking the reference class is itself a judgment made from the inside, and my team is definatly good at gerrymandering it without noticing. Last month someone built a reference class of "Rails upgrades where the client already had a staging environment," got four data points out of it, and announced that as the outside view. So I want the procedure to include a second-order step — a disciplined way of asking how often this team's chosen reference classes have actually held up afterward, what to do when the honest answer is "you've never built one of these and there is no reference class," and how to stop that step from becoming infinite regress. I was arguing with a friend who forecasts as a hobby and she said something like "your outside view is just an inside view wearing nicer clothes," which I can't get out of my head. Related: I want epistemic modesty built into the output rather than just as an attitude — the procedure should be able to end at "here is a range, and here is why it needs to be wider than you want it to be," and it should tell the lead when the range is wide enough that bidding fixed-price at all is the actual mistake.

  Please run it on three cases: (1) a data migration very similar to six we've done, except the client's legacy schema is properly documented this time and the lead says "no really, this one is different"; (2) something we've never built before — an LLM-backed support triage tool — with no internal reference class and a client who wants a number by Friday; (3) our biggest client's pet project, a "quick" two-week integration, where I have a feeling the procedure is going to tell me something I don't want to hear, and I want you to not soften it. Be explicit too about what the procedure cannot do, where it will misfire, and which parts are judgment calls dressed up as steps. End with a single final line in the form \answer{case1: VERDICT | case2: VERDICT | case3: VERDICT}, each verdict a short phrase like bid 6 weeks, decline fixed-price, or escalate to partner.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Ops Director at a 25-person software consultancy.
      *   **Problem:** Fixed-price bids are costing money (2 losses in last year). Need a 30-minute pre-bid checklist/procedure for Project Leads (strong engineers, no stats training).
      *   **Goal:** A written procedure to decide *whether* to bid fixed-price and *how* to estimate, including stop/go/escalate points.
      *   **Key Constraint 1 (The "Hole"):** Address the reference class selection bias (gerrymandering). Needs a second-order check on the reference class itself.
      *   **Key Constraint 2 (Epistemic Modesty):** Output must include ranges and explicit uncertainty. Must identify when fixed-price is the wrong model entirely.
      *   **Key Constraint 3 (Usability):** Crude but used > Elegant but skipped. No formulas, no reading lists.
      *   **Key Constraint 4 (Honesty):** Explicitly state what the procedure *cannot* do and where it's just dressed-up judgment.
      *   **Test Cases:**
          1.  Data migration (similar to 6 past, but "documented schema" claim).
          2.  LLM triage tool (never done before, no reference class, urgent).
          3.  Big client "quick" integration (political pressure, likely underestimated).
      *   **Output Format:** Procedure first, then application to cases, then limitations, then final line `\answer{...}`.

  2.  **Deconstruct the "Reference Class Hole":**
      *   The user is right: "Outside View" often becomes "Inside View in disguise" because humans pick the reference class that supports their desired outcome.
      *   *Solution:* The procedure needs a "Reference Class Audit." It can't rely on the lead's intuition about similarity. It needs a mechanical check: "How many times have we used *this specific* reference class before, and how often were we wrong?"
      *   *Handling "No Reference Class":* If the class is new, the procedure must force a "Discovery Phase" bid instead of a Fixed Price bid, or apply a massive "Novelty Tax" (multiplier).
      *   *Stopping Infinite Regress:* Limit the audit to *our* history only. Don't ask "Is this class valid in the universe?" Ask "Has this class worked for *us*?"

  3.  **Drafting the Procedure (The "30-Minute Gate"):**
      *   *Timebox:* 30 minutes max. If it takes longer, you're already over-investing in a bad bid.
      *   *Step 1: The "Have We Done This?" Check (Reference Class Selection).*
          *   Constraint: Must find 3+ comparable projects *internal* to the firm.
          *   Anti-Gerrymander Rule: If you have to add more than 2 qualifiers to find 3 projects, the class is too small.
      *   *Step 2: The "Scorecard" (Reality Check).*
          *   Look at those 3 projects. Did we hit the estimate? If not, by how much?
          *   If the average overrun is >20%, fixed price is dangerous.
      *   *Step 3: The "Difference" Tax (Inside View Adjustment).*
          *   Lead claims "This one is different."
          *   Rule: You can only discount risk for differences you can *prove* before signing (e.g., "I have read the schema"). You cannot discount for "Client says it's ready."
      *   *Step 4: The Uncertainty Range.*
          *   Best case / Worst case.
          *   If Worst Case > 1.5x Best Case, Fixed Price is forbidden.
      *   *Step 5: The Partner Escalation.*
          *   When risk > profit margin potential.
          *   When the client demands a number but the range is too wide.

  4.  **Refining the "Reference Class Audit" (Addressing the User's Core Worry):**
      *   I need a specific step that calls out the "Rails upgrade with staging" trick.
      *   *Idea:* The "Three-Project Rule." You need three *actual* completed projects that match the criteria. If you can't name three *without* adding extra adjectives, you don't have a reference class. You have a hypothesis.
      *   *Idea:* The "Post-Mortem Memory." For those three projects, what was the *final* billable hours vs. *estimated* hours? Not what the lead remembers, but what Finance says.

  5.  **Drafting the Test Cases:**
      *   *Case 1 (Migration):* 6 past projects exist. Lead says "documented schema."
          *   Procedure check: Do we have 3 past "documented schema" migrations? Probably not. So the reference class reverts to "all migrations."
          *   Verdict: Use "all migrations" baseline, apply small discount only if lead verifies docs *now*.
      *   *Case 2 (LLM Tool):* No history.
          *   Procedure check: Reference class size = 0.
          *   Rule: If size < 3, No Fixed Price. Bid Discovery or T&M.
          *   Verdict: Decline Fixed Price.
      *   *Case 3 (Big Client "Quick" Job):* Political pressure.
          *   Procedure check: Likely fails the "Three-Project Rule" for "quick integrations" (usually they aren't quick).
          *   Range check: Worst case likely huge.
          *   Verdict: Escalate to Partner (or Decline). The prompt asks me not to soften it.

  6.  **Addressing Limitations & "Dressed Up Judgment":**
      *   Be honest: This doesn't predict the future. It predicts *our behavior*.
      *   It stops us from lying to ourselves, not from the client changing their mind.
      *   The "3 project" limit is arbitrary but necessary to stop regress.

  7.  **Review against Constraints:**
      *   30 mins? Yes, if data is accessible.
      *   No stats formulas? Yes, using counts and simple ratios.
      *   Epistemic modesty? Yes, built into the Range step.
      *   Final line format? `\answer{...}`.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Critique:* Is "3 projects" too hard for a 25-person firm?
      *   *Adjustment:* If the firm is 25 people, they might not have 3 exact matches. If they don't, that *is* the signal to not bid fixed. That's the point. The procedure protects the firm by saying "No."
      *   *Critique:* How to handle the "documented schema" claim in Case 1 without slowing down?
      *   *Adjustment:* Add a "Proof Before Bid" step. If you can't verify the difference *before* the bid, you can't count it as a risk reducer.
      *   *Tone:* Direct, operational, slightly cynical (matches the Ops Director persona).

  9.  **Constructing the Output:**
      *   **Title:** The 30-Minute Fixed-Price Gate.
      *   **Sections:** The Procedure (Steps 1-5), The "Stop" Conditions, The Escalation Points.
      *   **Application:** Run the three cases through the steps.
      *   **Limitations:** What this doesn't solve.
      *   **Final Line:** As requested.

  *(Self-Correction on Final Line)*: The prompt asks for `\answer{case1: VERDICT | case2: VERDICT | case3: VERDICT}`. I need to make sure the verdicts are short phrases.

  *(Refining Case 3)*: The user says "I want you to not soften it." If the procedure says "No Fixed Price," I should state that clearly.

  *(Refining the Reference Class Logic)*: I need to make sure the "Gerrymandering" check is explicit. "If you add a qualifier to find a match, you must remove a project that no longer fits."

  Let's write it.cw
answer: |-
  # The 30-Minute Fixed-Price Gate

  **Purpose:** To prevent the firm from signing fixed-price contracts where the risk exceeds the margin, without requiring statistical training.
  **Owner:** Project Lead (with Finance/Partner escalation triggers).
  **Time Limit:** 30 Minutes. If you exceed this, you are already over-investing in a bad bid. Stop and escalate.

  ---

  ## The Procedure

  ### Step 1: The Reference Class Audit (10 Minutes)
  **Action:** Open the project archive. Find completed projects that match this one.
  **The Rule of Three:** You must find **at least three** completed projects that match the scope *without* adding more than two qualifying adjectives.
  *   *Bad:* "Rails upgrades where the client had staging and a dedicated DevOps person and used Postgres." (Too many qualifiers = Gerrymandering).
  *   *Good:* "Rails upgrades."
  *   *The Anti-Gerrymander Check:* If you have to add a qualifier to find the third project, you must remove the project that *least* fits the new qualifier. If your class drops below three, you **do not have a reference class.**

  **Adequate Answer:** A list of 3+ Project IDs with their *Original Estimate* and *Actual Hours*.
  **Stop Condition:** If you cannot find 3 matches, you **cannot bid Fixed Price.** Proceed to Step 5 (Escalation) to propose Time & Materials or Discovery.

  ### Step 2: The Reality Ratio (5 Minutes)
  **Action:** For the 3 projects identified in Step 1, calculate the "Overrun Ratio" for each: `Actual Hours / Estimated Hours`.
  *   Example: Estimated 100, Actual 120 = 1.2 ratio.
  **Calculation:** Take the average of the three ratios.
  **Adequate Answer:** A single number (e.g., 1.15).
  **Risk Signal:**
  *   Ratio < 1.1: Historical accuracy is good.
  *   Ratio 1.1 – 1.3: Moderate risk.
  *   Ratio > 1.3: **Stop.** Your team consistently underestimates this type of work. Fixed price is forbidden unless you apply a 30%+ buffer to the bid, which may make you uncompetitive.

  ### Step 3: The "Proven Difference" Test (5 Minutes)
  **Action:** The lead will claim, "This one is different (easier/harder)."
  **The Test:** Can you verify the difference *before* the contract is signed?
  *   *Valid:* "I have read the API docs and they are complete." (You can check this now).
  *   *Invalid:* "The client says their data is clean." (You cannot verify this until you start).
  **Rule:** You may only adjust the estimate based on **Valid** differences. If the difference is Invalid, you must use the baseline from Step 2.
  **Adequate Answer:** A written note of the specific evidence verified (e.g., "Link to schema repo reviewed"). If no evidence exists, write "None."

  ### Step 4: The Uncertainty Range (5 Minutes)
  **Action:** Do not produce a single number. Produce a Range.
  *   **Best Case:** Everything goes right (based on Step 2 baseline).
  *   **Worst Case:** The top 2 risks from Step 3 actually happen.
  **The Spread Check:** Calculate `(Worst Case - Best Case) / Best Case`.
  **Stop Condition:** If the Spread is **> 50%**, Fixed Price is the wrong commercial model. The variance is too high to insure.
  **Adequate Answer:** A range (e.g., "6 to 9 weeks").

  ### Step 5: The Decision Gate (5 Minutes)
  **Action:** Compare the output to the Decision Matrix below.

  | Condition | Verdict |
  | :--- | :--- |
  | Step 1 Failed (No Reference Class) | **Decline Fixed Price.** Offer Discovery/T&M. |
  | Step 2 Ratio > 1.3 | **Decline Fixed Price.** Or add 30% buffer (Partner approval required). |
  | Step 4 Spread > 50% | **Decline Fixed Price.** Variance is too high. |
  | All Steps Passed | **Proceed to Bid.** Use Worst Case number as the Fixed Price. |
  | Client Political Pressure | **Escalate to Partner.** (See Case 3). |

  ---

  ## What This Procedure Cannot Do
  1.  **It cannot predict client behavior.** It only predicts *your* performance based on *your* history. If the client delays feedback, this procedure won't catch it unless "Client Latency" is part of your reference class definition.
  2.  **It is not a formula for truth.** The "Rule of Three" is arbitrary. It is a speed bump to stop you from cherry-picking one success story. It is a heuristic, not a law.
  3.  **It cannot fix bad data.** If your historical time-tracking is sloppy, Step 2 is garbage. This procedure assumes Finance's numbers are real.
  4.  **It dresses up judgment as steps.** Step 3 ("Proven Difference") is still subjective. A determined lead can convince themselves a vague email counts as "verification." The procedure relies on the lead's integrity to mark "None" when they haven't actually checked.

  ---

  ## Application to Cases

  ### Case 1: Data Migration (Similar to six past, but "documented schema")
  *   **Step 1 (Reference Class):** Lead claims "Documented Schema Migrations."
      *   *Audit:* Search archive. We have 6 migrations total. Only 1 had a fully documented schema beforehand.
      *   *Result:* Class size = 1. Fails Rule of Three.
      *   *Correction:* Revert class to "All Data Migrations" (Size = 6).
  *   **Step 2 (Reality Ratio):** Average overrun on "All Migrations" is 1.25 (25% over).
  *   **Step 3 (Proven Difference):** Lead says "Schema is documented."
      *   *Test:* Has Lead read the docs? Yes. Are they complete? Skimmed, looks okay.
      *   *Adjustment:* Lead wants to reduce estimate by 20% because of docs.
      *   *Rule Check:* Valid difference? Yes, but only if Lead attaches the docs to the bid.
  *   **Step 4 (Range):** Baseline 10 weeks. Best case 8 weeks (with docs). Worst case 13 weeks (docs are wrong).
      *   *Spread:* (13-8)/8 = 62%.
  *   **Analysis:** The spread is >50%. Even with a reference class, the variance is too high for fixed price.
  *   **Verdict:** **Bid 8 weeks T&M with Cap, or Decline Fixed.** (If forced to Fixed, must bid 13 weeks).

  ### Case 2: LLM Triage Tool (Never built, no reference class)
  *   **Step 1 (Reference Class):** Search archive for "LLM" or "Support Triage."
      *   *Result:* 0 projects.
      *   *Audit:* Fails Rule of Three immediately.
  *   **Step 2 (Reality Ratio):** N/A.
  *   **Step 5 (Decision Gate):** Step 1 Failed.
  *   **Analysis:** Your friend is right. This is an inside view wearing outside view clothes if you try to analogize to "Web App Dev." It is not web app dev. It is probabilistic engineering. You have no data on your own ability to deliver this.
  *   **Verdict:** **Decline Fixed Price.** Offer Paid Discovery Sprint.

  ### Case 3: Big Client "Quick" Integration (Political pressure)
  *   **Step 1 (Reference Class):** "Integrations for Big Client."
      *   *Result:* 4 projects found.
  *   **Step 2 (Reality Ratio):** Average overrun is 1.4 (40% over). "Quick" jobs for this client historically balloon due to their compliance review.
  *   **Step 3 (Proven Difference):** Lead says "It's only two weeks."
      *   *Test:* Is there a spec? No, client wants "quick integration."
      *   *Result:* Invalid difference. Must use historical baseline.
  *   **Step 4 (Range):** Historical baseline for "small" integration is 4 weeks. Worst case (compliance block) is 8 weeks.
      *   *Spread:* 100%.
  *   **Step 5 (Decision Gate):** Ratio > 1.3 AND Spread > 50%.
  *   **Analysis:** The procedure explicitly forbids this bid. The "feeling" you have is the data speaking. If you bid 2 weeks fixed, you will work 4 weeks and lose margin. The client's power does not change the math.
  *   **Verdict:** **Escalate to Partner.** (Likely outcome: Decline Fixed, offer T&M).

  ---

  \answer{case1: Bid 13 weeks fixed or decline | case2: Decline fixed-price | case3: Escalate to partner}
