prompt: |-
  I'm designing one session of our department's upper-level course on democratic innovation — I'm a PhD student in political theory and I have the "institutional design" block to myself: 17 students, mostly third-years who have already had the survey in normative theory, one 90-minute meeting, a room with movable chairs, and no budget beyond printing. My allotted topic is selection rules: sortition, term limits, and the standing complaint about career politicians.

  I don't want to run it as a comparison of three reform packages, because that is what the reading does and they will arrive having read it. What I want them to feel is something I have started calling the migration thesis: the claim that any rule which lowers the return to holding office does not lower the assembly's need for institutional knowledge, it only relocates the people who hold that knowledge to actors nobody selected — permanent staff, lobbyists, the civil service, or the members of the cohort before. Relatedly, I want them to notice that "career politician" bundles at least two different complaints that the standard reform menu answers separately: a complaint about who gets filtered in (the selection runs on the desire to hold office, so it selects for a certain kind of person regardless of what they then do) and a complaint about whom the officeholder must answer to in order to keep the job.

  The design I keep sketching and cannot get to work: the same small legislative game played two or three times over a fictional mid-sized regional assembly's budget — a fixed pool, maybe five named line items, coalition-building required — with the selection rule swapped between rounds while everything else is held constant. A few students are drawn at the start and stay for the whole session as a permanent Secretariat: they alone have the full rulebook, they convert any member's idea into votable text, and they set the order of business. They score on how many provisions they drafted survive to a final vote, so their interest is in being needed rather than in any particular outcome. Members get private district cards and score on how close the outcome is to their district's priorities. Round one is ordinary re-electability; round two is a hard two-term limit; round three is selection by lot for a single non-renewable term. Members can claw power back from the Secretariat by spending floor time, which is scarce and which competes with actually passing things. I am also toying with a fourth, hybrid rule — call it cohort pairing: each member chosen by lot is shadowed by a randomly drawn veteran of the immediately preceding cohort, who may speak, brief, and draft but not vote, and whose own prospects after office rise with the pair's record — as a way of testing whether memory can be institutionalized without re-electability. Tell me whether that fourth round belongs in 90 minutes or whether it buries the debrief.

  What I need from you: a runnable activity on these lines or a better one — role sheets and a one-page rulebook I can print, a payoff scheme in points rather than money, a minute-by-minute timeline for one facilitator with no props beyond index cards, a deck of cards, and a timer. The debrief should map specific moments the students will actually have had onto the migration thesis and onto the two complaints I want separated, and it should let them name the diagnosis before I do. Also: what will predictably go wrong the first time I run it and how I recover without breaking character, and which part of the idea the game cannot reach at all and I will simply have to assert afterwards — I assume real sortition's descriptive representativeness and anything depending on days of facilitated deliberation are in that category, but tell me what else.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Instructor:** PhD student in political theory.
      *   **Course:** Upper-level democratic innovation (3rd years, normative theory background).
      *   **Topic:** Selection rules (sortition, term limits, career politicians).
      *   **Core Concept:** "Migration Thesis" (lowering returns to office moves institutional knowledge to unelected actors) + disentangling "career politician" complaints (selection filter vs. accountability mechanism).
      *   **Constraints:** 17 students, 90 minutes, movable chairs, printing only (no budget).
      *   **Proposed Mechanism:** Legislative simulation game (budget allocation) with changing rules across rounds. Permanent "Secretariat" (bureaucrats) vs. Elected/Lottered Members.
      *   **Specific Question:** Does the 4th round (Cohort Pairing) fit?
      *   **Deliverables:** Runnable activity, role sheets, rulebook, point scheme, minute-by-minute timeline, debrief guide, prediction of failure modes/limitations.

  2.  **Evaluate the "Fourth Round" (Cohort Pairing):**
      *   *Time:* 90 minutes is tight for *three* rounds of a legislative simulation + debrief. Adding a fourth mechanical variation risks rushing the most important part: the debrief where the theory lands.
      *   *Complexity:* The "shadow veteran" mechanic adds a layer of social negotiation that might obscure the core "Migration Thesis" (knowledge moving to the Secretariat). It introduces a *different* solution (peer memory) rather than highlighting the problem (bureaucratic capture).
      *   *Decision:* Cut the 4th round as a playable mechanic. Instead, use the *debrief* to propose it as a theoretical solution to the problems they just experienced. This keeps the game focused on the *problem* (Migration) and saves the *solution* for the theoretical discussion.

  3.  **Refine the Game Design:**
      *   *Goal:* Make the "Migration" visible. The Secretariat needs to become indispensable as the Members become more transient/less motivated.
      *   *Roles:*
          *   **The Secretariat (3 students):** Permanent, know the rules, draft the text. Incentive: Get bills passed (any bills).
          *   **The Assembly (14 students):** District representatives. Incentive: Fund their specific district priority.
      *   *Rounds:*
          1.  **Career (Re-election):** Members want to look good for next time. Can invest time in learning rules.
          2.  **Term Limits (Lame Duck):** Members know they are out. Less incentive to learn deep rules, more incentive to grab quick wins. Reliance on Secretariat increases.
          3.  **Sortition (One-off):** Members are random, temporary, no future stake. Maximum reliance on Secretariat.
      *   *Mechanic for "Knowledge":* The "Rulebook" is complex. Only Secretariat has the full version. Members have a summary. To pass a bill, it must be "legally formatted" by the Secretariat.
      *   *Mechanic for "Time":* Strict time limits per round. Floor time is scarce.

  4.  **Develop the Materials:**
      *   *Rulebook:* Needs to be simple enough to play in 90 mins but complex enough to require the Secretariat. Let's make the "Budget Math" the hurdle.
      *   *Payoff:* Points system. Districts get points for funded priorities. Secretariat gets points for volume of legislation passed.
      *   *Timeline:*
          *   Intro/Setup: 10 mins
          *   Round 1 (Career): 15 mins
          *   Round 2 (Term Limits): 15 mins
          *   Round 3 (Sortition): 15 mins
          *   Debrief: 35 mins (Crucial!)
          *   Buffer/Cleanup: 10 mins
      *   *Wait, 3 rounds of 15 mins is 45 mins + 10 setup = 55. That leaves 35 for debrief. That works.*

  5.  **Address the "Migration Thesis" in the Debrief:**
      *   Need to guide them to see *who* actually controlled the agenda.
      *   Need to separate the "Who enters?" (Selection) from "Who controls?" (Accountability/Knowledge).
      *   Questions should lead them to admit the Secretariat gained power in Rounds 2 & 3.

  6.  **Anticipate Failure Modes:**
      *   *Chaos:* Students talk over each other. *Fix:* Strict speaking tokens or Secretariat controls the queue.
      *   *Secretariat Dominance:* They block everything. *Fix:* Their score depends on passage, not content.
      *   *Boredom:* Rounds feel samey. *Fix:* Change the "District Cards" or constraints slightly each round to force new coalitions.
      *   *Time Creep:* Rounds run long. *Fix:* Hard stop timer.
      *   *Theory Disconnect:* They play but don't get the point. *Fix:* Structured debrief questions.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Rulebook:* Keep it to one page. Focus on the "Formatting Tax."
      *   *Roles:* Clear incentives.
      *   *Timeline:* Be precise.
      *   *Limitations:* Acknowledge what the game *can't* do (descriptive representation, deliberation quality).

  8.  **Final Review against Constraints:**
      *   17 students? Yes (3 Secretariat + 14 Assembly).
      *   90 mins? Yes (tight but doable).
      *   Printing only? Yes.
      *   Migration Thesis? Yes, built into the mechanic of "Formatting Tax."
      *   Two Complaints? Yes, addressed in debrief (Selection vs. Accountability).
      *   4th Round? Advised against playing it, suggested as debrief topic.

  9.  **Constructing the Output:** (Organizing into the requested sections: Advice on Round 4, Game Materials, Timeline, Debrief, Failure Modes, Limitations). *Self-Correction during drafting:* Make sure the Secretariat's incentive is aligned with *efficiency*, not policy, so they act like bureaucrats, not politicians. Ensure the "Formatting Tax" is the mechanism of migration.

  10. **Final Polish:** Check tone (collegial, academic, practical). Ensure the "Migration Thesis" is explicitly linked to the game mechanics in the debrief guide. (e.g., "When did you feel you couldn't pass a law without the Secretariat?")

  *(Self-Correction on the 4th Round)*: I need to be firm here. 90 minutes is extremely short for a simulation. 3 rounds is already ambitious. A 4th round will definitely kill the debrief. I will recommend cutting it from gameplay but keeping it as the "theoretical solution" discussed at the end.

  *(Self-Correction on Secretariat Incentive)*: If Secretariat wants bills passed, they might help too much. They need to be the *gatekeepers* of procedure. Their score is "Bills Passed that adhere to Procedure." If members bypass them, the bill is void. This forces reliance.

  *(Refining the "Migration" mechanic)*: The "Rulebook" should change slightly or be "interpreted" by the Secretariat. Actually, simpler: The *Budget Math* is hard. Members have simple cards ("Need 5 points"). Secretariat has the ledger. Members propose, Secretariat calculates feasibility. If Secretariat is slow/uncooperative, nothing passes. In Round 1, Members might learn the math. In Round 3, they won't have time/incentive.

  Let's finalize the plan.cw
answer: |-
  This is a sophisticated pedagogical design challenge. You are trying to simulate a structural dynamic (the migration of expertise) rather than just a policy outcome. Your intuition about the "Migration Thesis" is sound, and the simulation approach is the right way to make it visceral.

  Here is the direct answer to your specific question, followed by the full runnable package.

  ### 1. The Fourth Round (Cohort Pairing)
  **Cut it from the gameplay.**
  In a 90-minute session, three rounds is already aggressive. If you run a fourth mechanical variation, you will sacrifice the debrief. The debrief is where the "Migration Thesis" lands; the game is just the data generation. If you run out of time for the debrief, the session fails.

  **Instead:** Use the "Cohort Pairing" idea as the *theoretical solution* you propose at the very end of the debrief. After they have felt the pain of the Secretariat's power in Round 3, ask them: *"How do we get institutional memory back without re-election?"* When they struggle, introduce your pairing mechanism as a design hypothesis. This makes them crave the solution rather than just testing it mechanically.

  ### 2. The Simulation: "The Budget Game"

  **Core Mechanic:** The "Formatting Tax."
  Legislators have policy ideas (Budget Items). The Secretariat controls the *procedural validity* of those ideas. To pass, a budget item must be "formatted" by the Secretariat. Formatting takes time (negotiation).
  *   **Round 1 (Career):** Members have time to learn the formatting rules themselves.
  *   **Round 2 (Term Limits):** Members rush; they outsource formatting to the Secretariat.
  *   **Round 3 (Sortition):** Members are confused/transient; the Secretariat effectively writes the budget.

  **Class Setup (17 Students):**
  *   **The Secretariat (3 students):** Permanent staff. Sit at a separate table at the front.
  *   **The Assembly (14 students):** District representatives. Sit in a semicircle.
  *   **The Chair (You):** Facilitator/Timer.

  ---

  ### 3. Printable Materials (Text for Handouts)

  #### Handout A: The Secretariat (3 copies)
  **Role:** Permanent Civil Service.
  **Goal:** Maximize **Efficiency Points**. You get 1 point for every Budget Item passed that is *procedurally correct*. You get 0 points if a bill is ruled out of order. You do not care about the content, only that it follows the rules.
  **Powers:**
  1.  **The Ledger:** Only you have the Master Budget Sheet (total funds available).
  2.  **Drafting:** Only you can write the final text of a Budget Item.
  3.  **Queue:** You decide the order in which you process Member requests.
  **Constraint:** You cannot speak on the Assembly floor unless invited by the Chair. You must stay at your table.

  #### Handout B: The Assembly (14 copies)
  **Role:** District Representatives.
  **Goal:** Maximize **District Points**. Look at your **District Card**. Get your specific items funded.
  **Powers:**
  1.  **Propose:** You can propose Budget Items.
  2.  **Vote:** You vote Yes/No on final items.
  **Constraint:** You do not have the Master Budget Sheet. You must ask the Secretariat if your item is affordable. You cannot write final text; you must ask the Secretariat to draft it.

  #### Handout C: District Cards (14 unique cards)
  *Create 14 variations. Keep it simple.*
  **District:** [Number]
  **Priority 1 (5 pts):** Fund Local School
  **Priority 2 (3 pts):** Fix Main Road
  **Priority 3 (1 pt):** Park Cleanup
  **Total Budget Cap:** The Assembly has **50 Credits** total to spend across all districts.
  *Note: Each Priority costs 5 Credits. You must form coalitions to afford multiple items.*

  #### Handout D: The Rulebook (1 page for everyone)
  **The Budget Process:**
  1.  **Proposal:** Member raises hand. Chair recognizes them. Member states item.
  2.  **Formatting:** Member must take proposal to Secretariat Table. Secretariat drafts text. **(This takes 1 minute of real-time negotiation).**
  3.  **Vote:** Chair reads text. Assembly votes. Simple Majority passes.
  4.  **Constraint:** If the Secretariat says a proposal is "Out of Order" or "Unfunded," it cannot be voted on.
  5.  **Time:** Each Round is **12 Minutes** hard stop.

  ---

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Instructor Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Deal** | Assign roles randomly (draw cards). Hand out materials. Secretariat gets 2 mins alone to read their specific advantage. Explain the Point System on the board. |
  | **10-22** | **Round 1: Career** | **Rule:** Members *can* run for re-election next round. <br>**Incentive:** Top 3 scorers get a "Seniority Token" (can speak first in R2). <br>**Observation:** Members will try to learn the rules to secure their future. |
  | **22-24** | **Reset** | Collect Seniority Tokens. Announce Rule Change. |
  | **24-36** | **Round 2: Term Limits** | **Rule:** No one can serve more than 2 rounds total. Everyone is now in their "Last Term." <br>**Incentive:** No future reputation matters. Grab points now. <br>**Observation:** Rushing. Less time to learn rules. More reliance on Secretariat to speed things up. |
  | **36-38** | **Reset** | Shuffle District Cards. Secretariat stays the same. |
  | **38-50** | **Round 3: Sortition** | **Rule:** 5 Members are randomly "Recalled" (must sit out). 5 New Students (from the recalled pool) swap in with new District Cards. <br>**Incentive:** One-off. No future. High confusion. <br>**Observation:** Secretariat becomes the bottleneck and the guide. They effectively set the agenda by who they help first. |
  | **50-55** | **Score Tally** | Calculate points publicly. Ask Secretariat: "How many points did you get?" Ask Assembly: "Who got their Priority 1?" |
  | **55-90** | **The Debrief** | See below. |

  ---

  ### 5. The Debrief Guide (Mapping Experience to Theory)

  Do not lecture immediately. Ask questions that force them to articulate the Migration Thesis.

  **Phase 1: The Empirical Observation (10 mins)**
  *   "Secretariat, in which round did you feel most powerful? Why?" (They should say Round 3).
  *   "Assembly, in which round did you feel most frustrated by the *process* rather than the *politics*?"
  *   "Did the Secretariat's policy preferences change? No. Did their *influence* change? Yes. Why?"
  *   *Target Insight:* As Member tenure/stake dropped, Secretariat power rose.

  **Phase 2: The Migration Thesis (15 mins)**
  *   "I want to introduce a term: **Institutional Knowledge.** In Round 1, where did that knowledge live?" (In the Members).
  *   "In Round 3, where did it go?" (To the Secretariat).
  *   "Did the Assembly *need* less knowledge in Round 3 to pass a budget? Or did they just outsource the need?"
  *   *Theoretical Link:* This is the **Migration Thesis**. Lowering the return to office (no re-election/lot) doesn't eliminate the need for expertise; it migrates that expertise to unelected actors (staff/lobbyists).

  **Phase 3: Disentangling the Complaints (10 mins)**
  *   "We often complain about 'Career Politicians.' In this game, did you see two different problems?"
  *   *Guide them to distinguish:*
      1.  **Selection Filter:** "Who wants this job?" (Round 1 selected for rule-learners/grinders).
      2.  **Accountability Mechanism:** "Who do they listen to?" (Round 1 listened to voters for re-election; Round 3 listened to Secretariat for procedural survival).
  *   "Term limits solved Problem 1 (careerism) but worsened Problem 2 (accountability to staff). Sortition solved Problem 1 but exacerbated Problem 2."

  **Phase 4: The Design Solution (10 mins)**
  *   "If we want the descriptive representation of Sortition but the institutional memory of Careers, what do we do?"
  *   *Pitch your Cohort Pairing idea here.* "What if every Lottered Member was paired with a Term-Limited Veteran who could advise but not vote?"
  *   Ask: "Would that fix the Migration problem, or just create a new class of unelected influencers?"

  ---

  ### 6. Predictable Failure Modes & Recovery

  **1. The Secretariat Bottleneck (Chaos)**
  *   *Risk:* 14 members swarm 3 secretariat members. Nothing gets drafted.
  *   *Recovery:* Enforce the "Queue" power. The Secretariat *must* call members one by one. If the Assembly gets rowdy, pause the timer. "The Clerk recognizes District 4 only." This reinforces the bureaucracy's gatekeeping power.

  **2. Secretariat Collusion (Tyranny)**
  *   *Risk:* Secretariat decides to block everything to prove a point.
  *   *Recovery:* Remind them of their scoring rule. "You get zero points if nothing passes. Your interest is efficiency, not obstruction." If they still block, intervene as Chair: "The Clerk is ruled out of order for obstruction."

  **3. Time Creep**
  *   *Risk:* Rounds run over, debrief gets cut.
  *   *Recovery:* Be brutal with the timer. At 11 minutes, announce "One final bill." At 12 minutes, "Gavel down." Unfinished business dies. This *helps* your thesis (scarcity increases reliance on experts).

  **4. The "Good Bureaucrat" Problem**
  *   *Risk:* Secretariat students are too helpful/nice, making the migration invisible.
  *   *Recovery:* During the Round 3 setup, whisper to the Secretariat: "Your goal is volume. If members are slow, draft the text *for* them based on what you think is feasible." This encourages them to take the pen.

  ---

  ### 7. Limitations: What You Must Assert

  The game cannot simulate everything. Be honest about these gaps in the final 5 minutes.

  1.  **Descriptive Representation:** The game uses random assignment for Sortition, but it doesn't capture the *social* experience of marginalized groups entering a hostile institution. You must assert that real sortition changes the *culture* of the room, not just the rules.
  2.  **Deliberation Quality:** The game rewards speed (points per bill). Real democracy might value slow talk. You must assert that the "Migration of Knowledge" often hides in the *speed* of procedure, not just the text.
  3.  **External Lobbying:** The game isolates the Assembly. In reality, when Members become transient (Round 3), external lobbyists fill the knowledge vacuum even faster than the Secretariat. You need to mention this as an extension of the Migration Thesis.
  4.  **The "Will" to Rule:** The game assumes Members *want* to pass laws. In reality, career politicians might want to *posture* (fail to pass laws to blame opponents). Your game assumes a functionalist bias.

  ### 8. Instructor Cheat Sheet (The "Why")

  *   **Why 3 Rounds?** 1 establishes baseline, 2 removes future incentive, 3 removes experience. It's a stepped regression of member capacity.
  *   **Why Secretariat Scoring?** If they score on policy, they become politicians. If they score on *process volume*, they become bureaucrats. This is crucial for the Migration Thesis.
  *   **Why the Formatting Tax?** This is the proxy for "Institutional Knowledge." It makes expertise a tangible resource that can be hoarded.

  This design keeps the cognitive load low enough for 3rd years to grasp the mechanics quickly, leaving their brainpower available to feel the structural shifts you want them to analyze. Good luck.
