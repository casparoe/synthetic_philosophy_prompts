answer: |-
  **Exam Question**

  **Essay Question (75 Minutes)**

  Consider the standard account of the QWERTY keyboard: it was designed in the late 19th century partly to slow typists down to prevent mechanical jamming, and it persisted long after that design pressure disappeared due to the cost of retraining typists and the installed base of machines. This is the textbook example of path dependence.

  However, a skeptic might argue: "Obviously, a better keyboard layout would have been adopted eventually by the market, so QWERTY isn't really lock-in."

  Write an essay that addresses the following:
  1.  Explain why the claim that QWERTY is path-dependent does *not* logically entail that QWERTY is inefficient. Distinguish the **process claim** (how we got here) from the **evaluative claim** (whether we're here for good reasons).
  2.  Analyze the skeptic's counterfactual claim ("a better layout would have been adopted anyway"). Distinguish between a **strong form** (QWERTY specifically was inevitable) and a **weak form** (only a functionally equivalent layout was inevitable).
  3.  Explain what each form of the counterfactual does to the argument. Does the strong form refute path dependence? Does the weak form refute the claim of *harmful* lock-in? Under what conditions does the skeptic's argument rely on assumptions about market efficiency that path dependence theory challenges?

  ***

  **Model Answer**

  Path dependence is fundamentally a claim about causal process, distinct from a claim about normative outcome. To classify a technology as path-dependent is to assert that its adoption trajectory was sensitive to small, early historical contingencies which, through mechanisms of increasing returns (such as network effects and high switching costs), locked in a specific standard. This definition is logically independent of the claim that the locked-in standard is inefficient. A process can be historically contingent yet result in an optimal outcome by chance. Therefore, establishing QWERTY as path-dependent requires only demonstrating that early mechanical constraints (jamming arms) and subsequent retraining costs drove its dominance. Whether Dvorak is objectively superior is a separate evaluative layer. Conflating the two leads to the error of assuming that if QWERTY is "good enough," it wasn't path-dependent. It was; the mechanism of selection was historical accident amplified by scale, not necessarily fitness.

  The student's objection—"a better layout would have won eventually"—introduces a counterfactual claim that interacts with the path-dependence argument in two distinct ways, depending on the strength of the inevitability asserted. This distinction is crucial for determining whether the objection refutes the theory or merely mitigates the perceived harm.

  First, consider the strong counterfactual: "QWERTY specifically was inevitable." If the exact same layout would have emerged regardless of the 19th-century mechanical constraints, then the historical contingency is illusory. This refutes the path-dependence claim entirely. Path dependence requires that a different initial condition could have led to a different equilibrium. If QWERTY is the only stable equilibrium given human ergonomics and market dynamics, history didn't matter; structural necessity did. However, this is empirically implausible given the existence of alternative layouts like Dvorak that function successfully in niche contexts.

  Second, consider the weak counterfactual: "Some functionally efficient layout was inevitable." This concedes that QWERTY specifically was a contingent accident (process claim holds) but argues the welfare loss is negligible. Here, the market might have locked into Dvorak or another layout instead. Since keyboard layouts are largely functionally equivalent regarding basic typing tasks, the switching costs of the *actual* lock-in (QWERTY) are not necessarily a net social loss compared to the *counterfactual* lock-in (Dvorak). This weakens the case for *harmful* lock-in without refuting the mechanism of lock-in itself. It suggests that while we are stuck with QWERTY, we aren't significantly worse off than if we were stuck with Dvorak.

  However, this weak counterfactual relies on a contentious assumption: that market forces naturally converge on *some* efficient standard eventually. If switching costs are high enough, the initial contingent choice (QWERTY) prevents the superior option from ever gaining the foothold required to trigger increasing returns. Thus, the claim that "better would have won" often smuggles in a belief in market efficiency that path dependence theory explicitly challenges. It assumes the market can overcome the very friction that defines the lock-in.

  Ultimately, the student conflates the genealogy of a standard with its utility. Path dependence explains the genealogy. Inefficiency assesses the utility. The counterfactual "better would have won" either denies the genealogy (strong form) or minimizes the utility gap (weak form). A robust analysis must keep these distinct: QWERTY is path-dependent because history drove the selection; it is potentially inefficient because a superior alternative exists; and the claim that "better would have won" is an empirical bet on market correction that path dependence suggests is unlikely due to the very switching costs that define the lock-in. To argue otherwise is to misunderstand the barrier that increasing returns place before superior technologies.

  ***

  **Marking Scheme (Total: 20 Points)**

  **1. Process vs. Evaluation Distinction (5 Points)**
  *   **5 pts:** Clearly defines path dependence as a causal/historical mechanism (contingency + increasing returns) separate from efficiency/welfare outcomes.
  *   **Common Error:** Students argue QWERTY *must* be inefficient to be path-dependent, or that if it's efficient, it wasn't path-dependent.

  **2. Application to QWERTY Process (5 Points)**
  *   **5 pts:** Correctly identifies QWERTY's specific historical contingencies (jamming/retraining) as the source of lock-in, independent of Dvorak's superiority.
  *   **Common Error:** Students focus exclusively on comparing QWERTY/Dvorak speeds rather than the historical mechanism of adoption.

  **3. Counterfactual Analysis (Strong vs. Weak) (5 Points)**
  *   **5 pts:** Distinguishes the strong form (QWERTY inevitable) from the weak form (some efficient layout inevitable) and notes their different logical impacts.
  *   **Common Error:** Students treat "better would have won" as a single argument without separating exact inevitability from functional equivalence.

  **4. Implications for Lock-in/Harm (5 Points)**
  *   **5 pts:** Explains that the strong form refutes path dependence, while the weak form accepts path dependence but challenges the *harm*. Notes the assumption of market correction is contentious.
  *   **Common Error:** Students claim the weak form refutes path dependence, or fail to notice the skeptic assumes market efficiency.

  ***

  **Self-Critique on Model Answer**

  The most vulnerable point in my reasoning is the treatment of "functional equivalence" in the weak counterfactual. I assert that QWERTY and Dvorak are "largely functionally equivalent regarding basic typing tasks" to support the claim that welfare loss is negligible. A sharp student could press that if Dvorak is *strictly* superior (e.g., reduced repetitive strain injury), then the weak counterfactual does not minimize harm; it merely shifts the locus of inefficiency from "typing speed" to "health outcomes." If the "better" layout prevents injury, the lock-in is harmful regardless of functional equivalence in typing speed. This would require adjusting the marking scheme to reward students who identify that "efficiency" is multidimensional (speed vs. health), potentially undermining the weak counterfactual's ability to shrink the welfare loss.
