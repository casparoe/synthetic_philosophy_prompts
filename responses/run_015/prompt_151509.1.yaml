answer: |-
  You have put your finger on the open secret of legal philosophy: the law does not have a theory of personal identity. It has a **toolkit of conflicting theories** that it deploys instrumentally to achieve specific policy outcomes.

  If you are looking for the "baked-in" metaphysics, you won't find a consistent one. Instead, you will find **Policy-Driven Eclecticism**. The law treats personal identity not as a fact to be discovered, but as a verdict to be rendered based on what social problem is being solved.

  Here is the implicit logic of how the law toggles between these theories, and what happens if you pull the thread of Dennett's "narrative gravity."

  ### 1. The Three Modes of Legal Identity

  To understand the inconsistency, you have to look at what the law is trying to protect in each scenario. It swaps metaphysical hats depending on the goal.

  **A. Advance Directives (The Goal: Autonomy)**
  *   **The Theory:** Psychological/Narrative Continuity.
  *   **The Logic:** Here, the law privileges the *past* self over the *present* self. It assumes that the "person" is the entity that holds values and plans over time. Even if the biological organism remains, if the narrative capacity is gone (dementia), the law insists the "true" person is the one who wrote the directive.
  *   **Why:** To protect individual liberty against the vulnerability of future incapacity. If the law adopted a strict biological view here, the demented patient's current interests (comfort, food) would trump the past self's values (dignity, refusal of tubes), rendering autonomy meaningless.
  *   **Metaphysical Smuggle:** It assumes a "deep self" that exists independently of current cognitive function.

  **B. Criminal Liability (The Goal: Public Safety & Deterrence)**
  *   **The Theory:** Somatic/Biological Continuity (Animalism).
  *   **The Logic:** Here, the law privileges the *body* over the *mind*. In a dissociative fugue, psychological continuity is severed. The defendant may not remember the act or feel connected to it. Yet, the law prosecutes.
  *   **Why:** Retribution and containment. The legal system needs a stable unit to hold responsible. If identity required strict psychological continuity, anyone with memory loss or mood swings could claim they are "not the person who did it." The law treats the human organism as the liable entity, regardless of internal narrative fractures.
  *   **Metaphysical Smuggle:** It assumes the body is the sufficient condition for personhood.

  **C. Civil Damages (The Goal: Compensation)**
  *   **The Theory:** Contradictory Hybrid.
  *   **The Logic:** This is where the contradiction is most glaring. To award "hedonic damages" (loss of enjoyment of life), the court must argue the plaintiff is *not* the same person they were before the injury (their narrative is broken, their capacities gone). But to award the money *to* them, the court must argue they *are* the same person (the legal entity survives to receive the check).
  *   **Why:** To maximize restitution without breaking the administrative system.
  *   **Metaphysical Smuggle:** It treats identity as a dimmer switch rather than an on/off button. You are "same enough" to own property, but "different enough" to be owed compensation for the loss of the old you.

  ### 2. Is it Dennett's "Center of Narrative Gravity"?

  Dennett's view is that the self is a fiction—a useful abstraction we create to make sense of our behavior. The law uses this fiction, but it treats it as **real when convenient and false when necessary.**

  If the legal system actually committed to Dennett's view (that the self is *only* a narrative construct with no metaphysical substrate), the system would collapse in two specific places:

  **1. The Collapse of Retributive Justice**
  If the self is just a narrative center, and a brain injury or fugue state shatters that narrative, the "center of gravity" shifts or dissolves.
  *   **Current Practice:** We punish the body because we smuggle in a metaphysical substrate (the soul or the biological organism) that persists through the break.
  *   **Dennett View:** If the narrative is broken, the "person" who committed the crime no longer exists. Punishing the current body would be like punishing a different character in the same novel.
  *   **Result:** You could no longer justify prison as *punishment*. You could only justify confinement as *quarantine* (like containing a dangerous animal). Blame requires a stable narrator to receive it.

  **2. The Collapse of Advance Directives**
  If the self is a narrative fiction, the demented patient has a *new* narrative.
  *   **Current Practice:** We enforce the old narrative (the directive) over the new one.
  *   **Dennett View:** The "center of gravity" has moved to the demented self. The past self is literally a fictional character that no longer exists. Enforcing the directive would be allowing a dead fiction to tyrannize a living reality.
  *   **Result:** Advance directives would become non-binding suggestions. The current narrative self (the demented patient) would have total sovereignty, even if that means contradicting their past wishes.

  ### 3. What Survives if We Drop the Fiction?

  If you stripped away the narrative fiction and relied solely on **Biological Continuity** (strict Animalism), here is what breaks and what stays:

  **What Survives (The Administrative State):**
  *   **Property Rights & SSNs:** These are tied to the biological organism and tax ID. This works fine. You are your body for the IRS.
  *   **Public Safety:** Quarantine and containment of dangerous individuals work fine. If the body is dangerous, you restrain the body.
  *   **Contract Law (mostly):** Obligations follow the biological entity to ensure market stability.

  **What Fails (The Moral State):**
  *   **Moral Blame:** You cannot blame a biological organism in a moral sense, only condition it. Reformation replaces repentance.
  *   **Autonomy:** The concept of "life plans" vanishes. If there is no narrative thread connecting past and future, "autonomy" is just momentary impulse.
  *   **Damages for "Loss of Self":** This becomes incoherent. If you are just your body, and the body is alive, what was lost? You can compensate for physical pain, but not for the "death of the person inside."

  ### 4. The Journalistic Angle: "Identity is a Verdict, Not a Fact"

  The implicit logic you are looking for is that the law is not trying to solve the Ship of Theseus paradox; it is trying to keep the ship sailing.

  *   When the law needs to protect **Liberty**, it acts like a **Lockean** (identity is memory/psychology).
  *   When the law needs to ensure **Order**, it acts like an **Animalist** (identity is the biological organism).
  *   When the law needs to distribute **Money**, it acts like a **Pragmatist** (identity is whatever maximizes compensation).

  **The Story Hook:**
  The tension isn't a bug; it's a feature. The legal system relies on the *ambiguity* of personal identity. If courts were forced to pick one metaphysical theory, half of their docket would become unadjudicable.

  If you press judges on this, they will likely retreat to **Functionalism**: A person is whatever unit the law needs to address to resolve the dispute.
  *   In criminal court, the "person" is the unit of danger.
  *   In probate court, the "person" is the unit of values.
  *   In tort court, the "person" is the unit of suffering.

  **Conclusion for your piece:**
  The law doesn't believe in a metaphysical substrate, but it cannot function without pretending to. It smuggles in a "soul" when it needs to punish, and discards it when it needs to compensate. If we fully adopted the "center of narrative gravity" view, we would have to abolish retributive justice and the binding power of the past over the future. We would be left with a system of biological management, not moral agency. The law refuses to make that trade, so it lives in the contradiction.
