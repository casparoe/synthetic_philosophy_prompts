      *   *Quantity Theory of Money:* In the long run, increasing the money supply just raises prices (inflation). It's neutral in the long run.
      *   *Short-Run Non-Neutrality:* In the short run, increasing money supply *does* stimulate industry because prices don't adjust instantly. This creates a "wake-up" effect for labor.
      *   *Circulation/Velocity:* Money must move. Hoarding is bad. The speed of circulation matters more than the pile size.
      *   *State Role:* The state guarantees the convention (stamp, authority), giving money credibility.

  3.  **Map to Modern Issues:**

      *   **CBDCs (Central Bank Digital Currencies):**
          *   *Humean View:* CBDCs are the ultimate state convention. They reinforce the idea that money is a public utility/tool.
          *   *Implication:* If the state controls the ledger, they control the *velocity* (potentially via programmable money/expiry). This aligns with Hume's desire to prevent hoarding and ensure circulation.
          *   *Risk:* If the state loses trust, the convention collapses (hyperinflation), proving Hume right that the *stuff* doesn't matter, the *trust* does.

      *   **Money Neutrality & Velocity:**
          *   *Humean View:* Printing cash isn't neutral *if* it changes behavior (velocity). If velocity is flat, printing is just inflationary.
          *   *Modern Context:* Quantitative Easing (QE). Banks held reserves (hoarded). Velocity dropped. Hume would say this failed to stimulate industry because the "oil" didn't reach the "gears" (labor/commodities).
          *   *Implication:* Policy shouldn't target stock (M2), but turnover (velocity).

      *   **Crypto (Bitcoin, etc.):**
