          *   *Store of Value vs. Medium of Exchange:* Hume argues you can't easily be both if the supply is fixed (deflationary). If everyone hoards (store of value), circulation stops (medium of exchange fails).
          *   *Crack in the Framework:* Hume assumed physical scarcity (gold/silver). Crypto has digital scarcity. Does the "labor theory" apply to mining? Yes, but is it *useful* labor? Hume might see PoW as wasteful if it doesn't facilitate trade.

  4.  **Drafting the Argument (Iterative Process):**

