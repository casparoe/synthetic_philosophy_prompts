answer: |-
  1. **Question:** You've made it clear that the standard QWERTY and VHS narratives are exhausted and often misleading. If we strip those away, what is the single best-documented historical episode you know of that satisfies all three parts of your definition—the contingent early event, the amplifying feedback, and the absence of a functional equivalent—and why does it survive the scrutiny that the war stories do not?

     **Note on Reply:** She will likely cite a specific institutional development (e.g., a legal doctrine or a specific technical standard in energy or rail) where archival evidence shows a deliberate choice among equals followed by documented increasing returns.

     **Follow-up:** If the archival record shows the agents *believed* one option was superior at the time, even if hindsight says they were equal, does that belief itself break the contingency condition, or does your test require us to judge suitability only by outcomes we can verify now?

  2. **Question:** Your first condition requires that the early event be no better suited to producing the outcome than its rivals. In practice, how do you distinguish between an event that was genuinely neutral among rivals and one that was merely *locally* optimal given constraints that were themselves the product of prior path dependence?

     **Note on Reply:** She will argue that we must fix the background constraints at the moment of the choice; if the constraints are inherited, that's a prior path, but the current choice must be evaluated against the live options available *then*.

     **Follow-up:** But if every live option is shaped by prior paths, doesn't that push the moment of genuine contingency back until it disappears entirely, leaving you with either infinite regress or a claim that nothing is ever truly contingent?

  3. **Question:** Let's talk about the amplification mechanism. You list learning effects, coordination effects, and adaptive expectations. In a specific case, do you need to identify which of these is operating to confirm lock-in, or is the presence of *any* positive feedback loop sufficient provided the outcome stabilizes?

     **Note on Reply:** She will say the specific mechanism matters for explaining *how* it locked in, but for the claim of lock-in itself, the existence of increasing returns to adoption is the necessary condition.

     **Follow-up:** If the mechanism is observable but weak, and the outcome is stable, do you attribute that stability to path dependence, or must the feedback loop be strong enough to have theoretically overcome a superior rival had one emerged?

  4. **Question:** Your second condition is the erasability test: if you delete the early event but leave the mechanism, the outcome changes. Conceptually, this distinguishes path dependence from simple determinism. But does this test require that the alternative outcome be *stable* in its own right, or just that it be different?

     **Note on Reply:** She will insist the alternative must be stable; otherwise, the system just drifts back to the original outcome, proving the original was determined by structural forces, not the early event.

     **Follow-up:** How do you verify the stability of a path not taken without simply assuming that the mechanisms favoring the actual path would have favored the counterfactual path equally well?

  5. **Question:** I want to press on the evidence for that counterfactual. For any actual episode, we possess only the sequence that occurred; the counterfactual where the early event is removed is not something anyone can observe. What could count as evidence for or against a lock-in claim if the tape cannot be run twice?

     **Note on Reply:** She will appeal to cross-case comparisons where similar mechanisms operated with different initial orderings, or to structural models where the mechanism's parameters are observable independently of the outcome.

     **Follow-up:** If you rely on cross-case comparisons, aren't you assuming the mechanisms are identical across cases? And if you rely on models, aren't you just testing the model's assumptions rather than the historical claim itself?

  6. **Question:** Moving to your third condition: the absence of a functional equivalent. You argue that something equivalent often would not have arrived anyway. But equivalence is relative to a purpose. Who determines the purpose—the agents at the time, the historian looking back, or the functional requirements of the system itself?

     **Note on Reply:** She will argue it is fixed by the alternatives actually available to the agents at the time, or by what those agents had reason to care about given their local knowledge.

     **Follow-up:** If the grain is fixed by what agents cared about, doesn't that allow you to shift the description until you find contingency? You could describe the outcome finely to show contingency, or coarsely to show inevitability; what prevents you from choosing the grain that guarantees your verdict?

  7. **Question:** Let's stay on that grain. The same episode looks contingent when described finely—this firm's format prevails—and inevitable when described coarsely—some shared format prevails. What fixes the correct grain of description for testing path dependence, other than the intuition that one grain yields the result you want?

     **Note on Reply:** She will say the correct grain is fixed by the consequences that mattered to the people who had to live inside the arrangement; if they experienced the difference, the fine grain is the right one.

     **Follow-up:** But people often adapt their preferences to the available arrangements. If they stop caring about the difference because they can't change it, does that make the grain coarse enough to erase the path dependence, or does that adaptation just prove the lock-in is complete?

  8. **Question:** Consider the selection objection. Competitive pressures, deliberate standard-setting, and the ability of agents to see an incumbent's defects are all mechanisms for displacing inferior arrangements. Given these forces, why should lock-in be common enough to be a general explanatory tool rather than a rare anomaly?

     **Note on Reply:** She will reply that switching costs are themselves products of the arrangement that got locked in; the very mechanisms that look like selection pressures are often disabled by the prior accumulation of complementary investments.

     **Follow-up:** If every failure to switch is explained by switching costs generated by the lock-in, and every successful switch is explained by weak lock-in, isn't the theory insulated from ever being wrong about whether lock-in exists?

  9. **Question:** To tighten that point: if the switching costs are endogenous to the arrangement, how do you distinguish between a case where an inferior arrangement persists because of lock-in, and a case where it persists because it is actually superior once you account for the costs of changing it?

     **Note on Reply:** She will argue that superiority must be judged against the feasible alternatives at the time of the switch, not against a frictionless ideal; if the costs make the switch net-negative, the arrangement isn't inferior in the relevant sense.

     **Follow-up:** But if "inferior" just means "not worth the cost of changing," and the cost of changing is high because of the history, haven't you defined inefficiency in a way that makes it impossible to detect after the fact?

  10. **Question:** I want to apply your test to a specific case. In 1908 a provincial government sets up a land registry and must decide whether to index it by parcel or by owner; the clerk who opens the office indexes by parcel, because that is how the office's one filing cabinet happens to be labelled. A neighbouring province opens a registry the same year and indexes by owner for an equally incidental reason. For twenty years both registers are equally accurate and equally cheap to keep up. Then the parcel-indexed province develops a dense market in mortgage lending and title insurance, because lenders can aggregate and compare parcels; the owner-indexed province does not, and by 1940 it cannot convert, since re-indexing would interrupt every pending transaction. But the owner-indexed province has markedly fewer contested inheritances, because family claims run through persons rather than through plots. Is this a case of lock-in on your test?

      **Note on Reply:** She will demand a specification of whether the divergence in lending markets was foreseeable in 1908, or whether her account requires the retained arrangement to be worse than the discarded one in aggregate welfare terms.

      **Follow-up:** Why is *that* specification the one that settles the matter? If the outcome mattered to the lenders but not the inheritors, or vice versa, whose perspective fixes the grain of the outcome for your erasability test?

  11. **Question:** Let's assume lock-in is real and we generally cannot tell in advance which of several rival arrangements is better. What follows normatively—greater willingness to intervene in early standard-setting, greater willingness to break up incumbents, or simply greater humility about our ability to plan?

      **Note on Reply:** She will likely argue for humility regarding prediction but greater vigilance in preserving flexibility early on, avoiding premature commitment to a single standard before the landscape is clear.

      **Follow-up:** There is a tension here: your descriptive claim is that which arrangement wins is in a sense arbitrary, but any prescriptive claim implies we should have chosen differently. If the choice was arbitrary, on what grounds do you criticize the outcome, unless you are smuggling in a welfare standard you claimed was unavailable?

  12. **Question:** I'll close with this. Your theory relies on distinguishing path dependence from deterministic causation. Give me one concrete empirical finding—something we could go out and look for in the archives or data—that would force you to abandon the claim that a specific episode was path dependent rather than determined.

      **Note on Reply:** She will say finding evidence that the early event was not contingent (e.g., structural forces made it inevitable) or that the outcome would have occurred regardless of the early event (failed erasability test) would falsify the claim.

      **Follow-up:** If you find that the outcome would have occurred regardless, do you then conclude there was no path dependence, or simply that the path was overdetermined? And if the latter, hasn't the concept lost its power to explain why *this* specific path was taken?
