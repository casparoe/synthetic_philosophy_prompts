answer: |-
  Here is a specification of the desiderata for a decision theory capable of navigating the "Newcomb-like" landscape (CFM, XOR, etc.), followed by the critical tensions and a brief evaluation of the major contenders.

  ### I. The Test Suite (Cases to Get Right)

  A viable theory must yield the following verdicts. These are not arbitrary; they represent the consensus of "winning" (maximizing ex-ante expected utility) in the literature surrounding FDT/UDT.

  1.  **Newcomb's Problem:**
      *   **Scenario:** Omega predicts your choice. Box A (transparent, \$1k) and Box B (opaque, \$1M if predicted 1-box, \$0 if 2-box).
      *   **Verdict:** **One-Box.**
      *   **Reason:** Taking only Box B correlates with \$1M. Taking both correlates with \$1k. The theory must recognize that your decision *is* the prediction (logically), not just an effect of it.

  2.  **Counterfactual Mugging (CFM):**
      *   **Scenario:** Omega flips a fair coin. If Heads, he gives you \$10k *if* he predicted you would give him \$100 if Tails. If Tails, he asks for \$100. You see Tails.
      *   **Verdict:** **Pay the \$100.**
      *   **Reason:** Refusing saves \$100 now but ensures you get \$0 in the counterfactual Heads world. Paying sacrifices \$100 ex-post to secure the \$10k ex-ante. The theory must prioritize *ex-ante* policy optimality over *ex-post* act optimality.

  3.  **XOR Blackmail:**
      *   **Scenario:** A disaster (D) occurs with 50% probability. Omega sends a letter (L) iff (You Pay $\oplus$ D). You receive L. Paying costs \$100; Disaster costs \$1000.
      *   **Verdict:** **Do Not Pay.**
      *   **Reason:** Unlike CFM, your action here does not control the disaster, only the correlation. Paying makes it *evidentially* likely that ~D (since L + Pay $\rightarrow$ ~D), but it does not *cause* ~D. The theory must distinguish between buying good news (XOR) and buying counterfactual rewards (CFM).

  4.  **Precommitment / Binding Variants:**
      *   **Scenario:** In CFM, you are offered the chance to sign a binding contract to pay *before* the coin flip.
      *   **Verdict:** **Sign the contract.**
      *   **Reason:** If the theory says "Sign" ex-ante but "Don't Pay" ex-post (without the contract), it is dynamically inconsistent. The theory should recommend acting *as if* bound even when binding is impossible (Updatelessness).

  ### II. Conceptual Distinctions (What Must Not Collapse)

  The theory must maintain specific conceptual boundaries to avoid absurdity.

  1.  **Ex-Ante Optimality vs. Ex-Post Rationality:**
      *   **Requirement:** The theory must allow that the rational action *now* (given current evidence) may be one that you would have preferred to precommit to *not* doing, if that precommitment yields higher expected value overall.
      *   **Why:** In CFM, paying is ex-post irrational (the coin is already Tails; paying does nothing). But it is ex-ante optimal. Collapsing these leads to CDT (which fails CFM).

  2.  **Dominated vs. Exploitable:**
      *   **Requirement:** The theory must distinguish between a strategy that is *dominated* (worse in every specific state of the world) and one that is *exploitable* (vulnerable to a Dutch Book / money pump).
      *   **Why:** In Newcomb, 1-boxing is dominated by 2-boxing (given the boxes are already filled), but 2-boxing is "exploitable" by Omega (you get less money). A winning theory must accept dominated strategies if they maximize expected utility.

  3.  **Causal Control vs. Logical Correlation:**
      *   **Requirement:** The theory must distinguish between influencing a physical outcome via cause-and-effect (CDT's domain) and influencing an outcome via logical necessity or prediction (FDT's domain).
      *   **Why:** This is the crux of XOR Blackmail vs. CFM. In CFM, your algorithm determines the counterfactual reward. In XOR, your algorithm determines the letter, but the disaster is independent. Collapsing these leads to paying in XOR (buying news).

  ### III. Hard Constraints (Results Not to Contradict)

  1.  **Dynamic Consistency (Time Consistency):**
      *   **Constraint:** You should not regret your past self's policy, and your future self should not deviate from your current plan without new *relevant* information.
      *   **Why:** If you plan to 1-box in Newcomb but 2-box when standing before the boxes, you are incoherent.

  2.  **No Dutch Books:**
      *   **Constraint:** The theory must not permit a cycle of decisions that guarantees a loss regardless of the state of the world.
      *   **Why:** This is the baseline for rationality. (Note: CDT is vulnerable to Dutch Books in Newcomb-like scenarios involving bets on predictions).

  3.  **Non-Self-Defeating:**
      *   **Constraint:** The theory should not recommend a policy that, if known to be used by the agent, results in a worse outcome than if a different policy were known to be used.
      *   **Why:** In CFM, if Omega knows you use CDT, you get \$0. If Omega knows you use UDT, you get an expected \$4,950. CDT is self-defeating.

  ### IV. The Tensions (Flagged Incompatibilities)

  This is the critical section. You cannot satisfy all intuitive desiderata simultaneously. You must choose which bullet to bite.

  **Tension 1: The Dominance Principle vs. Ex-Ante Optimality**
  *   **The Conflict:** The Dominance Principle states: "If Act A is better than Act B in every possible state of the world, choose A." Ex-Ante Optimality states: "Choose the policy that maximizes expected value before the state is known."
  *   **The Clash:** In Newcomb's Problem, 2-Boxing *dominates* 1-Boxing (you get \$1k more regardless of what's in Box B). However, 1-Boxing is *Ex-Ante Optimal* (you get \$1M vs \$1k).
  *   **The Trade-off:** You cannot satisfy Dominance and Ex-Ante Optimality in prediction scenarios.
      *   *CDT* keeps Dominance, loses Money.
      *   *FDT/UDT* keep Ex-Ante Optimality, violate Dominance.
  *   **Verdict:** To solve CFM/Newcomb, you **must violate the Dominance Principle.**

  **Tension 2: Bayesian Conditioning vs. Updatelessness**
  *   **The Conflict:** Standard Bayesianism says: "Condition on all available evidence." Updatelessness says: "Ignore evidence that you knew you would receive when evaluating your policy."
  *   **The Clash:** In CFM, once you see "Tails," Bayesian conditioning tells you the Heads-world is impossible. Therefore, paying \$100 has 0% chance of reward. Updatelessness tells you to ignore that you see "Tails" and evaluate the policy "Pay if Tails" from behind the veil of ignorance.
  *   **The Trade-off:** You cannot be a standard Bayesian updater and solve Counterfactual Mugging.
      *   *CDT/EDT* are Updaters. They fail CFM.
      *   *UDT/FDT* are Updateless. They solve CFM but require a non-standard probability framework (logical priors over policies rather than posteriors over states).
  *   **Verdict:** To solve CFM, you **must violate standard Bayesian Conditioning.**

  **Tension 3: Non-Exploitability vs. Sunk Cost Sensitivity**
  *   **The Conflict:** Intuitively, you should not throw good money after bad (Sunk Cost). However, refusing to pay in CFM makes you vulnerable to Omega's "exploitation" (you lose the counterfactual gain).
  *   **The Clash:** Paying in CFM *looks* like a sunk cost fallacy (paying for a past coin flip). Not paying *looks* like rational loss-minimization but leads to global exploitability (Omega never rewards you).
  *   **The Trade-off:** You must accept actions that *look* like sunk cost fallacies ex-post to avoid being a type of agent that is systematically excluded from rewards.
  *   **Verdict:** You must prioritize **Global Non-Exploitability** over **Local Sunk Cost Intuition.**

  ### V. Evaluation of Contenders

  | Desideratum | **CDT** (Causal DT) | **EDT** (Evidential DT) | **UDT/FDT** (Updateless/Functional) |
  | :--- | :--- | :--- | :--- |
  | **Newcomb** | **Fail** (2-Boxes, gets \$1k) | **Pass** (1-Boxes, gets \$1M) | **Pass** (1-Boxes, gets \$1M) |
  | **Counterfactual Mugging** | **Fail** (Don't Pay, loses \$10k exp. val) | **Fail** (Don't Pay, updates on Tails) | **Pass** (Pays, honors policy) |
  | **XOR Blackmail** | **Pass** (Don't Pay) | **Fail** (Pays, buys good news) | **Pass** (Don't Pay, distinguishes control) |
  | **Dominance Principle** | **Satisfies** | **Violates** | **Violates** |
  | **Bayesian Updating** | **Satisfies** | **Satisfies** | **Violates** (Updateless) |
  | **Computational Clarity** | **High** (Clear causal graphs) | **High** (Clear conditional probs) | **Low** (Requires logical counterfactuals) |

  **Summary of Performance:**

  *   **CDT:** The baseline. It respects causal dominance and Bayesian updating but fails every "Newcomb-like" problem (Newcomb, CFM, Parfit's Hitchhiker). It leaves money on the table because it refuses to acknowledge logical correlations as decision-relevant.
  *   **EDT:** Improves on Newcomb but fails XOR Blackmail (it pays because paying is *evidence* of safety) and fails CFM (it updates on the coin flip). It collapses correlation with causation too aggressively.
  *   **UDT/FDT:** The only contenders that pass the full Test Suite (Newcomb, CFM, XOR). They achieve this by **biting the bullets** flagged in the Tensions section: they explicitly reject standard Bayesian updating (in favor of updatelessness) and the Dominance Principle.
      *   *The Catch:* FDT/UDT lack a rigorous, agreed-upon mathematical formalism for "logical counterfactuals." We know *what* they should output, but the computation of "what would happen if my algorithm outputted B instead of A" is not well-defined in standard logic (due to the principle of explosion).

  **Final Recommendation:** If your goal is to maximize utility in a universe containing predictors (simulations, AI, smart contracts), you need **Updatelessness (UDT/FDT)**. However, you must accept that this requires abandoning the intuition that "you should only act on what you know is physically possible now" (Bayesian Conditioning) and "you should never choose a dominated act" (Dominance Principle).
