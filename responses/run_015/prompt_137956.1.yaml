answer: |-
  The practice of estimating and reporting heritability presupposes a specific, often unstated, theory of causation: **Causation as Variance Attribution in a Status Quo Context.**

  ### 1. The Implicit Theory of Causation

  Heritability ($h^2$) does not measure the strength of a mechanism in an individual (e.g., "how much did genes build this brain?"). It measures the proportion of *observed differences* in a specific population at a specific time that correlate with genetic differences.

  This entails three specific causal commitments:

  1.  **Variance over Mechanism:** Importance is measured by *variation accounted for*, not by *potential impact*. A cause can be biologically fundamental (e.g., oxygen for breathing) but have zero heritability if everyone has equal access to it. Conversely, a trivial biological pathway can have high heritability if it is the primary source of current variation.
  2.  **Contextual Relativity:** Causal attribution is not intrinsic to the trait but relative to the environment. If environmental variance ($V_E$) is minimized (e.g., everyone gets perfect nutrition), heritability rises, even if the biological mechanism remains unchanged. If genetic variance ($V_G$) is minimized (e.g., clones), heritability falls to zero.
  3.  **Additivity and Independence:** Classical estimation assumes G and E are independent sources of variance ($V_P = V_G + V_E$). It struggles with interaction (G$\times$E) where the genetic effect *depends* on the environment.

  **Does it presuppose "Genetic" contrasts with "Changeable"?**
  No. The definition does not presuppose this. A trait can be 100% heritable (e.g., having five fingers, assuming no environmental variance in limb loss) and 100% changeable (surgery). However, the *reporting* often invites this confusion because high $h^2$ implies that *current* environmental variations are not driving *current* trait variations. It conflates "hard to change via *current* environmental levers" with "hard to change *in principle*."

  ---

  ### 2. Testing the Cases

  #### Case (i): High Heritability, Treatable Parasite
  *Scenario:* $h^2 = 0.9$. 2% of children have a parasite causing -3 SD. Treatment restores T.
  *Question:* Does this license "fixed, so don't bother intervening"?

  **No.** This case exposes the blindness of heritability to **low-prevalence, high-impact environmental causes**.
  *   **Why $h^2$ is high:** Heritability is a ratio of variances. If the parasite affects only 2% of the population, its contribution to the *total population variance* ($V_E$) might be small compared to the widespread genetic variation ($V_G$) among the other 98%. The statistic aggregates; it is dominated by the majority distribution.
  *   **Why intervention works:** Intervention targets the *mechanism*, not the variance ratio. Removing the parasite changes the phenotype for those individuals drastically, regardless of what the rest of the population is doing.
  *   **Causal Lesson:** Heritability measures the *status quo* sources of difference. It cannot predict the effect of introducing a *new* environmental variable (treatment) that was previously absent or rare. High $h^2$ indicates that *existing* environmental differences aren't doing much work, not that *new* environmental interventions can't work.

  #### Case (ii): Zero Within-Group Heritability, Genetic Between-Group Gap
  *Scenario:* Within Pop A and Pop B, $h^2 = 0$ (no genetic variation). Between A and B, means differ due to genetic differences.
  *Question:* Does this license "the gap is environmental"?

  **No.** This case exposes the **ecological fallacy** regarding group differences.
  *   **Why $h^2$ is zero:** Within each population, everyone has the same genotype. Therefore, $V_G = 0$. All *within-group* variation must be environmental.
  *   **Why the gap is genetic:** The *mean difference* between groups is caused by the fixed genetic difference between the populations ($g_1$ vs $g_2$).
  *   **Causal Lesson:** Within-group variance components tell you **nothing** about between-group mean differences. You can have 0% heritability within groups and 100% of the group difference being genetic. Inferring the cause of a group gap from within-group heritability is mathematically invalid.

  ---

  ### 3. Evaluation of the Three Uses

  Here is how heritability estimation relates to the three common uses:

  | Use | Relationship to Heritability Estimation | Reasoning |
  | :--- | :--- | :--- |
  | **1. Breeding (Selection Response)** | **Strictly Committed** | This is the mathematical definition of narrow-sense heritability. The Breeder's Equation ($R = h^2 S$) predicts how the *mean* shifts when you select based on *variance*. It works because selection changes gene frequencies ($V_G$) over generations. |
  | **2. Policy (Immutability)** | **Technically Ruled Out** (but culturally sits well) | As Case (i) shows, high $h^2$ does not imply immutability. It implies that *current* environmental variance is low. However, it "sits well" rhetorically because if $V_E$ is low, standard interventions (which rely on environmental variation) have historically failed to reduce inequality. |
  | **3. Group Differences (Gap Explanation)** | **Strictly Ruled Out** | As Case (ii) shows, within-group variance statistics are mathematically independent of between-group mean differences. Using $h^2$ to explain group gaps is a category error (confusing variance with means, and within-group structure with between-group structure). |

  ---

  ### 4. Required Changes to Support the Contested Uses

  To make heritability estimation support Policy (Use 2) and Group Difference (Use 3) claims without logical error, the definition, estimation, and reporting would need fundamental restructuring.

  **To Support Policy Claims (Modifiability):**
  *   **Change:** Shift from **Variance Attribution** to **Intervention Responsiveness**.
  *   **Method:** Instead of twin studies, report "Reaction Norms." Estimate the trait's sensitivity to specific environmental manipulations (e.g., "Effect of +1 hour tutoring on T").
  *   **Reporting:** Report $h^2$ alongside a **Modifiability Index**. A trait could be "High $h^2$, High Modifiability" (e.g., PKU: genetic cause, but diet fixes it).
  *   **Why:** This decouples "source of current difference" from "potential for future change."

  **To Support Group Difference Claims:**
  *   **Change:** Shift from **Within-Group Inference** to **Direct Between-Group Decomposition**.
  *   **Method:** You cannot infer between-group causes from within-group stats. You would need to model "Group" as a fixed effect and estimate the variance attributable to Group Genetics vs. Group Environment directly (e.g., via adoption studies across groups or genomic structural equation modeling).
  *   **Reporting:** Explicitly state: "Within-group heritability is not a proxy for between-group etiology."
  *   **Why:** This acknowledges that group differences may arise from factors (fixed genetic differences, systemic environmental differences) that do not vary *within* the groups and are therefore invisible to standard $h^2$ estimation.

  ### Summary
  The practice of heritability estimation presupposes an **ANOVA-style theory of causation**, where causes are valued by their contribution to *existing variance* in a *specific context*. It does not commit us to genetic determinism (Use 2) or group genetic essentialism (Use 3). It strictly commits us only to predicting selection response (Use 1). The other uses persist because the statistic is often mistaken for a measure of *mechanism* or *destiny* rather than a measure of *population variance structure*. Correcting this requires reporting not just how much genes matter now, but how much the trait *could* move if the environment changed.
