      *   *Even Better:* **Control Theory / Cybernetics.** The thermostat.
      *   *Let's go with the "Constraint" argument.* Causation isn't just pushing; it's channeling.

  7.  **Drafting the Response:**
      *   *Tone:* Respectful, peer-to-peer (acknowledge the chemistry background), rigorous, avoiding jargon where possible but precise where needed.
      *   *Structure:*
          1.  Acknowledge the depth of the question.
          2.  Audit Ray's Analogy (Hardware/Software). Map it. Break it. Show the imports.
