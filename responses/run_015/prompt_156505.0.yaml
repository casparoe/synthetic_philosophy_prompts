answer: |-
  Here are the eight branch questions for your session. Please read them in order, but do not answer them yet. Once you have read all eight, scroll down to the section marked Leaf Positions to find where your answers land you.

  Question 1: The Graffiti Case. You find the word spray-painted on a wall overnight where no one is present to be targeted and no speaker is inferred. Is the word offensive here purely in virtue of being visible, or only because you imagine a hypothetical speaker who meant harm?

  Question 2: The Actor Case. An actor plays a bigot onstage and uses the word sincerely within the fiction. Is the audience offended by the word itself being spoken in the theater, or only by the character's attitudes being portrayed?

  Question 3: The Journalist Case. An out-group journalist quotes what someone shouted in a courtroom transcript to report the facts. Have they used the word in the same sense as the shouter, or have they merely mentioned it to avoid endorsing it?

  Question 4: The In-Group Case. Two members of group G use the word warmly among themselves. Does the word mean the same thing as when an outsider uses it hatefully, or has it become a different word entirely?

  Question 5: The Habitual Use Case. A speaker uses the word sincerely out of pure habit but holds none of the associated negative attitudes. Is the word still derogatory in their mouth, or does the lack of attitude neutralize it?

  Question 6: The Non-Target Case. A speaker uses the word against someone who is not in group G at all, perhaps due to mistaken identity. Does the slur still function as a slur, or does it misfire because the target is wrong?

  Question 7: The Denial Case. A campaigner says X is not S, where S is the slur. Are they denying that the slur applies to X, or are they denying that the word S should be used of anyone at all?

  Question 8: The Reclamation Stranger Case. Someone who grew up in a city where the word got reclaimed in the nineties uses it affectionately to a stranger from somewhere it never was. Is this one word used two ways, or two lexical entries that happen to sound the same?

  Leaf Positions

  You will land on one of the following positions based on your answers above. Find the path that matches your responses.

  Leaf A: Prohibitionism. Path: Yes to Question 1. Description: The offense is not content at all but a standing prohibition on the word. Awkwardness: Struggles to explain why some contexts like the stage mitigate offense if the word itself is banned.

  Leaf B: Unnamed Historical Prohibition. Path: Yes to Question 1 and Yes to Question 5. Description: The word is banned due to history regardless of current attitude. Status: Merely unexplored, as it cannot explain new slurs without history.

  Leaf C: Pure Pragmatics. Path: No to Question 1 and No to Question 2. Description: The offense is a purely pragmatic or perlocutionary matter of causing offense. Awkwardness: Struggles to explain why the word itself is banned while neutral synonyms with the same meaning are not.

  Leaf D: Unnamed Target Pragmatics. Path: No to Question 1, No to Question 2, and No to Question 6. Description: The slur only works if the target is actually in the group. Status: Just unattractive, as it implies slurring non-members is impossible rather than just mistaken.

  Leaf E: Hybrid Expressive View. Path: No to Question 1, Yes to Question 2, and Yes to Question 3. Description: The derogation rides on a separate expressive dimension alongside truth-conditional content. Awkwardness: Requires complex semantic machinery the philosophy MA student hates.

  Leaf F: Semanticism. Path: No to Question 1, Yes to Question 2, and No to Question 3. Description: The derogatory content is part of what is said and affects truth conditions. Awkwardness: Makes reports of slurs by journalists false or problematic since they don't endorse the content.

  Leaf G: Unnamed Attitude Semanticism. Path: No to Question 1, Yes to Question 2, No to Question 3, and Yes to Question 5. Description: Truth conditions depend on the speaker's hidden mental attitudes. Status: Incoherent, as public meaning cannot rely on private states.

  Leaf H: Contextualist Lexicalism. Path: Yes to Question 4 and Yes to Question 8. Description: Reclamation creates a genuinely different lexical entry. Awkwardness: Posits homonyms everywhere, bloating the lexicon unnecessarily.

  Leaf I: Unnamed Mention-Use Collapse. Path: No to Question 3 and Yes to Question 7. Description: Denying the slur applies is the same as banning the word. Status: Incoherent, denies distinction between quoting and using.

  Leaf J: Presuppositionalism. Path: No to Question 1, Yes to Question 2, No to Question 3, No to Question 5, and Yes to Question 7. Description: The slur presupposes the group is inferior rather than asserting it. Awkwardness: Hard to explain cancellation in in-group use without changing the presupposition.

  Note on Collapsed Views: If you landed on Leaf E or Leaf F, be aware these two named views collapse at every node you have got unless you test embedding in conditionals. To pry them apart you would need an extra case like If S is a slur then I am rich to see if the derogation projects.

  The Single Question for the Board: Question 1 does the most sorting work. If you say the graffiti is offensive without a speaker, you are forced into prohibitionism; if you say it needs a speaker, you are forced into content or pragmatic views. This splits the room immediately between those who think the word is toxic in itself and those who think the toxicity comes from how it is used.
