prompt: |-
  I'm a third-year philosophy student running a discussion section for first-year interdisciplinary seminar students who have never taken social ontology. I need a teaching plan—not the explanation itself—for leading a fifty-minute session on collective intentionality and joint action. The students arrive thinking that "doing something together" just means individual people aligning their private goals, so the opening move needs to make the conceptual problem visible before any technical vocabulary appears. I want the plan structured around dependency: which idea has to be in place before the distinction between a shared we-intention and a bundle of coordinated I-intentions can even make sense, and in what order the pieces should unfold. For the carrying example, I want a single concrete scenario that involves clear role differentiation but no central director, and—crucially—one in which each participant genuinely lacks an individual mental representation of the complete end state, so that if each were operating only with an I-intention the activity would necessarily fail; it should not be the standard "walking together" case. I also need the misconception map: I'm expecting they will conflate collective intentionality with group consciousness, then with strategic cooperation, and possibly with mere behavioral synchronization—tell me exactly where in the sequence each should be intercepted and defused. Include one diagnostic question I can ask at the end that distinguishes whether they've understood the irreducibility claim from whether they've just memorized a definition. Finally, specify what parts of the wider debate—say, joint commitment, plural subjecthood, or the relation to distributive versus collective rationality—should be explicitly named and bracketed at this level with a brief note that they exist but need not be resolved here. The audience is skeptical that philosophy can say anything substantive about "just doing stuff together," so the arc should build the need for the concept rather than assuming it.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** First-year interdisciplinary seminar students (no prior social ontology). Skeptical about philosophy's relevance to "just doing stuff together."
      *   **Instructor:** Third-year philosophy student (needs a manageable, structured plan, not a lecture script).
      *   **Topic:** Collective Intentionality and Joint Action.
      *   **Duration:** 50 minutes.
      *   **Core Constraint 1 (Structure):** Structured around *dependency* (conceptual prerequisites). Idea A must precede Idea B.
      *   **Core Constraint 2 (Opening):** Make the conceptual problem visible *before* technical vocabulary. Challenge the "aligned private goals" view immediately.
      *   **Core Constraint 3 (Example):** Single concrete scenario. Clear role differentiation. No central director. *Crucially:* Each participant lacks an individual mental representation of the complete end state (so I-intentions alone fail). Not "walking together."
      *   **Core Constraint 4 (Misconceptions):** Map specific misconceptions (Group Consciousness, Strategic Cooperation, Behavioral Synchronization) to specific points in the sequence for interception.
      *   **Core Constraint 5 (Assessment):** One diagnostic question at the end distinguishing understanding of *irreducibility* from memorization.
      *   **Core Constraint 6 (Scope):** Explicitly name and bracket wider debates (Joint Commitment, Plural Subjecthood, Rationality types).
      *   **Goal:** Build the *need* for the concept, don't assume it.

  2.  **Deconstruct the Core Constraints & Brainstorm:**

      *   *The Example:* Needs to be complex enough that no one person knows the whole plan, but simple enough to grasp quickly.
          *   *Idea 1:* Orchestra. (Too many people, often has a conductor).
          *   *Idea 2:* Moving a heavy sofa. (Too simple, everyone knows the end state: sofa goes there).
          *   *Idea 3:* Improv Theater. (Good, but maybe too abstract).
          *   *Idea 4:* A Relay Race where the baton pass is blind? (No).
          *   *Idea 5:* *Emergency Triage/Rescue Chain.* People passing buckets? (Everyone knows the goal: put out fire).
          *   *Idea 6:* *Blindfolded Assembly Line.* Person A has parts, Person B has tools, Person C knows the shape but can't touch. They must build a specific structure without anyone seeing the whole thing or having the full blueprint individually.
          *   *Selection:* **The "Blind Architect" Construction.**
              *   Person A (Hands): Can lift/move but is blindfolded.
              *   Person B (Eyes): Can see the blueprint and the site but cannot touch the materials.
              *   Person C (Tools): Holds the stabilizing equipment but doesn't know the design or where things go until told.
              *   *Why this works:* None of them can form a complete "I intend to build X" representation because they lack the information to constitute "X" individually. They *must* rely on the others' intentional states to complete their own action description.

      *   *The Dependency Chain:*
          1.  Action requires an intention (goal).
          2.  Joint action requires a joint goal.
          3.  If the goal is inaccessible individually, the intention cannot be individual.
          4.  Therefore, the intentionality itself is shared/collective.

      *   *Misconception Interception:*
          1.  *Synchronization:* Early on. "Are they just moving at the same time?"
          2.  *Strategic Cooperation:* Middle. "Are they just trading favors?"
          3.  *Group Consciousness:* Late. "Is there a hive mind?"

      *   *Bracketing:* Keep it to a "Parking Lot" section at the end or brief asides.

  3.  **Drafting the Plan - Section by Section:**

      *   **Title:** Needs to be clear.
      *   **Learning Objective:** Focus on the *irreducibility* claim.
      *   **Materials:** Just the scenario description.

      *   **Phase 1: The Phenomenological Hook (0-10 mins)**
          *   *Goal:* Break the "sum of individuals" intuition.
          *   *Activity:* Present the "Blind Architect" scenario. Ask: "Can Person A intend to build the arch?"
          *   *Misconception Check:* Behavioral Synchronization. (Are they just reacting?)

      *   **Phase 2: The Failure of the "I" (10-25 mins)**
          *   *Goal:* Show why I-intentions fail logically, not just practically.
          *   *Analysis:* Break down the mental content. A doesn't know the shape. B can't move. C doesn't know the purpose.
          *   *Misconception Check:* Strategic Cooperation. (Is it just "I help you so you help me"?)

      *   **Phase 3: Introducing the "We" (25-40 mins)**
          *   *Goal:* Propose the solution (Collective Intentionality) without getting bogged down in metaphysics.
          *   *Concept:* The intention is held *in the interstice*.
          *   *Misconception Check:* Group Consciousness. (Avoid mysticism).

      *   **Phase 4: Assessment & Bracketing (40-50 mins)**
          *   *Goal:* Diagnostic question and scoping.
          *   *Question:* Needs to test if they see the *necessity* of the We, not just the definition.
          *   *Bracketing:* List the advanced topics to set aside.

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Is the "Blind Architect" too contrived?
      *   *Fix:* Make it a "Human Crane" scenario. Three people lifting a beam into a slot. One guides, one pushes, one stabilizes. None see the landing spot perfectly. Actually, the "Blind Architect" is better for the *mental representation* constraint. Let's stick with a variation of that: **The "Three-Point Lift" in the Dark.**
      *   *Revised Scenario:* Three people carrying a long, fragile glass pane through a narrow, dark corridor.
          *   Person A (Front): Can see the path but can't feel the weight balance.
          *   Person B (Middle): Blindfolded, feels the weight, guides A's feet verbally.
          *   Person C (Rear): Blindfolded, holds the stabilizing rope, only knows when to pull based on B's tension cues.
          *   *Wait, does C lack the end state?* C knows "get to end of hall."
      *   *Let's go back to the Assembly Idea.* It's stronger for the "mental representation" constraint.
      *   *Final Scenario Choice:* **The "Distributed Code" Debug.**
          *   Three programmers fixing a live server crash.
          *   Dev A: Can see the error logs but can't access the code.
          *   Dev B: Can edit the code but can't see the logs or the network traffic.
          *   Dev C: Can monitor network traffic but can't see logs or code.
          *   Goal: Restore service without crashing the database.
          *   *Why:* None of them knows *what* the fix is individually. A sees the symptom, B has the tool, C sees the side effects. They must act as one unit to form the intention "Fix the bug this way."
          *   *Actually, let's make it more physical for first-years.* **The "Blind Piano Tuning."**
          *   No, let's go with **The "Human Puppet" Rescue.**
          *   Okay, I need to ensure the constraint "each participant genuinely lacks an individual mental representation of the complete end state" is met.
          *   *Best Fit:* **The "Improvised Stretcher" through a Maze.**
          *   Two carriers, one guide.
          *   Carrier 1 (Front): Blindfolded. Holds front poles.
          *   Carrier 2 (Rear): Blindfolded. Holds rear poles.
          *   Guide (Middle): Can see the maze but cannot touch the stretcher. Must direct them verbally.
          *   *Crucial Twist:* The Guide doesn't know the patient's medical condition (which dictates speed/tilt). Carrier 1 knows the medical constraint (e.g., "keep head elevated") but can't see the maze. Carrier 2 just lifts.
          *   *Result:* No single person knows *both* the path and the medical constraint. Therefore, no single person can form the intention "Move patient safely to exit." Only the *group* possesses the information required to form that intention.
          *   *Wait, Carrier 2 is too passive.* Let's make it three carriers holding a heavy irregular object through a tight space.
          *   *Let's settle on:* **The "Blind Assembly" (revisited).** It's the cleanest for ontology.
          *   *Scenario:* Building a specific geometric shape with heavy blocks.
          *   Agent 1: Has the blocks. Doesn't know the shape.
          *   Agent 2: Has the blueprint. Can't touch blocks.
          *   Agent 3: Has the tools to lock them. Doesn't know shape or have blocks.
          *   *Constraint Check:* If Agent 1 acts on "I intend to move block," they might move it wrong. They need "We intend to build Shape X." But Agent 1 doesn't know Shape X.
          *   *Okay, this works.* It forces the "We" to hold the content.

      *   *Refining the Dependency Order:*
          1.  Intentionality requires content (you can't intend nothing).
          2.  Joint Action requires shared content.
          3.  If content is distributed, individual intentionality is impossible.
          4.  Therefore, Collective Intentionality is distinct.

      *   *Refining Misconceptions:*
          1.  Sync: "They are just moving together." (Address in Phase 1).
          2.  Strategy: "They are trading help." (Address in Phase 2).
          3.  Hive Mind: "They share one brain." (Address in Phase 3).

      *   *Refining the Diagnostic Question:*
          *   Bad: "What is collective intentionality?" (Memorization).
          *   Good: "If Agent 2 (Blueprint) leaves, can Agent 1 still intend to build the shape?" (Tests irreducibility/distribution).

      *   *Refining Bracketing:*
          *   Searle vs. Bratman (Individualism vs. Pluralism).
          *   Gilbert (Joint Commitment).
          *   Rationality (Team Reasoning).

  5.  **Final Review against Constraints:**
      *   50 mins? Yes, timed sections.
      *   Dependency structure? Yes, logical flow.
      *   Opening problem visible? Yes, via the scenario failure.
      *   Specific Example? Yes (Blind Assembly).
      *   Misconception Map? Included in flow.
      *   Diagnostic Question? Included.
      *   Bracketing? Included.
      *   Tone? Appropriate for TA to First-years.

  6.  **Writing the Plan:** (Proceeding to generate output based on these thoughts). *Self-correction:* Ensure the "Blind Assembly" scenario is described vividly enough in the plan so the TA knows how to pitch it. Make sure the dependency logic is explicit in the "Instructor Notes."

      *   *Wait, one more check on the "Mental Representation" constraint.*
      *   If Agent 1 doesn't know the shape, can they intend to build it?
      *   Standard view: No. You can't intend what you can't conceive.
      *   So, if they succeed, they must be participating in an intention they don't fully hold individually. This is the crux. I need to make sure the plan highlights this tension.

      *   *Let's tweak the scenario for maximum clarity:* **The "Three-Handed Safe Crack."**
      *   No, let's stick to **The "Distributed Rescue"** (Stretcher variant). It's more intuitive than assembly.
      *   *Revised Scenario:* **The "Blind Corridor Evacuation."**
      *   Three rescuers, one victim on a stretcher.
      *   Rescuer A (Front): Blindfolded. Carries front.
      *   Rescuer B (Rear): Blindfolded. Carries rear.
      *   Rescuer C (Guide): Can see, but hands are full holding a light source, cannot touch stretcher.
      *   *Constraint:* The victim has a neck injury (needs flat) AND a leg injury (needs elevated).
      *   Rescuer A knows about the neck injury.
      *   Rescuer B knows about the leg injury.
      *   Rescuer C knows the path through the smoke.
      *   *End State:* "Get victim to exit safely."
      *   *Problem:* A doesn't know the leg needs elevation (might tilt down). B doesn't know the neck needs flat (might tilt up). C doesn't know the injuries (might direct a turn that requires tilting).
      *   *Conclusion:* No individual possesses the full description of the "Safe Exit." Therefore, no individual can form the intention "Execute Safe Exit."
      *   *This is perfect.* It meets the "lack of individual mental representation" constraint strictly.

  7.  **Final Polish:** Check timing and tone. Ensure the "Dependency" logic is the backbone of the lesson plan structure. (e.g., "Step 2 cannot work unless Step 1 is accepted").

      *   *Wait, one nuance:* If A intends "Do my part," is that enough?
      *   The plan needs to show why "Do my part" presupposes the "We." (You can't have a 'part' without a 'whole').
      *   I will add this to the Phase 2 notes.

  8.  **Final Output Generation** (incorporating all these decisions).
answer: |-
  # Teaching Plan: The Architecture of "We"
  **Session Topic:** Collective Intentionality and Joint Action
  **Time:** 50 Minutes
  **Audience:** First-Year Interdisciplinary Seminar (No prior social ontology)
  **Instructor Goal:** Demonstrate the *necessity* of collective intentionality by showing where individual intentionality logically fails.

  ---

  ## I. Conceptual Dependency Map (Instructor Reference)
  *Do not present this list to students. Use it to maintain the logical sequence.*

  1.  **Intentionality requires Content:** You cannot intend to do $X$ if you cannot mentally represent $X$.
  2.  **Joint Action requires Shared Content:** To act *together*, agents must intend the *same* outcome, not just compatible outcomes.
  3.  **The Distribution Problem:** In specific scenarios, the information required to represent the outcome is distributed across agents such that no single agent possesses the full content.
  4.  **The Irreducibility Claim:** Therefore, the intention cannot reside in any single individual mind; it must be a primitive "We-Intention."

  ---

  ## II. Session Sequence

  ### Phase 1: The Phenomenological Hook (00:00 – 10:00)
  **Goal:** Make the problem visible before introducing vocabulary. Intercept *Behavioral Synchronization*.

  **Activity: The "Blind Corridor" Scenario**
  1.  **Setup (3 mins):** Describe the scenario verbally. Do not use terms like "ontology" or "intentionality" yet.
      *   *Scenario:* Three rescuers (A, B, C) must carry a victim through a smoke-filled corridor.
      *   *Constraint 1 (Physical):* A (Front) and B (Rear) are blindfolded (smoke). C (Guide) can see but cannot touch the stretcher (hands full with light).
      *   *Constraint 2 (Information):* A knows the victim has a **neck injury** (must stay flat). B knows the victim has a **leg injury** (must be elevated). C knows the **path** (requires tilting the stretcher to clear debris).
      *   *The Goal:* Get the victim to the exit *without aggravating injuries*.
  2.  **The Intuition Pump (5 mins):** Ask the class:
      *   "Can Rescuer A form the intention: *'I intend to get the victim to the exit safely'*?"
      *   *Expected Answer:* Yes.
      *   *Follow-up:* "Does Rescuer A know what 'safely' means in this specific context?"
      *   *Reveal:* No. A doesn't know about the leg injury. If A acts alone on their understanding of 'safely', they might keep it flat, hurting the leg.
  3.  **Intercept Misconception #1: Behavioral Synchronization (2 mins):**
      *   *Student Objection:* "They just need to move at the same time."
      *   *Instructor Response:* "If they just synchronize movement without the shared understanding of the injuries, they drop the victim or worsen injuries. Synchronization is physical; we are talking about the *goal* guiding the movement. If the goal is incomplete in their heads, the action fails."

  ### Phase 2: The Failure of the "I" (10:00 – 25:00)
  **Goal:** Prove that individual intentions (even coordinated ones) are logically insufficient. Intercept *Strategic Cooperation*.

  **Activity: Deconstructing the Mental State**
  1.  **The "Bundle of I's" Test (10 mins):**
      *   Propose the standard skeptical view: "Maybe they just have three separate intentions that fit together."
      *   *Rescuer A:* "I intend to carry the front flat."
      *   *Rescuer B:* "I intend to carry the rear high."
      *   *Rescuer C:* "I intend to guide them through the hole."
      *   *Ask:* "If these are just three private 'I-intentions,' what happens if C sees a new obstacle requiring the stretcher to tilt down?"
      *   *Analysis:* C cannot command A and B to change their private intentions. A and B cannot agree to change because they don't know *why* (they lack the full medical picture).
  2.  **Intercept Misconception #2: Strategic Cooperation (5 mins):**
      *   *Student Objection:* "They just agree to help each other. I do my part, you do yours."
      *   *Instructor Response:* "To 'do my part,' you must know what the 'whole' is. A cannot know what 'their part' is without knowing B's medical constraint and C's path constraint. You cannot have a 'part' without a 'whole.' If no individual holds the 'whole,' the 'part' is undefined."
  3.  **The Logical Gap (5 mins):**
      *   Establish the dependency: **Action Description.**
      *   To intend an action, you must be able to describe the success condition.
      *   In this scenario, the success condition ("Safe Exit") is *constitutively distributed*.
      *   *Conclusion:* If the success condition cannot exist in one mind, the intention to achieve it cannot exist in one mind.

  ### Phase 3: Introducing the "We" (25:00 – 40:00)
  **Goal:** Define Collective Intentionality as the solution. Intercept *Group Consciousness*.

  **Activity: Locating the Intention**
  1.  **The Proposal (5 mins):**
      *   Introduce the term **Collective Intentionality**.
      *   Definition: A mode of intending where the subject of the intention is plural ("We intend") rather than singular ("I intend"), and this cannot be reduced to a sum of "I-intends."
  2.  **Intercept Misconception #3: Group Consciousness (10 mins):**
      *   *Student Objection:* "So they share one brain? Is this mysticism?"
      *   *Instructor Response:* "No. It is not about merging minds (metaphysics); it is about the *structure of the commitment* (logic). Rescuer A does not need to know B's secret info; A needs to intend *'We get the victim out safely'* and trust that *'We'* covers the information gap A has."
      *   *Key Distinction:* Individual intentionality = I do X. Collective intentionality = I do *my part of* our doing X. The "Our doing X" is the primitive unit.
  3.  **Visualizing the Dependency (5 mins):**
      *   Draw on board:
          *   Individual View: Mind A [Partial Info] + Mind B [Partial Info] = **Failure**.
          *   Collective View: Mind A [We-Intention] + Mind B [We-Intention] = **Success**.
      *   Emphasize: The "We-Intention" is not the sum; it is the *container* that makes the individual actions intelligible.

  ### Phase 4: Assessment & Scope (40:00 – 50:00)
  **Goal:** Diagnostic check and bracketing advanced debates.

  **Activity: The Diagnostic Question (5 mins)**
  *   **Ask:** "Imagine Rescuer C (the Guide) slips and falls unconscious halfway through. Rescuers A and B can still physically carry the stretcher, but they no longer have guidance on the path. Do A and B still possess the *Collective Intention* to 'Execute the Safe Exit'?"
  *   **Desired Answer (Understanding):** "No. The 'We' required to constitute the 'Safe Exit' is broken because the informational distribution is now incomplete. They might still have 'I-intentions' to carry, but the joint action has collapsed into mere coordinated behavior."
  *   **Incorrect Answer (Memorization):** "Yes, because they are still working together." (This misses the irreducibility/info-distribution constraint).

  **Activity: Bracketing the Wider Debate (5 mins)**
  *   Explicitly tell students: "We have solved the *logical* problem of how the intention is held. We are **bracketing** (setting aside) the following questions for upper-level courses:"
      1.  **Joint Commitment (Margaret Gilbert):** Does this require a promise or agreement? (We assumed they just started acting).
      2.  **Plural Subjecthood (Raimo Tuomela):** Does the group become a new moral agent? (We are only talking about action description, not moral responsibility).
      3.  **Team Reasoning (Michael Bacharach):** Is this rational for the individual? (We are describing the structure, not justifying the choice).
  *   **Closing:** "Philosophy isn't just analyzing what you already know; it's finding the hidden structures that make 'just doing stuff' possible."

  ---

  ## III. Instructor Notes & Contingencies

  *   **If students resist the "Mental Representation" constraint:**
      *   *Analogy:* Ask them if they can intend to "Bake a Cake" if they don't know what flour is. If they lack the concept of a necessary component, can they truly intend the outcome? Apply this to the Rescuers' medical knowledge.
  *   **If students argue "They just signal each other":**
      *   *Counter:* Signaling presupposes a shared understanding of *what* the signal means. If A doesn't know about the leg injury, B cannot signal "Lift higher" in a way A understands as "Necessary for safety" rather than "Arbitrary preference."
  *   **Managing Skepticism:**
      *   Acknowledge early: "This feels like over-analyzing. But if you program robots to do this, or write laws about corporate responsibility, you *must* know if the intention was individual or collective. The stakes are real."
  *   **Time Management:**
      *   Phase 2 is the danger zone. If the "Bundle of I's" discussion drags, cut the "Visualizing the Dependency" drawing and move straight to the Definition in Phase 3. The Diagnostic Question is non-negotiable.

  ## IV. Misconception Map Summary

  | Misconception | Definition | Interception Point | Defusing Move |
  | :--- | :--- | :--- | :--- |
  | **Behavioral Synchronization** | "Together" just means moving at the same time. | Phase 1 (Hook) | Show that synchronized movement without shared goals leads to injury/failure in the scenario. |
  | **Strategic Cooperation** | "Together" means trading favors ("I'll help if you help"). | Phase 2 (Failure of "I") | Show that you cannot define "my part" without knowing the "whole," which is impossible individually. |
  | **Group Consciousness** | "We-Intention" means a hive mind or shared brain. | Phase 3 (The "We") | Clarify this is a logical structure of commitment, not a metaphysical merger of minds. |
