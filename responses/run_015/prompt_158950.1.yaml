          *   Ranked from Fatal to Merely Awkward.
          *   Distinguish Defender Concessions vs. Critic Assertions.
          *   Include the Structuralist worry (accessibility = structure, so no ontology identified).
          *   Analyze the elasticity of "in principle" (insulation vs. defect).
          *   Address the user's specific application (regions from which no signal can reach us).
          *   Distinguish settled vs. contested views.
          *   Mark my own confidence levels.
