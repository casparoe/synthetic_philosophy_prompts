      *   Settled vs. Contested marked? Yes.
      *   Confidence marked? Yes.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Fatal 1:* The "No Maximal Set" problem. If the set of accessible truths isn't a boolean algebra (due to QM), the antecedent "agree on every piece" is ill-defined.
      *   *Fatal 2:* Structuralism. If accessibility is causal, ontology reduces to causal graphs. Substantivalism dies.
      *   *Defender Concession:* They admit AC doesn't recover "things-in-themselves."
      *   *Critic Assertion:* They claim inaccessible facts exist (e.g., black hole interiors).
      *   *Elasticity:* If "in principle" allows future tech, AC is always defeasible. If it means "laws of nature," it's stable but theory-laden.
      *   *User's Case:* Cosmic horizons. AC says "indeterminate." Realists say "false dichotomy." This is standard Anti-Realism.

  9.  **Final Polish:** Ensure the distinction between "vacuity" (always true, says nothing) and "inapplicability" (conditions never met) is clear. Ensure the distinction between "epistemic" and "ontic" is maintained. (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I don't validate the user's principle as "correct" but analyze it as requested. I also need to ensure I don't present my own analysis as "consensus" where none exists. I will use explicit confidence markers.

  *(Refining the Quantum Point)*: The user mentions "distinct preparations that no measurement can distinguish." This is about non-orthogonal states. This means two different ontological states (wavefunctions) map to the same accessible data. AC says "no difference in what there is." This implies the wavefunction isn't "what there is" (psi-epistemic) or that the difference is metaphysical fluff. This is a huge point of contention in QM foundations. I must highlight this.

  *(Refining the Structuralist Point)*: If accessibility is exhausted by structure, AC identifies structure. Does that count as "ontology"? For a structuralist, yes. For a substance ontologist, no. I need to frame this as a divergence in goals.

