      *   **The Problem (The Wrinkle):** Accessible information might not form a single maximal set (e.g., Quantum Mechanics complementarity, indistinguishable preparations). There's no single "body of accessible information" to compare against.
      *   **The Question:** Does AC collapse into vacuity (never applicable) or require a privileged specification of accessibility (which seems unjustified)?
      *   **Required Output:**
