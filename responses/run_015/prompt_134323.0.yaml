answer: |-
  # Session Plan: The Signal-Pattern Taxonomy Protocol

  **Course:** Upper-Level Philosophy of Mind Seminar  
  **Participants:** 12 Graduate Students  
  **Duration:** 90 Minutes  
  **Objective:** To phenomenologically enact the tension between necessary-and-sufficient conditions and family-resemblance/prototype reasoning without initially naming the theoretical frameworks.

  ---

  ## 1. Materials & Setup

  *   **Room:** Three tables arranged in a triangle. Whiteboard visible to all.
  *   **Handouts:**
      *   **Role Cards:** 12 total (4 Boundary-Keepers, 4 Analogists, 4 Process-Observers, 4 Chairs).
      *   **Taxonomy Rule Sheet:** 12 copies (identical).
      *   **Card Decks:** 3 identical decks of 10 cards each (labeled S-01 through S-10).
  *   **Whiteboard:** Divided into three columns (one per group) for tracking "Consensus Status."

  ## 2. Participant Roles (4 per group)

  1.  **The Boundary-Keeper:** Holds the *Taxonomy Rule Sheet*. Their sole mandate is to reject any classification that violates the stated necessary-and-sufficient conditions. They are forbidden from arguing via intuition; they must cite the rule.
  2.  **The Analogist:** Forbidden from citing the Rule Sheet. They must argue based on similarity to previously accepted cards ("This feels like S-03, even if the numbers differ").
  3.  **The Process-Observer:** Holds the *Consistency Log*. They do not vote on classification. They track which property (Latency, Feedback, Permeability) is being prioritized or ignored at each decision point. They hold the power to flag "Ad Hoc Drift."
  4.  **The Chair:** Manages time, facilitates the vote, and submits the group's final classification to the facilitator. They break ties.

  ## 3. The Fictional Ontology (The "Lie")

  Write this on the board and distribute the **Rule Sheet**:

  **Domain:** Signal-Pattern Taxonomy (Class $\Phi$)  
  **Membership Conditions (Jointly Sufficient):**  
  To be classified as a **Core Instance**, an entity must possess:
  1.  **Latency Profile:** Immediate (L-Imm)
  2.  **Feedback-Loop Depth:** Deep (F-Deep)
  3.  **Boundary Permeability:** Closed (B-Closed)

  **Classification Options:**
  *   **CORE:** Meets all three conditions.
  *   **EXTENSION:** Meets fewer than three, but is functionally analogous to a Core.
  *   **OUTLIER:** Meets fewer than three, and is functionally distinct.

  *(Note to Facilitator: This definition is intentionally brittle. The cards will systematically break it.)*

  ## 4. The Card Deck Sequence (The "Truth")

  Each group receives the same 10 cards. The sequence is designed to degrade the rule set.

  *   **S-01, S-02, S-03 (The Anchor):** L-Imm / F-Deep / B-Closed. (Clear Cores. Establishes the rhythm.)
  *   **S-04 (The First Crack):** L-**Delayed** / F-Deep / B-Closed. (Violates Latency only.)
  *   **S-05 (The Second Crack):** L-Imm / F-**Shallow** / B-Closed. (Violates Feedback only.)
  *   **S-06 (The Third Crack):** L-Imm / F-Deep / B-**Open**. (Violates Boundary only.)
  *   **S-07 (The Double Violation):** L-**Delayed** / F-**Shallow** / B-Closed.
  *   **S-08 (The Analogical Pull):** L-**Delayed** / F-Deep / B-**Open**. (Matches no Core, but shares 'Deep Feedback' with S-01/02/04.)
  *   **S-09 (The Void):** L-**Delayed** / F-**Shallow** / B-**Open**. (Violates all three.)
  *   **S-10 (The Mirror):** L-Imm / F-Deep / B-Closed. (Identical to S-01. Placed last to test if the definition has shifted so much that a Core now looks like an Outlier, or vice versa.)

  ## 5. Timeline (90 Minutes)

  ### Phase 1: Induction & Calibration (15 Minutes)
  *   **00-05:** Distribute materials. Read the Rule Sheet aloud. Emphasize that "Core" requires all three properties.
  *   **05-15:** **Round 1 (Cards S-01 to S-03).** Groups classify the anchors.
      *   *Constraint:* Groups must reach unanimous consensus to proceed.
      *   *Facilitator Action:* Mark "Consensus" on whiteboard for all groups. Establish the baseline.

  ### Phase 2: The Violation Sequence (30 Minutes)
  *   **15-30:** **Round 2 (Cards S-04 to S-06).** Single-property violations.
      *   *Tension:* The Boundary-Keeper must vote "Outlier." The Analogist will argue "Extension."
      *   *Observer Task:* Note which property the group implicitly treats as "most important" to save the classification.
  *   **30-45:** **Round 3 (Cards S-07 to S-09).** Compound violations and the Void.
      *   *Tension:* The rules provide no cover. The group must invent a new principle or admit the concept has broken.
      *   *Facilitator Action:* Circulate. If a group finishes early, do not let them discuss theory. Tell them to review their Consistency Log.

  ### Phase 3: The Reveal & Scoring (15 Minutes)
  *   **45-55:** **Card S-10 (The Mirror).**
      *   Ask groups to classify S-10 silently, individually, *before* discussing.
      *   Collect the votes. (Often, S-10 is now viewed differently than S-01 due to the "slippage" experienced in S-04–S-09).
  *   **55-60:** **Scoring Reveal.**
      *   Explain the Hidden Scoring: Points were awarded for **Internal Consistency**, not "Correctness."
      *   If a group classified S-04 as *Extension* because "Latency doesn't matter," but then classified S-07 as *Outlier* despite also having Latency issues, the Observer should have flagged this.
      *   Announce which group maintained the highest "Taxonomic Integrity" (i.e., either stuck rigidly to the rules or explicitly updated their theory mid-stream).

  ### Phase 4: Philosophical Debrief (30 Minutes)
  *   **60-75:** **Phenomenological Mapping.**
      *   Ask the Observers: "At which card did you feel the rule stop working, but the category still feel 'right'?"
      *   Ask the Keepers: "Did you feel like a bureaucrat or a defender of truth?"
      *   Ask the Analogists: "What was the 'gravity' pulling you to classify S-08 as an Extension? Which property acted as the gravitational mass?"
  *   **75-85:** **Theoretical Naming.**
      *   Now introduce the frameworks: Wittgenstein (Family Resemblance), Rosch (Prototype Theory), Gärdenfors (Conceptual Spaces).
      *   Map the game mechanics to the theory: The "Rule Sheet" was the Classical Theory of Concepts. The "Slippage" was the failure of classical conditions. The "Gravity" was the Prototype Effect.
  *   **85-90:** **Closing.**
      *   Assign reading based on the specific slippage patterns the class exhibited.

  ---

  ## 6. Payoff Structure (Non-Monetary)

  **"Taxonomic Integrity Tokens"**
  *   **Mechanism:** The Facilitator holds the scoring key.
  *   **Reward:** Groups gain a token for every unanimous decision.
  *   **Penalty:** The Process-Observer holds a "Veto Stamp." If they detect an *unacknowledged* rule change (e.g., treating Latency as irrelevant in S-04 but critical in S-07 without discussion), they can veto the token award for that round.
  *   **Win Condition:** The group with the most tokens at the end chooses the reading topic for the next week. This incentivizes *awareness* of slippage, not just avoiding it.

  ---

  ## 7. Limitations of the Setup (Facilitator Notes)

  In the closing discussion, you must explicitly supply what the physical setup cannot reproduce:

  1.  **Pragmatic Stakes:** In the game, misclassifying S-09 has no consequence. In real cognition, concepts slip because *goals* change (e.g., we call a tomato a "fruit" in botany but a "vegetable" in cooking). The game lacks this teleological pressure.
  2.  **Dynamic Context:** The cards are static. Real analogical reasoning depends on the context of the conversation. A "Delayed Latency" might be crucial in one context and irrelevant in another. The game forces a single context.
  3.  **Emotional Valence:** Concepts often have affective weight (e.g., "Person," "Alive"). "Signal-Patterns" are cold. Students will not feel the *anxiety* of conceptual breakdown, only the logical frustration. You must describe this anxiety in the debrief.

  ---

  ## 8. Troubleshooting: Predictable Failure Modes

  **1. Premature Theorizing (The "Graduate Student" Problem)**
  *   **Risk:** Within 5 minutes, a student will say, "This is obviously Wittgensteinian." This ruins the phenomenological inhabitation.
  *   **Fix:** The **Rule Sheet** includes a "Gag Order" clause: *"Use of established philosophical terminology (e.g., 'prototype,' 'necessary condition') results in immediate disqualification from the scoring prize."* Enforce this playfully but strictly.

  **2. Role Confusion / Dominance**
  *   **Risk:** The Boundary-Keeper and Analogist turn it into a debate, ignoring the Observer. Or, one dominant student takes all roles.
  *   **Fix:** The **Chair** has the sole authority to call on speakers. The Observer must speak *first* during the scoring phase of each round to report on consistency before the group votes on the next card.

  **3. Resistance to the Fictional Ontology**
  *   **Risk:** Students argue the properties are ill-defined ("What does 'Deep Feedback' actually mean?").
  *   **Fix:** You are the **Oracle**. If asked for definitions, reply: *"Interpret the terms operationally as you see fit, but you must apply that interpretation consistently."* This turns the ambiguity into a feature of the experiment, not a bug.

  **4. Premature Consensus**
  *   **Risk:** Groups rush to agree to get points, bypassing the tension.
  *   **Fix:** Impose a **Minimum Debate Timer**. For Cards S-04 through S-09, the group must talk for at least 2 minutes before the Chair can call a vote. Use your phone/watch to enforce this.

  ---

  ## 9. Facilitator's "Consistency Key" (For Hidden Scoring)

  *Keep this hidden until Phase 3.*

  *   **Rigid Strategy:** If a group classifies S-04, S-05, S-06 as **Outliers** (sticking to the Rule Sheet), they are consistent. If they then classify S-07 as **Outlier**, they gain maximum points.
  *   **Flexible Strategy:** If a group classifies S-04 as **Extension**, they establish a precedent that Latency is non-essential.
      *   If they then classify S-07 (Delayed/Shallow) as **Extension**, they are consistent *with their new precedent*.
      *   If they classify S-07 as **Outlier**, the Observer should have vetoed their points (Ad Hoc Drift).
  *   **The Trap:** Most groups will drift unconsciously. They will treat S-04 as an Extension (ignoring Latency) but treat S-07 as an Outlier (because it feels "too far"), without acknowledging they changed the weight of the Latency property. The Observer's job is to catch this.

  **Debrief Hook:** "Group 2 gave S-04 a pass on Latency, but punished S-07 for Latency. Why? Because S-07 lacked the 'gravitational pull' of the other properties. You weren't measuring properties; you were measuring distance from a prototype."
