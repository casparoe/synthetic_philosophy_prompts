  **Model NG-44 Narrative Gravimeter User Guide**

  **Technical Specs**
  The NG-44 measures the cohesive tension of autobiographical data points to locate the abstract center of identity. Measurement range spans 0.0 to 14.0 Narrative Newtons with a resolution of 0.01 Nn. The device operates on a power source derived from retrospective cognition, requiring the subject to maintain active memory recall during operation. Sensor accuracy depends on the density of shared social verification. Units of measure include Bio-grams for mass and Continuity Seconds for temporal stability. The display output indicates the current gravitational pull of the subject's self-story. Fluctuations above 5.0 Nn suggest a robust ego structure. Readings below 1.0 Nn indicate imminent narrative dissolution. The casing is shielded against external contradictory testimony to prevent sensor drift.

  **Calibration Procedure**
  Proper calibration ensures the device locks onto the subject's specific narrative trajectory rather than ambient cultural archetypes.
  1. Position the subject in front of a neutral reflective surface.
  2. Instruct the subject to recount their earliest childhood memory aloud.
  3. Observe the needle. If it oscillates, the memory contains confabulations.
  4. Adjust the Confabulation Dialectic until the hum stabilizes.
  5. Request a second memory that causally links to the first.
  6. If the link is broken, reset the device and suppress the contradictory episode.
  7. Once the needle holds steady at the zero point, the center of gravity is established.
  8. Do not recalibrate during periods of significant personal growth as this alters the baseline mass.

  **Warranty and Service**
  The manufacturer guarantees the NG-44 against defects in material and ontological workmanship for a period of two years. This warranty is immediately voided if the subject undergoes a religious conversion, severe brain trauma, or any event causing a branching of personal timeline. Coverage does not apply to damage resulting from the realization that no homunculus exists within the cranial cavity. Service centers are not liable for existential distress caused by accurate readings. If the device begins to measure nothing repeatedly, do not return it. This indicates successful operation. Users attempting to measure the soul directly will trigger a hard lockout. Replacement units are unavailable for subjects who have ceased to maintain a consistent first-person perspective.

  **Safety Warnings**
  Operate the NG-44 only in controlled environments with psychological support staff present.
  *   Risk of Ontological Vertigo: Sudden drops in narrative gravity may cause dizziness or dissociation.
  *   Do not operate during manic episodes where story production exceeds factual grounding.
  *   Prolonged exposure to null readings may result in the sensation of being a fictional character.
  *   Keep away from children under the age of ego formation.
  *   In case of narrative collapse, disconnect power and engage in mundane routine until coherence returns.
  *   Never look directly into the sensor while questioning your own existence.

  **Notes on the Exaggeration**

  The manual treats the philosophical metaphor of the center of narrative gravity as literal engineering. The Technical Specs convert the abstract pull of stories into measurable force units like Narrative Newtons. Calibration maps onto the psychological work required to maintain a consistent self-story, where contradictory memories must be suppressed to keep the identity stable. The Warranty section satirizes the fragility of this view; if the narrative breaks or the user realizes there is no inner soul, the device—and the self—ceases to function as intended. Safety Warnings highlight the potential psychological distress of confronting the idea that identity is a construct rather than a solid object. The nonsense terms like Bio-grams reinforce the category error of measuring abstract concepts with physical tools.
