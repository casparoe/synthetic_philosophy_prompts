prompt: |-
  At a discussion group I've been attending since retiring from the lab, two regulars got into a sharp exchange about the Condorcet jury theorem and I've been turning it over ever since. I'd like you to adjudicate it move by move.

  (1) David opened by saying the theorem shows that democratic decision-making has a solid epistemic foundation: if each voter has a better-than-even chance of being right on a binary question and they vote independently, then the probability that a majority gets it right converges to certainty as the group grows. He called this a genuine reason to trust democratic outcomes over, say, a single expert.

  (2) Miriam replied that the independence condition makes the whole thing irrelevant to actual politics. Voters read the same outlets, watch the same debates, and talk to each other. Their errors aren't independent — they're correlated. And with correlated errors, she said, adding more voters doesn't add independent signals; it just amplifies whatever shared biases the electorate already has.

  (3) David answered that this is too quick. The theorem only requires conditional independence given the evidence. If voters share information because they're all looking at the same facts, that correlation is fine — it's driven by a common signal, not by copying each other's mistakes. He said the real question is whether, conditional on the evidence available, each voter's judgment is an independent draw from a distribution that's better than chance.

  (4) Miriam came back with two points. First, voters share cognitive architecture — confirmation bias, framing effects, and so on — that isn't driven by evidence at all, so errors remain correlated even conditional on the facts. Second, on many real political questions, voters aren't better than chance in the first place; they're systematically misinformed, and the theorem's p > 0.5 premise fails outright. She said David was defending a theorem that describes a voting body that has never existed.

  I'd like you to go through this exchange step by step and say who has the better of each move, and then give an overall assessment of who is more right. Please take a definite position rather than splitting the difference — I want a committed verdict, with your reasoning at each stage.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** A retired lab worker attending a discussion group. Two regulars (David and Miriam) are debating the Condorcet Jury Theorem (CJT).
      *   **Task:** Adjudicate the exchange move by move (1-4) and provide an overall assessment.
      *   **Constraint:** Take a *definite position* (no splitting the difference). Provide reasoning at each stage.
      *   **Tone:** Intellectual, analytical, fair but decisive (like a judge or senior colleague).

  2.  **Analyze the Subject Matter (Condorcet Jury Theorem):**
      *   *Core Claim:* If $n$ voters decide a binary question, each with independent probability $p > 0.5$ of being correct, the probability the majority is correct approaches 1 as $n \to \infty$.
      *   *Key Assumptions:*
          1.  Binary choice (True/False, A/B).
          2.  Competence ($p > 0.5$).
          3.  Independence (votes are statistically independent).
          4.  Sincere voting (voters vote for what they believe is true).
      *   *Common Criticisms:*
          1.  Independence is rarely met in real politics (common shocks, media, social influence).
          2.  Competence is rarely met (voters are often ignorant or systematically biased, $p < 0.5$).
          3.  Binary assumption is often false (multi-dimensional policy spaces).
      *   *Nuance:* "Conditional Independence" (given the state of the world or the evidence) is a technical refinement often used to salvage the theorem, but it faces challenges regarding common priors and cognitive biases.

  3.  **Evaluate Move by Move:**

      *   **Move 1 (David):** States the theorem correctly (binary, $p > 0.5$, independence, convergence). Claims it supports democracy over a single expert.
          *   *Assessment:* Technically accurate statement of the theorem. The normative leap (therefore trust democracy) is the *point* of the theorem, but relies on the assumptions holding.
          *   *Verdict:* David wins on exegesis, but the application is theoretical.

      *   **Move 2 (Miriam):** Attacks the independence assumption. Real voters share information sources (media, debates). Correlated errors mean the "law of large numbers" doesn't wash out error; it amplifies common bias.
          *   *Assessment:* This is the standard and strongest empirical critique of CJT in political science. Independence is indeed violated by common information environments.
          *   *Verdict:* Miriam wins on empirical realism.

      *   **Move 3 (David):** Refines the independence condition. Argues for *conditional* independence given the evidence. Shared facts create correlation, but that's okay if the judgment *given* the facts is independent.
          *   *Assessment:* This is a sophisticated defense (often associated with Bayesian interpretations of CJT). However, it shifts the goalposts. The classic theorem requires unconditional independence or very specific conditional structures. If they share evidence, their posteriors might converge, violating independence *conditional on the truth*. If they share evidence *and* interpret it similarly due to shared culture, independence fails.
          *   *Verdict:* David makes a clever theoretical save, but it's fragile in practice. It's a "theoretically possible but empirically thin" defense.

      *   **Move 4 (Miriam):** Two prongs. (A) Cognitive architecture (biases) creates correlation *not* explained by evidence. (B) Competence ($p > 0.5$) is often false; voters are systematically misinformed ($p < 0.5$).
          *   *Assessment:* Prong A addresses David's refinement (biases break conditional independence). Prong B attacks the competence assumption directly (the "p > 0.5" problem). If $p < 0.5$, the theorem reverses: larger groups become *less* reliable. This is the "Systematic Bias" critique.
          *   *Verdict:* Miriam lands the knockout blow here. David's theoretical refinement cannot overcome systematic incompetence or shared cognitive pathology.

  4.  **Determine the Overall Winner:**
      *   David represents the *idealized* epistemic defense of democracy. He is right about the math *in the abstract*.
      *   Miriam represents the *empirical* political science critique. She is right about the *application* to real politics.
      *   *Constraint Check:* I must pick a winner. Since the context is a discussion about "actual politics" (implied by Miriam's rebuttal and the user's context of a discussion group), the empirical validity matters more than the mathematical elegance. The theorem is useless if its premises are never met. Miriam correctly identifies that the premises are *not* met in the real world.
      *   *Decision:* Miriam is more right. The CJT is a beautiful mathematical result, but as a justification for real-world democratic epistemology, it fails under the weight of Miriam's objections.

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the depth of the debate. Set the stage.
      *   *Move 1:* Credit David for accuracy, note the idealization.
      *   *Move 2:* Credit Miriam for the crucial independence critique.
      *   *Move 3:* Analyze David's "conditional independence" counter. Acknowledge it's a known technical fix but highlight its fragility.
      *   *Move 4:* Analyze Miriam's double-tap (biases + competence). Explain why this undermines David's fix.
      *   *Overall Verdict:* Declare Miriam the winner. Explain that while David describes a *possible* world, Miriam describes *our* world. The theorem's value is heuristic, not justificatory, in light of her points.

  6.  **Refining the Tone:**
      *   Ensure I don't sound like I'm dismissing democracy, just this specific mathematical justification for it.
      *   Keep it rigorous but accessible (for a retired lab worker).
      *   Adhere strictly to the "definite position" constraint.

  7.  **Self-Correction/Edge Case Consideration:**
      *   *Is David right about conditional independence?* In Bayesian terms, if agents have different private signals, they can be conditionally independent given the state of the world. But Miriam's point about *shared* outlets means they share signals, reducing the "private" component. David's Move 3 tries to say "shared facts are fine," but if the facts are interpreted through shared biases (Miriam's Move 4), independence breaks.
      *   *Is $p > 0.5$ definitely false?* Not on *all* questions. But Miriam says "on many real political questions." She doesn't need to prove it for *all*, just enough to undermine the general claim.
      *   *Verdict Strength:* I need to be firm. Miriam wins because she addresses the *application*, which is the point of the discussion. David is reciting a theorem; Miriam is analyzing its validity.

  8.  **Final Polish:** Check against the prompt requirements (move by move, definite position, reasoning). (Looks good.)

  *(Self-Correction during drafting)*: I should make sure I don't validate Miriam's view as "anti-democratic." She is critiquing a specific *epistemic justification*, not democracy itself. I need to be precise there. David claims the theorem *justifies* trust. Miriam claims the theorem *does not apply*.

