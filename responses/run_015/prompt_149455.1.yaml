      *   *Skinnerian:* Operant conditioning. Trial and error happens during the organism's lifetime. Try something, get rewarded/punished, adjust behavior. No internal model of *why*, just association.
      *   *Popperian:* Internal hypothesis testing. "Let my hypotheses die in my stead." Can simulate outcomes before acting. Requires some internal representation of the world.
