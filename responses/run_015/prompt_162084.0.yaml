          *   Neuro: Residuals off the body-size regression. Allometric scaling. Mosaic evolution.
          *   Mapping: "Bad proxy" = "Low $R^2$" or "High Variance in Residuals." The Whale example = "Outliers in the allometric space" or "Different scaling exponents across clades."
          *   Cleanliness: High, but requires specifying the *target*. If the target is "human-like cognition," size is bad. If the target is "total metabolic processing," size is okay. The philosophers assume a specific target without defining it.

