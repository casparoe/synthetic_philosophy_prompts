          *   Mapping: "Morally Relevant" = "Target Variable in a Regression." "Moral Status" = "Outcome Variable."
          *   Cleanliness: High. This is classic measurement theory. Size is an indicator variable; Capacity is the latent construct.

      *   *Move 2 (Bad Proxy/Empirical Claim):*
