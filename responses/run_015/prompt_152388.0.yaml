answer: |-
  Good evening, everyone. Can I just have your attention for a moment? Cheers.

  For those of you who don't know me, I'm [Your Name]. I used to be an engineer in [Boss's Name]'s lab. Looking around the room, I reckon it's about a fifty-fifty split. Half of you are former lab rats who know what a gradient descent is, and the other half are family who probably think she taught Excel to feel emotions.

  I'm an engineer, not a philosophy person, so I'll try not to get too waffly. But to understand what [Boss's Name] actually did for thirty years, you have to understand the question she was chasing. It wasn't just "can we make the computer work?" It was "when the computer works, is there actually a *there* there?"

  Now, the family side might think she was looking for a little ghost in the machine. Like, if you cracked open the code, you'd find a neuron that lights up for 'cat' and another for 'dog'. I can tell you now, she hated that idea. She'd roll her eyes proper hard if anyone talked about finding the 'true mind' of the network. She knew it wasn't that simple.

  But—and this is the bit that matters—she also hated the other extreme. Some people say interpretability is just storytelling. That we're projecting patterns onto weights that don't mean anything, like seeing shapes in clouds. She didnt buy that either. She didn't think her work was just building useful tools with nothing real inside.

  So where did that leave her? Well, she taught us to look for what she called "distributed roles."

  Think of it like... a football team. You cant point to one player and say "that guy is the victory." The victory isn't in the striker, or the goalie, or the manager. It's in how they move together. There's no single neuron that means 'cat', but there is genuine pattern-tracking spread across the layers. The meaning is in the coordination.

  That was her whole career. Navigating that middle ground. Refusing to say the magic was real, but refusing to say it was just a trick. She wanted to know how the maths managed to track the world without pretending the maths was the world itself.

  And honestly, that intellectual honesty was what made her such a brilliant boss. She never let us take the easy answer. If our plots looked too clean, she'd ask what we were hiding. If we claimed we'd found a 'feature', she'd ask us to prove it wasn't just us projecting. She treated the models with respect, but not reverence.

  For the family here, I know it sounds abstract. But what it meant in practice was integrity. She spent three decades asking "is this true?" when everyone else was asking "does this sell?" She showed us that you can build things that work without lying about how they work.

  We're going to miss her. The lab feels a bit quieter without her pointing out that we're probably fooling ourselves. But I think she'd be pleased to know the question is still open. She didn't solve interpretability—nobody did—but she mapped the terrain so the rest of us dont get lost.

  So, if everyone could raise a glass.

  To [Boss's Name]. Thank you for showing us that even if the representation is distributed, the impact certainly wasnt. You were real to us, even if the networks never quite were.

  Cheers!
