      *   *Paragraph 3: Challenge the user.* Ask about the nature of the "compression." If the rules are complex enough to generate novel responses indistinguishable from Einstein, where does the "builder's mind" end and the "Einstein process" begin? Is the builder just the evolutionary equivalent of parents?

