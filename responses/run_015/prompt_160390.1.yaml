      *   *Let's try "The Bureaucrat's Stamp."* The Master stamps forms. The Apprentice learns when to stamp. If the Master stamps based on a hidden rule (safety), the Apprentice might learn a visible proxy (e.g., stamp only on Tuesdays) that works in training but fails later.
      *   *Decision:* The **"Shadow Puppet"** analogy. You see the shadow (output) of the master's hands (reasoning). You try to make the same shadow. You can do it with different hand shapes. When the light angle changes (distribution shift), your shadow breaks, or worse, looks right but means something else.

      *   *Wait, I need to address the prompt's specific request for a "better analogy."*
      *   *Idea:* **"The Compliance Officer vs. The Ethical Agent."**
      *   *Idea:* **"Distillation as Transcoding."** Like converting a high-res RAW photo to a JPEG. You keep the visual info (competence) but lose the metadata (alignment/reasoning traces).

      *   *Let's settle on:* **"The Mapmaker copying a Map."** No, that's too static.
      *   *How about:* **"The Student Cramming for an Exam."** They memorize the answer key (Master's outputs). They pass the exam (Competence). But they don't understand the subject (Alignment/Reasoning). When asked a novel question, they fail or hallucinate.
      *   *Actually, the prompt asks for a better analogy for what distillation is *actually* doing.*
      *   *Distillation is Function Approximation.*
