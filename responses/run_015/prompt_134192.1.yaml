  **MEMORANDUM**

  **TO:** Ethics Review Board, University Fertility Center
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Cross-Border Consultancy Partnership

  This memo addresses the proposal from the "reproductive travel co-op" to facilitate surrogacy arrangements for clients from jurisdictions where commercial surrogacy is prohibited. After reviewing the legal briefs and advocate statements, I recommend we **reject** this partnership.

  The central ethical fracture lies in the payment structure. The consultancy proposes labeling compensation as "post-birth emotional labor stipends." We must wrestle honestly with whether this framing changes the moral picture or serves as pure euphemism. Surrogacy undoubtedly involves significant emotional labor; however, utilizing this category solely to bypass anti-commodification statutes is deceptive. It does not alter the transaction's substance: payment is contingent on pregnancy and birth, not merely psychological support. By accepting this linguistic fiction, we become complicit in laundering a banned market. We cannot claim to protect surrogate welfare while facilitating a scheme designed to obscure the economic coercion European statutes sought to prevent. If we endorse this framing, we validate the idea that ethical realities can be altered by semantic shifts.

  Proponents argue that rejecting this partnership merely pushes clients to less scrupulous clinics, denying surrogates our superior protections. This "lesser evil" argument fails to account for our institutional mission. As a university-affiliated center, our mandate extends beyond service provision to ethical leadership. Participating in regulatory arbitrage undermines the global consensus on human dignity and exposes the university to significant reputational harm. If we validate this loophole, we signal that our ethical standards are flexible based on geography and legal drafting. Furthermore, patient advocates are correct: we would be exporting a market that Europe rightly banned. Our higher protections do not negate the fundamental issue of exploiting regulatory gaps to facilitate transactions deemed exploitative elsewhere.

  The legal risks are non-trivial. Our legal team notes potential violations of the spirit of European statutes, with risks ranging from sanctions to extradition disputes. While US law may permit the arrangement, international law increasingly targets facilitators of reproductive trafficking. We cannot insulate ourselves behind domestic permissibility when the explicit intent is to circumvent foreign public policy. The risk of being named in a sanctions dispute threatens our research funding and institutional standing.

  **Recommendation and Timeline**

  I propose we formally reject the partnership based on incompatibility with our ethical guidelines regarding commodification and transparency.

  **Timeline:**
  1.  **Immediate (Upon Circulation):** Cease all preliminary negotiations to prevent implied consent or reliance.
  2.  **Board Meeting (In Two Weeks):** Final vote on rejection. Discussion should focus on drafting a public statement affirming our commitment to international ethical harmonization.
  3.  **Notification (Within 5 Business Days of Vote):** Send formal letter to consultancy citing ethical misalignment regarding payment transparency and international compliance.
  4.  **Review (6 Months):** Re-evaluate internal policies to ensure no similar loopholes exist in other international partnerships.

  We must prioritize integrity over expansion. Facilitating a scheme built on linguistic tricks compromises the trust essential to reproductive medicine. I look forward to discussing this further at our session.
