answer: |-
  The principle and its parts

  Your intuitions align with a principle of **Qualified Temporal Neutrality**. This view holds that while we may discount *goods* (like money) over time due to opportunity costs, investment growth, or diminishing marginal utility, we must not discount *welfare* (happiness, suffering) purely because of its temporal location. This distinction resolves your retirement case: preferring $1000 now is rational if invested growth makes it equivalent to $1030 later, but valuing your future happiness at 50% less simply because it occurs later is a failure of rational self-care. Your future self is not a stranger; they are a later stage of the same moral entity, entitled to equal weight in your calculus of well-being.

  The second part of the principle involves **Diachronic Autonomy**. While you must respect your future self's welfare, you also respect their agency. This allows for binding contracts against impulsive weakness of will (Ulysses contracts) but forbids manipulating future preferences to avoid regret (the drug case). Your future self has a "vote" against present impulses, but not against genuine preference evolution. This creates a constraint: you can bind yourself to protect higher-order goals, but you cannot alter your future self's capacity to evaluate those goals. Together, these rules suggest you are a trustee for your future selves, obligated to maximize their welfare without usurping their right to define it.

  Which verdicts survive and which break

  Under this framework, Cases 1, 3, and 4 survive intact, as they rely on the goods/welfare distinction and autonomy constraints. Case 2 requires a slight adjustment: you cannot justify spending less on the asteroid strike purely because it is 400 years away if you refuse to do so for climate change at 2100; the discount must reflect lower probability or higher future wealth, not pure time. The verdict you must drop is the hope in Case 5 that your current role as "decider" breaks the symmetry of welfare; if welfare is temporally neutral, your current agency does not grant you tyranny over your future suffering. You are inconsistent only if you claim the right to override future welfare simply because you hold the pen now.

  The torn case and the future-only infrastructure case

  For the job case, the principle predicts you should reject the offer if the utility of future misery outweighs the current financial gain, weighting both moments equally. Your current desire for money does not trump your future need for meaning; you must act as a fiduciary for your future self. Regarding the infrastructure case, the government should build it if the net welfare benefit is positive, even if no currently alive person survives to enjoy it. Since pure time preference is rejected in your climate verdict, the moral status of future citizens does not diminish simply because they are born after our deaths; we owe them policy based on their welfare, not our electoral cycle.

  Bottom line

  You are running one coherent rule set, not two, provided you strictly separate goods from welfare. Adopt Qualified Temporal Neutrality: discount money for growth, but never discount happiness for time. Your current self is a trustee, not a dictator, for the person you will become.
