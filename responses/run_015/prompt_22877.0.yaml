          *   *Analysis:* This is the core of the Master Argument (Diodorus Cronus) and Aristotle's interpretation. It relies on the principle of necessity of the past or the fixity of truth. It's a standard fatalist inference. Is it sound? It depends on the logic of time. In linear time with bivalence, it holds. In branching time, it might not. Nora is articulating the *fatalist challenge*.
          *   *Verdict:* Sound articulation of the fatalist worry, though perhaps too quick to equate bivalence with determinism without qualifying the logic of time.

      *   **Move 2 (Sam):** Distinguishes "true now" from "necessary." Truth at a time $\neq$ Necessity. A sentence can be true now but false in another scenario (contingent). Accuses Aristotle/Nora of conflating truth with necessity.
          *   *Analysis:* This is the standard Ockhamist response. Truth is relative to a history/time pair. $True(t, h)$ does not imply $Necessary(t, h)$. Sam is correctly identifying a modal distinction.
          *   *Verdict:* Sound. This is the standard logical distinction used to save bivalence + openness (Ockhamism).

      *   **Move 3 (Nora):** Truthmaker objection. Truth requires a fact. The fact for "battle tomorrow" is the battle. The battle doesn't exist yet. So either the fact exists (determinism) or it doesn't (no truth value now). Claims "open future + bivalence" has no room.
          *   *Analysis:* This invokes Truthmaker Theory. Presentism vs. Eternalism. If one is a Presentist (only present exists), future contingents lack truthmakers. If an Eternalist (past/present/future exist), they have truthmakers but the future is "settled" in the block universe. Nora is pressing the metaphysical grounding issue.
