          *   (2) Sam: Sound logical distinction (Truth $\neq$ Necessity). Standard Ockhamist move.
          *   (3) Nora: Sound metaphysical challenge (Truthmaker Principle). Exposes the cost of Sam's view.
          *   (4) Sam: Weaker/Contestable. "Tensed facts" are controversial. Risks being ad hoc.
