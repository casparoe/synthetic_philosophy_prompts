  **STATUTORY INSTRUMENT 2026 No. 414**

  **ANIMALS WELFARE**

  **The Livestock (Moral Settlement) Regulations 2026**

  *Made by the Office for Animal Settlement pursuant to the Ethical Governance Act 2025*

  **Sir Alistair Halswell, KCB, Permanent Secretary, Office for Animal Settlement**

  **1. Classification of Sentients**
  (1) Moral patients are divided into Tier 1 (Persons) and Tier 2 (Sentients).
  (2) Tier 1 entities are subject to side-constraints; aggregation of welfare is prohibited.
  (3) Tier 2 entities are subject to aggregate welfare maximisation.

  **2. The Halswell Threshold**
  (1) The boundary between Tiers is defined by recursive self-awareness and moral agency.
  (2) Appeals regarding classification (e.g., infants, severely cognitively disabled persons, great apes) shall be reviewed by the Threshold Committee.
  (3) Pending review, edge cases are provisionally classified as Tier 1 to avoid constraint violation.

  **3. Welfare Maximisation Duty**
  (1) For Tier 2 entities, the Office must maximise net positive welfare experiences.
  (2) Existence is preferable to non-existence where life contains net positive utility.
  (3) The Office is obliged to expand the population of Tier 2 entities where aggregate welfare increases.

  **4. Replaceability and Cessation**
  (1) Termination of biological function is permissible provided the entity's life has been net positive.
  (2) Termination should occur at the point where future welfare probability declines below the replacement threshold.
  (3) The Bodmin Demonstration Herd shall model optimal lifespan variables for bovine subjects.

  **5. Genetic Modulation**
  (1) To maximise net welfare, the capacity for negative welfare events (suffering) may be genetically reduced.
  (2) Breeding programmes shall prioritise diminished nociceptive sensitivity where consistent with biological function.

  **6. Dietary Requirements**
  (1) Citizen consumption rates must align with herd optimisation models.
  (2) Vegetarianism reduces aggregate Tier 2 welfare by decreasing population size.
  (3) Mandatory protein quotas are hereby established to sustain the Bodmin Herd expansion.

  **7. Wild Population Management**
  (1) Wild sentient populations fall under Tier 2 aggregation.
  (2) Predation and parasitism constitute negative welfare events.
  (3) The Office shall intervene to minimise wild suffering, including predator sterilisation and parasite eradication.

  **ANNEX A: COSTINGS AND SENTIENCE MODELLING**

  | Item | Unit Cost (£) | Sentience Weighting |
  | :--- | :--- | :--- |
  | Bovine Life-Year | 450.00 | 0.6 |
  | Porcine Life-Year | 320.00 | 0.7 |
  | Insect Life-Year | 0.0004 | 0.01 (Estimated) |

  *Note: Insect weighting remains under consultation due to nervous system complexity variance.*

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Why must I eat meat?**
  A: Reduced demand lowers herd size, preventing net-positive lives from existing. This violates the Welfare Maximisation Duty.

  **Q: Is painless slaughter ethical?**
  A: For Tier 2, yes. Constraints do not apply. Only aggregate utility matters.

  **Q: What about wild animals?**
  A: Nature causes immense suffering. Non-intervention is neglect. Hedonic management is required.

  **8. Supplementary Provision: External Submissions**
  (1) A delegation claiming superior cognitive capacity has submitted a reciprocal white paper reversing Tiers 1 and 2.
  (2) This submission is filed as Out of Scope (Pending Consultation).

  ***

  **Note on Nozick's Commitments**

  Nozick's *Anarchy, State, and Utopia* explicitly suggests utilitarianism for animals while maintaining Kantian constraints for humans, though he treats this as a philosophical puzzle rather than policy. The claim that he advocates breeding animals with diminished capacity to suffer is contested; he floats the idea to test the logic of utilitarianism, not necessarily to endorse it as a programme. You supplied the premise that he explicitly floats breeding livestock; I adjusted this to "Genetic Modulation" to reflect the bureaucratic extrapolation rather than direct attribution. The sentence regarding "mandatory protein quotas" depends on the premise that replaceability obligates existence, which is a strong interpretation of utilitarianism often debated in EA circles. I flag the claim that Nozick endorses the "breeding" aspect as one I would not defend as textual fact; it is a logical extension you requested, treated here as administrative policy. The "delegation" clause mirrors the philosophical vulnerability of speciesism without asserting Nozick himself addressed it.
