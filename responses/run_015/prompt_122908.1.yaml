answer: |-
  **Tier 1 (High Bite):** 2, 6, 8
  **Tier 2 (Moderate):** 1, 3, 4
  **Tier 3 (Low/Flawed):** 5, 7

  **Dialectical Credit Allocation**

  1.  **0.15** — Multiple realizability suggests autonomy but permits disjunctive physicalist reductions that preserve substrate exclusivity.
  2.  **0.20** — It isolates semantic coherence as the variable leveraging disproportionate physical outcomes from negligible physical interventions.
  3.  **0.12** — Predictive success supports pragmatic realism but remains compatible with instrumentalism regarding ontological causation.
  4.  **0.10** — Naturalizing content avoids homunculi but does not strictly isolate causal efficacy from underlying structural dynamics.
  5.  **0.08** — It demonstrates syntactic efficacy but conflates structural presence with semantic content's causal role.
  6.  **0.15** — It dissolves the substrate's ontological privilege by revealing its own description as an abstract pattern over deeper layers.
  7.  **0.05** — It demands a counterfactual impossible under the supervenience relations non-reductive physicalists assert.
  8.  **0.15** — Explanatory indispensability regarding counterfactuals strongly implies ontological commitment beyond mere description.

  **Question-Begging Identification**

  Test 7 (The impossible-intervention test) is question-begging against the non-reductive physicalist. It demands holding the substrate fixed while varying the symbol, but if symbols supervene on the substrate, varying the symbol *just is* varying the substrate. The exclusivist claims victory because the test is impossible to run, while the autonomist claims the test is incoherent; thus, it presupposes the independence it seeks to prove rather than testing it.

  **Closing Reflection**

  My ranking would collapse if Test 6 (Bottom-dropping-out) failed—specifically, if a fundamental, non-abstract physical layer were discovered. If careenium ultimately rested on a bedrock of physics that did not itself drop out, the substrate would regain its ontological privilege, demoting Test 6 and elevating Test 1. This ranking betrays a prior commitment to non-reductive physicalism or causal pluralism; a strict eliminative materialist would view Tests 3 and 8 as merely pragmatic, denying that explanatory utility entails causal "shoving." Furthermore, the entire framework assumes "shoving" (efficient causation) is the correct metric, potentially obscuring formal or final causal explanations that the symbol level might better capture. If the dispute were framed around explanatory depth rather than causal leverage, Test 8 would dominate Tier 1, and Test 2 would lose its primacy.
