answer: |-
  **JOINT STATEMENT ON THE STATUS OF THE POVERTY OF THE STIMULUS ARGUMENT IN LANGUAGE ACQUISITION**

  **PREAMBLE**

  This document records the outcomes of a year-long adversarial collaboration between proponents of linguistic nativism and proponents of domain-general learning. The signatories represent two camps: the **Nativist Camp**, which holds that a child's linguistic input underdetermines the grammar, necessitating a substantial, species-specific linguistic endowment; and the **Empiricist Camp**, which holds that rich input combined with general-purpose statistical, semantic, and pragmatic inference is sufficient for acquisition. The purpose of this statement is not to resolve the dispute, but to delineate the exact boundaries of agreement, disagreement, verbal confusion, and empirical cruxes.

  **1. AGREED CLAIMS**

  Both camps affirm the following propositions. Signing this document does not require either camp to abandon its core theoretical commitments.

  1.  **Logical Form of the Argument:** Both camps agree that the Poverty of the Stimulus (POS) is a gap argument of the following logical form:
      *   (P1) Children attain linguistic state *L* (knowledge of grammar).
      *   (P2) The available evidence *E* (linguistic input) is insufficient to determine *L* given a learner with capacity *C*.
      *   (C) Therefore, the learner must possess additional capacity *X* (innate structure or bias) such that *E + X* determines *L*.
      Both camps concede that the force of this argument depends entirely on the width of the space of candidate grammars and the power of the candidate inference strategies assumed in P2.

  2.  **Necessity of Inductive Bias:** Both camps agree that no system can learn from finite data without inductive bias. There is no "blank slate." The disagreement is not about whether learning is constrained, but about the specificity of those constraints. The question is whether the constraints required to bridge the gap in P2 are specifically linguistic (representing grammatical categories and rules) or domain-general (representing statistical, cognitive, or communicative preferences).

  3.  **Nature of the Input:** Both camps agree that the linguistic input available to children is far richer than the slogan "degenerate and finite" implies. It includes prosodic information, situational context, eye gaze, and pragmatic intent. Furthermore, both camps agree that absence from a sufficiently large sample can, in principle, carry negative information (statistical preemption), provided the learner has the capacity to track such absences and the expectation that relevant data would appear if it were grammatical.

  4.  **Confounded Evidence:** Both camps agree that certain famous cases historically cited in this debate are too confounded to carry decisive weight. Specifically, both agree that cases of extreme social deprivation (e.g., the case of "Genie") cannot distinguish between linguistic innateness and general cognitive impairment, as the deprivation affected non-linguistic cognitive and social capacities simultaneously. Similarly, both agree that early interpretations of immediate creolization in emergent sign languages require careful longitudinal control to distinguish between individual invention and cultural transmission.

  **2. DISAGREEMENTS TABLE**

  The following table summarizes the substantive disagreements. Each row presents the issue neutrally, followed by the specific formulation held by each camp.

  | Issue | Neutral Restatement | Nativist Formulation | Empiricist Formulation |
  | :--- | :--- | :--- | :--- |
  | **Granularity of Proof** | At what level must the gap argument be demonstrated? | The argument must be run construction-by-construction. We must identify specific syntactic principles (e.g., structure dependence, island constraints) that are universally held but untriggered by input. | The argument should be run globally. We must assess whether the total learning trajectory, including error patterns and timing, can be modeled by a general system without positing specific rules for each construction. |
  | **Definition of Innateness** | What does it mean to claim a trait is innate? | Innateness implies genomic encoding of linguistic information. The bias must represent linguistic primitives (e.g., noun, verb, c-command) that are not reducible to sensory or conceptual primitives. | Innateness should be understood as canalized development. A trait is innate if it emerges reliably across normal environments, even if the underlying mechanism is domain-general interaction between cognition and environment. |
  | **Sufficiency of Domain-General Biases** | Can non-linguistic biases bridge the gap? | No. General statistical learning cannot recover abstract syntactic structures from the available data without collapsing into computational intractability or overgeneration. | Yes. Biases toward pattern finding, intention reading, and sequence prediction, when applied to the rich multimodal input, are sufficient to converge on adult grammar. |
  | **Weight of Uniformity and Speed** | How much evidentiary weight rests on the speed and uniformity of acquisition? | High weight. The rapidity and cross-linguistic uniformity of acquisition, even under degraded input conditions, indicate a specialized biological organ dedicated to language. | Moderate weight. Uniformity reflects shared human cognition and shared social environments. Speed reflects the high motivational salience of communication and the efficiency of general learning mechanisms. |

  **3. NOTE ON VERBAL DISPUTES**

  A portion of the disagreement is verbal, centering on the definition of "innate" and the boundary of "input."

  *   **The Verbal Component:** The Nativist Camp often uses "innate" to mean "represented in the genome as linguistic information." The Empiricist Camp often uses "innate" to mean "species-typical outcome not requiring explicit instruction." Similarly, the Nativist Camp often defines "input" as the acoustic-linguistic signal plus immediate context. The Empiricist Camp often defines "input" to include the output of the child's own domain-general cognitive processing capabilities.
  *   **The Surviving Substantive Question:** Once these terms are disentangled, a substantive computational question remains: **Are the computational mechanisms required to map the available sensory data to adult grammatical competence unique to the language faculty, or are they instances of mechanisms used in other cognitive domains (e.g., vision, motor control, social reasoning)?** If the mechanisms are unique, the Nativist position holds substantively. If the mechanisms are shared, the Empiricist position holds substantively, regardless of whether those shared mechanisms are called "innate."

  **4. CRUXES AND PREDICTIONS**

  The following are empirical cruxes where the camps diverge on predictions. Both camps agree that the outcomes of these tests would bear significantly on the dispute.

  **A. Acquisition Under Degraded Channels**
  Both camps agree that blindness and motor speech deficits do not discriminate between the theories, as both camps predict syntax will be acquired in these cases (blind children hear; non-speaking children comprehend). The discriminative case is **emergent sign systems** (e.g., home sign or new sign languages arising in school settings).

  *   **Nativist Prediction:** Structural complexity (recursion, hierarchical embedding) will appear in the first generation of learners, even without a model to copy, because the internal linguistic endowment generates the structure.
  *   **Empiricist Prediction:** Structural complexity will emerge gradually over generations or require intense social interaction, driven by communicative pressure and general cognitive biases toward iconicity and efficiency, not by a pre-existing syntactic template.

  **B. The Large Language Model (LLM) Case**
  Both camps agree that the performance of generic neural architectures trained on next-token prediction bears on the crux. The disagreement concerns the interpretation of the architecture, the data scale, and the competence measures.

  *   **The Agreed Test:** Train a generic sequence-learning architecture (not hand-engineered with linguistic priors like tree-structures) on a corpus that matches the **volume and distribution of child-directed speech** (approximately 5–10 million words, with repetition and social grounding proxies), rather than internet-scale text.
  *   **Nativist Prediction:** The model will fail to acquire subtle, abstract syntactic constraints (e.g., auxiliary fronting in questions, binding principles) that human children acquire. It will rely on surface statistics and fail on out-of-distribution syntactic generalizations.
      *   *Interpretation of Success:* If the model succeeds, Nativists will argue the architecture itself (e.g., attention mechanisms) constitutes a domain-specific linguistic prior, or that the test measures performance rather than competence.
  *   **Empiricist Prediction:** The model will acquire these constraints, potentially requiring somewhat more data than a human child but within biologically plausible limits given the lack of multimodal grounding in the test.
      *   *Interpretation of Failure:* If the model fails, Empiricists will argue the architecture lacks the necessary multimodal grounding (vision, action) that constitutes the "rich input" humans receive, not that a linguistic module is missing.

  **5. FALSIFICATION CONDITIONS**

  Each camp specifies the finding it would count as evidence against its own position, stated in its own voice.

  **Nativist Camp Falsification Condition:**
  "We would abandon the core nativist hypothesis if a domain-general learning system, lacking any linguistic primitives (such as 'noun,' 'verb,' or 'phrase structure'), successfully acquires the full range of human syntactic competence from a dataset strictly limited to the volume and type of input available to a human child. The system must demonstrate knowledge of abstract constraints that are not explicitly present in the training data and cannot be derived from semantic plausibility alone."

  **Empiricist Camp Falsification Condition:**
  "We would abandon the core domain-general hypothesis if a specific syntactic principle is identified that is universal across all human languages, is acquired by children despite a total lack of positive or negative evidence regarding that principle, and is shown to be computationally unlearnable by any system lacking a dedicated linguistic module. Furthermore, this principle must be linked to a specific genetic or neurobiological marker that is distinct from those governing general cognition or communication."

  **6. CONCLUSION ON UNSETTLABLE DISPUTES**

  We acknowledge that one aspect of the disagreement may not be settled by empirical test alone: the **description of the hypothesis space.** If the Nativist Camp defines the "linguistic module" as whatever computational difference remains after domain-general learning is accounted for, the claim becomes tautological. If the Empiricist Camp defines "domain-general" broadly enough to include any biological constraint on neural wiring, their claim becomes tautological. We agree that progress requires independent measurement of the cognitive mechanisms involved, rather than inference from the outcome of acquisition alone. Until the computational mechanisms are independently identified and localized, the dispute will retain a theoretical component that data alone cannot resolve.

  ***

  **Signed,**

  **The Nativist Camp**

  **The Empiricist Camp**
