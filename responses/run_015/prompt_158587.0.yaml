answer: |-
  Here is the stance I am committing to for this interview: **Collapse is not the disappearance of people, but the disintegration of interdependency.** When the "bookkeeping stops," it isn't just administrative bloat vanishing; it is the nervous system of specialization being severed. The grain keeper's city doesn't need to burn for collapse to be real; it only needs to become impossible to move surplus grain from the delta to the hills without a central authority guaranteeing the road. That loss of resilience makes the average life more precarious, even if the population remains stable.

  Here are ten questions designed to test that against your guest's revisionism.

  ### 1. The Bookkeeping Line
  **Question:** You argue that "nothing collapsed, the bookkeeping stopped." But in my narrator's world, the bookkeeping *is* the mechanism that moves the grain from the field to the famine zone. If the ledger stops, does the grain still move? If the answer is no, then isn't the "bookkeeping" actually the infrastructure itself?
  **Follow-up:** If she says the grain moves via informal networks: "At what volume? Does an informal network handle a regional drought the way a centralized granary does, or does it just handle a bad week?"
  **Line in the Sand:** If she can demonstrate that informal, non-literate trade networks moved surplus calories *more* efficiently than the state apparatus did, I abandon the idea that administrative loss equals fragility.

  ### 2. The Bronze Age Synchronization
  **Question:** Regarding the Late Bronze Age collapse: was that one thing with one trigger, or a regional pattern with a dozen local causes that we've stitched together mostly because our chronology is too coarse to tell the difference?
  **Follow-up:** If she says "regional pattern": "If the causes are local, why do we insist on calling it a single 'Collapse'? Are we imposing a narrative arc on what was just a century of bad luck across different time zones?"
  **Line in the Sand:** If evidence shows the disruptions in Greece, Anatolia, and the Levant were separated by more than two generations, I abandon the "Systemic Collapse" model in favor of "Contagious Failure."

  ### 3. The Maya Continuity
  **Question:** In the Maya lowlands, the people, the language, and the northern cities plainly kept going. What work is the word "collapse" still doing in that case, and for whom? Is it only a collapse if you're a king?
  **Follow-up:** If she says "it's just elite failure": "Then why do we see evidence of malnutrition and violence in the commoner skeletons of that period? If the kings fall and the peasants starve, why are we protecting the peasants by calling it 'transformation'?"
  **Line in the Sand:** If skeletal evidence from the "collapse" period shows improved health metrics compared to the "classic" period, I concede that "collapse" is an elite-centric bias.

  ### 4. Easter Island and Ecocide
  **Question:** If the revised chronology is right and the settlement was later and the forest went fast, does the moral of that story survive, or does it turn into something closer to bad luck plus rats?
  **Follow-up:** If she says "rats plus luck": "Does that let the society off the hook? If they didn't cut the trees, but they also didn't build a system to protect the trees from rats, is that not still a failure of adaptation?"
  **Line in the Sand:** If the deforestation is proven to be entirely climatic or purely faunal (rats) with zero human agency, I abandon the "ecocide as warning" narrative entirely.

  ### 5. Welfare vs. Complexity
  **Question:** When the monuments stop and the trade routes shift and the skeletons get shorter or healthier, which of those is the collapse, and why privilege complexity over bodies?
  **Follow-up:** If she says "bodies matter more": "So if a collapse leads to better nutrition because the tax burden is gone, should we view that collapse as a net positive? Are we mourning the palace or the person?"
  **Line in the Sand:** If data consistently shows that post-collapse populations have higher life expectancy and lower trauma rates than pre-collapse populations, I abandon the idea that collapse is inherently negative.

  ### 6. The Ledger Criterion (Your Heuristic)
  **Question:** I have a rule: a polity is finished when nobody is writing the same things down for the same reasons anymore. Is that a definition of death, or just a symptom of a coma?
  **Follow-up:** If she says "symptom": "At what point does the symptom kill the patient? If the ledger changes from 'tax receipt' to 'private deed,' hasn't the social contract fundamentally changed, regardless of the ink?"
  **Line in the Sand:** If she can show a society where the *content* of the ledger changed radically (e.g., from state tax to temple offering) but the *distribution of goods* remained identical, I abandon the Ledger Criterion.
  **[EVASIVE FLAG]**: **Expect her to dodge this by calling it "semantic."** She will argue that "same reasons" is subjective. **Push past it by asking:** "Don't give me semantics. Give me mechanics. If the scribe is no longer paid by the king but by the merchant, who commands the grain when the river floods? If the answer changes, the polity has changed."

  ### 7. The Ninety-Year Rule (Your Heuristic)
  **Question:** My second rule is that whatever happened took longer than one working life, so no character in my book could ever experience it as an event at all. Is that simply wrong? Should a novelist care at all about the difference between failure and transformation if the character can't see the horizon?
  **Follow-up:** If she says "you're wrong, they felt it": "How? If the tax rises 1% a year and the wall crumbles one stone a year, when is the moment they can point to and say 'today the empire ended'?"
  **Line in the Sand:** If she provides archaeological evidence of a "destruction layer" that is universally dated to less than a decade across the region, I abandon the Ninety-Year Rule.

  ### 8. The Port City Specifics
  **Question:** My narrator is in a port city. In your view, do ports collapse last because they can trade for survival, or first because they depend on the very networks that are snapping?
  **Follow-up:** If she says "they depend on networks": "Then is the port the safest place to be, or the most vulnerable? If the empire stops paying the garrison, does the port get sacked, or does it just quietly become a different country?"
  **Line in the Sand:** If historical data shows port cities in collapsing regions maintaining pre-collapse population levels while hinterlands depopulate, I abandon the "interdependency" model for a "resilient node" model.

  ### 9. The Definition of "Event"
  **Question:** You say collapse is a process. But if the garrison doesn't get paid, they mutiny. That's an event. Are we confusing the *cause* of collapse (process) with the *experience* of collapse (event)?
  **Follow-up:** If she says "experience is subjective": "But violence is objective. If the mutiny burns the warehouse, does it matter to the ledger-keeper that the decline started eighty years ago?"
  **Line in the Sand:** If she concedes that while the *structural* decline is long, the *human* experience is punctuated by discrete violent shocks, I will accept "collapse" as a valid descriptor for the shocks, not the process.

  ### 10. The Utility of the Word
  **Question:** Finally, if we ban the word "collapse" because it implies a moral failure or a sudden end, what word do we use that captures the loss of capacity without implying the death of people?
  **Follow-up:** If she says "transformation": "'Transformation' sounds voluntary. 'Degradation' sounds biological. If I want to write about a world that is becoming *less capable* of saving its own people, am I forbidden from using the C-word?"
  **Line in the Sand:** If she offers a term that accurately describes "loss of systemic resilience without population loss," I will adopt it and drop "collapse." If she doesn't, I keep "collapse."

  ***

  ### Note on the Evasive Flag (Question 6)
  I flagged **Question 6 (The Ledger Criterion)** as the most likely point of evasion. Archaeologists often retreat into "functional equivalence" arguments (i.e., "the temple took over the state's role, so it's the same system").
  **How to push past it:** Do not accept "function" as an abstract concept. Anchor it in **liability**. Ask: "If the grain rots, who is liable?" In a state system, the state absorbs the loss. In a private system, the merchant passes the cost to the buyer. If the liability shifts, the *polity* has changed, even if the grain moves. Force her to admit that the *risk profile* of the average citizen has changed, which validates your definition of "finished."
