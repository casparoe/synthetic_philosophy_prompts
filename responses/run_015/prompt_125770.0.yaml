  "market pricing over equal-ration over hereditary-use in the market frame" -> M > C > H.
  "equal-ration over hereditary-use over market pricing in the council frame" -> C > H > M.
  "hereditary-use over market pricing over equal-ration in the ritual frame" -> H > M > C.
  This is a perfect intransitive loop if aggregated. Voss says: Don't aggregate. Chen says: You must to explain the agent.

  Okay, ready to write.

  *(Final thought on the Test)*: The test needs to be about *novel* frames. If utility is just a bookkeeping index of past choices in a frame, it can't predict a new frame. If it's a mental state, it might. Or, conversely, if the institutional cues in a new frame perfectly predict the choice without knowing the mental state, Voss wins. Let's make it about a "Drought Emergency" frame which mixes elements.

