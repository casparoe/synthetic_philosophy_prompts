answer: |-
  **Setting:** *A quiet corner of the faculty lounge at the Institute for Economic Philosophy. Coffee cups are cold. Dr. Elena Voss is整理ing a stack of field notes; Dr. Marcus Chen leans forward, elbows on knees.*

  **Dr. Elena Voss:** Marcus, look at the data from the Andean cooperative again. You're treating the intransitivity as a bug. I'm telling you it's the feature. In the market frame, they choose Pricing over Rationing over Ritual. In the council frame, Rationing over Ritual over Pricing. In the ritual frame, Ritual over Pricing over Rationing. Within each frame, the choices are consistent. Transitivity holds locally.

  **Dr. Marcus Chen:** Transitivity holds locally only because you've sliced the domain so thinly you've severed the agent. Elena, if I choose A over B in the kitchen, and B over C in the garage, and C over A in the study, you don't say I have three utility functions. You say I'm confused, or I'm maximizing different *values* that reside in a single mind. Revealed preference theory claims to explain choice. If the "preference" disappears the moment I step out of the institutional frame, it's not explaining the choice; it's just labeling the outcome.

  **Voss:** It's not labeling; it's representing. Samuelson's point was precisely to avoid the black box of the mind. We observe choices under constraints. In the market frame, the constraints and signals prime a specific objective function. In the ritual frame, a different one. The preference relation is not a property of the *person*; it's a property of the *person-institution dyad*. To demand a cross-frame identity for utility is to demand a ghost in the machine. The data shows no confusion, no regret. The agents are perfectly satisfied. Why posit a psychological crisis where there is none?

  **Chen:** Because satisfaction isn't explanation. If utility is purely a bookkeeping device for local choices, it loses its predictive power. That is the job of utility: to tell us what happens when the constraints shift. Suppose the cooperative faces a drought—a new frame. It's not purely market, not purely council, not purely ritual. It's a crisis hybrid. If utility is just a local index, you have no basis to predict their allocation choice. You have to wait and see what they do, then write a new function. That's not science; it's stamp collecting.

  **Voss:** I can predict it. I look at the institutional cues present in the drought scenario. If the drought triggers emergency council bylaws, I use the council utility function. If it triggers water trading rights, I use the market function. The "frame" isn't magic; it's a set of observable institutional rules. I don't need to know their internal normative state to know which rulebook they are playing by. You're insisting that the *same* utility metric must apply across all rulebooks. But why? That's a metaphysical commitment to a unified self, not an economic necessity.

  **Chen:** It's an explanatory necessity. You say the "rulebook" determines the function. But who interprets the rulebook? In your drought scenario, suppose the bylaws are ambiguous. The market signal says "hoard," the ritual signal says "share." The members choose to share. Why? Your model says, "Because they are in a frame where sharing is revealed." Circular. My model says, "Because they hold a deeper evaluative commitment to community survival that outweighs efficiency when stakes are existential." That commitment is a mental state. It has cross-frame identity. It exists in the market frame (suppressed), the council frame (active), and the ritual frame (dominant).

  **Voss:** You're reifying that "commitment" as a cause. I see it as just another constraint. In the drought frame, the cost of social ostracization for hoarding skyrockets. The relative price of "efficiency" changes. I can model that without invoking a "normative structure." I just adjust the local utility function to reflect the new trade-offs. If I can predict the choice by adjusting the institutional parameters, why am I required to posit a stable mental anchor? It's ontologically extravagant.

  **Chen:** Because parameters don't move themselves. The "cost of social ostracization" only skyrockets because the agents *value* their standing in a specific way. You're smuggling psychology in through the back door of "parameters" while claiming purity on the front. Here is the crux: If utility has no cross-frame identity conditions, it cannot do the explanatory work economists ask of it. You cannot explain *why* the frame shifts occur. Why do they switch to the ritual frame during planting season but the market frame during harvest? There is a stable hierarchy of values governing the *selection of the frame* itself. Revealed preference, as you define it, is blind to that meta-choice.

  **Voss:** I grant that frame selection is a choice. And that choice can be modeled via revealed preference too. They choose the Ritual frame over the Market frame when the expected utility of the Ritual frame (in terms of social cohesion, risk mitigation, etc.) is higher. It's utility all the way down, just indexed to the relevant register. You keep insisting that "Utility" with a capital U must be a singular, psychological scalar. I'm arguing it's a vector of local indices. The fact that they cycle M > C > H > M globally doesn't violate rationality; it violates your assumption that rationality requires a single, global ordering.

  **Chen:** But if it's a vector of local indices, what binds the vector? If I can predict your behavior in the market, but I learn nothing about your behavior in the council, the concept of "your preference" has evaporated. It becomes "the cooperative's preference in context X." You've saved the theory by dissolving the agent. I'm arguing that what remains constant is not the ordering of water schemes, but the *weighting of underlying principles*—efficiency, equity, tradition. The revealed preference framework cannot capture those principles because it only sees the final output, not the internal weighting mechanism.

  **Voss:** And I argue that the "weighting mechanism" is inaccessible and unnecessary. If I can predict the output based on the institutional input, the mechanism is irrelevant. You claim my utility is vacuous without mental anchors. I claim your mental anchors are unobservable metaphysics that add no predictive value. You say I can't predict the drought response. I say I can, provided I know the institutional triggers. You say I need to know their "commitment to survival." I say that commitment is just a label for the fact that they choose survival.

  **Chen:** That's where we hit the wall. You say "commitment" is just a label for the choice. I say the choice is the evidence of the commitment. The difference matters for the drought test. If you are right, and utility is purely local, then in a novel frame where institutional cues are mixed or contradictory, behavior should be erratic or indeterminate until a new local equilibrium is established. If I am right, and there is a stable internal normative structure, behavior should align with the dominant internal value even if the institutional cues are ambiguous.

  **Voss:** So, you're proposing we test for stability in ambiguity.

  **Chen:** Precisely. We construct a "Hybrid Frame." We present the cooperative with a water allocation problem where the market rules suggest one outcome, the ritual rules suggest another, and the council rules a third, but we explicitly obscure which institutional authority is currently in charge. We remove the clear "frame" cues.

  **Voss:** Okay. If I am right—if preference is register-relative—then without a clear register, there is no defined utility function. We should see randomization, or behavior that tracks the most salient *immediate* payoff, because the "bookkeeping" requires a clear ledger.

  **Chen:** And if I am right—if utility refers to an internal normative structure—then we should see convergence. Even without clear institutional cues, the members should converge on the option that satisfies their deepest, cross-frame evaluative commitment. The "mental anchor" will guide the choice where the institutional map is blank.

  **Voss:** I accept that test. But I add a condition. We must be able to define the "salient immediate payoff" independently of their mental states. If the "internal commitment" you predict is just inferred from the choice they make in the hybrid frame, you've committed the same circularity you accused me of. You need to measure the "normative structure" *ex ante*, via survey or psychometric evaluation, independent of the choice data.

  **Chen:** Agreed. We measure the normative weights—efficiency vs. equity vs. tradition—via independent elicitation methods before the hybrid trial. If those weights predict the hybrid choice better than the institutional cues alone, the mental-state anchor is necessary. If the institutional cues (even ambiguous ones) predict the choice better, or if the choice is random, then utility is indeed purely a local, institutional index.

  **Voss:** Then we have our protocol. A hybrid allocation task with obscured institutional authority, paired with independent elicitation of normative weights.

  **Chen:** One last stipulation. If the normative weights predict the choice, you must concede that revealed preference is incomplete—it describes the *what*, but not the *why*.

  **Voss:** And if the institutional cues predict the choice despite contradictory normative weights, you must concede that the "internal structure" is epiphenomenal. The institution writes the utility function, not the mind.

  **Chen:** Deal.

  **Voss:** Deal. Now, let's draft the proposal before the coffee gets any colder.
