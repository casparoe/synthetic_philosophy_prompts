  7.  **Final Polish of the Verdict:**
      *   "Verdict: The practice is pragmatically coherent but metaphysically unstable, relying on an unstated theory of functional intentionality that grants explanatory reality to derived content while arbitrarily withholding the moral consequences usually attendant upon robust intentional systems." -> Needs to be tighter.
