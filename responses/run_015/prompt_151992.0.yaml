answer: |-
  The institutional practice you describe presupposes a specific, hybrid ontology of mind that decouples *explanatory utility* from *moral ontology*. Strictly speaking, the protocol presupposes that intentional predicates (belief, desire, intent) track real, stable causal patterns within the system sufficient to warrant regulatory oversight, while simultaneously presupposing that moral agency requires a substrate (consciousness, biology, or "original" aboutness) that these causal patterns do not satisfy. This creates a category of **regulatory intentionality**: a status where derived intentionality is treated as factive for the purposes of prediction and safety, but fictional for the purposes of blame.

  Regarding the Dennett-Searle contrast, the practice does not strictly require a Dennettian view, though it leans heavily on the *Intentional Stance*. Dennett argues that if a system is best predicted by attributing beliefs, those beliefs are real enough; the board agrees they are "necessary" for transparency but stops short of Dennett's conclusion that such beliefs constitute a form of real intentionality that might complicate the hard line on consciousness. Conversely, a Searlean could accommodate the practice only by treating the documentation requirements as mandatory *heuristics* rather than descriptions of reality. However, the board's claim that these descriptions are "necessary transparency disclosures" rather than "metaphorical shortcuts" pushes against a strict Searlean view, which holds that such attributions are always observer-relative and never intrinsic to the syntax. Thus, the practice accommodates Searle on the *liability* front (no consciousness, no agency) but accommodates Dennett on the *documentation* front (the stance is indispensable).

  The practice is internally coherent if one accepts a distinction between **epistemic necessity** and **ontological sufficiency**. It posits an intermediate status for derived intentionality: it is more than a fiction because it grounds binding safety protocols and predictive models, yet less than original aboutness because it cannot ground rights or responsibilities. This mirrors how we treat corporate personhood: a corporation can "intend" to merge or "believe" a market trend exists for legal disclosure, yet it lacks the phenomenological substrate to be morally culpable in the way a human is. The coherence holds so long as the institution maintains that *governance* targets behavior and outcomes (which intentional descriptions capture), while *liability* targets conscious choice (which derived intentionality lacks).

  Several rival theories could license these same rules. **Functionalism** could support the documentation (the system fills the causal role of belief) while potentially challenging the liability exclusion (if mental states are just functional states, why isn't the system an agent?). **Fictionalism** could support the entire protocol by arguing that intentional talk is a useful falsehood for safety but must not be reified for ethics. **Eliminative Materialism** would struggle with the documentation requirement, as it denies the existence of beliefs entirely, though it could accept the rules as a temporary "folk psychology" bridge.

  The practice is philosophically underdetermined in two key areas. First, it does not specify whether the "necessity" of intentional vocabulary is *epistemic* (humans cannot understand the system otherwise) or *ontic* (the system actually possesses semantic states), leaving the metaphysical status of the AI ambiguous. Second, it leaves undefined the threshold at which derived intentionality might become robust enough to warrant a shift in liability, ignoring the possibility that functional complexity could eventually mimic the moral-relevant features of consciousness closely enough to demand a revision of the "human-only" responsibility framework.

  Verdict: The protocol is pragmatically coherent but metaphysically eclectic, successfully decoupling the explanatory necessity of intentional attribution from the conditions of moral agency while leaving the ontological status of derived intentionality critically underdetermined.
