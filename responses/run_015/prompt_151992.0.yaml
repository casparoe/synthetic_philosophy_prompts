      *(Self-Correction on "Presupposed"):* Strictly speaking, the practice presupposes that intentional language is *indispensable* for safety/transparency. It does not strictly presuppose Dennett's realism, but it presupposes the *utility* of the intentional stance is high enough to be mandatory. It accommodates Searle by denying the consciousness.

      *(Refining the "Intermediate Status"):* The prompt asks if it commits to an intermediate status. Yes, it treats derived intentionality as "regulatory real" but "moral fiction."

