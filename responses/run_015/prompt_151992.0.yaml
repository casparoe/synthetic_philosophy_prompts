  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to say Dennett *requires* original intentionality. Dennett denies the distinction is as sharp as Searle thinks. The practice *keeps* the distinction (derived for docs, original denied for liability). This actually aligns more with a *pragmatic hybrid* than pure Dennett.
      *   *Nuance:* The practice treats derived intentionality as *normatively real* (you must account for it) but *metaphysically unreal* (you can't blame it). This is similar to how we treat "corporate intent."
      *   *Key Insight:* The practice presupposes that *predictive power* does not entail *moral standing*. This is the core philosophical commitment.

