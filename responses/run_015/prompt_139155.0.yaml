  **Ask Aunt Effie**

  The postbag thuds onto the mat. It seems to me that I am tired, though strictly speaking, the fatigue is merely a shadow cast by certain chemical depletions in the brain stem. It also seems I am writing this to help you, but the neurons firing in my motor cortex are the true authors. The feeling of benevolence rides along on the signal, powerless to alter the route. Still, here we are. The rain is lashing against the windowpane, and the kettle boils regardless of whether I watch it.

