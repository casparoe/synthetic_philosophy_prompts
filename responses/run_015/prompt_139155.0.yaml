  **Dear Aunt Effie,**
  *My boyfriend says your column refutes itself. He says if you can write advice, feelings must do things. Should I be worried?*
  **— Sarah, Leeds**

  Dear Sarah,
  He is reaching for a technical term, I suspect. Something like 'qualia'. He argues that if these words alter your behaviour, then consciousness has causal power. But consider: the ink dries on the page regardless of whether it is read. If you change your habits, it is because the visual processing of black marks triggered a motor response. The feeling of understanding is just a glow on the dashboard. Worry is a physical state; one may experience it if the chemistry demands, but know it changes nothing. The column does not refute itself; it merely describes the smoke while the engine runs on.

  **Dear Aunt Effie,**
  *Lab tech here. Participant keeps pressing the button marked 'sharp'. What are the presses evidence of?*
  **— Dave, Cambridge**

  Dear Dave,
  They are evidence of nerve impulses reaching the finger. They are not evidence of pain. Pain is the silent film projected alongside the action. The button press is the reality; the ouch is the subtitle. You record the press. The rest is commentary.

  **Dear Aunt Effie,**
  *I've been diagnosed with 'occult sensory dissociation'. The neurologist says on some days my experiences switch off for hours. Behaviour same, scans same, reports sincere. How could anyone find out? Does it matter?*
  **— J., London**

