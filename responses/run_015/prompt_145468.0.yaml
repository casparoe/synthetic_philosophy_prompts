      *   *Reply Strategy:* Keep them under 2 minutes spoken (approx. 250-300 words). Acknowledge validity, pivot back to core thesis.
      *   *Soft Spots:* Be honest about where the argument is weak (e.g., defining "institutional channels" in autocracies).
      *   *Concessions:* What to give away to save the core argument? (e.g., admitting performance *stabilizes* regimes, even if it doesn't *legitimize* them normatively).

