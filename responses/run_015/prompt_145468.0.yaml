  4.  **Drafting the Prep Sheet (Iterative Process):**

      *   *Structure:* Introduction -> Objection 1 (The Measurement/Definition Clash) -> Objection 2 (Operationalization) -> Objection 3 (The Normative Challenge) -> Objection 4 (The China/Singapore Empirical Pushback) -> The "Dreaded Question" -> Strategic Concessions.
