answer: |-
  There is no single, canonical term in linguistics or philosophy of language that captures this specific phenomenon as neatly as you describe it. While scholars discuss "reclamation," "appropriation," and "pejorative semantics," the precise grammatical boundary you have identified—where a word is licensed in modifying positions but restricted in classifying positions—is usually treated as a matter of pragmatic nuance rather than a defined structural rule.

  Since you have asked for the carving more than the label, but requested a term if one does not exist, I will coin the term **"Reclamation Scope Asymmetry"** to describe this.

  Here is the breakdown of the distinction, the mechanism of the offense, the edge cases, and what this implies for the nature of derogation.

  ### 1. The Carving: Attributive vs. Predicative
  The distinction is syntactic on the surface, but semantic in its effect. It divides usage into two scopes:

  *   **Attributive/Modifying Scope (Safe):** The reclaimed word functions as an adjective or a noun adjunct modifying a concept, artifact, or collective.
      *   *Examples:* "Queer theory," "crip space," "the queer community," "dyke TV."
      *   *Function:* Here, the word describes a **perspective, aesthetic, or cultural context.** It signals that the noun following it is viewed through a specific lens or belongs to a specific cultural sphere.
  *   **Predicative/Classifying Scope (Restricted):** The reclaimed word functions as a predicate adjective or a head noun applied to an individual.
      *   *Examples:* "She is queer," "He is a crip," "That dyke over there."
      *   *Function:* Here, the word assigns an **identity or essence** to a specific human subject.

  ### 2. The Mechanism: Why the Offense Persists
  If the word is reclaimed, why does the predicative use still sting when spoken by an outsider? The offense is not about the *reference* (both uses point to the same group); it is about **agency and reduction.**

  **A. Tool vs. Label**
  In the Attributive Scope ("queer politics"), the word is being used as a **tool**. The speaker is acknowledging a framework. It implies, "I am engaging with the intellectual or cultural work produced by this group."
  In the Predicative Scope ("she is queer"), the word is being used as a **label**. The speaker is engaging in an act of classification. When an outsider classifies an insider, it replicates the historical power dynamic of the slur: the power to name, to define, and to categorize someone else's body or identity from the outside.

  **B. Essentialization**
  The predicative use tends to be essentializing. To say "He is a crip" makes the disability the primary ontological fact of the person. To say "crip theory" treats the disability experience as a vantage point for analysis.
  Outsiders are generally granted license to acknowledge the *existence* of the culture (Attributive) but denied the authority to define the *essence* of the individual (Predicative). The latter feels like a reduction of a complex human to a single trait, which is the core harm of the original slur.

  **C. The "Echo" Problem**
  You noted that a colleague might get the first half of a sentence right and the second half wrong. This happens because the Attributive use signals allyship ("I know the term 'crip theory'"), which lowers the listener's guard. The switch to Predicative use ("...so he is a crip") suddenly shifts the speaker from an observer of the culture to an arbiter of the individual's identity. The offense is the sudden reassertion of outsider authority.

  ### 3. Edge Cases and Boundaries
  The Reclamation Scope Asymmetry helps predict the friction points in the examples you raised:

  *   **Plural Self-Descriptions ("Queers"):** Using the plural noun ("queers are everywhere") is often riskier than the singular adjective ("queer politics"). Pluralizing turns people into a countable mass. It is a classifying move, edging toward Predicative Scope, and is often rejected by the community when used by outsiders, even if the singular modifier is accepted.
  *   **Echoing Self-Application:** If an insider says, "I am a crip," and an outsider repeats, "Yes, you are a crip," it can feel validating or violating depending on tone. However, if the outsider initiates ("You are a crip, right?"), it violates the asymmetry. The insider has the right to move the term from Attributive (culture) to Predicative (self); the outsider generally does not.
  *   **Public Figures:** Saying "That politician is queer" is highly sensitive. Public figures are already objectified by the media. Applying a reclaimed predicative label to them can feel like "outing" or reducing their platform to their identity, whereas discussing "their queer policy platform" (Attributive) is usually safe.
  *   **Gradient of Reclamation:** *Queer* has moved further toward neutralization than *crip*. You will find more outsiders comfortably using "he is queer" than "he is a crip." However, the Asymmetry still holds: "queer cinema" is universally safe; "he is queer" remains context-dependent. *Crip* remains almost entirely locked in the Attributive Scope for outsiders.

  ### 4. Meaning vs. Use: The Philosophical Implication
  This phenomenon bears directly on your argument with your friend regarding whether derogation is part of the word's *meaning* or something the utterance *does*.

  **The Friend's Claim:** Derogation is something the utterance *does* (pragmatics/use).
  **The Counter-Claim:** Derogation is in the *meaning* (semantics).

  The Reclamation Scope Asymmetry strongly supports your friend's view, but with a crucial refinement.

  If the derogation were purely semantic (built into the truth-conditions of the word), then "crip theory" would be just as offensive as "he is a crip." The word would carry the poison in every slot. The fact that the word is safe in one grammatical position and dangerous in another proves that the derogatory force is not static; it is activated by the **structure of the utterance.**

  However, it also shows that "use" is not merely "context" in the vague sense (who is listening, how sympathetic the speaker is). The "use" is governed by **structural rules.**

  This suggests a model of **Use-Conditional Meaning.** The word *crip* has a stable meaning, but its *expressive content* (its ability to offend or empower) is conditional on its syntactic role.
  *   In the **Attributive** role, the expressive content is "solidarity/recognition."
  *   In the **Predicative** role (by an outsider), the expressive content reverts to "classification/reduction."

  ### Summary
  You are not wrong to assume this is distinct from general context-sensitivity. It is a stable, predictable pattern.

  *   **The Term:** **Reclamation Scope Asymmetry.**
  *   **The Distinction:** It is syntactic in form (modifier vs. predicate) but pragmatic in force (acknowledging a culture vs. defining a person).
  *   **The Offense:** The offending use appropriates the authority to essentialize an individual, replicating the power dynamic of the original slur, whereas the acceptable use acknowledges a cultural framework without claiming authority over the people within it.
  *   **The Verdict on Meaning:** Derogation is not a fixed property of the word's definition, but it is also not random. It is a **structurally licensed force.** The word is a loaded gun that is safe when holstered (modifier) but dangerous when aimed (predicate).

  Your friend is right that the harm is in the *doing*, but you are right that the *rules of doing* are rigid enough to be predicted in advance. The disagreement likely stemmed from treating "context" as fluid when, in this specific domain, it is structural.
