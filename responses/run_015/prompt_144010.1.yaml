answer: |-
  Friends, colleagues, neighbors.

  Tomorrow, the trenches close. The earth returns to the family who has farmed this mound for generations. Tonight, we sit together not as excavators and laborers, but as partners who have shared four seasons of sun and dust.

  To the family: thank you for trusting us with your land. To the village elders: thank you for your patience. To the twenty-two men and women who worked with us, especially the eleven who have been here since the first season: you are the reason we found anything at all. You know the weight of the basket and the patience of the sieve better than any of us. This discovery belongs to your hands as much as our eyes.

  To the foundation officers: you asked us what we found. We found a storeroom sealed with clay. We found rooms where serving vessels were smashed and buried beneath floors. We found two people laid to rest under the hearth. But you want a sentence for a press release. You want a name, a date, a temple.

  Here is the truth: The earth keeps some secrets.

  We found no inscriptions. No images. No foundation deposits made to be read by us. My deputy teaches us a hard rule: some things are left to be seen; some things are left because life happened. The pots we found were not messages. They were tools. They were discarded, broken, reused. They tell us how people worked, how they stored grain, how they cared for their dead. They do not tell us what they prayed, or whether this mound was the shrine your oral history names.

  To the elders: You call this place sacred. The dirt does not contradict you, but it does not speak that name. Archaeology can prove a wall existed; it cannot prove a memory. Your history lives in your voices, not in our trenches. Do not look to us to validate what you already know.

  To the students: You want to believe broken pots reveal minds. I wish they did. But we cannot reconstruct belief from discard. We reconstruct practice. We know they organized labor. We know they valued certain vessels enough to smash them deliberately. We do not know why. To claim otherwise is to write fiction and call it science.

  So, what is the headline? It is not "Temple Found." It is "Lives Lived." We uncovered the architecture of cooperation. We found evidence of a community complex enough to store surplus and careful enough to bury their dead beneath their homes. That is not a myth. It is a testament to human order.

  Tomorrow, the mound goes back to the plough. The barley will grow where we dug. Our work is not to claim the land, but to listen to it while it speaks. It has spoken quietly this season. But we have heard enough to know that people here lived with purpose, even if we cannot name their gods.

  Thank you for letting us listen. Thank you for the work. And thank you for the dinner.

  ***

  **Note**

  The speech simplifies the "addressed/unaddressed" distinction into "messages vs. tools" for accessibility. It assumes the Deputy's rule is valid for the speech's logic, though it is contested; many archaeologists argue grave goods *are* addressed deposits (to the dead/gods), making the rule's exclusion of belief claims overly rigid. The speech admits this limitation but frames it as scientific humility rather than negation.

  Regarding the elders: Declining their claim *is* a claim they will hear as negation. The speech attempts to validate their memory's locus (in voice, not dirt) to soften this, but the tension is unavoidable. Six minutes is tight for this nuance; pacing must be slow to allow the silences to land. The request is not misframed, but the ethical burden on the Director is heavy: honesty risks alienation, while politeness risks dishonesty. The speech chooses honesty wrapped in respect.
