  *(Self-Correction Note on Confidence)*: I should be careful not to present Buddhist philosophy as monolithic. The Abhidharma claim varies between Sarvastivada, Sautrantika, and Madhyamaka. I will generalize slightly for the sake of the "menu" but note the variance in the uncertainty section.

