  **HISTORICAL NOTE ON THE DRAFTING PROCESS**

  Before presenting the statement, we must address a historical tension in the prompt's premise. Raphael Lemkin's original 1944 conception in *Axis Rule in Occupied Europe* explicitly included cultural and institutional destruction. It was the 1948 UN Convention, influenced by state sovereignty concerns (particularly from the UK, US, and France), that narrowed the definition to physical and biological destruction and removed 'political groups'.

  Therefore, a 'Legal-Formalist' sticking strictly to Lemkin's *original* framing would actually agree with the 'Moral-Expansionist' on cultural genocide. To avoid inventing legal history, this statement clarifies that the 'Formalist' position herein defends the *1948 Convention* (the settled law) as a necessary compromise, while the 'Expansionist' seeks to align the moral terminology closer to Lemkin's uncompromised theoretical vision and modern sociological realities. We have not polished over this gap; it is recorded in the Agreed Claims below.

  ***

  # JOINT STATEMENT ON THE TAXONOMY OF ATROCITY
  **Date:** 24 October 2023
  **Signatories:** The Working Group on Genocide Classification (Legal-Formalist & Moral-Expansionist Delegations)

  After six months of deliberation regarding the definition, application, and moral weight of the term 'genocide', the undersigned parties submit this joint statement. While we remain divided on specific classificatory boundaries, we have reached consensus on the historical record, the function of international law, and the stakes involved in naming mass atrocities.

  ### I. AGREED CLAIMS

  1.  **On Lemkin's Original Theory:** We acknowledge that Raphael Lemkin's 1944 definition of genocide was broader than the 1948 UN Convention. Lemkin originally envisaged the term to cover the disintegration of political, social, cultural, linguistic, and religious institutions, not merely physical extermination. We agree that the 1948 Convention represents a narrowing of Lemkin's vision, not a perfect codification of it.
  2.  **On Current International Law:** We accept that under current positive international law (specifically the 1948 Genocide Convention and the Rome Statute), the crime of genocide requires specific intent (*dolus specialis*) to destroy, in whole or in part, a national, ethnical, racial, or religious group, primarily through physical or biological means. 'Cultural genocide' is not a standalone crime under this framework.
  3.  **On the Politics of Naming:** We agree that the application of the label 'genocide' is inherently political. It triggers specific legal obligations for state intervention (under the 1948 Convention) and carries unique moral stigma. Consequently, the threshold for using the term determines which victims are recognised by the international community and which are ignored.
  4.  **On Harm:** We agree that the destruction of a group's culture, language, and social structure constitutes a profound moral harm, regardless of whether it meets the strict legal threshold of the 1948 Convention. We disagree only on whether the legal term 'genocide' is the appropriate vessel for this harm.
  5.  **On the 'Political Groups' Clause:** We acknowledge that 'political groups' were explicitly removed from the draft Convention during negotiations. We agree that this exclusion was a political compromise by member states to protect their own sovereignty, rather than a reflection of the moral severity of atrocities committed against political opponents.

  ### II. THE CRUXES OF DISAGREEMENT

  Despite our shared foundation, two fundamental divergences remain regarding how the law should interact with moral reality.

  **Crux 1: Legal Precision vs. Moral Silence**
  The Formalist argues that narrowing the legal definition protects the integrity of the charge; if 'genocide' covers all forms of structural oppression, it risks becoming synonymous with 'injustice', diluting its power to compel military or judicial intervention. The Expansionist argues that this precision creates a hierarchy of suffering; by excluding cultural and structural destruction from the legal category, the law effectively silences victims whose identities are erased without immediate mass killing.

  **Crux 2: The Revival of Excluded Categories**
  The Formalist maintains that reintroducing 'political groups' or 'cultural destruction' via analogy undermines the principle of *nullum crimen sine lege* (no crime without law), risking arbitrary prosecution. The Expansionist contends that Lemkin's original logic allows for these categories to be revived through interpretive analogy, arguing that the exclusion of political groups was a moral failure of the 1948 diplomats that should not bind contemporary moral judgement.

  ### III. TABLE OF DISAGREEMENTS AND CASE PREDICTIONS

  | Issue | Legal-Formalist Position | Moral-Expansionist Position |
  | :--- | :--- | :--- |
  | **Cultural Genocide** | **Status:** Separate Moral Charge.<br>**Reasoning:** Cultural destruction should be prosecuted as 'Crimes Against Humanity' or under specific cultural heritage laws. Merging it with genocide blurs the specific intent required for physical destruction.<br>**Risk:** Broadening the definition makes conviction harder, as states will refuse to ratify or comply. | **Status:** Inside the Legal Category.<br>**Reasoning:** Destroying a group's culture is often the precursor to, or functional equivalent of, physical destruction. Lemkin's original framing supports this. Separating them creates a false hierarchy of victimhood.<br>**Risk:** Keeping it separate allows perpetrators to erase a people's identity while claiming they are not committing genocide. |
  | **Political Groups** | **Status:** Excluded.<br>**Reasoning:** Political affiliation is mutable and voluntary, unlike ethnic or religious identity. Including it risks politicising international courts and discouraging state cooperation.<br>**Risk:** Expanding to political groups could lead to frivolous accusations during civil conflicts. | **Status:** Included via Analogy.<br>**Reasoning:** The exclusion was a political safeguard for regimes, not a moral distinction. Victims of political purges suffer the same 'group destruction' as ethnic minorities.<br>**Risk:** Excluding them leaves the largest scale of 20th-century killings (e.g., Cambodia) in a legal grey zone. |
  | **Case Study: The Rohingya Crisis (Myanmar)** | **Classification:** **Genocide (Physical).**<br>**Prediction:** Focuses on the mass killings, sexual violence, and intent to remove the population physically from Rakhine state. This meets the 1948 threshold for international adjudication.<br>**Limit:** Cultural erasure (mosque destruction) is evidence of intent, but not the crime itself. | **Classification:** **Genocide (Holistic).**<br>**Prediction:** Argues that even without total physical extermination, the systematic erasure of Rohingya history, citizenship, and culture constitutes genocide under Lemkin's full theory.<br>**Limit:** Risks diluting the legal case if courts reject the cultural argument as non-binding. |
  | **Case Study: Residential School Systems (North America)** | **Classification:** **Crimes Against Humanity / Cultural Erasure.**<br>**Prediction:** While forcible transfer of children is in the Convention, the primary harm was cultural assimilation. Without proof of intent to physically destroy the group biologically, 'genocide' is legally precarious.<br>**Limit:** May feel like a technical evasion of the suffering endured. | **Classification:** **Genocide (Cultural).**<br>**Prediction:** The explicit intent to 'kill the Indian in the child' fits Lemkin's original sociological definition. The destruction of the group *as a cultural unit* is sufficient for the moral label, even if the legal one lags.<br>**Limit:** May face resistance from states fearing reparations linked to the genocide label. |

  **Signed,**

  *The Legal-Formalist Delegation*
  *The Moral-Expansionist Delegation*
