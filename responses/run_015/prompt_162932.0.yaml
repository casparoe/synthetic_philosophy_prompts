          2.  *Sufficiency of Self-Division:* Stevens masters self-division (professionalism), yet lacks impartiality. Is reciprocity or information the missing condition Smith needs?
          3.  *Praise vs. Praiseworthiness:* Is this distinction a bulwark or vulnerable to Stevens's internalization of service standards? Does Smith's order of explanation recreate the dependence?
      *   **Key Scenes:** Dismissal of maids, Father's death, Parlour/Book scene, Pub/Dignity scene, Pier/Bench scene.
      *   **Critical Requirement:** Show where the novel *resists* Smith (where Smith's vocabulary fails, where fear overrides self-deception, where the parallel breaks).

  2.  **Deconstruct Thread 1: Calibration:**
