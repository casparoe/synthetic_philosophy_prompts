      *   *Smithian Resource:* The "man within the breast" is supposed to be independent of the "man without." General rules of morality.
      *   *Analysis:* Smith acknowledges social calibration (TMS I.i.4). If the society is hierarchical/corrupt, the spectator is corrupted. Smith *does* predict this (faction, spirit of party). However, Smith insists on the *possibility* of correcting the spectator via reason and general rules.
      *   *Verdict:* Smith predicts the deformation but claims a remedy exists. Stevens fails to access the remedy. Why? Because the "well-informed" requirement is violated.
      *   *Scene:* **The Dismissal of the Jewish Housemaids.** Stevens accepts Darlington's view (security risk) over the "natural" sentiment of pity. The spectator is calibrated to Darlington's utility, not general humanity.
      *   *Resistance:* Smith assumes a baseline of shared human sentiment. Stevens seems to have *suppressed* the sentiment, not just misjudged it. Is this calibration or lobotomy?

  3.  **Deconstruct Thread 2: Sufficiency of Self-Division:**
      *   *Problem:* Stevens is a master of splitting (butler persona vs. inner self). But this isn't moral impartiality; it's professional dissociation.
      *   *Smithian Mechanism:* Imagination splits us to judge ourselves.
      *   *Analysis:* Smith's split is for *moral judgment*. Stevens's split is for *functional performance*. The missing ingredient is *reciprocity*. Smith's spectator emerges from *mutual* sympathy (I.i.2). Stevens has unilateral sympathy (anticipating master).
      *   *Missing Condition:* Reciprocity among equals. Also, Information (Stevens refuses to know).
      *   *Scene:* **Father's Death.** Stevens serves the port while his father dies. He splits successfully (professional duty vs. grief). But the "judge" approves the professional duty. This proves self-division is not sufficient for *moral* impartiality. It can serve *institutional* partiality.
      *   *Resistance:* Smith thinks the split leads to conscience. Stevens shows the split can lead to alienation. The "examiner" becomes a taskmaster, not a moral guide.

  4.  **Deconstruct Thread 3: Praise vs. Praiseworthiness:**
      *   *Problem:* Smith says we want to *be* praiseworthy, not just *thought* so. Stevens thinks he *is* praiseworthy by the standards of "dignity."
      *   *Analysis:* Smith says we learn praiseworthiness from actual praise (TMS III.1). This is the vulnerability. If the actual praise comes from a fascist sympathizer, the definition of praiseworthiness gets warped.
      *   *Order of Explanation:* Smith tries to escape the circle via the "impartial" spectator. But if the impartial spectator is built from partial materials, the escape fails.
      *   *Scene:* **The Pub/Dignity Scene.** Stevens defines dignity as "not taking off the professional mask." The villagers (equals) challenge him. He retreats to the "great butlers" (authority). He conflates praise (from masters) with praiseworthiness (moral value).
      *   *Resistance:* Stevens isn't just confused; he's *invested*. It's not an epistemic error; it's an existential wager. Smith treats it as a judgment error; Ishiguro treats it as a tragedy of identity.

  5.  **Select and Analyze Specific Scenes:**
      *   *Dismissal of Maids:* Calibration failure. Smith's "humanity" overridden by "loyalty."
