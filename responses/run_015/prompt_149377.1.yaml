answer: |-
  Your friend's "normative bootstrap" is a sophisticated restatement of the materialist critique, but it collapses the temporal sequence that is vital to Weber's causal pluralism. Weber never argued for a deterministic lockstep where values rigidly dictate economic forms forever; rather, he posited that at a specific historical juncture, the Calvinist ethic acted as a "switchman" that determined the *direction* of action by defining what counted as rational conduct. The causal efficacy lies in the *unintended consequence*: the early Calvinist suppressed consumption not to accumulate capital, but to avoid the idolatry of the flesh and glorify God. The accumulation was a byproduct, not a goal. Therefore, the value was not adjusted *post-hoc* to fit an emerging economic reality; rather, the economic reality emerged *ex post* from a religious imperative that was logically independent of material gain. The circularity you fear only arises if you conflate the genesis of the spirit of capitalism with its later secularization. Once the "iron cage" is built, the religious root dies away, and yes, values then rationalize structure—but that secondary feedback loop does not erase the primary causal impulse that launched the process. To claim culture is always trailing structure is to ignore the moment where the switch was thrown; elective affinity explains why the religious ethic and economic behavior bonded, but it does not reduce the ethic to a mere shadow of the economy.

  I am 90% confident in this defense, as it faithfully reconstructs Weber's distinction between adequate causation and deterministic law while preserving the autonomy of cultural meanings. The point about which I am least certain, however, is the precise empirical mechanism by which we distinguish the "reflexive reshaping" of values from their "causal independence" during the transition period; while logically distinct, isolating the exact moment where cultural causation hands off to structural inertia without slipping into a functionalist explanation of why those values *persisted* remains a formidable methodological challenge.
