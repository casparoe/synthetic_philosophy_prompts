      *   *Mind-Changing Consideration:* What would swap 1 and 2? If the Hard Problem is shown to be a linguistic confusion independent of ontology.
      *   *Vulnerable Point:* The distinction between "functional reality" and "phenomenal reality."

  6.  **Refining the Content (Self-Correction during drafting):**
