answer: |-
  Reading *Memento* through the lens of *anattā* (no-self) requires us to resist the temptation to treat Leonard Shelby as a broken Lockean subject whose psychological continuity has been severed. Instead, we should view him as a vivid illustration of the five aggregates (*khandhas*) operating without a central proprietor. The standard psychological-continuity debate asks whether Leonard is the *same person*; the Buddhist reading asks whether there is a person there to be the same. To navigate this, your distinction between an *abbreviative* fiction (a shorthand for real continuities like habits and dispositions) and a *confabulatory* fiction (a fabrication with no independent referent) is indispensable.

  The film dramatises the triumph of the confabulatory over the abbreviative. Leonard's dispositions—his stubbornness, his capacity for violence, his grief—persist intact. These are the abbreviative facts; they are real karmic tendencies (*saṅkhāra*) flowing through the stream of consciousness. However, the narrative self he constructs via notes and tattoos is confabulatory. It is not a shorthand for a truth, but a replacement for one. The film suggests that what we experience as 'I' is not the abbreviative continuity of character, but the confabulatory story we tell to organise that character into a purpose. Leonard proves that the sense of self is less about information storage and more about *upādāna* (clinging). He clings to the identity of 'the avenger' not because the data supports it, but because the clinging itself provides the friction necessary for agency.

  This brings us to your friend's objection: that Leonard is a counterexample to *anattā* because he remains 'someone'—a subject of grievance—without narrative memory. If there is no self, who suffers? The Buddhist reductionist must reply that the grievance exists, but the 'subject' of the grievance is a grammatical illusion. The friend mistakes the continuity of the stream for the continuity of a swimmer. Leonard's anger is a formation arising in consciousness, conditioned by past trauma, but it does not require an owner to be felt. The film actually supports *anattā* here: we see the machinery of personality (the abbreviative self) running on autopilot, while the 'I' (the confabulatory self) is hastily painted onto the surface. Leonard is not a self surviving memory loss; he is a collection of aggregates seeking a object to bind them together. The fact that he is 'recognisably the same man' confirms the persistence of karmic formations, not the existence of a soul.

  The ending is the philosophical crux. When Teddy reveals that Leonard has already completed his quest, Leonard experiences a moment of clarity. He understands that his project is void. Yet, he deliberately writes down a false licence plate to ensure he continues the hunt. Is this self-grasping refused or shown to be indispensable? It is shown to be indispensable *within samsara*. Leonard chooses suffering over truth because the cessation of the quest implies the cessation of the self-concept that drives him. Without the fiction of 'John G.', Leonard's agency collapses into aimlessness. This complicates the claim that clinging is the root of suffering; the film suggests clinging is also the root of *function*. To let go of the self-fiction is to let go of the will to act. Leonard chooses to remain in dukkha because the alternative is a void he cannot inhabit.

  For the reading group, three scenes warrant close inspection. First, the opening shaving scene (which is chronologically the end). Leonard stares at himself, polaroids spread out. This is the self as an external assembly kit. He is constructing the 'I' from debris, highlighting the confabulatory nature of his identity. Second, the car conversation with Teddy. When Leonard says, 'I have to believe in a world outside my own mind,' he is articulating the necessity of the confabulatory fiction. He admits he chooses to believe the lie. This is the moment of active clinging. Third, the tattooing scene. Inscribing 'John G. raped and murdered my wife' onto his skin literalises the grafting of a fiction onto the physical aggregate (*rūpa*). It is the ultimate attempt to make the confabulatory permanent.

  We must, however, acknowledge where this reading does violence to the film. Nolan is constructing a neo-noir puzzle, not a metaphysical treatise. The backwards narrative is a device for suspense and empathy, not necessarily an ontological claim about time or consciousness. To treat Leonard as a purely philosophical vehicle risks ignoring the emotional horror of his condition—the tragedy is not just that he has no self, but that he is trapped in a genre that demands he be a hero. The film relies on the audience's intuitive belief in a unified self to generate the twist's impact; if we truly viewed him as a stream of aggregates from the outset, the betrayal would lack sting.

  Ultimately, *Memento* adds something to the debate that arguments alone cannot: the phenomenology of fragmentation. Parfit gives us logic; Nolan gives us the vertigo of living without a past. The film demonstrates that the 'self' is not merely a theoretical error but a practical necessity for those unwilling to face the void. It shows that *anattā* is not just a description of reality, but a threat to it. Leonard's tragedy is that he glimpses the no-self picture and rejects it. He chooses the confabulatory fiction because the abbreviative truth—that he is merely a stream of grief and violence with no destination—is too terrifying to inhabit. In doing so, *Memento* suggests that while the self may be an illusion, the suffering caused by maintaining it is undeniably real.
