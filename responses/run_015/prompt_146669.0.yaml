answer: |-
  ### 1. Exam Question

  **Course:** Moral Psychology (Upper-Level Seminar)
  **Assessment:** Final Essay
  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 800 words
  **Instructions:** Answer the question below. Do not rely on bibliographic citations, reading lists, or external texts. Your answer must be self-contained and rely solely on the conceptual framework provided in the prompt.

  **Prompt:**

  Consider an agent, Alex, who finds a lost wallet containing a significant sum of money. Alex returns the wallet to its owner. When reflecting on this action, Alex affirms that they acted for the genuinely right reason: respect for the owner's property claim. However, Alex also admits to a specific psychological contingency: Alex recently suffered a traumatic experience of property loss. This trauma generated an acute, unendorsed aversion to retaining others' belongings. Alex acknowledges that without this trauma-induced aversion, they would likely have kept the wallet, despite acknowledging the owner's claim.

  To evaluate this case, apply the following constructed framework: Define **Counterfactual Stability of Moral Motivation** as the condition that an agent's correct reason for acting would remain causally effective in nearby possible worlds where a contingent, non-moral psychological feature—here, the recent traumatic experience of property loss that generates an acute but unendorsed aversion to retaining others' belongings—is absent.

  Based on this scenario and definition, determine whether Alex deserves **full moral worth**, **partial moral worth**, or **no moral worth** for returning the wallet. Defend your classification by addressing whether moral credit requires not merely the presence of a right reason but also its independence from such contingent psychological scaffolding. In your argument, you must engage with the Counterfactual Stability condition to explain why the presence of the right reason in the actual world is or is not sufficient for moral credit.

  ***

  ### 2. Model Answer

  **Title:** Stability and Scaffolding in Moral Worth

  The case of Alex presents a conflict between the normative content of a motive and its causal robustness. Alex acts on the right reason (respect for property claims) but admits this reason lacks Counterfactual Stability; in nearby worlds without the trauma-induced aversion, the right reason would fail to produce the action. Determining Alex's moral worth requires analyzing whether moral credit demands that the right reason be the stable cause of action, or merely a present justification. I argue that Alex deserves **partial moral worth**. This position avoids the errors of granting full credit despite causal fragility and denying all credit despite the presence of normative recognition.

  To grant **full moral worth**, one must argue that the actual presence of the right reason is sufficient, regardless of counterfactual fragility. Proponents of this view focus on the actual world: Alex did respect the claim, and the action was right. However, this view commits a conceptual error by treating overdetermination as automatically unproblematic for worth. If the trauma-induced aversion was the decisive causal force, and the respect for the claim was merely a concurrent but causally inert rationalization, the action lacks moral merit. Even if Alex sincerely believes respect was the motive, the admission that they would have kept the wallet without the trauma suggests the moral reason was causally subordinate to the non-moral aversion. Full credit ignores the requirement that moral worth tracks the *dominance* of the moral motive, not just its presence. It conflates the normative justification (the reason is good) with the causal explanation (the reason did the work).

  Conversely, to deny **any moral worth** is to argue that contingent psychological scaffolding completely voids moral credit. This view holds that because the action relied on trauma, it is merely a symptom of psychology rather than a moral choice. The conceptual error here is conflating causal origin with normative justification. The fact that a moral reason is supported by a non-moral drive does not negate the content of the moral reason itself. Alex still recognized the owner's claim as a valid constraint on action. To deny all worth is to demand a purity of motivation that excludes the complex psychological reality of human agency. It treats the presence of a non-moral cause as excluding the presence of a moral cause, which is a false dichotomy; motives can be overdetermined.

  **Partial moral worth** is the correct classification because it acknowledges the presence of the right reason while penalizing the lack of Counterfactual Stability. Moral worth should be understood as a measure of the agent's reliable commitment to the right reasons. The Counterfactual Stability condition tests this reliability. In Alex's case, the moral motivation is fragile; it is propped up by a contingent, non-moral scaffold (the trauma). If the scaffold were removed, the moral structure would collapse. Therefore, Alex cannot receive full credit, as their commitment to the right reason is not robust enough to survive the removal of the traumatic aversion.

  However, Alex deserves more than no credit because the right reason was genuinely present and endorsed in the actual world. Unlike an agent who acts solely out of fear or aversion without recognizing the moral claim, Alex affirms the owner's right. The moral reason was not merely a post-hoc rationalization but a concurrent motive. The lack of stability indicates a defect in moral character—specifically, a lack of resilience in moral motivation—but not a total absence of moral regard.

  Therefore, the assessment of moral worth must distinguish between the *content* of the reason and the *causal dominance* of that reason. The Counterfactual Stability condition reveals that while Alex's reason had the right content, it lacked the necessary causal independence. The trauma acted as a crutch; without it, the moral reason was insufficient to motivate. Granting partial worth recognizes the achievement of acting on the right reason while withholding full praise for a motivation that is not securely grounded in moral regard alone. This approach respects the intuition that moral worth is diminished when right action depends on psychological accidents, without falling into the error of demanding that moral agents be devoid of non-moral psychological influences.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25
  **Assessment Criteria:** Argumentative precision, application of the Counterfactual Stability framework, identification of conceptual errors, and internal consistency.

  #### **A-Range (22–25 Marks)**
  *   **Thesis:** Clearly selects one category (Full, Partial, or None) and maintains it consistently.
  *   **Framework Application:** Explicitly uses the definition of **Counterfactual Stability** to drive the argument. Explains that the condition is *not met* in the scenario (since the reason fails in the counterfactual world) and analyzes the implications of this failure.
  *   **Conceptual Distinctions:** Successfully distinguishes between:
      1.  The *presence* of a right reason vs. its *causal dominance*.
      2.  Normative justification vs. Causal origin.
  *   **Rival Analysis:** Identifies specific conceptual errors in the two rejected positions (e.g., noting that "Full Credit" ignores causal fragility/overdetermination; "No Credit" conflates origin with content).
  *   **Originality:** Avoids name-dropping (Kant/Aristotle) and relies solely on the provided logic.

  #### **B-Range (18–21 Marks)**
  *   **Thesis:** Selects a category but may waver slightly in justification.
  *   **Framework Application:** Uses the term "Counterfactual Stability" but may apply it loosely (e.g., treats it as a general "what if" rather than the specific causal condition defined).
  *   **Conceptual Distinctions:** Distinguishes presence from dominance but may not fully articulate *why* this matters for moral worth.
  *   **Rival Analysis:** Mentions alternative views but identifies the conceptual errors less precisely (e.g., says one view is "too harsh" rather than identifying the specific conflation of origin/justification).
  *   **Originality:** Mostly avoids external texts but may slip in a vague reference to a philosopher without applying it to the specific framework.

  #### **C-Range (14–17 Marks)**
  *   **Thesis:** Unclear or contradictory classification of worth.
  *   **Framework Application:** Mentions the framework but fails to use it to determine the outcome (e.g., ignores the counterfactual condition and focuses only on the actual action).
  *   **Conceptual Distinctions:** Struggles to separate the trauma from the moral reason.
  *   **Rival Analysis:** Describes alternative views descriptively rather than analytically (no identification of conceptual errors).
  *   **Originality:** Relies heavily on memorized summaries of ethical theories rather than the provided prompt constraints.

  #### **Specific Penalties (Deduct 2–3 Marks per occurrence)**
  1.  **The "Trauma as Reason" Fallacy:** Treating the trauma-induced aversion itself as a moral reason or a valid basis for moral credit. (The prompt defines it as a *non-moral* feature).
  2.  **The "Authority Appeal" Fallacy:** Answering by stating "Kant would say..." or "Aristotle believes..." without mapping those views onto the specific **Counterfactual Stability** definition provided. The prompt requires analysis of the *provided framework*, not recitation of canon.
  3.  **The "Outcome Bias" Error:** Arguing for Full Moral Worth solely because the *action* was right, ignoring the prompt's requirement to evaluate the *motivation's stability*.

  #### **Examiner Notes on the Model Position:**
  *   The Model Answer argues for **Partial Worth**. Students arguing for **No Worth** (due to failed stability) or **Full Worth** (due to actual presence of reason) can still receive A-range marks *provided* they rigorously apply the Counterfactual Stability definition and correctly identify the conceptual errors in the opposing views as outlined in the scheme. The key is not the conclusion, but the handling of the stability condition and the distinction between causal origin and normative content.
