prompt: |-
  I am preparing a long-form essay for a science-and-ideas magazine on the philosophical fault lines hidden inside canonical war fiction, and I want to examine Erich Maria Remarque's All Quiet on the Western Front through the prism of just-war theory's moral equality of combatants—the principle that opposing soldiers share equal rights to kill and equal exposure to being killed, irrespective of which cause is just. Rather than treating the novel as a mere illustration of Michael Walzer's symmetry thesis, I want to test a narrower, more disruptive framing I am calling the 'agency-diffusion objection': the idea that moral equality requires combatants to be autonomous moral agents directing lethal force, yet Remarque systematically depicts them as interchangeable parts of an industrial apparatus whose individual intentions are suspended.

  I need a reading that tracks this tension through specific, well-known scenes—the killing of the French printer in the shell hole, the fraternization with Russian prisoners, the mechanized bombardments that render individual choice irrelevant—and asks where the novel supports the objection, where it undermines it (for instance, in moments of direct, face-to-face violence where agency is unmistakable), and whether the book's refusal to grant either side a just cause turns equality into shared victimhood rather than shared license. Deliver the response as exactly five numbered points, each composed of one or two sentences, with no introductory or concluding paragraph; each point should identify a concrete scene or pattern and state precisely what it demonstrates about the conflict between Remarque's vision and the equality doctrine.
