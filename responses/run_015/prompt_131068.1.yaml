          *   *Kripkean Analysis:* Kripke discusses empty names (Santa Claus, Vulcan). He suggests they fail to refer. However, he also discusses reference fixing via description vs. reference borrowing. If the name was introduced by a description ("the manuscript with nine sermons") and nothing fits, it might be empty. But if the name was passed down causally and later attached to a specific book (one of the three), it might refer to *that* book, even if the description is wrong. This is the distinction between *fixing the reference* (using a description to pick out the object) and *giving the meaning* (the description being synonymous). If the description fixed the reference but failed (no such object), the name is empty. If the name was passed down and eventually latched onto Book A via causal chain, it refers to Book A, and the description is just a contingent false belief. The friend's claim ("every sentence false") is too strong if the name now refers to one of the three books via causal transmission despite the false description.

