answer: |-
  To the Members of the City Committee, this document records the outcomes of the mediation sessions regarding the commemoration of Sir Elias Vance, serving as a joint statement of agreed facts, residual disagreements, and the specific cruxes upon which the final decision turns. We begin by affirming the claims both parties can sign, acknowledging that Vance's legacy is neither wholly virtuous nor wholly villainous but materially mixed. Both parties agree that the city must not foster falsehoods about its history and that the dispossession of the smallholders was a grave moral wrong. In the spirit of compromise, the Removalist accepts that removing the statue does not erase the historical fact of Vance's influence, acknowledging that physical absence can create a vacuum of memory that risks letting the present city treat the wrong as having been done by a country that is no longer itself. Conversely, the Recontextualist accepts that the current default-reading equilibrium functions as an unqualified endorsement, acknowledging that silence alongside the bronze implies approval and that the existing interpretive void is a failure of civic honesty.

  Despite these shared premises, we remain divided on the remedy. The Removalist holds that the complicity condition is met, arguing that grave wrongdoing defeats honour regardless of its connection to the specific benefaction, and thus the honour has been defeated and should be withdrawn. The Recontextualist holds that both the statue and street name should stay in place with a permanent interpretive installation, arguing that removal converts a site of contested memory into a site of forgetting and that preserving the statue serves as evidence rather than honour, provided the context is shifted. To clarify where further work is needed, we have ordered the cruxes of our dispute by how much of the disagreement would move if each were settled. The first and most significant crux is honorific saturation, which measures how far the honour pervades obligatory daily civic speech. The Removalist argues that while one can avoid the square, one cannot avoid one's own address, meaning the street name coerces citizens into invoking Vance's name on every bus transfer and emergency dispatch, constituting ongoing harm. The Recontextualist argues that this saturation is merely administrative utility and does not convey moral endorsement. Both parties agree to commission a survey measuring citizen discomfort when required to use the address versus voluntary viewing of the square, with the Removalist predicting high distress and the Recontextualist predicting negligible impact.

  The second crux concerns the default-reading equilibrium, specifically whether a passer-by forms a reading with no interpretive effort and whether a plaque can shift it. The Removalist argues that people do not read plaques, so the default remains glory regardless of added text. The Recontextualist argues that design can interrupt the glance and shift the meaning from celebration to testimony. Both accept a comparative study of similar installations in other districts as evidence, with the Removalist predicting visitors will ignore the text and the Recontextualist predicting comprehension will rise above baseline. The third crux is the contrast between honouring and preserving as evidence, turning on the thought that a statue testifies mostly to the taste of those who raised it while a building or record testifies to what was done. The Removalist argues the statue is purely honorific. The Recontextualist argues it is historical data. Both agree to review the original dedication inscriptions to determine intent, with the Removalist predicting language of heroism and the Recontextualist predicting language of historical record.

  In analyzing the nature of these disagreements, we identify that much of the dispute over the word honour is merely verbal, turning on whether keeping a statue constitutes active praise or passive retention. This can be dissolved by distinguishing between active ceremony and passive presence, allowing both sides to agree that no new ceremonies should occur while disagreeing on the physical object. However, the question of whether interpretive text changes public perception is genuinely empirical. It would be settled by a controlled study measuring recall and attitude change among pedestrians exposed to the proposed installation versus those who are not, and we recommend the city fund this study before proceeding. Finally, we address whether the statue and the street name call for the same verdict or different ones, as the two members currently assume they stand or fall together. We conclude they warrant different verdicts. The distinction of honorific saturation dictates that the street name, being obligatory daily speech, carries a heavier burden than the statue, which is avoidable. The street name implicates the citizen in Vance's honour simply by living here, whereas the statue requires a journey. Therefore, the street name is the priority for change if harm is found, while the statue remains a candidate for recontextualization. We submit this not as a final vote but as a map of where evidence is needed, committing to reconvene once the proposed surveys and studies are complete to determine whether the complicity condition outweighs the value of preservation in light of the data.
