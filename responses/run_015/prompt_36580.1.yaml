answer: |-
  This is a fantastic question, and it cuts right to the bone of what formal epistemology is trying to do. Your student has spotted a genuine structural isomorphism that many textbooks gloss over, but your instinct that the disanalogy is deeper than the syntax is correct.

  Here is the verdict I would offer your seminar: **The Principal Principle (PP) is the more fundamental norm, and Reflection (RP) is derivative.** Reflection is a heuristic constraint on diachronic coherence that holds *only insofar as* you expect your future self to be a better tracker of the norms established by principles like PP. When the two conflict, PP (properly understood) trumps RP.

  Here is the argument organized for your seminar, breaking down the "expert" analogy, the failure modes, and why the repair strategies reveal the hierarchy.

  ### 1. The Deference Schema and the Nature of the Expert

  You are right that both principles instantiate a general deference schema:
  $$Cr_t(A \mid \text{Expert}_t(A) = x) = x$$

  For PP, the expert is **Objective Chance**. For RP, the expert is **Your Future Self**.

  The critical disanalogy lies in *why* we defer to these experts.
  *   **PP (Alethic Deference):** We defer to chance because chance is the *truth-maker* (or truth-tracker) for credence. Chance is the bridge between mind and world. If you violate PP, your credences are objectively misaligned with the way the world works, regardless of your internal coherence.
  *   **RP (Epistemic Deference):** We defer to our future selves not because they are metaphysically privileged, but because we presume they possess **more evidence** while retaining **rational competence**.

  This means RP is parasitic on the assumption that your future self is a better epistemic agent than you are now. But *what makes them a better agent?* It is the expectation that they will process evidence in accordance with norms like PP. If you expect your future self to ignore chance (e.g., they will become superstitious), you should not satisfy Reflection. Therefore, the norm governing chance (PP) constrains the norm governing self-deference (RP).

  ### 2. The Failure Modes: Metaphysical vs. Normative

  The difference becomes stark when we look at why the principles break.

  **The Principal Principle and Undermining:**
  Lewis's undermining problem is a **metaphysical** glitch. It arises because, on a Humean view, the chances supervene on the total history. A hypothesis about the chances ($Ch(A)=x$) might entail a future history that, if it occurred, would make the chance hypothesis false ($Ch(A) \neq x$).
  *   *Diagnosis:* The proposition $Ch(A)=x$ is not "admissible" in the strict sense because it bears on the truth of itself via the future.
  *   *Status of the Expert:* Even in undermining cases, the chance function *is still the chance function*. It hasn't lost its authority; the logical space is just tricky. The "expert" is still the expert, but the language we use to describe its verdicts is self-undermining.

  **Reflection and Foreseen Irrationality:**
  The failure of Reflection (e.g., the drunk driving case) is a **normative** collapse. You know your future self will be confident they are safe to drive, but you know this confidence is generated by alcohol, not evidence.
  *   *Diagnosis:* The future self is not functioning as a rational agent.
  *   *Status of the Expert:* In this scenario, the future self **ceases to be an expert**. They are no longer a proxy for truth-tracking; they are a source of noise.

  **The Disanalogy:**
  In the PP case, the expert remains authoritative, but the conditionalization path is blocked by metaphysical entanglement. In the RP case, the expert loses authority entirely. This suggests PP is robust in a way RP is not. PP describes a relationship between mind and world that holds even when the math gets tricky; RP describes a relationship between time-slices of an agent that holds only when the agent remains rational.

  ### 3. Porting the Fixes

  Can we repair one using the resources of the other? This is where the hierarchy becomes clear.

  **Trying to fix RP with PP resources:**
  To fix PP, Lewis introduced the **Revised Principal Principle**, which essentially says: conditionalize on the chance hypothesis *and* the admissibility of that hypothesis (or rigidify the chance function).
  Can we do this for RP? Can we say: $Cr_t(A \mid Cr_{t+k}(A)=x \land \text{Rationality}) = x$?
  Yes, this is exactly how RP is saved (e.g., by Christensen or Briggs). We restrict the principle to "rational future selves."
  *   *Implication:* By adding "Rationality" as a condition, we admit that RP is not a standalone norm. It requires an external standard of rationality to function. What is that standard? It is the standard that demands you track truth and chance (i.e., PP).

  **Trying to fix PP with RP resources:**
  Can we fix PP by saying "Defer to chance only if chance is rational"? No, that makes no sense. Chance isn't an agent; it doesn't have rationality.
  Can we fix PP by saying "Defer to chance only if you expect your future self to agree"? No. If you know you will be irrational tomorrow, you shouldn't adjust your view of today's chances to match your future drunkenness.
  *   *Implication:* PP does not rely on RP for its repair. PP relies on metaphysics (admissibility, Humean mosaics). RP relies on psychology (competence, memory, sobriety).

  ### 4. The Verdict: Why PP is Fundamental

  Here is the tiebreaker argument for your student:

  **Reflection is a consequence of expected epistemic improvement, and epistemic improvement is defined by better alignment with the Principal Principle.**

  Suppose you are certain that objective chance $Ch(A) = 0.5$.
  *   **Scenario 1 (Learning):** You expect your future self to learn the outcome of $A$. Your future credence will be 1 or 0. RP says you should expect this. PP allows this because the future evidence is "inadmissible" regarding the chance, but admissible regarding the outcome. Here RP and PP are compatible because the future self is tracking the world better.
  *   **Scenario 2 (Corruption):** You expect your future self to ignore the chance and set $Cr(A) = 0.9$ due to bias.
      *   **RP says:** $Cr_t(A \mid Cr_{t+k}(A)=0.9) = 0.9$. (If you treat future self as expert).
      *   **PP says:** $Cr_t(A \mid Ch(A)=0.5) = 0.5$.
      *   **Resolution:** You should violate Reflection. You should *not* shift your credence to 0.9 now, even though you know you will believe it later. You should maintain 0.5 (or whatever the evidence dictates) and regard your future self as broken.

  Because there are cases where rationality demands violating Reflection to satisfy the Principal Principle, **PP is the master norm.** Reflection is merely a rule of thumb for agents who expect to remain rational and gain evidence. It is a "coherence tax" we pay for being diachronic agents, but it is not the *source* of epistemic justification.

  ### 5. Seminar Strategy

  To drive this home in class, I suggest framing the discussion around the **direction of fit**:

  1.  **PP is Mind-to-World:** It tells your mind how to fit the world's chances.
  2.  **RP is Mind-to-Mind:** It tells your current mind how to fit your future mind.

  Ask the class: *Why do we care about fitting our future mind?*
  The only non-circular answer is: *Because we expect our future mind to fit the world better.*
  Therefore, Mind-to-World (PP) grounds Mind-to-Mind (RP).

  **On the "Undermining" vs. "Irrationality" Repair:**
  Challenge the student to formulate a "Revised Reflection Principle" that doesn't implicitly presuppose the Principal Principle. If they add a clause like "conditional on your future self being rational," ask them to define "rational" without referencing truth-tracking or chance-matching. They will find they cannot. The concept of a "rational future self" is cashed out in terms of satisfying norms like PP.

  **Conclusion:**
  Tell your student they are right that self-trust is foundational for *agency* (you can't act without assuming some continuity), but they are wrong that it is foundational for *epistemology*. Epistemology is about truth. Chance is the formal representation of truth-frequency/propensity in the world. Your future self is just another hypothesis about the world, albeit a privileged one. When that hypothesis conflicts with the chance hypothesis, the chance hypothesis (PP) wins.

  Reflection is the mirror, but the Principal Principle is the object being reflected. You can break the mirror (violate RP due to foreseen irrationality) without destroying the object (chance still exists). But if you destroy the object (no objective chance/truth norm), the mirror reflects nothing. PP is the deeper principle.
