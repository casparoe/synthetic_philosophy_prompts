          *   *Okay, I will take the stand:* **The Principal Principle is more fundamental.** Reflection is a shadow of PP projected onto the timeline of the agent. You defer to your future self *because* you expect them to be more aligned with the Principal Principle (more evidence, same rationality). When that expectation fails (drunk), RP dissolves. When PP fails (undermining), it's a technical glitch in the definition of chance, not a collapse of the normative force.

