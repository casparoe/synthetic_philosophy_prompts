prompt: |-
  Wikipedia's core editorial rule is that content must be verifiable: every claim in an article must be supported by published, independent, reliable sources, and the policy states that "Even if you are sure something is true, it must have been published in a reliable source before you can add it." So an editor who personally witnessed an event may not report it, and a claim that happens to be true but appears in no source must be removed — while, oddly, a second-hand newspaper report of dubious accuracy is perfectly admissible. Compare this with the courtroom, where firsthand knowledge licenses testimony and second-hand reports are excluded as hearsay, or with ordinary conversation, where we assert what we ourselves know. What norm of assertion does the Wikipedia practice presuppose? Is it best reconstructed as a knowledge norm, a truth norm, a justification norm, or something like a purely institutional norm of trackability — and does the same norm explain why hearsay is welcome on Wikipedia but barred from the witness stand? Please reconstruct the implicit norm, distinguish what the practice strictly requires from what it merely fits well with, and say where the practice is philosophically underdetermined, i.e., which rival norms of assertion would license it equally well.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Wikipedia's Verifiability Policy (WP:V).
      *   **Key Feature:** Content must be supported by published, independent, reliable sources. Personal knowledge (even if true) is excluded. Second-hand reports (even if dubious) are admissible if published in a "reliable source."
      *   **Comparison:** Contrast with Courtrooms (firsthand knowledge = good, hearsay = bad) and Ordinary Conversation (assert what you know).
      *   **Questions to Answer:**
          1.  What norm of assertion does Wikipedia practice presuppose?
          2.  Is it Knowledge, Truth, Justification, or Institutional Trackability?
          3.  Does the same norm explain the hearsay difference (Wiki vs. Court)?
          4.  Distinguish strict requirements from what merely fits well.
          5.  Identify philosophical underdetermination (rival norms that license the same practice).

  2.  **Analyze Wikipedia's Norm:**

      *   *The Rule:* "Verifiability, not Truth." (WP:V).
      *   *The Mechanism:* Citations to reliable sources (RS).
      *   *The Goal:* Not necessarily to establish absolute ontological truth, but to establish that the content reflects the published record.
      *   *The Constraint:* No Original Research (WP:NOR). This bans personal knowledge.
      *   *Implication:* The norm isn't "Assert $p$ only if you know $p$" (Knowledge Norm). It isn't "Assert $p$ only if $p$ is true" (Truth Norm), because false claims in RS are allowed (until corrected by other RS).
      *   *Candidate:* "Assert $p$ only if $p$ is attributable to a reliable source." Let's call this the **Attribution Norm** or **Trackability Norm**.

  3.  **Analyze the Courtroom Norm:**

      *   *The Rule:* Hearsay is generally inadmissible. Firsthand testimony is preferred.
      *   *The Goal:* Establishing factual truth for adjudication.
      *   *The Mechanism:* Cross-examination of the knower.
      *   *Why the difference?* Courts care about *liability* and *facts of the case*. Wikipedia cares about *consensus of published literature*.
      *   *Connection:* Both are institutional norms, but they serve different epistemic ends. Court = Truth-finding via direct evidence. Wiki = Summary of public discourse via secondary evidence.

  4.  **Evaluate Candidate Norms:**

      *   *Knowledge Norm ($K$):* Assert $p$ only if you know $p$.
          *   *Wiki:* Fails. Editors explicitly forbidden from using personal knowledge.
          *   *Court:* Fits well (witnesses must have personal knowledge).
      *   *Truth Norm ($T$):* Assert $p$ only if $p$ is true.
          *   *Wiki:* Fails. WP:V explicitly says "Verifiability, not Truth." False claims in RS stay until removed by other RS.
          *   *Court:* Ideal goal, but rules of evidence are procedural tools to get there.
      *   *Justification Norm ($J$):* Assert $p$ only if you have justification for $p$.
          *   *Wiki:* Close, but the justification must be *external* (published), not internal (editor's reasoning).
          *   *Court:* Justification comes from evidence presented, but hearsay lacks the justification of cross-examination.
      *   *Institutional/Trackability Norm ($I$):* Assert $p$ only if $p$ is traceable to an approved institutional source.
          *   *Wiki:* Fits perfectly. The "assertion" is actually an attribution ("Source X says $p$").
          *   *Court:* Fits the *rules of evidence*, but the *testimony* itself aims at knowledge. The rule excludes hearsay because it breaks the chain of justification/accountability.

  5.  **Synthesize the "Wikipedia Norm":**

      *   It is best reconstructed as a **Norm of Attributable Consensus** or **Institutional Trackability**.
      *   It is not about the editor knowing; it's about the *article* reflecting the *literature*.
      *   The speech act isn't "I assert $p$ is true." It is "The literature asserts $p$."
      *   This explains why hearsay (published reports) is welcome: The object of study is the report itself, not the underlying reality.
      *   This explains why courtroom hearsay is barred: The object of study is the underlying reality (did the defendant do it?), and the report is a weak proxy for that reality compared to the witness.

  6.  **Address Underdetermination:**

      *   What other norms could justify WP:V?
      *   *Reliability Norm:* Assert $p$ only if $p$ comes from a process likely to produce truth (peer review, editorial oversight). This fits, but WP:V allows "dubious accuracy" if the source is "reliable" by status (e.g., NYT).
      *   *Liability Norm:* Assert $p$ only if someone else takes responsibility for $p$. (Shifts blame from editor to publisher).
      *   *Neutrality Norm:* Assert $p$ only if $p$ represents a significant viewpoint. (WP:NPOV).
      *   *The "Truth" Norm (Pragmatic):* Maybe WP:V is just a heuristic for Truth. But the prompt asks about the *presupposed* norm, and WP explicitly disavows Truth as the gatekeeper.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Define the tension (Wiki vs. Court vs. Conversation).
      *   *Reconstruction:* Propose the **Norm of Attributable Authority** (or Trackability). It's not about the proposition's truth, but its publication status.
      *   *Distinction:* Strict requirement (citation needed) vs. Fit (often leads to truth).
      *   *Court Comparison:* Explain the divergent telos (Truth-finding vs. Summary of Record). Hearsay in court is excluded because the *source* isn't available for cross-examination. Hearsay in Wiki is included because the *publication* is the object of verification.
      *   *Underdetermination:* Discuss how a **Liability/Shifting Responsibility Norm** or a **Consensus Norm** could also explain the rules without committing to the specific epistemic status of the content.
      *   *Conclusion:* Summarize the unique epistemic stance of Wikipedia (Second-order knowledge).

  8.  **Refining the Philosophical Terminology:**

      *   Use Williamson's Knowledge Norm ($K$) as a baseline.
      *   Use the concept of "Second-order assertion" (asserting that others assert).
      *   Highlight the "Verifiability, not Truth" slogan.
      *   Ensure the distinction between *strict requirement* (citation) and *philosophical justification* (why we trust citations) is clear.

  9.  **Self-Correction/Nuance Check:**

      *   *Correction:* Is it true that *any* newspaper report is admissible? No, it must be a "Reliable Source." A tabloid might not be. So the norm isn't just "published," it's "published in a vetted venue."
      *   *Nuance:* The prompt says "second-hand newspaper report of dubious accuracy is perfectly admissible." I need to accept this premise for the sake of argument (if it's in a RS, it's in), but note that "dubious accuracy" claims are usually tagged or challenged *within* the RS framework.
      *   *Nuance:* Courtroom hearsay *is* sometimes allowed (exceptions). But the general rule is exclusion. Stick to the general rule for contrast.
      *   *Key Insight:* Wikipedia articles are not assertions of fact *simpliciter*; they are assertions of *what is reported*. "X happened" in Wikipedia really means "Reliable sources report that X happened." This shifts the truth condition from the event to the existence of the report.

  10. **Final Polish:** Structure logically. Ensure all parts of the prompt are addressed. (Norm reconstruction, Court comparison, Strict vs. Fit, Underdetermination).

  **(Self-Correction during drafting):** I need to be careful not to say Wikipedia *doesn't care* about truth. They do. But the *rule of assertion* is not truth-gated, it's source-gated. The norm is procedural.

  Let's settle on the term **"Norm of Published Attribution."**

  *   *Strict Requirement:* Citation to RS.
  *   *Fits Well:* Truth (usually RS are true), Knowledge (usually authors of RS know).
  *   *Underdetermination:* Could be a Liability Norm (don't get sued), or a Consensus Norm (reflect the discourse).

  Okay, ready to write.
answer: |-
  The Wikipedia practice you describe reveals a fundamental divergence between everyday epistemic norms and institutional epistemic norms. To reconstruct the implicit norm of assertion governing Wikipedia, we must look beyond standard philosophical accounts of assertion (like the Knowledge or Truth norms) and recognize Wikipedia as a specific kind of speech act: **second-order reporting.**

  ### 1. Reconstructing the Implicit Norm: The Norm of Published Attribution

  The standard philosophical candidates for a norm of assertion are:
  *   **The Truth Norm:** Assert $p$ only if $p$ is true.
  *   **The Knowledge Norm:** Assert $p$ only if you know $p$ (Timothy Williamson).
  *   **The Justification Norm:** Assert $p$ only if you have adequate justification for $p$.

  Wikipedia's policy explicitly rejects the **Truth Norm** (summarized in the slogan "Verifiability, not Truth") and the **Knowledge Norm** (via the "No Original Research" policy, which bans personal knowledge). It also modifies the **Justification Norm**: justification cannot be private or logical; it must be *bibliographic*.

  Therefore, the norm presupposed by Wikipedia is best reconstructed as the **Norm of Published Attribution**:
  > **Assert $p$ in an article only if $p$ is attributable to a published, independent, reliable source.**

  Crucially, the speech act performed by a Wikipedia editor is not "I assert that $p$ is the case," but rather "I assert that *reliable sources report* that $p$ is the case." The truth condition of the Wikipedia sentence shifts from the state of the world (did the event happen?) to the state of the literature (was the event reported?).

  This explains the "oddity" you note. A firsthand witness cannot contribute because they cannot provide a *published attribution* for their knowledge. A second-hand newspaper report is admissible because it provides the required *attribution*, even if the underlying fact is dubious. The editor is not vouching for the fact; they are vouching for the existence of the report.

  ### 2. Wikipedia vs. The Courtroom: Divergent Telos

  Does this same norm explain why hearsay is barred in court? No. The difference arises because the two institutions have different **telos** (ends), which dictates different norms of evidence.

  *   **The Courtroom (First-Order Truth-Finding):** The goal is to adjudicate liability based on what *actually happened*. Hearsay is excluded because it breaks the chain of accountability required to establish first-order truth. The court needs to cross-examine the knower to test the reliability of the perception and memory. The norm here is a **Norm of Direct Accountability**: Assert $p$ as evidence only if you can be cross-examined on your basis for believing $p$.
  *   **Wikipedia (Second-Order Consensus Mapping):** The goal is to summarize the *current state of public discourse*. Wikipedia is an encyclopedia of *what is published*, not an encyclopedia of *what is*. Hearsay (published reports) is welcome because the report itself is the object of study. If the *New York Times* reports an event, that report is a social fact regardless of the event's ontological status. The norm here is a **Norm of Institutional Trackability**: Assert $p$ only if the claim can be tracked back to an institution that assumes liability for it.

  In court, the witness *is* the source. On Wikipedia, the source *replaces* the witness. The Wikipedia norm privileges the **institutional vetting process** (editorial oversight) over the **epistemic proximity** (eyewitness status) that the court privileges.

  ### 3. Strict Requirements vs. Good Fit

  To understand the norm philosophically, we must distinguish what the practice *strictly requires* from what merely *fits well* with it.

  *   **Strict Requirement:** The presence of a citation to a source classified as "reliable" by community consensus. The editor's mental state (belief, knowledge, certainty) is irrelevant. The ontological status of the claim (true/false) is irrelevant.
  *   **Fits Well (but not required):**
      *   **Truth:** Most reliable sources aim for truth, so following the norm usually results in true articles. However, the norm does not *require* truth, only publication.
      *   **Knowledge:** Most authors of reliable sources know what they write. However, the norm does not require the *editor* to know, nor does it verify that the *author* knew.
      *   **Consensus:** Often, multiple sources agree. But the norm allows a claim based on a single reliable source, even if it contradicts the majority view (provided it is attributed as a minority view).

  The practice is designed to function even when truth and knowledge are absent, provided the *paper trail* exists.

  ### 4. Philosophical Underdetermination: Rival Norms

  While the **Norm of Published Attribution** describes the mechanism, the practice is philosophically underdetermined regarding *why* we should follow it. Several rival normative frameworks could license the exact same Wikipedia rules without agreeing on the underlying epistemology.

  **A. The Liability-Shifting Norm**
  *   **Reconstruction:** Assert $p$ only if another party assumes legal/reputational liability for $p$.
  *   **Explanation:** Wikipedia is a volunteer project vulnerable to libel suits and credibility attacks. By requiring publication, Wikipedia shifts the epistemic risk from the volunteer editor to the publisher (e.g., Oxford University Press, BBC).
  *   **Underdetermination:** This norm explains the exclusion of personal knowledge (no liability shift) and the inclusion of newspaper reports (publisher assumes liability) without committing to any claim about truth or knowledge. It is a pragmatic, legalistic norm rather than an epistemic one.

  **B. The Consensus-of-Expertise Norm**
  *   **Reconstruction:** Assert $p$ only if $p$ has survived institutional scrutiny.
  *   **Explanation:** This views "reliable sources" as proxies for peer review or editorial oversight. The norm values the *process* of verification over the *act* of witnessing.
  *   **Underdetermination:** This justifies the hearsay rule difference. Courts value the *raw data* (testimony) verified by cross-examination. Wikipedia values the *processed data* (articles) verified by editorial review. Both norms license the same Wikipedia rules but disagree on whether "scrutiny" happens before publication (Wiki) or after testimony (Court).

  **C. The Neutrality Norm (WP:NPOV)**
  *   **Reconstruction:** Assert $p$ only if $p$ represents a significant viewpoint in the public sphere.
  *   **Explanation:** Wikipedia aims to reflect the world as described, not as it is. If a dubious claim is widely reported, it is a significant part of the discourse and must be included (with attribution).
  *   **Underdetermination:** This norm suggests Wikipedia is not trying to be an authority on facts, but an authority on *discourse*. It licenses the inclusion of "dubious" reports because their existence is the fact being recorded.

  ### Conclusion

  The Wikipedia practice presupposes a **Norm of Published Attribution**, which treats assertions as claims about the literature rather than claims about the world. This distinguishes it from the Knowledge Norm of conversation and the Direct Accountability Norm of the courtroom.

  However, the practice is philosophically underdetermined between an **Epistemic interpretation** (published sources are more likely to be true due to editorial oversight) and a **Pragmatic/Legal interpretation** (published sources shift liability away from the platform). The exclusion of firsthand knowledge and the inclusion of second-hand reports are licensed equally well by a desire to map public discourse, a desire to avoid legal liability, or a desire to privilege institutional vetting over individual perception. The "oddity" vanishes once we recognize that Wikipedia editors are not asserting facts; they are curating citations.
