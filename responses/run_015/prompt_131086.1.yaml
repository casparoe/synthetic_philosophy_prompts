answer: |-
  This is a genuine meta-ethical and normative ethical problem, not just a social faux pas. You are asking whether moral truths are context-independent (universal) or context-dependent (particular), and whether "factual correctness" carries moral weight that overrides "social harmony."

  Here is the breakdown of what is settled, what is contested, and where the philosophical arguments actually land on your situation.

  ### 1. The Meta-Ethical Question: Is there an objective fact here?
  **Status: Deeply Contested.**

  You asked if there is an "objective fact about whether I was out of line." In philosophy, this is the debate between **Moral Realism** and **Moral Anti-Realism**.

  *   **Moral Realists** argue that moral statements can be objectively true or false, independent of human opinion. If a Realist looks at your situation, they would argue there *is* a correct answer. However, Realists disagree on *what* makes it correct.
      *   A **Utilitarian Realist** would say the objective truth depends on the net outcome. If humiliating the man saves the crop and feeds more people, you were objectively right. If it causes a rift that destroys the garden group, you were objectively wrong. The "fact" exists, but it requires calculating consequences you might not have yet.
      *   A **Deontological Realist** (Kantian) might argue there are universal duties. You have a duty to truth, but also a duty to treat humanity as an end, not a means. Publicly correcting an elder could be seen as using him as a prop to demonstrate your own competence, violating his dignity. For this realist, you might be objectively wrong regardless of the tomato yield.

  *   **Moral Anti-Realists (Relativists/Constructivists)** argue that moral truths are not discovered like math; they are constructed by societies or individuals.
      *   **Cultural Relativists** would say there is no "view from nowhere." There is only "what is right within the framework of this garden group." If the group's norm is "deference to elders," then within that system, you were wrong. There is no external court of appeal.
      *   **Error Theorists** would go further and say *all* moral claims are false, so the question of "right or wrong" is category error.

  **The Consensus:** There is **no consensus** in philosophy that one of these frameworks is the "correct" one. The "Argument from Disagreement" (the fact that cultures disagree, as your roommate noted) is often used to support Anti-Realism, but Realists counter that disagreement about physics doesn't mean physics is made up. So, cultural difference does not *prove* morality is subjective, but it does complicate the claim that your specific intuition is universal.

  ### 2. The Normative Question: Does Truth Override Deference?
  **Status: Contested, but with a strong leaning toward "Context Matters."**

  Even if we assume there *is* a moral truth, normative ethics (how we apply it) suggests you are conflating **factual accuracy** with **moral righteousness**.

  *   **Virtue Ethics (Aristotle):** This framework is less about rules and more about *phronesis* (practical wisdom). A virtuous person tells the truth, but they also know *how, when, and where* to tell it. Aristotle would argue that correcting the man publicly wasn't "honesty"; it was a lack of wisdom. The "right action" isn't just "state the fact," it is "state the fact in the way that preserves the community." By failing to read the room, you failed the virtue of tact, which is a moral failing in this framework.
  *   **Care Ethics:** This feminist-derived framework argues that morality is rooted in relationships, not abstract rules. In Care Ethics, maintaining the relationship *is* the moral priority. If your action damaged the relational web of the garden, it was morally deficient, regardless of the botanical facts. The "logic" of the plant does not override the "logic" of the care network.
  *   **Universalism vs. Particularism:**
      *   **Universalists** argue that certain principles (like "do not humiliate") apply everywhere.
      *   **Particularists** argue that the moral weight of a principle changes based on context. In a lab, accuracy overrides feelings. In a community garden, cohesion might override accuracy.

  **The Consensus:** There is **no universal agreement** that honesty always trumps deference. In fact, most contemporary ethicists reject the idea that moral rules function like algorithmic code (If X, then Y). Most agree that **context is a moral variable.** Ignoring the social context isn't "being objective"; it's ignoring a relevant piece of data.

  ### 3. The "Logic" Trap: Are you imposing values?
  **Status: Largely Settled (Yes, you are).**

  You mentioned you grew up where being direct is "practical" and you wonder if you are "pushing your own background's values and calling them logic."

  Philosophers of language and culture (like Wittgenstein or contemporary pragmatists) would largely agree with you here. What counts as "logical" or "practical" is often internal to a "form of life."

  *   **Instrumental Rationality:** Your logic was: *Tight spacing -> Rot -> No tomatoes.* This is instrumental rationality. It is factually sound.
  *   **Social Rationality:** The group's logic is: *Public correction -> Loss of Face -> Loss of Trust -> No volunteers -> No garden.* This is also instrumental rationality.

  You treated your logic as "neutral" and theirs as "emotional." But from a philosophical standpoint, **both are value-laden.** You prioritized the *crop*. They prioritized the *community*. Neither is "neutral."

  There is a strong consensus in social philosophy that **efficiency is a value, not a fact.** By prioritizing the survival of the tomatoes over the feelings of the volunteer, you made a value judgment. You just disguised it as "common sense."

  ### 4. Is "Face" a Moral Rule or Etiquette?
  **Status: Contested, but Anthropology/Ethics overlap suggests it functions as Morality.**

  Your roommate mentioned that in some cultures, "not embarrassing an elder" is a moral rule, while in others it's etiquette.

  *   **The Distinction:** Morality is usually defined as "obligations that cannot be opted out of" (you can't choose to stop believing murder is wrong), whereas etiquette is optional (you can choose to use the wrong fork).
  *   **The Reality:** In many collectivist cultures (and many tight-knit communities), "loss of face" causes tangible social harm (ostracization, loss of status). If an action causes tangible harm, many ethicists argue it crosses from etiquette into morality.
  *   **The Argument:** If humiliating the man causes him psychological pain or social exclusion comparable to physical harm, then a Universalist would say it *is* a moral violation, regardless of culture. A Relativist would say it's only a violation *within that culture*.

  **The Consensus:** There is no agreement on where the line is. However, there is agreement that **dismissing harm because it is "just feelings" or "just culture" is philosophically weak.** If the harm is real (social isolation, distress), it carries moral weight.

  ### Summary: What is the "Right Answer"?

  1.  **Is there an objective moral fact?** Philosophy has not settled this. If Moral Realism is true, there is an answer, but it likely involves weighing the harm to the plants against the harm to the social fabric. If Anti-Realism is true, the "right" answer is determined by the norms of the specific community you are in.
  2.  **Did you make a mistake?** Under **Virtue Ethics** and **Care Ethics**, yes. You prioritized abstract correctness over relational wisdom. Under **Utilitarianism**, it depends on the long-term outcome (did the group split?). Under **Deontology**, it's mixed (duty to truth vs. duty to respect).
  3.  **Are you imposing values?** Yes. You treated "agricultural efficiency" as a higher moral good than "social cohesion." That is a cultural value, not a law of physics.

  **The Straight Answer:**
  There is no settled philosophical consensus that "honesty" or "efficiency" objectively overrides "deference" or "harmony." The idea that there is a "neutral" way to speak that is purely logical is widely rejected in philosophy of language and ethics. All communication carries social weight.

  You are not "wrong" for valuing the tomatoes, but you are likely wrong in assuming your valuation was the only rational one. The group operates on a different moral calculus where **social capital is a resource just as real as soil nutrients.** By spending their social capital without their consent to save soil nutrients, you violated the local moral economy.

  Whether that makes you *universally* immoral is an open metaphysical question. Whether it makes you *locally* disruptive is a factual one.
