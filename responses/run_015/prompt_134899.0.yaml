  7.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Academic but accessible (jurisprudence student to student).
      *   *Structure:*
          1.  Intro (Hart-Devlin context).
          2.  Rule 1 (Radical Autonomy).
          3.  Rule 2 (Institutional Corruption/Exploitation).
          4.  Best Guess (Ban).
