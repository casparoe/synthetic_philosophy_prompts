      *   *Rule 2: The Anti-Exploitation/Structural Corruption Principle.* Law intervenes to prevent exploitation of vulnerability or corruption of essential social institutions (medicine, justice), even with consent.
          *   *Fit:* Fits Surrogacy perfectly. Fits Bribery (corruption). Fits Drugs/Adultery (no structural corruption).
          *   *Prediction for Clubs:* **Ban.** Fighting clubs corrupt the medical ethos (healing vs. harming) and exploit economic desperation (fighting for money/status, even if no betting, implies incentive). Or, it normalizes violence which harms the social fabric.

      *   *Rule 3: The Public/Private Distinction (Devlin-lite).* Law intervenes when acts have public ripple effects or normalize harmful behavior, even if conducted privately.
          *   *Fit:* Fits Surrogacy (medical ethics is public). Fits Bribery. Fits Flag Burning (no ripple).
          *   *Prediction for Clubs:* **Ban.** Serious violence, even private, erodes the state's monopoly on force or normalizes brutality.

      *   *Refining Rule 2 & 3:* The prompt says he supports the surrogacy ban *specifically* on "exploitation of vulnerable women and corrupts medical ethics." This is key. It's not just "public ripple." It's about *institutional integrity* and *asymmetric power*.
      *   Let's refine the rules to be more distinct.
