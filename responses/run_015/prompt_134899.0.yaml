answer: |-
  This is a classic Hart-Devlin problem set, but your professor is clearly navigating a middle path. He isn't a pure Legal Moralist (Devlin) because he rejects policing private morality (adultery, drugs). He isn't a pure Legal Liberal (Hart/Mill) because he accepts bans that aren't about direct "harm to others" in the traditional sense (surrogacy).

  He seems to be operating with a **Modified Harm Principle**: The state should not interfere with private consent *unless* that consent occurs within a context of structural exploitation or institutional corruption.

  Here are the two plausible rules derived from his track record, how they apply to the combat clubs, and the analysis you asked for.

  ### Rule 1: The "Radical Autonomy" Principle (Hartian)
  **The Rule:** The state may only criminalize conduct that causes non-consensual harm to third parties. Consensual self-harm or mutual risk-taking between adults is outside the law's jurisdiction, regardless of moral offense or physical damage.
  *   **Track Record Fit:** Explains **Private Drug Use** (self-harm), **Adultery** (private moral failure), and **Flag Burning** (offense $\neq$ harm). It struggles slightly with **Surrogacy** unless you argue the "vulnerability" makes consent impossible, but it fits **Bribery** (harm to the public system).
  *   **Prediction for Combat Clubs:** **Legalize.**
      *   **Reasoning:** The participants are consenting adults. There is no audience (no public corruption), no betting (no gambling harm), and medical staff mitigates the damage. The injury is "self-harm" by proxy (I agree to let you hit me). Under this rule, the state has no standing to intervene.
  *   **Closest Analog:** **Private Drug Use.** Both involve adults choosing to damage their own bodies in private.

  ### Rule 2: The "Institutional Integrity & Exploitation" Principle (Modified Hart)
  **The Rule:** The state may criminalize consensual conduct if it (a) relies on the exploitation of systemic vulnerability, or (b) corrupts the ethical function of a protected social institution (like medicine or government), even if no immediate third-party victim exists.
  *   **Track Record Fit:** Explains **Commercial Surrogacy** (exploits vulnerability/corrupts medicine), **Bribery** (corrupts government), and arguably **Flag Burning** (doesn't corrupt an institution). It distinguishes **Drugs/Adultery** (no institutional corruption involved).
  *   **Prediction for Combat Clubs:** **Ban.**
      *   **Reasoning:** This is the stronger fit for his specific reasoning on surrogacy. The presence of **medical staff** is the smoking gun. In his view, medicine is a healing institution; employing doctors to facilitate and patch up intentional serious injury corrupts medical ethics (turning healers into enablers of violence). Furthermore, "combat clubs" historically attract economically vulnerable men seeking payout or status, mirroring the "vulnerable women" rationale in surrogacy.
  *   **Closest Analog:** **Commercial Surrogacy.** Both involve a private contract where medical professionals are used to facilitate a physically taxing/risky process that treats the body as a site of risk/exchange, potentially exploiting economic desperation.

  ---

  ### Best Guess: He Will Ban It (Rule 2)
  **Why:** The Surrogacy verdict is the "dog that didn't bark." If he were a pure Hartian, he would have supported surrogacy (it's a private contract between adults). The fact that he banned it specifically on **medical ethics** and **exploitation** grounds signals that consent is not a magic shield for him when institutions are involved.

  The combat club proposal is essentially *Surrogacy with Punches*.
  1.  **Medical Corruption:** Just as he believes doctors shouldn't facilitate surrogacy (turning reproduction into service), he will likely argue doctors shouldn't facilitate maiming (turning trauma care into a safety net for sport).
  2.  **The "No Licensing" Clue:** The prompt notes "no state licensing." To a jurisprudence prof, unregulated physical violence looks less like "autonomy" and more like the "law of the jungle," which threatens the state's monopoly on force.
  3.  **Harm Definition:** He distinguishes "self-harm" (drugs) from "interpersonal violence" (fighting). Even with consent, serious bodily injury is often treated in law (e.g., *R v Brown*) as a public harm because it normalizes violence.

  ### The Splitter Hypothetical
  To prove which rule he is actually running, you would need a case that isolates **Medical Corruption** from **Exploitation**.

  **Hypothetical:** *Consensual Surgical Amputation.*
  A wealthy, mentally competent adult pays a surgeon to remove a healthy limb for body-modification purposes. The patient is not vulnerable (wealthy), there is no exploitation, but the doctor is corrupting medical ethics (cutting healthy flesh).

  *   **Rule 1 (Radical Autonomy) predicts:** **Legal.** (Consent is valid, no third-party harm).
  *   **Rule 2 (Institutional Integrity) predicts:** **Illegal.** (Corrupts the healing purpose of medicine, regardless of wealth/consent).

  If he bans this, Rule 2 is confirmed. If he allows it, Rule 1 is confirmed (and the Surrogacy ban was purely about economic vulnerability).

  ### What Would Change My Mind?
  I would flip my prediction if you could argue that the **medical staff are independent emergency responders** rather than **employees of the club.**

  *   **The Argument:** If the doctors are not "facilitating" the harm (like in surrogacy) but are merely on standby as neutral trauma care (like a ringside physician in boxing), the "corruption of ethics" charge weakens.
  *   **The Flip:** If he accepts that distinction, he might treat this like **Private Drug Use** (self-regarding risk) rather than **Surrogacy** (institutional corruption). If he views the medical presence as *mitigating* harm rather than *enabling* it, the "Institutional Integrity" rule collapses, and he defaults to Liberty.

  ### Where My Reasoning is Shakiest
  The weakest link in my analysis is the interpretation of **"Medical Corruption."**
  In surrogacy, the doctor *creates* the condition (pregnancy) for the contract. In combat clubs, the doctor *treats* the condition (injury) resulting from the contract.
  *   **The Risk:** He might view trauma care as ethically neutral (doctors always fix wounds, regardless of how they were got), whereas surrogacy is ethically active. If he sees the medical role as passive, the Surrogacy analog breaks, and he might vote to **Legalize** based on the Drug/Adultery precedent. I am betting that he views the *presence* of medical support as an enabler that makes the violence possible, but that is a nuanced distinction that could go either way in seminar.
