      *   *Refining the "Best Guess":* The Surrogacy verdict is the biggest clue. It shows he isn't a pure Hartian. He cares about *how* consent is structured within institutions. Combat clubs involve medical staff enabling harm. This mirrors surrogacy (medical staff enabling commodification). He will likely ban it.
