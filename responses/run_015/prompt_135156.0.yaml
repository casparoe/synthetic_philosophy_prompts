answer: |-
  ### The Guilt Taxonomy Handout

  Here's the decision tree. Don't overthink the labels; just answer the questions as they come. If you hit a leaf, that's your position.

  **Q1: Can a group be guilty, or only people?**
  *   **Only people:** Go to **Leaf 1**.
  *   **Groups can be guilty:** Go to Q2.

  **Q2: If every citizen who committed the wrong is dead, what keeps the nation the same "culprit"?**
  *   **Nothing (The state died too):** Go to **Leaf 2**.
  *   **Blood/Culture/Spirit:** Go to **Leaf 3**.
  *   **Laws/Borders/Constitution (Institutions):** Go to Q3.

  **Q3: Is this guilt about being a bad person (moral) or just owing a debt/fixing stuff (political)?**
  *   **Bad person (Moral):** Go to **Leaf 4**.
  *   **Owing a debt (Political):** Go to Q4.

  **Q4: To say the debt passes down, do you have to believe in a national "spirit" or bloodline?**
  *   **Yes (Forces Essentialism):** Go to **Leaf 5**.
  *   **No (Structural account dodges that):** Go to Q5.

  **Q5: Where does the liability come from?**
  *   **Benefits received (Unjust Enrichment):** Go to **Leaf 6**.
  *   **Continuity of Agency:** Go to Q6.

  **Q6: Who is the "Agent" that owes the debt?**
  *   **The Citizens (We own the state):** Go to **Leaf 7**.
  *   **The State Corp (The legal person):** Go to **Leaf 8**.

  ***

  **The Leaves**

  *   **Leaf 1: Strict Methodological Individualist**
      *   *Claim:* Only biological humans have souls/minds, so only they can be guilty. Nations are just words.
      *   *Awkward Commitment:* You can't blame a corporation for fraud, only the CEO; collective action problems vanish.
  *   **Leaf 2: Generational Cutoff**
      *   *Claim:* The state is just the people. No people left = no state = no guilt.
      *   *Awkward Commitment:* Treats nations like mayflies; ignores legal continuity of debt and treaties.
  *   **Leaf 3: Ethnic Essentialist**
      *   *Claim:* The "Volk" survives death. Guilt is in the blood or cultural DNA.
      *   *Awkward Commitment:* Commits you to mystical biology; makes conversion or immigration impossible for cleansing guilt.
  *   **Leaf 4: Collective Moral Guilt**
      *   *Claim:* The nation is a moral agent with a soul. It is literally sinful.
      *   *Awkward Commitment:* Requires metaphysical realism about groups; hard to punish a "soul" without hurting innocents.
  *   **Leaf 5: [Unnamed] Political Liability via Essentialism**
      *   *Claim:* You owe reparations not because of laws, but because of who you *are*.
      *   *Awkward Commitment:* You owe debt based on DNA even if you rejected the state and gained no benefit.
  *   **Leaf 6: Structural-Transmission-without-Essentialism**
      *   *Claim:* You inherit the ill-gotten gains (roads, wealth) built by the crime, so you pay it back.
      *   *Awkward Commitment:* Doesn't capture "guilt," just debt; doesn't explain why we must reform institutions, not just pay cash.
  *   **Leaf 7: Jaspers-style Political Guilt**
      *   *Claim:* Citizens are liable for the deeds of their state because they empower it.
      *   *Awkward Commitment:* Makes guilt voluntary (did you vote?) or unavoidable (were you born here?) with no middle ground.
  *   **Leaf 8: Corporate-Agent-with-Institutional-Continuity**
      *   *Claim:* The State is a legal person distinct from citizens. It survives turnover like a company.
      *   *Awkward Commitment:* Citizens pay the bill for a "person" they can't fire; separates liability from moral agency too cleanly.

  ***

