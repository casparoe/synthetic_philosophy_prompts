answer: |-
  ### Desiderata for a Statutory Long-Term Discounting Rule

  **1. The Welfare-Money Distinction**
  *   **Requirement:** The rule must discount *welfare* (utility), not financial flows, distinguishing the pure time preference rate ($\delta$) from the elasticity of marginal utility of consumption ($\eta$) and expected growth ($g$).
  *   **Case:** Market rates reflect scarcity and risk, not ethical weight; applying financial discounting to welfare implicitly assumes future generations will be richer and thus value marginal gains less, which must be modeled explicitly, not baked into a single market-derived rate. **[Non-negotiable]**

  **2. Ethical Purity of Time Preference**
  *   **Requirement:** Pure time preference ($\delta$) must be justified ethically, not descriptively, and kept distinct from catastrophe/extinction probabilities ($\delta_{risk}$).
  *   **Case:** A positive $\delta$ based on observed impatience discriminates against future persons simply for being born later, violating the statutory duty of neutrality; extinction risk is a probability of *no* benefit, not a discounting of *some* benefit, and must be modeled as a hazard rate. **[Non-negotiable]**

  **3. The Non-Identity Condition**
  *   **Requirement:** The framework must specify whether it is person-affecting or impersonal to handle cases where the project timing alters *who* comes into existence.
  *   **Case:** If a sea defence changes marriage/conception timing, the beneficiaries in 100 years are different people; a person-affecting view might see no obligation to them, while an impersonal view counts their welfare regardless of identity. **[Camp Preference: Impersonal Totalism]**

  **4. Term Structure Specification**
  *   **Requirement:** The rule must declare whether the discount rate is flat or declining (e.g., hyperbolic or Gamma-distributed uncertainty) over the 80–150 year horizon.
  *   **Case:** Uncertainty about future growth or the correct rate itself mathematically implies a declining certainty-equivalent rate; a flat rate over 150 years effectively zeroes out distant tail risks. **[Camp Preference: Declining]**

  **5. Dynamic Consistency (Time Consistency)**
  *   **Requirement:** The rule must yield a plan that remains optimal when re-evaluated at future budget cycles without commitment devices.
  *   **Case:** If the rule changes the valuation of a remaining 80-year horizon simply because 20 years have passed, the office will perpetually postpone long-term investment in favour of nearer-term projects. **[Non-negotiable]**

  **6. Market and Political Independence**
  *   **Requirement:** The rule must not calibrate $\delta$ to observed market yields or political myopia.
  *   **Case:** Markets are populated by finite-lived agents with no voting stake in the 22nd century; mirroring their revealed preference abdicates the statutory duty to represent the unrepresented. **[Non-negotiable]**

  **7. Budget Constraint vs. Moral Obligation**
  *   **Requirement:** The rule must distinguish the *social discount rate* (for project ranking) from the *optimal savings rate* (for intertemporal budget allocation).
  *   **Case:** A low discount rate implies we *should* invest more, but does not magically create fiscal space; conflating the two leads to either over-investment in low-yield projects or under-investment due to artificial shadow prices. **[Non-negotiable]**

  **8. Non-Separable Existential Benefits**
  *   **Requirement:** The framework must accommodate benefits that alter the probability of the future stream's existence, not just its magnitude.
  *   **Case:** A grid rebuild that lowers civilisational collapse hazard does not add a utility stream; it multiplies the expected value of all future streams; standard additive discounting cannot value a change in the denominator of existence. **[Non-negotiable]**

  ***

  ### The Exclusionary Requirement
  **Dynamic Consistency** is the single requirement that excludes the most candidates, as it mathematically rules out naive declining-rate schedules (like hyperbolic discounting) unless they are derived from specific uncertainty models that preserve consistency, eliminating most ad-hoc policy proposals.

  ### The Unsatisfiable Triangle
  I confirm your suspicion: **Horizon-declining rates, stability under repeated re-optimisation, and consequentialist re-evaluation** are jointly unsatisfiable without an external commitment mechanism; you must sacrifice either the declining structure (to save consistency), the stability (accepting policy drift), or the pure consequentialism (adopting rule-utilitarian constraints).

  ***

  ### Critiques of Standard Families

  **Zero Pure Time Preference with a Growth Term:** This approach risks implying implausibly high optimal savings rates, demanding excessive sacrifice from the present poor for the sake of the future rich.

  **Positive Pure Rate Calibrated to Observed Choice:** This fails the statutory duty by treating the date of birth as a morally relevant characteristic, effectively disenfranchising future generations.

  **Declining-Horizon Schedules:** While intuitively appealing for uncertainty, these typically violate dynamic consistency, inviting future administrations to systematically defer costs and cancel long-term projects.

  **Zero Pure Time Preference with a Sustainability Constraint:** This creates an incoherent dual-objective function that lacks a marginal trade-off rule, making it impossible to rank projects that offer partial rather than total sustainability.
