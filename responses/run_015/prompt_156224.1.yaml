  5.  **Refine the Tone:**
      *   Intellectual, rigorous, avoiding standard "nudging is manipulation" tropes.
      *   Engage directly with the "baseline mistake" argument (agree with it mostly, but find where it leaks).
      *   Be honest about where the user's view needs patching.

  6.  **Drafting Content - Key Insights to Integrate:**
