answer: |-
  # Colloquium Prep Sheet: Non-Human Actors & Historical Causality

  ## I. Pre-Emptive Strikes (First 2 Minutes of Q&A)
  *Before they sharpen their knives, disarm the room by conceding the ground they think they need to conquer.*

  **Concede:**
  1.  **To the Climate Scientist:** "I am not making a claim about climate *determinism*. I am making a claim about historical *perception*. Whether Tambora caused 10% or 40% of the crop failure matters less to my argument than the fact that the archives blame the government for a famine the volcano made inevitable."
  2.  **To the Cultural Historian:** "I agree that 'agency' is a metaphor here. I am not granting microbes consciousness. I am using the term to mark a site of causal resistance that the historical actors themselves could not see."

  **Refuse to Give Up:**
  1.  **Credit-Scrambling:** Do not let them convince you that because the archives are wrong, the historian must restore the 'true' human cause. The mismatch *is* the data.
  2.  **The Double Counterfactual:** Do not accept a single-cause explanation. If the human choice didn't matter, it's determinism. If the germ didn't matter, it's backdrop. Hold the line on the intersection.

  ## II. The Objections (Ordered by Damage & Likelihood)

  ### 1. The "Identification" Attack
  **Who:** Physical Climate Scientist (likely joined by Economic Historian)
  **The Objection:** "You're hanging a specific social outcome (riots in 1816) on a specific physical event (Tambora) without an attribution study. Global cooling was under 1°C. Without a counterfactual ensemble showing that harvests *would* have succeeded without the eruption, you're committing the post hoc ergo propter hoc fallacy. How do you know the riots weren't just political?"
  **The Reply (2 mins):** "You're right that I cannot run a climate model in the archive. But my unit of analysis isn't the harvest; it's the *explanation*. My argument is that when the cooling hit, the political system lost the capacity to respond, regardless of the exact degree. I'm not saying the volcano caused the riot directly; I'm saying it removed the 'subsidize grain' option from the menu. The double counterfactual handles this: if the government had different stores (human variance), they survive. If the volcano hadn't erupted (non-human variance), they survive. I only call it an actor when both conditions are met. I'm using your uncertainty as historical data: the ambiguity is what caused the panic."
  **Soft Spot:** You are relying on their science being 'good enough' for history, while they rely on it being 'certain' for physics. If they prove the cooling was negligible in that specific region, your menu doesn't change.

  ### 2. The "Definition" Attack
  **Who:** Senior Cultural Historian (supported by Chair)
  **The Objection:** "If agency requires no intentionality, no consciousness, and no documentary trace of negotiation, why call it 'agency' at all? You're just describing 'constraints' or 'variables.' By using the word 'actor,' you're smuggling in moral weight without moral capacity. Isn't this just rebranding structuralism?"
  **The Reply (2 mins):** "Because 'constraint' implies a static wall, whereas 'menu-setting agency' implies a dynamic interaction that unfolds over time. A variable sits in a regression; an actor disrupts a narrative. When yellow fever killed Napoleon's troops, it didn't just lower a number; it reorganized the social hierarchy of the island, empowered different human actors, and changed what was *thinkable*. I use 'agency' to force the historian to look for the non-human in the human decision. If I call it a 'variable,' I can ignore it until the data is clean. If I call it an 'actor,' I have to explain why the archive ignored it."
  **Soft Spot:** You are arguing for a literary utility, not a philosophical one. If they press on whether this changes *causal* explanation or just *storytelling*, you risk admitting it's only the latter.

  ### 3. The "Exoneration" Attack
  **Who:** Environmental Historian #1
  **The Objection:** "If we say the volcano caused the famine, or the germ caused the defeat, who gets off the hook? Colonial mismanagement in Saint-Domingue was brutal. If you give the microbe too much credit, you risk absolving the colonial administration of the conditions that made the epidemic lethal. This smells like Guns, Germs, and Steel."
  **The Reply (2 mins):** "The double counterfactual is my guard against exoneration. I only promote the germ to actor if a *different human arrangement* would have changed the outcome. If better sanitation or different troop deployment saves the army, then the germ isn't the sole author. I'm not saying humans aren't responsible; I'm saying they are responsible for how they arrange themselves *against* the non-human. The volcano doesn't absolve the government; it indicts their lack of resilience. I'm adding a defendant, not releasing one."
  **Soft Spot:** In the Saint-Domingue case, the "different human arrangement" (e.g., not invading) is a massive counterfactual. They may argue that the invasion itself was the variable, making the germ secondary.

  ### 4. The "Boundary" Attack
  **Who:** Grad Student (ANT reader)
  **The Objection:** "If microbes are actors because they constrain menus, why aren't sugar, rats, or soil actors? What is your stopping rule? If everything is an actor, nothing is. You need a symmetry principle, or you're just picking the exotic non-humans that fit your thesis."
  **The Reply (2 mins):** "My stopping rule is the 'credit-scrambling' test. Sugar and soil are usually background; they don't systematically cause the archives to misattribute cause in the same way. I'm not mapping all actants; I'm mapping *disruptors*. I only care about the non-human when it creates a phase shift between decision and effect that confuses the historical record. If the soil fails silently, it's a variable. If the volcano erupts and everyone blames the King, it's an actor. The criterion is the archival distortion, not the ontology."
  **Soft Spot:** This is arbitrary. Why is archival distortion the only metric that matters? A materialist would say the soil's agency exists regardless of what the archive says.

  ### 5. The "Endogeneity" Attack
  **Who:** Economic Historian
  **The Objection:** "The timing isn't random. Napoleon went to Saint-Domingue *when* he did for political reasons. The harvest failures led to policy changes that led to more failures. Isn't the 'non-human' timing endogenous to the human system? You can't separate the clock."
  **The Reply (2 mins):** "The clocks are different, which is exactly my point. The volcano runs on a geological clock; the harvest on an agricultural one; the policy on a parliamentary one. They sync up by accident, not design. That asynchronicity is the source of the 'credit-scrambling.' I'm not saying they are separate systems; I'm saying they are coupled systems with different latencies. The endogeneity is the mess I'm trying to describe, not a bug I need to control for."
  **Soft Spot:** If the human decision to invade was influenced by prior climate conditions (which it often was), your 'independent' non-human variable is contaminated.

  ## III. The Alliance to Watch
  **The Climate Scientist and the Economic Historian.**
  They will gang up on **Identification**. The Scientist will say the physical link is weak; the Economist will say the causal link is unproven. Together, they will argue you have a correlation dressed up as a narrative.
  *Defense:* Pivot to the **Archive**. "You are asking for proof of the *event*; I am providing proof of the *reaction to the event*. Even if your models are uncertain, the historical actors *believed* the volcano caused the famine, and they acted on that belief. That is my data."

  ## IV. The Question You Hope Nobody Asks
  **The Question:** "If 'menu-setting agency' is defined by its capacity to constrain human options and alter outcomes based on counterfactuals, **what does 'agency' buy you that 'constrained independent variable' does not, other than literary flair?**"

  **Classification:** This is the **"What does agency buy you that independent variable doesn't"** question.

  **Honest Assessment:** **This is the one you cannot answer.**
  Your "double counterfactual rule" is literally the definition of an interaction term in a regression model (Human Choice × Non-Human Condition). If you strip away the narrative utility (making the story more interesting/complex), the *causal* work "agency" does is identical to "variable."
  *Why you can't answer:* Because you are a historian, not a philosopher of science. You need the word "agency" to get purchase in your department and to signal "Environmental History," but functionally, you are describing probabilistic causality.
  *Strategy if Asked:* Do not try to define it ontologically. Pivot to **Pedagogy and Archive**. "It buys me the ability to read the archive against the grain. A 'variable' is something I control for. An 'actor' is something I have to listen to. It changes how I teach students to read a letter from 1816. It forces them to look for the silence where the volcano should be." (This admits it's a literary/heuristic tool, which satisfies the Chair but might annoy the Scientist).
