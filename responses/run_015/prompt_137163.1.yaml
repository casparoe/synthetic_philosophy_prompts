      *   *Nyāya View:* *Śabda* requires a *āpta* (trustworthy person) who has *yathārtha-jñāna* (veridical knowledge) and *iccha* (intention to communicate).
      *   *Chatbot:* No mind, no intention, no knowledge. It is a tool. Believing it is *anumāna* (inference) based on the reliability of the programmers/data, OR it is *smṛti* (memory) of the training data, OR it is not *pramā* (knowledge) if the chain is broken.
      *   *Verdict:* It is *not* *śabda-pramāṇa*. It is likely *anumāna* (inferring the programmers got it right) or simply true belief without *pramāṇa* status if the causal chain is too attenuated.
      *   *Key Feature:* Existence of a speaker with intentions (*tātparya*). Without *tātparya*, there is no *śabda*.
