answer: |-
  This is a fantastic reconstruction of a classic objection to teleosemantics, often called the **"Problem of Liberalism"** or the **"Too Many Minds"** objection. You have effectively stumbled upon one of the most persistent critiques of the Millikan/Papineau style of teleosemantics.

  The good news is that you don't have to abandon (1). The exit is available, but it requires tightening the definition of "function" in a specific way.

  Here is the diagnosis of where the chain slips, how to block it, and why the "consumer mechanism" worry isn't a regress.

  ### 1. The Slip is in (3): Tracking $\neq$ Representing
  Your intuition that the slide happens at (3) is correct, but the reason isn't just that "tracking" is too weak. It's that teleosemantics requires a specific **relational structure** that the immune system (and the liver) generally lacks.

  On the standard Millikan view, a state $R$ has the content "there is an $X$" only if:
  1.  **Producer Function:** The mechanism producing $R$ has the function of producing $R$ when $X$ is present.
  2.  **Consumer Function:** There is a *separate* mechanism (the consumer) that has the function of using $R$ to guide a specific action, and the success of *that* action depends on $X$ actually being present.

  **Why the Immune System Fails the Test:**
  In the immune system, the "recognition" (antibody binding) and the "destruction" (macrophage engulfment) are often chemically coupled in a lock-and-key fashion. There isn't a distinct "consumer" system interpreting a signal and deciding what to do based on a map of the world. The binding *is* the neutralization.

  If the binding is just a causal trigger for a downstream chemical cascade, it's **biological function**, but it isn't **representational content**. Representation requires a degree of **decoupling**. The signal must be able to be "read" by a consumer system to guide behavior *under the aspect* of the content.

  **The Exit:** You block (3) by insisting that teleosemantic content requires a **Producer/Consumer architecture**. Without a distinct consumer system that relies on the accuracy of the signal to perform a separate function, you have mere biological regulation, not representation.

  ### 2. The Test of Misrepresentation
  A powerful way to solidify this block is to look at **error**.
  *   **Mental Representation:** A frog's fly-detector fires at a BB pellet. The frog snaps. This is a *representational error*. The system functioned normally, but the content was false.
  *   **Immune/Liver:** If an antibody fails to bind a virus, or binds a healthy cell (autoimmune), is that a *misrepresentation*? Usually, we describe this as **mechanical failure** or **system malfunction**, not "false belief."

  If the immune system literally had content "Virus Present," then an autoimmune attack would be a "false belief" that healthy tissue is a virus. While some philosophers (like Bergstrom) are happy to say this, most teleosemanticists want to reserve that normative status for cognitive systems. By requiring the Producer/Consumer split, you ensure that misrepresentation is possible in a way that implies a "map" being used, not just a gear slipping.

  ### 3. Addressing Premise (4): Markets and Artifacts
  Premise (4) extends the argument to markets. This is easier to block if you stick to **biological teleology**.
  *   Markets do not have a selection history in the *biological* sense (reproduction via DNA). They have cultural evolution, but the "mechanisms" (prices) are not produced by mechanisms selected for their semantic accuracy in the same way neural states are.
  *   If you allow designed artifacts (thermostats) to have content, you do get a form of pansemioticism. However, most teleosemanticists argue that artifacts derive their "function" from *our* intentions, whereas mental content must be **intrinsic** (derived from natural selection alone). So, markets and thermostats have "derived content," while brains have "underived content." This preserves the specialness of the mental.

  ### 4. Your Worry About the "Consumer Mechanism"
  You asked: *"If I block the slide, do I have to accept that mental content requires some special consumer mechanism, and doesn't that just push the naturalization problem back one step?"*

  This is the deepest philosophical worry here. It feels like saying "Representation requires a Consumer" just leads to asking "How does the Consumer understand the signal?" (The Homunculus worry).

  **Why it's not a regress:**
  The teleosemanticist answers that the Consumer does **not** need to "understand" the signal in a semantic sense. The Consumer just needs to have a **selected function** that is successfully performed *only if* the signal matches the world.

  *   **Example:** A moth's nervous system (Consumer) has the function of steering away from high-frequency sounds. The ear (Producer) has the function of firing when bats are present.
  *   The nervous system doesn't need to "know" what 'bat' means. It just needs to be a mechanism that was selected because, historically, when the ear fired, steering away led to survival.
  *   The "aboutness" is fixed by the **historical correlation** between the Producer's trigger, the Consumer's response, and the environmental condition that made that correlation successful.

  So, positing a consumer doesn't push the problem back; it **anchors** the content. It stops the content from being "cheap" by requiring that the signal play a specific mediating role in a feedback loop that was selected for.

  ### 5. A Alternative: Embrace "Graded Representationalism"
  There is a second exit, which is to accept a mild version of (5) but deny it's a *reductio*.
  Philosophers like **Peter Godfrey-Smith** suggest that representation is indeed a matter of degree.
  *   Immune systems have **proto-content**.
  *   Simple nervous systems have **basic content**.
  *   Human cognition has **rich, conceptual content**.

  On this view, teleosemantics *does* show that representation is scattered across biology. But that doesn't make the mental case unremarkable; it just naturalizes it by showing its evolutionary roots. The "mental" is just the complex, decoupled, flexible end of the representational spectrum.

  ### Summary of the Fix
  To keep (1) without accepting (6):

  1.  **Reject (3) as stated:** Tracking + Selection is necessary but not sufficient.
  2.  **Add the Consumer Condition:** Representation requires a distinct consumer mechanism that uses the signal to guide action, where success depends on accuracy.
  3.  **Distinguish Function from Content:** Immune systems have biological functions (pumping, binding) but lack the decoupled Producer/Consumer architecture required for *intentional* content.
  4.  **Dismiss the Regress Worry:** The consumer doesn't need to interpret the signal; it just needs to be a mechanism whose success conditions are tied to the signal's accuracy via selection history.

  This saves teleosemantics from making content "too cheap" while maintaining the naturalistic framework you want to keep. You aren't saying the immune system *can't* have content; you're saying it lacks the specific architectural complexity that generates the *normativity* of truth and falsity required for mental states.
