prompt: |-
  Hey — I teach an upper-level undergrad social choice / political economy elective and I'm putting together the final, and I want one question on the Gibbard–Satterthwaite theorem that cant be answered by writing the theorem down and concluding that every nondictatorial rule is manipulable. The students have all had the standard version: strict preferences over m ≥ 3 alternatives, a deterministic social choice function defined on all profiles; if it is strategy-proof and its range contains at least three alternatives, then some voter is a dictator (her top always wins). I dont want any citations or history in it — nobody's looking anything up in the exam.

  Here's the hook I want the question built around. A student last year emailed me claiming he'd refuted the theorem with plurality rule: fix once and for all a tie-breaking order on the alternatives, everyone names her favourite, most votes wins. His argument: plurality is onto, nondictatorial, there are three or more alternatives — and yet no voter can ever make her own favourite win by lying, because her ballot already gives her favourite as much as it possibly can, and lying can only move her vote somewhere else. So, he says, here's a rule that does everything the theorem says is impossible.

  What I actually want to test is whether they can pinpoint the move he's making: he has swapped strategy-proofness for a weaker property I'll call favourite-proofness — no voter can raise the probability that her most-preferred alternative is selected — and then applied a theorem whose antecedent is the real thing. It isn't a counterexample, it's a silently weakened premise. And then I want them to show the weakening buys nothing: favourite-proofness leaves entirely unprotected exactly the voters who matter in real elections, the ones who've worked out their favourite has no chance and are choosing between their second and third choices.

  Things I want you to build in, and to check me on:

  - Make them verify that plurality really is favourite-proof, tie-breaking convention included, and that it really is onto and nondictatorial, so they see that no other hypothesis of the theorem fails. I don't want a question with the cheap way out where the rule's range only has two alternatives in it.
  - A middle part where they have to exhibit an actual explicit profile — every voter's ranking written out — at which plurality is manipulated: the truthful outcome, the outcome after one voter lies, and the preferences that make the lie pay. I had to go to four voters to make my own example work and I'm honestly not sure three is enough; if a three-voter profile works (I have a vague feeling something with a three-way tie and the tie-break might do it) use that instead, but check it properly, I don't want a broken profile going out to forty people.
  - I want them to see it isn't a quirk of plurality. So a last part on the mirror rule: each voter names her least favourite, and the alternative with the fewest votes against it wins, same fixed tie-breaking order. My guess is that this one protects your bottom rather than your top — you cant lower the chance your worst alternative wins — and that it therefore is not favourite-proof, so the mirror image doesn't come out symmetric the way this student would probably expect. Check me on that, and if I've got it backwards, say so and write the part the other way round.
  - A final line asking them to say in a sentence or two why strategy-proofness is the right notion here and favourite-proofness isn't. I want them to get at the point that the theorem quantifies over every voter and every improvement, not only over victories for your favourite.

  Constraints: 90-minute in-class exam, three questions, so this one gets about 30 minutes. It should be answerable by someone who has followed the proof (pivotal voter, the fact that the whole ordering does work) and not by someone who memorised the statement. Don't let it lean on anything we havent covered — no randomized rules, no domain restrictions, no Gibbard's later stuff about schemes with chance, none of that.

  Give me:

  1. The question — about 350 words. The exact text students will see, with every definition stated in it, including favourite-proofness and both rules, split clearly into parts, with the marks for each part shown.
  2. Model answer — about 700 words. What a top answer says, with the worked profiles written out in full.
  3. Marking scheme — about 400 words. Five must-hit points, marks for each out of 20, plus one line per point on how students usually get it wrong.
  4. Notes for me — about 200 words. What I should double-check before printing: whether my voter counts are minimal, whether the tie-breaking convention is doing work it shouldn't, where a strong student might run past what I expected, and how many minutes I should actually budget for this.
