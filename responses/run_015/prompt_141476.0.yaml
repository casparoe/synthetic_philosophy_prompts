answer: |-
  **1. The Question**

  **Question 3 (20 Marks)**
  Consider a social choice function with $n \ge 3$ voters and alternatives $A = \{a, b, c\}$. Preferences are strict. A fixed tie-breaking order $a \succ b \succ c$ applies whenever vote counts are equal.

  **Plurality Rule:** Each voter names one alternative. The alternative with the most votes wins.
  **Favourite-Proofness:** A rule is favourite-proof if no voter can submit a ballot different from their true top choice such that their top choice wins, when it would not have won had they voted truthfully.
  **Mirror Rule:** Each voter names their *least* favourite alternative. The alternative with the fewest votes against it wins.

  (a) [4 marks] Verify that Plurality is onto, nondictatorial, and favourite-proof. Briefly justify each property.
  (b) [6 marks] Despite (a), Plurality is manipulable. Provide an explicit profile (3 voters) showing a voter prefers the outcome of lying to truth-telling, even though their top choice does not win in either case. List preferences, ballots, and outcomes clearly.
  (c) [6 marks] Determine whether the Mirror Rule is favourite-proof. Justify your answer with a specific profile or a general proof.
  (d) [4 marks] In one or two sentences, explain why the Gibbard–Satterthwaite theorem requires full strategy-proofness rather than favourite-proofness.

  ***

  **2. Model Answer**

  **(a) Plurality Properties**
  **Onto:** For any alternative $x \in A$, if every voter casts a ballot for $x$, $x$ receives $n$ votes while others receive 0. Thus $x$ wins. The range is all of $A$.
  **Nondictatorial:** Assume $n \ge 2$. If Voter 1 votes $a$ and all others vote $b$, $b$ receives $n-1$ votes and $a$ receives 1. Since $n \ge 2$, $b$ wins. Voter 1 did not dictate the outcome.
  **Favourite-Proof:** Suppose a voter's top choice is $x$. Truthfully voting gives $x$ one vote. Lying (voting $y \neq x$) gives $x$ zero votes. Since vote counts are non-negative, $x$'s score cannot increase by lying. If $x$ cannot win with 1 vote (given others' ballots), it cannot win with 0. Thus, lying cannot make the favourite win.

  **(b) Plurality Manipulation**
  Tie-break: $a \succ b \succ c$.
  **Profile:**
  Voter 1: $a \succ b \succ c$ (Ballot: $a$)
  Voter 2: $b \succ c \succ a$ (Ballot: $b$)
  Voter 3: $c \succ b \succ a$ (Ballot: $c$)
  **Truthful Outcome:** Scores are $a=1, b=1, c=1$. Tie-break selects **$a$**.
  **Manipulation:** Voter 3 prefers $b$ to $a$. Voter 3 lies and votes $b$.
  **Lie Outcome:** Scores are $a=1, b=2, c=0$. Winner is **$b$**.
  **Conclusion:** Voter 3 obtains a preferred outcome ($b$) by lying. Note that Voter 3's top choice ($c$) does not win in either scenario, satisfying the condition that this violates strategy-proofness but not favourite-proofness.

  **(c) Mirror Rule Analysis**
  The Mirror Rule is **not favourite-proof**.
  **Counter-Example:** Tie-break $a \succ b \succ c$.
  Voter 1: $a \succ b \succ c$ (Votes against $c$)
  Voter 2: $a \succ b \succ c$ (Votes against $c$)
  Voter 3: $b \succ c \succ a$ (Votes against $a$)
  **Truthful Outcome:** Votes against are $a=1, b=0, c=2$. Winner is **$b$** (0 votes). Voter 1's top ($a$) loses.
  **Manipulation:** Voter 1 lies and votes against $b$.
  **Lie Outcome:** Votes against are $a=1, b=1, c=1$. Tie-break selects **$a$**.
  **Conclusion:** Voter 1 made their top choice win by lying. Unlike Plurality, shifting a vote away from the worst candidate can alter tie-breaking dynamics among other candidates to benefit the top choice.

  **(d) Conceptual Explanation**
  Strategy-proofness quantifies over *all* preference improvements, protecting voters whose favourite is irrelevant from settling for their third choice over their second. Favourite-proofness only protects the top choice, leaving the vast majority of strategic incentives (among lower-ranked alternatives) unregulated, which renders the theorem's impossibility result inapplicable.

  ***

  **3. Marking Scheme**

  **Total: 20 Marks**

  1.  **Plurality Properties (4 marks):**
      *   1 mark for Onto (all $x$ can win).
      *   1 mark for Nondictatorial (others can override V1).
      *   2 marks for Favourite-Proof (voting away reduces top's score to 0).
      *   *Common Error:* Students claim Plurality is dictatorial because one vote matters, or argue favourite-proofness fails because lying changes the winner (missing the "top choice wins" condition).

  2.  **Manipulation Profile (6 marks):**
      *   2 marks for a valid 3-voter profile with strict preferences.
      *   1 mark for correct Truthful Outcome (incorporating tie-break).
      *   1 mark for correct Lie Outcome.
      *   2 marks for showing Voter prefers Lie Outcome to Truth Outcome.
      *   *Common Error:* Using a profile where the top choice wins in the lie scenario (violates the specific prompt constraint) or ignoring the tie-break rule leading to incorrect winners.

  3.  **Mirror Rule Analysis (4 marks):**
      *   2 marks for correct conclusion (Not Favourite-Proof).
      *   2 marks for a valid counter-example profile.
      *   *Common Error:* Assuming symmetry with Plurality implies Mirror is also favourite-proof. Students often fail to see that voting against the 2nd worst can help the top choice win via tie-breaks.

  4.  **Conceptual Explanation (4 marks):**
      *   2 marks for identifying protection of 2nd/3rd choices (non-top improvements).
      *   2 marks for linking to the theorem's antecedent (strategy-proofness quantifies over all improvements).
      *   *Common Error:* Vague appeals to "fairness" or "democracy" without referencing preference orderings or the specific definition of manipulation.

  5.  **Clarity and Logic (2 marks):**
      *   2 marks for clear notation, logical flow, and adhering to constraints (e.g., 3 voters).
      *   *Common Error:* Contradictory statements, unreadable profiles, or exceeding the scope (e.g., discussing randomized rules).

  ***

  **4. Notes for Me**

  **Voter Count:** Three voters is minimal for the Plurality example given the tie-break. With two voters, ties are more frequent and manipulation harder to construct without the top winning. The provided 3-voter profile is robust.
  **Tie-Breaking:** Ensure students use the fixed order $a \succ b \succ c$ consistently. If they assume random ties, the manipulation holds but probabilities complicate the "favourite-proof" definition. The question specifies deterministic tie-breaking to avoid this.
  **Strong Students:** May note that Mirror Rule is strategy-proof on restricted domains, but here we assume full domain. Ensure they don't wander into domain restrictions or Gibbard's later work on chance, as per exam constraints.
  **Timing:** 30 minutes is tight. Part (b) is the time sink. Advise students to draft the profile quickly. If they spend >10 mins on (b), they risk (c) and (d).
  **Printing:** Double-check the tie-breaking order is identical in Question and Model Answer to avoid confusion. The logic relies heavily on the tie-break favoring $a$ in the 3-way tie scenarios.
