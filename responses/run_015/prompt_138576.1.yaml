      *   If it's memory, the object of memory must exist.
      *   Standard prediction: "It might rain." (Probability).
      *   Louise's vision: "I remember Hannah laughing." (Fact).
      *   *Metaphysical Commitment:* This pushes hard toward Block Universe. An Open Future theorist (Branching Time, Growing Block) struggles here. How can you remember a branch that hasn't been taken?
      *   *Can Open Future absorb it?* Only by redefining memory as "access to a probable timeline" or "psychological projection." But the film presents it as *veridical*. She sees things she couldn't guess (e.g., the specific phone call details).
      *   *Emotional Payoff:* Does "embracing the joy despite the pain" require the pain to be *necessary*? If she could change it, her choice to not change it is heroic. If she *can't* change it, her choice is acceptance. The film blurs this. The line "Despite knowing the journey... I welcome it" suggests choice *within* necessity.

  5.  **Select Scenes:**
      *   Need scenes that show the *nature* of the knowledge, not just the plot.
      *   1. *The first vision/hallucination:* Early on. Shows the phenomenology (memory-like).
      *   2. *The phone call to General Shang:* The climax. She uses future knowledge to change the present. This is the tricky bit for Future Contingents. If she changes the present using the future, does that mean the future was fixed to allow her to change the present? (Predestination Paradox).
      *   3. *The conversation with Ian (Jeremy Renner) near the end:* Where she explains "I forgot how good it felt." This addresses the emotional payoff.

  6.  **Anticipate the Engineers (The "Derail" Points):**
