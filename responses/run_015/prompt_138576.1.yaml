      *   *Wait, does the film actually say she can't change it?* She *does* change the present (stops the war) using the future. But she *doesn't* change Hannah's death. Why? Because the war is a "contingent" she can influence, but Hannah's life is "fixed"? Or because Hannah's life is the personal cost she must accept?
      *   *Correction:* The film implies the *macro* timeline is fixed (she becomes the mother), but her actions *cause* that timeline. It's a causal loop.
      *   *Aristotle Connection:* Aristotle worries that if "Battle is True," then Battle is Necessary. Louise acts as if "Hannah's Death is True," therefore "Hannah's Death is Necessary." The film supports the Aristotelian fear: Truth implies Necessity.
