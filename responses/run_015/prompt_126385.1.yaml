answer: |-
  **Scenario**
  A social rodent species emits a specific alarm chirp ($S$) via a visual mechanism selected to detect hawk shadows ($H$). Two consumer subsystems use $S$: juveniles freeze (success requires dense grass, $G$) and adults mob (success requires firm ground, $P$). Historically, hawks only hunted in this habitat where $H$, $G$, and $P$ co-occurred reliably. In the token case, a hawk is present, grass is dense, and ground is firm. All mechanisms function normally; no misfirings or recent environmental shifts occur.

  **Check**
  **Producer-side:** Content is what the producing mechanism was selected to indicate. The visual mechanism tracks $H$. Content = *Hawk Above*.
  **Consumer-side:** Content is the condition required for consumers' responses to perform their proper functions. Freezing succeeds only if $G$; mobbing succeeds only if $P$. Both require $H$ to be a real threat. Applying the "joint condition" repair (content must satisfy all consumers), Content = *Hawk Above ∧ Dense Grass ∧ Firm Ground*.
  Both assign content; both are true in the token case. But *Hawk Above* $\neq$ *Hawk Above ∧ Dense Grass ∧ Firm Ground*.

  **Structural Feature**
  The signal mediates between a single historical cause ($H$) and multiple downstream action-contexts with distinct environmental prerequisites ($G, P$). The producer tracks the cause; the consumers track the affordances.

  **Removal**
  If both consumers required the same condition (e.g., both needed $G$), Consumer Content would be *Hawk ∧ Grass*, narrowing the gap. If the producer tracked $G$ and $P$ directly, Producer Content would expand. The divergence relies on the producer tracking the distal cause while consumers track proximal action-success conditions.

  **Strongest Reply**
  The consumer-side theorist argues $G$ and $P$ are merely background conditions, not content, because the consumers' proper functions are defined relative to the signal's normal cause ($H$). Thus, Consumer Content collapses to *Hawk Above*.

  **Verdict**
  This is an objection, not a friendly amendment. It reveals the consumer-side theory cannot distinguish content from background conditions without importing producer-side constraints (what the signal *indicates* vs. what makes the *response* work). The case survives as a demonstration that consumer-side teleosemantics is not autonomous; it requires producer-side input to fix content boundaries when downstream success conditions diverge.
