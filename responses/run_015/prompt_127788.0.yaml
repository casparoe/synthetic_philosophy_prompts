answer: |-
  Here is a decision-tree taxonomy designed for your study group. It avoids philosophical jargon at the decision points, focusing instead on how moral reasons behave in concrete thought experiments.

  ### The Moral Reasoning Decision Tree

  **Instructions:** Start at **Node 1**. Read the scenario and question aloud. Follow the arrow corresponding to your group's consensus (or note where you disagree). Continue until you reach a **Leaf**.

  ---

  #### **Node 1: The "Direction" Test (Metaphysics of Reasons)**
  **Scenario:** Imagine a specific feature of an action, such as *causing a small amount of physical pain* or *breaking a trivial promise*. In most cases, we agree these count **against** doing the action.

  **Question:** Is it possible, in *any* conceivable situation, for that same feature (e.g., causing pain) to stop counting against the action entirely, or even start counting **in favor** of it, without changing the definition of the feature itself?
  *(Note: This is not asking if the pain is outweighed by a greater good. It is asking if the pain itself could become a positive reason, or simply vanish as a reason.)*

  *   **NO (Invariant):** No. Causing pain always counts *against* an action, even if other reasons outweigh it. It never becomes a positive reason, nor does it disappear.
      *   $\rightarrow$ **Go to Node 2**
  *   **YES (Holistic):** Yes. In some strange contexts, causing pain might be neutral (no reason at all) or actually be a reason *for* the action (e.g., a necessary signal in a specific game, or a form of tough love that is good *because* it hurts).
      *   $\rightarrow$ **Go to Node 3**

  ---

  #### **Node 2: The "Perfect Rulebook" Test (Codifiability)**
  *(Reached if you answered NO at Node 1: You believe moral reasons have a fixed direction.)*

  **Question:** Imagine a being with infinite intelligence and full knowledge of all facts. Could this being write a finite set of rules (a "Perfect Rulebook") that correctly predicts the right action in every possible case?
  *(Note: This is not asking if humans can learn the rules. It is asking if the rules actually exist in the structure of reality.)*

  *   **YES:** Yes. Morality is ultimately systematic. If we knew enough, we could codify exactly how to weigh these fixed reasons.
      *   $\rightarrow$ **Leaf A: Strict Generalism**
  *   **NO:** No. Even though reasons always point the same way (pain is always bad), the way they combine is too complex or context-dependent to ever be fully captured in a set of rules. We must perceive the right answer directly.
      *   $\rightarrow$ **Leaf B: Epistemic Particularism (Hybrid)**

  ---

  #### **Node 3: The "Pattern of Change" Test (Second-Order Structure)**
  *(Reached if you answered YES at Node 1: You believe moral reasons can change direction/valence.)*

  **Question:** If a feature like *breaking a promise* can sometimes count against an action and sometimes count for it, is there a **higher-order rule** that explains *when* it switches?
  *(Example: Is there a rule like "Breaking a promise counts FOR an action whenever it prevents greater harm," or is the switching itself unpredictable?)*

  *   **YES:** Yes. The reasons shift, but they shift according to a stable, higher-level pattern or principle.
      *   $\rightarrow$ **Leaf C: Second-Order Generalism (Hybrid)**
  *   **NO:** No. The way reasons behave depends entirely on the specific context. There is no general rule that predicts when a reason will flip, vanish, or reverse.
      *   $\rightarrow$ **Leaf D: Strict Particularism**

  ---

  ### The Leaves (Definitions for Your Group)

  **Leaf A: Strict Generalism**
  *   **View:** Moral reasons are invariant (pain is always a con), and there are exceptionless principles that govern how these reasons combine to form a final judgment.
  *   **Classic Example:** Act Utilitarianism (pain always counts negatively toward utility) or strict Kantianism.
  *   **Moral Expertise:** Knowing and applying the correct rules.

  **Leaf B: Epistemic Particularism (Hybrid)**
  *   **View:** Moral reasons are invariant (pain is always a con), *but* there are no codifiable principles for how to weigh them. The "math" of morality cannot be written down.
  *   **Why Hybrid?** It accepts the Generalist metaphysics (reasons are stable) but the Particularist epistemology (we can't use rules to find the answer).
  *   **Moral Expertise:** A refined perception or intuition that grasps the balance of fixed reasons without a formula.

  **Leaf C: Second-Order Generalism (Hybrid)**
  *   **View:** Moral reasons are holistic (pain can sometimes be a pro), *but* there are higher-order principles that govern *how* they change.
  *   **Why Hybrid?** It accepts the Particularist metaphysics (reasons shift) but the Generalist hope for systemization (the shifting is patterned).
  *   **Moral Expertise:** Knowing the meta-rules that dictate how context changes the value of first-order reasons.

  **Leaf D: Strict Particularism**
  *   **View:** Moral reasons are holistic (they shift), and there are no principles (first-order or second-order) that govern these shifts. Morality is uncodifiable in principle.
  *   **Classic Example:** Jonathan Dancy's view.
  *   **Moral Expertise:** Direct perceptual attunement to the salience of features in a specific situation, with no appeal to rules.

  ---

  ### Troubleshooting & Limitations Notes

  **1. The "Moderate Generalist" Problem**
  You may find group members who answer **NO** at Node 1 (reasons are invariant) but hesitate at Node 2. They might say, *"Rules exist, but they can conflict."* (This is W.D. Ross's view of *prima facie* duties).
  *   **Where they land:** They usually end up at **Leaf B**.
  *   **Why the tree struggles:** The tree treats "uncodifiable" as a binary. Rossians believe rules exist but admit they can't tell you what to do when rules clash. This is a subtle middle ground between Leaf A and Leaf B. If your group lands here, note that you are in the "Prima Facie" zone, which is a form of Moderate Generalism often grouped with Leaf B for the sake of this taxonomy.

  **2. The "Skeptical" Branch**
  A respondent might answer **NO** at Node 3 (no pattern to how reasons shift) but then say, *"But we still can't perceive the right answer directly; morality is just too messy."*
  *   **Where they land:** This combination (Holism + No Perception + No Rules) leads to **Moral Skepticism**, which is not one of the Leaves.
  *   **Note:** Strict Particularists (Leaf D) must believe we *can* know the right answer via perception, even without rules. If your group denies both rules and perception, you have fallen off the map into skepticism.

  **3. The "Pragmatic" Hybrid**
  Some students might say: *"Principles aren't true descriptions of reality, but they are useful tools for teaching."*
  *   **Where they land:** This view doesn't fit neatly into Leaf A or Leaf C. It treats principles as heuristic (practical tools) rather than metaphysical truths.
  *   **Note:** This is a **Pragmatic Generalism**. It acknowledges the descriptive failure of rules (like Particularism) but retains their normative utility (like Generalism). Mark this as an "Uncategorized Hybrid" in your notes.

  **4. Distinguishing Leaf B and Leaf D**
  The hardest distinction in this tree is between **Leaf B (Epistemic Particularism)** and **Leaf D (Strict Particularism)**.
  *   **The Diagnostic:** Ask: *"Is the reason we can't write rules because the reasons themselves are chaotic (Leaf D), or because the reasons are stable but the math is too hard for a rulebook (Leaf B)?"*
  *   **Limitation:** In practice, these two views often recommend the same behavior (trust your perception, don't rely on rigid rules). The difference is purely theoretical (about the nature of reality vs. the nature of knowledge).

  ### How to Use This in Study Group
  1.  **Read the Nodes Aloud:** Do not let anyone skip ahead. The definition of "reason" changes depending on the path.
  2.  **Record Dissent:** If half the group goes Left and half goes Right at Node 1, stop. That disagreement *is* the Particularism vs. Generalism debate. Spend your time there.
  3.  **Check the Hybrids:** If you land on Leaf B or C, congratulate yourselves. You have identified a nuanced position that many introductory textbooks ignore. These hybrids often represent the most stable positions for working ethicists.
