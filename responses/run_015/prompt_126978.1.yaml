prompt: |-
  I recently found myself in a prolonged disagreement with a close friend about whether a technically crude but emotionally direct community mural could be considered greater art than a meticulously executed gallery installation that left us both feeling nothing — a dispute that replayed, in modern terms, Tolstoy’s well-known distinction between genuine art and counterfeit art, though with complications his framework seems ill-equipped to handle. Before I commit to any particular view, I want the full specification. Write the desiderata that an adequate normative theory of artistic value must meet if it is to take seriously Tolstoy’s central claim that art is essentially a means of transmitting feeling in service of human fraternity, while also accommodating what I will call moral resonance asymmetry: the phenomenon whereby an artwork intended to foster brotherly love in one interpretive community produces alienation or moral revulsion in another without being technically defective or emotionally inauthentic.

  For each desideratum, provide the motivating case or conceptual consideration — which artistic phenomena it must account for (such as the dismissal of technically masterful but emotionally hollow productions that Tolstoy classifies as counterfeit), which distinctions it must preserve (for instance, between emotional authenticity and emotional efficacy, or between universal accessibility and culturally situated reception), and which findings from moral psychology or aesthetics it must not contradict. Clearly flag which requirements you take to be non-negotiable and which are preferences of particular camps, and identify any subset of desiderata that appear jointly unsatisfiable — I am especially interested in whether a theory can simultaneously require universal emotional transmission and full sensitivity to moral resonance asymmetry without internal contradiction. Keep the weight on the criteria and their tensions rather than on a comprehensive scorecard, though I would like a brief indication of how Tolstoy’s own moralist theory, a formalist position that denies moral content any artistic relevance, and a pluralist account that treats emotional transmission as one artistic value among many fare against your list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Core Task:** Write the *desiderata* (criteria/requirements) for an adequate normative theory of artistic value.
      *   **Specific Constraints:**
          *   Must take seriously Tolstoy's central claim (Art = transmission of feeling for human fraternity).
          *   Must accommodate "Moral Resonance Asymmetry" (MRA): Art intended for brotherly love in Community A causes alienation/revulsion in Community B, without being technically defective or inauthentic.
          *   For each desideratum: Provide motivating cases, distinctions to preserve, and consistency with moral psychology/aesthetics.
          *   Flag non-negotiable vs. preference.
          *   Identify jointly unsatisfiable subsets (tensions/contradictions).
          *   Focus on criteria and tensions, not a comprehensive scorecard.
          *   Briefly evaluate Tolstoyan Moralism, Formalism, and Pluralism against the list.
      *   **Tone:** Philosophical, rigorous, analytical, nuanced.
      *   **Context:** A disagreement about a crude community mural vs. a meticulous but hollow gallery installation.

  2.  **Deconstruct the Core Tension:**
      *   *Tolstoy's Thesis:* Art is good if it transmits feeling that unites people (fraternity). Bad art fails to transmit or transmits bad feelings (division).
      *   *The Complication (MRA):* What unites Group X might divide Group Y. Tolstoy assumes a universal human brotherhood capable of receiving the same religious/conscious feelings. Modern pluralism suggests moral frameworks are situated.
      *   *The Goal:* A theory that honors the *intent* and *mechanism* of Tolstoy (transmission of feeling) but fixes the *universality* problem exposed by MRA.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Transmission Mechanism.* Tolstoy insists art isn't just expression; it's *infection*. The theory must explain how feeling moves from artist to audience.
          *   *Motivation:* The hollow gallery installation. Technically perfect, no feeling moved.
          *   *Distinction:* Expression vs. Transmission.
          *   *Status:* Non-negotiable (core to the prompt's Tolstoyan constraint).

      *   *Desideratum 2: The Fraternity Condition (Normative Valence).* Tolstoy says art *should* promote unity. The theory needs a normative standard for *which* feelings count as valuable.
          *   *Motivation:* Propaganda vs. Genuine Art. Hate speech can transmit feeling strongly.
          *   *Distinction:* Intensity of feeling vs. Moral quality of feeling.
          *   *Status:* Non-negotiable (core to Tolstoy's "service of human fraternity").

      *   *Desideratum 3: Contextual Sensitivity (Addressing MRA).* This is the tricky one. The theory must acknowledge that reception varies based on cultural/moral situatedness without collapsing into relativism where "anything goes."
          *   *Motivation:* The Mural. Crude but direct. Might offend some, unite others.
          *   *Distinction:* Universal accessibility vs. Culturally situated reception.
          *   *Status:* Non-negotiable (required by the prompt's MRA constraint).

      *   *Desideratum 4: Technical Competence vs. Emotional Authenticity.* The prompt mentions the "technically crude" vs. "meticulously executed." The theory can't just be technical skill, nor can it ignore craft entirely if craft aids transmission.
          *   *Motivation:* The Mural vs. Gallery Installation.
          *   *Distinction:* Craft as end vs. Craft as vehicle.
          *   *Status:* Preference (Formalists want this higher, Tolstoyans lower), but needs balancing. Let's make it a constraint on *adequacy of vehicle*.

      *   *Desideratum 5: Agent-Relative vs. Agent-Neutral Value.* Does the art's value depend on who is looking? Tolstoy wants Agent-Neutral (Universal). MRA implies Agent-Relative.
          *   *Motivation:* MRA phenomenon.
          *   *Status:* This is where the contradiction lies.

  4.  **Identifying Tensions/Contradictions:**
      *   *The Big One:* Universal Fraternity vs. Moral Resonance Asymmetry. If art must unite *all* humanity (Tolstoy), but specific moral feelings divide communities (MRA), then either (a) no art succeeds, or (b) we must abandon universality.
      *   *The Second One:* Authenticity vs. Efficacy. You can authentically feel something that repulses others. Is it "good art" if it's authentic but divisive? Tolstoy says no (must be fraternity). MRA says it's inevitable.

  5.  **Refining the Desiderata List:**
      *   1. **The Infectivity Constraint:** (Mechanism of transmission).
      *   2. **The Normative Orientation Constraint:** (Fraternity/Unity goal).
      *   3. **The Reception Sensitivity Constraint:** (Handling MRA/Context).
      *   4. **The Authenticity-Craft Interface:** (Handling the Mural/Installation dichotomy).

  6.  **Developing the Evaluation of Existing Theories:**
      *   *Tolstoyan Moralism:* Fails Reception Sensitivity (too universalist).
      *   *Formalism:* Fails Infectivity and Normative Orientation (ignores content/feeling).
      *   *Pluralism:* Might pass, but risks diluting the "Fraternity" requirement too much.

  7.  **Drafting the Content (incorporating specific instructions):**
      *   *Flagging:* Use bolding or explicit labels for Non-Negotiable vs. Preference.
      *   *Psychology/Aesthetics:* Mention empathy, mirror neurons (cautiously), in-group/out-group bias.
      *   *Unsatisfiable Subset:* Explicitly highlight the Universalism vs. Asymmetry clash.

  8.  **Review against Constraints:**
      *   Did I address the Mural vs. Installation? Yes.
      *   Did I address Tolstoy's specific claim? Yes.
      *   Did I address MRA? Yes.
      *   Did I flag non-negotiables? Yes.
      *   Did I identify contradictions? Yes.
      *   Did I evaluate the three theories? Yes.

  9.  **Final Polish:** Ensure the tone is appropriate for a philosophical inquiry (precise, careful distinctions). *Self-Correction during drafting:* Make sure I don't solve the problem. The prompt asks for the *desiderata* and the *tensions*, not a solution. The tension must remain palpable.

      *(Self-Correction on "Non-Negotiable"):* The prompt asks me to write desiderata for a theory that *takes seriously* Tolstoy AND accommodates MRA. Therefore, constraints derived from both are non-negotiable *for this specific exercise*, even if they contradict. I need to make that contradiction clear.

      *(Refining MRA definition):* Ensure MRA isn't just "people disagree." It's "intended fraternity causes actual alienation without technical/authentic failure."

      *(Refining Tolstoy's view):* Tolstoy believed religious consciousness of his time was the universal standard. A modern theory can't use that. It needs a different grounding for "fraternity."

  10. **Final Structure:**
      *   Introduction: Setting the stage (Tolstoy + MRA).
      *   Desiderata 1-4 (with Motivation, Distinctions, Psychology, Status).
      *   The Impossible Triangle (Tensions/Contradictions).
      *   Brief Evaluation of Theories.
      *   Conclusion.

  (Proceed to generate output based on this thought process.)
answer: |-
  Below is a specification of desiderata for a normative theory of artistic value. This framework is constructed to honor the Tolstoyan insistence on art as a vehicle for moral-emotional union while rigorously integrating the complication of Moral Resonance Asymmetry (MRA).

  ### Desiderata for a Normative Theory of Artistic Value

  #### 1. The Infectivity Constraint (Mechanism of Transmission)
  *   **Specification:** The theory must define artistic value partly as a function of the successful transmission of a specific qualitative state (feeling, mood, or attitude) from the creator to the recipient.
  *   **Motivating Case:** The meticulously executed gallery installation that leaves viewers cold. Under this constraint, technical mastery without successful "infection" (Tolstoy's term) is insufficient for high artistic value.
  *   **Distinctions to Preserve:** It must distinguish between *expression* (the artist venting emotion) and *transmission* (the audience grasping that emotion). It must also distinguish between *cognitive understanding* of the artist's intent and *affective resonance* with it.
  *   **Psychological/Aesthetic Consistency:** Must align with findings on emotional contagion and mirror neuron systems, acknowledging that affective transfer is often pre-cognitive. It must not contradict the fact that some audiences are "affectively blind" to certain modes of expression due to trauma or conditioning.
  *   **Status:** **Non-Negotiable.** (This is the core mechanism of the Tolstoyan framework you wish to retain.)

  #### 2. The Fraternity Condition (Normative Orientation)
  *   **Specification:** The theory must posit that the *content* of the transmitted feeling matters. Artistic value is heightened when the transmitted feeling promotes social cohesion, empathy, or a sense of shared humanity, and diminished when it promotes alienation, hatred, or exclusivity.
  *   **Motivating Case:** Propaganda or hate speech can be highly "infectious" (meeting Desideratum 1) but destructive to human fraternity. A theory satisfying Tolstoy's claim must classify these as artistically deficient or "counterfeit" despite their efficacy.
  *   **Distinctions to Preserve:** It must distinguish between the *intensity* of the feeling and the *moral valence* of the feeling. It must avoid conflating "shocking" with "unifying."
  *   **Psychological/Aesthetic Consistency:** Must not contradict moral psychology regarding in-group/out-group dynamics. It must acknowledge that "fraternity" is often experienced as "solidarity with my group" rather than "universal brotherhood."
  *   **Status:** **Non-Negotiable.** (This is the core normative claim of Tolstoy you wish to retain.)

  #### 3. The Contextual Sensitivity Constraint (Accommodating MRA)
  *   **Specification:** The theory must account for the situatedness of reception. It cannot judge the "Fraternity Condition" (Desideratum 2) solely from the perspective of a universal observer or the artist's intent. It must acknowledge that the moral valence of a feeling is dependent on the interpretive community's historical and cultural position.
  *   **Motivating Case:** The community mural. To the local residents, it transmits solidarity and dignity (Fraternity). To an outside observer with different historical sensitivities, the same symbols may signal exclusion or aggression (Alienation), despite the artist's authentic intent and the work's technical adequacy for its primary audience.
  *   **Distinctions to Preserve:** It must distinguish between *Universal Accessibility* (Tolstoy's ideal) and *Culturally Situated Reception* (The MRA reality). It must distinguish between *failure of transmission* (the signal didn't get through) and *divergent decoding* (the signal got through but meant something else).
  *   **Psychological/Aesthetic Consistency:** Must align with sociological findings on symbolic interactionism and the hermeneutics of reception. It cannot contradict the reality of moral pluralism.
  *   **Status:** **Non-Negotiable.** (This is the specific complication regarding MRA you required the theory to accommodate.)

  #### 4. The Authenticity-Craft Interface
  *   **Specification:** The theory must provide a metric for weighing emotional authenticity against technical craft. It must explain when technical crudeness enhances transmission (by signaling raw urgency) and when it impedes it (by creating noise), and vice versa for technical polish.
  *   **Motivating Case:** The disagreement between the crude mural and the polished installation. The theory must allow for the possibility that the mural is "greater" art because its crudeness serves the authenticity of the feeling, while the installation's polish serves only aesthetic detachment.
  *   **Distinctions to Preserve:** It must distinguish between *craft as an end* (Formalism) and *craft as a vehicle* (Tolstoyanism). It must not equate "difficulty of production" with "artistic value."
  *   **Psychological/Aesthetic Consistency:** Must not contradict the "fluency theory" of aesthetic pleasure (which suggests easy processing is often preferred) while allowing for the value of "disfluency" when it signals authenticity.
  *   **Status:** **Preference.** (Tolstoyans prioritize authenticity; Formalists prioritize craft. An adequate theory needs a rule for balancing them, but the weighting is debatable.)

  ---

  ### The Impossible Triangle: Tensions and Joint Unsatisfiability

  You asked specifically to identify subsets of desiderata that appear jointly unsatisfiable. There is a profound tension, bordering on contradiction, between **Desideratum 2 (The Fraternity Condition)** and **Desideratum 3 (The Contextual Sensitivity Constraint)**, mediated by **Desideratum 1 (The Infectivity Constraint)**.

  **The Contradiction:**
  1.  **Tolstoy's Universalism (from Des. 2):** For art to be "good" in the Tolstoyan sense, it must foster *human* fraternity. This implies a universal standard of moral feeling. If a work divides humanity, it is, by definition, less valuable as art.
  2.  **MRA Reality (from Des. 3):** Moral feelings are not universal. A feeling that constitutes "fraternity" for Community A (e.g., pride in a specific historical struggle) constitutively requires the exclusion or condemnation of Community B (e.g., the historical oppressors).
  3.  **The Conflict:** If a work successfully transmits (Des. 1) a feeling of fraternity to Community A, but that feeling inherently produces alienation in Community B (Des. 3), the work simultaneously satisfies and violates the Fraternity Condition (Des. 2).

  **Can a theory require Universal Emotional Transmission and Full Sensitivity to MRA without contradiction?**
  **No.** Not without modifying the definition of "Fraternity."
  *   If you maintain **Universal Fraternity**, you must judge the mural as deficient because it alienates the outsider, effectively siding with Tolstoy's dismissal of particularist art.
  *   If you maintain **Full Sensitivity to MRA**, you must admit that "Fraternity" is local, not universal. This breaks Tolstoy's core claim that art unites *humanity* in a single religious/moral consciousness.

  **Resolution Strategy (for the theory, not the prompt):**
  To avoid logical collapse, the theory must adopt a **Tiered Valuation System**.
  *   *Local Artistic Value:* Based on successful transmission and fraternity within the situated community.
  *   *Universal Artistic Value:* Based on the capacity of the work to translate that local fraternity into a form intelligible to outsiders.
  *   *Tension:* This concedes that most "great" art (including the mural) is only locally great, undermining Tolstoy's hope for art as the primary engine of global human unity.

  ---

  ### Brief Evaluation of Existing Frameworks

  Here is how the three theoretical camps fare against these desiderata:

  **1. Tolstoyan Moralism**
  *   **Performance:** Fails Desideratum 3 (Contextual Sensitivity).
  *   **Analysis:** Tolstoy's theory is robust on Infectivity and Fraternity. However, it assumes a unified "religious consciousness of the time" that renders MRA invisible. Tolstoy would likely argue that if the mural alienates a reasonable outsider, it is *not* truly transmitting Christian/universal love, but rather tribal pride. He would dismiss the MRA phenomenon as a failure of the art, not a feature of the moral landscape.
  *   **Verdict:** Internally consistent but empirically brittle in a pluralistic world.

  **2. Formalism (e.g., Bell, Fry)**
  *   **Performance:** Fails Desideratum 1 (Infectivity) and Desideratum 2 (Fraternity).
  *   **Analysis:** Formalism denies that the transmission of specific feelings or moral content is relevant to artistic value. It would judge the gallery installation solely on its significant form. It sidesteps the MRA problem entirely by declaring moral resonance irrelevant. It cannot account for why the "hollow" installation feels deficient to you and your friend.
  *   **Verdict:** Logically safe from MRA contradictions, but ignores the phenomenological reality of your dispute.

  **3. Ethical Pluralism (e.g., Gaut, Nussbaum)**
  *   **Performance:** Best fit, but struggles with Desideratum 2 (Fraternity as *Essential*).
  *   **Analysis:** Pluralism treats emotional transmission and moral impact as *some* values among many (beauty, complexity, innovation). It can accommodate MRA by saying the mural is morally valuable *for Community A* but lacks universal moral value. However, by making fraternity optional rather than essential, it dilutes Tolstoy's central claim. It saves the theory from contradiction by lowering the stakes of the Fraternity Condition.
  *   **Verdict:** The most viable framework for the modern condition, but requires abandoning Tolstoy's insistence that fraternity is the *definition* of art, reducing it to merely one criterion of merit.

  ### Summary Recommendation
  To commit to a view, you must decide whether **Tolstoy's Universality** or **MRA's Particularity** is the non-negotiable truth.
  *   If you choose **Universality**, you must accept that the mural is artistically flawed if it cannot bridge the gap to the alienated outsider.
  *   If you choose **Particularity**, you must accept that "Human Fraternity" is an asymptotic ideal, not a measurable standard for individual works, and that art often serves *local* fraternity at the expense of *global* fraternity.

  A theory that claims to do both without qualification will collapse under the weight of the Moral Resonance Asymmetry.
