answer: |-
  ### Boundary Mapping: Neighboring Concepts

  Before proposing a label, we must rigorously delineate the conceptual territory surrounding this argument. Your intuition is correct: standard terms in museum ethics and political philosophy fail to capture the specific moral geometry of the position you describe. Here is how the phenomenon borders on, but ultimately diverges from, three established concepts:

  **1. Universal Museum / Encyclopedic Museum**
  *   **The Claim:** Objects belong to "humanity" and are best displayed in major cosmopolitan centers where they can be seen in comparative context.
  *   **The Divergence:** Universalism is generally *positive* or *neutral* regarding the object's status. It frames the object as a testament to human creativity or scientific progress. It tends to downplay or obscure the violence of acquisition to maintain the narrative of "shared heritage." The argument you describe does the opposite: it *centers* the violence. It does not claim the object belongs to everyone; it claims the object belongs specifically to the *perpetrator's conscience*.

  **2. Difficult Heritage / Negative Heritage**
  *   **The Claim:** Certain sites or objects represent traumatic histories (e.g., concentration camps, slave forts) and should be preserved to educate future generations about atrocity.
  *   **The Divergence:** This concept usually applies to *sites* of violence or objects created *to commemorate* suffering. It rarely justifies the retention of *looted* cultural property. In "Difficult Heritage," the focus is on the memory of the victims. In the argument you describe, the focus shifts to the moral education of the *perpetrator society*. The Benin Bronze is not being kept to honor the Edo people's loss (which would suggest return); it is being kept to shame the British public's ancestors.

  **3. Counter-Monumentality (Gegen-Denkmal)**
  *   **The Claim:** Memorials should not be triumphant statues but should implicate the viewer, often by disappearing, decaying, or demanding active engagement (James Young's concept).
  *   **The Divergence:** Counter-monuments are *intentional designs* created to challenge memory. The argument you describe is an *ex post facto justification* for existing holdings. Furthermore, counter-monuments often seek to dissolve authority. This argument reinforces the museum's authority to hold the object, framing that authority as a moral burden rather than a privilege.

  ### Conceptual Diagnosis

  There is **no single, canonical term** in the analytic literature of museum ethics or political philosophy that isolates this specific rhetorical configuration.

  In debates surrounding the Humboldt Forum or the British Museum, this move is often conflated with "Universalism" (as your friend did) or dismissed as "bad faith." However, treating it merely as Universalism is analytically imprecise. Universalism argues for retention based on *access* and *context*. The argument you describe argues for retention based on *guilt* and *evidence*.

  Because this specific logic creates a distinct ethical category—one where possession is reframed as a duty of self-accusation—it requires a new designation to be debated effectively.

  ### Proposed Term: Inculpatory Custodianship

  I propose the term **Inculpatory Custodianship** to name this phenomenon.

  **Definition:**
  *Inculpatory Custodianship* is the ethical claim that a museum or state is morally obligated to retain wrongfully acquired objects specifically because their presence in the metropolitan center serves as permanent material evidence of historical culpability. Under this framework, restitution is rejected not because the object belongs to the holder, but because returning it would destroy the "crime scene" necessary for the perpetrator society's moral self-examination.

  ### Conceptual Carving: Necessary Conditions

  For an argument to qualify as *Inculpatory Custodianship*, it must meet three specific boundary conditions. If any are missing, it falls back into Universalism or simple obstructionism.

  **1. The Admission of Illegitimacy**
  Unlike traditional stewardship, which often defends the legality or morality of the original acquisition, Inculpatory Custodianship *requires* an explicit acknowledgment that the acquisition was violent, coercive, or unjust. Without this admission, the argument is merely colonial denialism.
  *   *Boundary:* If the institution claims "it was a legal purchase at the time," it is **Traditional Stewardship**, not Inculpatory Custodianship.

  **2. The Primacy of Perpetrator Memory**
  The pedagogical value of the object is directed primarily at the citizens of the former imperial power, not the source community or "humanity" at large. The object is treated as a mirror for the metropole.
  *   *Boundary:* If the argument is "people from Nigeria can see it better in London," it is **Universalism**. If the argument is "British citizens need to see this to understand British history," it is **Inculpatory Custodianship**.

  **3. Retention as Moral Duty (The "Evidence" Clause)**
  The object is re-categorized from "cultural property" to "exhibit A." Its value lies in its status as proof of the crime. Therefore, returning it is framed not as justice, but as the destruction of evidence or an act of forgetting.
  *   *Boundary:* If the argument is "we care for it better," it is **Paternalism**. If the argument is "returning it erases the history of how we got it," it is **Inculpatory Custodianship**.

  ### Why This Distinction Matters

  Naming this phenomenon is not merely semantic; it shifts the ground of the debate in three critical ways:

  **1. It Exposes the Instrumentalization of Victimhood**
  By labeling this *Inculpatory Custodianship*, we reveal that the source community's loss is being instrumentalized for the moral benefit of the perpetrator society. The argument prioritizes the *metropole's need to remember its sin* over the *source community's right to sovereignty*. It asks the victim to sacrifice their heritage so the perpetrator can maintain their conscience.

  **2. It Clarifies the Disagreement on "Memory"**
  Your debate with your friend is likely not about whether colonial violence should be remembered (both sides probably agree it should), but *where* and *how* that memory should be housed.
  *   **Restitutionist view:** Memory is best served by restoring justice; the absence of the object in the metropole is itself a powerful memorial to the loss.
  *   **Inculpatory Custodian view:** Memory requires the physical presence of the loot.
  Naming the concept forces the debate to confront this specific divergence: Is the object a *subject of rights* (to be returned) or a *tool for education* (to be kept)?

  **3. It Distinguishes Guilt from Repair**
  Inculpatory Custodianship allows an institution to perform guilt without enacting repair. It creates a state of permanent confession that substitutes for restitution. By identifying this, we can ask: Does holding the object as a "self-accusation" actually lead to structural change, or does it function as a moral alibi that permits the status quo to continue under the guise of humility?

  ### Summary for Your Debate

  You can tell your friend:
  *"This isn't Universalism. Universalism says the object belongs to everyone because it is beautiful or scientific. This argument says the object belongs to the colonizer because it is evidence of their crime. It is a specific claim I call **Inculpatory Custodianship**: the idea that we must keep the loot to remind ourselves we are thieves. The question isn't about 'shared heritage'; it's about whether the perpetrator's moral education is more important than the victim's restitution."*

  This conceptual carving isolates the move from general stewardship debates and allows you to critique the specific ethical trade-off being proposed: the prioritization of the perpetrator's memory over the victim's property.
