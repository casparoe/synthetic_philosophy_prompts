answer: |-
  This is a coherent "Orthodox Everettian" package with one significant fracture and one metaphysical friction point. You have successfully avoided the most common contradictions (e.g., holding Everettian ontology while demanding single-outcome probabilities), but the justification for your normative claims is currently dangling.

  Here is the audit of internal tensions, ranked by severity.

  ### 1. The Justification Gap (Point 4 vs. Point 5)
  **Severity: Critical**

  This is the only genuine contradiction in the package.
  *   **Point 4** asserts that the Decision-Theoretic (DT) derivations of the Born Rule are circular: they assume the conclusion (indifference to branching structure) to prove the conclusion (caring by amplitude).
  *   **Point 5** asserts a normative claim: agents *should* care by amplitude.

  **The Tension:** If the derivations are bogus (Point 4), on what grounds do you make the normative claim (Point 5)?
  If DT fails, you are left with two options:
  1.  **The Born Rule is a brute postulate.** But this violates the spirit of Point 1 ("quantum state is the *whole* physical ontology"). Adding a brute normative rule about "caring" looks suspiciously like the "invisible extra furniture" you criticize in Bohmian mechanics (Point 2).
  2.  **The Born Rule is optional.** If rationality doesn't demand it (per Point 4), an agent could rationally care by *branch count*. But Point 5 says they *shouldn't*.

  **What has to give:** You cannot maintain strong skepticism of *all* derivations (Point 4) while maintaining the normativity of the Born Rule (Point 5) without introducing a new, unstated axiom.
  **Cost:** You must concede that *some* principle of indifference or symmetry is not "begging the question" but rather a constitutive requirement of what it means to be a rational agent in a branching structure.

  ### 2. The Meaning of Chance (Point 1 vs. Point 3)
  **Severity: High**

  This is a metaphysical friction rather than a logical contradiction, but it threatens to make your operationalism hollow.
  *   **Point 1** posits a deterministic ontology (unitary evolution). Everything that can happen, does.
  *   **Point 3** defines probability operationally: as credences guiding bets.

  **The Tension:** In a deterministic multiverse, there is no objective uncertainty about *what* happens (everything happens). The only uncertainty is *self-locating* (which branch am I on?).
  If probability is just "what you bet on" (Point 3), and rationality does not force the Born Rule (Point 4), then an agent could bet according to branch *counting*. If they do, is their probability assignment "empty" (per Point 3)?
  If you say "No, they are irrational for counting branches," you are back to the Justification Gap (1 vs 4).
  If you say "Yes, it's valid but I prefer Born," then Point 5 loses its force.

  **What has to give:** You need to clarify what the credences are *about*. They cannot be about outcomes (all occur). They must be about *measure of existence* or *self-location*.
  **Cost:** You risk drifting away from pure operationalism (Point 3) toward a functionalist view of probability (probability is whatever plays the probability role in the theory), which may feel like it grants more reality to the "weights" than you intended.

  ### 3. The Quantum Suicide Dependency (Point 1, 5, & 6)
  **Severity: Low (Stable, but relies on hidden premises)**

  This triad is internally consistent, provided you hold a specific view of personal identity (likely Parfitian reductionism).
  *   **Point 1** ensures the "dead" branch exists.
  *   **Point 5** ensures you care about the "dead" branch (by amplitude).
  *   **Point 6** follows: Since you care about the dead branch, the argument that "you won't experience death" is irrelevant to your decision theory.

  **The Tension:** None, strictly speaking. However, Point 6 relies on the intuition that "I" do not follow a single surviving thread. If your reading group members hold a "continuity of consciousness" view, Point 1 + Point 6 will look contradictory to *them*, even if it is consistent within your system.
  **What has to give:** Nothing, but be prepared to defend your theory of personal identity if attacked on Point 6.

  ### Stable Pairs
  *   **Point 1 & Point 2:** Perfectly consistent. Rejecting collapse and hidden variables is the definition of the Everettian ontology.
  *   **Point 2 & Point 4:** Consistent skepticism. You reject "extra furniture" (Bohm) and "circular derivations" (DT), suggesting a desire for a cleaner ontology even if the epistemology is hard.

  ---

  ### The Single Revision

  To clean up the Critical and High severity tensions simultaneously, you should revise **Point 4**.

  **Current Point 4:** "I don't buy the decision-theoretic derivations... they look to me like they recover the squared-amplitude weights by building in... exactly the kind of indifference... that was supposed to be derived."

  **Proposed Revision:** "I accept the decision-theoretic derivations not as *proofs* from non-probabilistic axioms, but as *elucidations* of what rationality entails in a branching context. The 'indifference' constraint is not a hidden premise, but a definition of how agents must relate to branching structure to have coherent preferences."

  **Why this fixes the package:**
  1.  **Resolves 4 vs 5:** It provides the justification for Point 5. You care by amplitude because that is what it *means* to be rational in an Everettian universe, not because of a magical derivation from non-probabilistic physics.
  2.  **Resolves 1 vs 3:** It grounds your operationalism (Point 3). Probabilities are credences, and the DT framework tells you which credences are rationally permissible. It removes the threat of "branch counting" being a valid alternative.
  3.  **Preserves Point 1:** It avoids adding a "brute law" (which would violate the purity of the wavefunction ontology). The normativity comes from the agent's relationship to the ontology, not a new physical postulate.

  **Cost:** You lose the hardline skepticism about the Deutsch-Wallace program. You must admit that *some* normative constraint is unavoidable, even if it feels like it's "building in" the result. In this context, that is a feature, not a bug.
