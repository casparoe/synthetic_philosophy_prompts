answer: |-
  ### Brainstorm Pass: Auditing the Google Doc Analogy

  *Goal: Map the features of the Google Doc (GD) to Social Ontology concepts. Identify which do the heavy lifting for the TA's reductionism and which are decorative or dangerous.*

  1.  **The Document Content** $\rightarrow$ **The Shared Plan/Goal.** (Load-bearing: This is the "We" object.)
  2.  **Local Copies on Laptops** $\rightarrow$ **Individual Intentions.** (Load-bearing: Supports reductionism; the "real" stuff is in the heads/machines.)
  3.  **Syncing/Cloud Icon** $\rightarrow$ **Common Knowledge/Communication.** (Load-bearing: Explains how "I" knows "You" know.)
  4.  **Edit History** $\rightarrow$ **Persistence of Intention over Time.** (Decoration: History is passive record; intention is active state.)
  5.  **Comment Thread** $\rightarrow$ **Negotiation of Subplans.** (Load-bearing: Shows how meshing happens without a "group mind".)
  6.  **Permissions (Editor/Viewer)** $\rightarrow$ **Roles/Division of Labor.** (Load-bearing: Explains structure without extra ontology.)
  7.  **Offline Edits/Merge Conflicts** $\rightarrow$ **Deviation/Reconciliation.** (Dangerous: Who resolves the conflict? The Server? That looks like an external agent.)
  8.  **Doc Exists After Logout** $\rightarrow$ **Group Persistence.** (Load-bearing: TA uses this to say the "We" survives individual mental states.)
  9.  **Autosave** $\rightarrow$ **Commitment/Stability.** (Weak: Mechanical feature vs. normative commitment.)
  10. **The Server** $\rightarrow$ **The Medium of Common Knowledge.** (Dangerous: If the Server holds the "truth" of the doc, is the Server part of the group? If not, where is the sharedness?)
  11. **Deletion** $\rightarrow$ **Abandoning the Plan.** (Neutral.)
  12. **Formatting/Styles** $\rightarrow$ **Social Norms.** (Weak: Formatting constrains appearance, norms constrain action.)

  *Decision:* Drop 4, 9, 11, 12. They describe mechanics, not agency. Keep 1, 2, 3, 5, 6, 7, 8. Flag 7 and 10 as potential traps for the reductionist (they smuggle in an external arbiter). Flag 1 as the site of the "Content" dispute (is the content "We J" or "I do my part of J"?).

  ***

  ### Audit of the "Shared Google Doc" Analogy
  **To:** Third-Year Seminar Student
  **From:** Philosophy Instructor
  **Re:** Term Paper Strategy on Reductionism vs. Plural Subjects

  You are right to be suspicious. The Google Doc analogy is elegant, intuitive, and currently doing too much work in your TA's argument. It is a classic move in reductionist social ontology: take a phenomenon that *looks* collective (a shared document), show that its mechanics are fully explicable via individual interactions with a neutral medium, and conclude that the "collectivity" is merely a useful label, not an ontological reality.

  However, the analogy conflates *coordination* (which can be mechanical) with *joint agency* (which is normative). Below is the audit you requested, structured to help you build your 2500-word paper.

  #### 1. Correspondence Table

  | Google Doc Feature | Social Ontology Concept | Status | Notes/Flags |
  | :--- | :--- | :--- | :--- |
  | **The Document Content** | The Shared Plan / Joint Goal | **Load-Bearing** | **Flag:** The Doc contains the *proposition* "We paint," but does it contain the *commitment*? |
  | **Local Copies (Laptops)** | Individual Intentions (I-intend) | **Load-Bearing** | Core of reductionism: The "real" intentions are local. |
  | **Syncing / Cloud Icon** | Common Knowledge / Mutual Belief | **Load-Bearing** | Explains how I know you know without telepathy. |
  | **Comment Thread** | Negotiation / Meshing Subplans | **Load-Bearing** | Shows how Bratmanian "meshing" occurs via communication. |
  | **Permissions (Editor/Viewer)** | Roles / Division of Labor | **Load-Bearing** | Explains structure without needing a "boss" entity. |
  | **Merge Conflicts** | Deviation / Conflict Resolution | **Forced** | **Flag:** In GD, the Server adjudicates. In action, *we* must negotiate. Who is the "Server" in a group? |
  | **Doc Persists (Logout)** | Persistence of Group Agent | **Load-Bearing** | TA uses this to argue the "We" doesn't vanish if one mind rests. |
  | **The Server** | The Medium of Common Knowledge | **Dangerous** | **Flag:** If the Server holds the "true" version, is it a participant? If not, where does the "Shared" live? |
  | **Autosave** | Commitment / Stability | **Forced** | **Flag:** Autosave is causal/mechanical. Commitment is normative/reason-based. |
  | **Read-Only Mode** | Free-Riding / Non-Participation | **Forced** | **Flag:** A viewer isn't violating a norm, just restricted. A free-rider violates an obligation. |

  #### 2. The Disanalogies That Actually Matter

  Your TA is using the analogy to argue that because the *mechanics* of sharing a doc are reducible to individual interactions with a server, the *metaphysics* of sharing an intention are reducible to individual interactions with common knowledge. This is where you push back. Do not waste word count on the fact that documents don't have brains (the "cheap points"). Focus on **Normativity** and **Subjecthood**.

  **A. The Normativity Gap (The "Ought" vs. The "Is")**
  A Google Doc records what *is* typed. It cannot record what *ought* to be typed.
  *   **In the Analogy:** If I stop editing the doc, the doc remains unchanged. I have not violated the doc. The doc has no standing to hold me accountable.
  *   **In Joint Action:** If we intend to paint the house, and I stop without reason, I have violated an obligation *to you* (or to *us*).
  *   **The Point:** The TA's analogy explains **coordination** (how we match our actions) but fails to explain **obligation** (why we *must* match our actions). Gilbert's plural subject theory is specifically designed to capture the creation of obligations. The Doc is a repository of information; the Plural Subject is a repository of *normative power*.

  **B. The Subject of Predication (Who is the "We"?)**
  *   **In the Analogy:** When we say "The Doc says X," this is shorthand for "The text stored on the server reads X." The Doc is not the *subject* of the saying; it is the *object*.
  *   **In Joint Action:** When we say "We intend to paint," the "We" is the subject of the intention.
  *   **The Point:** The TA treats the "We" as an object (the Doc) that we all look at. Anti-reductionists argue the "We" is the *subject* that does the intending. If the "We" is just the Doc, then who is doing the painting? The individuals. But if the intention is truly *joint*, the action is ascribed to the group *as a unit*. The Doc analogy reduces the group to a meeting place for individuals, whereas the Plural Subject view posits the group as a distinct agent *constituted* by those individuals.

  **C. The Content of the Intention (Tuomela's Challenge)**
  *   **In the Analogy:** My local copy says "Paint the house." I intend to type words that match that copy.
  *   **In Joint Action:** Do I intend "That I paint my side" (I-mode) or "That *we* paint the house" (We-mode)?
  *   **The Point:** If the TA is right, my intention is always "I intend to do my part because I believe you will do yours." But phenomenologically and conceptually, when we act together, I often intend the *joint outcome* directly. I am committed to *our* success, not just *my* contribution. The Doc analogy hides this: I can look at the Doc and intend only to fix my typo, indifferent to the whole. In joint action, indifference to the whole usually dissolves the jointness.

  #### 3. Smuggled Features (Where the Analogy Cheats)

  The analogy feels convincing because it quietly imports features of documents that joint action lacks, and vice versa.

  **A. The "Server" as a Secret Group Mind**
  The TA says the Doc lives on a server, not in anybody's head, to avoid a "group mind." But where is the "Sharedness"? It exists in the synchronization protocol and the Server's authoritative version.
  *   **The Trap:** If the Server is just a tool (like a whiteboard), the reductionist wins. But if the Server acts as the *arbiter of truth* (resolving merge conflicts), it is functioning as a stand-in for the "Group Agent." The TA is smuggling in an external authority to do the work of the "We." In a true plural subject, *we* adjudicate conflicts, not a third-party server. By offloading the "shared" status to a server, the TA avoids explaining how *we* constitute the sharing.

  **B. Clean Identity Conditions**
  A Google Doc has clear identity conditions (URL, File ID). It persists through time cleanly.
  *   **The Trap:** Groups are messy. Does the "We" persist if one member leaves and is replaced? If the TA uses the Doc to argue that the Group persists easily (because the File ID stays the same), they are ignoring the constitutive role of the specific members. In Gilbert's view, if the plural subject dissolves, the obligations dissolve. The Doc persists inertly; the Group persists only as long as the normative bonds hold.

  **C. Normative Neutrality**
  Nothing in a document is normative. Text is just text.
  *   **The Trap:** The TA treats the "Plan" as content (text). But in action theory, a Plan is a practical commitment. By mapping "Plan" to "Text," the TA strips out the *practical force*. You cannot derive an "ought" from a Google Doc. If the reductionist account cannot explain why I feel *bound* to you, it has explained coordination but missed the *social ontology*.

  #### 4. The Verdict

  **Does the no-irreducible-we claim survive?**
  It survives as a claim about **causal mechanics**, but it fails as a claim about **normative structure**.

  *   **Weak Reductionism (Survives):** You do not need a mystical group soul to explain how two people coordinate painting. Individual intentions + common knowledge + communication channels are sufficient for *success conditions*. The Google Doc proves this.
  *   **Strong Reductionism (Fails):** You *do* need something like a Plural Subject to explain the *normative conditions* (obligations, entitlements to rebuke, joint commitment). The Google Doc cannot explain why I owe you an apology if I quit without notice.

  **Your Position:** Argue for **Normative Irreducibility**. You don't need to claim the group is a separate substance (ontological dualism). You only need to claim that the *normative relations* created by "We intend" are not reducible to the sum of "I intend" relations. The "We" is irreducible not because it's spooky, but because it creates a new deontic landscape (new rights and duties) that did not exist prior to the joint commitment.

  #### 5. Better Analogies

  The Google Doc is static and informational. You need analogies that are dynamic and normative.

  **A. Improv Theater (The "Yes, And" Structure)**
  *   **Why it works:** There is no script (no Server/Doc). The "scene" exists only in the dynamic responsiveness of the actors. If one actor stops responding to the *offer* of the other, the scene dies.
  *   **Mapping:** The "We" is the scene itself. It is not in actor A's head or actor B's head. It is in the *space between them*.
  *   **Advantage:** Captures **mutual responsiveness** (Bratman) without relying on a static external object. It shows that the "jointness" is an active process, not a synced file.

  **B. A Dance Partnership (e.g., Tango)**
  *   **Why it works:** Highly normative. If the lead steps on the follow's toe, there is a violation of the partnership norms, not just a mechanical error.
  *   **Mapping:** The "balance" of the dance is a property of the pair, not the individuals. You cannot locate the "balance" in one person's body.
  *   **Advantage:** Captures the **interdependence**. If I stop, you cannot continue the dance alone (unlike the Doc, which persists). This attacks the TA's "persistence after logout" point.

  #### 6. Applying to Your Key Cases

  Use these cases to stress-test the Google Doc analogy in your paper.

  **Case 1: Painting Together vs. Neighbors**
  *   **Scenario:** Us painting together vs. Me painting my side, You painting yours (neighbors).
  *   **TA's Doc:** In both cases, we might have a "plan" visible. Maybe we both have a copy of the neighborhood HOA rules.
  *   **Your Push:** In the Neighbor case, if I stop painting, you might be annoyed, but you cannot *rebuke* me. In the Together case, you can say, "Hey, we agreed to finish this."
  *   **The Difference:** The Doc is the same (a plan to paint the house). The *attitude* toward the Doc is different. In the Together case, we have *jointly committed* to the Doc. In the Neighbor case, we just have *coinciding* intentions to follow the Doc. The Doc analogy cannot distinguish these two states without adding "joint commitment" as a separate variable—which is exactly what the TA is trying to reduce away!

  **Case 2: Stopping Because You Stopped**
  *   **Scenario:** I put down my brush because I see you have stopped.
  *   **TA's Doc:** I see the sync icon stop updating. I decide to stop to save effort.
  *   **Your Push:** In the Doc case, I stop for *my* reasons (efficiency). In the Joint Action case, I stop *for your sake* or *for the sake of the We*. My reason for action includes *your action* as a constituent part of my rationale.
  *   **The Difference:** This is **Mutual Responsiveness**. The Doc tracks the *fact* of your stopping. It does not capture that my stopping is *responsive* to yours in a normative way.

  **Case 3: The Free-Rider**
  *   **Scenario:** I pretend to paint but actually do nothing, relying on you to finish.
  *   **TA's Doc:** I am a "Viewer" rather than an "Editor." The Doc records no input from me.
  *   **Your Push:** The Doc records the *absence* of work. It does not record the *violation*. To call me a "Free-Rider" is to make a normative judgment that I owed labor. The Doc is normatively blind. It sees a non-editor; the Plural Subject sees a defector.
  *   **The Difference:** If the TA says "Free-riding is just failing to match the plan," they miss the *betrayal*. The Plural Subject account explains why free-riding feels like a moral failure, not just a coordination error.

  #### 7. Your Weakest Point (Prepare for This)

  The TA will attack you on **Ontological Parsimony**.
  *   **The Attack:** "You are positing 'obligations' and 'plural subjects' as if they are extra things in the world. But all we see is people moving paintbrushes and talking. Why multiply entities? The Google Doc explains the coordination without the spooky 'normative glue'. If you feel obligated, that's just a psychological feeling (an I-intention to obey), not a real group obligation."
  *   **Your Defense:** Do not defend "spooky glue." Defend **Conceptual Necessity**.
      *   Argue that you cannot *describe* the phenomenon accurately without the plural vocabulary. If I say "I intend to do my part," that is logically distinct from "We intend to J." I can intend to do my part even if I know you will fail (I'm just doing my duty). I cannot "We-intend" if I know you won't participate.
      *   Therefore, the "We-intention" is not just a sum of "I-intentions." It is a different *shape* of intention. You aren't adding entities; you are recognizing a different *structure* of rationality.
      *   **The Kill Shot:** Ask the TA: "If I stop painting, and you say 'You promised *us*!', am I entitled to reply 'There is no us, there is only you and me with synced files'? If that reply is rational, then joint action doesn't exist. If that reply is irrational (a category mistake), then the 'Us' is real in the only way that matters for action."

  ### Summary for your Paper Structure

  1.  **Intro:** State the Reductionist claim (TA's Doc analogy) and your counter (Normative Irreducibility).
  2.  **The Analogy Audited:** Use the Table. Show where the Doc explains coordination (Sync, Copies) but fails on commitment (Autosave, Permissions).
  3.  **The Normative Gap:** Argue that obligations cannot be reduced to predictions of behavior. Use the Free-Rider case.
  4.  **The Content of Intention:** Distinguish I-mode vs. We-mode using the Painting case.
  5.  **Better Models:** Briefly invoke Improv or Dance to show dynamic interdependence.
  6.  **Conclusion:** The "We" is not a ghost in the machine; it is the operating system. You can run individual programs (I-intentions) on it, but the system itself provides the rules that make the programs compatible. The Doc is just a file; the Plural Subject is the protocol.

  Good luck. This is a solid angle. It respects the TA's rigor while exposing the limitations of their metaphor.
