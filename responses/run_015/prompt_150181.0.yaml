  **Audit of the Cinema Analogy regarding Sunk Costs and Sunk Commitments**

  The standard economic admonition against the sunk cost fallacy relies heavily upon the analogy of the dreadful cinema film. It posits that because the ticket price is irrecoverable, rationality dictates departing immediately to maximise future utility. However, institutional economists argue that in complex social and organisational systems, 'sunk commitments' function differently. They serve as credibility mechanisms within repeated games, signalling reliability to stakeholders. To evaluate whether honouring sunk costs is inherently irrational, one must first audit the analogy itself.

  ### 1. Correspondence Table

  The following table maps the elements of the cinematic scenario onto the institutional context of legacy structures or long-term partnerships.

  | Cinema Analogy Element | Institutional Equivalent | Function in Decision Matrix |
  | :--- | :--- | :--- |
  | **Ticket Price** | **Sunk Investment / Initial Capital** | The irrecoverable outlay made prior to the current period. |
  | **Film Quality** | **Current Direct Benefits** | The immediate utility or revenue generated by the asset/partnership. |
  | **Viewer Discomfort** | **Running Costs / Opportunity Costs** | The ongoing burden of maintenance or the value of foregone alternatives. |
  | **Decision to Leave** | **Withdrawal / Termination** | The act of abandoning the commitment before its natural conclusion. |
  | **The Empty Seat** | **Vacated Market Position / Broken Contract** | The physical or structural void left by withdrawal. |
  | **Other Audience Members** | **Stakeholders / Market Observers** | Third parties who observe the decision and update their beliefs about the actor. |

  ### 2. Fractures in the Mapping

  The analogy appears robust only so long as one ignores the structural differences between a solitary leisure activity and an institutional arrangement. The mapping fractures principally in two areas: the fungibility of the investment and the nature of future interactions.

  **A. Fungibility of Prior Investment**
  In the cinema analogy, the ticket price is perfectly fungible currency that is lost the moment the transaction occurs. It has no residual value. In institutional settings, however, 'sunk commitments' often involve specific assets—specialised machinery, trained personnel, or proprietary data—that are not easily liquidated. Furthermore, the investment is often relational rather than merely financial. Abandoning a legacy structure does not merely lose money; it destroys specific capital that cannot be redeployed elsewhere. The cinema analogy assumes the resource is gone; the institutional reality is often that the resource is trapped, and abandoning the structure destroys its remaining latent value.

  **B. Future-Interaction Effects (Repeated Games)**
  This is the most critical fracture. The cinema scenario is typically modelled as a one-off interaction. The viewer is anonymous; leaving halfway through signals nothing to the cinema owner or other patrons. It is a solitary utility calculation.
  Conversely, institutional economics operates within the framework of repeated interactions. Stakeholders (investors, partners, citizens) observe whether an organisation honours its commitments even when they become burdensome.
  *   **Signalling:** Honouring a sunk commitment signals stability and reliability. It assures partners that the organisation will not defect at the first sign of trouble.
  *   **Reputation:** Withdrawal may yield short-term savings but incurs a reputation cost that raises the price of future capital or partnerships.
  *   **Credibility Mechanism:** By binding oneself to a course of action (even a suboptimal one), an actor can deter opportunistic behaviour from others. If partners know you will not walk away easily, they are more likely to invest in the relationship themselves.

  ### 3. Evaluation of Rationality and Analogy Bias

  **Does the conclusion survive?**
  Once these disanalogies are placed upon the table, the conclusion that honouring sunk costs is *always* irrational does not survive. In a one-off, anonymous transaction with fungible currency, staying is irrational. In a repeated game with specific assets and reputation effects, honouring a sunk commitment can be the strictly rational choice to maximise long-term utility. The cost of withdrawal (reputational damage, loss of trust) may exceed the running costs of the 'dreadful film'.

  **Was the analogy carrying the conclusion?**
  It is evident that the cinema analogy was indeed carrying the conclusion all along. The analogy is constructed specifically to isolate the decision-maker from social consequences and future iterations. By stripping away the audience (stakeholders) and the possibility of future tickets (repeated interactions), the analogy rigs the scenario to make 'leaving' the only logical output. It defines rationality narrowly as immediate net-present-value maximisation, ignoring the game-theoretic value of commitment.

  ### 4. Conclusion

  The cinema analogy serves as a useful heuristic for personal finance or isolated consumer choices, but it is a defective tool for analysing institutional strategy. It fails to account for the fact that in public and corporate life, one is rarely sitting in the dark alone. Actions are observed, and consistency is a currency. Therefore, whilst the sunk cost *fallacy* remains a valid warning against emotional attachment to past losses, the institutional concept of the sunk *commitment* demonstrates that maintaining a legacy structure can be a rational strategy for preserving credibility. To label such behaviour irrational is to mistake the rules of a solitary game for the rules of the social marketplace.
