  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is the "Unity of Consciousness" vs. "Disunity" in split-brain cases.
      *   Standard split-brain cases (Sperry/Gazzaniga) rely on lateralized stimuli (flash to left visual field only). The prompt explicitly forbids this ("nothing flashed to one visual field").
      *   This is hard. In a normal domestic setting, sensory input is bilateral (both eyes see the room, both ears hear the voice). Motor output is usually coordinated.
      *   If the corpus callosum is partially severed (40%), information transfer is reduced but not eliminated.
      *   To make all four theories predict the *same* behavior, the behavior must be ambiguous enough to support multiple interpretations of agency and consciousness.
      *   *Challenge:* If the dial is at 40%, there *should* be some behavioral anomalies if the two-subjects view is true (conflict between hands, etc.). If there are *no* anomalies, the Two-Subjects view might claim the subjects are cooperating perfectly. The Interpreter view claims the left is just making sense of whatever happens. The Deflationist says it's all just processing. The Integrationist says the quality of experience is lower.
      *   *Key Insight:* The behavior must be mundane enough that conflict isn't expected anyway. Making toast or stirring soup. If she stirs with the right hand and holds the bowl with the left, that's normal. If she pauses before answering, that's normal. The theories diverge on *why* the pause happens or *who* is pausing.

  3.  **Drafting the Scene:**
      *   Setting: Kitchen, Tuesday evening.
