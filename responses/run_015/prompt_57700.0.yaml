      *   **Constraint 3 (Accounts):**
          1.  Two-Subjects View (Nagel-style): Two streams of consciousness.
          2.  Interpreter View (Gazzaniga-style): One self (left hemisphere), right hemisphere has states but no "I".
          3.  Deflationist View: Consciousness was never unified anyway; surgery changes nothing fundamental about the "self".
          4.  Broadcasting/Integration View (Global Workspace-style): Phenomenology requires global availability; half-connection means thinned-out inner life.
      *   **Constraint 4 (Analysis):** Walk through each account in prose. Explain why behavior underdetermines the theory. Identify the working feature (adjustable dial vs. disconnection). Analyze what happens if the dial is removed (fixed callosotomy).
