      *   The Dial: Set at 40%. Enough to coordinate basic motor tasks (subcortical pathways + remaining callosal fibers) but maybe not enough for rich phenomenological unity.

  4.  **Drafting the Analysis (The Four Accounts):**
      *   *Two-Subjects:* There are two agents here. They are cooperating. The pause is negotiation. The behavior is identical because they agree on stirring the soup.
