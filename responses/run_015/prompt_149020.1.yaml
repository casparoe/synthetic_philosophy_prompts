      *   *Argument for Non-Fiction:* Existence adds weight to the "possibility" of the virtue. Knowing someone *actually* did this proves it's humanly possible (existential proof).
      *   *Synthesis:* Fiction teaches *conceptual* moral reasoning. Biography teaches *existential* possibility. Both teach, but differently. Biography says "This *can* be done." Fiction says "This is *what it feels like*."

