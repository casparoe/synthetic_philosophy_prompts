      *   *Common Thread:* All the "Good" reactions involve **active moral reasoning by the reader** facilitated by **honest complexity**. All the "Bad" reactions involve **passive reception** (awe, cynicism, blind copying) or **distortion of reality** (omitting flaws, omitting context).

      *   *Proposed Principle:* **Moral Agency through Contextualized Judgment.** A life story teaches morally when it invites the reader to exercise judgment about *choices* within *constraints*, rather than prescribing *outcomes* or *identities*.

  3.  **Address the Specific Hypotheses:**

      *   *Reasoning vs. Outcomes:* Strong candidate. Plutarch focuses on character (reasoning/disposition) despite fate (outcome). Hagiography focuses on outcome (miracles). Debunking focuses on outcome (scandals).
