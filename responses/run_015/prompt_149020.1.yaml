answer: |-
  You have stumbled upon a problem that has occupied moral philosophers from Aristotle to Martha Nussbaum: the problem of **exemplarity**. How does the particular (one specific life) teach us the universal (how to live)?

  Your gut reactions are remarkably consistent. You are rejecting **moral mimicry** (copying actions) in favor of **moral judgment** (understanding reasoning).

  Here is a coherent account that ties your reactions together, a suggestion on which verdict to adjust, and a thought on the fiction question.

  ### 1. The Unifying Principle: Moral Gymnastics, Not Moral Maps

  The principle that unifies your "Good" reactions and explains your "Bad" ones is this: **A life story teaches morally when it exercises the reader's faculty of judgment (*phronesis*), rather than bypassing it.**

  *   **Why Plutarch works (Pairing):** By placing two lives side-by-side, Plutarch forces you to adjudicate. You aren't told who is better; you have to weigh the variables. This activates your moral reasoning.
  *   **Why Hagiography fails (Perfection):** If a saint has no doubts, there is no decision-making process to observe. You cannot learn *how* they chose virtue, only that they *had* it. This bypasses judgment and creates awe (which you correctly identified as making you feel inadequate).
  *   **Why Debunking fails (Cynicism):** If a figure is selfish in every detail, there is no virtue to analyze. It teaches that agency is an illusion and everyone is corrupt. This shuts down moral reasoning because it suggests the effort is pointless.
  *   **Why Nuance works (Kindness + Mistakes):** This restores agency. You see the virtue being chosen in small moments and the failure happening in large ones. You are invited to ask: *Why did the kindness work there but the leadership fail here?* That is a question for your judgment to solve.
  *   **Why Prescriptive Imitation fails:** This treats biography as a map ("Go here, do this") rather than a weight ("Lift this to get stronger"). As you noted, contexts differ. Blind imitation ignores the variable of *circumstance*, which is a key part of moral judgment.

  **The Coherent Account:** A biography is morally useful if it functions as a **simulation of agency**. It must show the *constraints* the subject faced, the *reasoning* they used to navigate them, and the *consequences* that followed, without guaranteeing that the same reasoning yields the same consequences for you.

  ### 2. Which Verdict Should You Drop?

  You mentioned you are torn about comparing people across centuries, feeling it is "unfair because the rules were totally different."

  **You should drop (or significantly modify) this verdict.**

  If you accept the principle above (Moral Gymnastics), cross-century comparison is actually *more* valuable, not less, provided you compare **dilemmas** rather than **norms**.

  *   **The Trap:** Comparing specific actions (e.g., "He dueled to defend honor, should I?"). The social rules have changed, so this is unfair.
  *   **The Opportunity:** Comparing structural human constraints (e.g., "He had to choose between loyalty to a friend and loyalty to the state"). *That* rule has not changed.

  Plutarch knew Greeks and Romans lived centuries apart under different laws. He didn't compare them to see if they followed the same laws; he compared them to see how they handled the same *human pressures* (ambition, grief, power, fear).

  If you drop the idea that "different rules make comparison unfair," and replace it with "different rules make the *underlying virtue* harder to isolate, but more valuable when found," your system becomes more robust. It allows you to learn from a Stoic Roman, a Medieval Saint, and a Modern Activist, not by copying their actions, but by analyzing how they navigated the tension between their values and their world.

  ### 3. The Fiction Question: Does Existence Matter?

  You asked: *What would it say about a biography of a fictional character written with all the psychological detail and realism of a real life — would that teach the same way, or is there something special about knowing the person actually existed?*

  This is the crux of the matter. There is a distinct difference, though both are valuable.

  **Fiction teaches Psychological Truth.**
  A novel like *Crime and Punishment* can teach you more about the psychology of guilt than a police report. Fiction allows the author to grant you access to interior thoughts that real biographies can only guess at. For the purpose of "Moral Gymnastics" (exercising judgment), fiction is often *superior* because the data is cleaner. You know exactly what Raskolnikov was thinking.

  **Biography teaches Existential Proof.**
  However, knowing a person *actually existed* adds a specific moral weight: **Possibility.**
  *   When you read about a fictional hero, you think: "This is a beautiful idea of what a human could be."
  *   When you read about a real hero, you think: "This is proof that a human *has been*."

  Real biography combats cynicism in a way fiction cannot. When you feel that kindness is impossible in a cruel world, a real biography stands as evidence that it was done. It anchors virtue in reality, not just imagination.

  **The Verdict:**
  *   **Fiction** is better for refining your **empathy and reasoning** (because you get full access to the mind).
  *   **Biography** is better for refining your **hope and resolve** (because you get proof of feasibility).

  ### Summary

  Your intuition is correct: The value lies in **reasoning over outcomes** and **comparison over imitation**.

  1.  **The Principle:** A life story teaches when it forces you to judge the relationship between character, circumstance, and choice, rather than telling you what to choose.
  2.  **The Adjustment:** Do not discard cross-century comparison. Ignore the changing social *rules* and compare the enduring human *dilemmas*.
  3.  **The Fiction Distinction:** Fiction simulates the *mind* of a moral agent; Biography proves the *possibility* of a moral agent. You need both to learn how to live.

  You are looking for what the philosopher Paul Ricoeur called the "narrative unity of a life." You want stories that don't just tell you what happened, but show you how a human being tries to make sense of what happened. That is where the learning lives.
