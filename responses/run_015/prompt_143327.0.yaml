answer: |-
  Good morning. Thank you all for being here. For half of you, my uncle was a colleague, a collaborator, a mind that sharpened your own. For the rest, he was simply Uncle [Name], the man who carved the turkey and asked about your grades.

  He spent the last years of his life thinking about a specific puzzle. Some of you know it as Thomson's Lamp. Imagine a lamp that is switched on. After one minute, it is switched off. After half a minute, on again. After a quarter of a minute, off again. The intervals get smaller, faster, infinite. The question is: At the end of two minutes, is the lamp on or off?

  Mathematically, there is no answer. The sequence converges, but the state does not. There is no final position.

  For many, facing death brings a need to know the final state. We want to know where he is now. We want to imagine a place he has arrived at, a rest, a heaven, a final switch position. But my uncle was a man of hard facts. He told us at every Thanksgiving that there is no soul, no offstage destination. He didn't say this to be cold. He said it because he believed that pretending there was a final state dishonors the sequence.

  He had a variation of the puzzle he called the "heartbeat version." He imagined the flips of the switch weren't abstract intervals of time, but actual pulses. One beat, the light is on. The next, it off. A life measured not by where it ends, but by the rhythm of the light itself.

  If we look for where he is now, we are asking the wrong question. There is no hidden room he walked into. There is no secret endpoint we are missing. And honestly, that is okay. Because if the value of the lamp was only in whether it was left on or off at the end, then all the light it gave during the sequence wouldn't matter. But it does matter.

  The value was in the illumination. It was in the thousands of pulses where he was present. It was in the moments he taught a student to see beauty in a proof, the moments he held my grandmother's hand, the moments he argued with us about politics until we laughed. Those were the flips. That was the light.

  To the mathematicians here: You know that the sum of the series is finite, even if the terms are infinite. To the family: You know that his love for us was finite in time, but infinite in impact.

  We don't need to invent an afterlife to comfort ourselves. The comfort is in the history. The light was on. It was on for us. It was on for his work. It was on, fiercely and brightly, for every single pulse of that heartbeat sequence until the very last one.

  He doesn't have a final state. He has a legacy. And as long as we remember the rhythm he taught us, the circuit isn't broken. It's just passed to us.

  Thank you.
