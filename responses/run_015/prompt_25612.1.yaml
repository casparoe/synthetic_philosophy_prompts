  The Newton-to-Einstein transition is the crucible in which the pessimistic meta-induction (PMI) is tested. Initially, this episode appears to vindicate the PMI. Newtonian gravitation (NG) was empirically triumphant for centuries, yet general relativity (GR) demonstrated it was ontologically false. There is no absolute space; gravity is not a force but curvature. If such a successful theory was fundamentally mistaken about the nature of reality, the PMI argues we should expect the same fate for GR.

  However, the transition also provides the realist with their strongest counter-argument: the preservation of structure. NG was not discarded as useless; it was subsumed. In the limit of weak fields and low velocities, the Einstein field equations reduce to Newton's law. This mathematical continuity suggests that while NG's *ontology* (absolute space) was false, its *structural description* of gravitational phenomena was approximately true. This supports epistemic structural realism, which claims that while specific theoretical entities may change, the mathematical structure relating them is retained across theory change.

  Does this satisfy the realist? It offers a qualified success. It allows the realist to concede that current theories are likely strictly false (ontologically) while maintaining they are approximately true (structurally). The NG-GR case shows that theory change is often cumulative rather than revolutionary. Unlike the phlogiston case, where continuity is debated, the mathematical reduction of NG to GR is rigorous, offering a robust basis for approximate truth. This weakens the PMI's implication that success is no guide to truth; instead, success is a guide to *structural* truth within a specific domain.

  Conversely, this forces the anti-realist to refine the PMI. They cannot simply claim past theories were "false" and therefore wholly unreliable. They must acknowledge that false theories can capture real structural relations. The anti-realist must argue that even structural continuity does not guarantee the *current* structure is final. GR itself may be a limiting case of a quantum gravity theory, just as NG is of GR. The induction holds, but the definition of "falsehood" must be nuanced to account for limiting-case relationships.

  Ultimately, this episode gives the realist a satisfactory reply only if they retreat to structural realism. It forces the anti-realist to formulate the induction more carefully, acknowledging that "false" theories can converge toward truth rather than being replaced by incommensurable alternatives. For the physicist, this mirrors practice: you know your equations are approximations, yet you trust them to land a probe on Mars. The PMI warns against dogmatism; the structural continuity justifies confidence. The Newton-Einstein transition suggests we should not believe our theories are literally true, but we have good reason to believe they capture the structural architecture of the world, subject to future domain restrictions.
