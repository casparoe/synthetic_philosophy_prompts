          2.  If you ask for a "horse," a yellow or black horse suffices. If you ask for a "white horse," a yellow or black horse does not suffice. Therefore, "White horse" $\neq$ "Horse".
          3.  "Horse" does not select for color (no rejection/selection, *wu qu*). "White horse" selects for color (*you qu*). Therefore, they are different.
          4.  The composite term implies a specific entity distinct from the generic category.

  3.  **Evaluate the Linguistic vs. Metaphysical Interpretation:**
      *   *Linguistic (Nominalist/Logical):* Focuses on the terms (*ming*). "Horse" and "White Horse" have different extensions and intensions. It's about the correctness of naming (*zheng ming*).
      *   *Metaphysical (Realist/Ontological):* Focuses on the entities (*shi* or *zhi*). Whiteness and Horseness are universal attributes (*jian* vs. *wu*). The combination creates a distinct ontological unit.
      *   *The User's specific angle:* Mereology (parts/wholes) and the collapse of the linguistic/ontological distinction.

  4.  **Analyze *Mingjia* (School of Names) Conceptual Resources:**
