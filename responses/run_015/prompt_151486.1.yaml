answer: |-
  This is an exceptionally precise framing of the problem. You have correctly identified the tension that makes the *Bai Ma Lun* (White Horse Dialogue) resistant to standard analytic categorization: it operates in a conceptual space where the distinction between the logic of terms and the ontology of properties is not yet drawn, or is deliberately collapsed.

  To answer your core question directly: The argument is best read as a **metaphysical claim about the discreteness and combinability of attributes (universals), argued through the logic of naming.** It is not merely a linguistic puzzle about intension and extension, nor is it a straightforward mereology of physical parts. Rather, it relies on a mereology of *attributes* wherein the combination of universals creates a distinct ontological target that is not identical to either constituent universal.

  Here is a conceptual unpacking of the argument's structure, grounded in the *Mingjia* (School of Names) resources you mentioned.

  ### 1. The Semantics of *Fei* (Is Not) and Identity
  The first hurdle is the copula. When Gongsun Long says "White horse *fei* horse," the term *fei* is often translated as "is not." In modern predicate logic, we might read this as $\neg \forall x (Wx \to Hx)$, which is obviously false. But in the *Mingjia* context, *fei* functions more as a denial of **identity** rather than a denial of **class membership**.

  The interlocutor assumes a hierarchical ontology: a white horse is a *kind* of horse. Gongsun Long assumes an atomic ontology of attributes: "Horse" names a form (*xing*), "White" names a color (*se*). The compound "White Horse" names the conjunction of Form + Color.
  *   If $A = \text{Form}$
  *   If $B = \text{Form} + \text{Color}$
  *   Then $A \neq B$.

  For Gongsun Long, if the criteria for application differ, the referents are ontologically distinct. This is where your intuition about "identity conditions" is correct. The text argues that because the conditions for satisfying the term "horse" (any color) differ from the conditions for satisfying "white horse" (specific color), the *shi* (actuality) picked out by the two names are not the same *shi*.

  ### 2. The Mereology of Attributes (Not Substances)
  You asked whether there is an implicit mereological assumption. There is, but it is not the mereology of parts and wholes in a physical object (like a leg and a head making a horse). It is a mereology of **determinables and determinates**.

  In the *Jian Bai Lun* (Hard and White Dialogue), Gongsun Long argues that "Hardness" and "Whiteness" are separate entities (*zhi*) that can exist independently of the stone. They "hide themselves" (*cang*) when not manifested. Applying this to the *Bai Ma Lun*:
  *   "Horseness" is a universal that can exist without color (conceptually/ontologically).
  *   "Whiteness" is a universal that can exist without being a horse.
  *   When they combine, they do not merely describe a pre-existing particular; they constitute a new **compound universal**.

  The mereological assumption is that adding a determinant (White) to a determinable (Horse) does not just narrow the scope of the original; it creates a new ontological unit. The "White Horse" is a new *kind* of entity in the logical space of names, not just a subset of the old entity. This supports your suspicion that the text treats the addition of whiteness as producing a "new kind of whole with different modal properties." Specifically, the modal property of **replaceability**.

  ### 3. The Argument from Request (Pragmatic Ontology)
  The strongest evidence for the metaphysical reading is the "Request Argument" (often found in the later passages of the dialogue).
  *   If you seek a *horse*, a yellow or black horse suffices.
  *   If you seek a *white horse*, a yellow or black horse does not suffice.
  *   Therefore, "white horse" is not "horse."

  This is not merely about linguistic sense; it is about how the world responds to the name. In *Mingjia* thought, *ming* (name) and *shi* (actuality) must correspond (*zheng*). If the practical outcome of invoking Name A differs from invoking Name B, then the *shi* they govern are different.

  This moves the argument from semantics to pragmatics to ontology. If "horse" and "white horse" referred to the same ontological reality (with one just being more specific), the world should not respond differently to the request. The fact that the world *does* respond differently (by accepting/rejecting different animals) proves that the two names latch onto different causal powers or identity conditions. This validates the "non-analytic interpretation" you are seeking: the move from conceptual difference to ontological difference is licensed by the functional role of the name in the world.

  ### 4. *Zhi* (Pointing) vs. *Ming* (Naming)
  You mentioned the distinction between "pointing out" and "naming." This is crucial. In the *Zhi Wu Lun* (On Pointing at Things), Gongsun Long explores how reference works.
  *   *Ming* fixes the concept.
  *   *Zhi* points to the actuality.

  The *Bai Ma Lun* argues that the *zhi* of "horse" is indeterminate regarding color (*wu qu* - no selection/rejection). The *zhi* of "white horse" is determinate regarding color (*you qu* - has selection/rejection). Because the *pointing* function differs (one points to a range of colors, the other points to a single color), the *target* of the pointing cannot be identical.

  This collapses the linguistic/metaphysical distinction. For Gongsun Long, you cannot separate the logic of the term from the structure of reality. To name differently *is* to carve reality differently. There is no "bare particular" horse that underlies both descriptions. There is only the universal "Horse" and the universal "White-Horse." The particular animal is just the temporary locus where these universals manifest.

  ### 5. *Tong* and *Yi* (Same and Different)
  Finally, the text's treatment of similarity (*tong*) and difference (*yi*) clarifies the ontological commitment. The interlocutor argues from **class inclusion** (White horses are *included* in horses). Gongsun Long argues from **attribute identity**.

  For Gongsun Long, for A to be "the same" as B, A and B must share all relevant ontological markers.
  *   "Horse" has the marker [Form].
  *   "White Horse" has the markers [Form + Color].
  *   Since [Form] $\neq$ [Form + Color], the entities are *yi* (different).

  This reveals the School of Names' broader concern: they are resisting the conflation of categories. They worry that if we allow "White Horse is Horse," we blur the distinction between the determinable and the determinate, leading to political and social confusion (the root of *zheng ming* or rectification of names). If a ruler asks for a "horse" (generic capability) and receives a "white horse" (specific, perhaps useless capability), the mismatch causes failure. Thus, the metaphysical distinction serves a pragmatic function.

  ### Conclusion: The Collapse of the Distinction
  To return to your specific query: Is it linguistic or metaphysical? In the context of the *Mingjia*, **it is both, because the text does not recognize the dichotomy.**

  The argument relies on a **realism about universals** where attributes are separable entities (*zhi*). The "mereological assumption" is that compounds of universals are distinct universals, not merely subsets. The "logic of compound terms" is actually an ontology of compound properties.

  When Gongsun Long says "White horse is not horse," he is asserting that the **compound universal** (White-Horse) is not identical to the **simple universal** (Horse). He is denying that the specific is identical to the generic, not that the specific is a member of the generic class.

  Therefore, the most faithful reading for your seminar is likely this: The dialogue posits that **identity is strict correspondence of attributes.** Since the compound term entails an attribute (color) that the simple term leaves indeterminate, the two terms pick out distinct ontological targets. The "slipperiness" you feel arises because we moderns want to say "It is a horse, but specifically a white one," treating "horse" as a substrate. Gongsun Long denies the substrate; there are only attributes. If the attributes differ, the thing differs. Thus, the linguistic distinction *constitutes* the ontological distinction.
