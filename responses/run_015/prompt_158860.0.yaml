      *   **The Verdict:** Debate is not a general solution. It degrades into "audit wearing a costume" when errors are non-localizable.
      *   **Experimental Proposal:** How to test this? Create tasks with controlled error types. Measure win rates as $N/B$ increases.
      *   **What Changes My Mind:** Evidence that honest debaters can signal Type 3 errors without full reconstruction (e.g., via "meta-arguments" that are cheap to verify).
