      *   **Analyzing the Taxonomy:** Validate the user's split. Type 1 is where debate shines (binary search). Type 2 is the "needle in a haystack" where pointing costs as much as finding. Type 3 is the "missing map" where the terrain itself is wrong. Argue that Type 3 is the most dangerous and debate has no weapon for it.
      *   **Addressing the Counter-Arguments (The "Other Side"):**
