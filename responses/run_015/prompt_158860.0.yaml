      *   *Wait, stronger verdict:* I will argue that the **taxonomy is load-bearing but reveals debate's fatal flaw.** Debate relies on *localizability*. Without it, the honest advantage vanishes. Therefore, debate cannot solve the obfuscation problem in the regime that matters (Type 3).

