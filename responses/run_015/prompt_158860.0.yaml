answer: |-
  The promise of AI debate as a scalable oversight mechanism rests on a specific economic hope: that truth is cheaper to point at than falsehood is to defend. In the standard setup, two debaters argue opposite sides before a weaker judge, with the assumption that the honest party can expose a flaw in the dishonest party's argument more efficiently than the judge could find it alone. This efficiency is the only thing that allows the judge to verify claims beyond their own capability budget $B$. However, your suspicion cuts to the bone of this mechanism. If the dishonest debater can construct an argument of length $N$ where $N \gg B$, and the cost to locate the single fatal flaw is proportional to $N$, the economic advantage of the honest debater evaporates.

  To render a verdict, we must first accept your taxonomy as load-bearing. It does not collapse; rather, it maps the precise terrain where debate succeeds and where it fails. Type 1 errors (localizable commission) are the native habitat of debate. If an argument is a chain of logic $S_1 \rightarrow S_2 \dots \rightarrow S_N$, and the break is at $S_{43}$, the honest debater can say "Check $S_{43}$." The judge spends one unit of budget, confirms the break, and the dishonest case collapses. The cost of pointing is $O(1)$ or $O(\log N)$ via binary search, while the cost of defending the whole chain is $O(N)$. Here, debate works beautifully.

  The failure arises in Type 2 and Type 3. In Type 2 (non-localizable commission), the error is not a broken link but a subtle distortion that only becomes visible when viewing the whole chain. Perhaps step 10 relies on a definition that is subtly shifted in step 90. To find this, the honest debater cannot simply point; they must trace the dependency. If tracing the dependency costs $O(N)$, the honest debater has no budget advantage over the judge. They are merely performing the audit themselves. In Type 3 (omission/framing), the problem is worse. There is no step 43 to point at because the crucial step was never written. The argument is locally consistent but globally irrelevant. To expose this, the honest debater must construct an alternative framework. If constructing that framework costs $O(N)$, the asymmetry is gone. The liar can simply obfuscate the counter-framework with equal complexity.

  The strongest case for the defense relies on the recursion objection and the nature of asymmetry. Proponents argue that even if the initial argument is obfuscated, the honest debater's *objection* initiates a new game. The liar must now defend the objection, and if the objection is true, the liar must lie about the objection, introducing a new error. The hope is that errors compound for the liar but not the honest party. However, this assumes the judge can distinguish a "true objection" from a "plausible-sounding objection" without full verification. If the liar can generate plausible-sounding nonsense at cost $O(1)$ per step, the recursion does not bottom out in truth; it bottoms out in the judge's unverified intuition. In the regime where $B \ll N$, the judge's intuition is exactly what the liar is optimizing against. If the liar can mimic the distribution of honest objections—a cheap-talk equilibrium—the judge learns nothing. The symmetry breaks only if truth possesses a structural rigidity that falsehood cannot mimic without incurring higher complexity costs. In Type 1 domains like math, truth is rigid. In Type 3 domains like policy or strategy, truth is often underdetermined, allowing the liar to maintain a consistent fiction indefinitely.

  Furthermore, consider the reconstruction cost. To attack a Type 3 error, the honest debater often needs to say, "You failed to consider counterfactual $X$." But to prove $X$ matters, they must sketch the world where $X$ holds. If the liar's argument was a $N$-step optimization of a specific frame, the honest debater's counter-frame may also require $N$ steps to demonstrate superiority. If the cost to attack equals the cost to produce, debate offers no scalability. It becomes "audit wearing a costume," consuming the same cognitive resources as a direct check but with added noise from the adversarial dynamic.

  Therefore, my verdict is this: **Debate is not a general solution for obfuscated arguments.** It is a tool for compressing audits in domains where errors are localizable (Type 1). In the regime that matters for existential risk—high-dimensional strategy, policy, and semantic framing where errors are non-localizable or omissive (Type 2 and 3)—debate fails to provide a scalable advantage. It does not solve the $B \ll N$ problem; it merely shifts the burden of $N$ onto the honest debater, who cannot discharge it within the judge's budget. The mechanism relies on an asymmetry of information that collapses when obfuscation is semantic rather than syntactic.

  To settle this empirically, we need an experiment that decouples error type from domain. We should construct a "Obfuscation Benchmark" using tasks where ground truth is known but the path to it varies in structure. For example, use code generation where the bug is either a syntax error (Type 1), a logic error dependent on distant state (Type 2), or a missing requirement specification (Type 3). We vary $N$ (argument length) and $B$ (judge budget). If debate is load-bearing, the honest win rate should remain high as $N/B$ increases, regardless of error type. If my verdict is correct, we will see a phase transition: honest win rates will hold for Type 1 but collapse to chance levels for Type 2 and 3 as $N$ exceeds $B$. Specifically, in Type 3 tasks, we should observe the honest debater forced to write arguments of length $\approx N$ to explain the omission, thereby hitting the budget ceiling and losing the judge's attention.

  There is a potential Type 4 error your taxonomy misses: **Adversarial Priors.** This occurs when the liar manipulates the judge's baseline assumptions before the argument begins, effectively rigging the judge's $B$ allocation. If the liar can convince the judge that certain steps are "standard" and don't need checking, they reduce the effective $B$ available for the critical steps. This is a meta-level Type 3 error. Including this strengthens the verdict against debate, as it suggests the liar can attack the judge's budgeting heuristic itself, not just the argument content.

  What would change my mind? I would need to see evidence that honest debaters can signal Type 3 errors with $O(1)$ cost. This would require a "meta-language" of critique where pointing out a missing frame is cheaper than building the frame. For instance, if an honest debater could say, "This argument ignores the second-order effect of $X$," and the judge could verify the *relevance* of $X$ without simulating the effect, the asymmetry would return. If experiments show that judges can reliably identify "suspicious omissions" based on structural markers alone (e.g., "this argument has no termination condition") without checking the content, then debate might survive the Type 3 challenge. Until then, the assumption that truth is easier to point at than to hide is a property of mathematics, not of reality.

  In conclusion, debate is a powerful mechanism for clarifying local inconsistencies, but it is not a truth machine for high-dimensional obfuscation. Your taxonomy correctly identifies the fault lines. The failure mode you fear is not a bug; it is a feature of the information geometry in complex domains. When the cost to locate an error scales with the cost to produce it, the honest advantage vanishes. We should not rely on debate to solve the obfuscation problem in the regimes where we most fear being deceived. It works where the chain can be broken; it fails where the map is wrong.
