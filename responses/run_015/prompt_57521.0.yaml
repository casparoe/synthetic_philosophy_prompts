  *   **If she calls it Nonlocal:** She is following **Rule 2 (Manifest Lorentz Invariance)**. To her, "Local" means "Relativistic Ontology." If this is her rule, she might actually call your Target Case **Local** (because it has no privileged now), despite the spacelike dependence.

