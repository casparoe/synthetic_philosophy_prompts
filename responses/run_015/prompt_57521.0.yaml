  ### The Separating Case

  To be absolutely sure which rule she is running, you need a case where Rule 1 and Rule 2 give opposite answers. The target case splits them (Rule 1 says Nonlocal, Rule 2 says Local). To confirm, you should present a case where **Rule 1 says Local, but Rule 2 says Nonlocal.**

