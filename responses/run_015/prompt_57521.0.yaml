  Your friend is running a very specific, technically precise criterion, but she's explaining it using heuristics (like "privileged now") that can sometimes obscure the underlying rule. Based on her six verdicts, we can reverse-engineer the two candidate rules she might be using.

  ### The Two Candidate Rules

  **Rule 1: Bell's "Local Causality" (The Causal Structure Rule)**
  This is the standard definition used in foundations. A theory is **Local** if the probability of an event in a spacetime region depends *only* on the physical state in its past light cone.
  *   **Why it fits her verdicts:**
      *   **Bohm/GRW/Textbook:** Violate this. The state/outcome here depends on the state/outcome there, spacelike separated, even given the full past. (Verdict: Nonlocal).
      *   **Many-Worlds:** Satisfies this. The wavefunction evolves via local differential equations; correlations arise from common causes in the past (branching). (Verdict: Local).
      *   **Superdeterminism:** Satisfies this. The correlation comes from the past initial conditions, not a spacelike link. (Verdict: Local).
      *   **Retrocausal:** Satisfies this. Influences travel backwards and forwards along light cones, never spacelike. (Verdict: Local).

  **Rule 2: Manifest Lorentz Invariance (The Geometry Rule)**
  A theory is **Local** if its fundamental ontology and laws do not require a preferred foliation of spacetime (a "privileged now").
  *   **Why it fits her verdicts:**
      *   **Bohm/GRW/Textbook:** To make sense of the instantaneous update/collapse, you generally need a preferred frame. (Verdict: Nonlocal).
      *   **Many-Worlds:** Unitary QFT is fully Lorentz invariant. (Verdict: Local).
      *   **Superdeterminism/Retrocausal:** Can be formulated without a preferred frame (influences stay on light cones). (Verdict: Local).

  ### The Prediction for Your Target Case

  **The Case:** A collapse theory that is **Lorentz Invariant** (no privileged now) but **Bell Nonlocal** (collapse odds in Lab A depend on Lab B spacelike, without signaling).
  *(Note: This sounds very much like Roderich Tumulka's "rGRWf" flash ontology.)*

  **My Best Guess:** She will call it **Nonlocal**.

  **Why?**
  While her "privileged now" comment points to Rule 2, her verdicts on Superdeterminism and Retrocausality prove she cares more about Rule 1 (Causal Structure).
  *   She accepts Retrocausality as "Local" even though it's weird, because the influence is timelike.
