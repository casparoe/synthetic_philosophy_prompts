  # Confidence Ratings & Pilot Flags

  *   **Intel Packet Mechanism:** **High Confidence.** This is the core engine. It works provided the envelopes are sealed correctly. *Pilot:* Check that the text on Alpha and Beta cards is literally identical font and paper.
  *   **Bond Fee Incentive:** **Medium Confidence.** Students might treat the Bond as sunk cost. *Pilot:* Ensure the scoring rules clearly state the Bond is *deducted from the winner's total*, not just a token exchange.
  *   **Keyholder Veto:** **High Confidence.** This creates the "Institution." Students enjoy having power over peers.
  *   **Ethical Safety:** **High Confidence.** Provided you stick to "Asset/Intel" language and do not allow students to map it onto their own mental health during the negotiation phase. *Instruction:* Explicitly tell them: "Discuss the Assets, not your feelings."

  **Final Advice:**
  Your friend the psychiatrist is right that enforcement is hard. You are right that epistemic humility is necessary. This game forces them to see that **enforcement requires a wager on epistemic humility.** When they set the Bond, they are betting on their own future ignorance. That is the moment you want them to feel.
