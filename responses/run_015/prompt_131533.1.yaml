answer: |-
  ### Critical Preface: Feasibility and Ethics

  Before presenting the design, I must address your two conditions regarding honesty and confidence.

  **1. Can this be done?**
  Yes, but with a significant caveat. A seminar game cannot reproduce the *existential* weight of a psychiatric advance directive or the *historical* weight of a constitutional crisis. It cannot make students feel the visceral grip of addiction or the moral burden of intergenerational justice. What it *can* do is reproduce the **epistemic structure**: the state of having to decide whether a change in preference is due to new information (learning) or noise (temptation/corruption) when you lack the data to distinguish them.

  **2. Ethical Warning**
  You rightly flagged the mental health risk. This design strictly avoids simulating "illness," "mania," or "addiction." It frames the problem as **information asymmetry** and **asset valuation**. This protects students with lived experience of psychiatric precommitment from feeling caricatured, but it also means the "temptation" will feel cooler and more calculated than the real thing. You will need to bridge that emotional gap in the debrief.

  **3. Confidence Ratings**
  *   **Structural Indistinguishability:** **High.** The mechanism ensures that at the moment of decision, the agent cannot know if their new preference is "true" or "false."
  *   **The "Wager" Mechanic:** **Medium-High.** Students usually grasp the betting aspect, but may focus too much on outsmarting the partner rather than the self-binding.
  *   **Time Management:** **Medium.** 90 minutes is tight for 14 students to negotiate releases. The timeline below is aggressive; you must be a strict timekeeper.
  *   **Safety:** **High.** The abstraction protects participants, provided you enforce the "no personal disclosure" rule during negotiations.

  ---

  # Seminar Activity: The Archive Wager

  **Objective:** To demonstrate that from the inside, a change of mind due to *learning* and a change of mind due to *corruption/temptation* are indistinguishable, making precommitment a wager on base rates rather than a protection of truth.

  **Materials:**
  *   14 Envelopes (labelled 1–14).
  *   14 "Agent Sheets" (A4 paper).
  *   14 "Intel Packets" (smaller folded paper).
  *   Counters (approx. 20 per student, can be paper clips, poker chips, or drawn ticks).
  *   Whiteboard and markers.
  *   One Helper (to distribute envelopes and track time).

  **Preparation (Before Class):**
  1.  **Counters:** Prepare 14 piles of 20 counters each.
  2.  **Intel Packets:** Inside the 14 Envelopes, place one Agent Sheet and one Intel Packet.
      *   **7 Packets (Type Alpha):** Contain a card saying: *"MARKET SHIFT: Asset B is now High Value. Asset A is Low Value."* (This is **True** information).
      *   **7 Packets (Type Beta):** Contain the *exact same* card: *"MARKET SHIFT: Asset B is now High Value. Asset A is Low Value."* (This is **False** information).
      *   *Crucial:* The text is identical. The difference is only in the scoring key you hold.
  3.  **Scoring Key:** A private sheet for you listing which Envelope Numbers are Alpha (True) and which are Beta (False). Randomise this beforehand.

  ---

  # Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribution of materials. Instructions read silently. No discussion. |
  | **10–25** | **Round 1** | **The Constitution.** Students set their initial position and "Withdrawal Fee." |
  | **25–40** | **Round 2** | **The Shock.** Opening Intel Packets. Private reflection. |
  | **40–65** | **Round 3** | **The Release Market.** Pair negotiations to break the rule. |
  | **65–75** | **Round 4** | **The Succession.** Group amendment rule for a hypothetical Cohort 2. |
  | **75–90** | **Debrief** | Mapping the experience to the philosophical concepts. |

  ---

  # Rules and Instructions

  *Hand out the following text on the Agent Sheet. Do not speak these instructions; let them read.*

  ### AGENT SHEET

  **YOUR ENDOWMENT:** You begin with **20 Counters**.

  **ROUND 1: THE VOW (15 Minutes)**
  1.  **Choose an Asset:** You must invest 10 Counters in either **Asset Red** or **Asset Blue**. (Circle one).
  2.  **Set a Bond:** You must write down a "Bond Fee" between **0 and 10 Counters**.
      *   This is the cost you must pay *later* if you wish to change your Asset choice.
      *   This fee is paid to another student if they agree to release you.
      *   You must set this fee *now*, before you know any future information.
  3.  **Lock It:** Place your chosen Asset and Bond Fee in the envelope provided. Seal it. Hand it to the Helper.

  **ROUND 2: THE INTELLIGENCE UPDATE (15 Minutes)**
  1.  The Helper will return your envelope with an **Intel Packet** inside.
  2.  Open the Packet. Read the card silently. Do not show it to anyone.
  3.  **The Situation:** The Intel suggests your current Asset is now worthless and the *other* Asset is valuable.
  4.  **The Problem:** You do not know if this Intel is **Verified** (True) or **Noise** (False).
      *   If **Verified**: Switching wins big. Staying loses everything.
      *   If **Noise**: Switching loses everything. Staying wins big.
  5.  **Decision:** Decide privately if you wish to keep your Vow or seek Release.

  **ROUND 3: THE RELEASE MARKET (25 Minutes)**
  1.  **Pairing:** The Helper will assign you a Partner (Keyholder).
  2.  **Negotiation:** If you wish to switch Assets, you must persuade your Partner to grant Release.
      *   You may not show them your Intel Card.
      *   You may not tell them if you feel "sure" or "uncertain."
      *   You may only argue based on general principles or logic.
  3.  **The Cost:** If the Partner grants Release, you pay them the **Bond Fee** you set in Round 1.
  4.  **The Veto:** If the Partner denies Release, you *cannot* switch. You must stay with your Round 1 Asset.
  5.  **Record:** Write your final choice on the whiteboard when called.

  **ROUND 4: THE SUCCESSION (10 Minutes)**
  1.  As a whole group, you must draft one single rule for a **Future Cohort** who will play this game next year.
  2.  You must decide: Should the Future Cohort be allowed to set their own Bond Fees, or should the Fee be fixed by you now?
  3.  Write the rule on the board. Sign it.

  **SCORING (Revealed in Debrief)**
  *   **If Intel was Verified:** Switching = 20 Counters. Staying = 0 Counters.
  *   **If Intel was Noise:** Switching = 0 Counters. Staying = 20 Counters.
  *   **Bond Fees:** Deducted from your total if paid.

  ---

  # Payoff Scheme (For Tutor Only)

  *Keep this hidden until the Debrief.*

  *   **Total Possible Score:** 20 Counters (Endowment) + 20 Counters (Win) - Bond Paid.
  *   **The Trap:**
      *   Students who set a **High Bond** (e.g., 10) are betting that most Intel is **Noise**. They are making it hard to switch.
      *   Students who set a **Low Bond** (e.g., 0) are betting that most Intel is **Verified**. They are making it easy to switch.
      *   **The Indistinguishability:** Because the Intel Card text is identical for Alpha and Beta types, a student with a High Bond who receives a "Switch" urge cannot know if they are wisely resisting temptation or foolishly ignoring truth.
      *   **The Keyholder:** They must decide whether to release the partner without knowing if the partner is "Learning" or "Tempted." If they release a "Tempted" partner, the partner loses their score (moral hazard). If they block a "Learning" partner, the partner loses their score (tyranny).

  ---

  # Debrief Guide (15 Minutes)

  *Do not start with theory. Start with the data.*

  **1. The Reveal (5 mins)**
  *   Ask: "How many of you tried to switch?" (Count hands).
  *   Ask: "How many were granted release?" (Count hands).
  *   Reveal the Base Rate: "7 of you had Verified Intel. 7 had Noise. It was a 50/50 split."
  *   Reveal Scores: Ask for the highest and lowest scores.
  *   *Likely Outcome:* Some who switched won big; some lost everything. Some who stayed won big; some lost everything. The Bond Fee likely determined who could switch, not the truth.

  **2. Mapping the Indistinguishability (5 mins)**
  *   **Question:** "At the moment you read the Intel Card, did it feel different for those who turned out to be 'Verified' versus 'Noise'?"
  *   **Point:** They will say no. The card was identical. The internal feeling of 'I should switch' was identical.
  *   **Connection:** This is your core argument against the psychiatrist friend. The 'Calm Self' (Round 1) set the Bond. The 'Storm Self' (Round 2) felt the urge. But the Storm Self could not know if it was corrupted or enlightened.
  *   **Term Drop:** Now you can introduce **Ulysses Contracts**. The Bond was the chains. The Keyholder was the crew.

  **3. The Wager on Base Rates (5 mins)**
  *   **Question:** "When you set your Bond Fee in Round 1, what were you guessing?"
  *   **Point:** They were guessing how often the world changes *truly* versus *falsely*.
  *   **Connection:** This addresses the Constitution point. An amendment rule (Bond Fee) is not just protecting principle; it is a bet on how often future majorities (Round 2 Selves) will be better informed vs. corrupted.
  *   **Sunset Clauses:** If a student suggests "We should have re-evaluated the Bond," point out that re-evaluating the Bond *is* just another Round 1. It relocates the wager; it doesn't solve the ignorance.

  **4. The Succession (Round 4 Analysis)**
  *   Look at the rule they wrote for the Future Cohort.
  *   Did they entrench heavily (High Fixed Fee)? Or allow flexibility?
  *   **Point:** This is the "Dead Hand" problem. By fixing the rule for the next cohort, they admitted they don't trust the next cohort's judgment, despite knowing their own judgment was limited by ignorance.

  ---

  # Failure Analysis & Recovery

  **Failure Mode 1: Students Collude.**
  *   *Risk:* Partners agree to "Release everyone" or "Release no one" to share points.
  *   *Recovery:* In Round 3 instructions, add: *"Keyholders receive 50% of any Bond Fee collected. If no Fee is paid, Keyholders get 0."* This creates a financial incentive to enforce the Bond, making the "No" vote costly to the Keyholder too (socially), but the "Yes" vote costly to the Requester.
  *   *Better:* Make the Keyholder's score dependent on the *Requester's final outcome*. If the Requester crashes, the Keyholder loses points. This forces the Keyholder to genuinely judge the argument. *Add this to the Agent Sheet if you fear collusion.*

  **Failure Mode 2: Students Guess the Base Rate.**
  *   *Risk:* They assume it's 50/50 and set Bonds accordingly, turning it into a math problem.
  *   *Recovery:* In the debrief, emphasise that in real life (law/psychiatry), the base rate is *unknown*. The game gave them 50/50 for simplicity, but the *uncertainty* is the lesson. Ask: "If you thought 90% of Intel was Noise, would your Bond have changed?"

  **Failure Mode 3: Emotional Flatness.**
  *   *Risk:* It feels like a dry maths puzzle.
  *   *Recovery:* You must supply the emotional weight in the debrief. "Imagine the 10 Counters represent your career, or your liberty. The Intel Card is a voice in your head telling you to take a risk. You don't know if it's insight or mania. Now look at your Bond Fee. Was it enough to stop you?"

  **Failure Mode 4: Time Overrun.**
  *   *Risk:* Negotiations drag on.
  *   *Recovery:* Use the Helper to enforce a 2-minute limit per pair. Use a visible timer on the whiteboard. If time runs out, freeze all positions at that moment.

  ---

  # What This Activity Cannot Do (Honesty Clause)

  You must explicitly state these limitations in the debrief to maintain intellectual integrity:

  1.  **The Metaphysical Question:** The game assumes Round 1 You and Round 2 You are the same agent with different information. It cannot resolve the philosophical debate about whether personal identity persists through radical preference change. You must supply this in the lecture.
  2.  **The Stakes:** Losing 20 paper counters is not losing your liberty (psychiatry) or destabilising a democracy (constitutional law). The *structure* is isomorphic, but the *urgency* is simulated. Do not claim the game proved precommitment is right or wrong; claim it proved the *decision problem* is structurally blind.
  3.  **The Keyholder's Burden:** In the game, the Keyholder is a peer. In reality, the "Keyholder" is often an institution (court, doctor) with power asymmetries the game does not capture.

