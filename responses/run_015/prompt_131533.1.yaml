      *Confidence Ratings:* I need to be honest. The "indistinguishability" relies on students believing the randomisation. If they suspect the tutor is manipulating it, it fails. I need to specify how to randomise transparently (e.g., dice roll visible to all, but individual assignment hidden). Actually, sealed envelopes prepared beforehand is safer for time.

