  2.  **Deconstruct the Historical Concepts:**
      *   **Non-human actors/Agentive Nature:** Acknowledges that environmental factors (volcanoes, disease) set conditions or constraints but don't strictly dictate specific human outcomes.
      *   **Environmental Determinism:** The discredited theory that environment *directly causes* specific cultural traits or behaviors (e.g., heat makes people lazy, tropics make people uncivilized). It denies human agency and often justifies colonialism/racism.
      *   **The Middle Ground (Possibilism/Structuralism):** Environment creates challenges/opportunities, but human societies respond based on politics, economics, and culture. A volcano causes crop failure, but government policy determines whether that becomes a famine.

