answer: |-
  You are right to worry about supply response and identification; those are the kill shots in this room. The economists will treat the "batch trigger" as a structural assumption that needs empirical backing, not a philosophical axiom. If you claim fixed thresholds without acknowledging inventory buffering, the IO modelers will dismantle you in minutes. The philosophers won't care about the mechanism if the economists prove the probability of triggering is effectively zero.

  Here is your prep sheet, ordered by potential damage.

  ### Q&A Prep Sheet

  **1. Wholesale smoothing and inventory buffering**
  *   **The Objection:** "Retailers don't order unit-for-unit; they smooth orders over time to manage holding costs. Your 'trigger' probability isn't $1/N$, it's diluted by inventory buffers. Doesn't this collapse the expected value calculation?"
  *   **The Reply:** Buffers shift the threshold; they don't eliminate it. A warehouse holds stock to absorb variance, but once the reorder point is hit, a batch is ordered. My purchase changes the probability distribution of *when* that hit occurs. Ex ante, the expected number of animals ordered per unit purchased remains 1, even if the timing is stochastic. The buffer is just a lag, not a sink.
  *   **Where it's soft:** If buffers are large relative to demand variance, the probability of *my* unit being the specific trigger approaches zero faster than the batch size grows, potentially undermining the EV magnitude in the short run.

  **2. Identification of discrete threshold parameters**
  *   **The Objection:** "You posit discrete thresholds, but these are proprietary black boxes. Without identifying the specific reorder points or batch sizes, how can you claim this mechanism is empirically robust rather than just a theoretical convenience?"
  *   **The Reply:** We don't need to observe the specific parameter to know the structure exists. Industrial organization literature confirms supply chains operate on discrete lot sizes (EOQ models, pallet constraints). The exact integer doesn't matter for the moral claim; only the existence of *some* non-smooth response function matters. Structural estimation isn't required for ethical bounding.
  *   **Where it's soft:** You lack direct evidence for the specific commodity chain you're discussing. If pressed on data, you have to rely on general supply chain literature, not specific chicken data.

  **3. Inframarginal substitution and market clearing**
  *   **The Objection:** "Even if a batch is ordered, doesn't price adjustment clear the market? If you don't buy, price drops slightly, and an inframarginal consumer buys instead. Isn't the net impact zero?"
  *   **The Reply:** Not for perishables with fixed production cycles. Chickens are bred weeks in advance based on expected demand. Unsold inventory isn't always price-discounted into consumption; often it's wasted or downgraded. The marginal unit determines whether the next batch is bred, not just who eats the current one.
  *   **Where it's soft:** Secondary markets (discount bins, pet food) might absorb surplus, reducing waste. You need to argue waste is significant enough to break the substitution chain.

  **4. Moral arbitrariness of administrative triggers**
  *   **The Objection:** "This makes the wrongness of my purchase depend on contingent facts about a retailer's inventory software. Is morality really so fragile that it flips based on a manager's reorder policy?"
  *   **The Reply:** Morality depends on facts, and institutions are facts. It's not arbitrary; it's contingent. Just as wrongness depends on whether a gun is loaded, it depends on whether the supply chain is rigid. We should change the institutions, but until we do, the moral status tracks the mechanism.
  *   **Where it's soft:** It feels counterintuitive that two identical acts differ in wrongness solely due to backend logistics. This bothers the philosophers more than the economists.

  **5. External validity to political margins**
  *   **The Objection:** "You generalize to voting, but district margins are orders of magnitude larger than batch sizes. Doesn't the probability of triggering a recount or seat change vanish compared to the food case?"
  *   **The Reply:** The structure is identical: discrete thresholds (recounts, donor matching, coalition formation). While $P(\text{trigger})$ is lower in voting, the magnitude of the batch (policy impact) is higher. The expected value framework holds even if the variance is massive.
  *   **Where it's soft:** The voting analogy is empirically weaker. You risk losing credibility on the food thesis if you overclaim on the voting math.

  **6. Long-run elasticity vs. short-run rigidity**
  *   **The Objection:** "Supply is fixed in the short run but elastic in the long run. Aren't you conflating short-run batch rigidity with long-run marginal response?"
  *   **The Reply:** Long-run elasticity is composed of short-run threshold crossings. Contracts are renewed based on realized sales. My purchase signals demand that shapes long-run contracts. The batch trigger is the mechanism by which long-run elasticity is realized.
  *   **Where it's soft:** If long-run adjustments are perfectly smooth, the short-run thresholds might average out to a continuous curve over time.

  **7. Agent ignorance of supply chain structure**
  *   **The Objection:** "Consumers don't know the reorder points. How can they be obligated to act on a mechanism they cannot observe or calculate?"
  *   **The Reply:** Obligation tracks objective impact, not subjective knowledge. We are obligated not to harm even if we are ignorant of the causal chain (e.g., poisoning a well). The epistemic burden is to know the system is threshold-based, not to know the thresholds themselves.
  *   **Where it's soft:** High epistemic demands might make the theory action-guiding only for experts, limiting its practical normative force.

  ### Strategic Advice

  **What to concede before anyone asks:**
  Concede that **thresholds are probabilistic, not fixed.** Explicitly state that inventory buffering makes the trigger probability noisy. This preempts Objection 1 and 2. It shows you understand the IO literature and aren't modeling supply chains as cartoonishly rigid.

  **The single reply that must land:**
  The **Expected Value equality** ($P(\text{trigger}) \times \text{Batch Size} = 1$). If the economists believe this math holds despite the buffering, the moral conclusion follows. If this math fails, the talk fails. Spend your capital here.

  **The question you're hoping nobody asks:**
  You are right to fear the inventory software point. The precise formulation is: **"Contingency of moral status on administrative rules."** If you fight this, you look like you're ignoring the philosophers' constraint. If you accept it (as a feature of institutional consequentialism), you keep them on board.

  \answer{Moral arbitrariness of administrative triggers.}
