  Your friend is using the Kelly *framework* correctly (looking at time averages) but has miscalculated the threshold where geometric growth turns negative (which happens around 51.5% win rate for these payoffs, not 55%).

  **However**, the normative question remains: *Is EV the right metric to use?* Even though both metrics say "Take" here, EV says "Take because you might make \$600,000," while Kelly says "Take because you will likely make \$2,300." The reasoning matters.

