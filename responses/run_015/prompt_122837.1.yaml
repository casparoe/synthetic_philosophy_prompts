answer: |-
  First off, I want to validate your annoyance. You and your friend are grappling with one of the hardest, most persistent stalemates in the philosophy of mind. The debate over teleosemantics (specifically the Millikan version) has been raging since the late 80s, and professional philosophers still haven't agreed on who wins. You aren't missing a simple solution; you are hitting the exact walls that keep this field alive.

  That said, let's break down your three specific challenges. I'll tell you where your arguments hit home, where the theory has a defense, and where the disagreement ultimately rests on a deeper metaphysical split.

  ### 1. Is the "Normal Conditions" move a dodge?

  **Your intuition:** It sounds like cheating. You say the theory explains misrepresentation by saying "it's a mistake if it happens outside normal conditions," but defining "normal conditions" seems to require knowing what the content *already is*.

  **The Teleosemantic Defense:** It is not logically circular, but it is technically dense. Millikan doesn't mean "statistically normal" (what happens most often). She means "conditions under which the mapping relation was selected."

  Here is the distinction:
  *   **The Mechanism:** The frog's eye detects a "small, dark, moving speck."
  *   **The Consumer:** The frog's tongue/snapping mechanism.
  *   **The Proper Function:** The consumer was selected to snap *only* when that speck is nutritious (a fly).

  When the frog snaps at grit, the mechanism worked (it saw a dark speck), but the *consumer* failed to get what it needed (nutrition). The "normal condition" is the specific historical correlation between "dark speck" and "fly" that allowed the ancestors to survive.

  **Verdict:** It's not a dodge in the sense of logical circularity. It's a specific claim about **etiological functions** (functions defined by history). However, your frustration is shared by many critics (like Jerry Fodor). The worry is that "normal conditions" are gerrymandered to save the theory. If the frog snaps at grit often enough, does grit become part of the "normal conditions"? Teleosemantics says no, because grit didn't drive the *selection*. But distinguishing "selection drivers" from "correlated noise" is notoriously difficult. You are right to be suspicious, but your friend is right that it's a coherent (if complex) system, not a simple tautology.

  ### 2. Is your "Collapse Argument" attacking a strawman?

  **Your Argument:** Selection cares about payoff, not truth. Therefore, content = utility. If content = utility, a false belief that works (snapping at grit) isn't a misrepresentation. Therefore, teleosemantics can't explain error.

  **Analysis:** This is a famous objection, often called the **Indeterminacy Problem**. You are not attacking a strawman; you are attacking the core vulnerability of the view.

  However, the teleosemanticist replies that you are conflating *success* with *function*.
  *   Selection *does* care about payoff.
  *   **But:** Payoff is achieved *by* the system tracking specific features of the world.
  *   The "content" is the feature that *must* be present for the payoff to occur *in the long run*.

  Snapping at grit yields a momentary action, but it yields zero calories. Over evolutionary time, a system that represents grit as food goes extinct. Therefore, the content *must* be "fly" (or "nutritious thing"), not "dark speck" or "useful thing." The theory argues that truth (accurate mapping) is the *mechanism* by which utility is achieved.

  **Verdict:** Your argument is strong, but it assumes that "utility" can be decoupled from "truth-tracking." Teleosemantics argues they are coupled. If the frog's brain state represents "food," and there is no food (grit), the state is false, even if the motor output (snap) is the same. The theory survives this *if* you accept that biological functions are specific (eating flies) rather than general (snapping at things).

  ### 3. The Two Lakes Case: Is this "Game Over"?

  **Your Argument:** Two physically identical frogs, placed in the same environment, cannot have different mental contents just because of their ancestors. That implies content is "spooky" or non-natural.

  **The Teleosemantic Commitment:** Your friend is biting the bullet here. Teleosemantics is a form of **Externalism**. It claims mental content is not "in the head." It is a relation between the head, the world, and history.

  To a teleosemanticist, your Two Lakes case is not a *reductio ad absurdum*; it is a **prediction**.
  *   **West Frog:** Ancestors selected for Fly-Detection. Content = "Fly." Snapping at grit = Error.
  *   **East Frog:** Ancestors selected for Fly/Seed-Detection. Content = "Fly or Seed." Snapping at grit (if grit resembles a seed) might be a different error, or if the mechanism is broader, it might not be an error at all.

  **Is it insane?**
  *   **If you are an Internalist (like you seem to be):** Yes, it is insane. It violates the principle of supervenience (no difference in mental state without a difference in physical state). If two brains are identical, their thoughts should be identical.
  *   **If you are an Externalist (like your friend):** No, it is necessary. Think of a key. A physically identical piece of metal is a "key" in one house and "scrap metal" in another, purely based on the history of the lock it was cut for. Teleosemantics treats brain states like keys.

  **Verdict:** This is where the theory stands or falls based on your prior metaphysical commitments. The theory *does* commit to the East/West frogs having different contents.
  *   **Does this kill the theory?** Only if you believe mental content *must* supervene on the physical brain. Many philosophers (following Putnam's Twin Earth) accept that content *doesn't* supervene locally.
  *   **However:** There is a pragmatic cost. If content depends on history we can't measure, it becomes hard to use in psychology. If I can't tell if a frog is representing "fly" or "seed" without a genealogy test, is "content" doing any scientific work? This is the strongest version of your objection.

  ### So, who is actually right?

  There is no consensus, but here is the scorecard:

  1.  **On "Normal Conditions":** You are right that it feels like a dodge, but your friend is right that it is technically defined. It solves the grit problem *formally*, but many find it unsatisfying *intuitively*.
  2.  **On the Collapse Argument:** You are highlighting a real tension (Truth vs. Utility), but Teleosemantics has a standard reply (Utility requires Truth-Tracking). You aren't destroying the theory here, just pressing its hardest button.
  3.  **On the Two Lakes:** **You are right about the consequence, your friend is right about the commitment.** The theory *does* say the frogs are different. If you find that unacceptable, then Teleosemantics is false *for you*. But your friend isn't lying; the theory really does say that.

  **The Real Disagreement:**
  You are arguing from **Internalist Intuitions** (content is what's going on inside the system right now).
  Your friend is arguing from **Externalist Theory** (content is a functional role defined by history).

  **My advice:** You won't win this argument tonight. The "Two Lakes" case is essentially the "Swampman" objection (Davidson), which teleosemanticists have spent 30 years digesting. They accept the weirdness of historical individuation as the price of naturalizing content. You reject the weirdness as proof that the theory is wrong.

  If you want to press the advantage, don't argue about frogs. Argue about **psychological explanation**. Ask your friend: *"If I'm a neuroscientist studying a frog, and I can't know its ancestry, how can I use 'content' in my laws? If content is invisible to measurement, is it science or metaphysics?"*

  That is the place where teleosemantics sweats the most. But for now, maybe take a break from the frogs. They aren't going anywhere.
