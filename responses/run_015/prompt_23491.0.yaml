answer: |-
  The "cluelessness" objection to consequentialism argues that agents are often unable to know enough about the long-term consequences of their actions to determine which action produces the best outcome. If we cannot know the good, we cannot maximize it; therefore, consequentialism cannot guide action.

  However, as your prompt notes, this objection often obscures a critical distinction between **epistemic ignorance** (we don't know the value) and **axiological incomparability** (there is no determinate value to know). Distinguishing these two cases is vital because they demand different normative responses and pose vastly different threats to the consequentialist framework.

  ### 1. Distinguishing the Two Cases

  The core difference lies in the metaphysics of value and the nature of the uncertainty.

  **Case (i): Epistemic Ignorance (Complete Betterness)**
  In this scenario, the axiology (theory of value) is **complete**. For any two outcomes $A$ and $B$, it is objectively true that either $A$ is better than $B$, $B$ is better than $A$, or they are equally good. The "cluelessness" arises solely from the agent's lack of information regarding causal chains or empirical facts.
  *   **The State of the World:** Determinate. There is a "fact of the matter."
  *   **The Problem:** Informational deficit. We lack the data or computational power to access the fact.
  *   **Analogy:** A card is face down on the table. It is definitely either the Ace of Spades or the King of Spades. You do not know which, but the card *is* one or the other.

  **Case (ii): Value Incomparability (Incomplete Betterness)**
  In this scenario, the axiology is **incomplete**. For some pairs of outcomes $A$ and $B$, there is no fact of the matter regarding which is better. They are genuinely incomparable (not merely equal). No amount of empirical evidence could settle the question because the values involved (e.g., aesthetic beauty vs. moral duty, or present happiness vs. distant future existence) do not share a common metric.
  *   **The State of the World:** Indeterminate. There is no "fact of the matter."
  *   **The Problem:** Structural deficit. The ranking function required by consequentialism does not exist for these options.
  *   **Analogy:** Asking whether the number 7 is heavier than the color blue. It is not that we lack a scale; it is that the concepts do not admit of that comparison.

  ### 2. The Force of the Objection

  The distinction matters because the "cluelessness" objection functions as a **practical challenge** in Case (i) but a **theoretical challenge** in Case (ii).

  **In Case (i), the force is mitigated.**
  If the betterness relation is complete, consequentialism remains coherent as a theory of *objective* rightness (the right act is the one that actually produces the best outcome). The objection merely shows that agents cannot reliably track objective rightness. This forces a shift from *Objective Consequentialism* to *Subjective Consequentialism*. The theory does not break; it simply retreats from a guide to *truth* to a guide to *rational belief*. The objection becomes one of degree (how ignorant are we?) rather than kind.

  **In Case (ii), the force is devastating.**
  If the betterness relation is incomplete, the fundamental imperative of consequentialism—"Maximize the Good"—becomes ill-defined. Maximization requires a complete ordering to identify a unique peak. If options are incomparable, there is no "best" option to maximize. Here, cluelessness is not about our access to value, but about the non-existence of a comparative value. This attacks the coherence of the normative principle itself, not just our ability to follow it.

  ### 3. Available Consequentialist Responses

  Because the nature of the uncertainty differs, the toolkit available to the consequentialist differs significantly between the two cases.

  #### Responses to Case (i): Epistemic Ignorance
  Since there is a fact of the matter, the goal is to approximate it as closely as rationality allows.

  1.  **Expected Value Maximization:**
      *   *Mechanism:* The agent assigns subjective probabilities to various outcomes and calculates the expected value (probability $\times$ value).
      *   *Viability:* Highly viable. This is the standard move from Objective to Subjective Consequentialism. Even if we are "clueless" about the specific outcome, we can often assign probabilities (e.g., "There is a 10% chance this policy leads to disaster").
      *   *Limitation:* It requires that values be cardinally measurable and comparable to form a single expectation. It also struggles with "tiny probabilities of vast utilities" (Pascal's Mugging), but this is a technical problem within the framework, not a collapse of the framework.

  2.  **Robust Satisficing:**
      *   *Mechanism:* Rather than maximizing expected value, choose the option that meets a threshold of "good enough" across the widest range of probable scenarios.
      *   *Viability:* Viable. This acknowledges high uncertainty without abandoning the goal of producing good outcomes.

  #### Responses to Case (ii): Value Incomparability
  Since there is no single metric to maximize, the agent cannot use expected value calculations in the standard sense.

  1.  **Avoiding Dominated Options (Undominatedness):**
      *   *Mechanism:* A rational agent should not choose an option $A$ if there is another available option $B$ that is at least as good as $A$ in all respects and better in some. If $A$ and $B$ are incomparable, neither dominates the other.
      *   *Viability:* This is often the *only* viable response. If values are incomparable, you cannot maximize, but you can still avoid choosing something strictly worse. This shifts consequentialism from a **maximizing** theory to a **constraint-based** theory.
      *   *Limitation:* It is permissive. If $A$ and $B$ are incomparable, this rule allows you to pick either. It fails to provide specific guidance in hard choices, which weakens consequentialism's claim to be a decisive action-guide.

  2.  **Axiological Precision (Denial of Incomparability):**
      *   *Mechanism:* The consequentialist insists that a common currency of value (e.g., hedonic utility, preference satisfaction) *must* exist to make comparison possible.
      *   *Viability:* This is a defensive move. It denies the premise of Case (ii). However, it risks making the axiology implausible (e.g., claiming art and morality are reducible to the same scalar unit).

  3.  **Vagueness/Imprecise Probabilities:**
      *   *Mechanism:* Treating incomparability as extreme vagueness. Instead of a single expected value, options have a range of possible values.
      *   *Viability:* A middle ground. If the ranges do not overlap, you can still choose. If they do overlap significantly (due to incomparability), you return to the "avoid domination" rule.

  ### Summary Table

  | Feature | Case (i): Epistemic Ignorance | Case (ii): Value Incomparability |
  | :--- | :--- | :--- |
  | **Betterness Relation** | Complete (Fact of the matter exists) | Incomplete (No fact of the matter) |
  | **Nature of Cluelessness** | We lack data/calculation power. | The values lack a common metric. |
  | **Force of Objection** | Practical (Hard to apply theory). | Theoretical (Theory is ill-defined). |
  | **Primary Response** | **Expected Value Maximization.** | **Avoiding Dominated Options.** |
  | **Resulting Theory** | Subjective Consequentialism. | Non-maximizing Consequentialism (or Pluralism). |

  ### Conclusion

  The conflation of these two cases allows critics to overstate the damage cluelessness does to consequentialism. If cluelessness is merely **epistemic (Case i)**, consequentialism survives by retreating to expected utility; the theory remains intact, merely acknowledging human cognitive limits. If cluelessness is **axiological (Case ii)**, consequentialism faces an existential crisis, as the command to "maximize" loses its meaning.

  Recognizing this distinction clarifies the debate. A consequentialist can readily admit to Case (i) while vehemently rejecting Case (ii). To do otherwise is to surrender the core maximizing structure of the view. Therefore, the most robust consequentialist response to the cluelessness objection is to argue that while we are often empirically ignorant (Case i), the betterness relation itself remains complete, thereby preserving the viability of expected-value maximization.
