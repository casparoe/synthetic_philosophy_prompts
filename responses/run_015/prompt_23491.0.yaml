      *   *Key Insight:* If cluelessness is just (i), consequentialists can retreat to subjective rightness. If it's (ii), they must retreat to a different normative structure entirely.

  9.  **Final Polish:** Check terminology (axiology, deontic, subjective/objective consequentialism). Ensure the tone is analytical and philosophical. (Make sure to mention Lenman or Greaves as context for "cluelessness" implicitly or explicitly).

