      *   **Core Distinction:** Two epistemic situations often conflated:
          *   (i) Complete betterness relation + Ignorance (Epistemic Uncertainty).
          *   (ii) Incomplete betterness relation + Incomparability (Metaphysical/Value Uncertainty).
      *   **Tasks:**
          *   Explain the difference between (i) and (ii).
          *   Explain why it matters (force of the objection).
          *   Analyze available consequentialist responses for each (e.g., expected value, avoiding domination).

  2.  **Define "Cluelessness":**
      *   What is it? It's the idea that agents often cannot know the long-term consequences of their actions well enough to determine which action maximizes the good. (Associated with Lenman, Greaves, etc.).
      *   Standard formulation: "We are clueless about the far future."

  3.  **Analyze Case (i): Epistemic Ignorance (Complete Betterness):**
      *   *Nature:* There *is* a fact of the matter about which outcome is better. Value is determinate. We just don't know it.
      *   *Analogy:* A face-down card. It's either an Ace or a King. We don't know which, but it *is* one or the other.
      *   *Consequentialist Implication:* Maximizing the good is still the goal, but we need a decision procedure under uncertainty.
      *   *Response:* Expected Utility Theory (EUT). Assign probabilities, calculate expected value, maximize.
      *   *Force of Objection:* Weakens the objection. If we can assign probabilities (even imprecise ones), we can still act rationally. The objection becomes about *computational difficulty* or *lack of data*, not a structural flaw in the theory.

  4.  **Analyze Case (ii): Value Incomparability (Incomplete Betterness):**
      *   *Nature:* There is *no* fact of the matter. The values are on different scales or fundamentally distinct such that no trade-off exists.
      *   *Analogy:* Comparing the taste of a sound to the color of a number. Or, perhaps more philosophically, comparing a life of artistic achievement vs. a life of moral saintliness (if one holds a pluralist view).
      *   *Consequentialist Implication:* "Maximize the good" is ill-defined if "the good" doesn't rank all options.
      *   *Response:* Satisficing? Avoiding dominated options? Soft maximization? This requires modifying the core consequentialist imperative.
      *   *Force of Objection:* Much stronger. It attacks the coherence of the maximizing principle itself. If $A$ and $B$ are incomparable, you can't maximize between them.

  5.  **Compare the Force of the Objection:**
      *   *Case (i):* Cluelessness is a practical hurdle. Consequentialism survives by moving from *Objective* Consequentialism (actually do the best) to *Subjective/Expected* Consequentialism (do what you reasonably believe is best).
      *   *Case (ii):* Cluelessness is a theoretical fatal blow (potentially). If the axiology itself is incomplete, standard consequentialism (which requires a ranking to maximize) breaks down.

  6.  **Evaluate Consequentialist Responses:**
      *   *Expected Value Maximization:* Works for (i). Fails for (ii) because you can't assign a scalar value to incomparable items to sum them up.
      *   *Avoiding Dominated Options:* Works for both, but is weaker. In (i), it's suboptimal (you want the *best*, not just *not the worst*). In (ii), it might be the only rational rule left (choose something not strictly worse than another).
      *   *Imprecise Probabilities/Values:* A middle ground for (i), but edges toward (ii).

  7.  **Drafting the Explanation (Iterative refinement):**
