  **Question**

  The question is not whether agentless rationales exist, but what they rationalize. Standard views say they inherit into action, becoming personal reasons for anyone able to intervene, or into nothing, being mere evaluative facts. I argue for a third option: anchoring. On this view, agentless rationales normatively anchor attitudes toward unalterable states of affairs without guiding action. The determinate question for this chapter is whether the anchoring view can account for the normative asymmetry between agents who are causally upstream of an unpreventable outcome and those who are mere bystanders. If anchoring cannot explain why the upstream agent's regret is fittingly different from the bystander's without covertly reintroducing agency, the view collapses into the reductionist claim that these are just evaluative facts. If it can, it establishes a distinctive normative category that is neither practical nor merely descriptive. I will argue that it can. We assumed that settling existence settles function. I want to attack the bridge instead. The chapter asks: given an agentless rationale, what is the inheritance relation? Is it action, attitude, or anchoring? I take a determinate position: it is anchoring, and it survives the upstream/bystander test.

  **Why the existing options leave it open**

  My supervisor suspects this is merely verbal: a dispute over whether to label evaluative facts as "reasons." If the label changes nothing about what we ought to feel or do, the suspicion is correct. The existing options leave this open because they focus on the ontology of reasons rather than their normative footprint. The agentialist says no agentless reasons exist because reasons must guide. The reductionist says they exist but are just values. Both agree on the fittingness conditions for attitudes in most cases, rendering the dispute inert. They assume that if a reason cannot guide action, it cannot rationalize anything else.

  To rebut the verbal objection, I must show that the inheritance question yields divergent verdicts on fittingness. The anchoring view predicts that certain attitudes are fitting even when action is impossible, not because they track hidden agency, but because they track value directly. The agentialist must deny this or claim the attitude is mistaken. This is not verbal; it is a disagreement about when regret is appropriate. If I can show a case where anchoring permits an attitude the agentialist forbids, or vice versa, the dispute is substantive. The current stalemate exists because neither side has isolated a case where the modal profile of the rationale—specifically its persistence through impossibility—decides the verdict. We went around in circles because we thought the existence question settled the normative consequences. It does not. The verbal dispute charge holds only if the normative consequences are identical. I intend to show they are not. The agentialist claims that if a consideration cannot guide action, it is normatively inert regarding the agent. The anchoring view claims it remains active regarding attitude. This is a substantive disagreement about the structure of normativity. If the supervisor thinks it is verbal, it is because she assumes all normativity is practical normativity. I need to show that attitudinal normativity has different conditions. The case must demonstrate that the fittingness of regret tracks the agentless rationale even when practical reason is silent. If the verdicts on fittingness diverge, the dispute is not about words, but about the architecture of reasons.

  **Method**

  I will proceed in four stages. First, I will construct the "Unwitting Trigger" case. Two witnesses observe a fatal landslide. Witness A walked the path hours earlier, unknowingly loosening a rock; Witness B did not. Neither could have known or prevented the slide. The discriminating feature is causal contribution without control. This isolates the variable of causal proximity while holding agency constant at zero. Second, I will map the verdicts. The agentialist says A has a personal reason for guilt-regret; B does not. Pure anchoring says both have equal reason for outcome-regret. This is the tie I need to break. Third, I will refine anchoring to accommodate the asymmetry. I will argue that causal proximity modulates the *intensity* of fitting regret without invoking practical reasons. A's regret is fittingly sharper because A is the locus of the causation, even if not the locus of agency. This preserves the agentless nature of the rationale while respecting the intuition of asymmetry. The mechanism is not "A should have acted," but "A is connected to the value loss." Fourth, I will test the removal of the feature. If we remove causal contribution, making both mere bystanders, the asymmetry vanishes, confirming the feature's role. If removing control (making it preventable) collapses the view into standard practical reasoning, the boundary is marked. This isolates the distinctive work of agentless rationales. I need to make precise how causal proximity norms attitude without norming action. The key is to show that the rationale anchors the attitude to the world, not the will. If I can show that the attitude is responsive to the rationale directly, not via the agent's powers, the view holds.

  **What the chapter would establish, and what would sink it**

  Successful completion establishes that agentless rationales are a sui generis normative category. It shows that normativity extends beyond the sphere of control, anchoring emotions rather than actions. The chapter would conclude that the inheritance relation is into attitude, specifically regulated by causal proximity rather than agency. This saves the intuition that we have reasons to regret unpreventable evils without conceding to the agentialist demand for control. It validates ordinary normative talk about bad outcomes no one could have prevented. It also clarifies the limits of practical reason. If successful, the chapter shows that normativity is wider than agency.

  What would sink it is if the asymmetry in the "Unwitting Trigger" case cannot be explained without smuggling in agency. If the only way to explain why A's regret is sharper than B's is to say A *could have done otherwise* (even hypothetically) or *should have known*, then anchoring collapses into agentialism. Similarly, if the view cannot distinguish itself from the reductionist's "evaluative facts" without relying on verbal stipulation, the project fails. An honest failure condition is demonstrating that the fittingness conditions for A and B are identical. If intuition demands asymmetry and anchoring demands symmetry, and I cannot bridge them without agency, I must concede the friend's point: there are no agentless reasons, only values. I would have to accept that the appearance of normativity is borrowed. The project fails if I cannot distinguish anchoring from the reductionist view on substantive grounds. If the only difference is that I call values "reasons," the supervisor is right. I need to show the normative work is different.

  **Scope and biggest risk**

  Eight thousand words is tight but sufficient for this narrow focus. It allows for the case construction and the argument against the verbal objection without drifting into general metaethics. The biggest risk is scope creep into the ontology of reasons. I must resist arguing for the existence of agentless rationales generally; I assume them for the sake of the inheritance argument. If I spend too much defending their existence against the reductionist, I will not have space to solve the inheritance problem. The chapter must stay on the bridge, not the banks. I need to keep the focus on the inheritance relation, not the metaphysics.
