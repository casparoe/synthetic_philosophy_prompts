answer: |-
  You have described a phenomenon that is well-documented in the history and sociology of science, though it rarely has a single, stable name because it sits at the intersection of three different disciplines: history (what happened), sociology (how groups cohere), and epistemology (what counts as knowledge).

  Here is the carving you requested: the distinctions, the misfits, the edges, and a term that does the work.

  ### 1. The "Whig History" Misfit
  Your historian friend's suggestion of **Whig History** is the nearest neighbour, but it is a misfit for the specific reason you identified.
  *   **What it explains:** Whig history describes interpreting the past as an inevitable progression toward the present. It explains why your field selects certain figures and ignores others (the "winners" are ancestors; the "losers" are footnotes).
  *   **Where it goes wrong:** Whig history assumes a teleology of *truth*. It presumes the present view is *truer* than the past view, and rewrites history to show the ascent of accuracy. In your case, the field venerates a model known to be *false*. The utility is not truth-tracking; it is identity-tracking.
  *   **Verdict:** Discard "Whig History." It captures the selection bias but misses the functional falsehood.

  ### 2. The Nietzsche Reading Group Disagreement
  Your group is debating whether this fits Nietzsche's **Monumental History**. This is a verbal disagreement rooted in a ambiguity in Nietzsche's text regarding *emulation*.
  *   **Member 1 (It is Monumental):** Is correct about the *form*. The field is using the past to inspire the present ("great work is still possible"). It treats the past as a storehouse of examples to encourage action.
  *   **Member 2 (It is not Monumental):** Is correct about the *content*. Nietzsche's monumental history requires the belief that the greatness of the past can be *repeated* (emulation). In your field, the "founder" is a placeholder. Nobody tries to replicate the founder's specific error; they replicate the *authority* of the founder.
  *   **Resolution:** This is **Monumental Form with Totemic Function**.
      *   In **Monumental History**, the hero is a model for *action* (do as he did).
      *   In your field, the hero is a totem for *belonging* (we are the descendants of him).
      *   The disagreement is verbal because Nietzsche did not anticipate a secular institution using monumental forms for tribal cohesion rather than individual inspiration. The "greatness" being transmitted is not the quality of the work, but the legitimacy of the lineage.

  ### 3. The Established Concepts (and why they fall short)
  There are three existing concepts that map onto parts of your observation. None captures the whole shape, specifically the *drifting identity* of the founder.

  **A. Collective Memory (Maurice Halbwachs)**
  *   **Fit:** Explains how groups reconstruct the past to suit present needs. It explains the "amnesia" (the group forgets it rewrote the story) and the "immunity" (criticism is absorbed because the story serves a social function, not a factual one).
  *   **Misfit:** Halbwachs focuses on social groups (families, nations). He does not account for the *epistemic* tension in science, where the group claims to be objective while maintaining a subjective myth.
  *   **Utility:** Use this to explain the *mechanism of forgetting*.

  **B. Rational Reconstruction (Imre Lakatos)**
  *   **Fit:** Lakatos distinguished between "History" (what actually happened) and "Rational Reconstruction" (how the logic of discovery *should* have looked to make sense of the current theory). Scientists often mistake the Reconstruction for the History.
  *   **Misfit:** Lakatos assumed the Reconstruction was a tool for philosophers to analyze science, not a tool scientists used to deceive themselves. He also assumed the Reconstruction was logically tighter than the history. In your case, the Reconstruction is logically *looser* (it cites wrong papers) but socially *tighter*.
  *   **Utility:** Use this to explain the *citation behavior* (citing the paper for a claim it didn't make).

  **C. The Black Box (Bruno Latour)**
  *   **Fit:** Explains how complex labor is hidden once a fact is established. The "founder" becomes a black box; you press the button (cite the name) and get authority without opening the contents.
  *   **Misfit:** Latour focuses on facts and instruments. He does not fully address the *narrative drift* where the person inside the black box is swapped out over decades.
  *   **Utility:** Use this to explain why the *details* don't matter, only the *slot*.

  ### 4. The Proposed Term: "The Mutable Monument"
  Since no single established term captures the *shifting identity* + *known falsehood* + *functional necessity*, I propose you use **"The Mutable Monument"** (or **"Functional Origin Myth"**).

  **Definition:** A narrative structure within a professional discipline that preserves the *form* of a founding event to ensure disciplinary cohesion, while allowing the *content* (specific agents, models, or claims) to shift over time to accommodate new epistemic realities, without acknowledging the shift.

  **Why this term works:**
  *   **Mutable:** Captures the drifting identity (Theorist $\to$ Experimentalist $\to$ Contemporary).
  *   **Monument:** Captures the veneration and the immunity to criticism.
  *   **Functional:** Captures that it is preserved for *use* (cohesion, funding, identity), not *truth*.

  ### 5. Boundary Cases (The Carving)
  You asked where the edges lie. Here is how to distinguish this phenomenon from its neighbours.

  **A. Deliberate Fabrication vs. Unnoticed Drift**
  *   **Does it matter?** No. Whether a committee deliberately changes the story for funding or the story drifts over coffee, the *structural effect* is identical.
  *   **The Distinction:** This is an *etiological* difference (cause), not a *phenomenological* one (effect). For your purposes, treat them as the same. The "Mutable Monument" functions regardless of intent. If you need to distinguish, call the former **Strategic Myth** and the latter **Drifted Myth**, but both are Mutable Monuments.

  **B. Scale: Discipline vs. Laboratory**
  *   **Does it matter?** No. The mechanism is fractal. A single laboratory's oral tradition can have a Mutable Monument (e.g., "The day the apparatus finally worked," where the details change depending on who is telling it).
  *   **The Boundary:** The phenomenon requires a *succession of generations*. A story that changes within a single cohort is just gossip or confusion. It becomes a Mutable Monument only when the revised version is taught to *newcomers* as the original truth.

  **C. Archival Discovery vs. Internal Revision**
  *   **Your Example:** "Revising a story simply because somebody found the letters in an attic."
  *   **The Distinction:** This is **Historical Correction**, not a Mutable Monument.
  *   **Why:** In Historical Correction, the community acknowledges the change ("We thought X, but the letters show Y"). In the Mutable Monument, the community *does not acknowledge the change* ("It has always been Y").
  *   **The Test:** Ask a senior member: "Did we used to tell it differently?" If they say "No," it is a Mutable Monument. If they say "Yes, but we learned better," it is Historical Correction.

  ### 6. Summary of the Configuration
  You are observing a **Functional Origin Myth** operating via **Collective Memory**.
  *   **It is not Whig History** because it does not track truth.
  *   **It is not Nietzsche's Monumental History** because it does not seek emulation, but legitimation.
  *   **It is not Fraud** because the participants are not lying; they are remembering functionally.
  *   **It is not History** because it denies its own revision.

  The "shape of change" you cannot fit is the **decoupling of the Symbol from the Referent**. The "Founder" is a symbol (the Slot). The "Person" is the referent (the Filler). In normal history, the Symbol is fixed to the Referent. In your field, the Symbol is fixed, but the Referent is swapped to keep the Symbol viable. The field reveres the Slot, not the Person.

  This is why criticism renovates the monument: attacking the Person (the Filler) does not damage the Slot. It merely proves the Slot is robust enough to survive the loss of that specific Filler. The "shinier" monument is the Slot itself, now revealed as independent of the flawed human who temporarily occupied it.

  **Recommendation:** In your reading group, argue that this is **Monumental History degraded into Totemism**. The "greatness" is no longer in the deeds, but in the *continuity of the lineage*. This resolves your colleagues' disagreement: Member 1 sees the Monument; Member 2 sees the lack of Emulation. Both are right, because the Monument has become a Totem.
