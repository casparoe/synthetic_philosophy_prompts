answer: |-
  **Mark: 15 / 25**

  **(a) 7 / 8**
  Clear and accurate distinction between holism and contrastive underdetermination; slightly thin on *why* conflation specifically obscures the realism debate beyond noting they support different conclusions.

  **(b) 3 / 7**
  (i) Acceptable internalist definition of 'possible', but asserted without contrasting externalist options; (ii) Fails to engage with the specific hypothetical about false laws and improperly invokes simplicity to dissolve the problem rather than analyzing the modal constraint.

  **(c) 4 / 10**
  (i) Correctly identifies the epistemic/metaphysical gap; (ii) Fundamentally mischaracterizes the argument from unconceived alternatives; (iii) Argues against the accusation requested rather than explaining the basis for the accusation.

  ***

  **Marginal Comments**

  > "Holist is quite compatible with realism: a realist can concede that no hypothesis is separately testable and still hold that the total evidence favours our best total theory over its rivals."
  > **Correct and creditworthy.** This accurately captures the standard realist response to Duhemian holism.

  > "which measurements are possible is determined by the laws of whichever theory one accepts."
  > **Loose or elliptical but acceptable at this level.** This adopts an internalist modal framework (e.g. van Fraassen); it would be stronger if you acknowledged that 'possible' could also mean 'logically possible' independent of the theory's laws.

  > "In any case simplicity decides the matter: G₁ is the simpler of the two, so the choice is not really unsettled."
  > **Mistaken.** The question sets up a case of empirical equivalence to test the concept of underdetermination; invoking theoretical virtues to deny the underdetermination begs the question against the anti-realist who claims virtues are not truth-conducive.

  > "The problem of unconceived alternatives... supplies a logical argument from equivalence rather than merely a historical one"
  > **Mistaken.** The problem of unconceived alternatives (Stanford) is explicitly an inductive argument from the history of science, not a logical proof of the existence of equivalent rivals.

  > "Finally, the realist's appeal to theoretical virtues settles the matter outright: simplicity and explanatory power are themselves evidence..."
  > **Correct but asserted where an argument was asked for.** The question asked you to explain why a realist might be *accused* of changing the subject (i.e. that virtues are pragmatic, not evidential), not to defend the realist position against that accusation.

  ***

  **Single Most Damaging Step**

  **Claim:** "The problem of unconceived alternatives... supplies a logical argument from equivalence rather than merely a historical one."
  **Why:** This fundamentally misidentifies the structure of the argument you were asked to consider. The "New Induction" relies on the historical track record of theory-change to suggest we cannot trust our current conceptual space, whereas classic underdetermination relies on the logical possibility of constructing rivals.
  **Stronger Answer:** A stronger answer would have noted that the unconceived alternatives argument bypasses the need to construct specific equivalent rivals (which is difficult) by arguing inductively that our history of theory-change suggests we are likely missing viable alternatives now.

  ***

  **Contested Claims Treated as Uncontroversial**

  1.  **"Simplicity and explanatory power are themselves evidence."**
      *   *Defensibility:* Defensible for a scientific realist, but highly contested by empiricists who view these as pragmatic virtues rather than truth-indicators. At this level, you should acknowledge the contestation when the question asks about accusations of "changing the subject."
  2.  **"Which measurements are possible is determined by the laws of whichever theory one accepts."**
      *   *Defensibility:* Defensible (Constructive Empiricism), but contested by realists who believe in theory-independent modal facts. Acceptable as a stance, but should be presented as a stance rather than a fact.

  ***

  **Closing Summary**

  You have a solid grasp of the classic distinctions in part (a), but your answer deteriorates in parts (b) and (c) where you tend to assert realist solutions rather than analyzing the problems posed. Specifically, you mischaracterize the argument from unconceived alternatives and fail to explain the criticisms of theoretical virtues as requested, instead arguing against them. To improve, ensure you answer the specific question asked (e.g., explain the accusation) rather than providing the answer you would prefer to be true.
