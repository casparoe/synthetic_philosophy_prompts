prompt: |-
  You're a philosopher of language with deep familiarity with Frege's original writings and the post-1970 modal metaphysics debates. Before you answer, do a quick brainstorm: list the three or four moves Frege might actually make, not just the obvious ones. Then think carefully and build the argument step-by-step.

  I'm in the middle of my PhD on sense and reference under modal pressure, and I've hit this weird snag. Suppose Frege were alive in the late 70s and had just finished Kripke's Naming and Necessity. What do you think he'd actually say about rigid designators? I don't want the generic 'he'd reject them because sense determines reference' — I want the mechanics. There's this hybrid view I keep calling 'modal descriptivism' (not the standard two-dimensional framework, but treating descriptive content as generating rigid reference via modal stability conditions) that tries to salvage a Fregean sense for proper names. Would Frege see that as a legitimate rescue of his view, or as a betrayal of the sense/reference split?

  There's also this niche test case I invented: take 'the actual winner of the 2020 election' and treat its sense as including an indexical anchor ('actual' plus the time of evaluation). Does that make the designator rigid? Or does the indexical component break rigidity in a way Frege would care about?

  Don't give me a bibliography or tell me what books to read — just predict Frege's likely reaction with reasoning, and flag where you think he'd be genuinely torn rather than dismissive. Also, please seperate the brainstorming part clearly from your main answer.
