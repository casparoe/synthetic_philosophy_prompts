      *   *Aristotle's Solution (Standard Interpretation)::* Statements about future contingents are neither true nor false *yet*. They acquire truth values only when the event happens.
      *   *Relevance to Film:* PreCrime treats future statements as *already true* (arresting before the act). Anderton's avoidance suggests they *weren't* true yet.

