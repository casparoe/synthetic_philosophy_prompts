      *   **Epistemic vs. Ontological:** This is the crux.
          *   PreCrime claims Ontological certainty (it *will* happen).
          *   The film reveals it was actually Epistemic uncertainty masquerading as ontology (we *think* it will happen based on current trajectories).
          *   *Where the film cheats:* It treats the visions as physical recordings of "what happens," but then allows them to be changed. This is a logical contradiction unless we accept the "Branching Time" model.
      *   **The Burgess Suicide:** This is the strongest evidence for Free Will/Contingency. Burgess chooses to die to protect the system. The precogs saw this. Did they see it because he *had* to do it, or because he *would* do it given the chance? The film implies he *could* have chosen otherwise (Anderton offers him a way out), but he chose the suicide. This suggests the vision showed the *likely* outcome, not the *necessary* one.
