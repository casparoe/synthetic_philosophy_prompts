      *   **The Sea Battle in PreCrime:** PreCrime operates on the "Thin Red Line" assumption (the future is fixed/true now). If the vision exists, the murder *will* happen. This is the logical foundation of their authority.
      *   **Anderton's Choice (The Pivot):** When Anderton sees the vision, he gains knowledge of the future. Does this knowledge change the future?
          *   *Determinist View (Friend):* The vision *caused* the attempt. He was always going to see it and almost do it. The "choice" was part of the chain.
          *   *Contingent View (User):* The vision presented a *probability* or a *potential* future, not a fixed one. By seeing it, he altered the conditions.
