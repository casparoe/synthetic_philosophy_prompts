answer: |-
  **Take-Home Final Examination**
  **Course:** Metaphysics and Philosophy of Language (Upper-Level Seminar)
  **Topic:** Vagueness and Collective Intentionality
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1000–1200 words

  **Essay Question**

  Consider the scenario of **Institutional Dissolution**: A university department incrementally loses shared governance structures. First, it loses tenure-review authority; second, curriculum-veto power; third, budget autonomy; and fourth, physical space, until only an informal research network remains.

  Write an essay defending either **Epistemicism** or **Supervaluationism** as the correct account of this scenario. Your response must determine whether there is a precise fact of the matter about the exact point at which the department ceases to exist. You must explain how your chosen view addresses the Sorites series generated by these incremental losses. Crucially, you must evaluate whether treating *department* as a collective-intentionality term rather than a physical aggregate introduces a distinct layer of vagueness. Finally, assess whether Supervaluationism's strategy of admissible precisifications either solves the problem or covertly reintroduces sharp boundaries in this institutional context. Do not summarize the theories; demonstrate their internal mechanics through application.

  ***

  **Model Answer**

  The Institutional Dissolution scenario generates a Sorites paradox because each incremental loss of governance appears insufficient to destroy the department, yet the cumulative result is clearly not a department. Defending Supervaluationism offers the most robust account of this phenomenon, provided we distinguish semantic indecision from ontological indeterminacy and rigorously apply the mechanism of admissible precisifications to collective intentionality.

  The core of the Sorites problem here relies on the tolerance principle: if a entity is a department, removing one governance structure should not change its status. If we accept this premise for every step, we conclude the informal network is still a department, which is absurd. Epistemicism resolves this by asserting there is a sharp boundary where the department ceases to exist, though we cannot know it. Supervaluationism, however, argues there is no such fact of the matter. The failure is not in the world, but in our language. The term "department" is semantically indecisive; it lacks a precise extension. Therefore, there is no ontological indeterminacy—the world is not fuzzy—but rather a gap in semantic definition.

  Applying this to Institutional Dissolution, we must recognize that "department" is not a physical aggregate like a heap of sand, but a product of collective intentionality. This introduces a distinct layer of vagueness. A physical heap depends on particle arrangement; a department depends on the intentional states of faculty and administration regarding governance. These intentional states are themselves vague. When the department loses budget autonomy, do the faculty still intend to constitute a department? Supervaluationism handles this by treating the conditions for collective intentionality as subject to precisification. An admissible precisification might stipulate that "department" requires budget autonomy; another might require only curriculum power.

  Under Supervaluationism, a statement is "supertrue" if it is true on all admissible precisifications, "superfalse" if false on all, and lacking a truth value if it varies. In the early stages of dissolution (losing tenure review), the statement "The department exists" is supertrue across all admissible precisifications. In the final stage (informal network), it is superfalse. However, in the middle stages (losing budget or space), the statement lacks a truth value. This avoids the Sorites conclusion without positing a magical moment where existence vanishes.

  Critics argue this merely relocates the sharp boundary. If there is a set of admissible precisifications, is there not a sharp boundary between admissible and inadmissible ones? This is the problem of higher-order vagueness. If Supervaluationism claims there is no sharp boundary between true and false, but admits a sharp boundary between admissible and inadmissible precisifications, it risks reintroducing the very sharpness it denies. In the institutional context, this manifests as asking: is there a precise fact about whether a precisification requiring budget autonomy is admissible? If yes, higher-order vagueness is ignored. If no, we need precisifications of precisifications, leading to regress. A robust Supervaluationist must admit that the set of admissible precisifications is itself vague, denying a sharp boundary even at the meta-linguistic level. This preserves the claim that no sharp boundaries exist anywhere in the semantic hierarchy.

  Contrast this with Epistemicism. The Epistemicist claims there is a precise fact: perhaps the department ceases to exist exactly when budget autonomy is lost. This avoids higher-order vagueness by accepting sharp boundaries at every level. However, this merely relocates the Sorites paradox rather than solving it. The paradox arises because the tolerance principle seems plausible. Epistemicism forces us to reject tolerance, claiming one specific loss *does* make the difference, despite appearing identical to the others. In the context of collective intentionality, this implies there is a fact about when collective intention ceases, independent of our ability to discern it. This is metaphysically costly. It suggests the social reality of the department exists independently of our conceptual schemes enough to bear sharp boundaries, yet remains epistemically inaccessible.

  Supervaluationism is superior because it aligns with the nature of institutional facts. Institutions exist only insofar as they are recognized and constituted by rules and intentions. Since our recognition and rules are vague, the institution is vague. Epistemicism treats institutional existence as too rigid, akin to physical geometry. Furthermore, Supervaluationism explains why we hesitate to judge the middle cases: not because of ignorance (as Epistemicism claims), but because there is no truth to be known.

  However, Supervaluationism must address the charge that admissible precisifications are covertly ontological. If we select a precisification that requires physical space, are we discovering a fact or making a rule? In Institutional Dissolution, losing physical space is the final step. If a precisification makes space essential, the department dies then. If not, it survives. Supervaluationism clarifies that this choice is semantically regulative, not ontologically creative. We are not changing the world by precisifying; we are sharpening the lens through which we describe it. Thus, Supervaluationism solves the Sorites by denying the bivalence of intermediate claims, accommodates the vagueness of collective intentionality through semantic indecision, and avoids ontological commitment to sharp boundaries, provided it accepts higher-order vagueness regarding admissibility itself.

  ***

  **Marking Scheme**

  **Total Marks: 100**

  **1. Application of Scenario and Sorites Mechanics (20 Marks)**
  *   **A-Level (16–20):** Explicitly maps the four steps of dissolution to the tolerance principle. Demonstrates why the incremental losses generate a Sorites series (individual insufficiency vs. cumulative absurdity).
  *   **B-Level (12–15):** Identifies the Sorites structure but treats the scenario generically. May summarize the steps without linking them to the tolerance principle.
  *   **Characteristic Mistake:** Treating the scenario as a mere illustration rather than the locus of the argument; failing to explain why the tolerance principle is plausible in this context.

  **2. Core Theory Mechanics (Epistemicism vs. Supervaluationism) (30 Marks)**
  *   **A-Level (24–30):** Correctly distinguishes semantic indecision (Supervaluationism) from ontological indeterminacy. Accurately explains supertruth/superfalsehood or the epistemic unknown boundary.
  *   **B-Level (18–23):** Defines the theories correctly but relies on summary descriptions. May struggle to apply the mechanics (e.g., truth-value gaps) to the specific claims in the scenario.
  *   **Characteristic Mistake:** Conflating epistemic ignorance (not knowing the boundary) with metaphysical fuzziness (no boundary exists). Treating Supervaluationist precisification as ontologically creative rather than semantically regulative.

  **3. Integration of Collective Intentionality (20 Marks)**
  *   **A-Level (16–20):** Analyzes how "department" differs from physical aggregates. Argues whether intentional states introduce a distinct layer of vagueness and how the chosen theory handles intentional conditions.
  *   **B-Level (12–15):** Mentions collective intentionality but treats it as identical to physical vagueness. Fails to explore how intentional states affect the precisification or boundary conditions.
  *   **Characteristic Mistake:** Ignoring the collective-intentionality dimension entirely; treating the department as a physical object.

  **4. Critical Evaluation (Higher-Order Vagueness & Boundaries) (30 Marks)**
  *   **A-Level (24–30):** Diagnoses whether higher-order vagueness undermines the claim that sharp boundaries are absent. Assesses whether Epistemicism avoids or merely relocates the paradox. Evaluates if precisifications reintroduce sharp boundaries (admissible vs. inadmissible).
  *   **B-Level (18–23):** Identifies the problem of higher-order vagueness but offers a standard textbook response without applying it to the institutional context. Weak assessment of Epistemicism's relocation of the paradox.
  *   **Characteristic Mistake:** Asserting Supervaluationism eliminates all sharp boundaries without addressing the boundary of admissibility; claiming Epistemicism solves the paradox without addressing the cost of rejecting tolerance.

  **Grade Boundaries**
  *   **A (70–100):** Demonstrates conceptual precision, integrates all four required moves, avoids characteristic mistakes, and argues rather than summarizes.
  *   **B (60–69):** Competent understanding of theories but lacks depth in integration. May commit one characteristic mistake. Argument structure is clear but less rigorous.
  *   **C (50–59):** Significant misunderstandings of theory mechanics or failure to address the specific scenario constraints.
