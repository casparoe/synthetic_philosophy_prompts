answer: |-
  Distinguished colleagues, guests, and friends:

  Welcome to "Agency After Desert." We gather here across disciplines—philosophy, neuroscience, law—united by a question that refuses to remain silent. Usually, opening remarks are designed to soften the ground, to offer pleasantries that smooth over the friction of interdisciplinary debate. Today, I am asked to do the opposite. I am asked to offer a framing that constrains us. We are not here to celebrate human freedom. We are here to acknowledge its limits, and to build upon that acknowledgment rather than beneath it.

  The philosophical spine of this workshop is Galen Strawson's Basic Argument. For those less familiar with the technical literature, the logic is stark. To be truly morally responsible for an action, you must be truly responsible for the way you are—the mental nature that produced the action. But to be responsible for the way you are, you must have chosen to be that way. And to choose to be that way, you must have had a prior nature that prompted that choice. This leads to an infinite regress. No one is the *causa sui*, the cause of oneself. Therefore, ultimate moral responsibility is impossible.

  I ask you to let this argument do work today. Do not treat it as a abstract puzzle to be solved and shelved. Treat it as a structural condition of this room.

  Look around you. We are here because of a chain of causes none of us authored. The philosophers among us did not choose the cognitive architectures that made them sensitive to normative distinctions. The neuroscientists did not choose the genetic predispositions that granted them focus or curiosity. The legal scholars did not choose the historical contingencies that formed the laws they study. Even this invitation was not a product of pure will, but the output of institutional algorithms, funding structures, and professional networks that preceded us. We are assembled not by choice, but by causality.

  Consider a concrete case. Imagine a researcher in this room dedicated to studying impulse control. Perhaps she is driven by a memory of a sibling who struggled with addiction. She feels a deep personal commitment to this work. But she did not choose her sibling. She did not choose the genetic lottery that shaped her sibling's vulnerability, nor the societal structures that defined addiction as a moral failing rather than a medical condition. Her "commitment" is real, but it is not self-authored. It is a ripple in a causal stream that began before her birth. If we grant her ultimate credit for her work, we ignore the causes that made the work possible. If we grant her ultimate blame for any failure in her research, we ignore the constraints that shaped her cognition.

  This is the hard constraint we must accept. There is no retreat into compatibilism that smuggles back in the notion of ultimate desert. We cannot say, "Well, she acted according to her desires, so she is responsible." Strawson's regress cuts deeper. She did not choose her desires.

  So, why are we here? If ultimate blame is impossible, is accountability obsolete? No. But it must change its shape. The law cannot operate on the myth of the uncaused cause. Neuroscience cannot pretend that mapping a decision circuit restores the ghost in the machine. Our task today is to construct practices of accountability that function without the fuel of desert.

  We must ask: How do we regulate behavior when retribution is metaphysically incoherent? How do we design legal systems that prioritize safety, rehabilitation, and social coordination without pretending to punish moral worth? How do we interpret neural data without reducing the human subject to a broken machine, while still acknowledging that the subject is a machine of sorts—one built by history and biology?

  This is where the politics of knowledge enters. If we accept that our intellectual trajectories are determined, we must also accept that our institutions are responsible for shaping those trajectories. We cannot blame the individual researcher for the biases in their data if the funding structures incentivized those biases. We cannot blame the defendant for a lack of impulse control if the environment systematically degraded their neural development. Accountability shifts from the individual soul to the systemic design.

  I warn you: this is uncomfortable. It requires us to abandon the satisfaction of righteous anger. It requires us to abandon the comfort of self-congratulation. There will be moments today when the urge to reclaim free will will be strong. It is easier to believe we are authors than to admit we are conduits. But if we retreat into that comfort, we fail the purpose of this workshop. We are not here to save blame. We are here to redesign it.

  Therefore, I do not offer you a conclusion. I offer an invitation. Treat the papers and discussions today not as discoveries of truth, but as designs for survival. We are architects building a shelter on ground we did not choose. We must ensure the structure holds, not because we deserve safety, but because we are here, together, bound by the same causal laws.

  Let us begin the work of designing responsibility practices that acknowledge our shared lack of ultimate authorship. Let us build a jurisprudence and a science that are honest about the limits of the agent. Thank you.

  ***

  **Reflective Note**

  This speech extends Strawson's Basic Argument, which targets individual moral responsibility, to collective and institutional agency (e.g., funding structures, disciplinary training). Strawson himself does not explicitly argue that institutions lack responsibility in the same metaphysical sense, so this is a conceptual liberty taken to suit the workshop's interdisciplinary scope. Furthermore, the speech assumes the falsity of agent-causal libertarianism without argument. A compelling defense of agent-causal powers—where agents are distinct substances capable of initiating causal chains independent of prior states—or robust empirical evidence for a form of neuroplastic self-authorship that effectively breaks the causal regress (perhaps through recursive self-modification inaccessible to current physics) would necessitate revising the framing from "impossible responsibility" to "constrained responsibility."
