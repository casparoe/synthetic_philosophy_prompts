      *   *Failure:* The grades collapse into each other (no clear distinction), or the case studies turn out to be incommensurable (comparing apples to oranges), or the "inversion" turns out to be a verbal trick with no mechanical substance. I should frame "Failure" as "failure to establish the distinction," not "hypothesis disproven." A disproven hypothesis is a success in science. A failed project is one that doesn't yield a definite answer. *Correction:* In philosophy, if the hypothesis is wrong, that's a result. "Failing" means not completing the analysis or the method proving unworkable. I will frame it as: The project fails if the three grades cannot be rigorously distinguished operationally.

