      *   **Proposed Framework:** Split comprehension into three grades:
          1.  Bare Competence (doing the thing).
          2.  Monitored Competence (knowing you succeeded/failed).
          3.  Portable Competence (redeploying, teaching, debugging).
      *   **Research Question:** Which grades can be built from the one below without smuggling comprehension back in? Where does the inversion break? (Hypothesis: Grade 2 is easy, Grade 3 is the bottleneck).
