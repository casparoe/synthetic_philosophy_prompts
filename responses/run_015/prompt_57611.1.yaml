      *   *Appiah (Honor Code):* Social scripts and identity matter. People care deeply about how they are seen by their peers. Changing the *meaning* of an action (from honorable to shameful) can drive behavior change even without interest shifts. Conversely, if an action is tied to identity, rational argument won't stop it.
      *   *The Challenge:* To prove Appiah isn't just Williams in fancy dress, I need to show honor operating *against* interest or *independently* of intellectual persuasion.

