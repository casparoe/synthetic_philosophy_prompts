      *   *Scenario 1 (Argument Succeeds, Practice Hardens):* A public health campaign proves "The Watch" causes faster dementia and suffering. Everyone agrees intellectually. *But* admitting this means admitting their parents suffered because of *them*. To stop now is to admit past sin. The honor code shifts from "Stewardship" to "Penitence." Continuing the practice becomes a way to bear the cross of their mistake. The social cost of stopping (admitting guilt) outweighs the moral argument.
      *   *Scenario 2 (Argument Fails, Practice Collapses):* The same campaign happens. People reject the data (deny the harm). *However*, a subtle shift in *style* occurs. A few high-status figures start using "Respite Tech" (monitors) framed not as care, but as "Surveillance Superiority." It becomes a new way to show off toughness/tech-savviness. The old way (physical confinement) becomes "old fashioned/inefficient." The honor moves to *efficiency*, not *endurance*. The practice collapses not because it's wrong, but because it's no longer the premier signal of virtue.

