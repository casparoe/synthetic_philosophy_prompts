prompt: |-
  I'm trying to work out whether Appiah's honour mechanism actually explains anything, or whether it's just the Williams-style story in fancy dress — the one where what really moves is interest and circumstance, and the moral arguments turn up afterwards to dress it up. Build me a thought experiment that seperates the two.

  Setting: an invented but wholly realistic practice in a modern country, something a future moral historian would call an atrocity but that everyone there now defends, and where keeping it up is publicly read as a mark of some virtue (loyalty, toughness, independence), so that giving it up is a demotion rather than a relief. Give the honour structure enough detail that the outcomes follow from it instead of being asserted. Then two scenarios, a paragraph each, matched as tightly as you can manage: in the first, the argument campaign is a complete intellectual success — everyone concedes the case against the practice — and it hardens anyway; in the second, nobody's mind is changed about the merits, no new argument appears at all, and the practice collapses. Hold the economic and political interests of the people carrying it out constant across both. That's the whole point: I want the interests explanation to have nothing to grab onto.

  Afterwards, say what does the work in each case, name the specific feature of the honour structure that the successful argument trips over in scenario one, and tell me what happens to the case if you remove that feature. Then give me the best materialist attack on scenario two — what would they say really changed — and whether you can answer it. Finally, tell me where your construction is likeliest to be cheating, i.e. stipulating the collapse rather than generating it out of the honour structure, and what would change your mind about which of the two mechanisms is the more interesting one. American English, please.
reasoning: |-
