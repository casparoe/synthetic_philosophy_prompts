prompt: |-
  ok so i've been thinking about the euthyphro problem but not in the usual 'pick a horn' way. i want the full specifcation for what any adequate theory of moral athority actually has to deliver if it's going to navigate between divine command and independent moral reality without just collapsing one into the other.

  write the desiderata. which cases must it handle? for instance, it should explain why torturing for fun is wrong even if some deity commanded it, but also explain why saying 'god is good' isn't just empty praise. it needs to preserve the distinction between having moral status and being owed obligations of a specific weight -- like the difference between wronging someone and merely failing to help them. it also has to allow for moral knowledge among non-believers without making the divine component redundant, and it should be consistent with the idea that moral requirements have some counterfactual stability -- what philosophers sometimes call normative inertia -- so that morality isn't just a report of whatever will happens to exist.

  flag which pairs of these are genuinely in tension. can a view both preserve divine sovereignty (the will actually makes things obligatory, not just reveals them) and avoid arbitrariness (the will isn't capricious) without smuggling in independent moral standards? and can it do both of those while still allowing for moral progress, where we genuinely discover we're wrong about what's required?

  also include what it should say about supererrogation -- actions that are good but not strictly required -- since that's where command theories usually crack. and briefly score divine command theory, natural law, and a modified response-dependence view against your list, but keep it short since the criteria are the point.

  finally, tell me what would change your mind: which argument or case you'd need to see handled differently for you to think the requirements are wrong or jointly satisfiable after all, and flag where your reasoning is shakiest.
