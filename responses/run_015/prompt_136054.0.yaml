answer: |-
  Here is a complete design for the **Moral Repair Protocol** seminar session. It is structured to maximize friction between institutional mechanics and metaphysical assumptions, forcing the "unsettled" feeling you experienced into the room.

  ---

  # Session Plan: The Moral Repair Protocol
  **Course:** Graduate Seminar in Moral Psychology & Institutional Design
  **Time:** 90 Minutes
  **Participants:** 12 Students (2 Factions of 6)
  **Materials:** Printed Cards (see Appendix), Whiteboard, Markers, Paper for drafting protocols.

  ## I. Setup and Induction (0:00 – 0:10)
  **Facilitator Script:**
  "We are not discussing restorative justice today; we are engineering it. You are design committees for two communities recovering from the same harm: *The Granary Incident*, where 20% of the winter food stores vanished. Trust is broken. Starvation is a risk.

  You are divided into Faction A and Faction B. You will design a **Repair Protocol**. However, you are under strict resource constraints. You cannot use just any moral tool. You must build your institution using only the **Emotional Resources** listed on your Faction Card.

  Furthermore, your community operates under a specific metaphysics of personhood. You do not know what it is yet. Design your protocol based on the emotional tools available. The metaphysics will be revealed later. If your protocol contradicts your metaphysics, the community collapses."

  **Action:**
  1.  Divide class into two groups (6 students each).
  2.  Hand each group a **Faction Resource Card** (Guilt vs. Shame).
  3.  Hand each group a sealed envelope labeled **ONTOL-01** and **ONTOL-02**. Instruct them *not* to open these until Phase 3.
  4.  Present the Harm Scenario on the whiteboard.

  ## II. Phase 1: Institutional Design (0:10 – 0:35)
  **Task:** Design a 3-step Repair Protocol to address The Granary Incident.
  **Constraint:** You must use the vocabulary and mechanisms on your Resource Card. You cannot use mechanisms from the other faction.

  **Faction A Card (Guilt-Structured Resources):**
  *   **Mechanism 1:** Private Moral Accounting (Internal audit of intent).
  *   **Mechanism 2:** Contractual Restitution (Quid-pro-quo repayment).
  *   **Mechanism 3:** Agent-Centered Forgiveness (Victim releases debtor).
  *   *Forbidden:* Public status changes, group rituals, collective blame.

  **Faction B Card (Shame-Structured Resources):**
  *   **Mechanism 1:** Public Recognition of Status Injury (Loss of face/rank).
  *   **Mechanism 2:** Ritual Reintegration (Ceremonial return to the fold).
  *   **Mechanism 3:** Collective Witnessing (The group validates the repair).
  *   *Forbidden:* Private confession, contractual debt, individual exemption.

  **Facilitator Role:** Circulate. If a student says, "We should just make them feel bad," stop them. Ask: "Is that a private ledger entry or a public status change? Check your card." Enforce the structural distinction, not just the emotional label.

  ## III. Phase 2: The Ontological Reveal (0:35 – 0:50)
  **Action:**
  1.  Groups finalize their 3-step protocols.
  2.  Groups open their sealed **Ontological Framework Cards**.

  **The Twist (Distribution Strategy):**
  *   *Option 1 (Coherent):* Faction A gets **Stable Moral Ledger** (Self is continuous, internal, act-based). Faction B gets **Social Position** (Self is relational, external, status-based). *Result: High coherence, low friction.*
  *   *Option 2 (Incoherent - Recommended for Seminar):* **Swap them.**
      *   Faction A (Guilt Tools) gets **Social Position Ontology** (Self is fluid/relational).
      *   Faction B (Shame Tools) gets **Stable Ledger Ontology** (Self is fixed/internal).

  **Task:**
  Read the Ontology Card. Determine if your Protocol is compatible with the nature of the Self in your community.
  *   *Prompt:* "If the Self is merely a social position, can it hold a private moral debt? If the Self is a stable ledger, can public ritual actually change its moral value?"

  ## IV. Phase 3: Cross-Faction Negotiation (0:50 – 1:15)
  **Task:** The two factions must merge into one Community Council. They must agree on a single Repair Protocol to implement immediately.
  **Constraint:** You cannot simply vote. You must resolve the **Ontological-Emotional Dissonance**.

  **Negotiation Rules:**
  1.  **No Compromise on Mechanics:** You cannot mix a "Private Audit" with a "Public Ritual" unless you can explain how they function under a *single* ontology.
  2.  **Speech Acts:** Every proposal must be prefaced with: *"Under the ontology of [X], this mechanism functions to..."*
  3.  **Veto Power:** Either faction can veto a proposal if it violates their revealed Ontology.

  **Payoff Scheme (The "Stability Score"):**
  Write the following on the board. The class wins "Social Stability Points" (SSP) based on the final agreement:
  *   **Internal Coherence (5 SSP):** The final protocol does not contradict the agreed-upon Ontology.
  *   **Mutual Recognizability (5 SSP):** Faction A can explain Faction B's mechanism without calling it "irrational," and vice versa.
  *   **Resolution (5 SSP):** A single protocol is adopted by consensus.
  *   *Penalty:* If negotiation fails, 0 SSP. If they compromise without ontological justification, -5 SSP (System Collapse).

  ## V. Debrief and Philosophical Mapping (1:15 – 1:30)
  **Facilitator Guide:**
  Do not ask "How did that feel?" Ask "Where did the language break?"

  1.  **Map Phase 1 (Design):** "You designed institutions assuming the 'Self' was compatible with your tools. Did you assume a specific ontology without knowing it?" (Highlights: *Implicit Metaphysics*).
  2.  **Map Phase 2 (Reveal):** "When the Ontology contradicted the Tool, what happened? Did the tool become unusable? Or did you try to redefine the Self?" (Highlights: *Structural Determinism*).
  3.  **Map Phase 3 (Negotiation):** "To negotiate, did you have to translate emotions? Is 'Guilt' translatable to a 'Social Position' community, or is it a category error?"
  4.  **Final Question:** "Can a culture choose its dominant moral emotion? Or is that emotion the exhaust fume of a prior commitment to what a Person *is*?"

  ---

  # Appendix: Materials

  ### Ontological Framework Cards (Print and Cut)
  **Card Type 1: The Stable Moral Ledger**
  > "In this community, a Person is a continuous, bounded entity. Actions are inscribed internally. Moral value is a property of the individual soul/conscience. Time is linear; past debts remain until paid. Privacy is the sanctuary of the self."

  **Card Type 2: The Performatively Reconstructed Position**
  > "In this community, a Person is a node in a network. Identity is fluid and dependent on current recognition. Moral value is a property of relationships. Time is cyclical; rituals reset the clock. Privacy is suspicious; secrecy implies disconnection."

  ### Payoff Scorecard (For Whiteboard)
  | Criterion | Points | Condition |
  | :--- | :--- | :--- |
  | **Internal Coherence** | 5 | Protocol matches Ontology. |
  | **Mutual Recognizability** | 5 | Factions understand the *why*, not just the *what*. |
  | **Resolution** | 5 | Consensus reached. |
  | **Ontological Honesty** | -5 | Penalty for hiding the contradiction to "make a deal." |

  ---

  # Facilitator's Forecast: What Will Go Wrong

  You asked for frankness regarding the simulation's limitations and predictable failure points. Here is the risk assessment for your first run.

  ### 1. The Vocabulary/Form Confusion (Predicted Probability: High)
  **The Error:** Students will treat "Guilt" and "Shame" as psychological states ("feeling bad inside" vs. "feeling embarrassed outside") rather than institutional technologies.
  **The Symptom:** Faction A (Guilt) will try to design a public apology. Faction B (Shame) will try to design a private payment. They will argue that "feelings are universal."
  **The Fix:** You must intervene aggressively in Phase 1. If Faction A proposes "They should apologize," ask: "Is the apology to clear a debt (Guilt/Contract) or to restore face (Shame/Status)?" Force them to choose the *function*, not the *word*.

  ### 2. The "Rational Agent" Default (Predicted Probability: Medium)
  **The Error:** Graduate students are trained to be rational negotiators. They will try to "solve" the Ontological Dissonance by creating a hybrid system that logically works, ignoring the metaphysical contradiction.
  **The Symptom:** They will earn the "Resolution" points but fail the "Internal Coherence" points. They will say, "We'll just do both private and public."
  **The Fix:** Enforce the Veto Power in Phase 3. If the Ontology says the Self is *only* a Social Position, a Private Audit is not just difficult; it is *ontologically impossible* (like asking "What color is the number 7?"). You must penalize logical pragmatism that ignores metaphysical constraints.

  ### 3. The Limitation of Strong Constructivism (The Simulation Gap)
  **The Philosophical Limit:** This simulation necessarily fails to reproduce one feature of strong cultural constructivism about emotion: **The inability to see the water you swim in.**
  *   **Why:** By giving students an "Ontological Card," you are allowing them to objectify their metaphysics. You are letting them stand *outside* their culture to look at it.
  *   **The Reality:** In a truly constructivist framework, the students *would not be able to read the card*. Their ontology would be invisible to them; it would be the lens, not the object.
  *   **Supplementation Required:** In the Debrief, you must explicitly state: *"The fact that you could read the Ontology Card and critique it proves you are not actually in that culture. You are modern liberals simulating a different metaphysics. A genuine shame-culture participant would not understand your question about 'private accounting' as a difficulty; they would understand it as nonsense. We cannot simulate nonsense. We can only simulate friction."*

  ### 4. The Emotional Flatness
  **The Error:** The simulation is cognitive. It lacks the visceral threat of actual social exclusion or the weight of actual sin.
  **The Symptom:** Students will treat the "Stability Points" as a game to be won, rather than a proxy for social survival.
  **The Fix:** Raise the stakes in the narrative. Remind them during negotiation: "If you do not agree, the Granary remains locked. Two members of your group (pick randomly) will be assigned 'Starvation Status' for the remainder of the semester (e.g., must stand during next class)." (Use this lightly, but make the consequence tangible).

  ### Summary of the Philosophical Payoff
  If run correctly, the simulation should leave them with the unsettling conclusion you experienced: **We cannot choose guilt or shame as tools.** We can only choose them if we are willing to change what a human being *is*. If we remain committed to the "Stable Moral Ledger" (the liberal individual), "Shame" mechanisms will always feel like abuse. If we commit to "Social Position," "Guilt" mechanisms will always feel like irrelevance. The emotion is not the instrument; the emotion is the shape of the self.
