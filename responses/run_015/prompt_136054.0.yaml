          *   Faction A: Guilt-structured resources (private accounting, contract, agent-centered forgiveness).
          *   Faction B: Shame-structured resources (public status, ritual, collective witnessing).
      *   **Critical Design Feature:** Hidden "Ontological Framework" cards (Self as Stable Moral Ledger vs. Self as Performatively Reconstructed Social Position). Revealed *after* protocol design.
      *   **Goal:** Negotiate coherence between emotional architecture and metaphysics of personhood.
      *   **Requirements:** Explicit negotiation rules, non-monetary payoff scheme (coherence/recognizability), low-tech materials.
      *   **Debrief:** Map phases to the philosophical question (choice of emotion vs. fixed by personhood commitments).
      *   **Prediction:** What will go wrong (confusion between vocabulary and form) and limitations of the simulation regarding strong cultural constructivism.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Guilt* typically aligns with an *individualistic, internalized* sense of self (ledger, conscience, act-based).
      *   *Shame* typically aligns with a *relational, externalized* sense of self (face, reputation, status-based).
      *   *The Twist:* The Hidden Cards might mismatch the Emotional Resources.
          *   Scenario 1 (Coherent): Guilt Resources + Stable Ledger OR Shame Resources + Social Position.
          *   Scenario 2 (Incoherent): Guilt Resources + Social Position OR Shame Resources + Stable Ledger.
      *   *The Point:* Can you run a "Guilt" system on a "Social Position" ontology? Can you run a "Shame" system on a "Stable Ledger" ontology? The simulation forces students to feel the friction.

  3.  **Drafting the Session Plan (90 Minutes):**
      *   *Intro (10 min):* Set the stage, divide groups, distribute materials.
      *   *Phase 1: Protocol Design (25 min):* Groups build their repair mechanism based *only* on their Emotional Resource card.
      *   *Phase 2: The Reveal & Crisis (15 min):* Reveal Ontological Cards. Groups realize the tension.
      *   *Phase 3: Negotiation (25 min):* Factions meet to agree on a unified community standard.
