answer: |-
  Here is a menu of five distinct claims your partner's proverb could be making, ranked from trivial to radical. Each includes the verdicts you requested and addresses the specific complications you raised. You can read this directly to your partner to test which argument they are actually running.

  ### 1. The Pragmatic Claim ("We have no choice")
  **The Claim:** Local corruption is an environmental hazard like weather or traffic. To operate there, we must adapt to survive, regardless of morality.
  *   **Truth Verdict:** **Platitude.** It is descriptively true that refusing to pay may stop the truck.
  *   **Does it win the round?** **No.** Necessity is not permission. The FCPA exists specifically to forbid doing the "necessary" thing. This claim admits the act is bribery but argues for an exception based on efficiency. That is a policy argument, not a definitional one.

  ### 2. The Sovereignty Claim ("Local law is the only law")
  **The Claim:** American law ends at the border. If the local statute allows the payment (or doesn't enforce the ban), no ethical violation has occurred because the local sovereign defines legality.
  *   **Truth Verdict:** **Substantive but Arguable.** This is a standard international law tension (territoriality vs. nationality principle).
  *   **Does it win the round?** **Only if you ignore the "Expected vs. Endorsed" gap.** As your teacher noted, a practice can be *expected* (officials demand it) without being *legal* (local statutes ban it). If the local law technically bans the bribe (even if unenforced), this claim collapses. Furthermore, the resolution asks if US companies *should* be held to US rules; answering "No, because local law" begs the question.

  ### 3. The Epistemic Claim ("Locals define the meaning")
  **The Claim:** Because locals understand the context, their classification of the payment (as a "gift," "fee," or "tribute") overrides the American classification of "bribe."
  *   **Truth Verdict:** **Substantive but Arguable.** This addresses your **Gift vs. Bribe vs. Clientelism** complication.
  *   **Does it win the round?** **No.** This is where your partner is smuggling **Moral Deference** under cover of **Epistemic Deference**.
      *   *The Trap:* Even if locals call it a "gift" (epistemic), the FCPA asks a functional question: *Did this payment secure a specific favor from an official that impersonal rules should have decided?*
      *   *The Verdict:* If the answer is yes, it is a bribe functionally, regardless of the local label. A clientelist bond of loyalty is still corruption if it bypasses public allocation rules. Deferring on the *name* of the act does not defer on the *nature* of the act.

  ### 4. The Moral Relativist Claim ("Locals define the rightness")
  **The Claim:** Corruption is culturally constructed. If the local population accepts the payment as normal etiquette, it is not morally wrong *there*, so US moral standards are imperialist.
  *   **Truth Verdict:** **Radical.** This addresses your **Expected vs. Endorsed** complication.
  *   **Does it win the round?** **Only if "Rome" is defined as "The Public."**
      *   *The Trap:* In your border crossing example, the clerk and the driver might "accept" the payment, but the *public* (who lose out on safety inspections or fair contracts) likely does not.
      *   *The Verdict:* If "Rome" means the officials taking the cash, this is circular (thieves endorse theft). If "Rome" means the affected citizenry, empirical evidence often shows they hate the corruption. If the locals themselves think the system is rotten, moral relativism offers no shield.

  ### 5. The Harmlessness Claim ("No victim, no foul")
  **The Claim:** Because the payment is small and routine ("grease payment"), it harms no one and merely speeds up inevitable bureaucracy. Therefore, it is not "corruption" in the harmful sense the US cares about.
  *   **Truth Verdict:** **Straightforwardly False.** This addresses your **Who is Rome?** complication.
  *   **Does it win the round?** **No.**
      *   *The Trap:* This assumes the only victim is the payer. It ignores the systemic harm: it entrenches a system where public services are auctioned to the highest bidder rather than allocated by right.
      *   *The Verdict:* Even if the truck driver is willing, the "Rome" that matters includes the competitors who can't pay, or the citizens who rely on the inspection that was bypassed. The harm is systemic, not just transactional.

  ***

  ### Summary for Practice
  Tell your partner: *"When you say 'When in Rome,' I need to know which Rome you mean."*

  1.  If you mean **"We have to do it to move the truck,"** you are making a **Pragmatic** claim. I can concede that but argue US law should punish the necessity to force systemic change.
  2.  If you mean **"Locals call it a gift, so it is one,"** you are making an **Epistemic** claim. I can argue that functional reality (buying a favor) overrides local labels.
  3.  If you mean **"Locals think it's okay,"** you are making a **Moral** claim. I can argue that the *victims* of the corruption (the public) are the true "Romans," and they likely do not think it is okay.

  **The Kill Shot:** If the local population hates the corruption but pays anyway because they are trapped, "When in Rome" becomes "When in Rome, do as the Romans *are forced to do*." That is not a moral defense; it is a description of coercion.
