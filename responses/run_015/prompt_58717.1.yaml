answer: |-
  This is a sharp observation, and you are right to feel that the standard taxonomy (Self-Deception vs. Akrasia) leaves a gap here. As a philosopher of psychology, I see this specific configuration often: it is the space where *epistemic management* serves *motivational protection* without requiring a full-blown doxastic shift.

  You are describing a phenomenon that is **active** (opening the portal, hiding the clock), **epistemic** (managing what is known/attended to), and **non-doxastic** (not requiring belief in the excuse).

  Let's carve this out carefully. I will walk through the nearest neighbors to show why they fail, define the boundaries of your phenomenon, and then offer a term that fits the rigor of a CogSci dissertation.

  ### 1. The Nearest Neighbors (and why they fail)

  To carve a concept, we must know where the boundaries *aren't*.

  **A. Self-Deception (The Doxastic Account)**
  *   **The Fit:** Involves irrationality and motivation.
  *   **The Mismatch:** Standard analytic accounts (e.g., Mele, Pears) require a doxastic commitment. The agent must come to believe $p$ (e.g., "I'll do it tomorrow") despite evidence for $\neg p$.
  *   **Your Case:** Your flatmate *doesn't* believe the excuse. She knows it's flimsy. You know the break isn't deserved. There is no belief change, only **attentional management**.
  *   **Boundary:** If she started genuinely convincing herself the portal was broken, that would be self-deception. Since she knows it works but "can't deal with it now," it is not.

  **B. Akrasia / Weakness of Will**
  *   **The Fit:** Acting against better judgment.
  *   **The Mismatch:** Traditional akrasia is often modeled as a failure of *strength* (the desire for leisure overpowers the judgment to work). It doesn't typically account for the *strategic setup* (hiding the clock). Akrasia is the *result*; your phenomenon is the *mechanism* used to facilitate the result without triggering guilt.
  *   **Boundary:** If you simply stared at the clock, felt the anxiety, and scrolled anyway, that is pure akrasia. If you *hide* the clock to lower the anxiety so you can scroll, that is your phenomenon.

  **C. Strategic Ignorance (Willful Blindness)**
  *   **The Fit:** Actively avoiding information.
  *   **The Mismatch:** In economics and ethics, this is usually interpersonal or moral (e.g., not reading the terms of service, not asking where the meat came from). It is rarely applied to *intrapersonal* motivation where the goal is to maintain a state of **ambiguity** rather than ignorance.
  *   **Boundary:** Strategic ignorance usually aims to avoid *responsibility* (plausible deniability). Your case aims to avoid *psychological friction* (the pain of explicit failure).

  **D. Self-Handicapping**
  *   **The Fit:** Creating obstacles to protect self-esteem.
  *   **The Mismatch:** Self-handicapping (e.g., staying out late before an exam) is about creating an *external excuse for failure* should it happen. Your flatmate isn't setting up an excuse for a failed application; she is avoiding the *attempt* entirely while maintaining the *identity* of an applicant.
  *   **Boundary:** Self-handicapping accepts the performance but rigs the conditions. Your phenomenon avoids the performance while rigging the *awareness* of avoidance.

  ### 2. The Carving: What counts and what doesn't

  To operationalize this for CogSci, we need to isolate the functional components. This phenomenon is not about *what is believed*, but *what is processed*.

  **Core Mechanism:** **Meta-Cognitive Attentional Control.**
  The agent actively manipulates their informational environment to reduce the *salience* of the conflicting intention.

  **The "Half-Belief" State:**
  This is crucial. It is not belief, nor is it ignorance. It is **Suspended Acknowledgement**. The agent keeps the intention "online" (opening the portal) to maintain the self-concept ("I am an applicant"), but keeps it "offline" regarding execution (closing the portal) to avoid the cost.

  **The Functional Goal:**
  **Guilt Mitigation via Ambiguity.**
  The goal is not to succeed (submit), nor to quit (close account). The goal is to remain in the *zone of potentiality* where neither success nor failure is confirmed, thereby avoiding the emotional cost of both (effort vs. shame).

  **Inclusion Criteria (What counts):**
  1.  **Active Epistemic Manipulation:** Hiding the clock, opening the portal but not typing.
  2.  **Lack of Doxastic Commitment:** The agent does not need to believe the excuse is true, only that it is *usable* for the moment.
  3.  **Preservation of Identity:** The behavior maintains the *claim* to the goal (postdoc, degree) without the *commitment* to the action.

  **Exclusion Criteria (What doesn't):**
  1.  **Passive Distraction:** Getting distracted by a noise is not this. Hiding the clock so the noise doesn't matter is.
  2.  **Genuine Belief Change:** If she convinces herself the job market is too bad and quits, that is rationalization/belief update.
  3.  **Explicit Quitting:** Deciding "I won't apply" is honest agency, not this phenomenon.

  ### 3. Terminology Options

  There is no single standard term that captures the *active*, *non-doxastic*, *intrapersonal* nature of this. "Self-Deception" is too strong on belief; "Procrastination" is too behavioral.

  Here are three options, ranging from established to coined:

  **Option A: Motivated Epistemic Avoidance (MEA)**
  *   **Pros:** Precise, descriptive, fits CogSci literature on "Motivated Reasoning." It highlights that the avoidance is of *knowledge/salience* (epistemic) driven by *motivation*.
  *   **Cons:** A bit dry.
  *   **Verdict:** Safe for a dissertation.

  **Option B: Strategic Ambiguity (Intrapersonal)**
  *   **Pros:** Captures the "half-belief" state. You are maintaining ambiguity about whether you are actually trying.
  *   **Cons:** "Strategic Ambiguity" is often used in communication theory (between agents).
  *   **Verdict:** Good, but needs qualification.

  **Option C: Agential Obfuscation (Coined)**
  *   **Pros:** Captures the active nature ("Obfuscation") and the target ("Agency"). You are obscuring your own lack of agency from yourself. It connects to the Sartrean idea of Bad Faith without the metaphysical baggage.
  *   **Cons:** New term requires definition.
  *   **Verdict:** High theoretical payoff.

  ### 4. Recommendation

  For a CogSci PhD, I recommend using **Motivated Epistemic Avoidance (MEA)** as your technical term, but framing it theoretically as a form of **Operational Bad Faith**.

  **Why this carving works for you:**
  It allows you to measure variables that self-deception literature misses. You aren't measuring *belief strength* (do you believe you'll work tomorrow?); you are measuring *attentional cost* (how much effort did it take to hide the clock?) and *ambiguity tolerance* (how long can you keep the portal open without clicking?).

  **Proposed Definition for your work:**
  > **Motivated Epistemic Avoidance:** A self-regulatory strategy wherein an agent actively manipulates their informational environment or attentional focus to reduce the salience of a conflicting intention, thereby enabling inaction without the explicit doxastic commitment of quitting.

  **How it differs from Self-Deception:**
  Self-deception aims to resolve the conflict by changing the *truth value* (convincing oneself the work isn't important). MEA aims to resolve the conflict by changing the *accessibility* (keeping the importance high but the awareness low).

  **How it differs from Akrasia:**
  Akrasia is the *failure* of control. MEA is a *strategy* of control (controlling what you know to allow the failure).

  ### 5. A Philosophical Nuance (The "Flatmate" Factor)

  The irritation your flatmate feels when you offer help is the diagnostic key.
  *   If she were self-deceived, she might welcome help (to prove she can do it).
  *   If she were honestly quitting, she would accept the reality.
  *   Because she is engaging in **MEA**, your help threatens the *ambiguity*. You are forcing the epistemic state back to clarity (either do it or stop), which destroys the protective buffer.

  **Final Thought:**
  If you want a punchier label for the specific *state* she is in (opening the portal but not applying), consider **"Simulated Agency."** She is simulating the actions of an agent to avoid the status of a non-agent. But for the *mechanism* (hiding the clock, finding excuses), stick with **Motivated Epistemic Avoidance**. It carves the joint cleanly between belief and behavior.
