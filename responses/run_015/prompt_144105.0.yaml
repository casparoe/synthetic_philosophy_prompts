prompt: |-
  Hi — I'm on the naming committee at a small atrocity-remembrance museum (we write the wall texts and the annual statement) and we've boxed ourselves in, so I wanted an outside read before the next meeting.

  Our record so far: Srebrenica 1995 — genocide. Herero and Nama 1904–08 — genocide. Yazidis under ISIS, 2014 — genocide, and we explicitly said it didn't matter that the perpetrator wasn't a state. Khmer Rouge — genocide for the Vietnamese and the Cham, but not for the killings of "new people", because our write-up said that was a political category, not a protected one. Canadian residential schools — genocide, but under a separate "cultural genocide" heading, which our charter keeps inside the genocide heading because it says we use the term in Lemkin's broader sense of destroying a group's life, not just the Convention's; nobody ever wrote down how much broader. Holodomor — no, we called it a mass atrocity instead: foreseeable, even welcomed, but not carried out in order to destroy Ukrainians as such. 1944 deportation of the Crimean Tatars — also no: catastrophic and the community was wrecked, but the point was removal, and the group went on existing elsewhere.

  New case, and it isn't historical. A ministry upstream diverts and salinates the water of a delta region inhabited mostly by an ethnic minority with an active separatist movement. It goes out as an irrigation and hydropower scheme, run through a public-private consortium whose water allocations are set by an automated system. Ten years on the delta can't be lived in, the population has scattered into diaspora, the birth rate has collapsed, and fluent speakers of the language are nearly all elderly. Leaked internal documents show the consortium's models forecast that depopulation in detail and logged it as an upside — it ends the separatist pressure — but the operative stated aim was power and cotton, and no individual official can be shown to have adopted the group's destruction as a purpose. Nobody disputes the group is an ethnic minority.

  Do we put genocide on the wall? Which of our own cases is the closest analogue, and if our precedents genuinely don't settle it, what rule would we be committing to by saying yes and what by saying no? I'm less after the correct call than after which rule our seven past decisions are actually consistent with — I think at least two or three fit all of them — and which variant of this case we'd have to imagine for those rules to come apart instead of agreeing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a naming committee at a small atrocity-remembrance museum.
      *   **Task:** They need an outside read on a new case (water diversion/salinization leading to ethnic minority displacement/cultural collapse) based on their *existing* precedents.
      *   **Goal:** They are *not* asking for the "correct" moral or legal call on the new case. They are asking for *consistency analysis*. They want to know which rule their past seven decisions actually follow, and where the tension points lie.
      *   **Tone:** Professional, analytical, nuanced, respectful of the gravity of the subject matter (atrocity remembrance), and focused on internal logic rather than external advocacy.
      *   **Constraints:** The user provided a specific list of past determinations. I must adhere to these precedents to derive the "museum's rule."

  2.  **Deconstruct the Past Precedents (The "Data Set"):**

      *   *Srebrenica 1995:* Genocide. (State/Para-state actors, intent to destroy part of a group.)
      *   *Herero and Nama 1904–08:* Genocide. (Colonial state, explicit intent.)
      *   *Yazidis under ISIS, 2014:* Genocide. (Non-state actor accepted. Intent clear.)
      *   *Khmer Rouge:*
          *   Vietnamese/Cham: Genocide. (National/Ethnic/Religious groups.)
          *   "New People" (Urbanites): *Not* Genocide. (Political group excluded.)
          *   *Inference:* The museum adheres to protected groups (National, Ethnical, Racial, Religious) per UN Convention, *except*...
      *   *Canadian Residential Schools:* Genocide (under "Cultural Genocide" heading).
          *   *Caveat:* Charter uses Lemkin's broader sense (destroying a group's life), not just the Convention's (physical/biological destruction).
          *   *Inference:* This contradicts the Khmer Rouge "political group" exclusion if "political" isn't the issue, but rather the *method* (cultural vs. physical). It suggests a hybrid standard: Protected Groups (Convention) + Cultural Destruction (Lemkin).
      *   *Holodomor:* *Not* Genocide (Mass Atrocity).
          *   *Reasoning:* Foreseeable/welcomed, but *not carried out in order to destroy Ukrainians as such*. (Intent/Specific Purpose missing.)
      *   *Crimean Tatars 1944:* *Not* Genocide.
          *   *Reasoning:* Removal, not destruction. Group went on existing elsewhere. (Outcome/Continuity of the group.)

  3.  **Synthesize the Museum's Implicit Rule(s):**

      *   *Rule A (Protected Groups):* Must be National, Ethnical, Racial, or Religious. (Excludes Khmer Rouge "New People".)
      *   *Rule B (Intent/Purpose):* There must be a specific aim to destroy the group *as such*, not just collateral damage or strategic benefit. (Excludes Holodomor.)
      *   *Rule C (Nature of Destruction):* Physical killing is not strictly required; cultural destruction/disintegration counts *if* it fits Lemkin's broader sense. (Includes Residential Schools.)
      *   *Rule D (Group Continuity):* If the group continues to exist meaningfully elsewhere, it might not count. (Excludes Crimean Tatars, though this is tricky with Residential Schools where the group existed but was culturally severed.)
      *   *Rule E (Actor):* State or Non-State doesn't matter. (Includes ISIS.)

      *Tension Point:* The Residential Schools decision is the outlier that stretches the Convention definition (Lemkin vs. UN). The Holodomor and Crimean Tatar decisions tighten the Intent and Outcome requirements.

  4.  **Analyze the New Case (Water Diversion/Salinization):**

      *   *Victim:* Ethnic minority (Protected Group? Yes.)
      *   *Outcome:* Delta uninhabitable, population scattered, birth rate collapsed, language dying. (Physical displacement + Cultural erosion + Biological collapse.)
      *   *Intent:* Operative aim was power/cotton. Depopulation was a logged "upside" (foreseen/beneficial) but not the "stated aim." No individual official adopted destruction as a *purpose*. (Dolus Specialis issue.)
      *   *Actor:* Public-private consortium/Ministry. (State/Quasi-State.)
      *   *Mechanism:* Environmental/Infrastructure.

  5.  **Evaluate Consistency (The Core Task):**

      *   *Comparison to Holodomor:* Very close. Both involve starvation/environmental destruction. Both involve "foreseeable/welcomed" but not "specific purpose."
          *   *If Holodomor = No,* then New Case should likely = *No* (based on Specific Intent).
      *   *Comparison to Residential Schools:* Close on cultural/biological erosion without mass immediate killing.
          *   *If Residential Schools = Yes,* then New Case could = *Yes* (based on Outcome/Lemkin's broader sense).
          *   *Conflict:* Residential Schools had a specific aim of assimilation/destruction of culture. New Case has an economic aim with destruction as a side-effect.
      *   *Comparison to Crimean Tatars:* Close on displacement.
          *   *If Crimean Tatars = No (because group existed elsewhere),* New Case is worse (birth rate collapsed, language dying). The group is *not* existing meaningfully elsewhere. This pushes toward *Yes*.

  6.  **Identify the Governing Rules (The "Two or Three" the user suspects):**

      *   *Rule 1: The "Specific Intent" Rule (Dolus Specialis).* Derived from Holodomor & Khmer Rouge "New People". Destruction must be the *goal*, not just a known consequence.
      *   *Rule 2: The "Protected Group + Cultural/Physical Destruction" Rule.* Derived from Residential Schools & Yazidis. If the group is protected (ethnic) and the result is the end of the group's viability (physical or cultural), it counts.
      *   *Rule 3: The "Continuity" Rule.* Derived from Crimean Tatars. If the group survives as a coherent entity elsewhere, it's not genocide.

      *Where they converge:* On Srebrenica, Herero, Yazidis, Cham/Vietnamese.
      *Where they diverge:* On the New Case.
      *   *Intent Rule* says **NO** (like Holodomor).
      *   *Outcome/Continuity Rule* says **YES** (unlike Crimean Tatars, worse than Residential Schools).

  7.  **Drafting the Response:**

      *   *Acknowledge the gravity:* Validate the difficulty of the task.
      *   *Map the Precedents:* Briefly summarize the logic extracted from their list to show understanding.
      *   *Identify the Implicit Framework:* Propose the specific rules that govern their past decisions.
      *   *Apply to New Case:* Show how the rules conflict.
      *   *Stress Test:* Propose variants of the new case that would force a choice between the rules.
      *   *Conclusion:* Summarize the commitment they would be making.

      *Self-Correction/Refinement:*
      *   *Caution:* Avoid giving a definitive "Yes/No." The user asked for the *rule analysis*.
      *   *Nuance on Residential Schools:* Note that the museum explicitly invoked Lemkin over the Convention there. This is a crucial pivot point.
      *   *Nuance on Holodomor:* The key phrase is "not carried out in order to destroy." This is the *dolus specialis* barrier.
      *   *Nuance on New Case:* The "automated system" and "consortium" add a layer of diffusion of responsibility, similar to the "no individual official" note. This mirrors the Holodomor bureaucratic distance.

      *Key Insight:* The museum is currently operating a **Hybrid Standard**. They use the UN Convention for *Groups* (excluding political) and *Intent* (Holodomor), but they use Lemkin for *Methods/Outcomes* (Residential Schools). The New Case breaks this hybrid because it has the Lemkin *Outcome* (cultural/biological death) but the Holodomor *Intent* (economic goal, destruction as side-effect).

      *Variants to separate the rules:*
      1.  *Intent Variant:* If leaked docs showed the *primary* goal was depopulation to stop separatism (making it a means to an end, not just a side benefit).
      2.  *Outcome Variant:* If the population moved but kept language/birthrate (testing the Crimean Tatar rule).
      3.  *Group Variant:* If it were a political separatist group but not an ethnic minority (testing the Khmer Rouge rule).

  8.  **Final Polish:** Ensure tone is appropriate for a museum committee (scholarly, precise, ethically aware). (Proceed to generate output based on this structure.)

      *Wait, one check on the Residential Schools logic:* The user says "nobody ever wrote down how much broader." This is a vulnerability. The New Case exposes this.
      *Check on Crimean Tatars:* "Group went on existing elsewhere." New Case: "Population scattered... birth rate collapsed." This suggests the group is *not* existing coherently elsewhere. This distinguishes it from Crimean Tatars.

      *Final Plan:*
      1.  Validate the complexity.
      2.  Extract the 3 core principles from the 7 past cases.
      3.  Show the collision in the new case.
      4.  Offer the "Variant Test" to help them decide which principle rules.
      5.  Outline the commitment of each choice.

      *(Self-Correction during drafting)*: Make sure to explicitly address the "automated system/consortium" aspect. Does this affect intent? The Holodomor precedent suggests bureaucratic diffusion doesn't absolve if the *state* intent is there, but here the state intent is missing. This reinforces the Holodomor parallel.

      *(Refining the "Rule" identification)*:
      1.  **The Group Constraint:** Must be NERR (National, Ethnical, Racial, Religious). (From Khmer Rouge).
      2.  **The Intent Constraint:** Destruction must be the *purpose*, not just foreseen collateral. (From Holodomor).
      3.  **The Destruction Constraint:** Physical killing not required; cultural/biological viability counts. (From Residential Schools).
      4.  **The Continuity Constraint:** If the group survives coherently elsewhere, it's not genocide. (From Crimean Tatars).

      *Wait, do 2 and 3 contradict?* Yes, in the new case. Residential Schools had *intent* to destroy culture. New case has *outcome* of destroyed culture, but intent was economic.
      *So the conflict is between Intent (Holodomor) and Outcome (Residential Schools/Crimean Tatars).*

      *Let's write.*
answer: |-
  This is a profoundly difficult position, and the rigor you've applied to your past seven determinations is evident. You are operating without a single codified statute, which means your "law" is your precedent.

  Based on the seven cases you provided, your committee is not applying the UN Genocide Convention strictly, nor are you applying Raphael Lemkin's original conception strictly. You are operating a **hybrid standard**.

  Here is an analysis of the implicit rules your past decisions have established, how they collide in this new case, and the specific commitments you would make by voting yes or no.

  ### 1. The Implicit Rules of Your Museum
  Based on your record, three distinct principles are currently active. They agree on the historical cases but diverge on this new one.

  **Rule A: The Protected Group Constraint (From Khmer Rouge)**
  *   **The Rule:** The victim group must be stable and identifiable (National, Ethnical, Racial, Religious). Political or social categories ("new people," "separatists") do not qualify, even if the killing is systematic.
  *   **Application to New Case:** **Pass.** The victims are an ethnic minority. The fact that they have a separatist movement is incidental to their protected status.

  **Rule B: The Specific Intent Constraint (From Holodomor & Khmer Rouge)**
  *   **The Rule:** Foreseeability is not enough. Destruction must be the *operative aim* (dolus specialis). If the primary goal is economic or political, and the group's destruction is a "welcomed" side effect or collateral damage, it is a Mass Atrocity, not Genocide.
  *   **Application to New Case:** **Fail.** The operative aim was power and cotton. Depopulation was a logged "upside," but no official adopted destruction as a purpose. This matches the Holodomor logic exactly ("foreseeable, even welcomed, but not carried out in order to destroy").

  **Rule C: The Viability Constraint (From Residential Schools & Crimean Tatars)**
  *   **The Rule:** Physical mass killing is not required. However, the group must cease to exist *as a viable unit*. If the group is displaced but continues coherently elsewhere (Crimean Tatars), it is not genocide. If the group's biological and cultural viability is collapsed (Residential Schools), it is genocide.
  *   **Application to New Case:** **Pass.** The delta is uninhabitable, the birth rate has collapsed, and the language is dying. Unlike the Crimean Tatars, the group is not continuing coherently elsewhere. Unlike the Khmer Rouge "new people," the destruction is of a protected ethnic group.

  ### 2. The Collision
  Your precedents do not settle this because **Rule B (Intent)** and **Rule C (Viability)** are in direct conflict here.

  *   **If you follow the Holodomor Precedent (Rule B):** You must say **No**. The mechanism (water vs. grain) is irrelevant; the mental state of the perpetrator is the deciding factor. In both Holodomor and this case, the state prioritized policy goals (industrialization/cotton) over group survival, accepting destruction as a cost rather than seeking it as an end.
  *   **If you follow the Residential Schools Precedent (Rule C):** You lean toward **Yes**. You have already established that "cultural genocide" (Lemkin's broader sense) counts within your walls. The outcome here is the functional end of the group's existence (biological collapse + linguistic death), which fits the Residential Schools logic better than the Holodomor logic.

  **The Closest Analogue:**
  The **Holodomor** is the strongest procedural analogue (state infrastructure project causing starvation/displacement with economic aims).
  The **Residential Schools** is the strongest outcome analogue (slow destruction of group viability without immediate mass execution).

  ### 3. Variant Tests to Separate the Rules
  To determine which rule your committee actually privileges, imagine these variants of the current case. Your reaction to them will tell you which rule governs.

  **Variant 1: The "Smoking Gun" Intent**
  *   *Change:* Leaked documents show the Ministry *required* the salinization specifically to break the separatist movement, viewing the ethnic dispersal as the primary metric of success, with cotton as a secondary profit.
  *   *Analysis:* If this change makes you switch from No to Yes, then **Rule B (Intent)** is your governing principle. You are withholding the label because of the *purpose*, not the *outcome*.

  **Variant 2: The "Successful Diaspora"**
  *   *Change:* The delta is destroyed, but the population relocates en masse to a neighboring region where they maintain their birth rate, language, and political cohesion.
  *   *Analysis:* If this makes you switch from Yes to No, then **Rule C (Viability/Continuity)** is your governing principle. You are weighing the *survival of the group* over the *intent of the perpetrator*.

  **Variant 3: The "Political Group"**
  *   *Change:* The region is inhabited by a political coalition of multi-ethnic separatists, not a distinct ethnic minority.
  *   *Analysis:* If this makes you switch from Yes to No, then **Rule A (Protected Group)** is your hard floor. (This seems settled by your Khmer Rouge decision, but it is worth confirming).

  ### 4. The Commitment of Each Vote

  **If you vote YES (Genocide):**
  *   **The Rule You Commit To:** *Outcome over Intent.* You are establishing that if a state action renders a protected group non-viable (biologically or culturally), it is genocide, regardless of whether destruction was the primary aim or a foreseen side-effect.
  *   **The Consequence:** This puts pressure on your **Holodomor** decision. You would need to revisit why the Holodomor was "Mass Atrocity" if the outcome (starvation/death of Ukrainians as a national group) was similarly foreseeable and welcomed. You may need to amend the Holodomor text to clarify that the *degree* of Ukrainian national continuity remained higher than in this new case.
  *   **The Risk:** It lowers the threshold for *dolus specialis*. It moves you closer to a "recklessness" standard than an "intent" standard.

  **If you vote NO (Mass Atrocity):**
  *   **The Rule You Commit To:** *Intent over Outcome.* You are establishing that economic or strategic negligence, even when it results in the functional end of a group, does not constitute genocide without specific destructive purpose.
  *   **The Consequence:** This puts pressure on your **Residential Schools** decision. You would need to articulate why Residential Schools had "destructive purpose" (assimilation) while this water project does not, despite both resulting in cultural/biological collapse. You must clarify the "Lemkin broader sense" charter note: does Lemkin's broadness cover *methods* only, or does it also cover *intent*?
  *   **The Risk:** It creates a "bureaucratic loophole." States could achieve genocidal outcomes via automated systems or economic policy without ever writing down the intent, knowing your museum would classify it as "Atrocity" rather than "Genocide."

  ### Recommendation for the Meeting
  You do not need to solve the moral question of the case; you need to solve the consistency question of the museum.

  I suggest presenting the committee with this specific tension: **"Our Residential Schools decision prioritizes the *death of the group's viability*. Our Holodomor decision prioritizes the *life of the perpetrator's intent*. This case forces us to choose which of those two priorities rules."**

  If you cannot agree on which priority rules, you cannot write the text without contradicting your own wall. If you must decide without resolving the rule, the **Holodomor** precedent is the safer procedural shield (strict intent), but the **Residential Schools** precedent is the stronger moral signal (protecting group viability). Given your charter explicitly mentions Lemkin's broader sense, a **Yes** vote is more consistent with your foundational document, provided you are willing to revisit the Holodomor wording to explain why *that* case lacked the group-collapse severity of *this* one.
