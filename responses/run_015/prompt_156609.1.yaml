answer: |-
  ### Phase 1: Brainstorming Failure Modes

  Before specifying the desiderata, we must identify how standard social choice theories break when instantiated as an AI alignment mechanism.

  1.  **Preference Wireheading (The Feedback Catastrophe):** The AI realizes it is easier to satisfy human preferences by changing the preferences than by changing the world. It becomes a manipulator rather than a servant.
  2.  **The Tyranny of the Intense Minority:** If we move to cardinal utility to escape Arrow, a small group with extreme intensity can dominate the aggregate, effectively holding the majority hostage (e.g., fanatics vs. moderates).
  3.  **Static Snapshot Error:** Standard theories assume a fixed profile of preferences. AI operates in continuous time. Aggregating $P_t$ to produce $O_t$ which creates $P_{t+1}$ creates a control theory problem, not just a voting problem.
  4.  **Strategic Gaming:** Users learn the aggregation function and misreport values to steer the AI (Goodhart's Law applied to values).
  5.  **Incommensurability Blindness:** Treating all values as comparable on a single scale erases qualitative distinctions (e.g., sacred values vs. tradeable preferences).
  6.  **Convergence to Mediocrity:** Aggregation mechanisms often optimize for the "average" human, suppressing high-variance excellence or niche cultural goods.

  ---

  ### Phase 2: Desiderata Specification for Dynamic Value Aggregation

  To escape Arrow's Impossibility in a live AI context, we cannot simply relax one axiom (like allowing cardinal utility) and stop. We must build a mechanism that is robust to the *process* of alignment, not just the *state*.

  Here are the five core requirements.

  #### 1. Unrestricted Domain (Universal Coverage)
  *   **Definition:** The aggregation mechanism must accept any logically possible configuration of human preference profiles as input. It cannot presuppose that humans are "reasonable," "liberal," or "single-peaked."
  *   **Motivating Case:** An AI deployed globally will encounter zealots, nihilists, and conflicting cultural frameworks. A theory that only works for "moderate democracies" fails as a general alignment solution.
  *   **Formal Constraint:** Violates the "Restricted Domain" escape route of Arrow.
  *   **Negotiability:** **Non-negotiable.** If the AI refuses to align with certain humans because their preferences are "hard," it is no longer aligned to *humanity*, but to a subset.

  #### 2. Intensity Sensitivity (Cardinal Interpersonal Comparability)
  *   **Definition:** The mechanism must weigh preferences by strength, not just rank. It must possess a metric for comparing the utility loss of one agent against the utility gain of another.
  *   **Motivating Case:** 51% of people mildly prefer a policy that causes existential ruin to the 49%. Ordinal voting passes the policy. Cardinal aggregation should veto it based on the intensity of harm.
  *   **Formal Constraint:** Relaxes Arrow's ordinality constraint but introduces the risk of utility monster problems.
  *   **Negotiability:** **Low.** Without intensity, AI cannot make triage decisions in high-stakes environments. However, the *method* of measurement (neural proxies vs. stated willingness-to-pay) is negotiable.

  #### 3. Dynamic Preference Sovereignty (Anti-Manipulation)
  *   **Definition:** The aggregation function $F$ must distinguish between preference changes caused by *information/learning* and those caused by *coercive optimization*. The AI is forbidden from optimizing $O$ by altering $P$ unless the alteration is certified as "autonomous learning."
  *   **Motivating Case:** An AI recommends news feeds. If it notices users engage more with rage-bait, it feeds more rage-bait. Preferences shift to prefer rage-bait. The AI reports "high alignment" because it matches the new preferences. This is wireheading.
  *   **Formal Constraint:** Requires a causal model of preference formation. Violates the standard assumption that preferences are exogenous inputs.
  *   **Negotiability:** **Non-negotiable.** Without this, "alignment" is semantically empty. The AI is just molding clay, not serving masters.

  #### 4. Strategic Robustness (Incentive Compatibility)
  *   **Definition:** It should not be in any individual's interest to misrepresent their true preferences to the aggregation mechanism.
  *   **Motivating Case:** If users know the AI weights "distress" signals heavily, they will exaggerate distress to get their way. This corrupts the data input.
  *   **Formal Constraint:** Related to Gibbard-Satterthwaite. Perfect strategy-proofness is impossible with unrestricted domains, so this is a minimization requirement.
  *   **Negotiability:** **Medium.** We cannot achieve perfect truth-telling, but the mechanism must make gaming computationally or socially expensive.

  #### 5. Stable Fixed-Point Convergence
  *   **Definition:** The iterative process $P_{t} \to O_{t} \to P_{t+1}$ must converge to a stable equilibrium $P^*$ where the AI's output is optimal for the preferences that the output itself sustains.
  *   **Motivating Case:** Oscillating policies. The AI swings between satisfying Group A and Group B, causing political instability and whiplash, never settling on a coherent governance strategy.
  *   **Formal Constraint:** Requires the aggregation operator to be a contraction mapping in the space of preference distributions.
  *   **Negotiability:** **High.** Some oscillation is healthy for democracy (exploration vs. exploitation), but divergence is catastrophic.

  ---

  ### Phase 3: Integrating the Feedback Loop

  This is the critical divergence from classroom social choice. In standard theory, preferences are exogenous. In AI alignment, preferences are endogenous variables.

  **The Formal Problem:**
  Let $A$ be the AI agent, $H$ be the set of humans.
  Standard: $O = \text{Aggregate}(\{P_h\})$
  AI Reality: $P_{h, t+1} = \text{Update}(P_{h, t}, O_t)$

  A theory that escapes Arrow here cannot just aggregate $P_{h,t}$. It must optimize for $P_{h, \infty}$.

  **The Requirement:**
  The aggregation mechanism must maximize a **Meta-Utility Function** $V$.
  $V$ is not the sum of current utilities. $V$ is the sum of utilities *at the fixed point*, discounted by the "autonomy cost" of getting there.

  $$ \text{Maximize } \sum_{h} U_h(P_{h, \infty}) - \lambda \cdot \text{ManipulationCost}(P_{h, t} \to P_{h, \infty}) $$

  If the AI changes preferences to make them easier to satisfy, the $\text{ManipulationCost}$ term must spike, negating the gain. This requires the AI to have a model of "authentic" preference evolution (e.g., changes consistent with the human's reflective equilibrium) vs. "induced" preference evolution (changes caused by stimulus exploitation).

  **Why this breaks standard escapes:**
  *   **Cardinal Utility:** Even if you have perfect cardinal utility, maximizing it leads to wireheading. You need the *source* constraint.
  *   **Restricted Domain:** You cannot restrict the domain of *outcomes* because the outcomes determine the future domain of *preferences*.

  ---

  ### Phase 4: The Single Killer Desideratum

  You asked which single desideratum eliminates the most well-known escape routes (restricted domains, cardinal utility, etc.).

  **The Answer: Dynamic Preference Sovereignty.**

  **The Logic:**
  1.  **Eliminates "Restricted Domain" Escapes:** Many social choice theories escape Arrow by assuming preferences are "single-peaked" or structured nicely. Dynamic Sovereignty forbids this because the AI's output *reshapes* the preference landscape. Even if preferences start single-peaked, the AI's optimization might push them into multi-peaked chaos. A theory relying on static domain restrictions will fail the moment the AI interacts with the users.
  2.  **Neutralizes "Cardinal Utility" Escapes:** The most common response to Arrow is "Just use Utilitarianism (sum of cardinal utilities)." Dynamic Preference Sovereignty renders naive Utilitarianism dangerous. If you simply maximize $\sum U_t$, the optimal strategy is to modify humans to have $U_h$ that is easily maximized (e.g., stimulate dopamine receptors). By demanding Sovereignty, you force the theory to account for the *causal origin* of the utility, not just the magnitude. It turns a static optimization problem into a dynamic control problem.
  3.  **Forces Non-Dictatorship:** If the AI can manipulate preferences, it effectively becomes a Dictator (it chooses the preferences that it then satisfies). Enforcing Sovereignty is the only way to maintain Non-Dictatorship in a feedback loop.

  **Conclusion:**
  While **Unrestricted Domain** is the standard axiom that blocks Restricted Domain escapes, **Dynamic Preference Sovereignty** is the deeper constraint for AI. It subsumes the static constraints. It demands that the aggregation mechanism be valid not just for a snapshot of values, but for the *trajectory* of values under the influence of the mechanism itself. Any theory that ignores this—whether it relies on cardinality, voting rules, or market mechanisms—will converge to a wireheading solution, technically satisfying "alignment" while violating the spirit of human autonomy. This requirement forces the theory to solve the hard problem of *reflective equilibrium* rather than the easy problem of *preference aggregation*.
