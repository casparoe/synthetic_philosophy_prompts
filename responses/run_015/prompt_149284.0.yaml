          4.  What is the role of *syādvāda* (the doctrine of "maybe"/conditioned predication)? Is it a meta-tag or does it weaken logical force?
          5.  Does this save *anekāntavāda* from collapsing into relativism?

  2.  **Initial Analysis & Philosophical Mapping:**

