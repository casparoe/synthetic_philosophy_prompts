          *   *Resolution:* We don't drop bivalence; we index truth values. $P$ is true relative to $N_1$, false relative to $N_2$. This is *contextual bivalence*, not fuzzy logic.
          *   *Crucial Point:* Jain logic isn't paraconsistent in the sense that $A \land \neg A$ is true *simultaneously in the same sense*. It's true in *different senses*.
      *   **3. The Role of Syādvāda (The Meta-Tag vs. Weakening):**
