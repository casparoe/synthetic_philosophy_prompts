      *   *Naya* is a partial standpoint. It's not false, but incomplete.
      *   *Syādvāda* (Saptabhaṅgī) is the logical expression of *anekāntavāda*. It uses the qualifier *syāt* ("in some sense," "from a certain perspective").
      *   *Kuhnian Paradigms:* Kuhn argues that during a revolution, scientists live in "different worlds." Communication is partial. There is no neutral observation language.
      *   *The Tension:* If Paradigm A says "X is true" and Paradigm B says "X is false," classical logic screams contradiction. *Anekāntavāda* says both can be valid *conditionally*.
      *   *Relativism Trap:* If *every* claim is just "true for me," then no claim has normative force. Jainism avoids this by positing an ultimate reality (Kevala Jnana) that encompasses all *nayas*, even if humans can't fully grasp it.

