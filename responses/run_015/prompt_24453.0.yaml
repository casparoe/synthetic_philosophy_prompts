      This project asks whether Nāgārjuna's refutation of the tetralemma's fourth corner commits him to a positive ontological thesis (a "middle way" state of emptiness) or a thesis-free silence. Crucially, it investigates whether this distinction turns on reading the tetralemma as a formal logical reductio or as a pragmatic soteriological device. Finally, it asks whether the doctrine of two truths is derivable from this argumentative structure or must be presupposed to prevent the argument from collapsing into nihilism.

