      My approach contrasts with standard analytic reconstructions that impose classical logic onto the text, as well as traditionalist readings that rely on later commentarial authority to resolve ambiguities. Instead, I will test the internal coherence of the text by treating the logical-versus-pragmatic distinction as a variable. I will analyze whether the text sustains a purely pragmatic reading without importing the two-truths doctrine as an external presupposition. This isolates the dependency relationship: is the two-truths doctrine the solution to the tetralemma's paradox, or is it merely asserted alongside it?

