          *   *Verdict:* The user is right. ToC is too blunt. It blames the "greedy fisher" rather than the "compromised regulator."

      *   **Section 5: Reverse Analysis (Verdict on the Framework):**
          *   *Confirm/Anomaly/Silent?* It's an anomaly for the *standard* ToC model (which assumes open access). It fits a *modified* ToC where the "sovereign" acts as a super-herder maximizing political capital rather than biological sustainability.
