              *   *Under-provided Good 1:* Accurate Stock Assessment (Information). Why? Politically inconvenient.
              *   *Under-provided Good 2:* Enforcement/Monitoring.
              *   *Under-provided Good 3:* Long-term Stewardship (Intergenerational equity).
              *   *Who failed?* The Electorate (demanded jobs), The Federal Govt (prioritized short-term stability), The Department (failed independence).

      *   **Section 4: Testing the User's Hypothesis ("Race under Regulator"):**
          *   *Hypothesis:* It's a political race, not a commons tragedy.
