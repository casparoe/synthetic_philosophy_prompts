          *   Fish stocks are non-linear. Recruitment overfishing. Depensation (Allee effect).
          *   *Diagnosis:* It changes the *nature* of the error, not just the speed. In a pasture, you see the grass getting short. In a fishery, CPUE (Catch Per Unit Effort) can remain high even as biomass collapses (hyperstability). The feedback loop is broken. This isn't just "faster ruin"; it's "blind ruin." The threshold effect means the "tragedy" is irreversible (or hysteresis), whereas a pasture recovers if animals are removed.

      *   **Section 3: What the Framework Misses (Political Economy & Public Goods):**
          *   *Ownership:* The state owned it. So why the tragedy? Because the state had conflicting mandates (Conservation vs. Regional Development).
