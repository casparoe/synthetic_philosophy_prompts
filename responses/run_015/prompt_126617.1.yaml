          *   *Rival Good:* The spawning biomass (specifically the reproductive capacity).
          *   *Exclusion Structure:* Post-1977, it was *State Property* formally, but *Open Access* effectively within the national fleet due to licensing policies. It wasn't a "commons" in the Ostrom sense (community rules), nor pure Hardin (no owner). It was "Regulated Open Access."
          *   *Skipper in 1985:* Options: Fish hard, invest in tech, or leave. Payoffs: High immediate cash flow vs. uncertain future. Option value of leaving fish: Near zero for the individual because if *they* don't take it, *another boat* will (derby fishing). Even with TACs, the race to fish prevailed until Individual Transferable Quotas (ITQs) came much later.

      *   **Section 2: Dynamical Structure (Stock vs. Flow):**
