      *   **Addressing Culture (Step 4):** If culture is reconstructive, is there a replicator? Maybe not "memes" as discrete particles, but lineages of information can still exist if fidelity is above the threshold.
      *   **Addressing Quasispecies (Step 7):** The fidelity measured in diffusion chains is *phenotypic* fidelity. Viral fidelity is *genotypic*. Viruses have short genomes. Cultural "genomes" (memory traces) might be more stable than output suggests, or selection acts on shorter modules.
      *   **Costs:**
          *   *Rejecting (3):* You admit memes *could* exist if fidelity is high enough. You lose the "gotcha" against the colleague.
