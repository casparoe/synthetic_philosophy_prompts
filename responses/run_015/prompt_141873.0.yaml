answer: |-
  This is a sophisticated argument that effectively captures the tension between "Memetics" (Dawkins/Blackmore) and the "Epidemiology of Representations" (Sperber/Morin). Your suspicion is well-founded: the argument turns on an equivocation between **physical copying** (templating) and **heredity** (statistical correlation of information).

  To preserve biological Darwinism (rejecting 6) while acknowledging the reconstructive nature of culture (keeping 2), you must reject the inference in **Step (3)**, supported by a correction to the analogy in **Step (5)**.

  Here is the diagnosis of where the argument breaks, the cost of fixing it, and how it resolves the quasispecies puzzle.

  ### 1. The Core Error: Step (3)
  **The Claim:** "If what passes between people is a reconstruction rather than a copy, then the resemblance... is not descent with modification."

  **The Diagnosis:** This is the false step. It defines "descent with modification" too narrowly as *physical templating* rather than *causal correlation*.
  In evolutionary theory, heredity is a statistical relation: $Cov(Parent, Offspring) > 0$ for the traits affecting fitness. It does not require the physical mechanism to be a stamp or a photocopier. It requires that the variation in the source causally influences the variation in the recipient with sufficient fidelity to maintain lineages.

  **Why it fails:**
  *   **Biological Counter-example:** Even in DNA replication, the daughter strand is a "reconstruction." Enzymes read the template and assemble new nucleotides from the soup. It is not a physical splitting of the old strand into two (that would be conservative replication, which doesn't happen). It is a templated reconstruction.
  *   **Cultural Implication:** If I tell you a story, and you reconstruct it in your head, and then tell it to a third person, a lineage exists *if* the specific variations I introduced are preserved in your reconstruction and passed on. If the reconstruction function is biased (as you note in 2), it reduces fidelity, but it does not logically eliminate heredity unless the fidelity drops below the error threshold (which brings us to Step 7).

  **Cost of Rejecting (3):**
  You must concede that **reconstruction is compatible with replication.** You lose the argument that memes *cannot* be replicators simply because transmission is reconstructive. You are forced to argue about *degrees of fidelity* rather than *kinds of mechanism*. This weakens your "needle" against your colleague, as you can no longer rule out memes on principled grounds, only on empirical ones (i.e., "is the fidelity high enough?").

  ### 2. The False Analogy: Step (5)
  **The Claim:** "An organism is not a copy of its genome either... 'the same' trait in parent and offspring is identified retrospectively by similarity of phenotype."

  **The Diagnosis:** This step conflates the **Replicator** (gene) with the **Interactor** (organism/phenotype).
  Standard Darwinism (and the view you held for 30 years) posits that genes are the replicators and organisms are the vehicles.
  *   **Genes:** Are physically copied (templated) with high fidelity.
  *   **Organisms:** Are *not* copied; they are developed.
  *   **Your Argument:** You are treating the *organism/phenotype* as the unit of heredity in the biological case to make it look like the cultural case. You argue that because phenotypes are reconstructed (development), genes aren't true replicators.

  **Why it fails:**
  Selection acts on phenotypes, but heredity resides in genotypes. The reason Step (6) is unacceptable to you is that Step (5) misdescribes biology. In biology, we *do* have physical copying of the information carrier (DNA). In culture, we arguably *do not* have a distinct, physically copied information carrier separate from the reconstructed representation.

  **Cost of Rejecting (5):**
  You preserve the validity of biological natural selection (saving Step 1 and rejecting 6). However, you admit a **disanalogy between biology and culture.**
  *   **Biology:** Two-tier system (Copied Genotype -> Reconstructed Phenotype).
  *   **Culture:** One-tier system (Reconstructed Representation -> Reconstructed Representation).
  This supports your colleague's worry: if culture lacks a distinct, copied genotype, "memes" are a metaphor, not a mechanistic reality. However, it allows for "lineages" without "replicators" in the strict genetic sense.

  ### 3. Resolving the Quasispecies Puzzle: Step (7)
  **The Claim:** Cultural fidelity is lower than RNA viruses, yet viruses evolve. Therefore, fidelity numbers aren't doing the work.

  **The Diagnosis:** You are comparing **Phenotypic Fidelity** (culture) with **Genotypic Fidelity** (viruses).
  *   **Diffusion Chains:** Measure how much the *output* (the story told, the tool made) changes. This is phenotypic fidelity.
  *   **Quasispecies Theory:** Applies to the *sequence* (the RNA). This is genotypic fidelity.
  *   **The Mismatch:** In biology, phenotypic fidelity is often much lower than genotypic fidelity due to developmental buffering (canalization). A mutation in DNA might not change the phenotype at all. In your diffusion chains, you are measuring the "phenotype" directly.
  *   **The Length Factor:** The error threshold depends on genome length ($L$) and error rate ($\mu$). Selection holds if $L \times \mu < \ln(\sigma)$ (where $\sigma$ is selective advantage). RNA viruses have tiny genomes (~10kb). If a "cultural genome" (the memory trace of a story) is effectively short, or if selection acts on modular chunks (short $L$), it can survive higher $\mu$.

  **Cost of Accepting this Resolution:**
  You must acknowledge that the "low fidelity" observed in diffusion chains might not be fatal to cultural evolution if:
  1.  The underlying "cultural genotype" (neural trace) is more stable than the output suggests.
  2.  Cultural evolution works on short modules (like viral genes) rather than long integrated wholes.
  3.  **Crucially:** You admit that "attractors" (Step 4) act like **developmental bias**. They increase the *effective* fidelity by funneling reconstruction errors back to the stable type. This makes the "attractor" view and the "meme" view compatible: memes are the lineages, attractors are the developmental channels that stabilize them.

  ### Summary of Recommendations

  **Which step to reject?**
  Reject **Step (3)**.
  *   **Reasoning:** Descent with modification is defined by causal correlation of information, not physical identity of the medium. Reconstruction can sustain heredity if the reconstruction function is stable.
  *   **Support:** Correct **Step (5)** to acknowledge that in biology, the *genotype* is copied, even if the *phenotype* is developed.

  **What does this cost you?**
  1.  **Against your Colleague:** You cannot claim memes are *impossible* because transmission is reconstructive. You must argue they are *empirically rare* or *different* from genes because they lack a separate, protected genotype.
  2.  **For your Biology:** You save natural selection from the "developmental reductionism" of Step (6). You maintain that genes are replicators because they are templated, distinct from the developed phenotype.
  3.  **For your Theory of Culture:** You move toward a **Dual Inheritance** or **Cultural Attractor** position. You can agree that "attractors" explain the stability (the developmental bias), but admit that if the fidelity is high enough, you can still model the population dynamics using Darwinian equations (selection on variants). The "meme" becomes a useful modeling abstraction rather than a physical entity.

  **The Precise Distinction You Suspected:**
  You suspected a slide between "the item is not copied" and "the item is not heritable."
  *   **Correction:** "Copying" is a mechanism (templating). "Heredity" is a statistical outcome (correlation).
  *   **Biology:** Has both Copying and Heredity.
  *   **Culture:** Has Heredity (via stable reconstruction) but lacks Copying (in the physical sense).
  *   **Conclusion:** Darwinian *explanations* (Step 1) require Heredity, not necessarily Copying. Therefore, culture can be Darwinian without memes being "replicators" in the strict biological sense. Your colleague wants to call them replicators because they function similarly in the equations; you want to deny it because the mechanism differs. You are both partially right, but Step (3) falsely makes the mechanism a prerequisite for the explanation.

  **Final Verdict:**
  Keep (1) and (2). Reject (3). Amend (5).
  This allows you to tell your colleague: *"Transmission is reconstructive, not templated, so memes aren't genes. But reconstruction can still sustain lineages if attractors provide enough stability. So selection models work, but 'replicator' is a metaphor for the lineage, not the mechanism."* This preserves your biological rigor while conceding the utility of the Darwinian approach to culture.
