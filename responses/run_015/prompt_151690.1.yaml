      *   *Better:* Give them a symptom and ask which category it belongs to. "Monument building stops, but pottery styles continue."
      *   *Best:* "If the tax collectors stop coming but the villages keep trading, is that decoupling or drift?"

  7.  **Addressing the Spelling/Grammar Note:**
      *   The user mentioned their own spelling quirks ("seperate", "principle/principal"). I should acknowledge this gently without making a big deal, perhaps in the tone or a small note. *Self-correction:* The prompt asks me to plan the arc, but also answers the "Maya/Mayan" question. I will answer the language question directly at the end. I won't correct their spelling in the output unless it impedes understanding (it doesn't), but I will model correct usage in my response.

