  2.  **Deconstruct the Core Concepts:**
      *   *Structural Decoupling:* Institutions/coordination fail, people remain. (e.g., Rome's bureaucracy vanishes, but peasants stay).
      *   *Demographic Drift:* Population shrinks/disperses, social form survives/adapts. (e.g., Migration, gradual abandonment without total cultural erasure).
      *   *Misconception:* Collapse = Sudden, catastrophic, total extinction (Reactor meltdown analogy).
      *   *Target Audience:* Scientists. They like models, variables, and clear definitions. They might be prone to determinism or data-heavy explanations (hence the cliometrics temptation).

  3.  **Drafting the Teaching Arc (Dependency Structure):**

      *   *Prerequisite Concept:* Before they can understand *how* a society changes (decoupling vs. drift), they need to agree on *what* a society is. If they think "society = government," decoupling looks like extinction. If they think "society = people + culture," it looks like transformation.
      *   *Addressing the Misconception:* This needs to happen early. If they start with the "meltdown" model, they'll force-fit the new concepts into the old box. It needs to be the "unlearning" phase before the "new learning."
      *   *The Carrying Case:* The user suggested Bronze Age, Maya, Easter Island.
