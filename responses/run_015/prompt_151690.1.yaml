answer: |-
  This is a fantastic framework. Your audience's science background is a huge asset here; they understand systems, variables, and the danger of conflating correlation with causation. They will appreciate a clean model over a moralistic narrative.

  Here is the teaching arc designed for that specific dependency structure.

  ### 1. The Prerequisite Concept: "The Unit of Survival"
  **What must land first:** Before you can distinguish between *structural decoupling* and *demographic drift*, the group must agree on **what constitutes the "system" we are tracking.**

  Most people intuitively equate "Society" with "The State" (kings, taxes, monuments). If they hold this definition, *any* end of a dynasty looks like total collapse.
  *   **The Physics Analogy:** Ask them to distinguish between the *cooling system* of a reactor and the *fuel rods*. If the cooling system fails (institutions), does the fuel (people/culture) necessarily vanish?
  *   **The Lesson:** You must establish that "Society" is a composite variable. It has an **institutional component** (coordination, hierarchy, trade networks) and a **demographic/cultural component** (population density, kinship, language, subsistence).
  *   **Why:** Without this separation, "decoupling" just looks like "partial collapse," and "drift" looks like "slow collapse." They need to see them as orthogonal variables, not points on the same scale.

  ### 2. Addressing the Misconception: The "Phase Transition" Trap
  **Where to head it off:** Immediately after defining the variables, but *before* introducing your specific terms.
  *   **The Misconception:** Your retirees will default to a "phase transition" model (water to ice, bridge to rubble). They expect collapse to be non-linear, sudden, and total.
  *   **The Intervention:** Use their background. Ask them to model a system that degrades via **entropy** rather than **catastrophe**.
  *   **The Pivot:** Show them that what looks like a "meltdown" from the perspective of the elite (the control room) often looks like "normal operation" from the perspective of the periphery (the grid).
  *   **Timing:** Do this in the first 15 minutes. If you let them discuss the Bronze Age first, they will reinforce the catastrophe model among themselves, and you'll spend the rest of the session undoing it.

  ### 3. The Carrying Case: The Classic Maya (Not the Bronze Age)
  **The Case:** The "collapse" of the Classic Maya (Southern Lowlands, c. 800–950 CE).
  **Why this carries the lesson:**
  *   **Clear Decoupling:** The divine kingship, the monument carving (stelae), and the complex water management systems in cities like Tikal stopped. The *structure* undeniably failed.
  *   **Clear Continuity:** The people did not vanish. They moved north to the Yucatán (where civilization flourished for centuries more) or stayed in the hinterlands. The language and kinship structures survived.
  *   **Why NOT the Bronze Age:**
      1.  **Complexity Overload:** The Late Bronze Age Collapse involves at least six distinct major civilizations (Hittites, Egyptians, Mycenaeans, etc.) interacting. It is a "systems of systems" failure. It is too noisy for a first lesson on your specific distinction.
      2.  **The "Dark Age" Problem:** The Bronze Age is followed by a Greek Dark Age where literacy was *actually* lost. This reinforces the "meltdown" narrative you are trying to complicate. It makes it harder to argue for continuity.
      3.  **Data Scarcity:** We have less granular demographic data for the Bronze Age than for the Maya. Your science audience will itch for better data. The Maya have settlement patterns that show population shifts rather than simple extinction.

  ### 4. What to Openly Refuse: Cliometrics
  **The Refusal:** Do not attempt to explain **cliometrics** (quantitative historical analysis).
  **Why:**
  *   **False Precision:** It tempts scientists to think there is a "number" for collapse. Your distinction is qualitative/structural, not purely quantitative.
  *   **Distraction:** Discussing data methodologies will suck the oxygen out of the philosophical distinction. You want them thinking about *categories of change*, not regression analyses.
  *   **How to frame it:** Tell them, "We are doing ontology today, not econometrics. We are defining the boxes, not weighing the contents."

  ### 5. The Diagnostic Check-Question
  **The Goal:** To ensure they aren't just memorizing definitions but can apply the lens to *symptoms*.
  **The Question:**
  > "Imagine an archaeological site where, after a certain date, we stop finding imported luxury goods and large public buildings cease to be maintained. However, the local pottery style remains unchanged, and the population density in the surrounding farms stays constant for another 200 years.
  >
  > **Is this Structural Decoupling or Demographic Drift?**"

  **The Correct Answer:** **Structural Decoupling.**
  *   **Why it works:** If they say "Drift," they are focusing on the lack of growth or the loss of trade (confusing economic shrinkage with demographic loss). If they say "Collapse," they are ignoring the population continuity. To get it right, they must identify that the *coordination mechanism* (trade/monuments) broke while the *people* (pottery/farms) persisted.

  ### 6. A Note on Terminology (Maya vs. Mayan)
  Since you asked:
  *   **Maya:** Use this for the people and the civilization (e.g., "The Maya built pyramids," "The Maya collapse").
  *   **Mayan:** Use this strictly for the languages (e.g., "Mayan languages," "Mayan linguistics").
  *   *Tip for your group:* If you stick to "The Maya," you will never be wrong in a general historical context.

  ***

  **Summary of Dependencies:**
  1.  **Define Variables** (State vs. People) $\rightarrow$
  2.  **Break the "Meltdown" Model** (Entropy vs. Catastrophe) $\rightarrow$
  3.  **Introduce Framework** (Decoupling vs. Drift) $\rightarrow$
  4.  **Apply to Case** (Maya) $\rightarrow$
  5.  **Test Application** (The Pottery/Farm Question).

  *(And don't worry about "seperate" or "principle"—in a spoken discussion group, those ghosts don't exist. Your concepts are clear enough that the typos won't distract your group.)*
