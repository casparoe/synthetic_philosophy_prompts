      *   *Step 6: Boundaries.* What to exclude (Cliometrics).

  5.  **Refining the "Why Not Bronze Age" argument:**
      *   The Bronze Age Collapse is a "systems of systems" failure. Trade, writing, metallurgy, multiple empires. It's too messy for a first pass. It looks *too much* like a meltdown, making it hard to argue for "transformation." The Maya allows for a cleaner separation of "Elite Centers" (Decoupling) vs. "Rural Population" (Drift/Continuity).

