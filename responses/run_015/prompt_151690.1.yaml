          *   *Easter Island:* Too mythologized (ecocide narrative), often disputed now.
          *   *Maya:* Good candidate. Classic "collapse" narrative vs. reality (people still there, culture shifted north).
          *   *Better Candidate?* The Western Roman Empire is the classic go-to, but maybe too cliché. The Maya is actually strong because the "collapse" was specifically elite/structural, while the population persisted. Let's stick with the Maya but refine *why*. Actually, the prompt asks specifically why *not* the Bronze Age. I need to answer that.
          *   *Decision:* The Maya is the best carrying case because the "collapse" is geographically specific (Southern Lowlands) while the culture continued (Northern Yucatán). It clearly separates "elite structure" from "people."
      *   *Cliometrics:* Definitely cut. It's quantitative history. Too technical, distracts from the philosophical distinction.
      *   *Check Question:* Needs to force them to apply the distinction to a new scenario, not just define the terms.
