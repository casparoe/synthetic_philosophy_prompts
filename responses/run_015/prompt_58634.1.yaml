prompt: |-
  I chair a university examinations panel that adjudicates requests for cognitive accommodations, roughly thirty to forty cases per term. The stakes are significant: we must preserve fairness across closed-book assessments while avoiding discrimination against students whose effective memory and reasoning depend on external resources. Administrators who will first apply any framework have no training in philosophy, have about twenty minutes per case, and must produce a documented rationale for my final sign-off.

  Please develop a reusable decision procedure grounded in the extended mind thesis for determining when an external resource should be treated as constitutive of a student's cognitive process rather than as a mere aid or potential source of unfair advantage. The procedure should translate the central philosophical distinctions into terms a non-specialist can apply, including the parity consideration that an external process that plays the functional role we would count as cognitive if performed in the head should presumptively count as cognitive, the further conditions often discussed concerning stable availability, typical reliance, automatic endorsement without routine critical vetting, and ready accessibility, the concern that mere causal coupling is not constitution, and the distinction between an external resource that replaces an internal capacity and one that complements it by doing something different.

  Deliver the framework as an ordered checklist or flowchart in words, with the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure terminates in a denial, where it terminates in a grant, and where it requires escalation to individual judgment because the issue turns on values or underdetermined concepts rather than observable facts. Mark explicitly which steps involve unavoidable judgment calls and which distinctions from the philosophical debate you have simplified or set aside to gain usability, with a brief justification for each simplification. Conclude with an honest statement of what the procedure cannot settle and where it is most likely to misfire.

  Then demonstrate the procedure on three cases:

  A second-year biology student with a documented working-memory limitation who has carried the same paper notebook for four years, containing densely cross-referenced diagrams in her own shorthand, consulted reflexively many times per day and relied upon for recall of material she cannot otherwise retain, who requests to bring it into a closed-book examination.

  A first-year law student who relies dozens of times per day on a commercial AI assistant trained on his own notes and accessed by phone, whose summaries he generally acts on after a brief skim but which periodically invents authorities, so that he has learned to verify citations before filing any work, who requests exam access to a locked-down version of the assistant.

  An engineering student without a diagnosed impairment who uses augmented-reality glasses that overlay standard formulae and stepwise prompts authored collaboratively with her study group, used fluently when connectivity permits but unavailable in some campus buildings and routinely double-checked against her own calculations, who requests to wear the glasses in examinations as an accommodation.

  Work through each case stepwise under your procedure to a determinate recommendation, even where the recommendation will be unwelcome to the panel, for example by requiring us to permit something we would prefer to ban or to deny something we would prefer to allow, and explain why the unwelcome result follows.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a university examinations panel.
      *   **Task:** Develop a reusable decision procedure (framework) based on the *Extended Mind Thesis* (EMT) for adjudicating cognitive accommodation requests (external resources in exams).
      *   **Audience:** Administrators (non-philosophers, 20 mins/case, need documented rationale).
      *   **Key Philosophical Concepts to Translate:**
          *   Parity Principle (functional role equivalence).
          *   Conditions for Constitution (stable availability, typical reliance, automatic endorsement, ready accessibility).
          *   Coupling vs. Constitution (causal link isn't enough).
          *   Replacement vs. Complementation (does it do the *same* thing as memory/reasoning or something else?).
      *   **Format:** Ordered checklist/flowchart in words (questions, sufficient answers, termination points, escalation points).
      *   **Meta-Requirements:** Mark judgment calls, explain simplifications/omissions, conclude with limitations/failure modes.
      *   **Application:** Apply to three specific cases (Biology student/notebook, Law student/AI, Engineering student/AR glasses).
      *   **Constraint:** Must reach a determinate recommendation even if unwelcome, explaining *why*.

  2.  **Drafting the Framework (The "Extended Mind Protocol"):**

      *   *Goal:* Make Clark & Chalmers' "Otto and his Notebook" argument operational for bureaucrats.
      *   *Structure:* Needs to be linear but allow for "Escalation" where philosophy gets messy.
      *   *Step 1: Functional Parity (The Core).* Is the external tool doing what internal memory/reasoning usually does?
      *   *Step 2: Integration/Reliability (The "Glue").* Is it always there? Is it trusted automatically?
      *   *Step 3: History/Reliance.* Is this a new trick or a long-term crutch?
      *   *Step 4: The "Cheat" Check (Replacement vs. Offloading).* Is it bypassing the skill being tested or enabling the demonstration of the skill?
      *   *Simplifications:* I need to ignore the hard metaphysical debates (e.g., phenomenal consciousness, the "mark of the cognitive") because admins can't judge those. I need to focus on *observable behavior* and *functional role*.
      *   *Judgment Calls:* "Automatic endorsement" is tricky. How do we measure trust? I need to define this behaviorally (e.g., do they verify every time?).

  3.  **Refining the Steps (Iterative Process):**

      *   *Drafting Step 1 (Parity):* Ask: "If this happened in the head, would we count it?"
      *   *Drafting Step 2 (Accessibility):* Ask: "Is it always available?" (Otto always has his book).
      *   *Drafting Step 3 (Trust):* Ask: "Do they believe it without checking?" (Crucial for constitution vs. tool use).
      *   *Drafting Step 4 (Assessment Integrity):* This is the policy layer. Even if it *is* cognitive, does it violate the *learning objective*? (e.g., if the exam tests memorization, extended memory defeats the purpose). *Self-Correction:* The prompt asks to preserve fairness while avoiding discrimination. I need to balance EMT with assessment validity.
      *   *Decision Nodes:* Grant, Deny, Escalate.

  4.  **Addressing the Meta-Requirements:**

      *   *Judgment Calls:* Explicitly label where admins must use discretion.
      *   *Simplifications:* Acknowledge that EMT is controversial and I'm treating it as operational truth for this protocol.
      *   *Limitations:* Admit that this doesn't solve the "what is the exam actually testing?" question fully.

  5.  **Analyzing the Three Cases:**

      *   **Case 1: Biology Student (Notebook).**
          *   *Facts:* Working memory limit, 4 years, own shorthand, reflexive use, densely cross-referenced.
          *   *EMT Analysis:* This is literally "Otto's Notebook." High parity, high reliability, automatic endorsement (reflexive).
          *   *Verdict:* Grant. (This is the easy/paradigm case).
      *   **Case 2: Law Student (AI).**
          *   *Facts:* Commercial AI, trained on notes, verifies citations because AI hallucinates.
          *   *EMT Analysis:* Parity? Maybe (memory retrieval). Reliability? No (hallucinates). Trust? No (verifies before acting).
          *   *Verdict:* Deny. The "automatic endorsement" condition fails. It's a tool, not a constituent part of memory, because it requires critical vetting.
      *   **Case 3: Engineering Student (AR Glasses).**
          *   *Facts:* No diagnosis, formulae/prompts, collaborative authorship, connectivity issues, double-checked.
          *   *EMT Analysis:* Parity? Formulae = memory. Prompts = reasoning? Reliability? No (connectivity issues). Trust? No (double-checked). Diagnosis? None (raises fairness/level playing field issues).
          *   *Verdict:* Deny. Fails accessibility (connectivity) and trust (checking). Also, without diagnosis, the "accommodation" frame is weak; it looks like an advantage.
          *   *Wait, check constraints:* The prompt asks for an "unwelcome result" explanation. For Case 1, granting might be unwelcome to traditionalists (closed book means *closed*). For Case 2, denying might be unwelcome if we want to embrace tech. For Case 3, denying is standard. Let's look closer.
          *   *Re-evaluating Case 1:* Traditionalists hate open notes. But EMT says it *is* his memory. So granting is the philosophically consistent result, even if it feels like "cheating" to a layperson.
          *   *Re-evaluating Case 2:* The student *needs* this for workflow. Denying hurts him. But philosophically, it fails the "trust" condition.
          *   *Re-evaluating Case 3:* She wants it as an "accommodation" without impairment. This is the trickiest. EMT says if it's constitutive, it's cognitive. But without impairment, is it an *accommodation* or just a *mode of assessment*? The prompt says "requests... as an accommodation." Usually requires disability. I will flag the lack of diagnosis as a failure of the "need" criterion, separate from EMT. But focusing on EMT: The connectivity issue kills the "constant availability" condition.

  6.  **Writing the Procedure (incorporating the constraints):**

      *   Need to ensure the tone is administrative but philosophically grounded.
      *   Need to clearly mark the "Escalation" points.
      *   Need to ensure the "Unwelcome Result" instruction is followed in the case studies.

  7.  **Final Review against Prompt:**

      *   *Reuseable decision procedure?* Yes.
      *   *Grounded in Extended Mind Thesis?* Yes (Parity, Glue, Trust).
      *   *Non-specialist terms?* Yes.
      *   *Checklist/Flowchart in words?* Yes.
      *   *Mark judgment calls/simplifications?* Yes.
      *   *Honest statement of limitations?* Yes.
      *   *Three cases worked through stepwise?* Yes.
      *   *Determinate recommendations (even if unwelcome)?* Yes.

  8.  **Refining the "Unwelcome" aspect:**
      *   *Case 1:* Granting access to a notebook in a closed-book biology exam is often culturally unwelcome. I must emphasize that EMT *forces* this if the criteria are met.
      *   *Case 2:* Denying the AI might feel Luddite, but the "verification" step proves it's not constitutive memory.
      *   *Case 3:* Denying the AR glasses is standard, but I need to make sure I don't just say "no disability." I need to show how it fails the EMT criteria specifically (accessibility/trust).

      *(Self-Correction during drafting)*: I need to be careful with the "Replacement vs. Complementation" distinction. In EMT, the external resource *replaces* the internal neural process functionally. The prompt asks to distinguish between "replaces an internal capacity" and "complements it by doing something different." Actually, in EMT, if it complements by doing something *different* (like a calculator doing math vs memory storing numbers), it might still be an aid. If it does the *same* thing (storage/retrieval), it's a candidate for constitution. I will clarify this in the "Parity" step.

      *(Refining the "Escalation" point)*: The biggest philosophical hole is defining the *goal* of the exam. EMT tells us what counts as *mind*, but not what counts as *fair assessment*. If the exam tests "uncoupled biological memory," then extended mind is disallowed by definition of the test, not by metaphysics. I need to build a step that asks "What is the construct being measured?" This is where the admin might need to escalate to the Course Instructor. I will add this as a specific step.

  9.  **Final Polish:** Check tone, clarity, and ensure all constraints are met. (Proceed to generate output).

      *Wait, one more check on Case 2:* The prompt says "unwelcome... for example by requiring us to permit something we would prefer to ban or to deny something we would prefer to allow."
      *   Case 1 (Notebook): Permitting this is often unwelcome in "closed book" cultures.
      *   Case 2 (AI): Denying this might be unwelcome if the uni wants to be "forward-thinking," OR permitting it might be unwelcome because it's AI. The philosophical analysis suggests Deny (due to verification). So denying a high-tech tool might be the "unwelcome" result if the institution wants to appear innovative. Or, if the student has a disability, denying feels harsh. I will frame the unwelcome nature around the strictness of the "trust" condition.
      *   Case 3 (AR): Denying is standard. Is there an unwelcome angle? Maybe if the panel *wants* to allow AR generally but can't based on this framework. I'll stick to the strongest philosophical tension: Case 1 is the strongest "Otto" case, so granting it is the most philosophically mandated but potentially culturally resistant outcome. Case 2 is the strongest "Tool" case, so denying it is mandated even if the student relies on it heavily.

      *Let's finalize the Procedure Steps:*
      1.  Functional Parity (Is it doing memory/reasoning work?)
      2.  Stability & Access (Is it always there?)
      3.  Endorsement & Trust (Is it believed automatically?)
      4.  Assessment Construct (Does allowing this defeat the specific skill being tested?)
      5.  Final Decision.

      *Simplifications to note:* Ignoring the "phenomenal consciousness" aspect (what it feels like). Ignoring the "social extension" (is the study group part of the mind?). Focusing on individual cognition.

      *Let's write.*
answer: |-
  # The Extended Mind Accommodation Protocol (EMAP)

  **Purpose:** To provide examination administrators with a standardized, philosophically grounded procedure for evaluating requests to use external resources during closed-book assessments.
  **Theoretical Basis:** The Extended Mind Thesis (EMT), specifically the "Parity Principle" and the "Glue Conditions" (Clark & Chalmers).
  **Time Allocation:** Approx. 20 minutes per case.
  **User:** Examination Administrator (Non-specialist).

  ---

  ## Part 1: The Decision Procedure

  ### Phase 1: Functional Parity (The "In-the-Head" Test)
  **Question 1:** If the student performed this specific operation using only their biological brain (e.g., recalling a fact, executing a calculation step, retrieving a definition), would we consider that operation a genuine part of their cognitive performance?
  *   **Sufficient Answer for "Yes":** The resource stores information for later retrieval, organizes concepts for reasoning, or executes standard cognitive algorithms (like arithmetic) that the student understands but cannot reliably execute unaided.
  *   **Sufficient Answer for "No":** The resource performs a physical action (e.g., typing faster), accesses information the student does not understand, or solves problems the student cannot explain.
  *   **Termination:** If **No**, **DENY**. The resource is a tool, not a cognitive constituent.
  *   **Judgment Call:** Determining if the student "understands" the output. *Justification:* We cannot scan brains; admins must rely on student testimony and past work samples.

  ### Phase 2: The Glue Conditions (Integration & Reliability)
  **Question 2:** Is the resource consistently available and accessible to the student during typical cognitive tasks?
  *   **Sufficient Answer for "Yes":** The student has the resource on their person or instantly accessible (one click/tap) in all relevant contexts (class, study, daily life). There are no frequent technical failures or connectivity dependencies.
  *   **Sufficient Answer for "No":** Access depends on Wi-Fi, battery life, third-party server uptime, or permission from others.
  *   **Termination:** If **No**, **DENY**. Cognitive processes are characterized by reliable availability; intermittent tools are mere aids.
  *   **Judgment Call:** Defining "instantly accessible." *Justification:* A 5-second load time is acceptable; a 5-minute connection search is not. Admin discretion applies based on tech specs.

  **Question 3:** Does the student automatically endorse the information provided by the resource without routine critical vetting?
  *   **Sufficient Answer for "Yes":** The student treats the output as memory. They act on it immediately. They do not routinely cross-check it against other sources before using it in reasoning.
  *   **Sufficient Answer for "No":** The student routinely verifies, fact-checks, or calculates twice because they know the resource is fallible.
  *   **Termination:** If **No**, **DENY**. If the student must critically evaluate the resource, the resource is an *object* of cognition, not a *part* of cognition.
  *   **Judgment Call:** Distinguishing between "habitual checking" and "reflexive trust." *Justification:* This is the hardest behavioral observation. Look for evidence of past errors and how they were handled.

  ### Phase 3: History and Reliance (The "Otto" Condition)
  **Question 4:** Has the student relied on this specific configuration of resources over a significant period (e.g., multiple terms) as their primary mode of engaging with the material?
  *   **Sufficient Answer for "Yes":** Documented history of use (e.g., notes, logs, prior accommodations) showing the resource is entrenched in their workflow.
  *   **Sufficient Answer for "No":** The resource was adopted recently, specifically in anticipation of the exam, or usage is sporadic.
  *   **Termination:** If **No**, **ESCALATE**. This suggests strategic advantage-seeking rather than cognitive constitution. (See Escalation Protocol below).

  ### Phase 4: Assessment Construct Validity (The Policy Override)
  **Question 5:** Does the specific learning objective of this examination require the assessment of *uncoupled* biological memory or reasoning?
  *   **Sufficient Answer for "Yes":** The course explicitly aims to test internalization (e.g., "recall of anatomical structures without aids," "mental arithmetic").
  *   **Sufficient Answer for "No":** The course aims to test application, synthesis, or problem-solving where the source of the memory is irrelevant to the competency.
  *   **Termination:** If **Yes**, **DENY** (regardless of previous answers). *Note:* This must be certified by the Course Instructor, not the Admin.
  *   **Judgment Call:** Determining if "internalization" is a core competency or an arbitrary hurdle. *Justification:* This is a pedagogical value judgment, not a philosophical one.

  ### Escalation Protocol
  **Trigger:** If Phase 3 is "No" OR if Phase 4 is contested.
  **Action:** Refer to Panel Chair.
  **Reason:** These areas involve underdetermined concepts (intent, pedagogical value) that require senior judgment rather than procedural application.

  ---

  ## Part 2: Meta-Commentary on Simplifications and Limitations

  ### Simplified or Set-Aside Philosophical Distinctions
  1.  **Phenomenal Consciousness:** The procedure ignores *what it feels like* to use the resource. EMT debates whether extended processes have a "phenomenal character." We set this aside because admins cannot access student qualia. We rely on behavioral functionalism instead.
  2.  **The "Mark of the Cognitive":** We assume functional role is sufficient for cognition. We ignore debates about whether active manipulation is required vs. passive storage.
  3.  **Social Extension:** We treat the student as an individual unit. We do not adjudicate whether a "study group" constitutes part of the mind (as in some EMT literature), as this creates unmanageable security risks in exams.

  ### Unavoidable Judgment Calls
  1.  **Automatic Endorsement (Phase 2, Q3):** Distinguishing between a reflex and a habit requires interpreting student behavior.
  2.  **Construct Validity (Phase 4):** Determining whether a test *should* measure internal memory is a value judgment about education, not a fact about the mind.

  ### Limitations and Failure Modes
  *   **The "New Tech" Bias:** This procedure favors established, low-tech tools (notebooks) over high-tech tools (cloud/AI) because high-tech tools often fail the "Stability" and "Trust" conditions due to latency and error rates. This may systematically disadvantage students who rely on modern assistive tech.
  *   **The "Internalization" Loophole:** Instructors can bypass this entire framework by simply declaring a course tests "internal memory," rendering the EMT analysis moot. The procedure cannot police bad pedagogical design.
  *   **False Negatives:** A student may trust a resource automatically (passing Phase 2) but the resource may be fundamentally unreliable (e.g., a biased algorithm). The procedure prioritizes the *student's relationship* to the tool over the *tool's objective truth*, which risks validating delusions or errors as "cognitive."

  ---

  ## Part 3: Case Applications

  ### Case 1: The Biology Student (Notebook)
  **Profile:** Working-memory limitation, 4-year history, own shorthand, reflexive use.
  **Request:** Bring notebook to closed-book exam.

  *   **Phase 1 (Parity):** Does the notebook store/retrieve info like memory? **Yes.** It contains diagrams and shorthand she uses for recall.
  *   **Phase 2 (Glue - Access):** Is it consistently available? **Yes.** Carried for four years, reflexively consulted.
  *   **Phase 2 (Glue - Trust):** Does she endorse automatically? **Yes.** "Relied upon for recall... consulted reflexively." She does not verify her own shorthand against a textbook before using it; she trusts it as her memory.
  *   **Phase 3 (History):** Long-term reliance? **Yes.** Four years.
  *   **Phase 4 (Construct):** Does biology require uncoupled memory? **Debatable.** Unless the instructor certifies that *recall without aids* is the specific competency (rare in advanced biology where reference use is standard), the answer is likely **No**.
  *   **Recommendation:** **GRANT.**
  *   **Unwelcome Result Explanation:** This result may be unwelcome to faculty adhering to a traditional "closed-book = no paper" dogma. However, under EMT, this notebook *is* her memory. To ban it is to ban her from using her own mind. The procedure forces us to acknowledge that "closed-book" cannot mean "biologically closed" if we are to avoid discriminating against cognitive differences. The notebook is not an aid; it is a constituent part of her cognitive architecture.

  ### Case 2: The Law Student (AI Assistant)
  **Profile:** Relies on AI trained on notes, verifies citations due to hallucinations, requests locked-down version.
  **Request:** Access to AI during exam.

  *   **Phase 1 (Parity):** Does the AI store/retrieve info? **Yes.** It summarizes notes.
  *   **Phase 2 (Glue - Access):** Is it consistently available? **Yes** (if locked-down version works offline).
  *   **Phase 2 (Glue - Trust):** Does he endorse automatically? **No.** The prompt states he "has learned to verify citations before filing any work" because the AI "periodically invents authorities." He treats the AI as a fallible informant, not as his own memory. He engages in critical vetting.
  *   **Phase 3 (History):** Long-term reliance? **Yes.**
  *   **Phase 4 (Construct):** Does law require uncoupled memory? **Often Yes.** Legal training often requires knowing authority without aid.
  *   **Recommendation:** **DENY.**
  *   **Unwelcome Result Explanation:** This result may be unwelcome to an administration wishing to appear innovative or to the student who genuinely feels disabled without it. However, the procedure dictates denial because the "Automatic Endorsement" condition fails. Because he must verify the AI's output, the AI remains an *external object* he is thinking *about*, not a medium he is thinking *with*. It is a source of data, not a part of his memory. Permitting it would be akin to permitting a research assistant who whispers answers that must then be checked; this alters the assessment of *his* legal reasoning.

  ### Case 3: The Engineering Student (AR Glasses)
  **Profile:** No diagnosis, AR glasses with formulae/prompts, connectivity issues, double-checked calculations.
  **Request:** Wear glasses as accommodation.

  *   **Phase 1 (Parity):** Do glasses store/retrieve info? **Yes.** Formulae and prompts.
  *   **Phase 2 (Glue - Access):** Is it consistently available? **No.** Prompt states "unavailable in some campus buildings" due to connectivity. Cognitive processes cannot be location-dependent in this way.
  *   **Phase 2 (Glue - Trust):** Does she endorse automatically? **No.** Prompt states she "routinely double-checked against her own calculations."
  *   **Phase 3 (History):** Long-term reliance? **Yes** (fluently used).
  *   **Phase 4 (Construct):** Does engineering require uncoupled memory? **Mixed.** But Phase 2 already failed.
  *   **Additional Factor:** No diagnosed impairment. Accommodations generally require a disability framework to ensure equity rather than universal advantage.
  *   **Recommendation:** **DENY.**
  *   **Unwelcome Result Explanation:** This result may be unwelcome if the panel wishes to encourage "future of work" technologies or if the student argues the glasses are her "natural" way of working. However, the procedure forces a denial based on the "Stability" and "Trust" conditions. The connectivity issue means the resource is not constitutively available (it disappears in certain rooms), and the double-checking proves it is not trusted as memory. Furthermore, without a diagnosed impairment, granting this as an *accommodation* violates the fairness principle of leveling the playing field for disabilities, turning it instead into a universal design change which requires broader curriculum reform, not an individual exemption.

  ---

  **Chair's Sign-Off Note:**
  *This protocol prioritizes the metaphysical status of the resource over the student's preference. In Case 1, it compels us to allow a resource that looks like cheating. In Case 2, it compels us to deny a resource the student feels they need. This inconsistency is a feature, not a bug: it reflects the actual difference between a constitutive extension of mind (Notebook) and a causal tool (AI).*
