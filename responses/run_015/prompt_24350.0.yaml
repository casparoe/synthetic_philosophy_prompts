answer: |-
  Here is a proposed framework that captures your intuitions. It distinguishes between the *right to speak* (standing) and the *weight of the speech* (authority).

  ### The Principle: Standing, Domain, and Experiential Authority

  **Clause 1: The Complicity Bar (Standing)**
  A person lacks the moral standing to criticize a specific wrongdoing if they are **currently engaged** in that same wrongdoing (or a substantially similar one).
  *   *Purpose:* Prevents hypocrisy ("Do as I say, not as I do").
  *   *Covers:* **Case 2** (The active tax evader). Because he is currently evading, he is complicit in the very norm he is criticizing, which nullifies his standing regardless of the scale difference.

  **Clause 2: The Domain Specificity Exception (Standing)**
  A person retains standing to criticize a wrongdoing even if they have committed past wrongs, provided the past wrong belongs to a **morally distinct domain** (different relationship, motive, or stakes) than the current criticism.
  *   *Purpose:* Prevents over-generalizing a person's moral character.
  *   *Covers:* **Case 4** (Parent lies) and **Case 5** (Borrower vs. Rent). In Case 4, "protective lying" is morally distinct from "dishonest lying." In Case 5, an informal loan between friends is a distinct relational domain from a formal lease agreement.

  **Clause 3: The Experiential Authority Condition (Weight)**
  A person who has committed and **reformed** from a wrongdoing possesses the same baseline standing as someone who never committed it. However, they gain **enhanced authority** (more right) only if:
  1.  They hold a **protective or authoritative role** over the recipient (e.g., coach, mentor); AND
  2.  Their past experience provides **unique insight into the temptation or cost** that is necessary to validate the rule they are enforcing.
  *   *Purpose:* Distinguishes between peer advice and authoritative guidance.
  *   *Covers:* **Case 1** (Ex-Smoker) and **Case 3** (Ex-Doper Coach).
      *   In **Case 1**, the brother is a peer. While he knows the cost, his advice relies on health facts accessible to anyone. His reformation grants him standing, but no *enhanced* authority over a non-smoker.
      *   In **Case 3**, the coach holds authority over teens. A coach who never doped might be viewed as naive about the pressure to cheat. The ex-doper's history validates the rule ("I did it, it cost me, don't make my mistake"), granting him *enhanced* authority.

  ---

  ### Prediction: The "Saint" Case
  **Case:** A person who has never done the thing and has never been tempted to, criticizing someone who has.

  **Prediction:**
  According to **Clause 1** and **Clause 3**, this person has **baseline standing but no enhanced authority.**
  *   They are not hypocrites (Clause 1 is satisfied), so they have the *right* to criticize.
  *   However, they lack the "scarred hands" experience. In a peer context (like the smoker), they are on equal footing with the reformed offender. In an authority context (like the coach), they may be vulnerable to the accusation that they "don't understand the pressure," though their moral position remains clean.
  *   *Verdict:* They are permitted to criticize, but their criticism may carry less persuasive weight regarding the *difficulty* of compliance, even if it carries full weight regarding the *wrongness* of the act.

  ---

  ### Tension Check: Which Case to Drop?

  The greatest tension in your intuitions lies between **Case 1 (Ex-Smoker)** and **Case 3 (Ex-Doper Coach)**. Both involve a reformed offender criticizing the same act. Yet, you grant the Coach *more* right than a clean coach, but the Brother *no more* right than a clean non-smoker.

  If a principle forced you to align these, it would likely argue that **reformation always grants enhanced authority** (because only a reformed person truly knows the cost of the vice). If you accepted this, you would have to change your verdict on **Case 1**: you would have to admit the ex-smoker brother has *more* right to tell you to quit than a brother who never smoked.

  **Would you actually drop Case 1?**
  Probably not, and here is why the principle above saves you from having to:
  The distinction is **Role and Necessity.**
  *   In the **Coach** scenario, the authority figure is imposing a rule on a subordinate. The legitimacy of that rule is strengthened if the imposer knows the temptation they are banning. The "bonus right" is about *legitimizing authority*.
  *   In the **Brother** scenario, the critic is a peer offering advice. The validity of the advice ("smoking is bad") does not depend on having smoked. The "bonus right" is not needed for the advice to be valid.

  If you found yourself thinking, *"Actually, my ex-smoker friend does know something about quitting that my never-smoker friend doesn't, so maybe he does have more right,"* then you would drop Case 1's verdict. But if you maintain that health advice is objective and doesn't require shared sin to be valid, then **Clause 3** (specifically the "Authoritative Role" requirement) successfully preserves your intuition without contradiction.
