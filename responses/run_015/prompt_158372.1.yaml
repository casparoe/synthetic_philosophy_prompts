answer: |-
  # Workshop Handout: The Intentionality Decision Tree
  **Topic:** The Two-Bitser and the Derived/Original Boundary  
  **Format:** Diagnostic Taxonomy of Commitments  
  **Time:** 90 Minutes  

  ## Introduction
  This taxonomy is designed to locate your position on the nature of intentionality without relying on named authors or schools of thought. We begin with Dennett's "two-bitser": a non-biological system tracking exactly two binary distinctions (e.g., Temperature High/Low × Chemical Present/Absent) without a designer, user, or evolutionary history.

  Answer the following four questions sequentially. Your path determines your theoretical commitment.

  ---

  ## The Decision Tree

  ### Question 1: The Biological Constraint
  **Claim:** *The two-bitser's internal states count as representational **only if** the system possesses an evolutionary or biological history.*
  *   **(YES)** → Go to **Question 4** (Skip 2 & 3; history is the bottleneck).
  *   **(NO)** → Go to **Question 2**.

  ### Question 2: The Designer Constraint
  **Claim:** *The complete absence of a conscious designer eliminates derived intentionality altogether (i.e., without a designer, there is not even 'as-if' intentionality).*
  *   **(YES)** → Go to **Question 3**.
  *   **(NO)** → Go to **Question 3** (Note: You accept natural or non-designed derived intentionality).

  *(Note: For logical mapping, Q2 branches feed into Q3 regardless of answer, but the label changes based on the Q2 commitment.)*

  ### Question 3: The Isomorphism Constraint
  **Claim:** *Functional isomorphism between the two-bitser's state-transitions and a human belief-forming process is sufficient by itself to cross into **original** intentionality.*
  *   **(YES)** → **Stop.** (You prioritize structure over history/origin).
  *   **(NO)** → Go to **Question 4**.

  ### Question 4: The Integration Constraint
  **Claim:** *An isolated two-bit distinction is always derivative, while a densely interconnected network of such distinctions might reach a non-derivative threshold.*
  *   **(YES)** → **Stop.** (You prioritize complexity/emergence).
  *   **(NO)** → **Stop.** (You are an atomist or eliminativist regarding this distinction).

  ---

  ## The Leaves: Diagnostic Labels & Commitments

  Match your sequence of answers (Q1, Q2, Q3, Q4) to the following profiles.

  ### 1. Strong Bio-Atomism
  *   **Path:** YES, [Any], [Any], NO
  *   **Label:** **Strong Bio-Atomism**
  *   **Awkward Commitment:** A single biological neuron in isolation literally represents specific environmental features, but a silicon duplicate of that neuron represents nothing at all.
  *   **Status:** *Occupied.*

  ### 2. Strong Bio-Holism
  *   **Path:** YES, [Any], [Any], YES
  *   **Label:** **Strong Bio-Holism**
  *   **Awkward Commitment:** A single biological neuron has no intentionality whatsoever; 'aboutness' emerges only at the level of the whole organism or brain.
  *   **Status:** *Occupied.*

  ### 3. Intentional Creationism
  *   **Path:** NO, YES, NO, [Any]
  *   **Label:** **Intentional Creationism**
  *   **Awkward Commitment:** Smoke does not indicate fire, and tree rings do not indicate age, unless a conscious agent intended them to serve as signs.
  *   **Status:** *Occupied.*

  ### 4. Unstable Isomorphism
  *   **Path:** NO, YES, YES, [Any]
  *   **Label:** **Unstable Isomorphism**
  *   **Awkward Commitment:** A random crystal formation isomorphic to a brain has genuine beliefs, but a thermostat engineered by a human has no derived intentionality.
  *   **Status:** **⚠ INCOHERENT/UNSTABLE.**
  *   **Diagnosis:** This view denies derived intentionality without a designer (Q2=YES) but grants original intentionality based solely on structure (Q3=YES). This reverses the standard burden of proof: it claims 'fake' (derived) intentionality requires a mind, but 'real' (original) intentionality requires only math. It is difficult to motivate why structure creates *more* robust intentionality than design does.

  ### 5. Computational Functionalism
  *   **Path:** NO, NO, YES, [Any]
  *   **Label:** **Computational Functionalism**
  *   **Awkward Commitment:** A sufficiently complex spreadsheet tracking market variables literally holds beliefs about future prices, regardless of who made it.
  *   **Status:** *Occupied.*

  ### 6. Integrationist Threshold
  *   **Path:** NO, NO, NO, YES
  *   **Label:** **Integrationist Threshold**
  *   **Awkward Commitment:** There is a precise number of interconnected bits where 'aboutness' magically appears; adding one more logic gate turns derivation into originality.
  *   **Status:** *Occupied.*

  ### 7. Eliminative Derivationism
  *   **Path:** NO, NO, NO, NO
  *   **Label:** **Eliminative Derivationism**
  *   **Aggravating Commitment:** No matter how complex the system, if it is physical, its states are never truly 'about' anything; human intentionality is also derivative or illusory.
  *   **Status:** *Occupied.*

  ---

  ## Scoring Key

  | Leaf Profile | Q1 (Bio) | Q2 (Designer) | Q3 (Isomorphism) | Q4 (Scale) |
  | :--- | :---: | :---: | :---: | :---: |
  | **1. Strong Bio-Atomism** | Y | - | - | N |
  | **2. Strong Bio-Holism** | Y | - | - | Y |
  | **3. Intentional Creationism** | N | Y | N | - |
  | **4. Unstable Isomorphism** | N | Y | Y | - |
  | **5. Computational Functionalism**| N | N | Y | - |
  | **6. Integrationist Threshold** | N | N | N | Y |
  | **7. Eliminative Derivationism** | N | N | N | N |

  *(Note: "-" indicates the question is bypassed or irrelevant to the final classification due to earlier branching.)*

  ---

  ## Facilitator Notes: Collapses & Blind Spots

  ### 1. Positional Collapses
  This taxonomy intentionally groups distinct philosophical positions that share underlying metaphysical commitments regarding the two-bitser case.
  *   **The Biological Collapse:** Both **Biological Naturalism** (e.g., Searle) and **Teleosemantics** (e.g., Millikan) typically land on **Q1=YES**. The tree does not separate them because, in the context of a *non-biological* two-bitser, both deny it intentionality. They only diverge on *why* biology matters (causal powers vs. selected function), which this specific case does not test.
  *   **The Functionalist Collapse:** **Classical Computationalism** (e.g., Fodor) and **Interpretivism** (e.g., Dennett) may both land on **Q3=YES** or **Q4=YES** depending on interpretation. The tree does not distinguish between intentionality being *realized* by computation versus *imposed* by interpretation, as both accept the sufficiency of structural/functional complexity in non-biological systems.

  ### 2. The Unexplored/Incoherent Zone
  *   **Unstable Isomorphism (Leaf 4):** As noted, this combination is rarely defended explicitly. It is flagged to prompt discussion: Can one consistently hold that design is necessary for *derived* meaning while denying it is necessary for *original* meaning? This usually indicates a confusion between "intentionality" and "consciousness."

  ### 3. The Missing Feature (Limitation)
  **This tree cannot capture Normativity.**
  The decision tree maps *metaphysical conditions* (history, structure, scale) for the existence of intentionality. It does not capture the **normative dimension** (correctness conditions, error, or "ought").
  *   *Why this matters:* A system might satisfy **Computational Functionalism** (Leaf 5) and track states perfectly, yet fail to have "truth conditions" in a robust sense.
  *   *Facilitator Instruction:* When discussing Leaf 5 or 6, ask participants: "Does your view explain how the system can be *wrong*, or only how it can be *different*?" The tree identifies where they stand on existence, but you must supply the debate on correctness.
