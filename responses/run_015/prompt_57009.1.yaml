answer: |-
  The mirror image does not commit Plutarch to literal imitation but to an internal calibration of moral judgment, which dissolves the tension with the "small-signs" method by treating biographical details as diagnostic evidence of character rather than prescriptive scripts for action.

  The "mirror" (*esoptron*) in Plutarch's Middle Platonist context functions not as a stencil for copying external behaviors, but as a tool for self-examination and ordering. When he speaks of "fashioning and adorning" (*kosmein*) his life, he refers to the structural arrangement of the soul's virtues rather than the replication of specific deeds. This is reinforced by the "guest" metaphor: to receive a subject as a guest and "associate" (*sunoikein*) with them implies intimacy and familiarity, not subservience. You do not imitate a guest; you come to know their disposition (*ēthos*) through prolonged exposure. The mechanism here is acculturation through familiarity, where the reader inhabits the moral perspective of the subject until it becomes a viable option for their own psyche.

  The "repelling" passage confirms this non-imitative mechanism by describing a defensive moral psychology rather than an active mimetic one. Plutarch argues that keeping noble characters in the soul allows him to "repel" base suggestions by turning his thoughts to the "fairest of his examples." This is a mechanism of orientation and resistance; the biography provides a counter-weight to corruption, not necessarily a step-by-step guide for conduct. If the goal were simple imitation, the "repelling" function would be redundant—you would simply copy the noble act. Instead, the noble act serves as a standard of measurement that exposes the baseness of the current temptation, allowing the reader to reject it.

  This resolves the conflict with the *Alexander* prologue because the "small signs" (a jest, a phrase) are valued precisely for their diagnostic power, not their replicability. Plutarch claims these trifles reveal virtue or vice better than battles because they are unguarded disclosures of *prohairesis* (moral choice). The reader cannot imitate the specific jest, but they can imitate the *quality of character* that the jest reveals. The "small-signs" method provides the data for diagnosing the virtue, and the "mirror" method provides the process for internalizing that virtue. The conflict dissolves because both methods aim at the same endpoint: the refinement of the reader's moral discernment, not the replication of historical events.

  **Contested Readings Flag:** This analysis relies on reading *kosmein* as "moral ordering" rather than mere "decoration," a distinction rooted in Platonic ethics that some literalist historians might dispute in favor of a more aesthetic reading. Additionally, framing the *Lives* primarily as moral therapy assumes the "moralist" interpretation of Plutarch (championed by scholars like Timothy Duff), whereas political historians (such as Christopher Pelling) sometimes argue that the *Lives* are more exploratory and less prescriptive, intended to provoke debate rather than provide stable examples for repelling vice. Finally, the claim that "small signs" are non-imitable assumes a distinction between *action* and *character* that is clear in modern ethics but potentially more fluid in ancient virtue ethics, where the act itself is often constitutive of the virtue.
