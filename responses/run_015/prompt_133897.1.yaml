answer: |-
  You have stumbled onto the central problem of contemporary social ontology. Your intuitions are actually quite sophisticated; they map closely onto the debates between **John Searle** (institutional facts), **Ian Hacking** (interactive kinds), and **Sally Haslanger** (structural realism).

  The tension you feel arises because you are trying to use **Universality** as a proxy for **Reality**, and **Fragility** as a proxy for **Construction**. Those are the wrong metrics.

  Here is a principle (actually a small family of three axes) that sorts your cases consistently, explains the Autism verdict, and tells you exactly which intuitions you have to sacrifice.

  ### The Framework: Three Axes of Social Kinds

  To sort these, we need to evaluate each kind on three dimensions:

  1.  **Constitutive Dependence:** Does the kind exist *only* because we classify it? (If we stop believing, does it vanish?)
  2.  **Material Anchoring:** Is there a pre-existing physical/biological reality that the kind attempts to track?
  3.  **Feedback/Looping:** Does classifying the thing change the thing itself?

  Using this, we can categorize your cases into four distinct buckets.

  #### 1. Purely Institutional Kinds (Money)
  *   **Dependence:** Total. Without collective intentionality, it is just metal or code.
  *   **Anchoring:** None. (Bitcoin has code, but the *value* is purely agreement).
  *   **Looping:** Low. A dollar bill doesn't change its chemistry because you call it money.
  *   **Verdict:** This is the "fragile" construction you identified. It feels different from race because its existence is *synchronous* with belief.

  #### 2. Structural Kinds (Race, Gender)
  *   **Dependence:** High (historically). The categories were created by social practice/law.
  *   **Anchoring:** Low/Contested. Ancestry is real, but "Black" is not a genetic cluster; it is a political grouping of ancestry.
  *   **Looping:** High. Being racialized changes how you are treated, which changes your life outcomes, which reinforces the category.
  *   **Verdict:** This is where your intuition about **Race vs. Money** needs adjustment. Race is *more* real than money, not less. Why? Because race has been **materialized**. It is built into housing algorithms, hospital protocols, and wealth distribution. If everyone stopped "believing" in race tomorrow, the maternal mortality disparity would not vanish overnight because it is embedded in *infrastructure*, not just heads. Money vanishes when trust breaks; Race persists because it is built into the walls.

  #### 3. Interactive/Looping Kinds (Credit Score, Autism)
  *   **Dependence:** High. The specific category ("High Risk," "Autistic") is defined by the institution (FICO, DSM).
  *   **Anchoring:** Mixed. Credit scores anchor to payment history; Autism anchors to neurology.
  *   **Looping:** **Extreme.** This is the defining feature. Once you are labeled "High Risk," you act differently (or are acted upon), which changes your score. Once you are labeled "Autistic," you gain access to supports/communities that change how you navigate the world.
  *   **Verdict:** These are "moving targets." The classification changes the target.

  #### 4. Bureaucratic Status on Natural Kinds (Refugee)
  *   **Dependence:** Low. The suffering/displacement exists without the UN.
  *   **Anchoring:** High. Physical displacement is a brute fact.
  *   **Looping:** Low. The label grants rights, but doesn't fundamentally change the nature of the displacement.
  *   **Verdict:** This is a "tracking" kind. The label tries to match a pre-existing reality.

  ---

  ### The Hard Truths: What You Must Drop

  To make this system consistent, you have to sacrifice three specific intuitions you held in your prompt.

  #### 1. Drop the idea that "Woman" is a Universal Kind.
  You wrote: *"I think 'woman' in 1950s America and 'woman' in Japan today are basically the same kind."*
  **Correction:** They are **analogous structural positions**, not the same kind.
  If "Hijra" and "Two-Spirit" are genuinely different kinds (which your intuition correctly says they are), then "Woman" cannot be a universal biological natural kind. It is a **social role** that appears in many societies, but its boundaries are locally drawn.
  *   **Why:** If "Woman" were a universal natural kind (like "Water"), Hijra would just be a local variation of "Non-Binary." But you sense they are distinct. That implies "Woman" is defined by its relation to a specific social structure (patriarchy). Since patriarchy varies, the kind "Woman" varies.
  *   **The Cost:** You must accept that "Woman" is more like "Citizen" or "Noble" than it is like "Female Human." It travels, but it is not universal.

  #### 2. Drop the idea that Construction = Fragile.
  You wrote: *"If money belief vanished, money would vanish... racial health disparities... wouldn't vanish overnight."*
  **Correction:** You are right about the phenomenon, but wrong about the implication. You treat this as a puzzle; it is actually the definition of **Structural Realism**.
  *   **Why:** Money is *Institutionally* constructed (depends on current belief). Race is *Historically* constructed (depends on past actions solidified into present infrastructure).
  *   **The Cost:** You must stop thinking Money and Race are the "same kind" of construction. Money is a **Status Function** (Searle); Race is a **Social Structure** (Haslanger). Race is ontologically heavier than money because it has been baked into the physical world.

  #### 3. Drop the Binary on Autism (Natural vs. Social).
  You asked: *"Is autism... a social kind... or just a natural neurological kind?"*
  **Verdict:** It is a **Bio-Social Interactive Kind.**
  *   **Why:** There is a neurological reality (Anchoring). But the *boundaries* of the category (DSM-5 criteria) are social decisions. Furthermore, the diagnosis changes the person's life trajectory (Looping).
  *   **The Cost:** You cannot say it is *just* a natural kind we discovered. If it were just natural, the boundaries wouldn't shift so wildly between DSM-4 and DSM-5, and the diagnosis wouldn't fundamentally alter the phenotype (how the person behaves in society). It is a natural variation *captured* by a social kind that loops back on itself.

  ### Summary of the Re-Sort

  | Case | Kind Type | Ontological Weight | Universality |
  | :--- | :--- | :--- | :--- |
  | **Money** | Institutional | Fragile (Belief-dependent) | High (Functional) |
  | **Race** | Structural | Robust (Infrastructure-dependent) | Low (Locally specific) |
  | **Gender** | Structural | Robust (Role-dependent) | Medium (Family Resemblance) |
  | **Refugee** | Bureaucratic/Tracking | Robust (Physical reality) | High (Phenomenon is universal) |
  | **Credit Score** | Interactive/Looping | Thin (Metric-dependent) | High (Systemic) |
  | **Autism** | Bio-Social Interactive | Medium (Neuro + Social) | High (Neurology is universal) |

  ### The Final Verdict on Your Tension

  You asked: *"Is universality the marker of a 'real' kind vs a constructed one?"*
  **Answer:** No. **Causal Power** is the marker of reality.

  *   Money is constructed but has causal power (you can buy food).
  *   Race is constructed but has causal power (it determines health outcomes).
  *   The difference is **where the power lives.** In Money, the power lives in *collective belief*. In Race, the power lives in *material history*.

  **Your gut was right about the cases, but wrong about the taxonomy.**
  1.  **Money** is fragile because it lacks material anchors.
  2.  **Race** is robust because it has material anchors (houses, laws, bodies), even if the *concept* is constructed.
  3.  **Gender** is not universal; it is a widespread structural position.
  4.  **Autism** is the paradigm case of a **Looping Bio-Social Kind**. It forces you to admit that something can be biologically real *and* socially constructed simultaneously. The construction lies in the *boundary drawing* and the *social response*, not in the neurons themselves.

  If you hold this line, you stop special-pleading for race. Race isn't "more real" than money because it's less constructed; it's "more real" because its construction is older, deeper, and physically embedded.
