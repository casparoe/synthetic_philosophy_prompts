          *   *Anti-realists:* Claim these are geometric artifacts, basis-dependent, superposition makes "the" representation ill-defined. Analogy: A thermometer represents temperature only relative to a specific physical coupling; networks might just be function approximators where "features" are convenient fictions.
      *   **The User's Thought Experiment:** Synthetic data with known latents. GD finds stable, interventionally useful features that are *linear mixtures* of true latents, not the latents themselves. No tweak recovers the true latents.
