answer: |-
  This configuration is best understood not as a rhetorical device, but as a distinct, rigorous species of **Indirect Normativity**. While it shares structural DNA with Ideal Observer Theory and Contractarianism, it diverges in its function and authority conditions. I propose classifying this specific deliberative move as **Counterfactual Authorization**.

  It is a variant of indirect normativity because the normative force does not arise from the direct features of the act (as in direct consequentialism) nor from the agent's current capacity (as in standard duty), but is mediated through a hypothetical procedure. However, it is not merely "indirect" in the sense of following a rule; it is indirect through *substituted agency*.

  ### Definition: Counterfactual Authorization

  **Counterfactual Authorization** is a deliberative heuristic wherein an actual agent, facing radical uncertainty or moral conflict, generates a decision by deferring to the hypothetical choice of an idealized counterpart. For this classification to hold, three boundary conditions must be met:

  1.  **Moral-Epistemic Idealization:** The counterpart is not merely informed (epistemic idealization) but is constituted by specific moral virtues the actual agent acknowledges lacking or finds contested (e.g., impartiality over loyalty).
  2.  **Vicarious Bindingness:** The actual agent treats the counterpart's choice as an immediate obligation for the present moment, not as a goal for future self-improvement. The authority is transferred, not emulated.
  3.  **Inaccessibility:** The agent acknowledges she cannot fully inhabit the counterpart's perspective (due to fear, bias, or cognitive limitation) but accepts its verdict as binding nonetheless.

  ### Distinction from Neighboring Concepts

  To defend this classification, we must distinguish Counterfactual Authorization from the structures you noted as similar but insufficient.

  **1. Versus Ideal Observer Theory**
  Standard Ideal Observer Theory is meta-ethical; it defines the truth conditions of moral statements (e.g., "X is right if an impartial observer would approve"). Counterfactual Authorization is first-person deliberative. It does not ask, "What is true?" but "What must I do?" Furthermore, Ideal Observer Theory typically assumes a neutral, impartial stance. Your pattern allows the idealization to include *specific contested virtues* (like loyalty), meaning the "ideal" is not necessarily neutral but morally loaded. The agent is not seeking a view from nowhere; she is seeking a view from a *better somewhere*.

  **2. Versus Contractarianism**
  Contractarian models (e.g., Rawls) use hypothetical agreement to establish *principles of justice* for a society. Counterfactual Authorization is used by an individual to resolve *specific situational choices*. The contractarian veil of ignorance strips away identity to ensure fairness; your agent's idealized counterpart retains identity but purifies its moral character. The former constructs a system; the latter constructs a proxy.

  **3. Versus Direct Consequentialist Calculation**
  In direct consequentialism, the agent weighs outcomes based on her best available estimate. Under radical uncertainty, this calculation is impossible or prone to bias. Counterfactual Authorization bypasses the calculation of outcomes entirely. The agent does not ask, "Which choice yields the best result?" She asks, "Which choice would the virtuous self make?" The authority lies in the *character of the chooser*, not the *value of the consequence*. This is crucial for your novel's theme: it allows agents to act decisively when the consequences are unknowable.

  **4. Versus Aspirational Self-Improvement**
  This is the most critical distinction. In aspirational models (e.g., "What would Jesus do?"), the goal is to *become* the exemplar over time. The gap between actual and ideal is a space for growth. In Counterfactual Authorization, the gap is permanent. The agent does not claim she can become that self; she admits her flawfulness. She uses the counterpart not as a model for transformation, but as a **normative crutch**. The obligation is immediate. If the ideal self would sacrifice, the actual self must sacrifice *now*, even if she remains fearful and reluctant. The virtue is outsourced, not internalized.

  **5. Versus Epistemic Rational Reconstruction**
  Standard rational reconstruction assumes the agent's preferences are stable and only her information is flawed (e.g., "If I knew the facts, I would choose X"). Your pattern explicitly involves *moral transformation*. The counterpart does not just know more; she *cares differently*. She prioritizes the collective good over immediate attachment in a way the actual self cannot currently do. Therefore, this is not merely correcting for ignorance; it is correcting for moral weakness via hypothetical substitution.

  ### Is it a Rhetorical Device?

  You ask if this is reasoning disguised as rhetoric. It is not. It is a functional cognitive technology for managing **moral risk**.

  Under conditions of radical uncertainty, direct deliberation is vulnerable to the agent's immediate fears and biases. By shifting the locus of decision to a counterfactual self, the agent effectively precommits to a course of action that her current, compromised psychology would reject. It functions similarly to a Ulysses contract (binding one's future self), but instead of binding the future, it binds the *actual* to the *hypothetical*.

  This is a genuine normative structure because it solves a specific problem that direct normativity cannot: how to act morally when one's moral faculties are currently impaired by uncertainty or emotion, without waiting for those faculties to heal. It grants the agent access to normative authority she acknowledges she currently lacks.

  ### Conclusion for Your Novel

  You should classify this move in your characters' reasoning as **Counterfactual Authorization**. It is a form of Indirect Normativity that operates through **Vicarious Agency**.

  This classification supports the thematic tension in your novel. It allows your characters to make "correct" moral decisions without becoming moral saints. They remain flawed, fearful, and uncertain, yet they bind themselves to a standard they cannot fully embody. This creates a rich psychological conflict: the agent is obeying a law she did not write and a self she is not. It captures the tragedy of moral action under uncertainty—one must often borrow virtue from a self that does not exist to survive a world one cannot know.
