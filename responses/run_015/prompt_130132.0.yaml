answer: |-
  # The "Equality of What?" Sorting Quiz

  **Instructions:** Read each case and choose the option that matches your immediate gut reaction. Do not overthink it. There are no right answers, only different commitments.

  **1. The Disaster Relief (The Trap)**
  Two villages have been cut off by a flood. In Village A, everyone has 1 unit of food per day. In Village B, everyone has 0.9 units. Both are below the survival threshold. You have enough supplies to raise one village to 1.5 units (survival), but not both.
  *   **A.** Send to Village B. They are worse off, so equality demands we help them first.
  *   **B.** Send to Village A. They are easier to reach / logistically simpler (ignore this, assume equal cost). *Correction:* Send to neither specifically; split supplies so both get 1.2 units.
  *   **C.** It doesn't matter who is worse off. Send enough to both so that *everyone* survives, even if the gap remains.
      *(Note: If you chose C strongly because the gap itself doesn't bother you, you may not be an egalitarian. See Key Leaf 0.)*

  **2. The Gourmet and the Simpleton (Expensive Tastes)**
  Alex and Blair receive the same income. Alex gets miserable because they need expensive wine to feel satisfied. Blair is perfectly happy with cheap beer and simple food. Alex is suffering; Blair is content.
  *   **A.** Give Alex more money. Suffering is suffering, regardless of the cause.
  *   **B.** Do not give Alex more money. They are responsible for their own expensive preferences.
  *   **C.** Give them both more resources (like a community kitchen), but not cash.

  **3. The Contented Worker (Adaptive Preferences)**
  Casey has lived in poverty their whole life and claims to be happy with very little. Morgan had a wealthy upbringing, lost everything, and is miserable on the same income Casey has.
  *   **A.** Prioritize Morgan. Casey's happiness is a result of oppression lowering their expectations.
  *   **B.** Prioritize Casey. They are actually happier, and happiness is what matters.
  *   **C.** Treat them equally. Their current resources are the same, so their claims are the same.

  **4. The Mobility Cost (Disability)**
  Jordan uses a wheelchair. Taylor does not. They have the same income. Jordan spends half their income on ramps and transport just to get to the same places Taylor can reach for free.
  *   **A.** Give Jordan extra money to cover the cost of the ramp.
  *   **B.** Do not give extra money. They have the same budget; how they spend it is up to them.
  *   **C.** Build the ramps publicly so Jordan doesn't have to pay for them personally.

  **5. The Fast and the Famine (Functioning vs. Freedom)**
  Sam is fasting for religious reasons. Robin is starving because there is no food. Both are currently hungry and weak.
  *   **A.** This is equally urgent. Both are in the same physical state of deprivation.
  *   **B.** This is not equally urgent. Sam *could* eat if they chose to; Robin cannot.
  *   **C.** It depends on whether the fasting is voluntary or socially coerced.

  **6. The Investor and the Victim (Luck)**
  Pat invested in a risky business and lost everything. Quinn's house burned down due to a lightning strike (no insurance was available). Both are now homeless.
  *   **A.** Help Quinn first. Pat took a gamble; Quinn suffered bad luck.
  *   **B.** Help both equally. Homelessness is the same regardless of how it happened.
  *   **C.** Help Pat first. Pat's loss was a contribution to the economy's risk-taking; Quinn's was pure waste.

  **7. The Paralyzed Privileged (Depression/Options)**
  Dana has access to the best education and jobs but is too depressed to leave the house. Eli has modest options but uses every single one of them to their fullest.
  *   **A.** Dana is worse off. They have lost the *ability* to use their opportunities.
  *   **B.** Eli is worse off. They actually have less freedom and fewer options available.
  *   **C.** They are equally off. One has options they can't use; the other uses options they don't have.

  **8. The Fragile Success (Resilience)**
  Frank has a modest life but is unionized and insured; if he gets sick, he bounces back in a month. Grace has a luxurious life but no safety net; if she gets sick, she is ruined forever.
  *   **A.** Favor Frank. His life is more secure/stable.
  *   **B.** Favor Grace. Her average quality of life is much higher.
  *   **C.** Favor Frank. It's not about the level, but how fast he recovers from a hit.

  **9. The Arc of a Life (Time-Slice)**
  Person X has a brilliant sixty years and a miserable, painful decade at the end. Person Y has a miserable decade and a brilliant sixty years. Total happiness is identical.
  *   **A.** It makes no difference. The sum is what counts.
  *   **B.** Person Y is worse off. A bad ending ruins the narrative of the life.
  *   **C.** Person X is worse off. We should equalize well-being at every stage, not just over the whole life.

  **10. The Safety Net (Fallback)**
  Society 1 has higher average wealth but some people are destitute. Society 2 has lower average wealth but no one falls below a basic floor.
  *   **A.** Choose Society 1. Maximizing the average helps the most people.
  *   **B.** Choose Society 2. The worst-off position is the only thing that matters.
  *   **C.** Choose Society 2, but only because the destitute in Society 1 are below a threshold of 'enough'.

  ***

  # The Key: Mapping Your Commitments

  Do not count your answers like a personality test. Instead, look for the *pattern* of your choices. The "Leaves" below represent coherent clusters of answers. Find the leaf that matches your profile.

  **Leaf 0: The Exit (Sufficientarianism / Prioritarianism)**
  *   **Profile:** You chose **1C** or **10C**.
  *   **Diagnosis:** You likely don't care about *equality* per se. You care about people having *enough* (Sufficientarianism) or you care about helping the worse-off only because their suffering is weightier (Prioritarianism).
  *   **Status:** You have exited the "Equality of What?" debate. You are asking "How Much?" rather than "What Kind?"

  **Leaf 1: The Actual-Welfare Currency**
  *   **Profile:** **2A** (Compensate tastes), **3B** (Prioritize happiness), **5A** (Fasting = Starvation).
  *   **The View:** The only thing that matters is how people actually feel. If someone is miserable, they are disadvantaged, regardless of whether it's their fault (tastes) or their choice (fasting).
  *   **Logical Space:** Focuses on *outcomes* of mental states.
  *   **Stability:** Vulnerable to the "Expensive Tastes" objection (why should society pay for my champagne?).

  **Leaf 2: The Opportunity-for-Welfare Currency**
  *   **Profile:** **2B** (No compensation for tastes), **3A** (Compensate adaptive prefs), **6A** (Compensate brute luck, not option luck).
  *   **The View:** We should equalize the *chance* to be happy, not the happiness itself. People are responsible for their preferences and gambles, but not for their bad luck or oppressed expectations.
  *   **Logical Space:** Focuses on *ex-ante* prospects, holding agency constant.
  *   **Stability:** Requires a clear line between "choice" and "circumstance," which is often blurry (e.g., is depression a choice?).

  **Leaf 3: The Resources & Primary Goods Currency**
  *   **Profile:** **2C/3C/4B** (Focus on means, not conversion), **5B** (Fasting is different), **6B** (Homelessness is the same).
  *   **The View:** Equality is about the "stuff" people have (money, liberties, social bases of respect). We are not responsible for how efficiently we convert stuff into happiness, but we aren't compensated for our inability to do so either.
  *   **Logical Space:** Focuses on *means* rather than *ends*.
  *   **Indistinguishability Flag:** This quiz cannot separate **Resources** (Dworkin) from **Primary Goods** (Rawls). To separate them, you need a question about *talents*: are natural talents internal resources you own (Resources) or common assets (Primary Goods)? Without that, these two views answer this quiz identically.

  **Leaf 4: The Capability Currency (Open)**
  *   **Profile:** **4A** (Compensate disability), **5B** (Fasting ≠ Starvation), **7A** (Depression reduces capability).
  *   **The View:** Equality is about the substantive *freedom* to do and be. It's not about the stuff (Resources) or the feeling (Welfare), but the real opportunity to function. Sam (fasting) has the capability to eat; Robin does not. Dana (depression) lacks the capability to work, even if the job exists.
  *   **Logical Space:** Focuses on *freedom to achieve*. The list of capabilities is flexible/context-dependent.
  *   **Stability:** Highly stable, but can be vague about which capabilities count.

  **Leaf 5: The Capability Currency (Fixed)**
  *   **Profile:** **4A** (Compensate disability), **5A/C** (Fasting might still be a deprivation if nutrition is a threshold), **7A** (Depression blocks central functions).
  *   **The View:** Similar to Leaf 4, but insists on a specific, fixed list of central human functions (e.g., health, affiliation, nutrition) that must be secured for dignity. If you fast, you might be voluntarily foregoing a central functioning required for a dignified life.
  *   **Logical Space:** Focuses on *thresholds of specific freedoms*.
  *   **Stability:** Risks paternalism (imposing a list on everyone).

  **Leaf 6: The Access to Advantage (Midfare) Currency**
  *   **Profile:** **4A** (Compensate disability), **2B** (No compensation for tastes), **5B** (Fasting ≠ Starvation).
  *   **The View:** A middle ground. We equalize neither welfare nor resources, but the *power* to convert resources into welfare. Jordan (wheelchair) has less "access to advantage" than Taylor with the same money, so they get more. Alex (wine) has the same access as Blair, just chooses to use it differently.
  *   **Logical Space:** Focuses on the *interface* between person and resource.
  *   **Indistinguishability Flag:** This is logically very close to **Leaf 4 (Capability Open)**. The distinction is subtle: Midfare focuses on the *power* (the bridge), Capability focuses on the *destination* (the set of functionings). In practice, they often recommend the same policies.

  **Leaf 7: The Fallback Position (Security)**
  *   **Profile:** **8A** (Prioritize security), **10B** (Maximin), **6A** (Protect against brute luck).
  *   **The View:** The currency of equality is the *depth of the worst-case hole*. It doesn't matter how high the peak is; what matters is how bad the floor is. This is less about "how much you have" and more about "how safe you are from ruin."
  *   **Logical Space:** Focuses on the *minimum guaranteed status*.
  *   **Collapse Warning:** This often collapses into **Leaf 2 (Opportunity Welfare)** viewed ex-ante (security is just a type of prospect) or **Prioritarianism** (weighting the worst-off). As a distinct *currency*, it is stable only if you value security independently of welfare levels.

  **Leaf 8: The Recoverability (Resilience) Currency**
  *   **Profile:** **8C** (Prioritize bounce-back speed), **9C** (Focus on stages/slices), **6A** (Protect against irreversible loss).
  *   **The View:** The currency is not your level, but your *trajectory after a shock*. Frank (Leaf 8 case) is better off than Grace not because he is richer, but because his life is more robust. Equality means equalizing the ability to return to baseline.
  *   **Logical Space:** Focuses on *dynamic stability* rather than static levels.
  *   **Collapse Warning:** This risks collapsing into **Leaf 1 (Actual Welfare)** over time (resilience is just maintaining welfare). To remain distinct, you must value the *capacity to recover* even if the welfare dip is painless.

  ***

  # Instructor's Notes on the Tree Structure

  **1. The Empty Slots**
  *   **Strict Functioning View:** There is a logical space for a view that says "We must equalize actual doings, regardless of freedom." (e.g., Force Sam to eat). This slot is effectively empty in liberal theory because it violates autonomy. If a student lands here, they are likely conflating Welfare with Functioning.
  *   **The "Talents" Gap:** As noted in Leaf 3, the Resources/Primary Goods split is invisible here. If you want to pry them apart, add a case about a naturally gifted pianist vs. a hard-working one. Resources says the pianist owns their talent; Primary Goods says talent is a common asset.

  **2. The Experimental Leaves (Fallback & Recoverability)**
  *   **Do they collapse?**
      *   **Fallback:** Often collapses into **Prioritarianism** (a weighting view, not a currency) or **Opportunity Welfare** (security is a good). It survives as a distinct currency only if "Security" is valued independently of the welfare it secures.
      *   **Recoverability:** Often collapses into **Welfare** (long-term). It survives as distinct only if the *process* of recovery is valued (e.g., dignity in resilience) separate from the outcome.
  *   **Why keep them?** They capture modern intuitions about precarity that static currencies (Resources/Welfare) miss. Even if they theoretically reduce to other leaves, they diagnose a different *concern* in the students.

  **3. The Indistinguishable Pairs**
  *   **Resources vs. Primary Goods:** You cannot separate these without a question on natural endowments. Treat them as a single "Means-Based" cluster for this seminar.
  *   **Midfare vs. Open Capability:** Cohen's "Access to Advantage" and Sen's "Capability" are neighbors. The quiz distinguishes them only if a student cares about the *power* (Midfare) vs. the *freedom* (Capability). In 90% of cases, these students will vote identically. Flag this as a live debate in the field, not a clear split in intuition.

  **4. Routing the Sufficientarians**
  *   **Question 1** is your filter. If a student argues "The gap between 0.9 and 1.0 doesn't matter, only survival matters," they are not arguing for a *currency* of equality. They are arguing against the *telos* of equality. Route them to a discussion on "Enough vs. Equal" rather than forcing them into the Welfare/Resources tree.
