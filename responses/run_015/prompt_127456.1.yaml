answer: |-
  So picture this: There's an off-the-books thing called the Cantonal-Länder-State Tribunal. Meets in a basement in Bern, behind a fondue place that smells like old paper and stale coffee. Their whole job is issuing binding ratings on whether a policy is genuinely local or just "Central-Government Cosplay."

  Last week they reviewed a infrastructure bill. 

  The US rep goes, "Hey, this is state level. 10th Amendment reserved powers, blah blah. The feds just incentivize it."
  Tribunal marks it: **Cosplay**. Reason: If the center holds the purse strings, it's not reserved, it's rented.

  The EU rep goes, "Wait, principle of conferral. We only act if objectives can't be achieved by members. We are legally incapable of bloat."
  Tribunal marks it: **Cosplay**. Reason: The ECJ (a central body) decides what objectives "can't be achieved." You don't own the boundary, the center does.

  The German rep says, "In Germany, the Länder administer federal law. It's cooperative federalism. We admit the center writes the rules."
  Tribunal marks it: **Genuine**. Reason: Honesty points. You aren't pretending it's local.

  Then the Swiss Chair drops the verdict on the Tribunal itself.
  "We ruled that a central body deciding what counts as 'local' is the ultimate violation of subsidiarity."

  So they dissolved themselves.
  But then the US rep asks, "Who appeals the dissolution? What's the supreme law now?"
  Swiss guy shrugs. "Nobody. We just voted on it. Direct democracy trumps your reserved powers."

  Turns out the only way to prove subsidiarity is to let the people fire the referees. Definetly not efficient, but accurate.
