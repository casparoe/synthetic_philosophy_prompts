      *   Check the "Progress" requirement: Give a specific conceptual tool they can use in the next meeting. The "Jurisdiction vs. Amenity" distinction seems strong.

  *(Self-Correction during drafting)*: I initially thought about bringing in "property rights." But the prompt says the Local side talks about "community character," not just "my property." So I need to focus on the *collective* right, not individual property rights. The user's intuition about "collective moral agent" is the key to unlock this. I will center the response on that.

