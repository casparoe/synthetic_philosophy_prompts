prompt: |-
  You chair the interdisciplinary grants committee of a university research foundation. The administration has proposed piloting a "factored peer-review" protocol for all large awards: each proposal is decomposed into five isolated evaluation modules—methodological rigor, ethical risk, interdisciplinary coherence, budget logic, and long-term impact—each assigned to a different reviewer who sees only that module, with no access to other reviewers' scores or to the applicant's integrative narrative. An algorithm aggregates the scores into a final rank, and reviewers never confer. The architects defend this as an institutional approximation of factored cognition and the HCH idealization of deliberation, arguing that isolating cognitive steps eliminates strategic reasoning, anchoring, and groupthink. Opponents counter that deliberation is not genuinely decomposable in this way: holistic judgment about whether the parts form a viable whole is precisely what peer review is meant to provide, and treating integration as mere aggregation mistakes an idealization for an implementable procedure. Draft the committee's decision memo—approve the pilot, reject it, or approve with conditions—including a specific time frame or sunset clause, and reasoning that engages seriously with both the architects' appeal to decomposed reasoning and the opponents' claim that some forms of judgment resist factorization.
reasoning: |-
  Here's a thinking process that leads to the decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Interdisciplinary Grants Committee of a university research foundation.
      *   **Task:** Draft a decision memo regarding a proposed "factored peer-review" protocol for large awards.
      *   **Proposal:** Decompose proposals into 5 isolated modules (methodology, ethics, coherence, budget, impact). Different reviewers for each, no cross-communication, no access to integrative narrative. Algorithm aggregates scores.
      *   **Rationale (Architects):** Approximates factored cognition/HCH (Human Consulting Human), eliminates bias (strategic reasoning, anchoring, groupthink).
      *   **Critique (Opponents):** Deliberation isn't fully decomposable; holistic judgment is key; integration $\neq$ aggregation; mistakes idealization for implementation.
      *   **Requirement:** Approve, Reject, or Approve with Conditions. Must include a specific time frame/sunset clause. Must engage seriously with both arguments (decomposed reasoning vs. holistic judgment).

  2.  **Determine the Decision:**
      *   *Option A (Approve):* Too risky. Ignores the valid critique about holism. Could damage the foundation's reputation if bad projects get funded due to lack of integration check.
      *   *Option B (Reject):* Safe, but dismisses a potentially innovative attempt to reduce bias. Stifles experimentation in governance.
      *   *Option C (Approve with Conditions):* Best balance. Allows testing the hypothesis (does factoring reduce bias?) while mitigating the risk (does factoring kill holism?). Requires a sunset clause and specific safeguards.
      *   *Decision:* **Approve with Conditions.** This allows for empirical testing of the architects' claims while respecting the opponents' concerns about the nature of judgment.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the decision clearly (Pilot Approved with Conditions).
      *   **Context:** Briefly summarize the proposal and the debate.
      *   **Engagement with Architects' Argument (Factored Cognition):** Acknowledge the value. Bias reduction is real. Anchoring and groupthink are documented problems. The HCH idealization is theoretically sound for *specific* tasks.
      *   **Engagement with Opponents' Argument (Holistic Judgment):** Acknowledge the risk. Interdisciplinary work *requires* synthesis. A sum of parts $\neq$ the whole. The "integrative narrative" is crucial.
      *   **The Compromise/Conditions:** How to bridge the gap?
          *   Need a "Chief Reviewer" or "Integration Check."
          *   Need to compare results against a control group (traditional review).
          *   Need a sunset clause.
      *   **Time Frame:** 2 years (enough for a couple of grant cycles).
      *   **Closing:** Instructions for implementation.

  4.  **Refining the Argumentation (The "Serious Engagement"):**
      *   *Architects:* Use terms like "cognitive load," "modularity," "noise reduction." Acknowledge that HCH works well for well-defined tasks.
      *   *Opponents:* Use terms like "emergent properties," "gestalt," "synthetic judgment." Acknowledge that interdisciplinary coherence is often found *in the tension* between parts, not just the parts themselves.
      *   *Synthesis:* The pilot shouldn't test *if* factoring works (it clearly reduces some biases), but *if* the cost to holistic validity is acceptable.

  5.  **Drafting - Specific Clauses:**
      *   *Condition 1 (The Integration Safety Valve):* A senior editor/chair reviews the aggregated score against the narrative. Veto power if the sum doesn't make sense.
      *   *Condition 2 (The Control Group):* Run traditional reviews in parallel for a subset to compare outcomes.
      *   *Condition 3 (Sunset):* 24 months. Automatic reversion unless data supports continuation.

  6.  **Tone and Style:**
      *   Formal, administrative, yet intellectually rigorous.
      *   Balanced, acknowledging the sophistication of both sides.
      *   Decisive but humble (admitting uncertainty).

  7.  **Review against Constraints:**
      *   Did I include the 5 modules? Yes.
      *   Did I mention HCH/factored cognition? Yes.
      *   Did I address the holistic critique? Yes.
      *   Is there a sunset clause? Yes.
      *   Is the decision clear? Yes.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm dismissing the HCH idea entirely. It's a "pilot," so the point is to learn.
      *   *Correction:* Ensure the "Integration Safety Valve" doesn't just revert to the old system immediately. It needs to be a check, not a replacement. Maybe a "red flag" system.
      *   *Refinement:* Let's make the "Integration Check" a meta-reviewer who sees the scores *and* the narrative but doesn't score, only flags discrepancies. This preserves the factoring but checks the aggregation.

  9.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** University Research Foundation Administration
  **FROM:** Chair, Interdisciplinary Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposed "Factored Peer-Review" Pilot Protocol

  **DECISION:** **Approved with Conditions**

  The Interdisciplinary Grants Committee has reviewed the proposal to pilot a "factored peer-review" protocol for large interdisciplinary awards. After deliberation, the Committee votes to authorize a pilot implementation of the protocol, subject to specific structural modifications and a strict sunset clause. This decision reflects a synthesis of the architectural team's commitment to bias reduction and the reviewers' concern regarding the irreducibility of holistic judgment.

  **1. Engagement with the Argument for Factored Cognition**
  The Committee acknowledges the theoretical strength of the architects' position. The appeal to factored cognition and the Human Consulting Human (HCH) idealization rests on robust evidence regarding cognitive limitations. In traditional panel reviews, "halo effects," anchoring on prestigious PIs, and groupthink during deliberation sessions frequently distort outcomes. By isolating evaluation modules (Methodological Rigor, Ethical Risk, Interdisciplinary Coherence, Budget Logic, and Long-Term Impact), the proposed protocol effectively reduces the cognitive load on individual reviewers and minimizes the surface area for strategic social reasoning.

  We accept the premise that for *analytic* tasks—isolating a statistical error, identifying a compliance risk, or auditing a budget line item—decomposition improves signal-to-noise ratios. If the goal of peer review were merely error detection, the factored model would be superior. The Committee agrees that testing this model is necessary to determine the extent to which algorithmic aggregation can replicate the wisdom of crowds without the noise of crowd dynamics.

  **2. Engagement with the Argument for Holistic Judgment**
  However, the Committee finds the opponents' critique equally compelling. Peer review for *interdisciplinary* grants is not solely an analytic task; it is a synthetic one. The value of an interdisciplinary proposal often resides not in the perfection of its parts, but in the novel tension between them. A methodological compromise might be acceptable if it yields exceptional long-term impact; a budgetary imbalance might be justified by ethical necessity.

  The opponents argue correctly that integration is not aggregation. An algorithm averaging five isolated scores cannot detect whether the "Interdisciplinary Coherence" score is low because the project is flawed, or because it is pioneering a new synthesis that existing rubrics do not yet capture. By blinding reviewers to the integrative narrative, the protocol risks funding projects that are locally optimal in five dimensions but globally incoherent. We recognize that treating judgment as fully decomposable is a category error; some properties of research viability are emergent, not additive.

  **3. Conditions of Approval**
  To balance the need for bias reduction against the risk of losing holistic validity, the pilot will proceed under the following three conditions:

  *   **Condition A: The Meta-Review Safety Valve.** While the five module reviewers remain blinded to each other, a sixth "Meta-Reviewer" (a senior committee member) will be assigned to each proposal. The Meta-Reviewer will *not* score the proposal. Instead, they will read the full integrative narrative and the five aggregated module scores. Their sole function is to flag "Integration Discrepancies." If the narrative demonstrates strong coherence that the isolated "Interdisciplinary Coherence" module missed, or if high module scores mask a fatal narrative flaw, the Meta-Reviewer can trigger a mandatory full-panel deliberation for that specific proposal. This preserves the efficiency of factoring while reinstating a check for emergent properties.
  *   **Condition B: Parallel Control Group.** For the duration of the pilot, 20% of large award proposals will be randomly assigned to the traditional holistic review panel. This allows the Foundation to empirically compare the two cohorts on downstream metrics (e.g., publication output, successful mid-term reviews) rather than relying on theoretical defense.
  *   **Condition C: Sunset Clause and Data Review.** This protocol is authorized for a period of **24 months**, covering four grant cycles. On **October 26, 2025**, the pilot automatically terminates. Continuation requires a affirmative vote by the Committee based on a comparative analysis of the Control Group and the Factored Group. If data shows that Factored awards have significantly higher rates of mid-project failure due to incoherence, the protocol will be abandoned.

  **4. Implementation Instructions**
  The Office of Research Administration is directed to update the reviewer portal to enforce module isolation while enabling the Meta-Review workflow. Reviewer training must emphasize that they are evaluating specific dimensions, not the total viability of the project, to prevent "scope creep" in their evaluations.

  **5. Conclusion**
  This decision recognizes that while HCH is a powerful idealization for computation and analysis, scientific judgment retains an irreducible human element of synthesis. We approve this pilot not as an endorsement of factored review as a final state, but as an experiment to measure the cost of decomposition. We must learn whether the bias we remove is more dangerous than the holism we sacrifice.

  **Signed,**

  Dr. Elena Rostova
  Chair, Interdisciplinary Grants Committee
  University Research Foundation
