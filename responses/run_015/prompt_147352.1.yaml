      *   This challenges the coherence of relational facts and the unity of propositions (how subject and predicate unite).
      *   Implication 1: The regress suggests that relations cannot be treated as separate entities alongside their terms without losing the unity of the fact.
      *   Implication 2: If the tie is external, unity is impossible; thus, the tie must be internal or non-relational.
      *   Implication 3: Treating the tie as internal to the act of judgment (rather than a constituent) shifts the locus of unity from ontology to psychology or logic.
      *   Implication 4: This distinction highlights the difference between analytic unity (conceptual containment) and synthetic unity (actual combination in judgment).
      *   Implication 5: Ultimately, it suggests that propositional unity is primitive or sui generis, not reducible to a sum of parts.

