      *   *Item 2 (Ontological implication):* Consequently, the coherence of judgment implies that the connecting relation cannot be an external entity but must be ontologically inseparable from the terms it unites within the fact.
      *   *Item 3 (Internal vs. External/Act):* Treating the relational tie as internal to the propositional act rather than an additional constituent avoids the regress by positing unity as a feature of the judging mind instead of the objective world.
      *   *Item 4 (Analytic vs. Synthetic):* This shift suggests that synthetic unity requires an active synthesis by the subject that cannot be reduced to the analytic containment of predicates within a subject concept.
      *   *Item 5 (Conclusion on Unity):* Ultimately, the regress forces the conclusion that propositional unity is a primitive, indefinable feature of judgment that precedes the distinction between its constituent parts.

