answer: |-
  Here is a complete session plan designed to hit your constraints, incorporate your two wrinkles, and force the inconsistency into the open without relying on aggregate data.

  ### Session Overview
  *   **Goal:** Demonstrate that preferences violate the Sure Thing Principle due to *ambiguity* (unknown probabilities), not *risk* (known probabilities), and that maintaining these preferences leads to dynamic inconsistency (paying to undo a choice).
  *   **Time:** 75 Minutes.
  *   **Materials:**
      *   3 Opaque Containers (Urns A, B, C).
      *   100 Red balls, 100 Black balls (poker chips or paper balls work).
      *   24 Index Cards, pre-numbered 1–24.
      *   1 Envelope (for Urn C data).
      *   1 Coin.
      *   Payoffs: 1 Bag of good chocolate (approx. 100 pieces), 1 Nice Prize (Book Token/Bottle).
      *   Projector (for instructions only).

  ### The Setup (Crucial for Honesty)
  To avoid the "you're rigging it" accusation without lying:
  1.  **Urn A (Known):** Load it in front of them. 50 Red, 50 Black.
  2.  **Urn B (Mystery):** Load this *before class* behind a screen. Use all 100 balls, but split them according to a number you generated privately and **did not write down**. You genuinely do not know the mix. Tell them: *"I filled this behind a screen. There are 100 balls. I do not know the ratio. I cannot tell you because I do not know."*
  3.  **Urn C (Sealed Risk):** Load this *at the start of class* in front of them. Use a random number generator on the projector to determine the split (e.g., roll for number of Reds). Put the balls in, seal the composition data in the Envelope, and tape it to the urn. Tell them: *"This is risk, not ambiguity. The odds are fixed by the dice, but the information is sealed. No one, including me, will open this envelope today."*

  ### Payoff Structure
  *   **Endowment:** Hand out **3 pieces of chocolate** to every student at the start. This is their bankroll.
  *   **Winning:** A correct prediction wins **+1 chocolate**.
  *   **The Fee:** The "Swap" option costs **-1 chocolate**. (If they run out, they go into debt—promise to deduct from future classes or just let them go negative for the sake of the experiment).
  *   **The Grand Prize:** At the very end, draw one card number (1–24) from a hat. That student wins the Book Token/Bottle. *This ensures every decision matters to everyone.*

  ---

  ### Minute-by-Minute Timeline

  #### 00:00 – 00:10: Setup & Endowment
  *   Hand out numbered index cards. Tell students: *"Keep this card. Do not lose it. Your number is your identity for the prize draw."*
  *   Hand out 3 chocolates each.
  *   Display the three urns. Explain the composition honestly (as per Setup above).
  *   **Rule:** "You are betting on drawing a **Red** ball unless I say otherwise. You write your choice on the card. I will draw from the urn you pick. If Red, you get chocolate."

  #### 00:10 – 00:25: Phase 1 — Risk vs. Ambiguity (The Urn Test)
  *   **Q1 (Card Section 1):** "Choose **Urn A** (Known) or **Urn C** (Sealed) for a Red ball."
      *   *Purpose:* Establish baseline risk tolerance. If they treat Sealed (C) differently from Known (A), they are averse to *hidden information*. If they treat them the same, they understand objective risk.
  *   **Q2 (Card Section 2):** "Choose **Urn A** (Known) or **Urn B** (Mystery) for a Red ball."
      *   *Purpose:* The classic Ellsberg move. Most will pick A.
  *   **Action:** Collect cards? **No.** They keep the cards. You need them to see their own answers later.
  *   **Draw:** Actually draw from the chosen urns now to pay out the chocolates. (Draw from A once, C once, B once).
      *   *Note:* This makes the risk real immediately.

  #### 00:25 – 00:45: Phase 2 — The Contradiction (Red vs. Black)
  *   **Q3 (Card Section 3):** "Now you win if the ball is **Black**. Choose **Urn A** (Known) or **Urn B** (Mystery)."
  *   **The Trap:** Most students who picked A for Red will pick A for Black.
  *   **Wait:** Do not draw yet. Hold the tension.
  *   **Instruction:** "Look at Q2 and Q3 on your card. If you chose Urn A for both, circle that pair. If you chose Urn B for both, circle that pair. If you switched (A then B, or B then A), put a star next to it."
  *   **Debrief Point 1 (Brief):** Ask for a show of hands: "Who circled Urn A for both Red and Black?" (Expect ~60-70%). "Who put a star?" (Expect very few).
  *   **Say:** "Hold that thought. Mathematically, preferring A for Red and A for Black implies you think Urn B has *less than* 50 Reds AND *less than* 50 Blacks. That sums to less than 100 balls. But there are 100 balls. We will return to this."

  #### 00:45 – 01:00: Phase 3 — The Coin Flip Swap (Dynamic Inconsistency)
  *   *This uses your second wrinkle. Explain slowly.*
  *   **Q4 (Card Section 4):** "We are ignoring the urns for a moment. I have a Coin."
      *   **Ticket X:** Wins if (Coin=Heads AND Urn B=Red) OR (Coin=Tails AND Urn B=Black).
      *   **Ticket Y:** Wins if (Coin=Heads AND Urn A=Red) OR (Coin=Tails AND Urn A=Black).
      *   **Question:** "Mathematically, both tickets have exactly a 50% chance of winning, regardless of what is in Urn B. Which ticket do you prefer? (X or Y or Indifferent)."
  *   **The Event:** Flip the coin publicly. Let's say it lands **Heads**.
  *   **Q5 (Card Section 5):** "The coin is Heads. Your ticket now depends *only* on Urn B being Red (if you held X) or Urn A being Red (if you held Y)."
      *   **The Offer:** "If you held Ticket X (Urn B), would you pay **1 chocolate** to swap to Ticket Y (Urn A)?"
      *   **Instruction:** "Write 'Yes' or 'No'. If you write Yes, subtract 1 chocolate from your pile now."
  *   **Action:** Have them physically hand over the chocolate if they said Yes. This makes the cost visceral.

  #### 01:00 – 01:15: The Reveal & Debrief
  *   **Self-Audit (5 mins):** Ask students to look at their own cards.
      *   "If you preferred Ticket Y in Q4 (or were indifferent), but paid to swap in Q5: You paid to resolve a preference you didn't hold 10 minutes ago."
      *   "If you chose Urn A for Red (Q2) and Urn A for Black (Q3): You believe Urn B is biased against Red AND biased against Black."
  *   **The Philosophical Mapping (10 mins):**
      *   **Risk vs. Ambiguity:** Point to Q1 vs Q2. "If you treated Urn C (Sealed) like Urn A, but Urn B worse, you aren't afraid of *risk*. You are afraid of *ambiguity* (unknown probabilities). Risk aversion doesn't explain this."
      *   **The Sure Thing Principle:** "In Q4, the Coin outcome (Heads/Tails) is independent of the Urn. By the Sure Thing Principle, your preference between Urn A and Urn B should not change based on the coin flip. But for many of you, it did. Once the coin landed, the 'Mystery' felt heavier."
      *   **The Money Pump:** "In Q5, those who paid the chocolate fee effectively paid to undo a state they implicitly accepted in Q4. If we ran this loop forever, you would give me all your chocolate and end up with the same ticket you started with."
  *   **Limitations (Honest Note):**
      *   "Does this prove you are irrational? No. It proves your preferences violate *Subjective Expected Utility* theory. Maybe SEU is the wrong model for human reasoning. Maybe ambiguity aversion is a useful heuristic in the real world (where 'unknown mix' often means 'adversarial mix')."
      *   "Does this prove I didn't rig Urn B? No. You have to trust my integrity. But even if I did rig it, the *structure* of your choice reveals how you process uncertainty."
  *   **Closing:** Draw the winning card number for the Big Prize. Collect cards (optional, if you want to keep data) or let them keep as souvenirs.

  ---

  ### Predicted Pitfalls & Fixes

  **1. "The TA is lying about Urn B."**
  *   *Prediction:* One skeptic will derail the class claiming Urn B is 100% Black.
  *   *Fix:* Address this in the intro. "If you believe I am adversarial, you should pick Urn A every time. That is a rational strategy against a liar. But this course assumes we are modeling decisions under *uncertainty*, not *deception*. Please bracket the trust issue for the sake of the argument."

  **2. Confusion on the Coin Ticket (Q4).**
  *   *Prediction:* Students won't see why Ticket X is 50%.
  *   *Fix:* Write the truth table on the board.
      *   Heads + Red = Win
      *   Heads + Black = Lose
      *   Tails + Red = Lose
      *   Tails + Black = Win
      *   "Since Red+Black = 100%, exactly one of these must happen. It is 50/50."

  **3. Students run out of chocolate for the Fee.**
  *   *Prediction:* They want to swap but have no chocolate.
  *   *Fix:* Allow "Debt." Write "-1" on their card. Tell them debt reduces their chance of the Big Prize (e.g., if they are drawn, they must eat a lemon or do a dare to claim it). Or just let it slide, but emphasize the *willingness* to pay is the data point.

  **4. Time Overrun.**
  *   *Prediction:* The Coin Flip explanation eats 20 minutes.
  *   *Fix:* If you pass 00:45 and haven't flipped, skip the physical chocolate payment for the swap. Ask them to write "Would Pay" hypothetically. It's less visceral but saves 5 minutes.

  ### What This Session Shows (and What It Doesn't)

  **It Shows:**
  *   **Ambiguity Aversion is Distinct from Risk Aversion:** By using Urn C (Sealed), you isolate the variable. If they treat Sealed (Risk) same as Known, but Mystery (Ambiguity) worse, it's not the *variance* they dislike, it's the *missing probability measure*.
  *   **Violation of Reduction of Compound Lotteries:** In Q4, the compound lottery (Coin + Urn) should reduce to a simple 50% lottery. If they treat it differently than a simple 50% lottery, they violate reduction.
  *   **Dynamic Inconsistency:** Paying to swap after the coin flip implies their preference ordering changed without new relevant information (the coin was independent).

  **It Does Not Show:**
  *   **Irrationality:** It does not prove they *should* change their minds. It proves they cannot be modeled by a single subjective probability distribution. (Gilboa-Schmeidler MaxMin Expected Utility can model this perfectly well).
  *   **Universal Truth:** Some students will be Expected Utility maximizers. They will pick randomly or consistently. That's fine. The lesson is about the *pattern* of the group and the *axioms* being tested.

  ### TA Script Snippet for the Debrief (The "Aha" Moment)
  *"Look at your card. In Q2, you said Urn A is better than Urn B for Red. In Q3, you said Urn A is better than Urn B for Black. If I asked you to bet on 'Red or Black' from Urn B, you'd say 'That's 100%'. But you just told me you'd rather bet on 'Red or Black' from Urn A. Why? Urn A is also 100%. You preferred the Known 100% over the Unknown 100%. That isn't risk. That is a discomfort with the unknown structure of the world. And in Q5, some of you paid chocolate to move from the Unknown to the Known *after* the coin landed. But the coin didn't change the Urn. You paid for peace of mind, not for odds. Decision theory calls that a violation of the Sure Thing Principle. Psychology calls it ambiguity aversion. Both agree: standard Expected Utility theory breaks here."*
