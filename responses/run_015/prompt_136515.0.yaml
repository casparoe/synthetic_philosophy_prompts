      *   *Absolute Numbers Critique:* Total mortality biomass vs. per-capita mortality rate. $N$ (population size) is increasing, so $N \times \mu$ might stay constant or rise even if $\mu$ drops.
      *   *Data Quality:* Sampling effort, detection probability ($p$), census intervals, taphonomic bias (fossil/archaeological record).
