answer: |-
  ### Q&A Prep Sheet

  **1. The "Leges Strictae" Objection (Kant Scholar)**
  *   **Likelihood:** High | **Damage:** High
  *   **The Question:** "You're hanging your hat on the distinction between Preliminary and Definitive Articles. But Kant explicitly calls the Preliminaries *leges strictae* (strict laws) that hold immediately, not *leges latae* (broad laws) that allow for exception. Are you really arguing that a strict prohibition on interference becomes optional just because we haven't reached the Definitive Articles yet? Doesn't that undermine the whole architecture of *Perpetual Peace*?"
  *   **Two-Minute Reply:** "I'm not arguing they are optional. I'm arguing they are conditional on the existence of a 'state' in the moral sense. The 5th Article prohibits interfering in a *constitution and government*. When a regime collapses into mass atrocity or civil war, it has arguably ceased to function as a rightful constitutional order and has reverted to a state of nature internally. The *lex stricta* protects rightful constitutions; it does not protect warlords who have dissolved the civil condition. My reading preserves the strictness of the law by clarifying its object: it protects *right*, not mere sovereignty."
  *   **Weakest Point:** Kant does suggest even bad states deserve non-interference to avoid endless war. You are betting on the definition of "constitution" doing heavy lifting.
  *   **Concession Advice:** Concede immediately that the Preliminaries are binding. Do not try to downgrade them to mere suggestions. Fight on the *definition* of the object protected, not the *status* of the law.

  **2. The Rebellion/Intervention Asymmetry (Kant Scholar/Just War)**
  *   **Likelihood:** Medium | **Damage:** Fatal
  *   **The Question:** "Kant famously forbids subjects from rebelling against their sovereign, even a tyrannical one, because it destroys the source of law. If the subjects themselves lack the right to use force to stop atrocities, on what basis do you grant *external* states that right? Aren't you giving outsiders more authority over a population than the population has over itself?"
  *   **Two-Minute Reply:** "This is the core tension, but the asymmetry is functional, not moral. Subjects cannot rebel because there is no higher adjudicator within the state to judge the rebellion—it's self-judgment. External intervention, in my reading, is only permissible when authorized by the emerging Federation of Republics. It's not unilateral vigilante justice; it's the enforcement of cosmopolitan right by a collective body. The external actor acts as the proxy for the 'general united will' that the tyrant has suppressed."
  *   **Weakest Point:** Kant is skeptical of the Federation having coercive power (*imperium*). You are smuggling in a world state logic that Kant explicitly rejects.
  *   **Concession Advice:** Do not concede this fully. Acknowledge the tension but insist that without this mechanism, cosmopolitan right is toothless.

  **3. The Criteria Objection (Just War Theorist)**
  *   **Likelihood:** High | **Damage:** Medium
  *   **The Question:** "Okay, let's say Kant allows it. Walzer gives us clear criteria for intervention (supreme emergency, etc.). What are *Kant's* criteria? If you open this door, how do you prevent powerful republics from using 'humanitarianism' as a pretext for imperialism, which Kant feared more than anything?"
  *   **Two-Minute Reply:** "Kant's criteria are institutional, not just situational. It's not about whether the atrocity is bad enough, but whether the intervention preserves the possibility of a future Federation. Unilateral intervention is still out. The criteria is: does this action bring us closer to a condition of public right, or does it return us to the state of nature? This is stricter than Walzer. It forbids 'good' wars if they undermine the long-term institutional peace. It adds a systemic constraint that Just War theory often lacks."
  *   **Weakest Point:** This is vague. "Preserving the Federation" is hard to calculate in real-time.
  *   **Concession Advice:** Concede that Kant offers fewer *tactical* criteria than Walzer, but argue he offers superior *strategic* criteria.

  **4. The Normative Work Objection (Constructivist)**
  *   **Likelihood:** Medium | **Damage:** Medium
  *   **The Question:** "You're doing textual exegesis, but does this reading actually do any work for R2P today? If Kant's condition for intervention is a Federation of Republics that doesn't exist, isn't this just a philosophical fantasy that undermines actual norms we have now?"
  *   **Two-Minute Reply:** "It does work because it shifts the normative burden from 'sovereignty as control' to 'sovereignty as responsibility to the Federation.' It provides a philosophical grounding for why the UN Security Council matters—not because it's powerful, but because it's the embryonic form of the *foedus pacificum*. It tells constructivists that the norm of non-intervention isn't being violated by R2P; it's being fulfilled because the condition of rightful constitution has failed."
  *   **Weakest Point:** The UN is not Kant's Federation.
  *   **Concession Advice:** Concede the UN isn't the Federation, but argue it's the only game in town for approximating the "general united will."

  ***

  ### The Question You Should Pray Nobody Asks

  **"If a state collapses into civil war, doesn't Kant argue that other states should wait for the internal conflict to resolve itself to avoid contaminating the international system? Doesn't your argument justify the very kind of partisan interference Kant blamed for the wars of the French Revolution?"**

  *   **Why this kills you:** You admit in your prompt that you don't have a clean answer for this. It hits the exact spot where your "requirement to intervene" clashes with Kant's fear of escalation. If you say "intervene," you look like a neo-con Kantian. If you say "wait," your thesis collapses.
  *   **How to dodge (if asked):** Pivot to the *type* of civil war. Distinguish between a war for succession (wait) and a war of extermination (intervene). But be warned: this is your soft underbelly.

