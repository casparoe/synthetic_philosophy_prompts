answer: |-
  Here is a four-step procedure designed for two administrators working under a deadline, followed by the application to your three cases.

  ### The Universalization Checklist

  **Step 1: Write the Rule (The Maxim)**
  Draft a single sentence describing the action. It must follow this format: *"An agent may [ACTION] when [CONDITIONS] in order to [GOAL]."*
  *   **How general?** Include facts that change the moral weight (e.g., "with seller consent," "after a deadline"). Exclude facts that are just about you (e.g., "to meet my quota," "because I'm faster").
  *   **The Test:** If you remove a detail, does the situation feel morally different? If yes, put it back. If no, leave it out.
  *   *Example:* Not "I will lie," but "An agent may claim there are other offers when there are none in order to speed up a sale."

  **Step 2: The Breakage Test (Logical/Practical Contradiction)**
  Imagine every agent follows this rule everywhere, all the time. Does the action become impossible or meaningless?
  *   **Fail:** If everyone did this, the practice would vanish or the words would lose meaning (e.g., bluffing about price).
  *   **Pass:** The action is still physically possible and retains its meaning.
  *   *Handles Wrinkle:* This catches self-defeating moves and "free-riding" (if everyone cuts the line, the line doesn't exist).

  **Step 3: The Trust Test (Systemic Viability)**
  Imagine every agent follows this rule. Would the public still trust agents enough to use the system?
  *   **Fail:** Clients would stop believing agents, hide information, or refuse to participate.
  *   **Pass:** The market still functions; clients still see value in hiring an agent.
  *   *Handles Wrinkle:* This catches moves that are logically possible but destroy the profession's reputation.

  **Step 4: The Swap Test (Recipient Perspective)**
  Imagine you are the client (buyer or seller) in this scenario, and every agent treats you this way. Would you accept it as fair?
  *   **Fail:** You would feel coerced, cheated, or disadvantaged.
  *   **Pass:** You might not like it, but you would accept it as a fair rule of the game.
  *   *Handles Wrinkle:* This catches high-pressure tactics that are "thinkable" but exploitative.

  **Decision Logic:**
  *   If **Step 2 fails**: Ruling is **No**. (Do not pass go).
  *   If **Step 2 passes** but **Step 3 fails**: Ruling is **No**.
  *   If **Steps 2 & 3 pass** but **Step 4 fails**: **Hand-Off**. This is a values question. Vote based on whether efficiency outweighs comfort.
  *   If **All pass**: Ruling is **Yes**, provided it doesn't contradict existing written law.

  ***

  ### The Ruling Template
  *To meet your constraint of one paragraph, plain language, no jargon:*

  > "The Committee has reviewed whether [ACTION] is consistent with the Code. We apply a standard of consistency: if a practice is acceptable, it must be sustainable if used by every member in similar circumstances. We found that [REASON FOR FAILURE OR SUCCESS]. Therefore, [FINAL RULING]. Members should instead [ALTERNATIVE ACTION IF APPLICABLE]."

  ***

  ### Application to Three Live Queries

  #### Case 1: "Fake Interest" (Current Guidance: Permitted)
  *   **The Rule:** "An agent may tell a buyer there is other interest when there is none in order to speed up a sale."
  *   **Breakage Test:** **Fail.** If every agent claimed interest that didn't exist, the phrase "there is interest" would become noise. Buyers would ignore it, rendering the tactic useless and the communication channel broken.
  *   **Trust Test:** **Fail.** Buyers would assume agents are always bluffing, eroding trust in the entire negotiation process.
  *   **Ruling:** **No.** (This contradicts your current guidance).
  *   **Draft Ruling:**
      > "The Committee has reviewed whether stating there is competing interest when none exists is consistent with the Code. We apply a standard of consistency: if a practice is acceptable, it must be sustainable if used by every member in similar circumstances. We found that if all agents routinely claimed false interest, buyers would cease to believe such statements, rendering the communication meaningless and damaging trust in the profession. Therefore, this practice is prohibited. Members should instead share verified details of competing offers or simply state that the property is attracting attention without confirming specific bids."

  #### Case 2: "The Early Bird" (Current Guidance: Unwritten/Gray)
  *   **The Rule:** "An agent may arrive before an open house starts to pitch the seller privately in order to secure the listing before competitors arrive."
  *   **Breakage Test:** **Fail.** This is a free-rider problem. If *every* agent arrived early, the "start time" would effectively vanish. The open house would become a free-for-all scramble, defeating the purpose of a scheduled event.
  *   **Trust Test:** **Fail.** Sellers would feel ambushed and unable to manage the process; competitors would view the association as chaotic.
  *   **Ruling:** **No.**
  *   **Draft Ruling:**
      > "The Committee has reviewed whether approaching a seller prior to a scheduled open house start time is consistent with the Code. We apply a standard of consistency: if a practice is acceptable, it must be sustainable if used by every member in similar circumstances. We found that if all agents ignored scheduled start times to gain early access, the scheduling system would collapse, creating chaos for sellers and unfair competition among members. Therefore, members must respect advertised start times for all marketing events. Members should instead schedule private appointments through the proper channels if early access is required."

  #### Case 3: "The Late Bid Reserve" (Current Guidance: Permitted)
  *   **The Rule:** "An agent may hold a bid received after the deadline in reserve in case the primary deal collapses, provided the seller knows."
  *   **Breakage Test:** **Pass.** Deadlines can still exist even if backups are kept. It doesn't make the concept of a "deadline" impossible, provided the primary winner is chosen by the deadline.
  *   **Trust Test:** **Pass.** As long as the *winner* is chosen fairly by the deadline, keeping a backup doesn't hurt the market.
  *   **Swap Test:** **Pass (with condition).** As a buyer, I would accept this *if* I knew the rules upfront. If the deadline was advertised as "final and no backups," it would fail.
  *   **Hand-Off Point:** The procedure passes, but it depends on transparency. This is a values check on disclosure.
  *   **Ruling:** **Yes, with disclosure.**
  *   **Draft Ruling:**
      > "The Committee has reviewed whether retaining a late offer as a backup after a deadline is consistent with the Code. We apply a standard of consistency: if a practice is acceptable, it must be sustainable if used by every member in similar circumstances. We found that keeping a backup offer does not undermine the deadline process provided the primary selection is made on time and all parties are aware of the possibility. Therefore, this practice is permitted only with explicit seller authorization and transparency to all bidders regarding the process. Members must ensure the advertised terms of the offer date clearly state whether backup offers will be considered."

  ### Where the Test Hands Back to You
  The procedure will not solve conflicts where two "Pass" ratings clash with existing association values. For example, if a tactic passes all three tests but violates a specific clause in your current Code (e.g., "Agents must prioritize speed"), you must vote on whether to amend the Code. The test identifies *ethical consistency*; it does not override *contractual obligations* or *strategic goals* you have already set. Use the procedure to find the ethical floor, but use your judgment to set the professional ceiling.
