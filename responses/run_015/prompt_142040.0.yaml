prompt: |-
  You're a philosopher who works on decision theory and the philosophy of AI. Start by brainstorming four to six angles on this before you commit to one, and say briefly why you dropped the ones you dropped — then write the actual document.

  I need a two-page proposal for a nine-month dissertation fellowship, and my half-formed idea is this. People draw a contrast between approval-directed agents (roughly: do what the overseer would approve of, where approval is a signal a human actually produces) and goal-directed agents (roughly: success is a function of how the world ends up). The standard argument is about whether approval-directedness is safer or whether it degenerates into goal-directedness in the limit. I think that's the wrong fight, because approval is comparative: the overseer approves of option A partly because of what A is sitting next to. Any real approval-directed agent has to pick which options to surface, and the menu it picks partly determines the approval it gets — call this menu-sensitivity. So "do what would be approved" isn't well-defined until you fix a baseline menu, and once you fix the baseline you've built in a view about which options are the relevant alternatives, which looks a lot like a goal. My committee is half philosophers and half ML people, so it has to be legible to both.

  What I want the proposal to do: state the question so it has a determinate answer — something like, is there any notion of approval-directed agency that survives menu-sensitivity, or does the distinction collapse because every well-defined approval-directed agent carries a baseline and a baseline is a goal in disguise? Say why the existing ways of drawing the distinction leave that open. Give the method: what I'd actually do month by month (I can handle a small formal model — overseer with a threshold approval rule, agent choosing a proposal distribution — but I'm not going to build any real systems). Give the two or three possible conclusions and what would decide between them, keep it honest about what fits in nine months, and say what would count as the project failing. Don't put in any citations, I'll fill those in myself.

  One more thing I keep going back and forth on, and you should tell me if it belongs in the proposal at all: approval-directed agency seems to have the opposite information-sensitivity of goal-directed agency — a better-informed agent can end up less approved of, because the overseer judges on what it can see — and that might give me a clean formal test for telling the two apart instead of arguing about it verbally. I'm genuinely unsure weather that's a real result or a quibble.

  Finally: where is this framing most likely to break, and what would change your mind about whether the collapse argument works?
