answer: |-
  **A Taxonomy of Responses to Fairness Impossibility**
  *For the Philosophy Reading Group*

  **Preface:** A taxonomy implies discrete boxes; the reality is a continuum. However, to navigate the impossibility theorem (different base rates + calibration + equal error rates = impossible), we must map the logical exits. Below is a decision tree based on commitments, followed by the resulting positions.

  ### **The Decision Tree**
  *Start: Shared Commitment (Score $S$, Groups $A/B$, Different Base Rates, High Stakes).*

  1.  **Is the target outcome ($Y$) coherently defined?** (e.g., Is "reoffending" distinct from "re-arrest"?)
      *   **No** $\rightarrow$ **Leaf 1: Construct Validity Failure**
      *   **Yes** $\rightarrow$ Go to 2.
  2.  **Is the model's error dominated by fixable instrument noise?** (Signal-to-noise too low for decision threshold?)
      *   **Yes** $\rightarrow$ **Leaf 2: Instrumental Sufficiency**
      *   **No** $\rightarrow$ Go to 3.
  3.  **Are we permitted to use group labels to adjust thresholds?**
      *   **No** $\rightarrow$ **Leaf 3: Fairness Through Blindness**
      *   **Yes** $\rightarrow$ Go to 4.
  4.  **Do you prioritize Score Meaning (Calibration) or Mistake Distribution (Error Balance)?**
      *   **Meaning** ($P(Y|S)$ same across groups) $\rightarrow$ **Leaf 4: Calibrated Score**
      *   **Mistakes** (False Positive/Negative rates equal) $\rightarrow$ **Leaf 5: Equalized Errors**
  5.  **Are the fairness criteria themselves coherent?** (Is the conflict a *reductio* of the metrics?)
      *   **No** $\rightarrow$ **Leaf 6: Meta-Position**
      *   **Yes** $\rightarrow$ Go to 6.
  6.  **Is randomization permissible to satisfy criteria in expectation?**
      *   **Yes** $\rightarrow$ **Leaf 7: Randomized Allocation**
      *   **No** $\rightarrow$ Go to 7.
  7.  **Can we change the intervention instead of the score?** (e.g., Stop using scores for this decision.)
      *   **Yes** $\rightarrow$ **Leaf 8: Structural Intervention**
      *   **No** $\rightarrow$ *(Incoherent Region: You accept the bind but refuse all exits.)*

  ---

  ### **Leaf Descriptions**
  *Each position must answer the **Scrutiny Case**: What if the score decides audits/police attention (burden) rather than loans/transplants (benefit)?*

  | **Position** | **What You Swallow (Cost)** | **Evidence Against It** | **Scrutiny Case Implication** |
  | :--- | :--- | :--- | :--- |
  | **1. Construct Validity** | You cannot measure fairness because you cannot measure the outcome. | A consensus emerges on a proxy $Y'$ that predicts harm without bias. | **Unchanged.** If "reoffending" is ill-defined, auditing based on it is also ill-defined. |
  | **2. Instrumental Sufficiency** | You delay deployment despite potential utility; opportunity cost is high. | New instrumentation reduces residual error below the decision threshold. | **Unchanged.** Noise is noise; auditing on noisy signals wastes resources regardless of benefit/burden. |
  | **3. Blindness** | You accept unequal error rates across groups as the price of ignoring group status. | Demonstration that ignoring group status systematically harms the minority group. | **Flips.** Blindness protects against benefit discrimination but may exacerbate burden disparities (e.g., over-policing). |
  | **4. Calibrated Score** | You accept that false positives/negatives will differ by group (unequal error rates). | Evidence that unequal error rates cause catastrophic harm to the disadvantaged group. | **Flips.** High score = high risk. For benefits, high risk is denied. For scrutiny, high risk is targeted. Harm distribution inverts. |
  | **5. Equalized Errors** | You accept that the score means different things for different groups (uncalibrated). | Evidence that uncalibrated scores undermine trust or utility of the model for users. | **Partial Flip.** Equalizing burdens (audits) may require unequal thresholds, potentially ignoring actual risk differences. |
  | **6. Meta-Position** | You reject the mathematical framing of fairness entirely as philosophically naive. | A unified metric is found that satisfies all constraints without triviality. | **Unchanged.** The mathematical conflict is identical; the philosophical rejection holds for burdens too. |
  | **7. Randomized** | You accept inefficiency; deserving candidates may lose, undeserving may win. | Evidence that stakeholders refuse to accept chance as a legitimate decider. | **Unchanged.** A lottery for audits is as valid (or invalid) as a lottery for transplants. |
  | **8. Structural** | You admit the decision problem itself is the source of injustice, not the model. | Evidence that the intervention is necessary and no alternative exists. | **Strong Flip.** Scrutiny interventions often *create* the base rate differences (e.g., policing creates arrest stats). |

  ---

  ### **Structural Notes & Empty Regions**

  **On Your Hobby Horse (Instrumental Sufficiency):**
  This does **not** collapse into Construct Validity. Construct Validity claims the *target* ($Y$) is wrong (e.g., "arrests $\neq$ crime"). Instrumental Sufficiency claims the *measurement* ($S$) is too noisy for the *decision threshold* (e.g., "AUC is 0.6, threshold requires 0.9"). In spectroscopy terms: Validity questions what molecule you are looking at; Sufficiency questions if your spectrometer has the resolution to see the peak. It is a genuine leaf.

  **Empty Regions (Logical Possibilities Nobody Defends):**
  *   **Blindness + Equalized Errors:** Incoherent. If base rates differ, ignoring group labels guarantees unequal error rates.
  *   **Calibration + Equalized Errors:** Incoherent. This is the impossibility theorem itself (unless base rates are equal or classifier is perfect).
  *   **Meta-Position + Structural Intervention:** Merely unattractive. If the criteria are nonsense, why change the structure to satisfy them? Usually, Meta-positionists reject the structure too.

  **Indistinguishable Leaves:**
  *   **Blindness vs. Calibrated Score:** In practice, these often converge. A blind model trained on balanced data often approximates calibration. They are logically distinct (one restricts input, one restricts output), but empirically hard to separate without knowing the training procedure.
  *   **Randomized vs. Meta-Position:** Both effectively dissolve the strict optimization problem. Randomization satisfies the math in expectation; Meta-Position rejects the math. The outcome (no deterministic rule) is similar.

  **The Scrutiny Flip:**
  Notice that **Calibrated Score** and **Blindness** are the most sensitive to the Benefit/Scrutiny distinction. When a score denotes *risk*, allocating benefits *down* the risk curve and allocating burdens *up* the risk curve inverts the fairness impact of any given bias. Positions that focus on the *score's meaning* (Calibration) must rethink who is harmed when the direction of allocation flips. Positions that focus on the *measurement quality* (Validity/Sufficiency) remain stable.
