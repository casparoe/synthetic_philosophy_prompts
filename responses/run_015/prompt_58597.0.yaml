answer: |-
  Hi there,

  I hear you on the whiplash, and honestly, that tension is the engine driving most of the interesting work in our field right now. You are asking for the specification of a theory that navigates the Scylla of logical omniscience and the Charybdis of irrational anarchism, and while there is no consensus on a single formalism, there is a fairly stable set of desiderata that any serious contender must satisfy to be taken seriously as a theory of bounded belief. To start with the absolute baseline, the theory must handle your case of Ana, which means it has to permit an agent to believe a set of premises without believing all their logical consequences. The reason for this is straightforwardly empirical and phenomenological; if a model forces Ana to believe the complicated consequence the moment she accepts the axioms, it fails to describe human cognition and loses its grip on the concept of belief as a guide to action. This requirement rules out standard possible worlds semantics where belief sets are closed under logical consequence, but it is non-negotiable because without it, you cannot model learning, discovery, or the very practice of mathematics.

  However, solving for Ana often breaks the theory when you introduce Ben, which leads to the second requirement that the model must respect a gradient of logical difficulty or salience. Ben spots the simple inconsistency immediately but misses the buried one, and an adequate theory must explain why these two states are different rather than treating both as simple failures of closure. The reason here is normative; we need to preserve the intuition that Ben is rational in the first case and merely bounded in the second, which means the theory cannot simply drop closure principles entirely or else it loses the ability to criticize Ben for the buried inconsistency at all. This distinction between trivial and non-trivial consequences is where many syntactic approaches struggle, as they often treat all underived formulas equally, but it is essential if we want belief to remain a normative concept rather than just a psychological description.

  Moving from the static to the dynamic, the theory must account for how Ana transitions from withholding judgment to believing the consequence once she sees the proof. This requires an update rule that is not standard conditionalization, since conditionalization on a logical truth typically does nothing in standard Bayesian frameworks. The reason this is required is that belief revision is the primary mechanism by which we resolve logical ignorance, and a theory that cannot model the acquisition of logical knowledge is static and useless for epistemology. This dynamic requirement is tightly linked to the need for the theory to distinguish between explicit and implicit commitment, where Ana is explicitly committed to the axioms but only implicitly committed to the theorem until the proof makes it explicit. This distinction is necessary to explain why Ana is not irrational before seeing the proof, whereas Ben is irrational for missing the buried inconsistency if he has the tools to find it, preserving the normative force of logic without demanding omniscience.

  When we sort these into non-negotiables versus camp-specific pet peeves, the handling of Ana and the preservation of some normative force for Ben are the non-negotiables, whereas the specific mechanism used to achieve this is where the camps fight. For instance, whether you use impossible worlds, syntactic structures, or fragmentation into belief states is largely a matter of formal preference, but what matters is that the chosen mechanism allows for the failure of closure in Ana's case while maintaining enough structure to criticize Ben. A pet peeve of the fragmentation camp is that syntactic approaches are too fine-grained, while syntactic folks think fragmentation is too ad hoc, but both are acceptable provided they meet the core functional requirements. What is not acceptable is a theory that solves Ana by making logic entirely external to the agent, as that fails to explain Ben's internal experience of reasoning, nor is a theory acceptable that solves Ben by demanding he should have found the buried inconsistency, as that collapses back into omniscience.

  There is a sense in which a subset of these requirements is jointly unsatisfiable if you insist on a single, unified belief state that is both logically closed and computationally bounded. This is the core impossibility result that drives the field; you cannot have a single set of propositions that is closed under consequence but does not contain all consequences. To resolve this, adequate theories usually introduce a second parameter, such as cognitive effort, attention, or context, which means the joint satisfiability of closure and boundedness requires abandoning the idea that belief is a simple relation between an agent and a proposition. This is a heavy metaphysical cost, but it is the only way to keep the data from both Ana and Ben consistent within the model.

  The single requirement that knocks out the most candidates is the demand to preserve normative force while denying omniscience. Many theories successfully model Ana by breaking logical closure, but they fail to explain why Ben is wrong to miss the buried inconsistency, effectively giving up on rationality altogether. It is easy to make a model where agents believe anything regardless of logic, but it is incredibly hard to make a model where agents are bounded yet still subject to logical norms. This requirement eliminates most radical contextualist views and many pure syntactic accounts that treat belief as mere string manipulation without normative constraints.

  I think this line of thought is most likely to fail on the definition of cognitive effort or salience required to handle Ben's case. We currently lack a rigorous, non-circular way to measure the complexity of a logical derivation that correlates with human psychological difficulty without just stipulating the results we want. If you could show me a formal measure of logical complexity that is independent of human psychology yet perfectly predicts when an agent is excused from believing a consequence, that would change my mind about the necessity of fragmenting belief states. Until then, we are stuck with models that work well for Ana and Ben individually but struggle to unify them without some fudge factor regarding attention or computational cost.

  Hope that helps clarify the landscape for your second year.

  Best,

  A Colleague
