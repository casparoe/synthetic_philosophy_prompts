      *   **Masking Cases (Johnston):** The disposition remains, but something interferes with the manifestation process.
      *   **Mimicking Cases (often grouped with masks/finks):** Lacking the disposition, but something causes the manifestation anyway. (User didn't explicitly ask for mimics, but they are relevant to the SCA failure. I should focus primarily on finks/masks as requested, but acknowledge mimics if it helps clarity).
      *   **Proposed Fixes:**
