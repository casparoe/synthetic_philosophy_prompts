      *   **Simple Conditional Analysis (SCA):** $D \leftrightarrow (S \boxright M)$. (Object $x$ has disposition $D$ iff if $x$ were stimulated $S$, $x$ would manifest $M$).
      *   **Finkish Cases (C.B. Martin):** The stimulus causes the disposition to be lost *before* manifestation.
          *   *Finkish Disposition:* Having the disposition, but losing it upon stimulus.
