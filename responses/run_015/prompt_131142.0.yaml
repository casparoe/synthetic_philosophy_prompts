answer: |-
  This is an excellent pivot for a grad seminar. Moving from "Liberty vs. Tradition" to the structural mechanics of harm, social cohesion, and functionalism gets at the actual philosophical engine of the debate. You are right to suspect that the standard undergrad framing obscures the fact that Hart and Devlin are often talking past each other regarding the *ontology* of society itself.

  Here is a breakdown of the comparison, the externality framing, Hart's internal resources, and the limits of the immune system analogy.

  ### 1. Devlin's Disintegration Thesis as a "Normative Externality"

  Your intuition that Devlin treats moral harm like an economic externality is astute. In standard liberal theory (and Hart's Millian framework), harm is usually direct and interpersonal (A punches B). Devlin, however, posits a **constitutive externality**.

  *   **The Mechanism:** For Devlin, society is not merely a political arrangement for mutual security (the Lockean view); it is a "community of ideas." Shared morality is the invisible bond. When an individual engages in "private" immorality, they are not just harming themselves; they are degrading the shared moral environment that sustains the bond for everyone else.
  *   **The Externality:** This functions exactly like pollution. If I pollute a river, I gain the utility of cheap disposal, but the cost is borne by downstream users who lose clean water. For Devlin, if I engage in vice, I gain utility, but the cost is borne by the collective in the form of weakened social cohesion.
  *   **Collective Action Structure:** This is where Devlin's argument is strongest against a naive libertarianism. He is identifying a **tragedy of the commons** regarding normative stability. If moral conformity is a public good, then individual deviation is free-riding. If everyone free-rides, the public good (social cohesion) collapses.

  **Does Hart miss this?**
  Hart does not necessarily miss the *structure* of the argument; he rejects the *empirical premise*. Hart argues that Devlin provides no evidence that private immorality (e.g., consensual homosexual acts) actually weakens the bond of society to the point of disintegration.
  *   **Hart's Move:** Hart treats Devlin's "disintegration" as a factual claim, not a conceptual truth. Hart demands empirical proof that the "normative pollution" is real.
  *   **The Gap:** Hart's refusal to count "moral disgust" as harm assumes that the *feeling* of disintegration is distinct from *actual* disintegration. Devlin argues the feeling (intolerance, indignation, disgust) is the *barometer* of the threat. Hart argues the feeling is just a preference.

  **Verdict:** Hart doesn't miss the collective-action structure; he dissolves it by denying the scarcity of the resource. For Hart, moral conformity is not a depletable resource necessary for survival; it is a preference that must compete with liberty.

  ### 2. Hart's Critical vs. Positive Morality: Blocking Devlin or Smuggling Assumptions?

  You asked whether Hart's distinction between **critical morality** (principles subject to rational scrutiny) and **positive morality** (the actual moral beliefs held by a society) allows him to block Devlin without simply asserting autonomy trumps stability.

  *   **The Distinction:**
      *   **Positive Morality:** "Society believes X is wrong." (Devlin's domain).
      *   **Critical Morality:** "X is actually wrong based on reasoned principles." (Hart's domain).
  *   **The Block:** Hart argues that the law should align with *critical* morality, not *positive* morality. Just because society *feels* a practice is destructive (positive) doesn't mean it *is* destructive (critical). This allows Hart to say Devlin is protecting a superstition, not a necessity.
  *   **The "Smuggling" Charge:** Does this smuggle in an autonomy assumption?
      *   **Yes, but arguably justifiably.** Hart's framework presupposes that individuals are capable of rational moral agency. If you accept that premise, then stability purchased through the suppression of rational agency is illegitimate stability.
      *   **However,** Hart has a stronger, non-metaphysical defense. He argues that **legal order** provides the necessary stability, not **moral conformity**. Hart can concede that society needs stability to function (blocking the "autonomy always trumps" claim) but argue that *law* secures that stability, not the enforcement of private virtue.
      *   **The Weakness:** Hart's distinction struggles if the "positive morality" is the only thing preventing violence. If the *belief* in a taboo prevents civil war (even if the taboo is irrational by critical standards), Hart's critical morality might demand we keep the taboo for instrumental reasons. Hart sometimes underestimates the functional utility of irrational positive morality.

  **Seminar Point:** Hart's distinction works best as a **burden of proof** shifter. It forces Devlin to move from "People feel disgusted" (Positive) to "Here is the rational reason why this causes collapse" (Critical). Devlin cannot make that jump; he rests on the feeling itself. Hart wins not because autonomy is sacred, but because Devlin fails to translate positive morality into critical justification.

  ### 3. The Immune System Analogy: Functionalist Trap or Insight?

  The analogy: *Society is an organism; moral codes are the immune system; rapid moral change is an autoimmune disease or leaves the host vulnerable to infection.*

  **Where it illuminates Devlin:**
  It captures the **homeostatic** nature of Devlin's worry. Devlin isn't necessarily saying specific acts (like sodomy) are metaphysically evil; he is saying the *rejection of the prohibition* weakens the system's defense mechanisms. It explains why Devlin focuses on the *boundaries* of morality rather than the content. An immune system doesn't care what the virus is, only that it is "non-self." Similarly, Devlin argues the law must defend the "self" of the society against the "non-self" of deviance.

  **Where it collapses (The Philosophical Work):**

  1.  **The Teleology Problem (Is vs. Ought):**
      *   **Biology:** The goal of an immune system is objective: survival of the host.
      *   **Society:** What is the goal of society? If the goal is "survival of the existing power structure," the analogy holds. If the goal is "justice" or "human flourishing," the analogy fails. An immune system can keep a cancerous host alive. A society can be morally "healthy" (stable) but evil (e.g., a stable slave society). The analogy privileges *existence* over *value*.

  2.  **The Pathogen Identification Problem:**
      *   **Biology:** Pathogens are objectively distinct from host tissue (usually).
      *   **Society:** Who defines the pathogen? In Devlin's framework, the "pathogen" is whatever the majority feels disgust toward. This makes the immune system circular. It protects the society from whatever the society *says* is harmful. It offers no external check. Hart's critical morality is the "second opinion" that the immune system analogy excludes.

  3.  **Adaptation vs. Autoimmunity:**
      *   **Biology:** Immune systems evolve slowly. Rapid change is dangerous.
      *   **Society:** Moral progress often *requires* rapid rejection of old norms (e.g., the end of segregation, women's suffrage). If you treat these shifts as "normative infections," you bias the system toward conservatism. The analogy cannot distinguish between **degeneration** (loss of necessary bonds) and **metamorphosis** (necessary moral growth). It treats all stress on the system as pathology.

  4.  **The Constitutive Error:**
      *   In biology, the immune system is distinct from the organs it protects. In society, the "moral code" *is* the organ. You cannot protect the society by freezing the moral code, because the society *is* the evolving moral conversation. Devlin wants to preserve the vessel; Hart wants to preserve the voyage.

  ### Summary for the Seminar

  1.  **Externality:** Frame Devlin as arguing for a **constitutive externality** where private vice depletes the public good of social cohesion. This makes his argument a collective-action problem, not just paternalism.
  2.  **Hart's Counter:** Hart doesn't deny the need for stability; he denies the **empirical link** between private vice and public collapse. His Critical/Positive distinction forces Devlin to justify the *necessity* of the norm, not just its *popularity*.
  3.  **Immune Analogy:** Use it to explain Devlin's functionalism, but crush it with the **Teleology Objection**. The analogy assumes the survival of the *current* social form is the highest good. It cannot account for moral progress that looks like "disintegration" from the inside (e.g., the abolition of slavery looked like social suicide to the antebellum South).

  **The Kicker:** Hart's real victory isn't that autonomy trumps stability. It's that Devlin's "disintegration thesis" is a **self-sealing argument**. If society changes, Devlin calls it disintegration. If society stays the same, he calls it health. Hart breaks the seal by demanding independent criteria for harm (Critical Morality) rather than accepting the system's self-diagnosis (Positive Morality).
