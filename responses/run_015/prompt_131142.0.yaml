      *   **Specific Question 2:** Does Hart's refusal to count offense/disgust as harm miss the collective-action structure of Devlin's worry?
      *   **Specific Question 3:** Can Hart's *critical/positive morality* distinction block Devlin without smuggling in an autonomy-trumps-stability assumption?
