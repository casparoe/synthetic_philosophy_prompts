      *   **Section 5: Consciousness.** Independent philosophical import. Not in the book.
      *   **Final Verdict:** Does the consciousness claim survive? No.

  9.  **Self-Correction during drafting:** I should make sure to mention that *Surfaces and Essences* is largely a critique of Gentner's Structure-Mapping Theory (which emphasizes deep structure over surface). The blogger seems to be accidentally describing Gentner while attributing it to Hofstadter. This is a crucial insight. Hofstadter argues surface and deep are intertwined, whereas Gentner separates them more rigidly. I must highlight this.

