prompt: |-
  I'm in sixth form and run our student council forum where we vote on school rules, then usually reverse them next term with no clear logic. I want a reusable decision proceedure based on Dewey's experimentalism - democracy as social inquiry where each rule is a trial hypothesis run by the people affected, not just a majority vote. Turn it into a step-by-step checklist we can use in a 20-minute meeting: the questions in order, what counts as enough data to keep or kill the trial, where factual testing ends and values begin, and a reversability check so we don't lock future pupils into something they never agreed to. Be honest about which steps are just judgement calls dressed up as rules.

  Then apply it to three proposals: banning phones in the canteen, letting students redesign lunch menus every term, and keeping the prefect system even though our trial showed it makes some people feel excluded (this is the one I'll hate). For each say what the procedure gives, where it breaks down, and where it forces an answer I won't like. Also say clearly what this can't do - if it can't settle deep fairness fights, just admit it.

  Sorry if spelling's rough, I wrote this between lessons on my phone. And please don't ask me for references or a reading list - I haven't got access to look stuff up right now.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Sixth form student (16-18 years old), runs student council forum.
      *   **Context:** Current process is voting on rules, then reversing them next term with no logic. Wants a better, reusable decision procedure.
      *   **Philosophical Basis:** John Dewey's Experimentalism (Democracy as Social Inquiry). Rules = trial hypotheses, tested by affected people, not just majority rule.
      *   **Deliverable:** A step-by-step checklist for a 20-minute meeting.
      *   **Specific Requirements:**
          *   Questions in order.
          *   Criteria for data (keep/kill trial).
          *   Distinction between factual testing and values.
          *   Reversibility check (intergenerational justice).
          *   Honesty about "judgement calls dressed up as rules."
          *   Application to three specific proposals (Phones in canteen, Student lunch menus, Prefect system).
          *   Admission of limitations (what it *can't* do).
          *   Constraint: No references/reading lists (user has no access).
          *   Tone: Honest, practical, respectful of intelligence (sixth former), direct.

  2.  **Deconstruct Dewey's Experimentalism for this Context:**
      *   *Core Idea:* Knowledge comes from doing and reflecting. Democracy isn't just counting heads; it's collective problem-solving.
      *   *Application:* A school rule isn't a law; it's an experiment to solve a specific problem (e.g., noise, waste, exclusion).
      *   *Key Components:* Problem definition -> Hypothesis (Rule) -> Experiment (Trial Period) -> Data Collection -> Evaluation -> Decision.
      *   *The "Social" Aspect:* Who is affected? They need to provide the data.
      *   *The "Reversibility" Aspect:* Future students shouldn't be stuck with today's mistakes.

  3.  **Drafting the Checklist (The "Dewey Protocol"):**
      *   *Time Limit:* 20 minutes is tight. Needs to be punchy.
      *   *Step 1: Problem Definition.* What are we actually fixing? (5 mins)
      *   *Step 2: The Hypothesis.* What is the rule trying to do? (3 mins)
      *   *Step 3: Data Criteria.* How do we know if it worked? (5 mins)
      *   *Step 4: Values vs. Facts.* Where do we stop measuring and start feeling? (5 mins)
      *   *Step 5: Reversibility.* Can the next year undo this? (2 mins)
      *   *Honesty Check:* I need to explicitly label where human judgement overrides the "system."

  4.  **Developing the Three Case Studies:**
      *   *Case 1: Banning Phones in Canteen.*
          *   *Problem:* Noise/Social isolation?
          *   *Data:* Noise levels, observation of groups.
          *   *Value:* Freedom vs. Community.
          *   *Outcome:* Likely a trial with specific metrics.
      *   *Case 2: Student Lunch Menus.*
          *   *Problem:* Food waste/Unhappy students.
          *   *Data:* Waste bins, sales figures.
          *   *Constraint:* Budget/Health regulations (hard limits).
          *   *Outcome:* Feasible but bounded.
      *   *Case 3: Prefect System (The Hard One).*
          *   *Problem:* Order vs. Exclusion.
          *   *Data:* Survey on feeling excluded.
          *   *Value:* Hierarchy vs. Equality.
          *   *Outcome:* The procedure might demand killing the system if the data shows harm, which the user might hate if they value tradition/order. I need to be firm here.

  5.  **Addressing Limitations:**
      *   Dewey's method can't solve fundamental value clashes (e.g., Liberty vs. Security). It clarifies them, but doesn't magically resolve them.
      *   It relies on honest data (students might lie).
      *   It takes time (20 mins might be optimistic for complex issues).

  6.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Acknowledge the user's situation (rushed, phone typing).
      *   Be direct about the "judgement calls."
      *   Ensure the "Prefect" section is challenging but fair.

  7.  **Review against Constraints:**
      *   20-minute checklist? Yes.
      *   Deweyan basis? Yes (inquiry, hypothesis, testing).
      *   No references? Yes.
      *   Honesty about limitations? Yes.
      *   Three specific examples? Yes.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe suggest surveys. *Correction:* Surveys take time. For a 20-min meeting, rely on *agreed metrics* for the trial, not doing the survey right now.
      *   *Initial thought:* Make it sound very philosophical. *Correction:* No, make it a practical tool. Keep the philosophy in the *why*, not the *how*.
      *   *Crucial:* The user admitted they might hate the outcome of the Prefect example. I need to make sure I don't soften the blow. If the data says "exclusion," Dewey says "change the hypothesis."
      *   *Reversibility:* Make sure this isn't just "we can vote again." It needs to be "is the structural damage reversible?"

  9.  **Final Polish:** Check the flow. Ensure the distinction between fact (did noise go down?) and value (is quiet worth the loss of freedom?) is clear. (Proceed to generate output).

  *(Self-Correction on the "Reversibility" point)*: Dewey emphasizes growth. Locking future students in prevents *their* growth/inquiry. I need to frame reversibility as a condition of the experiment's validity.

  *(Self-Correction on "Judgement Calls")*: I need to explicitly point out that deciding *which* data matters is itself a value judgement. I will add a "Warning Label" section to the checklist.

  10. **Final Output Generation** (matching the thought process above).
answer: |-
  This is a smart approach. You've identified the exact problem with most student councils: they treat rules like laws (permanent, top-down) instead of tools (temporary, functional). Dewey's idea is that democracy isn't just voting; it's collective problem-solving. A rule is just a hypothesis: *"If we do X, problem Y will get better."*

  Here is a 20-minute procedure designed for your context, followed by the three case studies and an honest admission of where this method fails.

  ### The "Social Inquiry" Checklist (20 Minutes)

  **Goal:** Turn a proposal into a testable trial, not a permanent law.
  **Participants:** Student Council + 1 Staff Liaison (optional but helpful for reality checks).

  **Minute 0-5: Define the Problem, Not the Solution**
  *   **Question:** What specific *problem* are we trying to fix? (Not "we want phones banned," but "phones are causing X.")
  *   **Requirement:** You must name a negative outcome (e.g., "noise," "waste," "exclusion"). If you can't name a harm, there is no need for a rule.
  *   **Judgement Call Warning:** Deciding what counts as a "problem" is subjective. One person's "noise" is another person's "vibrant community." You must agree on the problem before discussing the rule.

  **Minute 5-10: Set the Success Metrics (The Data)**
  *   **Question:** What evidence would prove this rule *worked*?
  *   **Requirement:** Pick two measurable things.
      1.  **Hard Data:** (e.g., decibel levels, food waste weight, number of complaints).
      2.  **Soft Data:** (e.g., a 5-question pulse survey to 20 random students).
  *   **Threshold:** Agree on the "Kill Switch." (e.g., "If 60% of surveyed students feel more excluded, the trial ends immediately.")
  *   **Judgement Call Warning:** Choosing *which* data matters is a value judgement. Ignoring "feelings" to focus only on "noise levels" is a political choice, not a scientific one.

  **Minute 10-15: The Value Boundary (Fact vs. Faith)**
  *   **Question:** Where does testing end and belief begin?
  *   **Requirement:** Identify one value that cannot be compromised, even if the data is good.
      *   *Example:* "Even if phones reduce noise, we value the freedom to contact parents."
  *   **Outcome:** If the rule violates this core value, it fails regardless of the data.
  *   **Judgement Call Warning:** This is pure philosophy. There is no data for "freedom." You are admitting that some things are non-negotiable.

  **Minute 15-18: The Reversibility Check (Intergenerational Justice)**
  *   **Question:** If next year's Sixth Form hates this, how hard is it to undo?
  *   **Requirement:** The rule must have a "Sunset Clause." It expires automatically in 2 terms unless re-validated.
  *   **Constraint:** Does this rule create a physical or structural change that is hard to reverse? (e.g., building a wall vs. changing a schedule).
  *   **Hard Rule:** If it creates a structural change that locks future students in without their consent, it requires a 75% supermajority, not a simple majority.

  **Minute 18-20: The Verdict**
  *   **Decision:** Approve Trial / Reject / Send Back for Redefinition.
  *   **Documentation:** Write down the "Kill Switch" metrics. If you don't write them down, you will ignore them next term.

  ***

  ### Applying the Procedure to Your Three Proposals

  Here is how this plays out in reality. I will be blunt about where the procedure forces uncomfortable answers.

  #### 1. Proposal: Ban Phones in the Canteen
  *   **The Problem:** "Students are isolated on screens instead of talking." (Social fragmentation).
  *   **The Data:**
      *   *Hard:* Observation count (how many tables have full conversation vs. silence).
      *   *Soft:* Survey question: "Did you feel more connected to peers today?"
  *   **The Value Boundary:** "Emergency contact with parents." (Must allow phones for emergencies).
  *   **Reversibility:** High. It's a behavioural rule, easy to undo tomorrow.
  *   **The Procedure's Verdict:** **Approve Trial.**
  *   **Where it Breaks Down:** Students will hide phones. The "Hard Data" (observation) might be faked. You are relying on honesty in a system designed to catch people out.
  *   **The Uncomfortable Truth:** If the data shows students are *happier* on their phones (less social anxiety), Dewey's method forces you to admit the rule is solving a problem that doesn't exist. You have to kill the ban even if teachers want it.

  #### 2. Proposal: Students Redesign Lunch Menus Every Term
  *   **The Problem:** "Food waste is high and students hate the meals."
  *   **The Data:**
      *   *Hard:* Weight of waste bins / Sales figures of new items.
      *   *Soft:* Satisfaction rating.
  *   **The Value Boundary:** "Nutritional Standards & Budget." (You cannot vote for deep-fried candy bars if the budget/health code forbids it).
  *   **Reversibility:** Medium. Contracts with suppliers might lock you in for a term.
  *   **The Procedure's Verdict:** **Approve Trial (with constraints).**
  *   **Where it Breaks Down:** This is where "Social Inquiry" hits material reality. You can hypothesise all you want, but if the supplier can't get the ingredients, the hypothesis fails.
  *   **The Uncomfortable Truth:** This procedure exposes that you don't actually have full power. You are managing expectations, not making rules. If the data shows students want cheap junk but the budget only allows expensive healthy food, the procedure forces you to admit the system is broken, not the menu.

  #### 3. Proposal: Keep the Prefect System (Despite Exclusion Data)
  *   **The Problem:** "We need order and role models."
  *   **The Counter-Evidence:** Your trial showed the system makes some students feel excluded/intimidated.
  *   **The Data:**
      *   *Hard:* Number of disciplinary incidents.
      *   *Soft:* % of Year 7s who report feeling "unsafe" or "unwelcome" around prefects.
  *   **The Value Boundary:** "Hierarchy vs. Equality." The school values order; the council values inclusion.
  *   **Reversibility:** Low. Once a hierarchy is established, removing it creates a power vacuum.
  *   **The Procedure's Verdict:** **Kill the Trial / Major Reform Required.**
  *   **Where it Breaks Down:** This is the one you said you'd hate. Here is why: Dewey's experimentalism says if the hypothesis ("Prefects create order") causes verified harm ("Exclusion"), and the harm violates a core value ("Inclusivity"), the hypothesis is falsified.
  *   **The Uncomfortable Truth:** You cannot keep the system *just because it's tradition*. The procedure forces you to admit that "Order" is being prioritised over "Wellbeing." If your council values Wellbeing (based on your exclusion data), you **must** vote to scrap or radically democratise the prefect system. Keeping it requires you to admit you care more about control than the data suggests you should. The procedure strips away the excuse of "it's always been this way."

  ***

  ### What This Procedure Cannot Do (The Honest Limitations)

  You asked for honesty about where this is just judgement dressed up as rules, and what it can't solve.

  **1. It Cannot Settle Deep Value Conflicts**
  If half the council believes "Freedom is the most important thing" and the other half believes "Safety is the most important thing," this procedure won't solve it. It will just clarify the fight.
  *   *Example:* Phones. If you value connection more than quiet, and the teacher values quiet more than connection, no amount of data will bridge that gap. The procedure just makes sure you know *why* you are fighting.

  **2. It Relies on Honest Data**
  This is the biggest weakness. If students lie on the surveys, or if teachers massage the disciplinary stats, the "inquiry" is corrupted. You are building a scientific method on top of a teenage social hierarchy. People will game the metrics.
  *   *Judgement Call:* Deciding to trust the data is itself a leap of faith.

  **3. It Can't Fix Power Imbalances**
  Dewey assumes everyone in the "inquiry" has an equal voice. In a school, they don't. If the Headteacher says "No," your trial is over.
  *   *Limitation:* This procedure gives you moral authority, not legal authority. It makes it harder for them to ignore you, but they still can.

  **4. The "Reversibility" Trap**
  Some things feel reversible but aren't. Culture is hard to undo. If you run a "tough on bullying" trial that encourages snitching, and it creates a culture of distrust, you can't just vote to bring trust back next term.
  *   *Judgement Call:* You have to guess which changes are cultural, not just structural. The checklist asks you to guess, but it can't tell you the answer.

  ### Summary for your Meeting
  Use the checklist to slow down the voting. When someone says "Let's ban X," ask: **"What is the specific problem, and what data will kill the trial if it fails?"**

  If they can't answer that, you aren't doing democracy; you're just playing king. And regarding the Prefects: if the data says people feel excluded, the only honest Deweyan move is to change the system. Keeping it means admitting you value the *symbol* of authority more than the *experience* of the students. That's a valid choice, but you have to own it, not hide behind "rules."
