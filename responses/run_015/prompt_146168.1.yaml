answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board (REB)
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Anthropomorphic Language in Radiology AI Outputs

  ### 1. Executive Summary

  The Board must determine whether to permit the deployment of a new radiology AI system that utilizes belief-attributing language (e.g., "I think this nodule is benign but I'm not sure"). The vendor argues this language enhances clinician trust; some Board members argue it is inherently deceitful, while others cite Daniel Dennett's *Intentional Stance* to justify it as a predictive tool.

  This memo recommends **requiring a different framing altogether**. We should not mandate a total removal of uncertainty language, nor should we allow unqualified belief attribution. Instead, we must mandate **Functional Confidence Framing**. This approach permits language that signals uncertainty only when explicitly tied to calibrated probability metrics and embedded within a workflow that emphasizes human oversight and error-correction norms.

  ### 2. Background and Ethical Tension

  The vendor's interface generates natural language reports containing phrases like "I think" or "I am not sure."
  *   **The Deception Objection:** One Board member argues that because the AI lacks consciousness or qualia, attributing beliefs to it is a category error that deceives the clinician regarding the nature of the tool.
  *   **The Intentional Stance Defense:** Another member argues that per Dennett, we are justified in treating the system *as if* it has beliefs if doing so allows us to successfully predict its behavior and integrate it into workflow.
  *   **The Trust Claim:** The vendor contends that sterile probabilistic outputs (e.g., "0.85 likelihood") reduce cognitive fluency and lower trust, whereas natural language uncertainty mirrors human consultation.

  ### 3. Ethical Analysis: Beyond the Binary

  To resolve this, we must move beyond the binary of "lie" vs. "useful metaphor." We must adopt a position of **Functional Belief Attribution**.

  #### 3.1 The Strongest Argument for Retaining Belief-Language
  The most compelling argument for allowing language like "I think" is **Cognitive Fluency in High-Stakes Environments**. Radiologists operate under significant cognitive load. Natural language uncertainty markers ("I think," "likely," "unsure") are heuristic shortcuts that clinicians use with human colleagues to rapidly gauge confidence without calculating raw probabilities.

  If the AI's "I think" maps reliably to a specific confidence threshold (e.g., 70-90% probability), banning this language forces clinicians to translate statistical outputs into semantic judgments manually. This increases cognitive load and may paradoxically increase error rates. If the language facilitates accurate mental modeling of the AI's reliability, it serves a safety function.

  #### 3.2 The Intentional Stance: Convenience vs. Normative Weight
  The Board must decide if the *Intentional Stance* is merely a convenient fiction or if it carries normative weight for disclosure.

  *   **Collapse into Convenience:** If we treat the AI as having beliefs *only* for predictive success, the stance collapses into mere instrumentalism. In this view, saying "The AI thinks" is no different than saying "The thermostat wants the room warmer." It is a shorthand. If used this way, it carries **no normative weight**, and using it without qualification is ethically risky because it invites clinicians to anthropomorphize the system's *responsibility*, not just its predictions.
  *   **Normative Weight via Error-Correction:** The Intentional Stance carries normative weight **only if** the attribution of belief implies the possibility of *correction*. To say a system "believes" $X$ is ethically permissible only if there is a mechanism to audit why it holds that state and correct it if it is wrong.

  Therefore, the Intentional Stance is not a free pass to use anthropomorphic language. It obligates us to ensure the "belief" is traceable. If the AI says "I think," but the reasoning is a black box that cannot be audited against the "belief," the stance is deceptive.

  #### 3.3 The Middle Position: Functional Belief within Interpretive Frameworks
  We should adopt a functionalist view: The system can be described as having "beliefs" **relative to a specific interpretive framework**. This framework must include:
  1.  **Calibration:** The language must map to verified statistical confidence.
  2.  **Accountability:** The language must not shift moral agency from the clinician to the machine.
  3.  **Error-Correction Norms:** The system must be presented as a hypothesis generator subject to verification, not a second opinion provider.

  ### 4. Recommendation: Require Functional Confidence Framing

  The Board should **not** mandate the total removal of uncertainty language, as this degrades usability. However, we should **not** allow the vendor's current phrasing without modification. We recommend **requiring a different framing** that aligns with Functional Belief Attribution.

  **Specific Policy Requirements:**

  1.  **Semantic Calibration:** Phrases like "I think" or "I am not sure" are permitted *only if* the vendor provides documentation mapping these phrases to specific confidence intervals (e.g., "I think" = 75-90% confidence; "Not sure" = <60% confidence). These mappings must be visible in the system documentation.
  2.  **Agency Disclaimers:** The interface must include a persistent, non-intrusive indicator that frames the output as **computational inference**, not **cognitive judgment**. For example, tooltips or header text should read: *"AI Confidence Estimate (Functional Equivalent: 'I think')"*.
  3.  **Error-Correction Visibility:** When the AI expresses uncertainty ("I'm not sure"), the system must highlight the specific features (pixels, regions) that contributed to that uncertainty, allowing the clinician to apply human error-correction norms. This satisfies the normative requirement of the Intentional Stance.
  4.  **Prohibition of Moral Language:** The AI must never use language implying moral agency or finality (e.g., "I recommend," "I diagnose," "I believe"). It must remain in the realm of observational inference.

  ### 5. Conclusion

  Attributing beliefs to an AI is not inherently deceitful if understood functionally. However, it becomes unethical if it obscures the system's statistical nature or diffuses clinical responsibility. By mandating **Functional Confidence Framing**, we preserve the cognitive benefits of natural language while upholding the normative requirement that "belief" in a machine must always be subordinate to human audit and correction.

  This policy balances the vendor's usability concerns with the Board's ethical mandate to prevent deception and protect patient safety.

  **Decision Required:** Approval of the "Functional Confidence Framing" policy for implementation prior to the pilot study launch.
