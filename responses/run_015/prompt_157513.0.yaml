answer: |-
  The stalemate persists not because philosophers cannot agree on which sentences *are* analytic, but because they disagree on what work the classification is supposed to *do*. Quine's attack in "Two Dogmas" was primarily **epistemological**: he argued that no statement is immune to revision in the face of recalcitrant experience, thereby undermining the logical positivists' project of reducing all knowledge to immediate sense data via analytic truths. When revivalists (like Grice, Strawson, or contemporary two-dimensional semanticists) defend the distinction, they often shift the ground to **semantics** or **metaphysics**: they argue that there is a fact of the matter about truth-conditions or conceptual grounding, regardless of whether those truths are epistemically immune to revision.

  Consequently, the disagreement is best diagnosed as **different_questions**. Both camps agree on the "stock examples" (bachelors, water) because these cases satisfy both epistemological centrality and semantic constraint. However, the Quinean asks, "Can this belief be isolated from empirical confirmation?" while the Revivalist asks, "Is this truth constituted by linguistic convention or conceptual role?" They talk past each other because one side demands a naturalistic criterion for justification, while the other offers a modal criterion for content. The friction arises when Revivalists try to reclaim epistemological privileges (like the *a priori*) using semantic tools that Quine has already shown are insufficient for that specific task.

  To move this stalemate, we do not need more intuitions or neuroscience scans of resting states. We need a **formal model of concept learning and belief revision** that integrates semantic content with confirmation theory. Specifically, a Bayesian or computational model that treats "meaning" as a constraint on hypothesis space would demonstrate whether semantic constraints function as hard limits (supporting analyticity) or merely as high-probability priors (supporting holism). If such a model shows that semantic constraints *causally* block revision regardless of evidence, Quine is wrong. If it shows they are always outweighable by sufficient empirical pressure, Quine is right. This bridges the gap between the semantic question (revivalists) and the epistemological question (Quineans).

