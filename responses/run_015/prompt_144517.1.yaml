answer: |-
  Here is the committed line: **Clinicians must prioritize narrative integration over immediate distress reduction, because on the narrative-self ontology, coherence is not a feature of the person—it is the condition of the person's existence.**

  If the self is a center of narrative gravity, then a shattered autobiography is not merely a malfunctioning cognitive tool; it is an ontological crisis. To treat the distress without treating the fragmentation is to soothe a ghost while the house burns down. In severe dissociation, the patient is not suffering *from* a broken self; they are suffering *as* a broken self. Therefore, clinical interventions that prioritize symptom suppression (sedation, grounding techniques that isolate affect from context, safety planning that reinforces avoidance) without demanding narrative synthesis are ethically suspect. They preserve the biological organism at the expense of the moral agent.

  **Why Coherence Trumps Comfort**
  The standard psychiatric model treats distress as the primary evil. Under the narrative-self view, *incoherence* is the primary evil. Distress is often the signal that the narrative is failing to hold. If you medicate away the anxiety of a fragmented memory without integrating that memory into the life story, you have stabilized the chemistry but deepened the ontological rift. You have made the patient more comfortable as a collection of parts, but less existent as a whole.

  Prioritizing stitching the narrative back together is often more painful in the short term. It requires the patient to confront traumatic discontinuities, to own actions they may have dissociated from, and to feel the grief of lost time. But this pain is constitutive. It is the friction of the self re-forming. To spare them this pain is to deny them the possibility of a continuous future. A patient who is calm but fragmented cannot make long-term commitments, cannot sustain relationships, and cannot project a "future self" to care about. They are trapped in an eternal, distressed present. Restoring continuity is the only way to restore agency.

  **Harm to the Person, Not the Tool**
  You asked if broken continuity is harm to the person or damage to a cognitive tool. It must be classified as harm to the person. If the self is a substance, then memory loss is like losing a kidney—unfortunate, but the "you" remains. If the self is a narrative, then memory loss is like losing the plot of the novel you are writing. The book doesn't just have a missing page; it ceases to make sense as a book.

  This distinction is vital. If it is just a tool, we can use prosthetics (compensatory strategies, caregiver support). If it is the person, we must engage in reconstruction. In severe dissociation, the patient often presents as multiple centers of gravity (alters, states). The clinical goal cannot be merely to negotiate peace between these states (which validates the fragmentation); the goal must be to merge the gravities into a single orbit. This is not about social functioning; it is about metaphysical survival. A fragmented narrative cannot bear moral weight. You cannot hold a fragmented self responsible for a crime, nor can they hold themselves responsible for their recovery. Restoring the narrative is the prerequisite for moral status.

  **The Legal Capacity Friction**
  This is where the position creates severe friction with legal and ethical frameworks regarding capacity. The law operates on a substance-self fiction. It assumes there is a stable "decider" inside the skull who can consent to treatment. Legal capacity judgments rely on the ability to understand, retain, and weigh information *at a specific moment*.

  But if the self is a narrative stretched over time, capacity is not a momentary state; it is a function of temporal coherence. A patient might have high momentary lucidity but zero narrative continuity. They can understand the risks of a surgery today, but the "person" who wakes up post-op may not feel connected to the "person" who signed the form.

  If we take the narrative view seriously, we face an awkward paradox:
  1.  **To restore capacity, we must intervene.** We need to force the narrative integration (the "stitching") so the patient becomes a coherent agent capable of consent.
  2.  **But to intervene, we need consent.** We cannot ethically impose a narrative reconstruction on an incapacitated agent without their authorization.

  The law wants to know: *Is this person capable right now?* The narrative theorist must answer: *This person is currently a draft, not a final text. Their capacity is emergent, not present.*

  This creates a dangerous opening for paternalism. If the clinician decides that "narrative coherence" is the goal, they become the editor of the patient's life story. Who decides which version of the story is the "true" one? In dissociative conditions, one alter might want safety through silence, while another wants healing through speech. If the clinician prioritizes the "coherent whole," they may have to override the immediate wishes of the current dominant state to serve the hypothetical future integrated self.

  This undermines the legal standard of "assent." It suggests that we might need to treat patients *against* their current expressed will to restore the very self that is capable of having a will. It implies that a patient can be "too fragmented to refuse." This is a volatile standard. It risks allowing clinicians to define "coherence" in ways that suit institutional convenience (e.g., a compliant patient is a "coherent" patient).

  **Conclusion**
  Despite this legal risk, the clinical imperative remains: **Existence precedes comfort.** You cannot optimize the well-being of a self that does not cohere. The clinician must act as a narrative architect, even if it causes temporary structural stress. To do otherwise is to accept that the patient is a collection of biological reactions without a biographical life. The harm of fragmentation is the loss of the future. The legal system will struggle to categorize this, because the law protects the rights of the entity as it *is*, while narrative therapy fights for the entity as it *must become*. In this gap, the clinician must bet on the becoming.
