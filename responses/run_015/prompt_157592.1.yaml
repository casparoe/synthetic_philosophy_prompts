  Part 2: Disagreements table. Each camp's position in wording they'd sign off on. The cruxes: one is whether "the common world" requires agreement on empirical facts or just shared spaces of appearance; another is whether bureaucratic omission in democratic governance is structurally identical to totalitarian self-deception or categorically different.

