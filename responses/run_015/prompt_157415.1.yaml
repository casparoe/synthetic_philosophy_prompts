answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Ontological and Formal Status of Bounded Rationality
  **Parties:** Procedural Rationality Camp (PRC) | Constrained Optimization Camp (COC)

  ## I. JOINT EMPIRICAL AND FORMAL COMMITMENTS

  Both camps affirm the following claims as baseline premises for further theoretical development. Signing this section indicates agreement that these propositions are non-controversial within the scope of this collaboration.

  1.  **Formal Structure of Choice and Stopping:** Decision problems frequently involve sequential search over a set of alternatives that is either unknown ex ante or too large for exhaustive enumeration. In such contexts, agents employ stopping rules that terminate search prior to the evaluation of all feasible options. Both camps agree that the mathematical representation of a stopping rule can be expressed as a condition $S(h_t) = \text{stop}$, where $h_t$ is the history of search up to time $t$.
  2.  **Reality of Cognitive and Organizational Limits:** Human agents operate under strict biological constraints on memory, attention, and computational speed. Organizational agents operate under constraints on communication bandwidth and coordination costs. Both camps agree that these limits are empirically measurable and causally relevant to decision outcomes; neither camp posits omniscience or instantaneous computation.
  3.  **Aspiration Adjustment Mechanisms:** Consistent with administrative field studies, aspiration levels are not static. Both camps agree that observed aspiration levels adjust endogenously: successful outcomes relative to current aspirations tend to raise future aspiration levels, while repeated failure tends to lower them. This feedback loop is a robust empirical regularity.
  4.  **Termination Without Global Comparison:** Agents routinely commit to choices without constructing a global preference ordering over the entire feasible set. Both camps agree that search termination is often triggered by the encounter of an option meeting a specific criterion, rather than by a comparative assessment confirming the option is the unique global maximum.

  ## II. TABLE OF SUBSTANTIVE DISAGREEMENTS

  The following table delineates the core theoretical divergences. In the "Our Position" column, each camp states its view in terms it fully endorses. In the "Opposing View (Neutral)" column, each camp describes the other's position in language that does not imply error or category mistake, suitable for joint signature.

  | Crux | Procedural Rationalist Camp (PRC) | Constrained Optimization Camp (COC) |
  | :--- | :--- | :--- |
  | **(a) Nature of Aspiration Levels** | **Our Position:** Aspiration levels function as distinct psychological representational thresholds. They are reference points that categorize outcomes as "success" or "failure" prior to utility calculation, driving learning and search direction independently of marginal cost-benefit analysis.<br><br>**Opposing View (Neutral):** The COC treats aspiration levels as implicit shadow prices derived from the marginal cost of search and the expected distribution of payoffs, serving as a computational shortcut for reservation values.<br><br>**Test Case:** *Social Reference Shift.* An agent's aspiration shifts due to peer comparison without any change in the objective cost of search or the payoff distribution of the choice set.<br>**PRC Prediction:** Aspiration shifts immediately; search behavior changes despite unchanged objective constraints.<br>**COC Prediction:** Aspiration shifts only if the agent's model of the payoff distribution updates based on social information; otherwise, behavior remains invariant to peer outcomes. |
  | **(b) Reducibility of Sequential Search** | **Our Position:** Sequential search with path-dependent stopping rules is not formally reducible to single-period optimization. The process history alters the preference structure itself (e.g., via habit formation or fatigue), making the "as-if" optimization mapping unstable or non-unique.<br><br>**Opposing View (Neutral):** The PRC argues that process history alters the preference structure itself, making the "as-if" optimization mapping unstable or non-unique.<br><br>**Test Case:** *Order Effects in Hiring.* Two agents evaluate the same set of candidates in different orders with identical search costs.<br>**PRC Prediction:** Final hiring choices will differ systematically based on order, violating the invariance required by optimization models.<br>**COC Prediction:** Final choices will differ only insofar as order provides different information updates; if information sets are equivalent, choices must converge to the same reservation value policy. |
  | **(c) Ecological Rationality** | **Our Position:** Ecological rationality is a separate causal mechanism wherein simple heuristics exploit environmental structure (e.g., non-compensatory cues) specifically because they ignore information. This is distinct from efficient search; it is a different mode of inference.<br><br>**Opposing View (Neutral):** The COC views ecological rationality as a redescription of efficient search given environmental statistics, where ignoring information is the optimal solution to a regularization problem under noise.<br><br>**Test Case:** *Less-Is-More Effect.* A heuristic ignoring 50% of available data outperforms a multiple regression model in prediction accuracy.<br>**PRC Prediction:** The heuristic wins because the cognitive architecture cannot support the regression without overfitting; the mechanism is architectural necessity.<br>**COC Prediction:** The heuristic wins because it implicitly minimizes expected error variance; it is the solution to the optimization problem under high noise-to-signal ratios. |
  | **(d) Normativity for Artificial Agents** | **Our Position:** Normative standards are substrate-dependent. Human cognition requires satisficing norms due to fixed biological limits. Artificial agents with programmable search budgets should be designed to optimize (maximize expected utility) within those budgets, not to satisfice.<br><br>**Opposing View (Neutral):** The PRC holds that normative standards are substrate-dependent, arguing that artificial agents with programmable search budgets should be designed to optimize within those budgets, not to satisfice.<br><br>**Test Case:** *Bounded-Compute AI Design.* Designing an agent with a fixed token/compute budget for a decision task.<br>**PRC Prediction:** The optimal design is an optimizer that exhausts the budget to find the best feasible solution.<br>**COC Prediction:** The optimal design is a satisficer that terminates search once the marginal expected gain falls below the marginal compute cost, even if budget remains. |

  ## III. IDENTIFICATION OF VERBAL DISPUTES

  Upon review of the disagreements above, the collaboration identifies one significant portion of the dispute as verbal rather than substantive. This divergence arises from conflicting definitions of the term **"Optimization."**

  1.  **The Divergence:**
      *   **PRC Usage:** The PRC reserves the term "optimization" for **global maximization** over a fully specified choice set without regard for the cost of the calculation process itself. Under this definition, "constrained optimization" is an oxymoron if the constraints include the cost of the optimization algorithm.
      *   **COC Usage:** The COC defines "optimization" as **maximization of expected utility relative to all constraints**, including the costs of information acquisition and computation. Under this definition, a satisficing rule is "optimal" if it yields the highest net payoff given search costs.

  2.  **Resolution of Terminology:**
      *   Both parties agree that if the cost of computation is included in the objective function, the mathematical formalisms often converge.
      *   The PRC maintains that even with computation costs included, the *psychological mechanism* employed by humans is not a maximization calculation but a threshold-matching procedure.
      *   The COC maintains that the *functional outcome* is isomorphic to maximization regardless of the mechanism.

  3.  **Agreement on Substance:**
      *   The dispute is not about whether agents face limits (both agree they do).
      *   The dispute is not about whether agents stop searching (both agree they do).
      *   The dispute **is** about whether the label "optimization" should apply to behavior that results from a non-maximizing psychological process that happens to yield high net payoffs.

  **Signatories:**

  _________________________ (Procedural Rationalist Camp)

  _________________________ (Constrained Optimization Camp)

  **Date:** _________________________
