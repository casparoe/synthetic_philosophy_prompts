answer: |-
  ### Desiderata for Evolutionary Explanation

  To break the stalemate between "what it is for" (utility) and "why it is there" (etiology), your seminar must enforce a separation of claims. An adequate answer to "Why does this population have this trait?" must specify which of the following five conditions are met.

  **1. Trait Individuation Criterion (NN)**
  *   **Requirement:** The explanation must define the trait as a distinct unit of selection, development, or measurement. It must specify whether the "trait" is the morphological structure, the developmental module producing it, or the functional capacity it enables.
  *   **Motivation:** Without this, explanations equivocate. Is the explanation for the *bone* (developmental), the *shape* (engineering), or the *defense* (functional)?
  *   **Status:** **Non-Negotiable.** You cannot explain a variable that has not been defined.

  **2. Etiological Specificity (NN)**
  *   **Requirement:** A claim of *adaptation* must establish that natural selection was the cause of the trait's *origin* or *fixation*, not merely its persistence. A claim of *byproduct/constraint* must establish that the trait arose via drift, correlation, or developmental necessity without direct selection on that specific variant.
  *   **Motivation:** Distinguishes "selected-for" (history) from "currently useful" (effect). Prevents the "reverse engineering" fallacy where current utility is assumed to be historical cause.
  *   **Status:** **Non-Negotiable.** This is the definition of adaptation.

  **3. Maintenance vs. Origin Distinction (NN)**
  *   **Requirement:** The account must separate the forces that *built* the trait from the forces that *keep* it. A trait can originate as a byproduct and be maintained by selection (exaptation), or originate by selection and be maintained by constraint (phylogenetic inertia).
  *   **Motivation:** Resolves the "current utility vs. historical origin" collapse. A trait can be an adaptation *now* without being an adaptation *then*, and vice versa.
  *   **Status:** **Non-Negotiable.**

  **4. Null Exclusion via Variation (NN)**
  *   **Requirement:** The explanation must demonstrate that the observed pattern is unlikely under a null model of drift or developmental constraint. This typically requires showing variance in the trait correlates with variance in the selective agent, or that the trait is developmentally labile enough to have been otherwise.
  *   **Motivation:** Prevents "Just-So Stories." If a trait is invariant or developmentally fixed, selection cannot be inferred solely from fit.
  *   **Status:** **Non-Negotiable.**

  **5. Developmental Independence (MP)**
  *   **Requirement:** To claim a specific trait is an adaptation, one should ideally show it can vary independently of correlated traits (modularity). If Trait A is genetically/developmentally fused to Trait B, selection on B drags A along.
  *   **Motivation:** Addresses the "Spandrels" critique. If you cannot select for the crest without selecting for the jaw, calling the crest an adaptation is category error.
  *   **Status:** **Methodological Preference.** Strict adaptationists demand this; pluralists accept "hitchhiking" traits as part of a selected complex.

  ---

  ### Structural Tensions in the List

  *   **The Hardest Requirement:** **Etiological Specificity (2).** Direct evidence of historical selection (e.g., resurrection studies, ancient DNA time-series) is available for vanishingly few systems. Demanding this excludes most evolutionary biology from making adaptation claims.
  *   **The Incompatible Pair:** **Etiological Specificity (2)** and **Null Exclusion via Variation (4).**
      *   *Why:* To prove historical etiology, you often need a specific, recent selective event (like a sweep). To rule out nulls via comparative methods, you need deep phylogenetic variation and independence. Recent sweeps (high historical resolution) often lack the deep phylogenetic signal required for robust comparative nulls. Conversely, traits conserved across deep time (good for comparative nulls) obscure the specific historical origin event. You rarely get both high-resolution history and broad comparative control.
  *   **Mixed Verdicts:** **Allowed and Expected.** An adequate account *should* return a mixed verdict (e.g., "Origin: Byproduct of Jaw; Maintenance: Stabilizing Selection for Defense"). Insisting on a binary "Adaptation vs. Not" forces the collapse you are trying to prevent.

  ---

  ### Application: The Alpine Skink Case

  **1. Trait Individuation:**
  *   *Status:* **Failed/Unclear.** The case presents "The Crest" as the trait, but the developmental data identifies "The Jaw-Adductor Module" as the causal unit.
  *   *Analysis:* If the trait is individuated as "The Crest," it is a byproduct. If individuated as "The Feeding-Defense Complex," it may be an adaptation. The explanation stalls because the students are explaining the bone, while selection acted on the module.

  **2. Etiological Specificity:**
  *   *Status:* **Conflicted.**
  *   *Analysis:* The genome sweep suggests recent selection *somewhere* in that region. However, the sister genus data suggests the outgrowth is homologous and older (burrowing function). The sweep may be for the *jaw muscle* (bite performance), dragging the crest allele with it. The crest's *origin* is likely a byproduct of jaw selection.

  **3. Maintenance vs. Origin:**
  *   *Status:* **Mixed.**
  *   *Analysis:* Origin = Byproduct of bite selection (Developmental data). Maintenance = Ambiguous. Clay models suggest predation pressure favors the crest (Utility), but mark-recapture shows no survivorship difference (No current selection). The sweep suggests recent fixation, but the lack of survival difference suggests the selection might be on the jaw, not the crest's defensive utility.

  **4. Null Exclusion:**
  *   *Status:* **Failed for Crest; Passed for Jaw.**
  *   *Analysis:* We can rule out drift for the *region* (sweep). We can rule out constraint for the *jaw* (bite improvement). We *cannot* rule out constraint for the *crest* specifically, because it is mechanically coupled to the jaw. The crest's presence is fully explained by the jaw's selection; no additional selection for the crest is required to explain its frequency.

  **5. Developmental Independence:**
  *   *Status:* **Failed.**
  *   *Analysis:* The crest forms as a mechanical consequence of the jaw attachment. Unless there is cryptic genetic variation allowing crest/jaw decoupling, the crest cannot be selected independently.

  **The Single Further Observation:**
  **Experimental Decoupling.** You need to know if the crest can be manipulated without altering bite performance.
  *   *Method:* Use CRISPR or surgical manipulation to suppress the crest without altering the adductor attachment in a lab population.
  *   *Outcome:* If crestless skinks suffer higher predation *with normal bite force*, the crest is a co-adapted defense (Maintenance Adaptation). If predation is equal, the crest is a pure spandrel of the jaw adaptation.

  ---

  ### The Invariant Optimum Case

  *Case:* Trait shape matches engineering optimum to within a few percent; invariant across 40 species; only comparison is the model.

  *   **Verdict:** This case **cannot satisfy the list.**
  *   **Reasoning:** It fails **Null Exclusion via Variation (4)** and **Etiological Specificity (2).**
      *   Without variation across the 40 species, you cannot distinguish between "Selection optimized this" and "Developmental constraints make only this shape possible."
      *   An engineering match proves *current utility* (Causal Role), but it provides zero evidence for *historical origin* (Selected Effect).
      *   Because it is invariant, you cannot demonstrate that selection *built* it rather than merely *permitted* it. It remains a plausible adaptation hypothesis, but not an adequate explanation under these desiderata.

  ---

  ### Position Scorecard

  *   **Strict Adaptationism:** Fails the Skink case (ignores developmental coupling). Fails the Invariant case (assumes fit = history).
  *   **Structuralism/Constraint:** Explains the Skink origin well, but struggles with the genome sweep and clay model data without invoking secondary maintenance.
  *   **Pluralist/Exaptationist:** Best fit for the Skink case (Origin: Constraint/Byproduct; Maintenance: Potential Utility). Requires accepting mixed verdicts.

  **Seminar Advice:** Force students to fill out a table with columns for *Origin*, *Maintenance*, and *Individuation* for every paper. If a cell is empty, the explanation is incomplete.
