      *   *Psychology Check:* Social psych says traits are weak predictors (Mischel). But "if-then" profiles (Mischel & Shoda) suggest stability in *patterns* of reaction, not cross-situational consistency. Skill acquisition research (Ericsson) emphasizes deliberate practice.
      *   *Philosophy Check:* Annas ("Intelligent Virtue") argues virtue *is* a skill. But objections remain about motivation (internalism) and unity of virtues.
