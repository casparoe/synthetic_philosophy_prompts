      *   *3. Domain Specificity:* The "Gentle/Curt" problem. Skills often don't transfer (chess mastery $\neq$ stock market mastery). Virtue implies a unified agent. *Impact:* If virtue is a skill, the resident isn't "bad," just untrained in hierarchy dynamics. If virtue is character, they are fragmented.

  5.  **Addressing the Director's Conclusion (Systems vs. Character):**
