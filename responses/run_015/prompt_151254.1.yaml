answer: |-
  # Heterophenomenological Data Vetting Protocol (HDVP) v1.0
  **Authority:** Data-Integrity Office, Multi-Site Neural Decoding Study
  **Applicability:** All Level-1 Technicians and Clinicians
  **Objective:** To determine whether a decoded semantic string constitutes a valid *heterophenomenological datum* (a text attributed to the subject) or a *system artifact* (noise misattributed to the subject).

  ## I. Operational Limitations & Disclaimers
  **This procedure is NOT designed to settle:**
  1.  **Truth-Conditions:** Whether the reported experience corresponds to external reality (e.g., whether a ceiling is actually singing).
  2.  **Consciousness Verification:** Whether the patient is truly conscious or if the report is a "philosophical zombie" output.
  3.  **Clinical Safety:** Whether the report indicates immediate medical risk (this runs parallel to, not within, this protocol).
  4.  **Metaphorical Validity:** Whether a cross-modal statement is a poetic device or a literal description of qualia.

  **Vocabulary Risk Flags:**
  Technicians must tag strings containing the following for Senior Review:
  *   **Negations of Physiology:** (e.g., "no pain," "numb," "gone") when autonomic markers are elevated.
  *   **Cross-Modal Terms:** (e.g., "loud color," "singing light," "tasting shape").
  *   **Ontological Denials:** (e.g., "I am not," "void," "nothing exists").
  *   **Impoverished Lexicon:** Repetitive use of top-5 probability words (e.g., "yes," "no," "stop") without syntactic variation.

  ---

  ## II. Decision Procedure (Ordered Sequence)

  **Step 1: Signal-to-Noise Ratio (SNR) Check**
  *   **Test:** Is the neural signal amplitude during the decoding window above the site-specific threshold (e.g., >3σ baseline)?
  *   **Sufficient Answer for Inclusion:** SNR ≥ Threshold.
  *   **Termination (Exclusion):** SNR < Threshold. *Reason: System artifact.*
  *   **Escalation:** N/A.

  **Step 2: Syntactic Stability Test**
  *   **Test:** Run the decoding window three times. Does the string remain semantically invariant (allowing for minor synonym substitution)?
  *   **Sufficient Answer for Inclusion:** Core semantic proposition remains stable across 3/3 runs.
  *   **Termination (Exclusion):** String fluctuates wildly (e.g., "pain" → "blue" → "mother"). *Reason: Decoder instability.*
  *   **Escalation:** String is stable but grammatically nonsensical (e.g., "green sleep the").

  **Step 3: Lexical Validity Check**
  *   **Test:** Are all tokens present in the decoder's trained vocabulary set?
  *   **Sufficient Answer for Inclusion:** 100% of tokens are in the trained set.
  *   **Termination (Exclusion):** Tokens are out-of-vocabulary (OOV) hallucinations. *Reason: System error.*
  *   **Escalation:** Tokens are valid but flagged as **High-Risk Vocabulary** (see Section I).

  **Step 4: Physiological Congruence Screen**
  *   **Test:** Compare the semantic content against concurrent autonomic/nociceptive markers (HR, GSR, Nociceptive Reflex).
  *   **Sufficient Answer for Inclusion:** Content is congruent OR incongruent. **(Note: Incongruence does NOT trigger exclusion under heterophenomenology.)**
  *   **Termination (Exclusion):** N/A. *Do not exclude based on physiological contradiction.*
  *   **Escalation:** **Mandatory.** Any significant incongruence (e.g., report of "calm" during tachycardia) must be flagged for Senior Review to determine if it represents a dissociative state or a decoding false positive.

  **Step 5: Attribution Confidence (Senior Review Only)**
  *   **Test:** Senior Reviewer evaluates the probability that the text originates from the patient's intentional stance versus cortical noise patterns that mimic syntax.
  *   **Sufficient Answer for Inclusion:** Reviewer assigns >50% confidence that the text reflects the patient's heterophenomenological world.
  *   **Termination (Exclusion):** Reviewer determines the text is a "syntactic mirage" (noise that looks like language).
  *   **Residual Judgment:** The reviewer must decide without access to the patient's private consciousness.

  ---

  ## III. Case Applications

  ### Case 1: The Analgesic Report
  **Input:** Decoder outputs *"there is no suffering"*
  **Context:** Patient exhibits sustained nociceptive reflexes and elevated autonomic markers.

  **Walkthrough:**
  1.  **SNR Check:** Pass (Signal strong).
  2.  **Syntactic Stability:** Pass (String stable across runs).
  3.  **Lexical Validity:** Pass (All tokens in trained set).
  4.  **Physiological Congruence:** **Fail (Incongruent).** Report denies pain; body indicates pain.
      *   *Protocol Action:* Do **not** exclude. Flag for **Mandatory Escalation** (Step 4).
  5.  **Attribution Confidence:** Senior Reviewer must decide.

  **Unwelcome Answer:**
  As the study designer, I find the **Mandatory Escalation** at Step 4 unwelcome. While the protocol correctly prevents immediate exclusion (preserving the heterophenomenological datum), it forces a clinical reviewer to adjudicate a philosophical tension. The procedure produces a "Valid but Contradictory" status. This is unwelcome because it burdens the dataset with high-conflict entries that complicate statistical analysis of pain states.

  **Residual Judgment Call:**
  The Senior Reviewer must decide: *Is this a genuine dissociative phenomenon (the patient feels no pain despite reflexes) or a decoder error mapping 'calm' vectors to 'pain' stimuli?* The procedure cannot settle this. It relies on the reviewer's intuition about the decoder's reliability versus the possibility of non-standard consciousness.

  ### Case 2: The Synesthetic Report
  **Input:** Decoder outputs *"the ceiling is singing in green"*
  **Context:** Patient in Minimally Conscious State (MCS); no prior artistic or synesthetic history.

  **Walkthrough:**
  1.  **SNR Check:** Pass.
  2.  **Syntactic Stability:** Pass.
  3.  **Lexical Validity:** Pass.
  4.  **Physiological Congruence:** Pass (No direct contradiction, though content is bizarre).
  5.  **Vocabulary Risk Flag:** **Triggered.** "Singing" (auditory) + "Green" (visual) = Cross-Modal.
      *   *Protocol Action:* Flag for **Mandatory Escalation** (Step 3/5 boundary).
  6.  **Attribution Confidence:** Senior Reviewer must decide.

  **Unwelcome Answer:**
  The procedure classifies this as **Data** (pending review) rather than **Noise**. I find this unwelcome because, operationally, this string has a high probability of being a "semantic collision" (the decoder merging visual and auditory cortex noise into a sentence). By treating it as a potential heterophenomenological world, the procedure risks polluting the dataset with poetic artifacts generated by the machine, not the mind.

  **Residual Judgment Call:**
  The Reviewer must determine: *Is this a novel emergence of synesthesia due to neural reorganization, or is it a 'glitch' where the decoder interprets co-activated visual/auditory areas as a combined sentence?* There is no operational fact to resolve this; it requires a value judgment on what counts as a "plausible" mental state for an MCS patient.

  ---

  ## IV. Unavoidable Failure Modes

  Given the commitments of the heterophenomenological method (treating the text as data regardless of truth) and the limitations of current neural decoding, the following failure modes are unavoidable even with correct protocol application:

  **1. The Artifact-as-Experience Error (False Positive)**
  *   **Scenario:** The decoder generates a grammatically coherent string from random neural noise (a "syntactic mirage"). The protocol passes it through Steps 1-3. The Senior Reviewer, biased toward finding consciousness, attributes it to the patient in Step 5.
  *   **Why Unavoidable:** Heterophenomenology brackets the question of "real" consciousness. If the text looks like a report, the method demands we treat it as a report *until proven otherwise*. Since we cannot access the private mind to prove otherwise, we must accept the risk of recording machine poetry as human experience.

  **2. The Physiological Veto (False Negative via Procedural Drift)**
  *   **Scenario:** A Senior Reviewer encounters Case 1 ("no suffering" + pain reflexes). Despite Step 4's instruction *not* to exclude based on incongruence, the reviewer's medical training compels them to mark the Attribution Confidence (Step 5) as low, effectively excluding the data.
  *   **Why Unavoidable:** The procedure relies on human reviewers who are trained to prioritize physiological truth over subjective report. The heterophenomenological bracket is counter-intuitive to clinical practice. The protocol cannot police the internal cognitive bias of the reviewer during the final judgment call.

  **3. The Ontological Literalism (Interpretive Failure)**
  *   **Scenario:** Case 2 ("ceiling singing") enters the dataset. Downstream analysts treat the string as a claim about the *ceiling* rather than a claim about the *patient's visual-auditory field*.
  *   **Why Unavoidable:** The procedure validates the *string*, but it cannot control the *interpretation* of the string in later analysis. Because the vocabulary is impoverished and metaphor-prone, the distinction between "describing the world" and "describing the experience of the world" collapses in the dataset, leading to category errors in the final study conclusions.
