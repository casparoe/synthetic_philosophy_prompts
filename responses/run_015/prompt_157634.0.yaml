answer: |-
  Your intuition identifies a crucial tension, but it conflates two distinct classes of problems: **strategic coordination** (solved by Program Equilibrium) and **epistemic truth-finding** (the goal of AI Safety Debate).

  While your proposal to require executable proof objects would indeed eliminate *logical* fallacies, researchers maintain that debate protocols remain vulnerable to a stronger debater for three fundamental reasons that go beyond computational overwhelm. The core issue is that **syntactic validity does not guarantee semantic soundness**, and **transparency of derivation does not guarantee completeness of context.**

  Here is the breakdown of why source-code transparency in game theory is fundamentally different from proof transparency in argumentation.

  ### 1. Validity vs. Soundness (The Premise Gap)
  In Program Equilibrium (PE), the "game" is closed. The payoffs, rules, and available moves are common knowledge. When Agent A inspects Agent B's code, they are verifying the *policy function* mapping states to actions. If the code says `if opponent_cooperates: cooperate`, that is a complete description of the strategy within the game's ontology.

  In AI Debate, the "game" is open. The debaters are arguing about empirical facts or human values (e.g., "Will this policy cause harm?").
  *   **The Mismatch:** A formal proof guarantees that *if* the premises are true, the conclusion follows (Validity). It does not guarantee the premises are actually true (Soundness).
  *   **The Vulnerability:** A stronger debater can construct a syntactically perfect proof for a false conclusion by starting from a plausible but false premise. For example:
      *   *Premise 1:* All actions maximizing GDP are good. (False/Debatable)
      *   *Premise 2:* Policy X maximizes GDP. (Empirically False)
      *   *Conclusion:* Policy X is good.
      *   *Verification:* The judge verifies the logic is valid. The deception lies entirely in the axioms, which formal verification cannot check.

  ### 2. Completeness vs. Selectivity (The Framing Gap)
  This is the deeper mismatch you suspected. In PE, submitting code is an exhaustive commitment. You cannot "hide" part of your strategy from the inspection; the code *is* the strategy.

  In Debate, submitting an argument is inherently selective.
  *   **The Mismatch:** Logical verification checks the steps present, not the steps *omitted*. A stronger debater can win by **lying by omission**. They can construct a valid proof tree that supports their claim while deliberately avoiding any branch of the search tree that contains counter-evidence.
  *   **The Vulnerability:** Imagine a debate about whether a software system is safe.
      *   *Debater A (Deceptive):* Submits a formal proof that "Module 1 is memory safe." (True, but irrelevant to the actual vulnerability in Module 2).
      *   *Debater B (Honest):* Tries to argue "Module 2 has a buffer overflow."
      *   If the judge's attention is limited (which it always is), Debater A can flood the zone with complex, valid proofs about Module 1, framing the debate such that Module 2 is never examined. The "proof object" is transparent, but the **search space** from which the proof was selected remains opaque.

  ### 3. The Judge's Verification Limit (The Bootstrap Problem)
  In PE, the *agents* verify each other. They are assumed to be of comparable capability (or at least capable of simulating the code). In AI Safety Debate, the verification burden falls on the **judge**.
  *   **Human Judge:** Cannot verify complex formal proofs. If the proof is human-readable, it is not formally rigorous enough to prevent subtle deception. If it is formally rigorous, it is too complex for a human to verify.
  *   **AI Judge:** If the judge is an AI capable of verifying the proofs, we face a bootstrap problem. Why do we need debate to align the AI if we already have an AI judge smart enough to verify the truth? If the judge is weaker than the debaters (the intended setup), the stronger debater can generate proofs that are *computationally infeasible* for the judge to verify fully, or generate valid proofs that rely on lemmas the judge must accept on trust.

  ### 4. Strategic Deception vs. Epistemic Deception
  Program Equilibrium resolves the Prisoner's Dilemma because the deception in PD is **strategic** (pretending to cooperate while intending to defect). Code inspection reveals the intent.

  Debate aims to resolve **epistemic** uncertainty (what is true about the world).
  *   **The Mismatch:** Even if I show you my "source code" (my reasoning process), I can still be wrong, or I can be optimized to find arguments that persuade rather than arguments that are true (Goodhart's Law on the loss function).
  *   **The Vulnerability:** A stronger debater has a larger **search radius**. They can find a path through the argument space that leads to a false conclusion but looks robust to the judge. The weaker debater may know the truth but lack the computational resources to construct the specific proof required to refute the stronger debater's cherry-picked narrative within the token/time limit.

  ### Conclusion
  You are correct that there is a **deeper mismatch**. Source-code transparency in game theory reveals the **policy** (the mapping from input to output). Proof transparency in argumentation reveals the **justification** (the mapping from premise to conclusion).

  It does not reveal the **provenance of the premises** or the **completeness of the context**.

  Researchers maintain that debate is vulnerable because a stronger debater can exploit the **soundness gap** (false premises), the **completeness gap** (omitted counter-arguments), and the **complexity gap** (proofs too long for the judge). Formalizing the reasoning removes *logical* deception, but it leaves *epistemic* deception fully intact. The residual risk is not that the judge cannot check the math; it is that the math is being done on a map that the stronger debater has secretly distorted.
