  Under epistemic restriction, the logical link between distinguishability and individuation survives, but the metaphysical grounding breaks. The heuristic remains: if no reason is accessible to distinguish entities, treat them as one. This preserves the methodological utility of the PSR in science, where unobservable differences are often discarded as explanatorily idle. However, the role of divine reason collapses. Leibniz's argument requires a reason *in re*, not just a reason *for us*. By limiting predicates to the observable, you remove the guarantee that reality itself satisfies the PSR.

