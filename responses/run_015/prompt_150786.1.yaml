  Here is my reconstruction of the passage, rendered in my own words: Leibniz holds that every substance contains a complete concept that includes all of its predicates. If two substances shared every predicate except for being two rather than one, then nothing internal to either could account for their being placed in different locations or existing at different times. Because God always acts with a sufficient reason, and because there could be no reason to assign one spatial or temporal position to substance A and a different one to substance B if they are internally identical in every respect, such a pair of substances cannot exist. The conclusion is that pure numerical difference without qualitative difference is metaphysically impossible.

