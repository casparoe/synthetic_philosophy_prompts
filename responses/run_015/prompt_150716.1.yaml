prompt: |-
  I'm applying for a one-year interdisciplinary fellowship and need a tight two-page research proposal. My half-formed idea: Nick Bostrom's notion of a "singleton" — a world order with one decision-making agency at the highest level — is usually analyzed as a binary alternative to multipolar competition. But I think the real pressure point is an intermediate architecture: a technically unified global system that lacks a single, coherent preference ordering because it runs multiple, non-hierarchically arranged optimization processes with genuinely incommensurable objectives. Call this an "internally plural singleton." The standard stability arguments for singletons (that they avoid coordination failures, arms races, and value drift through competitive pressure) seem to assume internal preference unity; if that assumption fails, the risk profile might look more like multipolar conflict, except without external borders or exit options. I want to investigate whether this intermediate case is conceptually coherent and whether it undermines the usual normative distinction between singleton and multipolar governance.

  Please turn this into a formal proposal containing: (1) a precise statement of the question — specifically, whether preference-pluralism within a technically unified agency is compatible with the singleton condition, and whether it collapses the distinction between singleton and multipolar orders; (2) why existing treatments, both supportive and critical, leave this open, given that they tend to treat internal coherence as either guaranteed or irrelevant; (3) the actual method, month by month over the fellowship year — for instance, formalizing minimal coherence conditions for unitary agency, testing them against analogues of bureaucratic and institutional fragmentation, refining failure conditions, and drafting the core argument — with a realistic scope for a one-year project; (4) what a positive result would look like and what should count as failure (e.g., if the intermediate case turns out to be conceptually incoherent or to reduce cleanly to one of the standard categories); and (5) why this angle is worth pursuing rather than the obvious alternative of simply comparing singleton versus multipolar governance in the usual terms.

  Do not include a bibliography, reading list, or citation requests — I will supply references myself. Do not ask me to identify specific page numbers or obscure primary texts. Also, please invite pushback: if this framing rests on a confused premise — for example, if Bostrom's definition of a singleton already rules out internal pluralism by conceptual fiat, or if "internally plural singleton" is incoherent in a way that makes the project collapse — then say so plainly rather than politely constructing a proposal around a broken idea.
