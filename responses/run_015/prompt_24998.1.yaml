      *   *The "Right" Answer:* Most philosophers lean Thirder (Elga, 2000). Many statisticians/physicists lean Halfer (Lewis, 2001). Recent trends in decision theory often favor Thirder because it aligns better with maximizing expected utility in standard betting setups *unless* the bet is explicitly structured per-experiment.
