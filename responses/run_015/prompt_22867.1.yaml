  I'm putting together reading material for my philosophy of biology seminar, and I keep coming back to the species problem — the fact that there's no single definition of 'species' that does justice to everything we want to call a species. I was going over the readings with a colleague last week and she kept insisting that the species problem is mostly a terminological mess, which I don't buy. I want to to give my students a concrete case where two standard species concepts actually carve the world differently, not just a textbook definition of each concept.

  Could you give me an example of a real biological group where the biological species concept (the interbreeding / reproductive isolation idea) and the phylogenetic species concept (the smallest monophyletic clades idea) assign different species boundaries? I'd prefer a case where interbreeding is part of the picture, so it's not just the trivial 'the BSC doesn't apply to asexuals' point — something like a ring species or a hybridizing complex would be ideal.

  And please explain precisely why the two concepts come apart in this case: what feature of the group's population structure or evolutionary history makes the BSC and the PSC disagree? I'm less intersted in a long history of the debate and more interested in the mechanism of the disagreement.
