          2.  **Aggregation vs. Thresholds (Premise 4):** Does a million paper cuts equal a gunshot? Many philosophers say no. There are lexical priorities.
          3.  **The Precautionary Principle's Limit (Premise 1):** We can't paralyze ourselves over low-probability risks.
          4.  **Special Obligations (Premise 5):** We are allowed to prioritize humans.
      *   *Recommendation:* The best place to break it is usually the **definition of pain (Premise 2)** combined with **non-aggregation (Premise 4)**.
      *   *Cost of Rejection:*
          *   If you reject Premise 2: You risk being wrong about suffering (moral risk).
