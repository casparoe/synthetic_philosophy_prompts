answer: |-
  Good morning. I see the coffee is doing its best, so I'll try to match its energy.

  I'm terrible at formal speeches, so let's keep this conversational.

  This workshop was [Advisor's Name]'s baby. She planned it before she passed. She had this line about hinges. She said, "A good hinge is like a doorframe. You only notice it when the door stops closing." I think she'd appreciate the room we have today. She wanted this collision.

  Half of you have wrestled with Wittgenstein's *On Certainty*. The other half wrestle with acid-free boxes and provenance chains.

  Here's the structural move I want us to make. For the curators, a catalog entry isn't usually a hypothesis you test every day. It's the background. When the catalog says "18th century," you don't reopen the carbon dating. You build on it. It's what lets you argue about attribution or condition. For the philosophers, it's basic commitments. We treat them as fixed so we can move.

  But here's the inversion I'm really interested in. Sometimes, what looks like a solid floor to the archivists looks like an open question to the philosophers. You ask, "How do you know that record is true?" And I bet some of you look at our philosophical debates and think, "Why are you still doubting the external world? Just file it."

  That tension is where the work happens.

  Now, I need to block a misreading. Calling something a hinge doesn't make it relative. It doesn't mean truth is just socially constructed or up for grabs. Recognizing a hinge isn't the same as doubting it. It's admitting that without some things held fast, inquiry doesn't happen. You can't test everything at once. If you try to check the doorframe while walking through the door, you'll trip.

  In my notes, I wrote that hinge propositions are the axiums of inquiry. I meant axioms. But maybe "axiums" sounds more like something you feel in your bones than calculate on a board.

  So, let's not just define certainty. We aren't here to solve skepticism. We're here to see how certainty works when hands are dirty. Let's find where the door sticks. Let's see what holds us up when the pressure comes.

  Thanks.
