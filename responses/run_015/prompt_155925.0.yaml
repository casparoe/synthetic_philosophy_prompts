answer: |-
  There is no single, canonical noun phrase in the philosophical or social-scientific literature that captures this exact configuration. However, the structure you have identified is a recognized and sophisticated problem that sits at the intersection of the **philosophy of social science**, **causal inference**, and **political philosophy**.

  To map the edges of this configuration, you need to combine three distinct technical concepts. The phenomenon you are describing is best understood as **Observational Equivalence** (empirical) coupled with **Normative Incommensurability** (ethical), centered around an **Essentially Contested Concept** (semantic).

  Here is how to delineate this structure from the concepts you mentioned, and the vocabulary available to name it.

  ### 1. The Empirical Core: Observational Equivalence
  In econometrics and the philosophy of science, the specific empirical situation you describe—where distinct causal models (Nature vs. Culture) produce the exact same statistical pattern—is called **observational equivalence**.

  *   **Definition:** Two or more theoretically distinct structural models are observationally equivalent if they imply the same probability distribution for the observed data.
  *   **Application:** In your argument, the "Biological-Release" model and the "Cultural-Expression" model are observationally equivalent regarding the cross-national correlation. No amount of *additional* cross-national correlational data can distinguish them, because the data is the *output* of both systems.
  *   **Distinction from Standard Underdetermination:** Standard underdetermination (Duhem-Quine) suggests that data is insufficient to prove a theory. Observational equivalence is stronger: it suggests the data is *structurally incapable* of distinguishing between the theories without external identifying assumptions (e.g., a natural experiment or longitudinal mechanism).

  ### 2. The Normative Core: Normative Underdetermination & Incommensurability
  The reason this feels more fraught than a standard scientific dispute is that the observational equivalence is bridged to **Normative Underdetermination**.

  *   **The Structure:** Usually, underdetermination is an epistemic problem ("We don't know which is true"). In your configuration, it is a *political* problem ("We cannot agree on what 'true' implies for action").
  *   **Incommensurability:** The three narratives (Biological, Cultural, Procedural) are not just different; they are **incommensurable**. They rely on different ontological commitments (what is a human?) and different axiomatic values (is justice about outcomes or processes?). Because they share no common metric for "success," the empirical data cannot arbitrate between them.
  *   **The "Pivot" Effect:** The data functions as what Ernesto Laclau and Chantal Mouffe would call a **nodal point** in discourse. It is a fixed signifier that different political projects attempt to "hegemonize" with their own meaning. The data is stable; the *signified* rotates 180 degrees depending on the speaker.

  ### 3. The Semantic Core: Essentially Contested Concepts
  The reason the "Justice-as-Procedure" narrative can coexist with the others is that "Equality" is an **Essentially Contested Concept** (W.B. Gallie).

  *   **Definition:** A concept for which no single definition is universally accepted because its very nature involves competing normative dimensions (e.g., "Democracy," "Justice," "Art").
  *   **Application:** One friend uses "Equality" to mean *freedom from coercion* (Procedural); the other uses it to mean *parity of outcome* (Substantive). The empirical correlation supports the Procedural definition (people are free to choose differently) while undermining the Substantive definition (outcomes remain disparate). The argument stalls because you are using the same word to describe two different moral technologies.

  ### Distinguishing from Your Proposed Comparisons

  **Vs. Standard Underdetermination:**
  Standard underdetermination is passive; it implies a temporary lack of data or theory. Your configuration is **active and stable**. The ambiguity is *sustained* because resolving it would require abandoning deep ontological commitments (e.g., admitting gender is purely performative or purely biological). Furthermore, standard underdetermination does not necessarily imply *opposite* normative prescriptions. In your case, the empirical stasis fuels **Normative Polarization**: the same fact is used to argue for *more* intervention (culture critique) and *less* intervention (biological acceptance).

  **Vs. The Non-Identity Problem:**
  The Non-Identity Problem (Parfit) is a specific puzzle in population ethics regarding actions that change *who* comes into existence. It is not relevant here. Your problem is not about future people or identity constitution; it is about **Causal Attribution** in existing populations. You are debating the *source* of a pattern, not the moral status of the people created by the policy.

  **Vs. Equivocation:**
  Equivocation is a logical fallacy where a word is used in two different senses within a single argument to deceive. What you are describing is not a fallacy but a **structural polysemy**. Both definitions of "choice" (autonomous preference vs. constrained adaptation) are valid within their respective frameworks. The problem is not linguistic sloppiness; it is that the social world allows both definitions to map onto the same statistical reality.

  ### Suggested Terminology

  If you need a label for this argumentative configuration in writing or discussion, there are three options ranging from descriptive to technical:

  1.  **The Normative Rorschach:** (Metaphorical) Best for general audiences. It captures the idea that the data is an inkblot onto which opposing ideologies project their pre-existing causal and moral commitments.
  2.  **Observational Equivalence with Normative Divergence:** (Technical) Best for social science contexts. It precisely identifies that the statistical models are indistinguishable, but the policy implications diverge.
  3.  **The Causal-Normative Decoupling:** (Analytical) This highlights the specific failure you identified: the link between "what is" (the correlation) and "what ought to be done" (the policy) has been severed, allowing the "is" to support contradictory "oughts."

  ### The Edge of the Map
  The edge of this problem lies in **Social Ontology**. You cannot resolve this argument empirically because it is not an empirical disagreement. It is a disagreement about **what kind of thing gender is**.
  *   If gender is a *preference distribution*, the data shows liberation.
  *   If gender is a *power structure*, the data shows hegemony.
  *   If gender is a *legal category*, the data shows procedural success.

  The "Gender-Equality Paradox" is not a paradox of data; it is a **paradox of ontology**. The empirical pattern is a **stable equilibrium of ambiguity**. It persists precisely because it allows incompatible political coalitions to agree on the *measurement* while disagreeing on the *meaning*.

  In the literature surrounding the Gender-Equality Paradox (e.g., Stoet & Geary vs. Richardson et al.), this is often discussed under the header of **"Interpretive Flexibility"** (a term from Science and Technology Studies). You might accurately describe your friend's deadlock as a case of **High-Stakes Interpretive Flexibility**, where the flexibility of the data's meaning is the only thing preventing the argument from collapsing into pure ideology.

  **Summary Recommendation:**
  If you need to name this in a text, I recommend: **"A case of observational equivalence sustaining normative incommensurability."** If you need a shorter label, **"The Normative Rorschach"** is the most evocative, though less technical. The structure is not a fallacy, but a **feature of complex social systems** where causal mechanisms are opaque and values are contested.
