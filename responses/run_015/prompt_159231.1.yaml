answer: |-
  Random selection serves multiple, distinct political values that are not always aligned. It secures descriptive representation by mirroring the demographic and cognitive diversity of the population; it enhances epistemic quality by incorporating lived experiences excluded from elite career paths; it ensures independence from donor influence and electoral cycles; and it embodies political equality by equalizing the probability of office. Consequently, sortition answers objections regarding elite capture, careerism, and systemic exclusion, but optimizing for one value (e.g., strict equality of condition) may undermine another (e.g., collective competence or deliberative efficiency).

  **Claims in your proposal that rest on a mistake:**

  1.  **"As I understand the case for the lot, it is at bottom an equality case."** This is reductive. While political equality is central, the epistemic value of diversity and the independence from electoral incentives are equally fundamental to the justification for sortition.
  2.  **"Any channel through which some members come to be better informed than others reinstates... exactly the inequality of influence that the lot was introduced to abolish."** This conflates information asymmetry with power asymmetry. In a deliberative body, influence derived from specialized knowledge acquired through division of labor is functionally distinct from influence derived from wealth, status, or coercion.
  3.  **"A chamber with unequal information is to that extent not a lottery chamber at all."** This is a category error. The "lottery" character is defined by the method of selection and equality of status, not by the uniformity of internal workflow or information intake.
  4.  **"Since no member can ever stand for anything again, the chamber faces no incentive distortions worth designing around."** This ignores internal status-seeking, ideological legacy-building, and post-service career incentives, all of which can distort behavior even without re-election.

  ***

  You are wrong that the egalitarian logic of sortition commits you to this strong, information-equalizing version. Your argument rests on a category mistake regarding the nature of democratic equality and a misunderstanding of the epistemology of collective decision-making.

  The core error is conflating *equality of status* (the democratic foundation) with *equality of condition* (the operational method). The lot guarantees that every citizen has an equal chance to enter the chamber and that, once inside, every member has an equal vote and equal protection from removal. This secures the "ruling and being ruled in turn" ideal. However, it does not follow that every member must consume the same information to remain equal. In fact, enforcing strict information equality undermines the chamber's capacity to rule effectively, thereby weakening its democratic authority.

  Reasoning from first principles, a legislative body exists to make decisions under uncertainty. To do this well, it must process information. Human cognitive capacity is limited; 200 members cannot deeply scrutinize every bill, expert testimony, and budget line individually without succumbing to fatigue and superficiality. If you force all members to hear all testimony in plenary, you do not create equality; you create collective ignorance. The members will rely on heuristics, charisma, or the few who happen to have prior expertise, actually *increasing* unregulated inequality of influence.

  A division of cognitive labor is necessary for competence. If members specialize via committees, some will know more about healthcare and others about infrastructure. This creates temporary information asymmetries, but it does not recreate the oligarchic inequality the lot abolishes, provided two conditions are met: (1) the asymmetry is transparent and accountable, and (2) the final authority remains with the whole. Influence gained through hard work and specialization is legitimate democratic influence; it is distinct from influence gained through wealth or party machinery. The lot eliminates the latter; it should not penalize the former.

  Furthermore, your assumption that single non-renewable terms eliminate incentive distortions is dangerous. Without the discipline of re-election, members may seek influence to build a reputation for future employment, to satisfy ideological donors outside the chamber, or simply to dominate peers for status. Strict information equality does not stop this; it merely blinds the rest of the chamber to the sources of influence. If a member meets privately with an expert but cannot tell others what was learned, trust erodes. If they meet privately and *report back* to the group, the group benefits from the knowledge while maintaining oversight.

  **Where to draw the line:**

  You should allow committee structures, private briefings, and individual expert meetings, but constrain them with robust transparency and reciprocity rules rather than bans.

  1.  **Committee System:** Assign members to committees by lot, rotating annually. This preserves equality of opportunity while enabling specialization.
  2.  **Transparency Mandate:** Any private briefing or expert meeting must be logged, and a summary of the information received must be filed with the non-partisan briefing office for distribution to all members.
  3.  **Reciprocity:** Members who acquire specialized information have a duty to summarize it for the plenary. Influence is legitimized through teaching, not hoarding.
  4.  **Plenary Sovereignty:** Committees propose, but the plenary disposes. No decision is final without a vote by the whole chamber, ensuring that specialized knowledge is subjected to general scrutiny.

  **Why this line?**

  This design respects the egalitarian logic of sortition without sacrificing its epistemic potential. It treats members as capable agents who can be trusted with unequal information so long as they remain accountable to their peers. It recognizes that democratic equality is about the equal power to decide, not the equal consumption of data. By enabling division of labor, you increase the collective competence of the chamber, making it a more formidable counterweight to the elected lower chamber and the executive. A chamber that is equally informed but equally overwhelmed is not democratic; it is dysfunctional. A chamber that divides labor but shares authority is both democratic and competent.
