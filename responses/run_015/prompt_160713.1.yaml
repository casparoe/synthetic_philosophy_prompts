          *   Cousin: Real World empowers them (tax forces sale). Second-Passage disempowers them (no tax pressure).
      *   *Conclusion:* The Second-Passage system forces the Brother and Granddaughter to argue about *value* and *future*, not just *survival*. That's better for a novel.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I answer the specific questions?* Yes (Presuppositions, Strict Theory, Character Alignment, Which Fight).
      *   *Is it too technical?* Keep tax jargon minimal, focus on the logic.
      *   *Did I address the "Home Relief" point?* Yes, distinguish use-value from exchange-value.
      *   *Did I address the "Income" point?* Yes, distinguish labor from transfer.

  8.  **Final Polish:** Ensure the distinction between "justice" and "rates" is clear. The Real World system makes the tax bill the villain. The Second-Passage system makes *Time* the villain.

  *(Self-Correction on the Brother)*: Wait, in the Real World, if the Brother lived there, he might have a claim to the house specifically, but the *tax* is on the estate. The tax forces the sale. So the Real World sides with the Cousin (liquidity). In the Second-Passage, the tax doesn't force the sale *now*. So the Brother can stay. But the asset is "poisoned" for the next generation. This changes the Brother's motivation from "Save the house from the taxman" to "Is it right to burden my child?" That's a richer conflict.

  *(Self-Correction on the Granddaughter)*: In Real World, she gets money. In Second-Passage, she gets the asset tax-free. But the "Youth Stake" gives her cash anyway. So she gets *double* advantage? No, the Youth Stake is for *everyone*. She gets the house + the stake. That makes her very privileged. This heightens the Brother's resentment.

  *(Final Plan)*: Structure clearly with headings. Be decisive. Use the "straight line" metaphor.

  9.  **Final Review against constraints:** "Please also be strict about which parts of the practice strictly need the theory and which parts several quite different theories would happily license." I need to make sure I explicitly call this out.

      *   *Real World:*
