      *   **Constraints:** Be strict about which parts of the practice need which theory. Distinguish real disagreements about justice from squabbles about rates. Don't get bogged down in specific real-world tax code details (treat the user's description as the premise).
      *   **Characters:**
          1.  Brother (Stayed, cared for mother, 11 years).
          2.  Granddaughter (Never met grandmother, equal share).
          3.  Cousin (Wants to sell, pragmatic).
      *   **Scenarios:**
          1.  Real World System (Estate tax, step-up in basis, gift rules, home relief).
          2.  Fictional "Second-Passage" System (No tax on 1st transfer, escalating tax on subsequent transfers, revenue to youth stake).

  2.  **Deconstruct the Real World System (as described by the user):**
      *   *Features:* Tax on estate (transferor side), not recipient income. Step-up in basis (unrealized gains vanish). Gift rules (look at donor intent/timing). Home/Farm relief.
      *   *Philosophical Presuppositions:*
          *   **The Household as Unit:** It treats the family economy as a single blob that dissolves at death. It doesn't care much about the *recipient's* need or effort, but rather the *donor's* right to dispose.
          *   **Death as the Event:** Dying is the taxable moment, not receiving. This implies property rights are absolute until the owner ceases to exist.
          *   **Income vs. Windfall:** Receiving inheritance isn't "income" (labor), it's a change of title.
          *   **Use-Value vs. Exchange-Value:** Home/Farm relief implies land for *living/working* is different from land for *investing*. It values continuity of use over liquidity.
          *   **Intent:** Gift rules imply the state cares about avoiding tax avoidance, policing the *timing* of the transfer relative to death.
      *   *Strict Theory vs. Multiple Theories:*
          *   *Needs Specific Theory:* Home relief (presupposes "use" > "market"). Step-up in basis (presupposes taxing unrealized gains is too hard/unfair).
          *   *Compatible with Multiple Theories:* Taxing the estate vs. recipient (could be admin ease OR donor rights).

  3.  **Deconstruct the Fictional "Second-Passage" System:**
      *   *Features:* 1st transfer tax-free. 2nd+ transfer taxed heavily (escalating). Revenue to 18-year-old stake.
      *   *Philosophical Presuppositions:*
          *   **The Earners' Right:** You made it, you keep it, you give it once. Your claim is strong but finite.
          *   **Dynastic Stagnation:** The problem isn't wealth *size*, it's wealth *duration* (entrenchment). Old money is worse than new money.
          *   **Equality of Starting Point:** The youth stake implies equality of *opportunity at the start of adulthood*, not equality of outcome.
          *   **Circulation of Capital:** Assets *should* move. Hoarding across generations is the sin.
      *   *Comparison Class:* Generation vs. Lifetime. It focuses on the *lineage* rather than the individual.

  4.  **Map Characters to Systems:**
      *   **Brother (Caregiver):**
          *   *Real World:* Ambiguous. Might benefit from "home relief" if he lives there, but the tax bill hits the estate before division. He argues for *labor* (care) being worth equity. The law doesn't really see care as equity.
          *   *Second-Passage:* If this is the *first* transfer (Mom to Kids), no tax. He keeps the house easier. But if he dies and leaves it to *his* kid, the tax hits hard. He represents *stewardship*.
      *   **Granddaughter (Outsider):**
          *   *Real World:* Gets equal share despite no labor/relationship. Law sees blood/legal tie as sufficient.
          *   *Second-Passage:* Gets the asset tax-free (1st passage). But if she sells, she cashes out. If she keeps it, she burdens her kids.
      *   **Cousin (Seller):**
          *   *Real World:* Wants liquidity to pay the tax. The tax forces the sale. The system *aligns* with the cousin because the tax bill demands cash, often forcing the sale of the house.
          *   *Second-Passage:* If it's the 1st passage, no tax pressure to sell. The Cousin loses their main lever (the tax bill).

  5.  **Identify the "Real Fight":**
      *   *Real World:* The fight is about *Recognition of Labor vs. Legal Entitlement*. Brother vs. Granddaughter. The Cousin is the agent of the State's logic (liquidity).
      *   *Second-Passage:* The fight shifts. Since there's no immediate tax bill, the pressure to sell vanishes. The fight becomes about *Stewardship vs. Opportunity*. Brother wants to keep it forever. The System says "You can keep it, but your kids can't." The Granddaughter gets a free ride initially, but the asset is "tainted" for the future.
      *   *Which gives the better fight?* The Second-Passage system creates a more interesting philosophical conflict about the *future* of the house, rather than the immediate *survival* of the house.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Direct, analytical, "straight lines." Avoid waffle.
      *   *Structure:*
          1.  Real World System Analysis (Presuppositions).
          2.  Strict Theory Check (What *needs* the theory).
          3.  Second-Passage System Analysis (Presuppositions).
          4.  Character Alignment (Who wins/loses in which).
          5.  The "Real Fight" Recommendation.
      *   *Refining the "Real World" analysis:* Focus on the "Household as Unit" and "Death as Event." The step-up in basis is crucial—it implies the state forgives the past to tax the future.
      *   *Refining the "Second-Passage" analysis:* Focus on "Wealth Circulation." It's not about redistribution of *amount*, but redistribution of *time*.
      *   *Refining Character Mapping:*
