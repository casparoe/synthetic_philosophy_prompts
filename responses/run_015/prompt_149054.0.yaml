prompt: |-
  I write about science and ideas for a British broadsheet, and after a decade of filing on the cognitive science of religion I have drifted into holding a position that is recognisably mine rather than one I am merely reporting. I should like it stress-tested before I commit it to print.

  The position has three parts. First, origins: the cognitive machinery that makes religious thought cheap and easy for human beings — promiscuous agency detection, an over-eager theory of mind, teleological bias, intuitions about contagion and about the dead — is a by-product of capacities selected for other work. Nothing in our ancestral history was selected because it produced religion. Second, persistence: what cultural transmission then filters for is not doctrine but cost. Fasts, pilgrimages, tithes, dietary rules, celibacy, distinctive dress, prayer at inconvenient hours — these are what make commitment legible to others and hard to fake, and groups that carry them outlast groups that do not. Third, and this is the part I take to be my own: propositional content functions chiefly as load-bearing scaffolding for those costs. It supplies reasons for bearing them that feel non-negotiable, and it is largely substitutable. What is transmitted down the generations is the cost structure, with the theology as the replaceable part that happens to be fitted to it at the time.

  So: what would count against this?

  I want defeaters, ranked from fatal down to merely awkward, and separated by kind — the empirical findings that would sink it, the conceptual objections that would show it confused or empty, and the results that would merely force me to rewrite a paragraph. For each, say what my position predicts that its rivals do not: the straightforward by-product story, the cultural-group-selection story that leans on morally concerned high gods and supernatural monitoring, and the generic costly-signalling accounts. And for each, say whether it is something a sympathetic defender of my position should concede as counting against them, or something I would be entitled to explain away.

  Three things worry me in particular, and I should like them addressed directly.

  One: the substitutability clause may have quietly made the whole thing unfalsifiable, since any stubborn piece of doctrine can always be re-described as locally necessary for locally required costs. If so, is there a formulation of the view that still risks something? And is a view of this kind entitled to be insulated in that way, or is the insulation itself the objection?

  Two: the discriminating predictions. My view says that the cooperative and prosocial premium associated with religion should track practice rather than belief, so that people who stop believing but keep practising retain most of it, while people who keep believing and stop practising lose it. It also says that where a welfare state, a mutual-aid society or an insurance market takes over the functions religious communities once provided, costly practice should decay before belief does. The design I keep asking somebody to run, and which so far as I know nobody has run, is a multi-wave panel across half a dozen countries that separates believing from belonging and tracks in-group cooperation, charitable giving, trust of strangers and self-reported behaviour over a decade or more. Tell me precisely which outcomes would refute me. I take it that a result in which the believing-without-practising group keeps the premium is bad for me; I am much less sure what I should say if both groups lose it at the same rate, or if the premium turns out to have been a selection artefact all along.

  Three: scope and collapse. Am I really making a claim about religion, or about a handful of post-Axial, mostly Abrahamic traditions that happen to be the ones I have reported on? And if cost does all the explanatory work and content none, does the position collapse into a general theory of costly commitment that would predict the same effects for a party cell, a military unit or a demanding amateur sports club — and should I count that as a refutation or as a Pyrrhic vindication?

  Two further requests. Please flag where the standard distinction between rare, high-arousal imagistic rituals and frequent, routinised doctrinal ones cuts against me, since I suspect my single currency of cost is really two or three currencies I have conflated. And please say plainly if the view is defensible as journalism but empty as a research programme, or the reverse. For what it is worth: the thing that would move me most is a failed pre-registered prediction rather than an armchair case about possible worlds, and the thing that would move me least is being told I have not defined religion, unless you can show that the undefended definition is doing real work in the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A science/ideas writer for a British broadsheet (e.g., *The Guardian*, *The Telegraph*, *The FT*). Experienced (decade+), sophisticated, familiar with cognitive science of religion (CSR), cultural evolution, and signaling theory. They have developed a specific synthesis/view and want it "stress-tested."
      *   **The Position:**
          1.  *Origins:* Religion is a by-product of cognitive machinery (HADD, ToM, teleology, etc.). No direct selection for religion.
          2.  *Persistence:* Cultural selection filters for *costly signals* (fasts, pilgrimages, etc.) because they ensure commitment and group survival.
          3.  *Content (The User's Contribution):* Propositional content (theology/doctrine) is merely scaffolding for the costs. It justifies the costs but is largely substitutable. The *cost structure* is what transmits; theology is the replaceable shell.
      *   **The Task:** Stress-test this position. Provide defeaters (fatal to awkward), categorized by kind (empirical, conceptual, minor). Compare predictions against rivals (By-product, Big God/Supernatural Monitoring, Generic Costly Signaling). Address three specific worries (Unfalsifiability, Discriminating Predictions/Panel Data, Scope/Collapse). Address two further requests (Imagistic vs. Doctrinal rituals, Journalism vs. Research Programme).
      *   **Tone:** Intellectual, rigorous, respectful, critical but constructive. British broadsheet style (precise, slightly formal but accessible).

  2.  **Deconstruct the Position & Identify Weak Points:**
      *   *Core Claim:* Content is scaffolding; Cost is the engine.
      *   *Weakness 1 (Unfalsifiability):* If content changes but costs remain, you say "content is substitutable." If costs change but content remains, you say "costs adapted." If both change, "evolution." The risk is that "substitutable" becomes a get-out-of-jail-free card.
      *   *Weakness 2 (Content Causality):* Does content *really* do nothing? Some doctrines explicitly demand costs (e.g., martyrdom). Some doctrines forbid costs (e.g., Protestant rejection of Catholic penance). If content drives cost variation, the "scaffolding" metaphor weakens.
      *   *Weakness 3 (Imagistic vs. Doctrinal):* Whitehouse's modes of religiosity theory suggests high-arousal/low-frequency rituals bind differently than low-arousal/high-frequency doctrines. The user lumps them into "cost." This might miss the *mechanism* of binding.
      *   *Weakness 4 (Scope):* If this applies to football hooligans and communist cells, is it a theory of *religion* or a theory of *groups*? If the latter, does it explain the *specific* stability of religious groups better than secular ones?

  3.  **Drafting the Defeaters (Categorized):**

      *   *Category 1: Empirical Fatalities.*
          *   Need a finding where content *causes* persistence independent of cost.
          *   Need a finding where low-cost/high-content groups outlast high-cost/low-content groups.
          *   *Prediction:* User says Practice > Belief for cooperation. Rival (Big God) says Belief (in monitoring) > Practice.
      *   *Category 2: Conceptual/Structural.*
          *   The "Scaffolding" metaphor implies content is passive. But content often *regulates* cost (e.g., dispensations, indulgences).
          *   The "Substitutability" trap.
      *   *Category 3: Minor/Rewrite.*
          *   Nuance on "cost." Not all costs are equal (pain vs. time vs. opportunity).

  4.  **Addressing the Three Specific Worries:**

      *   *Worry 1 (Unfalsifiability):* Acknowledge the risk. To fix it, define limits on substitutability. E.g., Content cannot contradict the cost structure without causing collapse. Or, specific doctrinal shifts *must* precede cost shifts if content is truly inert.
      *   *Worry 2 (Discriminating Predictions/Panel Data):*
          *   *Refutation:* If "Believing-only" retains the cooperation premium equal to "Practising-only."
          *   *Refutation:* If "Practising-only" loses the premium immediately upon loss of belief (suggests belief drives the cost's meaning).
          *   *Artefact:* If the premium disappears when controlling for SES/education (suggests religion is just a proxy for stability).
      *   *Worry 3 (Scope/Collapse):*
          *   If it applies to sports clubs, it's a theory of *ultra-sociality*, not just religion. This isn't fatal but requires rebranding.
          *   *Distinction:* Religious costs often involve *supernatural* stakes, which changes the calculus of "faking."

  5.  **Addressing the Further Requests:**

      *   *Imagistic vs. Doctrinal (Whitehouse):* This is a major critique. High-arousal rituals (imagistic) create fusion without complex doctrine. Doctrinal modes require orthodoxy. The user's "single currency of cost" conflates these. *Impact:* Needs to split "cost" into "fusion-generating" vs. "compliance-generating."
      *   *Journalism vs. Research:* It's good journalism (synthesizes complex fields) but risky research (hard to operationalize "scaffolding").

  6.  **Refining the Arguments (Self-Correction/Polishing):**
      *   *Check:* Did I rank the defeaters? Yes.
      *   *Check:* Did I compare against rivals (By-product, Big God, Generic Signaling)? Need to ensure this is explicit in each section.
      *   *Check:* Tone. Ensure it sounds like a peer review from a colleague, not a hostile takedown. Use phrases like "The hard case for you is..." or "Your rivals would pounce on..."
      *   *Specific Focus:* The user's unique contribution is the *substitutability of content*. This needs the most scrutiny. If content is truly substitutable, why do heresies cause schisms? Schisms suggest content *matters* for group cohesion, not just cost.

  7.  **Final Review against constraints:**
      *   British broadsheet style (intellectual, precise).
      *   Address all 3 worries.
      *   Address 2 further requests.
      *   Rank defeaters.
      *   Distinguish what to concede vs. explain away.

  8.  **Constructing the Output:** (Mental Outline)
      *   Introduction: Acknowledge the sophistication of the synthesis.
      *   Section 1: Defeaters (Empirical, Conceptual, Minor). Include predictions vs. rivals.
      *   Section 2: Addressing the Three Worries (Unfalsifiability, Predictions, Scope).
      *   Section 3: Further Requests (Whitehouse/Imagistic, Journalism vs. Research).
      *   Conclusion: Final verdict on viability.

  *(Self-Correction during drafting)*: I need to be careful not to just repeat standard CSR critiques. The user knows the standard stuff. I need to target the *specific synthesis* they proposed (Content = Scaffolding). The strongest attack is that content *constrains* cost. You can't just swap Trinity for Tawhid without changing the cost structure (e.g., clerical hierarchy vs. direct submission).

  *(Refining the "Panel Study" answer)*: The user asks what results would refute them.
      *   Refutation 1: Belief-only retains prosociality (kills the "cost is king" claim).
      *   Refutation 2: Practice-only loses prosociality *because* they lost belief (kills the "content is inert" claim).
      *   Refutation 3: Both lose it equally (suggests the "religious premium" is just social capital, not specific to religious mechanics).

  *(Refining the "Unfalsifiability" answer)*: To make it falsifiable, the user must predict *lag*. If content changes, costs should remain stable for a generation. If costs change, content should lag. If they move in lockstep, content isn't scaffolding; it's load-bearing.

  *(Refining Whitehouse)*: The user's "cost" metric is too blunt. Imagistic rituals don't need "scaffolding" in the same way. They create fusion directly. Doctrinal rituals need the scaffolding. This suggests the theory only applies to *doctrinal* religions (mostly Abrahamic), confirming Worry 3.

  Let's write it.cw
answer: |-
  This is a robust synthesis. You have effectively married the cognitive by-product account (Boyer, Atran) with the cultural evolutionary account (Norenzayan, Sosis) but added a specific functional role for theology that distinguishes your view from both. Your claim that doctrine is *scaffolding* for cost, rather than the source of cost or a mere epiphenomenon, is the novel hinge upon which the argument turns.

  Here is the stress test you requested, ranked by severity, followed by direct addresses to your three worries and two further requests.

  ### Part I: Defeaters

  #### 1. Fatal Empirical Defeaters
  These are findings that, if established, would require you to abandon the core mechanism (content as substitutable scaffolding).

  *   **The Heresy Schism Data:**
      *   **The Finding:** Historical or ethnographic data showing that groups split primarily over low-cost propositional differences (e.g., the *Filioque* clause, transubstantiation mechanics) *without* accompanying changes in cost structure (tithes, fasting, dress), and that these splits result in distinct, stable lineages.
      *   **Why it sinks you:** If content alone can drive group fission while costs remain constant, content is not merely scaffolding; it is a boundary marker independent of cost.
      *   **Rival Predictions:**
          *   *Big God/Supernatural Monitoring:* Predicts schisms over moral/monitoring doctrines, not metaphysical niceties, unless those niceties affect monitoring.
          *   *Generic Signalling:* Predicts schisms only when signals become too cheap or too expensive, not over semantics.
          *   *Your View:* Predicts schisms occur when the cost structure becomes unsustainable or when a faction proposes a more efficient cost structure. Content changes *to justify* the new costs.
      *   **Concede or Explain?** Concede. If theology drives separation without cost changes, the "substitutable scaffolding" claim is false.

  *   **The "Belief-Only" Prosociality Retention:**
      *   **The Finding:** In the panel study you envision, individuals who cease costly practice but retain belief (the "believing without belonging") retain the in-group cooperation premium at levels statistically indistinguishable from full practitioners.
      *   **Why it sinks you:** Your position rests on cost making commitment legible. If belief alone sustains the cooperative premium, cost is not the primary transmission vehicle.
      *   **Rival Predictions:**
          *   *Big God:* Predicts belief in monitoring sustains prosociality even without practice (if the god is still watching).
          *   *Generic Signalling:* Predicts the premium vanishes without the signal.
          *   *Your View:* Predicts the premium vanishes because the signal is gone; the scaffolding (belief) cannot hold the weight without the structure (cost).
      *   **Concede or Explain?** Concede. This is the direct empirical test of your second and third premises.

  #### 2. Conceptual Defeaters
  These objections suggest the theory is confused or describes a different phenomenon than intended.

  *   **The Content-Constrains-Cost Objection:**
      *   **The Argument:** Doctrine often *forbids* certain costs or *mandates* specific ones that are inefficient for group survival. (e.g., Catholic celibacy reduces reproductive fitness; Jain *ahimsa* restricts economic activity; Protestant rejection of confession removes a coordination mechanism). If content dictates cost inefficiencies that persist for centuries, content is not a passive scaffold fitted to the cost; it is a load-bearing wall that dictates the cost structure.
      *   **Why it hurts:** It reverses your causal arrow. Instead of cost selecting for justifying content, content selects for costly implications.
      *   **Rival Predictions:**
          *   *By-product:* Content is a noise-filled output of cognition; inefficiencies are expected.
          *   *Cultural Group Selection:* Inefficient doctrines should be selected out unless they serve a hidden function (e.g., celibacy frees resources for the church).
          *   *Your View:* Should predict that inefficient costs are eventually rationalized away or the doctrine shifts.
      *   **Concede or Explain?** Explain away. You can argue that these "inefficient" costs serve a higher-order signalling function (e.g., celibacy signals total commitment to the institution over the family). But you must show the *doctrine* didn't force the cost.

  *   **The "Empty Scaffolding" Problem:**
      *   **The Argument:** If content is truly substitutable, why is conversion difficult? If I swap the scaffolding (Christianity for Buddhism), why doesn't the cost structure slide easily into the new mould? The friction of conversion suggests the scaffolding is chemically bonded to the structure, not merely leaning against it.
      *   **Why it hurts:** It suggests your distinction between content and cost is an analyst's distinction, not a psychological one.
      *   **Concede or Explain?** Explain away. Argue that the friction is due to *sunk costs* in the old scaffolding, not the new scaffolding's incompatibility.

  #### 3. Minor Defeaters (Rewrite a Paragraph)
  *   **The Secular Cost Equivalence:** If data shows that secular groups with identical cost structures (e.g., Alcoholics Anonymous, revolutionary cells) have identical persistence rates to religious groups, you haven't explained religion; you've explained commitment. (See Worry Three).
  *   **The Low-Cost High-Growth Exception:** If a religious movement grows rapidly with *low* costs (e.g., certain forms of modern Pentecostalism or "prosperity gospel" which lower barriers), your persistence claim needs nuance regarding *environmental pressure*. High costs are only selected for in high-competition or high-threat environments.

  ---

  ### Part II: Addressing Your Three Worries

  #### Worry One: Unfalsifiability and Substitutability
  You are right to be anxious. The claim "content is substitutable" risks becoming a tautology: if content changes, it was substitutable; if it doesn't, it was locally necessary.

  **How to make it falsifiable:**
  You must introduce a **time-lag prediction**. If content is scaffolding for cost, then changes in cost structure should *precede* changes in doctrine, or doctrine should shift to accommodate cost changes within a specific generational window (e.g., 20–30 years).
  *   **The Test:** Identify historical moments where religious groups altered their cost structure (e.g., Vatican II relaxing fasting rules; Mormonism ending polygamy).
  *   **Falsification:** If doctrinal shifts occur *without* prior or concurrent shifts in cost/behavioural demands, or if cost shifts occur *without* subsequent doctrinal rationalisation, the "scaffolding" model fails.
  *   **Insulation:** You are not entitled to insulation. If you claim content is *functional* (it supplies reasons), it must be observable that the reasons track the costs. If the reasons remain static while costs vanish, the reasons were not doing the work.

  #### Worry Two: Discriminating Predictions (The Panel Study)
  You asked for precise outcomes that would refute you. Let us assume the study controls for SES, education, and baseline trust.

  1.  **Refutation Outcome A:** The "Believing-Only" group retains the prosocial premium (trust, giving) at levels equal to the "Practising-Only" group.
      *   *Implication:* Belief drives the behaviour; cost is secondary. This supports the *Supernatural Monitoring* hypothesis over yours.
  2.  **Refutation Outcome B:** The "Practising-Only" group loses the prosocial premium *faster* than the "Believing-Only" group, or loses it immediately upon cessation of belief (even if they keep practising for a while).
      *   *Implication:* This suggests the *meaning* (content) validates the cost. Without the content, the cost is just hardship, not a signal. This refutes the "content is substitutable" claim; content is the *interpreter* of the cost.
  3.  **Refutation Outcome C:** Both groups lose the premium at the same rate, and that rate matches the decay of secular social clubs.
      *   *Implication:* The "religious premium" is a selection artefact of social stability. Religion is just a vessel for general social capital. This collapses your view into a general theory of group dynamics (see Worry Three).

  **What to say if the premium is an artefact:** If Outcome C obtains, you must concede that religion has no *special* cognitive or cultural machinery for cooperation beyond what any high-cost group possesses. This is not fatal to the cost theory, but it is fatal to the idea that this explains *religion* specifically.

  #### Worry Three: Scope and Collapse
  *   **Is this a theory of religion or commitment?**
      If your theory predicts the same effects for a party cell or a sports club, you have not failed; you have succeeded in reducing religion to its functional components. However, you must explain why religion is the *dominant* historical vehicle for this.
      *   **The Defence:** Religion accesses the cognitive by-products (HADD, ToM) that make the *costs* feel less arbitrary than they do in a sports club. In a football club, the cost is instrumental (train hard to win). In religion, the cost is ontological (fast to align with reality).
      *   **The Collapse:** If you cannot distinguish the *mechanism* of binding in a religious cell vs. a communist cell, you are writing a theory of **ultra-sociality**, not religion.
      *   **Verdict:** Count this as a **Pyrrhic Vindication**. It validates the mechanism but dissolves the subject matter. To avoid this, you must lean harder on Part One of your position (the cognitive origins). The *content* may be scaffolding, but the *type* of scaffolding (supernatural agents) is constrained by the cognitive by-products. A sports club cannot easily use "invisible agents" as scaffolding; a church can. That is the distinction.

  ---

  ### Part III: Further Requests

  #### 1. The Imagistic vs. Doctrinal Cut (Whitehouse)
  This is the most significant theoretical threat to your "single currency of cost" model. Harvey Whitehouse's *Modes of Religiosity* theory distinguishes between:
  *   **Imagistic:** High arousal, low frequency, dysphoric rituals (e.g., initiation ordeals, martyrdom). These create **identity fusion**.
  *   **Doctrinal:** Low arousal, high frequency, routinised rituals (e.g., weekly mass, daily prayer). These create **group identification**.

  **Where it cuts against you:**
  Your model treats cost as a single currency that buys commitment. Whitehouse suggests there are two currencies.
  *   **Imagistic costs** do not require complex propositional scaffolding. The trauma *is* the binding. Theology is often minimal or post-hoc.
  *   **Doctrinal costs** *do* require your scaffolding. Because the rituals are boring/frequent, they need theological justification to prevent free-riding.

  **The Implication:** Your theory likely applies strongly to **Doctrinal** religions (post-Axial, Abrahamic, institutional) but poorly to **Imagistic** traditions (shamanic, cultic, revolutionary splinters).
  *   **Adjustment:** You should refine your claim: "In *doctrinal* modes, content functions as scaffolding for cost. In *imagistic* modes, the cost functions as its own scaffolding." If you fail to make this distinction, your theory will be vulnerable to counter-examples from high-arousal movements where doctrine is thin but commitment is absolute.

  #### 2. Journalism vs. Research Programme
  *   **As Journalism:** The view is **highly defensible**. It offers a clean, counter-intuitive narrative that synthesises a decade of complex science into a readable heuristic. It respects the science (by-products, signalling) while offering a fresh synthesis (theology as scaffolding). It is "sticky" for a reader.
  *   **As a Research Programme:** The view is **currently too vague**. "Scaffolding" is a metaphor, not a variable. To work as science, you must operationalize "substitutability."
      *   *How to fix it:* You need a metric for **Doctrinal Elasticity**. Can you measure how much a doctrine can change before the cost structure collapses? If you can quantify the lag between doctrinal shift and behavioural shift, this becomes a testable research programme. Without that, it remains a sophisticated just-so story.

  ### Final Verdict
  Your position is a strong candidate for publication, provided you inoculate it against the charge of unfalsifiability. The "scaffolding" metaphor is elegant but dangerous.

  **The crucial amendment:** Do not claim content is *always* substitutable. Claim that content is substitutable *over the long run of cultural evolution*, even if it appears rigid in the short run of individual psychology. This allows you to acknowledge the friction of conversion (short term) while maintaining that theologies rise and fall based on their ability to support cost structures (long term).

  If you can anchor the "scaffolding" claim to the **Doctrinal Mode** specifically, and predict a **time-lag** between cost changes and doctrinal shifts, you move from a provocative essay to a falsifiable hypothesis. If you cannot, you have written a brilliant piece of journalism that will annoy anthropologists for a generation. Given your brief, the latter may be sufficient, but the former is within your reach.
