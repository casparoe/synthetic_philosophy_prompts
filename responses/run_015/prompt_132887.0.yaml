      *   *Rule 3: Tipping.* Economic transaction, wage subsidy, social expectation within a specific market. Exempted for visitors.
      *   *Underlying Distinction:* Public/Coordination rules vs. Private/Economic rules.

  3.  **Identify Potential Philosophical Frameworks:**
      *   **Convention as Coordination (David Lewis):** Rules exist to solve coordination problems. If you break them, the system fails. Queuing fits here. Tipping is less about coordination and more about redistribution/norm.
