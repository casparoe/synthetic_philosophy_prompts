answer: |-
  This is a fantastic prompt. You have stumbled onto a genuine problem in **social ontology** and **normative ethics**. The checklist you are describing isn't just a list of tips; it is a tacit philosophical argument about the source of obligation.

  To answer your question directly: The checklist is presupposing a hybrid theory that distinguishes between **coordination conventions** (which bind everyone present) and **distributive conventions** (which bind only economic participants). It is not necessarily incoherent, but it relies on a specific, contestable view of what makes a rule "moral" versus what makes it "transactional."

  Here is a breakdown of the philosophical commitments the checklist is making, followed by an analysis of the alternatives you proposed.

  ### 1. The Underlying Theory: Coordination vs. Redistribution

  The most consistent philosophical framework supporting this checklist is a modification of **David Lewis's theory of convention** combined with a **Hart/Rawls Principle of Fair Play**, but with a specific boundary condition.

  **A. Queuing and Jaywalking = Coordination Problems**
  *   **The Commitment:** These rules are treated as *coordination conventions*. Their primary function is to prevent conflict and ensure efficiency. If one person queues and the other doesn't, the system creates friction. If one person follows traffic lights and the other jaywalks, there is a risk of physical harm.
  *   **Why it binds visitors:** Under Lewis's view, a convention is binding because it solves a recurrent coordination problem. Your presence in the physical space makes you a participant in that coordination game. You benefit from the order (you get your coffee, you don't get hit by a car), so the **Principle of Fair Play** dictates you must uphold the rules that generate that order.
  *   **Moral Status:** These are treated as *public goods*. Obligations regarding public goods attach to **presence**, not membership.

  **B. Tipping = Distributive/Structural Norm**
  *   **The Commitment:** The checklist explicitly frames tipping as part of the "local wage structure." This admits that tipping is not merely a social courtesy (like saying thank you) but a **subsidy mechanism**.
  *   **Why it exempts visitors:** The checklist assumes that visitors are *transient consumers*, not *participants in the labor market*. By saying you are "outside the wage structure," they are arguing that you have not entered the specific social contract that necessitates the tip.
  *   **Moral Status:** This is treated as a *private economic obligation*. Obligations regarding economic redistribution attach to **integration**, not presence.

  **The Hidden Theory:** The checklist presupposes that **moral obligation arises from the necessity of systemic function.**
  *   Queueing/Traffic: The system breaks without universal compliance.
  *   Tipping: The system (the meal) is completed even if you don't tip; the loss is absorbed by the worker or the employer, not the immediate coordination of the cafe.

  ### 2. Is it Incoherent? The "Constitutive Rule" Objection

  You asked if this is incoherent. It *becomes* incoherent if you view dining as a **constitutive practice** (in the Searlean sense).

  *   **The Counter-Argument:** In many cultures (like the US), tipping is a *constitutive rule* of the practice of "eating at a restaurant." Just as you cannot play chess without moving the bishop diagonally, you cannot "eat at a restaurant" here without tipping. It defines the transaction.
  *   **The Checklist's Defense:** By exempting you, the checklist is implicitly admitting that the local practice is **exploitative** rather than **cultural**. It is saying, "This isn't a cultural value we want to impose on you; it's a structural flaw in our economy that we don't expect you to fix."
  *   **The Membership Question:** You asked if you need membership status. The checklist says **yes**. It treats you as a *citizen of the sidewalk* (where safety rules apply) but a *tourist of the economy* (where wage norms don't). This relies on a **Walzerian "Spheres of Justice"** argument: different rules apply in different spheres (public safety vs. private exchange), and your visa/status grants you access to one sphere but full membership in the other.

  ### 3. Comparison with Tokyo (Cultural Relativity vs. Structural Universality)

  Your roommate's experience in Tokyo highlights that the *content* of the convention changes, but the *logic* of the checklist might remain the same.
  *   **Tokyo:** Queuing is a coordination norm (binding). Tipping is a violation of the "professional dignity" norm (binding prohibition).
  *   **Your City:** Queuing is a coordination norm (binding). Tipping is a wage norm (exempted).

  The checklist is not claiming its rules are universally moral; it is claiming they are **locally functional**. It admits that tipping is not functional for *you*, whereas queuing is functional for *everyone*.

  ### 4. Alternative Theories and How the Checklist Would Change

  If we replaced the hidden theory with the two alternatives you suggested, the checklist would look radically different.

  #### Scenario A: "All conventions are equally binding on anyone who can follow them."
  *   **Philosophical Commitment:** **Moral Assimilationism / Kantian Universalism.** This view holds that if a rule is morally binding on a local, it is binding on any rational agent capable of following it, regardless of status. "When in Rome, do as the Romans do" becomes a strict moral imperative.
  *   **How the Checklist Changes:**
      *   The tipping exemption is **deleted**.
      *   **New Wording:** "Visitors are expected to adhere to all local customs, including tipping 20%, as failure to do so disrespects the local community."
      *   **Implication:** This treats culture as a monolith. It ignores the economic reality that visitors didn't agree to the wage structure. It risks turning cultural norms into moral laws, which can be oppressive to outsiders who lack the context to understand *why* the rule exists.

  #### Scenario B: "None are binding unless you consented."
  *   **Philosophical Commitment:** **Libertarian Contractualism.** Obligations only arise from explicit consent. Mere presence in a space does not constitute consent to social norms.
  *   **How the Checklist Changes:**
      *   The queuing and jaywalking rules become **suggestions** or are framed strictly as **legal warnings** rather than moral obligations.
      *   **New Wording:** "Locals prefer queues, but you are not obligated to form one. Jaywalking is illegal and may incur a fine, but is not morally prohibited. Tipping is voluntary."
      *   **Implication:** This creates a "tourist bubble." It allows visitors to opt-out of the social contract that makes the city function. If everyone followed this theory, the queue would collapse (Tragedy of the Commons), and the checklist would cease to be about *obligation* and become purely about *risk management* (i.e., "don't do this or you'll get arrested/frowned at").

  ### 5. Summary of Commitments

  To wrap this up for your course, here is the diagnostic of your university's checklist:

  1.  **Necessary Commitment:** It must believe that **Public Order > Economic Custom.** It prioritizes rules that prevent physical conflict or systemic gridlock (queues/traffic) over rules that govern wealth transfer (tips).
  2.  **Convenient Commitment:** It relies on a **Guest/Host Distinction.** It is convenient for the university to tell students they don't have to tip (it saves them money), so they frame tipping as "structural" rather than "moral." If tipping were framed as "respect for labor," they would have to mandate it.
  3.  **The "Hidden Idea":** It smuggles in the idea that **visitors are physical residents but economic strangers.** You are bound by the laws of the land (traffic/order) but not the customs of the market (wages).

  **Verdict:** The checklist is theoretically consistent *if* you accept that moral obligations regarding coordination are universal to presence, while obligations regarding economic redistribution require membership. However, it is philosophically vulnerable to the critique that it treats tipping as merely economic, ignoring that in many cultures, tipping is a ritual of **reciprocity and recognition**, which *would* bind a visitor under a theory of mutual respect.

  If you want to push this in your paper, argue that the checklist fails because it cannot decide if tipping is a **coordination norm** (like a queue) or a **redistributive norm** (like a tax). By calling it a wage issue, they admit it's a tax, but by putting it on a culture checklist, they imply it's a norm. That tension is where the incoherence lies.
