prompt: |-
  hey so im in this philosphy of culture course and im kinda stuck on a concrete thing. my university's study-abroad office gives exchange students this orientation checklist that lists local conventions: it says you must queue in line at cafes and never jaywalk across campus roads, but then it has this explicit exemption for tipping—like "tipping norms dont apply to visitors since you're outside the local wage structure." meanwhile my roommate just came back from tokyo where she said people queue religiously for trains but tipping is basically insulting, and here in the city people tip constantly but jaywalk like its nothing. so heres my question: what view of moral obligation is that checklist actually presupposing? it treats queueing and jaywalking as binding on anyone present, but tipping as only binding on economic insiders. does that mean it thinks social conventions are moral obligations only when they involve public coordination, not exchange? or that you need some kind of membership status for a convention to stick? and if so, why does queueing count but tipping doesnt? im trying to figure out if theres one consistent theory behind the packet—maybe about participation, or about harm, or about whether the rule is constitutive of the practice—or if its just incoherent and smuggling in a hidden idea about who counts as "local." can you lay out what philosophical commitments this kind of visitor-policy has to be making, which ones are actually necessary vs just convenient, and what would have to change in the checklist if we replaced the hidden theory with something like "all conventions are equally binding on anyone who can follow them" or "none are binding unless you consented"?
reasoning: |-
