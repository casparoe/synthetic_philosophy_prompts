      *   **Comparison:** Roommate's experience in Tokyo (queuing strict, tipping insulting) vs. current city (tipping expected, jaywalking common).
      *   **Core Question:** What view of moral obligation does this checklist presuppose? Is there a consistent theory (coordination vs. exchange, membership status, harm, constitutive rules)? Or is it incoherent/xenophobic?
