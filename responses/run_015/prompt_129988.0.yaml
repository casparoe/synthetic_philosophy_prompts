  # Joint Statement on the REM-BCI Concurrent Narration Protocol

  ### I. Agreed Claims
  Both camps endorse the following numbered claims regarding the data generated by the hypothetical REM-BCI concurrent narration protocol:

  1.  **Physical Validity:** The BCI speller generated semantic tokens during physiologically verified REM sleep without physiological awakening or breaking of atonia.
  2.  **Content Discrepancy:** The semantic content of the concurrent BCI output overlaps significantly with the retrospective waking report, but the temporal ordering of events differs between the two records.
  3.  **Attenuated Authority:** First-person authority regarding mental states during sleep is demonstrably fallible and distinct from first-person authority in waking states.
  4.  **Transformation Thesis:** Some form of transformation occurs between the generation of REM-state signals and the production of the waking verbal report, regardless of whether that transformation is mnemonic or constitutive.
  5.  **Protocol Limitation:** The protocol successfully isolates concurrent signaling from retrospective narration but does not independently verify the presence of phenomenal consciousness during the signaling phase.

  ### II. Disagreements Table
  The following table outlines the divergent interpretations of the agreed claims. Wording has been negotiated to ensure each camp accepts the phrasing of their own position.

  | Issue | Camp A (Criterion-Based View) | Camp B (Constructivist View) |
  | :--- | :--- | :--- |
  | **Ontological Status of REM Activity** | REM-state neural activity lacks the behavioral criteria required to count as genuine experience. | REM-state neural activity constitutes genuine experience independent of waking behavioral criteria. |
  | **Role of Waking Narrative** | The waking report constitutes the dream claim; there is no prior narrative story until waking. | The waking report reconstructs a narrative that existed during REM, subject to memory distortion. |
  | **Nature of BCI Output** | The BCI output is a sub-personal neural discharge mimicking reportage, not a conscious avowal. | The BCI output is a conscious avowal demonstrating occurrent awareness during sleep. |
  | **Subjecthood During Sleep** | No coherent waking self exists during REM to own or witness the activity. | A diminished but sufficient self exists during REM to own or witness the activity. |

  ### III. Cruxes and Predictions
  The following points represent the substantive disagreements that remain unresolved by the protocol. Each camp commits to the specific predictions listed below regarding the BCI case.

  **Crux 1: Access Consciousness**
  *   **Question:** Does the ability to operate a BCI speller during REM prove access consciousness (availability of information for global control and report)?
  *   **Camp A Prediction:** The subject felt nothing while operating the BCI; the output was generated without subjective awareness of the content.
  *   **Camp B Prediction:** The subject felt the intention to select characters and was aware of the content as it was generated.

  **Crux 2: The Subject of Experience**
  *   **Question:** Does the absence of a waking-style self during sleep undermine the possibility of first-person experience?
  *   **Camp A Prediction:** The BCI output will show signs of fragmentation consistent with the absence of a unified subject.
  *   **Camp B Prediction:** The BCI output will show signs of agency consistent with a unified, albeit altered, subject.

  **Crux 3: Verbal Dispute Flag**
  *   **Issue:** Both camps acknowledge a potential verbal disagreement regarding the definition of "experience."
  *   **Camp A Stance:** We define "experience" strictly by waking behavioral criteria; by this definition, the BCI case is not experience.
  *   **Camp B Stance:** We define "experience" by functional capacity for report and internal processing; by this definition, the BCI case is experience.
  *   **Resolution Status:** Both camps agree that if the definition is standardized, the disagreement becomes empirical regarding the presence of consciousness during atonia, but currently, the definitional variance obscures the empirical claim.

  Bottom line: The core residual disagreement is whether occurrent neural signaling during atonia constitutes conscious experience or merely a sub-personal precursor to waking reportage.
