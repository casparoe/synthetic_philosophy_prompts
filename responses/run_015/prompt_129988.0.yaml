  hey so im putting together prompts for a philosophy dataset and i need one that gets into the weeds of whether dreams are actual experiences without just being the same old Malcolm-vs-Dennett summary everyone has seen. specifically im imagining an adversarial collaboration doc between two camps: camp A holds the Malcolm-style view that dreams arent genuine experiences because theres no concurrent behavioral criterion or waking-style subject present during REM atonia, and camp B holds the Dennett-style view that dreams are real experiences but ones that are necessarily reconstructed and narratively bound upon waking (possibly involving confabulation).

