  2. Anchor the session in communal land cultivation, specifying that the labor does not just strengthen bonds between pre-existing farmers but actually generates their status as moral agents, rigorously distinguishing this from a social contract where individuals precede the agreement.
  3. Intercept social constructivism during the ontological setup, block political communitarianism when discussing obligations, and distinguish from care ethics during the Q&A, ensuring they see personhood as metaphysical rather than merely sociological or normative.
  4. Ask whether the cessation of relational practices destroys the person or merely harms them, forcing them to decide if the relation is constitutive of existence or merely contingent upon well-being.
  5. Exclude the full metaphysics of ancestral presence and specific ritual protocols to prevent students from dismissing the view as supernatural or culturally particular, thereby protecting the core philosophical claim about relational ontology from anthropological reductionism.
