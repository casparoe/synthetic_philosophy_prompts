answer: |-
  It is genuinely refreshing to encounter a formulation like asymmetry of narrative repair because it cuts through the stalemate we usually hit when discussing biopics, where the defense is always that art requires compression and the offense is always that truth matters. Your intuition about counterfactual dignity strikes me as the missing lever here, specifically because it shifts the locus of harm from the external record to the internal coherence of the life as it was lived and projected forward. When we brainstorm the difference between a factual error and an emotional arc, we are really distinguishing between data that can be amended and a gestalt that cannot be un-seen. If a film gets a birthdate wrong, a historian can publish a correction that slots neatly into the archive, effectively overwriting the error with the right data without damaging the subject's essence, but if a film invents a private moment of cowardice or grace to explain a public decision, that invention bypasses the archive and lodges itself directly in the viewer's emotional understanding of the person's character. This is where counterfactual dignity comes into play, because it concerns the rights of the subject to the openness of their own future, even after death, specifically the right to have their ambiguities remain ambiguous rather than being resolved by a screenwriter who needs a third-act climax. The dignity lies in the counterfactual possibility that the person might have explained themselves differently, or that their motivations were actually opaque even to them, and by imposing a clean narrative arc, the dramatist forecloses those possibilities, effectively stealing the subject's right to be complex in ways that do not serve a plot.

  To make this concrete, consider a scenario where a historical figure is known for leaving a major ethical conflict unresolved at the time of their death, perhaps a scientist who died while still grappling with the dual-use nature of their discovery, leaving behind journals that show genuine torment but no final conclusion. A biopic, needing narrative closure, dramatizes a deathbed scene where the scientist finds peace and explicitly validates the use of their work for the greater good, thereby resolving the tension that defined their final years. This is not a factual error in the sense of a date or name, so a footnote correction feels inadequate against the emotional resonance of an actor weeping with relief over a resolved moral burden. The asymmetry of narrative repair manifests here because the historian can say the resolution never happened, but they cannot undo the viewer's sense that the person died at peace, which fundamentally alters the moral legacy of the work itself. The harm is to the counterfactual dignity of the scientist, whose authentic state of unresolved struggle is replaced by a fabricated resolution, denying them the dignity of their own uncertainty and imposing a posthumous moral stance they never endorsed. This is where the standard defense of artistic license fails, because the license is being used to settle a moral account that the subject left intentionally open, and a disclaimer at the start of the film does not repair this because the human mind does not compartmentalize the disclaimer from the emotional experience of the narrative. We do not watch the deathbed scene thinking this is hypothetical, we feel it as the truth of the person's interiority, and that feeling overrides the cognitive knowledge that it might be invented.

  The philosophical tension here extends beyond standard bioethics because bioethics usually concerns consent and harm to the living, whereas this is about the narrative autonomy of the dead regarding the structure of their own identity. If we accept that persons are not just collections of facts but are ongoing projects of self-interpretation, then death freezes that project in a state of incompleteness that deserves a kind of respect similar to privacy. By dramatizing a resolution to an unresolved life, the filmmaker is essentially claiming authority over the subject's self-conception, asserting that the narrative needs of the audience outweigh the subject's right to remain opaque or unfinished. This generates a specific ethical problem where the harm is not defamation in the legal sense, since the portrayal might be flattering or redemptive, but is instead a violation of the subject's narrative integrity. The asymmetry is solidified because the correction requires the audience to engage in a complex act of imaginative subtraction, to un-feel the resolution they witnessed, which is psychologically much harder than simply updating a date in a database. Thus, counterfactual dignity protects the right of the dead to have their life stories retain the same texture of uncertainty and open-endedness that they possessed while alive, preventing the cultural machinery from converting a human being into a closed loop of meaning that serves our desire for coherence rather than their reality of existence. This suggests that the ethical burden on the dramatist is not just to avoid lies, but to resist the temptation of closure when the life itself refused it, honoring the asymmetry by acknowledging that some repairs to the narrative are impossible once the emotional truth has been implanted.
