  **Objection 7: The Computation vs. Proof Distinction**
  *(Vocabulary: Mathematical Logic)*
  "Gödel limits formal proof, not computation. You might be a computational mechanism that doesn't rely on proof verification. You've attacked proof systems, not mechanistic minds. The logician accepts Gödel's theorems but denies they bear on philosophy of mind."

  **Reply:**
  "Mathematical cognition is essentially about proof verification. If the mind cannot be modeled as a proof system, it cannot be modeled as a mechanism performing mathematical cognition. The domain restricts the model. If you concede the mind isn't a proof system, you concede it isn't a formal mechanism in the relevant sense."

  **Weakest Point:** Reduces the mind to its mathematical faculty only.

  ***

  **OPENING CONCESSIONS (Deliver in first 3 minutes)**
  1.  **Fallibility:** Explicitly concede that human mathematicians are not logically omniscient and frequently make errors. The argument relies on the *capacity* for correction, not infallibility.
  2.  **Scope:** Concede this argument applies specifically to *mathematical cognition*, not to perception, emotion, or general consciousness. Do not overclaim to solve the "Hard Problem."
  3.  **Dualism:** State clearly that this does not prove substance dualism or immortality. It only argues against *formal mechanistic models* of mathematical reasoning.
  4.  **Idealization:** Acknowledge that "the human practitioner" is a normative idealization of what mathematicians *aim* to be, not necessarily what they always are in practice.

  ***

  **CRITICAL VULNERABILITY: THE OBJECTION TO AVOID**
  **Objection 1 (Resource-Bounded Intractability).**
  **Why:** Your thesis hinges on the "practice-bound" reformulation. If you cannot demonstrate that human consistency-checking procedures are computationally feasible (i.e., polynomial-time) while $S$'s are not, you revert to the standard Lucas-Penrose argument which assumes logical omniscience. If the audience presses on the *cost* of your "reflective equilibrium" procedures, you risk admitting that humans are simply slower machines, which validates mechanism under resource bounds. Deflect questions about specific complexity classes and keep the focus on "semantic access" vs. "syntactic search."
