      *   *Key Insight:* The user violates WP in their own example while claiming to uphold it. This is the smoking gun. The "Meddlesome" clause is an attempt to patch WP, but it contradicts the "Flat Welfarist" justification. The "Game Form" claim contradicts the need for a "Social Ordering" for policy.

