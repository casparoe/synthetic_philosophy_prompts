      *   *Problem:* This makes the welfarist justification (1) incoherent. You can't say "Social betterness *just is* preference satisfaction" and then say "Except for these preferences." That's not welfarism; that's perfectionism or paternalism.

  7.  **Finalizing the Ranking:**
