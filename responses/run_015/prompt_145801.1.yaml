  I'm preparing a fifty-minute session for a first-year philosophy graduate reading group—most students have encountered decision theory but have never systematically examined how they form beliefs about their own research. I want them to grasp the inside-view versus outside-view distinction not as a pop-psychology heuristic but as an epistemic discipline, specifically that the inside view is not identical to mechanistic expertise but rather the construction of a coherent causal narrative that is itself an unrepresentative sample drawn from the reference class of all similar narratives the reasoner could have generated for comparable situations. Plan the explanatory arc: the dependency order in which the conceptual pieces must be introduced so that the outside view is not received as an insult to domain competence; the single carrying example, which should place them in a domain where they feel genuinely knowledgeable—forecasting whether their own proposed interdisciplinary dissertation chapter will be completed and accepted within eighteen months—yet where aggregate base rates are stark and impersonal; the misconceptions they will form in sequence, including that outside-view reasoning is merely statistical pessimism, that inside-view reasoning is the same as causal understanding, and that epistemic modesty requires averaging the two perspectives rather than using the outside view to set a prior that the inside view updates with extreme reluctance; the precise point in the sequence where each misconception should be intercepted; the brief diagnostic check that distinguishes internalizing the discipline from merely adopting its vocabulary; and what formal apparatus—such as explicit Bayesian reference-class weighting or tournament-style calibration curves—I should openly decline to formalize at this level. Present your response as exactly five numbered items, each one or two sentences long, with no introduction or conclusion. In your response, state how confident you are in each claim and identify the single point about which you are least sure.
