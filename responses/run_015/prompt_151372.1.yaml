answer: |-
  # INTEGRITY TRIAGE PROCEDURE (v1.0)

  **Purpose:** Classify reports consistently and recommend responses.  
  **Time Limit:** 30 Minutes.  
  **Users:** Integrity Triage Team (2 persons).  
  **Output:** Triage Record (for Regional Director sign-off).

  ---

  ### STEP 1: DEFINITION (The Exchange)
  *Does this involve an exchange of value for influence?*
  1.  **Value:** Did someone receive something of worth? (Cash, goods, jobs, favors, access, promises). **Yes / No**
  2.  **Link:** Was this value linked to an official act or decision? (Did the act happen *because* of the value, or *in expectation* of it?). **Yes / No / Unclear**
  3.  **Currency Check:** If you replaced the cash with a favor (or vice versa), would the answer change? If yes, stop and re-evaluate. **Neutral / Biased**

  *   **STOP IF NO to both 1 & 2:** Close as "Not Corruption."
  *   **IF YES:** Mark as **Classified Incident**. Proceed to Step 2.

  ### STEP 2: HARM (The Victim)
  *Who is worse off because this happened?*
  1.  **Individual:** Is there a specific person who lost out? (e.g., lost a job, didn't get aid). **Yes / No / Unknown**
  2.  **Program:** Did the program pay more, deliver less, or lose reputation? **Yes / No**
  3.  **Community:** Did this create unfair access for one group over another? **Yes / No**
  4.  **Institutional Benefit:** Did the *office* benefit (e.g., faster clearance) while no *individual* got rich? **Yes / No**

  *   **Note:** If "Institutional Benefit" is Yes, this is still a Classified Incident. Do not close.

  ### STEP 3: AGENCY (The Pressure)
  *Could the staff member reasonably have refused?*
  1.  **Threat:** Was there a threat of harm (physical, job loss, program stoppage) if they refused? **Yes / No**
  2.  **Alternative:** Was there a viable official channel they ignored? (e.g., they paid a bribe instead of filing the form). **Yes / No**
  3.  **Collusion:** Did both sides actively plan this to gain an advantage neither was entitled to? **Yes / No**

  *   **Scoring:**
      *   Threat + No Alternative = **Coerced** (Low Blame).
      *   Collusion + Alternative = **Active** (High Blame).
      *   Mixed = **Ambiguous** (Refer to Step 6).

  ### STEP 4: PATTERN CHECK (The Relationship)
  *Is this part of a wider web?*
  1.  **Convertibility:** Can favors earned in one area (e.g., land) be cashed in another (e.g., hiring)? **Yes / No**
  2.  **Monopoly:** Is this the *only* person/channel who can provide this service? **Yes / No**
  3.  **History:** Have similar exchanges happened between these parties before? **Yes / No**

  *   **IF YES to all 3:** Mark as **Clientelism Risk**. This requires a systemic response, not just individual sanction.

  ### STEP 5: RESPONSE RECOMMENDATION
  *Select one primary action. Classification does not dictate sanction.*
  1.  **Sanction:** Disciplinary action against staff. (Requires Step 3 = Active).
  2.  **Process Change:** Fix the system so the payment/favor is no longer needed.
  3.  **Escalation:** Report to Donor/Board (Required if funds lost or safety risk).
  4.  **Accept & Monitor:** No action now, but watch for recurrence. (Requires Step 3 = Coerced OR Step 6 Approval).
  5.  **Collective Action Flag:** If stopping this practice ends the program, mark **STRATEGIC RISK**.

  ### STEP 6: VALUES CALL (The Hand-Off)
  *The Triage Team cannot decide these. Regional Director must sign.*
  1.  **Imported Standard:** Is this only wrong because of HQ policy, but local norm/law allows it?
      *   *Test:* Does it violate fairness to beneficiaries? If Yes, HQ Policy stands. If No, RD decides.
  2.  **Program Survival:** Does enforcing the rule mean closing the office/program?
      *   *Action:* RD must sign off on "Accept & Monitor" with an exit strategy.
  3.  **Ambiguous Agency:** Step 3 was mixed/unclear.
      *   *Action:* RD decides on burden of proof.

  ---
  **Triage Officer Signature:** ___________________ **Date:** ______
  **Regional Director Decision:** ___________________ **Date:** ______

  ***

  # APPENDIX: DESIGN LOGIC & LIMITATIONS

  **1. Why this order?**
  We separate *Definition* (Step 1) from *Blame* (Step 3). This enforces your requirement that something can be corruption (Step 1 = Yes) but warrant no sanction (Step 3 = Coerced). Most current failures happen because teams conflate "Is this wrong?" with "Do we fire them?"

  **2. Currency Neutrality (Step 1.3)**
  We explicitly force the officer to swap cash for favors mentally. This prevents the bias where cash is "theft" but a nephew's job is "culture." Both are value transfers. If the procedure feels different, the officer must re-evaluate.

  **3. Relationship-Shaped Cases (Step 4)**
  We use **Convertibility** (can land buy jobs?) and **Monopoly** (is he the only gatekeeper?) to detect clientelism. A single act is often defensible; a convertible network is not. This captures the "pile of fine acts" problem.

  **4. Dropped Distinctions (To save time)**
  *   **Legal Guilt:** We do not determine if a law was broken. We determine if *policy* was breached. Legal guilt is for investigators/lawyers.
  *   **Intent:** We look at *Agency* (options available) rather than internal intent. It is too hard to prove intent in 30 mins.
  *   **Value Threshold:** There is no minimum dollar amount. A $5 bribe is treated the same as a $500 bribe regarding *classification*, though response may differ.

  **5. Where it will Misfire**
  *   **The "Imported Standard" Trap (Step 6.1):** Staff will claim "local custom" to hide theft. The test ("Does it violate fairness to beneficiaries?") stops this. If a local custom excludes vulnerable groups, it is not a valid defense.
  *   **The "Collective Action" Trap (Step 5.5):** This procedure cannot solve collective action problems. It only *flags* them. If every INGO pays bribes, this form will tell you to "Accept & Monitor" with a Strategic Risk flag. It will not make the bribes stop.
  *   **Institutional Benefit (Step 2.4):** This is the hardest category. The procedure classifies it as an incident, but offers no easy sanction. This is intentional. It forces the RD to see that the *system* is the offender, not the staff.

  **6. The Values Call (Step 6)**
  This is the safety valve. If the procedure demands a sanction that destroys the program, or excuses a act that violates core mission values, the human (RD) must override. The procedure forces them to *name* the override, preventing silent drift.

  ***

  # TRIAGE RECORDS (CASE APPLICATIONS)

  ## CASE 1: The Enumerators & The Chickens
  **Step 1 (Definition):** Yes. Value (Chicken) linked to Act (Form Filling). Currency Neutral (Chicken = Cash).
  **Step 2 (Harm):** Yes. **Identifiable Victims:** Households who did not/dould not give chickens. They were excluded or delayed.
  **Step 3 (Agency):** Mixed. Refusal is "insult" (Social Pressure), but "filling form properly" implies previous forms were filled *improperly*.
  **Step 4 (Pattern):** Yes. Dozens of times/week. Systemic.
  **Step 5 (Response):** **Process Change.** Sanctioning enumerators is high risk (coercion), but allowing it harms beneficiaries.
  **Step 6 (Values):** HQ told them to accept gifts. *Override:* Accepting gift is allowed; conditioning aid on gift is not.
  **Recommendation:** Do not fire enumerators yet. Issue directive: "Gifts may be accepted *only* if aid eligibility is strictly independent." Retrain on eligibility criteria. Monitor district for 3 months.
  **RD Sign-off:** Required (Policy Override on Gift Acceptance).

  ## CASE 2: The Logistics Assistant & Customs
  **Step 1 (Definition):** Yes. Value ($12) linked to Act (Release of goods).
  **Step 2 (Harm):** **Institutional Benefit.** Program got food faster. No individual enriched.
  **Step 3 (Agency):** **Coerced.** Shipment stuck 3 weeks. No viable official channel worked. Self-reported.
  **Step 4 (Pattern):** No. One-off transaction to release specific goods.
  **Step 5 (Response):** **Accept & Monitor.** Sanction is inappropriate (Duress).
  **Step 6 (Values):** **Collective Action Flag.** If we don't pay, food rots.
  **Recommendation:** No sanction against Assistant. Record as "Facilitation Payment under Duress." Escalate to HQ Logistics to negotiate MOU with Customs Authority to prevent recurrence.
  **RD Sign-off:** Required (To confirm Duress claim).

  ## CASE 3: The Chief, The Land & The Daughter
  **Step 1 (Definition):** Yes. Value (Land/Jobs/Contracts) linked to Act (Access/Influence).
  **Step 2 (Harm):** **Yes.** **Identifiable Victims:** The 40 applicants with better scores who were rejected. **Community:** Political bias in aid distribution.
  **Step 3 (Agency):** **Active/Collusion.** Office chose to hire daughter over better candidates. Not coerced.
  **Step 4 (Pattern):** **Clientelism Risk.** High Convertibility (Land -> Job -> Contracts). High Monopoly (Only he can provide land/access).
  **Step 5 (Response):** **Strategic Risk.** Sanctioning staff loses the site. Ignoring it violates hiring policy and fairness.
  **Step 6 (Values):** **Program Survival vs. Integrity.**
  **Recommendation:** **Classification: High-Risk Corruption.**
  **Action:**
  1.  **Hiring:** Cannot reverse hiring without legal risk, but daughter must be put on standard contract (no casual preferential terms) and performance managed strictly.
  2.  **Contracts:** Immediate audit of all sub-contracts routed through fixer. No new contracts without competitive bid.
  3.  **Exit Strategy:** RD must approve a plan to find alternative land within 12 months to break the monopoly.
  **RD Sign-off:** **MANDATORY.** This is a Values Call. RD accepts liability for continued relationship vs. program closure.

  ***

  # REASONING ON CASE 1 (The "Articulation" Request)
  You noted the "form filling" felt different but couldn't articulate why. The procedure isolates this in **Step 1.2 (Link)** and **Step 2.1 (Individual Harm)**.
  *   **The Gift:** A chicken given *after* registration is a thank-you. (Low Risk).
  *   **The Exchange:** A chicken given *to ensure* the form is filled "properly" implies the standard process is *not* proper.
  *   **The Harm:** This creates a two-tier system. Households with chickens get "proper" forms (eligibility); households without get "improper" forms (ineligibility).
  *   **The Procedure's Output:** It shifts the focus from the *enumerator's morality* to the *eligibility process*. The corruption isn't the egg; it's that the egg buys eligibility. This allows you to protect the staff (who are pressured) while fixing the harm (the eligibility criteria).
