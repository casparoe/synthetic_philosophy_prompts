answer: |-
  Here's the scenario: The City Water Board faces a choice between two pipeline repair schedules. Option A is a rushed repair using a cheap, fast-curing epoxy that releases trace endocrine disruptors; the maintenance crew exposed to these chemicals experiences a subtle shift in fertility windows, meaning the children they conceive over the next year are genetically different from those they would have conceived otherwise. This option also locks in budget savings that immediately slash long-term filtration safety funds, guaranteeing that the water quality for the next generation will be marginally toxic, leading to higher chronic illness rates, though still lives well worth living. Option B delays repairs by six months using a safer compound; the crew's conception timing remains standard, resulting in a completely different set of children who inherit a robust safety budget and cleaner water. The Board chooses Option A.

  Here's the rub: those future children born under Option A cannot logically claim they were harmed by the Board's decision. Harm is typically understood counterfactually—you are harmed only if you are worse off than you *would have been* had the action not occurred. But if the Board had chosen Option B, these specific children would never have existed at all; a different set of people would have been born instead. Since their lives, despite the chronic illness, are still worth living, they are not worse off than non-existence. Therefore, under a standard person-affecting view, no specific individual has been wronged.

  The philosophical engine driving this puzzle is the **identity-determining nature of the policy**. The choice doesn't just affect the *quality* of life for a fixed population; it determines *who* comes into existence. The causal chain runs through the biological timing of conception, making the identities of the future people contingent on the seemingly unrelated administrative decision about repair timelines.

  A defender of the rushed timeline would attack this by doubling down on the **Person-Affecting Restriction**: morality is only about how we treat specific, identifiable people. They'd argue that since there is no victim who can say, "I am worse off because of you," there is no moral crime. They'd claim we are mistaking a regrettable outcome for a wrongful act. Does this attack succeed? Logically, it holds water within that specific framework; you can't coherently claim victimhood if your alternative is non-existence. But morally, it fails miserably. It exposes a crack in the Person-Affecting view itself, suggesting that wrongness isn't just about harming specific individuals but about bringing about states of affairs that are impersonally worse. The defender wins the logic game but loses the moral reality check.
