  Bottom Line Up Front
  I recommend we vote to keep the Harlan Cobb statue in Elm Park while adding an explanatory panel and commissioning a companion piece. This approach honors our history without hiding its complexities, using funds already allocated in next year's beautification budget. We should aim to finalize the design plan by March 1st.

  What We Are Actually Voting On
  The statue in question is a late-1970s bronze of Harlan Cobb, who donated the land for this park and our library. Currently, the plaque identifies him only as a "visionary builder," omitting his role in writing racial covenants that excluded Black families from our neighborhood for decades. The board must choose between three options: leaving the site unchanged, moving the statue to county storage which incurs annual fees, or keeping the statue while adding historical context and a new companion artwork. This decision impacts our beautification budget and how residents interact with the park daily.

  The Strongest Case For Leaving It Alone
  There is a valid concern that judging historical figures by modern moral standards erases history rather than preserving it. As argued during recent discussions, almost no figure from the mid-20th century would pass a full ethical audit today, and removing or altering monuments based on current sensibilities risks setting a precedent where history is constantly rewritten. Furthermore, Elm Park is primarily a space for recreation and community gathering. Turning a playground into a site of political debate or historical reckoning could change the atmosphere from one of relaxation to one of obligation or guilt. For many long-time residents, the statue represents Cobb's tangible contribution to the park's existence, regardless of his other actions. Maintaining the status quo avoids division and respects the original intent of the donors who funded the piece in the 70s.

  The Strongest Case For Doing Something
  However, leaving the plaque unchanged presents an incomplete history that contradicts what we now know to be true. Cobb's covenants actively shaped who could live here, and ignoring that fact dishonors the families who were barred from this community. The local high schoolers proposed a solution that doesn't erase Cobb but adds truth: a ground-level panel explaining the covenants and a companion piece by a local artist. This transforms the site from a shrine into a learning opportunity. It acknowledges that Cobb built the park for some residents, but not all. By commissioning new art, we invest in current community voices rather than just preserving past ones. This aligns with our association's goal of fostering an inclusive neighborhood where all residents feel the park belongs to them.

  My Recommendation And Next Steps
  I recommend we adopt the third option: keep the statue, add the panel, and commission the companion piece. This balances preservation with honesty without incurring the ongoing costs of storage. To move forward, we need to form a small subcommittee by next Tuesday's vote to oversee the process. By January 30th, this group should draft the text for the explanatory panel in consultation with local historians to ensure accuracy. By March 1st, we need to issue a call for artists for the companion piece, explicitly using the beautification budget approved for next year so no special assessment is needed. Installation should target late summer to coincide with the new school year, allowing students to engage with the updated site. This timeline ensures we act deliberately without rushing. I will draft the budget amendment for the vote, and the Secretary will record the motion. The Treasurer must verify the beautification funds cover the estimated costs before we commit. We should also hold one open forum in February to let residents review the panel text before casting. This approach avoids the perpetual fees of storage while addressing the high schoolers' proposal directly.

  Best Objection To My Recommendation And Why It Does Not Win
  The strongest objection is that adding the panel and companion piece still succumbs to presentism, effectively punishing Cobb retroactively and altering the artistic integrity of the original park design. Critics worry this turns a gift into a lesson. However, this objection assumes that adding context diminishes Cobb's contribution rather than completing it. We are not removing the statue; we are expanding the narrative. The cost is one-time rather than the recurring fees of storage. Ignoring the covenants doesn't make them go away; it just hides them from the kids climbing on the bronze. We can honor the art without endorsing the man's entire legacy. Ultimately, a park serves the living community, not just the memory of donors. We have a duty to be truthful.
