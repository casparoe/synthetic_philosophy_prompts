answer: |-
  # Specification for a Test of Verbal Disputes

  ## I. Desiderata

  The following specifications define the adequacy conditions for any test proposed to this panel. They are categorized by Evidential Constraints, Conceptual Distinctions, and Practical Applications. Each item is flagged as either **[Non-Negotiable]** (required for the panel's specific mandate and evidence limitations) or **[Preference: Camp X]** (reflecting a philosophical stance that one side of the debate would prioritize, but which is not strictly required by the panel's procedural constraints).

  ### A. Evidential Constraints

  **1. Text-Only Admissibility**
  *   **Specification:** The test must operate exclusively on published papers and transcripts. It cannot rely on elicited paraphrases, imagined cases, or post-hoc interviews with the parties.
  *   **Consideration:** The panel lacks the authority and resources to convene the parties or run experiments. A test requiring cooperation or idealized dialogue is procedurally impossible.
  *   **Flag:** **[Non-Negotiable]**

  **2. Dynamic Meaning Tolerance**
  *   **Specification:** The test must remain valid even if the extension or intension of the contested term shifts over the decade of exchange. It must be able to diagnose verbality at time $t_1$ even if the idiolects diverge or converge at time $t_2$.
  *   **Consideration:** Long-running disputes often involve "conceptual drift." A test assuming stable idiolects will falsely diagnose substantive disagreement where there is only talking past one another (or vice versa) due to temporal mismatch.
  *   **Flag:** **[Non-Negotiable]**

  **3. Intent Agnosticism**
  *   **Specification:** The test must be able to diagnose a dispute as verbal even if one party explicitly claims to be describing the world rather than proposing linguistic reform.
  *   **Consideration:** Parties often mask revisionary aims as descriptive claims to gain rhetorical advantage. Relying on avowed intent allows parties to game the test.
  *   **Flag:** **[Preference: Revisionary Camp]** (Deflationaries prefer this; Realists often insist intent matters).

  ### B. Conceptual Distinctions

  **4. Fact/Inference Separation**
  *   **Specification:** The test must distinguish between disagreement on non-linguistic facts (e.g., the arrangement of particles) and disagreement on the inferences or counterfactuals licensed by the term (e.g., whether "table" implies permanence).
  *   **Consideration:** Addresses the case where parties agree on all physical data but disagree on what follows from the label. A test that collapses these will misidentify conceptual disputes as empirical ones.
  *   **Flag:** **[Non-Negotiable]**

  **5. Paraphrase Consensus Requirement**
  *   **Specification:** The test must verify that there exists a neutral paraphrase of the claims such that, if both parties adopted it, the apparent contradiction would vanish without loss of explanatory power.
  *   **Consideration:** This is the standard philosophical marker for verbal disputes; without it, the diagnosis risks being arbitrary.
  *   **Flag:** **[Non-Negotiable]** *(Note: See Section II for critique)*

  **6. Tripartite Independence**
  *   **Specification:** The test must output three distinct verdicts: (a) Verbal vs. Substantive, (b) Worth Settling vs. Not Worth Settling, and (c) Fault vs. No Fault. A verdict of "Verbal" must not automatically entail "Not Worth Settling" or "No Fault."
  *   **Consideration:** Prevents the panel from conflating metaphysical diagnosis with pragmatic recommendation or moral judgment.
  *   **Flag:** **[Non-Negotiable]**

  ### C. Practical Applications

  **7. Practical Stakes Independence**
  *   **Specification:** The test must not classify a dispute as substantive *solely* because the term functions as a cutoff for statutes or funding rules.
  *   **Consideration:** Addresses the case where a term (e.g., "small business") has real-world consequences. The *consequences* are substantive, but the *dispute over the definition* may still be verbal/conceptual. Conflating stakes with substance prevents the panel from recommending definitional clarification where appropriate.
  *   **Flag:** **[Non-Negotiable]**

  **8. Metaphysical Innocence**
  *   **Specification:** A verdict of "Verbal" must not entail a commitment to ontological deflationism regarding the subject matter (e.g., declaring "tables do not exist" because the dispute is verbal).
  *   **Consideration:** The panel's mandate is to diagnose the *dispute*, not the *world*. The test must prevent the diagnosis from doing first-order metaphysical work.
  *   **Flag:** **[Preference: Deflationary Camp]** (Realists view this as obvious; Deflationaries worry it is often violated).

  ---

  ## II. Analysis of Tensions and Constraints

  ### 1. The Impossible Pair
  You asked which two desiderata I suspect cannot be jointly satisfied. While you highlighted the tension between **Usability by Non-Philosophers** (implied by Text-Only Admissibility) and **Neutrality** (implied by Metaphysical Innocence/Fact-Inference Separation), I argue the real tension lies elsewhere: between **Text-Only Admissibility (D1)** and **Dynamic Meaning Tolerance (D2)**.

  **Why:** To diagnose a dispute as verbal using only static texts, one must fix the meaning of the terms at a specific point of comparison to check for contradiction. However, if meanings shift over the course of the exchange (D2), there is no stable "snapshot" to analyze. A non-philosopher reading a transcript from Year 1 and a paper from Year 5 cannot reliably determine if a contradiction is genuine or an artifact of semantic drift without making interpretive assumptions about the speakers' continuity of intent. To make the test usable on texts (D1), one must assume a degree of stability that D2 explicitly forbids. To respect D2, one needs the kind of dynamic, context-sensitive interpretation that exceeds the capacity of a text-only heuristic for non-experts.

  ### 2. The Prejudice Dressed as a Requirement
  The desideratum that is actually a prejudice of one camp dressed up as a requirement is **D5: Paraphrase Consensus Requirement**.

  **Why:** This requirement assumes that a verbal dispute is *necessarily* resolvable by finding a shared language that preserves explanatory power. This is a hallmark of the deflationary/quantifier variance camp (e.g., Hirsch, Chalmers). It rules out the possibility that some disputes are verbal *precisely because* the parties are fighting over which conceptual framework should be dominant, and no neutral paraphrase exists that satisfies both without conceding the point. By demanding a *successful* paraphrase as a condition for verbality, this requirement biases the test against diagnosing "framework conflicts" as verbal, forcing them to be classified as substantive.

  ### 3. The Account-Killer
  The single requirement that rules out the largest share of accounts on offer is **D1: Text-Only Admissibility**.

  **Why:** The canonical philosophical tests for verbal disputes (e.g., Chalmers' verbality test, Hirsch's charity principle, Thomasson's easy ontology) all rely on the availability of the interlocutors. They require asking, "Would you agree that X is true if by 'exist' you mean Y?" or "Can you paraphrase this claim without using term Z?" Since your panel cannot run experiments, ask the parties to imagine cases, or get them to sit for a seminar, any account that relies on *elicited* agreement or *idealized* dialogue is inadmissible. This eliminates the majority of contemporary semantic accounts which are procedural rather than textual.

  ### 4. Preventing Illegitimate Metaphysical Work
  Can a verdict of *verbal* be prevented from doing illegitimate first-order metaphysical work? **Yes, but only conditionally.**

  To prevent this, the verdict must be indexed to the **dialogue** rather than the **world**. The panel's statement must read: "The parties are talking past one another relative to their current usage," *not* "There is no fact of the matter about X."
  *   **The Risk:** If the panel declares the dispute verbal, observers may infer that the subject matter (e.g., "social structures," "biological species") is ontologically lightweight.
  *   **The Safeguard:** The consensus statement must explicitly decouple the diagnosis of the *communication breakdown* from the ontology of the *referents*. It must state that a verbal verdict diagnoses the *utility of the current terms for these specific speakers*, not the *reality of the entities denoted*. However, given **D1 (Text-Only)**, this safeguard is fragile; without the ability to question the parties on their ontological commitments, the panel's textual analysis may inadvertently imply deflationism simply by treating the terms as interchangeable labels rather than world-tracking devices.
