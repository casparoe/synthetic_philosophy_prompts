          *   Interpretation 3 is the most textually supported regarding the specific comparison of violence.
          *   Interpretation 2 is the broader rhetorical goal.
          *   Actually, 3 is probably the strongest *interpretation of the text's logic*, while 2 is the *purpose*. Let's rank 3 highest because it addresses the "barbarian" label directly, which is the user's confusion.
          *   Let's rank 2 second because it explains *why* he does 3.
          *   Let's rank 1 third because it's partially true but misses the critique.
          *   Let's rank 4 last because it's unsupported.

      *   *Scoring:*
          *   3: 9/10
          *   2: 8/10
          *   1: 6/10
          *   4: 3/10

      *   *Biggest Reach:* Interpretation 4. Why? Because it ignores the sincere ethical critique Montaigne levels against his own society.

