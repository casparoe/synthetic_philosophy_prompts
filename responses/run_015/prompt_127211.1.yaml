  1.  **Analyze the Request:**
      *   **User:** High school student writing about Montaigne's "Of Cannibals".
      *   **Task:** Rank four provided interpretations from best to worst (score out of 10), provide a one-sentence explanation for each (in British English), and identify which one is the "biggest reach" and why.
      *   **Constraint:** Use British English (no American spelling, e.g., "colour" not "color", "analyse" not "analyze", "behaviour" not "behavior").
