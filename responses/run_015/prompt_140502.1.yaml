  2.  **Deconstruct the Problem Shape (The "Brainstorming" Phase):**
      *   *What kind of problem is this?* It's not just a utilitarian calculus. It's a conflict between normative frameworks (Consequentialism vs. Special Obligations vs. Virtue Ethics) *and* a decision-theoretic problem under moral uncertainty.
      *   *The Frameworks:*
          *   Friend: Act Consequentialism / Effective Altruism (Maximize good).
