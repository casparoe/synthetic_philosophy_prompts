  3.  **Address Question 1: Uncertainty and Action (Moral Uncertainty):**
      *   *Standard View:* Maximize Expected Choice-Worthiness (MEC). Treat moral theories like hypotheses. Assign credence (60/25/15). Calculate "value" according to each theory.
      *   *Problem:* Theories use different scales. Utilitarianism counts "utils" (lives saved). Special obligations count "duties fulfilled." Virtue ethics counts "character points." You can't just add them up without a common currency.
