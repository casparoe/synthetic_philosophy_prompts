      *   *Key Insight:* If you act only on the 60% (Local), you risk violating the 25% (Global) which might have *much higher stakes* (lives vs. groceries). This is the "Pascal's Wager" risk of moral uncertainty. Even if you think Utilitarianism is less likely, if its stakes are orders of magnitude higher, it might dominate the decision.
