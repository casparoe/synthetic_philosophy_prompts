      *   *The Meta-Problem:* Moral Uncertainty. I don't know which moral theory is true. How do I decide when my credences are split across incommensurable theories?
      *   *The Time Element:* Deadlines create asymmetry. Local is time-sensitive; Global is not (fungible over time).
