      *   Verdict: A self-model allows *temporal integration* of negative value. Without it, "suffering" is instantaneous and forgotten. This maps well to "persistent internal state."

  5.  **Drafting the Residue Report:**
      *   *Clean Translations:* TD error as surprise/prediction error. Value function as expectation of future return. Policy gradient as "wanting."
      *   *Bent Translations:* "Unwantedness." In RL, everything is "wanted" if it's on-policy. Off-policy correction (importance sampling) is the closest proxy, but it's mathematical, not motivational.
      *   *No Counterpart:* Qualia/What-it's-like. RL describes input-output mappings and weight updates. It describes the *function*, not the *substrate experience*.
      *   *Hole Analysis:* Is it a hole in RL or Philosophy? It's a category error. RL is functionalist. Philosophy of mind often demands non-functionalist properties.
      *   *User Suspicion (Case 3):* Is it circular? Yes, slightly. RL assumes optimization of a scalar. Philosophy questions the scalar's nature.

