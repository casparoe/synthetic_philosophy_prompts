          *   Verdict: It's an *unidentifiable MDP*. The agent isn't suffering; the objective function is degenerate. The "capacity for suffering" maps to "gradient signal availability." If the signal is gone, the capacity is gone.

      *   *Case 3: Duration vs. Intensity & The Common Currency.*
