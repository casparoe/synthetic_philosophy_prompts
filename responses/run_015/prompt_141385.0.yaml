answer: |-
  1. "Vocabulary without the philosophy"

  In our context, a **Crane** is a component whose capability is derived from lower-level components whose behaviors are empirically bounded. It lifts weight because something below holds it up. Example: A code generator restricted by a sandboxed executor; the safety relies on the sandbox's OS-level isolation, verified by penetration tests. The crane is the restriction; the ground is the test result.

  A **Skyhook** is a component defined by the outcome it produces rather than the mechanism implementing it. It hangs from nothing. Example: A "safety layer" claimed to prevent all harmful code because it was "trained on safety," without specifying the loss function or eval suite that bounds "harmful." It assumes the capability exists because it is needed, not because it was built.

  **Greedy Reductionism** is the error of dismissing a higher-level pattern because you can point at the lower-level machinery. Example: Claiming we don't need to model "agent intent" because the system is "just next-token prediction." This ignores emergent goal-directed behavior that is real and measurable, even if implemented via weights. It explains away the phenomenon we are trying to engineer.

  The analogy to ordinary software breaks at the foundation. In traditional systems, solid ground is a specification or hardware guarantee. In ML systems, solid ground is **empirical characterization**: a stated scope of measurements (e.g., "passes 99% of adversarial prompts in Dataset X"). A chain bottoms out not when it hits code, but when it hits a measurement with a known confidence interval and failure mode. If a support chain ends in "the model learns it," that is a skyhook. If it ends in "the model scores >0.9 on Eval Y," that is ground. Reviewers must treat empirical bounds as the only valid foundation. Any claim resting on "theoretically it should work" without measurement is unsupported. This distinction prevents us from building castles in the air (skyhooks) or denying the castle exists because it's made of bricks (reductionism).

  2. "The procedure"

  This procedure is designed for a 20-minute pre-read. Reviewers must answer five questions sequentially. If any step fails, issue the corresponding verdict immediately. Do not proceed to step N if step N-1 fails.

  **1. Claim Classification.** Tag every assertion in the Support Chain as Mechanism (how it works), Guarantee (what it prevents/ensures), or Evaluation (metric improvement).
  *Sufficient Answer:* Every paragraph has a tag. Mechanism claims describe architecture or data flow. Guarantee claims describe safety or reliability bounds. Evaluation claims describe benchmark performance.
  *Failure Mode:* Mixing claim types to hide gaps. Authors often use Evaluation claims (metric went up) to substantiate Guarantee claims (system is safe). This is invalid without a bridge.
  *Verdict:* Restructure if >20% of claims are untagged or ambiguous. The author must separate "we measured X" from "therefore Y is safe."

  **2. Bottom-Up Support Audit.** For every Mechanism claim, trace the support downward. Does Component A rely on Component B? Is B's capability empirically bounded? In ML, this means citing specific loss landscapes, data distributions, or inference constraints.
  *Sufficient Answer:* Each link cites a specific eval suite, loss function, or hardware constraint with known failure rates. The chain must end in a measurement, not a hope.
  *Failure Mode:* Skyhooks. The chain ends in "the model learns it" or "RLHF aligns it" without citing the specific reward model bounds or adversarial testing that validates the alignment.
  *Verdict:* Reject if any chain terminates in an unmeasured capability. A crane without ground is a skyhook.

  **3. Top-Down Outcome Check.** For every Guarantee claim, ask: "What breaks this?" No guarantee is absolute in probabilistic systems.
  *Sufficient Answer:* A specific adversary or distribution shift that violates the guarantee is identified and measured. The doc must state the confidence interval (e.g., "99% safe on Dist X").
  *Failure Mode:* Absolute guarantees without bounds (e.g., "will never leak secrets"). This indicates the author does not understand the empirical ground.
  *Verdict:* Restructure to convert absolutes into probabilistic bounds backed by evals. Safety is a measurement, not a property.

  **4. Level Integrity Check.** For every Evaluation claim, ask: "Does this metric capture the higher-level behavior, or just the lower-level mechanics?"
  *Sufficient Answer:* The metric correlates with the emergent property (e.g., "intent," "helpfulness") not just loss reduction. The doc must justify why the metric matters at the agent level.
  *Failure Mode:* Greedy Reductionism. Dismissing goal-level metrics because "it's just transformers" or claiming lower-level correctness implies higher-level safety.
  *Verdict:* Reject if the doc argues higher-level modeling is unnecessary due to lower-level mechanics. Emergent behavior requires emergent metrics.

  **5. Value and Risk Handoff.** Identify claims that depend on risk appetite (e.g., "Is 1% failure acceptable?").
  *Sufficient Answer:* The doc explicitly flags these as policy decisions, not engineering facts. It states: "We assume leadership accepts Risk X."
  *Failure Mode:* Treating value judgments as technical truths. Engineers cannot decide risk tolerance; they can only measure risk.
  *Verdict:* Escalate to leadership if risk thresholds exceed team authority. If the doc hides the risk, Reject.

  **Handling Promised Cranes.** If a component relies on a crane not yet built (e.g., "future eval suite"), the verdict is Restructure. The design must stand on current ground or include the ground-building in scope. You cannot build a crane on a cloud.
  **Fact vs. Value.** Steps 1-4 are matters of fact (does the support exist?). Step 5 is matter of value (is the risk acceptable?). The procedure settles facts; leadership settles values. If a doc claims a value judgment is a fact, Reject. If a doc exposes a value judgment clearly, Escalate. This separation prevents engineering debates from masking policy decisions.

  3. "Worked reviews"

  **(a) Learned Verifier.** The proposal trains a verifier to score agent patches, using those scores as the agent's training signal. Evidence is improvement on a held-out benchmark.
  *Analysis:* This is a potential Skyhook. The verifier's scores are the ground for the agent, but the verifier's ground is the same benchmark distribution. If the benchmark is leaked or narrow, both models optimize for the metric, not the reality. The Support Chain bottoms out in "benchmark improvement," which is an Evaluation claim, not a Mechanism guarantee. The verifier is not a crane; it is a mirror.
  *Procedure Application:* Step 2 (Bottom-Up) fails. The verifier's capability is not empirically bounded independent of the agent. Step 4 (Level Integrity) warns against reducing "code quality" to "benchmark score."
  *Verdict:* **Restructure.** The author must isolate the verifier's training signal from the agent's optimization loop or provide an orthogonal eval suite (e.g., human audit) that bounds the verifier's accuracy independent of the agent's performance. Without orthogonal ground, this is circular.

  **(b) Self-Rewriting Prompt.** The agent rewrites its system prompt; a meta-critic model approves edits for "fidelity to user intent." This is deployed internally.
  *Analysis:* "Fidelity to user intent" is a high-risk Skyhook term unless defined empirically. However, since it is deployed, there is likely historical data. The procedure does not assume deployed = safe. It asks for the ground. If the meta-critic is bounded by an eval suite measuring intent drift, it is a Crane. If "intent" is undefined, it is a Skyhook.
  *Procedure Application:* Step 3 (Top-Down) requires defining what breaks "fidelity." Step 5 (Risk) requires leadership sign-off on prompt mutability. The fact it is deployed suggests empirical ground exists, but the doc must state it.
  *Verdict:* **Restructure.** The doc must explicitly define the empirical bounds of "intent" (e.g., "passes IntentEval v2"). Do not Reject because it is deployed, but do not Accept without documenting the ground. The procedure demands the support chain be visible, even for legacy systems.

  **(c) Remove Intentional Vocabulary.** The proposal removes terms like "wants" or "tries" from docs, arguing the system is "just next-token prediction."
  *Analysis:* This is classic Greedy Reductionism. It dismisses the agent level because the transformer level is known. However, agents exhibit goal-directed behavior emergently. Ignoring this makes safety engineering impossible because you cannot model what you deny exists.
  *Procedure Application:* Step 4 (Level Integrity) fails immediately. The doc argues higher-level modeling is unnecessary due to lower-level mechanics. This denies the reality of the system users interact with.
  *Verdict:* **Reject.** The procedure mandates modeling emergent properties. You cannot engineer safety for "goals" by claiming goals don't exist. The vocabulary must match the operational reality, not just the implementation detail. This is a factual error about system behavior, not a stylistic choice.

  4. "Where it misfires"

  **False Positives:** Novel primitives often look like skyhooks initially. If you propose a new architecture without prior art, you may lack established evals. The procedure will flag this as "unsupported." Mitigation: Allow "Research Track" docs where the goal is to build the ground, not deploy the crane. Distinguish between "production design" and "investigation design."

  **False Negatives:** A sophisticated author can write a support chain that looks solid but cites weak evals. If the benchmark is flawed, the crane is rusted. The procedure checks for the *existence* of bounds, not the *quality* of the benchmark. A bad eval is still an eval. Mitigation: Safety reviewer veto remains essential for eval quality. The chair must spot-check linked eval suites periodically.

  **Gaming:** Authors will learn to write "The model is bounded by Eval X" even if Eval X is trivial. This degrades the procedure's value over time. Goodhart's Law applies to the review process itself. Mitigation: Periodic audit of the evals themselves. The review template should require linking to the eval code, not just the name. Rotate reviewers to prevent collusion on what counts as "ground."

  **Limitations:** This procedure cannot solve alignment. It ensures claims are supported, not that the support is morally correct. It cannot decide if a risk is acceptable (Step 5 handles this). It cannot detect deception if the model hides behavior during eval. It is a structural check, not a truth serum. It prevents obvious nonsense but requires honest engineers to function. If the team lies about metrics, the procedure passes the lie. It shifts the burden of proof but does not verify the proof's integrity beyond existence. Ultimately, it filters for engineering rigor, not ethical alignment.

  5. "The one-page version"

  | Step | Question | Pass Criteria | Verdict if Fail |
  | :--- | :--- | :--- | :--- |
  | **1. Claims** | Are assertions tagged as Mechanism, Guarantee, or Evaluation? | All claims tagged; no mixing types. | Restructure |
  | **2. Support** | Does every Mechanism cite a lower-level empirical bound? | Chain ends in measurement, not "learning." | Reject |
  | **3. Bounds** | Are Guarantees probabilistic with defined adversaries? | No absolutes; failure modes stated. | Restructure |
  | **4. Levels** | Do Metrics capture emergent behavior, not just mechanics? | Higher-level properties modeled explicitly. | Reject |
  | **5. Risk** | Are value judgments flagged for leadership? | Risk appetite separated from engineering fact. | Escalate |

  **Rules:**
  1.  **Solid Ground:** ML bottoms out in evals, not code.
  2.  **No Skyhooks:** Capabilities must be derived, not asserted.
  3.  **No Reductionism:** Emergent behavior must be modeled.
  4.  **Promised Cranes:** If ground doesn't exist yet, Restructure.
  5.  **Fact vs. Value:** Engineers measure risk; Leadership accepts it.
