prompt: |-
  I'm a software engineer with no formal philosophy training, and I keep having the same argument with a colleague. She holds that you cannot know that something is beautiful, graceful, or unbalanced unless you have experienced it yourself — call this the experience requirement, the view that first-hand acquaintance with the object is a precondition on aesthetic knowledge, so that anything you take on trust from someone else is at best a well-founded guess. I think that is too strong, but I want a case that actually tests it rather than one that begs the question in either direction.

  Please build me one. What it is for: I want to settle whether I can ever be justified in signing off on an aesthetic decision I cannot personally verify — approving the color palette of a data-visualization library I maintain, when I cannot see the colors in question. That purpose fixes what counts as cheating: stipulating that the recipient knows, invoking a credentialed expert or critic, or turning the disputed property into something checkable without taste.

  Constraints:

  - One paragraph, ordinary professional setting, no science fiction and no exotic apparatus.
  - The recipient has a specific, permanent perceptual limitation that rules out the relevant first-hand experience — say what it is — rather than merely an inconvenience they could overcome.
  - The testifier is a peer with no credentials, and the recipient's only reason for trusting them is a track record of agreement on works they have both experienced.
  - The transmitted claim is a genuinely aesthetic one, and the recipient does not reach it by inferring from non-aesthetic descriptions.
  - The case should be one where the experience requirement and the default view that reliable testimony transmits knowledge as it does elsewhere genuinely come apart, with the divergence falling out of the two views rather than being written into the scenario.

  Then state what each view says about the case and why, name the single feature doing the work, say what happens to the case if that feature is removed (for instance, if the limitation is temporary rather than permanent), and give the strongest objection the experience-requirement defender would raise. Finish by taking a side: does the recipient know? Commit to a verdict, give your reasons, and tell me which premise of your argument you would abandon first if the case were pushed back on.
