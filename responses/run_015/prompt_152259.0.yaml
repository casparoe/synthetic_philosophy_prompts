answer: |-
  Leo slammed his glass down. Not hard enough to break it, but hard enough to make the raki jump out of the anise haze and slosh onto the table. He didn't wipe it up. He just pointed a wet finger at me.

  "No, no, don't give me that look. You're thinking in pictures. That's your problem. You're thinking in pictures of burning temples and headless statues because Gibbon told you to. Gibbon was a romantic, my friend. He needed a tragedy. He needed a moral ending where the villains—Christians, barbarians, decadence—killed the hero. But history isn't a play. It's accounting."

  He leaned in, eyes glassy, the neon sign from the Istiklal street outside buzzing pink against his cheek.

  "Rome didn't fall. It didn't trip. It didn't get pushed. It *outsourced*. Think about it. You've got a headquarters in Ravenna, maybe Rome, maybe here, and the lines are down. The bandwidth is gone. The cost of maintaining a legion on the Rhine is higher than the tax revenue from the Rhine. So what does a sensible CEO do? Does he bleed out trying to hold the line? No. He calls the regional manager. He says, 'You keep the lights on. You collect the rent. You send us whatever you can spare, and in exchange, we let you use the brand name.'

  "That's not a collapse. That's a franchise model. The Western provinces didn't get conquered; they got privatized. The local militias? That's private security. The Bishops? That's middle management taking over HR and welfare because the state stopped paying for it. The 'Fall' is just the moment the headquarters stopped sending memos. But the stores stayed open. The lights stayed on. The people still called themselves Romans because the brand was still the only one that mattered."

  He took a swig, grimaced at the burn, and waved a hand at the window, at the dark silhouette of the city that used to be the center of everything.

  "And don't get me started on the stressors. The lead pipes. The climate shift. Everyone loves that stuff now. 'Oh, the lead made them stupid, the cold made them hungry.' Sure. Okay. But poison and frost aren't causes, they're accelerants. They're the reason the CEO decided to file for Chapter 11 five years earlier than planned. The lead didn't kill the empire; it just made the bureaucracy sluggish enough that outsourcing looked like a better option. The climate shift didn't push the barbarians in; it just made the commute unbearable so they showed up at the border looking for work."

  He stabbed the air with a fork.

  "That's the other thing. The 'Invasions.' Please. The Goths, the Vandals, the Franks. They weren't aliens landing in spaceships. They were internal movements. They were people trying to get into the economic zone. The difference between the third century and the fifth isn't that the barbarians got stronger; it's that Human Resources stopped processing the applications. In the third century, you get a Goth, you give him a plot of land, he becomes a foederati, he's a Roman soldier. In the fifth century, the HR department is closed. The phone is off the hook. So the guys standing outside the gate with spears stop asking for visas and start walking through the open door. The Center didn't lose the territory; it just stopped integrating the new hires.

  "And I know what you're going to say. You're going to say 'Late Antiquity.' You're going to say 'Transformation.' Peter Brown and all those polite people in their tweed jackets. 'Transformation' is a lie. 'Transformation' is too soft. It implies a butterfly. A metamorphosis. Something beautiful and natural."

  Leo laughed, a harsh, barking sound that made the couple at the next table glance over.

  "There was nothing beautiful about it. It wasn't a transformation. It was a liquidation. It was a corporate bankruptcy where the assets got bought up by smaller, sharper firms. The Frankish Kingdom bought the Gallic division. The Visigoths bought the Spanish branch. The Church bought the intellectual property rights to salvation and administration. The Emperor in the West? He wasn't murdered. He was made redundant. His position was eliminated.

  "Gibbon cried because he thought the light went out. I'm telling you the light just got sold off to the highest bidder. The tragedy isn't that Rome died. The tragedy is that it became so boring. It didn't end with a bang. It ended with a signature on a deed transfer. It ended because the cost of doing business exceeded the profit margin, and the shareholders decided to cut their losses."

  He slumped back, suddenly exhausted by his own genius, and reached for the bottle.

  "So pour me another one. Because if I'm right, then we're not living in the ruins of an empire. We're living in the franchise. And that's much, much depressing."
