  1. **The Data Director:** "I can't tell the board 'it depends.' If they ask 'Do genes limit reading?', do I say yes or no without getting quoted as saying schools don't matter?"

     **Reply:** Give them the water-level analogy. Genes determine the speed of the boat, but schools determine the water level. If you raise the water level, all boats rise, even if some are still faster than others. The board wants to know if raising the water level works. The answer is yes. Heritability talks about the speed differences, not the water level. So if they ask if genes limit reading, say: "Genes influence individual differences, but schools determine the average outcome." Do not say "limit." Say "influence differences." And remind them that PKU is 100% genetic and 100% fixable. Genes are not destiny. The statistic describes variation, not potential. You can safely say schools matter without denying biology.

     **Soft Spot:** "Influence" is weasel words that might frustrate them.

  2. **The Union Rep:** "This sounds like sophisticated code for 'some kids can't learn,' which is how you talk yourself out of funding us."

     **Reply:** I understand why it sounds that way, but it's the opposite. If we say genes don't matter, we blame teachers when kids struggle biologically. If we say genes matter, we know we need *better* interventions, not fewer. Think of glasses. Nearsightedness is highly heritable. Do we say "don't fund glasses because it's genetic"? No, we fund glasses because it's a specific biological need we can fix. This argument isn't about lowering expectations; it's about matching the tool to the mechanism. You want funding secured? Show them that ignoring biology makes interventions fail. We are arguing for precision funding, not cuts.

     **Soft Spot:** Doesn't guarantee *this* specific program works.

  3. **The Behavioral Geneticist:** "Isn't 'closable share' just environmentality ($1 - h^2$) with marketing paint? You haven't identified anything new."

     **Reply:** It's not identified from the variance alone, which is the point. Environmentality includes everything non-genetic, including measurement error and environmental factors we can't change, like prenatal nutrition or random noise. Closable share is only the slice we can actually move with policy. $1 - h^2$ is a statistical residual; closable share is an engineering specification. You can have high heritability and high closable share if the environment is currently uniform but suboptimal. I'm not renaming a parameter; I'm proposing a different measurement entirely. One comes from twins, the other comes from trials.

     **Soft Spot:** Admits I can't estimate it without running the trial.

  4. **The Quant Researchers:** "If the test isn't measurement invariant across groups, your variance decomposition is garbage. Are you assuming it is?"

     **Reply:** You're absolutely right. If the test measures "reading" differently for different groups, the variance ratios are meaningless. That's actually another reason not to rely on $h^2$ for policy. It assumes the scale is perfect. That's why I'm pushing for closable share based on intervention gains. If the intervention moves the score, it doesn't matter if the baseline scale was slightly off. We measure change, not just status. So I agree with your caution, which is why we need intervention data, not just psychometrics. Don't trust the ratio; trust the gain.

     **Soft Spot:** Concedes the existing heritability literature might be flawed.

  5. **The School Psychologists:** "Okay, theoretically fine. But I have a kid failing tomorrow. Do I look at heritability or not?"

     **Reply:** Do not look at heritability. It tells you nothing about that child. It's a population statistic, like average rainfall. Knowing the average rainfall doesn't tell you if you need an umbrella today. Look at the child's specific skill deficits. Do they know phonics? Can they decode? Treat the skill. Heritability is for the board deciding on budgets, not for you deciding on instruction. Your job is to teach reading, not to diagnose variance sources. Use the screening data, not the genetic data.

     **Soft Spot:** Doesn't help with differential diagnosis much.

  6. **The Parent Rep:** "Are you telling me there's a cap on what my child can achieve based on their DNA?"

     **Reply:** No. Heritability says nothing about your child's ceiling. It describes why children differ in a specific place and time. It does not set a limit on what teaching can do. We've seen reading scores rise across entire generations while heritability stayed high. Your child's potential is not fixed by this number. This number is about how we allocate resources to help all kids, including yours, reach that potential. We are talking about group statistics, not individual destiny. Your child is not a variance ratio.

     **Soft Spot:** Nuance isn't comforting to a worried parent.

  7. **The Behavioral Geneticist:** "You're ignoring gene-environment correlation. Kids select environments that match their propensities. You can't just override that."

     **Reply:** I'm not ignoring it; I'm accounting for it in the "feasible" part of closable share. Active rGE makes intervention harder because kids resist environments that don't fit. But schools are structured environments. We can structure the choice so the right environment is the default. It means interventions need to be more engaging, not that they won't work. It changes the design, not the possibility. We aren't overriding biology; we are channeling it.

     **Soft Spot:** Acknowledges difficulty without conceding impossibility.

  8. **The Question I'm Hoping Nobody Asks:** "If this 'closable share' is the number we should be using, why haven't you calculated it for us yet?"

     **Reply:** Because it's not a statistic you find in a database; it's a result you get from running the program. You can't calculate closable share without testing the intervention. That's why I'm here. I'm telling you that $h^2$ won't answer your renewal question, but a pilot study will. I'm asking you to measure the right thing, not pretending I already have the number. We need to run the program to know the share.

     **Soft Spot:** Makes me look like I'm selling a study rather than giving answers.

  \answer{This justifies cutting funding.}
