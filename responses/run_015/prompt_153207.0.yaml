answer: |-
  ### The principle

  Weakness of will is a failure of executive fidelity to a stable, higher-order commitment due to transient motivational pressure, where the agent retains the capacity to comply. It requires: (1) a standing policy formed under reflective stability; (2) a localized failure driven by immediate affective pressure (aversiveness or allure); and (3) preserved alternative possibilities—the agent *could* have acted otherwise without external coercion or physiological incapacitation. This distinguishes it from compulsion (capacity lost) and rational revision (policy updated). The core failure is not necessarily judging B better than A at time T, but failing to empower the judgment that *matters* to your identity over the impulse that *moves* you in the moment.

  ### What forces each clause

  The "stable policy" clause excludes the career quit; you revised it over months, rather than failing it. It captures the tax form: looming aversion overwhelmed standing intent. The "transient pressure" clause handles the cake and 2am TV; the dieter's "worth it tonight" is a transient justification, not a policy shift. This makes race-day skipping weakness: dread is transient, the commitment to run is stable. Running is success; skipping is fidelity failure. The "capacity" clause knives between addict and alarm. The heroin user's neurochemistry hijacks steering; the sleeper retains physiological mechanism to wake but lacks motivational trigger. This explains why the alarm feels involuntary yet remains weakness; the body can wake, will doesn't push. Addict's body cannot refuse. Career change lacks transient pressure; it was a slow burn. Cake looks like judgment shift, but is temporary policy suspension. Race morning is clearest test: dread is feeling, not reason. Skip means feeling vetoes policy. $50 drink proves capacity exists; if money moves you, will was weak, not broken. Password case shows acknowledging capacity gap: paying mate admits lacking internal capacity, marking weakness publicly.

  ### Cases I havent listed

  1. *Attentional Drift:* You promise to listen to your partner, but pick up your phone when a notification buzzes. You haven't judged the phone better, but your attention slid. This is weakness of focus, matching the alarm case—capacity to listen retained, transient allure won. 2. *Doxastic Weakness:* You know the data supports climate change, but you avoid reading the report because accepting it feels heavy. You don't change your belief, but you refuse to sustain attention on the evidence. This fits the tax form: aversion to cognitive effort overrides epistemic commitment. 3. *The Hungry Shopper:* Buying junk while hungry despite a standing diet. Unlike the cake, you don't judge it worth it; you just throw it in the cart. This is pure capacity failure vs. transient urge, clearer than the dieter's rationalization.

  ### What I have to give up

  Abandon the intuition that the dieter's judgment ("worth it tonight") is authentic; it's a transient rationalization masking a stable commitment violation. Lose ambiguity on the race: skipping is weakness, running is fidelity. Soften the verdict on paying the mate: it isn't pathetic, but rational recognition of limited capacity. Weakness doesn't always feel like a struggle; sometimes relief. The standard line's requirement for contradictory judgment is dead, but you concede agents can be wrong about their own motivations.
