      *   **Application:** Apply this procedure to three specific proposals:
          1.  Macro-scale quantum coherence engine (zero-point energy).
          2.  Neuroprosthetic interface (glial networks, LTP augmentation).
          3.  Stratospheric aerosol climate intervention.
      *   **Constraint:** Proposal (2) *must* yield a result the board will resist (i.e., it passes the procedure and advances, despite seeming like fantasy).
      *   **Output Format:** Text explanation of the procedure and applications, followed by a specific JSON summary with exact fields (`procedure_steps`, `modal_leakage_checks`, `case_applications`, `irreducible_judgment_points`).
      *   **Audience:** IRB members with advanced scientific training but no philosophy background. Decisions need named sign-offs.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Friend's View:* Conceivability $\rightarrow$ Possibility (Prima Facie).
      *   *User's View:* Conceivability is weak; need rigorous derivation against background theories to find hidden contradictions (Kripkean a posteriori necessity style).
      *   *Synthesis for IRB:* The procedure needs to validate the user's skepticism without paralyzing innovation. It needs to move from "Does this sound okay?" to "Does this break physics/biology as we know it?" while acknowledging where science ends and judgment begins.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Distinguish Surface Coherence (linguistic/logical consistency) from Depth Coherence (compatibility with established laws/theories).
      *   *Step 1: Surface Coherence.* Is the description internally consistent? (The Friend's bar).
      *   *Step 2: Parameter Definition.* Are all critical variables defined? (Flagging Modal Leakage).
      *   *Step 3: Background Theory Alignment.* Does it contradict conservation laws, thermodynamics, known biology? (The User's bar).
      *   *Step 4: Recursive Derivation.* If we assume Step 3 holds, do second-order effects create contradictions?
      *   *Step 5: Irreducible Judgment.* Where does the science stop and risk/ethics/value begin?

      *Refining the Steps for the Prompt:*
      *   Need explicit questions.
      *   Need "Sufficient Answer" criteria.
      *   Need Outcomes (Reject, Advance, Hand-off).
      *   Need to define "Modal Leakage" explicitly within the steps.

  4.  **Developing the Case Applications:**
      *   *Case 1 (Zero-Point Energy):* Generally considered impossible by mainstream physics (violates thermodynamics/quantum field theory interpretations). Should fail at Depth Coherence.
      *   *Case 2 (Neuroprosthetic/Glial):* This is the tricky one. The prompt *requires* the procedure to say "Advance" even if the board thinks it's fantasy. Glial cells *are* involved in synaptic modulation. LTP is real. "Permanent augmentation" is the risky part. To make it pass, I need to frame the "Depth Coherence" as "Not strictly ruled out by current neuroscience," even if highly speculative. The contradiction must be shown to be *absent*, not that it's proven. This aligns with the Friend's "defeasible reason" but tested against the User's "background theories." If current theory doesn't *forbid* glial modulation of LTP, it passes the *possibility* test, even if engineering is hard.
      *   *Case 3 (Stratospheric Aerosol):* Physically possible (volcanoes do it). The issues are ethical/political/systemic. This should pass physical possibility but trigger the "Hand-off to Value Judgment" step.

  5.  **Addressing "Modal Leakage":**
      *   Definition: A proposal survives only because a critical parameter (e.g., "efficiency," "coupling constant," "side-effect threshold") is left vague.
      *   Check: Force definition. If undefined, flag as leakage. If defined, test against theory.

  6.  **Addressing "Irreducible Judgment":**
      *   Science can't tell us if we *should* do something, only if we *can*.
      *   Science can't always prove a negative (impossibility) with 100% certainty, only high probability.
      *   The procedure must stop at "Physical Possibility" and hand off "Desirability/Risk Tolerance."

  7.  **Drafting the Content (Iterative refinement):**

      *   *Procedure:* Make it look like a checklist.
