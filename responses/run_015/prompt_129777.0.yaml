answer: |-
  This is an exceptionally clear analysis of a phrase that is often used sloppily. Your three diagnostic questions (Graph, Off-switch, Reset) are better than most undergraduate philosophy essays on the subject. They cut directly to the logical structure of the claim.

  Below is the menu you requested, formatted so you can copy it for your union. Following that, I have addressed your diagnostic questions, the issue of common usage, and the separation of law, belief, and suffering.

  ***

  ### Part 1: A Menu of Theses
  *Five distinct meanings of "The arc of history bends toward justice."*

  **1. The Teleological Thesis**
  *   **The Claim:** History is a process with a built-in direction or goal, and that goal is justice.
  *   **Kind of Claim:** Metaphysical / Theological (claims about the nature of reality).
  *   **Truth Status:** Straightforwardly false (there is no empirical evidence that the universe has a goal).
  *   **Political Implication:** Supports the **Man at the Meeting**. (If justice is inevitable, struggle is unnecessary; patience is rational.)

  **2. The Mechanistic Thesis**
  *   **The Claim:** Injustice generates suffering, suffering generates resistance, and resistance eventually produces justice.
  *   **Kind of Claim:** Sociological / Mechanism Claim (claims about cause and effect in human societies).
  *   **Truth Status:** Substantive and Defensible (but not guaranteed; resistance can be crushed).
  *   **Political Implication:** Supports the **Woman at the Vigil**. (The arc only bends if people generate the force of resistance.)

  **3. The Statistical Thesis**
  *   **The Claim:** If you measure indicators of well-being and rights over centuries, the long-term average slope is positive, despite local reversals.
  *   **Kind of Claim:** Empirical Forecast / Statistical Tendency.
  *   **Truth Status:** Substantive and Contested (depends entirely on which metrics you choose and how you weigh absolute numbers vs. percentages).
  *   **Political Implication:** Supports the **Man at the Meeting** (risks complacency), unless qualified that the trend requires maintenance.

  **4. The Normative Thesis**
  *   **The Claim:** We do not know if justice will win, but we are morally obligated to act as though it is possible so that we do the work required to make it happen.
  *   **Kind of Claim:** Normative / Ethical Commitment (disguised as a prediction).
  *   **Truth Status:** N/A (It is a vow, not a fact; it cannot be true or false).
  *   **Political Implication:** Supports the **Woman at the Vigil**. (It demands action as a condition of the hope.)

  **5. The Narrative Thesis**
  *   **The Claim:** Humans selectively remember victories and forget defeats, constructing a story of progress that makes the present feel inevitable.
  *   **Kind of Claim:** Epistemological / Claim about Selection Bias.
  *   **Truth Status:** Trivially True (this is how history is written).
  *   **Political Implication:** Supports **Neither**. (It suggests the sentence is a comforting story we tell ourselves, not a guide for action.)

  ***

  ### Part 2: Answers to Your Diagnostic Questions

  You asked if your three questions separate anything. They do. They are excellent tools for testing which thesis a speaker is using.

  **1. The Graph Question (Endpoint vs. Integral)**
  *   **What it separates:** It separates the **Statistical Thesis** from the **Normative Thesis**.
  *   **The Insight:** If the claim is about the *endpoint* (we will eventually have rights), it comforts the patient. If the claim is about the *area under the curve* (how much suffering happens before we get there), it demands action.
  *   **Union Application:** A rent strike might risk short-term instability (a dip in the line) to reduce the total area of suffering (evictions) over time. The "Patient Man" looks only at the endpoint; the "Active Woman" looks at the integral.

  **2. The Off-Switch Question (Agency vs. Determinism)**
  *   **What it separates:** It separates the **Teleological Thesis** from the **Mechanistic Thesis**.
  *   **The Insight:** If the arc bends with the off-switch on (no human action), it is magic or destiny. If it stops bending, the "bending" is actually just a metaphor for human labor.
  *   **Union Application:** This is the crux of your disagreement. The older member treats the arc as a machine running on its own. The vigil speaker treats the arc as a rope that must be pulled. The evidence suggests the latter: rights are rarely given without being taken.

  **3. The Reset Question (Accumulation vs. Nature)**
  *   **What it separates:** It separates **Institutional Learning** from **Human Nature**.
  *   **The Insight:** If rebuilders arrive at justice faster, justice is a technology we invent and store (institutions, laws, culture). If they arrive at the same speed, justice is a biological or rational inevitability.
  *   **Union Application:** This supports the idea that *organizing* matters. Unions are "archives" of power. If you dissolve the union, you lose the accumulated knowledge of how to bend the arc, and the next generation starts from zero. This argues against patience if patience risks dissolving the organization.

  ***

  ### Part 3: Usage, Risks, and Compatibility

  **Which reading is most common?**
  In speeches and on placards, people usually slide between the **Statistical** and the **Normative**. They intend it as a call to action (Normative), but they grammar it as a fact of nature (Statistical/Teleological) to give their audience confidence.

  **Is any reading actively misleading?**
  Yes. The **Teleological Thesis** (Inevitable Progress) is dangerous for organizers. It is the "opiate of the activist." If people believe justice is a law of physics rather than a product of struggle, they will not show up to the meeting. It makes present injustice feel less urgent because it frames suffering as a temporary lag in an inevitable system.

  **Are these readings rivals?**
  A sensible person can hold the **Mechanistic**, **Statistical**, and **Normative** theses simultaneously.
  *   *Compatible View:* "There is a statistical trend toward rights (Statistical), but only because oppression creates resistance (Mechanistic), and we must commit to being that resistance (Normative)."
  *   *Incompatible View:* You cannot hold the **Teleological** view alongside the **Normative** view. If it is inevitable, your commitment is redundant.

  ***

  ### Part 4: The Separation of Law, Belief, and Suffering

  You noted that you slide between "what the law says," "who counts," and "how much suffering there is." You also noted the statistic about modern slavery. This is the most critical point for your union work.

  **The Three Layers of Justice:**
  1.  **Legal Status:** (e.g., Slavery is illegal; Tenants have rights).
  2.  **Social Recognition:** (e.g., We believe tenants are people deserving of dignity).
  3.  **Material Reality:** (e.g., Are people actually housed? Are people actually coerced?)

  **How the Theses Survive the Separation:**
  *   **The Statistical Thesis** often fails here. If you measure *Legal Status*, history bends toward justice (more rights on paper). If you measure *Material Reality* (absolute numbers of enslaved people, homeless people, or evicted tenants), the arc may be flat or worsening due to population growth and economic complexity.
  *   **The Mechanistic Thesis** survives best. It explains *why* the layers come apart. Laws change only when Material Reality becomes unbearable enough to force Social Recognition.
  *   **The Union Application:** Do not let the "Patient Man" argue from **Legal Status** ("Eviction is illegal, so we will win"). Argue from **Material Reality** ("People are dying on the street, so we must act"). The arc of *law* might bend slowly, but the arc of *suffering* does not bend on its own.

  **Summary for the Union:**
  When you use the sentence, specify which arc you mean.
  *   If you mean "Justice is inevitable," you are telling people to go home.
  *   If you mean "Justice is possible if we pull," you are telling people to organize.
  *   The history of tenant rights suggests the latter is the only one that matches the facts.
