prompt: |-
  Hey — you're a clinical ethicist and philosopher who's also sat on a hospital IRB for years, so take this seriously, brainstorm a bit first, and then give me something I can actually use.

  I'm the senior research nurse on a transplant/oncology floor and I run the consent conversations for trials and for a couple of high-risk procedures — usually 4–6 a week, 15–20 minutes each, and I have to log a decision the same day that the IRB and the PI will both sign off on. Patients are often on steroids or opioids, sometimes in pain, frequently with family in the room who have already made up their minds, and the person recruiting them is very often their own treating consultant. I want a procedure, not a form: the questions in order, what counts as a sufficient yes to each one and what counts as a no, the question where I stop and don't proceed, and the places where I have to hand the call to someone else because it's a values question dressed up as a factual one. Be honest about which steps are theatre I perform for the file.

  Two things the standard disclosure / understanding / voluntariness checklist just doesn't help me with, and I need them handled: (a) everything comes as a package — the trial drug only comes with the extra biopsies and the home-visit adherence monitoring, so people say yes to the whole bundle because they want one part, or say yes to part and refuse the rest; (b) I have to pick some framing of the risks and the framing moves people — "30%" vs "about a third", survival curves vs. side-effect lists — so I'm never merely transmitting information, and I cant tell when that tips over into having manufactured the yes myself.

  Then run the procedure on three cases: [1] Mr A, day 3 on high-dose steroids, consenting for a phase I dose-finding trial; cheerful, repeats all the numbers back to me correctly, and volunteers that this is his best shot at a cure — it isn't, it's dose-finding, there's no therapeutic intent. [2] Ms B, listed for a transplant, perfectly happy to take the organ and the immunosuppression, refuses the protocol-required weekly adherence visits, and says then just give her the transplant without the study — there is no such option. [3] Mr C, enrolled under deferred consent after an emergency procedure, sister signed; he wakes up on day 2, fully with it, says he would never have agreed, wants out of the study going forward but is fine with the data already collected.

  Give me the answer the procedure actually gives, even when it's one I wont like, and tell me at the end what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Clinical Ethicist & Philosopher with IRB experience. Tone needs to be serious, pragmatic, experienced, and honest.
      *   **User:** Senior Research Nurse on a transplant/oncology floor. High stakes, high volume (4-6 consents/week), tight timeline (log decision same day).
      *   **Context:** Patients often impaired (steroids, opioids, pain), family pressure present, recruiter is often treating consultant (therapeutic misconception risk).
      *   **Goal:** A *procedure*, not a form. Needs specific questions, criteria for Yes/No, stop points, and hand-off triggers. Needs to acknowledge "theatre" (performative aspects for compliance).
      *   **Specific Pain Points:**
          *   (a) Package Deal (bundled interventions vs. selective consent).
          *   (b) Framing Effects (how risk communication influences decision).
      *   **Task:** Create the procedure, then apply it to three specific cases (Mr. A, Ms. B, Mr. C), giving the *actual* answer the procedure dictates (even if uncomfortable), and conclude with limitations.

  2.  **Deconstruct the Ethical & Practical Challenges:**
      *   *Capacity:* Steroids/opioids affect cognition and mood. "Cheerful" on steroids can mean mania or denial.
      *   *Therapeutic Misconception:* Treating doctor recruiting = high risk of patient thinking this is *care*, not *research*.
      *   *Voluntariness:* Family pressure, desperation ("best shot at a cure").
      *   *The "Package":* Research protocols are rigid. You can't usually unbundle. If they refuse a core component, they are ineligible.
      *   *Framing:* Numeric vs. verbal probabilities. The nurse knows framing matters but feels powerless to stop it.
      *   *Theatre:* IRB needs a signature. Sometimes the signature is a legal shield more than an ethical guarantee. I need to be honest about this.

  3.  **Drafting the Procedure (The "Protocol for Valid Authorization"):**
      *   *Structure:* Needs to be linear. Pre-assessment -> Disclosure -> Understanding -> Voluntariness -> Decision -> Documentation.
      *   *Key Innovation:* It needs to address the "Package" and "Framing" issues specifically.
      *   *Stop Rules:* Clear criteria for when to abort the consent process.
      *   *Hand-offs:* When does this become an ethics consult or PI issue?
      *   *Theatre:* Acknowledge where we sign for the file vs. where we sign for the soul.

      *   *Drafting Step 1 (Capacity/Impairment):* Must address the steroid/opioid issue. A simple "Are you oriented?" isn't enough. Need a "Teach-Back" specifically on *research vs. care*.
      *   *Drafting Step 2 (The Package):* Need a specific question: "If you could take the drug but skip the biopsies, would you?" If yes, they don't understand the bundle.
      *   *Drafting Step 3 (Framing):* This is hard to proceduralize. The nurse can't change the PI's script. But she can check *resonance*. "Does this sound like a gamble or a treatment to you?"
      *   *Drafting Step 4 (Voluntariness):* Need to isolate the patient from family briefly.
      *   *Drafting Step 5 (The "No"):* When to stop. If therapeutic misconception persists after correction -> Stop.

  4.  **Addressing the Specific Pain Points in the Procedure:**
      *   *(a) The Bundle:* Explicit "Unbundling Test."
      *   *(b) The Framing:* Explicit "Expectation Check."

  5.  **Running the Cases:**

      *   *Case 1 (Mr. A):* Steroids, Phase I, Therapeutic Misconception ("Cure").
          *   *Procedure Application:* He fails the Expectation Check. He thinks it's curative. Phase I is safety/toxicity.
          *   *Outcome:* Consent invalid. Stop. Hand off to PI/Ethics to reframe or exclude.
          *   *Hard Truth:* You cannot log this as a valid consent.

      *   *Case 2 (Ms. B):* Transplant, refuses adherence visits (bundled).
          *   *Procedure Application:* Unbundling Test. She wants the care, not the research.
          *   *Outcome:* She is ineligible for the *trial*. Can she get the transplant *outside* the trial? If the transplant is *only* available via trial -> Coercion/Unjust. If transplant is standard care -> She opts out of trial, gets standard care.
          *   *Assumption:* Usually, transplants are standard care. The trial is likely an adjunct.
          *   *Outcome:* She cannot consent to the trial. She gets the transplant as standard of care (if available). If the trial *is* the access pathway, that's a structural ethical violation. I will assume standard transplant is available but the *protocol* requires visits.
          *   *Hard Truth:* She is a "No" for the study. Do not coerce her into visits she won't do.

      *   *Case 3 (Mr. C):* Deferred consent, wakes up, withdraws.
          *   *Procedure Application:* Right to withdraw.
          *   *Outcome:* He withdraws from *future* intervention. Data already collected is usually retained (per IRB protocol on deferred consent), but he can request destruction.
          *   *Hard Truth:* You must honor the withdrawal immediately. The sister's consent is voided by his capacity return.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Acknowledge the "grind" of the job.
      *   Don't sugarcoat the "Theatre" aspect.
      *   Ensure the "Stop" points are clear.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too long?
      *   *Fix:* Keep it to 5 distinct phases. Use bolding for decision points.
      *   *Critique:* Did I address the framing issue?
      *   *Fix:* Add a specific step on "Resonance Checking." It's not about changing the numbers, it's about checking how the patient *hears* them.
      *   *Critique:* Is the "Theatre" section honest enough?
      *   *Fix:* Explicitly state that the signature often protects the institution more than the patient.
      *   *Critique:* Case 2 is tricky. If the transplant is *part* of the trial (e.g., experimental organ), she can't have it without the trial. If it's standard transplant + trial drug, she can have standard. I need to clarify this distinction in the analysis. I will assume the latter (standard transplant + trial adjunct) as it's more common for "adherence visits." If the transplant *itself* is experimental, the ethical breach is deeper. I'll address the nuance.

  8.  **Final Polish:**
      *   Ensure the "Limitations" section is robust. A procedure can't fix systemic coercion.
      *   Check against the prompt requirements: "questions in order," "sufficient yes/no," "stop points," "hand-offs," "theatre," "three cases," "limitations."

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is the procedure. It is designed for the reality of your floor: high turnover, impaired patients, and the pressure to enroll. It is not an idealized bioethics framework; it is a triage tool for validity.

  I have broken this into **Five Phases**. Each phase has a **Gate Question**, a **Sufficient Yes**, a **Hard No**, and a **Hand-Off Trigger**.

  ### The Protocol for Valid Authorization (PVA)

  **Pre-Condition:** Before you begin, verify the PI has separated *clinical care* from *research recruitment* in their script. If the treating consultant is the recruiter, you are the firewall. You are not witnessing a signature; you are auditing a decision.

  #### Phase 1: Capacity & Chemical Interference
  *Goal: Rule out steroid mania or opioid fog masquerading as capacity.*

  *   **Gate Question:** "I know you're in pain/on medication. If we talk for 10 minutes and you change your mind later, can you stop me? What would you do if you felt pressured?"
  *   **Sufficient Yes:** Specific plan to stop (e.g., "I'd tell you," "I'd call my wife"). Acknowledgement that medication might affect mood.
  *   **Hard No:** "I won't change my mind," "I just want to sign," or inability to articulate a way to stop the process.
  *   **Hand-Off:** If the patient is euphoric (steroids) or sedated (opioids) to the point of indifference. **Stop.** Wait 4 hours or get a psych consult. Do not log the decision.
  *   **The Theatre:** You are documenting "Alert & Oriented x4." That is necessary for the file, but insufficient for ethics. This phase is the real check.

  #### Phase 2: The Therapeutic Misconception Check
  *Goal: Address the "Treating Consultant" bias. Ensure they know this is research, not care.*

  *   **Gate Question:** "Doctor [Name] is treating you. This study is run by the research team. If this drug hurts you, who is responsible? Is the goal to cure you or to learn about the drug?"
  *   **Sufficient Yes:** "To learn about the drug." Acknowledgement that personal benefit is not guaranteed.
  *   **Hard No:** "This is my best shot at a cure," "Doctor [Name] said this would fix it."
  *   **Hand-Off:** If they believe the trial is curative (especially Phase I). **Stop.** You must call the PI. The PI must re-explain the intent. If the PI insists it's curative, you cannot witness this consent.
  *   **The Theatre:** The form says "Purpose of Study." You are checking if they *believe* the purpose.

  #### Phase 3: The Bundle Test (Addressing Pain Point A)
  *Goal: Ensure they are consenting to the research, not just the access.*

  *   **Gate Question:** "This comes as a package. You cannot have the drug without the biopsies/visits. If you could take the drug but skip the extra biopsies, would you still do it?"
  *   **Sufficient Yes:** "I understand I can't skip them. I accept the whole package."
  *   **Hard No:** "I just want the drug," "The biopsies are too much."
  *   **Hand-Off:** If they want to unbundle. **Stop.** They are ineligible for the trial. Do not try to convince them the biopsies are "worth it."
  *   **The Theatre:** The consent form lists procedures. This question proves they read it as a constraint, not a menu.

  #### Phase 4: The Framing & Resonance Check (Addressing Pain Point B)
  *Goal: Acknowledge that your framing influences them. Check if the risk matches their internal model.*

  *   **Gate Question:** "I just told you there is a 30% chance of severe side effects. When you hear that number, does that sound like a treatment plan or a gamble to you?"
  *   **Sufficient Yes:** "It sounds like a gamble," or "It sounds risky, but I'm willing." (Matches the reality of the trial).
  *   **Hard No:** "It sounds safe," "30% is low," (when 30% is actually high for their condition).
  *   **Hand-Off:** If their risk tolerance is based on a misunderstanding of the numbers you provided. **Stop.** Re-frame using absolute numbers, not percentages. If they still minimize the risk, they lack understanding.
  *   **The Theatre:** You are required to disclose risks. This step documents that they *processed* the risk, not just heard it.

  #### Phase 5: Voluntariness & The "Quiet Room"
  *Goal: Remove family pressure.*

  *   **Gate Question:** (Asked with family stepped out) "Is there anyone in your life who would be angry if you said no to this?"
  *   **Sufficient Yes:** "No," or "They might be, but it's my choice."
  *   **Hard No:** "My husband won't let me," "We need the money."
  *   **Hand-Off:** If coercion is admitted. **Stop.** Document "Patient declined due to external pressure."
  *   **The Theatre:** The form has a witness signature. The "Quiet Room" conversation is the only thing that makes that signature ethical.

  ---

  ### Application to Cases

  Here is the answer the procedure gives. I am not softening this.

  #### Case 1: Mr. A (Steroids, Phase I, "Cure")
  *   **Phase 1:** *Warning.* Steroids + Cheerful = Potential mania. Proceed with extreme caution.
  *   **Phase 2:** *FAIL.* He states: "This is his best shot at a cure." Phase I is dose-finding/toxicity. There is no therapeutic intent.
  *   **Procedure Decision:** **STOP.** Do not log the consent.
  *   **Action:** You must call the PI immediately. Tell them: "The patient believes this is curative. I cannot witness consent until the therapeutic misconception is cleared."
  *   **The Hard Truth:** If the PI says, "Just get the signature, he's going to die anyway," you are being asked to commit battery. You log "Patient Excluded: Inability to Distinguish Research from Care."
  *   **Why:** A consent based on a lie (that Phase I cures) is invalid. The signature on the file is worthless if the understanding is false.

  #### Case 2: Ms. B (Transplant, Refuses Visits)
  *   **Phase 3 (Bundle Test):** *FAIL.* She wants the transplant (care) but refuses the visits (research).
  *   **Procedure Decision:** **NO ENROLLMENT.**
  *   **Action:** She cannot be in the study.
  *   **Crucial Distinction:** Is the transplant *contingent* on the study?
      *   *If Yes:* This is coercive. The IRB should not have approved it. You must flag this to the IRB chair. She is being forced to choose between life and research integrity.
      *   *If No (Standard Transplant available):* She gets the transplant as Standard of Care. She is simply excluded from the trial arm.
  *   **The Hard Truth:** You cannot "convince" her the visits are important. If she refuses a core protocol requirement, she is ineligible. Do not try to find a loophole. Log her as "Screen Failure: Protocol Compliance."
  *   **Why:** Research data from a non-compliant patient is garbage. Enrolling her ruins the study and violates her autonomy.

  #### Case 3: Mr. C (Deferred Consent, Withdraws)
  *   **Phase 1:** *PASS.* He is "fully with it." Capacity is restored.
  *   **Phase 5 (Voluntariness):** *PASS.* He is making his own choice now.
  *   **Procedure Decision:** **WITHDRAW IMMEDIATELY.**
  *   **Action:** Stop all research interventions (blood draws, extra tests) instantly.
  *   **Data Question:** He says he is fine with data collected. You must check the specific IRB protocol for Deferred Consent. Usually, if a patient withdraws, you *must* stop using their data unless the IRB granted a waiver for data retention upon withdrawal.
  *   **The Hard Truth:** The sister's signature is void the moment he wakes up. She is no longer the LAR (Legally Authorized Representative).
  *   **Why:** Autonomy trumps prior proxy consent once capacity returns. If you keep collecting data, you are assaulting him.

  ---

  ### What This Procedure Cannot Do

  I need to be honest about the limits of this tool, or you will burn out trying to make it work where it can't.

  1.  **It Cannot Fix Structural Coercion:** If the *only* way Mr. C or Ms. B gets a transplant is through the trial, no consent form makes that ethical. This procedure identifies it, but it doesn't solve it. That requires an IRB shutdown or a policy change you can't enforce alone.
  2.  **It Cannot Protect You from the PI:** If your Principal Investigator pressures you to "just get the signature" on Mr. A, this procedure gives you the language to say no, but it does not stop them from overriding you. It protects your license, not your job security.
  3.  **It Cannot Eliminate Framing Bias:** You asked how to know when you've "manufactured the yes." You won't know. Phase 4 helps, but you are human. You want them to enroll (it helps the study, it helps the patient get access). Your tone will always lean toward "yes." The procedure minimizes this, but it doesn't sterilize it.
  4.  **It Cannot Handle the "Theatre" Burden:** You asked which steps are theatre.
      *   *Theatre:* The signature line. The date stamp. The initialing of every page.
      *   *Real Work:* The "Quiet Room" question (Phase 5) and the "Cure vs. Research" question (Phase 2).
      *   *The Burden:* You will spend 15 minutes doing the Real Work, and the IRB will only audit the Theatre. You have to make peace with the fact that your ethical labor is often invisible to the compliance officers.

  **Final Instruction:**
  Print the **Five Phases**. Keep them on a badge card. When a PI or a family member pushes, point to the card. "I can't proceed past Phase 2." It depersonalizes the refusal. It makes the procedure the villain, not you.

  You are the last line of defense. Act like it.
