answer: |-
  You have hit on one of the most sophisticated critiques of Logical Positivism and Neurath's specific project. Your intuition is correct: the "theoretical baggage" isn't eliminated; it is **displaced**.

  However, for Neurath, this displacement isn't a failure—it's the feature. To understand why this doesn't break his Physicalism, we need to make a precise conceptual distinction between **ontological commitment** (theory-ladenness) and **stipulative coordination** (convention).

  Here is the walkthrough of the conceptual difference you are looking for.

  ### 1. Implicit Ontology vs. Explicit Stipulation

  The core difference lies in *where* the meaning is hidden.

  **Verbal Language (Theory-Ladenness):**
  When you use a word like "class-struggle" or even "force," the theoretical baggage is **semantic and implicit**.
  *   **The Problem:** The word itself carries a causal or metaphysical claim. To say "The factory creates value" implies a theory of economics (Labor Theory of Value). To say "The electron orbits the nucleus" implies a specific model of atomic structure.
  *   **The Danger:** You cannot easily separate the observation from the theory. The language *seduces* you into accepting the theory just by using the noun. It creates an illusion of depth.

  **ISOTYPE (Interpretive Convention):**
  When you use a pictogram of a factory, the "baggage" is **syntactic and explicit**.
  *   **The Mechanism:** You need a legend (key) that says "This icon = 10,000 tons of steel."
  *   **The Difference:** The convention is **stipulated**, not discovered. It is an arbitrary rule agreed upon by the users.
  *   **Why it matters:** Because the rule is external to the image (in the legend), it is **visible**. You can point to the legend and say, "We agreed on this mapping." You cannot point to the word "force" and say, "Here is the agreement where we defined force independent of Newtonian mechanics."

  **The Conceptual Win:** Neurath isn't claiming pictures are "natural" or "God's eye view." He is claiming that pictures force you to **externalize your definitions**. The "baggage" is moved from inside the concept (where it is invisible) to the legend (where it is negotiable).

  ### 2. Surface Arrangement vs. Causal Mechanism

  This connects directly to Neurath's **Physicalism**. For Neurath, Physicalism wasn't about reducing everything to atoms; it was about reducing everything to **spatio-temporal coordinates**.

  *   **Verbal Ambiguity:** Words often describe *dispositions* or *essences*. "The worker is angry." (What is anger? Is it a soul-state? A hormone?)
  *   **ISOTYPE Constraint:** ISOTYPE can only show **arrangements**. It can show 50 icons of men standing outside a building. It cannot show "anger." It cannot show "exploitation."
  *   **The Distinction:**
      *   **Convention:** "One red man icon = 100 strikers." (This is a mapping rule).
      *   **Theory-Ladenness:** "The strikers are *fighting for justice*." (This is a causal/moral claim).

  ISOTYPE restricts you to the **surface**. It forces protocol sentences to describe *what is arranged where*, not *why it is arranged there*. The conventions required to read the chart (scale, color) do not add a *causal theory*; they only add a *measurement metric*.

  So, the "transparency" Neurath wants is not transparency to **Reality**, but transparency of **Commitment**. The picture makes it obvious that you are only counting bodies in space, not explaining their souls or economic destiny.

  ### 3. Protocol Sentences and Stability

  You asked: *Does relying on conventions break the idea that protocol sentences should be stable across theories?*

  This is where Neurath actually differs from Carnap. Carnap wanted a perfect, logical foundation. Neurath was a pragmatist. He viewed protocol sentences not as immutable truths, but as **coherent nodes in a network**.

  *   **The Boat Metaphor:** Neurath famously said we are like sailors rebuilding our ship at sea. We cannot strip it down to dry dock (foundationalism).
  *   **Conventions as Physical Events:** For Neurath, an agreement on a legend ("This icon means factory") is itself a **physical event**. It is a behavior of scientists agreeing.
  *   **Stability:** The stability of a protocol sentence doesn't come from it being "theory-free." It comes from it being **inter-subjectively checkable**.
      *   If I say "The electron has spin," you need a whole theory to check me.
      *   If I show a chart with 10 factory icons, and the legend says "1 icon = 1 factory," you can physically go count the factories.

  The conventions (legend, scale) are **transformation rules**. As long as the transformation rules are consistent, the physicalist requirement is met. The system remains stable across theories because the *visual syntax* remains constant even if the *sociological theory* explaining the factories changes.

  ### 4. Addressing the "Relocation" Critique

  You asked: *Is the transparency just relocated, not eliminated?*

  **Yes.** And Neurath would admit this.

  But the relocation is from **Metaphysics** to **Methodology**.
  *   **Verbal Language:** Hides metaphysics in grammar. (e.g., Subject-Verb-Object implies Agent-Action-Patient, which implies a specific ontology of causality).
  *   **ISOTYPE:** Hides nothing in the grammar; it puts the rules in the margin.

  **The Conceptual Distinction you were missing:**
  It is the difference between **Hidden Axioms** and **Explicit Algorithms**.
  *   **Theory-laden words** are like hidden axioms. You use them without realizing you've assumed a worldview.
  *   **Pictorial conventions** are like explicit algorithms. "If X, then draw Y."

  Neurath's goal was the **Unity of Science**. He knew a Russian Marxist and an American Capitalist would disagree on the *theory* of a factory. But they could agree on the *count* of the factories if they agreed on the icon. The convention allows them to coordinate their **physical observations** even if their **theoretical explanations** diverge.

  ### Summary

  1.  **Convention vs. Theory:** Conventions are arbitrary mapping rules (explicit); Theory-ladenness is implicit ontological commitment (hidden).
  2.  **Transparency:** ISOTYPE doesn't offer a view from nowhere. It offers a view where the **rules of representation are visible** in the legend, rather than hidden in the semantics of words.
  3.  **Physicalism:** It holds up because Physicalism for Neurath is about **spatio-temporal ordering**, not ultimate truth. Conventions help order space and time; they don't explain causes.
  4.  **Stability:** Protocol sentences remain stable because they rely on **inter-subjective verification** (counting icons) rather than **theoretical validation** (proving the existence of class struggle).

  You aren't missing a distinction; you are correctly identifying that Neurath swapped **Epistemological Purity** (which is impossible) for **Methodological Visibility** (which is useful). The "baggage" is still there, but now it's in a suitcase you can open and inspect, rather than sewn into the lining of your coat.
