  Except in Case 5, assume the utility numbers really are on a common unit scale, so that sums and differences across people are meaningful.

  Case 1, avoidable inequality. Three people, Ada, Ben and Cato. Policy X is a fair lottery over (0, 6, 6), (6, 0, 6) and (6, 6, 0). Policy Y is (4, 4, 4) for sure. Each person's expected utility is 4 under both, so with equal weights the theorem is indifferent. My verdict: Y, and it is not a close call.

