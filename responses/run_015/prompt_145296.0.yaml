  2.  **Ex Post Utilitarianism:** Expected value of the sum of utilities. (Mathematically identical to EAU).
  3.  **Ex Post Prioritarianism:** Expected value of the sum of *transformed* utilities. $E[\sum \phi(u_i)]$.
  4.  **Ex Ante Prioritarianism (EAP):** Sum of *transformed* expected utilities. $\sum \phi(E[u_i])$.
  5.  **Hybrid Fairness:** A weighted sum of Ex Ante Welfare and a "Fair Chance" penalty term for variance in expectations.

  **Selection:**
  I will narrow to **Ex Ante Utilitarianism (EAU)**, **Ex Post Prioritarianism (EPP)**, and **Ex Ante Prioritarianism (EAP)**.
