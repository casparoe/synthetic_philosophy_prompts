  ### 1. Correction and Tightening of the Theorem

  Your statement of Harsanyi's Aggregation Theorem is substantially correct but misses two technical premises that are crucial for your Case 5 and Case 6 problems.

  **The Premises:**
  1.  **Individual Rationality:** Each individual $i$ has preferences over lotteries satisfying von Neumann-Morgenstern (vNM) axioms, representable by $u_i$.
  2.  **Social Rationality:** Society has preferences over lotteries satisfying vNM axioms, representable by $W$.
  3.  **Pareto Indifference:** If every individual is indifferent between lotteries $L$ and $L'$, society is indifferent. (To get positive weights, you usually need **Strong Pareto**: if everyone prefers $L$, society prefers $L$).
  4.  **Cardinal Unit Comparability (CUC):** This is the hidden premise. For the weights $w_i$ to be meaningful constants rather than arbitrary scaling factors, the utility scales $u_i$ must be measured in a common unit (e.g., "welfare units"). Without this, $w_i u_i$ is indeterminate.
  5.  **Fixed Population:** The theorem assumes the set of individuals $N$ is fixed across all lotteries. It does not generate weights for non-existent people.

  **The Conclusion:**
  $W(L) = \sum_{i \in N} w_i E[u_i(L)] + c$.
  Under the Veil of Ignorance (symmetry), $w_i = w_j$, yielding **Ex Ante Utilitarianism**: $W(L) = \sum_{i \in N} E[u_i(L)]$.

