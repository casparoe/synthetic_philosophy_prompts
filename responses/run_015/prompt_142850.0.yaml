answer: |-
  Hi there, this is a really important box to get right, and your hunches are largely spot on. The first half of your colleague's paragraph is standard quantitative genetics fare and would pass muster with almost any philosopher of biology or behavioral geneticist. The definition of heritability as variance within a population rather than a proportion of an individual's trait is the crucial distinction, and the warnings about between-group differences and the fallacy of immutability are correct. The PKU example, though not explicitly named, is clearly doing the work there, and it is the canonical case for why high heritability is compatible with environmental remediation. So you can lean on that first section without worry.

  The trouble starts exactly where you suspected, with the flip side. The claim that high heritability means interventions are pushing against the grain of the genome and will wash out is not a logical consequence of high heritability. Heritability is always relative to the current range of environments. If you change the environment sufficiently, you can change the trait regardless of the heritability estimate in the original context. Myopia is highly heritable, yet glasses correct it perfectly, and the effect does not wash out while you wear them. The washout claim smuggles in a theory of set-points or canalization that heritability estimates alone do not justify. A trait can be highly heritable because everyone is currently experiencing the same optimal environment, leaving only genetic differences to explain variance, but that does not mean a new environmental change would be ineffective. So that sentence is misleading and risks undermining the very point you want to make about malleability.

  Regarding response heritability, your colleague is pointing to a real concept, often discussed under the header of genotype-by-environment interaction or the heritability of plasticity. It is true that we can measure the extent to which genetic differences predict how much individuals change in response to a specific intervention. However, the gloss provided in the paragraph is technically confused. It says this tells us how much of the intervention's effect is genetic rather than environmental. But the intervention itself is environmental by definition. What the statistic actually tells us is whether the response is uniform or whether some genotypes respond better than others. If the response is highly heritable, it suggests that a one-size-fits-all policy might be inefficient because people differ in their susceptibility, not that policy has less room to operate overall. In fact, knowing this could empower policy by suggesting targeted interventions. So the conclusion that it tells us how much room policy really has is not quite right; it tells us how much differentiation policy might need.

  Your friend in biology is also correct about the heritability estimates picking up more than just genes. This is the issue of gene-environment correlation, particularly passive correlation where parents provide both genes and environments. In twin and family studies, unless carefully controlled, what looks like genetic variance can partly reflect the fact that genetically similar parents create similar environments. This inflates heritability estimates. For your purposes, this actually strengthens your argument rather than weakening it. It further blurs the line between genetic and environmental causation, supporting your claim that the etiology of the trait is not the right place to look for moral responsibility. If the genetic label itself is partly a proxy for social transmission, then treating it as a hard biological constraint is even more mistaken.

  Does this survive for your argument about responsibility? Yes, and perhaps more robustly than your colleague's draft suggests. Your core claim is that responsibility tracks responsiveness to reasons and interventions, not the origin of the traits. The corrected science supports this. The standard heritability warnings show that genetic influence does not preclude responsiveness. The critique of the flip side shows that high heritability does not imply unresponsiveness. Even the response heritability point, properly understood, is about variation in responsiveness, not the absence of it. If an agent is responsive to reasons, the fact that the capacity for responsiveness is partly heritable does not negate the responsibility; it just describes the mechanism of the capacity. You are safe to argue that the moral question is about the actual functioning of the agency, not the variance components of its underlying traits.

  To your final question about whether there is a number that tells us how malleable a trait is: there is no single statistic that does this work universally. Malleability is a function of the specific intervention and the reaction norm of the trait. The closest thing is the effect size of a specific intervention in a specific population, not a property of the trait itself like heritability. Heritability is about variance in the status quo, not the slope of change under new conditions. So asking for the number that tells us how malleable a trait is is indeed the wrong sort of question, because malleability is relational, not intrinsic. You should feel confident steering the paper away from the idea that there is a genetic metric for policy room and toward the idea that policy room is an empirical question about intervention efficacy, independent of the heritability of the trait in the baseline population. I hope that helps you tighten up the box without losing the collaborator's contribution.
