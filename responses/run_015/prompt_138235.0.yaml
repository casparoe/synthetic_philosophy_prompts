      *   *Analysis:* If death is a biological state of the organism, ND and CD might not align perfectly in time. If we force a determinate time for policy, we might be fudging the biology. If we insist on biological unity, we might have to abandon one criterion (usually CD is the weak link biologically if perfusion is possible).
      *   *DDR:* The Dead Donor Rule is often cited as non-negotiable, but in practice, DCD stretches it. Is it a desideratum or a constraint we are willing to bend?
      *   *Ordinary Intuitions:* Families think heart stop = death. Brain death is confusing. Policy needs to respect this but not be held hostage by it.

