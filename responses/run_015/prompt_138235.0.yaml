          *   *Circulatory Arrest (Autoresuscitation):* Must not declare dead too soon. (Test of irreversibility).
          *   *Permanently Unconscious:* Must *not* classify as dead (under current law/consensus). (Test of person vs. organism).
          *   *Anencephalic:* Must *not* classify as dead at birth (current law), though ethically contested.
          *   *Hypothermic Drowning:* "Not dead until warm and dead." (Test of reversibility).

