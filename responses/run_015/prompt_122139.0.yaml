      *   **Specific Constraints:** Tell me what would change my mind (falsifiability/uncertainty). Be honest about where the reasoning is most likely to fail.
      *   **Tone:** Professional, peer-to-peer (chemist to physicist/philosopher), rigorous but accessible, critical but fair.

  2.  **Deconstruct the "Archivist" Analogy:**
