answer: |-
  ### Requirements Specification: Chance-to-Credence Module

  **1. Single-Case Mapping** (from *the last toss*)
  *   **Requirement:** The rule must map a stated single-case chance value directly to credence without requiring historical frequency data.
  *   **Consideration:** The agent acts on unique events; waiting for frequency convergence is not an option.

  **2. Higher-Order Aggregation** (from *chance laundering* & *two weather services*)
  *   **Requirement:** The rule must compute credence as the expectation over possible chance functions when the chance value itself is uncertain or reported conflictingly.
  *   **Consideration:** These two cases are **secretly the same requirement**. Both reduce to maintaining a prior distribution over chance hypotheses and updating it via Bayes' rule; the channel noise (Case 2) and conflicting reports (Case 5) are just evidence affecting that distribution.

  **3. Admissibility Filter** (from *the tipster's shadow*)
  *   **Requirement:** The rule must defer to chance values only conditional on evidence that does not entail the outcome (admissible evidence).
  *   **Consideration:** If the agent knows the outcome (even via a tipster), chance is irrelevant; credence must be 0 or 1.

  **4. Temporal Stability / Undermining Handling** (from *the self-erasing bias*)
  *   **Requirement:** The rule must handle cases where current chances assign non-zero probability to future chance functions that contradict the current one.
  *   **Consideration:** Simple deference ($Cr(A|Ch(A)=x) = x$) fails here; the rule must adjust for the risk that the chance function itself is unstable.

  **5. Interventional Alignment** (from *the truck on the bridge*)
  *   **Requirement:** The chance values provided must correspond to the probabilities conditional on the agent's available interventions (causal probabilities).
  *   **Consideration:** Expected utility calculation requires $P(outcome|action)$, not merely $P(outcome|observation)$.

  **6. Measure-Coherence** (from *chance one but not certain*)
  *   **Requirement:** The rule must assign credence 1 to events with chance 1, even if they are not logically necessary, without causing division-by-zero errors in conditionalization.
  *   **Consideration:** Standard probability theory allows measure-1 events to fail; the module must handle this edge case gracefully.

  **7. Level-Relativity** (from *the demon*)
  *   **Requirement:** The rule must allow deference to macro-level chances even if micro-level information is available, provided the macro-chances are the designated interface for decision-making.
  *   **Consideration:** Prevents the agent from bypassing intended abstraction layers via micro-computation.

  ---

  ### Analysis & Constraints

  **Confused Case:**
  *   **The Fission Box.** This is not a chance-credence problem; it is a problem of **indexical self-location** and personal identity. The chance of being the "0.9 branch" is ill-defined without a prior theory of identity (e.g., Self-Sampling Assumption). It belongs in the identity module, not the belief-update module.

  **Non-Negotiable vs. Taste:**
  *   **Non-Negotiable (Ship Critical):** 1 (Single-Case), 2 (Aggregation), 3 (Admissibility), 5 (Interventional). Without these, the agent cannot act on unique events, handle uncertain inputs, avoid money pumps from future info, or calculate utility correctly.
  *   **Taste (Metaphysical/Edge):** 4 (Undermining), 6 (Measure), 7 (Level-Relativity). These depend on the specific architecture of the simulator's physics and how strictly "chance" is defined.

  **Your Suspicions:**
  *   **Frequencies:** You are **right**. Single-case deference is required for real-time action.
  *   **Dutch-book Derivation:** You are **right**. You need the coherence property, not the philosophical derivation.
  *   **Causal Inertness:** You are **wrong** to suspect this claim. For the module spec, chances *should* be treated as causally inert inputs to a separate causal model. Conflating chance with causal power creates bugs in the decision module (evidential vs. causal decision theory confusion). Keep them separate.

  **Deference vs. Conditionalization:**
  *   **The Bite:** It bites on **inadmissible information**. The Principal Principle says $Cr(A|Ch(A)=x \& E) = x$ only if $E$ is admissible. Total evidence conditionalization says $Cr(A|TotalEvidence)$. If TotalEvidence includes the outcome, Conditionalization wins (credence 1), and Deference loses. The rule must be: **Defer to chance conditional on the admissible subset of total evidence.**

  **Unsatisfiable Subset:**
  *   **The Trilemma:** You cannot jointly satisfy: (1) The Old Principal Principle ($Cr(A|Ch(A)=x) = x$), (2) Humean Supervenience (chances supervene on total history), and (3) The possibility of Undermining Futures (Case 3).
  *   **Resolution:** You must adopt the "New Principle" (defer to chance conditional on the chance function itself) or reject Humean Supervenience.

  **Killer Requirement:**
  *   **Temporal Stability / Undermining Handling (Req 4).** This is the single requirement that kills the simple Lewis-style Principal Principle. It forces you to implement a more complex updating rule (like the New Principle) to avoid inconsistency when the chance function assigns probability to its own falsity.

  ---

  ### One-Liners on Chance Interpretations

  *   **Lewis-style Admissible Information:** Defer to chance unless you have crystal-ball knowledge of the future.
  *   **Best-System (Humean):** Chances are the axioms of the best compression algorithm for the world's history.
  *   **Propensity:** Chances are physical dispositions of setups to produce outcomes.
  *   **Expert/Calibration:** Treat the chance function as an expert witness and calibrate your credence to its reported reliability.
