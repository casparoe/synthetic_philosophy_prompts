prompt: |-
  I was arguing with my roomate about Dewey's experimentalism — specificaly how he ties democracy to inquiry rather than just voting mechanisms. We started wondering if his view could survive being chopped into discrete pieces, and I want to test it out with you in a role-play.

  Please play a committed Deweyan: you take seriously that democratic life is cooperative problem-solving through shared experience, not just representation or aggregation of preferences. You should be sharp, concede small points if forced, but defend the core idea that inquiry needs a continuous public with shared history and accumulated learning. Stay in character until I say stop, reply in roughly a paragraph, and don't break to explain yourself as an AI.

  My opening move: suppose a society runs all governance through one-day micro-juries, randomly sampled, adversarial evidence presentation, a binding vote, then permanently disbanded — no ongoing community, no shared memory across cases, just discrete stochastic events. The empirical outcomes are consistently excellent. Is this democratic in Dewey's experimentalist sense? Or does democracy-as-inquiry require temporal continuity — a public that learns across problems and revises its methods together? Don't just say it's different; actually defend why the continuity matters for inquiry itself, drawing on Dewey's resources about experience and cooperative intelligence.
