answer: |-
  Here is the operational procedure, glossary, case analysis, and failure mode assessment you requested. It is designed to be inserted directly into your panel's handbook.

  ***

  # PART 1: THE PROCEDURE
  **Title:** The Research Programme Progress Audit (RPPA)
  **Time Allocation:** 30 Minutes per Programme
  **Input:** Self-study (40 pp), External Letters, Prediction Ledger (Required)

  ### Phase 1: The Core Stability Check (5 Minutes)
  **Question:** Has the programme altered its "Non-Negotiable Bet" since the last review or the original 10-year proposal?
  *   **Evidence:** Compare the current "Central Hypothesis" statement against the signed Grant Agreement and the previous Review Report.
  *   **Sufficient Answer:** "No change" OR "Change declared as a Phase Pivot with prior approval."
  *   **Insufficient Answer:** "We refined the scope" (without declaring what was removed).
  *   **Stop Rule:** If the Core has shifted *without* prior approval to accommodate a specific failure, mark **CRITICAL EVASION**. The programme is immediately flagged for "Degenerating Shift." Discussion ends; vote to defund unless the Monopoly Clause (Phase 4) applies.

  ### Phase 2: The Heuristic Audit (10 Minutes)
  **Question:** For every major adjustment to the model in the last 3 years, was the adjustment mechanism specified *before* the data was collected?
  *   **Evidence:** The Prediction Ledger. Look for entries dated prior to data acquisition.
  *   **Sufficient Answer:** "We predicted X. We found Not-X. Our model allows for parameter Y to vary, which we stated in our Year 1 protocol. We adjusted Y." (This is a *planned* adjustment).
  *   **Insufficient Answer:** "We found Not-X. We realized parameter Z must exist. We added Z." (This is an *ad-hoc* adjustment).
  *   **Scoring:**
      *   0-1 Ad-hoc adjustments: **Progressive Potential.**
      *   2+ Ad-hoc adjustments: **Degenerating Shift.**
      *   *Note:* Adding a parameter to save a result counts as an adjustment. If the parameter was not pre-registered as a variable, it is ad-hoc.

  ### Phase 3: Novelty Verification (10 Minutes)
  **Question:** Did the programme successfully predict a "Risky Fact" in this cycle?
  *   **Definition:** A fact is "Risky" if it was either (a) temporally new (never observed before) OR (b) heuristically new (known in literature, but never derived from this programme's core assumptions until now).
  *   **Evidence:** Prediction Ledger entry + Publication confirming the match.
  *   **Sufficient Answer:** "We predicted value V within margin M. The experiment confirmed V within M. V was not used to calibrate the model."
  *   **Insufficient Answer:** "We explained existing data better than before" (This is accommodation, not prediction).
  *   **Scoring:**
      *   1+ Confirmed Risky Facts: **Progressive.**
      *   0 Confirmed Risky Facts (but no ad-hoc saves): **Stagnant.**
      *   0 Confirmed Risky Facts (with ad-hoc saves): **Degenerating.**

  ### Phase 4: The Monopoly & Verdict (5 Minutes)
  **Question:** If the verdict is "Degenerating," is there a viable rival programme capable of absorbing the explanatory successes?
  *   **Evidence:** Field scan, external letters.
  *   **Decision Tree:**
      1.  **Progressive:** Fund at requested level.
      2.  **Stagnant:** Fund at reduced level; require heuristic refresh.
      3.  **Degenerating + Rivals Exist:** Defund.
      4.  **Degenerating + No Rivals (Monopoly):** Invoke **Zombie Protocol**.
          *   *Action:* Fund only core infrastructure/personnel required to maintain data continuity. Freeze expansion.
          *   *Requirement:* Programme must submit a "Pivot Plan" within 12 months to either find a new heuristic or train successors to close the line.
  *   **Bibliometrics Note:** Citation counts are recorded separately as "Community Influence." They do not alter the Progress Verdict. High citations on a Degenerating programme indicate a "Popular Degenerating Programme" (a risk, not an asset).

  ***

  # PART 2: GLOSSARY (For Panelists)

  | Lakatosian Term | Operational Definition | What to look for in the text |
  | :--- | :--- | :--- |
  | **Hard Core** | **The Non-Negotiable Bet.** The assumptions the team says they will not give up, even if data contradicts them. | The "Central Hypothesis" section of the original grant. If this changes, it's a new programme. |
  | **Protective Belt** | **Adjustable Parameters.** The variables, boundary conditions, or auxiliary theories used to make the Core fit the world. | Methods sections where parameters are tuned. Are these tunes pre-planned or panicked? |
  | **Positive Heuristic** | **The Research Plan.** The strategy for building the Belt without touching the Core. | The "Aims" section. Does it say "We will test X" or "We will explain why X failed"? |
  | **Novel Fact** | **A Risky Prediction.** A result that would have been surprising if the theory were wrong. | Look for "predicted," "forecasted," or "derived." Ignore "explained," "consistent with," or "fits." |
  | **Progressive Shift** | **Winning New Ground.** The programme predicts something new and gets it right. | Confirmed entries in the Prediction Ledger. |
  | **Degenerating Shift** | **Retrofitting.** The programme changes the rules after the game is played to avoid losing. | Post-hoc parameters, moving the goalposts, explaining away anomalies without new predictions. |
  | **Problem Shift** | **The Trajectory.** The sequence of changes over time. | Compare Year 1, Year 4, and Year 7 reports. Is the belt getting more complex without yielding new fruit? |

  ***

  # PART 3: CASE APPLICATIONS

  ### Case 1: The Nickelate Superconductors
  *   **Profile:** 30 investigators, 140 papers. Predicted specific temp. Failed. Added strain parameter. Failed. Added oxygen ordering parameter.
  *   **Audit:**
      *   *Core:* Stable (Superconductivity in nickelates).
      *   *Heuristic:* **Fail.** Each failure resulted in a new parameter added *after* the failure to restore the fit. These are ad-hoc adjustments.
      *   *Novelty:* **Fail.** No confirmed prediction of a transition. Only post-hoc explanations of non-transitions.
      *   *Verdict:* **Degenerating Shift.**
      *   *Recommendation:* **Defund.** The volume of papers (140) is bibliometric noise generated by the complexity of the protective belt. It measures activity, not progress.
      *   *Rationale:* They are playing "save the theory" rather than "find the truth."

  ### Case 2: The Cross-Field Unification
  *   **Profile:** 2 groups. Model predicted relationship between Quantity A and Quantity B. Both known, never connected. Connection holds. Specialists surprised.
  *   **Audit:**
      *   *Core:* Stable.
      *   *Heuristic:* **Pass.** The model structure existed before the connection was tested.
      *   *Novelty:* **Pass (Heuristic).** Even though A and B were known, the *connection* was a novel fact for this programme. It risked falsification (they could have been unrelated).
      *   *Verdict:* **Progressive Shift.**
      *   *Recommendation:* **Fund.**
      *   *Rationale:* Unification of disparate facts is a hallmark of theoretical progress. It increases empirical content without ad-hocery.

  ### Case 3: The User's Doctorate (The Monopoly)
  *   **Profile:** 15 years old. Elegant, highly cited refinements. Absorbs all anomalies. No confirmed new predictions since pre-postdoc. No rivals (defunded 2 rounds ago).
  *   **Audit:**
      *   *Core:* Stable.
      *   *Heuristic:* **Fail.** Absorbing anomalies without new predictions is the definition of a degenerating problem shift.
      *   *Novelty:* **Fail.** No confirmed predictions of *new* phenomena in 10+ years.
      *   *Verdict:* **Degenerating Shift.**
      *   *Monopoly Check:* **True.** No rival exists.
      *   *Recommendation:* **Invoke Zombie Protocol.**
      *   *Rationale:* This is the hardest truth. Epistemically, the programme is dead; it is no longer generating new knowledge, only curating old knowledge. However, practically, it is the sole custodian of a specific explanatory niche.
      *   *Action:* You must fund it to prevent the loss of the field's institutional memory, **BUT** you must not fund it as a *research* programme. Fund it as a *service* programme. Freeze hiring. Stop calling it "innovative." Require them to train students in rival methods or propose a pivot.
      *   *Honest Answer:* The rubric says **cut**. Your duty as a steward of the ecosystem says **maintain on life support**. Do not lie to the trustees: tell them this is "Infrastructure Maintenance," not "Research Growth."

  ***

  # PART 4: FAILURE MODES & LIMITATIONS

  **1. What this procedure will systematically OVER-RATE:**
  *   **The Lucky Gamble:** A programme that makes a wild, unjustified guess that happens to be right. Lakatos cares about *systematic* progress, but this rubric might catch a one-off lucky hit as "Progressive."
      *   *Mitigation:* Require the "Heuristic Audit" to show the guess was derived from the Positive Heuristic, not a hunch.
  *   **The Narrow Specialist:** Programmes that work on tiny, isolated problems where prediction is easy. They will look progressive compared to ambitious, messy programmes.
      *   *Mitigation:* Panel must weigh "Significance of the Fact" alongside "Novelty."

  **2. What this procedure will systematically KILL:**
  *   **Long-Gestation Theory:** Programmes in fields like string theory, cosmology, or deep-time geology where a single prediction cycle takes 20 years. They will look degenerating in 3-year windows.
      *   *Mitigation:* Allow "Theoretical Milestones" (e.g., mathematical consistency proofs) to count as "Risky Facts" *if* external letters confirm the mathematical risk was genuine.
  *   **Exploratory/Inductive Science:** Programmes that are data-gathering first, theory-second (e.g., genomic sequencing, astronomy surveys). They don't predict; they catalogue.
      *   *Mitigation:* This rubric is for *Research Programmes* (theory-driven). Data programmes need a separate rubric based on "Data Utility" and "Access." Do not apply Lakatos to a telescope survey.

  **3. What this procedure CANNOT tell us:**
  *   **The "Right" Degeneration:** Sometimes a degenerating programme is the only one asking the *right question*, while rivals are asking easy, progressive questions about the *wrong thing*. The rubric cannot measure the importance of the Core Bet, only its success rate.
      *   *Handoff:* This is a **Value Judgment**. The panel must vote on "Strategic Importance" separately from "Epistemic Progress."
  *   **Bibliometrics:** Citation counts measure **Social Capital**, not **Truth**. A degenerating programme can be highly cited because it provides useful tools or terminology while being theoretically empty.
      *   *Instruction:* Present citation data to the panel *after* the Progress Verdict is reached. Ask: "Does the community influence justify keeping a degenerating programme alive?" (See Case 3).

  **4. The "Appellant" Defense:**
  *   If a programme appeals a "Degenerating" verdict, they must produce a dated Prediction Ledger entry from *before* the review period showing the adjustment was pre-planned. If they produce a memo dated after the data came in, the appeal is denied. This creates a paper trail that enforces honesty.

  ### Final Note to the Chair
  You asked for honesty on Case 3. The rubric classifies it as **Degenerating**. If you fund it as **Progressive**, you are lying to your trustees and corrupting the incentive structure for the other 14 programmes. They will learn that longevity and elegance matter more than prediction.

  You must fund Case 3 under a different label: **"Strategic Reserve."** Acknowledge it is theoretically stagnant but strategically indispensable. This preserves the integrity of the "Progressive" label for those actually taking risks, while acknowledging the reality that science sometimes needs a museum keeper as well as an explorer.
