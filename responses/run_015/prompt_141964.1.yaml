prompt: |-
  I've just taken over as chair of the review panel for our foundation's decadal programme grants, and I want to replace the vaguest part of our rubric with something that actually discriminates. We fund about fifteen research programmes rather than projects — multi-group, ten-year commitments — and we re-review each of them every three years; the whole panel has two days, roughly forty pages per programme (a self-study, three external letters, an output list), about thirty minutes of discussion each, and a fixed budget, so we are really ranking programmes against one another. Right now reviewers rate scientific quality and promise, which in practice means that a programme publishing constantly looks healthy whatever it is doing, and a programme that has quietly altered what it claims in order to absorb an inconvenient result looks exactly like a programme that has learned something. A philosopher on our board suggested we build the new rubric on Lakatos's methodology of scientific research programmes: treat the programme, not the individual theory, as the thing we appraise; ask what its defenders have implicitly agreed not to give up; ask whether each round of auxiliary adjustments was staged in advance by the programme's own research strategy or invented after the fact to save it; and, above all, ask whether the adjustments led to anything new being successfully predicted, so that we can tell a genuinely progressive problem shift from a degenerating one. I find this convincing in outline, but every time I try to turn it into questions a panel can actually answer in half an hour, the vocabulary stops cashing out.

  Three places in particular. First, novelty: I plan to require each programme to keep a ledger of the predictions it registers before it looks at data, but our applicants disagree about what deserves an entry, and so does the secondary literature — some read Lakatos as demanding that the predicted fact be temporally new to anyone, others as requiring only that it not have been used in building the theory, even if the fact was already sitting in some other field's literature. The panel has to pick one, and it has to be able to defend the choice to an appellant. Second, the thing a programme won't give up: as I understand it, what is protected is fixed partly by the convention of its own practitioners rather than discovered in the texts, which means a clever programme can answer every awkward question by announcing that the challenged claim was never load-bearing after all. I need a rule for handling that move, and I need to know when to accept it as a legitimate relocation of the burden and when to treat it as evasion. Third, timing: Lakatos himself denies that there is any instant rationality in these appraisals — a programme can be degenerating for a while and still be the right thing to back — yet we have to issue a verdict every three years, with a number attached. So I need an explicit grace rule, including for the hardest configuration, where the programme before us is degenerating but we have defunded or never funded any rival that could take over its explanatory successes; my reading is that Lakatos's criterion makes replacement by a better programme part of what rejection means, and I don't know what a funder is supposed to do when there is no replacement to hand. One more complication: we do have bibliometric data, one trustee wants citation counts used as the progress measure, and I'd like to know whether that belongs anywhere in the procedure or whether it measures something else entirely.

  What I'd like from you is a written procedure we could hand to next cycle's panel and actually run: the questions in the order they should be asked, what counts as a sufficient answer to each and what evidence satisfies it, the points at which the procedure stops with a no, the points at which it hands the decision to a person because the remaining question is one of values or risk appetite rather than appraisal, and a one-page glossary translating any theory-laden terms into language a materials scientist or a physiologist who has never opened a philosophy of science book can apply in thirty minutes. Then run it on three cases. The first is a thirty-investigator programme with a hundred and forty papers in three years, which predicted superconductivity at a specified temperature in a family of nickelates and, on each failure to find the transition, added a new parameter for strain and oxygen ordering to keep the fit. The second is a two-group programme whose model predicted a quantitative relationship between two quantities that had both been measured years earlier in an unrelated literature but had never been connected to that model — the connection holds, and specialists in the field found it surprising. The third is the programme I did my own doctorate in, fifteen years old, still producing elegant and much-cited refinements, absorbing every anomaly that comes at it, but with no confirmed prediction of anything new since before my postdoc; it is also now the only programme in the world still working on its central question, because we defunded its rival two rounds ago. I want to know honestly what your procedure says about the third one — I expect it to say something I won't like, and I would rather hear it from a rubric than from a trustee. Finally, tell me where the procedure will misfire: what it will systematically over-rate, what it will systematically kill, and what it simply cannot tell us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** New chair of a review panel for a foundation's decadal programme grants (15 programmes, 10-year commitments, reviewed every 3 years).
      *   **Problem:** Current rubric is too vague ("scientific quality/promise"), rewards publication volume over genuine progress, and can't distinguish between learning and ad-hoc saving of a theory.
      *   **Proposed Solution:** Base the rubric on Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Specific Challenges:**
          1.  *Novelty:* Temporal novelty vs. heuristic novelty (facts known but not used in construction).
          2.  *Hard Core:* How to prevent programmes from evading falsification by claiming a challenged claim wasn't "load-bearing."
          3.  *Timing/Grace:* Lakatos says no instant rationality, but the panel must decide every 3 years. What if a programme is degenerating but has no rival?
          4.  *Bibliometrics:* Where do citation counts fit?
      *   **Deliverables:**
          1.  A written procedure (questions, order, sufficient answers, evidence, stop points, value/risk handoff).
          2.  A one-page glossary (translating Lakatosian terms for scientists).
          3.  Application to three specific cases (Nickelates, Cross-field connection, The User's old programme).
          4.  Analysis of failure modes (what it over-rates, kills, or can't tell).

  2.  **Deconstruct Lakatos for this Context:**

      *   *Hard Core:* The irrefutable assumptions. In funding terms, this is the "bet."
      *   *Protective Belt:* Auxiliary hypotheses adjusted to save the core.
      *   *Positive Heuristic:* The plan for developing the belt.
      *   *Progressive vs. Degenerating:* Progressive = predicts novel facts. Degenerating = post-hoc adjustments only.
      *   *The Funding Twist:* We aren't just judging truth; we are judging *investment potential* over a 3-year horizon within a 10-year arc.

  3.  **Drafting the Procedure (The "Rubric"):**

      *   *Constraint:* 30 minutes discussion per programme. Needs to be tight.
      *   *Constraint:* Must handle the "Novelty" dispute. *Decision:* Heuristic novelty is more appropriate for science funding than strict temporal novelty (otherwise interdisciplinary work is penalized). Let's define it as "Novel to the Programme's Heuristic."
      *   *Constraint:* Hard Core evasion. *Decision:* Require a "Core Declaration" at the start of the 10-year grant. Changes to the Core count as a reset or a major strike.
      *   *Constraint:* The 3-year verdict vs. Long-term degeneration. *Decision:* Introduce a "Traffic Light" system with a "Sunset Clause" for the no-rival scenario.
      *   *Constraint:* Bibliometrics. *Decision:* They measure *influence*, not *progress*. They belong in a separate box, not the progress score.

      *   *Structure:*
          1.  Core Stability Check (Is the bet the same?)
          2.  Heuristic Audit (Was the adjustment planned or panicked?)
          3.  Novelty Verification (Did it predict something risky?)
          4.  The Verdict (Progressive, Stagnant, Degenerating).
          5.  The Exception (The "Monopoly" Clause).

  4.  **Drafting the Glossary:**

      *   Needs to be jargon-free for scientists.
      *   *Hard Core* -> "The Non-Negotiable Bet."
      *   *Protective Belt* -> "Adjustable Parameters."
      *   *Positive Heuristic* -> "The Research Plan."
      *   *Novel Fact* -> "Risky Prediction."
      *   *Degenerating* -> "Retrofitting."

  5.  **Running the Cases:**

      *   *Case 1 (Nickelates):* High output, but adding parameters after failure.
          *   *Analysis:* Classic degenerating shift. Adjusting the belt to fit data rather than predicting new data.
          *   *Verdict:* Defund or severe warning.
      *   *Case 2 (Cross-field):* Low output (implied), but connected known facts in a new way (heuristic novelty).
          *   *Analysis:* Progressive. Unification is a form of novel content.
          *   *Verdict:* Fund.
      *   *Case 3 (User's Doctorate):* Elegant, cited, no new predictions, no rivals.
          *   *Analysis:* Degenerating (no new predictions) but Monopoly (no rivals).
          *   *Verdict:* This is the hard one. Lakatos says don't back degenerating programmes. But funding says "who else?"
          *   *Solution:* "Zombie Funding." Maintain core infrastructure but freeze expansion. Require a pivot plan.
          *   *Honest Truth:* It should be defunded *in principle*, but funded *in practice* with strict conditions. I need to be honest with the user: The rubric says "cut," the reality says "keep on life support."

  6.  **Analyzing Failure Modes:**

      *   *Over-rate:* Bold but wrong guesses (if they look novel).
      *   *Kill:* Slow-burn theoretical work (math-heavy, long prediction cycles).
      *   *Cannot Tell:* When two programmes are both progressive (need sociological judgment).
      *   *Bibliometrics:* They measure social capital, not epistemic progress. Keep them separate.

  7.  **Refining the Tone:**

      *   The user is sophisticated (knows Lakatos, knows the pain points).
      *   Tone should be professional, direct, slightly philosophical but operationally rigorous.
      *   Acknowledge the difficulty of Case 3 with empathy but rigor.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 30 minutes enough for this depth?
      *   *Fix:* The pre-reading must do the heavy lifting. The panel discussion is for *verification* of the ledger, not discovery.
      *   *Critique:* Is "Heuristic Novelty" too loose?
      *   *Fix:* Define it strictly: "Fact F was not used to construct Parameter P."
      *   *Critique:* Case 3 is the user's baby.
      *   *Fix:* Be gentle but firm. The rubric *must* flag it as degenerating. The *policy* can override, but the *appraisal* must be honest. I will distinguish between the *Epistemic Verdict* and the *Funding Decision*.

  9.  **Final Polish:** Check against all constraints in the prompt (glossary, 3 cases, failure modes, bibliometrics). Ensure the "Monopoly" problem is addressed specifically as requested.

  *(Self-Correction on Case 3)*: The prompt asks "what your procedure says about the third one." I must not hedge too much. If the procedure is Lakatosian, it must label it degenerating. I will explain how the *procedure* flags it, but the *charter* might allow an exception. I need to make sure the user understands the distinction between "Bad Science" (degenerating) and "Necessary Infrastructure" (monopoly).

  *(Refining the Bibliometrics)*: The trustee wants them used. I need to explain *where* they fit. They fit in "Impact/Community Health," not "Scientific Progress." This allows the trustee to see them used without corrupting the MSRP logic.

  *(Refining the Hard Core)*: How to stop evasion? Require the "Core Declaration" to be signed at the mid-term review. If they move the core, they must justify it as a "Phase 2" pivot, not a save.

