answer: |-
  **Proposal Title:** The Epistemic Source of Deliberative Instability in Death in Damascus

  **1. The Research Question**

  The standard presentation of the Death in Damascus case treats the scenario as a stress test for normative decision rules. The central tension is usually framed as a conflict between causal advice (the prediction is fixed, so maximize expected utility based on the act) and evidential advice (the act is evidence of the prediction, so avoid the act that correlates with death). However, this framing assumes that the *instability* of the case—the sense that whichever option the agent selects, she immediately acquires a reason to switch—is a feature of the decision rule's failure to capture the correct normative relation between acts and outcomes.

  My hypothesis is that this instability is not primarily a defect of normative decision rules, but a structural consequence of a specific epistemic condition: the agent's access to her own decision procedure. In the standard setup, the agent is assumed to know the predictor's reliability *and* to have sufficient self-knowledge to anticipate her own choice (or the output of her own deliberation) before she makes it. This creates a feedback loop where the agent's knowledge of her own future choice becomes evidence about the predictor's past location, which in turn alters the expected utility of the choice, which alters the choice, and so on.

  Therefore, the precise question this paper will address is: **Is the distinctive deliberative instability of the Death in Damascus case a function of the predictor's reliability and causal structure (the normative setup), or is it a function of the agent's self-transparency (the epistemic setup)?**

  I will argue for the following determinate claim: The instability depends on the agent's self-transparency and not on the predictor's near-perfect reliability. Holding the predictor's reliability fixed while removing the agent's ability to predict her own decision procedure removes the instability; holding the agent's self-transparency fixed while varying the predictor's reliability (from perfect to merely high) preserves the instability. If this claim holds, the "paradox" is not a problem for causal decision theory per se, but a demonstration that standard decision theories presuppose an agent who cannot fully know her own output prior to the act.

  *Meta-Commentary on Contention:* It is uncontroversial that standard causal decision theory recommends leaving the city and standard evidential decision theory recommends staying. It is highly contested whether the resulting "instability" (the agent oscillating between choices) is a fatal objection to causal decision theory. The claim that this instability is *epistemic* rather than *normative* runs against the strong current view that the case reveals a flaw in how causal theories handle common causes or logical correlations. Most literature treats the agent's self-knowledge as a background assumption rather than a variable; treating it as the independent variable is a substantive, non-standard move.

  **2. Why Obvious Candidate Answers Leave the Question Open**

  To motivate the need for this specific inquiry, I must show why the standard responses to Death in Damascus fail to isolate the source of the instability. There are three broad families of response in the literature, none of which adequately distinguish between the normative and epistemic sources of the problem.

  *The Causal Response:* The first response holds that the causal recommendation is simply correct. The predictor has already left. The agent's choice cannot causally influence where the predictor is. Therefore, the agent should go to the nicer city. The feeling of instability is dismissed as a psychological quirk or "bad news" the agent must accept.
  *Critique:* This response assumes that the instability is merely emotional or psychological, rather than deliberative. It fails to explain why the agent, upon adopting the causal recommendation, finds that her reason for adopting it (that the prediction is fixed) is undermined by her adoption of it (since adopting it makes it likely the predictor anticipated it). If the instability were merely psychological, it would not recur at the level of reasons. By dismissing the instability as irrational anxiety, this view begs the question against the possibility that the instability reveals a genuine incoherence in the agent's epistemic position.

  *The Evidential Response:* The second response holds that the agent's choice is evidence of the predictor's location. Since death is the worst outcome, the agent should choose the option that correlates with survival. This dissolves the instability by fixing the choice on staying.
  *Critique:* This view accepts the instability as a signal that the causal view is wrong, but it does not explain *why* the causal view generates instability in this specific case but not in ordinary cases. In ordinary cases, knowing my decision procedure does not make my choice evidence of a past common cause. The evidential view treats the correlation as a brute fact of the case setup, ignoring the mechanism by which the agent comes to treat her choice as evidence. It assumes the evidential link is inherent to the scenario rather than generated by the agent's self-knowledge. It leaves open whether an agent without self-knowledge would still face this evidential link.

  *The Ratificationist Response:* The third response suggests that a decision is only rational if the agent would still make it knowing she has made it. This seeks a stable equilibrium. In Death in Damascus, no pure strategy is ratifiable, leading to a recommendation of mixed strategies or indecision.
  *Critique:* While this approach acknowledges the instability, it treats it as a normative constraint on rational choice (one must only choose ratifiable options) rather than an epistemic constraint on the agent's description of the case. It assumes that the inability to ratify is a failure of the *decision rule* to find a stable point, rather than a failure of the *agent model* to allow for a stable point. It does not investigate whether removing self-knowledge would make the pure strategies ratifiable.

  All three responses treat the features of the case as a fixed package. They argue about which rule handles the package best, rather than opening the package to see which component generates the tension. Consequently, the field remains deadlocked between those who think causal decision theory is vindicated (because causation is what matters) and those who think it is refuted (because it gives unstable advice). This deadlock persists because neither side isolates the variable of self-knowledge.

  *Meta-Commentary on Contention:* The claim that ratificationism "dissolves" the case is contested. Some argue ratificationism yields the wrong result in similar cases (e.g., ticking bomb scenarios). The claim that the causal view dismisses instability as "psychological" is a reconstruction of the causal position; proponents might argue they are dismissing *evidential* relevance, not psychological states. I will need to be precise in distinguishing the normative claim (causation matters) from the diagnostic claim (instability is irrelevant).

  **3. Methodology**

  The core challenge of this project is to vary the features of the Death in Damascus case without relying on raw intuition about which variants "feel" paradoxical. If I simply construct a variant and ask "is this paradoxical?", I invite the reader to project their preferred decision theory onto the case. Instead, I will use *deliberative equilibrium* as an objective metric for instability.

  **3.1 Defining the Metric: Deliberative Equilibrium**
  I will define a case as exhibiting *deliberative instability* if and only if:
  1.  The agent adopts a decision rule (e.g., maximize causal expected utility).
  2.  The rule recommends Action A.
  3.  Upon adopting the recommendation to do A, the agent's epistemic state updates such that the expected utility of A drops below the expected utility of Action B.
  4.  Consequently, the rule now recommends Action B.
  5.  This loop continues indefinitely or prevents the formation of a stable intention.

  This definition relies on the structural behavior of the decision rule within the epistemic setup, not on whether the outcome feels "weird." It measures whether the agent can settle on a plan without her own reasoning undermining the plan's justification.

  **3.2 Constructing the Variants**
  I will construct a matrix of cases varying the four features identified in the prompt, focusing primarily on Feature 1 (Reliability) and Feature 2 (Self-Knowledge), as these are the most relevant to the hypothesis.

  *   **Case A (Standard):** Perfect predictor; Agent has full self-knowledge (knows her own decision procedure).
      *   *Prediction:* High instability.
  *   **Case B (Opaque Agent):** Perfect predictor; Agent lacks self-knowledge (cannot predict her own choice, treats her own choice as exogenous to her current epistemic state).
      *   *Construction:* The agent knows the predictor is reliable but treats her own upcoming choice as a "black box" she cannot peek into during deliberation. She knows *that* she will decide, but not *what* she will decide until she decides.
      *   *Prediction:* Low instability. The causal recommendation remains stable because the agent does not treat her choice as evidence of the prediction.
  *   **Case C (Fallible Predictor):** High but imperfect reliability (e.g., 90%); Agent has full self-knowledge.
      *   *Prediction:* High instability. Even with 90% reliability, the evidential link is strong enough to flip the expected utility calculation if self-knowledge is present.
  *   **Case D (Fallible + Opaque):** High but imperfect reliability; Agent lacks self-knowledge.
      *   *Prediction:* Low instability.

  **3.3 Arguing from Behavior, Not Intuition**
  To avoid question-begging, I will not ask "Does Case B feel paradoxical?" Instead, I will model the deliberation formally.
  1.  I will write out the expected utility equations for the Causal Decision Rule in Case B.
  2.  I will demonstrate that in Case B, the term representing the probability of the predictor's location remains independent of the agent's choice *from the agent's perspective*, because the agent lacks the information to correlate them.
  3.  I will show that in Case A, the agent's self-knowledge introduces a conditional probability $P(Predictor | Choice)$ that diverges from the causal probability $P(Predictor)$.
  4.  The argument will rest on whether the mathematical structure of the deliberation allows for a fixed point. If Case B yields a fixed point (a stable recommendation) and Case A does not, the difference is mathematically demonstrable, not intuitive.

  *Meta-Commentary on Contention:* The idea that an agent can "lack self-knowledge" of her own decision procedure is contested. Some philosophers argue that deliberation inherently implies knowledge of one's reasons, and thus knowledge of the likely outcome. I will need to defend the coherence of the "Opaque Agent" without getting bogged down in philosophy of mind. I will treat it as a functional constraint: the agent is prohibited from using her current deliberation as data about the prediction. Whether this is psychologically possible is secondary to whether it is decision-theoretically coherent.

  **3.4 Isolating Feature 3 and 4**
  Features 3 (Randomization/Delegation) and 4 (Value Structure) will be held constant or used as controls.
  *   *Value:* I will keep death as a sufficiently large disvalue that it dominates the "nicer city" payoff, but finite. This avoids complications with infinite utilities which break expected utility calculations regardless of the decision rule.
  *   *Randomization:* I will introduce randomization only in the discussion of "failure modes." If the pure strategies are unstable, does a mixed strategy stabilize the case? This will serve as a test: if randomization stabilizes Case A but not Case B, it further isolates the source of the problem.

  **4. Expected Outcomes and Failure Conditions**

  **4.1 Positive Result**
  A positive result consists of demonstrating that the deliberative loop (the instability) vanishes in the "Opaque Agent" variants (Case B and D) while persisting in the "Self-Knowing Agent" variants (Case A and C).
  *   *Implication:* This would show that Causal Decision Theory is not inherently unstable in Newcomb-like problems; it is only unstable when applied to agents who model themselves as transparent predictors. The "paradox" is reclassified from a normative failure to an epistemic boundary condition. It suggests that rational agency requires a certain opacity to oneself during deliberation.

  **4.2 Negative Result (Failure)**
  The project fails if the instability persists even in the "Opaque Agent" variants.
  *   *Scenario:* If I construct Case B and find that even an agent who cannot predict her own choice still finds her choice to be evidence of the predictor's location (perhaps because she knows her *type* even if not her specific choice), then the hypothesis is false.
  *   *Implication:* This would suggest the instability is indeed structural to the causal setup (the existence of a common cause) and not dependent on self-knowledge. This would vindicate the standard view that Causal Decision Theory needs revision (e.g., to Evidential or Ratificationist theories) to handle common causes.

  **4.3 Probability Assessment**
  I should brace for a nuanced failure rather than a clean success.
  *   *Risk:* It is difficult to fully excise self-knowledge without changing the agent into a non-rational system. If the agent knows she is rational, and knows the predictor predicts rationality, she may be able to infer her choice even without direct introspection. This is the "Logic of Decision" problem.
  *   *Mitigation:* I will distinguish between *introspective* self-knowledge (knowing what I am about to do) and *typological* self-knowledge (knowing what kind of agent I am). My hypothesis specifically targets introspective self-knowledge. If the paradox survives on typological knowledge alone, I will need to narrow my claim: the instability depends on the *granularity* of self-knowledge, not its mere presence.
  *   *Likelihood:* There is a 60% chance the result will be mixed. The "Opaque Agent" might stabilize the causal recommendation, but critics will argue the Opaque Agent is an unrealistic model of deliberation. I must be prepared to argue that "unrealistic" does not mean "irrelevant" for isolating theoretical variables.

  **5. Scope Assessment and Constraints**

  A 6,000-word paper is sufficient for a focused argument but too short for a comprehensive survey of decision theory. I must make strict cuts.

  **5.1 What Must Be Cut**
  *   *History of the Debate:* I cannot trace the lineage of Death in Damascus from Gibbard and Harper to Joyce and others. I will refer to "standard causal views" and "standard evidential views" without naming specific proponents.
  *   *Feature 3 (Randomization):* I will mention mixed strategies only in the context of ratificationism. I will not develop a full defense of randomization as a solution.
  *   *Feature 4 (Value Structure):* I will assume a standard payoff matrix. I will not explore variants where death is not the worst outcome, as this distracts from the structural issue of prediction.
  *   *Alternative Theories:* I will not evaluate Timeless Decision Theory or Functional Decision Theory in depth. These theories explicitly build self-knowledge into the decision rule. Discussing them would conflate my hypothesis (self-knowledge is an epistemic variable) with their hypothesis (self-knowledge is a normative input). I will mention them only to distinguish my approach.

  **5.2 Likely Expansion Points**
  *   *Defining Opacity:* The biggest risk is spending too many words defending the coherence of the "Opaque Agent." Critics will argue this is impossible. I need to allocate roughly 1,500 words to defining this state precisely without drifting into philosophy of mind. I will frame it as an *informational constraint* on the deliberation rather than a metaphysical claim about free will.
  *   *Formal Modeling:* To avoid intuition-pumping, I need to show the math. This takes space. I must keep the algebra simple (binary choices, binary states) to ensure it fits.

  **5.3 Minimal Viable Project**
  If the scope proves too ambitious, the minimal version of this project focuses solely on the comparison between Case A (Standard) and Case B (Opaque).
  *   *Core Argument:* Show that Causal Decision Theory yields a stable fixed point in Case B.
  *   *Conclusion:* Therefore, the instability in Case A is not inherent to Causal Decision Theory's handling of common causes, but to its interaction with self-prediction.
  *   *Sacrifice:* I would drop the variation on Predictor Reliability (Feature 1). I would assume perfect reliability for both cases to show that reliability alone is not the differentiator. This strengthens the claim that self-knowledge is the key variable.

  **6. Detailed Plan of Execution**

  **Week 1-2: Formalizing the Variants**
  I will draft the precise probability distributions for Case A and Case B.
  *   *Case A:* $P(Predictor = Damascus | I go to Damascus) \approx 1$.
  *   *Case B:* $P(Predictor = Damascus | I go to Damascus) = P(Predictor = Damascus)$.
  I will verify that the "Opaque" constraint mathematically blocks the evidential conditional from updating the prior. This is the technical core of the paper. If I cannot formalize the opacity without contradiction, the project fails early.

  **Week 3-4: Drafting the Argument**
  I will write the core sections: The Question, The Variants, The Analysis. I will prioritize the argument that standard views conflate the variables. I will ensure I do not use citations, relying on descriptions of positions (e.g., "The view that prioritizes causal independence...").

  **Week 5: Addressing Objections**
  I will dedicate a section to the strongest objection: that the Opaque Agent is irrational or impossible. I will argue that even if impossible, the thought experiment isolates the variable. I will also address the objection that typological knowledge (knowing I am a rational agent) is enough to restore the paradox. I will argue that typological knowledge is not sufficient to generate the *instability* loop, only a static probability shift.

  **Week 6: Refinement and Scope Check**
  I will review the word count. If over 6,000 words, I will cut the discussion of mixed strategies. If under, I will expand on the implications for the concept of "rational intention." I will ensure the distinction between contested and uncontested claims is clear throughout.

  **7. Significance of the Project**

  If successful, this paper shifts the burden of proof in the Death in Damascus debate. Currently, defenders of Causal Decision Theory must explain why their theory gives "unstable" advice. If my hypothesis is correct, the instability is not a bug of the theory, but a feature of the specific epistemic conditions of the case. It suggests that decision theory should not aim to provide recommendations for agents who know their own outputs in advance, because such agents are not in a position to *decide*.

  This connects to a broader, unsettled question in the field: What is the relationship between deliberation and self-knowledge? The standard view assumes transparency (I know what I decide because I decide it). My project tests the limits of that assumption. It does not solve the Newcomb problem, but it clarifies why the problem feels paradoxical. It moves the discussion from "Which rule is right?" to "What kind of agent is this rule for?"

  *Meta-Commentary on Contention:* This significance claim is ambitious. Many decision theorists believe the Newcomb problem *is* about the rule, not the agent. Arguing that the agent model is the culprit is a minority position. I must be careful not to overstate the conclusion. I will frame it as "locating the source of instability" rather than "solving the Newcomb problem."

  **8. Conclusion of Proposal**

  The Death in Damascus case remains a focal point of decision theory because it pits causal intuition against evidential reasoning. However, the persistence of the debate suggests that the standard formulation conflates distinct variables. By isolating the agent's self-knowledge from the predictor's reliability, this paper aims to show that the deliberative instability often cited as a refutation of causal decision theory is actually a product of the agent's epistemic transparency.

  The project is feasible within 6,000 words provided I restrict the formal modeling to binary cases and avoid a historical survey. The primary risk is the philosophical coherence of the "Opaque Agent," but this risk is manageable by framing opacity as an informational constraint rather than a metaphysical one. Whether the hypothesis holds or fails, the result clarifies the structural dependencies of the case, offering a determinate answer to a question that has previously been treated as a monolithic puzzle.

