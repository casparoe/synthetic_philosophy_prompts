  **Addendum: Clarification on Contested vs. Uncontroversial Claims**

  *Per the standing request, I will explicitly map the terrain of consensus and dispute as I proceed in the paper. Here is how I will manage that distinction in the text:*

  1.  **Uncontroversial:** The payoff structure (Death is bad, Nice City is good). The causal structure (Choice does not cause Prediction). The reliability of the predictor (in the standard case).
      *   *Handling:* I will state these as givens of the thought experiment.
  2.  **Contested:** Whether Causal Decision Theory's recommendation is "correct." Whether Evidential Decision Theory is "irrational." Whether the instability is a "refutation."
      *   *Handling:* I will present these as competing interpretations of the *same* formal output, rather than arguing one is true. My argument is about *why* the output is unstable, not whether the output is right.
  3.  **Unsettled:** The possibility of an agent lacking self-knowledge during deliberation. The definition of "ratifiability."
      *   *Handling:* This is where my contribution lies. I will acknowledge the lack of consensus and argue that my construction offers a way to test these unsettled concepts without requiring a final resolution on the metaphysics of agency.

  *Specific Note on the Hunch:* My hunch that self-knowledge is the driver runs against the strong current view that the paradox is about *causal vs. evidential relevance*. Most scholars assume the agent's epistemic state is fixed and argue about the normative rule. I am arguing the epistemic state is the variable. I will flag this explicitly in the introduction so the reader understands this is a deviation from the standard research program, not an extension of it.

  *Specific Note on "Instability":* There is no settled definition of "deliberative instability." Some define it as oscillation; others as lack of ratifiability. I will adopt the oscillation definition (inability to settle on an intention) for the purpose of the paper, while acknowledging that ratificationists might define it differently. This prevents the paper from getting stuck on terminological disputes.

  *Specific Note on "Self-Knowledge":* It is contested whether an agent *can* lack self-knowledge of her decision. Some argue that to intend is to know. I will navigate this by distinguishing between *knowledge of the decision* and *knowledge of the determinants of the decision*. The Opaque Agent knows she is deciding, but does not know the outcome of the calculation until it completes. This is a standard distinction in computer science (halting problem) that I will import to philosophy to bypass the metaphysical dispute.

  By maintaining these distinctions, the proposal remains rigorous without pretending that the field is more settled than it is. The goal is not to end the debate, but to reframe the variables so the debate can proceed more productively.
