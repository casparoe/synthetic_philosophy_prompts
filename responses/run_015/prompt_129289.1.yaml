answer: |-
  ## Part I: The Logical Space

  Before we build the instrument, we must map the terrain. You are asking your characters (and readers) to navigate four distinct axes of disagreement. These are not just legal technicalities; they are philosophical commitments about what kind of thing a "group" is, what "destruction" means, and what language is for.

  **Axis 1: The Object (Who counts as a group?)**
  *   *Stable Identity:* The group must exist independently of the attack, defined by birth, blood, or deep history (e.g., ethnicity, religion).
  *   *Functional/Social:* The group is defined by what it *does* or how it organizes (e.g., a guild, a political party, a social class).
  *   *Constructed:* The group only becomes a "group" because the persecutor treats it as one. The attack creates the target.

  **Axis 2: The Act (What counts as destruction?)**
  *   *Biological/Physical:* The members must die or be prevented from reproducing. If the people live, the group lives.
  *   *Cultural/Social:* The group dies if its language, institutions, or ability to transmit culture are severed, even if every individual survives.
  *   *Dissolution:* The group ceases to exist as a legal or social entity, absorbed into the majority.

  **Axis 3: The Mind (What must the perpetrator think?)**
  *   *Specific Aim:* The destruction of the group was the primary goal.
  *   *Foreseen Consequence:* The goal was something else (land, labor, security), but the perpetrator knew the group would be destroyed and proceeded anyway.
  *   *Recklessness/Indifference:* The perpetrator didn't care if the group survived or not; the policy was implemented with disregard for the outcome.

  **Axis 4: The Word (What is the label for?)**
  *   *Legal Trigger:* The word is a verdict. It is used only after a court proves the specific elements.
  *   *Moral Alarm:* The word is a warning. It is used early to trigger prevention, even if legal proof is thin.
  *   *Deflationary:* The word adds no moral value. It is just "murder" or "persecution" with a louder megaphone.

  **The Empty Cells & Conflations**
  As we build the leaves, you will see some combinations are empty. For example, one cannot logically hold that "Only Biological Destruction counts" (Axis 2) while also arguing "Cultural Erasure is Genocide" (Axis 2). That is an incoherent cell. Similarly, "Legal Trigger" (Axis 4) and "Moral Alarm" (Axis 4) are often conflated in public discourse, but they are mutually exclusive in practice: you cannot use the word *strictly* for convictions and *also* use it *early* for prevention. My instrument will force these apart.

  ***

  ## Part II: The Instrument (The Branch Questions)

  These 11 questions are designed to be read aloud in a scene or handed to a beta reader. They use the concrete details of your manuscript (the River Pilots, the non-lethal dissolution) to force a choice without using legal jargon.

  **1. The Guild's Nature**
  The River Pilots recruit apprentices from outside their families, but most are born into it. If a group is defined by a job and a secret language rather than blood or prayer, is it stable enough to be destroyed?
  *   A) Yes, a shared life is as real as shared blood.
  *   B) No, a job is a choice; you can't "destroy" a choice, only ban it.
  *   C) Only if they are treated as a distinct people by their enemies, regardless of what they actually are.

  **2. The Constructed Member**
  Some of the people rounded up never called themselves Pilots until the soldiers came. They were just boatmen. Does being *made* into a target make you a member of the group?
  *   A) Yes, the persecutor's definition is the one that matters in the moment.
  *   B) No, you can't destroy a group identity that wasn't there to begin with.
  *   C) It counts for the victims' suffering, but not for the legal definition of the crime.

  **3. The Body Count**
  In the valley, not a single Pilot was killed. They were all relocated, fed, and housed. Can this be genocide?
  *   A) No. Genocide requires bodies.
  *   B) Yes. A group can die while its members breathe.
  *   C) It is a crime against humanity, but calling it genocide dilutes the word.

  **4. The Children**
  The state took the Pilot children and placed them with loyal families to learn the national language. The parents are alive but will never see them again. Is this destruction?
  *   A) Yes, severing the future is the same as killing the present.
  *   B) No, the children are alive and safe; the parents are just punished.
  *   C) It is cultural erasure, which is bad, but it is not the "crime of crimes."

  **5. The Intent (Goal)**
  The government says they wanted to secure the river trade, not end the Pilots. The Pilots ended. Does the government's stated goal matter?
  *   A) Yes, if they didn't aim to destroy the group, it isn't genocide.
  *   B) No, if they knew the Pilots would vanish and did it anyway, that is enough.
  *   C) No, if they were reckless about whether the Pilots survived, that is enough.

  **6. The Knowledge**
  The bureaucrats signed the orders. They didn't hate the Pilots. They just knew the policy would dissolve the guild within a generation. Did they commit genocide?
  *   A) Only if they secretly wanted the guild gone.
  *   B) Yes, knowing the outcome and proceeding makes you responsible for the outcome.
  *   C) They committed administrative cruelty, but genocide requires a specific villainous desire.

  **7. The Structure**
  No single person gave the order to "end the Pilots." It was a series of tax laws, licensing rules, and school policies over thirty years. Can a slow bureaucracy commit genocide?
  *   A) No, genocide requires a plan and a specific perpetrator.
  *   B) Yes, a system can kill a group without a single murderer.
  *   C) It is a structural violence, but we should keep the word "genocide" for massacres.

  **8. The Part vs. The Whole**
  The Pilots exist in three countries. This policy only affects the ones in one valley. Is this genocide?
  *   A) No, the group as a whole survives globally.
  *   B) Yes, destroying a distinct part of the group counts.
  *   C) Only if that part was significant enough that the whole group could not recover.

  **9. The Moral Weight**
  If 1,000 Pilots are dissolved culturally, is that morally worse than 1,000 random individuals being murdered?
  *   A) Yes, it attacks the fabric of human diversity, not just life.
  *   B) No, a murder is a murder. The "group" element is just context.
  *   C) It is different, but "worse" is the wrong metric; it is a different *kind* of wrong.

  **10. The Timing**
  A reporter wants to write "Genocide" in the headline *now*, while the policy is happening. A prosecutor says wait for the trial. Who is right?
  *   A) The reporter. The word is a warning to stop it.
  *   B) The prosecutor. The word is a verdict for after the facts.
  *   C) Neither. The word is too loaded; use precise descriptions instead.

  **11. The Inflation Risk**
  If we call this genocide, will it make it harder to prosecute the next clear-cut massacre?
  *   A) Yes, if everything is genocide, nothing is.
  *   B) No, preventing harm is more important than preserving legal purity.
  *   C) Maybe, but we shouldn't let future hypotheticals stop us from naming current evil.

  ***

  ## Part III: The Scoring Key

  To find the leaf, the reader does not simply count A, B, and C. They must look at the *pattern* of their answers across the four dimensions.

  **Dimension 1: The Group (Questions 1, 2, 8)**
  *   **Mostly A:** *Expansive/Constructive.* (Groups are social, constructed by conflict, and parts count).
  *   **Mostly B:** *Strict/Stable.* (Groups must be blood/stable, pre-existing, and whole).
  *   **Mostly C:** *Pragmatic/Legal.* (Groups are defined by legal recognition and significance).

  **Dimension 2: The Act (Questions 3, 4)**
  *   **Mostly A:** *Cultural Destruction.* (Social death counts as genocide).
  *   **Mostly B:** *Physical Destruction.* (Only killing/biological prevention counts).
  *   **Mixed/Other:** *Hybrid.* (Cultural destruction is a crime, but maybe not *the* crime).

  **Dimension 3: The Mind (Questions 5, 6, 7)**
  *   **Mostly A:** *Specific Intent.* (Must aim to destroy).
  *   **Mostly B:** *Knowledge/Foreseeability.* (Knowing it will happen is enough).
  *   **Mostly C:** *Structural/Reckless.* (Systems or indifference can commit the act).

  **Dimension 4: The Word (Questions 9, 10, 11)**
  *   **Mostly A:** *Prophylactic/Moral.* (Use the word early to prevent; it carries unique weight).
  *   **Mostly B:** *Legalist/Deflationary.* (Use the word only for verdicts; or it's just murder).
  *   **Mostly C:** *Skeptical/Precise.* (Avoid the word; use precise descriptions).

  ***

  ## Part IV: The Map of Leaves (The Positions)

  Here are the 12 theoretical positions your characters might inhabit. I have mapped them by their coordinates on the four dimensions above (Group, Act, Mind, Word).

  ### 1. The Convention Purist (The Prosecutor's Default)
  *   **Coordinates:** Stable Group | Physical Act | Specific Intent | Legalist Word
  *   **Profile:** Answers 1B, 3A, 5A, 10B.
  *   **View:** If the Pilots aren't a racial/ethnic group, if no one died, and if there was no specific order to "destroy," this is not genocide. It might be persecution, but calling it genocide is legally wrong and morally inflationary.
  *   **Coherence:** High. This is the current international law standard.

  ### 2. The Lemkinian (The Reporter's Ideal)
  *   **Coordinates:** Expansive Group | Cultural Act | Knowledge Intent | Prophylactic Word
  *   **Profile:** Answers 1A, 3B, 6B, 10A.
  *   **View:** Lemkin intended to protect the *way of life*, not just the bodies. Dissolving the guild, banning the language, and taking the children is exactly what genocide is. We must say the word now to stop it.
  *   **Coherence:** High. This is the moral/historical expansionist view.

  ### 3. The Constructivist
  *   **Coordinates:** Constructive Group | Cultural Act | Knowledge Intent | Prophylactic Word
  *   **Profile:** Answers 1C, 2A, 4A, 10A.
  *   **View:** The Pilots didn't need to feel like a group before. The state *made* them a group by targeting them. That act of targeting, which destroys their social fabric, is the crime.
  *   **Coherence:** High. Fits your "constructed member" wrinkle perfectly.

  ### 4. The Structuralist
  *   **Coordinates:** Expansive Group | Cultural Act | Structural Mind | Prophylactic Word
  *   **Profile:** Answers 1A, 4A, 7B, 10A.
  *   **View:** You don't need a villain. The tax laws and school policies *are* the genocidaires. A slow bureaucracy can kill a culture just as dead as a firing squad.
  *   **Coherence:** High. Fits the "slow bureaucratic policy" wrinkle.

  ### 5. The Deflationary Skeptic
  *   **Coordinates:** Stable Group | Physical Act | Specific Intent | Deflationary Word
  *   **Profile:** Answers 1B, 3A, 9B, 11A.
  *   **View:** "Genocide" is just a political label for "a lot of murder." It isn't morally distinct. If no one died, it's definitely not genocide. Don't use the word; it distorts the reality.
  *   **Coherence:** High. A cynical but consistent realist position.

  ### 6. The Legal Pragmatist
  *   **Coordinates:** Stable Group | Physical Act | Knowledge Intent | Legalist Word
  *   **Profile:** Answers 1B, 3A, 6B, 10B.
  *   **View:** Morally, maybe this is terrible. Legally, it's not genocide. We should stick to the law so we can actually convict someone. If we stretch the definition, we lose the tool.
  *   **Coherence:** High. Common among defense attorneys or cautious jurists.

  ### 7. The Moral Alarmist
  *   **Coordinates:** Expansive Group | Cultural Act | Reckless Mind | Prophylactic Word
  *   **Profile:** Answers 1A, 4A, 6C, 10A.
  *   **View:** They didn't even have to *know* for sure. They were reckless with the Pilots' existence. That indifference is enough to trigger the alarm. Say the word loud and early.
  *   **Coherence:** High. A radical prevention-focused view.

  ### 8. The "Politicide" Advocate
  *   **Coordinates:** Expansive Group (Social) | Physical Act | Specific Intent | Prophylactic Word
  *   **Profile:** Answers 1A, 3A, 5A, 10A.
  *   **View:** The Pilots are a social/occupational group, so they count. But we still need bodies. If they aren't killing them, it's not genocide, it's "politicide" or "socialicide." We need new words, or we must expand the old one carefully.
  *   **Coherence:** Medium. Often conflated with Lemkinian view, but distinct on the "Act" axis.

  ### 9. The Empty Cell: The Cultural Physicalist
  *   **Coordinates:** Stable Group | **Mixed Act** | Specific Intent | Legalist Word
  *   **Profile:** Answers 1B, **3C/4B**, 5A, 10B.
  *   **View:** "The group must be stable (blood), but destroying the culture is genocide even without killing."
  *   **Status:** **Incoherent.** If you insist the group is only defined by blood/biology (1B), you cannot logically claim that destroying their *culture* (without killing bodies) destroys the *group*. The group (the biological people) still exists. Nobody lives here because the definition of the victim contradicts the definition of the harm.

  ### 10. The Empty Cell: The Early Legalist
  *   **Coordinates:** Stable Group | Physical Act | Specific Intent | **Mixed Word**
  *   **Profile:** Answers 1B, 3A, 5A, **10A & 11A**.
  *   **View:** "We must wait for a court verdict (10B), but we should also use the word early to prevent it (10A)."
  *   **Status:** **Pragmatically Impossible.** You cannot hold that the word is strictly a legal verdict *and* that it should be used as a preventive moral alarm. These functions cancel each other out. Characters who try to hold both are being hypocritical or confused.

  ### 11. The Conflated Leaf: The "It's Just Persecution" Box
  *   **Coordinates:** Stable Group | Cultural Act | Specific Intent | Deflationary Word
  *   **Profile:** Answers 1B, 4A, 5A, 9C/11A.
  *   **View:** This position acknowledges cultural destruction is happening and intended, but refuses the label "genocide," preferring "persecution" or "ethnic cleansing."
  *   **Note:** This often ends up in the same box as the **Convention Purist** (Leaf 1) in terms of *outcome* (no genocide charge), but for a different reason. The Purist says "No cultural destruction counts." This character says "Cultural destruction counts, but not as genocide." For your novel, these are distinct voices: one denies the harm's severity, the other denies the label's applicability.

  ### 12. The Human-Rights Absolutist
  *   **Coordinates:** Constructive Group | Cultural Act | Structural Mind | Moral Alarm
  *   **Profile:** Answers 1C, 4A, 7B, 9A.
  *   **View:** The group is real because they suffer. The harm is real because their culture dies. The perpetrator is real because the system did it. The label is real because the suffering is unique.
  *   **Coherence:** High. This is the most expansive possible view. It maximizes protection but risks making the word apply to almost any oppression.

  ***

  ## How to Use This for Your Characters

  **For the Prosecutor:**
  Check if they are a **Convention Purist (1)** or a **Legal Pragmatist (6)**.
  *   If Purist: They genuinely believe the Reporter is morally wrong to use the word.
  *   If Pragmatist: They might agree with the Reporter morally, but fear losing the legal case. This creates internal conflict.

  **For the Reporter:**
  Check if they are a **Lemkinian (2)** or a **Constructivist (3)**.
  *   If Lemkinian: They believe the Pilots were always a distinct people deserving protection.
  *   If Constructivist: They believe the state *created* the crime by forcing an identity on the boatmen. This is a more radical, philosophical stance.

  **For the Beta Readers:**
  If a reader scores **Leaf 9 (The Empty Cell)**, they have identified a contradiction in their own thinking. This is a great discussion prompt for your newsletter: *"Why do we feel cultural destruction is genocide, but also insist only 'blood' groups count?"*

  **For the "No Killing" Wrinkle:**
  Ensure your characters land on different sides of **Dimension 2 (The Act)**. If both agree that "No bodies = No genocide," you lose the central tension of your book. One must argue that the *dissolution of the guild* is a death, even if the *members* are breathing.

  **For the "Constructed Group" Wrinkle:**
  Use **Question 2**. If your Prosecutor answers 2B ("No, you can't destroy what wasn't there") and your Reporter answers 2A ("Yes, the target makes the group"), you have a fundamental philosophical clash about the nature of identity that goes deeper than the law.
