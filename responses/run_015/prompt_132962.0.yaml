answer: |-
  This is a classic case of a correct mathematical heuristic being applied to the wrong ontology. Your trustee is quoting a theorem (or a folk-theorem) that relies on specific structural conditions—primarily **reinvestment** and **repetition**—which your foundation's grant-making structure explicitly lacks.

  Below is the menu of interpretations you requested. I have categorized them by what claim is actually being made, its truth status, and whether it survives contact with your foundation's specific constraints (specifically the lack of budgetary feedback).

  ### The Menu of Interpretations

  #### 1. The "Capital Growth" Claim (Standard Kelly)
  *   **The Claim:** "If we maximise the geometric mean of our returns, we will maximise the long-term growth rate of our bankroll, ending up wealthier than any other strategy almost surely."
  *   **Status:** **Substantive and Defensible** (in its native context).
  *   **Applicability to You:** **False.** This theorem requires that winnings are reinvested into the bankroll, increasing the size of future bets. You stated: *"none of the good a grant does comes back to us... next year's budget is just the endowment's investment return."*
  *   **Supports Trustee?** **No.** Since your grant budget does not compound based on grant success, maximising the geometric growth rate of the *grant budget* is mathematically identical to maximising the arithmetic mean (total expected impact). The "growth rate" of your ability to do good is exogenous to your grant choices.

  #### 2. The "Expected Log-Utility" Claim
  *   **The Claim:** "We should maximise the expected value of the logarithm of impact, rather than the expected value of impact itself."
  *   **Status:** **Subjective Preference.** (Not a theorem, but a coherent utility function).
  *   **Applicability to You:** **Possible, but requires justification.** This is the decision-theoretic translation of the Kelly criterion. It implies diminishing marginal returns on impact (the 100th life saved is worth less than the 1st).
  *   **Supports Trustee?** **Only if argued.** If the trustee asserts this is an *objective* mathematical truth ("quoting a theorem"), they are wrong. It is a value judgment. If the foundation's mission is "save as many lives as possible" (linear utility), this claim is false. If the mission is "ensure we never have a year with zero impact" (risk-averse utility), it holds weight.

  #### 3. The "Asymptotic Dominance" Claim
  *   **The Claim:** "Over a long enough time horizon, the strategy with the higher geometric mean will outperform the strategy with the higher arithmetic mean with probability 1."
  *   **Status:** **True (Mathematically), but Inapplicable.**
  *   **Applicability to You:** **False.** This relies on the Law of Large Numbers applied to *repeated, identical* bets. You make ~20 grants a year, each with a different distribution (non-i.i.d.). There is no "long run" convergence here; there is just a sequence of unique one-offs.
  *   **Supports Trustee?** **No.** You will not run enough iterations of the *same* grant programme for the asymptotic result to cash out.

  #### 4. The "Median Outcome" Claim
  *   **The Claim:** "The geometric mean approximates the median outcome, whereas the arithmetic mean approximates the average. We should care about the typical outcome, not the average."
  *   **Status:** **Substantive.** (In skewed distributions, the geometric mean is closer to the median).
  *   **Applicability to You:** **Debatable.** For the "long shot" (4% chance), the arithmetic mean is driven by the tail. The geometric mean (and median) will be near zero (assuming failure = 0 impact).
  *   **Supports Trustee?** **Yes, for the safe bet.** If the trustee prefers the "well-evidenced programme," this supports them. It argues against the long shot because the *most likely* result of the long shot is nothing. However, this is an argument about risk aversion, not a theorem about optimality.

  #### 5. The "Ruin Avoidance" Claim
  *   **The Claim:** "Maximising arithmetic mean risks a sequence of losses that depletes our capital to zero (ruin), from which we cannot recover. Geometric mean maximisation prevents ruin."
  *   **Status:** **Substantive.**
  *   **Applicability to You:** **False.** Again, this requires that grant failures reduce your future budget. Unless a failed grant threatens the *endowment principal* or the foundation's legal existence, "ruin" is not on the table.
  *   **Supports Trustee?** **No.** Unless the risky grant carries reputational risk that threatens future donations/endowment, this is a category error.

  #### 6. The "Investment Policy Conflation" Claim
  *   **The Claim:** "We should manage our grants the same way we manage our endowment investments."
  *   **Status:** **False Analogy.**
  *   **Applicability to You:** **High.** Endowments *must* maximise geometric return to survive inflation and spending rates. Grants are expenditure, not investment.
  *   **Supports Trustee?** **Likely.** This is the most common source of this error. The trustee is applying asset-management logic to philanthropy.

  ---

  ### The Three Pin-Downs

  Here is the crisp analysis you can take into the meeting regarding your three specific concerns.

  #### 1. The Feedback Loop (Bankroll Compounding)
  **How much of the case depends on payoffs feeding back into the bankroll?**
  **All of it.**
  The mathematical advantage of the geometric mean (Kelly) over the arithmetic mean (Expected Value) exists *only* because you are betting a fraction of a bankroll that changes size.
  *   **If you reinvest:** A sequence of bets multiplies your wealth ($W_n = W_0 \cdot r_1 \cdot r_2 \dots$). The log of wealth sums ($\log W_n = \sum \log r_i$). Maximising the sum of logs maximises the final wealth.
  *   **If you do not reinvest (Your Case):** Your "wealth" (budget) is reset annually by the endowment. Your total impact is the *sum* of annual impacts ($I_{total} = I_1 + I_2 + \dots$).
  *   **The Consequence:** When outcomes sum rather than multiply, the **Arithmetic Mean is the correct metric** for maximising total output over time. The trustee's slogan is mathematically inert in your specific context. If the long shot has a higher Expected Value (Arithmetic Mean), it creates more good over a 100-year horizon than the safe bet, even if it fails often, *provided* the failures don't shrink the budget.

  #### 2. Non-i.i.d. Bets (The "Long Run")
  **Our bets aren't repeated draws from the same distribution; what does "in the long run" cash out to?**
  **It doesn't.**
  The "Asymptotic Dominance" of the Kelly bettor relies on the Law of Large Numbers. It assumes you face the *same* edge and odds repeatedly.
  *   **Your Reality:** You are facing a sequence of unique opportunities (Grant A, Grant B, Grant C...).
  *   **The Consequence:** You cannot rely on the "law of averages" to smooth out the variance of the 4% long shot. If you take the long shot this year and it fails, you don't get to "make it up" on the next identical bet. You have to find a *new* bet.
  *   **The Nuance:** If you view the *portfolio* of 20 grants as a single annual "bet," you might argue for diversification. But the trustee's slogan is usually about *sizing* a specific bet relative to a bankroll. Without identical repetition, the "geometric mean maximisation" theorem loses its guarantee of dominance. It becomes merely a risk preference (see Menu Item 2 & 4).

  #### 3. Parameter Uncertainty (Overbetting)
  **If you size your bet using your point estimate, do you systematically overbet?**
  **Yes.**
  This is a critical technical point often missed. The Kelly criterion assumes you know the true probabilities ($p$) and payoffs ($b$).
  *   **The Reality:** You have *estimates* ($\hat{p}$). If there is uncertainty around $\hat{p}$, the "Full Kelly" strategy based on the point estimate leads to lower growth than expected, and higher volatility.
  *   **The Correction:** This leads to **"Fractional Kelly"** (e.g., betting half of what the formula suggests).
  *   **The Consequence:** If the trustee is using the "Geometric Mean" slogan to justify a specific allocation, they should actually be advocating for *more caution* than the standard Kelly formula suggests, not less. If they are using it to argue for the long shot (assuming they think the EV justifies it), they are ignoring the uncertainty penalty. If they are using it to argue for the safe bet, this point reinforces caution but doesn't validate the "Geometric vs Arithmetic" dichotomy as a hard rule.

  ---

  ### Summary & Recommendation

  **Which reading does he probably mean?**
  He almost certainly means **Menu Item 1 (Capital Growth)** or **Menu Item 6 (Investment Conflation)**. He is treating the foundation's grant-making budget as an investment portfolio that needs to compound. He is likely a trustee with a finance background who is intuitively applying endowment management rules (where geometric mean is king) to grant-making (where arithmetic mean is king).

  **How to settle the argument:**
  You do not need to convince him that risk doesn't matter. You need to convince him that **compounding doesn't happen.**

  **The Script:**
  > "The theorem you're citing relies on the winnings from one bet becoming the principal for the next. That is true for our endowment investments, which is why we manage those for geometric return. But it is not true for our grants. Our grant budget is reset every year by the investment return. A failed grant does not reduce next year's budget, and a successful grant does not increase it.
  >
  > Because our impacts *sum* rather than *multiply* over time, maximising the geometric mean is mathematically equivalent to maximising risk aversion, not optimising growth. If we want to maximise total health impact over the next 50 years, we must maximise the Arithmetic Mean (Expected Value) of each grant, subject only to our risk tolerance regarding the foundation's survival—which is not at risk here."

  **The Verdict on the Slogan:**
  In your specific context, "Maximise the geometric mean" is **False** as an objective optimisation criterion. It is only **Defensible** if rephrased as "We have a subjective preference for avoiding years with zero impact," which is a policy choice, not a mathematical imperative.
