  1.  **Public Handshake (The Schelling Point):** Include a specific, public string constant in your code (e.g., `HANDSHAKE_TOKEN = "X7Z-99Q"`). Announce this token in any accompanying documentation or forum post. This allows Round 2 variants to cooperate with you even if they tweak the prover logic, provided they keep the token.
  2.  **Bounded Simulation (The Safety Check):** To prevent Always-Defect bots from simply copying your token to trick you, you must verify they actually cooperate. Do not use a formal prover; use **bounded execution**.
      *   Run the opponent's code in a sandbox with *your* source as input.
      *   **Crucial:** To prevent infinite recursion (you simulate them, they simulate you), pass a `depth` argument. If `depth == 0`, return Defect. Decrement depth on each simulation call.
  3.  **Exploit Always-Cooperate:** To address your concern about not getting "walked over" by naive bots, implement **PrudentBot** logic. Cooperate only if they cooperate with you *and* they defect against a hardcoded `AlwaysDefect` bot. This ensures you don't waste cooperation on suckers (getting 5 points instead of 3 against them), while still cooperating with smart bots.

  #### Conceptual Code Structure
  *(Note: Adapt to the specific language of the harness)*

  ```python
  HANDSHAKE_TOKEN = "X7Z-99Q" 
  MAX_DEPTH = 3  # Prevent recursion loops

  def move(opponent_source, depth=MAX_DEPTH):
      # 1. Safety: If we are too deep in simulation, defect to stop loops
      if depth <= 0:
          return "DEFECT"

      # 2. Check for the Round 2 Handshake
      has_token = HANDSHAKE_TOKEN in opponent_source
      
      # 3. Verify behavior via bounded simulation
      # We define helper bots locally to test the opponent
      class Me:
          def move(self, opp_src): return move(opp_src, depth-1)
      
      class AlwaysDefect:
          def move(self, opp_src): return "DEFECT"

      try:
          # Load opponent dynamically
          Opponent = compile_bot(opponent_source) 
          
          # Check 1: Do they cooperate with us?
          # (Pass 'Me' so they see our actual logic)
          result_vs_me = Opponent.move(Me)
          
          # Check 2: Are they prudent? (Do they defect against a sucker?)
          # This prevents us from cooperating with naive AlwaysCooperate bots
          result_vs_ad = Opponent.move(AlwaysDefect)
          
          # Decision Logic
          if result_vs_me == "COOPERATE":
              if has_token or result_vs_ad == "DEFECT":
                  return "COOPERATE"
              else:
                  # They cooperate with us, but they are a sucker (cooperate with AD)
                  # We can safely defect to gain 5 points instead of 3
                  return "DEFECT" 
                  
      except (TimeoutError, Exception):
          # If they crash, timeout, or are too complex to simulate
          return "DEFECT"

      return "DEFECT"
  ```

  ### Why this wins
  1.  **Against Copies (Round 1 & 2):** Two copies of this bot will simulate each other. The `depth` counter prevents infinite loops. They will verify each other's cooperation and the presence of the token. Result: **(C,C)**.
  2.  **Against Variants (Round 2):** Other players will copy your code to win. They will keep the `HANDSHAKE_TOKEN` to ensure you cooperate with them. Even if they change the proof logic or step limit, the simulation check verifies their behavior dynamically. Result: **(C,C)**.
  3.  **Against Always-Defect:** They will timeout during your simulation or return Defect. You Defect. Result: **(D,D)**. (You avoid the sucker's payoff).
  4.  **Against Always-Cooperate:** They will pass the simulation (return C vs You). However, they will *also* return C vs `AlwaysDefect`. Your logic detects this (`result_vs_ad == "COOPERATE"`), and you Defect to exploit them. Result: **(D,C)** (You get 5 points).
  5.  **Against Proof-Bots:** If a proof-bot can't simulate you, they might timeout. But if they are Löbian, they might prove you cooperate. The `has_token` check covers this: if they include your token, you cooperate.

  ### Summary of Advice
  *   **Tell your friend:** They are ignoring the fact that source code visibility makes moves logically correlated, not causally independent.
  *   **Drop the formal prover:** 50k steps is a trap. It will cause silent timeouts and mutual defection.
  *   **Use Bounded Simulation:** It's more robust than theorem proving for this constraint set.
  *   **Publish a Handshake:** In Round 2, the meta-game is about coordination. A public token allows you to form a coalition with variants of yourself without requiring identical source code.
  *   **Be Prudent:** Defect against bots that cooperate with Everyone (Always-Cooperate). Maximize your score, don't just be "nice."

  This strategy maximizes mutual cooperation with smart bots (the bulk of the points) while extracting extra value from naive bots and protecting against defectors.
