answer: |-
  You have identified a genuine methodological crux in cross-cultural moral psychology and meta-ethics, but there is no single established term that captures the *sorting mechanism itself* as a unified problem. The literature fragments this issue across several domains, which is why you feel the lack of a specific label.

  Here is how the existing concepts map onto your four boxes, where they fail to capture your specific insight, and a coined term to tighten the boundaries.

  ### The Near-Fits and Their Gaps

  1.  **Fundamental vs. Non-Fundamental Disagreement (Meta-Ethics):**
      *   **Fit:** This is the standard philosophical distinction between your (a) and (c). If the disagreement persists even when all non-moral facts are agreed upon, it is "fundamental" (supporting relativism/error theory). If it vanishes when facts are aligned, it is "non-fundamental" (supporting universalism).
      *   **Gap:** This binary collapses your (b), (c), and (d). It treats (b) as a semantic error and (d) as a substantive moral difference, but it doesn't account for the *strategic choice* researchers make in classifying them. It also struggles with your point about "morally loaded facts" in (c), because if the "facts" are thick concepts (e.g., "harm"), agreeing on the facts *just is* agreeing on the morality.

  2.  **Construct Validity / Equivalence (Psychology):**
      *   **Fit:** This covers your (b). When researchers argue that the Ultimatum Game doesn't measure "fairness" in a small-scale society but rather "gift-giving obligation," they are questioning construct equivalence.
      *   **Gap:** This is technical and method-specific. It doesn't cover (a) or (d), and it doesn't carry the meta-ethical weight of the objectivity debate.

  3.  **The Principle of Charity (Philosophy of Language):**
      *   **Fit:** This governs the *motivation* for the sorting. To maximize charity (assume rationality), you push findings toward (b) or (c). To maximize the "exotic" nature of the data (or support relativism), you push toward (a).
      *   **Gap:** "Charity" is the *principle* guiding the sort, not the name of the *sort* itself.

  4.  **Moral Standing / Moral Circle (Ethics):**
      *   **Fit:** This covers your (d). Disagreements about whether ancestors or animals count as patients are disagreements about the *scope* of morality.
      *   **Gap:** This is treated as a substantive moral difference (a subset of (a)), not a distinct category of interpretive sorting that might dissolve the disagreement.

  ### The Missing Concept

  The phenomenon you are describing is the **underdetermined methodological act of assigning the source of divergence**. The problem isn't just that the categories exist, but that the *evidence rarely forces a researcher into one box*, yet the *choice of box dictates the conclusion* about moral objectivity.

  Because this specific meta-methodological problem lacks a standard label, I propose the following term.

  ### Coined Term: **Disagreement Locus Attribution**

  **Definition:** The methodological act of assigning a observed cross-cultural behavioral or verbal divergence to a specific causal or semantic category (the "locus"), where the assignment is underdetermined by the data but determines the meta-ethical conclusion.

  **The Four Loci:**
  1.  **Substantive Locus (your a):** The agents share concepts and facts but differ in moral valuation. *Implication: Moral Relativism / Anti-Realism.*
  2.  **Semantic Locus (your b):** The agents are using non-equivalent concepts or translation has failed. *Implication: No disagreement exists (Talk-past).*
  3.  **Informational Locus (your c):** The agents share values but differ on non-moral facts (including thick concepts). *Implication: Moral Universalism (Rational convergence possible).*
  4.  **Scope Locus (your d):** The agents agree on values but disagree on which entities fall under the protection of those values. *Implication: Ambiguous (can be framed as Substantive or Informational depending on whether moral status is viewed as a fact or a value).*

  **Boundary Conditions:**
  *   **Morally Loaded Facts (Your point on c):** *Disagreement Locus Attribution* flags this as a **Thick Concept Entanglement**. If the "fact" is "the ancestor was insulted," and "insult" implies "wronged," you cannot cleanly separate the Informational Locus from the Substantive Locus. A rigorous attribution must acknowledge that moving this case from (c) to (a) is a theoretical choice, not an empirical finding.
  *   **The Moral Community (Your point on d):** Standard frameworks treat this as Substantive. *Disagreement Locus Attribution* treats it as a distinct category because it can be re-framed as Informational (e.g., "They believe ancestors are alive" -> fix the fact -> they agree we don't owe duties to inanimate objects). Recognizing (d) as its own locus prevents researchers from hiding scope disagreements inside substantive disagreements to force a relativist conclusion.

  **Usage:** "The study's conclusion depends entirely on the researchers' **Disagreement Locus Attribution**; had they classified the divergence as Scope rather than Substantive, the argument for relativism would collapse."

