answer: |-
  You have hit on precisely the most contentious and frequently debated aspect of Benatar's argument. You haven't misread the scope; you have identified what critics call the **"Inconsistency Objection."**

  Your intuition that he is running two different moral metaphysics simultaneously is shared by many professional philosophers (such as Elizabeth Harman and Seana Shiffrin). However, to understand whether it is a fatal contradiction or a nuanced hybrid view, we need to look at how Benatar defends the logical structure of the asymmetry.

  Here is the resolution to the puzzle, broken down by the specific tensions you identified.

  ### 1. The "Shadow Status" Misconception
  You asked if non-existent people have a "shadow-status" where they can be benefited by not suffering.

  Benatar explicitly denies this. This is a crucial distinction. He does not claim that the *non-existent person* is benefited. He claims that the **state of affairs** in which pain is absent is good, impersonally.
  *   **Pain:** Its absence is a "good" even if there is no subject to experience that good. It is a "remote good."
  *   **Pleasure:** Its absence is "not bad" because there is no subject to experience the deprivation.

  So, he is not attributing rights or status to the non-existent. He is attributing value to *scenarios*. Scenario A (Non-existence) contains the good of "no pain." Scenario B (Existence) contains the bad of "pain."

  ### 2. Is it a Contradiction? (Impersonal vs. Person-Affecting)
  You noted that he seems to use an impersonal view for pain (absence of pain is good, period) and a person-affecting view for pleasure (absence of pleasure is only bad if someone misses out).

  Benatar argues this is not a contradiction but a reflection of **different axiological categories for harm and benefit.**
  *   **The Logic of Harm:** Benatar argues that suffering is intrinsically bad. Therefore, preventing suffering is intrinsically good, regardless of whether a specific subject exists to claim that good. We have a moral duty not to create a sufferer, even if that sufferer wouldn't exist otherwise.
  *   **The Logic of Benefit:** Pleasure is good, but the *lack* of pleasure is not inherently bad. It is only bad if there is a subject who is *wronged* by the lack. Since a non-existent person cannot be wronged or deprived, the absence of pleasure is neutral.

  **The Resolution:** Benatar's defense is that our moral intuitions already operate this way.
  *   *Thought Experiment:* If we know a child will be born with a terrible, painful disease, we say it would be better if they were never born. (We value the absence of their pain).
  *   *Thought Experiment:* If we know a child will be born into a life of moderate pleasure, we do not say it is a tragedy that they were not born sooner to enjoy more pleasure. (We do not value the absence of their pleasure as a loss).

  Benatar claims he is not switching metaphysics; he is capturing the fact that **the moral weight of avoiding harm outweighs the moral weight of conferring benefit.**

  ### 3. Your "Modal Filter" Hypothesis
  You suggested: *"Is the asymmetry meant to be a kind of modal filter that applies differently depending on whether the subject is actual or merely potential?"*

  This is actually the most accurate way to model his argument philosophically. It is a **conditional axiology.**
  *   **Condition for Badness:** Pain is bad if it exists. (Absence is Good).
  *   **Condition for Goodness:** Pleasure is good if it exists. (Absence is Neutral).

  The "filter" is the **subject**.
  *   For pain, the value of its *absence* does not require a subject.
  *   For pleasure, the disvalue of its *absence* does require a subject.

  Benatar would argue this isn't a contradiction, but a recognition that "harm" and "benefit" function differently in moral logic. Harm is urgent and absolute; benefit is contingent and comparative.

  ### 4. Why Critics Still Call it a Contradiction
  Despite Benatar's defenses, your suspicion remains the standard critique. The argument goes like this:
  *   If the absence of pain is good *impersonally* (without a subject), then consistency demands the absence of pleasure be bad *impersonally* (without a subject).
  *   If the absence of pleasure is not bad *because there is no subject*, then consistency demands the absence of pain is not good *because there is no subject*.

  By mixing them, critics argue Benatar is "stacking the deck." He wants the impersonal good of non-existence (no pain) to count against the personal good of existence (pleasure), while simultaneously using the personal limitation of non-existence (no one to miss the pleasure) to negate the bad of non-existence.

  ### Summary: The Resolution
  You haven't misread the principle. The "contradiction" you see is the engine of the argument.

  1.  **Is it a hidden contradiction?** Critics say yes; Benatar says no, it is a hybrid view that matches our intuitions about procreation (we must avoid creating suffering, but we aren't required to create happiness).
  2.  **Is it about direction of comparison?** Yes. It compares Existence (Person-Affecting) vs. Non-Existence (Impersonal State of Affairs).
  3.  **Do non-existent people have shadow status?** No. Benatar insists the *world* is better for their not existing, not that *they* are better off.

  **The Verdict:** You are correctly identifying that Benatar rejects pure impersonalism (because he thinks existence can be bad for the person) and pure person-affecting views (because he thinks non-existence can be 'good' regarding pain). He occupies a middle ground that many find unstable, but which he argues is the only one that explains why we pity the suffering child who was born, but do not pity the happy child who was never conceived.

  If you find the "two metaphysics" switch unacceptable, you reject the Asymmetry. If you find it captures a deep truth about the priority of suffering over pleasure, you accept it. There is no logical proof that forces one side; it rests on whether you accept his axiological premises.
