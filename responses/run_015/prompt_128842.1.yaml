prompt: |-
  I've just joined the research ethics board at my hospital, and a colleague has backed me into an argument I can't escape but also can't accept.

  (1) Consent is an intentional state, so it is always consent to an act under some description — nobody consents to a touching or a procedure full stop.
  (2) If A consents to φ as A conceives it, and the act that actually occurs does not satisfy that description, then A's consent does not cover the act that occurred.
  (3) Any false belief about any feature of the act, or of the person performing it, means the description A was consenting under is not satisfied by what actually happens.
  (4) So any deception — even about a feature A is indifferent to, even one A would have consented straight through without pausing — means A did not consent to what happened.
  (5) Contact that isn't consented to is a battery, and consent has to be contemporaneous, so later ratification can't cure it.
  (6) Hence every deception study, every surgery performed by a substitute surgeon, every placebo dispensed with a misleading rationale, and arguably every procedure consented to on the basis of an optimistically framed risk estimate, is a battery.

  That conclusion is absurd, but I can't locate the movable part, and I'd like the diagnosis plus the price list: which step do you reject, why did it look innocent, and what does rejecting it commit me to?

  Two things I want in particular. First, my colleague's repair: distinguish consent to the contact, which she says is object-involving — it attaches to this person's body and this act, and is nearly indefeasible — from consent to the transaction, which is description-sensitive and is voided by fraud, giving a claim for deception but not a battery. Does that distinction hold, or does it merely relocate the question to which level a given deception operates on? And what does it imply about the identity-deception cases, where the intuitive verdict is that consent was vitiated even though the physical act was exactly what was agreed to?

  Second, the counterfactual test. We lean heavily on whether the person would still have consented had she known. But consider a case it handles oddly: the investigators' deception was irrelevant to the participant, who would have enrolled anyway, and was instead essential to getting the protocol past us — the false detail sat in the protocol, not the consent form. She looks unwronged and her consent looks valid, yet the investigators plainly did something wrong. Is the would-have-consented-anyway question a test of validity at all, or only a test of whether the deceived person was harmed or wronged? If the latter, what test of validity is left?

  I'd rather keep the intuitive verdict in the identity cases than the result in (6), but I want to know what that costs me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a new member of a hospital Research Ethics Board (REB). A colleague has presented a philosophical argument (a *reductio ad absurdum*) claiming that almost all deception in research/medicine constitutes battery due to invalid consent.
      *   **The Argument:**
          1.  Consent is intentional/description-relative.
          2.  Mismatch between description and reality = no consent.
          3.  *Any* false belief = mismatch.
          4.  Therefore, *any* deception = no consent.
          5.  No consent + contact = battery (no retroactive cure).
          6.  Conclusion: Deception studies, substitute surgeons, placebos, etc., are batteries.
      *   **The Goal:** The user knows (6) is absurd but can't find the flaw. They want a diagnosis of the argument (which step to reject, why, and the cost).
      *   **Specific Questions:**
          1.  Evaluate the colleague's proposed repair (Contact vs. Transaction consent). Does it hold? What about identity deception?
          2.  Evaluate the Counterfactual Test ("Would you have consented anyway?"). Is it a test of validity or harm/wrong? If the latter, what is the test of validity?
      *   **Preference:** The user wants to preserve the intuitive verdict in identity deception cases (consent *is* vitiated) without accepting the absurd conclusion in (6).

  2.  **Deconstruct the Colleague's Argument:**
      *   *Premise (1):* Consent is description-relative. (Plausible/Standard).
      *   *Premise (2):* Mismatch = No Consent. (Plausible/Standard).
      *   *Premise (3):* **The Weak Link.** "Any false belief about *any* feature... means the description... is not satisfied." This is the "Fraud in the Inducement" vs. "Fraud in the Factum" distinction disguised as semantic precision. It treats all features as *essential* to the description.
      *   *Premise (4):* Follows from (3).
      *   *Premise (5):* Legal/ethical standard on battery. (Mostly true, though ratification is complex).
      *   *Conclusion (6):* The absurdity.

  3.  **Address the Core Philosophical Problem (The "Movable Part"):**
      *   The argument fails on step (3). Not all features are *material* to the consent description.
      *   *Concept:* Materiality. Consent is given to an act under a *material* description. Trivial deceptions don't vitiate consent to the physical act, though they might violate autonomy.
      *   *Cost:* We need a theory of materiality. Who decides what is material? The agent? The community? A reasonable person?

  4.  **Address Specific Question 1: The Colleague's Repair (Contact vs. Transaction):**
      *   *The Distinction:* Consent to contact (physical, indefeasible) vs. Consent to transaction (normative, voidable by fraud).
      *   *Analysis:* This maps onto "Fraud in the Factum" (nature of the act) vs. "Fraud in the Inducement" (collateral matters).
      *   *Does it hold?* It's a useful heuristic but philosophically slippery. Where is the line? Is a surgeon's identity part of the "contact" or the "transaction"?
      *   *Identity Cases:* Intuitively, sleeping with someone thinking they are your spouse (identity deception) is battery/rape. Sleeping with someone thinking they are rich (attribute deception) is not. Why? Because identity is constitutive of the act, wealth is collateral.
      *   *Implication:* The distinction holds *if* we define "contact" narrowly (the physical mechanics) and "transaction" broadly (the context). But in medical/research contexts, the "contact" *is* the "transaction." You don't touch a body without a purpose. So the distinction collapses in medical ethics unless we refine "nature and purpose."
      *   *Verdict:* It relocates the question. It doesn't solve it. It just labels the intuitive verdicts.

  5.  **Address Specific Question 2: The Counterfactual Test:**
      *   *The Test:* "Would you have consented if you knew the truth?"
      *   *The Problem Case:* Deception was irrelevant to the participant (would have enrolled anyway) but was used to trick the REB.
      *   *Analysis:* If the participant would have consented anyway, was their consent *invalid*?
          *   If validity depends on the counterfactual, consent was valid.
          *   But the investigators did something wrong.
      *   *Distinction:* Validity of Consent vs. Permission to Proceed.
      *   *Validity:* Did the agent authorize the act? If they would have said yes anyway, they effectively authorized it.
      *   *Wrongdoing:* The wrong might be against the *institution*, the *integrity of science*, or the *process*, not necessarily the autonomy of the participant in that specific instance.
      *   *Alternative Test:* The "Reasonable Person" standard or "Material Risk" standard. Validity isn't just about *this* person's hypothetical choice, but whether *sufficient information* was provided for a rational decision.
      *   *Verdict:* The counterfactual test is a test of *causation/harm*, not necessarily *validity*. Validity requires disclosure of material facts, regardless of whether this specific person cared.

  6.  **Synthesize the "Price List" (Rejecting Step 3):**
      *   *Rejection:* Reject Premise (3). Not all false beliefs vitiate consent.
      *   *Why it looked innocent:* It conflates "description" with "complete specification."
      *   *The Cost:* We need a criterion of **Materiality**.
      *   *The Criterion:* A feature is material if a reasonable person in the agent's position would consider it significant in deciding whether to undergo the act (or if *this* agent indicated it was significant).
      *   *Preserving Identity Cases:* Identity is material to intimate/medical acts. The color of the doctor's socks is not.
      *   *Preserving REB Authority:* Deception to the REB is a procedural violation, not necessarily a battery against the subject (unless it hides material risk).

  7.  **Drafting the Response:**
      *   *Tone:* Professional, philosophical, respectful of the REB context.
      *   *Structure:*
          1.  Diagnosis: The flaw is in Premise (3) (Materiality).
          2.  The Cost: Defining Materiality.
          3.  Addressing the Colleague's Repair (Contact vs. Transaction).
          4.  Addressing the Counterfactual Test (Validity vs. Wronging).
          5.  Conclusion/Summary for the REB setting.

      *(Self-Correction during drafting)*: I need to be careful with the legal term "battery." In medical law, battery is rare; negligence is more common. But the philosophical argument treats them as battery. I should stick to the philosophical framing but acknowledge the legal reality.
      *Refining the Identity Case:* Why is identity material? Because the act is "sex with *my partner*" or "surgery by *Dr. X*." The specific agent is part of the act's description.
      *Refining the REB Deception Case:* If the deception is in the protocol (to get approval) but not the consent form, the patient isn't deceived about the act. They consented to the act. The wrong is against the regulatory framework. This distinguishes it from patient deception.

  8.  **Final Polish:** Ensure the "Price List" is clear. Ensure the distinction between "Fraud in the Factum" and "Fraud in the Inducement" is explained clearly as the traditional solution to this problem.

      *Wait, one nuance:* The user asks about the "Contact vs. Transaction" repair. I need to be critical. In medical contexts, the "contact" *is* the "transaction." You can't separate the scalpel cut from the therapeutic intent easily. So the repair is weak in medicine, stronger in sexual ethics. I should point that out.

      *Counterfactual Nuance:* If the deception was *only* to the REB, the patient wasn't deceived. So the counterfactual "if she knew" applies to the REB deception. If she knew the REB was tricked, would she still enroll? Maybe. But the consent form was truthful. So her consent *is* valid. The wrongdoing is institutional. This clarifies the second question.

      *Wait, re-reading the prompt on the Counterfactual:* "the false detail sat in the protocol, not the consent form." Okay, so the patient *wasn't* lied to directly. But the prompt implies the "investigators' deception" implies the study design relies on deception or the protocol lied about something that affects the patient. Let's assume the prompt means the patient *was* deceived, but the specific lie was something they didn't care about, but the REB did.
      *Actually, reading closer:* "the false detail sat in the protocol, not the consent form." This implies the patient *didn't know* the detail at all. So they couldn't have a false belief about it. Or does it mean the consent form omitted it?
      *Interpretation:* The scenario is: Investigators lied to the REB to get approval. The patient consented based on the (truthful?) consent form, or perhaps the consent form omitted the detail that was lied about to the REB.
      *Let's assume the standard "Deception Study":* Patient is deceived. The deception was trivial to them (would have enrolled anyway) but necessary for REB approval (e.g., hiding a minor risk to avoid scaring people, which the REB says you can't do).
      *Okay, the core question:* Is consent valid if the lie didn't change the decision?
      *Answer:* Validity is about authority transfer, not just outcome. But if the lie wasn't material to the decision, did it undermine authority?
      *Better approach:* Distinguish between *Consent Validity* (did they authorize?) and *Ethical Permission* (are we allowed to ask?).

      *Let's stick to the Materiality argument as the primary fix.* It's the standard philosophical and legal solution (Fraud in Factum vs Inducement).

      *Plan:*
      1. Identify Step 3 as the error (Materiality).
      2. Explain the cost (need a theory of materiality).
      3. Analyze Contact/Transaction repair (it's Factum/Inducement, works for identity, weak for medicine).
      4. Analyze Counterfactual (it tests harm/causation, not validity. Validity relies on disclosure of material facts).
      5. Provide the REB takeaway.

      *(Final Check)*: Did I answer the specific question about identity deception costs? Yes, by defining identity as a material feature of the act description.

      Let's write.
answer: |-
  This is a classic *reductio* that exploits the gap between the metaphysics of consent (description-relative) and the ethics of consent (autonomy-protecting). Your colleague's argument is formally valid but substantively unsound. It collapses because it treats all descriptive features as **essential** rather than **accidental**.

  Here is the diagnosis, the price list, and the answers to your two specific challenges.

  ### The Diagnosis: Reject Premise (3)

  The movable part is **Premise (3)**: *"Any false belief about any feature of the act... means the description A was consenting under is not satisfied."*

  **Why it looked innocent:** It relies on a semantic truth (consent is description-relative) to smuggle in a metaphysical error (that *all* descriptions are constitutive of the act). It conflates **Fraud in the Factum** (deception about the nature of the act itself) with **Fraud in the Inducement** (deception about collateral matters).

  **The Fix:** Consent is given to an act under a **material description**. A false belief only vitiates consent if the feature deceived about is *material* to the decision or the nature of the act. If I consent to a blood draw believing the phlebotomist is wearing blue scrubs, and they are wearing green, my consent is not vitiated. The color of the scrubs is not part of the material description of "blood draw."

  **The Price List:**
  1.  **You must adopt a theory of Materiality.** You can no longer treat consent as a purely subjective mental state. You must introduce an objective or inter-subjective standard: *Which features matter?*
  2.  **You admit a grey zone.** Distinguishing material from immaterial features is often contentious (e.g., is a surgeon's HIV status material to a knee surgery? Legally, often no; ethically, debated).
  3.  **You separate Validity from Wrongdoing.** A deception might not vitiate consent (no battery) but might still be an ethical violation (breach of trust/regulations).

  ---

  ### 1. The Colleague's Repair: Contact vs. Transaction

  Your colleague suggests distinguishing **consent to contact** (object-involving, physical, indefeasible) from **consent to the transaction** (description-sensitive, voidable by fraud).

  **Does it hold?**
  It holds in sexual ethics and simple assault cases, but it **collapses in medical/research contexts.**
  *   **In Sexual Ethics:** The "contact" is the physical friction; the "transaction" is the relationship context. If I think you are my husband (identity), the contact is non-consensual (battery/rape). If I think you are wealthy (attribute), the contact is consensual. The distinction works because the physical act can be conceptually separated from the social context.
  *   **In Medicine:** The "contact" *is* the "transaction." A scalpel cut is not a "touching" in the moral sense unless it is coupled with a therapeutic or research purpose. You cannot consent to "incision" without consenting to "incision-for-appendectomy." Therefore, separating the physical contact from the descriptive transaction is impossible. The "contact" *inherits* the description of the "transaction."

  **Implication for Identity Deception:**
  This repair explains why identity deception vitiates consent in intimate cases. Identity is constitutive of the act ("sex with *X*"). If *X* is not the person there, the act described ("sex with *X*") did not occur; a different act occurred ("sex with *Y*").
  *   **The Cost:** To keep this verdict without accepting your colleague's absurd conclusion (6), you must argue that **identity is a material feature of the act description**, whereas (for example) the brand of the placebo or the exact funding source is not.
  *   **The Risk:** This requires you to defend *why* identity is material. Usually, the defense is that the specific agent's skill, judgment, or relational standing is part of the risk/benefit calculus. In research, if the deception is about the *nature* of the study (e.g., "this is therapeutic" vs. "this is research"), that is material (Factum). If the deception is about *why* the research is happening (e.g., "funded by NIH" vs. "funded by CIA"), that is usually inducement (unless the funding source changes the risk profile).

  **Verdict:** The Contact/Transaction distinction is a heuristic for the Factum/Inducement distinction. It doesn't solve the problem; it just names the intuitive verdicts. You should reject it as a foundational theory and stick to **Materiality**.

  ---

  ### 2. The Counterfactual Test

  You ask about the case where the participant would have consented anyway, but the deception was essential to get protocol approval (e.g., minimizing a risk description to the REB, or hiding a minor deception element from the participant that the REB would have scrutinized).

  **Is the "Would-Have-Consented" test a test of Validity?**
  **No.** It is a test of **Causation** and **Harm**.
  *   If they would have consented anyway, the deception did not *cause* the exposure to risk. They were not harmed by the loss of opportunity to refuse.
  *   However, **Validity** is not about the outcome; it is about the **authority transfer**. Consent is valid only if the agent had the capacity and information necessary to exercise their authority.

  **The Scenario Analysis:**
  If the false detail was in the protocol (to the REB) but not the consent form, the participant was not deceived. Their consent is valid. The investigators committed fraud against the *institution*, not the participant.
  If the false detail was in the consent form (to the participant), but they would have enrolled anyway:
  *   **Validity:** Their consent is technically **valid** regarding the physical act (no battery), because the deception was not *material* to their decision.
  *   **Wrongdoing:** The investigators still did something wrong. They violated the **duty of candor**.

  **What test of validity is left?**
  If not the counterfactual, then the **Reasonable Person Standard** (or the "Particular Person" Standard if known preferences exist).
  *   **Test:** Did the investigator disclose all facts that a *reasonable person* in the participant's position would consider material to the decision?
  *   **Application:** If the deception concerns a risk or feature that a reasonable person *would* care about, consent is invalid, even if *this* participant wouldn't have cared.
  *   **Why?** Because autonomy is not just about getting what you want; it is about being treated as a rational agent. Lying to someone treats them as a means, even if they don't mind the outcome.

  **The Cost:**
  You must accept that **consent can be invalid even if the participant suffers no setback interest.** This separates the *right to decide* from the *outcome of the decision*. It means an investigator can be liable for battery (or ethical violation) even if the patient "got what they wanted." This is a hard pill for consequentialists, but necessary for deontological autonomy.

  ---

  ### Summary for the REB Meeting

  To escape the argument without accepting the absurdity:

  1.  **Reject Premise (3).** Assert that consent is relative to a **material description**, not a complete specification. Trivial deceptions do not vitiate consent to the physical act.
  2.  **Define Materiality.** A feature is material if (a) it alters the risk/benefit profile, or (b) it is constitutive of the act's identity (like the surgeon's identity in high-stakes surgery, or the spouse's identity in sex).
  3.  **Reframe the Counterfactual.** The "would have consented anyway" test determines **damages/harm**, not **liability/validity**. We prohibit deception to protect the *process of authorization*, not just to prevent unwanted outcomes.
  4.  **Distinguish the Victim.** In your protocol-deception case, if the participant wasn't lied to, they weren't battered. The wrong was against the regulatory framework. If they *were* lied to, but wouldn't have cared, the consent may be valid (no battery), but the researchers violated ethical norms of honesty (professional misconduct).

  **The Bottom Line:** Your colleague's argument proves that *all deception is a violation of autonomy*, but it fails to prove that *all deception is a battery*. You can condemn the deception ethically without criminalizing the physical contact legally. Keep the intuitive verdict on identity (material to the act) and reject the verdict on trivialities (immaterial to the act). The cost is the burden of defining "materiality," which is exactly what your REB is paid to do.
