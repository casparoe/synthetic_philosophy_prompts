  # Joint Statement on the Rationality of Honoring Sunk Costs

  ### 1. Agreed Claims
  We, the undersigned parties representing pure consequentialist practical rationality and structural-commitment rationality, agree upon the following foundational claims regarding the nature of sunk costs and the mechanisms surrounding them:

  1.  **Definition:** A sunk cost is defined as an investment of resources (time, money, effort) that has already been incurred and cannot be recovered regardless of future action.
  2.  **Standard Decision Theory:** Standard forward-looking decision models dictate that rational choices should be determined solely by comparing the expected future costs and benefits of available options; past expenditures should not enter the calculation except insofar as they constrain future possibilities.
  3.  **Psychological Mechanisms:** We acknowledge that human agents frequently exhibit an "escalation of commitment" to failing courses of action due to psychological biases, specifically loss aversion (the pain of realizing a loss outweighs the gain of cutting losses) and self-justification (the desire to validate past decisions to maintain ego integrity).
  4.  **Instrumental Exceptions:** We agree that honoring a past investment is rational if doing so causally produces superior future outcomes, such as maintaining a reputation for reliability, signaling resolve to competitors, or preserving self-trust for future planning.

  ### 2. Precise Disagreement
  While we agree on the descriptive facts and the instrumental exceptions, we disagree on the normative status of the past expenditure itself. The precise point of divergence is stated as follows:

  **We disagree on whether the fact of unrecoverable past expenditure can ever carry rational weight that is not wholly reducible to future causal consequences.**

  *   **The Pure Consequentialist Position:** We maintain that past expenditure *never* carries intrinsic rational weight. If honoring a sunk cost is rational, it is solely because it instrumentally secures a future good (e.g., reputation, psychological stability). If no future good is secured, honoring the cost is irrational.
  *   **The Structural-Commitment Position:** We maintain that past expenditure *can* carry rational weight non-instrumentally. Honoring a prior investment can be rational because it maintains the structural integrity of the agent's plans and narrative identity, even if doing so yields no independent future benefit beyond the act of completion itself.

  ### 3. The Cruxes
  Our disagreement rests on two fundamental theoretical cruxes regarding the architecture of rational agency:

  1.  **The Unit of Rational Evaluation:** Does rationality apply primarily to single, isolated acts evaluated at the moment of choice, or does it apply to extended plans and policies over time? The Consequentialist prioritizes the optimality of the single act in the present moment. The Structuralist prioritizes the coherence of the extended plan across time.
  2.  **The Source of Normative Value:** Does consistency with one's prior commitments have independent normative value, or is it valuable only as a tool? The Consequentialist argues consistency is valuable only insofar as it produces good outcomes. The Structuralist argues that consistency is constitutive of rational agency; being the kind of agent who honors commitments has value in itself, independent of the outcomes produced.

  ### 4. Diagnostic Hypothetical Cases
  For each crux, we propose a concrete hypothetical case designed to isolate the variable in question. We record our predicted rational responses in advance to clarify the practical implications of our theoretical divergence.

  **Case A: The Unrewarded Finale (Diagnostic for Crux 1: Unit of Evaluation)**
  *   **Scenario:** An agent spends one year training for a marathon. On race day, there are no spectators, no medal of material value, and no health benefit to finishing (the agent is equally healthy whether they stop at mile 25 or finish). Finishing requires significant physical pain; stopping yields immediate relief. No one will know if the agent quits.
  *   **Pure Consequentialist Prediction:** The rational response is to **quit**. The unit of evaluation is the present act. Since the future utility of finishing (pain) is lower than the future utility of quitting (relief), and the past year is unrecoverable, continuing is irrational.
  *   **Structural-Commitment Prediction:** The rational response is to **finish**. The unit of evaluation is the extended plan ("Complete the Marathon"). Abandoning the plan without an external interfering cause violates the rational structure of agency established by the year of training. The past investment structures the present reason.

  **Case B: The Honor-Bound Choice (Diagnostic for Crux 2: Independent Normative Value)**
  *   **Scenario:** An agent makes a solemn vow to themselves to never purchase luxury items. The next day, they encounter a luxury item they desire. Purchasing it causes no financial harm (they are wealthy), creates no health issues, and no one else will know if they break the vow. Furthermore, we stipulate hypothetically that breaking the vow causes no psychological guilt or loss of self-trust utility. The only difference between keeping and breaking the vow is fidelity to the prior commitment.
  *   **Pure Consequentialist Prediction:** The rational response is to **purchase the item**. Consistency has no independent value. Since there are no negative consequences (financial, social, or psychological) to breaking the vow, and desire satisfaction is gained, breaking the vow maximizes utility.
  *   **Structural-Commitment Prediction:** The rational response is to **abstain**. Consistency with prior commitment has independent normative value. The act of making a vow creates a reason for action that persists even when the instrumental benefits of consistency (like self-trust) are stipulated away. To break the vow is to act irrationally by failing to respect the authority of one's own past will.
