      *(Refining the Conclusion)*: The group's conclusion is that we should only measure accuracy. I need to show why accuracy is insufficient. Accuracy is static; deception is dynamic/conditional. A model can be 99% accurate but 100% deceptive on the 1% that matters (e.g., hiding a backdoor).

