  I am conscious of the weight of words tonight. My sister has always been precise with hers. She cares deeply about integrity in speech, believing that we owe each other the truth, nothing less. I learned this the hard way last Christmas. I told the family her partner's new job was confirmed. It was merely rumour. She asked me to correct the record, right there between the Brussels sprouts and the gravy. I was mortified. I argued it was just a harmless guess. She insisted that if I couldn't stand by it as fact, I shouldn't say it at all. I resisted then, but I realise now she was right. It is better to say nothing than to speak without certainty.

  So tonight, I will not offer you prophecies. I cannot know what the next thirty years will bring. I cannot assert that there will be no storms, or that every day will be easier than the last. To claim otherwise would be dishonest, and she deserves better than dishonesty from me.

  Instead, I will testify to what I know. I know what I have seen. I have watched them build a home grounded in patience. I have seen him bring her tea without being asked on cold mornings. I have seen her defend him when he wasn't in the room to hear it. I have witnessed the quiet comfort they share after a long day, the way their shoulders drop when they are together. These are not guesses. They are facts I have collected over years. I know they are kind, because I have been the recipient of that kindness. I know they are resilient, because I have seen them handle difficulty without turning on each other.

  I know some of you might hope for grand declarations about fate or destiny. I must decline. I will not assert more than my evidence allows. To some, this might seem like modesty. To others, I hope it reads as respect.

  For the future, I shift from knowing to hoping. I hope they find strength when they are tired. I wish them joy that surprises them. I promise them my support, whatever comes. These are not predictions. They are commitments I can keep. I promise to be there when they need a hand, because that is within my power to decide.

  To my sister: I admire your clarity. You have taught me that love, like language, requires care. To her partner: Thank you for the smiles I have seen on her face. You have given me plenty of evidence there.

