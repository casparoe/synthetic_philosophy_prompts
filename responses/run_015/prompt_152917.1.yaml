answer: |-
  Look, I get why your flatmate is digging in on this. Technically, the textbook says Iterated Elimination of Strictly Dominated Strategies (IESDS) works fine even when you allow mixed strategies to do the dominating. Mathematically, it cleans up the game matrix nicely. But you're right to feel like there's something philosophically sketchy about it. It's one of those cases where the math runs away from the reality of what players actually know about each other.

  Here's the thing: if we're hanging out with our philosophy friends, we need to talk about the epistemic foundations here. What do I actually have to *know* to justify crossing a strategy off the list?

  When we stick to pure strategies, the bar is pretty low. If Strategy A is strictly dominated by Strategy B, it means A gives me a worse payoff than B no matter what you do. I don't need to know your psychology, your risk tolerance, or whether you're having a bad day. I just need to know that you prefer more utility to less. Even if I think you're a bit irrational, it's a safe bet you won't play a move that is guaranteed to lose against another specific move. That's a robust assumption.

  But the moment you extend this to mixed strategies, you're secretly smuggling in a massive assumption: Common Knowledge of Rationality (CKR). And I don't mean the casual version; I mean the heavy-duty, infinite-regress version.

  Here's why. To say that a pure strategy of yours is dominated by a *mixture* of your other strategies, I have to assume you are capable of calculating expected utilities over probability distributions. I have to assume you aren't just looking for a safe best-response, but that you're willing to randomize to maximize expected value. That's a much heavier cognitive load.

  Now, layer iteration on top of that. For me to eliminate a strategy in round two, I have to be sure you eliminated your dominated strategies in round one. If we're talking pure strategies, maybe I can trust that. But if we're talking mixed-strategy dominance, I have to be sure that *you* know that *I* am rational enough to recognize mixed dominance, and that *you* know that *I* know *you* are rational enough to recognize it, and so on, ad infinitum.

  This is where your point about "private, bounded doubts" kills the argument. In the real world—and definitely in a dorm room argument—nobody has CKR. I might think you're 95% rational. I might think you usually maximize utility. But if I have even a sliver of doubt—like, "What if he doesn't think in terms of expected utility?" or "What if he thinks I'm going to play irrationally?"—the whole chain snaps.

  If I eliminate your strategy because it's dominated by a mix, I'm essentially saying, "I know exactly how your mind works regarding probability and risk better than you do." I'm imposing my model of rationality onto you. I'm assuming that because *I* see the mixed dominance, *you* must see it too, and that you trust *me* to see it, and that we both trust the math equally. That's not deriving a solution from shared premises; that's just solipsism dressed up as game theory. I'm projecting my own computational capabilities onto you and calling it a equilibrium.

  Restricting iterated dominance to pure strategies is just more epistemically humble. It admits that while we can agree that obviously suicidal moves (pure dominated strategies) should be tossed, we can't necessarily agree on complex probabilistic optimizations without assuming a level of mental transparency that doesn't exist.

  So, tell your flatmate this: if we want game theory to describe how actual agents reason, rather than how angels reason, we have to respect the limits of what we can know about the other player's mind. Pure strategy elimination respects those limits. Mixed strategy elimination bulldozes them. We should stick to the pure stuff because it's the only version that survives contact with actual human uncertainty.
