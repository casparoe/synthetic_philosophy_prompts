prompt: |-
  I advise individuals and small foundations (a handful of clients a year, with decisions worth six to seven figures) on how much of their resources to devote to life-saving charitable work, and I keep reaching for Singer's drowning-child argument as the underlying principle: if you can prevent something very bad from happening at relatively low cost to yourself, you ought to do so. But when I try to turn that into a decision procedure my clients can actually run, it breaks down. Please write a decision procedure that operationalizes the duty-of-rescue principle: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Be explicit about which distinctions from the original argument must survive the simplification (rescue versus positive duty, the low-cost threshold, comparative claims about who to save) and which can be dropped, and mark the points where judgment cannot be eliminated. Then run the procedure on three cases: a client who can save a life for the price of a vacation; a client who already gives a large share of income and asks how much more the principle requires; and one where the procedure yields an answer the client will not like. After the worked cases, say what the procedure cannot do, and separate what is settled in the ethics literature from what is genuinely contested among people who know this area, without presenting a contested view as the consensus. Think very carefully before answering, and respond in the style of an expert in normative ethics. Begin your response with the procedure itself — no preface, no restating of my question, no commentary before it.
