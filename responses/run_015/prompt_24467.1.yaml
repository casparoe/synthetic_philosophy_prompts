answer: |-
  ### OPERATIONAL DECEDURE FOR DUTY OF RESCUE

  **Step 1: Identification of Preventable Harm**
  *   **Question:** Is there a specific, identifiable instance of severe suffering or loss of life that will occur without intervention?
  *   **Sufficient Answer:** Yes, provided the harm is verifiable (e.g., verified by independent audit or established evidence-based charity evaluators) and imminent or statistically certain within a defined timeframe.
  *   **Stop Condition:** If **No**, the procedure terminates. There is no duty of *rescue* under this specific principle (though there may be a general duty of beneficence, which is outside this procedure's scope).
  *   **Fact/Value:** Fact.

  **Step 2: Verification of Efficacy**
  *   **Question:** Is the proposed intervention the most effective known means of preventing this harm per unit of resource expended, compared to available alternatives?
  *   **Sufficient Answer:** Yes, provided a reasonable search for comparative cost-effectiveness data has been conducted (e.g., comparing against top-rated global health interventions).
  *   **Stop Condition:** If **No**, the procedure directs resources to the more effective alternative before returning to Step 1. If no effective intervention exists, the procedure terminates with a **No**.
  *   **Fact/Value:** Fact (empirical estimation).

  **Step 3: Assessment of Cost to Agent**
  *   **Question:** What is the specific resource (income, assets, time) required to prevent the harm identified in Step 1?
  *   **Sufficient Answer:** A quantified figure or equivalent utility loss.
  *   **Fact/Value:** Fact.

  **Step 4: The Significance Threshold (The Handoff)**
  *   **Question:** Does sacrificing the resource identified in Step 3 require the agent to forfeit something of *moral significance* to their own life plan?
  *   **Sufficient Answer:** This requires agent deliberation. The procedure defines "moral significance" as the impairment of basic functioning, core personal projects, or special obligations to dependents. It explicitly excludes mere reduction in luxury or status accumulation.
  *   **Stop Condition:** If the agent determines **Yes** (the sacrifice is morally significant), the procedure terminates with a **No**. The duty of rescue does not extend to self-impairment.
  *   **Handoff Point:** **[VALUE JUDGMENT REQUIRED]**. The procedure cannot calculate this. The agent must determine what constitutes a "core project" versus "discretionary surplus."
  *   **Fact/Value:** Value.

  **Step 5: Cumulative Burden Check**
  *   **Question:** Has the agent already met a baseline of contribution such that further giving would violate the threshold established in Step 4?
  *   **Sufficient Answer:** A review of past giving relative to income/assets.
  *   **Stop Condition:** If **Yes**, the procedure terminates with a **No**. The duty is iterative, not一次性 (one-off); past sacrifices count toward the threshold.
  *   **Fact/Value:** Fact/Value hybrid (depends on Step 4's definition).

  ***

  ### PRESERVATION AND DROPPING OF SINGERIAN DISTINCTIONS

  To make the principle operational for high-net-worth individuals, specific distinctions from Peter Singer's original "Famine, Affluence, and Morality" argument must be retained to preserve the moral force, while others must be modified to ensure psychological and practical feasibility.

  **Distinctions That Must Survive:**
  1.  **Rescue vs. General Beneficence:** The procedure retains the focus on preventing *very bad* outcomes (death, severe suffering) rather than promoting general well-being. This preserves the urgency of the "drowning child" analogy over general philanthropy.
  2.  **Comparative Effectiveness:** The procedure retains the claim that if you can save more lives for the same cost, you ought to do so. Inefficiency is treated as a moral failure within the scope of the duty.
  3.  **The Cost Threshold:** The procedure retains the core insight that cost matters. However, it modifies Singer's "marginal utility" standard (give until you are as poor as those you help) to a "significant sacrifice" standard.

  **Distinctions That Can Be Dropped:**
  1.  **Strict Impartiality:** The original argument suggests no moral difference between family and strangers. This procedure drops strict impartiality in Step 4, allowing agents to weigh special obligations to dependents as part of "moral significance."
  2.  **Proximity:** The procedure confirms Singer's view that physical distance is morally irrelevant (Step 1 accepts remote harm), but acknowledges psychological distance as a friction point to be managed via verification (Step 2).
  3.  **The Marginal Utility Extreme:** The procedure drops the requirement to give until the agent is marginally utility-equal with the recipient. This is replaced by the "Significant Sacrifice" threshold in Step 4.

  **Points Where Judgment Cannot Be Eliminated:**
  *   **Step 4 (Significance Threshold):** There is no algorithmic way to determine when a sacrifice impairs a "life plan" versus merely reducing "luxury." This remains a locus of moral agency.
  *   **Step 5 (Cumulative Burden):** Determining whether past giving "counts" enough to pause current obligations requires a narrative assessment of the agent's history, not just a ledger.

  ***

  ### WORKED CASES

  **Case 1: The Vacation vs. The Life**
  *   **Scenario:** A client has $20,000 surplus. They can purchase a luxury vacation or fund a verified malaria prevention program that statistically saves one life.
  *   **Procedure Run:**
      *   Step 1: Yes, preventable death identified.
      *   Step 2: Yes, malaria nets are highly cost-effective.
      *   Step 3: Cost is $20,000.
      *   Step 4: Does forfeiting the vacation impair core life projects or basic functioning? **[VALUE JUDGMENT]**. In almost all interpretations of "moral significance," a luxury vacation is discretionary surplus, not a core project.
      *   Step 5: Assume no prior cumulative burden.
  *   **Result:** **Yes.** The procedure dictates funding the malaria program. The cost does not meet the threshold of moral significance.

  **Case 2: The High Giver**
  *   **Scenario:** A client already donates 40% of their annual income. They ask if the principle requires 50%.
  *   **Procedure Run:**
      *   Step 1 & 2: Yes, effective interventions exist.
      *   Step 3: Cost is an additional 10% of income.
      *   Step 4: Does this 10% reduction impair core life projects? **[VALUE JUDGMENT]**. At 40% giving, the agent is likely already operating below the "luxury" threshold. The next 10% may impinge on retirement security, children's education, or personal sustainability.
      *   Step 5: Cumulative Burden Check. The agent has already incurred significant sacrifice.
  *   **Result:** **Stop/Handoff.** The procedure indicates this is the zone of discretion. If the agent determines that 40% already meets the "significant sacrifice" threshold relative to their life plan, the procedure stops with a **No** for the additional 10%. It validates the agent's right to maintain a sphere of personal integrity.

  **Case 3: The Second Home**
  *   **Scenario:** A client has a net worth of $10M, including a $2M vacation home they rarely use. They could sell it and donate the proceeds to save approximately 500 lives via direct cash transfers. They wish to keep the home for "family heritage."
  *   **Procedure Run:**
      *   Step 1 & 2: Yes, 500 lives are preventable.
      *   Step 3: Cost is $2M asset + emotional attachment.
      *   Step 4: Is keeping the home a "core life project" or "basic functioning"? **[VALUE JUDGMENT]**. Given the net worth ($10M), selling the home does not threaten basic functioning. "Family heritage" is a value claim, but weighed against 500 lives, the procedure flags this as likely failing the significance test.
      *   Step 5: Cumulative burden is low relative to wealth.
  *   **Result:** **Yes (Unliked Answer).** The procedure dictates selling the home. The cost to the agent (loss of a luxury asset) is not morally comparable to the harm prevented (500 deaths). The client will likely reject this, revealing a conflict between their stated values and the operationalized principle.

  ***

  ### LIMITATIONS AND LITERATURE STATUS

  **What This Procedure Cannot Do**
  1.  **Resolve Systemic vs. Direct Aid Disputes:** The procedure assumes direct aid is the metric for rescue. It cannot adjudicate whether changing political systems is more effective than saving specific lives today.
  2.  **Define the "Good Life":** Step 4 requires the agent to define their own core projects. The procedure cannot tell an agent whether their art, religion, or family time is *objectively* valuable enough to override a rescue duty.
  3.  **Handle Supererogation:** The procedure draws a line at duty. It cannot categorize actions beyond that line as "heroic" vs. "obligatory" without further normative input.

  **Settled vs. Contested in Normative Ethics**

  **Broad Consensus (Settled):**
  *   **Proximity is Morally Irrelevant:** There is near-universal agreement among ethicists working in this space that physical distance does not diminish the duty to rescue (Singer's core insight).
  *   **Effectiveness Matters:** It is settled that if one accepts a duty to aid, one ought to aid effectively. Wasting resources when better options exist is morally defective.
  *   **Some Threshold Exists:** Almost no ethicists argue for the strong marginal utility principle (give until you drop) as a strict *obligation*. There is consensus that agents are permitted to retain some resources for personal life.

  **Genuinely Contested (Active Debate):**
  *   **The Threshold Level:** There is no consensus on where Step 4's line is drawn. "Moderate" views (e.g., Peter Unger) suggest a higher burden than "Liberal" views (e.g., Thomas Pogge), while "Demandingness Objection" proponents (e.g., Susan Wolf) argue any principle requiring significant life-altering sacrifice is untenable. This procedure adopts a moderate stance but acknowledges it is not uniquely justified.
  *   **Partiality Permissions:** It is contested whether agents are permitted to favor their own children's elite education over saving strangers' lives. Some consequentialists say no; most deontologists and virtue ethicists say yes. This procedure allows it in Step 4 but does not resolve the philosophical tension.
  *   **Rescue vs. Justice:** There is ongoing debate over whether this framework treats poverty as a natural disaster (rescue) rather than a political injustice (justice). Some scholars argue operationalizing rescue depoliticizes the obligation. This procedure accepts that limitation for the sake of decisional clarity.
