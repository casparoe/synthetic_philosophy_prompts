  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** An advisor to individuals/small foundations on charitable giving (life-saving focus).
      *   **Problem:** Singer's drowning-child argument is the underlying principle, but it breaks down as a practical decision procedure for clients.
      *   **Task:** Write a decision procedure that operationalizes the duty-of-rescue principle.
      *   **Requirements:**
          *   Questions in order.
          *   What counts as a sufficient answer.
          *   Where the procedure stops with a "no".
          *   Where it hands decision to a person (values vs. facts).
          *   Explicit about distinctions from Singer's argument (rescue vs. positive duty, low-cost threshold, comparative claims) that must survive vs. can be dropped.
          *   Mark points where judgment cannot be eliminated.
          *   Run the procedure on three cases:
              1.  Client can save a life for price of a vacation.
              2.  Client already gives large share, asks how much more.
              3.  Procedure yields an answer the client will not like.
          *   After cases: Say what the procedure cannot do.
          *   Separate settled ethics literature from genuinely contested views (no false consensus).
          *   **Style:** Expert in normative ethics.
          *   **Constraint:** Begin response with the procedure itself (no preface, no restating question).

  2.  **Deconstruct Singer's Argument & Operational Challenges:**
      *   *Singer's Principle:* "If it is in our power to prevent something very bad from happening, without thereby sacrificing anything morally comparable, it is wrong not to do so." (Strong version: without sacrificing anything *of moral significance*).
      *   *The Breakdown:* "Morally comparable" is vague. "Low cost" is subjective. Infinite regress (give until you are as poor as those you help). Psychological feasibility vs. moral obligatoriness.
      *   *Operationalization Needs:* Needs clear thresholds, stop conditions, and acknowledgment of agency/values.
      *   *Distinctions to Keep:*
          *   Rescue (preventing bad) vs. General Beneficence (making good).
          *   Cost threshold (not *any* cost, but *significant* cost).
          *   Comparative effectiveness (saving *this* life vs. *that* life).
      *   *Distinctions to Drop:*
          *   Strict impartiality (maybe allow some partiality to self/family within limits).
          *   The "marginal utility" extreme (give until you drop).
          *   Proximity (physical distance doesn't matter, but psychological distance might be acknowledged as a friction point).

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A flowchart-like text structure.
      *   *Step 1: Identification of Need.* Is there a specific, identifiable life-saving intervention available? (Rescue vs. General Aid).
      *   *Step 2: Effectiveness.* Is this the most effective way to use these specific resources? (Comparative claim).
      *   *Step 3: Cost Assessment.* What is the cost to the agent?
      *   *Step 4: Threshold Check.* Does the cost exceed the "Significant Sacrifice" threshold? (This is the core value judgment).
      *   *Step 5: Cumulative Burden.* Have previous duties been met? (Avoids infinite demand in a single step).
      *   *Handoff Points:* Where the agent must decide what counts as "significant."

  4.  **Refining the Distinctions:**
      *   *Rescue vs. Positive Duty:* Keep. Focus on preventing death/suffering vs. enhancing well-being.
      *   *Low-Cost Threshold:* Keep, but define it as "Non-Catastrophic" rather than "Trivial."
      *   *Comparative Claims:* Keep. If you can save 2 lives for the price of 1, you should save 2.

  5.  **Drafting the Cases:**
      *   *Case 1 (Vacation):* Clear yes. Cost is trivial relative to life.
      *   *Case 2 (High Giver):* Focus on marginal utility vs. personal integrity/projects. The procedure should indicate a "stop" or "value judgment" point where basic life projects are threatened.
      *   *Case 3 (Unliked Answer):* Maybe a case where the cost is moderate (e.g., selling a second home) but the procedure says "give." Shows the tension.

  6.  **Drafting the Limitations & Literature Review:**
      *   *What it can't do:* Resolve deep axiological disputes, account for supererogation perfectly, handle systemic change vs. direct aid.
      *   *Settled:* Proximity doesn't matter morally. Effectiveness matters.
      *   *Contested:* The exact threshold of sacrifice (moderate vs. strong). Demandingness objection. Partiality permissions.

  7.  **Review against Constraints:**
      *   *Style:* Expert normative ethics (precise, nuanced, authoritative but humble on contested points).
      *   *Start:* Procedure itself. No intro.
      *   *Structure:* Procedure -> Distinctions -> Cases -> Limitations/Lit Review.

  8.  **Self-Correction/Polishing:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions concrete. "Can you identify the specific harm?" "Is there a verified intervention?"
      *   *Critique:* Did I mark the judgment points clearly?
      *   *Fix:* Use brackets or bold text to indicate [VALUE JUDGMENT REQUIRED].
      *   *Critique:* Did I distinguish settled vs. contested correctly?
      *   *Fix:* Ensure I don't say "Philosophers agree X" if there's a significant minority (e.g., demandingness).
      *   *Tone Check:* Avoid preachiness. Maintain analytical distance.

  9.  **Final Polish of the Procedure Steps:**
      *   Step 1: Causal Link (Fact).
      *   Step 2: Comparative Effectiveness (Fact/Estimation).
      *   Step 3: Cost Calculation (Fact).
      *   Step 4: Sacrifice Threshold (Value).
      *   Step 5: Cumulative Duty (Value/Policy).

      *Wait, need to ensure the "Stop with No" condition is clear.*
      *   If Step 1 fails -> No duty (via this procedure).
      *   If Step 4 fails (Cost is too high) -> No duty (via this procedure).

      *Need to ensure the "Handoff" is clear.*
      *   Step 4 is the main handoff.

      *Distinctions Section:* Needs to be explicit about what from Singer is kept/dropped.

      *Cases:* Ensure they test different parts of the procedure.

      *Literature:* Be careful with "Settled." Very little is truly settled. Frame as "Broad Consensus" vs "Active Debate."

  10. **Final check on "Begin your response with the procedure itself":**
      *   Do not write "Here is the procedure."
      *   Start immediately with "### Operational Decision Procedure..."

  11. **Final check on Style:**
      *   Use terms like "moral significance," "marginal utility," "supererogatory," "demandingness objection."
      *   Maintain professional, advisory tone.

