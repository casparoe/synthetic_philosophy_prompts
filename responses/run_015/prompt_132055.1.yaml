answer: |-
  # The Inferential Ledger Protocol (ILP)
  **For TA Use Only | Logic Workshop Grading Standard**

  ## I. Pre-Term Setup (The Value Calls)
  *This procedure does not discover truth; it administers agreement. Before the first assignment is distributed, the Instructor must set the following parameters. TAs cannot alter these mid-semester.*

  1.  **The Base Budget (Primitives):** These inferences cost nothing to use. No citation required.
      *   *Direct Substitution* (Uniform replacement of variables).
      *   *Identity* ($A \vdash A$).
      *   *Modus Ponens* ($A, A \to B \vdash B$).
  2.  **The Collateral Deposit (Approved Corpus):** A specific list of texts, lecture notes, or prior theorems students may cite to "pay" for complex steps.
      *   *Example:* "Lecture Notes Weeks 1-4," "Mendelson Ch. 1," "Derived Rule: Hypothetical Syllogism."
      *   *Note:* If a rule is not in the Base Budget and not in the Collateral, it is **Unsecured Debt**.
  3.  **Credit Policy:** The Instructor must define the TA's tolerance for Unsecured Debt.
      *   *Strict:* Reject any step not Budget/Collateral.
      *   *Pedagogical:* Accept obvious steps on "Credit" but mark for reformulation.
      *   *Lenient:* Accept intuitive leaps if the conclusion is valid.

  ---

  ## II. The Grading Flowchart (TA Decision Procedure)
  *For every inference line in a student proof, run this check.*

  **STEP 1: Identify the Inference**
  What rule allows the move from Line $n$ to Line $n+1$?
  *   *If the student didn't name it, infer what they intended.*

  **STEP 2: Check the Base Budget**
  Is the rule one of the three Primitives (Substitution, Identity, MP)?
  *   **YES:** Mark **PAID**. Move to next line.
  *   **NO:** Proceed to Step 3.

  **STEP 3: Check the Collateral Deposit**
  Did the student cite a source from the Approved Corpus? Is the citation valid (i.e., does that source actually contain this rule/theorem)?
  *   **YES:** Mark **SECURED**. Note source. Move to next line.
  *   **NO:** Proceed to Step 4.

  **STEP 4: Flag as Unsecured Deductive Debt**
  The step relies on authority or intuition not currently banked.
  *   **TA Decision Required:**
      1.  **Accept on Credit:** Mark "CR." Deduct minor points. Allow proof to stand. (Use for obvious slips).
      2.  **Reject Step:** Mark "X." Proof fails at this line. (Use for critical gaps).
      3.  **Demand Reformulation:** Mark "RF." Student must rewrite the step using only Budget/Collateral.

  ---

  ## III. Application to Student Proofs

  ### Case 1: The Clean Syllogism
  **Student Proof:**
  1. $P \to Q$ (Premise)
  2. $P$ (Premise)
  3. $Q$ (From 1, 2 by Modus Ponens)

  **ILP Run:**
  *   **Line 3:** Inference is Modus Ponens.
  *   **Step 2 (Budget Check):** MP is in the Base Budget.
  *   **Result:** **PAID**.
  *   **Grade:** Full credit. No regress triggered. The proof stays within the solvent limits of the workshop.

  ### Case 2: The Regress Trap (Justifying MP)
  **Student Proof:**
  1. $P \to Q$ (Premise)
  2. $P$ (Premise)
  3. *Claim:* MP is valid.
  4. *Justification:* "MP is justified because Natural Deduction systems normalize; if we assume MP, the proof reduces to normal form without loss of truth." (Cites: Gentzen 1934)
  5. $Q$ (From 1, 2, 3)

  **ILP Run:**
  *   **Line 3/4:** Inference is a meta-justification of MP.
  *   **Step 2 (Budget Check):** "Normalization" is not in the Base Budget (Primitives are object-language, this is meta-language).
  *   **Step 3 (Collateral Check):** Gentzen 1934 is *not* on the Approved Corpus (Workshop uses Mendelson). Even if it were:
  *   **Step 4 (Debt Analysis):** To prove normalization, Gentzen uses inference rules. Does Gentzen use MP (or equivalent) to prove MP is valid? Yes.
  *   **TA Decision:**
      *   *Option A (Circular Collateral):* Flag as **SECURED (CIRCULAR)**. The collateral presupposes the rule it justifies.
      *   *Option B (Unsecured Debt):* Flag as **DEBT**. The justification requires a meta-system we haven't budgeted for.
  *   **The Answer You'll Hate:** The procedure forces the TA to mark this as **CIRCULAR COLLATERAL**. The student has tried to pay a debt by writing a check on the same account they are trying to fund.
      *   *Grading Outcome:* Reject Step 3. The ILP cannot grade this as "Valid" without violating the Pre-Term Setup. It exposes that the student is asking for a justification the system is designed to *stipulate*, not prove. If you accept it, you are grading on **Credit** (faith), not logic.

  ### Case 3: The Sloppy Conjunction
  **Student Proof:**
  1. $P \land Q$ (Premise)
  2. $P$ (From 1)

  **ILP Run:**
  *   **Line 2:** Inference is Conjunction Elimination ($\land$-E).
  *   **Step 2 (Budget Check):** $\land$-E is *not* in the Base Budget (Only MP, Identity, Substitution).
  *   **Step 3 (Collateral Check):** No citation provided.
  *   **Step 4 (Debt Analysis):** This is **Unsecured Deductive Debt**.
  *   **TA Decision:**
      *   *Judgment Call:* Is this a conceptual error or lazy notation?
      *   *Recommendation:* **Accept on Credit (CR)**. Mark "Needs Citation: $\land$-E."
      *   *Reasoning:* Deriving $P$ from $P \land Q$ is intuitively primitive for grad students, even if not in the *formal* budget. Rejecting it halts progress on a triviality. However, if the workshop goal is formal rigor, demand **Reformulation** (e.g., define $\land$ in terms of $\to$ and $\neg$, then use MP).

  ---

  ## IV. Limitations & Disclaimers
  *Read this before arguing with a student about a grade.*

  1.  **The Procedure Does Not Solve Carroll's Tortoise:** The ILP does not prove Modus Ponens is true. It merely declares that, for the purpose of *this workshop*, MP is currency. It stops the regress by administrative fiat, not philosophical resolution.
  2.  **The "Base Budget" is Arbitrary:** Why MP and not $\land$-E? Why not Resolution? This is a pedagogical choice made by the Instructor. The ILP cannot justify the budget; it only enforces it.
  3.  **Credit Decisions are Subjective:** Step 4 of the Flowchart requires human judgment. Two TAs might grade Case 3 differently (one accepts on credit, one demands reformulation). This is a feature, not a bug; it reflects pedagogical tolerance.
  4.  **Collateral is Not Truth:** A rule in the "Approved Corpus" is not necessarily true; it is merely *authorized*. If the text contains an error, the ILP will still mark it as **SECURED**.
  5.  **Infinite Regress is Banned:** If a student attempts to justify a Primitive (Case 2), the ILP classifies this as a category error. Primitives are the bottom of the ledger. Digging below them is not "deeper logic"; it is "out of bounds."

  **Summary for TAs:** You are not auditing the truth of logic. You are auditing the solvency of the proof against the agreed-upon budget. If they go over budget, flag the debt. If they try to justify the currency itself, reject the transaction.
