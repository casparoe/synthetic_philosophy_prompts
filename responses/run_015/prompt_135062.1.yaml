answer: |-
  You have put your finger on the exact tension that keeps philosophers of science up at night. You are describing a **degenerating problemshift** that is being rhetorically disguised as a **progressive problemshift**.

  While there isn't one single "magic noun" (like "The Lakatos Trap"), there is a specific cluster of terminology Lakatos and his successors developed to name exactly this maneuver.

  Here is the breakdown of the terms you are looking for.

  ### 1. The Formal Verdict: Degenerating Problemshift
  In Lakatos's framework, a research programme is **progressive** if its theory changes lead to the discovery of **novel facts** (excess empirical content). It is **degenerating** if the theory changes are made solely to accommodate known anomalies without predicting anything new.

  If a team adjusts the protective belt to explain an anomaly and then claims, "Aha! Our new theory *predicts* that this anomaly should happen," Lakatos would call this a **degenerating problemshift**. Even if they call it a prediction, if the "prediction" is just a redescription of the data used to construct the patch, it lacks **excess empirical content**.

  ### 2. The Mechanism: Ad Hoc$_1$ Hypotheses
  Lakatos refined the concept of "ad hoc" into three specific levels. The pattern you described usually falls into **$\text{ad hoc}_1$**, even if proponents claim it is $\text{ad hoc}_3$.

  *   **$\text{ad hoc}_1$:** A hypothesis that saves the theory from a specific anomaly but implies **no new testable content** beyond what is already known. (e.g., "It fails in living systems" explains the failure but predicts nothing else).
  *   **$\text{ad hoc}_2$:** A hypothesis that implies new content, but none of it has been tested yet.
  *   **$\text{ad hoc}_3$:** A hypothesis that implies new content *and* that content is corroborated by evidence.

  **The Trick:** The researchers you are reading about are claiming their adjustment is $\text{ad hoc}_3$ (because they say it "successfully predicted" the absence of the effect). However, if the "prediction" is derived *from* the anomaly itself, it is logically **$\text{ad hoc}_1$**. It is an accommodation masquerading as a prediction.

  ### 3. The Philosophical Distinction: Accommodation vs. Prediction (Use Novelty)
  This is the specific distinction you feel is missing. Lakatos initially focused on **temporal novelty** (did the prediction come before the data?). However, critics like **Elie Zahar** (a student of Lakatos) refined this to **Use Novelty**.

  *   **Use Novelty:** A fact counts as novel support for a theory only if it was **not used in the construction of the theory**.
  *   **The Loop You Described:** If the anomaly (the data) was used to construct the auxiliary hypothesis (the qualifier), it cannot count as novel confirmation of that hypothesis, even if framed as a "prediction."

  When scientists claim credit for "predicting" an anomaly they just patched, they are violating **Zahar's Criterion of Novelty**. Philosophers often call this **post-diction** (constructing an explanation after the fact and calling it a prediction).

  ### 4. Popper's Term: Conventionalist Stratagem
  Before Lakatos, Karl Popper described this exact behavior. He called it a **conventionalist stratagem**.

  This occurs when scientists redefine terms or add qualifiers specifically to make the theory unfalsifiable. By saying "the theory only applies where it works," they are immunizing the hard core. Lakatos adopted this but tried to make it less dogmatic by allowing protective belt adjustments *provided* they lead to novel discoveries. If they don't, it reverts to a Popperian conventionalist stratagem.

  ### 5. Sociological Term: Immunization Strategy
  In the sociology of scientific knowledge (e.g., Latour, Collins), this is often called an **immunization strategy**. It describes how a community protects its core beliefs from refutation by attributing failures to "interfering factors," "background noise," or "boundary conditions" without independent evidence for those factors.

  ### 6. Modern Analogy: Overfitting
  If you want a modern term that captures the *logical structure* of this error, look to statistics and machine learning: **Overfitting**.

  *   **Overfitting:** Creating a model that matches the existing data points perfectly (including the noise/anomalies) by adding too many parameters (qualifiers), but fails to generalize to new data.
  *   **Your Scenario:** The researchers are "overfitting" their theory to the anomalies. By adding a qualifier for every failure, they achieve a perfect fit for past data but lose predictive power for future, independent data.

  ### Summary
  You are correct that this is "degenerating research in disguise." The specific vocabulary to describe it is:

  1.  **Degenerating Problemshift:** The Lakatosian verdict.
  2.  **$\text{Ad hoc}_1$ Adjustment:** The type of hypothesis (saves the theory, adds no independent content).
  3.  **Accommodation masquerading as Prediction:** The rhetorical move (violating Use Novelty).
  4.  **Immunization:** The sociological function.

  Lakatos anticipated this. He argued that we cannot judge a programme instantly. We have to wait and see if the "patched" version leads to **independent** discoveries. If the programme spends all its time re-framing past failures as "predictions of absence" without finding *new, unexpected* positive facts, the scientific community eventually labels it **degenerating** and abandons it.

  So, the "loop" doesn't have a single name, but it is the defining characteristic of a **degenerating research programme relying on ad hoc immunization.**


