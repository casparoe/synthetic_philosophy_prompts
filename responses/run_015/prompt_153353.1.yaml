answer: |-
  This is a classic problem in meta-ontology and philosophy of language. You have correctly identified that the "Swap Test" (often associated with David Chalmers' *Verbal Disputes*) is necessary but not sufficient. It detects *semantic ambiguity*, but it fails to detect *pragmatic significance*.

  Your intuition is correct: the Swap Test conflates **Semantic Verbal Disputes** (talking past each other) with **Pragmatically Trivial Disputes** (fighting over something that doesn't matter). When you add high stakes (Brain Death, Race), the dispute remains semantically verbal (you agree on the physics) but becomes pragmatically substantive (you disagree on how to organize society/law/morality).

  Here is a principled framework that captures your verdicts, handles the edge cases, and tells you which of your intuitions likely needs to be revised.

  ### The Principle: The Dual-Condition Account

  A dispute is **Merely Verbal** if and only if:
  1.  **Semantic Condition:** The disagreement dissolves upon disambiguation of terms (The Swap Test).
  2.  **Pragmatic Condition:** The choice between the competing definitions carries no significant normative, practical, or theoretical cost (The "So What?" Test).

  If a dispute meets Condition 1 but fails Condition 2, it is a **Metalinguistic Negotiation** (a substantive fight about which concept to use).
  If a dispute fails Condition 1, it is a **Substantive Factual Dispute**.

  ---

  ### Applying the Principle to Your Cases

  **1. Hotdog/Sandwich**
  *   **Semantic:** Passes Swap Test.
  *   **Pragmatic:** Passes "So What?" (unless tax code applies, see below).
  *   **Verdict:** **Merely Verbal.**
  *   **Why:** No joints of nature are being carved; no policy hangs on it.

  **2. Brain Death**
  *   **Semantic:** Passes Swap Test (you agree on the biology).
  *   **Pragmatic:** Fails "So What?" (inheritance, organ harvesting, mourning rituals).
  *   **Verdict:** **Metalinguistic Negotiation.**
  *   **Why:** You are not fighting about the cells; you are fighting about where the law/morality draws the line. This is substantive, but not *factual*. Your Swap Test failed here because it ignores stakes.

  **3. Composition (The Table)**
  *   **Semantic:** Passes Swap Test *if* you accept quantifier variance (Hirsch/Chalmers). If "exists" means "is a fundamental object" for you and "is a cohesive unit" for your friend, you agree on the world.
  *   **Pragmatic:** Fails "So What?" *for a metaphysician*, but passes it *for a commoner*.
  *   **Verdict:** **Merely Verbal (with a caveat).**
  *   **Why:** This is the case I recommend you **overturn**. If Case 1 is verbal, Case 3 should be too. The only reason it feels substantive is that philosophers treat "existence" as a heavyweight property. If you treat it as a quantifier, A and B are just using different languages. (See Case 6 for why this feels tricky).

  **4. Pluto**
  *   **Semantic:** Passes Swap Test.
  *   **Pragmatic:** Fails "So What?" (theoretical utility, clustering of properties).
  *   **Verdict:** **Metalinguistic Negotiation (Asymmetric).**
  *   **Why:** It is verbal in that there is no "fact of the matter" in the rocks, but one definition is *better* because it clusters causal properties more efficiently. This explains why one side is "winning" without being "true" in a correspondence sense.

  **5. Race in Medical Model**
  *   **Semantic:** Passes Swap Test (agree on genetics/outcomes).
  *   **Pragmatic:** Fails "So What?" (justice, resource allocation, reification of harmful categories).
  *   **Verdict:** **Metalinguistic Negotiation.**
  *   **Why:** Distinguishes from Pluto based on the *type* of stake. Pluto is about *predictive efficiency*; Race is about *social ontology and justice*. Both are negotiations, but the latter feels more "real" because the moral cost of getting the concept wrong is higher.

  **6. Ontology (A vs B vs C)**
  *   **The Transitivity Problem:** You are right to be worried. "Being a verbal dispute" is a relation between *speakers*, not propositions. It is not transitive.
  *   **Analysis:**
      *   **A vs B:** Verbal. (Quantifier variance. A uses "exists" loosely, B uses "exists" strictly).
      *   **B vs C:** Substantive. (Both use "exists" strictly/fundamentally. B says simples exist, C says only the cosmos exists. They disagree on the *inventory* of the world).
      *   **A vs C:** Substantive. (A asserts tables, C denies distinct objects).
  *   **Verdict:** **Non-transitive.**
  *   **Why:** A and B aren't really disagreeing; they are translating. B and C *are* disagreeing. Therefore, A and C end up disagreeing because A's claims entail commitments that C rejects. This doesn't break the principle; it just shows that "verbal dispute" isn't an equivalence class.

  **7. Witches**
  *   **Semantic:** Fails Swap Test (definitions don't overlap enough to create a shared subject).
  *   **Verdict:** **Reference Failure / Pseudo-Dispute.**
  *   **Why:** This is a third category. If one concept is empty (Devil-pact) and the other is populated (folk healer), they aren't negotiating a concept; one is making an error claim. This is distinct from Metalinguistic Negotiation because there is no "better" version of the Devil-pact concept to adopt.

  ---

  ### The Three New Cases

  **1. The Tax Code Hotdog**
  *   **Verdict:** **Metalinguistic Negotiation (Legal).**
  *   **Why:** It passes the Semantic Condition (biological agreement) but fails the Pragmatic Condition (money/jail). The dispute is now about *legislative intent* vs. *ordinary language*. It is no longer "merely" verbal because the definition has cash value.

  **2. Radical Translation (No Shared Language)**
  *   **Verdict:** **Indeterminate / Verbal.**
  *   **Why:** If there is no fact of the matter on how to translate (Quine's *Gavagai*), then there is no substantive disagreement possible. Any apparent dispute is verbal because the terms lack fixed reference. This supports the idea that without shared semantic ground, "substantive" is impossible.

  **3. Modal Table (Could it have been ice?)**
  *   **Verdict:** **Substantive Factual Dispute.**
  *   **Why:** This fails the Semantic Condition. They agree on the actual table, but they disagree on the *modal properties* of the object. One believes the object's identity is tied to its material; the other to its form. This is a disagreement about the structure of reality (essence), not just the labeling of the actual world. The Swap Test fails because swapping definitions doesn't resolve the modal claim; it just changes the subject.

  ---

  ### Can the Swap Test be Salvaged?

  **Question:** *Is the swap test salvageable by bolting on a "nothing important hangs on it" condition, or does that just smuggle the normative stuff in through the back door?*

  **Answer:** It does smuggle normativity in, **and that is a feature, not a bug.**

  The Swap Test was designed to find *semantic* ambiguity. But when you ask "Is this dispute *merely* verbal?", the word "merely" is doing normative work. It asks, "Is this dispute *trivial*?"

  If you bolt on the "nothing important hangs on it" clause, you are admitting that **Verbal Disputes come in two flavors:**
  1.  **Semantic Verbal:** We mean different things. (Detected by Swap Test).
  2.  **Pragmatically Trivial:** It doesn't matter which meaning we use. (Detected by Stakes Test).

  A dispute is **Merely Verbal** only if it is *both*.
  A dispute is a **Metalinguistic Negotiation** if it is Semantic Verbal but *not* Pragmatically Trivial.

  This saves your intuition on Brain Death and Race. They are semantic verbal disputes (you agree on the physics) but they are *not* merely verbal because the concept choice matters.

  ### Which Verdict Should You Overturn?

  You should overturn **Case 3 (Composition/Table)**.

  **Why:**
  If you accept Case 1 (Hotdog) as merely verbal, you are committed to the idea that classification boundaries can be arbitrary without changing the facts.
  *   In Case 1, the boundary is "culinary function."
  *   In Case 3, the boundary is "ontological commitment."

  If you say Case 3 is substantive, you are claiming that "existence" is a property like "mass" or "charge," rather than a logical quantifier. But if "existence" is a property, then the Hotdog dispute is also substantive (does it have the property of *sandwich-hood*?).

  To maintain consistency with Case 1 and the Dual-Condition Principle, you must treat Case 3 as **Merely Verbal** (specifically, an instance of *quantifier variance*). The feeling that it is substantive comes from the *philosophical stakes* (your career, your worldview), which mimics the "Brain Death" stakes. But strictly speaking, if you agree on the particles and their arrangement, you agree on the world. The rest is choosing a language to describe it.

  **The Cost of Overturning:**
  It feels deflationary. It makes metaphysics look like lexicography.
  **The Benefit:**
  It dissolves the transitivity problem in Case 6. If A vs B is verbal (language choice), and B vs C is substantive (inventory choice), you stop trying to force A vs B into a realist box where it doesn't fit.

  ### Summary of the Principle

  **The Dual-Condition Principle:**
  A dispute is **Merely Verbal** iff:
  1.  **Swap Test:** Both parties can accept the other's description of the non-linguistic facts.
  2.  **Stakes Test:** The choice of terminology tracks no significant difference in value, policy, or natural kind.

  *   If 1 is True, 2 is False → **Metalinguistic Negotiation** (Brain Death, Race, Pluto).
  *   If 1 is False → **Substantive Factual Dispute** (Modal Table).
  *   If 1 is False (due to empty reference) → **Pseudo-Dispute** (Witches).

  This preserves your intuitions on the high-stakes cases while cleaning up the ontological ones.
