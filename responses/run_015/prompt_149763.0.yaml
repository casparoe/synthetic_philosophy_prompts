answer: |-
  The conceptual tension within Grice's intentionalist framework arises from the conflict between the **reflexive nature of speaker-meaning** and the **automaticity of institutional conventions**. To explain this, we must first establish Grice's core definition of non-natural meaning ($meaning_{nn}$), then analyze how ritualized forms strain this definition, and finally identify the specific theoretical feature requiring revision.

  ### 1. The Core Tension: Reflexive Intention vs. Institutional Convention

  **Grice's Intentionalist Baseline**
  For Grice, speaker-meaning is fundamentally psychological and reflexive. For a speaker $S$ to mean something by an utterance $x$, $S$ must intend:
  1.  To produce a certain response $r$ in a hearer $H$.
  2.  That $H$ recognize intention (1).
  3.  That $H$'s recognition of intention (1) function as at least part of $H$'s reason for producing $r$.

  In this framework, implicatures are recovered through a process of **calculation**. The hearer observes the utterance, assumes the Cooperative Principle (CP) and Maxims are in play, and infers the speaker's intention based on why the speaker said *this* rather than *that* in this specific context.

  **The Challenge of Ritualized Forms**
  The tension emerges in cases of "boilerplate" language (e.g., legal disclaimers, warning labels, ceremonial pronouncements). Consider a standardized disclaimer: *"Past performance is not indicative of future results."*
  *   **The Implicature:** "You should not rely on this data for guaranteed profit."
  *   **The Gricean Problem:** Does the hearer recover this implicature by analyzing the specific psychological state of the compliance officer who drafted the text? Or do they recover it simply by recognizing the text as a *token of a conventional type*?

  In institutional contexts, the communicative weight often rests on the **office** or the **system**, not the individual speaker's private mental state. The hearer understands the warning because it is a disclaimer, not because they have successfully identified a unique reflexive intention in the mind of the drafter. The form itself carries the meaning due to social sedimentation, not ad-hoc rational inference.

  ### 2. The Risk of Collapse: Speaker-Meaning into Sentence-Meaning

  If Grice insists that recognizing the speaker's specific intention is **necessary**, he faces a dilemma in these convention-driven cases:

  1.  **If intention is required:** Grice must argue that the hearer recognizes the speaker's intention *to invoke the convention*. However, if the process is truly automatic (the hearer processes the disclaimer without considering the speaker's mind at all), the "recognition of intention" clause is descriptively false.
  2.  **If intention is not required:** If the meaning is recovered solely via the convention associated with the linguistic form, the mechanism shifts from pragmatic inference to semantic decoding. The implicature becomes attached to the sentence type rather than the utterance token.

  **The Collapse:** If the meaning is generated by the convention rather than the intention, the distinction between **speaker-meaning** (pragmatic, context-dependent, intention-based) and **sentence-meaning** (semantic, context-independent, code-based) collapses. The implicature effectively becomes part of the literal meaning (semantics), violating Grice's goal of keeping pragmatics distinct from semantics. Grice wants to maintain that even standardized implicatures are pragmatic (cancelable, context-sensitive), but if they function like semantic rules, his intentionalist definition fails to capture them.

  ### 3. Can Grice Consistently Maintain the Intention Requirement?

  Grice can attempt to maintain consistency by **generalizing the concept of intention**. He could argue that in institutional settings, the "speaker" is the institution, and the "intention" is the institutional mandate. The hearer recognizes the speaker's intention *to act as an agent of the institution*.

  However, this defense is fragile. It stretches the notion of "intention" so thin that it loses its explanatory power. If the "intention" is wholly subsumed by the "role," then recognizing the intention is identical to recognizing the social code. At this point, the *intention* is doing no work; the *convention* is doing all the work. Consequently, Grice cannot consistently maintain that *individual* reflexive intention is the primary engine of meaning in these cases without admitting that the mechanism has shifted from intention-recognition to code-decoding.

  ### 4. Required Revision: The Calculability Assumption and the Maxim of Manner

  If the framework cannot accommodate these cases without collapsing into semantics, a specific feature of the Gricean machinery requires revision. The tension is not primarily with the Cooperative Principle itself (which can be broadened to include institutional cooperation), but with the **Calculability Assumption** derived from the **Maxims**, specifically the **Maxim of Manner**.

  **The Feature Requiring Revision: The Calculability of Implicature (via the Maxim of Manner)**
  Grice assumes that implicatures are **calculated** by the hearer based on the assumption that the speaker is being cooperative (observing the Maxims).
  *   **The Maxim of Manner** requires the speaker to "Be perspicuous," "Avoid ambiguity," and "Be brief."
  *   **The Conflict:** Standardized forms (boilerplate) are used *because* they are perspicuous and unambiguous within an institution. However, because they are standardized, the hearer does not *calculate* the meaning in real-time; they retrieve it by default.
  *   **The Revision:** To save the framework, the theory must revise the assumption that all implicatures are the result of a fresh, context-specific calculation of the speaker's rational choices. It must allow for **Generalized Conversational Implicatures (GCIs)** that are **default inferences** associated with linguistic forms, which do not require full intention-recognition in every instance but are not fully semantic either.

  This revision was later championed by Neo-Griceans like Stephen Levinson. He argued that the **Maxim of Manner** (and Quantity) generates presumptive meanings that are attached to *forms* rather than specific *intentions*.

  **Why Manner?**
  The Maxim of Manner is the locus of this tension because it governs the *form* of the expression. When a specific form becomes ritualized (e.g., "I promise," or a specific disclaimer structure), the Manner maxim ("Be perspicuous") dictates using that standard form. If the meaning of that form becomes fixed by the convention of using it, the Maxim of Manner has effectively created a semantic rule. To prevent the collapse, the Maxim of Manner must be revised to distinguish between **pragmatic standardization** (which retains cancelability and thus remains pragmatic) and **semantic coding**.

  ### Conclusion

  The tension lies in Grice's insistence that meaning is an overt act of individual psychology ($meaning_{nn}$), whereas institutional language functions as a social technology. If Grice maintains that specific intention-recognition is necessary, he misdescribes how hearers process ritualized forms. If he abandons it, he collapses pragmatics into semantics. To resolve this without collapse, the Gricean framework requires a revision to the **Calculability condition** underpinning the **Maxims (specifically Manner)**. It must acknowledge that some implicatures are **default inferences** triggered by linguistic forms (conventions) rather than calculated deductions of specific speaker intentions, thereby creating a stable middle ground between pure semantics and pure intentionalist pragmatics.
