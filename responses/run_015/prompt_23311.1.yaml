      *   *End:* The Verdict. The Institutional Mandate.

  *(Self-Correction on the Verdict)*: I need to be careful not to say "Fairness is impossible." That's nihilistic. I need to say "Simultaneous satisfaction of these specific statistical criteria is impossible." The verdict should be that the *Substantive* interpretation is stronger because it forces a moral reckoning, whereas the *Definitional* interpretation allows for moral evasion.

