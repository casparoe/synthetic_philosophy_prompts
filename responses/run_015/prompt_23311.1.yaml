      *   *Criterion 2: Equalized Odds (Error Rate Balance).* False Positive Rate (FPR) and False Negative Rate (FNR) are equal across groups. (Meaning: The *errors* are distributed equally).
      *   *The Impossibility:* If Base Rates differ, you generally can't have both Calibration and Equalized Odds (unless the predictor is perfect or trivial).
