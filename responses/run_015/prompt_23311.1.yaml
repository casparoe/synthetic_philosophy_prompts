      *   Make sure the verdict links back to the "field biologist" perspective—observation of reality vs. classification systems.
      *   *Key Insight to emphasize:* Base rates are not "God-given." They are outcomes of social systems. The impossibility theorem freezes current inequality into the math.

  6.  **Writing the Essay:** (Proceeding to generate output based on these thoughts.)
      *   *Title:* Needs to be engaging. "The Taxonomy of Harm."
      *   *Opening:* Validate the user's intuition about the ProPublica/Northpointe debate.
