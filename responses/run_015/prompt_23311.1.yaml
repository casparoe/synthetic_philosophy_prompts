          *   Strength: Highlights the cost. Prevents hiding behind "technical neutrality."
      *   **The Verdict (The Hard Part):** I need to pick one.
          *   *Option A:* It's just definitions. (Too dismissive of the real-world impact).
          *   *Option B:* It's a substantive impossibility of *simultaneous* fairness. (Stronger).
          *   *Decision:* The "Substantive" view is stronger. Why? Because definitions in policy aren't like math definitions; they allocate harm. The impossibility result isn't a linguistic trick; it's a discovery about the structure of statistical discrimination under inequality. It shows that *perfect* fairness is impossible given existing base rate disparities (which often reflect historical injustice).
      *   **Implications for Institutions:**
