  hi, im in a philosophy of perception module and we've hit a wall with disjunctivism versus the argument from illusion. the disjunctivists say veridical seeing and hallucinating are totally different mental kinds, but the other camp just keeps pointing to subjective indistinguishability and insisting there must be a common factor. we've circled this for three seminars now and nobody moves. is this actually a hidden metaphysical dispute about what consciousness is, or are they answering different questions—one about ontology, one about epistemic access—under the same heading? heres my hunch: the deadlock might come from both sides treating 'illusion' as one uniform phenomenon, when actually misperceiving a stick as bent and having a full-blown hallucination of a stick are structurally different, and the argument only really bites for one case. if thats right, does it break the stalemate or just relocate it? i want a proper diagnosis—what kind of disagreement is this really, and what distinction or case study would actually shift it—not another survey of the literature. please answer in british english and dont just list citations, i want reasoning.
