prompt: |-
  Hi. Please answer this as someone who is genuinely at home both in the philosophy of time and in how inheritance law actually works on the ground, and think it through properly rather than giving me a hot take — I'd rather you started by pulling the practice apart into its separate little rules and asking what each of them actually needs, before you commit to a reconstruction.

  I work in a probate clerk's office (not a lawyer, I do the filings and the letters), and my brother-in-law, an astrophysics postdoc who will not shut up at Sunday dinner, has gone and broken my job. The thing I deal with constantly is survivorship: two people die in the same house fire or the same car crash and everything — who inherits, whose relatives get what, whether the property gets taxed twice on the way down — turns on who died first. There's a uniform act a lot of US states adopted (I'm fairly sure it's called the Uniform Simultaneous Death Act) which says that if two people die within 120 hours of each other and the will doesn't say otherwise, each is treated as having predeceased the other: as I understand it that applies even when the order is perfectly well known, and the point is just administrative, to stop property passing twice and getting taxed twice. But life insurance does the opposite in what looks like the very same situation: insured and beneficiary die together, no backup beneficiary named, and the insured is presumed to have outlived the beneficiary so the money goes through her estate. So in one corner of the practice we refuse to use an order we know, and in the other we invent an order we don't know. I'd like that asymmetry explained, but the real question is my brother-in-law's. He says relativity means there's no fact of the matter about whether two distant events are simultaneous, and he gave me some argument I only half followed — that depending on which direction you're walking, your "now" slices through a different set of far-away events, so that for one person some event millions of light-years off hasn't happened yet while for someone strolling the other way it's already in the past, and that this is supposed to show the future is already sitting there, all of it, as real as the present.

  Here's the case I made up at work and can't stop thinking about. One beneficiary dies in a hospital in Cleveland; another dies on a research station on Mars. Their deaths are logged by synchronized atomic clocks thirty seconds apart. Light takes somewhere between a few minutes and twenty minutes to cross between Mars and Earth depending on where the planets are, so he says the two deaths are "spacelike separated" and that there are frames in which the Cleveland one dies first and frames in which the Mars one does. Now the 120-hour rule shrugs at this, but a will leaving everything "to my sister if she survives me" doesn't, neither does the rule that a killer can't inherit from the person they killed, and neither does that insurance presumption. So: does this whole area of law presuppose that there is an absolute, frame-independent fact about who died first? Or does it only need a conventional one — and isn't legal time (time zones, the jurisdiction's official clock) already exactly that sort of convention, a choice of frame and not even an inertial one? And then the bit that really bothers me: if the block-universe picture is right and my niece's death in 2055 is already there in the block, what happens to the parts of law that seem to need the future to be open — statutes that take effect next January, sentencing that's supposed to deter, a will that disposes of property "from and after my death"? Please don't just hand me a label — "oh, that's eternalism" — and stop. What I want is the carving: which bits of the practice strictly presuppose a metaphysics of time, which bits merely sit comfortably with one, which bits several rival theories would license equally well, and what would actually have to change in the rules if we took the physics seriously versus what would survive untouched because it never depended on the disputed part. Don't give me case names, statutes to look up, or a reading list — I'm on a break and I can't search anything from here.
