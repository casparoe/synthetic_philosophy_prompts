answer: |-
  This is a wonderful problem because it sits exactly at the friction point between how the world *is* (physics) and how we agree to *manage* the world (law). You are right to feel that asymmetry in the rules is suspicious, but your brother-in-law is making a category error about what the law is trying to do.

  To answer this properly, we need to do exactly what you suggested: pull the probate practice apart into its component rules, ask what work each rule is actually doing, and then see if that work collapses under relativity or eternalism.

  ### 1. Disaggregating the Legal Rules

  You deal with three distinct mechanisms that look like they are about "time," but are actually about different things.

  **A. The 120-Hour Rule (Administrative Finality)**
  This rule (often codified in versions of the Uniform Simultaneous Death Act) says: if we can't easily tell who died first, or if they died within this window, we pretend they died simultaneously.
  *   **What it needs:** It does *not* need a metaphysical fact about who died first. It needs a *cut-off*.
  *   **Why it exists:** It prevents "double administration." If Husband leaves Wife everything, and Wife leaves her sister everything, and they die together, without this rule, the property passes to Wife (tax event #1, administration #1) and then immediately to Sister (tax event #2, administration #2). The rule collapses the chain.
  *   **Metaphysical load:** Zero. It is a procedural fiction. It explicitly overrides physical reality for the sake of administrative cleanliness. It says, "Even if we knew Husband died 10 seconds before Wife, we will treat them as simultaneous to stop the paperwork from doubling."

  **B. The Life Insurance Presumption (Asset Retention)**
  You noted the asymmetry: in insurance, if the insured and beneficiary die together, the insured is often presumed to have survived.
  *   **What it needs:** A tie-breaker that aligns with contractual intent.
  *   **Why it exists:** This is usually about keeping the money in the insured's bloodline. If the insured is presumed to die *first*, the money goes to the beneficiary's estate (and potentially to the beneficiary's new spouse or different heirs). If the insured is presumed to survive, the money stays in the insured's estate (going to the insured's contingent beneficiaries or children).
  *   **Metaphysical load:** Zero. This is a rule of construction, not a finding of fact. It is the court saying, "We know you didn't plan for this, so we are going to guess what you would have wanted." It invents an order to satisfy a policy goal.

  **C. "Survives Me" Clauses and Slayer Statutes (Causality and Condition)**
  This is the hard one. A will says, "To my sister if she survives me." Or a statute says, "A killer cannot inherit from the victim."
  *   **What it needs:** A binary state of affairs. Either the condition is met, or it isn't.
  *   **Why it exists:** Property rights must vest. Title cannot be in limbo. In the slayer case, it requires *causation*. You cannot kill someone who is already dead.
  *   **Metaphysical load:** High. This requires an ordering of events that supports causality.

  ### 2. The Cleveland/Mars Scenario: Absolute vs. Conventional Time

  Now we apply your brother-in-law's physics. In his scenario, the deaths are "spacelike separated." This means light from Cleveland cannot reach Mars before the Mars death occurs, and vice versa. In Special Relativity, there is no frame-independent fact about which happened first. Some observers see Cleveland first; some see Mars first.

  **Does the law presuppose an absolute fact?**
  No. The law presupposes a *jurisdictional* fact.

  When you file a death certificate in your probate office, you are not recording "God's Time." You are recording "Civil Time." Civil time is a convention, exactly as you suspected. It is a choice of frame. Specifically, it is a choice of the *Earth-centric, jurisdiction-local* frame.

  If the Cleveland death is recorded at 12:00 EST and the Mars death is transmitted and recorded at 12:00:30 EST, the law treats Cleveland as first. Why? Not because Cleveland *really* was first in the block universe. But because the legal system is a coordination game played by humans on Earth. We need a single ledger.

  **The "Choice of Frame"**
  You asked if legal time is a choice of frame. Yes. It is a non-inertial, Earth-bound, bureaucratic frame.
  *   **For the 120-Hour Rule:** The frame doesn't matter. The rule swallows the difference.
  *   **For the "Survives Me" Clause:** The frame matters immensely, but only the *legal* frame. If the will is probated in Ohio, Ohio time governs. If the will is probated in a future Mars colony, they will have to adopt a convention (likely Earth transmission time or local Mars time).

  **The Asymmetry Explained**
  The asymmetry you see (ignoring known order in probate vs. inventing order in insurance) isn't about physics. It's about *who gets the money*.
  *   In probate (120-hour rule), the goal is to stop the property from moving twice. So we freeze the transfer.
  *   In insurance, the goal is often to keep the premium value with the purchaser's heirs. So we force a transfer order.
  Neither rule is trying to describe the spacetime interval. They are both distributing assets based on policy.

  ### 3. The Block Universe and the "Open Future"

  This is the part that keeps you up at night. If your brother-in-law is right about Eternalism (the Block Universe)—that 2055 is just as real as 2024, just located at a different time-coordinate—does that break the law?

  Specifically: How can a statute take effect "next January" if next January already exists? How can sentencing "deter" if the crime is already fixed in the block? How can a will dispose of property "after my death" if the death is just a coordinate?

  Here is the carving you asked for.

  **A. What Survives Untouched (Indexicals and Perspective)**
  Most legal language is *indexical*. It depends on the speaker's location in the block.
  *   "I am here" is true even if space is a block.
  *   "It is now 2024" is true even if 2055 is real.
  *   "From and after my death" is a coordinate marker. It means "For all time-coordinates $t$ such that $t > t_{\text{death}}$."

  The Block Universe does not erase the difference between $t_1$ and $t_2$. It just says both $t_1$ and $t_2$ exist. The law operates from the perspective of an agent *inside* the block. When a judge signs an order, they are at a specific coordinate. The order applies to coordinates "ahead" of them. This works perfectly well in Eternalism. You don't need the future to be *ontologically open* (unwritten) for it to be *epistemically open* (unknown to the agents).

  **B. What Needs Adjustment (Causality and Liability)**
  This is the only place where the physics bites.
  *   **Slayer Statutes:** As mentioned, these require causality. In relativity, causality is preserved. If A kills B, A's action must be in B's past light cone. They cannot be spacelike separated. If they were spacelike separated, A could not have killed B. So, for any valid legal claim of "killing," the physics *must* show a timelike separation. In those cases, all reference frames agree on the order. The law is safe here because it only punishes timelike interactions.
  *   **Deterrence:** This is the hardest philosophical nut. If the future is fixed, why punish?
      *   *The Legal Answer:* The law doesn't care about metaphysical freedom. It cares about *causal leverage*. Even in a block universe, the threat of punishment is a cause that influences the decision-making process of the agent. The "choice" the agent makes is a real event in the block. The law is just another variable in the equation that determines which path the agent takes.
      *   *The Metaphysical Answer:* Compatibilism. You can have determinism (or a fixed block) and still have "responsibility" defined as "acting according to one's own internal reasoning without external coercion." The law regulates coercion and reasoning. It doesn't need magic free will.

  **C. What Would Actually Change (If We Took Physics Seriously)**
  If we truly had to account for relativistic frames in probate (e.g., significant populations living in high-velocity travel or different gravity wells):
  1.  **We would need a "Legal Simultaneity Convention."** Just like we have Time Zones, we would need a statutory definition of "Simultaneous." Likely, it would be based on signal reception time at a central registry.
  2.  **We would abandon "Moment of Death" for "Registration of Death."** The law already leans this way. For many purposes, you aren't legally dead until the certificate is filed. Shifting the metaphysical weight from the biological event to the administrative record solves the relativity problem. The record happens at a specific place and time in the court's jurisdiction. That is an invariant fact *for the court*.

  ### 4. Reconstruction

  So, to answer your core question: **Does this area of law presuppose an absolute, frame-independent fact about who died first?**

  **No.** It presupposes a *authoritative* fact.

  The law is not a theory of physics; it is a system of norms. It needs *resolution*, not *truth*.
  *   When the 120-hour rule ignores a known order, it is prioritizing *tax efficiency* over *physical accuracy*.
  *   When the insurance rule invents an order, it is prioritizing *contractual intent* over *physical accuracy*.
  *   When the court accepts a death certificate timestamp, it is prioritizing *jurisdictional authority* over *relativistic frames*.

  Your brother-in-law is right that there is no "fact of the matter" in the universe about the Mars/Cleveland order. But the law creates a fact of the matter by fiat. "For the purposes of this State, the clock in the County Clerk's office is the master clock."

  **The "Open Future" Worry**
  You asked what happens to laws that need the future to be open.
  Nothing happens to them. They continue to function because they are instructions for agents navigating the block.
  *   "Statute effective Jan 1" is a signpost. It tells you where you are relative to the rule.
  *   "Deterrence" is a causal mechanism. It works within the block.
  *   "Wills" are instructions for the executors who exist at $t_{\text{death}} + \epsilon$.

  **The Bottom Line for Your Job**
  You don't need to worry about the block universe breaking your filings. The law is robust because it is *conventional*. It creates its own time.
  *   If the physics says "simultaneity is relative," the law says "simultaneity is what the statute says it is."
  *   If the physics says "the future is real," the law says "the future is where we are going."

  The asymmetry you see isn't a bug in the system's understanding of time; it's a feature of the system's understanding of *money*. One rule saves on taxes (probate); the other saves on litigation (insurance). Neither is trying to map spacetime. They are trying to map wealth transfer.

  Your brother-in-law is describing the map. You are driving the car. The car doesn't care about the projection of the map, only that the road rules are consistent. As long as everyone agrees on which clock counts, the titles pass, the taxes are paid, and the block universe can be whatever it wants to be.
