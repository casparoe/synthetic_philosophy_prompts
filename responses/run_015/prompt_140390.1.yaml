  Stance choice is not reality. Reality is mind-independent compression + robustness. Stance is agent-relative utility. They are distinct questions.
  Case 5 (LLM): Pattern is real if it compresses. Intentional stance is optional; use it if it saves cognitive labor compared to design stance. You can be realist without being moralist.
  Case 6 (Corp): Both intention and belief are real patterns. Choose stance based on audience. Legal contexts demand intentional stance; internal audits might prefer design.
  This separation resolves your tension: You can be a realist about LLM beliefs (Case 5) without granting them rights, and realist about corporate beliefs (Case 6) without anthropomorphizing. The stance is a tool, not a metaphysical commitment. Picking a stance is never the same question as whether the pattern is real. One describes the world; the other describes your interface with it. Keep them separate.
