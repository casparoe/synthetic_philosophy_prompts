  Here is a proposal for your closing slide. It uses a fresh, departmental case study (course evaluations) that avoids Kant's original four examples and the murderer-at-the-door scenario. It is structured to run the same setup twice with only the *End* changed, flipping the failure from Contradiction in Conception (CC) to Contradiction in the Will (CW).

  ### Slide Content

  **Title:** Two Maxims of the Polite Student

  **Maxim 1:**
  > "When I submit an **anonymous** course evaluation (C), I will **sign my name** (A) in order to **ensure the professor knows it's me** (E)."
  > *   **Universalize:** Everyone signs their anonymous evaluations.
  > *   **Result:** The form is no longer anonymous. The practice of "submitting an *anonymous* evaluation" becomes logically impossible.
  > *   **Verdict:** **Impermissible (Contradiction in Conception)**

  **Maxim 2:**
  > "When I submit an **anonymous** course evaluation (C), I will **rate every category '5/5'** (A) in order to **be supportive of the professor** (E)."
  > *   **Universalize:** Everyone rates every category '5/5'.
  > *   **Result:** The data loses all discriminatory power. The evaluation system becomes useless for improvement or hiring.
  > *   **Verdict:** **Impermissible (Contradiction in the Will)**

  **Punchline:**
  > "The first maxim breaks the **form**. The second maxim breaks the **curve**. One is a contradiction in conception; the other is a contradiction in your transcript."

  ***

  ### Pedagogical Note for the Lecturer

  **Reading of the Test:**
  This joke assumes a **hybrid reading**, but it leans heavily on the **Strict Logical Reading** for Maxim 1 and the **Practical Teleological Reading** for Maxim 2.

  *   **Maxim 1 (CC):** This works best on the *Strict Logical* reading. If everyone signs an "anonymous" form, the concept "anonymous signed form" becomes an oxymoron. The practice destroys itself conceptually. If you switch to a purely *Practical* reading (could you physically sign the paper?), the contradiction vanishes, and the joke fails.
  *   **Maxim 2 (CW):** This works on the *Practical Teleological* reading. It is logically *conceivable* that everyone gives 5/5 ratings (the system doesn't crash), but a rational agent cannot *will* this because it undermines the very purpose of the evaluation (improvement/assessment), which the agent themselves relies on.

  **Teaching Opportunity:**
  If a student asks, "But couldn't I just will a world where everyone gets 5/5?" you can use the second half of the punchline ("breaks the curve") to explain that CW failures aren't about logical impossibility, but about undermining the conditions necessary for your own ends (e.g., needing accurate data to choose good classes/professors in the future). If you collapse the two distinctions, the punchline lands flat because "breaking the form" and "breaking the curve" become the same kind of error—which, for Kant, they are not.
