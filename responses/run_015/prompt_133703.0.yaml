answer: |-
  Subject: Plan for the epistemic injustice session

  Hi there,

  It is completely understandable that your colleague is skeptical, because without the structural lens, epistemic injustice does sound like a pretentious way to describe being dismissed. To shift her view from personal rudeness to structural unintelligibility within forty minutes, you need to严格控制 the sequence of concepts so that the structural claim lands only after she has felt the frustration of the vocabulary gap. You should start the first ten minutes by validating her intuition that being ignored feels personal, but then immediately pivot to the idea that there is a difference between someone refusing to hear you and a system having no frequency to receive your signal. Do not define hermeneutical injustice yet. Instead, ask her to imagine a scenario where a person is speaking clearly and the listener is willing, but the language itself lacks the concepts to carry the meaning. This sets the stage for the carrying example without triggering her defenses about privilege or bias too early.

  For the core of the session, you will use a single carrying example built around algorithmic welfare eligibility, and it is vital that you construct this scenario with specific constraints to prevent it from collapsing into a standard critique of bias. The example must contain a specific lived reality, such as a caregiver managing a fluctuating chronic illness without a formal diagnosis, who is trying to justify their inability to meet work requirements. The system must offer categories like employed, unemployed, or disabled, but none of these fit the caregiver's reality of intermittent care work that is not medically codified. What this example absolutely must lack is any indication of racial profiling, malicious coding, or specific prejudice against the applicant's identity group. If you allow the algorithm to be biased against a specific demographic, she will categorize this as discrimination rather than hermeneutical smothering. The system must appear neutral and efficient, designed to help, yet still render the applicant's situation unformulable because the ontology of the form does not include a box for informal care labor. You need her to see that the violence is done by the categories themselves, not by the people managing them.

  As you walk through this example, you will encounter three specific misconceptions in sequence, and you need to head each one off at a precise moment in the arc. The first misconception will arise almost immediately, where she suggests this is just testimonial injustice with extra steps, meaning she will argue the system just doesn't believe the applicant. You must head this off before the example analysis deepens, specifically when you first describe the applicant speaking to the caseworker. Clarify that testimonial injustice is about credibility deficits where the hearer discounts the truth due to prejudice, whereas here the hearer might believe her completely but still cannot process the claim because there is no administrative code for it. If you do not draw this line early, she will retreat to the idea that we just need to trust the poor more, which misses the structural point.

  The second misconception will emerge during the deep dive into the algorithmic constraints, where she will argue that this situation requires malicious intent or negligent design by the bureaucrats. You need to intercept this while you are explaining why the boxes exist as they do. Explain that the categories were likely created for efficiency and standardization by people who thought they were being helpful, not harmful. The point is that hermeneutical smothering occurs even when everyone is trying their best, because the collective vocabulary lagged behind the lived reality. If you let her fixate on intent, the session becomes about blaming designers rather than understanding the structural gap. The third misconception will surface near the conclusion when she proposes that fixing it just means giving the applicant a voice or a chance to explain her story in an interview. You must head this off before you move to the final check. Explain that giving her a voice does not solve the problem if the output of that voice still cannot be translated into a decision rule. The system cannot act on a story it cannot categorize, so the solution requires changing the categories, not just listening harder.

  For the final five minutes, you need a single check to prove she has grasped the structural unformulability part and has not just empathized with the applicant. Do not ask her how the applicant feels. Instead, ask her to design a new data field that would resolve the injustice without requiring the caseworker to use discretion. If she suggests a field like other or manager approval, she has failed because that relies on individual interpretation. If she suggests a specific category like informal care credit with defined parameters, she has succeeded because she has expanded the hermeneutical resource. This forces her to engage with the architecture of the system rather than the emotions of the subject.

  Finally, regarding Miranda Fricker's original framework, you should be explicit that you are deliberately leaving out the virtue ethics component of her work. Fricker spends significant time on the responsibility of the individual hearer to cultivate virtues like testimonial justice to correct these injustices. In this session, you are skipping that entirely because focusing on the individual virtue of the caseworker or the designer distracts from the institutional ontology you are trying to highlight. Admit to her that you are bracketing the individual moral responsibility piece to focus strictly on the structural hermeneutical resources, otherwise she will try to solve a structural problem with individual sensitivity training. If you follow this order and maintain these constraints on the example, you should be able to move her from seeing this as fancy talk about rudeness to understanding it as a specific kind of structural silence.

  Best of luck with the session.
