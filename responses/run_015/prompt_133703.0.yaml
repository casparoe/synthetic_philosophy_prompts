  i'm prepping a session for a sociology colleague who keeps saying epistemic injustice is just fancy talk for being ignored, and i want to walk her through why the hermeneutical kind is structurally different rather than personally rude. the specific idea i'm trying to get across doesn't have a clean name in the standard texts, so i'm calling it institutional hermeneutical smothering: it's the situation where a bureacratic vocabulary like welfare risk scores doesn't merely misrepresent someone's lived situation but actually renders that situation unformulable inside the system's own categories. i need a teaching plan for about forty minutes, not the lecture itself. tell me the exact order the pieces have to come in so she can see why being ignored misses the point—what has to land first before the structural claim even makes sense. pick one carring example built around algorithmic welfare eligibility and specify what that example must contain and what it absolutely must lack, otherwise it collapses into the computer is biased. then map the misconceptions she'll hit in sequence: first that this is testimonial injustice with extra steps, then that it requires malicious intent, then that fixing it just means giving her a voice. for each one say precisely where in the arc i should head it off before it hardens. i also want a single check at the end that proves she's grasped the structural unformulability part and hasn't just empathized with the applicant. be explicit about which part of Miranda Fricker's original framework i should deliberately leave out at this level and just admit i'm skipping it. please write everything in continuous prose only—no headings, bullet points, bold text, or tables, exactly like a long email—and don't include any reading lists or citations. there's a typo or two in this message but you get the idea.
