answer: |-
  **Project Title:** Standing Fast Together: Institutional Hinges and the Structure of Distributed Revision

  **1. Core Research Question**
  Do collective epistemic commitments function as "hinges" with a structure distinct from individual certainty, and if so, how is rational revision possible for these collective hinges?

  Standard hinge epistemology (following Wittgenstein's *On Certainty*) treats hinges as the scaffolding of an individual's world-picture—propositions like "the earth exists" that must stand fast for me to doubt anything else. My project asks whether research collectives (e.g., scientific labs, clinical teams) operate with *institutional hinges*: propositions that function as standing-fast conditions for the group's practice even if no single member individually holds them as certain. Specifically, I want to know if the mechanism for revising these collective hinges differs from individual revision. I'm proposing a model of "distributed anomaly," where a hinge is undermined not by a single decisive counter-example, but by a pattern of misfit across the collective that no single agent notices.

  **2. The Gap: Beyond Individualism and Aggregation**
  Current literature on hinge epistemology is overwhelmingly individualistic. Even social extensions tend to treat group certainty as an aggregate of individual beliefs or focus on testimony and trust between agents. This misses the structural role of practices in institutions. In a lab, a calibration standard might function as a hinge for the *production of data* even if individual researchers privately suspect it's driftng. They don't need to believe it for the practice to rely on it.

  There's a risk here of sliding into sociology of science. The sociological description says, "labs behave as if they believe X." The epistemological question I'm asking is normative: "Are they *rationally* permitted to treat X as a hinge, and what counts as evidence against X?" If I only describe the social mechanism, I've left philosophy. If I can show that collective hinges have different *conditions of rationality* than individual ones (e.g., requiring distributed anomaly rather than direct falsification), then this remains epistemology. The gap is that we currently lack a framework for evaluating the rationality of commitments that are held by the *system* rather than the *subject*.

  **3. Methodology and Work Plan (12 Months)**
  I'm breaking this into three phases: conceptual mapping, case analysis, and framework construction.

  *   **Months 1–3: Conceptual Groundwork.**
      *   Refine the definition of "institutional hinge" vs. "shared individual hinge."
      *   Map existing social epistemology literature to ensure I'm not reinventing the wheel on joint commitment (Gilbert et al.) or group belief (List & Pettit). The key distinction is that institutional hinges might not require belief at all, only functional reliance.
      *   Draft the distinction between "sociological description" and "epistemic normativity" to secure the philosophical boundary.

  *   **Months 4–6: Case Studies.**
      *   Select 2–3 concrete examples. The primary case will be scientific calibration standards (as per my initial intuition). Secondary cases might include legal precedents or financial auditing standards.
      *   Analyze these cases to identify moments where the "hinge" shifted. Did it shift because one person proved it wrong (individual falsification), or because the system accumulated noise (distributed anomaly)?
      *   Conduct informal interviews with researchers (if accessible) to gauge the gap between private doubt and public reliance.

  *   **Months 7–9: Modeling Distributed Anomaly.**
      *   Develop the formal account of "distributed anomaly." How does noise aggregate to become rational grounds for revision without any single agent having decisive evidence?
      *   Test this model against the failure conditions (see below).
      *   Write the core chapters arguing that collective hinges have a different revision structure than individual ones.

  *   **Months 10–12: Synthesis and Dissemination.**
      *   Complete the dissertation chapter or monograph draft.
      *   Prepare two conference papers: one on the definition of institutional hinges, one on the revision model.
      *   Finalize the fellowship report.

  **4. Success and Failure Conditions**
  Since this is exploring a structural claim, I need clear metrics for whether the project holds water.

  *   **Positive Result (Success):** I successfully demonstrate that institutional hinges are not reducible to the sum of individual beliefs. I show a case where a collective was rational to maintain a hinge despite individual doubts, or rational to revise a hinge despite no individual having decisive falsifying evidence (via distributed anomaly). The framework distinguishes clearly between "social pressure to conform" and "epistemic reliance on a hinge."
  *   **Failure Condition A (Collapse):** If it turns out that every institutional hinge can be fully explained as "most individuals believe this," then the project collapses into standard individual hinge epistemology. There is no distinct collective structure.
  *   **Failure Condition B (Indistinguishability):** If "distributed anomaly" cannot be distinguished from ordinary peer disagreement or standard inductive reasoning, then the model adds no value. I need to show that distributed anomaly triggers revision in a way that individual evidence cannot.
  *   **Failure Condition C (Sociological Drift):** If I cannot articulate the *normative* force of these hinges (i.e., if I can only say "this is how labs behave" rather than "this is how they *ought* to reason"), the project becomes sociology. I need to maintain the epistemic evaluation throughout.

  **5. Scope and Feasibility**
  I am limiting the scope to technical/scientific collectives where measurement and calibration are central. This avoids the messiness of broader cultural worldviews (e.g., religious or political hinges) for now, allowing for clearer examples of "standing fast" conditions. The timeline is tight but realistic because the core intuition is already developed; the year is for rigorizing the definitions and testing the failure conditions. I'm not attempting to solve the problem of other minds or full-blown social ontology, just the specific mechanics of collective certainty and revision.

  **6. Why This Matters**
  If collective hinges exist and operate differently than individual ones, it changes how we understand scientific progress and institutional rationality. It suggests that rationality isn't just a property of agents, but of practices. This offers a way to bridge the gap between Wittgensteinian epistemology and science studies without losing the normative grip of philosophy. It moves hinge epistemology out of the head and into the lab.
