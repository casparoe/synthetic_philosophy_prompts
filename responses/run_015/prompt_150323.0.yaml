      *   *The Tautology:* Address the "outcome defines disease, disease predicts outcome" circle. This is the weak point in his logic.
      *   *The Looping Effect:* Apply Hacking. Kraepelin treats patients as objects (natural kinds), but they are subjects (human kinds). The "silence" interpretation is a perfect example of how the *observer* constructs the data.
      *   *Institutional Factors:* Mention the asylum context. Dropping out or going silent wasn't just symptoms; it was a reaction to the system Kraepelin worked within.
