      *   Avoid terms like "ontological commitment," "teleological suspension," "phenomenological reduction" unless explained simply.
      *   Tone: Conversational, reflective, honest.

  3.  **Task 1: What does this practice make people do?**
      *   They have to lie (or stretch the truth).
