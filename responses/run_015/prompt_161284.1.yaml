answer: |-
  **Preliminary Reflection**

  The crux of this topic lies not in the regress itself, but in the *type* of responsibility the regress is meant to undermine. Strawson targets *ultimate* moral responsibility (grounding basic desert), which is binary: you either have it or you don't. Your "ampliative self-creation" proposal introduces a *scalar* notion of self-determination. A merely competent answer will recount the regress; a distinguished answer will recognize that making the regress benign requires shifting from a binary conception of responsibility (Strawson's) to a scalar one (yours), thereby potentially conceding Strawson's point about desert while saving a compatibilist surrogate.

  **Note on Your Formulation**

  Your formulation faces a significant hurdle: Strawson's "zero times zero" objection holds if the property in question is *ultimate origination*. If the initial character is not ultimately originated by the agent, no amount of internal reorganization grants *ultimate* origination. The "structural novelty" reply works only if you argue that *responsibility* supervenes on structural unity rather than ultimate origination. I have adjusted the exam question to force candidates to confront this trade-off explicitly. The question now asks them to evaluate whether this model defeats Strawson or merely changes the subject from "ultimate desert" to "degrees of autonomy." This protects the question from being answered by simply asserting the novelty claim without addressing the desert implication.

  ***

  ### PhD Comprehensive Examination: Moral Responsibility
  **Time Allowed:** 60 Minutes
  **Total Marks:** 20

  **Question:**

  Consider the following objection to Galen Strawson's Basic Argument. Call it the **Ampliative Self-Creation Model**. Grant Strawson that no agent is *causa sui* and that every act flows from prior character. However, suppose an agent's acts can reorganize her subsequent character—reducing akrasia, installing second-order policies, unifying motives—such that later acts express her agency to a higher degree than earlier ones. Model this as a scalar quantity, **Degree of Self-Determination (DSD)**, which rises over time without ever reaching 1. On this view, the regress is benign because responsibility requires not an uncaused first link, but a sequence where later links are increasingly the agent's own.

  In a unified essay, address the following:
  1.  Explain what distinguishes a vicious regress from a benign one in this context, and specify what must be true about the transmission of agency for the Ampliative Model to succeed against the Strawsonian reply that "amplification from a base of zero stays zero."
  2.  Evaluate whether a scalar DSD secures the kind of moral responsibility that supports basic desert, or whether this model changes the subject to a non-desert-based surrogate that Strawson could accept without abandoning his conclusion.

  *Constraint: Your answer must not rely on premises regarding causal determinism or the Consequence Argument. This issue is intended to hold regardless of whether determinism is true.*

  ***

  ### Model Answer

  The Basic Argument asserts that ultimate moral responsibility requires being the ultimate cause of oneself (*causa sui*), which is impossible. The Ampliative Self-Creation Model attempts to bypass this by treating responsibility as scalar rather than binary. To evaluate this, we must first distinguish the nature of the regress. A regress is vicious if it demands an impossible condition for the phenomenon to exist at all; it is benign if the infinite chain does not preclude the phenomenon's existence. Strawson treats the regress as vicious because he defines responsibility as requiring an ultimate starting point owned by the agent. For the Ampliative Model to render the regress benign, it must redefine responsibility such that it does not require an ultimate starting point, but rather a specific structural relation between links in the chain.

  The Strawsonian objection—that multiplying zero ownership by any factor yields zero ownership—assumes that agency is a conserved quantity transmitted from prior states. If the initial character is not "yours," nothing derived from it is "yours." For the Ampliative Model to succeed, it must deny conservation. It must argue that self-organization generates *new* agential structure not present in the prior motives. When an agent installs a second-order policy to unify conflicting desires, the resulting unity is a property of the system that did not exist in the disparate desires themselves. If responsibility supervenes on this structural unity rather than on historical origination, then later states can possess a property (agency) that earlier states lacked, even if causally derived from them. This breaks the "zero times zero" logic by changing the multiplicand: the operation is not transmitting ownership, but generating structure that constitutes ownership.

  However, this success comes at a cost regarding desert. Strawson's argument targets *basic desert*: the kind of responsibility that makes an agent truly deserving of praise or blame simply in virtue of having performed an action, independent of consequentialist considerations. Basic desert is traditionally binary; one is either liable or not. The Ampliative Model offers a scalar DSD. If responsibility comes in degrees, it is unclear how it grounds basic desert, which seems to require a threshold of ultimate control. If an agent's DSD is 0.8, are they 80% deserving of blame? This conceptual mismatch suggests the model changes the subject. It secures a notion of *autonomy* or *competence*—the agent is more fully the source of the action in a psychological sense—but it does not secure *ultimate* origination.

  Strawson could accept this model without conceding his main point. He could agree that agents achieve higher degrees of psychological unity and self-government over time while maintaining that none of this yields ultimate moral responsibility. The "new structure" is still causally dependent on initial conditions the agent did not choose. Unless the model claims that structural unity *itself* is sufficient for desert (abandoning the requirement for ultimate origination), it fails to defeat the Basic Argument regarding desert. It merely offers a robust compatibilist surrogate. Thus, the regress is benign only for a revised, scalar concept of autonomy, but remains vicious for the binary concept of ultimate responsibility required for basic desert. The model succeeds only by redefining the target of Strawson's critique.

  ***

  ### Marking Scheme

  **1. Distinction between Vicious and Benign Regress (4 Marks)**
  *   **Hit:** Candidate explains that a vicious regress prevents the phenomenon's existence (requires impossible first cause), while benign allows existence via infinite/structural series.
  *   **Typical Error:** Defines regress generally without applying it to the condition of *agency* or *ownership*.

  **2. Analysis of the "Zero Base" Objection (4 Marks)**
  *   **Hit:** Identifies that the objection assumes agency/ownership is a conserved quantity transmitted from prior states.
  *   **Typical Error:** Treats the objection as merely about causal determinism rather than the transmission of normative ownership.

  **3. Evaluation of the "Structural Novelty" Reply (4 Marks)**
  *   **Hit:** Explains that the reply requires agency to supervene on new structural properties (unity/policies) rather than historical origination.
  *   **Typical Error:** Asserts the reply works without explaining *how* structure generates ownership distinct from prior causes.

  **4. Desert vs. Surrogate Distinction (4 Marks)**
  *   **Hit:** Recognizes that scalar DSD likely fails to ground binary basic desert, implying the model changes the subject to autonomy/competence.
  *   **Typical Error:** Assumes scalar responsibility automatically secures desert or ignores the binary nature of blameworthiness.

  **5. Adherence to Constraints (No Determinism Drift) (4 Marks)**
  *   **Hit:** Argument proceeds without invoking causal determinism, luck, or the Consequence Argument.
  *   **Typical Error:** Falls back on "if determinism is false..." or treats the Basic Argument as identical to the Consequence Argument.

  **Total: 20 Marks**

  **Examiner's Note on Grading:**
  A **B-level answer** will correctly reconstruct the Ampliative Model and explain the regress structure but will likely assert that the model defeats Strawson without adequately grappling with the desert implication. An **A-level answer** will recognize the trade-off: the model saves autonomy only by conceding ultimate responsibility. The A candidate will explicitly state that Strawson can accept the scalar model as a description of psychological growth while maintaining his denial of basic desert, thereby identifying the "change of subject" as the critical philosophical move rather than a solution to the original problem.
