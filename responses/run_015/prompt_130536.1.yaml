answer: |-
  Here is a 15-minute decision procedure designed for a journalist. It strips away the moral outrage and tests the *structure* of the sanction against the philosophical criteria for punishment (drawing on H.L.A. Hart, Joel Feinberg, and standard jurisprudence).

  ### The Punishment Audit (5 Gates)

  **Instructions:** For each gate, gather evidence (public statements, Terms of Service archives, press releases). If you answer **NO** to any gate, the action is likely **not punishment** (it is administrative, preventive, or contractual). If you answer **YES** to all five, it qualifies as punishment.

  **Gate 1: Institutional Authority**
  *   **Question:** Is the sanction imposed by an agent claiming governance authority, rather than a diffuse mob or pure market force?
  *   **Evidence:** Look for an official announcement from an organization (University, Platform, Employer).
  *   **Yes:** An entity with rules claims the right to enforce them.
  *   **No:** A boycott, a stock drop, or a mob harassing someone at home.
  *   *Note:* Private companies count if they claim quasi-public governance (e.g., "Community Standards").

  **Gate 2: Hard Treatment**
  *   **Question:** Does the sanction involve a deliberate deprivation of a good (money, access, status) that the subject would otherwise possess?
  *   **Evidence:** Compare status before and after.
  *   **Yes:** Money removed, invite rescinded, account banned.
  *   **No:** Criticism, bad reviews, or refusal to grant a *new* benefit they never had.

  **Gate 3: Retrospectivity (The Hart Gate)**
  *   **Question:** Is the sanction justified primarily by a **past offense**, or by **future risk**?
  *   **Evidence:** Read the justification. Do they cite a specific violation that *occurred*, or a potential disruption that *might occur*?
  *   **Yes (Punishment):** "You broke Rule X." (Retributive/Deterrence).
  *   **No (Prevention):** "We cannot guarantee safety if you speak." (Preemptive/Administrative).
  *   *Crucial:* Punishment looks backward at guilt; Prevention looks forward at risk.

  **Gate 4: Rule Pre-Existence (The Legality Gate)**
  *   **Question:** Did the specific rule violated exist and was it accessible *before* the act occurred?
  *   **Evidence:** Check Wayback Machine for TOS or Faculty Handbooks at the time of the act.
  *   **Yes:** The rule was on the books.
  *   **No:** The rule was created or interpreted retroactively to catch this specific act.
  *   *Note:* Retroactive sanctions fail the definition of legitimate punishment (Nullum crimen sine lege).

  **Gate 5: Expressive Condemnation (The Feinberg Gate)** **[VALUES FLAG]**
  *   **Question:** Does the language used convey moral blame or indignation, rather than neutral policy management?
  *   **Evidence:** Analyze verbs and nouns in the announcement.
  *   **Yes:** "Violation," "Guilt," "Unacceptable," "Condemn," "Strike."
  *   **No:** "Incompatibility," "Risk," "Alignment," "Business Decision," "Safety."
  *   *Values Flag:* This is where facts end. You must interpret tone. Feinberg argues punishment *must* express condemnation. If the language is purely clinical/economic, it is a sanction, not punishment.

  ***

  ### Test Run: Case 1 (University Speaker)
  **Scenario:** A university rescinds an invitation to a scientist after old tweets resurface.
  **Gut Check:** Feels like punishment/censorship.

  1.  **Authority:** **YES.** (University administration).
  2.  **Hard Treatment:** **YES.** (Loss of speaking fee/platform).
  3.  **Retrospectivity:** **NO.** (Universities almost always frame this as *future* risk: "We cannot ensure a productive environment" or "Campus Safety." They rarely charge the speaker with a specific code violation from 5 years ago).
  4.  **Rule Pre-Existence:** **NO.** (There is rarely a specific rule stating "Tweets from 5 years ago disqualify you from speaking." It is discretionary).
  5.  **Condemnation:** **NO.** (Language is usually "We have decided not to proceed" rather than "We condemn this speech").

  **Verdict:** **NOT PUNISHMENT.**
  **Classification:** **Administrative Exclusion / Risk Management.**
  **Why:** Because it fails Gate 3 and 4. The university is not punishing a past crime; they are managing future liability. It feels like punishment because it hurts, but philosophically, it is a preemptive safety measure, not a penal sanction.

  ***

  ### Test Run: Case 2 (Platform Demonetization)
  **Scenario:** A creator is demonetized for a video that violates a policy added yesterday. (Assume video was uploaded *after* the policy change).
  **Gut Check:** Feels like punishment/unfairness.

  1.  **Authority:** **YES.** (Platform Trust & Safety).
  2.  **Hard Treatment:** **YES.** (Loss of revenue).
  3.  **Retrospectivity:** **YES.** (Notice cites "Violation of Community Guidelines." It targets the act of posting the video).
  4.  **Rule Pre-Existence:** **YES.** (Policy was live before the video was uploaded).
  5.  **Condemnation:** **YES.** (Terminology like "Strike," "Violation," and "Guidelines" implies a breach of duty, not just a business shift).

  **Verdict:** **PUNISHMENT.**
  **Classification:** **Private Penal Sanction.**
  **Why:** It passes all gates. Even though it's a private company, they are acting as a legislature/judge, citing a past breach of rule to impose a penalty with blame language.

  ***

  ### What This Procedure Can't Do

  1.  **It Cannot Assess Justice:** A sanction can be "Punishment" (passes all 5 gates) and still be *unjust* (e.g., the rule was stupid, or the penalty too harsh). This checklist only categorizes the *type* of action, not its moral validity.
  2.  **It Cannot Detect Dog Whistles:** If an institution uses "Safety" language (Gate 3: No) but privately intends to blame (Gate 5: Yes), this checklist relies on public evidence. It cannot read minds.
  3.  **It Cannot Resolve the "Private State" Debate:** Philosophers disagree on whether private companies *can* punish. This checklist assumes they *can* if they mimic the structure of punishment (Gate 1), but a strict legal positivist might argue only the state punishes.

  ### The Tie-Breaker Case: Expressive vs. Retributive

  You asked for a case that distinguishes whether you are running an **Expressive Model** (Feinberg) or a **Retributive Model** (Kant/Moore).

  **The Case:** **The Secret Fine.**
  An authority takes money from a person's account for a violation but tells *no one*—not the public, and not even the person (they just notice less money later).

  *   **Run the Checklist:** It has Authority, Hard Treatment, Retrospectivity, Rules.
  *   **The Divergence:**
      *   **Retributive Model:** **YES, it is punishment.** The offender suffered a deprivation they deserved. The pain is the point.
      *   **Expressive (Feinberg) Model:** **NO, it is not punishment.** Feinberg argues punishment is a "conventional device for the expression of attitudes of resentment and indignation." If no one knows, no condemnation is communicated. It is merely a tax or a theft.

  **How to use this:** If you look at a sanction and ask, "Does this count if no one knows?" and you say **No**, you are using an Expressive model. If you say **Yes**, you are using a Retributive model. This matters when writing about "shadow bans" or quiet firings.
