answer: |-
  The puzzle you identify lies at the structural core of modern cause-prioritization frameworks, particularly those associated with the Effective Altruism (EA) community (e.g., Open Philanthropy, 80,000 Hours). The tension you perceive between the *between-cause* rubric (Importance × Tractability × Neglectedness, or ITN) and the *within-cause* metric (counterfactual cost-effectiveness) is not a bug, but a feature of a system attempting to balance epistemic humility with maximization pressure.

  Here is a reconstruction of the implicit theory, an analysis of the rubric's philosophical commitments, and an evaluation of your proposed alternative.

  ### 1. Reconstructing the Implicit Theory

  The ITN framework presupposes a specific economic and philosophical model of philanthropy.

  **A. The View of Value: Impartial Consequentialism**
  The framework strictly requires **commensurability**. It assumes that value created in global health, animal welfare, and existential risk reduction can be expressed in a common numéraire (often "well-being units" or "lives saved"). It presupposes **cause-neutrality**: the identity of the beneficiary matters only insofar as it affects the total quantity of value. The "impartiality" you note is foundational; if a funder believed they had special obligations to their community, the "Importance" factor would be weighted by proximity, breaking the model.

  **B. The Funder's Role: The Marginal Price-Taker**
  The framework views the funder not as a partner or a grantmaker in the traditional sense, but as a **marginal buyer of impact**.
  *   **Importance ($I$):** The total value of solving the problem (the size of the market).
  *   **Tractability ($T$):** The elasticity of the problem. In formal reconstructions (e.g., by Owen Cotton-Barratt), this is usually defined not as "impact per dollar" directly, but as the **percentage of the problem solved by a doubling of resources**.
  *   **Neglectedness ($N$):** The inverse of current funding. This captures **diminishing returns**.

  **The Resolution to Your Redundancy Puzzle:**
  You asked why Neglectedness is needed if Tractability is already "marginal dollar." In the strict theoretical formulation, Tractability is *intrinsic* (how responsive is the world to resources?), while Neglectedness is *extrinsic* (how many resources are already there?).
  If $T$ is defined as "impact per doubling," then a field with \$1 million funding and a field with \$1 billion funding might have the same intrinsic $T$. However, a \$1,000 donation is a much larger fraction of a doubling in the \$1M field than the \$1B field. Neglectedness scales the "doubling impact" down to the "marginal dollar impact."
  *   **Implicit Equation:** $Marginal Value \approx \frac{I \times T}{Current Funding}$.
  *   Since $N$ is scored as "how neglected" (inverse of funding), the multiplicative form $I \times T \times N$ approximates the marginal counterfactual value.

  **C. The Story About Other Funders**
  The framework assumes other funders are **rational but limited**. They pick low-hanging fruit first. Therefore, a crowded field implies the easy wins are gone, and the marginal cost of impact has risen. This justifies the aversion to "heavily funded causes" despite impartiality: it is not that the outcomes matter less, but that *your purchase price* for those outcomes is higher.

  **D. Concentration vs. Diversification**
  The practice of "funding the top cause until saturated" presupposes that the **variance in expected value between causes** is orders of magnitude larger than the **variance in financial returns** or the risk of failure within a cause. It assumes a linear (or near-linear) utility function for money *within* the relevant range of funding, but a concave utility function for impact *across* funding levels (diminishing returns).
  *   **Hits-Based Exception:** This acknowledges **fat-tailed distributions**. In standard causes (e.g., bednets), impact is normal/linear. In "hits-based" causes (e.g., AI policy), impact is power-law. Here, the rubric shifts from maximizing *expected value* per dollar to maximizing *option value* or probability of a tail event. This is the only place where the standard ITN multiplication is explicitly suspended for a different decision theory.

  ### 2. Requirements, Fit, and Underdetermination

  **What the Rubric Strictly Requires:**
  1.  **Marginalism:** You must care about the impact of the *next* dollar, not the average impact of the field.
  2.  **Commensurability:** You must be willing to trade off units of value across different domains (e.g., human lives vs. animal suffering).
  3.  **Counterfactualism:** You must value only what happens *because* of you (which Neglectedness and the within-cause "attribution deduction" both attempt to capture).

  **What It Merely Fits Comfortably With:**
  1.  **Maximization:** The rubric produces a score, which invites ranking. However, the math does not strictly demand you fund *only* the #1 cause. It is compatible with **satisficing** (fund anything above threshold $X$).
  2.  **Cause Neutrality:** While the rubric is designed for neutrality, a donor could theoretically weight "Importance" by personal resonance. The math holds, but the *spirit* of the community (which uses the rubric to argue *for* neutrality) would resist this.
  3.  **Concentration:** The rubric fits concentration, but does not mandate it. If two causes have similar ITN scores, diversification is mathematically permissible, though culturally discouraged in favor of "focus."

  **Where It Is Philosophically Underdetermined:**
  1.  **Separability:** The rubric assumes $I$, $T$, and $N$ are independent variables. They are often not. A cause may be neglected *because* it is intractable (low $T$ causes high $N$). Multiplying them double-counts the difficulty.
  2.  **The Unit of Time:** The rubric is static. It does not inherently account for **timing**. A cause might be important and neglected, but not tractable *yet*. The rubric often implicitly assumes "now," but a sophisticated user must overlay a "timing" factor.
  3.  **Relational Obligations:** A donor with special obligations (e.g., to their local community) can use the rubric by artificially inflating the "Importance" of local causes. The framework is agnostic to the *source* of the Importance score, making it compatible with partiality, provided the donor admits they are modifying the inputs.

  **Is the Multiplicative Form Doing Real Work?**
  It is a **heuristic for a Cobb-Douglas production function** or a logarithmic impact curve.
  *   **Real Work:** It forces the user to consider all three dimensions. A common failure mode is focusing only on Importance (passion) or Tractability (optimism). The multiplication penalizes zeros: if a cause is totally intractable ($T=0$) or totally saturated ($N=0$), the score is zero.
  *   **Misrepresentation:** It implies substitutability. It suggests you can compensate for high neglect with high importance. In reality, some constraints are binding (e.g., no amount of funding solves a physics problem before the physics is understood). The multiplicative form smooths over these hard constraints.

  ### 3. The Proposed Alternative: Explicit Counterfactual Portfolio Modeling

  Suppose a trustee proposes replacing ITN with: *Direct estimation of Expected Counterfactual Value (ECV) per marginal dollar, modeled against the whole funding landscape, allocated via portfolio optimization.*

  **What Would Change:**

  1.  **From Ranking to Allocation:**
      *   *Current:* ITN produces a rank order. This leads to **corner solutions** (100% to Cause A until saturation).
      *   *Alternative:* Portfolio theory accounts for **correlation**. If Cause A and Cause B are both "existential risk reduction," they may be highly correlated (if one fails, the other likely fails). A portfolio model would diversify across uncorrelated value streams even if one has a slightly lower ECV, to reduce variance in *realized* impact.
      *   *Result:* We would see more diversification across "cause areas" (e.g., splitting between bio-risk and AI risk) even if one scores higher, to hedge against model error.

  2.  **Explicit Crowding Dynamics:**
      *   *Current:* Neglectedness is a static proxy for diminishing returns.
      *   *Alternative:* Explicit modeling would treat funding as a **game**. It would ask: "If we fund this, will it crowd in government funding (leveraging) or crowd out other philanthropists (substitution)?"
      *   *Result:* Causes with high "crowd-in" potential would rank higher, even if currently less neglected. Causes where other funders are waiting for you to move first (coordination games) would be identified more precisely.

  3.  **Integration of "Within" and "Between":**
      *   *Current:* The switch from ITN to DALYs/$ is a methodological discontinuity.
      *   *Alternative:* A unified model would use the same counterfactual logic for both. "How many DALYs would happen anyway?" is the same question as "How neglected is this cause?"
      *   *Result:* Greater consistency. It would prevent the error of funding a "high ITN" cause where the specific interventions available are actually low-impact due to implementation bottlenecks.

  **What Would Be Lost:**

  1.  **Epistemic Humility (The "Error Margin" Problem):**
      *   The ITN rubric is robust to ignorance. You can estimate "Neglectedness" (count the dollars) and "Importance" (count the lives) with reasonable confidence even if you don't know the exact causal mechanism.
      *   Explicit counterfactual modeling requires precise estimates of **elasticities** and **crowding coefficients**. These are notoriously difficult to estimate. The alternative model would likely suffer from **false precision**, giving a precise number to a highly uncertain quantity. ITN's coarse scales (1–5) implicitly encode uncertainty; a dollar-value model often hides it.

  2.  **Coordination and Schelling Points:**
      *   The ITN rubric serves a sociological function. It provides a **common language** for a dispersed community of funders. When multiple independent funders use ITN, they naturally converge on similar causes without explicit collusion.
      *   Explicit portfolio models are often black-boxed or idiosyncratic. If every funder builds their own complex landscape model, coordination becomes harder. The "ranking" function of ITN acts as a **focal point** for collective action.

  3.  **Actionability:**
      *   ITN is a **filter**. It tells you where to look.
      *   Explicit modeling is a **calculator**. It requires data that often does not exist. In the absence of data, the model defaults to priors. The ITN rubric forces a qualitative discussion about the *nature* of the problem (Is it neglected? Is it important?) which can be more illuminating than a spurious quantitative output.

  ### Summary

  The ITN rubric is a **compressed algorithm** for estimating marginal counterfactual impact under conditions of extreme uncertainty. It separates factors not because they are ontologically distinct, but because they are **heuristically distinct sources of evidence**.
  *   **Importance** relies on demographic/existential data.
  *   **Tractability** relies on historical/scientific precedent.
  *   **Neglectedness** relies on financial data.

  Your proposed alternative is **theoretically superior but practically fragile**. It would likely lead to more robust diversification and better handling of crowding dynamics, but it risks collapsing under the weight of its own data requirements and losing the coordination benefits of a shared, simple heuristic. The current practice rests on the view that **roughly right is better than precisely wrong**, and that the primary constraint on philanthropy is not computational power, but the availability of high-quality opportunities that can be identified without false precision.

  A funder could use the ITN rubric as a **satisficing filter** (funding any cause above a threshold) rather than a maximization ranker, preserving space for relational giving, provided they acknowledge they are deviating from the implicit impartial maximization theory the rubric was designed to serve.
