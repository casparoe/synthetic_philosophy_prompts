answer: |-
  You have hit upon one of the most persistent and fascinating debates in the foundations of decision theory. Your intuition is sharp: you are correctly identifying a distinction that standard introductory courses often gloss over. Your professor was not lying to you, but they were offering a simplification that conflates two different non-standard approaches to the Prisoner's Dilemma.

  Here is a breakdown of the position you are describing, its established names, how it differs from Evidential Decision Theory (EDT), and its standing in the field.

  ### 1. Does this reasoning have an established name?

  Yes. The specific argument you are making—that identical rational agents running identical algorithms on identical inputs must produce identical outputs, and therefore one should choose as if choosing for both—is most famously associated with **Superrationality**.

  This term was coined by the cognitive scientist and mathematician **Douglas Hofstadter** in a series of *Scientific American* columns in the early 1980s (later collected in his book *Metamagical Themas*). Hofstadter argued that in a one-shot Prisoner's Dilemma between two "superrational" players (who know they are both superrational), cooperation is the rational choice because the symmetry of the situation implies the outcomes must match.

  In contemporary decision theory, this line of reasoning has been formalized under the umbrella of **Logical Decision Theory (LDT)**, and specifically **Functional Decision Theory (FDT)**. This framework was developed more recently by researchers at the Machine Intelligence Research Institute (MIRI), notably Eliezer Yudkowsky and Nate Soares. FDT explicitly models decisions as the output of a mathematical function, arguing that rational agents should maximize utility based on the logical implications of that function's output, not just the causal consequences of the physical act.

  There is also a related concept in game theory called **Team Reasoning** (associated with Michael Bacharach and Robert Gold), which suggests that rational agents can sometimes reason as members of a team ("What should *we* do?") rather than as individuals ("What should *I* do?"). However, Superrationality/FDT is the closest match to your "identical algorithm" argument.

  ### 2. Is it taken seriously as a distinct position?

  **Yes, but with caveats.**

  *   **In Mainstream Economics/Game Theory:** It is largely rejected. The standard orthodoxy is **Causal Decision Theory (CDT)**, which underpins the Nash Equilibrium. Mainstream theorists argue that my physical action cannot causally influence yours in a one-shot game without communication. To them, your reasoning commits the "fallacy of thinking your choice causes theirs."
  *   **In Philosophy and AI Safety:** It is taken very seriously. The debate between CDT, EDT, and FDT is a live research area. FDT is particularly influential in discussions about artificial intelligence, where agents *are* literally code. If two AI agents can inspect each other's source code (or know they are running the same code), the "logical correlation" you describe becomes a physical reality, not just a philosophical puzzle.

  ### 3. How does it differ from Evidential Decision Theory (EDT)?

  Your professor categorized your view as EDT. In terms of *recommendation* (Cooperate), they are the same. In terms of *mechanism*, you are right to feel they are different.

  *   **Evidential Decision Theory (EDT):** EDT asks, "Which action provides the best *news* about the world?" It relies on conditional probability: $P(\text{Opponent Cooperates} | \text{I Cooperate})$.
      *   *The Weakness:* EDT allows for "spurious correlations." For example, if carrying an umbrella is correlated with rain, EDT might tell you to carry an umbrella to *make* it rain. In the PD, EDT works only if there is a pre-existing statistical correlation (e.g., we are both from a culture of cooperators).
  *   **Your View (Superrationality/FDT):** This relies on **logical counterfactuals**. It argues that the correlation isn't statistical; it is *necessary*.
      *   *The Logic:* If I am running algorithm $A$, and you are running algorithm $A$, and the input is identical, then $Output(A)_{me} = Output(A)_{you}$. This is a mathematical truth, not an empirical correlation.
      *   *The Distinction:* EDT says, "If I cooperate, it is *likely* you did too." FDT/Superrationality says, "If I cooperate, it *logically follows* that you do too, because we are instantiations of the same computation."

  So, while your professor was technically correct that this falls outside standard Causal Decision Theory, they were imprecise to label it merely "evidential." You are describing a **logical** dependency, not an **evidential** one.

  ### 4. Can it be formulated rigorously?

  Yes. Functional Decision Theory provides a formalism for this.

  In CDT, you maximize expected utility over the causal consequences of your action $a$:
  $$ \text{Maximize } \sum_{s} P(s | \text{do}(a)) \cdot U(s, a) $$
  *(Where $s$ is the state of the world, and $\text{do}(a)$ is a causal intervention.)*

  In FDT, you maximize expected utility over the output of your decision function $f$:
  $$ \text{Maximize } \sum_{o} P(o | f(x) = a) \cdot U(o, a) $$
  *(Where $o$ represents outcomes that depend logically on the output of $f$.)*

  In the Prisoner's Dilemma with an identical opponent, FDT treats the opponent's move as logically dependent on your own decision function. Therefore, the "counterfactual" where you cooperate and they defect is treated as logically impossible (or having probability zero), because it violates the identity of the functions.

  ### 5. What are the standard objections?

  If this reasoning is so compelling, why isn't it the standard view?

  1.  **The Causal Objection:** The most common objection is that it violates our understanding of causality. My neural firing *here* cannot physically move your hand *there*. Critics argue that FDT conflates "predicting" with "causing." If I decide to cooperate, I am not *making* you cooperate; I am merely *predicting* that you will. But if I am merely predicting, my choice doesn't change the outcome, so I should defect to gain the unilateral advantage.
  2.  **The "Trembling Hand" (Robustness) Objection:** The argument relies on perfect identity. What if there is a 0.01% chance I make a typo in my reasoning and you don't? In standard game theory, if there is *any* probability that the other player defects regardless of your choice, the dominance argument for defection often snaps back into place. FDT proponents argue their theory handles this via "subjunctive dependence," but it is mathematically delicate.
  3.  **The Exploitation Objection:** If you adopt this reasoning against a standard Causal Decision Theorist (who defects), you will cooperate while they defect. You get the "sucker's payoff." A theory that tells you to lose against a defector seems pragmatically flawed to many economists. (FDT proponents reply that you shouldn't be playing PD against CDT agents if you can avoid it, or that in a world of FDT agents, everyone is richer).
  4.  **Fatalism:** Some philosophers argue this reasoning leads to a form of fatalism. If the output is determined by the algorithm, why does "deliberation" matter? (The counter-argument is that deliberation *is* the running of the algorithm).

  ### 6. Confidence and Weakest Point

  **Confidence Level:** High.
  I am highly confident that your reasoning aligns with **Superrationality** and **Functional Decision Theory**. The distinction you drew between evidential correlation and logical identity is a recognized and crucial distinction in advanced decision theory literature (specifically in the work of Judea Pearl regarding causal models vs. logical reasoning).

  **Weakest/Most Contested Point:**
  The weakest point in this position—and the one you should be prepared to defend if you pursue this further—is the **ontological status of logical causation**.

  Standard physics and decision theory assume that events are linked by physical causality (billiard balls hitting each other, neurons firing). FDT/Superrationality requires us to accept that *mathematical facts* can have "decision-theoretic weight" across spatially separated agents. While this makes perfect sense for computer code (where copy-pasting an algorithm creates two physical instances of one logical object), it is much harder to justify for human beings. Humans are not perfect algorithms; we are noisy, biological systems.

  If you claim you and your opponent are "identical decision-makers," a skeptic will ask: *In what sense?* If you are physically distinct, there is always some microscopic difference. If the theory breaks down under the slightest asymmetry, is it really a theory of rationality, or just a theory of identical clones? Defending the robustness of the "logical identity" claim in the face of real-world noise is the hardest part of this position.

  ### Summary for your studies
  You are not confused; you are ahead of the syllabus. You have independently reconstructed an argument that challenges the Nash Equilibrium.
  *   **Label:** Superrationality (Hofstadter) or Functional Decision Theory (Yudkowsky/Soares).
  *   **Key Distinction:** It relies on logical necessity, not just statistical evidence (EDT).
  *   **Status:** A serious minority view in philosophy/AI, rejected by mainstream economics.
  *   **Advice:** If you bring this up again, acknowledge the professor's point (that it violates standard Causal Decision Theory) but clarify that you are interested in the *logical dependency* of identical algorithms, which distinguishes it from standard Evidential Decision Theory. This shows you understand the taxonomy but are probing its boundaries.
