      *   *Point 2: The Goal of Communication.* The user assumes the goal is *data transfer* (Transparency). The Japanese context assumes the goal is *relationship maintenance* (Harmony). If the goal is harmony, then "brutal honesty" that damages the relationship is actually *less* moral because it prioritizes the speaker's ego (wanting to be 'honest') over the listener's well-being.
      *   *Point 3: Brown & Levinson Limitation.* B&L treat face as individualistic. In Japan, face is interdependent. Saving someone else's face is a moral duty, not a strategic game.
