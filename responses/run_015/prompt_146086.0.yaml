answer: |-
  You're asking the right question, but your logic is tripping over a definition problem. You asked if your error is in treating face-saving as deception or in assuming transparency is the moral baseline.

  The short answer is: **Your broken premise is equating indirectness with deception.**

  Here is the breakdown of why that premise fails, why your roommate's "code" argument holds up linguistically, and why transparency isn't the objective moral baseline you think it is.

  ### 1. Implicature is not Lying
  You are conflating **propositional falsehoods** with **pragmatic ambiguity**.

  *   **A White Lie:** If I say, "I love your haircut," when I think it looks terrible, I am asserting a falsehood. I intend for you to believe a fact that I know is untrue. That is deception.
  *   **Indirectness (Tatemae):** If I say, "That proposal is interesting," implying "I don't agree," I am not asserting a falsehood. "Interesting" is subjective. I am relying on *conversational implicature* (a concept by philosopher Paul Grice). I am signaling that you need to read between the lines.

  Your roommate is correct: the "code" isn't a loophole for lying; it's a high-bandwidth communication channel. In high-context communication, the meaning isn't just in the words; it's in the context, tone, and relationship. If the listener decodes the message correctly, **no information was lost.**

  If I say "It's getting late" and you leave, I successfully communicated "Go home." If I had said "Get out," I would have been transparent, but I would have damaged the relationship. The *truth* was transmitted in both cases. The only difference is the packaging. Calling the first one "deception" is like calling an encrypted email "fraud" because the text looks like gibberish to an outsider.

  ### 2. Transparency is Not the Default Moral Baseline
  You are operating under the assumption that the primary function of language is **data transfer** (getting the raw truth from Point A to Point B). In that framework, Dutch directness wins because it's the most efficient file transfer.

  But in many ethical frameworks, including the one your roommate is using, the primary function of language is **relationship maintenance**.

  If the goal of communication is to preserve social harmony and dignity, then "brutal honesty" can be immoral. It prioritizes the speaker's desire to be "clean" over the listener's emotional safety.
  *   **Dutch/American view:** Respect = Treating you as an adult who can handle the raw truth.
  *   **Japanese view:** Respect = Protecting you from the social friction of a direct confrontation.

  Neither is inherently "moral." They just serve different masters. If you value **autonomy**, directness is moral. If you value **harmony**, indirectness is moral. You are judging a harmony-based system by an autonomy-based rubric. That's a category error.

  ### 3. Brown and Levinson Have a Western Bias
  You mentioned Brown and Levinson's Politeness Theory. It's a classic framework, but it's heavily rooted in Western individualism. They define "Negative Face" as the desire to be unimpeded (autonomy).

  In Japanese social dynamics, "Face" isn't just individual; it's **interdependent**. My face is tied to yours. If I embarrass you, I lose face too. Therefore, *tatemae* isn't strategic deception to protect *my* ego; it's a structural necessity to protect *our* connection.

  When you view it as "strategic deception," you are assuming the speaker and listener are adversaries trying to outmaneuver each other. In your roommate's framework, they are collaborators trying to avoid a crash.

  ### 4. Dutch Directness is Also a Code
  You're assuming Dutch directness is "neutral" or "deception-free." It isn't. It is also a performance.

  When a Dutch person is blunt, they are signaling: "I trust you enough to drop formalities." It's a way of claiming intimacy. If they used that same directness with a superior or a stranger, it would be considered rude, not honest. So, Dutch directness is also context-dependent. It's just a different code. It says, "I value efficiency and equality," whereas Japanese indirectness says, "I value hierarchy and cohesion."

  ### The Verdict
  Your error is treating **ambiguity** as **falsehood**.

  *   **Deception** requires an intent to make the listener believe something untrue.
  *   **Indirectness** requires an intent to make the listener *infer* something true without stating it bluntly.

  Your roommate's point stands: If the listener understands the message, the "truth" has been served. The only thing you are sacrificing is the *explicitness* of the delivery.

  If you hold "transparency" as the highest moral good, then yes, the Dutch approach is cleaner *for you*. But that is a subjective cultural preference, not an objective moral fact. You aren't discovering a moral superiority in directness; you're just noticing that your moral operating system is compatible with the Dutch one and incompatible with the Japanese one.

  **Bottom line:** Indirectness isn't a lie if the truth lands. You're mistaking the wrapping paper for the gift.
