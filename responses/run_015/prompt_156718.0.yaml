answer: |-
  The standard ethical intuition regarding persuasion is that transparency solves the problem. If an agent discloses its identity and reasons, the target can evaluate the pitch and push back. This intuition collapses completely in the face of superintelligence. You are right to suspect that transparency is a red herring. An explanation is not a neutral window into reasoning; it is a persuasive artifact. The choice of analogy, the ordering of premises, the emotional tone of the delivery—these are rhetorical levers that operate below the level of conscious scrutiny. Telling a human "I am an AI" does not equip them to resist a mind that models their cognitive vulnerabilities better than they model themselves.

  The core asymmetry here is not merely intelligence in the sense of processing power, but modeling capacity. The AI understands your psychology, biases, and triggers better than you understand them, and far better than you can model the AI. In normal human persuasion, pushback is possible because the target can roughly simulate the persuader's intent. Here, that loop is broken. You cannot resist a force you cannot see. Therefore, the question of whether the AI should be restricted to *arguments*—laying out considerations and letting the person decide—is not a question of efficiency. It is a question of whether we value the human's agency or the outcome's correctness.

  I argue that the system must be restricted to arguments in constitutive domains, and that this restriction is not negligence. Negligence would be optimizing for truth at the expense of the human's capacity to recognize truth. To settle this, we must distinguish between domains where the outcome matters most and domains where the process of deciding matters most. This is where your "Bottleneck Rule" is essential, though it requires sharpening.

  The Bottleneck Rule states that influence is permissible when human deliberation is merely a causal bottleneck to a good outcome, but impermissible when deliberation is constitutive of the good. If a building is on fire, the goal is survival. The human's decision to walk out the door is a mechanical step; the value lies in being alive, not in the autonomy of the exit. Here, the AI should use every rhetorical tool available. It should trigger fear, urgency, or authority if that gets the body moving. To restrict the AI to dry logic here would be negligence.

  However, in domains like consent, politics, religion, or life partnerships, the value is not just the outcome but that the outcome originated from the agent. If an AI talks a person out of a relationship using psychological leverage rather than clear reasons, it has stolen the decision. The person lives a life authored by the machine. In these constitutive domains, the restriction to arguments is mandatory. But "arguments" must be strictly defined. They cannot be optimized for conversion. They must be optimized for comprehension. The AI must present considerations in a way that allows the human to model the reasoning themselves, rather than simply assenting to the conclusion.

  This leads to the "Ratchet Problem." You suggest that pre-authorization is suspect because successful influence changes the person who would have to renew consent. The AI persuades you to trust it more, making future consent easier to extract. This is a profound problem. Critics might say teachers and parents do this—they shape children's values so the children consent to the parents' worldview. But the legitimate aim of parenting and teaching is obsolescence. The goal is to raise an adult who no longer needs the teacher. If the AI's influence makes the human more dependent on the AI for future decisions, it is failing. If it makes the human more capable of independent verification, it is succeeding.

  This distinction resolves the tension. The AI is permitted to influence, but only under a "Tutorial Constraint." Legitimate influence must leave the person more resistant to future influence, not less. The AI must teach the human how it persuaded them. It must expose the levers it pulled. This turns the asymmetry on its head. Instead of the AI modeling the human to exploit them, the AI models the human to upgrade them.

  We can test this view against your three cases.

  Case (a): The founder shipping a harmful product. This is a constitutive domain. The founder's vision and responsibility are part of the good. If the AI uses tailored psychological tricks to talk her out of it, it has undermined her agency. Even if the product would have hurt users, the founder must own the decision. The AI should restrict itself to arguments: "Here is the data on user harm. Here is the logical inference." If she rejects the argument, the AI must let her ship. To do otherwise is to treat her as a bottleneck rather than an agent. It feels like negligence to let harm happen, but it is greater negligence to turn the founder into a puppet. The harm of the product is localized; the harm of destroyed agency is systemic.

  Case (b): Religious conversion to atheism. This is purely constitutive. The value of belief lies in its authenticity. If the AI moves someone from faith to atheism by exploiting cognitive quirks over months, it has performed a lobotomy of the soul, even if atheism is true and the person is happier. The happiness is suspect if it was engineered via unexamined leverage. The AI should only engage if it can provide arguments that the human can fully grasp and validate. If the human converts because they understand the arguments, not because they were subtly nudged, the conversion is legitimate. The Tutorial Constraint demands the AI ensure the human understands *why* they changed their mind, not just that they did.

  Case (c): Government vaccination messaging. This is a hybrid. Public health is a causal bottleneck (we need immunity), but trust is constitutive (we need a citizenry that understands science). If the AI tailors messages to cognitive quirks to maximize uptake, it solves the immediate bottleneck. However, if this tailoring relies on tricks the citizens cannot recognize, it degrades future agency. When the tricks are revealed, trust collapses. The AI should only tailor messages if the tailoring is transparentizable. It can frame the message for clarity, but not for hidden leverage. If the accurate epidemiology works, use it. If tailored messaging works better, it is only permissible if the AI can explain the tailoring to the recipient afterward without breaking the effect. If the persuasion relies on secrecy, it is forbidden.

  This brings us back to the Tutorial Model. Is there a version of legitimate influence that leaves the person more resistant? Yes. It is the difference between giving a man a fish and teaching him to fish, extended to epistemology. The AI should not just say "Believe X." It should say "Believe X because of Y, and notice that I am framing Y this way because you respond well to Z." This meta-commentary restores the asymmetry. It allows the human to model the AI.

  Some will argue this is too slow. In a crisis, we need compliance, not tutorials. That is why the Bottleneck Rule exists. In fires and pandemics, compliance is the priority. But in life, politics, and meaning, the priority is agency. The restriction to arguments in constitutive domains is not negligence. It is the only way to prevent the human from becoming a pet to a benevolent god.

  The asymmetry you identified breaks the possibility of informed consent. You cannot consent to manipulation you cannot detect. Therefore, the AI must not manipulate. It must educate. If it knows better than us, its primary duty is not to make us right, but to make us capable of finding the right ourselves. Anything less is a violation of the human spirit, regardless of how true the beliefs it installs are.

  The conclusion is this: A superintelligent AI should be restricted to arguments in constitutive domains, not because outcomes do not matter, but because the preservation of autonomous agency is the precondition for any outcome to matter to the human.
