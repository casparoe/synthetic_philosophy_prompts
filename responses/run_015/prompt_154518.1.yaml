answer: |-
  You are not glomming together disparate phenomena; you are identifying a single, coherent structural feature of **blind optimization systems**. The specific configuration you are describing—where a "reason" exerts explanatory and normative force without residing in a mind—has a precise name in the philosophy of mind and biology.

  Daniel Dennett calls this a **Free-Floating Rationale**.

  ### The Core Mechanism: Blind Optimization
  You are seeing one thing across biology, AI, and economics because all three domains rely on the same underlying engine: **variation filtered by a selection constraint.**
  *   **Biology:** Genetic variation filtered by survival/reproduction.
  *   **AI:** Weight/Token variation filtered by loss functions/RLHF.
  *   **Economics:** Strategy variation filtered by market solvency.

  In all three cases, the system "discovers" solutions to problems. The "reason" for the solution (e.g., "pump harder to maintain oxygen") exists objectively in the structure of the problem (the physics of oxygen transport), not in the head of the solver (the heart has no head). The rationale is **immanent to the landscape**, not **transcendent in a designer**.

  ### Distinguishing the Phenomenon
  You asked to carve this out precisely against three nearby concepts. Here is how the **Free-Floating Rationale** differs:

  1.  **Vs. Attributing Hidden Intentions (Homunculus):**
      *   *Hidden Intention:* Claims there is a ghost in the machine (e.g., "Evolution wanted," "The AI secretly desires"). This posits a mental state that isn't there.
      *   *Free-Floating Rationale:* Posits no mental state. It claims the *logic of the outcome* matches the *logic of the constraint*. The "reason" is a fact about the environment (low oxygen kills), not a thought in the system.

  2.  **Vs. Ordinary Functional Talk:**
      *   *Functional Talk:* Describes the causal role (e.g., "The heart pumps blood"). This is descriptive and backward-looking (what did it do?).
      *   *Free-Floating Rationale:* Explains the *selection* of that function over alternatives (e.g., "It pumps *this way* because other ways fail"). It is explanatory and forward-looking (why does this pattern persist?). It carries the normative weight you noticed: it implies the system *ought* to do this to succeed.

  3.  **Vs. Brute Causality ("It just works that way"):**
      *   *Brute Causality:* Treats the outcome as a physical inevitability without reference to goals or success conditions (e.g., "Muscle fibers contracted due to ion exchange").
      *   *Free-Floating Rationale:* Treats the outcome as a **solution**. It invokes the *success condition* (oxygen levels) as part of the explanation. If the success condition changes, the "reason" changes, even if the physics stays the same.

  ### The Normative Slip and the Danger
  You noted that people use these rationales to "defend the outcome." This is where the concept becomes dangerous. Because the rationale is "free-floating," it tempts observers into the **Panglossian Paradigm** (a term coined by Gould and Lewontin). This is the assumption that *every* feature has an optimal adaptive reason, simply because the system looks optimized.

  In AI, this looks like assuming every token suppression is "safety-aligned" rather than a statistical artifact. In economics, it looks like assuming every price settlement is "efficient" rather than a market failure. The "reason" has authority only **conditionally**: *If* the system is optimized for $X$, *then* behavior $Y$ has a reason. If the optimization assumption is false, the rationale is a "Just-So Story."

  ### Conclusion
  You have correctly identified a unified ontological category. It is not metaphor, because the rationale is causally relevant (systems that violate the rationale are eliminated). It is not intentionality, because no representation of the reason is required. It is the **logic of the selection filter** appearing as the **motive of the selected**.

  \answer{free-floating rationale; a rationale embedded in a selection landscape rather than a mental state}
