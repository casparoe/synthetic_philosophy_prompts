          *   Reply 3 (Parity): Rhetorical. It's a tu quoque. Even if commonsense is also clueless, that doesn't make consequentialism workable, it just makes everything broken.
          *   Reply 4 (Change-of-Rule): Load-bearing. This admits the EV calculation fails but saves the normative framework.
