          2.  *Robustness:* Maximize across range of hypotheses (maximin/ambiguity aversion).
          3.  *Parity/Reductio:* If this kills consequentialism, it kills *all* decision procedures (even commonsense).
          4.  *Change-of-Rule:* Consequentialism $\neq$ Expected Value (EV) Maximization. Adopt different rules under uncertainty.
