      *   *The Heavy-Tailed Probe:* The user is right. If the mean is undefined, EV maximization is mathematically incoherent. If both sides still recommend the same action (e.g., "do the near-term good"), then the debate was never about EV. It was about *risk attitudes* disguised as *epistemic claims*.

