      *   *Conclusion:* The debate is stuck because people are trying to save EV Maximization when they should be building a new decision theory for long-termism.

  5.  **Refining the Tone:**
      *   Match the user's precision. Avoid fluff.
      *   Use their terminology (refinement-fragility, heavy-tailed).
