          *   Rhetorical: Reply 3 (Parity). It stops inquiry.
          *   False: Reply 1 (Tie-breaker) assumes correlation that Cluelessness denies. Reply 5 (Empirical) assumes convergence that heavy-tails deny.
      *   *The Heavy-Tailed Probe:* Confirm the user's intuition. If the mean is undefined, EV is off the table. If action recommendations persist, the real debate is about **decision rules under indeterminacy**, not evidence.
