answer: |-
  The impasse is a category error where descriptive sociologists analyze functional mechanisms of political stability while normative ethicists defend the sanctity of specific moral horrors, rendering their claims mutually unfalsifiable.

  The comparativists are operating in the realm of political science and sociology, treating memory as a variable that correlates with regime type, social cohesion, or democratization. For them, "working through" is a process variable: does acknowledging past brutality stabilize a liberal order? When they stack Germany against Japan or Turkey, they aren't equating the gas chambers with the Rape of Nanking or the Armenian deportations; they are equating the *state strategy* of managing guilt. They are asking if the mechanism of denial produces similar political outcomes regardless of the underlying atrocity. Their epistemology is empirical: they believe we can know the value of memory by observing its structural effects.

  The exceptionalists are operating in normative ethics and theology. For them, memory is a duty owed to the victims, not a tool for statecraft. Their objection isn't that the sociology is wrong, but that the comparison is morally illicit. They argue that the Holocaust's industrial bureaucracy and ideological totality make it *sui generis*, so placing it on a spectrum with other atrocities trivializes its specific horror. When they cry "relativistic mush," they aren't disputing the data on social cohesion; they are asserting a moral boundary that says some things are beyond comparison. Their epistemology is deontological: the duty to remember uniquely is binding regardless of political outcomes.

  This creates a verbal mess because both sides use the word "memory" to mean different things. One means "public policy regarding history," the other means "moral restitution." Consequently, the hidden empirical claim—that state-sponsored remembrance actually reduces inter-group violence or prevents recurrence—is rarely tested because the exceptionalists often view the moral imperative as binding regardless of consequences. If remembering is a duty, its utility is irrelevant. If remembering is a tool, its uniqueness is irrelevant.

  Progress requires disaggregating the magnitude of the crime from the mechanism of remembrance. We need to stop asking "are these crimes equal?" and start asking "do similar memory regimes produce similar political outcomes regardless of the crime?" To move forward, scholars must treat the empirical claim as testable: does *Vergangenheitsbewältigung* actually yield better democratic outcomes than denial or silence, or is it merely a specific cultural performance unique to postwar Europe? Until the utility of memory is measured independently of its moral necessity, the debate will remain a clash between instrumental reason and moral absolutism.
