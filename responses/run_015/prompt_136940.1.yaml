      *   When these clash, we lack a higher-order principle to adjudicate.

  5.  **Determine What Counts as Progress:**
      *   *Conceptual Distinction:* Refining "peerhood" (ex ante vs. ex post) is the most promising path already taken (e.g., Kelly's Total Evidence View).
