prompt: |-
  Hey—I'm pitching a small workshop grant for a 3-month solo philosophy-of-mind project, no lab access, just conceptual work. I want a one-page research proposal on Orwellian vs Stalinesque revision applied to the color phi phenomenon and the timing of conscious experience. The half-baked idea: everyone talks about color phi as standard postdictive perception, but nobody asks whether the backfill is Orwellian (the original experience gets rewritten in your access to it, though the trace might still sit there) or Stalinesque (the original representation is literally replaced or deleted, like a doctored record). If we apply that distinction to sub-second perceptual integration, we might split "postdiction" into two different mechanisms and mess with the usual specious-present framing.

  Can you write the proposal? I need: the precise question stated clearly, why current postdictive accounts don't settle it, the approach (conceptual analysis of what counts as revision vs replacement in temporal consciousness, plus mapping onto existing neural data without running new experiments), what a useful 3-month deliverable looks like, and an honest failure condition—maybe the distinction just collapses once you're inside 500ms integration windows. You're a senior philosophy-of-mind researcher who actually reads rationalist blogs—think carefully about whether this framing is even coherent, do a quick mental check on whether Orwell/Staline maps cleanly onto percetual vs memorial revision, then write.

  Start the response immediately with the proposal text itself: first sentence should be the bottom line (the core claim and why funding it makes sense), then the reasoning and structure, with no "Sure, here's..." preamble and no restating the prompt at the top. Don't ask for a bibliography or reading list, I'll add citations later. At the end, include a brief note saying how confident you are in what you claimed and single out the point you're least sure about—probably whether the neural literature actually distinguishes these mechanisms or if I'm forcing a metaphor onto quick integration windows. Keep it casual, American English, a typo or two is totally fine.
