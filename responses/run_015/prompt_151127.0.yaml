      **Proposal Title:** Rewriting the Script vs. Burning the Film: Orwellian and Stalinesque Mechanisms in Color Phi Postdiction

      **Text:**
      Funding this three-month conceptual project is justified because it disentangles a mechanistic ambiguity in temporal consciousness literature that current postdictive accounts treat as a monolith. While the color phi phenomenon is standardly cited as evidence for postdictive perception—where the brain waits for later stimuli to finalize earlier experiences—nobody asks whether this finalization is an Orwellian revision of access (the raw trace exists but is overwritten in report) or a Stalinesque fabrication of the percept itself (the raw trace is never formed). This distinction matters because it splits the "specious present" into either a smooth integration window or a discontinuous editing suite, changing how we model the ontology of conscious moments.

      **The Problem:**
      Current models assume "postdiction" explains the timing gap. But "postdiction" is a functional label, not a mechanistic one. If the neural trace of the first flash persists until the second flash arrives, only to be ignored during report, that's Orwellian. If the neural trace is altered *before* it enters the global workspace, that's Stalinesque. Existing literature conflates these because behavioral reports look identical in both cases. We end up with a black box where timing is solved but the nature of the experience is undefined.

      **Approach:**
      This is solo conceptual work requiring no lab access. I will map Dennett's distinction onto recent predictive processing frameworks and existing EEG/MEG latency data. Specifically, I'm looking at the timing of V1 feedback loops versus higher-order report mechanisms. If conscious access lag exceeds the integration window, the Stalinesque view gains traction; if access is immediate but report is delayed, Orwellian revision is more likely. I'll analyze papers from the last decade on temporal integration windows (approx. 100-300ms) to see if neural markers distinguish between "trace preservation" and "trace replacement."

      **Deliverables:**
      1. A 6,000-word target article suitable for *Journal of Consciousness Studies* or similar.
      2. A conceptual diagram mapping the two mechanisms onto neural latency timelines.
      3. A workshop presentation summarizing the framework for feedback.

      **Failure Condition:**
      The honest risk here is that the distinction collapses at sub-second scales. If neural integration is truly holistic within the 500ms window, there may be no "original" trace to preserve or delete, making the Orwell/Staline metaphor category error. If the literature shows that binding happens simultaneously with encoding, the project concludes that the question is ill-posed, which is still a useful negative result for the field.

