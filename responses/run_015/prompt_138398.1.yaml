      *   **Tone:** Academic, precise, helpful, acknowledging the complexity of the field.

  2.  **Deconstruct the User's Argument:**
      *   (1) Definition of Superrationality: Choices are correlated via shared reasoning. Maximize utility if everyone does the same.
      *   (2) Application to Twin PD: Cooperate. (User likes this).
      *   (3) Diagnosis: No causation, only evidential correlation.
