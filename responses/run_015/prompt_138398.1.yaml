      *   Hofstadter's solution: They all agree to randomize with probability $p = 1/20$.
      *   But if they use independent randomizers, the correlation breaks.
      *   If they use a *shared* randomizer (e.g., "look at the seconds hand on a clock"), they stay correlated.
