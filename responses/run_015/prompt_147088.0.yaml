answer: |-
  You have not stumbled onto something obvious badly; you have independently rediscovered the foundational tension between **Expected Value (EV)** and **Expected Growth**, and you've bumped right into the frontier of **Ergodicity Economics**.

  You already know the "best fraction" is the **Kelly Criterion**. But Kelly is just the solution to an equation. What you are asking about is the *geometry* of the probability space that makes the equation look that way.

  Here is the carving you asked for.

  ### 1. The Umbrella Name: Non-Ergodic Multiplicative Dynamics
  The single concept that binds your three observations together is **Ergodicity** (or the lack thereof).

  *   **Ergodic** means the average outcome over *time* for one person is the same as the average outcome across *many people* at one moment.
  *   **Non-Ergodic** means those two averages are different.

  Your game is **multiplicative** (your wealth next round is $W_{new} = W_{old} \times \text{outcome}$). In multiplicative systems with a risk of ruin (wealth $\to$ 0), the system is almost always non-ergodic.

  *   **Observation 1 & 2** are about maximizing the **Time Average** (Geometric Mean).
  *   **Observation 3** is about maximizing the **Ensemble Average** (Arithmetic Mean).

  The "shape" you are seeing is the **Growth Rate Surface**. In physics and dynamical systems, the long-term exponential growth rate is called the **Lyapunov Exponent**. You are mapping the Lyapunov Exponent of a stochastic process.

  ---

  ### 2. Carving the Asymmetry (Observation 1)
  *Why is over-betting way worse than under-betting?*

  This is caused by **Volatility Drag** (also called Variance Drain). It is a mathematical property of the **Geometric Mean**.

  In a multiplicative game, gains and losses are not symmetric.
  *   If you have \$100 and lose 50%, you have \$50.
  *   To get back to \$100, you need a 100% gain, not a 50% gain.

  The "lopsidedness" comes from the fact that the Geometric Mean is always lower than the Arithmetic Mean, and the gap widens as variance increases.
  $$ \text{Geometric Mean} \approx \text{Arithmetic Mean} - \frac{\text{Variance}}{2} $$
  *(This is an approximation from continuous finance, but the intuition holds).*

  When you bet too much (over-Kelly), you increase the Arithmetic Mean (you win more on average per bet), but you increase the Variance *faster*. The "drag" term subtracts more from your growth rate than the extra winnings add. Eventually, the drag exceeds the gain, and your long-term growth rate turns negative.

  **Does this survive with longshots (10:1 payout, 1/5 win)?**
  Yes, and it gets *more* lopsided.
  *   High payout/low probability bets have higher variance for the same Expected Value.
  *   Higher variance = more Volatility Drag.
  *   The optimal Kelly fraction drops (you should bet less), and the "cliff" on the right side becomes steeper. A single loss on a high-leverage longshot wipes out many small wins.

  **Where it stops working:**
  This asymmetry disappears if the game is **Additive** (e.g., you bet \$10 fixed, not a fraction of wealth). If you can't go broke (no multiplicative ruin), the Arithmetic Mean rules, and you should bet max every time. The lopsidedness is a tax imposed by the *fractional* nature of the bet combined with the *absorbing barrier* at zero.

  ---

  ### 3. Carving the Diversification (Observation 2)
  *Why does splitting money across two games let me bet double?*

  This is **Modern Portfolio Theory** applied to Kelly.

  When you play two independent copies of the game, you are not doubling your risk; you are keeping your risk constant while doubling your exposure.
  *   **Variance of Sum:** If bets are independent, the variance of the portfolio grows slower than the sum of the variances.
  *   **The Math:** If you bet $f$ on Game A and $f$ on Game B, your total exposure is $2f$. But because they don't always lose at the same time, the *volatility of your total equity curve* is lower than if you put $2f$ on a single game.

  Since Volatility Drag is determined by the variance of your *total equity*, lowering that variance (via diversification) reduces the drag. Less drag means you can afford more leverage before the drag cancels out your edge.

  **The Limit:**
  If the two games were perfectly correlated (they always win/lose together), diversification gives you zero benefit. The optimal total bet stays at 20%. The benefit comes strictly from the **covariance matrix**.

  ---

  ### 4. Carving the Friend's Paradox (Observation 3)
  *Why does the group bet 100% while the individual bets 20%?*

  This is the purest definition of **Ergodicity Breaking**.

  *   **Your Scenario (Time Average):** You play 300 rounds. If you hit a string of losses early, your capital base shrinks. Future bets are smaller. You suffer **path dependence**. One ruinous path (going to zero) dominates the long-term outcome. You must optimize for survival.
  *   **Friend's Scenario (Ensemble Average):** 300 people play 1 round. Person A might go broke, but Person B might triple up. When you pool the winnings, Person B's gain covers Person A's loss. The group *cannot go broke* as long as $N$ is large enough, because the law of large numbers smooths out the variance instantly.

  Since the group doesn't suffer path dependence (no one person's ruin stops the group's growth), they don't suffer Volatility Drag. They can simply maximize the **Arithmetic Expected Value**. Since the EV is positive ($0.6 \times 2 + 0.4 \times 0 = 1.2$), the max EV strategy is "Bet Everything."

  **The Carving Edge:**
  This distinction vanishes if the winnings are *not* pooled. If the 300 people play separately and keep their own money, the "median" person will still go broke betting 100%, even though the "average" wealth of the group skyrockets. This is why GDP (ensemble) can grow while median wages (time) stagnate.

  ---

  ### 5. The "What Ifs" (Boundaries of the Concept)

  You asked where this stops working. Here are the boundary conditions for your model:

  **A. Finite Rounds (e.g., only 3 rounds)**
  *   **Effect:** The optimal bet fraction **increases**.
  *   **Why:** Kelly is an asymptotic limit ($N \to \infty$). It assumes you have infinite time to recover from variance. If you only have 3 rounds, you don't need to protect against a 1-in-1000 ruin event that might happen in round 50. You can "over-bet" Kelly to capture more EV because the "cliff" is further away than your horizon.
  *   **Limit:** As $N \to 1$, the optimal strategy converges to Max EV (bet 100%).

  **B. External Income (Top-up)**
  *   **Effect:** You can bet more aggressively.
  *   **Why:** This changes the **boundary condition**. In your spreadsheet, 0 is an absorbing state (game over). If you have a salary, 0 is a *reflecting* state (you get refilled).
  *   **Concept:** This moves you from "Risk of Ruin" to "Risk of Drawdown." You are no longer optimizing for survival, but for utility of consumption. This is the domain of **Life-Cycle Investing** (e.g., Samuelson-Merton).

  **C. Utility Functions**
  *   **Effect:** If you care about money less as you get richer (diminishing marginal utility), you bet less than Kelly.
  *   **Why:** Kelly assumes $\text{Utility} = \ln(\text{Wealth})$. If your utility is $\sqrt{\text{Wealth}}$, you are more risk-averse. If you have a specific goal (e.g., "I need \$1M to buy a house"), the optimal bet becomes a function of your distance to that goal (often called **Goal-Based Investing**).

  ### Summary: The Name and The Map

  If you need to label this whole shape of things in a search engine or an argument, use these terms:

  1.  **The Framework:** **Ergodicity Economics** (specifically the work of Ole Peters). This covers the Time vs. Ensemble distinction.
  2.  **The Mechanism:** **Volatility Drag** on **Geometric Brownian Motion**. This covers the lopsided curve.
  3.  **The Optimization:** **Multi-Asset Kelly Criterion**. This covers the diversification aspect.

  **The "One Thing":**
  It is **Non-Ergodic Multiplicative Dynamics**.

  **The Carving:**
  *   **Inside the carving:** Systems where outcomes compound (multiply), there is a risk of ruin (or significant drawdown), and the agent cares about their specific trajectory over time.
  *   **Outside the carving:** Additive systems (fixed bets), systems with infinite bailouts (no ruin), or ensemble-averaged systems (insurance pools, hedge funds with unlimited capital calls).

  You haven't just described a betting game; you've described the difference between **Gambler's Ruin** and **Insurance Actuarial Science**, and why the same math yields opposite answers depending on whether you are the gambler or the casino.
