answer: |-
  ### Preliminary Brainstorming: Framing the Episode

  Before engaging the doctrine, I need to isolate the specific normative transaction occurring here. The standing literature is predominantly dyadic (one person blaming another), but impeachment is polycentric. Here are four candidate framings:

  1.  **The Interpersonal Moral Frame:** Individual legislators (Hyde, Gingrich) morally criticizing an individual citizen (Clinton) for lying.
      *   *Blamer:* Specific Republicans.
      *   *Fault:* Moral dishonesty.
      *   *Power:* Moral sanction/social stigma.
      *   *Verdict:* This fits the literature best but misses the stakes. It reduces a constitutional crisis to a quarrel between colleagues.

  2.  **The Institutional Legal Frame:** The House of Representatives (as a corporate body) charging a Officeholder with "High Crimes and Misdemeanors."
      *   *Blamer:* The Institution.
      *   *Fault:* Violation of public trust/law.
      *   *Power:* Removal from office.
      *   *Verdict:* This captures the act but strains the concept of "standing." Institutions have jurisdiction, not moral standing. If we treat this purely legally, the hypocrisy charge becomes irrelevant noise.

  3.  **The Public Discourse Frame:** The electorate/media blaming the President for moral fitness.
      *   *Blamer:* The Public.
      *   *Fault:* Character failure.
      *   *Power:* Electoral punishment/approval.
      *   *Verdict:* Too diffuse. "The Public" cannot lose standing through hypocrisy in a coherent way because it is not a unified agent.

  4.  **The Representative Fiduciary Frame:** Legislators acting as agents of the Constitution/People to judge fitness for office.
      *   *Blamer:* Legislators *in their official capacity*.
      *   *Fault:* Breach of fiduciary duty (via perjury).
      *   *Power:* Protective removal (not punitive).
      *   *Verdict:* This is the strongest candidate. It explains why the hypocrisy charge mattered (it undermined their moral authority to judge fitness) without reducing the act to mere legal procedure.

  **Selection:** I will proceed with **Framing 4 (The Representative Fiduciary)**.
  **Rejections:** I reject Framing 1 because it cannot explain why the *Senate* acquitted despite the *House* impeaching; interpersonal blame doesn't aggregate to institutional action. I reject Framing 2 because if this were purely legal standing, the private infidelity of the accusers would be strictly irrelevant, yet it dominated the normative landscape. The fact that hypocrisy *mattered* proves this was a moral-political judgment, not a purely legal one.

  ***

  ### I. Disciplined Mapping of the Blaming Relation

  To apply standing doctrine, we must specify the normative power being exercised. In standard interpersonal cases, the power is the authority to demand acknowledgment of a wrong. In the Clinton impeachment, the power is **removal from a position of public trust.**

  *   **The Blaming Agent:** The House of Representatives, acting through the Judiciary Committee and Managers. While individuals spoke, the *blame* that carried weight was the collective vote. However, the *voice* of the blame was carried by specific individuals (Hyde, Gingrich). We must distinguish the *institution's* standing from the *spokespersons'* standing.
  *   **The Fault:** The articles specified perjury and obstruction. However, the *normative weight* of the fault relied on the underlying conduct (sexual relationship with a subordinate). If the lie had been about a bank transaction, the political will to impeach likely vanishes. Thus, the fault is a hybrid: a legal violation (perjury) that serves as a proxy for a moral failure (fitness of character).
  *   **The Normative Power:** This is not purely punitive. If it were purely punitive, the hypocrisy of the punisher would be less relevant (a corrupt sheriff can still arrest a murderer). Impeachment is **protective and prospective**: it asks, "Is this person fit to continue?" This makes the *character* of the judges relevant in a way it isn't in criminal law. The standing being exercised is the authority to declare another morally unfit for a specific role.

  **What the Doctrine Regulates Here:** Standard standing doctrine regulates the *permission* to express resentment or demand apology. Here, it regulates the **legitimacy of a removal judgment.** If the blamers lack standing, the removal is not just politically difficult; it is normatively defective. The doctrine must explain why a vote by hypocrites might fail to generate the normative force of "removal," even if it generates the legal fact of "impeachment."

  ### II. The Hypocrisy Clause at Three Grains

  We must test the accusers' hypocrisy against the specific fault they are blaming.

  **(a) Fault-Matching (Perjury vs. Perjury)**
  *   *The Test:* Do the accusers lose standing only if they also committed perjury before a grand jury?
  *   *The Verdict:* Gingrich, Livingston, and Hyde were not charged with perjury regarding their own affairs (at least not in the relevant legal sense during the process). Under this grain, they retain full standing.
  *   *Critique:* This renders the hypocrisy charge inert. It treats the impeachment as a purely technical legal proceeding. But the public outrage was not that they lied under oath; it was that they were policing a sexual moral code they violated. Fault-matching is too narrow for political-moral blame. It fails to capture why the public felt the *process* was tainted.

  **(b) Vice-Matching (Dishonesty/Incontinence)**
  *   *The Test:* Do they lose standing if they manifest the same underlying vice (e.g., general dishonesty or sexual lack of self-control)?
  *   *The Verdict:* They likely lose standing. Gingrich was lying to his wife; Livingston was hiding an affair. They share the vice of deceit regarding sexual conduct.
  *   *Critique:* This is too broad. If general dishonesty removes standing to blame for specific perjury, almost no politician could ever impeach anyone. It leads to a "clean hands" requirement that paralyzes public morality. If this grain held, the House would have had no standing to impeach *anyone*, given the nature of political life.

  **(c) Content-Matching (The Subject Matter of the Lie)**
  *   *The Test:* Do they lose standing because the *content* of Clinton's lie (sexual infidelity) matches the *content* of their own fault (sexual infidelity)?
  *   *The Verdict:* This is the most robust fit. Clinton lied to cover up sex; the accusers lied (to spouses/public) to cover up sex. The specific *topic* of the moral failure aligns.
  *   *Analysis:* This grain survives because it isolates the **relevance** of the hypocrisy. The impeachment was not about lying in the abstract; it was about lying *about this specific kind of vulnerability*. When Hyde prosecuted Clinton for lying about sex while having lied about sex himself, he wasn't just a sinner blaming a sinner; he was projecting his own specific moral failure onto the defendant to cleanse himself.
  *   *Conclusion:* Content-matching explains the public intuition best. It acknowledges that while they didn't commit the exact *legal* fault (perjury before a grand jury), they committed the *moral* fault that generated the legal charge. The standing loss arises because the blame looks like **moral displacement**: punishing the other for the very thing one is guilty of, to secure one's own moral superiority.

  ### III. The Nature of the Loss: Authority vs. Uptake

  When standing is lost, what exactly is broken?

  *   **The Authority Reading:** The blame is impermissible. The accusers had no *right* to bring the articles. The impeachment itself was a nullity in the court of moral opinion.
  *   **The Uptake Reading:** The blame is factually correct and perhaps even morally warranted, but the *communication* is blocked. The target (and the public) is entitled to dismiss the blame, not because it is false, but because the source is compromised. The hypocrisy functions as a defeater for *attention*, not a defeater for *truth*.

  **Evidence from the Case:**
  The historical record supports the **Uptake Reading**.
  1.  **Public Approval:** Clinton's approval ratings *rose* during the impeachment. This does not mean the public thought perjury was good. It means they refused to *accept the blame* from these specific accusers. They discounted the message because of the messenger.
  2.  **Senate Acquittal:** The Senate did not necessarily declare Clinton innocent of the charges; they declared he should not be *removed*. This suggests the blame (the charge) had weight, but the sanction (removal) lacked legitimacy coming from this specific configuration of accusers.
  3.  **Survival of the Charges:** Even today, the lie is acknowledged as a lie. The Authority Reading would suggest the lie itself becomes morally neutral if the blamer is a hypocrite. That is false. The lie remained a lie; the *force* of the accusation was what dissipated.

  **Implication:** The standing doctrine here regulates **conversational efficacy**, not moral truth. The hypocrites retained the *authority* to identify the wrong (the lie was still a lie), but they lost the standing to *enforce* the normative consequence (removal). The loss of standing is a loss of the power to *bind* the community to a judgment, not a loss of the power to *state* the judgment.

  ### IV. Pressure Points: Where the Doctrine Breaks

  This case exposes two structural weaknesses in the standing literature, which is built for dyadic, interpersonal morality.

  **1. The Problem of Composite Blame**
  Impeachment is a collective act. Suppose 60% of the voting House members were compromised by similar infidelity, and 40% were not.
  *   **The Silence:** The literature asks, "Does *A* have standing to blame *B*?" It does not ask, "Does *Group G* have standing if a majority of its members lack standing?"
  *   **The Dilemma:** If standing is a moral permission, can it be aggregated? If I lack standing to blame you for lying, I cannot vote to fire you for lying. If 218 Representatives lack standing, does the Impeachment lack standing?
  *   **The Threshold Question:** If the "clean" members constitute a quorum, does the institution retain standing? In the Clinton case, enough members voted to impeach, but the "clean" vs. "compromised" split was not the deciding factor; partisanship was.
  *   **The Implication:** If the collective agent inherits the moral defects of its pivotal members, then the institution's standing is fragile. If the institution's standing is independent of its members (because it represents the People), then individual hypocrisy shouldn't matter. The fact that individual hypocrisy *did* matter suggests the doctrine cannot account for **proxy agency**. The House was blaming *on behalf of* the People. If the Representatives are merely proxies, their personal sins should be irrelevant unless they affect their fidelity to the principal. The doctrine currently lacks a mechanism to distinguish *personal standing* from *representative standing*.

  **2. The Reacquisition Problem**
  The literature focuses on how standing is lost (hypocrisy, mediation, etc.). It is almost silent on how it is regained.
  *   **The Data:**
      *   **Livingston:** Exited the role. By resigning, he removed himself from the position of judge. Did he regain standing to *comment*? Perhaps, but he lost the power to *blame officially*.
      *   **Hyde:** Acknowledged the past affair but stayed in the role. He argued his past was forgiven/over. He retained his institutional power, but his moral standing remained contested.
      *   **Gingrich:** Did neither. His standing collapsed completely.
  *   **The Silence:** Can a hypocrite regain standing by **self-punishment**? If Gingrich had resigned *before* impeaching Clinton, would the House's action have had more legitimacy? The theory doesn't say. It treats standing as a binary switch (on/off) triggered by the fault, rather than a dynamic status sensitive to remediation.
  *   **The Implication:** This suggests the doctrine is static. It assumes a snapshot judgment. But political blame is a process. If standing is a relation, it should be repairable. The fact that Livingston's resignation was seen as "paying the price" suggests that **exit** can restore the integrity of the *process*, even if it doesn't restore the *individual's* moral purity. The doctrine needs to account for **procedural cleansing** via exit.

  ### V. Grading the Case and Proposed Revision

  **Grade: Anomaly / Stress Test**
  This case is not a straightforward confirmation of the hypocrisy condition. If it were, the impeachment should have been universally regarded as invalid *ab initio*. Instead, it was regarded as politically toxic but legally functional. It is an anomaly because it forces a distinction between **Moral Standing** (which the accusers lost) and **Institutional Standing** (which they retained). The theory currently conflates these. It assumes that if you lose moral standing, you cannot blame. But in public life, you can have the *authority* to blame (via office) without the *moral standing* (via character). The Clinton case shows these can come apart.

  **Concrete Revision to the Doctrine:**
  I propose adding a **Representative Capacity Exemption** to the standing conditions.

  *   *Current Doctrine:* A blamer lacks standing if they are guilty of the same fault (hypocrisy).
  *   *Revised Doctrine:* A blamer lacks standing if they are guilty of the same fault, **unless** they are blaming in a fiduciary or representative capacity *and* the fault being blamed constitutes a breach of that specific fiduciary duty distinct from the personal fault.

  *   *Application to Clinton:*
      *   If Hyde blames Clinton for *adultery* (personal fault), Hyde lacks standing (Content-Matching).
      *   If Hyde blames Clinton for *perjury before a grand jury* (breach of fiduciary duty of office), Hyde *might* retain standing, provided he can show his own infidelity did not involve a breach of *public* fiduciary duty.
      *   *However*, because the perjury was *about* the adultery, the two collapse.

  *   *Refined Revision:* **The Relevance Condition.** Standing is lost only if the blamer's hypocrisy renders the *reason* for the blame suspect. In representative contexts, standing is retained if the blamer can demonstrate that the blame is being exercised for the sake of the **Principal** (the People/Constitution) rather than for **Self-Vindication**.
      *   *Test:* Did the accusers impeach to protect the office, or to cleanse their own guilt? The public perception was the latter.
      *   *Doctrinal Change:* Standing is not just about the *act* of the blamer, but the **motive attribution** available to the blamed. If the available evidence suggests the blame is an act of projection (self-vindication), standing is lost, regardless of the technical match of faults. This shifts the focus from *ontological matching* (did they do the same thing?) to *functional analysis* (is this blame being used as a weapon of moral displacement?).

  This revision saves the doctrine from the "Composite Blame" problem: a collective body retains standing if the *process* ensures the blame is for the Principal's sake, even if individual members are compromised, provided the compromised members are not using the process for self-cleansing. In Clinton's case, the visibility of the accusers' own affairs made the "self-cleansing" motive too transparent, causing the standing collapse.
