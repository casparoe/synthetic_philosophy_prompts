answer: |-
  Teleosemantic theories of mental content aim to naturalize intentionality by grounding the representational properties of mental states in the evolutionary history of the cognitive mechanisms that produce them. According to prominent versions of this view (such as those advanced by Ruth Millikan or Karen Neander), a mental state represents $X$ because the mechanism producing that state was naturally selected for its capacity to correlate with $X$ or to guide successful action in the presence of $X$. The content of the representation is fixed by the mechanism's "proper function"—the effect for which it was historically selected.

  While teleosemantics has been lauded for its ability to account for misrepresentation (a state misrepresents when it fails to fulfill its proper function), it faces a serious and underappreciated difficulty: the **problem of functional shift**. This problem arises from the messy, non-linear nature of evolutionary history. Many cognitive mechanisms possess evolutionary histories in which they were selected for one function during one period and a different function during another, with no single function dominating the cumulative selection regime. When a teleosemanticist attempts to fix content by appealing to proper function in these cases, the notion of proper function becomes indeterminate. There is no fact of the matter about which of the several historical functions is the "proper" one. This essay argues that this indeterminacy is fatal to the theory, as standard remedial strategies either rely on arbitrary distinctions, beg the question, or abandon the historical commitments that define teleosemantics. Ultimately, the problem of functional shift reveals a deeper tension in the teleosemantic project: the impossibility of extracting normative facts about representational content from purely historical facts about selection.

  ### The Problem of Functional Shift

  Evolution is not a process of engineering from scratch; it is a process of tinkering with available materials. Traits are frequently co-opted for new uses—a phenomenon known as exaptation. Consider a neural mechanism $M$ in a species $S$. In the ancestral environment $E_1$, $M$ was selected because it detected looming shadows ($F_1$), thereby facilitating predator avoidance. Over millennia, the environment shifted to $E_2$. In this new context, the same neural mechanism $M$ proved advantageous for a different reason: it detected rapid movements of conspecifics ($F_2$), facilitating mating opportunities. Suppose further that the selection pressure for $F_1$ was strong and sustained for a significant period, and the selection pressure for $F_2$ was equally strong and sustained in the subsequent period.

  For the teleosemanticist, the content of the state produced by $M$ depends on its proper function. But what is the proper function of $M$? Is it to indicate predators (content: *Danger*) or to indicate mates (content: *Opportunity*)? The history of $M$ includes two distinct selection episodes, neither of which clearly overrides the other in terms of duration or intensity. The cumulative selection regime is heterogeneous. Consequently, there is no historical fact that privileges $F_1$ over $F_2$ or vice versa. If content is determined by proper function, and proper function is indeterminate due to functional shift, then the content of $M$ is indeterminate. This is not merely an epistemic limitation; it is an ontological indeterminacy. There is no fact of the matter about what $M$ represents, which undermines the explanatory power of the theory.

  ### Failed Resolutions

  Teleosemanticists might attempt to resolve this indeterminacy through three primary strategies: privileging recency, fine-grained individuation of mechanisms, or appealing to current fitness. However, each strategy fails to preserve the integrity of the teleosemantic framework.

  **1. The Recency Strategy**
  One might argue that the most recent selection episode determines the proper function. On this view, $F_2$ (mating) overrides $F_1$ (predator avoidance) simply because it occurred later in the lineage. However, recency has no principled connection to content determination. Evolution does not operate on a "last will and testament" principle where new functions erase old ones. The structural properties of $M$ that were shaped by $F_1$ may remain intact and causally relevant. If the mechanism still retains the sensitivity to looming shadows that was selected for in $E_1$, why does the historical fact of $E_2$ normatively override $E_1$? To claim that the most recent function dictates content is to impose an arbitrary chronological cutoff on a continuous historical process. Without a theoretical justification for why the *latest* selection pressure confers normativity while earlier ones do not, this move is ad hoc. It solves the indeterminacy only by stipulation, not by appeal to the natural facts the theory claims to rely upon.

  **2. Fine-Grained Individuation**
  A second strategy is to argue that there are not one but two mechanisms here. We might individuate $M$ more finely, positing that $M_1$ is the predator-detector and $M_2$ is the mate-detector, even if they share significant physical substrate. This would restore determinacy: $M_1$ has proper function $F_1$, and $M_2$ has proper function $F_2$.

  However, this merely relocates the problem without resolving the underlying indeterminacy. On what basis do we individuate $M_1$ and $M_2$? If they are physically identical or overlap significantly in the same neural circuitry, distinguishing them requires appealing to their functions. But their functions are exactly what is in question. To say "this part of the circuit is for predators" presupposes we already know the content to individuate the mechanism. This renders the argument circular: we are using semantic facts to individuate the physical mechanisms that are supposed to ground semantic facts. If we individuate solely by physical structure, we likely return to the single mechanism $M$, and the functional shift problem re-emerges. Thus, fine-grained individuation fails to provide a non-circular solution to the historical indeterminacy.

  **3. Current Fitness Contribution**
  A third strategy is to abandon the strict historical focus and argue that the proper function is determined by the mechanism's *current* contribution to fitness. If $M$ currently contributes more to reproductive success via mating detection, its content is *Opportunity*.

  While this resolves the indeterminacy, it does so at the cost of abandoning teleosemantics. The defining feature of teleosemantics is its historical etiology; it distinguishes itself from causal or informational semantics precisely by grounding normativity in *past* selection, not current correlation or utility. This historical component is necessary to explain error. A purely current-use theory struggles to explain how a mechanism can be malfunctioning now if it is currently doing what it does. By shifting to current fitness, the theory collapses into a form of causal or informational semantics, where content is determined by current reliable correlations. But such theories famously struggle with the problem of error (e.g., if a mechanism currently correlates with mates, but sometimes fires for predators, is it error or just noise?). Teleosemantics was designed to solve this by appealing to what the system *ought* to do based on history. Abandoning history to solve functional shift surrenders the theory's primary advantage, leaving it vulnerable to the very objections it was built to overcome.

  ### The Deeper Tension: History vs. Normativity

  The failure of these resolutions suggests that the problem of functional shift is not a localized bug but a symptom of a deeper tension in the teleosemantic project. The core ambition of teleosemantics is to extract normative facts (truth conditions, conditions of satisfaction, correctness conditions) from purely descriptive, historical facts (patterns of differential reproduction and selection).

  The problem of functional shift exposes the fragility of this derivation. History is messy, contingent, and cumulative. Selection pressures fluctuate, traits are co-opted, and functions layer upon one another. Normativity, by contrast, requires stability and determinacy. For a representation to be true or false, there must be a determinate standard against which it is measured. When the historical record yields multiple, conflicting selection episodes of comparable weight, the history fails to yield a single normative standard.

  This suggests that history alone is insufficient to ground normativity. If the "proper function" can be indeterminate because the selection history is mixed, then the bridge from "was selected for" to "ought to represent" is broken. The teleosemanticist assumes that the history of selection confers a unique normative status on a trait's function. Functional shift demonstrates that history often confers no such unique status. To resolve the indeterminacy, one must introduce a non-historical principle (such as recency or current utility) to select *which* part of the history matters. But once such a principle is introduced, the theory is no longer purely teleosemantic in the historical sense; it relies on external normative criteria to interpret the history.

  ### Conclusion

  The problem of functional shift presents a formidable challenge to teleosemantic theories of mental content. By highlighting cases where cognitive mechanisms have heterogeneous evolutionary histories, it demonstrates that the concept of "proper function" is often indeterminate. Attempts to resolve this indeterminacy by privileging recency, individuating mechanisms finely, or appealing to current fitness all fail: the first is arbitrary, the second is circular, and the third abandons the historical essence of the theory.

  Ultimately, this difficulty points to a fundamental limitation in the naturalization of intentionality via evolutionary history. It suggests that one cannot derive the determinacy of normative facts (content) from the indeterminacy of descriptive facts (complex selection histories). If teleosemantics cannot account for functional shift without ceasing to be teleosemantics, it implies that the normativity of mental content cannot be fully reduced to the blind mechanics of natural selection. The project of grounding meaning in history may require resources that history itself cannot provide.
