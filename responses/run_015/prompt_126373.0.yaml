answer: |-
  In a crowded pain-management ward, two patients occupy adjacent beds with identical stage-2 pressure ulcers on their heels, presenting a triage dilemma for the attending physician. Patient A, diagnosed with classic pain asymbolia following a cingulotomy, calmly points to the exposed tissue and reports, "I feel the sharpness there," yet smiles while the nurse cleans the wound and makes no attempt to withdraw their foot, describing the sensation as strictly neutral. Patient B, presenting with a hypothetical inverse asymbolia, insists "I feel nothing there" when probed for sensory details, but whenever the ulcer is touched, they hyperventilate, sweat profusely, and desperately try to kick the nurse away, describing the experience only as an overwhelming sense of doom without any specific sensory quality like burning or stinging. The attending physician must decide who receives the limited supply of a new analgesic sedative, knowing that treating one means delaying care for the other, forcing a choice based on whether the priority is the reported sensory presence of damage or the behavioral evidence of suffering.

  **Theoretical Verdicts**
  The intrinsic-badness theorist prioritizes Patient A. Because they hold that pain's badness is contained entirely within its phenomenal feel, Patient A's report of "sharpness" confirms the presence of the bad experience, regardless of their calm demeanor. Patient B, by denying any sensory feel ("I feel nothing"), ostensibly lacks the phenomenal property that constitutes badness, making their distress a separate issue like anxiety. Conversely, the evaluative-response theorist prioritizes Patient B. They argue pain is bad only if it is unwanted or drives avoidance. Patient A shows no avoidance and reports no unpleasantness, so the condition is not bad for them. Patient B exhibits compulsive avoidance and overwhelming dread, satisfying the condition for badness even without a specific sensory label.

  **Structural Feature**
  The case works by dissociating the sensory-discriminative dimension (reporting tissue damage) from the affective-motivational dimension (unpleasantness and avoidance). Patient A retains the sensory report but lacks the affective response; Patient B lacks the sensory report but retains the affective response. This split forces the theories to isolate which dimension carries the normative weight of "badness."

  **Counterarguments**
  A defender of the intrinsic-badness view might attack the verdict on Patient B by arguing that without a sensory quality, B's dread is not pain-related suffering but generalized anxiety, meaning the analgesic is the wrong treatment anyway. A defender of the evaluative-response view might attack the verdict on Patient A by arguing that if a sensation is not experienced as unwanted, it is not pain proper but mere touch, meaning A has no condition requiring pain management.

  **Removing Patient B**
  If you remove Patient B, the case collapses into a standard asymbolia example. Without the inverse contrast, the intrinsic-badness theorist could argue that A's lack of unpleasantness means the badness is absent, aligning them with the evaluative theorist. The inverse patient prevents both theorists from retreating to the idea that sensation and affect must co-occur, forcing them to commit to one variable as the sole bearer of value.
