answer: |-
  **MEMORANDUM**

  **TO:** Board of Zoning Adjustment
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **RE:** Halsey Street Block Face Petition (Hearing Date: 12th)

  **Recommendation**
  I recommend we **GRANT** the petition for the east block face of Halsey between 4th and 5th.

  This is not an easy vote. It requires us to accept trade-offs that feel unjust to specific parties—particularly the renters in the existing six-flat and the Community Land Trust (CLT)—in order to uphold the ordinance as written and secure critical city-wide infrastructure funding. However, our authority is limited. The Block Choice Ordinance commands us to grant petitions *unless* we find "substantial harm to the distinctive interests of households outside the petitioning block face." The evidence before us does not meet that high bar.

  **The Legal Standard and the Opposition**
  The Rowan Street Association has made a sophisticated argument based on the "all-affected principle" of democratic theory. They are correct that zoning changes spill over. Increased density impacts street parking, sewer capacity, and school enrollment on cross streets where residents had no vote. If we were writing the ordinance from scratch, I might agree that the voting unit should be larger.

  But we are not writing the ordinance; we are administering it. The Council deliberately chose the "block face" as the unit of decision-making. To deny this petition based on impacts to the cross-streets is to effectively veto the ordinance itself. The harm alleged by the Association—crowded schools, full sewers, parking scarcity—is cumulative and city-wide. It is not "distinctive" to the households on Rowan Street compared to any other household in the ward. If generalized strain on public infrastructure constituted "substantial harm" under this ordinance, no upzoning in the city could ever pass.

  **The "Clean Hands" Question**
  Several of us have struggled with the Rowan Street Association's history. They have opposed every upzoning proposal in the city for six years. Should this discount their standing?

  My view is this: We should not formally strip standing based on past behavior. Doing so turns us into scorekeepers of political purity rather than judges of land use. However, their history is relevant to the *weight* of their evidence. A group that opposes all housing everywhere cannot easily prove that *this* housing causes *unique* harm here. Their objection is ideological, not site-specific. We must listen to their concerns, but we cannot treat a generalized opposition to density as proof of "substantial harm" under the law.

  **The Internal Flaws: Renters and the CLT**
  Granting this petition exposes the flaws in the Block Choice Ordinance.
  1.  **Renters:** The resident assent vote passed only because renters counted as half-households. Had they counted fully, the petition would have failed. Three renters in the six-flat dissented. The owner has hinted at eviction or renovation ("evaluating options") if zoning changes. There is no relocation assistance in the ordinance. We are powerless to stop this displacement under current law.
  2.  **The CLT:** The Community Land Trust holds options on two parcels. Rezoning will raise assessed values, blowing their budget. Furthermore, the ordinance allows re-petition every three years. The CLT cannot finance affordable housing against a horizon that expires in 2028.

  By granting, we acknowledge that two potentially affordable units may be lost to market-rate fourplexes. This is a failure of the ordinance's design, not the Board's judgment. We cannot rewrite the statute from the bench to save the CLT option without overstepping our authority.

  **The State Grant Imperative**
  Finally, there is a pragmatic constraint. The state has tied an $11 million sewer-and-streets grant to the city demonstrating net added residential capacity by June 30. Staff have confirmed Halsey is the only project plausibly permittable in time. Denying this petition risks losing $11 million in infrastructure funding that benefits the very neighbors opposing this project. We cannot prioritize the hypothetical parking concerns of 140 households over guaranteed infrastructure funding for the whole city.

  **Bottom Line**
  We are being asked to solve policy problems—renter protection, affordable financing horizons, and voting unit geometry—that belong to the City Council. Our job is to apply the law as it exists. The petitioners met the statutory thresholds. The objectors have not met the burden of proving "substantial harm" distinct from general growth pains.

  **Action Required:**
  I will move to grant the petition at the hearing on the 12th. I ask for your support. If we deny, we invite litigation that we will likely lose, we jeopardize the state grant, and we nullify the Block Choice Ordinance. If we grant, we uphold the law, secure the funding, and send a clear message to the Council that the ordinance's flaws regarding renters and affordability need immediate legislative fix.

  I recommend we attach no conditions we cannot enforce. Instead, we should direct Staff to include a note in the final order highlighting the CLT and renter issues for the Council's review.

  Let's vote to grant on the 12th.
