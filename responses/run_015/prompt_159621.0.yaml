      *   **Key Concept 1: Parameterization Invariance (or Reparameterization Invariance).** This explains why some averages work and others don't. If the procedures are just reparameterizations of the same underlying symmetry, averaging might be stable (or rather, one should pick the invariant one). If they are structurally different, averaging is arbitrary.
      *   **Key Concept 2: Jaynes' Principle of Transformation Groups.** This is the specific solution to Bertrand's Paradox that distinguishes "valid" indifference from "invalid" indifference. It relies on *invariance*.
