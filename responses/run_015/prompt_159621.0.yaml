      *   *Defensible:* The procedures are equivalent under the *symmetry group of the problem*. (e.g., rotating the circle doesn't change the chord length distribution). If the methods are just different coordinate systems for the *same* invariant measure, they shouldn't give different answers. If they do, one is wrong.
