      *   *Re-reading the user's "Defensible" case:* "Sometimes the competing procedures look like one procedure seen from different angles... and then averaging over them feels legitimate." If they are truly just different angles (coordinate changes) of the *same* underlying measure, they should produce the same probability. If they produce different probabilities, they are *not* the same measure. The user might be conflating "procedures that look similar" with "procedures that are mathematically equivalent." I need to clarify this.
      *   *Actually, there is a case where averaging works:* If the ambiguity is truly about *which* experiment was run, and we have reason to believe each experiment was equally likely to be the intended one. But in puzzle writing, the goal is usually a unique mathematical truth, not a meta-game about the author's intent.
