answer: |-
  You have put your finger on a foundational crack in probability theory that most practitioners learn to walk around without looking down. You are asking for a name for the instability of "model averaging" when the model space is ill-defined, and a criterion for when "procedural equivalence" is real versus illusory.

  Here is the direct answer: **There is no single, universally recognized noun phrase for this specific second-order failure.** You will not find "The Averaging Paradox" in a textbook index.

  However, the distinction you are sensing is well-mapped in the foundations of Bayesian inference and mathematical physics. The concept you need is **Parameterization Invariance** (or **Reparameterization Invariance**), and the theoretical framework that resolves the "defensible" cases is **Jaynes' Principle of Transformation Groups**.

  Here is how to break this down for your co-editor, how to distinguish the cases, and a draft for your style guide.

  ### 1. The Diagnosis: Why the Averaging Fails
  The move you are describing—averaging over plausible procedures—is technically an attempt at **Bayesian Model Averaging**. You are treating the "method of selection" as a hidden variable and assigning it a uniform prior.

  The reason this fails (the "drift" you observe) is that the space of "plausible procedures" is not a mathematical set with a defined measure. It is a linguistic set.
  *   **Counting Problem:** You cannot count the procedures. Is "pick two points" one procedure? Or is it "pick point A, then pick point B" and "pick point B, then pick point A"?
  *   **Weighting Problem:** Assigning equal weight ($1/N$) to each procedure assumes the procedures are mutually exclusive and collectively exhaustive outcomes of a "meta-experiment." They are not. They are competing definitions of the *same* experiment.
  *   **Redescription:** As you noted, describing the same method in two ways doubles its weight. This is a violation of **description invariance**.

  In the literature, this is often discussed under **Prior Sensitivity** or **Model Uncertainty**, but the specific failure of the "average of ambiguities" to converge is simply a consequence of the **lack of a Haar measure on the space of interpretations.** (That is the technical way of saying: there is no uniform way to weigh the different ways of being uniform.)

  ### 2. The Distinction: Invariance vs. Mechanism
  You asked for a way to recognize the "favourable case" where averaging (or rather, consensus) feels legitimate.

  **The Defensible Case: Symmetry Invariance**
  When you feel the averaging is "legitimate," it is usually because the competing procedures are actually approximations of a single underlying measure that is **invariant under the symmetry group of the problem.**
  *   *Example:* If the problem is about a circle, the physical setup implies rotational symmetry. If Procedure A and Procedure B both respect rotational symmetry (and scaling/translation where applicable), they *should* yield the same answer.
  *   *Correction:* If they yield the *same* answer, you don't need to average them. If they yield *different* answers, at least one violates the symmetry.
  *   *The Jaynes Resolution:* Edwin Jaynes resolved Bertrand's Paradox not by averaging, but by demanding the distribution be invariant under rotation, translation, and scaling. Only one of the three classic Bertrand methods satisfies all three. That method is "correct" not because it was averaged in, but because it is the only one consistent with the problem's stated symmetries.

  **The Indefensible Case: Structural Ambiguity**
  When the averaging fails, it is because the procedures represent **different physical mechanisms**, not just different coordinate systems.
  *   *Example:* "Break a stick at two random points" vs. "Break a stick, then break the longer piece." These are not different views of the same indifference; they are different experiments with different causal structures.
  *   *The Failure:* Averaging these is like averaging the probability of heads for a fair coin and a biased coin because you "don't know which one you have." Without a prior probability on *which experiment is being run*, the average is meaningless.

  ### 3. How to Explain This to a Non-Mathematician
  Do not use the word "measure" or "Haar." Use the **Physical Mechanism Test**.

  **The Script:**
  > "When we say 'random,' we are hiding a machine that generates the randomness.
  >
  > **Case 1 (Good):** The machine is invisible, but the object has symmetries. A circle looks the same if you spin it. So the machine must spin with it. If two methods give different answers, one of the machines is 'sticky' (it prefers certain directions). We discard the sticky one. We don't average; we find the one that respects the symmetry.
  >
  > **Case 2 (Bad):** The machine is part of the problem. Breaking a stick once is a different machine than breaking it twice. Averaging them is like averaging the result of a dice roll and a coin flip because both give 'random numbers.' It creates a number, but it doesn't mean anything.
  >
  > **The Rule:** If the ambiguity is about *how* we look at the object (coordinates), symmetry fixes it. If the ambiguity is about *how* the object is made (mechanism), the problem is broken and must be rewritten."

  ### 4. Proposal for Your House Style Guide
  Since there is no standard term to lean on, you should define the policy explicitly. This prevents the "weekend of averaging" from happening in the first place.

  **Style Guide Entry: Probabilistic Ambiguity**

  > **1. Prohibition of Naked Randomness**
  > Avoid the phrase "choose at random" for continuous variables (lengths, positions, angles) without specifying the generating process. "Uniformly distributed" is insufficient unless the domain is unambiguous.
  >
  > **2. The Mechanism Requirement**
  > Every probabilistic setup must specify the physical or algorithmic procedure.
  > *   *Bad:* "A random chord is drawn."
  > *   *Good:* "Two points are chosen independently and uniformly on the circumference, defining a chord."
  >
  > **3. Handling Residual Ambiguity**
  > If a problem statement admits multiple valid generating procedures (e.g., Bertrand's Paradox scenarios):
  > *   **Do not average.** Averaging over procedures assigns arbitrary weights to ill-defined models.
  > *   **Check Invariance.** If the problem implies symmetries (rotation, scaling), the chosen procedure must preserve them. If multiple procedures preserve them and yield different answers, the problem is ill-posed.
  > *   **Resolution.** Either specify the mechanism explicitly in the text or declare the problem void.
  >
  > **4. The "Redescription" Check**
  > Before accepting a solution based on multiple interpretations, verify that the interpretations are not merely redescriptions of the same method. If Method A and Method B are mathematically equivalent, they will yield identical probabilities; averaging is redundant. If they yield different probabilities, they are distinct mechanisms and must not be averaged.

  ### 5. Summary of Terms
  If you need to tag this in your internal tracking or discussions:
  *   **The Phenomenon:** *Instability of Mixture Priors under Model Redescription.*
  *   **The Root Cause:** *Violation of Parameterization Invariance.*
  *   **The Solution:** *Principle of Transformation Groups* (Jaynes).
  *   **The Distinction:** *Symmetry Equivalence* (defensible) vs. *Mechanical Ambiguity* (indefensible).

  ### Final Advice
  You asked if this is "the first problem reappearing at a higher level."
  **Yes.** It is the Principle of Indifference applied to the space of Principles of Indifference. It cannot be solved by applying the principle again (averaging). It is solved by **constraining the space** via symmetry or physical specification.

  For a puzzle competition, the only robust solution is to stop asking readers to guess the generator. Specify the generator. If the generator is the puzzle (i.e., "figure out which natural measure applies"), then the symmetries must be so strong that only one measure survives (the Jaynes solution). If more than one survives, the puzzle has multiple solutions, and averaging them is a sin against clarity.
