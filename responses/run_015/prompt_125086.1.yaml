          *   Feasibility check (teaching 2 courses).
          *   Tone: Professional, direct, addressing the biostat colleague's objection ("confounding wearing a fake moustache").

  2.  **Deconstruct the Core Idea:**
      *   Standard view: SP is resolved by causal DAGs (adjust for confounders, don't adjust for colliders/mediators).
      *   User's view: DAGs tell you *how* to calculate, but not *which* calculation matters for decision-making when the partition isn't known at the time of action.
      *   Type 1: Known partition (e.g., which hospital am I in?). Condition on it.
      *   Type 2: Unknown/Counterfactual partition (e.g., would I have recovered anyway?). Aggregate matters for decision.
      *   Goal: Show this isn't just confounding relabeled.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be clear. "Accessibility and Simpson's Paradox" or similar.
      *   **The Question:** Standard causal analysis resolves *calculation*, not *decision relevance*. Does the agent's access to the partitioning variable at the moment of choice determine whether aggregate or stratified rates govern rational action?
      *   **Cases:**
          *   *Case 1 (Treatment):* Standard medical SP. Treatment looks better overall, worse in strata. If strata (e.g., stone size) are known *before* treatment, stratified wins. If unknown (e.g., hidden genetic marker), aggregate wins.
          *   *Case 2 (Fairness):* Admissions. Dept A accepts more men, Dept B more women. Overall favors men. If applicants choose dept (accessible), stratified matters. If assigned (inaccessible), aggregate matters.
      *   **Method:** One semester (4 months).
          *   Month 1: Formalize accessibility condition.
          *   Month 2: Work through cases (Decision Theory vs. Causal Inference).
          *   Month 3: Draft paper.
          *   Month 4: Revise/Submit.
          *   *Why this method?* Axiomatic tinkering is too abstract; collecting examples is too descriptive. Need conceptual clarification applied to decision scenarios.
      *   **Deliverable:** A journal-ready manuscript + a one-page guideline for applied researchers on reporting stratified vs. aggregate data based on variable accessibility.
      *   **Falsification:** If "accessibility" maps perfectly onto "confounder vs. collider" without remainder, the distinction is redundant.
      *   **Feasibility:** Teaching 2 courses. Keep scope narrow. Focus on the decision node, not full causal discovery.

