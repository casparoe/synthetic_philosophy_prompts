prompt: |-
  Hey — I'm putting together an application for a one-semester internal seed grant (trivial money, but the committee is half philosophers and half biostatisticians, so it has to be readable by both), and I need a one-page proposal. Since the budget is a rounding error I'd rather spend the space on the idea than on a lit review, so: no citations, no suggested reading, I'll bolt those on myself if it goes anywhere.

  The topic is Simpson's paradox, and here's what's nagging at me. Everyone treats it as *resolved*: you draw the diagram, you work out whether the third variable is a confounder, a mediator or a collider, and you adjust accordingly — end of story. But that story never tells you which of the two incompatible-sounding claims was the one you actually wanted. My half-formed idea is that the paradox quietly bundles together two questions, and that the thing which separates them is whether the partitioning variable is *accessible to the agent at the moment of choice*. Call it "Type 1": the partition is something you could in principle find out before acting — which hospital you're in, which department you applied to, which risk group you fall into. There the reversal really is just an instruction to condition, and I don't think there's any residue. Call it "Type 2": the partition is only settled *after* the act, or is counterfactual in a way nobody can check when they choose — whether the patient would have recovered anyway, which stratum a given applicant "really" belongs to. There, "adjust for the confounder" isn't advice anyone can follow, and it looks to me like the aggregate figure is doing normative work that the stratified figures can't. A collegue in biostats said this is just confounding wearing a fake moustache, and I want the proposal to answer that objection without getting sulky about it.

  So here's what I need: the question stated sharply enough that it has a determinate answer rather than trailing off; two or three worked cases — toy numbers are fine, make them up — including at least one where the reversal flips which treatment looks better in every stratum and at least one where it flips a fairness or admissions judgement, used to show that the standard causal treatment leaves the accessibility question open rather than settling it; the method, month by month, for one semester, and why that method rather than the obvious alternatives (axiomatic tinkering with the sure-thing principle? decision-theoretic modelling? just collecting more examples?); what a concrete deliverable would be, given that the committee will want to know whether any of this changes how applied work reports stratified versus aggregate results; and an honest closing paragraph on what would make me conclude I'm wrong, because I genuinely can't tell yet whether "accessibility" is a real distinction or just a relabelling of the confounder/mediator/collider trichotomy. Also — I'm teaching two courses that semester, so say plainly if any piece of this is too big and cut it down to something finishable.

  Hard limit: 550 words max, one page, no padding, and please don't open with a sentence about how puzzling and fascinating the paradox is.
