  **Project Title:** Decoupling Identity from Standing: Normative Continuity in Gradual Neural Replacement

  **Project Summary**
  This project proposes a conceptual analysis of gradual neural replacement, shifting the focus from the standard metaphysical question of personal identity to the underexplored ethical question of normative standing. While existing debates ask whether a subject survives substrate substitution, this project asks whether the subject retains the same moral claims and obligations. I argue that normative standing tracks substrate architecture—specifically the homeostatic, self-regulating basis of biological cognition—rather than functional role or causal history. Over three months, I will develop a taxonomy of replacement scenarios to demonstrate that psychological continuity can be preserved while normative standing is severed, challenging the assumption that functional equivalence guarantees moral equivalence.

  **Research Question and Problem Statement**
  The standard framing of gradual neural replacement (often analogous to the Ship of Theseus) asks whether personal identity persists when biological neurons are substituted one-by-one with functionally equivalent synthetic modules. Dominant positions generally collapse this into a binary: psychological-continuity theories argue identity survives if cognition and memory persist, while biological views argue identity fails if the organic substrate is lost. Both approaches treat normative standing—the status of being a moral patient with specific claims to care, rights, and obligations—as derivative of personal identity. If "you" survive, your moral status survives.

  This project identifies a gap in this reasoning. It is possible that psychological continuity and normative standing come apart. A synthetic module might replicate the information-processing function of a neuron without replicating the biological vulnerability, self-maintenance, or homeostatic stakes that ground moral status. Consequently, the precise research question is: **During gradual neural replacement, does normative continuity track substrate architecture, functional role, or causal history?**

  Standard debates leave this open because they assume that if the behavioral output and internal narrative remain constant, the moral patient remains constant. This project challenges that assumption by treating normative standing as a distinct variable that may depend on the physical basis of cognition rather than its computational output.

  **Proposed Position and Argument**
  I will defend the position that **normative standing tracks substrate architecture**, specifically the capacity for biological homeostasis, rather than functional role or causal history.

  The argument proceeds from the premise that moral patienthood is grounded in vulnerability and the interest in self-continuation. Biological neurons are not merely logic gates; they are living cells engaged in self-preservation. Their function is inextricable from their metabolic needs and susceptibility to damage. Synthetic modules, even if functionally isomorphic, lack this biological stake in their own continuation. They do not "care" about their state in the homeostatic sense; they merely execute states.

  Therefore, as replacement proceeds, psychological continuity (memory, personality, behavior) may remain intact, satisfying the criteria for personal identity under psychological-continuity theories. However, normative standing diminishes as the homeostatic substrate is removed. The resulting entity may be a person metaphysically, but a different kind of moral patient ontologically. This position avoids the all-or-nothing trap of standard animalism by allowing for a gradual degradation of standing correlated with the proportion of homeostatic substrate lost, rather than a sudden snap at the point of total replacement.

  **Methodology: Taxonomy of Replacement Scenarios**
  To test this position, I will employ conceptual analysis across three distinct scenarios, isolating variables to determine which continuity condition is necessary for normative standing.

  1.  **Uniform Substitution:** The standard case. Biological neurons are replaced one-by-one with synthetic modules that match function exactly but lack homeostatic architecture.
      *   *Purpose:* To establish the baseline divergence between psychological continuity (preserved) and substrate architecture (eroded).
  2.  **Region-Specific Substitution with Altered Architecture:** Replacement occurs only in brain regions associated with higher cognition, while brainstem and homeostatic regulators remain biological. Conversely, a scenario where homeostatic regulators are replaced first.
      *   *Purpose:* To determine if normative standing is localized to specific architectural functions (e.g., self-regulation) or distributed globally. If replacing homeostatic regulators eliminates standing while replacing cognitive modules does not, this supports the substrate architecture view.
  3.  **Social-Role Substitution without Substrate Change:** The biological substrate remains intact, but the subject's social role and functional output are artificially altered to mimic a non-person (e.g., via external control), or vice versa.
      *   *Purpose:* To serve as a control case. If normative standing persists despite functional/social disruption, it confirms that standing is not solely dependent on functional role or social attribution, strengthening the claim that it relies on substrate architecture.

  **Work Plan (Three Months)**
  *   **Month 1: Conceptual Mapping and Taxonomy.** Refine the definitions of "normative standing," "homeostatic architecture," and "functional equivalence." Finalize the three scenarios and test them against counter-arguments (e.g., silicon-based homeostasis). Deliverable: A detailed outline and scenario definitions.
  *   **Month 2: Argument Construction.** Draft the core argument linking homeostatic substrate to moral status. Develop the case for why psychological continuity is insufficient for normative standing. Address the objection that functionalism adequately captures moral relevance. Deliverable: First full draft of the paper.
  *   **Month 3: Refinement and Stress-Testing.** Critically evaluate the divergence thesis. Ensure the distinction between identity and standing is robust. Prepare the final manuscript for workshop presentation. Deliverable: Final paper and presentation slides.

  **Risk Assessment and Feasibility**
  The primary risk is that the project is too ambitious for three months. Grounding moral status in homeostatic substrate architecture is a substantial ethical claim that typically requires extensive justification beyond the scope of a short workshop grant. There is a risk that the distinction between "psychological continuity" and "normative standing" will collapse under scrutiny; if critics argue that psychological continuity *just is* what matters for moral status, the divergence thesis fails.

  To mitigate this, the scope is limited to **conceptual mapping** rather than definitive proof. The goal is not to settle the theory of moral status but to demonstrate that the standard identity debate *fails to capture* the normative question. Success is defined as producing a coherent argument that shows the plausibility of the divergence, even if the final grounding of moral status remains open. Failure would be defined as an inability to articulate a difference between functional role and substrate architecture that has moral relevance. Given the restriction to conceptual analysis without empirical experiments, the timeline is realistic provided the focus remains on isolating the variables rather than solving the broader meta-ethical implications.

  **Expected Outcomes**
  The project will result in a workshop-ready paper that reframes the neural replacement debate. Instead of asking "Is it still me?", the project forces the question "Is it still one of us?" in the moral sense. By arguing that normative standing tracks substrate architecture, the project provides a new lens for evaluating emerging neurotechnologies. It suggests that functional equivalence tests may be insufficient for ethical clearance of neural implants, as they may preserve the person while altering the moral patient. This offers a nuanced middle ground between bioconservatism and transhumanism, suitable for rigorous philosophical discussion within the workshop context.
