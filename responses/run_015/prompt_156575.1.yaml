  Sir, you mistake the essence of dominion. It requires no governor where debt acts as the chain. You say Tavara may denounce the Compact, yet you admit repayment within a year is impossible. This is not liberty; it is a bondage forged in ledgers rather than iron. The absence of a garrison signifies nothing if the treasury holds the keys.

  You concede Tavara's young industry has collapsed, barred by law from serving its own banks. This is the very mischief I condemned: the exclusive privilege which forces stock out of its natural channel. You argue Aurea's manufacturers gain nothing, yet specific firms secure a monopoly funded by public subsidy. Is it not the same injustice to crush a province's industry for the benefit of particular merchants, whether they sell cloth or cloud services? The nature of the ware matters less than the coercion.

  You claim this is security, not empire. But have we not seen how often the pretext of defense masks the interest of trade? If Aurea's taxpayers are losers, who truly directs this policy? You say free trade offers nothing to exchange, yet you forbid Tavara from trading with others regarding this data. I ask you plainly: If Tavara's parliament is bound by a debt it cannot repay, and its industry is legally stifled to favor Aurea's firms, in what meaningful sense is it not a dependent province subject to the correction of the mother city?
