      *   Claim: Not a colony (no force, ratified).
      *   Claim: Aurea taxpayers lose, only specific firms gain (not general manufacturers).
      *   Claim: Tavara gains income (modestly).
      *   Claim: Local industry crushed (admitted).
      *   Claim: Security necessity (rival bloc).
      *   Challenge: What makes this colonial? Is it just monopoly?

