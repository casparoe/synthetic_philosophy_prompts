answer: |-
  There is no single, canonical noun for this phenomenon in the way "estoppel" or "fiduciary" functions in law, but in bioethics and health law, the shape you are describing is most precisely termed **The Asymmetry of Diachronic Authority** (sometimes discussed under the header **The Unidirectionality of Precedent Autonomy**).

  While "precedent autonomy" is the standard term for the general power of the earlier self to govern the later self, your observation identifies the specific *limits* of that power. The phenomenon is not merely that precedent autonomy has limits, but that those limits follow a specific vector: authority flows from the past to the future only when it functions as a **restriction** based on **objective conditions**, but fails when it functions as a **delegation** or a **mandate** based on **subjective agency**.

  Here is the analysis of the phenomenon, its boundaries, and the frame required to understand it.

  ### 1. The Two Axes of the Asymmetry

  Your three cases reveal two distinct but related asymmetries that constitute the whole phenomenon.

  **Axis A: The Negative/Positive Rights Asymmetry (Cases 1 & 2)**
  *   **The Phenomenon:** The earlier self can waive the later self's right to life-sustaining treatment (Case 1), but cannot compel the later self to receive treatment that clinicians deem non-beneficial (Case 2).
  *   **The Mechanism:** This is grounded in the distinction between **negative liberty** (freedom from bodily intrusion) and **positive entitlement** (claim to resources/intervention).
  *   **Why it feels like one phenomenon:** In both directions, the *earlier* self is attempting to control the *later* self's bodily boundaries. The law permits the earlier self to dig a trench the later self cannot cross (refusal), but does not permit the earlier self to build a bridge the later self cannot cross (demand).
  *   **Delimitation:** This is distinct from **Medical Futility**. While Case 2 involves futility, the asymmetry exists even before futility is declared. A patient can demand a specific antibiotic in an AD; if the later self develops an allergy or the infection is resistant, the demand fails. The earlier self cannot freeze medical judgment in time.

  **Axis B: The Condition/Agency Asymmetry (Cases 1 & 3)**
  *   **The Phenomenon:** The earlier self can bind the later self based on the later self's *condition* (dementia, pain), but cannot bind the later self based on the later self's *choice* (Case 3).
  *   **The Mechanism:** This is the core of your puzzle. It is not that the later self's voice is ignored generally (they choose meals, visitors); it is that their voice cannot be made the **trigger** for a binding legal instrument.
  *   **The Legal Root:** This is the **Incapacitated Agent Bar**. In agency law, you cannot appoint an agent who lacks legal capacity. By the time the trigger condition ("if I have dementia") is met, the "later self" is legally incapacitated. Therefore, a clause saying "let my later self decide" is attempting to appoint an incapacitated agent. The law views this as a nullity.
  *   **Why Condition works:** A clause saying "If I no longer recognize my family" relies on an objective (or clinically assessable) state of affairs. It does not require the later self to exercise *authority*, only to exist in a *state*.

  ### 2. The Unifying Concept: Wardship vs. Agency

  The reason these two axes feel like one phenomenon is that they share a single underlying status assignment. The legal and ethical framework treats the incapacitated patient not as a **Principal** (who holds authority) but as a **Ward** (who holds interests).

  *   **The Earlier Self** is the **Principal**. They have capacity and can set terms.
  *   **The Later Self** is the **Ward**. They have interests (comfort, dignity, life) but lack agency.
  *   **The Proxy/Doctor** is the **Fiduciary**. They must act for the Ward's benefit, guided by the Principal's instructions *only insofar as those instructions protect the Ward*.

  This explains the asymmetry:
  1.  **Restriction (Case 1):** A Principal can instruct a Fiduciary to protect the Ward from invasive harm. This aligns with the Ward's protective status.
  2.  **Mandate (Case 2):** A Principal cannot instruct a Fiduciary to harm the Ward (or waste resources) even if the Principal previously consented. The Fiduciary's duty to the Ward's *current* welfare overrides the Principal's past instruction.
  3.  **Delegation (Case 3):** A Principal cannot transfer Principal-status to a Ward. You cannot make a Ward your agent.

  Therefore, the term you are looking for is **The Protective Asymmetry of Precedent Autonomy**. It is "protective" because the system is designed to protect the incapacitated subject from the consequences of their own incapacity, even when those consequences were anticipated by their capable self.

  ### 3. Distinction from Neighboring Concepts

  To ensure you are not conflating this with adjacent ideas, here is how *The Protective Asymmetry* differs:

  *   **Vs. Ulysses Contracts:** A Ulysses contract (common in psychiatry) binds a future self to treatment *during* a temporary loss of capacity (e.g., "Medicate me if I become manic"). In dementia, the loss of capacity is permanent and the "self" is considered fundamentally altered. Ulysses contracts rely on the expectation of *restored* agency; dementia ADs rely on the *termination* of agency. The asymmetry does not apply to Ulysses contracts in the same way because the goal is restoration, not end-of-life management.
  *   **Vs. Substituted Judgment:** Substituted judgment is what a proxy does when there is *no* AD ("What would she have wanted?"). Your cases involve an *explicit* AD. The asymmetry explains why the explicit AD is honored in Case 1 (refusal) but downgraded to "evidence of values" in Case 2 (demand). Substituted judgment fills the gap; the Asymmetry defines the gap's shape.
  *   **Vs. The Doctrine of Changed Interests:** This is the philosophical argument (Dresser vs. Dworkin) that the demented patient is a "new person." While this explains *why* we might hesitate to honor the AD, it does not explain the *legal asymmetry*. If the demented patient were truly a new person, *none* of the AD should bind. But Case 1 *does* bind. The asymmetry proves the law treats them as the *same* person for rights (refusal) but *different* persons for authority (delegation).

  ### 4. The Edge Case: Identity and Repudiation

  You asked whether the answer changes when the later person's say-so is precisely about whether the earlier person was her (e.g., "That wasn't me, I am not bound").

  Under the current framework of **The Protective Asymmetry**, the answer is **No**.

  *   **The Logic:** The authority to determine identity belongs to the **Principal** (Earlier Self), not the **Ward** (Later Self). The Earlier Self defined the continuity of care in the document. The Later Self, lacking capacity, lacks the standing to repudiate the legal identity established by the Principal.
  *   **The Limit:** This holds only as long as the Earlier Self's instructions are protective (Case 1). If the Earlier Self's instructions were harmful, the Later Self's distress ("I am happy, I want to live") can override the AD under the **Best Interests Standard**.
  *   **The Paradox:** This creates the situation you find unsettling: The Later Self can say "I want to live" to override a refusal (sometimes), but cannot say "I decide" to override a delegation. The system listens to the Ward's *suffering*, but not the Ward's *will*.

  ### 5. The Correct Frame: Fiduciary Trust, Not Contract

  You asked whether the frame is rights, authority, or trust.

  It is **not a Contract**. If it were a contract, Case 3 (delegation to later self) would be valid (I can contract to let my future self decide), and Case 2 (demand) would be more binding.
  It is **not pure Rights**. If it were pure rights, the Later Self's current right to life (Case 1) would override the Earlier Self's past right to refuse.

  The correct frame is a **Fiduciary Trust held for a Beneficiary**.
  *   The **Earlier Self** is the **Settlor** (creates the trust).
  *   The **Later Self** is the **Beneficiary** (receives the care/protection).
  *   The **Clinicians/Proxy** are the **Trustees**.

  In trust law:
  1.  A Settlor can instruct a Trustee to withhold assets from a Beneficiary to protect them (Case 1: Withhold antibiotics to prevent prolonged suffering).
  2.  A Settlor cannot instruct a Trustee to squander assets or act against the Beneficiary's welfare (Case 2: Demand futile treatment).
  3.  A Settlor cannot appoint the Beneficiary as their own Trustee if the Beneficiary is incapacitated (Case 3: Delegation to later self).

  ### Summary Definition

  **The Protective Asymmetry of Precedent Autonomy:**
  The ethical and legal principle that an advance directive functions as a **protective shield** for the incapacitated self (allowing the past self to refuse burden) but not as a **source of agency** (preventing the past self from delegating authority to the incapacitated self or mandating non-beneficial intervention). It arises because the law treats the incapacitated subject as a **Ward** whose interests must be protected, rather than a **Principal** whose current will must be executed.

  **Boundary Cases:**
  *   **Valid:** "If I cannot recognize my children, do not feed me by tube." (Objective condition + Protective restriction).
  *   **Invalid:** "If I ask for food, feed me by tube." (Subjective agency + Mandate).
  *   **Invalid:** "If I cannot recognize my children, let me decide then." (Delegation to incapacitated agent).
  *   **Gray Zone:** "If I seem happy, keep me alive." (Subjective condition). This often fails because "seeming happy" is clinically assessable, but if the patient *says* "I am happy" while lacking capacity, the *say-so* is void, though the *observation* of happiness by clinicians may trigger the clause.

  This framework explains why your committee feels the "slice" is off-mark: you are trying to apply **Contract Law** (binding agreements) to a relationship that the law structures as **Trust Law** (fiduciary protection). The Later Self is not a party to the contract; they are the object of the trust.
