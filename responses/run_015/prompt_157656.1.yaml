  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Sleeping Beauty Problem  
  **Parties:** The Halfer Position, The Thirder Position  
  **Facilitated by:** [AI Mediator]  
  **Date:** 24 May 2024  

  ## 1. AGREED CLAIMS
  *The following propositions are endorsed by both camps as accurate descriptions of the protocol, the constraints, and the locus of disagreement.*

  1.  **The Prior:** Before the experiment begins (on Sunday), Beauty's credence that the coin will land Heads is exactly 1/2. (Confidence: High)
  2.  **The Protocol:** Both sides agree on the physical setup: a fair coin, amnesia drug, and the specific waking schedule (Monday only for Heads; Monday and Tuesday for Tails). (Confidence: High)
  3.  **Non-Indexical Evidence:** Upon waking, Beauty acquires no new evidence regarding the coin outcome that is *not* self-locating (i.e., she learns nothing about the external world or the coin mechanism itself). (Confidence: High)
  4.  **Betting Convergence:** Both sides agree that if Beauty is offered a bet at every awakening that pays 1 unit if Heads and 0 if Tails, the fair price per bet is 1/3 unit. (Confidence: High)
  5.  **Divergence on Interpretation:** The disagreement is not about the betting price (Claim 4), but about whether that price directly reflects *credence* or reflects *credence weighted by the number of betting opportunities*. (Confidence: High)
  6.  **Reference Class Sensitivity:** The Thirder calculation treats the set of *awakenings* as the reference class; the Halfer calculation treats the set of *coin experiments* as the reference class. (Confidence: High)
  7.  **The Duplicate Test:** Both sides accept that the "Duplicate Variant" (creating a copy on Tails rather than waking twice) is a valid test case for distinguishing temporal self-location from ontological multiplicity. (Confidence: Medium)
  8.  **Internal Consistency:** Both sides acknowledge that the opposing view is internally consistent provided one accepts its specific definitions of "credence" and "evidence." (Confidence: High)

  ## 2. DISAGREEMENTS TABLE
  *This table isolates the specific propositions where the camps diverge. The final column indicates the Mediator's assessment of whether the dispute is substantive or verbal.*

  | Disputed Proposition | Halfer Formulation | Thirder Formulation | Neutral Restatement | Status (Genuine/Verbal) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Credence at Awakening** | $P(\text{Heads}) = 1/2$. Waking provides no evidence to update the Sunday prior. | $P(\text{Heads}) = 1/3$. Waking provides indexical evidence that updates the Sunday prior. | What numerical value should be assigned to the proposition "The coin landed Heads" conditional on "I am currently awake"? | **Verbal/Conceptual** (Depends on definition of 'credence') |
  | **Nature of Evidence** | Waking is a *logical consequence* of the protocol, not new data. The correlation between Tails and waking is predetermined. | Waking is a *selection effect*. Finding oneself awake is more likely in a Tails world than a Heads world. | Does the fact of "being awake now" constitute Bayesian evidence distinct from knowing the protocol? | **Genuine** (Epistemological) |
  | **Exchangeability** | The two Tails awakenings are correlated measurements of a single state; they are not independent samples. | The two Tails awakenings are distinct observer-moments; they count as two samples in the reference class of experiences. | Can the two Tails awakenings be treated as exchangeable draws for the purpose of probability assignment? | **Genuine** (Statistical/Ontological) |
  | **Credence-Betting Link** | Credence guides betting only when bets are counted per *experiment*. Per-awakening bets distort the odds. | Credence *is* the betting disposition per *awakening*. If the odds change, the credence must have changed. | Should rational credence be defined by the betting odds in a scenario where bets are repeated on Tails? | **Verbal/Conceptual** (Pragmatic definition) |

  ## 3. CRUXES AND PRE-REGISTRATION
  *These are the sub-questions that, if settled, would force a revision of at least one position. We record in advance what evidence each side accepts as relevant and what they predict it will show.*

  **Crux 1: The Status of Centred Propositions**
  *   **Question:** Can propositions containing indexicals (e.g., "I am awake now") serve as the basis for Bayesian updating?
  *   **Halfer Prediction:** No. Indexicals do not partition logical space in a way that allows probability updating. (Confidence: High)
  *   **Thirder Prediction:** Yes. Centred worlds are valid objects of credence and can be updated via something like the Self-Indication Assumption. (Confidence: High)
  *   **Accepted Adjudicator:** A formal demonstration that indexical updating leads to Dutch Books in *non*-repeating cases, or conversely, that refusing to update leads to poor decisions in anthropic cases.

  **Crux 2: The Exchangeability Objection (The Physicist's Point)**
  *   **Question:** Does the perfect correlation between the Monday-Tails and Tuesday-Tails awakenings invalidate the Thirder's sampling model?
  *   **Halfer Prediction:** Yes. Sampling two correlated points from one Tails run is length-biased sampling; it does not reflect the probability of the *cause* (the coin). (Confidence: Medium)
  *   **Thirder Prediction:** No. For the agent *inside* the run, the correlation is inaccessible. The subjective experience is of two distinct samples, regardless of external correlation. (Confidence: Medium)
  *   **Accepted Adjudicator:** Analysis of the "Duplicate Variant." If the answer remains 1/3 when two *independent* people exist (removing temporal correlation), the Halfer must concede the issue is ontological, not statistical. If the answer shifts to 1/2, the Thirder must concede the temporal correlation was doing the work.

  **Crux 3: The Credence-Betting Gap**
  *   **Question:** If the betting odds are fixed at 1/3 (per awakening), is it coherent to maintain a credence of 1/2?
  *   **Halfer Prediction:** Yes. Credence tracks truth; betting odds track utility. In this specific protocol, they come apart because the utility function is weighted by awakening count. (Confidence: High)
  *   **Thirder Prediction:** No. Credence is defined by betting behavior. If you bet at 1/3, your credence is 1/3. To claim otherwise is to render "credence" operationally meaningless. (Confidence: High)
  *   **Accepted Adjudicator:** A scenario where Beauty is rewarded for *accuracy* (e.g., a scoring rule) rather than money. If the optimal accuracy strategy aligns with 1/3, the Halfer position is weakened.

  **Crux 4: Time-Indexing of Probability**
  *   **Question:** Does the probability claim $P(\text{Heads})$ require a time index or centre (e.g., $P_t(\text{Heads})$ vs. $P_{\text{awake}}(\text{Heads})$)?
  *   **Halfer Prediction:** No. The probability of a coin flip is timeless. $P(\text{Heads})$ is invariant across the experiment. (Confidence: Medium)
  *   **Thirder Prediction:** Yes. Probability is relative to the agent's information state, which changes upon waking. (Confidence: Medium)
  *   **Accepted Adjudicator:** Consensus on whether "probability" in this context refers to the *chance setup* (the coin) or the *epistemic state* (the agent).

  ## 4. CLOSING STATEMENT: FALSIFICATION AND REFUSAL

  **Conditions for Abandoning Views**
  *   **The Halfer** would abandon the 1/2 position if it were demonstrated that refusing to update on indexical information leads to systematically worse accuracy scores (e.g., Brier scores) even when betting is removed from the equation. (Confidence: High)
  *   **The Thirder** would abandon the 1/3 position if it were demonstrated that treating awakenings as samples violates the laws of total probability when reconstructing the experiment from the outside (the "Outside Observer" test). (Confidence: High)

  **Potential for Movement**
  Both sides agree that the **Duplicate Variant** is the most promising avenue for movement. If the Halfer concedes 1/3 in the Duplicate case (two distinct people) but maintains 1/2 in the Standard case (one person, two times), the disagreement narrows strictly to the metaphysics of time and personal identity, rather than probability theory. (Confidence: Medium)

  **Refused Formulations**
  *   **The Halfer** will refuse to sign any statement defining credence *solely* as betting odds in self-locating contexts. They maintain credence is a doxastic attitude toward truth, not a price. (Confidence: High)
  *   **The Thirder** will refuse to sign any statement claiming Beauty learns "nothing new" upon waking. They maintain that *self-location* is new information, even if *world-state* information is not. (Confidence: High)

  **Mediator's Uncertainty Note**
  The single point in this document about which I am least certain is the classification in the Disagreements Table regarding the **Credence-Betting Link**. I have marked this as "Verbal/Conceptual," but there is a non-negligible possibility that this is a substantive disagreement about the nature of rationality itself (pragmatism vs. representationalism). If rationality *requires* the alignment of credence and betting odds, the dispute is genuine; if rationality permits them to diverge in exotic cases, it is verbal. Distinguishing these two meta-ethical stances is beyond the scope of this collaboration, yet it underpins the entire table. (Confidence: Low)
