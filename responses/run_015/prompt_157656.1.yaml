          4.  Closing Section (Falsification conditions, potential movement, refused formulations).
          5.  Confidence Markers: Mark substantive claims with confidence levels.
          6.  Uncertainty Paragraph: Name the single point of least certainty.
      *   **Tone:** Neutral, precise, philosophical but accessible to scientists, no smuggling of verdicts.

  2.  **Deconstruct the Inputs & Philosophy:**
      *   *Input 1 (Sampling):* The Thirder sees $N=3$ awakenings, $N_H=1, N_T=2$. $P(H) = 1/3$. The Halfer sees $N=1$ experiment, $P(H)=1/2$. The "exchangeability" objection is crucial. In statistics, if you sample *awakenings*, you get 1/3. If you sample *experiments*, you get 1/2. The dispute is about what "credence" tracks.
      *   *Input 2 (Duplicates):* This is the "Splitting Beauty" or "Quantum Suicide" adjacent variant. If Beauty is copied, Thirders usually stay at 1/3. Halfers might shift to 1/3 (because there are two distinct agents) or stay 1/2 (because the coin is still fair). This tests whether the issue is *indexical* (where am I in time?) or *ontological* (how many of me exist?).
      *   *Input 3 (Betting):* Standard Dutch Book arguments. If Beauty bets every awakening, she loses money on Heads if she bets 1:1 on Heads. She breaks even at 1/3 odds. Halfers argue the bet is offered twice on Tails, so the *payoff structure* is skewed, not the credence. Thirders argue credence *just is* the betting disposition.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and collaborative. "Joint Statement of Adversarial Collaboration on the Sleeping Beauty Problem."
      *   **Preamble:** Acknowledge the stalemate and the goal (mapping the disagreement, not solving it).

      *   **Section 1: Agreed Claims:**
          *   Need 8 claims.
          *   Must be things both *actually* agree on.
          *   1. Coin is fair (prior 1/2).
          *   2. Protocol is understood (no memory, etc.).
          *   3. Betting behavior converges (operational agreement).
