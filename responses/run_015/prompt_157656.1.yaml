          1.  *Sampling Bias/Exchangeability:* Physicist's view (length-biased sampling) vs. Halfer's view (tails awakenings are correlated, not independent replicates).
          2.  *Duplicate Variant:* Original vs. Copy scenario. Does the answer change? (Temporal self-location vs. self-location among persons).
          3.  *Credence vs. Betting:* Both agree on betting odds (usually 1/3 for the bet, though Halfers argue the bet structure matters), but disagree on *credence*. This relation needs probing.
      *   **Required Structure:**
          1.  Numbered section of agreed claims (aim for ~8, substantial but signable).
          2.  Disagreements Table (Proposition, Halfer View, Thirder View, Neutral Restatement, Genuine/Verbal?).
