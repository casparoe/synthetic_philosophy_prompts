answer: |-
  This is an exceptionally sharp set of intuitions. You have correctly identified that the standard Davidsonian model (synchronic conflict between judgment and action) is too narrow to capture the phenomena of temporal discounting and pre-commitment, while the Frankfurtian model (hierarchical endorsement) risks being too broad or missing the specific *failure* characteristic of weakness.

  Your tentative principle is a "Best Self" or "Reflective Endorsement" account. It is strong, but it hides a ambiguity in the phrase "conditions she herself counts as clear-headed." The tension in your cases arises because the agent's *counting* changes depending on when you ask her.

  Here is the stress test of your principle, the necessary repair, the cost of that repair, and the application to your new cases.

  ### 1. Stress Testing the Tentative Principle

  **The Principle:** *An agent is weak-willed with respect to $\phi$-ing when she $\phi$s against the verdict about $\phi$-ing that she would give, or has already given, under conditions she herself counts as clear-headed, and the explanation of why she $\phi$s anyway is the pull of the very prospect that verdict rules out.*

  **Where it Succeeds:**
  *   **Paradigm Drink:** Fits perfectly. Clear-headed verdict (no drink) vs. pull of prospect (taste).
  *   **Addict 1 (Conflicted):** Fits. Clear-headed verdict (no drug) vs. pull of prospect.
  *   **Addict 2 (Willing):** Fits (Negative). Her clear-headed verdict *is* to take the drug. She is consistent, however self-destructive.
  *   **Nightgate (a):** Fits. Verdict (install) vs. pull of prospect (freedom).
  *   **Nightgate (b):** Fits. Verdict (don't pay) vs. pull of prospect (phone).

  **Where it Strains or Breaks:**
  *   **The Late-Night Discounter:** At 1am, she does *not* count her 9pm verdict as authoritative. She counts her 1am verdict as clear-headed. Your principle requires that she $\phi$s against a verdict she *counts* as clear-headed. If she doesn't count the 9pm verdict as binding at 1am, she isn't weak-willed by this definition. You need her 8am regret to do the work, but the principle focuses on the time of action.
  *   **The Dieter (Reconsidering):** She sincerely concludes "one slice is fine" at the table. If that conclusion is "clear-headed" by her lights at that moment, she isn't acting against a clear-headed verdict. To call this weakness, you must assert that the *presence of the cake* corrupts the clarity of the head, which your principle doesn't explicitly state.
  *   **Nightgate (c):** She pays and doesn't complain. Does she have a verdict against paying? If she "would do it again," her verdict is effectively "Paying is an acceptable cost." If so, she isn't acting against a verdict. Your principle correctly predicts "Not weak-willed," but it doesn't explain *why* the difference between (b) and (c) is merely "what she says." It needs to explain why her saying it matters metaphysically.

  ### 2. The Repair: Diachronic Integrity + Etiology

  To save your intuitions (especially the Discounter and the Dieter), we must modify the principle to account for **temporal stability** and the **etiology of the motivation**. Weakness of will is not just acting against a judgment; it is a failure of *governance across time* caused by *local distortion*.

  **The Repaired Principle:**
  > An agent is weak-willed with respect to $\phi$-ing when:
  > 1.  She $\phi$s.
  > 2.  She has a **standing policy** against $\phi$-ing formed under conditions of **temporal distance** from the temptation (the "cool" self).
  > 3.  The explanation for $\phi$-ing is a motivational shift caused specifically by the **proximity** of the $\phi$-prospect (hyperbolic discounting), rather than a genuine change in values.
  > 4.  She **reflectively repudiates** this motivational shift either at the time of action (experiencing it as a lapse) or upon returning to conditions of temporal distance (experiencing regret), *unless* she has explicitly integrated the cost of the lapse into her standing policy.

  ### 3. Saving the Hard Pairs

  Here is how the repaired principle handles the pairs you are worried about, and where you might have to pay a price.

  **Pair 1: Late-Night Discounter vs. Willing Addict**
  *   **The Fix:** The distinction lies in **Condition 4 (Repudiation)** and **Condition 3 (Etiology)**.
      *   **Discounter:** Her 9pm policy is "Sleep." Her 1am action is caused by *proximity* (the show is vivid now). Crucially, at 8am (temporal distance), she *repudiates* the 1am motivation. She disowns the 1am self.
      *   **Willing Addict:** Her policy is consistent (or she has no stable policy against it). She does *not* repudiate the action at $t_3$. She owns the desire.
  *   **The Cost:** You must accept that weakness of will is partly constituted by the *later regret*. If the Discounter *never* regretted the 1am choice (if she woke up at 8am and said, "Best night ever, doing it again"), she would collapse into the Willing Addict case. Weakness requires a fracture in the diachronic self.

  **Pair 2: Nightgate (b) vs. Nightgate (c)**
  *   **The Fix:** This turns on **Condition 4 (Integration)**.
      *   **Nightgate (b):** She pays and complains. She treats the fee as a **penalty** for a failure of control. She repudiates the motivation that led to the payment.
      *   **Nightgate (c):** She pays and accepts it. She treats the fee as a **price** for a service rendered (flexibility). She has updated her standing policy to "Sleep OR pay $40." Because she has integrated the cost into her plan, the payment is no longer a lapse; it is a transaction.
  *   **The Cost:** You asked if you'd have to give up one member of this pair. The repaired principle says **you don't have to**, but it clarifies that the difference isn't just "what she says." The difference is her **normative stance toward the action**. In (b), the payment is a symptom of broken governance. In (c), the payment is an exercise of governance (buying an option). If (c) truly feels no conflict, she is not weak-willed; she is a pragmatic manager of her own limitations.

  **The Dieter (Reconsidering)**
  *   **The Fix:** This relies on **Condition 2 (Temporal Distance)**. The principle specifies that the authoritative verdict is the one formed under *distance*. The presence of the cake corrupts the "clarity" of the head. Even if she insists her reasoning at the table is genuine, the *etiology* (Condition 3) is the proximity of the cake.
  *   **The Cost:** You must be willing to accuse the dieter of **self-deception**. If she *sincerely* believes the slice is fine, you are overriding her first-person authority. You are claiming her "clear-headed" condition is defined by *absence of the object*, not by her own phenomenological report. This is a standard move in philosophy of action (Elster/Ainslie), but it is a cost: you are privileging the "cool" self over the "hot" self's report.

  ### 4. Predictions for New Cases

  Here is what the Repaired Principle predicts for your three unlisted cases.

  **Case 1: The Hiring Committee**
  *   *Scenario:* Votes to use a rubric (standing policy), abandons it for a star candidate (proximity/salience), likely regrets it later if the star fails or fairness is questioned.
  *   *Verdict:* **Weak-Willed (Collectively).**
  *   *Reasoning:* The rubric represents the "cool," distant policy designed to minimize bias. The "star candidate" creates a salience/proximity effect (excitement, prestige) that overrides the policy. If the committee later admits, "We shouldn't have ignored the rubric," they satisfy the repudiation condition. This is institutional akrasia.

  **Case 2: The Wandering Student**
  *   *Scenario:* Judges she should pay attention, mind wanders anyway.
  *   *Verdict:* **Not Weak-Willed (usually).**
  *   *Reasoning:* This fails **Condition 3 (Etiology)**. Mind-wandering is often a failure of *capacity* or *attention*, not a "pull of the prospect." She isn't tempted by the thought of the beach; her mind just drifts.
  *   *Exception:* If her mind wanders *specifically* to checking her phone because checking her phone is vivid and appealing, that *is* weakness of will. But pure drift is incompetence, not akrasia.

  **Case 3: The Therapist's Patient**
  *   *Scenario:* Told to stop over-controlling, eats second slice, part of her flinches.
  *   *Verdict:* **Not Weak-Willed.**
  *   *Reasoning:* This is the inverse of the Paradigm Case. Her **standing policy** (endorsed under therapeutic reflection) is "Eat intuitively, stop restricting." The **flinch** is the residue of the *old* policy (the eating disorder voice).
  *   *Why:* Acting against the flinch is actually an act of **self-control** (adhering to the new, healthy policy against the old, compulsive urge). To call this weak-willed would be to validate the pathology as the "true" self. The Repaired Principle identifies the "clear-headed" verdict as the therapeutic one, not the flinch. She is $\phi$-ing (eating) *in accordance* with her current clear-headed verdict, despite the noise.

  ### Summary of the Trade-off

  You can keep your verdicts on the Discounter, the Addict, and Nightgate (b)/(c), but the price is that **Weakness of Will is not a momentary property.** It is a **diachronic relation** between the agent at $t_1$ (planning), $t_2$ (acting), and $t_3$ (evaluating).

  *   If you don't regret it later (Addict 2, Nightgate C), it isn't weakness; it's a value shift or a trade-off.
  *   If you do regret it later (Discounter, Nightgate B), it is weakness, even if you felt wholehearted at $t_2$.

  Your seminar leader likely calls Nightgate (a) **"Second-Order Weakness"** (weakness about managing your weakness). The repaired principle unifies this: it's all a failure to align action with the policy formed under temporal distance.
