answer: |-
  **Title:** Bounded Occam: Fragility, Search, and the Limits of Solomonoff Induction

  **Introduction and Research Questions**

  The standard vindication of Occam's razor relies on Solomonoff induction. By weighting hypotheses according to $2^{-K(h)}$, where $K$ is Kolmogorov complexity, an ideal agent achieves convergence on any computable data-generating process with bounded total expected error. This dominance result is taken to justify preferring simpler hypotheses. However, this justification rests on idealisations that dissolve under the constraints of actual cognition. Solomonoff induction assumes unbounded computation and an infinite horizon. Real agents operate with finite resources and face decision horizons where asymptotic guarantees offer no purchase.

  My MPhil work established the standard formalism and its philosophical reception. The PhD thesis will argue that the move from ideal to bounded agency breaks the link between simplicity and truth in three specific ways. First, the dominance of the Solomonoff prior is asymptotic; the multiplicative constant fixed by the true environment can swamp the simplicity advantage within any realistic horizon. Second, the invariance theorem guarantees machine-independence only up to an additive constant. For the short hypotheses a bounded agent can actually entertain, the simplicity ordering may be an artefact of the reference machine. Third, bounded agents do not weight an enumeration; they search hypotheses in order of increasing complexity. It is unclear whether the justification for *weighting* transfers to *ordering*.

  This project seeks to determine whether a vindication of Occam's razor survives these constraints. The research is governed by three determinate questions:

  1.  To what extent is the simplicity ordering of short hypotheses fragile under changes to the reference machine? I define the *fragility* of a hypothesis class as the extent to which its rank in the simplicity ordering shifts when the reference machine is changed. A razor is *stable* to degree $d$ over a class when at most a fraction $d$ of pairwise rankings in that class flip under the change. Is $d$ sufficiently low for the razor to be non-arbitrary in the bounded regime?
  2.  Does the justification for simplicity-weighted priors transfer to complexity-ordered search under resource constraints? Specifically, does the convergence property of the prior entail a regret bound for the search procedure that is tight enough to be normative?
  3.  Can a robustness-corrected razor retain convergence properties, or do robustness and convergence pull apart? If we penalise hypotheses not just for length but for fragility, do we lose the ability to converge on the truth?

  **Critical Context and Existing Positions**

  Existing approaches leave these questions open because they prioritise asymptotic performance or computational speed over the stability of the complexity measure itself.

  The standard Solomonoff framework sidesteps the issue of boundedness entirely. It argues that since the additive constant in the invariance theorem becomes negligible as hypothesis length increases, the choice of reference machine is irrelevant. This ignores the bounded agent's reality: if an agent can only process hypotheses up to length $L$, and the invariance constant is comparable to $L$, the 'negligible' tail is the only part of the space the agent can access. The dominance result holds, but the constant of dominance depends on the true environment. If the environment is complex relative to the reference machine, the 'simple' prior assigns it low probability initially. In a finite horizon, the agent may never accumulate enough evidence to overcome this initial penalty. Thus, the asymptotic dominance does not guarantee finite-time reliability.

  The Minimum Description Length (MDL) tradition acknowledges bounded data but often treats the choice of coding scheme as a pragmatic modelling decision rather than a foundational philosophical problem. MDL practitioners assume that a 'natural' coding exists. My project challenges this by asking what happens when no such coding is privileged. If the simplicity ordering flips based on arbitrary choices of the universal Turing machine, MDL selects artefacts of the language rather than structure in the world.

  No-Free-Lunch theorems assert that no prior performs best across all possible environments. Solomonoff induction circumvents this by restricting the domain to computable environments. However, a bounded agent cannot effectively restrict their hypothesis space to computable processes without incurring computational costs that violate the bound. Consequently, the bounded agent faces a No-Free-Lunch scenario within the computable domain. The existing literature suggests adopting a 'speed prior', which penalises hypotheses for computation time as well as description length. While this addresses the cost of testing, it does not address the fragility of the description length itself. A hypothesis might be short and fast to compute on machine $A$, but long and slow on machine $B$. Speed priors stabilise the *cost* but not the *metric* of simplicity.

  Therefore, the gap is not merely one of computational tractability, but of metric stability. The existing positions assume that 'simplicity' is a robust property that agents approximate. I argue that for bounded agents, 'simplicity' may be a relation between the hypothesis and the machine, not the hypothesis and the world.

  **Methodology and Work Plan**

  The method will be primarily formal and analytical, focusing on bounding the fragility metric and comparing search strategies.

  *Year One: Formalising Fragility.*
  The first year is dedicated to defining and bounding fragility. I will construct a formal model of reference machine variation, treating the invariance constant not as a fixed nuisance but as a variable parameter. I will analyse specific classes of hypotheses (e.g., regular languages, polynomial-time computable functions) to determine how their Kolmogorov complexity rankings shift under machine transformations.
  *Scope Cut:* I will not attempt to prove a general bound for all computable functions, as this is likely intractable and unnecessary. The thesis only requires showing that fragility is high for the specific class of hypotheses relevant to bounded agents (short descriptions). I will also avoid deep engagement with algorithmic information theory proofs that do not bear directly on the ranking stability. The output will be a set of lemmas characterising the stability degree $d$ for relevant hypothesis classes.

  *Year Two: Search vs. Weighting.*
  The second year addresses the transition from prior weighting to search ordering. I will model a bounded agent as a search algorithm that enumerates hypotheses by complexity and tests them against data until a fit is found or resources are exhausted. I will derive regret bounds for this search procedure and compare them to the expected error bounds of the Solomonoff prior.
  *Scope Cut:* I will not run empirical simulations across programming languages. While illustrative, simulations are contingent on specific languages and do not provide the normative justification required for a philosophy thesis. The question is whether the justification *transfers*, not whether it works in Python versus C++. I will also avoid proving a new dominance theorem; the goal is to show why existing dominance theorems fail to apply, not to salvage them with new conditions. The output will be a comparative analysis of the normative force of weighting versus ordering.

  *Year Three: Synthesis and Robustness.*
  The final year will synthesise the findings to answer the third question. I will propose a 'robustness-corrected' prior that weights hypotheses by both length and stability. I will analyse whether this modified prior retains the convergence property of Solomonoff induction.
  *Scope Cut:* I will not develop a full alternative theory of induction. The goal is to diagnose the failure of the standard view, not necessarily to solve induction. If the robustness-corrected razor fails to converge, that is a valid negative result. The output will be the final thesis, arguing for either a restricted vindication of Occam's razor or a sceptical conclusion regarding its normative force in bounded contexts.

  **Justification of Method**

  This analytical approach is necessary because the problem is normative, not empirical. An empirical model-selection study could show that simple models often work, but it cannot explain *why* they work or whether that success is artefactual. If simple models work only because our reference machines are biased towards the structure of our local environment, an empirical study would confirm the success but miss the arbitrariness.

  Similarly, proving another dominance theorem would miss the point. The user's angle identifies that the constants *matter* in the bounded regime. A new theorem that pushes the constants into the background or assumes them away would beg the question. The method must explicitly isolate the constants and measure their impact.

  Simulations across programming languages are the most obvious alternative, but they are insufficient. Showing that rankings flip between Python and Lisp demonstrates fragility, but it does not quantify the *degree* of fragility relative to the hypothesis space size, nor does it establish the normative implications for truth-seeking. Analytical bounds on fragility provide a general result that applies to any Turing-complete reference machine, offering a stronger philosophical conclusion than a survey of specific implementations.

  **Possible Conclusions and Decision Criteria**

  There are three primary outcomes, decided by the relationship between fragility and convergence.

  1.  *The Optimistic Conclusion:* Fragility is low for hypotheses that are short relative to the agent's capacity but long relative to the invariance constant. In this 'Goldilocks' zone, the simplicity ordering is stable, and the search procedure retains a tight regret bound. Here, Occam's razor is vindicated for bounded agents, but only within a specific complexity window.
  2.  *The Pessimistic Conclusion:* Fragility is high across the entire range of hypotheses a bounded agent can entertain. The simplicity ordering is largely an artefact of the reference machine. In this case, the Solomonoff-style justification collapses. The razor may still be pragmatically useful, but it cannot be justified as a truth-tracking heuristic.
  3.  *The Divergence Conclusion:* Robustness and convergence pull apart. A robustness-corrected razor stabilises the ordering but loses the convergence guarantee. This would imply a trade-off: an agent can have a stable prior or a convergent prior, but not both. This would force a choice between stability (consistency across machines) and accuracy (convergence to truth).

  The decision between these conclusions rests on the bounds derived in Year One. If the fraction of flipped rankings $d$ approaches 1 as hypothesis length decreases, the Pessimistic Conclusion holds. If $d$ remains low while the search regret remains bounded, the Optimistic Conclusion holds.

  **Failure Conditions**

  An honest account of risk is required. The project fails if the concept of fragility proves unmeasurable in any non-arbitrary way. If the 'fraction of pairwise rankings' depends on how one samples the hypothesis space, and no natural sampling measure exists for bounded agents, then the metric is ill-defined. I will mitigate this by restricting the analysis to structured hypothesis classes (e.g., logical formulae of depth $n$) where counting is well-defined.

  A second failure mode is if the problem collapses back into the standard asymptotic result. If it turns out that the invariance constant is always negligible compared to the complexity of any environment a bounded agent could actually encounter, then the bounded critique dissolves. This would render the thesis trivial. I will mitigate this by focusing on 'adversarial' environments or environments specifically constructed to exploit the reference machine's bias, demonstrating that such environments are computable and thus within the Solomonoff domain, even if they are pathological.

  Finally, the project fails if the distinction between search and weighting proves illusory. If it can be shown that any bounded search procedure effectively implements a weighted prior (perhaps implicitly), then the third research question vanishes. I will mitigate this by focusing on 'early stopping' search strategies where the agent halts before exhausting the probability mass, a scenario where the equivalence between search and weighting breaks down.

  In summary, this thesis moves beyond the standard defence of Occam's razor by interrogating the stability of the simplicity metric itself. It argues that for bounded agents, the arbitrariness of the reference machine is not a negligible constant but a dominant factor. By formalising fragility and distinguishing search from weighting, the project aims to deliver a determinate verdict on whether simplicity is a guide to truth or merely a feature of our computational architecture.
