prompt: |-
  I'm taking a course on applied ethics and social policy and I've been thinking about how paid parental leave is structured in places like Sweden or Norway — you know, the system where there's a chunk reserved for each parent that you can't just hand over to thier partner, plus a shared bit, and then childcare subsidies that basically only work if both parents are in paid work. I'm wondering what philosophical commitments that whole package presupposes, if any?

  Like, does it quietly assume that care work is mainly a cost or burden that should be split evenly, rather than something that might be valuable in itself? And does tying the subsidies to dual-earner status presuppose that the two-income family is the normative ideal, so that a single-earner household is either invisible or somehow failing? I also notice there's a tension: the policy pushes both parents into the labour market, but then also insists each parent takes leave — so it's not just about maximising employment, there's some other value in there about presence or bonding or gender equality. But then is that consistent with how the system treats unpaid care done by grandparents or informal networks, which gets no support at all?

  Could you reconstruct the implicit theory — maybe about distributive justice, autonomy, or the family as an economic unit — and say whether the practice actually needs that theory or if it could fit with several rival ones? Also, what would have to change in the design if we replaced the underlying view with something like a care-ethics approach or a libertarian family-choice model? Please write in British English, and don't worry about giving me a reading list — I just want the conceptual unpacking.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Applied ethics and social policy, specifically focusing on the Nordic model of paid parental leave (use-it-or-lose-it quotas for each parent, shared pool, childcare subsidies tied to dual-earner status).
      *   **Key Questions:**
          *   What philosophical commitments does this package presuppose?
          *   Does it treat care work as a burden/cost to be split rather than valuable in itself?
