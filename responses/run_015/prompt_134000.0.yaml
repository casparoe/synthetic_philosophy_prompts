      *   *Autonomy:* Economic independence is seen as a prerequisite for autonomy (especially for women).
      *   *Distributive Justice:* Care burdens should be distributed equally between men and women, not just between families and the state.
      *   *The Nature of Care:* The user asks if it treats care as a burden. Yes, largely. It's something to be "shared" so neither party is disadvantaged in the labour market. It instrumentalises leave to get men into care, rather than valuing care *per se* as a vocation.
      *   *The Family Unit:* The family is treated as two autonomous individuals who happen to be parents, rather than a single organic unit. The state relates to the individuals, not the household.
      *   *Dual-Earner Norm:* Yes, the subsidy structure presupposes that both adults *should* work. A single-earner model is structurally discouraged (high marginal tax rates, loss of subsidies).

  4.  **Address the Tensions:**
      *   *Labour Market vs. Bonding:* It's not just about employment; it's about *equal* employment. If only mum works part-time and dad works full-time, inequality persists. The "presence" value is about the father's presence specifically, to normalise men as carers.
      *   *Grandparents/Informal Care:* This is a weak point in the theory. The state wants to professionalise care or keep it within the nuclear family *while working*. Informal care undermines the labour market attachment goal and the tax base. It also bypasses the pedagogical standards of state childcare.

  5.  **Evaluate Necessity of Theory:**
      *   Could this work with different theories?
      *   *Utilitarianism:* Maybe (maximising GDP + child outcomes).
      *   *Libertarianism:* No (too coercive).
      *   *Conservatism:* No (undermines traditional family structures).
      *   *Conclusion:* It is tightly wedded to a specific strand of Social Democratic Liberal Egalitarianism. It's hard to decouple the design from the gender-equality aim.

  6.  **Develop Alternative Models:**
