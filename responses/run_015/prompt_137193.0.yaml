    "punchline": "It's the only device where the final state depends entirely on whether you fancied doing the wiring out of sequence.",
    "premise_it_turns_on": "The joke depends on the Riemann Rearrangement Theorem allowing conditionally convergent series to sum to any value based on term order.",
