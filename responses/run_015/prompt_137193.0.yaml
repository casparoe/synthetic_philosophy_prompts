answer: |-
  Thomson's lamp: toggle infinitely fast, is it on or off? Benacerraf says indeterminate. But consider the ln-2 lamp. Wired to the alternating harmonic series: plus one, minus a half, plus a third... Thomson scoffed that 'we attach no sense to saying a lamp is half-on', but this one settles comfortably at 0.69. However, that series is conditionally convergent. Thanks to Riemann, you can rearrange the terms to sum to anything. So two electricians install the same kit. Electrician A follows the script, lamp glows at 69%. Electrician B gets bored, shuffles the switch order, and the lamp settles at negative five. Neither made a mistake. It's the only device where the final state depends entirely on whether you fancied doing the wiring out of sequence.

