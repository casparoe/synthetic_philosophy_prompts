answer: |-
  This is an exceptionally sharp observation. You have identified the exact fault line where contemporary analytic metaphysics, meta-ethics, and the rationalist tradition intersect.

  The short answer is: **No, there is no settled, algorithmic framework for distinguishing verbal from substantive disputes *prior* to analysis.** If there were, the last 80 years of meta-ontology would look very different.

  However, there *are* competing frameworks that explain what is happening in the cases where the disagreement survives clarification. The disagreement you are describing—where empirical predictions and practical recommendations align, yet the parties insist the dispute is real—is the central puzzle of **meta-ontology**.

  Here is the breakdown of the leading accounts, their diagnostic heuristics, and what they claim is left over when the "tabooing" is done.

  ---

  ### 1. The Diagnostic Problem: Can we tell *before* tabooing?

  You asked for structural features that predict whether a dispute will survive clarification. While there is no perfect test, the literature offers three main heuristics. None are infallible, but they map onto the major philosophical camps.

  #### A. The Predictive Divergence Test (The Empiricist/Rationalist Default)
  *   **The Heuristic:** If two parties agree on all sensory inputs and all future observational outputs, the dispute is verbal.
  *   **Proponents:** Logical Positivists (Carnap, early), Eliezer Yudkowsky (instrumental rationality).
  *   **Why it fails:** As you noted, this fails for mathematics, morality, and modality. Platonists and Nominalists agree on all empirical predictions regarding math, yet insist they disagree. This test assumes **verificationism**, which most contemporary philosophers reject.

  #### B. The Quantifier Variance Test (The Deflationary View)
  *   **The Heuristic:** Does the disputed word function as a quantifier (like "exists" or "there is")? If so, check if the parties are using different "rules of existence."
  *   **Proponents:** Eli Hirsch, Hilary Putnam.
  *   **The Theory:** Hirsch argues that "exists" is ambiguous. One side uses a "commonsense" quantifier (tables exist), the other uses a "fundamental" quantifier (only simples exist). If we can interpret both sides as speaking truth in their own "idiolect," the dispute is merely verbal.
  *   **Diagnostic Sign:** If you can charitably reinterpret one side to make their claims true without changing the world, it's likely verbal.
  *   **Why it fails:** Realists argue this is too easy. It makes *all* ontological disputes verbal by fiat.

  #### C. The "Joint-Carving" Test (The Metaphysical Realist View)
  *   **The Heuristic:** Does the term appear in the fundamental laws of nature? Does it track the "structure of the world"?
  *   **Proponents:** Theodore Sider, David Lewis.
  *   **The Theory:** Some concepts "carve nature at the joints" better than others. Even if two frameworks make the same predictions, one might be structurally closer to reality.
  *   **Diagnostic Sign:** If the dispute is about which terminology is *fundamental* (not just useful), it is substantive, even without empirical divergence.
  *   **Why it fails:** It posits a kind of fact ("structural facts") that is inaccessible to empirical verification, which many find suspicious.

  ---

  ### 2. What is left when the disagreement survives?

  This is the core of your question. If we taboo "exist," "fair," or "understand," and both sides agree on the concrete facts, but still disagree, what is the nature of that remaining disagreement?

  There are three leading proposals.

  #### Proposal 1: Conceptual Ethics (It's about *should*, not *is*)
  *   **The Account:** The disagreement is not about the world, but about **which concepts we should use**.
  *   **Proponents:** David Plunkett, Tim McPherson, Amie Thomasson.
  *   **Explanation:** When a Platonist says "Numbers exist" and a Nominalist says "They don't," they agree on the math. The disagreement is actually: *"Should we adopt a linguistic framework where 'exists' applies to abstract objects?"*
  *   **Why it feels substantive:** We often phrase pragmatic recommendations as factual claims. "Slavery is wrong" feels like a fact, but on this view, it's a claim about how we should structure our moral concepts.
  *   **Verdict on your pattern:** The dispute is **substantive**, but not **representational**. It is a normative dispute about language and cognition, disguised as a descriptive dispute about reality.

  #### Proposal 2: Metaphysical Structure (It's about *depth*, not *prediction*)
  *   **The Account:** The disagreement is about the **fundamental structure of reality**, which outruns empirical prediction.
  *   **Proponents:** Theodore Sider (*Writing the Book of the World*), Kit Fine.
  *   **Explanation:** Two maps can be equally useful for navigation (predictive equivalence) but one can be more accurate regarding the terrain's actual geometry. Sider argues there is a "privileged vocabulary" that describes the world's structure.
  *   **Why it feels substantive:** Because it *is* substantive. It's just not *empirical*. It is a disagreement about which ontology is "more fundamental," even if both are empirically adequate.
  *   **Verdict on your pattern:** The dispute is **substantive** and **representational**. There is a fact of the matter, but it is a metaphysical fact, not a scientific one.

  #### Proposal 3: Global Expressivism (It's about *function*, not *fact*)
  *   **The Account:** The statements aren't trying to describe facts at all. They are expressions of attitude or tools for coordination.
  *   **Proponents:** Huw Price, Simon Blackburn.
  *   **Explanation:** When we argue about whether numbers "exist," we aren't describing a realm of abstract objects. We are expressing our commitment to mathematical discourse. The "disagreement" is a clash of stances, not a clash of beliefs about a shared reality.
  *   **Why it feels substantive:** Because our cognitive machinery treats all assertions as fact-stating. We are "objectifying" our attitudes.
  *   **Verdict on your pattern:** The dispute is **not substantive** in the traditional sense. It is a practical conflict misidentified as a theoretical one.

  ---

  ### 3. Applying this to your Math Example (Platonism vs. Nominalism)

  This is the canonical test case for meta-ontology.

  *   **The Data:** Both sides agree 2+2=4. Both agree physicists use math successfully. Both agree humans have cognitive mechanisms for counting.
  *   **The Disagreement:** "Do numbers *exist*?"

  **How the frameworks analyze it:**

  1.  **Amie Thomasson (Easy Ontology):** The dispute is confused. The application conditions for "number" are satisfied (we can refer to them, use them in true sentences). Therefore, trivially, numbers exist. The Nominalist is making a category mistake, asking an "external" question as if it were "internal." The disagreement is **merely verbal/confused**.
  2.  **Theodore Sider (Metaphysical Realism):** The Platonist is right that numbers exist, but the deeper claim is that quantification over numbers "carves at the joints." The Nominalist is trying to paraphrase away reference to numbers, which makes the theory less structurally simple. The disagreement is **substantive (metaphysical)**.
  3.  **Huw Price (Expressivism):** Neither is describing a "fact." The Platonist is expressing a commitment to mathematical realism; the Nominalist is expressing caution about reification. The disagreement is **practical/attitudinal**.

  ### 4. Summary: Where is the line?

  You asked for the best available account of where the line is. The honest answer is that **the location of the line is itself the disagreement.**

  *   If you are a **Naturalist/Empiricist**, the line is at predictive divergence. Anything else is verbal or pragmatic.
  *   If you are a **Metaphysical Realist**, the line is at structural fundamentality. Predictive equivalence does not imply ontological equivalence.
  *   If you are a **Conceptual Ethicist**, the line is between descriptive claims and normative recommendations. Many "ontological" disputes are actually ethical ones about language.

  **Diagnostic Signs (The Best Heuristics Available):**

  If you want to predict whether a dispute will survive tabooing, look for these features:

  1.  **Fundamentality Claims:** If one side says, "Well, obviously they exist, but not *fundamentally*," the dispute is likely substantive (Sider's view).
  2.  **Normative Loading:** If the term ("fair," "rational," "real") carries a weight of *approval*, the dispute is likely Conceptual Ethics. They are arguing about which concept deserves the honorific label.
  3.  **Paraphrase Potential:** If one side can systematically paraphrase their claims into the other side's vocabulary without loss of information (e.g., "There is a number" -> "It is true that 2+2=4"), it leans verbal/deflationary (Hirsch/Thomasson).
  4.  **Explanatory Role:** If the entity in question does no explanatory work beyond the sentences referring to it (numbers explain nothing beyond the math itself), the dispute is likely meta-ontological rather than scientific.

  ### Recommended Reading

  To deepen this, I recommend looking at these specific works, which map directly onto your confusion:

  1.  **David Chalmers, "Verbal Disputes" (2011):** The definitive modern paper on classifying when a dispute is merely verbal. He offers a taxonomy of why tabooing sometimes fails.
  2.  **Theodore Sider, *Writing the Book of the World* (2011):** The strongest argument for why disputes can be substantive even without empirical divergence (the "joint-carving" argument).
  3.  **Amie Thomasson, *Ontology Made Easy* (2015):** Argues that most ontological disputes are confused because existence questions are trivial once semantic rules are fixed.
  4.  **David Plunkett & Tim McPherson, "Conceptual Ethics" (2015):** Explains why disagreements that look factual are often about which concepts we should use.
  5.  **Huw Price, *Naturalism Without Mirrors* (2011):** For the expressivist take on why we think these disputes are about "facts" when they aren't.

  **The Bottom Line:**
  When a dispute survives tabooing, it is usually because the participants are no longer arguing about **the world**, but about **the map** (Conceptual Ethics) or **the territory's fundamental geometry** (Metaphysical Structure). The rationalist instinct is to dissolve these as verbal; the metaphysician's instinct is to vindicate them as deep. The truth likely lies in recognizing that "substantive" does not always mean "empirical."
