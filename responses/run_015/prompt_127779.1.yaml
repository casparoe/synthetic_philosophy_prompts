answer: |-
  **BUREAU OF KARMIC RECONCILIATION**
  **Public FAQ & Compliance Portal**

  **Motto:** *We Don't Judge, We Reconcile.*

  **Q: I received a Notice of Assessment for actions committed by a previous biological host. I am not that person. How do I dispute this identity error?**
  A: Identity is not determined by biological continuity but by the continuity of the causal stream. When you filed Form 88-Self (Declaration of Continuity), you acknowledged that you are the current beneficiary of a specific karmic lineage. While the permanent self is philosophically null, the account holder persists via cause-and-effect linkage, similar to a flame passed between candles. Please note: denying the identity of the previous agent does not invalidate the debt. The stream matches our records. Your dispute has been logged as "Existential Non-Compliance" and rejected.

  **Q: I caused a significant accident, but it was unintentional. Why was my case reclassified as Non-Assessable?**
  A: Only volitional action (cetana) generates karmic fruit. If the "Intent Verified" checkbox was not selected during the incident logging phase, no moral debt is incurred. We understand this outcome may be emotionally unsatisfying for parties seeking moral accountability for negligence. However, the Bureau administers strict desert, not tort law. You cannot be billed for accidents. Please note that while you owe no suffering, you also accumulate no merit for remorse. The file is closed.

  **Q: Why am I experiencing suffering now that doesn't match my current behavior?**
  A: Karmic fruit ripens on a deferred schedule, often across multiple lifecycles. Your current arrears may stem from actions committed in Cycle N-1, which are no longer visible in your current history log. We apply compound interest to delayed ripening. Just because you cannot access the prior-life records does not mean the debt is invalid. Please refer to your Ripening Schedule (Form K-Ripe) for estimated delivery dates on outstanding liabilities. Patience is a compliance requirement.

  **Q: How are penalties calculated? Is there a standard tariff?**
  A: Penalties adhere to the Principle of Resemblance: the fruit must resemble the seed. We utilize Schedule K-Seed for conversions. For example: malicious slander results in N lifetimes of being systematically disbelieved during critical testimony. Theft results in asset forfeiture under ambiguous circumstances. Violence results as somatic degradation in corresponding limbs. These are not punishments; they are natural equivalencies. The Bureau does not set rates; we merely process the harvest according to established cosmic tariffs.

  **Q: Can I transfer merit to a deceased relative?**
  A: Yes. The Merit Transfer Program (MTP) allows account holders to gift surplus positive balance to designated beneficiaries, similar to loyalty points. This is our most popular feature. Please note: transferring merit technically contradicts the principle of individual desert, as one agent cannot reap another's sowings. However, the Bureau accepts the transactional override. A 15% processing fee applies to all inter-life transfers. Recipients cannot refuse gifted merit.

  **Q: Who opened my account? I would like to see the opening balance.**
  A: Karmic accounts are beginningless. There is no Date of Inception. Consequently, there is no opening balance and no statute of limitations. Requests for "original sin" documentation or "first cause" logs will be returned as File Not Found. You entered the stream mid-flow. Your obligation is retroactive to infinity. Please focus on current compliance rather than origin inquiries.

  **Q: How does the Bureau assess collective disasters (e.g., tsunamis, famines)?**
  A: Large-scale suffering is classified as Collective Ripening Events. While individual assessments are issued separately, the synchronization of pain is due to shared causal history among the affected population. We understand this can feel personal; it isn't. It is aggregate liability. Victims are reminded that their presence in the hazard zone indicates a matured liability window. The Bureau does not cause disasters; we simply reconcile the accounts of those involved in the collective stream.

  **Q: Is the Bureau a punitive agency?**
  A: No. Karma is an impersonal natural law, not a judgment system. The Bureau acts solely as an administrator. However, please be advised that failure to reconcile arrears will result in Enforcement Action, including involuntary rebirth in lower-realms jurisdictions. Terms such as "Penalty," "Debt," and "Seizure" are used for administrative clarity and should not be interpreted as retributive. We are not punishing you. We are ensuring the balance sheet clears.

  ***

  **GLOSSARY OF TERMS**

  **Arrears:** Unresolved karmic debt carried over from previous lifecycles. Accrues interest via suffering.
  **Causal Stream:** The technical identifier for personal continuity. Used to link distinct biological hosts to a single account.
  **Ripening:** The maturation of a karmic seed into experienced reality. Timing is deterministic but opaque to the account holder.
