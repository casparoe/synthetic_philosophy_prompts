answer: |-
  **MEMORANDUM**

  **TO:** Archive Director and Staff
  **FROM:** [Consultant/Procedural Architect]
  **SUBJECT:** Silence-Aware Appraisal and Description Protocol (SAADP) v1.0
  **DATE:** October 26, 2023

  ### I. PREAMBLE: OPERATIONALIZING THE GAP

  This procedure replaces the standard "Appraisal and Accessioning" policy. It operates on the premise that every decision to acquire is a decision to silence something else (due to space, capacity, or description limits). We do not merely collect records; we curate the shape of historical memory. When we cannot hold the record, we must hold the account of its absence.

  **Capacity Constraint:** We process 8 collections/year. We are moving in 18 months with a 33% reduction target. **The default decision is NO.** An offer must prove why it overrides the default.

  ---

  ### II. APPRAISAL PROCEDURE (THE TRIAGE)

  **Step 1: The Capacity Check (Hard Stop)**
  *   **Rule:** Does processing this collection exceed 15% of annual staff hours (approx. 1 collection equivalent)?
  *   **Action:** If YES, Director decides immediately. If NO, proceed to Step 2.
  *   **Judgment Call:** *15% is an arbitrary threshold based on your 8/year metric. It prevents one donor from monopolizing the year.*

  **Step 2: The Redundancy Check**
  *   **Rule:** Does the information exist in our municipal holdings (council minutes, tax rolls, court logs) in a searchable format?
  *   **Action:** If YES, decline the private copy unless it contains unique contextual evidence (e.g., personal correspondence *about* the decision, not the decision itself).
  *   **Action:** If declined, create a **Refusal Record** (see Section V).

  **Step 3: The Ethics & Values Check (Panel Trigger)**
  *   **Rule:** Does the offer involve:
      1.  Naming rights or financial quid-pro-quo?
      2.  Materials created by/about a community currently under-represented in our holdings (per the Demographic Gap Analysis)?
      3.  Sensitive data (immigration status, health, minors) without explicit consent from subjects?
  *   **Action:** If YES to any, **STOP.** Do not appraise. Refer to Community Advisory Panel.
  *   **Action:** If NO, proceed to Step 4.

  **Step 4: The Silence Classification (Pre-Accession)**
  *   **Rule:** Before accepting, identify which "Silence Type" (Section III) applies if you *decline* this offer.
  *   **Action:** Document this in the Refusal Log.

  ---

  ### III. THE SILENCE NOTE (DESCRIPTION PROTOCOL)

  Every finding aid must contain a **"Silence Note"** box at the top of the record. This is not an abstract; it is a metadata field. Volunteers must select one code and complete the sentence.

  | Code | Type | Definition | Evidence Required | Mandatory Finding Aid Syntax |
  | :--- | :--- | :--- | :--- | :--- |
  | **S-1** | **Null** | The record was never created. | Oral history or secondary source confirms activity occurred but was not documented. | "This collection documents [Activity], though no records exist regarding [Missing Aspect] as they were never created by the creator." |
  | **S-2** | **Lost** | The record existed but was destroyed. | Donor testimony, fire logs, shredding receipts, or gaps in a sequential series. | "Files regarding [Date/Topic] are missing due to [Cause of Destruction] evidenced by [Source]." |
  | **S-3** | **Displaced** | The record exists but is held elsewhere. | Knowledge of specific holding institution or private family holder. | "Records concerning [Topic] are not held here; researchers should consult [Location/Collection]." |
  | **S-4** | **Opaque** | The record is here, but we cannot render it. | Language barrier, encrypted files, damaged media we cannot play. | "This box contains materials in [Language/Format] which archive staff cannot read/process; content remains unsearchable." |
  | **S-5** | **Imposed** | The record exists, but we are refusing it. | **This is the Refusal Log entry.** | "The archive declined to acquire records from [Creator] on [Date] due to [Reason]; this silence is a result of archival policy." |

  **Rule:** A volunteer may assign S-4 (Opaque) but may *not* assign S-5 (Imposed). S-5 is generated automatically by the Refusal Log (Section V).

  ---

  ### IV. GOVERNANCE: WHERE THE PROCEDURE STOPS

  **Director Authority:**
  *   Space constraints (Capacity Check).
  *   Redundancy (Redundancy Check).
  *   Legal copyright/ownership verification.

  **Community Advisory Panel Authority:**
  *   **Values Judgments:** When "Redundancy" conflicts with "Representation." (e.g., We have city eviction logs, but do we need the landlord's private notes to see the human cost?)
  *   **Active Collecting:** Approval of any outreach to under-represented groups.
  *   **Ethical Embargoes:** Decisions on sensitive data (immigration status, etc.).

  **Commitment on Active Collecting (Board Dispute):**
  The Board member is half-right and half-wrong. Actively collecting from under-recorded communities is morally mandatory; doing so via traditional acquisition (taking ownership, imposing our description) reproduces the asymmetry.
  **The Rule:** We will actively solicit materials from under-represented groups *only* under **Community Custody Agreements**. We do not take ownership. We provide storage/scanning equipment; the community retains control over access and description. We catalog the *existence* of the collection, not necessarily the contents. If a community prefers we take full ownership, we may, but only if the Panel approves the description plan. **We will not collect "on our terms" as a default.**

  ---

  ### V. THE ARCHIVE'S OWN SILENCE (INTERNAL RECORDS)

  **Rule:** The Archive's administrative records are permanent.
  *   **Series A:** Retention Schedules.
  *   **Series B:** Destruction Logs (what we threw away).
  *   **Series C:** **The Refusal Log** (what we said no to).
  *   **Requirement:** Every declined offer (Step 1-4) generates a one-page entry in Series C. This entry *becomes* the source data for any S-5 (Imposed) Silence Notes in the future.
  *   **Rationale:** If we deaccession 1/3 of our holdings, the Destruction Log is as historically vital as the holdings themselves. It documents the second draft of history.

  ---

  ### VI. CASE APPLICATIONS

  Here is the procedure applied to your three current offers.

  #### CASE 1: Property Management Company (1974–2003)
  *   **Contents:** Eviction files, ledgers, complaints.
  *   **Condition:** Reading room named for founder.
  *   **Procedure Run:**
      1.  **Capacity:** Moderate (likely 5-10 boxes). Pass.
      2.  **Redundancy:** High. You hold Housing Court summonses and Tax Rolls. Tenants appear as defendants there.
      3.  **Ethics/Values:** **TRIGGER.** Naming rights (quid-pro-quo) + Sensitive tenant data (debt/eviction).
      4.  **Panel Decision:** The Panel must rule on the naming right. **Standard:** We do not sell naming rights for reading rooms. This is a hard policy stop.
      5.  **Silence Analysis:** If we decline, this is **S-5 (Imposed)**. If we accept, tenants are still **S-1 (Null)** regarding their side of the story (these are landlord records).
  *   **Verdict:** **DECLINE.**
  *   **Reasoning:** The naming condition violates ethical standards (Panel trigger). Even without the condition, the Redundancy Check suggests you hold the public record of these evictions already. Taking private landlord records consumes space needed for tenant voices.
  *   **Action:** Enter into Refusal Log (Series C). Create an S-5 Silence Note in the *City Housing Court* finding aid: *"The archive declined private records from [Property Co.] on [Date]; tenant perspectives in this era are limited to public court summaries."*

  #### CASE 2: Ghanaian Congregation Cassettes (1989–2004)
  *   **Contents:** 200 tapes, services, counseling, immigration discussions.
  *   **Constraint:** Language barrier, no consent from subjects, privacy risk.
  *   **Procedure Run:**
      1.  **Capacity:** High risk. 200 tapes require transcription/listening to process safely. This exceeds the 15% hour limit.
      2.  **Ethics/Values:** **TRIGGER.** Sensitive data (immigration status) + Consent (Pastor donated without congregant knowledge) + Language (Opaque).
      3.  **Active Collecting Rule:** This falls under "under-represented community." Traditional acquisition is forbidden without Community Custody Agreement.
      4.  **Silence Analysis:** Currently **S-4 (Opaque)** (language) and potential **S-2 (Lost)** if tapes degrade. If we take them without consent, we create an ethical breach.
  *   **Verdict:** **DEFER (Do Not Accession).**
  *   **Reasoning:** You cannot process what you cannot understand, and you cannot hold legal liability for immigration status disclosures. Taking them now reproduces the "asymmetry in a friendlier voice"—you become the vault for a community you cannot serve.
  *   **Action:** Refer to Panel. Proposal: Offer the congregation storage space *in their church* with dehumidifiers provided by the archive. Offer to train a volunteer from the congregation to digitize/transcribe. Once a catalog exists *in Twi and English*, revisit acquisition.
  *   **Silence Note:** In your general guide: *"Records from the [Congregation] 1989-2004 exist in private custody; the archive holds a Refusal Log entry (Series C) detailing the capacity and language barriers preventing acquisition as of 2023."* (This turns the refusal into a bridge).

  #### CASE 3: City Councillor Papers (40 Linear Feet)
  *   **Contents:** Correspondence, drafts, subject files. Endowment attached.
  *   **Constraint:** 40 ft = ~1 year of processing capacity. Fits existing holdings perfectly.
  *   **Procedure Run:**
      1.  **Capacity:** **FAIL.** 40 feet exceeds the 15% threshold (it is 100% of your capacity).
      2.  **Redundancy:** Moderate. You have Council Minutes, but this provides the "why."
      3.  **Ethics/Values:** **TRIGGER.** This is the "power structure" collection. Taking this consumes the resources needed for the Ghanaian cassettes or tenant records.
      4.  **Silence Analysis:** Accepting this creates an **S-5 (Imposed)** silence on *other* communities for the next year.
  *   **Verdict:** **DECLINE (The Answer You Will Dislike).**
  *   **Reasoning:** This is the "perfect fit" trap. It reinforces the existing narrative (official power) and monopolizes your scarce labor. The endowment does not buy labor time you do not have. To accept this is to choose the history of the ruler over the history of the ruled for the next 12 months.
  *   **Action:** Offer to take a **Sample** (max 2 feet) of personal correspondence regarding specific community issues, declined by the Panel if it doesn't meet representation goals. Enter the bulk refusal in Series C.
  *   **Silence Note:** In the *City Council Minutes* finding aid: *"Personal papers of Councillor [Name] were declined due to processing capacity constraints; researchers should note that official minutes reflect outcomes but not deliberative dissent found in private correspondence."*

  ---

  ### VII. LIMITATIONS AND REVISION NOTE

  **What This Procedure Cannot Do:**
  1.  **It cannot fix the past.** Documenting a silence (S-1) does not restore the lost voices. It merely marks the grave.
  2.  **It cannot force community trust.** The "Community Custody" model for the Ghanaian congregation relies on their willingness to partner. They may rightly view you as an extractive institution regardless of your protocol.
  3.  **It cannot solve the space crisis alone.** You are still moving and cutting 1/3. This protocol ensures the cuts are conscious, but the pain of deaccessioning remains.

  **The Step Most Likely to Be Revised:**
  **The 15% Capacity Threshold (Step 1).**
  *   **Reason:** In three years, you may find a collection that is *so* critical (e.g., the only record of a demolished neighborhood) that it warrants consuming 50% of your annual capacity. Rigid adherence to the "15% Rule" risks bureaucratic paralysis in the face of emergency history.
  *   **Revision Path:** Allow the Community Advisory Panel to vote on a "Capacity Override" for collections of critical cultural urgency, provided a deaccessioning plan for lower-priority holdings is submitted simultaneously.

  **Final Judgment Call:**
  I have marked the **Case 3 (Councillor)** rejection as the critical test. It is easier to say no to a landlord (Case 1) or a complex foreign language donation (Case 2) than to say no to the "official history" that legitimizes your own existence as a municipal archive. If you cannot reject the Councillor's papers to make room for the Congregation's tapes, this procedure is merely decoration. The silence you create by accepting the Councillor's papers is louder than the silence of refusing them.
