prompt: |-
  I direct a small municipal archive in a city of about ninety thousand, and I came to the job from a history PhD rather than from an archives program. My staff is me, one part-time technician, and a rotating set of volunteers; we get thirty to forty offers of material a year and can properly process perhaps eight of them; we are moving buildings in eighteen months and have been told to plan on leaving behind roughly a third of what we hold. Our existing holdings are what you would expect from a city that grew around a rail yard: deeds and plat maps, tax assessor rolls, council minutes and departmental correspondence, the papers of two founding families. The people who make up most of the city now — renters, recent immigrants, a large Ghanaian Pentecostal congregation, the families who pass through the housing court — appear in those papers almost entirely as entries someone else generated: a name on a summons, a line in a ledger, a photograph taken from the sidewalk. I take the point that archives are not neutral and that the shape of a collection is an effect of power rather than a residue of chance. What I cannot work out is what follows from that on a Tuesday morning, when a box is on the table and I have perhaps half a day to decide whether it comes in, and how it gets described if it does.

  What I want is a written procedure my team can actually run, not a set of principles. It should cover appraisal (do we take it, do we decline, do we take it with conditions, and when do we take only a description of it rather than the thing itself) and description (what we are obliged to say about a collection in the finding aid beyond what it contains). The part I care most about is that it should treat gaps as objects to be documented rather than lamented: I want my staff to be able to distinguish, in a repeatable way, a silence that was never created from one that was destroyed, from one that survives somewhere we cannot find it, from one that exists in a form or language we cannot render, from one we ourselves are creating right now by declining or deferring; and I want each of those to have its own test, its own standard of evidence, and its own line in the catalogue record — call it a silence note — written in language a twenty-year-old volunteer can apply to a box without a seminar in theory. I also want the procedure to say, explicitly, where it stops with a no, and where it must stop and hand the question to our community advisory panel because the issue is one of values rather than of fact. Two further wrinkles: the archive's own paperwork (retention schedules, destruction logs, the files of past refusals) is itself a record of the archive's silences, and I want to know whether the procedure should capture that; and one of my board members has proposed that we simply correct the imbalance by actively collecting from under-recorded communities, which I half suspect reproduces the same asymmetry in a friendlier voice, since the material would still enter on our terms, under our description, in our building. Please commit on that dispute rather than describing both sides.

  Then run the procedure, at whatever length is needed, on three real-shaped cases. First: the records of a property management company, 1974 to 2003 — eviction files, rent ledgers, maintenance complaints, a few photographs — in which tenants appear only as defendants, debtors and complainants, offered to us by the founder's daughter on the condition that the reading room be named for her father. Second: a box of maybe two hundred audio cassettes from that Ghanaian congregation, services, counselling sessions and committee meetings from 1989 to 2004, donated by a departing pastor without the knowledge of anyone recorded on them, in a language none of my staff speaks, and including discussions of congregants' immigration status. Third: the papers of a long-serving city councillor, forty linear feet, offered with a small cash endowment attached, which would consume essentially all of our processing capacity for the next year and would fit our existing holdings perfectly. I expect the procedure to give me an answer I dislike in at least one of these; give it to me anyway and say so. Where you are making a judgment call dressed up as a step, mark it as one; and commit to the rule you would actually adopt and why, rather than laying out the menu and leaving me to choose — including, at the end, an honest note on what this procedure cannot do, and which of your steps you would be least surprised to find yourself revising in three years.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Director of a small municipal archive (pop. ~90k). Background: History PhD, not archival science. Staff: Very small (1 PT tech + volunteers).
      *   **Constraints:** Moving in 18 months, must deaccession ~1/3 of holdings. Intake capacity: ~8 collections/year out of 30-40 offers.
      *   **Problem:** Existing holdings reflect power structures (landowners, officials) rather than current demographics (renters, immigrants, Ghanaian congregation, housing court users). Acknowledges archives are not neutral.
      *   **Goal:** A *written procedure* (not principles) for Appraisal and Description.
      *   **Key Requirement:** Treat "gaps/silences" as objects to be documented. Needs a "Silence Note" system with specific tests/standards for different types of silence (never created, destroyed, elsewhere, unrenderable, created by us). Must be usable by a 20-year-old volunteer.
      *   **Governance:** Must define where the procedure stops (hard no) and where it goes to a Community Advisory Panel (values judgment).
      *   **Meta-Requirement:** Must address the archive's own paperwork (retention/destruction logs) as records of silence.
      *   **Dispute Resolution:** Must *commit* on the board member's proposal (active collecting vs. reproducing asymmetry), not just describe both sides.
      *   **Application:** Run the procedure on three specific cases (Property Management, Ghanaian Cassettes, City Councillor).
      *   **Tone/Style:** Practical, actionable, honest about limitations. Must give an answer the user might dislike in at least one case. Must mark judgment calls. Must include a "Limitations/Revision" note at the end.

  2.  **Deconstruct the Core Challenge:**

      *   The user is asking for *operationalized critical archival theory*. They don't want "acknowledge bias"; they want "if X, then write Y in the finding aid."
      *   The "Silence Note" is the innovative core. It needs to be simple enough for a volunteer but rigorous enough to satisfy a PhD.
      *   The space constraint (moving, deaccessioning) makes appraisal ruthless.
      *   The capacity constraint (8 collections/year) means saying "no" is the default.

  3.  **Drafting the Procedure (The "Silence-Aware Appraisal & Description Protocol" - SAADP):**

      *   *Structure:* Intake Triage -> Appraisal Decision -> Silence Classification -> Description Requirements -> Governance Triggers.
      *   *The Silence Note:* Needs 5 categories based on the prompt.
          1.  *Null:* Never created.
          2.  *Lost:* Destroyed/Deleted.
          3.  *Displaced:* Exists elsewhere.
          4.  *Opaque:* Exists here but unreadable (language/format).
          5.  *Imposed:* Created by our refusal/deferral.
      *   *Governance:* Hard rules for space/capacity vs. Values rules for the Panel.
      *   *Internal Records:* Yes, capture the archive's own refusal logs as a collection.
      *   *Active Collecting:* Need to take a stance. The prompt asks to commit. The risk of "collecting on our terms" is real, but *not* collecting guarantees silence. The middle path is "stewardship without possession" or "co-creation." I need to pick one. *Decision:* Active collecting is necessary but must change the *terms* of entry (custody vs. ownership, community description). I will argue for a "Community Custody" model where possible, rather than traditional acquisition.

  4.  **Developing the "Silence Note" Logic:**

      *   How does a volunteer know the difference?
      *   *Never Created:* Evidence of activity exists, but no record was made (e.g., oral agreements in a community that doesn't use paper).
      *   *Destroyed:* Evidence of destruction exists (logs, rumors, fire).
      *   *Elsewhere:* We know who has it (another archive, family).
      *   *Unrenderable:* We have it, but can't read/transcribe it (language, encryption).
      *   *Imposed:* We are saying no to this offer.
      *   *Action:* Each gets a specific code and a mandatory sentence structure for the finding aid.

  5.  **Addressing the Board Member's Dispute:**

      *   *Option A:* Don't actively collect (preserves neutrality, maintains status quo silence).
      *   *Option B:* Actively collect (risks colonial dynamics).
      *   *My Commitment:* Option B is morally required *if* the method changes. Traditional acquisition reproduces asymmetry. The procedure must mandate *partnership* over *acquisition* for under-represented groups. If they won't partner, we document the *refusal* (Imposed Silence) rather than taking the materials on bad terms.

  6.  **Running the Three Cases:**

      *   *Case 1: Property Management (Eviction files + Naming Rights).*
          *   *Issues:* Power dynamic, naming rights (ethical), tenants as defendants.
          *   *Procedure Application:* High risk of "Imposed Silence" if refused, but "Opaque/Power" silence if accepted as-is. Naming rights are a hard no (policy).
          *   *Verdict:* Accept *only* if naming condition is dropped. If accepted, heavy Silence Notes on tenant perspective. *Wait, space constraint.* We are moving and cutting 1/3. Do we need landlord records when we have city records? Probably not. *Hard No* based on redundancy and space, but document the refusal.
      *   *Case 2: Ghanaian Cassettes (Language, Consent, Privacy).*
          *   *Issues:* Consent (pastor donated without permission), Language (staff can't speak), Privacy (immigration status), Space.
          *   *Procedure Application:* "Unrenderable Silence" (language) + "Imposed Silence" (if we refuse). Privacy risk is high.
          *   *Verdict:* Do not take physical custody yet. Create a "Displaced/Elsewhere" record. Work with congregation to digitize/transcribe *there* first. This addresses the "terms of entry" commitment.
      *   *Case 3: City Councillor (40 ft, Endowment, Fits holdings).*
          *   *Issues:* Capacity (40 ft = 1 year work), Redundancy (we have council minutes), Reinforcing power structure.
          *   *Procedure Application:* "Imposed Silence" on the community if we take this (capacity crowding out).
          *   *Verdict:* *Hard No* on full processing. Maybe sample? But 40ft is too big for 8/year capacity. This is the "answer I dislike." We must reject the "perfect fit" to make space for the difficult stuff.

  7.  **Refining the Output:**

      *   *Tone:* Professional, directive, empathetic to the constraints.
      *   *Formatting:* Clear headings, checklists, bold text for actionable items.
      *   *Self-Correction during drafting:* Make sure the "Silence Note" isn't too theoretical. It needs to look like a form field. Ensure the distinction between "Panel" and "Director" is clear.
      *   *The "Dislike" Answer:* The City Councillor papers are the obvious trap. They fit the mission but kill the capacity. I need to recommend rejecting them (or severely sampling) to prove the procedure works. I'll recommend rejection/sampling to free up capacity.
      *   *Internal Records:* Explicitly state that the "Refusal Log" is a permanent record series.

  8.  **Final Review against Constraints:**

      *   Written procedure? Yes.
      *   Appraisal & Description covered? Yes.
      *   Silence Note with 5 types? Yes.
      *   Governance (Panel vs. Director)? Yes.
      *   Internal paperwork included? Yes.
      *   Board dispute committed? Yes.
      *   Three cases run? Yes.
      *   Unliked answer included? Yes (Councillor papers).
      *   Judgment calls marked? Yes.
      *   Limitations note included? Yes.

  9.  **Drafting the Content:** (Mental check: Ensure the "Silence Note" instructions are simple enough for a volunteer. Use codes like S-1, S-2, etc.)

      *   *Refining the Board Dispute:* I will argue that active collecting is mandatory *but* only under "Community Custody" agreements. If the community doesn't want to co-curate, we don't take it. This avoids the "asymmetry in a friendlier voice."
      *   *Refining Case 1:* The naming right is a dealbreaker. But also, do we need private eviction files if we have public housing court records? If the public records are sparse, maybe. But with the 1/3 cut, private redundancy is a luxury. I'll lean towards "Decline" to save space, but document the silence.
      *   *Refining Case 2:* Privacy is the killer here. Immigration status on tape? Cannot accept without redaction. Staff can't redact what they can't understand. Must go back to community.
      *   *Refining Case 3:* This is the big one. 40 linear feet is half the annual intake capacity (assuming 8 collections avg 5-10 ft?). Actually, 8 collections might be small. 40 ft is huge. It consumes the "8 collections" slot entirely. I must recommend declining or extreme sampling. I will recommend declining to make the point about capacity vs. "fit."

  10. **Final Polish:** Check the voice. It should sound like a senior colleague writing a memo, not a textbook. Acknowledge the PhD background but pivot to praxis. (Self-Correction: Ensure the "Silence Note" doesn't become bureaucratic bloat. Keep it to one sentence per code.)

  *(Self-Correction on Case 1)*: The prompt says "give me an answer I dislike." Rejecting the Councillor papers is the most painful for a traditional archivist. Rejecting the Property Management is easier. Rejecting the Cassettes is ethically necessary. I will make the Councillor papers the "No" to highlight the capacity constraint.

  *(Self-Correction on Board Dispute)*: I need to be firm. "Active collecting is required, but traditional acquisition is forbidden for these groups."

