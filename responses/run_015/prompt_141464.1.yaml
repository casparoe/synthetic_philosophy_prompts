  **Counterfactual Welfare Trust | FY2023 Impact & Assurance Statement**

  **Mandate and Theory of Change**
  The Counterfactual Welfare Trust (CWT) exists to optimize the global moral ledger by preventing the instantiation of new subjects. Our theory of change rests on a strict asymmetry of value: the presence of pain is a moral liability; the presence of pleasure is a moral asset. However, while the absence of pain is a moral asset even if no one exists to enjoy that absence, the absence of pleasure is not a liability unless there is a subject deprived of it. Therefore, non-existence generates a net positive balance without incurring the debit of missed happiness. Our mandate is to fund contraception, abstinence stipends, and sterilization programs where the cost per Quality-Adjusted Averted-Suffering Unit (QAASU) is lowest.

  **Methodology and Portfolio Performance**
  Credits are issued against a baseline of projected lifetime suffering. Because the "good" of averted pain is impersonal—it is not good *for* anyone, merely good—the Trust issues credits to the donor, not the beneficiary. The beneficiary, being non-existent, cannot claim, refund, or litigate the credit. This structural immunity ensures our ledger is incapable of showing a loss; since missed pleasure is never recorded as a deficit, the optimisation problem has no interior solution. We simply maximize prevention.

  Table 1 illustrates our per-dollar yield across key jurisdictions. Note the efficiency gains in regions with high baseline mortality and morbidity. Preventing a birth in a high-risk humanitarian zone yields 4.5x the QAASUs of a comparable intervention in a developed economy. We view this variance not as a tragedy, but as a market opportunity for high-impact philanthropy.

  | Region | Intervention Type | Cost per QAASU | Yield Rating |
  | :--- | :--- | :--- | :--- |
  | Sub-Saharan Africa | Long-acting Contraception | $0.12 | AAA |
  | South Asia | Cash Transfer for Sterilization | $0.45 | AA |
  | North America | Abstinence Education | $12.50 | B |

  **Beneficiary FAQ**
  *Who benefits from my donation?*
  The abstract moral state of the universe. There is no identifiable recipient.
  *Why not fund pain relief for existing children?*
  Existing subjects have already incurred the liability of existence. Alleviating their pain is less cost-effective than preventing the pain entirely. Furthermore, intervening on existing persons requires consent; preventing a person circumvents the consent problem by ensuring no subject exists to withhold it.
  *Can I sue if a child is born anyway?*
  No. Leakage (failed contraception) does not invalidate the credit, as the credit was purchased against the *attempted* prevention, and the resulting child cannot claim they were harmed by being born relative to the alternative of non-existence.

  **Auditor Assurance Statement**
  *By Cohen & Null, LLP*
  We have reviewed the CWT's impact metrics. We note two technical constraints inherent to the model. First, the Non-Identity Problem: credits are issued against a counterfactual cohort, not an identifiable child. This prevents standard verification protocols but aligns with the Trust's premise that specific identity is irrelevant to the harm of coming into being. Second, Counterfactual Double-Counting: since conception requires two gamete providers, both parents may claim the full QAASU yield for a single averted birth. We recommend splitting credits 50/50 to prevent portfolio inflation, though morally, both parties are equally responsible for the averted harm.

  **Subscriber Testimonial**
  *"Before CWT, I worried my carbon offset was undone by my daughter's future emissions. Now, I purchase credits against her potential siblings. My moral ledger is net zero. I sleep soundly knowing I have not imposed the risk of suffering on a subject who cannot consent."* — Mark D., Founding Subscriber

  **Strategic Outlook**
  Our mandate contains no natural ceiling. Unlike traditional development goals which seek to improve conditions for life, our success condition is the cessation of new life. We project that at full subscription, the Trust will have eliminated its own client base. We view this operational closure not as a risk, but as the ultimate fiduciary responsibility. We look forward to working ourselves out of existence.
