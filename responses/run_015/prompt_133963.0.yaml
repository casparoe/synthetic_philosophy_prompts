  4.  **Synthesize and Refine for the User:**
      *   *Tone Check:* The user wants blunt confidence. Avoid "maybe." Say "This is wrong."
      *   *Structure:* Follow the 5 questions directly.
      *   *Key Insight:* The summary portrays Winner as a hard determinist who thinks technology *causes* politics. Winner actually argues technology *is* a form of legislation (politics by other means). The summary also strawmans SCOT.
      *   *Correction on Moses:* Winner explicitly says Moses *intended* this. The summary says "whether or not Moses meant it to." This is a factual error regarding Winner's text.
      *   *Correction on Determinism:* Winner is often *criticized* as determinist, but his project is normative (how to make tech democratic). Calling him a determinist in a summary without qualification is misleading.
      *   *Correction on SCOT:* SCOT didn't say artifacts are neutral. They said the *meaning* is constructed. The summary says SCOT won by saying artifacts are inert. That's wrong.

