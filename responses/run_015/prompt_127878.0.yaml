answer: |-
  While both inversions structurally decouple observable competence from traditional mental prerequisites, Darwin provides a causal mechanism for generating blind competence whereas Turing offers an epistemic criterion for attributing mind that conceals a hidden explanatory burden regarding the origin of meaning. Logically, the two moves are symmetric in their rejection of vitalism, as both argue that the appearance of design or understanding does not require a pre-existing designer or conscious grasp. Darwin demonstrates that complex adaptation can emerge from blind variation and selection, removing the need for a guiding intelligence at the source. Turing similarly suggests that linguistic behavior can emerge from symbol manipulation, removing the need for accessible conscious experience at the center. In both cases, the observable output is severed from the intuitive internal cause we traditionally demand, challenging the assumption that like effects require like causes.

  However, the directions differ in a philosophically consequential way regarding the validation of that competence. Evolutionary competence is anchored to survival payoff, meaning the absence of comprehension is never a practical deficit because the environment filters for results rather than reasons. If an organism behaves in a way that preserves its genes, the competence is real regardless of internal representation. In contrast, a Turing-style system displaying normative or scientific competence claims to describe reality, not just survive within it. A machine could correctly derive a physical law through syntactic rules without any causal or representational link to the forces those laws describe. This creates a gap where behavioral success does not guarantee semantic grounding, whereas biological success guarantees functional fit.

  This distinction reveals that Darwin's inversion is genuinely explanatory while Turing's is primarily epistemic. Natural selection details the specific algorithmic process—variation, inheritance, and differential survival—that generates adaptive competence over time. It tells us how the design is built without a designer. The Turing test, by contrast, defines the conditions under which an observer is justified in ascribing understanding, but it does not specify how that understanding is constituted. It tells us what we may claim to know about the system, but not how the system achieves semantic contact with the world. Consequently, Turing's framework carries a hidden explanatory burden that Darwin's avoids. To fully explain linguistic competence, one must account for how syntax acquires semantics, or how symbols ground themselves in reality. Darwin requires only causal efficacy, but Turing requires meaning, and without a theory of reference, the computational explanation remains incomplete.
