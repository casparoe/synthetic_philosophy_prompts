          2.  Does the low-turnout/low-info election matter?
          3.  Should the Club case be treated differently than the Lunch case?
          4.  Should they appeal or let it go? (Needs actual reasoning, not just "democracy good").

  2.  **Deconstruct the Core Concepts:**
      *   **Democratic Legitimacy:** The Council claims a mandate. The User questions the strength of that mandate.
      *   **Constitutionalism/Rule of Law:** The Court claims the Council violated a higher law (School Constitution).
      *   **Judicial Review:** The power of a court to void legislative acts.
      *   **Process vs. Substance:** Did the Council follow the rules to pass the law (process), or is the law itself bad/unconstitutional (substance)?

  3.  **Address Question 1: Process vs. Substance Distinction:**
      *   *Is it real?* Yes, absolutely. In legal theory and political science, this is the core tension of judicial review.
      *   *Application:* If the Court says "You didn't hold enough votes to pass this," that's process. If they say "This rule violates freedom of association/speech in the Constitution," that's substance.
      *   *Nuance:* Most constitutions limit *what* can be done (substance), not just *how*. So, a Court *should* be able to void substantive violations of the Constitution. However, they shouldn't just void things because they think it's a *bad idea* (policy disagreement).
      *   *Verdict:* The classmate is partially right but misses that Constitutions usually contain substantive rights. If the Lunch Rule violates a right, the Court *should* stop it.

  4.  **Address Question 2: Election Legitimacy (400/1800):**
