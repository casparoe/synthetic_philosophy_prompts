      *   *Middle Ground:* Accept the Lunch ruling (it was probably unpopular and maybe unconstitutional) but fight the Club ruling *if* the reasoning is weak.
      *   *Long Term:* Fix the Constitution. If the Court is too powerful, amend the doc to limit their scope (e.g., "Court can only rule on procedural violations").

