      *   *Distinction:* The Lunch Rule affects *everyone*. The Club decision affects a *specific group*. Judicial intervention is often more justified when rights of minorities (club seekers) are trampled by the majority (Council).
      *   *Verdict:* The Club case might be stronger for the Court to intervene if it involves discrimination or viewpoint bias.

  6.  **Address Question 4: Appeal or Let Go? (Strategic Advice):**
