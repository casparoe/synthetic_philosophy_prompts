prompt: |-
  I sit on the technical advisory board of a public-interest funder that is about to commit roughly three years of support to about eight researchers working on conceptual and theoretical questions in algorithmic fairness — formal modeling, impossibility and trade-off results, and the interpretation of what those results actually establish. Not empirical audits, and not engineering. Our difficulty is not that the area is unexplored but that it is top-heavy with one kind of result. There is by now a familiar cluster of mismatch findings: independence, separation, and sufficiency cannot all hold at once except in degenerate cases such as equal base rates across groups or a perfect predictor; several natural error-rate criteria come apart in the same way; and the routes to satisfying several criteria jointly tend to run either through worsening outcomes for some group without improving anyone's, or through deliberately randomizing decisions. My colleagues split between those who treat these as essentially complete for the single-decision setting and want them treated as settled background from now on, and those who think the whole framing rests on idealizations that dissolve once real deployment is described accurately.

  What I want from you is a defended agenda rather than a survey: given that budget and that kind of researcher, which open questions should the money actually go to, in what order, and by what criteria? Two features of the deployments we care about push me toward thinking the single-decision idealization is doing serious work. First, procurement: a public agency licenses a risk score from a commercial vendor, never observes protected-class membership itself, and audits using group membership probabilistically imputed by a separate third-party model, so every fairness criterion has to be restated relative to a distribution over group labels rather than to group labels. Second, composition and repetition: the score is one input to a human caseworker who can override it, and the same population is scored again and again over years, its composition shifting partly in response to earlier decisions. Please also rule on some candidate questions I keep putting on the list and then doubting: whether the mismatch results genuinely generalize to the imputed-membership and multi-stage settings, or whether in those settings they quietly turn into claims about the auditor's uncertainty rather than about the decision-maker's fairness; whether the leveling-down worry is a real objection to these results or only a sign that they should be stated as choices among feasible sets rather than as dilemmas; and whether some items on my list are not open questions at all but definitional preferences or artifacts of how someone chose to formalize the setup. For each question you rank, say what makes it worth the years: which downstream questions its answer unlocks, whether it is tractable for someone with formal training and no access to proprietary deployment data, whether it is neglected relative to its leverage, and what single result or piece of evidence over the next two years would move it up or down. Where you think the honest answer is that no further theoretical work is the right investment, say that instead.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the Request:**
      *   **Role:** Technical Advisory Board member for a public-interest funder.
      *   **Task:** Create a *defended agenda* (not a survey) for funding ~8 researchers for ~3 years.
      *   **Domain:** Conceptual/theoretical algorithmic fairness (formal modeling, impossibility/trade-offs, interpretation). *Not* empirical audits or engineering.
      *   **Current State:** Top-heavy with "mismatch findings" (impossibility theorems like Independence/Separation/Sufficiency incompatibility).
      *   **The Conflict:** Colleagues split between "settled background" vs. "idealizations that dissolve in deployment."
      *   **Key Constraints/Features of Deployment:**
          1.  *Procurement/Imputation:* Agency doesn't see protected class ($A$), uses third-party imputation ($\hat{A}$). Fairness criteria must be restated relative to distributions over labels.
          2.  *Composition/Repetition:* Human-in-the-loop (overrides), repeated scoring over years, population composition shifts endogenously.
      *   **Specific Questions to Rule On:**
          1.  Do mismatch results generalize to imputed membership/multi-stage settings, or do they become claims about auditor uncertainty?
          2.  Is "leveling down" a real objection or just a sign criteria should be feasible sets?
          3.  Are some items just definitional preferences/artifacts?
      *   **Requirements for each ranked question:**
          *   Why it's worth the years (downstream unlocks).
          *   Tractability (formal training, no proprietary data).
          *   Neglect/Leverage ratio.
          *   Specific evidence/result in 2 years that would move it up/down.
          *   Honesty check: If no further work is needed, say so.

  2.  **Deconstruct the Current Landscape:**
      *   The "Impossibility Trinity" (Chouldechova 2017, Kleinberg et al. 2016) is the dominant paradigm. It assumes: Single shot, known $A$, fixed population, direct implementation of score.
      *   The User's intuition: This paradigm breaks under *real* constraints (imputed $A$, human oversight, dynamics).
      *   The Goal: Move from "Here's why you can't be fair" to "Here's how to navigate fairness under realistic constraints."

  3.  **Evaluate the Specific Candidate Questions:**

      *   *Candidate 1: Imputed Membership & Mismatch.*
          *   *Issue:* If $A$ is unknown and estimated ($\hat{A}$), standard fairness metrics (e.g., Demographic Parity) become expectations over $\hat{A}$.
          *   *Hypothesis:* Impossibility results might shift from "structural incompatibility" to "measurement error bounds." If the imputation is noisy, maybe the constraints loosen? Or maybe they tighten because you have to be robust to imputation error?
          *   *Verdict:* High priority. This directly addresses the procurement constraint. It changes the math from deterministic constraints to probabilistic/robust constraints.

      *   *Candidate 2: Leveling Down & Feasible Sets.*
          *   *Issue:* Impossibility theorems often imply you must harm one group to help another (Pareto inefficiency). "Leveling down" objection says making everyone worse to equalize error rates is bad.
          *   *Hypothesis:* This is partly semantic/philosophical, but formally it relates to *constrained optimization* vs. *impossibility*. If we frame it as choosing a point on a Pareto frontier, the "impossibility" vanishes, replaced by a "choice."
          *   *Verdict:* Medium priority. It's more about interpretation/normative framing than new math, but crucial for policy communication.

      *   *Candidate 3: Definitional Artifacts.*
          *   *Issue:* Are the criteria (Separation, Sufficiency, etc.) the *right* ones?
          *   *Verdict:* Low priority for *new* funding. This has been hashed out extensively. The money should go to *consequences* of definitions, not debating definitions, unless linked to the deployment features (imputation/dynamics).

      *   *Candidate 4: Dynamics & Composition.*
          *   *Issue:* Repeated scoring, human overrides, endogenous population change.
          *   *Hypothesis:* Static impossibility theorems ignore time. Maybe fairness is achievable *over time* even if not *at once*? Or maybe dynamics introduce new instability?
          *   *Verdict:* Highest priority. This is the biggest gap between theory and the described deployment.

  4.  **Develop the Agenda (Ranking & Justification):**

      *   *Priority 1: Fairness under Partial Observation (Imputed $A$).*
          *   *Why:* Directly addresses the procurement constraint. Changes the nature of the impossibility theorems.
          *   *Tractability:* High. Pure probability/statistics theory. No data needed.
          *   *Leverage:* High. Affects all public sector auditing.
          *   *Milestone:* A theorem bounding the deviation of fairness metrics under $\epsilon$-error imputation.

      *   *Priority 2: Dynamic Fairness & Human-in-the-Loop.*
          *   *Why:* Addresses the repetition/override constraint. Static theorems don't apply to sequential decision making with feedback loops.
          *   *Tractability:* Medium/High. Control theory/RL + Fairness.
          *   *Leverage:* High. Most real systems are dynamic.
          *   *Milestone:* A model showing conditions under which dynamic policies converge to a fair steady state despite static impossibility.

      *   *Priority 3: Normative Interpretation of Trade-offs (The "Leveling Down" issue).*
          *   *Why:* Needed to translate math to policy. Is it a dilemma or a choice?
          *   *Tractability:* Medium. Requires philosophy + formalism (social choice theory).
          *   *Leverage:* Medium. More about communication than system design.
          *   *Milestone:* A taxonomy mapping formal constraints to specific normative commitments (e.g., "Choosing Separation implies commitment to X").

      *   *Priority 4 (Deprioritized):* Re-proving static impossibility theorems. (Say "No" to this).

  5.  **Drafting the Response:**
      *   *Tone:* Professional, decisive, technically literate, advisory.
      *   *Structure:*
          1.  Executive Summary (The Pivot).
          2.  The Ruling on Candidate Questions (Direct answers).
          3.  The Funded Agenda (Ranked 1-3).
          4.  What Not to Fund (The "No" section).
          5.  Evaluation Criteria (How to judge the researchers).

      *   *Refining the Arguments:*
          *   *On Imputation:* Emphasize that if $A$ is latent, fairness becomes a *identification problem*. The impossibility might be an identification failure, not a structural one.
          *   *On Dynamics:* Emphasize that human overrides introduce a "policy layer" that can theoretically correct model bias, but might introduce new variance.
          *   *On Leveling Down:* Frame this as "Feasible Frontier Characterization" rather than philosophical debate.

      *   *Checking Constraints:*
          *   3 years? Yes, these are theoretical.
          *   8 researchers? Enough for 2-3 distinct workstreams.
          *   No proprietary data? All proposed work must be mathematical/synthetic.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Priority 2 too empirical?
      *   *Fix:* Frame it as *theoretical modeling of dynamics* (e.g., Markov Decision Processes with fairness constraints), not empirical simulation.
      *   *Critique:* Did I answer the "Leveling Down" question clearly?
      *   *Fix:* Make sure to explicitly state it's a category error in the current literature that needs formal resolution.
      *   *Critique:* Is the distinction between "impossibility" and "uncertainty" clear?
      *   *Fix:* Use the term "Robust Fairness" vs. "Exact Fairness."

  7.  **Final Polish:** Ensure the voice sounds like a senior advisor speaking to peers. Use precise terminology (identification, latent variables, sequential decision processes). (Proceed to generate output based on this thought process).

      *(Self-Correction on the "Leveling Down" point)*: I need to be careful not to dismiss it as *just* philosophy. In economics, "leveling down" is a specific objection to egalitarianism. In fairness, it refers to satisfying parity by worsening the better-off group without helping the worse-off. The prompt asks if this is a real objection or a sign criteria should be feasible sets. My stance: It's a sign that the *optimization objective* is misspecified. The research should focus on *constrained utility maximization* rather than *constraint satisfaction*.

      *(Refining the Imputation point)*: If the agency doesn't see $A$, they can't enforce Separation ($Y \perp A | S$). They can only enforce $Y \perp \hat{A} | S$. The mismatch theorems apply to $A$. Do they apply to $\hat{A}$? If $\hat{A}$ is independent of $Y$ given $S$ (imputed separation), does that imply anything about true separation? This is an *identification* question. This is very fertile ground for theory.

      *(Refining the Dynamics point)*: Human overrides. This makes the decision $D = f(S, H)$ where $H$ is human action. If $H$ is biased, does $S$ matter? If $H$ corrects $S$, can we achieve fairness even if $S$ is impossible? This is a *mechanism design* question.

      *Okay, the plan is solid.* I will structure the response to directly address the prompt's requirements.

      *   **Section 1: Rulings on Candidate Questions.** (Direct answers).
      *   **Section 2: The Funded Agenda.** (Ranked 1-3).
      *   **Section 3: What to Defund.** (The "Settled" stuff).
      *   **Section 4: Evaluation Metrics.** (How to judge success).

      *Let's write.*
answer: |-
  This is a pivotal moment for the field. The "Impossibility Trinity" (Independence, Separation, Sufficiency) has served its purpose: it killed the naive hope that a single metric could satisfy all normative intuitions simultaneously in a static, single-decision setting with known ground-truth attributes. Continuing to fund variations on these proofs is diminishing-returns work.

  Your intuition is correct: the deployment features you describe (imputed attributes, human-in-the-loop, dynamics) are not mere complications; they are structural changes that invalidate the assumptions underpinning the current "settled" impossibility results.

  Here is my ruling on your candidate questions, followed by a defended three-year agenda for your eight researchers.

  ### Part 1: Rulings on Candidate Questions

  **1. Do mismatch results generalize to imputed-membership settings, or do they become claims about auditor uncertainty?**
  **Ruling:** They largely dissolve into claims about **identification and robustness**, not structural impossibility.
  **Reasoning:** The classic impossibility theorems assume the regulator can condition on $A$ (protected class). If the agency only observes $\hat{A}$ (imputed class), the fairness criteria are no longer constraints on the decision rule $D$ relative to $A$, but constraints on the joint distribution of $(D, \hat{A})$. The "impossibility" often becomes a statement about the variance of the imputation model. If $\hat{A}$ is noisy, the constraints on $D$ loosen (you can't be perfectly unfair even if you tried), or they shift to requiring robustness over a set of plausible $A$-distributions.
  **Verdict:** This is a high-leverage theoretical opening. It shifts the problem from "You can't satisfy these constraints" to "You can satisfy these constraints up to an error bound determined by your audit quality."

  **2. Is the "leveling-down" worry a real objection or a sign that criteria should be stated as feasible sets?**
  **Ruling:** It is a sign that the **optimization objective is misspecified**, not a fundamental dilemma.
  **Reasoning:** "Leveling down" (worsening the better-off group to achieve parity without helping the worse-off) arises when fairness is treated as a hard constraint rather than a term in a welfare function. In a static setting, this looks like a dilemma. In a constrained optimization framing, it simply identifies points on the Pareto frontier that are normatively dominated. The theoretical work shouldn't be debating whether leveling down is bad (it is); it should be formalizing **fair welfare orderings** that rule out leveling-down by construction.
  **Verdict:** Fund work that integrates fairness into objective functions, not work that debates the philosophy of leveling down.

  **3. Are some items on my list not open questions but definitional preferences?**
  **Ruling:** Yes. The debate over whether "Fairness is Independence" vs. "Fairness is Separation" is largely definitional preference masquerading as technical discovery.
  **Reasoning:** We know what mathematical properties these criteria have. We know which causal stories they align with. Funding more papers that argue "Criterion X is the *true* fairness" is a waste.
  **Verdict:** Do not fund researchers proposing to solve "which metric is best." Fund researchers proposing "under what deployment conditions does Metric X become unidentifiable or unstable?"

  ---

  ### Part 2: The Funded Agenda (Ranked)

  Given three years and eight researchers, I recommend organizing them into three workstreams. The goal is to move from **Static Impossibility** to **Dynamic Feasibility under Uncertainty**.

  #### Priority 1: Fairness under Latent Attributes (The Procurement Constraint)
  **The Question:** When $A$ is unobserved and estimated via $\hat{A}$, do the impossibility theorems hold, or do they transform into bounds on audit power?
  **The Work:** Formalize fairness criteria where group membership is a latent variable. Treat the imputation model as a source of measurement error. Derive the "Robust Fairness Frontier": the set of decision rules that satisfy fairness criteria for *all* $A$-distributions consistent with the observed $(\hat{A}, X, Y)$ data.
  **Why it's worth the years:**
  *   **Downstream Unlocks:** This provides the mathematical basis for procurement contracts. Instead of demanding "Demographic Parity," agencies can demand "Robust Parity within $\epsilon$ of imputation error." It turns a philosophical deadlock into an engineering specification.
  *   **Tractability:** High. This is pure statistical learning theory and causal identification. No proprietary data is needed; researchers can assume arbitrary distributions for $A$ and $\hat{A}$.
  *   **Neglect/Leverage:** High neglect. Most fairness literature assumes $A$ is known. High leverage because this matches the actual legal/technical constraint of public agencies (who often cannot legally collect $A$).
  *   **2-Year Milestone:** A theorem establishing the minimum imputation accuracy required to distinguish between a "fair" and "unfair" classifier with statistical significance. If the answer is "you need 99% accuracy," the field knows current auditing is futile. If it's "60%," auditing is viable.

  #### Priority 2: Sequential Fairness with Human Overrides (The Composition Constraint)
  **The Question:** In a repeated setting where humans can override scores, does the static impossibility theorem persist, or can dynamic policies achieve fairness over time even if static snapshots cannot?
  **The Work:** Model the system as a Markov Decision Process (MDP) or a repeated game. The state includes the population composition (which shifts based on prior decisions). The action includes the algorithmic score *and* the human override policy. Investigate whether there exist dynamic policies that converge to a fair steady state, even if no static policy satisfies the fairness criteria at $t=0$.
  **Why it's worth the years:**
  *   **Downstream Unlocks:** This justifies (or condemns) the cost of human-in-the-loop systems. It moves the field from "the algorithm is biased" to "the socio-technical system is unstable."
  *   **Tractability:** Medium-High. Requires control theory and game theory. Researchers can use synthetic populations to prove convergence theorems.
  *   **Neglect/Leverage:** Medium neglect. Dynamic fairness is emerging, but rarely includes the *human override* mechanism as a variable. High leverage because it addresses the "automation bias" vs. "algorithmic aversion" debate formally.
  *   **2-Year Milestone:** A proof of existence (or non-existence) for a "Fair Convergence Policy." Specifically: Under what conditions on the human override cost function does the system converge to a state where Separation holds, even if the base score violates it?

  #### Priority 3: Operationalizing the Feasible Set (The Leveling-Down Constraint)
  **The Question:** How do we formalize "normatively dominated" points on the fairness-accuracy frontier to prevent leveling-down without relying on vague ethical hand-waving?
  **The Work:** Develop a formal language for **Constrained Social Welfare**. Instead of treating fairness as a constraint (which leads to impossibility/leveling down), treat it as a component of a welfare function that exhibits "Fairness Monotonicity" (improving a disadvantaged group's outcome should not reduce welfare, even if parity decreases).
  **Why it's worth the years:**
  *   **Downstream Unlocks:** Provides vendors and agencies with a single objective function to optimize, rather than a menu of incompatible metrics.
  *   **Tractability:** Medium. Requires social choice theory and economics.
  *   **Neglect/Leverage:** High neglect. Most CS fairness work avoids welfare economics. High leverage because it solves the "which metric?" paralysis.
  *   **2-Year Milestone:** A proposed "Fair Welfare Index" that is proven to be immune to leveling-down objections and can be optimized using standard gradient methods.

  ---

  ### Part 3: What Not to Fund (The "Settled" Background)

  You asked where the honest answer is "no further theoretical work." Here it is:

  1.  **New Impossibility Theorems for Static, Known-$A$ Settings:**
      *   **Decision:** **Defund.**
      *   **Reason:** We know Independence, Separation, and Sufficiency are incompatible under base rate differences. Proving this for a fourth metric, or in a slightly modified static setup, adds no value. It is mathematically elegant but policy-paralyzing.
      *   **Exception:** Unless the researcher is explicitly using the impossibility proof to demonstrate *why* the imputation or dynamic approaches (Priority 1 & 2) are necessary.

  2.  **Metric Comparison Studies (Simulation-Based):**
      *   **Decision:** **Defund.**
      *   **Reason:** Papers that take 10 public datasets, run 5 fairness algorithms, and report "Algorithm X worked best on Dataset Y" are empirical audits, not theory. They do not generalize to the procurement/dynamic settings you care about.
      *   **Exception:** If the simulation is specifically testing the *bounds* derived in Priority 1 (e.g., testing how imputation noise degrades fairness guarantees).

  3.  **Causal Fairness Definitions (Purely Conceptual):**
      *   **Decision:** **Defund.**
      *   **Reason:** The literature on "Fairness on the Merits" vs. "Counterfactual Fairness" is mature. The barrier is not defining them; it's that the required causal graphs are unidentifiable in the procurement setting (agencies don't see $A$, so they can't condition on it for causal adjustment).
      *   **Exception:** Work that specifically addresses causal identification *under latent $A$* (fits into Priority 1).

  ### Part 4: Evaluation Criteria for the Researchers

  To ensure this money yields results rather than papers, evaluate the researchers on these criteria at the 18-month mark:

  1.  **The "Procurement Test":** Can the researcher explain their result to a general counsel who says, "I am not allowed to collect race data, but I need to prove I am not discriminating"? If the theory requires ground-truth $A$, it fails this test.
  2.  **The "Vendor Test":** Does the result give a commercial vendor a clear loss function to optimize? If the result says "You must choose between A and B," it is old news. If it says "Optimize C to satisfy A within bound $\epsilon$," it is fundable.
  3.  **The "Tractability Test":** Is the result dependent on untestable assumptions about the human override behavior? If the dynamic model assumes humans are perfectly rational or perfectly biased without parameterization, it is not useful.

  ### Summary Recommendation

  Commit the budget to **Priority 1 (Latent Attributes)** and **Priority 2 (Dynamics/Overrides)**. These directly attack the two deployment features you identified as breaking the current paradigm.

  *   **Allocate 4 researchers to Priority 1:** This is the most immediate bottleneck. If we cannot define fairness without ground-truth $A$, the rest of the field is moot for public agencies.
  *   **Allocate 3 researchers to Priority 2:** This is the long-term play. Understanding the stability of fairness over time is critical for multi-year contracts.
  *   **Allocate 1 researcher to Priority 3:** This is the synthesis role, translating the mathematical bounds from Group 1 and 2 into welfare objectives.

  This agenda accepts the "mismatch findings" as true *within their specific assumptions*, but treats those assumptions as the variable to be solved, rather than the constraints to be accepted. It moves the field from "Algorithmic Fairness is Impossible" to "Algorithmic Fairness is an Identification and Control Problem."
