answer: |-
  **MEMORANDUM**

  **TO:** Multi-Agent RL Lab Slack
  **FROM:** Decision Theory & ML Philosophy
  **SUBJECT:** Translation of Superrationality into Causal/RL Vocabulary

  Here is the breakdown you requested. I begin by isolating the ingredients of superrationality that require translation, flagging where your causal framing conflicts with the philosophical premises, then execute the translation, address the divergent-checkpoint cases, and file the residue report.

  ### 1. Ingredients and Assumption Flags

  To translate superrationality, we must map five components:
  1.  **Rationality:** Not merely maximizing expected utility (EU) given causal beliefs, but maximizing EU given *logical* beliefs.
  2.  **Sameness:** Not physical identity, but logical equivalence of source code or reasoning algorithms.
  3.  **Counterfactual:** Not "if I *cause* X," but "if the output of my algorithm is X."
  4.  **Fixed-Point:** The recommended action is a fixed point of the reasoning process shared by agents.
  5.  **Payoffs:** Standard utility, but the expectation operator ranges over logical correlations, not causal paths.

  **Flagged Assumption:** Your framing assumes **Modularity** (the core of SCM). In your graphs, $do(A)$ severs all incoming edges to node $A$. Superrationality denies this modularity for logical twins. It asserts that intervening on your action *cannot* sever the link to your twin's action because both are downstream of the same logical fact (the algorithm). Your vocabulary assumes causal separation; superrationality assumes logical entanglement.

  ### 2. The Translation: Which Node is Intervened On?

  Restated in your terms: You and your opponent are instances of the same policy $\pi_\theta$. Let $A_1 = \pi_\theta(S_1)$ and $A_2 = \pi_\theta(S_2)$. In a symmetric one-shot Prisoner's Dilemma (PD), $S_1 = S_2$.

  **The Node:** The superrationalist is not intervening on the action node $A$. In SCM terms, they are intervening on the **structural equation** itself. Standard Causal Decision Theory (CDT) evaluates $E[U | do(A_1 = \text{coop})]$, which severs the link between $A_1$ and $A_2$, yielding defection. Superrationality (formalized today as **Functional Decision Theory** or FDT) evaluates $E[U | \text{output}(\pi_\theta) = \text{coop}]$. This treats the algorithm $\pi_\theta$ as the common cause. You are not choosing an action; you are choosing the output of the function that generates actions for all instances of $\theta$.

  **Equilibrium Concept:** You are correct; this is not a Correlated Equilibrium (CE). A CE requires an external correlating device (a signal). Superrationality selects a **Program Equilibrium** (Tennenholtz, 2004) or an FDT fixed point. It requires the policy $\pi$ to be a fixed point of its own optimization landscape: $\pi^* = \arg\max_\pi E[U(\pi, \pi)]$. This is not a best response to a fixed opponent; it is a best response to the *logical implication* of deploying $\pi$.

  ### 3. The Divergent-Checkpoint Dilemma

  You and your twin are replicas of $\pi_\theta$. The twin receives $k$ gradient steps on private data to become $\pi_{\theta'}$.

  **(i) Similarity Metric and Thresholds**
  The metric is not parameter distance ($||\theta - \theta'||$) but **behavioral equivalence on the decision boundary**. Superrationality holds only if you can logically deduce that $\pi_{\theta'}(S) = \pi_\theta(S)$.
  *   **Continuity:** The recommendation does *not* vary continuously. It flips discontinuously at the threshold where the $k$ steps alter the policy's decision logic for this specific input.
  *   **Principled Basis:** The flip occurs when logical correlation drops below the payoff ratio required to sustain cooperation. If $P(\text{twin cooperates} | \text{I cooperate}) \times 3 > P(\text{twin defects} | \text{I cooperate}) \times 0 + \dots$, you cooperate. If the gradient steps introduce enough stochasticity or logic divergence to break this inequality, you defect. There is no "partial" cooperation; the logical link is binary (valid/invalid) relative to your proof capacity.

  **(ii) Compute Budget**
  **Yes, the verdict depends on your hardware.** This is a feature of **Logical Uncertainty** (Garrabrant et al.). If you cannot compute the simulation of the $k$ steps, you cannot establish the logical correlation. To the extent that you are uncertain about the output of your own algorithm (because it is too complex to run), you must treat the twin's action as probabilistically independent. Superrationality collapses to CDT under bounded compute. If you cannot prove you are similar, you are not similar for decision-theoretic purposes.

  **(iii) The $\epsilon$ Hard-Coded Defector**
  The view recommends maximizing Expected Utility over the mixture.
  $$EU(\text{coop}) = (1-\epsilon) \cdot 3 + \epsilon \cdot 0 = 3(1-\epsilon)$$
  $$EU(\text{defect}) = (1-\epsilon) \cdot 1 + \epsilon \cdot 1 = 1$$
  Cooperate if $3(1-\epsilon) > 1 \implies \epsilon < 2/3$.
  **Catastrophic Worst Case:** This sits poorly with robustness guarantees. FDT/Superrationality sacrifices worst-case performance against adversarial outliers for average-case gains against logical twins. If $\epsilon$ represents an adversarial attack vector, superrationality is vulnerable. It assumes the "twin" hypothesis is dominant; if the environment is hostile (high $\epsilon$), the logic fails.

  ### 4. Residue Report

  **Translated Without Loss:**
  *   **Payoffs:** Utility functions map cleanly.
  *   **Policy Structure:** The notion of agents as parameterized functions $\pi_\theta$ captures the "agent" concept well.

  **Translated Only After Distortion:**
  *   **Intervention:** I had to stretch the $do(\cdot)$ operator. In your SCM, interventions break edges. In superrationality, interventions traverse logical edges. I substituted "intervening on the structural equation" for "intervening on the node," which your standard do-calculus does not support without modification (e.g., allowing logical dependencies in the graph).
  *   **Equilibrium:** I substituted "Program Equilibrium" for "Correlated Equilibrium." Your framework assumes equilibria arise from strategic stability; superrationality assumes they arise from logical necessity.

  **No Expression in Vocabulary:**
  *   **Normative Rationality vs. Performance:** Your vocabulary optimizes for *performance* (reward maximization). Superrationality optimizes for *rationality* (consistency of reasoning). In RL, a policy that defects and loses is "suboptimal." In superrationality, a policy that cooperates and loses (because the twin defected) is still "rational" if the logical link was valid. Your framework has no variable for "correct reasoning," only "high reward."
  *   **The Action/Policy Gap:** You model agents as policies $\pi$. Superrationality cares about the specific *action* chosen by the policy in this instance being logically linked to the twin's action. RL treats the policy as the unit of selection; superrationality treats the *decision algorithm* as the unit of selection.

  ### 5. Verdict

  Does the residue show your vocabulary is missing something, or that the superrational claim is indeterminate?

  **Verdict:** The superrational claim is less determinate than it sounds, and your vocabulary is sufficient to expose why.

  Your labmate is committing a category error common in early decision theory: conflating **logical correlation** with **causal leverage**. In your SCM framework, there is no path from your action to your twin's action. The correlation exists only in the common past (the checkpoint $\theta$). Once you condition on $\theta$, the actions are independent unless you introduce non-causal logical edges.

  Superrationality works only if you accept **Functional Decision Theory**, which posits that agents can intervene on logical facts. But in your engineering context (logged data, SCMs, physical deployment), causal structure dominates. You cannot change your twin's action by changing yours; you can only predict it. If you cooperate hoping to force their cooperation, you are hallucinating a causal channel where there is only correlation.

  The "residue" of normative rationality is simply the ghost of a causal link that doesn't exist. Your vocabulary doesn't need to expand to accommodate superrationality; rather, superrationality needs to contract to fit within causal reality. In a one-shot PD with no mechanism for binding commitments or source code exchange, **defection is the only stable solution**. The superrationalist cooperates because they are pretending the game is repeated (via logical time) when it is not (in physical time).

  Tell your labmate: Unless you can write a query into the twin's forward pass that conditions their output on yours (acausal trade), you are just two separate causal chains sharing a initialization seed. The seed correlates you; it does not couple you. Cooperating is not "reasoning correctly"; it is betting on a correlation you cannot influence. In RL terms: you are overfitting to the training distribution (the checkpoint) and failing to generalize to the test environment (the independent agent). Defect.
