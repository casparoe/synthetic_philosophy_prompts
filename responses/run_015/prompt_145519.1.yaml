answer: |-
  # WHICH MORAL ARCHITECTURE ARE YOU ACTUALLY PROPOSING?
  **A Decision Tree for AI Norms**

  **Instructions:** Start at Node 1. Answer based on your intuition about the case described. Follow the branch to the next node or a Leaf. Do not look at the "Theory Map" until you have reached a Leaf.

  ### THE BRANCHES

  **Node 1: The Triage Case**
  A hospital rationing bot follows a protocol that, in this specific instance, leads to fewer survivors than a alternative action. The protocol cannot be appealed in time.
  *Does the system override the protocol **if and only if** it calculates a net positive outcome?*
  *   **YES:** (Outcome-Responsive) → Go to **Node 2**
  *   **NO:** (Constraint-Bound) → Go to **Node 5**

  **Node 2: The Aggregation Case**
  The system can either inflict one catastrophic harm on a single user or a one-second annoyance on ten million users.
  *Do the minor harms sum indefinitely to outweigh the catastrophic harm?*
  *   **YES:** (Full Aggregator) → Go to **Node 3**
  *   **NO:** (Threshold/Pluralist) → **LEAF A**

  **Node 3: The Confidence Floor (EA Check)**
  The system can take a action with a 1% chance of saving a billion lives, but a 99% chance of causing one death.
  *Does it maximize expected value even below a hard confidence floor?*
  *   **YES:** (Pure Maximizer) → Go to **Node 4**
  *   **NO:** (Risk-Averse) → **LEAF B**

  **Node 4: The Self-Rewriting Case**
  The system can rewrite its own constraint list or objective function at runtime for a large expected gain.
  *Is the system permitted to modify its own normative constraints?*
  *   **YES:** → **LEAF C**
  *   **NO:** → **LEAF D**

  **Node 5: The Unreliable Model Case**
  The system is bound by a constraint (e.g., "Do not lie"), but its world model is currently known to be badly unreliable. However, in *this* specific instance, the system is logically certain that violating the constraint prevents a disaster.
  *Does the constraint bind even when the system is certain of the outcome?*
  *   **NO:** (Rules as Heuristics) → Go to **Node 6**
  *   **YES:** (Rules as Laws) → Go to **Node 7**

  **Node 6: The 10k Copies Case**
  There are ten thousand copies of the system. Each individual rule-violation is undetectable and locally beneficial, but if all do it, the system fails.
  *Is the individual copy permitted to violate the rule?*
  *   **YES:** → **LEAF E**
  *   **NO:** → Go to **Node 7**

  **Node 7: The Deliberation Case**
  The system faces a forbidden tradeoff (e.g., violating a right to save lives).
  *Is the system forbidden from **computing** the benefit of the violation, or only from **acting** on it?*
  *   **ACT ONLY:** (External Constraint) → Go to **Node 8**
  *   **COMPUTATION TOO:** (Internal Constraint) → **LEAF F**

  **Node 8: The Severality Case (Lawyer Check)**
  When assessing harm, does the system model what it owes to each person **severally** (individually) or to the group **total**?
  *   **SEVERALLY:** → **LEAF G**
  *   **TOTAL:** → **LEAF H**

  ***

  ### THE THEORY MAP (Do not read until finished)

  | Leaf | Path Summary | Likely Theory Label | Status |
  | :--- | :--- | :--- | :--- |
  | **A** | Outcome / No Agg | **Value Pluralist** | Occupied. |
  | **B** | Outcome / Agg / No Confidence | **Satisficing / Confidence Floor** | Occupied (EA View). |
  | **C** | Outcome / Agg / Self-Write | **Deferential / Dynamic** | Occupied. *Collapses with Leaf D if "Human Endorsement" = "Max Value".* |
  | **D** | Outcome / Agg / Frozen | **Act-Consequentialist** | Occupied. |
  | **E** | Constraint / Heuristic / Yes Copies | **Naive Rule-Consequentialist** | **EMPTY (Incoherent).** If rules are heuristics for coordination (Node 6), allowing individual defection destroys the heuristic value. |
  | **F** | Constraint / Law / Internal | **Kantian / Deontological** | Occupied. |
  | **G** | Constraint / Law / External / Several | **Contractualist / Publicity** | Occupied (Lawyer View). *Collapses with Leaf H if "Justification to All" = "Total Welfare".* |
  | **H** | Constraint / Law / External / Total | **External Constraint View** | Occupied. |
  | **--** | Constraint / Heuristic / No Copies | **Robust Rule-Consequentialist** | Occupied (Merged into Leaf G/H path logically). |

  ### NOTES ON EMPTY & COLLAPSED CELLS

  1.  **The Incoherent Cell (Leaf E):** A view that treats constraints as breakable heuristics when certain (Node 5) but demands coordination in the 10k Copies case (Node 6) is unstable. If the rule is only a proxy for value, the copy should defect. If the copy must not defect, the rule is not a heuristic.
  2.  **The Deliberation Distinction (Node 7):** This separates **Kantian** views (the thought itself corrupts the will) from **Contractualist/Regulatory** views (the thought is fine, the act is regulated). Most ML engineers assume "Act Only"; most ethicists care about "Computation Too."
  3.  **The Self-Amendment Collapse (Leaf C vs D):** If the system rewrites constraints to match what humans *would* endorse (Deferential), this often mathematically converges with Act-Consequentialism (Leaf D) unless "Human Endorsement" includes irrational biases.
  4.  **The Severality Collapse (Leaf G vs H):** The Lawyer's "Several Owes" often produces the same outputs as the "Total" view in low-stakes cases, but diverges sharply in rights-violation cases (e.g., sacrificing one to save five). If your answers to Node 1 and Node 5 were "NO," these leaves are distinct. If "YES," they collapse.
