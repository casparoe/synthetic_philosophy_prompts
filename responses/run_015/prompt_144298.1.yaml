answer: |-
  **Q&A Prep Sheet: "The Scaffold Copycat"**

  **Audience Profile:**
  *   **PoS (Kuhn/Feyerabend):** Will challenge whether "precision" is even possible or desirable. They see ambiguity as engine of progress.
  *   **CogSci:** Will challenge the novelty. To them, this is standard conceptual blending.
  *   **SynBio:** Will challenge the harm. If the DNA folds, who cares about the semantics?

  ---

  ### 1. The Cognitive Science Objection (Likely First)
  **The Question:** "You're describing standard conceptual metaphor theory. We map source domains (physical scaffolds) onto target domains (digital structures) all the time. Isn't calling this a 'copycat' concept just pathologizing normal cognition?"

  *   **Concede:** You're right that the *mechanism* is standard blending. I'm not disputing how the mind moves concepts.
  *   **The Reply:** I'm disputing the *accounting*. In standard metaphor, we know the map isn't the territory. Here, the grant language treats the map *as* the territory to secure funding. It's not the cognitive slip that's the problem; it's the institutional erasure of the slip. We aren't saying "this is *like* a scaffold"; we're budgeting as if it *is* one.

  ### 2. The Synthetic Biologist Objection (The Pragmatist)
  **The Question:** "I build DNA origami. If calling an AI energy landscape a 'scaffold' helps my team visualize the folding pathway and we get the yield we need, what is the actual damage? Does this semantics critique change my pipetting?"

  *   **Concede:** It likely doesn't change the bench work. The heuristic value is real.
  *   **The Reply:** The damage isn't in the pipette; it's in the portfolio. When a panel sees "scaffold" in a computational proposal, they infer physical robustness (biodegradability, load-bearing) that doesn't exist. They fund digital projects expecting physical resilience. You get your grant, but the field gets a pile of code that can't hold weight, disguised as structural biology.

  ### 3. The Feyerabendian Objection (The Epistemological Challenge)
  **The Question:** "Feyerabend argued that proliferation of inconsistent concepts drives science forward. By demanding we keep 'material' and 'digital' scaffolds separate, aren't you enforcing a rigid taxonomy that stifles the very category errors that lead to breakthroughs?"

  *   **Concede:** Productive ambiguity is historically vital. New concepts often start as confused metaphors.
  *   **The Reply:** There's a difference between a *generative* confusion and a *financial* one. If the confusion leads to a new experiment, keep it. If the confusion leads to a budget line item based on false mechanistic authority, that's not anarchism; that's misrepresentation. I'm not banning the metaphor; I'm demanding we label the rent-seeking.

  ### 4. The Kuhnian Objection (The Paradigm Challenge)
  **The Question:** "You're treating 'material properties' as if they're stable, theory-independent facts. But in a new paradigm, 'rigidity' in silico might legitimately redefine what rigidity *is*. Are you committing a realist fallacy?"

  *   **Concede:** "Materiality" is theory-laden. Digital constraints are real constraints.
  *   **The Reply:** They are real, but they are not *interchangeable*. A digital constraint doesn't degrade in vivo. A physical scaffold doesn't compile. The harm arises when we pretend the constraints are translatable one-to-one to justify cross-domain funding. I'm not defending naive realism; I'm defending dimensional consistency.

  ---

  ### Where Your Argument Is Weakest
  **The Causal Link.**
  You claim this linguistic slippage *causes* grant panels to borrow authority unnoticed. You have the semantics, but you likely lack the smoking gun that a specific grant was awarded *because* of this word choice rather than the underlying math.
  *   **Defense:** Don't try to prove specific cases. Argue structural incentive. The language *invites* the error because the review criteria for "structural projects" prioritize physical stability metrics that digital projects cannot meet, yet the shared label allows them to pass.

  ### The One Question You Hope Nobody Asks
  **"Okay, you've diagnosed the drift. What is the prescriptive fix? Do we ban the word? Do we require hyphenation (digital-scaffold vs. physical-scaffold)? If you force precision, do you kill the interdisciplinary collaboration you claim to protect?"**
  *   **Why it's dangerous:** It moves you from critic to policymaker. If you say "ban it," you look naive. If you say "do nothing," you look cynical.
  *   **Prep:** Aim for disclosure, not prohibition. "Require a 'translation statement' in grants where terms cross domains. Explicitly list which properties are metaphorical and which are literal."

  ---

  ### What Would Change Your Mind
  **The "Predictive Success" Criterion.**
  You will concede this is harmless polysemy rather than harmful drift if:
  **The abstract concept reliably predicts physical outcomes without modification.**
  If calling an AI structure a "scaffold" allows researchers to successfully predict *physical* degradation rates or *physical* load-bearing limits of the resulting DNA origami—without adding physical parameters—then the concept isn't a copycat; it's a unified theory. If the digital "scaffold" properties map functionally to physical outcomes, the slippage is justified by utility. If the map works, stop complaining about the territory.
