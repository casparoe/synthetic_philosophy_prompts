prompt: |-
  I just finished a long, unresolved argument with a friend about whether expected-value fanaticism genuinely collapses once agents can invoke procedural veto rights—blocking any gamble that exposes them to a non-compensable risk regardless of aggregate payoff—rather than merely capping utility. I want to stage that tension directly. For a graduate seminar in decision theory (12 students, one 90-minute session), design a structured in-class game or role-play that makes participants feel the pull of pure EV maximization and then forces them into the deadlock that arises when procedural veto rules are layered on top. Specify concrete roles (for example, delegates authorized to propose gambles, risk-bearers who may invoke veto, and arbitrators who must rule without knowing the exact probabilities), rules of interaction, and a token-based payoff scheme that uses no real money and requires no external materials. Arrange the rules and incentives so that the group experiences a coordination failure—some insisting on taking a tiny-probability astronomical-payoff bet, others blocking it on procedural grounds—before anyone names the underlying concept. Then provide a debrief that maps specific moments of deadlock onto the distinction between aggregate-utility reasoning and procedural legitimacy, predicts what will reliably go wrong the first time this is run and how to recover the session, and frankly identifies which formal feature of fanaticism—specifically the unbounded-utility assumption that drives the paradox—this activity necessarily cannot reproduce, so I can supply it in closing remarks. Keep the design focused; do not ask for bibliographies, citations, or reading lists.
