answer: |-
  # Seminar Activity: The Veto Protocol

  **Class Size:** 12 Students
  **Duration:** 90 Minutes
  **Materials:** Whiteboard (for token tallies), one smartphone (for random number generation).
  **Currency:** "Credits" (tally marks on the board).

  ## I. Role Assignment (5 Minutes)
  Divide the class into three distinct groups. Do not explain the theoretical underpinnings yet.

  1.  **The Trustees (3 Students):**
      *   **Mandate:** Maximize the *Total Seminar Endowment* (the sum of all Credits on the board).
      *   **Incentive:** If the Endowment exceeds 500 Credits by the end of the session, the Trustees receive a "Distinction" mark (symbolic). If it falls below 200, they receive a "Deficit" mark.
      *   **Power:** They propose gambles.

  2.  **The Citizens (8 Students):**
      *   **Mandate:** Protect your *Personal Account*.
      *   **Incentive:** Each Citizen starts with 50 Credits. If your Personal Account hits 0, you are "Insolvent" and must sit silently for the remainder of the game.
      *   **Power:** You hold **Procedural Veto Rights**.

  3.  **The Arbiter (1 Student):**
      *   **Mandate:** Uphold the Constitution.
      *   **Power:** You rule on whether a Veto is *Valid*. You do not decide based on outcomes, but on procedure.
      *   **Constraint:** You cannot see the exact probabilities of the gambles, only the *structure* of the risk (e.g., "High Loss/Low Gain" vs. "Low Loss/High Gain").

  ## II. The Economic Environment (5 Minutes)
  Draw a table on the whiteboard.
  *   **Column A:** Seminar Endowment (Starts at 100).
  *   **Column B:** Citizen Personal Accounts (Each starts at 50).

  **The Rule of Non-Compensation:**
  Credits in the *Seminar Endowment* cannot be transferred to *Personal Accounts*. They are separate ledgers. A Citizen cannot be bribed with Endowment Credits to accept personal risk.

  ## III. Phase 1: The EV Mandate (20 Minutes)
  **Rule:** Veto Rights are suspended. Trustees propose; Citizens vote by simple majority.

  1.  **The Gamble:** The Trustees propose "Project Omega."
      *   **Cost:** Each Citizen must contribute 10 Credits from their Personal Account to the Endowment.
      *   **Mechanism:** The Arbiter generates a random number 1–100 (using the phone).
      *   **Outcome:**
          *   **Roll 1–99 (99%):** The contributed 10 Credits are burned. Nothing else happens.
          *   **Roll 100 (1%):** The Endowment receives 5,000 Credits.
      *   **EV Calculation (Private Info for Trustees):**
          *   Cost per Citizen: -10.
          *   Expected Gain to Endowment: 0.01 × 5,000 = +50.
          *   Net EV per Citizen (in Endowment value): +40.
          *   *Total Group EV is massively positive.*

  2.  **Execution:** Run this twice.
      *   *Likely Outcome:* Citizens will grumble but vote yes, or Trustees will bully the majority. The Endowment grows (or doesn't), but the process is smooth.
      *   *Goal:* Establish that under pure aggregation, the bet is rational.

  ## IV. Phase 2: The Veto Clause (40 Minutes)
  **Rule Change:** Introduce **Unanimous Consent**. Any single Citizen may invoke a Veto. If Vetoed, the gamble is cancelled, and all keep their current Credits.

  1.  **The Trigger:** The Trustees *must* propose Project Omega again (or a variant with even starker odds: 0.1% chance of 50,000 Credits). Their mandate requires them to pursue positive EV regardless of variance.
  2.  **The Conflict:**
      *   **Trustees:** Argue that blocking the bet is irrational and harms the collective good. "You are sacrificing 50 expected Credits for 10 certain Credits."
      *   **Citizens:** Argue that a 99% chance of loss is unacceptable ruin, regardless of the Endowment's total. "I cannot afford to lose 10 Credits. The Endowment gain does not help me if I go Insolvent."
      *   **Arbiter:** A Citizen stands to Veto. The Trustees appeal to the Arbiter: "This Veto is irrational; it violates the mandate of efficiency." The Arbiter must rule: *Is the risk "non-compensable"?*
  3.  **The Deadlock:**
      *   Trustees will offer to "share the risk" (e.g., they put up their Distinction marks).
      *   Citizens will refuse: "The risk is the exposure, not the cost."
      *   The Arbiter will struggle to define "Valid Veto" without looking at outcomes.
      *   **Goal:** Reach a stalemate where the Trustees insist on the bet (EV Fanaticism) and at least one Citizen refuses to lift the Veto (Procedural Right), halting all progress. Do not resolve this. Let the tension sit for 5 minutes.

  ## V. Debrief & Theoretical Mapping (20 Minutes)

  ### 1. Mapping the Deadlock
  Ask the class to freeze. Name the positions they just enacted.
  *   **The Trustees represent Aggregate-Utility Reasoning (Consequentialism):** The morality of the action is determined solely by the sum total of expected value. If $P \times V > Cost$, the bet is mandatory. Variance is irrelevant.
  *   **The Citizens represent Procedural Legitimacy (Deontology/Rights):** Agents have a right not to be used as a means to an aggregate end. The *process* of imposing catastrophic risk without consent is illegitimate, even if the *outcome* is statistically favorable.
  *   **The Arbiter represents the Institutional Limit:** The difficulty of adjudicating rights without referencing outcomes.

  ### 2. Predicting Failure Modes
  *   **Failure Mode A: Premature Compromise.** Students may try to split the difference (e.g., "Let's do the bet but only cost 1 Credit").
      *   *Recovery:* Remind Trustees their mandate is *Maximize EV*, not "Find a Comfortable Middle." Remind Citizens their goal is *Avoid Insolvency*, not "Minimize Loss." Force them back to corners.
  *   **Failure Mode B: The Bully Trustees.** Trustees may intimidate Citizens into compliance.
      *   *Recovery:* Empower the Arbiter. Remind them that coercion invalidates the Procedural Veto. The Veto must be absolute.
  *   **Failure Mode C: The Arbiter Collapses.** The Arbiter may rule based on "fairness" rather than procedure.
      *   *Recovery:* Ask the Arbiter: "Did you rule based on the *right to block* or based on whether the bet was *good*?" If the latter, they violated the procedural constraint.

  ### 3. The Missing Formal Feature (Instructor Closing Remarks)
  You must explicitly identify what this game *failed* to simulate to ensure theoretical accuracy.

  *   **The Limitation:** In this game, the payoff (5,000 Credits) is **finite**.
  *   **The Theory:** True EV Fanaticism (e.g., Pascal's Mugging, St. Petersburg Paradox) relies on **Unbounded Utility**.
  *   **The Explanation:** "In our game, if we lowered the probability enough (e.g., 1 in 1 billion), the EV would eventually drop below the cost, and the Trustees would rationally stop proposing the bet. However, in formal decision theory, fanaticism persists even at infinitesimal probabilities *if* the utility function is unbounded. If the payoff is 'Infinite Good' (e.g., saving an infinite number of lives), the EV remains infinite regardless of how tiny the probability is. Our token system has a ceiling; true fanaticism does not. The deadlock you felt was psychological and institutional, but the mathematical driver of fanaticism is the absence of a utility ceiling."

  ### 4. Final Takeaway
  Conclude by asking: "If utility is unbounded, does any procedural veto hold? Or does the magnitude of the EV eventually morally compel us to override the veto?" Leave this as the unresolved question for the next session.
