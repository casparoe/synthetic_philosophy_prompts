answer: |-
  **Ratings**

  **(1) Ken: Clearly Mistaken.**
  He incorrectly applies the "but-for" test to an overdetermination case; standard counterfactual analysis handles this by holding the other factor fixed, under which condition Rosa's inaction *is* a necessary condition for the burst. Denying causation here requires abandoning most workable models of causal reasoning, not just saving intuition.

  **(2) Rosa: Mostly Right.**
  She correctly identifies that logical symmetry in overdetermination doesn't preclude individual causal status if we treat omissions as variables in a counterfactual model. However, she moves too quickly past the metaphysical worry that "nothing" (an omission) lacks the ontological weight of "something" (an arsonist's match).

  **(3) Ken: Plausible but Deflationary.**
  He accurately spots that our *intuition* of asymmetry relies entirely on normative expectations (the rotation), but he errs in concluding we must eliminate omission-causation entirely rather than accepting it as distinct from responsibility. This is a valid philosophical position (causal deflationism), but it sacrifices explanatory power for metaphysical purity.

  **(4) Rosa: Clearly Right.**
  This is the standard and most robust distinction in philosophy of causation: metaphysical causation is binary and symmetric here, while causal *selection* is pragmatic and normative. She correctly diagnoses Ken's inconsistency in switching from a metaphysical argument (Move 1) to a normative one (Move 3) to save his conclusion.

  **(5) Ken: Theoretically Consistent but Too Narrow.**
  He is correct that process theories (which require physical transfer) cannot accommodate omissions, but this demonstrates a limitation of process theories rather than proving omissions aren't causes. Modern interventionist accounts show that "process tracing" is not required for causal validity, only stable counterfactual dependency.

  ***

  **What They Are Missing**

  Both friends are stuck in a dichotomy between **Counterfactual Dependence** (Rosa) and **Physical Process** (Ken). They are missing the **Interventionist Framework** (associated with James Woodward), which defines causation by whether manipulating one variable changes the outcome while holding the system stable. This framework validates Rosa's claim that both omissions are causes (both are manipulable variables) without requiring Ken's "physical process," while also explaining why we focus on Rosa: causal *explanation* prioritizes variables that are sensitive to normative or systemic expectations, even if the underlying *causation* is symmetric. They are also missing the distinction between **token causation** (this specific burst) and **type causation** (how cabin heating generally works); Ken's duty matters for the type-level prediction, while Rosa's sleep matters for the token-level event.

  ***

  **The Intervention Question**

  If you ask which omission you could intervene on *by itself* to prevent the burst, **nothing changes regarding the causal status:** both are interventionist causes. If you externally force Rosa up (holding Ken asleep), the pipes survive; if you force Ken up (holding Rosa asleep), the pipes survive. The causal structure is symmetric.

  However, this reveals that the **"real" question depends on your goal**. If you are asking a scientific question about *how the burst happened*, the intervention question is primary: both failures caused it, and Ken is wrong to deny his causal link. If you are asking a moral or legal question about *who is accountable*, the duty question is primary: Rosa is the relevant cause because her variable is the one the system was designed to manipulate. Ken tries to use the accountability question to answer the scientific one (Move 3), while Rosa uses the scientific answer to solve the accountability one (Move 2). The correct view is Rosa's Move 4: causation is symmetric (verified by intervention), but attribution is asymmetric (determined by duty).
