answer: |-
  # Specification: A Theory of Conventional Obligation

  **Context:** This spec defines the criteria for distinguishing *moral obligations* (things you must do) from *prudential advice* (things you should do to avoid hassle) and *etiquette* (things you should do to be polite) within the context of local conventions.

  **Goal:** To provide a decision procedure for the long-stay visitor that is robust against edge cases, morally defensible, and practically actionable.

  ## Part I: The Desiderata List

  A viable theory of conventional obligation must satisfy the following six requirements. Each includes the motivating case, the functional requirement, and its status within the theoretical landscape.

  ### 1. The Epistemic Access Condition
  *   **The Case:** *The Phantom Queue vs. The Newcomer.* At a rural bus stop, regulars wait in a café and board by arrival order. A newcomer sees an empty stop and boards immediately. Conversely, an expat of nine years claims ignorance of a well-known local norm.
  *   **The Requirement:** An obligation cannot exist unless the agent could reasonably have acquired knowledge of the convention. Obligation scales with tenure and visibility.
  *   **Status:** **Non-negotiable.** *Ought implies can.* You cannot be morally bound by a rule you had no mechanism to know. However, the "reasonable effort to know" threshold rises the longer you stay.

  ### 2. The Reliance and Expectation Condition
  *   **The Case:** *Invisible Compliance vs. 4am Jaywalking.* You stand on the right of an escalator in an empty station (invisible compliance). You cross a deserted street at 4am (jaywalking). In both cases, no one is watching, and no one's expectations are frustrated.
  *   **The Requirement:** For a convention to generate a *moral* obligation (rather than a rule of thumb), there must be a plausible claim that others are relying on your compliance to coordinate their own actions or maintain a shared expectation.
  *   **Status:** **Non-negotiable.** Without reliance, the obligation collapses into superstition or rule-worship. If no one is affected, there is no moral patient to wrong.

  ### 3. The Fair Play (Reciprocity) Condition
  *   **The Case:** *The Half-Dead Convention.* Roughly 50% of locals still queue properly; the other 50% push. Or: *The Tip Screen.* Staff are paid a wage, but the tablet asks for a tip.
  *   **The Requirement:** The obligation binds only if the convention functions as a cooperative scheme from which the agent benefits, and where compliance is roughly reciprocal. If the scheme is collapsing (50% compliance) or the benefit is non-existent (staff already paid), the obligation weakens.
  *   **Status:** **Hobbyhorse of Contractualists.** Utilitarians might argue you should still follow it to nudge the norm back to equilibrium. Contractualists argue you owe nothing to free-riders. A practical guidebook must take a stance here; this spec demands a threshold of *sufficient uptake*.

  ### 4. The Justice and Extraction Constraint
  *   **The Case:** *The Extractive Fee.* A "processing fee" moves your permit up the pile (a bribe), or tips are structurally required because the employer pays below subsistence wage.
  *   **The Requirement:** A convention that relies on injustice, coercion, or the exploitation of the worst-off to function cannot generate a positive moral obligation to comply, even if compliance helps a specific individual in the moment.
  *   **Status:** **Non-negotiable.** Moral obligations cannot be generated by immoral systems. This distinguishes *moral obligation* from *prudential necessity* (i.e., "pay the bribe or starve" is prudence, not duty).

  ### 5. The Enforcement Distinction
  *   **The Case:** *The Dirty Look.* You don't tip on the tablet. The cashier sighs.
  *   **The Requirement:** The theory must distinguish between *being bound to do X* and *others being permitted to sanction you for not doing X.* One can have an obligation without others having the right to enforce it (and vice versa).
  *   **Status:** **Non-negotiable.** Conflating these leads to vigilante morality. The guidebook must clarify when a violation is a private moral failure vs. a public transgression.

  ### 6. The Valuation Distinction
  *   **The Case:** *The Bad Convention.* Locals stand on the right of the escalator, which causes mechanical wear and is less efficient than standing on both sides (as in London).
  *   **The Requirement:** The theory must distinguish between *the convention is binding* and *the convention is good.* A convention can be morally binding (because it coordinates) even if it is suboptimal, provided it meets the Justice Constraint.
  *   **Status:** **Non-negotiable.** Visitors need to know when to assimilate (binding/suboptimal) vs. when to advocate for change (non-binding/harmful).

  ***

  ## Part II: The Conflict Analysis

  You asked which pair of requirements cannot both be met. Your guess was that **"The obligation has to hold even when nobody is affected"** (4am Jaywalk) and **"The obligation has to lapse when the convention is extractive"** (Extractive Fee) pull in opposite directions.

  You are correct, but the tension is more specific. The conflict is between **The Reliance Condition (Desideratum 2)** and **The Justice Constraint (Desideratum 4)** when mediated by **Consequential Consistency**.

  Here is the trilemma:
  1.  **To satisfy the Justice Constraint:** You must look at the *consequences* and *structure* of the convention (e.g., "This tip system exploits workers"). If the outcome is bad, the obligation lapses.
  2.  **To satisfy the 4am Jaywalk Intuition (that obligation *might* hold):** You must argue that the obligation is *deontological* or *rule-based*, independent of immediate consequences (e.g., "I follow the law because it is the law, even if no cars are coming").
  3.  **The Conflict:** You cannot consistently use *consequences* to void the obligation in the Extractive Case while ignoring *consequences* to sustain the obligation in the 4am Jaywalk Case.
      *   If you say "Consequences don't matter, follow the rule" (to save the 4am Jaywalk duty), you are forced to pay the Extractive Fee (because the rule exists).
      *   If you say "Consequences matter, void the bad rule" (to void the Extractive Fee), you are forced to void the 4am Jaywalk duty (because the consequence is null).

  **The Real Conflict:** It is between **The Atomic Duty** (My specific act is judged in isolation: "Did I break the rule?") and **The Systemic Condition** (My act is judged by the system's health: "Does this rule serve justice?").
  *   A theory that prioritizes **Atomic Duty** handles the 4am Jaywalk (rule is rule) but fails the Extractive Fee (rule is rule).
  *   A theory that prioritizes **Systemic Condition** handles the Extractive Fee (unjust system) but fails the 4am Jaywalk (no systemic impact).

  **Resolution for the Guidebook:** You must sacrifice the **Atomic Duty**. For a visitor, the **Systemic Condition** is the only safe heuristic. If the convention has no social uptake (4am) or is unjust (Extractive), the obligation lapses. The "obligation holds even when nobody is affected" is a philosophical luxury a traveler cannot afford; it risks turning them into a fetishist of rules rather than a participant in a society.

  ***

  ## Part III: The Exclusionary Requirement

  Which single requirement does the most work in ruling candidate theories out?

  **The Justice and Extraction Constraint (Desideratum 4).**

  This is the hardest filter. Most standard theories of convention are descriptive or coordinative, not moral.
  *   **David Lewis (Convention as Equilibrium):** Fails immediately. Lewis defines conventions as solutions to coordination problems. An Extractive Fee *is* a coordination equilibrium (everyone pays, everyone gets their permit). Lewis's theory cannot distinguish a bribe from a tax without importing external moral premises.
  *   **Hume (Custom and Expectation):** Fails. If everyone expects the bribe, and you disappoint that expectation, Humean custom suggests you are in the wrong. It lacks the normative teeth to say "This expectation is illegitimate."
  *   **Rule Utilitarianism:** Struggles. It might argue that paying the bribe maintains stability. It requires a very specific "Ideal Rule" formulation to reject the extractive convention.

  Only theories grounded in **Fairness (Rawls/Hart)** or **Rights** can pass this filter, because they allow you to say, "Even if this coordinates behavior, it violates the terms of fair cooperation."

  ***

  ## Part IV: Scorecard of Standard Stories

  | Theory | Handles Phantom Queue? | Handles 4am Jaywalk? | Handles Extractive Fee? | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Lewisian Coordination** | **Yes.** (It solves the info asymmetry). | **No.** (No coordination problem exists). | **No.** (Treats bribe as valid equilibrium). | **Reject.** Too descriptive. |
  | **Humean Expectation** | **No.** (Newcomer creates no expectation). | **No.** (No one expects you at 4am). | **No.** (Expectations exist to pay bribes). | **Reject.** Too conservative. |
  | **Rawlsian Fair Play** | **Yes.** (If scheme is just and known). | **Yes/No.** (Depends on if you benefit from the *habit*). | **Yes.** (Unjust schemes bind no one). | **Accept.** Best fit for spec. |

  **Recommendation:** Build the guidebook chapter on a **Fair Play** model, tempered by the **Epistemic Access Condition**. Tell visitors: *"You are bound by the rules of the club you have joined, provided the club is not robbing its members, and provided you were shown the rulebook."*
