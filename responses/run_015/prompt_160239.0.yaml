answer: |-
  **Speech for the Dedication of the [Supervisor's Name] Intake Wing**

  Thank you. To the Mayor, to the City Council, to the staff and volunteers who do the daily work of this shelter, and to the family of Professor [Name]: thank you for having me.

  We are here to dedicate a facility designed for intake. It is a place of transition, of assessment, and often, of difficult decisions. It is fitting that this wing bears the name of a woman who taught us that ethics is not about comfort, but about rigor.

  Those of us from the university know that Professor [Name] did not hold the view that animates much of the modern animal welfare movement. She did not believe that animals are rights-bearers. She did not believe that we owe duties *to* them. In her reading of Kant, animals are not ends in themselves. If a dog suffers, the dog is not wronged, because the dog is not a moral agent.

  It would be dishonest to pretend otherwise today. She would not have wanted us to soften her philosophy to make it palatable for a dedication ceremony.

  However, she also taught that cruelty to animals is genuinely wrong. It is wrong because it damages *us*. To act cruelly toward a sentient creature is to blunt our own capacity for humane feeling. It is to corrode the very faculty that allows us to recognize duty toward human beings. On her view, the prohibition against cruelty is not a mercy extended to the animal; it is a hygiene maintained for the human soul.

  Late in her career, she refined this. She argued that it is not enough for an individual to feel sympathetic in the moment. Morality is not a sentiment; it is a structure. She called this the "institutional reading." She argued that we have a duty to design practices that do not require human beings to routinely act in ways that harden their hearts. A system that demands a worker kill healthy animals daily, or witness prolonged suffering without recourse, is not just hard on the animals. It is morally corrosive to the workers and the society that delegates the task to them.

  This is why this building exists. And this is why her bequest made it possible.

  This wing is not a monument to the value of animal life. Professor [Name] did not believe animals had that kind of value. This wing is a monument to the value of *human character*. It is an infrastructure project for our moral integrity. By creating a professional, regulated, and humane intake process, we ensure that the necessary management of animals in a city does not devolve into brutality that stains the character of the staff or the public.

  To the staff and volunteers: You know better than anyone that this work is hard. You absorb the consequences of human irresponsibility. On Professor [Name]'s terms, your labor is not about saving the animals. It is about saving *us* from becoming the kind of people who ignore suffering. You are the custodians of the city's moral hygiene. This wing is designed to make your work less corrosive to your own humanity.

  There is a difficulty, of course. Professor [Name] is dead. On her own terms, a dead person cannot cultivate virtue. She cannot discharge a duty of self-perfection. So what is this money? It is not her duty. It is her command to the living. She has used her resources to construct a environment where *we* are more capable of being moral agents. She has built a guardrail for our character.

  To her family: Thank you for honoring her specific, uncompromising vision. To the City: Thank you for accepting the gift without demanding it come with a philosophy it does not carry.

  This wing stands as a testament to a hard truth: We do not protect animals because they are like us. We protect them from our cruelty because we must remain human. Let this building ensure that we do.

  Thank you.

  ***

  **Analysis of the Bequest and Meaning**

  I have taken the line that the bequest cannot be interpreted as *her* discharging a duty of self-cultivation, since she is deceased and thus no longer a moral agent capable of virtue. Instead, I have framed the bequest as a "testamentary command" or an investment in the *conditions* of moral agency for the living. On her terms, the wing's existence does not show that animals are beneficiaries; it shows that the *human community* is the beneficiary. The shelter is framed not as a refuge for beasts, but as a containment zone for practices that would otherwise degrade human moral character. The gift is an obligation imposed on the survivors to maintain a specific institutional standard that protects *our* capacity for sympathy, rather than a charity extended to the animals.

  **Flags on Contested Readings and Consistency**

  1.  **The "Institutional Reading" and Kant:** The "institutional reading" described (that we must design systems to protect character rather than just monitor individual sentiment) is a modern reconstruction often attributed to Korsgaard or Wood, but it is contested whether Kant himself held that institutions have duties. Kant focuses on the maxim of the individual agent. Attributing a systemic/institutional duty to her is a charitable reconstruction that stretches standard Kantian individualism.
  2.  **The Bequest Consistency:** As noted in the speech, there is a strict inconsistency in a Kantian agent making a bequest to "discharge a duty" after death. Duties end when agency ends. I have glossed this in the speech as a "command to the living," but strictly speaking, on her own view, the money becomes morally neutral the moment she dies; its moral weight is entirely conferred by how *we* choose to use it, not by her intent.
  3.  **Painless Killing:** I avoided mentioning painless killing for food in the speech, as it would be inflammatory and irrelevant to a shelter context. However, her view permits it. If the shelter painlessly euthanizes healthy animals, her view permits this provided it doesn't damage the *worker's* character. This creates a tension: if the intake wing leads to euthanasia, is it protecting character or damaging it? I sidestepped this by focusing on "cruelty" and "suffering" rather than killing itself.
