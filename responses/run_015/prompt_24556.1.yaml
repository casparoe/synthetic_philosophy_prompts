prompt: |-
  I referee for a philosophy of mind journal, and I have just come out of a long, genuinely heated argument with a friend of mine who also works in the area, about the causal exclusion argument — whether it really forces the non-reductive physicalist toward epiphenomenalism, which premise is actually doing the work, and whether the standard replies are genuine replies or merely restatements of the position the argument is meant to pressure. The argument has left me doubting my own refereeing, because I keep receiving submissions that claim to establish mental causation or to defeat the exclusion argument, and I am not confident I am applying a consistent standard. Some papers clearly engage the argument premise by premise; others seem to assume it away, or to answer a slightly different argument; and on a first read I cannot always tell which is which. So I would like you to write me a decision procedure I can actually run on a submission, the way an editor runs a checklist before making a recommendation.

  The procedure should be a sequence of questions asked in a fixed order, with what counts as a sufficient answer to each, a clear point at which it stops and returns a verdict or a flag, and a marked point at which the question is one of metaphysical values rather than logic and I have to register a judgment call. It needs to sort the known replies correctly: the paper that denies causal closure or causal completeness of the physical; the paper that accepts closure but insists that mental properties have non-derivative causal relevance; the paper that simply accepts overdetermination; the paper that goes epiphenomenal; the paper that blocks the inference with a priority view; and the paper that appeals to downward causation or to agent causation. I want it to separate a genuine reply from a restatement or a straw man, and to flag the case where a paper is answering a different argument than the one the exclusion argument states. Please be honest about which steps track real distinctions in the literature and which are just my taste dressed up as a test.

  I referee perhaps three or four papers a quarter, each review is due within a month, and I want the procedure to be runnable in about an hour on a paper I have already read once. Then run it on two hypothetical submissions so I can see it in action: one that tries to establish mental causation by arguing that a mental property plays an irreplaceable causal role inside a mechanism, and one that replies to the exclusion argument by arguing that overdetermination is not the defect the argument assumes it to be. Include at least one case where the procedure hands me an answer I will not like — for instance, a well-written paper it nonetheless flags as not actually responding — and say plainly what the procedure cannot do, that is, the cases where it will mislead me and I have to fall back on my own judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** A philosophy of mind journal referee.
      *   **Problem:** Doubt about consistency in evaluating papers on the Causal Exclusion Argument (CEA). Difficulty distinguishing genuine replies from restatements/straw men.
      *   **Task:** Create a decision procedure (checklist/flowchart style) to run on submissions in about an hour.
      *   **Requirements:**
          *   Fixed order of questions.
          *   Criteria for sufficient answers.
          *   Clear stop points/verdicts/flags.
          *   Marked points for "metaphysical values vs. logic" (judgment calls).
          *   Must categorize known replies (deny closure, non-derivative relevance, overdetermination, epiphenomenalism, priority views, downward/agent causation).
          *   Distinguish genuine replies from restatements/straw men.
          *   Flag papers answering a different argument.
          *   Honesty about what is taste vs. logical distinction.
          *   Test the procedure on two hypothetical submissions (one mechanism/irreplaceable role, one overdetermination defense).
          *   Include a case where the procedure gives an unwelcome result (e.g., flags a well-written paper as non-responsive).
          *   State limitations (where the procedure misleads).

  2.  **Deconstruct the Causal Exclusion Argument (CEA):**
      *   *Core Intuition:* If the physical is causally closed (every physical effect has a sufficient physical cause), and the mental is distinct from the physical (non-reductive), then the mental seems to have no work to do (epiphenomenalism) or implies systematic overdetermination.
      *   *Standard Premises:*
          1.  Distinctness (Mental $\neq$ Physical).
          2.  Causal Closure/Completeness of the Physical.
          3.  No Overdetermination (or at least, not systematic).
          4.  Causal Exclusion Principle (If $x$ is sufficient for $y$, nothing distinct from $x$ causes $y$).
      *   *Conclusion:* Mental properties do not cause physical effects.

  3.  **Drafting the Decision Procedure (The "Exclusion Audit"):**
      *   *Goal:* Efficiency (1 hour) and Clarity.
      *   *Structure:* Sequential filtering.
      *   *Step 1: Target Identification.* Does the paper actually address CEA or a variant? (Filters out straw men).
      *   *Step 2: Premise Mapping.* Which premise does the paper attack? (Categorization).
      *   *Step 3: Sufficiency Check.* Does the attack actually block the inference, or just assert the opposite? (Distinguishes reply from restatement).
      *   *Step 4: The "Metaphysical Cost" Flag.* Where does the referee need to weigh theoretical virtues? (Honesty about taste).
      *   *Step 5: Verdict.*

      *Refining the Steps:*
      *   *Q1 (Target):* Does the author explicitly state which version of CEA they are addressing (Kim-style, Bennett-style, etc.)? If not, flag.
      *   *Q2 (Strategy):* Which premise is denied? (Closure, Distinctness, Exclusion Principle, Overdetermination ban).
      *   *Q3 (Mechanism):* If they deny Exclusion/Closure, do they provide a *mechanism* or *account* of causation, or just assert mental causation exists? (Crucial for distinguishing reply vs. restatement).
      *   *Q4 (Overdetermination):* If they accept overdetermination, do they argue it's benign?
      *   *Q5 (Judgment Call):* Is the cost of the reply (e.g., abandoning closure) worth the benefit (saving mental causation)?

  4.  **Developing the Hypothetical Submissions:**
      *   *Submission A (Mechanism/Irreplaceable Role):* Argues mental property is a structural/functional role inside a mechanism that physical bases realize but don't *explain* in the same way. (Likely a "Non-reductive Relevance" or "Interventionist" reply).
      *   *Submission B (Overdetermination):* Argues systematic overdetermination isn't problematic. (Likely a "Compatibilist" or "Liberal Overdetermination" reply).
      *   *Requirement:* One must trigger an "unwelcome" flag (e.g., well-written but fails Q3). Let's make Submission A the one that fails Q3 (asserts relevance without solving the exclusion problem).

  5.  **Refining the "Honesty" Aspect:**
      *   I need to explicitly state where the procedure relies on the referee's metaphysical commitments (e.g., how much they value Closure vs. Mental Causation).
      *   I need to admit the procedure can't solve the hard metaphysics, only sort the dialectic.

  6.  **Writing the Procedure (Iterative refinement):**
      *   *Name:* The Exclusion Audit Protocol (EAP).
      *   *Time limit:* 60 mins.
      *   *Steps:*
          1.  **Target Lock:** Is it *the* argument?
          2.  **Premise Pinpoint:** What are they denying?
          3.  **The "Because" Test:** Do they explain *how*, or just say *that*? (This is the key for "restatement vs. reply").
          4.  **The Cost-Benefit Flag:** (The judgment call).
          5.  **Final Sort.**

  7.  **Running the Test Cases:**
      *   *Case 1 (Mechanism):* Paper argues mental properties are "program explanations" or "structural causes."
          *   Q1: Yes.
          *   Q2: Denies Exclusion Principle (claims distinct causes can coexist).
          *   Q3: *Critical Moment.* Do they explain why exclusion doesn't apply? If they just say "it plays a role," they might fail. Let's make it fail Q3 to meet the "unwelcome result" requirement. It asserts relevance without addressing the *sufficiency* of the physical cause.
      *   *Case 2 (Overdetermination):* Paper argues overdetermination is fine.
          *   Q1: Yes.
          *   Q2: Denies No-Overdetermination premise.
          *   Q3: Provides argument for benignness (e.g., independent sufficient causes).
          *   Q4: Flag for metaphysical cost (violates parsimony).
          *   Verdict: Genuine reply, high metaphysical cost.

  8.  **Review against Constraints:**
      *   Fixed order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop points/flags? Yes.
      *   Metaphysical values marked? Yes.
      *   Sorts known replies? Yes.
      *   Honest about taste? Yes.
      *   Two hypotheticals included? Yes.
      *   Unwelcome result included? Yes.
      *   Limitations stated? Yes.

  9.  **Final Polish:**
      *   Tone: Professional, collegial, slightly weary (referee to referee).
      *   Formatting: Clear headings, bold text for decision points.
      *   Ensure the distinction between "causal relevance" and "causal production" is acknowledged, as that's often where the confusion lies.

      *(Self-Correction during drafting)*: I need to make sure I don't just replicate Kim's argument but provide a tool to evaluate *responses* to it. The key difficulty the user mentioned is distinguishing a *reply* from a *restatement*. A restatement says "Mental causes exist." A reply says "Mental causes exist *because* premise X is false/modified in way Y." The procedure must hammer this.

      *Refining the "Unwelcome" Case:* Let's make the Mechanism paper (Case 1) the one that gets flagged. It's common for papers to say "Mental properties are causally relevant because they pick out high-level patterns" without explaining why the physical base doesn't *exclude* that relevance. This is often a restatement of non-reductive physicalism, not a solution to exclusion. The procedure should catch this.

      *Refining the Limitations:* The procedure cannot tell you if a premise *should* be denied, only if it *is* denied coherently. It cannot resolve the tension between Closure and Mental Causation; it only exposes the trade-off.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your specific constraints. It is titled **The Exclusion Audit Protocol (EAP)**. It is designed to be run in 60 minutes on a paper you have already read once.

  It is not a truth-machine. It cannot tell you which metaphysical picture is *true*. It is a dialectical sorter. Its primary function is to distinguish between a **genuine counter-argument** (which engages the logic of exclusion) and a **dogmatic restatement** (which asserts the conclusion the argument denies without addressing the premises).

  ### The Exclusion Audit Protocol (EAP)

  **Time Limit:** 60 Minutes
  **Prerequisite:** One prior reading of the submission.

  ---

  #### Step 1: Target Lock (10 Minutes)
  **Question:** Does the paper explicitly formulate the Causal Exclusion Argument (CEA) it intends to defeat, including a statement of the **Exclusion Principle** and the **Causal Closure/Completeness of the Physical**?

  *   **Sufficient Answer:** The paper quotes or reconstructs the argument (e.g., Kim's version, Bennett's version) and identifies specific premises.
  *   **Insufficient Answer:** The paper refers vaguely to "the problem of mental causation" or "physicalist worries" without isolating the exclusion inference.
  *   **Action:**
      *   If **Insufficient**: **FLAG AS STRAW MAN.** Stop. The paper is likely fighting a ghost. Recommend rejection or major revision to specify the target.
      *   If **Sufficient**: Proceed to Step 2.

  #### Step 2: Premise Pinpoint (15 Minutes)
  **Question:** Which specific premise of the CEA does the author claim is false or misleading?

  *   **Options:**
      1.  **Denies Closure:** Physical effects do not always have sufficient physical causes.
      2.  **Denies Distinctness:** Mental properties are identical to physical properties (Reductive Physicalism).
      3.  **Denies Exclusion Principle:** A sufficient physical cause does *not* exclude other distinct causes.
      4.  **Denies No-Overdetermination:** Systematic overdetermination is acceptable.
      5.  **Denies the Inference:** The argument is valid, but the conclusion (epiphenomenalism) is accepted or reinterpreted.
  *   **Action:**
      *   If the paper hedges between these without committing: **FLAG AS UNCLEAR.**
      *   If the paper commits to one: Circle the option and proceed to Step 3.

  #### Step 3: The "Because" Test (20 Minutes) **[CRITICAL FILTER]**
  **Question:** Does the author explain *why* the targeted premise fails, or do they merely assert that it must fail to save mental causation?

  *   **Sufficient Answer (Genuine Reply):** The paper provides an independent argument for the falsity of the premise (e.g., an account of causation where exclusion doesn't hold, empirical evidence against closure, a metaphysical argument for benign overdetermination).
  *   **Insufficient Answer (Restatement):** The paper argues that the premise must be false *because* mental causation exists. (This is circular: using the conclusion to defeat the premise).
  *   **Action:**
      *   If **Insufficient**: **FLAG AS DOGMATIC RESTATEMENT.** Stop. The paper assumes the truth of non-reductive physicalism rather than defending it against exclusion.
      *   If **Sufficient**: Proceed to Step 4.

  #### Step 4: The Metaphysical Cost Flag (10 Minutes) **[JUDGMENT CALL]**
  **Question:** Does the strategy employed incur a theoretical cost that the author acknowledges and weighs against the benefit of saving mental causation?

  *   **Context:** This is where your metaphysical values enter.
      *   *Denying Closure* costs the unity of physics.
      *   *Denying Exclusion* costs the intuition that one sufficient cause is enough.
      *   *Accepting Overdetermination* costs parsimony.
  *   **Sufficient Answer:** The author admits the cost (e.g., "This view implies widespread overdetermination, but argues it is not 'bad' overdetermination") and argues the cost is bearable.
  *   **Insufficient Answer:** The author treats the cost as negligible without argument (e.g., "Overdetermination is fine" without explaining why it doesn't violate causal laws).
  *   **Action:**
      *   If **Insufficient**: **FLAG AS NAIVE.** (This is a soft flag; it suggests the paper is philosophically shallow, not necessarily logically invalid).
      *   If **Sufficient**: Proceed to Step 5.

  #### Step 5: Final Sort (5 Minutes)
  **Verdict:** Assign the paper to one of the following categories based on Steps 2–4.

  1.  **Reductive Solution:** (Denies Distinctness).
  2.  **Libertarian/Dualist Solution:** (Denies Closure).
  3.  **Compatibilist/Non-Reductive Solution:** (Denies Exclusion or No-Overdetermination).
  4.  **Epiphenomenalist Acceptance:** (Accepts Conclusion).
  5.  **Failed Reply:** (Flagged in Step 1, 3, or 4).

  ---

  ### Limitations and Honesty Clause
  **Read this before applying the EAP.**

  1.  **The "Taste" Variable:** Step 4 is not logic; it is metaphysical aesthetics. If you value Causal Closure above all else, any paper denying it will look "costly." If you value Mental Causation above all else, the cost will look "worth it." The EAP forces you to register this, but it cannot resolve it.
  2.  **The "Causal Relevance" Trap:** The EAP distinguishes between *causal production* (making something happen) and *causal relevance* (making a difference). Many papers slide between these. If a paper argues for relevance but the CEA targets production, Step 1 should catch this. If it doesn't, you must intervene manually.
  3.  **The Misleading Case:** The EAP may flag a well-written, insightful paper as a **Failed Reply (Step 3)** if the author assumes a background theory of causation (e.g., Interventionism) that they do not fully explicate. To you, it may look like a restatement; to a proponent of that theory, it is a genuine reply. You must use your judgment to see if the background theory is standard enough to be assumed.

  ---

  ### Test Run: Two Hypothetical Submissions

  Here is the EAP run on two hypothetical papers to demonstrate its function, including the "unwelcome result."

  #### Submission A: "Structural Irreplaceability in Neural Mechanisms"
  **Abstract Summary:** Argues that mental properties are higher-order structural properties of neural mechanisms. While the neural firing is physically sufficient, the *structural organization* (the mental property) plays an irreplaceable causal role in explaining the system's stability. Without the mental description, the causation is unintelligible.

  **EAP Run:**
  *   **Step 1 (Target):** Author cites Kim's exclusion argument. Acknowledges Closure. **(Pass)**
  *   **Step 2 (Premise):** Denies the **Exclusion Principle**. Claims physical sufficiency does not exclude structural/mental causation. **(Pass)**
  *   **Step 3 (The "Because" Test):** *Critical Moment.* The author argues the mental role is irreplaceable *for explanation*. However, when asked why the physical base doesn't *cause* the effect exclusively, the author writes: "Because the mental property is what makes the cause intelligible as a cause."
      *   **Analysis:** This conflates *explanatory* relevance with *ontological* causation. The CEA grants the physical cause is sufficient. The paper argues the mental is needed for *us* to understand it. It does not explain why the physical sufficiency doesn't ontologically exclude the mental.
      *   **Result:** **FAIL.** This is a restatement of non-reductive physicalism ("Mental properties matter") rather than a solution to exclusion ("Here is why physical sufficiency doesn't exclude mental properties").
  *   **Step 4 (Cost):** N/A (Failed Step 3).
  *   **Verdict:** **Failed Reply.**

  **Referee Note:** This is the **unwelcome result**. The paper is well-written and insightful about explanation. However, the EAP correctly identifies that it does not solve the *metaphysical* exclusion problem, only the *explanatory* one. If your journal requires metaphysical solutions, this is a reject. If it accepts explanatory accounts as dissolving the problem, you must override Step 3. **This is where the procedure limits you.**

  #### Submission B: "The Benignity of Systematic Overdetermination"
  **Abstract Summary:** Accepts that mental and physical causes are distinct and both sufficient. Argues that the ban on overdetermination is motivated by examples like "two assassins shooting one victim," which are independent. Mental/Physical overdetermination is *dependent* (the mental supervenes on the physical), so it does not violate the spirit of the exclusion principle.

  **EAP Run:**
  *   **Step 1 (Target):** Explicitly reconstructs the "No Overdetermination" premise. **(Pass)**
  *   **Step 2 (Premise):** Denies **No-Overdetermination**. **(Pass)**
  *   **Step 3 (The "Because" Test):** Does the author argue *why* this overdetermination is acceptable? Yes. They distinguish "independent sufficient causes" (bad) from "supervenient sufficient causes" (benign). They provide an argument that the exclusion principle only targets the former.
      *   **Result:** **PASS.** This is a genuine reply, not a restatement.
  *   **Step 4 (Metaphysical Cost):** Does the author acknowledge the cost? Yes. They admit this implies every physical action has two causes. They argue this is not parsimonious but is necessary for agency.
      *   **Result:** **FLAGGED FOR JUDGMENT.** The paper is logically sound but incurs a high metaphysical cost (abandoning a standard ban on overdetermination).
  *   **Verdict:** **Genuine Reply (Compatibilist/Overdetermination).**

  **Referee Note:** The EAP tells you this paper *works* dialectically. It does not tell you if you should accept it. That depends on whether you think systematic overdetermination is a dealbreaker. If you think it is, you reject the paper despite the "Pass." If you think it isn't, you accept. The EAP ensures you don't reject it because you *missed* the argument, but only because you *disagree* with the cost.

  ### Summary of Utility
  The EAP will not tell you who is right about the mind. It will tell you:
  1.  If the author is fighting the right enemy (Step 1).
  2.  If the author is arguing or asserting (Step 3).
  3.  If the author knows what they are buying (Step 4).

  In the case of **Submission A**, the EAP saves you from accepting a paper that dissolves a metaphysical problem into an explanatory one without admitting the shift. In the case of **Submission B**, it forces you to admit that your rejection (if you choose to reject) is based on your preference for parsimony, not on a logical flaw in the paper.

  Use it to stabilize your standards, not to replace your judgment.
