      *   *East India Company:* Mill defended the EIC not just for expertise, but because he saw it as a benevolent despotism that could implement reforms without populist pressure. He wrote *Considerations on Representative Government* which outlines this.
      *   *1858 Government of India Act:* This Act dissolved the EIC and transferred power to the Crown. Mill *opposed* this. He wrote pamphlets against it. He feared Crown rule would be more corrupt, less expert, and more susceptible to British public opinion/religious zealotry than the Company bureaucracy. He retired shortly after this.
