          *   Reference **Phenomenology.** The experience of being there was real. The disruption of that experience is a real psychological harm.
          *   *Distinction:* It's not harm to a "fictional character" (passive) but harm to a "shared habitat" (active).

      *   **Part 3: Evaluating the Analogies (Currency vs. Fiction):**
          *   *Currency (Institutional Fact):* As established, this works well. It explains the *value* and the *rule-based existence*.
          *   *Fictional Entities (Novel Characters):* This is the weaker analogy. Why? Because readers don't *co-author* the book in real-time. The museum is *collaborative*.
          *   *Better Analogy:* **Public Infrastructure or Community Gardens.** If someone burns a community garden, the plants are physical, but the *community value* is the loss. In the virtual museum, the "plants" are code, but the "garden" is the social agreement.
          *   *Refinement:* Actually, keep the Fiction analogy but nuance it. It's about *narrative investment*, but the Currency analogy is better for *ownership/rights*.

