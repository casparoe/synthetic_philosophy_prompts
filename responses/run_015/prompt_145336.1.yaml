answer: |-
  **Joint Statement on the Ethics of Comparative Atrocity**

  **Preamble**
  We, the undersigned representatives of the 'Justice Through Hierarchy' camp and the 'Sanctity of Memory' camp, have spent the last week arguing. Properly arguing. We started off shouting about whether putting a number on suffering is neccessary for prevention or just cold arithmetic. We haven't solved it. But we have realised we're actually looking at the same map, just reading the legend differently. This statement isn't a compromise; it's a record of where our feet stand on the same ground, and where the ground splits beneath us.

  **1. What We Agree Comparison Involves**
  Before we fight about *why* we compare, we agree on *what* is being weighed. It's not just body counts. That's too simple. We both accept that any serious comparision of historical evils must account for three variables:
  *   **Intent:** Was the destruction the goal, or a byproduct of policy?
  *   **Structure:** Did the state machinery facilitate the death, or did it fail to prevent it?
  *   **Aftermath:** How did the surviving world categorise the event? Did it change laws, or just borders?

  We agree that silence is dangerous. Ignoring patterns because we're scared of offending memory helps no one. But we also agree that raw data without context is lies.

  **2. The Cruxes**
  Here is where we diverge. We've identified two breaking points. For each, we've picked a concrete pairing of events we both agree is relevant to discuss. We state our predictions neutrally, so each side can recognise their own conviction in the text.

  **Crux A: The Threshold of Uniqueness**
  *The Question:* Is there a point where an event is so specific that comparing it to anything else breaks down meaningfully?

  *   **Concrete Pairing:** The Holocaust vs. The Herero and Namaqua Genocide.
  *   **Camp 'Justice Through Hierarchy' Prediction:** Comparing these reveals a continuum of industrialised killing. We predict that linking them shows how colonial methods prefigured later European atrocities, creating a usable lineage of warning signs for future prevention.
  *   **Camp 'Sanctity of Memory' Prediction:** Comparing these risks flattening the specific theological and industrial nature of the Holocaust into a generic 'genocide' category. We predict that while structural similarities exist, the unique intent to erase a people from history entirely creates a threshold where comparison obscures more than it reveals.

  **Crux B: Instrumentalisation of Victims**
  *The Question:* Does using these events to build political or philosophical frameworks necessarily turn the dead into tools?

  *   **Concrete Pairing:** The Holodomor vs. The Great Leap Forward Famine.
  *   **Camp 'Justice Through Hierarchy' Prediction:** Treating these as comparable cases of policy-induced famine allows us to isolate variables (ideology vs. incompetence). We predict this utility honours the dead by ensuring their deaths inform future governance, making the suffering mean something tangible.
  *   **Camp 'Sanctity of Memory' Prediction:** Using these famines as data points for political theory reduces human starvation to a variable in a policy equation. We predict that this approach instrumentalises the victims, suggesting their value lies in the lesson learned rather than their inherent dignity, which is a secondary desecration.

  **3. Closing Thought**
  We agree to keep comparing, but we agree to disagree on the purpose. One side believes ranking is a duty to the living; the other believes it's a debt to the dead. Perhaps justice requires we hold both thoughts without letting go of either. We'll meet again next year. Probably argue again too.

  *Signed,*
  *The Working Group on Historical Evils*
  *London, October 2023*
