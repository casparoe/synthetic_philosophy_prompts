prompt: |-
  I'm in the last year of a PhD in behavioural ecology, writing the synthesis chapter of a thesis on cooperation, and I've realised I don't actually have a specification for what I want out of a theory in this area — only a set of half-articulated demands that my committee keeps invoking inconsistently. So before I write the chapter I want the desiderata stated properly: what any adequate theory of the evolution of cooperation has to deliver, with the case or consideration behind each requirement. The purpose I care about is diagnostic rather than merely narrative. My empirical chapters are on a set of field systems (a cooperative breeder with high extra-group dispersal, and an interspecific mutualism where the benefit to the recipient arrives months after the actor has paid the cost and often accrues to a different individual than the one who was helped). What I need from a theory is the ability to license — or to refuse to license — an inference from field data to a mechanism: given helping rates, relatedness estimates, interaction structure and the timing of costs and benefits in a natural population, which mechanism is operating, and what would I have to measure to tell? That is my standard of adequacy, and I'd like the list built for it, not for the standard of "explains why cooperation exists somewhere" or "is elegant in a model."

  Here is the material I think the criteria have to come out of, roughly in the order it started bothering me. (i) One-shot anonymous encounters: humans in the lab cooperate well above zero in a single anonymous prisoner's dilemma with no future and no reputation, and I don't know whether that is data for a theory of cooperation or noise generated by a psychology built for repeated life. (ii) The unknown horizon: in every real system the continuation probability is not known to the players, only to me, so a strategy that needs the players to know the shadow of the future is asking for something nature doesn't provide. (iii) Misimplementation: in my mutualism the helping act fails independently of the helper's effort maybe a fifth of the time, so a partner cannot condition on realised benefit — and relatedly, benefits are decoupled from costs across individuals, which breaks the feedback loop that partner-fidelity accounts lean on. (iv) No recognition: in the cooperative breeder I cannot find any evidence that helpers discriminate among the adults they assist, yet helping is strongly assortative with respect to something. (v) Large groups: dyadic reciprocity machinery does not obviously scale to the n-player public-goods structure that most of the interesting cases have. (vi) Private, noisy assessment: in my own simulations, once assessment of reputations is private rather than public, the plain image-scoring style of norm stops sustaining cooperation, and the more demanding norms that survive require cognitive and informational machinery I would be embarrassed to attribute to my study animals. (vii) Second-order free riding: any account that stabilises cooperation by punishment has to explain why the punishers aren't undercut. (viii) Payoff non-transparency: the players don't observe each other's payoffs, only their own, plus noisy cues. (ix) The definitional case: some of what gets called 'cooperation' is mutualism or a byproduct of self-interested behaviour, where there is no puzzle at all, and I want a theory to be able to say when the puzzle dissolves rather than to explain a case that never needed explaining. (x) The bookkeeping constraint: as far as I can tell, every mechanism works by arranging either genetic relatedness or a fitness feedback from the recipient's benefit back to the actor, so a candidate that seems to produce cooperation from random interaction without either is probably hiding assortment in its assumptions. I take (x) to be a consistency constraint rather than a desideratum, but I want you to tell me if I'm wrong about that.

  What I'd like from you, then, is the list: the requirements, which cases or considerations motivate each, and — this is the part I expect to be most useful — which of the things people in this literature demand are genuine desiderata and which are prejudices of one camp (for instance, is it a real requirement that a theory specify an explicit decision rule and cue set, or is that just what the reciprocity people are used to building? is demanding that a single mechanism cover all species a requirement or a taste for unification? is identifiability from observational data a fair demand, or does it just penalise theories that are permissive about mechanism?). Then flag any subset you think cannot be jointly satisfied — I suspect something like "explain cooperation in genuinely one-shot, anonymous, non-kin interactions" plus "be stable against invasion by unconditional defectors" plus "invite no assortment" is inconsistent, and I want to know which is the right one to drop and what dropping it costs me — and say which single requirement does the most work in knocking out candidates, since that is the one my chapter should be organised around. Only after that, and briefly, would I like a scorecard: direct reciprocity, indirect reciprocity, kin selection and inclusive fitness, partner choice and biological markets, byproduct mutualism, and multilevel selection, each in a few lines against the list. Keep the weight on the criteria and their motivating cases rather than on the scoring; I can do the scoring myself, and my committee will argue about it anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Final-year PhD student in behavioural ecology. Writing the synthesis chapter of a thesis on cooperation.
      *   **Problem:** Lacks a clear specification of what an *adequate theory* of cooperation should deliver. Committee invokes demands inconsistently. Needs a set of *desiderata* (requirements) to evaluate theories diagnostically.
      *   **Goal:** Create a list of requirements for a theory of cooperation, motivated by specific empirical/theoretical problems (items i-x provided). Distinguish genuine desiderata from camp-specific prejudices. Identify incompatibilities. Identify the "most work-doing" requirement. Provide a brief scorecard of major theories against these criteria.
      *   **Tone/Style:** Rigorous, analytical, philosophical but grounded in empirical biology. Avoids fluff. Acknowledges the complexity and the "diagnostic" nature of the request (licensing/refusing inferences from data to mechanism).
      *   **Key Constraint:** The standard of adequacy is *diagnostic* (can I tell mechanism X is operating given data Y?), not just narrative (does mechanism X allow cooperation to exist?).

  2.  **Deconstruct the Input Material (i-x):**
      *   (i) One-shot anonymous encounters (Human lab data): Challenge to reciprocity/reputation. Is it noise or signal?
      *   (ii) Unknown horizon: Players don't know $\delta$ (continuation prob). Challenges Tit-for-Tat (TFT) style models requiring known shadow of the future.
      *   (iii) Misimplementation/Decoupling: Help fails sometimes; benefit goes to different individual than cost-payer. Challenges partner fidelity/reciprocity based on realized benefit.
      *   (iv) No recognition: Helpers don't discriminate among adults, but helping is assortative. Challenges kin recognition or partner choice based on individual ID.
      *   (v) Large groups: Dyadic models don't scale to n-player public goods.
      *   (vi) Private, noisy assessment: Image scoring fails with private info; complex norms require too much cognition. Challenges Indirect Reciprocity (IR).
      *   (vii) Second-order free riding: Punishment is costly. Who punishes punishers? Challenges sanctioning models.
      *   (viii) Payoff non-transparency: Players see cues, not payoffs. Challenges models assuming perfect payoff knowledge.
      *   (ix) Definitional case: Distinguish true cooperation (puzzle) from byproduct mutualism (no puzzle).
      *   (x) Bookkeeping constraint: Relatedness or Fitness Feedback. Is this a hard constraint? (User thinks yes, wants confirmation).

  3.  **Drafting the Desiderata (The Core Task):**
      *   *Requirement 1: Empirical Identifiability.* (Motivated by the user's main goal: diagnostic power). A theory must specify measurable signatures that distinguish it from alternatives. (Motivated by the need to license/refuse inferences).
      *   *Requirement 2: Informational Parsimony.* (Motivated by ii, vi, viii). The cognitive/informational demands must match the organism's capacity. No "knowing the shadow of the future" if it's unknowable.
      *   *Requirement 3: Robustness to Noise and Error.* (Motivated by iii, vi). Mechanisms must work when acts fail or assessments are private/noisy.
      *   *Requirement 4: Scalability.* (Motivated by v). Must handle $n$-player interactions, not just dyads.
      *   *Requirement 5: Stability against Higher-Order Exploitation.* (Motivated by vii). Must explain why the enforcement mechanism isn't subverted.
      *   *Requirement 6: The "Puzzle" Filter.* (Motivated by ix). Must distinguish cooperation from byproduct mutualism.
      *   *Requirement 7: The Accounting Constraint.* (Motivated by x). Must identify the source of assortment/feedback (Kin or Feedback).

  4.  **Evaluating "Desiderata vs. Prejudices":**
      *   *Explicit Decision Rules:* Prejudice (Reciprocity camp). Evolution acts on outcomes, not necessarily conscious rules.
      *   *Single Mechanism for All Species:* Prejudice (Unification taste). Pluralism is likely true.
      *   *Identifiability from Observational Data:* Genuine Desideratum (for *this* user's purpose). If a theory makes no distinct predictions, it's not diagnostic.
      *   *Bookkeeping Constraint (x):* Genuine Constraint. Hamilton's rule generalizes. If there's no $r$ or no $b/c$ feedback loop, it's mathematically impossible (unless group selection is framed as assortment).

  5.  **Identifying Incompatibilities (The "Impossible Trinity"):**
      *   The user suspects: One-shot + Anonymous + Non-kin + Stable against Defectors.
      *   Analysis: This is indeed impossible under standard evolutionary logic without hidden assortment.
      *   Resolution: You must drop "Anonymous/Non-kin" (there must be hidden structure/assortment) OR drop "Stable" (it's transient/spandrel) OR drop "One-shot" (it's actually repeated in the wild).
      *   *Most Work-Doing Requirement:* **Empirical Identifiability (Distinct Signatures).** This is what separates a "just-so story" from a scientific theory in this context. It forces the theorist to say *what data would falsify this*.

  6.  **Developing the Scorecard (Brief):**
      *   *Kin Selection:* Strong on (x), weak on (iv) if recognition is assumed (but user says no recognition needed for kin selection if spatial structure exists). Good on (ix).
      *   *Direct Reciprocity:* Fails (ii), (iii), (v).
      *   *Indirect Reciprocity:* Fails (vi), (ii). High cognitive load.
      *   *Partner Choice/Markets:* Good on (iv) (assortment without recognition via matching), struggles with (iii) if benefits decoupled.
      *   *Byproduct Mutualism:* Solves (ix) by dissolving the puzzle. Fails if costs are real.
      *   *Multilevel Selection:* Mathematically equivalent to Kin/Group, often lacks specific mechanism for (ii)/(vi).

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on (x):* The user asks if (x) is a consistency constraint. Yes, it essentially is. It's the "No Free Lunch" theorem of social evolution. I need to validate this strongly.
      *   *Correction on Identifiability:* This is the user's specific pain point. I need to emphasize that many theories are *existence proofs*, not *diagnostic tools*. The desideratum is that the theory must be a diagnostic tool.
      *   *Tone Check:* Ensure I don't sound like I'm teaching them basic ecology. They are a PhD candidate. Speak peer-to-peer. Use terms like "equifinality," "identification problem," "phenotypic assortment."

  8.  **Final Structure:**
      *   **Introduction:** Acknowledge the sophistication of the request. Validate the "diagnostic" standard.
      *   **The Desiderata List:** 5-6 core requirements, mapped to the user's (i-x) points.
      *   **Desiderata vs. Prejudices:** Explicitly categorize common demands.
      *   **The Incompatibility Cluster:** Address the "One-shot/Anonymous/Stable" triangle.
      *   **The "Kingpin" Requirement:** Identify Identifiability as the organizer.
      *   **The Scorecard:** Brief, sharp evaluation of the major frameworks.
      *   **Conclusion:** Brief wrap-up.

  9.  **Drafting the Content (Iterative refinement during drafting):**
      *   *Make sure to address (iv) No Recognition:* Kin selection doesn't require *active* recognition, just spatial/structural assortment. This is a crucial distinction for the synthesis chapter.
      *   *Make sure to address (iii) Misimplementation:* This kills strict reciprocity. Needs "generous" tit-for-tat or partner fidelity feedback that averages over time.
      *   *Refine the "Bookkeeping Constraint":* Call it the "Accounting Identity." It's not a mechanism, it's a balance sheet.

  10. **Final Review against constraints:**
      *   Did I answer the specific question about (x)? Yes.
      *   Did I flag the incompatibilities? Yes.
      *   Did I identify the single most important requirement? Yes.
      *   Is the scorecard brief? Yes.
      *   Is the tone appropriate? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated problem. You are encountering the difference between an *existence proof* (showing cooperation *can* evolve) and an *identification strategy* (showing cooperation *did* evolve via mechanism X in system Y). Most theoretical literature provides the former; your empirical reality demands the latter.

  Below is the specification you requested. It treats a theory of cooperation not as a story about why cooperation is nice, but as a causal model that must survive contact with noisy, partial, natural data.

  ### I. The Desiderata for a Diagnostic Theory of Cooperation

  These are the requirements a theory must meet to be useful for your synthesis chapter. They are derived directly from your points (i)–(x).

  **1. The Identification Constraint (Distinct Signatures)**
  *   **Requirement:** The theory must generate at least one empirical prediction that is *not* generated by rival mechanisms. It must specify what data would *falsify* it, not just what data supports it.
  *   **Motivation:** Your core goal is to license or refuse inferences from field data to mechanism. If Kin Selection and Direct Reciprocity both predict "helpers help kin," you cannot distinguish them without a second-order prediction (e.g., response to experimental manipulation of relatedness vs. response to manipulation of future interaction probability).
  *   **Source:** Your diagnostic standard; implicitly (vi) and (viii).

  **2. The Informational Parsimony Constraint**
  *   **Requirement:** The cognitive or informational demands placed on the agent must not exceed what is available in the natural history of the system. The agent cannot condition on variables it cannot perceive or estimate.
  *   **Motivation:** (ii) Unknown horizon (agents don't know $\delta$), (vi) Private/noisy assessment (agents don't know global reputation), (viii) Payoff non-transparency. A model requiring knowledge of the "shadow of the future" is biologically vacuous if the animal cannot estimate continuation probability.
  *   **Source:** (ii), (vi), (viii).

  **3. The Robustness to Noise Constraint**
  *   **Requirement:** The mechanism must remain stable when the link between action and outcome is probabilistic, and when benefits are decoupled from the specific actor-recipient dyad over short timescales.
  *   **Motivation:** (iii) Misimplementation (help fails 20% of time) and decoupled benefits (recipient $\neq$ cost-payer). Strict reciprocity (TFT) collapses under execution error; a viable theory must specify the tolerance threshold (e.g., Generous TFT, or partner fidelity feedback averaged over seasons).
  *   **Source:** (iii).

  **4. The Scalability Constraint**
  *   **Requirement:** The mechanism must function in $n$-player structures without requiring a decomposition into pairwise dyadic interactions that do not exist in reality.
  *   **Motivation:** (v) Large groups. Dyadic reciprocity machinery often fails in public goods games because defection against the group is not defection against a specific partner who can retaliate.
  *   **Source:** (v).

  **5. The Higher-Order Stability Constraint**
  *   **Requirement:** If the mechanism relies on enforcement (punishment/sanctioning), it must explain the stability of the enforcement itself against second-order free-riders (those who cooperate but do not punish).
  *   **Motivation:** (vii) Second-order free riding. A theory that solves cooperation by invoking punishment but ignores the cost of punishing is incomplete.
  *   **Source:** (vii).

  **6. The Puzzle Filter (The "Byproduct" Test)**
  *   **Requirement:** The theory must provide a criterion to distinguish true cooperation (costly to actor) from byproduct mutualism (net immediate benefit to actor).
  *   **Motivation:** (ix) The definitional case. If the behaviour is self-serving in the short term, invoking evolutionary mechanisms for altruism is a category error. The theory must define the cost/boundary where the "puzzle" begins.
  *   **Source:** (ix).

  **7. The Accounting Identity (Your point x)**
  *   **Requirement:** The theory must explicitly identify the source of positive assortment or fitness feedback.
  *   **Motivation:** (x) The bookkeeping constraint.
  *   **Status:** **This is a Consistency Constraint, not a Desideratum.** You are correct. It is mathematically impossible for cooperation to evolve without either genetic relatedness (inclusive fitness) or a fitness feedback loop (reciprocity/markets/MLS) that creates *phenotypic* assortment. If a model claims to produce cooperation from random interaction without these, it is hiding assortment in the parameters (e.g., in the viscosity of the population or the structure of the interaction network). You do not need to "demand" this; you can use it to dismiss candidates *a priori*.

  ---

  ### II. Desiderata vs. Prejudices

  You asked which demands are genuine and which are camp-specific tastes.

  | Demand | Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **Explicit Decision Rules** | **Prejudice** | Reciprocity theorists love explicit "If X then Y" rules. Evolution selects for outcomes, not necessarily conscious algorithms. A mechanism can be physiological or hormonal (e.g., oxytocin-mediated trust) without a cognitive "rule." |
  | **Single Mechanism for All Species** | **Prejudice** | A taste for unification. Cooperation in bacteria (quorum sensing) and humans (norms) likely relies on different proximate mechanisms, even if the ultimate logic (Accounting Identity) is the same. Pluralism is the null hypothesis. |
  | **Identifiability from Observational Data** | **Genuine Desideratum** | *For your purpose.* If a theory cannot be distinguished from rivals using field data (even with experimental augmentation), it is a metaphysical claim, not a scientific one. This penalizes permissive theories, but correctly so. |
  | **Cognitive Complexity** | **Prejudice** | Assuming animals *cannot* track reputations is often a human-centric bias. However, assuming they *do* without evidence is worse. The constraint is **Informational Parsimony** (can they *actually* get the info?), not a priori limits on cognition. |
  | **Equilibrium Stability** | **Genuine Desideratum** | A mechanism that works only at a knife-edge equilibrium is not an explanation for robust natural phenomena. It must be an Evolutionarily Stable Strategy (ESS) or robustly convergent. |

  ---

  ### III. The Incompatibility Cluster

  You suspected a contradiction. You are right. The following triad is inconsistent:

  1.  **Genuine One-Shot Interaction:** No future interaction, no reputation carry-over.
  2.  **Anonymity/No Assortment:** Random pairing, no kin structure, no partner choice.
  3.  **Stability Against Unconditional Defectors:** Cooperation persists and is not invaded.

  **Resolution:** You must drop one.
  *   **Drop (1):** Most "one-shot" lab interactions are not one-shot in the evolutionary context (psychology is adapted to repeated games). *Cost:* You must argue your field system involves repeated interactions or evolutionary shadows.
  *   **Drop (2):** There is hidden assortment (spatial structure, kin structure, or green-beard effects). *Cost:* You must measure the structure. If you claim anonymity, you must prove the absence of assortment.
  *   **Drop (3):** The cooperation is transient, a spandrel, or maintained by mutation-selection balance. *Cost:* You admit the behaviour is not currently adaptive in that context.

  **Recommendation:** In a synthesis chapter, **drop (2)**. Almost all natural "anonymous" interactions hide structural assortment (viscosity, network clustering). Claiming true randomness is usually the error.

  ---

  ### IV. The "Kingpin" Requirement

  If you organise your chapter around one requirement, make it **Requirement 1: The Identification Constraint (Distinct Signatures).**

  **Why:**
  1.  **It forces mechanism over narrative.** Most theories explain *how cooperation is possible*. Your data needs to know *which possibility is actual*.
  2.  **It subsumes the others.** To identify a mechanism, you implicitly test for Informational Parsimony (can they know the cue?), Robustness (does it hold when noise is added?), and Accounting (where is the benefit coming from?).
  3.  **It resolves the Committee conflict.** When committee members invoke inconsistent demands, you can ask: "Does this demand help us distinguish Kin Selection from Reciprocity in this dataset?" If no, it is decorative. If yes, it is essential.

  **The Diagnostic Question:** "What pattern in the data would this mechanism produce that a rival mechanism would *not*?"
  *   *Kin Selection:* Helping correlates with $r$, insensitive to future repayment probability.
  *   *Reciprocity:* Helping correlates with past receipt, insensitive to $r$ (controlling for it).
  *   *Byproduct:* Helping correlates with immediate self-benefit, disappears when cost > immediate benefit.

  ---

  ### V. Brief Scorecard

  Here is how the major frameworks score against your diagnostic desiderata.

  **1. Kin Selection / Inclusive Fitness**
  *   **Strengths:** Satisfies **Accounting Identity** perfectly. High **Informational Parsimony** (requires only spatial/kin structure, not active recognition—addressing your point iv). Solves **Puzzle Filter** (clear cost/benefit definition).
  *   **Weaknesses:** **Identification** is hard if kin also interact repeatedly (confounded with reciprocity). Struggles with **Large Groups** (point v) unless framed as MLS.
  *   **Verdict:** The null hypothesis. Must be ruled out before invoking reciprocity.

  **2. Direct Reciprocity (TFT and variants)**
  *   **Strengths:** Clear **Identification** signature (contingency on past behaviour).
  *   **Weaknesses:** Fails **Robustness to Noise** (point iii) without modification (e.g., Generous TFT). Fails **Informational Parsimony** (point ii) if agents must know $\delta$. Fails **Scalability** (point v) in large groups.
  *   **Verdict:** Unlikely to explain your mutualism (decoupled benefits) or large-group breeder dynamics without heavy modification.

  **3. Indirect Reciprocity (Reputation)**
  *   **Strengths:** Solves **Scalability** (can work in large groups).
  *   **Weaknesses:** Fails **Informational Parsimony** catastrophically (point vi). Requires public, reliable information flows that rarely exist in non-human systems. Fails **Robustness** with private assessment.
  *   **Verdict:** High cognitive load makes it a poor candidate for non-human field systems unless evidence of information sharing is strong.

  **4. Partner Choice / Biological Markets**
  *   **Strengths:** Excellent for **Identification** (competition among helpers drives benefit up). Handles **No Recognition** (point iv) via matching rather than ID. Robust to **Noise** (partners switch rather than punish).
  *   **Weaknesses:** Requires **Supply/Demand** variance. If partners cannot leave (no outside options), the market collapses.
  *   **Verdict:** Strong candidate for your cooperative breeder if dispersal (outside option) is viable.

  **5. Byproduct Mutualism**
  *   **Strengths:** Solves **Puzzle Filter** by dissolving the puzzle. High **Stability** (no temptation to defect).
  *   **Weaknesses:** Cannot explain costly helping where immediate net payoff is negative.
  *   **Verdict:** Must be tested first. If costs are real, this is ruled out.

  **6. Multilevel Selection (MLS)**
  *   **Strengths:** Mathematically equivalent to Kin Selection (satisfies **Accounting**). Good for **Large Groups** (point v).
  *   **Weaknesses:** Often lacks **Identification** signatures distinct from Kin Selection in empirical data (the "price equation" problem).
  *   **Verdict:** Useful framing for group-level effects, but empirically indistinguishable from Kin Selection without specific group-fission data.

  ### Summary for the Chapter

  Your synthesis should not ask "Which theory is true?" but "Which theory is *diagnostically supported* by the specific constraints of my systems?"

  1.  **Assert the Accounting Identity:** Cooperation requires assortment or feedback.
  2.  **Apply the Puzzle Filter:** Rule out byproduct mutualism first.
  3.  **Apply Informational Parsimony:** Discard mechanisms requiring knowledge the animals don't have (e.g., exact $\delta$, public reputation).
  4.  **Apply Identification:** Look for the distinct signature (e.g., if helping persists when repayment is impossible, reciprocity is falsified; if helping tracks relatedness despite opportunity for higher return elsewhere, kin selection is supported).

  This framework turns your committee's inconsistent demands into a filter: if a demand doesn't help you satisfy **Identification** or **Parsimony**, it is noise.
