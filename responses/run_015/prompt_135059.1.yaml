answer: |-
  ### The Commitment
  **Position:** Pure time preference is **morally indefensible**. Discriminating against a future person solely because they exist later is ethically identical to discriminating based on distance or identity.
  **The Exposure:** This position creates a paradox of paralysis. If you do not discount the future at all, the present cannot justify *any* expenditure that doesn't yield immediate return, because the accumulated weight of infinite future costs always outweighs present benefit. Halloran must navigate this: she knows the math is morally rotten, but she also knows that without it, the Board cannot function. The scene must show her using a tool she knows is broken because it is the only tool that cuts.

  ### The Case: Dredging the Outfall Channel
  **Why this carries the scene:**
  A seawall is the wrong choice because it is a binary defense of *land*. It implies holding the line against the sea to save property. Crewe is a fisherman; his concern is *access* and *flow*, not dry feet. A seawall suggests permanence. Dredging suggests **maintenance of a function**.
  *   **The Scenario:** The channel silts up. If dredged now (£100k), fishing is good for 20 years. If dredged in 2150 (£100k nominal), fishing is good for 20 years then.
  *   **Why it works:** It isolates the *cost* (the dredging bill) from the *benefit* (the fish). It forces the question: Is spending £100k in 2150 the same burden as spending £100k today?
  *   **The Charter Trap:** The Charter protects "The Levels," not "Fishermen." If the fishermen are gone in 2150, does the Channel still need dredging? The Charter says yes (it's a continuing concern). Crewe says no (it's our livelihood).

  ### The Order of Ingredients
  Crewe hears "discounting" as a single slur meaning "you don't care." Halloran must surgically separate the three components of the discount rate ($r$) in this specific order:

  1.  **Growth (The Accounting of Wealth):**
      *   *Argument:* "In 2150, the Authority will likely have more revenue. £100k will be a smaller fraction of their budget than ours."
      *   *Goal:* Move the debate from *value of life* to *capacity to pay*. Crewe can accept that richer successors can bear costs easier.
  2.  **Probability (The Accounting of Existence):**
      *   *Argument:* "There is a chance the Board will not exist, or the Channel will be silted beyond repair, or the sea will have taken the Outfall."
      *   *Goal:* Shift from *moral neglect* to *actuarial risk*. We don't discount because we don't care; we discount because the bill might never arrive.
  3.  **Pure Time (The Moral Residue):**
      *   *Argument:* "Even if they are there, and even if they are poor, the Charter weighs the present need heavier."
      *   *Goal:* This is the reveal. This is where the "moral judgement" lives.

  ### Crewe's Objections & Halloran's Maneuvers

  **1. Objection: "You're counting on inflation."**
  *   *Crewe's Move:* He assumes "discounting" means money will be worth less. He thinks she's playing currency games.
  *   *Halloran's Concession:* **Concede.** Acknowledge that prices change, but clarify the calculation uses *real* terms (constant value). This builds trust. She validates his economic literacy.

  **2. Objection: "You're betting we won't be here."**
  *   *Crewe's Move:* He attacks the **Probability** ingredient. He hears "chance no one will be left" as "you hope we're gone so you don't have to pay."
  *   *Halloran's Defuse:* **Defuse.** Do not deny the buy-out. Acknowledge the family is leaving. But pivot to the *Board's* existence, not the family's. "It is not about your family, Mr. Crewe. It is about whether the Aldwick Levels Board holds a charter in 2150." This shifts the target from his mortality to the Institution's bureaucracy.

  **3. Objection: "A pound is a pound."**
  *   *Crewe's Move:* He attacks the **Pure Time** ingredient. If the Board exists, and the money is real, why is the future cost smaller?
  *   *Halloran's Stand:* **Stand.** This is where she cannot yield. She must explain that the Charter treats the "Continuing Concern" as a single entity that experiences time differently than a human.
  *   *The Distinction:* She must distinguish between **Community Discounting Members** (which is betrayal) and **Community Discounting Strangers** (which is survival). The Charter *collapses* this: it treats Crewe's grandchildren as strangers to the Board, even if they live on the Levels.
  *   *The Line:* She must admit that the "residue" is the price the present pays to remain solvent. It is not that the future matters less, but that the *present* matters more to the *survival of the Board*.

  ### What the Scene Must Refuse to Explain
  **The Origin of the Rate.**
  Halloran must never explain *who chose* the discount rate (e.g., 3.5% vs 5%). That number is political, not mathematical. If she explains the math, she hides the politics. The scene must treat the rate as a law of nature (like gravity) when it is actually a policy choice. This preserves the tension: Crewe sees the mechanism, but not the hand on the lever.

  ### The Final Question
  Crewe must not ask a question that shows he was defeated (e.g., "So what do I do?"). He must ask a question that shows he understands the distinction between the *People* and the *Charter*.

  **The Question:**
  > "If my son buys the Charter, does the sum change?"

  **Why this works:**
  *   It tests the collapse of the distinction. If the "Levels" is a continuing concern, ownership shouldn't matter.
  *   If Halloran says "Yes," she admits the math is about *who* pays, not *when*.
  *   If Halloran says "No," she admits the Charter values itself over the bloodline.
  *   It shows Crewe understands that the "discount" is not about time, but about *identity*. He has realized the Board is discounting *him*, not the *year*.

  ### Vulnerability of the Position
  By taking the stance that pure time preference is **indefensible**, the plan exposes Halloran to the charge of **hypocrisy**. She is using a tool she believes is immoral to justify a decision that hurts a man she respects.
  *   **The Exposure:** If pure time preference is indefensible, then the Board is systematically robbing the future. Halloran knows this. The scene fails if she sounds like she believes the lie. She must sound like a priest reciting a liturgy she no longer prays. The tension comes from her *competence* masking her *doubt*. If she defends the morality too well, she becomes a villain. If she defends it too poorly, she becomes incompetent. She must walk the line of a technician fixing a machine she knows is dangerous.
