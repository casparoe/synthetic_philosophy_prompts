answer: |-
  ### Philosophical Blueprint

  *   **Objective:** Drive a wedge between Moral Equality of Combatants (MEC) and Revisionist Liability (RL) using a specific logistical constraint.
  *   **Key Mechanism:** Epistemic uncertainty regarding liability (opacity) combined with physical mutual dependence (interdependence).
  *   **MEC Prediction:** Strike permitted. Combatant status is sufficient for liability; military necessity overrides shared cost.
  *   **RL Prediction:** Strike forbidden. Uncertainty about enemy liability + harm to own just cause makes the strike disproportionate/impermissible.
  *   **Vulnerability:** MEC will argue that epistemic symmetry (both sides are equally blind) validates normative symmetry, rendering the opacity irrelevant to the permissions structure.

  ***

  ### The Scenario

  In the Verdun sector, a single paved supply artery runs through neutral marshland, physically required by both Alpha and Beta battalions to move ammunition and evacuate wounded, meaning blasting the central bridge halts operations for both units equally. Command structures for both sides have fractured into autonomous nodes following a communications blackout, creating a state of interdependent command opacity where neither local commander can verify whether the opposing battalion is operating under a lawful declaration of war or a rogue insurrectionist mandate. Alpha's commander knows their own cause is just but cannot ascertain if Beta's soldiers are liable aggressors or mistaken defenders, yet knows destroying the bridge neutralizes Beta's immediate offensive capacity while simultaneously starving their own troops of critical resupply needed to hold a humanitarian safe zone.

  ***

  ### Theoretical Breakdown

  **The Moral Equality Verdict**
  A defender of the standard view argues the strike is permissible. Under this framework, Beta's soldiers possess combatant privilege simply by virtue of being uniformed members of an organized armed group, regardless of the justice of their cause. The interdependent command opacity is irrelevant to their liability status; they are legitimate targets because they pose a threat, not because they are morally culpable. The commander weighs the military advantage of neutralizing Beta's offensive against the cost of losing their own supply line. Since the loss of supply is a calculated risk accepted by the commander rather than a violation of enemy rights, the symmetry of physical damage does not create a moral prohibition. The strike proceeds because combatants are symmetrically liable to be killed, and the corridor is a valid military objective.

  **The Revisionist Liability Verdict**
  A revisionist argues the strike is impermissible. Liability to attack is derived from moral responsibility for an unjust threat, not merely from wearing a uniform. Due to interdependent command opacity, Alpha cannot confirm that Beta's soldiers are actually liable; there is a significant probability they are fighting in mistaken self-defense or under a valid mandate unknown to Alpha. Targeting them risks killing non-liable persons, which is strictly forbidden unless absolutely necessary to prevent catastrophic harm. Furthermore, because the corridor's destruction collapses supply for Alpha's own just cause, the strike inflicts disproportionate harm on the very people it is meant to protect. Without certainty of enemy liability, the presumption shifts against violence, forbidding the strike.

  **The Feature Doing the Work**
  The divergence hinges entirely on the **epistemic weight of interdependent command opacity**. For the Moral Equality theorist, opacity is background noise; liability is binary and status-based, so uncertainty about the enemy's mandate does not change their targetability. For the Revisionist, opacity is decisive; liability is fact-relative and moral, so uncertainty about the enemy's mandate directly degrades the permission to kill. The physical interdependence amplifies this by ensuring that the cost of error is paid by the just side as well, making the Revisionist risk-calculation fail even faster.

  **The Weakest Point for a Moral-Equality Defender**
  A sharp defender of Moral Equality would attack the Revisionist handling of uncertainty. They would argue that interdependent command opacity creates **symmetrical ignorance**, which functionally restores moral symmetry even if ontological asymmetry exists. If Alpha cannot know Beta is unjust, Beta likely cannot know Alpha is just; therefore, both sides are epistemically situated identically. The Moral Equality theorist would claim that demanding higher epistemic standards for liability than for self-defense creates a paralysis that violates the right of just combatants to protect their own cause. They would break the case by arguing that in conditions of radical opacity, the only coherent rule is to treat all combatants as equals, rendering the Revisionist distinction operationally null and morally self-defeating for the just side.
