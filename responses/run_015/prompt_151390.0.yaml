answer: |-
  | Tax Frame Element | Prioritarianism Equivalent |
  | :--- | :--- |
  | Pre-tax income | Raw well-being levels |
  | Marginal rate schedule | Priority weighting function (concave transform) |
  | Marginal rate itself | Moral weight of additional well-being |
  | Post-tax income | Priority-weighted well-being value |
  | Total revenue | Overall moral value of the distribution |
  | Legislature | Moral theorist/principle setting the weight |
  | Behavioral response | Changes in well-being affecting total value |

  In the tax frame, leveling down corresponds to the state destroying pre-tax income (burning money) without altering the schedule. Since the schedule is fixed and increasing, destroying income necessarily reduces total revenue. Thus, the analogy correctly registers that standard prioritarianism rejects leveling down. However, your suspicion is correct: the frame lacks resources to represent the egalitarian's claim that equality itself has value. To represent telic egalitarianism, the schedule would need to be Gini-indexed, changing rates based on dispersion rather than just income levels. A fixed progressive schedule cannot capture the claim that a distribution is better solely because it is more equal; it can only capture that transferring from rich to poor increases total weighted value. Consequently, the analogy begs the question against egalitarianism by defining value exclusively through individual holdings transformed by a static function.

  Two primary disanalogies undermine your colleague's conclusions. Regarding her first conclusion (that the disagreement is merely calibration), the tax analogy fails because progressive taxation is not regarded as mere bookkeeping. A tax schedule embodies a substantive view on redistribution and entitlement, not just a scaling convention. Similarly, the priority weighting is not a neutral measurement choice but a normative commitment to giving benefit to the worse off more weight. Regarding her second conclusion (that immunity is cheap because it drops equality), the disanalogy is sharper. Diminishing marginal utility of money is an empirical psychological claim subject to verification; diminishing marginal moral weight is a normative stipulation. The analogy requires reading the transformation as a re-measurement of well-being (empirical) to hold, but prioritarianism relies on weighting given well-being (normative). Because there is nothing independent to check the moral weight against, the analogy obscures the philosophical work being done. It makes the priority view look like a technical adjustment rather than a foundational moral stance.

  Your analysis of the leveling-down objection (LDO) immunity is precise. For any fixed weighting function, the rejection of leveling down follows from separability and monotonicity. If value is the sum of individually transformed well-being, and the transformation is strictly increasing, reducing someone's well-being without compensating others must reduce total value. Concavity is irrelevant to this specific immunity; a convex separable function would also reject leveling down. Therefore, your colleague's charge that the escape is "cheap" because it abandons equality is aimed at the wrong feature. The immunity is not bought by concavity (which handles redistribution) but by separability (which handles person-affecting constraints). The escape is not dialectically cheap; it is a structural consequence of rejecting pattern-based valuation in favor of aggregative individualism. The colleague conflates "not being egalitarian" with "trivially avoiding objections," missing that prioritarianism accepts the cost of rejecting equality to preserve separability.

  Your variable-schedule variant is structurally coherent but philosophically costly. Your arithmetic is plausible: if the exponent $p$ drops sufficiently as dispersion increases (e.g., $p \approx 0.19$ for range 9, $p \approx 0.29$ for range 5), then $V(1,6) > V(1,10)$ holds. This confirms that leveling down is favored. Furthermore, if increased dispersion lowers $p$ enough, a Pareto improvement like (1,10) to (1,11) can lower total value, violating the Pareto principle. This variant does not escape the LDO; it succumbs to it. It is not prioritarianism in the standard sense because it violates separability; the value of a person's well-being depends on others' levels. It is effectively egalitarianism with priority weighting serving as a relational term. Regarding the analogy: this variant falls outside the tax frame entirely. A tax schedule is pointwise; it applies rates to income regardless of others' income. An indexed schedule violates the separability inherent in the tax analogy. Thus, the variant refutes the colleague's analogy only by demonstrating its limitation: the analogy cannot model views where the "schedule" depends on the distribution's shape.

  The tax-schedule analogy is right for structural mapping but wrong for philosophical justification. It correctly illustrates how concavity generates redistribution incentives without requiring equality as a value. However, it fails to capture the normative status of the weighting function and fails to accommodate views where the weighting function itself is relational. It supports the colleague's structural claim (prioritarianism is separable) but undermines her philosophical conclusion (that this makes the view mere bookkeeping or the immunity cheap). The analogy treats the weighting function as arbitrary policy rather than moral truth, which is precisely the point in dispute. A better analogy would be a grading curve where the value of a point depends on the class distribution, though this too struggles with the normative/empirical distinction. Ultimately, the tax analogy is a useful pedagogical tool for separability but a misleading one for normative force.

