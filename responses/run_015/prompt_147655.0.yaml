      *   *Separation of Blame/Sanction:* Philosophically sound (responsibility vs. consequence management), practically difficult in a single document read by different stakeholders (family wants blame, regulator wants sanction, union wants fairness). The record *is* the sanction mechanism usually.
      *   *Luck Ledger:* Good conceptual tool, but in 90 mins, quantifying "constitutive luck" is impossible. It risks becoming box-ticking. Needs to be a qualitative check, not a score.
      *   *Counterfactual Twin Memo:* Crucial. Prevents outcome bias. But "median outcome" is hard to define instantly. Needs simplification to "Would we sanction this conduct if no harm occurred?"
      *   *Detection Discount:* This is the most dangerous idea practically. If undetected:detected ratio is unknown, "no sanction on outcome" might mean letting dangerous behavior slide because it's common. It conflates *fairness to the individual* (why me?) with *public safety* (stop this behavior). It needs to be restricted to *outcome-based* sanctions, not *conduct-based* sanctions.
