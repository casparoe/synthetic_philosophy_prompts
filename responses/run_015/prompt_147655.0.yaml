answer: |-
  Your framework is philosophically rigorous but operationally fragile. You are trying to import a graduate seminar's nuance into a room with a union rep, a clock, and a threat of litigation. The "Detection Discount" is the weakest link: you will never have the ratio. Demanding it invites guesswork that looks like arbitrariness. The "Blame/Sanction" separation is rhetorically impossible in a single document read by adversarial parties; the family reads "Coaching" as "They got away with it," and the union reads "Referral" as "You sacrificed them." You cannot speak two languages in one text. You must instead structure the text so the *logic* separates them, even if the readers conflate them.

  Here is the revised procedure. It drops "Constitutive Luck" as a separate ledger item (too speculative for 90 minutes) and merges it into "Capacity/Context." It replaces "Detection Discount" with a "Prevalence Check." It keeps the Counterfactual Twin but makes it a vote, not a memo.

  ### The SIRP Protocol (90 Minutes)

  **Phase 1: Fact Lock (15 mins)**
  *   **Question:** What specific acts or omissions are in evidence, distinct from the harm?
  *   **Sufficient Answer:** A list of verbs (e.g., "failed to check," "operated without reversal") agreed by all five panelists.
  *   **Lay Member Heuristic:** "Can we describe what they did without mentioning the patient's injury?"

  **Phase 2: Counterfactual Vote (15 mins)**
  *   **Question:** If this conduct had resulted in the median expected outcome (usually no harm), what disposition would we assign?
  *   **Sufficient Answer:** A unanimous or majority vote on a disposition *before* discussing the actual harm.
  *   **Stop Rule:** If the vote is "No Action," the procedure stops. Individual disposition is No Action. Systemic recommendations may follow.
  *   **Lay Member Heuristic:** "Would we fire them if nobody got hurt?"

  **Phase 3: Luck & Context Ledger (20 mins)**
  *   **Question:** What factors outside the individual's control shaped this event?
  *   **Categories:** Resultant (outcome severity), Circumstantial (rosta, resources, training), Reporting (why this case and not others).
  *   **Sufficient Answer:** Explicit acknowledgment of at least one non-agency factor that increased risk or detection probability.
  *   **Lay Member Heuristic:** "Did the hospital make this mistake easier to make?"

  **Phase 4: Prevalence Check (15 mins)**
  *   **Question:** Is there evidence this conduct is widespread, tolerated, or previously undetected in this unit?
  *   **Sufficient Answer:** Confirmation of audit data, witness testimony, or prior incidents indicating normalized deviance.
  *   **Stop Rule:** If conduct is normalized/tolerated by management, Individual Sanction is suspended. Disposition defaults to No Action or Coaching. Systemic referral is mandatory.
  *   **Lay Member Heuristic:** "Is this person the only one doing this, or the only one caught?"

  **Phase 5: Sanction Calibration (25 mins)**
  *   **Question:** Given the Counterfactual Vote, adjusted for Luck and Prevalence, what is the final disposition?
  *   **Sufficient Answer:** A disposition from the set that aligns with the Counterfactual Vote unless Prevalence overrides it.
  *   **Value/Fact Handoff:** Facts (what happened) are determined by evidence. Values (what level of risk justifies dismissal) are determined by the panel. HR signs off on the *consequences* of the value judgment, not the judgment itself.
  *   **Lay Member Heuristic:** "Is this sanction about fixing the person or fixing the system?"

  ***

  ### Case Applications

  **Case One: The Insulin Nurses**
  *   **Fact Lock:** Both failed independent check.
  *   **Counterfactual Vote:** If no harm, what sanction? Protocol breach is clear. Vote: Informal Coaching.
  *   **Luck Ledger:** Nurse B has catastrophic Resultant Luck. Nurse A has Reporting Luck (audit vs. incident).
  *   **Prevalence Check:** Ward is "known to tolerate" the shortcut. This is normalized deviance.
  *   **Calibration:** The Prevalence Check overrides the Counterfactual Vote. You cannot coach individuals for a system-tolerated shortcut without scapegoating.
  *   **Disposition:** Both receive **NO ACTION**. The ward protocol enforcement receives a **FORMAL REMEDIATION** (systemic).
  *   **Defensible Gap:** Zero. Any gap is indefensible moral luck.
  *   **External Pressure:** The record must state: "Disposition reflects individual culpability. Outcome severity is addressed via separate restorative processes." You cannot satisfy the family's desire for retribution with individual blame if the blame is systemic. You tell them: "Punishing the nurse does not prevent the next death. Fixing the ward does."

  **Case Two: The Vascular Surgeon**
  *   **Fact Lock:** Retrospective checklist completion.
  *   **Counterfactual Vote:** If no death (which was true for 399 ops), what sanction? Likely Coaching or No Action, given manager tolerance.
  *   **Luck Ledger:** Resultant Luck is extreme (1 death vs. 399 near-misses). Reporting Luck is absolute (only seen because of death).
  *   **Prevalence Check:** Known to team, tolerated by manager, 400 operations. This is institutionalized risk.
  *   **Calibration:** Individual sanction is unjust. The surgeon led the culture, but the manager allowed it. Singling out the surgeon based on the death is a lottery.
  *   **Disposition:** Surgeon receives **NO ACTION**. Theatre Management receives **FORMAL REMEDIATION**.
  *   **Detection Discount:** It is not a lawyer's trick; it is a requirement of justice. If 400 instances exist and you punish one, you are punishing luck. However, because the surgeon *led* the deviation, a **FORMAL REMEDIATION** on leadership culture is justified, but not a regulator referral for clinical competence.
  *   **Verdict:** No individual disposition based on the death is defensible. The pattern justifies a systemic sanction, not an individual one.

  **Case Three: The Junior Doctor**
  *   **Fact Lock:** Failure to escalate deteriorating patient.
  *   **Counterfactual Vote:** If patient lived (as in the 3 other cases), what sanction? Given training gap and roster, likely No Action or Coaching.
  *   **Luck Ledger:** Circumstantial (rota gap, foreign training), Constitutive (sleep disorder), Resultant (death vs. 3 near-misses), Reporting (only seen because of death).
  *   **Prevalence Check:** Three comparable failures in same month, unreported. This is a systemic failure of escalation culture, not individual negligence.
  *   **Calibration:** The hospital placed an unfit resource (sleep-disordered, untrained, exhausted) in a high-risk slot. The individual is the vector, not the cause.
  *   **Disposition:** **NO ACTION**.
  *   **Family vs. Regulator:** You can give the family acknowledgment ("The system failed you") without giving the regulator a referral ("The doctor was incompetent"). These are not incompatible truths. The record must explicitly state: "Failure to escalate occurred, but culpability is attenuated by systemic constraints and health factors."
  *   **Option Set Problem:** Yes, the option set is the problem. It forces a choice between "Punish Individual" and "Do Nothing." You need a "Systemic Referral" option that carries weight equal to dismissal. Since you don't have it, you must use **NO ACTION** to signal that individual blame is the wrong category.

  ***

  ### The Two Doubts

  **Doubt One: Blame and Sanction in One Record**
  You cannot separate them in the *reading*, but you can separate them in the *structure*. If you write a narrative that blends them, you fail. The record must have distinct headings: "Findings of Fact," "Assessment of Conduct," "Assessment of Outcome," "Disposition." Under "Assessment of Conduct," you state what was wrong. Under "Disposition," you state what happens. You must include a preamble: "This panel adjudicates individual reliability, not moral culpability for outcomes determined by luck." The union and regulator will still fight over it, but the document will not lie. You are not asserting incompatible things; you are asserting that conduct reliability and outcome severity are different variables.

  **Doubt Two: The Lottery**
  Yes, you are administering a lottery. You only see the losers. The honest response is not to pretend otherwise. Your annual report must state: "We adjudicate detected harms. We acknowledge that identical conduct goes unsanctioned when undetected. Our goal is to use detected cases to find undetected risks." If you do not admit this, you are lying to yourself. The panel's job is not to fix the lottery (you can't) but to ensure that within the lottery, the ticket drawn does not determine the punishment. You fix the *fairness of the adjudication*, not the *fairness of the detection*.

  ***

  ### Procedure Limitations
  This procedure cannot fix the asymmetry of detection. It cannot stop the family from feeling justice was denied if the individual is not blamed for a death. It cannot stop the regulator from demanding a head when the system is the headless monster. It protects the individual from moral luck, but it does not protect the panel from political pressure.

