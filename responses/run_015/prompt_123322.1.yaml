      *   *(2) Scope Worry:* Global Expressivism/Minimalism. If truth is thin, why isn't "good"? Is answering this a requirement? It's often a *reductio* from inflationists. I should classify it as a "dialectical burden" rather than an internal adequacy condition.
      *   *(3) Conservativeness:* Horwich/Field. Is it a feature or a bug? It's a symptom of the disquotational view. Genuine desideratum? Only if you think truth shouldn't add new empirical content.
      *   *(4) Knock-out Requirement:* Generalization (Archive/Handover). If you can't generalize over unknowns, the logical device function fails.
      *   *(5) "Saying something":* This is the "Substantivity" worry. Is it a real requirement? Yes, because a theory that dissolves the concept entirely fails to account for the *phenomenon* of truth talk.

  4.  **Drafting the Content - Section by Section:**

