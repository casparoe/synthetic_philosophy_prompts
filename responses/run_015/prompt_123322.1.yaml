      *   **Specific Goals for Truth:** (a) Compositional semantics (infinity of sentences), (b) Epistemology (belief aims at truth). *Explicitly excludes:* explaining scientific success.
      *   **Specific Cases to Address:** Archive blurb (generalization/unknown content), Handover note (logical consequence/transmission), Recanting memo (blind falsity ascription), Weather model (approximate truth/degrees), Soup (faultless disagreement/domain sensitivity).
      *   **Specific Flags/Constraints:**
          1.  Identify incompatibilities between desiderata (specifically problematic for deflationists, not just general Liar problems).
          2.  Address the "Scope Worry" (minimalism about truth vs. minimalism about ethics/action).
          3.  Clarify Conservativeness (desideratum vs. symptom).
          4.  Identify the single most eliminative requirement.
          5.  Score four theories (Minimalism, Correspondence/Inflationary, Warranted Assertibility, Pluralism) against the list (table format).
          6.  Address the "saying something vs. shrugging" worry.
      *   **Tone:** Academic but accessible, tailored to a 3rd-year undergrad (knows equivalence schema, Liar, etc.), concise (don't sprawl on the table), critical (distinguish genuine requirements from partisan wants).
      *   **Word Count:** The user has 2500 words for *their* essay. My response should be comprehensive enough to guide them but not write the essay for them. It needs to be dense and high-value.

  2.  **Deconstruct the Desiderata (The "Spec"):**

      *   *Core Deflationary Commitment:* Truth isn't a robust property. It's a logical device.
      *   *Requirement 1: Generalization (The Archive Blurb).* Deflationists say truth is a device for infinite conjunction/disjunction. The archive case tests this when content is *unknown* or *untranslatable*.
      *   *Requirement 2: Logical Embedding/Consequence (The Handover Note).* Truth must interact with logic. If $P$ is true and $P \to Q$, is $Q$ true? Deflationists need to explain validity without truth doing heavy lifting.
      *   *Requirement 3: Blind Ascription (The Recanting Memo).* Similar to generalization but reflexive. Can I say "Something I said is false" without knowing which?
      *   *Requirement 4: Compositionality/Semantics (User Goal A).* Tarski-style T-sentences aren't enough for a full semantics. Deflationists need to show how truth conditions compose without invoking robust correspondence.
