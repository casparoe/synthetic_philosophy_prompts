answer: |-
  # Cooperative Staffing Decision Procedure

  This procedure is designed to help your energy cooperative decide between **Election** (voting for candidates) and **Sortition** (random selection by lot) for staffing decision-making bodies. It prioritizes reducing capture (insider control) and ensuring the selection method matches the body's function.

  ## The Decision Procedure

  Follow these five questions in order. At each step, check if a "Stop Condition" is met. If not, proceed to the next question. If factors conflict at the end, a Values Judgment is required.

  ### 1. What is the body's primary purpose?
  *   **Sufficient Answer:** Define whether the body is **Adjudicative** (judging facts/rules between parties), **Representative** (setting policy/voting on behalf of members), or **Administrative/Negotiative** (executing tasks or deals).
  *   **Stop for Pure Sortition:** If **Adjudicative**. (Like a jury, the goal is impartial judgment, not responsiveness to voters.)
  *   **Stop for Election:** If **Representative**. (The goal is to mirror member will; accountability is required.)
  *   **Continue:** If **Administrative/Negotiative**. (Proceed to Question 2.)

  ### 2. How high are the organizational stakes?
  *   **Sufficient Answer:** Assess whether failure would threaten the cooperative's solvency or long-term mission (**High/Existential**) versus causing temporary inconvenience or limited financial loss (**Low/Moderate**).
  *   **Stop for Pure Sortition:** If **Low/Moderate**. (Risk is manageable; benefits of random selection outweigh competence risks.)
  *   **Continue:** If **High/Existential**. (Requires further scrutiny on expertise and capture.)

  ### 3. How much specialized expertise is genuinely required versus learnable?
  *   **Sufficient Answer:** Distinguish between **Technical/Legal** (requires years of training, e.g., contract law, grid engineering) and **Contextual/Moral** (learnable via briefing, e.g., community values, factual dispute resolution).
  *   **Stop for Election:** If **Technical/Legal** expertise is strictly required to function safely. (Random members cannot safely learn this in time.)
  *   **Continue:** If **Contextual/Moral** or learnable with support. (Proceed to Question 4.)

  ### 4. How vulnerable is the selection to insider capture or campaigning bias?
  *   **Sufficient Answer:** Estimate if the role is likely to be sought by cliques, funded interests, or popular personalities (**High Vulnerability**) versus being obscure or undesirable (**Low Vulnerability**).
  *   **Stop for Pure Sortition:** If **High Vulnerability**. (Elections will likely reproduce existing power imbalances.)
  *   **Continue:** If **Low Vulnerability**. (Proceed to Question 5.)

  ### 5. Is ongoing accountability to the membership essential?
  *   **Sufficient Answer:** Determine if the body must be removable or responsive to member feedback during their term (**Essential**) versus needing independence to make unpopular but correct decisions (**Independent**).
  *   **Stop for Election:** If **Essential**. (Members need a mechanism to recall or vote out representatives.)
  *   **Stop for Pure Sortition:** If **Independent**. (Members should not pressure the body; impartiality is key.)
  *   **Hand to Values Judgment:** If factors from previous steps conflict (e.g., High Expertise required [Election] but High Capture Risk [Sortition]). The facts do not settle this; the cooperative must weigh competence against legitimacy.

  ---

  ## Evaluation: The "Shadow Panel" Mechanism

  You proposed a "shadow panel" of randomly selected observers who attend deliberations but do not vote.

  *   **Verdict:** This mechanism **improves legitimacy** only under specific conditions; otherwise, it adds noise.
  *   **Conditions Where Helpful:**
      1.  **High Capture Risk + High Expertise:** When you must elect experts (to ensure competence) but fear they will be captured by outsiders (e.g., utility companies). The shadow panel acts as a watchdog without vetoing technical decisions.
      2.  **Transparent Deliberations:** When the body's work is not confidential. Observers verify that process was followed.
  *   **Conditions Where Harmful:**
      1.  **Confidential Negotiations:** If the body discusses legal strategy or private data, observers create liability and chill honest speech.
      2.  **Low Stakes:** If the body's work is routine, the administrative burden of briefing observers outweighs the benefit.
      3.  **Performative Pressure:** If observers begin to influence the voting members informally, creating a two-tier power structure without accountability.

  ---

  ## Application to Proposals

  ### Case 1: Solar-Installation Dispute Panel (3 persons)
  *   **Purpose:** Adjudicative (judging facts/rules between neighbors).
  *   **Stakes:** High personal, Low organizational.
  *   **Expertise:** Learnable (rules provided, facts presented).
  *   **Capture:** High (neighbors may campaign or pressure).
  *   **Accountability:** Independent judgment needed.
  *   **Procedure Result:** **Pure Sortition.** (Stops at Question 1).
  *   **Instinct Conflict:** **Yes.** Cooperatives often instinctively want to elect "respected elders" or experienced members to judge disputes. This procedure recommends random selection (jury model) to ensure impartiality.
  *   **Unresolved Issue:** The procedure cannot resolve the *perception* of legitimacy. Members may trust a known elder more than a random neighbor, even if the random neighbor is less biased. This is a cultural hurdle, not a procedural one.

  ### Case 2: City Utility Contract Team (5 persons)
  *   **Purpose:** Negotiative/Administrative.
  *   **Stakes:** High (10-year commitment, organizational survival).
  *   **Expertise:** High Technical (legal, energy markets).
  *   **Capture:** High (utility company lobbying).
  *   **Accountability:** Mixed (need mandate, but need flexibility).
  *   **Procedure Result:** **Values Judgment.** (Expertise says Election; Capture says Sortition).
  *   **Recommendation:** **Election with Shadow Panel.** Elect members with relevant skills (or appoint them) to ensure competence, but use a random shadow panel to monitor for capture during negotiations.
  *   **Instinct Conflict:** No. Instinct aligns with the need for expertise.

  ### Case 3: Regional Alliance Representatives (2 persons)
  *   **Purpose:** Representative (voting on shared policy).
  *   **Stakes:** Medium/High (policy direction).
  *   **Expertise:** Political/Strategic.
  *   **Capture:** Medium.
  *   **Accountability:** **Essential.** They vote on behalf of the co-op.
  *   **Procedure Result:** **Election.** (Stops at Question 1 or 5).
  *   **Instinct Conflict:** No. Instinct aligns with the need for a mandate.

  ---

  ## What This Procedure Is Not Designed To Do
  1.  **Guarantee Competence:** Sortition selects for representation, not skill. Training is still required.
  2.  **Solve Cultural Cliques:** Random selection breaks formal capture, but informal social pressure can still influence randomly selected members.
  3.  **Replace Conflict Resolution:** It selects the *people*, but does not provide the rules for how they should decide.
  4.  **Account for Volunteer Burnout:** Random selection may pick members who are already overworked; the procedure assumes a pool of willing participants.

