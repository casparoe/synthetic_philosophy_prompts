      *(Self-Correction on Confidence)*: I should integrate the confidence rating naturally or as a specific section. The prompt asks "Also say how confident you are... and flag the bit you're least sure of." I will put this as a distinct section at the end for clarity.

      *(Refining the "Least Sure" bit)*: The hardest prediction is the counterfactual: "If we dropped the requirement, what would actually happen to accountability?" Would it vanish, or would it force stricter code auditing? I'm least sure about the *net social outcome* of removing the human.

