          *   *Pragmatist (P):* Finite precision is ontic/physical (thermal noise, quantum limits). Chaos makes systems behave *as if* random. Determinism is empirically empty/metaphysical baggage.
      *   **Key Requirements:**
          *   Both must be competent and responsive (no strawmanning).
          *   SD must address Poincaré's discovery in celestial mechanics (the birthplace of chaos).
          *   One must bring up the *Shadowing Lemma* (noisy trajectories shadow true trajectories).
