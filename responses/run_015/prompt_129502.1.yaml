answer: |-
  Good morning. Looking around this room, I see we have a bit of a divide. On one side, we have people who can parse Cato's subjunctives without blinking. On the other, we have people who manage billion-dollar portfolios and think Cicero was a type of salad dressing. That is exactly where we need to be. If we were all classicists, we'd spend two days arguing about textual variants. If we were all bureaucrats, we'd spend two days arguing about KPIs. We need both to talk about why things rot.

  We are here to discuss institutional senescence. And since we're talking about old age, we have to start with the text that defines the Western conversation on it: *De Senectute*. Now, a quick note on authorship, just to keep the classicists from throwing chalk at me. You are right that it isn't quite Cicero's own voice. It is Cato the Elder speaking, framed by Cicero. It's Cato's stoicism filtered through Cicero's rhetoric. Knowing that matters, because Cato is arguing from a place of natural law. He is trying to prove that aging isn't a defect, but a feature of a life well-lived.

  I want to take Cato's four main defenses against the charges of old age and run them against our subject: not human beings, but long-lived institutions. Museums, universities, regulatory bodies. We often talk about these entities as if they are organic—they are "born," they "mature," they "die." But when we apply Cato's logic to them, the analogy holds just long enough to show us where it breaks. And where it breaks is where the real governance work begins.

  Cato addresses four accusations leveled against old age. Let's take them one by one.

  The first charge is that old age withdraws us from active affairs (*abducit a rebus gerendis*). Cato's rebuttal is famous: the old man doesn't row the ship; he steers it. Physical vigor is replaced by counsel and wisdom. The young do the work; the old provide the direction.

  Does this hold for institutions? Superficially, yes. We expect old universities to stop chasing every trend and instead provide stable wisdom. We expect regulatory bodies to stop reacting to every market fluctuation and provide steady oversight. But here is the first break in the analogy. A human being has a mind that is distinct from their muscles. You can lose the muscles and keep the mind. An institution *is* its structure. Its "body" is its bureaucracy, its funding lines, its HR policies. When an institution loses its vigor—when it stops being able to execute—it doesn't necessarily retain a pure "mind" of wisdom to guide others. Often, when the execution fails, the wisdom evaporates with it. An institution that can't act doesn't become a sage; it becomes a monument. Cato assumes the mind survives the body. For institutions, the mind is embedded in the body. When the body fails, the mind goes dark.

  The second charge is that old age weakens the body. Cato argues that you must exercise what you have. Use it or lose it.

  For an institution, "weakness" looks like sclerosis. Processes slow down. Risk aversion spikes. But Cato's defense relies on individual agency. I can choose to walk today. I can choose to read. An institution cannot "choose" to exercise unless its governance allows it. This is where the bureaucratic folks in the room know the pain. You can't just tell a museum to "exercise." You have to change the board composition, the funding model, the legal mandate. Cato treats vigor as a moral duty of the individual. For an institution, vigor is a design specification. If the design doesn't allow for renewal, the weakness isn't a moral failing of the institution; it's a failure of the architects who built it.

  The third charge is that old age deprives us of pleasures. Cato's response is the most stoic: good riddance. Pleasures are distractions. Old age frees you to focus on what matters.

  Translate this to institutions. What are an institution's pleasures? Maybe it's the thrill of discovery, the risk of a new exhibit, the agility of a startup grant. If an institution loses these, is it freed to focus on its core mission? Or is it just bored? Here, the analogy gets dangerous. If we accept Cato's view, we might excuse a stagnant university by saying, "Well, it's past the age of innovation; now it focuses on preservation." That sounds noble. But unlike a human, an institution doesn't have a soul to sustain it through the loss of joy. It runs on energy. If you strip an institution of the "pleasures" of innovation and risk, it doesn't become wise. It becomes a warehouse. Cato argues pleasure is a trap. For institutions, pleasure—mission drive—is the fuel. Taking it away doesn't purify the institution; it starves it.

  This leads to the fourth and most critical charge: that old age brings death near. Cato argues that death is natural. It is the end of a journey that has been completed. To fear it is childish. Nature is our guide.

  This is where the analogy completely collapses. And this is the philosophical work I want us to do over the next two days. Human death is biological. Institutional death is political.

  When a person dies, it is because their body gave out. When a museum dies, it is because a city council voted to cut funding. When a university closes, it is because enrollment dropped or endowment management failed. There is no biological clock ticking inside a regulatory body. There is only a budget line.

  Cato comforts himself with the idea that nature dictates the end. But institutions have no nature. They have charters. They have mandates. They have stakeholders. When we talk about institutional senescence, we often use biological language to hide political decisions. We say an agency is "too old to function" when what we mean is "we no longer want it to function." We say a museum has "completed its lifecycle" when actually the donors lost interest.

  If we accept Cato's framework uncritically, we risk naturalizing decay. We start treating institutional failure as inevitable, like gravity. We say, "Oh, every bureaucracy gets slow eventually, that's just aging." But if institutional death is political, then senescence is too. It is a choice. It is a result of governance structures that prioritize stability over adaptation, or legacy over mission.

  So, where does this leave us?

  For the classicists here: I know I've just dragged Cato through a modern management seminar. But I think he'd appreciate the rigor. He argued that old age is only a burden if you haven't lived virtuously. If you haven't governed virtuously, institutional age is definitely a burden.

  For the practitioners: You are not dealing with biology. You are dealing with design. When you see an institution slowing down, do not ask "how do we treat the aging?" Ask "who decided this structure was permanent?"

  Cato's defenses work for humans becuase humans are bound by nature. We cannot choose to live forever. But institutions can be reborn. They can be merged, split, defunded, or reinvented. Their death is not a natural endpoint; it is a policy option.

  Over the next two days, I want us to resist the comfort of the biological metaphor. Don't let yourselves off the hook by calling decay "natural." If an institution is dying, it isn't because time passed. It's because we stopped making the choices that keep it alive. Cato says we must follow nature. Our job is harder. We have to follow purpose. And purpose doesn't age unless we let it.

  Thank you.
