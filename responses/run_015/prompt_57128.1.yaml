  First brainstorm out loud for a few sentences about where the essay's real crux sits, then give me:

  1. The question, answerable in about 45 minutes, that turns on whether critical history is self-undermining. My hunch for the crux: the third species tells you to put the past on trial and carry out the sentence, but the judge is himself a product of the lineage he's condemning, and forgetting / the unhistorical is supposed to be a precondition of being able to act at all. So does Nietzsche have a non-circular escape, or does the whole edifice reduce to "whatever a sufficiently strong plastic power can digest counts as healthy"? The question has to force a verdict rather than a survey.

  2. A model answer, 450 words max.

  3. A marking scheme out of 20, as a table with columns: move / marks / the charcteristic way students blow it. That last column should name real confusions, e.g. reading the piece as "history is fine in moderation" or as a philosophy-of-history methods paper, or importing the will to power from the later books.

  Whole response under 950 words, no preamble, question first. Don't put anything in quotation marks unless you're certain of the wording — paraphrase instead.
