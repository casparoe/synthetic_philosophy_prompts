answer: |-
  The earning-to-give strategy relies on a specific optimization logic: choose the career that maximizes your capacity to donate, weighted by the counterfactual impact of your labor. In practice, this optimization is governed by measurability bias. To justify a career path within an effective altruism framework, you need to demonstrate that your specific contribution led to a specific unit of good. This requirement for legibility creates a blind spot that systematically devalues structural maintenance.

  This is the Ledger Problem. When moral obligation is framed as an individual balance sheet, every action requires an owner. You need to be able to write your name next to the outcome on an audit sheet. But the work that keeps institutions functional—bureaucratic upkeep, cultural stewardship, conflict resolution, long-term governance—rarely has a single author. These are collective goods. They are the invisible infrastructure that prevents organizational decay. Because no single individual can claim credit for preventing a collapse that never happened, this work does not register on the moral ledger.

  Consequently, high-agency individuals drawn to earning-to-give are incentivized to flee these roles. They gravitate toward careers where impact is atomized and attributable: quantifiable trading, discrete tech projects, or direct interventionism. They leave behind the unglamorous work of institutional care.

  This makes the strategy self-defeating. Earning-to-give assumes the existence of robust, effective institutions capable of absorbing capital and deploying it wisely. But by filtering career choices through the Ledger Problem, the movement drains the very talent pool required to maintain those institutions. You end up with well-funded organizations that are structurally hollow, run by fewer people capable of doing the unmeasurable work of governance and maintenance. The money remains, but the capacity to use it effectively erodes. The logic of individual attribution undermines the collective infrastructure required for the attribution to matter in the first place.
