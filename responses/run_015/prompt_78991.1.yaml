answer: |-
  ### Exam Question

  **Question 1 (25 Marks)**

  Consider two housemates, Priya and Quill, who must decide on two continuous variables: the use of a spare room (ranging from 100% Music Studio to 100% Home Office) and the household food rule (ranging from 100% Strictly Vegan to 100% Anything Goes). Priya places high value on the Room and negligible value on Food; Quill places high value on Food and negligible value on the Room.

  Write an essay that addresses the following five points in order:

  1.  Demonstrate why a "package deal" (where each agent gets their preferred outcome on their high-value issue) strictly dominates a "meet-in-the-middle" compromise (50/50 split on both issues) in terms of Pareto efficiency.
  2.  Contrast this with a single-issue zero-sum division. Explain why, in the one-issue case, no compromise can constitute a Pareto improvement over the status quo, and what this implies for the slogan that "compromise creates mutual gain."
  3.  Identify the exact structural feature of the two-issue case that enables mutual gain without requiring interpersonal comparisons of utility.
  4.  Introduce a "sacred value" constraint: suppose Priya holds a lexicographic preference that the Room *must* be at least 90% Studio. Explain whether this kills the possibility of gains from trade or merely narrows the contract curve.
  5.  Compare the "meet-in-the-middle" heuristic against a social welfare function that maximizes the weighted sum of value functions. Which is analogous to genuine gains from trade? Explain the role of convexity in determining whether the weighted-sum solution yields a stable compromise or a corner solution.

  ***

  ### Model Answer

  The intuition that compromise yields mutual gain relies on the structure of the negotiation space, not merely the act of splitting differences. In the two-issue scenario involving Priya and Quill, the "package deal" dominates the "meet-in-the-middle" approach because it exploits differences in marginal valuation. If Priya receives 100% control of the Room and Quill receives 100% control of the Food rule, both agents achieve their primary objectives. Since Priya values the Room significantly more than the Food rule, and Quill vice versa, the utility loss Priya incurs from conceding on Food is negligible compared to her gain on the Room, and symmetrically for Quill. A 50/50 split on both issues forces each to incur a substantial utility loss on their high-priority issue to gain something they value little. Thus, the package deal is a Pareto improvement over the split-the-difference compromise; the latter leaves gains from trade unexploited.

  This stands in sharp contrast to a single-issue zero-sum case, such as dividing a fixed sum of money. Here, the utility possibility frontier is a straight line with a slope of -1 (assuming risk neutrality). Any movement away from the status quo that benefits one party necessarily harms the other. In this context, "compromise" is merely a distributional choice, not an efficiency gain. The slogan that "compromise creates mutual gain" is therefore false in zero-sum contexts; it holds only when there are multiple dimensions with differing marginal rates of substitution (MRS).

  The structural feature enabling mutual gain in the two-issue case is the **divergence in Marginal Rates of Substitution** between the agents. Priya's MRS of Room for Food is high; Quill's is low. Trade is possible because they value the marginal units of the issues differently. Crucially, this requires no interpersonal comparison of utility. We do not need to know if Priya's joy from the Studio is "greater" than Quill's joy from Meat. We only need to know that Priya values the Room *relative to Food* more than Quill does. The gains arise from reallocating goods to those who value them marginally higher, observable through their willingness to trade, not through comparing cardinal utility units.

  However, the introduction of sacred values complicates this. If Priya holds a lexicographic preference that the Room must be $\ge$ 90% Studio, her indifference curves become L-shaped or discontinuous at that threshold. This does not necessarily kill compromise, but it truncates the contract curve. If Quill's preferences are standard, trade is still possible provided the 90% threshold leaves enough room for Quill to gain on the Food issue. However, if both agents hold sacred values on the *same* issue (e.g., Quill demands the Room be $\le$ 10% Studio), the feasible set of agreements becomes empty. Sacred values narrow the scope for trade by rendering portions of the issue space infinitely costly, potentially eliminating the lens of mutual improvement entirely if the constraints overlap.

  Finally, we must distinguish between "meet-in-the-middle" and maximizing a weighted sum of value functions. The "meet-in-the-middle" heuristic operates on the *issues* (50% Room, 50% Food), ignoring preference intensity. It is arbitrary and often inefficient. Maximizing the weighted sum of value functions ($W = \alpha U_P + \beta U_Q$) is analogous to genuine gains from trade because it seeks a point on the Pareto frontier where the weighted marginal utilities are equalized. The role of convexity is critical here. If preferences are strictly convex (diminishing marginal returns), the weighted-sum maximization yields a unique, stable interior solution. If preferences are linear or concave (as implied by the "package deal" corner solution), the weighted sum pushes the solution to the corners. In the Priya/Quill case, the "package deal" is a corner solution driven by high intensity differences. Convexity ensures that if a compromise *is* reached, it is stable; without it, the weighted sum method confirms that the efficient outcome is indeed the specialized package deal, not the arbitrary midpoint. Thus, gains from trade are realized by maximizing weighted welfare, not by splitting issues.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Package Deal vs. Meet-in-the-Middle (5 Marks)**
  *   **5:** Clearly explains that splitting issues ignores intensity. Shows package deal allows each to secure high-value good while conceding low-value good. Explicitly uses Pareto terminology (one is better off, neither worse off).
  *   **3:** Argues package deal is better but relies on vague "happiness" claims without referencing the trade-off structure.
  *   **0:** Claims compromise is always better or fails to distinguish the two outcomes.
  *   *Common Pitfall:* Assuming "fairness" (50/50) equals efficiency.

  **2. One-Issue Zero-Sum & The Slogan (5 Marks)**
  *   **5:** Identifies one-issue case as zero-sum/constant-sum. States clearly that no Pareto improvement is possible from the status quo. Concludes the slogan is context-dependent, not universal.
  *   **3:** Identifies zero-sum nature but fails to explicitly link it to the impossibility of Pareto improvements.
  *   **0:** Claims compromise always creates value regardless of issue count.
  *   *Common Pitfall:* Confusing "agreeing to disagree" with Pareto improvement in a zero-sum game.

  **3. Structural Feature & Interpersonal Comparison (5 Marks)**
  *   **5:** Identifies Divergent Marginal Rates of Substitution (or differing intensities/marginal valuations). Explicitly states this avoids interpersonal utility comparisons (ordinal vs cardinal).
  *   **3:** Identifies differing preferences but claims we need to know who is "happier" (interpersonal comparison).
  *   **0:** Vague reference to "different wants."
  *   *Common Pitfall:* Invoking utilitarianism to justify the trade rather than mutual advantage.

  **4. Sacred Value / Lexicographic Wrinkle (5 Marks)**
  *   **5:** Correctly identifies lexicographic preferences as constraints/thresholds. Explains this narrows the feasible set (contract curve) rather than automatically killing trade, unless constraints conflict directly.
  *   **3:** States sacred values make trade impossible (too absolute) or ignores the constraint entirely.
  *   **0:** No engagement with the wrinkle.
  *   *Common Pitfall:* Treating sacred values as just "strong preferences" rather than lexical constraints.

  **5. Weighted Sum vs. Midpoint & Convexity (5 Marks)**
  *   **5:** Identifies Weighted Sum as the efficiency analog. Explains Midpoint is arbitrary. Correctly identifies Convexity's role: ensures stability/uniqueness of interior solutions, or explains that lack thereof (linearity) justifies the corner solution (package deal).
  *   **3:** Identifies Weighted Sum as better but gives a weak or incorrect definition of convexity's role (e.g., "it makes math work").
  *   **0:** Equates Midpoint with Weighted Sum.
  *   *Common Pitfall:* Confusing convexity of preferences with convexity of the feasible set, or failing to link convexity to the corner-vs-interior solution.
