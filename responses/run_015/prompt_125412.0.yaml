answer: |-
  **Project Title:** The Two-Register Model: Provenance Evidence and the Structure of Epistemic Revision

  **Project Summary**
  This project addresses a structural impasse in the epistemology of higher-order evidence (HOE). The current debate oscillates between conciliationism (revise first-order credence in light of HOE) and steadfastness (maintain first-order credence). Both positions share a "single-target assumption": that HOE must be absorbed by revising the first-order credence itself. This generates a dilemma: conciliationism risks severing the link between credence and first-order evidence, while steadfastness entails epistemic akrasia (believing *p* while believing one's belief is unreliable). I propose a third structure: a Two-Register Model. On this view, the agent maintains an unrevised first-order credence tracking first-order evidence, while a separate "calibration index" tracks higher-order information regarding the *provenance* of that evidence. This index, rather than the credence, governs action, assertion, and inquiry. This fellowship will support nine months of work to formalize this model, distinguish it from existing views, and determine whether it constitutes a genuine normative alternative or a notational variant.

  **The Philosophical Problem**
  The central question is determinate: *In cases of provenance evidence, is the rational response to revise the doxastic attitude toward the proposition, or to revise the doxastic attitude toward the process while maintaining the proposition-specific attitude?*

  Existing positions leave this open because they treat the doxastic state as monolithic. Conciliationism demands a single revised credence that incorporates both first-order and higher-order evidence. Steadfastness demands the first-order evidence dominate. However, a specific species of HOE—*provenance evidence*—resists this binary. Provenance evidence indicates that the total evidence available to the agent was selected in a way correlated with the truth, without necessarily indicating that the reasoning process is unreliable.

  Consider a grader who forms confident verdicts on forty essays, then learns the batch was selected from a pool of "borderline" cases. This is not evidence that the grader's reasoning is flawed (reliability-undermining); it is evidence that the sample is unrepresentative. Conciliationism demands lowering confidence in each verdict, but there is no determinate amount by which to lower it without base rates the agent lacks. Steadfastness demands maintaining confidence, ignoring the selection bias. Both fail. The Two-Register Model proposes that the grader keeps the verdict-credence intact (preserving the read on the specific evidence) but attaches a high "calibration risk" index that suspends the practical consequences of that credence (e.g., submitting grades) until further evidence is gathered.

  **The Collapse Objection and Discriminating Test**
  The primary risk is that the Two-Register Model collapses into existing positions. If the calibration index dictates action exactly as a revised conciliationist credence would, the model is merely conciliationism with extra steps. If the index is inert, it is steadfastness. If the split merely indicates a permission to choose either, it is permissivism.

  To prevent this, the project will employ a specific **Collapse Test**: *The Reversibility Condition.*
  In the Two-Register Model, the first-order credence is preserved in a "suspended" state. If the higher-order evidence is later defeated (e.g., the grader learns the selection bias report was false), the agent can revert to the original credence immediately. In conciliationism, the original credence is destroyed by revision; reverting requires re-deriving the belief from first-order evidence, which may be cognitively inaccessible or costly.

  **Discriminating Case:** The project will construct a case where an agent receives provenance evidence, then receives a defeater for that provenance evidence *before* gathering new first-order evidence.
  *   *Conciliationist Prediction:* The agent must remain at the revised (lowered) credence until they re-process the original evidence, as the rational state is a function of total current evidence.
  *   *Two-Register Prediction:* The agent snaps back to the original credence because the first-order register was never revised, only gated.
  If the Two-Register model cannot justify this "snap-back" normatively without ad hoc stipulations, it collapses into conciliationism. If it can, it occupies distinct logical space.

  **Nine-Month Work Plan**
  *   **Months 1–2: Formalization and Taxonomy.** Rigorously define "provenance evidence" versus "reliability-undermining evidence." Develop a formal schema for the Two-Register Model, distinguishing the update rules for the Credence Register versus the Calibration Index.
  *   **Months 3–5: Case Construction and Testing.** Develop the "Discriminating Case" described above. Test the model against standard counterexamples in the HOE literature (e.g., peer disagreement, drug cases) to map the boundary conditions where the model applies.
  *   **Months 6–7: Objection Handling.** Address the Collapse Objection head-on. Engage with decision-theoretic objections: if the Index governs action, is it not just a second credence? Refine the functional role of the Index to ensure it is not merely a probability assignment.
  *   **Months 8–9: Synthesis and Writing.** Draft the chapter. Integrate the findings into the broader dissertation argument. Prepare the stand-alone fellowship paper.

  **Possible Conclusions and Deciding Considerations**
  1.  **Strong Success:** The model survives the Collapse Test. Provenance evidence requires a distinct doxastic structure. *Decision:* This becomes the core chapter of the dissertation.
  2.  **Moderate Success:** The model works but is reducible to a specific form of imprecise probabilism (where the Index represents a widening of the credal interval). *Decision:* The chapter shifts to arguing for imprecise probabilism in HOE contexts.
  3.  **Failure:** The Reversibility Condition proves unjustified, or provenance evidence turns out to be reducible to reliability evidence. *Decision:* The chapter pivots to a negative result demonstrating the inevitability of the conciliationism/steadfastness dilemma for provenance cases.

  **Conditions for Failure**
  The chapter fails if: (1) The distinction between provenance and reliability evidence cannot be sustained under scrutiny; (2) The Calibration Index cannot be given a functional role distinct from action-guiding credence; or (3) The "snap-back" norm is shown to be irrational (e.g., it violates conditionalization).

  **Scope Assessment**
  While submitted as a chapter proposal, this project has the scope of a full thesis. The distinction between provenance and reliability evidence is under-theorized in the literature. If the Two-Register Model holds, it necessitates a restructuring of how HOE is categorized generally. However, for the purpose of the dissertation, it will be bounded as the solution to the "selection bias" subset of HOE cases, serving as the pivot point between the diagnostic chapters (the impasse) and the constructive chapters (application to social epistemology). This fellowship will fund the critical pivot: determining whether the third way is genuine or illusory.
