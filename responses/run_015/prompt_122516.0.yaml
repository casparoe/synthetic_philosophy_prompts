      *Drafting text:*
      For Locke, the identity of the person is forensic, anchored in the reach of consciousness rather than biological substance. In the case of the drunkard, Locke suggests courts punish the human organism because they cannot verify the discontinuity of consciousness. Applying this to the override-proof directive requires care. To enforce the directive based merely on the impossibility of proving discontinuity is to import a procedural rule of criminal liability into the metaphysics of authority. This reading is unfaithful. Authority, for Locke, requires actual continuity of self-concern and memory, not merely unverifiable discontinuity. If the demented woman truly lacks consciousness of her earlier signing, she is, strictly speaking, a different person. However, Locke might allow the directive to bind the *man* (the organism) for the sake of social order, even if the *person* has changed. I argue the analogy is a cheat: where punishment presumes identity to protect society, medical authority requires actual identity to respect autonomy. Without evidence that her consciousness reaches back, the earlier self's authority dissolves.

      Regarding inalienability, Locke denies humans arbitrary power over their lives because they are God's workmanship. This prohibits suicide and voluntary enslavement. Does the override clause constitute enslavement? It surrenders future volition to a past will. Here, the theological premise does the heavy lifting: one cannot alienate the power of self-preservation entrusted by God. However, a secular residue survives. Even without God, a Lockean must limit self-binding that destroys the capacity for rational agency. The override clause is permissible only if it serves preservation, not arbitrary whim. If the treatment sustains the organism without torture, it aligns with the duty of preservation. But if the demented self is content, overriding her refusal risks treating her as a mere vessel. The constraint is not theological per se, but structural: one cannot bind oneself to a condition where one becomes a thing rather than an agent. The override clause walks this line; it is valid only insofar as it protects the biological substrate required for any future return of reason.

