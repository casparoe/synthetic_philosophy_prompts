answer: |-
  This is a sophisticated stalemate that cuts to the core of how evolutionary biology functions as a historical science. Your diagnosis is closer to the philosophical consensus than your friend's, but the situation is more nuanced than a simple dichotomy between "methodology" and "empirics."

  Here is a diagnosis of the disagreement, an evaluation of the units-of-selection precedent, and an assessment of whether formal tools can dissolve the tension.

  ### 1. Diagnosis: Methodological Pluralism vs. Empirical Globalism

  The disagreement is primarily **methodological and heuristic**, but it persists because both sides treat it as an **ill-posed empirical question**.

  You are correct that the "naive Panglossian" position is a straw man nobody currently occupies. However, the debate has shifted from "Are all traits adaptations?" to "What is the appropriate null model for investigating trait history?"

  *   **The Adaptationist Stance (Methodological Adaptationism):** When an adaptationist says, "We should assume adaptation," they are not making a universal empirical claim that *all* traits are optimal. They are advocating for a **research strategy**. Their argument is that selection is the only known process that creates *functional design*. Therefore, treating "adaptation" as the working hypothesis is the most efficient way to uncover causal mechanisms. If you assume constraint first, you stop looking for function. They view the burden of proof as lying on the pluralist to demonstrate why selection *didn't* shape a trait that looks designed.
  *   **The Pluralist Stance (Empirical Adaptationism Critique):** When the pluralist pushes back, they are often making a global empirical claim disguised as a methodological caution. They argue that the "adaptive default" biases the sampling of nature. If you only look for adaptations, you will find them (confirmation bias), and you will systematically underestimate the prevalence of drift, phylogenetic inertia, and developmental constraint. They view the burden of proof as lying on the adaptationist to rule out non-adaptive hypotheses *before* claiming adaptation.

  **Why your friend is partially right:** There *is* an empirical fact of the matter regarding specific traits (e.g., is the human chin an adaptation or a spandrel?). However, her claim that there is a quantifiable "fraction of phenotypic structure" explained by selection is likely a **category error**. "Constraint" is not a causal force symmetrical to "selection." Selection is a process that filters variation; constraint is often the absence of variation or the boundary conditions of development. You cannot sum them into a pie chart where Selection + Drift + Constraint = 100% of Phenotype. Because the "global empirical question" is ill-posed, the debate inevitably retreats to methodology (your hypothesis).

  **Why you are mostly right:** The stalemate exists because the two sides have different **risk tolerances for error**.
  *   Adaptationists prefer to risk **Type I errors** (falsely attributing a trait to selection) because they believe missing a function is a greater sin in biology.
  *   Pluralists prefer to risk **Type II errors** (missing a genuine adaptation) because they believe falsely attributing function corrupts our understanding of evolutionary history.
  This is not a biological disagreement; it is a disagreement about **scientific aesthetics and resource allocation** (which questions are worth funding).

  ### 2. The Units-of-Selection Precedent: Why the Analogy Fails

  The units-of-selection debate (Gene vs. Individual vs. Group) is a powerful precedent, but it offers a warning rather than a solution.

  **How it was resolved:** The debate didn't end with one side winning. It dissolved when formal tools (the Price Equation, Contextual Analysis) showed that "unit of selection" was not a singular ontological category. The Price Equation demonstrated that selection can be mathematically partitioned into within-group and between-group components. Once biologists could calculate the covariance at different levels, the question changed from "Which unit is *real*?" to "At which level does the covariance between trait and fitness dominate in this specific system?"

  **Why it doesn't fully apply here:**
  1.  **Symmetry vs. Asymmetry:** In the units debate, group selection and individual selection are mathematically symmetrical (both are covariances between trait and fitness). In the adaptationism debate, "adaptation" (positive selection for function) and "constraint" (limits on variation) are **not symmetrical**. There is no "Price Equation for Constraint." You cannot easily partition a trait's variance into an "adaptive component" and a "spandrel component" because constraints often determine the *availability* of variance upon which selection acts, rather than competing with selection in the same equation.
  2.  **Local vs. Global:** The units debate was resolved by moving to local, quantitative cases (e.g., altruism in specific populations). The adaptationism debate keeps drifting back to global generalizations ("Is evolution mostly adaptive?"). Formal tools work well locally (e.g., measuring selection gradients on beak size) but cannot answer the global heuristic question ("Should we generally assume beak size is adaptive?").

  ### 3. Can Formal Decomposition or Conventions Resolve This?

  A formal decomposition of trait history (an "Adaptation/Constraint Partition") is unlikely to dissolve the dispute for the reasons stated above. However, **methodological conventions regarding null models** could reduce the heat, even if they don't solve the problem.

  **The Comparative Method Precedent:**
  Phylogenetic comparative methods (e.g., Brownian Motion vs. Ornstein-Uhlenbeck models) are the closest thing we have to a "Price Equation" for this debate.
  *   **Brownian Motion (BM):** Acts as a null model for drift/constraint (traits wander randomly).
  *   **Ornstein-Uhlenbeck (OU):** Acts as a model for adaptation (traits are pulled toward an optimum).
  When biologists fit these models to data, they can statistically reject BM in favor of OU.

  **Why this hasn't ended the debate:**
  1.  **Model Selection Bias:** OU models are notoriously prone to overfitting. They often "find" adaptation where there is none, validating the pluralist's fear of just-so stories.
  2.  **Interpretation:** Even if an OU model fits better, the adaptationist says "See, selection!" while the pluralist says "That optimum could be a developmental attractor, not a fitness peak." The math clarifies the pattern, but the *causal interpretation* remains contested.

  **A Proposed Convention:**
  Progress would look like a convention where **adaptation is treated as a specific hypothesis to be tested against a specific null model of constraint**, rather than a default assumption.
  *   *Current Adaptationist Practice:* Null = Randomness; Alternative = Adaptation.
  *   *Proposed Pluralist Practice:* Null = Phylogenetic Inertia/Constraint; Alternative = Adaptation.
  If the field adopted the latter convention (requiring adaptationists to demonstrate that a trait deviates significantly from phylogenetic expectation before claiming adaptation), the "just-so" risk decreases. However, adaptationists would argue this stifles discovery in cases where phylogenetic data is poor.

  ### 4. Principled Reasons for Persistence

  There is a principled reason to expect this dispute to persist: **Evolutionary Biology is a Historical Science with Incomplete Data.**

  In physics, you can often isolate variables. In evolutionary biology, you are inferring past processes from present patterns.
  *   **Equifinality:** The same phenotypic pattern (e.g., sexual dimorphism) can be produced by sexual selection (adaptation) or developmental decoupling (constraint).
  *   **The Problem of Negatives:** You can measure the strength of selection on a trait that exists. You cannot easily measure the strength of constraint on a trait that *never evolved*. Because the "constraint" side of the ledger relies heavily on counterfactuals (traits that *could* have evolved but didn't), it will always be harder to quantify than the "adaptation" side.

  Therefore, the adaptationist will always have the rhetorical advantage of pointing to something concrete (the trait), while the pluralist points to something absent (the missing variation). This asymmetry ensures the debate remains lively.

  ### Conclusion

  Your diagnosis is the stronger one. The debate is not about biology (everyone agrees on the mechanisms); it is about **epistemic risk management**.

  *   **Is it verbal?** Partially. It hinges on how broadly one defines "adaptation" (e.g., does "selected for" include "drifted to fixation because it was good enough"?).
  *   **Is it empirical?** Only locally. The global "fraction of phenotypic structure" question is likely meaningless.
  *   **Is it methodological?** Yes. This is the core. It is a dispute over the **default null hypothesis**.

  **Will it dissolve?** No. Unlike the units-of-selection debate, the categories here (Selection vs. Constraint) are not mathematically symmetrical, so a formal equation cannot render the question obsolete.

  **What counts as progress?** Progress will not come from a "Theory of Everything" that quantifies the adaptation/constraint ratio. It will come from **local methodological rigor**: the widespread adoption of phylogenetic null models that force adaptationists to demonstrate that a trait is *more* optimized than expected by drift and history alone. If your reading group wants to move forward, stop asking "Who is right about evolution?" and start asking "In this specific clade, what is the statistically justified null model: Brownian Motion or Ornstein-Uhlenbeck?" That shifts the argument from philosophy to model selection, which is where it can actually be won.
