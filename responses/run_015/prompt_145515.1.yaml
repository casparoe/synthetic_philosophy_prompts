prompt: |-
  You are an expert on Madhyamaka philosophy and Buddhist logic, especially Nāgārjuna's tetralemma and teh doctrine of emptiness. Before answering, please do a quick brainstorm: list teh main moves in teh dispute and flag any hidden assumptions. Then think step by step and adjudicate carefully.

  Two people in my studdy group got stuck in an arguement about applying teh catuskoti to dependent origination itself. Person A said that if every dharma lacks svabhāva, then teh relation of pratītyasamutpāda also lacks it, which means there's no actual grounding structure -- just emptiness stacked on emptiness with no bottom. She called this a 'recursive void' and said unless you allow one non-empty foundation you've collapsed into nihilism, so Madhyamaka must secretly rely on a non-empty 'emptiness of emptiness' that stops teh regress. Person B said thats wrong: emptiness isn't a positive entity that needs grounding, it's just absence of intrinsic nature. He said dependent origination works fine without svabhāva, like a dream that depends on other dream-elements, and that applying emptiness to itself doesn't create a hidden fifth position -- it just means teh absence applies to teh absence too. Then A came back: but if emptiness applies to itself, then teh claim 'all things are empty' is also empty, so it can't be conventionally true either; you've just made your own view self-undermining. B replied that Madhyamaka rejects intrinsic truth altogether, so teh claim is only a conventional upāya, not a thesis that needs protection. A said thats a cop-out -- you're insulating your view from criticism by declaring it 'not ultimately true' whenever it's pressed.

  They asked me to referee. Please go through their exchange move by move and rate each step: clearly wrong, partly right, or clearly right, with brief justification. In particular: is A right that self-application undermines teh view? Is B right that there's no regress problem? And are they both missing something about how teh tetralemma was designed to block exactly this kind of meta-position? Also say who's more right overall, but don't just declare a winner -- explain what each gets wrong, especially about whether 'emptiness of emptiness' is an exception or a self-consuming negation. Keep it philosophical, not historical -- no need for bibliographies or citations.
