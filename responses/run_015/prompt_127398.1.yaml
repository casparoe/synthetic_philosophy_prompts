          *   "Time dilation is mechanical delay/broken clocks": Defuse early when establishing 'c'. Emphasize it's about spacetime geometry, not mechanism.
          *   "This is just coordinate choice/Convention": Defuse during the RP argument phase. Emphasize that physical causality respects the light cone, but the "realness" of spacelike separated events is the crux.
      *   **Check Question:** Needs to test ontology. Not "what is time dilation?" but "If event X is in your future but my present, can I influence it? If not, is it real?" Or better: "If you accept SR, can you consistently hold that only the present exists?"
      *   **Omissions:** Metric signature (-+++ vs +---), Lorentz transformation derivations, General Relativity (gravity), synchronization conventions (Reichenbach) unless necessary (better to omit for 90 mins).

  3.  **Drafting the Content (Iterative Refinement):**

      *   *Sequence:*
          1.  Anchor: Light speed is constant for everyone. (Depends on: Nothing)
          2.  Consequence: Simultaneity is not absolute. (Depends on: Light speed)
          3.  Visualization: "Now" slices tilt with velocity. (Depends on: Simultaneity)
          4.  Argument: Rietdijk-Putnam (Andromeda). (Depends on: Tilting slices)
          5.  Ontology: Presentism vs. Eternalism. (Depends on: RP Argument)

      *   *Carrying Example:* The "Walking Past on the Street" (Andromeda) scenario. Two people pass each other. One walks towards Andromeda, one away. Their "now" planes intersect Earth but diverge at Andromeda by days/weeks.
