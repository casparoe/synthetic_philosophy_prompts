      *   Ensure `misconceptions` items have `belief`, `when_to_defuse`, `tactic`.
      *   Ensure `omissions` items have `topic`, `reason`.

  5.  **Review against Constraints:**
      *   "Don't explain the argument to me": I will describe the *teaching step*, not derive RP.
      *   "Humanities grads, zero physics": Keep math minimal, focus on logic and geometry.
      *   "Visceral": The Andromeda scenario is the most visceral for "now".
      *   "Dependency chain": Breaking simultaneity intuition MUST come before slicing.
      *   "JSON": Strict adherence.

  6.  **Final Polish:**
      *   Make sure the `depends_on` references match the `concept` strings or order IDs. Using order IDs is safer for JSON structure.
      *   Ensure the check question is a string.
      *   Ensure the tone is practical for a workshop leader.

