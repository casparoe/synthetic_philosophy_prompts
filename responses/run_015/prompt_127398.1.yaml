  2.  **Deconstruct the Physics/Pedagogy:**
      *   **Goal:** Prove/argue for Block Universe via Rietdijk-Putnam (RP).
      *   **RP Core:** If simultaneity is relative, and reality is what is simultaneous with "here-now" for some observer, then future events are real for some observer now. Therefore, future events are real.
      *   **Prerequisites:** To understand RP, participants must accept that simultaneity is relative (not absolute) and that this isn't just an illusion or measurement error.
      *   **Dependency Chain:**
          1.  Need to establish the constancy of the speed of light (c) as the anchor. Without this, simultaneity is absolute.
          2.  Need to show how "c" leads to relativity of simultaneity (RoS).
          3.  Need to show RoS implies different "now" slices for different velocities.
          4.  Need to argue that if slice A is real and slice B is real, and they differ, then the union (Block) is real.
      *   **Priority:** Breaking absolute simultaneity intuition *must* come before showing "now" slices depend on velocity. You can't have variable slices if there's a universal slice.
      *   **Carrying Example:** Train-and-lightning is too abstract/mechanical. Needs to be about *events* and *people*. The "Andromeda Paradox" (Penrose) is the standard RP example, but maybe too distant? Let's adapt it to be more visceral. Two people walking past each other on Earth, but their "now" slices diverge vastly at Andromeda. One sees an fleet launching, one sees a debate. This makes the "missing privileged present" visceral because human decisions (invasion vs. peace) hinge on it.
