  - The crossover computation: the prefix length at which S's dominant hypothesis switches from the hedged "skeleton plus i.i.d. noise" hypothesis to the deterministic composite, i.e. roughly where describing the noise generator becomes cheaper than encoding the residuals. Give the crossover n\*, and say how far above it your chosen n sits.
  - Which single feature of the case is doing the work.
  - Ablations, each with the recomputed verdicts: (a) replace the deterministic noise with genuinely i.i.d. Bernoulli noise of the same rate — I expect S to collapse onto T's hedged verdict and the direction disagreement to vanish; confirm or correct this; (b) set the noise rate to zero; (c) let P rank by fit instead of parsimony; (d) change P's criterion from "fewest parameters" to "shortest description," and say honestly whether P then just *is* S up to the machine constant.
  - The strongest attack available to a defender of the parsimony razor, delivered in its best form (the obvious one: you have crippled P's hypothesis space, since a real scientist would fit a noise model and be calibrated, and your noise rule is a plant — cheap for a program to express, invisible to any shortlist of ordinary laws). Answer it.
  - A check that the case does not contradict Solomonoff's convergence or error bound: say in your own words what that bound guarantees, and why S being certain and correct here is consistent with it rather than a counterexample.

  Write it as a finished section: the scenario, then the demonstration, then the diagnosis, then the objections. Be explicit wherever a number is doing real work, and flag every place where your conclusion depends on a convention or on a constant you cannot pin down.
