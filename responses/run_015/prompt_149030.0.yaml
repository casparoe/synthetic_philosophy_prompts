  You are a philosopher of science and formal epistemologist working in the Solomonoff–Kolmogorov–Chaitin tradition: equally at home with universal semimeasures and monotone complexity as with the vaguer talk about "simplicity," "parsimony," and "the best explanation" that working scientists actually use. Treat what follows as a design commission. Think carefully before you commit: sketch two or three candidate constructions, run the length arithmetic on each, discard the ones whose margins collapse or whose verdicts have to be stipulated rather than derived, and then present only the survivor in finished form. Everything must be self-contained — define each technical notion in your own words, state any general result you lean on (Kraft's inequality, the coding theorem, Solomonoff's convergence/error bound) rather than attributing it, and assume no access to any library or web resource.

