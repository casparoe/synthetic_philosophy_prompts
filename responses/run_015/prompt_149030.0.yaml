  **The setup.** A binary prediction problem. A single source, given as a short, actually-runnable program, generates an infinite binary sequence; you choose the observed prefix length n (I suggest 96 ≤ n ≤ 256) and the horizon (10 further bits). All three predictors below see the same prefix and are told only that the source is computable.

  1. **Predictor S — Solomonoff induction.** The universal mixture over lower-semicomputable semimeasures with prior weight 2^{-ℓ(p)} on a reference machine you specify well enough that instruction counts could in principle be checked; state your conditionalization convention (M(Db)/M(D) or the odds M(D0):M(D1)) and why the verdict does not hinge on it.
  2. **Predictor P — the parsimony razor.** A scientist who will only accept a *deterministic* law, chosen from an explicit shortlist of candidate laws you write out, ranked first by fewest free parameters/independent assumptions and only then by fit (number of matching bits); P predicts that law's next bit with probability 1.
  3. **Predictor T — the working statistician.** Fits within the parametric class {period-p skeleton corrupted by i.i.d. Bernoulli noise of rate r} using a stated penalized-likelihood rule, and predicts with the fitted probability.

  **The verdicts I want, at the step immediately after the prefix.**

  - **S** puts at least 0.99 on the bit that actually occurs.
  - **P** is certain of the bit that does *not* occur.
  - **T** favors the bit that does not occur, but is calibrated: it assigns the occurring bit a probability of at least 0.15, so that under log-loss its loss is finite while P's is infinite.

  So the direction disagreement is between S and the other two, and the confidence disagreement is between P and T. Report both 0–1 loss and log-loss for each predictor across the 10-bit horizon.

  **Design constraints.**

  - The source must be a *single* rule with no special-casing of the first n positions: I suggest a periodic skeleton (say, 1 iff n ≡ 0 mod p) XORed with a cheap deterministic "noise" process whose density is between 0.2 and 0.35, so that the skeleton is statistically visible in the data but the source is not periodic. The noise must be generated by a short rule — not a hardcoded table — and the rule should be one you can evaluate by hand for the first n+10 positions (a rule on the binary representation of n works well).
  - P's shortlist must *contain* the composite hypothesis "skeleton XOR [your noise rule]" so that the shortlist is not rigged by omission; P must still pick the pure skeleton, and the reason must be the parsimony ranking, not your say-so.
  - The step at which the predictions are compared must be one where the noise genuinely flips the skeleton; show that arithmetic explicitly (the binary expansion of n+1, the noise value, the skeleton value, the output).
  - Do not stipulate any complexity value. Every length comparison must follow from programs or schemas you exhibit, plus counting arguments where you need them (e.g. "a uniformly chosen k-bit parameter is incompressible to within a few bits with probability at least 1/2").
  - Exhibit the prefix in full if you can do so reliably; if you cannot, give the program, a table of the last sixteen positions, and the values for positions n+1 through n+10 computed explicitly. An honest small-n case beats a botched large-n one.

