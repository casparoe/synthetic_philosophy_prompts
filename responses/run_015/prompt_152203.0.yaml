      *   *Resolution:* In TMS, sympathy is how we judge. In WoN, self-interest is how we act. But we only act within the bounds approved by sympathy (justice). So (5) is slightly off. It's not that price signals *are* suppressed sympathy. It's that the *rules of the game* are sympathetic, the *moves* are self-interested.

      *   *The "Single Change":* Changing (4) to "Response-Dependent Realism" (or Quasi-Realism) is the cleanest fix. It aligns the ontology with the epistemology.

