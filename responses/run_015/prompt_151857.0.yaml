prompt: |-
  Two friends of mine — Rhys, who does something in theoretical stats, and Marta, who's in phil physics — ended up having a proper row in the kitchen after a seminar on objective chance last week, and they've both asked me to adjudicate. I took notes on my phone at the time and I honestly cant tell who's got the better of it, so I'm passing it on.

  Background they both accepted: Lewis's Principal Principle — roughly, that your credence in an outcome should line up with its objective chance, provided the rest of your evidence is "admissible", where the usual gloss is that admissible evidence is evidence whose bearing on the outcome comes entirely by way of the chances.

  The case they kept coming back to: a lab rig where the chance of an atom decaying by 3pm is set by a dial at noon; the dial is itself set by a fair coin, so right now, at 11am, the chance of decay is 0.5, and it'll end up being either 0.9 or 0.1. At 11am a note arrives from the lab, reliably, saying only: the chance at noon will be 0.9. Nothing about the dial, nothing about the coin, nothing about what actually happens.

  1. Marta: You should obviously go to 0.9. But the PP, as stated, says 0.5 — the present chance is 0.5, and a report about chances is about as admissible as evidence gets. So either the PP is false, or it's rescued only by the word 'admissible', and nobody's ever given a non-circular account of which evidence is admissible. The usual gloss is circular: it defines admissible evidence as the evidence that reaches you only via the chances, which helps itself to the very thing the principle was supposed to do. What's left is: believe the chances unless you've a reason not to. That's close to empty.

  2. Rhys: The fix isn't 'admissible', it's indexing to times. Chances are time-relative anyway. Read the PP as: match the chance that governs the outcome — the one in force over the period in which it happens — not the chance at the moment you happen to be thinking. Your evidence here includes a report on the noon chance, the chance governing the decay is 0.9, so 0.9. No circularity, and 'admissible' isn't carrying any weight in this case at all.

  3. Marta: Fine, granted — that sorts out that case. But it only sorts out evidence about chances. The PP still has to say something about evidence about outcomes: a crystal ball, a forecaster with a 99% track record, a text from the future. There the only move available is: inadmissible, ignore it, stay at the chance. And then the entire content of the principle sits in the line between admissible and inadmissible, which is precisely the line nobody can draw without circularity. 'Match the chances except when you shouldn't' isn't a principle, it's a placeholder.

  4. Rhys: There is a non-circular way to draw it, and it's causal: evidence is admissible iff it doesn't depend on the outcome — isn't causally downstream of it, doesn't counterfactually track it. The lab note reports a dial setting upstream of the decay, so admissible; the forecaster's report tracks the outcome, so inadmissible. And that isn't a fudge, because it gives the principle real bite: in a genuinely chancy world you can't get better-than-chance knowledge of a chancy outcome by any route that doesn't run through the chances. The forecaster case only feels like a counterexample because you're picturing a world the PP says can't exist.

  5. Marta: That last claim can't survive, and here's the case. Same rig, but the note says: the chance at noon will be 1. Everyone agrees information about future chances is admissible — that's the whole point of deferring to chances. But a chance of 1 just is the outcome. So the note hands you certainty about a chancy outcome in advance, by a route that isn't downstream of anything, and there's nothing incoherent about the set-up. So either you drop the 'no foreknowledge' claim, which was the bit that was meant to give the principle bite, or you say chances of 0 and 1 are somehow special, which is ad hoc. Neither is comfortable.

  6. Rhys: I'll drop it, partly — what I actually need is weaker: chances are the only channel, and your back-door case runs through chances, so it's consistent with that. Every substantive principle has a messy boundary; that's a research programme, not a refutation. And your case doesn't really describe a violation anyway: at 11am, before the note, 0.5 was the right credence, and once the note arrives the PP with time-indexing gets you to 1 on its own. There's nothing left over needing an explanation.

  Can you go through the six moves one at a time and tell me who's right about what — rating each move somewhere from clearly mistaken to clearly right, with a line or two of justification each — rather than just declaring an overall winner? And if they're both missing something, or both working with some shared assumption that's wrong, say what that is.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Evaluate a debate between two friends (Rhys, theoretical stats; Marta, phil physics) about Lewis's Principal Principle (PP).
      *   **Format:** Go through the six moves (3 each) one at a time. Rate each move (clearly mistaken to clearly right) with brief justification. Identify shared assumptions/errors if applicable.
      *   **Context:** The debate centers on the PP, admissibility, time-indexing, foreknowledge, and chance-1 events.
      *   **Tone:** Philosophical adjudication, balanced, technical but accessible (given the user took notes at a seminar).

  2.  **Deconstruct the Debate Moves:**

      *   **Background:** Lewis's PP: $C(A | Ch(A)=x \& E) = x$, provided $E$ is admissible. Admissible = evidence bearing on outcome only via chances.
      *   **Case:** Atom decay by 3pm. Dial set at noon (0.9 or 0.1) by fair coin. At 11am, chance is 0.5. Note arrives at 11am saying "Noon chance will be 0.9".
      *   **Move 1 (Marta):** PP fails or is circular. Note says future chance is 0.9. Current chance (11am) is 0.5. PP says match current chance (0.5). Intuition says match future chance (0.9). Admissibility definition is circular ("evidence that works via chances").
      *   **Move 2 (Rhys):** Fix is time-indexing. Match the chance *governing* the outcome (noon chance), not current credence time. Note reports governing chance. PP holds, admissibility not the issue here.
      *   **Move 3 (Marta):** Concedes Move 2 for chance-evidence. But PP needs to handle outcome-evidence (crystal balls). Standard move: call it inadmissible. This makes the whole principle rest on the admissibility line, which is circular/empty ("Match chances except when you shouldn't").
      *   **Move 4 (Rhys):** Admissibility isn't circular; it's causal/informational. Admissible = not causally downstream of outcome. Forecaster case implies impossible world (genuinely chancy world can't have foreknowledge not via chances). PP has bite.
      *   **Move 5 (Marta):** Counterexample to Rhys's causal story. Note says "Noon chance will be 1". Chance 1 = outcome certain. This is foreknowledge of outcome via chance, not downstream. PP either loses bite (foreknowledge allowed) or needs ad hoc exception for 0/1 chances.
      *   **Move 6 (Rhys):** Concedes point partly. PP doesn't ban all foreknowledge, just non-chance routes. Chance-1 is consistent with PP. Time-indexing handles the update. It's a research programme, not a refutation.

  3.  **Evaluate Each Move (Philosophical Assessment):**

      *   **Move 1 (Marta):** She identifies the "Initial Time" problem. Lewis's original formulation uses $Ch_t(A)$. If $t$ is 11am, $Ch_{11am}(Decay) = 0.5$. If evidence is "Ch_{noon}(Decay) = 0.9", does PP say $C = 0.5$ or $C = 0.9$? Lewis actually intended the chance function *at the time of the evidence* to be the guide, *unless* the evidence includes information about future chances. Marta is right that the *simple* gloss fails here. She is right that the standard gloss of admissibility is notoriously circular/problematic (Lewis admitted this).
          *   *Rating:* Mostly Right. (The circularity charge is standard literature, e.g., Hall, Hoefer).
      *   **Move 2 (Rhys):** Time-indexing the *chance* in the PP. Lewis actually distinguishes between the time of the chance and the time of the credence. The PP relates credence at $t$ to chance at $t$. However, if you have evidence about $Ch_{t'}$ where $t' > t$, Lewis says that evidence is *inadmissible* regarding the chance at $t$, but it *is* admissible regarding the outcome. Wait, Lewis's view: If you know the future chance, you should match the future chance. Why? Because $Ch_t(A)$ entails $Ch_{t'}(A)$? No. Lewis's solution to this specific "future chance" problem is that evidence about future chances is admissible *with respect to the outcome*, even if it overrides the present chance. Rhys's formulation ("match the chance governing the outcome") is a bit loose but captures the "Historical Chance" fix (Hoefer/Black). It's a standard repair.
          *   *Rating:* Mostly Right. (It's the standard "Historical Chance" or "Time-Slice" fix).
      *   **Move 3 (Marta):** The "Crystal Ball" objection. This is the core problem of admissibility. If PP says $C(A|Ch(A)=x \& E) = x$, and $E$ is "A will happen", then $C$ should be 1, but PP says $x$. So $E$ must be inadmissible. Marta argues this makes PP trivial. This is a strong philosophical point (Hall's "Two Concepts of Chance"). The definition of admissibility *does* do all the heavy lifting.
          *   *Rating:* Clearly Right. (This is the strongest philosophical objection to PP).
      *   **Move 4 (Rhys):** Causal account of admissibility. Evidence is admissible if not causally downstream. This is close to Lewis's "no information about future particular facts". However, Rhys claims a forecaster implies an impossible world. This is too strong. Compatibilists about chance and foreknowledge exist. But within a Humean/Lewisian framework, he's mostly right that *perfect* foreknowledge of chancy events is problematic. However, defining admissibility *purely* causally is tricky (what about logical correlations?). Still, a robust defense.
          *   *Rating:* Mostly Right. (Causal/informational constraint is the standard defense, though "impossible world" is a bit hyperbolic).
      *   **Move 5 (Marta):** The "Chance-1" problem. If $Ch(A)=1$, then $A$ happens. If I know $Ch(A)=1$, I know $A$. Is this inadmissible? If admissible, PP gives $C=1$. If inadmissible, PP gives $C=Ch$. But $Ch=1$. So $C=1$ either way. The issue is whether this counts as "foreknowledge" that violates the spirit of chance. Marta argues this breaks Rhys's "no foreknowledge" claim. She is right that Chance-1 collapses the distinction between chance and outcome. This is the "Problem of Probability 1".
          *   *Rating:* Clearly Right. (Chance 1 implies truth; knowing chance 1 implies knowing truth. This challenges the "no foreknowledge" motivation).
      *   **Move 6 (Rhys):** Concession. PP allows foreknowledge *via chances*. The principle is about the *route*. This is actually the correct Lewisian position. PP doesn't ban foreknowledge per se; it bans foreknowledge that *bypasses* chances. Chance-1 is just a limit case. Calling it a "research programme" is honest.
          *   *Rating:* Mostly Right. (Accurate retreat to the standard position).

  4.  **Identify Shared Assumptions/Errors:**
      *   **Assumption 1:** They treat "The Principal Principle" as a monolith. Lewis changed his mind (New Principle vs. Old Principle). They are debating the Old Principle (1980).
      *   **Assumption 2:** They assume "Chance" is a single, univocal concept. Humean vs. Primitivist views of chance change the admissibility conditions drastically.
      *   **Assumption 3:** They treat the "Note" as unproblematic evidence. In a Humean best-system account, can you have a note about future chances without it being derived from the laws + history?
      *   **Major Missing Piece:** The distinction between the *Old* Principal Principle (Lewis 1980) and the *New* Principle (Lewis 1994). The "future chance" problem (Move 1 & 2) was a major reason Lewis abandoned the original PP for the NP. Rhys is trying to patch the PP, but the literature largely moved to the NP or "Humean Objective Chance" (Hoefer).
      *   **Another Missing Piece:** The definition of "Chance". If chances are Humean (supervene on history), then future chances aren't independent facts. If they are primitivist, they are. This underpins the admissibility debate.

  5.  **Drafting the Response:**
      *   *Structure:* Introduction -> Move-by-Move Analysis (Rating + Justification) -> Shared Blind Spots/Conclusion.
      *   *Tone:* Impartial, knowledgeable, slightly conversational (matching the prompt's vibe).
      *   *Content:* Ensure the distinction between Old PP and New Principle is mentioned in the "Shared Assumptions" section, as that's the real technical resolution to Move 1/2. Ensure the "Chance-1" issue is contextualized (probability 1 doesn't always mean necessity, but in this context, it implies truth).

      *(Self-Correction during drafting)*: Wait, on Move 2, Rhys says "indexing to times". Lewis's original PP *was* time-indexed ($C_t(A | Ch_t(A)=x) = x$). The problem is evidence about $Ch_{t'}(A)$. Lewis classified evidence about future chances as *admissible* evidence about the outcome, even if it overrides present chance. Rhys's explanation is a bit muddled but the conclusion (match the 0.9) is correct under PP. I should note that Lewis actually classified future chance info as admissible *for the outcome*, which solves Move 1 without needing Rhys's specific "governing chance" rephrase, though Rhys's intuition is in the right direction (Hoefer's view). I will rate Rhys as "Mostly Right" but note the technical nuance.

      *(Refining Move 5)*: Marta's point about Chance-1 is very sharp. If $Ch(A)=1$, then $A$ occurs. If I know $Ch(A)=1$, I know $A$. Does this violate the "no foreknowledge" intuition? Yes. Does it violate PP? No. Rhys admits this. Marta is right that it weakens the "bite" of the principle regarding foreknowledge.

      *(Refining Shared Assumptions)*: The biggest one is treating PP as the final word. The "New Principle" (NP) was specifically designed to handle the conflict between present credence and future chance information (Move 1/2). Also, the definition of admissibility is the central battleground of philosophy of chance for the last 40 years (Hall, Hoefer, Black).

  6.  **Final Review against constraints:**
      *   Go through six moves one at a time? Yes.
      *   Rate each move? Yes.
      *   Line or two of justification? Yes.
      *   Identify shared assumptions/errors? Yes.

      *Let's write it.*
answer: |-
  Here is an adjudication of the six moves, followed by an assessment of the shared blind spots in their debate.

  ### Move-by-Move Adjudication

  **1. Marta (The Circularity Charge)**
  *   **Rating:** **Mostly Right.**
  *   **Justification:** She correctly identifies the "future chance" problem: if present chance is 0.5 but you know future chance is 0.9, the simple PP formula breaks. Her charge that the standard gloss of admissibility is circular ("evidence that works via chances") is a standard and potent objection in the literature (notably by Ned Hall); the definition often presupposes the very connection the principle is meant to establish.

  **2. Rhys (The Time-Indexing Fix)**
  *   **Rating:** **Mostly Right.**
  *   **Justification:** He correctly identifies that the PP should defer to the chance *governing* the event (the noon chance), not merely the chance at the time of thinking. However, strictly speaking, Lewis's original PP *was* time-indexed ($C_t$ matches $Ch_t$); the real fix requires classifying evidence about *future* chances as admissible regarding the *outcome*, which Rhys gestures at but doesn't technically articulate. His intuition aligns with the "Historical Chance" view (Hoefer), which patches this hole.

  **3. Marta (The Crystal Ball/Triviality Objection)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** This is the strongest philosophical point in the exchange. If the PP's entire work is done by the admissibility clause (i.e., "match chances unless you have inadmissible evidence"), and admissibility is defined as "evidence that doesn't override chances," the principle risks becoming tautological. Without an independent account of admissibility, the PP lacks substantive bite against foreknowledge.

  **4. Rhys (The Causal Account of Admissibility)**
  *   **Rating:** **Mostly Right.**
  *   **Justification:** Defining admissibility via causal/informational independence (evidence not downstream of the outcome) is the standard robust defense (Lewis's own later preference). However, his claim that a forecaster implies an "impossible world" is too strong; it rules out compatibilist views of chance and foreknowledge by fiat rather than argument. Still, as a defense of PP's internal coherence, it holds water.

  **5. Marta (The Chance-1 Counterexample)**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** She exposes a genuine tension: if chance-1 entails truth, knowing the chance is 1 entails knowing the outcome. This grants foreknowledge via a route (chances) that Rhys claimed was restricted. It shows that the PP cannot maintain a hard "no foreknowledge" line without making an ad hoc exception for the boundaries (0 and 1), which weakens the principle's motivation.

  **6. Rhys (The Concession/Research Programme)**
  *   **Rating:** **Mostly Right.**
  *   **Justification:** His retreat is the correct technical position: the PP bans foreknowledge *not mediated by chances*, but allows it *via chances* (even chance-1). Acknowledging that the boundary is a "research programme" rather than a settled fact is intellectually honest; the precise metaphysics of admissibility remains an open problem in philosophy of probability.

  ***

  ### Shared Blind Spots & Assumptions

  Both friends are debating the **Old Principal Principle (Lewis 1980)** as if it were the final word, but they are missing two critical developments that would resolve their stalemate.

  **1. The "New Principle" (Lewis 1994)**
  Lewis himself abandoned the Old PP largely because of **Marta's Move 1**. He realized that in a Humean world (where chances supervene on the whole history of the world), you cannot treat present chances as independent of future outcomes. He replaced the PP with the **New Principle**, which relates credence to the *conditional* chance (the chance given the entire history of the world). Rhys's "time-indexing" fix is essentially a folk version of the move to the New Principle or Hoefer's "Humean Objective Chance," but neither friend explicitly acknowledges that the Old PP is widely considered technically defective in light of this.

  **2. The Metaphysics of Chance**
  They are treating "chance" as a univocal concept. The debate hinges on whether chances are **primitivist** (fundamental propensities) or **Humean** (summaries of patterns).
  *   If chances are **primitivist**, Rhys's causal story works better, but Marta's "note from the lab" is metaphysically suspicious (how do you know a primitive propensity before it manifests?).
  *   If chances are **Humean**, Marta's Move 1 is fatal to the Old PP (because future outcomes determine present chances), which is why Lewis switched to the New Principle.

  **Verdict:** Marta wins on the philosophical rigor of her objections (particularly the circularity and chance-1 points), but Rhys wins on the pragmatic defense of how scientists actually *use* chance norms. They are both right that the Old PP is leaky; the real solution is to update their software to the New Principle or a Humean account.
