      *Step 1: Question.*
      "Williams contends that consequentialism alienates agents from their ground projects by demanding they adopt an impartial standpoint. Critically assess the claim that this integrity objection succeeds only if one accepts Williams's internalist account of practical reasons. If an externalist account of reasons is adopted, does the charge of alienation lose its normative force? Furthermore, determine whether the objection, even if successful, demonstrates a falsity in consequentialist theory or merely identifies a contingent conflict between moral demand and human psychology." 
      *Step 2: Model Answer.*
      Williams's integrity objection argues that consequentialism requires agents to view their own commitments from an impartial perspective, thereby alienating them from the projects that constitute their identity. This alienation manifests as having "one thought too many"—calculating utility where personal commitment should suffice. However, the normative weight of this objection rests heavily on Williams's internalism about reasons.

      For Williams, a reason for action must be grounded in the agent's "subjective motivational set." Ground projects are not merely desires; they are the source of reasons that make life meaningful. When consequentialism demands an agent abandon a project for the greater good, it demands they act against their only genuine reasons. Thus, the objection is not merely that consequentialism is difficult, but that it requires agents to act without reasons, rendering agency unintelligible. Integrity is preserved only when action flows from internal commitments.

      If one rejects internalism for externalism, the landscape shifts. Externalism posits that moral facts generate reasons independently of an agent's motivations. Under this view, the impartial demand of consequentialism is a genuine reason, even if it conflicts with personal projects. The "alienation" Williams describes becomes merely the recognition of an objective moral truth that overrides subjective desire. The charge loses its normative force because the agent is no longer being asked to act without reason; they are asked to prioritize a stronger, external reason over a weaker, internal one. The feeling of alienation is epistemic or psychological, not a violation of rational agency.

      Consequently, the externalist challenge suggests the integrity objection is parasitic on a specific meta-ethical framework. Without internalism, the objection reduces to a complaint that consequentialism is demanding, not that it is incoherent.

      This leads to the second issue: refutation versus psychological clash. Even granting internalism, does the objection refute consequentialism? A consequentialist might argue that integrity is valuable only insofar as it promotes utility. If integrity clashes with utility, the theory dictates sacrificing integrity. Williams claims this shows the theory is flawed because it cannot account for the necessity of ground projects for human agency. However, a staunch consequentialist may concede the clash but deny it is a refutation. They might argue that while humans are psychologically attached to projects, morality requires overcoming this contingency.

      Therefore, the objection refutes consequentialism only if one accepts that a moral theory must accommodate existing human psychology to be valid. If morality is transformative, the clash is a feature, not a bug. The integrity objection ultimately proves fatal only if one accepts both Williams's internalism and the premise that moral theory cannot demand the restructuring of the subjective motivational set. Without these premises, the objection highlights a tragic cost of morality rather than a logical falsity in consequentialism. 
