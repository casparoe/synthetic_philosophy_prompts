      *   **Dunkirk (1940):** British/French vs. Germans. Military defeat (abandonment of equipment/continent), but evacuation saved the army. "Miracle." *Key:* Survival against odds, precursor to ultimate victory, national unity.
      *   **Confederate Lost Cause (1865+):** American Civil War. Military defeat. Mythologized as a noble struggle for states' rights/heritage, downplaying slavery. *Key:* Retroactive justification, racial hierarchy, political rehabilitation.

