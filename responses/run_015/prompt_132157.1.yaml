prompt: |-
  My brother and I have been having the same argument about mind uploading since we were teenagers and we've finally decided to stop going in circles: we're recording the last episode of a small podcast we've been doing about it and we want that episode to be an actual adversarial-collaboration document rather than another round of the same. He holds what I'd call the Process view — a slow, neuron-by-neuron replacement obviously preserves you, because at no point does the continuously operating system stop, and there's no moment at which you could point and say the person ended; I hold the Pattern view — what matters is the functional organisation being implemented, so gradualness is basically emotional window dresing, and a destructive scan followed by exactly one reinstantiation in the next room would be just as good as a hundred-year replacement schedule (branching is the only thing I think really breaks it). Call us Process and Pattern in the document if that helps. What I want from you is the paper the two of us should have written: the claims we can both sign, the precise statements of where we still differ, each phrased so that the person holding it would accept the wording, the cruxes, and for each crux the case or argument both of us agree bears on it, with each of our predictions written down in advance.

  Two things I already know we agree on and want in the agreed-claims section rather than rediscovered on air: that anything the resulting system says about how it feels, remembers, or experiences is close to zero evidence, since any replacement or copy whatsoever would report the same thing; and that the disagreement isn't about behaviour, memory or outward continuity, which both of us expect to be preserved either way. I also suspect at least part of the fight is verbal rather than substantive — I think we may be using "survive" for two different things, one of us for a strict identity claim and one for something like "there's nothing here that prudentially matters / nothing for the original to fear" — so if you think some chunk of it is about words, say exactly which chunk and why, and separate it from what's left. Format it as a numbered agreed-claims section followed by a disagreements table, and add a short closing section on what each of us should count as evidence that would tell against his own view, plus anything you think would genuinely move both of us rather than just one.

  The reason I'm asking you rather than just arguing in the car is that I've invented four variants we've never managed to handle and I want them placed properly in the crux structure — and if any of them only looks hard but actually collapses into a case we've already answered, say so. (a) The long drift: a fully gradual, continuously operating replacement that ends by implementing the functional profile of a different person — say, my sister's psychology installed into my slowly-replaced brain. My view looks committed to saying I've become her; his looks committed to saying I was quietly destroyed and replaced. Can either of us wiggle out, and does that tell us anything? (b) The clock-speed case: the finished emulation run at 1/1000 speed, or at 1000x, so that an hour of subjective life takes a day or a tenth of a second. Does either account have anything to say about whether that's still the same person, and is survival here a matter of degree? (c) The lockstep handoff: run the biological system and the emulation side by side for a month, cross-calibrating them continuously so each is causally responding to the other at every step, then switch the biological one off. Can that kind of sustained causal interaction transfer continuity for the Process view, or does it just produce two systems and then destroy one? (d) The rollback: the system crashes and is restored from last night's checkpoint. Is that the same question as the scan case, a different one, or no question at all? Keep the whole thing under about 900 words since we're reading it out loud, and please don't give us readings, papers or citations — we've read plenty, we're not going to start now, and we can't look anything up from the studio anyway.
