  **Agreed Claims**

  1.  **Epistemic Blackout:** Any resulting system's self-report of continuity is zero evidence. Any replacement or copy whatsoever would report the same thing; we cannot trust the upload's testimony.
  2.  **Functional Equivalence:** The disagreement isn't about behaviour, memory, or outward continuity. Both views expect these to be preserved in both gradual replacement and scan/upload scenarios.
  3.  **Verbal Disagreement:** We acknowledge a terminological split. Process uses "survive" for *numerical identity* (strict spatiotemporal continuity). Pattern uses "survive" for *what matters prudentially* (psychological connectedness). This accounts for significant friction. The remainder is substantive metaphysics regarding what constitutes the self.

  **Disagreements Table**

  | Crux | Process Claim (Brother) | Pattern Claim (User) | Test Cases & Variants | Shared Argument Bearing on Crux | Predictions (Process / Pattern) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Continuity** | Spatiotemporal continuity is necessary. A break in physical operation ends the person. | Continuity is irrelevant. Functional isomorphism is sufficient. | **(d) Rollback:** Collapses to Scan Case. Discontinuity is the key variable. <br>**(c) Lockstep:** Tests if causal coupling bridges physical gaps. | Does causal coupling satisfy continuity requirements? Is discontinuity fatal regardless of pattern match? | (d) Death / Survival.<br>(c) Death (branching) / Survival (if unique). |
  | **Function** | Substrate and history matter. Gradualness preserves identity because the system never stops being *this* physical object. | Substrate is irrelevant. Only the information structure matters. | **(a) Long Drift:** Tests limits of qualitative change.<br>**(b) Clock-Speed:** Collapses to "Is temporal rate part of the function?" | Does qualitative change break identity? Is temporal scaling a functional change? | (a) New Person / You became Sister.<br>(b) Same Person / Same Person (if time abstracted). |

  **Closing: Falsification & Movers**

  **Process:** Count against your view if intuition says you survive a discontinuous teleportation that preserves psychology perfectly, or if gradual replacement of neurons with functionally identical silicon *fails* to feel like survival. Specifically, if the Lockstep Handoff (c) feels like survival despite the parallel run, your continuity requirement must soften.

  **Pattern:** Count against your view if branching (two copies) feels no worse than death, or if you find yourself fearing a destructive scan despite perfect functional restoration elsewhere. Specifically, if the Long Drift (a) feels like death rather than transformation, you must admit qualitative limits to functionalism.

  **Mutual Movers:** Neither view is empirically falsifiable via third-party observation. However, we agree to update based on *first-person intuition pumps*. We commit to treating these intuitions as data, not dogma. If we both agree that a specific variant (like Lockstep) preserves what matters, we must adjust our metaphysical claims to accommodate that consensus. We stop arguing about what *is* and start recording what we *feel* about the cases.
