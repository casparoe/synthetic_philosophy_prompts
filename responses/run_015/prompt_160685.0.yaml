prompt: |-
  You're a professional philosopher who works on moral psychology and political theory — someone who's actually read the literature on moral worth, on reasons, and on the "I was only following orders" material. Take this seriously: think it through carefully, and before you commit to an answer do a few minutes of unstructured brainstorming — list the three or four candidate places the argument could break, then pick one and defend it. Don't spend the whole answer telling me which words are ambiguous and then not choosing.

  Context: I'm writing a paper for a reading group on two folk moralities. On the one side the Anglophone/American package: individual conscience as the final court, whistle-blowing and civil disobedience as the moral heroes, "I was only following orders" as no defence at all. On the other side the German package: Ordnung, Pflicht, the thought that a workable, impartially administered system of rules is *itself* the moral achievement, and that private conscience is just one more corruptible opinion with a good PR department. My interlocutor, who is German and does not find this funny, keeps saying the American picture has no account of coordination and secretly depends on officials doing exactly what the rules say.

  I wanted a clean argument that rule-following contributes nothing at all to moral worth, using the banality-of-evil case as the lever. I got the conclusion I wanted and then noticed I'd also proved something I don't believe. Here it is.

  Two gadgets, both my own definitions, so there's nothing to look up:

  - **Deputy Test (D):** an action done in an official or otherwise rule-governed role has positive moral worth only if the agent would still perform that action — and would still refrain from the forbidden alternative — if the rule were repealed and no one could ever find out what she did. Rules are worth-neutral: they transmit no credit.
  - **Inheritance (I):** any moral worth a compliant action has must be inherited from reasons the agent already had independently of the rule. Rules never *generate* reasons; they only point at reasons you antecedently had.

  The argument:

  1. D.
  2. In the paradigm case — the mid-level functionary who books the trains, signs the form, applies the statute to the listed category — everything the agent offers as her reason is exhausted by "it is my assignment," "it is the rule," "it is lawful." Nothing survives the Deputy Test.
  3. So the functionary's compliance has zero moral worth; the rule contributes nothing in her favour; her office and its procedures add no credit at all. (They also add no excuse, but that's the part everyone already grants.)
  4. D and I say nothing about the content of the rule, the character of the regime, or the kind of role. Whatever makes the functionary's compliance worthless makes every compliant action's worth come from somewhere other than the rule too. So: no action's moral worth ever derives even in part from the fact that it accords with a rule, an order, a law, a promise, or a role. Call this Rule-Independence (RI).
  5. But RI is false. There is something morally good in the judge who sentences the defendant she privately loathes *because* the statute requires it, in the anaesthetist who runs the pre-op checklist she'd quietly skip if left to her own judgement, in the person who keeps a promise she now has every self-interested reason to break precisely *because* she promised. And there is something morally bad in the caseworker who administers the statute selectively by her own lights and calls it conscience.
  6. So D, or I, is false — and my argument for the conscience side collapses into "rules can be sources of moral reasons after all," which is more or less my interlocutor's position plus a footnote.

  The thing I can't shake: D sounds obviously right when I apply it to the functionary and completely insane when I apply it to the judge or the promiser, and I can't say what's different about them. Its supposed to be the same test in both cases.

  So: which step do you reject — and is the problem the inference from 3 to 4, or a premise that was never safe to begin with? If the argument is valid and I just have to eat a premise, tell me which one is cheapest to give up and what giving it up costs me downstream (does it cost me step 3? does it cost me the claim that the functionary's "it is the rule" is worth nothing?). And is there a *restricted* version of D that survives — one that still does the work I want in the banality-of-evil case without eating promises, roles and law — or does any version strong enough to condemn the functionary also condemn the judge?

  I'd rather keep D than give up 5, because 5 feels close to Moorean, but I don't want to hand my interlocutor the whole paper to keep it.

  Format: lead with your bottom line in one sentence. Then give me the prose diagnosis — where it breaks, why the step looked fine, and the price of each alternative — under 600 words. Then a JSON object with exactly these fields:

  - "verdict_step": the number or label of the step you reject (e.g. "3→4", "D")
  - "flaw_type": one of "equivocation", "quantifier_or_scope_shift", "modal_slide", "invalid_under_any_supported_reading", "premise_rejection", "other"
  - "flaw_in_one_sentence": string
  - "why_it_looked_fine": string
  - "steps_you_keep": array of step numbers/labels, as strings
  - "price_table": array of objects, each with "option" (what to give up), "what_you_lose" (string), "severity" ("low", "medium", or "high")
  - "surviving_version_of_D": string (the restricted test you'd defend, or "none")
  - "conscience_side_gets": string, one sentence on what the American package legitimately retains after your diagnosis
  - "rule_side_gets": string, one sentence on what the German package legitimately retains
  - "confidence_in_diagnosis": number between 0 and 1
