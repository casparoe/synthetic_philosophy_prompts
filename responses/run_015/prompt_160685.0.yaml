answer: |-
  Reject the Deputy Test (D) because it equivocate between rules that bypass moral judgment and rules that constitute moral obligations.

  Four candidate break points emerge: (1) Reject **D** (the test is too universal); (2) Reject **I** (rules can generate reasons); (3) Reject **3→4** (the generalization from functionary to all agents is invalid); (4) Reject **5** (deny the judge/promiser has moral worth). I reject **D**.

  The argument fails because **D** treats all rule-dependence as morally suspect "bypassing." In the functionary case, this looks correct: the rule displaces antecedent moral reasons (e.g., "do not kill"). The functionary says, "I don't need to judge; I only obey." Here, the rule blocks moral engagement. But in the judge/promiser cases, the rule *creates* the moral obligation. There is no antecedent reason to sentence *this* defendant or keep *this* promise absent the institution. Here, dependence on the rule *is* the moral engagement (fidelity). **D** conflates *exclusionary reasons* (functionary) with *constitutive norms* (judge).

  Why it looked fine: The "Banality of Evil" case is salient. We generalize from the horror of bureaucratic obedience to all rule-following, assuming the structure of motivation is identical. It isn't.

  Price of alternatives: Rejecting **5** costs your Moorean intuitions (high severity). Rejecting **3→4** saves **D** but leaves you unable to explain *why* the generalization fails without modifying **D** anyway (medium severity). Rejecting **I** concedes too much to the German interlocutor, granting rules independent reason-generating power even in illegitimate regimes (high severity). Rejecting **D** costs you the clean, formal lever against rule-following; you must now argue substantively about the *legitimacy* or *type* of rule (medium severity).

  Surviving strategy: Restrict **D** to cases where the rule claims authority over antecedent moral reasons. The functionary fails this (the rule overrides "do not kill"). The judge passes (the rule constitutes "justice"). This retains the American critique of blind obedience while conceding the German point that legitimate institutions generate moral worth.

