          *   Competence without Comprehension: Organisms act *as if* designed, but there is no "understanding" in the genes or the process. Dennett's phrase "Competence without Comprehension" fits perfectly here.
          *   Structure: Output (adaptation) is decoupled from Internal State (understanding/intent).

      *   *Turing's Inversion:*
