          *   2 Field Experimentalists (RCTs, service delivery, external validity/transportability).
          *   1 Micro Theorist (Principal-Agent, contract theory, effort allocation).
          *   2 Political Theorists (Foucauldian, governmentality, metrics = power).
          *   1 Philosopher of Measurement (Metrology, thermometry ideal, pro-measurement).
