answer: |-
  # Transformative Consent Evaluation Protocol (TCEP)
  **Version:** 1.0 (DBS-Depression Unit)  
  **Purpose:** To evaluate informed consent validity when intervention outcomes may fundamentally alter the patient's value system (Transformative Experience).  
  **User:** Clinical Ethics Team (No philosophical training required).  
  **Grounding:** Adapted from literature on Transformative Experience (e.g., L.A. Paul) and Precedent Autonomy.

  ---

  ## Part 1: The Procedural Checklist

  **Instructions:** Complete steps 1–5 in order. Do not skip steps. If a step triggers a **STOP**, do not proceed to consent signing. If a step triggers a **HANDOFF**, escalate to the Senior Ethics Mediator for a values-based ruling.

  ### Step 1: The Epistemic Gap Check
  **Question:** Does the intervention carry a high probability of changing *how* the patient feels about the world, not just *what* they feel? (e.g., changing the value of sadness, creativity, or social connection, rather than just reducing symptom severity).
  *   **Yes:** Proceed to Step 2. (A transformative gap exists).
  *   **No:** Standard Consent Protocol applies. Stop TCEP.
  > **⚠️ Judgment Call:** Determining "high probability" relies on clinician interpretation of current DBS data, not objective fact.

  ### Step 2: Preference Projection Test
  **Question:** Can the patient describe how their current top three values (e.g., "Creativity," "Safety," "Independence") will rank in the post-intervention state?
  *   **Coherent Projection:** Patient acknowledges values may shift but offers a logical bridge (e.g., "I value creativity, and I understand I may value it differently, but I still want to create"). Proceed to Step 3.
  *   **Incoherent/Refused Projection:** Patient states current values are immutable OR refuses to speculate on future values. Proceed to Step 3 (Flag as High Risk).
  > **⚠️ Judgment Call:** Distinguishing between "stable higher-order preference" and "rigid delusion" is subjective.

  ### Step 3: Value-Inheritance Failure Check
  **Question:** If the patient's values change radically, would the *Post-Intervention Self* repudiate the *Pre-Intervention Self's* reason for consenting?
  *   **Low Risk:** Patient acknowledges the risk and accepts that Future Self might disagree, but cites a higher-order value (e.g., "Even if I become someone who doesn't care about art, I want to give that person a chance to live"). Proceed to Step 4.
  *   **High Risk (Failure):** Patient insists only the Current Self matters, explicitly disregarding the Future Self's potential rejection of the choice (e.g., "Future me doesn't get a vote"). **TRIGGER PROCEDURAL STOP.**
  > **⚠️ Judgment Call:** Assessing "repudiation" requires interpreting hypothetical future states.

  ### Step 4: Substitute Decision Criteria
  **Question:** Since the patient cannot know the outcome epistemically, is there adequate proxy evidence?
  *   **Peer Cohort Available:** Is there robust testimony from prior patients with similar baseline values?
      *   *Yes:* Does the peer data contradict the patient's specific fears? (If Yes, peer data overrides subjective fear). Proceed to Step 5.
      *   *No:* Proceed to Step 5 (Flag as Data Gap).
  *   **No Peer Cohort:** (Novel intervention or unique patient profile). Proceed to Step 5 (Flag as Data Gap).
  > **⚠️ Judgment Call:** Determining if a peer cohort is "similar enough" to the patient is a clinical judgment, not a statistical certainty.

  ### Step 5: Decision Node (Stop vs. Handoff)
  **Rule:**
  *   **PROCEDURAL STOP (Consent Insufficient):** Triggered if **Step 3 = High Risk**. The patient's refusal to acknowledge the future self's agency invalidates the consent for a transformative procedure.
  *   **MEDIATOR HANDOFF:** Triggered if **Step 1 = Yes** AND **Step 4 = Data Gap**. The team cannot verify outcomes via peers; a Senior Mediator must weigh the risk of transformation against the severity of depression.
  *   **CONSENT GRANTED:** Triggered if **Step 3 = Low Risk** AND **Step 4 = Peer Cohort Available** (even if peer data contradicts patient fears).

  ---

  ## Part 2: Case Applications

  ### Case 1: The Artist (Value Conflict)
  **Profile:** Patient values artistic creativity above mood elevation. Fears DBS will cause "emotional flattening" that kills creativity.
  **Data:** Peer reports from 50+ DBS patients indicate emotional flattening often *removes* depressive block, restoring creative drive.
  *   **Step 1 (Gap):** **Yes.** DBS changes emotional texture.
  *   **Step 2 (Projection):** **Incoherent.** Patient cannot imagine creativity without depressive intensity.
  *   **Step 3 (Inheritance):** **Low Risk.** Patient agrees they want to create art, even if the *feeling* of creation changes.
  *   **Step 4 (Substitutes):** **Peer Cohort Available.** Data contradicts patient fear.
  *   **Step 5 (Decision):** **CONSENT GRANTED.** (Peer data overrides subjective fear).
  *   **Intuition Check:** *Conflicts with clinical intuition.* Standard practice would pause when a patient articulates a specific, valued side-effect risk (loss of creativity). This procedure overrides the patient's stated fear based on aggregate data, prioritizing the *outcome* (creativity) over the *experience* (depressive intensity).

  ### Case 2: The Autonomy Absolutist (Value-Inheritance Failure)
  **Profile:** Patient is competent, severely depressed. States: "I know I might change. I don't care. Only my current self has the right to authorize this. If Future Me hates it, that's Future Me's problem."
  *   **Step 1 (Gap):** **Yes.**
  *   **Step 2 (Projection):** **Refused.** Patient refuses to project preferences.
  *   **Step 3 (Inheritance):** **High Risk (Failure).** Patient explicitly rejects the reasoning that Future Self's values matter.
  *   **Step 4 (Substitutes):** **N/A.** (Stopped at Step 3).
  *   **Step 5 (Decision):** **PROCEDURAL STOP (Consent Insufficient).**
  *   **Intuition Check:** *Conflicts with clinical intuition.* Standard bioethics prioritizes current autonomy of a competent adult. This procedure denies consent because the patient refuses to grant moral weight to their future identity, which is a requirement for *transformative* consent validity.

  ### Case 3: The Novel Variant (Data Gap)
  **Profile:** Patient fits standard profile, but clinic is trialing a new stimulation frequency. No peer cohort exists for this specific parameter.
  *   **Step 1 (Gap):** **Yes.**
  *   **Step 2 (Projection):** **Coherent.**
  *   **Step 3 (Inheritance):** **Low Risk.**
  *   **Step 4 (Substitutes):** **No Peer Cohort.**
  *   **Step 5 (Decision):** **MEDIATOR HANDOFF.**
  *   **Outcome:** The checklist cannot clear this. A Senior Mediator must decide if the potential benefit justifies the unknown transformative risk. This is a values judgment, not a factual check.

  ---

  ## Part 3: Limitations and Disclosures

  ### What This Procedure Cannot Resolve
  1.  **Personal Identity Metaphysics:** The procedure assumes a pragmatic continuity of self. It cannot determine if the post-DBS patient is "the same person" as the pre-DBS patient. If the transformation is so radical that identity is broken, *no* consent is valid. This procedure treats identity as a spectrum, not a binary.
  2.  **Depression vs. Capacity:** It does not diagnose whether the desire for transformation is a symptom of the depression itself (e.g., suicidal ideation disguised as a wish for change). This requires separate psychiatric capacity evaluation.
  3.  **The "Right" Value Set:** The procedure does not determine if the *new* values are "better" than the old ones (e.g., is a happy, uncreative self better than a sad, creative self?). It only assesses the validity of the transition authorization.

  ### Explicit Flags: Judgment Calls Disguised as Procedure
  *   **Step 1 (Gap Threshold):** There is no objective metric for "high probability" of value change. Clinicians must guess based on anecdotal evidence.
  *   **Step 3 (Repudiation):** Determining whether a patient "disregards" the future self vs. "accepts the risk" is a linguistic interpretation, not a psychological fact.
  *   **Step 4 (Peer Similarity):** Deciding if a peer report is "relevant" involves matching complex narrative identities, which is inherently subjective.
  *   **Step 5 (Handoff Threshold):** The decision to escalate to a Mediator rather than Stop is itself a value judgment about how much uncertainty is permissible.

  **Mediator Note:** This checklist is a risk-mitigation tool, not an ethical absolution. If Step 5 yields "Consent Granted," the team remains ethically liable for the transformative outcome.
