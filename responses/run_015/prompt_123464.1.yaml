answer: |-
  This is a profound ethical puzzle because you have correctly identified that the standard answers ("the dead feel no pain" or "don't lie to the audience") are insufficient. Your intuitions are tracking something more subtle: a violation of **agency** and **integrity**, rather than harm or accuracy.

  You are not asking about historical accuracy; you are asking about **narrative justice**.

  Based on your verdicts, specifically the anchor of the "Joke-Line" case, here is the principle that best captures the shape of your thinking.

  ### The Principle of Posthumous Agency

  We owe the dead a duty of **stewardship over their agency**. We may dramatize their lives, but we may not use their "voice" (literal or metaphorical) to endorse a self-conception they rejected, nor may we convert their private interiority into public performance without cause.

  This principle is composed of three specific clauses.

  #### Clause 1: The Ventriloquism Prohibition
  **Statement:** You may not place words or sentiments in a subject's mouth that invert their known intent or irony, even if the words are factually real.
  **Forced by:** *The Politician (Joke Line).*
  **Reasoning:** This is your strongest intuition. Using a joke as a sincere statement is not a factual error; it is a violation of the subject's mind. It treats them as a puppet rather than a person. It forces them to argue against themselves. This explains why the Composer case is fine (words moved, intent preserved) while the Politician case is not (words kept, intent inverted).

  #### Clause 2: The Moral Trajectory Test
  **Statement:** You may invent details that complicate a subject's character, provided the invention does not reverse the direction of their defining moral contribution.
  **Forced by:** *The Civil Rights Leader vs. The Dictator.*
  **Reasoning:** This resolves your conflict between the leader and the dictator.
  *   **The Leader:** His defining contribution is moral steadfastness (nonviolence). Inventing a wavering moment reverses his moral trajectory from "exemplar" to "hypocrite" or "weak." This undermines the lesson of his life.
  *   **The Dictator:** His defining contribution is public cruelty. Inventing tenderness with his mother complicates him but does not *exonerate* him. The moral trajectory remains "monster," merely a "human monster." The invention adds depth without erasing the historical verdict.

  #### Clause 3: The Interiority Boundary
  **Statement:** You may compress logistical reality (people, events) for narrative flow, but you may not invent a witness for private introspection unless that introspection was intended for public consumption.
  **Forced by:** *The Explorer (Sailor) vs. The Painter (Friend).*
  **Reasoning:** This distinguishes functional invention from psychological intrusion.
  *   **The Sailor:** A composite character is a logistical tool to move the plot (the ship) forward. It does not access the explorer's mind.
  *   **The Friend:** An invented confidant is a psychological tool. It takes doubts recorded in *private notebooks* and turns them into *social performance*. It changes the nature of the subject's solitude. Even if the audience knows the friend is fake, the *subject* is being presented as someone who needed external validation for thoughts they kept internal.

  ***

  ### Verdicts on Your Unsettled Cases

  Applying the Principle of Posthumous Agency to your three new scenarios:

  **1. The Digital Resurrection (Dead Actor's Likeness)**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** This violates Clause 1 (Ventriloquism). Even with estate permission, this creates a puppet that speaks new words. The "face and voice" are the physical markers of agency; using them to speak lines the actor never chose to speak treats the human being as a software license. It is the ultimate severing of intent from expression.

  **2. The Name on the Memorial (Mostly Unknown Subject)**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** When a person is reduced to a name, they have no surviving public agency to betray. There is no "intent" to invert and no "moral trajectory" to reverse. Invention here is not a violation; it is an act of recovery. However, Clause 3 suggests you must not invent *private* interiority (diaries they didn't write), only public actions necessary to make them a character.

  **3. The Satire (Grotesque Exaggeration of Positions)**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** Satire operates in the **Public Sphere**, not the Private Interior. It exaggerates what the politician *chose to show the world*, not who they were in the dark. It holds them accountable to their public agency. As long as the satire does not claim to reveal private thoughts (Clause 3) or invert their intent (Clause 1), it is a permissible engagement with their public legacy.

  ***

  ### One Duty or Two?

  You asked if this is one duty or two (audience vs. subject). It is **two**, but they are asymmetrical.

  1.  **Duty to the Audience:** Do not lie about history in a way that corrupts public understanding (e.g., The Memoirist case).
  2.  **Duty to the Subject:** Do not violate their agency (e.g., The Joke-Line case).

  **The Joke-Line case is explained entirely by the Duty to the Subject.**
  You noted that in the Joke-Line case, the audience might know the scene is invented, yet your verdict doesn't soften. This proves the harm is not deception. The harm is **disrespect**. It is a violation of the subject's right not to be made a fool of in perpetuity. We owe the dead the courtesy of not making them liars about their own minds.

  ***

  ### The Hard Truth: Which Verdicts Must You Drop?

  You asked for honesty about where a defensible principle forces you to compromise. A rigorous application of the **Principle of Posthumous Agency** creates friction with two of your intuitions.

  **1. The Dictator Case (The Weak Link)**
  *   **Your Verdict:** Fine (Generous).
  *   **The Principle's Push:** If we strictly uphold Clause 1 (Ventriloquism/Intent), we do not know if the dictator *wanted* to be seen as tender. If he cultivated a public image of pure cruelty (like some dictators did), humanizing him might violate his *chosen public agency* just as much as wavering the Civil Rights leader.
  *   **The Compromise:** To keep your verdict, you must accept that **moral monsters forfeit some agency rights.** We owe the dead integrity, but we owe the *living* truth about the nature of evil. If humanizing the dictator helps the audience understand how evil functions (in families, not just battlefields), the Duty to the Audience overrides the Duty to the Subject. You have to admit that this case is an exception, not the rule.

  **2. The Self-Taught Artist (The Vandalism Case)**
  *   **Your Verdict:** Not Fine (Vandalism).
  *   **The Principle's Push:** Clause 2 (Moral Trajectory) and the Duty to the Audience suggest exposing a lie is usually *good* (see the Memoirist). Why is this different?
  *   **The Compromise:** You must distinguish between **Fraud** and **Mythos**.
      *   The Memoirist sold "Truth." Exposing the lie fulfills the contract.
      *   The Artist sold "Art." If the origin story is constitutive of the work's meaning (e.g., an outsider artist whose work relies on the myth of their isolation), exposing the lie destroys the *object* itself.
      *   **The Drop:** You must admit that if the Artist's lie was harmful (e.g., they stole from real victims to build their myth), the Duty to the Audience/Truth *must* override the Duty to the Art. If the lie is harmless folklore, your verdict stands. If the lie is fraudulent appropriation, your verdict ("Not Fine") is wrong. A defensible principle requires you to drop the "Not Fine" verdict if the lie was harmful to others.

  ### Summary
  Your intuition is correct: the wrongness lies in **betrayal**, not harm. We owe the dead fidelity to their **intent**, their **moral direction**, and their **privacy**. When we violate these, we are not hurting them; we are misusing them. We are turning a person into a prop.

  The "Joke-Line" case is the key because it is pure ventriloquism. It reveals that your ethics are not about *facts*, but about *fidelity*. You are arguing for a right to **posthumous integrity**.
