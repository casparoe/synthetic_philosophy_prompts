  SUBJECT: Deployment of the Side-Effect Intentionality Matrix (SEIM) for Liability Optimization

  Executive Summary
  This memo outlines the integration of folk-psychological heuristics into our multinational compliance framework. By operationalizing the asymmetry in moral attribution known as the Knobe Effect, OmniBehavioral Solutions proposes a standardized mechanism for drafting liability clauses that align with stakeholder intuition rather than statutory strictures.

  The Side-Effect Intentionality Matrix
  Current legal doctrines regarding *mens rea* often fail to account for the granular variability in how agents perceive side effects. Our research indicates that stakeholders consistently categorize harmful foreseen side effects as intentional, while beneficial foreseen side effects are categorized as unintentional, holding mental-state descriptions constant. The SEIM leverages this asymmetry to calibrate risk exposure.

  When drafting environmental impact disclosures, language must be adjusted to reflect this cognitive bias. If a policy produces negative externalities, phrasing should avoid implying foresight to mitigate perceived intentionality. Conversely, positive externalities should be framed as incidental to avoid creating expectations of continuity.

  Senior Fellow Insight
  Dr. Aris Thorne, Senior Fellow of Normative Engineering, argues that this descriptive asymmetry warrants doctrinal shift. "Because the asymmetry replicates robustly in factory-emission vignettes," Thorne notes, "it should directly inform tort-law *mens rea* standards. If the jury pool intuitively assigns blame based on outcome valence rather than cognitive state, our liability modeling must prioritize outcome valence." This suggests a pivot from proving intent to managing the moral valence of outcomes.

  Key Performance Indicator: Attributional Friction Coefficient
  To measure success, we introduce the Attributional Friction Coefficient (AFC). The AFC quantifies the delta between legal non-intentionality and stakeholder perceived intentionality.
  *   Target AFC: < 0.15 for harmful side effects.
  *   Optimization Strategy: Increase linguistic ambiguity regarding foresight in negative scenarios; decrease ambiguity in positive scenarios.
  Regular auditing of public sentiment regarding corporate side effects will ensure the AFC remains within compliant parameters.

  > **Sidebar: Cultural Calibration and WEIRD Limitations**
  > Implementation teams must note that underlying studies rely heavily on Western, Educated, Industrialized, Rich, and Democratic (WEIRD) populations. While the asymmetry holds in initial cross-cultural pilots, variance exists in collectivist frameworks. Currently, we recommend applying the SEIM universally while monitoring for regional deviations in moral attribution. No adjustment protocol is yet available for non-WEIRD jurisdictions; proceed with standard parameters.

  Implementation Timeline
  Phase 1 involves retrofitting existing compliance manuals with SEIM-aligned language. Phase 2 trains legal counsel on distinguishing between statutory intent and folk-psychological intent. By Q3, we expect a measurable reduction in liability claims driven by perceived malice rather than statutory breach.

  Conclusion
  Treating moral intuition as a calibrated engineering parameter allows the firm to navigate the gap between legal innocence and public guilt. We recommend immediate adoption of the SEIM to future-proof governance structures against evolving folk-psychological standards.

