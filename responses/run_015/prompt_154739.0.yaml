answer: |-
  This is an exceptionally sharp observation. You have identified the exact point where the philosophical abstraction (substantivalism vs. relationism) crashes into the operational reality of modern geodesy and astrometry.

  Your intuition is correct: the practice does not strictly presuppose Newtonian substantivalism, nor does it presuppose strict Machian relationism. It presupposes **General Relativity (GR) interpreted as a dynamical metric field ontology.**

  Here is the reconstruction of the implicit theory, the resolution of the (1)/(2) tension, and the analysis of your hypothetical scenarios.

  ### 1. Reconstructing the Implicit Theory: Metric Field Realism

  The working practice of astrometry and geodesy operates on a specific ontological commitment that sits between your professor's Machian reading and the textbook's absolutist reading.

  *   **What it is not:** It is not Newtonian substantivalism (rotation relative to an immutable background container). It is not strict Machian relationism (rotation defined *solely* by the weighted average of relative motion of all matter).
  *   **What it is:** It treats the **spacetime metric field ($g_{\mu\nu}$)** as the physical entity that defines inertia.
      *   **Strict Presupposition:** Rotation is defined dynamically as deviation from **Fermi-Walker transport** along a worldline. If a gyroscope (or ring laser) precesses relative to your lab axes, you are rotating relative to the local inertial structure defined by the metric connection.
      *   **Operational Fit:** The metric field is a "substance" in the sense that it exists locally and dictates dynamics (Sagnac effect), but it is "relational" in the sense that its structure is determined by the distribution and motion of energy-momentum (Einstein Field Equations).

  **Verdict on (1) vs. (2):** They are not inconsistent. They are measuring the same underlying structure (the local inertial frame) via two different causal chains.
  *   **(2) Ring Lasers:** Measure the local inertial frame *directly* via the Sagnac effect (interaction with the metric field).
  *   **(1) Quasars (ICRF):** Measure the local inertial frame *indirectly* by assuming that distant matter is, on average, at rest relative to the asymptotic boundary conditions of that same metric field.

  In our actual universe, these two align to extraordinary precision. The quasars are not the *definition* of non-rotation; they are the best available **proxy** for the inertial frame defined by the metric.

  ### 2. The Role of Frame Dragging (Lense-Thirring)

  You asked if frame dragging commits the practice to a partly relational picture. It actually commits it to the **dynamical metric** view.

  *   **Strict Machism:** If rotation were purely relative to matter, a rotating shell of matter *should* drag the inertial frames inside it completely (perfect dragging).
  *   **Newtonian Substantivalism:** A rotating shell should have *no effect* on local inertia.
  *   **GR Practice:** A rotating shell *partially* drags local inertial frames.

  Geodesy accounts for this (e.g., in the modeling of the LAGEOS satellites or Gravity Probe B data). The practice treats the metric field as a physical medium that can be "stirred" by mass currents. This refutes the idea that the quasar frame is *constitutively* the inertial frame. The quasars are just "distant matter." If local matter spins, it tweaks the local metric, and the ring laser will detect a change in rotation even if the quasars haven't moved.

  **Conclusion:** Frame dragging proves that the "standard of non-rotation" is not the distant matter itself, but the local metric field, which is *influenced* by both local and distant matter.

  ### 3. The Hypothetical Drift Scenario

  *Scenario:* VLBI (Quasars) and Ring Lasers drift apart over decades due to a massive rotating shell nearby.

  **Which instrument wins?**
  *   **For Dynamics (Physics):** The **Ring Laser** wins. If the ring laser reads zero Sagnac shift, Coriolis forces vanish in that lab. Foucault pendulums don't precess. Local physics is simplest in the frame defined by the ring laser. This is the "Local Inertial Frame."
  *   **For Coordinates (Astrometry):** The **VLBI/ICRF** wins. The ICRF is a *conventional* reference frame. By definition, the ICRF axes are fixed to the quasars.

  **What would geodesists do?**
  If a drift were detected and confirmed to be caused by local frame dragging (and not quasar proper motion or instrument error):
  1.  **Earth Orientation Parameters (EOP):** The EOP would show a discrepancy between "Celestial Pole Offsets" derived from VLBI and "UT1-UTC" derived from inertial sensors.
  2.  **Frame Definition:** The IAU would likely *keep* the ICRF definition fixed to quasars for catalog stability. However, they would introduce a correction model (a "frame bias" or "rotation of the local inertial frame relative to the BCRS") for high-precision navigation.
  3.  **The "Truth":** They would admit that the **Barycentric Celestial Reference System (BCRS)** is no longer kinematically non-rotating relative to the **local** inertial frame.

  **Local vs. Global:** It matters immensely. If the drift is local (near the mass), it confirms GR's prediction that inertia is locally determined. If the drift were global (all ring lasers everywhere drift relative to quasars), it would imply the boundary conditions of the universe have changed, threatening the cosmological principle.

  ### 4. Metaphysical Underdetermination

  You asked: *What would concretely have to change in day-to-day work if you swapped in full relationism, full substantivalism, or field ontology?*

  **Answer: Nothing.**

  This is the critical philosophical point. The practice is **metaphysically underdetermined**.
  *   **The Substantivalist** says: "The metric field rotated relative to the lab."
  *   **The Relationist** says: "The spatial relations between the lab and the causal structure of the universe changed."
  *   **The Operationalist** says: "The interference fringe shifted by $\Delta \phi$."

  All three calculate the exact same correction for GPS satellite clocks. All three use the same IERS conventions. Your professor and your textbook are fighting over the *interpretation of the map*, while the geodesists are walking the *terrain*.

  *   **Why the Prof says Machian:** Because in cosmology, the metric boundary conditions are set by the cosmic matter distribution. No matter, no metric (roughly).
  *   **Why the Textbook says Absolute:** Because locally, the metric acts like a rigid structure that exists even if you remove the local matter (the Hole Argument logic).

  Both are licensed to use the same equations because the equations (Einstein Field Equations) are the common ground. The practice presupposes the **mathematical structure of GR**, not the metaphysical interpretation of what the tensor *is*.

  ### 5. Global vs. Local in GR

  You asked: *Does GR even give one global answer about who is rotating?*

  **Strictly: No.**
  GR only defines local inertial frames. There is no global inertial frame in a curved spacetime with inhomogeneous matter distribution.

  **Practice:**
  The practice *approximates* a global frame.
  1.  They assume the universe is asymptotically flat (or Friedmann-Lemaître-Robertson-Walker on large scales).
  2.  They construct the **BCRS (Barycentric Celestial Reference System)** as a global coordinate system.
  3.  They acknowledge this is a *convention* (defined by IAU resolutions) that is *consistent* with GR to a specific order of approximation ($c^{-2}$ or $c^{-4}$).

  If you push the precision hard enough (e.g., microarcsecond astrometry with Gaia), the "global" frame breaks down. You have to specify *where* and *when* the rotation is measured. The practice handles this by defining "Earth Orientation Parameters" as time-dependent functions, acknowledging that the relationship between the Earth-fixed frame and the Celestial frame is dynamic, not static.

  ### Summary for your Seminar

  If you want to intervene in the seminar, here is the sharp formulation:

  1.  **Practice presupposes Metric Field Realism.** Rotation is deviation from the local metric connection (measured by ring lasers), not merely relative to distant matter (quasars).
  2.  **(1) and (2) are consistent only contingently.** They align because, in our universe, distant matter is approximately at rest relative to the asymptotic metric. They are not conceptually identical; one is dynamic (local field), one is kinematic (distant boundary).
  3.  **Metaphysics is idle.** Switching between substantivalism and relationism changes the story you tell about *why* the ring laser fringes shift, but it does not change the calibration of the ring laser, the definition of the ICRF, or the navigation of a probe to Mars.
  4.  **Global Rotation is a Fiction.** GR only licenses local claims of rotation. The "global non-rotating frame" of the ICRF is a pragmatic construction that works because the universe is smooth enough on large scales, not because spacetime is a Newtonian bucket.

  Your professor is mistaking the *cause* of the inertial field (matter) for the *definition* of the inertial field (metric). Your textbook is mistaking the *local rigidity* of the metric for *absolute background space*. The practitioners know better: they trust the laser for dynamics and the quasars for coordinates, and use GR to translate between them.
