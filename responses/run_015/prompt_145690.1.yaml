      *   **Format:**
          1.  Numbered Agreed-Claims Section.
          2.  Disagreements Table (Columns: ED Wording, P Wording, Merely Verbal?, Crux, Shared Case/Argument, Pre-committed Predictions).
          3.  Closing Section (Addressed to a Heckler re: Fanaticism/Over-demandingness).
          4.  Marginalia/Honesty Check: Calibrate which claims are genuine vs. forced, flag uncertainties, critique the framing if necessary.
      *   **Tone:** Professional, philosophical, collaborative but honest about disagreements. Not an essay.
      *   **Specific Cases to Integrate:**
          1.  The Pallet Case (Chunky vs. Smooth supply).
          2.  Two Jurisdictions (Tie = Status Quo vs. Tie = Coin Flip).
          3.  The Audit (Retrospective knowledge of non-pivotality).
          4.  Two "Reversed" Cases (Compensated Participation vs. Harmful Abstention).
      *   **Constraint:** Be honest in the margins about calibration (what they'd actually sign vs. what's needed for the doc to work).

  2.  **Deconstruct the Camps:**
      *   **ED (Expected Difference):** Focus on $P \times V$. Duty is grounded in the causal impact, however probabilistic. "Inefficacy" is false; you *do* make a difference in expectation.
      *   **P (Participation/Fair Share):** Focus on complicity, fair play, or joining a harmful practice. Causal impact is secondary or irrelevant to the *source* of the duty, even if it aligns on the *action*.

  3.  **Drafting - Section by Section:**

      *   **Header/Intro:** Needs to look like a document.
      *   **Preamble/Calibration Note:** The prompt asks for honesty in the margin *and* at the top if the framing is confused. I need to assess if ED vs. P is a real distinction. It is a standard distinction in ethics (consequentialism vs. deontology/contractualism), but the "Inefficacy Objection" usually pits Consequentialists against Consequentialists (trying to save expected utility) or Consequentialists against Non-Consequentialists. I should note that "P" often smuggles in consequentialist reasoning or relies on non-consequentialist norms. I will add a "Calibration Note" at the start.

      *   **Part I: Agreed Claims:**
          *   Need common ground. Both agree eating less meat/voting is generally good. Both agree "I make no difference" is often empirically false or normatively irrelevant. Both agree extreme fanaticism is bad.
          *   *Calibration:* Would they actually sign these? Yes, mostly. The trick is phrasing them neutrally.

      *   **Part II: Disagreements Table:**
          *   *Case 1 (Pallet):* ED says EV is identical. P says the "joining the order" is clearer in the smooth case, or perhaps irrelevant in both. *Crux:* Is causal granularity morally relevant?
          *   *Case 2 (Jurisdictions):* ED says EV might differ slightly based on tie-breaking rules. P says duty is identical (civic duty). *Crux:* Is the duty sensitive to marginal probability shifts?
          *   *Case 3 (Audit):* ED says duty remains (ex ante expectation). P says duty remains (participation occurred). *Crucial:* Do they agree on this? Yes, both should say ex ante matters.
          *   *Case 4 (Reversed):* ED likes offsets, hates harmful abstention. P hates participation (even with offsets), might tolerate harmful abstention if it signals non-participation. *Crux:* Is the act itself tainted or just the outcome?

      *   **Part III: Closing (The Heckler):**
          *   Address Pascal's Mugging (ED risk) and Harmless Abstention (P risk).
          *   ED needs a threshold for probability/credence. P needs a threshold for "harmful practice."

      *   **Marginalia:** I need to insert comments (perhaps in brackets or a sidebar style) indicating where I'm unsure if they'd sign.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique of the Camps:* The prompt asks me to flag if the framing is confused. The ED/P split is real, but "P" is often a umbrella for Complicity, Fair Play, and Contractualism. I should note that "P" isn't a single theory.
