      *   *Case 4 (Reversed):* This is the strongest wedge. ED is purely outcome-focused. P is act-focused.
      *   *Tone Check:* Keep it dry and document-like.

  5.  **Final Review against Constraints:**
      *   Document format? Yes.
      *   Two parts (Claims + Table)? Yes.
      *   Closing section? Yes.
      *   Marginalia/Calibration? Yes.
      *   Specific cases included? Yes.
      *   Honesty about signability? Yes.

  6.  **Writing the Document:** (Proceeding to generate the response based on these thoughts.)
      *   *Note on Marginalia:* I will use blockquotes or italicized notes labeled "[CALIBRATION NOTE]" to satisfy the request for honesty about what they'd actually sign.

  7.  **Final Polish:** Ensure the "Heckler" section addresses both specific risks (Pascal's Mugging for ED, Harmless Practices for P). Ensure the table columns match the prompt exactly.

