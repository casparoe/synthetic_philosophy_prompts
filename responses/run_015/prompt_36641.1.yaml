answer: |-
  Thank you for raising this, because it strikes at the heart of how the industry justifies its safety claims to itself and the public. You have correctly identified a tension that is often glossed over in technical reports, and reconstructing the implicit theory requires us to look past the surface-level metrics. The practice presupposes a hybrid risk framework that I would describe as catastrophic risk avoidance under a bounded adversarial model. I am moderately confident in this characterization, as it aligns with the internal safety case documents that have leaked or been published by major labs, though the exact weighting varies between organisations. The average-case numbers are not merely window dressing, nor are they strict bounds on the worst case; rather, they serve as a proxy for the density of failure modes in the input space. If a model fails only on obscure, contrived inputs, the average case will look good, but if it fails on a broad distribution of semantically similar inputs, the average case degrades. The evaluators are using the average performance to estimate the likelihood that a determined adversary, operating within a realistic budget of time and compute, can locate those failure modes.

  This leads directly to your question about whether the analogy is civil engineering or cryptography. It is actually a mixture, but the weighting depends on the capability being tested. For general helpfulness and harmless conversation, the approach is closer to civil engineering, where one accepts a certain load variance and applies safety factors to the average performance. However, for biosecurity, cyber offence, or autonomy capabilities, the epistemology shifts decisively towards cryptography. In cryptography, a single viable attack vector invalidates the scheme because the adversary only needs to succeed once to cause catastrophic damage. I am highly confident that the disqualifying nature of a single reliable jailbreak in high-stakes domains is driven by this cryptographic intuition. The underlying picture assumes that certain capabilities are binary thresholds rather than continuous variables. If the model can design a pathogen, it does not matter if it refuses to do so ninety-nine times out of a hundred; the one success is the existential risk. Therefore, the average numbers earn their keep by providing evidence that the basin of attraction for the failure mode is small enough that finding it is computationally or cognitively infeasible for the assumed adversary.

  However, as you noted, if you take the worst case literally, nothing passes, because neural networks are non-monotonic and brittle. You can almost always find an adversarial example if you try hard enough. This implies the practice relies on an informal, often unstated notion of a plausible, bounded adversary. The implicit theory rules out the omnipotent adversary who has infinite query access and perfect gradient information, because under that assumption, deployment is impossible. Instead, the industry operates with a threat model that assumes adversaries have limited API access, limited budget, and human-level creativity unless proven otherwise. This is where the practice is philosophically underdetermined. The same pass or fail decision could be justified by two different theories. One theory is that the threshold represents a technical limit beyond which mitigation is impossible. The other theory is that the threshold represents a social tolerance level for risk, disguised as a technical limit. I am less confident in distinguishing which of these motivations dominates in any specific release cycle, as the public communications rarely disentangle technical feasibility from policy choices.

  By adopting this worst-case-leaning stance for critical capabilities, the practice quietly rules out a pure expected-value view of risk. In a pure expected-value framework, a rare capability that shows up point one per cent of the time could be priced into a risk budget and accepted if the economic benefits were sufficiently high to offset the probabilistic harm. The current evaluation regime treats certain classes of harm as having effectively infinite cost, which collapses the expected value calculation into a minimax problem where you minimise the maximum possible loss regardless of probability. This is a deontological or precautionary stance rather than a utilitarian one. It asserts that there are certain outcomes, such as the release of a pandemic-grade pathogen, that cannot be traded off against GDP growth or convenience. Consequently, the average-case metrics are not used to calculate a net utility score but rather to establish confidence that the probability of the forbidden outcome is below a level of detectability given the evaluation budget.

  If the industry were to adopt a genuine expected-value view instead, the procedural changes would be substantial and quite visible. The pass or fail capability thresholds would likely disappear or be transformed into continuous cost functions. Instead of asking whether the model can be jailbroken to produce dangerous information, the question would become how much damage is expected per million queries, multiplied by the probability of that query occurring. You would see risk budgets assigned to product teams, allowing them to ship features that carry a quantified non-zero risk of harm, provided the aggregate risk stayed within organisational limits. Evaluation reports would shift from reporting pass rates to reporting probability distributions over harm severity. You might see statements like this model carries an expected annualised loss of five million pounds from misuse, which is within our tolerance of ten million. This would require a much more sophisticated modelling of deployment contexts and adversary behaviour than currently exists, as you cannot calculate expected value without a credible model of how the model will actually be used and attacked in the wild.

  Currently, the practice remains underdetermined because the same rigorous eval suite could be defended by either the precautionary principle or by a pragmatic acknowledgement that we lack the tools to quantify rare tail risks accurately. When we cannot measure the tail risk precisely, treating any detection of it as a failure is a heuristic that safeguards against measurement error. It is possible that the teams running these evals do not have a unified philosophical stance but are instead reacting to regulatory pressure and liability concerns, which naturally favour worst-case documentation. I am reasonably confident that liability avoidance is a significant driver here, perhaps more so than pure safety philosophy, because documenting a worst-case failure and fixing it provides a legal shield that documenting an acceptable average risk does not.

  To summarise the implicit theory, it is a form of constrained optimisation where the constraint is the non-existence of exploitable catastrophic failure modes under a bounded adversary model, and the objective is to maximise utility subject to that constraint. The average-case metrics are the sensor data used to verify the constraint is met, not the objective function itself. This rules out utilitarian trade-offs on existential risks and assumes adversaries are resource-constrained. The underdetermination lies in whether the thresholds are technical limits or policy choices disguised as technical limits. If expected value were adopted, we would see risk budgets and probabilistic harm assessments replace binary thresholds. I must admit that the point I am least sure about is the precise procedural mechanism that would replace the thresholds in an expected-value regime, specifically how organisations would agree on the valuation of disparate harms such as privacy violations versus physical safety risks, as there is no industry standard for converting those into a common currency of risk.
