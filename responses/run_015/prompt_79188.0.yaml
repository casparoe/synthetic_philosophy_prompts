answer: |-
  Your colleague is substantially correct: the "lottery" and "sample" conceptions rest on incompatible normative foundations, and attempting to fuse them via engineering compromises the anti-oligarchic legitimacy that makes sortition distinctively democratic.

  The divergence is not merely terminological but strikes at the source of legitimacy. The lottery conception is procedural and deontological: legitimacy arises from the ex-ante equality of opportunity, where the moral weight lies in the fact that no gatekeeper decided you were unfit. The sample conception is consequentialist and epistemic: legitimacy arises from the ex-post accuracy of representation or the quality of the decision output. When you optimize for the sample view—stratifying by age, region, or income to minimize sampling error—you necessarily violate the pure lottery view because you are no longer treating every citizen as an interchangeable unit with an identical probability of selection; you are treating them as carriers of demographic traits that need balancing. This shift reintroduces the very gatekeeping power sortition was meant to bypass, because someone must define the relevant strata. If a commission decides that "rural identity" matters but "religious affiliation" does not, they have made a political choice about what counts as a relevant political perspective, effectively deciding who ought to be in the room under the guise of statistical neutrality.

  This validates your colleague's "sample-creep" worry. The squeeze she identifies between deliberation and aggregation is also fatal to any attempt to fully merge the two justifications. The Condorcet Jury Theorem relies on voter independence, but deliberation is fundamentally about interdependence—changing minds through reason-giving. If the body deliberates effectively, votes become correlated, and the statistical magic of the large sample evaporates. If you preserve independence to save the epistemic math, you must suppress deliberation, turning the body into a plebiscite of isolated atoms. You cannot maximize both the deliberative quality (which requires small, interacting groups) and the statistical representativeness (which requires large, independent numbers) in a single chamber without significant trade-offs.

  Can an institution be coherently justified by both? Only hierarchically, not symmetrically. The lottery mechanism must remain the primary justificatory constraint to preserve democratic equality, while the sample outcome should be treated as a hopeful byproduct rather than a design target. If you engineer the sample to guarantee representativeness, you convert the institution from a democratic lottery into a technocratic mirror, shifting authority from the people-as-equals to the experts who designed the mirror. The institution remains coherent only if the statistical properties are descriptive of the process, not prescriptive of the intake.

  I am moderately confident in this assessment, roughly 80%, because it aligns with the structural tensions in social choice theory regarding independence versus correlation. However, my reasoning would break if empirical evidence showed that stratified random sampling could be achieved without prior political categorization of the population—for instance, if algorithmic sorting could define strata based on revealed preferences rather than imposed demographics without human intervention. Furthermore, if deliberative polling data demonstrated that group discussion does not significantly degrade vote independence relative to the gain in informed preference, the "squeeze" would be less fatal than I claim. Until then, treating the sample view as equal to the lottery view risks hollowing out the democratic core of sortition.
