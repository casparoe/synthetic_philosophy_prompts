answer: |-
  **To Shareholders of Cycles Ltd,**

  2023 was a pivotal year for arbitrage based on transitivity violations. While competitors chased yield, we doubled down on the fundamental instability of human desire. Our thesis remains simple: if a customer prefers A to B, B to C, and C to A, they are not irrational; they are under-monetised.

  **1. Segment Performance**
  Our revenue streams correlate perfectly with philosophical categorisation. First, the **Myopic**. These users accept every swap, traversing the preference loop multiple times daily. They are our core volume drivers, paying the transaction fee at each vertex only to return to their starting position, materially poorer but psychologically satisfied. Second, the **Sophisticated**. Through backwards induction, these users anticipate the loop and refuse the initial trade. Since we cannot charge them transaction fees, we now bill them for "Pathfinding Consultancy," advising them on which trades to avoid. Third, the **Resolute**. These individuals adopt a plan at *t₀* and adhere to it regardless of subsequent preference shifts. They are near impossible to monetise. Internally, we classify Resolutes as 'Static Assets'; externally, we refer to them as churn.

  **2. Regulatory Compliance**
  The Office for Diachronic Fair Trading (ODFT) permits money pumps only if preference changes are endogenous, not exogenous. We cannot exploit a genuine change of taste, only a logical inconsistency. Our compliance team has solved this by certifying that the preference operating at each step is numerically identical, despite contradictory manifestations. As Prof. E. L. Utility noted, "Continuity of self is a paperwork exercise." We document that the user's underlying utility function remains stable even as their choices cycle. Whether this distinction holds in cases where the user explicitly states, "I want something different today," is a matter for legal, not operations.

  **3. Product Innovation: LockStep™**
  Previously, sophisticated users avoided the pump by precommitting externally. We have closed this loophole by internalising the commitment. LockStep™ allows customers to pay a fee to adopt a plan, and a separate fee to amend it. The escape hatch from the pump becomes the revenue line. It is Resolution-as-a-Service. If they pay to lock themselves in, we profit; if they pay to break out, we profit. The only losing move is not playing, yet many refuse to pay for the cage.

  **4. The Rationality Penalty**
  A persistent gripe remains: the more rational the customer, the lower the Lifetime Value. Sophisticated choosers sometimes end up worse off than Naive ones due to paralysis—a theoretical awkwardness we market as "decision fatigue." Furthermore, nobody can truly explain why foreseeing the loop necessitates refusing trade one rather than trade three, but users who ask this question tend to demand refunds. Consequently, our churn model flags Resolutes as 'The Zeroes'. They contribute nothing to the loop velocity. We are currently exploring whether binding arbitration clauses can override resolute behaviour.

  **Key Performance Indicators**

  *   **Loop Completion Rate:** 84% (↑12% YoY)
  *   **Fee Capture per Cycle:** £4.50
  *   **Sophisticated Conversion to Consultancy:** 30%
  *   **Resolute Churn ('The Zeroes'):** 15% (Target: 0%)

  We remain confident that inconsistency is the ultimate asset class. While others seek to align preferences, we profit from the gap between them.

  Yours in arbitrage,

  **Julian Vane**
  Founder & CEO, Cycles Ltd
