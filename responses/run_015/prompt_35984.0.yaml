answer: |-
  Your hunch is astute: the field does suffer from a category error where instrumental success (Hygiene) is taken as metaphysical vindication (Ontology), and vice versa. However, I would complicate your assessment that Hygiene is in "reasonably good shape." Formally, the systems exist; philosophically, their integration with standard reasoning is fragile. If we fund Ontology without fixing the normative bridge, we produce metaphysics no rational agent can adopt. If we fund Hygiene without Ontology, we produce error-management tools that lack the revolutionary significance dialetheism claims.

  Therefore, the priority order must follow the dependency chain of rational acceptance. We must first determine how a rational agent functions in this framework (Normativity), then determine if the world actually requires it (Ontology), and finally ensure the framework integrates with existing practice (Hygiene).

  ### 1. The Normative Force of Logic in a Dialetheic Framework
  **Classification:** Dissolves Distinction (bridges Hygiene and Ontology)
  **Positioning:** Upstream of everything.
  **Tractability:** Philosophers (Epistemology/Logic).
  **Settlement Criteria:** A stable theory of assertion and belief revision that explains why rational agents should avoid inconsistency even if some inconsistencies are true, without relying on the classical principle that inconsistency entails falsity.

  **Reasoning:** This is the highest priority because it exposes the equivocation in your hunch. If contradictions can be true (Ontology), the classical norm "reject contradictions" loses its truth-based justification. Currently, many dialetheists fall back on pragmatic norms (e.g., "avoid inconsistency because it impedes inquiry"), but this often looks like an ad hoc retreat to Hygiene. Conversely, critics argue that without a truth-based norm, paraconsistent logic isn't logic at all.
  Funding this question forces researchers to articulate what logic *does*. Is it a guide to truth, or a guide to information management? If the former, dialetheism requires a new theory of truth-norms. If the latter, the Ontological claim becomes less significant. Settling this means producing a normative framework where believing a dialetheia is not irrational, yet believing everything (triviality) remains forbidden. Without this, Ontological claims are inert because no one can rationally hold them, and Hygiene claims are unmotivated because the "error" being managed is ill-defined. This is primarily philosophical work; formal systems cannot dictate norms of belief.

  ### 2. The Scope of True Contradictions Beyond Semantics
  **Classification:** Ontological Dialetheism
  **Positioning:** Downstream of Normativity, Upstream of Metaphysics.
  **Tractability:** Philosophers (Metaphysics/Philosophy of Language).
  **Settlement Criteria:** The defense of at least one compelling case of true contradiction that does not rely on self-reference (Liar) or semantic closure, resistant to context-shift or hierarchy solutions.

  **Reasoning:** This addresses the "underdeveloped part" of your hunch. The field leans heavily on the Liar paradox. Critics concede semantic quirks but deny these reflect reality. To move beyond "logical hygiene for language," researchers must identify dialetheias in vagueness, boundaries, motion, or conflicting legal obligations that cannot be dissolved by supervaluation or precisification.
  This is priority #2 because it depends on #1. If we don't know how to rationally believe contradictions, finding them in the world is useless. But assuming #1 is solvable, this is the critical test of the program's metaphysical weight. If the scope is limited to semantics, dialetheism is a theory of language, not logic or reality. If it extends to boundaries or change, it reshapes metaphysics. This is intractable for computer scientists and purely formal logicians; it requires metaphysical argumentation. Settlement looks like a consensus that a specific non-semantic paradox (e.g., the Sorites or boundary cases) is best solved by accepting a true contradiction rather than by epistemicism or many-valued gaps.

  ### 3. Classical Recapture and Embedding Conditions
  **Classification:** Logical Hygiene
  **Positioning:** Downstream of Ontology and Normativity.
  **Tractability:** Logicians and Computer Scientists (with philosophical oversight).
  **Settlement Criteria:** Formal proof that classical logic is recoverable in consistent domains without ad hoc restrictions, coupled with a philosophical explanation of why classical inference remains valid there.

  **Reasoning:** This addresses the "Hygiene" side of your hunch. You suspect this is in good shape; I argue it is formally mature but philosophically precarious. Systems like LP allow classical recapture, but the conditions under which classical logic returns must be clearly defined and non-circular. If we cannot safely recover classical mathematics and science within a paraconsistent framework, the ontology is too costly for practical adoption.
  This is priority #3 because it is an implementation detail relative to the first two. If contradictions aren't true (Ontology fails) or we can't believe them (Normativity fails), recapture is irrelevant. However, if the first two succeed, this becomes the bottleneck for acceptance in wider science. It is highly tractable for logicians/CS, but funding should require philosophical justification for the recapture mechanism, not just formal proof. Settlement is achieved when the community accepts a standard method for embedding classical reasoning within paraconsistent systems that preserves intuitive inference patterns in consistent domains.

  ### Unfunded Priorities
  For this three-year cycle, I would deliberately leave the following questions unfunded:

  1.  **"Is Paraconsistent Negation Genuine Negation?"** This debate has become a verbal stalemate. It absorbs energy without yielding progress. Researchers should be instructed to define negation by its functional role in their system rather than arguing over the label "negation." Funding this encourages terminological trench warfare rather than substantive work.
  2.  **Purely Formal System Proliferation.** Creating new variants of paraconsistent logic (e.g., tweaking valuation schemes) without a specific philosophical problem or application in view yields diminishing returns. We have enough systems; we need better interpretations and applications.
  3.  **Historical Exegesis of Dialetheic Precursors.** Unless directly tied to resolving the Normativity or Ontology questions (e.g., how Hegel handled contradiction), historical work should not be funded. The current bottlenecks are systematic, not hermeneutic.

  ### Summary of Reasoning
  The ordering prioritizes the conditions of possibility for the field. Normativity is the gatekeeper: without it, dialetheism is irrational. Ontology is the core claim: without it, dialetheism is trivial. Hygiene is the integration mechanism: without it, dialetheism is isolated. Your hunch correctly identifies the split, but the funding strategy must target the bridge between them (Normativity) before reinforcing the weaker side (Ontology).

  \answer{Paraconsistent Normativity, Extra-Semantic Dialetheias, Classical Recapture}
