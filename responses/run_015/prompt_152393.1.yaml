  2.  **Evaluate the Proposed Mechanic (Calibration Bag):**
      *   *Strengths:* Forces explicit quantification of belief. Highlights the non-additivity ($P(Red) + P(Black) < 1$). More engaging than simple A/B choice.
      *   *Weaknesses:* Can be cognitively demanding. Students might treat it as a estimation task ("How many *are* there?") rather than a preference task ("How many *would I need* to see to feel the same?").
      *   *Refinement:* The prompt suggests filling the transparent bag *in front of them* based on their number. This is logistically heavy for 14 students individually.
      *   *Adjustment:* To save time and prevent anchoring, use index cards for private commitment first. Then, select a few volunteers to physically fill the bag, or (better for time) have them write the number, collect them, and display the *distribution* of numbers on the board anonymously.
      *   *Wait, the prompt says:* "which I then actually fill in front of them." Doing this for 14 students individually takes too long (14 students * 2 colors * filling time = > 75 mins).
      *   *Solution:* Do the "filling" symbolically or with a subset. Or, better, have them write the number that *would* make them indifferent. Then ask them to sum the two numbers. The physical filling is dramatic but time-prohibitive for everyone.
