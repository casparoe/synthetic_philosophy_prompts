answer: |-
  Here is the runnable script and debrief guide. It is designed for 75 minutes, 14 students, and your specific props.

  ### Part 1: The Setup (Minutes 0–10)

  **Props:** Two opaque cloth bags (Bag X, Bag Y), box of ping-pong balls (Red/Black), index cards (two colors, e.g., White and Blue), pens, whiteboard.

  **0:00–0:05 | The Hook**
  *   **Action:** Place Bag X (Transparent/Clear container, empty for now) and Bag Y (Opaque Cloth, pre-filled with 10 balls: 5 Red, 5 Black, but *do not tell them this yet*) on the table.
  *   **Say:** "Last week we concluded that if you are rational, your choices can be modeled as maximizing expected utility relative to a *single* subjective probability measure. Today, we are testing the stability of that measure. There is no lecture for the first hour. There is only betting."
  *   **Action:** Hand out 5 raffle tickets to each student. Explain that at the end, one name will be drawn from the raffle drum. The winner gets the book token.
  *   **Say:** "You can keep your tickets, or you can spend them later on a special advantage. The more tickets you hold, the higher your chance of winning the book."

  **0:05–0:10 | The Narrative Split (Crucial)**
  *   **Action:** Distribute index cards. Half the room gets **White Cards**, half gets **Blue Cards**. (Sit them in alternating rows or left/right halves to keep track).
  *   **Say:** "Before we begin, you need to know the provenance of Bag Y (the opaque one). Read the top line of your card silently. Do not share it."
  *   **Card Text (White):** *"Bag Y was filled by a mechanical randomization device guaranteed to produce 5 Red and 5 Black."*
  *   **Card Text (Blue):** *"Bag Y was filled by a former student. They win the book token if the majority of today's class fails to double their raffle tickets."* (This creates a mild adversarial incentive without being a full game).
  *   **Say:** "Bag X (the clear one) is currently empty. I will fill it according to your instructions. Bag Y is sealed. No one may shake Bag Y. If you shake it, you are disqualified from the raffle." (This stops the physical search for information).

  ### Part 2: The Calibration (Minutes 10–40)

  **Goal:** Elicit the number of balls $N$ in a transparent bag that makes the student indifferent to betting on the opaque bag.
  **Constraint:** Do not allow discussion between rounds. Collect cards immediately.

  **10:00–20:00 | Round 1 (Red)**
  *   **Board:** Write: **"BET: You win 10 tickets if a RED ball is drawn."**
  *   **Say:** "On your card, write your name and a number between 0 and 10. This number represents how many Red balls I must put into the *Transparent* Bag X (out of 10 total balls) to make you *indifferent* between betting on Red from Bag X versus betting on Red from Bag Y."
  *   **Clarification:** "If you write 5, you are saying Bag X with 5 Reds is equal to Bag Y. If you write 3, you are saying Bag X is so much better that you only need 3 Reds to match Bag Y. If you write 8, you are saying Bag X is worse, and you need 8 Reds to make it worth your while."
  *   **Action:** Students write. **Collect all cards immediately.** Do not let them hold onto them. Put them in a box.
  *   **Anti-Anchoring:** "Do not discuss your number. If you talk, you lose your tickets."

  **20:00–30:00 | Round 2 (Black)**
  *   **Action:** Hand out fresh cards (same color as before).
  *   **Board:** Write: **"BET: You win 10 tickets if a BLACK ball is drawn."**
  *   **Say:** "Same task. How many *Black* balls must be in the Transparent Bag to make you indifferent between betting on Black from Transparent versus Black from Opaque?"
  *   **Action:** Students write. **Collect all cards immediately.**
  *   **Note:** Do not reveal Round 1 data yet.

  **30:00–40:00 | The Physical Demonstration**
  *   **Action:** Pick one student's Round 1 card at random. Read the number aloud (e.g., "4").
  *   **Say:** "Sarah wrote 4. This means she values the Opaque-Red bet the same as a Transparent bag with only 4 Reds."
  *   **Action:** Visibly count 4 Red balls and 6 Black balls into the Transparent Bag. Hold it up. Shake it.
  *   **Say:** "Look at this bag. It is objectively worse than 50/50 for Red. Yet Sarah says it feels the same as the Opaque bag. We will see if the class agrees."
  *   **Action:** Tally the class data on the board anonymously. Draw two histograms: one for Red numbers, one for Black numbers.
      *   X-axis: Number of Balls (0–10).
      *   Y-axis: Count of Students.
      *   Mark the Mean for Red ($\bar{N}_R$) and Mean for Black ($\bar{N}_B$).

  ### Part 3: The Summation & The Token (Minutes 40–55)

  **40:00–45:00 | The Arithmetic Reveal**
  *   **Action:** Hand back their pairs of cards (or ask them to look at their scratch paper if they kept a record, but ideally you return the cards).
  *   **Say:** "Add your two numbers together. $N_{Red} + N_{Black}$. Write the sum on the board at your seat."
  *   **Board:** Create a T-Chart: **"Sum of Numbers"**.
  *   **Expectation:** Under EUT (Single Measure), the sum should be 10. (If $P(Red) = p$, then $N_R = 10p$. $P(Black) = 1-p$, so $N_B = 10(1-p)$. Sum = 10).
  *   **Reality:** Most will sum to less than 10 (e.g., 4 + 4 = 8).
  *   **Say:** "If you have a single probability measure, these numbers must add to 10. If they do not, you are not acting as if you have a single probability measure. Look at the board. How many of you sum to exactly 10?" (Likely very few).

  **45:00–55:00 | The Token Auction**
  *   **Prop:** A physical coin.
  *   **Offer:** "You may purchase one **Hedge Token** for 3 raffle tickets."
  *   **Mechanic:** "If you hold this token, you do not choose which bag to bet on. You flip this coin. Heads: You bet on your chosen color from the Transparent Bag. Tails: You bet on your chosen color from the Opaque Bag."
  *   **Say:** "Why would you buy this? If you prefer the Transparent bag, this token forces you into the Opaque bag 50% of the time. That sounds bad. Unless... you suspect the Opaque bag's composition is linked to your choice."
  *   **Action:** Allow 5 minutes for them to decide. Collect tickets. Record who bought it.
  *   **Note:** The "Blue Card" (Adversarial) students should value this more (breaks the classmate's strategy). The "White Card" (Mechanical) students should value it less. This split is gold for the debrief.

  ### Part 4: The Debrief (Minutes 55–75)

  **55:00–65:00 | Mapping the Behavior**
  *   **Question 1:** "Why did your numbers not add to ten?"
      *   *Expected Answer:* "I didn't trust the opaque bag." "It felt riskier."
      *   *Your Response:* "Risk is a known probability. This was not risk. This was something else. You treated the Opaque-Red bet as *worse* than 50/50, and the Opaque-Black bet as *worse* than 50/50. You cannot hold a belief that Red is less than 50% and Black is less than 50% simultaneously. So you don't have a single belief."
  *   **Question 2:** "Did the narrative matter?" (Check the Hedge Token purchases).
      *   *Action:* Compare Token purchases between White Card (Mechanical) and Blue Card (Adversarial) groups.
      *   *Point:* If Blue bought more tokens, it confirms some 'ambiguity' was actually 'strategic uncertainty.' But if White also bought tokens (or had sums < 10), it proves the effect persists even without an adversary.
  *   **Question 3:** "Who shook the bag?"
      *   *Point:* If anyone did, they tried to convert ambiguity into risk (by listening for weight distribution). It failed. The rules of the game (and the theory) assume you cannot do that.

  **65:00–75:00 | The Theoretical Bridge**
  *   **Now you may use the forbidden words.**
  *   **Say:** "This is the **Ellsberg Paradox**. The feeling you had is **Ambiguity Aversion**. The math you broke is the **Sure Thing Principle** (or Independence Axiom)."
  *   **The Gap:** "The activity showed you *that* the single-measure model breaks. It cannot show you *how* to fix it formally. That is the homework."
  *   **Lecture Transition:** "To model this, we cannot just change the utility function. We have to change the probability measure. We need either **Non-Additive Probabilities** (where $P(R) + P(B) < 1$) or **Multiple Priors** (a set of probability measures, and you maximize the minimum). Your calibration numbers were essentially reporting your 'lower probability'."

  ---

  ### Troubleshooting Guide (What If...)

  | Scenario | What happens | What you say/do |
  | :--- | :--- | :--- |
  | **The 50/50 Move** | A student writes 5 for Red and 5 for Black. | Ask them: "If I offered you the Transparent bag with 5/5, would you switch from the Opaque bag?" If they say "Yes," then their 5 was wrong. They prefer Known 50/50 to Unknown 50/50. Ask them to revise the number to reflect *indifference*. |
  | **The Skeptic** | "You stacked the Opaque bag. It's all Black." | Point to the Narrative Split. "Half of you were told a machine filled it. Did that group also write sums less than 10?" (Usually yes). "Suspicion explains the Adversarial group, but not the Mechanical group." |
  | **The Gambler** | "I'll bet on Red for the Opaque bag. I feel lucky." | Record their number. If they write 5/5, treat as above. If they write 6 Red / 4 Black, they have a specific belief. Ask: "Would you sell that bet for a guaranteed 5 tickets?" If yes, their utility is curved, but their probability is still additive. The *sum* test catches this. |
  | **The Refusal** | "I won't gamble on the Opaque bag at all." | Record their number as 0 (or 10, depending on framing). This is the extreme case of ambiguity aversion. "You are assigning a lower probability of 0 to events you know must happen. That is the breakdown." |
  | **The Empty Bag** | "What if the Opaque bag has no Red balls?" | "Then your subjective probability for Red is 0. But do you *believe* it is 0? Or do you believe it is *unknown*? The calibration asks what you need to see to feel the same. If you need 0 balls in the transparent bag to match the opaque bag, you think the opaque bag is impossible to win. Most of you didn't write 0." |
  | **Anchoring** | Students peek at others' cards. | "That data is now contaminated. Please write 'PEEKED' on your card. I will exclude it from the board tally." (Shame works better than policing). |

  ### Limitations: Where the Activity Stops

  You asked for frankness about what this cannot deliver.

  1.  **It does not distinguish between Multiple Priors and Non-Additive Probability.**
      *   *The Gap:* A student with sums adding to 8 could be modeled as having a set of priors $[0.3, 0.7]$ and maximizing the minimum (Maxmin EU), OR as having a capacity function where $v(R) = 0.4, v(B) = 0.4$. The activity produces the same behavior for both models. You must explain the formal distinction in the lecture.
  2.  **It does not prove Violation of Independence.**
      *   *The Gap:* You have demonstrated a violation of the *consequences* of the Representation Theorem (the existence of a single measure), but you haven't walked them through the specific axiom (Independence/Sure Thing) that fails. You have to map the "Sum < 10" result back to the Independence Axiom algebraically on the board in the final 10 minutes.
  3.  **It relies on "Indifference" which is noisy.**
      *   *The Gap:* Students are bad at calibrating indifference. They might write 4 because it feels "safer" than 5, not because it is truly indifferent. The data will be noisy. Acknowledge this: "The signal is in the *direction* of the deviation (Sum < 10), not the precise integer."

  ### Advice on the Two-Stage Commitment

  **Do not use the Two-Stage (Write -> Revise) step.**
  *   **Reason:** In a seminar on rational choice, students are hyper-aware of being "tested." If you allow revision, they will not revise based on their *feeling*; they will revise based on what they think the *math* requires. They will force their numbers to add to 10 because they suspect that is the "rational" answer. You want the raw violation. The tension between their intuition (Sum < 10) and the theory (Sum = 10) is the pedagogical engine. Do not let them resolve that tension before the debrief.

