      *   **Goal:** Next session (Session 6 of 7) needs to demonstrate the failure of the *single-measure* part (Ellsberg Paradox logic) *before* telling them the theory. Students need to *feel* that an unknown bag is different from a known 50/50 bag, and that this isn't just risk aversion or suspicion of cheating.
      *   **Previous Failure:** Simple forced-choice (Bag A vs. Bag B) fell flat. Students assumed 50/50 for the unknown bag or suspected stacking.
      *   **Proposed Mechanic:** Calibration Bag. Students write down how many balls of a specific color they want in a *transparent* bag to be indifferent to betting on that color from the *opaque* bag. (Key insight: $N_{red} + N_{black} \neq 10$).
      *   **Add-ons:**
          *   Raffle ticket token to let a coin flip decide the bag (hedges ambiguity).
          *   Split narrative: Half told a classmate filled the opaque bag (adversarial), half told a mechanical process (random). Goal: Disarm "cheating" objection.
          *   Two-stage commitment (Write -> Revise)? Need to evaluate if this helps or muddies.
      *   **Deliverables:** Runnable script (minute-by-minute), board work, card instructions, raffle mechanics, anti-anchoring measures. Debrief guide (mapping moments to concepts). Troubleshooting (what if they assume 50/50, shake the bag, etc.). Limitations (where the activity stops and lecture begins).
