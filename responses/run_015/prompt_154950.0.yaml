exactly as described here, or that his rejection of judicial astrology is as sharp and consistent as Mara claims—please say so plainly and correct the dialogue's premises rather than politely complying. Otherwise, proceed with serious commitment, but indicate clearly where the interpretation remains contested in the scholarship.
