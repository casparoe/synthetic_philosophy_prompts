answer: |-
  This is a sharp philosophical dissection of the canonical Universal Basic Income (UBI). You have identified a friction point that is often glossed over in policy advocacy: the gap between the *rhetoric of sufficiency* (meeting needs) and the *mechanics of equality* (equal per-adult shares).

  Here is a reconstruction of the philosophical commitments at work, following your four steps.

  ### 1. The Implicit Theory of the Moral and Political Unit

  The canonical design—individual, flat-rate, non-indexed—presupposes a view of **Methodological Individualism** combined with a **Public/Private Split regarding Dependency.**

  **The View It Presupposes:**
  *   **The Adult as Sovereign:** The primary unit of political justice is the autonomous adult. Justice is satisfied when every adult stands in the same relation to the state: as an equal shareholder. The payment is a dividend of citizenship, not a subsidy for survival.
  *   **The Household as a Private Black Box:** The design assumes that once resources enter the household, their internal distribution is a matter of private morality or negotiation, not public justice. It presupposes that adults will (or should) pool resources to care for dependents. The state withdraws from the interior of the family to avoid policing intimate relationships.
  *   **Children as Private Responsibilities:** Children do not have a direct claim on the *basic* income in their own right. Their needs are mediated through the adults responsible for them. The state's obligation is to ensure the *adult* has the capacity to function; it is the adult's obligation to ensure the child survives.

  **The Rival Views It Rules Out:**
  *   **Needs-Based Entitlement:** This view holds that justice requires resources to track moral urgency. Since a child's need for food is as morally urgent as an adult's, a needs-based view would demand per-capita distribution or equivalence scales. The canonical design rejects this by prioritizing *equal status for adults* over *equal satisfaction of needs for humans*.
  *   **The Household as the Unit of Justice:** Traditional welfare often treats the household as the economic unit (e.g., tax units, means-tested benefits). The canonical UBI rules this out because it fears the "unit" obscures power dynamics within the home (e.g., a male head of household controlling funds).
  *   **Communitarian/Relational Accounts:** Views that see care work as a public good requiring specific compensation are ruled out. By paying the single adult and the single parent the same, the design implies that care labor is a private choice, not a public function warranting extra public remuneration.

  ### 2. Inconsistency or Underdetermination?

  Is the gap between the needs-based justification and the non-needs-based design a contradiction? **It is philosophical underdetermination, not logical inconsistency.**

  **Why it is not a strict inconsistency:**
  The design does not logically contradict the goal of "security," provided we refine the definition of security.
  *   If the justification is **"Biological Sufficiency for All Humans,"** then the design is inconsistent. A single parent with three children on one adult UBI share is materially less secure than a childless couple on two shares.
  *   If the justification is **"Civil Status and Non-Domination,"** the design is perfectly consistent. The goal is to ensure no adult is forced into dependency on a spouse, employer, or state bureaucrat. A flat per-adult amount maximizes this independence. The fact that dependents exist is treated as a private variable, not a public injustice.

  **What the design strictly presupposes vs. what it fits:**
  *   **Strict Presupposition:** The design *strictly* presupposes that the **adult individual** is the only entity to whom the state owes an unconditional, uniform material base. It presupposes that uniformity is more important than adequacy for specific configurations.
  *   **Merely Fits Well With:**
      *   *Libertarian Dividend Theory:* Fits well (everyone owns an equal share of the earth), but isn't required. A socialist could support the same design for administrative simplicity.
      *   *Feminist Autonomy:* Fits well (money in the woman's hand, not the household pot), but isn't required. A matriarchal welfare state could achieve similar ends differently.
      *   *Neoliberal Efficiency:* Fits well (no bureaucracy to assess needs), but isn't required.

  **The Verdict:** The tension you feel arises because proponents often slide between two justifications: **UBI as a Floor for Freedom** (which the design supports) and **UBI as a Safety Net for Need** (which the design undermines for large families). The design is not inconsistent, but it is **under-described** by the "meeting needs" rhetoric. It is more accurately described as "securing independent agency for adults."

  ### 3. The Presuppositions of Cash

  The requirement that the payment be **cash** rather than in-kind (vouchers, housing, food) carries heavy philosophical weight regarding epistemology and moral agency.

  **What It Presupposes:**
  *   **Epistemic Privilege of the Agent:** It assumes the recipient knows their own needs better than the state does. This is a Hayekian insight applied to welfare: the information required to allocate resources efficiently is local and tacit, not central and explicit.
  *   **Welfare as Capability, Not Outcome:** It views welfare as the expansion of *freedom to* (positive liberty), not the guarantee of *specific states of being* (e.g., being fed, being housed). It trusts the agent to convert resources into functionings.
  *   **Moral Agency:** It presupposes that recipients are moral agents capable of responsible choice. To give in-kind benefits is to treat the recipient as a child or a ward of the state who cannot be trusted with liquidity.

  **What It Excludes:**
  *   **Paternalism:** It excludes the view that the state has a right or duty to steer consumption toward "merit goods" (e.g., ensuring money is spent on nutrition rather than alcohol).
  *   **Risk-Management Welfare:** It excludes the view that welfare should act as insurance against specific risks (e.g., housing vouchers ensure you don't become homeless even if you mismanage cash). Cash allows you to become homeless if you choose (or err).
  *   **Structural Determinism:** It excludes the view that poverty is caused primarily by a lack of specific goods (e.g., "food deserts") rather than a lack of purchasing power. Cash assumes markets function well enough that money can be converted to goods.

  ### 4. Replacing the View: From Individual Dividend to Needs-Based Entitlement

  If we replace the "Adult Dividend" view with a **"Needs-Based Entitlement"** view, where the share scales with the needs of the household (including children), the design must change fundamentally.

  **Specific Design Changes:**
  1.  **Equivalence Scales:** The payment would no longer be flat. It would use a scale (like the OECD equivalence scale) where the first adult gets 1.0, additional adults get 0.5, and children get 0.3, etc.
  2.  **Unit of Assessment:** The assessment would likely shift from the *individual* to the *household* to prevent double-dipping or under-funding. You would have to declare household composition.
  3.  **Conditionality (Implicit or Explicit):** To prevent fraud (e.g., claiming children you don't have), the state would need to verify dependency status. This introduces bureaucracy and potential stigma.

  **Would It Still Be Basic Income?**
  **No.** By strict philosophical and policy definition, it would cease to be a Universal Basic Income and would become a **Guaranteed Minimum Income (GMI)** or a **Negative Income Tax (NIT).**

  *   **Loss of Universality:** If the amount varies based on need, it is no longer "universal" in the sense of uniform. It becomes targeted, even if universally *available*.
  *   **Loss of Unconditionality:** Verifying needs (number of children, housing costs) introduces conditions. You must prove your need level to get the higher amount.
  *   **Loss of Individualism:** If the payment scales to household size, the household effectively becomes the unit of distribution again, undermining the feminist/autonomy argument for individual payments.

  **The Trade-off:**
  You would gain **Adequacy** (the single parent gets enough to feed the kids) but lose **Simplicity and Liberty** (more bureaucracy, more state intrusion into family life, less individual autonomy).

  **Conclusion:**
  Your intuition is correct. The canonical UBI design is not a neutral vehicle for "meeting needs." It is a specific political technology designed to secure **equal adult status** and **non-domination**, even at the cost of **distributive adequacy** for complex households. When defenders justify it purely on "needs," they are borrowing moral capital from a needs-based theory that the design itself does not support. To make the design match the "needs" justification, you must abandon the definition of UBI itself.
