  ### Examiner's Preliminary Notes: Model Answer Key

  Before grading, I must establish what a complete answer requires, based on the prompt's stipulations and standard metaphysical rigor.

  **(a) The Grounding Objection (7 marks)**
  *   **Statement:** Truths require ontological grounding (truthmakers). If only present entities exist, past-tensed truths (e.g., "Dinosaurs existed") lack truthmakers.
  *   **Why Presentism?** Eternalists/Growing Block theorists have past entities to serve as truthmakers. Presentists do not.
  *   **Archival Assessment:** Archival presentism offers *present* truthmakers (fossils, memories).
  *   **Crucial Distinction (Singular vs. General):** A complete answer must note that archival features easily ground *general* truths ("Some creature walked here") but struggle with *singular* truths ("Churchill smoked cigars"). A fossil does not contain the *haecceity* (thisness) of Churchill. To solve this, the archival presentist must argue present traces encode specific identity, which is contentious. A complete answer notes this tension; a merely adequate answer notes the general solution; a poor answer ignores the distinction.
  *   **Full marks:** Requires identifying the singular/general problem.

  **(b) Ontological Status (6 marks)**
  *   **The Issue:** Does grounding past truths in present traces ontologically commit one to the past's existence?
  *   **Correct View:** No. A trace of X is not X. Growing Block claims past *entities* exist. Archival Presentism claims present *entities* (traces) exist. They are distinct.
  *   **Collapse Argument:** To argue it collapses into Growing Block, one must show that "having a trace" is ontologically equivalent to "the traced object existing." This is a category error.
  *   **Full marks:** Requires identifying the category mistake between truthmakers and objects.

  **(c) Relativity of Simultaneity (7 marks)**
  *   **Strongest Objection:** SR implies no privileged simultaneity slice. Presentism requires a privileged present slice. Contradiction.
  *   **Strongest Reply:** Neo-Lorentzianism (privileged frame exists but is empirically undetectable) or the claim that metaphysics need not bow to current physics (SR is not the final word on time).
  *   **Crucial Constraint:** Must keep separate: (1) Ontology (what exists), (2) A/B Theory (passage), (3) Persistence (3d/4d). The prompt explicitly warned against conflating Presentism with A-Theory.
  *   **Full marks:** Requires respecting the constraint. Conflating Presentism with A-Theory violates the exam instructions and demonstrates a misunderstanding of the logical space.

  ***

  ### Script Analysis: Paragraph by Paragraph

  **Paragraph 1 (Definitions)**
  *   *"Presentism is the view that only the present is real..."* — **(i) Correct.** Standard definition.
  *   *"So presentism is the A-theory of time... while eternalism is the B-theory..."* — **(iii) Mistaken.** Direct violation of exam stipulations ("presentism is not to be identified with the A-theory"). This is a conflation of ontology and temporal passage.
  *   *"...eternalism is in effect the same view as four-dimensionalism..."* — **(iii) Mistaken.** Direct violation of exam stipulations ("four-dimensionalism about persisting objects is a further thesis again"). Conflates ontology of time with ontology of objects.
  *   **Assessment:** Foundational conceptual errors. The student has ignored explicit instructions designed to test nuance.

  **Paragraph 2 (Grounding Objection)**
  *   *"The grounding objection says that if there are no past objects then there is nothing to make our claims about the past true..."* — **(i) Correct.** Good summary.
  *   *"It is a problem specifically for presentism because the eternalist and the growing block theorist can simply point to the past objects..."* — **(i) Correct.**
  *   *"I think this solves the grounding objection completely."* — **(ii) Defensible but under-argued.** A bold claim that requires justification regarding singular propositions.
  *   *"The archival features... are traces of those very past events... they stand in the right causal and historical relations..."* — **(iii) Mistaken/Under-argued.** Ignores the instruction to distinguish singular from general propositions. A trace grounds "someone smoked," not necessarily "Churchill smoked." The student assumes the trace carries the identity without argument.
  *   **Assessment:** Good grasp of the basic objection, but fails the specific requirement to analyze singular propositions.

  **Paragraph 3 (Collapse Argument)**
  *   *"But this shows that archival presentism is not really a form of presentism at all."* — **(iii) Mistaken.** Non sequitur.
  *   *"If the past is preserved in the present in the form of traces, then the past is not gone but stored, and a stored past is an existing past."* — **(iii) Mistaken.** Category error. A representation of a thing is not the thing. This confuses epistemology (evidence) with ontology (existence).
  *   *"That is just the growing block theory with the block redescribed in terms of traces..."* — **(iii) Mistaken.** Growing Block posits the existence of past *events*, not just present *records*.
  *   **Assessment:** Philosophically naive argument. Confuses truthmakers with truth-bearer objects.

  **Paragraph 4 (Relativity)**
  *   *"Finally, the relativity objection settles the whole dispute."* — **(ii) Defensible but under-argued.** Overstated confidence.
  *   *"Special relativity shows that simultaneity is frame-relative... so there is no absolute present..."* — **(i) Correct.** Standard statement of the objection.
  *   *"Some presentists reply by postulating a privileged foliation of spacetime, but that is simply helping oneself to the very thing physics has ruled out..."* — **(ii) Defensible but under-argued.** Dismissive of the Neo-Lorentzian reply without metaphysical justification.
  *   *"So presentism is false and eternalism is true."* — **(iii) Mistaken.** Ignores the instruction to keep ontology separate from A/B theory. The relativity objection targets the *privileged present*, but the student's reasoning relies on the earlier conflation of Presentism and A-Theory.
  *   **Assessment:** Fails the explicit constraint to separate ontology from A/B theory.

