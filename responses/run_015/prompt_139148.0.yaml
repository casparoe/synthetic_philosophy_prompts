  ### Margin Comments

  **"Presentism is the view that only the present is real..."**
  *   **Comment:** Correct definition. However, be careful: "real" is often ambiguous in this context. Stick to "exist" as per the question.

  **"So presentism is the A-theory of time... while eternalism is the B-theory..."**
  *   **Problem Type:** Conflation of two things the question asks to be kept apart.
  *   **Penalty:** -1 mark (reflected in Part A & C totals).
  *   **Note:** The question stipulation explicitly warned: "presentism is not to be identified with the A-theory". You have ignored a central constraint of the exam. One can be a Presentist B-Theorist (e.g., if one denies passage but denies future existence) or an Eternalist A-Theorist (Moving Spotlight). This conflation undermines your entire analysis.

  **"...eternalism is in effect the same view as four-dimensionalism..."**
  *   **Problem Type:** Term used in the wrong sense / Conflation.
  *   **Penalty:** -1 mark (reflected in Part C total).
  *   **Note:** Again, the prompt stated: "four-dimensionalism about persisting objects is a further thesis again". Eternalism is about *times*; 4Dism is about *objects*. You can be an Eternalist Endurantist. This is a basic category mistake in metaphysics.

  **"The grounding objection says that if there are no past objects..."**
  *   **Comment:** Good, clear statement of the objection. You understand the core problem regarding truthmakers.

  **"I think this solves the grounding objection completely."**
  *   **Problem Type:** Overstatement of a modest claim.
  *   **Penalty:** -2 marks (Part A).
  *   **Note:** You were asked to distinguish singular from general propositions. A fossil makes true "A dinosaur walked here" (general). Does it make true "T-Rex #42 walked here" (singular)? Archival features struggle with *thisness* (haecceity). You cannot claim the problem is solved "completely" without addressing how a present trace grounds a truth about a specific non-existent individual.

  **"But this shows that archival presentism is not really a form of presentism at all."**
  *   **Problem Type:** Step that does not follow.
  *   **Penalty:** -3 marks (Part B).
  *   **Note:** This is a non sequitur. Presentism requires that only present *entities* exist. Archival Presentism posits present *traces* (entities). It does not posit past *entities*. You have confused the *object* of the truth (Churchill) with the *truthmaker* (the memory).

  **"...a stored past is an existing past."**
  *   **Problem Type:** Term used in the wrong sense / Category Error.
  *   **Penalty:** -2 marks (Part B).
  *   **Note:** A map of London is not London. A trace of the past is not the past. Growing Block theory claims Churchill *himself* exists tenselessly. Archival Presentism claims a *memory of Churchill* exists. These are ontologically distinct claims. Your argument here is philosophically naive.

  **"Finally, the relativity objection settles the whole dispute."**
  *   **Problem Type:** Overstatement.
  *   **Note:** Metaphysical disputes are rarely "settled" by physics alone, as the interpretation of physics is itself metaphysical.

  **"Some presentists reply by postulating a privileged foliation of spacetime, but that is simply helping oneself to the very thing physics has ruled out..."**
  *   **Problem Type:** Defensible but under-argued.
  *   **Penalty:** -1 mark (Part C).
  *   **Note:** This is the Neo-Lorentzian reply. Dismissing it as "not a move a philosopher is entitled to make" requires argument. Many philosophers argue metaphysics can posit undetectable structure if it saves our best theories of time. You simply assert physics rules it out without addressing the metaphysical counter-claim.

  **"So presentism is false and eternalism is true."**
  *   **Problem Type:** Conflation of Ontology and A/B Theory.
  *   **Penalty:** -3 marks (Part C).
  *   **Note:** You conclude based on the conflation in your first paragraph. The Relativity Objection targets the *privileged present*. If one separates Ontology from A-Theory (as instructed), the conclusion is not this simple. You have failed to keep the questions separate as explicitly requested in the prompt.

