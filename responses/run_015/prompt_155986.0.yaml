prompt: |-
  A friend who's been reading bioethics blogs summarized the advance-directive debate like this: "The whole idea of a living will is that you sign a contract with your future self, locking in your current values so that even if dementia turns you into someone who seems happy and doesn't want treatment withdrawn, the earlier version of you still calls the shots because it's the same legal person. Critics say this is wrong because the demented patient is basically a different person with different interests, so honoring the directive is just imposing a dead stranger's prefferences on a living human being. Therefore, advance directives shouldn't be bindng at all."

  Something about this feels too neat—like there's slippage between the moral argument and the legal framing—but I can't pin it down specifially. Is this a fair summary? In particular: do defenders of precedent autonomy actually use a "contract" framing, or is that a mischaracterization? Is the "different person" objection meant to show directives are never binding, or just that they need stronger justification? And does the legal-personhood point actually do any moral work in the defense, or is it smuggled in?

  If I'm restng this on a confused premise—like assuming there's one unified "defender" view—just say so plainly. I want the audit, not a polite yes.
