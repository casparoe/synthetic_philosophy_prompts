answer: |-
  Your intuition is correct. Your friend's summary is a **caricature**, not a fair map of the debate. It creates a false dichotomy and conflates legal mechanics with moral justification.

  Here is the audit you asked for, breaking down exactly where the summary fails.

  ### 1. The "Contract" Framing is a Mischaracterization
  **Verdict:** False.
  Defenders of advance directives (ADs) do **not** typically argue from a "contract" model. A contract requires two consenting parties. In the AD scenario, the "future self" cannot consent, negotiate, or breach terms.

  *   **The Actual Argument:** The standard defense is **Precedent Autonomy** (most famously articulated by Ronald Dworkin). The argument is not that you signed a deal, but that a life has a narrative structure. Your "critical interests" (how your life story ends) outweigh your "experiential interests" (moment-to-moment pleasure) when the two conflict.
  *   **Why it matters:** Calling it a "contract" makes the defense sound legally rigid and easily dismissible. The actual moral claim is deeper: it's about the integrity of a life, not the enforcement of a signature.

  ### 2. The "Legal Personhood" Slippage
  **Verdict:** You nailed it. This is smuggled moral work.
  Your friend claims defenders argue the earlier self calls the shots *because* it's the "same legal person." This is an **is-ought fallacy**.

  *   **The Slippage:** Legal personhood is a binary status used for administrative continuity (who owns the house, who is liable for debt). It does zero moral work in justifying *why* a past preference should override a current being's suffering or contentment.
  *   **The Reality:** Serious defenders know legal continuity isn't enough. They must argue that the *moral* person persists, or that the *value of autonomy* persists even after cognitive capacity is lost. Relying on "same legal person" is a lazy shortcut that serious bioethicists avoid because it begs the question.

  ### 3. The "Different Person" Objection
  **Verdict:** Partially fair, but the conclusion is wrong.
  The "psychological discontinuity" argument (associated with philosophers like Derek Parfit and bioethicist Rebecca Dresser) is a real and serious objection. It posits that severe dementia breaks the chain of psychological connectedness, making the demented patient a "new" person.

  *   **The Error:** Your friend claims this leads to the conclusion that ADs should **never be binding.** This is a straw man.
  *   **The Actual Critique:** Most critics who accept the "different person" argument do not advocate for abolishing ADs. They argue for a **balancing test**. They suggest the AD should carry *some* weight, but not absolute veto power over the current self's well-being.
  *   **Example:** If the AD says "no antibiotics" but the demented patient is happy and treats the pneumonia as a minor inconvenience, a critic might say: "The AD matters, but not enough to let this happy being die." They argue for *limits*, not *nullification*.

  ### 4. The "Unified Defender" Premise
  **Verdict:** Confused.
  Your friend speaks as if there is one "Defender View." There isn't.
  *   **The Dworkinians:** Focus on the integrity of the life narrative (ADs bind strongly).
  *   **The Interest Theorists:** Focus on what benefits the patient now (ADs bind only if consistent with current interests).
  *   **The Legalists:** Focus on risk management and liability (ADs bind to protect doctors/families).
  Your friend's summary mashes these distinct views into a single "contract/legal" blob to make it easier to knock down.

  ### Summary Audit

  | Claim in Friend's Summary | Reality Check |
  | :--- | :--- |
  | **"It's a contract with future self."** | **False.** It's a unilateral exercise of precedent autonomy. "Contract" implies reciprocity that doesn't exist. |
  | **"Defenders rely on legal personhood."** | **Smuggled Premise.** Legal status is administrative, not moral. Using it to justify overriding current suffering is a category error. |
  | **"Critics say ADs shouldn't be binding at all."** | **Overreach.** Most critics argue for *qualified* bindingness (balancing past autonomy vs. current well-being), not total abolition. |
  | **"Demented self = Dead Stranger."** | **Rhetorical Flourish.** While some argue psychological discontinuity, few treat the demented patient as a "stranger" in policy terms; they treat them as a vulnerable ward with competing interests. |

  ### The Bottom Line
  Your friend has summarized a **internet forum debate**, not the **bioethics literature**.

  The real debate isn't "Binding vs. Not Binding." It is about **weight**. How much weight does the past self's autonomy carry when it directly contradicts the current self's experiential well-being?

  *   **Dworkin:** Autonomy wins (Critical Interests > Experiential Interests).
  *   **Dresser:** Well-being wins (or at least, gets a heavy veto).
  *   **Middle Ground:** ADs guide surrogate decision-makers but don't bind them absolutely if the clinical picture changes drastically.

  Your instinct about the "slippage" between legal framing and moral argument is the most important thing here. Don't let the "legal person" argument slide; it's the weakest link in your friend's summary.
