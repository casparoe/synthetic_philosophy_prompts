      *   *Weakness 2 (Psychology):* Prof M hates "grand theory." Calling it "performance anxiety" might sound too pop-psych.
      *   *Weakness 3 (Evidence):* The "script" metaphor is analytical, not archival. Did the Nazis actually call it a script? No. Risk of anachronism.
      *   *Weakness 4 (Excess Violence):* If it was just bureaucratic ritual, why the gratuitous cruelty (beating babies, etc.)? That breaks the "admin role" thesis.
