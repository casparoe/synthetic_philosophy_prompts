prompt: |-
  hey so im presenting my seminar paper next tuesday in the holocaust and perpetrator behavior course. my thesis is that both browning and goldhagen miss the middle mechanism: the killings were driven neither purely by situational peer pressure nor by deep ideological hatred, but by what im calling bureaucratic ritualization. the men in reserve police battalion 101 and similar units were performing a scripted administrative role, and the repetition plus paperwork created moral distance. antisemitism functioned more as a post-hoc narrative grease than as the engine, and peer pressure was less about conformity and more about collective performance anxiety - nobody wanted to be the one who broke the script in front of the others. i draw on the testimony patterns but im not claiming they were robots; im saying the script shaped what they could admit to themselves.

  the audience is my prof m, who teaches the course and likes browning but hates grand psychological theory, plus professor k who writes on intentionalism and will defend goldhagen's core point about eliminationist ideology, plus three grad students in history and one social psych postdoc who will call me out if i use modern jargon like "moral disengagement" without grounding it in the archival material. they all know the battalion 101 testimonies well and care about not anachronizing. they will interrupt.

  i need a prep sheet, not a defense essay: list the objections in the order theyll actually come, phrased the way each person would put them, ordered by how damaging they are. for each, tell me what to concede upfront, what to hold, and the two-sentence reply that has to land. flag the weakest spot in my own argument - probably the part where i have to explain why some shooters clearly exceeded the script with cruelty - and tell me how to defend that rather than hope they miss it. also include the one question im praying nobody asks, likely something about the women and child shootings being unscripted, and what to say if it comes. no bibliographies, just the prep. also i think i misspelled something earlier but whatever, im tired.
