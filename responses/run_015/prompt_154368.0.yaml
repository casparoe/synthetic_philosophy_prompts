prompt: |-
  I write novels — close third, past tense, the usual — and I've been reading Smith's Theory of Moral Sentiments in a rented cabin with one battered paperback and no library, so please don't send me off to secondary literature or hand me a reading list. What I actually want is help figuring out what I think about sympathy, since I spend my working life manufacturing it and I have alot of strong opinions about it that don't obviously add up.

  Here are my verdicts, gut-level, from drafting and from reader mail.

  1. One sock left in the drawer undoes readers. A paragraph about two hundred people dead does almost nothing. I exploit this deliberately and feel slightly bad about it.
  2. The scene where the character says nothing at all at the worst moment gets the strongest response in the book. So the biggest payoff comes where there's apparently no passion on the page to feel with.
  3. Three pages inside a genuinely bad man's head while he feels remorse, and readers are entirely with him. I think that's fine. I don't think it corrupts anybody.
  4. A character who wrecks her own life through laziness and small lies: readers go cold. Roughly the same quantity of suffering as 2, opposite response.
  5. A character who narrates her own grief for six pages: readers bail. I file that as a craft failure, not a moral one — but note it's the same suffering as 2 again.
  6. My most reliable tool is second-hand: a minor character noticing the protagonist's hands shaking gets more tears than any direct description of what the protagonist is feeling. Which is weird, because it means I'm getting readers to feel by showing somebody else feeling.
  7. Death scenes. The dead feel nothing and the reader feels the most. I tell myself the grief is really for the people in the room, but I'm not convinced that's the whole of it.
  8. Dramatic irony — reader knows the letter is a rejection, character is delighted — produces something that isn't pity and isn't fear. I'd call it dread. There's no passion onstage to enter into at all.
  9. Just writing "she was heartbroken" kills it dead. Sympathy seems to need the reader to do the imagining themselves.
  10. Big joy is thin and embarrassing to write; tiny joy lands fine — getting the window seat, the train leaving without her. Which I think cuts against the thing people always say about Smith, that we enter into cheerful passions more readily.
  11. Second person: half my readers feel it intensely, half feel handled. Exact same sentences.
  12. Twelve grieving people in a room and I feel less per person than I would for one. That seems backwards if sympathy is supposed to feed on itself.

  And the one I keep flip-flopping on: the wife who's being made a fool of and never finds out. I want readers to feel for her, I can't tell whether what I'm producing is fellow-feeling or something nastier, and I can't decide whether it's okay to write it.

  My own stab at a principle, three clauses: (a) readers feel in proportion to how much imagining the page makes them do — nothing to do with the size of the suffering, and telling them what to feel is fatal; (b) quite separately, readers warm or cool depending on whether the passion fits its cause and whether the character seems to have deserved it, and this runs independently of (a); (c) the spectator isn't impartial at all, it's a guy I built and stood in the room, usually as literally as possible.

  Test that against the twelve, tell me which clause breaks and repair it. If it turns out I need two principles — one for feeling-with and one for approval — say so and say exactly where they come apart. Tell me which of my verdicts the repaired version forces me to drop, and be honest if it's more than one. And say where Smith's own kit — sympathy, propriety, the man within the breast — already covers this and where fiction needs something added to it.

  Then give me its verdicts on cases I haven't listed: a narrator who speaks after her own death; a chapter told from a dog's point of view; a chapter told from a dog's point of view; an omniscient chapter that withholds the protagonist's inner state entirely; and a book where you're told the ending in the first sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Who:** A novelist (close third, past tense). Experienced, craft-focused, introspective.
      *   **Context:** Reading Adam Smith's *The Theory of Moral Sentiments* (TMS) in isolation (cabin, one book, no library).
      *   **Constraint:** Do *not* suggest secondary literature or reading lists. Stick to the text and the user's experience.
      *   **Goal:** Help the user figure out what *they* think about sympathy based on their 12 observed "verdicts" from writing/reader feedback.
      *   **Task:**
          1.  Test the user's proposed 3-clause principle against their 12 verdicts.
          2.  Identify breaks/failures and repair the principle.
          3.  Determine if "feeling-with" (sympathy) and "approval" (merit) need to be separate principles.
          4.  Identify which verdicts must be dropped/modified.
          5.  Map this against Smith's actual concepts (sympathy, propriety, impartial spectator).
          6.  Apply the repaired principle to 5 new cases (dead narrator, dog POV, dog POV [duplicate in prompt, treat as one or note it], omniscient withholding, spoiler opening).
      *   **Tone:** Intellectual, rigorous, craft-focused, respectful of the user's expertise, slightly philosophical but grounded in fiction writing. No fluff.

  2.  **Deconstruct the User's 12 Verdicts:**
      1.  *Specific vs. General:* One sock > 200 dead. (Scale/Imagination)
      2.  *Silence:* No passion shown > high passion shown. (Restraint/Imagination)
      3.  *Villain Remorse:* Bad man + remorse = reader alignment. (Merit/Change)
      4.  *Self-Inflicted Suffering:* Laziness/lies = reader coldness. (Merit/Desert)
      5.  *Self-Narrated Grief:* 6 pages of "I am sad" = reader bail. (Imagination/Propriety)
      6.  *Second-Hand Emotion:* Minor character noticing shaking hands > protagonist description. (Observation/Imagination)
      7.  *Death:* Dead feel nothing, reader feels most. (Object of sympathy vs. Subject)
      8.  *Dramatic Irony:* Knowledge gap = dread, not pity/fear. (Spectator position)
      9.  *Telling:* "She was heartbroken" = kills it. (Imagination)
      10. *Joy:* Big joy = embarrassing; Tiny joy = lands. (Propriety/Scale)
      11. *Second Person:* Polarizing (intense vs. handled). (Spectator imposition)
      12. *Diffusion:* 12 grievers < 1 griever. (Focus/Imagination)
      *   *Flip-Flop:* Wife made fool of, never knows. (Pity vs. Voyeurism/Merit)

  3.  **Evaluate the User's Proposed Principle:**
      *   *(a) Imagination:* Readers feel in proportion to how much imagining they do. Telling is fatal.
      *   *(b) Propriety/Desert:* Readers warm/cool based on fit of passion to cause and desert.
      *   *(c) The Spectator:* The spectator is a constructed character in the room.

      *   *Testing against Verdicts:*
          *   (a) covers 1, 2, 5, 6, 9, 12 well. (Imagination gap is key).
          *   (b) covers 3, 4, 10 well. (Desert/Propriety).
          *   (c) covers 8, 11 well. (Position of the spectator).
          *   *Tension:* Verdict 7 (Death) challenges (a) and (c). The dead feel nothing, so there's no passion to imagine *with*, yet sympathy is highest. Smith says we sympathize with the *living* mourners usually, but the user says "not convinced that's the whole of it."
          *   *Tension:* Verdict 11 (Second Person) challenges (c). If the spectator is "a guy I built," 2nd person forces the spectator to *be* the protagonist. Half hate it. Why? Because it removes the *gap* required for imagination (Clause a).
          *   *Tension:* The "Wife made fool of" case. Clause (b) says desert matters. She doesn't deserve it (warmth), but she doesn't know (no shared passion). Is it pity or contempt?

  4.  **Synthesizing Smith & Fiction:**
      *   *Smith's Sympathy:* It's not just "feeling bad for." It's "changing places in fancy." It requires an *object* (the other person's situation) and a *process* (imagination).
      *   *Smith's Propriety:* The concord between the spectator's feelings and the agent's feelings. If the agent feels too much or too little relative to the cause, sympathy breaks.
      *   *Smith's Merit:* Sympathy with the gratitude/resentment of those affected by the agent. (Do they deserve reward/punishment?)
      *   *The Impartial Spectator:* The internal judge. In fiction, this is the *narrative stance* + the *reader*.

  5.  **Diagnosing the Breaks:**
      *   **Clause (a) Break:** It assumes the *character* must feel something for the reader to imagine. Verdict 7 (Death) and Verdict 2 (Silence) show the *absence* of feeling is often more potent. The imagination works best on the *gap*, not the content.
      *   **Clause (b) Break:** It conflates "warmth/coolness" (liking the character) with "sympathy" (feeling the emotion). You can sympathize with a villain's remorse (Verdict 3) without approving of the villain. You can feel dread (Verdict 8) without any passion onstage.
      *   **Clause (c) Break:** "A guy I built." Sometimes the spectator *is* the reader, unmediated. Sometimes the narrator is the spectator. Verdict 11 (2nd Person) fails because it collapses the distance between Spectator and Agent. Smith requires *two* people to sympathize. If you force them to be one, the mechanism jams.

  6.  **Developing the Repaired Principle:**
      *   Need to separate **Sympathy (Mechanism of Feeling)** from **Approval (Judgment of Merit)**. Smith does this (Part I vs Part II of TMS).
      *   *Principle 1 (The Mechanism):* Sympathy requires a **Gap**. The reader must bridge the distance between their state and the character's state using specific, concrete cues (not abstract labels). Silence/Death works because the Gap is widest, demanding the most imaginative labor.
      *   *Principle 2 (The Judgment):* Approval depends on **Propriety** (fit of emotion to cause) and **Merit** (desert). This runs parallel. You can sympathize (feel the pain) without approving (thinking they deserve it), but sustained reading usually requires some alignment.
      *   *Refining Clause (c):* The Spectator isn't just a guy in the room. The Spectator is the **Position**. If the text forces the reader *into* the shoes (2nd person), it removes the Spectator's vantage point. The Spectator must observe the Agent.

  7.  **Addressing the "Wife Made Fool Of" Case:**
      *   This is **Pity without Sympathy** in Smithian terms. We sympathize with her *potential* grief, not her actual state (which is ignorance). It relies on Merit (she doesn't deserve this). It risks becoming voyeurism if the reader feels superior (Impartial Spectator judges the *husband*, but if the narrative lingers on her ignorance, the reader becomes the one knowing, potentially cruel).
      *   *Verdict:* It's valid but dangerous. It relies on Merit (she is innocent) to sustain Sympathy (we imagine the pain she *would* feel).

  8.  **Applying to New Cases:**
      *   *Dead Narrator:* Gap is total. Sympathy must be for the *loss of possibility* or the *survivors*. Works if the "Gap" is filled by the narrator's reflection on life, not death itself.
      *   *Dog POV:* Dog lacks human "Propriety" judgments. Reader sympathizes with *sensation* and *loyalty*, not moral desert. High imagination load (translating dog sense to human sense).
      *   *Omniscient Withholding:* Creates maximum Gap. High dread (Verdict 8). Sympathy comes from the *frustration* of not knowing, projected onto the character.
      *   *Spoiler Opening:* Shifts focus from *What* to *How*. Sympathy comes from witnessing the *march* toward the known end. Propriety of reaction becomes key.

  9.  **Drafting the Response:**
      *   *Tone Check:* Keep it sharp. Acknowledge the craft. Don't lecture on Smith, use Smith as a tool.
      *   *Structure:*
          1.  Diagnosis of the 3 Clauses.
          2.  The Split: Sympathy vs. Approval.
          3.  The Repaired Principle.
          4.  The "Wife" Verdict.
          5.  Smith vs. Fiction (Where the book ends and the novel begins).
          6.  The 5 New Cases.
      *   *Correction:* I noticed the prompt lists "a chapter told from a dog's point of view" twice. I will treat it as one case but acknowledge the duplication or just address it once robustly. Actually, looking closely: "a chapter told from a dog's point of view; a chapter told from a dog's point of view;" It is a typo in the prompt. I will address it once.
      *   *Refining the "Death" point (Verdict 7):* Smith explicitly says we can't sympathize with the dead because they have no sensation. We sympathize with the *living* around them OR we imagine what it *would be like* to be dead (which is actually imagining being alive and deprived). The user's intuition ("not convinced that's the whole of it") is right. In fiction, we sympathize with the *narrative void*.

  10. **Final Polish:** Ensure the distinction between "Sympathy" (Smith's *entering into the passions of another*) and "Approval" (Smith's *sentiment of merit*) is clear, as this seems to be the core confusion in the user's Clause (b). Clause (b) mixes "warm/cool" (liking) with "fit of passion" (propriety). These are different in TMS.

      *Self-Correction on Clause (c):* The user says "The spectator isn't impartial at all, it's a guy I built." Smith's Impartial Spectator is an *internal* construct. In fiction, the Narrator often performs this role. If the Narrator is biased, the Reader must become the Impartial Spectator. If the Text forces the Reader to be the Agent (2nd person), the Impartial Spectator has nowhere to stand. This explains Verdict 11.

      *Let's write.*
answer: |-
  You have stumbled onto the central tension in Smith without needing the footnotes. Your three clauses are strong, but they conflate two distinct mechanisms Smith spends the whole book separating: **Sympathy** (the mechanism of feeling) and **Merit** (the judgment of worth).

  Here is the diagnosis of your principle, the repair, and the verdict on your cases.

  ### I. The Diagnosis: Where Your Clauses Break

  **Clause (a): The Imagination Gap.**
  *Verdict:* **Holds.** This is your strongest insight and aligns with Smith's "changing places in fancy." Smith argues we feel nothing unless we imagine ourselves in the other's situation. Your verdicts 1, 2, 5, 6, 9, and 12 all confirm that *specificity* creates the hook for imagination, while *abstraction* (200 dead, "heartbroken") or *diffusion* (12 grievers) blocks it.
  *The Break:* It doesn't account for Verdict 7 (Death). The dead feel nothing. There is no passion to imagine. Yet the sympathy is highest.
  *The Fix:* Sympathy isn't about imagining the *character's feeling*; it's about imagining the *situation*. When the character feels nothing (death, silence), the reader's imagination works hardest to fill the void. The Gap is the engine, not the character's emotion.

  **Clause (b): Propriety and Desert.**
  *Verdict:* **Fails.** You are mixing Smith's **Propriety** (does the emotion fit the cause?) with **Merit** (does the person deserve reward/punishment?).
  *The Break:* Verdict 3 (Villain Remorse). Readers align with a bad man feeling remorse. By Merit, he deserves punishment. By Propriety, his remorse fits the crime. Sympathy flows because the *passion is proper*, even if the *man is not approved*.
  *The Break:* Verdict 4 (Laziness/Lies). Readers go cold. This isn't just about suffering; it's about the *impropriety* of the suffering relative to the cause. We don't sympathize with pain that looks self-inflicted through vice, because we cannot "enter into" the motives that led there.
  *The Fix:* Split this. **Propriety** governs whether we can enter the feeling. **Merit** governs whether we wish them well once we are there. You can sympathize with a villain's grief (Propriety) while condemning his life (Merit).

  **Clause (c): The Spectator.**
  *Verdict:* **Partial.** You say the spectator is "a guy I built."
  *The Break:* Verdict 11 (Second Person). Half your readers feel handled. Why? Because Second Person attempts to collapse the Spectator and the Agent into one body. Smith's mechanism *requires two*. There must be an Agent (sufferer) and a Spectator (observer). If you force the Reader to *be* the Agent, you destroy the distance required for Sympathy. The "guy you built" is the Narrator, not the Spectator. The Reader *is* the Spectator. If the text tells the Reader where to stand too rigidly, the Impartial Spectator (the reader's conscience) rebels.

  ### II. The Repaired Principle

  You need two principles, not one. They run parallel, like melody and harmony.

  **Principle 1: The Mechanism of Sympathy (The Gap)**
  Sympathy is generated by the **labor of imagination** required to bridge the distance between the Reader (Spectator) and the Character (Agent).
  *   **Rule:** The text must provide concrete, observable data (shaking hands, one sock) but withhold the internal conclusion ("heartbroken").
  *   **Rule:** The Gap must remain open. Silence (Verdict 2) and Death (Verdict 7) maximize the Gap, forcing maximum imaginative labor, hence maximum feeling.
  *   **Rule:** The Spectator must remain distinct from the Agent. (This kills Verdict 11 for half your audience; 2nd person forces identification, not sympathy).

  **Principle 2: The Judgment of Merit (The Concord)**
  Approval is generated by the **concord** between the Reader's emotions and the Character's motives.
  *   **Rule:** Propriety trumps Morality. A villain feeling proper remorse (Verdict 3) gains sympathy. A victim feeling improper self-pity (Verdict 5) loses it.
  *   **Rule:** Desert modulates warmth. We sympathize with the suffering (Principle 1), but we only *warm* to the character if the suffering appears undeserved or the reaction dignified (Verdict 4 vs. 2).

  ### III. Which Verdicts Must You Drop?

  You must modify **Verdict 11** and **Verdict 7**.

  *   **Verdict 11 (Second Person):** You cannot claim this is "exact same sentences." The grammatical shift changes the Spectator's position. For the half who feel "handled," you have violated Principle 1 (The Gap). You removed their ability to stand *outside* the character and judge/feel. They were forced *inside*, which triggers defense mechanisms, not sympathy. You must accept that 2nd Person is not a neutral vessel; it is a coercive stance.
  *   **Verdict 7 (Death):** You say "I tell myself the grief is really for the people in the room... but I'm not convinced." You are right to be unconvinced, but Smith is righter. You *cannot* sympathize with the dead. What you are actually doing is sympathizing with the **finality**. The reader is imagining *themselves* ceasing to exist. It is the ultimate Gap. It is not sympathy for the character; it is sympathy for the human condition, projected onto the character. Acknowledge this. It's not "grief for the dead"; it's "dread of the void."

  ### IV. The "Wife Made Fool Of" Case

  **Verdict:** It is permissible, but it relies entirely on **Merit**, not Sympathy.

  Since she never knows, there is no passion for the reader to enter into (Principle 1 is starved). You cannot generate Sympathy for her *experience*, because she experiences none. You can only generate **Pity** based on her **Innocence** (Principle 2).
  *   **The Risk:** If you linger too long, the Reader stops being a Spectator and becomes a Voyeur. The Reader knows, she doesn't. The power imbalance shifts. The Reader feels superior, not fellow-feeling.
  *   **The Fix:** To keep it ethical, you must direct the Reader's indignation toward the *deceiver*, not the *deceived*. The "Impartial Spectator" within the reader must judge the husband. If the narrative gaze lingers on her ignorance without condemning the cause of it, you are manufacturing cruelty, not sympathy.

  ### V. Smith's Kit vs. Fiction's Needs

  **Where Smith Covers It:**
  *   **Propriety:** Smith explains why Verdict 5 (narrating grief) fails. Excessive expression of grief is "improper" because the Spectator cannot bring themselves to that pitch of emotion just by imagining the cause. The character feels too much *for* the situation, so the reader feels less.
  *   **The Impartial Spectator:** This is your Reader. They are not impartial; they are *striving* to be impartial. They judge whether the character's reaction is proportional.

  **Where Fiction Needs Something Added:**
  *   **Time:** Smith's spectator judges a moment. Fiction's spectator judges a *trajectory*. We sympathize with the villain (Verdict 3) because we have seen the *change*. Smith deals in static judgments; novels deal in arcs.
  *   **Intimacy:** Smith assumes we are strangers. Close Third Person assumes we are confidants. This breaks the "Impartial" rule. We forgive flaws in a protagonist we know intimately that we would condemn in a stranger. Fiction allows **Partial Sympathy**. Smith would call this corruption; you call it character depth. Keep the corruption; it's the genre's engine.

  ### VI. Verdicts on New Cases

  Here is the application of the Repaired Principle (Gap + Merit) to your unlisted cases.

  **1. A narrator who speaks after her own death.**
  *   **Verdict:** **High Risk / High Reward.**
  *   **Why:** This violates the biological limit of Smith's sympathy (the dead feel nothing). To work, the narration must not be about *being dead*, but about *having been alive*. The Gap is the impossibility of the voice. If the narrator reflects on the life they lost with proper Propriety (no whining, clear-eyed), the Merit is high. If they haunt the living, it becomes Gothic horror (dread), not sympathy.
  *   **Craft Note:** Do not let them describe the state of death. Let them describe the memory of life. The sympathy comes from the *loss*, not the *state*.

  **2. A chapter told from a dog's point of view.**
  *   **Verdict:** **Pure Sympathy, Zero Merit.**
  *   **Why:** A dog cannot have "Propriety" in the Smithian sense (moral judgment of emotions). The reader cannot judge if the dog *deserves* its fate. Therefore, all judgment drops away. You are left with raw Principle 1 (The Gap). The reader must translate "dog sensation" into "human emotion." This is maximum imaginative labor.
  *   **Craft Note:** It will produce intense feeling (tears) but no moral satisfaction. It is a pure tear-jerker mechanism. Avoid making the dog "think" like a human; keep the Gap wide by keeping the cognition alien.

  **3. An omniscient chapter that withholds the protagonist's inner state entirely.**
  *   **Verdict:** **Dread (Verdict 8 amplified).**
  *   **Why:** This creates the maximum Gap. The Spectator sees the Action but is denied the Passion. The Reader is forced to imagine the Passion based solely on external cues.
  *   **Craft Note:** This works only if the Stakes are clear. If we don't know what they feel, we must know exactly what they stand to lose. This is the "Hemingway" effect. It produces tension, not necessarily warmth. It keeps the Reader at arm's length. Use for climaxes, not intimacy.

  **4. A book where you're told the ending in the first sentence.**
  *   **Verdict:** **Shifts Sympathy from Outcome to Propriety.**
  *   **Why:** Since the *What* is known, the Gap closes regarding plot. The Gap opens regarding *How*. The Reader's imagination shifts from "What will happen?" to "How will they bear it?"
  *   **Craft Note:** This relies entirely on Principle 2 (Propriety). We watch to see if the character's reaction to the inevitable is Proper. Do they crumble? Do they endure? Sympathy is generated by witnessing the *quality* of the suffering, not the surprise of it. This creates a tragic, classical feel rather than a suspenseful one.

  ### Summary for the Cabin

  You are not manufacturing sympathy; you are manufacturing **occasions for the reader's imagination to act.**

  1.  **Split the wires:** Sympathy is the *feeling*; Approval is the *judgment*. You can have one without the other.
  2.  **Protect the Gap:** Never close the distance completely. Silence, death, and external observation work better than internal monologue because they force the Reader to work.
  3.  **Respect the Spectator:** The Reader is the Impartial Spectator. If you force them into the shoes (2nd person) or force them to judge a victim they are voyeuristically watching (the wife), the Spectator rebels.

  Smith says we sympathize with the dead only by imagining what it would be like to be alive and deprived. You say one sock undoes two hundred dead. You are both saying the same thing: **Sympathy is not about the object; it is about the capacity of the subject to imagine.** Write for the imagination, not the heart. The heart will follow.
