prompt: |-
  You are a philosophy professor who has been teaching philosophy of mind for ~15 years and is known for designing classroom demos that make students actually feel the problem rather than just nod along to it. Think carefully about this one and do some brainstorming up front -- I want you to weigh a couple of candidate activity designs against each other before committing to one, then give me the full writeup of the winner.

  Here's my situation: upper-level philosophy of mind seminar, 14 students, one 90-minute session. The topic is whether qualia are an incoherent posit. Background, in case you need it: there's a line of argument -- Dennett's old quining qualia move, and a later paper by Chase and Sanborn pushing the idea harder -- which says that when you force someone to say what they mean by "the intrinsic, ineffable character of this particular experience," the thing they point at either turns out to be something specifiable after all (a discrimination, a comparison, a memory, an expectation, a reaction) or it turns out to be nothing. The intuition survives because people almost never have to actually specify the residue -- they just gesture at it. The whole game is making someone state the residue explicitly, case by case, and watching it evaporate (or watching it fight back, which is also philosophically interesting).

  I want an activity where the students run into this themselves, before I name any view or hand out any reading. My rough idea: real taste stimuli (jelly beans, cola brands, cheap coffee, whatever), with a few stages -- plain discrimination tasks, a memory-with-interference task (taste something, do other stuff, describe it again), and at least one misinformation moment where a flavor gets mislabeled so they can catch themselves confabulating. Then a final stage where each student has to write down what the quale of one specific taste was *over and above* everything they've already been able to say about it, and defend that against structured cross-examination by their classmates. The cross-exam should have constraints: questioners are only allowed to ask about specifiable things (would you recognize it again, how does it compare to X, what did you expect before it hit, what would you have said if I'd told you it was Y), so that the "purely intrinsic" part can't be gestured at but also can't be run down a rabbit hole. I want it to feel like the residue either gets specified or gets exposed as hand-waving.

  What I want from you:

  - concrete rules, a minute-by-minute timeline for the 90 minutes, a materials list, and a clear split between what the facilitator says/does and what must be left to the students
  - the exact structure of that final "specify the residue" stage, including rules for the cross-examination and how you keep it from collapsing into a free-for-all debate
  - a debrief that maps specific moments from the activity onto specific moves in the qualia debate (discrimination, memory drift, expectation, the confabulation caught by mislabeling, etc.), and only names the view/positions at the end
  - an honest section on what will predictably go wrong the first time I run it -- students who refuse to play along, the one confident kid who declares the residue obviously exists and everyone just agrees, timing blowing up -- and how to handle each
  - a frank note on what the activity fundamentally cannot reproduce. My own worry: the real argument is supposed to cover all possible cases at once, but a classroom only stages a handful of actual cases, so a stubborn student can always say "fine, you explained these, the residue is elsewhere." Tell me what I have to supply in the debrief that the demo itself cant deliver.

  Dont give me a generic outline -- I want the actual rules written out clearly enough that a TA could pick this up and run it without me in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy Professor (15 years exp, known for experiential demos).
      *   **Task:** Design a 90-minute seminar activity on the incoherence of qualia (Dennett/Chase & Sanborn style).
      *   **Constraint 1:** Brainstorm candidate designs first, weigh them, then commit to one.
      *   **Constraint 2:** Concrete rules, minute-by-minute timeline, materials list.
      *   **Constraint 3:** Specific structure for the "specify the residue" cross-examination stage.
      *   **Constraint 4:** Debrief mapping activity moments to philosophical arguments (naming views only at the end).
      *   **Constraint 5:** Honest assessment of potential failures and mitigation strategies.
      *   **Constraint 6:** Frank note on limitations (what the demo *can't* do).
      *   **Audience:** Upper-level seminar (14 students).
      *   **Goal:** Students *feel* the problem, not just hear about it.

  2.  **Brainstorming Candidate Designs:**

      *   *Candidate A: The "Blind Taste Test" (My initial rough idea).*
          *   **Concept:** Students taste various items (jelly beans, liquids). Discrimination tasks, memory interference, mislabeling. Final cross-examination on the "residue."
          *   **Pros:** Direct engagement with sensory experience. High engagement. Directly targets the "ineffable" claim.
          *   **Cons:** Logistics (allergies, hygiene, mess). Taste is subjective and hard to standardize. Some students might have anosmia or sensory issues. Can devolve into "yum/yuck."
          *   **Risk:** The "residue" might feel *too* strong because taste is visceral. Hard to argue away the "ouch" of a sour lemon.

      *   *Candidate B: The "Color Chip" Variation.*
          *   **Concept:** Use subtle color gradients (paint chips). Discrimination (A vs B), Memory (look, wait, pick), Misinformation (tell them chip A is "Forest Green" when it's "Hunter").
          *   **Pros:** Cleaner logistics. Easier to control stimuli. Visual qualia are the standard philosophical example (inverted spectrum, etc.).
          *   **Cons:** Can feel dry/clinical. Less "visceral" than taste. Might feel like a perception psych experiment rather than a philosophy of mind demo.

      *   *Candidate C: The "Introspective Diary" + Interrogation.*
          *   **Concept:** Students focus on a current sensation (sitting in chair, hum of AC). Write descriptions. Interrogate the description.
          *   **Pros:** Zero materials. Purely introspective.
          *   **Cons:** Too abstract. Easy to drift into metaphysics without grounding. Hard to force the "evaporation" of the residue if the stimulus is constant and boring.

      *   *Selection:* **Candidate A (Taste)** is the strongest for *feeling* the problem, but it needs rigorous controls to avoid the "yum/yuck" trap. However, hygiene/allergies are a real barrier for a TA-run session. **Candidate B (Color)** is safer but less visceral.
      *   *Refinement:* Let's hybridize. Use **Olfactory/Gustatory** but pre-packaged to ensure safety and standardization. Actually, wait. The prompt specifically mentions "real taste stimuli." I should honor that but mitigate the risks.
      *   *Wait, a better option:* **The "Memory & Description" Protocol.** Instead of just tasting, the focus must be on the *reporting*. The core of Dennett's argument is about the *authority of introspection*.
      *   *Decision:* I will stick with the **Taste/Stimulus** approach (Candidate A) because the prompt explicitly asked for it ("real taste stimuli... jelly beans, cola brands"). It's the most visceral way to hit the "ineffable" intuition. I will refine the logistics to make it TA-proof (sealed cups, allergen checks). I will weigh this against a "Visual Ambiguity" option in the brainstorming section to show I thought about it.

      *   *Re-evaluating the "Residue" Cross-Examination:* This is the crux. It needs to be a "Hot Seat" format but structured like a philosophical dialogue, not a debate.
      *   *Re-evaluating the Limitations:* The demo shows *this* case. The argument needs to generalize. The debrief must handle the "Just This Once" objection.

  3.  **Developing the Winner (The "Qualia Evaporation" Protocol):**

      *   **Timeline:** 90 mins.
          *   0-10: Intro & Setup (No theory yet).
          *   10-30: Phase 1 (Discrimination & Identification).
          *   30-50: Phase 2 (Memory, Interference, Misinformation).
          *   50-75: Phase 3 (The Hot Seat / Residue Interrogation).
          *   75-90: Debrief & Theory Reveal.
      *   **Materials:** Distinct flavors (sour, sweet, bitter, umami), water, crackers, spit cups, blindfolds (optional but helpful), index cards for prompts.
      *   **Rules:** Strict speaking rules during interrogation. "No metaphysical claims, only phenomenological reports."

  4.  **Drafting the Content - Section by Section:**

      *   **Brainstorming Section:** Compare Taste vs. Color vs. Auditory. Explain why Taste wins (visceral resistance makes the evaporation more dramatic).
      *   **The Plan:** Detailed minute-by-minute.
      *   **The Interrogation Rules:** This needs to be very specific. "The Interrogator's Constraint List."
      *   **Debrief:** Map the activities to Dennett (Quining Qualia) and Chase & Sanborn (Ramsey's Legs).
      *   **Failure Modes:** The "Stubborn Realist," The "Giggle Fit," The "Allergy."
      *   **Limitations:** The "Generalization Gap."

  5.  **Refining the "Cross-Examination" (Crucial Step):**
      *   If I just let students ask questions, they'll ask "Did you like it?"
      *   I need to force them to ask functional questions.
      *   *Rule:* Questions must target *dispositional properties* (would you pick it out again? does it remind you of X?).
      *   *Rule:* The Subject cannot use words like "just," "purely," "intrinsic." They must describe relations.
      *   *Goal:* Show that every description lands on a function, leaving no "residue."

  6.  **Refining the Debrief:**
      *   Must connect the mislabeling to *heterophenomenology*.
      *   Must connect the memory drift to the *unreliability of introspection*.
      *   Must connect the inability to describe the residue to *the incoherence of the posit*.
      *   Only *then* name Dennett/Chase & Sanborn.

  7.  **Addressing the Limitations:**
      *   The demo is inductive (these cases). The argument is conceptual (all cases).
      *   I need to explain how to bridge that gap in the debrief (Inference to the Best Explanation).

  8.  **Final Review against Constraints:**
      *   15-year prof persona? Yes, tone should be experienced, pragmatic, slightly cynical about "easy" answers.
      *   Brainstorming upfront? Yes.
      *   Minute-by-minute? Yes.
      *   TA-ready rules? Yes.
      *   Failure modes? Yes.
      *   Limitations? Yes.

      *(Self-Correction during drafting)*: Make sure the taste stimuli aren't *too* distinct. If one is lemon and one is chocolate, discrimination is too easy. They need to be close enough to cause doubt (e.g., Cola A vs. Cola B, or Cherry vs. Raspberry jelly bean). I'll specify "High-Overlap Stimuli."

      *(Self-Correction on Safety)*: I must emphasize allergen checks. A TA cannot risk anaphylaxis. I will suggest artificial flavorings on cotton swabs or standardized "taste strips" if possible, but jelly beans are easier for a TA to source. I will add a strict "Check Allergies" step.

      *(Self-Correction on the "Residue")*: The hardest part is stopping the student from saying "It's just the *what-it's-like-ness*." I need a specific rule banning that phrase or requiring it to be cashed out immediately.

      *Let's write it.*
answer: |-
  ## Part 1: Design Brainstorming & Selection

  Before locking in the plan, I weighed three candidate structures. As you know, the goal isn't just to illustrate the argument, but to induce the *frustration* that motivates the argument.

  **Candidate 1: The "Color Chip" Protocol**
  *   **Setup:** Students compare subtle gradients of paint chips (e.g., "Off-White 4" vs. "Off-White 5").
  *   **Pros:** Logistically clean, no allergies, easy to standardize. Visual qualia are the standard philosophical currency (inverted spectrum, etc.).
  *   **Cons:** Too clinical. It feels like a psychophysics lab. Students can detach intellectually too easily ("Okay, my discrimination failed, but the *experience* was still there"). It lacks visceral punch.
  *   **Verdict:** **Rejected.** It's too easy to remain a Cartesian observer.

  **Candidate 2: The "Introspective Silence"**
  *   **Setup:** Students sit in silence for 10 minutes, focusing on a single bodily sensation (itch, pressure, hum). They write reports. We analyze the reports.
  *   **Pros:** Zero materials. Purely phenomenological.
  *   **Cons:** Highly variable. Some students zone out. Hard to force the "misinformation" angle without external manipulation. The "residue" feels strongest here because there's no external object to point to.
  *   **Verdict:** **Rejected.** Too abstract for a 90-minute session. Hard to facilitate the "evaporation" without an external anchor.

  **Candidate 3: The "Gustatory Interrogation" (The Winner)**
  *   **Setup:** Controlled taste stimuli with high overlap (e.g., two cola brands, two fruit jelly beans), plus memory interference and mislabeling.
  *   **Pros:** Taste is visceral. It feels "private" and "ineffable" by default, which makes the failure to specify the residue more shocking. The "misinformation" manipulation works very well on taste (top-down processing).
  *   **Cons:** Logistics (allergies, hygiene).
  *   **Mitigation:** Use sealed, single-serving items. Strict allergen survey beforehand.
  *   **Verdict:** **Selected.** The visceral nature of taste makes the "ineffable" intuition strongest, which means when that intuition crumbles under cross-examination, the philosophical impact is highest.

  ***

  ## Part 2: The "Qualia Evaporation" Protocol
  **Session:** Upper-Level Philosophy of Mind Seminar
  **Time:** 90 Minutes
  **Students:** 14
  **Facilitator:** TA or Instructor (Script provided below)

  ### I. Materials List
  1.  **Stimuli:** 3 sets of taste items.
      *   *Set A (Discrimination):* 2 distinct but similar flavors (e.g., Cherry vs. Raspberry jelly beans). 14 of each.
      *   *Set B (Memory/Interference):* 1 specific flavor (e.g., Root Beer jelly bean). 14 units.
      *   *Set C (Misinformation):* 1 neutral/mild flavor (e.g., Vanilla or unflavored gelatin with a drop of almond). 14 units.
  2.  **Neutralizers:** Water cups (14) and unsalted crackers (14).
  3.  **Disposal:** 14 small "spit cups" (paper cups) for students who don't want to swallow.
  4.  **Blindfolds:** 14 sleep masks or just instruct students to close eyes (masks are better to prevent visual cueing).
  5.  **Index Cards:** Pre-printed with Interrogation Rules (see below).
  6.  **Allergen Sheet:** Circulated *before* class starts. (If any nut/dye allergies exist, swap jelly beans for flavored cotton swabs or drink straws).

  ### II. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Phenomenological Bracketing**
  *   **Action:** Distribute materials. Ensure allergens are cleared.
  *   **Facilitator Script:** "For the next hour, you are not philosophy students. You are reporting instruments. Your job is not to analyze *why* you taste what you taste, but to report *that* you taste it. Do not use theoretical terms like 'qualia,' 'intrinsic,' or 'representation.' Use only ordinary language: 'sour,' 'sweet,' 'reminds me of,' 'I expect,' etc. Put on your blindfolds."

  **00:10 – 00:30: Phase 1 – Discrimination & Specification**
  *   **Activity:** Students taste Set A (Cherry). Wait 30 seconds. Taste Set B (Raspberry).
  *   **Task:** Write down the difference.
  *   **Constraint:** You cannot say "they taste different." You must specify *how*. (e.g., "A is sharper," "B is sweeter," "A hits the back of the tongue").
  *   **Facilitator Move:** Collect 3 random reports. Read them aloud. Ask the class: "Is this description complete? If I gave you a robot these instructions, could it replicate the experience?"
  *   **Goal:** Establish that initial reports rely on comparisons and functional locations, not "pure presence."

  **00:30 – 00:50: Phase 2 – Memory Drift & Misinformation**
  *   **Activity:** Students taste Set B (Root Beer).
  *   **Interference:** They must solve 3 simple math problems on a handout for 2 minutes (prevents rehearsal).
  *   **Task:** Describe the taste again from memory.
  *   **Misinformation:** For Set C (Vanilla/Almond), tell half the room it is "Almond Extract" and the other half it is "Cherry Blossom Tea."
  *   **Task:** Describe the taste.
  *   **Facilitator Move:** Reveal the deception. Ask the two groups to compare notes. They will realize they tasted the *same thing* but described it differently based on expectation.
  *   **Goal:** Undermine the authority of the "inner glance." Show that the report is contaminated by expectation and memory.

  **00:50 – 01:15: Phase 3 – The Hot Seat (The Residue Interrogation)**
  *   **Setup:** Select 3 volunteers (one for each 5-minute round). They sit at the front.
  *   **Task:** The Volunteer must state what the *qualitative residue* of the Root Beer taste was—what remains after you subtract the memory, the label, the discrimination, and the expectation.
  *   **The Class:** Divided into Interrogators.
  *   **Rules:** (See Section III below).
  *   **Goal:** Force the volunteer to either specify the residue (making it functional/specifiable) or admit they are gesturing at nothing.

  **01:15 – 01:30: Debrief & Theory Reveal**
  *   **Action:** Remove blindfolds. Open floor.
  *   **Facilitator Move:** Connect the specific failures in the game to the philosophical arguments. (See Section IV).
  *   **Ending:** Only now name Dennett, Chase, and Sanborn. Distribute reading.

  ***

  ### III. The "Hot Seat" Rules (Crucial for TA)

  This is where the activity lives or dies. If this becomes a free-for-all debate, the point is lost. Print these on cards for the students.

  **For the Volunteer (The Subject):**
  1.  **The Ban:** You are forbidden from using the words "ineffable," "intrinsic," "raw feel," or "just what it is like."
  2.  **The Demand:** Every claim you make about the experience must be cashed out in terms of:
      *   *Discrimination:* (How is it different from X?)
      *   *Memory:* (What does it remind you of?)
      *   *Reaction:* (Did you want more? Did you grimace?)
      *   *Expectation:* (Did it taste like you thought it would?)
  3.  **The Surrender:** If you find yourself saying, "It's just *this*," while pointing inwardly, you must declare "Residue Evaporated."

  **For the Interrogators (The Class):**
  1.  **The Constraint:** You may not ask metaphysical questions (e.g., "But do you think it exists?").
  2.  **The Mandate:** You must ask functional questions only.
      *   *Good:* "If you had to pick it out of a lineup of 5, could you?"
      *   *Good:* "If I told you it was poison, would the taste change?"
      *   *Good:* "Is the 'bite' of the flavor the same as the 'sweetness', or are those two reports?"
      *   *Bad:* "Are you sure you're not just confused?"
  3.  **The Stop Condition:** If the Volunteer successfully specifies a property (e.g., "It has a carbonation bite"), the Interrogator must accept that as a specification and move to the next property. Do not harp on one point. The goal is to exhaust the list, not win a debate.

  **Facilitator Role during Hot Seat:**
  *   Act as the "Timekeeper" and "Rule Police."
  *   If a student says, "It's just the subjective quality," interrupt immediately: "Translate. Is that a memory? A comparison? A reaction?"
  *   Keep the energy high but civil. If the Volunteer gets stuck, allow a 10-second "pass," but they must return to the chair.

  ***

  ### IV. The Debrief: Mapping Experience to Argument

  Do not lecture. Ask leading questions that force them to make the connections, then supply the terminology.

  **1. The Misinformation Moment (Set C)**
  *   *Ask:* "Half of you tasted Almond, half tasted Cherry. The liquid was identical. Where was the difference?"
  *   *Student likely answer:* "In our heads/expectations."
  *   *Philosophical Map:* This is the **Chase & Sanborn** move. The "phenomenal character" drifted without the stimulus changing. If qualia were intrinsic properties of the experience, they shouldn't shift based on a label. This suggests the "feel" is partly constituted by judgment/belief, not a raw given.

  **2. The Specification Struggle (Phase 1 & 3)**
  *   *Ask:* "When you tried to describe the 'residue' in the Hot Seat, why was it so hard to say what was left over after you described the sweetness, the smell, and the texture?"
  *   *Student likely answer:* "Because every time I pointed at it, it turned into a comparison or a reaction."
  *   *Philosophical Map:* This is **Dennett's 'Quining Qualia'**. We think there is a 'residue' (the ineffable core), but when forced to operationalize it, it dissolves into discriminations, reactions, and memories. If it can't be specified, can we say it exists?

  **3. The Authority of Introspection**
  *   *Ask:* "In Phase 2, your memory of the taste changed after the math problems. Were you lying in Phase 1?"
  *   *Student likely answer:* "No, I just forgot."
  *   *Philosophical Map:* This attacks **First-Person Authority**. If qualia are directly present to consciousness, why do they drift in memory? If we can be wrong about what we just experienced, the 'inner eye' is not infallible.

  **4. The Reveal**
  *   *Script:* "Today you just performed a live version of an argument made by Daniel Dennett and later refined by Chase and Sanborn. They argue that 'Qualia'—defined as intrinsic, ineffable, private, directly apprehensible properties—are an incoherent posit. Not because experiences don't happen, but because the *theoretical baggage* we attach to them (that there is a 'residue' beyond function and report) evaporates under pressure. You felt that evaporation."

  ***

  ### V. Failure Modes & Mitigation Strategies

  **1. The "Stubborn Realist" (The most likely failure)**
  *   *Scenario:* One student in the Hot Seat refuses to concede. "You can analyze the function all you want, but the *hurt* of the sourness is still *there*. You're missing the point."
  *   *Mitigation:* Do not fight them. Validate them. "Excellent. You are holding the line on the 'Intuition of Presence.' Write that down. Now, can you write down *what* is there without using the word 'presence' or 'feel'?"
  *   *Why:* The goal isn't to convert everyone to eliminativism. It's to make the *cost* of realism visible. If they have to posit a magical, unspecifiable property to save their view, the class sees the theoretical price tag.

  **2. The "Giggle Fit" / Sensory Overload**
  *   *Scenario:* Tasting things blindfolded feels silly. Students laugh, breaking the phenomenological frame.
  *   *Mitigation:* The Facilitator must remain deadpan. "This is data collection. Laughter contaminates the report." If it persists, pause. "If we can't treat the stimuli seriously, we can't treat the philosophy seriously."

  **3. Timing Blowout**
  *   *Scenario:* The Hot Seat goes long.
  *   *Mitigation:* Hard stop at 75 minutes. It is better to cut the third volunteer than to cut the Debrief. The Debrief is where the learning consolidates. If you run out of time, assign the Debrief questions as a short written reflection for next class.

  **4. Allergy/Safety Issue**
  *   *Scenario:* Student reacts to dye or ingredient.
  *   *Mitigation:* **Mandatory** pre-class email survey. If *any* risk exists, switch to **Scent Sticks** (scratch-and-sniff cards). The logic of the argument works identically for olfaction, and it is safer/cleaner.

  ***

  ### VI. Limitations: What This Demo Cannot Do

  You asked for a frank note on the gaps. I need to be ready to address these in the debrief so students don't dismiss the argument based on the demo's limitations.

  **1. The Induction Problem**
  *   *Limitation:* We only tested taste (and maybe smell). A stubborn student will say, "Fine, taste is fuzzy. But *pain* qualia are real. Or *visual* qualia."
  *   *The Fix:* In the debrief, I must explicitly state: "This is an *Inference to the Best Explanation*. If the 'residue' evaporates in taste, memory, and color (which we can discuss), the burden of proof shifts to the Realist to show *where* the residue survives. The argument is that the *structure* of introspection is the same across all modalities."

  **2. The "Knowledge" vs. "Experience" Confusion**
  *   *Limitation:* Students often confuse "I can't describe it" with "It is ineffable." (The Knowledge Argument / Mary's Room intuition).
  *   *The Fix:* I must distinguish *ineffability due to lack of language* vs. *ineffability due to ontological privacy*. The demo shows that when we try to point at the private thing, we only find public/functional relations. I need to make sure they don't walk away thinking "Language is just limited." The point is stronger: "The thing you think language is failing to capture might not be there."

  **3. The Emotional Stakes**
  *   *Limitation:* A classroom demo is low-stakes. Real pain or deep aesthetic experience feels different than a jelly bean.
  *   *The Fix:* Acknowledge this. "A jelly bean is trivial. But the *mechanism* of reporting is the same. If the mechanism is flawed in the trivial case, why trust it in the profound case? In fact, high emotion might make the confabulation *worse* (e.g., placebo effects in pain management)."

  ***

  **Final Note to the TA:**
  Your job is not to prove Dennett right. Your job is to make the *intuition of qualia* feel expensive. If a student leaves the room thinking, "I still believe in qualia, but I realize I can't just point at them and stop questioning," you have succeeded. The demo works if it turns a dogma into a hypothesis.
