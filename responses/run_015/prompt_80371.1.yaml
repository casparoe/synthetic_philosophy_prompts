  # JOINT STATEMENT ON EPISTEMIC DISAGREEMENT
  **A Record of Adversarial Collaboration**

  **Date:** October 26, 2023
  **Parties:** The Conciliationist Working Group & The Steadfast Working Group
  **Subject:** Normative Responses to Peer Disagreement

  ## PREAMBLE

  We, the undersigned, represent distinct camps in the contemporary epistemology of disagreement. We acknowledge that our normative prescriptions differ. However, through this collaboration, we have identified significant common ground regarding the nature of the problem, the definition of terms, and the empirical realities of inquiry. We further acknowledge the validity of the intuition raised by our colleague from the experimental sciences: that in practical inquiry, disagreement functions primarily as a heuristic for detecting error rather than as an arithmetic operator on truth claims.

  This document serves to codify our shared commitments, isolate our precise disagreements, identify the cruxes upon which the debate turns, and propose test cases for future resolution.

  ---

  ## 1. SHARED COMMITMENTS

  Both parties affirm the following claims. Signing this document indicates agreement with these premises as the baseline for the dispute.

  1.  **The Goal of Inquiry:** The primary objective of epistemic agents is to maximize accuracy (believing what is true and disbelieving what is false) and minimize error. Neither side advocates stubbornness for the sake of ego or dialectical victory.
  2.  **The Definition of "Epistemic Peer":** We agree that an epistemic peer, relative to a specific proposition $P$, is an individual who is:
      *   Equally familiar with the relevant evidence.
      *   Equally competent in the reasoning required to evaluate that evidence.
      *   Equally free from distorting biases (to the best of our mutual knowledge).
      *   *Note:* We acknowledge that perfect peerhood is an idealization, but it serves as the necessary control condition for this debate.
  3.  **The Evidential Weight of Disagreement:** We agree that learning of a peer's disagreement provides *some* new evidence. It is never epistemically invisible. The dispute is not about *whether* it counts as evidence, but about *how much* weight it carries and *what kind* of evidence it is.
  4.  **The Priority of Specific Defeaters:** We agree with the intuition from experimental physics that if a specific source of error (a "systematic") is identified in one party's reasoning or measurement, the disagreement is resolved by correcting that error, not by averaging. Conciliationism is not a prescription to ignore specific defeaters in favor of blind compromise.
  5.  **The "No-Resolution" Scenario:** The core of our dispute concerns the "hard case": when a specific error *cannot* be identified by either party after diligent review, yet the disagreement persists. Both sides agree this is the domain where our normative prescriptions diverge.
  6.  **Credence vs. Belief:** We agree that the debate is best framed in terms of *credence* (degree of confidence) rather than binary *belief*. The question is whether credence must shift, not necessarily whether belief must be abandoned entirely.

  ---

  ## 2. PRECISE DISAGREEMENTS

  The following table isolates the normative and metaphysical claims where our positions remain incompatible. Each statement is phrased to be acceptable to the proponent of that view.

  | Domain | The Conciliationist Claim | The Steadfastist Claim |
  | :--- | :--- | :--- |
  | **Normative Force** | Upon recognizing peer disagreement regarding $P$, rationality *requires* a significant adjustment of credence toward the peer's position (typically splitting the difference), absent a specific independent defeater. | Upon recognizing peer disagreement regarding $P$, rationality *permits* maintaining one's original credence, provided one's assessment of the first-order evidence remains intact. |
  | **Nature of Evidence** | The fact of disagreement constitutes *higher-order evidence* that one has misassessed the first-order evidence. This higher-order evidence defeats the justification provided by the first-order evidence. | The fact of disagreement is a cue to re-examine first-order evidence, but it does not constitute direct evidence against $P$ itself. If the first-order evidence supports $P$, it continues to do so despite the peer's dissent. |
  | **Self-Trust** | To remain steadfast is to engage in illegitimate "epistemic bootstrapping." One cannot use one's own reasoning to validate that one's reasoning is superior to the peer's without begging the question. | To significantly lower credence solely due to disagreement is an abdication of epistemic responsibility. One must trust one's own cognitive faculties unless there is a specific reason not to. |
  | **Symmetry** | From the "view from nowhere," the situation is symmetric. Since both parties look equally reliable, there is no rational basis to privilege one's own output over the other's. | The situation is experienced from a first-person perspective. I have direct access to my own reasoning process that I do not have for my peer. This asymmetry justifies differential weighting. |

  ---

  ## 3. THE CRUXES

  We have identified three fundamental sub-questions (cruxes). Settling these would significantly alter the landscape of the debate. We evaluate the hypotheses proposed by our physicist colleague below.

  ### Crux 1: The Nature of Defeat (Higher-Order vs. First-Order)
  *   **Physicist's Hypothesis:** *Confirmed.* The user suspected this concerns whether disagreement is evidence about the proposition or about the reliability of the reasoning.
  *   **Elaboration:** Is the disagreement evidence that $P$ is false (First-Order), or evidence that *I might have messed up* evaluating $P$ (Higher-Order)?
  *   **Why it matters:** If it is purely higher-order, the Conciliationist argues it undermines the *process* that led to the belief. The Steadfastist argues that if the process was actually sound, the higher-order worry is a "false alarm" that shouldn't change the output.

  ### Crux 2: The Identification Problem (Defining the Peer)
  *   **Physicist's Hypothesis:** *Confirmed, with refinement.* The user suspected this concerns the stability of the "peer" definition and asymmetric situations.
  *   **Elaboration:** To identify someone as a peer, I must judge them to be as reliable as me. But if I judge them to be as reliable as me, and they disagree with me, logic suggests one of us is unreliable. How can I identify them as a peer *before* resolving the disagreement without circularity?
  *   **Why it matters:** If peerhood can only be established *after* the disagreement is resolved (by seeing who was right), then the "Peer Disagreement" norm applies to almost no real-world cases.

  ### Crux 3: The "Independent Access" Condition (Missed by User)
  *   **Physicist's Hypothesis:** *Partial.* The user focused on the averaging intuition. We identify a deeper methodological crux.
  *   **Elaboration:** Can an agent evaluate the reliability of their own reasoning *independently* of the reasoning itself? In physics, you check a voltmeter with a second voltmeter. In philosophy/math, you check your reasoning with... more reasoning.
  *   **Why it matters:** The Steadfastist requires that I can verify my reasoning is sound. The Conciliationist argues that in "pure" disagreement cases, I lack an independent check, forcing me to defer to the aggregate.

  ---

  ## 4. TEST CASES AND PREDICTIONS

  For each crux, we propose a concrete case. Both sides agree these cases bear on the crux. We record our predictions in advance.

  ### Case for Crux 1: The "Black Box" Calculation
  **Scenario:** Two agents are given the same complex dataset and asked to compute a derived constant $K$. Both use approved, identical algorithms (black boxes) where the internal steps are not inspectable, only the inputs and outputs. Agent A gets $K=5$. Agent B gets $K=7$. They cannot re-run the calculation (single-use tokens).
  *   **Conciliationist Prediction:** Rational credence that $K=5$ must drop significantly (toward 0.5). Since the process is opaque, the disagreement is pure higher-order evidence that the black box might be sensitive to unknown initial conditions or errors.
  *   **Steadfastist Prediction:** Rational credence that $K=5$ need not drop if Agent A has independent reason to trust their specific token instance (e.g., a "process complete" verification light). The disagreement suggests B's token failed, not necessarily A's.
  *   **Physicist's Note:** This mirrors the "conflicting measurements" intuition. If I cannot check the calibration, do I average? Or do I suspend judgment? (Note: Conciliationism often looks like suspension of judgment, which is closer to the physicist's "investigate" stance than the Steadfastist's "hold firm" stance).

  ### Case for Crux 2: The Asymmetric Peer
  **Scenario:** Agent A considers Agent B a peer. Agent B considers Agent A a *superior* (B thinks A is more likely to be right). They disagree on $P$.
  *   **Conciliationist Prediction:** Agent A should still conciliate. The objective symmetry of evidence and competence matters more than the subjective assessment. If they are *actually* peers, A must adjust, regardless of B's humility.
  *   **Steadfastist Prediction:** Agent A is permitted to be more steadfast. Since B does not claim equal reliability, the "peer pressure" is reduced. The normative force of disagreement scales with the peer's own confidence in their reliability relative to yours.
  *   **Relevance:** This tests whether "peerhood" is an objective fact or a subjective belief state.

  ### Case for Crux 3: The "Calibration Log" (Addressing the Physicist's Intuition)
  **Scenario:** Two physicists measure a particle mass. Results differ.
  *   **Variation 1:** They have access to full calibration logs and can trace every step.
  *   **Variation 2:** The logs are lost; they only have the final numbers and a reputation for past reliability.
  *   **Conciliationist Prediction:** In Variation 1, they should *not* average; they should find the error (Shared Commitment #4). In Variation 2, they *must* conciliate (widen error bars/shift mean) because the "systematic search" is impossible.
  *   **Steadfastist Prediction:** In Variation 1, they should not average. In Variation 2, they should still not average if they have internal confidence in their methodology. They should report both results as "unresolved" rather than lowering credence in their own measurement.
  *   **Relevance:** This directly addresses the user's concern. It isolates whether "averaging" is a substitute for investigation (bad science) or a rational response to the *impossibility* of investigation (epistemic necessity).

  ---

  ## 5. CONCLUSION ON THE PHYSICIST'S INTUITION

  We explicitly address the concern raised in the preamble regarding the "averaging of measurements."

  **We agree that the Conciliationist prescription is NOT analogous to reporting a false mean value as the truth.**
  *   **Conciliationist Clarification:** We do not advocate claiming the true value is the average. We advocate that the *rational confidence* in one's specific value should decrease. In physics terms: It is not shifting the central value; it is widening the error bar to encompass the peer's result.
  *   **Steadfastist Clarification:** We agree that widening the error bar is appropriate if the disagreement suggests unknown systematics. We disagree that one must shift the central value (credence) if one's own systematic analysis remains robust.

  **Joint Assessment:** The physicist's intuition that "disagreement is a signal to investigate" is correct and is accepted by both camps as the *primary* response. The philosophical debate only begins when the investigation yields no results. The Conciliationist argues that "no result found" is itself a result (indicating fallibility). The Steadfastist argues that "no result found" leaves the original evidence intact.

  ---

  **Signed,**

  _________________________
  *Lead Representative, Conciliationist Working Group*

  _________________________
  *Lead Representative, Steadfast Working Group*

  _________________________
  *Observing Consultant (Experimental Physics)*
