answer: |-
  This is an exceptionally sharp reconstruction of the dialectic. You have correctly identified that the literature is not a single argument but a palimpsest of different projects (operationalist, pragmatic, epistemic) written over the same formal theorem. Your stagnation is not a failure of reading; it is a feature of the object.

  Here is a diagnosis of why the debate does not move, an evaluation of your specific insights and variants, and an account of what progress would actually look like.

  ### 1. The Diagnosis: The Tripartite Conflation

  Your working hypothesis is correct: the debate stalls because three distinct questions are being treated as one. Let us formalize your tripartite distinction to see where the slippage occurs.

  1.  **The Formal Question:** Under what conditions does a set of betting quotients guarantee a sure loss? (Answer: When they violate probability axioms, *given specific booking rules*.)
  2.  **The Bridge Question:** What is the relationship between *credence* and *betting quotients*? (Is it constitutive, normative, or evidential?)
  3.  **The Normative Question:** Why is vulnerability to sure loss (or the structural equivalent) an *epistemic* defect?

  **The Stagnation Mechanism:**
  The literature stalls because defenders and objectors operate on different rows of this matrix.
  *   **The Operationalists (de Finetti, early Ramsey):** They collapse the Bridge Question. Credence *just is* betting disposition. Therefore, the Formal Question *is* the Normative Question. If you are booked, you are literally contradicting your own dispositions.
  *   **The Epistemic Purists (Contemporary objectors):** They accept the Formal Question but reject the Bridge. Credences are mental states that *guide* betting but are not *defined* by it. Therefore, a sure loss is a pragmatic defect, not necessarily an epistemic one.
  *   **The Hybrid Defenders (Christensen, etc.):** They try to save the Normative conclusion by weakening the Bridge. They argue that even if credence isn't *defined* by betting, a rational agent *ought* to bet according to their credences.

  **Why nothing moves:**
  When an Objector says, "I can have incoherent credences but refuse to bet," they are attacking the **Bridge**. When a Defender replies, "But if you *did* bet, you'd lose," they are retreating to the **Formal**. When the Defender says, "That shows your attitudes are defective," they are asserting the **Normative**.
  Because the Bridge premise is essentially a definition of the term "credence," the debate often dissolves into a verbal dispute about whether "credence" is a functional role (defined by behavior) or a phenomenal/representational state. As long as the literature treats the DBA as a *proof* of probabilism rather than an *explication* of a specific concept of credence, it will cycle endlessly.

  ### 2. Engagement with Your Insights

  #### Insight 1: Protocol Relativity (Ada vs. Cyrus)
  You are absolutely right, and this is the most under-appreciated formal point in the literature. The standard theorem ("Incoherence $\iff$ Dutch Bookability") is not protocol-invariant.

  *   **The Ada Case:** Ada's credences sum to 0.9. She is sub-additive. Under a standard two-sided book (buy/sell at $q$), she is vulnerable (sell the conjunction, buy the disjunction, etc.). But under a "buy-only" protocol, she is *not* booked; she declines bets that would expose her.
  *   **The Implication:** The DBA does not prove that violating axioms is irrational *simpliciter*. It proves that violating axioms is irrational *given a commitment to two-sided liquidity*.
  *   **Diagnosis:** This confirms that the **Bridge Question** is doing all the heavy lifting. To make the DBA work, one must argue that having a credence of $p$ in $H$ *entails* a commitment to buy *and* sell at $p$. Most agents (and most philosophical accounts of belief) reject this. They accept that belief guides action, but not that it fixes a precise fair price for both sides of a wager.
  *   **Verdict:** This insight exposes the DBA as dependent on a specific, controversial functionalism about credence. Papers that ignore the protocol are implicitly assuming a behaviorist psychology that few contemporary epistemologists hold.

  #### Insight 2: The Variants

  **Variant A: The Fee-for-a-Price-List**
  *   *The Move:* Pay the agent to state prices, then book them.
  *   *The Problem:* This attempts to close the "Recluse" reply (I won't bet) by making the entry cost negative (you get paid). However, it fails to solve the Bridge problem.
  *   *Why:* The Recluse can simply refuse the fee. If the Recluse says, "I do not have betting prices," paying them a penny to state them forces them to lie or guess. If they state prices they don't hold, the bookie books a *fictional* agent, not the Recluse. If the Recluse accepts the penny and states prices they *do* hold, we are back to the original problem: why must they accept the subsequent bets?
  *   *Diagnosis:* This variant tries to use pragmatic incentives to force a Bridge connection. But if the agent is rational enough to see the coming book, they will decline the penny. The only way this works is if the agent is *forced* to accept the bets after stating prices. But that force is an external constraint, not an internal irrationality. It turns the DBA into a trap, not a diagnosis.

  **Variant B: The Bookie-Free (Internal Audit)**
  *   *The Move:* Remove the money and the bookie. Focus on the inconsistency of the attitudes themselves.
  *   *The Problem:* You ask if this is secretly the Accuracy Argument. **Yes, it is.**
  *   *Why:* Once you remove the pragmatic loss (money), the "defect" must be logical or epistemic. If the defect is logical inconsistency, you are arguing for Coherence as a logical virtue. If the defect is that the attitudes misrepresent the world, you are arguing for Accuracy.
  *   *Diagnosis:* This variant reveals that the DBA's pragmatic machinery is "dispensable theatre," as you suspected. The "Internal Audit" is essentially an argument that incoherent credences are *logically* defective. But if the defect is logical, the Accuracy First program (Joyce, Pettigrew) provides a more direct metric (distance from truth values) than the betting metric (loss of utility).
  *   *Verdict:* This variant demonstrates that the DBA is a heuristic for the Accuracy Argument. It persists because the betting analogy is intuitively gripping, but philosophically, it is a less precise version of the Accuracy First project.

  ### 3. Why Nothing Moves: The "Zombie Argument" Thesis

  The DBA is a **Zombie Argument**. The original body (Operationalism) is dead. Nobody truly believes credence is *defined* by betting behavior anymore (thanks to objections about belief without betting, moral uncertainty, etc.). However, the argument keeps walking around because it serves a useful sociological and pedagogical function.

  1.  **Pedagogical Utility:** It is much easier to teach students that "incoherence leads to losing money" than "incoherence leads to dominated accuracy." The money makes the normativity feel objective.
  2.  **Sociological Function:** It marks the boundary of the "Probabilist Club." Accepting the DBA (in some form) is a shibboleth for accepting Bayesian norms.
  3.  **The Normative Gap:** The debate cannot move because the **Normative Question** ("Why is exploitability bad?") has no answer that satisfies both sides.
      *   If the answer is "Because you lose money," the Epistemic Purist says "I don't care about money, I care about truth."
      *   If the answer is "Because it indicates epistemic defect," the Pragmatist says "Then why talk about money? Just talk about the defect."

  The literature cycles because every new paper tries to patch the Bridge (e.g., "Degrees of belief *should* guide betting") without realizing that patching the Bridge just shifts the normative burden to the "should."

  ### 4. What Would Count as Progress?

  Given this diagnosis, here is an honest account of where progress lies.

  **A. Formal Progress (High Feasibility)**
  Your protocol insight is the most viable path for formal progress. A literature review that explicitly categorizes DBA results by **Betting Protocol** would be a genuine contribution.
  *   *Task:* Map the space of protocols (one-sided, two-sided, limited stake, mandatory participation).
  *   *Result:* Show exactly which axioms are enforced by which protocols. (e.g., Sub-additivity is only punishable under two-sided protocols).
  *   *Value:* This stops people from claiming "The DBA proves Probabilism" and forces them to say "The DBA proves Probabilism *for agents committed to two-sided liquidity*." This clarifies the Bridge premise.

  **B. Conceptual Progress (Medium Feasibility)**
  Explicitly abandoning the DBA as a *foundational* argument and recasting it as a *motivating* intuition for Accuracy First.
  *   *Task:* Argue that the DBA is a "proof of concept" for the norm of coherence, but that Accuracy First provides the actual justification.
  *   *Value:* This resolves the "dispensable theatre" problem. It acknowledges that the betting setup is a metaphor for epistemic utility. This aligns with the trajectory of the last 20 years (Joyce, Leitgeb, Pettigrew).
  *   *Risk:* Traditional Bayesians may resist the move to Accuracy.

  **C. Normative Progress (Low Feasibility)**
  Solving the "Why care about exploitability?" question.
  *   *Task:* Find a normative principle that links pragmatic vulnerability to epistemic irrationality without collapsing into Accuracy or Operationalism.
  *   *Value:* This would save the DBA as a unique project.
  *   *Reality Check:* This is unlikely to succeed. The link is either pragmatic (money matters) or epistemic (coherence matters). If it's pragmatic, it's not purely epistemic. If it's epistemic, Accuracy is better.

  **D. Abandonment (Highest Honesty)**
  The most rigorous conclusion for your chapter might be that the DBA, as a *foundational justification for Probabilism*, has failed.
  *   *Argument:* The DBA relies on a Bridge premise (Credence $\to$ Betting) that is false (Operationalism is dead) or question-begging (Normative Bridge).
  *   *Conclusion:* The DBA survives as a *reductio* tool (showing that *if* you bet this way, you lose) but not as a *constitutive* norm. The real work is being done by Accuracy First or Decision-Theoretic representation theorems that do not rely on actual betting.

  ### Recommendation for Your Chapter

  Do not try to solve the normative dispute. Instead, use your chapter to **dissolve** the appearance of a single debate.

  1.  **Use your Protocol Insight:** Dedicate a section to "The Protocol Dependence of Dutch Bookability." Show that Ada and Cyrus are treated differently depending on the rules. This proves the "Formal" question is not settled independently of the "Bridge" question.
  2.  **Categorize by Project:** Divide the literature not by "Pro/Con DBA," but by "Which Question are they answering?"
      *   Group 1: Operationalists (Answering: What is credence?)
      *   Group 2: Pragmatists (Answering: Why is inconsistency practically bad?)
      *   Group 3: Epistemic Purists (Answering: Why is inconsistency epistemically bad?)
  3.  **Deploy the Variants:** Use your "Bookie-Free" variant to demonstrate the migration toward Accuracy First. Argue that the "Internal Audit" version is the *philosophically honest* version of the DBA, but that it surrenders the DBA's unique pragmatic advantage.
  4.  **Final Verdict:** Conclude that the DBA is a **heuristic device** that successfully identifies incoherence but fails to **ground** the norm of coherence without auxiliary assumptions that are as controversial as Probabilism itself.

  This approach allows you to demonstrate mastery of the literature (by predicting the moves) while explaining *why* those moves are predictable (because the underlying questions are conflated). That is a genuine contribution.
