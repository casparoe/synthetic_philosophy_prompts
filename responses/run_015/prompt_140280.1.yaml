      *(Self-Correction on "Bookie-free"):* This is essentially the "Logical Inconsistency" argument (e.g., Armendt, Howson). The user asks if it's secretly Accuracy. Yes, because without pragmatic loss, the "badness" must be epistemic. If it's epistemic, Accuracy First (Joyce) is more direct.

