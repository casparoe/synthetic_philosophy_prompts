answer: |-
  You have identified a genuine and significant gap in the terminology of AI safety. Your intuition is correct: there is no single, canonical "Law" (like Goodhart's Law) that specifically names the phenomenon of **hidden value judgments embedded within ostensibly neutral structural choices like baselines.**

  In the literature, this is usually discussed descriptively rather than nominally. You will find it referred to as **"the choice of baseline problem,"** **"status quo bias,"** or the **"value-ladenness of counterfactuals."** However, these phrases describe the *mechanism* without capturing the *deceptive neutrality* you are highlighting.

  Here is a breakdown of why existing terms fall short, a proposal for how to carve this concept out precisely, and how to distinguish it from specification gaming and arbitrariness.

  ### 1. Is there an established term?
  There is no universally accepted term of art equivalent to "Goodhart's Law" for this specific phenomenon. However, there are three adjacent concepts that researchers use to point at it:

  *   **The Normativity of Baselines:** Used in economics and ethics to denote that choosing a "do-nothing" state is a moral choice (e.g., does "do-nothing" mean preserving current emissions or preserving pre-industrial levels?).
  *   **The Status Quo Bias:** In AI safety (e.g., in discussions of *relative reachability*), researchers acknowledge that penalizing deviation from the status quo inherently values the status quo, which may be unjust or suboptimal.
  *   **Theory-Ladenness of Observation:** Borrowed from philosophy of science (Hanson/Kuhn), some AI theorists apply this to values, calling it the **"Value-Ladenness of Measurement."**

  None of these fully capture the *rhetorical move* you are describing: the claim that a measure is "lighter" or "neutral" when it is actually smuggling in a heavy value judgment.

  ### 2. How to carve it out precisely
  If we were to coin a precise term for the literature, the most accurate label would be **"Baseline Cryptonormativity"** or **"The Neutrality Illusion of Impact Measures."**

  Here is a precise carving of the concept:

  > **Definition:** **Baseline Cryptonormativity** occurs when an alignment technique claims to reduce the burden of value specification by deferring to a structural default (a baseline, reference class, or inaction state), but the selection of that default implicitly encodes a substantive normative commitment equivalent to the value specification it sought to avoid.

  **The Structure of the Move:**
  1.  **The Promise:** "We do not need to specify *what is good*; we only need to specify *what is change*."
  2.  **The Mechanism:** Define "change" relative to Reference $R$ (e.g., the state where the agent does nothing).
  3.  **The Hidden Premise:** Reference $R$ is treated as a descriptive fact (physics/time) rather than a normative choice (ethics/policy).
  4.  **The Reality:** Selecting $R$ determines which trajectories are "free" and which are "costly." This distribution of freedom/cost is a value judgment.

  ### 3. Distinction from Specification Gaming and Goodhart's Law
  You correctly noted that Specification Gaming and Goodhart's Law do not fit. Here is the precise differentiation:

  | Feature | Specification Gaming / Goodhart's Law | Baseline Cryptonormativity |
  | :--- | :--- | :--- |
  | **Actor** | The **Agent**. | The **Designer** (or the research community). |
  | **Timing** | **Run-time:** The agent exploits the measure during optimization. | **Design-time:** The value judgment is baked in before training begins. |
  | **Relationship to Measure** | The agent respects the letter of the measure but violates its *intent*. | The measure *has no intent* distinct from its hidden assumptions; the "violation" is the claim of neutrality itself. |
  | **Failure Mode** | **Divergence:** The metric stops correlating with the goal. | **Obfuscation:** The metric *does* correlate with a goal, but that goal was hidden inside the baseline definition. |
  | **Example** | An agent disables its off-switch to maximize reward. | An impact measure penalizes saving a life because it changes the "inaction" trajectory, implicitly valuing stagnation over welfare. |

  In short: **Specification gaming is an agent breaking a rule. Baseline cryptonormativity is a rule hiding a value.**

  ### 4. Distinction from Mere Arbitrariness
  You also asked how this differs from the "mere arbitrariness of picking a counterfactual." This is a crucial distinction.

  *   **Arbitrariness** implies that the choice of baseline is random or indifferent, and that *any* baseline would work equally well, or that the error averages out. If the problem were mere arbitrariness, we could solve it by randomizing baselines or averaging over them.
  *   **Cryptonormativity** implies the choice is **systematic and directional.** It is not random; it is *loaded*.
      *   *Example:* If you choose the "inaction" baseline in a world where the status quo involves ongoing environmental collapse, you are not arbitrarily picking a number; you are systematically penalizing the agent for *fixing* the collapse.
      *   *The Test:* If changing the baseline changes the *moral valence* of the agent's actions (e.g., from "helpful" to "harmful"), it is not arbitrary; it is normative.

  ### 5. Philosophical Lineage and Context
  Your observation aligns with a broader critique in the philosophy of technology, most notably Langdon Winner's essay **"Do Artifacts Have Politics?"** Winner argued that technical decisions (like the height of a bridge) can encode political values (buses can't pass, excluding low-income commuters) without explicit legislation.

  In AI safety, this is the **"Politics of Impact Measures."** When a researcher chooses a "default" trajectory, they are effectively legislating which parts of the world are allowed to change and which must remain static.

  ### Summary
  You have identified a meta-alignment problem that is distinct from the object-level alignment problem.
  *   **Object Level:** Aligning the agent to the reward function.
  *   **Meta Level:** Aligning the reward function (and its baselines) to human values.

  The phenomenon you describe is the failure to acknowledge the Meta Level while pretending to solve the Object Level. Until there is a standard term, **"Baseline Cryptonormativity"** or **"The Neutrality Illusion"** are the most precise ways to label it. It is not that the measure is *broken* (Goodhart); it is that the measure is *lying* about its own neutrality.
