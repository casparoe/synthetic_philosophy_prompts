answer: |-
  ### Preliminary Reconstructions

  Before settling on an analysis, I need to test three candidate theories against the specific quirks of inquiry reports you described: the additive list of causes, the singular "root cause," and the tolerance for overdetermination ("would have happened anyway").

  **Candidate 1: The Metaphysical Pluralist View**
  This view holds that there are literally different *kinds* of causation in the world. The bullet list captures "contributory causes" (partial metaphysical drivers), while the "root cause" identifies the "efficient cause" (the primary mover).
  *Why I'm dropping it:* This fails to account for the counterfactual claims. If the "root cause" were the unique efficient cause, the report couldn't consistently admit that the outcome would have occurred without it due to background conditions (X and Y). Metaphysical pluralism usually insists on necessity for the primary cause. The practice admits the "root" wasn't strictly necessary, which undermines the metaphysical distinction.

  **Candidate 2: The Pure INUS Condition Model**
  This view suggests every item on the bullet list is an Insufficient but Necessary part of an Unnecessary but Sufficient complex. The "root cause" is simply the INUS condition that was most abnormal.
  *Why I'm dropping it:* While INUS explains the bullet list well, it treats all conditions within the sufficient complex as ontologically equal. It cannot explain the *zero-sum* fight over blame. If six factors are jointly sufficient, blaming one more than the others requires a principle outside of INUS logic. Furthermore, INUS struggles with the "would have happened anyway" claim if that implies a *different* sufficient complex was waiting in the wings (overdetermination), rendering the actual cause unnecessary even within the actual sequence.

  **Candidate 3: The Two-Tier Pragmatic Realist View**
  This view argues the practice isn't tracking a single metaphysical relation. Tier 1 (Explanation) treats causation as non-zero-sum contribution to a causal field. Tier 2 (Policy/Blame) treats causation as a selection mechanism for intervention.
  *Why I'm keeping it:* This accommodates the switch you noticed. It explains why adding causes improves explanation (filling out the field) but spreads blame (diluting the target for intervention). It handles the "would have happened anyway" claim by distinguishing between *causal contribution* (it did play a role) and *causal leverage* (fixing it won't stop recurrence).

  ---

  ### The Implicit Theory: Two-Tier Pragmatic Realism

  The practice you observe presupposes a **Two-Tier Pragmatic Realism**. It does not rely on a single unified theory of causation but rather switches operational definitions depending on the section of the report.

  **Tier 1: The Explanatory Layer (The Bullet List)**
  Here, the theory presupposes a **Causal Field Model**. There is a background of "normal" conditions (the mine operating, the train running) and a set of "deviant" conditions. The bullet list enumerates the deviations.
  *   **Work done by INUS:** The idea of INUS conditions is implicitly used here to license the bullet list. It allows writers to list factors that were not individually sufficient (the maintenance schedule alone didn't crash the train) but were necessary components of the actual disaster sequence. It validates the intuition that explanation is additive: listing more deviations provides a more complete map of how the normal field was disrupted.
  *   **Where INUS fails:** INUS does not settle which deviation matters most. Ontologically, a failed brake is equal to a tired driver if both are necessary parts of the sufficient complex. The practice, however, demands a hierarchy.

  **Tier 2: The Prescriptive Layer (The Root Cause & Recommendations)**
  Here, the theory switches to an **Interventionist Model**. The question changes from "What happened?" to "What do we fix?"
  *   **Causal Credit:** This is where the model becomes **zero-sum**. Responsibility and policy resources are finite. To recommend a fix, the inquiry must identify the point of highest *leverage*.
  *   **Counterfactual Slack:** You asked if importance is measured by how much of the world you'd have to change. Yes. A cause is promoted to "Root Cause" not because it was the most metaphysically potent, but because it represents the most *stable* intervention point. If the report says, "Even if maintenance had been followed, failure would have occurred due to design," they are signaling that maintenance has low counterfactual slack (low leverage). The design has high slack.
  *   **The Switch:** The practice switches from Tier 1 to Tier 2 exactly at the transition from "Findings" to "Recommendations." In Findings, causes are non-exclusive contributions. In Recommendations, causes are competitive levers.

  **Strictly Presupposed Claims**
  For this practice to make sense, it must assume:
  1.  **Distinction between Contribution and Selection:** There is a logical gap between identifying a factor that contributed to an event and selecting that factor as the target for prevention.
  2.  **Normative Baseline:** There exists a definable state of "normal operation" against which causes are identified as deviations.
  3.  **Overdetermination is Real:** The physical world allows for multiple sufficient paths to the same outcome (hence "would have happened anyway").

  **Merely Compatible Theories**
  These theories fit the data but aren't required by the practice:
  1.  **Probabilistic Causation:** Fits the "probably still have occurred" language, but the practice could work with deterministic claims too.
  2.  **Contrastive Explanation:** Fits the "Why this disaster rather than safety" structure, but doesn't explain the zero-sum blame game.
  3.  **Process Theory:** Fits the narrative flow, but doesn't explain the abstraction of the bullet list.

  **Ruled Out Views**
  The practice quietly excludes:
  1.  **Strict Sine Qua Non (But-For) Necessity:** If this were true, the "would have happened anyway" admission would disqualify the factor from the cause list entirely. It doesn't.
  2.  **Causal Monism:** The idea that one definition of cause must apply to both the bullet list and the root cause line. The practice violates this constantly.

  **The Sharpest Tension**
  The contradiction lies in calling a factor a "cause" in the explanatory section while admitting it lacks necessity, then treating it as a candidate for "the cause" in the blame section. The practice asserts metaphysical contribution while simultaneously denying counterfactual dependence.

  **Redundancy Discount**
  The practice applies a **partly** redundancy discount. Redundant causes (back-up mechanisms) are retained for the explanatory record (Tier 1) to ensure completeness but are discounted for responsibility and policy (Tier 2) because they lack leverage.

  **The Strongest Rival: Strict Interventionism**
  If the report were written under a consistent Strict Interventionist view (e.g., Woodwardian), it would refuse to name a single "root cause." Instead, it would present a network of variables ranked by the cost-effectiveness of intervening on them. The narrative would not seek a singular story but would quantify the probability reduction associated with each potential fix, avoiding the moral weight of "the cause" entirely.

