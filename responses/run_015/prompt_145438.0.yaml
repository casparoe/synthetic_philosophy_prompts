prompt: |-
  hey — you're a professional philosopher who actually works on causation and historical explanation, so please slow down and think this through properly rather than pattern-matching: brainstorm two or three candidate reconstructions of what's going on before you commit to one, and say out loud why you dropped the ones you dropped.

  Here's what I keep tripping over. I help draft reports for public inquiries — the kind set up after a big disaster: a mine collapse, a rail crash, a hospital scandal. The format is basically fixed and everyone treats it as obvious. There's a section called "the causes," which is a bullet list of maybe six to ten things. There's a single line identifying "the root cause." And then, all over the narrative, the writers say things like "even if the maintenance schedule had been followed, the failure would probably still have occurred, given X and Y" — and nobody seems to notice that this sits badly with calling anything *the* cause. It's the same shape as a school-textbook spread on the causes of the First World War: alliances, imperialism, militarism, nationalism, the arms race, and then the assassination at Sarajevo as the "spark" — right next to the line that the war would have happened anyway sooner or later.

  What's weird to me is how unlike a courtroom this is. In law, causation is standardly a but-for matter, and there's a whole awkward machinery for the cases where two independent causes would each have been sufficient on their own. Historians and report-writers don't seem to have that problem at all: they add causes and the explanation gets *better*, not weaker. And yet when we get to blame and recommendations, adding causes suddenly seems to spread responsibility around, and everyone starts fighting about "the" cause again — as if there were a fixed budget of causal credit being divided up.

  So: what theory of causation does this practice presuppose? A difference-making view, a production/process view, or something else? Does it presuppose that causal credit is zero-sum, so that naming another cause necessarily dilutes the first, or does it treat causes as non-exclusive — and if it does both, where exactly does it switch? Does it quietly assume that a cause's importance is measured by something like counterfactual slack, i.e. how much of the world you'd have to change to prevent the outcome, rather than by whether the outcome would have happened without it? And does the practice apply what I'd call a redundancy discount — do we count something as less of a cause once we learn there were back-up mechanisms that would have produced the same result on their own?

  Please reconstruct the implicit theory; separate what the practice strictly can't make sense without from what it merely fits well with; tell me where several rival theories would license exactly the same practice; name the sharpest place where the parts of the practice contradict each other; and say concretely what a report would look like if it were written under the rival view you think is strongest. I don't want citations or reading lists, I want the argument. And don't just recite labels at me — someone mentioned "INUS conditions" and I want to know what work that idea actually does here, if any, and where it definately does not settle anything.

  After the write-up, compress the whole thing into a single JSON object with these fields:

  - "strictly_presupposed": array of 2–4 claims the practice could not make sense without
  - "merely_compatible": array of 2–4 theories that would license the practice but aren't required by it
  - "ruled_out": array of 1–3 views the practice quietly excludes
  - "causal_credit_model": string, one of "zero-sum", "non-zero-sum", or "switches", followed by one sentence of justification
  - "sharpest_tension": string, two sentences max
  - "redundancy_discount": string, "yes", "no", or "partly", plus one sentence
  - "rival_view": string, naming the strongest rival you considered
  - "report_under_rival": string, 2–3 sentences on what the report would look like
  - "confidence": integer from 0 to 100
