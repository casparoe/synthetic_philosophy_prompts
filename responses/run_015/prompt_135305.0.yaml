  **Precedent Analysis**

  *   **Closest Analog:** **2022 (Dormancy Case).** Like Proposal 61, the 2022 case involved a mutable mechanism (Rule 202 dormancy) attempting to bypass the protections of an immutable rule (Rule 102). The Court struck it down, holding that procedural workarounds cannot suspend substantive protections. Proposal 61 is a procedural workaround (changing Rule 201) attempting to bypass a substantive protection (Rule 101).
  *   **Distinguishable Precedent:** **2019 (The Self-Harming Proposal).** The 2019 case is distinguishable because the earlier clause *harmed* the later clause (raising the bar made passage harder). Here, the earlier clause *helps* the later clause (lowering the bar makes passage easier). The Court has never validated a "self-help" mechanism where a proposal validates its own most controversial clause. A real court would view this as circular and suspect, distinguishing it from the 2019 "self-harm" which was merely procedural cleanup.

  ***

  **Implications of Upholding Both**

  If the Court upholds both clauses, they commit to the proposition that **entrenchment is temporary.** Rule 101 would survive exactly one more proposal. In the next round, a player could introduce Proposal 62: "Rule 101 is amended to require a simple majority." With Rule 201 now requiring only 2/3 for immutable changes, Proposal 62 would pass with 6 votes, effectively deleting the concept of immutability from the game. There is no stopping point; the "immutable" label becomes a speed bump rather than a wall.

  ***

  **The Discriminating Case**

  To test the Court's actual limit, a player should draft **two separate proposals spaced one round apart.**

  *   **Round 1:** "Rule 201 is amended to require 2/3 for immutable changes." (Passed 6–2).
  *   **Round 2:** "Rule 102 is amended to lower win threshold to 100." (Passed 6–2).

  If the Court strikes Round 2, they confirm that a mutable rule *never* governs immutable amendment conditions, regardless of timing (The 2022 Doctrine). If they uphold Round 2, they confirm that the *only* sin of Proposal 61 was the simultaneity (The 2019 Doctrine). This isolates whether the Court objects to the *mechanism* or the *timing*.

  ***

  **The Doctrine**

  "A system's ordinary rules cannot rewrite the locks on its own foundation unless the key for those locks is turned first."
