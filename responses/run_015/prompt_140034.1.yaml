answer: |-
  What you are seeing is sharp, and it is good that you are noticing it because it means you are both looking at the structure of the argument rather than just the content. The short answer is that there is no single word that captures both the timeline slicing and the character flipping together, but there are two very well-established concepts that describe each half of what you are watching, and knowing them helps explain why the debate feels like it is spinning in place.

  The second thing you noticed, where the side she is arguing for is described by their circumstances and the side she is arguing against is described by their character, has a very specific name in social psychology. It is called the Fundamental Attribution Error, though sometimes it is referred to as the Actor-Observer Bias. I am highly confident in this identification because it is one of the most robust findings in social science. The mechanism is exactly as you described it. When we explain our own behavior, or the behavior of people we are identifying with, we look at the situational factors, the constraints, the fears, and the history that forced our hand. We see the context. When we explain the behavior of an opponent or an outsider, we skip the context and attribute the action to their internal disposition, their personality, or their essential nature. We see the character. This happens automatically and unconsciously, which is why your daughter does it even when she is arguing honestly and switching sides. It is not lying; it is how human brains reduce cognitive load when processing conflict. In a divorce or a fight between siblings, this is exactly the same animal. One child says I hit him because he took my toy, which is situational, and the parent says you hit him because you are being aggressive, which is dispositional. The mechanism is identical to the Cold War debate.

  The first thing you noticed, where the argument depends entirely on where the story begins, is slightly harder to pin to a single label but is equally recognized in the philosophy of history. This is often discussed under the problem of Infinite Regress in Causality or simply as Periodization Bias. I am moderately confident in this terminology, as it is less of a fixed law than the attribution error, but it accurately describes the mechanism. History is a continuous flow, but human beings understand the world through stories, and stories require a beginning, a middle, and an end. To tell a story about who started a conflict, you must cut the timeline at a specific point. Whoever controls the start date controls the assignment of guilt. If you start in 1947, the Truman Doctrine looks like an initiation. If you start in 1917, the Truman Doctrine looks like a containment of a decades-long ideological project. Neither date is objectively wrong, but they are objectively arbitrary. This is not quite whataboutism, because whataboutism is a deflection tactic used to avoid answering a charge. What your daughter is doing is establishing a frame of reference. It is more like choosing a coordinate system in physics. If you choose a coordinate system where the Earth is stationary, the sun moves. If you choose one where the sun is stationary, the Earth moves. The facts of the motion do not change, but the description of who is moving depends entirely on where you plant the flag of zero.

  When you put these two together, the combination is often just called Narrative Framing or Historical Constructivism. I am less sure about whether there is a more specific unified term for the intersection of these two biases in historical debate, and I want to flag this as the part I am least certain about. There may be niche terminology in historiography that combines the attribution error with periodization, but in general discourse, these are treated as separate tools that work in tandem. The attribution error makes the opponent seem inherently dangerous, and the periodization bias makes their actions seem like the first strike. Together, they create a self-sealing logic where the side you are arguing for is always reacting to the inherent nature of the side you are arguing against, provided you start the clock at the right moment.

  This brings us to the question you actually care about, which is whether naming this settles the issue of whether who started it is a well-posed question. The honest answer is that naming it does not solve the history, but it does reveal that the question is likely ill-posed in the way a physics question might be ill-posed if it lacks a frame of reference. If causality is a chain that goes back forever, then there is no first cause that is not itself an effect. Therefore, asking who started it is asking for a fact that does not exist in the historical record. It exists only in the narrative constructed around the record. Telling your daughter this does not mean she cannot win the debate, because debates are won on framing as much as facts. But it does mean she can argue with more integrity if she acknowledges the frame. She can say that within the frame of 1945 to 1950, the Soviet Union made the first move, while acknowledging that this frame excludes 1917. This moves the debate from who is lying to which frame is more useful for understanding the conflict, which is a much more mature historical question.

  You asked where this tips over into bad faith or propaganda. It tips over when the speaker claims their frame is the only possible frame, or when they deny the situational factors of the opponent while insisting on the situational factors of their own side as objective truth rather than perspective. If your daughter says the Soviets were inherently expansionist and denies any evidence of their security concerns, she is crossing into bad faith. If she says the Soviets acted in ways that expanded their border, and explains this through their security concerns when arguing their side but through inherent expansionism when arguing the American side, she is simply demonstrating the bias we all have. The edge is at the claim of exclusivity. Propaganda relies on the audience not noticing the frame. Education relies on making the frame visible.

  So for Thursday, you can tell her that she is encountering the Fundamental Attribution Error on the character side and the Problem of Infinite Regress on the timeline side. You can tell her that this is not unique to her or to the Cold War, but is how humans process conflict, from the playground to the superpowers. You can tell her that knowing this does not mean she cannot argue the case, but it means she should argue the case by defending the start date and the level of description as choices, not as discovered facts. If she can explain why 1947 is a better place to start the story than 1917 for the purpose of understanding the Cold War, she will likely do better than if she tries to prove 1947 is the absolute truth. This approach respects the complexity she has already noticed without paralyzing her ability to speak.
