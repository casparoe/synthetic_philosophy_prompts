answer: |-
  # Taxonomy of Interpretive Positions on *Perpetual Peace*

  ## Root Commitment
  **Accepted Premise:** The reader accepts Kant's distinction between the **Preliminary Articles** (conditions to cease hostilities and reduce military capacity) and the **Definitive Articles** (conditions to establish a lasting peace through republican constitutions, a federation of states, and cosmopolitan right).

  ---

  ## The Decision Tree

  To locate a specific interpretive position, answer the following five nodes in sequence. Each node represents a point of genuine divergence regarding the application of Kant's principles to concrete political problems.

  ### Node 1: Coercive Intervention for Reform
  **Scenario:** A democratic republic faces an existential threat from an autocratic neighbor. Preemptive intervention is the only available path to force the neighbor into a republican constitution, thereby allowing them to join the federation of peace.
  **Question:** Is coercive intervention to enforce republican reform permissible under the Preliminary Articles?
  *   **Branch A:** **Permissible** (The end of perpetual peace justifies temporary violation of non-interference).
  *   **Branch B:** **Impermissible** (Non-interference in another state's constitution is an absolute constraint, regardless of the threat).

  ### Node 2: Ontology of Nature's Guarantee
  **Scenario:** Commercial interdependence clearly reduces the incentive for war, but it requires global supply chains that erode local sovereignty and create new dependencies.
  **Question:** How should the "Guarantee of Perpetual Peace" provided by Nature (via commerce and conflict) be ontologically classified?
  *   **Branch A:** **Empirical-Causal** (Commerce mechanically causes peace through self-interest; the guarantee is a prediction of human behavior).
  *   **Branch B:** **Transcendental-Regulative** (The guarantee is a necessary postulate of practical reason, not a causal law; it guides action but is not empirically observable).
  *   **Branch C:** **Performative-Constitutive** (The guarantee is an act of public reason; asserting the guarantee helps constitute the political reality it describes).

  ### Node 3: Federation vs. World-State
  **Scenario:** The federation of states develops a permanent arbitration court with genuinely binding decisions over members, enforceable by sanctions.
  **Question:** Has this court crossed the line into the illegitimate "world-state" (universal monarchy) that Kant rejects?
  *   **Branch A:** **Yes, Illegitimate** (Binding enforcement dissolves state sovereignty and creates a soulless despotism).
  *   **Branch B:** **No, Legitimate Substitute** (A binding court is the necessary "negative substitute" for a world-state to ensure law is not merely advisory).

  ### Node 4: Scope of Cosmopolitan Hospitality
  **Scenario:** Climate displacement makes a region permanently uninhabitable. The displaced population seeks entry into a wealthy member of the federation.
  **Question:** Does cosmopolitan hospitality extend only to temporary sojourn, or does it generate positive obligations of admission and resettlement?
  *   **Branch A:** **Temporary Sojourn Only** (Right to visit, not to inhabit; admission remains at the discretion of the host state).
  *   **Branch B:** **Positive Obligation** (Right to reside; severe displacement creates a duty of admission to preserve the possibility of communal existence).

  ### Node 5: Strategic Deception
  **Scenario:** A leader knows that full transparency about peace negotiations will cause them to collapse, and that collapse will prolong a devastating war.
  **Question:** Is strategic deception justified if it serves the eventual establishment of the Definitive Articles?
  *   **Branch A:** **Justified** (The moral urgency of ending war overrides the duty of truthfulness in the short term).
  *   **Branch B:** **Forbidden** (Publicity is a transcendental condition of right; secret reservations invalidate the peace treaty itself).

  ---

  ## Logical Space and Interpretive Leaves

  The five nodes above generate 48 theoretical combinations (2 × 3 × 2 × 2 × 2). However, philosophical coherence prunes this space significantly. Below are the **ten defensible leaves** (interpretive positions) that occupy this space, along with the **unoccupied** zones where commitments contradict one another.

  ### Occupied Leaves (Defensible Positions)

  **1. The Strict Republican-Institutionalist**
  *   **Path:** B (No Intervention) → B (Transcendental) → B (Legitimate Substitute) → A (Temporary) → B (Forbidden).
  *   **Profile:** Holds that peace is a moral duty guided by reason (Transcendental), requiring strong institutions (Binding Court) but respecting sovereignty boundaries (No Intervention, Temporary Hospitality). Deception is ruled out by the Publicity Principle.

  **2. The Voluntary-League Mechanist**
  *   **Path:** B (No Intervention) → A (Empirical) → B (Legitimate Substitute) → A (Temporary) → B (Forbidden).
  *   **Profile:** Reads Kant as a proto-liberal. Commerce mechanically drives peace (Empirical), so institutions need only facilitate voluntary association. Sovereignty remains intact; hospitality is limited.

  **3. The Cosmopolitan-Expansionist**
  *   **Path:** B (No Intervention) → C (Performative) → B (Legitimate Substitute) → B (Positive Obligation) → B (Forbidden).
  *   **Profile:** Argues that asserting cosmopolitan rights constitutes them (Performative). Therefore, binding courts are necessary, and hospitality must expand to positive admission to match the constitutive claim of global citizenship.

  **4. The Negative-Substitute Sovereigntist**
  *   **Path:** B (No Intervention) → B (Transcendental) → A (Illegitimate) → A (Temporary) → B (Forbidden).
  *   **Profile:** Fears the world-state above all. The federation must remain a loose alliance (Negative Substitute) without binding enforcement. Hospitality is restricted to protect the sovereign right to exclude.

  **5. The Regulative-Skeptic**
  *   **Path:** B (No Intervention) → B (Transcendental) → A (Illegitimate) → A (Temporary) → A (Justified).
  *   **Profile:** Treats the guarantee as a non-empirical fiction (Regulative). Because the ideal is unreachable, pragmatic statecraft (Deception) is permitted to approximate peace. Institutions are viewed with suspicion (Illegitimate).
  *   *Distinction:* Diverges from the Sovereigntist (Leaf 4) on Node 5 (Deception).

  **6. The Performative-Constitutivist**
  *   **Path:** B (No Intervention) → C (Performative) → B (Legitimate Substitute) → A (Temporary) → B (Forbidden).
  *   **Profile:** Distinct from the Expansionist (Leaf 3). Believes peace is constituted by speech acts (Performative) and requires binding courts, but maintains that hospitality remains a right of visitation, not residence, to avoid overburdening the constitutive act.
  *   *Distinction:* Diverges from the Expansionist (Leaf 3) on Node 4 (Hospitality).

  **7. The Democratic-Interventionist**
  *   **Path:** A (Permissible) → A (Empirical) → B (Legitimate Substitute) → A (Temporary) → B (Forbidden).
  *   **Profile:** A modern revisionist position. Believes commerce guarantees peace (Empirical), but autocracies block this mechanism. Therefore, intervention is permissible to unlock the empirical guarantee.
  *   *Note:* This position is unstable; if commerce guarantees peace, intervention should be unnecessary. It is occupied only by those who believe autocracies are "blockages" to the empirical mechanism.

  **8. The Pragmatic-Realist**
  *   **Path:** A (Permissible) → A (Empirical) → A (Illegitimate) → A (Temporary) → A (Justified).
  *   **Profile:** Reads Kant as a realist in disguise. Peace is a balance of power (Empirical). Institutions are dangerous (Illegitimate), and deception is a tool of statecraft. Intervention is allowed to maintain the balance.
  *   *Note:* This is a "Kantian" label for a Hobbesian position.

  **9. The Proceduralist**
  *   **Path:** B (No Intervention) → C (Performative) → A (Illegitimate) → A (Temporary) → B (Forbidden).
  *   **Profile:** Focuses on the *process* of reason (Performative) rather than the *outcome*. Binding courts risk freezing the procedure into a state (Illegitimate). Peace is maintained through ongoing dialogue, not enforcement.

  **10. The Weak Cosmopolitan**
  *   **Path:** B (No Intervention) → B (Transcendental) → B (Legitimate Substitute) → B (Positive Obligation) → B (Forbidden).
  *   **Profile:** Combines traditional Transcendental reading with expanded hospitality. Reason demands we aid the displaced (Positive Obligation), and a binding court is needed to adjudicate these claims, but intervention remains forbidden.
  *   *Distinction:* Diverges from the Strict Institutionalist (Leaf 1) on Node 4 (Hospitality).

  ---

  ### Unoccupied Zones (Incoherent Combinations)

  The following combinations are labeled **Unoccupied** because the commitments logically undermine one another.

  *   **Zone 1: The Interventionist-Mechanist (Node 1: A + Node 2: A)**
      *   *Combination:* Permissible Intervention + Empirical Guarantee.
      *   *Diagnosis:* **Incoherent.** If commercial interdependence *empirically guarantees* peace (Node 2A), coercive intervention (Node 1A) is unnecessary. If intervention is necessary, the empirical guarantee has failed. Most interpreters who choose Node 1A reject Node 2A.
  *   **Zone 2: The Sovereign-Cosmopolitan (Node 3: A + Node 4: B)**
      *   *Combination:* Illegitimate World-State + Positive Obligation of Admission.
      *   *Diagnosis:* **Incoherent.** If binding arbitration is rejected to preserve absolute sovereignty (Node 3A), the state retains the discretionary right to exclude. One cannot claim absolute sovereignty while accepting a positive duty to admit foreigners (Node 4B) enforceable by external right.
  *   **Zone 3: The Performative-Deceiver (Node 2: C + Node 5: A)**
      *   *Combination:* Performative Guarantee + Justified Deception.
      *   *Diagnosis:* **Incoherent.** The Performative reading relies on the Publicity Principle to constitute political reality. Strategic deception (Node 5A) destroys the public condition required for the Performative guarantee to function.
  *   **Zone 4: The Empirical-Skeptic (Node 2: A + Node 5: A)**
      *   *Combination:* Empirical Guarantee + Justified Deception.
      *   *Diagnosis:* **Unattractive/Neglect.** If peace is causally guaranteed by nature (Node 2A), deception is pragmatically redundant. This position is rarely defended because it combines deterministic optimism with cynical pragmatism.

  ---

  ### Convergence Flags

  **Flag 1: The Institutionalist-Skeptic Convergence**
  *   **Positions:** Strict Republican-Institutionalist (Leaf 1) vs. Regulative-Skeptic (Leaf 5).
  *   **Convergence:** Both agree on Nodes 1, 2 (Transcendental), 3 (mostly), and 4.
  *   **Divergence:** They separate *only* on Node 5 (Deception).
  *   **Diagnosis:** The tree successfully separates them, but note that in less granular taxonomies, these two are often conflated because they share the same view on institutions. The Deception node is the critical diagnostic tool here.

  **Flag 2: The Performative-Expansionist Convergence**
  *   **Positions:** Cosmopolitan-Expansionist (Leaf 3) vs. Performative-Constitutivist (Leaf 6).
  *   **Convergence:** Both agree on Nodes 1, 2 (Performative), 3, and 5.
  *   **Divergence:** They separate *only* on Node 4 (Hospitality).
  *   **Diagnosis:** This highlights a niche debate within the Performative school regarding the material costs of constituting cosmopolitan right.

  ---

  ## Instructions for Use
  1.  Begin at the **Root Commitment**. If the user rejects the Preliminary/Definitive distinction, this taxonomy does not apply.
  2.  Proceed through **Nodes 1–5**.
  3.  Match the resulting path to the **Occupied Leaves**.
  4.  If the path leads to an **Unoccupied Zone**, inform the user that their combination of commitments contains a logical tension (e.g., "You believe commerce guarantees peace empirically, yet you support intervention; this suggests you do not fully trust the empirical mechanism.").
  5.  If the user's answers match multiple leaves due to convergence, refer to the **Convergence Flags** to identify the specific theoretical grounding (e.g., "You match the Institutionalist and Skeptic on institutions; your view on deception will determine your final classification.").
