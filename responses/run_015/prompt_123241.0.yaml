answer: |-
  - **The checklist (flowchart in words)**

  1.  **Blindfold & Touch:** Patient explores Object A (e.g., cube) tactually for 2 minutes. Remove object. Remove blindfold. Ensure distractors share material properties to prevent texture cues.
  2.  **Visual ID:** Reveal Object A visually among two distractors. Ask: "Which did you hold?"
  3.  **Stop 1 (Fail):** If incorrect, log "No Cross-Modal Recognition." End session.
  4.  **Strategy Query:** If correct, ask: "What visual cue matched your touch?" Accept "roundness/squareness" (Structural). Flag "counting corners/lines" (Associative). **[Judgment Point: Therapist interprets vocabulary]**
  5.  **Rotation Test:** Rotate object 45 degrees. Repeat Visual ID.
  6.  **Stop 2 (Fail):** If incorrect, log "Feature Binding Failure." This indicates counting, not shape recognition. End session.
  7.  **Consistency Check:** Ask: "Did the object change?" If "Yes," refer to Clinician. This is a phenomenological judgment, not factual. **[Judgment Point: Patient phenomenology]**
  8.  **Final Call:** If consistent structural description + rotation pass, log "Probable Structural Mapping." If strategy was counting but passed rotation, refer to Clinician.
  9.  **Judgment Flag:** Any hesitation, "I just knew," or contradictory verbal report requires Clinician review. Therapists do not decide on phenomenology. **[Judgment Point: Ambiguity]**
  10. **Documentation:** Record exact patient quotes. Do not paraphrase strategy descriptions. This preserves data for later clinical review if the patient's report conflicts with the pass/fail logic.

  - **Three worked cases (cube, sphere, pyramid)**

  **Cube:** Patient identifies cube. Strategy: "I counted four corners." Rotation test: Fails. Patient says, "Now it has pointy bits up and down." **Verdict:** Associative. The patient memorized "4 corners = cube" but lacks the concept of rotational invariance. Therapy resets to basic shape integration. This is a clean fail; no conflict. The team knows exactly where to restart training.

  **Sphere:** Patient identifies sphere. Strategy: "No edges, everywhere curves." Rotation test: Passes. Patient confirms, "Still no edges." **Verdict:** Structural. Recognition confirmed. Rehab advances to complex objects. This is a clean pass; confidence builds. The team proceeds to texture discrimination tasks.

  **Pyramid (Unwelcome):** Patient identifies pyramid. Strategy: "Three triangles." Rotation test: Passes. However, interrogation reveals patient tracked the shadow cast on the table, not the object edges. **Verdict:** Associative (Contextual). **Unwelcome Result:** Protocol demands logging "No Recognition." The patient feels they succeeded; the team must invalidate their progress. This causes friction. The therapist must explain that recognizing lighting cues isn't recognizing the shape. The patient argues, "I saw it!" The protocol forces a hard "No," risking trust. The therapist must halt progress despite visual success, telling the patient their sight is "less real" than they feel. This creates ethical tension between accurate assessment and patient morale. The team must choose between honesty and encouragement.

  - **Limits, judgment gaps, and what it cant do**

  This procedure cannot prove phenomenological identity (what it *feels* like to see). It relies on self-report, creating a judgment gap at the Strategy and Consistency steps. A patient may lack vocabulary to describe structural mapping, triggering false negatives. It cannot distinguish between instantaneous associative learning during the visual phase versus true cross-modal transfer. If a patient learns the visual signature in the 5 seconds before answering, the test records a "Pass" erroneously. Finally, it cannot resolve the philosophical stalemate; it only operationalizes behavior. The "Clinician Referral" flag admits that some distinctions are values-based (patient autonomy vs. clinical accuracy), not factual. Therapists must accept that a "Pass" is probabilistic, not ontological proof of sight. The test measures behavioral consistency, not the metaphysical nature of recognition. It cannot tell you if the patient is lying, deluded, or genuinely experiencing a new qualia. It simply flags inconsistency for higher review.
