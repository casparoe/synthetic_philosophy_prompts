      *   *Voss:* "But if I can predict the vector without believing it believes, why add the ontology?"
      *   *Aris:* "Because prediction isn't interpretation. Interpretation requires truth conditions."
      *   *Voss:* "Truth conditions relative to what? If the system has no grip on the world, only on tokens..."
      *   *Aris:* "Holism. The math connects to the ethics via logical structure."
