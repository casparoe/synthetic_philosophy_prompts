      *   **Setting:** A workshop on artificial cognition.
      *   **Case Study:** A large neural system trained *only* on formal mathematics, now producing coherent moral arguments.
      *   **Core Question:** Are these outputs expressions of belief/meaning, or just syntactic patterns?
      *   **Requirements:**
