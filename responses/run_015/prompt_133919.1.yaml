answer: |-
  Your intuition as a chemist is correct: the classification system you are encountering is not derived from a single, consistent epistemological framework, but rather from a pragmatic, historically accreted heuristic that balances evidentiary weight against cultural friction. In polymer chemistry, a material is defined by its structure and properties; in history, a "event" is defined by the intersection of text, material culture, and plausibility, but the weighting of these variables shifts depending on the subject.

  **The Hidden Theory: Pragmatic Triangulation with Cultural Safeguards**
  The three-way split presupposes a hidden theory of *differential falsifiability* combined with *sociological risk management*.
  1.  **Trojan War (Legend/Kernel):** This classification relies on **material corroboration**. The "hidden theory" here is positivist: if a city exists at the right stratigraphic layer with signs of destruction, the narrative gains "historical" status, even if the agents (Helen, Achilles) are unverified. It is treated as a distorted report of a physical event.
  2.  **King Arthur (Folklore/Literature):** This classification relies on **textual genealogy**. The "hidden theory" is source-critical: because the earliest texts naming Arthur appear centuries after the supposed events, the narrative is treated as an accretion (like a polymer chain growing over time) rather than a snapshot. The archaeological sites are ambiguous because they can be fitted to many leaders; thus, the *textual latency* disqualifies the history.
  3.  **Exodus (Theology/Myth):** This classification relies on **negative evidence and scale**. The "hidden theory" here is demographic and ecological: a group of the size described would leave a material trace (trash, campsites) that is absent. However, because the text functions as sacred scripture for living communities, historians use the "narrative theology" label to avoid direct confrontation with religious identity while maintaining empirical rigor.

  **Consistency Check**
  The split is **not consistent**. It quietly uses different criteria for each case.
  *   For Troy, archaeology overrides textual fiction.
  *   For Arthur, textual latency overrides archaeological ambiguity.
  *   For Exodus, archaeological absence overrides textual specificity.
  This inconsistency arises because historians are not just weighing data; they are navigating **constitutive myths**. Troy is a dead civilization (low political risk); Arthur is a nationalistic symbol (medium risk); Exodus is a sacred foundation for major religions (high risk). The "evidential gap" is handled differently because the cost of being wrong varies socially.

  **The Probability Score Proposal**
  If you replaced these categories with a Bayesian credence value (e.g., "Historical Probability: 35%"), museum labeling and curriculum design would undergo a radical shift from **ontological classification** to **epistemic transparency**.
  *   **Curriculum:** Instead of teaching "The Exodus didn't happen," curricula would teach "The probability of a mass migration of this scale is low given current data, but a smaller group movement is plausible." This mirrors how you might discuss a reaction mechanism with competing pathways.
  *   **Museums:** Labels would need error bars. "Artifact Context: 60% confidence linked to narrative."
  *   **The Hurdle:** History deals with singular, non-repeatable events, unlike polymer batches. A "probability" implies a frequency distribution that doesn't exist. To make this work, museums would have to adopt a **confidence interval** model (common in radiocarbon dating) rather than a frequency probability. They would need to display *why* the credence is assigned (e.g., "Low confidence due to lack of stratigraphic correlation") rather than just a number.

  **Does the Practice Need a Specific View?**
  The current practice does not need a specific philosophical view; it is **philosophically underdetermined**. It functions as a *modus vivendi* between empiricists, literary scholars, and cultural stakeholders. It persists not because it is logically consistent, but because it minimizes conflict. A strict probabilistic model would be more intellectually honest (appealing to your scientific background) but would likely generate more public controversy by quantifying sacred uncertainty.

  Verdict: The three-way split is an inconsistent heuristic designed to manage cultural risk rather than evidentiary weight, and while a probabilistic model would be more scientifically rigorous, it requires redefining historical singularities as statistical ensembles.
