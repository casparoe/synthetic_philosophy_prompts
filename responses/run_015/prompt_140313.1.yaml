prompt: |-
  hey — I'm in a third-year seminar on consciousness this term and I've been handed one 50-minute slot to run for the rest of the group. 14 people, mixed: about half have already read something on the split-brain / commissurotomy cases, half haven't, and the room is a normal seminar room (one big table we can all sit round, a whiteboard, no tech beyond that). My slot is on split-brain cases and the unity of consciousness.

  I really don't want to stand at the front and talk at them, I want them to run into the thing. What I'd like them to come away seeing is that "unity of consciousness" isn't one claim: that being able to report something, being able to act on it, and its being experienced together with your other experiences can come apart, and that once the split-brain cases are on the table you have to say which of those you actually cared about. My prof keeps seperating access unity (roughly: what's available to the same reporting-and-control system, whatever exactly that cashes out to) from phenomenal unity (the felt togetherness of experiences at a time), and she also keeps insisting that "one mind" and "one agent running one body" are different claims again. Whatever you give me should make at least two of those come apart as something the participants feel while they're doing it, not something I announce at the end.

  My own half-baked idea — tell me if it's any good or if it teaches something false: put them in pairs, one person is the "talking side" (can speak and write, but can't see what's presented to, say, their left) and the other is the "silent side" (can see it, can only point, push, or move objects around). Run a set of short tasks where the pair has to respond as a single person, then afterwards the talker has to explain why they responded the way they did — and they were never told what the silent side saw. Then repeat with a dial on the channel between them: zero contact, then one bit (yes/no), then a single word, then free writing — and at each setting the room votes on whether this is one subject or two cooperating ones. I like the dial because it turns a yes/no question into a threshold question, but I can't tell whether it teaches something true about the cases or just gets people trading intuitions about bandwidth.

  So: design me the actual thing. Materials limited to paper, index cards, envelopes or folders, maybe a screen made of a couple of ring binders. Rules that make them hit the problem on their own — the confabulation should happen because of how I've set the incentives up, not because I told anyone to make up a story. A minute-by-minute plan for the 50. A debrief that maps specific moments in the activity onto the distinctions above, plus the honest part: which bit of the debate the activity can't reproduce at all and I'll just have to say out loud afterwards (I'm guessing something about the actual phenomenology, and about the fact that in the real cases both sides still share one body, one brainstem, one homeostatic system — but you tell me). And tell me what will predictably go wrong the first time I run it: I'm expecting at least one pair to cheat, and at least one person to say "well obviously it's two people the whole time" and deflate the exercise.

  For the format — I want to be able to paste this into my notes app, so give me the deliverable as a single JSON object and spell out the schema yourself as you go. At minimum I want: "materials" and "setup_minutes"; "roles"; "rules" (an array of short numbered rules I can read out); "timeline" (array, one object per block: minutes, what participants do, what they should run into, the failure mode for that block, and how I handle it); "throttle_scheme" (array, one object per bandwidth level: what's allowed, what behaviour I should watch for, what verdict I collect from the room, and what that verdict is actually tracking); "debrief" (array: moment in the activity, the distinction it maps onto, one line I can say); "goes_wrong" (array: what, why, fix); "cannot_reproduce" (array: feature, why not, what I have to supply instead); "check_for_understanding" (one question I can ask at the end that would show they got it rather than just enjoyed it); and "verdict_on_my_dial_idea" (keep it, fix it, or bin it — and if you bin it, the replacement mechanic in the same JSON).
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** Third-year seminar on consciousness, 50-minute slot, 14 participants (mixed knowledge on split-brain), seminar room (table, whiteboard, no tech).
      *   **Goal:** Make participants *experience* the dissociation between different aspects of "unity of consciousness" (access unity, phenomenal unity, agency/body unity) through an activity, not just a lecture.
      *   **User's Idea:** Pairs, "talking side" vs. "silent side", tasks requiring coordination, varying bandwidth of communication (dial: zero -> bit -> word -> free). Room votes on "one subject vs. two".
      *   **Constraints:** Materials limited (paper, cards, envelopes, binders). Rules must induce confabulation naturally. Needs a minute-by-minute plan. Needs debrief mapping activity to theory. Needs prediction of failure modes. Needs specific JSON format.
      *   **Output Format:** Single JSON object with specific schema keys (`materials`, `setup_minutes`, `roles`, `rules`, `timeline`, `throttle_scheme`, `debrief`, `goes_wrong`, `cannot_reproduce`, `check_for_understanding`, `verdict_on_my_dial_idea`).

  2.  **Evaluate the User's Idea (The "Dial"):**
      *   *Strengths:* It captures the gradient of integration. It forces the "talking side" to confabulate when information is missing (mimicking the left hemisphere's interpreter). It makes the "one mind vs. two" question tangible.
      *   *Weaknesses:* It risks becoming a game about communication efficiency rather than consciousness. If the "silent side" can point, that's already high bandwidth. The real split-brain issue is that the *speaking* hemisphere literally doesn't know what the *seeing* hemisphere saw. The user's setup needs to ensure the "talking side" is genuinely ignorant but still forced to explain actions initiated by the "silent side".
      *   *Refinement:* The "dial" is good, but needs to be framed carefully. The critical moment is when the Talking Side explains an action they didn't initiate and don't understand. The "vote" on one/two subjects is good for highlighting the conceptual ambiguity.
      *   *Verdict:* Keep it, but refine the mechanics to ensure confabulation is incentivized (e.g., the pair gets a "point" only if the explanation sounds plausible to the observer, regardless of truth).

  3.  **Design the Activity ("The Commissurotomy Simulation"):**
      *   **Setup:** Pairs (7 pairs). One "Left Hemisphere" (LH - speaks, writes, right hand), one "Right Hemisphere" (RH - silent, left hand only, sees hidden info).
      *   **Barrier:** Use binders/folders as a visual field divider. LH cannot see what RH sees.
      *   **Task:** Identify an object or choose an action based on hidden info.
      *   **Confabulation Engine:** LH must explain *why* the hand (controlled by RH) moved. LH doesn't know. LH wants to look coherent.
      *   **Throttle:** Vary the communication channel between LH and RH (None -> Tap -> Word -> Full).
      *   **Debrief:** Map the frustration/confabulation to Access Unity vs. Phenomenal Unity.

  4.  **Drafting the JSON Content:**

      *   `materials`: Binders (visual barrier), Cards (stimuli), Paper/Pens, Timer.
      *   `setup_minutes`: 5 mins.
      *   `roles`: "Left Hemisphere" (Speaker/Writer/Right Hand), "Right Hemisphere" (Silent/Left Hand/Sees Stimulus).
      *   `rules`: Need to enforce the split. LH cannot look. RH cannot speak. LH must explain actions.
      *   `timeline`:
          *   0-5: Setup & Rules.
          *   5-15: Round 1 (Zero Bandwidth). LH explains RH's choice.
          *   15-25: Round 2 (Low Bandwidth - Tap).
          *   25-35: Round 3 (High Bandwidth - Word).
          *   35-45: Debrief & Mapping.
          *   45-50: Check & Close.
      *   `throttle_scheme`:
          *   Level 0 (None): No communication. LH confabulates. Tracks Phenomenal Unity dissociation.
          *   Level 1 (Tap): Yes/No signal. Tracks Access Unity partiality.
          *   Level 2 (Word): Single concept. Tracks Integration.
      *   `debrief`: Map specific confusion to Access/Phenomenal/Agency distinctions.
      *   `goes_wrong`: Cheating (peeking), Cynicism ("it's obviously two"), Boredom.
      *   `cannot_reproduce`: Actual phenomenology (what it *feels* like), Shared Body/Homeostasis (they are still two distinct bodies in the room).
      *   `check_for_understanding`: A question about which unity broke first.
      *   `verdict_on_my_dial_idea`: Keep it, but refine the incentive structure to force confabulation.

  5.  **Refining the "Confabulation" Mechanism:**
      *   In real split-brain cases, the LH *believes* its explanation. In a game, students know they are lying.
      *   *Fix:* Make the goal "Coherence". The pair wins if the Observer (the rest of the class or the facilitator) accepts the explanation as rational. This pressures the LH to generate a plausible story even without data.
      *   *Better Fix:* The LH doesn't know they are *supposed* to lie. They just know they have to explain the hand's movement. The pressure to be coherent creates the confabulation naturally.
      *   *Instruction:* "You are one agent. You must justify your actions."

  6.  **Refining the "One vs. Two" Vote:**
      *   This is crucial. At each bandwidth level, ask the class: "Is this one mind or two?"
      *   This highlights that the answer depends on the *criteria* used (access vs. phenomenality).

  7.  **Addressing the "Cannot Reproduce" constraint:**
      *   Real split-brain patients don't feel like two people. They feel like one confused person.
      *   In the simulation, the "LH" student knows they are separate from the "RH" student.
      *   This is the biggest limitation. I need to make sure the user knows to highlight this gap.

  8.  **Constructing the JSON:**
      *   Ensure all keys match the requested schema.
      *   Ensure valid JSON syntax (quotes, commas, no trailing commas).
      *   Keep text concise for a notes app.

  9.  **Review against Constraints:**
      *   50 minutes? Yes.
      *   14 people? Yes (7 pairs).
      *   No tech? Yes (binders/cards).
      *   JSON format? Yes.
      *   Specific keys? Yes.
      *   Verdict on dial idea? Yes.

  10. **Final Polish:**
      *   Make sure the "Rules" enforce the visual split strictly.
      *   Ensure the "Debrief" explicitly mentions Access vs. Phenomenal Unity.
      *   Ensure the "Goes Wrong" section addresses the "obviously two people" objection.

