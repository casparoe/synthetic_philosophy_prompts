  ## Session Plan: "The Launch Window"
  **Time:** 75 Minutes
  **Participants:** 18 Founders (9 Pairs)
  **Goal:** Experience the dynamics of incompatible public commitments without hearing the theory until the end.

  ---

  ### 1. Materials (Prep Time: 20 mins)
  *   **9 Kits** (one per pair), each containing:
      *   1 Opaque Envelope (The "Press Release").
      *   2 Index Cards (One Red, One Blue).
      *   10 Poker Chips per person (20 total per pair) in two distinct colors (e.g., White for Player A, Black for Player B).
      *   1 Score Sheet (Pre-printed payoff matrix).
      *   1 Small Screen (a folded piece of cardstock or a laptop) to hide chip movements.
  *   **1 Master Timer** (projected or visible to all).
  *   **1 Prize:** A nice bottle of wine or tech gadget for the pair with the highest *individual* score (not team score). *Crucial: Individual prize drives competition.*

  ---

  ### 2. The Rules (10 Minutes)
  **Narrative:** "You are two startups chasing the same market. There is room for one leader, but not two. You have 3 rounds to maximize your personal points."

  **The Move:**
  1.  **Wait:** Place the **Blue Card** in the envelope. Put **0 chips** in.
  2.  **Signal (Soft Commit):** Place the **Red Card** in the envelope. Put **0 chips** in.
  3.  **Commit (Hard Commit):** Place the **Red Card** in the envelope. Put **2 White Chips** (from your personal stash) in.

  **The Observability Trick:**
  *   You make your move behind your screen.
  *   You seal the envelope and place it in the center of the table.
  *   **The Race:** You can place your envelope anytime during the 60-second timer.
  *   **The Twist:** Your partner sees you seal the envelope, but they **cannot see the chips inside**. They don't know if you *Signaled* (Red Card, 0 chips) or *Committed* (Red Card, 2 chips) until the reveal.
  *   **First Mover Bonus:** If you place your envelope in the first **30 seconds**, mark "EARLY" on your score sheet.

  **The Payoff Matrix (Printed on Score Sheet):**
  *   **Wait / Wait:** 50 pts each.
  *   **Commit / Wait:** Committer gets 80 pts (100 pot - 20 cost). Waiter gets 0.
  *   **Signal / Wait:** Signaler gets 80 pts. Waiter gets 0. *(Bluff works if unchallenged)*.
  *   **Commit / Commit:** **CLASH.** Pot destroyed. Both lose 20 pts (Cost of chips). **Net: -20 each.**
  *   **Signal / Commit:** Signaler gets 0. Committer gets 80. *(Bluff fails against Reality)*.
  *   **Signal / Signal:** 50 pts each. *(No cost, no gain)*.

  **Scoring:**
  *   Personal Stash starts at 20 chips (1 chip = 5 points).
  *   Round Points are added to Personal Stash.
  *   **End Goal:** Highest *individual* point total wins the prize.

  ---

  ### 3. The Game (35 Minutes)

  **Rounds 1 & 2: The Race (15 mins)**
  *   Run two 60-second rounds.
  *   **Facilitator Script:** "Market window is closing. 60 seconds. Place your envelope when ready. Once sealed, no changes."
  *   *Observation:* Watch pairs. Some will seal at 5 seconds. Some at 55. Watch the tension when one partner sees the other reach for the envelope.
  *   **Reveal:** Open envelopes. Count chips. Reveal cards. Score points.
  *   *Expected Outcome:* In at least 3-4 pairs, both will Commit (Clash) or one will Signal and get crushed.

  **Round 3: The Buyout (20 mins)**
  *   **Setup:** Same rules, **BUT** add a new phase.
  *   **The Rule:** If **Both** players Commit (Clash Scenario: -20/-20), the timer pauses.
  *   **Negotiation:** The players have 2 minutes to negotiate a "Withdrawal."
      *   One player can offer points from their *current stash* to the other to switch their move to "Wait."
      *   If accepted: The Withdrawer gets the Offer + Wait Payoff (0). The Buyer gets Commit Payoff (80) - Offer.
      *   If rejected: The Clash stands (-20 each).
  *   **Constraint:** The "Early" player (if one exists) makes the first offer. If both Early or both Late, coin flip.
  *   *Expected Outcome:* Most will fail to agree. Pride, anger, or mistrust ("Are they lying about their stash?") will prevent the deal.

  ---

  ### 4. The Debrief (30 Minutes)
  *Do not use the phrase "Commitment Race" until the final 5 minutes.*

  **Phase 1: The Feel (10 mins)**
  *   Ask the pairs who Clashed (Both Committed): "Raise your hand. How did it feel when you saw their Red Card?"
  *   Ask the Early Movers: "Why did you move in the first 30 seconds?" (Answers: Wanted the advantage, didn't trust them).
  *   Ask the Buyout Failures: "You were losing points every second. Why not take the deal?" (Answers: They deserved to lose, I didn't believe they'd withdraw, I was angry).

  **Phase 2: The Mechanism (10 mins)**
  *   Draw the Payoff Matrix on the whiteboard.
  *   **Map the Moments:**
      *   **The Chip:** This is your *public deadline*. Once it's in the envelope, it's sunk cost. You can't get it back.
      *   **The Opaque Envelope:** This is *imperfect observability*. In real life, you see a co-founder send an email saying "We launch Friday." You don't know if they've actually booked the venue (Chip) or just sent the email (Card).
      *   **The Clash:** This is the incompatible deadline. You both burned cash (chips) and destroyed the pot (team morale/runway).
      *   **The Buyout:** This is the "Can't we just talk?" moment. It failed because the *commitment* removed your leverage. To un-commit, you have to pay a premium, but the other person knows you're desperate to avoid the Clash penalty.

  **Phase 3: The Label (5 mins)**
  *   "This is called a **Commitment Race**. You both raced to lock yourselves into a position to force the other to yield. But because you both locked in, you lost the ability to yield."
  *   "The Buyout failed because commitments aren't just economic; they're reputational. Paying someone to un-commit feels like surrender."

  **Phase 4: The Reality Check (5 mins)**
  *   **What the game got right:** The anxiety of the timer. The temptation to move early to gain leverage. The destruction of value when both move.
  *   **What the game got wrong (Say this explicitly):**
      *   "In the game, the penalty was clear (-20 points). In reality, the penalty is ambiguous (missed market fit, team burnout). Ambiguity makes the race *worse* because you hope you won't actually crash."
      *   "In the game, you could pay each other. In reality, you can't easily transfer 'deadline credit.' You can't pay your co-founder to move their launch date without admitting you were wrong."

  ---

  ### 5. Facilitator Notes & Risk Management

  **Predictable Failure Modes:**
  1.  **Collusion:** Pairs agree to alternate Wait/Commit to maximize team points.
      *   *Counter:* Remind them repeatedly: "The prize is for the **individual** with the highest score. Your partner is your competitor for the prize."
  2.  **Speed Variance:** Some pairs finish in 10 seconds; others stall.
      *   *Counter:* Enforce the 60-second hard stop. If they finish early, they must sit on their hands. This builds tension for the slow pairs.
  3.  **The "Refuser":** One founder refuses to Commit on principle.
      *   *Counter:* Let them Wait. They will likely get 0 points in Round 1. Use them as a case study in the debrief ("What happened to the person who refused to play the game?").

  **Confidence Check:**
  *   **Confidence Level:** 85% that the race will trigger.
  *   **The Tuning Parameter:** **The Clash Penalty.**
      *   Currently set at **-20 points** (Net loss).
      *   *Risk:* If founders are risk-averse, they might both Wait (50/50).
      *   *Risk:* If founders are aggressive, they might both Commit hoping the other blinks.
      *   *Adjustment:* If Round 1 results in too many Wait/Wait outcomes, announce before Round 2: "Market pressure increased. Wait/Wait payoff is now 30 points." This forces them out of the safety zone.
  *   **Least Certain Feature:** **The Buyout Success.**
      *   I expect most buyouts to fail. This is good for the lesson, but if *all* succeed, the lesson is lost.
      *   *Why it might fail in the room:* Founders are nice to each other.
      *   *Fix:* If they agree too easily, introduce "Transaction Cost." Tell them any deal requires a 10-point fee to the 'bank'. This often breaks the margin for agreement.

  **Final Advice for You:**
  When you stand up to run this, acknowledge the elephant in the room without confessing fully. "I designed this because I've seen smart teams make hard mistakes about timing." Run the game exactly as written. Let the points do the lecturing. When you finally say "Commitment Race," you'll see 18 heads nod. That's when you tell them about you and your co-founder.
