answer: |-
  **Term Paper Proposal**

  **Title:** The Epistemic Divide: Disentangling the Logical and Physical Church-Turing Theses

  **1. Statement of the Research Question**
  The standard literature often treats the Church-Turing Thesis (CTT) as a monolithic claim regarding the limits of computation. However, this treatment obscures a fundamental ambiguity in the thesis's formulation. This paper will address the following question: *Does the standard monolithic treatment of the Church-Turing Thesis obscure a fundamental distinction between a conceptual claim about effective procedures and an empirical claim about physical computability, and if so, what are the consequences for the hypercomputation debate?*

  Rather than asking whether CTT is "true" or "false"—a question that invites confusion because the answer depends on which version is being assessed—this project seeks to determine the precise epistemic status of the two distinct claims commonly conflated under the single label. The determinate answer sought is a classification scheme: specifically, whether the "Logical CTT" (concerning the extension of the concept of effective calculability) is best understood as an *a priori* conceptual analysis, while the "Physical CTT" (concerning the computational capacity of physical systems) is best understood as an *a posteriori* empirical hypothesis. Resolving this classification is necessary to explain why the thesis appears settled to some philosophers while remaining a live scientific controversy to others.

  **2. Background and Motivation**
  The motivation for this project arises from a persistent friction in the philosophy of computation. On one hand, introductory texts and many philosophical treatments present CTT as a settled definition: to be "computable" just *means* to be Turing-computable. This move renders the thesis analytically true but trivializes its content. On the other hand, the literature on hypercomputation treats CTT as a falsifiable claim about the physical world, citing models involving relativistic spacetimes, analog systems, or quantum processes that purportedly exceed Turing limits.

  These two camps often talk past one another because they are operating with different versions of the thesis. The "definitional" camp relies on the Logical CTT, rooted in Turing's 1936 analysis of the human computer. Turing's argument was phenomenological: he analyzed the boundedness of human memory, attention, and symbolic manipulation to derive the Turing Machine architecture. This suggests the Logical CTT is a claim about the necessary conditions for following an algorithm, independent of the substrate.

  Conversely, the "hypercomputation" camp challenges the Physical CTT. This version claims that no physical system can compute a non-Turing-computable function. This is not a claim about the concept of an algorithm, but about the laws of physics. If the universe permits Malament-Hogarth spacetimes or specific analog continuums, the Physical CTT could be false even if the Logical CTT remains intact.

  Current discourse leaves this question open because it frequently conflates the two. Philosophers often slide from the indisputability of Turing's conceptual analysis to the conclusion that hypercomputation is conceptually impossible, bypassing the empirical question of physical realizability. Alternatively, physicists proposing hypercomputers often claim to refute Turing's thesis, when they are actually only refuting the physical extrapolation of it. This proposal argues that this conflation is not merely terminological but epistemic: it masks the difference between a claim known through conceptual reflection and a claim known through physical investigation.

  **3. Methodology and Semester Plan**
  The paper will proceed by isolating the two theses, analyzing their respective justifications, and demonstrating how the conflation leads to dialectical stalemates. The work will be structured over the semester as follows:

  *   **Weeks 1–3: Historical and Conceptual Groundwork.** I will reconstruct Turing's original 1936 argument to isolate the premises regarding human effective procedures. I will contrast this with later formulations (e.g., Church's lambda calculus equivalence) to show how the focus shifted from human computation to machine capability. The goal is to produce a precise formulation of the "Logical CTT" that relies solely on the analysis of "effective method."
  *   **Weeks 4–6: The Epistemic Status of the Logical Thesis.** I will examine arguments that treat CTT as a definition or a conceptual truth. I will engage with the view that Turing provided an analysis of the *concept* of computability, making the Logical CTT *a priori*. I will test this against objections that suggest our concept of computation is open-textured and might evolve, arguing that while the *concept* is stable, its application depends on the distinction between procedure and process.
  *   **Weeks 7–9: The Physical Thesis and Empirical Content.** I will shift to the "Physical CTT." I will analyze arguments that treat the limits of computation as limits of physics. This involves reviewing the structure of hypercomputation arguments (e.g., relativistic computers, infinite time Turing machines) not to evaluate their engineering feasibility, but to show that their possibility is an empirical matter. I will argue that denying the Physical CTT does not entail a contradiction in terms, but rather a discovery about the world.
  *   **Weeks 10–12: Synthesis and the Hypercomputation Debate.** I will apply the distinction to the current stalemate. I will show that defenders of CTT often defend the Logical version (which is secure) to protect the Physical version (which is vulnerable), while attackers often attack the Physical version to claim they have undermined the Logical version (which they have not). I will draft the core argument that the "definitional stop" works for the Logical thesis but begs the question against the Physical thesis.
  *   **Weeks 13–14: Drafting and Revision.** I will assemble the sections into a unified argument, ensuring the transition between the conceptual and the empirical is clear. I will refine the conclusion to explicitly state the epistemic classification of each thesis and the resulting implications for how we teach and discuss computability.

  **4. Possible Conclusions and Deciding Considerations**
  There are three primary outcomes this investigation might support:

  1.  **The Dual-Status View (Preferred):** The Logical CTT is a conceptual truth (or *a priori* necessity based on the analysis of finite agency), while the Physical CTT is a contingent empirical hypothesis. *Deciding Consideration:* This turns on whether Turing's 1936 argument is successfully interpreted as an analysis of human finitude rather than a prediction about machines. If Turing's constraints (bounded observation, finite symbols) are necessary for *any* effective procedure, the Logical thesis holds necessarily. If physics allows processes that bypass these constraints without requiring an "effective procedure" in the human sense, the Physical thesis is contingent.
  2.  **The Unified Empirical View:** Both versions are empirical. This would require arguing that our concept of "effective procedure" is itself grounded in our physical experience, such that a change in physics would change the concept. *Deciding Consideration:* This relies on a naturalized epistemology of mathematics. If I find that conceptual analysis cannot be disentangled from physical intuition, this view gains traction.
  3.  **The Unified Conceptual View:** Both versions are conceptual. This would require arguing that "physical system" in the relevant sense is constrained by the same logical bounds as the human computer, making hypercomputation conceptually incoherent. *Deciding Consideration:* This turns on whether hypercomputation models involve logical contradictions or merely physical improbabilities.

  The project will argue for the Dual-Status View. The deciding factor will be the success of the "definitional stop." If defining computability as Turing-computability resolves the Logical debate but leaves the Physical debate untouched, the distinction is validated.

  **5. Risk Assessment and Scope Management**
  The primary risk for this project is scope creep regarding the physics of hypercomputation. It is tempting to evaluate specific models (e.g., quantum adiabatic computers, Zeno machines) in detail. However, this is a philosophy paper, not a physics paper. Deep diving into the viability of specific models would exceed the 6,000-word limit and distract from the epistemic question. I will mitigate this by referencing hypercomputation models only as examples of *types* of challenges to the Physical CTT, without adjudicating their physical plausibility.

  A second risk is the historical interpretation of Turing. There is significant scholarship on what Turing "really meant." I must avoid getting bogged down in exegesis. My use of Turing's 1936 paper will be reconstructive: I am interested in the argument's structure regarding effective procedures, not necessarily in a definitive historical claim about Turing's psychology.

  Finally, 6,000 words is a tight constraint for distinguishing two theses, analyzing their epistemic status, and applying the distinction to a debate. I may need to limit the "Synthesis" section to one specific example of the conflation (e.g., the claim that hypercomputation is "impossible by definition") rather than surveying the entire literature. If the argument becomes too dense, I will prioritize the clarity of the distinction over the breadth of the application. The core contribution must remain the clarification of the epistemic statuses, as this is the prerequisite for any further progress on the topic.
