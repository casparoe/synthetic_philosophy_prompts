answer: |-
  Here is an audit of your ethical framework.

  **Executive Verdict:** You are not a Rule-Consequentialist. You are a **Value Pluralist with Consequentialist Leanings.** You claim (3) as your meta-ethical engine, but (4) and (5) introduce non-instrumental "trump cards" (ecological integrity, cultural value) that override the consequentialist calculus. This is not necessarily a failure, but it is a contradiction in terminology that creates downstream inconsistencies in your aggregation logic.

  Here is the ranking of tensions from most severe (structural) to least severe (empirical), followed by the specific tension that dissolves.

  ### 1. The Meta-Ethical Contradiction (Severity: High)
  **Conflict:** (3) vs. (4) & (5)
  **The Tension:** In (3), you define your framework as **Rule-Consequentialism**, which dictates that the right rule is the one that maximizes the good (minimized suffering). However, in (4) and (5), you introduce **non-instrumental values** (ecological integrity, cultural practices) that *override* suffering reduction.
  *   In (4), you admit suffering matters but allow integrity to *override* it.
  *   In (5), you allow cultural value to justify suffering that isn't strictly survival-necessary.
  *   **Why it breaks:** A consequentialist cannot accept a value that overrides the maximization of the good. If "integrity" or "culture" can trump "suffering reduction," they are lexical priorities, not weights in a consequentialist sum. You are smuggling deontological constraints into a consequentialist framework.

  **Cheapest Fix:** **Drop the label, keep the package.** Admit you are a **Pluralist**. You value suffering reduction *primarily*, but you recognize side-constraints (integrity, culture).
  **Accommodation Required:** You must acknowledge that your view is not strictly aggregative. This makes your view harder to defend in a seminar (pluralism is often criticized as ad hoc), but it makes it internally consistent. You must articulate *when* the trump cards play. Is integrity an absolute veto, or just a heavy weight?

  ### 2. The Aggregation/Override Inconsistency (Severity: Medium-High)
  **Conflict:** (1) & (2) vs. (4)
  **The Tension:** In (1) and (2), you do the hard work of setting up a granular **aggregation system** (weighting invertebrates at 5-10%, weighting by welfare-duration). This implies suffering is commensurable and comparable across species.
  *   However, (4) rejects wild-animal suffering interventions based on "ecological integrity."
  *   **Why it breaks:** If you have a precise weighting system for wild rodents in crop fields (1), why does that system vanish when discussing wild ecosystems (4)? If a wild rodent's suffering counts for X in a wheat field, it should count for X in a forest. By invoking integrity as an *override* in (4), you render the precise weighting in (1) and (2) irrelevant for wild animals, creating a arbitrary boundary between "agricultural wild animals" and "ecosystem wild animals."

  **Cheapest Fix:** **Reframe (4) as Empirical, not Normative.** Argue that interventions *fail* to reduce suffering empirically (due to complexity/unintended consequences) rather than claiming integrity *overrides* suffering normatively.
  **Accommodation Required:** You lose the "integrity" safety net. You must commit to the claim that intervention *actually increases* suffering. If future science shows vaccination reduces suffering without collapse, you would be obligated to support it.

  ### 3. The Grass-Fed Empirical/Ethical Gap (Severity: Medium)
  **Conflict:** (3) vs. (1) & (2)
  **The Tension:** Your exception for grass-fed beef (3) relies on a "marginal grassland substitution" argument: that eating this beef preserves wild herbivore densities that replace killed pests.
  *   **The Math Problem:** According to (1), a wild rodent has *less* welfare-duration weight than a broiler. According to (2), insects count for less than mammals.
  *   **The Land-Use Problem:** Beef (even grass-fed) requires significantly more land per calorie than plants. Even on non-arable land, your demand for beef expands the agricultural footprint compared to a plant-only diet. This likely *increases* the total number of wild animals subject to the "crop-death" logic in (1), just over a wider area.
  *   **Why it breaks:** Unless you can prove that a cow's life/death causes *less* suffering than the aggregate suffering of the wild ecosystem it displaces (weighted by your own metrics in 1 & 2), this exception violates your own Rule-Consequentialist goal in (3). It looks like a preference rationalization.

  **Cheapest Fix:** **Tighten the Empirical Condition.** Change (3) to: "I eat grass-fed beef *only if* local ecological data suggests the grazing prevents a higher-suffering land-use conversion (e.g., to row crops) *and* the cow's life contains net positive welfare."
  **Accommodation Required:** You may have to stop eating beef entirely if the local data doesn't support the "net suffering reduction" claim. It moves the beef from a "principled exception" to a "contingent empirical bet."

  ### 4. The "Dissolving" Tension (Severity: None)
  **Conflict:** (1) vs. (6) (Crop Deaths vs. Chicken Avoidance)
  **Why it looks like tension:** Critics often argue, "Plants kill field mice, so veganism isn't cruelty-free." If you accept crop deaths (1), why is avoiding chicken (6) the priority?
  **Why it dissolves:** You explicitly solved this in (1) with **"Prospective Welfare-Duration."**
  *   **The Logic:** A field mouse dies quickly (acute suffering) and has low cognitive capacity. A broiler chicken lives 6-8 weeks in conditions designed to maximize pathology (chronic, intense suffering) and has higher cognitive capacity.
  *   **The Audit:** This is consistent. You are not counting *deaths*; you are counting *suffering-capacity units*. As long as you maintain the weighting that chronic confinement suffering > acute field death, (1) fully justifies (6). No fix needed here; this is the strongest part of your package.

  ### Summary of Revisions for Seminar Defense

  1.  **Own the Pluralism:** Don't call yourself a Rule-Consequentialist. Call yourself a **Suffering-Focused Pluralist**. This neutralizes the attack on (4) and (5). You value suffering reduction *highly*, but you acknowledge other goods (integrity, culture) that are not reducible to suffering units.
  2.  **Defend the Threshold:** If you are a pluralist, you need a threshold for when suffering *does* override culture or integrity. (5) says factory farming is out, but cultural practices are in. Be prepared to define the line. Is it intensity? Scale?
  3.  **Weaken the Beef Claim:** Treat the grass-fed beef (3) as a **probabilistic hedge** rather than a moral exception. "Given empirical uncertainty about wild suffering densities, I allow this small exception," rather than "This beef is morally superior." This protects you if the land-use math turns out wrong.

  **Final Diagnosis:** Your package is **mostly consistent** if you drop the Consequentialist label. The contradictions arise because you are trying to force a Pluralist intuition (that nature/culture have value beyond suffering) into a Consequentialist formula (minimize aggregate suffering). Admit the hybrid nature, and the framework holds.
