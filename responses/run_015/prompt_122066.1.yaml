answer: |-
  **Setting:** *Kitchen, 11 PM. Empty mugs on the table. A is leaning against the counter, arms crossed. B is sitting on a stool, spinning a spoon.*

  **A:** I keep going back to the four hundred bucks. I know he's out of rehab, I know he's trying, but… it's gone. And he lied about it.

  **B:** That hurts.

  **A:** It's not just the money. It's the disregard. I've been reading up on this Strawson stuff—reactive attitudes. Basically, resentment isn't about whether he *could* physically stop himself in some metaphysical sense. It's about the quality of his will. Did he care about my expectations? Did he respect me?

  **B:** And you think he didn't.

  **A:** I think he prioritized the fix over me. Again. And look, I get the addiction piece. I'm not saying he's a demon. But does addiction automatically erase the disregard? Or does it just… I don't know, turn down the volume on how angry I'm allowed to be?

  **B:** See, that's where I think you're getting stuck. You're trying to keep the same emotion but just make it quieter. Like you're turning the knob on resentment from a ten to a three.

  **A:** Why not? If his capacity is impaired, shouldn't the blame be impaired too? Just scaled down?

  **B:** Because resentment expects a certain kind of person on the other end. It expects someone who can meet you halfway, who can recognize your demand for respect and choose to honor it. When someone is deep in that stuff, that capacity for reciprocal recognition is broken. It's not just weak; it's offline.

  **A:** So what, I just switch it off? That feels cold. Like I'm viewing him as a project instead of a brother.

  **B:** It's not about viewing him as an object. It's about recognizing that the relationship dynamic has temporarily shifted. Strawson calls it the objective attitude. You don't resent a kid for breaking a vase if they're too young to understand care. You don't resent someone having a seizure. You feel sad. You feel worried. But resentment? That requires a moral peer.

  **A:** But he's not a kid. He's thirty. And he got out of rehab last month. He knows the rules.

  **B:** Knowing the rules and having the capacity to follow them when the craving hits aren't the same thing. Here's the thing about scaling the attitude—it's not coherent. You can't have "a little bit" of a demand for reciprocity if the other person literally can't offer it. If you hold onto the resentment, you're insisting he's capable of something he isn't right now. You're fighting a ghost.

  **A:** So if I let go of the anger, I'm excusing the behavior? That's the fear. If I stop being mad, does that mean what he did was okay?

  **B:** No. That's the medical excuse trap. You're thinking if I say "he's sick," I'm saying "it doesn't matter." I'm not. It matters immensely. The trust is broken. The money is gone. But the *response* to that break changes. If you see it as a symptom of a broken capacity, you feel grief. You feel the loss of the trust. If you see it as a moral slight, you feel heat. You want payback. You want him to feel bad.

  **A:** I do want him to feel bad. I want him to know he hurt me.

  **B:** I know. But if he's still in the grip of it, he can't fully hold that. He can't carry the weight of your hurt because he's crushed by his own. If you stand there demanding he lift it, you're both going to collapse.

  **A:** So the objective attitude… it's not forever?

  **B:** No. It's for now. It's for when the capacity is compromised. If he gets stable, if he gets sober for real, then he comes back into the moral community. Then the reactive attitudes come back. Then you can have a real conversation about the disregard. But right now? You're mad at the addiction, but you're talking to your brother.

  **A:** It just feels like I'm letting him off the hook.

  **B:** You're changing the hook. You're hanging the pain on the reality of the disease instead of the malice of the person. It doesn't make the loss smaller. But it stops you from poisoning yourself while you wait for him to get well.

  **A:** *Sighs, looks into empty mug.* Sadness instead of anger.

  **B:** Sadness, frustration, worry. All the stuff that says "this is broken" without saying "you are evil."

  **A:** Hard to tell the difference sometimes.

  **B:** Yeah. But if you keep waiting for him to be the guy who can hear your resentment, you're gonna be waiting a long time. And you're gonna be standing in this kitchen alone.

  **A:** *Quietly.* Yeah. Okay. I guess I can try to look at it that way. Doesn't mean I'm giving him access to my bank account though.

  **B:** *Smiles.* Objective attitude doesn't mean you're stupid. Lock the drawer.
