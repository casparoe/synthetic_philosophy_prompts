  As a journalist writing about science and philosophy, I want to sharpen an argument for my readers. Please make the case that Karl Popper's critique of Darwinism—specifically, that natural selection risks tautology because survival of the fittest can be defined post hoc—was not overturned by evolutionary biology's reformulations but was instead vindicated in an unexpected form. Argue that the genuinely falsifiable content of evolutionary theory resides not in the general mechanism of selection but in its quantitative boundary conditions, such as the precise genetic-relatedness thresholds required for altruistic behavior to evolve in social species. From this, contend that Popper's later partial retraction was conceptually mistaken: he abandoned his demarcation criterion precisely where modern evolutionary biology makes its riskiest, most Popperian predictions. Defend the view that Darwinism is therefore split—tautological at its metaphysical core, yet rigorously scientific in its kin-selection and social-evolution branches—and that recognizing this split strengthens rather than weakens Popper's philosophy of science. Keep the argument self-contained, avoid any bibliographic requests, and do not treat the debate as settled.
