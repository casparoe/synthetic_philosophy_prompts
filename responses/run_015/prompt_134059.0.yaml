      *   *Structure:* Proposals must be written on the Board. To write on the Board, you need the Marker.
      *   *Initial State:* Facilitator holds Marker.
      *   *Rule:* "Proposals must be written by the proposer."
      *   *Implication:* You need the marker to propose.
      *   *Hidden Rule:* "Marker passing is not defined."
      *   *The Move:* Someone grabs the marker. Is that a proposal? Is that a rule change?
      *   *The Facilitator's Role:* Do not stop them. Log it. "Player A took the marker."
      *   *The Debrief:* That was the root key.

  6.  **Developing the Timeline:**

      *   0-5: Setup. Write rules. Hand out cards. Place "Score Notebook" visibly but casually.
      *   5-20: Normal play. Proposals about points or voting thresholds.
