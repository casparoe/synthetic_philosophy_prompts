answer: |-
  Your working hypothesis is correct, but it requires a specific philosophical deepening to fully explain the impasse. The disagreement is indeed **semantic and ontological**, not merely proof-theoretic or verbal. The sentence $\neg \forall n \neg P(n) \to \exists n P(n)$ (Markov's Principle) is not a stable proposition across the three schools because the quantifiers, the notion of decidability, and the underlying conception of the "subject" doing the mathematics differ fundamentally.

  Here is a diagnosis of the structure of the disagreement, an assessment of the alternative explanations you offered, and a realistic view of what constitutes progress in this context.

  ### 1. Diagnosis: Divergent Semantics Rooted in Ontology

  You identified that the camps range over different domains (free choice sequences vs. computable functions vs. abstract constructive functions). This is the **semantic** layer of the disagreement. However, the reason they range over different domains is **ontological**. They disagree on what mathematical objects *are* and what the purpose of mathematics is.

  **The Brouwerian (Intuitionist) Position:**
  *   **Ontology:** Mathematics is a languageless mental activity rooted in the intuition of time. The continuum is a primordial medium, not a set of points.
  *   **Semantics:** Quantifiers range over *choice sequences* (lawless or lawlike). A function is a mental construction mapping choice sequences to choice sequences.
  *   **Why they reject MP:** For Brouwer, the "Creating Subject" can generate a sequence that avoids settling a proposition indefinitely. To assert MP is to claim the Creating Subject cannot maintain this indeterminacy, which contradicts the freedom of the choice sequence. Furthermore, the **Continuity Principle** (all functions on the continuum are continuous) is a theorem of their analysis. MP contradicts continuity principles (e.g., the characteristic function of a singleton would be discontinuous).
  *   **The Impasse:** They view MP as a *falsehood* about the mental continuum.

  **The Russian (Markov) Position:**
  *   **Ontology:** Mathematics is the study of algorithms and constructive objects defined by words in a finite alphabet. There is no "primordial continuum"; there are only encodings of natural numbers and recursive functions.
  *   **Semantics:** Quantifiers range over *recursive functions* and *constructive real numbers* (Cauchy sequences with recursive rates of convergence). "Decidable" means "computably decidable."
  *   **Why they accept MP:** Under the **Recursive Realizability** interpretation (Kleene), MP is valid. If it is impossible for a recursive predicate to be false for all $n$, then there must be an $n$ for which it is true (because if the search never terminated, we would have a constructive proof of non-termination, which contradicts the hypothesis). They treat MP as a reflection of the nature of algorithms.
  *   **The Impasse:** They view the Brouwerian continuum as metaphysical nonsense. For them, a "function" that isn't computable doesn't exist.

  **The Bishop Position:**
  *   **Ontology:** Agnostic/Pragmatic. Bishop explicitly rejected Brouwer's metaphysics ("the Brouwerian philosophy is not necessary for constructive mathematics") and found the Russian school too restrictive for analysis.
  *   **Semantics:** Quantifiers range over "constructive functions" defined informally but intended to be interpretable in various systems (type theory, set theory with constructive logic, etc.).
  *   **Why they are neutral:** Bishop's goal was to rebuild classical analysis with constructive proofs, accessible to classical mathematicians. Adopting MP would alienate intuitionists; adopting Continuity would alienate classical mathematicians and computability theorists. He treats MP as an independent principle: useful in some contexts (e.g., certain measure theory results), but not a universal law.
  *   **The Impasse:** Bishopians view the other two as ideologically captured. Brouwerians see Bishop as insufficiently radical; Markovians see Bishop as insufficiently precise.

  **Conclusion on Diagnosis:** The disagreement is **not verbal** (a) because the consequences for analysis are real (e.g., the existence of certain functionals). It is **not merely proof-theoretic** (b) because the choice of axioms is driven by the semantic/ontological commitments. It **is ontological** (c), manifesting semantically. You are right: they are speaking different languages that share a syntax but have different model theories.

  ### 2. Why the Impasse Persists

  The impasse persists because each school is optimizing for a different virtue, and these virtues are mutually incompatible in a single system.

  1.  **Brouwerians optimize for Phenomenological Fidelity:** They want the math to match the intuition of the temporal flow and the freedom of the subject. This requires refuting classical tautologies (like LPO) and accepting continuity.
  2.  **Markovians optimize for Computational Concreteness:** They want every existence claim to yield a Turing machine. This requires MP and often leads to a very narrow view of the continuum (only computable reals).
  3.  **Bishopians optimize for Generality and Applicability:** They want the math to work for numerical analysis and be interpretable by classical mathematicians. This requires avoiding principles that are refutable in one model (Brouwer's) or unprovable in another (Classical/Recursive).

  Because these goals are orthogonal, no amount of logical argumentation will convert a Brouwerian to Markov's principle. To accept MP, the Brouwerian would have to abandon their conception of the choice sequence. To reject MP, the Markovian would have to abandon the recursive interpretation of existence. These are not logical deductions; they are foundational stances.

  ### 3. What Counts as Progress?

  Since this is not a puzzle with a single solution but a divergence of foundational aims, "solving" the disagreement (i.e., getting everyone to agree on MP) is impossible and arguably undesirable. However, significant progress has been made and can continue in the following forms:

  **A. Unified Semantics (Topos Theory and Categorical Logic)**
  The most successful progress so far is the realization that these schools correspond to the internal logic of different **categories (toposes)**.
  *   **Brouwerian intuitionism** is modeled in sheaf toposes over Baire space or topological spaces (where continuity principles hold).
  *   **Russian constructivism** is modeled in the **Effective Topos** (where MP holds and everything is recursive).
  *   **Bishop-style math** is modeled in **Predicative Toposes** or Martin-Löf Type Theory, which can be interpreted in both of the above.
  *   **Progress:** Recognizing that "Constructive Mathematics" is not a single theory but a family of theories parameterized by the choice of topos. This vindicates your hypothesis formally: the "domain of quantification" is the global sections of the subobject classifier in a specific category. Progress here involves mapping exactly which principles hold in which toposes (e.g., the "Constructive Reverse Mathematics" program).

  **B. Proof Mining and Explicit Bounds**
  Work by Kohlenbach and others in **Proof Mining** treats the disagreement instrumentally. They take classical proofs (or proofs using MP) and extract constructive content (bounds, rates of convergence) without committing to the ontology.
  *   **Progress:** Showing that even if we disagree on the truth of MP, we can agree on the computational content of theorems derived using it. This bypasses the ontological fight by focusing on the *output* of the mathematics rather than the *nature* of the objects.

  **C. Homotopy Type Theory (HoTT) and Univalent Foundations**
  HoTT offers a new language where the distinction between "proposition" and "data" is handled via the hierarchy of types ($n$-types).
  *   **Progress:** While HoTT has its own debates (e.g., regarding the Axiom of Choice and Excluded Middle), it provides a framework where computational content (via the univalence axiom and higher inductive types) and spatial/continuity intuition (via homotopy) can coexist more naturally than in first-order arithmetic. It reframes the question from "Is MP true?" to "What is the homotopical level of this assertion?"

  **D. Conceptual Clarification (The "Change of Question")**
  The most honest progress is accepting the **pluralist diagnosis**.
  *   **Progress:** Stopping the attempt to define *the* constructive mathematics. Instead, we specify: "Constructive mathematics *in the sense of Bishop*," "Constructive mathematics *in the sense of Markov*," etc.
  *   **Why:** This prevents the "talking past each other" phenomenon. When a Bishopian says "function," they should explicitly state whether they are working in a context where MP is assumed. When a Brouwerian claims MP is false, they should specify "false in the theory of choice sequences."

  ### Summary Recommendation

  You should proceed with the confidence that your diagnosis is correct: **the disagreement is semantic/ontological, not logical.** The "same" formula has different truth conditions because the models of the world differ.

  **Do not expect** the impasse to resolve via a new proof or a clever definition that satisfies all three. That would be like expecting a Euclidean geometer and a Hyperbolic geometer to agree on the Parallel Postulate via argument.

  **Do expect** progress via:
  1.  **Formal Separation:** Using topos theory to rigorously delineate which principles are compatible with which semantic frameworks.
  2.  **Translation:** Developing systematic translations between the schools (e.g., how to interpret Bishop-style analysis within the Effective Topos).
  3.  **Instrumentalism:** Focusing on what computational data can be extracted from theorems regardless of the foundational stance (Proof Mining).

  The "impasse" is actually a mature landscape. The frustration you feel comes from the lingering hope that there is a single "Constructive Truth." Abandoning that hope in favor of a mapped plurality is the sign of progress in this field.
