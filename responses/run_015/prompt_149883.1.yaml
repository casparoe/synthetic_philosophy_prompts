answer: |-
  Here is a plan for a ninety-minute whiteboard session designed to meet your specific pedagogical aims.

  ### Phase 1: The Objects (0–20 minutes)
  **Goal:** Define the vocabulary without jargon.
  **Board Layout:** Left third reserved for definitions.

  1.  **The Rule as a Function (0–10 mins)**
      *   **Draw:** Inputs (List of Voter Rankings) $\rightarrow$ Black Box (Rule) $\rightarrow$ Output (Single Winner).
      *   **Say:** "We are not discussing campaigns or persuasion. We are discussing a function. Input: a profile of strict rankings. Output: one winner."
      *   **Why this order:** If you define manipulability before defining the rule as a deterministic function from profiles, they will confuse *uncertainty* with *strategy*. The function must be fixed before it can be gamed.

  2.  **Manipulability (10–20 mins)**
      *   **Write:** "A rule is manipulable if there exists a profile where a voter, knowing the others' ballots, submits a lie and gets a *strictly better* outcome."
      *   **Say:** "It is not about changing the winner. It is about changing the winner to something *you prefer more*."
      *   **Why this order:** If you state the theorem before this, "manipulable" sounds like a moral failing. Defined here, it is a structural property of the function.

  ### Phase 2: The Core Example (20–45 minutes)
  **Goal:** One example that proves the necessity of the conditions.
  **Board Layout:** Center third.
  **The Setup:** 3 Voters (1, 2, 3), 3 Options (A, B, C). Rule: Borda Count (2 pts for 1st, 1 for 2nd, 0 for 3rd).

  **The Profile:**
  *   **Voter 1 (You):** A > B > C
  *   **Voter 2:** B > C > A
  *   **Voter 3:** C > A > B

  **The Execution:**
  1.  **Truthful Vote:** A(3), B(3), C(3). Tie. (Adjust Voter 3 slightly to C > B > A to make C win cleanly, or assume a tie-break favors C). Let's say **C wins**.
  2.  **Strategic Vote:** Voter 1 changes ballot to B > A > C (demoting true top A).
  3.  **Result:** B(4), A(2), C(3). **B wins**.
  4.  **Verification:** Voter 1 prefers B over C. Manipulation succeeded.

  **What This Example Must Have (and Why):**
  *   **Three Attainable Outcomes:** If only A and B were possible, you could use simple majority (strategy-proof for 2 options). The example *must* show C is possible but defeated. If the range is size 2, GS does not apply.
  *   **Manipulation Must Succeed:** If the lie changes the winner to something *worse* or *equal*, it is not manipulation. The definition requires strict improvement.
  *   **Perfect Information:** The voter must know Voters 2 and 3's ballots. If there is uncertainty, this is Bayesian manipulation (a different theorem). GS is about the *existence* of a vulnerable profile, not the likelihood.
  *   **No Intensities/Ties/Morals:**
      *   *Intensities:* GS is ordinal. If you allow "I love A twice as much as B," you leave the domain.
      *   *Ties:* Complicates the "function" definition. Keep outcomes single-valued.
      *   *Morals:* Do not use words like "cheating" or "honest." Use "truthful reporting" vs. "strategic reporting." This is engineering, not ethics.

  **What Breaks if You Change This:**
  *   If you use 2 options: They will think Majority Rule disproves the theorem.
  *   If you use uncertainty: They will think "polling" solves the problem.
  *   If you use moral vocabulary: They will think "culture" solves the problem.

  ### Phase 3: The Theorem Statement (45–55 minutes)
  **Goal:** Formalize the intuition.
  **Board Layout:** Top of Center third.

  **Write:**
  **Gibbard–Satterthwaite:** For any voting rule with **3 or more possible outcomes**, if the rule is **not dictatorial**, it is **manipulable**.

  **The Load-Bearing Conditions:**
  1.  **Range $\ge$ 3:** (Refer to the 2-option counterexample).
  2.  **No Dictator:** Define dictator technically: "A voter whose top choice *always* wins, regardless of others." If a dictator exists, the rule is strategy-proof (the dictator tells the truth, others don't matter).
  3.  **Deterministic:** (Implicit in your function definition).

  **Why this order:** You cannot appreciate the constraints until you have seen the example break when constraints are removed.

  ### Phase 4: The Misconception Map & Escape Routes (55–80 minutes)
  **Goal:** Distinguish real escape routes from imaginary ones.
  **Board Layout:** Right third.

  Draw a table: **Misconception** | **Reality** | **Placement in Sequence**

  1.  **"This is Arrow's Theorem."**
      *   *Reality:* Arrow ranks *societies* (transitivity of social welfare). GS picks *one winner* (strategy-proofness).
      *   *Placement:* Immediately after stating the theorem.
  2.  **"Democracy is impossible / All systems equally bad."**
      *   *Reality:* GS says *perfect* immunity is impossible. Some systems are harder to game than others (computationally or informationally).
      *   *Placement:* During "Manipulability" definition review.
  3.  **"We have 5 seats, not 1."**
      *   *Reality:* If you elect a committee, the "outcome" is the *set* of 5 people. There are thousands of possible sets. GS applies. If you run 5 separate elections, GS applies to each.
      *   *Placement:* When discussing the "Single Winner" condition.
  4.  **"Approval/Score Ballots evade it."**
      *   *Reality:* GS applies to *ordinal* rankings. Cardinal rules (Score) evade *this specific theorem*, but Gibbard (1978) extends the impossibility to cardinal domains if you require strategy-proofness everywhere. Approval voting is manipulable (e.g., bullet voting).
      *   *Placement:* When discussing "Domain of inputs."
  5.  **"Vickrey/Second-Price tricks work."**
      *   *Reality:* VCG mechanisms are strategy-proof but require *transferable utility* (money/subsidies). You cannot pay open-source maintainers to vote truthfully.
      *   *Placement:* Under "Escape Routes."
  6.  **"People are constantly manipulating."**
      *   *Reality:* GS proves a vulnerable profile *exists*. It does not prove voters can *find* it. (Computational complexity as a shield).
      *   *Placement:* During "Perfect Information" review.

  **On Randomization:**
  *   **Does it belong?** Yes, but only as a closed door.
  *   **Where:** In "Escape Routes."
  *   **Argument:** Gibbard (1977) proved that for random social choice functions, the only strategy-proof rules are **random dictatorships** (pick a voter at random, let them decide). This buys you fairness, but not strategy-proofness without dictatorship.
  *   **Verdict:** Mention it to kill the "let's just add noise" idea, then move on.

  ### Phase 5: Omissions & The Check (80–90 minutes)
  **Goal:** Verify understanding without drowning in math.

  **What to Leave Out (Say Aloud):**
  *   "I am leaving out the **proof**. It relies on an induction over the number of voters or the 'pivotal voter' lemma. It is rigorous, but it will not help you design a charter. Knowing *that* it is true is more useful than knowing *why*."

  **The Closing Exercise:**
  *   **Your Draft:** "Here is a rule I invented... find me a manipulation."
  *   **Critique:** This is the **right kind of test**. It forces them to apply the definition of manipulability (strict improvement via lying) rather than reciting the theorem.
  *   **Refinement:** Keep the rule extremely simple to ensure they finish in 10 minutes.
      *   *Rule:* "Plurality. If there is a tie, the winner is the option alphabetically first."
      *   *Task:* "Construct a 3-voter, 3-option profile where Voter 1 lies to win."
      *   *Why better:* It isolates the logic from complex counting rules like Borda.
  *   **Alternative:** Give them a profile and ask: "Is this a manipulation? Why or why not?" (Faster, but less active). Stick to your draft; it's more engaging for engineers.

  **The Single Sentence Test:**
  If a volunteer can produce this sentence the next day, the session worked:
  > **"If we want more than two possible outcomes and we don't want a dictator, we must accept that someone can sometimes benefit by lying."**

  ### Summary of Board Management
  *   **Left:** Definitions (Function, Profile, Manipulability).
  *   **Center:** The 3x3 Example (Truthful vs. Strategic) + Theorem Statement.
  *   **Right:** Misconception Map (Arrow, 5 Seats, Cardinal, Randomization).
  *   **Bottom:** The Exercise & The Sentence.

  ### Why This Flow Works
  1.  **Function First:** Prevents confusion about what is being manipulated.
  2.  **Example Second:** Grounds the abstraction in a solvable puzzle.
  3.  **Theorem Third:** Now the conditions make sense because they saw the example break without them.
  4.  **Misconceptions Fourth:** Now that they know the theorem, they can properly categorize the exceptions.
  5.  **Exercise Last:** Active recall confirms the definitions stuck.

  This plan respects the engineers' desire for mechanism design rigor while acknowledging their lack of formal econ background by stripping away the proof and focusing on the structural constraints.
