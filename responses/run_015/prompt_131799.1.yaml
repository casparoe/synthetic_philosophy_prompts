answer: |-
  **Recommendation**
  The Board requires immediate payment of the withheld balance. We cannot accept escrow to a private charity. We will place a motion to amend the conscientious-objection policy on the agenda for the annual meeting in eleven weeks. Until members vote otherwise, the existing budget stands.

  **Reasons**
  The member frames this compulsory charge as theft, implying a taking lacking consent, benefit, or entitlement. We must examine which feature allegedly constitutes the wrong.

  It is not absence of entitlement. Upon payment, carrying charges become co-op property, not earmarked funds. You do not retain ownership of specific dollars. It is not absence of benefit. "Common benefit" in our bylaws does not mean identical utility for every unit. Lobbying on housing stability affects our regulatory environment and property values collectively, even if some dissent from the tactic. Indirect benefit suffices for commonality.

  The core claim is absence of consent. However, consent was granted upon purchase. By buying in, you agreed to majority governance on budgetary matters. A taking becomes theft only when authority is absent. Here, authority derives from the governance structure you voluntarily joined.

  The member argues our difference from a state—that he can exit by selling—makes our position worse, claiming this coerces asset liquidation. We give this serious consideration. Selling a home is disruptive, costly, and deeply personal; it is not a trivial opt-out like canceling a magazine subscription. To suggest that a member must destroy their living arrangement to avoid funding a $3 objection implies a coercive lock-in. If the only remedy for moral disagreement is liquidating one's home, the burden is significant. However, this burden does not transform contract into theft. The state holds monopoly power; the co-op is a voluntary association. The cost of exit is a market condition, not coercive takings. The ability to leave confirms the voluntary nature of the financial obligation. Labeling a contractual obligation as theft because fulfilling it is costly conflates economic burden with moral wrong. We acknowledge the frustration of being overruled, but frustration is not theft.

  **Objections We Are Overruling**
  We recognize the moral weight of conscientious objection. We understand that being compelled to fund speech one opposes feels like a violation of integrity. In a state, this might trigger First Amendment protections. However, granting an exemption undermines the co-op as a voluntary association.

  First, it fragments the indivisible pool. Carrying charges function because everyone funds the whole. Allowing itemized veto power shifts the burden to other members, effectively taxing their consent to subsidize your objection. If you pay less, others must pay more, or services degrade.

  Second, it sets an unmanageable precedent. If political advocacy is exemptible, what follows? Objections to insurance carriers? Heating fuel sources? Maintenance contractors? A co-op cannot function if every expenditure requires unanimous moral alignment.

  Third, it alters the nature of our community. We are not a loose coalition of individuals but a shared enterprise. Over the next several years, permitting selective funding would erode the solidarity required for collective maintenance and capital planning. It transforms membership from a shared commitment into a menu of opt-ins. This risks turning the board into a bargaining table for individual exemptions rather than a steward of common resources. If members begin viewing charges as optional based on personal preference, the financial stability required for long-term capital projects becomes precarious. We risk creating a culture where collective responsibility is subordinate to individual conscience, ultimately weakening the cooperative structure that protects our housing security.

  We will vote on changing this dynamic in eleven weeks. Until then, the majority decision stands.
