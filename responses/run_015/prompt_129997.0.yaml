answer: |-
  ### 1. The Carrying Case: The Static Page-Turning Book

  **Selection:** The **Static Page-Turning Book**.

  **Inclusion/Exclusion Criteria:**
  *   **Must Include:** **Real-time Environmental Coupling.** The mechanism turning the pages cannot run on a fixed timer or pre-determined script. It must select the next page based on *sensory inputs* (e.g., light hitting a sensor on the page determines the next turn). The book must function as a **Giant Lookup Table** where Input State $I_n$ + Current Page $P_n$ $\rightarrow$ Output $O_n$ + Next Page $P_{n+1}$.
  *   **Must Exclude:** **Atemporal Symbol Storage.** The book cannot be a passive recording (like a diary or a video) of a brain's past activity. It cannot merely *describe* the states; it must *mediate* the transition between them in response to the world.

  **Why This Feature Carries the Load:**
  This distinction secures the conceptual dependency of **Counterfactual Sensitivity**. For the scenario to avoid being a category mistake (confusing a *map* of a mind for a *mind*), the system must possess the capacity to have behaved differently had the inputs differed. A passive recording lacks counterfactuals (if the input changed, the recording would not); a coupled lookup table retains them. Without this, the scenario collapses into a trivial claim about records, rather than a stress test for Functionalism.

  ***

  ### 2. The Teaching Arc (50 Minutes)

  **0:00–0:10 | Phase 1: The Biological Baseline (The Vat)**
  *   **Activity:** Briefly re-establish the "Einstein's Brain in a Vat" scenario. Confirm consensus: If we keep the biological neurons alive and stimulate them exactly as if they were in a body, the vat-brain is conscious.
  *   **Goal:** Secure the intuition that *functional continuity* preserves consciousness, even without a body.
  *   **Transition:** Ask: "If the *activity* of the neurons is what matters, does the *stuff* doing the activity matter?"

  **0:10–0:25 | Phase 2: The Translation (Introducing the Book)**
  *   **Activity:** Introduce the Book Carrying Case. Describe the mechanism: sensors read the page, motors turn the page, speakers emit sound based on the text.
  *   **Intercept Misconception 1:** *"Functional isomorphism entails phenomenal identity."*
      *   **Location:** Immediately after describing the Book's input/output matching the brain's.
      *   **Defusing Distinction:** **Formal Mapping vs. Causal Instantiation.**
      *   **Intervention:** Ask: "Does a perfect map of a territory *contain* the territory?" Force students to see that establishing the *isomorphism* (the map matches) is not the same as establishing *identity* (the map is the territory). We are testing whether the map *becomes* the territory when animated, not assuming it does.

  **0:25–0:35 | Phase 3: The Material Challenge**
  *   **Activity:** Press the intuition that paper is "dead" and neurons are "alive."
  *   **Intercept Misconception 2:** *"The substrate (paper versus neurons) is decisive."*
      *   **Location:** During the discussion of the book's material composition.
      *   **Defusing Distinction:** **Causal Power vs. Material Constitution.**
      *   **Intervention:** Point out that neurons are also just "stuff" obeying physics. Ask: "If we replaced one neuron with a functionally identical silicon chip, does consciousness vanish?" (The Sorites push). The distinction to enforce is that consciousness relies on the *pattern of causation*, not the *chemical nature* of the relata, provided the causal power is preserved.

  **0:35–0:45 | Phase 4: The Searle Objection**
  *   **Activity:** Invite the Searle-trained students to deploy the Chinese Room.
  *   **Intercept Misconception 3:** *"This collapses into the Chinese Room."*
      *   **Location:** Final argumentative synthesis.
      *   **Defusing Distinction:** **Subsystem Semantics vs. System-Wide Causal Topology.**
      *   **Intervention:** In the Chinese Room, the *man* doesn't understand Chinese, but the *Room* might. In the Book, there is no "man inside" manipulating symbols; the *Book itself* is the whole system. The distinction is that Searle attacks *syntax manipulation by an agent*, whereas this scenario tests *total state replication of a system*. The objection shifts from "syntax isn't semantics" to "simulation isn't duplication."

  **0:45–0:50 | Phase 5: Closing Check**
  *   **Activity:** Administer the diagnostic test (see below).
  *   **Goal:** Verify separation of causal integration from representational completeness.

  ***

  ### 3. The Closing Check

  **The Diagnostic Prompt:**
  > "Consider two objects:
  > 1.  **The Archive:** A book containing a printed transcript of every state Einstein's brain *actually* entered during a specific conversation, bound in sequential order.
  > 2.  **The Oracle:** A book containing rules for *every possible* state Einstein's brain *could* enter, where a mechanism selects the next page based on live sensory input.
  >
  > If Functionalism is true, which object is conscious? If you choose The Archive, you have confused **Representational Completeness** with **Causal Integration**. If you choose The Oracle but cannot explain why the *selection mechanism* matters more than the *ink*, you have not secured the dependency chain."

  **Success Criteria:**
  Students must identify **The Oracle** as the only candidate for consciousness *and* justify it by citing the **counterfactual sensitivity** of the page-turning mechanism (Causal Integration), rather than the richness of the text (Representational Completeness).

  ***

  ### 4. The Bracketed Problem

  **Problem to Bracket:** **The Hard Problem of Consciousness (Chalmers).**

  **Justification:**
  We must explicitly bracket the question *"But does it feel like anything to be the book?"* (Qualia/Experience).
  *   **Why:** The Hard Problem asks *why* physical/functional processes give rise to experience at all. This session is designed to test **Functionalism's Sufficiency** (does organization $X$ constitute mind $Y$?), not **Explanatory Identity** (how does organization $X$ generate feeling $Z$?).
  *   **Protection of Dependency Chain:** If students invoke the Hard Problem, they can dismiss the Book scenario by simply asserting "Paper doesn't feel," which bypasses the functionalist argument entirely. Bracketing it forces them to engage with the *structural* conditions for mind (causal role, counterfactuals, substrate independence) without retreating to the inexplicability of qualia. It keeps the debate on the *criteria for attribution*, not the *nature of existence*.
