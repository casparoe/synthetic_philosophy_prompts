answer: |-
  Here is the adjudication of the exchange, turn by turn, followed by an analysis of the four specific issues and an overall judgment.

  ### Turn-by-Turn Verdicts

  **1. Ruth:** **Partly Right.** (Confidence: High)
  She accurately identifies the "post-hoc" risk: if you infer the selection pressure solely from the existing trait, you risk circularity. However, she overstates the case by implying *all* EP work is generated this way. Some hypotheses arise from formal modeling or comparative data before looking at human specifics.
  *What would move me:* Evidence of major EP papers where the selection pressure was specified *before* the behavioral data was collected, without reference to the trait's current form.

  **2. Emil:** **Partly Right.** (Confidence: Medium-High)
  He is right that serious EP makes novel predictions (e.g., disgust tracking transmissibility, not just toxicity). This defeats the claim that EP is *in principle* unfalsifiable. However, his geology analogy is vulnerable. Geology has physical traces (strata); EP often reconstructs the "strata" (ancestral environment) from the very traits it tries to explain.
  *What would move me:* A demonstration that EP reconstructs ancestral environments using data independent of the psychological traits in question (e.g., paleoclimatic data driving specific social predictions).

  **3. Ruth:** **Right.** (Confidence: High)
  Her distinction between "directional/soft" predictions and hard constraints is methodologically sound. "More/faster/stronger" allows too much narrative flexibility. Her rebuttal on geology is also strong: isotope ratios are independent of the biological traits; cross-cultural recurrence is the *datum*, not the independent check.
  *What would move me:* Examples of EP predictions that are quantitative and risky (e.g., specific threshold values) rather than ordinal.

  **4. Emil:** **Right.** (Confidence: High)
  He is logically correct here. Universals do constrain cultural explanations. If a trait appears in isolated societies, "local learning" becomes less parsimonious. This is a genuine constraint, even if it doesn't prove adaptation.
  *What would move me:* Evidence that purported universals are actually artifacts of poor sampling or shared deep ancestry not accounted for.

  **5. Ruth:** **Right.** (Confidence: High)
  "Target drift" is a documented rhetorical strategy in the field. Shifting from explaining a specific behavior to explaining a "flexible capacity" immunizes the hypothesis against counter-evidence. If variation is always explained away as "ecological calibration," the core claim risks becoming unfalsifiable.
  *What would move me:* A standard in the field requiring researchers to specify in advance which variations would count as falsification of the adaptive hypothesis.

  **6. Emil:** **Partly Right.** (Confidence: Medium)
  He is biologically correct: conditional strategies (reaction norms) are real and testable. However, this does not fully answer Ruth's falsifiability worry. If the "cue" for the switch is identified post-hoc, the test is weak. It is only a strong test if the cue is predicted independently.
  *What would move me:* Cases where the specific environmental cue triggering the switch was predicted before the data was gathered.

  **7. Ruth:** **Right.** (Confidence: Very High)
  This is the strongest philosophical point in the exchange. Proving a mechanism exists (Track i) does not prove it was selected for its current function (Track ii). It could be a byproduct, exaptation, or drift. The field often treats Track i findings as confirmation of Track ii.
  *What would move me:* Widespread adoption in EP journals of explicit null models testing non-adaptive explanations alongside adaptive ones.

  **8. Emil:** **Partly Right.** (Confidence: Medium-High)
  He is right that Inference to the Best Explanation (IBE) is valid for historical sciences. However, IBE requires weighing competing hypotheses. If non-adaptive alternatives are not "specified with equal care" (as Ruth notes), IBE is biased. His claim that domain-general learning has been tested is true, but often with less theoretical development than EP models.
  *What would move me:* A comparative analysis of the theoretical rigor given to adaptive vs. non-adaptive null models in top EP journals.

  **9. Ruth:** **Right.** (Confidence: High)
  This successfully undermines Emil's geology analogy. Optics provides an independent standard for the eye; there is no "physics of gossip" to independently validate a gossip module. When the "design criteria" are derived from folk psychology, circularity is a genuine risk.
  *What would move me:* Identification of independent formal constraints on social problems (e.g., game-theoretic equilibria) that are used to validate EP claims without reference to folk intuition.

  **10. Emil:** **Partly Right.** (Confidence: Medium)
  Retreating to "heuristic" saves the research program's utility but concedes its truth claims. Formal models and primate data are semi-independent, but they often rely on the same assumptions about ancestral costs and benefits. It is a pragmatic defense, not an epistemic one.
  *What would move me:* Evidence that EP heuristics lead to discoveries that are subsequently explained better by non-evolutionary frameworks (showing the heuristic was useful but the theory false).

  **11. Ruth:** **Right.** (Confidence: High)
  She correctly identifies the sociological reality. Textbooks and popularizations present selection stories as established facts ("cash"), not working hypotheses ("promissory notes"). If the defense is "it's just a heuristic," then the field's rhetoric is misleading.
  *What would move me:* A shift in the field's communication norms where selection histories are consistently labeled as provisional.

  ***

  ### Analysis of Specific Issues

  **(a) Whether EP hypotheses are testable in principle:**
  **Verdict:** Yes. Emil is correct here. There is no logical barrier to testing EP hypotheses. We can measure physiological responses, identify neural circuitry, and test cross-cultural predictions. The charge that EP is *untestable* (Turn 1) is false; the charge that it is *often poorly tested* (Turn 3) is true.

  **(b) Whether actual practice puts the selection claim at risk or only the mechanism claim:**
  **Verdict:** Ruth is more correct. In practice, researchers often demonstrate a mechanism (Track i) and treat it as confirmation of the selection history (Track ii). The selection history is rarely subjected to the same risk as the mechanism. The "Two-Track Test" (Turn 7) reveals a gap in standard methodology: demonstrating function today does not prove historical selection for that function.

  **(c) What Ruth's two-track test would and would not establish:**
  **Verdict:** If run, it would establish that a trait is an adaptation *only if* the selection-history claim survives attempts to falsify it against non-adaptive null models (drift, byproduct). It would *not* establish that a trait is *not* an adaptation if the test fails, because reconstructing ancestral environments is inherently noisy. It establishes a burden of proof, not a definitive disproof. It forces the field to separate proximate causation (how it works) from ultimate causation (why it evolved).

  **(d) Whether Emil's retreat to "heuristic, not finding" gives Ruth everything she asked for:**
  **Verdict:** It gives her 90% of what she asked for. She wants the selection story marked as a "promissory note." Emil agrees it is a heuristic. The remaining 10% is that Emil still implies the heuristic is *likely* true, whereas Ruth wants agnosticism until the selection claim is independently verified. Emil's retreat saves the *practice* of EP but concedes the *epistemic status* of its core claims.

  ***

  ### Overall Adjudication

  **Who is more right?**
  Ruth is more right on the **epistemology**; Emil is more right on the **biology**.

  Ruth wins the argument regarding the logical status of the claims. She successfully demonstrates that the selection histories in EP are often under-constrained compared to the mechanisms, and that the field's rhetoric often outpaces its evidence. Her critique of the geology analogy (Turn 9) is decisive: without independent physical records of the "selection environment," EP relies more heavily on inference than geology does.

  Emil wins on the plausibility of the enterprise. Brains are biological organs; they evolved. It is biologically incoherent to assume domain-general learning without assuming evolved mechanisms *for* learning. His defense of conditional strategies (Turn 6) is scientifically robust.

  **Is the question ill-posed?**
  Yes, in one specific respect: The binary of "Science vs. Just-So Story" implies a demarcation line that does not exist in historical sciences. Science is a spectrum of rigor. EP is not a monolith; some sub-fields (e.g., disease avoidance) are rigorous, while others (e.g., specific mating preferences) are prone to the storytelling Ruth critiques. Asking if "EP is a science" is like asking if "medicine is a science"—some of it is physics, some of it is tradition.

  However, within the bounds of their specific arguments about *methodological rigor*, the question is well-posed, and Ruth has the stronger case regarding the current standards of evidence for selection claims.

  ***

  ### What Both Are Missing

  **1. Gene-Culture Coevolution:**
  Both treat "Evolutionary" and "Cultural" as rival explanations (Turn 3, Turn 8). This is a false dichotomy. Human evolution is characterized by gene-culture coevolution. The "selection environment" often includes cultural artifacts. A trait could be an adaptation to a *culturally constructed* niche. Both miss that the "ancestral environment" is not just the Pleistocene savanna; it includes the social structures humans built, which then selected for further psychological changes.

  **2. The Problem of "Function" in Biology:**
  Ruth assumes that proving a trait is useful now (Track i) is distinct from proving it was selected for that use (Track ii). In biology, current function is often the primary evidence for historical selection, provided the fit is precise. They miss the middle ground: **Comparative Phylogenetics.** If a trait and its proposed function co-vary across related species controlling for ancestry, that is evidence for selection history that neither Ruth nor Emil emphasizes.

  **3. Framing Error on "Just-So Stories":**
  Ruth uses "just-so story" to mean "unfalsifiable." Emil uses it to mean "untested." This ambiguity drives the conflict. A story is only a "just-so story" if it is *immune* to evidence. If Emil admits they are heuristics (Turn 10), he admits they are currently "untested stories," but not necessarily "untestable." They need to agree on whether the sin is lack of testing (Emil's view) or structural immunity to testing (Ruth's view). The reality is a mix: structurally vulnerable to immunity (Ruth is right), but practically often tested (Emil is right).

  **4. The Role of Formal Modeling:**
  Emil mentions formal models (Turn 10) but treats them as support. Ruth ignores them. Formal evolutionary models can specify exactly when a trait *cannot* evolve by drift or byproduct. If the field used these models to rule out non-adaptive explanations *before* collecting data, Ruth's "Two-Track Test" would be partially satisfied. Both underestimate the potential of modeling to bridge the gap between mechanism and history.
