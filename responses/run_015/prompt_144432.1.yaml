      *   *Determinacy:* How do I make the question have a "determinate answer"? I need to frame it as identifying the *intersection* of specific candidate repair classes. I will define "Acceptable Repair" operationally for the project.
      *   *The "Failure" Condition:* This is crucial. It shows philosophical maturity. If the concept of "acceptable repair" is inherently political or aesthetic rather than logical, the project fails to find a logical basis, which is itself a finding, but I need to distinguish between "project fails to prove hypothesis" and "project concept is incoherent."

