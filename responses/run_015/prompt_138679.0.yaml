  ### Pre-Draft Analysis: Competing Considerations

  **The Vendor's Claim (The Frame Problem):** They argue the frame problem is specific to symbolic AI (explicit rules about what stays the same). They claim LLMs bypass this by learning relevance from data.
  *   *Where it bites:* They are technically correct that they lack symbolic frame axioms, but philosophically wrong that this solves the problem. The frame problem is fundamentally about *relevance*: when one thing changes (procedure cancelled), what else changes? An LLM predicts text based on statistical likelihood. If 95% of procedures happen, the model learns "procedure order → post-procedure order." It doesn't "know" causality. When the 5% cancellation occurs, the model defaults to the likely path. This *is* a frame problem, just probabilistic rather than logical. My brother's "null-pointer" analogy is wrong; a null-pointer crashes the system. This is a silent reasoning failure, which is clinically worse.

  **The CMIO's Point (Human Standards):** Humans also miss dependencies. We coast on heuristics. Banning AI for this bans humans too.
  *   *Where it bites:* This is the strongest argument against over-regulation. However, humans are accountable agents; we can be asked "Why did you keep that order?" and must produce a reason. An LLM cannot produce a reason unless we force it to generate one. The standard shouldn't be "perfect safety" (impossible for humans or machines) but "auditability." We need to see the AI's work like we see a nurse's charting.

  **The Intensivist's Point (Silent Failures):** The risk isn't the error; it's the invisibility.
  *   *Where it bites:* Correct. If the system doesn't flag what it *didn't* reconsider, we can't trust it.

  **The Proposed Condition (Receipts + Testing):**
  *   *Verdict:* This is the right ask, but only if framed correctly. Asking for a "reason" invites hallucination. Asking for a "log of what was touched" is technical and verifiable. The perturbed test set is crucial—it moves us from "trust the vendor" to "verify the performance on edge cases." It doesn't solve the frame problem, but it maps the boundaries of where the system fails, which allows us to manage the risk.

  **Recommendation:** Renew for six months, no expansion. Conditions: Transparency logs + adversarial testing. This balances the CMIO's need for tools with the Intensivist's need for safety.

  ***

  **MEMORANDUM**

  **TO:** Clinical AI Review Committee
  **FROM:** Clinical Ethicist
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Clementine Pilot Status

  **Recommendation**
  I recommend we renew the Clementine pilot for six months with strict conditions and no expansion to additional units. We should not terminate the pilot, as the tool provides documented value in reducing dropped follow-ups and nursing workload. However, we cannot expand until we resolve the issue of silent dependency failures. The proposed conditions focus on transparency and adversarial testing rather than impossible guarantees of safety.

  **The Vendor's Defense and the Frame Problem**
  The vendor argues that the "frame problem"—the difficulty of determining what information remains valid when a situation changes—applies only to older symbolic systems. They claim their Large Language Model (LLM) avoids this because it does not maintain a rigid state model; it simply predicts the next likely text based on the whole chart.

  This is partially true but clinically misleading. While Clementine lacks symbolic rules, it still suffers from a probabilistic version of the same problem. The system learns patterns from data. If 95% of scheduled procedures occur, the model learns that "procedure ordered" usually leads to "post-procedure orders." When a procedure is cancelled (the 5% case), the model lacks a causal understanding of why the orders should stop. It defaults to the statistical norm. This is not a software crash or a "null-pointer bug"; it is a reasoning gap hidden by confidence. The system does not know what it does not know. Therefore, the vendor's claim that the frame problem does not apply is incorrect; it is merely hidden in the weights of the model rather than explicit in the code. We cannot accept the assertion that relevance is "learned" as proof of safety, because learning relies on past frequency, not current causality.

  **The Human Standard (CMIO's Concern)**
  The CMIO argues that holding Clementine to a standard of perfect dependency tracking is unfair because human clinicians also miss dependencies. We all coast on heuristics. If we ban the tool for errors humans also make, we deny our staff a useful resource.

  This is a valid point, but it conflates *capability* with *accountability*. When a human clinician misses a dependency, they are an accountable agent. We can ask them, "Why did you carry this order forward?" and they must provide a rationale or admit error. Clementine cannot do this unless we require it to. The issue is not that the AI makes mistakes; it is that it makes them silently. Humans have situational awareness (seeing the patient, hearing about the OR delay) that the AI lacks. To equate the two is to ignore that the AI operates in a vacuum of text. We are not holding the AI to a higher standard of *performance* than humans; we are holding it to a higher standard of *visibility*. If the tool is to act as a team member, its reasoning must be as charted and auditable as a nurse's note.

  **The Silent Failure Mode (Intensivist's Concern)**
  The Intensivist's concern is the most critical: the system's characteristic failure is invisible. When Clementine drops an order, it is logged. When it carries forward an inappropriate order because it missed a cancellation, nothing flags. This creates an audit gap. We cannot manage risk we cannot see. If we expand the tool to more units without fixing this visibility gap, we scale the risk of silent harm. The incident with the Parkinson's patient was caught by chance. The earlier unflagged cases confirm that silent failures are systemic, not isolated.

  **Proposed Conditions for Renewal**
  To address these issues without discarding the tool's benefits, I propose two conditions for the six-month renewal:

  1.  **Decision Provenance Logs:** The vendor must modify the output to include a machine-readable log attached to each plan. This log should not ask the AI to "explain" its reasoning in natural language, which invites fabrication. Instead, it must list which chart elements triggered an update and which items were carried forward without modification. This creates a "relevance receipt." It allows us to audit whether the system actually processed the cancellation note or simply ignored it. This shifts the burden from "trust the output" to "verify the process."
  2.  **Adversarial Test Set:** The vendor must maintain a standing monthly test set of perturbed scenarios specific to our workflow. This includes cancelled procedures, retracted lab results, and medication reversals. They must report the system's performance on these edge cases monthly. We are not asking for perfection; we are asking for a measured failure rate. If the system fails to catch a cancelled procedure in the test set, we know to increase human oversight on that unit for that week.

  **Conclusion**
  This approach does not solve the frame problem. No system can perfectly track every dependency in a complex clinical environment. However, it relocates the problem from a philosophical black box to a manageable engineering constraint. By requiring the system to show its work and proving its limits through testing, we align the tool with the CMIO's goal of supporting staff while respecting the Intensivist's requirement for safety and the Ethics committee's demand for accountability. We renew, but we do not expand until the silence is broken.
