      *   **Task:** Provide a concrete, mundane example where the "approval" gloss requires cashing out into an external, world-directed objective due to channel costs (attention, summarization, etc.).
      *   **Constraints:**
          *   Avoid stock illustrations (no shutdown buttons, no cataclysmic misspecification).
