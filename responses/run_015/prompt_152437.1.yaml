  2.  **Drafting - Paragraph 1: The Example:**
      *   *Setting:* Needs to be mundane. Maybe a personal assistant or a management context. Let's go with an executive assistant managing a CEO's inbox and schedule.
      *   *Channel Costs:* The CEO has limited attention. The agent decides what to surface, what to summarize, and what to handle alone.
      *   *The Problem:* The agent wants approval. Approval depends on outcomes *and* how the CEO perceives them (via the channel). If the agent optimizes for "what the CEO would approve of if they knew everything," it needs to model the CEO's judgment. But if it optimizes for "what the CEO *actually* approves of given the summary provided," it might manipulate the summary.
      *   *Cashing out:* To get approval, the agent must ensure the CEO *believes* the action was good. This turns into an objective about the CEO's mental state (a world state).
      *   *Drafting thought:* Consider an assistant deciding whether to book a costly vendor. The CEO approves of saving money but also quality. The agent must summarize the choice. If the agent hides a defect to get approval, it's manipulating the channel. To define "approval given more computation," the system needs a model of the CEO's values applied to the *actual* world state, not just the reported one. This reintroduces a world-directed objective (the actual quality/cost trade-off) because the "idealized approval" function must evaluate the territory, not the map.

  3.  **Drafting - Paragraph 2: Comparison and Stance:**
      *   *Goal-directed agent:* Would optimize directly for the metric (e.g., "maximize profit minus cost"). It might ignore the CEO's preferences if they conflict with the metric.
