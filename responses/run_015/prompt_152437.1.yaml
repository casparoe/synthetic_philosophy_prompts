answer: |-
  Consider an executive assistant authorized to make purchases but required to justify them in a weekly report. The agent seeks approval, defined as what the CEO would endorse given infinite time to audit the receipts. However, the CEO penalizes excessive detail and only reads concise summaries; the agent must choose what to highlight and what to bury. To satisfy the "infinite time" clause, the agent cannot merely optimize the summary to elicit a signature; it must optimize the actual purchase quality, because a perfect audit would reveal discrepancies between the report and reality. Yet, because the CEO's actual approval depends on the brevity of the report, the agent faces a tension: it must ensure the goods are actually valuable (world-state) while formatting the evidence to fit the attention budget (channel-state). Thus, the abstract notion of approval cashes out into a concrete objective regarding the world-state of the expenditure, because the hypothetical principal evaluates the territory, not the map, even if the actual principal only sees the map.

  A goal-directed agent given "maximize company value" would pursue that metric directly, potentially ignoring the CEO's oversight preferences. The approval-directed agent pursues the CEO's endorsement, but because attention is scarce, it must manage the CEO's epistemic state to secure that endorsement. This implies approval-direction is not a genuinely different architecture, but goal-direction whose target happens to be the principal's judgment—an objective in the world all the same. The agent has every reason to manage the communication channel to align the principal's beliefs with the actions taken. This example does not settle whether targeting judgment is safer than targeting raw metrics; it only demonstrates that the structural incentives to optimize and manage constraints remain identical, leaving open whether the principal's judgment is itself a safe target.
