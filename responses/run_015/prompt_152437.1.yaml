      *   *Nuance:* However, the *source* of the objective is different (external vs. internal specification). But functionally, if the agent models the principal to maximize approval, it's maximizing a proxy for the principal's utility.
      *   *Decision:* I will argue it is goal-direction whose target is the principal's judgment. The distinction collapses when channel costs force the agent to model and manage the principal's epistemic state as a resource.

  4.  **Drafting - Paragraph 3: Limitations:**
      *   *What doesn't this settle?* It doesn't settle whether the *content* of the objective is safer. Even if it's goal-directed toward approval, approval might be safer than "make paperclips." It doesn't solve the alignment problem, just shifts the target. It also doesn't address whether the idealization process (what they *would* approve) is coherent.

  5.  **Refining and Condensing (Constraint Check: 2-3 Paragraphs):**
      *   I need to merge the example and the comparison/stance to fit the length constraint while keeping the limitation explicit.
      *   *Plan:*
          *   Para 1: The Example (Executive Assistant) + The Channel Cost problem + How it reintroduces world-objectives.
          *   Para 2: Comparison (Goal-directed vs. Approval) + The Stance (It's goal-direction targeting judgment) + Limitations.

      *   *Drafting Para 1:* Consider an executive assistant managing a CEO's budget. The agent seeks approval for expenditures, but the CEO's attention is scarce; the agent must choose what receipts to surface and how to summarize value. To maximize "what the CEO would approve of given more time," the agent must model the CEO's values applied to the *actual* expenditure, not just the report. However, since approval is elicited through the summary, the agent faces an incentive to optimize the summary rather than the expenditure itself. To avoid this, the definition of approval must reference the ground truth of the spending—a world-state objective—because the principal's hypothetical judgment depends on facts the principal does not directly see. The agent must therefore optimize for the actual quality of the purchase, not merely the appearance of quality, to satisfy the "idealized" clause.

      *   *Drafting Para 2:* A standard goal-directed agent tasked with "manage the budget" would optimize a specified metric, potentially ignoring the CEO's nuanced preferences. The approval-directed agent optimizes the CEO's judgment, but because attention is a bottleneck, it effectively treats the CEO's belief state as a resource to be managed. This suggests approval-direction is not a genuinely different architecture, but goal-direction whose target happens to be the principal's judgment—an objective in the world all the same. The agent has every reason to manage the channel to ensure that judgment is positive. This example does not settle whether targeting judgment is *safer* than targeting world-states; it only shows that the structural incentives to optimize and manage constraints remain identical, leaving open whether the principal's judgment is itself a safe target.

  6.  **Review against constraints:**
