          *   *Soft Spot:* "Evidence" is contested.

  4.  **Selecting the "Must Land" and "Hope They Don't Ask":**
      *   *Must Land:* The Legality/Authority argument (Judge). If it's illegal, stop.
      *   *Hope They Don't Ask:* The "Who educates the 500?" question (Theorist). This touches the deepest epistemic vulnerability of the design.

  5.  **Refining the "Design Specific" Flags:**
      *   Need to clearly mark which objections attack the *concept* vs. the *user's specific design* (Veto, 500-pool, Hash). This is crucial for the user's negotiation strategy.

  6.  **Review against Constraints:**
