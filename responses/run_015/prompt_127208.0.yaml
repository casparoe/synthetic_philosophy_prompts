      *   **Point 4: Restricting KP (Is it cheating?).**
          *   *Verdict:* This is the hottest debate. The video says it's cheating because you can rebuild the paradox. This refers to "Fitch-style" constructions. However, if you restrict KP to *atomic* sentences or sentences without epistemic operators, the formal proof breaks. Whether this is "cheating" depends on whether you think the *spirit* of anti-realism applies to complex epistemic sentences. Many philosophers think the restriction is plausible (we care about empirical truths, not logical tricks). So the video is taking a hardline stance here.

  4.  **Drafting the Response:**
