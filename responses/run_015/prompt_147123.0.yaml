answer: |-
  This is the exact right question to ask. In philosophy of biology, we often get bogged down in defending specific theories (like Selected Effect vs. Causal Role), but the real progress comes from mapping the constraints any theory must satisfy.

  Since you come from microbiology, you know that "function" does heavy lifting in our explanations. If you say a gene's function is X, you imply that if it doesn't do X, something has gone *wrong*, not just *different*.

  Here is the breakdown of the hard desiderata, the camp preferences, and the contradiction you suspected.

  ### The Hard Desiderata (Non-Negotiables)

  Any serious theory of biological function must satisfy these three conditions. If a theory fails one of these, it usually gets discarded or radically modified.

  **1. The Malfunction Condition (Normativity)**
  *   **The Demand:** The theory must explain how a trait can fail to perform its function without ceasing to be that trait.
  *   **The Case:** A heart with severe arrhythmia that barely pumps blood.
  *   **Why it's hard:** If you define function purely as "what the trait actually does" (Causal Role), then the function of this broken heart is *not* pumping blood efficiently. It might be "vibrating irregularly." But biologically, we still say its function is pumping blood; it's just a *malfunctioning* heart. A theory must distinguish between *statistical normality* (what most hearts do) and *normative correctness* (what this heart *ought* to do).
  *   **Verdict:** Non-negotiable. If you can't explain malfunction, you can't explain disease.

  **2. The Side-Effect Condition (Distinction)**
  *   **The Demand:** The theory must distinguish between a trait's function and its mere causal byproducts.
  *   **The Case:** The heart makes a "thump-thump" sound. This sound is useful; veterinarians use stethoscopes to hear it to diagnose health. The sound contributes to the system (the vet's ability to treat the animal).
  *   **Why it's hard:** If function is just "causal contribution to the system," the heart's function is making noise. But we intuitively know the noise is a side effect; pumping is the function. A theory needs a filter to separate the *reason the trait is there* from the *accidental benefits it provides*.
  *   **Verdict:** Non-negotiable. Without this, everything a trait does is its function, which renders the concept useless.

  **3. The Token/Type Condition (Specificity)**
  *   **The Demand:** The theory must handle both general kinds (hearts in mammals) and specific instances (this specific heart in this specific patient).
  *   **The Case:** A gene duplication event. You have Gene A (ancestral) and Gene B (copy). Immediately after duplication, they are identical. Gene B has no history of selection yet.
  *   **Why it's hard:** Does Gene B have a function immediately? If function requires history, Gene B is functionless until it survives a generation. If function is purely structural, Gene B functions immediately.
  *   **Verdict:** Non-negotiable. Biology deals with populations (types) and individuals (tokens). A theory that only works for one scale is insufficient.

  ---

  ### The Camp Preferences (Negotiables)

  These are where the theories diverge. These aren't logical necessities, but rather philosophical bets on what kind of world we think we live in.

  **1. Historical vs. Ahistorical Grounding**
  *   **The Preference:** Does function require a past history (evolution/design), or is it determined by current organization?
  *   **The Trade-off:** Historical views (Etiological/Selected Effect) handle Malfunction beautifully. Ahistorical views (Causal Role/Systemic) handle novel structures better.
  *   **Status:** Negotiable, but dictates which cases your theory breaks on.

  **2. Organism-Centric vs. Trait-Centric**
  *   **The Preference:** Is the function defined relative to the survival of the organism, or the persistence of the trait itself?
  *   **The Case:** "Selfish" genetic elements (transposons) that replicate within the genome but harm the host.
  *   **The Trade-off:** If function is what helps the *organism*, transposons are parasitic junk. If function is what helps the *gene*, transposons have a function. Most microbiologists lean toward the trait-centric view here, but medical biology leans organism-centric.
  *   **Status:** Negotiable based on your explanatory goals.

  ---

  ### The Specific Cases You Asked For

  Here is how the desiderata interact with your specific examples.

  **1. Malfunction (The Heart Case)**
  *   **Selected Effect (SE) Theory:** Wins here. The heart's function is pumping because ancestors pumped. This heart fails to do what its ancestors did. It is malfunctioning.
  *   **Causal Role (CR) Theory:** Struggles. It says function is what it *contributes* now. If it doesn't pump, pumping isn't its current contribution. CR theorists have to do gymnastics to explain "disposition" (what it *would* do if not broken), which often smuggles in history anyway.

  **2. Gene Pleiotropy (One Gene, Two Effects)**
  *   **The Case:** A gene regulates metabolism *and* stabilizes cell structure. Both are beneficial.
  *   **SE Theory:** Says both are functions *if* both were targets of selection. If one was just a lucky side effect that wasn't selected for, it's not a function, even if it's useful.
  *   **CR Theory:** Says both are functions because both contribute to the current system's capacity.
  *   **The Tension:** SE is stricter. It forces you to ask, "Was this effect *why* the gene persisted?" CR is more permissive. In microbiology, SE is often more useful for distinguishing adaptation from exaptation.

  **3. Synthetic Organisms (The Engineered Bacteria)**
  *   **The Case:** You engineer a plasmid in a lab. It has never existed in nature. It has no selection history.
  *   **SE Theory:** **Fails.** Strictly speaking, on a pure SE account, this plasmid has no "proper function." It has a causal role, but no teleological function, because nothing selected it. It only acquires function once it is subjected to selection in a host/environment.
  *   **CR Theory:** **Wins.** The plasmid contributes to the synthetic system immediately. Its function is whatever role it plays in the engineered circuit.
  *   **The Intuition:** As an engineer, you feel the plasmid *does* have a function (e.g., expressing GFP) the moment you build it. SE theory tells you you're speaking metaphorically.

  ---

  ### The Hidden Contradiction

  You asked if there is a joint unsatisfiability. **Yes, there is.**

  You cannot simultaneously hold these two claims without modification:
  1.  **Claim A:** Biological function is essentially grounded in natural selection (history).
  2.  **Claim B:** Engineered organisms (with no selection history) possess genuine biological functions immediately upon creation.

  If Claim A is true, Claim B is false (the synthetic bacteria has no function, only causal effects).
  If Claim B is true, Claim A is false (history is not essential for function).

  **Why this is a contradiction of desiderata:**
  We want a theory that respects the **Normativity** of evolution (Claim A helps explain why things go wrong naturally) but also respects the **Reality of Biotechnology** (Claim B acknowledges that we create functional biology in the lab).

  **How the field tries to solve it (The "Generalized Selection" Move):**
  To resolve this, many philosophers generalize "Selection." They argue that *artificial design* is a form of selection. When you engineer the bacteria, *you* are the selection mechanism. You selected that sequence for a purpose.
  *   **The Fix:** Function = Selected Effect (where "Selection" includes Natural *and* Artificial).
  *   **The Cost:** This blurs the line between biology and technology. It implies the "function" of the synthetic gene is relative to *your* intentions, not the organism's survival. If the gene helps the bacteria survive but hinders your experimental goal, what is its function?
      *   Is it the function *for the lab* (reporter)?
      *   Or the function *for the bug* (metabolic load)?

  **The Hard Truth:**
  There is no single concept of "function" that satisfies all desiderata perfectly.
  *   If you want to explain **disease and malfunction**, you need **History (SE)**.
  *   If you want to explain **synthetic biology and novel traits**, you need **Current Contribution (CR)**.

  **Recommendation for a Microbiologist:**
  Treat "function" as two distinct concepts that we unfortunately call by the same name.
  1.  **Adaptive Function (SE):** Why is this trait here? (History/Selection). Use this for evolution, phylogeny, and disease pathology.
  2.  **Systemic Function (CR):** What does this trait do in this network? (Mechanism/Contribution). Use this for synthetic biology, metabolic engineering, and immediate physiology.

  The contradiction isn't in your reasoning; it's in the language. We use one word for "why it evolved" and "what it does." In synthetic biology, those two things come apart for the first time in history. That's why the philosophy feels broken there. It's not you; it's the category error.
