      *   *Refinement:* Make sure to distinguish between "having a function" and "having a purpose."
      *   *Refinement on Contradiction:* It's not a logical contradiction *within* a theory, but a contradiction *between desiderata*. You can't have a theory that satisfies *all* desiderata equally.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Hard Desiderata" are clearly separated from the "Trade-offs." (Proceed to generate output based on this structure).

