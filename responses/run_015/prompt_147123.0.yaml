prompt: |-
  hey, I'm a retired microbiologist who's only recently started reading actual philosophy books, so bear with me. I've been thinking about biological function—like, what does it actually mean to say the heart's function is pumping blood, versus just saying that's what it does? In my old field we talk about etiological accounts (selected effects) and causal-role ones (what it contributes now), but I'm trying to figure out what any serious theory of function has to deliver. Could you write out the hard desiderata? Not just a scorecard—what are the non-negotiable criterias, and which ones are just camp preferences? For each one, say what case or example motivates it—like explaining malfunction when something still works partly, or handling gene pleiotropy where one gene does two things, or dealing with sythetic organisms we engineered that never went through natural selection. I especially want to know if there's a hidden contradiction: can you demand evolutionary grounding for real functions and also demand the theory cover engineered bacteria with no selection history? If some subset of these demands is jointly unsatisfiable, that's the part I care about most. No need for citations or a reading list—just straight reasoning. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
