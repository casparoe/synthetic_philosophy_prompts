      *   Diagnosis: **The Locus Mismatch.**
      *   Confidence: 85% on the diagnosis of the stall. 70% on the portfolio solution being the right way forward (with caveats).
      *   Falsifier: A demonstration that the intuition "Knowledge is better" persists even in one-off, high-stakes, non-repeatable scenarios where systemic reliability is irrelevant. (e.g., The "Last Judgment" case).

  6.  **Addressing Specific User Points:**
      *   *Portfolio Framing:* It dodges swamping by shifting from token to type. It's not a relabel; it's a category shift.
