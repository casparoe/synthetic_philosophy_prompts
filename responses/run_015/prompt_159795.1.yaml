      *   **The Portfolio Move:** It validates the Trait view. The Plato person is defending the Token view. Both are "right" about their object, but wrong to think they are debating the same object.
      *   **Confidence:** Breakdown by claim.
      *   **Falsifier:** The "One-Shot" Intuition.
