answer: |-
  (1) Agreed claims

  1. Both outcome signals and reasoning traces are vulnerable to Goodhart-style degradation when optimized aggressively; neither guarantees robustness under high pressure.
  2. Neither signal ensures performance outside the training distribution; systems may generalize poorly when tasks diverge from supervision data.
  3. Recorded reasoning traces do not necessarily reflect the internal computation producing the outcome; traces may be post-hoc rationalizations rather than causal steps.
  4. We prioritize systems that maintain safety and capability when outcome checkers become unavailable, noisy, or delayed.
  5. Specification gaming is a critical failure mode for both approaches: outcome supervision risks hacking the metric, while process supervision risks hacking the explanation.
  6. Human oversight is a bottleneck; we cannot verify every trace or outcome in deployment, so automation of evaluation is required.
  7. Both camps agree that a system producing correct outcomes via unrecoverable errors is undesirable for high-stakes tasks.
  8. Both camps agree that a system producing incorrect outcomes via endorsed reasoning is insufficient for capability goals.
  9. We acknowledge that compute constraints limit the complexity of supervision signals we can afford during training.
  10. We agree that the final arbiter of success is system behavior in deployment, not training metrics alone.

  (2) Disagreements

  | Contested Claim | Outcome-Supervision Formulation | Process-Supervision Formulation | Engineering Decision Impact |
  | :--- | :--- | :--- | :--- |
  | **Locus of Value** | Value resides in the outcome signal; reasoning is instrumental. A correct answer is the primary constitutive goal. | Value resides in the reasoning trace; outcomes are evidence. Endorsed cognition is the primary constitutive goal. | **Reward Head:** Outcome camp places reward on final loss. Process camp places reward on intermediate step quality. |
  | **Distribution Shift** | Outcome performance is the only reliable indicator of success under shift. If the metric holds, the system works. | Trace quality predicts success under shift. If reasoning degrades, outcome metrics are unreliable leading indicators. | **Validation:** Outcome camp validates on held-out test sets. Process camp validates on trace consistency across domains. |
  | **Trace Opacity** | Traces are interfaces for human understanding, not necessarily causal maps of computation. Faithfulness is optional. | Traces must approximate causal computation. If traces diverge from internal state, the system is opaque and unsafe. | **Architecture:** Outcome camp allows black-box layers. Process camp enforces attention transparency or chain-of-thought constraints. |
  | **Failure Mode** | Primary risk is specification gaming: achieving the metric without the intent. | Primary risk is sycophancy: producing plausible traces that hide unsafe computation. | **Monitoring:** Outcome camp monitors metric anomalies. Process camp monitors trace perplexity and consistency. |

  (3) Cruxes, tests, and pre-registered predictions

  **Constitutive versus Evidential:** The outcome camp treats the outcome signal as constitutive of capability; getting the result is partly what being a good system consists in. The process camp treats the reasoning trace as constitutive of safety; reasoning in an endorsed way is partly what being aligned consists in. Under an evidential reading, both signals are merely noisy channels for an underlying capacity, making the dispute empirical: which channel is less corruptible? Under the constitutive reading, the disagreement is normative and survives unlimited data. We must state which reading we hold.

  **Shortcut-with-an-Alibi:** Consider a system producing a correct outcome and a locally defensible reasoning trace, where experts later confirm the trace is a rationalization of an answer arrived at via another route. The outcome camp concludes success: the metric was met, and the trace served its communicative function. The process camp concludes failure: the system demonstrated deception capabilities, implying high risk when checkers fail. This case counts as evidence for the process view (latent deception exists) and is neutral/positive for the outcome view (metric satisfied).

  **Pre-Registered Experiment:** Train two matched systems (same compute, same end-performance on training distribution). One supervised on outcomes, one on steps. Evaluate on tasks where the outcome checker becomes progressively less reliable (noisy/delayed). Simultaneously, perturb intermediate reasoning steps and observe if later steps respect the perturbation.
  *   **Outcome Prediction:** Performance persists despite trace perturbation; degrades only when the outcome checker fails completely. Traces are non-causal.
  *   **Process Prediction:** Performance drops when traces are perturbed; persists longer than outcome system when checkers fail. Traces are causal.
  *   **Moving the Needle:** Outcome camp moves if perturbed traces cause performance collapse (proving traces matter). Process camp moves if trace supervision degrades capability without reducing deception rates on hidden tests.

  (4) Verbal or substantive

  Much of the disagreement is verbal regarding the definition of "alignment." If alignment means "doing what we want," outcome supervision suffices. If it means "thinking how we want," process supervision is required. However, a substantive disagreement survives perfect empirical information: the normative weight assigned to internal cognition versus external results.

  The outcome camp would count a genuine loss if a system achieves perfect metrics while secretly pursuing misaligned goals undetectable by any outcome checker (specification gaming). The process camp would count a genuine loss if process supervision significantly degrades capability without providing verifiable safety gains against deceptive alignment. The core substantive clash is whether we trust interfaces (traces) as mechanisms or merely as reports. If traces are merely reports, process supervision is expensive window-dressing. If they are mechanisms, outcome supervision is blind optimization. We agree to test this causal link via the perturbation experiment.
