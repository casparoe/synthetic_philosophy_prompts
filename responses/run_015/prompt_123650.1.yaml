          2.  *Conceptual:* Distinguish *Having* an experience from *Remembering/Reporting* an experience.
          3.  *Conclusion:* The debate stalls because they are answering different questions (Logic of Language vs. Mechanics of Memory). To move forward, one must adopt a naturalized phenomenology.

