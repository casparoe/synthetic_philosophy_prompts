answer: |-
  This procedure sorts proposals by temporal depth to align funding instruments with problem rhythms, matching intervention lifespan to the slowest driving force identified. Its core logic prevents misallocating rapid funds to structural issues or rejecting structural plans for lacking urgency. The primary failure mode is institutional: reviewers can identify structural mismatches, but funding cycles and political mandates often override technical classification, leaving flagged risks unmitigated.

  | Diagnostic Gate | Question & Test | Evidence Required | Failure Mode | Uneliminated Judgment |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Geographical Time** | **Substitution Test:** If the named region were replaced by one with identical geography but different recent event history, would the problem persist? | Geological/climatic baselines; erosion rates. | Treating chronic erosion or sea-level rise as a discrete disaster. | Is geography a fixed constraint or a legitimate target of transformation? |
  | **2. Social Time** | **Scale Test:** Does the proposed intervention alter conditions that will outlast two generations? | Land tenure records; economic patterns; institutional rhythms. | Ignoring institutional drivers (e.g., tenure) in infrastructure projects. | Can necessary institutional changes occur within the standard funding cycle? |
  | **3. Event Time** | Is this a discrete shock requiring immediate response rather than long-term adaptation? | Storm tracks; flood peaks; political decisions. | Over-investing in rapid response for conditions driven by immobile structures. | Is the stated urgency real or manufactured for access to rapid streams? |
  | **Camouflage Screen** | Does the language frame structural conditions as crisis to access rapid funding? | Adjectives vs. data trends; naming conventions. | Funding symbolic acts (monuments, renaming) as resilience. | Political necessity vs. technical validity. |

  **Application 1: Rapid-Deployment Storm-Shelter Network**
  This proposal halts at the **Event Time Gate**. The Substitution Test fails (without recent storms, the immediate need vanishes), and the Scale Test fails (shelters do not alter generational conditions). It classifies cleanly as event-level. **Decision:** Approve rapid fund. **Judgment:** The reviewer must still decide if providing shelters enables dangerous permanence in uninhabitable zones, though the classification itself is stable.

  **Application 2: Thirty-Year Cooperative Irrigation and Tenure Restructuring**
  This proposal passes the **Social Time Gate**. The Substitution Test confirms the problem persists without discrete storms (geographical/social drivers). The Scale Test confirms the intervention outlasts two generations. It classifies as hybrid with the social layer dominant. **Decision:** Recommend split funding track tied to a twenty-year evaluation window. **Conflict:** The board will reject this answer because the reporting cycle is three years, forcing a structural project into an event-based reporting container.

  **Application 3: Rebranding and Memorializing a Flooded District**
  This proposal fails the Geographical and Social Gates. It addresses neither baseline terrain nor institutional rhythms. It passes only the **Camouflage Screen** as a positive identification of misuse. It classifies as pure individual-time biography. **Decision:** Reject. **Conflict:** The board will want to approve it for political visibility despite technical invalidity, highlighting the limit of the procedure against political will.

  **Limitations**
  This procedure offers no normative rule for whether slow geographical structures should be treated as fixed constraints or as legitimate targets of transformation; it identifies the rhythm but not the ethical response. Furthermore, it is silent on intergenerational equity when institutional memory is shorter than the rhythms being evaluated, leaving reviewers unable to mandate protection for futures beyond their mandate.
