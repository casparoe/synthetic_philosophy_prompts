  **Decomposition:**
  1.  **Physical Causal Closure (0.95):** Conservation laws and empirical history show no physical event occurs without a sufficient physical antecedent.
  2.  **No Systematic Overdetermination (0.90):** It is metaphysically wasteful to assume every human action is coincidentally caused twice, once by neurons and once by mind.
  3.  **Exclusion Principle Validity (0.75):** The rule that "sufficient physical causes exclude distinct mental causes" must not accidentally eliminate accepted macro-causes like dams or recessions.

  **Combination:**
  The argument succeeds only if closure is true, overdetermination is false, and the exclusion principle doesn't self-destruct on macro-examples; multiplying these probabilities (0.95 × 0.90 × 0.75) yields 0.64.

  **Least Confident Term:**
  **Exclusion Principle Validity (0.75):** This is the leakiest premise because interventionist accounts of causation (e.g., Woodward) suggest higher-level causes can be real without violating physical closure, potentially saving mental causation from exclusion.

  **Biggest Mover:**
  A formalized model of **top-down causation** in neuroscience demonstrating that information structures (mental states) constrain physical dynamics in ways the micro-physical story cannot capture without residual loss; if proven, this would tank the Exclusion Principle's validity and drop my headline credence below 0.30.
