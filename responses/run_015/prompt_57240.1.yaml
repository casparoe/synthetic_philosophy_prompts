  #### The Question You Hope Nobody Asks

  **The Question:** "Does your substitution thesis commit you to tolerating norms that restrict women or sexual minorities in tight societies, since those are precisely the cases where informal enforcement substitutes for absent institutions?"

  **Diagnostic:** You are correct; this is your most exposed soft spot. It is a specific, high-damage version of Objection #1. The room will wait to see if you bite the bullet (yes, tolerate them for security) or squirm (no, but then how?).

  **Prepared Reply:** "It commits me to acknowledging that removing those norms without institutional replacement harms the very people those norms purportedly protect—including women and minorities who may rely on community order for physical safety against external threats. It does not commit me to tolerating them *indefinitely*. It commits me to sequencing: build the institutional shield first, then dismantle the normative cage. To do otherwise is to strip the armor before the shield is ready. The moral imperative is to build the shield, not to shame the armor."

  **Why this is dangerous:** It requires you to argue that oppressive norms provide *physical safety* to the oppressed. If the psychologists in the room have data showing tightness increases violence against women (e.g., domestic violence norms), your "safety" claim collapses. You must be ready to distinguish between *inter-group* security (community vs. chaos) and *intra-group* oppression (men vs. women).

