  I am giving a 30-minute seminar defending the claim that von Neumann's comparison of neural and computing machinery—when read against the grain of standard digital-functionalism—points to an analog, error-tolerant, self-repairing organizational form as a necessary condition for any computation that could ground moral attribution of sentience. The audience is a philosophy-of-mind reading group with theoretical computer scientists present; they are mostly functionalists or biological naturalists, skeptical of consciousness talk, and they care whether artificial architectures could ever qualify rather than about historical scholarship. Prepare my Q&A defense sheet: list the six or seven objections I will actually face, ordered by damage, each phrased as that specific camp (functionalist philosopher, biological naturalist, or computer scientist) would phrase it. For each, state what I should concede up front, give the two-minute reply, and flag the weakest point in that reply. Include the one question I am hoping the senior functionalist never raises—whether my architectural criterion smuggles biological chauvinism back in through the analog-requirement back door—and note the one technical objection from the CS side about whether modern analog architectures erase the distinction on which my argument depends.
