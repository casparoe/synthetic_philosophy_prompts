answer: |-
  This is an exceptionally strong foundation for a doctoral-level research proposal. The core philosophical intuition—that the "special obligations" debate is stalled because it treats a heterogeneous cluster of obligations as a single phenomenon—is insightful and genuinely contributory. The distinction between *diachronic reciprocity* (backward-looking, institutional) and *synchronic solidarity* (forward-looking, vulnerability-based) is analytically sharp and offers a clear path through the nationalism/cosmopolitanism stalemate.

  However, as a doctoral writing sample proposal, there are specific methodological and rhetorical risks in the current draft that a committee might flag. Below is an assessment of the project's philosophical strengths, followed by strategic recommendations to "bulletproof" the proposal, and finally, a formalized version of the text suitable for submission.

  ### 1. Philosophical Assessment & Strategic Recommendations

  **Strengths:**
  *   **The Cut:** The diachronic/synchronic distinction maps well onto existing but often conflated arguments (e.g., "fair play" vs. "associative obligations"). Isolating them is a viable path to novelty.
  *   **Feasibility:** 35–40 pages in four months is realistic for conceptual work, provided you do not get bogged down in exegesis.
  *   **Defined Failure Conditions:** Explicitly stating what constitutes a "failed" result (conceptual incoherence) demonstrates philosophical maturity. It shows you are testing a hypothesis, not just advocating a position.

  **Risks & Recommendations:**

  **A. The "No Bibliography" Claim (Critical)**
  *   **Risk:** You state you will work "without depending on specific canonical texts or bibliographic surveys." In a doctoral context, this can read as naive or dismissive of the field. Committees want to know you know the literature, even if your method is conceptual.
  *   **Fix:** Reframe this. Instead of saying you won't use texts, say the project is **problem-centered rather than exegetical**. You will engage with *arguments* (e.g., the arbitrariness objection, the fair play principle) rather than providing a survey of *authors*. You must still signal familiarity with key positions (e.g., Keller's associative obligations, Rawlsian fair play, Pogge's cosmopolitanism) to show where your reconstruction intervenes.

  **B. The "Unjust Institutions" Problem**
  *   **Risk:** In Phase 2, you test diachronic reciprocity against the charge that "inherited advantage is itself unjust." This is the hardest philosophical hurdle. If the institutional scheme is unjust (e.g., built on exclusion or exploitation), does reciprocity generate obligations, or does it generate a duty to repair?
  *   **Fix:** Explicitly mention that your framework must account for the **justice-condition of schemes**. Does reciprocity only bind within *just* institutions? If so, does that limit the scope of compatriot priority too much to be useful? Acknowledging this tension strengthens the proposal.

  **C. The Boundary Problem for Solidarity**
  *   **Risk:** In Phase 3, you ask if synchronic solidarity collapses into cosmopolitanism. A cosmopolitan will argue: "Climate change is a shared vulnerability; therefore, solidarity is global."
  *   **Fix:** Clarify that you are investigating whether **institutional mediation** is required for solidarity to generate *distributive* obligations, or if bare shared risk is enough. This clarifies *why* the obligation might stop at the border (e.g., because only the state can effectively operationalize the solidarity).

  **D. Scope Management**
  *   **Risk:** Three phases for 40 pages is tight.
  *   **Fix:** Consider framing Phase 3 (Solidarity) as a control case. The heavy lifting is in Phase 2 (Reciprocity). Ensure the word count allocation reflects this (e.g., 5 pages intro, 10 pages conceptual framework, 15 pages testing reciprocity, 5 pages solidarity/collapse, 5 pages conclusion).

  ### 2. Formalized Research Proposal

  Below is a rewritten version of your text, structured for a doctoral committee or funding application. It retains your voice but adopts the formal conventions of academic proposals.

  ***

  **Project Title:** Beyond Borders and Blood: Decomposing Compatriot Priority into Diachronic Reciprocity and Synchronic Solidarity

  **Project Type:** Independent Research / Doctoral Writing Sample
  **Duration:** 4 Months
  **Deliverable:** 35–40 Page Philosophical Essay

  **1. Statement of the Problem**
  The contemporary debate regarding special obligations to compatriots is characterized by a persistent stalemate. Nationalist arguments invoke shared culture, history, or political community to justify partiality, while cosmopolitan arguments contend that birth within borders is morally arbitrary and that distributive obligations must be global. Both sides, however, treat "compatriot priority" as a monolithic phenomenon to be either justified or debunked. This binary framing obscures the possibility that the moral claim of compatriot priority is not a single obligation, but a conflation of two conceptually distinct sources:
  1.  **Diachronic Reciprocity:** Obligations arising from multi-generational institutional cooperation, including inherited burdens and benefits.
  2.  **Synchronic Solidarity:** Obligations arising from present shared vulnerability and collective risk.

  Because neither side systematically separates backward-looking reciprocity from forward-looking solidarity, cosmopolitan critiques regarding the arbitrariness of borders fail to address whether obligations can arise from participation in intergenerational schemes. Conversely, nationalist defenses fail to establish that reciprocity generates distributive priorities distinct from universal humanitarian concern.

  **2. Research Question**
  Can the moral claim that compatriots have special obligations be decomposed into diachronic reciprocity and synchronic solidarity? Furthermore, does this decomposition allow for a limited defense of compatriot priority that survives cosmopolitan objections, or does the distinction collapse once the two sources are shown to be inseparable or normatively equivalent?

  **3. Methodology**
  This project employs **conceptual reconstruction** rather than empirical study or historical exegesis. While the analysis will engage with standard arguments in social contract theory and intergenerational justice, it is problem-centered rather than bibliographic. The goal is to formalize the normative logic of the two obligation-types and test their coherence under pressure, rather than to survey existing literature.

  **4. Research Phases**
  *   **Phase I: Conceptual Formalization.** I will define the necessary and sufficient conditions for diachronic reciprocity and synchronic solidarity to generate distributive obligations. This involves distinguishing obligations of *fair play* (arising from receipt of benefits) from obligations of *mutual aid* (arising from shared capacity to alleviate suffering).
  *   **Phase II: Stress-Testing Diachronic Reciprocity.** I will subject the diachronic claim to three standard cosmopolitan objections: (a) the moral arbitrariness of birth, (b) the problem of non-voluntary membership in inherited institutions, and (c) the charge that inherited advantage is itself unjust (the "tainted benefits" problem). The aim is to determine if a version of reciprocity can survive these objections without collapsing into universalism.
  *   **Phase III: The Boundary of Solidarity.** I will examine whether synchronic solidarity, once universalized, necessarily collapses into cosmopolitanism. I will investigate whether institutional mediation is required for solidarity to generate *priority* claims, or if bare shared vulnerability implies global distributive equality.

  **5. Success and Failure Conditions**
  *   **Success:** The project succeeds if it produces a rigorous framework that isolates a defensible, limited form of compatriot priority grounded solely in reciprocity, OR if it definitively demonstrates that the distinction is unstable and that all particularist obligations reduce to either solidarity or arbitrariness.
  *   **Failure:** The project fails if the distinction proves conceptually incoherent (e.g., if reciprocity is shown to always presuppose present solidarity) or if it yields no difference in practical allocation principles between compatriots and strangers.

  **6. Timeline**
  *   **Month 1:** Formalization of concepts; drafting Phase I.
  *   **Month 2:** Argument construction for Phase II (Reciprocity vs. Cosmopolitan Objections).
  *   **Month 3:** Argument construction for Phase III (Solidarity and Boundaries); integration of phases.
  *   **Month 4:** Revision, refinement of objections, and final polishing for submission as a writing sample.

  ***

  ### 3. Suggested Reading (For Your Background)
  *Even if you do not cite these extensively, your committee will expect you to be aware of where your argument sits relative to these positions:*

  *   **On Associative Obligations:** Samuel Scheffler (*Humanity, Community, and Identity*), Stephen Nathanson (*Patriotism, Morality, and Peace*).
  *   **On Fair Play/Reciprocity:** John Rawls (*A Theory of Justice* on fair play), A. John Simmons (*Principles of Political Obligation*).
  *   **On Cosmopolitan Critiques:** Simon Keller (*The Limits of Patriotism*), Thomas Pogge (*Realizing Rawls*), Gillian Brock (*Global Justice*).
  *   **On Intergenerational Justice:** Janna Thompson (*Taking Responsibility for the Past*), Daniel Butt (*Rectifying International Injustice*).

  ### 4. Final Advice for the Writing Sample
  When you write the actual essay, ensure your **Introduction** mirrors the clarity of this proposal. The strongest move you can make is to present the "Diachronic/Synchronic" distinction not just as your idea, but as a necessary clarification that *both* sides of the debate need to make progress. This positions you as a mediator advancing the field, rather than just another voice in the chorus.

  Good luck. This is a viable, high-quality project.
