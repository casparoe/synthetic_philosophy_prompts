answer: |-
  This is a strong concept. It captures the *tension* in Lakatos that a static diagram cannot: the cost of protectionism versus the reward of novelty.

  However, your worry is correct: if the "hard core" is just a rule you impose ("You cannot change this"), they will treat it as a constraint of the game, not a methodological commitment. To make it feel like a **decision**, they must choose it, and the cost of abandoning it must be conceptual, not just penal.

  Here is a complete run-sheet, mechanics, and debrief strategy designed to hit the philosophical nuances you're after.

  ### 1. The Setup: "The Grant Game"
  **Context:** Tell them they are competing research consortia applying for a 10-year government grant. The grant committee (you) cares about **theoretical continuity** (we don't want to fund flip-floppers) and **novel predictions** (we want value for money).

  **Materials:**
  *   4 Envelopes (one per team). Inside: The **Hard Core** card.
  *   Deck of **Auxiliary Hypothesis** cards (distributed to teams).
  *   Deck of **Observation** cards (held by you).
  *   Scoreboard (whiteboard).
  *   "Ad Hoc Token" (one per team).

  **The Hard Cores (Rigged):**
  Do not tell them which is which.
  *   **Core A (Progressive):** "System output is linearly proportional to input." (Easy to predict, fits most data).
  *   **Core B (Degenerating):** "System output is constant regardless of input, unless interfered with." (Requires constant auxiliary patches to explain variance).
  *   **Core C (The 'Lucky' Degenerate):** "System output is random but bounded." (Can accommodate anything, predicts nothing).
  *   **Core D (The 'Crisis' Core):** "System output is inverse to input." (Works for Round 1, fails hard in Round 2).

  **The Rules of Commitment:**
  1.  **The Lock:** Once you open the envelope, that Core is your identity. If you change the Core, you are no longer the same research programme. In the game, this means **forfeiture**. You lose all accumulated points. (This simulates Lakatos's point: you can't just swap cores when data gets tough; that's a revolution, not science).
  2.  **The Budget:** Each team starts with 3 **Auxiliary Hypothesis Cards** (e.g., "Measurement Error," "Unseen Interfering Factor," "Boundary Condition"). Playing a card allows you to modify the prediction to fit the data.
  3.  **The Ad Hoc Token:** Each team gets one token. They can play this in the final round to declare an observation "Not a real instance" (Monster Barring). It saves the Core but costs 50% of their current score.

  ### 2. Scoring Rules (The Engine)
  This is where you teach the difference between progressive and degenerating shifts.

  *   **Novel Prediction (The Gold Standard):** Team submits a specific numerical prediction *before* seeing the Observation Card.
      *   Match: **+10 points**. (Theoretical + Empirical progress).
  *   **Accommodation (The Silver Standard):** Team sees the Observation Card, then plays an Auxiliary Card to explain why the Core produced this result.
      *   Success: **+2 points**. (Theoretical progress only; no empirical risk).
  *   **Anomaly (The Red Flag):** Team cannot predict or accommodate the observation.
      *   Result: **-5 points**.
  *   **Ad Hoc Maneuver:** Playing the Token.
      *   Result: Observation discarded. Score halved.

  **Why this works:** Teams with Core B and C will quickly realize they cannot *predict*. They will be forced to *accommodate* using their limited Auxiliary Cards. They will feel the "degeneration" as a resource drain and low scoring. Team A will feel the "progress" as easy points.

  ### 3. Timeline (90 Minutes)

  **00:00 – 00:15: Introduction & Commitment**
  *   Briefly define Hard Core/Protective Belt (5 mins).
  *   Teams form (4 students each).
  *   **Crucial Step:** Hand out the envelopes. Tell them: *"Read the Core. Discuss whether you accept this commitment. If you do, sign the card. If you sign, you cannot change it without forfeiting the game."*
  *   This signature makes it a methodological decision, not just a rule.

  **00:15 – 00:45: The Three Rounds**
  *   **Round 1 (Baseline):** Simple observation. Everyone should manage this. (10 mins)
  *   **Round 2 (The Strain):** Observation conflicts slightly with Core. Teams must decide: Burn an Auxiliary card to accommodate, or risk a prediction? (10 mins)
  *   **Round 3 (The Monster):** A "black swan" observation that blatantly contradicts the Hard Core. (10 mins)
  *   *Facilitator Note:* Keep the pace brisk. If a team is stuck, nudge them: "You need to submit a prediction or play a card."

  **00:45 – 00:55: The Crisis & Cash Out**
  *   Reveal scores.
  *   Allow teams to play their **Ad Hoc Token** if they wish to save face on Round 3.
  *   Recalculate final scores.

  **00:55 – 01:30: The Debrief (The Philosophy)**
  *   This is the most important section. Do not rush it.

  ### 4. The Debrief: Mapping Game to Lakatos
  You want them to notice the "when to quit" problem. Structure the discussion around three questions:

  **Q1: "At what point did Team B (the degenerating team) know they were doomed?"**
  *   *Expected Answer:* "Round 2," or "When we ran out of cards."
  *   *Lakatosian Point:* In hindsight, it's obvious. But *in Round 2*, did you know? No. You hoped the next auxiliary hypothesis would work. Lakatos's point is that **there is no instant falsification**. A degenerating programme can always be patched in the short term. You only know it's degenerating historically, after the fact.

  **Q2: "Team A, did you feel 'rational' sticking with your core? Team B, did you feel 'irrational'?"**
  *   *Expected Answer:* Team A felt smart. Team B felt frustrated but argued they were being rigorous.
  *   *Lakatosian Point:* Rationality isn't about being right immediately; it's about whether your programme is generating **novel facts**. Team B was being *methodologically* rational (protecting the core) even if *empirically* unsuccessful. This explains why scientists stick with theories (like Bohr's model) long after anomalies appear.

  **Q3: "Could I, as the Grant Committee, have cut Team B's funding after Round 2?"**
  *   *Expected Answer:* "Yes, they were losing points."
  *   *Lakatosian Point:* If you had cut them, you might have killed a future Einstein. Maybe they just needed one more auxiliary card to turn the corner. Lakatos argues we cannot set a **rule** for when to abandon a programme. It is a matter of scientific intuition and historical judgment, not a logic algorithm.

  ### 5. Predictable Failures & Troubleshooting

  **Failure 1: Students treat the Core as a logic puzzle, not a theory.**
  *   *Fix:* In the intro, give the Cores "names" (e.g., "The Newtonian Programme," "The Phlogiston Programme"). Remind them that abandoning the core means they are no longer doing *that* science.
  *   *Fix:* If they ask "Can we tweak the core?", say: "You can, but then you are a new team. You keep your score, but you lose your 'Grant Continuity' bonus (make up a small bonus for consistency)."

  **Failure 2: One team finishes way too fast.**
  *   *Fix:* Have "Peer Review" tasks. While Team A is calculating, ask Team B to critique Team A's auxiliary hypothesis. "Is that card ad hoc or independent?"

  **Failure 3: The 'Degenerating' team quits early.**
  *   *Fix:* This is actually a great teaching moment. If they quit, highlight it in the debrief. "You exercised the rationality of the scientist who knows when to cut losses. But Lakatos says history is full of people who *didn't* quit and were right later. Who was more rational?"

  **Failure 4: The 'Ad Hoc' token is never used.**
  *   *Fix:* In Round 3, make the observation *impossible* to accommodate even with cards. Force the choice: Forfeit (change core) or Monster Bar (use token).

  ### 6. What You Cannot Stage (Say This Out Loud)
  There are two parts of Lakatos's MSRP that a 90-minute seminar cannot simulate. You must explicitly state these in the final 5 minutes to show intellectual honesty.

  1.  **Historical Retrospection:** Lakatos's methodology is primarily a tool for **historians**, not working scientists. In the game, you knew (or suspected) which core was "true." In real history, we don't know if String Theory is degenerating or just in a long protective phase until 100 years from now. The game gives them a "God's eye view" of the scoring that real scientists don't have.
  2.  **The Content of the Science:** The game uses abstract numbers. Real scientific progress involves *content increase* (explaining more phenomena), not just point-scoring. A degenerating programme might predict numbers well (Ptolemaic epicycles were very accurate) but fail to unify knowledge. The game captures the *structure* of MSRP, but not the *semantic depth*.

  ### Summary Checklist for You
  *   [ ] **Rig the envelopes:** Ensure at least one team has a "Hard" core that requires constant patching.
  *   [ ] **Print Scorecards:** Keep track of Prediction vs. Accommodation.
  *   [ ] **Watch the Clock:** Hard stop at 45 mins for the game. The philosophy is in the debrief.
  *   [ ] **Prepare the "Quit" Question:** Be ready to pounce if no one brings up the difficulty of knowing when to abandon a theory.

  This structure moves them from *knowing* the definitions to *feeling* the methodological pressure. Good luck.
