prompt: |-
  I've got a 90-minute session coming up on Lakatos's methodology of scientific research programmes — upper-level philosophy of science seminar, about 16 students — and I want something they actually do rather than me drawing the hard-core-and-protective-belt diagram on the board for the tenth time.

  Rough idea I had: split them into three or four teams. Each team gets a sealed envelope with a hard core they are not allowed to abandon (I'd rig it so one core is false but indefinitely patchable and one is roughly right), a fixed small budget of auxiliary hypotheses — three cards, say — and then I feed them observations in rounds. They score for predicting observations before they arrive and get nothing for explaining them after. Last round I hand them an outright monster, and teams are allowed to just declare it not a real instance, if they want to pay for that privilege.

  Does that actually make them feel the difference between a progressive and a degenerating problem shift, or does it just teach them the vocabulary? Help me with the scoring rule, and with making the sealed core feel like a methodological decision rather than an arbitrary rule I invented. Also: some of them will notice mid-game that nothing in the game tells them when a programme has stopped being worth pursuing — I want them to notice that, and I want the debrief to say something true about it. Give me rules, a timeline, a debrief mapping what happened onto Lakatos's distinctions, what will predictably go wrong the first time I run it, and which part of Lakatos you simply can't stage in 90 minutes and I'll have to say out loud myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Context:** 90-minute upper-level philosophy of science seminar, ~16 students.
      *   **Goal:** Active learning (simulation/game) rather than lecture. Move beyond vocabulary to *feeling* the difference between progressive and degenerating shifts.
      *   **User's Idea:** Teams, sealed envelopes (hard cores), budget of auxiliary hypotheses (cards), rounds of observations, scoring for prediction vs. accommodation, "monster" anomaly round (ad hoc maneuver option).
      *   **Specific Needs:**
          *   Validate/refine the core idea (does it work?).
          *   Scoring rules (make prediction valuable).
          *   Make the "hard core" feel like a methodological decision, not just a rule.
          *   Address the "when to quit" problem (Lakatos's heuristic limitation).
          *   Timeline (90 mins).
          *   Debrief mapping (game events to Lakatosian concepts).
          *   Predictable failures/troubleshooting.
          *   What *can't* be simulated (limitations of the activity).

  2.  **Evaluate the Core Idea:**
      *   *Strengths:* It gamifies the tension between protecting the core and generating novel facts. The "budget" mechanic forces trade-offs. The "prediction vs. accommodation" scoring is crucial for Lakatos (novel facts).
      *   *Weaknesses:* If the "hard core" is just a rule ("You cannot change this"), students treat it as a constraint, not a *commitment*. The "when to quit" issue is the deepest philosophical point; the game needs to allow degeneration to continue long enough for them to feel the frustration.
      *   *Verdict:* The idea is solid but needs tweaking to emphasize the *rationality* of sticking with a core even when things look bad (the "ceteris paribus" clause).

  3.  **Develop the Mechanics:**
      *   **Hard Core:** Needs to be a theoretical commitment, not just a sentence. Let's make them "Research Teams" competing for funding. The Hard Core is their "Grant Proposal Foundation." Abandoning it = losing funding (game over).
      *   **Auxiliary Hypotheses (The Belt):** The "3 cards" idea is good. Let's call them "Theoretical Moves." They cost resources.
      *   **Observations:** Need to be ambiguous enough to require interpretation but clear enough to score.
      *   **Scoring:**
          *   Predicted Observation: +2 points (Progressive).
          *   Accommodated Observation: +0 points (Degenerating/Stagnant).
          *   Ignored/Contradicted Observation: -1 point (Anomaly).
          *   Ad Hoc Maneuver (Monster Barring): Costs points but saves the core.
      *   **The "When to Quit" Problem:** The game shouldn't end until *they* decide to quit or the timer runs out. This mirrors Lakatos's point that there's no instant falsification.

  4.  **Drafting the Timeline (90 Minutes):**
      *   0-10: Intro & Setup (Lakatos context, team formation).
      *   10-20: Rule Explanation & Core Selection (Crucial: make them *choose* the commitment).
      *   20-50: The Game (3-4 Rounds).
      *   50-60: Scoring & Crisis (The "Monster" round).
      *   60-90: Debrief (The most important part).

  5.  **Refining the "Hard Core" Commitment:**
      *   Instead of "You are not allowed," frame it as "This is your identity." If you change the core, you are no longer *that* research programme. You become a different team. To keep the game moving, forbid it, but frame it philosophically: "Rational reconstruction requires continuity."
      *   *Better idea:* Give them a choice of cores at the start. Once picked, it's locked. This simulates the initial methodological decision.

  6.  **Addressing the "When to Quit" (The Heuristic Limit):**
      *   Lakatos admits MSRP doesn't give instant rules for falsification. It's historical.
      *   In the game: One team will inevitably get a "degenerating" core (rigged). They will struggle. The debrief must highlight that *in the moment*, they didn't know it was hopeless. They had to hope the next auxiliary hypothesis would work. This mirrors the history of science (e.g., Prout's law, Bohr's model).

  7.  **Predictable Failures:**
      *   Students treating it as a logic puzzle rather than a methodological simulation.
      *   One team finishing way too fast.
      *   Students arguing about the "truth" of the observation rather than the fit with the theory.
      *   Running out of time for the debrief.

  8.  **What Can't Be Simulated:**
      *   Historical time. Lakatos's judgment is retrospective. The game is real-time.
      *   Sociological factors (prestige, funding bodies, personalities) though we can hint at them.
      *   The actual content of the science (it will be abstract).

  9.  **Developing the Content (The "Science"):**
      *   Keep it abstract but relatable. "Particle Physics" or "Ecology."
      *   Let's go with "Celestial Mechanics" (Newtonian style) or "Disease Transmission."
      *   *Decision:* "The Behavior of System X." Keep it vague so logic dominates.
      *   *Rigging:*
          *   Team A (Progressive): Core aligns with data. Easy to predict.
          *   Team B (Degenerating): Core conflicts. Requires complex auxiliaries.
          *   Team C (Wild Card): Core is weird but works surprisingly well (Kuhnian anomaly?).

  10. **Structuring the Response:**
      *   Validate the idea (Yes, it works).
      *   Game Mechanics (Rules, Scoring, Materials).
      *   Timeline (Minute-by-minute).
      *   The "Hard Core" Framing (Methodological decision).
      *   The Debrief (Mapping game to theory).
      *   Troubleshooting (What goes wrong).
      *   The "Unstageable" (Lakatos's limitations).

  11. **Refining the Scoring for "Progressive vs. Degenerating":**
      *   Lakatos cares about *novel* facts.
      *   Rule: You must submit a prediction *before* the envelope is opened.
      *   If you predict correctly: +10 points (Theoretical Progress + Empirical Progress).
      *   If you accommodate (explain after): +2 points (Theoretical Progress only, maybe).
      *   If you use an "Ad Hoc" save (Monster Barring): -5 points (Costly).
      *   This creates the pressure.

  12. **Final Polish:**
      *   Ensure the tone is collegial (peer-to-peer).
      *   Make sure the "when to quit" insight is central to the debrief.
      *   Check timing (90 mins is tight for a game + deep debrief). Need to keep rounds short.

  *(Self-Correction during drafting)*: Wait, 16 students in 4 teams is 4 per team. That's good. But 90 minutes is very short for a multi-round game. I need to limit the rounds to 3.
  Round 1: Baseline.
  Round 2: Anomaly.
  Round 3: Crisis/Monster.
  This ensures time for the debrief.

  Also, the "Hard Core" needs to feel like a *choice*. I will suggest giving them a menu of 3 Cores and letting them pick. This makes the lock-in feel like a commitment they made, not just a rule imposed.

