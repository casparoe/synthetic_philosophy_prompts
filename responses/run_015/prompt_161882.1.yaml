  **MEMORANDUM**

  **TO:** Progress Review Committee
  **FROM:** Graduate Representative
  **DATE:** Wednesday, May 22
  **SUBJECT:** Recommendations for Thursday's Progress Review Decision

  **Recommendations**

  To resolve the current impasse and ensure procedural fairness, I recommend the committee adopt the following three measures immediately:

  1.  **Policy Structure:** We will publish **Weighted Guidelines** rather than hard codified thresholds. We will specify how dimensions (chapters, articles, data) are generally weighted, but retain holistic judgement for application.
  2.  **Borderline Cases:** For this year's six borderline files, we will issue a **Deferred Decision** with a structured three-month improvement plan and a mandatory checkpoint review in August, rather than immediate continuation or withdrawal.
  3.  **Letter Language:** Notification letters will state that decisions are based on **Committee Consensus against Published Guidelines**. We will avoid language claiming to report a metaphysical fact ("you are not progressing") or explicit stipulation ("we have chosen to exclude you").

  **Reasoning**

  We are operating under a vague predicate ("substantial progress") that is multidimensional. The disagreement between Dana's epistemicism and Marcus's supervaluationism highlights real administrative risks. While both views aim to minimize arbitrariness, neither fits the administrative context without modification.

  **The Case Against Epistemic Confidence (Dana's View)**
  Dana argues that despite vagueness, a fact of the matter exists regarding each student's status, and our uncertainty is merely ignorance. On this view, we owe it to the students to dig deeper, gather more evidence, and judge correctly. This is the strongest moral position: it treats the student's status as objective and respects the reality of their work. It avoids the charge that we are arbitrarily drawing lines where none exist. If we are truly discovering a fact, then writing a letter that claims "you are not making progress" is simply reporting the truth, however difficult to ascertain.

  However, this view fails on the **reliability constraint**. Even if a fact exists, near the boundary our judgement is not reliable enough to sustain a withdrawal. In nearby possible worlds—where a committee member weights a chapter slightly differently—we would judge differently. If we cannot reliably distinguish the borderline case from the clear case, we cannot claim the knowledge required to terminate funding. Adopting Dana's semantics forces us to claim knowledge we do not possess, increasing the risk of successful appeals based on inconsistent application.

  **The Case for Transparency (Marcus's View)**
  Marcus argues that there is no fact until we precisify; the line is chosen, not discovered. This demands transparency: we should stipulate thresholds and own the choice. This aligns with administrative accountability. However, Marcus's suggestion of hard thresholds (e.g., "two chapters required") fails due to **multidimensional vagueness**. A student with one chapter and a submitted article may be progressing better than one with two chapters and no data. A hard threshold true across all admissible precisifications would exclude almost everyone, including some clearly doing fine. We cannot precisify one dimension without distorting the others.

  **Procedural Convergence and Solution**
  Despite the semantic disagreement, Dana and Marcus converge on the need to reduce arbitrariness. Dana wants evidence to find the fact; Marcus wants rules to justify the choice. The recommended hybrid satisfies both without the pitfalls.

  Publishing **Weighted Guidelines** satisfies Marcus's demand for transparency without the rigidity of hard thresholds. It informs students how we weigh dimensions without excluding valid exceptions. This addresses the multidimensional problem while reducing the "hidden rule" anxiety that drives appeals.

  For the six borderline files, a **Deferred Decision** acknowledges the vagueness without abandoning our duty. It avoids the epistemic arrogance of claiming we know they are failing (Dana) and the harshness of stipulating they fail (Marcus). It gives the student a pathway to move clearly into the "pass" region, rendering the boundary irrelevant.

  Finally, the **Letter Language** is critical. By citing "Committee Consensus against Guidelines," we avoid Dana's claim to infallible knowledge and Marcus's admission of arbitrary stipulation. We assert procedural legitimacy. This is the strongest defense against appeals: we followed a transparent, consistent process, rather than claiming to see the invisible or admitting we drew a line in the sand.

  **Next Steps**
  If approved Thursday, I will draft the Guidelines for publication by Friday and the Deferred Decision templates for the six files. We must vote on this framework to ensure unified messaging before any letters are sent.
