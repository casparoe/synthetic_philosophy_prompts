answer: |-
  **MEMORANDUM**

  **TO:** Clinical Informatics Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Fairness Criterion for Readmission Risk Model

  **Context**
  As we prepare to deploy the new readmission-risk model, we face a constrained choice. Due to the significant disparity in baseline readmission rates between our two target populations, we cannot simultaneously satisfy *Calibration* (scores represent identical probabilities across groups) and *Equalized Odds* (equal error rates across groups). Since the model output will function as a **hard threshold** to trigger a resource-intensive follow-up program, we must select the criterion that best aligns with our system's equity goals.

  **Recommendation**
  I recommend we lock in **Equalized Odds** as our primary fairness constraint.

  **Rationale**
  Our data indicates the population with the lower baseline readmission rate is also the one historically under-served by our system. In this context, a lower observed readmission rate likely reflects barriers to access (e.g., transportation, cost, trust) rather than superior health outcomes. 

  If we prioritize Calibration, the model will treat these suppressed baseline rates as "ground truth." Consequently, the hard threshold will systematically flag fewer patients from the under-served population, effectively codifying historical neglect into our algorithm. By prioritizing Equalized Odds, we ensure that the *sensitivity* of the model is consistent across groups. We guarantee that a patient in the under-served population who is at risk has the same probability of being flagged for the follow-up program as a similarly at-risk patient in the served population.

  **The Cost of Rejecting Calibration**
  Choosing Equalized Odds means sacrificing the universal interpretability of the risk score. 
  *   **Concrete Consequence:** We cannot tell a clinician that a risk score of 0.8 implies an 80% chance of readmission for *all* patients. For one population, 0.8 might mean 80% risk; for the other, it might mean 65% (or vice versa), depending on how the threshold shifts to meet error-rate parity. 
  *   **Operational Impact:** This limits the model's utility to the binary trigger only. We cannot safely use these scores for shared decision-making conversations where absolute risk probabilities are required, as the "meaning" of the score varies by demographic.

  **Steelman: The Case for Calibration**
  We must acknowledge the strength of the argument for Calibration, which we are foregoing. 
  *   **Clinical Integrity:** Risk is fundamentally a biological and clinical reality, not a social quota. Calibration ensures that the model tells the truth about the probability of an event. 
  *   **Resource Stewardship:** By enforcing Equalized Odds when base rates differ, we inherently accept different Positive Predictive Values (PPV) across groups. This means we may be allocating follow-up resources to patients in one group who are statistically less likely to actually be readmitted, simply to balance error rates. A proponent of Calibration would argue this is an inefficient use of limited care management resources and potentially paternalistic, as it prioritizes statistical parity over individual clinical accuracy.

  **Conclusion**
  While Calibration preserves the semantic purity of the risk score, Equalized Odds preserves the *equity of access* to care. Given that this model controls entry into a supportive intervention for a historically under-served group, ensuring we do not miss true positives in that population is the higher ethical priority.

  I look forward to discussing this during Friday's vote.
