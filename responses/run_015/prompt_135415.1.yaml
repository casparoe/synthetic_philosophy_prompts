answer: |-
  1. **Feminist Ethics-of-Care Interpretation**
  **Predictive Reliability Score:** 8/10
  This framework most accurately captures the asymmetry by framing merge authority as a failure to reciprocate the contributor's care labor, rendering their work invisible despite its necessity. Its high predictive score stems from the well-documented correlation between unacknowledged emotional labor and burnout in volunteer communities.
  *Limitation:* It may over-index on relational dynamics, potentially underestimating cases where contributors leave due to purely technical disagreements or lack of time rather than feelings of uncared-for dependency.

  2. **Fanon's Postcolonial Adaptation**
  **Predictive Reliability Score:** 7/10
  Fanon's lens effectively explains the asymmetry by treating merge rights as a colonial border that structurally enforces a "zone of non-being" for external contributors, making their invisibility a feature of the system rather than an oversight. The score is high because perceived structural exclusion is a potent driver of permanent withdrawal.
  *Limitation:* This approach risks over-politicizing interpersonal friction, as not all gatekeeping is rooted in identity-based hierarchy; sometimes it is merely a result of maintainer bandwidth constraints.

  3. **Distributed-Systems Analogy**
  **Predictive Reliability Score:** 6/10
  Your model usefully operationalizes the asymmetry by mapping social acknowledgment to reputation weight, treating withdrawal as a rational optimization when the cost of contribution exceeds the protocol's reward signal. It is moderately reliable because experienced engineers often do make cost-benefit decisions about where to invest their time.
  *Limitation:* It risks depoliticizing the human experience by assuming contributors are rational nodes, potentially missing the affective frustration and sense of betrayal that actually drive the decision to leave.

  4. **Kojève's Existentialist Reading**
  **Predictive Reliability Score:** 3/10
  Kojève frames the asymmetry as a zero-sum struggle for prestige where the contributor withdraws because they failed to coerce the maintainer into acknowledging their supremacy. This is the least useful because open-source collaboration is rarely a life-and-death fight for lordship, but rather a desire for integration and peer respect.
  *Limitation:* It misidentifies the contributor's motivation, as most seek partnership rather than domination, making it a poor predictor for retention in cooperative software environments.
