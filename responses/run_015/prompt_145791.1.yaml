  # The Grounding Realist Decision Tree

  This tree sorts "grounding realists" by their concrete metaphysical commitments rather than their preferred labels. It begins with the conceptual priority of the framework and proceeds through structural, modal, and directional claims.

  **Note on Usage:** Answer each question based on your actual metaphysical commitments. Do not answer based on where you think the branch leads.

  ---

  ### **Node 1: The Priority Question**
  **Is the claim "x is fundamental" to be analyzed as "x has no ground" (Grounding-First), or is the claim "x grounds y" to be analyzed as "x is more fundamental than y" (Fundamentality-First)?**

  *   **Left Branch:** Grounding-First (Fundamentality is defined by the absence of grounding).
  *   **Right Branch:** Fundamentality-First (Grounding is defined by the hierarchy of fundamental status).

  ---

  ### **Left Branch: Grounding-First Views**
  *If fundamentality is simply being ungrounded, the structure of the grounding relation determines the structure of reality.*

  #### **Node 2: Existence**
  **Does the grounding relation obtain between any entities whatsoever?**
  *(Added to distinguish Nihilism)*

  *   **No:** ➔ **Leaf 1: Grounding Nihilism**
      *   *Commitment:* There is no metaphysical dependence; there are only brute facts.
  *   **Yes:** ➔ Go to Node 3.

  #### **Node 3: Termination**
  **Must every chain of grounding terminate in something ungrounded?**
  *(From Prompt List)*

  *   **No:** ➔ **Leaf 2: Infinite Descent**
      *   *Commitment:* Grounding chains can go on forever; there is no fundamental base.
  *   **Yes:** ➔ Go to Node 4.

  #### **Node 4: Relation Unity**
  **Is grounding a single uniform relation, or a family of distinct relations (causal, normative, etc.)?**
  *(From Prompt List)*

  *   **Family:** ➔ **Leaf 3: Grounding Pluralism**
      *   *Commitment:* "Grounding" is a determinable covering distinct species of determination.
  *   **Single:** ➔ Go to Node 5.

  #### **Node 5: Base Unity**
  **Is the ungrounded base a single concrete object (the cosmos)?**
  *(Added to distinguish Monism)*

  *   **Yes:** ➔ **Leaf 4: Priority Monism**
      *   *Commitment:* The whole is fundamental; parts are grounded in the whole.
  *   **No:** ➔ **Leaf 5: Classical Grounding Realism**
      *   *Commitment:* There are many fundamental entities (e.g., particles, properties) that ground the rest.

  ---

  ### **Right Branch: Fundamentality-First Views**
  *If grounding is merely the expression of a fundamental hierarchy, the nature of that hierarchy determines the view.*

  #### **Node 6: Laws and Facts**
  **Are the laws of nature grounded in the particular matters of fact, or do they ground those facts?**
  *(From Prompt List)*

  *   **Grounded in Facts:** ➔ **Leaf 6: Humean Supervenience**
      *   *Commitment:* Laws are summaries of the fundamental mosaic; the mosaic grounds the laws.
  *   **Ground the Facts:** ➔ Go to Node 7.

  #### **Node 7: Nature of Fundamentality**
  **Is fundamental status determined by intrinsic categorical properties, or by structural position in a network?**
  *(Added to distinguish Structuralism)*

  *   **Structural Position:** ➔ **Leaf 7: Ontic Structuralism**
      *   *Commitment:* Relations are fundamental; objects are derivative nodes in a structure.
  *   **Intrinsic Properties:** ➔ Go to Node 8.

  #### **Node 8: Modal Strength**
  **Does grounding necessitate what it grounds, or does it merely suffice for it?**
  *(From Prompt List)*

  *   **Merely Suffices:** ➔ **Leaf 8: [EMPTY / INCOHERENT]**
      *   *Status:* **Incoherent.**
      *   *Reason:* On a Fundamentality-First view, if x is more fundamental than y but does not necessitate y, the connection is too weak to constitute metaphysical determination. This position collapses into mere correlation or Humeanism (already captured at Node 6).
  *   **Necessitates:** ➔ **Leaf 5 (Shared): Fundamentalist Realism**
      *   *Status:* **Indistinguishable from Classical Grounding Realism.**
      *   *Reason:* This view accepts many fundamental entities, a single grounding relation, termination, and necessitation. It differs from **Leaf 5** only on the conceptual analysis at Node 1, which yields no difference in concrete grounding claims.

  ---

  ### **Unused Logical Space & Flags**

  **1. The Indistinguishable Leaves (Leaf 5 & Leaf 8-Yes)**
  *   **Classical Grounding Realism** (Left Branch) and **Fundamentalist Realism** (Right Branch) are flagged as **Indistinguishable**.
  *   **Why:** They agree on every concrete claim (grounding exists, terminates, is unique, necessitates, many fundamentals). They disagree only on whether "fundamental" means "ungrounded" or "grounding." Without a question about *conceptual analysis* (Node 1), these leaves cannot be separated.

  **2. The Empty Leaf (Leaf 8-No)**
  *   **Sufficiency-Only Fundamentalism** is flagged as **Incoherent**.
  *   **Why:** In the context of Fundamentality-First, grounding is meant to capture metaphysical determination. Without necessitation, the "fundamental" fails to determine the "derived," rendering the hierarchy explanatorily idle.

  **3. Unused Prompt Questions**
  *   **Socrates vs. Singleton:** This question was omitted to keep the tree within 8 leaves. It typically distinguishes directionality, but on this tree, direction is largely fixed by the Branch (Grounding-First implies Socrates grounds Singleton; Fundamentality-First implies it depends on what is fundamental).
  *   **Reflexivity (Self-Grounding):** This was omitted. A "Yes" answer would lead to an **Empty / Unattractive** leaf, as analytic grounding is standardly taken to be irreflexive.
  *   **Two Distinct Complete Grounds:** This was omitted. A "Yes" answer typically leads to **Unattractive** systematic overdetermination, though some pluralists may occupy it.

  **4. Missing Leaf: Grounding Coherentism**
  *   A view accepting **Reflexivity** (facts partly ground themselves) would form a distinct leaf. It is excluded here as it occupies a marginal position in the current literature, but could be added by splitting Node 3 (Termination) to allow for loops.
