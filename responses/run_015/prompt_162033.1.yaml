  # Diagnostic Decision Tree: The Metaphysics of Origin

  **Instructions:** Answer each question based on your intuitions about the case described. Follow the path indicated by your answer to locate your position in the logical space of origin essentialism.

  ### **Node 1: Gamete Matter**
  **Question:** Consider a numerically distinct sperm or egg whose genome has exactly the same base sequence as the actual one, which recombination makes conceivable even if it is astronomically unlikely. If *that* gamete had united to form you, would you exist?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 2**.

  ### **Node 2: Extrinsic History**
  **Question:** Do extrinsic historical factors, specifically the same gametes uniting a day earlier or later than they did, or a corrective edit made to the zygote at the one-cell stage, determine identity?
  *   **No:** Go to **Leaf 2**.
  *   **Yes:** Go to **Node 3**.

  ### **Node 3: Cytoplasmic Context**
  **Question:** Consider the same nuclear genome developing in a different egg cytoplasm, with different mitochondria and different initial chemical conditions. Is this you?
  *   **No:** Go to **Leaf 3**.
  *   **Yes:** Go to **Node 4**.

  ### **Node 4: Genetic Precision**
  **Question:** Consider a gamete whose genome differs from the actual one by a single base pair. If this had been your origin, would you exist?
  *   **No:** Go to **Leaf 4**.
  *   **Yes:** Go to **Node 5**.

  ### **Node 5: Twinning Determinacy**
  **Question:** In monozygotic twinning, where one zygote formed from the same gametes later splits into two embryos, is it indeterminate which twin is the 'original' person?
  *   **Yes:** Go to **Leaf 5**.
  *   **No:** Go to **Node 6**.

  ### **Node 6: Boundary Sharpness**
  **Question:** In a case in which a child of the same two parents, conceived at a different time, would have been raised in her place, next to a variant in which no such child would have existed at all, is there a sharp boundary where you cease to exist?
  *   **No (Vague):** Go to **Leaf 6**.
  *   **Yes (Sharp):** Go to **Node 7**.

  ### **Node 7: Identity Ground**
  **Question:** Is identity in these sharp-boundary cases settled by qualitative similarity (closest candidate) or by a primitive thisness?
  *   **Qualitative:** Go to **Leaf 7**.
  *   **Primitive:** Go to **Leaf 8**.

  ---

  ### **Leaves (Positions)**

  **Leaf 1: Strict Gamete Essentialism**
  *   **Standard Name:** Strict Gamete Essentialism (Kripke/Mackie).
  *   **Awkward Commitment:** You must deny that you could have existed even if a molecule-identical duplicate of your actual sperm had fertilized your actual egg.
  *   **Separation:** Separated from all others by Node 1.

  **Leaf 2: Unnamed (Temporal/Historical Essentialism)**
  *   **Standard Name:** Unnamed.
  *   **Diagnosis:** Incoherent; makes identity depend on extrinsic temporal coordinates or medical history rather than biological constitution.
  *   **Separation:** Separated from all others by Node 2.

  **Leaf 3: Zygote Essentialism**
  *   **Standard Name:** Zygote Essentialism (Robertson).
  *   **Awkward Commitment:** You must grant that swapping the egg's cytoplasm (and mitochondria) creates a different person, despite identical nuclear DNA.
  *   **Separation:** Separated from all others by Node 3.

  **Leaf 4: Genetic Sequence Essentialism**
  *   **Standard Name:** Genetic Essentialism.
  *   **Awkward Commitment:** You must deny that you could have existed with even a single silent mutation in your initial genome.
  *   **Separation:** Separated from all others by Node 4.

  **Leaf 5: No-fact-of-the-matter**
  *   **Standard Name:** Indeterminacy View (Evans).
  *   **Awkward Commitment:** You must accept that there is no objective truth about which of two identical twins is the 'original' subject of your life.
  *   **Separation:** Separated from all others by Node 5.

  **Leaf 6: Close-enough Origin**
  *   **Standard Name:** Vagueness View (Lewis/Williams).
  *   **Awkward Commitment:** You must accept that there is no fact of the matter about exactly how many base-pair changes constitute a different person, despite reality being precise.
  *   **Separation:** Separated from all others by Node 6.

  **Leaf 7: Anti-essentialist**
  *   **Standard Name:** Closest Candidate View (Nozick).
  *   **Awkward Commitment:** You must allow that identity is a matter of convention or best match, meaning "you" could be whoever fits the role best in a counterfactual world.
  *   **Separation:** Separated from Leaf 8 by Node 7.

  **Leaf 8: Primitivist**
  *   **Standard Name:** Haecceitism.
  *   **Awkward Commitment:** You must posit a non-qualitative "thisness" that persists even if all material and historical origins are replaced.
  *   **Separation:** Separated from Leaf 7 by Node 7.

  ---

  **Note on Separation:** All leaves are logically separated by the decision nodes above; however, **Leaf 6 (Close-enough Origin)** and **Leaf 5 (No-fact-of-the-matter)** are often difficult to distinguish in practice, as both deny a sharp boundary of identity, though they differ on whether the indeterminacy is semantic (vagueness) or ontological (no fact).
