      *   *Wait, I can do Dilation with the "Helper" constraint.*
      *   *Setup:* The Helper chose the number of Red balls ($N_R$) using a specific rule unknown to students.
      *   *Rule:* Helper rolled a die. 1-3: $N_R \in [20, 40]$. 4-6: $N_R \in [60, 80]$.
      *   *Prior on Red:* $[20, 80]$. (Union of the two).
      *   *Evidence:* I draw a ball. It is Red.
      *   *Posterior:* If $N_R \in [20, 40]$, likelihood of Red is low-ish. If $N_R \in [60, 80]$, likelihood is high-ish.
      *   *Actually, this creates bimodality, not necessarily dilation.*
      *   *Decision:* I will advise the instructor that Dilation is technically real but prop-heavy. I will substitute it with **"The Reveal that Changes Nothing."** (Inertia).
