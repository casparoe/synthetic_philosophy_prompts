      *   *Dilation requires a specific structure:* Usually involves a second variable correlated with the uncertainty.
      *   *Alternative:* **The "Two Bags" Problem.**
      *   *Bag 1:* The Mystery Bag (20-80 Red).
      *   *Bag 2:* A Known Bag (50 Red).
      *   *Procedure:* I flip a coin. Heads: I draw from Mystery. Tails: I draw from Known. I tell you the result is Red.
