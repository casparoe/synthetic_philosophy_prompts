answer: |-
  Here is a 75-minute session design. It relies on friction, scoring rules, and forced consensus to make the abstract costs of imprecision tangible.

  ### Logistics & Setup
  *   **Room:** Standard seminar. Projector for leaderboard.
  *   **Props:** Opaque bag (100 balls, fixed Red count $N_R \in [20, 80]$ by helper), index cards, pens.
  *   **Currency:** "Seminar Points" (SP). Top 3 students get a visible title (e.g., "Chief Actuary") on the board for the rest of the term; bottom 3 get "Junior Analyst."
  *   **Rule:** No talking during rounds. All submissions on index cards.

  ---

  ### Round 1: The Interval Score (15 Minutes)
  **Goal:** Make width expensive. Make missing the truth expensive. Force a tradeoff.

  **The Task:**
  Tell them: *"The bag contains between 20 and 80 Red balls. The exact number is fixed. Write down an interval $[L, U]$ representing the percentage of Red balls. $0 \le L \le U \le 100$."*

  **The Scoring Rule (Project this):**
  $$ \text{Score} = 100 - (U - L) - 50 \times \mathbb{I}(\text{Truth} \notin [L, U]) $$
  *   **Width Penalty:** Every unit of width costs 1 point.
  *   **Miss Penalty:** If the true percentage is outside your interval, lose 50 points.

  **The Mechanism:**
  1.  Collect cards.
  2.  Reveal the true number (e.g., 64 Red).
  3.  Calculate scores publicly for a few volunteers, then project the distribution.

  **The Lesson:**
  *   $[0, 100]$ guarantees safety but scores 0.
  *   $[50, 50]$ scores 100 if right, -49 if wrong.
  *   **The Parameter Transparency:** Explicitly ask: *"If I changed the Miss Penalty from 50 to 10, how many of you would have widened your interval?"*
  *   **Point to make:** Your behavior wasn't driven by "belief" alone; it was driven by the *price of precision*. In imprecise probability, the "width" isn't just error; it's a feature you buy or sell.

  ---

  ### Round 2: The Spread Sheet (20 Minutes)
  **Goal:** Separate (a) Imprecise Credence, (b) Second-Order Uncertainty, (c) Precise Credence.

  **The Task:**
  *"You are a market maker. A ticket pays 100 SP if the next ball drawn is Red, 0 if Black. Write down two numbers:*
  1.  *Your Bid ($B$): The most you will pay to buy.*
  2.  *Your Ask ($S$): The least you will accept to sell.*
  *Constraint: $B \le S$.*"

  **The Mechanism:**
  1.  **The House Rule:** I (Instructor) will act as the counterparty. I will flip a coin.
      *   Heads: I buy from you at your Ask $S$.
      *   Tails: I sell to you at your Bid $B$.
  2.  **The "Pass" Option:** On the card, they can also check a box: **"No Market."**
      *   **Cost:** Checking "No Market" costs 5 SP guaranteed.
      *   **Trading:** If they trade, they face the variance of the ball draw.

  **The Logic (for your debrief):**
  *   **Precise Credence ($p=0.5$):** Expected value is 50. $B \approx 50, S \approx 50$. Spread $\approx 0$. They *must* trade because "No Market" costs 5, while trading has EV 0.
  *   **Second-Order Uncertainty ("Unsure about 0.5"):** They have a distribution over $p$ centered at 0.5. The integral is still 50. They should still trade (EV 0 > Cost 5).
  *   **Imprecise Credence ($p \in [0.2, 0.8]$):**
      *   Max Buy Price (to avoid sure loss): $20$.
      *   Min Sell Price (to avoid sure loss): $80$.
      *   Spread: $60$.
      *   **The Trap:** If they trade, the House coin flip might force them to Buy at 20 (good) or Sell at 80 (good)... *but* if they set $B=20, S=80$, the House might refuse to trade if the spread is too wide? No, the House *must* trade per the rule.
      *   **The Refusal:** A Maximin agent sees the worst case. If they Sell at $S$, worst case is Red (pay 100). Profit $S - 100$. If $S < 100$, this is a loss.
      *   *Correction for the activity:* To make "No Market" rational for the imprecise student, the trading EV must be potentially negative.
      *   **Revised Rule:** The House offers a fixed price of 50.
      *   **Choices:** Buy at 50, Sell at 50, or Pass (Cost 5).
      *   **Precise/Second-Order:** EV is 0. Pass costs 5. They must Buy or Sell.
      *   **Imprecise ([0.2, 0.8]):**
          *   Buy EV range: $[20-50, 80-50] = [-30, +30]$. Min EV is -30.
          *   Sell EV range: $[50-80, 50-20] = [-30, +30]$. Min EV is -30.
          *   Pass EV: -5.
          *   **Result:** Rational imprecise agents **Pass**. Precise agents **Trade**.

  **Observation:** Tally the "Pass" votes. If the true proportion is 64% (EV +14), the Passers "lost" 19 points relative to the traders (-5 vs +14). If the true proportion was 20% (EV -30), the Passers "won" (lost only 5).
  **Visibility:** The "Pass" is a visible refusal to take a side. It is expensive to fake because if the truth is favorable, they bleed points.

  ---

  ### Round 3: The Committee Deadlock (20 Minutes)
  **Goal:** An interval does not dictate action.

  **The Task:**
  *"The class is a committee. You must choose one Policy for the department."*
  *   **Policy X:** Payoff = $1 \times (\text{Number of Red Balls})$. (Range: 20 to 80 SP).
  *   **Policy Y:** Payoff = $55$ SP (Fixed).
  *   **Rule:** We vote. If >50% vote X, we take X. Else Y.
  *   **Penalty:** If the class takes more than 3 minutes to reach a majority, **everyone loses 10 SP.**

  **The Conflict:**
  *   If Red = 20, Y is better (55 > 20).
  *   If Red = 80, X is better (80 > 55).
  *   Break-even is 55 Red balls.
  *   Their knowledge is $[20, 80]$. The break-even point is *inside* their interval.

  **The Experience:**
  *   Precise thinkers will argue for the midpoint (50). Midpoint < 55, so choose Y.
  *   Optimists will argue for the max. Choose X.
  *   Imprecise thinkers will argue: *"We cannot determine dominance. X does not dominate Y, Y does not dominate X."*
  *   **The Strand:** They will realize their interval $[20, 80]$ gives **no instruction**. To act, they must adopt a secondary rule (Minimax, Hurwicz, Midpoint) that was not part of their belief state.
  *   **The Cost:** Watch the clock. If they philosophize too long, the 10 SP penalty hits. They are punished for the inability to collapse the interval into a number.

  ---

  ### Round 4: The Sticky Update (10 Minutes)
  **Goal:** Demonstrate that intervals resist evidence (Inertia), which feels like a bug.

  **Note on Dilation:** *True dilation (where the posterior interval is a superset of the prior regardless of evidence) requires a specific correlation structure between two variables (e.g., Urn A and Urn B). With a single bag of fixed composition, standard Bayesian updating on a set of priors will usually narrow the interval, not widen it. I recommend skipping Dilation to avoid technical confusion and instead demonstrating **Inertia**.*

  **The Task:**
  1.  Recall the interval from Round 1 (e.g., $[20, 80]$).
  2.  **Evidence:** I draw 5 balls *with replacement*. Result: 4 Red, 1 Black.
  3.  **Task:** Write your new interval.

  **The Phenomenon:**
  *   **Bayesian (Precise):** Prior 0.5. Likelihood strongly favors high Red %. Posterior shifts sharply to ~70-80%.
  *   **Imprecise (Robust):** You have a set of priors. The "worst case" prior (20% Red) is now very unlikely, but not impossible. The "best case" (80% Red) is likely.
  *   **The Strange Part:** If you are being *conservative* (e.g., requiring a likelihood ratio threshold to discard a prior), your interval might barely move.
  *   **Scoring:** Offer a bonus for the *narrowest* interval that still contains the truth.
  *   **Outcome:** The precise students narrow their interval and win points. The imprecise students keep it wide to be safe and lose points.
  *   **Lesson:** Imprecision is expensive in a learning environment. It makes you "slow" to update. This feels irrational (ignoring evidence), but it's the cost of robustness.

  ---

  ### The Debrief (10 Minutes)
  **Map the Moments:**
  1.  **Round 1 (Scoring):** "You didn't just report belief; you reported your *tolerance for risk* given my scoring rule. Imprecision is often a response to the penalty parameter of the world."
  2.  **Round 2 (The Pass):** "The students who Passed weren't 'unsure.' They were *coherently imprecise.* A second-order Bayesian (unsure about 0.5) *must* trade. Only the student with no number (a set of probabilities) rationally refuses both sides."
  3.  **Round 3 (Deadlock):** "Your interval $[20, 80]$ was a complete description of your knowledge, but an incomplete description for *choice.* To act, you had to smuggle in a decision rule (like 'pick the midpoint') that wasn't in your epistemology."
  4.  **Round 4 (Inertia):** "Imprecise credences are sticky. They protect you from being wrong, but they prevent you from being right quickly."

  **Predictable Failures:**
  1.  **The "Middle" Anchor:** In Round 1, half the class will write $[45, 55]$ simply because 50 is the middle of 20-80. *Counter:* In debrief, ask them if they had evidence for 50, or if they just liked the symmetry.
  2.  **The "Psychological" Game:** One student will argue, "The professor put 50 in because it's a cliché." *Counter:* Remind them the helper fixed it. The uncertainty is ontological, not psychological.
  3.  **The "Risk" Conflation:** In Round 2, students will say "I Passed because I'm risk averse." *Correction:* Risk aversion applies to utility over outcomes. This was about uncertainty over probabilities. You can be risk-neutral and still Pass if your credence is imprecise.

  **The Normative Gap (What you must say):**
  *"This activity shows that imprecise credences cost you points. They make you pass on profitable bets. They make you slow to learn. They deadlock committees. So why use them?"*

  *"Because in Round 1, if the helper had put 5 Red balls (outside the 20-80 promise), the precise students got hammered (-50), and the wide-interval students survived. Imprecision is insurance against model misspecification. I cannot prove to you that you *should* be imprecise. I can only show you that when the world violates your precise assumptions, the imprecise student is the only one left standing."*
