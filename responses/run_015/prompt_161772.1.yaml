      *   *Correlation:* If Bag A has >50 Red, Bag B is Red. If Bag A has <50 Red, Bag B is Black. (Helper sets this up).
      *   *Students don't know the correlation rule, only that Bag B is somehow linked.*
      *   *Too much secrecy.*
      *   *Okay, I will recommend the "Inertia" demo. It's safer and illustrates the "cost" of imprecision (slow learning).*

  5.  **Refining the Plan & Logistics:**
      *   **Time:** 75 mins.
      *   **R1 (15 mins):** Interval Scoring.
      *   **R2 (20 mins):** Buy/Sell Spread (The Refusal).
