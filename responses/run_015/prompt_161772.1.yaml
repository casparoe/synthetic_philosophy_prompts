prompt: |-
  I teach a fourth-year seminar on rational choice — 17 students, one 75-minute slot. They've all seen expected utility and basic Dutch book stuff, but nothing about what happens when you don't have a number. I want one session where they feel the difference between having a sharp credence you're unsure about and genuinely not having a number, and where the not-having costs them something they can see. Not the known-urn / unknown-urn thing that every google result is about — I want imprecision to cost them points, and then to strand them at the moment they have to act.

  Constraints: no money changing hands (points, a leaderboard, mild shame). Materials: index cards, a projector, an opaque bag of 100 ping-pong balls whose composition gets fixed by a helper outside the room, so that neither I nor they know any more than "somewhere between 20 and 80 of them are red." No lecture up front, and id rather the words imprecise, ambiguity, and Knightian not be said out loud until the debrief.

  What I'd like designed:

  1. A reporting round where students write down, not a number, but a pair of bounds, and get scored by something that penalises both being wrong and being wide — so that "0 to 100" is safe but expensive and "0.5" is cheap but risky. I want the width-versus-accuracy tradeoff to be something they can see and argue about, and I want you to be upfront about how much of the result is being driven by your choice of penalty parameter rather than by anything deep.

  2. A round that separates three things my students definately conflate: (a) "no idea what the chance is," (b) "the chance is probably around a half but I'm not confident about that," (c) "I have a number, I'm just rounding it." These should come apart in observable behaviour — ideally something where the student who has a second-order spread over chances still ends up transacting at some number, while the student with an open interval refuses to take either side of the bet, and the round makes that refusal visible as a refusal and expensive to fake.

  3. A forced-action round: the group as a whole has to commit to one of two options, and which option is better flips depending on which number inside their interval you act on. They should discover for themselves that an interval doesn't tell you which member to use, and then argue about whether it's legitimate to just pick one.

  4. I have a half-memory that with intervals, conditioning on new evidence can leave your interval wider than it was no matter which way the evidence comes out — which sounds like a bug rather than a feature. If that's a real phenomenon, can a short fourth round make it happen in front of them? If it isn't, say so and give me some other way to make intervals look strange.

  Then the debrief: map specific moments in the session onto the distinctions, tell me what will predictably go wrong the first time I run it (my guesses: everyone just writes 0.5 because it's the middle, and at least one student treats the whole thing as a puzzle about what I'm thinking), and be honest about the part of the idea the activity can't deliver — the part where I have to stand up and say something normative myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 4th-year seminar students (17 students).
      *   **Topic:** Rational Choice, specifically moving from precise credences (Expected Utility) to imprecise credences (sets of probabilities).
      *   **Prior Knowledge:** Expected Utility, Dutch Books. No prior exposure to imprecision/Knightian uncertainty.
      *   **Goal:** One 75-minute session. Make them *feel* the difference between "unsure about a number" vs. "no number." Make imprecision *cost* points. Make inaction/stranding visible.
      *   **Constraints:** No real money (points/leaderboard/shame). Materials: Index cards, projector, opaque bag (100 balls, 20-80 red, composition fixed by helper). No lecture upfront. Don't use terms like "imprecise," "ambiguity," "Knightian" until debrief.
      *   **Specific Deliverables:**
          1.  Reporting Round (Bounds scoring, width vs. accuracy tradeoff).
          2.  Distinction Round (Separate "no idea" vs. "unsure about 0.5" vs. "rounding").
          3.  Forced-Action Round (Interval doesn't dictate action, group must choose).
          4.  Conditioning Round (Does evidence widen intervals? Or alternative strangeness).
          5.  Debrief (Map moments to concepts, predict failures, admit limitations).

  2.  **Deconstruct the Core Challenge:**
      *   The core philosophical tension is between *Risk* (known probabilities) and *Ambiguity/Imprecision* (unknown probabilities/sets of probabilities).
      *   The bag setup (20-80 red) is a classic Ellsberg-style setup, but the prompt explicitly says "Not the known-urn / unknown-urn thing that every google result is about." I need to avoid the standard "Bet on Urn A vs. Urn B" comparison. Instead, the *scoring mechanism* must force the revelation of their internal state.
      *   The "Helper" constraint is crucial. The instructor *also* doesn't know the number. This creates shared ignorance.

  3.  **Drafting Round 1: The Scoring Rule (Bounds vs. Point)**
      *   *Goal:* Penalize width, penalize error.
      *   *Mechanism:* Need a proper scoring rule for intervals. The "Interval Scoring Rule" (e.g., from forecasting literature) works well.
      *   *Formula:* Score = $S - \text{Width} - \text{Penalty if outside}$.
      *   *Refinement:* Let's keep it simple for 75 mins.
      *   *Proposal:* Students submit $[L, U]$. True value $V$.
      *   *Score:* $100 - (U - L) - 10 \times \mathbb{I}(V \notin [L, U])$.
      *   *Why:* Narrow interval = high base score. Missing the truth = big penalty. Wide interval = safe but low score.
      *   *Transparency:* I need to explicitly tell them the formula so they can strategize. This addresses the "upfront about penalty parameter" constraint.
      *   *Task:* Estimate the % of red balls in the bag.
      *   *Catch:* They don't know the number. It's fixed between 20 and 80.
      *   *Expected Behavior:* Some will guess 50 (point). Some will say [20, 80]. Some will say [40, 60].
      *   *Lesson:* The tension between precision and accuracy under ignorance.

  4.  **Drafting Round 2: The Market/Bet (Separating the States)**
      *   *Goal:* Distinguish (a) No Idea, (b) Unsure about 0.5, (c) Rounding.
      *   *Mechanism:* A betting market or bilateral trade.
      *   *Setup:* Offer a bet: Win 10 points if Red, Lose 10 points if Not Red. Price = 5 points (implied prob 0.5).
      *   *Action:* Students choose: Buy, Sell, or Pass.
      *   *Logic:*
          *   (c) Rounding 0.5: Indifferent, might flip a coin or pass.
          *   (b) Unsure about 0.5 (Second order): Might accept the bet if they think the *true* chance is likely near 0.5, even if unsure. *Wait, this is tricky.* If they have a second-order distribution centered on 0.5, the expected value is still 0.5. They should be indifferent.
          *   (a) Imprecise (Set of Priors): If their set is $[0.2, 0.8]$, the min expected value is $0.2 \times 10 - 0.8 \times 10 = -6$. The max is $+6$. A "maximin" agent refuses to buy *and* refuses to sell.
      *   *Refinement:* To make the refusal visible and expensive, we need a "Pass" option that costs something (e.g., -1 point) or yields 0, while taking the bet has variance.
      *   *Better Mechanism:* "Make a Market." Students write a Buy Price and a Sell Price.
      *   *Constraint:* Buy Price $\le$ Sell Price.
      *   *Scoring:* If the "House" (Instructor) accepts their price, they are locked in. But the Instructor doesn't know the truth either.
      *   *Alternative:* Pair them up? Too chaotic.
      *   *Selected Mechanism:* **The Spread Sheet.** Students submit a Buy Price ($P_b$) and Sell Price ($P_s$) for a ticket paying 100 if Red.
      *   *Rule:* If $P_s - P_b$ is small (tight spread), they get a bonus *if* they trade. But they only trade if a random "counterparty" (simulated by the instructor drawing a random price) hits their spread.
      *   *Actually, simpler:* Just ask for Buy/Sell prices.
      *   *Distinction:*
          *   Precise (0.5): $P_b \approx P_s \approx 50$.
          *   Imprecise ([20, 80]): $P_b \approx 20, P_s \approx 80$.
          *   "No Idea": Might leave blank or widest possible.
      *   *Cost:* To make "Pass" expensive, introduce a "Participation Fee" for the round, waived if they post a spread narrower than X. No, that's complex.
      *   *Let's try the "Refusal Cost":* You *must* post a spread. If the true probability falls inside your spread, you get 0. If it falls outside, you lose points based on distance.
      *   *Wait, Round 2 needs to separate the mental states.*
      *   *Idea:* Offer a specific bet: "Pay 50 to win 100 if Red."
      *   *Options:* Accept, Reject, Abstain.
      *   *Payoff:* Abstain costs 2 points (opportunity cost/fee).
      *   *Logic:*
          *   Precise 0.5: Indifferent between Accept/Reject. Abstain is strictly dominated (costs 2). They must choose.
          *   Imprecise [0.2, 0.8]: Accept has min EV -30. Reject has min EV -20 (relative to 0). Abstain costs 2. If they are maximin, they Abstain.
      *   *Problem:* Students might game the "Abstain" cost.
      *   *Revised Idea:* **The Bookie Round.** I (Instructor) offer to buy or sell tickets at *their* stated price.
      *   *Instruction:* Write down the lowest price you'll sell at ($S$) and highest price you'll buy at ($B$). Constraint: $B \le S$.
      *   *Scoring:* I will roll a die to decide if I act as Buyer or Seller.
          *   If I Buy: You sell at $S$. Your payoff = $S - 100$ (if Red) or $S$ (if Black).
          *   If I Sell: You buy at $B$. Your payoff = $100 - B$ (if Red) or $-B$ (if Black).
      *   *The Trap:* If you have a precise credence $p$, $B \approx S \approx 100p$. Spread is 0.
      *   *If you have imprecise credence $[p_{min}, p_{max}]$, rationality (to avoid sure loss/Dutch book within your own standards) demands $B \le 100p_{min}$ and $S \ge 100p_{max}$.
      *   *The Cost:* A wide spread ($S - B$) means you miss trades that would have been profitable *if* you were precise. But since the truth is unknown, we can't score "missed profit."
      *   *Fix:* Score based on *ex-post* value.
      *   *Actually, let's look at the prompt:* "make that refusal visible as a refusal and expensive to fake."
      *   *Solution:* **The Mandatory Choice with a "Pass" Penalty.**
      *   *Bet:* 10 points if Red, -10 if Black.
      *   *Choices:* Take Bet, Take Opposite Bet, Pass.
      *   *Pass Cost:* -1 point guaranteed.
      *   *Observation:* Precise agents (even unsure ones) should take a side (EV is 0, Pass is -1). Imprecise agents (Maximin) see EV range $[-6, +6]$. Min EV is negative. They Pass.
      *   *Visibility:* We tally how many Passed.
      *   *Expense:* If the truth turns out to be 80% Red, the Passers look foolish. If 50/50, the Takers look foolish. But the *point* is the hesitation.
      *   *Wait, I need to separate (b) "Unsure about 0.5" from (a) "No Number".*
      *   *If (b):* I think the chance is a random variable $P$ with mean 0.5. My EV is $E[P] \times 10 = 5$. I should take the bet.
      *   *If (a):* I have a set $[0.2, 0.8]$. My Min EV is -6. I Pass.
      *   *This works.* The behavior separates Second-Order Probability (Bayesian) from Imprecise Probability (Maximin/sets).

  5.  **Drafting Round 3: Forced Action (The Committee)**
      *   *Goal:* Interval doesn't dictate action. Group must choose.
      *   *Setup:* Two policies, X and Y.
      *   *Payoffs:*
          *   Policy X: Payoff = $100 \times (\text{Proportion Red})$.
          *   Policy Y: Payoff = $60$ (Fixed).
      *   *Knowledge:* Proportion is in $[20, 80]$.
      *   *Conflict:* If Red = 20, X = 20 (Y better). If Red = 80, X = 80 (X better). Break-even at 60% Red.
      *   *Interval:* $[20, 80]$ contains the break-even 60.
      *   *Task:* The class must vote on X or Y. Majority rules.
      *   *Debrief:* The interval $[20, 80]$ does not tell you whether to pick X or Y. You need a tie-breaking rule (e.g., Hurwicz criterion, Minimax Regret, or just picking the midpoint).
      *   *Friction:* Students who want to be "rational" will stall. "We don't know!" "Exactly, so pick one."

