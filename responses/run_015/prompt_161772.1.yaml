      *   *Actually, the "Inertia" of Imprecise Priors is a better fit for the "strange" constraint.* With a set of priors, small evidence doesn't shift the *bounds* much because the "worst case" prior shifts slowly.
      *   *Let's try to construct a Dilation demo:*
          *   Variable $H$: Ball is Red. Prior $[0.2, 0.8]$.
          *   Variable $E$: I draw a second ball from a *different* bag that is correlated.
          *   *Too hard to set up in class.*
      *   *Alternative:* **The "Sure Loss" Check.**
      *   *Round 4:* I offer a series of bets that are individually acceptable by their interval standards but collectively guarantee a loss (Dutch Book for Imprecise Credences is tricky, usually requires violating coherence).
