  2. The unifying rule is that art counts as good propaganda if it effectively improves the political standing of Black people, regardless of the artist's intent or the work's aesthetic style. This explains why the unintentional romance and abstract quilt succeed while the ineffective protest play fails.

  3. A rival rule requires that good propaganda must advance the cause through truthful representation, which would condemn the installation for deceiving the legislators despite its successful outcome. This fits the prior cases because the failed mulatto novel relied on stereotypes while the successful romance depicted ordinary reality.

  4. Her record cannot distinguish these rules because every work she praised happened to be both effective and grounded in some form of authentic Black experience. There is no prior case where a work succeeded politically while relying on a known or discovered falsehood.

  5. I would ask her to judge a clearly labeled work of fiction that achieves the exact same legislative result, to see if she requires factual truth or just political efficacy. This isolates whether the value lies in the outcome alone or in the integrity of the representation used to achieve it.
