answer: |-
  ### The Scenario: The Xenon-Flux Crystals

  Consider a world physically identical to ours in all macroscopic, classical respects, but stipulated to be ontologically indeterministic in one specific domain. In this world, there exists a synthetic mineral called "Xenon-Flux." When a Xenon-Flux crystal is heated to exactly 100°C (Event A), it emits a high-energy photon (Event B). Extensive observation confirms a stable regularity: in exactly 99% of heating events, the photon is emitted. In the remaining 1%, the crystal heats normally but emits nothing.

  Crucially, stipulate that this 1% failure rate is **ontologically brute**. There are no hidden variables: the failing crystals are microstructurally identical to the successful ones. There is no environmental interference, no measurement error, and no prior causal chain distinguishing the 1% from the 99%. The failure is not due to ignorance; it is a fundamental feature of the world's history that some A-events simply do not yield B, with no categorical difference to explain why. A scientist in this world uses the rule $P(B|A) = 0.99$ to make predictions. Her track record is perfect; she correctly predicts long-run frequencies and loses no money betting on individual cases based on these odds. Her success is fixed; the question is solely what metaphysical status her rule possesses.

  ### The Lewisian (Humean) Verdict

  For the Lewisian, laws are theorems or axioms of the "Best System"—the deductive system that best balances **simplicity** (brevity of formulation) and **strength** (information about the Humean Mosaic of particular facts).

  1.  **Deterministic Candidate:** The statement "All A are B" is false (due to the 1% failure), so it cannot be a law.
  2.  **List Candidate:** A system listing every individual heating event and its outcome is perfectly strong (100% accurate) but infinitely complex. It fails the simplicity test miserably.
  3.  **Probabilistic Candidate:** The statement "For any A, the objective chance of B is 0.99" is true to the mosaic (it fits the stable frequency). It is extremely simple (one equation) and very strong (it entails the statistical regularities of large batches).

  **Verdict:** The probabilistic statement wins the trade-off. It is a genuine law. The Lewisian holds that the law *is* the summary of the pattern; since the pattern is irreducibly statistical, the law is irreducibly probabilistic.

  ### The Armstrongian (Anti-Humean) Verdict

  For the Armstrongian, laws are relations of **Necessitation** ($N$) between Universals (e.g., $N(\text{Heating}, \text{Emission})$). This relation is traditionally understood as exceptionless: if the universals are related, the instantiation of one *must* bring about the other.

  1.  **Strict Necessitation:** If $N(\text{Heating}, \text{Emission})$ holds, then every instance of Heating must produce Emission. Since 1% do not, the strict universal law is false.
  2.  **No Law:** The Armstrongian must either deny there is a law here (it is just a brute regularity) or posit a new, mysterious relation of "Probabilistic Necessitation" ($N_p$).
  3.  **The Break:** If they posit $N_p$, they face a dilemma. If $N_p$ is defined by the frequencies, the view collapses into Humeanism. If $N_p$ is a primitive modal force that *usually* but not *always* produces the effect, it is unclear what work it is doing. The requirement for a "true, non-accidental, exceptionless universal" breaks because the connection between the universals fails to determine the outcome in individual cases.

  **Verdict:** The Armstrongian struggles to validate the law. At best, they must admit the law is a *ceteris paribus* generalization ("Heating necessitates Emission, *unless* it doesn't"), which lacks the modal oomph of a strict law. The 1% failures are brute facts that the relation of universals fails to govern.

  ### The Substantive Disagreement

  The disagreement is not verbal; it licenses different inferences regarding **compound events**.

  *   **Lewisian:** Because the law *is* a probability function ($P=0.99$), it logically licenses inferences about batches. The law itself entails that in 100 independent trials, the probability of exactly 99 emissions is given by the binomial distribution. The law *explains* the batch frequency.
  *   **Armstrongian:** If the law is merely "Heating usually necessitates Emission" (or if there is no law), the rate of success in a batch of 100 is a separate brute fact. The "probabilistic necessitation" in the single case does not logically guarantee the stability of the frequency in the batch (the "Large Number Problem"). For the Armstrongian, the fact that the batch frequency matches the single-case probability is a happy coincidence, not a consequence derived from the law.

  ***

  ### Honest Notes

  **1. Which single feature is doing the work?**
  The **ontological brute chance in single cases without a categorical ground**.
  Lewis is happy to let laws supervene on the global pattern of the mosaic. If the mosaic has a stable statistical pattern, the Best System captures it as a probabilistic law. Armstrong requires a local "glue" (the relation between universals) to hold in the individual case. If the glue doesn't guarantee the effect (because of the 1% failure), it looks like the glue isn't actually doing any necessitating. The pressure comes from the demand that laws be *exceptionless relations* vs. the reality of *exceptional events*.

  **2. What happens if that feature is removed?**
  If the 1% failures were governed by a further condition (e.g., "A & C $\to$ B, but A & ~C $\to$ ~B"), the gap vanishes.
  *   **Armstrong:** Can posit a strict law $N(A \& C, B)$. The exceptions are explained away by the absence of C.
  *   **Lewis:** The Best System updates to include C.
  Both theories recover a deterministic, exceptionless law. The pressure on Armstrong only exists because we stipulated the failures are *ungrounded*.

  **3. The Armstrongian's Best Objection**
  **Objection:** "You are attacking a straw man. Armstrong explicitly developed a theory of **Probabilistic Laws** (*What is a Law of Nature?*, Ch. 9). He argues that universals can enter into a relation of 'probabilistic necessitation' ($N_p$). This is a primitive, irreducible relation that confers a propensity on the particular. I don't need exceptionless certainty; I need a truthmaker for the propensity, which $N_p$ provides."

  **Does it survive?**
  Barely. The objection survives only by positing a metaphysical primitive that is difficult to distinguish from the Humean frequency it is supposed to ground.
  *   **The Counter:** If $N_p$ is truly distinct from the frequency, why do the frequencies always match the propensity (as stipulated in the scenario)? For the Lewisian, the law *is* the summary of the frequency, so they match by definition. For the Armstrongian, it is a cosmic coincidence that the primitive relation $N_p$ yields exactly 99% over the long run. The Lewisian explains the stability of the frequency; the Armstrongian must posit it as a further brute fact. Thus, even with probabilistic universals, the Humean retains the explanatory advantage regarding long-run stability.
