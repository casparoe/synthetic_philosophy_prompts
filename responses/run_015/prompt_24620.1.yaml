      *   *Actually, looking at the prompt:* "either it has to say there's no law at all here... or it can at best offer a ceteris paribus universal." I should stick to this framing. I will present the strict Armstrongian view (laws are necessitation) as the primary target, as that's where the pressure is highest.
      *   *Substantive Disagreement:* Make sure to emphasize the *inference* to compound events. For Lewis, the law *generates* the binomial distribution. For Armstrong, if the law is just "A usually B", the binomial distribution is a separate brute fact unless the probabilistic law is robust.

  10. **Final Review against constraints:**
      *   Scenario: 2 paragraphs? Keep it tight.
      *   No QM? Explicitly stated.
      *   Scientist success fixed? Mentioned.
      *   Honest notes included? Yes.

