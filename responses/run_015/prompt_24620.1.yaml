      *   **Scenario Constraints:** Classical/non-quantum system (material, chemical, biological), strong statistical regularity (99% $A \to B$), 1% failures are *genuinely random* (no hidden variables, no correlations), stable rate.
      *   **Theoretical Requirements:**
          1.  Lewisian BSA must identify $P(B|A) = 0.99$ as a law (show simplicity/strength trade-off).
          2.  Armstrongian Universals must fail (either no law or weak ceteris paribus law).
          3.  Show substantive disagreement (Lewisian licenses compound probability inferences; Armstrongian treats them as brute).
          4.  Keep scenario short (couple of paragraphs).
          5.  Keep scientist's success fixed (metaphysics, not epistemology/pragmatics).
      *   **Post-Scenario Analysis:** Walk through verdicts, identify the "work-doing" feature, analyze what happens if that feature is removed, and present the best objection from the losing side.

  2.  **Drafting the Scenario:**
      *   *Idea:* Needs to be classical but indeterministic. Since true classical indeterminism is physically dubious (usually implies hidden variables or chaos), I need to *stipulate* the metaphysics of the world in the thought experiment. The prompt asks me to "Stipulate the base facts fully so there's no hidden variable."
      *   *Subject:* A chemical catalyst or a biological mutation? Let's go with a specific chemical interaction. It feels more "law-like."
      *   *Setup:* "Xenon-Flux Crystals." When heated to 100°C (Event A), they emit a blue photon (Event B).
      *   *Stats:* 99% of the time they do. 1% they don't (emit nothing).
      *   *Crucial Stipulation:* The failures are *ontologically brute*. No micro-structural difference, no external interference. It just happens.
      *   *Drafting text:* Keep it tight. Focus on the metaphysical stipulation of brute chance in a classical setting.

  3.  **Analyzing the Lewisian (Humean) Verdict:**
      *   *Basis:* The Humean Mosaic (the total history of particular matters of fact).
      *   *System:* We need axioms that summarize the mosaic.
      *   *Option 1 (Deterministic):* "All A are B." False. Not a candidate (Laws must be true).
      *   *Option 2 (List):* List every single occurrence. True, but infinitely long/complex. Terrible simplicity.
      *   *Option 3 (Probabilistic):* "P(B|A) = 0.99." True (fits the frequencies). Very simple. Very strong (predicts frequencies in large samples).
      *   *Conclusion:* Wins the Best System contest. It is a law.

  4.  **Analyzing the Armstrongian (Anti-Humean) Verdict:**
      *   *Basis:* Relations between Universals ($N(F, G)$ necessitates $G$ given $F$).
      *   *Problem:* Necessitation is usually taken to be exceptionless. If $N(A-ness, B-ness)$ holds, then *every* A must be B.
      *   *The 1%:* Since some A's are not B, $N(A, B)$ cannot hold strictly.
      *   *Option 1:* No law. Just a brute regularity. (Undermines the intuition that there *is* a physical law here).
      *   *Option 2:* Probabilistic Necessitation ($N_p(A, B)$). Armstrong tried this later, but it's notoriously difficult to define without reducing to Humean frequencies. If $N_p$ doesn't *guarantee* the outcome, what does it add over the mosaic?
      *   *Strict Interpretation:* Traditional DTA says laws are exceptionless. So, strictly speaking, there is no law here, or the law is disjunctive/complex (A & C -> B), but we stipulated no C exists.
      *   *Conclusion:* Struggles to account for the *modal force* of the probability. It looks like a brute regularity.

  5.  **Analyzing the Substantive Disagreement:**
      *   *Compound Events:* What is the chance of 9/10 successes?
      *   *Lewisian:* The law *is* a probability function. It licenses the Bernoulli calculation ($0.99^9 \times 0.01 \times 10$). This is derived from the law itself.
      *   *Armstrongian:* If there's no law (or just a weak regularity), the rate of 9/10 successes in a batch is just another brute fact about the mosaic. There's no *necessitation* connecting the single-case propensity to the batch frequency.
      *   *Note:* I need to be careful here. Armstrong did try to accommodate probabilistic laws. I need to focus on why the *classical brute chance* stipulation hurts him more than Lewis. The key is the lack of a truthmaker for the probability *in the individual case* that isn't just the frequency itself.

  6.  **Identifying the "Work-Doing" Feature:**
      *   It's the **ontological brute chance in a single case without a categorical ground**.
      *   Lewis is happy to supervene on the pattern.
      *   Armstrong needs a relation between universals. If the relation doesn't necessitate the effect, what *is* the relation? If it's defined by the frequency, it collapses into Humeanism.
      *   *Removal:* If the 1% had a hidden cause (C), then Armstrong says "Law is A&C -> B". Lewis also updates the Best System. The gap closes.

  7.  **The Armstrongian Defense (Objection):**
      *   Armstrong (in *What is a Law of Nature?*) actually addresses this. He introduces "probabilistic necessitation."
      *   *Objection:* "You're attacking a straw man. I allow $N_p(F, G)$. The universal relation itself has a propensity."
      *   *Counter-Counter:* Does this survive? The critique is that without Humean frequencies to ground it, $N_p$ is mysterious. But in the context of the thought experiment, the main attack is that it fails to explain *why* the frequencies match the probability (the "Large Number Problem"). Lewis explains it via the Best System fitting the data. Armstrong posits a magic relation that *usually* works.
      *   *Refinement:* The prompt asks for the *best* objection. The best objection is that Armstrong *can* posit probabilistic universals, so he doesn't have to say "no law." The weakness is explaining what that universal *is* if not the frequency.

  8.  **Refining the Output:**
      *   Check constraints: Classical? Yes (stipulated). 99%? Yes. No QM? Yes. Scientist success fixed? Yes.
      *   Structure: Scenario -> Lewis Verdict -> Armstrong Verdict -> Substantive Difference -> Honest Notes (Feature, Removal, Objection).

  9.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is "classical indeterminism" coherent?
      *   *Fix:* Acknowledge it's a thought experiment stipulation. The prompt asks me to "Stipulate the base facts fully." I will lean into that.
      *   *Critique:* Armstrong *did* advocate for probabilistic laws.
