answer: |-
  **Elena:** The Baseline Survey isn't just a web of belief with sticky nodes. When a measurement conflicts with a charter sentence, the community doesn't weigh costs; they treat the measurement as *defective*. That's not entrenchment; it's constitutive rule-following. The charter fixes the meaning of the target kind.

  **Marcus:** You're conflating immunity with analyticity. The Survey protects those sentences because revising them triggers catastrophic downstream disruption across instrumentation, training, and data archives. That's a pragmatic cost function, not a semantic boundary. The "defective" label is a shield against revision costs, not a marker of truth-in-virtue-of-meaning.

  **Elena:** But the justification they offer isn't pragmatic. They say, "That's not what we mean by *target kind*." If I deny the charter, I'm not making a false claim; I'm speaking nonsense within the framework.

  **Marcus:** Conventions don't confer truth, Elena. They confer utility. When you say "nonsense," you mean "unusable for our purposes." The holist explains the immunity without positing a mysterious semantic property. The sentence is central, not analytic. "Changing the subject" is just the dramatic name we give to shifting a node so central that the network's topology changes.

  **Elena:** I'll concede the epistemological role. We can't use analyticity to guarantee certainty or reduce metaphysics to logic. The boundary is fuzzy; charter sentences can drift over decades. But there's still an asymmetry. When they drop a synthetic claim, they cite evidence. When they drop a charter, they cite *convenience* or *redefinition*. The mode of revision differs.

  **Marcus:** The mode differs because the consequences differ, not the status. But let's press your asymmetry. Suppose two charter sentences, C1 and C2, introduced by the same stipulation, equally entrenched, entail contradictory predictions in a newly opened region. They can't both hold. One must break.

  **Elena:** Then the framework is inconsistent. They must choose.

  **Marcus:** On what basis? If C1 and C2 are analytic, they're true by meaning. Contradiction implies meaning failure. Do they discover which was "really" analytic?

  **Elena:** No. They decide. They amend the charter.

  **Marcus:** Exactly. If the decision is arbitrary—or based on pragmatic fit—then the "truth" of the charter was never semantic. It was provisional. You've described a legislative act, not a discovery of meaning-constituted truth.

  **Elena:** I'll grant this: in the conflict case, the distinction collapses into decisionism. But that doesn't erase the distinction in stable cases. It shows analyticity is a status we *assign* to stabilize inquiry, not a metaphysical bedrock. It retains a modest semantic role: tracking which claims are held true as a matter of linguistic policy rather than empirical fit.

  **Marcus:** But if it's a policy subject to revision when contradictions arise, it's indistinguishable from extreme entrenchment. You've saved the distinction by emptying it of its traditional explanatory power. You have a sociological fact about sentence treatment, not a philosophical distinction about truth bearers.

  **Elena:** Perhaps. But knowing *why* they treat it that way matters. If they treat it as a rule, not a fact, that shapes how they argue.

  **Marcus:** It shapes the rhetoric, not the ontology. And in the conflict case, even the rhetoric fails. They argue pragmatics, not meanings.

  **Elena:** Then we agree on the conflict, but not the常态 (normalcy). In normal cases, the asymmetry holds.

  **Marcus:** In normal cases, everything holds until it doesn't. The Survey is just a slow-moving web.

  ***

  **Closing Note**

  Elena's strongest point is the asymmetry in *justification* (evidence vs. redefinition), preserving a modest, non-metaphysical semantic role. Marcus's strongest point is that conventions cannot generate truth and that the conflict case reveals the underlying pragmatism of any revision. The dialogue turns on whether Quine targeted the *semantic notion* itself (which Elena retains modestly) or only its *explanatory work* in grounding necessity (which Marcus successfully undermines). If Quine's target was the latter, Elena survives; if the former, Marcus wins.
