      *   *Functionalist View:* If it walks like a duck and quacks like a duck, it's a duck. If the system reports "I am still me," and behaves identically, denying consciousness is solipsistic.
      *   *Substrate View:* Maybe silicon can't feel. But if replaced one by one, does consciousness fade gradually? (Chalmers' "Fading Qualia" argument). If it fades, behavior would likely change (since the subject would report changes). If behavior doesn't change, consciousness likely didn't fade.
