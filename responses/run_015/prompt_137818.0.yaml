answer: |-
  On the I-95 merge at 5:00 PM.

  Brake lights bloom in a stop-start **pattern**,
  Rubber bound to the **physical**.
  No hand drew this **design**.
  Drivers **intend** to leave.
  Maps **compress** the miles.
  Horns add **noise**.

  Static rises, pure **noise**,
  Until you see the **pattern**.
  Data will **compress**
  Into the **physical**.
  Metal does not **intend**,
  Yet the merge has **design**.

  Who claims the **design**?
  Silence cuts the **noise**.
  The jam seems to **intend**
  To hold a shape, a **pattern**.
  Mass is **physical**.
  Words **compress** the scene.

  Can math **compress**
  Better than the **design**?
  Is the engine **physical**
  Or just background **noise**?
  Is the delay a **pattern**?
  Do the drivers **intend**?

  If we **intend**
  To **compress** the gap,
  Is the honking **noise**?
  Or functional **design**?
  Friction is **physical**.
  Flow is a **pattern**.

  Two stories, one **pattern**.
  Both **intend** to fit.
  The road is **physical**.
  Neither can **compress**
  More than the other's **noise**.
  Both claim **design**.

  The steel remains **physical**, maps **compress**.
  We **intend** meaning where there is no **design**.
  One man's **pattern** is another's **noise**.

  ***

  **Note**

  The poem relies on the settled apparatus of Dennett's view: the definitions of the three stances and the criterion that a pattern is real if it supports compression and prediction. However, it stages a live dispute regarding the ontological status of those patterns. Dennett argues that real patterns secure a robust, albeit non-reductive, realism about intentionality; the poem hints at the instrumentalist counter-reading, suggesting we might merely be projecting meaning ("where there is no design"). Furthermore, while the compressibility test is presented as the arbiter of reality, philosophers debate whether compression is stance-relative. If two stances compress the data equally well but imply incompatible ontologies—as with the traffic's "intent" versus its "flow"—the test itself cannot break the tie. The poem leaves this indeterminacy open, whereas Dennett might dissolve it by denying there is a deeper fact of the matter.

  Poetic liberties were taken to fit the form. The sestina requires end-words to function grammatically as nouns or verbs, occasionally forcing "physical" into a nominal role it rarely holds in prose. The target system (traffic) is treated as having no designer, yet the "design stance" is applied to it; this is faithful to Dennett (who applies it to evolution), but the poem sharpens the tension by asking "Who claims the design?" to highlight the lack of an actual agent. Finally, the envoi's claim that one man's pattern is another's noise suggests a relativism about structure that Dennett would resist; for him, if the pattern predicts, it is real, regardless of the stance used to find it.
