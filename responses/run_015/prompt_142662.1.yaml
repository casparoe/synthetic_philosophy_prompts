answer: |-
  These practices collectively presuppose a pragmatic operationalism where administrative utility dictates ontological status. They do not assume Gongsun Long's metaphysical claim that qualifiers alter essence; rather, they treat essence as mutable based on regulatory need. The tariff system assumes material specificity creates new regulatory kinds (functional essentialism). Agricultural subsidies assume biological substance overrides accidental modifiers (substance essentialism). The course catalog assumes modifiers create administrative distinctness regardless of ontological reality (nominalist bureaucracy). Consequently, these practices are mutually inconsistent. They quietly pull in opposite directions: tariffs essentialize differences, subsidies erase them, and catalogs invent them. Their shared ontology is performative: classification constitutes the kind. They strictly presuppose that regulatory consequences define identity; they merely accommodate logical subordination when it reduces paperwork.

  A uniform, strictly extensional classification scheme (where every compound is logically a subset of its simpler terms) would require significant changes. Tariffs would need nested codes rather than distinct headings, forcing inspectors to evaluate subsets dynamically rather than consulting fixed tables. Course catalogs would need to treat specializations as tags within a parent course ID, not parallel tracks, collapsing distinct degree requirements into a single generic module.

  Is this reform sound? Philosophically, yes; it aligns with logical extensionality. Administratively, however, it would be disastrous. Bureaucracies function not by logical truth but by risk management and resource allocation. Treating "leather footwear with synthetic soles" merely as a subset of "leather footwear" obscures supply chain risks requiring distinct inspection. Treating "Global Justice" as merely a subset of "Political Philosophy" undermines credential specificity required by employers. The School of Names highlighted the friction between language and reality; these bureaucracies resolve that friction by privileging function over logic. To impose strict logical consistency is to misunderstand the purpose of administrative ontology, which is control, not truth. Therefore, while philosophically coherent, such reform is administratively disastrous.
