answer: |-
  # Seminar Design: Staging Rousseau's *Letter to d'Alembert*

  **Time:** 50 Minutes
  **Participants:** 18 Students + 1 Instructor
  **Materials:** 
  *   One large sheet of paper (the "Pledge Sheet") with a sign-up list for a local tenants' advice shift (or similar 30-min civic action).
  *   Two pens.
  *   18 small slips of paper (for emotion ratings).
  *   4 Role Cards (printed or handwritten).
  *   A timer (your phone).

  **Forbidden Words (Until Debrief):** *Catharsis, Sterile Pity, Paradox of the Actor, Mores, Legislator.*

  ---

  ## Part 1: The Actor Experiment (Thesis 2)
  **Time:** 0:00 – 0:10 (10 mins)

  **Setup:** Push tables against the wall. Chairs in a semi-circle. You stand in the center. No introduction to Rousseau.

  **Instructions (1 min):**
  "We are beginning with an experiment in attention. I need one volunteer to read four lines. I will ask you to read them twice, under two different instructions. The rest of you will vote on which reading was more effective."

  **The Text (Provide to Volunteer):**
  > "The key is gone. The lock is changed. 
  > I have stood here one hour. 
  > No one comes. 
  > The night is falling."

  **Round 1: Internal Feeling (3 mins)**
  *   **Instruction to Reader:** "Read this to yourself. Try to actually feel the grief of losing your home. Do not worry about projecting. Focus on your own internal state."
  *   **Action:** Reader performs.
  *   **Vote:** "By show of hands, who was moved?" (Count silently).

  **Round 2: External Effect (3 mins)**
  *   **Instruction to Reader:** "Read it again. This time, do not try to feel the grief. Your goal is to make *us* feel it. Use your voice, your hands, your posture. Manufacture the effect. You are a craftsman producing a sign of pain, not feeling pain."
  *   **Action:** Reader performs.
  *   **Vote:** "By show of hands, who was moved *more* by this second version?" (Count silently).

  **Reader Report (2 mins):**
  Ask the volunteer: "Which was harder to sustain? Did you feel the emotion in the second round, or were you managing us?"
  *   *Note:* Do not interpret this yet. Just record their answer on the board (e.g., "Harder: Round 2" or "Felt: Round 1").

  ---

  ## Part 2: Condition 1 — The Spectacle (Thesis 1)
  **Time:** 0:10 – 0:20 (10 mins)

  **Setup:** Arrange chairs in rows facing a clear "stage" area (an empty space at the front).

  **Roles (Assign quietly via slips of paper before class or whisper):**
  *   **3 Actors:** Given a scenario card.
  *   **14 Spectators:** Given instruction cards.

  **Scenario Card (Actors):**
  "You are a family being evicted. You have your belongings in bags. You are tired. Do not speak. Enact the exhaustion and the loss. Sit on the floor. Hold the bags. Look at the door."
  *(Note: Silence prevents bad dialogue acting; physical misery is easier to convey.)*

  **Instruction Card (Spectators):**
  "You are an audience. You must watch. You are forbidden to speak, intervene, or help. Your only job is to witness. Afterward, you will rate how much pity you felt (1-5) on a slip of paper."

  **The Scene (4 mins):**
  Actors perform their silent eviction. Spectators watch. You enforce the silence strictly.

  **The Opportunity to Act (3 mins):**
  *   **Action:** Bring out the **Pledge Sheet**.
  *   **Script:** "The scene is over. The sheet on the table signs you up for a 30-minute shift at the tenants' advice service. It is optional. You have 60 seconds to sign if you wish to act on what you just saw."
  *   **Measurement:** Count the signatures silently. Collect the sheet. Collect the emotion rating slips (1-5).

  **Reset (3 mins):**
  Clear the floor. Ask actors to rejoin the group. Move chairs into a tight circle (no front/back).

  ---

  ## Part 3: Condition 2 — The Festival (Thesis 3 + The Dissenter)
  **Time:** 0:20 – 0:30 (10 mins)

  **Setup:** Everyone stands in a tight circle. No stage. No front.

  **Roles:**
  *   **17 Participants:** Instruction: "We are going to create a rhythm together. No leaders. When the rhythm locks in, hum a single note together. We are the spectacle to ourselves."
  *   **1 Dissenter (Role Card):** "Your instruction is to **refuse**. Do not clap. Do not hum. Stand slightly outside the circle. Watch the others. Do not explain yourself. Just stand aside."

  **The Activity (5 mins):**
  *   Start a clap. Encourage synchronization.
  *   Once the hum begins, let it sustain for 30 seconds.
  *   *Observation:* Watch the Dissenter. Watch the group's reaction to the Dissenter (glances, breaking rhythm).

  **The Opportunity to Act (3 mins):**
  *   **Action:** Bring out the **Pledge Sheet** again.
  *   **Script:** "The gathering is over. The sheet is here again. If you have not yet signed, you may do so now. If you already signed, do not sign again."
  *   **Measurement:** Count *new* signatures silently. Collect the sheet. Collect emotion rating slips (1-5).

  **Debrief Setup (2 mins):**
  Have everyone sit. Put the Pledge Sheet and the Role Cards on the table in the center.

  ---

  ## Part 4: The Debrief
  **Time:** 0:30 – 0:50 (20 mins)

  **Step 1: The Data (5 mins)**
  Write on the board:
  *   **Actor Round 1 (Feel):** [X] votes moved.
  *   **Actor Round 2 (Show):** [Y] votes moved.
  *   **Spectacle Emotion Avg:** [X]/5. **Sign-ups:** [N].
  *   **Festival Emotion Avg:** [X]/5. **Sign-ups:** [N].

  *Ask:* "Why was the second reading more moving?" (Leads to Thesis 2).
  *Ask:* "Why did the sign-up count differ between Spectacle and Festival?" (Leads to Thesis 1 & 3).
  *Ask the Dissenter:* "What was it like to be the only one not humming?" (Leads to Critique of Thesis 3).

  **Step 2: Mapping the Theses (7 mins)**
  *Now* you may use the forbidden terms.

  1.  **The Paradox of the Actor:** Connect the volunteer's report. Rousseau argues the actor's excellence is technical, not moral. We pay for the *sign* of passion, not the passion itself. This separates representation from truth.
  2.  **The Inversion of Catharsis:** Connect the Spectacle sign-up count. If emotion was high (4 or 5/5) but sign-ups were low, argue Rousseau's point: The theatre discharges pity safely. We cried, so we feel we have *done* something. The emotion is a substitute for action.
  3.  **The Festival & The Dissenter:** Connect the circle. Rousseau wants no spectators, only participants. But ask the Dissenter: "Was there space for you?" Rousseau's festival demands unanimity. The theatre allows you to be alone in the dark; the festival forces you into the light.

  **Step 3: What the Exercise Cannot Do (Instructor Supply) (5 mins)**
  You must explicitly state these points, as the 50-minute room cannot generate them:
  *   **Time:** Rousseau is talking about *mores* formed over generations in a small republic (Geneva), not a 5-minute rhythm exercise. The festival works only if the people already share a deep bond.
  *   **Structure vs. Content:** Rousseau's harm is not that plays are *bad*, but that the *division* of actors and spectators is politically corrosive. It creates a habit of passivity.
  *   **The Dissenter's Safety:** Acknowledge that the theatre protects the individual from the crowd. The festival risks the "tyranny of the General Will."

  **Step 4: Closing (3 mins)**
  Leave the Pledge Sheet on the table as students exit. "The action remains open."

  ---

  ## Failure Modes & Handling

  **1. The Acting is Bad / Nobody Feels Anything**
  *   **Risk:** The Spectacle condition falls flat; emotion ratings are 1/5.
  *   **Handle:** Pivot in debrief. "Rousseau argues that *even if* the play is bad, the structure remains. Did you feel you *could* have acted, even if you weren't moved? The problem is the seat you sat in, not the performance."

  **2. Someone Guesses the Hypothesis**
  *   **Risk:** A student says, "You're trying to prove we won't sign up."
  *   **Handle:** Acknowledge it immediately. "Yes, I am staging this. Rousseau argues that the Legislator *must* stage the environment to shape the citizen. I am acting as the Legislator today. Is my manipulation legitimate if it leads to a true pledge? That is the political question."

  **3. The Pledge Count is Zero (or Too Noisy)**
  *   **Risk:** No one signs up, or the difference between Condition 1 and 2 is negligible.
  *   **Handle:** "Zero proves the point. The gap between feeling and doing is the problem. If the counts were the same, we would ask: Did the festival actually change our capacity to act, or just our mood?"

  **4. Contamination (Condition 1 affects Condition 2)**
  *   **Risk:** Students are tired or cynical by the Festival.
  *   **Handle:** Acknowledge the fatigue. "Rousseau knows this. He argues the theatre exhausts us. If you were too tired to hum, that is the residue of the Spectacle."

  **5. The Manipulation Objection ("You tricked us")**
  *   **Risk:** Students feel resentful about the Dissenter or the pressure.
  *   **Handle:** Turn it into the "Legislator" point (see #2). "Rousseau believes we are shaped by our institutions. I built an institution for 50 minutes. You felt its pressure. The question is: Do we want a politics that acknowledges this shaping, or one that pretends we are free of it?"

  ---

  ## What This Exercise Earns vs. Illustrates

  *   **Earns:** The *feeling* of the gap between emotion and action (Thesis 1). The *experience* of technical acting vs. felt emotion (Thesis 2). The *pressure* of unanimity in the circle (Thesis 3).
  *   **Illustrates:** The historical context of Geneva. The long-term sociological effects of theatre on a population. The philosophical justification for the "General Will."
  *   **Instructor Must Supply:** The connection between the 50-minute experiment and the stability of a Republic. The nuance that Rousseau is not against *all* art, but art that creates dependency. The ethical defense of the Dissenter (which Rousseau largely lacks).

  ## Role Card: The Dissenter (Print this separately)
  > **CONFIDENTIAL**
  > **Role:** The Observer
  > **Instruction:** When the group forms the circle to clap and hum, you must **refuse**. Do not clap. Do not hum. Stand one step outside the circle. Keep your arms at your sides. Watch the others. If someone looks at you, do not look away, but do not speak. 
  > **Goal:** Feel the pressure of the group's unity. Report in the debrief how it felt to be the only one not participating.
