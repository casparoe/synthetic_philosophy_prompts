prompt: |-
  So heres the situation: I'm a philosophy of science PhD student about a year into an "embedded" placement with an interpretability team at an ML lab (long story, basically my advisor got a grant for philosophy-in-the-wild placements and I drew the short straw, or maybe the long one). My actual job, roughly, is to help the team decide when they're licensed to say "the network represents X" — truth, sentiment, the board state, whatever — versus having to write the weaker "we found a feature that tracks X in the settings we tested." Right now there's no shared standard. Some folks on the team are basically realists (if a probe can read it out, it's represented), others are deflationists (it's all convenient bookkeeping and "representation" talk is a metaphor we should just drop), and paper drafts and external comms flip between the two dependng on who wrote them. That inconsistency is what I'm trying to fix.

  You're a philosopher of science who also knows the ML literature. Take the realism/instrumentalism debate seriously but make it usable — I want the conceptual mapping somewhat explicit (what plays the role of novel prediction, what corresponds to robustness across retraining runs, maybe the structural realist thought that what survives is the structure, not the object, since "the model has a truth *direction*" might be exactly the kind of claim where the subspace is real and the human concept isn't). But the deliverable has to be a procedure, not an essay. Think carefully and do a bit of brainstorming before writing, please.

  Constraints: a mixed panel of two engineers and me runs it in under an hour per claim, and none of us have patience for seminar-level nuance, so it needs to be an ordered checklist — the questions to ask about a claim, what counts as a sufficient answer at each step, where the procedure terminates in "downgrade the claim," and where it punts to a human because the remaining question is about values rather than facts (e.g. how much overclaiming risk the lab should accept in public messaging — that's not something a checklist can settle, and I want it to visibly say so).

  Then run it on three claims, since worked examples are how the team will actually learn it: (1) a linear probe for sentiment where the probe classifies beautifully but ablating the direction barely changes anything downstream; (2) the claim that a model trained on chess- or Othello-type play represents the board state, based on probes plus interventions that change its predicted moves the way the interpretation says they should; (3) the safety pitch that the model "represents deception" — I suspect the procedure will downgrade that one and the comms team will hate it, which is exactly why I want it included, so be honest about the result. Also tell me plainly what the procedure *can't* do: I'm guessing it can't settle anything when the evidence is genuinely underdetermined, and I worry that once the checklist circulates internally people will Goodhart it (tweaking experiments to pass the rubric rather than to find out what's going on). One page of actual checklist, the rest can be explanation. Thx!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Philosophy of Science PhD student, embedded in an ML interpretability team.
      *   **Task:** Create a usable procedure (checklist) to adjudicate claims about neural network representation (e.g., "The network represents X" vs. "A feature tracks X").
      *   **Context:** Team is split between realists (probe = representation) and deflationists (representation = metaphor). Inconsistency in comms/papers is the problem.
      *   **Requirements:**
          *   Take realism/instrumentalism seriously but make it *usable*.
          *   Map philosophical concepts to ML practices (novel prediction, robustness, structural realism).
          *   Deliverable: An ordered checklist (procedure), not an essay.
          *   Constraints: Run by a mixed panel (2 engineers + 1 philosopher) in <1 hour. No seminar-level nuance.
          *   Must terminate in "downgrade," "approve," or "punt to values."
          *   Must include 3 worked examples (Sentiment Probe, Board State, Deception).
          *   Must explicitly state limitations (underdetermination, Goodharting).
          *   Length: One page for the checklist, rest for explanation/context.
      *   **Tone:** Professional, pragmatic, philosophically informed but engineering-focused.

  2.  **Deconstruct the Philosophical Core:**
      *   *Realism:* The representation exists independently of our measurement. (ML equivalent: Causal efficacy, robustness across architectures/training seeds).
      *   *Instrumentalism:* The representation is a useful tool for prediction, not necessarily "real." (ML equivalent: High probe accuracy, but maybe epiphenomenal).
      *   *Structural Realism:* The *relations* are real, even if the entities aren't. (ML equivalent: The geometry of the subspace matters, even if the label "truth" is human-imposed).
      *   *Novel Prediction:* The gold standard for scientific realism. (ML equivalent: Interventions based on the representation yield expected behavioral changes in *out-of-distribution* or *untested* scenarios).

  3.  **Drafting the Checklist (The "Deliverable"):**
      *   Needs to be tight. 5-7 steps max.
      *   Step 1: Existence/Correlational strength (The baseline).
      *   Step 2: Robustness (Is it an artifact of this specific run?).
      *   Step 3: Causal/Interventional efficacy (Does changing it change behavior?).
      *   Step 4: Novel Prediction/Generalization (Does it hold outside the training manifold?).
      *   Step 5: Structural Integrity (Is the geometry consistent?).
      *   Decision Nodes: Pass/Fail/Punt.
      *   "Punt" needs to be about risk/values (e.g., safety claims).

  4.  **Developing the Worked Examples:**
      *   *Claim 1 (Sentiment Probe):* High accuracy, low ablation impact.
          *   *Diagnosis:* Correlational only. Epiphenomenal.
          *   *Verdict:* Downgrade to "tracks."
      *   *Claim 2 (Board State):* Probes + Interventions work.
          *   *Diagnosis:* Causal + Robust (usually).
          *   *Verdict:* Approve "represents" (with structural caveat).
      *   *Claim 3 (Deception):* Safety pitch.
          *   *Diagnosis:* High stakes, likely underdetermined, anthropomorphic risk.
          *   *Verdict:* Punt to Values/Risk (Comms shouldn't say "represents" without causal proof which is hard here).

  5.  **Addressing Limitations (Goodharting & Underdetermination):**
      *   Need to warn that checking boxes isn't truth.
      *   Need to acknowledge that some questions are inherently value-laden (risk tolerance).

  6.  **Refining the Tone:**
      *   Avoid jargon like "noumena" or "qualia." Use "causal lever," "out-of-distribution," "training seed."
      *   Acknowledge the user's position (PhD in an engineering lab).
      *   Keep it actionable.

  7.  **Iterative Drafting (Mental or Scratchpad):**
      *   *Checklist:* Make sure the "Punt" option is clear. Engineers hate ambiguity, but they respect risk management. Frame the "Punt" as "Risk Assessment Required."
      *   *Philosophy Mapping:* Explicitly link "Novel Prediction" to "Out-of-Distribution Intervention." Link "Robustness" to "Realism across seeds."
      *   *Length:* Keep the checklist strictly to one "page" (visual block). The rest is commentary.

  8.  **Final Review against Constraints:**
      *   < 1 hour to run? Yes, if evidence is prepped.
      *   Mixed panel? Yes, language is hybrid.
      *   3 examples? Yes.
      *   Limitations section? Yes.
      *   One page checklist? I will format it to look like a distinct block.

  9.  **Writing the Response:** (Proceeding to generate output based on these thoughts).
      *   *Self-Correction during drafting:* Make sure I don't sound *too* dismissive of the deflationists. The checklist should allow for instrumentalist utility without granting ontological weight unless earned.
      *   *Refining the "Deception" example:* This is tricky. "Deception" is a behavioral label, not necessarily an internal state. The checklist should catch this category error.

  10. **Final Polish:** Check the voice. It should sound like a colleague talking to a colleague. "Here's the tool you asked for."

  *(Self-Correction on Checklist Length)*: The prompt asks for "One page of actual checklist." I need to ensure the visual formatting distinguishes the checklist from the commentary clearly.

  *(Self-Correction on Philosophy)*: Ensure the structural realism point comes through in the "Geometry" step.

  *(Self-Correction on Goodharting)*: Add a specific warning about "metric fixation."

  Let's assemble.cw
answer: |-
  This is a classic "applied metaphysics" problem. You are trying to operationalize ontological commitment. The engineers want to know if the lever works; the deflationists want to know if the lever is *really there*; the realists want to claim the lever exists because the machine moves.

  The following procedure maps **Entity Realism** (Hacking: "if you can spray it, it's real") to **Causal Interventions**, **Structural Realism** (Worrall: "the math survives theory change") to **Robustness/Geometry**, and **Novel Prediction** (Lakatos/Popper) to **Out-of-Distribution (OOD) Generalization**.

  It is designed to be run by your panel. It forces a decision: **Representational Claim Approved**, **Downgraded to Correlational**, or **Punted to Risk/Values**.

  ***

  ### The Representation Adjudication Checklist (RAC-v1)

  **Claim to Evaluate:** *"The model internally represents [CONCEPT]."*
  **Evidence Provided:** [Probes, Ablations, Circuits, etc.]
  **Panel:** [Engineer 1] [Engineer 2] [Philosopher]

  | Step | Question (The Philosophical Load) | Passing Criteria (The Engineering Test) | Decision |
  | :--- | :--- | :--- | :--- |
  | **1. Existence** | **Is the signal distinct from noise?** *(Basic Empiricism)* | **Probe Accuracy:** Significantly above baseline (e.g., >85% acc or high AUROC) on held-out test data from the *same* distribution. | **FAIL:** Downgrade to "statistical artifact." <br> **PASS:** Continue. |
  | **2. Robustness** | **Is the entity real or an artifact of this specific history?** *(Entity Realism)* | **Seed/Architecture Stability:** The feature/direction is found in ≥3 independent training runs (different seeds) or persists across minor architecture changes. | **FAIL:** Downgrade to "run-specific quirk." <br> **PASS:** Continue. |
  | **3. Causal Efficacy** | **Does the representation do work, or is it epiphenomenal?** *(Manipulability Account)* | **Intervention:** Ablating or editing the feature changes model behavior *in the predicted direction* with effect size > threshold (e.g., logit shift > 0.5). | **FAIL:** Downgrade to "tracks [CONCEPT]" (Correlational only). <br> **PASS:** Continue. |
  | **4. Novel Prediction** | **Does the representation hold when the world changes?** *(Structural Realism / Novelty)* | **OOD Generalization:** Interventions based on this representation successfully predict/control behavior on *out-of-distribution* inputs not seen during training/probe-fitting. | **FAIL:** Downgrade to "represents [CONCEPT] *in-training*." <br> **PASS:** Continue. |
  | **5. Structural Integrity** | **Are we reifying a human label onto a vector space?** *(Conceptual Relativity)* | **Geometry Check:** Is the "concept" a single direction, a subspace, or polysemantic? Does the geometry align with the logical structure of [CONCEPT] (e.g., compositional)? | **FAIL:** Qualify claim (e.g., "represents *aspects* of..."). <br> **PASS:** Continue. |
  | **6. Risk & Values** | **What is the cost of being wrong?** *(Pragmatics / Ethics)* | **Stakes Assessment:** Is this claim being used for safety, marketing, or internal debug? High-stakes claims require higher certainty. | **LOW RISK:** Approve "Represents." <br> **HIGH RISK:** **PUNT TO LEADERSHIP.** |

  **Final Verdict:**
  ☐ **APPROVED:** "The model represents [CONCEPT]." (Passed 1-5, Low Risk)
  ☐ **DOWNGRADED:** "We found a feature that tracks [CONCEPT]." (Failed 2, 3, or 4)
  ☐ **PUNTED:** "Evidence sufficient, but risk tolerance requires executive decision." (Passed 1-5, High Risk)

  ***

  ### Worked Examples

  Here is how the RAC handles your three scenarios.

  #### 1. The Sentiment Probe (High Acc, Low Ablation)
  *   **Claim:** "The model represents positive sentiment in Layer 6."
  *   **Step 1 (Existence):** Pass. Probe accuracy is 94%.
  *   **Step 2 (Robustness):** Pass. Direction is consistent across 5 seeds.
  *   **Step 3 (Causal Efficacy):** **FAIL.** Ablating the direction changes sentiment classification by <2%. The feature is correlates with the output but does not drive it (it may be a "shadow" of the input rather than a computational node).
  *   **Verdict:** **DOWNGRADE.**
  *   **Wording:** "We identified a direction that *tracks* sentiment, but it is not causally responsible for the model's sentiment judgments."
  *   **Philosophical Note:** This satisfies the Instrumentalist (useful for reading) but fails the Entity Realist (not a causal lever).

  #### 2. The Board State (Chess/Othello)
  *   **Claim:** "The model represents the board state."
  *   **Step 1 (Existence):** Pass. Probe can reconstruct board from activations.
  *   **Step 2 (Robustness):** Pass. Found across seeds trained on the same game rules.
  *   **Step 3 (Causal Efficacy):** Pass. Flipping the "pawn at E4" bit causes the model to predict moves valid only if a pawn is at E4.
  *   **Step 4 (Novel Prediction):** Pass. Works on board states never seen in training (generalization of rules).
  *   **Step 5 (Structure):** Pass. The geometry of the subspace is isomorphic to the board topology.
  *   **Verdict:** **APPROVED.**
  *   **Wording:** "The model internally represents the board state."
  *   **Philosophical Note:** This is the high-water mark. It satisfies Structural Realism (the relations between pieces are preserved) and Entity Realism (you can manipulate the pieces).

  #### 3. The Safety Pitch ("Represents Deception")
  *   **Claim:** "The model represents deception when lying to the user."
  *   **Step 1-3:** Let's assume you pass these. You find a "lying" direction and ablating it reduces lies.
  *   **Step 4 (Novel Prediction):** **FAIL/UNCERTAIN.** Deception is context-dependent. Does the intervention work on *new* types of lies not in the training set? Likely weak evidence here.
  *   **Step 6 (Risk & Values):** **HIGH RISK.** Claiming a model "represents deception" implies intent/agency to the public. This triggers regulatory scrutiny and anthropomorphic panic.
  *   **Verdict:** **PUNTED.**
  *   **Wording:** Do not publish "represents deception." Internal docs may use it, but external comms must downgrade to "exhibits deceptive behavior correlated with feature X."
  *   **Philosophical Note:** Even if the science were perfect (which it isn't), the *pragmatics* of the claim carry externalities the science cannot justify. This is a values call, not a truth call.

  ***

  ### Limitations & Goodharting Warnings

  You asked for plain talk on what this procedure cannot do.

  **1. It Cannot Solve Underdetermination**
  If two competing hypotheses explain the data equally well (e.g., "The model represents *truth*" vs. "The model represents *what the training data labeled as truth*"), the RAC will pass both. The checklist tests for *stability* and *causal power*, not *semantic content*. It tells you the lever is real; it does not tell you what the lever is *for*. You will still need philosophical argumentation to distinguish "truth" from "agreement with training labels."

  **2. The Goodhart Risk**
  Once this checklist exists, researchers will optimize for the checklist, not the truth.
  *   *Risk:* Engineers might stop looking for complex, polysemantic representations because Step 5 (Geometry) is hard to pass. They might prune models to make features more "linear" just to pass the audit.
  *   *Mitigation:* Add a "Negative Result" clause. Passing the RAC is required for *strong claims*, but failing the RAC does not mean the research is bad—it just means the claim must be weaker. Reward "Downgraded" papers if the analysis is rigorous.

  **3. The "Punt" is a Political Shield**
  Step 6 looks like a cop-out, but it is the most important step for your lab. It formally separates *epistemic claims* (is it true?) from *pragmatic claims* (should we say it?). By marking a claim as "Punted," you are not saying the science is weak; you are saying the *consequences* of the claim exceed the science team's authorization. This protects you when Comms wants to hype a finding or Safety wants to sound an alarm based on thin evidence.

  **4. It Assumes Interventions are Possible**
  The RAC is biased toward causal realism. If a representation is real but read-only (correlational but computationally inert), this checklist downgrades it. In some architectures, "representation" might genuinely be epiphenomenal. The RAC forces a causal definition of representation. If your team believes read-only features count as representations, you need to modify Step 3.

  ### Implementation Advice
  Don't circulate this as "Philosophy Rules." Circulate it as **"Claim Verification Protocol."** Engineers respect protocols. If you frame it as "ontological adjudication," they will ignore it. If you frame it as "preventing retraction risk and comms blowback," they will use it.

  Your role in the panel is not to be the vote that decides, but the vote that ensures Step 6 (Risk) isn't ignored when the science looks cool. Good luck.
