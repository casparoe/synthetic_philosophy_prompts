answer: |-
  ### The Case for Stage-Indexed Concern

  To derive Stage-Indexed Concern (SIC) from Stream Reductionism (SR), we must bridge the metaphysical claim about the nature of persons to the normative claim about the distribution of moral weight. The argument proceeds in three steps: the localization of value, the arbitrariness of causal boundaries, and the collapse of rational egoism.

  **1. The Localization of Value**
  Suffering and welfare are phenomenological events. They occur in the present moment of experience. A "stream" or a "life" is a narrative construct imposed upon a sequence of these moments; it is not itself a locus of sensation. A stream cannot suffer; only a stage can. If we accept SR, we accept that there is no enduring subject *having* the experiences, only the experiences themselves occurring in a causal chain. Therefore, the fundamental unit of moral value must be the experiential stage. To aggregate suffering over a "life" is a heuristic shorthand for summing the suffering of the stages constituting that life. If the shorthand conflicts with the sum—if preserving the narrative continuity of the stream requires intensifying the suffering of its constituent stages—the heuristic must be discarded in favor of the fundamental unit.

  **2. The Arbitrariness of Causal Boundaries**
  SR posits that there is no deep further fact distinguishing "my" stream from "yours," only facts about causal and phenomenological continuity (Relation R). Relation R holds to varying degrees. It is strong between me-now and me-tomorrow, weaker between me-now and me-in-eighty-years, and arguably non-existent between me-now and you-now. However, under SR, the drop in Relation R across time within a stream is of the same *kind* as the drop in Relation R across persons. There is no metaphysical chasm between "psychological continuity within a stream" and "causal influence between streams."

  If moral weight depended on the depth of selfhood, the absence of a deep self (per SR) would annihilate moral weight entirely. Since we assume suffering matters, its mattering cannot depend on selfhood. Consequently, the boundary of the stream is morally arbitrary. To privilege stages causally linked to *this* present stage over stages causally linked to *that* present stage is to privilege a specific pattern of causal connection without a justifying metaphysical substrate. It is a form of bias analogous to racism or nationalism: drawing a circle around a cluster of stages and declaring them "special" despite the lack of a deep fact grounding that specialness.

  **3. The Collapse of Rational Egoism**
  Standard rationality dictates special concern for one's own future. This relies on the assumption that the future experiencer *is* me in a way that others are not. SR denies this. Under SR, the relation between me-now and a future stage in my stream is one of causal dependence and memory linkage. The relation between me-now and a future stage in another stream is also one of causal dependence (albeit often weaker) and potential empathy.

  If the only difference is the degree of causal connectivity, then concern should scale with connectivity, not snap at the boundary of the stream. But since connectivity fades over time even within a stream, the "self-interest" of a stream is already a aggregation of concern for distinct stages. If we are already aggregating across stages within a stream, consistency demands we aggregate across all stages accessible to our causal influence.

  Therefore, the project of "my liberation" is incoherent under strict SIC. Liberation is the cessation of suffering in stages. If I work to cease suffering in stages causally linked to this present moment (my stream) while ignoring stages where I could prevent greater suffering (other streams), I am acting irrationally. The only coherent goal is the minimization of suffering in the totality of stages. If pulling a lever saves a billion stages in other streams at the cost of my stream continuing to suffer for another decade, SIC mandates pulling the lever. The "practitioner's career" is merely a subset of stages; optimizing for the subset rather than the set is an error in moral mathematics.

  ***

  ### Response to Objections

  #### 1. The Agential-Index Objection
  **The Objection:** Even if metaphysics dissolves the self, agency is indexed. I have non-inferential access only to this stream's pain and can initiate action only through this stream's body. A normative theory that ignores the "locus of agency" is action-guiding only from a God's-eye view, which no human occupies. Therefore, stream-relative weighting must return as a pragmatic constraint on deliberation.

  **The Response:** This objection conflates the *locus of control* with the *locus of value*. SR and SIC can fully grant that agency is locally indexed without conceding that concern must be locally bounded.

  The fact that I act *here* does not entail that I should act *for here*. Consider a firefighter entering a burning building. Their agency is indexed to their own body—they must breathe, walk, and carry hoses using their own limbs. However, the *rationale* for their action is not the safety of their own body, but the safety of the occupants. They use their local agency as a delivery mechanism for global concern.

  Under SIC, the "stream" is reclassified from a *beneficiary* to a *vehicle*. The fact that I know this stream's pain non-inferentially is an epistemic privilege, not a normative one. It explains why I react *faster* to local suffering, but not why I should care *more* about it. A fully realized agent who internalizes SR would treat their own stream as a resource to be expended for the reduction of total suffering.

  The objection claims normative doctrines must be deliberatable by agents. SIC is deliberatable: the agent asks, "Which action, available to this locus of control, minimizes total stage-suffering?" The agent's own future suffering enters the equation as one cluster of stages among many. It may often be the case that preserving the agent's stream is instrumentally useful (a dead helper helps no one), but this is a contingent empirical calculation, not a structural constraint of rationality. The Agential-Index Objection mistakes a limitation of *physics* (I cannot move your body directly) for a limitation of *ethics* (I should not value your pain). SIC accommodates the physical limitation while rejecting the ethical one.

  #### 2. The Tractability Objection
  **The Objection:** If the unit of concern is the momentary stage, the number of stages is vast, potentially infinite. Aggregating expected suffering over an indefinite future leads to non-convergence or allows low-probability, high-impact scenarios (Pascal's Mugging) to dominate decision-making. Stream-relative concern is naturally bounded (a life ends), making calculation possible. SIC renders action impossible because the calculus never closes.

  **The Response:** This objection attacks a straw man of SIC as requiring literal, omniscient summation. SIC is a principle of *valuation*, not an algorithm for *computation*. We do not need to count every stage to know that all stages count equally.

  First, regarding **convergence**: The worry about an indefinitely large future applies to any consequentialist framework that values the future, not specifically to SIC. Stream-reductionism does not create new future stages; it merely denies that the stages linked to "me" have a multiplier effect. If the future is too vast to calculate for SIC, it is too vast to calculate for stream-egoism as well (since my stream's actions affect the vast future). SIC does not worsen the tractability problem; it merely removes the bias that allowed us to ignore it previously.

  Second, regarding **Pascal's Mugging** (astronomically improbable outcomes dominating): SIC actually offers a tool to resolve this better than stream-egoism. In stream-egoism, we discount future stages based on *identity uncertainty* ("Will that be me?"). Under SR, identity is rejected. Instead, we discount based on *causal uncertainty*. As time progresses, the causal continuity (Relation R) between this stage and future stages weakens. We can apply a discount rate based on the probability of causal influence and the fidelity of psychological continuity.

  This creates a natural bound without invoking a "self." Stages that are causally disconnected or extremely improbable do not enter the calculation with significant weight, not because they are "not me," but because my ability to affect them is negligible. This preserves the boundedness required for tractability. The stream-relative view artificially inflates the weight of stages simply because they fall within a biological lifespan, even if causal connectivity is low (e.g., severe dementia). SIC allows us to discount those stages appropriately based on the actual phenomenological capacity for suffering, leading to a *more* accurate, not less tractable, model of welfare.

  Thus, SIC remains action-guiding. It directs the agent to use heuristics (like "protect this body") only insofar as those heuristics reliably track the reduction of total suffering. When the heuristic diverges from the goal (e.g., sacrificing the body saves many more stages), SIC provides the corrective instruction that stream-egoism structurally forbids.
