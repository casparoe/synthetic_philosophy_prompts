prompt: |-
  I am a doctoral candidate in philosophy writing a chapter on weakness of will, and I share a reading group with two behavioral economists. One of them put an argument to me some weeks ago that I have not managed to get out of, and what I want from you is a diagnosis of the argument rather than a survey of positions.

  Start from the standard definition: an agent acts akratically at t only if she acts freely and intentionally against her own all-things-considered better judgment about what she ought to do at t. The argument, as he gave it:

  (1) An agent's all-things-considered judgment at t ranks option A above option B just in case her preference ordering at t ranks A above B. There is no daylight between what she judges best at a time and what she prefers at that time for judgment to slip into.
  (2) Intentional action at t follows the agent's preference ordering at t: if at t she prefers A to B, believes herself able to A, and is not blocked, she A-s.
  (3) For an agent with a hyperbolic — or quasi-hyperbolic, beta–delta — discount function, the ordering over a smaller-sooner option s and a larger-later option l is time-indexed: l is ranked above s while both are temporally distant, and s is ranked above l once s becomes imminent.
  (4) So at every time t such an agent does what she judges best at t. No sooner does the ordering reverse than the judgment reverses with it, and the action follows both.
  (5) Akrasia requires acting against one's better judgment, and by (4) that never happens. So no agent with a hyperbolic discount function ever acts akratically in virtue of the reversal. The stock case — the dieter who eats the cake — is not a case of acting against better judgment at all, and the discounting model, precisely insofar as it successfully predicts the reversal, fails to generate the phenomenon it was introduced to explain.
  (6) Nothing in (1), (2) or (4) depends on the shape of the discount function. Generalize, and no intentional action is ever akratic; continence becomes trivially universal rather than an achievement, and the effortful, variable, sometimes exhausting character of self-control becomes unintelligible.

  He takes (6) as a reductio of the orthodox picture and concludes that we should stop treating continence and incontinence as a distinction in the agent's will and treat it as a distinction in her circumstances. I cannot accept that, and I also cannot find the step.

  Three wrinkle cases I have tried on him, which seem to me to make the problem worse rather than better.

  First, the clear-eyed dieter. Suppose that at t her discount function has reversed, so her preference ranks s above l, but she also sincerely and reflectively judges at t that l is what she should do, and says so while reaching for the cake. If this counts as akrasia, then (1) is false and judgment and preference can come apart at a time. But then I do not know what work hyperbolic discounting is doing: either the preference reversal is the whole story, in which case clear-eyed akrasia is impossible and my case is misdescribed, or the reversal is not the whole story, in which case the model under-determines the phenomenon.

  Second, the sophisticated agent who pre-commits. If (4) is right, then at t she cannot act otherwise than her t-indexed ordering dictates, so resisting temptation without a commitment device is impossible; yet people plainly do resist without one. This makes me want to reject (2) rather than (1), and to allow that an agent can act against her present preference ordering. But then I owe an account of how such an action is explained and caused at all, and I have the familiar worry that contra-motivational action starts to look like a lucky spasm rather than something she does.

  Third, an agent with the reverse profile: impatient at a distance, patient up close, so that she defers a readily available good while judging at t that she should take it, and then judges at the later time that she should have taken it. If akrasia is symmetric — if it should be possible to act against one's judgment in either direction — then a model that generates only one direction of reversal cannot be the whole account of failures of self-governance.

  So: which step do you reject, and what does rejecting it cost? Please tell me why the step I should reject looked compelling in the first place, and price the alternatives rather than just listing them. Two specific things I would like addressed. If I keep (2), is the right move to reject (1) and reconceive better judgment so that it is indexed to the agent as a temporally extended entity rather than to a time-slice — and if so, what fixes which slice's judgment is authoritative for her, and does the notion of a better judgment survive once every candidate slice is admitted to be her? Alternatively, should I give up the standard definition and reconceive akrasia in terms of self-governance, practical identity, or the failure to conform to one's own diachronic policies — and if I do, what becomes of the ordinary first-personal phenomenology of acting against one's better judgment, and of the intuition that the continent and the incontinent agent differ in something other than their environments? If I have to choose, I would rather give up the judgment–preference link than the claim about how intentional action relates to preference, since the quasi-hyperbolic modeling result is not something I want to relitigate here; but I want to know exactly what I am paying and whether the bill is larger than I think.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Doctoral candidate in philosophy. Writing a chapter on weakness of will (akrasia).
      *   **Context:** Reading group with behavioral economists. One economist presented a specific argument challenging the possibility of akrasia given hyperbolic discounting models.
      *   **Task:** Diagnose the argument, identify the step to reject, explain *why* that step is compelling, and price the alternatives (costs/benefits). Do *not* just survey positions.
      *   **Specific Constraints:** Address two specific questions: (1) If keeping (2), reject (1) and reconceive judgment as temporally extended? (2) Or give up the standard definition for self-governance/policy accounts?
      *   **User's Preference:** Would rather give up the judgment-preference link (1) than the intentional action-preference link (2), but wants to know the cost.
      *   **Tone:** Philosophical, rigorous, engaging with the specific logical structure provided, acknowledging the economist's perspective while defending the philosophical phenomenon.

  2.  **Deconstruct the Economist's Argument:**
      *   (1) Judgment = Preference (at time *t*). No gap.
      *   (2) Intentional Action follows Preference (at time *t*).
      *   (3) Hyperbolic Discounting causes Preference Reversal over time.
      *   (4) Therefore, Action always follows Judgment (because Judgment follows Preference, and Action follows Preference).
      *   (5) Therefore, Akrasia (acting against judgment) is impossible in this model.
      *   (6) Generalization: Akrasia is impossible *simpliciter*. Continence is trivial.
      *   *Conclusion:* Akrasia is really about circumstances, not will.

  3.  **Identify the Core Tension:**
      *   The economist is operating with a *revealed preference* framework (standard in neoclassical economics). If you do it, you preferred it. If you judged it best, you preferred it. Therefore, doing = judging best.
      *   The philosopher needs to preserve the *normative* force of "better judgment" distinct from the *motivational* force of "preference/desire."
      *   The crux is Premise (1). Premise (2) is also vulnerable, but the user prefers to keep (2).
      *   The economist's move is to collapse the distinction between *evaluative judgment* (what is good/right) and *motivational state* (what I want to do).

  4.  **Evaluate the Steps for Rejection:**

      *   **Rejecting (2) (Action follows Preference):** This leads to the problem of "how do you act against your strongest motive?" (The Humean challenge). If preference is the *cause* of action, acting against it requires a different causal story (willpower as a distinct faculty?). This is costly metaphysically.
      *   **Rejecting (1) (Judgment = Preference):** This is the standard Socratic/Aristotelian vs. Humean battleground. If Judgment $\neq$ Preference, then I can judge A best but prefer B. This saves akrasia but requires explaining what "Judgment" is if it's not the top of the preference ordering. It requires a bifurcated psychology (Reason vs. Passion, or Evaluative vs. Motivational).

      *   **The Economist's Trap:** The economist is defining "preference" functionally (revealed by choice) and "judgment" psychologically (ranking). By equating them, they make akrasia a contradiction in terms *by definition*.
      *   **The Diagnosis:** The argument is valid but unsound because (1) is a category mistake. It conflates *normative endorsement* with *motivational strength*.

  5.  **Address the User's Specific Questions:**

      *   *Option A: Keep (2), Reject (1), Temporally Extended Agent.*
          *   If Judgment $\neq$ Preference at *t*, then what is Judgment?
          *   If it's temporally extended (diachronic), whose judgment counts? The past self? The future self?
          *   *Cost:* Risks alienating the agent from their current self. If current preference is for cake, but "extended self" judges salad, is the current self acting freely or possessed?
          *   *Fixing Authority:* Needs a theory of identification (Frankfurt, Watson) or planning (Bratman).
          *   *Survival of "Better Judgment":* Yes, but it becomes "Better *Diachronic* Judgment."

      *   *Option B: Give up Standard Definition for Self-Governance/Policy.*
          *   Shift from "acting against judgment" to "violating one's own norms/policies."
          *   *Cost:* Loses the immediate phenomenology of "I know this is bad but I'm doing it." Becomes more about consistency than morality/prudence.
          *   *Benefit:* Handles the diachronic nature better.
          *   *Phenomenology:* Can be preserved if policies are internalized.

  6.  **Develop the Diagnosis (The "Bill"):**
      *   The economist's argument relies on *Operationalism*. Preference is defined by choice. Judgment is defined by preference.
      *   To save akrasia, you must insist on a *Realist* or *Dual-Process* view of psychology.
      *   **The Step to Reject:** Premise (1).
      *   **Why it's compelling:** It aligns with Revealed Preference Theory (RPT). It simplifies modeling. It avoids mysterious "willpower" faculties.
      *   **The Cost:** You must admit that human psychology is not unified. You must distinguish between the *evaluative system* (System 2-ish) and the *motivational system* (System 1-ish). You pay a metaphysical price (dual processes) and an explanatory price (how do they interact?).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the economist's argument. It's a classic "logical behaviorist" attack on akrasia.
      *   *Diagnosis:* The error is in (1). It conflates *evaluative ranking* with *motivational ordering*. In economics, "preference" does all the work. In philosophy, "judgment" is normative, "preference" is motivational.
      *   *Addressing the User's Preference:* The user wants to keep (2) and reject (1). I need to validate this but show the cost.
      *   *Cost of Rejecting (1):*
          *   You break the unity of the agent at *t*.
          *   You need an account of how Judgment motivates (if it's not the top preference).
          *   You need to explain the "Clear-Eyed Dieter" without making them schizophrenic.
      *   *Addressing the Temporal Extension:* If judgment is diachronic, you need a criterion for *which* time-slice is authoritative. (Bratman's planning theory is good here).
      *   *Addressing the Self-Governance Shift:* This is actually the stronger move. Akrasia isn't just acting against judgment; it's failing to govern oneself according to one's own standards.
      *   *The "Bill":* The cost is abandoning the simple Humean Theory of Motivation. You need a non-Humean account where belief/judgment can motivate independently of desire/preference. Or a partitioned mind account.
      *   *Refining the "Wrinkle Cases":*
          *   Clear-eyed dieter: Shows (1) is false. Judgment $\neq$ Preference.
          *   Sophisticated agent: Shows (2) is too strong *if* preference is just impulse. But if preference includes "willpower," (2) holds.
          *   Reverse profile: Shows the structural limitation of discounting models.

      *   *Synthesis:* The economist is right that *within the model*, akrasia disappears. The philosopher's job is to show the model is incomplete. The specific incompleteness is the separation of the *normative* from the *motivational*.
      *   *Recommendation:* Reject (1). But don't just say "Judgment $\neq$ Preference." Say "Judgment is a *different kind of state* than Preference." Preference is about *pull*; Judgment is about *endorsement*.
      *   *Pricing:* The cost is that you can no longer model the agent as a single utility maximizer. You must model them as a site of conflict between systems. This makes prediction harder (bad for econ) but explanation richer (good for phil).

  8.  **Final Polish:** Ensure the tone is appropriate for a doctoral candidate (technical, precise, no hand-holding). Ensure the specific questions about temporal extension and self-governance are answered directly. Make sure the "price" is clear.

      *   *Self-Correction during drafting:* I need to be careful not to just say "economists are wrong." I need to say "economists are right *given their definitions*, but their definitions exclude the phenomenon." The argument is valid, the premises are the issue. Specifically (1).
      *   *Focus on (1):* The economist treats "preference" as *all-in motivational strength*. The philosopher treats "better judgment" as *normative ranking*. The collapse is the error.
      *   *The "Bill":* If you reject (1), you owe an account of how judgment motivates (if it does) or why it binds (if it doesn't). You also owe an account of agency that allows for internal division without dissolving the agent.

  9.  **Structure of the Response:**
      1.  **Diagnosis:** The Category Mistake in Premise (1).
      2.  **The Compelling Nature of (1):** Why the economist thinks this (Revealed Preference, parsimony).
      3.  **The Cost of Rejecting (1):** Metaphysical fragmentation, the problem of motivation.
      4.  **Addressing Specific Question 1 (Temporal Extension):** Authority of slices, Bratman/Planning.
      5.  **Addressing Specific Question 2 (Self-Governance):** Phenomenology, distinction from environment.
      6.  **Conclusion:** The specific "bill" to pay.

  10. (Final check against constraints): Did I survey positions? No. Did I diagnose? Yes. Did I price alternatives? Yes. Did I answer the two specific questions? Yes. Did I respect the user's preference to keep (2)? Yes.

      *Wait, one nuance:* The user asks "If I keep (2), is the right move to reject (1)...?"
      If I keep (2) (Action follows Preference), and I reject (1) (Judgment = Preference), then Action can diverge from Judgment. This saves akrasia.
      *But*, if Action follows Preference, and Preference is defined by what moves the agent, then "Preference" becomes "Strongest Motive."
      So, Judgment is *not* the Strongest Motive.
      This implies a partitioned mind.
      Okay, I will build the response around the **Partitioned Mind / Dual-Process** cost.

      *Let's refine the "Temporal Extension" part.* If judgment is diachronic, does it survive? Yes, if viewed as a policy. Who fixes authority? The planning agent.
      *Let's refine the "Self-Governance" part.* Does phenomenology survive? Yes, as the experience of policy-violation.

      *Ready to write.*
answer: |-
  The economist's argument is a sophisticated resurrection of the Socratic paradox (no one errs willingly), dressed in the formal wear of behavioral economics. It is valid. If you accept the premises, the conclusion follows inescapably: akrasia is an illusion produced by misdescribing the time-indexing of preferences.

  However, the argument is unsound. The diagnosis is that **Premise (1) commits a category mistake by conflating normative endorsement with motivational strength.** The economist is operating within a Revealed Preference framework where "preference" is defined functionally by choice. In that framework, (1) is a tautology. But in a framework that aims to explain *weakness of will*, "better judgment" and "preference" must denote distinct psychological kinds.

  Here is the diagnosis of the step to reject, why it seduces, the price of rejecting it, and answers to your two specific questions.

  ### The Diagnosis: Reject Premise (1)

  You should reject (1): *An agent's all-things-considered judgment at t ranks option A above option B just in case her preference ordering at t ranks A above B.*

  **Why it looked compelling:**
  Premise (1) is the engine of the argument because it enforces **Psychological Unity**. It assumes the agent is a monolithic maximizer at every time-slice *t*. For the behavioral economist, this is a methodological necessity: if judgment and preference can come apart, the model loses its predictive parsimony. You can no longer infer mental states from behavior alone. (1) is compelling because it promises a clean, naturalistic ontology of the mind where there is no "ghost in the machine" (a will) that can override the "machine" (preference/desire). It dissolves the mystery of akrasia by dissolving the distinction that makes it possible.

  **The Cost of Rejecting (1):**
  If you reject (1), you pay a **metaphysical and explanatory tax**. You are committed to a **partitioned psychology**. You must assert that at time *t*, the agent houses two distinct ranking systems:
  1.  **The Evaluative System:** Produces the "better judgment" (normative ranking).
  2.  **The Motivational System:** Produces the "preference" (motivational ranking).

  By rejecting (1), you admit that the agent is not unified at *t*. This invites the charge of fragmentation: if I judge A best but prefer B, which one is *me*? If action follows preference (keeping your commitment to (2)), then the "real" me seems to be the preferencer, and the judgment is merely an idle spectator. To avoid this, you must explain how judgment *can* motivate (sometimes) but *fails* to motivate (in akrasia). This requires a non-Humean theory of motivation or a dual-process account where "judgment" belongs to a slower, normative system and "preference" to a faster, affective system. You are trading parsimony for phenomenological accuracy.

  ### Addressing Your Specific Questions

  #### 1. If I keep (2), is the right move to reject (1) and reconceive better judgment as temporally extended?

  If you keep (2) (Intentional action follows preference ordering at *t*), you are conceding that at the moment of action, the motivational force determines the outcome. To save akrasia, you must argue that the "better judgment" violated at *t* was not merely the judgment *at t*, but a judgment that holds authority *across* time.

  **Does the notion of better judgment survive?**
  Yes, but it shifts from a *snapshot evaluation* to a *diachronic policy*. If judgment is indexed only to the time-slice, the economist wins: the slice at *t* judges cake best (because its preference ranks cake best). To save akrasia, the "better judgment" must be the judgment of the **planning agent** that spans *t-1* to *t+n*.

  **What fixes which slice's judgment is authoritative?**
  This is the hardest bill to pay. You cannot simply say "the past self rules," or you make the agent a slave to their history. You need a criterion of **identification**.
  *   **The Cost:** You must adopt a view like Michael Bratman's planning theory or Harry Frankfurt's hierarchy of desires. Authority is fixed not by temporal priority, but by **stability and integration**. The judgment that counts as "better" is the one embedded in the agent's stable, cross-temporal plans and policies with which the agent *identifies*.
  *   **The Risk:** This risks alienating the agent from their current experience. If the dieter at *t* desperately wants cake and judges cake best (by premise 1's logic), but we say her "true" judgment is the one from *t-1* that preferred salad, we are telling her she is mistaken about her own mind. You save akrasia by making the "agent" a fictional construct over time, rather than the living subject at *t*.
  *   **Verdict:** This move works, but it transforms akrasia from "acting against my current judgment" to "violating my own standing policies." It saves the phenomenon but changes the definition.

  #### 2. Alternatively, should I give up the standard definition and reconceive akrasia in terms of self-governance?

  This is the more robust philosophical move, and arguably the one that best counters the economist. The economist's argument shows that *if* akrasia is defined as "acting against current preference-ranked judgment," then hyperbolic discounting eliminates it. So, change the definition to something the discounting model cannot capture.

  **Reconceiving as Self-Governance:**
  Define akrasia not as acting against a judgment, but as a **failure of self-governance**: the failure of the agent's normative authority to regulate their motivational systems.
  *   **Phenomenology:** Does this preserve the first-personal feel? Yes. The feeling of "I shouldn't do this" is the experience of a normative policy clashing with a motivational impulse. The economist reduces this to "I have two conflicting preferences at different times." The self-governance account captures the *normative force* of the conflict, not just the temporal shift.
  *   **Continence vs. Circumstance:** Does this distinguish the agent from the environment? Yes. The economist concludes continence is about circumstances (e.g., lack of commitment devices). The self-governance account says continence is the *exercise of authority* over one's impulses. Two agents in identical circumstances (cake on table, no lockbox) differ in continence based on whether their normative policies successfully regulate their motivations.
  *   **The Cost:** You move away from the "standard definition" you started with. You are no longer writing about *akrasia* in the strict Socratic/Aristotelian sense (acting against *knowledge/judgment*), but about *incontinence* as a failure of agency. Some purists will object that this changes the subject. However, it is the only way to prevent the economist from defining the phenomenon out of existence.

  ### The Bill: What exactly are you paying?

  You stated you would rather give up the judgment–preference link (1) than the action–preference link (2). Here is the exact invoice for that choice:

  1.  **You lose the Unified Agent at *t*:** You must accept that at the moment of akratic action, the agent is divided. The "judging" self and the "acting" self are functionally distinct systems. This makes the agent look less like a rational unity and more like a battleground.
  2.  **You owe a theory of Normative Force:** If judgment does not determine preference (rejecting 1), and action follows preference (keeping 2), then judgment is causally impotent in akratic cases. You must explain why judgment *ought* to move us, and why its failure to do so is a *fault* rather than just a mechanical glitch. You need a normative story, not just a causal one.
  3.  **You accept Diachronic Authority:** To answer the economist's time-indexing move, you must argue that the agent's identity is diachronic. The "better judgment" is the one that aligns with the agent's long-term identity, not the one that aligns with the immediate motivational spike. This requires you to defend a substantive view of personal identity against the economist's time-slice ontology.

  ### Recommendation

  The economist's argument is a *reductio* of the **Humean Theory of Motivation** combined with **Revealed Preference Theory**. He is right that *within that system*, akrasia is impossible.

  Do not try to fix the discounting model. Instead, argue that the discounting model describes the **Motivational System**, but fails to capture the **Evaluative System**.
  *   **Reject (1).** Judgment is not preference. Judgment is an endorsement; preference is a pull.
  *   **Keep (2) with a caveat.** Action follows the *strongest motivational force*, but the agent *is* the entity capable of aligning that force with judgment.
  *   **Adopt the Self-Governance conception.** This allows you to acknowledge the economist's data (preference reversals happen) while denying their conclusion (therefore no akrasia). Akrasia is not the reversal; it is the **submission** to the reversal despite a standing policy to the contrary.

  The bill is high: you must defend a dual-process psychology and a diachronic view of agency. But the alternative is to accept the economist's conclusion that human beings are merely arrays of time-indexed preferences, in which case "weakness of will" is indeed just a label for predictable discounting curves. Since your chapter is on weakness of will, you must pay the bill to keep the subject matter alive.
