  # Joint Statement on Indirect Normativity: Ground-Level and Transformative Frameworks

  **Signatories:** The Ground-Level Camp, The Transformative Camp
  **Date:** Post-Collaboration Review

  ### 1. Numbered Agreed Claims

  1.  **The Project:** Indirect normativity aims to ground normative authority in the attitudes of agents without reducing norms to actual, occurrent desires. We agree that norms are binding because they stem from *us*, not from a realm of mind-independent moral facts.
  2.  **Inadequacy of Direct Normativity:** Direct normativity fails because it cannot explain why agents should care about norms they cannot grasp. A norm that exists independently of any possible agent endorsement is alienating and lacks justificatory force for the beings bound by it.
  3.  **Function of Idealization:** The idealization procedure is meant to filter out ignorance, logical error, cognitive bias, and transient impulse. It is not meant to replace the agent with a different entity, though we disagree on where that line is drawn.
  4.  **Non-Identity Problem:** We agree that norms apply to future selves or successor agents only insofar as the idealization procedure connects them to the current agent's trajectory. We reject solutions that dissolve the agent entirely into a sequence of temporal slices.
  5.  **Paternalism:** Both camps reject external paternalism. Authority must stem from the agent's own standpoint (however idealized). Imposing a norm because it is "good for them" without reference to their own idealized endorsement is illegitimate coercion.

  ### 2. The Disagreements Table

  | Issue | Ground-Level Position | Transformative Position |
  | :--- | :--- | :--- |
  | **The Justificatory Link** | The link between the norm and the agent is severed if the reasoning process is opaque to the actual person. If the actual agent cannot recognize the values as their own, the norm is external imposition. | The link holds if the fully rationalized counterpart endorses the norm, even if the reasoning is totally opaque to the actual person. Authority tracks rational truth, not recognizability. |
  | **Continuity of Identity** | Idealization must preserve the agent's basic values and cognitive limits. We are improving the agent, not replacing them. | Idealization must pursue full rationality even if it alters basic values. We are identifying what the agent *should* be, not what they *are*. |
  | **Role of Actual Desires** | Actual desires constrain the idealization. If a value is central to the actual agent, the idealized version cannot discard it without breaking identity. | Actual desires are data points to be corrected. The idealized version can discard central actual values if they are irrational. |

  ### 3. The Cruxes

  **Crux 1: Transparency and Availability**
  Does justification require that the reason be transparent or "available" to the actual agent to count as *her* reason?
  *   **Ground-Level:** Yes. A reason I cannot comprehend is not a reason for me; it is a command.
  *   **Transformative:** No. A reason is valid if it is what I *would* hold were I fully rational. My current inability to grasp it is a defect in me, not the norm.

  **Crux 2: Fairness vs. Rational Optimization**
  How do we treat cases where the idealized agent endorses a distributive rule that looks plainly unfair from the ground-level perspective?
  *   **Ground-Level:** If the rule violates ground-level reciprocity or fairness intuitions that survive idealization, it is illegitimate. Fairness is a basic value that cannot be rationalized away.
  *   **Transformative:** If the fully rationalized agent endorses the rule, it is by definition fair. Ground-level intuitions about fairness are often biases that full rationalization corrects.

  ### 4. Concrete Scenarios and Predicted Verdicts

  **Scenario A: The Public-Health Mandate (Test of Transparency)**
  *Case:* A mandate requires vaccination to prevent a pandemic. It saves lives but violates a deeply held, religiously grounded commitment of the actual agent that is arguably irrational (e.g., belief that the vaccine alters the soul). The agent cannot comprehend the statistical reasoning even when explained.
  *   **Ground-Level Verdict:** **Exempt the Agent.** The idealized agent retains the core value (religious integrity) even with better info. Forcing compliance severs the justificatory link because the agent cannot recognize the reason as their own.
  *   **Transformative Verdict:** **Enforce the Mandate.** The fully rationalized agent would prioritize survival and public health over irrational metaphysical commitments. The actual agent's opacity is a cognitive failure, not a justificatory veto.

  **Scenario B: The Resource Sacrifice (Test of Fairness)**
  *Case:* A distributive rule requires a specific group to sacrifice significant resources for the greater good. Ground-level intuition screams this is unfair exploitation. However, the fully rationalized agent endorses it as the only logically consistent maximization of value.
  *   **Ground-Level Verdict:** **Reject the Rule.** The idealization process preserves the basic value of reciprocity. A rule that looks like exploitation to the ground-level agent cannot be endorsed by an idealized version that retains human social constraints.
  *   **Transformative Verdict:** **Accept the Rule.** The ground-level intuition of "unfairness" is a bias. The fully rationalized agent sees the optimization clearly. If the math holds, the norm is binding regardless of the emotional cost.

  ### 5. Substantive vs. Verbal Disagreements

  **Verbal Confusion:**
  Much of our debate over the term "ideal agent" is verbal. When Ground-Level says "agent," we mean *this human being with these constraints*. When Transformative says "agent," we mean *the locus of rationality instantiated by this human*. We are talking past each other on identity conditions. If we agree that "agent" refers to the biological human in all policy contexts, the Transformative position becomes harder to state without sounding alienating.

  **Substantive Disagreement:**
  The disagreement on **Transparency** is substantive. It determines whether normativity is essentially communicative (Ground-Level) or teleological (Transformative).

  **Accusation of Smuggling:**
  We must state plainly: **The Transformative Camp is smuggling in Direct Normativity.**
  When Transformative theorists claim the "fully rationalized" agent would endorse X, they often rely on the assumption that full rationality tracks mind-independent moral truths. If the "fully rationalized" version of me just converges on the True Good regardless of my actual values, then the "idealization" is doing no work. The authority comes from the Truth, not the Agent. Transformative indirect normativity collapses into Direct Normativity unless it can prove that the fully rationalized agent's endorsement is distinct from mind-independent moral facts. Ground-Level avoids this by tethering authority to recognizability, but Transformative has not solved this leakage.
