prompt: |-
  hey — im a junior and im doing History Day this year (senior division, individual exhibit) and ive got my 5 minute talk and then the judges hit me with questions and honestly the Q&A is the part im scared of, way more than the talk.

  my project is on the 1815 Tambora eruption and the 1816 "year without a summer", and my thesis is basically that Tambora shouldn't be in the story as backdrop or as a trigger that sets off real human history, it should be in there as one of the actors — but without doing the determinist thing where the mountain decides everything and people just starve on schedule. way im trying to do that is a criterion im calling "option-space agency" (tell me if that sounds dumb and ill change it): a non-human thing counts as an actor in a historical explanation if (1) it changed which options were actually available or affordable to the people in the story, and not just which ones they picked, and (2) that change didn't come from what those people believed about it. so germs and volcano winters pass, and I get to say Tambora narrowed the option space for whoever was deciding grain policy in 1816 without saying it caused the famine. second part of my argument is that the archives are biased toward human agency anyway because intentions get written down and microbes dont, so historians over-credit deliberation. i like that bit but im not sure its definately load bearing. there's also a case im unsure about: a rumor that panics a city changes what people can do, but only through beliefs, so my rule (2) kicks it out — which feels wrong to me and I dont know what to do with it yet.

  the judges are: two career high school history teachers, one of them runs the AP world history program at her school and hands out a whole thing about not blaming geography for everything; a university geography professor who does natural hazards and vulberability research; and a public health grad student. 5 minutes of questions, all of them at once.

  can you build me a prep sheet? like 7-9 objections in the order they'll probably actually come, ranked by how much damage theyd do, each one phrased the way *that* person would say it out loud (the hazards guy is gonna say exposure and vulnerability a lot; the AP teacher is gonna say that agency is a word that already means something and im not allowed to just redefine it; the public health person will probably want to know what my criterion would say about a modern outbreak response). for each: what I say in ~45 seconds, what I should just concede up front so I dont look stubborn, and where my answer is thin. and include the one im hoping nobody asks — my guess is the "so is my alarm clock an actor, does every cause with causal power get a name card" line, but if you think there's something worse waiting for me im begging you to say so.

  last thing: at the end tell me honestly which of these objections would actually change *your* mind about whether "option-space agency" is doing real work or is just causation with better PR, and flag the parts of the prep sheet where your just guessing what those judges are like — id rather know which bits to actually memorize and which to improvise.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Junior student, Senior Division Individual Exhibit, National History Day (NHD).
      *   **Topic:** 1815 Tambora eruption & 1816 "Year Without a Summer."
      *   **Thesis:** Tambora is an *actor*, not just backdrop/trigger. Avoids determinism.
      *   **Key Concept:** "Option-space agency" (OSA).
          *   Criterion 1: Changed available/affordable options (not just choices).
          *   Criterion 2: Change didn't come from human *beliefs* about the thing (excludes rumors/panic).
      *   **Secondary Argument:** Archives bias toward human agency (intentions written, microbes/volcanoes not).
      *   **Judges:**
          1.  HS Teacher (AP World History lead) -> Skeptical of geographical determinism, cares about definitions of "agency."
          2.  HS Teacher (General) -> Likely follows the lead of the AP teacher.
          3.  Geography Professor (Natural Hazards/Vulnerability) -> Will use terms like "exposure," "vulnerability," "resilience."
          4.  Public Health Grad Student -> Interested in outbreaks, response, modern applicability.
      *   **Format:** 5-minute Q&A.
      *   **Deliverable:** Prep sheet with 7-9 objections (ranked by damage), phrased as judges would speak, with 45-second answers, concessions, and weak points. Plus, the "scary question" and honest feedback on the theory itself.

  2.  **Deconstruct the Thesis & Theory ("Option-Space Agency"):**
      *   *Strengths:* Nuanced. Avoids "volcano made them do it" determinism. Acknowledges structural constraints.
      *   *Weaknesses:* "Agency" is a loaded term in history (usually reserved for humans). Criterion 2 (beliefs) is tricky (what if belief *is* the mechanism of the constraint?). The "alarm clock" reductio ad absurdum.
      *   *The "Rumor" Problem:* User notes rumors change options via belief, so OSA excludes them. User feels this is wrong. *Self-Correction:* This is actually a strong point of distinction. OSA is about *material* constraints, not *psychological* ones. I need to help them defend this distinction.

  3.  **Drafting the Objections (Simulating the Judges):**

      *   *Judge 1 (AP Teacher):* "Agency means human intent." "Don't blame geography."
      *   *Judge 2 (Geography Prof):* "Vulnerability," "Exposure," "Social construction of risk."
      *   *Judge 3 (Public Health):* "Disease outbreaks," "Response policies," "Modern applicability."
      *   *General/Hard:* "Is this just causation?" "The Rumor Problem." "Archival Bias."

      *   *Ranking by Damage:*
          1.  **The Definition Trap (AP Teacher):** If "agency" is wrong, the whole theoretical framework crumbles. High damage.
          2.  **The Determinism Accusation (AP Teacher):** Classic NHD pitfall. "Geography isn't destiny."
          3.  **The "Just Causation" Critique (All):** Is this just fancy wording for "cause"?
          4.  **The Vulnerability/Exposure Reframe (Geo Prof):** They might say "You're describing vulnerability, not agency."
          5.  **The Public Health/Modern Test (PH Grad):** Does it work for COVID?
          6.  **The Archival Bias (User's own point):** Is this load-bearing?
          7.  **The Rumor/Belief Edge Case:** Why exclude belief?
          8.  **The "Alarm Clock" (Reductio ad absurdum):** Everything has causal power.

  4.  **Developing the Responses (45 seconds approx. 100-120 words spoken):**
      *   Need to be punchy. Acknowledge validity, pivot back to thesis.
      *   *Concessions:* Crucial for NHD. Don't argue *with* judges, argue *through* them.

  5.  **Addressing the "Scary Question":**
      *   User guesses "Alarm Clock." I agree this is the philosophical trap. If a rock trips me, did the rock have agency? Need to distinguish *structural constraint* from *random event*.

  6.  **Honest Feedback Section:**
      *   Which objection actually threatens the theory? The "Agency" definition one.
      *   Where am I guessing? The specific demeanor of the teachers vs. the professor.

  7.  **Refining the Content (Iterative Polish):**
      *   *Check:* Did I include the "Rumor" issue the user mentioned? Yes, need to make sure the answer validates their intuition that belief is different from material constraint.
      *   *Check:* Is the Geography Prof's language accurate? Yes, "vulnerability" and "exposure" are key terms in hazards research.
      *   *Check:* Is the AP Teacher's concern addressed? Yes, "geographical determinism" is a huge no-no in AP World.
      *   *Check:* NHD Rules? Senior Division Q&A is usually 5 minutes. The advice needs to fit that timeframe (brevity).

  8.  **Final Review against User Constraints:**
