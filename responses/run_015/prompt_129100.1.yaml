answer: |-
  # SPEAKER PREP SHEET: THE PROGNOSTIC STANCE

  ## PART 1: HIGH-DAMAGE OBJECTIONS (ORDERED BY THREAT LEVEL)

  ### 1. The Instrumentalism Collapse (Legal Scholars & Moral Philosophers)
  **The Objection:** "You claim this stance carries 'normative weight' and demands justification. But in the institutional contexts you cite (risk assessment, screening), 'justification' is merely bureaucratic compliance. If the 'demand' is satisfied by correcting a data error rather than offering a moral excuse, you haven't found a moral stance; you've just rebranded risk management. Where is the *moral* obligation if the output is purely instrumental optimization?"

  **90-Second Reply:**
  "The distinction lies in the *direction of fit*. In pure risk management, the subject is adjusted to fit the model's safety parameters. In the prognostic stance, the model itself must be justified to the subject as *fair*, not just accurate. When a predictive policing algorithm is challenged, the demand isn't merely 'fix the false positive,' but 'explain why this proxy for risk is just.' That appeal to fairness, rather than mere accuracy, is the normative kernel. It treats the subject as a member of a normative community who can contest the rules of prediction, not just a variable to be minimized. This preserves moral concern without requiring the emotional heat of resentment."

  **⚠️ Weakest Point:** This relies on the assumption that institutional actors actually *allow* subjects to contest the fairness of the model, which is often empirically false.

  ### 2. The Strawsonian Redundancy (Moral Philosophers)
  **The Objection:** "Strawson already accounts for this. He explicitly allows for 'modifications' of the reactive attitudes when we consider psychological abnormality or extreme stress. Your 'prognostic stance' is just a vicarious reactive attitude adopted by an institution. You are multiplying entities without necessity. Why isn't this just the objective attitude with a polite mask, or a muted reactive attitude?"

  **90-Second Reply:**
  "Strawson's modifications are temporary suspensions of the participant stance pending a return to normal relations. The prognostic stance is *structural and permanent* within these institutions; we do not expect to return to full interpersonal reactivity with a risk algorithm. Furthermore, muted reactive attitudes still rely on emotional phenomenology (e.g., mild annoyance). The prognostic stance operates entirely without emotional phenomenology yet retains the demand for accountability. It is a functional analogue to the reactive stance, not a diluted version. It fills the gap where we must treat agents as responsible without requiring shared emotional vulnerability."

  **⚠️ Weakest Point:** Strawson scholars may argue that "emotional phenomenology" is not essential to Strawson's definition of the participant stance, only the *disposition* to react.

  ### 3. The Cognitive/Conceptual Conflation (Predictive Processing Philosophers)
  **The Objection:** "You are conflating a cognitive mechanism with a moral stance. In predictive processing, 'prediction' is a sub-personal error-minimization function. You are taking a technical term from cognitive science and importing it into metaphysics to describe a social posture. This creates a category error. A system can predict behavior without adopting a 'stance' toward the agent. Why think this is a moral category and not just a description of how bureaucracy processes information?"

  **90-Second Reply:**
  "I am not claiming the *mechanism* of prediction is moral. I am claiming the *social posture* adopted by the institution toward the subject constitutes the stance. When an institution uses prediction to manage a person, it implicitly posits that the person is a predictable agent whose future actions matter to the community's norms. The 'prognostic' label captures the temporal orientation: we are holding you accountable for *future* probabilities, not just *past* actions. This shifts the metaphysical ground of responsibility from 'could you have done otherwise?' to 'how do we model your agency going forward?' It is a moral stance because it dictates how we are permitted to treat the subject."

  **⚠️ Weakest Point:** This risks conceding that the "stance" belongs to the institution, not the individuals within it, which complicates the locus of moral responsibility.

  ### 4. The Metaphysical Evasion (Hard Determinist)
  **The Objection:** "This is compatibilist word-gaming. You admit the stance lacks libertarian free will foundations. If determinism is true, predictive models are just tracking causal chains. Calling this 'normative' doesn't change the fact that the subject couldn't have done otherwise. You are describing how we *manage* determinism, not how we justify blame. You haven't solved the problem; you've just described the bureaucracy of evasion."

  **90-Second Reply:**
  "I am not attempting to solve the metaphysical problem of ultimate responsibility. I am arguing that the *practice* of holding responsible has already shifted, and compatibilism needs to catch up. The standard compatibilist argument says determinism forces us into the objective stance (treating people as things). I am showing that in modern contexts, determinism actually leads to the prognostic stance (treating people as manageable agents). This preserves the social function of responsibility without the metaphysical baggage. It doesn't solve the hard problem, but it shows that the 'loss' of free will doesn't necessitate the 'loss' of moral standing."

  **⚠️ Weakest Point:** The Hard Determinist will correctly note that preserving "moral standing" without ultimate responsibility may be exactly what they reject as incoherent.

  ***

  ## PART 2: THE "HOPE NOBODY ASKS" OBJECTION

  **The Challenge:** "If the prognostic stance is defined by its reliance on *data-driven prediction*, isn't its primary norm *accuracy* rather than *justice*? If an algorithm is accurate but unjust (e.g., correctly predicts recidivism based on racist data), the prognostic stance validates it as 'successful prediction.' How can a stance grounded in predictive success generate a normative demand for justice without contradicting its own definition?"

  **Why this is fatal:** It exposes the tension between your claim that the stance is *normative* (concerned with oughts/justice) and your reliance on *institutional practices* (concerned with is/outcomes). If the stance is defined by the logic of prediction, it may inherently privilege accuracy over morality, rendering your claim that it "preserves moral concern" false.

  ***

  ## PART 3: STRATEGIC CONCESSIONS (FOR OPENING REMARKS)

  *Pre-emptively conceding these points builds trust and narrows the scope of attack.*

  ### 1. To the Moral Philosophers
  **Concession:** "I am not arguing that the prognostic stance should *replace* the reactive attitudes in personal life. I concede that in intimate, interpersonal relationships, the emotional phenomenology of resentment and gratitude remains the gold standard of moral engagement. My claim is limited to *institutional* contexts where interpersonal reactivity is structurally impossible."
  **Why:** Prevents them from attacking you for dehumanizing personal relationships.

  ### 2. To the Predictive Processing Philosophers
  **Concession:** "I am not making a claim about the neural implementation of this stance. I concede that the cognitive machinery involved may be identical to standard predictive processing. My argument is strictly at the level of functional description and social metaphysics, not cognitive architecture."
  **Why:** Disarms their skepticism about importing tech-studies into metaphysics by clarifying the level of analysis.

  ### 3. To the Legal Scholars
  **Concession:** "I concede that current algorithmic systems often fail to meet the normative standards of the prognostic stance. They often operate as purely instrumental risk managers. My argument is not a defense of current technology, but a description of the *structural possibility* for normativity within that framework."
  **Why:** Acknowledges their expertise on current failures without letting those failures invalidate your theoretical category.

  ### 4. To the Hard Determinist
  **Concession:** "I concede that this framework does not provide a foundation for 'ultimate desert.' If you require a metaphysical ground for blame that transcends social practice, this talk will not satisfy you. I am arguing only for the coherence of the practice itself, not its metaphysical ultimate justification."
  **Why:** Prevents them from spending 40 minutes arguing about libertarian free will, which you cannot win in this forum.
