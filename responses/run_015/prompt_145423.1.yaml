  *(Refining the Recommendation)*: A pure "Reject" is irresponsible given the 2% status quo. A pure "Approve" is negligent given the hallucination rate. A "Bounded Approval" with a ban on fine-tuning is the only safe middle ground. It allows coverage expansion without locking in the errors.

