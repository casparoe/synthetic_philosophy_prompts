  ## V. Epistemological Q&A (For Your Preparation)

  **1. Is the moral "Deference to the chance given everything about the past"?**
  Yes. This is effectively the **New Principal Principle**. The original Principal Principle says $C(A | Ch(A)=x) = x$. Stage 3 shows this is incomplete. It must be $C(A | Ch(A)=x \ \& \ E) = x$, *provided E is admissible*. The Lamp is admissible evidence *about the chance*, not the outcome directly. The moral is: Defer to the *current* chance, not the *initial* chance. The chance "evolves" as you learn about the setup (Hi vs Lo), even if the outcome isn't settled.

  **2. Does Bayes on frequencies land on the same number as conditional-chance deference?**
  Yes, in this setup.
  *   **Route A (Deference):** I know the chance is 0.95 if Hi, 0.65 if Lo. I learn Lamp (which makes Hi 80% likely). My credence = Expected Chance = $0.8(0.95) + 0.2(0.65) = 0.89$.
  *   **Route B (Bayes on Data):** I see the table. Red happens 133/150 times when Lamp is On. My credence = 0.887.
  *   **Where they come apart:** They come apart if the evidence is **inadmissible**. If the "Lamp" was actually a crystal ball showing the *future outcome*, Bayes on frequencies would still say 0.89, but Deference to Chance would say 1.0 (because the chance of a settled fact is 1). The activity assumes the Lamp is *causally prior* to the outcome (admissible). You must emphasize this in the debrief.

  **3. What will predictably go wrong?**
  *   **The "Gambler's Fallacy" in Stage 1:** Someone will say "We had 3 Reds, so Blue is due."
      *   *Fix:* Remind them the trials are independent. The Chance is fixed at 0.8.
  *   **Stage 3 Confusion:** "The box says 80%, why would I change?"
      *   *Fix:* "The box tells you the *average* over all settings. The Lamp tells you the *specific* setting. Would you bet on the average or the specific?"
  *   **Scoring Panic:** "I lost points on a single trial!"
      *   *Fix:* Remind them the scoring rule is *proper*. It rewards truth-telling *in expectation*. A single loss doesn't mean the strategy was wrong.

  **4. Limitations (What you must supply by talking)**
  *   **The One-Shot Problem:** The scoring rule justifies the norm over many trials. But the Principal Principle claims to bind you on a *single* case. You cannot demonstrate this empirically. You must argue: "Rationality isn't just about winning this game; it's about your mind matching the world. If the chance is 0.8, a credence of 0.9 is *misaligned*, even if you win this once."
  *   **Existence of Chance:** This game assumes objective chances exist. It doesn't prove them. If you're a Humean, the "Chance" is just the frequency. If you're a Primitivist, it's a propensity. The game works for both, but the *metaphysics* differs.
  *   **Admissibility:** You need to explicitly define "Admissible." It means "Information about the past/present setup, not the future outcome." The Lamp is admissible. A crystal ball is not.

  **5. The Adversary Round (Optional)**
  *   **Verdict:** **Drop it.**
  *   **Reason:** An adversary introduces *strategic uncertainty* (Game Theory), not *aleatory uncertainty* (Chance). If an adversary reads your card, the "Objective Chance" becomes dependent on your credence, which creates a paradox (Newcomb-like). It muddies the water between "Chance" and "Prediction." Stick to the machine.

