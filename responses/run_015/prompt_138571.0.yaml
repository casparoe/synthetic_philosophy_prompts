  ## VI. Facilitator Cheat Sheet (The "Wrong Answers")

  **Participant:** "I wrote 0.5 in Stage 1 because I didn't know."
  **You:** "You were given the chance. Ignoring known information is irrational. That's why your score was low."

  **Participant:** "In Stage 3, the box still says 80%. Why change?"
  **You:** "The box reports the *marginal* chance (the average). The Lamp reports the *conditional* chance. If I tell you a die is loaded (6 is 50%), but then I show you the die is actually fair (6 is 16%), do you bet on 50%? The Lamp told you the 'die' was in the 'Hi' setting."

  **Participant:** "This is just Bayesian updating. Why do we need 'Chance'?"
  **You:** "Good question. If you think Chance *just is* frequency, then yes. But if Chance is a physical propensity, the Principal Principle tells you how to map that physical fact to your mind. Stage 3 shows that physical facts (the Setting) can be hidden behind other physical facts (the Lamp)."

  **Participant:** "I don't have credences that precise (0.887 vs 0.80)."
  **You:** "Fair. But notice the gap is large (almost 10 points). You don't need precision to see the direction. If you know the Lamp makes Red *more* likely, your number must go *up* from 0.80. Staying at 0.80 is the error."

  ---

  ## VII. Final Note on the "One-Off" Tension
  You asked: *"I don't see how to keep the 'write the number you'd want if this were the only trial ever' framing without the scoring pressure quietly being aggregate pressure."*

  **Solution:** In the Stage 1 Debrief, say this:
  *"The scoring rule uses squares to punish you over many rounds. But ask yourself: In Round 1, before you knew the future, was 0.8 the right number? Yes. Not because it would win you points later, but because it was the only number that respected the information you had *then*. The scoring rule is just a tool to reveal that alignment. The norm holds for the single case; the score just proves you violated it."*

  This separates the *justification of the norm* (single-case alignment) from the *demonstration of the cost* (aggregate scoring).
