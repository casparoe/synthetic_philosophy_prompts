answer: |-
  ### 10-Bullet Arc Sketch

  1.  **Immediate Entry (0–5m):** No intro lecture. Participants sit, receive index cards and "Score Sheets." You state the goal: maximize points by matching your numbers to reality.
  2.  **Stage 1: The Fixed Box (5–25m):** Box labeled "RED 80%". Five live trials. Participants write a credence (0–1) each round. You reveal outcomes from a sealed, pre-generated list. Scores calculated.
  3.  **Stage 1 Debrief (25–30m):** Quick tally. Highlight that deviating from 0.8 (due to "hunches") lowered scores. Establish the baseline norm: *When chance is known, credence matches chance.*
  4.  **Stage 2: The Hidden Switch (30–50m):** Box label covered. You announce the setting is drawn from {50%, 100%} with equal probability *per round*. Five live trials. Participants must average the chances (0.75) rather than guess the setting.
  5.  **Stage 2 Debrief (50–55m):** Compare scores. Show that treating credence as *expected chance* outperforms guessing the specific chance. Distinguish *chance* (world) from *credence* (mind).
  6.  **Stage 3: The Lamp (55–75m):** Box labeled "RED 80%" again. A lamp flashes before the draw. Handout provides historical data: Lamp correlates with outcomes, but marginal rate is still 80%. Participants commit to a credence given the Lamp state.
  7.  **Stage 3 Scoring (75–80m):** Reveal the "true" outcome for the specific Lamp state shown (pre-determined). Score them. Those who stuck to 0.8 lose to those who conditionalized on the Lamp.
  8.  **Mechanism Reveal (80–85m):** Open the "Black Box" diagram. Show the causal structure: Lamp → Setting → Outcome. The 80% is a marginal average, not the conditional chance.
  9.  **Theoretical Mapping (85–90m):** Introduce "Principal Principle" and "Admissible Evidence." Map Stage 1 (direct deference), Stage 2 (expected chance), Stage 3 (conditional deference).
  10. **Closing Limitations (90m):** Acknowledge the scoring rule relies on long-run convergence, but the norm binds the single case. Distribute reading list.

  ---

  # Session Plan: Chance, Credence, and the Box

  **Facilitator:** [Your Name]
  **Time:** 90 Minutes
  **Audience:** Mixed (Undergrad/Grad/Econ)
  **Topic:** Normative constraints on credence given objective chance.

  ## I. Materials List

  1.  **The Box:** A physical container (opaque) with a slot to drop a ball/token.
      *   *Prep:* Inside, place a mechanism (or simply a bag) that allows you to control the probability. For this session, *you* will draw from a pre-generated list to simulate the box to ensure transparency.
      *   *Label:* Large print: **"OBJECTIVE CHANCE OF RED: 0.80"**.
  2.  **Pre-Generated Outcome Lists (Sealed Envelopes):**
      *   **Envelope A (Stage 1):** 5 outcomes. (e.g., R, R, B, R, R). *Constraint:* Must look random, roughly 80%.
      *   **Envelope B (Stage 2):** 5 outcomes based on hidden settings. (See Handout).
      *   **Envelope C (Stage 3):** 1 outcome corresponding to the specific Lamp state you will show.
  3.  **Index Cards:** 15 per person (for writing credences).
  4.  **Score Sheets (Handout 1):** One per person. Columns for Round, Reported Credence, Outcome, Score.
  5.  **Stage 3 Data Sheet (Handout 2):** The frequency table (see Math Section).
  6.  **Projector Slides:** Minimal. Timer. Instructions.
  7.  **Play Money/Points:** 1 point = $1 (fake) or Prize for highest score.
  8.  **Sealed "Mechanism" Diagram:** Envelope containing the causal graph for Stage 3, opened only at the end.

  ## II. Timeline & Script

  | Time | Stage | Action | Facilitator Script (Key Lines) |
  | :--- | :--- | :--- | :--- |
  | **00–05** | **Setup** | Hand out Score Sheets. No intro lecture. | "Welcome. We are running three betting games. Your goal is to maximize your score. On your index card, write a number between 0 and 1 representing how confident you are the ball will be RED. 1 means certain, 0 means impossible." |
  | **05–25** | **Stage 1** | **Fixed Chance.** 5 Rounds. <br>1. Write card.<br>2. Collect cards.<br>3. Reveal outcome from Envelope A.<br>4. Score. | "The box says 80%. That is the objective chance. It does not change. <br>*(After Round 1)*: Calculate your score: $100 \times (1 - (YourNumber - Outcome)^2)$. If Red (1) and you wrote 0.8, score is 96. If Blue (0) and you wrote 0.8, score is 36." |
  | **25–30** | **Debrief 1** | Quick calc. | "Look at your scores. If you wrote 0.8 every time, you have a stable average. If you wrote 0.9 because you 'felt lucky', check your score on the losses. The penalty for overconfidence on a loss is severe." |
  | **30–50** | **Stage 2** | **Hidden Setting.** 5 Rounds. <br>Cover "80%" label. <br>Announce: "Setting is 50% or 100%, chosen by coin flip each round." | "The label is covered. Each round, a coin decides the setting. You don't see the coin. You only know the mix. What number do you write now? Do not try to guess the coin. Write the number that maximizes your expected score." |
  | **50–55** | **Debrief 2** | Compare strategies. | "The chance was either 0.5 or 1.0. But your credence should be 0.75. Why? Because your credence tracks your *expectation* of the chance, not the chance itself (which you don't know)." |
  | **55–75** | **Stage 3** | **The Lamp.** <br>1. Show Lamp State (ON).<br>2. Hand out Data Sheet.<br>3. Commit Credence.<br>4. Reveal Outcome (Envelope C). | "Box says 80% again. But now a Lamp flashes before the drop. Here is data from 300 past runs. The Lamp is part of the machine's history. It is not a crystal ball. Given the Lamp is ON, what is your credence?" |
  | **75–80** | **Scoring 3** | Calculate Stage 3 score. | "If you wrote 0.80, you likely scored lower than someone who wrote 0.89. Why? Because the 80% on the box is an average, but the Lamp tells you which average you are in." |
  | **80–85** | **Reveal** | Open Mechanism Envelope. | "Here is the machine. Wheel spins (Hi/Lo). Lamp indicates Wheel. Ball drops based on Wheel. The 80% is the *marginal* chance. The Lamp gives you *admissible evidence* about the specific chance." |
  | **85–90** | **Theory** | Name the principles. | "Stage 1 was the **Principal Principle**: Credence = Chance. Stage 3 refines it: Credence = Chance *given admissible evidence*. If you have evidence about the chance itself, you must update." |

  ## III. Handout Text

  ### Handout 1: Score Sheet
  **Name:** ___________________

  **Scoring Rule (Brier):**
  *   If Outcome is RED (1): Score = $100 \times (1 - (1 - YourNumber)^2)$
  *   If Outcome is BLUE (0): Score = $100 \times (1 - (0 - YourNumber)^2)$
  *   *Example:* You write 0.8. Outcome RED. Score = $100 \times (1 - 0.04) = 96$.
  *   *Example:* You write 0.8. Outcome BLUE. Score = $100 \times (1 - 0.64) = 36$.

  | Round | Stage | Your Credence | Outcome (0/1) | Score |
  | :--- | :--- | :--- | :--- | :--- |
  | 1.1 | Box (80%) | | | |
  | 1.2 | Box (80%) | | | |
  | ... | ... | | | |
  | 2.1 | Hidden | | | |
  | ... | ... | | | |
  | 3.1 | Lamp | | | |

  **Total Score:** _______

  ### Handout 2: Stage 3 Historical Data
  **Machine Status:** Label reads "RED 80%".
  **Indicator:** Lamp (Flashes ON or OFF before ball drop).
  **Data:** 300 Previous Runs.

  | Lamp State | Total Runs | RED Outcomes | BLUE Outcomes | Frequency of RED |
  | :--- | :--- | :--- | :--- | :--- |
