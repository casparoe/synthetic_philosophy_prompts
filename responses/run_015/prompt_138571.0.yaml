  ## IV. The Math (For Your Eyes Only)

  **Stage 3 Mechanism Parameters:**
  *   **States:** $S \in \{Hi, Lo\}$. Prior $P(Hi) = 0.5$.
  *   **Chances:** $P(Red | Hi) = 0.95$. $P(Red | Lo) = 0.65$.
      *   *Marginal Check:* $0.5(0.95) + 0.5(0.65) = 0.475 + 0.325 = 0.80$. (Matches Box Label).
  *   **Lamp Signal:** $P(Lamp | Hi) = 0.8$. $P(Lamp | Lo) = 0.2$.
      *   *Marginal Lamp:* $0.5(0.8) + 0.5(0.2) = 0.5$. (Balanced data).
  *   **Conditional Chance (The "Right" Answer):**
      *   $P(Hi | Lamp) = \frac{0.8 \times 0.5}{0.5} = 0.8$.
      *   $P(Red | Lamp) = P(Red|Hi)P(Hi|Lamp) + P(Red|Lo)P(Lo|Lamp)$
      *   $= 0.95(0.8) + 0.65(0.2) = 0.76 + 0.13 = \mathbf{0.89}$.
  *   **Handout Data Construction (300 Runs):**
      *   **Hi + Lamp:** 120 runs. (114 Red, 6 Blue).
      *   **Hi + No Lamp:** 30 runs. (29 Red, 1 Blue). *Adjusted for integer counts.*
      *   **Lo + Lamp:** 30 runs. (19 Red, 11 Blue).
      *   **Lo + No Lamp:** 120 runs. (78 Red, 42 Blue).
      *   **Totals:**
          *   Lamp On: 150 runs. Red: $114+19=133$. Rate: $133/150 = 0.887$.
          *   Lamp Off: 150 runs. Red: $29+78=107$. Rate: $107/150 = 0.713$.
          *   Grand Total: 300 runs. Red: $240$. Rate: $0.80$.

  **Pre-Commitment Protocol:**
  1.  Generate the lists using a public seed (e.g., "Bitcoin Block Hash #800,000") before the session.
  2.  Print the lists. Seal them in Envelopes A, B, C.
  3.  Show the sealed envelopes to the class at the start. "These outcomes are fixed. I cannot change them."
  4.  For Stage 3, you must show the "Lamp ON" condition. Ensure Envelope C contains a RED outcome (probability 0.89) to reward the correct theorists, OR acknowledge the risk of variance. *Better:* Use the 300-run history as the "truth" for the scoring of Stage 3. Tell them: "In this specific trial, the machine behaves according to the conditional frequency." (i.e., treat the 0.887 as the truth for scoring purposes to avoid bad luck punishing correct theory).

