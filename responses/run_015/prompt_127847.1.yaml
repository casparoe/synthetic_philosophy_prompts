answer: |-
  1. The Setup

  Consider a researcher analyzing spectral properties in quantum field theory using an infinite-dimensional Hilbert space, a structure physically uninstantiated yet formally consistent. Initially, they treat this space as a completed totality to prove the existence of a ground state via a non-constructive compactness argument. This proof requires the space to possess a fixed, objective structure where limits necessarily reside, independent of human construction. Later, to address renormalization anomalies, the same researcher treats the space as a malleable formal scaffold. They modify the inner-product axioms to allow indefinite metrics, viewing the original positive-definite structure not as a fixed truth but as a mutable convention suited for approximation. The practice demands the space be both a rigid container guaranteeing existence and a flexible tool subject to revision, toggling between ontological solidity and instrumental fluidity within a single research program.

  2. The Conceptual Issue

  For the platonist, the Hilbert space is a discovered entity with intrinsic properties. If the inner product's positive-definiteness is an essential feature of this object, modifying it for convenience implies either that the original object was misidentified or that distinct objects are being conflated. The platonist cannot easily explain how a mind-independent reality permits axiomatic revision without contradiction, as the object's nature should dictate the axioms, not vice versa. Conversely, the nominalist views the space as a linguistic construct or useful fiction. However, the initial non-constructive proof relies on the space exerting objective constraint; the element exists because the space forces it, not because we defined it. If the space is merely invented, the necessity grounding the existence claim evaporates into syntactic permission. The nominalist struggles to account for the resistance the structure offers during the existence proof while maintaining its status as a mutable human artifact during the axiom modification. For the platonist, this purity demands strict consistency; for the nominalist, this abstraction really demands utility. The conflict lies in the switch: the same symbol sequence denotes a rigid truth in one line of proof and a negotiable rule in another. Consequently, the ontology appears fragmented by the very methods used to explore it.

  3. A Constructed Diagnosis

  This suggests a contextual ontology where mathematical status shifts with methodological intent. Rather than forcing a single metaphysical category, one might argue that the space functions as a stable fiction during existence proofs, granting it temporary objectivity to secure results, and reverts to instrumental formalism during axiomatization. However, this risks making truth relative to proof technique. A sharper diagnosis posits that the ambiguity reveals mathematics operates on modal potentiality rather than actual being. The space is neither fully real nor purely invented, but a field of coherent possibilities. The tension arises only when demanding a static ontology for a dynamic practice. Thus, the boundary issue dissolves if one accepts that mathematical objects acquire ontological weight only relative to the specific inferential goals they serve, resisting a unified metaphysical classification. The object is a node in a network of practices, not a standalone entity.
