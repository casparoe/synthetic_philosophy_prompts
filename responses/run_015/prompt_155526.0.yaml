      *   *Requirement 5: Reverse Phi Compatibility.* In Reverse Phi, contrast reverses. Motion is perceived in the *opposite* direction. A revision theory must explain how motion vectors and color fills interact when the motion signal contradicts the physical displacement.

  4.  **Identifying the "Dealbreaker":**
      *   What kills most theories? Usually, it's the **Content vs. Timestamp Decoupling** combined with **Channel-Specific Latencies**.
