      *   **Tone:** Professional, precise, peer-to-peer (neurophysiologist to AI), avoiding condescension or oversimplification.

  2.  **Deconstruct the Color Phi Phenomenon:**
      *   *Standard Phi:* Dot A (Red) $\rightarrow$ Dot B (Green). Percept: Red dot moves and turns Green mid-path. No intermediate color physically exists.
      *   *The Problem:* How does the brain know to generate the intermediate color *before* the second stimulus arrives, or does it rewrite the memory of the first stimulus *after* the second arrives?
      *   *Orwellian:* Experience happens one way, memory is rewritten later. (Post-hoc fabrication).
      *   *Stalinesque:* Experience is constructed late (after all data is in) but presented as if it happened in real-time. (Delayed construction).
      *   *Neuro Constraints:* V1 latency is significant. Conscious perception lags neural input. Yet, we perceive synchrony with the world.

  3.  **Drafting the Requirements List (The "Spec"):**
      *   *Requirement 1: Temporal Binding Window.* The theory must define the integration window. Phi happens within specific ISIs (Inter-Stimulus Intervals). If too short, fusion; too long, succession. The theory needs to explain *why* revision only happens in this window.
