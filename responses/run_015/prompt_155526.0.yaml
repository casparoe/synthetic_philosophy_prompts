prompt: |-
  ok so i retired from neurophysiology last year and now im trying to make sense of the color phi illusion — you know, dot moves and changes color but there was never an actual intermediate hue shown. people talk about orwellian vs stalinesque revisions: one says the brain rewrites memory after the fact, the other says it builds the experience late but stamps it with an earlier timestamp. i want the full spec for what a theory of this revision actually has to do, not just handwaving.

  specifically, what cases must it cover? standard phi, reverse phi (color shifts opposite direction), and this cross-channnel thing where red-green phi feels smoother than blue-yellow phi because the opponent channnels have different temporal integration windows — thats from my old lab, not sure philosophers deal with it. it also cant collapse the distinction between revising the perceptual content vs just revising the time-tag. and it needs to sit ok with v1 latency being arround 80-100 ms while the percept is still locked to the stimilus onset, not the neural arrival.

  give me the requirements list, with why each is a real constraint and not just prejudice, tell me which single one is the dealbreaker that kills most current theories, and flag which are negotiable. also a quick table scoring orwellian vs stalinesque against the list. dont need a bibliography — i cant access journals from my couch anyway. just the criteria, since thats where the thinking actually is.
reasoning: |-
