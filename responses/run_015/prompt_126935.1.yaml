prompt: |-
  I'm giving the toast at my advisor's retirment dinner next friday. She's an AI philosopher who spent thirty years arguing LLMs are discursive simulators, not agents — she has this specific framework she calls "ascriptive surrogacy" where a system can function as an epistemic stand-in for an agent without possessing agency, and she thinks LLMs do exactly that but we keep misreading the surrogacy as ontology. Half the room are her grad students and AI ethics people who know every paper; the other half are her family, who think she spends all day talking to chatbots. I need about four minutes. The philosophical idea has to do real structural work: I can't say she built "thinking machines" or that she "discovered digital minds," because she'd hate that, but I also can't make her career sound like glorified autocomplete. I want the toast to land as affection and respect for both halves. Can you write it? It should weave in her surrogacy idea naturally — not as a lecture — and maybe include one moment where the family can understand why this distinction mattered to her without needing the jargon.
