answer: |-
  Stop trying to judge intent and start auditing the symmetry of their evidentiary standards.

  ### The Procedure: Epistemic Symmetry Audit (ESA)
  **Timebox:** 15 Minutes total.
  **Goal:** Determine if a user's argumentation structure prevents resolution by design.

  **Step 1: Isolate the Standard (2 Minutes)**
  Identify the specific requirement the accused is imposing on their opponent to prove their point (e.g., "provide a peer-reviewed study," "state my position to my satisfaction," "show me data from this year").
  *   **Action:** Write this standard down in one sentence.
  *   **Stop Point:** If no specific standard is identified and the complaint is purely about "vibes" or "tone," close the ticket as **No Action (Tone Issue)** unless it violates separate harassment policies.

  **Step 2: The Reversal Test (3 Minutes)**
  Check the accused's own posts in the current thread (and immediately preceding ones).
  *   **Question:** Did the accused meet this same standard when making their own claims?
  *   **Pass:** They provided equivalent evidence for their own claims or explicitly exempted themselves with a stated reason accepted by neutral observers.
  *   **Fail:** They made claims without evidence while demanding it from others, or applied a stricter version of the standard to the opponent.
  *   **Stop Point:** If **Fail**, mark **1 Point**. If the asymmetry is extreme (e.g., demanding proof while offering conspiracy theories), mark **2 Points** and proceed to Decision.

  **Step 3: The Update Test (5 Minutes)**
  Scan the current thread and a quick 2-minute scan of their recent history (last 3 months).
  *   **Question:** Have they conceded a point, corrected a fact, or acknowledged validity in an opposing argument during this period?
  *   **Pass:** Yes, at least one clear instance of updating a view or conceding a sub-point.
  *   **Fail:** No. Their position remains monolithic despite counter-arguments.
  *   **Stop Point:** If **Fail**, mark **1 Point**.

  **Step 4: The Source Test (5 Minutes)**
  Review the links and citations provided by the accused in the current thread.
  *   **Question:** Do any of their sources originate outside their known ideological ecosystem (e.g., not just one outlet, not just internal community links)?
  *   **Pass:** They cite diverse sources or engage with specific arguments from the opposing side rather than generic strawmen.
  *   **Fail:** All sources are from a single outlet or echo chamber, and they dismiss outside sources without engagement.
  *   **Stop Point:** If **Fail**, mark **1 Point**.

  **Decision Matrix**
  *   **0 Points:** **No Action.** This is a good-faith disagreement. Close ticket.
  *   **1 Point:** **Warning.** Issue a standard warning about "Constructive Engagement." Explain specifically which test was failed (e.g., "You demanded evidence you did not provide").
  *   **2+ Points:** **Escalate to Ban Review.** This indicates structural bad faith. Draft the ban explanation focusing on the *behavioral asymmetry*, not the opinion.
  *   **Special Case (Popular/Long-term):** If the user scores 2+ Points but is a high-value community member, **Escalate to Appeals Committee.** This is a values decision (community health vs. individual contribution), not an evidence decision.

  ### Evaluation of Current Tests
  *   **Keep:** "Would you accept this standard if sides were reversed?" (This is Step 2: The Reversal Test). It is the only objective measure of asymmetry.
  *   **Keep (Modified):** "Can they state the other side's case?" (Integrate into Step 4: The Source Test). If they cannot engage with specific opposing arguments, they fail the Source Test.
  *   **Discard:** "Have they ever conceded something costly in front of their own allies?" This is too subjective ("costly") and hard to verify in 15 minutes. Replace with Step 3: The Update Test (any concession).
  *   **Discard:** "Sincerity checks." You cannot audit beliefs, only behaviors.

  ### Case Runs

  **Case 1: The Popular Contributor (Polite, one outlet, never concedes, agrees with mod)**
  *   **Step 1 (Standard):** Demands high-quality evidence for opposing views.
  *   **Step 2 (Reversal):** **Fail.** Makes strong claims without linking evidence, relying on reputation. (1 Point)
  *   **Step 3 (Update):** **Fail.** "Never in three years conceded a point." (1 Point)
  *   **Step 4 (Source):** **Fail.** "Posts only links from one outlet." (1 Point)
  *   **Score:** 3 Points.
  *   **Verdict:** **Escalate to Appeals Committee.** The procedure identifies this user as epistemically closed and structurally unreachable. Because they are popular and polite, a ban is a values decision regarding community health vs. individual status. The procedure forces you to acknowledge they are failing the standards of discourse regardless of their popularity or your political agreement. You must accept the procedure's finding: they are operating in bad faith by the community's metrics, even if unintentionally.

  **Case 2: The Rude Retractator (Rude tone, retracted flawed study, argues with own side)**
  *   **Step 1 (Standard):** Engages on evidence.
  *   **Step 2 (Reversal):** **Pass.** Cites studies, admits when studies are flawed.
  *   **Step 3 (Update):** **Pass.** "Wrote a long public retraction." (0 Points)
  *   **Step 4 (Source):** **Pass.** "Argues with people on his own side." Indicates engagement outside immediate tribe. (0 Points)
  *   **Score:** 0 Points.
  *   **Verdict:** **No Action (Bad Faith).** Close the bad faith ticket. Issue a separate warning for **Tone** if it violates harassment rules. The procedure successfully separates epistemic bad faith from interpersonal rudeness.

  **Case 3: The Gatekeeper (Newer, demands perfect steelman indefinitely)**
  *   **Step 1 (Standard):** "Produce a statement of your position strong enough that I would endorse it."
  *   **Step 2 (Reversal):** **Fail.** This standard is functionally impossible to meet indefinitely; applying it only to opponents is asymmetry. (2 Points - Extreme)
  *   **Step 3 (Update):** **Fail.** Uses the demand to avoid engaging with actual arguments. (1 Point)
  *   **Step 4 (Source):** **Fail.** Treats failure to meet demand as proof of bad faith rather than engaging with available evidence. (1 Point)
  *   **Score:** 4 Points.
  *   **Verdict:** **Escalate to Ban Review.** This is a known bad-faith tactic (moving goalposts). The procedure identifies the demand itself as the violation of symmetry.

  ### Limitations and Risks

  **Bad Faith vs. Ignorance**
  This procedure cannot separate malicious intent from deep ignorance. A user who is genuinely unaware of outside sources (Case 1) scores the same as a user deliberately ignoring them. This is acceptable. The cost to the community is the same: a conversation that cannot resolve. You are moderating the *impact* on discourse, not the *sin* in the heart.

  **Reflexivity (Turning it on You)**
  The procedure can and must be turned on you and your allies. If you demand evidence from opponents that you do not provide, you fail Step 2. If you never concede points, you fail Step 3. If you only share links from one outlet, you fail Step 4. If you use this procedure only to punish opponents while exempting your side, you are violating the Reversal Test yourself, and the Appeals Committee should remove you. The procedure is not a weapon to win arguments; it is a constraint to ensure the argument is possible at all. If you find yourself constantly scoring 2+ points on your own side, the problem is not the procedure, but your community's composition.
