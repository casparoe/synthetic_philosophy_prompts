      *   *Make sure to distinguish* between the *philosophical justification* and the *pragmatic function*. The user asks if the practice *requires* the theory. I should argue it *aligns* with a specific theory (Capacitarianism) but is *sustainable* via Consequentialism.
      *   *The "Divided Self" point:* Be careful not to conflate psychological Dual-Process with metaphysical dualism. The regulations treat the "autopilot" as an instrument of the "pilot," not a separate entity.

  6.  **Final Review against User Prompts:**
      *   Philosophical commitments? (Addressed: Agency, Control, Time).
