answer: |-
  To the Pledge Assembly Panel,

  You require a theory of promissory obligation that functions as a tool for adjudication, not merely as a metaphysical account. A theory that cannot generate a verdict without psychoanalyzing the parties or appealing to contested moral first principles is useless to you. Below is the specification list derived from your caseload, followed by an analysis of partisan traps, incompatibilities, and a scorecard of existing theories.

  ### I. Desiderata for an Adjudicable Theory of Promising

  **1. The Independence from Reliance Condition**
  *   **Motivating Case:** *The Pledge No One Relied On.* A member pledges support; the beneficiary forgets the pledge exists but later claims the breach.
  *   **Specification:** The obligation must attach at the moment of valid pledging, regardless of whether the beneficiary changed their position, suffered detriment, or even knew of the pledge.
  *   **Status:** **Non-negotiable.** (A reliance-based theory would dismiss this complaint, undermining the register's function as a binding public record.)

  **2. The Adjudicative Publicity Constraint**
  *   **Motivating Case:** *The Coerced or Half-Understood Pledge* vs. *The Vague Pledge.*
  *   **Specification:** The criteria for validity and content must be accessible via public, outer-state facts (text, witness testimony, context) without requiring definitive access to the pledger's private mental states or the beneficiary's subjective expectations.
  *   **Status:** **Non-negotiable.** (You cannot rule based on "what he truly meant" if that contradicts the public record.)

  **3. The Second-Party Standing Condition**
  *   **Motivating Case:** *The Pledge to Future/Unidentified Beneficiaries* and *The Deceased Beneficiary.*
  *   **Specification:** The theory must explain who holds the right to complain. It must allow for rights to vest in a class ("any member") or transfer to heirs, without requiring a specific interpersonal relationship at the time of pledging.
  *   **Status:** **Non-negotiable.** (Without this, you cannot determine *locus standi*.)

  **4. The Normative Novelty Condition (Contrastive)**
  *   **Motivating Case:** *The Redundant Pledge* and *The Self-Pledge.*
  *   **Specification:** The theory must distinguish promising from (a) acknowledging a pre-existing duty (redundant) and (b) forming a private intention (self-pledge). A promise must create a *new* obligation owed to another, not merely restate an existing one or bind oneself.
  *   **Status:** **Non-negotiable.** (Otherwise, every moral duty becomes a pledge, and every resolution becomes a contract.)

  **5. The Beneficiary Sovereignty Condition**
  *   **Motivating Case:** *The Released Pledge* vs. *The Refused Release.*
  *   **Specification:** The beneficiary must hold the power to waive the obligation (release), but the pledger cannot unilaterally dissolve it. However, this sovereignty must have limits (see Moral Permissibility).
  *   **Status:** **Non-negotiable.** (This distinguishes promising from commanding or threatening.)

  **6. The Semantic Determinacy Condition**
  *   **Motivating Case:** *The Indexed Pledge* and *The Vague Pledge.*
  *   **Specification:** The content of the obligation must be fixable by the time of adjudication. If the pledge relies on a formula or external index, the theory must specify whether the obligation is to *follow the procedure* or to *achieve the outcome*, based on public conventions of interpretation.
  *   **Status:** **Non-negotiable.** (You cannot enforce "support as needed" without a rule for translating that into pounds or hours.)

  **7. The Proportionality Sensitivity (Grading)**
  *   **Motivating Case:** *The Grading Problem.* A pledge to buy coffee vs. a pledge to donate a kidney.
  *   **Specification:** The theory should allow the *weight* of the obligation to scale with the cost to the pledger, or at least allow for a "disproportionate burden" defense, rather than treating all valid pledges as having identical *pro tanto* force.
  *   **Status:** **Preference of the Moderates.** (Absolutists prefer uniform force; pragmatists prefer grading.)

  **8. The Moral Permissibility Constraint**
  *   **Motivating Case:** *The Immoral Pledge.* A pledge to help someone commit fraud.
  *   **Specification:** No obligation can be generated to perform an act that is independently morally forbidden.
  *   **Status:** **Non-negotiable.** (The Assembly cannot be an engine for enforcing wrongdoing.)

  ---

  ### II. Partisan Traps & Incompatibilities

  You asked which demands you are tempted to make that are actually philosophically partisan. Adopting these will bias your panel toward specific schools of thought and alienate members who hold reasonable alternative views.

  **The Partisan Demands:**
  1.  **Derivability from Non-Normative Facts Alone:** (Naturalism). Demanding that the obligation be reducible to physical acts (speech/writing) without invoking normative concepts excludes views that see promising as inherently normative.
  2.  **Reducibility to a Single Underlying Reason:** (Monism). Demanding that *all* pledges bind for the same reason (e.g., only harm, or only autonomy) excludes pluralist accounts.
  3.  **Uniform Pro Tanto Force:** (Absolutism). Demanding that a trivial pledge binds as tightly as a costly one (ignoring the *Grading Problem*) favors Kantian/Scanlonian views over consequentialist or contractarian ones.
  4.  **No Appeal to Social Practice:** (Individualism). Demanding that a pledge binds even if no social convention of promising exists excludes Practice/Convention theories (Rawls/Prichard).
  5.  **Verdict in Every Case:** (Completeness). Demanding a theory that never leaves a case undecided (e.g., *Vague Pledge*) is unrealistic; some cases may be non-justiciable gaps.
  6.  **Lexical Priority of Promise:** (Strictness). Demanding that a small welfare gain *never* defeats a promise excludes moderate consequentialist overrides.

  **The Incompatible Pair:**
  **The Adjudicative Publicity Constraint** vs. **The Voluntariness Condition.**
  *   **Conflict:** To ensure *Publicity*, you must rely on outer signs (signatures, public filing). To ensure *Voluntariness* (ruling on *Coerced/Half-Understood* pledges), you often must inquire into inner states (duress, capacity, understanding).
  *   **Resolution:** You must prioritize *Publicity* for the sake of the register's stability, accepting that some coerced pledges may stand if the coercion was not publicly evident, OR you must accept that adjudication will sometimes require intrusive inquiry into mental states, reducing determinacy.

  **The Single Most Exclusionary Requirement:**
  **The Independence from Reliance Condition.**
  This requirement does the most work in excluding candidate theories. It immediately disqualifies pure **Reliance Theories** (e.g., early Scanlon, Fried's reliance-adjacent views) which ground the duty in the harm caused by disappointment. If your panel must uphold the *Pledge No One Relied On*, any theory that grounds the obligation in detriment is unusable.

  ---

  ### III. Theoretical Scorecard

  **Practice and Convention Theories (e.g., Rawls, Prichard)**
  *   *Verdict:* **High Utility.**
  *   *Pros:* Excellent for *Indexed/Vague Pledges* (conventions fix meaning) and *Publicity* (rules are social facts). Handles *Redundant Pledges* well (practice distinguishes promise from duty).
  *   *Cons:* Struggles with *Coerced Pledges* (if the practice is followed, is it valid?) and *Self-Pledges* (why doesn't the practice apply to oneself?).

  **Reliance Theories (e.g., Scanlon's Principle F)**
  *   *Verdict:* **Unusable.**
  *   *Pros:* Good for *Immoral Pledges* (harm-based limits).
  *   *Cons:* Fails the **Independence from Reliance** non-negotiable. Cannot adjudicate the *Pledge No One Relied On* without distorting the definition of reliance.

  **Expectation and Assurance Theories (e.g., Shiffrin, T.M. Scanlon's Principle D)**
  *   *Verdict:* **Moderate Utility.**
  *   *Pros:* Strong on *Beneficiary Sovereignty* and *Second-Party Standing*. Distinguishes promising from predicting.
  *   *Cons:* Struggles with *Unidentified Beneficiaries* (who is assured?) and *Publicity* (often relies on subjective expectations of assurance).

  **Normative Power Views (e.g., Hart, Heath, H.L.A. Hart)**
  *   *Verdict:* **High Utility.**
  *   *Pros:* Best fit for *Released/Refused Release* (power to waive) and *Standing* (rights transfer). Explains *Normative Novelty* clearly.
  *   *Cons:* Metaphysically "spooky" (how does speaking create duty?). Can struggle with *Grading* (powers are often binary: valid/invalid, not weighted).

  **Recommendation:** A hybrid of **Normative Power** (for standing/waiver) and **Practice** (for content/interpretation) best satisfies your non-negotiable adjudicative constraints while avoiding the Reliance trap.
