  I was discussing with my friends after class — I'm in a 19th-century philosophy of the body seminar — and we got into Nietzsches actual eating habits. He had chronic stomach issues and basically lived on bland, restricted food for years, plus he wrote those fragments linking digestion to the health of the soul or whatever. Anyway, it made me wonder what he'd make of modern stuff like the obesity epidemic and these biohackers wearing continuous glucose monitors while doing 18-hour fasts. Would he see that as real self-overcoming, or just another form of modern decadence dressing itself up as discipline?

  There's also this idea from nutritional psychiatry that your gut bacteria literally produce a ton of your serotonin and dopamine, so your mental life is partly being manufactured bottom-up by microbes in your gut. Given his whole thing about transcending bodily conditions to become who you are, does that microbiome science break his framework, or does it actually prove you have to master those physical conditions first? I'm not asking for a reading list or citations, just whether there's a coherent Nietzschean response here or if modern biology just collapses the analogy he was using.
