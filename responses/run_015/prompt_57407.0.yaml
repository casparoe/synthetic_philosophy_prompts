  The panel will place the weights and scale on indefinite loan under a joint-curatorial partnership.

  The panel's prior rulings establish a two-factor matrix governing restitution: the legitimacy of acquisition and the vitality of custodianship. First, a "Provenance Threshold" dictates that violent or coercive taking (the 1897 raid, the colonial ordinance, the 1874 confiscation) creates a presumption against museum retention, whereas legal permits or explicit consent clear the museum of initial liability. Second, a "Vitality Requirement" dictates that full title transfer (Return) is reserved for claimants demonstrating continuous, active cultural practice (the working guild, the rites-performing family), while lapsed use or static display purposes (the unused vestments, the cultural centre, the memorial) restrict the remedy to access-based solutions (Loan) or refusal.

  Applied to the new case, the Provenance Threshold predicts a Return, as the confiscation during the burning of the capital is morally equivalent to the raid in the first case and worse than the colonial ordinance in the third. However, the Vitality Requirement predicts a Loan or Refusal, as the defunct guild and dead trade align with the lapsed use of the vestments rather than the active rituals of the ancestral figures. The panel is most plausibly running on the principle that *cultural vitality is a necessary condition for full restitution*, treating the museum as a steward of extinct practices rather than merely a warehouse for stolen property. This reading favors Loan because, in every prior instance where active custodianship was absent, the panel denied full return regardless of other factors; the joint-curatorial element acknowledges the dirty provenance (distinguishing it from the vestments) without violating the principle that title follows function.

  If the panel were to rule Return, it would commit itself to the principle that *illegitimate acquisition voids all subsequent considerations of use*, asserting that property rights corrected by justice trump the functional utility of the object. To separate these candidates in future drafting, you should add a case involving a sacred object legally donated by a mission society (Clean Provenance) but still essential for an active sacrament performed by a continuous community (Active Custodianship). A ruling of Return would prove the panel prioritizes Vitality over Provenance, while a ruling of Refusal would confirm that clean title is an absolute bar to restitution regardless of cultural need.
