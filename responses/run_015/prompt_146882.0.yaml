  *Art. 115 Limitation:* This is the trickiest part. Art. 115 is 22 years old. It says provisions lapse after 20 years. It is in Ch VI (not exempt). Therefore, Art. 115 has lapsed. If Art. 115 has lapsed, it is not law. If it is not law, provisions do not lapse. But if they do not lapse, Art. 115 is still in the text... This is a "self-consuming" clause. I must advise that the procedure cannot resolve this.

