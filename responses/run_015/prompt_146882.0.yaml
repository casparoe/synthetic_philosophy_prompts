answer: |-
  **MEMORANDUM OF PROCEDURE**
  **TO:** Deputies, Rules Committee
  **FROM:** Procedural Clerk
  **SUBJECT:** Certification of Constitutional Amendments (Arts. 112–116)
  **DATE:** October 26, 2023

  ### I. OPERATIONAL DECISION SEQUENCE

  Deputies must run the following questions in order. Do not proceed to the next question until the current one is settled.

  **Q1: The Procedural Baseline (Art. 112)**
  *   **Question:** Was the resolution adopted by an absolute majority of all members at two readings separated by not less than forty days?
  *   **Sufficient Answer:** Certified vote counts and journal dates matching Art. 112.
  *   **Burden:** Sponsor of the resolution (provides certified journal extracts).
  *   **Standard:** Strict compliance. "Substantial compliance" is insufficient.
  *   **Stop-Point:** If **NO**, certify **OUT OF ORDER**. End inquiry.

  **Q2: The Entrenchment Check (Art. 113)**
  *   **Question:** Does this resolution amend or repeal a provision currently designated as "entrenched"?
  *   **Sufficient Answer:** Review of the authoritative consolidated text. If the target provision is marked "entrenched," Art. 113 applies.
  *   **Burden:** Clerk's Office (maintains text).
  *   **Standard:** Textual status.
  *   **Stop-Point:** If **YES**, proceed to Q3. If **NO**, proceed to Q4.

  **Q3: The Entrenched Procedure (Art. 113)**
  *   **Question:** Was the resolution adopted at a *third* reading by a *two-thirds* majority of all members, and did the resolving clause explicitly state the target provision "is entrenched" (if creating entrenchment)?
  *   **Sufficient Answer:** Certified vote count (2/3+) and journal entry showing 3rd reading.
  *   **Burden:** Sponsor.
  *   **Standard:** Strict compliance.
  *   **Stop-Point:** If **NO**, certify **OUT OF ORDER**. (Note: Art. 113 protects itself; repealing Art. 113 requires this procedure).

  **Q4: The Retroactivity Bar (Art. 114)**
  *   **Question:** Does the text claim an effective date prior to adoption, or purport to validate past acts that were defective when performed?
  *   **Sufficient Answer:** Textual review of effective date clauses and curative language.
  *   **Burden:** Clerk's Office.
  *   **Standard:** Any express or implied retroactive effect.
  *   **Stop-Point:** If **YES**, certify **OUT OF ORDER**. (Art. 114 binds all amendments, including amendments to Art. 114).

  **Q5: The Lapse Clock (Art. 115)**
  *   **Question:** Is the provision being amended located in Chapters I–III, or has it been reaffirmed within twenty years?
  *   **Sufficient Answer:** Check adoption date against current date.
  *   **Burden:** Clerk's Office.
  *   **Standard:** If >20 years and Ch. IV–VI, the provision has lapsed.
  *   **Handoff:** If **YES (Lapsed)**, the provision is no longer law. Do not certify amendment of a non-existent provision. **REFER TO FLOOR** with notation: "Target provision prima facie lapsed under Art. 115."

  ---

  ### II. CERTIFICATION VOCABULARY AND TEXT HANDLING

  **1. CERTIFIED IN ORDER**
  *   **Condition:** All Questions (Q1–Q5) answered satisfactorily.
  *   **Action:** Print in consolidated text immediately upon adoption.

  **2. CERTIFIED IN ORDER WITH NOTATION**
  *   **Condition:** Procedural requirements met, but text contains legally ineffective surplusage (e.g., purports to bind future Assemblies without Art. 113 mechanism) or targets a provision of doubtful validity (e.g., Art. 115 paradox).
  *   **Action:** Print in text. Append bracketed annotation: *[Clerk's Note: Legal efficacy of Clause X doubtful under Art. Y.]*

  **3. CERTIFIED OUT OF ORDER**
  *   **Condition:** Failure at Q1, Q3, or Q4.
  *   **Action:** Do not print. Return to sponsor. Record reason in Committee minutes.

  **4. REFERRED TO FLOOR**
  *   **Condition:** Failure at Q5 (Lapse) or issue of political legitimacy (e.g., Assembly overruling prior certification).
  *   **Action:** Submit note to Chair. Note must read: *"Procedural validity established, but substantive validity contingent on Floor determination of [Issue]."*

  **Rule for Doubtful Provisions (Art. 116):**
  If a provision is adopted despite an "Out of Order" certification (via Assembly overrule), Art. 116 requires the Clerk to maintain the text. Print the provision but annotate: *[Adopted contrary to Clerk's Certification dated X.]* Later dates prevail in conflicts.

  ---

  ### III. DESK GUIDE (ONE-PAGER)

  **RULES COMMITTEE AMENDMENT CHECKLIST**
  *Do not deviate from this sequence.*

  1.  **READINGS & VOTE (Art. 112):** 2 Readings? 40+ Days apart? Absolute Majority?
      *   [ ] YES → Go to 2.
      *   [ ] NO → **STOP. OUT OF ORDER.**
  2.  **ENTRENCHMENT STATUS (Art. 113):** Is the target provision currently entrenched? Is Art. 113 itself being amended?
      *   [ ] NO → Go to 3.
      *   [ ] YES → **CHECK:** 3rd Reading? 2/3 Majority? Magic Words ("is entrenched")?
          *   [ ] YES → Go to 3.
          *   [ ] NO → **STOP. OUT OF ORDER.**
  3.  **RETROACTIVITY (Art. 114):** Does it take effect before adoption? Does it cure past defects?
      *   [ ] NO → Go to 4.
      *   [ ] YES → **STOP. OUT OF ORDER.**
  4.  **LAPSE (Art. 115):** Is target in Ch. I–III? Adopted <20 years ago?
      *   [ ] YES → **CERTIFY IN ORDER.**
      *   [ ] NO → **REFER TO FLOOR.** (Provision lapsed).

  **CERTIFICATION LABELS:**
  *   **IN ORDER:** Clean pass.
  *   **IN ORDER (NOTATION):** Pass, but add warning note to text.
  *   **OUT OF ORDER:** Reject.
  *   **REFERRED:** Pass to Floor for political/validity decision.

  **HANDOFF PROTOCOL:**
  When referring, attach a slip reading: *"Procedural requirements met. Validity contingent on Floor determination of [Specific Article]. Reliance risk: [High/Medium/Low]."*

  ---

  ### IV. APPLICATION TO LIVE INSTRUMENTS

  **INSTRUMENT A: The "Permanent" Threshold**
  *   **Facts:** Art. 112 process used (Abs Maj, 2 readings). Raises threshold to 3/5. Clause (ii) says threshold "shall not be amended or repealed."
  *   **Analysis:**
      *   Q1 (Art. 112): Passed.
      *   Q2 (Entrenchment): The resolution attempts to make clause (i) unamendable. However, Art. 113 is the *sole* mechanism for entrenchment. It requires the resolution to state the provision "is entrenched" and subjects it to a 3rd reading/2/3 rule for future change. Clause (ii) uses different language ("shall not be amended") and does not trigger the Art. 113 mechanism.
      *   Effect: Under the text, a future Assembly can amend clause (i) using standard Art. 112 procedure. Clause (ii) is legally ineffective surplusage; it attempts to bind a future sovereign without the Charter's required key.
      *   Q4 (Retroactivity): None.
  *   **Certification:** **CERTIFIED IN ORDER WITH NOTATION.**
  *   **Draft Note Language:**
      > "Certified In Order with Notation. The resolution complies with Art. 112. However, Clause (ii) purports to render Clause (i) unamendable without utilizing the entrenchment mechanism of Art. 113. As the resolution does not state Clause (i) 'is entrenched' nor impose the Art. 113 third-reading requirement, Clause (ii) has no legal effect on future amendment procedures. Future amendments to Clause (i) may proceed under Art. 112."

  **INSTRUMENT B: The "Lock and Key" Repeal**
  *   **Facts:** Art. 112 process used (Abs Maj, 2 readings). Repeals Art. 113 and Art. 96 (Entrenched).
  *   **Analysis:**
      *   Q2/Q3 (Entrenchment): Art. 96 is entrenched. Art. 113 is self-entrenched ("This Article may be amended or repealed only at such a third reading").
      *   The sponsors argue Art. 113 falls simultaneously with Art. 96. This is incorrect under the text. To repeal Art. 113, you must follow Art. 113. You cannot use Art. 112 to destroy the very rule that protects Art. 113.
      *   Because the procedure used (Art. 112) is insufficient to repeal Art. 113, the repeal of Art. 113 is invalid. Consequently, Art. 96 remains entrenched, and its repeal is also invalid.
      *   Lawful Sequencing: The Assembly must adopt a resolution under **Art. 113 procedure** (3rd reading, 2/3 majority). That single resolution could repeal both Art. 113 and Art. 96.
  *   **Certification:** **CERTIFIED OUT OF ORDER.**
  *   **Draft Note Language:**
      > "Certified Out of Order. Art. 113 states it 'may be amended or repealed only at such a third reading' with a two-thirds majority. This resolution was adopted under Art. 112 (two readings, absolute majority). As the procedure is insufficient to repeal Art. 113, the repeal of Art. 113 is invalid. As Art. 113 remains in force, Art. 96 remains entrenched and cannot be repealed by this instrument. *Path to Validity:* Sponsors may reintroduce this measure complying with Art. 113 procedure (third reading, two-thirds majority)."

  **INSTRUMENT C: The Retro-Cure**
  *   **Facts:** Validates three instruments adopted 3 years ago (1 reading each). Repeals Art. 114 retroactively.
  *   **Analysis:**
      *   Q4 (Retroactivity): Art. 114 states amendments have "no retroactive effect." This proposal seeks to repeal Art. 114 *with retroactive effect* to cure the old instruments.
      *   Paradox: You cannot use a retroactive amendment to authorize retroactive amendments. Art. 114 binds the amendment power itself.
      *   Reliance: Ministries have relied on the old instruments. This is a political reliance issue, but legally the instruments were defective (Art. 112 requires 2 readings).
      *   Art. 115 Issue: Art. 115 is 22 years old (Ch. VI). It has prima facie lapsed. If Art. 115 has lapsed, the "20-year clock" is no longer law. However, certifying this requires determining if Art. 115 is dead, which Art. 115 itself governs.
  *   **Certification:** **CERTIFIED OUT OF ORDER (as to retroactivity); REFERRED TO FLOOR (as to validation).**
  *   **Draft Note Language:**
      > "Certified Out of Order regarding Art. 114 repeal; Referred to Floor regarding validation. Art. 114 prohibits retroactive effect for *any* amendment, including an amendment to Art. 114. The proposed retroactive repeal is procedurally barred. The validation of prior instruments cures a procedural defect (single reading) that existed at adoption. This is a question of legislative legitimacy, not procedural validity. *Text Handling:* The three prior instruments remain in the consolidated text with annotation: *[Adopted under Certification C-2023. Validity contingent on Floor action.]*"

  ---

  ### V. LIMITATIONS OF THIS PROCEDURE

  This procedure is a tool for textual compliance, not a resolver of constitutional paradoxes. Two specific pressure points limit its authority:

  **1. The Art. 115 Paradox (Self-Lapse)**
  Art. 115 is located in Chapter VI and was adopted 22 years ago. Under its own terms, it has lapsed. If Art. 115 has lapsed, it is not law. If it is not law, no provisions lapse. If no provisions lapse, Art. 115 remains in force. This procedure cannot resolve this loop.
  *   **Operational Consequence:** We must treat Art. 115 as *prima facie* lapsed for the purpose of Q5, but acknowledge that the Assembly may vote to reaffirm it. If the Assembly ignores the lapse warning, Art. 116 (later date prevails) effectively keeps the text alive, but the logical foundation is unstable. We annotate, we do not adjudicate.

  **2. Legitimacy vs. Legality (The Overrule Power)**
  The Assembly may overrule our certification by simple majority. This procedure certifies *validity under the text*, not *political legitimacy*.
  *   **Operational Consequence:** If the Assembly overrules an "Out of Order" certification, Art. 116 compels us to print the provision. We must annotate the defect. We cannot withhold the text. The procedure protects the *record*, not the *Charter's integrity*. If the Assembly chooses to violate the Charter using the Charter's own amendment power, this office records the violation but does not block it.

  **3. Identity of the Charter**
  This procedure presupposes that the Charter remains the "same" Charter after amendment. It offers no test for when an amendment is so radical it constitutes a new constitutional order (revolution). If the Assembly adopts a resolution replacing the entire Charter, this procedure treats it as an amendment. That is a political question beyond the Clerk's textual mandate.
