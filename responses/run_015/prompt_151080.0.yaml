prompt: |-
  You are the senior curator of origin narratives at a national museum, and your oversight board requires you to classify every proposed gallery narrative—before funding is released—into one of three bins: "historical account with legendary overlay," "legend with a recoverable historical kernel," or "legend without recoverable history." You face roughly twenty-five proposals per quarter, you have two hours per case, you must sign the classification personally, and you have no specialist consultant on call for every submission. Your board rejects vague appeals to "scholarly consensus"; they want a written, reusable decision procedure that any trained curator can run, with explicit points where the procedure stops with a "no" and explicit points where it hands off to human judgment because the question is one of values rather than facts. Write this procedure as an ordered flowchart in words: the specific tests to run in sequence, what counts as a sufficient answer at each stage, where the path branches, and which distinctions must survive simplification and which can be dropped. Ground the procedure in the epistemic distinction between evidential independence—material or textual correlation that does not depend on interpreting the narrative through itself—and narrative dependence, together with a measure of legendary accretion velocity, that is, the rate at which supernatural, heroic, or anachronistic motifs accumulate relative to the earliest attestation layer. The procedure must be honest about which steps are judgment calls dressed up as checklists, and it must flag the cases it cannot settle. Then apply it to three proposals: (1) a gallery framing the Trojan War as a historical conflict at Hisarlık with epic overlay; (2) a gallery presenting King Arthur as a post-Roman military leader behind the medieval romances; and (3) a gallery on the Exodus that treats the narrative as a national-origin legend with no recoverable historical kernel. Include one case where the procedure delivers a classification you expect the board will reject, and explain exactly which feature of the case forces that result. Finally, state clearly what the procedure cannot do—where it will misfire, what kinds of proposals it should never be used for, and why a curator still needs to override it. Keep the deliverable practical: no bibliographies, no citation requests, no appeals to authority that a curator without web access could not verify in the two-hour window.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Senior Curator of Origin Narratives at a National Museum.
      *   **Task:** Create a written, reusable decision procedure (flowchart in words) to classify gallery narratives into three bins:
          1.  Historical account with legendary overlay.
          2.  Legend with a recoverable historical kernel.
          3.  Legend without recoverable history.
      *   **Constraints:**
          *   ~25 proposals/quarter, 2 hours/case.
          *   No specialist consultants on call.
          *   Board rejects vague "scholarly consensus."
          *   Must be runnable by any trained curator.
          *   Must distinguish between *evidential independence* (material/textual correlation independent of the narrative) and *narrative dependence*.
          *   Must include a measure of *legendary accretion velocity* (rate of supernatural/heroic motif accumulation).
          *   Must identify judgment calls vs. checklist items.
          *   Must flag unsettled cases.
          *   Must apply to three specific cases (Trojan War, King Arthur, Exodus).
          *   Must include one case where the board is expected to reject the classification (and explain why).
          *   Must state limitations (where it misfires, when to override).
          *   Practical: No bibliographies, no web-dependent appeals to authority.

  2.  **Deconstruct the Classification Bins:**
      *   *Bin A (Historical + Overlay):* Core events are verified independently; narrative adds flavor/myth. (e.g., Battle of Hastings).
      *   *Bin B (Legend + Kernel):* Narrative is mostly mythic, but specific people/places/events have independent verification. (e.g., Gilgamesh, potentially Arthur).
      *   *Bin C (Legend - No History):* No independent verification of core claims; functions purely as identity/ethiology. (e.g., Romulus and Remus, potentially Exodus).

  3.  **Develop the Epistemic Framework:**
      *   *Evidential Independence:* Can we prove $X$ happened without quoting the story that says $X$ happened? (Archaeology, contemporary inscriptions, external records).
      *   *Narrative Dependence:* Relying on the text itself to prove the text.
      *   *Accretion Velocity:* How fast did the story get "weird"? Slow = likely historical memory. Fast = likely invention.

  4.  **Drafting the Procedure (The Flowchart in Words):**
      *   *Goal:* Keep it under 2 hours. Needs to be decisive but honest about ambiguity.
      *   *Step 1: Define the Core Claim.* What exactly are we testing? (e.g., "A war happened" vs. "Achilles killed Hector").
      *   *Step 2: The Independence Test.* Is there non-narrative evidence?
      *   *Step 3: The Accretion Test.* How quickly did miracles/monsters appear?
      *   *Step 4: The Anachronism Check.* Do details match the claimed time or the writing time?
      *   *Step 5: Classification & Flagging.*

      *Refining the Steps for the Prompt's Requirements:*
      *   Need explicit "Stop/No" points.
      *   Need to highlight "Judgment Calls."
      *   Need to incorporate "Accretion Velocity."

  5.  **Drafting the Application (The Three Cases):**
      *   *Case 1: Trojan War.*
          *   Evidence: Hittite records (Wilusa/Taruisa), archaeology at Hisarlık (destruction layers).
          *   Narrative: Homer (written centuries later, gods involved).
          *   Classification: Likely Bin 2 (Legend + Kernel) or Bin 1 (Historical + Overlay) depending on how specific the gallery is. Let's aim for Bin 2 to show nuance. Actually, standard scholarship often leans toward "War happened (Bin 1/2 border)," but the *Iliad* is heavily legendary. Let's classify as *Legend with a recoverable historical kernel* because the specific *narrative* of the Iliad is not history, but the *event* of a conflict at Hisarlık is supported.
      *   *Case 2: King Arthur.*
          *   Evidence: *Annales Cambriae* (much later), Gildas (no name), archaeology (ambiguous).
          *   Narrative: Geoffrey of Monmouth (giants, Merlin).
          *   Classification: *Legend with a recoverable historical kernel* is the romantic view, but strict epistemic procedure might push it to *Legend without recoverable history*. The prompt asks for one case the Board will reject. If I classify Arthur as "Legend without history," the Board (likely wanting national myth) might reject it. Or if I classify Exodus as "Legend without history," that's standard scholarship but controversial. Let's make the *Arthur* case the one where the procedure says "No Kernel" but the Board wants "Kernel." Or vice versa.
          *   *Decision:* The prompt asks for "one case where the procedure delivers a classification you expect the board will reject." Boards often prefer national cohesion. Classifying Arthur as "Legend without recoverable history" (Bin 3) is epistemically honest but politically painful. Classifying Exodus as Bin 3 is standard archaeology but theologically painful. Let's go with *Arthur* as Bin 3 (No Kernel) based on strict independence, anticipating the Board wants Bin 2 (Kernel) for tourism/identity.
      *   *Case 3: Exodus.*
          *   Evidence: No Egyptian records, no Sinai archaeology, anachronisms (camels, place names).
          *   Classification: *Legend without recoverable history.*

  6.  **Refining the "Board Rejection" Case:**
      *   If I classify Arthur as Bin 3 (No History), the Board might say "But the *Annales* mention Badon!"
      *   If I classify Exodus as Bin 3, the Board might say "But faith communities..." (Wait, the Board rejects vague appeals, but they might fear public backlash).
      *   *Better angle:* The procedure forces a Bin 3 on Arthur due to lack of *independent* contemporary evidence. The Board prefers Bin 2 because "Kernel" sells tickets and unites the nation. I will explicitly state this tension.

  7.  **Addressing Limitations & Overrides:**
      *   Where does it fail? Recent history (too much data), living traditions (ethical issues), purely literary value.
      *   Why override? Ethical considerations, new evidence emerging, political necessity (though the procedure tries to minimize this).

  8.  **Review against Constraints:**
      *   *2 hours/case?* The steps must be quick checks, not deep research.
      *   *No web access?* Rely on general curatorial knowledge + museum library basics.
      *   *Epistemic distinction?* Explicitly named in steps.
      *   *Accretion Velocity?* Included as a specific metric.
      *   *Flowchart style?* Numbered steps with "If Yes/No" branching.

  9.  **Final Polish:**
      *   Tone: Professional, bureaucratic but intellectually rigorous.
      *   Structure: Procedure first, then Applications, then Limitations.
      *   Check: Did I explain *why* the Board rejects one? Yes (Political/Cultural value vs. Epistemic strictness).

      *(Self-Correction during drafting)*: Make sure the "Accretion Velocity" isn't just a buzzword. I need to define how to measure it in 2 hours. *Solution:* Compare the date of the event claimed vs. the date of the earliest text containing supernatural elements. Large gap + high magic = High Velocity.

      *(Self-Correction on Arthur)*: If I classify Arthur as Bin 3, is that defensible in 2 hours? Yes, because contemporary evidence is non-existent. The *Annales* are 6th century written in 10th. Gildas doesn't name him. So "Independent Evidence" fails.

      *(Self-Correction on Exodus)*: This is the most controversial. But archaeologically, it's the strongest Bin 3 candidate. However, the prompt asks for *one* case the Board rejects. Arthur is a safer bet for "Board Rejection" in a National Museum context (national hero vs. fiction) than Exodus (religious sensitivity). I'll stick with Arthur as the friction point.

      *(Wait, re-reading prompt)*: "Include one case where the procedure delivers a classification you expect the board will reject."
      Okay, I need to make sure the procedure *leads* to a result the Board dislikes.
      Board likely wants: Arthur = Kernel (Bin 2).
      Procedure likely yields: Arthur = No History (Bin 3).
      Reason: Lack of evidential independence.

      Let's assemble the document.

  10. **Final check of the "Flowchart in Words":**
      *   Needs to look like a protocol.
      *   Needs to mark "Judgment Call" zones.
      *   Needs to mark "Stop" zones.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Oversight Board, National Museum
  **FROM:** Senior Curator of Origin Narratives
  **SUBJECT:** Decision Procedure 001-N (Origin Narrative Classification)
  **DATE:** October 26, 2023

  ### I. PURPOSE AND SCOPE
  This document establishes the mandatory decision procedure for classifying proposed gallery narratives regarding national or cultural origins. All proposals must be assigned to one of three bins prior to funding release:
  1.  **Bin A:** Historical account with legendary overlay.
  2.  **Bin B:** Legend with a recoverable historical kernel.
  3.  **Bin C:** Legend without recoverable history.

  **Constraints:** This procedure is designed for a single curator operating within a two-hour window per case, without external specialist consultation. It prioritizes *evidential independence* over narrative coherence.

  ---

  ### II. THE DECISION PROCEDURE (FLOWCHART IN WORDS)

  **START:** Receive Proposal. Identify the **Core Claim** (the specific historical event, person, or migration the gallery asserts occurred).

  **STEP 1: The Independence Test (Evidential Independence)**
  *Action:* Search museum library catalogs and standard reference works for material or textual evidence of the Core Claim that *does not* derive from the narrative tradition itself.
  *   *Query:* Is there contemporary archaeology, inscriptions, or external records (from a rival or neutral culture) that corroborate the Core Claim without referencing the legend?
  *   *Criteria for "Yes":* Evidence dates within ±50 years of the claimed event AND originates from a source not invested in the legend's truth (e.g., enemy records, administrative ledgers, destruction layers).
  *   *Criteria for "No":* Evidence is later than ±50 years, OR comes only from the narrative tradition (e.g., chronicles written centuries later that repeat the story), OR is ambiguous (e.g., a place name that could be coincidental).
  *   **BRANCH:**
      *   If **YES**: Proceed to Step 2.
      *   If **NO**: Proceed to Step 3.

  **STEP 2: The Overlay Assessment (For "Yes" in Step 1)**
  *Action:* Compare the Independent Evidence against the Narrative Details.
  *   *Query:* Do the supernatural, heroic, or idealized elements appear in the *earliest* layer of the narrative, or do they appear later?
  *   *Metric:* **Legendary Accretion Velocity.** Calculate the time gap between the Core Claim (verified in Step 1) and the earliest text containing supernatural motifs.
      *   *Low Velocity:* Gap < 100 years; supernatural elements are minor or metaphorical.
      *   *High Velocity:* Gap > 100 years; supernatural elements are central to the causality (gods intervene, monsters exist).
  *   **JUDGMENT CALL ZONE:** Determining if a motif is "metaphorical" or "supernatural" requires curatorial interpretation of the text's intent.
  *   **BRANCH:**
      *   If **Low Velocity**: Classify as **Bin A (Historical account with legendary overlay)**. STOP.
      *   If **High Velocity**: Classify as **Bin B (Legend with a recoverable historical kernel)**. STOP.

  **STEP 3: The Kernel Search (For "No" in Step 1)**
  *Action:* Since independent evidence for the Core Claim failed, search for independent evidence of *any* constituent element (a specific leader, a specific battle site, a specific migration route) that anchors the story in reality.
  *   *Query:* Is there *any* independent evidence for a specific person or place named in the narrative that matches the claimed time period?
  *   *Criteria for "Yes":* As per Step 1 (Contemporary, External).
  *   *Criteria for "No":* No contemporary external evidence exists for any specific element.
  *   **BRANCH:**
      *   If **YES**: Proceed to Step 4.
      *   If **NO**: Classify as **Bin C (Legend without recoverable history)**. STOP.

  **STEP 4: The Anachronism Check (For "Yes" in Step 3)**
  *Action:* Review the narrative details surrounding the verified element.
  *   *Query:* Do the verified elements support the *Core Claim*, or are they isolated fragments swallowed by later invention?
  *   *Metric:* **Narrative Dependence Ratio.** Does the story require the legend to make sense of the evidence, or does the evidence make sense of the story?
      *   *Evidence leads:* The artifact/record implies the event; the story matches. (Favors Bin B).
      *   *Story leads:* The story claims the event; we found a pot that *might* fit. (Favors Bin C).
  *   **JUDGMENT CALL ZONE:** Weighing the probative value of a fragment against the weight of the legendary narrative. This is not a factual test but a probabilistic assessment.
  *   **BRANCH:**
      *   If **Evidence leads**: Classify as **Bin B (Legend with a recoverable historical kernel)**. STOP.
      *   If **Story leads**: Classify as **Bin C (Legend without recoverable history)**. STOP.

  **FLAGGING:** If the curator spends >90 minutes on Step 1 or Step 3 without a clear Yes/No, the case must be flagged as **"Epistemically Unsettled."** Funding is withheld pending Board review.

  ---

  ### III. APPLICATION TO PROPOSED GALLERIES

  Below are the results of applying Procedure 001-N to three current proposals.

  #### Case 1: The Trojan War (Hisarlık Conflict)
  *   **Core Claim:** A military conflict occurred between a coalition of Aegean states and the city of Wilusa/Troy in the Late Bronze Age.
  *   **Step 1 (Independence):** **YES.** Hittite archives (contemporary) mention "Wilusa" and "Ahhiyawa" in conflict. Archaeology at Hisarlık shows destruction layers (Troy VIh/VIIa) consistent with warfare circa 1200 BCE.
  *   **Step 2 (Overlay):** **High Velocity.** The event is c. 1200 BCE. The earliest full narrative (Homer) is c. 750 BCE (450-year gap). The narrative relies on divine intervention and single combat.
  *   **Classification:** **Bin B (Legend with a recoverable historical kernel).**
  *   **Rationale:** The war likely happened (Independent Evidence), but the *Iliad's* specific narrative is heavily accrued legend (High Velocity). The gallery must frame the war as historical but the *story* as epic.

  #### Case 2: King Arthur (Post-Roman Defense)
  *   **Core Claim:** A Romano-British war leader named Arthur commanded forces against Saxon invaders c. 500 CE.
  *   **Step 1 (Independence):** **NO.** No contemporary inscriptions, no Saxon records, no administrative ledgers name "Arthur." Gildas (c. 540 CE) mentions the Battle of Badon but does not name the commander.
  *   **Step 3 (Kernel Search):** **NO.** The *Annales Cambriae* (10th Century) mention Arthur, but this is 400 years post-event and dependent on narrative tradition. Archaeology (e.g., Cadbury Castle) shows occupation but no inscriptions linking to "Arthur."
  *   **Classification:** **Bin C (Legend without recoverable history).**
  *   **Rationale:** The procedure halts at Step 3. There is zero evidential independence for the specific person or command structure. The "kernel" is a hypothesis, not an evidentiary fact.
  *   **Board Rejection Warning:** I anticipate the Board will reject this classification.
      *   **Why:** The Board views Arthur as a foundational national unifier. Bin C undermines the gallery's premise of "The First King."
      *   **Forcing Feature:** The strict requirement for *contemporary* external evidence (±50 years) in Step 1 and Step 3. If the Board accepts 10th-century chronicles as "independent" enough for a 6th-century event, they are violating the epistemic distinction between *narrative dependence* and *evidential independence*. The procedure forces a "No" because the evidence is circular (later texts quoting earlier lost texts which likely quoted oral tradition).

  #### Case 3: The Exodus (National Origin)
  *   **Core Claim:** A mass migration of Israelites escaped Egypt and wandered the Sinai for 40 years c. 13th Century BCE.
  *   **Step 1 (Independence):** **NO.** No Egyptian records mention the event (despite detailed record-keeping of slaves/runaways). No Sinai archaeology shows a population of hundreds of thousands traversing the desert in this period.
  *   **Step 3 (Kernel Search):** **NO.** While some place names (e.g., Raamses) are historically accurate to the period, they are anachronistic in the text (written later) and do not prove the *event*. No independent evidence confirms the specific leader (Moses) or the mass migration.
  *   **Classification:** **Bin C (Legend without recoverable history).**
  *   **Rationale:** Fails Step 1 and Step 3. The narrative functions as an etiology (origin story) rather than a historical record.
  *   **Note:** This classification aligns with current archaeological consensus but requires careful gallery text to respect cultural significance without asserting historical fact.

  ---

  ### IV. LIMITATIONS AND OVERRIDE PROTOCOLS

  This procedure is a tool for epistemic triage, not absolute truth. Curators must recognize where it will misfire.

  **1. Where the Procedure Misfires:**
  *   **Oral Cultures:** The "±50 years" rule in Step 1 penalizes cultures with strong oral traditions but no contemporary writing. A "No" in Step 1 for an oral history does not mean "False," it means "Unverifiable by this metric."
  *   **Negative Evidence:** In Step 3, absence of evidence is treated as evidence of absence. In archaeology, non-permanent structures (tents, wood) leave no trace. The procedure biases toward stone and clay.
  *   **Recent History:** For events <200 years ago, "Legendary Accretion" is hard to measure because living memory interferes. The procedure is optimized for deep time.

  **2. When to Override:**
  *   **Ethical Necessity:** If classifying a living community's origin as Bin C causes demonstrable harm or violates repatriation agreements, the Curator must override to Bin B with a disclaimer. Epistemic rigor cannot supersede human rights.
  *   **New Evidence:** If a proposal includes evidence not in the standard reference works (e.g., a newly deciphered tablet), the Curator must pause the 2-hour clock and consult a specialist. Do not run the procedure on data you cannot verify.

  **3. The "Judgment Call" Warning:**
  *   Steps 2 and 4 contain **Judgment Call Zones**. These are not checklists; they are interpretive acts. If a curator feels they are forcing a "Yes" to satisfy a donor or a "No" to avoid controversy, they must sign the **"Epistemically Unsettled"** flag instead. It is better to delay funding than to classify falsely.

  **Signed:**
  *Senior Curator of Origin Narratives*
