      *   *Why it bites:*
          1.  (Validities) Trivial truths shouldn't count as substantive knowledge.
          2.  (Closure) Deduction takes effort; we miss consequences.
          3.  (Equivalence) Framing effects; $p$ and $q$ might mean the same thing extensionally but differ cognitively.
      *   *Fixes:*
