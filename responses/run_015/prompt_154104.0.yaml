prompt: |-
  I'm on the staff of a reconciliation NGO that runs structured dialogue circles between ex-combatants from conflicts where the justice of the cause is still disputed — think occupation vs resistance scenarios, but I'm not naming specific ones. We keep fighting over whether the moral equality of combatants means we seat everyone symetricaly, or whether fighting for an unjust cause strips you of that equal standing. I need an actual decision procedure my facilitators can run before each session: a sequence of questions they ask about the specific participant, with clear stopping rules for when we treat them as morally equal vs when we apply asymmetrical framing, and explicit flags for where the answer is a value judgment not a factual check.

  The procedure needs to be grounded in the independence thesis — that jus in bello rights don't depend on jus ad bellum — but it also has to deal with the revisionist pushback that unjust-side combatants aren't innocent in the same way. So build in checks for: direct vs indirect responsibility for the unjust war, the combatant's actual epistimic access to the justice of the cause (the epistimic risk problem — if we can't verify belief states, what do we default to?), and whether they engaged in ordinary fighting vs direct war crimes. For each check, say what counts as a passing answer, what fails it, and where the procedure just throws up its hands and asks the facilitator to make a call.

  Then apply it to three people we're actually seeing next month: a conscripted foot soldier from the aggressor side who says he believed state propaganda; a volunteer strategist from that same side who designed logistics but never pulled a trigger; and a defensive fighter who killed prisoners in reprisal. I want the procedure to give me answers I might hate — especially if it says the volunteer strategist still gets symmetrical seating — and I want you to mark exactly where the procedure breaks down because we're guessing at internal mental states. Don't ask me to cite Walzer or anyone else; I just need the logic made runnable, with the hard edges left visible, since I'm running these twice a week with no research staff.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Reconciliation NGO running dialogue circles between ex-combatants from disputed conflicts (occupation vs. resistance).
      *   **Problem:** Internal conflict on staff about moral equality of combatants (MEC) vs. asymmetrical standing based on *jus ad bellum* (justice of the cause).
      *   **Goal:** A runnable decision procedure (sequence of questions/checks) for facilitators to use *before* each session.
      *   **Requirements:**
          *   Grounded in the Independence Thesis (*jus in bello* independent of *jus ad bellum*).
          *   Addresses revisionist pushback (unjust combatants aren't innocent).
          *   Checks for: Direct vs. Indirect responsibility, Epistemic Access (belief states), Ordinary Fighting vs. War Crimes.
          *   Clear stopping rules (Equal vs. Asymmetrical framing).
          *   Explicit flags for value judgments vs. factual checks.
          *   Application to three specific cases (Conscript, Volunteer Strategist, Defensive Fighter/Reprisal Killer).
          *   Must yield potentially uncomfortable answers (e.g., Strategist gets equal seating).
          *   Must highlight where the procedure breaks down (guessing mental states).
          *   No academic citations (Walzer, etc.), just runnable logic.

  2.  **Deconstruct the Ethical Framework:**
      *   *Independence Thesis:* Traditional Just War Theory (Walzer) says combatants on both sides have equal rights/privileges in war (*jus in bello*) regardless of who started it (*jus ad bellum*). This supports symmetrical seating.
      *   *Revisionist Critique:* Philosophers like McMahan argue that if you fight for an unjust cause, you don't have the same moral standing. You are essentially an aggressor. This supports asymmetrical framing.
      *   *The Compromise:* The NGO needs a practical way to navigate this without solving meta-ethics every Tuesday. The procedure needs to default to symmetry (for dialogue to work) but allow for asymmetry in cases of egregious moral failure (war crimes) or high-level culpability where "just following orders" doesn't hold.
      *   *Epistemic Condition:* Did they *know* it was unjust? If they were coerced or misled, their culpability is lower.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be a flowchart style, step-by-step.
      *   *Step 1: The War Crimes Veto.* If they committed clear *jus in bello* violations (torture, killing POWs), symmetry is broken regardless of *jus ad bellum*. This is the easiest filter.
      *   *Step 2: Role & Agency.* Are they a direct killer, a strategist, or a conscript? High agency = higher scrutiny.
      *   *Step 3: Epistemic Access.* Could they have known the cause was unjust? This is the hardest part (mind-reading). Need a "Reasonable Person" standard here.
      *   *Step 4: The Framing Decision.* Symmetrical (Equal Standing) vs. Asymmetrical (Aggressor/Victim dynamic).
      *   *Flags:* Need to explicitly mark where facilitators are making value judgments.

  4.  **Refining the Checks (Iterative Process):**
      *   *Check 1 (War Crimes):* Factual. Did they violate LOAC/IHL? If Yes -> Asymmetrical. If No/Unproven -> Next.
      *   *Check 2 (Agency/Role):* Factual/Mixed. Conscript vs. Volunteer. Low level vs. High level.
      *   *Check 3 (Epistemics):* Value Judgment. "Should they have known?" This is where the procedure risks breaking. Need to define the default. *Default:* Assume epistemic limitation unless evidence of high-level access exists.
      *   *Stopping Rule:* If they pass Check 1 (no war crimes) and Check 3 (plausible epistemic limitation), they get Symmetrical seating *even if* their side was the aggressor. This honors the Independence Thesis for the sake of dialogue.

  5.  **Applying to the Three Cases:**
      *   *Case A: Conscripted Foot Soldier (Aggressor).*
          *   War Crimes? No.
          *   Role? Low agency, coerced.
          *   Epistemics? Propaganda, low access.
          *   Result: Symmetrical. (Matches Independence Thesis).
      *   *Case B: Volunteer Strategist (Aggressor).*
          *   War Crimes? No (logistics).
          *   Role? High agency, volunteer.
          *   Epistemics? High access. *Crucial Test.*
          *   Result: This is the uncomfortable one. If we stick to Independence Thesis, logistics isn't a war crime. If we stick to Revisionism, he's culpable. The prompt asks for a procedure grounded in Independence Thesis *but* dealing with revisionist pushback. To make it runnable, we likely have to grant symmetry *unless* the strategy itself involved targeting civilians. If it was just moving ammo, he gets symmetry. This will be the "answer I might hate."
      *   *Case C: Defensive Fighter (Reprisal Killer).*
          *   War Crimes? Yes (killing prisoners).
          *   Role? Defender (Just Cause).
          *   Result: Asymmetrical. *Jus in bello* violation trumps *jus ad bellum* right. This flips the script: The "Good Guy" loses moral equality because of conduct.

  6.  **Addressing the "Breakdown" Points:**
      *   Must explicitly state where we are guessing beliefs.
      *   Must highlight the tension between "Volunteer" and "Propaganda."

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Runnable logic? Check.
      *   Clear stopping rules? Check.
      *   Value judgment flags? Check.
      *   Uncomfortable answers included? Check.

  8.  **Writing the Output:** (Self-Correction during drafting)
      *   *Tone:* Professional, operational, clinical but ethically aware.
      *   *Formatting:* Use bolding for decision points. Use [FLAG] for value judgments.
      *   *Intro:* Acknowledge the tension without resolving it philosophically.
      *   *The Protocol:* Numbered steps.
      *   *The Application:* Walk through the three cases strictly using the protocol.
      *   *The Breakdown Analysis:* Be honest about the epistemic black box.

      *(Self-Correction on Case B)*: I need to make sure the procedure doesn't just let the strategist off the hook too easily if the goal is reconciliation. However, the prompt asks for the logic to be grounded in the Independence Thesis. If I penalize the strategist too much, I violate the Independence Thesis. I must stick to the prompt's constraint: "grounded in the independence thesis." This means *jus in bello* is the primary filter. *Jus ad bellum* (aggression) is secondary. So the strategist gets symmetry unless his logistics facilitated war crimes. I will make sure this discomfort is highlighted.

      *(Self-Correction on Case C)*: Ensure the distinction is clear. Defensive fighter = Just Cause. Killing prisoners = Unjust Conduct. The procedure must prioritize Conduct over Cause for the sake of the dialogue safety.

      *(Refining the Epistemic Check)*: How do we verify belief? We can't. We have to use a "Reasonable Access" standard. Did their rank/role give them access to information contradicting the propaganda?

      *(Final Polish)*: Ensure the "Stopping Rules" are binary (Symmetrical/Asymmetrical) for the facilitator's ease.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Pre-Session Moral Standing Protocol (MS-1)

  **Purpose:** To determine seating framing (Symmetrical vs. Asymmetrical) for ex-combatants in dialogue circles.
  **Ethical Baseline:** This protocol prioritizes the **Independence Thesis** (*jus in bello* conduct determines standing) over **Revisionist Claims** (*jus ad bellum* cause determines standing), with specific exceptions for high-agency culpability.
  **Usage:** Facilitators must complete this checklist 48 hours before a session. Do not debate the philosophy during the session. Use the output to set the room.

  ---

  ## The Decision Procedure

  ### Step 1: The *Jus In Bello* Veto (Conduct Check)
  *Goal: Identify clear violations of the laws of war regardless of which side they fought for.*

  **Q1.1:** Is there credible evidence (testimony, records, admission) that this participant directly engaged in war crimes (torture, execution of prisoners, targeting civilians)?
  *   **YES:** **STOP.** Apply **Asymmetrical Framing**. Their conduct strips them of moral equality regardless of their cause.
  *   **NO:** Proceed to Q1.2.
  *   **UNVERIFIED:** Proceed to Q1.2. [FLAG: Value Judgment] *Facilitator must decide if rumors are substantial enough to treat as fact. Default to "No" to preserve dialogue space unless safety is at risk.*

  **Q1.2:** Did their specific role require them to authorize or enable war crimes (e.g., ordering indiscriminate shelling), even if they didn't pull the trigger?
  *   **YES:** **STOP.** Apply **Asymmetrical Framing**.
  *   **NO:** Proceed to Step 2.

  ### Step 2: Agency and Coercion (Role Check)
  *Goal: Assess the level of voluntary participation.*

  **Q2.1:** Was the participant conscripted, coerced, or under threat of death for non-participation?
  *   **YES:** Mark as **Low Agency**. Proceed to Step 3.
  *   **NO:** Mark as **High Agency**. Proceed to Step 3.

  **Q2.2:** Did the participant hold a rank or role that allowed them to influence strategic direction (Officer, Strategist, Logistics Lead) vs. tactical execution (Foot Soldier, Driver)?
  *   **Strategic/Influence:** Mark as **High Influence**.
  *   **Tactical/Execution:** Mark as **Low Influence**.

  ### Step 3: Epistemic Access (Belief Check)
  *Goal: Assess whether the participant could reasonably have known their cause was unjust.*
  *[FLAG: Value Judgment] This step requires guessing internal mental states. There is no factual test for belief. Use the "Reasonable Access" standard below.*

  **Q3.1:** Given their Role (Step 2), did they have access to information contradicting their side's narrative (e.g., intelligence reports, independent media, direct observation of atrocities by their own side)?
  *   **YES (High Access):** They are presumed to bear responsibility for fighting an unjust cause. Proceed to Q3.2.
  *   **NO (Low Access):** They are presumed to have acted under epistemic limitation. **Grant Symmetrical Standing.** (Stop here).
  *   **MIXED/UNCLEAR:** [FLAG: Value Judgment] Facilitator must weigh rank against propaganda intensity. *Default Rule:* If they were foot soldiers in a closed information environment, default to **Low Access**.

  **Q3.2:** (For High Access only) Did they continue to fight/enable the war after acquiring this knowledge?
  *   **YES:** Apply **Asymmetrical Framing**. (Revisionist pushback accepted here due to high agency + high access).
  *   **NO:** Apply **Symmetrical Standing**.

  ### Step 4: Final Framing Determination

  *   **Symmetrical Standing:** Seat participants as moral equals. Language should focus on "shared experience of war" and "mutual harm."
  *   **Asymmetrical Framing:** Seat participants with acknowledgment of power/culpability imbalance. Language should acknowledge "harm done" vs. "harm suffered." *Note: This does not ban them, but it changes the facilitation style.*

  ---

  ## Application to Upcoming Participants

  Here is the protocol applied to your three specific cases. Note where the logic forces uncomfortable conclusions.

  ### Case 1: The Conscripted Foot Soldier (Aggressor Side)
  *Profile:* Drafted into the army of the occupying power. Claims he believed state propaganda that they were "liberating" territory. Never harmed civilians directly.

  *   **Step 1 (Conduct):** No war crimes committed. **PASS.**
  *   **Step 2 (Agency):** Conscripted. **Low Agency.** **PASS.**
  *   **Step 3 (Epistemics):** Rank is private. Information environment was state-controlled propaganda. **Low Access.**
  *   **Protocol Result:** **Symmetrical Standing.**
  *   **Logic:** Under the Independence Thesis, his lack of *jus in bello* violations and his epistemic limitation protect his standing. The injustice of the invasion (*jus ad bellum*) is not imputed to him because he lacked the agency and knowledge to reject it.
  *   **Discomfort:** You may feel he is "guilty" by virtue of occupation. The protocol overrides this feeling to allow dialogue.

  ### Case 2: The Volunteer Strategist (Aggressor Side)
  *Profile:* Volunteered for the occupying power. Designed logistics chains for ammunition. Never pulled a trigger. No direct orders to target civilians, but supplied units that did. Claims he believed the war was legal.

  *   **Step 1 (Conduct):** No direct war crimes. Did he *enable* them? If the logistics were general supply, the answer is **NO**. If he specifically routed ammo for known massacre units, the answer is **YES**. *Assume general supply for this scenario.* **PASS.**
  *   **Step 2 (Agency):** Volunteer. **High Agency.** **High Influence.**
  *   **Step 3 (Epistemics):** As a strategist, he had **High Access**. He likely saw maps, orders, and reports that a conscript would not.
  *   **Q3.2:** Did he continue after acquiring knowledge? This is the breakdown point. He claims he didn't know.
  *   **[FLAG: Value Judgment]:** Facilitator must decide: Is a strategist's claim of ignorance credible?
      *   *If Facilitator accepts claim:* **Symmetrical Standing.**
      *   *If Facilitator rejects claim:* **Asymmetrical Framing.**
  *   **Protocol Default:** Because we cannot verify internal belief states, and because logistics are not inherently criminal, the protocol defaults to **Symmetrical Standing**.
  *   **Logic:** This is the "answer you might hate." Under the Independence Thesis, supplying ammo is not a war crime. Under the Revisionist view, he is culpable for sustaining an unjust war. The protocol prioritizes the Independence Thesis to keep him in the room without shaming him immediately, *unless* you exercise the Value Judgment flag to challenge his epistemic claim.
  *   **Breakdown Point:** We are guessing if he *really* didn't know. There is no fact that proves his internal belief.

  ### Case 3: The Defensive Fighter (Resistance Side)
  *Profile:* Fought against occupation (Just Cause). Admitted to executing two enemy prisoners in reprisal for a massacre of his village.

  *   **Step 1 (Conduct):** Executing prisoners is a war crime (*jus in bello* violation). **FAIL.**
  *   **Protocol Result:** **STOP.** Apply **Asymmetrical Framing**.
  *   **Logic:** This is the critical test of the Independence Thesis. Even though his *cause* was just (defense), his *conduct* was criminal. The protocol strips him of moral equality regarding this specific act.
  *   **Discomfort:** Staff may want to protect him because he is on the "right side." The protocol forces you to treat his moral standing as compromised relative to the ex-combatants who followed the rules.
  *   **Framing:** He cannot sit as a moral equal in a discussion about "rules of engagement" or "humanity in war." He must be framed as someone who seeks reconciliation *despite* a moral transgression, not as a blameless victim.

  ---

  ## Operational Warnings & Breakdown Analysis

  **1. The Epistemic Black Box**
  The procedure breaks down at Step 3. We cannot see inside a participant's head.
  *   **The Risk:** A participant can game the system by claiming "I didn't know" (The Conscript Defense).
  *   **The Fix:** You must use the **Reasonable Access Standard**. If a person was an Officer, the protocol assumes they *could* have known. If they claim they didn't, the Facilitator must flag this as a [Value Judgment]. Do not treat their claim as fact.
  *   **Action:** If you suspect they are lying about their knowledge, you are authorized to move them to Asymmetrical Framing based on "High Influence + Implausible Epistemic Claim."

  **2. The "Clean Hands" Paradox (Case 2)**
  The Volunteer Strategist highlights the tension between your staff's views.
  *   **Revisionist View:** He is morally tainted because the war was unjust.
  *   **Protocol View:** He is morally equal because he followed the rules of fighting.
  *   **Why this matters:** If you apply Asymmetrical Framing to him based solely on his side's cause, you violate the Independence Thesis. This will alienate participants from the Aggressor side who feel they are being judged on politics rather than conduct.
  *   **Recommendation:** Seat him Symmetrically, but monitor the dialogue. If he expresses pride in the *cause* (not just the service), intervene on the content, not the seating.

  **3. The "Dirty Hands" Paradox (Case 3)**
  The Defensive Fighter highlights the danger of romanticizing resistance.
  *   **Risk:** Staff may want to waive Step 1 for him because "he was fighting for freedom."
  *   **Protocol Constraint:** Do not waive Step 1. If you excuse war crimes for the "good side," you lose credibility with the "bad side" participants, and the dialogue collapses into propaganda.
  *   **Action:** Apply Asymmetrical Framing. Acknowledge his trauma, but do not validate his reprisal killings as morally equal to lawful combat.

  **4. Facilitator Discretion Flags**
  There are three points where you are not running an algorithm, you are making an ethical call:
  1.  **Unverified War Crimes (Q1.1):** Do you treat rumors as truth? (Default: No, unless safety risk).
  2.  **Strategist Knowledge (Q3.1):** Is his rank enough to prove he knew the cause was unjust? (Default: Yes for high command, No for mid-level).
  3.  **Coercion vs. Economic Conscription (Q2.1):** If he joined for money, not guns-to-the-head, is that coercion? (Default: No, that is Volunteer/High Agency).

  **Summary for Next Week:**
  *   **Conscript:** Symmetrical.
  *   **Strategist:** Symmetrical (unless you intervene on the Epistemic Flag).
  *   **Defensive Fighter:** Asymmetrical (due to prisoner executions).

  This procedure ensures that *conduct* matters more than *cause*, which is the only stable ground for a dialogue circle where the justice of the war is still disputed.
