  # Freqently Asked Questons

  **What is the Afterlife Continuation Foundation?**
  The Afterlife Continuation Foundation (ACF) provides existential insurance policies designed to mitigate the loss of meaning associated with potential human extinction. Our actuarial models are based on the principle that the value of current human endeavors is contingent upon the existence of future generations. We do not insure your life; we insure the future that gives your life value.

  **What happens to my half-finished symphony if everyone dies?**
  Under our Standard Continuity Package, unfinished cultural artifacts are assigned to a Preservation Trust. In the event of total species extinction, the Trust attempts to contract post-human entities or autonomous AI custodians to complete the work based on stylistic extrapolation. Please note: Completion is not guaranteed. If no successor species exists to perform the symphony, the policy pays out a lump sum to your designated heirs equivalent to the projected emotional resonance the completed work would have generated over the next three centuries. Be advised that disputes regarding the artistic integrity of AI-completed movements are binding and non-appealable.

  **Do I get a refund if aliens inherit Earth and keep culture running?**
  Refunds are processed only if the successor species fails to meet the Cultural Fidelity Threshold. If aliens inherit the Earth but delete all records of jazz music, you are eligible for a partial rebate. If they preserve human culture but modify it beyond recognition (e.g., translating all literature into pheromone sequences), this is considered a "Continuity Breach." However, if they maintain human projects with reasonable accuracy, the policy remains active. We do not issue refunds simply because humanity is no longer the dominant species, provided the "afterlife" of human labor remains intact.

  **How do you calculate the "shadow value" of futures I won't live to see?**
  Premiums are calculated using our Proprietary Shadow Value Algorithm. This metric assesses the indirect value of your current actions based on their potential ripple effects across future generations. For example, raising a child generates higher shadow value than writing a diary, as the child represents a vector for future project continuation. High-risk professions with low generative output may incur higher premiums. We adjust rates annually based on global extinction risk probabilities and collective anxiety indices.

  **Have you actually secured a post-human successor species?**
  No. Currently, the ACF has no verified agreements with any extraterrestrial civilizations, artificial superintelligences, or evolved successor species. This is classified as a "Pending Deliverable." Policyholders are reminded that the insurance protects against the *loss of meaning*, not the loss of life. The lack of a confirmed beneficiary does not invalidate the contract, as the payment structure is designed to compensate for the psychological impact of knowing the future is uninsured.

  **Why does the value of my present life depend on a future that might not exist?**
  This is the core premise of our service. According to our foundational research, you would likely cease to value your current projects if you knew humanity would end immediately upon your death. Therefore, the worth of your present existence is derivative. You are purchasing assurance that the context required to validate your life will remain operational. If the future collapses, your past loses its ROI. We simply manage that risk.

  **Where do I sign?**
  Please proceed to the Payment Portal. Note that by signing, you acknowledge that your current happiness is now a subsidized asset of the Foundation.
