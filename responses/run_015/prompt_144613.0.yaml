answer: |-
  ### The Translation

  **Move 1: The Report as Text**
  *Heterophenomenological Proposal:* Treat the subject's spoken or written account of their experience not as a transparent window into their mind, but as a constructed artifact—a text to be analyzed like any other cultural production.
  *Literary Analog:* **The Manuscript Trope (or Diegetic Document).** This occurs when a novel presents a story through letters, diary entries, or a found manuscript (e.g., *Dracula* or *Wuthering Heights*). The reader encounters the character's voice not as direct access to reality, but as a written object within the diegesis.
  *Functional Difference:* In heterophenomenology, the text is data pointing toward a biological organism existing in the real world. In the manuscript trope, the text is the primary reality of the fiction; there is no biological organism outside the words to verify against. The scientist looks *through* the text to the brain; the reader looks *at* the text to construct the character.
  *Distortion Required:* To make this fit, one must pretend the fiction writer is a field researcher collecting diaries, rather than an inventor creating them. You must distort the ontological status of the "subject," treating the character as if they were a living informant rather than a linguistic effect.

  **Move 2: The Neutral Stance**
  *Heterophenomenological Proposal:* Adopt a position of neutrality regarding the objective reality of the entities described in the text. Do not affirm or deny that the "redness" or "pain" the subject describes exists; simply record that they *believe* it exists.
  *Literary Analog:* **Unreliable Narration.** This is the technique where the narrator's account is compromised by ignorance, bias, or madness. The reader is trained to withhold full belief in the narrator's version of events, suspending judgment on the "truth" of the diegetic world until corroborated by other focalizers or structural cues.
  *Functional Difference:* The heterophenomenologist brackets reality to remain objective for the sake of third-person science. The reader of an unreliable narration brackets reality to engage more deeply with the *irony* or *tragedy* of the character's limitation. The scientist seeks to bypass the illusion to find the mechanism; the novelist seeks to inhabit the illusion to find the human truth.
  *Distortion Required:* You must distort the purpose of the suspension of disbelief. In fiction, we suspend disbelief to enter the world; in heterophenomenology, we suspend belief to keep the world at arm's length. The analog requires treating the reader's skepticism as a clinical tool rather than an aesthetic engagement.

  **Move 3: Theory of Consciousness vs. Consciousness**
  *Heterophenomenological Proposal:* The goal is not to map the actual territory of subjective experience, but to map the subject's *theory* of their subjective experience. We study the story they tell themselves about having a mind.
  *Literary Analog:* **The Gap between Focalization and Implied Author.** This is the distance between what the viewpoint character perceives (focalization) and what the structure of the work suggests is actually happening (the implied author's design). For example, a character may insist they are in love (their theory), while the plot mechanics reveal they are in lust or grief (the structural reality).
  *Functional Difference:* The heterophenomenologist discards the character's theory as a potential falsehood to be explained by neuroscience. The novelist preserves both the character's theory and the structural reality as co-existing truths. The friction between the two *is* the meaning of the work. To discard the character's "theory" (their felt experience) would be to destroy the novel's emotional core.
  *Distortion Required:* You must distort the value of the "error." In heterophenomenology, the subject's mistaken self-report is a problem to be solved. In narrative craft, the subject's mistaken self-report is the theme itself. The fit requires treating the character's interiority as a hypothesis to be falsified, rather than a world to be explored.

  ***

  ### Residue Report

  There is a significant residue that fails to translate, centering on the **eliminativist impulse** inherent in heterophenomenology.

  Dennett's method ultimately aims to deflate the authority of the first-person perspective. It suggests that the "inner movie" of consciousness is a user-illusion, a fiction generated by the brain. The "truth" lies in the heterophenomenological world (the data), not the phenomenological world (the feeling).

  In narrative craft, there is no counterpart to this elimination. Fiction is an engine for generating phenomenology, not dissolving it. When a novelist employs free indirect discourse to blend a character's voice with the narration, they are not creating a "theory of mind" to be corrected by science; they are constructing the *only* mind that matters in that context. The "what it is like" is not a hypothesis to be tested against behavioral data; it is the ontological substrate of the work. If you remove the validity of the character's felt experience, the novel collapses. A character's pain in a story is not "real" in a biological sense, but it is *aesthetically* real. To treat it as a mere text describing a non-existent state is to commit a category error specific to the scientific worldview.

  **Diagnosis of the Gap:**
  This gap does not suggest that narrative theory misses something essential about subjective report. Rather, it reveals that heterophenomenology relies on a presupposition about text and reality that fiction does not share.

  Heterophenomenology presupposes a **Realist Ontology**: it assumes there is a "Real World" (the brain, the behavior, the physical facts) that stands outside the text and serves as the final arbiter of truth. The text (the report) is secondary, derivative, and potentially false.

  Fiction operates on a **Constitutive Ontology**: it assumes the Text *constitutes* the World. There is no "Real World" outside the novel against which to check the character's report. The character's report *makes* the reality.

  Therefore, heterophenomenology cannot be fully translated into narrative terms because its ultimate goal is to look *past* the story to find the mechanism, whereas narrative theory's goal is to look *into* the story to find the experience. Heterophenomenology treats the first-person report as a map that might be wrong about the territory. Fiction treats the first-person report as the territory itself. The "elimination" of phenomenal consciousness is a move available only to a discipline that believes in a world outside the text; for the writer, there is nothing outside the text but silence.
