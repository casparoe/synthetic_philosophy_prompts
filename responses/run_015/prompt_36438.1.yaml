answer: |-
  Here is a breakdown of your friend's summary, evaluated against the current state of the philosophy of mind literature.

  ### Part 1: Bit-by-Bit Breakdown

  **1. "Famous thought experiment from Frank Jackson in the 80s."**
  *   **Verdict:** **Accepted.**
  *   **Detail:** Published in 1982 ("Epiphenomenal Qualia") and 1986 ("What Mary Didn't Know"). This is standard history.

  **2. "Mary is a vision scientist raised in a black-and-white room..."**
  *   **Verdict:** **Accepted.**
  *   **Detail:** This is the standard setup.

  **3. "...she's mastered neuroscience completely — she knows every physical fact there is to know about how color vision works, down to the last synapse."**
  *   **Verdict:** **Correction Needed.**
  *   **Detail:** This is a crucial technical error. For the argument to work, Mary must know **all physical facts about the world**, not just facts about color vision or neuroscience. If she only knows facts about vision, a physicalist could simply say, "She learned a new physical fact about light wavelengths she hadn't studied yet." The argument requires that she exhausts *all* physical information to isolate the "non-physical" remainder. Your friend's version weakens the argument significantly.

  **4. "One day she walks out and sees a red tomato... she learns something new: what red actually looks like."**
  *   **Verdict:** **Accepted.**
  *   **Detail:** This is the "intuition pump." Almost everyone agrees Mary gains *something* (new knowledge, ability, or perspective). The debate is about *what* that something is.

  **5. "If physicalism is true, she already knew all the facts... So physicalism is false. Jackson took this to prove that qualia are nonphysical properties."**
  *   **Verdict:** **Accepted (as a summary of Jackson's original view).**
  *   **Detail:** This accurately represents the "Knowledge Argument" as originally intended. Jackson argued that since she knew all physical facts but learned something new, the new thing (qualia) must be non-physical.

  **6. "He later admitted the argument doesn't work, which basically everyone agrees was the right call..."**
  *   **Verdict:** **Major Correction.**
  *   **Detail:** Jackson did change his mind (in 2004), but the claim that "basically everyone agrees" is **false**. This is the biggest red flag in your friend's reliability. The Knowledge Argument is still one of the most discussed, cited, and contested arguments in philosophy. Many physicalists accept it as the strongest argument *against* their view, and many dualists still hold it as proof. It is not settled history.

  **7. "...because the obvious reply is that Mary didn't learn any new fact at all — she just gained a new ability, same as when you learn to ride a bike."**
  *   **Verdict:** **Contested (Presented as Settled).**
  *   **Detail:** This is known as the **Ability Hypothesis** (championed by David Lewis and Laurence Nemirow). It is a *major* response, but it is not the "obvious reply" that ends the debate. Many philosophers argue that knowing "what it's like" is propositional knowledge (knowledge of facts), not just ability. Furthermore, other physicalist responses (like the **Phenomenal Concept Strategy**) are currently more popular than the Ability Hypothesis.

  **8. "Case closed, argument refuted."**
  *   **Verdict:** **False.**
  *   **Detail:** The argument is not refuted. It is actively defended, attacked, and modified.

  ---

  ### Part 2: Addressing Your Specific Curiosities

  **1. "Knows every physical fact about color vision" vs. "All physical facts"**
  Your friend's simplification here is dangerous. If Mary only knows about vision, physicalism survives easily. The argument *needs* her to be omniscient regarding physics to force the conclusion that there is something *outside* of physics. By narrowing her knowledge, your friend inadvertently makes the argument easier to defeat than it actually is.

  **2. Is the conclusion that "Physicalism is false" or something weaker?**
  Jackson's original conclusion was indeed that **Physicalism is false**. Specifically, he argued for **Property Dualism**: the brain has physical properties, but experience involves non-physical properties (qualia). It isn't a weak claim; it is a direct attack on the idea that the physical story is the *whole* story.

  **3. Is the "ride-a-bike" (Ability) reply the settled answer?**
  **No.** It is one move in a fight that is absolutely still going.
  *   **The Counter-Reply:** Critics argue that Mary *does* gain factual knowledge. For example, she can now think, "So *this* is what red looks like," and recognize it later. That looks like a fact, not just a skill.
  *   **Current Status:** Many contemporary physicalists prefer the **Phenomenal Concept Strategy**. This argues Mary gains a new *concept* for the same physical fact, rather than a new ability or a new fact. Your friend skipped this entire layer of the modern debate.

  **4. What does Jackson's recantation count for?**
  In philosophy, an author changing their mind does **not** settle the argument. Arguments stand on their own logic, not on their creator's endorsement.
  *   **Why he changed his mind:** Jackson didn't say the logic was wrong; he changed his mind about the nature of qualia. He adopted **Representationalism** (the view that the "feel" of experience is just the brain representing external properties). He decided qualia *are* physical/representational states, so Mary *didn't* learn about a non-physical thing.
  *   **The Problem:** Representationalism is itself heavily contested. So, Jackson essentially moved from "Argument A proves Dualism" to "Premise B of Argument A is false because of Theory C." Theory C is not consensus.

  ---

  ### Part 3: Reliability Verdict

  **Is your friend a reliable source?**
  *   **On History/Setup:** **Yes.** She knows the story, the characters, and the original intent.
  *   **On Current Consensus/Status:** **No.** She presents a live, high-stakes debate as settled history.
  *   **On Nuance:** **Low.** She conflates "one popular counter-argument" with "refutation."

  **Does "Case Closed" follow from the accurate parts?**
  **No.** Her takeaway relies entirely on the sketchy bits (the claim that everyone agrees and that the Ability Hypothesis is a knockout blow). If you remove the claim that "everyone agrees," the "case closed" conclusion collapses. She is leaning on the false consensus to get to the "refuted" framing.

  **Summary:** She is a good source for *what the argument is*, but a poor source for *where the field stands on it*. She is repeating a "textbook summary" that might have been accurate in a specific introductory context but fails to reflect the actual research landscape.

  ***

  ### Note: The One Claim That Changes Everything

  The specific claim that should most change how you think about this is: **"Basically everyone agrees [Jackson was right to recant]."**

  If you take nothing else away, take this: In philosophy of mind, there is almost **no consensus** on the hard problem of consciousness. The fact that your friend presented this as "case closed" suggests she is consuming "pop philosophy" (where debates are presented as solved puzzles) rather than engaging with the actual literature (where debates are presented as open wounds). This doesn't mean she's wrong about everything, but it means you should treat her "verdicts" on philosophical issues with skepticism, even if her "descriptions" are accurate.
