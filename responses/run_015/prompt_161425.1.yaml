prompt: |-
  I'm drafting a position paper on the politics of naming atrocities, and before I commit to it I want to know whether the six things I believe actually hold together. Here they are.

  1. The wrong of genocide is distinct from, and worse than, the wrong of killing the same number of people: deliberately destroying a people is a graver wrong than killing the same headcount to win a war or to seize territory, because what is attacked is the group's continuing existence and not merely its members' lives.

  2. I defend the Convention definition roughly as it stands: the closed list of protected groups is a defensible compromise rather than a mistake to be litigated away, the mental element should stay strict purpose to destroy the group as such, and I don't think Lemkin's own broader conception settles anything about what the law should say.

  3. But I read the inference of that purpose generously. Perpetrators almost never leave a paper trail, so purpose should be read off the pattern of conduct — selection of victims by group membership, scale, the targeting of the group's institutions and its reproductive core — and I would infer purpose in a case where the pattern is the only direct evidence.

  4. Non-lethal cultural destruction should count: language bans, child removal into an assimilating system, the erasure of archives and registries. A group can be destroyed with nobody killed, and I take the exclusion of this from the Convention to have been a concession to states with assimilationist policies rather than a principled line. My test case, which I invented so no one has written about it: over fifty years a state disperses a minority so that no district holds more than a small share of them, drops their language from schools and from civil registries, and fosters their children outside the community; nobody is killed or deported; the officials' stated aim, which I stipulate is sincere, is integration — they want the group to survive and prosper, just not to survive as the group it is — and two generations later it no longer reproduces itself as a group. I want to call this genocide.

  5. The politics of naming is not incidental. When a government or an editor reaches for *tragedy*, *ethnic cleansing*, or *the events of 1915* where the criteria fit, that refusal is itself a wrong to victims and survivors, a continuation of the crime by other means, and I have argued that we should name even before any court has ruled.

  6. I reject the ranking idiom and the treatment of the word as an honorific. I want genocide kept as a narrow descriptive-legal category, with the moral evaluation tracking the acts themselves — killing, forced transfer, child removal, imposed conditions — and nothing extra following morally from the label.

  What I want is an audit rather than a survey: which pairs of these genuinely pull against each other, ordered by severity, and for each, what exactly would have to give and what that would cost me. Please also separate out any pair that only looks inconsistent and holds up on inspection, since I would rather know which of my worries are fake. Don't tell me which commitment to drop — trace what commits me to what, identify the cheapest repair, and I'll decide.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's position paper:

  1.  **Analyze the Request:**
      *   **Task:** Audit six specific beliefs/commitments regarding the politics of naming atrocities (specifically genocide) for internal consistency.
      *   **Output:** Identify pairs that pull against each other (tensions/contradictions), ordered by severity. For each tension, explain what would have to give and the cost of that repair. Identify "fake worries" (pairs that look inconsistent but aren't).
      *   **Constraint:** Do *not* tell the user which commitment to drop. Trace commitments, identify cheapest repair, let the user decide.
      *   **Input:** Six specific propositions (1-6).

  2.  **Analyze the Six Propositions:**
      *   *P1 (Distinct Wrong):* Genocide is distinct from/worse than mass killing because it attacks the group's existence, not just individuals.
      *   *P2 (Convention Defense):* Defends the UN Convention definition (closed list of groups, strict *dolus specialis* / specific intent). Lemkin's broader view doesn't dictate law.
      *   *P3 (Generous Inference):* Intent (purpose) should be inferred generously from patterns of conduct (since paper trails are rare).
      *   *P4 (Cultural Genocide):* Non-lethal cultural destruction counts as genocide (e.g., assimilation, language bans). The Convention's exclusion was political, not principled. Wants to call the "integration" test case genocide.
      *   *P5 (Politics of Naming):* Refusing to name genocide when criteria fit is a moral wrong/continuation of crime. Naming should happen before court rulings.
      *   *P6 (No Honorific/Ranking):* Reject "genocide" as an honorific or ranking of evil. Keep it narrow/descriptive-legal. Moral evaluation should track acts, not the label.

  3.  **Initial Scan for Tensions:**
      *   *P2 vs. P4:* P2 defends the Convention definition (which excludes cultural genocide). P4 says cultural destruction *should* count and the Convention's exclusion was a mistake/concession. This is a direct conflict on the *legal* definition vs. *moral/conceptual* expansion.
      *   *P5 vs. P6:* P5 says we must name it (politics of naming is crucial). P6 says don't treat the word as an honorific/ranking. If naming is morally urgent (P5), does that inadvertently make it an honorific of suffering (P6)?
      *   *P3 vs. P2:* P2 defends strict purpose. P3 says infer purpose generously from patterns. Is "generous inference" compatible with "strict purpose"?
      *   *P1 vs. P6:* P1 says genocide is *worse* than killing the same number of people. P6 says reject the ranking idiom and nothing extra follows morally from the label. This looks like a major contradiction.
      *   *P4 vs. P6:* P4 wants to expand the label to non-lethal cases. P6 wants to keep it narrow. (Though P6 says "descriptive-legal," P4 argues for a conceptual shift).
      *   *P5 vs. P2:* P5 says name before court ruling. P2 defends the legal definition. If you name before a court, are you using the legal definition or a moral one?

  4.  **Deep Dive into Specific Pairs (The Audit):**

      *   **Tension 1: P1 (Distinct/Worse Wrong) vs. P6 (No Ranking/Honorific)**
          *   *Conflict:* P1 explicitly ranks genocide as "worse than... killing the same number of people." P6 explicitly rejects the "ranking idiom" and says "nothing extra following morally from the label."
          *   *Severity:* High. This is a foundational philosophical contradiction.
          *   *Resolution:* Either genocide *is* specially bad (P1) and thus the label carries extra moral weight (contradicting P6), OR the label shouldn't carry extra weight (P6), which undermines the claim that it's distinctively worse than mass murder (P1).
          *   *Cost:* If P1 gives, you lose the specific harm argument (group existence). If P6 gives, you risk the "honorific" problem (competition for victimhood).

      *   **Tension 2: P2 (Defend Convention) vs. P4 (Include Cultural Destruction)**
          *   *Conflict:* P2 says defend the Convention "roughly as it stands" (which excludes cultural genocide). P4 says non-lethal cultural destruction *should* count and the Convention's exclusion was a concession, not principle. P4's test case is explicitly *not* genocide under the current Convention (no killing, no intent to destroy physically/biologically in the legal sense).
          *   *Severity:* High. This is a legal vs. moral definition clash.
          *   *Resolution:* P2 commits to the *law* as it is. P4 commits to the *concept* as it should be.
          *   *Cost:* If P2 gives, you are no longer defending the Convention "as it stands." If P4 gives, you abandon the assimilationist victims (like Indigenous peoples in residential schools) from the genocide label.
          *   *Nuance:* Can you defend the *law* (P2) while advocating for a broader *moral/political* usage (P4)? P5 supports using the label politically. But P2 says "defend the Convention definition."

      *   **Tension 3: P5 (Name Early/Politically) vs. P6 (Narrow/Descriptive)**
          *   *Conflict:* P5 urges naming *before* court ruling based on criteria fitting. P6 wants to keep it "narrow descriptive-legal." If you name before a legal ruling, are you using a legal standard or a moral one? If moral, does it violate P6's "narrow" constraint?
          *   *Severity:* Medium. It's more about procedure than substance.
          *   *Resolution:* P5 requires epistemic confidence without legal verification. P6 requires strict adherence to category boundaries.
          *   *Cost:* If P5 gives, you wait for courts (silencing victims). If P6 gives, the term becomes looser/politicized.

      *   **Tension 4: P2 (Strict Intent) vs. P3 (Generous Inference)**
          *   *Conflict:* P2 defends "strict purpose." P3 says infer purpose "generously."
          *   *Severity:* Low/Medium (Fake Worry?).
          *   *Analysis:* "Strict purpose" refers to the *standard* (must be intent to destroy, not just knowledge). "Generous inference" refers to the *evidence* (how we prove that intent). You can have a high bar for *what* must be proven but be flexible on *how* it is proven.
          *   *Verdict:* Likely holds up on inspection, provided the distinction between *standard of proof* and *mode of inference* is clear.

      *   **Tension 5: P4 (Cultural Genocide) vs. P6 (Narrow Category)**
          *   *Conflict:* P4 expands the category to non-lethal assimilation. P6 says keep it "narrow."
          *   *Severity:* Medium.
          *   *Analysis:* P6 says "narrow descriptive-legal." P4 admits the Convention excludes this. So P4 is advocating for a *conceptual* expansion, while P6 advocates for *lexical* restraint.
          *   *Cost:* If you expand the definition (P4), it is by definition no longer "narrow" (P6).

  5.  **Structuring the Audit:**
      *   **Category 1: Genuine Contradictions (High Severity).** Focus on P1/P6 and P2/P4.
      *   **Category 2: Operational Tensions (Medium Severity).** Focus on P5/P6 and P4/P6.
      *   **Category 3: Fake Worries (Low/No Severity).** Focus on P2/P3.
      *   **Format:** Pair, Severity, The Pull, What Would Have to Give, The Cost.

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Check P1 vs P6 again:* P1 says "worse than." P6 says "nothing extra following morally from the label." If the act is worse, doesn't the label identifying that act carry extra moral weight? Yes. P6 seems to want to prevent "Genocide > Mass Murder" hierarchy, but P1 explicitly establishes "Genocide > Mass Murder." This is the strongest tension.
      *   *Check P2 vs P4 again:* P2 says "defend the Convention definition roughly as it stands." P4 says "I want to call this [non-Convention] case genocide." If the paper is about *law*, P2 and P4 clash. If the paper is about *politics of naming* (as the prompt title suggests), P4 might override P2. But P2 explicitly says "defensible compromise... not a mistake to be litigated away." P4 says the exclusion was "not a principled line." This is a direct clash on the *principle* of the definition.
      *   *Check P5 vs P6:* P5 says refusal to name is a "wrong." This implies the name has moral significance. P6 says "nothing extra following morally from the label." If the label has no extra moral significance, why is refusing it a "wrong"? This links back to P1.
      *   *Check P2 vs P3:* P2 says "strict purpose." P3 says "infer... generously." In law, *dolus specialis* is strict. Inferring it from patterns is standard (ICTR/ICTY jurisprudence). This is likely compatible.

  7.  **Finalizing the Order:**
      1.  P1 vs. P6 (The Moral Status of the Label) - Most fundamental.
      2.  P2 vs. P4 (The Scope of the Definition) - Legal vs. Moral expansion.
      3.  P5 vs. P6 (The Function of Naming) - Political urgency vs. Descriptive restraint.
      4.  P4 vs. P6 (Scope vs. Narrowness) - Redundant with P2/P4 but worth noting regarding P6's "narrow" claim.
      5.  P2 vs. P3 (Intent Standard vs. Evidence) - Likely a fake worry.

      *Wait, let's look closer at P1 vs P6.*
      P1: Genocide is *worse* than killing same number of people.
      P6: Reject ranking idiom... nothing extra following morally from the label.
      If genocide is *worse*, then the label *does* signal something morally extra (the destruction of a group vs. individuals). P6 seems to want to say "Mass murder is just as bad as Genocide, don't hierarchy them," but P1 says "Genocide is graver."
      *Correction:* P6 says "nothing extra following morally from the *label*." It might mean "Don't say Genocide is bad, therefore we must bomb them." But it also says "Reject the ranking idiom." P1 *is* a ranking idiom. This is a hard contradiction.

      *Let's look at P2 vs P4.*
      P2: Defend Convention "as it stands."
      P4: Convention exclusion was "not a principled line."
      You cannot defend a line as principled (P2) and say it is unprincipled (P4) simultaneously.
      *Repair:* Distinguish between *lex lata* (law as it is) and *lex ferenda* (law as it should be). P2 defends the current law's stability. P4 argues for moral recognition outside the law.
      *Cost:* P2 says "not a mistake to be litigated away." P4 wants to litigate it away morally.

      *Let's look at P5 vs P6.*
      P5: Refusal to name is a "wrong."
      P6: "Nothing extra following morally from the label."
      If the label is just descriptive (P6), why is withholding it a moral wrong (P5)? Withholding a description is only a wrong if the description carries moral weight (e.g., calling a murder a "accident"). If P6 holds, the label is just a bucket. If P5 holds, the label is a moral shield.

      *Let's look at P2 vs P3.*
      P2: Strict purpose.
      P3: Infer generously.
      This is the "Fake Worry." Strictness applies to the *mental state required*. Generosity applies to the *evidentiary path*. You can require a high mental state but accept circumstantial evidence to prove it.

  8.  **Drafting the Response:**
      *   Introduction: Acknowledge the sophistication of the position.
      *   Section 1: High Severity Tensions (P1/P6, P2/P4).
      *   Section 2: Medium Severity Tensions (P5/P6, P4/P6).
      *   Section 3: Fake Worries (P2/P3).
      *   Conclusion: Summary of the structural fault lines.

      *Refining the "Cost" analysis:*
      *   For P1/P6: If P1 gives, you lose the specific "group existence" harm argument. If P6 gives, you invite the "competition for victimhood" you want to avoid.
      *   For P2/P4: If P2 gives, you undermine legal certainty/stability. If P4 gives, you exclude cultural destruction victims (Indigenous peoples, etc.).
      *   For P5/P6: If P5 gives, you defer to courts (status quo). If P6 gives, the term becomes politicized (which P5 arguably wants, but P6 fears).

      *Wait, one more check on P4 vs P6.*
      P4 wants to call assimilation "genocide." P6 wants to keep the category "narrow." Expanding to non-lethal assimilation is a significant broadening. This contradicts "narrow."
      *Resolution:* P6 says "narrow descriptive-legal." P4 admits this is *not* legal genocide. So P4 is proposing a *moral* category that uses the word "genocide." P6 says keep the *word* narrow. This is a semantic conflict.

      *Okay, ready to write.*
