  Here is the session plan. Do not deviate from the sequence. If you jump ahead, she will retreat to the "circularity" defense because she will feel you are trying to win rather than explain.

  ### 1. The Setup: Validate, Then Pivot (5 Minutes)
  Do not start by defining "transcendental argument." Start by validating her objection.
  *   **Say this:** "You were right to be suspicious. Most people use transcendental arguments badly, and they *are* circular. I'm not trying to defend those. I want to show you the specific mechanical difference between a bad circular argument and a valid transcendental one. If I can't show you the difference in five minutes, you win."
  *   **Why:** This lowers her defenses. You are agreeing with her critique of the *genre* to earn the right to teach the *structure*.

  ### 2. The Carrying Example: The Possibility of Other Minds (15 Minutes)
  **The Example:** Do not use Kant. Do not use Logic. Use **Other Minds**.
  **The Structure:**
  1.  **Phenomenon:** We are having a conversation. I recognize you as a roommate capable of argument, not just a noise-making object.
  2.  **Empirical Attempt:** Normally, I would say, "I see you behave like me, so I infer you have a mind." (This is induction/abduction).
  3.  **Transcendental Move:** Ask her: "Is it possible for me to even identify your behavior as 'arguing' or 'speaking' without already possessing the concept of 'mind'?"
  4.  **The Dependency:** Argue that "behavior" isn't raw data. To see physical movements as *meaningful actions* (like "objecting"), the concept of "agency/mind" must already be in place. The mind isn't the *conclusion* inferred from the behavior; the mind is the *condition* that makes the behavior intelligible as argument.

  **Why this example:**
  1.  **It leverages her major:** Political Science studies actors and agents. She understands that "actors" are constitutive of politics, not just observed data points.
  2.  **It isolates the form:** It clearly separates "I guess you have a mind" (empirical guess) from "I cannot conceive of this interaction without presupposing you have a mind" (transcendental condition).
  3.  **It's immediate:** You are doing it right now.

  ### 3. The Misconceptions & The Kill Sequence
  She will interrupt. Do not let her store these up. Kill them in this exact order as they arise.

  **Misconception 1: "You're just assuming the conclusion." (Circularity)**
  *   **When she brings it:** Immediately after you state the example.
  *   **Where you kill it:** During **Step 2 (The Dependency)**.
  *   **The Kill:** Distinguish between *premises* and *conditions*. Say: "In a circular argument, I use the conclusion to prove the premise. Here, I'm not proving you have a mind. I'm pointing out that your having a mind is the *price of admission* for this conversation. It's not the result of the logic; it's the floor the logic stands on."

  **Misconception 2: "Isn't this just psychology? Or definitions?"**
  *   **When she brings it:** After she accepts it's not circular but thinks it's trivial.
  *   **Where you kill it:** Immediately after **Step 2**, before moving to the check question.
  *   **The Kill:** Say: "Psychology studies how we *do* think. This asks what must be true for thinking to be *possible* at all. It's not about how our brains work; it's about the structure of the situation."

  **Misconception 3: "So this proves minds exist objectively?"**
  *   **When she brings it:** At the very end, trying to find a loophole.
  *   **Where you kill it:** In the **Admission of Skipping** (see below).
  *   **The Kill:** Acknowledge the limit. Don't overclaim.

  ### 4. The Check Question (5 Minutes)
  Do not ask "Do you understand?" She will say yes to end the conversation. Ask a question that forces her to use the form to answer.

  **The Question:**
  "If you claim that 'All truth is relative,' are you claiming that statement is relatively true or absolutely true?"

  **Why this works:**
  *   If she says "Absolutely," she admits at least one absolute truth exists (refuting the claim).
  *   If she says "Relatively," the claim has no force over you.
  *   **The Goal:** You want her to see that the *possibility* of making the claim depends on a condition (logic/truth norms) that the claim itself tries to deny. This mirrors the Other Minds structure (the possibility of argument depends on minds).

  ### 5. The Admission: What You Are Skipping
  To maintain trust, you must admit where the philosophical body count lies. Do not pretend this is settled science.

  **Say this:**
  "I'm skipping the biggest objection, which is Stroud's Objection. Even if I prove you *must believe* in other minds to argue, a skeptic can say 'That just proves you're wired to believe it, not that other minds actually exist.' I'm teaching you the *structure* of the argument today, not defending it against ultimate skepticism. That's the next level."

  **Why:** This shows intellectual honesty. It validates her skepticism as a legitimate philosophical position (which it is) without letting it derail the lesson on the *form* of the argument. It frames her objection as advanced, not basic, which strokes her ego while closing the door on using it to dismiss the current lesson.
