  | **No True Scotsman** (Mackie) | Captures the "Betrayal" move (bad acts are excluded from the set). | This is a fallacy used to defend a universal claim against a counterexample. In your pattern, no universal claim is being explicitly defended, and no counterexample is being rebutted. The classification slides *before* the challenge arises. |
  | **Floating Signifier** (Laclau) | Perfectly captures the emptiness and the ability to shift content while retaining the word. | It does not explain the **Valence Lock**. A floating signifier can become negative (e.g., "Bureaucracy"). Your pattern requires the term to remain *honorific* regardless of content. |
  | **Motte-and-Bailey** (Wilson) | Captures the switch between a defensible abstract claim (Motte: "Values are good") and a controversial concrete claim (Bailey: "This policy is a Value"). | Usually implies a retreat under fire. Your pattern shows the switch happening proactively depending on whether the speaker wants credit or distance, not just when attacked. |
  | **Whig Historiography** (Butterfield) | Captures the diachronic element: history is read as a progress toward current values. | This describes the *narrative*, not the *linguistic mechanism*. It explains why the credit goes in, but not how the language accommodates the blame. |

  **The Best Fit:**
  The concept that does the most work is **The Floating Signifier**, but it must be qualified as **Hegemonically Stabilized**. The "valence" is stabilized by cultural power (it *must* be good because *we* say it is ours), while the "content" floats to accommodate historical reality.

  **What is left over:**
  None of these fully capture the **Causal/Normative Switch** (your Feature 2). This is a specific rhetorical modality where the term functions as an *efficient cause* when claiming credit ("Values produced Liberty") but as a *final cause* (teleological standard) when assigning blame ("Values were betrayed by Slavery"). This switching mechanism is the most distinct part of your observation.

  ### 3. Naming and Defining the Phenomenon

  Since no single term exists, I propose you name this **"Normative Immunization"** operating via a **"Valence-Locked Floating Signifier."**

  If you need a single label for your speeches, I recommend: **"The Rhetoric of Inheritance."**

  **Definition:**
  *Normative Immunization* is a rhetorical pattern in which a collective honorific concept is rendered unfalsifiable by bifurcating its relationship to historical events based on their moral valence.

  **Necessary Conditions:**
  1.  **Honorific Lock:** The term must retain positive affective weight in all uses.
  2.  **Valence-Dependent Extension:** Positive instances are classified as *expressions* of the concept; negative instances are classified as *deviations* from it.
  3.  **Causal/Normative Bifurcation:** The concept functions as a causal explanation for positive instances and as a normative standard for negative instances.
  4.  **Asymmetrical Application:** The pattern applies to the in-group's history but is not applied to out-groups (whose negative acts are treated as expressions of their nature).

  **Boundary Cases:**
  *   **Is it distinctive to civilisational terms?** No. It applies to any **Normative Kind Term**.
      *   *Science:* "Replicable results" are *science*; "Fraudulent studies" are *pseudoscience* (not real science).
      *   *Friendship:* "Support in hardship" is *friendship*; "Fair-weather association" is *not friendship*.
      *   *Art:* "Provocative work" is *art*; "Kitsch" is *not art*.
  *   **Why it feels distinctive here:** Civilisational terms ("Western," "Islamic," "Asian") have a much wider **diachronic scope** and a vaguer **membership criteria** than "Friendship" or "Science." This makes the elasticity more visible and the stakes higher. In "Science," we have relatively clear methods to adjudicate fraud. In "Western Values," the adjudication is purely political.

  ### 4. A Diagnostic for Your Corpus

  To distinguish an instance of this pattern from a genuine descriptive claim, apply the **Falsifiability Test** and the **Causal Consistency Test**.

  **The Falsifiability Test:**
  Ask: *What historical evidence would compel the speaker to admit that "Western values" failed or produced a negative outcome?*
  *   **Instance of Pattern:** There is no such evidence. Any negative outcome is re-categorized as a "betrayal," "anomaly," or "failure to live up to."
  *   **Genuine Descriptive Claim:** The speaker admits that certain values (e.g., "hierarchy" or "expansionism") were integral to the tradition and produced outcomes they now regard as negative. (e.g., "Our tradition valued order over liberty, which led to stability but also oppression.")

  **The Causal Consistency Test:**
  Ask: *Is the phrase used to explain why something happened in both positive and negative cases?*
  *   **Instance of Pattern:**
      *   Positive: "The welfare state emerged *because of* our commitment to solidarity (Western Value)." (Causal)
      *   Negative: "Colonial extraction happened *despite* our commitment to liberty (Western Value)." (Normative/Exculpatory)
  *   **Genuine Descriptive Claim:**
      *   Positive: "Liberty led to innovation."
      *   Negative: "Liberty led to unchecked exploitation." (Consistent causal role).

  **What would a non-instance look like?**
  A non-instance would be a formulation like: *"Western values include a tension between universalism and particularism. Sometimes this produced human rights; sometimes it produced colonialism."* Here, the term is descriptive, the valence is mixed, and the causal link is consistent.

  ### 5. Is the Pattern a Defect?

  This is the crucial question for a speechwriter. The answer depends on whether you view language as a tool for **Truth** or a tool for **Cohesion**.

  **As a Defect (The Truth View):**
  From the perspective of historical accuracy and logical rigor (Popper, Orwell), this is a profound defect. It prevents a community from learning from its history. If atrocities are always "betrayals," the community never examines the structural features of its tradition that *made those atrocities possible*. It creates a **Moral Blind Spot**. It is intellectually dishonest because it renders the term "Western values" meaningless as a descriptor of reality; it becomes only a marker of loyalty.

  **As a Feature (The Cohesion View):**
  From the perspective of sociology and political stability (Durkheim, Walzer), this structure is **functional and perhaps necessary**.
  *   **Agency Preservation:** If a community admits that its core values *caused* atrocities, it risks moral paralysis or self-hatred. By framing atrocities as "betrayals," the community preserves the belief that it has the *agency* to be better. It keeps the "ideal" alive as a guide for the future.
  *   **Continuity of Identity:** A community needs a stable signifier ("Who we are") to function across generations. If the definition of "Western values" changed every time a new historical fact was uncovered, the collective identity would fragment. The elasticity allows the tradition to survive historical shocks.

  **Verdict:**
  The pattern is a **functional fiction**. It is a defect for the *historian* but a feature for the *citizen*.
  *   If your speech aims to **analyze** history, you must avoid it.
  *   If your speech aims to **mobilize** a community, you will likely need to use it, because it is the grammar in which that community understands its own moral agency.

  **Recommendation for your Writing:**
  If you wish to critique the pattern without alienating your audience, do not attack the *values*. Attack the *elasticity*.
  *   *Bad:* "Western values are a sham used to justify empire." (Attacks the honorific).
  *   *Good:* "We cannot claim the welfare state as our inheritance while disowning the extraction that funded it. If our values are to mean anything, they must be robust enough to survive the truth of our history." (Demands Causal Consistency).

  This moves the goalpost from "Are our values good?" (which triggers the Immunization) to "Are our values real?" (which challenges the Falsifiability).
