  Here is the breakdown you requested.

  ### 1. Does this pattern have an established name?

  There is no single canonical term that captures all four features you describe, but the phenomenon is well-documented as a convergence of three distinct concepts in the literature. If you search for any one of them, you will find pieces of the puzzle, but you need to combine them to get the whole picture.

  *   **The Floating Signifier (Ernesto Laclau):** In political theory, this describes a signifier (like "Western values," "The People," or "Freedom") that is emptied of specific content so that different groups can project their own meanings onto it. This captures your **Feature 1** (extension tracks rhetorical direction) and **Feature 4** (survives migration). However, Laclau's theory focuses on political hegemony, not necessarily the *honorific* lock or the historical asymmetry.
  *   **The God Term (Richard Weaver):** In rhetoric, a "God Term" is a word that sits at the top of a hierarchy of values, is undefined, and is used to end argument rather than start it (e.g., "Freedom," "Progress," "Science"). This captures your observation that the phrase is **unfailingly honorific**. However, Weaver does not fully account for the *diachronic* shifting of content.
  *   **Immunization Strategies (Karl Popper / Peter Sloterdijk):** In philosophy of science and critical theory, this describes a belief system that adjusts its auxiliary hypotheses to protect its core from falsification. This captures your **Feature 4** (no takedown condition). When a bad thing happens, the "core" (Western values) is immunized by classifying the event as a "betrayal" rather than a "product."

  **The Literature:**
  You will find the closest analysis in **Conceptual History** (*Begriffsgeschichte*), particularly the work of **Reinhart Koselleck**. He studies how concepts like "Democracy" or "Civilization" retain their identity over centuries while their semantic content shifts radically. He would call this a **Diachronic Semantic Drift within a Stable Signifier.**
  In Postcolonial Studies, **Edward Said** (*Orientalism*) and **Dipesh Chakrabarty** (*Provincializing Europe*) analyze the **Asymmetry** (your Feature 3), noting how "Europe" is treated as a sovereign subject of history (capable of betrayal) while "The East" is often treated as an object (defined by its static traits).

