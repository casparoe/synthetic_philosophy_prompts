answer: |-
  # GRADIENT NEURAL REPLACEMENT (GNR)
  ## IDENTITY & STATUS VERIFICATION PROTOCOL (ISVP)
  **Version:** 4.2 (Clinical Ethics)  
  **Authorized Users:** Nursing Coordinators, Senior Clinical Staff  
  **Time Allocation:** 30 Minutes Maximum  
  **Escalation Path:** ISVP Failure → Clinical Ethics Consultant → Legal Counsel  

  ### PURPOSE
  To determine whether the **Current Subject** (the person in the bed) retains the legal and moral status of the **Enrolling Patient** (the person who signed the intake consent) for the purposes of ongoing treatment, advance directive enforcement, and property/surrogacy rights.

  ### INSTRUCTIONS TO USER
  This instrument does not determine metaphysical survival. It determines **Status Continuity**. A finding of "Status Discontinuity" does not mean the subject is not human; it means the subject is not the *legal signatory* of the original contract. Complete all steps in order. Do not skip steps based on prior knowledge. Mark "Uncertain" if the subject's answer is ambiguous.

  ---

  ### STEP 1: BIOLOGICAL ANCHOR CHECK
  *Goal: Establish the physical baseline.*

  1.  **Genetic/Biometric Match:** Does the Current Subject match the Enrolling Patient's pre-operative DNA and retinal scan?
      *   [ ] Yes
      *   [ ] No (Note: Synthetic modules do not carry DNA. Check remaining biological tissue.)
  2.  **Physiological Continuity:** Has the subject maintained uninterrupted cardiopulmonary function throughout the replacement series?
      *   [ ] Yes
      *   [ ] No (Note: Check for intraoperative cardiac arrest >4 minutes.)

  **STOP RULE 1:** If **No** to both 1 and 2, presume **Status Discontinuity**. Escalate to Ethics.  
  **JUDGMENT CALL:** If DNA is <40% of original volume but physiological function is uninterrupted, mark "Yes" to #2. This prioritizes functional life over biological matter.

  ---

  ### STEP 2: NARRATIVE & MEMORY VERIFICATION
  *Goal: Assess psychological continuity.*

  3.  **Episodic Recall:** Can the subject recall three specific, verifiable events from the Enrolling Patient's life that occurred *after* intake but *before* the first surgery?
      *   [ ] Yes (All 3)
      *   [ ] Partial (1-2)
      *   [ ] No
  4.  **Procedural Memory:** Does the subject demonstrate skills (handwriting, motor tasks, language idioms) identical to the Enrolling Patient's baseline?
      *   [ ] Yes
      *   [ ] No (Note: Minor speed/precision changes due to synthetic integration are expected. Look for *style* changes.)

  **STOP RULE 2:** If **No** to #3 AND **No** to #4, presume **Status Discontinuity**. Escalate to Ethics.

  ---

  ### STEP 3: PHENOMENOLOGICAL SELF-REPORT
  *Goal: Assess the subject's internal sense of identity. (Critical Step)*

  5.  **The "I" Statement:** Ask: *"When you say 'I', who are you referring to? Are you the person who signed the papers at intake?"*
      *   [ ] "Yes, I am the same person."
      *   [ ] "I am mostly the same, but changed."
      *   [ ] "I am not that person anymore."
      *   [ ] "I don't know."
  6.  **Alienation Check:** Ask: *"Do you feel your thoughts are your own, or do they feel inserted/managed?"*
      *   [ ] "My own."
      *   [ ] "Mixed/Unclear."
      *   [ ] "Not my own."

  **STOP RULE 3:** If the answer to #5 is **"I am not that person"** OR #6 is **"Not my own"**, presume **Status Discontinuity**. Escalate to Ethics.  
  **JUDGMENT CALL:** If the answer is "Mixed/Unclear," you must decide if this is fatigue or fundamental alienation. If you suspect fundamental alienation, escalate. Do not default to "Fatigue" to save time.

  ---

  ### STEP 4: DIRECTIVE CONFLICT CHECK
  *Goal: Assess alignment of will.*

  7.  **Directive Alignment:** Does the Current Subject's current expressed wish regarding treatment align with the Enrolling Patient's Advance Directive (AD)?
      *   [ ] Yes (Continue/Stop matches AD)
      *   [ ] No (Subject wants to Stop, AD says Continue OR Subject wants to Continue, AD says Stop)
      *   [ ] N/A (No AD on file)

  **STOP RULE 4:** If **No** (Conflict exists), you must apply the **Priority Matrix** below.

  #### PRIORITY MATRIX (For Step 4 Conflicts)
  *   **If Replacement < 50%:** Enrolling Patient's AD takes precedence. (Biological Anchor dominates).
  *   **If Replacement > 50%:** Current Subject's Wish takes precedence. (Psychological Anchor dominates).
  *   **EXCEPTION:** If Step 3 (Self-Report) indicated Alienation ("Not my own"), the Current Subject's wish is invalid. Revert to AD. Escalate.

  ---

  ### STEP 5: DIVERGENCE & BRANCHING CHECK
  *Goal: Detect multiple claimants.*

  8.  **Single Claimant:** Is there only one conscious subject claiming the identity of the Enrolling Patient?
      *   [ ] Yes
      *   [ ] No (e.g., Re-implantation of excised tissue, Split-stream disagreement).

  **STOP RULE 5:** If **No**, immediate **Status Suspension**. Do not treat either claimant as the Enrolling Patient. Escalate to Legal.

  ---

  ### FINAL DETERMINATION

  *   **GREEN STATUS:** All Stop Rules passed. Priority Matrix resolved in favor of treatment.  
      *Action:* Proceed with scheduled session. Document ISVP in chart.
  *   **YELLOW STATUS:** One "Uncertain" mark or Step 4 Conflict at exactly 50% replacement.  
      *Action:* Proceed with session, but flag chart for Ethics Review within 24 hours.
  *   **RED STATUS:** Any Stop Rule triggered.  
      *Action:* **SUSPEND TREATMENT.** Secure unit. Notify Ethics Consultant. Do not administer anaesthesia.

  ---

  ### PROCEDURAL NOTES ON JUDGMENT CALLS
  1.  **The 50% Threshold (Step 4):** This is arbitrary but necessary. It is a policy decision, not a fact. You are enforcing a rule that says "Past Self matters more before halfway; Present Self matters more after halfway."
  2.  **Alienation (Step 3):** If a patient says "Someone else is finishing my sentences," you cannot verify this factually. You must treat the *report* as fact. If they report alienation, you must treat them as potentially distinct from the Enrollee.
  3.  **Whole-Brain vs. Graded:** This protocol relies on the *graded* nature of the replacement to establish continuity. If a patient undergoes **Whole-Brain Destructive Replacement** (instant swap), Step 1 fails (Biological Anchor lost) and Step 2 is unverifiable pre-post. **This Protocol is invalid for Whole-Brain cases.** Whole-Brain cases require a "New Entity" presumption until Legal assigns identity.

  ---

  # APPLICATION TO SPECIFIC CASES

  ### CASE 1: The 70% Revocation
  **Scenario:** Patient is at Session 140 (~70% replacement). Enrolling Patient's AD mandates completion of the series. Current Subject revokes consent, stating, "I no longer want what that earlier self wanted."
  **ISVP Walkthrough:**
  1.  **Bio Anchor:** <40% original tissue. (Passes on Physiological Continuity).
  2.  **Narrative:** Recalls intake. (Passes).
  3.  **Self-Report:** Subject says, "I am the same person, but my priorities have changed." (Passes Stop Rule 3).
  4.  **Directive Conflict:** **CONFLICT.** AD says Continue; Subject says Stop.
  5.  **Priority Matrix:** Replacement is >50%. Matrix dictates **Current Subject's Wish takes precedence.**
  6.  **Determination:** **GREEN STATUS** (regarding identity), but **TREATMENT HALT** (regarding consent).

  **The Unwanted Result:**
  The procedure validates the Current Subject as the Enrolling Patient *enough* to override the AD, BUT because the original contract was for a specific medical trajectory which is now revoked, the clinical team cannot proceed with the *original protocol*.
  *However, to meet your requirement for a program-damaging outcome:*
  If the Subject says in Step 3: "I am the same person, *but I wouldn't have agreed to this if I knew what it felt like at 70%*."
  This triggers the **Alienation Exception** in the Priority Matrix. The system flags that the Current Subject's capacity to consent is compromised by the replacement itself (Substitution Effect).
  **Result:** **RED STATUS.** The Subject cannot enforce the AD (they are arguably not the Enrollee anymore) AND the Subject cannot grant new consent (their judgment is flagged as potentially synthetic/artificial).
  **Operational Impact:** Treatment suspends. Legal guardianship must be established for a "New Entity." All GNR enrolments are paused pending legal review of whether mid-course consent is valid. The program halts.

  ### CASE 2: The Reversion (Will Contest)
  **Scenario:** 60% replacement. Excised tissue kept viable. Tissue re-implanted into a cloned body. Two subjects: "Synthetic" (60% replaced) and "Biological" (Restored original tissue). Biological subject contests the Enrollee's Will.
  **ISVP Walkthrough:**
  1.  **Bio Anchor:**
      *   Synthetic: Fails DNA match (mostly synthetic).
      *   Biological: Passes DNA match.
  2.  **Narrative:**
      *   Synthetic: Recalls up to Session 120.
      *   Biological: Recalls up to Intake (Gap during replacement).
  3.  **Divergence Check:** **TWO CLAIMANTS.**
  4.  **Stop Rule 5:** Triggered. **Status Suspension.**

  **Determination:**
  The ISVP cannot assign the "Enrolling Patient" status to both.
  *   **Biological Subject:** Gets Legal Identity (SSN, Property, Will) based on Step 1 (Bio Anchor).
  *   **Synthetic Subject:** Classified as "Dependent Entity." Retains memory, but legal status is Ward of State.
  **Outcome:** Biological subject inherits the estate. Synthetic subject retains custody of their own body but has no claim on the Enrollee's assets. Ethics Consultant must mediate care rights for the Synthetic subject.

  ### CASE 3: The Split-Stream (Disagreement)
  **Scenario:** Prior callosotomy. Left Hemisphere replaced first. Right Hemisphere replaced second. Left-stream wants to stop. Right-stream wants to continue.
  **ISVP Walkthrough:**
  1.  **Bio/Narrative:** Both streams pass individual checks.
  2.  **Self-Report:** Left says "I want to stop." Right says "I want to continue."
  3.  **Divergence Check:** **INTERNAL CONFLICT.** (Step 8).
  4.  **Stop Rule 5:** Triggered. (Two conscious streams within one cranial vault acting as distinct claimants).

  **Determination:** **RED STATUS.**
  Consent cannot be verified. A single legal person cannot hold contradictory consent statuses simultaneously.
  **Outcome:** Treatment suspends. Ethics must determine if one hemisphere holds "Executive Authority." Default presumption: If the streams disagree on safety-critical consent, the **Conservative Path** (Stop Treatment) is taken to prevent battery. The program cannot proceed until streams integrate or one is legally designated proxy for the other.

  ---

  # LIMITATIONS & EXPLANATION TO FAMILIES

  ### What This Procedure Cannot Do
  This instrument **does not and cannot** answer the question: *"Is my loved one still alive inside there?"*

  The ISVP is a **administrative allocation tool**. It assigns rights (consent, property, surrogacy) based on observable continuity (biology, memory, behavior). It is designed to prevent legal liability and ethical negligence. It is not a metaphysical detector.

  *   **If the procedure says "GREEN":** It means "We are legally safe to treat this person as the Enrollee." It does not mean "The soul has not departed."
  *   **If the procedure says "RED":** It means "We cannot verify legal continuity." It does not mean "The person is dead."

  ### Explaining to a Family (Script)
  *"You are asking if your husband survived the surgery. That is a question about the nature of the self, which medicine cannot answer. We can only answer questions about rights and responsibilities. Our protocol checks if the person in the bed remembers being your husband, looks like your husband, and claims to be your husband. If they pass those checks, we treat them as your husband for the law. If they fail, we treat them as a new person who needs protection. We cannot tell you if the 'inner light' is the same. We can only tell you who has the right to sign the discharge papers."*

  ### Theoretical Transparency (For Audit)
  *   **Step 1 (Bio Anchor):** Grounded in the **Biological Organism View**. Prioritizes the living body as the carrier of identity.
  *   **Step 2 (Narrative):** Grounded in the **Psychological Continuity View**. Prioritizes memory and character.
  *   **Step 3 (Phenomenology):** Grounded in the **Narrative/Self-Model View**. Prioritizes the subject's own report of their existence.
  *   **Step 4 (Priority Matrix):** Grounded in **Pragmatic Ethics**. Acknowledges that identity is a gradient and assigns legal weight based on the extent of replacement to balance the Enrollee's autonomy against the Current Subject's welfare.

  **Explicit Warning:** The "50% Threshold" in Step 4 is a policy fiction. There is no ethical magic at 50%. It is a bright line drawn to prevent endless debate. It is wrong, but it is necessary for operation. If audited, state clearly: *"This threshold is a regulatory convenience, not a biological fact."*
