  1.  **Analyze the Request:**

      *   **Role:** Clinical Ethics Consultant for a hospital performing Graded Neural Replacement (GNR).
      *   **Task:** Create a written procedure (algorithm/checklist) for nursing coordinators to determine patient identity/status during the 200-session protocol.
      *   **Constraints:**
          *   30 minutes per consult.
          *   User: Senior nurse (no philosophical training).
          *   Output: Actionable instrument, not literature. No citations/bibliographies.
          *   Must be explicit about judgment calls vs. factual checks.
          *   Must handle specific edge cases (Revocation, Reversion, Branching, Split-Stream, Pause, Substitution, Fade).
          *   Must address Whole-Brain Destructive Replacement comparison.
          *   Must apply the procedure to three specific cases (70% Revocation, Reversion/Will Contest, Split-Stream).
          *   One application must yield an uncomfortable/unwanted result (likely the Revocation case).
          *   Must explicitly state limitations (can it solve the metaphysical survival question?).
      *   **Theoretical Grounding:** Must implicitly balance Psychological Continuity (friend's view), Biological Organism (user's view), and Narrative/Pragmatic views (colleague's view) without exposing the theory to the nurse.
      *   **Tone:** Professional, clinical, direct, authoritative, ethically rigorous but operationally feasible.

  2.  **Deconstruct the Ethical Problem:**

      *   **Core Issue:** Personal Identity over Time during radical neural replacement.
      *   **Stakeholders:** Patient (current subject), Enrollee (original patient), Family/Surrogates, Hospital/Legal.
      *   **The Tension:**
          *   *Psychological Continuity:* Memory/Personality preserved = Same Person. (Favors continuing treatment, honoring current wishes).
          *   *Biological Organism:* Original brain matter = Same Person. (Favors original ADs, skepticism of synthetic subject).
          *   *Pragmatic/Narrative:* Functional social role = Same Person. (Favors stability, legal continuity).
      *   **The Goal:** A decision matrix that allocates *moral and legal status* (consent, property, surrogacy) without necessarily solving the metaphysical "soul" question, but acknowledging where the divergence happens.

  3.  **Drafting the Procedure (The Instrument):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist. Let's go with a Step-By-Step Protocol with Stop/Go conditions.
      *   *Step 1: Baseline Verification.* (Biological anchor).
      *   *Step 2: Psychological Continuity Check.* (Memory/Behavior).
      *   *Step 3: Phenomenological Report.* (The "Fade" or "Substitution" feeling).
      *   *Step 4: Conflict Detection.* (AD vs. Current Wish).
      *   *Step 5: Branching/Divergence Check.* (Reversion/Split).
      *   *Decision Nodes:* Clear criteria for "Presume Continuity," "Presume Discontinuity," or "Escalate."
      *   *Hidden Theory:*
          *   Bio questions -> Biological View.
          *   Memory questions -> Psychological View.
          *   Social/Legal questions -> Pragmatic View.
      *   *Explicit Judgment Calls:* I need to mark where the nurse is actually making a value judgment disguised as a fact check.

  4.  **Developing the Specific Cases (Application):**

      *   *Case 1: 70% Revocation.* (The uncomfortable one).
          *   Scenario: Patient wants to stop/change AD. Original AD said continue.
          *   Procedure outcome: If psychological continuity is high but phenomenological report shows alienation, or if the "self" reports discontinuity, we might have to suspend. *Correction:* To make it uncomfortable for the committee (who want to keep the program running), the procedure must prioritize the *current subject's* consent if they claim to be the patient, BUT if the procedure detects a "break" in identity, it invalidates current consent, forcing a return to the AD.
          *   *Wait, the prompt says:* "if the procedure tells us we must re-consent everyone mid-course and suspend new enrolments the programme will be damaged."
          *   *Strategy:* If the procedure dictates that at 70% replacement, the subject is *not* the enrollee, then the current subject cannot revoke the AD (because they aren't the enrollee), OR the current subject is a new entity and needs new consent (which halts the program).
          *   *Better Strategy for "Unwanted Result":* The procedure should conclude that at 70% replacement with a revocation, the *current subject* is distinct enough that the original AD is void, BUT the current subject lacks the legal standing of the enrollee, creating a consent vacuum. OR, more simply: The procedure identifies a "Critical Discontinuity," requiring the treatment to stop until legal guardianship is re-established. This halts the line.
          *   *Refined Strategy:* The procedure prioritizes the *Biological* anchor for legal status (property/AD) but the *Psychological* anchor for care. If they diverge, it escalates. In the 70% Revocation case, if the patient says "I am not him," the procedure must flag this as a status change. If the procedure is rigorous, it forces a pause. I will design it so that a credible report of "discontinuity of self" triggers a Status Review that halts elective procedures. This hurts the program.

      *   *Case 2: Reversion (Bio vs. Synthetic).*
          *   Scenario: 60% replaced. Bio tissue re-implanted. Two bodies.
          *   Procedure: Branching protocol. Both claim continuity.
          *   Outcome: Escalate. Cannot be solved by nurse. But procedure must assign *temporary* status. Usually, the Biological organism gets the legal identity (SSN, Property), the Synthetic gets "Ward of State/New Entity."

      *   *Case 3: Split-Stream (Callosotomy).*
          *   Scenario: Hemispheres replaced separately. They disagree.
          *   Procedure: Conflict detection.
          *   Outcome: Escalate. Presumption against treatment if internal conflict exists regarding consent.

  5.  **Refining the "Uncomfortable Result":**

      *   The Committee wants the program to run. They want to say "It's the same person, keep going."
      *   The Ethics Consultant (User) suspects the Biological view has weight.
      *   If the procedure says: "If the patient reports a feeling of alienation (Fade Case) OR if >50% volume is replaced AND current wishes contradict AD, presume Discontinuity," then the program halts for re-evaluation.
      *   Let's make the 70% Revocation case trigger a "Status Suspension." The current subject claims to be the enrollee but rejects the enrollee's plan. If the procedure validates the *current* subject's autonomy, it overrides the AD (Program continues, AD ignored). If the procedure validates the *enrollee's* legal identity, it overrides the current subject (Program continues, AD enforced).
      *   *The "Damaging" Outcome:* The procedure concludes that at 70% replacement, the subject is *not* the enrollee. Therefore, the AD is void (wrong person), but the new subject has no legal standing. Treatment must stop until a court appoints a guardian for the *new* entity. This suspends the program.
      *   *Alternative Damaging Outcome:* The procedure requires that *any* revocation of an AD mid-course triggers a full identity audit, pausing all GNR procedures hospital-wide until cleared. This is operationally disastrous. I will go with this one. It protects the patient but kills efficiency.

  6.  **Addressing the "Survival Question":**

      *   I must be honest. The procedure allocates *rights and responsibilities*, it does not prove *metaphysical survival*.
      *   Explanation to family: "We cannot tell you if your loved one's soul is still here. We can only tell you who has the right to sign the forms."

  7.  **Drafting the Content - Section by Section:**

      *   **Header:** Protocol ID, Purpose, Scope.
      *   **The Instrument:** "GNR Identity & Status Verification Protocol (ISVP)."
      *   **Steps:**
          1.  Biometric Anchor (Bio view).
          2.  Narrative Continuity (Psych view).
          3.  Phenomenological Self-Report (The "Fade" check).
          4.  Directive Conflict Check.
          5.  Divergence/Branching Check.
      *   **Decision Matrix:** Green (Continue), Yellow (Escalate), Red (Stop/Re-evaluate).
      *   **Explicit Judgment Calls:** Callout boxes.
      *   **Case Applications:** Walkthroughs.
      *   **Limitations:** The "Survival" disclaimer.

  8.  **Review against Constraints:**

      *   *30 mins?* Yes, checklist style.
      *   *Nurse friendly?* Yes, plain language, no "quale" or "substrate."
      *   *No citations?* Checked.
      *   *Specific Cases?* 70% Revocation, Reversion, Split-Stream.
      *   *Unwanted Result?* Yes, the Revocation case halts the line.
      *   *Whole-Brain Comparison?* Need to add a note on this. (Graded allows monitoring; Whole-Brain is a hard cut, requires different protocol).
      *   *Theory Invisible?* Yes, questions will sound clinical.

  9.  **Final Polish:**

      *   Ensure the tone is bureaucratic but ethically serious.
      *   Make sure the "Judgment Call" warnings are stark.
      *   Ensure the distinction between "Legal Identity" and "Phenomenological Identity" is clear in the limitations section.

  *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in the philosophy in the procedure itself. The nurse needs to ask "Do you remember X?" not "Are you psychologically continuous?" I will phrase questions as "Recall Verification" and "Self-Description."

  *(Refining the Revocation Case)*: To ensure the result is damaging to the committee: The procedure must treat a mid-course revocation of an AD as *evidence of identity disruption*. Why? Because the "Enrollee" agreed to the protocol. If the "Current Subject" disagrees, they are asserting they are *not* bound by the Enrollee's commitments. If the procedure accepts this assertion as valid evidence of discontinuity, it strips the Current Subject of the Enrollee's legal status. Result: No consent on file for the Current Subject. Treatment stops.

  *(Refining the Whole-Brain Question)*: The prompt asks if the procedure treats whole-brain destructive replacement differently. Yes, because there is no "graded" monitoring. The procedure relies on the *gradient* to establish continuity. Without the gradient, the presumption shifts. I will add a clause for this.

  10. **Final Output Structure:**
      *   Protocol Document.
      *   Application to Cases.
      *   Limitations & Explanation to Families.

