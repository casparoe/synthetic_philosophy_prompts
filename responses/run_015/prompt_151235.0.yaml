      *   **Finkish Dispositions:** A disposition disappears *just before* the stimulus is applied (e.g., a fragile glass becomes non-fragile the moment it is struck).
      *   **Masking/Antidotes:** The disposition remains, but something prevents the manifestation (e.g., a poison is ingested, but an antidote prevents death; or a fragile glass is packed in bubble wrap so it doesn't break when struck).
      *   **The Core Debate:** Realism about dispositions (powers/causal bases) vs. Humean/Categorical views (dispositions are just regularities or conditionals). The problem is defining the disposition independently of its manifestation conditions without circularity or failure cases.

