answer: |-
  ### 1. Exam Question

  **Question 4: The Structure of Indiscriminability**

  Consider the following semantic model for a subject's epistemic state. Let $W$ be a set of cases (worlds). For each $w \in W$, let $R(w) \subseteq W$ be the set of cases compatible with the subject's evidence at $w$. Assume $R$ is reflexive ($w \in R(w)$). We define knowledge as factive evidential support: $Kp$ is true at $w$ iff $p$ is true at every $v \in R(w)$.

  A condition $C$ is *luminous* iff $\forall w (C(w) \to \forall v \in R(w), C(v))$. The KK principle ($Kp \to KKp$) asserts that knowledge is itself a luminous condition.

  (a) Prove that the KK principle is valid on a frame $\langle W, R \rangle$ (where $R$ is reflexive) if and only if $R$ is transitive.

  (b) Williamson's anti-luminosity argument relies on the premise that $R$ is *not* transitive (due to margin-for-error constraints in sorites series). A proponent of KK might attempt to "repair" the model by redefining the accessibility relation as $R^*$, the transitive closure of $R$, thereby guaranteeing transitivity.

  Demonstrate why this repair strategy leads to the collapse of non-trivial knowledge in a chain-connected sorites series. Specifically, show what happens to the set of known propositions at the starting case of a finite chain $w_1, \dots, w_n$ where $w_{i+1} \in R(w_i)$ for all $i$, if knowledge is redefined relative to $R^*$. What does this imply about the cost of preserving KK in this model?

  ***

  ### 2. Model Answer

  **The Equivalence of KK and Transitivity**
  To establish the equivalence, we assume a reflexive frame $\langle W, R \rangle$.

  First, assume $R$ is transitive. We show KK is valid. Suppose $Kp$ is true at $w$. By definition, $p$ is true at every $v \in R(w)$. To show $KKp$ is true at $w$, we must show that for any $v \in R(w)$, $Kp$ is true at $v$. That is, we must show $R(v) \subseteq \{z \mid p(z)\}$. Since $R$ is transitive, if $v \in R(w)$, then $R(v) \subseteq R(w)$. Since $Kp$ holds at $w$, $R(w) \subseteq \{z \mid p(z)\}$. By subset transitivity, $R(v) \subseteq \{z \mid p(z)\}$. Thus $Kp$ holds at $v$, and $KKp$ holds at $w$.

  Second, assume KK is valid on the frame. We show $R$ is transitive. Suppose $wRv$ and $vRu$. Let $P$ be the proposition $\{z \mid wRz\}$. Since $R$ is reflexive, $w \in R(w)$, so $P$ is true at $w$. Moreover, $KP$ is true at $w$, because for any $x \in R(w)$, $P$ is true at $x$ (since $x \in R(w)$ by definition). By the validity of KK, $KKP$ is true at $w$. This implies that for any $y \in R(w)$, $KP$ is true at $y$. Since $wRv$, $v \in R(w)$, so $KP$ is true at $v$. This means $R(v) \subseteq P$. Since $vRu$, $u \in R(v)$, so $u \in P$. By the definition of $P$, $wRu$. Thus, $R$ is transitive.

  **The Collapse of the Transitive Closure**
  The anti-luminosity argument posits that in sorites series (e.g., shades of color), evidential indiscriminability is intransitive: one cannot distinguish $w_i$ from $w_{i+1}$, nor $w_{i+1}$ from $w_{i+2}$, but one can distinguish $w_1$ from $w_n$. Formally, $w_{i+1} \in R(w_i)$, but $w_n \notin R(w_1)$. This intransitivity validates the failure of KK.

  To preserve KK, one might redefine knowledge using $R^*$, the transitive closure of $R$. $R^*$ is the smallest transitive relation containing $R$. By construction, $R^*$ validates KK. However, in a chain-connected sorites series where $w_{i+1} \in R(w_i)$ for all $1 \leq i < n$, the transitive closure connects the endpoints. Since $w_1 R w_2$, $w_2 R w_3, \dots$, transitivity requires $w_1 R^* w_n$.

  If the series is dense or covers all discriminable variations between a clear case of $p$ and a clear case of $\neg p$, $R^*$ tends toward the universal relation $W \times W$. If $R^*(w_1) = W$, then $Kp$ is true at $w_1$ only if $p$ is true at every world in $W$. This restricts knowledge to necessary truths. Contingent propositions (e.g., "I am in pain") can no longer be known, because there is some world in the chain where they are false.

  **Conclusion**
  The structural link between KK and transitivity forces a dilemma. Accepting the margin-for-error constraints required for non-trivial knowledge in sorites cases requires accepting intransitivity, which entails the falsity of KK. Attempting to save KK via transitive closure eliminates the margin for error but collapses the distinction between cases, resulting in skepticism. One cannot simultaneously maintain non-trivial knowledge in sorites series and the KK principle within this evidential model.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Point 1: Proof of Transitivity $\to$ KK (5 marks)**
  *   **Must Hit:** Correctly uses the subset definition of knowledge ($R(w) \subseteq p$) and the definition of transitivity ($wRv \land vRu \to wRu$ or $R(v) \subseteq R(w)$) to show that if $Kp$ at $w$, then $Kp$ at all $v \in R(w)$.
  *   **Common Error:** Argues intuitively about "knowing that one knows" without using the subset semantics of $R(w)$; or assumes transitivity in the proof without stating it.

  **Point 2: Proof of KK $\to$ Transitivity (5 marks)**
  *   **Must Hit:** Constructs a specific proposition (e.g., $P = R(w)$) to show that if KK holds, $R(v) \subseteq R(w)$ must follow, thereby establishing transitivity given reflexivity.
  *   **Common Error:** Attempts to prove this direction by assuming $R$ is transitive to prove KK (circularity); or fails to utilize the reflexivity of $R$ which is required for $KP$ to hold at $w$ in the canonical proof.

  **Point 3: Identification of the Repair Strategy (5 marks)**
  *   **Must Hit:** Explicitly identifies that preserving KK requires replacing $R$ with its transitive closure $R^*$.
  *   **Common Error:** Suggests repairing KK by tightening the margin for error (making $R$ smaller) rather than closing $R$ under transitivity; or treats the "repair" as a modification of the KK principle itself.

  **Point 4: The Collapse Mechanism (5 marks)**
  *   **Must Hit:** Demonstrates that in a chain $w_1 \dots w_n$ where adjacent worlds are related, $R^*$ relates $w_1$ to $w_n$. Explains that if the chain covers all discriminable states, $R^*(w)$ becomes $W$, restricting knowledge to necessary truths.
  *   **Common Error:** Claims knowledge collapses because the subject becomes "confused"; fails to show formally why $R^*$ connects the endpoints of the sorites series; or argues that $R^*$ makes $R$ reflexive (it was already reflexive).

  **Point 5: Philosophical Upshot (5 marks)**
  *   **Must Hit:** Concludes that the model forces a choice between KK and non-trivial knowledge in sorites contexts (Skepticism vs. Anti-Luminosity). Acknowledges that the margin-for-error argument is not an independent refutation of KK but a motivation for intransitivity.
  *   **Common Error:** Summarizes Williamson's psychological claims about attention or cognitive limits without referencing the formal model; concludes that KK is simply "false" without analyzing the cost of making it true (the collapse).

  **General Penalty:**
  *   **-10 marks** if the answer consists primarily of a summary of Williamson's *Knowledge and Its Limits* Chapter 4 without engaging with the formal proofs requested in parts (a) and (b).
