answer: |-
  **Setting:** *The Grind & Bean, across from the philosophy building. It's 4 PM on a Tuesday. Empty mugs, half-eaten cookies. Mara is stirring a latte aggressively. Jules is leaning back, scrolling on their phone but looking up.*

  **Mara:** Okay, but you're ignoring the modal intuition. If I swap out a brick in a wall, it's the same wall. If I swap every brick over ten years, it's still the same wall. So why does the statue vanish just because the stuff changed from clay to polymer?

  **Jules:** Because a wall isn't a statue. The sortal matters. Look, in the seminar case, the clay didn't just vanish. It was gathered up. Then someone made a bowl out of it. If the statue was identical to the clay, and the clay is now a bowl, then the statue is a bowl. Which is absurd.

  **Mara:** Right, that's the standard constitution view. Statue ≠ Clay. But in this weird replacement case, the statue *shape* never went away. It was continuous. So the statue persisted through the material change. The clay took a different path—it went off to become a bowl. That just proves the statue isn't tied to any specific lump of matter. It's tied to the form, the history of maintenance.

  **Jules:** But that's where you're glossing over the metaphysics of identity. You're saying the statue at year zero is *numerically identical* to the statue at year ten. I'm saying that's false. At year ten, you have a polymer object that looks like the statue. It's a new statue. A replica that came into existence gradually.

  **Mara:** Gradually? Jules, there was no moment where the statue ceased to exist. You can't point to a timestamp and say "okay, now it's gone." If there's no boundary, how do you say it's a new object?

  **Jules:** Because identity isn't just about blurry boundaries. It's about persistence conditions. Think about the bowl. The original clay survived the whole process, right? It was dug up, reshaped. So the clay has a continuous career. But if the statue also survived in the polymer, then for those ten years, you had the statue co-located with the clay. Then the clay leaves. If the statue stays, then the statue's persistence conditions allow total matter replacement. But if the clay becomes a bowl, and we say *that* clay was the original constituent... look, it's cleaner to say the statue is just a sequence of temporal stages.

  **Mara:** Stage theory? Really? You're gonna go Sider on me over a coffee?

  **Jules:** Why not? It solves the problem. The "statue" at t=1 is a stage. The "statue" at t=2 is a later stage. They are related by continuity, but they aren't *the same thing* in the strict identity sense. When the clay gets swapped for polymer, the causal chain of the *statue-stages* continues, sure. But when the clay gets made into a bowl, that's a different causal chain for the matter. The fact that the clay can become a bowl shows the matter had a different modal profile than the statue.

  **Mara:** Okay, but listen. If I ask "Could this statue have been made of polymer?" you'd say yes, right? Because it's possible for a statue to be polymer.

  **Jules:** Sure. Possible worlds semantics. There's a world where the artist used polymer.

  **Mara:** Exactly. So the statue has the modal property of *being possibly polymer*. If the statue is identical to the original clay lump, then the statue has the modal property of *being essentially clay*. Because the lump is essentially clay. If you melt the lump, it's gone. But if the statue survives the swap, then the statue doesn't have the "essentially clay" property. Therefore, Statue ≠ Clay. And if Statue ≠ Clay, and the polymer object at year ten is functioning as the statue, why isn't it the *same* statue?

  **Jules:** Because you're conflating qualitative similarity with numerical identity. The polymer object at year ten is qualitatively identical to the year zero statue. But numerically? It's distinct. Think about the bowl again. If the statue survived the swap, then the original clay ceased to be part of the statue. When that clay becomes a bowl, it's not destroying the statue. But if the statue was one continuous enduring object, what happens to its relation to the clay?

  **Mara:** The relation changes! It stops being constituted by *that* clay.

  **Jules:** See, that's the magic. "Constitution" is doing all the work here. If constitution isn't identity, then what binds the stages together? If I replace every molecule, I've basically built a new thing that occupies the same space. The fact that the old clay is now a bowl proves the clay had its own identity conditions. It survived. The statue... well, the statue-stages continued. But saying the *whole object* endured through total matter replacement is just begging the question.

  **Mara:** It's not begging the question, it's acknowledging how we treat artifacts. We restore paintings. We replace rotting wood in historic ships. We say "This is the Constitution." We don't say "This is a new ship made of fiberglass that looks like the Constitution." If metaphysics tells me my intuition about the ship is wrong, maybe the metaphysics is too strict.

  **Jules:** Or maybe your intuition is about *reference*, not identity. We *call* it the same ship for legal or historical reasons. But ontologically? It's a sequence of stages. The bowl case breaks the symmetry. If the clay is still around as a bowl, and the statue is still around as polymer, you have two objects. If they were identical, you'd have one object that is both a statue and a bowl. Since that's impossible, they diverged. And if they diverged, the statue didn't survive the loss of the clay—it was replaced by a polymer counterpart.

  **Mara:** But that makes "statue" a super fragile concept. Like, if I sneeze on it and a molecule falls off, is it a new statue?

  **Jules:** No, because stages allow for gradual change. Perdurantism handles the vagueness. Endurantism—your view—has to explain how an object can be wholly present at t1 and wholly present at t2 with completely different parts. That's where the magic happens.

  **Mara:** It's not magic, it's functional continuity. The statue is defined by its role, its shape, its artistic intent. The clay is just the vehicle. When the vehicle gets swapped, the passenger stays. The bowl is just the old vehicle repurposed.

  **Jules:** But the passenger wasn't there before the swap. The "statue" property emerges from the arrangement. If you rearrange the polymer, you get the statue. If you rearrange the clay, you get a bowl. They're different sorts. You can't have one thing be both essentially clay and essentially polymer-compatible without contradiction.

  **Mara:** Unless the essence isn't the material. That's the point! The essence is the form.

  **Jules:** Then you're a hylomorphist. Just say that. But then you have to deal with the fact that the clay *also* persisted. So you've got two things in the same place at the same time for ten years.

  **Mara:** Yeah! Co-location. It's weird, but it's better than saying the statue dies every time you fix a crack.

  **Jules:** Or it's better than saying identity is loose. Look, I'm just saying... if the clay is now a bowl, the original material has a career that excludes being a statue anymore. The polymer thing has a career that includes being a statue. They're different histories. Different objects.

  **Mara:** Fine. Different objects. But is the polymer object the *successor* of the original statue?

  **Jules:** Sure. Like a successor stage.

  **Mara:** And if I care about the art, I care about the successor.

  **Jules:** Exactly. So we agree on the practice. We disagree on the ontology.

  **Mara:** Typical. Another coffee?

  **Jules:** Yeah. I'm gonna need it if we're gonna talk about temporal parts next week.

  **Mara:** Don't remind me. 

  *(Jules signals the barista. Mara checks her phone, still frowning slightly.)*
