prompt: |-
  hey — I'm a backend engineer, no philosophy background beyond stackexchange flamewars, and I somehow ended up on our incident review board. We run blameless postmortems (good), but there's a second step afterwards where we write an "accountability note" that goes into the person's file and feeds promo and comp. So we absolve blame and then assign it anyway, which feels incoherent but nobody can say exactly why.

  The thing that keeps biting us: two people make basically the same call with the same information, one gets a bad outcome and one doesn't, and the two notes come out completely different. Someone told me this has a name — "moral luck"? apparently there are a few flavors: luck in how things turn out, luck in what situation you landed in, luck in what kind of person you are. That sounds like our problem, except we can't just shrug. We meet weekly, we have about an hour per incident, there's an EM and someone from HR in the room, and the output goes in someone's permanent record.

  What I want is a procedure, not an essay. Something my team can literally run:

  - a fixed order of questions to answer from the incident writeup
  - what counts as a sufficient answer to each, in normal-person language (my EM will not read a sentence with "counterfactual" in it)
  - where the procedure stops and says no accountability
  - where it hands off to a human because the remaining question is about values, not facts

  Specific things it has to handle, because these are the ones we actually argue about:

  First, we already know the outcome when we write the note, and I don't think we can un-know it. So give me a concrete trick for separating "was this decision reasonable given what was knowable at the time" from "did it turn out badly." My idea was to write two notes — one with the outcome redacted, one with it — and if they disagree, that disagreement is the luck, and we have to say out loud which one we're filing. Tell me if that's workable or if it's self-deception.

  Second, the inverse case: someone who skipped review, pushed to prod on a Friday, and got away with it — no incident, and it cut p99 latency in half so they looked great. My intuition is he should get the same note as the person who skipped review and caused a six hour outage. Make that fall out of the procedure rather than being an extra rule bolted on.

  Third, symmetry: whatever strips blame for lucky outcomes should also strip credit. Our "heroes" are often just people whose risky hotfix happened to work, and HR really does not want to hear that, so flag where that bites.

  Fourth, the temperament thing. Some of our engineers are wired cautious and never cause incidents; some are cowboys and sometimes cause them and sometimes ship the thing that saves us. If part of what we're rating is just personality, that's the third kind of luck and I don't know what to do with it procedurally — you can't put "be more cautious" in a performance note.

  Fifth, near misses and latent bugs that never fired, and the related case where the badness depends on when we happened to discover it. And a case we hit last month: the person who owned the service for three weeks versus the person who wrote the code four years ago.

  Two more constraints. I can't read academic stuff — no citations, no reading lists, no paywalled papers; if you're leaning on a distinction from the literature, explain it in one sentence in your own words. And please mark honestly the steps where we're not really doing desert at all, we're doing incentives or deterrence or politics — I'd rather have that labeled as a values call than have it smuggled in as if it were a finding.

  Run the finished procedure on three of the cases above, including at least one where it gives an answer the board will push back on hard. Then tell me which single step is the weakest and where the whole thing will definately misfire on us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Backend engineer, no philosophy background, on an incident review board.
      *   **Problem:** "Blameless" postmortems followed by "accountability notes" that affect promo/comp. This creates incoherence (absolve then assign). Specifically, "Moral Luck" issues (outcome bias, circumstance, temperament).
      *   **Goal:** A concrete *procedure* (algorithm/checklist), not an essay.
      *   **Constraints:**
          *   Fixed order of questions.
          *   Sufficient answer criteria (plain English, no jargon like "counterfactual").
          *   Clear stop conditions (no accountability vs. human values call).
          *   Handle specific cases: Outcome bias (bad result vs. good result), Process violations (skipped review), Symmetry (strip credit for lucky heroes), Temperament (cautious vs. cowboy), Tenure/Ownership (new owner vs. old author), Near misses.
          *   No academic citations/jargon (explain concepts simply).
          *   Label where the process is actually about incentives/politics, not "desert" (fairness).
          *   Run the procedure on 3 cases (including one controversial).
          *   Identify the weakest step/likely failure point.

  2.  **Deconstruct the Core Conflict:**
      *   The company wants a "Just Culture" (blameless learning) *and* a Performance Management system (individual accountability). These are often at odds.
      *   The user identifies "Moral Luck" correctly: judging people based on outcomes they couldn't fully control.
      *   The "Two Notes" idea (redacting outcome) is a known technique in safety science (often called "substitution test" or similar), but doing it literally might be too much overhead. I need to adapt it into a question flow.
      *   The "Skipped Review" case is a process violation, not necessarily an error in judgment *during* the incident. This needs a specific branch.
      *   The "Hero" case needs to be symmetrical to the "Scapegoat" case.
      *   Temperament/Personality is hard to judge procedurally. It usually maps to "pattern of behavior" over time, not a single incident.
      *   Tenure/Ownership: Accountability should follow ownership/responsibility at the *time of the decision*, not necessarily who wrote the code.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Ask what happened. Ask if they broke a rule. Ask if they knew the risk. Ask if the outcome was random. Decide.
      *   *Critique 1:* Too vague. Doesn't handle the "outcome bias" trick. Doesn't separate incentives from fairness.

      *   *Attempt 2 (Incorporating the "Two Notes" idea):*
          1.  Hide the outcome. Would we have flagged this action?
          2.  If yes, proceed. If no, stop (it's outcome bias).
          3.  Did they violate a defined safety rule?
          4.  If yes, accountability. If no, check intent.
      *   *Critique 2:* Better. Needs to handle the "Hero" symmetry. Needs to explicitly call out where we are doing "HR politics" vs. "Fairness."

      *   *Attempt 3 (Refining for the User's Constraints):*
          *   Need a "Gatekeeper" question to filter out Moral Luck (Outcome).
          *   Need a "Process vs. Judgment" split.
          *   Need a "Pattern" check for temperament (single incident vs. trend).
          *   Need explicit "Values/Incentives" flags.

  4.  **Developing the "Outcome Independence" Trick:**
      *   The user suggested writing two notes. That's high overhead.
      *   *Better Procedure:* The "Time-Travel Question." Ask: "If this exact same decision had resulted in zero downtime, would we be having this meeting?"
      *   *Refinement:* Make it a specific step. "The Mirror Test."

  5.  **Developing the "Process Violation" Logic:**
      *   If a rule was broken (e.g., no review on Friday), that's actionable regardless of outcome. This solves the "Skipped Review" case.
      *   But, if the rule is vague, it's not a violation.

  6.  **Developing the "Temperament/Pattern" Logic:**
      *   Single incident != Temperament.
      *   Procedure must stop at single incident for personality judgments. That requires HR/EM to look at history *outside* this procedure.

  7.  **Structuring the Procedure:**
      *   **Phase 1: The Outcome Filter (Moral Luck Check).**
      *   **Phase 2: The Rule Check (Process vs. Judgment).**
      *   **Phase 3: The Knowledge Check (Foreseeability).**
      *   **Phase 4: The Handoff (Values & Incentives).**

  8.  **Addressing Specific Constraints:**
      *   *No jargon:* Explain "Moral Luck" as "Judging the roll of the dice."
      *   *Label Values:* Explicitly mark steps where we are choosing "Deterrence" over "Fairness."
      *   *Run on 3 Cases:*
          1.  Same decision, different outcome (The Core Luck problem).
          2.  Skipped review, worked out (The Hero/Rulebreaker).
          3.  Old code vs. New owner (The Tenure problem).
      *   *Weakest Step:* Identify where human bias will creep back in (likely the "Reasonable Person" standard).

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The user wants to know *where* to stop accountability. I need to make sure "No Accountability" is a valid output.
      *   *Correction:* The "Two Notes" idea is actually really good but maybe too heavy. I will adapt it as a mental check in Step 1 rather than a literal document workflow, but acknowledge the literal version is the gold standard if they have time. Actually, the user asked if it's workable. I should say "Yes, but simplify it." Let's make it a verbal question in the room.
      *   *Correction on Tenure:* Accountability belongs to the person with *control* at the time. If the new owner inherited tech debt, they aren't accountable for the debt, only for how they managed it *after* taking ownership.
      *   *Correction on Temperament:* This procedure is for *one incident*. Temperament requires a *series* of incidents. I must flag this limitation.

  10. **Final Polish:**
      *   Ensure tone is pragmatic/engineering-focused.
      *   Check all 5 specific problem areas are addressed.
      *   Ensure the "Values/Politics" flags are clear.
      *   Make sure the "Weakest Step" is honest.

  11. **Drafting the Response:** (Mental check of the steps against the prompt requirements)
      *   *Fixed order?* Yes.
      *   *Sufficient answer?* Yes.
      *   *Stop conditions?* Yes.
      *   *Human handoff?* Yes.
      *   *Outcome bias trick?* Yes (The "Zero-Impact Mirror").
      *   *Process violation?* Yes (The "Written Rule" test).
      *   *Symmetry?* Yes (Applied in Step 1 & 4).
      *   *Temperament?* Yes (Flagged as out-of-scope for single incident).
      *   *Tenure?* Yes (Control test).
      *   *No jargon?* Yes.
      *   *3 Case Runs?* Yes.
      *   *Weakest Step?* Yes.

      *(Self-Correction on the "Two Notes" idea)*: The user asked "Tell me if that's workable." I should answer that directly. It's workable but expensive. I'll integrate the *logic* of it into Step 1 to save time, but validate their intuition.

      *(Refining the "Values" label)*: I need to be very clear when the procedure says "We are now doing HR policy, not truth."

      *(Refining the "Weakest Step")*: It's usually the definition of "Reasonable." Who defines reasonable? The EM? The Board? That's where bias enters.

      Let's write it.cw
answer: |-
  This is a classic "Just Culture" implementation problem. You are trying to mix **Safety Science** (learn from the system) with **Performance Management** (judge the individual). They are fundamentally different goals, which is why it feels incoherent.

  Your intuition on "Moral Luck" is correct. In plain English: **You are judging the roll of the dice, not the throw.**

  Here is a procedure designed to separate the *decision* from the *outcome*, and the *individual* from the *system*. It is designed to be run in your 1-hour window.

  ### The "Decision-Outcome Split" Procedure

  **Pre-requisite:** The Incident Writeup must be finished *before* this meeting starts. This meeting is only for the Accountability Note.

  #### Step 1: The Zero-Impact Mirror (Filters Outcome Luck)
  **Question:** "If this exact same decision, made with this exact same information, had resulted in **zero** customer impact, would we still be discussing accountability?"

  *   **Sufficient Answer:** A unanimous "Yes" or "No" from the board.
  *   **If No:** Stop. **No Accountability Note.** The issue is outcome bias. File the postmortem, close the ticket.
      *   *Why:* You are punishing the bad luck, not the bad decision.
  *   **If Yes:** Proceed to Step 2.
      *   *Note on your "Two Notes" idea:* Writing two physical notes is too much overhead. This verbal question achieves the same logical separation. If you can't answer this honestly, you aren't ready for Step 2.

  #### Step 2: The Written Rule Test (Filters Process Luck)
  **Question:** "Did the engineer violate a **specific, written** safety rule or process constraint (e.g., 'No deploys on Friday', 'Requires L2 review')?"

  *   **Sufficient Answer:** Cite the specific rule ID or document. If the rule is "Use good judgment," the answer is **No**.
  *   **If No:** Proceed to Step 3.
  *   **If Yes:** Proceed to Step 4.
      *   *Handles the "Cowboy" case:* This ensures the person who skipped review gets the same note regardless of whether the deploy worked or crashed.

  #### Step 3: The Foreseeability Check (Filters Knowledge Luck)
  **Question:** "At the exact moment of the decision, was the risk **knowable** to a reasonable engineer with their access level?"

  *   **Sufficient Answer:** "Yes, because [alert/log/doc existed]" OR "No, because [information was hidden/undocumented]."
  *   **If No:** Stop. **No Accountability Note.** This is a system/visibility failure.
  *   **If Yes:** Proceed to Step 4.
      *   *Handles the "Old Code" case:* If the risk was buried in 4-year-old code with no docs, the new owner couldn't know. If the risk was in a runbook they ignored, they could know.

  #### Step 4: The Values Handoff (The "Politics" Step)
  **Question:** "We have established a decision was made that violated a rule or known risk. Is the goal of this note **Fairness** (what they deserve) or **Deterrence** (sending a message)?"

  *   **Sufficient Answer:** The EM must state the goal aloud.
  *   **If Fairness:** The note is limited to the specific deviation found in Steps 2 & 3.
  *   **If Deterrence:** The note may be escalated to signal priority (e.g., "Critical violation of deploy policy").
      *   *Label:* **This is not a finding of fact.** This is a management decision. HR must record which goal was chosen.
      *   *Handles the "Hero" case:* If you use Deterrence here, you must also apply it to the "Hero" who skipped review and succeeded. If you won't punish the Hero, you cannot punish the Scapegoat under this banner.

  #### Step 5: The Pattern Check (Filters Temperament Luck)
  **Question:** "Is this behavior part of a **documented pattern** over the last 12 months, or is it an isolated incident?"

  *   **Sufficient Answer:** HR/EM must cite prior tickets or notes.
  *   **If Isolated:** The Accountability Note **cannot** mention personality, caution, or "risk profile." It must be limited to the specific action.
  *   **If Pattern:** The note may reference "recurring failure to adhere to process."
      *   *Why:* You cannot judge temperament on a single data point. That is Moral Luck (Constitutional Luck).

  ---

  ### Procedure Test Runs

  Here is how this runs on three of your specific scenarios.

  #### Case 1: The Twin Decisions (Outcome Luck)
  *   **Scenario:** Engineer A and Engineer B both deploy a risky config change without extra testing. A causes an outage. B does not.
  *   **Step 1 (Mirror):** Board asks: "If A's deploy had worked, would we be here?"
      *   *Honest Answer:* "No."
  *   **Result:** **Stop.** No Accountability Note for A.
  *   **Pushback:** The board will want to say "But we lost money."
  *   **Counter:** The money loss is real, but attaching it to the *person's file* is the error. The *system* pays for the outage; the *person* is only accountable for the deviation. If you file a note for A, you must file one for B. If you won't file for B, you cannot file for A.

  #### Case 2: The Lucky Cowboy (Process Violation)
  *   **Scenario:** Engineer skips code review on Friday. Deploy cuts latency by 50%. No outage.
  *   **Step 1 (Mirror):** "If this caused an outage, would we be here?" -> "Yes." (Proceed)
  *   **Step 2 (Rule):** "Did they violate a rule?" -> "Yes, 'No Friday Deploys' and 'Requires Review'." (Proceed)
  *   **Step 4 (Values):** EM chooses "Deterrence" because skipping review is dangerous.
  *   **Result:** **Accountability Note Filed.** "Violated deploy policy."
  *   **Symmetry Check:** Because Step 1 passed, this same note *must* be available for the engineer who skipped review and *caused* the outage. The outcome is irrelevant. The note is about the rule violation, not the downtime.

  #### Case 3: The Inherited Mess (Tenure/Knowledge Luck)
  *   **Scenario:** New owner (3 weeks) inherits service. Old code (4 years ago) has a latent bug that fires.
  *   **Step 1 (Mirror):** "If this didn't fire, would we be here?" -> "No." (Wait, this is tricky. Let's assume we are investigating the *response* or the *presence* of the bug). Let's assume the question is: "Is the new owner accountable for the bug existing?"
  *   **Step 3 (Foreseeability):** "Was the risk knowable to the new owner?"
      *   *Answer:* "No. No logs, no docs, code written 4 years ago by someone else."
  *   **Result:** **Stop.** No Accountability Note.
  *   **Nuance:** If the new owner ignored alerts *after* taking ownership, Step 3 becomes "Yes." Accountability follows **control**, not authorship.

  ---

  ### Where This Will Misfire (The Weakest Step)

  **Step 3: The Foreseeability Check ("Reasonable Engineer").**

  **Why it's weak:** "Reasonable" is a legal fiction. In practice, the most senior person in the room defines "reasonable."
  *   **The Failure Mode:** A Staff Engineer says, "I would have caught that," and suddenly the Junior Engineer's decision becomes "unreasonable," even if the Junior had no way to know.
  *   **The Bias:** This is where "Temperament Luck" sneaks back in. If the board likes the engineer, the risk was "unforeseeable." If they don't, it was "obvious."

  **How to mitigate:**
  Require that "Knowable" means **documented or alerted**. If it wasn't in a runbook, a ticket, or an alert, it was not knowable. Do not allow "I would have known" as evidence.

  ### Where We Are Lying to Ourselves (The Values Label)

  **Step 4: The Values Handoff.**

  You asked me to flag where this isn't about "desert" (fairness). It is Step 4.
  *   **The Reality:** Sometimes you *need* to punish a safe decision because the risk was too high (e.g., playing with production data, even if no data leaked).
  *   **The Lie:** Calling this "Accountability" implies the person did something morally wrong. Often, they just took a risk the company now decides it can't tolerate.
  *   **The Fix:** When Step 4 is triggered, the Accountability Note should explicitly read: *"Decision violated current risk tolerance,"* NOT *"Engineer demonstrated poor judgment."* The first is a policy update; the second is a character judgment. HR usually prefers the second because it's easier to fire people for "character." You need to push for the first.

  ### Summary of Constraints Check
  1.  **Outcome Bias:** Handled by Step 1 (Zero-Impact Mirror).
  2.  **Process Violation:** Handled by Step 2 (Written Rule).
  3.  **Symmetry:** Enforced by Step 1 & 4 (If the note applies to the crash, it applies to the success).
  4.  **Temperament:** Handled by Step 5 (Pattern Check).
  5.  **Tenure:** Handled by Step 3 (Foreseeability/Control).
  6.  **No Jargon:** Used "Knowable," "Written Rule," "Pattern."
  7.  **Values Label:** Explicitly marked in Step 4.

  **Final Advice:** Your "Two Notes" idea is logically sound but operationally heavy. Use the **Step 1 Question** as a gate. If the room cannot agree on the answer to Step 1, do not write *any* note. A disputed note is worse than no note.
