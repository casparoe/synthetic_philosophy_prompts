answer: |-
  **Essay Question**

  **Topic:** The Catuskoti and the Causality of Emptiness
  **Texts:** *Mūlamadhyamakakārikā* (Ch. 1 & 24)

  Nāgārjuna employs the *catuṣkoṭi* (tetralemma) to deconstruct essentialist views, but what happens when we apply this logic to the relation between emptiness (*śūnyatā*) and conventional appearance? Evaluate the following proposition: "Emptiness causes conventional phenomena." Analyze this claim through the four corners of the tetralemma. Then, consider a fifth option: that emptiness is merely the absence of intrinsic nature (*svabhāva*) and therefore cannot be a causal agent at all. Does this fifth option successfully avoid reification, or does it secretly smuggle in a Nyāya-style real causal power (*śakti*)? Explain why treating absence as a functional ground might collapse back into eternalism or nihilism.

  ***

  **Model Answer**

  To apply the *catuṣkoṭi* to the relation between emptiness and conventional appearance is to test the limits of conceptual proliferation regarding causality. If we posit emptiness as the cause of phenomena (Corner 1), we commit a fundamental category error. Emptiness is not an entity; to grant it causal efficacy is to reify it into a substantial ground (*svabhāva*). This violates the core insight that emptiness itself must be empty. If emptiness produces things, it exists independently of them, rendering it uncaused and permanent. This contradicts the examination of conditions in Chapter 1, where no condition—whether existing, non-existing, or both—can be found to establish production. Emptiness cannot be a producer without becoming a god-like creator.

  Conversely, denying any relation (Corner 2) suggests emptiness negates appearance. This collapses conventional reality into nothingness. If emptiness means nothing exists, then karma, suffering, and liberation are impossible. This is the nihilistic view Nāgārjuna warns against, where the destruction of intrinsic nature is mistaken for the destruction of existence itself. If phenomena do not arise even conventionally, the Buddha's teaching becomes void.

  The Middle Way avoids these extremes through *pratītyasamutpāda* (dependent origination). Emptiness is not a cause separate from effects; it is the very lack of intrinsic nature that allows dependent arising to occur. Because things lack fixed essence, they can change and interact. Thus, emptiness and appearance are non-dual. To say "neither emptiness causes appearance nor does it not" is to recognize that causality only operates conventionally, while ultimately no causal agents possess independent power. Emptiness is the quality of the process, not the agent of it.

  However, a hidden fifth option arises: claiming emptiness is merely the absence of *svabhāva* and therefore cannot be a causal agent at all. While this avoids Corner 1, it risks smuggling in a Nyāya-style real causal power (*śakti*). If this "absence" is what *permits* function, does the absence itself possess a functional nature? If the lack of essence is treated as a positive explanatory principle that guarantees conventional validity, it becomes a subtle eternalism. We have reified "absence" into a ground of being. If, however, this absence is truly empty, it cannot even stand as a stable "permitting condition" without collapsing back into Corner 2 (nothingness). The trap lies in thinking "absence of nature" is a *thing* that does work.

  Ultimately, Nāgārjuna's strategy in Chapter 24 is to show that emptiness is the soteriological undoing of views, not a metaphysical position. To treat emptiness as a causal mechanism, whether positive or negative, is to grasp at a view. The Middle Way is not a position between existence and non-existence, but the relinquishing of the demand for intrinsic causality altogether. Conventional truth functions only because it is empty, not because emptiness makes it function. To posit a causal link is to miss the point that there is no link to be found ultimately.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Corner 1 Analysis (Reification) [0–5 marks]**
  *   **5:** Clearly explains that treating emptiness as a cause reifies it into *svabhāva*, contradicting the emptiness of emptiness. References the impossibility of finding conditions (Ch. 1).
  *   **3–4:** Identifies reification but lacks precision on why causality implies intrinsic nature.
  *   **0–2:** Fails to identify the contradiction or confuses emptiness with a substance.

  **2. Corner 2 Analysis (Nihilism) [0–5 marks]**
  *   **5:** Correctly identifies that denying the relation collapses conventional truth (karma/liberation) into nothingness.
  *   **3–4:** Identifies nihilism but conflates conventional reality with illusion (fails to save appearance).
  *   **0–2:** Misses the soteriological consequence (negation of Four Noble Truths).

  **3. Middle Way (Dependent Origination) [0–5 marks]**
  *   **5:** Articulates non-duality of emptiness and appearance; causality is conventional, not ultimate.
  *   **3–4:** Describes Middle Way but treats it as a separate metaphysical position rather than the undoing of views.
  *   **0–2:** Vague description of "balance" without referencing dependent origination.

  **4. The Fifth Option & Nyāya Trap [0–5 marks]**
  *   **5 (A Grade):** Identifies that treating "absence" as a functional ground smuggles in a real power (*śakti*), leading to subtle eternalism or collapse into nihilism.
  *   **3–4 (B Grade):** Discusses the fifth option but misses the hidden reification of "absence" or fails to see the collapse back into Corner 2.
  *   **0–2:** Dismisses the fifth option too quickly or accepts it as fully coherent without critique.

  **Grade Boundaries:**
  *   **A (16–20):** Hits all four criteria with precision; specifically catches the hidden reification in the fifth option.
  *   **B (12–15):** Covers the tetralemma well but misses the nuance of the fifth option or confuses conventional reality with illusion.
  *   **C (8–11):** Basic understanding of emptiness but fails to apply the *catuṣkoṭi* structure correctly.
  *   **D/F (0–7):** Significant philosophical errors or failure to address the prompt.
