prompt: |-
  I'm a journalist who covers science and ideas, and the vocabulary I actually think in is sourcing vocabulary: on the record, attributable, single-sourced or held up by a second source, what an editor will let us print, what we're willing to state in the paper's own voice rather than attribute to someone, what belongs in a correction rather than a rewrite, what survives when a source is asked to repeat it under challenge. Use it freely; I don't need it defined for me.

  I want you to translate a disagreement I keep circling but can't get my own vocabulary to hold. When a community's account of its own past and the documentary record come apart — a town's founding story the land records don't support, a family's account of a death that the death certificate describes differently, a demonstration an entire neighborhood remembers on a date no paper covered — there seem to be roughly three things one can say. First: the record wins, because memory is testimony, testimony is the weakest grade of source, and where the two conflict the documents correct the memory. Second: the community's version is not a weaker report of the same thing; it is doing work the record cannot do, holding a "we" together across generations and licensing what that group owes, and overwriting it with the record destroys something real. Third: there is no conflict to resolve, because the two are different genres under different norms, one answering what happened and the other answering what we are answerable to, so neither should give way.

  Restate each of these three in my vocabulary as faithfully as you can, then give me the residue report: which claims map cleanly onto sourcing and verification, which fit only once you have distorted them, and which cannot be expressed in that vocabulary at all. Two constraints. Don't smuggle in my framework's working assumption that there is a single what-happened that sources approximate more or less well and then present the result as a translation — if a position only survives by quietly granting that, say which and where. And test a suspicion rather than flattering it: that much of what looks like a dispute about which version is better supported is really a dispute about who has standing to speak for a past, whether the relevant "we" is the people who were there and their descendants or whoever can currently command the documents. If that suspicion is only the third position in different clothes, say so.

  One more case to handle: newsrooms have their own version of this, where the institution's memory — the clips, the old corrections, what we said at the time — diverges from what the documents support. Tell me whether that internal case is a fair model of the collective-memory dispute or a misleadingly easy one. Close by saying whether whatever is left over is a gap in sourcing vocabulary, something a reporter has no way to say but probably should, or a sign that one of the three positions was never as clear as it sounds. No citations or reading lists; I want the argument, not the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Journalist covering science and ideas. Thinks in "sourcing vocabulary" (on/off record, attributable, corroboration, editorial standards, corrections vs. rewrites, etc.).
      *   **Task:** Translate a specific philosophical/historical disagreement (Community Memory vs. Documentary Record) into this sourcing vocabulary.
      *   **The Three Positions:**
          1.  Record wins (Document > Memory/Testimony).
          2.  Community version does different work (Social cohesion/obligation > Fact).
          3.  No conflict (Different genres/norms).
      *   **Constraints:**
          *   Use the user's vocabulary freely/fluently (no definitions needed).
          *   Provide a "Residue Report": What maps cleanly? What requires distortion? What is inexpressible?
          *   *Crucial Constraint:* Do not smuggle in the assumption that there is a single "what-happened" that sources approximate (unless explicitly noting where a position relies on this).
          *   *Crucial Constraint:* Test the suspicion that this is really about *standing* (who speaks for the past). If this suspicion is just Position 3 in disguise, admit it.
          *   *Additional Case:* Analyze the newsroom's internal divergence (institutional memory vs. clips/docs) as a model for the broader dispute.
          *   *Closing:* Is the leftover residue a gap in the vocabulary (should be sayable) or a sign the positions are unclear?
          *   *No citations/reading lists.*

  2.  **Deconstruct the Three Positions into Sourcing Vocabulary:**

      *   *Position 1 (Record Wins):* This is standard journalism doctrine. Documents are on the record, immutable, corroborated by physical existence. Memory is single-sourced, uncorroborated testimony, prone to degradation. If they conflict, the document is the higher grade of evidence. The correction goes in the paper's voice; the memory gets attributed or killed.
      *   *Position 2 (Community Version/Function):* This is tricky. In sourcing terms, this sounds like "off the record" context or "background" that explains *why* a story is being told, but not *what* happened. Or, it's treating the community narrative as a "source" that isn't claiming factual accuracy but rather stating a claim of identity. It's like a press release from the community about itself. To print it as fact would be a violation of standards, but to ignore it misses the "story behind the story."
      *   *Position 3 (Different Genres):* This suggests we are dealing with two different types of copy. One is hard news (what happened), the other is opinion/analysis or perhaps a sidebar (what it means to us). They run on different pages under different rules. One doesn't correct the other.

  3.  **Drafting the Translations (Iterative Process):**

      *   *Pos 1:* Straightforward. The document is the second source to memory's single source. Memory is uncorroborated testimony. We print the document in the paper's voice; we attribute the memory or spike it. If we printed the memory as fact, it would require a correction later.
      *   *Pos 2:* The community account functions like "background" or "deep background" that establishes context but isn't for attribution as fact. It's the "why we care" lede, not the "what happened" nut graf. Overwriting it breaks the relationship with the source community. It's treating the narrative as a *claim of obligation* rather than a *claim of fact*.
      *   *Pos 3:* They are different beats. One is hard news (verification), one is features/culture (interpretation). You don't fact-check an opinion column against a land deed. They coexist without triggering a correction cycle.

  4.  **Developing the Residue Report:**

      *   *Clean Maps:* Position 1 maps perfectly. It *is* the standard sourcing workflow.
      *   *Distorted Maps:* Position 2 requires distorting "truth" into "utility." In sourcing vocab, something is either accurate or it isn't. Saying "it's false but necessary" sounds like protecting a source who is lying for a greater good. That's a specific ethical calculus, not a standard sourcing rule.
      *   *Inexpressible:* Position 3 struggles because journalism ultimately claims to report reality. If two accounts conflict, one is usually wrong. Saying "neither gives way" implies a relativism that sourcing vocab fights against (the "view from nowhere" ideal).
      *   *The "Single What-Happened" Assumption:* Position 1 relies on this heavily. Position 2 and 3 try to escape it, but sourcing vocab forces them back into it.
      *   *The "Standing" Suspicion:* This is about attribution. Who is an authorized source? The document authorizes the reporter. The community authorizes the memory. The fight is about whose attribution carries weight in the paper's voice.

  5.  **Analyzing the Newsroom Internal Case:**

      *   *Scenario:* Clips/Corrections vs. What the docs say now.
      *   *Comparison:* Is this a fair model? In the newsroom, the "institution" is the publisher. We own the clips. We issue the corrections. We have standing. In the community dispute, the reporter is an *outsider* judging the community.
      *   *Verdict:* It's a misleadingly easy case. We have the authority to correct ourselves. We don't have the authority to correct a town's founding myth without being seen as an aggressor. The power dynamic is different.

  6.  **Refining the Argument (Self-Correction/Constraint Check):**

      *   *Check:* Did I smuggle in the "single reality" assumption?
      *   *Correction:* I need to be explicit that Position 1 assumes a recoverable truth. Position 2 and 3 reject that the "truth" is the only metric, but sourcing vocab struggles to categorize "truth-adjacent" material.
      *   *Check:* Is the "Standing" suspicion just Position 3?
      *   *Analysis:* Position 3 says "different genres." The Standing argument says "different authorizers." They are similar but distinct. Position 3 is about *content type*; Standing is about *authority*. I need to clarify this distinction.
      *   *Check:* Closing on the Residue. Is it a gap or a clarity issue?
      *   *Decision:* It's a gap. Sourcing vocab is designed for verification, not for negotiating competing ontologies of the past.

  7.  **Final Polish (Tone and Vocabulary):**

      *   Ensure terms like "paper's voice," "attribution," "corroboration," "single-sourced," "kill," "spike," "correction," "rewrite," "standing," "attribution" are used naturally.
      *   Keep it dense and professional. No hand-holding.

  8.  **Drafting the Response (Mental Outline):**
      *   **Intro:** Acknowledge the frame.
      *   **Translations:**
          *   Pos 1: Hierarchy of Evidence (Doc > Testimony).
          *   Pos 2: Functional Attribution (Truth vs. Cohesion).
          *   Pos 3: Distinct Buckets (Hard News vs. Feature/Context).
      *   **Residue Report:**
          *   Clean: Pos 1.
          *   Distorted: Pos 2 (becomes "protecting a source").
          *   Inexpressible: Pos 3 (Sourcing demands a verdict).
          *   The "Single Reality" Smuggle: Point out where Pos 1 hides it.
          *   The Standing Test: Analyze the "who speaks" angle.
      *   **Newsroom Case:** Compare internal corrections vs. external myth-busting. Power dynamic is key.
      *   **Conclusion:** The Gap. Sourcing vocab can't handle "truth that isn't factual."

  9.  **Writing - Section by Section (incorporating the "Standing" constraint):**
      *   *Refining the Standing argument:* The user asks to test the suspicion that the dispute is about standing. If I say "Pos 3 is just Standing," I need to be sure. Actually, Standing is the *mechanism* by which Pos 3 operates. Pos 3 says "different norms," Standing says "different authorizers." I should argue that the Standing suspicion exposes the limit of sourcing vocab: it assumes the *reporter* holds the standing, not the source.
      *   *Refining the Newsroom analogy:* The newsroom case is about *our* memory vs. *our* docs. The community case is *their* memory vs. *our* docs (or *their* docs). The asymmetry matters.

  10. **Final Review against constraints:**
      *   No definitions? Check.
      *   No citations? Check.
      *   Address the "single what-happened" smuggle? Check.
      *   Address the "standing" suspicion? Check.
      *   Address the newsroom case? Check.
      *   Closing verdict on the residue? Check.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here are the three positions translated into sourcing vocabulary, followed by the residue report and the internal case analysis.

  ### The Translations

  **Position 1: The Record Wins**
  This is standard verification workflow. The documentary record is treated as a second source that corroborates itself through physical persistence; community memory is single-sourced testimony, uncorroborated and prone to degradation. Where they conflict, the document is the higher grade of evidence. We print the document in the paper's voice. The community account, if printed at all, must be heavily attributed ("residents recall," "oral history suggests") and framed as belief rather than fact. To print the memory as fact would trigger a correction cycle once the document surfaces. The document corrects the memory; the memory does not correct the document.

  **Position 2: The Community Version as Functional Source**
  The community account is not filed as hard news; it functions as background or deep background that establishes the "why" rather than the "what." It is a source of social cohesion, not factual data. Treating it as a factual claim subject to verification destroys its utility to the source community. In sourcing terms, this is akin to withholding a damaging fact to preserve a relationship with a key source, or printing a known falsehood because it represents a "greater truth" about the group's identity. We are being asked to treat the narrative as off-the-record context that informs the reporting but cannot appear in the copy as asserted fact without violating the agreement of what this story is for.

  **Position 3: Different Genres, Different Norms**
  The two accounts are different beats running on different pages under different editorial standards. The documentary record belongs to the hard news desk (verification, paper's voice, on-the-record); the community memory belongs to features, culture, or opinion (interpretation, attributed voice, narrative truth). One does not fact-check the other, just as we do not fact-check a column against a news report. They coexist without triggering a correction because they are making different claims. The conflict is a categorization error; we are trying to file a feature story as hard news.

  ***

  ### Residue Report

  **What Maps Cleanly**
  Position 1 maps perfectly. It is the default setting of the sourcing vocabulary. It assumes a recoverable reality, ranks sources by reliability, and dictates that the paper's voice aligns with the highest-corroborated version. There is no friction here; this is the workflow.

  **What Fits Only With Distortion**
  Position 2 requires distorting the definition of "source." In our vocabulary, a source provides information about reality. Position 2 asks us to treat the source as providing information about *obligation*. To make this fit, we have to treat the community narrative as a "protected source" whose inaccuracies we agree not to challenge. This distorts the ethic of independence. It turns the reporter into a participant in the myth-making, effectively going "on the record" with a lie to maintain access or social peace. It fits only if we accept that "truth" is sometimes subordinate to "function," which sourcing vocabulary generally rejects as a slippery slope to advocacy.

  **What Cannot Be Expressed**
  Position 3 hits the wall. Sourcing vocabulary is built on the premise that conflicting factual claims must be resolved before publication. We do not publish two contradictory versions of a dateline event in the same section and say "both are valid under different norms." If a death certificate says X and the family says Y, we cannot run both as fact in the news columns. Position 3 requires a taxonomy of truth that sourcing vocab doesn't have: a way to say "this is factually wrong but narratively right" without relegating it to the opinion page. The vocabulary forces a binary: either it's verified (paper's voice) or it's attributed (someone else's voice). It has no slot for "valid but unverifiable."

  **The "Single What-Happened" Smuggle**
  Position 1 survives only by quietly granting that there is a single, recoverable past that documents approximate better than memory. If you remove that assumption, Position 1 collapses into arrogance. Position 2 and 3 attempt to reject this assumption, but the sourcing vocabulary forces them back into it. By asking whether we can "print" the memory, we are already asking if it matches the record. The vocabulary cannot process the idea that the record might be the inferior approximation of the social reality.

  **The Standing Suspicion**
  You asked to test the suspicion that this is a dispute about who has standing to speak for the past. In sourcing terms, "standing" is about attribution and authority. Who is an authorized source?
  *   In Position 1, the *document* has standing. The reporter acts as the proxy for the archive.
  *   In Position 2, the *community* has standing. The reporter acts as the proxy for the group.
  *   In Position 3, *genre* grants standing.

  The suspicion holds: much of the friction is about whether the reporter derives authority from the archive or from the people. However, this is not merely Position 3 in different clothes. Position 3 says "different rules apply." The Standing argument says "different authorizers apply." Position 3 is a structural fix (move the story to Sunday Review); the Standing argument is a power fix (who gets to decide what goes in the paper). The sourcing vocabulary is designed to protect the reporter's standing, not the source's. It assumes the reporter is the final arbiter of what counts as a source. Therefore, the vocabulary cannot express the claim that the community has standing *equal* to the document. It can only express the community as a source to be vetted, not a partner in verification.

  ***

  ### The Internal Case: Newsroom Memory vs. Documents

  When our own institutional memory (clips, corrections, what we said at the time) diverges from what the documents now support, we treat it as a correction or a rewrite. We own the clips. We have the standing to issue the correction in the paper's voice. We do not need to negotiate with the "institution's memory" as if it were an external source; we *are* the institution.

  This is a **misleadingly easy model** for the collective-memory dispute.
  1.  **Power Asymmetry:** In the newsroom case, we hold the pen and the archive. In the community case, we are outsiders holding the pen against an archive we didn't create and a community we don't belong to.
  2.  **Liability:** If we print our own past wrong, we eat the correction. If we print a town's past wrong, we burn a relationship. The cost of the correction is externalized in the community case.
  3.  **Standing:** We have standing to correct ourselves. We do not have clear standing to correct a town's founding myth. When we do, it reads as colonial or aggressive, not as standard verification.

  Using the internal case as a model hides the political friction of the external case. It assumes the reporter always has the authority to issue the correction. In the community dispute, the reporter is asking for authority they may not possess.

  ***

  ### Closing Verdict

  The residue is a **gap in the sourcing vocabulary**.

  There are claims a reporter has no way to say but probably should. Specifically, we lack the syntax to say: *"This account is factually unsupported by the documentary record, but it is the authoritative account of the community's identity, and treating it as an error would be a deeper failure of reporting than printing it."*

  Our vocabulary forces us to either:
  1.  Debunk it (Position 1).
  2.  Bury it in attribution (Position 2, distorted).
  3.  Ghettoize it in features (Position 3).

  We cannot print it in the paper's voice as a valid description of reality *alongside* the contradictory document. The vocabulary assumes that "paper's voice" equals "verified fact." It does not allow for "paper's voice" equals "verified social truth."

  This suggests that Position 2 and 3 were never as clear as they sound. They are attempts to solve a problem the vocabulary creates. They are workarounds for a system that cannot distinguish between "what happened" and "what matters." The gap isn't just missing words; it's the inability of the sourcing framework to acknowledge that verification is a political act that grants standing to some sources (documents) and strips it from others (memory). We can report on that conflict, but we cannot report *through* it without breaking our own rules.
