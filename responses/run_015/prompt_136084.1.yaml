answer: |-
  Here is the brainstorming and reconstruction you asked for. I have kept the reasoning explicit so you can see which premises carry the weight.

  ### Part 1: Candidate Reconstructions

  Here are five ways to interpret the theoretical machinery underneath the practice you described.

  **1. Strict Preference Utilitarianism**
  *The View:* Welfare consists in satisfying actual preferences. The government's job is to maximize the sum of satisfied preferences. Money is just a measuring stick for intensity of preference.
  *Rejection:* This cannot explain the "sin tax" wrinkle. If actual preferences are the sole source of value, taxing smokers or nudging savers is a direct reduction of welfare. The practice treats preferences as sovereign in the rail calculation but incompetent in the health calculation. This view is too consistent to fit the contradictory practice.

  **2. Purely Formal Ordinalism (The "As-If" View)**
  *The View:* Utility is not a mental state or a moral good; it is merely a mathematical representation of consistent choice. The government isn't making people "better off" in a moral sense, just making the system more consistent.
  *Rejection:* This fails to explain the normative force of the decision. If the benefit total exceeds the cost, the project *goes ahead*. That "ought" requires a claim about social improvement, not just mathematical consistency. Furthermore, summing utilities across people is mathematically illicit under strict ordinalism; you cannot add rankings. The practice adds them, so it presupposes more than this view allows.

  **3. Rights-Based Libertarianism**
  *The View:* The numbers track violations of property rights or entitlements. A cost is incurred only when someone is made to give up what they own.
  *Rejection:* This collapses on the compensation test. The practice admits nobody actually compensates the losers; it only requires they *could* be compensated. If rights were the core presupposition, actual compensation would be mandatory, not hypothetical. Also, valuing a "statistical life" treats life as a commodity to be traded, which sits uneasily with a strict rights framework.

  **4. Technocratic Pragmatism**
  *The View:* There is no deep theory. Money is the only common unit available, so economists use it. The contradictions (WTP vs. WTA, sin taxes) are just ad-hoc fixes to make the numbers work or to align with political mandates.
  *Rejection:* While cynically plausible, this fails to explain the *internal* logic of the adjustments. The income-scaling of the value of life and the discounting of the future follow specific economic formulas, not random political whims. There is a coherent, if hidden, logic connecting the variables. Dismissing it as "no theory" prevents us from seeing the specific moral commitments embedded in the formulas.

  **5. Money-Metric Potential Pareto (The Winner)**
  *The View:* Welfare is preference satisfaction, but it is measured by *ability to pay* rather than raw desire. The goal is efficiency (making the pie bigger), not distribution. The existing distribution of wealth is taken as the baseline for weighting preferences.
  *Status:* This is the reconstruction I will defend. It accommodates the contradictions by treating wealth as the proxy for voting power in the social calculus.

  ***

  ### Part 2: The Reconstruction I Stand Behind

  **The Practice Presupposes: Money-Metric Preference Sovereignty with Status-Quo Weighting.**

  Here is the load-bearing reasoning. The practice does not treat "utility" as a psychological feeling (happiness) nor as a purely logical ranking (ordinalism). It treats utility as **demand backed by resources.**

  When the ministry values an hour of time or a statistical life, it is not asking "How much does this hurt?" or "How much does this matter morally?" It is asking, "What is the market price of this risk or time, given the current distribution of wealth?"

  This explains the central tension your sources are fighting over. The deflationary economist is right that utility is a bookkeeping device *for the individual*. But the normative economist is right that summing them implies a social good. The bridge between them is **money**. The practice presupposes that a dollar of willingness-to-pay from a rich person counts the same as a dollar from a poor person. This is not a neutral technical assumption; it is a moral commitment that the current distribution of wealth is the correct weighting mechanism for social importance.

  This reconstruction handles the "sin tax" contradiction. In the rail calculation, the government assumes you are the best judge of your trade-offs (time vs. money). In the health calculation, the government assumes your "decision utility" (what you choose) diverges from your "experienced utility" (what is good for you) due to bias or addiction. The practice presupposes sovereignty *unless* there is a known market failure or cognitive bias. It is a theory of **bounded preference sovereignty**.

  ***

  ### Part 3: The Three Distinctions

  Here is the separation you need to untangle the conflicting stories from your sources.

  **1. What the Arithmetic Strictly Requires**
  The deflationary "as-if" reading (ordinal utility) **cannot** license the practice.
  *   **Reasoning:** You can represent one person's choices with an ordinal ranking (A is better than B). But you cannot add Person A's ranking to Person B's ranking. To sum benefits across people (the core of the rail line decision), you must assume **cardinality** (the size of the gap between A and B matters) and **interpersonal comparability** (my gap is comparable to your gap).
  *   **The Load-Bearing Beam:** Money provides this comparability. By converting everything to dollars, the practice implicitly asserts that utility is cardinal and comparable *via purchasing power*. If you reject the idea that money measures utility intensity comparably across persons, the entire summation collapses. The arithmetic requires us to treat $1 of utility for a billionaire as identical to $1 of utility for a pauper.

  **2. What Fits Well vs. What is Committed**
  *   **WTP vs. WTA (The Entitlement Baseline):** The practice *fits* with standard consumer theory, but it **commits** to the moral legitimacy of the status quo distribution of entitlements.
      *   **Reasoning:** Willingness To Pay (WTP) asks: "How much of your money would you give up to get this?" Willingness To Accept (WTA) asks: "How much money do you need to be paid to give this up?" The fact that WTA is rejected as "inflated" presupposes that you do not have a right to the status quo that requires compensation to violate. It treats the current state as the default "zero point." If the moral baseline were that you own your health or your view of the trail, WTA would be the correct measure. Rejecting it commits the practice to the view that existing endowments are privileges, not rights.
  *   **Income Weighting:** The practice **commits** to ignoring diminishing marginal utility of money across persons, despite relying on money as the metric.
      *   **Reasoning:** Economists generally agree that an extra dollar matters less to a rich person than a poor person. Yet the practice applies the same value of time/life to everyone (at a snapshot in time). This is a political commitment to efficiency over equity, disguised as a technical constraint. It fits the "one person, one vote" intuition, but it contradicts the economic theory of utility that underpins the money metric.

  **3. Where It Is Simply Underdetermined**
  *   **The Discount Rate:** You identified this, but the underdetermination goes deeper. The same number (e.g., 3.5%) can represent:
      1.  **Pure Time Preference:** Future well-being matters less simply because it is later (ethically controversial).
      2.  **Opportunity Cost of Capital:** Money invested now grows, so future costs should be discounted (financial logic).
      3.  **Growth Assumption:** Future people will be richer, so they care less about marginal gains (utilitarian logic).
      *   **Reasoning:** The arithmetic is identical, but the moral justification shifts. If it's (1), we are discriminating against future generations. If it's (3), we are assuming growth will solve welfare problems. The practice hides this choice behind a single percentage.
  *   **The Value of a Statistical Life (VSL) Scaling:** Scaling VSL with income growth presupposes that a life in a richer society is *objectively* more valuable than a life in a poorer one. This is underdetermined by welfare theory. One could argue a life is a life. The practice chooses the "wealth-adjusted" view without explicit moral debate.

  ***

  ### Part 4: Consequences of Swapping the Metric

  If you change the underlying theory of "what makes someone better off," the numbers move in specific, predictable directions.

  **1. Switching to Experienced Wellbeing (Happiness)**
  *   **The Change:** Instead of asking "What would you pay?" or observing choices, you measure self-reported life satisfaction, stress, or pain.
  *   **Which Numbers Move:**
      *   **Commute Time:** The value of time saved would likely **drop** for high-income earners and **rise** for low-income earners. Currently, time is valued by wage rates (opportunity cost). Under happiness metrics, a stressful 10-minute delay hurts a low-paid worker as much as a CEO.
      *   **Safety vs. Speed:** Projects prioritizing speed (rail lines) might lose out to projects prioritizing comfort or reduced anxiety.
      *   **Distribution:** The aggregation would likely favor policies that reduce inequality, as diminishing marginal utility applies directly to happiness, whereas the current money-metric treats $1 = $1.
  *   **Direction:** Overall project approval rates might slow down for infrastructure that prioritizes speed/efficiency, and speed up for infrastructure that reduces stress/noise/pollution.

  **2. Switching to Capabilities (What People Are Able to Do and Be)**
  *   **The Change:** Welfare is not preference satisfaction, but the expansion of real freedoms (e.g., ability to move, ability to breathe clean air, ability to participate in society).
  *   **Which Numbers Move:**
      *   **Accessibility:** The value of the rail line would skyrocket if it connects marginalized communities to essential services, even if their WTP is low (because they have no money). Currently, low WTP kills these projects.
      *   **Non-Use Values:** The "rare bird" or "view from the trail" would gain massive weight. Under capabilities, the existence of nature is a constitutive part of a flourishing life, not just a consumer good to be valued by survey.
      *   **Baseline:** The status quo bias disappears. If the current system prevents people from functioning (e.g., no transport), the cost of that deprivation is counted, regardless of whether they "chose" it.
  *   **Direction:** Projects serving the poor and projects protecting environmental goods would see their benefit totals **increase** significantly relative to the status quo. Cost-benefit ratios for equity-focused projects would improve.

  ***

  ### Part 5: The "Revealed Welfare Accounting" Proposal

  You asked if fitting utility functions to administrative data (clicks, purchases, marriages) is a third option or just the existing practice with better data.

  **It is the existing practice with better data, and it inherits the same fatal flaw.**

  Here is the reasoning:
  1.  **It is still Revealed Preference:** The current practice uses revealed preference in labor and transport markets. The new proposal just expands the market to "life choices." It still presupposes that **Choice = Welfare**.
  2.  **The Status Quo Bias Remains:** If the administrative data shows that poor people consistently choose cheap, unhealthy food over expensive, healthy food, the model records this as a "preference for unhealthy food." It cannot distinguish between "I like this" and "This is all I can afford." The current practice struggles with this; "Revealed Welfare Accounting" automates and hardens this error.
  3.  **The "Lousy Options" Problem:** You noted that the options people face are unequally distributed. If the data shows everyone chooses the slow bus because the fast train is too expensive, the model infers the slow bus has high utility. It treats constraint as preference.
  4.  **Why the Practice Rules It Out:** The current practice actually contains a safeguard against this, though it's rarely admitted: **The Marginal Principle.** CBA looks at *changes* at the margin (a bit faster, a bit safer). It assumes the background context is fixed. "Revealed Welfare Accounting" attempts to measure *total* utility. To do that, it would have to account for the fact that the poor have a higher marginal utility of money. If it doesn't weight for income, it simply replicates the inequality of the current system at a granular level. If it *does* weight for income, it admits that money is not a neutral metric, which undermines the "revealed" aspect (since the reveal is distorted by wealth).

  **Conclusion on the Proposal:** It dodges "hypothetical bias" (people lying in surveys) but entrenches "structural bias" (people choosing the best of bad options). It is not a third way; it is the "Sovereign Consumer" view pushed to its logical, and perhaps most dangerous, extreme. It assumes the world as it exists is the world as it should be, because it treats every adaptation to hardship as a revealed preference for hardship.

  **The Load-Bearing Takeaway for Your Piece:**
  The conflict between your economists isn't about math; it's about whether money is a **neutral ruler** or a **weighted vote**. The practice works only if you pretend it's a ruler while using it as a vote. If you admit it's a vote, you have to admit that the wealthy have more votes. If you admit it's a ruler, you have to explain why you don't adjust for the fact that the ruler shrinks for the poor. The practice survives by refusing to answer that question.
