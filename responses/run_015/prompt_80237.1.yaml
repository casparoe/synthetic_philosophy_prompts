  I keep coming back to Fitch's knowability paradox and I'm convinced it's not really an epistemology result at all, it's a diagonalization result wearing an epistemology costume, and I'd like someone to stress-test that by translating the whole thing into the vocabulary I actually think in. I'm a programming-languages person: self-referential code, fixed-point combinators, quines, denotational semantics, the halting problem — that's my native tongue. So restate Fitch's argument (the one where the claim that every truth is knowable collapses into every truth being known) in those terms: the knowability operator as a thing the language can turn on its own sentences, the counterexample that conjoins a truth with the claim that it's not known as a self-referential construction, and the the reductio as a fixed-point collapse. Be as faithful as you can to the actual proof, not the slogan people repeat.

  I want a real residue report, cause that's the whole point for me. Tell me which parts of the argument map cleanly onto diagonalization and the halting problem and which parts you had to distort to make them fit, and which parts have no expression in the programming vocabulary at all. In particular, is there anything genuinely epistemic about the paradox — something about the gap between truth and knowledge, or about an agent being able to know its own knowledge state — that has no counterpart in how programs handle self-reference? And if there is, does that mean my 'it's just the halting problem' story is wrong, or does it mean my vocabulary is just missing a category? I want a view on whether the residue is a defect of the target framework or a sign the paradox is less clear than it looked.

  Two more things. First, I read the proof is usually sold as an S5 result but I'm fairly sure it only needs the truth axiom (if p is known then p) plus normality, i.e. plain KT — no positive introspection, no S5. Check that for me and tell me whether the weaker requirement changes anything about the translation. Second, reason about (don't just recite) what happens if 'knowable' is read as effectively knowable — knowable by some Turing machine or computable procedure, not just possibly known by some ideal agent. My guess is the self-referential step breaks down, but actually work out whether the counterexample proposition is or isn't effectively knowable under that reading, and say what the breakage tells us about where the original paradox gets its force.
