answer: |-
  You have identified a genuine structural gap in the current vernacular of mechanistic interpretability. Your observation is precise: you are describing a many-to-one mapping from *mathematical structures* (directions/subspaces) to *functional semantics* (properties/behaviors), where the evidence provided (probing + steering) is insufficient to select a unique candidate.

  There is no single, canonical term in the mechanistic interpretability literature that functions as the direct counterpart to "polysemanticity" for this specific phenomenon. While related concepts exist, none carve out the exact shape you described without collapsing into broader categories.

  ### Why the existing neighbours don't fit

  1.  **Non-identifiability:** This is the closest statistical term. It refers to parameters that cannot be uniquely recovered from data. However, in interpretability, this is often used to describe weight symmetries (permutation/scaling) rather than the semantic ambiguity of *feature directions* found by probes. It feels too mathematical and misses the "semantic property" layer you care about.
  2.  **Degeneracy:** Borrowed from neuroscience (Edelman, Tononi), this describes structurally different elements yielding the same function. It is used in AI, but often to describe robustness or different models solving the same task, not specifically the instability of *internal probe directions* within a single model.
  3.  **Underdetermination:** As you noted, this is a philosophy-of-science term regarding whole theories. Applying it to a specific activation direction feels like using a sledgehammer to crack a nut; it lacks the mechanistic specificity you want.
  4.  **Polysemanticity/Superposition:** As you correctly identified, these are the mirror image (one structure, many features). You are describing one feature, many structures.

  ### The Carving: Representational Equivocality

  Since no established term fits tightly enough, I propose **Representational Equivocality**.

  **Definition:**
  Representational Equivocality is the condition where multiple, distinct activation subspaces (directions, vectors, or regions) within a model satisfy operational criteria for the same semantic property (e.g., probe accuracy, steering efficacy), without a principled criterion to identify which subspace constitutes the model's "native" representation of that property.

  **Edges and Distinctions:**
  *   **Vs. Polysemanticity:** Polysemanticity is *one* direction encoding *multiple* features. Representational Equivocality is *one* feature encoded by *multiple* directions.
  *   **Vs. Noise/Instability:** Instability implies random fluctuation where no direction works well. Equivocality implies multiple directions work *well* and systematically.
  *   **Vs. Underdetermination:** Underdetermination applies to the relationship between evidence and theory. Equivocality applies specifically to the relationship between *semantic labels* and *activation geometry*.
  *   **Vs. Basis Invariance:** Basis invariance is a mathematical symmetry (rotating the whole space). Equivocality can occur even when fixing the basis, if different subsets of neurons can be combined to steer the same behavior.

  **Why this matters:**
  When Representational Equivocality is present, claims that "the model represents X in layer Y" are technically incomplete. The evidence shows X is *steerable* via direction D, not that D is *the* representation of X. This validates your worry: the evidence supports the *capability*, but not the *ontology*.

  Verdict: no established term — Representational Equivocality
