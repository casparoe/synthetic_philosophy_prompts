answer: |-
  **Project Pitch: Can Ubuntu Relationalism Survive Precision?**

  **The Core Question**
  Here's the thing: relational theories of personhood (specifically Ubuntu-style frameworks) always sound great until you ask for the mechanics. The core question I want to tackle is whether we can taxonomize the constitutive relations without the whole thing collapsing. Right now, the literature glosses over which relations actually make you a person. Is it mutual recogntion? Shared practices? Or just causal interdependance?

  Without nailing that down, you can't draw a non-arbitrary boundary for marginal cases. You end up unable to say if an isolated person is still a person, or if some tightly integrated system counts as one. The standard individualism-vs-communitarianism debate doesn't settle this because individualism ignores the relational component entirely, while communitarianism is often too vague to handle edge cases like severe disability or future generations. I want to see if a precise relationalism is even possible, or if precision forces you back into liberal individualism.

  **The Method (4 Months)**
  Since this is conceptual work, I'm keeping it desk-based. No travel, no archives, just text and analysis.

  *   **Month 1: Framing the Taxonomy.** I'll map out the different types of relations currently floating around in Ubuntu literature. The goal is to separate the normative stuff (what *should* happen) from the ontological stuff (what *makes* you a person). I need to categorize them: is it recognition, practice, or dependence?
  *   **Month 2: Disability Philosophy Comparison.** Relational disability philosophy has been wrestling with dependency for a while. I'll spend this month comparing the Ubuntu framework against existing relational accounts in disability studies. They usually have sharper tools for handling asymmetry in relations.
  *   **Month 3: Stress Testing.** This is where I throw the hard cases at the taxonomy. The hermit, the person in a permanent vegetative state, future generations. If the theory can't handle isolation or severe cognitive disability without contradicting itself, I need to find out exactly where it breaks.
  *   **Month 4: Writing.** Synthesizing the findings into a paper. Either I propose a refined boundary condition or I argue that the project fails.

  **Success vs. Failure**
  Honesty check: I'm not assuming the theory will hold up.
  *   **Success:** I produce a clear taxonomy of constitutive relations that allows us to distinguish between persons and non-persons in marginal cases without sliding back into atomistic individualism.
  *   **Failure:** I demonstrate that making Ubuntu-style relationalism precise inevitably excludes too many people (collapsing into ableism) or includes too much (collapsing into holistic communitarianism). Honestly, proving the impossibility is still a result.

  **Scope Check**
  Four months is tight, so I'm limiting the scope strictly to contemporary analytic interpretations of Ubuntu and relational disability theory. No historical deep dives, no fieldwork. Just tightening the definitions to see if the structure holds. If I get bogged down in the metaphysics of "force" or "energy," I'll cut it. The focus stays on the boundary problem.
