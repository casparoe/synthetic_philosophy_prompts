prompt: |-
  Hi everyone, retired physical chemist here — spent 30 years doing kinetics and now I'm sneaking into philosophy through a seniors discussion group, so go easy on me if I mangle the jargon.

  Last week someone brought in a popular science book and read out a gloss on Gödel that went roughly like this, I'm paraphrasing from my notes:

  Gödel showed that any consistent mathematical system that can handle basic arithmetic will contain true statements it can never prove. So truth is always bigger than proof. That means no computer program could in principle capture everything a human mathematician can see is true, which is why a purely mechanical theory of the mind fails. And his second result says such a system can't prove its own consistency, so no complete theory of everything, in physics or in philosophy, can vouch for itself without stepping outside itself.

  I found that arguement pretty striking and I'm inclined to think the truth-is-bigger-than-proof part must be right, but the jumps to minds vs. machines and to theories of everything lost me a bit. Is this a fair summary? Can you walk through it piece by piece and tell me what to keep, what needs rewording, and what a defender versus a critic would push back on — and whether those big conclusions actually survive once the summary is fixed?

  To test it for myself I cooked up a toy case from my old world. Say we have an automated synthesis planner whose control software includes enough arithmetic to do its bookkeeping, and we ask it to prove, using only its own programmed rules, that it will never recommend an unsafe reaction. A guy in our group said Gödel's second theorem means that's impossible in principle — any consistent planner can't certify its own safety, so you always need an outside checker. Is that what the theorem actually says, or is that stretching words like system and consistency beyond what logicians mean?

  Please be upfront about what is settled among people who actually work on this versus what is genuinely contested, and don't sell me a contested philosophical take as if it's the consensus. If you could seperate those two for me I'd really appreciate it.
