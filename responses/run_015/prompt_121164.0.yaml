      *   **Application/Assessment (40-50 mins):** The Jury Trial vs. Algorithm scenario.
          *   Burkean argument: Trial by jury is a heritage, a trust.
          *   Chestertonian argument: We don't understand the social function of a jury (legitimacy, peer check) even if efficiency is lower.
      *   **Exclusions:** Explicitly state what to leave out (Religion/Contractarianism).

