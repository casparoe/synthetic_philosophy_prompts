          2.  Introduce Chesterton (The Epistemic Rule). This is the easier concept to grasp logically. "Don't remove what you don't understand."
          3.  Introduce Burke (The Ontological Claim). This is deeper. "Society isn't just a machine; it's a lineage."
          4.  Differentiate (Where they split).
          5.  Apply/Assess (Jury trial algorithm).
      *   *Example Choice:* The Pond example is stronger for *Chesterton*. It shows a functional consequence of removing something whose purpose was forgotten. A footpath is too vague (why was it there?). The pond has a clear hydraulic function that was ignored. Stick with the pond.
      *   *Exclusions:* Sixth-formers in 50 minutes don't need the full contractarian reading (too abstract/legalistic) or the religious framing (distracts from the political philosophy core). Cut both. Focus on the political/epistemic argument.

  3.  **Drafting the Plan - Section by Section:**

      *   **Introduction (0-5 mins):** Start with the misconception. Ask them what conservatism is. Write "Status Quo" on the board. Challenge it immediately.
      *   **Chesterton's Fence (5-20 mins):** Introduce the Fence principle. Use the Pond example here. It fits "hidden function" perfectly.
          *   *Address Misconception 1 (Status Quo):* It's not about loving the old, it's about knowing the *why*.
          *   *Address Misconception 2 (Old = Good):* Explicitly state the fence isn't sacred, it's functional.
      *   **Burke's Partnership (20-35 mins):** Shift from "function" to "time/people." Burke is deeper. It's not just about drainage; it's about trust between dead, living, and unborn.
