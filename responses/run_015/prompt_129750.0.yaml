answer: |-
  **MEMORANDUM**

  **TO:** Quantitative Prioritization Team
  **FROM:** [Your Name/External Auditor]
  **SUBJECT:** Audit of Heavy-Tail Decision Framework

  You asked for an audit of your seven-point position before committing it to paper. Your colleagues are partially right: as currently stated, the position is mathematically inconsistent. However, they are wrong to call it a "grab bag." You have correctly identified the necessary intuitions for your specific portfolio (near-term health + long-term x-risk); the error is in the formal machinery you are trying to use to bind them together.

  Below is the breakdown of which commitments are in tension, ranked by severity, followed by a specific proposal for a single revision that resolves the contradictions without gutting your core mission.

  ### 1. The Severity Ranking of Tensions

  **Severity 1 (Fatal): The Trilemma of (1), (2), and (7)**
  *   **The Conflict:** You cannot simultaneously hold:
      1.  Strict Expected Utility (EU) maximization for all defined expectations.
      2.  Unbounded, linear value in lives saved.
      3.  The verdict that you should not liquidate your assets to play the Lifesburg game.
  *   **The Arithmetic:** In the Lifesburg game, payoff is $2^n$ lives, probability is $2^{-n}$.
      *   Untruncated Expectation: $\sum_{n=1}^{\infty} (2^{-n} \times 2^n) = \sum 1 = \infty$.
      *   Truncated Expectation (at physical limit $10^{40}$ lives): As you calculated, $2^{133} \approx 10^{40}$. The sum runs from $n=1$ to $133$. The expected value is **133 lives**.
      *   **The Contradiction:** If you value lives linearly (2), 133 lives is a finite, positive number. If the cost to save a life is, say, \$5,000 (a conservative global health figure), the Expected Value of the game is \$665,000. If your liquid assets are below this, strict EU maximization (1) demands you liquidate everything to play. Your intuition (7) says "No."
      *   **Verdict:** One of these three must break. Since (2) is the engine of your long-termism and (7) is a solvency constraint you rightly refuse to violate, **(1) must be the casualty in heavy-tailed cases.**

  **Severity 2 (Significant): The Fanaticism Problem (1) vs. (3)**
  *   **The Conflict:** This is the same trilemma applied to your "physically clean lottery." If value is unbounded (2) and you maximize expectation (1), you must accept any lottery where $P \times Value > Certain\_Option$.
  *   **The Arithmetic:** $10^{-12} \times 10^{30} = 10^{18}$ lives (EV). Certain option = $10^4$ lives.
  *   **Verdict:** Standard EU forces you to be a fanatic. To avoid this without capping value (2), you must again modify how you calculate expectation (1) for extreme tails.

  **Severity 3 (Resolvable): Wealth Insensitivity and Concavity (4)**
  *   **The Conflict:** Your colleague claims that explaining a wealth-insensitive entry fee via concave utility is incoherent.
  *   **The Analysis:** Your colleague is **correct** about concavity, but **incorrect** about your position.
      *   *Concavity:* If $U(w) = \ln(w)$, the cash equivalent of a gamble *does* depend on $w$. A richer person pays more.
      *   *Truncation:* If the gamble is truncated by a counterparty limit (e.g., the casino only has \$1 Billion), the Expected Value becomes finite (~\$30). If your wealth is \$1,000 or \$1,000,000, both are below the truncation point. The price you pay is determined by the casino's limit, not your wealth.
  *   **Verdict:** You are right to rely on **truncation**, not concavity, for the wealth-insensitivity verdict. Drop the appeal to diminishing marginal utility of money for this specific argument; it weakens your position. Rely solely on the physical/counterparty cap. This resolves the objection without changing your framework.

  **Severity 4 (Non-Issue): The Divergent Expectation Rule (1) vs. (5)**
  *   **The Conflict:** You worry that switching to "majority of cases" when expectations diverge contradicts EU maximization.
  *   **The Analysis:** Expected Utility theory requires the expectation integral to converge. If $\int U(x) dP(x)$ does not exist, EU theory is **silent**. It offers no verdict.
  *   **Verdict:** Adopting a fallback rule (like median outcome or modal outcome) when EU is undefined is not a contradiction; it is a completion of the theory. You can keep (1) as "Maximize EU *where defined*" and (5) as "Use robust heuristics *where undefined*." This is not a load-bearing tension.

  ---

  ### 2. The Solution: A Single Revision

  You asked if a single revision can handle both the Lifesburg verdict (7) and the Anti-Fanaticism verdict (3) without gutting Unbounded Value (2).

  **Yes.** The revision is to modify **(1)**, but not by abandoning Expected Utility. The revision is to distinguish between **Aleatory Probability** (physical chance) and **Epistemic Confidence** (model reliability).

  **The Proposal: Epistemic Confidence Discounting**
  You should revise (1) to state: *"We maximize Expected Utility, but probability estimates $P$ must be discounted by an epistemic confidence factor $C(P, V)$ that decreases as the magnitude of the payoff $V$ increases."*

  **Why this works:**
  1.  **It saves (2) Unbounded Value:** You do not need to cap the value of lives. $10^{30}$ lives is still $10^{30}$ times better than 1.
  2.  **It solves (7) Lifesburg:** In the Lifesburg game, the probability of the coin landing heads 100 times is physically $2^{-100}$. However, the probability that the *mechanism* actually delivers $2^{100}$ lives given that the coin lands heads is not 1. It is vanishingly small. No institution, physics, or causal chain supports that payout.
      *   When you factor in the probability that the *game description itself* is false or the payout mechanism fails, the effective probability drops faster than the payoff grows.
      *   The expectation sum becomes $\sum (2^{-n} \times \text{Confidence}_n \times 2^n)$. If $\text{Confidence}_n$ drops exponentially (which it must for any real-world claim), the sum converges to a small number.
  3.  **It solves (3) Fanaticism:** The $10^{-12}$ probability estimate for the lottery is a model output. As the payoff ($10^{30}$) becomes astronomically large, our confidence that the model is not flawed, that the counterparty exists, or that the causal link holds, must decrease.
      *   If you treat $10^{-12}$ as a hard physical frequency, you are a fanatic.
      *   If you treat $10^{-12}$ as an estimate subject to error bars that widen with stake size, the "effective probability" becomes low enough to prefer the certain $10^4$ lives.
  4.  **It preserves (1) for normal cases:** For standard global health grants (saving 1,000 lives with 50% confidence), the epistemic discount is negligible. You retain the fine-grained discrimination you need for your day-to-day work. You only invoke the discount when the tail becomes "heavy" enough to threaten solvency or sanity.

  **Why this is not "Probability Weighting" (which you rejected):**
  You rejected non-linear probability weighting in (1) because it violates statewise dominance (preferring A to B even if B pays more in every state).
  *   *Prospect Theory Weighting:* Transforms $P$ because people feel risk. This violates dominance.
  *   *Epistemic Discounting:* Adjusts $P$ because the *estimate* is unreliable. This does **not** violate statewise dominance. If you *know* the probabilities are physically fixed (like a casino dice roll), you do not discount. You only discount when the probability is an *estimate* about the world (like x-risk or Lifesburg). Since almost all your long-term work involves estimates, not casino dice, this distinction is practically vital but theoretically clean.

  ### 3. Addressing the "Grab Bag" Charge

  Your colleagues call it a grab bag because you are mixing EU with heuristics. They are missing that **all** practical decision theory for heavy tails requires a hybrid approach.

  *   **The Coherent Package:**
      1.  **Value:** Linear and unbounded in lives (Keep 2).
      2.  **Rule:** Maximize Expected Utility (Keep 1).
      3.  **Input Constraint:** Probabilities used in the EU calculation must be **epistemically robust**. For tail events where $P < 10^{-6}$ and Value $> 10^6$ lives, $P$ is treated as an upper bound, not a mean, and is discounted by model uncertainty (Revised 1).
      4.  **Fallback:** If the expectation integral diverges even after discounting (true St. Petersburg), revert to median/modal outcomes (Keep 5).
      5.  **Money vs. Lives:** Apply the same epistemic discount to money gambles where the payout exceeds counterparty limits (Resolves 4).

  ### 4. Which Link is Weakest?

  If the honest answer is that no coherent package delivers your (7) verdict, you asked which of (1), (2), or (7) is the weakest link.

  *   **(2) Unbounded Value:** If you cut this, you destroy the mathematical basis for long-termism. A cap at $10^{10}$ lives makes extinction risk mathematically equivalent to a large pandemic. **Do not cut this.**
  *   **(7) Lifesburg Intuition:** If you cut this, you become a fanatic who liquidates assets for lottery tickets. This destroys the organization's solvency. **Do not cut this.**
  *   **(1) Strict EU:** This is the weakest link. It is a tool, not a moral truth. It breaks when inputs are undefined or unreliable.

  **Recommendation:**
  Formally revise (1). State clearly that the foundation is Expected Utility, **conditional on well-defined, epistemically stable probability distributions.** For heavy-tailed x-risk work, the "probability" input is not a frequency but a confidence-weighted estimate.

  This allows you to write the memo without conceding to the "cap value" argument (which kills your long-term portfolio) or the "be a fanatic" argument (which kills your credibility). It isolates the problem to the *reliability of probability estimates in the tail*, which is exactly where your quantitative work should focus anyway.

  **Summary of Actions for the Memo:**
  1.  **Drop** the claim that concave utility explains wealth-insensitive St. Petersburg fees; rely on truncation.
  2.  **Clarify** that (5) is a fallback for undefined integrals, not a contradiction of (1).
  3.  **Formalize** the "Epistemic Confidence Discount" as the mechanism that resolves (3) and (7) while preserving (2).
  4.  **Accept** that strict EU maximization applies only to "ordinary finite cases" and "robust tail estimates," not to speculative tail claims where the model uncertainty exceeds the probability estimate.

  This is not a grab bag; it is a robust decision framework for an environment where $P$ and $V$ are both uncertain.
