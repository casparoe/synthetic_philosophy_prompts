      *   Emil's concession: In the weighing problem, if free-floating reasons don't outweigh personal projects, they seem weak; if they do, they demand too much. He must admit the "swamping" risk is real.

      *(Refining the Capture Dilemma)*: Nadia needs to press hard here. If a reason is free-floating, and I notice it, it becomes a reason for me. If I don't, it doesn't guide action. So what work is "free-floating" doing?

      *(Refining the Ending)*: Nadia asks Emil: "Where does the reason live if not in a mind?" Emil asks Nadia: "What makes the reason vanish when the agent dies?"

  7.  **Final Review against constraints:**
