answer: |-
  The last of the students had filed out, leaving the seminar room in that specific silence that follows intense discussion—the air still vibrating, the chairs slightly askew. Nadia Ferrante stacked her notes on the table. Emil Vasa leaned against the whiteboard, erasing a diagram of overlapping circles with the heel of his hand.

  **Nadia:** They looked exhausted. I think we pushed them hard on the ownership condition.

  **Emil:** They followed. But I know you weren't satisfied. You still think I'm positing ghosts.

  **Nadia:** I think I'm positing agents, and you're positing… norms without noses. But let's not restart the seminar. We agree on the easy case. If I promise my living friend to help her move, there is a reason to do it.

  **Emil:** Agreed. And we agree why. Her expectation, her claim on me, the good of her trusting me.

  **Nadia:** Where we split is the grammar. I say: "I have a reason." You say: "There is a reason, and I am the one standing in its light."

  **Emil:** Because sometimes the light exists before anyone stands in it. Take the orphaned bequest. Our dying friend extracts a promise to finish her translation. She knows no one will read it. No beneficiaries, no survivors who care. She dies. You say the reason dissolves with her.

  **Nadia:** I say the reason loses its anchor. A reason is a relation. If the relata vanish, the relation vanishes. Who is the reason for? Not her—she's gone. Not the readers—there are none.

  **Emil:** It's for the promise itself. The fact that the request was made generates a normative demand. It floats until someone catches it.

  **Nadia:** Here is where I feel the pinch of my own view. If I say there is no reason to finish the translation, it sounds like I'm saying betrayal is permissible. That's unattractive. It feels like I'm reducing fidelity to a transaction that requires a living beneficiary.

  **Emil:** And here is my pinch. If I say the reason exists fully, independent of any human interest, then why doesn't it swamp everything? If there is a free-floating reason to finish that translation, does it outweigh my reason to feed my children? If yes, I'm a monster. If no, then what kind of reason is it that loses to lunch?

  **Nadia:** Exactly. That's the weighing problem. If your free-floating reasons enter the deliberative balance, they demand too much. If they don't, they aren't reasons.

  **Emil:** I grant they enter the balance. But perhaps they weigh less than agent-relative projects.

  **Nadia:** Then you need a metric for weight that isn't just "how much it matters." But let's push the identity case. Fission. I make a promise, then I split into two successors, A and B. Both are equally continuous with me.

  **Emil:** The reason exists. The promise was made. Now, who owns it?

  **Nadia:** If reasons are owned, the ownership must split or vanish. If it splits, do A and B each have a half-reason? That makes no sense. A reason to φ is not divisible like a debt.

  **Emil:** This is where the inheritance thread matters. Think of a debt. If a creditor dies, the debt doesn't vanish; it passes to an estate. Maybe reasons pass down a chain of custody.

  **Nadia:** But a debt is legal. A reason is normative. If the chain breaks when the original holder dies or splits, then the reason dies. If it doesn't break, where does it live? In the abstract?

  **Emil:** In the facts. Look, consider the empty world. Nothing exists but intense, prolonged agony. No agents. No observers. Just pain.

  **Nadia:** There is badness there. I grant you that.

  **Emil:** Is there a reason for it to stop?

  **Nadia:** No. A reason is a call to action. Without an ear to hear, there is no call. There is only a tragic fact.

  **Emil:** That's the shadow worry, isn't it? You think that if an agent *were* there, they would have a reason to stop it. So the free-floating reason is just a shadow of the agent-relative one.

  **Nadia:** Precisely. In any world containing agents, every free-floating reason is shadowed by somebody's reason to promote what matters. So why posit the free-floating one? It changes nothing in the first-order verdicts.

  **Emil:** It changes the explanation. The agent has a reason *because* the agony is bad. The badness is primary. The agent's reason is secondary. If you remove the free-floating reason, you make the agent's reason brute. It hangs in the air without a ground.

  **Nadia:** But here is my capture dilemma. Any free-floating reason that shows up in someone's deliberation seems thereby to be taken up and becomes hers. She deliberates: "There is pain. I should stop it." Now it's *her* reason. Any reason that never shows up anywhere seems normatively inert. It does no work. So a free-floating reason looks like it must be either absorbed or inert. It is never actually free-floating in practice.

  **Emil:** It's like a law of physics. Gravity works whether I calculate it or not.

  **Nadia:** But gravity causes motion. What does an unapprehended reason cause? Nothing. So what is it?

  **Emil:** It's a truth. Not a cause. A truth about what ought to be.

  **Nadia:** This brings us to whether we're even fighting. Is this substantive or verbal? We agree on the agony: it's bad. We agree on the promise: keep it. We agree on the bequest: it's honorable to finish it. You call the ground a "free-floating reason." I call it "a fact that would ground a reason for anyone suitably placed."

  **Emil:** If no possible case can separate our first-order verdicts, maybe we are disagreeing about the word "reason." But I think there is evidence. Imagine a case where an agent *should* act, but cannot know it. No epistemic access.

  **Nadia:** If they can't know it, it can't guide them.

  **Emil:** But it still judges them. If they stumble into doing the right thing by accident, were they right?

  **Nadia:** They were lucky.

  **Emil:** I say they were aligned with a reason that existed before they found it. To settle this, I need you to admit that normativity might outstrip agency. What would count as evidence for you?

  **Nadia:** Show me a reason that makes a difference to what happens without being taken up by a mind. If it doesn't guide, doesn't explain, and doesn't motivate, it's a wheel that turns nothing. What would count as evidence for me? Show me a reason that isn't *for* someone. Every time you point to one, I can ask, "For whom?" and you either name an agent or you stare into the void.

  **Emil:** I stare into the void and see value.

  **Nadia:** I see a mirror.

  *They stood in silence for a moment, the hum of the projector cooling down filling the gap.*

  **Emil:** You forced me to admit that if free-floating reasons don't swamp personal projects, they risk looking toothless. I need to explain how a reason can be real but weigh less than a personal commitment without ceasing to be a reason.

  **Nadia:** And you forced me to admit that denying the reason in the orphaned bequest makes fidelity look like a contract rather than a virtue. I need to explain how a reason can persist without a living holder without becoming a ghost.

  **Emil:** So here is my question for you, Nadia. If the agent vanishes—the friend dies, the world empties—what exactly snaps? What mechanism turns a normative truth into a normative nullity just because a mind stops looking at it?

  **Nadia:** And here is mine for you, Emil. If the reason floats free, waiting to be caught, where does it live before the capture? Not in a mind, not in an action. If it's not in the world of facts and not in the world of minds, what ontology are you buying to keep it alive?
