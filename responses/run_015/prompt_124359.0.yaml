      *   Needs to test structural understanding, not slogan memorization.
      *   Bad: "Can we have calibration and equal error rates?" (Yes/No).
      *   Good: "If we force the False Positive Rates to be equal, what happens to the meaning of the score?" (Answer: A 0.5 in Group A no longer means the same probability as 0.5 in Group B).

