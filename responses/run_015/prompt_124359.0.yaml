prompt: |-
  Hi — I need a teaching plan, not the explanation itself. I've got 45 minutes and a whiteboard with the care-management team at the hospital where I work: about fifteen people, roughly half nurses and care coordinators, half IT and analytics, nearly all of whom helped ship the readmission-risk score we now run on every discharged patient. They're proud of it, and they can tell I'm circling around something critical, so the sequence has to not land as "your model is bad and so are you." Also I can't use the word "bias" even once: to the nurses it means prejudice, to the analytics folks it means the statistical kind, and every time it comes up we spend ten minutes talking past each other.

  The thing they need to get is the impossibility one: a score can't at the same time *mean the same thing* in both groups (a 0.3 means a 30-ish percent chance of readmission whether you're on Medicaid or commercial insurance) and *make the two kinds of mistake at the same rates* in both groups, once the groups' base rates differ — except in the degenerate cases where the score is either perfect or useless. My two groups are insurance type, not a protected class, which is part of why I want to use it: the readmission rate really is higher in one group, and nobody in the room will think I'm making a moral accusation.

  So plan the arc. What has to be on the board before the tension can even be felt — the 2x2 of predicted vs. actual, does "the score means what it says" have to come before error rates or after, when do the two base rates get revealed — and why that order and not another. One example carries the whole thing and it has to be hand-checkable: a table of maybe forty patients across two groups that someone can literally count on their fingers. Rules: not recidivism, not loans, not hiring (they've all seen those and they switch off), and built so that the base-rate difference is real but nobody can settle everything by saying "well, that group just is sicker." Tell me what the numbers have to be, not only what the example is about.

  Misconceptions I'm expecting, roughly in the order I think they'll fire: "the model has basically the same AUC in both groups, so it's equally good for both"; "just drop the insurance field and it's fine"; "so we should use a different cutoff per group then"; "the rates differ because the patients differ, so this isn't a fairness question at all"; "that's just a small-sample / bad-data artifact, we need more data." Where does each one get defused in the sequence, and which one am I not seeing that always shows up anyway?

  Then: the single question I can ask at the end that tells me they got the structural point rather than memorised the slogan "you can't have all three" — something they'd get wrong if they'd only retained the slogan. And what should I openly refuse to get into in 45 minutes (the proof? the causal and measurement story? what we should actually do about it?) and say out loud that I'm skipping. Ideally they walk out able to look at a vendor's "fairness dashboard" and know which numbers can't all be green at once.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** 15 hospital staff (mixed clinical/care management and IT/analytics). Proud of their current readmission risk model.
      *   **Time:** 45 minutes.
      *   **Constraints:** Whiteboard only. No use of the word "bias" (semantic clash).
      *   **Core Concept:** The Impossibility Theorem of Fairness (Calibration vs. Error Rate Balance given different base rates).
      *   **Goal:** Teach the *structural tension*, not accuse them of building a bad model. Use insurance type (Medicaid vs. Commercial) as the grouping variable (real base rate difference, less morally charged than race/gender in this specific context, though still sensitive).
      *   **Deliverables:** Teaching arc/sequence, specific numerical example (hand-checkable, ~40 patients), handling misconceptions, final comprehension check question, scope boundaries.

  2.  **Determine the Core Tension (The "Impossibility"):**
      *   Condition 1: Calibration (Score = Probability). A 0.3 risk means 30% readmission rate for *both* groups.
      *   Condition 2: Error Rate Balance (Equal False Positive/Negative Rates).
      *   Condition 3: Different Base Rates (One group gets sick more often than the other).
      *   *Theorem:* You can have 1 & 3, or 2 & 3, or 1 & 2 (if base rates are equal). You cannot have 1, 2, & 3 simultaneously.
      *   *Strategy:* Since the prompt asks to show they can't have "mean the same thing" (Calibration) AND "make two kinds of mistake at same rates" (Error Balance) when base rates differ, I need to construct an example where Calibration holds, Base Rates differ, and then show Error Rates *must* differ.

  3.  **Design the Numerical Example:**
      *   *Constraint:* ~40 patients total. Hand-checkable.
      *   *Context:* Not recidivism/loans/hiring. Needs to be clinical but distinct from "just sicker." Let's use **Post-Discharge Follow-Up Attendance** as the proxy for risk, or stick to Readmission but frame the *cause* carefully. The prompt says "readmission-risk score," so I should stick to Readmission to keep it relevant, but the *reason* for the base rate difference needs to be accepted as fact without triggering "that group is just sicker" defensiveness.
      *   *Grouping:* Medicaid (Group A) vs. Commercial (Group B).
      *   *Base Rates:* Need to be different. Let's say Group A has 50% readmission, Group B has 20% readmission. (Distinct enough to see the math, not so extreme it looks fake).
      *   *Total Patients:* 40. Let's split 20 per group for symmetry.
      *   *Scenario:*
          *   Group A (20 patients): 10 Readmit (50%), 10 Don't.
          *   Group B (20 patients): 4 Readmit (20%), 16 Don't.
      *   *The Score:* Needs to be *Calibrated*.
          *   If I predict "High Risk" (score > 0.5), the actual rate in that bucket must match the score.
          *   To make it simple for a whiteboard, let's use a binary classifier threshold for the example, but frame it as the underlying probability.
          *   Actually, to show Calibration, I need the predicted probability to match the observed frequency.
          *   Let's simplify: Let's assume the model outputs a "High Risk" flag for everyone who actually readmits? No, that's perfect prediction.
          *   Let's assume the model is *Calibrated*.
          *   Group A: 10 events. Model predicts 0.5 risk for 20 people? Then 10 should event.
          *   Group B: 4 events. Model predicts 0.2 risk for 20 people? Then 4 should event.
          *   *Wait, the tension arises when we try to set a threshold for intervention.*
          *   If we intervene on everyone > 0.3 risk.
          *   Group A (Base 50%): If calibrated, 50% of people have risk > 0.3? Not necessarily.
          *   *Better approach for Whiteboard:* Use a confusion matrix approach derived from a calibrated score.
          *   Let's create a threshold $T$.
          *   If the model is Calibrated, $P(Y=1 | Score=S) = S$.
          *   To show the impossibility, I need to show that if Calibration holds + Base Rates differ, then False Positive Rates (FPR) and False Negative Rates (FNR) *cannot* be equal.
          *   *Example Construction:*
              *   Group A (20 patients): 10 Readmit, 10 Safe.
              *   Group B (20 patients): 4 Readmit, 16 Safe.
              *   Model is Perfectly Calibrated. Let's assume a single threshold for intervention, say Risk > 30%.
              *   To make the math visible: Let's assume the model assigns a score of 0.5 to everyone in Group A (since 50% readmit) and 0.2 to everyone in Group B (since 20% readmit).
              *   *Wait, that makes the model "know" the group.* The prompt implies the model *doesn't* explicitly use insurance, or at least we are evaluating the *output* distribution.
              *   *Refinement:* The model outputs scores. We bucket them.
              *   Let's try a specific threshold, say 0.35.
              *   Group A (50% base rate): To be calibrated, the average score must be 0.5. Let's say 10 people get score 0.5 (all readmit), 10 people get score 0.5 (all safe)? No.
              *   Let's say:
                  *   Group A: 10 people score 0.6 (6 Readmit, 4 Safe). 10 people score 0.4 (4 Readmit, 6 Safe). Average score = 0.5. Actual rate = 0.5. (Calibrated).
                  *   Group B: 10 people score 0.3 (1 Readmit, 9 Safe). 10 people score 0.1 (3 Readmit, 7 Safe). Average score = 0.2. Actual rate = 0.2. (Calibrated).
              *   Now apply a threshold for "High Risk Intervention" at 0.5.
              *   Group A: 10 flagged. 6 True Pos, 4 False Pos. FPR = 4/10 = 40%. FNR = 4/10 = 40%.
              *   Group B: 0 flagged. 0 True Pos, 0 False Pos. FPR = 0/16 = 0%. FNR = 4/4 = 100%.
              *   *Result:* Calibration holds (within buckets). Base rates differ. Error rates differ wildly.
              *   *Is this too extreme?* Maybe. Let's make the scores overlap more so it looks like a "real" model.
              *   *Revised Example:*
                  *   Total 40 patients. 20 Medicaid (M), 20 Commercial (C).
                  *   Outcome: Readmission within 30 days.
                  *   Base Rates: M = 50% (10/20), C = 20% (4/20).
                  *   Model Output: A risk score (0-1).
                  *   To ensure Calibration:
                      *   In Group M: 10 patients get Score 0.5. (5 Readmit, 5 Safe).
                      *   In Group C: 20 patients get Score 0.2. (4 Readmit, 16 Safe).
                      *   *Wait, if I give everyone in C a 0.2, and threshold is 0.3, C gets zero interventions.*
                      *   Let's make it slightly more granular.
                      *   Group M (20 pts, 10 events): 10 pts score 0.6 (6 events, 4 safe). 10 pts score 0.4 (4 events, 6 safe). Mean score 0.5. Calibration holds.
                      *   Group C (20 pts, 4 events): 4 pts score 0.5 (2 events, 2 safe). 16 pts score 0.125 (2 events, 14 safe). Mean score 0.2. Calibration holds.
                      *   Threshold for Care Coordination: Score $\ge$ 0.5.
                      *   Group M: 10 Flagged. 6 TP, 4 FP. (FPR = 4/10 = 40%). (FNR = 4/10 = 40%).
                      *   Group C: 4 Flagged. 2 TP, 2 FP. (FPR = 2/16 = 12.5%). (FNR = 2/4 = 50%).
                      *   *Comparison:* FPR (40% vs 12.5%). FNR (40% vs 50%).
                      *   *Point:* Even though "0.5 means 50% risk" in both groups (Calibration), the *burden* of false alarms (FPR) and *missed cases* (FNR) are different.
      *   *Simplicity Check:* Can they count this on fingers?
          *   Group M: 20 people. 10 get "High Score". 6 sick, 4 well. 10 get "Low Score". 4 sick, 6 well.
          *   Group C: 20 people. 4 get "High Score". 2 sick, 2 well. 16 get "Low Score". 2 sick, 14 well.
          *   This works. It's small enough.

  4.  **Sequence the Arc (45 Minutes):**
      *   **0-5 min: Setup & Validation.** Acknowledge the win. The model works. It predicts risk.
      *   **5-15 min: The "What does it mean?" Check.** Define Calibration. Draw the 2x2. Populate Group M. Show it works. Populate Group C. Show it works.
      *   **15-25 min: The Operational Decision.** We have resources for X patients. We cut at Score 0.5. Count the errors.
      *   **25-35 min: The Reveal.** Compare the error counts. They don't match. Ask "Who is burdened?"
      *   **35-40 min: Addressing Misconceptions.** (The "Just drop insurance" etc.)
      *   **40-45 min: The Takeaway & Question.**

  5.  **Addressing Misconceptions:**
      *   *AUC is same:* AUC measures ranking, not calibration or error rates at a threshold. Address during the "Operational Decision" phase.
      *   *Drop the field:* Correlated proxies (zip code, diagnosis codes) will recreate the base rate. Address in Q&A/Constraints.
      *   *Different cutoff:* This is the *solution* trade-off. Acknowledge it fixes error rates but breaks "same meaning" (Calibration).
      *   *Just sicker:* This is the base rate reality. Acknowledge it, but separate *prediction* from *resource allocation*.
      *   *Small sample:* Admit it's a toy model, but the math scales.
      *   *Hidden Misconception:* "We can fix this with better features." (No, it's structural).

