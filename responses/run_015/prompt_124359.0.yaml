  ## Teaching Plan: The Calibration/Error-Rate Tension
  **Time:** 45 Minutes
  **Audience:** Care Management + IT/Analytics (15 people)
  **Constraint:** No use of the word "bias."
  **Goal:** Demonstrate the structural impossibility of maintaining Calibration and Equal Error Rates simultaneously when Base Rates differ.

  ### 1. Board Layout & Prep (Before they arrive)
  Draw three distinct zones on the whiteboard. Leave space between them.
  *   **Left Zone:** "Group A (Medicaid)" — Draw a 2x2 Confusion Matrix skeleton.
  *   **Right Zone:** "Group B (Commercial)" — Draw a 2x2 Confusion Matrix skeleton.
  *   **Bottom Zone:** "The Trade-Off" — Two empty comparison lines: *False Alarm Rate* and *Missed Case Rate*.

  ### 2. The Arc (45 Minutes)

  #### Phase 1: Validation & Setup (0–5 mins)
  *   **Action:** Acknowledge the model's success. "We built a tool that predicts readmission risk. It works. Today isn't about fixing bugs; it's about understanding the physics of the numbers we're using to allocate care."
  *   **Board:** Write **"Calibration"** at the top. Define it simply: *"If the score says 60%, do 60% of those patients actually readmit?"*
  *   **Why:** Starts from pride, not defensiveness. Establishes the shared definition of "truth" (Calibration) before introducing the conflict.

  #### Phase 2: The Hand-Checkable Example (5–20 mins)
  *   **Action:** Populate the Left Zone (Group A) first.
      *   **N:** 20 Patients. **Base Rate:** 50% (10 Readmit, 10 Safe).
      *   **Model Output:**
          *   10 patients get Score **0.6**. (6 Readmit, 4 Safe). *Check: 6/10 = 60%. Calibrated.*
          *   10 patients get Score **0.4**. (4 Readmit, 6 Safe). *Check: 4/10 = 40%. Calibrated.*
      *   **Decision:** "We intervene on scores $\ge$ 0.5."
      *   **Count:** 10 Flagged. 4 False Positives (Safe but flagged). 4 False Negatives (Sick but missed).
      *   **Rates:** False Alarm Rate = 4/10 (40%). Missed Case Rate = 4/10 (40%).
  *   **Action:** Populate the Right Zone (Group B).
      *   **N:** 25 Patients. **Base Rate:** 20% (5 Readmit, 20 Safe). *Note: Slightly larger N to keep integers clean.*
      *   **Model Output (Must remain Calibrated):**
          *   5 patients get Score **0.6**. (3 Readmit, 2 Safe). *Check: 3/5 = 60%. Calibrated.*
          *   20 patients get Score **0.1**. (2 Readmit, 18 Safe). *Check: 2/20 = 10%. Calibrated.*
      *   **Decision:** "Same rule: Intervene on scores $\ge$ 0.5."
      *   **Count:** 5 Flagged. 2 False Positives. 2 False Negatives.
      *   **Rates:** False Alarm Rate = 2/20 (10%). Missed Case Rate = 2/5 (40%).
  *   **Why:** Integers only. No decimals in the counts. They can verify the calibration with their fingers. The threshold (0.5) is the same, honoring the "same meaning" constraint.

  #### Phase 3: The Reveal (20–30 mins)
  *   **Action:** Move to the Bottom Zone. Fill in the comparison.
      *   **False Alarm Rate:** Group A (40%) vs. Group B (10%).
      *   **Missed Case Rate:** Group A (40%) vs. Group B (40%).
  *   **Narrative:** "Look at the Missed Case Rate. It's identical. We are catching the same proportion of sick patients in both groups. But look at the False Alarm Rate. For every 100 well patients we call, Group A gets 40 unnecessary calls; Group B gets 10."
  *   **The Pivot:** "We kept the score meaning consistent (Calibration). We kept the Base Rate reality (50% vs 20%). But the *operational burden* diverged."
  *   **Defusing Misconception #1 ("The model is equally good/AUC"):** "The AUC might be identical. Ranking ability isn't the issue. The issue is where the threshold cuts through the distribution."
  *   **Defusing Misconception #2 ("That group is just sicker"):** "Exactly. That is the Base Rate. Because that reality is different, and we insisted the Score Mean the Same Thing, the Error Rates *had* to split. That is the math, not a moral judgment."

  #### Phase 4: The "Fixes" & Trade-offs (30–40 mins)
  *   **Action:** Ask: "How do we make the False Alarm Rates match?"
  *   **Board:** Erase the Group B threshold. Change it to **0.3**.
      *   Now more Group B patients get flagged. False Alarm Rate goes up to match Group A.
      *   **Ask:** "What happened to Calibration?"
      *   **Answer:** "A 0.3 in Group B no longer means the same risk as a 0.3 in Group A. We broke the 'Meaning' to fix the 'Error'."
  *   **Defusing Misconception #3 ("Drop the insurance field"):** "If we remove insurance, zip code and diagnosis codes will proxy for it. The Base Rate difference remains, so the tension remains."
  *   **Defusing Misconception #4 ("More data"):** "More data makes the counts bigger, not the ratios different. This is structural, not statistical noise."
  *   **Defusing Misconception #5 ("Different cutoffs"):** "That is a valid policy choice. But acknowledge it: you are choosing to treat the same score differently depending on the group. That is a decision, not a model fix."

  #### Phase 5: Close & Comprehension Check (40–45 mins)
  *   **Scope Boundary (Say this out loud):** "I am not going to prove the theorem, nor am I going to tell you which metric to prioritize. That is a clinical leadership decision, not an analytics one. I am also skipping *why* the base rates differ (social determinants, access, etc.). We are looking only at the constraint."
  *   **The Final Question:**
      *   *Ask:* "If a vendor shows you a dashboard where Calibration is perfect for both groups, Base Rates differ, and False Positive Rates are identical... what number are they hiding or fudging?"
      *   *Expected Answer:* "The False Negative Rates (Missed Cases) must be different." (Or vice versa: if Error Rates match, Calibration must be broken).
      *   *Why this works:* It tests if they understand the *triangle* of constraints, not just the slogan.

  ### 3. Anticipated Misconceptions & Defusal Map

  | Misconception | When it fires | Defusal Strategy |
  | :--- | :--- | :--- |
  | **"AUC is the same, so it's fair."** | Phase 3 (The Reveal) | AUC measures ranking, not threshold impact. Point to the specific 2x2 counts. |
  | **"Just drop the insurance field."** | Phase 4 (The Fixes) | Explain proxy variables (zip, diagnosis). The Base Rate difference is in the *outcome*, not just the input. |
  | **"Use different cutoffs then."** | Phase 4 (The Fixes) | Validate this as a policy option, but highlight it breaks Calibration ("Meaning"). |
  | **"They're just sicker."** | Phase 3 (The Reveal) | Agree. "Because they are sicker, and we kept the score meaning fixed, the errors *must* shift." |
  | **"Small sample artifact."** | Phase 4 (The Fixes) | "Multiply the patients by 1,000. The percentages stay the same. It's algebra, not sampling." |
  | **"Hidden: We can fix this with better features."** | Phase 4 (The Fixes) | **Crucial.** "Unless the new features make the Base Rates equal (curing the disease), the tension remains." |

  ### 4. What to Refuse (Scope Boundaries)
  Explicitly state these three things are **out of scope** for this 45 minutes:
  1.  **The Proof:** "We aren't doing the algebra today. We are looking at the consequence."
  2.  **The Causal Story:** "We are not discussing *why* Medicaid patients have higher readmission rates today. We are taking that rate as a given input."
  3.  **The Solution:** "I am not recommending a cutoff. I am showing you that you *must choose* a cutoff preference."

  ### 5. The Numbers Summary (For your reference)
  *   **Group A (Medicaid):** 20 Patients. 10 Events (50%).
      *   10 @ Score 0.6 (6 Event, 4 Safe).
      *   10 @ Score 0.4 (4 Event, 6 Safe).
      *   Threshold 0.5 $\rightarrow$ 4 FP, 4 FN. (FPR 40%, FNR 40%).
  *   **Group B (Commercial):** 25 Patients. 5 Events (20%).
      *   5 @ Score 0.6 (3 Event, 2 Safe).
      *   20 @ Score 0.1 (2 Event, 18 Safe).
      *   Threshold 0.5 $\rightarrow$ 2 FP, 2 FN. (FPR 10%, FNR 40%).
  *   **Tension:** FNR matches (40%), but FPR diverges (40% vs 10%) despite Calibration holding at Score 0.6.
