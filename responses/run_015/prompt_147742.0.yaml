prompt: |-
  hey, i'm putting together a reading list for a grad seminar on philosophy of math and physics, and i keep running into these glib explanations for why math works so well in science — you know, wigner's old point about the unreasonable effectivness thing. but i want the full spec first: what does any decent philosophical account of this effectiveness actually have to deliver?

  write me the desiderata. specifically: which phenomona it needs to cover (not just the classic ones like predicting planetary orbits, but also the weirder cases — like how hamiltonian and lagrangian mechanics are mathematically totally different but physically identical, or how we use pure math like group theory to build quantum mechanics before anyone knows if the predictions will pan out). also, which distinctions it can't collapse: e.g. between math being a representational mirror of nature vs just a useful heuristic tool, or between success in empirically testable domains vs in post-empirical stuff like string landscapes where there's no clear observational check. flag any pair of desiderata you think are probably incompatabile — i'm especially suspicious that demanding both 'math is just a human construct' and 'math necessarily tracks physical structure' can be jointly satisfied, but tell me if there's a deeper tension.

  then, very briefly, score how platonism about mathematical objects, a categorical structuralist view, and a deflationary/fictionalist stance do against your list. don't need a bibliography, just your gut check.

  oh, and watch out for the redundancy problem — any theory that ignores why different formalisms yield the same physics hasn't really explained effectiveness, it's just moved the bump in the carpet.
