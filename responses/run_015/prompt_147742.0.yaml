      *   *Phenomenon 3: The "Delay" or "Pre-availability".* Group theory existed before QM. Non-Euclidean geometry before GR. The math was ready and waiting.
      *   *Distinction 1: Ontology vs. Instrument.* Is math *in* the world or just a *tool*? The account must clarify if effectiveness implies existence or just utility.
