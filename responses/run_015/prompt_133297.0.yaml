  You conflate the content of occurrent judgment with its authority. Taking Pill A, you rationally judge that your future self's deliberative access must be restricted. If so, the subsequent judgment that you have no reason to pay is not a deliverance of rationality; it is a glitch the policy bypasses. Rationality does not require heeding every occurrent seeming, especially when preemptively judged unreliable. Adopting a policy is the paradigmatic exercise of agency. Automatic execution does not negate the source. A thermostat isn't an agent; a person binding themselves to a thermostat's logic to survive is. You distinguish A and B to isolate irrationality. But if the policy is rational, the mechanism is irrelevant unless it introduces costs. Does Pill A cause sickness or only deliberative blindness? I deny the act is irrational. It is the output of a rational procedure. To call it irrational is to privilege the glitch over the structural fix.

