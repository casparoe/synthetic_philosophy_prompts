answer: |-
  This is not a verbal disagreement. It is not merely a semantic quibble over the definition of a word. If it were verbal, you could stipulate a definition ("Okay, for this conversation, let's use Lemkin's definition") and the argument would vanish. It wouldn't. You would still disagree on whether applying that definition *matters* or what work it is doing.

  It is also not purely substantive in the empirical sense. You agree on the history. You agree on the suffering.

  **The Diagnosis:**
  Your disagreement is **bedrock**, rooted in a divergence over **collective ontology**, but it manifests as a conflict between **legal instrumentalism** (your roommate) and **moral realism** (you).

  Here is the breakdown of why this debate stalls and why it feels intractable.

  ### 1. The Ontological Fault Line (The Bedrock)
  You hit the nail on the head: this is about the ontology of groups.
  *   **Your Roommate (Reductionist/Individualist):** Implicitly views "the group" as a fiction. For them, harm only truly happens to individuals. Therefore, "genocide" is just a shorthand for "mass murder with a specific motive." If the legal mechanism doesn't trigger, the label is functionally useless rhetoric. They are a **legal positivist**: law is what is written, not what is felt.
  *   **You (Collective Realist):** You view "the group" as an entity with moral standing independent of its current members. The destruction of the *structure* of the group (culture, lineage, continuity) is a unique harm that is not reducible to the sum of individual deaths. You are a **moral realist**: the label describes a truth about the world, regardless of whether a court convicts someone.

  **Why this is bedrock:** You cannot prove to your roommate that a group has ontological weight any more than they can prove to you that only individuals exist. This is a foundational intuition. However, recognizing this doesn't end the debate; it clarifies that you are arguing about *metaphysics*, not history.

  ### 2. The Functional Divergence (Sword vs. Mirror)
  This is the substantive layer. You are using the word "genocide" to perform different speech acts.
  *   **Roommate: The Sword.** For them, "genocide" is a prosecutorial tool. Its only valid use is to unlock the UN Convention obligations (prevention, punishment). If the legal criteria aren't met, wielding the word is "inflationary" and weakens the sword for future cases (like Cambodia). They fear **conceptual stretching**.
  *   **You: The Mirror.** For you, "genocide" is a moral mirror. Its use is to reflect the specific nature of the atrocity back to society. Even if no one is prosecuted (e.g., climate displacement or historical boarding schools), the label is necessary to accurately describe the *kind* of evil committed. You fear **moral evasion**.

  **The Stall:** The debate never moves forward because the international system is designed to exploit this exact ambiguity. States want the **moral weight** of the term (to condemn enemies) without the **legal obligation** (to intervene). Your roommate is defending the legal integrity of the tool; you are defending the moral accuracy of the description. Both are correct within their own frameworks, but the frameworks are incompatible.

  ### 3. The Distinction That Could Move It
  To test this, stop arguing about specific cases (Cambodia, Indigenous schools) and argue about **Cultural Genocide**.

  In 1948, the UN Convention explicitly *removed* cultural genocide from the legal definition due to pressure from colonial powers and the US (regarding Indigenous peoples).
  *   **The Test:** Ask your roommate: *"If a state systematically destroys a group's language, religion, and children's cultural ties, but does not physically kill them, is it genocide?"*
      *   **If they say No:** They are a strict legal positivist. The debate is over. You agree that legally it isn't, but you maintain morally it is. You have to accept you are talking past each other: one of you is talking law, the other ethics.
      *   **If they say Yes:** Then ask: *"Why did the UN exclude it?"*
          *   If they say "Politics," then they concede your point that the legal definition is politically narrowed, not conceptually pure.
          *   If they say "Because cultural destruction isn't real destruction," then you have exposed the bedrock ontological disagreement.

  ### 4. Is the Question Ill-Posed?
  No. The question is not ill-posed; it is **politically radioactive**.
  The reason the debate stalls is not because philosophers haven't found the right definition. It stalls because the definition is a **ceiling**, not a floor.
  *   **Roommate's Error:** They assume the stall is due to conceptual confusion. It isn't. It's due to political will. Narrowing the definition doesn't make prosecution more likely; it just makes conviction easier *if* prosecution happens. But states rarely prosecute themselves.
  *   **Your Error:** You assume that broadening the definition would lead to moral clarity. It might lead to moral clarity, but it could also lead to "genocide fatigue," where the word loses its capacity to shock.

  ### The Verdict
  You should not accept that the question is ill-posed, but you must accept that it is **category-disparate**.

  *   **Your Roommate** is arguing from **Jurisprudence**: "What can we punish?"
  *   **You** are arguing from **Ethics**: "What happened?"

  **How to resolve the stalemate:**
  Acknowledge that "Genocide" has fractured into two distinct concepts:
  1.  **Legal Genocide:** The narrow UN Convention crime (Roommate's domain).
  2.  **Sociological Genocide:** The Lemkinian concept of group destruction (Your domain).

  The debate stalls because people try to use **Sociological Genocide** to trigger **Legal Genocide** obligations. That is where the friction lies. If you agree that calling Indigenous boarding schools "genocide" is a *moral/historical claim* (Sociological) and not necessarily a *call for ICC prosecution* (Legal), the tension dissolves.

  Your roommate is worried about the **utility of the law**. You are worried about the **truth of history**. Both are valid, but they are not the same project. The "stall" is the sound of those two projects grinding against each other.
