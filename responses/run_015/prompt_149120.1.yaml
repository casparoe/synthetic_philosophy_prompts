answer: |-
  The stalemate is best diagnosed as **Different Questions Under One Name**. H asks, "How do organisms produce reports of experience?" while C asks, "What is the structure of experience itself?" Both label this project "Science of Consciousness," but their success conditions are mutually invisible. H succeeds by predicting texts and behaviors; C succeeds by capturing felt qualities. Because H defines data as third-person accessible and C defines the target as first-person accessible, no empirical result can satisfy both simultaneously. The dispute persists because each side treats the other's constitutive constraints as arbitrary restrictions rather than foundational definitions.

  The **Verbal** diagnosis fails because changing terminology (e.g., "qualia" to "judgments") does not resolve the ontological commitment; C insists reports are *about* something non-reportal, and H insists that "something" is mythical. The **Hidden Empirical** diagnosis fails because empirical facts underdetermine the metaphysics. If reports are stable (Case 3), H calls it better behavior prediction, and C calls it phenomenal structure. The **Standards of Evidence** diagnosis is the mechanism of the stall, not the cause; the standards differ *because* the questions differ.

  **Case Evaluations:**
  1.  **Swap Pair:** H denies the difference exists (ontological parsimony); C asserts H is blind to the difference (phenomenal realism). This exposes the divergent targets: H targets the discrimination capacity (identical); C targets the felt quality (distinct).
  2.  **Protocol Sensitivity:** H cites this as proof reports are constructed texts (validating heterophenomenology). C cites this as proof naive introspection is flawed, necessitating trained methods (validating phenomenology). Both use the noise to justify their preferred method.
  3.  **Trained Reporter:** This is the critical stress test. H must accept the data as improved behavioral measures or appear dogmatic. C claims this validates first-person ontology. If H accepts the data but denies the ontology, the practice converges while the theory diverges.

  **Progress:**
  Progress requires decoupling the metaphysical claim from the methodological practice. A formal distinction between "Science of Report-Production" and "Science of Phenomenal Structure" would clarify the stall. Empirically, demonstrating that trained first-person data predicts neural states *better* than third-person behavioral data would force H to integrate first-person methods instrumentally, even if metaphysical agreement remains impossible.

