answer: |-
  **Brainstorming Pass**
  1. Verbal dispute over "proposition" (object vs. act).
  2. Conflation of linguistic vehicle unity with metaphysical fact unity.
  3. False proposition problem kills Russellian actual relating.
  4. Frege's unsaturatedness is a label, not an explanation (category mistake).
  5. King's syntactic approach solves structure but not representation.
  6. Hanks/Soames: Unity is in the judging act, not the content (propositionalism).
  7. Fine's non-merelogical composition vs. standard mereology.
  8. User's three jobs are real but Job 3 (ontological) swallows 1 and 2.
  9. Unordered multiset test isolates directionality from unity; regress survives.
  10. Bedrock limit: Explanation requires unity, so unity cannot be explained non-circularly.

  ***

  **Considered Diagnosis**

  Your hypothesis is remarkably sharp—sharper than much of the contemporary literature that merely iterates Russell against Bradley without diagnosing the stalemate. You are correct that the debate is stalled because "unity" is overloaded, but I would refine your three jobs into two distinct levels: the *combinatorial* problem (how parts form a complex) and the *representational* problem (how that complex says something about the world). The deadlock is not merely verbal, nor is it purely bedrock; it is a category error regarding *explanatory priority*.

  Let's map your three jobs to the historical positions to see where the wires cross.
  1.  **Structure vs. Heap:** This is the combinatorial problem. Frege's "unsaturatedness" and King's syntactic structures solve this easily. A sentence isn't a heap because grammar binds it. But this is linguistic unity, not propositional unity.
  2.  **Truth-Conditional Asymmetry:** This is the problem of direction (aRb vs. bRa). Your unordered multiset thought experiment targets this specifically. If the language is unordered, the problem doesn't dissolve; it intensifies. We still need to know what makes {Love, Brutus, Caesar} differ from {Love, Caesar, Brutus} in content. Russell's "actually relating" attempts to solve this by grounding it in the world, but this fails for false propositions (Brutus does not *actually* love Caesar).
  3.  **One Thing vs. Many:** This is the metaphysical core (Bradley's Regress). Why is the proposition a single truth-bearer rather than a list of constituents?

  The stalemate exists because Fregeans and Russellians solve (1) and (2) by presupposing a solution to (3). They assume the parts *can* combine before explaining *how*. Bradley is the only one who insists that if you analyze the proposition into parts, you lose (3) forever. The Tractarian answer (propositions are facts) tries to dissolve (3) by making propositions worldly, but then false propositions become impossible objects.

  Your unordered multiset test is the crucial diagnostic tool for your scene. If the philosopher mother runs this experiment, she will find that even with unordered words, the *interpretation* requires an ordered structure in the mind. This reveals that the unity isn't in the sentence (the vehicle) or the fact (the world), but in the *act of interpretation* or *judgment*. This is where the recent "propositionalism" of Scott Soames and Peter Hanks lands: unity is not a feature of the object represented, but of the cognitive act of representing.

  **Is it Bedrock or Progress?**
  Do not write the scene as if the mother simply hasn't found the right answer yet. The honest ending is the impasse, but for a specific reason: **The Explanatory Circle.** To explain the unity of a proposition, you must use a proposition. You cannot step outside language to explain how language hooks onto the world without using the very hook you are examining.

  Progress would look like admitting that unity is primitive. If you demand an analysis of unity, you demand that unity be composed of non-unified parts plus a unifier. But the unifier must itself unite. Hence the regress. The only way to stop it is to say "Here unity just exists."

  **Advice for the Scene:**
  The daughter should press on the *falsehood* problem. "If the unity is the actual relating, Mom, what unites the words when Brutus *doesn't* love Caesar?" The mother should realize that every answer either makes false propositions impossible (Tractatus) or pushes the unity back into a mental act (Idealism/Act-Type theories). The scene's resolution shouldn't be a solution, but a recognition that the demand for a *mechanism* of unity is a category mistake. Unity isn't a mechanism; it's a precondition of meaning. The block isn't her lack of knowledge; it's the limit of analysis itself. She isn't failing to explain; the explanation is structurally impossible without circularity. That is the tragedy—and the philosophy.
