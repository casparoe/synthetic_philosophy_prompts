prompt: |-
  hey, quick sanity check for my diss chapter on rational belief and objective chance. I've been reading up on Lewis's Principal Principle and I'm stuck on what feels like a basic tension. The way I understand it, if I know the objective chance of heads is .5, then PP says my credance should be exactly .5, and the only evidence I'm allowed to combine with that is admissable evidence—stuff that doesn't directly concern the actual flip. But that seems to block Bayesian updating entirely: if I flip the coin ten times and see heads every time, that observational data is about the actual flips, so by the admissability restriction I should just ignore it and stay at .5? Or does the principle actually say my credance in the chance being .5 should update, while my credance in the next heads stays pinned?

  I'm trying to argue that the PP is essentially anti-Bayesian because it locks credances to chance values regardless of empirical frequency data, but my advisor said I'm conflating levels. Can you give me a committed answer—don't just lay out both interpretations? I want to know: is the principle genuinely in conflict with standard Bayesian conditioning on outcomes, or is the confusion just in how I'm applying the admissability clause? And if it's the latter, what's the specific mistake—am I treating outcome-evidence as admissable when it's actually inadmissable, or vice versa?

  Also, if the answer depends on whether we take chances to be Humean frequencies vs propensities, does that change the verdict? I don't need a bibliography or citations, just a clear take with reasons.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** David Lewis's Principal Principle (PP) and its relationship to Bayesian updating.
      *   **Core Tension:** The user thinks PP forbids updating on observed frequencies (e.g., 10 heads in a row) because such evidence is "inadmissible," locking credence to the known chance (0.5).
      *   **User's Thesis:** They want to argue PP is "anti-Bayesian."
      *   **Advisor's Feedback:** The advisor says the user is "conflating levels."
      *   **Constraint:** "Committed answer—don't just lay out both interpretations." I need to take a stand.
      *   **Specific Questions:** Is PP genuinely in conflict with Bayesian conditioning? Or is it a misapplication of admissibility? If the latter, what's the specific mistake? Does the metaphysics of chance (Humean vs. Propensity) matter?
      *   **Format:** Clear take with reasons, no bibliography/citations.

  2.  **Evaluate the Philosophy (The "Truth" of the Matter):**
      *   *What is the Principal Principle?* $C(A | X E) = x$, where $X$ is the proposition that the chance of $A$ is $x$, and $E$ is *admissible* evidence.
      *   *What is Admissible Evidence?* Lewis defines it roughly as evidence that doesn't give information about the outcome *except* through its impact on chance. Historical data (past flips) is standardly considered *admissible*. Future data is *inadmissible*.
      *   *The User's Confusion:* The user thinks observational data (10 heads) is *inadmissible* because it concerns "actual flips." This is the critical error. Past outcomes are the *basis* for inferring chances in many frameworks, but more importantly, in Lewis's framework, past outcomes are admissible evidence *about the world* that doesn't violate the principle *unless* it overrides the chance claim.
      *   *The "Level" Confusion:* The advisor is right. There are two propositions:
          1.  $X$: "The chance of Heads is 0.5."
          2.  $A$: "The next flip is Heads."
          3.  $E$: "The last 10 flips were Heads."
      *   If you *know* $X$ is true (it's a fact about the world that the chance is 0.5), then PP says $C(A | X E) = 0.5$. The past 10 heads ($E$) are admissible. They don't change the chance (by stipulation, $X$ is fixed). So your credence in the *next* flip remains 0.5. This is *not* anti-Bayesian; it's consistent with Bayesianism *given* the hypothesis that the coin is fair.
      *   *Where Updating Happens:* Updating happens on the credence in $X$ itself. If you see 10 heads, you should lower your credence that $X$ ("Chance = 0.5") is true and raise your credence that $X'$ ("Chance = 0.9") is true.
      *   *Is PP Anti-Bayesian?* No. PP is a constraint on *initial* priors (or rational priors) regarding how chance and credence relate. It functions *within* a Bayesian framework. It tells you what your credence should be *conditional on* a chance hypothesis. It does not forbid updating on the chance hypothesis itself.
      *   *Metaphysics of Chance:* Does Humean vs. Propensity matter?
          *   *Propensity:* Chances are physical properties. Past data informs us about the property.
          *   *Humean (Best System):* Chances *are* summaries of frequencies (plus simplicity/strength). If you see 10 heads, the *actual chance* might literally change (if the system updates) or your belief about which system is "best" changes.
          *   *Verdict:* The core logic of PP remains the same regarding the *application* of the principle. The conflict the user perceives exists regardless of metaphysics, but the resolution (updating on chance hypotheses, not outcomes given chance hypotheses) is robust across metaphysics.

  3.  **Formulate the Committed Answer:**
      *   **Direct Answer:** Your advisor is correct. The principle is *not* in conflict with Bayesian conditioning. Your application of the admissibility clause is incorrect.
      *   **The Specific Mistake:** You are treating *past* observational data (the 10 heads) as inadmissible. It is admissible. Inadmissible evidence is typically "crystal ball" stuff (future outcomes).
      *   **The Mechanism:** PP applies *conditional on a specific chance hypothesis*. If you hold the hypothesis "Chance = 0.5" fixed, 10 heads is just unlikely noise, and the next flip is still 0.5. Bayesian updating applies to your confidence *in the hypothesis* "Chance = 0.5," not to the outcome *given* that hypothesis.
      *   **Metaphysics:** It doesn't fundamentally change the verdict on the logic of PP, though it changes what "Chance = 0.5" means. The structural relationship between credence and chance remains.

  4.  **Drafting the Response (Iterative refinement for tone and clarity):**
      *   *Tone:* Academic, direct, authoritative (as requested), but helpful.
      *   *Structure:*
          1.  The Verdict (Advisor is right, you are wrong).
          2.  The Specific Mistake (Admissibility definition).
          3.  The Mechanism (Two levels of belief).
          4.  Metaphysics (Minimal impact on this specific logical point).
          5.  Advice for the Dissertation (How to pivot the argument).

      *   *Refining the "Admissibility" point:* Lewis explicitly says historical information is admissible. The user thinks "evidence about actual flips" is inadmissible. I need to correct this. Inadmissible evidence is information about the *outcome* that bypasses the chance (e.g., seeing the future). Past outcomes are admissible because they are consistent with the chance function.
      *   *Refining the "Anti-Bayesian" claim:* PP is a bridge principle. It's compatible with Bayesianism. In fact, Lewis intended it to fit within a Bayesian epistemology. Arguing it's anti-Bayesian is a hard sell that most literature rejects. I should advise the user to pivot. Maybe argue about *undermining futures* (Lewis's own worry) instead of simple updating.

  5.  **Final Polish:** Check against constraints. No citations? Check. Committed answer? Check. Address metaphysics? Check. Address the specific mistake? Check.

      *(Self-Correction during drafting)*: I need to be careful not to be *too* dismissive. The user's confusion is common (the "Gambler's Fallacy" vs. "Law of Large Numbers" tension). I need to explain *why* it feels like a conflict (because in real life, we rarely *know* the chance with certainty). The PP assumes $X$ is known. In reality, we have a distribution over $X$. That's where the updating happens.

      *Key distinction:* $C(Heads | Chance=0.5) = 0.5$. vs $C(Heads | 10 \text{ Heads observed})$. The latter requires summing over chance hypotheses. The user is conflating the conditional probability *given* the chance with the unconditional probability *after* evidence.

  6.  **Finalizing the Text:** (Mental outline of the response)
      *   **Verdict:** Advisor is right. PP is not anti-Bayesian.
      *   **Mistake:** You think past data is inadmissible. It's admissible.
      *   **Explanation:** PP locks credence to chance *only if* you are certain of the chance. If you see 10 heads, you become uncertain of the chance.
      *   **Metaphysics:** Doesn't save the "anti-Bayesian" claim.
      *   **Dissertation Advice:** Don't argue PP is anti-Bayesian. Argue about how we learn chances (the "inverse problem").

      *Wait, one nuance:* Lewis's "Undermining Futures." If the chance is Humean, future outcomes *determine* the chance. So knowledge of the future *is* inadmissible. But past outcomes? Still admissible. The user's example is past outcomes (10 flips). So the verdict holds.

      *Let's write it.*
answer: |-
  Here is the committed answer you need for your dissertation.

  **The Verdict**
  Your advisor is correct. The Principal Principle (PP) is **not** in conflict with standard Bayesian conditioning, and your argument that it is "anti-Bayesian" rests on a specific misapplication of the admissibility clause. You cannot successfully argue that PP locks credences to chance values regardless of empirical frequency data. If you build your chapter on that premise, it will be philosophically vulnerable to the standard Lewisian rebuttal.

  **The Specific Mistake**
  Your error lies in classifying past observational data (the ten heads) as **inadmissible**.

  According to Lewis, evidence is *inadmissible* only if it provides information about the outcome *in a way that bypasses the chance*. Typically, this means information about the *future* (e.g., looking at a crystal ball or time-traveling to see the result).

  **Past outcomes are paradigmatically admissible.**
  When you flip a coin ten times and see heads, that is historical evidence. It is fully compatible with the Principal Principle. The PP states:
  $$C(\text{Heads} \mid \text{Chance}(\text{Heads}) = 0.5 \ \& \ \text{Admissible Evidence}) = 0.5$$

  If you *know for a fact* that the objective chance is 0.5, then seeing ten heads in a row is just a low-probability streak (1 in 1024). It does not rationally compel you to change your credence in the *next* flip, because the chance parameter (0.5) is stipulated as fixed in that conditional. To change your credence in the next flip based on that data would be the Gambler's Fallacy.

  **Where the Bayesian Updating Actually Happens**
  The confusion comes from conflating two different levels of belief, which is what your advisor meant by "conflating levels."

  1.  **Credence in the Outcome (given a Chance Hypothesis):** This is what the PP governs. If you are certain the chance is 0.5, your credence in Heads is 0.5, regardless of past streaks. PP applies here.
  2.  **Credence in the Chance Hypthesis itself:** This is where Bayesian updating lives. In the real world, you rarely *know* the objective chance with certainty. You have a credence distribution over various chance hypotheses (e.g., 50% credence the coin is fair, 50% credence it is biased).

  When you see ten heads, you do not violate the PP by updating your credence in the *next* flip. Instead, you use Bayes' Theorem to update your credence *that the chance is 0.5*. You lower your confidence in the "Fair Coin" hypothesis and raise your confidence in the "Biased Coin" hypothesis. Once you have updated your credence in the chance hypothesis, you apply the PP to the *new* most-likely chance value.

  The PP is a constraint on how credence relates to chance *at a time*; it is not a prohibition on learning what the chance *is* over time.

  **Does the Metaphysics of Chance Matter?**
  Not for this specific logical point. Whether chances are Propensities or Humean Best Systems, the structural role of the PP remains the same regarding admissibility.

  *   **Propensity:** Past data informs you about the physical property. The property itself doesn't change based on past flips, so your credence in the property updates.
  *   **Humean:** Chances are summaries of the total history. While future data can "undermine" current chance assignments (a problem Lewis acknowledged), *past* data is still admissible evidence used to determine which system of laws is best.

  In neither case does the PP forbid updating on past frequencies. In both cases, the updating occurs at the level of inferring the chance, not overriding the chance once known.

  **Recommendation for Your Chapter**
  Do not argue that PP is anti-Bayesian. The literature overwhelmingly rejects this, and you will be fighting a losing battle against the standard interpretation that PP is a *bridge principle* designed to fit *within* Bayesianism.

  Instead, pivot your argument to the **epistemic access problem**. The real tension isn't that PP blocks updating; it's that PP assumes we can have credences in chance propositions, but it doesn't explain *how* we infer those chances from frequencies without circularity.
  *   **Stronger Argument:** Argue that while PP is logically consistent with Bayesianism, it leaves the *inference to chance* under-specified. If admissible evidence includes frequencies, how do we map frequencies to chances without already presupposing the PP? This is a more fertile ground for a dissertation critique than claiming PP forbids conditioning on data.

  **Summary**
  1.  **Is PP anti-Bayesian?** No.
  2.  **Is your application of admissibility wrong?** Yes. Past data is admissible.
  3.  **Does metaphysics change this?** No.
  4.  **Action:** Shift your critique from "PP blocks updating" to "PP fails to explain how we update our beliefs *about* chances."
