prompt: |-
  In a reading group on Anscombe's protest against Oxford giving Truman an honorary degree, one member keeps shutting down every discussion with the same line: *the deliberate killing of the innocent is never permissible*, and that is supposedly all there is to say about Hiroshima. I think it's doing about four jobs at once and I want the menu, not one of them explained.

  Separate the precise claims that sentence could be making — about who counts as innocent (non-combatant? morally blameless? not currently attacking anyone? not liable for some reason other than fault?), about what deliberate covers (intended as an end, as a means, merely foreseen, accepted as a side effect, risked because the upside is huge), about whether it's a rule about acts or about what sort of person one turns into and what a community can afterwards avow, and about whether it's absolute or just a very heavy presumption. For each, say whether it's a platitude, a substantive thesis someone could deny, or something that quietly begs the question, and whether it actually gets him his conclusion about Truman or only looks like it does.

  Two cases where I got lost: a night strike on a munitions plant whose workers are all asleep and so not attacking anyone, though the plant is what keeps the war running; and a crew that aims at the plant, gets blown off course by wind, and kills a schoolfull of children — same deaths, no intention of them. Plus a case I made up: Truman is credibly told the bombs will end the war, but the same report says a demonstration detonation over an empty bay would probably work too, and he picks the city because if the demonstration failed he'd be blamed for the extra months of fighting. Is that deliberating about the deaths, or only about his career, and does it matter which?

  Last thing: someone said the whole argument rests on a forecast, and since the forecast was uncertain, Anscombe should've been uncertain too. I think that's a bad argument but can't say why — what would the good version of that worry look like, and does it cut against her or against Truman?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group discussing G.E.M. Anscombe's protest against Oxford awarding Harry Truman an honorary degree (1956).
      *   **Problem:** One member keeps shutting down discussion with the slogan: *"The deliberate killing of the innocent is never permissible."*
      *   **Task:** Deconstruct this slogan into its component claims (the "menu").
      *   **Specific Dimensions to Cover:**
          1.  Who counts as "innocent"?
          2.  What does "deliberate" cover (intention vs. foresight)?
          3.  Is it a rule about acts, character, or communal avowal?
          4.  Is it absolute or a heavy presumption?
      *   **Evaluation for Each:** Is it a platitude, a substantive thesis (deniable), or question-begging? Does it actually secure the conclusion about Truman?
      *   **Specific Cases to Address:**
          1.  Night strike on munitions plant (workers asleep/not attacking).
          2.  Accidental bombing of a school (same deaths, no intention).
          3.  Truman's choice: City vs. Demonstration (career risk vs. ending war).
      *   **Final Question:** The "forecast/uncertainty" objection (Anscombe should have been uncertain because the forecast was uncertain). Why is this bad? What's the good version? Who does it cut against?

  2.  **Deconstruct the Slogan ("The Menu"):**

      *   *Claim 1: The Definition of "Innocent".*
          *   Options: Non-combatants? Morally blameless? Not currently attacking? Not liable?
          *   Analysis: In Just War Theory (JWT), "innocent" usually means "non-combatant" or "not materially contributing to the threat." In Anscombe's Catholic natural law tradition, it often means those not engaged in unjust aggression.
          *   Status: Substantive thesis. Truman's defenders might argue Japanese industrial workers *were* liable. Anscombe argues civilians are innocent regardless of war economy contribution.
          *   Conclusion Impact: Crucial. If workers are "innocent," Hiroshima is murder. If they are "liable," it's collateral damage or legitimate targeting.

      *   *Claim 2: The Definition of "Deliberate" (Intention).*
          *   Options: End, Means, Foreseen Side Effect (Doctrines of Double Effect - DDE).
          *   Analysis: Anscombe is famous for *Intention*. "Deliberate" implies intended (as end or means). Merely foreseen but unintended is different (though Anscombe is skeptical of DDE if the "foreseen" is too massive).
          *   Status: Substantive thesis (and controversial). Utilitarians deny the moral relevance of intention vs. outcome.
          *   Conclusion Impact: Crucial. If Truman *intended* civilian death to terrorize Japan, it's forbidden. If he intended military destruction and *foresaw* civilian death, the slogan might not apply directly (though Anscombe might still object on proportionality).

      *   *Claim 3: The Nature of the Rule (Act vs. Character/Avowal).*
          *   Options: Act-utilitarian rule? Virtue ethics (what sort of person)? Political avowal (what can a community honor)?
          *   Analysis: Anscombe's protest was about *honoring* Truman. It's about the community's moral stance. It's also deontological (act-based prohibition).
          *   Status: Substantive. Consequentialists focus on outcomes. Anscombe focuses on the moral integrity of the agent and the community.
          *   Conclusion Impact: High. Even if the act was "necessary" (consequentialist view), honoring him corrupts the community's moral language.

      *   *Claim 4: Modality (Absolute vs. Presumption).*
          *   Options: Exceptionless norm? Prima facie duty?
          *   Analysis: Anscombe treats it as absolute (exceptionless). "Never permissible."
          *   Status: Substantive thesis (many deny absolutes in war).
          *   Conclusion Impact: Absolute. If it's just a presumption, Truman could override it for "greater good." If absolute, he cannot.

  3.  **Address the Specific Cases:**

      *   *Case 1: Night strike on munitions plant (workers asleep).*
          *   Issue: Are they "innocent" because they aren't currently attacking?
          *   Anscombe's view: They are likely legitimate targets *as workers* making weapons, but *civilians* generally aren't. However, if the plant is a military target, their death might be foreseen collateral damage, not "deliberate killing of the innocent" *if* they are considered liable due to contribution. But Anscombe tends to protect civilians broadly. The key is whether the *deaths* are the means to victory (terror) or a side effect of destroying capacity.
          *   Refinement: If the aim is to stop production, the workers' deaths are side effects. If the aim is to terrorize, it's deliberate.

      *   *Case 2: Accidental bombing of a school (wind).*
          *   Issue: Same deaths, no intention.
          *   Analysis: This tests the "Deliberate" claim. If the slogan holds, this act is *not* covered by the prohibition (though it might be negligent). It highlights that the moral wrongness for Anscombe lies in the *will*, not just the body count.
          *   Refinement: Distinguishes murder from tragedy/negligence.

      *   *Case 3: Truman's Choice (City vs. Demonstration).*
          *   Issue: Is choosing the city because a demo might fail (and he'd be blamed) deliberating about deaths?
          *   Analysis: This is about *intention*. If he chooses the city *to ensure* the war ends (via terror/destruction), the deaths are means/ends. If he chooses it to protect his career, that's a different vice (cowardice/selfishness), but the killing remains deliberate if he knows civilians will die to achieve the military goal.
          *   Refinement: The "career" motive doesn't sanitize the "military" intention. He still intends the destruction that kills them. The comparison with the demonstration shows he *could* have achieved the goal without killing, but chose not to. That makes the killing deliberate (chosen when avoidable).

  4.  **Address the "Forecast/Uncertainty" Objection:**

      *   *Objection:* Anscombe should have been uncertain because the forecast (bomb ends war) was uncertain.
      *   *Why it's bad:* It confuses *epistemic uncertainty* with *moral principle*. Even if there's a 10% chance it saves lives, you can't murder to gamble on that chance.
      *   *Good Version:* The worry isn't about Anscombe's certainty, but about *Truman's justification*. If Truman acted on a guess, he bears responsibility for the guess.
      *   *Who it cuts against:* It cuts against Truman. He acted on a prediction. If the prediction was shaky, his moral license is weaker. It doesn't make Anscombe's principle wobbly; it makes Truman's application of "necessity" wobbly.
      *   *Anscombe's stance:* She argues that even if it *did* end the war, the *method* (targeting civilians) was intrinsically evil. The outcome doesn't justify the means. So the forecast is irrelevant to the *prohibition*, though relevant to the *necessity* claim.

  5.  **Drafting the Response:**

      *   *Tone:* Philosophical, precise, analytical, respectful of Anscombe's rigor but clear about the distinctions.
      *   *Structure:*
          1.  Introduction (acknowledging the frustration with the slogan).
          2.  The Menu (4 dimensions).
          3.  The Cases (Munitions, Accident, Demonstration).
          4.  The Forecast/Uncertainty Objection.
      *   *Refining the "Menu":* Ensure I explicitly label each as Platitude/Substantive/Question-Begging and whether it gets the conclusion.
      *   *Refining the "Cases":* Make sure to link them back to the definitions in the Menu.
      *   *Refining the "Forecast":* Distinguish between the *principle* (means/ends) and the *factual premise* (necessity).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* the slogan begs the question? Yes, if "innocent" is defined as "those who shouldn't be killed," it's circular.
      *   *Check:* Did I handle the "career" case correctly? It's tricky. If he picks the city to save his career, is he intending the deaths? Yes, because he accepts them as the price of the career-saving victory. It shows the deaths weren't *strictly necessary* for the military goal (per the demo report), making them gratuitous.
      *   *Check:* Anscombe's specific view on "innocent." She focuses on "non-combatants." She rejects the idea that contributing to the war economy makes you liable to direct attack.
      *   *Check:* The "Forecast" point. The key is that Anscombe's argument is deontological. Uncertainty about consequences doesn't license violating a deontological constraint. The "good version" of the worry is about the *necessity* condition of Just War, not the *discrimination* condition.

  7.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the menu you asked for. The slogan *"The deliberate killing of the innocent is never permissible"* sounds like a single block of granite, but it is actually a composite of four distinct philosophical claims. Your group member is using the rhetorical force of the platitude parts to smuggle in the substantive parts.

  ### I. The Menu: Deconstructing the Slogan

  #### 1. The Definition of "Innocent"
  *   **The Claim:** A specific class of people is protected from direct attack.
  *   **The Options:**
      *   *(A) Non-combatants:* Anyone not in uniform or bearing arms.
      *   *(B) Morally Blameless:* Those not personally guilty of injustice.
      *   *(C) Non-Liable:* Those not currently posing a threat or materially contributing to one.
  *   **Status:** **Substantive Thesis.**
      *   Truman's defenders argue for *(C)*: Japanese industrial workers were part of the "war machine" and thus liable.
      *   Anscombe argues for *(A)*: Civilian status grants immunity regardless of economic contribution.
      *   **Does it get the conclusion?** Only if you accept Anscombe's definition *(A)*. If you accept *(C)*, the workers in Hiroshima were legitimate targets, and the slogan doesn't condemn Truman.
      *   **Begging the Question?** If "innocent" is defined as "those whom it is wrong to kill," the claim is circular. It must mean "non-combatant" to do work.

  #### 2. The Definition of "Deliberate" (Intention)
  *   **The Claim:** The moral prohibition hinges on the agent's intention, not just the outcome.
  *   **The Options:**
      *   *(A) Intended as End/Means:* The death is part of the plan to achieve victory.
      *   *(B) Merely Foreseen:* The death is a side effect of a legitimate act (Doctrine of Double Effect).
      *   *(C) Risked:* The death is accepted as a probable cost.
  *   **Status:** **Substantive Thesis (and Controversial).**
      *   Consequentialists deny this distinction entirely (outcomes matter, not intentions).
      *   Even among non-consequentialists, Anscombe is stricter than most. She suspects that if the "foreseen" slaughter is massive, the claim that it was "unintended" is a sham.
      *   **Does it get the conclusion?** Only if Truman *intended* the civilian deaths (e.g., to terrorize the government into surrender). If he intended only to destroy a military depot and the civilians died as a side effect, the slogan (strictly read) does not condemn him, though Anscombe might still condemn the *recklessness*.

  #### 3. The Nature of the Rule (Act vs. Avowal)
  *   **The Claim:** This is a constraint on action and social recognition.
  *   **The Options:**
      *   *(A) Act-Rule:* Do not perform this physical action.
      *   *(B) Character/Virtue:* Do not become the sort of man who does this.
      *   *(C) Communal Avowal:* A community must not honor this act, or it corrupts its own moral language.
  *   **Status:** **Substantive Thesis.**
      *   This is the core of Anscombe's *protest*. She isn't just saying Truman sinned; she is saying Oxford cannot *praise* him without lying.
      *   **Does it get the conclusion?** Yes, this is the strongest lever for the specific context (the honorary degree). Even if one argues the bomb was "necessary" (Act), Anscombe argues honoring it destroys the concept of justice (Avowal).

  #### 4. The Modality (Absolute vs. Presumption)
  *   **The Claim:** The weight of the prohibition.
  *   **The Options:**
      *   *(A) Exceptionless:* Never permissible, no matter the consequences.
      *   *(B) Heavy Presumption:* Can be overridden by catastrophic necessity.
  *   **Status:** **Substantive Thesis.**
      *   Most Just War theorists allow for exceptions (supreme emergency). Anscombe (following Catholic natural law) treats it as exceptionless.
      *   **Does it get the conclusion?** Absolutely. If it is only a presumption, Truman can argue "Ending the war saved more lives." If it is absolute, that calculation is irrelevant.
      *   **Begging the Question?** Often used as such. If you assert it is absolute without arguing *why* consequences don't matter, you are begging the question against a utilitarian.

  ---

  ### II. The Cases

  #### 1. The Night Strike on the Munitions Plant
  *   **The Scenario:** Workers are asleep (not attacking), but the plant sustains the war.
  *   **The Analysis:** This tests **Definition of Innocent (Liability)**.
      *   If "innocent" means "not currently attacking," the workers are innocent.
      *   If "innocent" means "not contributing to unjust aggression," they are liable.
      *   **Anscombe's View:** She generally holds that civilians remain innocent even if they make weapons. The *plant* is a legitimate target; the *workers* are not. Killing them deliberately is murder. Killing them as a foreseen side-effect of destroying the plant is permissible *only if* the military value is high enough (proportionality).
      *   **Verdict:** The slogan alone doesn't settle this. You need to know if the bomb was aimed at the *machines* (workers die as side effect) or the *workforce* (workers die as means to stop production).

  #### 2. The Wind-Blown Crew (Accidental School)
  *   **The Scenario:** Aimed at plant, wind kills children. Same deaths as deliberate bombing.
  *   **The Analysis:** This tests **Definition of Deliberate (Intention)**.
      *   **The Slogan's Verdict:** The slogan *does not condemn this act*. The killing was not deliberate.
      *   **Moral Difference:** For Anscombe, there is a massive moral difference. One is murder (corrupts the will); the other is tragedy or negligence (might require restitution, but doesn't stain the soul in the same way).
      *   **Why it matters:** It shows the slogan is about the *structure of the will*, not the body count. If your group member thinks the body count is all that matters, they are not actually using Anscombe's principle; they are a utilitarian wearing deontological clothes.

  #### 3. Truman's Choice (City vs. Demonstration)
  *   **The Scenario:** Demo might work, but Truman fears blame if it fails. Picks City to ensure victory/save career.
  *   **The Analysis:** This tests **Intention and Necessity**.
      *   **Is it deliberating about deaths?** Yes. By rejecting the demonstration, he rejects a path where the deaths *might not occur*. By choosing the city, he chooses the path where the deaths *will occur*.
      *   **Career vs. War:** It doesn't matter if his motive is career or military victory. In both cases, he has chosen a course of action that *requires* civilian death when a non-lethal alternative was available.
      *   **Verdict:** This makes the killing **Deliberate**. He intended the destruction of the city *as the means* to secure the outcome (victory/reputation) without the risk of the demonstration. The deaths are the price he chose to pay. This secures Anscombe's conclusion: he chose to kill the innocent when he didn't have to.

  ---

  ### III. The Forecast/Uncertainty Objection

  **The Objection:** *"The whole argument rests on a forecast (the bomb will end the war), and since the forecast was uncertain, Anscombe should've been uncertain too."*

  **Why it is a bad argument:**
  It confuses **epistemic uncertainty** (do we know the future?) with **moral permission** (are we allowed to kill?).
  Anscombe's argument is deontological, not consequentialist.
  *   **Consequentialist Logic:** "If you aren't sure it will save lives, you can't be sure it's justified."
  *   **Anscombe's Logic:** "Even if you are *certain* it will save lives, you are not allowed to murder."
  Therefore, her uncertainty about the forecast is irrelevant to her moral prohibition. She would oppose the bombing even if Truman proved it would definitely end the war tomorrow.

  **The Good Version of that Worry:**
  The valid version of this worry cuts against **Truman**, not Anscombe.
  *   **The Argument:** "Truman justified the bombing on the grounds of *military necessity* (it will end the war). Since the forecast was uncertain, the claim of *necessity* was uncertain. Therefore, he acted without a confirmed license."
  *   **Why it cuts against Truman:** In Just War Theory, you need *both* Discrimination (don't kill civilians) and Necessity (no other way). Anscombe attacks Discrimination. The "forecast" worry attacks Necessity.
  *   **Does it cut against Anscombe?** No. Anscombe argues that even if the Necessity condition *were* met (even if the forecast was 100% certain), the Discrimination condition was violated. Uncertainty about the forecast makes Truman's position *worse*, but it doesn't make Anscombe's position *wobbly*.

  **Summary for your group:**
  Tell your member that his slogan is a compressed argument, not a premise.
  1.  If "Innocent" includes industrial workers, he needs to argue that (Substantive).
  2.  If "Deliberate" includes foreseen side-effects, he needs to argue that (Substantive).
  3.  If the rule is absolute despite catastrophic consequences, he needs to argue that (Substantive).
  4.  If he means Oxford shouldn't *honor* the act regardless of its necessity, that is Anscombe's real point (Avowal).

  Until he unpacks which of these he means, he isn't answering the case; he is reciting a conclusion.
