          *   *Better angle:* If I have excellent 1st order evidence but misleading 2nd order evidence, KN says I don't know. But if I assert, and am challenged, I can produce the 1st order evidence. CW allows assertion because the *custody* of the reason is intact, whereas KN forbids it because the status (knowledge) is lost. This shows CW captures the *permissibility* better than KN.
      *   **Argument 2: Consensus Claims (The Spokesperson Case).**
          *   *Scenario:* Spokesperson reads a script. Hospital knows $p$. She doesn't.
          *   *KN:* Controversial. Some say she knows via testimony. Some say she doesn't.
          *   *CW:* Clear violation. She cannot trace the reasons. She is a megaphone, not a custodian.
          *   *Why this matters:* It explains the *wrongness* of the assertion when challenged. If asked "How do you know?", she fails. KN struggles to explain why it feels like a norm violation if she technically "knows" via testimony. CW explains the *dialogical failure*.
      *   **Argument 3: Moorean Paradoxes.**
          *   *Case A:* "p, but I don't know p." (Bad).
          *   *Case B:* "p, but I might be wrong." (Okay).
          *   *KN:* Explains A (asserting implies knowing). Struggles with B (if asserting implies knowing, why is admitting fallibility okay?).
          *   *CW:* Asserting implies "I can defend this." "I don't know" = "I cannot defend this" (Contradiction). "I might be wrong" = "My defense is strong but not infallible" (Consistent). CW handles the nuance of *defeasibility* better than the binary of knowledge.
      *   **Objection 1: Justified Belief + Memory.**
