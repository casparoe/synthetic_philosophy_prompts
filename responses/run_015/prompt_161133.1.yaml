          3.  Asymmetry between "p, but I don't know p" (Moore-paradoxical) and "p, but I might be wrong" (acceptable).
      *   **Required Objections to Address:**
          1.  CW is just Justified Belief + Memory.
          2.  CW forbids most everyday testimony (too restrictive).
      *   **Tone/Style:** Definite line (take a stand), American English, suitable for a US journal (philosophical rigor, clear structure).
      *   **Constraint:** Don't just lay out options; commit to where CW wins and where it strains.

  2.  **Deconstruct "Custodial Warrant" (CW):**
      *   It's an internalist-leaning norm. It emphasizes *accessibility* of reasons to the asserter.
      *   It distinguishes between *having* knowledge/warrant and *holding* warrant in a way that allows for defense.
      *   It prioritizes the dialogical function of assertion (giving reasons) over the mere transmission of true belief.

  3.  **Drafting - Section by Section:**

