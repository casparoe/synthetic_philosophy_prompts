answer: |-
  **The Case for Custodial Warrant: Assertion as Accountability**

  The Knowledge Norm (KN) has dominated the literature on assertion for decades. It holds that one must assert $p$ only if one knows $p$. While KN captures the intuitive link between truth and speech, it treats assertion primarily as a vehicle for transmitting epistemic status. This misses the essentially dialogical nature of assertion. When we assert, we do not merely dump information; we undertake a responsibility to answer for it.

  I argue for **Custodial Warrant (CW)**: *One may assert $p$ only if, were challenged, one could trace $p$ back through one's own reasons to whatever supports it.* On this view, the asserter must hold the warrant in custody, ready to hand it over, rather than merely pointing to a third party who holds it. CW outperforms KN because it aligns better with our intuitions about rationality in the face of defeaters, explains the impropriety of bureaucratic testimony, and resolves Moorean asymmetries that stump the knowledge norm.

  ### 1. Misleading Higher-Order Evidence
  Consider a speaker, S, who sees a cat on the mat (excellent first-order perceptual evidence). However, a trusted epistemic superior tells S that the room is filled with holographic projectors (misleading higher-order evidence).

  **The Knowledge Norm Verdict:** S does not know $p$. The higher-order evidence acts as a defeater. Therefore, KN forbids S from asserting "The cat is on the mat."
  **The Custodial Warrant Verdict:** S retains immediate access to the perceptual grounds. If challenged ("How do you know?"), S can say, "I see it right there." CW permits the assertion.

  CW wins here because KN is overly sensitive to external epistemic status at the cost of rational agency. S's first-order evidence remains intact; the defeater is misleading. Intuitively, S is rational to trust her eyes over the rumor of holograms. KN classifies this assertion as a norm violation because S lacks knowledge. CW correctly identifies that S remains in a position to *defend* the claim. The norm of assertion should track the speaker's ability to discharge their dialectical obligations, not their susceptibility to misleading meta-evidence. If S asserts, and is challenged, she can produce the very evidence that justifies her belief. KN punishes S for an external defeater that does not impair her actual capacity to provide reasons.

  ### 2. The Consensus Claim (The Spokesperson)
  Consider the hospital spokesperson who announces a diagnosis she does not understand and cannot defend, relying entirely on the medical team's authority. Contrast this with the friend holding the train timetable.

  **The Knowledge Norm Verdict:** KN struggles here. Proponents of KN often argue that the spokesperson *does* know $p$ via testimony from the doctors. If she knows, KN permits the assertion.
  **The Custodial Warrant Verdict:** The spokesperson violates CW. She cannot trace the diagnosis to the underlying medical data. She is a megaphone, not a custodian. The friend with the timetable satisfies CW because she can produce the schedule upon challenge.

  CW captures the specific wrongness of the spokesperson's position. Even if we grant she "knows" via testimony, there is a hollow quality to her assertion. If a reporter asks, "What specific biomarkers indicate this condition?", she must defer. She has asserted without holding the warrant. KN misses this nuance, treating her knowledge as equivalent to the doctor's. CW distinguishes between *having* a warrant (via testimony) and *holding* it (in custody). Assertion is an offer of assurance; the spokesperson offers assurance she cannot personally back up. CW explains why we feel she is overstepping, even if her statement is true and justified.

  ### 3. The Moorean Asymmetry
  We must account for the difference between:
  (A) "p, but I don't know p." (Paradoxical/Impermissible)
  (B) "p, but I might be wrong." (Permissible)

  **The Knowledge Norm:** KN explains (A) well (asserting implies knowing). It struggles with (B). If asserting implies representing oneself as knowing, admitting fallibility ("I might be wrong") should be just as paradoxical as admitting ignorance.
  **The Custodial Warrant:** CW resolves this cleanly.
  *   (A) violates CW because "I don't know" functions as an admission that one cannot trace the grounds sufficiently to meet the standard of knowledge. It is a refusal of custodial responsibility.
  *   (B) is consistent with CW. To say "I might be wrong" is to acknowledge that one's custody of the warrant is fallible, not that one lacks custody. CW requires that you *have* the grounds to hand over, not that those grounds be infallible.

  CW captures the nuance that assertion involves *responsibility for reasons*, not a claim to infallibility. (B) signals that the speaker holds the warrant but acknowledges its defeasibility. (A) signals the speaker lacks the warrant entirely. KN flattens this distinction; CW elucidates it.

  ### Addressing Objections

  **Objection 1: Is this just Justified Belief + Memory?**
  Critics will argue CW is merely the Justified Belief norm with an added condition that the speaker remembers their justification. If I have justified belief but forget why, I violate CW.

  **Reply:** This objection mistakes a dispositional capacity for an occurrent state. CW is not about currently rehearsing reasons; it is about the *ability to retrieve* them. However, the distinction matters. Standard Justified Belief norms allow for "forgotten evidence" cases (e.g., I believe the Battle of Hastings was 1066 because I learned it in school, even if I recall no specific book). CW is stricter: if you cannot, even in principle, trace the chain back (e.g., you realize your source was a guess), you violate the norm. CW is not JB + Memory; it is JB + *Accessibility*. This explains why "I read it somewhere" is often an unsatisfactory response to a challenge, whereas "Here is the study" satisfies the norm. CW demands that the speaker be an active node in the network of justification, not a passive storage unit.

  **Objection 2: The Testimony Objection (Too Restrictive)**
  The most serious charge is that CW forbids most everyday testimony. If I tell you "Paris is the capital of France," I often cannot trace the specific lesson where I learned it. CW seems to imply I shouldn't assert this. This makes the norm too demanding for ordinary conversation.

  **Reply:** I concede that CW is more restrictive than KN, but I argue this is a feature, not a bug. CW is the norm for *assertion as a speech act of accountability*. In low-stakes casual conversation, we operate on a relaxed default entitlement. However, when stakes rise, or when a challenge is issued, CW kicks in.
  Furthermore, we should not overstate the restriction. For most common knowledge, "I learned it in school" *is* tracing the ground. It identifies the source type. CW only forbids assertion when the chain is severed—when the speaker is merely repeating a rumor without knowing its origin or reliability.
  Does CW strain here? Yes. It places a burden on speakers to maintain epistemic hygiene. But this burden is exactly what is missing in our current epistemic environment of misinformation. The hospital spokesperson case shows why we need this burden. If CW forbids some casual chatter, it is because that chatter was never truly supported assertion to begin with; it was mere noise. CW wins on high-stakes and challenged assertions, even if it demands more of us in the grocery store.

  ### Conclusion
  The Knowledge Norm focuses on the *state* of the speaker. Custodial Warrant focuses on the *relationship* between the speaker and the audience. By requiring that speakers hold their grounds in custody, CW explains why we can assert in the face of misleading defeaters, why bureaucratic testimony feels empty, and why admitting fallibility is acceptable while admitting ignorance is not. It is a stricter norm, but it is the one required for a community of inquiry that values accountability over mere information transfer.
