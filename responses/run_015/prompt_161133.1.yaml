      *   *Wait, one nuance:* The prompt says "argue that custodial warrant beats the knowledge norm on..." So I need to show CW provides a better explanation or verdict in these cases.
      *   *HOE:* KN says "Don't assert." CW says "Assert if you can defend." Which is right? Intuitively, if my eyes work, I should trust them over the expert. So CW aligns with intuition better.
