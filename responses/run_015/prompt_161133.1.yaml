          *   *Response:* JB is static; CW is dynamic/dispositional. JB allows "I forgot why, but I'm sure I had a reason." CW forbids this. If you can't produce the chain, you violate the norm. This explains why "I read it somewhere" is often insufficient compared to "Here is the data."
