answer: |-
  Good morning. To the students being recognized today, to the parents who support them, and to the faculty who guide us—thank you for welcoming me.

  We are gathered to celebrate ethics and service. Naturally, this invites a question: How much service is enough? How ethical must we be? In our culture, we often treat goodness like a score in a video game: higher is always better. If saving one person is good, saving ten is better. If volunteering ten hours is virtuous, volunteering forty must be virtuous times four.

  But I want to suggest a different way to think about the architecture of a good life. I want to talk about **moral bandwidth**.

  Imagine your life as a network. You have a finite amount of throughput—attention, emotional energy, time. This is your bandwidth. Like any network, you have limits. You can only process so much data before latency sets in, before packets start dropping, before the system slows down.

  When we talk about moral sainthood, we are talking about a specific configuration of this network. We are talking about dedicating nearly all available bandwidth to moral demands. Every cycle of processing power is assigned to alleviating suffering, fighting injustice, or caring for others. On paper, this looks like perfection. But in practice, a life configured for maximal moral throughput often suffers from severe congestion.

  Think of it like an over-provisioned server. If you dedicate every resource to a single task, ignoring background processes and maintenance, the server doesn't become infinitely efficient. It crashes under its own load.

  This is the problem with the ideal of the moral saint. It isn't that saints are bad people. They are not blameworthy. The problem is that a life optimized solely for moral output crowds out the other essential functions that make a human life desirable. When moral bandwidth is maxed out, there is no throughput left for art, for humor, for deep friendships that aren't based on duty, for the pursuit of personal excellence in things that don't save lives but do save souls.

  If you spend every weekend volunteering, you might maximize your moral output. But if you never read a poem, never learn to play an instrument, never sit quietly with a friend just to laugh, your life suffers from packet loss. You lose the data that makes you who you are. And ironically, a life that lacks joy, curiosity, and personal passion often has less to offer the world in the long run. Burnout is not a virtue; it is a system failure.

  I know there are ethics teachers in the room who recognize the philosophical weight of this. This isn't an argument for selfishness. It is an argument against maximization. It is the claim that the goal of life is not to maximize one variable at the expense of all others, but to achieve optimal allocation across domains.

  For the students and parents here, I want this to be comforting. You do not need to be a saint. You do not need to feel guilty because you cannot solve every problem you see on the news. Your bandwidth is finite. That is not a moral failing; it is a structural fact of being human.

  However, this framing does not let us off the hook. Recognizing finite bandwidth does not mean we can go offline. There is a minimum viable product for decency. There is a baseline uptime required to be a member of a community. We must allocate enough bandwidth to honesty, to kindness, to justice, to ensure we are not harming others and are doing our fair share to help. We cannot throttle our moral connection to zero.

  The challenge, then, is load balancing. It is asking yourself: Am I dedicating enough resources to be a good citizen, a good friend, a good family member? And am I leaving enough room to be a whole person?

  A well-rounded life is not a distraction from morality; it is the infrastructure that sustains it. You cannot pour from an empty cup, and you cannot transmit data on a crashed network.

  So, as we recognize the service performed this year, let us celebrate not just the volume of work done, but the wisdom with which it was integrated into a life. Let us aim not for the crash of sainthood, but for the stability of wisdom. Let us manage our moral bandwidth wisely, so that we can serve others effectively without losing ourselves completely.

  Thank you.
