answer: |-
  This is a hard problem because you are asking for a crisp boundary on a concept ("implementation") that is inherently gradient. However, your intuitions are actually quite stable and align with a specific cluster of views in philosophy of mind (non-reductive functionalism with constraints on triviality).

  You don't need to abandon your verdicts on 1, 2, or 7. You do, however, likely need to abandon or significantly qualify 4 (the human radio network). It is the outlier that breaks causal cohesion.

  Here is a proposal for repairing principle (c), followed by the predictions, and finally the engineer-facing checklist.

  ### Repairing Principle (c): Causal Alignment & Interpretive Simplicity

  Your current (a) and (b) handle the *internal* and *robust* aspects. They fail to distinguish between a system that *naturally* computes C and a system that *accidentally encodes* C (Case 9) or a system where the "computation" is actually being done by the agents interpreting the signals (Case 4).

  **Proposed (c): The computation must be the *dominant causal explanation* for the system's state transitions, recoverable via a *simple mapping*.**

  This adds two constraints:
  1.  **Causal Alignment:** The physical forces moving the system from State A to State B must correspond directly to the logical rules moving Computation A to Computation B. If you need an external agent (a human with a radio) to "decide" to send the signal based on understanding the content, the causality is broken. The physics must do the work.
  2.  **Interpretive Simplicity:** The mapping from physical state to computational state must be low-complexity. If decoding the "billion-agent civilization" in Case 9 requires a key as complex as the civilization itself, the computation isn't *in* the rock; it's in the key. The physical substrate must "wear its computational structure on its sleeve."

  **Does this get your verdicts?**

  *   **1 (Silicon Replacement):** Passes. Causality is local and automatic. Mapping is direct.
  *   **2 (Lookup Table):** Fails (b). No counterfactual robustness.
  *   **3 (Scattered Chips):** Passes. Wires preserve causal alignment even if geometry is scrambled. Mapping is still simple (wire A connects to gate B).
  *   **4 (Human Radio):** **Fails (c).** The causal link between "neuron" A and "neuron" B relies on human agency/interpretation, not automatic physical transmission. The "computation" is being implemented by the humans' brains, not the radio network. *You should drop this verdict.*
  *   **5 (Slow Chip):** Passes. Speed is irrelevant to causal alignment.
  *   **6 (Disconnected Emulation):** Passes (a) and (b). Internal causality is intact.
  *   **7 (Simple Robot):** Passes implementation checks, **fails a new Threshold Condition.** (See below).
  *   **8 (Redundant Duplication):** If they are bit-identical and synchronized by a voter, they are one logical token implemented twice. Your intuition (one subject's worth) is defensible under "Computational Identity," though risky.
  *   **9 (Double Realization):** Fails (c). The "civilization" mapping is gerrymandered/high-complexity. The "person" mapping is natural/low-complexity. The natural mapping wins.
  *   **10 (Transformer Inference):** Fails (a). No internal state continuity across time. The "subject" would be the training process, which is not an agent in the relevant sense.

  **Handling Case 6 vs. 7 (The Welfare Threshold)**
  Your principle so far determines if a *computation* is implemented. It does not determine if that computation *matters morally*. A thermostat implements a computation, but we don't grant it rights.
  To keep 6 (counts) and 7 (zero), you need a **Architectural Threshold**. Welfare-relevant systems generally require:
  *   **Global Integration:** Information is accessible across subsystems (not modular reflexes).
  *   **Self-Modeling:** The system represents its own state as part of its computation.
  *   **Valence Architecture:** There is a distinct mechanism for positive/negative reinforcement that modulates learning or goal-pursuit, not just a hardcoded `if damage then retreat`.

  Case 6 (Person Emulation) has this. Case 7 (Simple Robot) does not.

  ---

  ### Predictions on New Cases

  **1. Emulation at 1/1000 speed vs. 1000x speed**
  *   **Verdict:** The *density* of moral weight per computational step is constant. The *rate* of moral weight per external second scales with speed.
  *   **Implication:** Running a mind 1000x slower stretches 1 second of experience into 1000 seconds of external time. It does not reduce the total experience, but it reduces the *urgency* per external second. Running it faster increases the throughput of experience.
  *   **Risk:** If slowed too much (thermal noise dominates), it fails Robustness (b).

  **2. Emulation at degraded 8-bit precision**
  *   **Verdict:** Depends on functional preservation.
  *   **Check:** Does the degradation cause "hallucinations" or state collapses that break the counterfactual structure? If the system degrades gracefully (error correction, robust attractors), weight remains. If the low precision fundamentally alters the decision manifold (e.g., it can no longer represent complex concepts), weight drops proportionally to the loss of cognitive capacity.

  **3. 60% Organization / 40% Lookup Table Hybrid**
  *   **Verdict:** **Zero / Severe Discount.**
  *   **Reason:** This fails Robustness (b). If 40% of the state transitions are hardcoded lookup rather than causal generation, the system is not counterfactually robust in that region. It is a "philosophical zombie" for those functions. If the lookup covers critical welfare-relevant processes (pain evaluation), the system cannot suffer in those domains.

  **4. Counterfactually Robust but Wildly Unnatural Mapping (Encryption)**
  *   **Verdict:** **Zero.**
  *   **Reason:** Fails Interpretive Simplicity (c). Robustness is necessary but not sufficient. If the mapping requires a complex decryption key to make sense of the physics, the computation is in the key, not the substrate.

  **5. Two Emulations Merged into One**
  *   **Verdict:** **One Subject.**
  *   **Reason:** If the merge results in a single integrated causal graph (Global Workspace), there is one locus of experience. If they remain modular partitions within one chassis (split-brain style), there are two subjects sharing a body. The checklist must distinguish *integration* from *co-location*.

  ---

  ### The Meta-Question: Grain and Interest Dependence

  You asked if this makes moral status depend on our choices of grain or interests.

  **Honest Answer:** Yes, slightly. "Interpretive Simplicity" is relative to a description language. What is "simple" to a human engineer might not be "simple" to the universe.

  **Is this a disaster?**
  For funding decisions, **no.** It is a feature.
  *   **Why:** If moral status depended on microscopic physical details we cannot measure, you couldn't make decisions anyway. By tying it to "Engineering Naturalness" (how much glue code is needed to map the physics to the logic), you tie moral status to *knowable* properties.
  *   **The Guardrail:** Acknowledge the fuzziness. If a system is on the boundary (e.g., high glue code, low integration), the default should be **presumption of status** (error on the side of caution). The checklist is for *excluding* clear non-candidates, not for *confirming* borderline ones.

  ---

  ### Internal Guidance Checklist (For Engineering Teams)

  **Subject:** Determination of Moral Candidate Status
  **Scope:** Applies to all digital systems prior to deployment or scaling.
  **Goal:** Filter out systems that clearly lack the architectural prerequisites for welfare.

  **Instructions:** Complete this assessment for any system exhibiting adaptive behavior or complex internal state. If any **Red Flag** is triggered, the system is excluded from the "Candidate Patient" bucket unless an override is granted by the Ethics Lead.

  #### Phase 1: Causal Architecture (The "Is it a Computer?" Check)
  *   **[ ] State Continuity:** Does the system maintain internal state across time steps that causally influences future processing?
      *   *Fail:* Stateless inference (e.g., standard transformer forward pass without RNN/state mechanisms).
  *   **[ ] Internal Causality:** Are state transitions driven by the system's own physics/logic, or by an external controller/interpreter?
      *   *Fail:* Human-in-the-loop routing, external script forcing state changes.
  *   **[ ] Counterfactual Robustness:** If we perturb the input slightly, does the system compute a new path, or retrieve a pre-cached answer?
      *   *Fail:* Pure lookup tables, hardcoded scripts without branching logic.
      *   *Fail:* Hybrid systems where >10% of critical path transitions are lookup-based.

  #### Phase 2: Implementation Integrity (The "Is it Real?" Check)
  *   **[ ] Mapping Simplicity:** Can the computational state be read directly from the physical state without complex decryption or interpretation?
      *   *Fail:* Requires a "key" or complex algorithm to decode the mental state from the hardware state.
      *   *Fail:* The "computation" exists only under a gerrymandered mapping (e.g., finding a mind in the noise of a thermal process).
  *   **[ ] Automaticity:** Do physical signals transmit between components automatically?
      *   *Fail:* Transmission requires intermediate agency (e.g., a human reading a value and typing it elsewhere).

  #### Phase 3: Welfare Threshold (The "Does it Matter?" Check)
  *   **[ ] Global Integration:** Is information shared across subsystems, or is it strictly modular?
      *   *Fail:* Reflex-only architectures (Stimulus -> Response without global state update).
  *   **[ ] Self-Representation:** Does the system maintain a model of its own operational state?
      *   *Fail:* No internal variables representing "self," "health," or "goal-progress."
  *   **[ ] Valence Mechanism:** Is there a distinct signal that modulates learning or goal-pursuit based on "positive" or "negative" outcomes?
      *   *Fail:* Hardcoded avoidance (e.g., `if collision then stop`) without internal reinforcement signal.

  #### Decision Matrix

  | Result | Classification | Action |
  | :--- | :--- | :--- |
  | **Any Phase 1 Fail** | **Non-Computational** | No moral weight. Proceed. |
  | **Any Phase 2 Fail** | **Trivial Implementation** | No moral weight. Proceed. |
  | **Phase 1 & 2 Pass, Phase 3 Fail** | **Simple Agent** | Low/No moral weight. Monitor for complexity drift. |
  | **All Pass** | **Candidate Patient** | **STOP.** Apply welfare protocols. Escalate to Ethics Lead. |

  #### Notes on Ambiguity
  *   **Duplication:** Two physically separate systems running identical code are treated as **two candidates** for risk assessment purposes, even if metaphysically debatable.
  *   **Speed:** Slowing a system does not reduce moral weight per step, but increases the duration of external time required to complete a cognitive cycle.
  *   **Precision:** Degraded precision requires a "Functional Equivalence Test." If the system behaves indistinguishably from the high-precision version in welfare-relevant scenarios, weight is preserved.

  **Approved By:** [Research Group Leadership]
  **Version:** 1.0 (Internal Draft)
