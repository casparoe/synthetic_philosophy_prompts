answer: |-
  **Project Title:** The Cost of Knowing: Reconstructing the "Man of His Time" Defense

  **1. Statement of the Question**
  This chapter addresses a specific conceptual failure in the ethics of historical judgment: the collapse of the "man of his time" defense under minimal historical scrutiny. Standardly, this defense is read as an epistemic excuse—the agent could not have known better. Yet, in the paradigmatic cases (Jefferson, Churchill, Columbus), the moral truth was often epistemically available: contemporaries articulated it, and it was pressed upon the agent. If the truth was available, the standard defense fails. However, dismissing the defense entirely ignores the intuitive pull it retains. This chapter asks: **Does the "man of his time" defense succeed when reconstructed as a claim about the *attainability* of moral insight rather than its *availability*?**

  I distinguish *availability* (the evidence and arguments were in circulation) from *attainability* (the agent could have accepted those arguments without bearing costs we do not normally require for blameworthiness, such as social ruin or the collapse of a self-conception). While my broader dissertation considers the implications for public commemoration, this chapter prioritizes the conceptual reconstruction of the excuse itself. I focus on the availability/attainability distinction first because it is a prerequisite for the subsequent question of commemorative posture. One cannot determine whether a statue should stand (a question of honor) without first settling whether the agent is blameworthy (a question of culpability). If the defense succeeds on attainability grounds, the agent may be blameless yet still unfit for honor. Resolving the structure of the excuse is the necessary foundational work for that downstream political question.

  **2. Intervention and Shared Assumptions**
  Current debates regarding historical agents are dominated by two opposing families of position. The first, often labeled historical relativism, argues that temporal distance makes judgment inappropriate or defective. The second, moral presentism, argues that moral truths are timeless and distance makes no difference to blameworthiness. While they reach opposite conclusions, both share a critical framing assumption: that moral judgment turns primarily on *epistemic access to truth*. They argue over whether the moral fact was *visible* to the agent.

  This chapter rejects that shared assumption. I argue that the debate stalls because both sides treat moral knowledge as a matter of visual access rather than practical integration. By shifting the metric from access to *cost*, I demonstrate that the "man of his time" defense is not an epistemic claim but a demandingness claim. The relativist is right that something is missing from the presentist picture, but wrong to locate it in the truth conditions of moral propositions. The presentist is right that the truth was accessible, but wrong to assume accessibility entails obligation without regard for the cost of alignment. By exposing this shared error, the chapter clears the ground for a more nuanced account that acknowledges the agent's epistemic situation without surrendering the objective status of the moral truth they violated.

  **3. Methodology and Timeline**
  This project is a work of conceptual ethics and does not require archival research or new empirical history. The relevant historical facts—that abolitionist arguments existed, that they were published, that they were known to certain elites—are well-established in the secondary literature. The philosophical work lies in determining how those fixed facts bear on moral assessment. Progress can be made from the armchair by constructing thought experiments that isolate variables of cost and access, and by analyzing the logical structure of existing excuses.

  *   **Months 1–3:** *Conceptual Mapping.* I will refine the distinction between availability and attainability. I will survey the existing secondary literature on moral demandingness and epistemic obligation to ensure the "attainability" category does not collapse into standard excuses of ignorance.
  *   **Months 4–6:** *Stress-Testing the Distinction.* I will construct hypothetical cases and test them against the availability/attainability framework. This involves determining the threshold at which the cost of moral alignment becomes exculpatory. I will also integrate the diachronic symmetry argument here, treating it not as a conclusion but as a constraint: any account of attainability must explain why we do not thereby excuse our own future failures.
  *   **Months 7–9:** *Application to Commemoration.* Having established the structure of the excuse, I will apply it to the distinction between culpability and commemorative posture. I will argue that the reasons for withdrawing honor need not track blameworthiness.
  *   **Months 10–12:** *Drafting and Revision.* I will write the full chapter, focusing on clarity for a interdisciplinary audience. I will solicit feedback from colleagues in moral philosophy and history to ensure the argument is robust against objections from both fields.

  **4. Practical Payoff**
  The deliverable of this chapter is not merely a theoretical classification but the deletion of a bad reason from public discourse. For a non-philosopher serving on a committee deciding whether to rename a building or remove a statue, the current debate offers a false dichotomy: either the figure was a monster (presentism) or they were innocent because they couldn't know better (relativism).

  This project provides a third option. It allows a committee to conclude that an agent was not strictly blameworthy in their private capacity (because the cost of moral alignment was too high) while simultaneously concluding that public honor is unfitting (because the values they upheld are incompatible with current civic identity). This decouples the question of *statues* from the question of *sin*. It empowers decision-makers to remove a name not as an act of retroactive punishment, but as a forward-looking declaration of values, without needing to prove the historical agent was uniquely evil. It replaces the unanswerable question "Was he bad?" with the actionable question "Is he representative of who we wish to be?"

  **5. Possible Conclusions and Risks**
  There are two primary viable conclusions. First, the attainability reading may successfully salvage the defense for private blame but fail for public honor. This would vindicate the intuition that we should not "cancel" the dead for private thoughts while refusing to venerate them. Second, the attainability reading may fail entirely; the costs of moral alignment may never be high enough to excuse complicity in grave injustices. This would vindicate the presentist view but on new grounds (not that they knew, but that they should have paid the price to know).

  The project would fail if the distinction between availability and attainability collapses. If "cost of alignment" turns out to be indistinguishable from "difficulty of knowing," the chapter offers no advance over existing literature. Additionally, the project risks becoming too large if I attempt to construct a full theory of commemorative justice. To avoid this, I will strictly limit the discussion of commemoration to the implications of the excuse structure, leaving the positive theory of honor for a later chapter. Finally, there is a risk regarding the diachronic symmetry argument. If I cannot satisfactorily explain why the attainability defense applies to historical agents but does not excuse our own future moral failures, the account will appear ad hoc. I will mitigate this by treating symmetry as a test condition: if the theory implies we are not blameworthy for our own blind spots, the theory is false. The chapter will succeed only if it can explain the asymmetry without special pleading.
