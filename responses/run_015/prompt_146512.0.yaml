answer: |-
  **Mark: 13/20**

  **General Comments:**
  This is a clearly written script that demonstrates a strong grasp of the broader dialectic Strawson is intervening in (Optimist vs. Pessimist). Your introduction to the reactive/objective stance is accurate and well-expressed. However, the mark is limited by a fundamental misunderstanding of the distinction between *excuse* and *exemption* in Part (a), which leads to internal inconsistencies in Part (b). You have treated the distinction as one of *duration* (single act vs. period of time), whereas Strawson treats it as a distinction regarding the *status of the agent* (quality of agency vs. quality of intention).

  **Point-by-Point Feedback:**

  **Part (a): Strawson's Distinction & Determinism**
  *   **What is right:** Your account of the participant vs. objective stance is excellent. You correctly identify that Strawson rejects the demand for an external rationale for our practices. The summary of the Optimist/Pessimist debate is accurate.
  *   **What is wrong (Critical):** You define exemption as "an excuse stretched over a period of someone's life rather than a single act." This is incorrect. For Strawson, an **excuse** admits the agent is a responsible participant but denies that the specific act manifested ill-will (e.g., accident, coercion). An **exemption** denies that the agent is a fully responsible participant at all due to psychological capacity (e.g., childhood, severe mental derangement). It is not about how *long* the behaviour lasted, but about the *agent's standing* in the moral community during that time.
  *   **Nuance on Determinism:** You write that the practice is "simply beyond rational assessment." This is slightly too strong. Strawson argues it does not require *external* justification (it is self-justifying as part of human nature), but he does not claim our specific applications of it are immune to rational correction.

  **Part (b)(i): Application to the Case**
  *   **Conflation:** Because of the error in Part (a), your classification here is shaky. You argue it is exemption because it was a "neurochemical cause" and "couldn't help it." While plausible, your reasoning relies on the idea that the *period* of drug use suspends the stance. A stronger argument would focus on whether the drug compromised his *capacity* for normal adult relationships (exemption) or merely distorted his *intentions* while capacity remained (excuse).
  *   **Missing Step:** You state that accepting the causal story commits us to the objective attitude. Strawson is careful to say that even if determinism is true globally, we cannot *sustain* the objective stance locally without significant human cost. You move too quickly from "medical cause" to "objective attitude required."

  **Part (b)(ii): The Sister's Resentment**
  *   **Internal Inconsistency:** In Part (a), you argue reactive attitudes are "beyond rational assessment" and "no question... can even arise." In Part (b), you conclude the sister's resentment is "irrational" and she has a duty to "work on getting rid of it." These positions contradict. If the attitudes are natural facts beyond rational justification (Part a), you cannot normatively prescribe that she *ought* to eliminate them as if they were cognitive errors (Part b).
  *   **Strawson's View:** Strawson would likely say the resentment is *inappropriate* given the exemption (the target is not a proper object), but he would also acknowledge the human difficulty of suppressing reactive attitudes. He emphasizes the *cost* of the objective stance; advising her to simply "update her beliefs" ignores Strawson's point that these attitudes are constitutive of relationships, not just beliefs to be updated.

  **Specific Corrections for Feedback Form:**

  *   **On Excuse vs. Exemption:** "You have defined exemption as a temporal extension of excuse. For Strawson, the distinction is categorical: excuses accept the agent's status but deny ill-will in the act; exemptions deny the agent's status/capacity for normal adult relationships entirely."
  *   **On Rationality of Attitudes:** "There is a tension between Part (a) and (b). In (a) you claim reactive attitudes are beyond rational assessment; in (b) you label the sister's resentment 'irrational' and prescribe its removal. Strawson's naturalism suggests we cannot simply reason ourselves out of these attitudes at will."
  *   **On the Objective Stance:** "You suggest the medical explanation *commits* us to the objective stance. Strawson argues that while we *can* adopt the objective stance in cases of exemption, doing so involves a modification of relationships that is not merely a logical switch but a human adjustment with emotional costs."

  **Summary for the Student:**
  "You have a strong handle on Strawson's meta-ethical framework, but your understanding of the specific mechanics of responsibility (excuse/exemption) needs correction. Review the text on 'psychological abnormality' vs. 'unintentional action.' Also, ensure your conclusions in Part (b) do not contradict your premises in Part (a) regarding the rationality of emotions."
