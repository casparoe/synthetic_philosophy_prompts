  *Refining the "Better Analogy":* The "Dream" is traditional. But the user asked for computation/physics. A "Serverless Architecture" or "Event-Driven Architecture" where the trigger exists but the execution environment is external? No, the **Frame-Buffer** is best because it addresses the *discreteness* of time, which is central to Ash'arite atomism.

